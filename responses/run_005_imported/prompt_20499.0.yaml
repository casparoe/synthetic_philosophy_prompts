answer: |-
  You're wrestling with one of Wittgenstein's densest and most fascinating concepts—and your confusion is **completely warranted**. Hinges are deliberately paradoxical: they look like propositions but function like the rules of the game. Let's break down the passage and its implications for your "immunity to facts" angle.

  ### Core Walkthrough of Remarks 341-343
  1. **"Propositions exempt from doubt"**:  
     Hinges aren't just *un*doubted; they're *undoubtable within a framework*. To doubt them would dismantle the entire system of inquiry. Example: "The Earth exists" isn't a belief you affirm—it's the stage on which doubting *other* things (e.g., "Is this soil fertile?") becomes possible.  

  2. **"It belongs to the logic of our scientific investigations"**:  
     This isn't about psychology ("we're too lazy to doubt everything") but **logical necessity**. Hinges are the scaffolding for *any* rational activity. If you tried to doubt *all* hinges simultaneously (e.g., "Do my senses deceive me? Does logic work? Is language reliable?"), you couldn't formulate a coherent question, much less investigate anything.  

  3. **"We are forced to rest content with assumption" vs. Wittgenstein's view**:  
     He rejects the idea that hinges are provisional assumptions. Assumptions *can* be doubted or verified. Hinges *can't*—they're the **preconditions** for verification itself. Like the rules of chess: you don't "assume" pawns move forward; you accept it to play the game.  

  4. **The "must" in "hinges must stay put"**:  
     This is **transcendental necessity** (Kantian vibes). It's not logical ("A must imply B") or grammatical ("verbs must agree with subjects"), but **pragmatic-constitutive**: for doubt/knowledge to *function* as human practices, something must be immune to doubt. Without fixed hinges, the "door" of inquiry doesn't turn—it falls off.  

  5. **Are hinges "beliefs"?**:  
     **No—and this is crucial.** Wittgenstein says hinges aren't "known" or "believed" in the ordinary sense. We *act* upon them (hence "in deed"). You don't *believe* you have hands—you *use* them. Calling a hinge a "belief" misapplies language. As he says elsewhere:  
     > "My life consists in my being content to accept many things" (OC 344).  
     Hinges are lived certainties, not cognitive states.  

  ---

  ### Can Hinges Explain "Immunity to Facts"?  
  **Yes—but with nuance.** Wittgenstein isn't describing *dogmatism*; he's describing the *conditions for rationality*. However, his framework helps explain why some beliefs become fact-resistant:  

  1. **When movable beliefs become hinges**:  
     In conspiracy communities, contingent claims (e.g., "COVID vaccines contain microchips") can function as **pseudo-hinges**. They're treated as the bedrock of an alternative "game" of inquiry. Fact-checking such claims feels nonsensical—like arguing chess rules while playing checkers.  

  2. **Hinges define what counts as a "fact"**:  
     If your hinge is "Institutions are always lying," then institutional evidence (studies, media) isn't *wrong*—it's **invisible** as evidence. Wittgenstein:  
     > "What counts as an adequate test of a proposition belongs to logic. It belongs to the scaffolding of our thoughts." (OC 82)  

  3. **The danger: Hinges aren't chosen rationally**:  
     Hinges are absorbed through **training, not argument** (e.g., a child learns "objects persist unseen" by playing peek-a-boo). Conspiracy hinges form through social reinforcement and narrative, making them resistant to empirical correction.  

  ---

  ### Caveats for Your Piece
  - **Don't equate hinges with "irrational" beliefs**:  
    *All* rational systems have hinges. The problem is when *contingent* claims solidify into hinges (e.g., "My leader is infallible").  
  - **Hinges are communal**:  
    They exist within **shared practices**. A QAnon adherent's hinges differ from a scientist's not because of "stupidity," but because they inhabit different forms of life (*Lebensformen*).  
  - **Immunity isn't absolute**:  
    Hinges *can* shift—but through crises of practice ("What do I *do* now?"), not evidence. E.g., losing faith in a cult leader after their prediction fails.  

  ---

  ### On "in deed" vs. "indeed"
  It's **deliberate**. The 1969 Anscombe/Paul translation preserves Wittgenstein's play on *Tat* (deed/action) vs. *Tatsache* (fact). He's stressing that hinges are anchored in **action**, not cognition. Later translations (e.g., 1972 Denis Paul/E.M. Anscombe) sometimes use "indeed," but "in deed" better captures his emphasis on praxis.

  ### Bottom Line for Your Readers
  Wittgenstein gives you a profound lens: **immunity to facts often signals a hinge—a proposition that's moved from the *content* of belief to the *frame* of reality.** Fact-checking pseudo-hinges isn't wrong; it's like yelling at a door's hinges to let you in. You need to address *why* that hinge feels necessary—or offer a new door.  

  This *is* a fair extension of Wittgenstein if you stress:  
  - Hinges are normally enabling (science has them too!)  
  - Pathologies arise when *contestable* claims become hinges  
  - "Certainty" lives in actions, not just thoughts  

  Would love to see how you weave this in—hinges are wildly relevant to post-truth dynamics.
