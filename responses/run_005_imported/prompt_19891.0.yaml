  For AI-specific analysis: The interconnectedness argument transfers strongly - you can't regulate frontier models without affecting cloud computing or medical AI. But new complexities emerge: unlike nukes, dual-use is inherent at the architectural level; unlike weather control, AI capabilities emerge unpredictably. The enforcement paradox becomes more acute with open-source proliferation and compute diffusion. 

