  We are ranking proposed solutions to the "wrong kind of reasons" (WKR) problem for fitting-attitude (FA) or buck-passing accounts of value. The problem arises because there can be reasons to have an attitude (like admiration) that do not seem to bear on the value of the object (e.g., the demon threatens you unless you admire a saucer of mud). We want to distinguish the "right kind of reasons" (RKR) that are relevant to the object's value from the "wrong kind" that are not.

   We'll consider the following proposals (as mentioned in the query and some other major ones):

   1. Olson's "No Reference" proposal: A reason is of the right kind only if it does not refer to the attitude for which it is a reason in its formulation.
   2. Hieronymi's approach: Distinguishing between reasons that bear on the question that the attitude answers (RKR) and those that don't (WKR). But note the query mentions her view on actions vs. attitudes.
   3. Way's distinction: WKR are reasons to want to have an attitude (or to bring it about) but not reasons for the attitude itself.
   4. Schroeder's criticism of the object-given/state-given distinction and his own proposal (which he has developed over time, including in "The Ubiquity of State-Given Reasons" and his later work on the WKR problem).
   5. The classic "object-given vs. state-given" distinction: RKR are reasons provided by the properties of the object of the attitude (object-given), while WKR are reasons provided by the state of having the attitude (state-given). Schroeder has criticized this.
   6. Rabinowicz and Ronnow-Rasmussen's own response (from their 2004 paper and later): They proposed a "two-tier" approach, but note that they are the ones who introduced the problem in the form of the demon example.
   7. Danielsson and Olson's "Brentano-style" account: That the right kind of reasons are those that would be shared by all agents regardless of their desires (or something similar).
   8. The "fittingness-first" approach (e.g., by McHugh and Way) that tries to define fittingness independently and then say that RKR are reasons that bear on fittingness.

