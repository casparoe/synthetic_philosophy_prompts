answer: |-
  You've hit on a crucial insight: both contextualism (e.g., DeRose) and pragmatic encroachment (e.g., Stanley) *predict the same patterns of knowledge attributions* in cases like the bank examples. In high-stakes situations, both theories agree that the subject typically *doesn't* know, while in low-stakes versions of the same situation, they agree that the subject *does* know. So why the rivalry?

  The disagreement isn't primarily about **what we say** in specific cases, but about **what explains** those patterns and **what the underlying nature of knowledge and language is**. Here's the breakdown of the key differences and why they are seen as rivals:

  1.  **The Core Explanation: Semantics vs. Nature of Knowledge**
      *   **Contextualism (DeRose):** This is primarily a *semantic* or *linguistic* thesis. It claims the *word* "know" and its cognates (knows, knew, knowledge) are **context-sensitive**. The *truth-conditions* of a sentence like "S knows that P" shift depending on the *conversational context* of the speaker making the attribution (especially the stakes, purposes, and presuppositions of that speaker's context). Higher stakes raise the epistemic standards required for "knows" to apply truly.
          *   *Analogy:* Like "tall." "Is John tall?" might be true when asked about a high school basketball team (low standards) but false when asked about NBA players (high standards). The meaning of "tall" shifts with context. Similarly, "knows" shifts.
          *   *Implication for Bank Cases:* When the high-stakes speaker says, "Hannah doesn't know the bank is open Saturday," they are speaking truthfully because *their* context sets high standards. When the low-stakes speaker earlier said, "Hannah knows the bank is open Saturday," *they* were also speaking truthfully because *their* context set lower standards. The *knowledge relation itself* (between Hannah and the proposition) might be constant; it's the *meaning of "knows"* that changes.
      *   **Pragmatic Encroachment (Stanley, Fantl & McGrath):** This is primarily a thesis about the *nature of knowledge itself*. It claims that **practical factors (like stakes) are genuine constituents of knowledge or the justification required for knowledge**. Knowing that P isn't *just* a matter of having a true belief supported by sufficient evidence/reliability/etc. (the traditional "epistemic" factors). The *amount* or *kind* of evidence/justification/reliability required *depends* on the practical costs of being wrong. High stakes *genuinely raise the epistemic bar* the subject must meet to count as knowing.
          *   *Analogy:* Imagine needing a stronger foundation for a skyscraper (high stakes) than for a garden shed (low stakes). The *nature* of what counts as a sufficient foundation *depends* on the practical consequences of failure. Similarly, what counts as sufficient justification for knowing depends on the practical stakes.
          *   *Implication for Bank Cases:* In the low-stakes case, Hannah *does* know because her evidence meets the (lower) justification bar set by the low practical stakes. In the high-stakes case, Hannah *doesn't* know because the *same evidence* no longer meets the (higher) justification bar set by the high practical stakes. The *knowledge relation itself* changes with the stakes.

  2.  **The "Knowledge Relation": Invariant or Stake-Sensitive?**
      *   **Contextualism:** Often aims to preserve a form of **Traditional Invariantism** about the *knowledge relation*. The relation "S knows that P" (understood as true belief + sufficient justification/warrant by contextually invariant epistemic standards) might hold in the low-stakes context but not in the high-stakes context *for the same subject and evidence*. The *relation* is invariant; it's the *semantic value of the word* that shifts.
      *   **Pragmatic Encroachment:** Is fundamentally a form of **Stake-Sensitive Invariantism** about the knowledge *relation*. The standards for sufficient justification/warrant *themselves* are sensitive to practical stakes. Therefore, the *relation* "S knows that P" is *itself* sensitive to practical factors. The word "knows" might have stable truth-conditions, but whether those conditions are met depends constitutively on practical context.

  3.  **The Target of Criticism: Skepticism vs. Purely Epistemic Accounts**
      *   **Contextualism:** Often motivated by the desire to explain how we can truthfully claim to "know" many ordinary things (e.g., I have hands) in everyday low-stakes contexts *without* denying the force of skeptical arguments in high-stakes/philosophical contexts. It explains the *variability* in our willingness to attribute knowledge.
      *   **Pragmatic Encroachment:** Often motivated by the desire to preserve the *intuition* that Hannah *really does lose knowledge* when the stakes get high, not just that we *stop saying* she knows. It argues that traditional "purely epistemic" (truth-conducive) accounts of justification are *inadequate* because they ignore the role of practical rationality. If it's practically irrational for Hannah to act on her belief in the high-stakes case, how can that belief be sufficiently justified to count as knowledge? Pragmatic encroachment argues justification/knowledge must incorporate practical rationality.

  4.  **Stanley's Specific Critique of Contextualism:**
      Stanley argues that contextualism, while explaining the linguistic data, *fails to capture the real epistemic phenomenon*. He thinks our intuitions in the bank cases reveal something deep about *knowledge itself* – that practical interests affect whether a belief *is justified enough to be knowledge* – not just about how we *talk* about knowledge. He sees contextualism as a linguistic dodge that avoids the substantive (and, to him, correct) conclusion that knowledge isn't purely epistemic.

  **Why They Are Rivals, Not Just Vocabulary:**

  *   **Different Explananda:** While they agree on surface-level attributions, they offer fundamentally different *explanations* for those attributions (word meaning vs. nature of justification/knowledge).
  *   **Different Commitments:** Contextualism commits to a specific view about the semantics of "knows" (context-sensitivity akin to indexicals). Pragmatic encroachment commits to a specific view about the metaphysics of knowledge/justification (practical stakes are constituent parts).
  *   **Incompatible Core Claims:** It's difficult, if not impossible, to hold *both* that the *meaning* of "knows" shifts with the attributor's context *and* that the *justification condition for knowledge itself* shifts with the subject's practical stakes. They propose different mechanisms for the same observed effect.
  *   **Philosophical Stakes:** The debate touches deep issues: Is knowledge a purely truth-conducive state? Is epistemology fundamentally distinct from practical reasoning? How does language hook onto epistemic reality? Can traditional invariantism be saved?

  **In essence:** While both theories predict Hannah "doesn't know" in high-stakes and "knows" in low-stakes, they vehemently disagree on *why*.

  *   DeRose (Contextualist): "It's because the *word 'knows' means something stricter* when we talk about high-stakes situations."
  *   Stanley (Pragmatic Encroachment): "It's because the *justification Hannah needs to genuinely possess knowledge actually increases* when the stakes are high."

  They aren't just different vocabularies; they are competing explanations for the underlying phenomenon, rooted in fundamentally different views about language and epistemology. That's why the debate is substantive and ongoing.
