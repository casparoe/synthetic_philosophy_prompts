answer: |-
  Your classmate's dismissal of Dummett as "Walzer with extra hedging" significantly undersells the distinctiveness and normative force of Dummett's argument. While both arrive at a *formally* similar conclusion – a limited right to exclude – their foundational premises, driving concerns, and the *character* of the right they defend are profoundly different. Here's a breakdown:

  **1. Foundational Premises Unique to Dummett (Absent/Weaker in Walzer):**

  *   **Primacy of Anti-Racism & Historical Context:** Dummett's argument is fundamentally rooted in his decades-long activism against *racist* immigration policies in Britain (e.g., the Commonwealth Immigrants Acts). His starting point is the *immense harm and injustice* caused by racially motivated exclusion. His concession of a "right not to be submerged" arises *despite* this, as a reluctant necessity, not a core value. Walzer's communitarianism starts from the positive value of shared meaning and self-determination, with exclusion being a logical extension of that value.
  *   **Moral Universalism as the Default:** Dummett operates from a strong presumption of moral equality and universal human rights. Migration restrictions are seen as a *prima facie* violation of these rights, requiring exceptional justification. Walzer starts from the particularity of communities and sees border control as a constitutive element of community self-definition. For Walzer, the burden of justification lies more on those who would *challenge* a community's membership decisions; for Dummett, the burden lies heavily on those who would *exclude*.
  *   **The "Way of Life" as Dynamic and Inclusive:** When Dummett talks about a "way of life" potentially threatened, he emphasizes it must be a *liberal*, *democratic*, and *inclusive* way of life defined by shared institutions, values (like tolerance, rule of law), and practices, *not* by static ethnic or racial composition. His fear is the *destruction* of these institutions/values, not their *change* per se. Walzer, while also valuing shared meanings, is more open to communities defining their shared life in thicker, potentially more culturally specific (and potentially less liberal) terms (e.g., his neighborhood analogy allows for exclusivity based on "character").
  *   **Distrust of State Power & Motivations:** Dummett's argument is deeply skeptical of state claims about being "overwhelmed." His constraints are explicitly designed to counter the historical reality of states using "cultural threat" rhetoric as a smokescreen for racism. This deep-seated distrust of state motivations is a driving force, not an afterthought. Walzer is more accepting of the community (acting through the state) as a legitimate arbiter of its own character.

  **2. Constraints in Dummett's "Right Not to Be Submerged": Independent Argumentative Work**

  These constraints are not mere "hedging"; they are *constitutive* of Dummett's argument and do significant independent work that Walzer's framework does not inherently demand:

  *   **The High Threshold ("Genuinely Threaten to Overwhelm"):** This isn't just caution; it reflects Dummett's view that the *only* justification powerful enough to override the *prima facie* right to migrate is an *existential threat* to the core functioning of genuinely valuable liberal-democratic institutions. It sets an evidentiary bar designed to be almost impossibly high in most real-world scenarios. Walzer's "shared understandings" can be disrupted by much lower levels of change; his framework doesn't inherently require proof of existential threat, only significant change.
  *   **The Absolute Ban on Racial/Ethnic Motivation:** This is the cornerstone. For Dummett, *any* racial/ethnic motivation automatically invalidates the claim to be exercising the "right not to be submerged." It transforms the act into simple racism, which has no moral standing. This flows directly from his foundational anti-racism and historical analysis. Walzer's communitarianism *could* potentially accommodate non-racial definitions of "shared character," but it doesn't *inherently* rule out communities defining themselves in ethnic or racial terms as part of their "shared understanding" (though Walzer himself might find this problematic, his framework doesn't structurally forbid it like Dummett's does).
  *   **Burden of Proof on the State:** The requirement that the state must *prove* the threat and the absence of racial motivation, rather than the migrant proving the negative, is crucial. It operationalizes Dummett's skepticism and places the onus entirely on the excluding power. Walzer's framework places more initial legitimacy on the community's decision.

  **3. Could Walzer Absorb Dummett's Constraints?**

  Walzer's communitarian framework could *theoretically* incorporate similar constraints. One could argue that a *just* community, pursuing *distributive justice*, must define its shared life in non-racial terms and only restrict membership when truly essential to its core functioning. However:

  *   **Not Inherent:** These constraints are not *required* by Walzer's core logic. His analogies (family, club, neighborhood) strongly suggest communities have broad discretion based on their own self-understanding, which *could* be racial or exclusionary on thinner grounds. Adding Dummett's constraints would be an *imposition* of liberal universalist norms *onto* the communitarian framework, potentially in tension with its emphasis on particularity.
  *   **Motivational Skepticism Missing:** Walzer's framework lacks Dummett's built-in, deep-seated skepticism of state motives and the historical awareness of how "cultural threat" narratives mask racism. Walzer is more optimistic about communities acting authentically.
  *   **Different Weight:** Even if incorporated, these constraints wouldn't carry the same *normative force* within Walzer's system. For Dummett, they are the *core safeguards* preventing a concession to exclusion from becoming a tool for racism. For Walzer, they might feel like external limitations on the community's self-determination right.

  **Verdict: Dummett Offers the More Defensible Account**

  While both accounts provide *a* justification for limited exclusion, **Michael Dummett's account is ultimately more defensible, particularly for a liberal-democratic context concerned with real-world injustice.**

  1.  **Superior Safeguards Against Abuse:** Dummett's constraints – the high existential threat threshold, the absolute ban on racial motivation, and the burden of proof on the state – are specifically and powerfully engineered to prevent the very real historical abuse of "cultural preservation" arguments to mask racism and xenophobia. Walzer's framework, while not inherently racist, provides far weaker bulwarks against such abuse. His analogies offer too much cover for exclusionary impulses dressed up as communal integrity.
  2.  **Alignment with Liberal-Democratic Values:** Dummett's defense of exclusion is tightly bound to preserving core *liberal-democratic institutions and values* (tolerance, rule of law, non-discrimination). The "way of life" he seeks to protect is inherently *inclusive* in its ideals. Walzer's defense protects "shared meanings" that could be illiberal or discriminatory. Dummett's right is a reluctant exception carved out of a universalist framework; Walzer's is a positive extension of a particularist one. For societies committed to liberal democracy, Dummett's starting point is more congruent.
  3.  **Moral Urgency and Realism:** Dummett's argument reflects the profound moral urgency of combating racist exclusion and the realistic assessment of how states actually deploy arguments for restriction. It doesn't take state claims about cultural threat at face value. Walzer's argument, while coherent in theory, feels more detached from the historical and political realities of how immigration restriction has functioned as a tool of oppression.
  4.  **Practical Implications:** Dummett's high bar means that *very few* actual claims for restriction would be legitimate under his framework. This aligns better with the view that most contemporary immigration restrictions in wealthy liberal democracies *are* unjustified and often rooted in prejudice or economic protectionism disguised as cultural concern. Walzer's framework provides much more scope for legitimate restriction based on a community's desire to maintain its current character, even absent existential threat.

  **Conclusion:**

  Your classmate's verdict collapses under scrutiny. Dummett is not simply a hesitant Walzer. He starts from a radically different place – anti-racism and moral universalism – and constructs his extremely narrow "right not to be submerged" as a reluctant concession *within* that framework, surrounded by stringent, non-negotiable constraints specifically designed to prevent the abuse Walzer's more open-ended communitarianism inadvertently facilitates. While Walzer provides a powerful theoretical grounding for communal self-determination, Dummett offers a more ethically rigorous, historically aware, and defensibly *liberal* account of when, *if ever*, exclusion might be justified. Dummett's constraints are not "hedging"; they are the essential armor protecting a minimal concession to exclusion from becoming a weapon of injustice. For these reasons, Dummett's account provides the superior normative guide for evaluating the legitimacy of immigration restrictions.
