answer: |-
  Based on Dummett's core principles in *On Immigration and Refugees*, here's a careful reconstruction of his likely responses to the Brexit free movement ending and the Rwanda asylum scheme. His arguments consistently emphasize **anti-racism, a strong presumption for free movement, the binding nature of refugee obligations, and a highly constrained "right not to be submerged."** Where tensions exist, I'll highlight them.

  **1. Ending EU Free Movement (Post-Brexit Transition):**

  *   **Likely Core Opposition:** Dummett would almost certainly condemn this policy as a severe violation of the "strong presumption in favour of free entry." He viewed freedom of movement as a fundamental human right, restricted only by substantial, non-discriminatory reasons. Ending established rights for millions of EU citizens based on nationality would strike him as a classic example of the "xenophobic nationalism" he condemned. He argued that post-war UK policy was driven by racism disguised as pragmatism; he'd likely see Brexit's "control" narrative as a similar mask for hostility towards Europeans, particularly Eastern Europeans often targeted in rhetoric.
  *   **Challenging the "Submersion" Justification:** If proponents argued ending free movement was necessary to prevent "submersion," Dummett would demand rigorous proof. His "right not to be submerged" was exceptionally narrow:
      *   **Scale:** He meant *literal* demographic replacement threatening the existence of the political community, not cultural change or pressure on services. He explicitly rejected Thatcher's "swamped" comment as racist scaremongering. EU migration, even at peak levels, would be highly unlikely to meet his threshold for "submersion."
      *   **Proportionality:** Even if some theoretical threat existed (which he'd doubt), ending *all* free movement rights would be grossly disproportionate to the alleged problem. He advocated for minimal, targeted restrictions only if demonstrably necessary.
      *   **Reciprocity & Context:** Dummett acknowledged states could legitimately insist on reciprocity in migration agreements. However, he'd argue the *mutual* benefits of free movement within the EU – fostering ties, economic integration, personal freedoms – constituted a substantial positive reason *for* it, outweighing vague fears. Ending it unilaterally would seem like nationalist isolationism, which he saw as morally bankrupt.
  *   **Potential Points of Tension/Underdetermination:**
      *   **The EU as a Special Case?** Dummett focused on global migration principles and UK national policy. He doesn't extensively analyse supranational free movement blocs. While his presumption favours freedom, *theoretically* he might accept that a bloc's internal rules could differ from global ideals if genuinely reciprocal and non-exclusionary towards non-members *in fair ways*. However, the *withdrawal* of rights, especially driven by nationalist sentiment, would likely override any such nuance for him.
      *   **"Substantial Reasons" Beyond Racism?** Could economic arguments post-2008 (real or exaggerated) about pressure on wages/services constitute "substantial reasons" under his framework? He was deeply sceptical of such claims, often linking them to underlying xenophobia and arguing they ignored benefits and moral obligations. He'd demand overwhelming, objective evidence of net harm solely attributable to *free movement itself* (not broader policy failures), which would be hard to provide. He prioritised freedom and anti-racism over purely economic concerns.
  *   **Plausible Conclusion:** Dummett would view the ending of EU free movement as a profound regression, driven by the same xenophobic impulses he fought against, lacking a "substantial reason" meeting his stringent criteria, and representing a disproportionate violation of the fundamental right to free movement. His "submersion" argument would be seen as inapplicable here.

  **2. The Rwanda Asylum Scheme (Offshoring Claims):**

  *   **Likely Vehement Condemnation:** Dummett would almost certainly view this policy as a gross violation of international law (the 1951 Refugee Convention) and fundamental morality. His core principles point to a blistering critique:
      *   **Evading Obligations:** The central purpose – avoiding the UK's duty to process claims and offer protection to those reaching its territory/jurisdiction – would be anathema. He insisted the Geneva Convention imposes *non-derogable* duties on states where refugees are present. Offshoring to evade these duties would be seen as a legal and moral sham, a "shirking of responsibility" he repeatedly condemned.
      *   **Refugee Rights Paramount:** Dummett argued rich states have stringent obligations towards refugees fleeing persecution. Sending them to a third country, especially one with a questionable human rights record and no prior connection to the claimant, fundamentally undermines their right to fair assessment and protection. He'd see it as treating vulnerable humans as unwanted cargo to be dumped.
      *   **"Deterrence" as Cruelty:** The stated aim of deterring Channel crossings would be seen as inherently inhumane. Dummett argued that genuine refugees often have no safe or legal routes, making dangerous journeys necessary. Punishing them to deter others is, in his view, morally repugnant and fails to address the root causes of flight. He wrote scathingly about policies designed to make life harsh for asylum seekers.
      *   **Racism & Neo-Colonialism:** He would likely perceive strong racist undertones in selecting Rwanda (a poorer, African nation) and in the rhetoric surrounding "illegal" arrivals. He might also critique the neo-colonial dynamic of paying a poorer country to handle a wealthy nation's responsibilities.
      *   **Wealth and Responsibility:** Dummett stressed the greater obligation of rich states. The UK outsourcing its legal duties to Rwanda, a significantly less wealthy country, would starkly violate this principle. He argued resources should be spent on fair processing and integration, not on evasion schemes.
  *   **The "Right Not to be Submerged" Test:** This policy isn't primarily about numbers or "submersion" – it's about *processing location*. Even if proponents argued it was necessary to manage flows, Dummett would reject it categorically. He believed asylum claims *must* be processed fairly *where they arise* (i.e., upon reaching the UK's jurisdiction). Outsourcing this core obligation doesn't address "submersion"; it simply denies access to the UK's protection system entirely, which is indefensible under his principles. The narrow "submersion" right could never justify abolishing the right to claim asylum *in the UK*.
  *   **Minimal Tension/Underdetermination:** On this specific policy, Dummett's principles pull overwhelmingly in one direction. There's almost no room within his stated framework for justifying offshoring asylum claims to avoid Convention obligations. His views on the sanctity of refugee rights, the duties of rich states, and the evils of deterrence-based cruelty are directly applicable and lead to unequivocal condemnation. The only potential nuance might be if Rwanda offered *objectively better* protection than the UK (which evidence strongly contradicts), but even then, the *motive* of evasion and the *coercion* of refugees would likely render it unacceptable to him.
  *   **Plausible Conclusion:** Dummett would denounce the Rwanda scheme as a morally bankrupt, illegal evasion of the UK's fundamental obligations under the Refugee Convention, driven by xenophobia and a cruel desire to deter desperate people, representing the very kind of policy he dedicated his life to fighting.

  **Key Caveats for Your EPQ:**

  1.  **Extrapolation, Not Certainty:** This is reasoned inference based solely on his *published principles*. Dummett might have nuanced his views post-2011, though his core commitments seem deeply held.
  2.  **"Submersion" is Ambiguous:** The biggest tension in applying his theory lies in defining the threshold for "submersion." He provides little concrete guidance, making it vulnerable to misuse. His own application suggests an *extremely* high bar.
  3.  **Focus on Motive & Racism:** Dummett consistently looked beyond stated policy justifications to underlying motives, especially racism. He'd likely analyse the political rhetoric and social context surrounding both policies as much as their mechanics.
  4.  **Underdetermination on Scale/Mechanism:** While condemning the *principles* behind both policies (ending free movement without sufficient cause, offshoring asylum obligations), his specific critique of *how* free movement ended (e.g., the Settlement Scheme, deadlines) or *alternative* proposals for managing asylum claims *within the UK* might be less directly dictated by his book. He favoured fair processing and integration, but the exact mechanisms are less specified.

  Dummett's unique contribution was applying rigorous philosophical analysis (rooted in anti-racism and human rights) to the visceral realities of immigration policy. Both the Brexit free movement reversal and the Rwanda scheme represent policies he would likely see as betrayals of justice, driven by the very forces he spent his life combating. His "right not to be submerged" is far too narrow to justify either.
