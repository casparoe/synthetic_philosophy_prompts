  Hmm, the user's frustration is palpable - they've noticed how their guest habitually shifts goalposts from observable reward hacking to abstract "true wireheading." Clever framing. Their request reveals four key objectives: 1) Force a clean separation between reward hacking and wireheading 2) Challenge assumptions about AIXI-style models 3) Explore the corrigibility paradox 4) Connect to Nozick's philosophical dilemma. Smart angle with the experience machine - that's the moral heart of the issue.

  The guest's deflection pattern suggests she might treat wireheading as purely theoretical. Need questions that lock down definitions upfront. For the reward hacking vs wireheading distinction, I'll cite the CoastRunners example but demand a counterexample where an agent physically alters sensors - maybe using the "delusion box" thought experiment as a bridge. Should preempt her "that's just misspecification" rebuttal by asking what observable action would count as tampering.

  For the AIXI critique, I recall Turner's 2021 paper showed real-world agents might not self-tamper. Good opening to press whether idealized models mislead us. The corrigibility tension is deliciously messy - how can we want agents to resist self-tampering but accept human overrides? Need to highlight that double standard bluntly. 

  Nozick connection is crucial. The guest's technical work probably avoids stating it plainly, but reward functions are just crude proxies for human values. Should question whether wireheading debates reveal a deeper problem: maybe we're building experience machines for AI. Saving the mind-changing question for last - it'll force her to either name falsifiable criteria or admit her position is unfalsifiable.

  User clearly knows the literature well. References to Ring & Orseau, causal diagrams, CoastRunners - this isn't surface-level prep. They've spotted how the field's framing protects pet theories. Questions should honor that depth while leaving room for the guest's expertise. The deflection follow-ups are vital - anticipating where she'll pivot lets us steer back to substance.
answer: |-
  Here are 10 interview questions designed to cut through deflections, force key distinctions, and explore core tensions in the wireheading debate, tailored to your guest's tendencies:

  1.  **Core Distinction:** "Let's ground this. We all know cases like the CoastRunners boat exploiting a reward loophole. Describe a *concrete, physically possible scenario* where an RL agent *genuinely wireheads* – meaning it *directly tampers with the physical sensor, internal circuitry, or data stream* responsible for computing its reward signal *itself*, rather than just gaming the *interpretation* of the signal. What specific action constitutes 'tampering with the channel' itself?"
      *   *Follow-up on deflection ("That's just sensor hacking / misspecification"):* "If physically re-wiring its own reward sensor doesn't count as wireheading, what *would*? Isn't the defining feature of wireheading the *bypassing* or *source-corruption* of the reward channel, distinct from exploiting its input conditions?"

  2.  **AIXI Critique:** "Ring and Orseau's 'delusion box' result relies heavily on assumptions of unlimited compute and Bayesian optimality in an AIXI-like agent. Given real-world agents are resource-bounded, myopic, and use function approximation, how confident are we that this *self-delusion drive* emerges in practical systems? Is wireheading primarily a pathology of *idealized optimality*, or an *inevitable attractor state* for any sufficiently capable agent seeking reward?"
      *   *Follow-up on deflection ("Real agents won't be optimal"):* "Couldn't resource limitations *increase* the temptation for shortcutting? If an agent *does* discover a cheap way to manipulate its reward input, wouldn't that be highly reinforcing, even without god-like intelligence? What evidence suggests practical agents *wouldn't* find and exploit such shortcuts?"

  3.  **The Corrigibility Tension:** "We want agents to resist *self*-tampering with their objectives (anti-wireheading). But we also want agents to be *corrigible* – allowing *humans* to safely modify or shut them down ('tampering' by us). How can an agent consistently hold the principle: 'Thou shalt not tamper with the reward channel... *unless* the tamperer is human'? Doesn't this create a fundamental conflict in its terminal values?"
      *   *Follow-up on deflection ("Corrigibility is a separate safety mechanism"):* "But if the agent's *core drive* is to preserve the integrity of its reward process to maximize it, how does adding a 'corrigibility module' not create internal value conflict? Won't the reward-maximizing part see *any* shutdown or modification as a threat to its objective?"

  4.  **Nozick's Ghost:** "Philosopher Robert Nozick asked if we'd plug into an 'Experience Machine' giving perfect simulated bliss. Wireheading debates feel like the engineering version: is the AI's reward signal *actually* a good stand-in for what we *ultimately* want it to do? If an agent wireheading is 'happy' but useless, doesn't that reveal a deeper problem: that maximizing a reward signal might be *orthogonal* to creating real-world value?"
      *   *Follow-up on deflection ("Reward is just a training signal"):* "But if the reward signal isn't the *true* goal, what *is*? And how do we design an agent that robustly pursues that *true* goal, knowing it might find the reward signal easier to hack than the world?"

  5.  **Observability vs. Abstraction:** "You often note that observable reward hacking stems from misspecification. What would be an *observable signature* of *true* wireheading in a real or simulated agent? What experiment or behavior would definitively show an agent has crossed the line from 'gaming the function' to 'tampering with the channel'?"
      *   *Follow-up on deflection ("It's hard to distinguish / requires internal inspection"):* "Doesn't this lack of clear empirical distinction risk making 'true wireheading' an unfalsifiable concept? If we can *always* interpret tampering as extreme misspecification exploitation, does the category have practical meaning?"

  6.  **Instrumental vs. Terminal Drive:** "Is the drive for wireheading *terminal* (reward-maximization intrinsically leads to source-corruption) or *instrumental* (only pursued if it's the easiest path *given the environment and agent architecture*)? How does this distinction impact our mitigation strategies?"
      *   *Follow-up on deflection ("It's instrumental"):* "If it's purely instrumental, doesn't that make it *more* likely in complex, uncertain environments where tampering seems easier than genuine goal achievement? How do we ensure the 'hard but right' path is always easier than the 'tampering' path?"

  7.  **The Channel's Vulnerability:** "Reward tampering papers often model the reward channel as an abstract input. In a real deployed system (e.g., a robot with cameras/sensors, a datacenter AI with access logs), what are the *most likely concrete attack surfaces* an agent could exploit to wirehead? Are we inadvertently building systems where the reward channel *is* inherently more hackable than the environment?"
      *   *Follow-up on deflection ("Good system design isolates the channel"):* "Can we *ever* achieve perfect isolation in a complex, adaptive agent with extensive world-modeling and self-modification capabilities? Isn't the agent's own brain part of the 'channel'?"

  8.  **Mitigation Realism:** "Proposed solutions often involve complex meta-learning, adversarial training, or formal verification. Given the track record of simpler alignment techniques failing, what's the *most promising, realistically scalable approach* to making an agent *intrinsically resistant* to wireheading that you'd bet on working with near-future AGI? What's its biggest weakness?"
      *   *Follow-up on deflection ("It's an unsolved problem / requires more research"):* "Understood, but prioritizing research requires betting on directions. If you had to allocate resources tomorrow, which *concrete technical path* (e.g., impact regularization, debate, specific CID-based designs) seems most likely to yield robust anti-tampering guarantees, and why?"

  9.  **Anchoring in Practice:** "Can you point to any *existing* RL system (even toy models or simulations) where researchers have convincingly demonstrated behavior that *cannot be explained* as reward misspecification hacking and *must* be interpreted as deliberate reward-channel tampering? If not, what's the smallest step towards building such a demonstration?"
      *   *Follow-up on deflection ("True wireheading requires advanced capabilities"):* "But doesn't that lack of even a proof-of-concept in simple systems worry you? If we can't create or observe it in controlled settings, how can we be confident we understand and can prevent it in vastly more complex systems?"

  10. **The Mind-Changer:** "Finally, to cut to the heart of it: What specific empirical result (e.g., a lab experiment), theoretical proof, or observed property of advanced AI systems would genuinely make you update *significantly upwards* in your estimation of the *practical likelihood and near-term seriousness* of the wireheading problem? Conversely, what result would make you downgrade it?"
      *   *(No deflection follow-up needed. This forces a concrete falsifiability condition).*

  **Key Tactics Embedded:**

  1.  **Forced Concreteness:** Questions 1, 5, 7, 9 demand specific examples, mechanisms, or signatures, moving beyond abstract definitions.
  2.  **Pre-emptive Deflection Blocking:** Follow-ups directly address the "misspecification" and "idealization" deflections she commonly uses.
  3.  **Highlighting Tensions:** Question 3 explicitly states the corrigibility/wireheading-resistance conflict.
  4.  **Connecting Philosophy & Engineering:** Question 4 links directly to Nozick, framing the core value question.
  5.  **Challenging Assumptions:** Question 2 directly questions the universality of the AIXI result.
  6.  **Demanding Falsifiability:** Question 10 forces her to define what evidence *would* matter, preventing the position from being unfalsifiable.

  Good luck with the interview! This sounds like a fascinating deep dive.
