prompt: |-
  I host a little biweekly podcast on science and ideas, and next episode's guest is an AI safety researcher who's spent years on the wireheading/reward-tampering problem in RL agents. Prepping for this one has turned into a bit of a rabbit hole -- I've been reading through Ring and Orseau's old "delusion box" paper and some of the DeepMind causal-influence-diagram work on reward tampering, and the more I read the less I think this is the "robot gets addicted to pressing its own pleasure button" story people default to. My guest's signature move in every talk I've watched is to hear an example of an agent gaming its reward and say "that's just a mis-specified reward function, that's not wireheading" -- which conveniently means the phenomenon only ever exists in the abstract, never in front of us. I want questions that make that move harder to lean on.

  Can you draft 8-10 interview questions for me? I want at least one that forces a real seperation between ordinary reward hacking (like the classic CoastRunners boat that loops forever instead of finishing the race) and wireheading proper, i.e. an agent actually tampering with the channel that computes its reward rather than just exploiting a gap in how the reward was specified. I want one on whether Ring and Orseau's result is really a fact about sufficiently smart agents in general or an artifact of assuming a Bayes-optimal AIXI-style agent with unlimited compute. I want one that presses the tension between wanting an agent that resists tampering with its own objective and wanting an agent that stays corrigible when we're the ones doing the tampering -- why would it respect one kind of interference and not the other? And I want one that ties the whole debate back to Nozick's experience machine, since "is reward even the right stand-in for what we actually want" seems like the question hiding underneath all the engineering language. For each question, give me a short follow-up keyed to the deflection shes most likely to try, and end the list with a question that asks her flat out what result -- empirical or theoretical -- would actually change her mind about how serious this problem is.
