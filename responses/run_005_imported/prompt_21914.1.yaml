  Looking at Bitcoin through this lens, I need to consider mining, speculation, and crypto lending. Mining involves creating new coins through computational work - would Aristotle see this as natural production? Probably not, since it lacks intrinsic use value. The energy expended creates a digital token, not something fulfilling household needs.

  Buy-and-hold speculation is clearly problematic under Aristotle's framework. Investors treat Bitcoin as an end in itself, hoping its exchange value will increase. This divorces acquisition from use, making it unnatural chrematistike. Even Bitcoin's protocol-enforced scarcity doesn't change this - Aristotle saw money as conventional, so algorithmic scarcity wouldn't legitimize value divorced from use.

  Crypto lending with interest directly mirrors usury, which Aristotle condemned most harshly. The fact that it's crypto doesn't matter - it's still money breeding money through interest.

