answer: |-
  Okay, this is brilliant. Weaving Sartre into a wedding toast without putting the uncles to sleep or making Mia cringe is a challenge, but absolutely doable. The key is using the *concepts* as the *structure* for genuine, warm, funny celebration, not lecturing about them. Here’s a draft aiming for that sweet spot:

  **(Clink glass gently)** Alright, settle down everyone. Or don't. Honestly, I need a bit of noise to hide the fact my knees are knocking. Danny asked me to be his best man, which was incredibly kind... and also slightly concerning given he knows my usual speeches involve embarrassing him and questionable karaoke choices. But this one’s different. Because *this*... Danny and Mia... well, their story starts in a place most love stories don't: a book club attempting to read Jean-Paul Sartre’s *Being and Nothingness*.

  **(Raise eyebrows, look slightly bewildered)** For those of you lucky enough *not* to have been there – which is most of you, judging by the confused looks – imagine this: a group of otherwise sane people, week after week, wrestling with phrases like "being-for-itself" and "facticity," fueled mostly by cheap wine and sheer stubbornness. Why? Nobody remembers! But somewhere in that fog, specifically while drowning in the chapter on "Bad Faith," Danny and Mia looked across a table strewn with highlighted pages and existential dread... and saw each other. Bonded, apparently, over how thoroughly this French philosopher had just wrecked their heads. Romantic, right?

  **(Lean in conspiratorially)** Now, I *did* try to read this beast afterwards, Danny insisted. My copy looks like a confused badger attacked it with a highlighter. But one bit stuck with me, probably because it felt weirdly relevant to Danny, even *before* Mia. This "Bad Faith" thing. It’s not just lying to yourself. Sartre basically says we get trapped in two ways.

  **(Gesture towards Danny)** First trap: Acting like you’re just a *thing*. Fixed. No real choices. "This is just who I am," "It was meant to be," "She’s my soulmate, it was written in the stars!" **(Look fondly at Danny & Mia)** Now, don’t get me wrong, looking at you two, "soulmates" feels tempting! But that trap? That erases the *real* magic. Because Danny, let’s be honest, for a solid decade, your commitment strategy was basically "keep all options perpetually open." Deciding what to *have for dinner* could induce paralysis! The idea of Danny choosing *one person*, *one path*, with actual conviction? **(Look at the crowd, feigning shock)** We’d have bet against it! We’d have been *wrong*, but we’d have bet!

  **(Turn to Mia, warm smile)** Mia, you saw something in that perpetually-hesitant bloke wrestling with dense philosophy. And Danny, you looked at this brilliant, sharp woman who could probably dissect Sartre *in her sleep*, and you didn’t just admire her from a safe, non-committal distance. You *chose*. You chose to ask her out. You chose to be vulnerable. You chose to build something real, brick by terrifying brick, *despite* knowing freedom means it’s never *forced*. That, right there? That’s the *opposite* of bad faith. That’s courage. That’s showing up, every day, and saying "Yes, this. Her." Knowing you *could* walk away, but actively choosing *not* to. That’s way more impressive than cosmic destiny.

  **(Raise glass slightly)** Which brings us to Trap Number Two: The idea that *now* you’re done! Phew! Signed the paper, said the words, trapped forever! Finished! "We are now The Married Couple™. Static. Complete. No more choices needed!" **(Chuckle)** Sartre would call *that* bad faith too. Because today isn't some magic spell that freezes you in place. That certificate isn't a cage that removes your freedom. If anything, it *amplifies* it. You’ve stood up in front of everyone you love and *declared* your choice. Loudly! Spectacularly! With cake!

  **(Look directly at Danny & Mia, sincere)** But here’s the beautiful, terrifying, profoundly *un*-greeting-card truth: That freedom doesn't vanish after the honeymoon. You don’t get to stop choosing. Marriage isn’t becoming a fixed "thing." It’s the *commitment* to keep making that same choice, actively, deliberately, day after day after day. To choose Mia when she’s quoting Sartre at breakfast *and* when she’s hogging the duvet. To choose Danny when he’s being incredibly insightful *and* when he’s leaving his socks... well, everywhere. To choose *this* life you're building together, with all its messy, unpredictable glory, over any other potential path, every single morning. That’s the real work. That’s the real freedom. That’s the *opposite* of bad faith.

  **(Raise glass fully)** So, let’s raise our glasses. Not to fate, or cosmic strings, or finished products. Let’s raise them to Danny and Mia. To the courage it took to choose each other out of infinite possibility, especially when Danny’s default setting was "maybe later." To the even greater courage it will take to *keep* choosing each other, actively, freely, every single day that follows this incredible one. To embracing the beautiful, demanding freedom of building a life together, one conscious, loving choice at a time. To Danny and Mia!

  **(Clink!)**

  **Why this works:**

  1.  **Accessible Philosophy:** No jargon ("facticity," "being-for-itself" are mentioned but immediately dismissed as confusing). The *concepts* (fixed identity vs. refusing commitment) are explained in simple, relatable terms using Danny's past and common phrases like "soulmate" or "trapped forever."
  2.  **Humor:** Targets the book club's absurdity, Danny's past commitment-phobia (universally relatable), mundane struggles (socks, duvet), and contrasts the philosophy with greeting-card clichés. The "confused badger" line is for the uncles.
  3.  **Ribs Danny Gently:** Focuses humor on his *past* self ("perpetually-hesitant," "commitment strategy," "deciding dinner") in a way that highlights his growth *because* of Mia, which is flattering to her.
  4.  **Honors Mia:** Explicitly mentions her intelligence ("sharper," "dissect Sartre in her sleep"), positions her as the catalyst for Danny's positive change, and makes her understanding crucial.
  5.  **Core Message Resonates:** Celebrates their active choice (countering Trap 1) and emphasizes ongoing commitment and freedom within marriage (countering Trap 2). It's deeply romantic in a non-cliché way.
  6.  **Structure:** Clear narrative arc: Funny origin story -> Explanation of Bad Faith via Danny's past -> Celebrating their active choice *against* that past -> Warning against the *other* trap in marriage -> Toast focusing on ongoing conscious commitment.
  7.  **Sartre Does the Work:** The philosophy isn't name-dropped; it *frames* the entire tribute to their relationship and the nature of their marriage. Mia and the book club will hear the precise concepts woven in; others will hear a heartfelt message about choice and commitment.
  8.  **Length:** Aimed at 4-5 minutes when delivered with natural pauses and reactions.

  **Delivery Tips:**

  *   **Pace:** Don't rush. Pause after jokes, let the sincere bits land.
  *   **Eye Contact:** Share the funny bits with the crowd, direct the sincere parts and the toast to Danny and Mia.
  *   **Tone:** Warm, slightly self-deprecating ("my knees knocking"), genuinely affectionate, with a spark of humor throughout. Avoid sounding like a professor.
  *   **Practice:** Read it aloud multiple times. Time it. Get comfortable so you can sound natural.

  This toast respects the depth of their origin story, celebrates their genuine choice, offers profound well-wishes for their marriage, and does it all while keeping Uncle Bob awake and possibly chuckling. Good luck! You've got this. Danny chose *you* for a reason. Now go choose to deliver a cracking speech!
