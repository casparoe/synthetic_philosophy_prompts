answer: |-
  ## Eulogy for Miriam: Perspective, Scale, and the Stars She Carried

  [Stand for a moment of silence, allowing the weight of the room to settle.]

  Sixty-one years. Three weeks. A stroke. The words feel both too clinical and utterly insufficient to capture the shock, the absence, the sheer wrongness of Miriam not being here. We gather, colleagues, students, friends, family, united by loss, fractured by its suddenness. We knew her in lecture halls, in seminar rooms, over pub tables, and in the quiet corners of shared lives. And if you spent any time with Miriam at all, especially in those pub corners, you inevitably heard about Frank Ramsey.

  Not just the Ramsey of the Dutch Book arguments, or the foundations of subjective probability – though that was her intellectual bedrock. No, Miriam carried with her, like a well-worn talisman, one specific, luminous paragraph from Ramsey. A young man’s defiant, joyful paragraph, written seemingly without a thought for his own tragically short future. She’d bring it up, unprompted, eyes sparkling, leaning in: "You know, Ramsey said his picture of the world was drawn in *perspective*, not to scale..."

  She insisted, firmly and without irony, that this passage should replace the usual readings at her funeral. It wasn't a joke. It was her creed. And so, honoring Miriam means grappling with Ramsey’s words today, not as a detached quotation, but as the lens through which she saw value, meaning, and how we should stand in this vast, sometimes terrifying universe.

  Ramsey wrote: *"My picture of the world is drawn in perspective, and not like a model to scale. The foreground is occupied by human beings and the stars are all as small as threepenny bits... Where I seem to differ from some of my friends is in attaching little importance to physical size. I don't feel the least humble before the vastness of the heavens. The stars may be large, but they cannot think or love; and these are qualities which impress me far more than size does."*

  Miriam loved the audacity of that. The *perspective*. Not a cold, objective map measured in light-years and parsecs, but a human view. A view where the coffee cup in your hand, the argument across the table, the furrowed brow of a student grappling with a problem, the shared laugh over a colleague's terrible joke – *this* is the foreground. The vastness? It’s pushed back, rendered small. Not ignored, but seen in its proper relation. The cosmic scale isn't denied; it’s *reframed*.

  And Ramsey’s refusal to be humbled? Miriam didn’t see that as arrogance, but as profound clarity. **"Size,"** she’d say, tapping the table for emphasis, **"is not an impressive *kind* of property. It’s inert. It just *is*."** What *is* impressive? What *does* demand our awe, our respect, our fierce protection? **Thought. Love.** Capacities that transform the universe *from within*. A star burns. It doesn't *ponder* the nature of combustion, or *love* another star across the void. It simply obeys physics. We, however small, however fleeting... we *think*. We *love*. We build fragile webs of meaning across the indifferent vastness.

  This wasn't abstract for Miriam. It *was* her foreground. Her work in formal epistemology and decision theory? It wasn't just symbols on a page. It was the rigorous, beautiful exploration of *how we think*, how we reason under uncertainty, how we make choices that shape our tiny, precious human worlds. It was the architecture of *thought*. And her fierce loyalty, her wry wit, her capacity to lean in, truly *see* you, and argue passionately about your idea or ask after your sick cat? That was the architecture of *love*. Connection. The stuff that fills the foreground.

  And here is where we must wrestle with Ramsey, the young man writing blithely, unknowingly facing his own abyss. Using his defiance as *consolation* in the face of Miriam’s actual, devastating absence? It could feel glib. How can we *not* feel humbled, crushed even, by the sheer scale of this loss, by the cosmic indifference that snuffs out a vibrant, thinking, loving life at sixty-one?

  Miriah understood this tension. Her creed wasn’t a denial of death or grief. It wasn't "don't be sad." It was a statement about *where value resides*, even in the face of the void. Ramsey’s point, and Miriam’s life, tell us this: **The universe may be vast and uncaring, but our capacity for thought and love creates pockets of incandescent significance within it.** Miriam’s significance wasn't diminished by the scale of the cosmos; it was *defined* by the intensity of her mind and the warmth of her connections *right here*.

  Her foreground was rich. Think of the intricate models of belief she built – thoughts crystallized. Think of the generations of students she challenged and nurtured – thoughts ignited. Think of the laughter shared, the fierce debates enjoyed (or endured!), the quiet support offered – love enacted. Think of her partner, her sister, her close friends – the deep bonds that anchored her world. *This* was her universe, drawn in vivid perspective. The stars, for all their grandeur, remained threepenny bits in comparison to the human drama she engaged with such passion.

  So, how do we honor Miriam? We refuse, *with her*, to let the vastness diminish the significance of the human foreground. We honor her by valuing the qualities she found truly impressive: **We keep thinking.** We grapple with difficult ideas. We ask "why?" and "how?". We pursue clarity, as she did. And **we keep loving.** We reach out. We connect. We cherish the people in our foreground – our colleagues, our students, our families, our friends. We build and tend to our own webs of meaning.

  The stars are vast. Our lives are fleeting. Miriam is gone. That pain is real, and vast in its own way. But Miriam’s life, lived by Ramsey’s light, reminds us: We are not humbled by the scale of the heavens because we possess the only things *worth* being humbled by – the capacity to understand, and the capacity to care. Miriam filled her foreground with both, brilliantly.

  Her universe, drawn in perspective, was vast where it mattered. Let us carry that perspective forward. Let us think fiercely. Let us love deeply. Let us make our own foregrounds blaze. That is how we truly honor Miriam, and how we defy the indifferent scale.

  Thank you, Miriam. For the thoughts. For the love. For showing us the stars in their proper size.
