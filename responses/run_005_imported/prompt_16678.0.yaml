answer: |-
  You've hit on a core tension in contemporary metaethics: the remarkable success of quasi-realism and norm-expressivism in *addressing* Frege-Geach, versus the persistent sense that the problem hasn't been *fully dissolved*. Your understanding of Blackburn and Gibbard is correct—they provided sophisticated frameworks demonstrating how expressivism *can* accommodate moral logic without abandoning its core commitments. However, specialists continue to debate whether these solutions are ultimately *explanatorily adequate* or merely *formally adequate*. Here's why Frege-Geach remains a "live" objection in key respects:

  1.  **The Inferential Internalism Problem (The "Why Be Consistent?" Challenge):**
      *   **The Core Issue:** Blackburn/Gibbard show *how* a consistent expressivist *could* endorse valid inferences using their logic of attitudes/norm acceptance. But they struggle to explain *why* an agent *must* be consistent in this way, *without appealing to the very representational content they reject*.
      *   **Analogy:** Cognitivism explains logical compulsion via *truth-preservation* and the constitutive aim of *belief* (to represent truth). If you believe P and believe "If P then Q," inconsistency in *not* believing Q stems from the clash with the goal of truth.
      *   **Expressivist Challenge:** What is the *constitutive aim* of disapproval/plan-acceptance that *necessarily* compels the agent to avoid the "practical inconsistency" identified by Blackburn/Gibbard? Why *must* someone who disapproves of cruelty and endorses "If cruelty is wrong, teaching it is wrong" *thereby* disapprove of teaching it? What happens if they don't? Is it *irrationality* (and if so, defined how?) or merely a change in attitude?
      *   **Critique:** Critics argue that expressivist accounts of logical compulsion feel like an *imposition* of logical structure *onto* attitudes, rather than a *discovery* of a necessary internal logic *within* attitudes themselves. The explanation seems parasitic on the representational model it seeks to replace. (See: Dreier's "Internalism and Speaker Relativism," Schroeder's *Being For*).

  2.  **Truth Minimalism & Creeping Representationalism:**
      *   **Blackburn's Move:** Quasi-realism embraces minimalism about truth: "Cruelty is wrong" is true iff cruelty is wrong. This allows expressivists to *mimic* realist talk of truth, belief, and assertion.
      *   **The Problem:** Critics argue this minimalism risks *collapsing* the distinction between expressivism and cognitivism. If "Cruelty is wrong" is a belief (minimally defined) that is truth-apt (minimally defined), and its truth conditions are explained expressively, what *explanatory work* is the non-cognitive attitude *doing* that isn't done by a cognitivist account? The worry is that quasi-realism achieves logical coherence only by becoming functionally indistinguishable from realism at the semantic level, undermining its *distinctive* anti-realist motivation. (The "Problem of Creeping Minimalism" - Dreier, "Meta-ethics and the Problem of Creeping Minimalism").

  3.  **The Negation Problem (Schroeder's Challenge):**
      *   **The Specific Issue:** Mark Schroeder argued that expressivist accounts struggle particularly with *negation* in complex embeddings.
      *   **The Challenge:** Consider "Murder is not wrong." For an expressivist, what attitude does this express? Is it the *absence* of disapproval? Or a *positive* attitude *against* disapproving? Each option causes problems when embedded, especially in conditionals like "If murder is not wrong, then..." or when contrasted with "It is not the case that murder is wrong" (if treated differently). Blackburn/Gibbard's frameworks *can* handle these within their systems, but Schroeder and others argue the resulting explanations are *prohibitively complex* and *ad hoc* compared to the straightforward representational account. (*Being For: Evaluating the Semantic Program of Expressivism*).

  4.  **Complexity and Explanatory Burden:**
      *   **The Contrast:** Cognitivism offers a relatively simple, unified account of meaning and logic: propositions represent states of affairs; logic governs relations between propositional contents.
      *   **Expressivist Cost:** Expressivism requires a fundamentally different, highly complex semantic machinery (higher-order attitudes, plan-laden states, complex state transitions) *just to replicate* the logical inferences that fall out naturally on a representational view. Critics argue this complexity is a significant theoretical cost. Even if formally possible, it raises doubts about whether expressivism provides the *best explanation* of moral discourse.

  5.  **Hybrid Expressivism & Newer Developments:**
      *   **Why it Resurfaces:** The resurgence isn't just inertia; it's because newer expressivist theories (hybrid theories like Ridge's ecumenical expressivism, or dynamic semantic approaches like Charlow's) attempt to solve *other* problems (e.g., moral perception, disagreement, motivation) or offer simpler semantics.
      *   **The Catch:** Any new expressivist framework *must* re-engage with Frege-Geach. It's a fundamental test of adequacy. Does *this* hybrid account explain the validity of modus ponens with moral conditionals? How does *this* dynamic system update states for negated moral claims? Each new proposal reopens the technical question: "Yes, but can *your specific version* handle *all* the embedding contexts *elegantly* and *without* collapsing into cognitivism or introducing new problems?" This keeps Frege-Geach perpetually on the table as a benchmark.

  **Characterizing the Dialectic for Your Paper:**

  1.  **Acknowledge the Triumph (but qualify it):** "Blackburn's quasi-realism and Gibbard's norm-expressivism represent monumental achievements in expressivist theory. By developing sophisticated logics of attitudes and norm acceptance, they demonstrated that expressivism possesses the formal resources to account for the surface logic of moral discourse, effectively answering the *formal challenge* posed by Frege-Geach. It is widely acknowledged that expressivism is no longer *fatally undermined* by this problem in its crude mid-century form."
  2.  **Highlight the Persistent Concerns:** "However, significant philosophical debates persist regarding the *explanatory adequacy* and *metaphysical cost* of these solutions. Leading specialists continue to argue that quasi-realist and norm-expressivist accounts:
      *   Fail to provide a fully satisfying explanation of *inferential internalism*—why agents *must* conform to moral logic—that is distinct from and equally compelling as the cognitivist appeal to truth-preservation (Challenge 1).
      *   Risk collapsing into a form of representationalism via their reliance on truth minimalism, potentially undermining expressivism's core anti-realist motivation (Challenge 2).
      *   Face persistent technical hurdles, particularly concerning negation and complex embeddings, leading to arguably ad hoc or overly complex semantic machinery compared to cognitivist alternatives (Challenges 3 & 4).
      *   Remain vulnerable to reformulated challenges within newer expressivist frameworks (hybrid, dynamic), ensuring Frege-Geach remains a critical benchmark for any non-cognitivist theory (Challenge 5)."
  3.  **State the Current Status:** "Consequently, while the Frege-Geach problem is no longer seen as an insurmountable *obstacle* to expressivism, it remains a vital *testing ground* and a source of profound *philosophical pressure*. Expressivists have shown *how* their theory can accommodate logic, but the debate centers on whether this accommodation is achieved elegantly, without compromising expressivism's distinctiveness, and with a genuinely non-representational explanation of logical compulsion. It is therefore accurate to characterize Frege-Geach not as a 'dead' objection, but as a transformed and enduring challenge concerning the *explanatory depth* and *metaphysical economy* of expressivist semantics."

  **Why it Stays on Syllabi:**

  *   **Pedagogical Value:** It's a crystal-clear illustration of the *fundamental challenge* facing any non-representational theory of meaning. It forces students to grapple with compositionality and logic.
  *   **Historical Significance:** It *was* the major hurdle for decades, and understanding the solutions requires understanding the problem.
  *   **Ongoing Relevance:** As you note, it *is* still actively debated in technical forms. Teaching the classic problem provides the tools to engage with current literature on hybrids/dynamics.
  *   **Benchmarking:** It serves as a key benchmark to compare the relative simplicity/explanatory power of expressivism vs. its rivals (realism, error theory).

  Your instinct that Blackburn/Gibbard provided powerful answers is correct. But the specialist debate rightly focuses on whether those answers are the *final* word or whether they expose deeper challenges about the very nature of attitude expression, logic, and explanation. Good luck with your qualifying paper!
