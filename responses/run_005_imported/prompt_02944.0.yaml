  Breaking it down: Quine's naturalism requires ontological commitments to be grounded in empirical science. His observation sentences provide the "checkpoints" for theory. In ethics, he explicitly denies such checkpoints exist - moral disagreements lack the direct perceptual triggers that resolve scientific disputes. That's why his dog/turnip example matters: it shows behavior blending belief/desire without clean observational anchors.

  Now Enoch's move: equating math's role in science with morality's role in deliberation. But for Quine, the contexts are fundamentally different. Scientific indispensability earns ontological rights precisely because it's part of an empirically anchored web. Practical deliberation lacks that empirical footing - it's about decision-making, not explaining observations. 

  The holism point cuts deeper. Quine sees science as one interconnected system where math is inextricable from physics. Moral claims don't similarly integrate; they're parallel to the scientific web, not woven into it. His 1978 paper treats ethics as meaningful discourse but methodologically "shakier" - precisely because it floats free of observation.

  I imagine Quine would reject Enoch's analogy as category error. Mathematical entities earn their keep by enabling predictions about observable reality. Moral facts, even if "indispensable" for choosing actions, don't play that truth-conferring role. They're desires dressed as beliefs - hence his noncognitivist leanings in the essay.

  The user wants a defended verdict, so I'll build to this: Quine would block Enoch's move because moral deliberation lacks the empirical constraint that makes indispensability ontologically significant in science. His naturalism draws a bright line where Enoch sees continuity.
answer: |-
  Based on Quine's core commitments—naturalism, holism, empiricist grounding, and his specific views on ethics—he would **reject Enoch's extension of the indispensability argument to moral realism**. Here's a step-by-step reconstruction of his reasoning, followed by a verdict:

  ### Core Quinean Principles Blocking Enoch's Move
  1.  **The Primacy of Empirical Anchoring:**
      *   For Quine, the indispensability argument works *only* because mathematical entities are embedded within our *best scientific theories*, which are ultimately tested against **observation sentences**. These sentences (e.g., "Rabbit!") provide the shared, intersubjective tribunal grounding scientific discourse. Their trigger is sensory stimulation, forcing assent under similar conditions.
      *   Ethics, as Quine explicitly argued in "On the Nature of Moral Values," lacks such observational anchors. There are no "moral observation sentences" triggered by sensory input that compel universal assent. Disagreements over values (e.g., "That's unjust!") persist even when parties agree on all non-moral facts. This absence of empirical checkpoints renders moral discourse methodologically "shakier."
      *   **Therefore:** Indispensability *without empirical grounding* is ontologically inert for Quine. Moral facts might be "indispensable" to *deliberation*, but deliberation lacks the empirical constraint and confirmatory mechanism of science.

  2.  **Holism's Scope is Scientific:**
      *   Quinean holism—the view that theories face experience as a whole web of belief—applies to our *scientific* conceptual scheme. We posit entities (like numbers) because they are indispensable components *of that specific web* which is constantly calibrated against sensory input.
      *   Practical deliberation, while crucial to human life, is not part of *that same holistically tested web*. It operates in a different domain, governed by desires, preferences, and social norms rather than empirical prediction and explanation. Quine's dog/turnip example emphasizes that behavior blends belief (scientific) and desire (practical) inextricably, but this fusion doesn't grant the desire-component the same epistemic or ontological status as the belief-component embedded in the scientific web.
      *   **Therefore:** Extending holism's ontological implications beyond the scientifically testable web violates Quine's naturalism. Deliberation's "web" isn't confirmed by the same empirical standards.

  3.  **Naturalism's Boundary:**
      *   Quine's naturalism entails that epistemology (and thus ontology) is continuous with science. What exists is what our best scientific theories quantify over. While science might someday explain *why* we have moral sentiments or engage in moral discourse (a project Quine wouldn't dismiss), this is distinct from positing *moral facts* as real entities within the scientific ontology.
      *   Enoch's argument places moral facts on par with mathematical facts *within the scientific enterprise*. Quine would see this as a category error. Mathematics is indispensable *within physics* for describing and predicting observable phenomena. Moral facts are proposed as indispensable *for making decisions about action*, a fundamentally different kind of "indispensability" not tied to empirical explanation/prediction.
      *   **Therefore:** Naturalism restricts legitimate ontology to entities playing a role in explaining/predicting sensory experience. Moral facts, as Enoch conceives them, do not play *that* role, even if they play a crucial practical role.

  4.  **Quine's View of Ethics: Noncognitivist Leaning:**
      *   While Quine stopped short of declaring moral statements meaningless, his 1978 essay strongly suggests a noncognitivist interpretation. The lack of observational anchors and the entanglement of belief/desire point towards seeing moral judgments as expressions of attitude or desire rather than truth-apt descriptions of facts. Calling ethics "shakier" methodologically implies it lacks the cognitive robustness of science.
      *   **Therefore:** Quine likely saw moral discourse as fundamentally *different in kind* from scientific discourse. Granting moral judgments the same ontological weight as scientific posits via indispensability would contradict this core distinction based on methodological security.

  ### Could Quine Accept Enoch? Countervailing Considerations (and Why They Fail)
  *   **Holism Might Seem Expansive:** Holism *could* theoretically encompass all belief, including practical reasoning. However, Quine consistently applied holism's confirmatory aspect *only* to the scientific web tested against experience. Deliberation isn't confirmed; it's undertaken.
  *   **"Everything is Science"?** Quine's broad view of science might suggest room for ethics. But his 1978 essay explicitly demarcates ethics based on its lack of observational input. His naturalism is *scientistic* – science (empirically grounded) is the arbiter of reality.
  *   **Indispensability is Formal:** The argument structure *looks* analogous. But for Quine, the *context* of indispensability (scientific explanation vs. practical deliberation) is decisive. The form is empty without the correct empirical context.

  ### Verdict: Quine's Likely Response
  **Quine would have rejected Enoch's moral indispensability argument as an illegitimate extension of his own.**

  His reasoning would center on the **fundamental disanalogy in empirical grounding**. He would argue:

  1.  Mathematical posits earn ontological rights *solely* through their indispensable role within our best theories of **empirical phenomena**, theories validated by their ability to predict and explain observation sentences.
  2.  Moral "facts," while perhaps indispensable for **practical decision-making**, lack any constitutive link to the tribunal of sensory experience. There is no equivalent to an observation sentence forcing assent in ethics.
  3.  Therefore, the kind of indispensability moral facts exhibit is categorically different from the scientific indispensability that justifies ontological commitment. Granting them the same status ignores the core empiricist anchor and methodological distinction Quine insisted upon. Ethics, for Quine, remained meaningful discourse, but discourse operating without the empirical foundations necessary for its claims to license beliefs in corresponding facts within a naturalistic ontology. Enoch's move, while cleverly mirroring the structure, fails because it applies the argument in a domain Quine's naturalism and empiricism deemed ontologically inert.
