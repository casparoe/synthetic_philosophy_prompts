answer: |-
  Here’s the strongest case for Bentham’s inconsistency, built entirely within his own hedonistic framework and focusing on the core tension in his argument:

  **The Core Argument for Inconsistency:**

  1.  **The Axiom of Neutrality:** Bentham's hedonic calculus is fundamentally *descriptive* and *source-neutral*. Its sole purpose is to quantify pleasure and pain to determine net utility. The seven dimensions (Intensity, Duration, Certainty, Propinquity, Fecundity, Purity, Extent) explicitly do *not* inquire into the *moral quality*, *reasonableness*, or *origin* of the feeling. As Bentham states: "Prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry" – all that matters is the pleasure produced.
  2.  **Antipathy-Pain as Real Pain:** The pain experienced by individuals due to knowing consensual same-sex acts occur ("antipathy-pain") demonstrably exists. It possesses:
      *   **Intensity:** It can be intense revulsion or moral outrage.
      *   **Duration:** It can be persistent, especially if the "knowledge" is widespread or constantly reinforced.
      *   **Certainty:** The pain is certain *for those experiencing it* upon believing the acts occur.
      *   **Propinquity:** In a small, interconnected community, the feeling might be quite proximate; in larger societies, Bentham himself argued propinquity mattered less for policy.
      *   **Fecundity:** It can lead to secondary pains (social anxiety, fear of moral decay, desire to persecute).
      *   **Purity:** It might be mixed with other feelings (fear, religious anxiety), but so are many pains.
      *   **Extent:** Potentially vast, if a large portion of the population feels it.
  3.  **The Calculus Demands Inclusion:** According to the *strict, mechanical application* of the calculus Bentham champions, this antipathy-pain *must* be entered into the ledger as a significant negative utility. To exclude it or arbitrarily discount it violates the core principle of source-neutrality and the commitment to measuring *all* consequences. Bentham's system lacks a "reasonableness filter" *within the calculus itself*.
  4.  **Bentham's "Prejudice" Argument as an External Import:** When Bentham argues that antipathy-pain shouldn't count or counts less because it stems from prejudice, he introduces a *non-hedonic, moral* criterion. He is:
      *   **Violating Neutrality:** He is judging the *source* ("prejudice") and deeming it illegitimate *as a source of pain for calculation purposes*. This is explicitly forbidden by the descriptive, quantifying nature of the calculus.
      *   **Smuggling in the "Principle of Sympathy and Antipathy":** Ironically, Bentham fiercely criticized this very principle – acting based on feelings of like/dislike without reference to consequences – as the foundation of all bad moral systems. By dismissing the pain *because* it arises from antipathy/prejudice, he commits the same error: he is rejecting the *consequence* (the pain) based on the *feeling* (antipathy) that caused it, rather than its measurable hedonic impact.
      *   **Making an Ad Hoc Exception:** There is *no principle within the calculus* that allows discounting pains arising from socially conditioned disgust any more than it allows discounting pleasures arising from socially approved sources. If the pain of a bigot counts less, why doesn't the pleasure of a philanthropist motivated by social approval count less? The calculus doesn't care about motives, only sensations.
  5.  **The Slippery Slope of Discounting:** If Bentham can discount this pain because it's based on prejudice, what principle prevents discounting *other* pains deemed "unreasonable"? Could the pain of a racist offended by interracial marriage be discounted? The pain of a religious fundamentalist offended by blasphemy? Bentham's move opens the door to subjective judgments about which pains are "valid," precisely the kind of non-utilitarian moralizing his system was designed to eliminate. His own universalism collapses.
  6.  **The Fundamental Hedonic Commitment:** Strict hedonistic utilitarianism is committed to the proposition that *pain is pain*, regardless of its cognitive source. A headache caused by a tumor, by reading offensive philosophy, or by contemplating consensual sodomy is still a headache – a negative sensation demanding inclusion in the calculus. To deny this is to abandon the core tenet that only sensations of pleasure and pain have ultimate value/disvalue.

  **Why this is a quiet departure, not an application:**

  Bentham *needs* the decriminalization conclusion, likely driven by his own Enlightenment liberalism and recognition of the immense suffering caused by persecution. However, the *strict mechanical calculus*, applied neutrally, risks being overwhelmed by widespread, intense social disgust. His solution – labeling the pain as "prejudice" and discounting it – isn't a *deduction* from the calculus. It's an *external moral judgment* smuggled in to *override* the result a purely mechanical application might yield. He is prioritizing a *liberal* conclusion (individual liberty absent direct harm) over the *strict utilitarian* demand to count *all* pains, even irrational ones. This is a departure into rule-of-thumb liberalism or implicit rights theory, masked as pure utility calculation.

  **In essence:** Bentham's dismissal of antipathy-pain isn't utilitarianism working consistently; it's utilitarianism *failing* to deliver the liberal result he desires, forcing him to *temporarily abandon* its core source-neutral, quantifying principle to achieve that result. He sacrifices the purity of his hedonistic method to avoid a conclusion he finds morally repugnant – an act necessitated by the very method's potential to validate widespread prejudice as a legitimate source of disutility. This reveals a critical tension within the theory when faced with the visceral power of collective disgust.
