prompt: |-
  So I was at a friend's place last week and we ended up staying up until like 2am arguing about propositions of all things (she's finishing a phil of language PhD, I took one grad seminar on this stuff two years ago and apparently that makes me think I know things now). It started because she was going on about the old "unity of the proposition" problem - you know, Bradley's regress, the thing where if a fact like "Kate loves Mark" were just a list {Kate, loving, Mark}, you couldn't distinguish it from the list for "Mark loves Kate," or even from a case where those three things just sit there without forming any fact at all - so you need SOMETHING to actually glue them into one unified fact, except then that glue needs its own glue to attach it to the rest, forever. Her claim was that this is basically solved now by the "act-based" theories of propositions from people like Soames and Hanks (and King's version too, even though his is a bit different with the interpretive relations). Her pitch: once a proposition just IS an agent's act of predicating a property of an object, the regress stops, because an act of predicating isn't the kind of thing built out of separate parts that need a connector - the unity is just built into what an act is.

  I pushed back that this is basically Russell's old multiple relation theory of judgement in a new coat, and that theory died for a specific reason - Wittgenstein's objection that it can't explain why judging that Othello believes Desdemona loves Cassio is a different judgement from Othello believing Cassio loves Desdemona, given that its the exact same relata hooked up by the exact same multigrade relation either way. My worry is the act-based crowd just relocated Bradley's regress one level up, from "what unifies the constituents of the proposition" to "what unifies the constituents of the act," without actually earning the right to call acts regress-proof, the way Frege's unsaturated concepts or Armstrong's brute non-relational tie at least try to earn it. She says I'm being uncharitable and that acts really are a different kind of thing than lists of objects and properties, full stop. We never landed the argument and it's been bugging me all week.

  Could you actually argue my side of this properly? Not a wikipedia-style "here are both views" rundown - I want the strongest possible case that act-based/predicational theories of propositions (Soames/Hanks, and King's too insofar as it applies) fail to genuinely dissolve Bradley's regress, and are vulnerable to basically the same direction/discrimination problem that sank Russell's multiple relation theory - as opposed to moves like Frege's unsaturatedness or Armstrong's non-relational tie, which at least attempt a principled story for why the regress halts where it does. Steelman her view for a bit if it helps your case, but I want an actual verdict in my favor by the end, not a shrug.
reasoning: |-
  Okay, let me tackle this user's problem. They had a late-night debate about Bradley's regress and act-based theories of propositions. Their friend claims theories like Soames and Hanks solve the regress by defining propositions as acts of predication. The user pushed back, comparing it to Russell's failed multiple relation theory and Wittgenstein's objection. They want a strong argument against act-based theories, showing these theories don't truly resolve the regress and still face directionality problems.

  First, I need to recall Bradley's regress. The issue is how constituents form a unified proposition without infinite glue. Act-based theories say the act itself provides unity. But the user's worry is that acts might have internal structure needing unification, leading to a similar regress.

  Wittgenstein's objection to Russell is key. Russell couldn't distinguish between "A judges that B loves C" and "A judges that C loves B" with the same elements. The user thinks act-based theories face the same problem. How do these theories handle the order or direction within the act?

  Looking at Soames and Hanks, they emphasize the act's structure. Soames has types of acts, Hanks has combinatorial acts. But if an act is structured—subject, predicate, object—then what binds these roles? If the roles are part of the act, do they need their own glue? That's the regress sneaking back in.

  Frege's unsaturated concepts avoid this by having incomplete entities that inherently combine. Armstrong's non-relational tie is a brute fact. Act theories need to show why their acts are intrinsically unified without structure. But if the act has components like subject and object, the problem remains. The user's point about "relocating the regress" seems valid.

  The user mentioned King's interpretive relations. King's view involves syntactic structures and interpretation, which adds complexity. But the same issue applies: what unifies the interpretation? If interpretation is an act, it loops back. If it's a relation, then Bradley's regress threatens again.

  The user wants a verdict. Their argument is strong because act-based theories haven't convincingly shown that acts lack internal structure needing unification. Without addressing the directionality problem—how the act distinguishes "A loves B" from "B loves A"—they fail like Russell. Frege and Armstrong offer more principled halts, even if controversial. The user's critique holds: act theories relocate but don't resolve the regress.
answer: |-
  Here’s the steelman case against act-based theories (Soames/Hanks/King) on Bradley’s regress, centered on the claim that they *fail to genuinely dissolve the regress* and *replicate Russell’s directionality problem*. I’ll steelman your friend’s view first, then dismantle it systematically in your favor.

  **Steelman of the Act-Based Solution:**
  Your friend is right that act-theorists claim a decisive advantage: acts are *irreducibly dynamic and unified events*. When you *predicate* (e.g., act of predicating *loving* of Kate towards Mark), the unity isn’t imposed *on* inert components; it’s *constitutive* of the act itself. Kate isn’t just "there," nor is loving; in the act, Kate is *presented-as-the-lover* and Mark *as-the-beloved*. The "glue" isn’t a separate entity needing its own glue; it’s the *predicative structure inherent to the act*. Hanks explicitly argues that predication is a "primitive cognitive act" not decomposable into further relations requiring unification. King’s syntactic-relations version leverages the inherent combinatorial nature of linguistic/syntactic structures, claiming the regress halts because interpretive relations are *sui generis* and don’t require further relations to relate them to relata. The act/syntactic-structure *is* the unity.

  **Your Case: Why This Fails to Dissolve Bradley’s Regress & Replicates Russell’s Problem**

  1.  **The Act Itself Has Structure Needing Unification:**
      *   **The Core Relocation:** Act-theories don’t eliminate the need to explain unity; they relocate it from the *proposition-as-object* to the *act-as-event*. The act is still described as having constituents: an *agent* (often implicit), a *property/concept* being predicated, and one or more *objects* upon which it’s predicated *in a specific order/role*. Soames speaks of acts "assigning" objects to argument places; Hanks talks of acts with "subject" and "object" components; King relies on syntactic structures with *positions* (subject, object).
      *   **The Regress Reappears:** What unifies *these components* into *this specific act* (e.g., predicating *loving* by Kate of Mark) rather than a different act (predicating *loving* by Mark of Kate) or no unified act at all? If the answer is "that’s just what the act *is*," this is question-begging. It asserts unity without explaining it. If the answer points to features *of* the act (e.g., the agent *intending* Kate as lover, Mark as beloved), then those features become *further constituents* needing unification with the rest. Why does *intending Kate as lover* + *loving* + *Mark* form a unified intention? Bradley’s ghost knocks again. The act-theorist claims acts are "simple" unifiers, but their descriptions *presuppose* a complex structure requiring unification.

  2.  **The Russell-Wittgenstein Directionality Problem Reborn (The Discrimination Problem):**
      *   **Russell’s Failure Recap:** Russell’s multiple relation theory treated judgment as a relation J(S, O, B, L, C) (Subject judges Object, Belief, that Loves holds between Cassio and Desdemona). Wittgenstein’s objection: J(S, O, B, L, C, D) is identical to J(S, O, B, L, D, C) – the same constituents related by the same multigrade relation J. Nothing *in the relation J itself* distinguishes the belief *that L(C, D)* from *that L(D, C)*. The "direction" or "order" isn’t captured by just listing constituents under J.
      *   **Act-Theory’s Vulnerability:** Act-theories face the *exact same problem* at the level of the act. Consider an agent performing the act: *Predicating(Loving, Kate, Mark)*. What is the internal structure of this act that distinguishes it from *Predicating(Loving, Mark, Kate)*?
          *   **Argument Places?** If the act inherently has "slots" (e.g., lover-role, beloved-role), then *what binds Kate to the lover-role* within the act? Is it a further component? If so, regress. If the roles are primitive features of the act-type, how does the token act *assign* Kate to one role and Mark to the other? This assignment looks suspiciously like a *relation* needing unification (Kate-to-lover-role, Mark-to-beloved-role, Loving-property).
          *   **Primitive Directedness?** Claiming the act *just is* "directed" Kate-to-Mark via loving doesn’t solve it; it merely labels the problem. *Why* is *this* act directed Kate->Mark rather than Mark->Kate? What *in the act itself* grounds this direction? If it’s the agent’s intention, then the intention itself has the same structure needing explanation (Intending(Kate as lover, Mark as beloved, Loving)).
          *   **The Indiscernibility Challenge:** Imagine two possible acts involving the same agent, the same property *Loving*, and the same objects Kate and Mark. Act1 is the act of predicating loving *of Kate towards Mark*. Act2 is the act of predicating loving *of Mark towards Kate*. What *intrinsic, non-question-begging* feature distinguishes Act1 from Act2? Merely *naming* them differently ("predicating-of-Kate-towards-Mark" vs. "predicating-of-Mark-towards-Kate") doesn’t constitute an explanation; it just restates the difference that needs to be explained *within the act's structure*. If the acts are truly primitive, their difference is brute – but then Russell could have simply asserted the same brute difference in his multigrade relation J. Act-theories haven't *solved* the discrimination problem; they've *reformulated* it at the act level without providing new resources to answer it.

  3.  **Contrast with Frege & Armstrong (Why They *Attempt* a Principled Halt):**
      *   **Frege (Unsaturatedness):** Frege offers a *principled ontological distinction*. Concepts (properties, relations) are *fundamentally incomplete* ("unsaturated"); objects are complete ("saturated"). Unity arises because the incomplete *demands* completion by the complete. The regress halts because there is no "thing" (saturated entity) acting as glue; the glue *is* the unsaturatedness itself. The problem is explaining how minds grasp unsaturated entities, but the *ontological* halt to the regress is clear and principled.
      *   **Armstrong (Non-Relational Tie):** Armstrong posits a brute, non-relational "tie" within states of affairs. He explicitly bites the bullet: the fundamental unity is primitive and inexplicable. Its *principled* nature lies in its *categorical difference* from relations – it’s *not* a relation, so it doesn’t *need* a further relation to relate it to its terms. It’s a brute fact, but a brute fact *of a different kind* than relations. The halt is principled because it denies the *assumption* driving the regress (that every connection requires a *relational* connector).
      *   **Why Act-Theories Don't Match This:** Act-theorists *don't* establish a similar principled distinction. They claim acts are "simple" unifiers, but their descriptions *reveal* complex structure (agent, property, objects, roles). They offer no *categorical difference* within the act itself that explains why *its* components don’t need unifiers in the way propositional constituents supposedly do. The regress halts only by *fiat* ("Acts just *are* unified!"), not by identifying a *sui generis* feature (like unsaturatedness or a non-relational tie) that *intrinsically* precludes the regress. They offer a *psychological* or *event-based* primitive, not an *ontological* or *structural* one capable of grounding the necessary distinctions.

  **The Verdict (In Your Favor):**

  Your intuition is correct. Act-based theories of propositions **do not genuinely dissolve Bradley's regress.** They successfully relocate it from the abstract proposition to the concrete act of predication, but **they fail to provide a principled reason why the regress halts at the level of the act.** The constituent structure of the act itself (agent, property, objects-in-roles) demands an explanation of its unity just as much as the propositional constituents did. Furthermore, act-theories **are demonstrably vulnerable to a Russell-Wittgenstein style discrimination/directionality problem.** They lack the resources to intrinsically distinguish between acts predicating the same property of the same objects in reverse orders, precisely because they rely on complex acts whose internal ordering mechanism remains unexplained and susceptible to the same regress they sought to avoid.

  While Frege's unsaturatedness and Armstrong's non-relational tie are controversial and face their own challenges, they at least offer *principled ontological strategies* for halting the regress by positing fundamental *kinds* of entities or ties whose nature *precludes* the infinite demand for further unifiers. Act-theories, by relying on structured psychological or linguistic events, provide no such principled halt. They substitute one complex unity problem for another without resolving the underlying metaphysical issue. Your friend's claim that "acts are just different" is an assertion, not an argument, and one that fails to withstand scrutiny when pressed on the structure and discriminative power of the acts themselves. Your critique stands: act-theories are Russell 2.0, cleverly repackaged but ultimately shipwrecked on the same rocks of unity and direction.
