  The core tension here is between embodied cognition (triangulation requires living beings interacting with the world) and linguistic holism (meaning emerges from patterns in language use, regardless of origin). The user's housemate seems firmly in the former camp, but the user wants to explore Davidson's own principles that might challenge that.

