prompt: |-
  My uncle passed away in August and left a chunk of money to a tiny family foundation he'd run out of his study for like 20 years, and somehow I've inherited his seat on the board -- its just me, my cousin, and his old buisness partner Hal. We have to decide by our call on the 30th where this year's roughly $80k in grants goes, and it's come down to two finalists: Against Malaria Foundation (bednets, the GiveWell darling, extremely well-evidenced cost per life saved) or a scholarship fund for kids in our uncle's hometown. My cousin's dead set on AMF because the evidence is so much stronger. Hal keeps pushing back that we actually have no idea whether saving lives via bednets is even net good once you look downstream -- more surviving kids means more people consuming stuff, more animals farmed, more emissions, who knows -- and that nobody can honestly sign the net effect, so treating "lives saved" as the bottom line is kind of a shell game. My cousin's counter is that the same objection applies just as much to the scholarship fund, which also has totally unknowable ripple effects down the line, so it can't actually favor one option over the other -- Hal's basically just found a fancy way to justify doing whatever he already wanted. The foundation's one-page charter says we should fund "the most effective, evidence-backed" causes, and now all three of us read that phrase differently. Can you write the short memo I'll send Hal and my cousin before the call -- it needs an actual recommendation (fund one, fund both, split some other way, whatever), a next step with a deadline, and it has to take Hal's objection seriously instead of just waving it off, since "AMF has better RCTs" is exactly what's in dispute.
reasoning: |-
  Okay, let me unpack this user's dilemma. They're thrust into a foundation decision with emotional weight (uncle's legacy) and philosophical complexity. The core tension is between AMF's proven bednet effectiveness and Hal's systemic concerns about unintended consequences. 

  First, I notice the user needs more than just analysis - they need a diplomatic framework to unstick three stubborn perspectives. The cousin's evidence-based rigidity, Hal's consequentialist skepticism, and the user's own mediating role all matter. The memo must validate each viewpoint while creating forward motion.

  Hmm... Hal's "downstream effects" argument is intellectually serious but operationally paralyzing. If we take it literally, no humanitarian intervention could ever be approved. Yet dismissing it makes the cousin seem dogmatic. The scholarship alternative doesn't solve this - as the cousin rightly notes, it has the same uncertainty. 

  Ah! The key is recognizing that all philanthropy accepts some unknown ripple effects. The question is where we draw the "accountability boundary." AMF's boundary is clear: prevent malaria deaths. Scholarship effects are inherently more diffuse. This distinction lets us honor Hal's concern while choosing action.

  For the recommendation... splitting makes sense psychologically. Hal gets his hometown nod (emotional resonance), cousin gets majority to AMF (evidence respect), and the uncle's "evidence-backed" charter is satisfied by the AMF portion. The $60k/$20k split weights it meaningfully toward evidence without ignoring legacy.

  Deadline pressure helps - setting prep tasks for the call forces engagement. Asking each person to articulate their metric for "effectiveness" might reveal common ground. And crucially, the memo avoids academic debates, focusing instead on practical decision-making under uncertainty. 

  I should emphasize that "no guarantees" isn't weakness - it's intellectual honesty. The foundation isn't omniscient, just responsible. That framing might satisfy Hal while allowing action. And highlighting AMF's scalability subtly reinforces why evidence matters, even with unknowns.
answer: |-
  **MEMORANDUM**  
  **TO:** Hal & [Cousin’s Name]  
  **FROM:** [Your Name]  
  **DATE:** [Current Date]  
  **SUBJECT:** Foundation Grant Recommendation & Next Steps for 30th Call  

  ### **I. Context**  
  Thank you both for your rigorous engagement on this decision. I’ve synthesized our debate around two valid perspectives:  
  - **AMF’s evidence-backed efficiency** (cost per life saved via bednets), and  
  - **Hal’s concern about unknowable downstream consequences** (demographic/environmental ripple effects of saving lives).  

  Hal’s critique—that no intervention can claim *net positive* certainty—is philosophically robust. However, as [Cousin] notes, this uncertainty applies equally to the scholarship fund. Thus, the question becomes: **How do we act responsibly when *all* philanthropy faces irreducible uncertainty?**  

  ### **II. Recommendation: Split Funding (80% AMF, 20% Scholarship Fund)**  
  | **Recipient**       | **Amount** | **Rationale**                                                                 |
  |----------------------|------------|-------------------------------------------------------------------------------|
  | **Against Malaria** | **$64,000** | Addresses the charter’s "evidence-backed" mandate with the strongest *direct* proof of impact (lives saved). Hal’s concerns, while valid, don’t invalidate AMF’s evidence; they highlight universal limits of philanthropy. |
  | **Hometown Scholarships** | **$16,000** | Honors Hal’s emphasis on local legacy/accountability. Scholarships have tangible local alignment (fulfilling "effectiveness" via community trust) and mitigate "unknowable futures" by operating at human scale. |  

  **Why this split?**  
  - **Balances evidence and humility**: AMF’s RCTs represent the *best available proof* under the charter. Ignoring this risks violating our mandate.  
  - **Acknowledges Hal’s lens**: Scholarships let us observe impacts more closely (e.g., tracking recipients), addressing uncertainty through proximity.  
  - **Avoids paralysis**: If we reject AMF over systemic unknowns, we must reject *all* interventions—including scholarships. Action requires accepting bounded rationality.  

  ### **III. Why Not Fully Fund Either?**  
  - **AMF alone** dismisses Hal’s valid caution about detached efficacy and our uncle’s roots.  
  - **Scholarships alone** ignores the charter’s "evidence-backed" clause—AMF’s data is objectively stronger.  
  - **Splitting ensures**: We meet fiduciary duty (evidence) while respecting Hal’s ethical rigor.  

  ### **IV. Next Steps & Deadline**  
  1. **By 5 PM on [Date, e.g., 29th]**:  
     - Hal & [Cousin]: Email one paragraph on how you’ll evaluate impact *next year* (e.g., "Track scholarship recipients' careers" or "Review AMF’s latest outcome reports").  
     - [I] will draft a 2025 impact framework based on your inputs.  
  2. **On 30th Call**: We finalize the split (adjustable if new consensus emerges) and approve grants.  

  ### **V. Final Thought**  
  Philanthropy navigates uncertainty. AMF offers proven harm reduction *now*; scholarships offer relational accountability. This split honors our roles: [Cousin] as evidence guardian, Hal as systemic conscience, and me as steward of our uncle’s pragmatism.  

  Let’s move forward with clarity—and humility.  
  —[Your Name]  

  ---  
  **Key Tactical Notes**:  
  - **Tone**: Neutral bridge-building. Avoids "winning" arguments.  
  - **Hal’s Concern Addressed**: Grants legitimacy to systemic thinking while noting its universal applicability.  
  - **Charter Compliance**: AMF’s evidence meets the standard; scholarships are framed as "effectiveness via local trust."  
  - **Deadline Pressure**: Forces concrete prep, preventing circular debate on the call.  
  - **Exit Path**: Opens door for Hal to define 2025 metrics (e.g., environmental impact studies), making skepticism constructive.
