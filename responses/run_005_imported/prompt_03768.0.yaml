  ## Dialogue at Langemark: Deep Morality in the Mud

  **Setting:** Late afternoon at Langemark German Military Cemetery. Grey light filters through oak trees onto the sombre rows of identical dark stone markers. THEO (mid-30s, thoughtful, pragmatic) leans against an oak. YOU (similar age, intellectually intense, morally driven) pace slowly nearby. The weight of the place hangs heavy.

  **THEO:** (Kicks gently at a tuft of grass near a marker) Still chewing on it, huh? Tyne Cot... then here... the sheer *scale* of it. All these boys. Doesn’t feel right, somehow, walking past Karl Schmidt, 19, and thinking, "Well, *you* were actually morally worse than Tommy Atkins over there." Even if, big picture, Germany started it.

  **YOU:** It’s not about Karl Schmidt *personally* being worse. That’s the trap. It’s about the act. McMahan’s point is about *liability*. If Private Atkins is defending his home, his country – a just cause – then *he* has a right to defend himself. Karl, fighting for an aggressive war, even if he thinks he’s defending the Fatherland, is *participating* in an unjust threat. Atkins has a justification to kill Karl to stop that threat. Karl doesn’t have a justification to kill Atkins; he’s part of the threat Atkins is justified in stopping.

  **THEO:** Okay, I hear the distinction: justification vs. no justification. But that’s where the epistemic wall hits. Look around. *Karl Schmidt, 19, Hamburg.* What did *he* know? His teachers, his pastor, his local paper – all screaming about encirclement, Belgian atrocities, the need to defend German soil. You think *he* had the tools, the time, the access – hell, the *perspective* – to cut through that and correctly adjudicate that *his* government was the aggressor? That the invasion of Belgium was naked aggression? While sitting in a muddy trench waiting for a British barrage? It’s impossible. Punishing – or declaring him morally liable – for failing that impossible task *is* unfair.

  **YOU:** You’re conflating blameworthiness with liability. I *agree* Karl might be fully excused. He might be a victim of propaganda, coercion, false consciousness – whatever you want to call it. He might bear *no personal blame* for being there. But *excuse* doesn’t erase the *objective nature of the threat* he poses. If an innocent sleepwalker picks up a gun and points it at you, you’re justified in disarming them, even forcefully, even lethally if necessary. They aren't *blameworthy*, but they are *liable* to defensive force because they pose an *objectively unjust threat*. The sleepwalker is excused, but their act isn't justified. Same here. Karl might be excused, but his participation isn't justified.

  **THEO:** (Nods slowly, absorbing the distinction) Okay. Excused but not justified. I see the move. It’s cleaner, philosophically. But here’s where Walzer’s practicality bites, and where even McMahan concedes the ground. *How does this play out on the battlefield?* If Atkins *truly believes* McMahan’s deep morality, he looks at Karl and thinks, "That kid is posing an unjust threat; I am fully justified in killing him." But Karl, equally convinced *he’s* defending his homeland – because that’s all he’s ever been told – looks at Atkins and thinks *exactly the same thing*: "Invader! Unjust threat!" How do you break that symmetry *in the moment*? Each side believes their own narrative fervently. If you reject the moral equality of combatants *in practice*, you just give every soldier a license for self-righteous slaughter, convinced *they* are the justified ones. It becomes moral chaos. At least the symmetry of *jus in bello* – treat all soldiers equally under the laws of war – imposes *some* restraint, forces *some* recognition of shared humanity, even amidst the killing. It’s the only thing that *might* keep Karl from torturing Atkins if he captures him, or vice versa.

  **YOU:** (Pauses, looks down a long row of markers) That... that’s the gut punch, Theo. The practicality. McMahan *does* concede that the *laws* of war need symmetry for exactly those reasons – identification, reciprocity, preventing a descent into even worse atrocities fueled by moral certainty. But he insists that’s a tragic necessity of the *law*, masking the deeper moral truth. We shouldn’t confuse the practical rules with the underlying morality. Admitting the asymmetry *morally* might actually *help* us work harder to prevent unjust wars in the first place – to hold leaders accountable, to scrutinize causes – precisely because we stop pretending all killing in war is equally tragic in the *same* way. Some deaths are the tragic cost of defence; others are the tragic *result* of aggression.

  **THEO:** But does it help Karl? Or Atkins? In the mud? When the shell hits? The deeper morality feels... abstract. Cruelly abstract. Look at these stones. "Ein Deutscher Soldat." Unknown. Unnamed. Does the deep morality say *his* death was more morally acceptable because his cause was unjust? That Atkins killing him was a morally cleaner act than him killing Atkins? That feels... cold. Does it lessen Atkins' trauma? Does it comfort Karl’s mother? The symmetry Walzer proposes – that soldiers on both sides share a common, tragic fate, coerced by the machinery of the state – that resonates *here*. It feels like the only language this cemetery speaks: shared loss, shared victimhood of the state's ambitions. Saying "yes, but *your* son was part of an unjust threat" feels like spitting on his grave, even if it's philosophically coherent.

  **YOU:** (Quietly) It *is* cold. Abstract. Maybe that’s why walking these rows makes the revisionist argument feel almost obscene. The sheer weight of individual suffering... it drowns out the distinctions. But Theo... isn't *ignoring* the distinction also a kind of violence? Doesn't it erase the difference between defending Ypres and shelling it? Between resisting invasion and perpetrating it? Saying "all soldiers are equal" risks laundering the moral responsibility of the aggressor state, spreading it equally onto the victims. If Karl is *just as much* a victim as Atkins, doesn't that let the Kaiser and his generals off the hook? Doesn't it make *all* wars just tragic mistakes with no perpetrators, only victims? That feels... dangerously complacent. Like we learn nothing.

  **THEO:** (Sighs heavily, runs a hand through his hair) Okay. Landed a point. I don’t want to let the architects off the hook. The *state* that launched the aggression absolutely bears the primary guilt. But pinning *liability* onto the individual soldier... it feels like transferring the state’s guilt onto its most disposable pawn. Maybe the deep morality is right *in principle*, but applying it to individuals like Karl feels like blaming a cog for the machine’s purpose. The epistemic problem – the sheer impossibility of Karl knowing the truth – makes him *only* a cog, not a morally responsible agent in the deep sense you need for liability. He’s excused *because* he couldn’t know, *and* that lack of knowledge means he wasn’t truly making a morally significant choice about the threat he posed. He was just... there. Following orders he believed legitimate. Is liability possible without meaningful agency?

  **YOU:** (Stops pacing, looks directly at Theo) That... that might be the hardest question. Can you be *liable* for posing a threat if you genuinely, non-culpably, believe you're doing right? If your agency is so profoundly compromised? The sleepwalker has *no* agency. Karl had *some*, but was it *enough* for the kind of moral liability that justifies killing? Or is he just a tragic object in the path of Atkins' justified defence? Maybe... maybe the deep morality only *fully* bites on those who *knowingly* fight for an unjust cause. The volunteers, the true believers, the officers who see the bigger picture. For the Karl Schmidts... maybe they inhabit a terrible grey zone. Excused, posing an unjust threat objectively, but perhaps not *fully* liable in the way a knowing aggressor is. Their deaths are a profound tragedy *compounded* by the injustice of the war itself. Not less tragic than Atkins, but... differently tragic. Rooted in the aggression that put him there. (Shakes head) But that feels messy. Unsatisfactory.

  **THEO:** (A grim, understanding smile) War *is* messy. Philosophy tries to clean it up. Maybe Walzer’s symmetry is the best dirty bandage we have for the bleeding mess of individual soldiers caught in the gears. Maybe McMahan’s deep morality is the scalpel we need to dissect the disease of aggression afterwards. But here... (gestures at the graves)... it just feels like loss. Profound, equal loss. Maybe that’s the only truth these stones tell. Come on. Last light. Let’s head back. We won’t solve it today. Maybe ever.

  **YOU:** (Nods, takes a last look at the rows of dark stone) No. We won’t solve it. But... thanks for pushing back. Hard.

  **(They turn and walk slowly towards the cemetery entrance, the weight of the unanswered questions as heavy as the grey stone markers in the fading light.)**

  **Key Points Landed:**
  1.  **Theo's Epistemic/Combat Reality Punch:** Theo effectively forced the narrator to confront the *practical impossibility* of soldiers adjudicating *jus ad bellum* in real-time and the dangerous potential for moral chaos and increased brutality if soldiers acted on asymmetric moral beliefs. He tied this powerfully to the visceral reality of the graves and the function of symmetrical *jus in bello* as a necessary, if tragic, restraint.
  2.  **Narrator's Distinction & State Accountability Punch:** The narrator successfully drove home the crucial difference between *excuse* (Karl's potential blamelessness) and *justification* (the objective unjustness of his threat), preventing Theo from collapsing the two. They also landed a strong point about how symmetrical moral equality risks *erasing* the crucial distinction between aggression and defense at the state level, potentially absolving aggressor states by diffusing responsibility equally onto victims. Theo visibly struggled with this implication of state-level accountability being undermined.
  3.  **Mutual Struggle:** Theo genuinely made the narrator grapple with whether non-culpable ignorance *undermines the very basis for liability*, turning the soldier into more of an object than a morally liable agent. The narrator made Theo confront the uncomfortable potential complacency and moral laundering inherent in treating all soldiers as equally tragic victims, obscuring the roots of aggression. Neither fully resolved the other's strongest challenge.
