prompt: |-
  So, I'm a retired evolutionary biologist (forty years of cichlid fish speciation) who's gotten hooked on metaethics since retiring. I'm prepping questions for a live Q&A at our local philosophy circle with a guest who defends a Street-style Darwinian Dilemma against moral realism: natural selection shaped our moral attitudes for fitness, not truth-tracking, so (if I've got this right) its a huge coincidence if they happen to line up with mind-independent moral facts. Can you draft me 8-10 questions that push past her just restating that setup? I want one on the third-factor replies (the Enoch/Wielenberg move, where some natural fact is supposed to explain both why a belief is adaptive and why it's true, so the coincidence dissolves), one on whether the same argument debunks our trust in logic or evolutionary theory itself, since that trust runs through evolved brains too, and one on why basic "adaptive-link" judgments like kin-protection are supposedly harder to debunk than abstract impartial ones like utilitarian equal consideration. Her likely dodge will be "I'm a constructivist, not a nihilist, so this only threatens stance-independent facts" -- give me a follow-up that makes that harder to lean on, plus a final question on what would actually count as evidence against the whole debunking strategy.
reasoning: |-
  Okay, this user is a retired evolutionary biologist with deep expertise in cichlid fish speciation, now diving into metaethics. They're preparing for a Q&A with a philosopher defending Sharon Street's Darwinian Dilemma against moral realism. The user wants sophisticated questions that push beyond basic restatements of the dilemma, specifically targeting third-factor replies, self-defeat concerns, adaptive-link judgments, and constructivist dodges.  

  Hmm, let's unpack their needs: First, they clearly understand the core dilemma (evolution shaped attitudes for fitness, not truth-tracking → alignment with mind-independent facts would be coincidental). But they’re frustrated by surface-level rebuttals. Their request reveals three key layers:  
  - **Depth**: They want to pressure the *mechanisms* (e.g., how third-factor replies avoid coincidence claims).  
  - **Scope**: They’re suspicious of inconsistent standards (why target ethics but not logic/math?).  
  - **Escape hatches**: They anticipate the constructivist pivot (“I don’t need mind-independent facts!”) and want to block it.  

  For the questions:  
  1. **Third-factor focus**: Need to force the speaker to engage with *how* the natural fact bridges adaptiveness/truth without trivializing morality. Enoch’s survival example is perfect—ask why it wouldn’t reduce morality to instrumental goals.  
  2. **Self-defeat trap**: Must highlight the dilemma’s recoil on science/logic. If evolved cognition can’t track moral truth, why trust it for evolutionary theory itself?  
  3. **Adaptive-link judgments**: Press why kin-altruism gets a pass but utilitarianism doesn’t. Is it just proximity to biology? That’d be question-begging.  
  4. **Constructivist dodge**: Corner them—if “rightness” is just what agents would agree on under ideal conditions, does *any* evolutionary influence invalidate it? Where’s the line?  
  5. **Falsifiability**: Demand what evidence could sink the debunking argument. If nothing, it’s unfalsifiable dogma.  

  User’s tone is academic but impatient with evasion. Their bio background suggests they’ll pounce on vague analogies to natural selection. Final question should be lethal: “If Street’s right, why think constructivism avoids the same adaptive pressures?” *Mic drop.*
answer: |-
  Here are 10 targeted questions designed to push past rehearsed arguments, challenge key assumptions, and force engagement with deeper implications—tailored to your expertise and anticipating the constructivist pivot:

  1. **Third-Factor Mechanism Scrutiny**:  
     "Enoch’s ‘third factor’ (e.g., survival as both adaptive *and* morally valuable) aims to dissolve the coincidence. But *how* does this natural fact *necessitate* a moral truth? If survival’s value is contingent (e.g., in a universe overpopulated by suffering beings, survival might be *dis*valuable), doesn’t this reduce morality to instrumental fitness—precisely the realist dilemma Street highlights?"  

  2. **Self-Defeat Charge (Logic/Math)**:  
     "If evolutionary pressures invalidate truth-tracking for ethics, why don’t they equally invalidate logic or evolutionary theory itself? Trusting our cognitive faculties to deliver scientific truth relies on the same evolved brain. Isn’t exempting science/logic from debunking either arbitrary or self-undermining?"  

  3. **The Adaptive-Link Asymmetry**:  
     "You argue basic adaptive judgments (e.g., ‘protect offspring’) are resilient while abstract impartial ones (e.g., utilitarian equality) are suspect. But isn’t this just *descriptive*? If evolution explains both, why is kin preference *less* coincidental if moral facts exist? Doesn’t this asymmetry *presume* moral facts must be ‘near’ biology—begging the question against realism?"  

  4. **Constructivist Dodge – Scope Challenge**:  
     "As a constructivist, you say morality is stance-dependent. But if evolution shaped the *very conditions* of agency (e.g., parochial altruism, loss aversion), how can idealized constructivist procedures (e.g., Rawlsian veil, Habermasian dialogue) filter *out* adaptive distortions? What makes ‘idealization’ immune to the same debunking?"  

  5. **Constructivist Dilemma – Truth Adjacency**:  
     "If constructivism grounds moral truth in what agents *would* agree to under idealized conditions, doesn’t this still require that *their reasoning* tracks *something* independent (e.g., consistency, welfare)? If evolutionary pressures distorted *those* capacities, how is constructivism not also coincidental?"  

  6. **Debunking’s Selective Skepticism**:  
     "Why single out *moral* judgments for adaptive debunking? We don’t distrust color perception just because wavelength discrimination was fitness-enhancing. What’s the principled difference? Is it *only* the lack of a causal link to mind-independent properties? If so, doesn’t that presuppose non-naturalism?"  

  7. **The ‘Gap’ Problem for Third Factors**:  
     "Wielenberg posits third factors like ‘pain is bad’ as both adaptive and true. But evolution selects *avoidance of pain*, not the *truth* of ‘pain is bad.’ How does the third factor bridge the gap between behavioral disposition and normative truth without sneaking in realism?"  

  8. **Evidence for Adaptive Distortion**:  
     "What empirical evidence demonstrates that evolution *distorted* our moral intuitions relative to truth? If we lack independent access to moral facts, how do we *measure* distortion? Doesn’t this risk being a ‘just-so’ skepticism?"  

  9. **Falsifiability Test**:  
     "What would *count as evidence against* the debunking thesis? If we found moral beliefs converging across radically diverse cultures (e.g., prohibitions against pointless cruelty) despite divergent adaptive pressures, would that undermine the argument—or would you reinterpret it as ‘convergent adaptation’?"  

  10. **Final Challenge – Constructivism’s Evolutionary Burden**:  
      "If constructivism escapes the dilemma by rejecting mind-independence, mustn’t it still explain *why* evolution produced creatures capable of constructing *robust, other-regarding* norms? If constructivism is just adaptive coordination, why isn’t ‘might makes right’ the expected outcome? How is *this* not an equally damning coincidence?"  

  ### Key Strategic Notes:
  - **Q4–Q5** directly trap the constructivist pivot: They force her to either (a) concede evolutionary distortion infects constructivism’s foundations, or (b) posit an implausible insulation of "ideal agency" from biology.  
  - **Q9** is your kill switch: If she can’t specify falsifying conditions, the argument risks being non-empirical dogma.  
  - **Q10** reframes the "coincidence" charge against *her* view: If realism’s alignment is suspicious, why isn’t constructivism’s emergence of impartial morality equally suspicious?  
  - **Leverage your expertise**: If she hand-waves, press with biological examples (e.g., "In cichlid speciation, trait X is adaptive but misleading about environment Y—show me the parallel for moral beliefs").  

  These force her beyond Street’s script into epistemology, cognitive science, and the metaphysics of construction—exposing whether her view can withstand its own skepticism. Good luck!
