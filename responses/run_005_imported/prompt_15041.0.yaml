    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  and toss in like one sentence per tier on the general reasoning. thanks!
reasoning: |-
  We are ranking approaches to solving the demandingness objection in consequentialism by how well they solve the problem without abandoning consequentialism.
   The demandingness objection: consequentialism (especially utilitarianism) seems to require extreme self-sacrifice until the point where marginal utility equals that of the worst-off.

   The fixes to consider:
   1. Satisficing Consequentialism (e.g., Slote): Instead of maximizing the good, just aim for "good enough". This avoids the extreme demands because you don't have to keep giving until you drop to the level of those you help.
   2. Rule-Consequentialism (Hooker): Follow rules that, if generally followed, would maximize the good. This might allow for personal rules that don't require extreme sacrifice because a rule that allows some personal spending might have better overall consequences when universally followed.
   3. Scheffler's Agent-Centered Prerogatives: Allow agents to give some weight to their own interests, even if it doesn't maximize the overall good. This is a hybrid approach, introducing a non-consequentialist element.
   4. Railton's Sophisticated/Indirect Consequentialism: Be a consequentialist in what you approve of, but not necessarily in every act. You might adopt dispositions that lead to better overall consequences, which might include not always calculating and thus allowing for personal life.
   5. Liam Murphy's Compliance Condition: What we owe depends on what others are doing. If others are not doing their part, you are not required to pick up the slack beyond a certain point (so-called "collective" obligations).
   6. The "bite the bullet" approach (Singer, Unger): Accept that consequentialism is demanding and that we are required to give until the point where we are just above the level of those we help.

   Additionally, note that some of these might turn consequentialism into something else. We want to see how well they solve the demandingness problem without completely abandoning consequentialism.

   Tier ranking:
   S: Best at solving the demandingness problem while remaining clearly consequentialist.
   A: Good solution but might have some tension with pure consequentialism.
   B: Moderate solution, either doesn't fully solve the problem or starts to deviate from consequentialism.
   C: Weak solution, either doesn't solve the problem well or significantly alters consequentialism.
   D: Fails to solve the problem or abandons consequentialism.

   Let's evaluate each:

   - Satisficing: By replacing maximization with satisficing, it directly reduces demands. But it abandons the core consequentialist idea of maximizing the good. So it might be seen as turning into a different theory. (Probably B or C)
   - Rule-Consequentialism: It remains consequentialist because the rules are chosen for their consequences. It can reduce demands by having rules that allow for personal projects. However, if the rules are such that they require high sacrifice when others are not complying, it might still be demanding. But Hooker's version is designed to avoid extreme demands. (A or B)
   - Scheffler: Explicitly introduces a non-consequentialist element (agent-centered prerogative). So it is a hybrid. It's not purely consequentialist. (C or D for our purpose of staying consequentialist)
   - Railton: This is a form of indirect consequentialism. It remains consequentialist because the justification is the overall consequences of having such dispositions. It can allow for personal life because having a balanced life might lead to better long-term consequences. (A or S)
   - Murphy: The idea is that obligations are limited by what would be required in a situation of full compliance. This directly caps the demand. But is it consequentialist? It's a deontic constraint. However, Murphy presents it as a way to make consequentialism more plausible. It might be seen as a modification within consequentialism? But it is controversial. (B or C)
   - Bite the bullet: Doesn't solve the problem at all. It accepts the demandingness. So it fails to solve the objection. (D for solving the problem, but S for being the most consistent consequentialist? But we are ranking by how well they solve the demandingness problem, so D)

   Other approaches:
    - Multi-level consequentialism (similar to Railton): Distinguishes between a critical level (which judges rules, dispositions) and an intuitive level (where we don't calculate). This is similar to Railton and can be grouped with it.

    - Prioritarianism/Weighted consequentialism: Giving extra weight to the worst off, but this doesn't necessarily reduce demands on the better off.

    - Global consequentialism (Pettit and others): Evaluates everything (acts, rules, motives) by consequences. This might allow for a more holistic view that reduces demands by considering the consequences of being overly demanding (e.g., burnout, resentment). But it's broad and can be similar to Railton.

    - Negative consequentialism: Focus on minimizing the bad rather than maximizing the good. This might reduce demands because we are only required to prevent harm, not to promote good. But it's a different theory and may not reduce demands if preventing harm is also very demanding.

   Let's rank:

   S: Approaches that successfully reduce demands without compromising the consequentialist core.
     - Railton's sophisticated consequentialism (indirect) because it justifies having a personal life as part of a strategy that maximizes good in the long run. It remains purely consequentialist.

   A: Good solutions that might have some minor deviations or are controversial but still within consequentialism.
     - Rule-consequentialism (Hooker): It is a form of consequentialism and can reduce demands, but some argue that it collapses into act-consequentialism or that the rules might still be demanding in a non-ideal world. However, Hooker designed rules to avoid extreme demands.
     - Murphy's compliance condition: Though it introduces a non-consequentialist element (a duty of fairness?), Murphy argues it is a necessary adjustment for consequentialism in non-ideal conditions. But it's not universally accepted as consequentialist.

   B: Moderate solutions that reduce demands but either significantly alter the theory or don't fully solve the problem.
     - Satisficing consequentialism: It changes the criterion from maximizing to satisficing, which is a fundamental change. Some argue it is still consequentialist because it evaluates by consequences (but not maximally). However, it might lead to counterintuitive cases where one could do a lot more good at little cost and not be required to.

   C: Solutions that reduce demands but at the cost of abandoning consequentialism.
     - Scheffler's agent-centered prerogatives: This is a hybrid theory, not purely consequentialist. It explicitly allows actions that do not maximize the good.

   D: Approaches that do not solve the demandingness problem.
     - The bite-the-bullet approach (Singer, Unger): They don't solve the problem; they accept it.

   However, note that the bite-the-bullet approach is the most consistent with act-consequentialism. But the question is about solving the demandingness objection, so we are ranking by how well they address (i.e., reduce) the demandingness. Since they don't reduce it, they get D.

   But wait: what about other solutions? We might have missed some. For example:

