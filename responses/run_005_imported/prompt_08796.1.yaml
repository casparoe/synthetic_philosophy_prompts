  Ok so I went down a rabbit hole this weekend reading about this ancient Chinese philosopher Gongsun Long and his "a white horse is not a horse" argument (apparently its part of some "School of Names" movement in Chinese philosophy?). I don't have any philosophy background, but the actual argument he makes kept reminding me of arguments we have at work about type systems -- like whether a subclass really "is" its parent type, duck typing vs nominal typing, is-a vs has-a relationships, generics/variance, that kind of thing. Can you describe the most important implications of his actual argument (not the meme version -- the real logical moves he's making, there's apparently a few different ones) for how programmers reason about class membership and subtyping? Also flag it if I'm just pattern-matching onto a surface similarity and the analogy doesn't actually hold up logically.
