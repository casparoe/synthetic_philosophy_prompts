answer: |-
  Here are a few options playing on specific aspects of Bentham's reasoning and situation, aiming for that insider chuckle:

  1.  **On his secrecy vs. the auto-icon:**
      > "Bentham was fine with his body being permanently displayed for public utility, but thought arguing *against* hanging men for private pleasure might be *too* visible an application of his principle."
      *(Punchline hinges on the irony of his physical visibility vs. intellectual concealment, directly referencing the auto-icon and the sodomy essay's suppression.)*

  2.  **On "unnatural = uncommon":**
      > "Bentham concluded that if 'unnatural' just means statistically rare, then rigorous utilitarians like him arguing for sexual liberty were probably the *real* 'unnatural' ones in 18th-century England."
      *(Twists his own redefinition of "unnatural" back onto utilitarians themselves, highlighting their rarity/radicalism.)*

  3.  **On Antipathy as the core argument:**
      > "He realized the strongest 'argument' against 'irregular' sex wasn't logic, but antipathy – basically, 'Eww, therefore illegal' – which, for a guy obsessed with rational accounting, was the ultimate ledger imbalance."
      *(Directly mocks the "antipathy dressed as argument" point, framing disgust as bad bookkeeping.)*

  4.  **Combining Secrecy & the Antipathy Argument:**
      > "Bentham knew publishing his essays would trigger so much 'antipathy dressed as argument,' he prudently calculated that maximizing his *posthumous* utility as an auto-icon was better than minimizing his *contemporary* pain as a pariah."
      *(Links his fear of the public's irrational antipathy to his choice of the auto-icon as a safer utility play.)*

  5.  **On "Not Paul, but Jesus":**
      > "His draft title 'Not Paul, but Jesus' perfectly applied utilitarian scrutiny: Paul's rules caused measurable pain, Jesus' love maximized pleasure. Simple calculus, really... too bad the math was too radical for the times."
      *(References the specific title and frames Bentham's religious critique as straightforward utility weighing.)*

  **Which one works best?**

  *   **For maximum insider recognition:** #3 (Antipathy) or #5 ("Not Paul, but Jesus") are the most directly tied to unique arguments/concepts in the suppressed texts.
  *   **For broadest impact combining key elements:** #1 (Auto-icon vs. Suppression) or #4 (Antipathy + Suppression + Utility) are strong. #1 is particularly visual.
  *   **For sharpest twist:** #2 (Unnatural = Uncommon applied to Utilitarians) is clever and meta.

  **Recommendation:** **#1 or #3.** #1 is instantly recognizable due to the auto-icon reference while directly highlighting the core tension between his principle and his prudence regarding *these specific texts*. #3 cuts right to the heart of his most powerful critique in the material. Both should land well with students who've done the reading. Avoid #2 if your students might not immediately grasp the "statistically rare" redefinition.

  Have a great seminar – it sounds like a fascinating session!
