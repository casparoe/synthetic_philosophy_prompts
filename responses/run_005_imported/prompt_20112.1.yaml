answer: |-
  The coffee was bitter and lukewarm, the kind only served at funerals. Dana Prentiss stirred hers absently, the spoon clinking against the thin ceramic. Marcus Cole stood beside her, shoulders hunched, staring into his own untouched cup. The muffled sounds of the reception – low voices, the scrape of chairs – formed an awkward backdrop.

  "Ten years," Marcus finally said, not looking up. "Hard to believe it’s been that long since the moot court finals."

  "Since you demolished my argument on the Commerce Clause," Dana offered a small, tight smile. "You always were… passionate."

  "Passion doesn’t pass the Franchise Exam, Dana." His voice was flat. "Three tries. You know that."

  She flinched, almost imperceptibly. "Marcus…"

  "No, it’s fine." He finally met her eyes. There was a tired defiance there. "Congrats, by the way. On the Board. Saw the announcement. Architect of the new era."

  "Don't." Her voice sharpened. "Don't make it sound like some… power grab. You know why it was necessary. You *lived* the crisis."

  "Necessary?" Marcus leaned in slightly, his voice dropping, intense but controlled. "Necessary to tell millions of citizens they're too stupid, too *ignorant*, to have a voice? To decide that *your* test is the arbiter of civic worth?"

  "It's not about *stupidity*, Marcus," Dana countered, her own intensity rising. "It's about *engagement*. About the quality of decision-making. Look at the data pre-Breakaway – truly, *look* at it. Brennan wasn't wrong. The vast majority weren't deliberative 'Vulcans,' rationally weighing evidence. They were 'Hobbits,' blissfully disengaged, or worse, 'Hooligans,' treating politics like a tribal bloodsport, cheering their team, booing the other, utterly indifferent to facts or policy coherence. Democracy *assumes* informed, rational participants. It got… something else entirely."

  "And so the solution is disenfranchisement? To say only the certified elite get to play?" Marcus pressed. "Mill toyed with plural voting over a century ago, Dana, and even *he* backed away from the practical nightmare. Who decides *what* constitutes 'competence'? You? The Board? What's on this sacred exam? Statistical significance? Constitutional arcana most lawyers barely remember? Who writes it? Who *grades* it? Tell me it isn't overwhelmingly people who look like us, talk like us, went to schools like ours. Doesn't this just baptize existing privilege – class, race, education – as 'merit'?"

  Dana bristled. "That's a cheap shot. The exam is rigorously designed, psychometrically validated. It measures civic knowledge, statistical reasoning, basic policy analysis – the tools needed to *understand* governance, not just react to slogans. And yes, access to *preparation* is a challenge we’re working on aggressively. Outreach programs, subsidized study materials…"

  "Working on?" Marcus interrupted, a bitter edge returning. "While generations are locked out *now*? Tell me, Dana, when your outreach finally, magically, levels the playing field – which history suggests it never quite does – will you suddenly decide universal suffrage is viable again? Or will the goalposts shift? Will the 'competence' standard keep rising to ensure the right *kind* of people remain in charge?"

  "It's not about *people*, Marcus, it's about *outcomes*!" Dana leaned forward, her coffee forgotten. "Look around this city-state. Functioning infrastructure. Evidence-based policy. Reduced polarization because decisions aren't hostage to emotive populism or misinformation campaigns targeting the disengaged. Isn't that worth something? Isn't a competent, stable government that actually *solves problems* preferable to the chaotic, gridlocked mess that failed us? The system isn't perfect, but it delivers better governance than the mob rule we escaped!"

  "*Mob rule?*" Marcus’s voice was dangerously low. "That’s what you call your neighbors? Your former classmates who didn't pass your test? The 'mob'?" He shook his head, a profound weariness replacing the anger. "You talk about outcomes, Dana. But democracy isn't *just* about outcomes. It's about *process*. About the inherent dignity of having a say in the rules that bind you. About equality. Not equality of outcome, but equality of *standing*. Even the 'Hobbit,' even the 'Hooligan' – they live under the law. Shouldn't they have a voice in making it? Or are they just subjects, governed by your enlightened overseers?"

  Dana looked down, her knuckles white on the coffee cup. "It’s not… it’s not about being overseers. It’s about responsibility. The franchise isn't a birthright; it's a *trust*. A weapon. Shouldn't we ensure those wielding it understand it? That they won't… point it at their own feet?"

  "So trust is earned by passing a test?" Marcus challenged. "What about lived experience? What about the wisdom of the shopkeeper seeing regulations strangle his business? The single mother navigating a broken welfare system? Their insights, their *stakes*, are invalid because they can't parse a regression analysis? Your exam measures a *very specific* kind of knowledge, Dana. It filters out noise, maybe. But it also filters out voices we desperately need to hear."

  Silence hung heavy between them, thicker than the funeral-home air. The easy banter of law school, the shared passion for justice, felt like artifacts from a buried civilization.

  "Maybe," Dana said slowly, her voice losing some of its defensive edge, revealing a hint of the doubt she usually kept veiled, "maybe there's no perfect system. Maybe universal suffrage *does* empower ignorance and tribalism. But maybe epistocracy… maybe it mistakes a particular kind of analytical skill for the totality of civic wisdom. And maybe it corrodes something fundamental about what a citizen *is*." She met his gaze again. "I believe in the system, Marcus. I believe it prevents worse harms. But… I hear what you're saying about the cost. The… exclusion."

  Marcus studied her face, seeing the familiar furrow between her brows, the one that appeared when she wrestled with a complex brief. He saw not just the Board member, but the Dana who once argued late into the night about Rawlsian justice. "And I see the stability," he admitted, the fight momentarily draining from him. "I see the lack of the daily circus. But Dana… stability built on disenfranchisement? Is that justice? Or just… efficient management?"

  They stood there, the cooling coffee between them, the ghost of their dead friend hovering over the unresolved argument. Neither had landed a knockout blow. Dana’s points about disengaged and tribal voters, the appeal to competence and better outcomes, remained potent, countered but not destroyed by Marcus’s practical and moral objections. Marcus’s core challenge – the inherent injustice, the gatekeeping, the risk of technocratic arrogance – resonated deeply, even as Dana’s vision of a functional, non-chaotic polity held its own weight. They had answered each other, exposed flaws, but found no synthesis, only a deeper understanding of the chasm.

  A mourner brushed past, murmuring an apology. The spell broke. Dana straightened, composing her Board-member face. Marcus took a deliberate sip of the bad coffee, grimacing.

  "Funny," he said softly, looking not at her, but at the crowd dispersing. "We used to argue to find the truth. Now…"

  "Now we just argue to hold our ground," Dana finished, her voice barely audible. She placed her untouched coffee cup on a nearby table. "Good seeing you, Marcus. Despite… everything."

  "Yeah," he said, watching her walk away, the confident stride of power now seeming, just for a moment, profoundly lonely. "You too, Dana." He stared into the dregs of his coffee, the bitter taste lingering long after she was gone.
