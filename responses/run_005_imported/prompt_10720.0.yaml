answer: |-
  Your friend Daniel's position reflects a common but contested view in military ethics. The core tension lies between two frameworks: the traditional separation of *jus ad bellum* (justice of going to war) and *jus in bello* (justice in the conduct of war), versus the view that the injustice of the war taints *all* acts committed in its prosecution, even those adhering to battlefield rules.

  Here's a breakdown of the arguments and the moral distinction:

  1.  **The Traditional View (Symmetry Thesis):**
      *   **Premise:** *Jus ad bellum* responsibility lies solely with the state and its political/military leaders who initiate the war.
      *   **Premise:** *Jus in bello* applies symmetrically to all combatants. Soldiers on both sides have an equal duty to follow the Laws of Armed Conflict (LOAC) – distinguishing combatants from civilians, proportionality, necessity, avoiding unnecessary suffering.
      *   **Conclusion:** Provided a soldier follows *jus in bello* rules, they fight morally permissibly, regardless of which side they are on. Their moral status as combatants is symmetrical. Daniel, following the rules, is morally equivalent to the defending soldier following the same rules. He is a pawn, not a perpetrator, of the *ad bellum* crime.
      *   **Why Law/Practice Favors This (Reluctantly):**
          *   **Pragmatism & Humanity:** Holding individual soldiers responsible for the *ad bellum* decision creates chaos. How could they possibly know the *true* pretexts? Punishing them for fighting for their country (even if misled) discourages surrender and adherence to LOAC. It incentivizes atrocity ("I'm guilty anyway").
          *   **Combatant Equality:** Treating POWs equally regardless of their side's *ad bellum* status is fundamental to the Geneva Conventions and protects captured soldiers.
          *   **Focus on Control:** Soldiers are seen as instruments of state policy, lacking meaningful agency to refuse mobilization without severe consequences (court-martial, imprisonment, social ostracism). Blaming them seems unfair.
          *   **Birth Lottery Argument (Partial Support):** While insufficient to excuse *all* wrongdoing, the profound lack of choice in nationality and conscription context adds weight to the "instrument" argument in war.

  2.  **The Revisionist/Critical View (Asymmetry Thesis):**
      *   **Premise:** The moral status of an action depends on the context and justification. Killing in self-defense is morally permissible; killing as part of an aggressive attack is not.
      *   **Argument:** A soldier fighting for the *unjust* side lacks a just cause for using lethal force. Even if they follow *in bello* rules, *every act of violence they commit in furtherance of the unjust war* is morally tainted. They are participating in and enabling the aggression.
      *   **Analogy:** Your self-defense analogy is apt. The soldier on the unjust side is like the initial aggressor who continues to fight "because they are being shot at." Their defensive violence *within* the aggression is not rendered innocent. Their violence only becomes necessary *because* of the unjust aggression they are part of.
      *   **The Moral Difference:** The soldier on the *just* side uses force with a *justifying purpose* (defending their country and its people from wrongful aggression). The soldier on the *unjust* side uses force *without a justifying purpose*; they are enforcing the aggression. Following the same rules *mitigates* their wrongdoing (makes them less bad than a war criminal) but does not *eliminate* it.
      *   **Complicity:** By participating, Daniel furthered the unjust aim, making him morally complicit to *some degree*, even if minimally. He became part of the machinery of aggression.
      *   **"Just Following Orders/Lack of Choice":** While mitigating factors, they don't erase moral responsibility entirely. Conscientious objection (though difficult and risky) exists. Participation, even coerced, still contributes to the harm. The revisionist argues we shouldn't confuse *excuse* (reduced blame due to coercion/lack of choice) with *justification* (the act itself being morally permissible).

  **Was Daniel Wrong?**

  *   **Legally:** Almost certainly not. International law (LOAC) explicitly embraces the symmetry thesis for individual soldier conduct.
  *   **Morally (Complex):**
      *   **Mitigated:** His lack of agency in starting the war, his adherence to *in bello* rules, and the coercive context significantly *mitigate* his moral responsibility. He is not equivalent to the leaders who launched the invasion or to a soldier who commits war crimes.
      *   **But Not Absolved (Revisionist View):** Morally, his participation in the invasion *was* wrongful, even if his individual actions within it were restrained. He contributed to an unjust enterprise. His violence, however rule-bound, lacked a just cause and furthered aggression. His conscience *should* be troubled, not by specific acts of cruelty, but by his role in the larger wrong. Saying "I only killed combatants" ignores that those combatants were defending their homeland *against his unjust invasion*.
      *   **The "Unfairness" Objection:** The revisionist acknowledges the unfairness of birth lottery and coercion but argues that life *is* unfair, and moral responsibility isn't always negated by circumstance. While Daniel didn't choose his situation, his *actions* (fighting) still had real, harmful consequences in an unjust cause.

  **Why the Reluctance in Practice?**

  1.  **Impossibility of Adjudication:** How could courts-martial or international tribunals possibly determine the *true* justice of every war *in real-time* for every soldier? What if both sides claim justice? This would paralyze conflict regulation.
  2.  **Undermining LOAC:** If soldiers on the "unjust" side believe they are criminals regardless of conduct, they have no incentive to follow *any* rules, leading to worse atrocities and less protection for civilians and POWs.
  3.  **Coercion & Duress:** The reality of mobilization, patriotism, propaganda, and severe punishment for desertion makes individual moral choice extremely constrained. Blaming the pawns feels disproportionate.
  4.  **Combatant Equality & POW Status:** Recognizing an *in bello* asymmetry would destroy the principle of equal treatment for POWs, a cornerstone of humanitarian law.
  5.  **Focus on Leadership:** Justice is better served (and more feasible) by focusing *ad bellum* responsibility on political and military leaders (e.g., for Crimes Against Peace/Aggression).

  **Conclusion:**

  *   Daniel is **legally** correct and protected by the symmetry principle of *jus in bello*.
  *   **Morally**, the situation is more nuanced. The revisionist view provides a strong argument that he *did* participate in a wrongful enterprise. His individual acts of combat, while restrained, were part of enforcing an unjust aggression and therefore lacked the moral justification possessed by the defenders. His lack of choice and adherence to rules significantly *mitigate* his blameworthiness, but they do not erase the fundamental moral difference in the cause he served. His conscience *should* be troubled by his participation in the invasion itself, not just by any specific atrocities he might have committed. The reluctance of law and practice to recognize this distinction stems from overwhelming pragmatic concerns about chaos, inhumanity, and the impossibility of fair adjudication at the soldier level, not from a denial of the underlying moral asymmetry.
