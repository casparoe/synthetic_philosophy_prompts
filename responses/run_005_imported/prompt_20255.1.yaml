  Here's my problem though: I don't want this speech to be a strawman that the prosecutor casually flattens two pages later with "well, it WAS on the books, sorry." I want the actual strongest, most careful version of that argument -- the one that supposedly gave Hart real trouble, not just "it was SO evil it doesn't count." What I remember of Hart's comeback is something like: saying the old law was never valid is really just a sneaky way of punishing someone retroactively while pretending you're not doing anything retroactive at all, and that it would've been more honest to just pass a new law openly and own up to the unfairness of it. So could you build me the best version of the "it was never valid law" argument, one that actually has a real answer to that retroactivity worry baked into it? I want to find where the actual pressure point in that exchange is, not the two-line textbook version of "positivism says yes, natural law says no."
