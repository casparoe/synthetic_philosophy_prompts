answer: |-
  Here are 8 core questions designed to force engagement with the mechanics and philosophical costs of quasi-realism, plus anticipated dodges and sharp follow-ups. Focus on *how* it works, not just *that* it supposedly does.

  **Core Questions & Strategic Follow-Ups:**

  1.  **The Modus Ponens Walkthrough:**
      *   **Question:** "Let's take a concrete modus ponens: 'If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong.' Quasi-realism holds that the first 'lying is wrong' expresses disapproval. But in the *antecedent* of the conditional, that disapproval isn't actually expressed or felt by the speaker uttering the whole sentence. Could you walk us through, step-by-step, what mental state(s) the speaker *is* expressing when uttering the *whole conditional*, and crucially, how the occurrence of 'lying is wrong' in the antecedent contributes to the *validity* of the inference, ensuring it functions identically in meaning to its occurrence in the second premise?"
      *   *Anticipated Dodge:* "The conditional expresses a higher-order attitude, like disapproval of both approving of lying and *not* disapproving of getting your little brother to lie." or "It expresses a norm or plan that links disapproval of lying to disapproval of getting someone to lie."
      *   **Follow-Up:** "Okay, but *how* does that higher-order attitude or plan guarantee that the *content* 'lying is wrong' embedded in the antecedent is *semantically identical* to the 'lying is wrong' asserted in the second premise? Isn't the risk that the antecedent is just *mentioning* the attitude (like a description) rather than *using* it with its full expressive force? How does your account block that and ensure genuine compositionality?"

  2.  **Attitudes about Attitudes: Relocating Frege-Geach?**
      *   **Question:** "You've likely invoked 'disapproving of disapproving' or 'planning not to plan to lie' to explain the inconsistency someone faces if they accept the premises but deny the conclusion in our modus ponens example. But doesn't this just push the Frege-Geach problem up one level? Instead of explaining how an unasserted *moral sentence* retains its meaning/complexity, now you need to explain how an unasserted *attitude expression* (like 'disapproving of lying') retains *its* meaning/complexity when embedded, say, within the scope of your 'disapproving of disapproving' attitude. How is this a *solution* rather than just relocating the problem to a meta-attitude level?"
      *   *Anticipated Dodge:* "Higher-order attitudes are fundamental to planning and normative thought; this *is* the structure of our commitments." or "The inconsistency is practical/planning inconsistency, not logical inconsistency needing further semantic grounding."
      *   **Follow-Up:** "But the *explanatory burden* remains: How does the *expression* of this higher-order attitude embed the *expression* of the lower-order attitude in a way that gives the lower-order component ('disapproving of lying') a stable, compositional meaning *within* the higher-order expression? Doesn't the need to keep constructing higher-order attitudes to explain embeddings threaten an infinite regress or simply mask the core problem?"

  3.  **Negation vs. General Validity:**
      *   **Question:** "Discussions of Frege-Geach often start with negation ('Lying is not wrong' vs. 'It's not the case that lying is wrong'). Quasi-realism might handle negation by positing an attitude like 'tolerance' or a plan *not* to disapprove. But the problem is far more general: it's about preserving validity across *any* complex logical embedding (disjunctions, conjunctions, nested conditionals). Can you explicitly separate your account of *negation* from your account of *general logical validity*? Specifically, what is the core mechanism that ensures *any* complex moral sentence formed with logical operators inherits the right properties (truth-aptness, inferential role) from its parts *on an expressivist basis*?"
      *   *Anticipated Dodge:* Blurring negation and general validity or claiming "The solution for conditionals/negation provides the blueprint for others."
      *   **Follow-Up:** "That blueprint seems crucial. Let's take a *disjunction*: 'Either lying is wrong or charity is optional.' What mental state(s) does uttering *this* express? And how does *that* expressed state guarantee that someone who accepts this disjunction but then learns 'Lying is not wrong' is rationally committed to 'Charity is optional'? Crucially, how does the disjunction operator combine the expressive meanings of its parts?"

  4.  **Non-Standard Embeddings (Quantifiers & Attitude Reports):**
      *   **Question:** "Moving beyond conditionals and negation, how does quasi-realism handle the meaning and truth-conditions of quantified moral claims like 'Everything the Senator said was wrong'? What attitude is expressed here? Is it a single, complex higher-order attitude directed at the whole set of statements? Or is it somehow built from attitudes towards each individual statement? And how does this avoid the problem of the speaker needing to have an attitude about statements they might not even know the Senator made?"
      *   *Anticipated Dodge:* "It expresses a general plan or norm to disapprove of each instance of the Senator's statements." or "It's a commitment to disapproving of whatever falls under the description 'what the Senator said'."
      *   **Follow-Up:** "What about attitude reports like 'Ann believes cheating is permissible'? This seems deeply problematic for expressivism. The speaker isn't *expressing* approval of cheating, nor disapproval of Ann. They're reporting *Ann's* mental state. How can this be analyzed as an expression of the *speaker's* non-cognitive attitudes? Doesn't this *require* treating 'cheating is permissible' as having propositional content that Ann believes, undermining the core expressivist thesis?"

  5.  **The Creeping Minimalism Challenge:**
      *   **Question:** "Once quasi-realism has done the technical work to earn the right to say moral claims are 'true' (deflationarily), participate in valid inferences, and constitute genuine disagreements, what *substantive* difference remains between your view and a robust moral realism, or even a naturalist reductionist cognitivism? If all the surface features of realism are accounted for, what work is the underlying 'non-cognitive attitude' or 'plan' doing that couldn't be done by a belief with propositional content? Isn't this just cognitivism with extra, unnecessary steps disguised by deflationism about truth?"
      *   *Anticipated Dodge:** "The key difference is at the *foundational* level: moral judgments are *constituted* by conative states (attitudes/plans), not cognitive beliefs. The 'extra steps' *are* the explanation of how conative states underpin the logical and semantic features." or "We deny there are moral facts or properties 'out there' in the world independent of our attitudes."
      *   **Follow-Up:** "But if the quasi-realist grants moral sentences deflationary truth *and* fully earned logical embedding *and* robust disagreement, what *explanatory or predictive power* does the foundational claim 'It's conative, not cognitive' actually have? Does it make any difference to how we reason, what we say, or how we interpret others compared to the cognitivist? If not, isn't the 'non-cognitivism' label just an empty vestige of the position's origin, with no bite left after the 'earning' project is complete?"

  **Bonus Questions for Depth/Flow:**

  6.  **The "As If" Gambit:** "You often say quasi-realism 'earns the right' to talk *as if* realism is true. But doesn't this 'as if' language risk being disingenuous? If you've genuinely earned *all* the realist talk (truth, facts, reference, logic), in what sense is it *only* 'as if'? What *can't* the quasi-realist genuinely say or commit to that the realist can?"
  7.  **Metasemantic Cost:** "Even if quasi-realism solves the Frege-Geach problem technically, doesn't it posit an incredibly complex, non-standard metasemantics for moral language? How plausible is it that ordinary speakers have these intricate, nested attitudes/plans underlying their use of conditionals or quantifiers? Doesn't a cognitivist account offer a far simpler story about meaning and truth-conditions?"
  8.  **Disagreement Revisited:** "After earning 'disagreement', how does the quasi-realist account for the *phenomenology* of deep moral disagreement – the sense that we're clashing over how the world *is*, not just having incompatible plans? If my plan endorses X and your plan forbids X, isn't our conflict just practical coordination, lacking the 'mind-to-world' friction characteristic of factual disputes?"

  **Interview Tactics:**

  *   **Listen for Jargon/Slogans:** If she says "We earn the right to...", "It's a higher-order plan...", "Deflationism handles that...", gently but firmly ask: "*How*, specifically, does that work in *this* case?" or "Could you unpack that mechanism?"
  *   **Insist on Specifics:** Don't let general explanations slide. Demand application to *your* examples (modus ponens, quantification, attitude reports).
  *   **Control the Frame:** Preface questions with: "To really understand the mechanics..." or "Pushing a bit deeper on the challenge of..."
  *   **Connect to Costs:** Explicitly link answers back to the core challenges (e.g., "So, does that mean your solution to embedding relies on X, which then raises the creeping minimalism worry we discussed?").

  These questions force the guest beyond exposition and into defending the *mechanism* and *costs* of quasi-realism. Good luck with the interview!
