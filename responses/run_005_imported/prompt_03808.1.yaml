  First I should acknowledge the apparent contradiction: young Rawls condemns contract theory's mutual disinterest as destroying community, yet mature Rawls builds justice theory on exactly mutual disinterest (behind the veil). The pivot seems to be Rawls's abandonment of theology for Kantian constructivism. But is that enough? The user suspects the ghost of the thesis haunts Political Liberalism.

