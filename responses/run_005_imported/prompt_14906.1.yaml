answer: |-
  That's an excellent observation about Frankfurt's counterexample, and it captures why it was so revolutionary. You're right that Frankfurt successfully challenged the **Principle of Alternative Possibilities (PAP)**, which states that an agent is morally responsible for an action *only if* they could have done otherwise. The Jones/Black case seems to show:

  1.  **Jones is morally responsible:** He chose for his own reasons, without coercion or manipulation.
  2.  **Jones couldn't have done otherwise:** Black's mechanism ensured Jones *would* perform the action (or be forced to if he wavered). Jones lacked *robust* alternatives.
  3.  **Therefore, PAP is false:** Moral responsibility does *not* require the ability to do otherwise.

  This *does* seem like a major win for compatibilism, as it severs the *logical necessity* of indeterminism (and thus alternative possibilities) for moral responsibility.

  **So why do philosophers like Robert Kane (and other libertarians) persist?**

  Kane and others aren't denying Frankfurt's point *about PAP and moral responsibility in that specific scenario*. They accept that Jones *can* be morally responsible without alternative possibilities *in Frankfurt-style cases*. However, they argue that Frankfurt hasn't addressed the *core* libertarian concern about free will. Here's why they remain unconvinced:

  1.  **Distinguishing Free Will and Moral Responsibility:** Libertarians argue that free will is a *deeper* or *more fundamental* requirement than moral responsibility. While Frankfurt may have shown that *responsibility* doesn't require alternative possibilities, he hasn't shown that the *kind of free will* necessary for *ultimate responsibility* doesn't require them. Kane argues that for an agent to be the *ultimate source* of their actions (and thus truly free), there must be times where alternative paths were genuinely open, and the agent settled which one occurred through an undetermined effort of will.
  2.  **The "Flicker of Freedom" Strategy:** Critics argue that Frankfurt cases *always* contain a tiny "flicker" of alternative possibility *before* the actual decision point. For example, perhaps Jones *could have shown a sign* of hesitation or alternative thought *before* decisively choosing, which would have triggered Black's intervention. Libertarians argue that even this minimal alternative possibility (the ability to *begin* to do otherwise or *show a sign* of doing otherwise) is crucial for *true* freedom and ultimate responsibility. They claim Frankfurt hasn't eliminated alternative possibilities *entirely*, just minimized them. Kane would argue that robust, *action-relevant* alternatives are still needed for the *will* itself to be free at the moment of choice.
  3.  **The Requirement for Ultimate Responsibility (UR):** Kane's core argument centers on **Ultimate Responsibility (UR)**: "To be ultimately responsible for an action, an agent must be responsible for anything that is a sufficient reason, cause, or motive for the action's occurring." To avoid an infinite regress (where every reason/cause for your choice was caused by something before you), Kane argues there must be **Self-Forming Actions (SFAs)**. SFAs are:
      *   Undetermined (truly open possibilities exist).
      *   Occur at key moments in life (shaping character, values, motives).
      *   Involve the agent making an effort of will to resolve conflicting motivations.
      *   The outcome *isn't* determined by prior reasons/causes (though they influence), but is settled by the agent's effort.
      *   **Crucially:** SFAs *require* alternative possibilities at the moment of choice. The agent *must* have been able to choose differently in that very situation for the outcome to be *truly* up to them and not predetermined by prior causes (even their own prior character).
  4.  **Frankfurt Doesn't Address Source Incompatibilism:** Frankfurt primarily targets leeway incompatibilism (freedom = alternative possibilities). However, Kane and others represent **source incompatibilism**: freedom requires being the *ultimate source* of your actions in a way incompatible with determinism. Frankfurt cases don't challenge *source* incompatibilism directly. While Jones acted from his own desires in the Frankfurt case, the *source* libertarians care about is deeper: *Why* does Jones have *those* desires? Were *they* formed in a way that involved genuine self-formation (SFAs) with alternative possibilities? If determinism is true, Jones' "own reasons" are ultimately the product of factors beyond his ultimate control (genes, environment, etc.), violating UR.
  5.  **The Importance of "Could Have Done Otherwise" for *Freedom*:** Libertarians argue that the *feeling* or *metaphysical reality* of genuinely open futures is essential to the *experience* and *meaning* of free will. Even if responsibility *could* exist without it (as per Frankfurt), the *freedom* worth wanting requires the actual ability to shape one's destiny in an undetermined way at key moments. PAP captures this intuition about openness and control.

  **In essence:**

  *   **Frankfurt:** Successfully shows that **moral responsibility does not logically require the ability to do otherwise** in specific, carefully constructed scenarios. This refutes PAP as a *necessary* condition for *responsibility*.
  *   **Kane (Libertarian):** Agrees Frankfurt refutes PAP for responsibility *in those cases*, but argues:
      *   **Ultimate Responsibility (UR)** is the core of free will.
      *   UR requires **Self-Forming Actions (SFAs)**.
      *   **SFAs *do* require the ability to do otherwise** at the moment of choice.
      *   Therefore, **free will (as UR) *does* require alternative possibilities** in the crucial moments of self-formation, even if *responsibility* for *some* specific actions in constrained contexts does not.

  Kane isn't ignoring Frankfurt; he's arguing that Frankfurt successfully attacked one argument for incompatibilism (based on PAP), but not the deeper argument based on **Ultimate Responsibility and Self-Formation**, which *does* require alternative possibilities. The debate continues because libertarians focus on a different (and arguably more demanding) conception of free will than the one Frankfurt's counterexample directly addresses. They contend that without the genuine openness provided by alternative possibilities at key moments, we lack the ultimate control and authorship over our lives that constitutes true freedom.
