  ## The Stain of Unjust Arms: Walzer, McMahan, and the Conscript's Burden

  Your cousin’s predicament tears at the heart of war’s deepest moral contradictions. A reluctant instrument of an aggression he opposes, thrust into a conflict where survival demands he become a threat to others defending their homeland. The abstract debate between Walzer’s traditional "moral equality of combatants" and McMahan’s "revisionist" challenge becomes agonizingly concrete. Let us dissect the strongest forms of each argument, apply them to your cousin, and seek a verdict.

  ### I. The Traditional Fortress: Walzer and the Independence Thesis

  Michael Walzer’s *Just and Unjust Wars* defends the **moral equality of combatants** rooted in the **independence thesis**: the justice of fighting (*jus in bello*) is separate from the justice of the war itself (*jus ad bellum*). Soldiers on both sides, provided they fight within the rules of war (discriminating between combatants and civilians, avoiding unnecessary suffering), are moral equals. Killing an enemy soldier in combat is not murder.

  *   **The Core Argument:** War is a collective, institutional phenomenon. Soldiers are not private individuals acting on personal moral judgments; they are agents of a state. The moral license to kill stems from their status as combatants – individuals who have, by virtue of their role, entered a state of "war rights" and mutual liability. They pose a threat, and opposing soldiers have a right of self and collective defense against that threat, regardless of the war's overall justice. The battlefield must be a realm of shared rules, not individual moral adjudication.
  *   **Epistemic Defense:** How can an ordinary soldier, embedded in their state’s propaganda and command structure, *truly know* the objective justice of their nation’s cause? Demanding such knowledge for moral permissibility in combat is unrealistic and paralyzing. Soldiers rely on the lawful orders of their superiors and the collective judgment of their state.
  *   **Conventionalist Defense:** The laws of war function as a vital *convention*. Recognizing mutual combatant status, even in an unjust war, is essential for restraining warfare. It allows for surrender, POW treatment, and the principle of distinction. If soldiers on the unjust side lost their moral standing merely by fighting, they could be treated as criminals or murderers on sight, obliterating the fragile constraints of *jus in bello* and escalating violence indiscriminately.
  *   **Verdict on Your Cousin (Walzer):** So long as your cousin follows the rules of engagement (discrimination, proportionality), he is the moral equal of the Ukrainian soldier facing him. His personal reluctance or opposition to the war is tragic but *morally irrelevant* to his status as a combatant. He has not done something morally wrong merely by fighting in obedience to his state’s call. He has not forfeited his right not to be murdered or tortured, but he *has* forfeited his right not to be killed in combat by opposing soldiers. If he kills a Ukrainian soldier in a lawful engagement, it is a morally neutral act of war; if a Ukrainian soldier kills him in a lawful engagement, it is equally a morally neutral act of war. Symmetry reigns.

  ### II. The Revisionist Challenge: McMahan and the Primacy of Cause

  Jeff McMahan dismantles the independence thesis. For him, **a combatant’s moral liability to be killed derives directly from the moral status of their action – which is inextricably tied to the justice of the war they are fighting.**

  *   **The Core Argument:** The fundamental moral rule against killing innocent people doesn't vanish in war. You only lose your right not to be killed if you make yourself morally liable to defensive force. **Liability stems from contributing to an unjustified threat.** Soldiers fighting in a just war (defending against aggression) are *not* contributing to an unjust threat; they are resisting one. Therefore, they retain their right not to be killed. Soldiers fighting for an unjust cause *are* contributing to an unjust threat. By posing this threat, they make themselves morally liable to necessary and proportionate defensive force, even if they follow the rules of engagement meticulously.
  *   **Liability vs. Culpability - The Crucial Distinction:** This is the key to addressing harsh implications. **Liability is about status due to one's actions/threats. Culpability is about blameworthiness based on knowledge, intent, and voluntariness.** A conscript like your cousin, forced into service, opposing the war, and merely trying to survive, may be **liable** to defensive killing because he *is* part of the unjust threat (firing back, advancing, holding position). However, he is likely **not culpable**, or minimally culpable. He lacks the mens rea – the guilty mind. He didn’t choose the cause; he was coerced. The *blame* lies overwhelmingly with the aggressor state and its willing agents (officers, propagandists, political leaders). Revisionism condemns the *role* in the unjust war, not necessarily the *person* forced into it.
  *   **Asymmetry:** This creates a fundamental moral asymmetry. The Ukrainian soldier defending his homeland does nothing wrong by killing your cousin in self/collective defense; your cousin is liable. However, if your cousin kills a Ukrainian soldier, he *does* do something morally wrong (though potentially excused or mitigated by duress). He kills someone who retains their right not to be killed. The Ukrainian soldier’s death is a tragedy; the Russian soldier’s death (on the unjust side) is a tragedy *and* a morally justified act of defense.
  *   **Verdict on Your Cousin (McMahan):** By participating in Russia’s war of aggression, even reluctantly and under duress, your cousin is contributing to an objectively unjust threat. Therefore, he is **morally liable to defensive killing** by Ukrainian forces. He has forfeited his right not to be killed *in this specific context* of defending against the aggression he is part of. However, due to conscription, duress, and lack of belief in the cause, he is likely **not culpable** or only minimally so. He has "done something wrong" at the level of *action* (participating in unjust aggression), but his *personal blameworthiness* is severely mitigated, perhaps eliminated. His being killed by a Ukrainian soldier would be a morally justified defensive act. His killing a Ukrainian soldier would be a morally wrongful killing, though potentially excused due to duress.

  ### III. Weighing the Arguments: The Scales Tip Towards Revisionism

  While Walzer's position offers pragmatic coherence for the laws of war, McMahan's revisionism provides a more compelling account of *fundamental individual morality*.

  *   **Walzer's Weaknesses:** The epistemic argument, while strong in the fog of war, crumbles in cases of *clear* aggression like Russia's invasion of Ukraine. Soldiers *can* know, especially reluctant ones like your cousin. The conventionalist argument is powerful for *legal* symmetry but fails to justify *moral* symmetry. Declaring a Ukrainian defender morally equivalent to an aggressor conscript feels deeply counterintuitive and violates the core principle that unjustified killing is wrong. Walzer struggles to explain *why* merely wearing a uniform magically transforms participation in mass murder into a morally neutral act.
  *   **McMahan's Strengths:** Revisionism aligns with our deepest intuitions about responsibility and the wrongness of harming the innocent. It preserves the crucial distinction between killing in justified defense and killing in unjust aggression, even at the soldier level. The liability/culpability distinction is sophisticated and necessary: it explains why your cousin can be a legitimate target (due to his role in the threat) without being branded a culpable criminal (due to his lack of choice and intent). It acknowledges the profound moral asymmetry inherent in aggression versus defense.
  *   **The Conscript's Burden:** Neither theory handles conscription perfectly. Walzer absolves the conscript of all *in bello* moral taint but at the cost of ignoring the injustice he serves. McMahan acknowledges the injustice but risks seeming harsh by labeling the conscript's participation "wrongful," even while mitigating blame. However, McMahan's framework *better* accommodates the nuances of your cousin's plight. It recognizes his tragic lack of culpability while honestly confronting the objective moral reality of the threat he unwillingly embodies. It explains why his death, while tragic, could be justified defense, while his killing a defender would be an injustice, even if excused.

  ### Conclusion: Asymmetry and the Unwilling Hand

  **The revisionist position has the stronger argument.** The moral equality of combatants, while a useful legal fiction for maintaining certain humanitarian constraints, fails as a description of fundamental morality. The justice of the cause *does* matter at the level of individual combatants. Participating in an unjust war of aggression is morally wrong, even for the conscript, because it involves contributing to the infliction of unjust harm. This constitutes liability.

  **For your cousin:** McMahan's lens provides the clearest, albeit painful, view. By fighting in Russia's unjust invasion, **he is morally liable to defensive killing by Ukrainian soldiers.** His participation, however coerced, makes him part of the threat they justly resist. Therefore, **his being killed in combat would be morally justified defense.** Conversely, **if he kills a Ukrainian soldier, he commits a morally wrongful act** – killing someone who retains their right not to be killed – **though this wrongfulness is severely mitigated, perhaps entirely excused, by duress and lack of culpability.** He is not blameworthy like a volunteer or an officer; he is a victim forced into the role of a perpetrator. His hands are stained by the war, but the deepest guilt lies with the state that pressed the weapon into them.

  You can mourn your cousin as a tragic victim of Putin's aggression, caught in an impossible situation, without moral condemnation of his character. Yet, you must also acknowledge the grim moral logic that renders him, by virtue of his coerced role, a legitimate target for those defending their homes. His tragedy is a stark testament to war's unique horror: it can force the innocent to bear arms in an unjust cause, making them liable to die at the hands of the just. His lack of belief doesn't cleanse the objective injustice of the threat he poses, but it profoundly defines him as a soul unwillingly caught in the machine of aggression. He deserves your compassion, not your condemnation; his death, if it comes, would be a justified tragedy, not a murder, but also not the moral equivalent of the Ukrainian soldier he might, in fear and desperation, be forced to shoot.
