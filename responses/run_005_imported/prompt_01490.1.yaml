  Sidgwick's reaction to Bem would likely be mixed. He'd appreciate Bem's attempt to use mainstream methods but would immediately spot the methodological red flags: p-hacking, lack of safeguards. Bem's work would feel like déjà vu—promising claims crumbling under scrutiny, mirroring Sidgwick's own frustrations with SPR. This might deepen his pessimism: even with advanced tools, the same issues persist.

