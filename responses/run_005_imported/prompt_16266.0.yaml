  hey, so my philosophy podcast (it's just me and my flatmate, pretty low stakes) has a guest lined up next week who's known for defending Bostrom's simulation argument -- like the actual trilemma, not the vibes-y 'what if we're in a simulation' thing people post online. I'm taking a formal epistemology course rn that just covered anthropic reasoning and the doomsday argument, so I want questions that actually engage that machinery instead of letting her re-explain the trilemma again. can you draft 7-8 interview questions? need at least one pressing on how her indifference/self-sampling reasoning lines up with the doomsday argument's use of the same move, and whether swapping in the self-indication assumption instead would undercut her conclusion; one on how much the whole thing depends on computationalism being true (she usually dodges this with 'that's a separate debate in phil of mind, my argument's just conditional on it,' so word it so the dodge doesn't fully work); and one on whether the argument actually has any falsifiable or practical upshot, or if its just unfalsifiable metaphysics. for each of those three, tack on a quick follow-up keyed to whatever answer she'll probably give.
