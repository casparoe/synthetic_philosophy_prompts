prompt: |-
  Ok, weirdly specific thing but its been bugging me. My friend and I have co-hosted a small trivia night for a few years now and always split the prize "evenly between whoever wrote the questions that round." For something like 50 rounds that was never ambiguous, you either sat down and wrote the round or you didnt. Last week she spent two hours researching a history round and outlining exactly what every question and answer should say, then handed it to me and I turned her outline into the actual final questions we read out on the mic. She insists she "wrote" that round, same rule as always. I insist the rule always meant whoever produced the final text, same rule as always. Neither of us is lying and honestly the money's trivial, like $40 total, we each just genuinely believe we're continuing the exact standard we've used since round one. This feels like it's stopped being a factual disagreement and turned into some other kind of disagreement, honestly the sort of thing that'd blow up an ACX comment section, but I can't pin down what's actually going on. Is there some fact about what the rule secretly meant all along that one of us is just missing, or is something else going on here?
