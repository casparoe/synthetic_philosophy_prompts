      u(x_n) >= 2^n   for each n.

  Then the expected utility would be:

      E[u] = sum_{n=1}^{∞} (1/2^n) * u(x_n) >= sum_{n=1}^{∞} (1/2^n) * 2^n = sum_{n=1}^{∞} 1 = ∞.

  Therefore, the expected utility is infinite.

