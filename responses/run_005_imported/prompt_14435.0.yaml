      x_n = some value such that u(x_n) >= 2^n.

  We can choose x_n to be increasing. This is possible because u is unbounded: for each n, the set {x: u(x) >= 2^n} is unbounded above, so we can pick x_n as large as we want. We can even choose x_n to be increasing with n.

  But note: we must be able to assign the payoffs. The gamble is defined by the outcomes and their probabilities. We are free to choose the payoffs arbitrarily.

  Therefore, for any unbounded utility function u, we can construct a St. Petersburg-style gamble with:

      probability of outcome n: p_n = 1/2^n
