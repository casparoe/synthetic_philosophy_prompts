  We are given an arbitrary unbounded utility function u: R+ → R, meaning that for any real number M, there exists some x such that u(x) > M. We wish to show that for this utility function, we can design a St. Petersburg-style gamble (i.e., a sequence of outcomes with probabilities halving and payoffs growing in a way we choose) that yields an infinite expected utility.

  Recall the original St. Petersburg paradox: a fair coin is tossed until it comes up heads. If the first head appears on the n-th toss, the payoff is 2^n. The probability of this event is 1/2^n. The expected payoff is then:

      E[payoff] = sum_{n=1}^{∞} (1/2^n) * 2^n = sum_{n=1}^{∞} 1 = ∞.

  But with a utility function, we care about expected utility. The original paradox used linear utility. Bernoulli proposed using log utility (which is concave and unbounded) to resolve it: with u(x) = log(x), the expected utility becomes:

      E[u] = sum_{n=1}^{∞} (1/2^n) * log(2^n) = sum_{n=1}^{∞} (1/2^n) * n * log(2) = log(2) * sum_{n=1}^{∞} n/2^n < ∞.

  However, we are to show that for any unbounded utility function u (no matter how slowly it grows), we can design a gamble that has infinite expected utility.

