  so in my epistemology seminar we just spent two weeks on Cartesian skepticism and then moved into Putnam's brain-in-a-vat stuff from Reason, Truth and History, and I think I finally get the actual arguement (as opposed to just the sci-fi scenario everyone already knows from The Matrix). The part that clicked for me is the semantic externalism move: if you'd literally been a brain in a vat since birth, your word "vat" would only ever have been causally hooked up to the simulated vat-image or whatever electrical impulses are feeding you, never to an actual vat, so when you assert "I am a brain in a vat" the sentence comes out false (or fails to even express the worry you meant it to) pretty much no matter what. My professor's whole point is that this is supposed to be a way more interesting response to skepticism than "well, you can't rule it out," because the supposition undercuts itself the moment you try to state it.

  anyway I tried explaining this to my roommate as a fun fact and she just stared at me, so now I want to try it as a joke instead. Can you write me an actual joke about brain-in-a-vat skepticism where the punchline depends on that self-refutation/causal-theory-of-reference point -- or, if you can make it work better, on some other real wrinkle from the debate, like Nozick's tracking stuff and why he thinks you can know you have hands without being able to know you're not a vat-brain. I don't want a generic "whoa, what if reality isn't real" stoner joke -- I want something where someone who's only seen The Matrix wouldn't get why it's funny, but someone who actually sat through the Putnam reading would laugh (or at least groan) and feel a little called out. One joke is enough, but throw in a line afterward explaining why it works if that's not obvious from the joke itself.
