  Then there's the question of whether the vNM axioms apply in the original position. Rawls might argue that the uncertainty behind the veil isn't the same as probabilistic risk. If probabilities aren't known, maybe people can't assign probabilities to different positions. Without probabilities, expected utility doesn't apply, and maximin becomes a viable rule.

  Another point is the commensurability of utilities. Harsanyi assumes utilities are interpersonally comparable and additive. But Rawls rejects this, thinking utilities can't be measured that way. Instead, primary goods are a better basis for justice. This ties into the different views on what constitutes rationality. Rawls sees rationality as avoiding worst-case scenarios, not maximizing expected utility.

  Also, the nature of the choice matters. Principles of justice are constitutional-level decisions, which are irreversible. This might make people more cautious. Plus, the veil of ignorance might not allow for probabilistic assessments, leading to uncertainty instead of risk. Under uncertainty, maximin is a standard decision rule.

  The user might be coming from an economics background, familiar with Harsanyi but not Rawls' philosophical rebuttals. They might assume that Harsanyi's formal model settles the debate. But philosophers challenge the model's applicability to Rawls' setup. The deeper need is understanding why philosophical arguments persist despite formal proofs. They want insight into the methodological differences between economics and political philosophy.

  I should also mention that Rawls' primary goods provide a different metric, avoiding utility comparisons. And that maximin isn't absolute but for basic structures. The user might not realize that Rawls' position is more nuanced. Highlighting these distinctions shows why the debate continues beyond Harsanyi's theorem.
answer: |-
  That's an excellent and incisive question that cuts to the heart of a major debate in political philosophy and welfare economics. While Harsanyi's argument is powerful and formally rigorous, political philosophers continue to treat maximin as a serious rival to utilitarianism for several compelling reasons, largely stemming from critiques of Harsanyi's interpretation of the Rawlsian original position and the underlying assumptions. Here's a breakdown of the key arguments:

  1.  **Divergent Interpretations of Rationality and Risk:**
      *   **Harsanyi (Expected Utility Maximization):** He assumes rational agents behind the veil, facing *risk* with known probabilities (assuming an equal chance of being anyone in society), will maximize their *expected utility*. This directly leads to average utilitarianism (summing utilities).
      *   **Rawls (Maximin under Radical Uncertainty):** Rawls argues the veil creates *radical uncertainty*, not calculable risk. Parties have *no basis* for assigning probabilities to ending up in any particular position. Choosing principles of justice is a unique, high-stakes, once-and-for-all decision affecting one's fundamental life prospects. Under these conditions of profound uncertainty about potentially disastrous outcomes (e.g., being born into crushing poverty or slavery), Rawls argues it is rational to be extremely risk-averse and choose the principle that secures the best worst-case scenario (maximin). It's about guaranteeing an acceptable minimum, not gambling on averages.

  2.  **Critique of the vNM Axioms in the Original Position:**
      *   Rawlsians argue that the von Neumann-Morgenstern axioms (especially the continuity and independence axioms) are inappropriate for the *specific context* of choosing basic principles of justice.
      *   **High Stakes & Incommensurability:** The potential losses (e.g., loss of basic liberties, extreme deprivation) are argued to be qualitatively different and potentially incommensurable with potential gains. Violating a basic liberty might not be compensable by any amount of increased wealth for others. The vNM axioms assume all outcomes can be traded off continuously, which Rawlsians reject for fundamental rights and primary goods.
      *   **The Nature of the Choice:** Choosing constitutional essentials is not analogous to choosing a gamble; it's a unique, foundational decision setting the basic structure of society. Different decision rules apply.

  3.  **Interpersonal Comparability and the Metric of Advantage:**
      *   **Harsanyi:** Assumes individual utilities are cardinally measurable and interpersonally comparable on a common scale. Social utility is the simple sum/average of these individual utilities.
      *   **Rawls:** Explicitly *rejects* the idea that we have a reliable, ethically neutral way to measure and compare cardinal utilities across individuals. His solution is to focus on an index of *primary goods* (basic liberties, opportunities, income, wealth, the social bases of self-respect) which are all-purpose means anyone needs to pursue their conception of the good. Maximin is applied to the distribution of these primary goods, *not* to subjective utility. This avoids the problematic assumptions about utility measurement and comparison.

  4.  **The Purpose of the Veil and the "Thin" Theory of the Good:**
      *   Rawls's veil is thicker than Harsanyi assumes. Parties don't know their specific conceptions of the good life, only that they desire primary goods. They are motivated not by maximizing a pre-existing utility function, but by securing the means to pursue *whatever* conception of the good they turn out to have. This "thin" theory of the good shifts the focus away from utility aggregation towards guaranteeing access to essential resources.

  5.  **The Scope of Maximin:**
      *   Rawls applies maximin specifically to the choice of principles governing the *basic structure* of society (constitution, core economic institutions), *not* to every policy decision. He argues it's a suitable rule for this fundamental, high-stakes choice under uncertainty. Utilitarianism, he contends, risks sacrificing fundamental interests of the least advantaged for aggregate gains.

  6.  **Philosophical Intuitions about Justice:**
      *   Many philosophers find the *conclusion* of maximin – that justice requires prioritizing the worst-off – more intuitively compelling than utilitarianism's potential to justify significant sacrifices of the few for the greater good. The persistence of maximin reflects this deep-seated intuition about fairness and the moral importance of preventing destitution and securing basic rights, even if formal models point elsewhere under specific assumptions.

  **Why the Debate Persists:**

  In essence, Harsanyi and Rawls model the original position differently and embed different assumptions about rationality, risk, uncertainty, and the appropriate metric for justice:

  *   **Harsanyi:** Models it as a problem of *individual rational choice under risk* with known probabilities, using *cardinal utility* as the metric. Yields utilitarianism.
  *   **Rawls:** Models it as a problem of *collective moral choice under radical uncertainty*, using an *index of primary goods* as the metric. Yields maximin (as part of his two principles).

  **Political philosophers don't dismiss Harsanyi's theorem as incorrect mathematics; they argue it misapplies the vNM framework to a context where its assumptions (known probabilities, cardinal utility, continuity of preferences over fundamental goods) are inappropriate or ethically questionable.** They see Rawls's construction, with its focus on primary goods, radical uncertainty, and the unique nature of the choice, as providing a more plausible and ethically sound model for deriving principles of justice. Therefore, maximin isn't seen as an "incorrect derivation" within Harsanyi's model, but as the correct outcome within a different, and arguably more relevant, model of the original position and the demands of justice. The rivalry persists because it reflects a fundamental disagreement about the nature of rationality under deep uncertainty and the very foundations of a just society.
