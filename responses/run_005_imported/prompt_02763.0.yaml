answer: |-
  The mud in Batu Khan’s camp sucked at boots like a hungry thing. Spring thaw in the Pannonian Basin was a greasy, treacherous affair. Batu, grandson of Genghis, stared west past the skeletal trees. Beyond lay Vienna, perhaps Rome. The dream tasted like cold iron on his tongue.

  Subutai, the Old Falcon, emerged from his tent. His face, etched by decades of wind and war, was grim. "The foragers return empty-handed again, Prince. The Hungarians burned everything before us. The grass… it’s sparse. Too sparse for the herds."

  Batu grunted, kicking a clump of half-frozen earth. "We broke them at Mohi. Their king flees like a whipped dog." Yet his voice lacked its usual fire. The land *was* resisting. Stone castles, harder nuts than steppe fortifications, dotted the landscape like stubborn teeth. Rivers, swollen with meltwater, were treacherous barriers. The endless rain turned trails into sucking bogs, slowing their legendary mobility to a crawl. Horses, the soul of their power, were growing thin-ribbed and weak. Sickness whispered through the ranks.

  A commotion erupted at the camp's edge. A rider, caked in mud from boots to eyebrows, his mount lathered and near collapse, pushed through the picket lines. He bore the seal of Karakorum. Batu’s heart, for a fleeting, illogical moment, surged – reinforcements? Gold? Permission to raze Europe to its foundations?

  The messenger staggered before Batu and Subutai, gasping. He thrust a damp parchment into Batu’s hand. The words were stark, final: **Great Khan Ogedei is dead. Return. Kurultai must be held.**

  The air left Batu’s lungs. Ogedei, his uncle. The anchor of the empire. Dead. Not in glorious battle, but… gone. Just like that. A wave of cold washed over him, colder than the spring mud. *Now?* When they stood poised…?

  He looked at Subutai. The Old Falcon’s expression hadn’t changed, yet Batu saw the calculations clicking behind his eyes, faster than any abacus. Subutai’s gaze swept the camp – the gaunt horses, the muddy disarray, the weary faces of men who had campaigned for years across continents. He looked west, towards the unseen Alps, the unknown kingdoms beyond Hungary. His hand rested briefly on the worn hilt of his sword.

  For a heartbeat, Batu saw it too. Not the muddy camp, but the endless green plains beyond Hungary dissolving into a map unfurled in his mind. *What if?* The sheer, intoxicating *what if?* Vienna crumbling. German forests echoing with Mongol horns. The blue sea… Rome itself? A shiver that had nothing to do with the cold ran down his spine. It was a vision vast and terrifying, a path lit by fire.

  Then Subutai spoke, his voice a dry rasp. "The rivers rise daily, Prince. The grass fails. Our herds dwindle. The *Tumen* commanders... they speak of home. Of their shares." He paused, letting the logistical nightmare hang in the damp air. "Karakorum calls. The law is clear."

  Batu crumpled the damp parchment in his fist. The dream-image shattered, replaced by the sucking mud, the skeletal horses, the messenger’s exhausted face, and the implacable law of the Steppe succession. Was it the Khan’s death, this single, stupid act of a man succumbing to his own excesses far away, that snapped the taut bowstring? Or was it the land itself – the mud, the stone castles, the burned earth, the starving horses – that had already drawn the blood from their campaign? Had they already reached the end of their tether, the news from Karakorum merely the final, convenient knot?

  He looked from the parchment in his fist to the weary, expectant faces of his commanders gathering around him. He looked west one last time, where the dream shimmered like a mirage on the wet horizon. Then he looked at Subutai, whose old eyes held no surprise, only the cold assessment of terrain, supply, and the fragile threads of loyalty stretched thin across thousands of miles.

  "Break camp," Batu ordered, his voice flat. "We ride east. For Karakorum." The words tasted like ashes, but also, perhaps, like relief. The messenger sagged with exhaustion. Around them, the camp began to stir, the sound not of retreat, but of a machine reversing its colossal gears, groaning in the thick, inevitable mud. Subutai turned away, already planning the route home, his mind a map of rivers to cross and pastures to find. The *what if* lingered, unspoken, dissolving like the last of the winter snow into the hungry earth.
