prompt: |-
  So I've been down a rabbit hole for a piece on scientific realism, and theres one puzzle about structural realism I can't shake. I get the basic pitch -- Worrall's point that Fresnel's old equations for light survived, more or less structurally intact, into Maxwell's completely different theory, so maybe what science really tracks is structure rather than the "true nature" of the underlying stuff. But apparently there's an old objection (I think it goes back to a 1920s review of Russell by a guy named Newman) that's supposed to show this is almost an empty claim: once you spell out "we only know the structure" formally, it basically reduces to a fact about how many objects are in the domain, and gets satisfied almost automatically. Every writeup I find dives straight into the model theory and my eyes glaze over. Can you give me the plain, gut-level version of why "merely knowing the structure" is supposedly so cheap, and why its such a big problem -- and whether the more hardcore "ontic" structural realists, who say structure is ALL there is, actually escape the trick or just inherit it?
