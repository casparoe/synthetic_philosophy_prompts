prompt: |-
  Got into it with my friend Priya last night over beers about the "problem of old evidence" in Bayesian confirmation theory -- you know, the Glymour puzzle about how Mercury's perihelion precession couldn't have confirmed general relativity on a naive Bayesian story, since P(E) was already 1 by the time Einstein came along. Priya's position is that the Garber-Jeffrey fix (drop logical omniscience, treat "H entails E" as itself something you learn and conditionalize on) basically dissolves the whole puzzle. I said that just pushes the mystery back a level, since now you owe an account of what it even means to rationally update on a logical/mathematical fact rather than an empirical one, and that seems just as mysterious as the original problem, maybe more so. We went back and forth for like an hour and never really resolved it. Can you actually explain how good the Garber-Jeffrey move is, whether my "relocation" objection is a real bullet or if im missing something, and how it compares to Howson's counterfactual-credence alternative?
reasoning: |-
