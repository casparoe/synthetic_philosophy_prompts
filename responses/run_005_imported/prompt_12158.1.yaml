  Now, the moral: the theorem shows that AC (with full Separation) implies LEM. Therefore, in an intuitionistic setting, we cannot have both full Separation and full AC without collapsing to classical logic.

  Which one is to blame? Both are necessary. If we do not have full Separation, then we cannot form the sets A and B arbitrarily. In fact, in some constructive set theories (like CZF), Separation is restricted to bounded formulas (i.e., Δ0 formulas) and then the theorem does not go through. Similarly, without AC, we cannot get the choice function.

  However, note that in the construction, the sets A and B are defined using the disjunction with an arbitrary proposition p. This is a very strong use of Separation. In constructive foundations that do not allow such arbitrary Separation (like type theory), the problem does not arise.

