answer: |-
  Your reconstruction of the Diaconescu-Goodman-Myhill argument is correct and intuitionistically valid, including the step you questioned (step 4). Below, I'll clarify the logic, address your concerns about Separation vs. Choice, and assess the "secretly classical" claim for a general audience.

  ### Step-by-Step Validation:
  1. **Separation forms `A` and `B`**:  
     - `A = {x ∈ {0,1} : x = 0 ∨ p}` and `B = {x ∈ {0,1} : x = 1 ∨ p}` are valid by unrestricted Separation.  
     - Both sets are inhabited: `0 ∈ A` (since `0 = 0` is true) and `1 ∈ B` (since `1 = 1` is true), regardless of `p`.  
     - **Crucial intuitionistic point**: If `p` is true, `A = B = {0,1}`. If `p` is false, `A = {0}` and `B = {1}`.  

  2. **Apply Choice to `{A, B}`**:  
     - The axiom of choice (AC) provides a function `f` such that `f(A) ∈ A` and `f(B) ∈ B`.  

  3. **Decidable equality on `{0,1}`**:  
     - Since `{0,1}` has decidable equality, `f(A) = f(B) ∨ f(A) ≠ f(B)` holds intuitionistically.  

  4. **Case `f(A) ≠ f(B)` implies `¬p`**:  
     - Your worry: Does `A = B` (when `p` is true) force `f(A) = f(B)`? **Yes, intuitionistically.**  
       - If `p` is true, then `A = B`, so the set `{A, B}` is a singleton (`{A}` or `{B}`).  
       - A choice function on a singleton must pick a single value for its only element. Since `A = B`, we have `f(A) = f(B)` (as `A` and `B` are identical labels for the same set).  
     - Thus, if `f(A) ≠ f(B)`, `p` cannot hold (as assuming `p` forces a contradiction). So `¬p` follows.  

  5. **Case `f(A) = f(B)` implies `p`**:  
     - `f(A) ∈ A` implies `f(A) = 0 ∨ p`.  
     - `f(B) ∈ B` implies `f(B) = 1 ∨ p`.  
     - Since `f(A) = f(B) = c` (say), we have `(c = 0 ∨ p) ∧ (c = 1 ∨ p)`.  
     - Intuitionistically:  
       - If `c = 0`, then `0 = 1 ∨ p`. But `0 ≠ 1`, so `p` holds (by disjunctive syllogism, valid here because `0 = 1` is decidable and false).  
       - If `c = 1`, then `1 = 0 ∨ p` similarly implies `p`.  
       - If `p`, then `p` holds.  
     - Thus, `f(A) = f(B)` implies `p`.  

  **Conclusion**: `f(A) ≠ f(B) ∨ f(A) = f(B)` implies `¬p ∨ p`. Since `p` was arbitrary, this derives full excluded middle (LEM).  

  ### Is Choice or Separation More to Blame?  
  Both are necessary, but they play distinct roles:  
  - **Unrestricted Separation** creates sets `A` and `B` that depend on an arbitrary proposition `p`. This is non-constructive because it assumes `{x : φ(x)}` exists even when `φ` (here, `x = 0 ∨ p`) lacks a constructive witness.  
  - **Axiom of Choice** then "amplifies" this non-constructiveness: it forces a global decision (via `f(A)` and `f(B)`) about whether `A` and `B` are identical or distinct, collapsing the vagueness of `p` into classical LEM.  

  **Verdict**:  
  - Separation enables the construction of sets that are "too abstract" for constructivism (e.g., `A` and `B` are extensionally equal if `p` holds, but constructively indistinguishable otherwise).  
  - Choice acts as the catalyst that converts this abstraction into LEM. Without Choice, Separation alone doesn't imply LEM.  
  **Thus, Choice deserves primary blame for smuggling in classical logic**, but it requires Separation to create the pathological sets.  

  ### Is Choice "Secretly Classical"?  
  **For a general audience, this is a fair statement**, with two caveats:  
  1. **Context matters**:  
     - In **classical logic**, AC is often seen as "innocent" (e.g., it avoids paradoxical set splits).  
     - In **constructivism**, AC is "secretly classical" because it implies LEM when combined with Separation (as shown). This violates the constructive tenet that existence requires computable witnesses.  
     - **Clarify**: "Secretly classical" means AC is incompatible with core constructive principles (like the refusal of LEM) when set theory has full Separation.  

  2. **Weak Choice is acceptable**:  
     - Constructivists (like Bishop) accept **weaker choice principles** (e.g., countable or dependent choice). These avoid the Diaconescu argument by restricting to "manageable" sets (e.g., countable collections), where Choice doesn't force LEM.  
     - **Example**: Dependent choice is used in constructive analysis to build sequences recursively without implying LEM.  

  ### Addressing Martin-Löf Type Theory  
  You're right that Martin-Löf type theory (MLTT) treats "choice" as trivial—but this is a **different principle**:  
  - **MLTT "choice"**: If `∀x ∃y R(x,y)`, then `∃f ∀x R(x, f(x))`.  
    - This is a theorem (via the `Π-Σ` isomorphism), deriving a function directly from a proof of `∀x ∃y`.  
    - It holds because proofs are constructive: a proof of `∃y` must supply a witness, so `f` is built from these witnesses.  
  - **Set-theoretic AC**: Asserts a choice function exists without constructing it.  
    - This is non-constructive when sets like `A` and `B` lack defined witnesses.  

  **Key difference**: MLTT has no unrestricted Separation. Sets (types) are built inductively, so you can't form "pathological" sets like `A` and `B` above. Thus, AC in MLTT doesn't imply LEM.  

  ### Final Refinement for Your Article  
  To present this clearly:  
  > "The axiom of choice has a secret classical bias: in constructive set theory, it forces mathematics to obey the law of excluded middle—every statement must be true or false, even if we can't compute which. This bombshell result (Diaconescu-Goodman-Myhill) shows why pioneers like Errett Bishop restricted choice. Yet weaker choice principles survive, allowing sequences to be built step-by-step without collapsing the constructive universe. Even in modern type theory, a 'choice-like' rule is harmless—but only because it operates in a witness-rich world without the set-theoretic baggage."  

  This balances accuracy and accessibility, highlighting Choice's classical consequences while acknowledging nuances. Your sketch is sound; no overstatement.
