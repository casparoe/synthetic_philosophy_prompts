prompt: |-
  So I'm taking an epistemology seminar this semester and we just finished the whole Gettier unit and moved on to stuff about knowledge, evidence, and when it's rational to change your mind about something. Anyway, something that happened with my friends this weekend has been stuck in my head and it feels connected to what we're discussing in class even though I can't totally place why.

  My friend Alex has been dating this guy Chris for about two years, and she's always insisted she just KNOWS he'd never cheat on her - not in a naive "he'd never do that" way, but like, two years of watching how he acts is enough evidence for her to actually know it, according to her. This weekend our other friend showed her some screenshots of Chris being pretty flirty with a coworker on instagram. Alex barely glanced at them before waving it off. When we asked if she wanted to actually look into it more, she got kinda defensive and said something like "I already know Chris wouldn't cheat on me, so whatever this is, it has to have an innocent explanation - if I already know its not true, then any 'evidence' that it is true is automatically misleading, so theres no point wasting time investigating misleading evidence."

  That last part is what's been bugging me. It sounds unhinged, but when I actually tried to locate the flaw in the logic I got stuck - like, if she really does know Chris is faithful, isn't she technically right that any evidence against that must be misleading somehow? But that can't be right either, because then literally anyone who "knows" anything would be justified in never seriously considering counter-evidence again, about anything, ever. Is Alex just in denial and dressing it up as logic, or is there an actual argument buried in there that's genuinely hard to escape? Kinda want to bring it up in section this week but i don't even know how to frame it yet. Would love to hear your take.
