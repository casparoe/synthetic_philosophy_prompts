  For "P or not-P," like "This is a heap or this is not a heap," each precisification assigns a sharp boundary, so in every precisification, one of the disjuncts is true. Thus, the disjunction is true in all precisifications, making it super-true. So the law of excluded middle holds supervaluationistically. The user's error was applying Kleene's semantics directly, but supervaluationism uses a different mechanism.

  Next, the user wonders about the substantive disagreement if both views preserve classical logic. Epistemicism maintains classical logic fully with bivalence and no truth-value gaps. Supervaluationism keeps classical tautologies like excluded middle but introduces truth-value gaps for borderline cases. The key difference is in the nature of vagueness: epistemicism attributes it to ignorance, while supervaluationism sees it as semantic indecision. Also, supervaluationism allows for higher-order vagueness, which epistemicism struggles with.

