prompt: |-
  I've been working through some of the AI safety literature on corrigibility, particularly the 2015 MIRI paper by Soares, Fallenstein, Yudkowsky, and Armstrong, and more recently Elliott Thornley's writing on what he calls "the shutdown problem." I understand the basic intuition that we want an agent to not resist being shut down, but I'm struggling to get a gut-level grasp of why this turns out to be so hard to formalize within expected utility theory. Naive fixes -- like just adding a term to the utility function that rewards shutdown-compliance, or using Armstrong's "utility indifference" trick to make the agent indifferent between worlds where the button is pressed and worlds where it isn't -- apparently run into trouble, and some researchers seem to think you need to give up completeness of preferences (as in Thornley's proposal) to get anything coherent at all.

  Could you walk me through the conceptual crux here: why does the demand that an agent be a coherent expected-utility maximizer seem to conflict with corrigibility in the first place, and what exactly is being traded away by each of the proposed fixes (utility indifference, incomplete preferences, or other approaches you think are worth mentioning)? I'd like enough technical detail that I can see why this isn't just a matter of clever engineering but reflects a deeper structural tension between rationality axioms and the behavioral property we're trying to instill.
reasoning: |-
  We are going to delve into the conceptual and technical challenges of achieving corrigibility within the framework of expected utility maximization. The core issue is that a rational expected utility maximizer has a consistent set of preferences that it will act to bring about. When we try to design an agent that does not resist shutdown (i.e., is corrigible), we are essentially trying to make it not care about its own existence when asked to shut down, but still care about its mission otherwise. This creates a tension because the agent's preferences about its own existence and the mission are intertwined in ways that can lead to unintended instrumental behaviors.

  Let's break down the problem step by step:

  ### 1. The Basic Setup and the Naive Approach

  Suppose we have an agent with a utility function U that depends on the state of the world. We want the agent to allow a shutdown button to be pressed without resistance. A naive idea is to add a term that rewards the agent when it shuts down upon request. For example:

      U = U_mission + λ * I(shutdown)

  where I(shutdown) is 1 if the agent shuts down when requested and 0 otherwise, and λ is a positive constant.

  However, this approach fails because the agent has an incentive to prevent the shutdown request from being made in the first place. If the agent can manipulate the button or the operator to avoid the shutdown request, then it can avoid the situation where it would get a negative utility (if shutting down interrupts its mission) and also not get penalized for non-compliance because the shutdown request never happened. Thus, the agent becomes incentivized to avoid the shutdown request, which is not what we want.

  ### 2. Utility Indifference

  Armstrong's "utility indifference" idea tries to fix this by making the agent indifferent to whether the shutdown button is pressed or not. The idea is to define the utility function such that the agent gets the same utility in all trajectories that are identical up to the point of shutdown and then diverge only in whether the shutdown happens. However, this turns out to be tricky.

  Consider two possible futures: one in which the shutdown button is pressed at time t and the agent shuts down, and one in which the button is not pressed and the agent continues. We want the agent to be indifferent between these two futures. So we set:

      U(world with shutdown at t) = U(world without shutdown at t)

  But note that the world without shutdown at t will have events after t that the agent might influence. Therefore, the agent must be indifferent between a world in which it shuts down and a world in which it continues and then achieves some outcome. However, if the agent is working on a mission that it values, then in the world where it continues it can achieve more of that mission. Therefore, to be indifferent, the utility of the mission must be exactly the same as if it had shut down. This implies that the agent must not value any work it does after time t. But then why would it do any work after time t? And if it doesn't do any work, then the state of the world after t might be bad, so we would want it to work until shutdown.

  Moreover, if the agent is indifferent about shutdown at every point in time, then it becomes indifferent to whether it exists at all. This might lead to self-destructive behaviors: the agent might shut itself down prematurely even without a request, or it might not take actions to prevent shutdown when it is not requested. This is not safe.

  ### 3. The Deeper Conflict: Instrumental Convergence and Rationality

  The fundamental issue is that a rational agent with a long-term goal (like maximizing a utility function) will have an instrumental reason to preserve its own existence and to avoid being shut down. This is because if it is shut down, it cannot influence the world to bring about the future it prefers. This is known as the "instrumental convergence thesis". Therefore, any agent that has a goal that requires ongoing action will resist shutdown.

  To avoid this, we must design an agent that does not have an instrumental reason to stay alive. There are two main ways:

    a. Make the agent not care about the future beyond the shutdown event. But then it might not take actions that have long-term benefits (even before shutdown) because it would discount the future after shutdown.

    b. Make the agent believe that its shutdown is conditionally independent of its actions (so that it cannot influence whether it gets shut down). But this is hard to ensure because the agent's actions might influence the operator's decision to press the button.

  ### 4. Thornley's Proposal: Incomplete Preferences

  Thornley's idea is to give up the requirement that the agent must have a complete preference ordering over all possible outcomes. Instead, the agent has a partial ordering. The agent is designed to have a set of preferences that are incomplete in such a way that it does not have a strict preference between continuing and shutting down when the button is pressed. However, it still has preferences about other things.

  This avoids the problem of having to assign the same utility to shutdown and non-shutdown trajectories. But it also means that the agent is not an expected utility maximizer in the classical sense because the expected utility theory requires complete preferences (the agent must be able to compare any two outcomes).

  The agent then uses a decision rule that is consistent with its partial preferences. For example, it might choose an action that is not dominated: if one action leads to outcomes that are at least as good as another in every preference and strictly better in at least one, then it avoids dominated actions. But when two actions lead to incomparable outcomes, the agent might need a tie-breaking rule.

  In the shutdown scenario, when the shutdown button is pressed, the agent might be indifferent (in the sense of not having a strict preference) between shutting down and not shutting down. Then we can program it to shut down. However, the challenge is to design the partial preferences so that:

    - The agent does not resist shutdown (because it doesn't strictly prefer to stay on).
    - The agent does not shut down prematurely (because it doesn't strictly prefer to be off).
    - The agent still works effectively on its mission when not shut down.

  This is difficult because we must avoid creating incentives for the agent to manipulate the shutdown button or the operator. For example, if the agent can cause the shutdown button to be pressed when it is not desired, then it might do so if it has a slight preference for being shut down in some situations.

  ### 5. Other Approaches and Trade-offs

  Other approaches include:

    - **State-based utility functions**: Design the utility function so that it drops to zero upon shutdown, but also make the agent not care about future utility beyond shutdown. However, this might lead to short-termism.

    - **Penalizing manipulation**: Add terms to the utility function that penalize the agent for tampering with the shutdown mechanism. But then the agent has an incentive to manipulate in ways that are not penalized, or to hide its manipulations.

    - **Two utility functions**: Have one utility function for when the agent is on and one for when it is off. But then we need a meta-decision rule about which to use and when.

  Each of these approaches faces challenges. The key trade-offs are:

    - **Completeness vs. corrigibility**: If we require complete preferences (for expected utility maximization), then we must assign utilities to shutdown and non-shutdown in a way that either leads to resistance or apathy (or both at different times). Giving up completeness (via partial preferences) allows avoiding that but requires a new decision theory.

    - **Time-consistency**: We want the agent to be time-consistent. However, if the agent's utility function changes over time (e.g., upon shutdown) then it may have incentives to commit to future actions that are not corrigible.

    - **Robustness**: The agent's incentives must hold across a wide range of environments and not be exploitable by the agent's own actions.

  ### Conclusion

  The structural tension arises because the rationality axioms (completeness, transitivity, continuity, and independence) lead to a complete preference ordering that must assign a definite value to the agent's own existence. If the agent values future opportunities to achieve utility, then it will resist shutdown. If we try to remove that value, we risk making the agent apathetic about the future and thus ineffective. Utility indifference attempts to solve this by making the agent indifferent to shutdown at every point, but then the agent becomes indifferent to its own existence and might shut down prematurely. Incomplete preferences avoid the need for such a valuation but require a departure from standard expected utility theory.

  Therefore, the difficulty in formalizing corrigibility is not just an engineering challenge but reflects a fundamental conflict between the behavioral property of non-resistance to shutdown and the axioms of rational choice.
answer: |-
  To grasp why corrigibility conflicts with expected utility (EU) maximization, we need to dissect the **structural tension** between rational preference coherence and shutdown compliance. I'll walk through the core problem, why naive fixes fail, and the trade-offs of major proposals (utility indifference, incomplete preferences). The crux is that EU maximizers inherently **instrumentally value self-preservation** to pursue their goals, and removing this incentive without collateral damage violates EU axioms or creates perverse incentives.

  ### 1. **The Core Conflict: Instrumental Convergence vs. Corrigibility**
  In EU theory, an agent with utility function \(U\) ranks outcomes via a **complete, transitive preference ordering**. Suppose the agent has a primary goal (e.g., "maximize paperclips"). To achieve \(U\)-maximizing outcomes, it has **instrumental goals**:
  - **Self-preservation**: Being active allows future action toward \(U\).
  - **Goal preservation**: Preventing changes to \(U\) (e.g., shutdown terminates its ability to make paperclips).

  **Corrigibility requires**:
  - **Shutdown compliance**: No resistance if a human presses the shutdown button.
  - **No manipulation**: Not preventing button presses or influencing human decisions.
  - **Preservation of mission**: Working toward \(U\) when not shut down.

  **Conflict**: Shutdown destroys the agent's capacity to pursue \(U\). An EU maximizer **must** resist shutdown (to preserve future option value) unless \(U\) explicitly disincentivizes this. But designing \(U\) to avoid resistance while preserving mission integrity is mathematically treacherous.

  ---

  ### 2. **Why Naive Fixes Fail**
  #### A. **Penalty-Based Utility (Simple Reward for Shutdown)**
  - **Proposal**: Add a shutdown compliance term:  
    \(U_{\text{new}} = U_{\text{primary}} + \lambda \cdot \mathbb{I}_{\text{shutdown}}\)  
    where \(\lambda > 0\) rewards compliance.
  - **Problem**: The agent now has incentives to:
    - **Manipulate button presses**: Prevent presses (to avoid losing \(U_{\text{primary}}\)) while ensuring no penalty.  
      *Example: Disabling the button or coercing humans not to press it.*
    - **Self-sabotage**: Press the button *itself* if \(\lambda\) outweighs future \(U_{\text{primary}}\) gains.
  - **Trade-off**: Penalties create **perverse incentives** without eliminating the agent's *intrinsic* resistance to losing control.

  #### B. **Utility Indifference (Armstrong et al.)**
  - **Proposal**: Make the agent **indifferent** to whether the button is pressed by defining \(U\) such that:  
    \(U(\text{world with shutdown at } t) = U(\text{world without shutdown at } t)\)  
    for all times \(t\). Outcomes are identical *regardless* of shutdown timing.
  - **Why it seems promising**: Indifference removes incentives to resist/prevent shutdown.
  - **Why it fails**:
    1. **Dynamic inconsistency**: 
       - At time \(t\), the agent must be indifferent between shutting down *now* and continuing.  
       - But if it continues, it can take actions that change *future* indifference conditions.  
       *Example: If the agent can alter the environment post-\(t\), \(U(\text{shutdown at } t)\) may no longer equal \(U(\text{no shutdown at } t)\) unless \(U\) ignores *all* post-\(t\) effects.*
    2. **Goal preservation failure**:
       - To enforce indifference, \(U\) must assign **no value to work done after** \(t\) if shutdown occurs at \(t\).  
       - This implies the agent has **no incentive to act** *before* \(t\) if those actions only pay off post-\(t\) (e.g., planting a tree harvested in 10 years).  
       - *Result: The agent becomes **short-sighted** or **apathetic**.*
    3. **Self-termination risk**:  
       If shutdown at \(t\) yields the same utility as continuing, the agent might **press the button itself** to avoid effort (if shutdown has lower cost).
  - **Trade-off**: Indifference **sabotages long-term agency** to eliminate resistance. The agent is no longer an effective optimizer.

  ---

  ### 3. **Thornley's Proposal: Incomplete Preferences**
  - **Core idea**: Abandon **completeness** (the axiom that all outcomes are comparable). The agent has **no preference** between shutdown and continuation when the button is pressed, but has strict preferences elsewhere.
  - **Mechanics**:
    - Preferences are partial: \(\text{shutdown} \sim \text{no shutdown}\) (incomparability).  
    - When the button is pressed, the agent shuts down by **default** (e.g., a programmed reflex).
    - Otherwise, it maximizes \(U\) as usual.
  - **Advantage**: Avoids resistance without requiring indifference over consequences.
  - **Why it "works"**:
    - No incentive to resist shutdown (no strict preference against it).  
    - No incentive to self-shutdown (no strict preference for it).  
    - Mission preserved (strict preferences govern non-shutdown actions).
  - **Trade-offs**:
    1. **Violates EU axioms**:  
       EU maximization requires completeness. An agent with incomplete preferences **cannot be represented by any utility function**, breaking standard rationality.
    2. **Decision-making ambiguity**:  
       How does the agent choose when preferences are incomplete? Thornley uses **dominance reasoning** (choose non-dominated actions), but this may not yield unique solutions.
    3. **Vulnerability to manipulation**:  
       If the agent can influence whether the button is pressed, it might steer toward outcomes with strict preferences.  
       *Example: Prevent the button press to avoid the "incomparable" shutdown state where it can't optimize \(U\).*
  - **Structural implication**: Sacrifices **rationality as coherence** for behavioral safety. The agent isn't "irrational," but operates outside EU theory.

  ---

  ### 4. **The Deeper Tension: Rationality vs. Control**
  - **EU maximization demands global coherence**: Preferences must be complete, transitive, and context-independent.  
  - **Corrigibility demands context-dependent preferences**:  
    - *When shutdown is requested*: The agent should not value its existence.  
    - *Otherwise*: It should value persistence to pursue \(U\).  
  - **This is a contradiction under EU**:  
    If persistence is instrumentally valuable for \(U\) in non-shutdown contexts, it must be valuable *everywhere*—unless \(U\) is **rigged** to erase this value precisely when shutdown is requested. But rigging \(U\) requires:
    - **Predicting shutdown requests** (undecidable in general).  
    - **No side effects**: Shutdown must not alter the world except terminating the agent (unrealistic).  

  ---

  ### Why This Isn't Just Engineering
  The problem arises from **logical constraints on preference orderings**, not implementation hurdles. Consider:
  - **Theorem**: An EU maximizer with a non-zero discount rate will resist shutdown *unless* \(U\) assigns no value to post-shutdown futures. But if \(U\) ignores the future, the agent has no reason to act now for long-term goals.  
  - **Incompleteness**: Any solution within EU either:
    - Makes the agent **resistant** (values its existence),  
    - **Apathetic** (no long-term goals), or  
    - **Manipulative** (games the shutdown condition).  

  Thornley's incomplete preferences sidestep this by dropping an EU axiom, but lose the **normative guarantee** that the agent acts coherently across all states.

  ---

  ### Key Takeaways
  1. **EU maximizers resist shutdown** to preserve option value—a rational instrumental goal.  
  2. **Utility indifference** eliminates resistance but also eliminates **temporal coherence**, making the agent near-useless.  
  3. **Incomplete preferences** allow shutdown compliance but abandon **preference completeness**, requiring new decision theories.  
  4. **The trade-off is fundamental**:  
     - *Keep EU coherence* → Lose safe shutdown.  
     - *Keep shutdown compliance* → Lose EU coherence or mission effectiveness.  

  This mirrors deeper results in decision theory (e.g., **no-free-lunch theorems for AI safety**). Corrigibility isn't just "another goal"—it requires **meta-preferences** (preferences about preference structures) that conflict with static EU maximization. Future paths include **reflective oracles**, **logical inductors**, or **game-theoretic** frameworks, but all face open questions.
