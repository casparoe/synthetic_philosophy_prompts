  Here is Mireille's argument, crafted for maximum impact within a tense, emotionally charged scene, directly addressing her brother's philosophical objections with rigorous behavioral economics:

  ---

  Mireille leaned forward, her elbows digging into her knees, the lamplight catching the fierce intelligence in her eyes. "Listen, Theo. Stop flagellating yourself with this 'weakness of will' nonsense. It's a phantom. A category error philosophers invented because they didn't have the math." Her voice was low, urgent, cutting through the haze of his craving. "What you're feeling right now? That overwhelming *need*? It's not your will betraying you. It's your discount function working exactly as it's wired to."

  She held up a hand, forestalling his protest. "Think of it like this: Every choice we make involves valuing future rewards against present ones. A rational agent with *exponential* discounting – the kind classical economics assumes – would always prefer $100 tomorrow over $99 today. Their valuation is consistent over time. But humans? We're *hyperbolic* discounters. Our valuation curves are steeply bowed towards the *now*."

  Mireille sketched an invisible curve in the air, her finger dipping sharply. "Three weeks ago, when you decided to quit, the future rewards – health, clarity, stability, *life* – were vivid. They felt close, valuable. You massively preferred them over the immediate hit. That wasn't a 'strong will,' Theo. That was your brain, from that temporal vantage point – let's call it Time T-minus-three-weeks – correctly maximizing utility: massive future gain outweighs the smaller, immediate cost of withdrawal."

  Her gaze locked onto his, unflinching. "But now? You're at Time T-zero. The craving is *here*. The future rewards? Health, clarity? They feel abstract, distant, discounted into near insignificance by the sheer proximity of the relief that bottle promises *right now*. Your discount curve has steepened catastrophically at this proximity. So, choosing the drink *isn't akrasia*. It's your *present self*, sitting precisely at T-zero, correctly maximizing utility *given the wildly different discount rates applied at this specific moment*. Future Theo's preferences are heavily discounted; Present Theo's agony is overwhelmingly salient. You're not betraying a judgment; you're *making* the rational choice *for this temporal location*."

  Theo shifted, a flicker of defiance in his bloodshot eyes. "But... Davidson," he rasped. "That night three weeks ago... I didn't just judge sobriety best 'all things considered' *if* I felt like it later. It was an *all-out*, unconditional judgment. 'I will not drink.' Full stop. This... this feels like overriding *that*."

  Mireille nodded sharply. "Ah, Davidson's 'all-out judgment versus all-things-considered'. Clever distinction, but it collapses under the weight of time inconsistency." She leaned in further. "Davidson assumes a stable evaluative standpoint from which an 'all-out' judgment can be issued. But hyperbolic discounting *shatters* that stability. Your 'all-out' judgment at T-minus-three-weeks *was* sincere. It *was* your best, undiluted evaluation *from that point in time*. But that evaluation *was itself conditional* on your *position on the discount curve at that time*."

  She jabbed a finger towards his chest. "You are not the same evaluator now, Theo. You are temporally displaced. The 'all-out' judgment wasn't timeless; it was *time-stamped*. When Davidson's agent violates their 'all-out' judgment, it's framed as irrational because the evaluative standpoint hasn't *logically* changed. But in your case, the standpoint *has* changed – drastically – due to the hyperbolic distortion. You're not overriding an unconditional judgment from the *same* perspective; you're making the best judgment *from a new, warped perspective created by proximity to the immediate reward*. The 'all-out' judgment loses its binding force because the discounting landscape it was formed in no longer exists."

  Theo looked down, his knuckles white. "Holton, then," he muttered, almost to himself. "Resolutions. I *resolved* not to drink. That night, I committed. I made a plan. Weakness of will is failing to stick to the resolution, *even if* in the craving moment I might still intellectually judge sobriety best. It's about failing to follow through on the commitment, not necessarily changing the judgment."

  Mireille didn't miss a beat. "Holton's resolutions are just precommitment devices – brilliant ones, psychologically – but they don't escape the discounting framework; they *battle* it." Her tone softened slightly, becoming almost pedagogical. "A resolution is a meta-strategy. It's Past Theo, at T-minus-three-weeks, recognizing his *future* hyperbolic discounting at T-zero. He knows Future Theo will undervalue sobriety. So Past Theo builds a fence – the resolution – to bind Future Theo's hands."

  She paused, letting it sink in. "When a resolution *fails*, Holton calls it weakness of will. But what *is* that failure? It's the *overwhelming steepness of the discount curve at T-zero*. The craving's immediate negative utility is so high, and the future rewards so deeply discounted, that the *cost* of violating the resolution – guilt, self-recrimination, broken trust – gets discounted into oblivion *along with everything else*. It's not that the resolution *ceases* to be a cost; it's that its discounted value at T-zero plummets below the perceived, hyper-salient value of immediate relief."

  Mireille reached out, tentatively touching his arm. "The 'failure' isn't a mysterious faculty called 'will' buckling. It's the resolution, as a precommitment cost, losing the war against the hyperbolic surge. The *judgment* Holton says remains intact? It might linger intellectually, but its *motivational force* is gutted by the discounting. It becomes a ghost, a whisper drowned out by the scream of the present need. The resolution didn't fail because your 'will' is weak; it failed because the discount rate spiked beyond the binding power of the resolution *as you currently experience its cost*."

  She withdrew her hand, her voice firming again. "There is nothing left over for 'akrasia' to explain, Theo. Once you map the discount function – its hyperbolic shape, its context sensitivity, its sheer power at T-zero – the entire phenomenon dissolves into intertemporal choice under predictable cognitive constraints. You are not weak. You are not irrational in the moment. You are a human brain caught in a predictable temporal trap. The only way out isn't summoning mythical willpower; it's changing the discount curve. Flattening it. Making the future *feel* closer, more real, *now*. That's the work. Not battling a phantom."

  ---

  **Key elements incorporated:**

  1.  **Core Argument:** Clear, forceful presentation that hyperbolic discounting explains "relapse" as rational intertemporal choice from the present perspective, eliminating the need for "akrasia."
  2.  **Davidson Objection Addressed:** Directly confronts the "all-out judgment" by arguing it is time-stamped and loses force due to the *changed temporal perspective* and its associated discount rates. The judgment isn't overridden from the same standpoint; the standpoint itself has shifted.
  3.  **Holton Objection Addressed:** Frames resolutions as precommitment devices battling discounting. Explains resolution failure as the *discounted cost of violation* being overwhelmed by the hyper-salient, steeply discounted immediate reward at T-zero, not a failure of a distinct faculty of "will" or a change in abstract judgment.
  4.  **Mireille's Voice:** Analytical, precise, passionate, slightly impatient with philosophical abstractions she sees as obsolete. Uses accessible metaphors ("temporal trap," "phantom," "scream of the present need") alongside core econ concepts ("discount function," "intertemporal choice," "utility maximization," "precommitment device"). Shows deep concern masked by intellectual rigor.
  5.  **Emotional Context:** Grounded in the immediate tension of Theo's potential relapse. Her argument is an intervention, designed to reframe his guilt and self-loathing into a solvable problem.
  6.  **Theoretical Strength:** Presents the strongest case for the sufficiency of hyperbolic discounting, directly dismantling the philosophical objections rather than ignoring them.
