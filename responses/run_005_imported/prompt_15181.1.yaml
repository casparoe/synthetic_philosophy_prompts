  ok philosophy people, help me settle something for my diss chapter on Malebranche. my advisor keeps saying Ghazali basically ran the same occasionalist play 600 years earlier and that I should stick a paragraph on him in there, but when I actually line up the two arguments they don't seem to be doing the same work at all. Malebranche gets to "only God is a true cause" via the a priori claim that a genuine cause is one where the mind perceives a necessary connection between it and its effect, and no such connection ever shows up between two finite/created things. Ghazali's fire-and-cotton argument (17th discussion of the Tahafut) reads more like a point about what observation can and can't establish -- we only ever see the two together, never a necessitating tie, so its not logically impossible for the fire to occur without the burning. can you actually compare the two arguments themselves, not just the occasionalist conclusion they happen to share, and tell me if one of them is more committing than the other? like, could a Humean just grant Ghazali's premises and stop at plain regularity, while Malebranche's setup makes that dodge harder to pull off?
