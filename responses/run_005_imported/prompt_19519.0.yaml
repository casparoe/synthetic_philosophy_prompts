prompt: |-
  I've been going down the AI alignment rabbit hole for a while now - self taught, no formal background, just reading papers and forum posts on weekends. One thing stuck in my head is this "eliciting latent knowledge" (ELK) stuff, specifically how there's two camps that never really go head to head properly. Camp one says: find an unsupervised direction in a model's activations that's logically consistent (a statement and its negation gotta have probabilities that add up to 1, thats basically the CCS idea) and you've found the model's real belief, no labels needed. Camp two says thats way too fast, since plenty of other features could satisfy that exact same consistency trick without being "truth" at all - like a "human simulator" that just reports what a human watching the sensors would conclude, versus a "direct translator" that reports what the model's own internal picture of the world actually says happened. Classic example: the vault with the diamond, where someone's spoofed the camera so everything looks fine even though the diamond's actually gone. Could you write me a dialogue between one person from each camp who really dig into each other's actual arguments (nobody's strawmanning) and try to hash out whether unsupervised consistency could, even in principle, ever tell those two apart?
