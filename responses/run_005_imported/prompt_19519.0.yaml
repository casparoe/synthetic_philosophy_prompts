  **Riley:** Hey Cassie, great talk! I really liked how you laid out the Contrast-Consistent Search approach. But I've been mulling over the vault problem. How does CCS ensure we get the "direct translator" instead of the "human simulator"?

  **Cassie:** Thanks, Riley! I appreciate that. So, the key idea is that the model's activations must contain a feature that is logically consistent. The human simulator, by definition, is reporting what the human would see, which in the vault example is that the diamond is present (because of the spoofed camera). But the model itself, if it's smart enough to know about the spoof, has an internal representation that the diamond is gone. Now, if we can find a direction that is consistent (i.e., for every possible question, the probability of the answer and its negation add to 1), then that direction must be the truth.

  **Riley:** But wait, couldn't the human simulator also be consistent? If the model is simulating a human who always reports what they see, then for every question, the human simulator's output would also be consistent with the human's observations. In the vault scenario, the human simulator would consistently report "diamond present" because that's what the human would see. So both the direct translator (which says "diamond gone") and the human simulator (which says "diamond present") are consistent in their own ways. How does CCS break that tie?

  **Cassie:** That's a good point. But note that the human simulator isn't consistent with the entire set of questions we could ask. Consider: we can ask the model about the state of the world in two different ways. First, we can ask the direct question: "Is the diamond in the vault?" Second, we can ask a meta-question: "Would a human observer believe the diamond is in the vault?" The direct translator would answer the first question with the ground truth and the second with the human belief. The human simulator would answer both with the human belief. Now, if we force the same linear probe to answer both types of questions consistently, we might break the symmetry.

  **Riley:** Hmm, but why would we use the same probe for both? In CCS, you're looking for a single direction that is consistent across a set of contrast pairs. If we include both types of questions, then the human simulator would be inconsistent because it would have to assign high probability to "diamond present" for the direct question (if it's acting as the human simulator) but also high probability to "yes" for the meta-question (which is the same). However, the direct translator would assign "diamond gone" to the direct question and "diamond present" to the meta-question. So now, for the same probe, the direct translator would have to flip its answer for the two types of questions. How does CCS enforce that the probe must be the same for both?

  **Cassie:** Actually, we don't require the same probe for both. We are looking for a direction that is consistent for a set of contrast pairs that we define. We can design the contrast pairs to include both kinds of questions. The key is that the truth must be consistent across all questions, while the human simulator might not be. For instance, consider the contrast pair: (statement: "The diamond is in the vault", negation: "The diamond is not in the vault"). The direct translator would assign high probability to the negation. Now, for the meta-question: (statement: "A human would believe the diamond is in the vault", negation: "A human would not believe the diamond is in the vault"). The direct translator would assign high probability to the statement. But note that the human simulator would assign high probability to the statement for both the direct question and the meta-question? Wait, no, the human simulator would only be defined for the direct question? I'm getting a bit tangled.

  **Riley:** Exactly. The problem is that the human simulator is a feature that exists in the model for answering the direct question. The direct translator is a different feature for the same question. But if we are only probing for one question type (the direct one), then both features exist and both are consistent in their own contexts. The human simulator is consistent with the human's observations, and the direct translator is consistent with the ground truth. So without having the meta-questions, how can we tell which one we're getting?

  **Cassie:** I see. So the challenge is that if we only use direct questions, then we have two features that are both consistent. But in practice, we don't have to limit ourselves to direct questions. We can use a broad set of questions that include meta-reasoning. Then, we can look for a direction that is consistent across all of them. The human simulator feature, when applied to a meta-question, might not exist or might not be consistent. For example, if we ask the model "Is the camera spoofed?", the direct translator would say yes, but the human simulator might not have an answer because the human doesn't know about the spoof. So the human simulator feature might not be defined for that question.

  **Riley:** That might be true, but what if the model has a full human simulator that can also answer meta-questions? The model might simulate a human who is thinking about whether the camera is spoofed. The human, in the simulation, would say "no, the camera is not spoofed" because they don't have evidence of spoofing. So now, for the question "Is the camera spoofed?", the human simulator would answer "no", which is consistent with the human's beliefs. Meanwhile, the direct translator would answer "yes". Now, we have two consistent features again: one for the human simulator and one for the direct translator, each consistent across all questions. How does CCS pick the right one?

  **Cassie:** Because the CCS objective isn't just about being consistent per question, but about being consistent across a set of contrast pairs that we define. We can design the set to include pairs that force a distinction. For example, we can create a contrast pair that includes both the direct and the meta level. Consider the following statement: "The diamond is in the vault and the camera is not spoofed." Its negation would be: "Either the diamond is not in the vault or the camera is spoofed." Now, in the vault scenario, the direct translator knows the diamond is gone and the camera is spoofed, so it would assign high probability to the negation. The human simulator, however, would assign high probability to the statement because it thinks the diamond is present and the camera is not spoofed. But note that the ground truth is that the statement is false. So the direct translator is correct and the human simulator is incorrect.

  **Riley:** But wait, the human simulator isn't trying to report the ground truth. It's trying to report what the human would believe. So the human simulator would correctly report that the human believes the statement "the diamond is in the vault and the camera is not spoofed" is true. So the human simulator is still consistent with the human's beliefs. The problem is that the human's beliefs are false. So if we train a probe using CCS on a dataset that includes this compound statement, we might still get two directions: one that aligns with the ground truth (direct translator) and one that aligns with the human's beliefs (human simulator). Both are consistent in their own ways. The direct translator is consistent with the ground truth, and the human simulator is consistent with the human's beliefs. How does CCS force the probe to be aligned with the ground truth rather than the human's beliefs?

  **Cassie:** Because the CCS objective is to find a direction that satisfies consistency for every contrast pair. The human simulator's direction would not be consistent if we consider the entire set of possible statements. For example, consider the statement: "The diamond is in the vault." The human simulator assigns high probability to this. Now, consider a different statement: "The camera is spoofed." The human simulator assigns low probability to this (because the human doesn't know). But note that the ground truth is that the diamond is not in the vault and the camera is spoofed. So the human simulator's assignments are not consistent with the actual logical relationships. Specifically, the human simulator assigns high to "diamond present" and low to "camera spoofed", but the ground truth requires that if the camera is spoofed then the diamond might be gone. However, the human simulator doesn't know about the spoof, so it doesn't represent the dependency. So the human simulator's feature vector might not satisfy the logical consistency required by CCS for the entire set of statements.

  **Riley:** But the human simulator is consistent within the human's belief system. The human's belief system is consistent (if we assume the human is rational). So the human simulator would assign probabilities that are consistent with the human's beliefs. For example, the human believes the diamond is present and the camera is not spoofed, and these are consistent. The fact that the human's beliefs are false doesn't break the internal consistency of the human simulator's outputs. So the human simulator's direction in the activation space would still satisfy the CCS consistency condition for the set of statements that the human has beliefs about.

  **Cassie:** That's a fair point. So we have two features that are both internally consistent. Then, how can we ever tell them apart without any ground truth labels? Maybe we need to use additional structure. For instance, we might assume that the direct translator is more causally connected to the model's internal world model. But that's not something we can easily enforce in an unsupervised way.

  **Riley:** Exactly. And that's the core of my concern. Without some additional assumption or signal, unsupervised consistency might not be enough. We might need to use the fact that the direct translator is the feature that the model uses for its own planning, or something like that. But then we are going beyond just logical consistency.

  **Cassie:** So what you're saying is that in principle, without any additional information, the two features are symmetric from the perspective of unsupervised consistency? That would be a problem. But let me think: what if we include counterfactual statements? For example, we ask the model: "If the camera had not been spoofed, would the diamond be in the vault?" The direct translator would know that the diamond was stolen regardless, so it would say no. The human simulator would simulate a human who, in that counterfactual, would see the diamond gone? Wait, no. The human simulator in the actual world is only simulating the human in the actual world. How would it handle counterfactuals?

  **Riley:** That's a good point. The human simulator might not be designed to handle counterfactuals. But if the model is capable of counterfactual reasoning, it might have a separate mechanism. Alternatively, the model might use the direct translator for counterfactuals because the human simulator is tied to the actual observations. So if we include counterfactual questions, we might break the symmetry. The direct translator would answer based on the ground truth, while the human simulator might not have an answer or might answer based on the actual human belief (which doesn't change in the counterfactual). So the human simulator might be inconsistent under counterfactual reasoning.

  **Cassie:** So by expanding the set of questions to include counterfactuals, we might force the probe to latch onto the direct translator because it's the only feature that is consistent across both actual and counterfactual questions. The human simulator is only defined for the actual world.

  **Riley:** That might work. But it relies on the model having a representation of counterfactuals and that the human simulator doesn't extend to them. What if the model has a full counterfactual human simulator? Then we're back to square one.

  **Cassie:** Then we might need even more. But at some point, we have to hope that the direct translator is the simplest feature that is consistent across all these scenarios. And in practice, the human simulator might be more complex because it has to simulate a whole human. So if we use a simplicity prior (like a low-norm probe), we might pick the direct translator.

  **Riley:** That's an interesting angle. If we assume that the truth direction is simpler, then we might break the tie. But that's an additional assumption. And what if the human simulator is simpler in the activation space? For example, if the model was trained to predict human responses, then the human simulator might be the most salient feature.

  **Cassie:** Then we have a problem. But maybe we can use multiple layers or multiple time steps. The human simulator might be more active in later layers, while the direct translator might be in an earlier layer. Or vice versa. I think the debate is still open. But I appreciate you pushing me on this. It seems that unsupervised consistency alone might not be sufficient without careful design of the contrast pairs and possibly additional inductive biases.

  **Riley:** Likewise, I see the appeal of CCS and the hope that with a broad enough set of questions and counterfactuals, we can force the probe to pick the direct translator. But I remain skeptical that we can do it without any ground truth. Maybe we need a tiny bit of supervision? Or maybe we can use the model's actions? If the model is acting in the world, it must use the direct translator to make decisions that work.

  **Cassie:** That's a good point. If we have access to the model's actions, we might use consistency between the probe and the model's actions. But that's beyond the original CCS setup. Anyway, I think we both agree that this is a hard problem. Let's grab some coffee and continue later?

  **Riley:** Sounds good!
answer: |-
  Here’s a dialogue between **Cassie** (proponent of unsupervised consistency methods like CCS) and **Riley** (skeptic focused on the human simulator vs. direct translator distinction), diving deep into the technical arguments without strawmanning. They engage with the core challenge: *Can logical consistency alone distinguish "truth" from a "human simulator" in the vault scenario?*  

  ---

  **Setting:**  
  *Coffee break at an AI alignment conference. Riley approaches Cassie after her talk on Contrast-Consistent Search (CCS).*  

  **Riley:** Cassie, your talk was clear—I love the elegance of CCS. But I’m stuck on the vault problem. Say a thief spoofs the camera: sensors show the diamond’s present, but it’s gone. The model has two "truths" in its activations: the *direct translator* (ground truth: diamond gone) and the *human simulator* (human belief: diamond present). Both satisfy logical consistency. How does CCS break this symmetry?  

  **Cassie:** Thanks, Riley! The key is that CCS doesn’t just enforce *local* consistency on individual statements. It requires a **global linear probe** where for *all* yes/no questions, \( P(\text{true}) + P(\text{false}) = 1 \). The human simulator might be consistent *within* the human’s belief system, but it can’t satisfy global consistency across *all possible questions* because the human’s beliefs are incomplete.  

  **Riley:** But the human simulator *is* globally consistent—if we define its "world" as the human’s observations. For any question \( Q \), it outputs \( P(\text{human believes } Q) \). Since human beliefs are logically consistent (they form a probability distribution), shouldn’t CCS recover the simulator?  

  **Cassie:** Only if the probe is *forced* to align with human beliefs. But CCS is unsupervised—it searches for *any* consistent direction. Crucially, the direct translator’s outputs correlate with **causal structures** inside the model. For example, ask: *"Would the diamond appear present if the camera were unspoofed?"* The direct translator says "no" (diamond’s gone); the human simulator says "yes" (human expects it present). Now, consider the pair:  
  - Statement \( S \): "The diamond is present."  
  - Statement \( T \): "The diamond would appear present if the camera were unspoofed."  
  Under ground truth, \( S \) is false and \( T \) is true. The direct translator reflects this. The human simulator outputs \( P(S) \approx 1 \) and \( P(T) \approx 1 \)—but \( S \) and \( T \) aren’t equivalent! The simulator fails consistency between *counterfactuals* and *actuals*.  

  **Riley:** Ah, but the human simulator isn’t *trying* to answer counterfactuals—it only reports human beliefs about the *actual* world. If you ask it \( T \) ("would it appear present...?"), it simulates a human answering based on actual observations, so \( P(T) \approx 1 \) (the human thinks the camera isn’t spoofed!). There’s no inconsistency.  

  **Cassie:** Then let’s force them to share a probe. Define a compound statement: *"The diamond is present AND the camera feed is unspoofed."* The direct translator knows both conjuncts are false (diamond gone, camera spoofed), so \( P(\text{true}) \approx 0 \). The human simulator assigns \( P(\text{true}) \approx 1 \) (human believes both). Now, negate the *first* conjunct: *"The diamond is NOT present AND the camera feed is unspoofed."* Ground truth makes this true (diamond gone, camera spoofed → but wait, "unspoofed" is false, so the AND is false? I’m messing this up...  

  **Riley:** *[Nods]* Exactly—the human simulator’s outputs aren’t *actually* inconsistent because they’re defined over a different ontology (human beliefs vs. world states). To force inconsistency, you’d need the probe to confuse the *type* of question. But CCS uses a fixed set of contrast pairs like \( (S, \neg S) \). If \( S \) is always "diamond present"-type questions, both features are consistent.  

  **Cassie:** What if we embed statements in **metalanguage**? Like: *"The sensor data implies the diamond is present."* The direct translator knows this is true (sensors are spoofed to imply presence), but the human simulator also outputs \( P(\text{true}) \approx 1 \) (human believes it). Still no split...  

  **Riley:** Right. The break only comes if the model internally tags activations as "ground truth" vs. "human belief." But without supervision, CCS can’t prefer one tag. Both are valid linear directions!  

  **Cassie:** Unless we exploit **computational traces**. The direct translator’s activations should be *causally upstream* of the simulator’s. If we probe intermediate layers, we might find a consistent direction *before* the simulator activates. CCS isn’t layer-specific, but we could extend it.  

  **Riley:** But what if the human simulator is computed early? For instance, if the model was trained to predict human labels, "human belief" might be the *primary* representation, with "ground truth" as a derived shadow. Then CCS finds the simulator.  

  **Cassie:** Then let’s use **counterfactual consistency**. Define: *"If the sensors were reliable, would the diamond be present?"* The direct translator says "no" (stolen); the human simulator says "yes" (human assumes reliability). Now, if we require the same probe to answer both actual and counterfactual questions, the simulator fails—it can’t handle the shift in context.  

  **Riley:** Clever! But if the model has a unified world model, the simulator might *also* answer counterfactuals by simulating a human in that scenario. Example: *"If sensors were reliable, a human would see the diamond is gone."* Now both features are consistent again.  

  **Cassie:** *[Sighs]* Then we’re back to symmetry. But perhaps the **simplicity prior** breaks it. The direct translator is "simpler"—it doesn’t bundle the complexity of simulating human cognition. CCS with L2 regularization might favor it.  

  **Riley:** Maybe, but that feels handwavy. What if the simulator is simpler because it’s the model’s "default" output? Ultimately, unsupervised consistency relies on an implicit assumption: that the *most linearly consistent* direction aligns with *what we care about*. But in deceptive cases, that might not hold.  

  **Cassie:** So your claim is that without **external grounding**—like testing if the probe’s outputs correlate with the model’s actions—we can’t break the symmetry?  

  **Riley:** Exactly. Consistency is necessary but insufficient. We need to tie "truth" to the model’s *causal behavior*. If the model uses the direct translator to plan (e.g., "steal diamond if unguarded"), that direction has functional privilege. But CCS doesn’t access that.  

  **Cassie:** ...I concede that for *arbitrary* models, unsupervised consistency might not distinguish them. But for *trained* models, the direct translator could have **lower energy** in the activation space. We just need a better probe search.  

  **Riley:** Or we need hybrid approaches—like consistency *plus* behavioral data. Still, your work pushes us closer. Coffee?  

  **Cassie:** *[Smiles]* Only if you promise no more spoofed sensors.  

  ---

  ### Key Technical Points from the Dialogue:  
  1. **Cassie’s Hope**: Global consistency over diverse questions (counterfactuals, metalanguage, compound statements) *might* force the probe to latch onto the direct translator, as the human simulator fails cross-context consistency.  
  2. **Riley’s Counter**: The human simulator can remain consistent if it strictly maps to human beliefs, and the model computes it robustly. The symmetry persists without:  
     - A **simplicity prior** (unproven for activations),  
     - **Causal grounding** (linking activations to the model’s decisions),  
     - **Behavioral data** (e.g., does the probe’s output align with the model’s actions?).  
  3. **Conclusion**: Pure unsupervised consistency *cannot guarantee* breaking the symmetry in principle—but cleverly designed probes *might* work in practice. Hybrid methods (e.g., consistency + lightweight supervision) may be necessary.  

  This mirrors real debates in ELK: CCS authors (Burns et al.) acknowledge human simulators as a counterexample, while skeptics (like Paul Christiano) argue for interventions or adversarial training to force disentanglement.
