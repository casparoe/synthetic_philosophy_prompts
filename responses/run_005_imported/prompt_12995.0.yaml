answer: |-
  **MEMORANDUM**  
  **TO:** Bereavement Care Clinical Policy Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Operational Recommendation for Adopting Prolonged Grief Disorder (PGD) Screening/Diagnosis with Safeguards Against Diagnostic Looping  

  ---

  ### **I. RECOMMENDATION**  
  **Adopt PGD screening and diagnostic coding at intake, with the following conditions:**  
  1. **Staged Implementation:** Pilot PGD protocols for 18 months, followed by mandatory review.  
  2. **Enhanced Staff Training:** Counselors trained to contextualize PGD as a *temporal symptom cluster*—not an identity.  
  3. **Multi-Tool Screening:** Use the **PG-13-R** (self-report) + **clinical interview** to avoid over-identification.  
  4. **Outcome Tracking:** Monitor for "looping effects" (e.g., increased symptom rigidity post-diagnosis).  
  5. **Explicit Exclusion:** Document that PGD coding *never* overrides clinical judgment about normative grief.  

  ---

  ### **II. RATIONALE: BALANCING CLINICAL URGENCY & PHILOSOPHICAL RISK**  
  **A. The Case for Adoption**  
  - **Treatment Access:** 7-10% of bereaved adults develop debilitating grief (Lundorff et al., 2017). Without DSM coding, insurers deny coverage for evidence-based therapies (e.g., Complicated Grief Therapy).  
  - **Standardization:** PGD criteria (≥12 months + 3/8 symptoms like identity disruption/meaninglessness) differentiate pathological grief from normative sadness (Killikelly et al., 2023).  
  - **Harm Reduction:** Undiagnosed PGD correlates with suicidality and cardiac events (Prigerson et al., 2021).  

  **B. Addressing the "Looping Effect" Concern**  
  While PGD is not an "indifferent kind" (like a chemical element), its risks can be mitigated:  
  | **Concern**              | **Operational Safeguard**                                                                 |  
  |--------------------------|-------------------------------------------------------------------------------------------|  
  | **Self-fulfilling diagnosis** | Counselors script: *"PGD describes symptoms that sometimes persist, not who you are. Many recover with support."* |  
  | **Pathologizing norms**  | Exclude patients <12 months post-loss (adults) unless *acute risk* (e.g., suicidal intent).                          |  
  | **Symptom amplification**| Track patient-reported outcomes: If symptom rigidity increases post-diagnosis, flag for supervision. |  

  ---

  ### **III. OPERATIONAL PROTOCOLS**  
  **A. Screening & Diagnosis**  
  1. **Intake:**  
     - Administer **PG-13-R** (13-item self-report) + **Bereavement PHQ-9** (depression screen).  
     - *Positive screen*: PG-13-R score ≥30 + duration ≥12mo → Clinical interview.  
  2. **Clinical Interview Focus:**  
     - Assess functional impairment ("Can you work/care for others?").  
     - Rule out MDD/PTSD (PGD requires grief-specific symptoms).  
     - Document *why* grief is "disproportionate" (DSM-5-TR criterion C).  

  **B. Counselor Training Modules**  
  - **Framing Diagnosis:**  
    > "Your grief has become *stuck* in a way we see in some people. Naming it helps us choose the right tools to help you heal."  
  - **Avoiding Scripts:**  
    > Do NOT ask: "Do you feel identity disruption?"  
    > Ask INSTEAD: "Who are you now without [person]? How does that feel?"  

  **C. Monitoring Looping Effects (QA Process)**  
  - Track:  
    - Symptom changes 3/6/12 months post-diagnosis (using PG-13-R).  
    - Therapist notes referencing "PGD identity" (audit 10% charts quarterly).  
  - Compare: Outcomes of PGD-diagnosed vs. non-diagnosed high-risk patients.  

  ---

  ### **IV. CONTINGENCIES & REVIEW**  
  - **Automatic Sunset Clause:** Full committee review at 18 months. Continue *only if*:  
    - No increase in chronicity rates (vs. pre-PGD baseline).  
    - No >15% of cases show "diagnosis fixation" in notes.  
    - Treatment access increases by ≥20%.  
  - **Exit Strategy:** If looping risks manifest, revert to Z63.8 (Bereavement) coding + clinical severity modifiers.  

  ---

  ### **V. CONCLUSION**  
  PGD’s validity is empirically robust, but its application must acknowledge that *diagnoses shape lived experience*. Our phased protocol leverages PGD’s capacity to unlock life-saving care while systematically guarding against iatrogenic harm. This is not a philosophical compromise—it is clinically accountable implementation.  

  **VOTE PROPOSAL:**  
  ☑ **APPROVE** PGD adoption with Conditions I–V  
  ☐ Reject  
  ☐ Defer  

  ---  
  *Appendices:  
  A. PG-13-R Screening Tool  
  B. Staff Training Flowchart  
  C. Outcome Tracking Template*  

  ---  
  **For Committee Debate:** This plan converts abstract concerns about diagnostic looping into measurable clinical variables. If PGD functions as an "interactive kind," our QA will detect it—and our sunset clause forces corrective action. Rejecting PGD ignores evidence; adopting it uncritically ignores lived reality. This path secures treatment while respecting grief’s humanity.
