answer: |-
  Here is a dialogue staging the core argument over universals in perception between a Naiyāyika realist and a Buddhist nominalist, designed to capture the historical tension and avoid stacking the deck:

  **Characters:**  
  *   **Nārada (Naiyāyika):** Defends direct perception of universals (*sāmānya*) via determinate perception (*savikalpaka pratyakṣa*).  
  *   **Kumāra (Buddhist):** Defends the apoha theory, denying universals are perceived, claiming only unique particulars (*svalakṣaṇa*) are given in perception (*nirvikalpaka pratyakṣa*).  

  **(Setting: A shaded grove near a university, manuscripts scattered on a low table.)**

  **Nārada:** Kumāra, your master Dharmakīrti’s *apoha* theory continues to baffle me. You claim that when I see this cow, Chandrikā, I perceive *only* a unique particular (*svalakṣaṇa*), utterly distinct. Then, through some mental operation of exclusion (*apoha*), I arrive at the concept ‘cow,’ which merely means ‘*not*-non-cow’. But tell me, how does this exclusion even *begin*? When your mind excludes ‘non-cow’, what is it excluding *from*? To know what ‘non-cow’ is, you must already possess the positive notion ‘cow’! Your *apoha* is a thief in the night, secretly relying on the very universal ‘cowness’ (*gotva*) it denies exists. Without the real *sāmānya* inhering in Chandrikā, presented directly to my senses, your conceptual machinery has no raw material. It’s like trying to build a wall by saying “not where there’s no brick” – but you need bricks first! Your nominalism collapses into a disguised realism.

  **Kumāra:** Ah, Nārada, you mistake the nature of the cognitive process. Perception (*pratyakṣa*) is indeed free of conceptual construction (*nirvikalpaka*) – it grasps the unique particular (*svalakṣaṇa*) in its pure particularity, characterized only by its causal efficacy (*arthakriyā*). Chandrikā is perceived as *this* specific flow of form, colour, solidity – nothing more. Now, the arising of the conceptual cognition ‘cow’ is a *later* mental event (*manovijñāna*), triggered by that perception. *Apoha* isn't grasping a pre-existing universal; it's a *dynamic cognitive act*. Upon perceiving Chandrikā, habitual associations (*vāsanā*) based on past experiences of similar causal patterns are activated. This prompts the mind to *exclude* those things which do *not* share this specific causal signature – things that don't yield milk, don't low, don't have this bovine form. This exclusion (*anyāpoha*, *vyāvṛtti*) *is* the conceptual cognition ‘cow’. There is no positive ‘cowness’ grasped first. The mind simply *does* this excluding, based on the perceived particular's unique causal nature and ingrained habits. It’s not theft; it’s fabrication.

  **Nārada:** Fabrication? But Kumāra, what *guides* this fabrication? You speak of excluding things that "do not share this specific causal signature." But "sharing" implies resemblance! How do you recognize the *similarity* between Chandrikā and other entities you call ‘cow’ – a similarity that prompts you to exclude *different* causal patterns – without already recognizing some common feature? That resemblance *is* the universal manifesting! Your ‘habitual associations’ (*vāsanā*) must themselves be formed by prior perceptions of real commonalities. When you first saw multiple distinct particulars and linked them mentally as ‘cow’, what justified that linkage if not the direct perception (*savikalpaka*) of *gotva* inhering in each? Your *apoha* seems to work only *after* similarity is established, but similarity presupposes a real ground. You haven’t escaped the universal; you’ve merely hidden it in your ‘causal signature’ – which sounds suspiciously like a universal property!

  **Kumāra:** Resemblance (*sādṛśya*) is precisely the illusion *apoha* explains! We never perceive resemblance *as such*. We perceive unique particulars. However, due to beginningless ignorance (*avidyā*), we mistakenly project similarity onto distinct particulars that have *no* shared essence but merely *similar effects* on our cognition and interaction. Seeing Chandrikā and another bovine, I perceive unique *svalakṣaṇa-s*. But because both reliably trigger similar expectations and actions (avoiding horns, expecting milk, recognizing a grazing form), the mind, driven by practical need (*vyavahāra*), performs the exclusion: ‘This is *not* what fails to trigger these expectations/actions’. This exclusion *creates* the *appearance* of a common class. The ‘similarity’ is a *result* of the exclusion, not its cause. The causal patterns are unique particulars interacting with our senses in unique ways; the *similarity* of effect is a mental superimposition (*āropa*) enabled by exclusion. Your ‘real common feature’ is the phantom conjured by the exclusion process itself.

  **Nārada:** So, the universal is an *appearance generated* by exclusion? But then, Kumāra, your entire edifice of valid cognition (*pramāṇa*) wobbles. If perception gives only unique, ineffable *svalakṣaṇa-s*, and conception (*vikalpa*) via *apoha* generates the useful fictions we call universals, how does language (*śabda*) connect to reality? When I say "Bring the cow," how does the listener understand which unique particular to act upon? If *apoha* generates ‘cow’ as merely ‘not-non-cow’, and ‘non-cow’ is infinitely vast, how does the listener narrow it down to *this* specific exclusion class without some positive content anchoring the exclusion? Doesn't successful communication require that both speaker and listener are ultimately excluding *based on* the same real feature presented in perception? Your *apoha* seems either arbitrary or, again, parasitic. Without a perceived universal anchoring the exclusion in the object itself, communication becomes inexplicable coincidence.

  **Kumāra:** Communication (*vyavahāra*) works precisely *because* of shared habits (*vāsanā*) and similar causal histories, not shared universals. Both speaker and listener have, through countless interactions, built similar networks of exclusions linked to similar perceptual triggers. When I say "cow," it activates in your mind the *apoha* process linked to *your* experiences of particulars that triggered similar expectations/actions. The word prompts the *exclusionary cognition* in you, which then guides you to act towards particulars that *don't* trigger the exclusions associated with ‘non-cow’. It’s the shared *functional response* rooted in similar perceptual histories and cognitive habits that enables communication, not the apprehension of some identical, abstract entity ‘cowness’. The anchor is the *causal efficacy* (*arthakriyā*) of the particular *as perceived*, triggering similar conceptual exclusions in different minds due to similar conditioning. Universals aren't anchors; they are the *wakes* left by the boat of *apoha* moving through cognition. Your determinate perception (*savikalpaka*) mistakes the wake for the boat itself!

  **Nārada:** The wake... perhaps. But Kumāra, that wake seems remarkably stable and navigable! When I perceive Chandrikā, I *see* her as a cow *immediately*. I don't first see an indescribable particular and *then* perform an exclusion. The ‘cowness’ is *present* in the perceptual field itself, qualifying the particular (*viśeṣya*). Your insistence on separating pure perception from conception feels like slicing apart a seamless cloth. If the universal isn't *there*, inherent in the object and revealed to the senses, why does the exclusion habitually latch onto *this* feature and not another? Why do all cows prompt the *same* exclusion? Your appeal to similar causal histories simply pushes the question back: *why* are the histories similar? It points to a real commonality in the objects themselves. *Apoha* is ingenious, Kumāra, but it feels like explaining the solidity of the earth by an infinite series of turtles. Sometimes, the simplest explanation is that the earth is just... solid. The universal is just *there*, perceived.

  **Kumāra:** And your ‘simple’ perception, Nārada, projects an unreal unity onto a flux of unique particulars! The stability is the stability of ingrained error (*viparyāsa*), necessary for survival but ultimately obscuring the true nature of reality as momentary (*kṣaṇika*) particulars. *Apoha* explains the *appearance* of stability without reifying it. Why the same exclusion? Because the world exhibits recurrent patterns of unique causes producing unique, but *functionally similar*, effects on cognizers with similar sensory apparatus and needs. The ‘commonality’ is an interpretive act, not a discovery. The turtle is the habit (*vāsanā*), built on the void (*śūnyatā*) of inherent characteristics. Your realism mistakes the map for the territory. We perceive the territory of unique particulars; the map of universals is drawn by exclusion. The dialogue continues... but the bell rings for the next disputation.

  **(The dialogue ends with neither conceding, highlighting the fundamental impasse: Does perception present an already qualified object with inherent universals, or is qualification always a conceptual act imposing unity on unique particulars via exclusion? The tension between direct realism and conceptual nominalism remains unresolved.)**

  **Key Features Reflecting Your Request:**

  1.  **Argument, Not Summary:** The dialogue stages the *reasoning* behind each position, showing *how* they clash on the mechanism of perception and conception.
  2.  **Naiyāyika Opening:** Nārada leads with the classic "parasitism" charge against *apoha*.
  3.  **Buddhist Strength:** Kumāra doesn't fold; he counters by emphasizing *apoha* as a dynamic cognitive *act* rooted in causal efficacy (*arthakriyā*) and habit (*vāsanā*), explaining resemblance as a *result*.
  4.  **Escalation & Nuance:** The exchange escalates:
      *   Nārada targets the "similarity" presupposed in *apoha*'s exclusions.
      *   Kumāra explains similarity as an illusion *produced* by exclusion.
      *   Nārada challenges communication (*vyavahāra*).
      *   Kumāra grounds communication in shared habits/functional responses.
      *   Nārada presses the immediacy and stability of perceptual recognition.
      *   Kumāra attributes stability to error and functional need.
  5.  **Evenly Matched:** Both sides land strong points. Nārada highlights the intuitive immediacy of seeing universals and the potential circularity/instability of *apoha*. Kumāra effectively defends *apoha* as a process generating useful fictions without ontological commitment, explaining the *appearance* of universals.
  6.  **Unresolved Tension:** The dialogue ends mid-debate ("The dialogue continues..."), acknowledging the historical impasse. Neither concedes; the core metaphysical disagreement persists.
  7.  **Sanskrit Categories Anchored:** The debate revolves entirely around *savikalpaka/nirvikalpaka pratyakṣa*, *svalakṣaṇa*, *sāmānya*, *apoha*, *vikalpa*, *vāsanā*, *arthakriyā*, *vyavahāra*. The Western reference ("turtles") is a passing analogy by the Naiyāyika, not a shift in framework.
  8.  **Substance over Script:** While touching on generic realism vs nominalism, the *specific* mechanisms of Nyāya perception and Buddhist *apoha* drive the debate.

  This dialogue should provide the concrete argumentative engagement your committee seeks, demonstrating the depth and persistence of this central dispute within classical Indian epistemology.
