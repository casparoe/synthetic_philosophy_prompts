answer: |-
  You're describing a textbook case of **sunk cost fallacy** combined with **competitive escalation**—a psychological trap that's incredibly common in games with leaderboards and microtransactions. Here's why it feels rational but isn't:

  ### The Psychological Traps at Play:
  1. **Sunk Cost Fallacy**:  
     You're prioritizing past investments (money spent) over future outcomes. The thought "If I quit now, that money was wasted" mistakes past spending for a *reason* to keep spending. In reality:  
     - **Past money is already gone**. Winning won't refund it.  
     - **Future spending won't "validate" past losses**—it only creates new losses.  

  2. **Competitive Escalation (Bidding War)**:  
     This is a "pain auction" where both players keep bidding to avoid feeling defeated. Each time one of you retakes the lead:  
     - The other sees it as a personal challenge ("I can't let them win!").  
     - The skin’s value becomes irrelevant—it’s now about pride, rivalry, and "winning" the conflict.  

  3. **Endowment Effect**:  
     You mentally "own" the top spot each time you lead, making it feel more valuable. Losing it triggers loss aversion (fearing loss more than gaining rewards).  

  4. **Designer Exploitation**:  
     The game is engineered to exploit this:  
     - **Scarcity**: Exclusive skins create FOMO (fear of missing out).  
     - **Visibility**: Real-time leaderboards turn spending into a public duel.  
     - **Sunken Cost Sinks**: Events reset, forcing repeated spending.  

  ### Why It’s Irrational (But Feels Real):
  - **The Skin Has $0 Functional Value**: It doesn’t affect gameplay. Its only value is exclusivity—which the game *manufactures* to trigger spending wars.  
  - **You’re Paying to "Win" a Fight, Not the Prize**: At this point, you’re spending to avoid the *feeling* of defeat, not to gain the skin.  
  - **The Winner Actually Loses**: Whoever "wins" likely paid far more than the skin is worth to anyone else. The real winner is the game developer.  

  ### How to Break the Cycle:
  1. **Acknowledge the Sunk Costs**:  
     > *"The money I’ve spent is gone whether I win or lose. Spending more won’t redeem it."*  

  2. **Reframe "Quitting" as Winning**:  
     - Walking away stops further losses.  
     - You deprive the rival of the competition they’re addicted to.  
     - **Real victory is opting out of a rigged system.**  

  3. **Calculate the True Cost**:  
     Add up *all* you’ve spent on these events. Now ask: *"Would I pay this amount upfront for this skin?"* If not, you have your answer.  

  4. **Set a Pre-Commitment for Future Events**:  
     - Decide *in advance* a strict budget ($0, $10, $20) for any event.  
     - Once it’s gone, uninstall the game for the event’s duration.  

  ### The Bottom Line:
  **Yes, you’re being irrational—but understandably so.** Game designers spend millions to engineer these exact psychological traps. Your partner is right to be concerned; this is gambling-adjacent behavior where the house always wins.  
    
  The good news? Recognizing the trap is the first step. **Stopping now isn’t surrender—it’s reclaiming control.** The skin is pixels; the money and stress are real. Save both.
