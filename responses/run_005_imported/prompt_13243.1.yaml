  Hmm, this is a classic case of the sunk cost fallacy mixed with competitive escalation. The skin has no gameplay value, yet they've poured money into it - that's the first red flag. The psychological trap here is brutal: every dollar spent creates more pressure to spend another dollar, or else the previous spending feels meaningless. 

  I should break down why this feels so compelling even though it's irrational. The sunk cost fallacy makes them see past spending as an "investment" rather than gone money. The rival creates an auction-like dynamic where winning becomes about ego, not the prize. And the event structure - limited time, visible leaderboard - turns it into a pain auction where both players keep bidding until one cracks.

  What's especially clever about mobile games is how they engineer these lose-lose situations. The skin's exclusivity is manufactured scarcity, and the leaderboard turns players into unwitting collaborators in spending more. The user's "if I quit now" thought is textbook escalation commitment - they're not even buying the skin anymore, they're buying justification for past purchases.

  The partner's concern is valid. This isn't about gaming anymore; it's about behavioral psychology exploitation. I should emphasize that walking away isn't losing - it's stopping the bleeding. The money's already gone whether they win or not. 

