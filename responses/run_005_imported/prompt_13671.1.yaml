answer: |-
  **MEMORANDUM**  
  **TO:** Model Risk and Fair Lending Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** October 26, 2023  
  **SUBJECT:** Resolution on Personal Loan Underwriting Model - Policy Recommendation  

  ### **I. Issue Summary**  
  The audit of our new ML underwriting model confirms it is equally well-calibrated for long-tenured and thin-file members (e.g., 20% predicted default probability = 20% actual default rate in both groups). However, due to higher base default rates among thin-file applicants, the model exhibits:  
  - **2.5× higher false denial rate (FDR)** for non-defaulting thin-file applicants vs. long-tenured applicants.  
  - **Higher false approval rate (FAR)** for defaulting long-tenured applicants vs. thin-file applicants.  

  This violates **equalized odds** (equal error rates across groups), creating regulatory risk under ECOA/Regulation B, which prohibits policies with unjustified disparate impact on protected classes (e.g., national origin/age, if thin-file status correlates with these). The Chief Risk Officer (CRO) advocates maintaining the status quo to preserve calibration and avoid group-based thresholds. The Compliance Officer (CO) proposes group-specific thresholds to equalize FDR.  

  **Recommendation:** **Adopt the CO’s proposal with modifications** to implement group-specific approval thresholds that equalize FDR while minimizing calibration loss. This balances fairness, compliance, and risk.  

  ---

  ### **II. Recommended Policy**  
  **A. Core Adjustment:**  
  Implement distinct approval thresholds for thin-file and long-tenured applicants to **equalize false denial rates (FDR)** for non-defaulters:  
  - **Long-tenured members:** Retain current threshold (e.g., approve if predicted default probability ≤ 20%).  
  - **Thin-file members:** Calculate a **new threshold** (e.g., predicted default probability ≤ 28%) such that:  
    $$\text{FDR}_{\text{thin-file}} = \text{FDR}_{\text{long-tenured}}$$  
    *Example:* If current FDR for long-tenured non-defaulters is 10%, set the thin-file threshold to achieve 10% FDR for their non-defaulters.  

  **B. Justification:**  
  1. **Fairness:** Equal FDR ensures creditworthy applicants—regardless of tenure—have comparable access to loans. Thin-file applicants (often immigrants, young adults, or new residents) face structural barriers; equalizing FDR mitigates exclusion.  
  2. **Compliance:** Disparate impact in lending is indefensible without business necessity (*Texas Dept. of Housing v. Inclusive Communities*). Calibration alone does not justify 2.5× FDR disparity. Equalized odds is a legally defensible fairness criterion.  
  3. **Risk Management:**  
     - *Safety:* The model remains risk-based. Thresholds are adjusted only for non-defaulters (minimizing risk from false approvals).  
     - *Calibration Tradeoff:* We accept *mild* calibration loss for thin-file approvals (e.g., a 25% predicted default rate may yield 28% actual defaults) to achieve fairness. This is monitored (see §III).  

  **C. Addressing CRO’s Core Objection:**  
  The CRO rightly argues that identical risk scores should yield identical decisions. However:  
  - **Risk scores are not context-neutral.** Thin-file applicants’ higher base default rate stems from systemic factors (e.g., lack of credit history), not higher innate risk. Equalizing FDR corrects for this bias.  
  - **Group-aware thresholds are legally permissible** under ECOA’s "business necessity" defense if they rectify disparate impact (*Consumer Fin. Prot. Bureau v. Townstone Mortgage*). Documentation of the audit (showing 2.5× FDR disparity) satisfies this requirement.  

  ---

  ### **III. Implementation & Monitoring (Next 6 Weeks)**  
  **A. Steps:**  
  1. **Recalibrate Thresholds (Week 1):**  
     - Use audit data to set the thin-file threshold achieving FDR parity.  
     - *Formula:* Optimize threshold to minimize |FDR_thin-file – FDR_long-tenured| while capping FAR increase at 5%.  
  2. **System Update (Week 2):**  
     - Deploy thresholds in the underwriting system. For transparency, add a footnote to thin-file decisions: "Approval threshold adjusted to reflect fair opportunity for credit access."  
  3. **Member Communication (Week 3):**  
     - Update adverse action notices: For denied thin-file applicants, state, "Your application did not meet the risk threshold for applicants with limited credit history."  
  4. **Pre-Exam Monitoring (Weeks 4–6):**  
     - Track daily:  
       - FDR/FAR for both groups.  
       - Actual vs. predicted default rates (to detect calibration drift).  
     - If FDR parity is not achieved or calibration degrades >3 percentage points, trigger committee review.  

  **B. Fallback:** If monitoring shows unacceptable risk (e.g., thin-file defaults spike), temporarily revert to the calibrated model while developing a reweighted training dataset for long-term use.  

  ---

  ### **IV. Why Not Other Options?**  
  - **CRO’s Status Quo:** Preserves calibration but retains 2.5× FDR disparity. This invites regulatory penalties and litigation. Calibration is not a "safe harbor" under ECOA.  
  - **Equal Approval Rates (Tabled):** Violates safety-and-soundness by ignoring risk. A 20% default-probability thin-file applicant is riskier than a 20% long-tenured applicant; equal approvals would force irrational risk-taking.  
  - **Pure Equalized Odds (CO’s Original):** We modified it to cap FAR increases, addressing the CRO’s risk concerns.  

  ---

  ### **V. Conclusion**  
  We must act to prevent regulatory failure in the upcoming exam while advancing fair lending. **I move to approve the CO’s proposal with the above modifications.** This policy equalizes opportunity for creditworthy thin-file applicants, complies with ECOA, and preserves risk-based decisioning. Implementation begins immediately.  

  **Attachments:**  
  - Threshold Calculation Spreadsheet  
  - Draft Adverse Action Notice Language  
  - Monitoring Protocol  

  [Your Name]  
  *Approved by Fair Lending Officer (Draft)*
