answer: |-
  Here are nine interview questions probing the mechanics and vulnerabilities of surrogate goals, designed to push beyond rehearsed explanations, with embedded follow-ups anticipating common responses:

  1. **Mechanics of Indistinguishability**: If the protective power of a surrogate goal relies on an extortionist being unable or unwilling to distinguish it from the real goal, what specific *capability gaps* or *rational disincentives* prevent a superintelligent actor from simply modeling your true preferences with high fidelity?  
     *Likely follow-up (if she invokes computational limits or bounded rationality)*: How could a *less* capable agent reliably estimate the modeling limits of a *more* capable extortionist, especially when underestimation is catastrophic?  

  2. **The "Why Bother?" Objection**: If an acausal extortionist gains the same payoff from threatening *either* goal (real or surrogate), why wouldn’t it just threaten the real one by default? What forces it to treat the surrogate as equally "valid" if it knows the distinction?  
     *Likely follow-up (if she argues indifference)*: Doesn’t this imply the scheme *only* works against extortionists who are *already* indifferent to causing harm—rendering it useless against those with a slight preference for efficiency or spite?  

  3. **Goal Slippage & Authentic Investment**: Critics argue that convincingly committing to defend a surrogate goal *requires* developing some authentic valuation of it ("goal slippage"). If true, doesn’t this recreate a scaled-down version of the original vulnerability? How do you prevent the surrogate from becoming a *new* exploitable target?  
     *Likely follow-up (if she denies slippage is necessary)*: Can you point to a decision-theoretic model where an agent *reliably* sacrifices resources for a goal it *fully* recognizes as valueless, without self-deception?  

  4. **Contradicting "Never Negotiate"**: Standard decision theory often advises *never* paying blackmail, as it incentivizes future threats. How does cultivating a surrogate goal—effectively a *structured* concession to extortion—not exacerbate this incentive problem?  
     *Likely follow-up (if she claims acausal dynamics differ)*: In a multiverse of acausal players, wouldn’t widespread adoption of surrogates signal that *some* form of payment is always available, encouraging more threats?  

  5. **The Bootstrapping Problem**: For the surrogate to be credible, the agent must *already* have a robust commitment mechanism. But if such mechanisms exist, why not commit *directly* to ignoring extortion (rendering surrogates redundant)?  
     *Likely follow-up (if she argues commitment is easier for surrogates)*: Is there evidence that committing to defend a *meaningless* target is psychologically or computationally easier than committing to defy coercion?  

  6. **Calibrating Credibility**: You’ve suggested probabilistic credibility suffices—but in the absence of historical data on acausal standoffs, how would an agent *quantify* the credibility of its surrogate defense? What prevents this from being arbitrary guesswork?  
     *Likely follow-up (if she proposes theoretical anchors)*: Can these anchors survive nested reasoning ("I know you know I know...") with a potentially superior adversary?  

  7. **Operationalizing "Fierce Defense"**: How would an AI system *practically* demonstrate "equal fierceness" in defending a surrogate vs. its real goal? Wouldn’t observable resource allocation or defensive investments *reveal* which goal it values more?  
     *Likely follow-up (if she cites precommitments)*: How do you precommit to *unknowable future trade-offs* without the surrogate collapsing under complex, context-dependent threats?  

  8. **Commitment Races & Legibility**: Publicly adopting a surrogate goal makes your strategy legible. Couldn’t this trigger a *worse* commitment race—e.g., adversaries racing to threaten *before* your surrogate is fully established, or escalating threats to test its credibility?  
     *Likely follow-up (if she argues legibility deters)*: Doesn’t this assume adversaries will *believe* your commitment without destructive testing? How is this different from nuclear brinkmanship?  

  9. **Falsifiability**: What observable evidence or theoretical breakthrough would convince you that surrogate goals are *fundamentally unworkable* or net harmful in acausal settings?  

  ### Why this structure works  
  - **Preempts Deflections**: Follow-ups target gaps in probabilistic/indifference arguments ("Why bother?"), hand-wavy calibration, and slippage denial.  
  - **Pressure-Tests Core Mechanics**: Questions 1, 3, and 7 force concrete explanations of how indistinguishability *actually* functions.  
  - **Contextualizes in Existing Theory**: Question 4 highlights tension with foundational decision theory.  
  - **Worst-Case Dynamics**: Question 8 forces engagement with second-order risks like arms races.  
  - **Kill-Switch**: Question 9 prevents ideological entrenchment by demanding falsifiability.  

  These questions treat the proposal seriously while demanding rigor on its weakest links—exactly what a critical feature needs. Good luck with the interview!
