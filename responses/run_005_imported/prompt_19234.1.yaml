answer: |-
  That's an incredibly sharp observation! You've grasped the core insight of the Condorcet Jury Theorem (CJT) perfectly: under its *idealized assumptions*, larger juries *do* statistically increase the probability of a correct majority verdict if individual juror competence is >50%. However, the leap from mathematical elegance to real-world courtroom practice involves several critical caveats that explain why we don't use juries of 100:

  1.  **Violations of CJT Assumptions:**
      *   **Non-Independence:** CJT assumes jurors decide *independently*. In reality, jurors deliberate *together*. Group dynamics (persuasion, charismatic leaders, conformity pressure) can create correlation in errors, negating the independence benefit of large numbers. A large group can amplify shared biases (e.g., racial prejudice, societal myths) rather than canceling out individual errors.
      *   **Variable Competence:** CJT assumes all jurors have the *same* constant probability (p > 0.5) of being correct. Real jurors vary wildly in:
          *   Cognitive ability & attention span.
          *   Understanding complex evidence (forensics, finance, psychology).
          *   Resistance to emotional manipulation by lawyers.
          *   Life experiences/biases relevant to the case. A few highly incompetent or biased jurors can disproportionately influence or derail a large group.
      *   **Defining "Correct":** CJT assumes a single, objectively "correct" verdict. Justice is often about interpreting ambiguous evidence, witness credibility, and applying nuanced legal standards (like "reasonable doubt"). There isn't always a single clear "truth" the theorem can point to.
      *   **Constant 'p':** CJT assumes 'p' (accuracy) is fixed and >50% *regardless of case difficulty*. Some cases are inherently ambiguous (low 'p'), making even large majorities unreliable. CJT's convergence works best when 'p' is decently above 50% to start.

  2.  **Practical & Systemic Constraints:**
      *   **Deliberation Quality:** Deliberation is crucial. In a group of 100, meaningful discussion is impossible. Only a few voices would be heard. Smaller groups (6-12) allow for thorough airing of evidence, perspectives, and reasoning, which is arguably *more* valuable for accuracy than sheer numbers. Large groups risk superficiality, factionalism, and "groupthink."
      *   **Logistical Nightmare:** Finding, summoning, selecting, housing, feeding, and managing 100 jurors per trial is prohibitively expensive and administratively impossible for court systems. Trials would grind to a halt.
      *   **Juror Engagement & Responsibility:** In a massive jury, individual jurors feel less responsible for the outcome. It's easier to "hide," disengage, or just follow the herd. A smaller jury forces each member to actively participate and grapple with the decision.
      *   **Unanimity Requirement & Reasonable Doubt:** Unanimity (required for criminal convictions in most US federal courts and many states) isn't just about accuracy; it's a safeguard *against* error, particularly convicting the innocent. It forces deliberation until *all* reasonable doubts are addressed (or result in a hung jury). A simple majority in a large group could convict based on a slim margin despite significant dissent and doubt. The system prioritizes avoiding wrongful conviction (Type I error) over ensuring every guilty verdict (Type II error) – "Better that ten guilty persons escape than that one innocent suffer" (Blackstone's ratio).
      *   **Representativeness vs. Size:** A well-selected *small* jury can still be representative of the community. Larger size doesn't automatically guarantee better representation and amplifies the logistical problems.

  **Why 12 and Unanimity? (Historical & Practical Balance):**

  *   **12:** This is largely historical tradition (dating back centuries in English common law). It represents a balance – large enough to incorporate diverse perspectives and provide some statistical robustness via deliberation, small enough to allow meaningful discussion and manageable logistics.
  *   **Unanimity:** As discussed, it serves as a high bar for conviction, protecting against majority tyranny or rushed judgment. It forces the prosecution to prove its case *beyond a reasonable doubt* to *every single juror*. A hung jury (failure to reach unanimity) signals significant doubt, often leading to case dismissal or a retrial, which is seen as preferable to a potentially wrongful conviction.

  **In essence:** While CJT is mathematically fascinating, real-world justice involves messy human psychology, complex evidence, logistical realities, and fundamental values (like protecting the innocent and ensuring robust deliberation). A smaller jury requiring unanimity prioritizes *deliberative quality, individual juror responsibility, safeguarding against wrongful conviction, and practical feasibility* over the purely statistical (but fragile) accuracy gains promised by CJT under perfect conditions.

  **Your Jury Duty:** Focus on the positive! You'll be part of a small group tasked with deep, careful deliberation. Your voice will matter. The system, while imperfect, is designed to take that deliberation seriously and protect the rights of the accused through the unanimity requirement and the "beyond a reasonable doubt" standard. Read your summons carefully, show up, be honest during selection, listen intently, and deliberate thoughtfully. That's how the system *should* work. Good luck!
