prompt: |-
  So in my seminar on the ethics of borders and migration we just finished Michael Dummett's "On Immigration and Refugees," which threw me a bit — he's the guy from my logic class who does anti-realism and intuitionism, not someone who spent the 60s and 70s campaigning against Britain's racist immigration laws and then wrote a whole book on asylum policy decades later. The thing that stuck with me is that his argument isn't really about headline numbers, its about mechanism: his central complaint is that rich states stay technically signed up to the 1951 Refugee Convention while using visa regimes, carrier sanctions, and "safe third country" returns to make sure genuine refugees can basically never set foot on their soil to claim asylum in the first place, so the commitment becomes hollow in practice even though no actual law gets broken. He died in December 2011, so he never saw the 2015 spike in Syrian refugees arriving in Europe, Brexit ending free movement with the EU, or the UK government's plan to fly asylum seekers to Rwanda for offshore processing instead of hearing their claims at all.

  Given how he actually argued, rather than just his general politics, what do you think Dummett would've said about those three things? I'm especially stuck on the Rwanda scheme, since that one seems like a different move from the "prevent arrival" tactics he was so angry about — people did arrive, and the scheme kicks in after that point, not before. Does his framework obviously stretch to cover that kind of case, or does it need patching to apply? My TA said this is all "underdetermined by the text" and that I should just go with my gut, which feels like a cop-out for an actual paper, so I'd rather have an actual argument for whatever answer you land on.
