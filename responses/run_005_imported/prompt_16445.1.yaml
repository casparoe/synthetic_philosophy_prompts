answer: |-
  You're wrestling with the core tension in collective intentionality theory: **can a group genuinely intend something *together*, or is it just a bunch of individuals intending things *side-by-side*?** The difference between Bratman, Searle, and Gilbert isn't academic hair-splitting; it fundamentally changes the **nature of the obligation** your bailing character breaks and the **source of the others' claim** against her. Here's how it plays out in your heist scene:

  **The Core Differences & Their Concrete Impact:**

  1.  **Michael Bratman: The Careful Coordinator (Reductionist Individualism)**
      *   **Substance:** Shared intention is *nothing over and above* the sum of individual intentions, interlocking sub-plans, and *common knowledge* of all this. There is no "we" entity. It's "I intend that we J (do the heist), I intend that we J *by* my doing my part and your doing yours, and I believe you have similar intentions and beliefs about me, and we both know all this." Crucially, the "we" in "I intend that we J" is analyzable down to individual actions and beliefs.
      *   **Obligation Source:** Obligations arise *indirectly* from:
          *   **Mutual Commitments:** Each member has committed *to the others* (via their individual intentions and common knowledge) to play their part.
          *   **Reliance:** The others have reasonably relied on her participation, shaping their own plans and actions (buying gear, taking risks, being on-site).
          *   **Promise-Like:** It *feels* like breaking a promise because each person has, through their declared (or implicitly understood) intentions and the common knowledge, *promised the others* they will do their part. The obligation is *interpersonal* (to each other member individually) not *to the group* as such.
      *   **In Your Scene (Bailer: "Ava"):**
          *   The other four feel Ava broke *promises she made to each of them individually*. "You told *me* you'd handle the locks!" "We *all* knew you were on cameras!" "I risked my neck getting here based on you being here!"
          *   Their claim is primarily about **betrayal of trust and reliance**. They coordinated *around her*. Her bailout wrecks *their* carefully meshed individual plans.
          *   Metaphysically: There is no "group mind" she betrayed, only four individuals she let down. The "we" was just a convenient label for their coordinated individual efforts.

  2.  **John Searle: The Primitive "We" (Non-Reductionist Individualism)**
      *   **Substance:** While there's no group mind, individuals *can* have a primitive, irreducible mental state of "We intend to J." This *cannot* be fully broken down into an "I intend" plus beliefs about others. It's a distinct psychological mode. "I intend" is self-referential; "We intend" refers to the collective. My "We intend" *presupposes* that I believe others also have a "We intend" (or similar cooperative attitude), but the state itself is fundamental.
      *   **Obligation Source:** Obligation stems from the *internal commitment inherent in the "We intend" state itself*. By sincerely holding the "We intend" state, an individual commits *to the shared goal and action as a participant in that "we."* It's a commitment *to the joint endeavor*. This generates obligations *to the other members* as co-participants in this shared intentional state.
      *   **In Your Scene:**
          *   The others feel Ava betrayed *the shared endeavor itself*. "We were *doing this together*!" "You were part of *us*!" "You walked out on *the job*!" The focus is less on specific promises to individuals and more on abandoning the collective project they were *jointly* building in their minds.
          *   Their claim is about **abandoning the shared reality they co-created** through their "We intend" states. Her bailout isn't just breaking a promise; it's *denying the existence* of the "we" they thought they were part of.
          *   Metaphysically: Ava isn't just quitting a job; she's rejecting her *role as a participant in the collective "we"* that existed psychologically in each of their minds. The obligation was to uphold *her part in that shared mental construct*.

  3.  **Margaret Gilbert: The Plural Subject (Non-Individualist)**
      *   **Substance:** When people *jointly commit* (through explicit agreement or sufficiently clear mutual expressions of readiness), they form a **plural subject**. This *is* a new, irreducible social entity. The commitment is *to the group as such*, creating mutual obligations *between the members* that are generated by and owed *to the plural subject*. The obligation isn't just a sum of personal promises; it's a *sui generis* social fact arising from the joint commitment.
      *   **Obligation Source:** Obligations are **directly constitutive** of the plural subject. By jointly committing, members *create* obligations *to each other* that are **irreducible** to individual intentions or promises. It's like forming a tiny social contract or pact. These obligations include: acting as required for the joint goal, not abandoning the commitment unilaterally, and holding each other accountable. Gilbert emphasizes these are *real normative ties*.
      *   **In Your Scene:**
          *   The others feel Ava has violated a **fundamental pact**. "We *agreed*!" "You don't get to just walk away from *us*!" "We *are* a crew now – you owe *the crew*!" The emphasis is on the *unit* they formed. Her obligation isn't primarily to individual members for reliance, but *to the collective entity itself* for its continued existence and purpose.
          *   Their claim is about **breach of membership**. She is unilaterally dissolving a bond she helped create. Gilbert's framework gives the strongest philosophical grounding for the *intense, quasi-moral outrage* often depicted in such scenes ("You're dead to us!").
          *   Metaphysically: Ava isn't just quitting; she is *seceding from a small social entity* (the plural subject "heist crew") and violating its constitutive rules. The others aren't just inconvenienced individuals; they are *members wronged by another member* of the collective.

  **Why it Matters for Your Novel (The Bailout):**

  *   **Bratman:** Ava broke promises to four individuals who relied on her. The fallout is about **broken trust, practical disaster, and personal betrayal.** The others' anger is directed *at Ava the individual* for failing *them*. ("You screwed *me* over!").
  *   **Searle:** Ava abandoned the *shared project* they were all psychologically invested in as a "we." The fallout is about **the collapse of a shared reality and identity.** The others' anger is directed at her for rejecting *the "us"* they thought existed. ("There *is* no 'us' without you committing to it! You killed 'us'!").
  *   **Gilbert:** Ava violated the **fundamental pact** that created the crew as a unit. The fallout is about **betraying the collective entity and its norms.** The others' anger is directed at her as a *traitor to the group*. ("You swore to *the crew*! The crew demands answers/judges you!").

  **Which One Should You Use?**

  *   **For Defensibility & Drama:** Gilbert provides the **strongest metaphysical foundation** for the intense, binding obligations and sense of collective betrayal common in heist stories. It justifies why bailing isn't *just* breaking a promise, it's treachery against the *unit* they formed. This creates higher stakes and richer conflict.
  *   **For Nuance & Character:** Bratman offers more room for individual negotiation, differing levels of commitment, and practical arguments ("But my sub-plan was always flexible!"). Searle captures the powerful psychological *sense* of being a "we" without requiring a full-blown plural subject.
  *   **Hybrid Approach (Recommended for Fiction):** You don't need to pick just one rigidly. Your characters can *experience* it like Gilbert (feeling the group bond as a real entity with obligations), while the underlying mechanics might align more with Bratman (reliance, meshing plans) or Searle (the psychological "we" state). The *language* and *emotional reactions* of the characters when Ava bails will sell the metaphysics to the reader.

  **In your scene:** To maximize the tension and sense of obligation, lean into **Gilbert's framework** for the *characters' perspectives*. Have the remaining crew members invoke "the crew," "our agreement," "what we swore to do *together*," implying the existence of a collective entity she is betraying. Show their anger as being about the violation of the *group bond*, not just personal inconvenience. This gives the "we're actually doing this together" moment far more weight than just "good vibes" – it establishes a tangible, normative social fact with real consequences for defection. The metaphysics becomes a tool for heightening drama and character conflict.
