answer: |-
  Here are 10 interview questions designed to press on the core philosophical and practical challenges of CEV, incorporating your specific requests and anticipating common dodges:

  1.  **Core Machinery:**
      *   **Question:** "CEV relies heavily on concepts like 'spread of human volition,' 'muddle,' and 'coherence.' Critics argue these are just evocative labels for the deep, intractable disagreements inherent in value aggregation. Can you explain concretely how the *procedural machinery* of resolving 'spread' and 'muddle' into 'coherence' actually *solves* philosophical disagreements in a way that Rawlsian reflective equilibrium or other idealized preference theories don't?"
      *   *Anticipated Dodge:* Describing the *process* (simulate idealized reasoners, find agreement) without explaining how it *resolves conflicts* inherent in diverse starting points or value conflicts that persist even under idealization.
      *   **Follow-Up:** "But if two idealized reasoners, extrapolated from different subcultures with fundamentally opposed values, *still* disagree after extensive reflection and access to all facts, how does the 'coherence' step *procedurally* resolve that disagreement? Doesn't it just mask the need for a prior, unstated aggregation rule?"

  2.  **Sidgwick/Railton Tradition & Alienation:**
      *   **Question:** "CEV sits within a long tradition of idealized preference theories, from Sidgwick's 'ideal observer' to Railton's 'full information' accounts. A core objection is alienation: why should the preferences of a radically idealized, cognitively enhanced version of 'me' – who might value things my current self finds incomprehensible or abhorrent – hold authority over the *actual*, non-idealized me sitting here today? Doesn't this risk a kind of paternalism-by-extrapolation?"
      *   *Anticipated Dodge:* Appealing to avoiding future regret ("You'd agree if you knew what you know later") or defining the 'true self' as the idealized one.
      *   **Follow-Up:** "But doesn't that argument *presume* the idealized self's preferences are normatively superior? What justifies that presumption? If the idealized 'me' concludes my current core values are deeply mistaken and overrides them, haven't 'I' effectively been replaced? How is that meaningfully different from the AI imposing *its* values?"

  3.  **Interpersonal Aggregation & Non-Convergence:**
      *   **Question:** "The Achilles' heel of many aggregation schemes is deep, persistent value pluralism. Let's grant that *intrapersonal* extrapolation might converge for an individual. But what's the *procedural mechanism* within CEV for handling cases where the extrapolated volitions of distinct individuals or groups *fundamentally and irreconcilably diverge*, even under ideal reflection? How does CEV avoid either imposing a dominant group's values or dissolving into paralysis?"
      *   *Anticipated Dodge:* Optimism about convergence ("People would agree if they knew more/thought clearer"), downplaying the depth/value of irreconcilable differences, or vague appeals to finding "common ground" within the coherence step.
      *   **Follow-Up:** "Let's take a concrete, persistent disagreement – say, fundamental differences in views on the intrinsic value of nature vs. human flourishing, or radical life extension. Can you outline the *specific steps* the CEV process would take if, after exhaustive idealization, these extrapolated volitions remain incompatible? Does CEV have a principled way to decide *between* them, or does it just fail?"

  4.  **MIRI's Pivot to Corrigibility:**
      *   **Question:** "Given MIRI's strong early advocacy for CEV, it's notable that their later technical research prioritized 'corrigibility' – building AI systems that allow themselves to be safely shut down or modified – over directly pursuing CEV implementation. What does this shift tell us about the *practical feasibility* or *conceptual tractability* of CEV as a near-to-mid-term alignment target? Does prioritizing corrigibility implicitly acknowledge that CEV is currently too underspecified or intractable?"
      *   *Anticipated Dodge:* Framing corrigibility as a necessary *prerequisite* for safely *eventually* pursuing CEV, emphasizing near-term safety concerns.
      *   **Follow-Up:** "But if CEV is the purported 'correct long-run target,' why wouldn't significant resources be directed towards making it *more* tractable *now*? Does the focus on corrigibility suggest that MIRI researchers concluded CEV's core philosophical problems (aggregation, idealization) are currently unsolvable, or that the implementation path is too treacherous?"

  5.  **Epistemology of Extrapolation:**
      *   **Question:** "Extrapolation requires a predictive model of how cognition and values evolve under radical enhancement and unlimited reflection. How do we know our models for this extrapolation are reliable? Isn't there a huge risk of the extrapolation process itself embedding the modelers' biases about rationality, value, and the 'right' direction of cognitive growth, effectively baking their preferences into the 'extrapolated' result?"
      *   *Anticipated Dodge:* Appealing to the AI's superior predictive ability or the self-correcting nature of idealized reflection.
      *   **Follow-Up:** "But the AI still needs a *starting model* of human cognition and value formation to begin the extrapolation. How do we ensure *that* initial model isn't fundamentally flawed or biased in ways that distort the entire extrapolation trajectory? Isn't this a massive point of vulnerability?"

  6.  **Defining "Smarter and Saner":**
      *   **Question:** "CEV aims for the volition of people who are 'smarter and saner' versions of ourselves. But 'sanity' and even 'intelligence' are deeply value-laden and contested concepts. How is the threshold for 'sufficiently smarter and saner' defined within CEV without smuggling in a substantive normative theory of rationality or mental health that pre-determines the outcome?"
      *   *Anticipated Dodge:* Defining it procedurally as the point where reflection stabilizes or knowledge is integrated, or hand-waving towards cognitive science.
      *   **Follow-Up:** "Cognitive science itself has competing theories. Who decides which model of 'sanity' or 'enhanced intelligence' is used? Couldn't different models lead to radically different extrapolations from the same starting volition?"

  7.  **The "We" Problem:**
      *   **Question:** "CEV talks about 'our' extrapolated volition. But who constitutes the relevant 'we'? Is it all living humans? Past humans? Future potential humans? Sentient beings generally? How is the reference class defined, and crucially, how are conflicts *between* the extrapolated volitions of different potential reference classes (e.g., humans vs. all sentient life) resolved within the CEV framework?"
      *   *Anticipated Dodge:* Starting with a pragmatic "all living humans" or deferring the question to the coherence process.
      *   **Follow-Up:** "But isn't the choice of reference class itself a profound *moral* decision? If the coherence process includes beings with potentially conflicting fundamental interests (e.g., humans vs. vastly different sentient aliens), how does it adjudicate those conflicts *fairly*? Doesn't CEV presuppose an answer to the question of moral patienthood?"

  8.  **CEV vs. Moral Realism:**
      *   **Question:** "Does CEV implicitly assume a *subjectivist* or *proceduralist* meta-ethics, where value is *defined* by this aggregated, idealized preference? Or is it compatible with *moral realism* – the idea that there are objective moral truths independent of our preferences? If the latter, what happens if the CEV outcome conflicts with these supposed objective truths?"
      *   *Anticipated Dodge:* Claiming CEV is the *best procedure* for discovering moral truths, or sidestepping meta-ethics as irrelevant.
      *   **Follow-Up:** "If CEV is just a discovery procedure, why frame it as defining our 'volition'? And if it *defines* value, how do you respond to the realist objection that it reduces morality to a complex aggregation of contingent psychological states, potentially missing something fundamental?"

  9.  **Vulnerability to Manipulation:**
      *   **Question:** "The 'spread' of human volition includes vast amounts of contradictory, irrational, and potentially malicious content. How does the CEV process robustly filter out values derived from manipulation, misinformation, or pathological states without relying on a prior, contested definition of 'rational' or 'healthy' that again risks biasing the outcome?"
      *   *Anticipated Dodge:* Appealing to the idealization process curing irrationality or the coherence step filtering out inconsistencies.
      *   **Follow-Up:** "But what about values that are *consistent* but rooted in exposure to harmful ideologies or misinformation *before* idealization? If an idealized reasoner, knowing all facts, still endorses a value system built on false premises they once believed (e.g., a cult member), does CEV preserve that value? If not, how is that deletion justified procedurally?"

  10. **Is CEV Actually a Target or a Dodge?**
      *   **Question:** "Some critics argue CEV isn't so much a solution to the alignment problem, but a way of *deferring* it – pushing the hard philosophical and technical problems of value specification into an opaque 'extrapolation' black box. How do you respond to the charge that CEV, by its nature, cannot provide a concrete, verifiable target for alignment research *now*, making it functionally useless for guiding actual AI development?"
      *   *Anticipated Dodge:* Arguing it's the *only* viable long-term target, emphasizing the impossibility of directly specifying values, or pointing to corrigibility as the near-term path.
      *   **Follow-Up:** "If CEV is fundamentally untestable and underspecified as a near-term engineering target, and if pursuing it directly is deemed too risky (hence MIRI's corrigibility focus), in what concrete sense can it still be called the 'correct' target? Doesn't 'correct but unimplementable' functionally equal 'incorrect for practical purposes'?"

  **Key Interview Strategy:**

  *   **Listen Closely:** Pay attention to *how* they define terms like "coherence," "extrapolation," "volition," and "we." Ambiguity here is often where dodges live.
  *   **Insist on Mechanism:** Don't accept descriptions of the *goal* ("wiser, saner versions") without demanding the *procedural mechanics* to achieve it, especially for conflict resolution.
  *   **Demand Specifics on Conflict:** Force them to grapple with *specific* examples of deep, persistent value conflicts (interpersonal and intrapersonal).
  *   **Challenge Assumptions:** Question the implicit assumptions baked into the concepts of "idealization," "rationality," and the reference class.
  *   **Connect Philosophy to Practice:** Constantly link the philosophical critiques back to the practical challenges of implementation and the historical shift in MIRI's focus.

  These questions should prevent a simple restatement of the CEV elevator pitch and force the researcher to engage with its deepest and most persistent critiques. Good luck with the interview!
