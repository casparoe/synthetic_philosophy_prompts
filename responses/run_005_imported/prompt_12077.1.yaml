prompt: |-
  Okay so I went down a rabbit hole on "program equilibrium" -- the idea that in a one-shot prisoner's dilemma (not the repeated tit-for-tat version), instead of just picking cooperate or defect, you submit a program that gets to look at the other guy's program before it decides anything. Theres this classic example, FairBot, that cooperates with you only if it can prove you're gonna cooperate with it back, and somehow two FairBots playing each other actually do end up cooperating, and every source I find says this works because of Löb's theorem and then just states the theorem like that settles it. When I try to work through it myself it feels like it should just be circular -- "I'll cooperate if you will" seems like the kind of setup where both bots sit there waiting on each other forever, not something that actually resolves into an answer. Can you explain, without the full formal proof, what's actually going on there -- like why Löb's theorem makes this resolve into real cooperation instead of secretly just being a fancy way of assuming the conclusion?
