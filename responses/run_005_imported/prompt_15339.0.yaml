  ### Part 2: Ng & Russell and MaxEnt IRL

  Student's answer:
  "Ng & Russell (2000) address this by requiring the reward to make the demonstrated policy better than every alternative action by as large a margin as possible, which rules out degenerate solutions like the all-zero reward.

  Later work relaxes the assumption that the demonstrator is perfectly rational. Maximum Entropy IRL (Ziebart et al., 2008) treats the human as Boltzmann-rational: instead of always taking the single best action, the human samples trajectories with probability proportional to the exponential of their reward, so mildly suboptimal behavior isn't automatically treated as evidence for a different reward. The method works by maximizing the entropy of the recovered reward function subject to matching the feature expectations of the demonstrated trajectories, which yields a unique answer without smuggling in extra assumptions."

  Comments on Ng & Russell:
  - The student correctly describes the margin maximization idea. However, the original Ng & Russell formulation does not just require that the demonstrated policy is better by a margin, but they also consider the reward function that maximizes the difference between the value of the optimal policy and the next best policy (or all others). The student says "by as large a margin as possible", which is acceptable.

  But note: the student says "the reward to make the demonstrated policy better than every alternative action by as large a margin as possible". This is a bit imprecise because it's about the entire policy, not per action? Actually, Ng & Russell's formulation is in the context of finite state spaces and they require that the reward function must make the observed policy strictly better than any other policy by a margin, and they maximize that margin. The student's wording is a little action-based, but the idea is there.

  Comments on MaxEnt IRL:
  - The Boltzmann-rational model is correctly described: trajectories are sampled with probability proportional to exp(reward). 
  - The student says the method maximizes the entropy of the recovered reward function. This is a common misunderstanding. Actually, MaxEnt IRL maximizes the entropy of the trajectory distribution under the constraint that the expected feature counts (or feature expectations) of the trajectories match the demonstrated ones. It does not maximize the entropy of the reward function itself. The reward function is typically linear in features, and the method finds the reward weights that make the maximum entropy distribution match the feature expectations. The student says: "maximizing the entropy of the recovered reward function" which is incorrect. It's the entropy of the distribution over trajectories.

  This is a significant error. The entropy is over the policy/trajectories, not the reward function.

  Also, the student claims that MaxEnt IRL yields a unique answer without extra assumptions. While it does yield a unique solution given the constraints, note that the method does make an assumption about the form of the rationality (Boltzmann) and the linearity of the reward function. So it's not without assumptions.

  Therefore, the MaxEnt part has a major flaw.

