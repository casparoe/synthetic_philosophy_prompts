  ### Part 3: Armstrong & Mindermann

  Student's answer:
  "Armstrong & Mindermann push this further: once the demonstrator can be irrational, behavior underdetermines both the reward AND the "planner" (the rationality model mapping reward to behavior), since you can always pair a weird reward with a compensating weird planner and reproduce the exact same behavior. Their key result, though, is that a simplicity prior over these (reward, planner) pairs comes to the rescue: because pathological planners that invert or scramble the reward are more complex to specify than the "normal," mostly-rational human planner, an Occam's-razor-style prior ends up favoring the intended pair after all, which is why a lot of modern value-learning proposals build in an explicit simplicity penalty on the inferred reward."

  Comments:
  - The student correctly identifies the underdetermination: both the reward and the planner (rationality model) are underdetermined from behavior. The example of pairing a weird reward with a compensating weird planner is spot on.
  - However, the student then claims that Armstrong & Mindermann argue that a simplicity prior saves the day. But the actual argument in the paper is the opposite! Armstrong & Mindermann argue that a simplicity prior does NOT necessarily rescue the approach. They show that for any behavior, there exists a simple reward function paired with a complex planner that produces that behavior, and also a complex reward function with a simple planner. Therefore, without prior knowledge about the planner, the simplicity prior doesn't break the symmetry.

  The student has it backwards. Armstrong & Mindermann are making a "no free lunch" argument: without assuming the planner is simple, we cannot rely on simplicity of the reward to identify the correct one. The student says that the simplicity prior ends up favoring the intended pair because pathological planners are more complex. But Armstrong & Mindermann show that the pathological planner doesn't have to be complex; they can be made simple by making the reward complex. So the simplicity prior doesn't necessarily break the tie in the intended direction.

  This is a critical error.

