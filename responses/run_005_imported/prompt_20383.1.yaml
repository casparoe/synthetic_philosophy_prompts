answer: |-
  Okay, this is *exactly* the kind of niche philosophical irony I love. Here are a few options, playing on that core tension between desperate need and rigorous skepticism, aiming for the grad-student-who-read-the-conclusion chuckle:

  **Option 1 (Focus on the Ethical Motive & Futility):**

  > "Sidgwick spent decades meticulously debunking every medium and ghost story he could find. Not because he *didn't* want them to be real, but precisely because he *needed* them to be real so badly for his ethical system to cohere. It was the most rigorous existential Hail Mary pass in history. Tragically, his own standards of evidence were the goalie."

  *   **Why it works:** Hits the core tension ("needed them to be real"), references the ethical motive ("ethical system to cohere"), highlights the futility ("rigorous... Hail Mary"), and lands on the irony of his skepticism defeating his own hope ("standards of evidence were the goalie"). Uses a slightly anachronistic sports metaphor for levity.

  **Option 2 (Focus on the Post-Mortem Pact & Disappointment):**

  > "Sidgwick, Myers, and Gurney famously agreed to signal from beyond the grave. Sidgwick wasn't just hoping for proof of survival; he was practically *auditioning* for the role of cosmic administrator who'd finally reconcile duty and self-interest. One imagines him on the Other Side, finally getting the data point he needed... only to immediately demand Myers and Gurney replicate the results under controlled conditions."

  *   **Why it works:** References the specific pact, explicitly links the proof to resolving the "dualism" ("cosmic administrator... reconcile duty and self-interest"), and plays on his relentless skepticism persisting *even after* hypothetical success ("replicate under controlled conditions"). It paints a funny picture.

  **Option 3 (Short & Punchy, Focus on Motive):**

  > "Why did Sidgwick, the ultimate skeptic, spend his life hunting ghosts? Simple: His ethics required an afterlife, but his intellect required proof. He wasn't chasing spooks; he was chasing a coherent moral universe. Sadly, the universe remained stubbornly incoherent."

  *   **Why it works:** Very concise, directly states the dual motive ("ethics required... intellect required proof"), explicitly names the "dualism" consequence ("coherent moral universe"), and ends on the bleakly humorous note of failure ("stubbornly incoherent").

  **Option 4 (Playing on the Census & Statistics):**

  > "Sidgwick needed statistically significant evidence of an afterlife to solve the dualism of practical reason. So his wife Eleanor ran the Census of Hallucinations. It was the ultimate irony: the man who needed ghosts most was married to the woman statistically least likely to let one slip through the net."

  *   **Why it works:** Highlights the specific research (Census), the statistical rigor ("statistically significant," "slip through the net"), the personal connection (Eleanor), and the core tension ("needed ghosts most" vs. "least likely to let one slip"). It credits Eleanor's role too.

  **Recommendation:** I think **Option 1** or **Option 2** hit the sweet spot best for your audience. Option 1 is a bit more general and elegant in its phrasing of the core irony. Option 2 is funnier if your group knows about the pact specifically.

  **Key elements leveraged for humor:**

  1.  **The Specific Need:** Not just "ghosts are cool," but ghosts as the *necessary condition* for resolving the dualism of practical reason and providing "moral government."
  2.  **The Rigorous Skepticism:** Highlighting his debunking, standards of evidence, and statistical methods (Eleanor's Census).
  3.  **The Irony of Motive:** His desperate *hope* driving his relentless *skepticism*.
  4.  **The Futility:** The inherent tension meaning his own methods were the biggest obstacle to getting the answer he needed.
  5.  **The Stakes:** Framing it as an existential/philosophical quest, not just a hobby.

  Any of these should land with a group that knows the "open wound" of the *Methods*' conclusion and his SPR work. Good luck with the presentation! (And honestly, the psychical research rabbit hole *is* fascinating context for understanding the depth of his philosophical despair/need).
