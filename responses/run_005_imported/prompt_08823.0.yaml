prompt: |-
  I never studied philosophy or logic formally — I service industrial refrigeration systems for a living — but for the last several months I've been working through the literature on conditionals in whatever spare time I can find, mostly via the Stanford Encyclopedia of Philosophy and a few PDFs that a friend from an online philosophy reading group sent me. That friend is the one who first pointed me toward David Lewis's 1976 triviality result, and I haven't been able to leave it alone since.

  As I understand it, the starting point is what's called Adams' Thesis: your degree of belief in "if A, then B" should just equal your conditional probability of B given A. Lewis showed that if this equation is also required to survive conditionalizing on new evidence — not merely to describe your credences as they happen to be right now — something strange falls out. Conditionalize first on B, then on not-B, and track what each move forces the probability of the conditional to be; when you do, you can derive that the conditional probability of B given A has to equal the plain, unconditional probability of B. Since A and B were arbitrary, that generalizes into the claim that any two propositions whatsoever come out probabilistically independent of one another, which is absurd for anything resembling a normal set of beliefs. I can follow the algebra well enough, but I keep going back and forth on what to actually conclude from it, and I suspect I'd understand my own reaction better if I saw the dispute acted out between two people instead of summarized in an encyclopedia entry.

  So here is what I'd like: a dialogue between two people who both fully accept that Lewis's proof is correct — neither one thinks he made a mathematical error — but who walk away from it with opposite morals. One should take the route associated with Ernest Adams and Dorothy Edgington and conclude that indicative conditionals were never in the business of expressing propositions to begin with, so of course the "probability of the conditional" can't be squared with ordinary probability theory: there was no proposition there for the equation to be about. The other should hold onto a broadly Stalnaker-style, possible-worlds semantics on which conditionals do express propositions, and try to block the argument the way I gather some truth-conditional theorists have — by denying that Adams' Thesis needs to survive arbitrary conditionalizing, and insisting it only has to hold for whichever credence function an agent actually has at the time. I'd like the second person to press the first on the obvious weak spot: if a conditional isn't true or false, what is even going on when it's embedded under negation, sitting inside a conjunction, or serving as the antecedent of a further conditional? And I'd like the first person to press back just as hard on whether restricting the thesis to "only my actual credences" is a principled move or just a patch stitched on to dodge the proof — one that no longer explains why the thesis felt so secure across ordinary reasoning and updating before Lewis came along. Please have them respond to each other's specific points as the exchange unfolds, the way two people who respect each other's competence actually argue, rather than each delivering a self-contained monologue.
reasoning: |-
  We are going to write a dialogue between two characters: 
     - **Alex**, who takes the non-propositional view (following Adams and Edgington). 
     - **Blair**, who defends a propositional view (like Stalnaker) but restricts Adams' Thesis to the actual credence state.

  They both accept Lewis's triviality proof as mathematically correct but draw different conclusions.

  The dialogue should cover:
  1. The initial setup: both agree on the triviality result and what it shows if we assume Adams' Thesis holds for all conditionalizations.
  2. Alex argues that conditionals aren't propositions, so they don't have truth conditions and hence don't have probabilities in the ordinary sense. Adams' Thesis is about the assertability or acceptability of conditionals, not the probability of a proposition.
  3. Blair argues that conditionals are propositions (with truth conditions) and that Adams' Thesis holds only for the actual credence function, not after arbitrary conditionalizations. This avoids the triviality result.
  4. Alex presses: How can Blair explain the initial plausibility of Adams' Thesis and why it seems to hold in many cases? Also, if conditionals are propositions, why do they behave so differently?
  5. Blair presses: How does Alex handle embedded conditionals? If conditionals don't express propositions, what are we doing when we negate a conditional, conjoin it, or put it in the antecedent of another conditional?
  6. They respond to each other point by point.

  Let's begin.
answer: |-
  **Setting:** A quiet corner of a university library, late afternoon. Alex (non-propositional view) and Blair (restricted propositional view) sit across from each other, books on conditionals and probability theory stacked between them. Both have just reviewed Lewis’s 1976 triviality proof.

  **Blair:** (Leaning forward) So, we agree Lewis’s math is airtight. If Adams’ Thesis—that P(if A, B) = P(B|A)—holds not just for your current credences but *must survive* conditionalizing on any new evidence, then it forces probabilistic independence between *all* propositions. Absurd. But that’s the key: the proof assumes the thesis is *update-robust*. Why not just say Adams’ Thesis only describes your *actual* credence state? It’s a synchronic constraint, not diachronic. That blocks the proof cold. Conditionals express propositions—Stalnaker was right—but their probability is *defined* by conditional probability *for you, now*.  

  **Alex:** (Tapping Lewis’s paper) Blair, that move feels like cheating. Adams’ Thesis didn’t strike us as a fluke of our current mental state. It felt *necessary*: when I say, "If the pressure exceeds 300 psi, the relief valve will blow," my confidence *is* my conditional probability of blowing given excess pressure. And crucially, if I learn new evidence—say, the valve was tested yesterday—my confidence in the conditional updates smoothly *with* that evidence. If your restriction is right, why did Adams’ Thesis seem to govern *reasoning*, not just snapshot beliefs?  

  **Blair:** Because in ordinary updates, your conditional probabilities *do* co-vary with credences in the conditional—when you’re updating on evidence compatible with A. But Lewis forces pathological cases: conditionalizing on B itself, or on ¬B. Real agents don’t update in ways that *break* the connection between A and B. Your valve example: if I *first* learn the valve blew (B), then learn it didn’t (¬B), I’m in a muddle, but that’s not how we typically revise beliefs. The thesis holds when it matters.  

  **Alex:** But Lewis’s point is that *if* the thesis is about propositions, it *must* handle *all* updates—even unnatural ones—or probability theory breaks. You’re saying it’s a contingent fact about human psychology that we avoid certain updates? That guts the thesis of its normative force. Adams and Edgington rescue that norm: conditionals aren’t propositions; they’re *inferences in disguise*. "If A, B" expresses my willingness to infer B from A *given my current knowledge*. Probability here isn’t truth-probability—it’s *inferential confidence*.  

  **Blair:** (Eyes narrowing) Then explain embeddings. Take negation: "It’s not true that if the valve fails, the system crashes." If your conditional isn’t truth-apt, what am I denying? Or consider: "If the valve fails, the system crashes, *and* the alarm sounds." Conjoining two non-propositions? Worse—(scribbling) —"If (if A, B), then C." Like, "If the valve blowing would cause a crash, then we should evacuate." How do *you* assign probability to *that*? Your view makes conditionals unembeddable ghosts.  

  **Alex:** (Smiling) Adams’ Thesis *isn’t* for embeddings! That’s the whole point. We *force* conditionals into truth-conditional molds because language is recursive, but it’s a grammatical illusion. In *simple* cases, "if A, B" gets assertability from P(B|A). When we embed, we’re shifting contexts or smuggling in propositions. For negations, we often deny the inferential connection: "Not (if A, B)" means I *resist* inferring B from A. Conjunctions? We parse them as separate speech acts. As for iterated conditionals—(shrugs)—they’re rare and messy. Edgington says we handle them by paraphrasing: your example might mean, "Given that B *would* hold if A did, then C."  

  **Blair:** Paraphrasing! That’s evasion. Stalnaker’s semantics handles embeddings *compositionally*: conditionals have truth conditions (e.g., B is true in the closest A-world). Probability measures over worlds give P(if A, B) = P(B|A) *naturally*—for the *actual* credence function. Why reframe logic to avoid Lewis? The proof just shows we can’t demand that P(if A, B) *stays equal* to P(B|A) after we’ve shredded our belief state.  

  **Alex:** Because that "natural" equality *only* holds for your *current* probability measure! Lewis’s proof shows that if it held universally, we’d need a distinct probability function for *every* conditional—which collapses to triviality. Your restriction isn’t a solution; it’s surrender. You’re admitting conditionals *can’t* be robust propositions. Whereas for us, Adams’ Thesis explains why conditionals feel probabilistic: they *track* conditional probability, but they’re not *built* from it.  

  **Blair:** But your view can’t explain why Adams’ Thesis *fails* for embeddings! If I say, "It’s probable that if A, B," I *am* assigning probability to a proposition. On your account, that should be nonsense—yet we say it.  

  **Alex:** We say it *because* we conflate the conditional’s inferential role with truth. But probability operators force a propositional reading, so Adams’ Thesis *doesn’t apply* there. That’s not a bug—it’s a clue: conditionals are fundamentally *dynamic*. They guide thought; they don’t describe facts.  

  **Blair:** (Pauses) Then why did Lewis’s proof shock anyone? If conditionals aren’t propositions, the "probability of the conditional" was always a category error.  

  **Alex:** Exactly! Lewis *exposed* the error. We *thought* conditionals had truth values because language tricks us. Your Stalnakerian fix—(mimics quoting)—"Adams’ Thesis, but only for today’s credences!"—is a post-hoc patch. It saves the furniture but ignores the fire: conditionals *behave* like non-propositions because they *are*.  

  **Blair:** Yet when I assert "If A, B," I’m committing to something *objective*—like possible worlds. And your "inferences" rely on background knowledge, which *is* propositional!  

  **Alex:** Knowledge is, but *conditionals* are how we navigate it. Lewis’s triviality is a signpost: "Wrong turn." Your truth-conditional detour leads to independence absurdity. Ours? Straight through.  

  *(They fall silent, the tension unresolved. Blair traces Stalnaker’s possible-worlds diagram; Alex flips to Edgington’s assertability graphs. Both know the math is sound. The divide isn’t in the proof—it’s in what conditionals fundamentally are.)*
