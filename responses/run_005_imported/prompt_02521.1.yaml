answer: |-
  This is a profound philosophical clash within a single family, highlighting two fundamental approaches to moral responsibility. Let's break down the conflict and assess whether Galen Strawson's "Basic Argument" genuinely threatens his father's "reactive attitudes" theory:

  **1. Galen Strawson's Basic Argument (The Son):**
  *   **Core Claim:** Genuine moral responsibility (MR) – the kind required for *ultimate desert* in praise/blame – is impossible.
  *   **Key Premises:**
      1.  To be *truly* responsible for an action (A), you must be responsible for the aspects of your character/motivational state (C) that led to A.
      2.  To be responsible for C, you must be responsible for the prior character/motivational state (C1) that led to C, and so on, regressing infinitely.
      3.  This regress cannot be infinite. It must stop at some initial character/motivational state (C0).
      4.  You cannot be responsible for C0. You didn't create or choose C0; you were born with it, shaped by genetics and environment entirely beyond your control.
      5.  Therefore, since you aren't ultimately responsible for the source (C0) of who you are, you cannot be ultimately responsible for any subsequent action (A) flowing from it.
  *   **Conclusion:** MR requires being *causa sui* (self-caused), which is logically/metaphysically impossible. True desert is an illusion. Determinism vs. indeterminism is irrelevant; indeterminism at any stage would only introduce randomness, not true self-origination.

  **2. P.F. Strawson's Reactive Attitudes (The Father):**
  *   **Core Claim:** The justification for our practices of holding people morally responsible (praise, blame, resentment, gratitude) doesn't depend on solving the metaphysical problem of free will vs. determinism. It rests on our natural, human "reactive attitudes."
  *   **Key Points:**
      1.  **Reactive Attitudes:** These are the natural, emotional responses we have towards others based on their perceived attitudes towards *us* (goodwill, ill-will, indifference). Resentment responds to ill-will, gratitude to goodwill, indignation to ill-will towards others, etc.
      2.  **The Framework:** These attitudes form the essential framework of human interpersonal relationships. They are constitutive of seeing others as *persons*, not mere objects or forces of nature.
      3.  **Excusing & Justifying Conditions:** We *do* modify or suspend these attitudes in specific, non-metaphysical cases (e.g., when someone acts under coercion, ignorance, severe mental illness, or extreme childhood deprivation). These are "excuses" or "justifications" based on whether the agent *could* have been expected to be guided by the relevant demands of the relationship.
      4.  **Irrelevance of Determinism:** Determinism, even if true, doesn't describe the world in a way that penetrates or dissolves this interpersonal framework. We wouldn't (and couldn't) adopt a purely "objective attitude" (seeing people solely as objects to be managed or treated) towards everyone all the time without ceasing to engage in ordinary human relationships.
      5.   **Grounding MR:** Moral responsibility is *grounded in* and *defined by* these practices and attitudes within the interpersonal framework. It doesn't require some further, external metaphysical foundation (like contra-causal freedom).

  **How They Threaten Each Other & Why the Reactive Attitudes Withstand the Challenge:**

  1.  **Galen's Challenge to P.F.:** Galen directly targets the *foundation* P.F. claims isn't needed. He argues that *even within* the reactive attitudes framework, our practices of assigning praise/blame *presuppose* ultimate responsibility and desert. If Galen is right that this ultimate desert is impossible, then the reactive attitudes themselves are fundamentally mistaken or illusory. They rest on a false presupposition about agents being *causa sui*. Resentment feels justified *because* we think the agent *deserves* it for being the ultimate source of their ill-will. Galen argues this "because" is false.

  2.  **P.F.'s Defense Against Galen (Why Reactive Attitudes Withstand the Challenge):**
      *   **Different Level of Inquiry:** P.F. argues Galen is asking the wrong *kind* of question. He's seeking a metaphysical justification *outside* the human practice. P.F. contends that the practice, with its internal logic of excuses/justifications, *is* the reality of MR. Asking "But do they *ultimately* deserve it?" is like asking "Is this *really* a game of chess?" while pointing to the physical pieces and laws of physics. The answer lies in the rules and practices *of chess itself*, not in fundamental physics.
      *   **No Presupposition of *Causa Sui*:** P.F. would deny that the reactive attitudes *logically require* or *presuppose* the agent being *causa sui*. They primarily respond to the *quality of the agent's will* *towards others* within the context of the interpersonal relationship. We resent the *ill-will itself*, not the metaphysical impossibility of its ultimate origin. Our practices focus on *how* the action manifests the agent's current attitudes, not on tracing those attitudes back to an uncaused cause.
      *   **Resilience of the Framework:** P.F.'s point is that these attitudes are so deeply ingrained in human psychology and social life that *even if* we intellectually accept Galen's argument (or determinism), we *cannot* consistently maintain the "objective attitude" towards everyone in our daily lives. The reactive attitudes constantly reassert themselves. The intellectual conclusion doesn't dissolve the emotional and interpersonal reality.
      *   **Excuses Address Control, Not Ultimate Origin:** The excusing/justifying conditions P.F. highlights (coercion, insanity, etc.) focus on the agent's *current* capacity for recognizing and responding to moral demands *in the situation*. They do not require, nor do they seek, an inquiry into the ultimate origin of the agent's character. An agent acting from deep-seated malice developed through a horrific childhood might not be excused (if they understand the wrongness), even though Galen argues they aren't ultimately responsible for that malice. P.F.'s framework can still hold them accountable *within the interpersonal sphere* because they currently possess and manifest the relevant ill-will.
      *   **Galen's Argument Doesn't Touch the Practice Itself:** Galen's argument is a powerful *metaphysical* critique of a *metaphysical* concept of ultimate desert. P.F. argues that our actual *practice* of MR isn't based on that metaphysical concept. It's based on the natural, social, psychological reality of interpersonal relationships. Galen might show that the *metaphysical justification* some *think* underlies the practice is incoherent, but he doesn't show that the *practice itself* is incoherent or unjustified *on its own terms*.

  **Conclusion: Does the Basic Argument Undercut the Reactive Attitudes?**

  *   **Intellectually/Genealogically:** Yes, Galen's argument is a profound challenge. If one *believes* that our reactive attitudes *must* be grounded in ultimate desert to be justified, then Galen's argument seems to fatally undermine them. It exposes a tension between our deep-seated feeling of desert and the apparent impossibility of its condition.
  *   **Practically/Existentially (as P.F. argues): No, not fundamentally.** The reactive attitudes, according to P.F., are resilient and self-sustaining. They form the bedrock of human social existence. Galen's argument, while logically forceful, operates at a level of abstraction that doesn't penetrate or dissolve this bedrock in everyday life. The practices of praise, blame, resentment, and gratitude, modified by context-specific excuses, continue to function meaningfully *without* needing to answer Galen's ultimate question. P.F. shifts the ground: MR isn't about being *causa sui*; it's about participating in the human community of mutually recognizing agents capable of goodwill and ill-will.

  **In essence:** Galen argues the *foundation* required for true MR is impossible. P.F. argues that MR *doesn't need that kind of foundation*; it has a different, practical, interpersonal foundation that is largely immune to Galen's metaphysical critique. While Galen's argument might make us *intellectually uneasy* about the *metaphysical implications* of our practices, P.F. argues compellingly that it doesn't, and cannot, eradicate the practices themselves or their justification *within the framework of human life*. The reactive attitudes withstand the challenge because they define the territory of MR; they don't rely on the metaphysical ground Galen shows to be unstable.
