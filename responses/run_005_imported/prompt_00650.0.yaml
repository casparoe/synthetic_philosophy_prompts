answer: |-
  You've hit on a **major tension** in Mill's argument that many readers find problematic. Let's break down his distinction and why it feels contradictory:

  1.  **The Explicit Rejection of Property:**
      *   Mill states it's "entirely inadmissible" to base extra votes on property/wealth.
      *   **Why?** He acknowledges property *is* a rough proxy for education (richer people often have more access). BUT, he argues it's a terrible criterion because:
          *   It's "imperfect": Not all rich people are intelligent/educated; not all intelligent people are rich.
          *   **Accident > Merit:** Wealth is often inherited or gained through luck/circumstance, not personal merit or intellectual effort. Someone born rich gets privilege; someone born poor might be brilliant but remain disadvantaged.
          *   **Odious & Unsustainable:** Tying political power directly to money is fundamentally unfair ("supremely odious") and would make the whole plural voting system politically toxic and impossible to maintain long-term.

  2.  **The Proposed Alternative: Occupation-Based Mental Superiority:**
      *   Mill argues the *only* valid justification for extra votes is "individual mental superiority."
      *   Since he lacks faith in universal exams or national education to measure this directly, he proposes using **occupation as a proxy**.
      *   **His Reasoning:** Certain occupations *require* and *develop* more intelligence, foresight, and complex reasoning than others:
          *   **Head vs. Hands:** Employers, bankers, merchants, manufacturers must "labor with their head" – manage complex systems, strategy, multiple variables. Foremen/skilled laborers require more judgment than unskilled laborers.
          *   **Scale & Complexity:** Managing larger businesses or more complicated financial/industrial interests inherently cultivates greater intellectual capacity than running a small shop (tradesman) or performing routine manual labor.
      *   **The Claim:** Occupation is a *better* indicator of *actual developed mental capacity* than mere wealth.

  **Why It *Feels* Like a Contradiction (and Kind of Is):**

  1.  **Strong Correlation:** In Mill's time (and often still today), the occupations he deems "superior" (employer, banker, merchant, manufacturer, even foreman) were overwhelmingly held by people with significantly more property and wealth than laborers or small tradesmen. Access to those "head" jobs was *heavily* dependent on wealth, family background, and education – things Mill himself admits are unfairly distributed.
  2.  **Circularity/Causation Confusion:** Does being a banker *make* you smarter, or does getting the education/social position to *become* a banker *require* and *reflect* existing advantages (including wealth)? Mill leans heavily on the former (the job develops the mind), downplaying the latter (wealth/social position grants access to the mind-developing job).
  3.  **Ignoring Systemic Barriers:** Mill dismisses property because "accident has so much more to do than merit," but doesn't adequately address how "accident" (birth, wealth, class) is the primary gateway to the occupations he now valorizes. A poor laborer with innate intelligence had almost no chance of becoming an employer or banker in Victorian England.
  4.  **Classism in Disguise?** While Mill sincerely believes he's selecting based on mental capacity developed through work, his list of "superior" occupations maps almost perfectly onto the Victorian middle and upper-middle class (bourgeoisie/capitalists), while "inferior" occupations map onto the working class. It functionally *replaces* one class marker (property) with another (occupational status), without fully escaping the underlying class structure.

  **Mill's *Intended* Distinction (and why he thinks it's different):**

  *   He's trying to shift the focus from *possession* (wealth) to *activity* and *developed capacity* (the intellectual demands of the job).
  *   He believes the *nature of the work itself* cultivates the intelligence relevant to governance, regardless of how much money the worker *has*. In theory, a brilliant but poor foreman (a "superior" occupation) would qualify, while a dim-witted heir living off rents (property) would not.
  *   He sees this as a more direct (though still imperfect) measure of the *competence* he values for political decision-making.

  **Is it Still Epistocracy?**

  *   **Yes, absolutely.** Epistocracy broadly means "rule by the knowledgeable." Mill's system is a specific type called **weighted voting** or **plural voting**.
  *   **Key Features of Epistocracy:**
      *   Political power is distributed based on (putative) knowledge/competence.
      *   Not everyone has equal political influence.
  *   **Mill's System Fits:**
      *   He explicitly bases extra votes on "individual mental superiority."
      *   The goal is to give more weight to the judgments of those deemed more competent (via occupational proxy).
      *   While *everyone* gets at least one vote (making it more palatable than disenfranchisement), influence is deliberately unequal based on perceived competence.
  *   It's distinct from pure universal suffrage democracy (one person, one vote) and from systems where only a certified elite votes (like ancient Sparta's Ephors or a modern technocracy). Weighted voting is a recognized epistocratic model.

  **In Conclusion:**

  You're right to feel conflicted. Mill passionately rejects wealth-based privilege only to propose a system heavily dependent on occupational status that was, in his historical context, deeply intertwined with wealth and class. While he *intends* to base votes on developed mental capacity via occupation, the strong correlation between those occupations and wealth, combined with the systemic barriers to accessing them, makes his system feel like a repackaging of class privilege. It highlights the immense difficulty of designing a "fair" epistocratic system that truly isolates competence from existing social and economic advantages. His argument contains a significant tension, if not a direct contradiction, on this point. It's a classic example of how even brilliant thinkers struggle to escape the biases and structures of their own time.
