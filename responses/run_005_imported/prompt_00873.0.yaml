  I should consider the specifics of logic puzzles. Unlike subjective topics, logic puzzles have a single correct answer. So uniqueness holds here. That strengthens the case for conciliationism. Even though both are competent, mistakes can happen. The fact that there's disagreement indicates that at least one made an error. Since they can't identify who erred, both should lower their confidence and reconsider. 

