  3. **Temporal framing**: Harm can occur *at the moment of death* by cutting off future experiences. The "subject" is the person as they were alive, with potential. 

  Practical considerations: 
  - If adopted, instructions should avoid vague terms like "hedonic." Use concrete language about loss of life's activities/experiences. 
  - Scaling to anticipation might be messy. Better to tie it to objective factors (age, health) to keep it fair and predictable. 

