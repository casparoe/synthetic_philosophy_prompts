answer: |-
  ## MEMORANDUM  
  TO: Judicial Council Committee on Model Jury Instructions  
  FROM: [Your Name], Committee Member  
  DATE: October 26, 2023  
  RE: Recommendation on Adopting "Loss-of-Life" Damages in Wrongful-Death/Survival Actions  

  ### I. Introduction
  This memo addresses the proposal to adopt a new category of damages in wrongful-death and survival actions: compensation for the **loss of the decedent’s future life itself** ("loss-of-life" or "hedonic" damages). This category is distinct from (a) conscious pre-death pain/suffering, (b) survivors’ losses (e.g., companionship, income), and (c) funeral expenses. The core debate centers on whether an estate can recover for the intrinsic value of the life the decedent was deprived of by premature death.  

  A persuasive memo from our colleague, the Hon. [Retired Judge’s Name], opposes this reform on philosophical grounds, invoking Epicurus and Lucretius to argue that death "is nothing to us" and that compensating for lost life erroneously assumes a "harm" experienced by a no-longer-existent person. While this argument is intellectually rigorous, it does not resolve the legal and ethical question before us. **I recommend adopting loss-of-life damages**, with instructions carefully tailored to avoid speculative or duplicative awards. Below, I address Judge [Name]’s argument, outline why deprivation-based compensation is legally coherent and just, and propose specific language for implementation.  

  ### II. Addressing the Epicurean Argument  
  Judge [Name]’s critique rests on two premises:  
  1. **Non-existence negates harm**: If the deceased no longer exists, they cannot experience loss.  
  2. **Symmetry of time**: The time after death is identical to the time before birth—neither is "experienced," so neither can be harmed.  

  **Substantive Response**:  
  - **Harm as Deprivation, Not Experience**: The law has long recognized that harm can arise from the *deprivation of future possibilities*, even if the victim does not consciously experience the loss. For example:  
    - A comatose patient deprived of life-saving care is harmed, though unaware.  
    - A young adult permanently disabled in an accident recovers for lost future enjoyment of life—a future they will not "experience" as their former self.  
    Death is the ultimate deprivation: it irrevocably eliminates all future experiences, relationships, and growth the decedent would have valued. As Thomas Nagel observes, death is a misfortune *because it removes the good things life would have contained*. The "harm" occurs at the moment of death, when the person’s potential is extinguished.  
  - **Asymmetry of Life and Death**: While pre-birth non-existence and post-death non-existence are both states of non-being, they are not morally equivalent. Before birth, there is no living person to deprive; after birth, a person exists with interests, relationships, and a future. Death *severs* this trajectory. Lucretius’ symmetry argument ignores that we evaluate harm from the perspective of a living person’s reasonable expectations.  
  - **Legal Personhood Extends to Anticipated Life**: The law does not treat death as a mere nullity. Wrongful-death statutes exist because society recognizes that a person’s *planned future* has value—to themselves, their dependents, and the community. Compensating for its loss acknowledges this value.  

  **Conclusion**: The Epicurean view, while logically consistent, adopts a definition of "harm" too narrow for tort law. We compensate lost opportunities, not just felt sufferings.  

  ### III. Legal and Practical Grounds for Adoption  
  #### A. Filling a Gap in Existing Compensation  
  Current damages categories fail to fully redress the wrong:  
  - **Pre-death pain/suffering** only covers conscious anguish before death (e.g., a poisoning victim’s final hours).  
  - **Survivors’ losses** (e.g., lost income, consortium) address harms to *others*, not the decedent.  
  - **Funeral costs** are administrative.  
  **The gap**: The destruction of the decedent’s *own stake in their future*—e.g., the hikes a 25-year-old naturalist planned, the novels a writer never penned, the grandchildren an elder hoped to know. This loss is personal to the decedent and distinct from survivors’ grief.  

  #### B. Precedent and Consistency  
  - **Injury Cases**: Courts routinely award non-economic damages for "loss of enjoyment of life" to *living* plaintiffs (e.g., a paralyzed athlete). Consistency demands we recognize the same loss when death obliterates it entirely.  
  - **Jurisdictional Trends**: 12 states (including MA, CT, HI) and the Restatement (Third) of Torts § 26 recognize loss-of-life damages. Federal courts apply them under maritime law (*Sea-Land Servs., Inc. v. Gaudet*). Rejection risks outlier status.  
  - **Moral Intuition**: As colleagues note, denying this category implies that instantly killing a healthy person inflicts *less harm* than maiming them—a perverse incentive the law should reject.  

  #### C. Mitigating Risks of Abuse  
  Critics fear open-ended awards, but safeguards exist:  
  1. **Avoid "Hedonic" Terminology**: Juries may misinterpret it as purely abstract "joy." Instead, frame damages as **"loss of the activities, experiences, and relationships the decedent would have valued during their expected lifetime."**  
  2. **Tether to Objective Factors**: Instruct juries to consider:  
     - The decedent’s age, health, and life expectancy.  
     - Documented interests, plans, and pursuits (e.g., career goals, community involvement).  
     - Avoid subjective "anticipation" metrics (e.g., "how vividly they feared death"), which are unprovable and inequitable.  
  3. **Exclude Duplicative Claims**: Ensure no overlap with pain/suffering (past-focused) or survivors’ losses (third-party-focused).  

  ### IV. Proposed Committee Vote & Language  
  **Recommendation**: ADOPT loss-of-life damages as a distinct category, with the below model instruction.  

  **Draft Jury Instruction Language**:  
  > *"If you find the defendant liable for wrongful death, you may award damages for the loss of the decedent’s future life itself. This compensates the estate for the experiences, activities, and relationships the decedent would have valued during their expected lifetime had the wrongful death not occurred. In determining this amount, consider:*  
  > *a. The decedent’s age, health, and life expectancy at the time of death;*  
  > *b. The decedent’s interests, pursuits, and plans for the future, based on the evidence presented;*  
  > *c. The value of ordinary life experiences a person in the decedent’s circumstances would have anticipated.*  
  > *Do not include compensation for the decedent’s pre-death pain or suffering, or for losses suffered by survivors—these are addressed separately."*  

  ### V. Conclusion  
  The Epicurean argument elevates abstract logic over the law’s role in redressing concrete deprivations. Death’s finality does not negate the value of what it destroys; it amplifies it. By adopting loss-of-life damages, we align our instructions with tort law’s foundational principle: to make the injured party (here, the estate representing the decedent’s interests) as whole as possible. The proposed language ensures awards remain grounded, equitable, and distinct from other damages. I urge the committee to approve this reform.  

  Respectfully submitted,  
  [Your Name]  
  [Your Title/Affiliation]
