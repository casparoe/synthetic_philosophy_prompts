answer: |-
  What a fascinating transition from field ecology to game theory! Your intuition about mixed strategies is spot-on, and the connection to the strict vs. weak dominance question is insightful. Let's break this down intuitively, leaning on your ecological perspective.

  **The Core Intuition: Strict Dominance = Unconditional Inferiority (Order Doesn't Matter)**

  1.  **Think "Absolute Loser":** A strategy `S_i` is **strictly dominated** by another strategy `S_j` if `S_j` gives player `i` a **strictly higher payoff** *no matter what combination of strategies every other player chooses*. It's like a plant that gets less sunlight and water in *every single possible microenvironment* compared to another plant. There is **no scenario** where `S_i` is the best choice, or even tied for best.
  2.  **The Elimination Process is Like Pruning Dead Wood:** When you iteratively eliminate strictly dominated strategies:
      *   **Round 1:** You remove strategies that are losers *no matter what anyone else does*. Removing them doesn't depend on predicting others' behavior; they are unconditionally bad.
      *   **Round 2:** You look at the *reduced* game. Crucially, **removing the dead wood didn't harm any viable strategy's relative position.** If `S_k` was strictly dominated by `S_l` in the original game, it remains strictly dominated by `S_l` in the reduced game. Why?
          *   The strategies you removed were *never* best responses. Removing them doesn't suddenly make a previously inferior strategy (`S_k`) look good compared to `S_l` in *any* of the remaining scenarios. `S_l` was better than `S_k` against *all* opponent profiles, including the ones still left. Taking away some opponent profiles (the ones involving the eliminated strategies) doesn't change the fact that `S_l` beats `S_k` in *every* profile that remains.
  3.  **Order Independence:** Because eliminating one strictly dominated strategy doesn't alter the *relative* payoffs or dominance relationships between the *remaining* strategies against the *remaining* opponent strategies, the order doesn't matter. You're just removing universally bad options, and the viability of the others is unaffected. It's like clearing invasive weeds that outcompete natives in *every* patch – removing them in any order reveals the same resilient native species underneath.

  **Weak Dominance: The Problem of Ties (Order Matters A Lot)**

  1.  **Think "Sometimes Tied":** A strategy `W_i` is **weakly dominated** by `W_j` if `W_j` gives player `i` a payoff **at least as good as `W_i`** for *every* possible combination of strategies the other players choose, and **strictly better for at least one** such combination. `W_i` is never *better* than `W_j`, but it *might be tied* in some scenarios.
  2.  **The Elimination Process is Like Altering the Ecosystem:** The problem arises because of those ties.
      *   **Scenario:** Imagine `W_i` is weakly dominated by `W_j`. There's a specific opponent strategy profile `P_tie` where `W_i` and `W_j` yield the *exact same payoff* for player `i`. In all other profiles, `W_j` is strictly better.
      *   **The Crux:** Strategy `W_i` only *exists* as a potential best response for player `i` *if* player `i` believes the *other* players might play `P_tie`. In that very specific scenario, `W_i` is just as good as `W_j`.
  3.  **Order Matters Because You Change the Context:**
      *   **Order A (Eliminate `W_i` first):** You declare `W_i` is weakly dominated and remove it. `P_tie` (the profile where `W_i` was tied) *might still exist in the game* if it involved other players' strategies that haven't been eliminated yet. `W_j` remains.
      *   **Order B (Eliminate something else first):** Suppose you first eliminate a strategy belonging to *another* player that was *part of* the profile `P_tie`. Now, the specific profile `P_tie` **no longer exists** in the reduced game! The *only* reason `W_i` wasn't *strictly* dominated before was because of its performance in `P_tie`. With `P_tie` gone, `W_i` might now be **strictly dominated** by `W_j` in the remaining profiles! Or, its status relative to other strategies might change dramatically.
      *   **The Analogy:** Imagine two prey species (`W_i` and `W_j`). `W_j` is generally harder for predators to catch *except* against one specific, rare predator (`P_tie`) where they are equally vulnerable.
          *   If you eliminate prey `W_i` first (Order A), predator `P_tie` still exists, and prey `W_j` remains viable but vulnerable to `P_tie`.
          *   If that specific predator `P_tie` goes extinct first (Order B), *then* prey `W_i` loses its only niche (it was only equally viable against `P_tie`). Now `W_j` strictly dominates `W_i` in the remaining ecosystem, and `W_i` gets eliminated next. Or worse, eliminating `P_tie` might make a *different* predator much more effective against `W_i`, changing the whole dynamic. **By altering the context (which opponent strategies exist), you alter whether `W_i` has any reason to exist.**

  **The Link to Mixed Strategies and Dominance**

  You've hit on a profound connection! The need for mixed strategies to dominate a pure strategy is *directly* tied to the concept of strictness.

  1.  **Pure Strategy Limitation:** Sometimes, no single pure strategy (`Pure_A`) strictly dominates another pure strategy (`Bad_B`) *across all opponent responses*. There might be different opponent strategy profiles where different pure strategies beat `Bad_B`. `Pure_A` might beat `Bad_B` when opponents play `X`, but lose to it when opponents play `Y`. `Pure_C` might beat `Bad_B` when opponents play `Y` but lose when they play `X`.
  2.  **Mixed Strategy Solution:** A mixed strategy (`Mix`) randomizes between `Pure_A` and `Pure_C`. The key is that **for *every possible* opponent strategy profile, the *expected payoff* of `Mix` is strictly greater than the payoff of `Bad_B`**.
      *   Why? Because when opponents play `X`, `Mix` gives you at least the payoff of `Pure_A` (which beats `Bad_B`), and possibly more if `Pure_C` also does well or if the mix weights favor `Pure_A`. Similarly for `Y`. The randomization ensures you never get caught *only* playing the pure strategy that loses to the current opponent move.
  3.  **The Strictness Connection:** The mixed strategy `Mix` achieves **strict dominance** over `Bad_B` (`Mix` > `Bad_B` for *all* opponent plays) precisely *because* it leverages the strengths of different pure strategies in different scenarios. A single pure strategy couldn't do this because its payoff is fixed and might be lower than `Bad_B`'s in some scenarios, preventing the strict inequality. The mixed strategy "smooths out" the performance, ensuring it's always strictly better.
  4.  **Why it Works:** Randomization makes your play unpredictable. `Bad_B` can't exploit a weakness in your strategy because you aren't committed to a single vulnerable pure play. You're always covered. This unpredictability is what allows the mixed strategy to enforce the *strict* dominance relationship that no pure strategy could achieve alone. It's like an organism having a bet-hedging strategy (mixed strategy) that ensures survival under *all* foreseeable environmental conditions (opponent plays), whereas specializing in a single phenotype (pure strategy) might fail catastrophically in some conditions.

  **Summary for the Field Ecologist**

  *   **Strict Dominance (Order Independent):** "This strategy is worse than that one in *every single possible situation* imaginable. Removing it doesn't hurt anything else; it's just dead weight. Prune it whenever you find it; the healthy ecosystem remains the same."
  *   **Weak Dominance (Order Dependent):** "This strategy is generally worse, but it ties in this one very specific scenario. Whether it survives elimination depends entirely on whether *that specific scenario* gets eliminated first (by removing the strategies that create it). Order matters because you're changing the context that defines viability."
  *   **Mixed Strategies & Dominance:** "No pure phenotype is optimal against *all* environmental challenges. A bet-hedging mixed strategy (like variable seed dormancy or a hawk/dove mix) can achieve strictly better *expected* fitness across *all* environments than a fixed, vulnerable phenotype. Randomization provides the coverage needed for strict dominance where pure specialization fails."

  The core is the unconditional nature of strict inequalities (`>` everywhere) versus the conditional nature of weak inequalities (`>=` everywhere, `>` somewhere). Unconditionality makes removal safe and order-independent. Conditionality makes viability context-dependent, and altering the context (via elimination order) changes the outcome. Mixed strategies exploit this by using randomness to *create* unconditionality (strict dominance) where pure determinism cannot.
