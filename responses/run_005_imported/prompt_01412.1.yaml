  - Priya's neighborhood: 50%  
    - Sit-down restaurant: ≈66.7% (of the 50%, so ≈33.3% overall)  
    - Noodle shop: ≈33.3% (of the 50%, so ≈16.7% overall)  
  - Others' neighborhood: 50%  
