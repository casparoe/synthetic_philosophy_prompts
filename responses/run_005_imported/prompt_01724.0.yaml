answer: |-
  Anscombe's position hinges on a **fundamental rejection of consequentialism** (specifically utilitarianism) as a valid moral framework for justifying certain actions, coupled with a strict adherence to **absolute moral prohibitions** derived from natural law theory and virtue ethics. Here's how she resolves the apparent paradox:

  1.  **Rejection of Consequentialism as Morally Bankrupt:**
      *   Anscombe argued that judging actions *solely* by their outcomes (like net lives saved) is morally disastrous. It justifies *any* action, no matter how intrinsically heinous, if it produces a "good" result.
      *   She believed this framework destroys the very concepts of justice, rights, and intrinsic human value. If murder (the deliberate killing of the innocent) can be justified by good consequences, then *nothing* is truly forbidden.

  2.  **Absolute Prohibition Against Targeting the Innocent:**
      *   Central to her ethics was the absolute prohibition against **intentionally killing innocent human beings**. This is not a rule of thumb; it's a fundamental moral principle that cannot be overridden by consequences.
      *   For Anscombe, "innocent" in this context means **non-combatants** – civilians not directly participating in hostilities, including children, the elderly, hospital patients, etc. Deliberately killing them is murder, always and everywhere wrong.

  3.  **The Bombings as *Intentional* Killing of Innocents:**
      *   Anscombe argued that the atomic bombings of Hiroshima and Nagasaki were **not** primarily aimed at military targets *as such*, nor were civilian deaths merely foreseen but unintended collateral damage.
      *   The bombs were dropped on entire cities, with the **specific intent** to kill vast numbers of civilians to break Japanese morale and force surrender. Civilians *were* the primary target chosen to achieve the psychological and political effect.
      *   Therefore, regardless of the *consequences* (even the consequence of shortening the war and saving lives overall), the act itself was the **deliberate murder of innocent people**.

  4.  **The Principle of Double Effect (PDE): The Key to Non-Pacifism:**
      *   This principle is what allows Anscombe to condemn the atomic bombings as murder *without* embracing pacifism. PDE provides criteria for when causing foreseen but unintended harm (even death) might be morally permissible:
          *   **The Nature of the Act:** The act itself must be good or neutral (e.g., attacking a legitimate military target).
          *   **The Intention:** The agent must intend only the good effect (e.g., destroying the military target); the bad effect (e.g., civilian deaths) must *not* be intended, either as an end or a means.
          *   **Distinction between Means and Side-Effect:** The bad effect must not be the *means* to achieve the good effect. The good effect must flow directly from the act itself, not from the bad effect.
          *   **Proportionality:** There must be a proportionately grave reason for permitting the foreseen bad effect.
      *   **Application to Bombings vs. Traditional Warfare:**
          *   **Bombings:** Failed PDE. Civilians were *intentionally* targeted as the *means* to force surrender (bad effect *is* the means to the good effect). The act (obliterating a city) was inherently destructive of innocents.
          *   **Legitimate Military Action:** Could pass PDE. Bombing a munitions factory *intending* to destroy the factory (good effect/military objective), foreseeing but *not intending* civilian deaths nearby (bad side-effect), and the deaths aren't the *means* by which the factory is destroyed. The proportionality condition must also be met.

  5.  **Conceding Utility Doesn't Vindicate Morality:**
      *   Anscombe's concession that the bombings likely shortened the war and saved lives *on a utilitarian calculus* does *not* mean she accepts that calculus as morally decisive. For her, it's irrelevant. Even if the calculation were correct, it doesn't change the fundamental nature of the act: intentionally killing innocents remains murder. Pointing to good consequences doesn't transform an intrinsically evil act into a good one.

  **The Principle that Resolves the Paradox: The Principle of Double Effect (PDE).**

  PDE allows Anscombe to:
  *   **Reject Consequentialism:** Moral permissibility is not determined by net outcome alone. Intention and the nature of the act matter fundamentally.
  *   **Condemn Hiroshima/Nagasaki as Murder:** The intentional targeting of non-combatants violates the absolute prohibition against killing the innocent and fails the tests of PDE.
  *   **Avoid Pacifism:** Military actions targeting combatants or legitimate military objectives, where harm to innocents is genuinely unintended, foreseen but proportional, and not used as a means, *can* be morally permissible under PDE.

  In essence, Anscombe argues Truman committed murder *because* he chose a course of action that *intentionally* used the mass killing of innocent civilians as a weapon of war. No amount of beneficial consequence can morally sanitize that core intention and act. PDE provides the framework for distinguishing such acts from potentially justified acts of war that tragically but unintentionally harm non-combatants.
