  First, I need to recall Aquinas' actual texts. Elena's point about the Sentences commentary seems solid - Aquinas does distinguish usurpers (no legitimacy) from abusive rulers (legitimacy but misrule). That's a key framework. Marcus isn't wrong about De Regimine's caution, but he's missing that this applies only to the second category. 

