  **Justification:**

  1. **Elena (Score 2):** Correctly identifies Aquinas' core distinction between *usurpers* (no legitimate title) and *unjust rulers* (legitimate title, bad governance) in the *Sentences Commentary*. Her claim that subjects owe no obedience to a usurper because they lack genuine authority is textually grounded and represents Aquinas' position accurately. This establishes the foundational case where resistance is conceptually distinct from rebellion.

  2. **Marcus (Score 0):** Correctly notes Aquinas' caution in *De Regimine Principum* regarding practical removal, but misapplies it. His point that denying a duty to obey isn't equivalent to licensing killing is partially valid *in isolation*, but he fails to engage with Elena's specific point about the usurper's *lack of authority* framing resistance as defense against aggression. His argument conflates the two types of tyrants Aquinas distinguishes, weakening his rebuttal.

  3. **Elena (Score 2):** Successfully refutes Marcus's conflation. She clarifies that Aquinas' caution in *De Regimine* applies *only* to legitimate-title tyrants, not usurpers. Her articulation of Aquinas' "coherent two-track view" (force against usurpers as aggressors, institutional remedy for bad rulers) is a precise and defensible reading of the texts cited. This meets the threshold for a "conditional tyrannicide doctrine" focused on usurpers.

  4. **Marcus (Score -1):** Overreaches. While correctly noting practical limitations of institutional remedies in some regimes (making endurance/prayer a last resort for bad rulers), this doesn't negate the *principle* for usurpers. His claim that "no standing" doesn't imply a post-facto right misreads Elena: she frames resistance to usurpers as meeting ongoing *aggression* (defensive force), not "hunting down." The John of Salisbury comparison highlights Aquinas' caution but doesn't disprove Elena's conditional doctrine – it shows a *narrowed scope* (focusing on usurpers), not its absence.

  **Key Overlooked Points:**

  1.  **Natural Law & Self-Defense:** Both underplay how Aquinas' justification for resisting a *usurper* flows directly from natural law and the right to self-defense/preservation against an unjust aggressor (*Summa Theologiae* II-II, Q64, A7). This isn't primarily "political resistance" but repelling force.
  2.  **The Role of "Public Authority":** Aquinas' "public authority" (*De Regimine*) isn't necessarily a formal institution. Medieval thought often included nobles, the community ("populus"), or even lower magistrates as potentially holding residual authority to act against a legitimate-title tyrant *if* higher mechanisms failed. His remedy isn't *always* purely passive.
  3.  **Distinction vs. Doctrine:** Marcus implies "tyrannicide doctrine" requires active commendation (like Salisbury). Elena shows Aquinas provides a clear *justification* under specific conditions (usurpation = aggression). Whether this constitutes a "doctrine" hinges on definition – but the conditional justification is present.
  4.  **The "Moment" of Resistance:** The line between resisting "in the moment" and "after the fact" against a usurper is blurry. A usurper's *continued rule* is arguably an ongoing act of aggression, making defensive force potentially licit beyond the initial seizure, especially if no higher authority acts. Aquinas doesn't explicitly limit it to the instant of takeover.
