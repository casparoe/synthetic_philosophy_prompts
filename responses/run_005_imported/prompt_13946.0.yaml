  But Marcus has a partial point in move 4 about practical limitations. Even if Elena's theoretical distinction holds, many medieval governments lacked deposition mechanisms. His comparison to John of Salisbury is apt too - Aquinas does narrow the tradition. Still, he overstates by implying this negates the doctrine entirely.

  What both might be missing? The role of natural law in Aquinas - resistance to usurpers flows from self-preservation rights, not political theory. Also how Aquinas' "public authority" could include nobles or even popular consent in absence of formal bodies. And maybe the bigger picture: Aquinas is balancing order against justice, hence the two-track approach isn't just doctrine but pastoral prudence.

  The scoring should reflect: Elena wins on exegesis (move 1 and 3 rock), Marcus on practical realism (move 2 and 4 have merit but overreach). Neither fully grapples with the natural law foundation or medieval constitutional context though.
