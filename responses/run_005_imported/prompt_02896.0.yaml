  Here’s an example illustrating Medina's proportional view, followed by an analysis:

  ### Scenario: Academic Grant Review Committee  
  **Characters:**  
  - **Dr. Aris Thorne (Speaker A):** White male professor at an elite university, well-known in his field.  
  - **Dr. Binta Adebayo (Speaker B):** Black female professor at a less prestigious institution, pioneering innovative but less conventional research.  
  - **Hearer:** Dr. Evan Reed, a committee member with implicit bias favoring scholars from "top-tier" institutions (correlating with racial/gender privilege).  

  **Events:**  
  The committee reviews grant proposals. Dr. Thorne (A) submits a solid but incremental project. Dr. Adebayo (B) submits a high-risk, high-reward proposal challenging established paradigms. Dr. Reed, influenced by identity prejudice (associating elite institutions/white males with rigor), automatically affords **excess credibility** to Thorne’s proposal. He interprets minor flaws in Thorne’s application as "understandable oversights" and emphasizes his "established track record."  

  When reviewing Adebayo’s proposal, Reed applies hypercritical scrutiny: her unconventional methods are deemed "unreliable," and her lack of citations from top journals is seen as a "gap in expertise." Crucially, Reed holds **no independent prejudice against Adebayo** (he admires her work in abstract). However, because Thorne’s proposal has consumed disproportionate credibility, the committee’s **total allocatable credibility is artificially constrained**. Reed subconsciously demands *higher* evidence thresholds from Adebayo to "balance" Thorne’s inflated standing. Adebayo’s proposal is rejected.  

  ---

  ### Why This is Genuine Comparative Proportionality (Not Disguised Prejudice Against B):  
  1. **No Independent Prejudice Against B:**  
     Reed acknowledges Adebayo’s talent and has supported similar work by other scholars. His bias is **exclusively comparative**: Thorne’s unearned credibility *creates* Adebayo’s deficit by resetting the baseline for "sufficient rigor."  

  2. **Zero-Sum Credibility Economy:**  
     Medina’s key insight is that credibility functions relatively in institutional contexts. By over-allocating credibility to Thorne (due to identity prejudice), Reed implicitly **depletes the pool** available to others. Adebayo isn’t judged on her merits alone but *against* Thorne’s inflated position.  

  3. **Structural Mechanism:**  
     Adebayo’s deficit arises from **systemic distortion**, not direct identity bias. Had Thorne not been present, Adebayo’s proposal might have passed. The injustice emerges from relational credibility distribution, not a negative stereotype about Adebayo.  

  ---

  ### What This Shows About Fricker's Framework:  
  Fricker’s model requires **direct identity prejudice against the victim** (B) to define testimonial injustice. Medina’s example reveals two limitations:  
  1. **Omission of Credibility Excess:**  
     Fricker dismisses credibility excess as merely a "correlative harm." Here, Thorne’s excess *directly causes* Adebayo’s deficit, yet Fricker’s framework ignores this harm because Reed holds no prejudice *against* Adebayo.  
  2. **Structural Blind Spot:**  
     Fricker focuses on *individual* hearer-speaker dyads (prejudice against B → deficit for B). Medina shows that injustice can arise from **networked credibility economies** where prejudice *for A* harms *B* through proportional displacement.  

  **Conclusion:** Medina’s view demonstrates that Fricker’s framework is **too narrow** by excluding harms arising from comparative credibility distributions. Testimonial injustice can occur through **third-party effects** of unearned credibility, even absent direct prejudice against the victim. This demands expanding analyses to systemic credibility economies, not just individual interactions.
