  - Contemporary counterarguments: even if crabs lack "mind," nociception without analgesia may skew data (bad science!) or cause unnecessary tissue damage (welfare =/= just feeling). 
  - Pragmatic out: conditional approval (e.g., "demonstrate reflex persists with analgesia") forces the postdoc to test his own premise. 

  The user's hidden need? Probably to model how science/philosophy interact—for the postdoc *and* committee. The memo should educate while deciding. 

