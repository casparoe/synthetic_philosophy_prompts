  I should avoid three pitfalls: 
  First, don't treat Descartes as a straw man. His "beast-machine" theory was nuanced (he granted animals sensation but denied conscious thought). 
  Second, don't let modern neurobiology dominate—the user wants the *philosophical* weakness exposed. 
  Third, the memo must be actionable: approve/reject/conditions + timeline. 

  Key angles to weave in: 
