  I should structure the dialogue to cover the main points. Start with setting the scene: two philosophers after a seminar. The first character, Elara, supports Wright's entitlement. She argues that hinges need a normative status to avoid arbitrariness. The second, Kieran, takes the Wittgensteinian view that hinges are arational. They need to clash on whether calling hinges "rational" smuggles in evidentialism.

  Key arguments for Elara: Without entitlement, all our beliefs could be arbitrary. Hinges enable rational inquiry, so there must be a rational basis for accepting them. Entitlement is a non-evidential warrant, not violating Wittgenstein's point.

