  I need to ensure each responds to the other. For example, when Elara says entitlement avoids arbitrariness, Kieran should argue that hinges aren't arbitrary because they're necessary for the language-game. Elara then clarifies that entitlement isn't evidential but a structural necessity. Kieran counters that necessity doesn't equal rationality.

  The user wants no strawmen, so both positions should be strong. Elara could reference §248 where Wittgenstein says we don't learn the practice through justification. Kieran would emphasize that hinges are animal, instinctive, not rational choices.

