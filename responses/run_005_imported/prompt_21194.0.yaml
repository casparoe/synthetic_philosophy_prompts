  First, I need to recall what hinge propositions are. From Wittgenstein's "On Certainty," these are foundational beliefs like "the earth is very old" or "my senses are reliable." They aren't based on evidence; doubting them would make all doubt meaningless. The key disagreement here is about rationality: Wright says we're entitled to accept hinges rationally without evidence, while the other side argues that rationality doesn't apply to hinges at all.

