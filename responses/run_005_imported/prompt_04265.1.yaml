answer: |-
  Here’s a dialogue set at your apiary, with two experts debating passionately but substantively over your hive. **Morgan** defends kin selection, while **Jordan** advocates for Nowak/Tarnita/Wilson's critique. Both engage directly with honeybee biology:

  ---

  ### **The Setting**  
  *Golden hour at your beehives. Morgan (wearing a faded "Hamilton’s Rule" t-shirt) and Jordan (sporting a "Selection Acts at Multiple Levels" cap) lean on the fence as workers dart in laden with pollen.*

  **You:** *(gesturing at the hive)* So... workers never lay eggs. Kin selection explains it, right?  

  **Morgan:** Absolutely. Haplodiploidy’s the key. Workers share 75% of genes with sisters but only 50% with their own offspring. Helping the queen reproduce is genetically smarter.  

  **Jordan:** *(shakes head)* That’s the *story*, but the math doesn’t hold. Nowak, Tarnita, and Wilson showed inclusive fitness is redundant. Honeybees don’t need relatedness asymmetry—**colony-level selection** suffices.  

  **Morgan:** *(raises an eyebrow)* Without high relatedness, how do you stop workers from selfishly laying eggs? Cheaters should wreck the colony!  

  **Jordan:** Easy. **Queen policing** and **worker policing**. Your bees right here? *(points at hive)* Workers eat each other’s eggs. Queens emit pheromones suppressing worker ovaries. Selection favors colonies that suppress rebellion—*regardless* of relatedness.  

  **Morgan:** But policing *evolved* because of relatedness! In monogamous ancestors, workers *were* super-sisters. Haplodiploidy set the stage.  

  **Jordan:** Ah, the "monogamous ancestor" assumption! Wild honeybee queens mate with **12–20 drones**. Average relatedness in this hive? *(taps the box)* Maybe 25-30%, not 75%. Yet workers *still* don’t rebel. Why? Because colonies with rebellious workers **collapse**. Group selection trumps kinship.  

  **Morgan:** *(leaning in)* Fine, multiple mating reduces relatedness—but workers *are* still more related to sisters (30%) than to sons (50% in haplodiploidy? Wait, no—sons come from unfertilized eggs, so...  

  **Jordan:** *(finishing the thought)* Workers pass 50% of genes to sons. To brothers? Only 25%. So if relatedness to sisters is ~30%, the "kin selection advantage" vanishes. Yet workers stay sterile. *That’s* the hole in the haplodiploidy hypothesis.  

  **Morgan:** But studies show workers *do* prefer rearing sisters over brothers when queens aren’t looking! Kin recognition matters.  

  **Jordan:** And when the queen’s gone, workers *do* lay eggs—proving they’re physically capable! Sterility isn’t genetic altruism; it’s enforced by social feedback. A colony is a **self-organizing system**—traits like worker sterility emerge from interactions, not just relatedness calculus.  

  **Morgan:** So you’re saying inclusive fitness adds nothing?  

  **Jordan:** It’s a *descriptive* tool, not predictive. Standard natural selection—acting on individual queens, workers, *and* whole colonies—explains eusociality cleaner. No need for "relatedness times benefit > cost."  

  **Morgan:** *(pauses)* Okay, but kin selection *does* predict patterns: species with higher relatedness have more worker sterility. Monogamous wasps versus polyandrous honeybees...  

  **Jordan:** ...And polyandrous honeybees have **stronger policing** to compensate! That’s adaptation via colony-level selection. The *mechanism* is enforcement, not genetic self-sacrifice.  

  *(A worker bee buzzes near Jordan’s cap. Both watch it land on a frame.)*  

  **You:** So... what should I tell my neighbors?  

  **Morgan:** Kin selection explains why altruism *can* evolve in haplodiploids—but it’s not the whole story.  

  **Jordan:** And colony-level forces maintain it. The bees? They’re just following pheromones and eating eggs. No calculators needed.  

  **Morgan:** *(smirks)* Fine. But if Wilson trashed kin selection, why do 90% of behavioral ecologists still use it?  

  **Jordan:** Because old paradigms die hard! But the real answer’s in the hive: **it’s complicated**.  

  **You:** *(lifting a honey frame)* So both of you agree... it’s not "case closed"?  

  **Morgan & Jordan:** *(in unison)* Definitely not.  

  ---

  ### **Key Points Debated**  
  - **Morgan (Kin Selection):**  
    • Haplodiploidy enables altruism by skewing relatedness.  
    • Explains worker preference for rearing sisters.  
    • Predicts correlation between relatedness and eusociality.  

  - **Jordan (Nowak/Tarnita Critique):**  
    • Real-world polyandry weakens relatedness asymmetry.  
    • Direct mechanisms (policing, pheromones) enforce sterility without kinship math.  
    • Colony collapse creates stronger selection than individual relatedness.  

  ### **What to Tell Your Neighbors**  
  > *"Worker bees rarely lay eggs because queens and other workers suppress them—it keeps the colony stable. The famous ‘sisters before daughters’ idea works in simple cases, but our honeybees? Their queens mate with dozens of drones, so workers aren’t super-sisters. In the end, it’s about the whole hive surviving, not genetic math."*  

  This captures the nuance: kin selection *initiated* eusociality in some species, but in your polyandrous hive, enforcement and group selection maintain it. The bees, as always, are wiser than the theories.
