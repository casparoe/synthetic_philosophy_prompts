  I recall that the issue isn't just about assigning small probabilities. It's about how we handle claims involving astronomically large numbers. The user might not realize that in standard Bayesian updating, even extremely low priors can be overwhelmed by huge utilities. If the mugger says "I'll torture 3↑↑↑3 people," that number is so vast that even a prior like 1/10^100 might not be small enough because 3↑↑↑3 is incomprehensibly larger. For example, 3↑↑↑3 is way bigger than 10^100. So if the prior is 1/10^100, multiplying by 3↑↑↑3 could still make the expected value huge, demanding you pay the $5. That's the core of the paradox—the size of the number can always outpace any fixed prior you pick.

  Also, the user mentioned "picking a low enough prior," but what does "enough" mean here? If the mugger can always name a larger number, say 3↑↑↑↑3, then no matter how small your prior, they can escalate. This points to a deeper problem: priors for such outlandish claims aren't well-defined. How do you reasonably assign a probability to something like "reality-warping wizard"? The reference class problem kicks in—what similar events can we base this on? Without empirical data, any prior is somewhat arbitrary.

  Another angle is the leverage penalty or bounded utility functions. The user might not have considered that unbounded utility functions lead to this issue. If disutility can be infinite or near-infinite, Pascal's Mugging becomes inevitable. Solutions like bounding utility (capping how much we value outcomes) or leverage penalties (discounting claims based on how much they ask for) try to address this. But these have their own issues, like violating intuitions about extreme stakes.

  The user's friends are tuning out, so they need a clear explanation. They might feel frustrated that their simple fix isn't accepted. It's important to validate their insight while explaining the deeper challenges. Their solution works in practice for human-scale decisions, but fails in theoretical extremes where hypercomputation and infinite stakes come into play, especially relevant for AI alignment.

  Also, the user is interested in why this matters for AI safety. An unbounded utility AI could be exploited by a malicious agent making huge threats, leading to irrational resource allocation. So theoretical solutions like bounded utility are crucial for designing robust AI systems.

