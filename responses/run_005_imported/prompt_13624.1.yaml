  Below is a concrete two-person bargaining problem where the Nash solution and the Kalai-Smorodinsky (KS) solution diverge. I provide explicit details of the feasible set, disagreement point, computations of both solutions, and an analysis of the conflict.

  ### Bargaining Problem Specification
  - **Disagreement point**: \(d = (0, 0)\).
  - **Feasible set \(S\)**: A convex set defined by the following piecewise-linear Pareto frontier, asymmetric and kinked (non-linear overall), with vertices at \((0, 0)\), \((0, 1.5)\), \((1.5, 1)\), and \((2, 0)\). The Pareto frontier consists of two segments:
    - Segment 1 (for \(0 \leq u_1 \leq 1.5\)): \(u_2 = 1.5 - \frac{1}{3}u_1\).
    - Segment 2 (for \(1.5 \leq u_1 \leq 2\)): \(u_2 = 4 - 2u_1\).
  - **Comprehensiveness**: \(S\) includes all points below the Pareto frontier and above the axes (i.e., \(u_1 \geq 0\), \(u_2 \geq 0\)).

  The set \(S\) is visualized as a quadrilateral with vertices \((0, 0)\), \((0, 1.5)\), \((1.5, 1)\), and \((2, 0)\), and is convex and comprehensive. The ideal point (utopia point) is \((u_1^{\max}, u_2^{\max}) = (2, 1.5)\).

  ### Computation of Solutions
  #### 1. **Nash solution**  
  Maximizes the product \(u_1 \cdot u_2\) over \((u_1, u_2) \in S\) with \(u_1 \geq 0\), \(u_2 \geq 0\).  
  - **Segment 1** (\(0 \leq u_1 \leq 1.5\)): \(u_2 = 1.5 - \frac{1}{3}u_1\), so the product is:  
    \[
    P_1(u_1) = u_1 \left(1.5 - \frac{1}{3}u_1\right) = 1.5u_1 - \frac{1}{3}u_1^2.
    \]
    Derivative: \(P_1'(u_1) = 1.5 - \frac{2}{3}u_1\). Setting to zero gives \(u_1 = 2.25\), outside \([0, 1.5]\). Endpoints:  
    - \(u_1 = 0\): \(P_1 = 0\).  
    - \(u_1 = 1.5\): \(P_1 = 1.5 \times (1.5 - 0.5) = 1.5 \times 1 = 1.5\).  
  - **Segment 2** (\(1.5 \leq u_1 \leq 2\)): \(u_2 = 4 - 2u_1\), so the product is:  
    \[
    P_2(u_1) = u_1(4 - 2u_1) = 4u_1 - 2u_1^2.
    \]
    Derivative: \(P_2'(u_1) = 4 - 4u_1\). Setting to zero gives \(u_1 = 1\), outside \([1.5, 2]\). Endpoints:  
    - \(u_1 = 1.5\): \(P_2 = 1.5 \times (4 - 3) = 1.5 \times 1 = 1.5\).  
    - \(u_1 = 2\): \(P_2 = 0\).  
  - **Maximum product**: 1.5 at \((u_1, u_2) = (1.5, 1)\).  
    **Nash solution**: \((1.5, 1)\).

  #### 2. **Kalai-Smorodinsky (KS) solution**  
  Finds the Pareto-efficient point where the ratio of utilities matches the ratio of ideal utilities:  
  \[
  \frac{u_1}{u_1^{\max}} = \frac{u_2}{u_2^{\max}} \implies \frac{u_1}{2} = \frac{u_2}{1.5} \implies u_2 = 0.75u_1.
  \]
  - **Segment 1** (\(0 \leq u_1 \leq 1.5\)): Set \(u_2 = 1.5 - \frac{1}{3}u_1 = 0.75u_1\):  
    \[
    1.5 - \frac{1}{3}u_1 = 0.75u_1 \implies 1.5 = u_1\left(0.75 + \frac{1}{3}\right) = u_1\left(\frac{3}{4} + \frac{1}{3}\right) = u_1\left(\frac{13}{12}\right).
    \]
    Solving: \(u_1 = 1.5 \times \frac{12}{13} = \frac{18}{13} \approx 1.3846\), \(u_2 = 0.75 \times \frac{18}{13} = \frac{27}{26} \approx 1.0385\).  
    Check feasibility: \(1.5 - \frac{1}{3} \times \frac{18}{13} = 1.5 - \frac{6}{13} = \frac{19.5 - 6}{13} = \frac{13.5}{13} = \frac{27}{26} \approx 1.0385\), so it lies on Segment 1.  
  - **Segment 2** (\(1.5 \leq u_1 \leq 2\)): Set \(u_2 = 4 - 2u_1 = 0.75u_1\):  
    \[
    4 - 2u_1 = 0.75u_1 \implies 4 = 2.75u_1 \implies u_1 = \frac{4}{2.75} = \frac{16}{11} \approx 1.4545.
    \]
    But \(\frac{16}{11} \approx 1.4545 < 1.5\), outside the domain of Segment 2.  
  - **KS solution**: \((\frac{18}{13}, \frac{27}{26}) \approx (1.3846, 1.0385)\).

  ### Numerical Divergence
  - **Nash solution**: \((1.5, 1)\).  
  - **KS solution**: \((1.3846, 1.0385)\).  
  The solutions differ: Player 1 gets more in Nash (\(1.5 > 1.3846\)), while Player 2 gets more in KS (\(1.0385 > 1\)).

  ### Diagnosis of the Conflict
  - **Violation of Independence of Irrelevant Alternatives (IIA) by KS solution**:  
    Consider a subset \(T \subset S\) containing the KS solution and \(d\), e.g., the triangle with vertices \((0, 0)\), \((0, 1.5)\), and \((1.5, 1)\) (which excludes \((2, 0)\)). In \(T\), the ideal point is \((1.5, 1.5)\), so the KS condition is \(u_1/1.5 = u_2/1.5 \implies u_1 = u_2\). Solving \(u_2 = 1.5 - \frac{1}{3}u_1 = u_1\) gives \(u_1 = 1.125\), \(u_2 = 1.125\). The KS solution for \(T\) is \((1.125, 1.125)\), different from the original KS solution \((1.3846, 1.0385)\) in \(S\), even though \(T\) contains both \(d\) and the original KS point. Thus, KS violates IIA.
    
  - **Violation of Individual Monotonicity by Nash solution**:  
    Consider an expansion of \(S\) to \(S'\) (not detailed here, but see the note below) where \(u_1^{\max}\) increases (e.g., to 3) while \(u_2^{\max}\) remains 1.5. The Nash solution may assign Player 1 a lower utility in \(S'\) than in a subset where \(u_1^{\max}\) was lower. For example, in a symmetric triangle \(T\) with vertices \((0,0)\), \((0.5,0)\), and \((0,1)\) (where \(u_1^{\max}=0.5\)), the Nash solution is \((0.5, 0.5)\). Expanding to the full triangle \(S\) with vertices \((0,0)\), \((1,0)\), and \((0,1)\) (where \(u_1^{\max}=1\)), the Nash solution becomes \((\frac{1}{3}, \frac{1}{3}) \approx (0.333, 0.333)\). Player 1's utility decreases from 0.5 to 0.333 despite the expansion favoring them, violating individual monotonicity.

  ### Role of Asymmetry and Non-linear Frontier
  - **Symmetric problem**: If \(S\) is symmetric (e.g., linear frontier \(u_1 + u_2 = c\)), both solutions yield the symmetric point (e.g., midpoint), so no divergence.  
  - **Linear Pareto frontier**: As shown algebraically, a linear frontier implies identical solutions (both yield \(u_1 = c/(2m)\), \(u_2 = c/2\) for frontier \(u_2 = c - m u_1\)).  
