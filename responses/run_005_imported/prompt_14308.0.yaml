answer: |-
  The smell of ink and old paper was thick in the cramped study at Chatsworth. Thomas Hobbes, seventy-eight years old and feeling every ache amplified by the damp Derbyshire air, held the pamphlet as if it were offal. John Wallis’s latest. The title alone was a sneer: *Hobbius Heauton-timorumenos; or, A Consideration upon Mr. Hobbes his Dialogues; Addressed to Robert Boyle, Esq.*

  His knuckles, thick and stiff, whitened. Not at the clumsy Greek pun branding him a self-tormentor. Not even at the familiar litany of his mathematical sins: the mangled definitions, the impossible constructions, the stubborn refusal to see the obvious. No. It was the *tone*. The dripping condescension. The way Wallis, Savilian Professor of Geometry, member of the Royal Society, addressed him like a doddering fool who couldn’t grasp his ABCs.

  Hobbes tossed the pamphlet onto the growing pile near the fireplace – a pyre of humiliation he refused to light. He picked up his compass instead. The brass was cool, worn smooth by decades of handling. His fingers, once nimble enough to dissect political bodies with the precision of a surgeon, now trembled slightly. He placed the sharp point onto the virgin vellum.

  *Click.*

  A perfect circle bloomed. Black, undeniable, complete. His sanctuary. His tormentor.

  He remembered the first time, decades ago, in Sir Charles Cavendish’s library. The smell of beeswax and leather. Sunlight catching dust motes dancing over the open folio of Euclid. *Elements*. Proposition 47. The Pythagorean Theorem. A simple diagram, lines intersecting, squares appended. *That the square described upon the hypotenuse…*

  "Impossible," he’d muttered aloud, the certainty of it visceral. How could mere lines enclose such a relationship? It offended his nascent sense of order, the nascent *Leviathan*-mind that craved demonstrable chains of cause and effect, link by undeniable link. He hadn't dismissed it; he’d attacked it. He’d traced the proofs backwards, through Book I, proposition by proposition, definition by definition. He chased the logic like a hound, cornering the truth, forcing it to yield its inevitability. The moment he grasped it, the moment the chain snapped taut and held, was a revelation. *This* was certainty. Not faith, not tradition, but iron-clad deduction. Geometry was the language of God's creation, pure and incorruptible. It became his refuge, the intellectual bedrock against the shifting sands of civil war, regicide, exile. In geometry, there were no factions, no seditious preachers, no ambiguous laws. Only truth and falsehood, proven or disproven.

  And now, this circle. The ultimate test. To tame it, to reduce its infinite, irrational curve to the finite, rational language of straight lines and numbers – that would be the ultimate triumph of Reason. The ultimate proof that the universe, even its most elusive forms, could be comprehended, contained, *controlled* by the human mind. Just as the Leviathan contained the chaotic multitude within the rigid structure of the sovereign will. Order imposed upon chaos. Certainty wrested from the void.

  He’d published his first "quadrature" decades ago, a bold assertion. Then another. And another. Each met with Wallis’s withering, meticulous demolition. Each time, Hobbes dug in. He refined, he argued, he published furious counter-pamphlets thicker than the originals. The Royal Society, that new bastion of experimental philosophy, had politely, then firmly, closed its doors to him. Not for his political philosophy, initially, but for this. For his refusal to yield on the circle. They called him obstinate, senile, a man clinging to a dream.

  *Obstinate?* He adjusted the compass, drew a radius. His mind felt as sharp as ever. Sharper, perhaps, honed by decades of battle. Wallis used newfangled algebra, symbols Hobbes distrusted as vague and prone to sophistry. Wallis talked of "limits," of "infinitesimals" – ghostly concepts, un-geometric, *unreal*. Hobbes dealt in tangibles: points, lines, angles. Things you could *see*, could *construct*. His methods were pure Euclidean deduction. How could Wallis, with his ephemeral symbols and dubious concepts, claim *he* was wrong? It was the *world* that needed correcting, not Thomas Hobbes.

  He began constructing lines within the circle, seeking the elusive proportion. He envisioned the sovereign line, imposing its will upon the unruly circumference. One straight line equal to the curved path. It *had* to exist. It *must* be demonstrable. The alternative was… unthinkable. A flaw in the geometric fabric of the universe. A crack in the foundation of all rational thought, all possible order. If the circle defied quadrature, what else defied reason? Could justice be irrational? Could the sovereign’s power be fundamentally flawed? The very idea tasted like ashes.

  A log shifted in the fireplace, sending a shower of sparks up the chimney. The sudden flare illuminated the portrait hanging askew on the opposite wall – a younger Hobbes, eyes fierce, jaw set. The author of *Leviathan*, the man who dared to blueprint the commonwealth. The man who knew, with geometric certainty, the necessity of absolute power to prevent the war of all against all.

  *Click.* He drew another line. Wrong. Again. He could feel Wallis’s phantom laughter in the rustle of the discarded pamphlet. *Hobbius Heauton-timorumenos.* Self-tormentor. Perhaps. But the torment wasn't in the failure; it was in the *possibility* of failure. In the gnawing doubt that Wallis, for all his arrogance and alien methods, might have touched upon something true. A truth Hobbes’s magnificent, rigid system couldn't accommodate.

  He remembered the clarity of that first Euclidean proof, the chain of logic clicking into place. That was the feeling he chased now. The feeling Leviathan was meant to embody for society: an end to dispute, to ambiguity, to the bloody chaos of competing truths. His political geometry demanded a single, sovereign answer. His mathematical geometry demanded the same. To admit the circle couldn't be squared wasn't just admitting a mathematical error; it was admitting a fundamental limitation of reason itself. It was conceding that the universe contained irreducible mysteries, irrationalities that defied the human compulsion for order. It was the crack through which chaos might seep back into his meticulously constructed world.

  His hand shook more violently. The line wavered, spoiled the clean geometry of the vellum. A blot of ink, dark and formless, spread where the point had dug in too deep. Chaos.

  Hobbes stared at the imperfection, his breath shallow. He didn’t reach for sand to blot it. He didn’t tear the page. Slowly, deliberately, he picked up his quill. Not to erase, but to write. He dipped it in the inkwell, the action steadying him.

  He began drafting his response. Not a retraction. Never that. A *refinement*. Another proposition. Another construction. He would find the path. He would prove it. He *had* to. For if the circle remained untamed, what hope was there for man? The straight line *must* conquer the curve. Reason *must* prevail. Certainty *must* be possible. He wrote, the scratch of the quill the only sound in the room, a defiant counterpoint to the silent, perfect, mocking circle on the page before him. The Leviathan of his mind would not yield. Not to Wallis. Not to the Royal Society. Not even to the impossible truth of π.
