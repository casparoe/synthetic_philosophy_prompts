prompt: |-
  My roommate and I have had this unwritten rule for like 3 years: whoever gets home last does the dishes that night. We've used it a ton with zero drama. But last week I was out of town for work and didnt get back to our place til 1am, long after she'd gone to bed, and now she's saying that means I "got home last" and I owe her a week of dishes to make up for it. Thing is, every other time we've actually used this rule, it was on some normal day where we were both just out and about and back within a couple hours of each other — never a case where one of us was away overnight on a trip. We even scrolled back through old texts and neither of us ever said what's supposed to happen in a situation like this. Now we're both convinced we're obviously right about what the rule always meant, and I've been going back and forth on it in my head for days. Who's actually right here, or does the rule just not cover this and we're stuck deciding something new from scratch?
