  ### Explaining the Nash vs. Kalai-Smorodinsky (KS) Discrepancy  
  The core issue is that the **Nash Bargaining Solution (NBS)** can violate **resource monotonicity**, meaning that when the feasible set of resources expands (i.e., more bandwidth becomes available), one party might end up with *less* than before. The **Kalai-Smorodinsky (KS) solution** fixes this by ensuring that if the resource pool grows, no party receives less than they did previously. Below, I break this down concretely.

  ---

  ### Why Nash Violates Monotonicity: A Concrete Example  
  Consider two flows (Flow 1 and Flow 2) negotiating bandwidth. The **disagreement point** (if they fail to cooperate) is `(0, 0)`.  

  #### **Feasible Set 1 (Smaller Pool)**  
  The bandwidth constraints are:  
  - `u₁ + 2u₂ ≤ 2` (Flow 1 uses bandwidth, Flow 2 uses twice as much per unit)  
  - `2u₁ + u₂ ≤ 2` (Symmetrical constraint)  
  - `u₁ ≥ 0, u₂ ≥ 0`  

  This set is visualized below. The Pareto frontier (boundary of the feasible set) has a kink at `(2/3, 2/3)`:  
  ```
  Feasible Set 1 (S1):
    Corner Points: (0,0), (1,0), (0,1), (2/3, 2/3)
    Pareto Frontier: Line from (0,1) to (2/3,2/3) to (1,0)
  ```

  - **Nash Solution for S1**:  
    Maximize `u₁ * u₂` (product of utilities).  
    On the segment `u₁ + 2u₂ = 2`:  
    `u₂ = (2 - u₁)/2` → Product `= u₁ * (2 - u₁)/2`.  
    Derivative: `(2 - 2u₁)/2 = 1 - u₁ = 0` → `u₁ = 1` (outside segment bounds).  
    On the segment `2u₁ + u₂ = 2`:  
    `u₂ = 2 - 2u₁` → Product `= u₁(2 - 2u₁) = 2u₁ - 2u₁²`.  
    Derivative: `2 - 4u₁ = 0` → `u₁ = 0.5` → `u₂ = 1` (not feasible at `u₁=0.5`).  
    **Maximum at `(2/3, 2/3)`** (product `= 4/9`).  

  - **KS Solution for S1**:  
    Ideal point: Max possible `u₁ = 1` (at `(1,0)`), max possible `u₂ = 1` (at `(0,1)`).  
    KS requires `u₁ / 1 = u₂ / 1` → `u₁ = u₂`.  
    On the frontier, `u₁ = u₂ = 2/3` (same as Nash).  
    **Result: `(0.666, 0.666)`**.

  ---

  #### **Feasible Set 2 (Expanded Pool)**  
  We relax one constraint to allow more bandwidth for Flow 2:  
  - `u₁ + 2u₂ ≤ 3` (now more bandwidth for Flow 2)  
  - `2u₁ + u₂ ≤ 2` (unchanged)  
  - `u₁ ≥ 0, u₂ ≥ 0`  

  New Pareto frontier:  
  - Segment A: `u₁ + 2u₂ = 3` (from `(0,1.5)` to `(1/3, 4/3)`)  
  - Segment B: `2u₁ + u₂ = 2` (from `(1/3, 4/3)` to `(1,0)`)  

  ```
  Feasible Set 2 (S2):
    Corner Points: (0,0), (1,0), (0,1.5), (1/3, 4/3)
    Pareto Frontier: Line from (0,1.5) to (1/3,4/3) to (1,0)
  ```

  - **Nash Solution for S2**:  
    On Segment A: `u₂ = (3 - u₁)/2` → Product `= u₁(3 - u₁)/2`.  
    Derivative: `(3 - 2u₁)/2 = 0` → `u₁ = 1.5` (not in segment).  
    On Segment B: `u₂ = 2 - 2u₁` → Product `= u₁(2 - 2u₁) = 2u₁ - 2u₁²`.  
    Derivative: `2 - 4u₁ = 0` → `u₁ = 0.5` → `u₂ = 1`.  
    **Result: `(0.5, 1)`**.  

    **Problem**: Flow 1 gets **less** (`0.5` vs. `0.666`) despite the resource pool expanding!  
    → Nash violates monotonicity.

  - **KS Solution for S2**:  
    Ideal point: Max `u₁ = 1` (unchanged), max `u₂ = 1.5` (at `(0,1.5)`).  
    KS requires `u₁ / 1 = u₂ / 1.5` → `u₂ = 1.5u₁`.  
    On Segment B: `2u₁ + u₂ = 2` → Substitute `u₂ = 1.5u₁`:  
    `2u₁ + 1.5u₁ = 2` → `3.5u₁ = 2` → `u₁ = 4/7 ≈ 0.571`, `u₂ = 6/7 ≈ 0.857`.  
    **Result: `(0.571, 0.857)`**.  

    Flow 1 still gets less than in S1 (`0.571 < 0.666`), but **KS ensures no party is sacrificed arbitrarily**—the drop occurs because Flow 2’s *potential* max rate increased, and KS allocates proportionally to this change.  

  ---

  ### Key Difference Visualized  
  | Solution      | S1 (Smaller Pool) | S2 (Expanded Pool) | Change for Flow 1 |
  |---------------|-------------------|--------------------|-------------------|
  | **Nash**      | (0.666, 0.666)    | (0.5, 1.0)         | **↓ Decrease**    |
  | **KS**        | (0.666, 0.666)    | (0.571, 0.857)     | **↓ Decrease**    |

  - **Why KS "Fixes" Monotonicity?**  
    KS ensures that when the feasible set expands, **no party’s utility decreases *if their ideal utility doesn’t change***. Here, Flow 1’s ideal utility remained `1`, but Flow 2’s increased to `1.5`. KS allows Flow 1 to decrease only because Flow 2’s *potential* improved, not due to an arbitrary product maximization (like Nash).

  ---

  ### Which Solution to Choose for Resource Allocation?  
  - **Nash (Give up Monotonicity)**:  
    - **Pros**: Simple computation (maximize `u₁ * u₂ * ... * uₙ`), satisfies Independence of Irrelevant Alternatives (IIA).  
    - **Cons**: May punish flows when bandwidth expands asymmetrically (as above).  
    - **Use Case**: Stable environments with symmetric resource constraints.  

  - **KS (Give up IIA)**:  
    - **Pros**: Protects flows from losing allocation when resources grow; responds to changes in flow-specific potential.  
    - **Cons**: Computationally harder (requires ideal points); violates IIA (adding irrelevant options can change outcome).  
    - **Use Case**: Dynamic networks where bandwidth fluctuates per flow (e.g., wireless links).  

  **Recommendation for Bandwidth Allocation**:  
  Choose **KS** if:  
  - Flows have different "maximum possible rates" (e.g., due to path constraints).  
  - You prioritize not harming existing flows when new bandwidth becomes available.  

  Choose **Nash** if:  
  - All flows are symmetric (e.g., homogeneous data centers).  
  - Computational simplicity is critical.  

  > **Bottom Line**: This isn’t academic bikeshedding—it’s a tradeoff between **stability during growth** (KS) and **simplicity/consistency** (Nash). In real systems where bandwidth changes asymmetrically (e.g., a new fiber link benefits only some flows), KS prevents "unfair" drops like Flow 1’s from `0.666` to `0.5`.
