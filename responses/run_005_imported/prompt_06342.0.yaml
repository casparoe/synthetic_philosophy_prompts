answer: |-
  ## The Rationality of Keeping Promises: Parfit's Hitchhiker and the Nature of Rational Choice

  Parfit's Hitchhiker presents a stark challenge to conventional notions of rationality. At the critical juncture in town, Causal Decision Theory (CDT) delivers a seemingly unassailable verdict: paying the driver is irrational. The ride is secured, no future interactions exist, and paying imposes a pure cost with no *causal* benefit. The money spent could be used for other goods; retaining it strictly dominates paying. CDT, focusing solely on the causal consequences *flowing from* the act itself at the moment of choice, concludes paying fails to maximize expected utility (EU). This mirrors the two-boxer position in Newcomb's Problem: taking both boxes is causally dominant, as the prediction (and thus the contents of the opaque box) is already fixed, making one-boxing appear causally inefficacious and hence irrational.

  However, accepting CDT's verdict leads to the paradoxical conclusion that genuine rationality might require cultivating a disposition to act irrationally in specific future moments. If the traveler is rational *only* if disposed *not* to pay when the time comes, the driver, foreseeing this, refuses the rescue. The traveler dies. Conversely, if the traveler possesses a "rational irrationality" – a disposition to irrationally pay in town – the driver, confident in this disposition, rescues her. Survival, the ultimate good, is achieved *because* of the disposition to perform an act CDT deems irrational *in situ*. This suggests rationality might be dispositional, not merely act-based. Gauthier champions this view, arguing that constrained maximization – adopting dispositions to cooperate or keep promises when beneficial *ex-ante* – is rational even if specific acts (like paying) seem suboptimal *ex-post*. On this view, paying isn't irrational; it's the rational execution of a disposition *necessary* for securing the beneficial agreement (the rescue). The "irrationality" perceived by CDT is an illusion stemming from an overly narrow, atomistic focus on the isolated act.

  McClennen's resolute choice offers a complementary perspective. The traveler, facing death in the desert, makes a rational *plan*: commit to paying to secure rescue. Resolute choice demands she *stick* to this rationally adopted plan when in town, even if myopic re-evaluation suggests defection. Paying isn't irrational; it's the rational fulfillment of the prior commitment that made survival possible. Assessing the act "in isolation" is rejected as the wrong standard; rationality must evaluate choices within the context of extended plans and commitments over time. This directly counters CDT's moment-of-choice focus. Paying maximizes EU not at the isolated moment, but *from the perspective of the planning stage* where the commitment was made.

  **Is this dispute identical to Newcomb's Problem?** Fundamentally, **yes**. Both cases hinge on the core disagreement between evidential and causal reasoning within decision theory:

  1.  **Common Structure:** Both involve a prior state (Predictor's belief/driver's confidence) influenced by the agent's disposition or predicted choice, leading to a beneficial outcome (money in opaque box/rescue). The later choice (one-box/pay) provides *evidence* of that prior disposition but has no *causal* power over the benefit already received.
  2.  **CDT's Dilemma:** In both, CDT insists on the causally dominant act (two-box/not pay), leading to a worse outcome if the correlation between disposition and prior state is reliable. It labels the beneficial act (one-box/pay) as irrational *at the moment of choice*.
  3.  **Alternative Resolution:** Defenders of one-boxing and paying argue that rationality requires recognizing the correlation. EDT values the act as evidence; dispositionalists (Gauthier) value the trait enabling beneficial commitments; resolute choosers (McClennen) value plan adherence. All reject CDT's atomistic moment-of-choice evaluation as inadequate for these types of problems, advocating for a broader temporal or dispositional view where the beneficial act is rational *outright*.

  **Does reliability matter?** While perfect reliability (omniscient Predictor/driver) makes the cases analytically cleaner, the core dispute persists even with high, imperfect reliability. If the driver is usually right about dispositions (say, 90% accurate), CDT *still* dictates not paying in town, as the rescue is already causally secured. The traveler following CDT would, over many such interactions, be rescued less often than one with the disposition to pay. Gauthier's constrained maximizer, adopting the disposition *because* it yields higher EU *overall* despite occasional "irrational" payouts when the driver is wrong, still seems rationally superior in expectation. Resolute choice remains viable if the plan was rational *ex-ante* given the probabilities. Imperfect reliability slightly weakens the *strength* of the argument against CDT but doesn't eliminate the fundamental conflict between causal atomism and broader conceptions of rationality tied to dispositions or plans. It highlights that the disposition's value depends on the reliability of detection – a point dispositionalists readily incorporate into their EU calculations *ex-ante*.

  **Conclusion: Rationality Beyond the Atomistic Moment**

  Parfit's Hitchhiker does not establish genuine "rational irrationality." Instead, it powerfully demonstrates the inadequacy of Causal Decision Theory's myopic, act-isolated standard of rationality for choices embedded in strategic interactions and temporal commitments. CDT correctly identifies that paying *causes* no benefit at the moment of choice. However, this focus blinds it to the rational *source* of the benefit: the traveler's *disposition* to keep promises, or her *resolution* to stick to a rational plan. Gauthier's disposition-based criterion and McClennen's resolute choice provide superior frameworks. They show that paying is rational *outright* when understood as the execution of a trait or commitment that was rationally adopted to secure the rescue – a trait whose value is realized precisely *because* it leads to keeping the promise even when myopic incentives suggest otherwise. The perceived "irrationality" is an artifact of CDT's impoverished lens, not a feature of reality. This dispute is indeed the same core disagreement seen in Newcomb's Problem: a clash between causal atomism and approaches that integrate evidence, dispositions, or temporal plans into the very definition of rational choice. Rationality, these cases compellingly argue, is not merely about maximizing causal consequences at an instant, but about managing one's traits and commitments over time to navigate a world where others respond to the kind of person you are, and the kind of choices you are expected to make.
