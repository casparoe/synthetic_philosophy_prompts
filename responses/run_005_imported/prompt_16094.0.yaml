prompt: |-
  So this has been rattling around in my head since a party a couple weekends ago and my friend group could not agree on it, so I'm hoping you can do better. My friend Dan is signed up for one of those weekend "wealth mindset" seminars next month (the semi-MLM, crypto-coaching flavor), and he was going on about how hyped he is. Someone at the table pointed out, kind of teasing him, that literally everyone who goes to these things comes out completely sold and hands over their credit card, and that's basically the whole design of the event. Dan didn't even fight that — he agreed that's exactly what's gonna happen to him too.

  But then he said the thing that actually stopped the conversation: he said it would almost be irrational of him to walk in now thinking the opportunity is probably bogus, because he already knows, with way more certainty than he knows most facts about his own future, that by Sunday night he's going to be fully convinced its legit — and right now he has no specific reason to think Sunday-Dan will be wrong. So doesn't consistency require he shift his current opinion at least partway toward Sunday-Dan's opinion, now, in advance of any of the actual seminar content? When somebody pointed out he's done this exact kind of seminar twice before and both times it fizzled within a month, he said that's besides the point and doesn't touch the logic of the argument itself.

  I'm taking an epistemology seminar this term and we've spent a good chunk of time on why your beliefs across time are supposed to hang together — Dutch book stuff, the general idea that you should defer to your own future opinion on things since future-you presumably knows more than present-you. That part seems totally fine to me: I'd trust tomorrow-me's opinion of a paper over today-me's, once tomorrow-me has actually read it. But Dan's case feels like it obviously shouldn't work that way, and I can't cleanly articulate why not, since structurally his argument looks uncomfortably similar to the tomorrow-me case. Is there an actual principled difference between the two, or is Dan onto something more uncomfortable than we gave him credit for at the table? And if there is a difference, where exactly does it live?
