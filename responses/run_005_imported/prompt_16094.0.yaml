  Let me unpack why this feels different. The core issue is that Dan is treating his future conviction as evidentially significant when it's actually predetermined by manipulative design. It's not that future-Dan knows more; it's that future-Dan will be epistemically compromised. The seminar isn't a truth-seeking process but a belief-installation mechanism. 

  Interesting how Dan dismisses his prior negative experiences as irrelevant - that actually highlights the problem. Past seminars did change his belief, but falsely. The common factor isn't truth-tracking but vulnerability to manipulation. When the user says "it obviously shouldn't work this way," their intuition is recognizing this bypassing of normal belief formation.

  The key distinction from the "tomorrow-me reading a paper" example is asymmetric information flow. In legitimate learning, future-you incorporates new evidence. Here, the seminar prevents incorporation of disconfirming evidence while manufacturing artificial "evidence" through emotional manipulation and social pressure. Future-Dan's belief state is evidentially hollow.

  I should emphasize that diachronic rationality requires reasonable expectations of epistemic improvement. We don't defer to future selves who we know will be drugged, sleep-deprived, or otherwise impaired. Cognitive manipulation falls squarely in that category. Dan's argument collapses because he's describing a known epistemic breakdown, not growth.

  The user might also appreciate framing this as a failure of "reflective equilibrium." Present-Dan possesses reflective knowledge (this always manipulates people) that future-Dan will temporarily lack. Consistency actually demands privileging this critical perspective over the soon-to-be-compromised one.

