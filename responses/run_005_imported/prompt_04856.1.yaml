answer: |-
  You've identified a profound tension in Russell's *Marriage and Morals*. Applying his own consequentialist premises rigorously to people socialized within *existing* conventions (rather than his hypothetical future society) does indeed yield a significantly more restrictive verdict on extramarital relationships than the permissive stance he adopts. Here’s the argument:

  1.  **Russell's Core Premise: Consequences Trump Intrinsic Duty:** Russell explicitly rejects fidelity as an intrinsic moral duty. The *only* valid grounds for judging extramarital relationships are their consequences, primarily:
      *   **Harm to Children:** Ensuring children are loved, cared for, and raised in a stable environment conducive to their well-being.
      *   **Household Stability:** Maintaining a functional, cooperative domestic unit necessary for child-rearing and mutual support.
      *   **Psychological Well-being:** Minimizing destructive emotional states like jealousy, possessiveness, and hatred that poison relationships.

  2.  **Russell's Acknowledgment of Jealousy's Potency:** Despite arguing jealousy is culturally constructed and *could* be minimized through different upbringing, Russell is unequivocal about its devastating *current reality*:
      *   He describes it as "one of the most profound instinctive passions," "fierce," "destructive," and a primary cause of marital misery, violence, and breakdown.
      *   He recognizes it arises from deeply ingrained proprietary feelings over partners, reinforced by centuries of social convention, law, and religion – precisely the conventions under which his contemporaries were raised.
      *   Crucially, he admits this jealousy isn't easily reasoned away *even by those intellectually convinced of Russell's views*. Its roots are emotional and instinctual (as culturally shaped instinct).

  3.  **The Consequentialist Impact of Jealousy Under Existing Conventions:** For individuals raised in the proprietary model Russell criticizes (i.e., virtually everyone in his contemporary society), extramarital relationships carry an *extremely high probability* of triggering severe negative consequences:
      *   **Destruction of Household Stability:** Jealousy frequently leads to intense conflict, withdrawal of affection, loss of trust, and ultimately, marital breakdown and divorce – directly undermining the stable environment Russell deems essential for children.
      *   **Harm to Children:** Witnessing parental conflict, experiencing the trauma of separation/divorce, potential economic hardship, and divided loyalties caused by jealousy-driven breakups are profoundly harmful to children. Russell prioritizes child welfare; these are direct, severe harms.
      *   **Psychological Damage:** The intense pain, humiliation, rage, and depression caused by jealousy inflict significant suffering on *all* parties involved – the "betrayed" spouse, the "guilty" spouse (who may feel guilt or be subjected to rage), and even the children caught in the crossfire. This violates Russell's concern for minimizing destructive passions.
      *   **Undermining Cooperative Parenting:** Even if the marriage persists, pervasive jealousy destroys the goodwill, trust, and cooperation essential for effective shared child-rearing within the household.

  4.  **The Argument for Restriction Based on Actual Consequences:** Applying Russell's *own* consequentialist framework rigorously to the *actual* psychological and social realities of his contemporaries leads to this conclusion:
      *   Given the *overwhelming likelihood* that extramarital relationships will trigger intense, culturally ingrained jealousy in one or both partners...
      *   And given that this jealousy *directly causes* the very harms Russell seeks to avoid – destruction of household stability, severe harm to children, and immense psychological suffering...
      *   Therefore, for people raised under existing proprietary conventions (which Russell acknowledges are dominant), engaging in extramarital relationships carries an *unacceptably high risk* of causing catastrophic consequences.
      *   **Ergo:** To prevent these demonstrably likely harms (to children, stability, and well-being), Russell's consequentialism demands a *significant restriction* on extramarital relationships *within the context of his contemporary society*. Fidelity becomes a *pragmatic necessity* to avoid the near-certain destructive fallout of jealousy, even if it isn't an intrinsic duty.

  5.  **Russell's Mistake: Premature Application of the Ideal:** Russell's error lies in applying the ethical framework *designed for his idealized future society* (where jealousy is minimal due to reformed upbringing) to his *current society* where those reforms are absent. He underestimates the inertia of culturally ingrained passions. While arguing *for* social reform to reduce jealousy, he fails to acknowledge that *until that reform is achieved*, his consequentialist principles demand caution regarding the very practices (extramarital relations) that most potently trigger the destructive jealousy he so vividly describes. His permissiveness for his contemporaries is inconsistent with the devastating consequences he admits are highly probable under the status quo.

  **In essence:** You cannot simultaneously hold that (a) jealousy is a devastatingly potent and common destructive force under current socialization, (b) the primary moral criteria are the consequences for children and household stability, and (c) extramarital relationships are generally permissible *for people raised under the system that produces (a)*. (a) and (b) logically compel (c) to be heavily restricted *until* the socialization producing (a) changes. Russell's permissive conclusion for his contemporaries ignores the devastating consequences his own analysis predicts, making it internally inconsistent within his consequentialist framework applied to the real world he inhabited. His prescription requires the reformed society he envisions to already exist; for his own time, his premises point towards restraint.
