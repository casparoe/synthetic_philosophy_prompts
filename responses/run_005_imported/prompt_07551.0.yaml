answer: |-
  ## MEMORANDUM  
  **TO:** Hospital Ethics Committee Members  
  **FROM:** Ethics Committee Chair  
  **SUBJECT:** Recommendation on Directive vs. Facilitative Ethics Consultation Model  
  **DATE:** October 26, 2023  

  ### I. DECISION RECOMMENDATION  
  **Adopt a Hybrid Model ("Principled Directive Consultation")** with strict eligibility criteria, mandatory reasoning transparency, and a 12-month pilot review period. **Directive recommendations will be permitted only in two narrowly defined scenarios:**  
  1. **Intractable Medical Futility Disputes:** Where continued treatment violates evidence-based physiological futility *and* 7+ days of facilitative consultation failed.  
  2. **Surrogate Decision-Maker Conflicts:** With documented incapacity/absence of a lawful surrogate *and* imminent patient harm.  

  All other cases retain the **facilitative model**.  

  ---

  ### II. ADDRESSING THE EPISTEMIC OBJECTION  
  We acknowledge the profound concern that directive recommendations risk creating "moral compliance without moral understanding," potentially eroding collective responsibility. This is not mere friction—it strikes at the core of clinical ethics as a *practical reasoning discipline*. Our hybrid model directly confronts this via:  

  **A. Safeguards Against Unreasoned Deference**  
  1. **Reasoning Mandate:** Directive reports must include:  
     - A lay-language summary of the ethical principles applied (e.g., "Prioritized patient autonomy via advance directive over family's cultural beliefs").  
     - Disclosure of significant dissenting views among consultants.  
     - Citation of relevant hospital policy/legal standards.  
  2. **Implementation Pause:** Teams have 24 hours to request a verbal briefing from the ethics consultant to clarify reasoning before implementation (except imminent harm).  
  3. **Moral Engagement Requirement:** The care team must document in the patient record *how* the ethics directive was operationalized clinically, forcing engagement beyond passive compliance.  

  **B. Preserving Responsibility**  
  1. **Consultant Accountability:** Directive opinions require co-signature by two senior ethics consultants, with names documented.  
  2. **Team Sovereignty:** Clinical teams retain ultimate authority to escalate unresolved objections to the CMO/CEO, preventing blind deference.  
  3. **Education Component:** Quarterly debriefs for teams implementing directives to discuss ethical reasoning (separate from case review).  

  **C. Limiting Scope**  
  By restricting directives to <5% of anticipated cases (based on CMDS data), we prevent normalization of epistemic outsourcing. Most disputes will still require facilitative consensus-building.  

  ---

  ### III. CONCRETE POLICY ELEMENTS  
  1. **Eligibility:** Directive consultations require:  
     - Attending physician attestation of failed ≥7-day facilitative efforts OR imminent harm.  
     - Ethics Chair approval *before* issuing directive.  
  2. **Documentation:**  
     - Standardized template with "Reasoning Summary" section (max. 300 words).  
     - Distinct EHR flag: **ETHICS DIRECTIVE – REVIEW RATIONALE ATTACHED**.  
  3. **Opt-Out:** Clinicians may formally object in writing, triggering automatic CMO review.  
  4. **Review Date:** Full committee evaluation after **12 months (November 1, 2024)**, assessing:  
     - Rate of team objections/escalations.  
     - Staff survey on "understanding of ethics directives."  
     - Time-to-resolution in futility cases.  
     - Consultant disagreement patterns (via blinded case audits).  

  ---

  ### IV. RATIONALE FOR HYBRID MODEL  
  While the facilitative model aligns with ethics as *process*, protracted conflicts harm patients and demoralize staff. The epistemic risks of directive models are real—but **indefinite facilitation in crises can also degrade moral responsibility by exhausting participants into resignation**. This hybrid:  

  - **Averts Harm** in emergencies where process has demonstrably failed.  
  - **Demands Transparency** in reasoning, rejecting opaque "verdicts."  
  - **Balances Epistemic Humility** (acknowledging ethics isn’t cardiology) with **Practical Resolvability** (some judgments *must* be made).  
  - **Incentivizes Rigor** through narrow eligibility and review triggers.  

  ---

  ### V. IMPLEMENTATION NEXT STEPS  
  1. Draft revised Ethics Consultation Policy for vote at next meeting.  
  2. Develop directive documentation toolkit (templates, training).  
  3. Present pilot metrics framework to Risk Management & Medical Board.  

  *Approved by majority vote of the Ethics Committee, October 26, 2023.*  

  ---  
  **Attachment:** Proposed Policy Revision (Draft) | Pilot Evaluation Framework  

  This memo synthesizes principled pragmatism—confronting epistemic limits while refusing to abandon exhausted clinicians or deteriorating patients to endless deliberation. The 12-month review ensures we remain accountable to both moral understanding and moral consequences.
