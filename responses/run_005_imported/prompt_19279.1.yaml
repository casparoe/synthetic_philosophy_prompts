  For the dad's case, I need to explain that exemption applies due to frontal lobe damage impairing impulse control. But Strawson doesn't demand complete objectivity. The family can oscillate between attitudes, grieving the loss while managing practical care. The user probably needs permission to feel hurt while understanding their dad's condition. Emphasizing the spectrum of responses rather than a binary choice might address their unspoken guilt and conflict.

  Also, the user mentioned the pessimist's libertarian free will argument. Strawson counters that our natural reactions aren't based on metaphysical freedom but on our social practices. So even without free will, resentment makes sense in relationships unless exemptions apply. This distinction shows why "he didn't mean it" (excuse) keeps the relationship intact, while "he's not himself" (exemption) changes it fundamentally.

