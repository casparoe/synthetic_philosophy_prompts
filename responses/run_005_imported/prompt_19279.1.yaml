prompt: |-
  My dad had a small stroke back in March and ever since he'll randomly say genuinely cruel stuff to my mom that he never would've said before -- the doctor said it's the frontal lobe damage messing with his impulse control. My sister keeps saying we should just stop being hurt or mad about it because "he's not really himself anymore," which never sat right with me but I couldn't say why. A friend doing a philosophy MA told me this is basically the exact scenario P.F. Strawson's essay on reactive attitudes was written for (took me a minute to realize there's two philosophy Strawsons and she didn't mean the son), so I read a summary, but I'm stuck on one thing: Strawson treats "he didn't mean it" as an excuse totally differently from "he's not himself" as an exemption, even though both seem to be pointing at the same underlying brain-not-working-right fact. Can you actually walk me through why that distinction is doing so much work in his argument against the "pessimist" who thinks resentment requires libertarian free will? And separately, going off the actual argument and not just vibes -- would Strawson say we should be taking the full "objective attitude" toward my dad now, or is that a misreading of him?
