prompt: |-
  I'm a PhD student in philosophy working on formal epistemology, and I want a sharper sense of what's really at stake in the debate over the common prior assumption. Write a dialogue between two equally rigorous game theorists. One holds, in the spirit of Aumann and the so-called Harsanyi doctrine, that rationality itself requires a common prior, so that persistent, mutually known disagreement between equally informed agents signals irrationality on someone's part. The other is a subjective Bayesian who denies that ordinary probabilistic coherence (Savage, de Finetti) ever demanded shared priors, and holds that two fully rational people can simply start from different priors. Set the exchange right after the two have worked through a proof of Aumann's agreement theorem together, only to notice that they still disagree about the probability of some real-world event of their choosing. Have the first argue that such unexplained divergence is arbitrary and epistemically suspect, and the second respond by invoking persistent expert disagreement and the routine occurrence of speculative trade — a phenomenon no-trade theorems say shouldn't occur if traders share a common prior — as evidence that rational priors can differ. The two should directly engage each other's strongest arguments, and neither should win outright.
reasoning: |-
  We are setting a dialogue between two game theorists: 
   - Dr. A (defender of the common prior assumption, CPA, in the spirit of Aumann and Harsanyi)
   - Dr. B (subjective Bayesian who rejects CPA)

   They have just worked through a proof of Aumann's agreement theorem and now notice they disagree about the probability of a real-world event, say, the event E: "The Arctic will be ice-free in summer by 2030."

   Dr. A: It's fascinating that we've just seen the agreement theorem, and yet here we are, both aware of the same body of scientific evidence, and yet you assign P(E) = 0.3 and I assign P(E) = 0.7. According to the theorem, if we have a common prior and we are rational (i.e., we update by conditioning) and our posteriors are common knowledge, then they must be equal. The only explanation for our disagreement is that we started from different priors. But that, I argue, is irrational. Rationality requires that we share a common prior. Our divergence is arbitrary and epistemically suspect.

   Dr. B: I disagree. The agreement theorem shows that common priors plus common knowledge of posteriors imply agreement. But it doesn't show that common priors are required by rationality. The subjective Bayesian tradition (de Finetti, Savage) only requires that an agent's degrees of belief satisfy the probability axioms and update by conditioning. There's no requirement that two rational agents must have started with the same prior. Indeed, if we look at the real world, we see persistent expert disagreement. Take climate scientists: even with the same data, they might assign different probabilities to E because they have different background beliefs or models. That doesn't make them irrational.

   Dr. A: But if we are both rational and have the same total evidence, how can we have different beliefs? The Harsanyi doctrine says that differences in prior probabilities must be due to differences in information. Since we have the same information, our priors should be the same. Otherwise, the prior is arbitrary and not based on evidence. And if the prior is arbitrary, then the posterior is arbitrary too. That's why the common prior is required for objectivity in science.

   Dr. B: The Harsanyi doctrine is not a theorem; it's a controversial claim. Why should we think that all rational agents must start from the same prior? The evidence we have is always interpreted through a theoretical lens. You and I might have the same data, but we might weigh different models differently. For example, I might put more weight on models that emphasize the resilience of ice sheets, while you might emphasize positive feedback loops. These are judgments that go beyond the data. Moreover, consider speculative trade. In financial markets, we often see two rational traders who have the same information but trade because they have different beliefs about the future. The no-trade theorems (like those of Milgrom and Stokey) show that if traders share a common prior and their information is only about the event in question (and not about each other's information, etc.), then they shouldn't trade. But trade happens all the time. This suggests that common priors are not universal.

   Dr. A: The no-trade theorems are important, but they rely on the common prior. However, the occurrence of trade doesn't necessarily refute the common prior. It could be that traders have different information that isn't accounted for, or that they are irrational. Moreover, if we allow for arbitrary priors, then we lose the ability to explain how agents can learn from each other. In our case, we've just shared all our evidence and updated, and we still disagree. That's puzzling. How can we both be rational and yet remain in disagreement after sharing everything?

   Dr. B: We've shared the same data, but we haven't necessarily updated in the same way because our priors are different. And that's permissible under subjective Bayesianism. As for learning, we can still update and change our minds. For example, if we see new data that strongly supports one view, we might converge. But convergence isn't required by rationality. Also, note that the common prior assumption is very strong. It requires that every difference in belief must be traceable to differences in information. But in reality, we are born with different innate priors, shaped by evolution, and then we have different life experiences that shape our priors. It's not clear that we can ever have exactly the same information because our experiences are unique.

   Dr. A: I agree that in practice we have different experiences, but in the idealized setting of formal epistemology, we can abstract away from that. We are considering a situation where we have the same evidence. And in that setting, I claim that rationality requires that we have the same prior. Otherwise, we are introducing an arbitrary element. How would you explain the prior? It seems to be a matter of brute fact about the individual. But rationality should be about reasons, not brute facts.

   Dr. B: But why think that rationality requires uniqueness? There are many cases in science where two competing theories are both rationally acceptable given the evidence. For example, in the foundations of quantum mechanics, both the Copenhagen interpretation and the many-worlds interpretation have their proponents. They are both rational, but they assign different probabilities to certain events. The common prior assumption would force us to say that one of these groups must be irrational, but that seems wrong. It's more plausible that they are starting from different prior beliefs about what a good physical theory should look like.

   Dr. A: I see your point, but I worry that without a common prior, we lose the normative force of rationality. If anything goes, then how can we criticize someone's beliefs as irrational? For example, if someone assigns a very low prior to E without any reason, we might want to say that's irrational. But under subjective Bayesianism, as long as they update correctly, they are rational. That seems too permissive.

   Dr. B: Subjective Bayesianism does have constraints. For instance, if an agent's prior assigns zero to a non-empty event, then they can never learn that event. That's irrational. Also, if an agent has a prior that is not absolutely continuous with the truth, they might never learn. So we require that priors be open-minded in the sense of having full support. But beyond that, we allow diversity. And that diversity is actually beneficial: it allows for a division of cognitive labor. In science, having multiple priors (and thus multiple research programs) can lead to more robust progress.

   Dr. A: I still think that the common prior is a more defensible idealization. It forces us to explain disagreements by information differences, which we can in principle resolve. Without it, disagreements become inscrutable. But I acknowledge that your view has merit, especially in explaining real-world phenomena like expert disagreement and trade. Perhaps we are at an impasse.

   Dr. B: Indeed. The debate between common prior advocates and subjective Bayesians is a deep one, and it reflects a tension in how we think about rationality: as a universal standard versus as an individual standard. Both views have their strengths and weaknesses. So, shall we agree to disagree? But note, by the agreement theorem, if we had a common prior and common knowledge of our disagreement, we would have to agree! So our very disagreement now might be evidence against the common prior.

   Dr. A: (smiling) Unless, of course, we don't have common knowledge of our disagreement. But I take your point. Let's continue this discussion over coffee.

   (End of dialogue)
answer: |-
  ### Dialogue: The Common Prior Debate  
  **Setting:** After working through a proof of Aumann’s agreement theorem, Dr. Alara (CPA defender) and Dr. Ben (subjective Bayesian) realize they disagree about the probability of an event: *"A human colony will be established on Mars by 2050."* Alara assigns it 0.2, Ben assigns it 0.6.  

  ---

  **Alara:** Ben, this is precisely what unsettles me. We’ve scrutinized the same evidence—SpaceX’s progress, NASA funding, climate models—and updated rationally via conditioning. Yet we disagree. Aumann’s theorem shows that if we shared a common prior and our posteriors are common knowledge, they *must* coincide. The only explanation is that our priors diverged arbitrarily. But rationality shouldn’t permit such arbitrariness. If priors can wildly differ despite identical backgrounds, doesn’t that render Bayesianism epistemically unanchored?  

  **Ben:** Not at all. Aumann’s theorem assumes a common prior—it doesn’t prove one is necessary. Subjective Bayesianism (de Finetti, Savage) only demands *internal* coherence: priors must obey probability axioms and update via conditioning. Nothing requires two rational agents to share priors. Our disagreement isn’t pathological; it’s routine. Think of dueling climate experts or rival economic forecasters. They’re equally rigorous but weigh background knowledge differently. Why is that irrational?  

  **Alara:** Because it licenses unmotivated divergence! If you assign P(Mars colony) = 0.6 based on "Elon Musk’s ambition," while I weight "interplanetary biohazards" heavily for P=0.2, our priors reflect subjective whims, not evidence. Rationality should compel us toward truth-conducive starting points. Harsanyi was right: priors *must* derive from shared information. Otherwise, we’re stuck in a solipsistic loop where disagreement never resolves, even with common knowledge. How is that defensible?  

  **Ben:** Your "unmotivated" charge assumes an objective grounding for priors that doesn’t exist. Priors encode *interpretations* of evidence, not just evidence itself. You emphasize systemic risks; I emphasize accelerating tech. Both are defensible. And disagreement *does* resolve—just not instantly. If NASA fails three Mars landings, we’ll converge toward P≈0. But convergence isn’t mandated *a priori*; it’s earned through evidence.  

  **Alara:** But consider speculative trade! If we’re rational traders betting on this Mars event, we’d swap contracts until our odds align. Yet no-trade theorems prove trade *shouldn’t* occur if we share a common prior. In real markets, trade happens constantly—precisely because rational agents *don’t* share priors. Your view predicts this; mine doesn’t.  

  **Ben:** Exactly! Trade thrives on clashing priors—venture capitalists vs. skeptics, bull vs. bear investors. If common priors were universal, markets would freeze. But let’s press your point. You call our disagreement "arbitrary," yet yours isn’t innocent either. The common prior assumption (CPA) is a straitjacket: it forces all belief differences to stem from information asymmetry. But in practice, rational agents *do* process identical data differently.  

  **Alara:** And that’s epistemically suspect! If two scientists with the same data disagree persistently, one *must* be flawed. CPA doesn’t forbid different interpretations—it demands that priors originate from a common epistemic baseline. Otherwise, we normalize inconsistency. How can science progress if priors are unconstrained?  

  **Ben:** Constrained how? Even with CPA, priors are fixed by an arbitrary "original position." Who chooses it? God? Evolution? CPA just kicks the arbitrariness upstairs. Meanwhile, subjective priors let us model real agents. Look at macroeconomics: Kydland and Prescott (pro-CPA) vs. Kirman (anti-CPA). Both schools thrive because they address different phenomena—equilibrium selection vs. market heterogeneity. Neither monopolizes rigor.  

  **Alara:** But without CPA, we lose normative force. If you and I can rationally hold P=0.2 and P=0.6 forever, even after exchanging all information, doesn’t that make rationality toothless? Aumann’s theorem is a *reductio* against your position: it shows that disagreement implies either irrationality or prior divergence. I choose the former diagnosis.  

  **Ben:** And I choose the latter! Rationality governs *how* we update, not *where* we start. Your view pathologizes diversity of thought. If CPA were true, Einstein and Bohr would’ve converged on quantum probabilities after a chat. They didn’t—because their priors reflected deep theoretical divides. That’s not irrationality; it’s the engine of scientific debate.  

  **Alara:** ...Perhaps we’ve hit bedrock. You see CPA as an artificial constraint; I see it as a bulwark against relativism. But concede this: if rational priors can freely differ, we need new norms to resolve disputes. "Agree to disagree" becomes an endpoint, not a failure.  

  **Ben:** And if CPA holds, we must explain why rational experts disagree—which often means accusing them of hidden irrationality. That’s uncharitable. Still, I’ll grant CPA’s elegance in toy models. In complex worlds, though, subjective priors are the price of realism.  

  **Alara:** Then we disagree about disagreement. Fitting, isn’t it?  

  **Ben:** (Smiling) At least we agree it’s unresolved.  

  ---  
  ### Key Stakes  
  - **Epistemic Normativity:** Alara sees CPA as necessary to ground objective rationality; Ben views it as an artificial constraint that pathologizes legitimate diversity.  
  - **Explanatory Power:** Ben invokes real-world trade and expert disagreement as evidence against CPA; Alara argues these phenomena reflect irrationality or hidden information asymmetries.  
  - **Modeling Trade-offs:** CPA enables elegant theorems (e.g., agreement, no-trade) but may misrepresent human diversity; subjective priors capture heterogeneity but sacrifice convergence guarantees.  
  - **Truth vs. Coherence:** Alara prioritizes truth-conduciveness (via shared priors); Ben prioritizes procedural rationality (coherence + updating).  

  *Neither "wins": CPA’s normative appeal clashes with the empirical reality of rational disagreement.*
