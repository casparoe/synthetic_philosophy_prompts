  ### Justification per item:
  - **Variance Voting (S-tier)**: Best balance—handles scaling issues via variance normalization, mitigates fanaticism, uses cardinal data, and remains computationally feasible. Most defensible for real orgs needing structured aggregation.
  - **The Borda Rule (A-tier)**: Highly tractable and immune to intertheoretic comparisons/fanaticism by using only ordinal rankings. Loses cardinal intensity data, but pragmatic for resource-constrained actors.
  - **My Favourite Theory (C-tier)**: Simple and tractable but ignores moral uncertainty entirely—risky for orgs with distributed credences (e.g., 55% Theory A vs. 45% Theory B).
  - **The Moral Parliament (C-tier)**: Metaphorically rich for compromise but underspecified and intractable in practice; bargaining dynamics invite arbitrariness/strategic behavior.
  - **Maximize Expected Choiceworthiness (D-tier)**: Theoretically elegant but collapses under intertheoretic comparison problems. Highly vulnerable to fanaticism (e.g., tiny-credence theories dominate) and scaling arbitrariness.
