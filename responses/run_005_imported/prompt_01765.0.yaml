prompt: |-
  Ok this has been rattling around in my head since I went back and reread Bostrom's old "Moral uncertainty – towards a solution?" post on Overcoming Bias, the one where he first pitches the Parliamentary Model as basically a metaphor rather than a fully worked out theory. That sent me down a rabbit hole into the actual MacAskill/Bykvist/Ord book on the topic, which formalizes a handful of competing proposals for what you're supposed to *do*, action-wise, once you admit you're not 100% sure which moral theory is correct. Brought it up in a rationalist-adjacent discord i'm in and nobody could agree on which of these is actually the least-bad option, so figured i'd get a second opinion from you.

  Can you rank the following five approaches to acting under moral uncertainty, tier-list style: (1) My Favourite Theory – you just figure out which single theory you find most credible and act on that, full stop, ignoring the others; (2) Maximize Expected Choiceworthiness – treat your credences over theories like probabilities and each theory's "choiceworthiness" ratings like utilities, then maximize the expectation (this requires biting the bullet on intertheoretic comparisons of choiceworthiness, which a lot of people think is basically incoherent); (3) The Moral Parliament – Bostrom & Ord's proposal where each theory gets delegates proportional to your credence in it and the delegates bargain and vote on what to do; (4) Variance Voting – rescale each theory's choiceworthiness function so its variance across the options on the table equals every other theory's, then take the credence-weighted sum; and (5) The Borda Rule – throw out cardinal info entirely and combine only each theory's ordinal ranking of the options, ala a Borda count. Rank them by how good you think they'd actually be as a decision procedure a real person or org (like an EA charity) could use — weigh philosophical defensibility against tractability and resistance to weird edge cases/fanaticism. Give me the answer as JSON, tiers S through D (multiple approaches per tier is fine, and so is leaving a tier empty), formatted like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  A one-liner of justification per item is fine if it helps you think it through, but the tier placements are the main thing I'm after.
reasoning: |-
  We are ranking five approaches to acting under moral uncertainty. The criteria include philosophical defensibility, tractability, resistance to edge cases and fanaticism, and overall practicality for a real person or organization (like an EA charity).

  The five approaches:
  1. **My Favourite Theory (MFT)**: Pick the single moral theory you find most credible and act solely on that, ignoring others.
  2. **Maximize Expected Choiceworthiness (MEC)**: Treat credences as probabilities and each theory's choiceworthiness as utilities, then maximize the expected choiceworthiness. Requires intertheoretic comparisons (which may be problematic).
  3. **Moral Parliament (MP)**: Each theory gets delegates proportional to credence; they bargain and vote to decide actions.
  4. **Variance Voting (VV)**: Rescale each theory's choiceworthiness so that the variance across options is equal for every theory, then take the credence-weighted sum.
  5. **Borda Rule (BR)**: Ignore cardinal information; combine only ordinal rankings (using a Borda count).

  Tiers:
  - S: Best overall: robust, defensible, practical.
  - A: Good, but with some drawbacks.
  - B: Moderate, with notable issues.
  - C: Problematic, but perhaps usable in some contexts.
  - D: Worst, with severe flaws.

  Analysis:

  1. **MFT (My Favourite Theory)**:
     - Pros: Simple, tractable, avoids intertheoretic comparison. If one theory is clearly dominant, it's straightforward.
     - Cons: Ignores other theories entirely. If the credence in the favorite theory is only 51%, then 49% of moral weight is ignored. This seems irrational and can lead to bad outcomes when the second-best theory has important differences.
     - Tractability: Very high.
     - Resistance to edge cases: High because it's simple, but it might lead to fanaticism if the favorite theory is extreme.

  2. **MEC (Maximize Expected Choiceworthiness)**:
     - Pros: Theoretically appealing as an extension of expected utility to moral uncertainty. Accounts for all theories by their credence.
     - Cons: Requires intertheoretic comparisons of choiceworthiness, which is controversial and may be incoherent (how to compare "utils" across theories?). Also, it can be sensitive to the scaling of choiceworthiness and might lead to fanaticism (a tiny probability of an extremely high-stakes theory dominating).
     - Tractability: Moderate, but requires a way to make intertheoretic comparisons and compute expectations.
     - Edge cases: Vulnerable to fanaticism and scaling issues.

  3. **MP (Moral Parliament)**:
     - Pros: Metaphorically appealing; allows for compromise and bargaining, which might reflect how we think about moral disagreements. Avoids direct intertheoretic comparisons by delegating to a political process.
     - Cons: The bargaining process is underspecified and might be arbitrary. It could lead to strategic voting and unclear outcomes. Also, it's not very tractable because we don't have a clear model of how the parliament would operate.
     - Tractability: Low, as it requires simulating a complex negotiation.
     - Edge cases: Might avoid some fanaticism by requiring compromise, but the process itself might be gamed.

  4. **VV (Variance Voting)**:
     - Pros: Addresses the scaling problem by normalizing the variance of each theory's choiceworthiness. This makes the intertheoretic aggregation more meaningful. It accounts for all theories and avoids the fanaticism of MEC to some extent.
     - Cons: The normalization (equal variance) is arbitrary and may not reflect the true importance of differences in choiceworthiness. It also requires cardinal information and intertheoretic comparisons (though less than MEC).
     - Tractability: Moderate, as it requires rescaling and then summing.
     - Edge cases: More robust than MEC to scaling, but still relies on cardinal information and may have edge cases in normalization.

  5. **BR (Borda Rule)**:
     - Pros: Only uses ordinal information, so it avoids the intertheoretic comparison problem entirely. Simple and democratic.
     - Cons: Throws away cardinal information, which can be important. For example, if one theory says option A is only slightly better than B, but another says A is vastly better, the Borda count would treat both as a single rank difference. This might lead to suboptimal decisions when the intensity of preference matters.
     - Tractability: High, as it only requires rankings and is easy to compute.
     - Edge cases: Less vulnerable to fanaticism because it discards cardinal magnitudes, but might ignore important information.

  Ranking:

  - **S Tier**: None of these are perfect, but I think **Variance Voting** might be the best compromise. It addresses the scaling issue of MEC and is more tractable than the Moral Parliament. It uses more information than Borda. However, it's not without flaws.

