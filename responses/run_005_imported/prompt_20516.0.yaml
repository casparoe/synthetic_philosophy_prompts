prompt: |-
  So I've been chewing on this for my philosophy of religion seminar - what do you reckon Wittgenstein would've made of the New Atheists (Dawkins, Dennett, Hitchens)? Their whole schtick is treating "does God exist" as basically a scientific hypothesis that's been tested and found wanting, kind of like Dawkins' "God Hypothesis" stuff in The God Delusion, but that's pretty much exactly the framing Wittgenstein spends his lectures on religious belief attacking, he keeps insisting that calling someone's belief in the Last Judgement "unreasonable" misunderstands what that belief is even doing grammatically in a persons life. So if he'd actually sat down and read something like The God Delusion, would he side with believers against Dawkins, or does his view end up just as awkward for traditional apologetics as it is for the New Atheists? Try to engage with specifics from the actual lectures rather than just waving at "language games" and "forms of life" like everyone does.
