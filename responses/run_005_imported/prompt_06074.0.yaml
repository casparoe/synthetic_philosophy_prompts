     Assessment: This is a valid distinction. The ongoing duty of coordination does not necessarily imply a duty to continue the activity indefinitely. However, in the context of an ongoing joint activity, it is common to expect an exit announcement to allow the other party to adjust. Moreover, Renata's point in move (3) was about the mutual adjustment during the activity, and if Oskar was still participating (even at a reduced level) without communicating, then he was breaking the adjustment mechanism. But if he was stopping, then an announcement would be expected. Oskar's argument that there is no standing duty to remain is correct, but the issue is about the manner of exit (silently reducing without notice) and whether that violates the implicit norms.

