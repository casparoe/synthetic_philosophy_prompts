prompt: |-
  I've been falling down a total rabbit hole this week for a piece on precommitment devices — the whole "Ulysses contract" thing — and the more I read the more I think people (me included, historically) throw that phrase around way to loosely. Elster's own position actually shifts across his two books on it: in "Ulysses and the Sirens" he's pretty into the metaphor, but by the time of "Ulysses Unbound" years later he's practically taking it back apart, pointing out that Odysseus binding Odysseus — same guy, continuous memory, knows exactly what temptation he's protecting against — is a very different animal from, say, one generation of voters entrenching a rule against a totally different set of people fifty years on. That distinction, one continuous agent using foresight to restrain its own predictable future self versus something else wearing the same costume, is what I want to actually test out on you rather than just take on faith from the secondary literature.

  So: below are nine things that get called (or plausibly could be called) "Ulysses contracts." Rank them by how faithfully each one actually reproduces Odysseus-at-the-mast logic, as opposed to doing some other job entirely — entrenching one group's preferences against a future group with different membership, solving a coordination problem, signalling credibility to outsiders, or just dead-hand control dressed up nicer. The nine: (1) a psychiatric "Ulysses contract," where a patient with bipolar disorder pre-authorizes involuntary hospitalization for a future manic episode; (2) the oath Lycurgus reportedly got the Spartans to swear, to keep his laws unchanged until he returned from Delphi (he made sure never to); (3) Germany's Article 79(3) "eternity clause"; (4) India's basic structure doctrine from Kesavananda Bharati; (5) the US Constitution's entrenchment, via Article V, of every state's equal suffrage in the Senate; (6) Section 4 of the 25th Amendment, on presidential incapacity; (7) statutory independence for central banks; (8) legislative sunset clauses; and (9) Cortes supposedly burning his own ships at Veracruz.

  Give me your answer as a JSON object with five tiers, S down to D, where S means "basically the real thing, just relocated" and D means "not meaningfully a Ulysses contract at all, whatever people call it," formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  You can put more than one item in a tier. After the JSON, add two or three sentences on whichever single placement you were genuinely torn about, and why.
