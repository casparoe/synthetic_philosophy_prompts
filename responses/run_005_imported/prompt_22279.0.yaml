    - (9) Cortes burning ships: same group, continuous, binding against a known temptation (retreat). It's a collective version.

  - **A Tier (close but with some deviation)**:
    - (6) 25th Amendment, Section 4: It's a system to handle a known risk (incapacity) and was designed by the same political body to bind its own future actions (the presidency). However, the binding is done by others (Vice President, Cabinet) on the President, so it's not the same agent binding themselves. But the President is part of the system and the amendment was made by the same continuous entity (the United States via constitutional amendment) to protect against a risk. It's a bit of a stretch for self-binding but closer than the others.

  - **B Tier (some elements but not the core)**:
    - (8) Sunset clauses: These are precommitments to force future review, but they don't bind the future self to a course of action; they force reconsideration. It's a precommitment to not let the law continue without review, so it's a form of self-binding by the legislature to avoid complacency? But the future legislature is the same continuous body? However, it's not binding against a temptation; it's more about ensuring periodic evaluation.

  - **C Tier (weak resemblance, more about entrenchment)**:
    - (2) Lycurgus oath: It's a trick to bind future generations. The future Spartans are not the same as the ones who swore.
    - (3) Germany's eternity clause: Binds future generations.
    - (4) India's basic structure: Binds future generations.
    - (5) US Senate suffrage: Binds future generations.
    - (7) Central bank independence: Binds future governments.

  - **D Tier (not at all)**:
    - Actually, I don't see any that fit here. The above cover the range.

  But note: The key is continuity of the agent. For collective entities like a state, if we consider the state as a continuous agent, then some of the constitutional ones might be seen as self-binding. However, Elster in "Ulysses Unbound" distinguishes between a continuous agent and a changing one. For example, a nation over time is not a continuous agent because the people change.

  Therefore, only (1) and (9) are clear cases of the same agent(s) binding themselves.

  Let me adjust:

