  - A: (6) because it's a constitutional mechanism designed by the same polity (the US) to handle a risk to itself (presidential incapacity). But the agent acting is not the same as the one bound (the President is bound by others). So it's a collective self-binding but with a separation.

  - B: (8) Sunset clauses: The same legislative body passes a law that will expire, forcing a future version of themselves to reconsider. It's a self-binding to avoid letting laws become outdated without review. But it's not against a temptation; it's more about good governance.

  - C: (2), (3), (4), (5), (7) are all about binding future entities that are not the same.

  But wait, (2) is tricky: The Spartans who swore are binding themselves until Lycurgus returns, and then Lycurgus ensures it's perpetual by not returning. But the initial oath is by the same Spartans who then must live under the laws. However, the trick is to bind future generations. So it's a mix.

