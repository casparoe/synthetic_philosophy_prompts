  I've got some money to donate this year and I'm torn between two charities working in the same refugee camp: one saves the lives of severely malnourished kids who'd otherwise die, the other improves food and schooling for kids who are gonna survive either way so they grow up healthier and do better later on. A friend who's really into effective giving ran the numbers and told me that, dollar for dollar, the life-saving charity produces more total wellbeing, even though the kids it saves will on average end up living harder lives than the ones helped by the other charity. Something about that logic bugs me — like if you followed it all the way, you'd always have to prefer saving a much bigger group of people who'll live so-so lives over a smaller group who'll live amazing ones, just because the total keeps adding up higher. Am I just being squeamish, or is my friends reasoning actually off somewhere?
reasoning: |-
  Okay, the user is struggling with a moral dilemma about charitable donations. They're torn between two charities: one saves lives of severely malnourished children, and the other improves long-term outcomes for children who will survive regardless. Their friend, who's into effective altruism, crunched the numbers and concluded that the life-saving charity produces more total wellbeing per dollar. But this conclusion bothers the user because it seems to prioritize quantity over quality of life.

  The user's core concern seems to be whether wellbeing should be measured purely through utilitarian math (maximizing total units of wellbeing) or if there's something fundamentally different about saving lives versus improving lives. They're intuitively sensing that these might be morally distinct categories, even if the numbers say otherwise.

  Hmm... the friend's position represents classic utilitarian effective altruism - maximizing QALYs (quality-adjusted life years) or similar metrics. But the user is bumping against the philosophical "separateness of persons" problem Rawls described. Saving a life creates an entirely new wellbeing "container" that wouldn't exist otherwise, whereas improving an existing life just fills an existing container more. Utilitarianism treats these as equivalent, but morally they feel different.

  The user also hints at a slippery slope concern - if we always prioritize saving lives regardless of future quality, might we end up creating many miserable lives? The friend's model doesn't seem to account for how saving lives changes the population over time. 

  I should validate that the user's discomfort isn't just "squeamishness" - they're actually identifying real philosophical and practical limitations in pure utilitarian calculus. The numbers might show higher total wellbeing now, but fail to consider downstream effects or the intrinsic value of life quality. 

