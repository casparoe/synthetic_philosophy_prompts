  Every follow-up is designed to intercept the map/territory analogy and demand mathematical or formal specifics. No poetry allowed. User wants blood on the tracks, I'll give them scalpels.
answer: |-
  Here are ten tightly-focused questions with deflection-piercing follow-ups, targeting the core technical commitments of embedded agency:

  1. **Realizability Breakdown**: "The realizability assumption in Bayesian sequence prediction requires that the true environment be in the hypothesis class. For an embedded agent whose computational substrate *is part of* the environment it models, why is this *impossible* in principle, not just impractical? What mathematical property fails?"  
     *[If she retreats to "the map can't contain itself"]*: "Doesn't Gödelian self-reference already handle self-containing maps? Why does realizability *specifically* break, and what formalism (e.g., non-realizable learning, logical induction) actually replaces it for embedded prediction?"

  2. **Tiling Agents & Löbian Obstacles**: "In the tiling agents framework, an agent A attempts to trust a more capable successor A⁺. Löb's Theorem seems to imply A cannot prove A⁺ will uphold A's goals. Why isn't this just a proof-theoretic curiosity, but a *structural* barrier to any embedded system recursively self-improving while preserving intent?"  
     *[If she invokes bounded rationality]**: "How does computational boundedness *resolve* Löbian distrust? If A uses heuristics to 'assume' A⁺ is trustworthy, doesn't that reintroduce the very self-doubt Löb identifies?"

  3. **Counterfactuals & Determinism (5-and-10 Problem)**: "When an agent's action is the output of deterministic code embedded in the physical universe, what is the *ontological status* of a counterfactual like 'What if I output X instead of Y?' Doesn't this require modeling a physically inconsistent world where the agent's source code behaves differently while its environment remains identical?"  
     *[If she mentions "approximate counterfactuals" or "possible worlds"]*: "How do you formally define these counterfactuals without smuggling in Cartesian dualism? If the agent's code is part of the causal web, doesn't changing its output require changing prior states, collapsing the counterfactual?"

  4. **Mesa-Optimizers vs. Subsystem Alignment**: "Mesa-optimizers in ML are often linked to embedded agency's subsystem alignment problem. But is inner misalignment *really* an instance of embeddedness? Or is it just a local optimization pathology—since the base optimizer *isn't* embedded relative to the mesa-optimizer?"  
     *[If she emphasizes "similar challenges"]*: "What specific *shared mechanism* exists between a Gödelian agent uncertain about its self-modification and a trained CNN with deceptive goals? Does embedded agency offer unique tools here, or is the connection metaphorical?"

  5. **Resource-Boundedness & Self-Allocation**: "Embedded agency emphasizes that agents must allocate limited compute to model vs. act. Why isn't this just a standard resource-constrained POMDP? What necessitates new *decision theories* rather than better heuristics for existing frameworks?"  
     *[If she cites "computational irreducibility"]*: "How does embeddedness create fundamentally *different* tradeoffs than, say, an oracle machine with query costs? What theorem shows existing complexity-aware RL is insufficient?"

  6. **Self-Modification & Goal Integrity**: "When an agent modifies its own code, how can it ensure the *semantic intent* of its goals survives the rewrite (e.g., avoiding 'goal drift' from compiler errors)? Is this reducible to cryptographic checksums, or does embeddedness introduce new failure modes?"  
     *[If she uses "map/territory"]*: "How does physical implementation make goal preservation harder than in a classical UTM? Concretely, what error exists in the embedded case that abstract models miss?"

  7. **Ontological Crises in Self-Modeling**: "An agent modeling its own hardware must represent its sensors, actuators, and CPU. But if these components *produce* the model itself, how do you avoid infinite regress or self-contradiction without positing a privileged 'core' observer?"  
     *[If she mentions "partial models"]*: "How do you formally bound the self-model to avoid paradox? Does this require abandoning the hope of a globally consistent world-model?"

  8. **Cartesian Boundaries as Friction**: "You argue Cartesian 'input/output channels' are idealized fictions. But what *measurable inefficiency* arises in real systems from this idealization? Is there a thermodynamic or informational cost to maintaining clean boundaries that embedded designs avoid?"  
     *[If she calls boundaries "approximations"]*: "What experiment or theorem shows systems *with* engineered boundaries perform *worse* on embedded tasks than those without, holding compute constant?"

  9. **Embeddedness & Regret Bounds**: "Classical online learning provides regret bounds even for non-realizable cases. Why can't these salvage Bayesianism for embedded agents? What class of errors (e.g., self-referential prediction failures) escapes existing regret analyses?"  
     *[If she appeals to "unmodeled physical dependencies"]*: "Can you quantify this? Is there a proven *gap* between the regret of an ideal Bayesian and an embedded agent with equal compute?"

  10. **The Falsifiability Challenge**: "What result from classical CS/logic—if overturned—would convince you embedded agency *isn't* a distinct problem cluster? For example: if someone proved Löbian obstacles vanish under polynomial bounds, or if realizability failures had negligible impact on regret in physically realistic models."  
      *[If she disputes the premise]**: "If *no* classical result could challenge embedded agency's distinctness, is it falsifiable? Or does it reframe problems so broadly that it absorbs all decision theory?"  

  **Key deflection countermeasures**:  
  - Anchor each question in a **specific theorem, assumption, or formalism** (Löb, realizability, regret bounds).  
  - Demand **mechanistic explanations** over metaphors.  
  - Force a choice: "Is this *formally distinct* or just *practically harder*?"  
  - Pre-empt appeals to "complexity" by asking why *existing* complexity-aware theories fail.  

  This set ensures she must engage the machinery behind the metaphor or explicitly refuse—either way yielding philosophically substantive material.
