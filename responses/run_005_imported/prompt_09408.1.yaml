prompt: |-
  So in my American Political Thought class we just spent two lectures on Frederick Douglass's break with Garrison over the Constitution, and now I've got a short paper due on it and I honestly can't decide what I think, which is stressing me out a little. Quick background in case its relevant: Garrison and Phillips held that the Constitution is, as Garrison famously put it, "a covenant with death and an agreement with hell," pointing to the three-fifths clause, the fugitive slave clause, and the 1808 migration/importation clause as proof the document is pro-slavery at its core, which is why Garrisonians refused to vote or hold office under it. Douglass agreed with basically all of that for years, but sometime around 1851 (people credit/blame Gerrit Smith and Lysander Spooner for this) he flipped completely and started arguing that read strictly by its actual text -- setting aside the framers' private intentions and how the thing got used in practice -- the Constitution names no one a slave and requires nothing of the sort, making it, in his words, a "glorious liberty document." My roommate thinks this is obviously just motivated reasoning on Douglass's part (he needed a Constitution he could work within once he broke from the Garrisonians politically) and that Garrison's reading is the more honest one, but I'm not so sure.

  Can you write out the actual argument for me and take a side -- is Douglass's purely textual reading of the Constitution as anti-slavery defensible, or is Garrison right that fixating on the bare wording while ignoring the document's structure, compromises, and history amounts to willful blindness? Please actually deal with the three clauses above instead of staying abstract, and also weigh in on whether the interpretive principle Douglass is leaning on -- roughly, that ambiguous legal language shouldn't be read as sanctioning oppression when a liberty-preserving reading is available -- is a legitimate general principle for reading founding documents or just something he needed to believe to keep organizing politically. And please actually pick a side; my professor docks points for wishy-washy "both sides have merit" conclusions.
