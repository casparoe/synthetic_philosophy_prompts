prompt: |-
  Ok so I went down a total rabbit hole this week after a friend mentioned that Hobbes spent like two decades insisting he'd squared the circle, and getting absolutely wrecked for it by this Oxford mathematician named Wallis. That sent me back to Leviathan for the first time since undergrad, to see what Hobbes himself actually says about geometry, and I got stuck on this bit (chapter 4 or 5, i don't remember which anymore):

  "Seeing then that truth consisteth in the right ordering of names in our affirmations, a man that seeketh precise truth had need to remember what every name he uses stands for, and to place it accordingly; or else he will find himself entangled in words, as a bird in lime-twigs, the more he struggles the more belimed. And therefore in geometry (which is the only science that it hath pleased God hitherto to bestow on mankind), men begin at settling the significations of their words; which settling of significations, they call definitions, and place them in the beginning of their reckoning."

  I follow the birdlime part fine, but two things are getting me: why does he think geometry is the ONLY science, like did he really mean that literally, and what's "reckoning" doing in that last line, is that just a fancy synonym for defining your terms or is he actually claiming reasoning itself is some kind of calculation? Feel like theres a bigger argument in here that i'm only half seeing.
