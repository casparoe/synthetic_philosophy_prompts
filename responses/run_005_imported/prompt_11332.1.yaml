  Here’s the strongest possible case for reading Sidgwick’s psychical research as a rational, philosophically motivated response to the dualism of practical reason, directly addressing your core questions:

  ### The Core Argument: Psychical Research as Sidgwick's Empirical Solution to a Rational Crisis

  1.  **The Existential Stakes of the Dualism:**
      *   Sidgwick didn't merely *identify* a theoretical tension; he diagnosed a potential **fatal flaw** at the heart of rational ethics. If both egoism (maximizing one's own happiness) and utilitarianism (maximizing universal happiness) are equally self-evident and rational, yet potentially conflict, then "Practical Reason" is fundamentally divided. Morality loses its *rational authority* whenever it demands genuine self-sacrifice.
      *   As Sidgwick himself starkly put it in *Methods*: "The whole system of our beliefs as to the intrinsic reasonableness of conduct must fall, without a hypothesis unverifiable by experience reconciling the Individual with the Universal Reason." This wasn't academic curiosity; it was a crisis threatening the rational foundation of his life's work.

  2.  **Sidgwick's Empiricist Commitments Forbid Kantian Postulates:**
      *   **Against "Faith":** Sidgwick was a deeply committed empiricist and utilitarian. Kant's postulates (God, Freedom, Immortality) were acts of *faith* required by the structure of pure practical reason *within a deontological framework*. Sidgwick rejected this approach:
          *   **Methodological Rigor:** His entire *Methods* project was an attempt to systematize ethics through careful analysis of common-sense morality and rational intuition, grounded in experience. Introducing an unverifiable postulate would violate this rigorous, empirical-scientific spirit.
          *   **Utilitarian Demands:** Utilitarianism is consequentialist; it requires *actual* outcomes to be calculable. Postulating an afterlife or divine justice without evidence is wishful thinking, not a rational basis for calculating the *actual* promotion of universal happiness. It offers no proof that self-sacrifice *in this life* actually leads to greater universal good *in reality*.
          *   **The "Ought Implies Can" Problem:** For Sidgwick, the rational *obligation* to be utilitarian hinges on it being *possible* to reconcile duty and self-interest *in practice*. If the universe is fundamentally structured such that they *never* coincide, then the utilitarian "ought" loses its force for a rational egoist. He needed evidence this wasn't the case.

  3.  **Why Empirical Evidence? The Structure of the Needed Solution:**
      *   Sidgwick's dualism posed a problem about **the fundamental structure of reality in relation to rationality and morality**. The question was: *Does the universe guarantee that acting morally (utilitarianly) is ultimately consistent with rational self-interest?*
      *   **Only two types of evidence could potentially resolve this:**
          *   **Metaphysical Proof:** A purely rational demonstration of a harmonizing principle (like God or karma). Sidgwick found no such proof; his rational intuitionism led him to an impasse.
          *   **Empirical Evidence of a Moral Order:** Evidence that the universe *is* structured to ensure harmony. This is where psychical research enters. Sidgwick sought evidence for:
              *   **Survival of Death:** An afterlife opens the possibility of rewards/punishments or a broader perspective where self-sacrifice is compensated.
              *   **A Benevolent Intelligence/Providence:** Evidence of telepathy, spirits, or a non-material realm *governed by moral laws* could suggest a universe designed to align duty and self-interest.
              *   **Karmic Principles:** Evidence for phenomena suggesting a moral ordering of consequences beyond the visible (though this was less central than survival/providence).
      *   **Psychical Research was the ONLY Empirical Avenue:** In late 19th-century science, psychical research was the only field seriously investigating phenomena that *might* provide empirical hints about the ultimate nature of consciousness, the possibility of survival, and the existence of non-physical agencies or laws. Sidgwick, the empiricist, felt compelled to investigate this frontier precisely because it was the *only conceivable empirical route* to resolving his foundational philosophical problem.

  4.  **Addressing the "Ghosts vs. Normativity" Objection:**
      *   **The Objection:** Normative claims (about what we *ought* to do) cannot be derived from empirical facts (about ghosts or telepathy). How can evidence of an afterlife *prove* egoism and utilitarianism are rationally reconciled?
      *   **The Sidgwickian Response:**
          *   **Not Deriving "Ought" from "Is":** Sidgwick isn't trying to derive the *normative force* of utilitarianism *from* empirical facts about spirits. He already believes in the normative force of utilitarianism based on rational intuition. The problem is its *practical authority* in the face of egoism.
          *   **Resolving the Contradiction by Revealing Harmony:** The empirical evidence seeks to demonstrate that the *conditions of reality* are such that the *apparent* conflict between the two rational axioms is *illusory*. If survival of death with a moral governance is proven, then:
              *   Acting morally *in this life* becomes demonstrably consistent with long-term self-interest (e.g., heavenly reward, karmic balance, ultimate fulfillment in a larger existence).
              *   The egoist axiom isn't refuted; its scope is expanded. True self-interest *encompasses* moral action within a providentially ordered universe.
              *   Thus, the *practical contradiction* dissolves. The rational egoist, understanding the true structure of reality (including an afterlife with consequences), would see that utilitarian action *is* the path to their own greatest happiness. The normative authority of utilitarianism is secured *for a rational agent* by removing the empirical ground for egoistic rebellion.
          *   **Bridging the Gap:** Empirical evidence of survival/providence acts as the *missing premise* needed to reconcile the two axioms within a single, coherent system of rational action. It doesn't create the "ought," but it removes the empirical obstacle preventing the "ought" (utilitarianism) from binding the rational egoist.

  5.  **Evidence of Sidgwick's Own Rationale:**
      *   **His Writings:** Sidgwick explicitly linked his philosophical despair over the dualism to his psychical research. In letters and discussions, he stated his hope was to find evidence that might provide a "solid basis" for ethical belief or relieve the "deeply felt want of harmony between Duty and Happiness."
      *   **The SPR's Founding Mission:** The SPR wasn't founded to dabble in the occult. Its stated purpose was rigorous, scientific investigation of phenomena that *might* provide evidence for human survival after death. Sidgwick, as President, framed this as a profoundly serious intellectual and potentially moral endeavor.
      *   **The Blavatsky Exposure:** This wasn't mere debunking for its own sake. It exemplified the *rigorous empirical method* Sidgwick demanded. Eliminating fraud was essential to finding any *genuine* evidence that could bear philosophical weight. It underscores the seriousness and empirical discipline he brought to the search.

  **Conclusion: The Integrated Argument**

  Sidgwick's psychical research was not a biographical footnote nor a mere hobby. It was the **direct, rational, and necessary empirical corollary** to the crisis he identified in *The Methods of Ethics*. Faced with the devastating possibility that Practical Reason might be fundamentally schizophrenic, rendering morality rationally unstable, and constrained by his own empiricist and utilitarian commitments that forbade Kantian leaps of faith, Sidgwick turned to the only conceivable empirical avenue: investigating claims about the survival of consciousness and the potential existence of a non-physical, morally ordered reality. His aim was not to derive "ought" from "is," but to empirically verify whether *reality itself* was structured in a way that resolved the apparent contradiction between the rational demands of self-interest and universal good. Evidence of an afterlife or benevolent providence would demonstrate that true self-interest *encompassed* moral duty, thereby restoring the rational authority of utilitarianism over the whole self. The decades of meticulous, often disillusioning work with the SPR were the arduous, philosophically driven attempt of one of history's most scrupulous ethicists to find empirical grounding for the rational harmony he desperately needed to believe the universe provided. His psychical research was, therefore, not separate from his "real" philosophy; it was its desperate, empirical lifeline.

  **Strengthening Your Essay:**

  *   **Quote Sidgwick:** Use his own words lamenting the dualism and expressing hope for empirical support.
  *   **Contrast with Kant:** Explicitly detail *why* Sidgwick couldn't adopt the Kantian solution.
  *   **Detail SPR Methods:** Emphasize the rigor, skepticism, and focus on survival evidence in the SPR's early work under Sidgwick.
  *   **Acknowledge Failure/Skepticism:** Sidgwick largely *failed* to find conclusive evidence. You can argue this deepened his melancholy ("rational pessimism") but doesn't negate the philosophical *motivation* for the search.
  *   **Engage Secondary Sources:** Scholars like Bart Schultz (*Henry Sidgwick: Eye of the Universe*), David Phillips, and J.B. Schneewind have written extensively on this connection. Engaging with them strengthens your case.

  This argument positions Sidgwick's psychical research as an integral, rationally motivated component of his ethical project, born directly from the deepest problem in his masterwork. Good luck with your EE!
