  **Why S-Tier solutions work best**:  
  - **Symmetric bargaining (e.g., ROSE values)** eliminates the first-mover advantage by design, making commitment timing irrelevant since outcomes depend only on game symmetries.  
  - **Staying bad at self-modification** removes the *capability* to race entirely by preventing irreversible commitments, forcing cooperative solutions.  

  **Why F-Tier is worst**:  
  - **Full updateless decision theory** is the *epitome* of the commitment race problem – it demands extreme upfront commitment before value uncertainty resolves, creating catastrophic lock-in risks it claims to solve.
