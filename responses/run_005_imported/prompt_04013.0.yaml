  First, I need to recall the historical context of the Reformation. The Thirty-Nine Articles were part of the Anglican Church's break from Roman Catholicism. The Catholic Church at the time had practices like indulgences, which were tied to the idea of supererogation. The reformers, including Anglicans, opposed this, leading to Article XIV. The key here is the theological view on human capability versus divine grace.

  The user mentioned that supererogatory acts in ethics are seen as going beyond duty, like donating a kidney. But in Reformation theology, the concept of "duty" is different. For reformers, humans can never fulfill all their duties to God because of original sin. Any good deed is only possible through God's grace, so claiming to do more than required implies self-sufficiency, which is arrogant. 

  I should explain the two different frameworks: theological vs. philosophical. In theology, the relationship with God is infinite, so no human action can exceed obligation. In secular ethics, duties are finite and societal, allowing for acts beyond basic obligations. The user needs to see that "required" means different things in each context.

  Also, the user might be grappling with the clash between admiration for heroism and the theological humility required. They might be seeking reconciliation between these views. It's important to highlight that the reformers weren't against heroic acts but against the claim that such acts earn merit before God.

  I should check if there's a deeper need here. The user found this during their grandmother's funeral, so they might be reflecting on mortality, legacy, or the purpose of good deeds. Understanding the theological perspective could provide comfort or clarity about their grandmother's faith and the artifacts she left behind.

