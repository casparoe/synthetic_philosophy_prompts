answer: |-
  That's a profoundly insightful observation, and you're absolutely right to feel the tension. The clash between the Anglican reformers' condemnation of "Works of Supererogation" and modern ethics' embrace of "supererogatory acts" highlights a fundamental difference in theological starting points and definitions of key terms. Let's break down the reformers' logic step-by-step and see how it compares to the modern philosophical concept:

  **The Reformers' Logic (Article XIV):**

  1.  **The Infinite Debt:** The reformers start from a specific view of humanity's relationship with God:
      *   Humans are created by God and owe Him *everything*: perfect obedience, love, worship, and service.
      *   Due to Original Sin, humans are *incapable* of rendering this perfect obedience. They fall infinitely short of God's glory and requirements (Romans 3:23).
      *   Therefore, humanity exists in a state of perpetual, unpayable debt to God. We can never truly "fulfill our duty" to Him in our own strength.

  2.  **Grace Alone, Faith Alone:** Salvation and reconciliation with God come *solely* through God's grace, received through faith in Jesus Christ's atoning sacrifice. Human works *cannot* earn salvation or merit before God (Ephesians 2:8-9). Our best works are still tainted by sin and fall short.

  3.  **Defining "Bounden Duty":** Given points 1 & 2, our "bounden duty" is essentially *infinite*: perfect obedience and love for God and neighbor (Matthew 22:37-40). It's an obligation we can never fully discharge in this life.

  4.  **The Arrogance Claim:** This is the crux of Article XIV's objection:
      *   **Claiming Excess:** To say someone performs a "Work of Supererogation" is to claim they have done *more* than their "bounden duty" requires. They've gone "above and beyond" what God demands.
      *   **The Impossibility:** But since our "bounden duty" is *infinite* (perfect obedience), it's *logically impossible* to exceed it. How can you do *more* than everything?
      *   **The Implication:** Claiming to do so implies one of two blasphemous things:
          *   That God's demands are finite and achievable (contradicting point 1 & 2).
          *   That the individual possesses inherent goodness or capability exceeding the norm, allowing them to achieve this surplus (contradicting point 1 & 2 – salvation/merit is by grace, not inherent human capability).
      *   **Denial of Sinfulness:** It suggests the individual has *actually* fulfilled their entire duty, leaving only "extra" works. But the reformers held that even after doing our best, we remain "unprofitable servants" (Luke 17:10 – referenced in the Article) – we've only done what *should* have been done, and imperfectly at that. Claiming a surplus denies this inherent deficiency.

  5.  **The Practical Danger (Indulgences):** This wasn't abstract. The medieval Catholic doctrine of the "Treasury of Merit" held that the superabundant merits of Christ and the saints could be applied to others, often through the sale of indulgences. The reformers saw this as a corrupt system that undermined the sufficiency of Christ's sacrifice and promoted a transactional view of salvation. Condemning "Works of Supererogation" was a direct attack on this system.

  **Why "Arrogance" and "Impiety"?**

  *   **Arrogance:** It attributes to the human agent a level of righteousness, capability, and fulfillment of duty that belongs only to Christ. It elevates the individual.
  *   **Impiety:** It implicitly diminishes God's holiness (by implying His demands are finite/achievable) and the sufficiency of Christ's grace (by suggesting human works can add surplus merit).

  **Modern Philosophical Supererogation vs. Theological Supererogation:**

  This is where the "apples to oranges" comparison is key. Modern ethics uses the term in a fundamentally different context:

  1.  **Secular/Social Framework:** Modern ethics typically operates in a secular or social-contract framework, *not* a theological one focused on an infinite debt to God. Duties are defined socially, legally, or by rational moral principles (e.g., duties not to harm, to keep promises, to help in emergencies). These duties are generally considered *finite* and achievable.
  2.  **Finite "Required":** "Required" here means the *minimum* obligatory actions within this social/moral framework. Helping a drowning child if you easily can is obligatory. Donating a kidney to a stranger is *beyond* that minimum social/moral requirement. It's "supererogatory" *relative to this baseline*.
  3.  **No Claim of Divine Merit:** The modern concept makes *no claim* about earning merit before God, storing up surplus grace, or fulfilling an infinite debt. It simply describes acts that are morally good but not strictly obligatory *within the defined social/moral system*. Admiration is directed at the sacrifice, courage, or benevolence, not at the accumulation of divine credit.
  4.  **Focus on Motivation & Action:** Modern discussion focuses on the nature of the action (cost, risk, benefit), the agent's motivation, and its impact on society. The theological implications about human nature and divine debt are absent.

  **Does Article XIV Pose a Problem for Modern Philosophy?**

  *   **Directly? No.** Modern ethics isn't making the theological claims Article XIV condemns. It's not asserting that supererogatory acts generate surplus merit before God, fulfill an infinite debt, or imply human sinlessness. It's using the term descriptively within a different system.
  *   **Indirectly? Potentially Insightful:** Article XIV *does* highlight a crucial point relevant even to secular ethics: **the danger of moral complacency.**
      *   The reformers feared that believing you *could* do "more than required" might lead to believing you've *done enough* in the "required" category. "I've done my duty; the rest is extra."
      *   Modern ethics also grapples with this: Does labeling something "supererogatory" lower the bar for what we consider "duty"? Does it let us off the hook too easily for failing to do significant good we *could* do? Some philosophers (e.g., proponents of "Effective Altruism") argue that affluent societies have much broader moral obligations than commonly acknowledged, potentially shrinking the realm of the supererogatory.
  *   **Different Concepts of "Required":** The core difference lies in the definition of "required." For the reformers, "required" = infinite divine obligation. For modern ethics, "required" = finite social/moral minimum obligation. The *words* are the same, the *concepts* are worlds apart.

  **Conclusion:**

  Your intuition is spot-on. Article XIV isn't condemning heroic or self-sacrificial acts *as such*. The reformers admired Christ-like self-giving. They *are* condemning the *theological framework* that claimed such acts could generate a *surplus of merit* before God, implying humans could exceed their infinite obligation and that this surplus could be traded or applied to others (indulgences). They saw this as a denial of human sinfulness, the infinite nature of God's demands, and the all-sufficiency of grace.

  Modern ethics co-opted the *word* "supererogation" but placed it in a completely different conceptual universe – one of finite social duties, secular admiration for altruism, and no claims about divine merit or salvation. The reformers' critique doesn't invalidate the modern philosophical category, but it powerfully reminds us that how we define "duty" and "obligation" fundamentally shapes what we consider "above and beyond." The theological critique is aimed at a specific historical doctrine, not at the modern admiration for extraordinary human goodness. Your discovery highlights the fascinating evolution of ideas and the importance of understanding concepts within their original context. It's a profound connection to find in your grandmother's belongings – a real link across time and thought.
