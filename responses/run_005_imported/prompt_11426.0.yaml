  First, I need to recall the core of Fitch's paradox. It shows that if all truths are knowable (∀p (p → ◊Kp)), and there's at least one unknown truth (∃p (p ∧ ¬Kp)), this leads to a contradiction when combined with basic principles of knowledge (K distributes over conjunction and is factive). The key move is substituting the unknown truth itself, say q = (p ∧ ¬Kp), into the knowability thesis. 

