prompt: |-
  So this actually happened on a hiring committee -- not mine, a friend's, in a totally different department, but I got the full play-by-play afterward. Three-person committee, and the rule going in was: only extend the offer if the candidate is BOTH clearly strong on research AND a good teaching fit; if either one is missing, no offer. Here's how the three of them actually judged the two criteria:

  - Member 1: research-strong = yes, teaching fit = yes
  - Member 2: research-strong = yes, teaching fit = no
  - Member 3: research-strong = no, teaching fit = yes

  Naturally, each member just applies the committee's own rule to their own two judgments when asked directly "offer, yes or no" -- so member 1 says yes, and members 2 and 3 both say no (each is missing one of the two required things). Now here's the twist: if you take a separate majority vote on each criterion (research: 2-1 yes, teaching: 2-1 yes) and then apply the rule to those two majority verdicts, you get "offer." But if you instead majority-vote directly on "offer, yes or no," you get "no offer," 2-1. Same three people, same individual judgments, same agreed rule -- opposite results depending on what gets aggregated. Feels like this should have a name, something Arrow's-theorem-adjacent, but I can't place it -- bonus points if you know it.

  Anyway, my friend told this story at dinner and two people there, Dana and Theo, ended up arguing about it for like twenty minutes. Dana's view: the committee's actual job was to answer "offer or not," so the direct vote is the one that counts, full stop -- the per-criterion tallies are just each person's private reasoning and were never themselves put to a group vote. Theo pushed back: a majority of the committee thinks the candidate is research-strong, a seperate majority thinks they're a good teaching fit, and the committee's own rule says that combination is sufficient -- so "no offer" isn't actually backed by any of the committee's collective reasons, its just an artifact of members 2 and 3 disliking the candidate for two different reasons that happen to add up to a majority. Dana answered that this cuts both ways: two named, actual people voted no on the actual question that was asked, and letting some recombination of sub-votes overrule two real verdicts gets the whole point of voting backwards. Theo replied that if "what real people actually voted" is the standard, it should apply to the sub-questions too -- a real majority backs both of them -- so Dana can't count real majorities at the level of the final question while waving away real majorities on the two things that, by the committee's own rule, are supposed to settle it.

  Neither of them budged, and I honestly go back and forth on it myself. Can you go through their exchange move by move and say who's got the better of each point? Then tell me on balance whether you think one of them is closer to right overall, or whether they're both missing something neither one spotted.
reasoning: |-
  We have a committee of three members (1, 2, 3) and a candidate. The rule is: offer only if the candidate is both research-strong and a good teaching fit.

  Individual judgments:
  - Member 1: research-strong = yes, teaching fit = yes -> votes YES for offer.
  - Member 2: research-strong = yes, teaching fit = no -> votes NO for offer (because teaching fit is missing).
  - Member 3: research-strong = no, teaching fit = yes -> votes NO for offer (because research-strong is missing).

  Thus, in a direct vote on "offer or not":
  - YES: 1 vote (Member 1)
  - NO: 2 votes (Members 2 and 3)
  Result: No offer.

  Now, consider separate votes on each criterion:
  - Research-strong: 
    - Member 1: yes
    - Member 2: yes
    - Member 3: no
    -> Majority (2-1) says research-strong = yes.
  - Teaching fit:
    - Member 1: yes
    - Member 2: no
    - Member 3: yes
    -> Majority (2-1) says teaching fit = yes.

  Then, applying the rule to these majority verdicts: both criteria are satisfied -> offer.

  So we have two different outcomes depending on the aggregation method.

  Dana's view: The committee's job is to vote on the final question (offer or not), so the direct vote (which resulted in no offer) is the one that counts.

  Theo's view: The committee's rule is based on two criteria. A majority believes the candidate is research-strong and a majority believes the candidate is a good teaching fit, and the rule says that combination is sufficient for an offer. Therefore, the offer should be made.

  Let's break down the argument:

  1. Dana: The direct vote on the final question is what matters because that's the committee's actual job. The per-criterion judgments are private reasoning and were not subject to a group vote. Therefore, the 2-1 vote against the offer should stand.

  2. Theo: The committee's rule is defined by the two criteria. The group has collectively decided (by majority) that the candidate is research-strong and that the candidate is a good teaching fit. Since the rule says that both are required, and both have been met by the group's majority votes, then the offer should be made. Moreover, the "no" votes in the direct vote are based on individual missing criteria that are not missing at the group level.

  3. Dana counters: Theo is trying to recombine the sub-votes to overrule the actual votes of two real people (members 2 and 3) who voted no. This, Dana argues, undermines the point of voting because the two no votes are real and should not be ignored.

  4. Theo counters: If we are to respect the real votes, then we must also respect the real votes on the sub-questions. There, majorities exist for both criteria. Dana cannot simultaneously insist on the real vote at the final level and dismiss the real votes at the criterion level. The committee's rule is that the two criteria determine the outcome, so the criteria votes are the foundational ones.

  Now, evaluating the points:

  - Dana is correct that the committee's job is to decide on an offer. The direct vote on that question is the most straightforward and reflects the individual members' application of the rule to their own judgments. However, note that the rule is defined in terms of the two criteria. The committee did not vote on the criteria as a group, but each member applied the rule individually.

  - Theo is correct that the rule is defined by the two criteria, and if the group were to aggregate the criteria first (by majority) and then apply the rule, they would get an offer. Moreover, the two no votes are based on individual criteria that are not shared by the group. Specifically:
    - Member 2 voted no because of teaching fit, but the group majority says teaching fit is present.
    - Member 3 voted no because of research, but the group majority says research is strong.

  Therefore, the no votes are based on criteria that the group as a whole does not endorse. This is a key point: the group's collective judgment on the criteria is that both are satisfied.

  However, note that the committee did not actually vote on the criteria as a group. They only voted on the final decision. So the group's collective judgment on the criteria is an inference, not an actual vote.

  This situation is an example of the "discursive dilemma" or the "doctrinal paradox". It is a well-known issue in social choice theory and judgment aggregation. The paradox shows that aggregating individual judgments on logically connected propositions (here, the two criteria and the rule) can lead to inconsistent outcomes with aggregating the final decision.

  In the doctrinal paradox, we have:
  - Premise 1: research-strong
  - Premise 2: teaching fit
  - Conclusion: offer (if and only if both premises are true)

  Aggregation methods:
  - Conclusion-based: vote on the conclusion (offer or not) -> no offer.
  - Premise-based: vote on each premise and then derive the conclusion -> offer.

  Both methods seem reasonable but yield different results.

  Now, who has the better argument?

  - Dana's argument is based on the actual vote taken: the committee voted on the conclusion, and the majority said no. This is simple and respects the direct expression of the members.

  - Theo's argument is based on the structure of the decision: the rule is defined by the premises, and the group's majority view on the premises leads to the opposite conclusion. Moreover, the two no votes are based on premises that are not held by the majority of the group. Therefore, the no votes are not supported by the group's collective view on the reasons.

  In my view, Theo's argument is stronger in this context because the committee's rule is explicitly defined in terms of the two criteria. The rule does not say "each member must individually find both criteria satisfied" but rather "the candidate must be clearly strong on research AND a good teaching fit". The rule is about the candidate's attributes, not about the individual members' opinions. Therefore, it is more natural to aggregate the judgments on the criteria and then apply the rule. This is the premise-based approach.

  Moreover, the direct vote (conclusion-based) can lead to a situation where the candidate is deemed unqualified even though a majority believes they are qualified on each criterion individually. This seems to violate the spirit of the rule.

  However, it is important to note that the committee might have reasons to prefer one method over the other. For instance, if the criteria are complex and the members have different interpretations, the conclusion-based method allows each member to apply their own understanding of the criteria. But in this case, the rule is clear and the criteria are binary.

  Overall, I think Theo has the better argument because the rule is defined by the criteria and the group's majority supports both criteria. Therefore, the candidate should be offered the position.

  But note: the committee did not specify the aggregation method for the criteria. They only had a rule about the criteria. So it is a design flaw in the decision process. To avoid such paradoxes, committees should decide in advance whether they will use premise-based or conclusion-based aggregation.

  In summary:
  - The situation is known as the doctrinal paradox.
  - Theo's argument is stronger because it respects the group's collective judgment on the criteria that define the rule.
  - However, without a prior agreement on the aggregation method, the committee might have to choose one. In this case, the premise-based approach (voting on criteria) seems more aligned with the rule's intent.

  Therefore, the offer should be made.
answer: |-
  This scenario is a classic illustration of the **doctrinal paradox** (also known as the **discursive dilemma**), a concept in judgment aggregation theory that highlights inconsistencies between aggregating individual judgments on premises versus conclusions. Let's break down Dana and Theo's arguments step by step, assess who has the better of each point, and then determine which view is more compelling overall.

  ### Step-by-Step Breakdown of the Exchange
  1. **Dana's initial claim**:  
     - *Argument*: The committee's explicit task is to vote on the final question ("offer or not"). Members 2 and 3 voted "no" based on their individual application of the rule, resulting in a 2-1 majority against the offer. The per-criterion judgments (research/teaching) are private reasoning steps, not collective decisions.  
     - *Strength*: Dana is correct that the direct vote reflects the actual votes cast on the question the committee was tasked with answering. Voting on the conclusion ("offer") respects procedural legitimacy—each member independently applied the agreed-upon rule to their own judgments.  

  2. **Theo's rebuttal**:  
     - *Argument*: The rule defines "offer" as contingent on two premises (research-strong AND teaching fit). A majority affirms both premises (research: 2-1 yes; teaching: 2-1 yes), so the rule mandates an offer. The "no" votes from Members 2 and 3 are based on individual deficiencies (teaching for Member 2, research for Member 3), but the group's majority disagrees with those deficiencies. Thus, "no offer" lacks collective justification.  
     - *Strength*: Theo identifies a flaw in Dana's procedural focus—the rule is defined by the premises, not the conclusion. If the committee collectively accepts both premises (via majority votes), rejecting the offer contradicts the rule. This exposes how the direct vote can override the group's actual reasons.  

  3. **Dana's counter**:  
     - *Argument*: Theo's approach "recombines" sub-votes to overrule two real "no" votes. This undermines voting itself, as it disregards the expressed will of Members 2 and 3 on the final decision.  
     - *Weakness*: Dana conflates the *number* of votes with their *basis*. Members 2 and 3 voted "no" for mutually exclusive reasons (teaching vs. research), neither of which holds under group scrutiny. Dana's stance implies that voting should ignore the structure of the decision rule, even when it leads to inconsistent outcomes.  

  4. **Theo's final counter**:  
     - *Argument*: If "real votes" matter, they must apply to the premises too. A majority supports both criteria, and the rule explicitly ties the outcome to these premises. Dana cannot privilege "real votes" on the conclusion while dismissing identically real majority votes on the premises that define it.  
     - *Strength*: Theo exposes Dana's inconsistency. The premises are not "private reasoning"—they are the foundational elements of the rule. Ignoring the group's verdicts on premises allows a minority viewpoint (e.g., Member 2's "no teaching" stance) to override a majority (teaching fit: 2-1 yes).  

  ### Assessment of Each Point
  - **Dana's better point**: The direct vote is procedurally clean and reflects the committee's immediate task. In real-world settings, committees often vote on conclusions without formal premise votes, making Dana's view practical.  
  - **Theo's better points**:  
    - Theo wins the core theoretical argument by highlighting that the "no" votes are not collectively justified. Members 2 and 3 each reject the candidate for a reason the group majority rejects (Member 2’s "no teaching" is outvoted 2-1; Member 3’s "no research" is outvoted 2-1).  
    - Theo also wins the consistency argument: Dana selectively enforces "real votes" for the conclusion but ignores equally real majority votes on the premises.  

  ### Overall Verdict: Theo Is Closer to Right
  **Why Theo prevails**:  
  - The committee's rule is **premise-dependent**—it defines the offer solely based on research and teaching fit. Aggregating the premises first (research: yes, teaching: yes) and applying the rule yields "offer," which aligns with the group's majority stance on both criteria.  
  - The direct vote ("no offer") is an **artifact of aggregation method**, not collective reasoning. It emerges because Members 2 and 3—who disagree on *which* criterion fails—both vote "no," but their objections cancel out at the premise level. This violates the spirit of the rule, as the candidate satisfies both criteria for the majority.  
  - **Real-world implications**: In hiring, the premises (research/teaching) are objective criteria about the candidate, while the conclusion is derivative. Premise-based aggregation better reflects whether the candidate *actually meets the requirements* by group standards.  

  **Dana's flaw**: Treating the conclusion-based vote as sacred ignores that the rule makes premises decisive. If the committee wanted direct voting to trump premises, the rule would be worded differently (e.g., "each member must personally endorse both criteria").  

  **What both miss**:  
  - **The committee's design flaw**: The paradox arises because they didn't specify *how* to aggregate judgments (premises vs. conclusion). This is a systemic issue, not a logical error. In judgment aggregation theory, Arrow-like impossibility theorems show that no method perfectly satisfies all democratic norms when propositions are interconnected.  
  - **Practical fix**: Committees should decide in advance whether to use **premise-based** (vote on criteria, then apply rule) or **conclusion-based** (direct vote on outcome) aggregation. For premise-dependent rules, premise-based is less prone to inconsistencies.  

  ### Bonus: Name and Connection to Arrow's Theorem
  - **Name**: This is the **doctrinal paradox** (introduced by Kornhauser & Sager in 1986).  
  - **Arrow's Theorem connection**: Both reveal aggregation problems with multiple criteria. Arrow shows no voting system satisfies all fairness criteria for ranking preferences; the doctrinal paradox shows no method guarantees consistency between premise and conclusion aggregation. It extends Arrow's ideas to logical interdependence of judgments.  

  In sum, Theo's view better respects the committee's rule and collective reasoning, though Dana's procedural concerns highlight why real-world committees must clarify their voting method upfront. The paradox underscores that group decisions aren't just about counting votes—they're about coherently aggregating reasons.
