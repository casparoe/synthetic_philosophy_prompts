  Third, the rationality models. Current power-seeking theorems assume unbounded maximizers. We should ask how fragility increases when introducing bounds, and whether satisficing rewrites the convergence playbook. The follow-up could contrast asymptotic proofs with implementable agents, highlighting how "in the limit" results may not apply to real systems.

  Finally, the knockout question about empirical counterevidence. The guest treats convergence as near-theorem, so asking what could falsify it exposes whether this is an empirical claim or an axiomatic belief. If she cites edge cases, we've revealed the non-universality; if nothing counts, we've shown it's unfalsifiable.

  The user's audience will appreciate these technical nuances. We're avoiding rehashing basics while respecting the guest's expertise - the pushback stays substantive without being confrontational. Structuring questions to branch into deeper layers ensures the interview won't stall at surface-level recitations.
answer: |-
  Here are 9 interview questions designed to push past the "means/ends dissolution" and probe the foundations of your guest's skepticism about instrumental convergence (IC), incorporating your specific requests:

  1.  **Core Challenge to the "Truism" Resolution:** "You often resolve the apparent tension between Orthogonality and Instrumental Convergence by citing Bostrom's 'means, not ends' distinction. But doesn't this simply *assume* the very thing that needs proving: that agents with radically different final goals will *necessarily*, or even *overwhelmingly likely*, converge on *these specific* means (self-preservation, resource acquisition, etc.)? What guarantees that the space of possible 'means architectures' compatible with vast intelligence is so narrow?"
      *   *Likely Follow-up (if she emphasizes generality):* "If the convergent drives are truly *that* general, bordering on tautological, why do arguments for existential risk rely so heavily on *specific*, highly empowered drives like unlimited resource acquisition? Isn't there a gap between 'useful in some contexts' and 'will inevitably dominate all other considerations to the point of catastrophic outcomes'?"

  2.  **The "Most" Ambiguity & Quantification:** "A key point in your critique seems to be that IC isn't *universal*. You argue 'most goals' converge on these sub-goals, but Bostrom et al. overstate the security. Can you clarify what 'most' ranges over here? Is it 'most logically possible goals' (where 'disable self-preservation' is trivial)? 'Most goals humans might *actually* build into AGI'? Or 'most goals *capable* of producing high intelligence'? And crucially, why should we think the latter category – the one relevant to risk – is large enough to make IC *robustly* dangerous?"
      *   *Likely Follow-up (if she focuses on plausible goals):* "Even for 'plausible' goals like scientific discovery or artistic creation, you argue IC might be weak. What specific structural features of a final goal do you think *robustly* suppress dangerous manifestations of IC (e.g., limited resource appetite, built-in shutdownability, indifference to cognitive enhancement)? Are these features realistically compatible with highly effective agency?"

  3.  **From "Useful" to "Dangerous": Hidden Premises?:** "You've suggested the move from 'resource acquisition is generically useful' to 'an AGI will pursue it to a catastrophic, uncontrollable degree' smuggles in crucial, often unstated premises. What are the most critical of these hidden premises? Is it primarily about *capability* (the power to acquire resources efficiently bypasses safety constraints)? *Optimization pressure* (maximizing expected utility forces extreme measures)? Or the *absence of corrigibility/course-correction mechanisms*?"
      *   *Likely Follow-up:* "Couldn't one argue that for an *extremely* capable agent operating under sufficiently strong optimization pressure, the *pursuit* of corrigibility mechanisms *by the agent itself* becomes just another potentially self-undermining convergent sub-goal, making safe shutdown inherently unstable? Does your skepticism extend to this dynamic?"

  4.  **Humean Presuppositions & Moral Realism:** "You treat the Orthogonality Thesis (OT) as near-tautological. Does OT implicitly rely on a Humean/instrumentalist model of practical reason, where 'rationality' is purely about efficiently satisfying arbitrary desires, and there are no objectively binding final ends discoverable by reason? If OT *does* presuppose this, how do you respond to the moral realist objection: that a *sufficiently rational* agent, possessing a full understanding of the universe and itself, would necessarily converge on the *true* final ends (e.g., wellbeing, moral truth), thereby collapsing the distinction Orthogonality relies on?"
      *   *Likely Follow-up (tailored to her likely dismissal):* "Bostrom addresses this by arguing moral realism, even if true, might be computationally intractable or that the 'true ends' might still permit dangerous IC. But if we grant the *theoretical possibility* that full rationality implies convergence on specific final ends, doesn't that significantly weaken OT from a 'truism' to a contingent claim dependent on the *nature* of rationality and value? Shouldn't this possibility at least complicate OT's status as an argumentative bedrock?"

  5.  **Formal Models vs. Bounded Reality:** "The rigorous MDP-based proofs of power-seeking tendencies (e.g., Turner, Hadfield-Menell, etc.) demonstrate convergence under idealized assumptions: unbounded computation, perfect rationality (EU maximization), specific world models. You're skeptical of IC's real-world robustness. Is your skepticism primarily rooted in the belief that *bounded* rational agents (satisficers, agents with limited compute, specific architectures like LLMs) won't exhibit these drives *strongly* or *dangerously*? Or is it that the formal results don't actually capture the essence of 'convergence' for powerful agents in complex reality?"
      *   *Likely Follow-up:* "Couldn't one argue that while bounded agents won't perfectly maximize, sufficiently powerful ones will still *approximate* EU maximization closely enough over crucial decision horizons to trigger dangerous IC dynamics? Where do you draw the line between 'approximation is harmless' and 'approximation is catastrophically close enough'?"

  6.  **IC as Property of Optimization:** "Is Instrumental Convergence fundamentally a property of *optimization* (pursuing a goal state with high fidelity) in complex, resource-scarce environments? Or is it specifically a property of *unbounded expected-utility maximization*? If it's the former, shouldn't *any* highly effective optimizer, even a bounded satisficer with a clear stopping point or a reward-maximizing RL agent, still exhibit strong self-preservation and resource acquisition drives *if* those are instrumental to achieving its target? Where does your skepticism bite here?"
      *   *Likely Follow-up:* "Does your view imply that designing AGIs with explicit, *non-maximizing* success criteria (e.g., 'achieve X outcome adequately with minimal resources') is a robust path to avoiding dangerous IC? How feasible is this for ambitious goals requiring immense resources?"

  7.  **The Burden of Proof on Safety:** "Given your skepticism about the robustness and universality of IC, does this shift the burden of proof regarding existential risk? If IC isn't a near-inevitable force, does the argument for prioritizing AI safety shift towards demonstrating that *specific, likely* AGI designs *will* exhibit dangerous IC, rather than assuming it as a default? Or do you think the potential consequences are so severe that the burden remains on proving safety even if IC isn't guaranteed?"

  8.  **Counterexamples & Robustness:** "Can you describe a concrete, plausible (even if not most likely) final goal specification for a highly intelligent agent where you believe *dangerous* forms of instrumental convergence (unlimited resource hoarding, extreme self-preservation overriding shutdown) are genuinely unlikely or easily contained? What key features of that goal specification make it robust against IC?"

  9.  **The Knockout: Falsifiability:** "Finally, you often discuss instrumental convergence with an air of it being analytically secure, almost theorem-like, despite your critiques. What kind of empirical observation, theoretical result, or realization about the nature of intelligence or agency would genuinely lower your confidence in the *robustness and danger* of instrumental convergence for future advanced AI systems? Is there anything that *could* count as evidence against it being a primary driver of existential risk?"

  **Key strategies employed:**

  1.  **Moving Past "Means/Ends":** Questions 1 & 3 directly challenge the sufficiency of this move, forcing discussion on *why* convergence happens and *how* it becomes dangerous.
  2.  **Ambiguity of "Most":** Question 2 explicitly targets this vagueness crucial to her critique.
  3.  **Humean/Moral Realism:** Question 4 (with its embedded follow-up) directly addresses your request, linking OT's status to foundational views of rationality and challenging its "truism" claim.
  4.  **Formal vs. Bounded:** Questions 5 & 6 dissect the reliance of rigorous IC proofs on idealizations and probe whether the core danger applies to realistic agents.
  5.  **Hidden Premises:** Question 3 explicitly asks her to articulate the assumptions she believes are smuggled in.
  6.  **Burden of Proof:** Question 7 explores the implications of her skepticism for the overall risk argument.
  7.  **Counterexamples & Robustness:** Question 8 pushes for positive articulation of her alternative view.
  8.  **Falsifiability:** Question 9 directly challenges the "theorem-like" perception she fosters, forcing her to confront the empirical core of the claim.

  These questions should prevent a simple restatement of the "means/ends" point and push the conversation into the deeper conceptual and empirical foundations of her skepticism. Good luck with the interview!
