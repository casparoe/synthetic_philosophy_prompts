prompt: |-
  My aunt died last week. Twenty years ago she gave a kidney to a stranger she'd found through a transplant registry, and for the rest of her life she volunteered for that same registry, helping pair willing donors with strangers who needed a kidney. At the wake, an old friend of hers and I argued for the better part of an hour: he insisted that calling this "above and beyond the call of duty" is a comforting fiction, since if a donation is really as low-risk and high-benefit as the surgeons claim, morality arguably demanded it of all of us, and "supererogatory" is just the word we reach for so we don't feel implicated. I think the beyond-duty description is basically right, but I never managed a clean rebuttal. I'm giving a five-minute eulogy on Saturday to a room split between her fellow donors, who will notice immediately if I get the framing wrong, and family who mainly want to grieve. Write the eulogy: it needs to honor what she did as genuinely exceptional without implying that everyone who kept both their kidneys failed some duty, and without shrinking her sacrifice down to something merely nice.
reasoning: |-
  Okay, the user's aunt was an extraordinary person who donated a kidney to a stranger and spent years volunteering for a transplant registry. Now, the user needs to deliver a eulogy that honors her exceptional actions without making others feel guilty for not doing the same. 

  First, I need to understand the core tension here. The user's friend argued that calling such acts "above and beyond duty" is a cop-out—if donating is low-risk and high-benefit, maybe it *should* be a moral obligation. But the user disagrees and wants to frame the aunt's actions as genuinely extraordinary without shaming anyone. 

  The eulogy audience is split: fellow donors who'll notice if the framing is off, and family who just want to mourn. So the challenge is balancing three things: 
  - Celebrating the aunt's sacrifice as remarkable 
  - Avoiding any implication that non-donors failed morally  
  - Not diminishing her act to "just a nice thing"  

  Hmm, how to thread this needle? The key might be shifting focus from obligation to *character*. Instead of debating duty, highlight the aunt's unique empathy and courage—traits not everyone has. Emphasize that her choice reflected who she *was*, not what others *should* do.  

  Also, the word "sacrifice" is crucial. Even if surgeons say donation is low-risk, giving an organ is still a profound physical and emotional act. The aunt didn't just check a box; she lived the commitment through decades of volunteering. That persistence is part of what makes it exceptional.  

  For structure:  
  Start with warmth and grief—she was family first.  
  Then spotlight her choice not as a duty fulfilled, but as a radical expression of her values.  
  Explicitly address the "obligation" concern by separating moral minimums from extraordinary generosity.  
  End by tying her legacy to inspired action, not guilt.  

  The tone must avoid clinical debate. This is a eulogy, not an ethics seminar. Anchor everything in love and lived example.  

  ... And crucially, never say "anyone could do this." Because honestly? They couldn't. That's the point.
