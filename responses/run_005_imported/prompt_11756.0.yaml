  Kripke's 'Humphrey objection' to David Lewis's counterpart theory is that when we say Humphrey could've won the election, counterpart theory only makes this true because some other guy wins in some other world -- and Humphrey couldn't care less about that guy. Everyone always uses this exact same example though, so its hard to tell if people actually get the underlying issue or just memorized the case. Give me a genuinely different concrete example (not just the election with the names swapped) that raises the same worry about counterpart theory and de re modality -- ideally something about personal identity or ethics instead of politics -- and then say briefly whether you think Lewis has a decent reply or if this is just a real cost of his view.
