prompt: |-
  I sit on my philosophy department's promotion and tenure committee, and there's a fight brewing I could use help with. Currently a 5-person elected subcommittee reads each dossier closely and writes a recommendation, then the roughly 30 of us with voting rights just vote yes/no at the faculty meeting after skimming the subcommittee's summary -- in practice everyone ratifies whatever the subcommittee said. A colleague who works in formal epistemology wants to scrap that gatekeeping role and make the full faculty vote the real decision, since a bigger electorate is supposed to be more reliable -- he keeps citing the Condorcet Jury Theorem like its a closed case, and he's sharp enough that I can't just wave him off. A few of us feel somethings off but can't say exactly what. Can you draft the short memo I'll circulate before the meeting -- an actual recommendation (keep the subcommittee, scrap it, or some hybrid) that genuinely engages with his Condorcet argument rather than hand-waving it away, including being honest about whatever part of it might be right?
