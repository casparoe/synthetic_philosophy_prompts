prompt: |-
  Ok so I've been chewing on the paradox of voting again -- the thing where the odds you're literally the tie-breaking vote in any real election are so vanishingly small that under plain old causal decision theory, voting basically never pencils out once you weigh that against the cost of showing up. But the move I keep seeing pop up on rationalist-adjacent blogs is to bring in superrationality / evidential or functional decision theory instead: your vote isn't just one causally isolated act, its more like evidence about (or even "the same computation as") what everyone who reasons the way you do will end up doing, which changes the expected value math completely. Could you write me a short story, just a few hundred words, where a character actually works through that CDT-vs-EDT/FDT tension in their own head on the way to the polls? I don't want a philosophy lecture wearing a story as a costume -- I want the decision theory to come through in what the character notices and decides, not through exposition dumps.
reasoning: |-
  Okay, the user wants a short story that explores the voting paradox through a character's internal struggle between causal decision theory (CDT) and evidential/functional decision theory (EDT/FDT). They specifically want to avoid exposition dumps and have the decision theory emerge naturally from the character's thoughts and observations. 

  Hmm, the challenge here is making abstract concepts like CDT vs EDT/FDT feel visceral without lecturing. The character needs to organically arrive at the superrationality perspective through concrete details. 

  First, I should establish the protagonist as someone who's analytically inclined—maybe a data analyst or engineer—so their mental wrestling with probabilities feels authentic. The "vanishingly small odds" critique of voting should plague them as they prepare to vote. 

  For the setting, a rainy voting day creates physical reluctance that mirrors their philosophical hesitation. The bus stop becomes a good place for their internal monologue to unfold. 

  Key moments to include:
  - The initial CDT calculation (cost of time vs microscopic chance of being decisive)
  - The shift triggered by noticing other voters ("if I'm staying home, maybe people like me are too")
  - The FDT insight: their decision isn't isolated but correlates with similar reasoners
  - The realization that this changes the expected value calculation fundamentally

  Crucially, the epiphany should come through sensory details: the woman with the coffee cup (evidence of others showing up), the bus's headlights (literal reflection moment). The math stays subtextual—we see her change her mind, not the equations. 

  The ending needs to show her acting on the new paradigm without spelling it out. Her putting on the hood against the rain as she walks toward the polling place becomes the physical manifestation of choosing the EDT/FDT framework. 

  Must avoid:
  - Any character explaining decision theory to another
  - References to "CDT" or "EDT" by name
  - Abstract language without concrete anchors

  The coffee cup detail is key—it's mundane but makes the statistical interdependence tangible. Her noticing it shifts the internal debate from "my single vote" to "what my action signals about comparable voters." 

  Rain imagery throughout ties the physical discomfort (cost) to the philosophical tension. When she finally walks, the weather hasn't changed, but her relationship to the cost has—that's how we show the paradigm shift without stating it.
answer: |-
  The rain smeared the bus window into a watercolor blur of grey pavement and neon signs. Maya shifted her weight, backpack digging into her shoulder. *Stupid,* she thought, watching the wipers thump. *Utterly irrational.* Her internal spreadsheet was crystal clear: the cost of time, the bus fare, the damp socks she’d inevitably get walking the last three blocks… versus the probability her single vote for Prop 42 would *actually* tip the state legislature balance. A number so microscopically small it vanished against the background noise of cosmic rays and butterfly wings. Causal Decision Theory screamed *ABORT MISSION*.

  The bus hissed to a stop. A woman bundled against the drizzle climbed on, shaking droplets from a reusable coffee cup bearing the logo of Maya’s university’s Comp Sci department. Maya’s spreadsheet flickered. *One like me,* she noted absently. Heading somewhere, probably also voting. A tiny data point.

  The engine grumbled back to life. Maya leaned her head against the cool glass. CDT’s logic was impeccable, undeniable. Yet… the *feeling* persisted. A nagging sense that hitting snooze, staying dry, and coding instead *meant* something more than just saving herself two hours. What if everyone who thought like her – who ran the same cost-benefit analysis, who saw the vanishing odds – decided it wasn't worth it? The spreadsheet blinked, a new variable intruding. *If I stay home… doesn’t that make it slightly more likely that others who reason like me also stay home?*

  It wasn't just about her vote *causing* a win. It was her action being a *signal*, a tiny piece of evidence about what all the other analytical, probability-weighing voters would do. Her staying home wasn't isolated; it was a pixel in a larger picture of voter apathy among people who *should* care. Evidential Decision Theory whispered: *Your choice reveals a pattern. If you don't vote, it suggests others like you won't either, making the bad outcome you fear more likely.*

  The bus slowed for her stop. Maya stood, grabbing the cold metal pole. Functional Decision Theory chimed in, colder, more abstract: *What computation are you running? If everyone running *this* computation – weighing tiny causal impact against cost – outputs 'Don't Vote', then Prop 42 definitely fails. But if the computation outputs 'Vote', even knowing the individual causal impact is nil… then enough might vote to win.* Her choice wasn't just an action; it was participating in defining what the algorithm *did*.

  The doors wheezed open. Rain needled her face. Ahead, the elementary school gym – her polling place – glowed under fluorescent lights. She saw the woman with the comp sci cup already walking briskly towards it. Another voter, hood up, hurried past Maya towards the entrance.

  *CDT:* The cost is real. The causal effect is imaginary. Stay dry.
  *EDT/FDT:* Your inaction is evidence of collective inaction. Your action is part of the collective function. The cost is the same. The *meaning* changes.

  Maya hesitated on the bottom step, the bus exhaust warm on her legs. The spreadsheet hadn't changed. The odds were still astronomical. But the *isolation* CDT assumed felt suddenly false. Her decision wasn't happening in a vacuum; it was echoing in the computations of thousands like her, unseen. To vote wasn't to *cause* victory. It was to *be* the kind of person whose tribe, when faced with this precise dilemma, showed up. To output the value that, if widely copied, *would* cause victory.

  She pulled her hood up against the rain, not looking at the warm bus shelter, and walked towards the glowing gym. The cost was the same. The causal impact was still negligible. But the *expected value*, recalculated for the tribe of reasoners she belonged to, had just shifted decisively. She went to add her pixel to the picture.
