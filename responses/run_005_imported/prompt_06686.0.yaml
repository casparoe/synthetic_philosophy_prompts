answer: |-
  You've hit on a genuinely thorny problem in causation and responsibility, and your friend's objection is perceptive. Let's dissect this critically, targeting the weaknesses and alternatives without sugarcoating.

  ### 1. **Does the Normality Move Survive Your Friend's Objection?**
     **Short answer: Not cleanly.** Your friend is right that the "default" in the lifeguard case is constitutively tied to her contractual duty, collapsing back into normativity. Hitchcock and Knobe’s normality criterion aims to be descriptive (statistical or functional), but in cases involving roles defined by *institutional facts* (contracts, job descriptions), the "normal" behavior *is* defined by the duty. Consider:
     - **Statistical Normality**: If 95% of lifeguards *do* watch diligently, inaction is statistically abnormal. But this feels coincidental. If negligence were common (say, 60% of lifeguards slack off), would the lifeguard’s omission *cease* to be a cause? Intuitively, no—her responsibility persists because of her role, not statistics.
     - **Functional Normality**: The "default" for a lifeguard is watching swimmers *because that’s her function*. But functions are teleological and normative: a lifeguard *ought* to guard lives. Hitchcock himself acknowledges norms often shape defaults. In this case, the contract *constitutes* the role’s function. Your move doesn’t escape normativity; it buries it in the baseline.

     **Where your argument is thin**: You treat "role-based defaults" as non-moral facts, but roles like "lifeguard" or "doctor" are inherently defined by social/moral expectations. The triathlete lacks such a role, so her inaction isn’t "abnormal" in the relevant sense. But this asymmetry isn’t causal—it’s *deontic*. Normality here tracks *accountability*, not causation.

  ### 2. **Fairness to Beebee and Schaffer**
     - **Beebee**: You’re fair to her eliminativism, but understate her core argument. For Beebee, omissions aren’t causes because causation requires *positive mechanisms* or *energy transfer*. The lifeguard’s inaction involves no physical process connecting her to the drowning—it’s an *absence* of action. When we say she "caused" the death, we’re really attributing *responsibility* for failing to interrupt a causal chain she was *supposed* to monitor. Beebee would say your normality criterion is just a proxy for duty, confirming her view that "omissive causation" is a misnomer.
     
     - **Schaffer’s Contrastivism**: You’re right that Schaffer offers an alternative, but his account doesn’t clearly resolve the dilemma. For Schaffer, causation is contrastive: we ask whether the lifeguard’s inaction (rather than action) caused death (rather than rescue). But which contrasts matter? The lifeguard’s duty makes *her* inaction salient against a backdrop of expected action. The triathlete’s inaction isn’t a salient contrast because she had no such expectation. Again, norms creep in via context-sensitivity. Schaffer might avoid over-generation by restricting causes to salient contrasts, but *salience* here is often norm-laden (e.g., duties make omissions "stand out"). You’re not flattening disagreements—Beebee rejects omissions as causes *simpliciter*, while Schaffer accommodates them via contrasts—but neither cleanly evades normativity in *this* case.

  ### 3. **Is There a Sharper Case?**
     Yes. The lifeguard/triathlete case is good but muddied by proximity/ability (both are nearby and capable). A better test is the **"Poisoned Cup"** variant from Moore or Schaffer:
     > *Victim sips from a cup poisoned by Assassin. Bodyguard (duty-bound to check drinks) fails to inspect it. Bystander (no duty) also fails to warn. Victim dies.*  
     
     Here, both omissions are equally necessary for death. Yet only Bodyguard is seen as a "cause." Crucially:
     - **Proximity/ability are equalized**: Both could have acted identically.
     - **No role-based "defaults" for Bystander**: Bystander’s inaction isn’t "abnormal" in any statistical/functional sense—strangers rarely intervene.
     - **Duty is isolated**: Bodyguard’s responsibility hinges *solely* on duty, not abnormal behavior.

     If your normality criterion labels Bodyguard’s omission "abnormal," it’s only because his *duty* defines the default. The Bystander’s identical inaction is "normal" because no duty exists. This starkly exposes the normativity.

  ### 4. **Where Your Argument Needs Work**
     - **The Normativity Rabbit Hole**: You need to confront whether *any* "default" in duty-laden cases can be non-normative. If defaults are fixed by roles (lifeguard, doctor, bodyguard), and roles are defined by obligations, normativity is inescapable. Hitchcock’s "statistical norms" fail here—if negligent lifeguards were the majority, we’d still blame *this* one for violating her duty.
     - **Over-Generation Isn’t Solved**: The triathlete’s omission *is* a cause on a pure counterfactual view. Your normality move excludes her, but only by smuggling in duty via "defaults." McGrath’s dilemma stands: either over-include causes (counterfactualism) or appeal to norms (duty/normality).
     - **The Explanatory Order Problem**: You rightly note that causal facts should ground responsibility. But if the lifeguard’s "causing" death depends on her contractual duty, causation isn’t prior—it’s *parasitic* on norms. Beebee’s eliminativism avoids this by denying omissions are causal. Your view risks circularity: duty makes omission a cause, but then "cause" justifies duty-based blame.

  ### A Path Forward?
  Your normality move is elegant but fragile. To salvage it:
  - **Embrace Hybridity**: Argue that causal judgments *are* inherently hybrid—descriptive baselines (e.g., "lifeguards usually watch") + normative expectations ("they *should*"). But this concedes normativity is ineliminable.
  - **Pivot to Beebee**: Her eliminativism is the cleanest escape from McGrath’s dilemma. The lifeguard "caused" nothing; she *failed to prevent* a death she had a duty to stop. This preserves causal metaphysics (only positives cause) while explaining responsibility via duties. The cost? It clashes with ordinary language ("Her negligence caused his death").
  - **Contrastivism + Pragmatics**: Schaffer + Knobe might say causal judgments express *explanatory relevance*. The lifeguard’s inaction is relevant because it violated a norm; the triathlete’s isn’t. This doesn’t make causation normative—it makes *causal talk* sensitive to interests. But then "causation" isn’t doing the heavy lifting—norms are.

  ### Final Verdict
  Your friend’s objection lands: in duty-defined roles, "normality" reduces to de facto normativity. The lifeguard/triathlete case is potent, but the Poisoned Cup variant isolates the conflict. Beebee’s eliminativism is a serious contender, while Schaffer offers tools but no panacea. Where you’re thinnest is in defending "defaults" as non-normative in institutional contexts—this needs a robust account of how roles generate "normal" behavior without invoking *oughts*. If you can’t provide that, Beebee’s harder line may be the most defensible metaphysics, even if it sacrifices linguistic intuition.
