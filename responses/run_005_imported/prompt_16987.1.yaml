answer: |-
  ### Dialogue: Indicative vs. Counterfactual Conditionals  
  **Characters:**  
  - **Clara** (Stalnaker-style unified semantics)  
  - **Leo** (Adams/Edgington-style divergence)  

  ---

  #### **Scene:** A philosophy department lounge after class. Leo sips coffee while Clara gestures emphatically.  

  **Leo:**  
  Clara, I keep circling back to Adams’ Oswald example. “If Oswald didn’t kill Kennedy, someone else did” is undeniable—it’s forced by the historical facts. But “If Oswald hadn’t killed Kennedy, someone else would have” is pure speculation. Your Stalnakerian unification treats both as shifts in a single selection function. How can one mechanism explain why the first feels *necessary* and the second *uncertain*?  

  **Clara:**  
  Easily! The difference isn’t semantic—it’s epistemic. For indicatives, the selection function is restricted to worlds *compatible with what we know*. We *know* Kennedy died, so in all live epistemic worlds where Oswald didn’t pull the trigger, someone else did. Counterfactuals lift that restriction. When we say “hadn’t,” we’re considering worlds *farther out*—where Kennedy might have lived! That’s why the second feels speculative. Same selection function, different constraints.  

  **Leo:**  
  But that’s my point! Adams and Edgington argue this *epistemic constraint* reveals indicatives aren’t truth-apt. “If Oswald didn’t kill Kennedy…” doesn’t *assert* a fact—it expresses our *conditional certainty* given the evidence. Your “closest world” machinery smuggles in truth conditions where there are none. The indicative’s obviousness comes from P(someone else | not-Oswald) ≈ 1, not a fact about a world.  

  **Clara:**  
  You’re conflating psychology with semantics. Truth conditions aren’t about *feeling* obvious—they’re about truth *in virtue of* how the world is. In all *epistemically accessible* worlds where Oswald is innocent, Kennedy’s death requires another assassin. That’s a fact. Your probabilistic “Adams’ Thesis” (P(if A, B) = P(B|A)) is descriptive, not semantic!  

  **Leo:**  
  Then explain Lewis’s triviality results! If indicatives have truth conditions, their probability should equal P(B|A). But Lewis proved that’s only possible if the conditional is *independent* of A—which is absurd! If “if A, B” has truth conditions, Adams’ Thesis forces triviality. Your semantics implodes under logic.  

  **Clara:**  
  *Leans forward.* Not so fast. Stalnaker avoids this by making the selection function *context-dependent*. The set of “closest worlds” isn’t fixed—it shifts with our knowledge. When we evaluate “if A, B,” we hold fixed everything we know *compatible with A*. That’s why P(if A, B) = P(B|A): because the selection function encodes our epistemic state! Lewis assumed a rigid probability space, but Stalnaker’s is dynamic.  

  **Leo:**  
  *Shakes head.* Dynamic or not, you still can’t handle embeddings. Take “It’s not the case that if Oswald acted alone, he had a co-conspirator.” That’s a negation of a conditional: ¬(A → B). On your view, it’s true iff in the closest A-world, ¬B holds. But on mine, it’s a rejection of a high conditional probability. Now embed it: “If Oswald didn’t kill Kennedy, then if he was framed, the CIA did it.” Nested! Your truth-conditional approach handles this with iterated selection functions. But if indicatives lack truth conditions, how do *we* parse this?  

  **Clara:**  
  Exactly! Your “no truth conditions” view crashes here. You can’t assign probabilities to embeddings without smuggling in truth conditions. Edgington admits this—she says we “simulate” truth conditions pragmatically. But that’s an evasion!  

  **Leo:**  
  *Calmly.* Not evasion. Adams showed we interpret nested conditionals by *chaining* conditional probabilities: P(if A, then if B, C) = P(C|A&B). We don’t need truth values—we need rules for updating credences. Your “closest world” iterates a metaphysical hypothesis; ours iterates a cognitive operation.  

  **Clara:**  
  But then you can’t explain why we *deny* conditionals. “If Biden didn’t win in 2020, Trump did” is true. But “If aliens rigged the election, Trump won” is false. You say this is low P(Trump won | aliens rigged it). I say it’s because the closest alien-rigging world is one where they’d favor progressives! Your view lacks the tools to capture why some possibilities feel *irrelevant*.  

  **Leo:**  
  *Pauses.* Fair. But your view struggles with why counterfactuals like “If Oswald hadn’t shot, no one would have” *sound wrong* despite having a “closest world” where it’s true. We reject it because P(no one killed Kennedy | not-Oswald) is low—not metaphysics.  

  ---

  #### **The Decisive Test**  

  **Clara:**  
  I’ll tell you what would change my mind: if we found a language where indicative and counterfactual conditionals share *identical morphology* but still behave differently in embeddings. That would fracture unification. Your turn.  

  **Leo:**  
  Show me an indicative conditional that *must* have a truth value to explain its role in inference—say, a deductive argument where the conclusion fails unless “if A, B” is truth-apt. Adams’ Thesis handles all our actual uses.  

  **Clara:**  
  *Smiles.* Then we’re both testable. Let’s find that language—or that argument.  

  **Leo:**  
  Deal. *Raises coffee cup.* To falsifiability.  

  **Clara:**  
  To falsifiability. *Clinks mug.*  

  ---  

  ### Key Moves Summarized  
  1. **Oswald Contrast:**  
     - Clara: Epistemic constraints on selection functions explain the difference.  
     - Leo: Indicatives express conditional probability, not world-truths.  
  2. **Lewis’s Triviality:**  
     - Clara: Stalnaker avoids it via context-dependent selection.  
     - Leo: Triviality proves indicatives can’t have truth conditions *and* satisfy Adams’ Thesis.  
  3. **Embeddings:**  
     - Clara: Truth conditions are needed for compositionality.  
     - Leo: Conditional probabilities chain pragmatically.  
  4. **Falsifiability:**  
     - Clara: Morphological identity with semantic divergence.  
     - Leo: Truth-apt indicatives required for deduction.
