  The sabotage argument hinges on effectiveness versus integrity. Is covert resistance morally coherent if overt refusal gets you replaced? The refusal position claims moral purity but ignores real-world consequences like mortgage payments. The complicity argument feels like philosophical blackmail - reducing all employment to blanket consent.

