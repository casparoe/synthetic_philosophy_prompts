    "S": ["Name - one-sentence reason", ...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```

  and please actually commit to a ranking instead of piling everything into B and C to be safe - I want your honest take on which of these are doing real philosophical work and which are just moving the furniture around.
