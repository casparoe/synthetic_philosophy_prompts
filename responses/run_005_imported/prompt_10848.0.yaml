  I'm a philosophy PhD student in decision theory, and I've somehow ended up on the internal review committee for a small AI safety org that vets big claims before they go out in public reports. The current draft leans on coherence arguments -- money-pump arguments for transitivity and completeness, then the von Neumann-Morgenstern theorem -- to conclude that any sufficiently advanced AI will act like an expected-utility maximizer, and from there infers it'll resist shutdown, hoard resources, and resist having its goals edited. Half the committee wants to ship the section as-is since its basically the field's standard argument; the other half thinks it quietly swaps "won't pursue a strategy that's dominated by some alternative" for "will have one fixed, ambitious utility function that's robust to correction," which the theorems don't actually hand you. Can you draft the memo (roughly a page) I'll bring to Friday's meeting, recommending whether the section ships as-is, gets revised, or gets cut, with reasoning the authors could actually respond to? Give the "it's just the standard argument" side a real hearing first.
