prompt: |-
  So I'm on this small internal committee at work (mid-size logistics company, maybe 800 people) that decides who gets our twice-a-year "Integrity Champion" award. It's basically a certificate plus a $2,000 bonus, but people take it seriously since it gets read out at the all-hands. The policy describing it is like four sentences long and says it goes to whoever reports serious wrongdoing "in good faith, for the right reasons, and at some personal risk to themselves." Nobody ever bothered defining "for the right reasons," because up until now it's always been obvious.

  This cycle's nominee, Dana, reported that her department head was falsifying safety inspection logs, which turned out to be completely true and pretty serious -- it led to real fixes before anyone got hurt. The wrinkle is that Dana was also next in line for that same department head's job, and she got it about a month after he was pushed out. In her nomination statement she says she came forward purely out of concern for the warehouse crew's safety. A couple people on the commitee who've worked with her for years say, off the record, that she'd wanted that promotion for ages and this was obviously her opening. There's genuinely no way for us to settle what was actually going on in her head -- all we've got is her statement, the timing, and a track record that's honestly pretty good.

  Half the committee thinks the motive question is a red herring: the report was true, the danger was real, and turning it in is exactly what someone who cared about the crew would've done, so it doesn't matter what else was mixed in -- she acted on a reason that genuinely justifies the act, full stop. The other half thinks that if the promotion was really doing the motivational work, handing her an "integrity" award basically launders politics as principle, and teaches the next ambitious person exactly the wrong lesson about how to get ahead here. I keep flip-flopping, but I think we're circling around a version of a debate philosophers actually have, about whether acting "for the right reasons" is about the reasons that explain why you did something or just the reasons that would justify doing it. Can you write the short memo I'd bring to our meeting next week? I want it to recommend whether we grant the award, deny it, or grant it with some kind of modification, and I want the reasoning to be something the half of the committee that loses this vote could still walk away thinking was fair.
reasoning: |-
  Okay, the user is part of a committee at a mid-sized logistics company deciding on an "Integrity Champion" award. The award goes to someone who reports serious wrongdoing in good faith, for the right reasons, and at personal risk. This time, the nominee Dana reported her department head for falsifying safety logs, which was true and led to important fixes. However, Dana was next in line for his job and got promoted shortly after he was fired. The committee is split on whether her motives matter.

  First, I need to understand the core issue. The policy mentions "for the right reasons," but it's never been defined. Half the committee thinks the outcome justifies the award regardless of motive, while the other half worries that if ambition was her main driver, giving the award might encourage political maneuvering. The user wants a memo that recommends granting, denying, or modifying the award, with reasoning that both sides can accept as fair.

  The user mentioned a philosophical debate: whether "for the right reasons" refers to the reasons that explain the action (her actual motives) or the reasons that justify it (safety concerns). I should address this but keep it practical for a business context.

  Dana's report had real positive outcomes—safety was improved, and she took personal risk (potential retaliation). Her colleagues' off-the-record comments about her ambition introduce doubt, but there's no proof. The committee can't know her true motives. The policy doesn't require mind-reading, but "good faith" and "right reasons" imply some assessment of intent.

  Options: 
  - Grant the award: Focus on the outcome and the risk taken. Argue that the action aligns with integrity regardless of mixed motives.
  - Deny it: Risk appearing unjust since the report was valid and beneficial. Might discourage future reports.
  - Modify: Maybe give the award but add a note about pure motives? But that could undermine the recognition.

  The user wants both sides to feel the decision is fair. So the memo needs to acknowledge both perspectives. Highlighting that the policy's vagueness is the real problem here. Recommending granting the award this time but revising the policy to clarify "right reasons" for the future. This way, Dana is recognized for the concrete good she did, and the committee addresses the ambiguity moving forward.

  Also, personal risk is established—she reported her boss, which is risky. The promotion timing is circumstantial. Without evidence of malice, it's speculative to deny the award. However, the committee's concern about setting a precedent is valid. So, suggest that future nominations require more thorough vetting of motives where possible, but for now, the tangible benefits and risk taken meet the criteria as they stand.

  In the memo, structure it with background, analysis of both views, a recommendation, and policy revision suggestion. Emphasize that integrity can include actions with multiple motivations, as long as the primary reason aligns with company values. This balances both sides: Dana gets the award, but the policy is tightened to prevent misuse.
answer: |-
  **MEMORANDUM**  
  To: Integrity Champion Award Committee  
  From: [Your Name]  
  Date: [Date]  
  Subject: Recommendation for Dana’s Integrity Champion Nomination  

  ### Background  
  Dana reported verifiable safety violations by her department head, leading to critical corrections and the removal of a significant risk to personnel. Her actions align with the award’s core criteria:  
  - **Good faith**: Her report was accurate and substantiated.  
  - **Personal risk**: Reporting a direct supervisor inherently carries professional jeopardy.  
  - **Impact**: The outcome protected employee safety and upheld company values.  

  The sole ambiguity lies in the criterion "for the right reasons." While Dana cites safety concerns, some committee members question whether career ambition influenced her motives.  

  ### Analysis: Two Perspectives  
  1. **Outcome-Focused View**  
     - Dana’s report objectively served the company’s ethical interests: it exposed wrongdoing and averted harm.  
     - The award policy emphasizes *actions and consequences*, not psychological purity. If the act aligns with integrity (e.g., prioritizing safety over silence), mixed motives do not negate its legitimacy.  
     - *Philosophical grounding*: This view holds that "right reasons" means the act is *justifiable* by ethical principles (safety, honesty), regardless of personal incentives.  

  2. **Motive-Focused View**  
     - Integrity requires alignment between action *and* intent. If ambition drove Dana, the award could incentivize opportunistic reporting, undermining its moral purpose.  
     - *Philosophical grounding*: Here, "right reasons" refers to the *actual motivation* explaining the act (e.g., "I did it *because* it was right," not "I did it *and* it was right").  

  **Balancing the Tension**:  
  - We lack evidence to disprove Dana’s stated motives. Her record is strong, and speculation risks unfairness.  
  - However, the committee’s discomfort highlights a policy gap: "right reasons" remains undefined, inviting subjective interpretation.  

  ### Recommendation: Grant the Award, Revise the Policy  
  **Award Dana the Integrity Champion honor**, based on:  
  1. **Provable criteria met**: Truthfulness, risk, and impact are undisputed.  
  2. **Precedent**: Past awards were granted without probing private motives when outcomes were unequivocally ethical.  
  3. **Practical fairness**: Penalizing Dana for circumstantial suspicions sets a harmful precedent. It could deter future reports by implying nominees must prove "pure" intent—an unrealistic standard.  

  **Simultaneously, propose a policy revision** to clarify "right reasons":  
  - Add language specifying that "right reasons" requires the *primary motivation* to align with ethical principles (e.g., safety, justice), not personal gain.  
  - Implement a nominee interview step for future cycles to assess consistency in stated motives.  

  ### Why This Approach Is Balanced  
  - **For outcome advocates**: Dana’s tangible contribution to integrity is honored, preserving trust in the award’s recognition of concrete ethical courage.  
  - **For motive advocates**: The policy update addresses their core concern by establishing clearer guardrails against opportunism in future cases, without retroactively punishing Dana.  

  This decision acknowledges Dana’s demonstrable integrity while strengthening the award’s credibility long-term. It ensures the committee acts fairly on evidence, not conjecture—and commits to resolving ambiguity for the future.  

  **Vote recommendation**: Approve Dana’s award; form a subcommittee to draft revised policy language by next quarter.  

  ---  
  **Signature**:  
  [Your Name]  

  ---  
  *This memo prioritizes procedural fairness, ethical pragmatism, and forward-looking solutions. By separating Dana’s valid contribution from the policy’s flaw, it offers both sides a principled path forward.*
