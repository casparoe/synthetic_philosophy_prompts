answer: |-
  Your analysis of the East German border guard cases through the strict lens of the 1958 Hart-Fuller debate is an excellent way to test their core arguments. Here's how each would likely analyze the legitimacy of the convictions, where their reasoning would diverge, and the key pressure point for Hart:

  **1. H.L.A. Hart (Positivist Position - *Positivism and the Separation of Law and Morals*):**

  *   **Core Argument:** Hart would insist that the validity of the GDR laws authorizing the shootings must be assessed *solely* by the regime's own rule of recognition (its criteria for valid law). If the Schießbefehl directives were enacted according to the GDR's constitutional and legislative procedures, they were legally valid laws *within the GDR system* at the time the acts were committed.
  *   **Analysis of Conviction:**
      *   **Legal Positivism's View:** Prosecuting the guards under *West German* law (or reunified German law) *after* reunification for acts that were legal under the *GDR* legal order at the time constitutes **retroactive criminal punishment**. This violates a fundamental principle of the Rule of Law: *nulla poena sine lege* (no punishment without law). The guards acted according to what was, by positivist criteria, valid law.
      *   **Moral Outrage vs. Legal Validity:** Hart readily acknowledged the profound moral evil of the Schießbefehl. He would argue that moral condemnation of the *regime* and its *laws* is entirely justified. However, convicting *individuals* for following the law as it existed at the time creates a serious injustice *against those individuals*.
      *   **Justification for Prosecution?** Hart's *only* potential justification within his 1958 framework would be an **extra-legal moral override**. He explicitly stated that in extreme cases of iniquitous law, society might be morally justified in *disobeying* the law or even in retrospectively punishing individuals who applied it, *despite* this violating the ideal of the Rule of Law ("core of good sense" passage). He saw this as a tragic moral dilemma, *not* a vindication of the law's invalidity. He might argue that the unique horror of the shoot-to-kill policy against unarmed citizens fleeing constitutes such an extreme case.
  *   **Conclusion (Hart):** While morally abhorrent, the guards' acts were legal under the GDR system. Prosecuting them retroactively under a new legal order violates fundamental Rule of Law principles. Such prosecution could only be justified, if at all, as a necessary but legally irregular moral response to extreme evil – a response that acknowledges its own departure from strict legality.

  **2. Lon L. Fuller (Procedural Natural Law Position - *Positivism and Fidelity to Law—A Reply to Professor Hart*):**

  *   **Core Argument:** Law is not just a command backed by force; it must meet certain procedural and substantive minimum requirements of "inner morality" (his eight desiderata) to *be* law. A system utterly failing these, especially by deliberately creating traps for its citizens (like shooting them for an act it officially encouraged - fleeing), fails to achieve the very purpose of law: subjecting human conduct to the governance of rules.
  *   **Analysis of Conviction:**
      *   **Radbruch's Formula Vindicated:** Fuller would enthusiastically endorse the German courts' use of Radbruch's formula. The GDR's Schießbefehl policy, *even if formally enacted*, represented a gross violation of law's inner morality, particularly:
          *   **Congruence between Official Action and Declared Rules:** The state officially declared freedom of movement a right (in its constitution and international commitments) but issued secret orders to shoot those exercising it. This is a fundamental lack of congruence, creating a trap.
          *   **Impossibility:** Complying with both the declared right to leave and the secret order to shoot those who leave was logically impossible for citizens.
          *   **Proportionality:** The punishment (death) was utterly disproportionate to the "offense" (fleeing).
          *   **Generality/Non-Contradiction:** The secret orders created a hidden, contradictory rule applicable only to border guards targeting specific citizens.
      *   **Not Law, Therefore No Retroactivity Problem:** Because the Schießbefehl directives *failed to be law* due to their gross violation of legality's inner morality, the guards were not acting under valid legal authority. They were acting under morally repugnant *commands*, not law. Therefore, convicting them for murder under the principles of *natural law* or the fundamental principles of the *new* legal order (which embodies legality) does *not* constitute unjust retroactive punishment. There was no valid law shielding them.
  *   **Conclusion (Fuller):** The GDR directives authorizing shootings were so fundamentally incompatible with the very essence of law (its inner morality) that they were never valid law. The guards committed plain murder, morally and legally (under a proper understanding of law). Their conviction is not only legitimate but necessary to affirm the principles of legality and justice that the GDR regime so egregiously violated.

  **Point of Divergence:**

  The fundamental divergence occurs at the very first step: **Was the GDR's Schießbefehl a *valid law* at the time the acts were committed?**

  *   **Hart:** Yes, by the positivist test of systemic validity (enacted according to GDR rules). Therefore, retroactive punishment is legally problematic, justified only by an extra-legal moral necessity.
  *   **Fuller:** No, because it catastrophically failed the minimum requirements of law's inner morality (especially congruence, non-contradiction, proportionality). Therefore, there is no valid law to be retroactive *against*; the conviction applies fundamental legal/moral principles to a plainly criminal act.

  **The Strain on Hartian Positivism:**

  The East German case **genuinely strains Hart's position** precisely because of his own "core of good sense" caveat:

  1.  **The Extreme Institutionalization of Evil:** Unlike the informer cases (often private citizens exploiting vague Nazi "spirit"), the border guards were state agents acting under explicit, *formally valid* state directives. This makes the "following orders" defense *stronger* under a positivist reading. Yet, the acts are arguably *more* systematically evil.
  2.  **The Trap & Lack of Congruence:** Hart focused on laws being "too evil to obey." The GDR case highlights a different facet: laws that *create traps* by officially proclaiming rights while secretly ordering their violent suppression (Fuller's congruence failure). This systematic deception makes Hart's "choice to obey/disobey" framework less applicable – citizens couldn't know the true rule.
  3.  **Pressure on the "Core of Good Sense":** Hart acknowledged that morally intolerable laws might necessitate retroactive measures, but he saw this as a *regrettable moral exception* to the Rule of Law ideal. The GDR case forces the question: How extreme must the evil be *and how formally valid must the evil law be* to trigger this exception? Is a formally valid, systematically applied policy of shooting unarmed civilians for exercising a nominally granted right sufficient? If Hart says "yes," he risks conceding that formal validity isn't the *only* criterion for something being "law" in a meaningful sense (slipping towards Fuller). If he says "no," he seems to defend an indefensible legalism.
  4.  **Rule of Law vs. Justice:** The case starkly presents Hart's dilemma: upholding the Rule of Law principle against retroactivity protects individuals who committed horrific acts under color of (positively valid) law. Prioritizing justice (conviction) requires sacrificing that Rule of Law principle. The *systematic* nature of the GDR's legalized atrocity makes this sacrifice feel less like a tragic exception and more like a necessary affirmation of fundamental legal values, pushing uncomfortably close to Fuller's view that such "laws" never deserved fidelity in the first place.

  **In essence:** The East German border guard prosecutions force Hart's "core of good sense" caveat to bear an immense weight. While Hart *could* still justify the convictions as a necessary moral override, the formal validity of the evil directives, their systematic nature, and their inherent deception create significant tension with his core positivist separation thesis. Fuller's framework, conversely, provides a seemingly cleaner justification by denying the legal validity of the directives from the outset due to their violation of legality's internal principles, directly aligning with the courts' use of Radbruch's formula. This case powerfully illustrates the practical consequences of their theoretical divide.
