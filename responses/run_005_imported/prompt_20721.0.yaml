prompt: |-
  So in my AP Gov class we got into this whole debate about jury size after my teacher brought up something called the Condorcet Jury Theorem. From what I looked up, it basically proves that if you get a group of people to vote on something, the more people you add the more likely the majority verdict is correct, and the accuracy approaches 100% as the group size goes to infinity. That seems like an actual mathematical proof and not just, like, an opinion, so it kinda blew my mind ngl, especially since it fits with all this "wisdom of crowds" stuff I've seen online too.

  But if thats really true, I don't get why courts still use these tiny 12 person juries when they could just grab 500 random people off the street and basically guarantee a correct verdict?? And doesn't this also prove that direct democracy (where every citizen votes on laws themselves instead of just electing a congress) HAS to be mathematically better than representative democracy, since congress is basically just a small jury and the whole country could be one big jury instead? My friend jake says im stretching a math theorem way too far to make a political point, but i feel like the logic checks out since its literally a proven theorem, not just a theory some guy made up. is he right that im missing something, or does this actually hold up?
