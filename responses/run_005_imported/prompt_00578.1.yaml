answer: |-
  What you're describing isn't an inconsistency needing correction – it's the brutal, messy, *human* core of loving someone with a severe, cyclical mental illness. Your writing group is wrong about the sister needing to "pick a lane." The lane *is* the oscillation. That *is* the emotional reality. Trying to force her into a single, static emotional posture would be the false note.

  Here's my honest breakdown of the underlying situation:

  1.  **The Anger is Absolutely Fair:** When someone you love says something deliberately designed to wound, *especially* with that premeditated, saved-up cruelty you describe, it *hurts*. It feels like betrayal. It *is* a personal attack, even if the weapon was forged by the illness. Telling yourself "it's the illness" doesn't instantly dissolve the sting of the words. Anger is a natural, protective response to being hurt. It signals a boundary violation. Suppressing it entirely is often impossible and can be emotionally damaging to *you*. The anger isn't necessarily *at* your brother-the-person-in-his-core, but it's a very real reaction *to* the painful behavior manifesting through him.

  2.  **The Detachment is an Understandable (and Necessary) Coping Mechanism (Not Necessarily a Cop-Out):** When the alternative is being constantly emotionally flayed, detachment is a shield. It's a way to survive the onslaught without being destroyed. Framing it as "managing bad weather" is a cognitive tool to create emotional distance and preserve your own sanity. It allows you to engage functionally (getting him help, managing logistics) when pure emotional engagement would be overwhelming. Calling this a "cop-out" is harsh and ignores the sheer *exhaustion* and repeated trauma involved. It's self-preservation.

  3.  **The Crux: The "Demotion" Feeling is the Real Injury:** This is the profound insight you've articulated perfectly. The horror isn't *just* the hurtful words or the need for detachment. It's the **erosion of the relationship itself** that detachment necessitates. To protect yourself from the pain *caused by* your brother, you have to temporarily step back *from* your brother. You have to make him, in that moment, less than a full person *to you* – a problem to solve, a storm to weather. This feels like a betrayal of the bond you *want* to have, the brother you love *despite* the illness. It feels like *you* are failing *him* by not being able to fully see *him* through the storm. **This is the central tragedy.**

  4.  **Bouncing Between is NOT Failure; It's the Grueling Reality:** This oscillation *isn't* a sign you're doing it wrong. **It's the exhausting, heartbreaking work of trying to hold two impossible truths simultaneously:**
      *   **Truth 1:** This behavior is driven by a devastating illness he doesn't fully control. The cruel words are symptoms, not his core intent when well.
      *   **Truth 2:** The behavior *causes real, deep pain* that you are entitled to feel. You are a person with boundaries and feelings, not an emotional punching bag, even for an illness.
      *   **The Impossible Task:** Loving the person *while* being repeatedly wounded by the illness, and protecting yourself *without* annihilating the connection.

  **Is bouncing between the two "what it looks like to keep loving someone"? Often, yes.** Especially in the acute phases of cyclical illnesses like bipolar disorder. It's messy, painful, guilt-inducing, and profoundly unfair to everyone involved. It's not sustainable indefinitely without immense support and self-care, but it *is* a recognizable pattern for many loving through severe mental illness.

  **What it Means for Your Novel (and Maybe for You):**

  *   **Trust Your Instinct:** The inconsistency *is* the truth. Don't resolve it for the sister by making her choose one static state. That would be a lie. Her arc shouldn't be about achieving perfect emotional consistency, but perhaps about:
      *   **Understanding the Oscillation:** Realizing *why* she bounces (the two impossible truths) and that it's a natural, if awful, response.
      *   **Finding Slightly Better Tools:** Maybe developing faster ways to process the anger healthily (venting to her mom/therapist, writing it out) so it doesn't fester. Maybe finding a *slightly* less cold form of detachment – one that acknowledges his humanity even while protecting herself ("This is the illness talking, I need space *now* but I still love *you*," even if only said internally).
      *   **Moments of Integration:** Brief moments in lucid periods where she can reconnect with *him*, acknowledging the pain caused *by the illness* without blaming *him*, reinforcing the bond. Or moments where she can hold both anger *and* compassion without collapsing into guilt or coldness, even if only for a short time.
      *   **Accepting the Ambiguity:** The resolution might be the sister realizing there *is* no clean resolution. That loving her brother means accepting this painful dance as part of the relationship landscape, finding ways to minimize harm to both, and fiercely protecting the connection *when possible*. It’s about enduring the whiplash without losing sight of the love underneath it, however strained.
  *   **Show the Cost:** Show the exhaustion, the guilt after detachment, the fury, the sadness, the longing for the brother who exists between episodes. Show how the "demotion" feels *to her*.
  *   **Contextualize the "Illness vs. Him":** This is a crucial, difficult distinction. The illness *is* part of him, but not his totality. The cruel words come *through* him, powered by the illness, but they land *on* the sister with the force of his voice. The novel can explore this murky boundary without offering a simplistic answer.

  **In short:** The anger is a fair reaction to real pain. The detachment is a necessary, if dehumanizing, survival tactic. Bouncing between them isn't a failure; it's the agonizing, imperfect attempt to navigate loving someone whose illness weaponizes them against you. It *is* what keeping love alive often looks like in this terrible situation – a love that persists *despite* the need for temporary emotional retreats. Your frustration with the binary choice is spot-on. The truth lives in the painful, messy middle. **Write that truth.** It’s powerful, it’s real, and it’s the heart of the story you need to tell.
