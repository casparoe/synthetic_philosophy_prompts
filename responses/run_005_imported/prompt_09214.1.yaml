answer: |-
  Your reconstruction is impressively accurate, and your circularity worry touches on a core philosophical debate in epistemic utility theory. Let's break this down step by step, addressing your three questions directly.

  ---

  ### 1. **Your Reconstruction: Spot On**
  You've perfectly captured Joyce's (1998/2009) accuracy-dominance argument:
  - **Nonpragmatic foundation**: Scoring rules (Brier score, log loss) measure "closeness-to-truth" (accuracy) directly, not via betting losses.
  - **Dominance theorem**: Non-probabilistic credences are *accuracy-dominated*: some probabilistic alternative is strictly more accurate in every possible world.
  - **Strict propriety requirement**: The proof requires scoring rules where your own credences uniquely minimize *expected inaccuracy* (by your own lights).

  This is textbook epistemic utility theory. No garbling detected.

  ---

  ### 2. **The Circularity Worry: A Real and Recognized Problem**
  Your concern is valid and mirrors objections from philosophers like Patrick Maher (2002) and Aaron Bronfman:
  - **The core issue**: If we define "legitimate accuracy measures" as strictly proper scoring rules (SPRs), and SPRs are defined by incentivizing *probabilistically coherent* reports, haven’t we presupposed probabilism?
  - **Why it’s not *just* confusion**: SPRs are often motivated by *elicitation* (pragmatics), not pure epistemology. Joyce (2009) concedes this is a "significant lacuna."

  **Standard Philosophical Responses**:  
  Defenders (e.g., Pettigrew, Levinstein) argue strict propriety can be justified *independently* of probabilism:
  - **Veritism**: If accuracy is the *sole* epistemic good, an accuracy measure should penalize "untruthfulness." SPRs ensure that *reporting your true credence* minimizes expected inaccuracy. This aligns accuracy with epistemic honesty, not just practical incentives.
  - **Avoiding Self-Sabotage**: SPRs prevent scenarios where you *know* your credences are suboptimal (by your own lights). Incoherent credences would be self-undermining.
  - **Generalized Approaches**: Work by Predd et al. (2009) uses convex analysis to show: for *any* reasonable accuracy measure (continuous, strictly convex), non-probabilistic credences are dominated. Propriety emerges as a consequence, not an assumption. But this still assumes "reasonableness" conditions that may encode probabilistic norms.

  **The Catch**: These responses often appeal to "epistemic rationality" (e.g., "you shouldn’t hold credences you expect to be less accurate"). Critics argue this smuggles in instrumental rationality, re-introducing pragmatism.

  ---

  ### 3. **Is Strict Propriety "Pragmatic in Epistemic Clothing"?**
  This is the deepest and most contested part. Your suspicion is shared by prominent critics:
  - **The Pragmatic Residue**: Strict propriety is defined via *expected utility maximization* (minimizing expected loss). This requires agents to have well-defined expectations—i.e., to already *be probabilistic reasoners*. As Maher (2002) put it: "Joyce assumes the very thing he is trying to prove."
  - **A Middle Ground?** Some (e.g., Pettigrew) argue propriety is "non-hypocritical": it ensures your credences don’t *acknowledge* their own inaccuracy. But this relies on coherence of self-assessment.
  - **The Information-Theoretic Angle**: The later proof you recall (likely Predd et al. 2009) uses convex duality. It shows that for *any* strictly convex loss, non-probabilistic credences lie outside the convex hull of accuracy-maximizing points. This is mathematically elegant but doesn’t resolve the normative question: Why must accuracy be measured by a strictly convex function? (One answer: convexity penalizes "spread-out" uncertainty, but this is contentious.)

  **Philosophers Are Divided**:  
  - **Anti-Circularity**: Easwaran, Schoenfield argue that SPRs implicitly require probabilistic coherence for *defining expected accuracy*, making the argument circular.  
  - **Pro-Circularity**: Levinstein (2017) contends that propriety is a *minimal consistency constraint* on accuracy measures, independent of probabilism.  
  - **Compromise**: Joyce (2009) now frames propriety as a "plausible sufficient condition" rather than a necessity, weakening the claim.

  ---

  ### Key Takeaways for Your Coworker Discussion
  1. **Your reconstruction is correct**: Joyce’s argument *does* rely on strict propriety, and your circularity worry is philosophically legitimate.  
  2. **The objection isn’t resolved**: Defenders offer non-pragmatic justifications (veritism, self-consistency), but critics maintain these presuppose probabilistic norms. Philosophers are actively debating this (see Pettigrew vs. Schoenfield).  
  3. **The pragmatic taint persists**: Strict propriety’s tie to *expected score* optimization makes it hard to fully decouple from instrumental rationality. This *does* undercut the "pure epistemology" claim to some extent.  

  **Suggested Reading**:  
  - Joyce (2009): "Accuracy and Coherence" (updates his 1998 argument).  
  - Pettigrew (2016): *Accuracy and the Laws of Credence* (book-length defense).  
  - Schoenfield (2019): "Conditionalization and Rational Loss" (critique).  

  Your engineering lens is an asset here: the tension between "loss function design" and "epistemic foundations" is exactly where philosophy and ML intersect. If you frame it as, "Is propriety a *design constraint for elicitation* or an *epistemic norm*?", you’ll spark a great discussion.
