      "Planetary rulerships and dignities (each zodiac sign assigned a ruling planet, with exaltations and detriments)",
      "The notion that celestial configurations can compel human action, leaving no room for free will or providence"
    ],
    "grounds": [
      "Kepler defends aspects vigorously as geometrically based 'configurations' transmitting physical light/heat influences governed by harmonic ratios (Tertius Interveniens, Sect. XI; De Fundamentis, Prop. IX).",
      "He asserts planetary aspects (especially conjunctions) physically influence weather/climate via light and heat, a core 'scientific' part of his reformed astrology (Tertius Interveniens, Sects. VI, XI; De Fundamentis, Prop. LXXIII).",
      "Kepler accepts a physical 'imprint' on temperament at birth via planetary rays affecting the mother/fetus, but stresses this shapes inclinations, not destiny (De Fundamentis, Props. LXXV-LXXVII; Tertius Interveniens, Sect. XI).",
      "He partially endorses sign qualities as symbolic of seasonal effects on Earth's atmosphere, rejecting anthropomorphic traits but retaining elemental links to weather/temperament (De Fundamentis, Props. XXV-XXVII; Tertius Interveniens, Sect. XI).",
      "Kepler accepts a simplified house system (reducing it to angular relationships like Ascendant/MC) based on geometry and light angles, rejecting complex unequal divisions (De Fundamentis, Props. XLVIII-LII; Tertius Interveniens, Sect. XI).",
      "He vehemently rejects rigid benefic/malefic labels as anthropomorphic nonsense, arguing planetary effects depend entirely on context and aspect geometry (De Fundamentis, Props. X, XXVIII-XXX; Tertius Interveniens, Sect. XI).",
      "Kepler dismisses rulerships/exaltations as arbitrary human inventions lacking physical basis or geometric rationale (De Fundamentis, Props. XXXI-XL; Tertius Interveniens, Sects. V, XI).",
      "He most emphatically rejects celestial determinism, arguing aspects provide inclinations/opportunities, but reason, free will, and divine providence govern actions (Tertius Interveniens, Title Page, Sects. II, XI; De Fundamentis, Prop. LXXVII)."
    ]
  }
  ```

  **Key Rationale for the Ranking:**

  1.  **Aspects:** This is the absolute cornerstone of Kepler's reformed astrology. He grounds them in geometry (trigonometry), harmonics (musical intervals), and physics (light/heat rays). They are measurable, quantifiable, and causally plausible to him.
  2.  **Astrometeorology:** Directly extends the physical causality of aspects. Planetary rays (light/heat) demonstrably affect Earth's atmosphere, making weather prediction the most 'scientific' application for Kepler.
  3.  **Temperamental Imprint:** Accepts a *physical* mechanism (planetary rays affecting the fetus/newborn) but significantly dilutes its deterministic power, emphasizing it shapes tendencies, not fixed fate.
  4.  **Zodiac Signs (Qualities):** Grants them a *secondary*, derivative role based on seasonal solar effects on Earth's climate/atmosphere, stripping them of inherent stellar power or complex personality mappings.
  5.  **Houses:** Accepts *only* the most basic angular points (Ascendant, Midheaven) derived geometrically from the horizon/meridian, rejecting the elaborate traditional system as arbitrary.
  6.  **Benefic/Malefic:** Rejects the *inherent moral nature* of planets as anthropomorphic projection. Effects are purely physical and contextual (e.g., Saturn's coldness is harmful in some contexts, beneficial in others).
  7.  **Rulerships/Dignities:** Dismissed as completely arbitrary human conventions without any basis in physical reality, geometry, or observation – the epitome of the 'dross' he seeks to purge.
  8.  **Determinism/No Free Will:** His most vehement rejection on theological (Lutheran belief in Providence) and philosophical (human reason/free will) grounds. Celestial influences are only stimuli or conditions, never overriding causes of human choice.
