  Based on Kepler's explicit arguments in *De Fundamentis Astrologiae Certioribus* (1601) and *Tertius Interveniens* (1610), focusing on his stated reasons for acceptance or rejection, here is the ranking:

  ```json
  {
    "ranking": [
      "Planetary aspects (angular relationships such as conjunction, trine, square, opposition) as genuine, effective influences",
