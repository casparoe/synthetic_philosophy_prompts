answer: |-
  Here's a rigorous argument defending the adaptationist program against the charge of methodological bankruptcy based on the spandrels critique, hitting your two key points and incorporating relevant philosophy of biology:

  ### Core Argument: Spandrels Critique is Internal Corrective, Not External Refutation

  1.  **The Spandrels Identification Problem: It Requires Adaptationist Toolbox**
      *   **Premise:** Calling something a "spandrel" is *not* a neutral observation; it's a *positive claim* about evolutionary causation. It asserts that a trait exists primarily as a necessary consequence of the structure/development of *another* trait that *is* under direct selection (or neutral processes).
      *   **Argument:** To establish this claim rigorously requires the *same methodological toolkit* adaptationists use:
          *   **Comparative Analysis:** Identifying homologous traits across species, looking for correlations where the "spandrel" trait consistently appears only when the "primary" selected trait is present, regardless of apparent function (e.g., demonstrating the chin appears only with specific mandibular architecture).
          *   **Functional Analysis:** Showing the "spandrel" trait lacks *independent* functional capacity or that its form is poorly optimized compared to what selection *could* achieve if it were the target (e.g., demonstrating the poor mechanical design of the human birth canal relative to bipedalism's constraints).
          *   **Developmental Genetics:** Showing the "spandrel" trait arises mechanistically as an unavoidable byproduct of the developmental pathways building the primary selected trait (e.g., genetic linkage or pleiotropy forcing traits together).
          *   **Null Models & Hypothesis Testing:** Constructing models of development/structure predicting the byproduct trait *without* invoking selection *for it*, and testing this against adaptive hypotheses.
      *   **Conclusion (Point 1):** Identifying a spandrel isn't an escape from adaptationist reasoning; it's its *application*. It requires generating and testing specific hypotheses about causation using comparative, functional, and developmental evidence – the core methods of evolutionary biology, heavily utilized by adaptationists. The critique *depends* on the rigor it demands of adaptationism. It functions as an *internal corrective* ("Have you ruled out this non-adaptive explanation?") within the broader evolutionary research program, not as an external vantage point rendering the program bankrupt.

  2.  **The Vulnerability of Alternatives: "Just-So Stories" Apply Universally**
      *   **Premise:** Gould and Lewontin favored explanations like "developmental constraints," "phylogenetic inertia," and "historical contingency" as alternatives to pure adaptationism. These are causal hypotheses about evolutionary trajectories.
      *   **Argument:** These favored explanations are *equally susceptible* to the charge of being untestable "just-so stories" if pursued uncritically:
          *   **Developmental Constraints:** Asserting a trait exists "because of a developmental constraint" requires specifying *what* the constraint is, *how* it operates mechanistically, and crucially, *why* selection couldn't overcome it or work around it. Vague invocations of "constraints" can be unfalsifiable post-hoc explanations without concrete evidence (e.g., "The trait couldn't evolve further *because* of constraints" – but what constraints, specifically, and how do we know?).
          *   **Phylogenetic Inertia/Historical Contingency:** Explaining a trait as "a historical accident" or "legacy of ancestry" risks being a narrative that is difficult to falsify. How do we rigorously *test* "contingency" vs. adaptive explanation for a specific trait? Demonstrating deep homology isn't enough; it doesn't preclude *subsequent* adaptive refinement. Proving something is *solely* due to inertia/contingency requires ruling out *current* adaptive value and *past* adaptive origins, demanding the same burden of proof adaptationists face.
          *   **The Narrative Trap:** As Dennett argued, these explanations often take the form of historical narratives ("Because of event X long ago, followed by constraint Y, trait Z emerged"). While potentially true, these narratives can be just as "story-shaped," relying on plausibility and coherence rather than stringent prediction and testing, *if* researchers don't demand the same level of evidence they require for adaptive hypotheses. Gould himself was a master storyteller about contingency.
      *   **Conclusion (Point 2):** Gould and Lewontin's favored alternatives do not inherently possess greater methodological rigor or falsifiability than adaptationist hypotheses. They are *different types* of evolutionary explanations, but they are just as vulnerable to becoming untestable narratives if researchers fail to apply rigorous comparative, functional, developmental, and phylogenetic methods to generate specific, testable predictions and rule out alternatives (including adaptive ones). The "just-so story" charge cuts both ways.

  ### Addressing Burden of Proof & Falsifiability (Your Flatmate's Point)

  *   **Agreement:** Gould and Lewontin *were* correct that adaptationists historically often assumed adaptation as the *default* explanation without sufficiently testing against null hypotheses (like spandrels or drift). They rightly emphasized the *burden of proof* lies with those making a positive claim about adaptation.
  *   **Defense of Adaptationism:** This critique targets *poor practice* within adaptationism, not the core *methodology* itself. A rigorous adaptationist program *embraces* this burden:
      1.  Generates specific adaptive hypotheses (what selection pressure? what fitness advantage?).
      2.  Makes testable predictions (correlations, performance advantages, population genetic signatures).
      3.  Actively *seeks* evidence to *falsify* the adaptive hypothesis.
      4.  Explicitly *tests against* plausible non-adaptive alternatives (spandrels, drift, constraint).
  *   **Role of Spandrels:** The spandrels concept is a *crucial null hypothesis* that rigorous adaptationism *must* consider and attempt to falsify. Its existence doesn't bankrupt the program; it *improves* it by forcing better methodology. Calling "spandrel!" is only a valid rebuttal if accompanied by specific evidence for *why* it's a better explanation (using the tools above), not as a mere possibility.

  ### Godfrey-Smith's Framework: Nuance, Not Refutation

  *   **Empirical Adaptationism (EA):** The claim that natural selection is the *dominant* force shaping most phenotypic traits. *The spandrels critique most directly challenges EA by arguing significant traits are non-adaptive byproducts.* Your argument shows EA isn't *bankrupt*, but the critique forces a more nuanced view where EA needs strong evidence per trait.
  *   **Methodological Adaptationism (MA):** The claim that the best *way to do biology* is to look for adaptive function first. This is the key to your defense.
      *   **MA is NOT bankrupt:** MA is a powerful *heuristic*. Investigating potential function generates testable hypotheses, drives comparative work, and often reveals important biology *even if* the trait turns out to be a spandrel (e.g., studying the chin led to insights about jaw development). The spandrels critique *relies* on MA's toolkit to identify non-adaptive traits. MA guides research towards asking *why* questions that lead to deeper understanding, regardless of the ultimate answer (adaptation, spandrel, constraint). Abandoning MA as a starting point risks stagnation.
      *   **MA Evolves:** Modern MA incorporates the spandrels critique. It means "Look for function *first*, but rigorously test your hypothesis against strong non-adaptive alternatives like spandrels, using comparative/developmental evidence." This is a *strengthened*, not bankrupt, methodology.

  ### Summary Argument for Your Position

  1.  **Spandrel Identification is Adaptationist Work:** Declaring a trait a spandrel is a positive evolutionary claim requiring the same rigorous comparative, functional, and developmental analysis demanded of adaptationist hypotheses. It uses the adaptationist toolbox, proving the critique operates *within* the evolutionary program it critiques, not as an external refutation. It's an internal corrective mechanism.
  2.  **Alternatives Aren't Inherently More Rigorous:** Gould and Lewontin's favored explanations (constraints, contingency) are equally vulnerable to becoming unfalsifiable "just-so stories" if researchers rely on vague narratives without generating specific, testable predictions and evidence using the core methods of evolutionary biology. The critique of storytelling applies universally.
  3.  **Burden of Proof is Healthy, Not Bankrupting:** The spandrels paper correctly emphasized the burden of proof on adaptationists to *test* their hypotheses against alternatives. This improves adaptationist practice (Methodological Adaptationism - MA) by demanding falsifiability and comparative rigor. MA, strengthened by this critique, remains a vital, productive heuristic for discovery.
  4.  **Methodological Adaptationism Endures:** The spandrels critique challenges over-zealous *Empirical* Adaptationism (the dominance claim), but *Methodological* Adaptationism – the strategy of investigating function as a primary line of inquiry – is not bankrupt. It's a necessary engine for generating hypotheses and discoveries, now enhanced by the requirement to explicitly consider and test against non-adaptive explanations like spandrels using shared methodological standards.

  **Therefore, the spandrels critique does not demonstrate the adaptationist research programme is methodologically bankrupt. Instead, it exposes past methodological weaknesses (ignoring alternatives, insufficient testing) and mandates a more rigorous, self-critical application of the core evolutionary toolkit within adaptationism. It strengthens, rather than destroys, the program by forcing higher standards of evidence for *all* evolutionary explanations, adaptive or not.** Your flatmate's use of "spandrel" as a conversation-stopper, without providing evidence *for* the spandrel hypothesis using comparative/developmental reasoning, ironically commits the same sin the original paper criticized: asserting an explanation without meeting the burden of proof.
