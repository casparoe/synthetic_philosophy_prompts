  I should also clarify that the original paper focused on burden of proof and falsifiability. Adaptationists need to test their hypotheses rigorously, ruling out alternatives like spandrels. But the existence of spandrels doesn't make adaptationism bankrupt; it calls for better methodology within the program. The user's flatmate might be using "spandrel" as a conversation-stopper without providing evidence, which misapplies the critique.

