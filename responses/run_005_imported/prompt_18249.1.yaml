  For the first point, I should explain that calling something a spandrel isn't a default null hypothesis. It requires evidence, such as showing the trait is a necessary consequence of development or structure. For example, the chin in humans is often cited as a spandrel resulting from jaw evolution. But to establish that, researchers use comparative anatomy, developmental studies, and functional analyses—methods also used by adaptationists. So, the critique operates within the same methodological framework, not outside it.

