          So expected payoff: (1/2)*0 + (1/2)* [ if the other player in state Y chooses A: 3, otherwise: 0 ].
          But the other player, not knowing the state, might not choose A because of the risk that you don't have A.

     This is complex.

     Instead, consider a simpler coordination game with a public signal.

     Example from [Aumann and Maschler, 1995]: 
          In a zero-sum game, sometimes it is better not to know the outcome of a chance move (a coin toss) if the chance move is going to be revealed to both players.

     But that might not be what we want.

     I recall an example by Aumann in which it is better not to know a secret.

     Consider two friends, Alice and Bob, who are captured by the king. The king says: if both of you confess, you will be executed. If neither confesses, you will be set free. If one confesses and the other does not, the one who confesses will be set free and the other executed.

     This is the Prisoner's Dilemma? Not exactly:

          Confess / Confess: (death, death)
          Not confess / Not confess: (free, free)
          Confess / Not confess: (free, death) for the confessor and (death, free) for the non-confessor? 
          But typically, the one who confess implicates the other.

     Actually, the standard Prisoner's Dilemma has:

          (Confess, Confess): (-5, -5)   [5 years in jail]
          (Not, Not): (-1, -1)   [1 year in jail]
          (Confess, Not): (0, -10)   [confessor goes free, non-confessor gets 10 years]

     But the outcome we want: death penalty.

     Let's define:

          If both confess: death for both (payoff -100).
          If both do not confess: freedom (payoff 0).
          If one confesses and the other does not: the confessor gets freedom (0) and the non-confessor gets death (-100).

     This is the following matrix:

            Confess  Not
          +-------------+
  Confess | -100,-100 | 0, -100 |
          |------------|--------|
  Not     | -100, 0   | 0, 0    |
          +-------------+

     This is not a Prisoner's Dilemma because the payoffs for (Confess, Not) are (0, -100) and (Not, Confess) are (-100,0). The (Not, Not) is (0,0) and (Confess, Confess) is (-100,-100).

     The Nash equilibria are:
          (Confess, Confess): (-100,-100) and (Not, Not): (0,0). But also, (Confess, Not) is not an equilibrium because if the row player is confessing, the column player would want to confess to avoid -100 (getting -100 in any case) or not confess and get -100? If the row player confesses, then the column player's choices:
          - If she confesses: -100
          - If she does not: -100
          So she is indifferent. Similarly, if the row player does not confess, the column player's choices:
          - Confess: 0
          - Not: 0
          So she is indifferent.

     This game has many equilibria.

     But typically, they will both choose to not confess and get 0, if they can coordinate. Or they might both choose to confess and get -100.

     Now, suppose there is a chance that the king will not execute if both confess. Specifically, with probability 1/2, the king is in a good mood and will not execute even if both confess (then they both get 0), and with probability 1/2, the king is in a bad mood and will execute (both get -100) if both confess.

     The matrix in the good mood state:

            Confess  Not
          +-------------+
  Confess |  0,  0   | 0, -100 |
          |------------|--------|
  Not     | -100, 0   | 0, 0    |
          +-------------+

     In the bad mood state, the matrix is as above.

     Without any information, the players do not know the mood.

     Consider the symmetric equilibrium: both play Not. Then regardless of the mood, they get 0.

     If both play Confess, then in good mood they get 0, in bad mood they get -100. Expected: -50.

     So they prefer to play Not.

     Now, suppose Alice is told the mood of the king. Bob is not told, but knows that Alice knows.

     Can they sustain an equilibrium where Alice uses the information to their advantage?

     We might hope for an equilibrium where in good mood, Alice and Bob both play Confess (getting 0) and in bad mood, both play Not (getting 0). 
     But Bob doesn't know the mood. 

     Alice's strategy:
          In good mood: play Confess.
          In bad mood: play Not.

     Bob's strategy: 
          He has to choose without knowing the mood. 
          If he plays Confess:
              With probability 1/2 (good mood), Alice plays Confess -> they both get 0.
              With probability 1/2 (bad mood), Alice plays Not -> then Bob gets 0 (because (Confess, Not) gives the confessor 0) and Alice gets -100.
              So Bob gets 0.
          If he plays Not:
              With probability 1/2 (good mood), Alice plays Confess -> then (Not, Confess) gives the non-confessor -100.
              With probability 1/2 (bad mood), Alice plays Not -> they both get 0.
              So Bob's expected payoff: (1/2)*(-100) + (1/2)*0 = -50.

          Therefore, Bob will play Confess and get 0.

     Then, in good mood: (Confess, Confess) -> (0,0)
     In bad mood: (Not, Confess) -> Alice gets -100, Bob gets 0.

     Alice's expected payoff: 
          (1/2)*0 (good mood) + (1/2)*(-100) (bad mood) = -50.

     Without the signal, if they both played Not, Alice would have gotten 0.

     So Alice is worse off by having the information.

     Moreover, note that if Alice could commit to not using the information (i.e., always play Not), then they would both play Not and she would get 0. But with the information, she cannot resist playing optimally in each state, which leads to an expected -50.

     This is the example we want.

     In this example, Alice is a Bayesian agent. Her expected payoff is strictly lower because she has the information.

     Therefore, we have argued that in strategic settings, information can have negative value.
answer: |-
  The generalization that a rational Bayesian agent should always value additional information non-negatively, even in strategic interactions, is challenged by scenarios where information can harm the agent by altering others' behavior. A concrete example is a **coordination game with uncertain enforcement**, adapted from the "king's mood" scenario.

  ### Scenario Setup
  - **Players**: Alice and Bob are prisoners.
  - **King's Mood**: With equal probability, the king is in a **good mood** (probability 1/2) or **bad mood** (probability 1/2). This determines the enforcement of punishment:
    - **Good Mood**: If both confess, both are freed (payoff 0). If one confesses and the other does not, the confessor is freed (0) and the non-confessor is executed (payoff -100). If neither confesses, both are freed (0).
    - **Bad Mood**: If both confess, both are executed (payoff -100). If one confesses, the confessor is freed (0) and the non-confessor is executed (-100). If neither confesses, both are freed (0).
  - **Actions**: Each player chooses to **confess (C)** or **not confess (NC)**.
  - **Information Asymmetry**: 
    - **Base Case (No Information)**: Neither knows the mood. The game is symmetric.
    - **Informed Alice**: Alice learns the mood costlessly. Bob does not know the mood but knows Alice knows it.

  ### Analysis
  #### **1. Without Additional Information (Symmetric Ignorance)**
     - Both players are ignorant of the mood.
     - **Equilibrium**: Both choose **NC** (not confess). 
       - If both play **NC**, payoff is 0 regardless of mood.
       - If either unilaterally deviates to **C**, they risk -100 (if the other plays **NC**) or -100 (if both **C** in bad mood). The expected payoff from deviating is negative.
     - **Payoff**: Both receive **0** in expectation.

  #### **2. With Alice Informed**
     - Alice knows the mood; Bob knows Alice knows but remains ignorant.
     - **Alice's Strategy** (Bayesian rational):
       - In **good mood**, play **C** (if Bob plays **C**, both get 0; if Bob plays **NC**, Alice gets 0).
       - In **bad mood**, play **NC** (if Bob plays **C**, Alice avoids -100; if Bob plays **NC**, both get 0).
     - **Bob's Strategy** (best response):
       - If Bob plays **C**:
         - In good mood (50%), Alice plays **C** → Bob gets 0.
         - In bad mood (50%), Alice plays **NC** → Bob gets 0 (since **C** vs. **NC** yields 0 for confessor).
         - *Expected payoff = 0*.
       - If Bob plays **NC**:
         - In good mood (50%), Alice plays **C** → Bob gets -100.
         - In bad mood (50%), Alice plays **NC** → Bob gets 0.
         - *Expected payoff = (1/2)(-100) + (1/2)(0) = -50*.
       - Bob prefers **C** (expected payoff 0 > -50).
     - **Outcomes**:
       - **Good mood**: Alice plays **C**, Bob plays **C** → both get 0.
       - **Bad mood**: Alice plays **NC**, Bob plays **C** → Alice gets -100, Bob gets 0.
     - **Alice's Expected Payoff**: 
       - (1/2)(0) + (1/2)(-100) = **-50**.

  ### **Result**
  - Alice's expected payoff **decreases from 0 to -50** because she becomes informed.
  - **Why?** 
    - Information forces Alice to condition her strategy on the mood, which signals her knowledge to Bob.
    - Bob, strategically, always confesses to avoid the risk of -100 (since Alice's **NC** in bad mood makes confessing safe for him).
    - In bad moods, Alice is exploited: her non-confession is met with Bob's confession, leading to her execution.
  - This violates the non-negative value of information: Alice is strictly worse off due to her knowledge, which triggers Bob's harmful response.

  ### **Conclusion**
  In strategic settings, information can have **negative value** if its acquisition (or others' awareness of it) alters opponents' behavior in detrimental ways. Here, Alice's information eliminates the Pareto-optimal equilibrium (both playing **NC**), leaving her vulnerable in bad moods. This illustrates that Good’s theorem does not universally extend to multi-agent games, as rational Bayesian agents can suffer from information-induced strategic shifts.
