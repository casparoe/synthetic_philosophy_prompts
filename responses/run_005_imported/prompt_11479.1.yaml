  First, I need to acknowledge how overwhelming this must be for a teenager. Beyond the grief, there's ethical tightrope-walking involved. The core challenge is balancing three things: grandpa's non-negotiable stance that his copies had equal artistic value, Carol's lived experience of harm, and avoiding any tone of celebration or defensiveness.

