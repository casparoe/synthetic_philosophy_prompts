answer: |-
  ## The Empty Auditorium: A Dialogue on Grief and Disorder

  **Setting:** A slightly too-bright hospital auditorium after grand rounds on Prolonged Grief Disorder (PGD). Chairs are askew. Coffee cups litter a side table. DR. ELARA VANCE (Naturalist, Boorsean) and DR. MARCUS ROSSI (Normativist, Nordenfelt/Canguilhem lineage) remain, locked in debate.

  **DR. VANCE:** ...so the core dysfunction, Marcus, is clear. The mammalian attachment system – a deeply conserved biological mechanism – is designed to recalibrate after loss. Specific neurobiological pathways, hormonal responses, cognitive reappraisal processes *should* shift from acute distress towards integrated memory within a species-typical timeframe. PGD represents a failure state: those mechanisms are stalled, statistically subnormal for the reference class. It’s no different than a wound failing to heal.

  **DR. ROSSI:** (Leans forward, gesturing emphatically) Elara, that sounds neat, biologically tidy. Then why the glaring clause? Criterion E: the grief must be “out of proportion or inconsistent with cultural, religious, or age-appropriate norms.” Explain *that* on purely biological grounds. If it’s a ‘failure state’ of a universal mechanism, why does its *disorder* status hinge on what Aunt Mildred or the village shaman expects? You’ve smuggled normativity right into the heart of your supposedly value-free diagnosis!

  **DR. VANCE:** It’s calibration, not capitulation! The *expression* of grief, its intensity and duration, *is* mediated by environment and learning. The biological dysfunction is the *underlying failure to adapt*, the persistent, impairing activation despite the passage of time typically required for that adaptation *within the species*. The cultural clause contextualizes the *manifestation*. We’re assessing if the observed distress reflects a pathological *internal* state, not just an appropriate external response. A year of intense grief might be normative in one context, dysfunctional in another – but the *dysfunction itself*, the stalled mechanism, is the biological fact.

  **DR. ROSSI:** Ah, the species-typical timeframe! But what defines that? Statistically? What if an entire cohort *does* stall? Imagine survivors of that devastating pandemic wave you mentioned earlier. After a year, 40% are still consumed by yearning, disbelief, impairment. By your statistical lights, that becomes the new ‘normal’ for *that* reference class – survivors of Catastrophe X. Suddenly, their identical suffering isn’t dysfunctional anymore? It’s just… statistically average? So we withhold diagnosis and treatment because the dysfunction became too common? That’s absurd! It reveals the bankruptcy of reducing disorder to mere statistical deviation. Suffering isn’t negated by a headcount.

  **DR. VANCE:** (Pauses, fingers tapping the table) That’s a fair challenge. But it misapplies the reference class. ‘Survivors of Catastrophe X’ isn’t a biologically relevant class like ‘human females aged 30-40’. The relevant class is defined by age, sex, and species, precisely to filter out massive environmental disruptions that *do* alter normal function. The grief mechanisms *themselves* are malfunctioning in those individuals – they aren’t adapting *even relative to the extreme stressor*. Their suffering *is* statistically subnormal *for humans experiencing loss*, even catastrophic loss. We’d expect heightened distress, but not indefinite, impairing stasis in the majority. If it *were* the majority… (she trails off thoughtfully).

  **DR. ROSSI:** If it were the majority, you’d have to concede it’s a ‘normal’ human response to that horror, biologically speaking. Which brings us back to values. We *call* it a disorder because we *value* adaptation, functionality, moving forward. Which is my point! But let’s turn your cultural clause against *me*. Consider someone from a community where lifelong, profound mourning for a lost child is not just accepted, but *expected*, a vital goal – a sacred duty. She yearns constantly, avoids work, withdraws from others, sleeps fitfully. By clinical measures, she’s severely impaired. Yet, in her context, she’s fulfilling her highest purpose. According to Nordenfelt, health is achieving vital goals under standard circumstances. Her circumstances include these cultural expectations. Is she healthy? Do I, as a normativist, *have* to withhold the PGD diagnosis simply because her community endorses her suffering as meaningful?

  **DR. VANCE:** (Eyes sharpening) Precisely the question. Does your theory force you to call this profound impairment ‘health’? If so, haven’t you sacrificed the individual’s wellbeing entirely to social consensus? If not, what’s your escape hatch? You must be smuggling in some notion of universal harm or biological malfunction yourself!

  **DR. ROSSI:** (Sighs, then leans back) It’s messy, Elara. Nordenfelt’s ‘vital goals’ aren’t *infinitely* malleable by culture. Basic goals like maintaining bodily integrity, avoiding severe pain, forming *some* meaningful connections – these are arguably universal. Your mourner might be achieving her culturally prescribed goal of perpetual grief, but she’s failing at the vital goal of maintaining sufficient physical and psychological integrity to engage with *any* other aspect of life. She’s a ghost. That *is* harm, regardless of cultural blessing. The impairment *matters*. It’s not biological malfunction in your Boorsean sense, perhaps, but a profound failure to achieve a range of basic human capabilities necessary for *any* form of flourishing, even within a mourning-centric life. The cultural context defines the *meaning* of the grief, not the *devastating impact* of total functional collapse.

  **DR. VANCE:** But ‘functional collapse’ implies a standard of function! What is ‘function’ here if not rooted in biological capacity? You appeal to ‘basic human capabilities’ – maintaining integrity, forming connections. Aren’t those capabilities grounded in our biology? Their *failure* is what creates the harm you identify. You’ve just invoked a hybrid – harm defined by thwarting capabilities rooted in our biological nature. It sounds suspiciously like you need both values *and* facts about human organisms.

  **DR. ROSSI:** And you, Elara, need values to decide *which* biological deviations we label ‘disorders’ worthy of clinical attention. Why is stalled grief-processing a ‘failure state’? Because we value moving on! Because indefinite, impairing sorrow conflicts with human flourishing as we understand it. Your ‘species-typical contribution to survival and reproduction’ – isn’t the very *selection* of which functions matter for ‘disorder’ based on values? Survival and reproduction are *our* fundamental values! The cultural clause in PGD is just an explicit admission that the *threshold* for declaring this biological glitch a *disorder* requires a normative judgment about social expectations. Your biology sets the stage, but values write the diagnosis.

  **DR. VANCE:** The *threshold* for intervention, perhaps. But the underlying dysfunction exists independently. We don’t invent the stalled mechanism; we discover it. The cultural clause helps us *discern* if the observed distress *is* evidence of that dysfunction, rather than an appropriate cultural performance. It’s epistemological, not ontological. The dysfunction itself is the biological fact.

  **DR. ROSSI:** And I maintain that calling it a ‘dysfunction’ rather than a ‘biological variation’ is already a value-laden choice, driven by the harm it causes in contexts *we* deem important. Your war survivors – if their grief *is* the new normal, perhaps it’s not dysfunction, but a tragic adaptation. We treat it because we value restoring a *different* kind of function, one aligned with *our* norms of recovery. The biology doesn’t dictate the goal; our goals interpret the biology.

  **DR. VANCE:** So we treat suffering only when it aligns with *our* preferred statistical norms or cultural goals? That seems… paternalistic. The mourner fulfilling her duty but wasting away – do we deny her help because her culture blesses her collapse?

  **DR. ROSSI:** No! As I said, her collapse thwarts *other* vital goals – basic physical and mental integrity. But identifying *those* goals involves a normative framework about human needs, not *just* a deviation meter. It’s the entanglement, Elara. You can’t purify it. The PGD criteria show it. Your war survivors highlight it. My devout mourner underscores it. We’re stuck judging lives, not just measuring biology.

  *(A distant door slams. The silence in the auditorium feels heavier. Neither looks entirely satisfied, nor defeated. They gather their things, the argument suspended, not settled.)*
