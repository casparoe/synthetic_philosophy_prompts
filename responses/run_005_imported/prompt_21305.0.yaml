answer: |-
  You've nailed a core critique of NHST (Null Hypothesis Significance Testing) and the role of p-values in the replication crisis, but the solution is more nuanced than "Bayesian good, Frequentist bad." Let's break it down:

  **Where You're Absolutely Right:**

  1.  **p < 0.05 as a Ritual:** The Bem saga is a canonical example of how flexible analysis, p-hacking, and publication bias can produce statistically "significant" (p<.05) results for phenomena that likely don't exist (ESP). It demonstrated how the ritualistic pursuit of p<.05, divorced from effect size, prior plausibility, and methodological rigor, leads to false positives.
  2.  **Structural Weaknesses of NHST:**
      *   **Ignores Prior Probability:** NHST doesn't incorporate how likely the hypothesis was *before* seeing the data. Testing an implausible claim (like ESP) requires *extraordinary* evidence. p<.05 isn't extraordinary evidence for an extraordinary claim. Bayesian methods *force* you to state a prior.
      *   **Misinterpretation:** p-values are notoriously misunderstood (e.g., "p=.05 means there's a 5% chance the null is true"). This fuels bad decision-making.
      *   **Focus on Null:** NHST only tells you if the data is *surprising* under the null, not how well it supports a specific alternative hypothesis. Bayes Factors directly compare the evidence for H1 vs H0.
      *   **Sensitivity to Stopping Rules:** Sneakily peeking at data and stopping when p<.05 (optional stopping) invalidates the p-value but is common and hard to police. Bayesian updating handles sequential analysis more naturally.
  3.  **Wagenmakers' Reanalysis as Smoking Gun:** This was pivotal. It showed that when you properly account for the *extreme* prior implausibility of ESP (using informed priors), the same data that yielded "significant" p-values actually provided only weak evidence *for* ESP, and sometimes even evidence *against* it. This exposed the fundamental flaw in relying *only* on p<.05 for implausible claims.
  4.  **Bayesian Methods as a Partial Antidote:** Bayesian statistics, particularly using Bayes Factors with *skeptical* or *informed* priors, would have made it much harder for findings like Bem's to be interpreted as strong evidence. Requiring researchers to state their priors upfront increases transparency and forces consideration of plausibility.

  **Why "Just Switch to Bayes" Isn't a Magic Bullet (and Discounting Pre-2015 Findings is Too Harsh):**

  1.  **Bayes Isn't Immune to Problems:**
      *   **The Prior Problem:** The *biggest* criticism of Bayes in this context is: **Who chooses the prior, and how?** An overly enthusiastic researcher can choose an unreasonably optimistic prior to make weak evidence look strong. A hyper-skeptical reviewer can choose an unrealistically skeptical prior to dismiss strong evidence. "Honest priors" are ideal but subjective and contestable. The *debate* just shifts from "Is p<.05?" to "Is that prior reasonable?".
      *   **"Hacking" Bayes Factors:** Just like p-values, Bayes Factors can be influenced by analytical flexibility (model specification, prior choices, data cleaning). Publication bias favoring high BF values would still be a problem.
      *   **Computational Complexity & Interpretation:** Bayesian methods were historically harder to compute and interpret correctly than a simple t-test, though this barrier is rapidly falling.
  2.  **The Replication Crisis Was Multi-Factorial:** P-values were a major enabler, but the crisis stemmed from a toxic cocktail:
      *   **Publication Bias:** Journals only publishing "significant" results.
      *   **P-Hacking/QPRs:** Exploiting researcher degrees of freedom until p<.05.
      *   **Low Statistical Power:** Small sample sizes increasing false negatives *and* inflating effect sizes of false positives that *do* get published.
      *   **Incentive Structures:** Pressure to publish novel, positive findings for careers and grants.
      *   **Methodological Rigor:** Issues like poor measurement, lack of pre-registration, inadequate experimental control.
      *   **File Drawer Problem:** Non-significant results disappearing.
      **Fixing this requires systemic change beyond *just* the statistical paradigm:** pre-registration, registered reports, larger samples, focus on effect sizes and CIs, replication efforts, methodological transparency. Bayesian methods are *part* of the solution, but not the *whole* solution.
  3.  **Not All Pre-2015 NHST Findings Are Junk:** Many robust, replicated findings *were* established using NHST. Throwing out everything pre-2015 ignores:
      *   **Large Effect Sizes & Direct Replication:** Findings with large effects that have been directly replicated multiple times (even with NHST) are likely robust.
      *   **Converging Evidence:** Findings supported by multiple methodologies and labs.
      *   **Plausibility:** Findings grounded in strong theory and prior biological/psychological knowledge.
      *   **Good Methodology:** Studies with excellent design, large samples, pre-specified analyses (even if formal pre-registration wasn't common).
  4.  **Bayesian Papers Aren't Automatically Trustworthy:** A paper reporting a high Bayes Factor using an unreasonably optimistic prior is just as suspect as a p-hacked p<.05. You *must* evaluate the reasonableness of the prior and the methodological rigor.

  **A More Nuanced Approach:**

  1.  **Be Highly Skeptical of Pre-2015 Findings Characterized By:**
      *   **Small effect sizes** (especially if just barely p<.05).
      *   **Implausible or "sexy" claims** (power posing, ESP, many priming effects).
      *   **Questionable methods** (small N, vague hypotheses, many researcher degrees of freedom).
      *   **Lack of direct replications.**
      *   **No consideration of effect size or power.**
  2.  **Look for Signs of Robustness in *Any* Paper (Pre or Post 2015):**
      *   **Large, pre-registered, well-powered studies.**
      *   **Direct and conceptual replications.**
      *   **Transparent data and code.**
      *   **Sensible effect sizes** with confidence/credible intervals.
      *   **Converging evidence from different methods/labs.**
      *   **Plausibility within existing theoretical frameworks.**
  3.  **When Evaluating Bayesian Papers:**
      *   **Scrutinize the Priors:** Are they justified? Are they reasonable? Are sensitivity analyses shown (how results change with different reasonable priors)?
      *   **Don't treat BF > X as an automatic "truth" threshold:** Interpret the strength of evidence continuously (e.g., BF 3-10: Moderate, 10-30: Strong, 30-100: Very Strong, >100: Extreme). Context and prior matter immensely.
      *   **Look for the same methodological rigor as above.**
  4.  **Value NHST Papers That Do It Right:** Papers that emphasize effect sizes and confidence intervals, report power analyses, acknowledge limitations, and ideally are pre-registered, are still valuable, even if they use p-values.

  **Conclusion:**

  Your core insight is correct: **The uncritical reliance on p < .05 within the NHST framework, especially for novel/implausible claims, was a major structural driver of the replication crisis. Bayesian methods, particularly Bayes Factors with skeptical priors, are a powerful tool to mitigate this specific problem by forcing consideration of prior plausibility and providing direct evidence comparisons.**

  **However, it is an overstatement to say that *only* using Bayesian methods would have prevented the crisis.** The crisis had deep systemic roots beyond statistics. Bayesian methods introduce their own challenges (the subjectivity of priors), and robust science depends far more on methodological rigor, transparency, and incentives than on any single statistical paradigm.

  **Instead of automatically discounting *all* pre-2015 p-value papers and trusting *all* Bayes Factor papers, cultivate a critical eye for:**

  1.  **Methodological Quality** (the most important factor).
  2.  **Prior Plausibility** (especially for surprising claims).
  3.  **Effect Size & Precision** (CIs/CrIs).
  4.  **Replication Evidence.**
  5.  **Transparency** (pre-registration, data/code).
  6.  **For Bayesian papers: The reasonableness and justification of priors.**

  The replication crisis taught us to be skeptical of isolated, underpowered, p-hacked, implausible findings regardless of the stats used. Bayesian methods are a significant step forward in statistical practice, but they are not a magic wand that makes all new science reliable or all old science worthless.
