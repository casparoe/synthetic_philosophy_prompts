answer: |-
  Here’s a speech that threads the needle—honoring your sister’s intellectual rigor while keeping it warm, funny, and accessible. It uses her "convention-laden promise" line as the spine, turning it sincere at the end without betraying her philosophy:

  ---

  **(Clink glass gently, warm smile)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], [Sister's Name]’s sister—and more importantly today, her slightly terrified maid of honor. When she asked me to do this, she gave me one firm rule: *No starry-eyed clichés*. No ‘love is written in the stars,’ no ‘fate brought you together’... which, honestly, was a relief. Because if there’s one thing my sister has taught me, it’s that the things that matter most aren’t magic. They’re chosen. Deliberately, thoughtfully, and sometimes… *very* conventionally."  

  **(Light, knowing chuckle)**  
  "Some of you might know my sister is finishing her PhD in philosophy. And without diving into the weeds—*promise*, no footnotes—her work is all about why promises *bind*. Why saying ‘I promise’ actually *means* something. She argues it’s not some mystical force… but something beautifully, practically human. It’s about two people stepping into a shared understanding, a practice built by centuries of people saying ‘I will,’ and meaning it. In fact…" **(lean in conspiratorially)** "...she has this line she uses at family dinners, usually while dissecting wedding vows: **‘A wedding is the single most convention-laden promise a person can make.’**"  

  **(Gesture broadly at the room: officiant, flowers, guests)**  
  "Just look around! The officiant! The rings! The paperwork filed at some county office! The fact that we’re all dressed like we raided a bridal magazine! Centuries of ritual, right here in this room. And my sister? She *loves* this. She sees every ribbon, every ‘I do,’ every awkwardly posed photo as part of this grand, shared practice of commitment. It’s not just tradition for tradition’s sake—to her, it’s the scaffolding that lets two people build something massive and real."  

  **(Shift to affectionate teasing)**  
  "And honestly? This tracks. This is the woman who, at age 12, made me sign a *contract* about borrowing her sweaters. Who analyzes the ‘social practice’ of splitting the last slice of pizza. Who once spent 20 minutes debating whether ‘I’ll call you tomorrow’ constitutes a *true* promise if you’re in a different time zone. So yes. This ceremony? **The single most convention-laden promise.** Checkmate. Case closed."  

  **(Pause, soften tone. Look at your sister & partner)**  
  "But here’s the thing she also knows—and why this matters. Conventions aren’t cages. They’re tools. They’re the stage, not the play. Because all these rituals?" **(Gesture to the wedding elements)** "...They only work if two people step onto that stage *knowingly*. If they trust the practice, and crucially, trust *each other* to uphold it. **That’s** what makes ‘I promise’ heavy. Not the stars. Not fate. But two people, looking at each other, saying: *‘I choose you. I trust you. And I’m saying it here, like this, because it matters.’*"  

  **(Raise glass to the couple)**  
  "So, [Sister's Name], you were right. This *is* the single most convention-laden promise. And because of that—because of every ritual, every rule, every piece of paper signed today—what you and [Partner's Name] have built together is *undeniable*. It’s witnessed. It’s anchored. It’s real. But we all know the weight doesn’t come from the ceremony. It comes from you two. From the trust you’ve nurtured, the choices you make daily, the love that turns all this convention into something uniquely, brilliantly yours."  

  **(Warm, sincere smile)**  
  "So let’s raise a glass. To [Sister's Name] and [Partner's Name]. May your incredibly, gloriously, convention-laden promise today be the foundation for a lifetime of choosing each other—paperwork, rituals, shared practices, and all."  

  **To [Sister's Name] and [Partner's Name]!**  

  ---

  ### Why This Works
  1.  **Philosophy for Insiders:** Philosophers will instantly recognize the Hume/Scanlon debate. Using "shared practice," "knowingly invoke," "scaffolding," and contrasting "mystical force" vs. "practical" signals engagement with her work. The "contract" and "pizza" jokes are classic philosophy-grad humor.
  2.  **Accessible for Everyone:** No jargon. The wedding itself becomes the illustration of "convention." Teasing about contracts and pizza makes it human. The core message—love is built on choice and trust—is universal.
  3.  **Honors Her View:** The ending explicitly links the convention ("stage") to the couple's agency and trust ("the play"). It agrees the convention *enables* the weight, but roots the *value* in their mutual commitment and choice. This avoids Scanlon's "inherent wrongness" and centers Humean mutual advantage/trust within a practice.
  4.  **The Running Joke:** "The single most convention-laden promise" appears twice verbatim and is reinforced visually ("look around!"). Ending by *toasting* to their "incredibly, gloriously convention-laden promise" turns it sincere – celebrating the structure *they* chose to make their commitment profound and real.
  5.  **Avoids Clichés:** No stars, fate, or unexplained magic. Focuses on choice, trust, and shared effort within a meaningful structure.
  6.  **Tone:** Warm, affectionate, slightly teasing (as siblings are), building to genuine sincerity. The 5-minute length keeps it focused.

  **Delivery Tip:** Lean into the affectionate exasperation when teasing her about contracts/pizza. Pause meaningfully before "But here’s the thing..." to shift into sincerity. Look at her and her partner during the final paragraph. The philosophers will nod; everyone else will feel the love. Good luck!
