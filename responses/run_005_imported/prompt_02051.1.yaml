answer: |-
  This is a razor-sharp question that cuts to the heart of Popper's philosophy and its practical challenges. Your friend's "falsifiability" shrug misses the profound tension you've identified. Let's unpack what Popper *actually* argued and how it interacts with the replication crisis and its solutions:

  1.  **Pre-Registration as Popperian Institutional Engineering:**
      *   **The Core Alignment:** Popper would have **strongly endorsed pre-registration** as a direct institutional weapon against what he called **"conventionalist stratagems"** or **"immunizing manoeuvres."** His central fear was that theories could be shielded from refutation by post-hoc adjustments – redefining the hypothesis, moving the goalposts, blaming measurement error *only after* a negative result, or engaging in HARKing (Hypothesizing After Results are Known).
      *   **Nailing Down Falsifiers:** Pre-registration forces scientists to specify *in advance* the specific experimental outcome(s) that would constitute a **potential falsifier** of their hypothesis. This operationalizes Popper's demand that a scientific theory must be *testable* – it must forbid certain observable states of affairs. By locking in the prediction and analysis plan *before* data collection, pre-registration makes it much harder to reinterpret a null finding or failed prediction as anything *other* than a potential problem for the hypothesis. It turns the *logical* requirement of falsifiability into a *procedural* safeguard.
      *   **Combating "Ad Hoc" Rescues:** Popper distinguished between "ad hoc" hypotheses (those introduced *solely* to save a theory from falsification and not independently testable) and legitimate auxiliary hypotheses. Pre-registration directly targets the *ad hoc* variety. If a researcher, *after* seeing a failed replication, suddenly claims "Ah, but my theory only works for participants who scored high on trait X, which we didn't measure!" Popper would cry foul as a "conventionalist twist." Pre-registration demands such moderators or boundary conditions be specified *a priori*, making them independently testable predictions rather than convenient escape hatches. A post-hoc auxiliary claim introduced *only* to explain failure would be glaringly obvious against the pre-registered plan.

  2.  **The Replication Crisis and the Hole in the Framework (Duhem-Quine Problem):**
      *   **The Inescapable Problem:** Popper was acutely aware of the **Duhem-Quine thesis** – that theories are tested in bundles with auxiliary assumptions (about instruments, experimental setup, ceteris paribus clauses, etc.). A failed experiment logically falsifies *at least one element* of this bundle, but not necessarily the core theory itself. The replication crisis *vividly* exposes this problem. Failed replications are rarely clean kills. Researchers *can* (and do) legitimately question: Was the replication method *truly* identical? Was the operationalization valid? Was the sample sufficiently similar/powered? Was there an unknown moderator?
      *   **Popper's Response & Its Limits:** Popper didn't ignore this. His solution was **methodological:**
          *   **Test Auxiliaries Independently:** Scientists should strive to test auxiliary assumptions *separately*. If you blame a failed replication on a faulty measure, *that measure itself must be testable*.
          *   **Avoid Ad Hoc Adjustments:** Crucially, he insisted that adjustments made to save a theory *must not decrease its testability* and ideally *increase* it. Introducing a new, independently testable auxiliary hypothesis that *also* makes novel predictions is acceptable. Introducing an untestable excuse is not.
          *   **Degrees of Testability (Corroboration):** Popper emphasized that theories have **"degrees of falsifiability"** or **testability**. A bold, precise theory that forbids many states of the world (e.g., "Precognition effect size d=0.5 in this specific paradigm") is *highly testable*. A vague theory ("There's *some* psi effect somewhere, sometimes") is *poorly testable*. Failed replications *do* decrease a theory's **degree of corroboration**, even if they don't deliver a logical death blow. Repeated failures, especially across varied attempts to control for different auxiliaries, make the core theory look increasingly untenable *in practice*, forcing proponents to either specify it more precisely (increasing testability) or abandon it.
      *   **Why the Crisis Exposes a Hole:** The replication crisis shows how *difficult* it is to implement Popper's methodological prescriptions rigorously in complex, multivariate fields like psychology:
          *   **Untestable Auxiliaries:** Many potential auxiliary excuses (subtle context effects, cohort differences, "file drawer" problems in the original) are *extremely hard* to test independently or conclusively rule out.
          *   **Vague Theories & Operationalizations:** Many psychological theories are inherently vague (e.g., about constructs like "ego depletion" or "priming"). This low initial testability makes it *easier* to propose plausible-sounding auxiliaries to explain failures. Bem's precognition work, while seemingly bold, arguably suffered from operationalizations open to multiple interpretations and methodological critiques.
          *   **Incentives vs. Methodology:** Popper's framework relies on scientists *voluntarily* subjecting their theories to severe tests and accepting negative results. The replication crisis revealed systemic incentives *against* this (publication bias, pressure for novelty, tenure metrics). Pre-registration helps, but doesn't eliminate the temptation to interpret ambiguous replication failures in a theory-saving light.

  **Popper's Likely Synthesis:**

  1.  **Pre-registration as Essential:** He would see pre-registration (and Registered Reports) as a **necessary and powerful institutional innovation** directly embodying his core methodological rule: Specify your potential falsifiers *in advance* and stick to the test. It drastically reduces the scope for conventionalist stratagems *at the point of initial discovery*.
  2.  **Replication as Crucial Corroboration Assessment:** He would view the replication movement as absolutely vital. While a single failed replication doesn't logically falsify a theory (Duhem-Quine), multiple rigorous, pre-registered replication attempts *systematically lowering the degree of corroboration* are the practical engine of scientific progress. They force theories to become more precise (increasing testability) or be abandoned.
  3.  **The Enduring Challenge of Auxiliaries:** He would acknowledge that the crisis highlights the **practical difficulty** of cleanly applying falsificationism, especially in fields with complex, often vaguely defined subject matter and constructs. He would likely argue this doesn't invalidate falsifiability as a *logical criterion* or *regulative ideal*, but underscores the need for **even greater methodological rigor**: clearer theorizing, more precise operationalizations, explicit testing of auxiliary assumptions wherever possible, and systemic incentives aligned with severe testing.
  4.  **Bem as a Case Study:** Bem's work would be a prime example for Popper. The initial "success" might be seen as a failure to specify *sufficiently severe* potential falsifiers or control for auxiliaries *in advance*. The subsequent failed replications massively decreased its corroboration. Defenders resorting to untestable auxiliaries or methodological nitpicking *without offering independently testable alternatives* would be classic "conventionalist twists" he decried.

  **In essence:** Popper would see pre-registration as a brilliant *practical implementation* of his demand for advance specification of falsifiable predictions, directly combatting ad hoc rescues. However, the replication crisis would force him to confront the *messy reality* of the Duhem-Quine problem in practice. He wouldn't see it as a *fatal flaw* in his logic, but as a stark reminder that falsificationism requires constant vigilance, methodological refinement (like pre-registration), a culture valuing replication, and scientists committed to *seeking* falsification rather than avoiding it. The crisis doesn't break Popper's framework; it demonstrates how hard it is to live up to its ideals without robust institutional guardrails.
