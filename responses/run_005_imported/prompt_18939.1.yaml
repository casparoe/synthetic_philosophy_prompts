prompt: |-
  So I'm on the small committee that runs the internal forecasting/calibration program at the EA-adjacent org I work for -- staff submit probabilities on weekly questions, and the scores partly decide who gets pulled onto the in-house team that advises on our actual grantmaking calls, so its not just a fun side thing. We currently score with Brier, but a couple people (one of whom won't stop citing "epistemic utility theory" like it's a settled field -- is it??) want to switch to log score, on the grounds that it's the only local scoring rule that's still strictly proper, i.e. basically what you get once you take accuracy itself as the fundamental epistemic good rather than just picking whatever formula feels fair. The Brier holdouts say that's nice in theory, but one freak low-probability resolution can tank an otherwise well-calibrated person's score badly enough to cost them their spot for the quarter, and that "more principled" isn't obviously the same as "tracks good judgment." I need to bring the committee an actual recommendation at next Tuesday's meeting, not a "both sides have a point" shrug -- can you draft that memo? Pick a rule (or a defensible hybrid), give real reasoning, and take whichever side you don't pick seriously instead of strawmanning it.
