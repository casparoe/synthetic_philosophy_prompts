answer: |-
  ## MEMORANDUM  
  **To:** Forecasting Program Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Date of Meeting]  
  **Subject:** Recommendation on Scoring Rule for Forecasting Program  

  ### Recommendation
  **Retain the Brier score as our primary metric**, while implementing a *modified rolling average aggregation* for quarterly evaluation to mitigate outlier sensitivity. This balances theoretical soundness with practical robustness in a high-stakes environment.  

  ### Rationale: Why Brier Over Log Score  
  1. **Practical Robustness Outweighs Theoretical Purity**:  
     - Log score’s theoretical strength ("strictly proper and local") is uncontested in epistemic utility theory for *scoring individual forecasts*. However, our goal is quarterly *aggregate evaluation* of forecasters for a high-impact role. A single low-probability event (e.g., a 1% outcome occurring) can catastrophically penalize a log score (-log(0.01) = 4.6) versus Brier’s milder penalty (0.99² = 0.98). Over 50 forecasts, one such outlier could dominate an otherwise excellent record.  
     - **Real-world consequence**: We risk misidentifying "bad judgment" due to statistical noise, damaging morale and trust in the system.  

  2. **Brier Is Still Strictly Proper**:  
     - While log score is the *only strictly proper local rule*, Brier is *strictly proper* and empirically validated for calibration assessment. Forecasters still maximize expected score by reporting true probabilities.  

  3. **Behavioral Incentives**:  
     - Log score may inadvertently incentivize *excessive caution* (avoiding extreme probabilities) to hedge against black-swan penalties. Brier’s quadratic penalty encourages finer discrimination near 0.5 but is more forgiving at extremes—aligning better with our goal of identifying consistently thoughtful forecasters.  

  ### Addressing the Log Score Argument (No Strawman)  
  The pro-log position is principled and correct *in isolation*:  
  - **"Epistemic utility theory" is settled on this**: Log score uniquely satisfies *locality* (scoring depends only on the probability assigned to the actual outcome) and *strict propriety*. If our sole aim were to reward truth-telling per forecast, log score would be optimal.  
  - **Accuracy as fundamental good**: Log score’s logarithmic penalty directly reflects the information-theoretic "surprise" of an outcome, making it a purer measure of epistemic utility.  

  **However**, our program’s purpose is not abstract truth-seeking but *identifying reliable advisors for grantmaking*. We must prioritize:  
  - **Stability**: Avoid having a single outlier override months of performance.  
  - **Interpretability**: Brier’s penalty (squared error) is more intuitive to non-specialists.  
  - **Risk Mitigation**: We cannot ignore the human cost of "freak events" in high-stakes evaluations.  

  ### Implementation: Modified Rolling Average  
  To further address outlier sensitivity *within the Brier framework*:  
  1. **Calculate Brier scores per question** as usual.  
  2. **Quarterly aggregation**: Use a **trimmed rolling average**—discard each forecaster’s highest and lowest 5% of scores before averaging. This dampens outlier impact without manipulating probabilities.  
  3. **Retain raw data**: Log scores can be computed optionally for research (e.g., analyzing tail behavior).  

  ### Conclusion  
  While log score is theoretically impeccable, Brier’s robustness at extremes better serves our practical objective: fairly evaluating forecasters in a high-stakes, operational context. The trimmed rolling average adds resilience without compromising propriety. This approach respects epistemic principles while acknowledging that real-world judgment tracking requires tolerating noise.  

  **Recommended Motion**:  
  *"Retain Brier score for primary evaluation, adopt a 5% trimmed rolling average for quarterly aggregation, and log optional secondary analysis."*  

  ---  
  **Appendices/Footnotes**:  
  - *Epistemic utility theory*: Yes, log score’s propriety/locality is settled (e.g., Gneiting & Raftery 2007). But context matters: our use case is *selection*, not pure truth-elicitation.  
  - *Why not cap probabilities?* Capping (e.g., min 0.05) breaks propriety and incentivizes gaming. Trimming *scores* post-calculation is cleaner.  
  - *Hybrid alternatives considered/rejected*:  
    - **Log with normalization**: Rescaling log scores quarterly distorts incentives.  
    - **Brier-log composite**: Adds complexity without clear benefit.  
    - **Ignoring extremes**: Undermines the value of assigning low probabilities to rare events.
