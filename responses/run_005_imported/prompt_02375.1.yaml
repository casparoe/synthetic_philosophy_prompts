  **Turing:** (Earnestly, shuffling papers) "Essential precautions, Higginbotham! Absolutely essential. We must eliminate *all* extraneous variables for a rigorous test of *mechanical* intelligence."

  **Dr. Finch:** (Frowning) "But extraneous variables like... what, precisely? Radio interference? Magnetic fields?"

  **Turing:** (Leaning forward, eyes wide with conviction) "Primarily *psychokinetic* leakage and *clairvoyant* bleed-through, Finch! The statistical evidence for Extra-Sensory Perception, particularly telepathy, is simply *overwhelming*. Rhine's work at Duke is quite conclusive!"

  **Higginbotham:** (Spitting out his tea) "Overwhelming?! Alan, are you suggesting our judges might be *psychics* trying to cheat for the *human* team by... by mentally whispering the answers through the wall?!"

  **Turing:** (Nodding gravely) "Precisely! Or worse, a *truly* gifted subject might clairvoyantly discern the hidden card sequence the judge is *thinking about* as a verification test, thereby falsely appearing intelligent! It would utterly invalidate the game's logic. Hence," (taps blueprint emphatically) "the Telepathy-Proof Room. A Faraday cage for the *soul*, if you will. Can't have the paranormal undermining the parameters."

  **Finch:** (Staring blankly at the blueprint) "Right... So, to ensure our *machine* can perfectly *imitate* a human... we first have to build a bunker to stop *humans* from being... too human?"

  **Turing:** (Beaming) "Exactly! Rigor demands we account for *all* empirically supported phenomena. Even the inconveniently spooky ones. Now, about the budget for the ectoplasm-resistant door seals..."

  **Punchline:** And that's how the quest to define artificial intelligence got temporarily derailed by the need for a paranormal panic room, because Turing was worried your Aunt Mildred might cheat at cards... *through a wall*... using data he found 'overwhelming'.

