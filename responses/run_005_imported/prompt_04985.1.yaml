  I should start by constructing a case. The "Self-Undermining Defeater Pill" (SUDP) seems fitting. Details: the pill impairs logic assessment and creates false negatives in self-diagnosis. The subject, Alex, gets evidence that they took SUDP, but the pill makes them doubt whether they took it. The evidence includes a reliable but not perfect doctor's note. Alex's first-order evidence strongly supports P, but the higher-order evidence undermines their ability to trust their assessment of both first-order and higher-order evidence.

  Next, I need to analyze possible doxastic states: full belief in P, suspension, partial credence, and combinations. For each, show how they lead to akrasia. For example, believing P despite knowing the pill might impair their judgment conflicts with the higher-order evidence. Suspending judgment might conflict with the strong first-order evidence. Partial credences could be challenged by questioning the assigned weights. Split-level states like believing P but doubting that belief might violate enkrasia directly.

  Then, argue that this shows the Enkratic Principle can't always be satisfied. If every state is akratic in some way, the principle isn't universally applicable. This supports the permissive camp (Worsnip, Lasonen-Aarnio) who think coherence doesn't always align with correctness. Anti-akrasia theorists might respond by distinguishing evidence types or reinterpreting akrasia, but the self-undermining nature might block these moves. For instance, if the evidence itself is undermined, partitioning might not work.

