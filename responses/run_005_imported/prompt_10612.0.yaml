  For each of the three required questions, I'll draft a primary question followed by a likely response and a challenging follow-up. The asymmetry question will directly confront the inverse gambler's fallacy comparison. The probability distribution question will address the unbounded range issue. The old evidence question will handle the Bayesian update problem with known evidence.

