  Scrutiny-wise, WAS faces feasibility issues—how to intervene without causing more harm? It's also criticized for potential hubris and unintended consequences. Land ethic is challenged for ignoring individual suffering and being vague on what constitutes ecosystem health. It might also have normative biases, like accepting natural processes as inherently good.

