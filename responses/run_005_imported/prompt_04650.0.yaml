  I'm poking around for a piece on animal ethics and keep running into this 'wild animal suffering' argument that's floating around utilitarian/EA circles - the idea that since predation, disease, and starvation cause way more suffering than factory farming ever could, we might actually owe it to animals to start intervening in nature itself. That's basically the opposite of the classic conservationist ethic, the Aldo Leopold 'land ethic' view that judges an action by whether it keeps the ecosystem as a whole healthy and stable, not by how any individual animal feels. Can you compare the two frameworks head-on and tell me which one, if either, actually holds up better under scrutiny - and whether theres any real way to reconcile them?
