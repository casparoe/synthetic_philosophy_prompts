prompt: |-
  I'm taking a decision theory seminar this semester and we just spent two weeks on Kelly betting and what our professor keeps calling "geometric rationality" -- basically the case, via Kelly and via Ole Peters' ergodicity-economics stuff, for treating geometric expectation (maximizing expected log-wealth / long-run time-average growth) as the right target when outcomes compound, versus the standard Samuelson-style objection that this just smuggles in log utility as if it were uniquely rational instead of one risk preference among many.

  This has become weirdly relevant to my actual life because I'm on the 5-person risk committee of our school's student-run quant trading club (we call it "the Fund," very original, I know). We manage about $50k pooled from dues plus an alumni gift, split between a couple of systematic equity strategies and a smaller book that trades event contracts on places like Kalshi where we think we have a genuine edge. Last semester one of our traders sized two high-conviction election contracts at close to full Kelly and it nearly doubled the book, and now half the e-board wants to formally adopt full-Kelly sizing as official policy, while the other half -- including our faculty advisor, who has to sign off before he'll raise our trading authorization -- is spooked, keeps pointing out we don't know our edge nearly as precisely as full Kelly assumes, and wants something blunt like a flat 2% of bankroll per position instead. We owe the general membership a one-page written staking policy before the vote next Tuesday, and honestly the two sides are just talking past each other at this point: one keeps citing "the math," the other keeps citing "we could go to zero."

  Could you draft that memo for me? I want an actual specific recommendation (a fraction of Kelly, some cap, whatever rule you think is defensible) rather than a wishy-washy "somewhere in between," and I want whichever side loses to feel like their strongest argument actually got addressed rather then dismissed -- including the deeper worry that "maximize long-run growth" isn't a neutral, purely mathematical mandate but a specific and contestable notion of what rationality under uncertainty even is. Also feel free to say if the policy should differ between the equity book and the prediction-market book, since the "edge" and "odds" are a lot fuzzier for the latter.
