  - Uncle (engineer) contends persistence requires explanation, possibly hidden benefits
  Their exchange has four key moves that need scoring on a -2 to 2 scale

  For move (1): SIL's spandrel claim. This is textbook evolutionary developmental biology. Human embryos are sexually indifferent until ~week 7-8 when SRY gene activates. Mammary ridges form earlier (week 4), so males develop nipples simply because selection hasn't eliminated them. This is well-supported by embryology. Score: +2 (solid)

  Move (2): Uncle's "not free" objection. He's correct that nipples aren't cost-free (infection risk, etc.), but wrong about selection having "ample time" to remove them. Genetic constraints matter - the same genes build both sexes early on. Changing male nipple development might disrupt female breast function. His framing ignores developmental constraints. Score: -1 (partially valid but flawed)

  Move (3): SIL's Gould & Lewontin reference. She accurately cites their critique of "just-so stories". The persistence of a trait doesn't automatically imply hidden benefits. This is a valid caution against over-adaptationist thinking. Score: +1 (correct but could acknowledge some traits do have exaptations)

  Move (4): Uncle's "both sides need evidence" point. This is actually the strongest move philosophically. SIL can't prove zero selection, and he's right that spandrels can acquire functions later (exaptation). Burden of proof isn't one-sided. Score: +2 (excellent point about scientific inquiry)

  Overlooked aspects:
  - Exaptation potential (nipples may gain new functions)
  - Quantitative costs (how significant are male nipple risks?)
  - Non-adaptive mechanisms (like genetic linkage)
  - Broader biological context (other mammalian males have nipples)

  The scores should reflect each argument's standalone validity, not who won. Uncle's last point about open inquiry is particularly strong even if his initial objection was weak.
