  Right, avoiding clichés... No spaceships, no glowing orbs. Maybe make both sides post-biological? That sidesteps humanoid drama. And the "institution" angle feels fresh - civilizations as cold strategic entities. The time pressure should feel like a vise tightening: every microsecond of deliberation becomes a signal of uncertainty.

  Key elements to embed:
  - Mutual isolation (emphasize light cone separation)
  - High stakes (existential, so decisions are irreversible)
  - The trap: haste vs. hesitation both punish
