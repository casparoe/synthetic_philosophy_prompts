  Hmm, the constraints are quite specific: no alien first-contact tropes, no identical simulations, no AI blackmail, and the dilemma must emerge purely through plot. The user is clearly deep in theoretical work (grad seminar on rational agency) and wants a thought experiment made visceral. 

