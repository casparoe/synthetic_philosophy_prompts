  Been down a bit of a rabbit hole since someone linked Simone Weil's essay on abolishing political parties in an old forum thread. Her argument is basically that parties aren't just vehicles for disagreement, they're structurally built to kill members' sense of truth and justice by making party growth and loyalty ends in themselves (she even compares party loyalty to pre-Enlightenment religious faith: believe first, find your reasons later), and she thinks this holds even for parties that started out organized around a genuinely good cause. Total Moloch story. Anyway, my building's co-op board just had it's first ever contested election, with two organized slates running against each other instead of the usual pile of independent candidates, and the whole thing has gotten weirdly tribal for like 40 people arguing about roof repairs and pet policies. Can you walk me through the most important implications of Weil's argument for a tiny democratic body like this? Genuinely curious whether we should be worried, and whether there's anything short of literally banning slates (which feels dramatic for a co-op board) that we could actually do about it.
