  - Scanlon: The Fidelity Principle still applies because breaking the promise would be a failure to respect the trust the promisee placed in the promisor, even posthumously.
  - Kantian: Breaking the promise cannot be universalized without contradiction, as it would undermine the practice of promising even in deathbed scenarios.
  - Hume: Without a social convention to enforce it (since no one else knows and the promisee is dead), the obligation dissolves.
