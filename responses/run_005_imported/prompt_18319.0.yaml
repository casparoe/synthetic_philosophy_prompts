  We are given seven theories to rank based on how well they handle the deathbed promise case. The case: a promise made to a dying friend, alone, with no one else knowing, and after death, no ongoing reliance or possibility of betrayal. The intuition is that the obligation persists.

  Theories:
  1. Hume (convention/artifice): Promises bind because of social conventions that facilitate cooperation. Without society, the obligation might not hold.
  2. Prichard (brute-intuition): The obligation is self-evident and doesn't require further justification.
  3. Scanlon (Fidelity Principle): Promises create expectations and trust; breaking them without reason is wrong because it violates a principle that no one could reasonably reject.
  4. Raz (value of voluntary obligation): Promises are binding because they allow us to voluntarily create obligations, which is valuable for autonomy and relationships.
  5. Owens (interest/authority): Promising involves giving the promisee authority over the promisor in a certain matter because the promisee has an interest in that authority.
  6. Kolodny & Wallace (expectation and trust): The obligation arises from the expectations and trust that the promise creates in the promisee.
  7. Kantian universalizability: Promises bind because breaking them cannot be universalized without contradiction.

  Analysis for the deathbed case:

  - Hume: The social convention aspect is absent because no one else knows and there is no ongoing social context. So, the obligation would be weak or non-existent. (Low tier)
  - Prichard: The intuition is brute, so the deathbed promise is just as binding as any other. (High tier)
  - Scanlon: The Fidelity Principle might still apply because the promise created an expectation and trust at the time, and breaking it would be a failure to respect that. However, after death, there is no ongoing expectation or trust to be disappointed. Scanlon might argue that the principle still holds because the promisee had a right to rely on the promise, and breaking it would be a failure to respect that past trust. But it's a bit strained. (Mid to High tier? Let's see)
  - Raz: The value of voluntary obligation might still hold because the promisor has exercised their autonomy to create an obligation, and that act has a lasting effect. The dead promisee's interest might be seen as continuing (e.g., in having their wishes carried out). (High tier)
  - Owens: The promisee had an interest in the matter (getting the guitar to the kid) and gave the promisor authority. Even after death, that authority might be seen as persisting because the interest (in the outcome) remains. (High tier)
  - Kolodny & Wallace: The obligation is tied to the promisee's trust and expectations. Since the promisee is dead, there is no ongoing trust or expectation to disappoint. So, the obligation might fade. (Low tier)
  - Kantian: Breaking the promise cannot be universalized because if everyone broke deathbed promises, the institution of promising would be undermined, or it would be a contradiction in the will (if you make a deathbed promise, you are willing that such promises be binding). (Mid to High tier)

  Ranking:

  S Tier: Theories that can straightforwardly account for the obligation without needing ongoing social interaction or reliance.
  - Prichard: Brute intuition fits perfectly with the immediate intuition that the promise is binding regardless of circumstances.
  - Owens: The promisee's interest and the authority granted persist beyond death because the matter of the promise (the guitar) is still outstanding and the promisee's interest in the outcome continues (even posthumously).
  - Raz: The voluntary obligation is created and remains because the act of promising has a lasting normative effect, and the value of such obligations doesn't depend on the continued existence of the promisee.

  A Tier: Theories that can account for the obligation but with a bit more work.
  - Scanlon: The Fidelity Principle can be interpreted as applying because the promisee, while alive, had a right to rely on the promise and breaking it would be a failure to respect that past commitment. However, the lack of ongoing reliance might weaken it slightly compared to the above.
  - Kantian: The universalizability test still applies: if one breaks a deathbed promise, one is acting on a maxim that cannot be universalized (because if everyone did so, deathbed promises would not be taken seriously, and the very act of making one would be in bad faith). But note: the universalization argument might be seen as having a social dimension, which is absent here. Still, Kantian ethics often focuses on the individual's duty regardless of consequences.

  B Tier: Theories that struggle but might have a way to explain it.
  - (None in B? Let's see)

  C Tier: Theories that have to bite the bullet and say the obligation is weak or non-existent.
  - Hume: The convention requires a social context that is absent. Without any social enforcement or context, the obligation is not binding. So, no obligation in the deathbed case.
  - Kolodny & Wallace: The obligation is grounded in the trust and expectations of the promisee. Since the promisee is dead and cannot have ongoing expectations or be betrayed, the obligation dissolves.

  But note: Kolodny & Wallace might argue that the obligation exists because at the time of the promise, the promisee formed an expectation and trust, and breaking the promise would be a betrayal of that past trust. However, their account is typically forward-looking (ongoing trust) so it's a stretch. We'll put it in C.

  So, the ranking:

  S: Prichard, Owens, Raz
  A: Scanlon, Kantian
  C: Hume
  D: Kolodny & Wallace

