answer: |-
  Let's break down Lewis's undermining problem step-by-step. As a software engineer, you'll appreciate the analogy of a self-referential function or a system where the current state depends on a future outcome that could invalidate the state itself. I'll use a simplified coin-toss world to illustrate.

  ### The Setup: A Humean Coin World
  Imagine a universe (**W**) with only 100 coin tosses across all time. The "Best System" (BSA) for **W** says:
  1.  **Chance of Heads (Ch)**: 0.5
  2.  **Definition of Ch**: The chance *is* the actual frequency of heads in the entire history of **W**.

  Now, consider time **t**: just *before* the first toss. The entire history at **t** is empty. The BSA says the chance of heads *at* **t** is 0.5. But this chance depends on the *final* frequency of all 100 tosses.

  ### The Undermining Future
  Define an event **U** (the "underminer"):
  -   **U** = "All 100 tosses land Heads" (frequency = 1.0).

  **Key Properties**:
  1.  **Ch_t(U) > 0**: At **t**, the chance of **U** happening is (0.5)^100 (a very small positive number).
  2.  **U implies ¬(Ch_t = 0.5)**: If **U** happens, the final frequency is 1.0. The BSA would *not* have assigned Ch_t(Heads) = 0.5 in this case (it would assign 1.0 or something else). So **U** entails that the chance statement "Ch_t(Heads) = 0.5" is *false*.

  ### The Contradiction via the Principal Principle (PP)
  PP states that a rational initial credence (**Cr**) should be:
  **Cr(A | E ∧ Ch_t(A) = x) = x**
  ...where **E** is admissible evidence (evidence about the past/present at **t**, not "cheating" with future info).

  Apply PP to event **U** at time **t**:
  1.  **Set A = U, x = Ch_t(U) = (0.5)^100**
  2.  **E** = History up to **t** (which is empty).
  3.  **PP Prescribes**: Cr(U | E ∧ Ch_t(U) = (0.5)^100) = (0.5)^100.

  **The Contradiction Bites Here**:
  -   But *what is* "Ch_t(U) = (0.5)^100"? It's a claim about the *entire* world (past *and future*), derived from the BSA applied to the whole of **W**.
  -   Crucially, **knowing** "Ch_t(U) = (0.5)^100" *itself* gives you powerful information about the future! Specifically, it tells you:
      > "The final frequency of Heads is *not* 1.0 (because if it were 1.0, Ch_t(U) wouldn't be (0.5)^100, it would be 1.0 or undefined)."
  -   In fact, knowing "Ch_t(Heads) = 0.5" entails that **U will *not* happen**! If **U** *did* happen, Ch_t(Heads) *couldn't* be 0.5. So:
      **Cr(U | E ∧ Ch_t(U) = (0.5)^100) = Cr(U | E ∧ Ch_t(Heads) = 0.5) = 0**
  -   **PP Requires**: Cr(U | ...) = (0.5)^100 > 0
  -   **Rationality Requires**: Cr(U | ...) = 0
  *Contradiction*. PP tells you to have a positive credence in **U**, but the very information defining the chance (Ch_t(Heads)=0.5) logically implies **U** is impossible.

  ### Why "Just Call Chance Info Inadmissible" Fails
  This is the obvious first fix. Declare knowledge of **Ch_t** itself is *inadmissible* at **t**. PP only applies conditional on *admissible* evidence, so if **Ch_t** is inadmissible, PP doesn't constrain **Cr(U | Ch_t)**.

  **Why Lewis Rejected This**:
  1.  **Renders PP Useless**: The whole point of PP is to tell us how to *use* our knowledge of objective chances to set rational credences. If we can't condition on **Ch_t** at **t**, PP can't do its job. We'd have no bridge from chance to credence when it matters most.
  2.  **Violates Intuition**: Knowing the *actual, objective chance* at **t** feels like precisely the kind of information a rational agent *should* use to set their credence *at* **t**. Declaring it inadmissible feels like cheating and abandoning the core idea.
  3.  **Admissibility Definition**: Lewis defined admissible evidence at **t** as evidence solely about the past/present *or* about the chances themselves. Chance info was *meant* to be admissible. The undermining problem shows this leads to contradiction under Humeanism.

  ### Lewis's New Principle (NP)
  Lewis (with significant input from others like Ned Hall and Jenann Ismael) proposed the **New Principle** to rescue Humeanism:

  **Cr(A | H_t ∧ T_w) = T_w(A | H_t)**

  Where:
  *   `H_t`: The entire history of the world up to time **t**.
  *   `T_w`: The *entire* chance function (theory) that is true in world **w** (i.e., the complete set of conditionals `Ch_t(•)` for all times and propositions).
  *   `T_w(A | H_t)`: The chance that theory `T_w` *assigns* to **A**, *conditional* on the history `H_t` (which it takes as given).

  **How NP Solves Undermining (Using the Coin World)**:
  1.  **Condition on `T_w`**: Instead of conditioning *just* on the specific chance value `Ch_t(U) = x`, NP conditions on the *whole chance theory* `T_w` that is true in **w**.
  2.  **What is `T_w`?** `T_w` is the BSA for the *actual* world **w**. Crucially, `T_w` *encodes the dependency* of chances on the *entire* history (including the future).
  3.  **The Key Move**: `T_w(A | H_t)` means "The chance of **A** *according to the correct theory* `T_w`, given history `H_t`". But `T_w` *already knows* what the *actual* future is (because it's defined by the entire world **w**), even though it outputs chances *at* **t** based only on `H_t`.
  4.  **Applied to U**:
      *   `T_w(U | H_t)` = The chance of **U** (all heads) assigned by the *true* theory `T_w`, given `H_t` (empty).
      *   But what *is* the true theory `T_w`? It depends on the *actual* frequency.
      *   **If `T_w` says Ch_t(Heads) = 0.5**: Then the *actual* frequency *isn't* 1.0! So `T_w` *knows* **U** is false. Therefore: `T_w(U | H_t) = 0`.
      *   **NP Prescribes**: Cr(U | H_t ∧ T_w) = T_w(U | H_t) = 0.
  5.  **Result**: NP tells you to have **Cr(U | ...) = 0**, which matches the rational requirement derived from knowing `T_w`. The contradiction vanishes. You rationally believe **U** is impossible *because* knowing the *true chance theory* `T_w` entails that **U** is incompatible with `T_w` being true.

  **Essence of the Fix**: NP doesn't just condition on the *value* of the chance; it conditions on the *entire chance theory* `T_w`. `T_w` carries the information that certain futures (like **U**) are incompatible with `T_w` itself being true at **t**. NP effectively says: "Set your credence equal to the chance assigned *by the correct theory*, and that correct theory *already factors in* the fact that its own truth depends on the whole future."

  ### Was the Fix Successful? The General Verdict

  The New Principle (NP) is widely seen as **formally successful** in avoiding the specific logical contradiction of the undermining problem. It provides a consistent rule for linking Humean chance to rational credence.

  **However, significant philosophical criticisms remain**:

  1.  **Triviality Worries**: In many cases, `T_w(A | H_t)` seems to collapse to 0 or 1 for undermining futures. `T_w(U | H_t) = 0` in our example. While this avoids contradiction, it feels like chances lose their "grip" – they don't guide uncertainty about the very futures that define them. Is `T_w(U | H_t)` really a genuine *chance*, or just a disguised logical truth?
  2.  **Conceptual Circularity?**: NP defines rational credence using `T_w(A | H_t)`. But `T_w` itself is defined by the BSA, which depends on the *entire* world (including the future). Critics (e.g., Tim Maudlin, Huw Price) argue this makes `T_w(A | H_t)` epistemically inaccessible at **t** and conceptually circular. How can you *know* `T_w` at **t** without knowing the future? Lewis argued `T_w` is a legitimate piece of information to condition on *in principle*, even if we rarely *know* it precisely.
  3.  **Explanatory Power**: Does NP preserve the intuitive role of chance? The original PP captured the idea that chance is an *unbiased, expert predictor* guiding uncertain agents. NP's chances sometimes look like "experts" who know the final outcome (e.g., `T_w` "knows" **U** won't happen). This feels different.
  4.  **Complexity & Non-Fundamentality**: NP is more complex than PP. Some argue Humeanism, plus NP, makes chances seem less fundamental or more "gerrymandered" than intended.
  5.  **Alternatives Flourished**: The undermining problem and the complexity of NP motivated many philosophers to explore non-Humean theories (e.g., propensity, primitivism) or radically revise Humeanism (e.g., Ismael's work).

  **Consensus View**:
  *   **Formally Adequate**: NP is generally accepted as solving the *specific logical contradiction* of undermining within Lewis's framework. It's the "best fix" for Humeans committed to the BSA.
  *   **Philosophically Costly**: Many philosophers find the costs (triviality worries, circularity accusations, loss of intuitive force) too high. It's seen as highlighting a deep tension within *Humean* supervenience about chance.
  *   **Not the End of the Story**: NP didn't end the debate. It shifted focus to whether Humeanism can provide a satisfactory *metaphysics* for chance that aligns with its proposed *epistemology* (NP). Many remain skeptical, while Humeans continue to refine the view (e.g., incorporating "undermining futures" directly into the BSA's criteria).

  **In Summary for a Software Engineer**: Think of the BSA as a global function `BSA(world) -> chance_function`. The original PP (`credence = chance_value`) caused a runtime exception when the `chance_value` depended on a future state `U` that, if realized, would mean `BSA(world)` wouldn't have output that `chance_value`. Lewis's NP patches this by making credence call a method *on* the `BSA` object itself: `credence = BSA.get_chance(event, current_history)`. The `BSA` object internally checks the consistency of the `event` with its own global state (the whole world) and returns 0 for events that would break its internal invariants (like `U`). It works, but it makes the `BSA` object stateful and globally aware, which some feel violates encapsulation expectations for a "chance" module. The debate is whether this is an acceptable design pattern or if we need a different architecture (non-Humeanism).
