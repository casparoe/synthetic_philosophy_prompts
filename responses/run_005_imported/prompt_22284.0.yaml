  But is the New Principle successful? Critics point out issues. It might be circular because the chance function depends on the future. Also, it might lead to trivial chances if the chance of an event given the chance function is either 0 or 1. Some argue that Humean accounts can't avoid these problems without compromising their core ideas. Alternatives like non-Humean theories might avoid undermining but have their own issues.

