  ### Explanation of Scores

  1.  **Denny (-1): "Can't be real grief because you control the outcome / like an actor."**
      *   **Score:** -1 (Mostly Wrong)
      *   **Reason:** Denny incorrectly conflates *control over the fictional outcome* with *control over the emotional response*. While the author dictates the plot, the emotional reaction to the *consequence* of that plot decision (the death of a character deeply known and inhabited) is often involuntary and genuine. Calling it solely "skilled make-believe" ignores the real psychological impact of simulating loss and severing a deep creative connection. Actor analogies fail because actors embody *others'* creations; authors grieve the loss of *their own* internal companion.

  2.  **Oksana (2): "Control proves nothing / rereading fixed endings evokes real tears / vividness matters, not control."**
      *   **Score:** 2 (Clearly Right)
      *   **Reason:** Oksana correctly identifies the core mechanism: emotional response hinges on the *vividness of mental simulation* and the *significance* of the represented event, not on who controls the narrative or its fixity. The rereading analogy is powerful and directly refutes Denny's core premise that fixity or authorial control negates genuine feeling. Her point establishes that the *experience* of the emotion in the moment is what defines its "realness."

  3.  **Denny (0): "Rereading isn't parallel because the writer had a live option at the moment."**
      *   **Score:** 0 (Neutral/Mixed)
      *   **Reason:** Denny identifies a *procedural* difference (the author's moment of choice) but fails to demonstrate why this difference fundamentally alters the *nature* of the emotional experience *at the moment of feeling it*. While the context of creation is unique, the emotional trigger *during the writing act* is still the vivid simulation of loss. His point highlights a distinction in *how* the scenario arises, not proof that the resulting feeling is categorically different.

  4.  **Oksana (2): "Difference in origin, not feeling / Denny's unproven premise that emotion requires openness / regret counterexample."**
      *   **Score:** 2 (Clearly Right)
      *   **Reason:** Oksana delivers the decisive blow. She correctly separates the *cause* of the feeling (the author's choice) from the *feeling itself* (grief/sadness triggered by the simulated event). She exposes Denny's hidden, flawed assumption: that "real" emotion *requires* ongoing uncertainty or openness ("things genuinely up for grabs"). The counterexample of regret over an unchangeable past is perfect – it's universally accepted as real grief/sadness despite absolute fixity and zero openness. This demolishes the necessity of "openness" for genuine emotion.

  ### What Both Are Missing

  Neither Denny nor Oksana fully addresses the **depth and nature of the author-character relationship**. After three years of living with Marta in your mind, building her history, voice, motivations, and interactions, she transcends being a mere plot device or fictional construct. She becomes a complex internal presence, a facet of your own imagination and creative investment. Killing her isn't just deleting words; it's severing that internal relationship and acknowledging the finality of that specific creative potential within *this* story. The grief stems from the **real psychological loss of this internal companion and the end of that particular creative journey with her**, even though you rationally control her fictional existence. The tears are for the *loss of the relationship you built with this aspect of your own creativity*, making the emotion profoundly real, rooted in the author's lived creative experience, not just the character's fictional death. It's grief for the *end of the process of creating and knowing her* within the narrative's context.
