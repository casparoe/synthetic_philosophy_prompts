  Let me unpack their three requested angles: First, the undermining-Humeanism conflict. Need to highlight how chances become "fixed" by future outcomes in best-system accounts, creating a loop where credence contradicts chance. Second, the "relocation" concern—does demanding credence conditional on the whole chance theory just push the problem into impossible epistemic demands? Third, self-locating cases might break the New Principle if chance assignments depend on perspective (e.g., Beauty's coin credence). 

  For follow-ups, I should anticipate standard replies. If she dismisses the relocation worry by saying idealization is necessary, push on whether this drains the principle of practical relevance. If she handles self-locating cases by splitting propositions into objective/subjective, ask how that squares with non-indexical chance. 

