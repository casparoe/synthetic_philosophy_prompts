prompt: |-
  So I fell down a Stanford Encyclopedia rabbit hole a while back on the "wrong kind of reasons" problem for fitting-attitude theories of value -- the classic setup where a demon says he'll torture you unless you admire him, so now you've got a clear reason to admire him, except that reason has nothing to do with him actually being admirable, its just a reason to be in the state of admiring. Ever since then I keep noticing the same shape show up whenever rationalist-adjacent people argue about whether its ever okay to believe something because believing it is useful -- growth mindset, placebo effects, "fake it till you make it," self-fulfilling prophecies, all that stuff that gets filed under instrumental vs epistemic rationality.

  Can you spell out the most important implications of the wrong-kind-of-reasons problem for that debate specifically? I'm most curious whether any of the standard fixes people propose for WKR in the value case (object-given vs. state-given reasons, restricting which properties even count as reason-giving, etc) actually generalize to give the pragmatist side a principled way to say "usefulness can sometimes be a genuine reason to believe" -- or whether those same moves just end up showing that a useful-but-unsupported belief is always structurally identical to admiring the demon. And please don't just default to "well Pascal's wager is bad epistemics," I already know that take and want the actual structural point.
reasoning: |-
  Okay, the user is diving deep into the "wrong kind of reasons" (WKR) problem and how it relates to instrumental vs. epistemic rationality debates. They mentioned Stanford Encyclopedia and the demon example where you have a reason to admire the demon to avoid torture, but that reason doesn't make the demon admirable. They're noticing this pattern in discussions about believing something because it's useful—like growth mindset, placebos, or "fake it till you make it." 

  The user wants to know if standard fixes for WKR in value theory (like object-given vs. state-given reasons) can be applied to belief pragmatism. Specifically, whether these fixes allow for a principled way to say usefulness can sometimes be a genuine reason to believe, or if useful-but-unsupported beliefs are always like admiring the demon. They’re already familiar with critiques like Pascal’s Wager being bad epistemics, so they’re looking for the structural parallels.

  First, I need to map the analogy: admiration (value) vs. belief (epistemics). In the demon case, the reason to admire is state-given (avoid torture), not object-given (the demon's properties). Similarly, believing something because it’s useful is a state-given reason (the benefits of holding the belief), not object-given (evidence for the belief’s truth). 

  The core challenge is whether state-given reasons for belief can ever be "right kind" without collapsing into epistemic reasons. The user is skeptical of superficial "Pascal bad" takes and wants deeper structural analysis. They might be frustrated with rationalist circles oversimplifying the pragmatism debate, or they’re seeking a framework to justify strategic belief in things like growth mindset without cognitive dissonance.

  Key moves in value theory to fix WKR:
  1. **Object-given vs. state-given**: Separating reasons based on the object’s properties vs. the state’s consequences. But for belief, object-given reasons are inherently truth-related (evidence), while state-given are practical. This distinction makes state-given reasons for belief always "wrong kind" if presented as epistemic reasons.
     
  2. **Property-based restrictions**: Only properties of the object count as reason-giving. For belief, this would mean only truth-relevant properties (evidence) count for epistemic justification. Useful properties of the belief-state wouldn’t qualify.

  3. **Constitutivist approaches**: Admiration is constituted by responsiveness to admirability. Similarly, belief is constituted by responsiveness to truth. So state-given reasons (usefulness) can’t directly make you believe—they might cause belief indirectly via self-manipulation, but that’s not forming the belief *for* epistemic reasons.

  The structural point: Pragmatic reasons for belief are always state-given, so they’re always the "wrong kind" for epistemic justification. They don’t make the belief *epistemically* justified; they just make it advantageous. This mirrors the demon case—admiring to avoid torture doesn’t make the demon admirable, just strategically smart. 

  But the user wants hope for pragmatism. Are there loopholes?
  - **Indirect routes**: E.g., believing "I can improve" (growth mindset) might lead to actions that *make* it true, so the belief becomes evidence-responsive post-hoc. But initially, it’s still adopted for state-given reasons. 
  - **Self-fulfilling beliefs**: If believing P makes P true (e.g., confidence boosting performance), then usefulness *aligns* with truth. But this is niche (only when belief causes truth), and the reason to believe is still practical ("this will work") not epistemic ("this is true").
  - **Epistemic trade-offs**: Sometimes accepting lower evidential standards temporarily for instrumental gain (e.g., placebo). But this is a practical choice to sacrifice epistemic purity, not a new *epistemic* reason.

  Conclusion: No clean generalization of WKR fixes gives pragmatism a win *within* epistemic justification. State-given reasons remain structurally alien to belief formation. The best pragmatism can do is frame useful beliefs as practical tools, not epistemic achievements—admiring the demon to survive isn’t about *real* admiration, it’s strategy. Similarly, believing useful things isn’t *real* believing (in the truth-tracking sense), it’s self-programming.  

  User’s unspoken need: They might want to defend instrumental belief without feeling intellectually dishonest. The answer is to decouple epistemic and practical rationality—useful beliefs aren’t "justified," but they’re *permissible* as strategic exceptions when truth and utility align (or when utility overrides). The demon analogy holds, but surviving the demon is pragmatically valid even if philosophically awkward.
answer: |-
  You've hit on a profound structural parallel between the "wrong kind of reasons" (WKR) problem in value theory and instrumental belief debates. The demon case exposes a **categorical mismatch**: reasons to *be in a state* (admiration) vs. reasons *warranted by the object* (admirability). For belief, the mismatch is between reasons to *hold a belief-state* (usefulness) and reasons *warranted by the truth of the proposition* (evidence). Let's break down the implications, fixes, and whether pragmatism can escape the demon's shadow.

  ### Core Structural Parallel: Belief as the Demon's Admiration
  - **The Analogy**:  
    - *Value Case*: You have a *state-given reason* to admire the demon (avoid torture), but no *object-given reason* (he isn't admirable).  
    - *Belief Case*: You have a *state-given reason* to believe P (e.g., "believing I'll succeed improves my performance"), but no *object-given reason* (evidence for P is weak).  
  - **The Problem**: Both confuse *reasons to cause/be in a mental state* with *reasons that justify the state's content*. Useful beliefs, like admiring the demon, treat the attitude as a *tool* rather than a *response to its object*.

  ### Can Standard WKR Fixes Rescue Pragmatism?
  The value theory toolbox *doesn't* give pragmatism a clean win. Instead, it shows why useful beliefs are *always* "wrong kind" **for epistemic justification**, though they may be practically rational. Key fixes and their implications:

  1. **Object-Given vs. State-Given Reasons (Parfit, Schroeder)**  
     - *Fix*: Only object-given reasons (grounded in the object's properties) count for fitting attitudes. State-given reasons (about the state's consequences) are "wrong kind."  
     - *For Belief*:  
       - **Object-given reasons**: Evidence (truth-indicative properties of P).  
       - **State-given reasons**: Usefulness (consequences of *believing* P).  
       - **Result**: Usefulness is *always* a state-given reason → **structurally identical to the demon case**. It can't justify belief *epistemically*, only *pragmatically*.  
       - *Pragmatist hole*: No amount of "but it works!" turns a state-given reason into an object-given one. Truth and utility are distinct grounds.

  2. **Constitutivist Approaches (Hieronymi, Shah)**  
     - *Fix*: Belief is *constituted* by the aim of truth. Just as admiration is fitting only if responsive to admirability, belief is justified only if responsive to evidence.  
     - *For Belief*:  
       - Forming a belief for practical reasons violates its constitutive norm ("believe only what is true").  
       - **Useful beliefs are not "beliefs" in the strict sense**—they're *alien cognitive interventions* (like hypnotism). You can *cause* yourself to believe P, but not *reason your way* to it via usefulness.  
       - *Pragmatist hole*: This fix makes the demon analogy *stronger*. Pragmatic "belief" is as categorically misfit as admiring the demon.

  3. **Property-Based Restrictions (Rabinowicz, Rønnow-Rasmussen)**  
     - *Fix*: Only properties *of the object* count. For belief, only truth-relevant properties of P matter.  
     - *For Belief*:  
       - "Believing P is useful" is a property of the *belief-state*, not P itself. It's no more relevant to epistemic justification than "admiring the demon avoids torture" is to his admirability.  
       - **Self-fulfilling prophecies** (e.g., confidence causing success) *seem* promising, but:  
         - If P is *made true* by belief (e.g., "I'll succeed"), the reason to believe is *still* practical ("this causes success"), not evidential.  
         - Before acting, evidence for P is still weak → belief is instrumentally rational but epistemically unjustified.  
       - *Pragmatist hole*: Only if usefulness is a *truth-indicating property* (e.g., evolutionary benefits signaling truth) could it count—but this collapses into evidence, not pure pragmatism.

  ### Pragmatism's Narrow Escape Routes (and Their Limits)
  While WKR fixes block usefulness as *epistemic justification*, they leave room for *pragmatic permission* in limited cases:
  - **Indirect Routes**:  
    Usefulness can *indirectly* justify *actions* that lead to evidence-based belief.  
    - *Example*: "Faking it till you make it" → acting *as if* P is true → gathering evidence (success) → justifies belief.  
    - *But*: This is **practical reason to act**, not epistemic reason to *believe*. The initial "belief" is pretense.
  - **Epistemically Neutral Self-Manipulation**:  
    Adopting useful beliefs via non-rational means (e.g., conditioning) avoids violating belief's norms—you're not *reasoning poorly*, you're *bypassing reasons*.  
    - *Example*: Taking a placebo pill to *cause* belief in recovery, not because you have evidence.  
    - *But*: This concedes usefulness isn't a *reason for belief*; it's a cause. Structurally, it's like bribing yourself to admire the demon.
  - **Tradeoffs in Non-Ideal Agency**:  
    When evidence is inaccessible (e.g., existential crises), useful beliefs may be *pragmatically optimal* without claiming epistemic status.  
    - *Example*: Adopting growth mindset when paralyzed by self-doubt.  
    - *But*: This is a **practical compromise**, not a new *kind* of epistemic reason. It treats belief as a tool (like the demon's admiration).

  ### The Unavoidable Structural Verdict
  **Useful-but-unsupported beliefs are categorically identical to admiring the demon** for epistemic purposes. WKR fixes generalize to show that:  
  - Usefulness is always a *state-given reason* → "wrong kind" for epistemic justification.  
  - Belief's constitutive aim (truth) excludes practical reasons *by definition*.  
  - Pragmatism must either:  
    a) Concede that useful beliefs are *pragmatic tools*, not epistemically justified (admiring the demon to survive), or  
    b) Redefine belief to include practical aims (but then it's not "belief" as classically understood).  

  ### Why This Matters for Instrumental Rationality
  The WKR lens reveals that "usefulness as a reason to believe" is a **category error**, not just bad epistemology. Pragmatists can defend instrumental belief as:  
  - A practical necessity (surviving the demon),  
  - A temporary heuristic (until evidence arrives), or  
  - A non-rational strategy (self-hypnosis).  
  But they cannot claim it provides *epistemic* reasons without dissolving the distinction between truth and desire—a move that collapses the very concept of belief. The demon, in the end, always wins the structural argument.
