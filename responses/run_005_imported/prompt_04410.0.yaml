  So this semester I'm in a seminar that's basically all Bernard Williams (we did most of Ethics and the Limits of Philosophy and are now on Shame and Necessity), and a couple weeks ago our professor mentioned almost as an aside that Williams was also a massive opera nerd and has a whole posthumous essay collection on it, On Opera, that came out a few years after he died in 2003. I went down a rabbit hole and read the essay "Don Giovanni as an Idea" (where he's basically arguing with Kierkegaard's reading of the opera in Either/Or, especially over what the final scenes are supposed to mean) and the one on Puccini where he talks about "manifest artifice" — his idea that opera's whole power comes from how openly non-realistic it is (people singing their private thoughts out loud, dying mid-aria, etc) rather than the drama working despite that.

  Heres why I'm actually asking though: a friend of mine is directing our school's opera workshop production of Don Giovanni this spring, and shes redoing the staging pretty substantially for a post-#MeToo audience — adding a dramaturg's note, changing blocking so its unambiguous that hes committing assault rather than just being a charming seducer, etc (apparently a bunch of professional companies have done versions of this exact thing in the last few years, so its not just her being extra). We got into a whole argument about it where I said I thought Williams would've been pretty unconvinced by that approach, both because of the Don Giovanni essay (he's clearly not trying to extract a clean verdict out of the opera, he basically wants to sit with the ambiguity) and because of his stuff on the "morality system," the idea that reducing everything to blame and obligation flattens out ethical life in a way he thought was a mistake. She said I was just using him to dress up a boring "art shouldn't be political" take.

  I want to actually work this out properly instead of just asserting it, since Williams obviously wasn't indifferent to real harm — Shame and Necessity is if anything a defense of taking tragic seriousness more seriously, not less. So can you reconstruct, in some detail, what you think Williams's actual position would be on this kind of #MeToo-motivated "moral clarification" of Don Giovanni stagings? I'm especially interested in whether there's a plausible, textually grounded version of Williams that ends up at least partly sympathetic to what my friend is doing, or whether it really does cut against both the aesthetic and the ethical commitments he actually argued for. Please don't just give me the generic "philosopher would find modern sensitivity silly" answer — that's the exact move I'm trying to avoid, and my friend will absolutely call it out if that's all I show up with.
