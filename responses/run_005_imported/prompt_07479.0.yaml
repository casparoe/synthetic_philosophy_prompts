  First, I need to recall Quine's core arguments. Radical translation shows that multiple translation manuals can fit all behavioral data, making reference inscrutable. Quine's naturalism and behaviorism lead him to see no fact of the matter beyond behavior. His "shrug" comes from this: no practical consequences in translation. 

