  Ok random question but its been stuck in my head all week. I finally got the skin prick allergy test done after two scary reactions to stuff with peanut oil in it. Turns out I've been taking Zyrtec pretty much every day for years for my hayfever, and totally forgot your supposed to stop antihistamines about a week before the test bc they can block the reaction. Test came back 100% negative, no reaction to anything. Allergist said its almost certainly a false negative from the Zyrtec and wants me off it for a week so we can redo it properly, which fine, ok. But heres what I can't stop thinking about: this whole time I was on Zyrtec, was I actually still allergic to peanuts, just hidden underneath the meds? Or does it not really count as being allergic if the reaction is literally being blocked and nothing ever happens? My partner says I'm way overthinking a scheduling mixup, but it feels like a real question to me - like what does it even mean to truly be allergic to something if your body isn't allowed to show it?
