answer: |-
  You've pinpointed a fascinating tension central to Locke's argument and its interpretation. Let's break down the logic, the potential tension, and how section 9 attempts resolution:

  1.  **The Globe Example (Core Claim):**
      *   Locke argues that even experienced adults don't *directly* see a 3D globe *as* a globe via pure visual sensation.
      *   What hits the retina is a "flat circle, variously shadowed."
      *   The perception of convexity and uniform color is a **judgment** based on past "experience" and "habitual custom." We've learned to interpret the specific patterns of light, shadow, and color variation *as signs* of a convex 3D object.
      *   Painting is cited as proof: it creates the illusion of 3D using exactly these 2D cues (flat canvas with varied colors/shading), tricking the judgment.

  2.  **Molyneux's Problem & Locke's Agreement ("No"):**
      *   Given the above, Locke agrees with Molyneux: the newly-sighted man, despite knowing the shapes by touch, could *not* visually distinguish the cube from the sphere.
      *   His reasoning (echoing Molyneux): The man lacks the specific *visual* experience linking the *tactile* experience of a cube/sphere to the *visual* patterns of light/shadow/color that signify those shapes. He hasn't learned that "what affects his touch so or so, must affect his sight so or so."

  3.  **The Apparent Tension & Your Question:**
      *   **Tension:** If *everyone* relies on learned judgment to see 3D shape from inherently 2D visual input (as per the globe), why is the blind man's inability noteworthy? Isn't it *just* an instance of lacking the specific visual experience needed for that judgment, like any novice? Why does this require a special thought experiment?
      *   **Locke's Implicit Premise:** The tension arises because Locke seems to assume a crucial, unstated difference in the *starting point* of the senses. He implies that touch *does* deliver spatial properties like figure and motion **directly** to the mind, without needing the same kind of learned judgment based on unrelated cues. The blind man *has* the true ideas of "cube" and "sphere" via touch. The problem is mapping those *true* ideas onto the *ambiguous* visual data.

  4.  **Resolution via Section 9 (The Crucial Restriction):**
      *   Section 9 explicitly addresses your point and resolves the tension by **establishing the asymmetry between sight and touch**.
      *   Locke states this phenomenon of judgment altering sensation is "not usual... but those received by sight."
      *   **Why Sight is Unique:** Sight delivers two *fundamentally different* kinds of ideas:
          *   *Peculiar Ideas:* Light and color (exclusive to sight).
          *   *Common Sensible Ideas:* Space, figure, and motion (also deliverable by touch).
      *   **The Core Problem:** The "proper object" of sight is *only* light and color. However, variations in space/figure/motion *change* the appearance of light and color (e.g., causing shadows, perspective shifts). We learn to use these changes in light/color (the proper object) as *signs* to *judge* the common sensibles (space/figure/motion).
      *   **The Asymmetry with Touch:** Locke implies touch delivers the common sensibles (space/figure/motion) *more directly*. While touch involves sensation (pressure, texture, temperature), the spatial properties like shape are arguably more intrinsic to the tactile experience itself. You feel the extended edges and angles of a cube *in* the tactile sensation. Sight, in contrast, *only* gives light/color, and we must *infer* the spatial properties from patterns within that light/color.
      *   **Therefore:** The newly-sighted man lacks the learned ability to *interpret* the complex, ambiguous patterns of light/color (sight's proper object) as signs signifying the specific spatial properties (cube/sphere) that he *does* know directly via touch. The judgment required for sight is unique and complex.

  5.  **The Significance of the "Ingenious Men" Anecdote:**
      *   **Undercutting Intuition:** This detail is crucial. Locke uses it to demonstrate that his conclusion (and Molyneux's) is **counter-intuitive** to most people, even intelligent ones.
      *   **Highlighting Habit:** It powerfully reinforces the globe example's point. Our visual judgments about shape are so ingrained, so automatic, that we mistake them for direct perception. We *feel* like we just "see" the cube or sphere directly. This anecdote proves how pervasive that illusion is.
      *   **Empiricist Lesson:** It serves Locke's broader empiricist agenda. He wants readers to realize how profoundly dependent even our most basic "simple" perceptions are on accumulated experience and learning ("how much he may be beholden to experience... where he thinks he had not the least use of, or help from them"). The "no" answer requires argument because our intuition is deceived by habit.
      *   **Confidence in "No":** Locke presents the anecdote *not* to undermine the "no" answer, but to *strengthen* it. The fact that "ingenious men" were initially wrong, but convinced by Molyneux's/Locke's *reasons*, shows that careful philosophical analysis reveals the truth despite misleading intuition. It confirms the power of Locke's explanation (experience/judgment vs. innate connection). We should be *more* confident in "no" precisely because it required argumentative work to overcome a deep-seated illusion.

  **In Summary:**

  *   The **globe example** establishes that visual perception of 3D shape is *always* a judgment based on interpreting 2D cues (light/color/shadow), learned through experience.
  *   **Molyneux's Problem** asks what happens when someone lacks *any* visual experience but has tactile knowledge of shape.
  *   The **apparent tension** (why is this special?) arises because Locke implicitly assumes touch delivers spatial properties more directly than sight.
  *   **Section 9 resolves the tension** by explicitly restricting the judgment-over-sensation phenomenon *primarily to sight*. It argues sight is unique in having "proper objects" (light/color) that are distinct from the spatial properties we *infer* from variations in those objects. Touch, by implication, delivers spatial properties more intrinsically.
  *   The **"ingenious men" anecdote** highlights how automatic and deceptive visual judgment is, reinforcing the globe example and the empiricist lesson. It strengthens the "no" answer by showing it requires (and withstands) philosophical scrutiny to overcome faulty intuition. It underscores that Locke's agreement with "no" is a carefully argued conclusion, not an obvious intuition.

  Locke's overall point is that vision requires a unique, learned *translation* from patterns of light/color into ideas of space/figure, a translation grounded solely in experience. The blind man lacks the dictionary for this translation, despite knowing the meanings (shapes) in another "language" (touch). The restriction in section 9 defines *why* sight needs this special translation in a way touch arguably does not.
