  First, I need to recall Locke's argument structure. In section 8, Locke starts with the globe example to show that even adults don't directly see 3D shapes; they infer them from 2D visual cues like shading, thanks to habit. Then he introduces Molyneux's problem about the blind man. The user is confused because if everyone relies on inference, why is the blind man's inability to distinguish the cube and sphere noteworthy? Shouldn't that be expected? 

