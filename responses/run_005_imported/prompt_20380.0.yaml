answer: |-
  Here’s the strongest case for conclusion-based voting, framed as handbook language and directly engaging the core objection:

  ---

  **Handbook Recommendation: Conclusion-Based Aggregation for Tenure Decisions**  
  *Committee judgments shall be determined by tallying each member’s final vote on the tenure outcome ("grant" or "deny"). Premise-by-premise aggregation is expressly rejected.*

  ### Justification: Legitimacy Over Logical Illusion
  1. **The Primacy of Verdict Integrity**  
     Committees exist to render *decisions*, not logical syllogisms. A conclusion-based vote ensures the outcome reflects at least *one* member’s actual judgment. In the disputed case, premise-based voting manufactured a "grant" verdict that *no member endorsed*—a result disconnected from human deliberation. Tenure decisions demand authentic collective action, not algorithmic outputs.

  2. **The "No Shared Reason" Objection: A Strength, Not a Weakness**  
     Critics argue conclusion-based voting risks ratifying outcomes lacking majority support for any single justification. This misunderstands committee governance:  
     - **Pluralism of Rationales is Legitimate**: Different members may validly reach "deny" for distinct reasons (e.g., flawed teaching vs. flawed scholarship). Forcing consensus on *why* denies this reality.  
     - **Premise-Based "Reasons" are Artificial**: In the disputed case, the "majority" affirming scholarship included a member who *rejected tenure* due to poor teaching. Their scholarship vote was never an endorsement of granting tenure—yet premise-based voting misappropriates it.  
     - **Accountability Requires Ownership**: Only conclusion-based voting ensures every outcome is backed by members who *actually support it*. Premise-based outcomes may rest on "reasons" no member would defend in context.

  3. **Guarding Against Hidden Contradictions**  
     Premise-based aggregation can force incoherent stances onto the committee. Here, it declared teaching and scholarship "satisfactory" while simultaneously producing a majority opposed to tenure—a contradiction no individual member held. Conclusion-based voting avoids imposing such irreconcilable group positions.

  4. **Practical Wisdom Over Theoretical Purity**  
     Tenure review is a holistic judgment. Members weigh criteria interactively (e.g., "strong scholarship may offset adequate teaching"). Fragmenting votes into premises ignores these deliberative nuances. Conclusion-based voting respects each member’s integrated assessment—the very essence of "all-things-considered" judgment.

  5. **Procedural Fairness and Buy-In**  
     Outcomes imposed without genuine support corrode committee trust. Conclusion-based results may be narrow (e.g., 2–1 "deny"), but losers know the outcome reflects actual human judgments. Premise-based "wins" like the disputed case breed resentment by subverting individual reasoning.

  ---

  ### Addressing the Sharpest Objection
  *"But what if conclusion-based voting approves tenure when no majority agrees on scholarship OR teaching?"*  
  This scenario is theoretically possible but reveals deeper truths:  
  - If 3 members each find *different* singular flaws (e.g., Member 1: "Scholarship weak," Member 2: "Teaching weak," Member 3: "Service weak"), yet all vote "grant," the outcome still reflects their *collective will* to award tenure despite individual reservations. This is legitimate compromise.  
  - Conversely, premise-based voting could *deny* tenure despite majority support for every premise—an outcome equally disconnected from member judgments. Conclusion-based voting avoids both perverse results by tethering outcomes to actual verdicts.  

  **Final Word**: Committees exercise human judgment, not Boolean algebra. Conclusion-based voting honors the charge to render *decisions*, not logical curiosities. It ensures outcomes are owned by the committee—not extracted from it against its will.

  ---

  This approach elevates the committee’s role as a decision-making body, reframing the "no shared reason" concern as a feature of pluralistic deliberation rather than a flaw. It prioritizes procedural legitimacy and human judgment over formalistic aggregation.
