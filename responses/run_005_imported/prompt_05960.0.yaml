answer: |-
  I completely understand why the Frege-Geach problem feels elusive—it's a subtle issue about how meaning works in logic, and summaries often gloss over why the "complex attitude" response doesn't actually solve it. Let's break it down step by step, using your "lying" example. The real difficulty isn't about conditionals *existing*; it's about **how moral words like 'wrong' contribute the *same meaning* across different logical contexts** while *also* doing the expressive work emotivists want. Here's why that's a problem:

  ### 1. **The Core of Expressivism: Meaning as Expression**
     - When you *assert* "Lying is wrong," the expressivist says you're **expressing disapproval** of lying (like "Boo, lying!").
     - Crucially, this *isn't* describing a fact. It’s performing an action (disapproving).

  ### 2. **The Problem: Embedding in Conditionals**
     - Now consider the unasserted occurrence in a conditional:  
       *"If lying is wrong, then getting your little brother to lie is wrong."*
     - This sentence seems perfectly meaningful and logical. But notice:
       - The phrase "lying is wrong" appears **without being asserted**. You're not saying "Boo, lying!" here—you're *supposing* it hypothetically.
       - Yet, the word "wrong" still clearly means the *same thing* as it does in the standalone sentence. It’s not ambiguous.

  ### 3. **The Expressivist's First Try (Your Instinct)**
     - You suggest: *"The whole conditional expresses a complex attitude!"*  
       (e.g., "Boo to combinations where you disapprove of lying but don’t disapprove of making your brother lie!").
     - **This seems promising!** But here’s where philosophers push back—it doesn’t solve the deeper issue...

  ### 4. **Why This Doesn't Work: The Compositionality Problem**
     - Language is **compositional**: The meaning of a complex sentence is built from the meanings of its parts.  
       *Example:* In "It is raining and the ground is wet," the meaning depends on what "it is raining" means *by itself*.
     - For expressivism to work, "lying is wrong" must contribute the *same meaning* whether it's asserted ("Lying is wrong!") or embedded ("If lying is wrong...").
       - In the asserted case, that meaning is **expressing disapproval**.
       - In the conditional, it *can't* be expressing disapproval—because you’re not actually disapproving! You're just *talking about* disapproval hypothetically.
     - **The contradiction**:  
       If "wrong" *means* expressing disapproval when asserted, what does it mean when unasserted? It can’t mean the same thing (because you’re not doing the expressing). But intuitively, it *does* mean the same thing.

  ### 5. **The Logic Problem: How Can Arguments Be Valid?**
     - Consider this logically valid argument:
       1. **If lying is wrong, then getting your little brother to lie is wrong.**  
          *(Premise 1 - Conditional)*
       2. **Lying is wrong.**  
          *(Premise 2 - Asserted moral claim)*
       3. **Therefore, getting your little brother to lie is wrong.**  
          *(Conclusion - Asserted moral claim)*
     - In standard logic, validity depends on **truth-preservation**: If the premises are true, the conclusion must be true.
     - **Expressivism's challenge**:
       - Premise 2 ("Lying is wrong") isn’t *true/false*—it’s *expressing disapproval*.
       - Premise 1 (the conditional) can’t be *true/false* either—it’s a complex attitude.
       - So how can this argument be *valid*? Validity relies on truth, but expressivism denies moral sentences have truth-values!

  ### Why Philosophers Think This is Devastating
  - Expressivism must explain **two things at once**:
    1. **The meaning consistency** of "wrong" across asserted/unasserted contexts.
    2. **The validity** of moral arguments using standard logic.
  - Your "complex attitude" solution *tries* to handle (1), but:
    - It doesn’t explain **compositionality** (how "wrong" contributes identically in both contexts).
    - It doesn’t explain **validity** (how accepting the premises *forces* you to accept the conclusion—since attitudes aren’t truth-apt).
      - *Example:* Even if Premise 1 expresses a complex attitude, and Premise 2 expresses disapproval, why *must* you then disapprove of making your brother lie? Logic demands necessity; attitudes feel psychological.

  ### The Bigger Picture: What Expressivists Do Now
  Philosophers like Simon Blackburn (quasi-realism) and Allan Gibbard (norm-expressivism) have developed sophisticated responses. They argue moral language *projects* attitudes onto the world but can still "mimic" truth/logic by tracking **consistency in planning** or **commitments of attitude**. But even they admit Frege-Geach forces expressivists into complex maneuvers—it’s not as simple as "booing/cheering."

  **In essence**: Frege-Geach exposes that moral language behaves *logically* like factual discourse, while expressivism treats it as *non-logical* expression. Reconciling this is expressivism’s deepest challenge. Your instinct isn’t wrong—it’s the starting point for modern expressivists. But the problem reveals why "attitudes" alone can’t easily capture how we *reason* with moral concepts. If you’ve grasped this tension, you’ve understood the core issue!
