prompt: |-
  So for my metaethics seminar we just got through Scanlon's buck-passing account of value, and this week's reading was Rabinowicz & Rønnow-Rasmussen on the wrong kind of reasons problem -- the classic case where an evil demon says he'll torture you unless you admire him (or some totally worthless saucer of mud), so technically you now have a reason to admire it even though it isn't actually admirable. My prof mentioned kind of offhandedly that some people treat the WKR problem as basically a reincarnation of Moore's open question argument against naturalistic definitions of "good," but then she moved on to the next slide before explaining what she meant, and now me and my study group can't stop arguing about it.

  Could you actually spell out that comparison for me? Like, is WKR doing the exact same move as Moore's OQA -- showing that for any proposed analysis of a normative property in terms of some other property, a competent thinker can always coherently pull the two apart -- just transposed from something like "good = pleasure" onto "good = whatever gives us reason for a pro-attitude"? Or is something genuinely different going on, since OQA is about analyzing "good" itself and WKR is more about sorting out which reasons count as the "right kind" for a fitting-attitude analysis to even get off the ground. I'm also curious whether a buck-passer who's already got a decent reply to Moore (like the synthetic-identity move Cornell realists make for "good = X") gets any protection from WKR cases for free, or if thats a totally seperate fight that has to be won on its own terms. If you can, give me an actual verdict on how deep the similarity between these two problems really goes rather than just listing parallels and differences down the middle -- I have to defend a position on this for my response paper and "it's complicated" isn't gonna cut it.
reasoning: |-
  Okay, the user is in a metaethics seminar dealing with Scanlon's buck-passing account and the WKR problem as discussed by Rabinowicz & Rønnow-Rasmussen. They mentioned their professor linked the WKR problem to Moore's Open Question Argument (OQA) but didn't explain it, leaving their study group confused. The user wants a clear comparison between WKR and OQA, specifically whether they're fundamentally the same or different, and if solutions to one help with the other.

  First, I need to recall both arguments. Moore's OQA targets naturalistic definitions of "good." It argues that any definition like "good is pleasure" can be questioned because it's always coherent to ask, "Is pleasure really good?" This implies that "good" can't be reduced to natural properties without losing its normative essence. On the other hand, the WKR problem challenges fitting-attitude analyses (FA), where value is defined in terms of reasons for pro-attitudes. The evil demon scenario shows a reason to admire something (to avoid torture) that isn't actually admirable, creating a problem of distinguishing the right kind of reasons (RKR) from the wrong kind (WKR).

  The user's main question is whether WKR is just a reincarnation of OQA applied to FA. Both involve pulling apart concepts: OQA separates "good" from natural properties, while WKR separates reasons to have an attitude from the attitude's fittingness. However, the contexts differ. OQA is about the definition of "good" itself, whereas WKR is about the structure of FA accounts, specifically the reasons that make attitudes fitting. So while both show gaps in analyses, the gaps are in different places—semantic vs. structural.

  The user also asks if a solution to OQA (like Cornell realism's synthetic identity) automatically solves WKR. Cornell realism argues that "good" is synthetically identical to natural properties, so the open question doesn't refute the identity. But for WKR, the problem is distinguishing RKR from WKR within the FA framework. Even if "good" is a natural property, FA still needs to explain why some reasons (like avoiding torture) don't make attitudes fitting. So solutions to OQA don't directly address WKR; the buck-passer needs additional tools, like the wrong-kind reasons approach or a separate criterion for fittingness.

  The user needs a verdict for their response paper. The similarity is deep in that both exploit conceptual gaps, but the differences are crucial. OQA targets the definability of normative concepts, while WKR targets the structure of FA accounts. Solving one doesn't solve the other; they're distinct challenges requiring separate strategies. The user should argue that while related, they are not the same problem, and addressing both is necessary for a robust metaethical theory.
answer: |-
  You're absolutely right to push beyond "it's complicated" – the comparison is profound but ultimately reveals distinct challenges. Here's the breakdown and a clear verdict:

  **The Core Similarity: The Conceptual Gap Argument**

  Both Moore's Open Question Argument (OQA) and the Wrong Kind of Reasons (WKR) problem exploit the same *logical move*: demonstrating that a proposed analysis of a normative concept leaves a conceptual gap.

  1.  **Moore's OQA (Target: Naturalistic Definitions of "Good"):**
      *   **Proposal:** "Good" = Property N (e.g., pleasure, desire-satisfaction).
      *   **Gap:** It always seems intelligible (open) to ask, "But is N *really* good?" even if we know something has N. E.g., "I know this causes pleasure, but is it *good*?"
      *   **Implication:** "Good" cannot be analytically reduced to any natural property N. The property of being good is conceptually distinct from any proposed naturalistic foundation. It points to the irreducibility of normativity.

  2.  **WKR Problem (Target: Fitting-Attitude (FA) Accounts of Value - e.g., Buck-Passing):**
      *   **Proposal:** "X is valuable" = "There are reasons to have pro-attitude A (e.g., admire, desire) towards X" OR more precisely for buck-passing, "X's value *consists in* its having properties that provide reasons to have pro-attitude A towards X."
      *   **Gap (via Demon Case):** The demon gives you a decisive *reason* to admire the mud (avoid torture). But it seems *incoherent* to say the mud is *admirable* (or valuable in that way) *because* of the demon's threat. Admiration feels *misdirected* or *unfitting* towards the mud.
      *   **Implication:** Not all reasons to have an attitude are reasons that make the attitude *fitting* or *appropriate to its object*. The analysis "Reasons to admire → Admirable" fails because some reasons to admire (WKR) don't make the object admirable. The concept of "fittingness" (or the "right kind" of reason) is conceptually distinct from the mere existence of a reason to have the attitude. It points to a gap *within* the normative structure of reasons themselves.

  **The Crucial Differences: Scope and Target**

  *   **OQA's Target:** The **fundamental definability of "good" itself** (or other thin normative concepts like "right"). It attacks attempts to *reduce* normativity to the non-normative (natural or supernatural properties). Its gap is between the *normative* ("good") and the *non-normative* (N).
  *   **WKR's Target:** The **internal structure of a specific *normative* analysis** (FA/Buck-Passing). It assumes *reasons* are fundamental and attacks the attempt to analyze *value* (a thick normative concept like "admirable," "desirable," "fear-worthy") solely in terms of *reasons for attitudes*. Its gap is between two *normative* concepts: "reason to have attitude A" and "attitude A is *fitting* to its object" (or "object is A-worthy"). The WKR problem arises *even if* we grant that reasons are irreducible normative primitives.

  **Does Solving OQA Solve WKR? (The Cornell Realist Test)**

  *   **Cornell Realist Move (Synthetic Identity):** "Good" *is* a natural property N, but this is a *synthetic necessary truth* (like "Water is H2O"), not an analytic definition. The open question ("Is N good?") is intelligible because it's synthetic, but it still has a determinate answer (Yes!). This bypasses OQA by denying that "good" must be analytically definable.
  *   **Does this help with WKR? Mostly NO.**
      *   **Why Not?** WKR isn't primarily about the *reducibility* of normativity to the non-normative. It's about the *internal coherence* of the FA/buck-passing structure *within* the normative domain. The buck-passer *accepts* that reasons are irreducible normative primitives. Their problem is showing how reasons for attitudes *constitute* value without collapsing into the demon's extortion.
      *   **The Challenge Remains:** Even if "admirable" is identical to some complex natural property R (involving the *right kind* of reasons), the buck-passer *still* needs a criterion to distinguish RKR (which make admiration fitting) from WKR (which merely give pragmatic reasons to admire). The synthetic identity claim doesn't magically provide this criterion. The demon case forces the buck-passer to *specify what makes a reason the "right kind"* for constituting value/fittingness. This specification must avoid circularity (e.g., "RKR are those that make the attitude fitting") and triviality. Solutions like the "wrong-kind reasons" approach (Rabinowicz & Rønnow-Rasmussen) or the "object-given/state-given" distinction (Parfit) are attempts to solve WKR *on its own terms*, independent of OQA solutions.

  **The Verdict: Deep Structural Parallelism, Distinct Metaethical Battles**

  1.  **Deep Parallel:** Both arguments are powerful instances of the **Conceptual Gap Strategy**. They show that competent users of the relevant concepts can coherently separate the analysans (proposed defining property N / reasons to have A) from the analysandum ("good" / "A-worthy"). This gap reveals that the proposed analysis fails to capture the essential conceptual content of the target normative concept. In this sense, WKR *is* "OQA transposed" onto the FA framework – it applies the *same logical maneuver* to a different target analysis.
  2.  **Distinct Battles:** However, they fight **different metaethical wars**:
      *   **OQA** is a **broadside against naturalistic reductionism** concerning fundamental normative concepts ("good," "right"). It defends the autonomy of normativity.
      *   **WKR** is a **precision strike against a specific non-reductive normative program** (FA/Buck-Passing). It challenges the program's ability to provide a *coherent internal account* of value/fittingness solely in terms of reasons for attitudes, demanding a principled distinction *within* the normative realm (RKR vs. WKR).
  3.  **Solving OQA ≠ Solving WKR:** Defusing OQA (e.g., via synthetic identity) removes an obstacle to *any* naturalistic or non-naturalistic realism, including FA. But it **does not automatically solve the internal structural problem** posed by WKR for the FA/buck-passing account itself. The buck-passer must still win the battle *within* their chosen normative framework to distinguish the reasons that genuinely constitute value from those that don't.

  **Your Position for the Paper:**

  **Defend this:** "While the WKR problem powerfully applies the *logical structure* of Moore's Open Question Argument to expose a critical flaw in Fitting-Attitude analyses of value, it constitutes a *distinct and independent challenge*. OQA targets the fundamental reducibility of normativity itself, whereas WKR targets the internal coherence of a specific non-reductive normative program (buck-passing) by revealing a necessary conceptual gap *within* the normative domain – the gap between having *any reason* for an attitude and that attitude being *genuinely fitting* to its object. Consequently, solutions to OQA, such as Cornell realism's synthetic identity thesis, offer no automatic protection against the WKR problem; the buck-passer must develop specific resources to distinguish Right Kind Reasons from Wrong Kind Reasons on their own normative terms."

  This position acknowledges the profound similarity in argumentative *form* while insisting on the crucial difference in *scope and target*, and it clearly explains why solving one problem doesn't solve the other. It gives you a strong, defensible stance. Good luck with the paper!
