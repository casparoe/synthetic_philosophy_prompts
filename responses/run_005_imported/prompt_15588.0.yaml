  *checks Thornley's paper again* Right, the key is that timestep dominance only imposes strict preferences when one trajectory is better at every timestep. For shutdown vs non-shutdown trajectories, there's always timesteps where shutdown looks worse (no future influence) and timesteps where it looks better (avoids future suffering). So they're incomparable, not equal. 

  Ah, and the user specifically wants me to avoid slogan-level responses. They need the mechanical reason why the standard money pump sequence fails. Let me visualize the three-stage pump: 

  Stage 1: Agent prefers A- (shutdown later) over A (shutdown now) because at timestep t=0, A- dominates A (same influence until shutdown). 

