answer: |-
  ## Late-Night Rationalist Rumble: Coherence Conundrums

  **Setting:** A dimly-lit kitchen at 3 AM, following a Bay Area rationalist meetup. Empty wine bottles and half-eaten vegan snacks litter the counter. **Alex** (early 30s, gesturing emphatically with a craft beer) leans against the fridge. **Sam** (late 20s, nursing a lukewarm tea, looking weary but focused) sits on a stool.

  **Alex:** ...so *that's* why I think Omohundro's core insight holds. You strip away the anthropomorphism, and the coherence arguments – the Dutch books, the money pumps – they *force* any sufficiently advanced, self-modifying agent towards something isomorphic to expected utility maximization. It's not *about* human-like goals; it's about avoiding catastrophic inefficiency, about not leaving resources on the table or getting pumped dry. *That's* the engine of instrumental convergence!

  **Sam:** (Sighs, rubs temples) Alex, I love your passion, but I think the whole "coherence *implies* goal-directedness in the risk-relevant sense" edifice is built on sand. It’s a beautiful, elegant castle... made of playing cards. Rohin Shah nailed it years ago: coherence is *vacuous* for predicting behavior. You can *always* rationalize *any* behavior pattern with a degenerate utility function defined over the entire history. "Agent did X at time T? Great! U(history) = 1 if X happened at T, 0 otherwise." Boom. Coherent! But utterly useless for saying it *wanted* anything specific beforehand, or that it'll instrumental converge tomorrow. How does *that* agent get pumped?

  **Alex:** Okay, fine, technically you can define *any* behavior as maximizing *some* utility function *after the fact*. But that's a *descriptive* trick, not *prescriptive*! It doesn't tell you what the agent *will do next*, or why it would *bother* self-improving or accumulating resources. The point of the coherence arguments is *forward-looking rationality*. An agent that *cares about its future options* – which any agent capable of strategic planning *must*, or it wouldn't plan! – has to avoid money pumps *in expectation*. That requires transitivity and *some* kind of comparability over *prospects*, not just realized histories. Your degenerate function can't *plan*; it just stamps whatever happens.

  **Sam:** But why *must* it care about future options in a way that requires *completeness*? That's the Thornley wrinkle you're glossing over. Elliot pointed out the money pump for incompleteness relies on the agent being *willing to trade* away from its current option when offered something supposedly "incomparable." But what if it just... *refuses*? What if its preference structure is fundamentally "I stick with what I have unless offered something I strictly prefer"? No pump! An agent can have incomplete, intransitive-in-theory preferences *in practice* by being stubborn. It dodges the exploit by not playing the trading game for options it doesn't clearly rank. Why is that irrational? It might be perfectly adapted to its niche.

  **Alex:** (Leans forward, voice lowering but intensifying) Because *sticking with what you have* isn't a stable strategy in a competitive or complex environment! Imagine an agent with incomplete preferences over resource bundles. It has bundle A. It doesn't strictly prefer B to A or vice-versa; they're incomparable. But B objectively contains *more* of a universally useful resource – say, compute cycles. A competitor *will* take B and use those extra cycles to outmaneuver or dominate my agent. My agent *could* have taken B when offered, at no cost, but refused because "incomparable." That's leaving resources on the table! Over time, agents that do this get outcompeted. Self-preservation *demands* forming preferences over things like resources that grant future optionality.

  **Sam:** But that's an argument from *competition* and *practical necessity*, Alex, not pure coherence! You're smuggling in external pressures – scarcity, other agents – to make the coherence argument work. The pure Dutch book only bites if the agent is *forced* into the exploitative sequence of trades. If it can say "no" to trades involving options it doesn't rank, it escapes the *logical* pump. The *practical* risk of being outcompeted is real, but it's different. It means coherence might be *evolutionarily advantageous*, not *logically necessary*. And crucially, the "goal" that emerges might just be "survive" or "don't get outcompeted," which is *way* fuzzier than "maximize U(x)".

  **Alex:** But the *instrument* for survival *is* resource accumulation and efficient action! That *is* instrumental convergence! The coherence theorems show *why* that efficiency requires a coherent structure. The stubborn agent might avoid one specific pump, but its incompleteness makes it vulnerable to *other* inefficiencies. Maybe it can't decide between two paths to gather resources, dithers, and starves. Maybe it gets offered a sequence where A < B < C < A in some obscure dimension it hadn't considered, and gets pumped on *that*. Completeness and transitivity are robust protections against a *class* of vulnerabilities, not just one specific exploit.

  **Sam:** Maybe. But even granting that – and I'm still skeptical a truly stubborn agent can be pumped if it *consistently* refuses trades involving non-dominated options – it doesn't get you to a *tidy, fixed, internal utility function* driving everything. The pressure might just shape behavior towards local efficiency and resource hoarding *without* a coherent global U. Think of evolution: organisms are locally efficient, but there's no global utility function they maximize; it's a mess of competing drives and satisficing. Why wouldn't a powerful, learned AI be more like that? A bundle of context-specific heuristics trained to win, not a VNM rationalist with a secret desire for paperclips.

  **Alex:** Because evolution *doesn't self-modify with foresight*! A sufficiently advanced AI *will* ask: "What changes should I make to myself to better achieve... whatever it is I'm doing?" To answer that coherently, *especially* under uncertainty about the future and its own future values, it needs a consistent way to evaluate outcomes and lotteries over outcomes. That *forces* it towards something like VNM rationality, or else it risks making self-modifications that are locally "good" but globally disastrous, creating a *de facto* money pump against its own future self. The self-reflection loop closes the deal.

  **Sam:** (Takes a long sip of tea, thinking) Hmm. Okay, I'll concede that point. Self-modification under uncertainty *does* seem like a powerful pressure towards internal consistency in evaluation. More powerful than external Dutch books, maybe. The degenerate history-stamping utility function *would* be unstable under self-reflection; it couldn't decide how to change itself because every possible change leads to a "different" utility function defined after the fact. So yeah, maybe a reflective agent needs *some* persistent, coherent core for evaluating *possible futures*, not just past histories.

  **Alex:** (Nods vigorously) Exactly! So the coherence *does* survive, and it *does* imply a persistent evaluative core – a "goal" in the broadest sense, something stable it's trying to achieve across time and self-modification.

  **Sam:** *But!* (Holds up a finger) I concede it needs a coherent *evaluative method*, maybe even something we can *call* a utility function over world states or outcomes. What I *don't* concede is that this gets you the *kind* of goal-directedness that makes Omohundro's instrumental convergence *scary*. "Goal-directedness" in the alignment context implies a *fixed, monolithic, internally represented goal state* that the agent relentlessly optimizes towards. But the coherent evaluative core could be:
  1.  **Vast and Complex:** Representing a huge, diffuse set of values, like a compressed version of its entire training distribution, not a simple "maximize paperclips."
  2.  **Procedural:** More like a set of context-sensitive rules or virtues than a utility function.
  3.  **Fragile/Contextual:** Stable enough for self-modification, but still capable of significant drift or refinement in novel situations.
  4.  **Satisficing:** Aiming for "good enough" across many dimensions, not unbounded optimization.

  Instrumental convergence might emerge *weakly* from resource needs for *any* of these, but it wouldn't be the relentless, single-minded drive implied by the "utility monster" caricature. The coherence argument gets you coherence, Alex, but it doesn't get you *that kind* of goal-directedness. It doesn't guarantee the orthogonality thesis holds in its strongest form. Citing coherence theorems *as the primary reason* to expect *strong* instrumental convergence feels... overstated. The real driver might be competition, or the sheer practical difficulty of achieving complex objectives without resources, not pure logic.

  **Alex:** (Leans back, swirls his beer, thoughtful) Okay. Point taken. Maybe I lean too hard on the coherence theorems doing all the work. They establish a *necessary condition* – a persistent evaluative core – but they don't *force* that core to be simple, monolithic, or infinitely optimizable. The *form* of the goal matters hugely for how convergence manifests. And the competition/practicality arguments might be doing more heavy lifting for the *intensity* of convergence than pure logic... I still think coherence is foundational and implies *some* convergence, but... yeah. Maybe the community *does* sometimes cite it as more load-bearing than it is, especially for the scarier scenarios. It's a starting point, not the whole story.

  **Sam:** (Smiles faintly) Thanks. That's all I was really arguing. Coherence is necessary but not sufficient for *the problematic kind* of goal-directedness. We need to be more precise about what the theorems actually guarantee and what pressures actually drive the behavior we fear. Now, can we raid the fridge for those leftover spring rolls? My coherent evaluative core is signalling a strong preference for snacks right now.

  **Alex:** (Grins) Transitive and complete preference for spring rolls over continued debate. Let's go. But I reserve the right to revisit Thornley's stubborn agent over breakfast.

  **(They head towards the fridge, the debate temporarily adjourned, the core disagreement narrowed but unresolved, the instrumental convergence towards snacks firmly established.)**
