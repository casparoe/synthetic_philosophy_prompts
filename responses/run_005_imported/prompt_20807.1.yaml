  The challenges your neighborhood association is facing stem from fundamental issues in social choice theory, particularly Arrow's Impossibility Theorem. This theorem, developed by economist Kenneth Arrow, mathematically proves that no voting system can simultaneously satisfy all of the following criteria when there are three or more options:

  1. **Unrestricted Domain**: Any voter ranking of the options should be allowed.
  2. **Non-dictatorship**: No single voter should dictate the outcome.
  3. **Pareto Efficiency**: If every voter prefers option A over option B, then the group should prefer A over B.
  4. **Independence of Irrelevant Alternatives (IIA)**: The relative ranking between any two options should not change based on the presence or removal of a third option.

  Your experience illustrates violations of these principles:
  - **Point-based ranking (Borda count)**: Awards points based on position (e.g., 3 points for 1st, 2 for 2nd, etc.). The playground won initially.
  - **Pairwise comparisons (Condorcet method)**: Compares options head-to-head. The garden won, indicating it was preferred over every other option in direct matchups (a "Condorcet winner").
  - **Removal of an option**: When solar panels (a "spoiler" with little support) were dropped, the Borda count winner changed even though individual rankings of the remaining three options were unchanged. This violates IIA, as the winner flipped due to the removal of an irrelevant alternative.

  ### Why This Happens
  - **Borda count is sensitive to irrelevant alternatives**: Adding or removing options reshuffles points, as seen when solar panels were dropped. Even though solar panels were unpopular, their removal altered the point distribution, causing a different winner.
  - **No Condorcet consistency**: The Borda count may not elect a Condorcet winner (here, the garden). Pairwise comparisons revealed the garden was broadly preferred head-to-head, but the Borda count prioritized the playground's average ranking.
  - **Strategic voting and method manipulation**: As members noticed, the outcome depends on the counting method. People can (intentionally or not) favor methods that benefit their preferred option, leading to accusations of bias.

  ### Is a "Fair" Method Possible?
  - **Arrow's theorem implies no perfect system exists**. Any method will violate at least one fairness criterion in cases with three or more options. Your scenario—where outcomes flip based on the method or irrelevant alternatives—is an unavoidable mathematical reality, not a flaw in execution.
  - **Common methods all have flaws**:
    - **Borda count**: Fails IIA and may ignore Condorcet winners.
    - **Pairwise comparisons**: May result in Condorcet cycles (e.g., A beats B, B beats C, but C beats A), though your case had a clear Condorcet winner (garden).
    - **Instant-runoff voting (IRV)**: Eliminates least-popular options in rounds but can fail to elect Condorcet winners and violates IIA.
    - **Plurality voting (single-choice)**: Ignores ranked preferences and suffers from vote-splitting.

  ### Practical Recommendations
  While no method is universally fair, you can choose one that best fits your priorities:
  1. **Acknowledge the limitations**: Explain Arrow's theorem to the group. No method is immune to paradoxes, so the goal is transparency, not perfection.
  2. **Stick to one method consistently**:
     - If electing a broadly acceptable winner is key, use **pairwise comparisons** (Condorcet method). It ensures the winner beats all others head-to-head. In your case, this elected the garden.
     - If compromising on "least disliked" options is important, **Borda count** may suffice, but accept that it can be manipulated by adding/removing options.
  3. **Build consensus outside voting**:
     - Hold a discussion to identify shared priorities (e.g., cost, urgency, inclusivity). This may reveal that one option aligns with common values.
     - Use voting as input, not the sole decider. For example, if the garden won pairwise comparisons, it has strong broad support.
  4. **Avoid frequent method changes**: Switching methods mid-process invites distrust, as outcomes appear manipulable.

  ### Conclusion
  Your assumption that a "genuinely neutral" method exists is understandable but mathematically incorrect. Arrow's theorem proves that with ranked preferences and three or more options, no voting system can be perfectly fair. The flipping results you observed are inherent to voting theory, not errors in tallying. To move forward, agree on a method (e.g., pairwise comparisons) that best reflects the group's intent, accept its limitations, and focus on community dialogue to legitimize the outcome.
