  ### Justification of Scores  
  **Move (1): Score 1**  
  The metaphysician correctly identifies the normativity problem in attributing causation to omissions (e.g., the neighbor’s duty vs. the mayor’s irrelevance) and highlights the lack of a physical process. This aligns with influential views (e.g., Helen Beebee, Jonathan Schaffer) that omissions are metaphysically inert "absences." However, it dismisses pragmatic or context-dependent causal attributions too quickly, so it’s plausible but not decisive (+1).

  **Move (2): Score 2**  
  The law student’s analogy to overdetermination is compelling and exposes a flaw in the metaphysician’s reasoning. In classic overdetermination (e.g., two shooters killing a victim), multiple actual events satisfy the counterfactual test, and context selects which to emphasize—yet all are causes. This shows that selection principles *do* operate in bona fide causation, undermining the claim that needing one disqualifies omissions. The move is clearly right (+2).

  **Move (3): Score 1**  
  The metaphysician validly distinguishes omissions from overdetermination: the latter involves *actual* processes (e.g., bullets flying), while omissions involve *non-events* with no physical trace. This echoes process-based theories (e.g., Phil Dowe) where causation requires energy/momentum transfer. The "bare counterfactual" point is strong, but it risks conflating metaphysics with epistemology (salience isn’t just "relocating" the puzzle—it may resolve it pragmatically). Solid but incomplete (+1).

  **Move (4): Score 1**  
  The law student rightly notes that requiring "actual processes" clashes with legal practice (e.g., *Butterfield v. Forrester* treats omissions as causes in negligence). This highlights law’s pragmatic focus on responsibility over metaphysical purity. However, it doesn’t *refute* the metaphysical claim; it merely notes a disciplinary divergence. Strong for exposing costs but doesn’t resolve the core debate (+1).

  ### What Both Are Missing  
  The debate conflates **descriptive metaphysics** (what causation *is*) with **normative/pragmatic contexts** (how we *attribute* causation for purposes like responsibility).  
  - The metaphysician underplays how causal language is inherently context-sensitive (e.g., "cause" in science vs. law).  
  - The law student underappreciates the ontological worry: if omissions are causes, what distinguishes the neighbor from the mayor *without* normativity?  
  **Core gap**: Causation by omission may be metaphysically "shallow" (dependent on norms/expectations) but functionally robust in responsibility practices. A unified account requires acknowledging that "cause" operates on multiple levels—e.g., David Lewis’s counterfactual theory *can* include omissions by fixing a contrast class, but this imports normative salience. The dispute thus hinges on whether causation is a unitary natural relation or a contextually flexible tool.
