  ok weird question but this has been bugging me. my friend Theo and I follow the exact same stats and injury reports for soccer, and he's a genuinely sharp bettor, not a fish, so it's not like either of us knows something the other doesn't. last week he offered me a $20 bet, even odds, that City wins on saturday, said it felt like a real coin flip to him too, he just wanted some action on the game. I almost took it, but got stuck on this: if he truly thought it was 50/50, why would he want the bet unless he secretly thought he had an edge, in which case shouldn't his offering it alone make me suspect the odds favor him, meaning i shouldn't take it either, and wouldn't he realize i'd think that too? we just sat there confused. we touched on something adjacent in my epistemology seminar but never connected it to examples like this. is one of us actually reasoning correctly, or are we just overthinking a $20 bet?
