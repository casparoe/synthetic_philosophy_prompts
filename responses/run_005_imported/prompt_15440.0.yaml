prompt: |-
  Hey — I'm the ethics professor who got roped into my state parole board's risk-tool advisory panel (mostly so they can say a philosopher signed off). We ran two competing actuarial tools on the same redacted case file and got 63% vs 21% chance of reoffending in three years for the same guy — not a bias thing, both use defensible, race-blind variables, they just build his comparison group differently (one matches him nationally on offense type and criminal-history score, the other locally on a tighter set including age and neighborhood). Both vendors insist their number is simply the correct probability for this individual. Half the panel wants to mandate whichever tool matches on more variables, since "more specific" sounds more accurate. The other half says theres no principled place to stop narrowing the match — match him on his birthday too and every "probability" collapses to 0 or 1 for a sample of one — so maybe handing commisioners one clean percentage was never coherent in the first place. I owe the panel a short memo by Thursday: give one concrete recommendation (adopt tool A, adopt tool B, drop both for clinical judgment, require a range instead of a point estimate, whatever), real reasons for it, and an honest crack at the best argument for whichever option you don't pick.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're an ethics professor on a parole board panel dealing with two risk assessment tools giving wildly different probabilities for the same inmate—63% vs 21%. The core issue is deciding which tool to recommend or whether to reject both. 

  First, I need to understand why the tools differ. The key is their comparison groups: one uses a national sample matching on offense type and criminal history, while the other uses a local sample with tighter variables like age and neighborhood. Both claim their probability is correct for the individual. 

  The panel is split. Half thinks more variables mean more accuracy; the other half worries about over-specifying until the sample size collapses. The user needs a concrete recommendation with pros and cons.

  Hmm... the fundamental problem here is treating group statistics as individual probabilities. When the tools say "63% chance," they're really saying "in a group similar to this person, 63% reoffend." But which group? National or local? That's why the numbers clash. 

  I recall statistical principles: narrower matching reduces sample size, increasing noise. The local tool's 21% might come from a tiny group where randomness dominates. Meanwhile, the national tool's 63% could be stable but irrelevant if local factors matter more. 

  Ethically, presenting either number as "the probability" is misleading. It gives false precision. The parole board might treat 21% as low risk when it's actually unreliable. 

  So what's the solution? A range makes sense—show both numbers to force transparency. But how to present it? Maybe a sentence like "National model: 63%, local model: 21% (small sample)" with guidance to weigh local factors cautiously. 

  Wait, could the parole board handle this? They're commissioners, not statisticians. The memo must be practical. The range idea respects their intelligence while admitting uncertainty. 

  Best alternative? Picking one tool. Say the local one, arguing context matters. But the sample size issue worries me—what if "local" is just 3 people? That's reckless. 

  Final call: Recommend the range. It's honest, reduces overreliance on numbers, and aligns with ethics. The counterargument? It might confuse busy commissioners. But that's fixable with clear formatting. 

  ...Double-checking: Does this address the user's role? As an ethics prof, they'll appreciate transparency over false certainty. The "honest crack" at counterarguments shows intellectual rigor. Solid.
answer: |-
  Here’s a concise memo draft with a clear recommendation, reasoning, and counterargument:

  ---

  **TO:** Parole Board Risk-Tool Advisory Panel  
  **FROM:** Dr. [Your Name], Ethics Professor & Panel Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation on Competing Risk Assessment Tools  

  ### Recommendation
  **Adopt a "Risk Range" approach**, reporting both scores (e.g., *21–63%*) alongside contextual notes, rather than a single point estimate. Require commissioners to view this range as a *starting point* for deliberation, not a definitive probability.  

  ### Reasons for This Approach  
  1. **Epistemic Honesty**: Neither tool calculates an "individual probability"; both report *group statistics* (e.g., "63% of people *like him* reoffended"). Presenting conflicting group estimates as competing "individual probabilities" is statistically misleading.  
  2. **Transparency in Uncertainty**: The 42-point gap exposes critical uncertainty: Should we prioritize local socioeconomic factors (Tool B) or offense-specific patterns (Tool A)? Hiding this debate behind one number obscures ethically relevant judgment calls.  
  3. **Guards Against False Precision**: A range prevents commissioners from over-indexing on arbitrary thresholds (e.g., "below 25% = safe"). It forces engagement with *why* the estimates diverge.  
  4. **Practical Flexibility**: Commissioners already weigh multiple factors. A range integrates data while acknowledging its limits, avoiding untenable "all or nothing" choices between tools.  

  ### Implementation  
  - **Format**: "Risk Estimate: 21% (Local Cohort Tool) – 63% (National Cohort Tool). *Key Disagreement: Local context vs. offense-history matching.*"  
  - **Supplement**: Pair with 1–2 bullet points from a human evaluator highlighting case-specific nuances (e.g., "Inmate completed vocational training; lacks local family support").  
  - **Training**: Brief commissioners on interpreting ranges (e.g., "A wider gap implies greater uncertainty").  

  ### Best Argument for the Alternative (Mandating Tool B: The "More Specific" Local Model)  
  *Argument:* "Tool B’s narrower matching (age + neighborhood) better reflects *this individual’s reality*. National data (Tool A) may ignore localized pressures (e.g., gang exposure) or resources (e.g., reentry programs). If ‘probability’ derives from reference classes, the smallest defensible class is fairest—assuming adequate sample size. Tool A’s ‘broader’ match risks ecological fallacy."  

  *Rebuttal:* While locally tailored data is ideal, Tool B’s extreme specificity (e.g., "35-year-old burglars from Neighborhood X") often relies on tiny, unstable samples. A 21% estimate from a cohort of 10 people carries high error margins (±15–20%+), making it *less* reliable than Tool A’s broader but statistically robust estimate. "More variables" ≠ "more accurate" if it sacrifices statistical power.  

  ### Why Not Other Options?  
  - **Mandate One Tool**: Ignores legitimate methodological disagreement; incentivizes vendors to manipulate reference classes.  
  - **Clinical Judgment Alone**: Unstructured discretion reintroduces bias and inconsistency; data provides valuable anchors.  
  - **Collapse to 0/1 "Probability"**: Philosophically coherent but practically useless; parole decisions require probabilistic reasoning.  

  ---  
  **Final Guidance:** The range approach respects the data’s value while centering human judgment on *why* the tools disagree. This aligns with ethical parole decision-making: transparent, reasoned, and humble about uncertainty.
