answer: |-
  Okay, let's break down that dense passage from Eliot, step-by-step, focusing on the inferential logic and your specific points about Kant, accessory motives, and the "idea of God." This is a crucial moment in Eliot's development of her moral philosophy.

  **Core Argument Structure:**

  1.  **Thesis:** An act is morally good (benevolent, just, compassionate) **only** if it springs **directly and inevitably** from the appropriate human feeling in response to its object.
      *   *Benevolence:* Directly activated by the perception of need/happiness.
      *   *Justice:* Directly activated by the perception of injustice/right.
      *   *Pity/Compassion:* Directly activated by the perception of suffering.
      *   **Evidence:** "pity is strong only because we are strongly impressed by suffering"; the deed is benevolent "only in proportion as it is compassion that speaks through the eyes... and moves the arm."

  2.  **Corruption by "Accessory Motives":** If the *reason* for the action shifts from this direct feeling (e.g., compassion for the sufferer) to an *external* factor (e.g., desire to please God, obey a command, gain approval, serve self-interest, or vanity), the act **loses its essential moral character**.
      *   *Becomes:* "deference, of obedience, of self-interest, or vanity."
      *   **Key Inference:** The presence of a strong accessory motive **presupposes** the **weakness** of the direct moral motive. If compassion were truly strong, it alone would be sufficient to motivate the action; needing another reason (like God's glory) shows compassion *isn't* strong enough on its own. Conversely, a strong direct motive **excludes** accessory motives.

  3.  **Application to Cumming:** Cumming's doctrine that "the glory of God" must be the "absorbing and influential aim" is therefore **morally harmful**.
      *   **Mechanism of Harm:** It artificially **diverts** the natural flow of human feeling ("stream of feeling... diverted from its natural current") towards an abstract, external goal ("to feed an artificial canal").
      *   **Result:** This "tend[s] to neutralize the human sympathies." The direct moral feelings (compassion, benevolence) are weakened and replaced by motives related to obedience, duty to doctrine, or self-concern about divine approval/damnation.

  4.  **Eliot's Positive Conception of "The Idea of God":** The idea of God **can** be morally beneficial, but **only under specific conditions**.
      *   **Condition:** God must be conceived as **sympathizing** with the purest human feelings and possessing **infinitely** the moral attributes we recognize in humanity (compassion, justice, love).
      *   **Function:** When conceived this way, the idea of God "cherishes all that is best and loveliest in man." It **reinforces, validates, and amplifies** the inherent moral capacities and feelings within humans, rather than replacing or diverting them.

  **Addressing Your Specific Points:**

  1.  **"Inverted Kant" & Accessory Motives:**
      *   Your philosopher friend is *partially* right about the contrast with Kant, but needs refinement regarding "accessory."
      *   **Kant:** Moral worth resides *only* in action done from *duty* (respect for the moral law), *against* inclination (natural feelings/desires). Inclination contaminates.
      *   **Eliot:** Moral worth resides *only* in action springing *directly* from the appropriate natural human feeling/sympathy (inclination *is* the source). **External principles/commands (like "glory of God" or even abstract "duty") function as the contaminating "accessory motives."**
      *   **"Accessory" Defined:** Eliot uses "accessory" very precisely. It means **extrinsic, secondary, supplementary, external to the core moral impulse itself.** For Cumming, "glory of God" is an accessory motive *added to* (or replacing) the direct motive of compassion. For Eliot, acting *because* of a principle (divine command, abstract duty), rather than *because* of the direct feeling evoked by the suffering/need itself, makes the principle an accessory motive. It's not that principles are inherently bad; it's that *relying on them as the primary motivator* weakens/destroys the direct moral feeling.
      *   **Conclusion:** Yes, it's a stark inversion of Kant. Eliot champions the moral sufficiency of natural human sympathy *against* the moral sufficiency of acting from principle/duty *if that principle is conceived as external*.

  2.  **Feuerbach & the "Idea of God":**
      *   You are absolutely correct. Eliot is deeply Feuerbachian here. After translating *The Essence of Christianity* (1854), she absorbed his core argument: God is a projection of the highest human qualities (love, reason, justice) onto an imaginary external being. Religion is essentially human self-consciousness objectified.
      *   **How Eliot Uses Feuerbach:**
          *   **Critique of Cumming:** Cumming's God is *not* a projection of human moral feeling but a capricious sovereign demanding glory. This God concept *diverts* feeling.
          *   **Positive "Idea of God":** The *only* valid, morally beneficial "idea of God" is precisely the Feuerbachian projection: God as the *infinitely perfect embodiment* of the "pure elements of human feeling" and "attributes which we recognize to be moral in humanity" (compassion, justice, love). This God *sympathizes* with us because it *is* us (our best selves) magnified.
      *   **Does This Relocate the Problem?**
          *   **Potential Problem:** Doesn't saying God "sympathizes" or possesses these attributes still introduce an external validator/certifier ("God approves of *this* feeling")?
          *   **Eliot/Feuerbach's Solution (and why they think it avoids relocation):**
              *   **Immanence, Not Transcendence:** This God *is not separate* from humanity's moral essence. It *is* that essence objectified. Thinking of "God" sympathizing is really just thinking of the *ideal* of human sympathy itself. It's amplifying the *internal* ideal, not appealing to an *external* authority.
              *   **No Independent Certification:** The moral attributes aren't certified *by* God; God *is defined by* those attributes *as recognized by humanity*. The standard remains fundamentally *human*. "God" is a symbolic way of concentrating and intensifying the inherent value we (should) place on compassion, justice, etc.
              *   **Function vs. Source:** The "idea of God" functions as a *reinforcer* and *inspirer* of the direct moral feelings. It doesn't *replace* them as the motivator, nor does it *certify* them from the outside. It *strengthens* the internal moral capacity by providing an idealized image of it. The direct motive (compassion at suffering) remains primary; the "idea of God" nourishes the soil from which that compassion grows.
              *   **Contrast with Cumming:** Cumming uses "glory of God" as the *primary* motive, *replacing* or *overruling* human feeling. Eliot uses the "idea of God" (as human ideal) to *fortify* the direct human feeling as the primary motive. The difference is in the *role* and *source* of the God-concept.

  **Inferential Steps Summarized:**

  1.  **Moral action requires direct, unmediated feeling in response to its object.**
  2.  **Motivation by external factors (accessory motives) corrupts the moral character of the action and indicates weakness in the direct motive.**
  3.  **Cumming's "glory of God" doctrine is such an external factor, acting as an accessory motive that diverts feeling and weakens natural sympathies.**
  4.  **However, the *idea* of God can be morally beneficial *if* it is conceived as the infinite projection of the best human moral qualities (Feuerbachian projection).**
  5.  **In this form, the idea of God does *not* act as an external validator or accessory motive but serves to *reinforce and amplify* the inherent, direct moral feelings within humans by presenting their idealized form.**

  **Conclusion for Your Chapter:**

  This passage is Eliot laying the groundwork for her mature ethical humanism. She is:

  *   **Rejecting** theological ethics based on extrinsic rewards/punishments or divine commands that override human feeling (Cumming).
  *   **Rejecting** Kantian ethics that devalue natural inclination/sympathy as a moral source.
  *   **Affirming** natural human sympathy/feeling as the *sole* authentic source of moral action.
  *   **Re-purposing** the religious impulse (via Feuerbach) to serve a humanistic end: using the symbol "God" not as an external authority, but as a powerful imaginative tool to cultivate, strengthen, and direct the inherent moral capacities within humanity itself. She's not smuggling God back in as a validator; she's transforming the *concept* into a humanistic psychological tool for moral development. The potential tension you identify is real, but Eliot believes grounding "God" entirely *in* human moral consciousness avoids the external mediation problem inherent in Cumming's doctrine.

  This tension between the power of the religious symbol and the need for purely human moral sources will be a central dynamic in her novels. Characters like Dorothea Brooke grapple with finding a purpose and morality *after* rejecting conventional faith, seeking that "higher" consciousness Eliot describes here. This essay is key to understanding how Eliot bridges her Feuerbachian atheism with a profound, almost sacred, reverence for human connection and moral feeling.
