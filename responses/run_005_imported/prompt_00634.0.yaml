prompt: |-
  I'm a philosophy PhD student working on formal approaches to distributive ethics and social choice theory. I also sit on my graduate program's small research-grants committee, which allocates a modest annual budget across a handful of competing proposals submitted by fellow students. Several members want to formalize our deliberations by having each of us report a von Neumann–Morgenstern utility function over the possible outcomes of each proposal and then simply averaging these into a single committee ranking, citing Harsanyi's aggregation theorem as justification. Please describe the most important implications of Harsanyi's theorem for whether, and how, our committee should adopt this procedure, bearing in mind that members generally agree on what a successful outcome would look like but often hold quite different views about how likely any given proposal is to actually succeed.
reasoning: |-
  Okay, the user is a philosophy PhD student specializing in formal approaches to distributive ethics and social choice theory. They're on a committee that allocates research grants for graduate students. Some members want to use von Neumann-Morgenstern utility functions and aggregate them using Harsanyi's theorem. The key issue is that while committee members agree on what a successful outcome looks like, they disagree on the likelihood of proposals succeeding. 

  First, I need to recall Harsanyi's aggregation theorem. It states that if individual preferences satisfy the von Neumann-Morgenstern axioms and the social preference does too, then the social utility must be a weighted sum of individual utilities. The theorem assumes a fixed set of lotteries, meaning everyone agrees on the probabilities of outcomes. 

  But in this case, the committee members have different beliefs about the probabilities of success for each proposal. That's a problem because Harsanyi's theorem requires consensus on probabilities. If members assign different probabilities, they're effectively evaluating different lotteries. Aggregating their utilities without addressing this would be like combining preferences over different scenarios, which violates the theorem's conditions.

  The user mentioned that members agree on what success looks like but disagree on the likelihood of success. So, the issue is about differing subjective probabilities rather than differing values. This distinction is crucial. Harsanyi's theorem doesn't handle disagreement over probabilities because it treats lotteries as given. 

  I should explain the implications of this mismatch. Forcing vNM utilities without reconciling probability assessments would lead to an invalid application of Harsanyi's theorem. The aggregated utility wouldn't represent a coherent social preference under uncertainty. This could result in inconsistent or irrational rankings. 

  The committee needs to address the probability disagreements first. Options might include deliberating to reach a consensus on probabilities, using an averaging method for probabilities, or separating probability assessments from utility assessments. Each approach has trade-offs. For example, averaging probabilities might overlook expertise, while consensus might be time-consuming. 

  Another point is the distinction between epistemic and normative disagreements. If differing probabilities stem from varying expertise, pooling information might resolve them. But if members have normative reasons for their beliefs, it's trickier. The committee must decide whether to aggregate beliefs or preferences. 

  Practical advice would include: don't jump to vNM utilities without aligning probability assessments. Start by discussing why probabilities differ. If consensus isn't possible, consider averaging probabilities before aggregating utilities. Alternatively, separate the assessment of probabilities from the valuation of outcomes. 

  Also, consider Harsanyi's theorem's ethical implications. The linear aggregation assumes utilitarianism, which might not align with the committee's values. If they prioritize fairness or equity, maximizing the sum might not be ideal. The theorem's normative assumptions should be scrutinized. 

  In summary, the key takeaway is that differing probabilities invalidate the direct application of Harsanyi's theorem. The committee must first harmonize probability assessments or adjust their aggregation method to account for disparate beliefs. Highlighting this as the central issue will help the user argue against the proposed procedure and suggest a more robust approach.
answer: |-
  Your committee's proposal to apply Harsanyi's aggregation theorem by averaging individual vNM utilities faces a critical, often overlooked limitation: **it fundamentally assumes consensus on the *probabilities* of outcomes (the "lotteries"), while your committee explicitly disagrees on the *likelihood of success* of each proposal.** This mismatch renders a direct application of Harsanyi problematic. Here's a breakdown of the key implications:

  1.  **The Core Assumption Violated: Shared Lotteries:**
      *   Harsanyi's theorem requires that all individuals evaluate the *same set of lotteries* (probability distributions over outcomes). The social welfare function aggregates preferences over these *identical* uncertain prospects.
      *   **Your Situation:** Committee members agree on the *description* of the possible outcomes (e.g., "Proposal A succeeds," "Proposal A fails") and likely agree on the *value* of those outcomes ("success is good, failure is bad"). However, they hold *different subjective probabilities* for the success/failure of each proposal. **Member X evaluates Lottery X_A (their belief about Proposal A's chances), while Member Y evaluates Lottery Y_A (their different belief about Proposal A's chances).** They are not evaluating the *same* lottery.

  2.  **Implication: Aggregating Utilities Over Different Lotteries is Meaningless:**
      *   Averaging vNM utilities calculated over *different underlying probability assessments* is akin to averaging preferences over completely different objects. It doesn't satisfy the conditions of Harsanyi's theorem.
      *   **Result:** The resulting "social utility" for a proposal won't represent a coherent social preference under uncertainty. It mixes assessments of value *and* conflicting beliefs about facts (success probabilities) without properly disentangling them. The ranking derived from averaging these incompatible utility numbers lacks a clear normative justification from Harsanyi.

  3.  **Distinction: Beliefs (Probabilities) vs. Values (Utilities):**
      *   Harsanyi's framework cleanly separates:
          *   **Beliefs:** Represented by the *probabilities* assigned to states/outcomes.
          *   **Values/Preferences:** Represented by the vNM *utility function* over sure outcomes.
      *   **Your Challenge:** The disagreement is primarily about *beliefs* (probabilities of success), not necessarily about the fundamental *value* of success or failure. Harsanyi's theorem assumes beliefs are either objective (shared) or that individuals agree on subjective probabilities (which they don't).

  4.  **Potential Paths Forward (Requiring Modification):**
      *   **A. Reach Consensus on Probabilities First:**
          *   *Process:* Engage in deliberation focused *specifically* on the likelihood of each proposal's success. Share evidence, expertise, and reasoning. Aim for a committee consensus probability for each proposal's success/failure.
          *   *Then:* Once consensus probabilities are established, *then* each member reports their vNM utility function over the *sure outcomes* (success, failure). These utilities are aggregated (e.g., averaged) using Harsanyi's theorem over the *agreed-upon* lotteries.
          *   *Challenge:* Achieving genuine consensus on probabilities may be difficult or mask underlying disagreements. It requires shifting the deliberation focus to epistemic justification.
      *   **B. Separate Probability Assessment from Value Assessment:**
          *   *Process:*
              1.  Have the committee deliberate and *aggregate beliefs about probabilities* (e.g., average subjective probabilities, use a prediction market, or use expert-designated probabilities).
              2.  Have each member report their vNM utility function over the *sure outcomes* (success, failure) only. This focuses purely on their valuation of success vs. failure, independent of likelihood.
          *   *Then:* Calculate the *expected social utility* for each proposal using the *aggregated committee probability* and the *aggregated committee utility* for the outcomes. (EU(Proposal A) = P_success(A) * U_social(Success) + (1-P_success(A)) * U_social(Failure)).
          *   *Justification:* This separates the aggregation of factual beliefs (step 1) from the aggregation of values (step 2). Step 2 *can* appeal to Harsanyi, as members are reporting utilities over the *same* sure outcomes. However, the method for aggregating probabilities (step 1) needs its own justification (e.g., Condorcet's Jury Theorem if averaging, deference to expertise).
      *   **C. Treat Differing Probabilities as Part of the "Outcome" Description (Not Recommended):**
          *   *Concept:* Define the "outcome" so intricately that it includes *who held which belief*. E.g., "Proposal A succeeds & Member X believed P=0.7 & Member Y believed P=0.3".
          *   *Problem:* This makes the outcome space unmanageably huge and complex. More importantly, members' vNM utilities over these hyper-specific outcomes would likely be impossible to define meaningfully or consistently, and aggregating them would be practically impossible and normatively dubious. Harsanyi's theorem technically applies if you define lotteries over *this* space, but it's not a feasible or sensible solution.

  5.  **The Normative Weight of Averaging:**
      *   Even *if* beliefs were aligned, averaging vNM utilities implies **utilitarianism** under uncertainty. Harsanyi's result is a powerful *defense* of utilitarianism in this specific context. Is maximizing the *sum* of expected utilities the ethical principle your committee wants to follow? Or are there concerns about fairness, priority to the worst off, or other distributive considerations that averaging doesn't capture? The theorem provides a justification *for* averaging *if* you accept its axioms (including Pareto Indifference/Optimality and vNM rationality for society) and the utilitarian ethic.

  **Recommendations for Your Committee:**

  1.  **Explicitly Acknowledge the Probability Disagreement:** Frame the discussion around this core issue. Harsanyi requires shared lotteries, which you lack due to differing probability assessments.
  2.  **Separate Beliefs from Values:** Structure your deliberation into two distinct phases:
      *   **Phase 1 - Epistemic Deliberation:** Focus on reaching an agreed-upon (or aggregated) probability of success for each proposal. This is where expertise and evidence should be shared.
      *   **Phase 2 - Value Aggregation:** *If* using a formal method like Harsanyi, *only after* Phase 1, have members report utilities over the *sure outcomes* (success/failure) and aggregate these using averaging or another linear scheme. Calculate expected social utility using the Phase 1 probabilities.
  3.  **Consider Simplicity & Deliberation:** Formal methods have value but can be complex. Robust discussion considering both likelihood of success (Phase 1) and the value/impact of success (Phase 2) might be equally or more effective for a small committee, especially if members are generally aligned on core values but differ on empirical assessments. The formal aggregation in Phase 2 might add less value than a well-structured discussion once probabilities are harmonized.
  4.  **Scrutinize the Utilitarian Implication:** Discuss whether simply averaging individual expected utilities (once probabilities are fixed) aligns with the committee's ethical goals for distributing grants. Does it adequately handle potential inequalities in the *distribution* of expected benefit among proposers or their fields?

  **In essence:** Harsanyi's theorem is a powerful tool for aggregating preferences *under shared uncertainty*. Your committee's disagreement on probabilities means you are not operating under shared uncertainty. Attempting to average vNM utilities calculated using individual probability assessments violates the theorem's core premise and produces a normatively unjustified ranking. To leverage Harsanyi validly, you **must first resolve or aggregate the probability assessments separately** before aggregating values over the sure outcomes. The most defensible path is a clear separation of the epistemic (probability aggregation) and normative (value aggregation) tasks.
