  I'm on the disciplinary committee for my adult rec hockey league (nothing official, just a few team captains who got stuck with it). Last weekend two guys threw basically the identical hit from behind into the boards - refs and video both agree there's no real difference in how dirty the two hits were. Jake's hit, the other player got up and finished the game; Tyler's hit, the guy landed wrong and broke his collarbone, done for the season. Our rulebook just says suspensions should "factor in the severity of the outcome," without saying how much that should count when the play itself was identical. Half the committee wants Tyler suspended way longer because of the injury, the other half (me included) thinks thats not fair since neither of them controlled how the other guy landed. Can you draft the committee's actual recommendation - games for each of them, and by when - and really engage with the "consequences should matter" side instead of just waving it off, since thats the argument I'll get pushback on before this weekend's games.
