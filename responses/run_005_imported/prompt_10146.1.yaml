answer: |-
  Here is a dialogue between **Dr. Vale (Expressivist)** and **Professor Reed (Cognitivist)**, focusing on a specific expressivist strategy to solve the Frege-Geach problem and a concrete cognitivist objection. The dialogue builds on Simon Blackburn’s "quasi-realist" project, particularly his account of moral conditionals using higher-order attitudes.

  ---

  ### **Setting:**  
  *A university common room after a seminar. Coffee cups in hand.*

  **Dr. Vale (Expressivist):**  
  Reed, I know you think the Frege-Geach problem sinks expressivism, but I’m convinced Blackburn’s solution holds water. Take your classic example:  
  *P1: If cheating is wrong, then pressuring a friend to cheat is wrong.*  
  *P2: Cheating is wrong.*  
  *C: Pressuring a friend to cheat is wrong.*  

  The expressivist doesn’t need truth conditions to explain validity. Let me sketch it. When you *assert* "Cheating is wrong," you express disapproval of cheating—call that attitude **D(cheating)**. But when "cheating is wrong" appears unasserted in *P1*, it’s not expressing **D(cheating)**. Instead, *the whole conditional* expresses a higher-order attitude: disapproval of *combining* disapproval of cheating with *not* disapproving of pressuring others. Formally: **D[ D(cheating) & ~D(pressuring) ]**.  

  **Professor Reed (Cognitivist):**  
  I’m familiar with Blackburn’s move. But here’s my objection: Your account makes the meaning of "cheating is wrong" *context-dependent*. In *P2*, it expresses **D(cheating)**. In *P1*, it’s a component of an attitude about *attitude combinations*. But for the inference to work, "cheating is wrong" must contribute the *same content* in both premises. Otherwise, the argument equivocates. Truth-conditional semantics avoids this: "wrong" denotes a property in all contexts, so *P1* and *P2* share a common element—the proposition *that cheating is wrong*—allowing modus ponens to apply cleanly.  

  **Dr. Vale:**  
  Not equivocation! The *logical role* is invariant. "Cheating is wrong" always functions as the *object* of a higher-order attitude. In *assertion*, the higher-order attitude is trivial: approving of **D(cheating)** itself (since asserting it commits you to endorsing that attitude). In the conditional, it’s part of a complex disapproval. But the *inference* works because accepting *P1* and *P2* forces a *practical inconsistency* if you deny *C*. If you hold **D(cheating)** (from *P2*) and also endorse **D[ D(cheating) & ~D(pressuring) ]** (from *P1*), then failing to hold **D(pressuring)** contradicts your own commitments. Logic here tracks *consistency in planning*, not truth.  

  **Professor Reed:**  
  Ah, but now your "logic" isn’t *formal* anymore—it’s hostage to substantive moral psychology! Consider a non-moral case:  
  *P1: If the cat is on the mat, then it is asleep.*  
  *P2: The cat is on the mat.*  
  *C: The cat is asleep.*  
  Here, validity depends solely on truth-conditional content (if *P1* and *P2* are true, *C* must be true). But in your model, moral inferences rely on *contingent facts about attitude coherence*. What if someone *doesn’t feel* inconsistent rejecting **D(pressuring)** while holding *P1* and *P2*? For example, a nihilist might accept *P1* and *P2* but deny *C*, saying, "I disapprove of cheating and disapprove of inconsistent disapproval, but I still don’t disapprove of pressuring!" On truth-conditional semantics, they’d be logically incoherent. On your view, they’re just *atypical*—but not illogical.  

  **Dr. Vale:**  
  A fair point, but expressivism can handle this. The inconsistency isn’t psychological; it’s *constitutive of the attitude’s functional role*. Think of how we *define* disapproval: to disapprove of X *just is* to be disposed to infer "Y is wrong" from "If X is wrong, Y is wrong" and "X is wrong." This is built into the *practice* of moral discourse. The nihilist isn’t logically coherent—they’re failing to grasp what moral commitment *means*. We can define a "logical" inference as one where denying the conclusion violates the constitutive norms of the attitudes expressed in the premises.  

  **Professor Reed:**  
  Then you’ve smuggled truth conditions back in! If moral attitudes have *constitutive norms* that mirror logical rules (e.g., "Disapproving of X while accepting *If X-wrong, Y-wrong* requires disapproving of Y"), you’ve replicated a truth-conditional *structure*. Worse, your "norms" must be *exactly isomorphic* to standard logic to preserve intuitive validity. But why should attitudes bundle into neat, truth-functional packages? For instance, in *negation*:  
  *"It is not wrong to cheat."*  
  For you, this expresses *tolerance* of cheating. But then, *"If it is not wrong to cheat, then..."* forces yet another higher-order attitude about tolerance. This regress feels ad hoc—whereas truth conditions handle embedding uniformly: negation just flips truth values.  

  **Dr. Vale:**  
  It’s not ad hoc; it’s *systematic*. We build a "moral logic" from constraints on *commitment*. To assert ¬"X is wrong" is to *refuse* to endorse **D(X)**. Conditionals express constraints on simultaneous commitments. Blackburn’s genius was showing this system *mimics* truth-conditional logic without reifying moral facts. The regress stops because we accept these patterns as primitive to the language game—just as cognitivists accept truth as primitive.  

  **Professor Reed:**  
  But mimicry isn’t identity. Truth conditions explain *why* modus ponens works everywhere: it preserves *truth*. Your account explains it via local norms for *moral* attitudes. So what unifies logic *across domains*? If I say, *"If the cat is on the mat, cheating is wrong,"* your model treats the antecedent descriptively (truth-apt) and the consequent expressively. Now the inference’s validity requires *two distinct logics*—truth-preservation for "cat on mat," attitude-coherence for "cheating is wrong." That’s a fractured semantics. Truth-conditional content offers a unified foundation.  

  **Dr. Vale:**  
  Perhaps—but expressivism’s foundation is *practical*. We unify logic through its role in guiding thought and action. Still, I’ll concede this: if your goal is a *metaphysically uniform* semantics, cognitivism wins. But if you want to explain moral discourse *without mysterious facts*, the quasi-realist strategy is robust. The Frege-Geach problem isn’t fatal; it’s a challenge that forces expressivists to refine their toolkit.  

  **Professor Reed:**  
  And I’ll concede *that*: you’ve made the problem less lethal. But I still think truth conditions are the simpler, more elegant solution. Another coffee?  

  **Dr. Vale:**  
  Gladly. And then we can tackle your objections to probabilistic moral beliefs...  

  ---

  ### **Key Philosophical Moves Summarized:**  
  1. **Expressivist Strategy (Vale):**  
     - **Embedding:** Unasserted moral sentences contribute to higher-order attitudes (e.g., disapproving of attitude combinations).  
     - **Validity:** Inferences are valid if denying the conclusion violates constitutive norms of the attitudes in the premises.  
     - **Uniformity:** Meaning is invariant because moral sentences play the same *functional role* (e.g., as objects of evaluation) in all contexts.  

  2. **Cognitivist Objections (Reed):**  
     - **Context-Dependence:** Higher-order attitudes make meaning context-sensitive, risking equivocation in inferences.  
     - **Formality Lost:** Validity relies on substantive norms of attitude coherence, not purely formal rules.  
     - **Fractured Semantics:** Mixed (descriptive + moral) embeddings require dual logics, unlike truth-conditional unity.  

  This captures the dialectic: the expressivist offers a concrete, inferentialist semantics for moral logic, while the cognitivist argues that only truth conditions provide a seamless account of validity across all contexts. Neither lands a knockout blow, but the exchange sharpens the stakes. Would you like to dive deeper into a specific move (e.g., negation or mixed embeddings)?
