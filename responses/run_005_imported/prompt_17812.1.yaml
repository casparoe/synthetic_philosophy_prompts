  First, I need to visualize their struggle. They grasp the Dutch Book argument but find the "purely epistemic" version slippery. The mention of immodesty and dominance breakdown under absolute-value scoring suggests they've hit a conceptual wall. Their frustration is palpable - they want the geometric intuition, not just proofs. 

  Hmm, the core tension lies in propriety. Why must we measure accuracy this specific way? And is it circular? I recall Joyce's argument turns on coherence guaranteeing no accuracy-dominance, but only if the scoring rule forces your credences to "report honestly." That's the key - like how quadratic scoring makes you reveal true beliefs to avoid expected penalty. 

  For geometry: imagine credence vectors in a probability simplex. Absolute-value scoring creates diamond-shaped level sets where incoherent points (outside simplex) might actually be closer to truth in some worlds - say, when truth is at a vertex. But quadratic scoring's spherical contours ensure coherent points always dominate. 

  Ah! And the circularity worry... Properness itself assumes you're comparing expected scores using probability calculus. But Joyce isn't assuming probabilism - he's showing any incoherent credences violate dominance under any proper rule. The constraint comes from outside, from what accuracy means. Though... maybe one could argue that demanding "truth-directedness" already implies probabilistic structure? 

  Their underlying anxiety seems meta-epistemological: is accuracy-first secretly consequentialist? But Joyce's move feels more like defining epistemic virtue rather than smuggling in norms. Still, worth acknowledging the objector's point about separable propositions. 

  ...Better start simple. Use concrete examples - maybe a three-world model with credences on rain. Show how incoherent (0.6, 0.6) gets dominated under quadratic but not absolute scoring. Then reveal why: absolute scoring lets you "cheat" by being inconsistently bold without penalty. The immodesty angle matters because if your own credences don't trust themselves, that's pathological. 

  Final thought: emphasize that propriety isn't arbitrary - it's what stops the scoring rule itself from distorting epistemic motives. Like a ruler that changes length unless you hold it straight. That should resolve the "neutral methodological choice" concern.
answer: |-
  Let's break down Joyce's accuracy-dominance argument for probabilism, focusing on the intuition behind dominance, the critical role of *strict propriety*, and the lurking philosophical questions about circularity. We'll use geometric intuition where possible.

  ### Core Claim & Setup
  - **Goal**: Show that **incoherent credences** (violating probability axioms) are always **accuracy-dominated** by some coherent set.
  - **Accuracy-Dominance**: A credence function **B** *dominates* **C** if **B** is at least as accurate as **C** in every possible world and strictly more accurate in at least one world.
  - **Scoring Rule**: A function **S(C, w)** measuring the inaccuracy of credence assignment **C** when world **w** is actual. We assume **S** is *truth-directed* (accuracy improves as credences move toward truth-values).

  ---

  ### Why Coherence Guarantees Non-Dominance (Under Proper Rules)
  1. **The Probability Simplex**:  
     Imagine all coherent credence functions (obeying probability axioms) as points in a **convex simplex**. For 3 possible worlds, this is a triangle in 3D space:
     - Vertices = (1,0,0), (0,1,0), (0,0,1) (certainty in one world).
     - Edges/Faces = Credences with uncertainty.  
     Incoherent credences lie *outside* this simplex (e.g., assigning P(A) + P(¬A) = 1.2).

  2. **Strictly Proper Scoring Rules & Projection**:  
     A scoring rule is **strictly proper** if every coherent credence function **C** *expects itself to be more accurate* than any other fixed credence **B** ≠ **C**.  
     - **Brier/Quadratic Rule**: Inaccuracy = ∑<sub>i</sub>(C(w<sub>i</sub>) - truth<sub>w_i</sub>)².  
       *Geometrically*: Inaccuracy = squared Euclidean distance from **C** to the truth-vector **v<sub>w</sub>** (which has 1 at true world, 0 elsewhere).  

     **Key Property**: Under strictly proper rules like Brier:  
     - The coherent credence **C** that minimizes *expected inaccuracy* (by **C**'s own lights) is **C itself**.  
     - This creates a "pull" toward the simplex. For any incoherent **C**, there’s a coherent point **C*** inside the simplex "closer" to every possible truth-vector **v<sub>w</sub>** in expectation.

  3. **Dominance via the Propriety Guarantee**:  
     - Because **C*** is coherent and strictly proper, **C*** expects itself to be more accurate than **C** in every world.  
     - Crucially, propriety ensures **C*** can be chosen such that it **dominates C everywhere**:  
       - Since **C** is *outside* the simplex, and the simplex is convex, we can find a **C*** "between" **C** and the simplex.  
       - Quadratic scoring’s spherical level sets ensure **C*** is closer to *all* truth-vectors than **C** is, if **C** is incoherent.  
       *Example*: Suppose **C** assigns (0.6, 0.6) to two mutually exclusive events. Coherent **C*** = (0.5, 0.5). In every world, **C*** is closer to the truth (0/1) than **C** is:  
       - If World 1: S(C, w1) = (0.6-1)² + (0.6-0)² = 0.52  
         S(C*, w1) = (0.5-1)² + (0.5-0)² = 0.50  
       - If World 2: S(C, w2) = (0.6-0)² + (0.6-1)² = 0.52  
         S(C*, w2) = (0.5-0)² + (0.5-1)² = 0.50  

  ---

  ### Why Absolute-Value Scoring Breaks the Argument
  **Absolute-Value Rule**: S(C, w) = ∑<sub>i</sub> |C(w<sub>i</sub>) - truth<sub>w_i</sub>|.  
  - **Not strictly proper**: A coherent **C** may *expect* another credence **B** to be more accurate than itself.  
    *Example*: Let **C** assign P(rain) = 0.7. Under absolute-value:  
    - If rain, inaccuracy = |1 - 0.7| = 0.3  
    - If no rain, inaccuracy = |0 - 0.7| = 0.7  
    **C**’s *expected inaccuracy* (by its own lights):  
      0.7 × 0.3 + 0.3 × 0.7 = 0.42  
    But **C** expects a credence of **B**=1.0 (certainty of rain) to have inaccuracy:  
      0.7 × |1-1| + 0.3 × |1-0| = 0.3  
    So **C** expects **B** to be *more accurate* than itself → **Immodesty** (it distrusts its own accuracy).  

  **Dominance Failure**:  
  - An incoherent **C** may *not* be dominated by any coherent **C*** under absolute-value.  
    *Example*: Suppose two worlds. Let **C** assign (0.4, 0.8) to (w1, w2) → incoherent (sum >1).  
    - Truth-vectors: **v1** = (1,0), **v2** = (0,1)  
    - S(C, w1) = |0.4-1| + |0.8-0| = 0.6 + 0.8 = 1.4  
    - S(C, w2) = |0.4-0| + |0.8-1| = 0.4 + 0.2 = 0.6  
    Now consider coherent alternatives:  
    - **C1** = (1,0): S(C1, w1) = 0, S(C1, w2) = |0-0| + |0-1| = 1 → worse than C in w2  
    - **C2** = (0,1): S(C2, w2) = 0, S(C2, w1) = 1 → worse in w1  
    - **C3** = (0.5,0.5): S(C3, w1) = 0.5 + 0.5 = 1 < 1.4 (better in w1), but S(C3, w2) = 0.5 + 0.5 = 1 > 0.6 (worse in w2)  
    No coherent **C*** dominates **C** everywhere.  

  **Geometric Intuition**:  
  - Absolute-value scoring has "diamond-shaped" (L1) level sets. Incoherent points can lie in "pockets" where no coherent point is closer to *all* truth-vectors simultaneously.  
  - Quadratic scoring (L2) has "spherical" level sets, ensuring the simplex "shields" truth-points from incoherent outsiders.  

  ---

  ### Is Requiring Propriety Methodologically Neutral?
  **The Circularity Worry**: Does demanding a strictly proper scoring rule *presuppose* probabilism?  
  - **The Argument**:  
    1. Propriety is defined via *expected inaccuracy*.  
    2. Computing expectation requires a probability function (to weight worlds).  
    3. So we assume coherence to define propriety, then use propriety to justify coherence.  
  - **Joyce's Response**:  
    - Propriety is a constraint on the *scoring rule itself*, not on the agent. It’s part of defining "accuracy."  
    - We can assess propriety using *any* probability function (e.g., the function **C** we’re evaluating). We’re not assuming the agent is coherent.  
    - **Counter**: Even so, the *concept* of "expected inaccuracy" imports probabilistic structure. Can accuracy-first epistemology escape its consequentialist foundations?  

  **A Middle Ground**:  
  - Propriety ensures that scoring rules incentivize "honest reporting" of beliefs. Without it, the scoring rule itself distorts epistemic motives.  
  - But the choice *is* substantive. It rules out intuitive measures (like absolute value) and favors quadratic scoring, which has structural affinities with Euclidean distance and least-squares optimization—tools deeply tied to probability.  

  **Objection from Separability**:  
  Some argue that quadratic scoring presumes "separability" of propositions (total inaccuracy = sum of individual inaccuracies), which may not be epistemically neutral. If propositions aren’t separable, should we score them holistically?  

  ---

  ### Key Takeaways
  1. **Strict propriety** ensures that coherent credences are "self-recommending" and prevents incoherent ones from hiding in accuracy "pockets."  
  2. **Quadratic scoring** works because its spherical geometry forces incoherent credences outside the probability simplex to be farther from *all* truth-vectors.  
  3. **Circularity concerns** linger: Propriety leverages probabilistic expectations to define accuracy, creating tension for "purely epistemic" justifications. Yet it remains the most compelling escape from Dutch Book’s pragmatism.  

  For deeper exploration: Consider how Joyce’s theorem generalizes to infinite sets (via dominance by *countably additive* probabilities) and the ongoing debate over "accuracy-first" epistemology’s foundations (e.g., Pettigrew’s work). The elegance is undeniable, but the philosophical underpinnings remain contested.
