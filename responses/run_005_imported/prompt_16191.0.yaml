  - Marcus argues that recursive decomposition doesn't solve the problem because the debater doing the decomposing is the one you don't trust. A liar can decompose dishonestly, leading the judge down a rabbit hole. He cites experiments showing that judges' accuracy correlated more with persuasiveness than with correctness, suggesting that the fix doesn't work with real judges.

  Move (5): Elena's Rebuttal on Experiments
  - Elena points out that the same experiments showed that when debaters were pushed to be more persuasive, judges also became more accurate. She interprets this as evidence that, at the current capability gap, persuasiveness and truth are not as decoupled as Marcus claims.

