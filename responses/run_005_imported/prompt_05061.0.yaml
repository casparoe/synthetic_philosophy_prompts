  First, I need to accurately reconstruct both theories at their strongest. For Frege, the object/concept distinction is fundamental: concepts are inherently predicative ("unsaturated") while objects are complete ("saturated"). This isn't just a label - it's built into his function-argument logic. Armstrong, meanwhile, treats states of affairs as ontological primitives with a unique composition operation where particulars and universals gain identity only within facts. 

  The core argument I'll develop is that both solutions share three problematic features: (1) They ground unity in a primitive ontological distinction (unsaturatedness/non-mereologicality) that's defined by its immunity to regress. (2) This immunity is stipulated rather than explained - we're told concepts/states-of-affairs just don't need further unification. (3) Consequently, neither actually explains how unity emerges; they merely relocate the problem to a privileged category.

  I should anticipate counterarguments. Fregeans might emphasize that unsaturatedness follows from his logic's function-application model, which isn't arbitrary. Armstrongians could stress that his view emerges from systematic ontology-building, not mere stipulation. But I'll argue these are just sophisticated ways of embedding the stipulation - the explanatory gap remains why functions/facts unify when relations don't.

