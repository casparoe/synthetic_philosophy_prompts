  **Justifications:**  
  1. **Nadia (Score 2):** Correctly identifies that physiological markers (pulse, startle response, insomnia) are standard diagnostic criteria for fear in psychology and neuroscience. These are objectively measurable indicators of genuine autonomic arousal.  
     
  2. **Colin (Score 1):** Partially right about belief being central to *standard* fear, but oversimplifies by dismissing physiological responses as merely "symptoms." Fear has embodied and affective dimensions beyond cognitive belief.  

  3. **Nadia (Score 2):** Strong counterexample. Arachnophobia studies (e.g., Öhman's research) confirm that fear persists despite conscious disbelief. Proves fear can be decoupled from "threat belief" in the moment.  

  4. **Colin (Score 1):** Valid distinction between fast perceptual processing (amygdala-driven) and slower cognition, but underestimates fiction's ability to exploit this. Cinematic techniques (e.g., POV shots, sound design) can trigger perceptual "presence" illusions.  

  5. **Nadia (Score 2):** Devastating against belief-centric views. Sustained dread (e.g., during *Hereditary*'s buildup) involves deliberate cognitive engagement with imagined possibilities, not transient misperception. Affective neuroscience (e.g., Panksepp) treats such states as genuine fear.  

  6. **Colin (Score 1):** Correct that intentionality matters (fear *of X*), but wrongly assumes fiction lacks representational content. We fear *for Anna Karenina* under the mode of "what-if" contemplation. His grief/relief analogy fails: grief requires *past* belief in loss; fictional fear requires only *focused attention* on hypotheticals.  

  **What Both Overlook:**  
  - **Nadia** underplays how fictional emotions differ phenomenologically (e.g., lacking action tendencies like fleeing) and how metacognitive awareness ("this isn't real") modulates them.  
  - **Colin** neglects that emotions exist on a spectrum (core affect vs. full cognitive appraisal) and that fiction leverages evolved threat-detection systems through immersion.  
  - **Both** miss a potential synthesis: fictional fear is *real affect* driven by embodied simulation (Gallese's mirror neuron theory), but its *intentional object* is "offline" (Currie's "i-desire"). This explains why it feels authentic yet doesn't trigger 911 calls.  

  **Key Insight:** The paradox dissolves if we recognize that emotions aren't monolithic. Fictional fear is a hybrid state—genuine at the physiological level, simulated at the cognitive level—enabled by narrative immersion hijacking our empathetic circuitry.
