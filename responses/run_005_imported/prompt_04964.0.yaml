  Let me break down Chalmers' method. The key is disambiguation: attaching subscripts to contested terms. If both parties accept each other's claims under their own definitions, the dispute is verbal. For example, in the microservices debate, one team might define "service" as independently deployable units (microservices), while another sees it as well-modularized code within a monolith. If after clarifying, they agree both structures are valid under their respective definitions, the original disagreement was verbal.

