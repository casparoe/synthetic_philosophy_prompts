answer: |-
  Your resistance is philosophically astute, and your friend's objection, while understandable, likely misapplies Spinoza's system. Let's rigorously reconstruct Spinoza's argument in *Political Treatise* Chapter 11 and demonstrate why the "custom vs. nature" rebuttal fails within his framework, drawing on his core commitments in Chapter 2 and the *Ethics*.

  **1. Spinoza's Argument in TP Chapter 11: Structure & Logic**

  *   **Goal:** Determine who is *sui juris* (independent) and thus entitled to vote in a democracy.
  *   **Method:** Empirical/Historical Analysis of Power Relations ("Experience shows..." - TP 11.3).
  *   **Exclusions Made:**
      *   **Foreigners:** Excluded as not bound by the commonwealth's *potentia* (power structure).
      *   **Servants/Slaves:** Excluded because their *potentia* is subsumed under their master's command ("they are under the authority of their masters" - TP 11.4). Their actions follow their master's *conatus*.
      *   **Children:** Excluded until they reach an age where reason guides them more than childish passions, and they are no longer under parental *potentia* (TP 11.4).
  *   **The Case of Women:**
      *   **Empirical Premise:** "Nowhere... have women by nature held equal right with men." (TP 11.3). The Amazons are dismissed as replacing male rule with female rule, not establishing joint rule (TP 11.4).
      *   **Affective Premise:** Sexual jealousy and rivalry would inevitably disrupt joint rule ("if men and women were by nature equal in strength and intellect... they would still be... kept in check... by modesty... and by the... jealousy and rivalry... of love" - TP 11.4).
      *   **Conclusion:** Women are not *sui juris* relative to men in the political sphere. Their exclusion is "not by civil law, but by nature" (TP 11.4). Their *potentia* is insufficient for equal political standing.

  **2. Your Friend's Objection: The "Debunking Move"**

  *   **Core Claim:** Spinoza inconsistently fails to apply his standard method of explaining apparent "natural" differences (e.g., social hierarchies, prejudices) as products of *imagination* and *custom* (affective conditioning), not inherent nature. The *Ethics* (e.g., IV, P37 Schol. 1, P44 Schol.) and other parts of the TP demonstrate this method. The Adam/Eve example (*Ethics* IV, P68 Schol.) shows Spinoza *can* conceive of fundamental equality.
  *   **Inference:** Since women's subordination is demonstrably *customary* (a product of historical imagination/affects), a "consistent Spinozist" should debunk it as contingent and normatively inert. Spinoza's exclusion is therefore an embarrassing lapse, refuted by his own resources.
  *   **Evidence:** Commentators like Hasana Sharp emphasize the *Ethics* IV, P68 Schol.: Spinoza argues Adam and Eve were equally free and possessed equally adequate knowledge before the Fall, differing only in bodily strength and temperament. This suggests fundamental equality under reason's guidance.

  **3. Why the "Debunking Move" Fails: Spinoza's Naturalism & the Primacy of *Potentia***

  Your suspicion is correct. The objection smuggles in a nature/convention distinction that Spinoza's political naturalism dissolves. Here's why:

  *   **a. The Collapse of Nature/Convention (TP Ch. 2 & *Ethics*):**
      *   Spinoza explicitly rejects the idea that humans form a "dominion within a dominion" (*Ethics* III Pref; TP 2.6). Humans, like stones or fish, are modes of Nature/God, governed by its universal laws.
      *   **Natural Right = Actual Power (*Potentia*):** "The natural right of every individual is coextensive with its power (*potentia*)" (TP 2.4). "By the right and established order of nature I mean nothing other than the rules of the nature of each individual, according to which we conceive each thing to be naturally determined to exist and to act in a certain way" (TP 2.4).
      *   **Passions & Imagination ARE Nature:** "The affects of hate, anger, envy, etc., considered in themselves, follow from the same necessity and force of nature as the other singular things" (*Ethics* IV, App. I). Confused ideas (imagination) and the passions they generate are *not* unnatural interruptions of reason; they are expressions of *conatus* under conditions of inadequate ideas. They follow nature's laws just as necessarily as reason does.
      *   **Consequence:** A power differential produced and sustained by custom, upbringing, and imagination **is** a *natural* phenomenon. The affects driving jealousy, the social institutions reinforcing subordination, the patterns of obedience and command – all are manifestations of actual *potentia* unfolding according to the laws of human nature interacting with environmental conditions. To call it "merely conventional" implies it's somehow *less real* or *less natural* than a difference in physical strength. For Spinoza, it isn't. Both are expressions of *natura naturata*.

  *   **b. *Potentia* is Descriptive, Not Normative (in this context):**
      *   Spinoza's political theory in the TP is primarily *descriptive* and *realist*. He aims to understand how states *actually* function and endure based on the mechanics of human affects and power (*potentia*). He derives right (*jus*) directly from this descriptive account of power (TP 2.3-4).
      *   **TP Chapter 11's Task:** It is *not* prescribing an ideal republic based on pure reason. It's empirically analyzing *who currently possesses sufficient independent power (sui juris)* to be included in the democratic council *given the actual affective and power dynamics observed historically and universally*. The argument is: "Experience and analysis of human affects show that women, *as a class under prevailing conditions*, do not possess the requisite independent *potentia* relative to men to form part of the *sui juris* citizenry."
      *   **The Role of "Nature":** When Spinoza says exclusion is "by nature," he doesn't mean "by immutable female essence." He means "by the *actual nature of things as they universally stand*, given the observed dynamics of human passion and historical power relations." It's a statement about the *current configuration of potentia*, not a metaphysical claim about female incapacity *sub specie aeternitatis*.

  *   **c. Why "Customary" Doesn't Equal "Contingent & Normatively Irrelevant":**
      *   **Contingency vs. Actuality:** While the *specific* customs might be contingent, the *resulting power structure* is *actual*. For Spinoza, politics deals with *actuality* – the *potentia* that *is*. Pointing to the contingent origins of a power imbalance doesn't negate its *current reality* as a factor determining who is *sui juris*. The master/servant relationship is highly contingent and customary, yet Spinoza unhesitatingly excludes servants based on their *current* lack of independent *potentia*.
      *   **Normative Irrelevance?** Within Spinoza's framework, the *fact* of the power imbalance *is* normatively relevant *for determining political right (jus) in that specific context*. Right *is* coextensive with power. To say the subordination is customary doesn't give the Spinozist political theorist grounds to *ignore* its effect on the distribution of *potentia* when designing institutions meant to function stably in the real world of passions. Stability is paramount (TP 1.6).

  *   **d. Addressing the Adam/Eve Counterexample (Ethics IV, P68 Schol.):**
      *   This passage occurs in the *Ethics*, focused on the *individual* under the guidance of reason (*sub rationis ductu*). It describes a state of rational equality *possible* for individuals freed from superstition and guided by adequate knowledge.
      *   **Key Difference:** The *Political Treatise* deals with *collective* *potentia* and the *actual* affective foundations of political life, where reason rarely holds full sway. Spinoza is explicit: states must be designed for humans as they *are*, dominated by passions (TP 1.1, 1.5, 5.1). The Adam/Eve ideal is precisely that – an ideal achievable only by the truly rational, which excludes almost everyone most of the time.
      *   **Not a Contradiction, but a Different Domain:** The Adam/Eve passage shows Spinoza's belief in fundamental *potential* equality under reason. The TP Ch. 11 argument deals with the *actual* inequality of *potentia* in the political sphere under historically observed affective conditions. Recognizing potential doesn't negate the descriptive reality he analyzes for institutional design. Sharp's point highlights a tension, but not a direct refutation of the TP argument's internal logic within its *descriptive* and *realist* frame.

  **4. Where Your Friend's Inference Breaks Down:**

  The inferential move – "from 'it's custom, not nature' to 'a Spinozist has no reason to endorse it'" – fails because:

  1.  **Misunderstands 'Nature':** It relies on a dualistic "nature vs. custom" distinction that Spinoza rejects. Custom *is* natural within his monistic system.
  2.  **Misapplies the "Debunking":** The debunking move (showing something isn't metaphysically necessary) is valid for challenging *false essentialisms* (e.g., "women are *inherently* irrational"). However, Spinoza's TP 11 argument isn't *primarily* based on essentialism; it's based on an empirical claim about *actual, sustained power relations (potentia)* resulting from customary affective dynamics. Debunking the essentialism doesn't automatically debunk the empirical power analysis.
  3.  **Confuses Descriptive & Prescriptive:** The move assumes Spinoza *endorses* the exclusion normatively. His argument is primarily descriptive: *given how power actually works*, including women would destabilize the state (due to jealousy, etc.). He sees this as a fact about affective reality, not a moral ideal. His "endorsement" is a pragmatic conclusion about institutional stability based on power dynamics, not a moral judgment on women's worth.
  4.  **Overlooks the Primacy of *Potentia*:** The core of Spinozist political right is *actual power*. The *origin* of a power imbalance (custom, biology, economics) is secondary to its *existence* for determining *jus* in a specific context. Pointing out the origin is "custom" doesn't dissolve the *potentia* differential; it just explains its mechanism.

  **5. Conclusion: Consistency and the Limits of Rescue**

  *   **Consistency Salvaged?** Yes, regarding the *specific inferential move* your friend makes. Spinoza's argument in TP Ch. 11, however unpalatable, is *consistent* with his core doctrines of natural right (*jus* = *potentia*), the collapse of nature/convention, the reality of passions as natural forces, and his descriptive/pragmatic approach to politics. He applies the same logic to servants and children. The exclusion is based on an analysis of *actual, historically observed potentia*, deemed necessary for stability.
  *   **The Limits & Tensions:** The rescue shows *consistency*, not that Spinoza was *correct* or that his argument is *unassailable within his own system*. Critiques can focus on:
      *   **Empirical Flaws:** Was his historical analysis accurate? Did he overlook genuine counterexamples (even if rare)? Was his assessment of the affective dangers (jealousy) exaggerated or deterministic?
      *   **Internal Tension:** Does his own account of *conatus* and the *power of reason* create an implicit telos towards greater freedom and equality that his pessimistic realism here stifles? The Adam/Eve passage fuels this critique.
      *   **Definition of *Sui Juris*:** Could a more nuanced analysis reveal ways women *do* exercise significant *potentia*, just not in the formal, male-dominated sphere he examines? (This points to a potential blind spot).
  *   **The Real Lapse?** The lapse might not be inconsistency, but rather a failure of imagination or empirical rigor *within* his descriptive framework. He assumes the *only* possible outcomes are male rule, female rule (Amazons), or instability – failing to conceive how institutions might *transform* affective relations over time (a possibility his theory of affects *could* allow for, but which his historical pessimism overruled).

  In essence, your friend's objection identifies a profound tension in Spinoza between his radical metaphysics of equality and potential and his deeply conservative, affectively grounded political realism. However, her specific inferential move – from "custom" to "no Spinozist reason to endorse" – fails because it misunderstands the ontological status of custom and the foundational role of *actual potentia* in determining *jus* within Spinoza's political naturalism. The exclusion is deplorable, but its mechanism operates within the logic of his system as presented in TP Ch. 2 and 11.
