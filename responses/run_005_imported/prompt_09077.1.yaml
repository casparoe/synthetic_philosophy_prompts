prompt: |-
  So this term I'm taking a seminar on 19th century British ethics, and we just spent two whole classes on the ending of Sidgwick's *Methods of Ethics* -- the "dualism of practical reason" bit where he basically admits that egoism and utilitarianism can't be rationally reconciled unless there's some kind of moral order to the universe guaranteeing that duty and self-interest coincide. Our professor mentioned almost as an aside that this is apparently part of why Sidgwick spent so much of his later life doing psychical research with the SPR (he was literally its first president), which kind of threw me because in every other context he's held up as this careful, deflationary, take-nothing-on-faith analytic philosopher. Anyway, our department is bringing in a guest speaker next month who's written a whole book tying Sidgwick's ethics to his psychical research years, and I somehow got roped onto the student committee that drafts questions for the audience Q&A after the talk.

  Could you help me write eight to ten interview-style questions for this? I don't want anything she could answer by basically reciting the SEP entry on Sidgwick -- I want questions that actually push on the connection between the philosophy and the ghost-hunting. Specifically I need at least one question on whether the dualism argument really requires an empirical payoff (i.e. actual evidence of immortality or a moral government of the universe) to go through, or whether that's an over-psychologized reading of what's supposed to be a purely rational argument; one on the tension between his famously rigorous, skeptical methodology (the Census of Hallucinations, exposing mediums who cheated, etc) and the fact that he was privately hoping for a positive result -- doesn't the hope risk motivated reasoning even from someone that careful; and one on how we should read the fact that he died still agnostic after roughly two decades of investigating and never got the evidence he wanted -- is that a failure of the whole project, or is a rigorous null result philosophically significant in its own right, and either way what does it do to the dualism argument if the proof never showed up. For each of those three, give me a sharp follow-up keyed to whatever answer she's most likely to give, so she can't just deflect with the obvious move. If you can see an angle I'm missing (maybe something about the cross-correspondences that supposedly started right after he died) throw in an extra question or two of your own.
