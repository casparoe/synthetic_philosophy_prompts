prompt: |-
  In my formal epistemology seminar we recently covered Good's theorem: for a Bayesian agent facing a decision, the expected value of cost-free evidence is never negative, provided the agent conditionalizes on it and then chooses whatever act maximizes expected utility afterward. Two classmates of mine, Mara and Devon, got into a running argument about what this actually shows, and I'd like an impartial referee.

  (1) Mara opened by claiming the theorem proves a rational agent should always accept a free, no-strings look at more evidence before deciding, since declining it can never do better in expectation than accepting.

  (2) Devon objected with apparent counterexamples: people who turn down a free genetic test for a condition with no available treatment, or who ask a friend not to reveal how a film ends before they watch it, without thereby seeming irrational.

  (3) Mara replied that these aren't real counterexamples. Once dread or spoiled suspense is part of the payoff, "learn the result" and "stay ignorant" are two different acts, each with its own built-in utility, rather than a case of freely inspecting evidence before choosing an otherwise fixed act — so the theorem was never about situations like that.

  (4) Devon countered that this move only saves the theorem by making it unfalsifiable: whenever information seems to leave someone worse off, you can redescribe the case so that the harm was "really" part of the payoff of the act of learning, guaranteeing the theorem comes out true no matter what.

  (5) Mara granted that she couldn't say in general, in advance, which real-life decisions have the clean structure the theorem needs, but maintained that this only shows applying the theorem takes judgment, not that it is empty or unfalsifiable.

  Could you go through Mara and Devon's exchange move by move, saying who has the better of it at each of (1) through (5) rather than just declaring an overall winner, and flag anything important that you think both of them are overlooking about what Good's theorem does and doesn't license us to conclude about seeking out more information?
reasoning: |-
  Okay, let me try to unpack this Good's theorem debate between Mara and Devon. The user wants a move-by-move analysis of their argument, so I need to carefully track each step.

  First, Mara's claim (1) seems straightforward - she says rational agents should always take free evidence. But Devon's counterexamples (2) about genetic tests and movie spoilers feel intuitively persuasive. I recall Good's theorem assumes utilities don't change with information, which might explain why Devon's examples feel like exceptions.

  When Mara responds (3) by redefining utilities to include psychological factors, Devon's worry (4) about unfalsifiability makes sense. If we can always tweak utility functions after the fact, does the theorem say anything meaningful? Mara's acknowledgment (5) about needing judgment seems important though - real-world applications aren't always clean.

  Hmm... both are missing that Good's theorem is about expectation before seeing the evidence. The actual outcome might be worse, but on average it shouldn't hurt. Also, the theorem doesn't cover cases where learning changes preferences, like when new information alters how you feel about outcomes.

  The user's seminar context suggests they need precision about Bayesian epistemology. I should emphasize that the theorem holds mathematically given its assumptions, but applying it requires checking if those assumptions hold - like fixed acts and stable utilities. Devon's examples likely violate the stable utility assumption.

  For the genetic test case, the anxiety of knowing might reasonably be part of the utility. But for movie spoilers, is "surprise" really part of the payoff or a separate cognitive effect? That distinction matters for whether Mara's move is ad hoc or justified.

  Ultimately Mara has the stronger technical position, but Devon rightly points out application challenges. The theorem isn't unfalsifiable - if we could find a case with stable utilities where learning hurts in expectation, it would falsify it. But such cases are rare because we can usually model psychological costs as part of utilities.
answer: |-
  Let's break down Mara and Devon's exchange step by step, assessing the strengths and weaknesses of each argument while clarifying the scope of Good's theorem. The key insight both sometimes overlook is that **Good's theorem is a mathematical truth about *expected utility calculations* under specific Bayesian assumptions, not a universal empirical claim about human psychology.**

  ### (1) Mara's Initial Claim
  * **Claim:** "A rational agent should always accept free evidence since declining can never do better in expectation."
  * **Assessment: Mara is *largely correct* within the theorem's strict framework.**
      * **Strengths:** Good's theorem proves that *before* seeing the evidence, the expected utility of the two-stage process (see evidence, then choose best act) is at least as high as the expected utility of choosing an act immediately without the evidence, and strictly higher if the evidence might change the optimal act. Declining free evidence *cannot yield a higher expected utility* under the model.
      * **Weaknesses:** Her phrasing "should always accept" subtly overreaches by implying a categorical imperative for *real agents*. The theorem assumes:
          1. The agent will *conditionalize* correctly on the new evidence.
          2. The set of *acts* and their *state-dependent utilities* remain fixed and unaffected by the *process* of learning itself.
          3. The evidence is genuinely *cost-free* (no time, cognitive, or psychological costs within the utility model).
      * **What's Overlooked?** Mara implies the theorem directly prescribes real-world action. It doesn't; it describes a property of the Bayesian decision model. Whether a *real human* "should" do it depends on whether the model's assumptions hold *for that specific situation and agent*.

  ### (2) Devon's Counterexamples
  * **Claim:** Real-world cases (genetic test w/o treatment, movie spoiler avoidance) show people rationally rejecting free information.
  * **Assessment: Devon is *intuitively correct* but *misapplies* the counterexamples to the theorem's core claim.**
      * **Strengths:** He correctly identifies situations where *real people*, acting rationally *by their own lights*, prefer ignorance. This highlights the gap between the formal Bayesian model and human rationality involving psychological states.
      * **Weaknesses:** His examples likely violate the theorem's assumptions:
          1. **Genetic Test:** Learning the result *changes the agent's psychological state* (dread, anxiety), which likely *changes the utilities* of future states/acts (e.g., "living without knowing" vs. "living knowing I have the condition" become different states with different utilities). The utilities aren't stable.
          2. **Movie Spoiler:** "Experiencing surprise/narrative flow" is a core component of the utility of watching the film. "Watch unspoiled" and "watch spoiled" are effectively *different acts* with different utility structures. The "act" isn't fixed.
      * **What's Overlooked?** Devon conflates the *mathematical definition of rationality* within Good's specific model (maximizing expected utility with fixed acts/utilities) with *broader, psychologically-rich notions of rationality*. The theorem isn't falsified by cases violating its core assumptions.

  ### (3) Mara's Defense (Redescription)
  * **Claim:** Devon's examples involve different acts/utilities; they don't fit the "fixed act" structure the theorem requires.
  * **Assessment: Mara is *conceptually correct* and this is the standard Bayesian response.**
      * **Strengths:** She precisely identifies why Devon's examples aren't counterexamples *to the theorem as formally stated*. Good's theorem compares expected utilities for a *fixed* set of acts *before* and after receiving evidence. If learning the evidence *redefines* the acts or utilities (like making "living with knowledge" a distinct state), the "before" and "after" scenarios aren't comparing the same decision problem. The theorem's guarantee applies only when the decision problem structure remains constant *except* for the agent's beliefs.
      * **Weaknesses:** While conceptually sound, this move can *feel* like evasion when presented without acknowledging the psychological reality Devon points to.
      * **What's Overlooked?** Mara correctly applies the model but doesn't fully engage with Devon's underlying point: that the theorem's strict assumptions (stable acts/utilities) often don't hold for decisions involving anticipation, emotion, or intrinsic value of knowledge/ignorance.

  ### (4) Devon's Charge of Unfalsifiability
  * **Claim:** Redescribing harms as part of the payoff makes the theorem unfalsifiable.
  * **Assessment: Devon has a *valid concern* about application, but *overstates* it regarding the theorem itself.**
      * **Strengths:** He correctly identifies a potential pitfall in *applying* the theorem: one could *always* preserve the theorem's truth by *post-hoc* adjusting the utility function to incorporate any negative effects of learning as part of the state/act description. This risks making the *practical advice* ("always seek free evidence") vacuous.
      * **Weaknesses:**
          * **The Theorem Itself:** As a mathematical theorem (EV(see evidence) >= EV(don't see evidence) under assumptions A, B, C), it *is* unfalsifiable by empirical observation – it's a deductive consequence of probability/utility axioms. You can't "falsify" Pythagoras with a poorly drawn triangle.
          * **Misplaced Charge:** The unfalsifiability charge applies more to the *interpretation* or *application* ("rational agents should always seek free evidence in real life") than to the theorem itself. The theorem is only "guaranteed true" *if* its assumptions hold.
      * **What's Overlooked?** Devon misses that *rational reconstruction* is fundamental to decision theory. The question isn't "Can we *always* redescribe?" but "Is the *most natural/parsimonious* description of this decision problem one with stable acts and utilities?" If psychological consequences are *integral* to the outcomes (like dread or surprise), incorporating them into the utility function isn't cheating; it's *accurate modeling*. The theorem doesn't forbid this; it *requires* it for applicability.

  ### (5) Mara's Concession on Judgment
  * **Claim:** Applying the theorem requires judgment about whether the decision has the "clean structure," but this doesn't make the theorem empty.
  * **Assessment: Mara has the *stronger position* here.**
      * **Strengths:** She acknowledges the crucial point: **Good's theorem provides a powerful *normative insight within its well-defined scope*, not a universal decision rule.** Determining if a real-world scenario fits the "clean structure" (stable acts, stable utilities, cost-free evidence, perfect conditionalization) *does* require judgment. This doesn't render the theorem empty; it clarifies its domain and value. It tells us that *if* psychological factors aren't central (e.g., a scientist analyzing pure data, a poker player calculating odds), seeking more free evidence is rationally mandated. In cases where knowledge itself alters values (Devon's examples), the theorem simply *doesn't apply*, and different reasoning is needed.
      * **Weaknesses:** None significant. This is a mature understanding of the theorem's role.
      * **What's Overlooked?** (By both, generally): The theorem also relies on the agent's ability to *correctly conditionalize* and *accurately assess* the possible evidence and its likelihoods. Computational limits or biased updating in real humans can also create situations where seeking evidence *in practice* might not yield the expected benefit, even if the theorem holds *in theory* under ideal conditions.

  ## Overall Referee Summary & Key Clarifications

  * **Mara Wins (1), (3), and (5):** She correctly states the theorem's implication within its model (1), correctly explains why Devon's examples fall outside this model due to non-fixed utilities/acts (3), and correctly argues that applying it requires judgment about the decision structure without making the theorem vacuous (5).
  * **Devon Wins (2) and (4) partially:** He successfully highlights important real-world limitations of the theorem's *direct practical applicability* by identifying cases where its core assumptions (stable utilities/acts) fail (2), and he raises a valid concern about the potential for *ad hoc* utility redescription making the *prescriptive advice* derived from the theorem seem unfalsifiable in practice (4). However, he overreaches by implying this challenges the *theorem itself* rather than its *interpretation and application*.
  * **Crucial Overlooked Points (What Good's Theorem Really Shows):**
      1. **It's About Expectation *Before* Seeing Evidence:** The "expected value" is non-negative *before* you know *what* the evidence will say. The *actual* evidence you get *might* make you worse off (e.g., learning you have an untreatable disease causes dread). The theorem says *on average*, across all possible evidence outcomes weighted by their probability, you expect to be at least as well off.
      2. **Assumptions are Paramount:** The non-negative expected value *only holds* if:
          * Acts & Utilities are fixed (learning doesn't create new acts or change how you value outcomes).
          * Evidence is genuinely cost-free within the utility model.
          * Agent perfectly conditionalizes.
      3. **Scope, Not Emptiness:** The theorem isn't "unfalsifiable" in a damaging way; it's a conditional truth. Its power lies in showing that *when* knowledge only updates beliefs and doesn't alter fundamental desires or options, seeking it is rationally advantageous. Recognizing when desires/options *are* altered by knowledge (Devon's point) is essential for *appropriate application*, not a flaw in the theorem.
      4. **Rationality is Contextual:** Devon's examples show that broader human rationality sometimes values states of knowledge/ignorance intrinsically. Good's theorem governs one specific, powerful type of instrumental rationality (belief-based optimization), not the totality of rational decision-making. Mara's move isn't *ad hoc*; it's defining the domain where this specific tool applies.

  **Conclusion:** Mara has the better grasp of Good's theorem's formal meaning and limitations. Devon successfully forces a crucial discussion about the gap between the formal model and psychologically rich decisions, highlighting that the theorem isn't a universal command to seek information. The key takeaway is that **Good's theorem proves the value of information *within a specific, belief-centric model of rational choice*. Applying it to real life requires careful judgment about whether the decision problem fits this model, particularly whether learning the evidence itself fundamentally changes the agent's options or valuations.**
