prompt: |-
  This has been rattling around in my head since an ACX open thread turned into a three day argument in the replies. Someone brought up one of the classic out-there theories about who really shot JFK, and one camp said something like "you should basically round any conspiracy theory down to zero before you even look at the specific evidence, because requiring that many people to coordinate and keep quiet is itself evidence against it," and the other camp said that's just smuggling in an unprincipled prior and every claim has to be judged on it's own evidence, full stop. Somebody dropped the terms "generalism" and "particularism" and Brian Keeley's name, so I actually went and read his 1999 paper "Of Conspiracy Theories," plus some of the responses to it (mostly Pigden), and now I'm stuck in the weeds instead of less confused.

  Here's the specific thing bugging me: Keeley gets cited as basically the source for the generalist side, the guy who tried to cash out what makes a conspiracy theory "unwarranted" in terms of stuff like reliance on errant data and the way the theory has to keep expanding to swallow disconfirming evidence. But I've also seen it claimed that even Keeley's own position was never really full-blown generalism, more like a heuristic about warning signs, and that in his later stuff he moved even closer to the particularists. If that's true then the "Keeley vs. Pigden, generalism vs. particularism" framing that gets passed around secondhand on forums (mine included, apparently) is flattening something that was messier to begin with.

  Could you actually lay out the strongest version of each position, not the strawman I got out of a comment thread, and then tell me which one you think is more defensible - ideally cashed out in explicitly Bayesian terms rather than just vibes? Specifically I want to know if there's a principled way to justify a generic prior discount on claims just for belonging to the class "conspiracy theory," without that collapsing into either (a) ignoring the specific evidence right in front of you, or (b) just being a respectable-sounding label for prejudice. That's the actual crux my friends and I couldn't resolve, and I walked away thinking neither side was being dumb, just talking past each other.
reasoning: |-
  Okay, let me unpack this user's question. They're clearly deep into the philosophy of conspiracy theories after getting caught in an online debate and diving into Keeley's work. The core tension is between generalism (discounting conspiracy theories on principle) and particularism (evaluating each on its own evidence). 

  First, I need to reconstruct both positions rigorously. The user wants Bayesian framing - good, that forces clarity. For generalism, the key is treating "conspiracy" as a hypothesis element that inherently lowers prior probability due to complexity costs. Not prejudice, but math: each conspirator added exponentially increases failure points. Keeley's later nuance matters here - he wasn't dismissing all conspiracies, just noting how unwarranted ones tend to balloon in complexity when challenged.

  Particularism's strength is its methodological purity: never pre-judge. But in practice? The JFK example shows why it's tricky - rejecting all priors means treating "government cover-up" and "lone gunman" as equally plausible starting points. That feels wrong when one requires dozens of conspirators staying silent for decades.

  Ah, the user's real anxiety: can we have a principled prior against conspiracies without being dogmatic? The Bayesian answer is yes - but it's about weighting, not rejection. Like how we instinctively discount claims of alien abductions without ignoring evidence. The prior isn't "zero", just low enough that evidence must overcome conspiracy's inherent improbability. 

  I should emphasize Keeley's erosion points: when theories keep adding epicycles ("aha, that witness was silenced too!"), that's when Bayesians should get suspicious. The Zapruder film example is perfect - particularists see suppressed evidence; generalists see how each new suppressor makes the story less likely.

  ...Wait, did I resolve my own earlier confusion while typing this? The "principled prior" isn't bias - it's the complexity penalty we apply to any claim requiring many coordinated actors. The JFK cover-up might be true, but you'd need extraordinary evidence to overcome its 50-year silence improbability. Whereas the grassy knoll theory? It needs constant patches whenever new evidence emerges. That's the difference.
answer: |-
  You've hit on a profound epistemological debate that's far messier than internet summaries suggest. Let's dissect the core positions rigorously, using Bayesian reasoning to avoid vibes-based arguing. I'll address your crux directly: **Yes, there's a principled Bayesian justification for a prior discount on conspiracy theories *as a class*—but it's not a flat "round to zero," nor does it ignore specific evidence. It's about properly weighting *intrinsic improbability*.**

  Here's the strongest version of each camp, followed by the Bayesian resolution:

  ---

  ### **1. Generalism (Keeley-esque Position)**
  **Core Thesis:** Conspiracy theories warrant a *systematically lower prior probability* than non-conspiratorial explanations due to their *structural properties*:
  - **Coordination Costs:** Conspiracies require many actors to coordinate secretly. Each added conspirator:
    - Exponentially increases points of failure (leaks, defections, mistakes).
    - Demands implausible competence in erasing traces.
  - **Epistemic Fragility:** Unwarranted conspiracy theories (Keeley's focus) evade falsification by:
    - **Ad hoc expansion:** Swallowing counter-evidence as "part of the cover-up" (e.g., "absence of leaks proves the conspiracy's effectiveness!").
    - **Errant data reliance:** Prioritizing anomalies (e.g., blurry photos) over robust evidence.

  **Bayesian Interpretation:**  
  - **Prior (P(H)) is intrinsically lower** for conspiracy hypotheses due to *complexity penalties*. Each conspirator adds a multiplicative penalty term:  
    `P(Conspiracy) ∝ P(Core Claim) × (1 - p_leak)^N × (1 - p_incompetence)^N`  
    Where `N` = number of conspirators, `p_leak` = probability any one leaks, etc.  
    *Even if P(Core Claim) is plausible, the penalty term decays rapidly with N.*  
  - **Evidence (E) must overcome this penalty**. Conspiracy theories often "overfit" data by adding epicycles (new conspirators/cover-ups) to explain away inconsistencies—a red flag in Bayesian model comparison.

  **Keeley's Nuance:** He *doesn't* dismiss all conspiracies (e.g., Watergate). His "heuristic" identifies theories likely to be *unwarranted* due to structural defects. Later work emphasizes: **Low priors can be overcome**, but require extraordinary evidence.

  ---

  ### **2. Particularism (Pigden-esque Position)**
  **Core Thesis:** Each claim must be evaluated *only on its specific evidence*. Discounting "conspiracy theories" as a class is:
  - **Prejudicial:** Treats "conspiracy" as a dirty word, ignoring that states/corporations *do* conspire (e.g., Iran-Contra, Tuskegee Syphilis Study).
  - **Methodologically Unsound:** Replaces evidence-based reasoning with a *category error*. If JFK was killed by a lone gunman, that's a fact about *this event*—not a deduction from "most conspiracies fail."

  **Bayesian Interpretation:**  
  - **Priors should be hypothesis-specific.** The prior for "JFK was killed by a CIA-led cabal" must be based on:
    - Historical precedents (e.g., CIA coups),
    - Motives, means, opportunity,
    - *Not* an abstract penalty for "conspiracies."
  - **Generalism commits the base-rate fallacy:** Even if 99% of conspiracy theories are false, if *this specific theory* has strong evidence, it can still be true. Priors must be *updated*.

  **Pigden's Critique:** Keeley's "structural defects" aren't unique to conspiracies. Scientific revolutions (e.g., heliocentrism) also faced "anomalies" later explained. Rejecting conspiracy claims *a priori* empowers bad actors to dismiss leaks (e.g., "Snowden is a conspiracy theorist!").

  ---

  ### **The Bayesian Synthesis: A Principled Middle Ground**
  Your crux resolves by distinguishing **priors** from **posteriors**. Generalists correctly insist conspiracy claims have *lower initial plausibility*; particularists correctly insist specific evidence *can override this*. Neither ignores evidence.

  #### **How to Set Prudently Discounted Priors:**
  1. **Complexity Penalty:**  
     - A hypothesis with 10 conspirators has a prior ≈ (1 - p)^10, where *p* is probability one defects/leaks. If *p* = 0.1 (reasonable for high-stakes secrets), prior is 0.35. If *N* = 50 (e.g., "all Congress complicit"), prior ≈ 0.005.  
     - **This isn't prejudice—it's probability calculus.** Just as we discount claims of magic for violating known physics.

  2. **Ad Hoc Expansion Discount:**  
     - Each auxiliary hypothesis ("the hospital records were forged," "witnesses were silenced") multiplies the prior.  
     - *Bayesian model comparison* favors theories that explain evidence with fewer free parameters.

  3. **Evidence Must Overcome the Penalty:**  
     - For JFK: A lone gunman (N=1) has high prior but must fit evidence (e.g., magic bullet). A conspiracy (N=20+) has low prior but could explain anomalies.  
     - **Posterior = Likelihood × Prior.** Strong evidence (e.g., credible confession + documents) can overcome low prior. Weak evidence (e.g., blurry photo + speculation) cannot.

  ---

  ### **Why This Doesn't Collapse into Prejudice or Ignoring Evidence**
  - **Not "round to zero":** Priors are low but non-zero. Evidence like the Watergate tapes *did* overcome initial skepticism.  
  - **Specifics matter:** The penalty scales with *N* and *p*. A 3-person corporate collusion (low *N*, high *p*) gets a mild discount. A 1000-person "secret space program" gets a steep one.  
  - **Updates override:** If new evidence emerges (e.g., declassified documents implicating the CIA), Bayesians update vigorously. Generalists aren't deniers—they demand *stronger* evidence.  

  ### **JFK Application**
  - **Particularist error:** Ignoring that "government cover-up" requires *another layer* of conspiracy (increasing *N*). Treating "Oswald acted alone" and "CIA orchestrated it" as equally plausible starting points is poor Bayesian practice.  
  - **Generalist error:** Dismissing *all* anomalies (e.g., acoustic evidence) because "conspiracies are unlikely" is lazy. Evidence must be weighed.  

  **Verdict:** Keeley's structural critique (properly Bayesianized) is defensible. Conspiracy claims *should* face a prior discount proportional to their complexity—but **this discount is quantitative, not categorical**. Particularists are right that evidence can overcome it, but wrong to pretend all claims start equal. The true enemy is **fixed priors**: both dogmatic skeptics who never update and conspiracists who warp evidence to fit their narrative.
