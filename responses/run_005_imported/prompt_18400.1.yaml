prompt: |-
  I build ML models for a living, so I think about 'calibration' a lot -- a model's calibrated if, of all the times it says 70%, the thing it's predicting actually happens about 70% of the time. Then I fell down a philosophy rabbit hole and hit David Lewis's 'Principal Principle', which says your credence in some event should just equal the objective chance of it, once you know what that chance is. Feels like basically the same idea showing up in two different fields to me. Is it? Or is there an actual gap between 'credence should track objective chance' and 'stated probabilities should match long-run frequencies'? If there's a real gap, give me a concrete case where someone's perfectly calibrated but still violates the Principal Principle, or the reverse -- obeys the Principal Principle but isn't calibrated. Don't want the wikipedia-level answer, i want the actual tension between the two.
reasoning: |-
  Okay, let's tackle this user's question. They're an ML professional who noticed a similarity between calibration in ML and the Principal Principle in philosophy. They want to know if these concepts are essentially the same or if there's a deeper tension.

  First, I need to recall both ideas clearly. Calibration in ML is about the agreement between predicted probabilities and actual frequencies. For example, when a model predicts 70%, the event should occur around 70% of the time. The Principal Principle, by David Lewis, states that rational credence should align with known objective chances. At first glance, they seem similar. But the user is asking for concrete cases where they diverge.

  The key difference lies in what each concept addresses. Calibration is about empirical consistency over many trials, focusing on observed frequencies. The Principal Principle is about rational belief given knowledge of objective chances, even in single instances. 

  I should consider scenarios where frequencies don't align with known chances. For example, a fair coin flipped only once. The objective chance is 50%, but in one flip, it's either heads or tails. A perfectly calibrated model over many flips would predict 50%, but in a single flip, the outcome doesn't match the probability. That shows calibration requires aggregation over instances, while the Principal Principle applies to individual cases.

  Another angle is when the objective chance is known but can't be empirically verified. Take a coin that's fair but never flipped. The Principal Principle says credence should be 50%, but without any flips, there's no frequency to calibrate against. Calibration depends on actual outcomes, so it can't apply here.

  Also, think about reference classes. In ML, calibration is measured within specific groups. If a model predicts 70% for different subgroups but the overall frequency is 70%, individual groups might not be calibrated. The Principal Principle doesn't have this issue because it's about the known chance, not subgroups.

  The user mentioned wanting concrete cases. The coin flip example is good for showing the single instance vs. long-run difference. The never-flipped coin scenario highlights the need for actual outcomes in calibration. The subgroup problem in ML demonstrates how calibration can be misleading if the reference class isn't homogeneous.

  I need to ensure the examples clearly distinguish the two concepts. Emphasize that calibration is frequentist and requires data, while the Principal Principle is about rational belief based on known chances, regardless of data. The tension arises from the aggregation problem, reference class issues, and cases where chances exist without data.
answer: |-
  You're absolutely right to sense a deep connection—both ideas are fundamentally about aligning *stated uncertainties* with *actual outcomes*. But there's a crucial gap, rooted in **epistemology vs. empiricism** and the **single case vs. long run**. The tension becomes stark when we dissect concrete scenarios where calibration and the Principal Principle (PP) diverge.

  **Core Tensions:**
  1.  **Objective Chance vs. Empirical Frequency:** PP demands credence match *known objective chance*, even if no frequency data exists. Calibration *defines* "correctness" via *observed long-run frequency*.
  2.  **Single Case vs. Reference Class:** PP applies directly to single events ("This *specific* coin flip"). Calibration is *only* meaningful over an *ensemble* of predictions ("All times I said 70%").
  3.  **Knowledge Requirement:** PP requires you to *know* the objective chance. Calibration emerges purely from prediction-outcome pairs, *regardless* of whether the predictor "knows" the true chance.

  **Concrete Cases Highlighting the Gap:**

  ### Case 1: Perfectly Calibrated but Violates PP (The "Lucky Guess" with Misinformation)
  *   **Scenario:** You have a magical (but deceptive) coin. Its *true, objective chance* of heads is **80%**. However, a powerful but mischievous demon *tells you (falsely)* that it's a **fair coin (50% chance)**. Being a rational Bayesian, you adopt a credence of 50% for heads on any flip.
  *   **The Trick:** The demon *intervenes* on the outcomes. Whenever you predict 50% heads, the demon *forces* the outcome distribution over many flips to be **exactly 50% heads**, overriding the coin's true bias.
  *   **Result:**
      *   **Calibration:** Perfect! Over thousands of flips where you state P(Heads)=0.5, Heads occurs exactly 50% of the time. Your model (based on the demon's lie) is impeccably calibrated.
      *   **PP Violation:** You *know* (thanks to the demon) the "objective chance" is 50%. You set your credence to 50%. *But the actual, physical, objective chance inherent in the coin itself is 80%!* PP requires your credence to track the *true* objective chance (80%), but you've set it to the *false* objective chance (50%) you were told. You are perfectly calibrated *because* the demon makes the frequency match the *false* chance you believe, not the *true* chance.

  *   **Why the Gap?** Calibration only cares about the alignment between your *stated number* and the *empirical frequency*. It doesn't care *why* that alignment exists or if your stated number reflects the *actual causal propensity* of the system. PP cares fundamentally about aligning belief with the *real, mind-independent propensity* (the true 80% chance), even if you are misinformed about it. Calibration is validated empirically *after the fact*; PP is a normative rule for setting belief *given knowledge*.

  ### Case 2: Obeys PP but Isn't Calibrated (The Single Case & The Unfair Reference Class)
  *   **Scenario 2a (Single Case):** You have a genuinely **fair coin (objective chance = 50%)**. You *know* it's fair (verified by perfect physics). You rationally set your credence for *this specific next flip* to P(Heads)=0.5, obeying PP.
  *   **The Flip:** It lands Tails.
  *   **Result:**
      *   **PP Obeyed:** You correctly set credence = known objective chance (50%).
      *   **Calibration (Attempted):** Can we assess calibration? **No.** Calibration requires a *group* of predictions made with the *same* stated probability. You made *one* prediction of 50% for *this specific flip*. The outcome was 0% Heads (it was Tails). This *single data point* tells you nothing about calibration. Calibration is undefined/inapplicable here. PP reigns supreme for the single rational belief.
  *   **Why the Gap?** Calibration is inherently frequentist and requires aggregation. PP applies normatively to the single case based on known chances.

  *   **Scenario 2b (Unfair Reference Class):** You are predicting outcomes for patients undergoing a specific complex surgery. The *true, objective chance* of success for *any individual patient* with condition X is **70%**, based on fundamental physiology.
  *   **Your Knowledge & PP:** You are a brilliant surgeon-scientist and *know* this objective chance is 70%. For *each* patient with condition X, you set your credence P(Success)=0.7, obeying PP.
  *   **The Catch (Reference Class Problem):** Your hospital only operates on the **most extreme, high-risk cases** of condition X. While the *baseline* objective chance is 70%, the *selection bias* in your patient population means the *actual long-run success rate* in *your specific hospital* is only **50%**.
  *   **Result:**
      *   **PP Obeyed:** For each patient, you correctly set credence = the *fundamental objective chance* (70%).
      *   **Calibration:** Over your predictions for hundreds of patients, you *always* stated P(Success)=0.7. The actual success rate was 50%. Your predictions are **poorly calibrated** (70% stated vs. 50% actual).
  *   **Why the Gap?** PP tells you to use the *known objective chance inherent in the type of event* (surgery on condition X). Calibration measures alignment with the *actual frequency observed within your specific reference class* (surgery on *extreme* cases of condition X at *your* hospital). This highlights the **reference class problem**: What is the "correct" ensemble to judge calibration against? PP anchors belief to the (presumed known) objective chance of the event *type*, while calibration is hostage to the specific (and potentially biased) ensemble of instances you actually observe. You obeyed PP by tracking the *general* chance but are uncalibrated because the *local* frequency differs due to selection effects.

  **The Essence of the Tension:**

  1.  **Metaphysical vs. Epistemic/Statistical:** PP assumes objective chances exist as real-world propensities that rational agents *should* align with *if known*. Calibration is a purely statistical property of a *sequence* of predictions and outcomes. It doesn't assume propensities; it just measures empirical agreement.
  2.  **Source of Justification:** PP justification is *a priori* rationality (given knowledge of the chance). Calibration justification is *a posteriori* empirical performance.
  3.  **Vulnerabilities:** PP is vulnerable to **misinformation** about the true chance. Calibration is vulnerable to **reference class problems**, **selection bias**, and **small samples**. It can also be "gamed" in ways that violate PP (like the demon scenario).
  4.  **The Single Case:** PP provides clear normative guidance for the single case ("Believe 70% for *this*"). Calibration is silent or misleading for the single case.

  **In your ML context:** You strive for calibration because it's measurable and indicates reliability *over many predictions*. It tells you your 70% predictions are *useful* for decision-making in aggregate. However, for a *single* high-stakes prediction (e.g., "Should *this specific* patient get the risky surgery?"), knowing the model is calibrated over a population *doesn't guarantee* that *this specific* 70% prediction reflects the *true propensity* for *this specific* patient. If you *knew* the true objective chance for *this* patient was 90% (e.g., from deeper causal understanding), PP would demand you use *that* 90%, even if your calibrated model outputs 70% based on population averages. The calibrated model might be the best you *have*, but PP highlights that it might not reflect the *deepest possible* understanding of the single case chance.

  So, while calibration and the Principal Principle are deeply connected ideals about aligning belief/probability with reality, the gap lies in *what kind of reality* they are aligning with (propensity vs. frequency), *the scope* they apply to (single case vs. ensemble), and the *sources of error* that can break one while satisfying the other. They are complementary pillars of probabilistic reasoning, not identical twins.
