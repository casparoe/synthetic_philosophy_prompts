answer: |-
  You're absolutely right to be skeptical of that strong interpretation—your reading group is overselling Harsanyi's theorem and misrepresenting its implications for prioritarianism. Here's a breakdown of what the theorem *actually* shows and why prioritarians aren't committing a "mathematical error":

  1.  **Harsanyi's Aggregation Theorem (Core Result):**
      *   **Assumptions:**
          *   Each individual `i` has preferences satisfying the von Neumann-Morgenstern (vNM) axioms (rational, complete, transitive, continuous, and satisfies the independence axiom). This means their preferences can be represented by a cardinal utility function `U_i` (unique up to affine transformation: `a*U_i + b`).
          *   The social planner/social welfare functional also has preferences over the same set of lotteries that satisfy the vNM axioms. This means social preferences can be represented by a cardinal social welfare function `W` (unique up to affine transformation).
          *   **Pareto Indifference:** If every individual is indifferent between two lotteries `X` and `Y`, then society must be indifferent.
          *   **Pareto Preference:** If every individual weakly prefers lottery `X` to lottery `Y`, and at least one individual strictly prefers `X` to `Y`, then society strictly prefers `X` to `Y`.
      *   **Conclusion:** Given these assumptions, the social welfare function `W` **must be an affine combination (weighted sum) of the individual utility functions.** That is:
          `W = Σ w_i * U_i` (where `w_i > 0` for all `i`).

  2.  **The Crucial Misinterpretation: Equal Weights?**
      *   **The theorem does NOT force `w_i = w_j` for all `i, j`.** It only forces that the weights `w_i` are *positive* constants.
      *   The weights `w_i` reflect the *relative ethical importance* society assigns to each individual's utility. The theorem is silent on how these weights should be set.
      *   **Equal weights (`w_i = 1` for all `i`, or `w_i = 1/N`) is an ADDITIONAL ETHICAL ASSUMPTION.** It requires imposing a symmetry/anonymity condition: that individuals are ethically indistinguishable based on their identities. Harsanyi himself endorsed this ethical view, but it is *not* a logical consequence of the core theorem. It's a separate normative claim.

  3.  **Prioritarianism vs. The Theorem:**
      *   **Prioritarianism is fundamentally about the weights.** Prioritarians argue that the social welfare function should give *greater marginal weight* to utility gains experienced by individuals at lower absolute utility levels (the "worse off"). They want `w_i` to be larger for individuals with lower `U_i`.
      *   **Harsanyi's Theorem FORBIDS this dependence.** The weights `w_i` in the theorem are *constants*, fixed for each individual. They cannot depend on the *level* of `U_i` or `U_j`. A social welfare function like `W = Σ f(U_i)` where `f` is strictly concave (the standard prioritarian form) **violates the vNM assumptions for social preferences** required by the theorem, specifically the **Independence Axiom**.
      *   **Is this a "mathematical error"? Absolutely not.** It simply means that prioritarian social preferences *cannot be represented as expected utility preferences over the same lotteries as individuals while also satisfying the strong Pareto conditions*. Prioritarians explicitly *reject* the idea that society should evaluate lotteries using a vNM utility function. They argue that the social valuation of individual *utility levels* should incorporate a concern for distribution (inequality aversion), which inherently violates the linearity-in-probabilities demanded by vNM.

  4.  **Where Your Reading Group is Partially Right and Mostly Wrong:**
      *   **Right:** Within the *very specific framework* of Harsanyi (vNM social preferences + strong Pareto), the *only* admissible social welfare functions are linear (weighted sum) aggregations of individual cardinal utilities. Prioritarians *cannot* fit their view into *this exact framework* without violating one of its core assumptions (usually social vNM or sometimes Pareto in edge cases).
      *   **Wrong (Overselling):**
          *   **Equal weights are not forced:** The theorem justifies *linear aggregation*, not specifically *equal-weighted* linear aggregation. Utilitarianism (equal weights) requires the extra ethical step.
          *   **Prioritarianism isn't "inconsistent":** It's a *different framework*. Prioritarians reject the assumption that social preferences need to be vNM over lotteries. They argue social evaluation should focus on the *distribution of final outcomes* (utility levels) and apply a concave transformation *there*, not that society should be indifferent to probabilistic mixtures in the way an individual EU maximizer is. Their "inconsistency" is only relative to Harsanyi's specific axioms, which they see as inappropriate for social choice. Their view is internally consistent within its own ethical framework.
          *   **Pareto isn't sacrosanct:** While powerful, the strong Pareto conditions can be challenged in ethical debates, especially when combined with other principles like fairness or rights. Prioritarians might accept minor weakenings of Pareto in extreme hypotheticals to achieve their distributive goals, though they generally try to uphold it where possible.
          *   **The theorem doesn't resolve ethics:** It shows a mathematical isomorphism between certain technical assumptions. It doesn't prove that society *must* have vNM preferences or that the Pareto conditions are the *only* relevant ethical constraints. Choosing the axioms *is* the ethical debate.

  5.  **How to Push Back: Key Points**
      *   "Harsanyi shows linear aggregation is necessary *if* society has vNM preferences and we accept strong Pareto. But he doesn't prove society *must* have vNM preferences. Prioritarians explicitly reject that axiom for society."
      *   "The weights `w_i` in the theorem are positive constants, but they are *not* forced to be equal. Equal weighting is an additional ethical assumption about symmetry/anonymity."
      *   "Prioritarianism isn't mathematically incoherent. It simply operates under different axioms. It prioritizes (pun intended) distributive justice concerns over society having preferences that satisfy the vNM independence axiom over lotteries."
      *   "The theorem is a powerful result about the *structure* of aggregation under specific assumptions, not a knockdown proof that utilitarianism is the only ethically defensible position. It clarifies the trade-offs: if you want vNM social preferences and strong Pareto, you get linear aggregation. If you want inequality aversion (prioritarianism), you have to give up vNM social preferences. The ethical debate is about which set of axioms is more appropriate for social choice, not about formal inconsistency within the chosen framework."

  **In short:** Your reading group is conflating the mathematical derivation *within Harsanyi's framework* with a proof of utilitarianism's ethical supremacy. Harsanyi's theorem shows that **linear aggregation with fixed positive weights** is the only possibility *if* society is an EU maximizer and respects Pareto. **Equal weights are an ethical add-on.** **Prioritarianism is a coherent ethical position that deliberately operates outside Harsanyi's specific framework by rejecting the idea that social welfare should be linear in probabilities (vNM) over lotteries.** The debate between utilitarians and prioritarians is very much alive and concerns the validity and desirability of Harsanyi's axioms themselves, not just mathematics within them. Your skepticism is well-founded.
