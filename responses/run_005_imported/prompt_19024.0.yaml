answer: |-
  Here are 8 targeted interview questions designed to push beyond restating the spandrels critique, incorporating your specific requests, anticipating dodges, and providing follow-ups to force engagement:

  1.  **Question (San Marco Accuracy):** "You've built your career defending the Gould-Lewontin spandrels metaphor. However, architectural historians point out the *actual* structures Gould used as examples – the spaces filled with mosaics in San Marco – are technically *pendentives* (the curved triangles supporting the dome), not spandrels (the leftover spaces between arches). Do you see this as a harmless mislabeling, or does it potentially undermine the core argument that adaptationists are mistaking non-adaptive structural necessities for adaptations? Specifically, if the pendentives *themselves* are essential architectural adaptations for dome support, doesn't accidentally labeling them 'spandrels' ironically *support* the adaptationist focus on functional design?"
      *   **Anticipated Dodge:** "It's just a metaphor; the precise architectural term doesn't matter, the *concept* of architectural constraint does."
      *   **Follow-Up:** "But if the metaphor's central example misidentifies the *actual functional component* (the load-bearing pendentive) as a non-functional byproduct (spandrel), doesn't that directly contradict the point Gould & Lewontin were trying to make *against* seeing function everywhere? Doesn't this literal misidentification risk reinforcing the adaptationist view it aimed to critique?"

  2.  **Question (Methodology & Predictions - Queller/Dennett):** "Critics like David Queller and Daniel Dennett argue that while the spandrels critique is rhetorically powerful, it failed to spawn a rival *predictive methodology* for evolutionary biology. They claim structuralism often amounts to unfalsifiable 'spandrel-of-the-gap' reasoning – invoking constraints whenever adaptation seems tricky, without offering specific, testable alternative hypotheses *before* the fact. What specific, risky *predictions* does the structuralist approach generate that differ from adaptationist ones and could be empirically tested?"
      *   **Anticipated Dodge:** "The burden of proof is on adaptationists to demonstrate their stories; our role is to point out when they haven't met it / Constraints *are* the explanation, and we predict finding traits that defy adaptationist explanation."
      *   **Follow-Up:** "But isn't predicting 'you'll find things adaptationism can't easily explain' itself unfalsifiable? Can you give a concrete example of a *novel, specific prediction* made *in advance* by structuralist reasoning that was later confirmed? For instance, did structuralism predict the specific form of non-adaptive vestigial structures, or the precise developmental pathway causing a specific constraint *before* it was discovered?"

  3.  **Question (Exaptation & Fine-Tuning):** "Gould and Vrba introduced 'exaptation' to describe features co-opted for new functions. But doesn't this concept concede crucial ground? Once a 'spandrel' (like feathers for insulation) is co-opted (for flight), it invariably undergoes significant *fine-tuning* by natural selection (asymmetric vanes, interlocking barbules). Doesn't this pervasive post-co-option adaptation demonstrate that selection is the primary sculptor of *complex functional design*, even if the raw material wasn't originally 'for' that function? Is the initial 'spandrel' phase ultimately just a minor footnote in the functional history of most complex traits?"
      *   **Anticipated Dodge:** "Exaptation highlights the origin of novelty; the initial non-adapted state is crucial / Fine-tuning is secondary to the origin of the structure itself."
      *   **Follow-Up:** "If the *overwhelming majority* of the complex functional architecture we see in feathers, eyes, or brains arises *after* co-option via intense selection pressure, and the initial 'spandrel' state was likely crude and non-functional for its eventual role, doesn't this make adaptation the dominant explanatory force for complex organization? How does emphasizing the crude precursor materially challenge adaptationism's focus on selection shaping functional outcomes?"

  4.  **Question (Developmental Constraints vs. Adaptation):** "Can you provide a compelling example of a complex, widespread trait in a major lineage where a strict *developmental constraint* explanation is clearly superior to an adaptationist one? Crucially, how do you rigorously *distinguish* the signature of constraint from the signature of stabilizing selection maintaining an optimal form?"
      *   **Anticipated Dodge:** "Many traits! Pentadactyly, Hox gene clusters, basic body plans / Constraints limit the possible variation selection can act on."
      *   **Follow-Up:** "But pentadactyly could also be explained by stabilizing selection on a functional limb design. Hox clusters are highly conserved but also subject to intense purifying selection. What *specific evidence* would definitively show that the persistence of such a trait is due *primarily* to developmental constraint *preventing* change, rather than stabilizing selection *actively maintaining* a functional optimum?"

  5.  **Question (The 'Just-So Story' Dodge):** "Your frequent response to adaptationist narratives is to label them 'just-so stories' and move on. While methodological caution is valid, doesn't this risk becoming a conversation-stopper rather than a constructive critique? Could you demonstrate how you would *engage* with a specific, detailed adaptationist hypothesis – say, the role of sexual selection in shaping the peacock's tail – to dissect its weaknesses *beyond* the label? What specific evidence would make you take such a hypothesis seriously?"
      *   **Anticipated Dodge:** "Many adaptationist stories *are* just-so stories lacking evidence / I critique the methodology, not every specific case."
      *   **Follow-Up:** "Let's take the peacock tail. Adaptationists point to female choice experiments, genetic correlations, and the cost of the tail. What *specific* evidence or methodological flaw in *this specific case* makes you dismiss it as a 'just-so story'? Or, conversely, what *additional* evidence would convince you it *is* primarily driven by sexual selection?"

  6.  **Question (Spandrels & Evolutionary Novelty):** "Gould argued spandrels were crucial for generating evolutionary novelty. But how does invoking a 'spandrel' *explain* the origin of genuinely novel structures or functions? Doesn't it just push the question back a step? How does the structuralist framework account for the *origin* of the novel developmental pathways or structural properties that later get co-opted?"
      *   **Anticipated Dodge:** "Novelty arises from the non-adaptive exploration of morphospace enabled by constraints / Exaptation *is* the mechanism for novelty."
      *   **Follow-Up:** "But doesn't 'exploration of morphospace' itself require explanations? What generates the *variation* in developmental pathways that produces a potential 'spandrel' like feathers in the first place? Isn't the core origin of novelty still rooted in mutation, drift, and selection acting on development, making the 'spandrel' a *consequence* rather than a primary *cause* of novelty?"

  7.  **Question (Empirical Success of Adaptationism):** "Despite its alleged pitfalls, adaptationist reasoning has driven significant empirical discoveries – identifying cryptic female choice, predicting antibiotic resistance pathways, or uncovering the functional significance of 'junk' DNA elements like lncRNAs. Can you point to similarly impactful discoveries *primarily* driven by the structuralist insistence on non-adaptive origins? Where has *predicting* a spandrel led to a major new finding?"
      *   **Anticipated Dodge:** "Those discoveries often reveal complexity adaptationism ignored / Many 'functions' found for junk DNA are debatable / Structuralism underpins Evo-Devo."
      *   **Follow-Up:** "Evo-Devo often *integrates* adaptation (e.g., selection on cis-regulatory elements). Can you name a specific, widely accepted complex trait where the *primary research impetus and predictive success* came from a structuralist hypothesis *positing its non-adaptive origin*? For example, was the non-coding RNA's role predicted *as a spandrel first*, or was function sought and found?"

  8.  **Question (The Feather Test - Falsifiability):** "Finally, to cut to the heart of falsifiability: Let's take a concrete trait – **feathers**. Under what specific conditions, and based on what definitive evidence, would you be willing to conclude that the *complex, derived flight feathers of modern birds* are unequivocally an *adaptation for flight* shaped by natural selection, rather than primarily a co-opted spandrel? What evidence would force you to concede the adaptationist explanation is compelling *in this specific case*?"
      *   **Anticipated Dodge:** "It's always complex / The origin might be non-adaptive but flight function is adapted / We need to consider deep homology."
      *   **Follow-Up:** "I'm asking about the *specific, current, complex functional structure*. If we see a perfect match between aerodynamic theory and feather microstructure, experimental evidence demonstrating its necessity and superiority for flight, a clear fossil transition showing increasing refinement correlated with flight capability, and developmental genetics showing selection on pathways for that refinement... would you *still* insist on calling it primarily a 'spandrel'? If not, what *lesser* evidence would suffice? If so, doesn't that make structuralism unfalsifiable?"

  **Key Strategies Embedded:**

  1.  **Concreteness:** Forces engagement with specific examples (peacock tail, feathers, pendentives, pentadactyly).
  2.  **Historical/Conceptual Accuracy:** Challenges the foundational metaphor's literal basis.
  3.  **Methodological Demand:** Presses on the lack of predictive power and falsifiable alternatives.
  4.  **Internal Critique:** Uses Gould's own concepts (exaptation) to probe weaknesses.
  5.  **Burden Shifting:** Asks what evidence *would* convince her, forcing her to define criteria.
  6.  **Follow-Up Traps:** Designed to anticipate and cut off standard dodges, demanding specifics or revealing potential unfalsifiability.

  Good luck with the interview! This line of questioning should push the discussion into much more interesting and challenging territory. Be prepared for some pushback, but stay focused on demanding engagement with the specifics.
