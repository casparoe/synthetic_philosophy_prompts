answer: |-
  You've hit on a profoundly important question about the nature of commitments, trust, and relational obligations in informal contexts. Jess's anger isn't just a "vibe" – it stems from a well-established philosophical and ethical concept: **joint commitment and reliance in shared agency.**

  Here's why her complaint holds weight, even without a formal promise:

  1.  **The Nature of Joint Commitment:** When you both texted Mia "we're both coming," you weren't just making individual statements of intent. You were creating a *joint plan*. This created a **triangular obligation**:
      *   **To Mia:** A collective undertaking to help.
      *   **To Each Other:** An implicit agreement to act *together* as a unit ("we"). Your presence wasn't just for Mia; it was also part of a *shared effort* with Jess. By dropping out, you altered the fundamental nature of the commitment *she* had signed up for.

  2.  **Reliance and Interdependence:** Jess reasonably *relied* on your participation. This reliance wasn't just about the physical labor of moving Mia. It included:
      *   **Shared Burden:** Knowing the workload would be distributed fairly between you two (and others).
      *   **Shared Experience:** Anticipating the social aspect of tackling a chore together.
      *   **Mutual Backup:** Feeling that if challenges arose, you'd face them *together*. You unilaterally removed this layer of security *for her*.

  3.  **The "Leaving Her Hanging" Factor:** This is crucial. By bailing, you didn't just leave Mia short-handed; you left *Jess* holding the bag for the *joint commitment*. She suddenly became the sole representative of the "we" you both presented to Mia. This:
      *   Put her in an awkward position vis-à-vis Mia.
      *   Increased her personal responsibility and potential burden.
      *   Made *her* look potentially unreliable by association if things went wrong.

  4.  **The Harm Beyond Task Completion:** You focus on the outcome ("Mia got moved"). Jess focuses on the **process and the relational breach**. The harm wasn't material; it was **relational and normative**:
      *   **Breach of Trust:** You demonstrated that your word in a joint undertaking is unreliable when a better offer comes along.
      *   **Disrespect for Her Agency:** You made a decision affecting *her* commitment without consulting her, treating the joint plan as merely the sum of individual plans.
      *   **Devaluation of Shared Effort:** You signaled that the social bond and mutual reliance inherent in doing this *together* were less important than your individual desire.
      *   **Creating Uncertainty:** You've now made Jess (and likely Mia) wonder if they can trust any future "we" statements from you.

  5.  **Why "No Formal Promise" Doesn't Absolve You:** Moral obligations in friendship and social cooperation rarely stem from formal contracts. They stem from:
      *   **Reasonable Expectations:** Based on explicit statements ("we're both coming").
      *   **Social Norms:** Understanding that agreeing to participate in a shared effort creates a duty to follow through, barring emergencies.
      *   **The Principle of Fidelity:** When you lead others to reasonably rely on your actions, you incur an obligation to either fulfill that expectation or give them ample notice and a valid reason if you can't. Your last-minute text citing a purely self-interested reason violated this.

  6.  **The Ticket Reveals the Problem:** Getting a better offer *exposes* the nature of your commitment. It showed Jess that your participation was contingent *only* on nothing better coming along, not on the value of the shared commitment itself. This cheapens the initial agreement.

  **Who's "Right"?**

  *   **Jess is right** about the *nature* of the wrong. You violated the implicit norms of joint commitment, reliance, and fidelity inherent in agreeing to undertake a task *together*. You treated a collective "we" as a collection of easily discardable individual "I"s. Her anger stems from feeling disrespected, used, and let down *relationally*.
  *   **You are right** that no *formal*, legally binding promise was made. However, you are mistaken in believing that only formal promises create obligations. The social and moral obligations in friendship contexts are real and powerful, even if informal.

  **What to Understand:**

  *   **Joint actions create unique obligations.** Saying "we" implies more than just two "I"s. It creates a shared intention and mutual reliance.
  *   **Reliance creates obligation.** When others reasonably depend on your participation based on your word, you have a duty to either fulfill it or communicate changes responsibly and with good justification.
  *   **The harm is relational, not just practical.** Damaged trust, feelings of disrespect, and the undermining of future cooperation are significant harms.
  *   **"No harm done" is often false.** Just because the task was completed doesn't erase the relational harm inflicted on Jess.

  **Moving Forward:**

  Instead of arguing about whether an obligation existed or whether harm was done, acknowledge the *relational* impact: "Jess, I realize now that when I backed out, it wasn't just about Mia's move getting done. I left you holding the bag for something we said we'd do *together*, and I didn't consider how that would put you in a tough spot or make you feel like you couldn't rely on me. I treated it like just *my* plan, not *our* plan. I see why that was hurtful and unfair to you, and I'm sorry I let you down that way."

  Understanding this distinction between task completion and relational obligation is key not just for this situation, but for navigating almost any form of group action or cooperation. Your philosophy class might not be discussing moving apartments, but the core concepts of shared intention, reliance, and commitment are absolutely central to the topic.
