prompt: |-
  Our department's colloquium series is hosting a decision theorist next week who has proposed "surrogate goals" as a defense against acausal threats -- extortion that operates through one agent predicting or simulating another's reasoning rather than through any causal channel between them -- and I'm chairing the Q&A. Draft eight to ten questions that go beyond having her restate the proposal: I want at least one question on why a sufficiently sophisticated threatener wouldn't simply see through the substitution, once it is common knowledge that the surrogate is a decoy, and target the agent's real values instead; one on how an agent is supposed to make its attachment to the surrogate legible and credible to an outside party without that commitment bleeding into an actual vulnerability; and one on how the timing of adopting a surrogate goal interacts with the commitment-race problem that arises when updateless agents each try to commit before the other does. For each of these, add a follow-up keyed to the answer she's most likely to give.
reasoning: |-
  We are drafting questions for a Q&A session with a decision theorist on "surrogate goals" as a defense against acausal threats. We need 8-10 questions that go beyond restating the proposal. Specifically, we must include:

  1. A question on why a sufficiently sophisticated threatener wouldn't see through the surrogate and target the real values instead, with a follow-up.
  2. A question on how to make the attachment to the surrogate legible and credible without creating an actual vulnerability, with a follow-up.
  3. A question on how the timing of adopting a surrogate goal interacts with the commitment-race problem in updateless agents, with a follow-up.

  Additionally, we need 5-7 more questions (to make 8-10 total) that are substantive and go beyond the basics.

  Let's outline the required questions first:

  ### Question Set 1: Sophisticated Threatener Seeing Through the Substitution
  **Main Question:** If it becomes common knowledge that the surrogate goal is a decoy, why wouldn't a sufficiently sophisticated threatener simply bypass the surrogate and target the agent's real values? How does the surrogate goal defense remain effective under such common knowledge?

  **Expected Answer (for follow-up):** The speaker might argue that the surrogate goal is designed in such a way that even if the threatener knows it's a decoy, the agent's decision algorithm is structured to respond only to threats against the surrogate, making threats against the real values ineffective because the agent doesn't react to them.

  **Follow-up Question:** But if the agent's algorithm is designed to only respond to threats against the surrogate, doesn't that create an incentive for the threatener to threaten the real values and then, when the agent doesn't respond, follow through? How do you avoid making the real values hostage to a threatener who tests the commitment?

  ### Question Set 2: Legibility and Credibility Without Vulnerability
  **Main Question:** How can an agent make its commitment to a surrogate goal both legible and credible to an outside threatener without that very commitment process creating a new vulnerability? For example, if the agent must communicate or demonstrate its commitment, doesn't that open a channel for exploitation?

  **Expected Answer:** The speaker might suggest that the commitment is made legible through the design of the agent's decision algorithm, which is publicly known, and that the agent uses cryptographic or game-theoretic methods to commit without creating a vulnerability.

  **Follow-up Question:** But if the decision algorithm is publicly known, then a threatener can simulate it and know exactly when the agent is bluffing. How can the agent maintain a credible commitment without the threatener being able to simulate and thereby circumvent the surrogate goal defense?

  ### Question Set 3: Timing and Commitment Races
  **Main Question:** In a setting with multiple updateless agents each trying to commit before the others, how does the timing of adopting a surrogate goal affect the outcome? Specifically, if an agent adopts a surrogate goal too early, it might be vulnerable to threats before the surrogate is in place, but if too late, it might lose the commitment race.

  **Expected Answer:** The speaker might argue that agents should adopt surrogate goals as early as possible, perhaps even before any interaction, to avoid being caught in a race.

  **Follow-up Question:** But if all agents are updateless and reason from the beginning of time, then they are all trying to commit at the same logical time. How can an agent "win" the race without introducing some kind of logical time asymmetry?

  ### Additional Questions (5-7 more)

  4. **Question on Robustness:** How do surrogate goals handle cases where the threatener is not perfectly rational or has a different model of decision theory? For example, if the threatener uses causal decision theory, might it misinterpret the surrogate goal and attack anyway?

  5. **Question on Multiple Threats:** How does the surrogate goal approach scale when facing multiple potential threateners, each with the ability to simulate the agent? Is there a risk that the surrogate goal might be effective against one threatener but exploited by another?

  6. **Question on Self-Modification:** If an agent can self-modify, what prevents it from temporarily or permanently abandoning the surrogate goal when under threat, thereby undermining the credibility of the commitment?

  7. **Question on Real-World Applicability:** To what extent can surrogate goals be implemented in real-world AI systems? What are the practical challenges in encoding a decoy goal that is both safe and effective against acausal threats?

  8. **Question on Value Alignment:** Doesn't the use of a surrogate goal create a value alignment problem? If the agent is pursuing a surrogate, how do we ensure that it doesn't actually become optimized for that surrogate and neglect the real values?

  9. **Question on Learning Agents:** How would surrogate goals work in agents that learn and update their beliefs over time? Wouldn't the learning process potentially reveal the decoy and make the agent update towards its true values?

  10. **Question on Counter-Surrogates:** Could a threatener itself use a surrogate goal to defend against our agent's threats? How would such an arms race of surrogate goals play out?

  Now, let's compile the list of 8-10 questions (with the three required ones and the additional ones). We'll aim for 10.

  ### Final List of Questions

  1. **Sophisticated Threatener:** If it becomes common knowledge that the surrogate goal is a decoy, why wouldn't a sufficiently sophisticated threatener bypass the surrogate and target the agent's real values? How does the surrogate goal defense remain effective under common knowledge?
     - Follow-up: But if the agent's algorithm is designed to only respond to threats against the surrogate, doesn't that create an incentive for the threatener to threaten the real values and then follow through when the agent doesn't respond? How do you avoid making the real values hostage?

  2. **Legibility and Credibility:** How can an agent make its commitment to a surrogate goal both legible and credible to an outside threatener without creating a new vulnerability? For example, if the agent must communicate its commitment, doesn't that open a channel for exploitation?
     - Follow-up: If the decision algorithm is publicly known, then a threatener can simulate it and know exactly when the agent is bluffing. How can the agent maintain a credible commitment without the threatener being able to simulate and circumvent the surrogate goal defense?

  3. **Timing and Commitment Races:** In a setting with multiple updateless agents each trying to commit before the others, how does the timing of adopting a surrogate goal affect the outcome? Specifically, what are the risks of adopting too early versus too late?
     - Follow-up: But if all agents are updateless and reason from the beginning of time, then they are all trying to commit at the same logical time. How can an agent "win" the race without introducing logical time asymmetry?

  4. **Robustness to Threatener's Model:** How do surrogate goals handle threateners who are not perfectly rational or who use a different decision theory (like causal decision theory)? Could such a threatener misinterpret the surrogate and attack anyway?

  5. **Multiple Threateners:** How does the surrogate goal approach scale when facing multiple potential threateners? Is there a risk that the surrogate goal might be effective against one threatener but exploited by another?

  6. **Self-Modification:** If an agent can self-modify, what prevents it from abandoning the surrogate goal when under threat, thereby undermining the credibility of the commitment?

  7. **Real-World Applicability:** What are the practical challenges in implementing surrogate goals in real-world AI systems? How do we encode a decoy goal that is both safe and effective?

  8. **Value Alignment:** Doesn't the use of a surrogate goal create a value alignment problem? How do we ensure the agent doesn't become optimized for the surrogate and neglect the real values?

  9. **Learning Agents:** How would surrogate goals work in agents that learn and update their beliefs over time? Wouldn't the learning process potentially reveal the decoy?

  10. **Counter-Surrogates and Arms Races:** Could a threatener use a surrogate goal to defend against our agent's threats? How would such an arms race of surrogate goals play out?

  This gives us 10 questions, with the first three having follow-ups. We can note that the follow-ups are to be asked immediately after the speaker answers the main question, so the chair should be prepared to ask them if the speaker's answer aligns with the expected direction.

