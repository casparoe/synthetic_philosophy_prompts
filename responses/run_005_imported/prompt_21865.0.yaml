  ## Memorandum: Frege Lecture Naming Consideration

  **To:** Committee on the Frege Endowed Lecture  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the Lecture Name  

  Following our discussion prompted by Frege’s 1924 diary, and acknowledging the profound discomfort it creates, I recommend **retiring the name "Frege Lecture" quietly but explicitly**, replacing it with a neutral title (e.g., "Annual Endowed Lecture in Logic and Philosophy of Language"). My reasoning, engaging with the strongest counterarguments, follows:  

  ### Recommended Option: Retire the Name Quietly (with Explanation)  
  1.  **Upholding Departmental Values & Inclusivity:** The diary reveals views antithetical to the fundamental values of intellectual equality, rationality, and human dignity our department and university espouse. Continuing to honor Frege *by name* in a public forum risks alienating Jewish, Catholic, and leftist colleagues, students, and visitors, implicitly condoning views we categorically reject. A named lecture is an honorific; retaining it suggests the honor outweighs the harm.  
  2.  **Addressing the Core Contradiction:** My colleague powerfully highlighted the irreconcilable tension: Frege's philosophical legacy rests on the *objectivity* of logic and truth, independent of the thinker's psychology or identity. His diary, however, explicitly subordinates citizenship and rights to ancestry and ideology – a profound violation of his own anti-psychologism. Honoring the work while ignoring this hypocrisy feels intellectually inconsistent. Retiring the name acknowledges this fracture.  
  3.  **Practicality and Focus:** The lecture should center on contemporary scholarship, not become a recurring platform for grappling with Frege's bigotry. A permanent framing statement (Option 3) risks ritualizing condemnation, overshadowing the lecture's intellectual purpose. Retiring the name allows the lecture to proceed without this unavoidable, heavy preamble.  
  4.  **"Quietly" but Explicitly:** "Quietly" means avoiding public spectacle, but *not* secrecy. The decision and reasoning should be formally recorded and communicated internally (department/faculty) and to relevant stakeholders (e.g., the endowment's original donors/family, if appropriate). We explain *why* the name is retired, referencing the conflict between Frege's work and his expressed views on human standing, without needing to detail the offensive content at every turn.  

  ### Engaging with the Strongest Case for Keeping the Name (Option 1)  
  *   **The Argument:** Frege's foundational contributions to logic and philosophy of language (sense/reference, *Begriffsschrift*, anti-psychologism) stand as monumental, objective achievements. These ideas transcend their author and should be celebrated independently of his personal failings, which were unknown when the lecture was named. The work, not the man, is honored. Retiring the name conflates the logical work with the diarist and risks "cancelling" vital intellectual history.  
  *   **Engagement:** This view, which I initially held, is intellectually coherent on its face. The work *is* separable and remains essential study. However, **a named endowed lecture does not merely honor abstract work; it honors the *person* as the source and symbol of that work.** The revelation of Frege's virulent bigotry, particularly its *direct contradiction* of the universalist, objective foundations of that very work, fundamentally alters what that honor signifies. It transforms the name from a neutral label for the work into an ongoing endorsement of a figure whose personal philosophy actively repudiates the core principles his logical work champions. Celebrating the work does not require maintaining a public honorific in his name.  

  ### Engaging with the Strongest Case for a Framing Statement (Option 3)  
  *   **The Argument:** This option confronts the issue directly and transparently. It educates the audience, contextualizes the name, and demonstrates the department's commitment to historical honesty and rejection of bigotry *without* erasing Frege's connection to the field. It turns the name itself into a teaching moment about the complex, sometimes contradictory, nature of intellectual history.  
  *   **Engagement:** This is a principled and thoughtful compromise. Its strength lies in its refusal to hide the uncomfortable truth. However, **its significant weakness is practical and tonal:**  
      *   It risks making the framing statement the unavoidable, dominant feature preceding every lecture, potentially overshadowing the invited speaker's work and creating an institutionalized ritual of condemnation that may feel performative over time.  
      *   It forces every speaker and audience member to begin the event by confronting Frege's bigotry, which could be particularly burdensome for those targeted by his views.  
      *   It maintains the honorific ("Frege Lecture") while simultaneously undercutting it each time, creating a potentially confusing and dissonant message. Retiring the name removes this dissonance while still allowing the historical context to be taught and acknowledged where appropriate (coursework, introductions mentioning the lecture's history).  

  ### Conclusion
  Retiring the name "Frege Lecture" is not an erasure of history or a denial of his immense contributions to logic, which will and must continue to be taught and studied rigorously. It is, rather, a recognition that bestowing a *continuing public honor* in his name is no longer tenable in light of his deeply harmful personal views, especially given their stark contradiction of the universalist ideals central to his own philosophy. It prioritizes creating an inclusive environment for all members of our community and allows the endowed lecture to focus purely on advancing scholarship in logic and philosophy of language. I recommend we proceed with retiring the name, documenting the reasons clearly within the department, and establishing a new, descriptive title for this vital lecture series.
