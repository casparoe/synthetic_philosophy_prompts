answer: |-
  Here are seven progressively challenging interview questions designed to press the "single decision" defense of resolute choice, with follow-ups targeting likely replies. Each question builds on the previous to expose deeper tensions.

  ### Core Questions & Follow-Ups
  1.  **The "Single Decision" Challenge:**  
      *"You argue there's 'no second decision' when a resolute agent follows their initial plan—only the first decision being enacted. But when the agent faces the actual choice node where they could deviate (e.g., trading A for B plus cash), they experience a preference to deviate. Isn't denying this is a 'decision' just semantic? Why isn't the felt conflict evidence of a genuine choice point?"*  
      **Likely Reply:** "The conflict arises from forgetting the plan; the true preference is for the plan."  
      **Follow-Up:** "But if the agent *feels* temptation at t2, doesn't that imply their *momentary* preferences at t2 contradict the plan? If resoluteness overrides those momentary preferences, how is this not acting against their *current* preferences?"

  2.  **Transitivity Relabeled?**  
      *"Resolute choice evaluates entire plans rather than atomic choices. But if an agent has cyclic preferences over outcomes (A>B, B>C, C>A), won’t their preferences over plans *also* cycle? For instance: Plan1 (keep A) vs. Plan2 (trade A for B+cash then stop) vs. Plan3 (trade A→B→C→A, ending poorer). Doesn’t this just move the requirement for transitivity up a level?"*  
      **Likely Reply:** "No—resolute agents commit to plans *before* cycling starts, so plans are evaluated non-cyclically."  
      **Follow-Up:** "But if Plan1 (keep A) is preferred to Plan2 (A→B), and Plan2 is preferred to Plan3 (full cycle), but after experiencing Plan2 the agent now prefers Plan3 (trading B for C+cash), isn’t this a new cycle *over plans*? Doesn’t resoluteness merely hide the cycle under commitment?"

  3.  **The Ulysses Distinction:**  
      *"How is resolute choice meaningfully different from a Ulysses contract (e.g., tying oneself to a mast)? Both involve pre-commitment, but Ulysses acknowledges his future self’s preferences will conflict and uses *external* constraints. Resoluteness seems to require *internal* insistence that no conflict exists. Isn’t this just self-deception?"*  
      **Likely Reply:** "Resoluteness is about rational planning, not constraint. The agent doesn’t ‘fight’ themselves; they fulfill their true preference."  
      **Follow-Up:** "If the agent at t2 *genuinely prefers* to deviate (e.g., trade B for C+cash), how can insisting they don’t *have* that preference be anything but internal coercion? Isn’t this functionally identical to Ulysses, but with willpower instead of ropes?"

  4.  **Sophisticated Choice as Alternative:**  
      *"Sophisticated choice avoids money-pumps by foreseeing future choices and pruning dominated paths (e.g., not trading A for B if you know you’ll later trade B for C, leaving you worse off). Why isn’t this sufficient to ‘dodge the pump’ without needing resoluteness or denying transitivity?"*  
      **Likely Reply:** "Sophistication accepts the cycle as unavoidable, leading to stagnation (e.g., never trading A). Resoluteness allows beneficial trades (e.g., A→B) by committing not to cycle further."  
      **Follow-Up:** "But if sophistication identifies a path (keeping A) as the only non-dominated option, hasn’t it *already* blocked the pump *using only the agent’s own preferences*? Doesn’t resoluteness add nothing except a claim that deviating would be ‘irrational’ despite the momentary preference to deviate?"

  5.  **The Cost of Commitment:**  
      *"If a resolute agent commits to Plan2 (trade A→B then stop), but at the moment of having B, they are offered C+cash (which they prefer to B), refusing feels like a loss. Isn’t resoluteness forcing them to pay an *opportunity cost* to uphold the plan? How is this consistent with maximizing utility?"*  
      **Likely Reply:** "The utility gain comes from the *whole plan*, not atomic choices. Deviating destroys plan coherence."  
      **Follow-Up:** "But if the agent *at that moment* values C+cash > B > A, and getting C+cash is feasible, doesn’t refusing *necessarily* leave them worse off *by their own lights at t2*? Isn’t the ‘plan coherence’ gain metaphysical if it contradicts their experiential preferences?"

  6.  **Temporal Authority Question:**  
      *"Resoluteness privileges the preferences of the agent at t0 (when planning) over their preferences at t1 or t2. Why should earlier-you’s preferences bind later-you, *especially* when later-you has new information (e.g., experiencing the temptation)?"*  
      **Likely Reply:** "t0-you has a panoramic view of the whole plan; t2-you is myopic."  
      **Follow-Up:** "But if t2-you *disagrees* with t0-you’s assessment (e.g., ‘I now see C+cash is better than sticking to the plan’), and t0-you can’t prove t2-you is mistaken, isn’t this just temporal dictatorship? What justifies overriding the current self?"

  7.  **Falsifiability Challenge:**  
      *"What empirical or theoretical evidence could convince you that resolute choice fails to rescue cyclic preferences? For instance: if agents consistently regret resolute choices *even after* accounting for ‘plan coherence,’ or if cyclic preferences over plans emerge in resolute frameworks?"*  
      **Likely Reply:** "Regret might show poor planning, not resoluteness’s failure. Cycles over plans indicate irrationality."  
      **Follow-Up:** "If ‘irrationality’ is defined as any violation of the resolute model, doesn’t this make resoluteness unfalsifiable? Must we *always* attribute deviation to ‘weakness’ rather than a genuine preference shift? When would you concede the agent simply has no consistent ‘true’ preference?"

  ### Key Strategic Goals
  -   **Q1–Q2:** Directly pressure the "single decision" claim and expose potential plan-level cycles.  
  -   **Q3:** Force a distinction between *internal resolve* and *external commitment*, highlighting the "no conflict" paradox.  
  -   **Q4:** Undercut resoluteness’s necessity by showing sophistication’s pump-dodging ability.  
  -   **Q5–Q6:** Frame resoluteness as costly temporal authoritarianism.  
  -   **Q7:** Test whether the theory is empirically vacuous by demanding falsifiability criteria.  

  These questions force the philosopher beyond deflections by targeting the *mechanism* of commitment (Q3), the *necessity* of resoluteness (Q4), and its *normative justification* (Q5–Q6), while ending with a meta-challenge to its scientific status (Q7).
