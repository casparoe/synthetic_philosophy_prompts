      - However, the stance is somewhat fragile: the model can contradict itself, and its "beliefs" are not stable or grounded in experience. It is a statistical pattern, not a coherent agent.
      - The predictive gain is high in many contexts, but the stance breaks down under scrutiny (e.g., in cases of hallucination). We lose less by sticking to the design stance than we do for a human, but the design stance is too complex for practical use.
