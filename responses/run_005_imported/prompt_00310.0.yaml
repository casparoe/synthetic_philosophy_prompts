  ### Example of REU-Permissible Preference Violating EU Independence While Respecting Stochastic Dominance

  Consider the following pair of gambles over monetary outcomes, where outcomes are in dollars:

  - **Gamble A**: 50% chance of $100, 50% chance of $0  
  - **Gamble B**: $40 for sure  

  Now, introduce a third gamble:  
  - **Gamble H**: $100 for sure  

  We define two mixed gambles by combining each of the original gambles with H, using a 50-50 mixture:  
  - **Gamble A'**: 50% chance of A, 50% chance of H  
  - **Gamble B'**: 50% chance of B, 50% chance of H  

  This yields the following outcome distributions:  
  - **A'**: 25% chance of $100 (from A), 50% chance of $100 (from H), and 25% chance of $0 (from A). Thus, **$100 with probability 0.75, $0 with probability 0.25**.  
  - **B'**: 50% chance of $40 (from B), 50% chance of $100 (from H). Thus, **$100 with probability 0.5, $40 with probability 0.5**.  

  #### Risk-Weighted Expected Utility (REU) Setup
  - **Outcome utility**: Assume a linear utility function \(u(x) = x\) for simplicity (as monetary outcomes are the focus).  
  - **Risk function**: Use \(r(p) = p^2\) (a convex function modeling risk aversion by underweighting better outcomes).  
  - **REU formula**: For a gamble with outcomes ranked from worst to best, REU is calculated as:  
    \[
    \text{REU} = u(x_1) + \sum_{i=2}^{n} r\left(\sum_{j=i}^{n} p_j\right) \left[u(x_i) - u(x_{i-1})\right]
    \]
    where \(x_1 < x_2 < \dots < x_n\) are the ordered outcomes, and \(r(p)\) transforms the decumulative probability.

  #### Preferences under REU Theory
  1. **Original gambles (A vs. B)**:  
     - **REU(A)**: Outcomes ranked: $0 (worst, p=0.5), $100 (best, p=0.5).  
       \[
       \text{REU}(A) = u(0) + r(0.5) \cdot (u(100) - u(0)) = 0 + (0.5)^2 \cdot 100 = 0.25 \cdot 100 = 25
       \]  
     - **REU(B)**: $40 for sure.  
       \[
       \text{REU}(B) = u(40) = 40
       \]  
       Since \(40 > 25\), **B ≻ A** (safe B is preferred).  

  2. **Mixed gambles (A' vs. B')**:  
     - **REU(A')**: Outcomes ranked: $0 (p=0.25), $100 (p=0.75).  
       \[
       \text{REU}(A') = u(0) + r(0.75) \cdot (u(100) - u(0)) = 0 + (0.75)^2 \cdot 100 = 0.5625 \cdot 100 = 56.25
       \]  
     - **REU(B')**: Outcomes ranked: $40 (p=0.5), $100 (p=0.5).  
       \[
       \text{REU}(B') = u(40) + r(0.5) \cdot (u(100) - u(40)) = 40 + (0.5)^2 \cdot 60 = 40 + 0.25 \cdot 60 = 40 + 15 = 55
       \]  
       Since \(56.25 > 55\), **A' ≻ B'** (mixed A' is preferred).  

  **Preference pattern**: B ≻ A but A' ≻ B'.  

  #### Orthodox Expected Utility (EU) Diagnosis
  - EU theory requires adherence to the **independence axiom**: If B ≻ A, then mixing both with H should yield B' ≻ A'. Here, B ≻ A but A' ≻ B', violating independence.  
  - Under EU, any linear utility function \(u(x)\) would imply:  
    \[
    \text{EU}(B) = u(40) > \text{EU}(A) = 0.5u(100) + 0.5u(0) \implies u(40) > 0.5u(100) + 0.5u(0)
    \]  
    Mixing with H:  
    \[
    \text{EU}(B') = 0.5u(40) + 0.5u(100), \quad \text{EU}(A') = 0.75u(100) + 0.25u(0)
    \]  
    The independence violation implies that no EU model can simultaneously explain B ≻ A and A' ≻ B'.  

  #### Stochastic Dominance Respect
  - **Gambles A and B**: Neither stochastically dominates the other.  
    - For \(x < 40\), P(A ≥ x) = P(B ≥ x) = 1 (if x ≤ 0) or similar.  
    - For \(40 ≤ x < 100\), P(B ≥ x) = 1 > P(A ≥ x) (e.g., at x=40, P(B ≥ 40) = 1, P(A ≥ 40) = 0.5).  
    - For x ≥ 100, P(A ≥ x) = 0.5 > P(B ≥ x) = 0.  
    Thus, no violation of first-order stochastic dominance.  
  - **Gambles A' and B'**: Neither dominates.  
    - For \(x < 40\), P(A' ≥ x) = P(B' ≥ x) = 1.  
    - For \(40 ≤ x < 100\), P(B' ≥ x) = 1 (since $100 > x and $40 ≥ x) > P(A' ≥ x) = 0.75.  
    - For x ≥ 100, P(A' ≥ x) = 0.75 > P(B' ≥ x) = 0.5.  
    Again, no stochastic dominance violation.  

  #### Why the Independence Violation is Intuitively Rational (Not a Framing Effect)
  The preference reversal arises from a **rational shift in risk perception** due to the mixture, not from arbitrary framing:  
  - **Original choice (B ≻ A)**: A offers a 50% chance of $0, which is highly aversive under risk aversion (\(r(p) = p^2\) underweights the $100 outcome). The certain $40 is safer and preferred.  
  - **After mixing with H (A' ≻ B')**:  
    - A' now has only a 25% chance of $0, and a 75% chance of $100. The reduction in worst-case risk makes it more attractive.  
    - B' introduces risk: it has a 50% chance of $40 (inferior to H's $100), whereas originally it was safe. The new downside (possibly getting $40 instead of $100) is weighted heavily by \(r(p) = p^2\), making B' less appealing.  
  - **Intuition**: Mixing A with the safe H "hedges" its downside risk, transforming it into a high-probability gain. Meanwhile, mixing B with H "contaminates" its safety, creating a new risk. A risk-averse agent reasonably re-evaluates the gambles based on these **substantive changes in risk exposure**, not superficial framing. This reflects a context-dependent but rational response to risk, which REU captures via probability weighting.  

  In contrast, a framing effect (e.g., presenting the same gamble differently) would not alter the underlying risk structure. Here, the mixtures genuinely alter the outcome distributions and their risk profiles, justifying the reversal under a consistent risk attitude.
