prompt: |-
  So I do a bunch of Bayesian stuff at work (updating priors on model params, the usual posterior/likelihood business) and I feel pretty solid on the basic mechanics of it. But I went down a rabbit hole recently and ran into this thing called the "problem of old evidence" in philosophy of science, and its bugging me. As I understand it: if some evidence E was already known before a theory H was even proposed (classic case being Mercury's orbit before general relativity), then P(E) is already sitting at 1 in your model, so naively E can't raise P(H) at all -- yet obviously scientists treated the Mercury thing as a massive point in favor of GR. Can you explain why this counts as a genuinely hard problem for Bayesians, rather than just "well, you should've assigned a lower prior to E to begin with, you just didn't know better yet" -- and walk me through why that obvious fix runs into trouble? Bonus if you can get into how this connects (or doesn't) with the idea that Bayesian agents are supposed to be logically omniscient.
reasoning: |-
  Okay, the user is asking about the "problem of old evidence" in Bayesian epistemology. They work with Bayesian methods professionally but encountered this philosophical issue, specifically regarding how known evidence (like Mercury's orbit pre-general relativity) can support a new theory when its probability is already 1. They want to understand why it's a hard problem beyond just adjusting priors and how it connects to logical omniscience.

  First, I need to recall the core of the problem. In Bayesian terms, if E is already known, P(E) = 1. The standard Bayesian update for evidence E supporting hypothesis H relies on the likelihood ratio. But if P(E) = 1, then P(E|H) and P(E|~H) both become 1, making the Bayes factor 1. So no support for H from E. The user's initial thought is to assign a lower prior to E before knowing it, but that seems tricky since E is already known.

  The user mentioned the Mercury orbit example. Scientists knew about Mercury's orbit before Einstein proposed GR. When GR explained it, that was seen as strong evidence for GR. But in a Bayesian framework, since the orbit was already known, P(E) = 1, so how does it support H? The user's suggestion is to just set a lower P(E) initially, but the problem is that at the time of developing H, E is already known. So the agent's current probability for E is 1. 

  The challenge here is about counterfactual probability. To compute P(E|H) and P(E|~H), you need to consider what the probability of E would be if you didn't know E. But since you do know E, it's hard to ignore that knowledge. This ties into the issue of logical omniscience. Bayesian agents are assumed to know all logical truths, so if E is a logical consequence of something, P(E) should be 1. But in reality, scientists don't always see all consequences immediately. For example, before GR, scientists didn't know that Newtonian mechanics couldn't fully explain Mercury's orbit; they might have thought it was just an unsolved problem. So the realization that Newtonian physics couldn't explain E might be part of the evidence.

  Clark Glymour's original formulation points out that if P(E) = 1, then P(E|H) is also 1, so no confirmation. Solutions like lowering P(E) face the problem that the agent can't genuinely lower P(E) because they know E is true. Any attempt to pretend otherwise seems artificial. The counterfactual approach involves imagining a state where E wasn't known, but then you have to adjust all related beliefs, which is messy and subjective.

  Another solution is focusing on the explanatory relationship. Instead of changing P(E), consider that H entails E, but that wasn't known before. The Bayesian might need to include the agent's computational state or knowledge of logical relationships. If the agent didn't realize that H implies E, then learning that H entails E could be the evidence. But this requires modeling the agent's understanding, which isn't standard in Bayesianism.

  The user also asked about logical omniscience. Bayesian agents are supposed to know all logical consequences, so if H implies E, P(E|H) should be 1. But humans aren't logically omniscient. So when a scientist discovers that H explains E, that discovery itself provides support. But incorporating this into Bayesianism means tracking which logical implications are known, which complicates the framework.

  I should also address the user's point that scientists treated Mercury's orbit as evidence for GR. The philosophical problem highlights a tension between ideal Bayesian agents and real scientific practice. Solutions like Garber's approach where learning "H entails E" is the key evidence might help. But even then, assigning probabilities to logical statements is tricky.

  In summary, the problem is hard because it challenges how Bayesianism handles known evidence and logical knowledge. Simple fixes like adjusting priors ignore that the agent's current knowledge fixes P(E)=1, and logical omniscience assumes agents always see implications, which isn't realistic. This exposes limitations in applying strict Bayesianism to scientific discovery contexts.
answer: |-
  This is a **brilliant** and genuinely deep problem that cuts to the heart of Bayesian epistemology and its application to scientific reasoning. You've grasped the core tension perfectly. Let's break down why the "obvious fix" fails and why logical omniscience is central to the difficulty.

  **The Core Problem Restated:**

  1.  **Situation:** Evidence `E` (e.g., Mercury's anomalous perihelion precession) is already known *before* hypothesis `H` (e.g., General Relativity) is proposed.
  2.  **Bayesian Constraint:** Because `E` is known with certainty, its probability *in the agent's current belief state* is `P(E) = 1`.
  3.  **Bayes' Theorem (Confirmation):** The degree to which `E` confirms `H` is measured by the likelihood ratio `P(E|H) / P(E|~H)` or the posterior `P(H|E)`. Crucially:
      *   `P(H|E) = [P(E|H) * P(H)] / P(E)`
      *   Since `P(E) = 1`, this simplifies to: `P(H|E) = P(E|H) * P(H)`
  4.  **The Crux:** For `E` to provide confirmation, we need `P(H|E) > P(H)`. Plugging into the simplified formula:
      *   `P(E|H) * P(H) > P(H)`
      *   This implies `P(E|H) > 1` (Dividing both sides by `P(H)`, assuming `P(H) > 0`).
  5.  **Impossibility:** Probability axioms require `P(Anything | H) <= 1`. Therefore, `P(E|H) > 1` is **impossible**. Hence, `P(H|E) = P(H)`. No confirmation!

  **The "Obvious Fix" and Why It Fails:**

  The intuitive response is: *"Just set `P(E)` back to less than 1! Calculate what you* ***would have*** *assigned to `E`* ***before*** *you knew it, then see how much `H` predicts it."* This is essentially proposing a **counterfactual prior** for `E`.

  *   **The Fix:** Imagine the agent's belief state *before* `E` was known. Assign `P_old(E) < 1`. Now, calculate `P_new(H) = P_old(H | E) = [P_old(E|H) * P_old(H)] / P_old(E)`. Since `P_old(E|H)` might be high and `P_old(E)` low, confirmation occurs.

  *   **Why It Seems Plausible:** This mirrors how we intuitively think about historical cases like GR and Mercury. We mentally transport ourselves back to a time before Mercury's anomaly was fully recognized as problematic and ask how surprising it would be for a new theory to explain it.

  *   **Why It Runs Into Trouble (The Hard Problem):**
      1.  **Which Counterfactual State?** The agent *knows* `E` is true *now*. To calculate `P_old(E)`, they must imagine a state where they *don't* know `E`. But this state is **radically underspecified**:
          *   How much did they know about celestial mechanics then?
          *   What other theories were being considered?
          *   What was the *precise* state of knowledge about Mercury's orbit? (Was it considered a minor anomaly, a major problem, or not even fully established?)
          *   Crucially, **`P_old(E)` depends heavily on the background knowledge `K_old` assumed for that counterfactual state.** There's no unique, objective way to define `K_old`. Should `K_old` include Newtonian mechanics? The existence of Vulcan? All astronomical data *except* Mercury's precise perihelion?
      2.  **The Agent's Current Knowledge Infects the Counterfactual:** It's psychologically and rationally difficult for an agent who *knows* `E` is true to genuinely assess what probability they *would have* assigned to it in a past state of ignorance. Their current certainty (`P(E)=1`) bleeds into the counterfactual reasoning, making it hard to genuinely simulate `P_old(E) < 1`.
      3.  **Objectivity vs. Subjectivity:** Bayesianism aims (in some interpretations) to model rational degrees of belief. The counterfactual approach makes the *degree* of confirmation (`P_old(H|E) - P_old(H)`) heavily dependent on a subjective and arbitrary choice of the counterfactual prior state `K_old`. This seems at odds with the intuition that Mercury's orbit *objectively* confirmed GR, regardless of how we model the prior ignorance.
      4.  **The Logical Omniscience Problem (The Real Kicker):** This is where the connection you asked about becomes critical. Bayesian agents are typically assumed to be **logically omniscient**. This means:
          *   They know all logical/mathematical truths (`P(Tautology) = 1`).
          *   They know all logical consequences of their beliefs instantly. If `K` entails `E`, then `P(E | K) = 1`.

      **How Logical Omniscience Bites:**

      *   **In the Counterfactual State:** Assume we try to define `K_old` (background knowledge before knowing `E`). Crucially, `K_old` might *logically entail* `E`, or its negation, or neither.
      *   **If `K_old` entails `E`:** Then a logically omniscient agent *in that state* would *already* have `P_old(E) = 1`! The counterfactual fix fails immediately – we're back to `P_old(E) = 1`, so no confirmation.
      *   **If `K_old` entails `~E`:** Then `P_old(E) = 0`, and `H` predicting `E` (`P_old(E|H) > 0`) would actually *falsify* `H`! Confirmation is impossible.
      *   **If `K_old` neither entails `E` nor `~E`:** This is the only case where the counterfactual fix *might* work. **BUT:** For a logically omniscient agent, `P_old(E)` isn't just "low," it's *precisely determined* by `K_old`. `E` must be a *contingent* consequence of `K_old`. However, in cases like Mercury, `E` (the precise anomaly) was often seen as a *logical consequence* of well-established theories (Newtonian Mechanics + known planetary masses/observations). If the counterfactual state `K_old` includes Newtonian mechanics and the relevant data, a logically omniscient agent *should* be able to deduce `E` (or `~E`) from `K_old`. If they can deduce `E`, `P_old(E)=1`. If they can deduce `~E`, `P_old(E)=0`. Only if `K_old` is defined to be *incomplete* or *lacking the specific data/logic* needed to derive `E`, can `P_old(E) < 1`.
      *   **The Dilemma:** To make `P_old(E) < 1`, we must define `K_old` such that a logically omniscient agent *cannot* deduce `E` from `K_old`. This often means stripping `K_old` of crucial elements of the background theory or data that were *actually known* before `E` was recognized as problematic. This feels artificial – it doesn't reflect the *actual* historical state of knowledge where `E` *was* a puzzling *consequence* of the accepted background knowledge (`K_actual_old`). A logically omniscient agent *with* `K_actual_old` *should* have known `E` already!

  **Alternative Solutions & Their Connection to Omniscience:**

  The problem highlights the tension between ideal rationality (logical omniscience) and real scientific agents. Proposed solutions often relax omniscience:

  1.  **Learning Logical Relationships (Garber, Jeffrey, et al.):** The key isn't `E` itself, but learning that `H` *entails* `E`. Define a new piece of evidence: `E* = "H entails E"`.
      *   *Before* GR, scientists knew `E` (Mercury's orbit) but did *not* know `E*` (that GR entails the correct orbit). `P_old(E*) < 1`.
      *   Discovering that GR (`H`) entails `E` *is* new evidence: `E*`.
      *   Confirmation happens via `P_new(H) = P_old(H | E*)`.
      *   **Connection to Omniscience:** This explicitly abandons logical omniscience. The agent didn't know the logical relationship `H ⊢ E` beforehand. Learning this relationship provides the confirmation. The challenge becomes assigning sensible probabilities `P_old(H ⊢ E)` and `P_old(E | H ⊢ E)` which are now *about* logical truths, not contingent facts.
  2.  **Non-Bayesian Factors:** Some philosophers argue that the confirmation comes from `H` *explaining* `E` in a satisfying way, reducing puzzlement, or unifying phenomena. This is often seen as outside the strict Bayesian calculus. Bayesianism models belief *change*; explanation might relate to understanding, a different epistemic good.
  3.  **Changing Background Knowledge (Nickel):** The development of `H` (GR) might *change* the background knowledge `K`. `E` was anomalous under `K_old` (Newtonian Physics). `H` provides a new framework `K_new` where `E` is no longer anomalous. The confirmation arises from resolving the anomaly within a new, coherent framework. This downplays the simple conditional probability update.

  **Why it's a Genuinely Hard Problem:**

  1.  **It Attacks a Core Strength:** Bayesianism excels at modeling learning *new* evidence. POE shows it struggles with evidence that's *known* but not yet *explained*.
  2.  **Logical Omniscience is Fundamental:** The problem exposes how deeply the (arguably unrealistic) assumption of logical omniscience is baked into the probability calculus itself (`P(E)=1` if `E` is known). Relaxing it is messy and non-standard.
  3.  **Counterfactuals are Messy:** The "obvious fix" relies on specifying a counterfactual state of ignorance, which is inherently subjective, context-dependent, and difficult to formalize rigorously within the Bayesian framework.
  4.  **Capturing Scientific Practice:** It challenges whether Bayesianism can adequately capture the historical significance of cases like GR and Mercury, where explaining a known anomaly was paramount. The confirmation feels objective, but the Bayesian route seems mired in subjective counterfactuals or abandoning core assumptions.

  **In Summary:**

  The Problem of Old Evidence is hard because:
  *   **Formally:** `P(E)=1` *forces* `P(H|E)=P(H)` under strict conditionalization and logical omniscience.
  *   **Intuitively:** The "obvious fix" (counterfactual prior `P_old(E)<1`) is **undermined by logical omniscience** – a logically omniscient agent in the *actual* prior state of background knowledge might have already been compelled to assign `P_old(E)=1` or `P_old(E)=0`.
  *   **Practically:** Defining the relevant counterfactual state of ignorance (`K_old`) objectively is impossible; it's inherently subjective and disconnected from the *actual* historical puzzle (where `E` was a *consequence* of `K_old`).
  *   **Philosophically:** It highlights a tension between Bayesian belief updating and other epistemic virtues like explanation and anomaly resolution.

  The connection to logical omniscience is profound: the problem arises *because* Bayesian agents are assumed to know all consequences of their current beliefs instantly. Real scientists don't. Solutions either relax omniscience (focusing on learning entailments) or step outside strict conditionalization. POE remains a powerful argument that while Bayesian mechanics are useful, they may not fully capture the richness of scientific confirmation, especially regarding the power of explaining what we already know.
