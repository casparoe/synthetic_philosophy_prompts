answer: |-
  This situation involves two separate but intertwined issues: **methodological rigor** and **professional hypocrisy**. Both matter, and your frustration is completely understandable. Let's break it down:

  ### 1. **The Valid Point: Robustness Checks Matter**
     - **Yes, your advisor was technically correct.** Skipping robustness checks *is* bad practice. It undermines the credibility of your results and risks p-hacking accusations (even unintentionally). His demand for rigor is scientifically justified and protects your work’s integrity.
     - **This doesn’t change just because he’s inconsistent.** Good methodology is objective. If the check was necessary for *your* analysis, it should be done—regardless of who else skipped it. Ignoring it would weaken your thesis.

  ### 2. **The Hypocrisy Problem: Authority Undermined**
     - **His inconsistency absolutely matters.** Holding students to standards he ignores himself:
       - **Erodes trust and credibility:** When leaders violate their own rules, it breeds resentment and cynicism (as seen in the lab’s side-eyes).
       - **Creates a double standard:** It’s unfair to demand rigor from others while bypassing it in your own work.
       - **Damages mentorship:** Effective advisors lead by example. His lapse undermines his moral authority to critique you.
     - **His silence when called out is telling.** Dismissing the postdocs’ observation instead of addressing it (e.g., "You’re right, I should revisit that") suggests defensiveness or avoidance.

  ### So, where does this leave you?
  - **On the science:** **Do the robustness check.** Your work’s validity is bigger than your advisor’s flaws. Protect your own credibility.
  - **On the relationship:** **Acknowledge the hypocrisy but strategically.** You can’t fix his behavior, but you can:
    - **Document rigorously:** Ensure every analysis you do is defensible. Use his standards *against* future unfair criticism.
    - **Seek allies:** Talk to the postdocs who noticed the double standard. They can offer support or mediate if conflicts escalate.
    - **Address it privately (if safe):** In a 1:1 meeting, you might say:  
      *"I’ve added the robustness checks as requested. I’m committed to rigorous work, but I’m struggling with consistency in expectations. When [Postdoc] mentioned your paper skipped a similar check, it confused me. Could we clarify when these checks are essential?"*  
      *(Focus on "clarity," not accusation. Gauge his reaction.)*
  - **Protect yourself:** If he’s punitive despite your compliance, involve your department’s grad chair or ombudsperson. Document all interactions.

  ### Bottom Line:
  - **His critique was valid scientifically,** but **his hypocrisy undermines him ethically.**  
  - **Fix your methodology** because it’s the right thing for *your* work.  
  - **Don’t internalize the unfairness**—this reflects *his* failures, not yours. Use it to sharpen your own scientific integrity, which will outlast this mentorship.

  This isn’t about saltiness—it’s about navigating an unfair power dynamic while protecting your work. Stay rigorous, document everything, and lean on supportive colleagues. You’re not wrong to feel conflicted.
