  First, I need to recognize the emotional layers here - there's embarrassment about public criticism, resentment about perceived double standards, and uncertainty about whether the advisor's point still stands despite the hypocrisy. The user even questions if they're "just salty," showing self-awareness.

  The core tension seems to be between two truths: the technical validity of the advisor's critique about robustness checks, versus the ethical problem of holding others to standards he doesn't follow himself. I should acknowledge both aspects separately.

  On the technical side, robustness checks are objectively important for statistical integrity. The user admits this ("fair, the check probably does matter"). So regardless of the advisor's behavior, that part of the criticism is valid and worth addressing.

  But the hypocrisy angle is where it gets messy. When authority figures enforce rules they violate, it creates distrust and resentment - exactly what we're seeing with the lab's side-eyes. This isn't just about hurt feelings; inconsistent standards can actually harm research culture. 

  Important to note the power dynamic too. As a student, the user can't call out the advisor like the postdocs did. That power imbalance makes the public criticism feel doubly unfair. The advisor "letting it drop" when confronted about his own work suggests he's avoiding accountability.

  For practical advice: I should validate the user's feelings while steering them toward productive actions. They still need to fix the robustness check (for science, not just the advisor), but could privately address the double standard later when tensions cool. Documenting everything is wise given the advisor's reputation.

