answer: |-
  Here are 9 interview questions designed to push beyond surface-level restatements of her "all-subjected" principle, targeting your specific objections with predicted responses and loaded follow-ups:

  1.  **Circularity Challenge:** "You argue that nationality-based accounts of 'the people' are circular because they presuppose the very boundary they aim to define. But doesn't the 'all-subjected' principle face the *same* circularity? To identify who is 'subject to' a state's coercive legal order, don't we *first* need to know the spatial and jurisdictional boundaries of *that specific order* – which is precisely what the boundary problem asks us to define? Isn't 'subjected to' parasitic on a pre-existing territorial/legal boundary?"  
      *   **Likely Reply:** She'll distinguish between *identifying* the coercive order's *existence* and *defining* its *legitimate membership*. She might argue that the *fact* of coercive imposition is observable/empirical (e.g., laws enforced on bodies within territory X), while nationality is a *normative* category. The principle then tells us who *ought* to have a say *given* that observable fact.  
      *   **Loaded Follow-Up:** "But if the 'observable fact' requires defining the territory where enforcement happens (e.g., 'within borders'), haven't we just smuggled in the contested territorial boundary? Isn't the 'empirical fact' itself defined *by* the jurisdiction we're trying to justify?"

  2.  **The Degree Problem (Threshold):** "You critique the 'all-affected-interests' view for being impossibly broad – potentially including everyone affected even minimally. But doesn't the 'all-subjected' principle face a parallel 'degree problem'? A tourist is fined for jaywalking, a guest worker pays taxes under threat of penalty, a foreign national faces asset freezes via extraterritorial sanctions – all are 'subjected to coercion' in *some* sense. Where do you draw the line for *meaningful* subjection warranting enfranchisement? Doesn't setting *any* threshold (e.g., 'permanent resident', 'domiciled') risk reproducing the same arbitrariness or under-inclusiveness you find in rival principles?"  
      *   **Likely Reply:** She'll emphasize the *systematic* and *enduring* nature of subjection required. It's not isolated incidents, but being governed by the *ongoing framework* of coercive laws that structure one's life chances and basic liberties within a jurisdiction. Tourists are transient; guest workers might be temporary; sanctions targets might be external.  
      *   **Loaded Follow-Up:** "But doesn't that 'systematic and enduring' criterion itself require contestable judgments? Is a 1-year guest worker 'systematically subjected'? What about someone living just across the border whose livelihood is destroyed by pollution regulations enforced only *up to* that border? Are they not systematically subjected to the *effects* of the coercion, even if not directly targeted?"

  3.  **Border Exclusion as Non-Coercion?:** "A common rebuttal to applying the all-subjected principle to borders is this: Turning someone away at the border isn't *coercing* them; it's merely *not assisting* them or *not granting* them access they have no prior right to. They remain in their previous condition. Therefore, exclusion doesn't subject them to the state's coercion, so they don't need a vote. How do you respond to this argument that exclusion is passive non-admittance, not active coercion?"  
      *   **Likely Reply:** She'll argue that border enforcement *is* active coercion: It involves physical barriers, armed agents, detention, deportation, and the threat/use of force *against* individuals attempting to cross. It coercively prevents them from accessing territory/resources/communities. The state isn't passive; it actively *imposes* its will on their bodies and movement.  
      *   **Loaded Follow-Up:** "Doesn't this risk making 'coercion' synonymous with any exercise of state power that restricts liberty? If the state coercively stops me from entering your private property without permission, does that mean I have a democratic claim over *your* property rules? How do you distinguish legitimate state functions (like property protection) from illegitimate exclusion in the border case?"

  4.  **Under-Inclusion vs. All-Affected (Future/External):** "Your principle prioritizes those directly subjected to coercion *now*. But doesn't this significantly *under*-include compared to the all-affected view in crucial cases? Consider future generations profoundly affected (even doomed) by current climate policy, or populations overseas devastated by a country's trade policies or military actions. They aren't 'subjected to' the enforcing state's *laws* in the required sense, yet their fundamental interests are massively affected. Doesn't your principle fail to capture their legitimate claims to a say, where all-affected seems more intuitively just?"  
      *   **Likely Reply:** She'll likely concede this is a limitation but argue it's the price of a *workable* and *democratically realizable* principle. She might say future generations/foreigners *do* have moral claims, but these must be addressed through international institutions, representation via proxy (e.g., NGOs in intl. forums), or moral constraints on state action, *not* direct enfranchisement within existing state democracies.  
      *   **Loaded Follow-Up:** "If the core democratic justification is about avoiding domination via coercion, aren't future generations and those affected extraterritorially by things like climate policy *still* subject to domination by the coercive decisions of *this* polity? Doesn't restricting the franchise only to the presently-coerced within the territory effectively empower that group to dominate outsiders and the future, violating the anti-domination principle your view often relies on?"

  5.  **The Enforcement Asymmetry:** "The 'all-subjected' principle seems to grant democratic claims based on vulnerability to state power. But doesn't this create a perverse incentive? States could strategically *avoid* subjecting powerful external actors (e.g., multinational corporations, foreign governments) to their laws, precisely to deny them a democratic voice that might challenge state policies benefiting them. Meanwhile, weaker individuals *are* subjected and get a vote, but lack power. Does this asymmetry undermine the principle's ability to check domination?"  
      *   **Likely Reply:** She might argue this highlights the need for robust international law and institutions to constrain powerful actors, or that states *should* subject powerful external actors to their laws (e.g., via strict regulation) precisely because of their impact, which would then trigger inclusion.  
      *   **Loaded Follow-Up:** "But doesn't this just push the problem up a level? If the solution requires subjecting powerful actors to *domestic* law to enfranchise them, what justifies *that* initial act of subjection? And if the solution is *international* institutions, don't we just face the boundary problem *again* at the global level?"

  6.  **Historical Contingency vs. Normative Principle:** "Much of the world's current 'subjection' is the result of historical conquest, colonization, and arbitrary border-drawing. Doesn't grounding democratic inclusion *solely* on present-day subjection risk legitimizing these historical injustices? Shouldn't a normative principle for defining 'the people' account for the *origins* of the coercive order itself?"  
      *   **Likely Reply:** She'll likely agree that historical injustice is crucial but argue the *all-subjected* principle is a forward-looking standard for *current* legitimacy, necessary regardless of origins. Addressing historical wrongs requires separate reparative/restorative justice measures, which might *feed into* redefining boundaries (e.g., indigenous sovereignty), but the principle itself focuses on present relations of coercion.  
      *   **Loaded Follow-Up:** "If the *current* coercive order is built on and perpetuates historical injustice (e.g., through borders that divide ethnic groups, resource distribution), can the 'all-subjected' principle applied *within* that existing order ever be truly legitimate? Doesn't it risk cementing the unjust status quo by making inclusion contingent on accepting the very coercive framework that resulted from injustice?"

  7.  **The Exit Problem:** "If subjection to coercion grants a right to a say, does the right disappear if someone leaves? And conversely, if someone *chooses* to enter and subject themselves (e.g., an immigrant), does their claim only arise *after* they've crossed the border and are subjected? Doesn't this create strange disincentives and fail to capture the intuition that those *seeking* to join a polity might have claims based on their intended subjection and contribution?"  
      *   **Likely Reply:** She might distinguish between the *right* to a say (based on current subjection) and the *right to enter* (a separate moral/political claim). Emigrants lose their vote because they are no longer subject. Prospective immigrants gain the right only upon entry/subjection.  
      *   **Loaded Follow-Up:** "Doesn't this make democratic inclusion contingent on the *state's permission* to be subjected? The state controls who gets subjected via border control, thereby controlling who gets a democratic say about border control itself. Doesn't this loop back to the very circularity and arbitrariness we started with?"

  8.  **Feasibility & Political Will:** "Even if we accept your principle normatively, the practical political obstacles seem immense. How do you envision transitioning from current exclusionary regimes to one based on all-subjected? Isn't the lack of political will from existing citizens, who benefit from exclusion, an insurmountable barrier? Does this make the principle more of an idealistic critique than a practical political project?"  
      *   **Likely Reply:** She'll likely argue that normative clarity is essential even if implementation is difficult and gradual. Change happens through argument, social movements, legal challenges, and incremental reforms. Highlighting the illegitimacy of the current system is the first step.  
      *   **Loaded Follow-Up:** "But doesn't the 'all-subjected' principle, by tying inclusion so tightly to *existing* state coercion, potentially undermine the very tools needed for change? If excluded outsiders have no voice *within* the system, and insiders benefit from exclusion, where does the democratic pressure for inclusion come from? Does the principle rely on existing voters acting against their perceived self-interest?"

  9.  **The Meta-Question: Relocating Arbitrariness?** "Stepping back, your PhD-work-convinced friend argues the boundary problem is fundamentally insoluble: *Any* proposed principle – be it nationality, affectedness, subjection, or residence – ultimately either presupposes the boundary it seeks to define (circularity) or relies on a threshold or criterion that is itself arbitrary or contestable. She sees the debate as rearranging deck chairs on the Titanic. Is she right? Does the 'all-subjected' principle genuinely *solve* the boundary problem, or does it simply *relocate* the inherent arbitrariness (e.g., to defining 'coercion', 'systematic subjection', or the jurisdiction itself)? Is a non-circular, non-arbitrary solution even possible?"  
      *   **Likely Reply:** She will vigorously defend her principle as the *least arbitrary* and *most normatively compelling* solution, directly addressing the core problem of political legitimacy (avoiding domination via coercion). She'll argue that while *some* lines might need drawing (e.g., degree of subjection), this is far less arbitrary than alternatives, and the circularity charge is misplaced because it misidentifies the starting point (coercive fact, not normative boundary).  
      *   **Loaded Follow-Up:** "But if the 'coercive fact' itself depends on recognizing a *jurisdiction* (a bounded space of enforcement), haven't we just kicked the arbitrariness down to defining that jurisdiction? And if defining 'meaningful subjection' requires contestable judgments about permanence or intensity, doesn't the arbitrariness reappear there? Isn't the core insight of the boundary problem that *all* democratic foundations rest on some undemocratic moment or contingent fact – and your principle, however refined, can't escape that?"

  **Key Tips for Delivery:**

  *   **Tone:** Maintain a low-key, curious, and respectful tone. Frame objections as genuine puzzles arising from her sophisticated work, not as gotchas. "I'm wrestling with this implication..." or "How would you respond to the concern that..."
  *   **Phrasing:** Use her own terms and concepts. Show you've engaged deeply.
  *   **Listening:** Be prepared to adapt follow-ups based on her *actual* answers, not just the predicted ones. The predicted replies/follow-ups are starting points.
  *   **Flow:** Group related questions (e.g., Circularity + Meta-Question; Degree + Border Exclusion; Under-Inclusion + Future Generations). Let the conversation breathe.
  *   **The Meta-Question:** Save this for near the end. Frame it carefully: "A really sharp critique I've encountered, one that actually convinced a friend doing her PhD on this that the whole debate might be a dead end, is..."

  These questions should push the conversation into the deeper philosophical tensions within her work and the boundary problem debate itself, moving well beyond a simple restatement of her core thesis. Good luck with the interview!
