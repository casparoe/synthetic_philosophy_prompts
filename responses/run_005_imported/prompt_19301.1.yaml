answer: |-
  Here's the tiered ranking based *strictly* on how well each theory explains why a failing heart retains "pumping blood" as its function. I've differentiated even within etiological and non-etiological camps:

  ```json
  {
    "S": ["Millikan's proper function theory", "Neander's selected-effects refinement"],
    "A": ["Wright's etiological theory"],
    "B": ["Boorse's biostatistical (goal-contribution) theory", "Bigelow & Pargetter's propensity theory"],
    "C": ["Cummins' causal-role theory"]
  }
  ```

  ### One-sentence justifications per theory:
  - **Millikan's proper function theory (S-tier)**: Explicitly defines malfunction as failure to perform the historically selected effect (pumping blood), making failure *presuppose* the function.  
  - **Neander's selected-effects refinement (S-tier)**: Tightly links function to *direct* natural selection history, so malfunction is deviation from the trait's selected performance standard.  
  - **Wright's etiological theory (A-tier)**: Correctly attributes function to historical advantage but is vaguer on selection mechanisms, making malfunction slightly less defined than in S-tier refinements.  
  - **Boorse's biostatistical theory (B-tier)**: Defines function relative to species-typical survival contributions, so a failing heart retains the function only as a statistical exception to the norm.  
  - **Bigelow & Pargetter's propensity theory (B-tier)**: Future-oriented (propensity to *future* fitness) risks denying function if failure is permanent, unlike historical accounts.  
  - **Cummins' causal-role theory (C-tier)**: Function is *only* current causal contribution, so a non-pumping heart literally lacks that function at that moment.
