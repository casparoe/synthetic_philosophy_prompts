  - Neander: "Function is what the trait was selected for by natural selection, thus a malfunctioning heart still has pumping as its function."
  - Wright: "The function is why the heart exists historically, so even when failing, pumping blood remains its function."
  - Boorse: "Function is defined by typical contribution to survival in a reference class, so a failing heart's function is pumping because that's the norm."
  - Bigelow & Pargetter: "Function depends on current propensity to enhance fitness, so a temporarily failing heart may retain the function if it has the disposition to pump."
  - Cummins: "Function is current causal role in the system; a failing heart isn't pumping, so that is not its function at that time."

