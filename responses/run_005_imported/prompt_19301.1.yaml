reasoning: |-
  We are ranking six theories of biological function based solely on how well they explain why a failing heart still has the function of pumping blood (i.e., handling malfunction). The criterion is specific to this scenario.

  The theories:
  1. Wright's etiological theory
  2. Neander's selected-effects refinement
  3. Millikan's proper function theory
  4. Cummins' causal-role theory
  5. Boorse's biostatistical (goal-contribution) theory
  6. Bigelow & Pargetter's propensity theory

  We are to rank them in tiers (S, A, B, C) and provide one sentence per theory.

  Key insight: Etiological theories (Wright, Neander, Millikan) generally handle malfunction well because they tie function to evolutionary history, so even a failing heart has the function because it was selected for pumping blood. However, we must differentiate within these.

  - Cummins' causal-role theory is problematic for malfunction because it defines function by current causal contribution. A failing heart isn't pumping effectively, so by this theory, it might not have that function at the moment.

  - Boorse's biostatistical theory defines function in terms of contribution to survival and reproduction relative to a reference class. A failing heart is statistically abnormal and not contributing, but the function is still defined by what it does in normal cases.

  - Bigelow & Pargetter's propensity theory is future-oriented: function is the propensity (disposition) to contribute to survival and reproduction. Even if currently failing, if it has the propensity (i.e., it could be fixed or sometimes works), it might still have the function.

  Ranking rationale:

  S-tier: Best at handling malfunction. These theories clearly separate current performance from historical (or statistical) assignment of function.

  - Millikan's proper function: It is based on the historical reproduction of the trait due to that effect. Even if broken now, the function is fixed by history.
  - Neander's selected-effects: Similar to Millikan, a refinement of Wright's idea, explicitly tying function to natural selection. The heart's function is what it was selected for, regardless of current performance.

  A-tier: Good but perhaps with a nuance.

  - Wright's etiological theory: The function is what the trait is for, based on why it exists (history of selection). But Wright's original formulation is less precise than Neander/Millikan, so it might be slightly less robust.

  B-tier: Somewhat problematic but can handle malfunction with caveats.

  - Boorse's biostatistical theory: Function is what the trait typically does in the species that contributes to survival. A failing heart is abnormal, but the function is defined by the typical case. However, it relies on statistical norms and might not account for individual malfunction as cleanly.

  - Bigelow & Pargetter's propensity theory: Function is the current propensity to contribute to fitness. If the heart is failing but has the potential (propensity) to pump, then it still has the function. But if the failure is permanent, the propensity is lost, which might be an issue. This is future-oriented and might not be as robust as historical accounts for a currently failing organ.

  C-tier: Worst at handling malfunction.

  - Cummins' causal-role theory: Function is defined by the current causal role within a system. If the heart isn't pumping, then in the current system, it's not fulfilling that causal role. Therefore, it might not have the function at that moment.

  Tier list:

  S: Millikan and Neander (both are selected-effects theories that are very clear on malfunction)
  A: Wright (also etiological but less refined than Neander and Millikan)
  B: Boorse and Bigelow & Pargetter (both have ways to handle malfunction but with potential issues)
  C: Cummins

  But note: We must assign each theory to a tier and differentiate within camps.

  Refined Tiers:

  S: Millikan and Neander are top because they are the most robust and explicit on malfunction due to their reliance on evolutionary history.

  A: Wright is also etiological but sometimes criticized for being too broad (e.g., might include non-selective histories). So it's a step below.

  B: 
  - Boorse: By defining function relative to a reference class (e.g., age, sex) and what is statistically normal, a failing heart is malfunctioning because it's not performing as in the majority. But the function is still pumping because that's what normal hearts do. However, this relies on statistical normality and might not capture the normative aspect as strongly as etiological theories.
  - Bigelow & Pargetter: The heart has the function if it has a propensity (disposition) to contribute to fitness. A failing heart might still have the propensity if it could be fixed or if it sometimes works. But if the failure is total and irreversible, then the propensity is lost, which might lead to saying it has no function. This is less stable than historical accounts.

  C: Cummins: The function is defined by its current causal role. In a failing heart, it's not contributing to circulation, so it doesn't have that function. This theory cannot account for malfunction in the sense that a broken part has a function it's not performing.

  Therefore, we assign:

  S: Millikan, Neander
  A: Wright
  B: Boorse, Bigelow & Pargetter
  C: Cummins

  But note: Bigelow & Pargetter might be placed higher by some, but given the criterion, the potential for losing function if the propensity is absent puts it in B.

  Now, one sentence per theory:

  - Wright: The heart's function is pumping blood because that is why hearts were historically selected, even if this one fails.
  - Neander: The function is fixed by natural selection for pumping blood, so malfunction is when it fails to perform the selected effect.
  - Millikan: Proper function is determined by evolutionary history; a heart's function is pumping because that is what its ancestors did to be selected.
  - Cummins: Since the failing heart isn't currently contributing to circulation, pumping blood is not its function in the current system.
  - Boorse: The heart's function is pumping because that is what statistically normal hearts do to contribute to survival in the reference class.
  - Bigelow & Pargetter: The heart has the function of pumping if it has a current propensity to contribute to fitness, which a temporarily failing one might still possess.

  Tier list in JSON:

