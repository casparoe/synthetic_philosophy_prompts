prompt: |-
  ok so i'm on my school's Honor Council (6 students + 2 teachers, we decide academic integrity cases and can rewrite the actual policy). current case: a kid used his friend's finished essay as a 'guide,' rewriting almost every sentence in his own words but keeping the exact same structure, examples, and order of the argument. policy only calls it a violation if the wording is 'substantially similar,' so half the council says he's technically fine, which feels wrong since he obviously didn't think it through himself. the other half wants to just ban using someone's paper as a 'guide' period, but thats basically what happens whenever friends study together, so idk where the real line even is. can you write the memo i'll bring to our meeting next week -- need an actual verdict on his case, plus a rewrite of the similarity rule so we're not just picking a random cutoff (like 40% identical wording) and calling it fair, and it has to seriously deal with the argument that any cutoff's gonna be arbitrary for cases right on the edge, not just brush that off.
reasoning: |-
  Okay, the user is part of their school's Honor Council dealing with a tricky case. A student used a friend's essay as a guide, rewrote sentences but kept the same structure, examples, and argument order. The current policy only flags "substantially similar" wording, so half the council thinks it's technically okay, but it feels wrong because the student didn't do original thinking. The other half wants to ban using someone's paper as a guide entirely, which might be too broad since friends study together. 

  The user needs a memo for their meeting with a verdict on this case and a rewritten similarity rule. The new rule can't just set a random cutoff like 40% identical wording because that's arbitrary for edge cases. They want a solution that addresses the arbitrariness head-on.

  First, I need to analyze the case. The student didn't copy words but mimicked the structure. That's not plagiarism in the traditional sense, but it's academic dishonesty because they didn't develop their own ideas. The policy's focus on wording is too narrow. The core issue is intellectual dependency—using someone else's intellectual framework without attribution.

  For the verdict, I should argue that this is a violation. Even though the wording isn't identical, the structure and examples are copied. That undermines the assignment's purpose, which is to develop independent thought. The student might have avoided direct copying to bypass the current rule, which shows a loophole.

  Next, rewriting the policy. The current rule is ineffective because it only looks at wording. The new rule should cover structure, sequence, and intellectual contributions. Adding "structure and sequence" makes it clear that copying the blueprint is not allowed. Also, including "substantial intellectual contribution" covers cases where ideas are borrowed without copying words.

  The user is concerned about arbitrary cutoffs. I need to avoid setting a percentage threshold. Instead, the policy should use qualitative criteria. Factors like dependency on the source, originality, and intent. This shifts the focus from counting words to evaluating the thought process. The council can assess each case based on these factors, which is more fair than a fixed number.

  The user also mentioned that banning all use of others' work as a guide is too strict because friends study together. The new policy should distinguish between collaboration and copying. Clarifying acceptable collaboration is key. Pre-writing discussions and studying together are fine, but using someone's specific outline or structure is not. This protects legitimate study habits while preventing dishonesty.

  The memo structure should start with the case verdict, then the policy rewrite. Including reasoning for both will help the council understand the changes. Also, adding implementation steps like examples and training ensures the new rule is applied consistently. The user needs concrete solutions, so providing clear definitions and factors for the council to consider addresses their concerns about arbitrariness.

  Deep needs: The user wants a fair, enforceable policy that promotes academic integrity without being overly restrictive. They need clarity to prevent future disputes and a framework that adapts to edge cases. The underlying issue is fostering original work while allowing collaboration. The solution should balance these, emphasizing intellectual honesty over technicalities.
answer: |-
  ## Honor Council Memo: Case Verdict & Policy Revision Proposal

  **To:** Honor Council Members  
  **From:** [Your Name], Student Representative  
  **Date:** [Date of Meeting]  
  **Subject:** Verdict on Case # [Case Number] & Proposed Revision of "Substantial Similarity" Policy  

  ---

  ### I. Case Verdict: Student A's Essay Submission
  *   **Finding:** **Violation of Academic Integrity.**
  *   **Reasoning:** While Student A rewrote sentences, the core intellectual work – the **argument structure, sequence of points, choice/use of specific examples, and overall conceptual blueprint** – was directly appropriated from Friend B's essay. This constitutes **intellectual dependency without attribution**, bypassing the core learning objective of independent analysis and argument construction required by the assignment.
  *   **Addressing "Substantially Similar" Wording:** The current policy's exclusive focus on wording similarity is insufficient. Student A exploited this loophole through paraphrasing, demonstrating the rule fails to protect against the **misappropriation of intellectual structure and conceptual design**. His work is not original; it is derivative replication. Verifying technical compliance while ignoring the obvious lack of original thought undermines the Honor Code's purpose.
  *   **Recommended Sanction:** [Specify based on Council norms - e.g., Zero on the assignment, mandatory academic integrity workshop, letter of reflection].

  ---

  ### II. Proposed Policy Revision: Addressing the Core Issues
  The current "substantially similar wording" standard is flawed because:
  1.  **Overly Narrow:** Focuses only on surface-level text, ignoring structure, sequence, and intellectual contribution.
  2.  **Exploitable:** Encourages superficial paraphrasing to evade detection while copying core ideas.
  3.  **Arbitrary Thresholds:** Reliance on percentage cutoffs (e.g., 40% identical) is inherently arbitrary for edge cases and misses the fundamental question of *intellectual honesty*.
  4.  **Ignores Intent & Process:** Doesn't address *how* the work was produced (e.g., using another's work as a structural template).

  **Proposed Revised Standard:**

  > **"Unauthorized Use of Intellectual Property:**
  >
  > A violation occurs when a student submits work that **derives substantially and without authorization from the intellectual property of another person or source**. This includes, but is not limited to:
  >
  > *   **Copying or paraphrasing wording, ideas, structure, sequence, arguments, analysis, or specific examples** without proper attribution.
  > *   **Using another person's work (e.g., essay, outline, code, lab report, problem set solution) as a template, guide, or foundation** for one's own submission in a manner that results in significant dependence on the original's intellectual framework, rather than independent thought and construction.
  >
  > **Key Factors for Assessment (Non-exhaustive):**
  > *   **Degree of Structural/Conceptual Dependence:** How closely does the sequence of arguments, organization, choice/application of examples, and logical flow mirror the source?
  > *   **Originality of Core Intellectual Contribution:** Does the work reflect the student's own analysis, synthesis, and argument development, or is it primarily a reformulation of the source's intellectual structure?
  > *   **Access & Intent:** Did the student have access to the specific source work? Was the source used as a starting point for independent work, or as a blueprint to be followed?
  > *   **Nature of Collaboration (if any):** Was collaboration permitted? If so, does the submitted work accurately reflect only the student's own contribution within the collaboration guidelines?
  >
  > **Acceptable Collaboration vs. Unauthorized Use:**
  > *   **Permissible:** Discussing concepts, brainstorming ideas, explaining difficult material, studying *methods* together, peer review *after* independent drafting.
  > *   **Prohibited:** Sharing specific written answers/structures before submission, using someone's completed work (even just the structure/examples) as a direct model for one's own work, collaborative writing unless explicitly allowed."

  ---

  ### III. Addressing the "Arbitrary Line" & Edge Cases
  The concern about arbitrariness for edge cases is valid. **This proposal explicitly rejects relying on simplistic word-matching percentages.** Instead, it:

  1.  **Shifts Focus to Intellectual Contribution:** The core question becomes: "Did the student produce the *intellectual architecture* of this work themselves, or did they substantially appropriate it?" This is a qualitative judgment about the *process* and *origin* of the work, not just its textual surface.
  2.  **Provides Guiding Factors:** The listed factors (Structure, Originality, Access/Intent, Collaboration Context) provide a framework for deliberation, moving beyond "how many words match?" to "how was this built and whose ideas form its skeleton?"
  3.  **Acknowledges Context:** The Council must assess the *specific circumstances* (assignment instructions, permitted collaboration, student intent, nature of the source access). An edge case might involve a student who briefly consulted a peer's *very different* outline for structural ideas but then developed a wholly original argument and examples. The factors allow weighing this against a case like Student A's near-total structural appropriation.
  4.  **Emphasizes Council Judgment:** The policy empowers the Council to make nuanced decisions based on evidence and the principle of intellectual honesty. It accepts that clear cases exist at both ends, and the Council's role is to thoughtfully apply the standard to the grey areas in between, guided by the factors and the Honor Code's spirit.

  ---

  ### IV. Implementation & Next Steps

  1.  **Vote:** Move to accept the verdict on Student A's case and adopt the revised policy standard as proposed.
  2.  **Communication:** Revise the official Honor Code document and create clear, accessible explanations/FAQs for students and faculty focusing on *intellectual property* and *independent construction* vs. surface-level wording.
  3.  **Education:** Integrate examples illustrating "structural dependence" vs. "original construction" and "acceptable collaboration" vs. "unauthorized use" into academic integrity tutorials, orientations, and faculty workshops.
  4.  **Precedent:** Use this case and the new standard as a benchmark for future deliberations.

  **Conclusion:** The current wording-based rule fails to address the fundamental harm of intellectual appropriation. Student A's case demonstrates this starkly. The proposed revision focuses on protecting the *intellectual work* – structure, sequence, argument, examples – and acknowledges that Council judgment, guided by clear principles and contextual factors, is essential for handling nuanced cases fairly. This shift promotes genuine academic integrity and independent learning.

  **Recommendation:** Adopt the verdict and the revised policy standard.
