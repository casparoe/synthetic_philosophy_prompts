answer: |-
  Your friend's challenge raises important questions, but their argument oversimplifies ethical obligations. Here's a breakdown of why their reasoning feels flawed and how to navigate your dilemma:

  ### Key Flaws in the "Obligatory Maximization" Argument
  1. **The Demandingness Problem**:  
     Ethical systems that demand *maximum possible sacrifice* quickly become unsustainable. If helping hundreds obligates you to help thousands, then nothing short of total self-abandonment would suffice. This leads to absurdity—e.g., should you also live in poverty to donate more? Moral frameworks (even utilitarianism) typically recognize *reasonable limits* to obligation.

  2. **Moral Luck Doesn't Create New Duties**:  
     Your inheritance grants freedom, but it doesn’t inherently *increase* your responsibilities. Having resources might expand your *capacity* to do good, but it doesn’t automatically make the most extreme path obligatory. Privilege enables choice; it doesn’t erase your right to balance well-being and impact.

  3. **Ignoring Diminishing Returns**:  
     Sacrificing all personal time risks burnout, which could shorten your impact timeline. Working 60+ hours/week for decades might lead to quitting entirely in 5 years, whereas part-time direct work could sustain 30+ years of contribution. Impact isn’t just immediate—it’s about endurance.

  4. **The Value of Direct Contribution**:  
     Donating money helps, but your skills as an engineer might solve problems donations alone can’t address. Building open-source tools for disease tracking or poverty alleviation could have multiplicative effects that outpace donations. Your talent is a unique resource.

  ### A Balanced Framework for Your Decision
  Consider these factors to align your choice with both impact and integrity:

  | **Factor** | **High-Donation Path** | **Direct-Impact Path** | **Hybrid Approach** |
  |------------|------------------------|------------------------|---------------------|
  | **Impact Type** | Funds proven interventions (scalable but indirect) | Hands-on solutions (potentially innovative but risky) | Combines funding + skill deployment |
  | **Personal Cost** | High burnout risk; minimal time for relationships/health | Sustainable balance; preserves mental health | Moderate flexibility with tradeoffs |
  | **Longevity** | Short-term intensity (5-10 yrs?) | Decades of steady contribution | Adaptable over time |
  | **Skill Leverage** | Wasted engineering talent | Direct application of expertise | Partial skill use + funding |

  ### Practical Steps Forward
  1. **Test Assumptions**:  
     - Calculate *realistic* donation impact: A $300k salary ≠ $300k donated. Factor in taxes, living costs, and burnout risk.  
     - Research direct opportunities: Organizations like [GiveWell](https://www.givewell.org), [Charity Entrepreneurship](https://www.charityentrepreneurship.com), or health-tech nonprofits need skilled engineers.

  2. **Hybrid Models**:  
     - Work 1-2 years in tech to build savings/donations, then transition to direct work.  
     - Use part-time flexibility for high-impact pro bono projects (e.g., [Tech for Good](https://www.techforgood.org)).  

  3. **Moral Clarity**:  
     - **You’re choosing between two moral goods, not good vs. selfish.** Donating significantly *and* applying specialized skills both alleviate suffering—neither is "wrong."  
     - Avoid false binaries: Impact isn’t solely measured in dollars. Your well-being affects your capacity to help others long-term.

  4. **Address Privilege Thoughtfully**:  
     Your inheritance is a tool, not a guilt-trap. As philosopher Ingrid Robeyns notes: "We must use privilege justly, but justice doesn’t demand self-annihilation." Sustainable contributions require preserving your health and relationships.

  ### The Core Insight
  Your discomfort stems from a conflict between two valid ethics: **effective altruism** (maximize measurable good) and **virtue ethics** (live sustainably, honor personal relationships). Neither monopolizes morality. Choosing balance isn’t weakness—it’s acknowledging that humans thrive when impact integrates with purpose, not sacrifice. As long as you’re directing significant resources (time, money, skill) toward reducing suffering, you’re meeting a profound ethical standard.

  > "Do not burn yourself out. Be as I am—a reluctant enthusiast... a part-time crusader." — Edward Abbey
