  Another angle: SIA avoids the reference class problem in SSA. Deciding who counts as an observer can be arbitrary. SIA sidesteps this by considering possible observers, though it introduces its own issues like infinite ethics.

  The user might be overlooking SIA's compatibility with Bayesian updating. SIA naturally incorporates evidence without needing ad hoc adjustments. In contrast, SSA sometimes requires conditionalization that feels forced. Also, in decision theory, SIA can lead to more altruistic behavior across possible worlds, which matters for long-term impacts.

  I should also mention that SSA's handling of the doomsday argument isn't universally accepted. Some argue that even with SSA, variations like the shift rule still imply doomsday concerns. So discarding SIA entirely might not solve all problems.

