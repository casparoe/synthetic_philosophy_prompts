  But what about sophisticated substantivalism? It denies primitive transworld identity, accepting points but no haecceitism. Leibniz might critique this as smuggling in individuation. For him, points can't be primitive; they need relational properties. If points are individuated by their relations, that might align, but if they're prior, it's problematic. Leibniz would see sophisticated substantivalism as still too Newtonian.

  Then there's the issue of dynamical spacetime. Leibniz's space is relational, based on monads' perceptions. But GR's metric is dynamic and contingent. Can monadic perceptions accommodate that? Probably not directly. Leibniz might need to ground the metric in monadic relations, but that's speculative. His system isn't built for fields, so accommodating GR would require major overhauls, maybe losing key elements like pre-established harmony.

