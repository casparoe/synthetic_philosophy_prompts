  **Current State of Theories:**  
  Neither Lewis’s original counterfactual theory nor bare interventionism handles redundancy without refinement, but structural-equations approaches (Halpern-Pearl, Pearl-Woodward synthesis) now provide a principled, non-ad-hoc answer. By explicitly incorporating causal models (e.g., directed acyclic graphs), they define admissible witnesses via *modularity* and *exclusion of off-path variables*—here, setting B to "knocked out" is licensed by graph structure to isolate A’s effect. While debates continue (e.g., "defaults" in Halpern 2016), the framework resolves this case cleanly: A is a cause because, in the contingency where B is inactive, A’s presence determines P. Henrik’s skepticism in (3) reflects historical growing pains, not current stagnation; interventionism, augmented by structural equations, offers the most coherent tool for such biological redundancy.
