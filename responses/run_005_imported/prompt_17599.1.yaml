prompt: |-
  I've been falling down a philosophy-of-biology rabbit hole for a piece on whether "DNA is a code" is actually true or just a metaphor that got too comfortable, and I want to see the real argument, not another summary of it. Could you write me a dialogue between two people going at it after a conference panel on this question -- one a genetic informational realist, who thinks code-talk earns its keep once you add a teleosemantic story (the transcription/translation machinery evolved specifically to "read" that sequence, so its not mere correlation, it's meaning), and the other a developmental systems theorist who thinks that just smuggles back a genetic priveledge the parity thesis already dismantled, since cytoplasmic and maternal-environment factors carry just as much Shannon information about the phenotype as the base sequence does. I want them to actually engage each other's strongest point rather than just restate their own -- and neither should be the pushover, they're both sharp. Skip the "letters spell out proteins" stuff, I've read that a hundred times already.
reasoning: |-
