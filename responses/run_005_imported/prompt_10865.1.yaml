  Then their college roommate's comment hit hard: choosing activities purely because she *wants* to do them, not for any future payoff. The user realizes they can't remember the last time they did something just for the sake of doing it. 

  Their friend suggested it's ordinary burnout, advising scheduled downtime and non-work hobbies. But the user rejects that—it still feels like optimizing rest for productivity. They suspect something deeper is wrong with living entirely for instrumental gains. 

  Hmm. This isn't just burnout. Burnout implies exhaustion from overwork; the user's problem is existential. They've built an efficient life but hollowed out its meaning. Every action is a means to an end—even leisure is "productive leisure." The roommate embodies the opposite: intrinsic motivation. Restoring synths *is* the point, not what it leads to. 

  The core tension: instrumental rationality (doing X to achieve Y) versus intrinsic value (doing X because X matters). The user's life is all rationality, no value. No wonder the promotion felt empty—it was just another checked box. 

  Philosophy frames this well: Aristotle's "eudaimonia" (flourishing through virtuous activity), Kant's treating oneself as an end (not just a means), or existentialism's emphasis on authentic choice. But the user lacks that vocabulary, so I should explain it accessibly. 

