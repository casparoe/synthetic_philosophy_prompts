  I'm drafting a paper arguing that part of why Hobbes's 'geometrical method' felt credible to readers at the time is that he had genuine mathematical bona fides backing it up, and I wanted to open with a line or two establishing that before getting into the philosophy proper. Can you help me confirm what his best, most solid results actually were - maybe something on angle division or his circle quadrature - so I'm not just asserting this without backup?
