answer: |-
  Based on your careful reading of *Nicomachean Ethics* V.5, here's a breakdown of Aristotle's argument concerning demand, convention, commensurability, and money, addressing your specific points of confusion:

  1.  **The Core Problem: Just Exchange Requires Commensurability:**
      *   Aristotle seeks to understand how reciprocal justice (*antipeponthos*) functions in exchange. For exchange to be just, it must be equal (*to ison*). But how can fundamentally different goods (a house, shoes, a bed) be equal? They must be made commensurable (*symmetra*) – measurable by a common standard.

  2.  **The Initial Proportion (Builder:Shoemaker :: House:Shoe):**
      *   This establishes the *necessity* of a proportional relationship (*analogia*) for fair exchange. The ratio of the *producers' worth* (or perhaps the worth *of their arts/professions* within the polis) must equal the ratio of *the products exchanged*.
      *   **Purpose:** To show that exchange isn't random; it reflects a deeper social relationship and valuation. The value of the house relative to shoes reflects the builder's contribution relative to the shoemaker's.
      *   **Problem:** How do we quantify "builder relative to shoemaker"? This ratio is abstract and impractical for daily transactions. We need a common denominator for the *products*.

  3.  **Enter Money as Measure:**
      *   Money (*nomisma*) is introduced as a practical solution. It acts as an "intermediate" (*meson*) that "measures all things." It quantifies the "excess and defect," telling us "how many shoes are equal to a house."
      *   **Function:** Money provides a common unit (e.g., minae) allowing us to express the value of *all* goods numerically. It operationalizes the proportional requirement: House (5 minae) / Shoe (1 mina) = 5:1 ratio, which *should* correspond to the underlying Builder:Shoemaker ratio (though Aristotle doesn't specify *how* that social ratio is determined).

  4.  **The True Foundation: Demand (Chreia):**
      *   Aristotle now reveals the *underlying reality* money represents: "this unit is in truth demand (*chreia*), which holds all things together."
      *   **Why Demand?** Exchange only happens because people *need* (*chreia*) things they don't have. If needs didn't exist or weren't mutual/reciprocal, there would be no exchange or no *equal* exchange. Demand is the fundamental social force driving exchange and making it *possible* to compare disparate goods.
      *   **The Problem with Demand:** Demand (*chreia*) is inherently subjective, variable, context-dependent, and lacks a fixed, objective unit of measure. How do you quantify "need" directly to compare a house and a bed?

  5.  **Money as the Conventional Proxy for Demand:**
      *   Because demand itself is intangible and fluctuating, society needs a stable, agreed-upon representation: "money has become by convention (*kata syntheken*) a sort of representative (*hypallagma*) of demand."
      *   **Convention (*Nomos*) is Key:** Money has value and power *only* because of social agreement (*syntheke*) and law (*nomos*). Its value isn't intrinsic ("not by nature" - *physei*) but bestowed by the community. This is why it can be changed or rendered useless ("it is in our power to change it and make it useless").
      *   **Function:** Money crystallizes the complex, fluid web of social needs (*chreia*) into a single, quantifiable, and transferable symbol. It translates the qualitative "demand for a house relative to demand for shoes" into the quantitative "5 minae : 1 mina."

  6.  **Resolving the "Impossible" Commensurability:**
      *   **The Contradiction Stated:** "Now in truth it is impossible (*adynaton*) that things differing so much should become commensurate (*symmetra genesthai*), but with reference to demand (*pros ten chreian*) they may become so sufficiently (*arkontos*)."
      *   **The Resolution:** This is **not** a contradiction, but Aristotle's crucial distinction:
          *   **True Commensurability:** This would require a *natural*, intrinsic common property shared by houses, shoes, beds, etc., like weight or volume, allowing direct scientific measurement. Aristotle asserts this is *impossible* for such heterogeneous goods. A house and a bed are fundamentally different kinds of things.
          *   **Practical Commensurability Sufficient for Exchange:** For the *purpose* of facilitating exchange within a community, goods *can* be made commensurate *sufficiently* *relative to human demand* (*pros ten chreian*). Money, *by convention*, provides this practical, socially-agreed-upon measure. It works *because* it represents the underlying force of *chreia* and *because* the community accepts it.

  7.  **The Shift in Proportions (Geometric to Arithmetic):**
      *   **Builder:Shoemaker :: House:Shoe:** This is a **geometric proportion** (A:B :: C:D). It establishes the *principle* that exchange value reflects a proportional relationship between the producers/arts within the social order. The ratios are fundamental.
      *   **House (5 minae) :: Bed (1/2 mina?):** This is **arithmetic equivalence** facilitated by money (A = nB, where B is money). It provides the *practical mechanism* for exchange.
      *   **Does the Shift Matter?** Yes, but not as a flaw. Aristotle is moving from the *theoretical foundation* (social/proportional justice) to the *practical instrument* (money enabling calculation). The geometric proportion justifies *why* exchange needs proportionality; the arithmetic equivalence using money shows *how* it's achieved concretely. Money bridges the gap between the abstract social ratio and the concrete exchange of goods. The "five beds = one house" calculation *presupposes* the social valuation captured by the minae price.

  8.  **Avoiding Circularity:**
      *   The argument is complex but not circular:
          1.  **Premise:** Just exchange requires equality/commensurability.
          2.  **Problem:** Heterogeneous goods lack natural commensurability.
          3.  **Solution Found:** Exchange is driven by mutual need (*chreia*). *Chreia* provides the *reason* goods can be compared *for exchange purposes*.
          4.  **Practical Problem:** *Chreia* is intangible and variable.
          5.  **Conventional Solution:** Society invents money (*nomisma*) as a conventional, stable *representation* of *chreia*.
          6.  **Function:** Money acts as a common measure, making goods practically commensurate (*sufficiently* for exchange) by assigning them numerical values expressing their relative worth based on underlying *chreia*.
      *   **Money's Role:** It doesn't *create* value or commensurability *ex nihilo*. It *represents* and *operationalizes* the commensurability grounded in social *chreia*. Its value is derived from the demand it represents, not vice-versa.

  **In Summary:**

  Aristotle argues that the *foundation* of exchange value and commensurability is social need (*chreia*). However, *chreia* itself is too amorphous for direct measurement in transactions. Therefore, society establishes money (*nomisma*) *by convention* as a practical, quantifiable *proxy* for *chreia*. Money "makes goods commensurate" *not* by discovering a natural common property (which is "impossible"), but by providing a socially agreed-upon unit that *sufficiently* reflects their relative worth based on underlying demand. The initial geometric proportion (builder:shoemaker :: house:shoe) highlights the social dimension of value that money ultimately quantifies in arithmetic terms (house = 5 minae, bed = 1 mina, therefore house = 5 beds). The "shift" reflects moving from the *why* to the *how*. The argument avoids circularity by grounding money's function in the prior, more fundamental reality of social need (*chreia*).

  This passage is indeed seminal for understanding Aristotle's move towards a demand-based (though socially embedded, not purely subjective) theory of value, where money is a conventional tool enabling practical equivalence, not the source of value itself. Marx seized on this because Aristotle identifies the *social necessity* behind exchange and the *conventional* nature of money, while struggling (as Marx saw it) to find the *substance* of commensurability without the concept of abstract labor. Your focus on this specific argument is well-placed, as it reveals the nuanced core of Aristotle's economic thought beyond the more commonly cited properties of money.
