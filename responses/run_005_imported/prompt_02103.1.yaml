prompt: |-
  hey so we just wrapped up the promising unit in my ethics seminar and theres a specific thing bugging me that we didn't really resolve in class. hume has that famous bit where he says a new promise creates a new moral obligation straight out of the promisor's own will, and he basically mocks this as being as mysterious as transubstantiation - you can't just conjure a duty into existence by saying magic words, that feels like its assuming the very binding-ness its supposed to explain. ok fine, that's a real problem for the old will-based/normative-power theories. but then we covered scanlon's principle F, which is supposed to dodge this by grounding the obligation in something more mundane: you deliberately got someone to expect and rely on you doing X, and breaking that is just a special case of the general wrong of manipulating people's expectations. no spooky will-power required. except isn't there a circularity lurking in there too (i vaguely remember this being pinned on scanlon by later critics, kolodny and wallace maybe?) - the promisee's trust is supposed to be both what grounds the obligation and what the promise itself is supposed to produce, so where does that first bit of trust even come from, if not from already believing there's an obligation there? feels like the same conjured-from-nothing move hume was making fun of, just wearing an expectations costume instead of a will costume. can you actually walk through whether principle F genuinely escapes hume's bootstrapping worry, or whether it just relocates it?
