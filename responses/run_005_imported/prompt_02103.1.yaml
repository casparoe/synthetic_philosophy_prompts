answer: |-
  You've nailed a profound and persistent tension in promise theory! Let's break down whether Scanlon's Principle F genuinely escapes Hume's bootstrapping problem or just repackages it.

  **Recap of the Core Problem:**

  1.  **Hume's Challenge (The Conjuring Act):** Promises can't create obligations *ex nihilo* solely through the speaker's will ("I hereby obligate myself!"). This assumes the very normative power it purports to create, akin to magic. Where does this power *come from*?
  2.  **Scanlon's Principle F (Expectation-Based):** The wrong of promise-breaking stems from a more general moral principle:
      > *Principle F: If (1) A voluntarily and intentionally leads B to expect that A will do X (unless B consents to A's not doing X); (2) A knows that B wants to be assured of this; (3) A acts with the aim of providing this assurance, and has good reason to believe that he or she has done so; (4) B knows that A has the beliefs and intentions just described; (5) A intends for B to know this, and knows that B does know it; and (6) B knows that A has this knowledge and intent; then, in the absence of special justification, A must do X unless B consents to X's not being done.*
      *   The obligation arises from the **deliberate creation of expectations and reliance**, coupled with the **wrongfulness of manipulating someone's expectations** to their detriment.

  **The Circularity Worry (Kolodny/Wallace-esque):**

  The critique you're remembering (associated with Kolodny, Wallace, and others like Shiffrin) runs like this:

  1.  **Trust Requires Pre-Existing Obligation?** For Principle F to get off the ground, the *promisee (B)* must believe that the *promisor (A)* will feel bound to do X *because they promised*. B trusts A *because* B believes promising creates an obligation.
  2.  **What Grounds *That* Belief?** If B's belief in the obligatoriness of promises is necessary for Principle F to generate the obligation (via B's reliance), then what makes *that* belief justified *in the first instance*? Doesn't *that* belief presuppose the very obligation Principle F is trying to explain?
  3.  **The Bootstrapping Relocated:** Instead of the promisor magically willing an obligation into existence, it seems like the *promisee's belief* in the magical obligation (or the *social practice's* inherent normativity) is doing the conjuring. The obligation is grounded in an expectation *that itself depends on the existence of the obligation*. It's circular: "Promises obligate because people expect them to obligate, and people expect them to obligate because they obligate."

  **Can Scanlon Escape? Defenses and Nuances:**

  Scanlon *does* have responses, and whether they succeed is hotly debated:

  1.  **Focus on the *Act* of Inducement, Not the Belief:** Scanlon argues the core wrong isn't primarily about B's *belief in obligation*, but about A's *intentional act* of inducing B's expectation *under the specific conditions outlined*. The moral force comes from the *manipulative nature of A's action*:
      *   A deliberately uses B's vulnerability (their need for assurance) to get B to form a reliance-based expectation.
      *   A *knows* they are creating this reliance and that B is acting on it.
      *   Failing to fulfill X is then a *betrayal* of that deliberately induced trust, exploiting the position A put B in. The obligation arises from the *wrongness of this specific type of harmful action*, not from B's meta-belief about promises *per se*.
      *   **Analogy:** Imagine A tells B a deliberate lie to get B to invest money. The wrong isn't primarily that B *believed lying is wrong*; it's that A *lied* to manipulate B into a harmful position of reliance. Principle F frames a promise as a specific, assurance-giving act that similarly creates a reliance relationship.

  2.  **The Role of the Formulaic Utterance ("I promise"):** Scanlon sees "I promise" not as a magic spell creating *sui generis* obligation, but as a highly effective, *conventional signal* used to *satisfy the conditions of Principle F*. Saying "I promise" is a clear, reliable way for A to:
      *   Demonstrate they are *intentionally* providing assurance (Condition 1, 3).
      *   Show they know B wants assurance (Condition 2).
      *   Make it clear they intend B to recognize this (Conditions 4, 5, 6).
      *   The phrase works *because* it's a recognized social tool for triggering Principle F, not because it possesses intrinsic normative power. Its effectiveness is grounded in its conventional use to clearly communicate the intentions required by Principle F.

  3.  **Pre-Existing Social Practice - Necessary but Not Sufficient:** Scanlon acknowledges that the *effectiveness* of "I promise" depends on a pre-existing social practice where people understand what it generally signifies (intent to assure/commit). However, he argues:
      *   The *moral obligation* still flows from Principle F (the wrong of manipulative inducement of reliance), *not* directly from the social practice itself.
      *   The social practice provides the *reliable communication channel*, but the *reason* breaking the promise is wrong is the harm done by exploiting the induced reliance, not the violation of the practice's rules. The practice enables the conditions for Principle F to apply; it doesn't *create* the obligation independently.

  **Does Principle F Genuinely Escape Hume? Assessment:**

  1.  **Escapes the "Pure Will" Conjuring:** Principle F decisively rejects the idea that obligation springs *solely* from the internal act of will. It roots obligation in the *interpersonal* wrong of manipulating another's expectations and causing foreseeable harm through induced reliance. This is a more "mundane" and widely accepted source of moral wrongness (like lying or deceiving).
  2.  **Mitigates but Doesn't Fully Eliminate the Circularity/Bootstrapping:** While Principle F shifts the ground, the critique retains significant force:
      *   **The Effectiveness of the Signal:** Why is saying "I promise" such an effective way to induce the *strong, action-guiding* reliance required for Principle F to generate a serious obligation? Why does it work *better* than just saying "I really, really intend to do X"? The most plausible answer is that people *already believe* promising creates a distinctive obligation. Scanlon attributes this effectiveness to convention fulfilling Principle F's conditions, but the *depth* of the reliance induced often seems to presuppose belief in a prior obligation.
      *   **The Strength of the Obligation:** The obligation generated by Principle F seems *proportional* to the harm of disappointed reliance. However, promissory obligation often feels *stronger* and more categorical than this. Critics argue this extra "bindingness" might stem from the social practice itself embedding a normative expectation that *cannot be reduced* to reliance harms.
      *   **The "Intent to Bind" Problem:** Wallace argues that Scanlon's conditions (especially 3 & 5) implicitly require A to *intend to be bound* or *intend to create an obligation*. If so, Principle F might still covertly rely on the promisor assuming a normative power they are trying to create.

  **Conclusion: Relocation, Not Full Escape (But Significant Progress)**

  *   Principle F **successfully relocates** the source of promissory obligation from mysterious will-power to the concrete, morally significant act of *deliberately inducing detrimental reliance*. This answers Hume's core objection to "conjuring by will" by grounding obligation in a recognizable interpersonal wrong.
  *   However, it **does not fully escape** a form of bootstrapping related to the *social practice*. The *effectiveness* of the paradigmatic promissory act ("I promise") in inducing the *deep, obligation-presupposing reliance* necessary for Principle F to generate a robust obligation seems to depend on participants *already* believing in or acting within a practice that recognizes promising as obligating. While Scanlon separates the *convention* (enabling communication) from the *moral source* (Principle F), the critique suggests the moral force and distinctive nature of promises are inextricably linked to the normative expectations embedded in the social practice itself. The circularity is relocated from the individual will to the social sphere.

  In essence: Scanlon replaces the *metaphysical* mystery of will-based obligation with a *socio-moral* puzzle about how expectations strong enough to ground Principle F obligations arise without presupposing the very obligation they are meant to produce. He provides a powerful and largely successful account of *why* breaking a promise is wrong, but the distinctive *phenomenology* and perceived *source* of promissory obligation might still carry traces of the social practice's inherent normativity, leaving a residue of the bootstrapping worry Hume identified. It's a more sophisticated and plausible model, but perhaps not a complete dissolution of the mystery.
