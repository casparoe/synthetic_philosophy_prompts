answer: |-
  Your experience isn't luck—it's a brilliant real-world application of **game theory** and the power of **credible commitment**. The key principle at work is that **transparency transforms a game of mutual suspicion into one where cooperation becomes the rational choice.** Here's why:

  1.  **The Underlying Problem: The Prisoner's Dilemma of Trading**
      *   Your swap scenario is a classic example of the **Prisoner's Dilemma**. Each trader has two choices:
          *   **Cooperate (C):** Send the item as promised.
          *   **Defect (D):** Keep the item and don't send anything.
      *   The ideal outcome is mutual cooperation (both send items, both win). However, the *temptation* is strong: if you defect while the other cooperates, you get their item *and* keep yours (you win big, they lose big). The *fear* is also strong: if you cooperate while they defect, you lose your item and get nothing (you lose big, they win big). Mutual defection (both keep items, no trade) is the worst mutual outcome but often happens due to mistrust.
      *   In a one-off interaction with a stranger (common online), verbal promises ("I'll send it!") are **cheap talk**. There's no cost to lying, and no way to enforce the promise beforehand. Defection is often the safer, dominant strategy.

  2.  **How Transparent Code Changes the Game:**
      *   **Credible Commitment:** Your code isn't just a promise; it's an **enforceable strategy**. By sharing the *exact deterministic logic* before execution, you commit to a specific course of action *based on the other's commitment*. This removes ambiguity and "cheap talk."
      *   **Conditional Strategies Become Binding:** The core power lies in writing *conditional* logic: "I will send my item *if and only if* your code commits to sending your item *based on my code committing to send mine*." This creates interdependence.
      *   **Mutual Inspection Solves Uncertainty:** Before running, both sides inspect the other's code. You aren't guessing intentions; you are *verifying* the logical outcome. You can see, unequivocally:
          *   What the other program *will* do given what your program *will* do.
          *   Whether the combination of the two programs leads to mutual cooperation (both send) or mutual defection (both don't send).

  3.  **Why Transparency Forces Cooperation (The "Magic"):**
      *   **The Self-Commitment Loop:** Imagine two simple, transparent programs:
          *   **Program A:** "Send my item if Program B sends its item. Otherwise, don't send."
          *   **Program B:** "Send my item if Program A sends its item. Otherwise, don't send."
      *   During inspection, Trader A sees:
          *   *If* A sends, B will send (good).
          *   *If* A doesn't send, B won't send (bad).
      *   Similarly, Trader B sees the same mirrored logic.
      *   **The Only Stable Outcome:** Both traders realize that the *only* combination where either of them gets the desired item is if *both* send. The outcome "A sends, B sends" is the only one that satisfies both conditions. Any other combination (A sends/B doesn't, A doesn't/B sends, neither sends) fails one or both conditions. Seeing this logic laid bare in code makes mutual cooperation the *inevitable and rational* outcome if both want the trade.
      *   **Defection Becomes Pointless:** If Trader A tried to write code that always defects ("Never send, regardless of B"), Trader B would see this during inspection. B's code (conditional on A cooperating) would then also defect. The trade fails immediately. The defector gains nothing and loses the *opportunity* for a beneficial trade. Transparency makes attempted defection visible and self-defeating *before* any items are at risk.

  4.  **Why Hidden Code Fails:**
      *   **Uncertainty Breeds Defection:** If you hide your code, the other trader has no way to verify your commitment or the logic. They must assume the worst (that you'll defect) to protect themselves. Their rational response is to write code that defects unless they see *proof* of your cooperation logic – proof they can't see because your code is hidden. This leads directly to mutual defection (no trade).
      *   **Signaling Distrust:** Hiding your code strongly signals that you *intend* to defect or that your code *is* defective. Why else hide it? This destroys any basis for cooperation.

  5.  **Why This Beats a Handshake Deal:**
      *   **Verifiability:** Code logic is objective and inspectable. Promises are subjective and unverifiable.
      *   **Enforceability:** The code *will* execute its logic deterministically. Humans can renege on promises.
      *   **Removes Temptation:** Once the mutually cooperative logic is locked in via code inspection, neither side has an incentive or even the *ability* to defect at runtime. The temptation is eliminated by the pre-commitment.
      *   **Works with Strangers:** It doesn't rely on reputation, trust, or repeated interactions. It works purely on the verifiable logic of the commitments.

  **The Core Principle: Transparency + Conditional Commitment = Enforced Cooperation.**

  You haven't found an unusually honest group; you've created a system where **honesty (cooperation) is enforced by rational self-interest** made visible through transparent code. Defection becomes irrational because it's predictable and leads to guaranteed failure. By revealing your strategy, you're not giving the other side an exploit; you're giving them the *mathematical proof* that cooperation is the only beneficial path for both of you. The ones hiding their code are essentially announcing their intention (or inability) to commit to cooperation, rationally excluding themselves from successful trades. Your system brilliantly solves the fundamental problem of trust in one-off interactions between strangers.
