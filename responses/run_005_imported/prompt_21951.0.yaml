  Okay, the user is part of a state sentencing reform commission dealing with a heated debate about Galen Strawson's "Basic Argument" against moral responsibility. One commissioner wants to remove "just deserts" language from sentencing guidelines, replacing it with a quarantine model like Pereboom's. The user needs a memo to circulate before the next meeting, addressing the "proves too much" counterargument that this logic would also undermine merit-based praise for officials.

  Hmm, the user is clearly in a high-stakes policy role where philosophical arguments have real-world consequences. They're not asking for an explanation of Strawson's argument but for actionable guidance that navigates between two factions: those dismissing it as academic and those taking its implications seriously. The phrase "steelman it" suggests they want rigorous engagement, not dismissal.

  The core tension here is practical: Can policy selectively apply philosophical skepticism about desert without consistency demanding we dismantle all merit-based systems? The memo must acknowledge that while Strawson's argument is logically consistent, policy operates in a different realm - we don't need full metaphysical coherence to prioritize harm reduction in sentencing.

  I should structure the memo to first validate both sides: Strawson's point is valid in theory, but the "proves too much" concern exposes why policy can't adopt it wholesale. The compromise is to reframe guidelines instrumentally (public safety, rehabilitation) without purging all desert language - that avoids the inconsistency trap while still shifting focus from retribution. 

  Key nuance: The memo should explicitly distinguish between blaming individuals (which the state does) and praising officials (which it also does). We can note that the latter relies on practical reasons to incentivize good performance, not deep moral responsibility - a distinction that answers the "but what about judges?" objection.

  For timing, recommend a 6-8 month review: fast enough to show seriousness but slow enough to draft carefully. Stress that this is about guideline language, not abolishing punishment - that pragmatism might ease adoption.

  The user's hidden need might be political: They want to de-escalate the seminar-room polarization. By offering a middle path that names the philosophical worry but doesn't let it paralyze reform, the memo models how commissions can translate theory into workable policy.
answer: |-
  ## MEMORANDUM  
  TO: Sentencing Reform Commission Members  
  FROM: [Your Name], Commissioner  
  DATE: 24 October 2023  
  SUBJECT: Proposed Approach to "Just Deserts" Language & Strawson/Pereboom Concerns  

  ### 1. **Core Recommendation**
     * **Action:** Replace *explicit "just deserts" retributive language* in sentencing guidelines with *consequentialist and public safety frameworks* aligned with the "quarantine" model (e.g., incapacitation of dangerous individuals, rehabilitation where feasible, deterrence based on evidence).
     * **Preserve:** Existing sentencing factors (crime severity, criminal history) as *predictive indicators of risk/harm*, not as moral desert.
     * **Timeline:** Draft revised language for Sections 1 (Purpose) & 3 (Sentencing Factors) within 6 months for commission vote. Full guideline integration by Q2 2025.

  ### 2. **Engaging the "Proves Too Much" Objection (The Merit Praise Paradox)**
     The concern that rejecting *ultimate* moral responsibility for offenders logically requires rejecting merit-based praise for officials is valid *at the philosophical level*. However, policy operates in a practical, non-ultimate sphere. Our response:

     *   **Distinguishing Functions:**  
          *   **Sentencing Guidelines:** Concern the state's *coercive power* (imprisonment, fines). This demands the *highest justification threshold*. Strawson’s argument highlights the fragility of "desert" as a sufficient standalone justification for state-inflicted harm.  
          *   **Performance Evaluation (Judges/Police):** Concerns *administrative efficiency, incentive structures, and public trust*. Praising effective performance is a *pragmatic tool* to encourage desirable behavior within a system, not a declaration of ultimate metaphysical responsibility. We praise a surgeon for skill, not for "ultimately deserving" their steady hands.  

     *   **Asymmetric Stakes:**  
          *   **Sentencing:** Involves profound deprivation of liberty/life based on retrospective blame. If "desert" is philosophically shaky, relying solely on it risks foundational injustice.  
          *   **Performance Praise:** Involves professional recognition, promotion, or public esteem. The *harm* of potentially over-attributing "ultimate merit" here is categorically less severe than incarcerating someone based on a potentially incoherent concept.  

     *   **Policy Coherence ≠ Metaphysical Coherence:**  
          A system can consistently:  
          (a) Prioritize *harm prevention and risk management* as the primary justification for state coercion (sentencing), acknowledging the limits of "desert."  
          (b) Utilize *pragmatic incentives and accountability mechanisms* (praise, promotion, discipline) for officials to ensure the *effective and fair operation* of the system itself.  
          *Rejecting desert as the bedrock of punishment does not necessitate dismantling all performance management.*  

  ### 3. **Why This Addresses the Core Concern Without Overreach**
     *   **Targeted Reform:** We focus precisely on where the "desert" justification is most ethically fraught and consequential: state punishment. We do *not* propose altering HR manuals for judges or police commendations.  
     *   **Practical Justification:** The revised guidelines ground sentencing in demonstrable state interests (public safety, rehabilitation, deterrence) rather than contested metaphysical desert. This is *stronger policy*, irrespective of philosophy.  
     *   **Mitigates Hypocrisy Risk:** Acknowledging the philosophical concern explicitly in our rationale (see below) demonstrates intellectual honesty. We are not claiming officials *are* ultimately responsible; we are using practical tools to make the system function better.  

  ### 4. **Proposed Rationale for Revised Guidelines (Sample Language)**
     > "The primary purposes of sentencing under these guidelines are to protect public safety, reduce the risk of future harm, promote offender rehabilitation where feasible, and provide clear notice of consequences to deter criminal conduct. Sentencing decisions shall be based on the severity of the offense and the offender’s history as reliable indicators of risk and the level of intervention necessary to achieve these purposes. While notions of moral desert historically inform societal views on punishment, the justification for state-imposed sentences rests principally on the state's responsibility to prevent harm and promote the well-being of its citizens through proportionate and effective interventions."

  ### 5. **Next Steps & Timeline**
  1.  **Nov 2023:** Commission discussion on this memo & philosophical/practical implications.  
  2.  **Dec 2023 - Mar 2024:** Subcommittee drafts revised Purpose & Sentencing Factors sections using consequentialist framework.  
  3.  **Apr 2024:** Commission vote on revised sections.  
  4.  **May 2024 - Jan 2025:** Integration of revised principles into full guideline structure; legal review.  
  5.  **Q2 2025:** Final commission vote on updated guidelines; submission to legislature.  

  This approach takes the philosophical challenge seriously by removing the most vulnerable justification for state coercion ("just deserts"), grounds sentencing in stronger, more objective policy goals, and addresses the "proves too much" objection by clearly distinguishing the *pragmatic function* of performance evaluation from the *foundational justification* for punishment. It advances reform without requiring unworkable changes to personnel systems.
