prompt: |-
  I'm a philosophy professor, but thanks to a weird bit of university service I've become the token "outside member" on my medical center's clinical ethics committee -- I think they wanted somebody who'd atleast taught decision theory once. We're finalizing a policy on incidental findings from the whole-genome sequencing our genomics clinic now offers: right now disclosure is left to the individual geneticists discretion, case by case, and the committee wants one uniform rule in place before enrollment reopens on the 15th. The live question is whether patients should be allowed to opt out in advance of learning about specific categories of finding -- late-onset, currently untreatable stuff like Huntington's status or high-penetrance Alzheimer's risk alleles -- or whether the clinic should just disclose everything medically actionable and let people deal with it.

  One committee member, an ex-quant who has read way more decision theory than the rest of us combined, keeps citing something he calls Good's theorem (he's very insistent it's I.J. Good, not just "a good theorem") to argue the opt-out option is actually incoherent: since the expected value of free information is never negative for a rational Bayesian agent, formally enshrining a "right not to know" just builds a mistake into policy, so we should disclose everything by default and scrap the opt-out menu entirely. Our two bioethicists hate this -- they keep gesturing at the actual "right not to know" literature and worries about anxiety, insurance discrimination, and family disclosure cascades, but neither has been able to say exactly what's wrong with his argument, which bugs me, because I suspect something is.

  Could you draft the short memo I'll circulate before Thursday's meeting? I need an actual recommendation on the opt-out question, with a concrete rollout plan, not "reasonable people disagree" -- and I need you to genuinely engage with whether the quant's use of the theorem holds up here, rather than just asserting that a formal result shouldn't get to dictate clinical policy.
reasoning: |-
  Okay, the user is a philosophy professor serving on a medical ethics committee. They're dealing with a policy about disclosing incidental findings from genome sequencing. The main issue is whether patients should be allowed to opt out of learning about certain genetic risks in advance. One member, a former quant, is using Good's theorem to argue that allowing opt-outs is irrational because rational agents should always want information. The bioethicists oppose this but can't counter the argument effectively. The user needs a memo with a recommendation and a critique of the quant's argument.

  First, I need to recall what Good's theorem actually says. I.J. Good's theorem states that the expected value of information is non-negative for a Bayesian decision-maker. Essentially, more information shouldn't hurt rational choices. The quant is applying this to argue against opt-outs, saying patients shouldn't avoid valuable information. But is this applicable in a clinical context?

  The user's deeper needs are important here. They need a policy recommendation that's ethically sound and practical. They also need to address the quant's argument convincingly, not just dismiss it. The bioethicists' concerns about psychological harm, autonomy, and real-world consequences like insurance discrimination are valid but need to be framed in a way that counters the theorem's application.

  I should consider the limitations of Good's theorem in this scenario. The theorem assumes a rational Bayesian agent with consistent preferences and no psychological costs. Real patients aren't perfectly rational; they have emotions, biases, and varying risk tolerances. Learning about untreatable diseases can cause anxiety, which isn't factored into the theorem. Also, the theorem doesn't account for autonomy—people might value not knowing for personal reasons, even if it's "irrational."

  Another point is the context of clinical ethics. Medical decisions aren't just about utility maximization; they involve respect for patient autonomy, beneficence, non-maleficence. Forcing information on someone against their will violates autonomy, even if the information could be useful. The right not to know is recognized in bioethics for these reasons.

  The quant's argument might conflate theoretical rationality with real-world decision-making. Patients might prefer avoiding distress, or they might not trust themselves to handle the information well. Opting out could be a rational choice to prevent future emotional or social harm, which the theorem doesn't consider because it views information as free, but in reality, there are costs.

  Practical implementation matters too. Allowing opt-outs respects diverse patient values and reduces burden on the clinic. Mandatory disclosure could lead to patients avoiding testing altogether, which is worse. The rollout plan should include counseling to help patients make informed choices about opting out.

  So the memo needs to acknowledge Good's theorem but explain its limitations in this context. The recommendation should support offering opt-outs with clear categories and robust counseling. This balances respect for autonomy with the benefits of information, addressing both ethical principles and practical concerns.
answer: |-
  ## MEMORANDUM  
  **To:** Clinical Ethics Committee  
  **From:** [Your Name], Philosophy Dept. (Committee External Member)  
  **Date:** October 24, 2023  
  **Subject:** Policy Recommendation: Incidental Findings & Opt-Outs, with Analysis of Good's Theorem Argument  

  ### I. Recommendation: Allow Categorical Opt-Outs
  We should **implement a policy allowing patients to opt out *in advance* of receiving specific categories of non-actionable, high-impact incidental findings (e.g., late-onset untreatable disorders like Huntington’s or high-penetrance Alzheimer’s alleles)**, subject to robust pre-test counseling. Disclosure of medically actionable findings should remain mandatory.  

  **Proposed Rollout Plan:**  
  1.  **Structured Pre-Test Counseling:** Develop a standardized counseling protocol explicitly covering:  
      *   The *nature* of potential incidental findings (actionable vs. non-actionable, categories).  
      *   The *implications* of learning non-actionable, high-impact results (psychological, familial, insurance).  
      *   The **clear option to opt out of receiving specific categories** of non-actionable findings *before testing*.  
      *   The process for re-contact if findings become actionable later.  
  2.  **Opt-Out Menu:** Offer check-box opt-outs for defined categories (e.g., "Neurodegenerative Disorders (Untreatable)"). Avoid overly broad "all non-actionable" opt-outs.  
  3.  **Documentation:** Secure electronic signature confirming understanding and choices.  
  4.  **Implementation Target:** Integrate into new patient intake before enrollment reopens on the 15th.  
  5.  **Audit & Review:** Monitor opt-out rates & patient feedback; review policy annually.  

  ### II. Engaging Good's Theorem: Validity & Limitations in Clinical Context
  Committee Member X's argument, citing **I.J. Good's theorem on the non-negative expected value of information (EVI)**, is formally correct *within its specific, narrow assumptions*. However, its application to mandate universal disclosure in the clinical genomics context is **fundamentally flawed** for several reasons:

  1.  **Assumption of Pure Bayesian Rationality:**  
      Good's theorem assumes an agent who:  
      *   Has stable, coherent, and *known* preferences/utilities.  
      *   Perfectly updates beliefs via Bayes' theorem upon receiving information.  
      *   Incurs *no intrinsic cost* from the *process* of belief updating or information receipt itself.  
      **Clinical Reality:** Patients are not idealized Bayesian agents. Learning about untreatable, high-risk conditions often triggers:  
      *   **Significant Psychological Distress:** Anxiety, depression, existential dread – costs *not captured* by the EVI calculation focused on future action outcomes.  
      *   **Altered Preferences/Utilities:** The information itself can radically change how a patient values future states or perceives their life narrative (e.g., "ruined anticipation").  
      *   **Cognitive Burden & Bias:** Patients may struggle with probabilistic reasoning or suffer from availability bias post-disclosure.

  2.  **Misinterpretation of "Value":**  
      Good's EVI is defined relative to the agent's *own* utility function and the potential actions the information enables.  
      **Clinical Relevance:** For findings with *no current medical actionability*:  
      *   The potential *instrumental* value (guiding future actions) is near zero *at the time of disclosure*.  
      *   The primary "value" becomes *non-instrumental* (knowledge for its own sake, life planning).  
      *   **Autonomy Implication:** The theorem dictates that a rational agent *must* assign non-negative value. But respecting autonomy means allowing the patient to decide *for themselves* whether this non-instrumental knowledge has *positive, neutral, or negative personal value*. Forcing non-instrumental knowledge denies them this valuation.

  3.  **Ignoring the "Cost" of Foreclosed Options:**  
      The theorem shows EVI >=0 for accepting *available* information. It does *not* address the value of *deliberately maintaining ignorance* as a chosen state.  
      **Clinical Relevance:** For some patients, **not knowing** preserves:  
      *   Hope and present well-being.  
      *   Freedom from burdensome future decisions (e.g., pre-symptomatic testing for children, disclosure dilemmas).  
      *   Avoidance of potential discrimination (insurance, social).  
      *   Preservation of current identity/narrative.  
      Valuing this state of "protected ignorance" is a *rational preference* for many individuals, not a cognitive error. An opt-out formalizes respect for this preference.

  4.  **Contextual Constraints of Clinical Practice:**  
      The theorem assumes information is "free" in terms of delivery.  
      **Clinical Reality:**  
      *   **Resource Burden:** Mandatory disclosure of *all* findings necessitates significant resources for complex counseling *for information the patient may not want*, diverting resources from actionable results or patients who *do* want the information.  
      *   **Coercion Risk:** Presenting unwanted, distressing information under the banner of "rationality" can feel coercive and damage trust.  
      *   **Discouraging Testing:** Patients fearful of being forced to learn unwanted information may decline potentially beneficial WGS altogether – a net negative outcome.  

  ### III. Conclusion: Respecting Rationality and Autonomy
  While Good's theorem elegantly demonstrates why a rational agent *might* choose to receive information, it **does not compel the conclusion that forcing information upon an unwilling agent is rational or beneficial.** Clinical ethics prioritizes **respect for patient autonomy** and **non-maleficence**.  

  Allowing categorical opt-outs:  
  *   **Acknowledges Diverse Rationalities:** Patients rationally weigh psychological costs, life values, and non-medical consequences alongside informational utility.  
  *   **Upholds Autonomy:** Empowers patients to define the boundaries of their own medical knowledge based on their values.  
  *   **Mitigates Harm:** Reduces risk of unnecessary psychological trauma and practical burdens.  
  *   **Is Pragmatic:** Efficiently allocates counseling resources to those who desire the information.  

  **Therefore, rejecting the opt-out based solely on Good's theorem misapplies a theoretical result to a context where its core assumptions do not hold. Our policy should reflect the complex realities of patient values, psychological well-being, and clinical pragmatism, grounded in established bioethical principles supporting the right not to know.** I urge the committee to adopt the recommended opt-out policy with the outlined implementation plan.  

  **Attached:** Draft Opt-Out Form Categories & Pre-Test Counseling Checklist Outline (for discussion).
