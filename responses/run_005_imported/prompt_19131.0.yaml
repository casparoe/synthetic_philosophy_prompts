answer: |-
  ## MEMORANDUM  
  **TO:** Board of Directors  
  **FROM:** Pay Equity Task Force  
  **DATE:** [Current Date]  
  **SUBJECT:** Comprehensive Analysis of Gender Pay Gap & Recommended Path Forward  

  ### Background & Key Findings
  Our analysis of company-wide compensation reveals:  
  1. **Unadjusted Gender Pay Gap:** Women earn 11% less than men on average company-wide.  
  2. **Adjusted Pay Gap (by Level/Function):** When comparing men and women in the *same job level and function*, women are at parity (or slightly ahead) in 92% of roles.  
  3. **Root Cause:** The unadjusted gap stems primarily from the concentration of women in lower-paid levels (e.g., 65% of entry-level roles vs. 28% of executive roles).  

  ### The Simpson’s Paradox Observation (and Why It’s Incomplete)
  A task force member correctly noted this pattern aligns with **Simpson’s Paradox**—where aggregated data shows a trend reversed when broken into subgroups. **We agree the level-adjusted gap (~0%) is statistically valid and essential for assessing "equal pay for equal work."** However, this metric alone is insufficient because:  
  - **Job level is not neutral:** Levels reflect *outcomes* of our talent processes (hiring, promotions, retention). A "fair" adjusted gap does not prove these processes are equitable.  
  - **The 11% unadjusted gap represents real inequality:** It signals systemic barriers to women’s advancement into higher-paying roles, impacting overall economic fairness and talent utilization.  
  - **Industry Standard:** Leading firms (e.g., Salesforce, Microsoft) and regulators (EEOC, UK Gender Pay Gap Reporting) mandate reporting *both* adjusted and unadjusted gaps.  

  ---

  ### Recommendations: A Two-Track Approach  
  We recommend transparently reporting **BOTH metrics** with context, followed by targeted action:  

  #### 1. **Report to the Board (Immediate):**  
     - **"Opportunity Gap" (Unadjusted): 11%**  
       *What it means:* Reflects the disparity in women’s representation across higher-paying levels.  
     - **"Pay Equity Gap" (Adjusted): ~0%**  
       *What it means:* Indicates fair pay for similar roles today.  

  #### 2. **Commit to Root Cause Analysis (RCA) (60 Days):**  
     Investigate *why* women are underrepresented in senior roles:  
     - **Promotion Rates:** Compare promotion velocity (time-in-level) and rates by gender.  
     - **Hiring Funnel:** Analyze gender distribution in high-level hires and internal pipelines.  
     - **Retention:** Review attrition by gender and level (especially post-promotion).  
     - **Process Audit:** Assess performance review, mentorship, and sponsorship programs for bias.  

  #### 3. **Develop Action Plan (90 Days):**  
     Based on RCA findings, propose interventions such as:  
     - **Promotion Process:** Structured criteria, calibrated decision panels, sponsorship programs.  
     - **Talent Development:** High-potential programs with equitable access.  
     - **Leveling Equity:** Review role classification to ensure consistent leveling across functions.  

  #### 4. **Long-Term Accountability:**  
     - **Track & Report Annually:** Both unadjusted and adjusted gaps + representation by level.  
     - **Set Targets:** For female representation in leadership (e.g., 40% in VP+ roles by 2027).  

  ---

  ### Why This Approach?  
  - **Transparency:** Builds trust by acknowledging both the symptom (11% gap) and current pay fairness.  
  - **Substance:** Addresses the *source* of inequality (advancement opportunities), not just the symptom.  
  - **Risk Mitigation:** Proactively identifies barriers before they escalate into legal/reputational issues.  
  - **Business Case:** Diverse leadership correlates with innovation and financial outperformance (McKinsey, 2023).  

  ### Next Steps & Timeline  
  - **Next Friday:** Submit preliminary report including both metrics and RCA plan.  
  - **60 Days:** Deliver RCA findings to Board.  
  - **90 Days:** Present action plan for approval.  

  **Conclusion:** Simpson’s Paradox helps explain *how* the 11% gap arises—but not *why* women are concentrated in junior roles. By reporting both gaps and investigating the promotion pipeline, we address pay equity *and* career equity. This positions us as leaders in fair compensation while strengthening our talent strategy.  

  **Task Force Recommendation:** Unanimously endorses this two-track approach (adjusted/unadjusted reporting + RCA).  

  Respectfully submitted,  
  [Your Name/Task Force Chair]  

  ---

  **Key Rationale for Your Colleague:**  
  - **Validate his stats:** "You’re right—Simpson’s Paradox explains the divergence between aggregated and subgroup data. The adjusted gap *is* crucial."  
  - **Elevate the scope:** "But job level isn’t a pre-existing variable like blood type; it’s an output of our system. If bias exists in promotions, ‘controlling for level’ masks it. We need to check the engine, not just the dashboard."  
  - **Practical compromise:** Reporting both metrics honors the data while forcing engagement with systemic issues.
