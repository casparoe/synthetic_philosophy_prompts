  Final touch: End with Alya’s quiet pride in bridging worlds with words. Emphasize that language isn’t just definitions, but lived experience and power. That’ll satisfy the user’s request for linguistics driving the plot.
answer: |-
  The air in the Velorian Chancellery’s negotiation chamber hung thick with the scent of stale coffee and unspoken violence. For three days, delegates from the **Karasai Alliance** (the mountain clans) and the **Lowland Accord** had wrestled over mineral rights and border demarcations in the fractured state of Tarkesh. Alya Rostova, perched on her interpreter’s stool between the delegations, felt the familiar ache in her jaw from hours of precise, neutral transmission. Her fluency in both **Karas** (the clipped, guttural mountain tongue) and **Low Tarkish** (the softer, vowel-rich language of the plains) was her weapon and her shield.

  The breakthrough on shared water management had just dissolved over a single word: **"Keth’rai."**

  “It is simple!” insisted Lowland Minister Borin, his jowls quivering. “The geological surveys clearly state the deposits lie within the traditional migratory lands of the *Keth’rai*. It is the historical, descriptive term!”

  Across the obsidian table, Karasai Elder Vanya slammed a gnarled fist. The sound echoed like a gunshot. “*Keth’rai*? You spit that word in this chamber? It is the name your tax-collectors called us when they stole our grain! The name your soldiers used when they burned our high pastures! It is a *slur*, Minister! We are the **Karasa**! Use *that*!”

  Borin scoffed. “Semantics! Over-sensitivity! *Keth’rai* merely denotes ‘people of the high crags’. It is geography, not insult! Your own historical records use it!”

  “Used *by us*! *About us*! When *you* say it…” Vanya’s voice dropped to a dangerous rasp, “…it carries the weight of a thousand wrongs.”

  The room plunged into furious silence. Lowland delegates muttered about stubbornness; the Karasai delegates radiated cold fury. The lead Velorian mediator rubbed his temples, helpless. The talks were paralyzed over a phoneme.

  Alya’s mind raced. She *knew* both sides were right, and tragically wrong. Not because the word itself held inherent evil, but because of the invisible architecture built around it over centuries. **Keth’rai** (pronounced *keth-RYE*, with a slight trill on the 'r' in Low Tarkish) *did*, lexically, mean "dwellers of the high, rocky places." In ancient Karas texts, it was neutral, sometimes even proud. But centuries of Lowland dominance had warped its usage.

  The key wasn't in the dictionary definition – the **semantic meaning**. It was in the **conventional implicature** and the **speaker's license**. When a Lowlander said "Keth'rai," especially one in power, it *conventionally implied* a constellation of negative stereotypes: backward, stubborn, uncivilized. It wasn't coded *in* the word; it was baggage automatically attached *by convention* due to historical usage patterns. And crucially, the Karasai knew that Lowlanders *knew* this implication, making its use, especially in formal settings, feel deliberately dismissive or hostile – a denial of their chosen identity, **Karasa**, which meant "People of the Stone Heart," implying resilience and deep connection.

  Furthermore, the **speaker's license** was violated. Within the Karasai community, using "Keth'rai" could be nostalgic or self-deprecating, reclaiming the term. But when outsiders, particularly historical oppressors, used it, they invoked the entire history of its derogatory usage. It wasn't *what* was said, but *who* said it and the *shared understanding* of that history that poisoned the well. Hom would argue the offense was part of the word's conventional meaning *now*; Anderson and Lepore might argue it was purely a matter of speaker intention and audience perception. Alya saw the messy, lived reality: the convention *was* the offense.

  The mediator sighed. “Perhaps we table this specific clause for now…”

  “No,” Alya said, her voice clear and firm, cutting through the tension. Every head swiveled towards her. Interrupting protocol was unthinkable, but so was letting this derail everything.

  Minister Borin frowned. “Interpreter Rostova, your role is to convey, not opine.”

  “With respect, Minister,” Alya met his gaze, then turned to Elder Vanya, switching fluidly to Karas for the elder’s benefit, then back to Low Tarkish for the room. “My role is to facilitate *understanding*. And I believe I understand the impasse. May I explain?”

  A tense nod from the mediator.

  Alya took a breath. “Minister Borin, you are linguistically correct. ‘Keth’rai,’ in its root form, is geographically descriptive. Its *semantic content* is neutral.” She saw Borin puff up slightly. “However, Elder Vanya is also correct that it *feels* like a slur here.”

  Borin opened his mouth to object, but Alya pressed on. “The offense does not reside solely in the dictionary meaning. It resides in the *conventional history* of its usage by Lowlanders towards the mountain people. When spoken by your side, Minister, it *conventionally implies* – whether you intend it or not – the centuries of condescension, exploitation, and violence associated with that term during Lowland administration. It carries a… *shadow meaning*, established by historical pattern.”

  She turned to Vanya. “Elder, the Minister likely does not consciously intend that shadow. He sees only the geography. But the shadow is real. It is the *conventional implicature* – the unspoken understanding that comes bundled with the word based on *who* has used it and *how* for generations. And because he *knows* this history, using it here feels like a denial of your identity and your pain.”

  Vanya’s fierce eyes held Alya’s. He gave a curt, almost imperceptible nod.

  “So,” Alya continued, addressing the room, “the Minister feels accused of malice where he sees only fact. The Elder feels his identity and history are being disregarded. Both perspectives stem from the complex life of this word beyond its literal definition. It is about *pragmatics*, not just semantics. About *who* can use a term without invoking its painful baggage.”

  Silence stretched. Borin looked thoughtful, perhaps for the first time. Vanya’s posture softened marginally.

  “So what do we *call* them in the document?” the Velorian mediator asked, exasperated but hopeful.

  Alya looked at Vanya. “Elder? The term your people prefer is **Karasa**. Its meaning is clear and chosen.”

  Vanya nodded. “It is who we are.”

  Borin shifted. “But the geological records… the historical context…”

  “Minister,” Alya suggested gently, “could the records not be annotated? ‘Historically referred to as Keth’rai in Lowland surveys, now recognized as the Karasa people’? This acknowledges the past term without endorsing its problematic contemporary usage or denying their self-identification.”

  Borin stroked his chin. Elder Vanya studied Alya for a long moment, then gave a single, slow nod. “This… acknowledges the wound without reopening it. It is… acceptable. For the purpose of this document.”

  The tension didn’t vanish, but the logjam broke. The mediator exhaled audibly. Delegates leaned back, the crisis averted, for now. As the discussion cautiously resumed, Alya sank back onto her stool, her hands trembling slightly. She hadn’t just translated words; she’d interpreted the invisible architecture of offense, the fragile dance between semantic meaning and the heavy weight of history. The linguistics hadn’t been flavor; they *were* the key that turned the lock, proving that sometimes, the most dangerous weapon – and the most vital tool for peace – was a single, loaded word.
