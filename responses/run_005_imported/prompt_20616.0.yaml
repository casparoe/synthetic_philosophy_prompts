prompt: |-
  Write a short story about an interpreter at some kind of high-stakes negotiation (peace talks, a truth-and-reconciliation hearing, treaty drafting, whatever setting you like) that grinds to a halt over a single word for one side's ethnic group -- one delegation calls it a slur, the other insists its just the plain descriptive term and everyone's being oversensitive. The interpreter's the only one in the room who actually gets why both sides have a point: maybe the nastiness isn't part of the word's literal meaning at all, but more like a conventional implicature, or maybe it's baked into who's allowed to use it rather than what it denotes (basically the Hom vs. Anderson-and-Lepore fight, if that rings a bell). I want the actual linguistics to drive the plot, not just sit there as flavor, so make up the word and the group involved rather than using a real one -- otherwise this just turns into a piece about an actual real-world conflict.
