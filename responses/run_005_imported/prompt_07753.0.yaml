answer: |-
  Here’s a story built around that core paradox:

  **The Tide-Caller's Trial**

  In the salt-stained village of Kelp’s End, authority flowed with the tides. Only a true Tide-Caller could command respect, and the mantle passed only through the Trial of the Empty Cave.

  Elara stood before the three Elders on the night of her claiming. The sea roared against the cliffs below, echoing the churn in her stomach.

  "The Cave of Echoes holds nothing but cold stone and the memory of waves," Elder Maren intoned, her voice like grinding pebbles. "Yet to be Tide-Caller, you must *intend* – truly, wholly intend – to enter it at dawn's first light tomorrow, retrieve a single grey pebble, and return it here by noon."

  Elara knew the rules. The Elders didn’t care if she *actually* went. They couldn’t watch the treacherous path. The power of Tide-Caller – the right to settle disputes, allocate fishing grounds, heal with tidal poultices – would be hers the *moment* the Elders deemed her intention pure at this midnight ceremony. Their judgment was uncanny, born of decades reading eyes and the subtle tremor of resolve.

  The incentive was immense. Her mother’s wasting illness needed a Tide-Caller’s poultices. Her family’s leaking hut needed the Caller’s allotment of timber. All she had to do was *mean it now*.

  "But Elder," Elara whispered, the paradox tightening her throat. "Dawn comes *after* midnight. Once you grant me the title... once my mother gets her medicine tonight... why would I go? The cave path is slick, the drop fatal. The pebble is worthless. The Caller’s power is already mine." She gestured helplessly. "How can I *sincerely* intend to risk my life tomorrow for nothing?"

  Elder Maren’s gaze was fathomless. "That is the Trial, child. The Cave cares nothing for deeds. Only the *will* to face its emptiness *before* the emptiness of purpose arrives. We do not judge the dawn. We judge this midnight. Can you, knowing the dawn will erase all reason, *still* plant the seed of absolute resolve within yourself tonight?"

  The wind howled. Elara thought of her mother’s labored breathing, the shame if she failed. She closed her eyes, trying to conjure the intention: *I will walk the path. I will enter the cave. I will take the pebble.* But behind each thought slithered the cold truth: *At dawn, I will be Tide-Caller. The need will vanish. The risk will be madness.*

  The Elders watched, silent as stones. They saw the flicker of calculation, the tremor of doubt born of foresight. Elara gritted her teeth. She couldn't fake this; they’d know. She had to *make* it real, *now*, despite the future absurdity. She imagined her foot slipping on the wet rock, the chill of the cave air, the weight of the pointless pebble in her hand. She forced the conviction: *I will do it. Because I say I will. Because at this moment, I choose the path, regardless of dawn.*

  She poured every ounce of desperate need, every scrap of stubborn will into that midnight intention. She visualized the act itself, divorcing it utterly from consequence or reason. *I go because I intend to go. Now.*

  A long silence stretched. Finally, Elder Maren gave a single, slow nod. "It is done. Tide-Caller Elara. Your mother’s poultice awaits."

  Relief washed over Elara, warm and dizzying. The power was hers. The need was met. As she walked home, the village already murmuring her new title, the Cave of Echoes felt like a bad dream.

  Dawn came, pale and cold. Elara stood on the cliff path, the Tide-Caller’s shell pendant heavy around her neck. Below, the sea churned in the cave mouth. The path was slick, treacherous, pointless. Every rational fiber screamed *turn back*. She had won. There was only loss down there.

  Yet, she hesitated. Not out of duty, not out of fear of being caught – no one was watching. It was the ghost of last night’s intention, hammered into existence in that desperate midnight hour. Had it been real if it couldn’t survive the dawn? Or had its very creation, knowing its future demise, been the ultimate proof of its sincerity?

  Elara took a step onto the wet, dangerous rock. Not because she had to. Not for reward. But because the paradox itself demanded an answer only the empty cave could echo. She moved forward, the absurd pebble her only goal, the weight of last night’s conviction propelling her into the teeth of meaningless dawn.
