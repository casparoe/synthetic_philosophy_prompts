answer: |-
  Here are 10 interview questions (plus strategic follow-ups) designed to press the virtue ethics defender on the empirical and conceptual challenges of situationism, avoiding predictable rebuttals and targeting the core tensions you identified:

  1.  **The Concrete Challenge: The Good Samaritan Study**  
      "Let's start with Darley & Batson's 1973 Princeton Seminary study. Students preparing a talk *on the Good Samaritan parable* were significantly less likely to help a distressed person if they were told they were running late. How should a virtue ethicist interpret this? Does it suggest that *phronesis* (practical wisdom) or compassion is easily 'switched off' by mundane situational pressures like minor time constraints?"  
      *Likely Rebuttal/FU:* If she argues the study is artificial/doesn't reflect true virtue: *"But isn't the 'pressure' of running late an utterly common, real-world situational variable? If virtue is this fragile in a low-stakes context among the *morally engaged*, what does that imply for the robustness of character traits in everyday life?"*

  2.  **The Dime Study & Micro-Situations**  
      "Consider Isen & Levin's 1972 'dime in the phone booth' experiment. Finding a dime massively increased helping behavior moments later. This seems to show prosocial behavior can be radically altered by trivial, fleeting positive moods. Doesn't this undermine the idea of a stable 'helpful disposition', suggesting instead that momentary context is often the dominant driver?"  
      *Likely Rebuttal/FU:* If she dismisses mood as superficial or argues virtuous people *cultivate* positive moods: *"If virtue requires constantly managing micro-situational moods to reliably act well, doesn't that concede that the *situation* (even an internal one like mood) is the primary causal lever, not a deep-seated trait? Is virtue then just superior situation-management?"*

  3.  **Harman's Nuclear Option: Traits as Attribution Error**  
      "Peter Harman argued that the empirical findings suggest 'ordinary attributions of character traits are deeply misguided' – that traits themselves might be cognitive illusions born of the Fundamental Attribution Error. How is this *strong error-theory claim* meaningfully different from the *weaker claim* (like Doris's) that traits exist but are highly context-dependent? Why isn't Harman's view the more parsimonious explanation for the data?"  
      *Likely Rebuttal/FU:* If she distinguishes by emphasizing *some* cross-situational consistency exists: *"But doesn't the FAE precisely explain *why* we *perceive* that consistency even when behavior is largely situation-driven? What empirical evidence *necessitates* positing stable traits *beyond* situational responsiveness and cognitive bias?"*

  4.  **The CAPS Model: Rescue or Redefinition?**  
      "You might appeal to Mischel & Shoda's Cognitive Affective Personality System (CAPS) model – traits as stable *if...then* patterns (e.g., *if* under time pressure, *then* less likely to help). Doesn't adopting CAPS fundamentally *redefine* Aristotelian virtue? Aristotle's *hexis* seems like a stable, active *state* of character, while CAPS describes a reactive *processing system*. Is this a genuine rescue of virtue ethics, or a surrender to situationism in Aristotelian clothing?"  
      *Likely Rebuttal/FU:* If she argues CAPS captures the *dynamic* nature of virtue: *"But Aristotle emphasized *rational stability* and *reliable right action* guided by *logos*. If CAPS makes behavior contingent on highly specific situational 'if's (like finding a dime), doesn't it abandon the core idea of virtue as a *reliable inner compass* operating across diverse contexts?"*

  5.  **Predictive Power: Traits vs. Situations**  
      "The situationist critique hinges on the superior predictive power of situational variables over trait attributions in many experiments. If we want to *predict* whether someone will help in a given scenario, knowing if they're in a hurry (Good Samaritan) or found a dime seems more reliable than knowing they self-report as 'helpful'. What does this imply for virtue ethics, which relies on traits for explaining *and predicting* moral behavior?"  
      *Likely Rebuttal/FU:* If she argues prediction isn't the only goal or traits predict over the *long term*: *"But doesn't ethics fundamentally concern *action* in specific moments? If situations reliably *override* traits in key moments (like my train platform experience), how can traits retain primary explanatory or normative force? Isn't reliable prediction in concrete moments essential for a practical ethic?"*

  6.  **The Limits of Probabilistic Traits**  
      "Virtue ethicists often respond that traits are 'probabilistic' – making virtuous action *more likely*, not guaranteed. But studies like Good Samaritan show situational factors can *dramatically* reduce helping behavior even in highly morally engaged individuals. What *degree* of situational override would falsify the claim that a robust virtue (like compassion or *phronesis*) is actually present? How low can the probability go before we stop calling it a virtue?"  
      *Likely Rebuttal/FU:* If she emphasizes cultivation/imperfection: *"If situational pressures readily reduce the probability of virtuous action to near-zero even in the 'virtuous', doesn't that functionally mean the *situation* determines the action, and the 'trait' is epiphenomenal *in those critical moments*? How is 'probabilistic' different from 'situationally determined' here?"*

  7.  **Moral Education in a Situationist World**  
      "If situational variables are as powerful as the studies suggest, what does 'cultivating virtue' or *phronesis* concretely look like? Is it primarily about training people to *recognize and manipulate situations* (e.g., 'slow down, check your mood') rather than building inner dispositions? Doesn't this shift the focus entirely to situational engineering and away from character development?"  
      *Likely Rebuttal/FU:* If she argues it's about integrating situation-sensitivity *into* character: *"But doesn't this turn *phronesis* into mere *situational awareness and management*? Where does the distinctively *moral* component – the stable commitment to the good – reside if the 'character' part is just a set of context-triggered algorithms? Isn't the 'virtue' label doing less work than the 'situation response' label?"*

  8.  **The Fundamental Attribution Error & Virtue's Self-Understanding**  
      "Doesn't virtue ethics itself *rely* on the Fundamental Attribution Error? When we praise someone as 'courageous' for a brave act, or blame them as 'cowardly' for freezing, aren't we making precisely the kind of dispositional attribution that situationism shows is often erroneous, ignoring powerful situational pressures? How can virtue ethics avoid complicity in this error?"  
      *Likely Rebuttal/FU:* If she argues virtue ethics accounts for context in evaluation: *"But doesn't the *language* and *focus* of virtue ethics ("She *is* courageous") inherently promote dispositional thinking? And empirically, don't people (including virtue ethicists) *systematically underestimate* situational power when making moral judgments, as the FAE predicts? Isn't virtue ethics vulnerable to *reinforcing* this bias?"*

  9.  **The "Fragmentation" Challenge to Integrity**  
      "John Doris argues situationism leads to 'fragmentation' – we have local, context-specific 'virtues' (e.g., honest-at-work, compassionate-with-friends) rather than global, integrated character. Doesn't this directly contradict the Aristotelian ideal of virtue as a unified *hexis* ensuring consistency across life's domains? Can there be genuine *phronesis* if practical wisdom is this compartmentalized?"  
      *Likely Rebuttal/FU:* If she argues integration is the goal of cultivation: *"But the empirical picture shows compartmentalization is the *norm*. If virtue ethics posits a unified character as the ideal *outcome* of cultivation, but the evidence suggests this is exceptionally rare or impossible due to situational power, isn't the ideal practically unattainable and thus ethically unhelpful?"*

  10. **Virtue Ethics as Prescriptive Ideal vs. Descriptive Psychology**  
      "Ultimately, is the virtue ethicist's best defense to retreat and say: 'Virtue ethics isn't a descriptive psychology; it's a *prescriptive ideal* about how we *ought* to reason and act, regardless of how easily humans are swayed by situations'? Doesn't conceding that situations *do* overwhelmingly sway behavior in ways inconsistent with stable traits render this ideal so disconnected from human reality as to be practically irrelevant or even demoralizing?"  
      *Likely Rebuttal/FU:* If she insists the ideal is aspirational/guides cultivation: *"But if the empirical facts show the gap between the ideal (stable, robust virtue) and reality (situational dominance) is *structurally vast* and *explained by pervasive psychological mechanisms*, doesn't prescribing that ideal become like prescribing 'be taller'? How can it effectively guide action or education without being fundamentally misleading about how moral psychology works?"*

  **Key Interview Strategy Tips:**

  *   **Listen Actively for Dodges:** Be ready to politely but firmly interrupt if she gives a generic "situationism attacks a strawman" answer. Say: "I appreciate that general response, but let me press you specifically on the *Good Samaritan study finding* that being in a hurry overrode the students' moral preparation – how does your view account for *that* level of situational impact?"
  *   **Anchor in the Empirical:** Constantly bring her back to the *specific findings* of the key studies (Good Samaritan, Dime, Milgram variations). Don't let the discussion stay abstract. Ask: "How does your model of virtue explain *this specific result*?"
  *   **Press the "How"**: When she offers a defense (e.g., "CAPS integrates situations"), immediately ask *how* it actually works in a way that preserves the core of virtue. "How does this 'if-then' pattern constitute *phronesis* rather than just situational reactivity?"
  *   **Use the Personal (Carefully):** You can briefly reference your train experience *not* as an appeal to emotion, but as a real-world example of the phenomenon: "This isn't just lab data; in my own moment of potential helping, situational factors (shock, confusion) completely overrode my self-conception as helpful. How does virtue ethics account for this *lived experience* of trait-failure under pressure?"
  *   **Control the Frame:** Explicitly frame questions around the *tensions* you want explored: "Let's focus on the tension between the Aristotelian ideal of stable character and the empirical evidence of situational dominance..." or "Harman claims trait-talk *is* the error, not just that traits are weak. How do you *empirically* refute that stronger claim?"

  These questions force engagement with the hardest empirical evidence and the deepest conceptual challenges (Harman's error theory, CAPS redefinition, the FAE, moral education). The follow-ups anticipate common virtue ethics defenses and push back on their sufficiency. Good luck with the interview! It sounds fascinating.
