  The partner's argument might hold if consistently framed around inherent human rights versus animal welfare. But the user needs to address the judges' concern about inconsistency. They should prepare counterarguments against utilitarianism and defend rights-based distinctions. Also, anticipate scenarios where the lines blur, like animal personhood debates or edge cases with humans lacking autonomy.

