answer: |-
  ## The Uncommon Prior Trap: Why Hanson's Rescue Fails and What Disagreement Really Demands

  The elegant machinery of Aumann's agreement theorem exerts a powerful pull on rationalist thinking. It promises that rational agents, sharing common knowledge of each other's beliefs, *must* converge. But this convergence crucially hinges on the **Common Prior Assumption (CPA)**. Without it, the gears jam: two perfectly rational Bayesians, observing the same evidence and each other's conclusions, can rationally persist in profound disagreement. Harsanyi enshrined the CPA as a foundational axiom for games of incomplete information, treating differing priors as irrational by fiat. Critics rightly point out that this simply assumes away the problem – priors are the bedrock, and declaring them *must* be shared doesn't make it so. Robin Hanson's "uncommon priors require origin disputes" argument represents the most sophisticated attempt to salvage the CPA as a *rationality requirement*, arguing that differing priors can only be justified by a fundamental disagreement about *how the agents themselves came to be*. While ingenious, this argument ultimately fails as a universal rescue of the CPA for ideal rationality and provides little practical guidance for resolving real-world disagreements. The CPA binds only under conditions of impossible logical omniscience and a complete, shared ontology of origins – conditions humans never meet. Consequently, learning of peer disagreement rarely mandates large, unconditional Bayesian updates.

  **Why the Common Prior is Load-Bearing:**
  Aumann's theorem demonstrates that if two agents share a common prior probability distribution over a state space, and their posteriors on some event are common knowledge, then those posteriors *must* be equal. The proof relies on the agents' ability to repeatedly condition their shared prior on the information "the other agent has posterior P". With a common prior, this process inevitably grinds them toward the same belief. Remove the common prior, and this mechanism collapses. Agent A, starting with prior P_A, updates on evidence E to reach posterior Q_A. Agent B, starting with P_B, updates on E to reach Q_B ≠ Q_A. Crucially, learning that the *other* agent holds Q_B doesn't necessarily force convergence for A, because A interprets that fact ("B believes Q_B") through the lens of *their own prior* P_A and their model of B's reasoning. A might conclude B saw different evidence, is irrational, or simply started from a different fundamental perspective. The CPA is the linchpin preventing this divergence.

  **Harsanyi's Doctrine and Hanson's Gambit:**
  Harsanyi treated the CPA as a *necessary condition* for rational interaction in strategic settings with incomplete information. Differing priors implied someone was fundamentally irrational from the start. Hanson, seeking to ground this axiom in deeper epistemic principles, argued that priors themselves aren't arbitrary starting points but are *derived* from a shared meta-prior over a larger space encompassing the possible causal histories ("origins") of the agents themselves. Imagine a grand prior over all possible ways rational agents could come to exist and hold beliefs. Hanson contends:

  1.  **Shared Origin Story Implies Shared Prior:** If two agents *fully agree* on the complete causal story of how they each came to hold their priors (including the initial conditions and processes that shaped those priors), then they *must*, by the rules of Bayesian probability applied to this larger space, have started with the same prior over the *original* proposition. Any difference in their current priors would be inconsistent with their shared understanding of the origin process.
  2.  **Differing Priors Imply Origin Dispute:** Therefore, the *only* legitimate reason for two rational agents to have different priors is if they have a substantive, unresolved disagreement about their own origins. They must disagree about which specific origin story (or distribution over origin stories) actually occurred. This disagreement about origins *explains* and *justifies* their differing priors over the target proposition.

  Hanson's move shifts the locus of disagreement from the proposition itself to the agents' histories. The friend's interpretation – that this mandates strong deference to anyone you can't out-argue about your origins – follows logically: if you can't refute their origin story (and thus their prior), you must adopt their prior (or average towards it) when encountering their differing belief.

  **The Case Against Hanson's Rescue:**

  Despite its elegance, Hanson's argument fails to universally rescue the CPA as a binding requirement of ideal rationality due to three fatal objections:

  1.  **The Primitive Prior Problem:** Hanson assumes priors are *always* the output of some knowable origin story within a shared meta-framework. But what if priors are genuinely primitive? Rationality might require *some* prior, but it doesn't dictate *which one*. The meta-prior over origin stories itself requires a prior! This regress must bottom out in brute, unjustifiable assumptions. Two ideal Bayesians could be "born" with different, equally rational primitive priors over the state of the world *without* any deeper "origin story" disagreement to point to. They simply started from different fundamental perspectives, both compatible with minimal rationality constraints (e.g., coherence, non-dogmatism). Hanson's framework presupposes that all priors are derived and thus adjudicable within a shared origin space, but this isn't necessarily true for the foundational elements of belief.

  2.  **Logical Omniscience and the Bounded Mind:** Aumann's theorem and Hanson's extension demand **logical omniscience**. Agents must perfectly condition on all logical consequences of their knowledge, including the infinitely recursive implications of common knowledge of posteriors and the complete structure of the origin space. Real agents – even ideally rational but bounded ones – cannot do this. Crucially, Hanson's origin space is unimaginably vast and complex. Two bounded agents might *in principle* share a common meta-prior over origins, but they lack the computational resources to *actually represent* this space, compute the implications of their shared origin knowledge, or definitively isolate the precise origin point of their disagreement. The disagreement might stem not from a substantive origin dispute, but from their mutual inability to fully map the implications of their shared background knowledge onto the specific prior. The CPA becomes practically irrelevant for any agent lacking god-like computational powers.

  3.  **Underdetermination and the Opacity of Origins:** Even if we grant a shared origin space, the mapping from origin stories to specific priors might be radically underdetermined. Many different origin stories could lead to the same prior, and the *same* origin story might be interpreted as justifying slightly different priors by different agents, depending on how they conceptualize the link between origin and belief. Further, agents often have profoundly limited and imperfect access to their *own* cognitive origins. How can two agents have common knowledge or even substantive agreement about a process (their own cognitive development) that is partially opaque even to themselves? Hanson's argument requires a level of self-knowledge and shared conceptual granularity about cognitive origins that is simply unavailable.

  **The Verdict: A Conditional Bind, Practically Unmet**

  Hanson's argument successfully establishes that **the Common Prior Assumption binds *only* among logically omniscient agents who share a complete, well-defined origin space, possess perfect self-knowledge of their cognitive history, and whose priors are fully determined by that shared origin story (i.e., no primitive priors).** Crucially, *these conditions are never satisfied by human beings, even highly rational ones.* Logical omniscience is impossible. Our origin spaces are ill-defined, partial, and inaccessible. Our priors contain primitive, unjustifiable elements. Our self-knowledge is limited. Therefore, **the Common Prior Assumption is *not* a binding requirement of rationality for actual or even realistically bounded ideal agents.** Persistent rational disagreement, rooted in fundamentally different starting perspectives, is not just possible but inevitable.

  **What This Licenses in Practice: Beyond Deference to Arguments**

  The failure of Hanson's rescue and the impracticality of the CPA for humans demolishes the notion that learning of peer disagreement *automatically* mandates a significant Bayesian update towards the peer's view. Yudkowsky's skepticism in *Inadequate Equilibria* is vindicated. Blind deference based solely on peer status or an inability to "win" an origin debate is unwarranted. Here's what follows:

  1.  **Focus on the Object-Level Argument:** Peer disagreement primarily signals that *your current arguments or evidence might be insufficient to convince a reasonable person*. The rational response is to scrutinize *their specific reasons and evidence* for their belief, and your own. Can you identify flaws in their reasoning? Do they possess evidence you lack? Does their position expose weaknesses in yours? Update based on the *content* of the disagreement, not merely its existence. If their argument is compelling *on the merits*, update accordingly. If you find their argument flawed or based on evidence you already possess and processed differently, minimal update is warranted.
  2.  **Seek the Root, But Don't Demand Origin Victory:** *Try* to understand if the disagreement stems from differing fundamental models or background assumptions (akin to Hanson's "origins"). If you can identify such a root difference (e.g., different weightings of historical analogies, different core intuitions about human nature), focus the discussion there. However, you are *not* rationally required to abandon your position simply because you cannot definitively "win" a debate about whose fundamental model is superior, especially if those models involve primitive priors.
  3.  **Update Modestly on Peer Reliability (Not Belief):** If someone consistently demonstrates good judgment and reasoning *in domains you can evaluate*, and they disagree with you on a novel point, this modestly increases the probability *that they might be onto something you missed*. This justifies a small update towards their position *as a proxy for potential unseen evidence or arguments*, prompting deeper investigation. It does **not** justify a large update directly towards their specific belief without examining their reasons. Conversely, if their track record is mixed or unknown, even less update is warranted.
  4.  **Embrace Uncertainty, Not Surrender:** The persistence of rational disagreement is a feature of a complex world and bounded minds, not a bug. It licenses intellectual humility – acknowledging the limits of your own perspective and the possibility you are wrong – but **not** intellectual surrender or constant, large belief swings based on the mere existence of disagreement. Your epistemic energy is better spent refining arguments, seeking new evidence, and understanding the structure of the disagreement than in attempting impossible computations about shared origins or averaging beliefs based on peer status.

  In essence, learning of peer disagreement is a call to *engage more deeply with the subject matter*, not a signal to blindly average your belief with your peer's. The burden of proof remains firmly on the *arguments* presented, not on your ability to win a metaphysical debate about cognitive origins. Rational disagreement is real, persistent, and does not magically dissolve under the weight of common knowledge; our response must be diligent inquiry, not deference dictated by a theorem whose ideal conditions lie forever beyond our grasp.
