  The user might be wondering if Ayer is just defining terms to win the argument. That's a common criticism. Logical positivists were accused of ruling out meaningful statements that aren't empirically testable. For example, ethical or aesthetic statements become problematic. The character should acknowledge this to seem well-informed.

  I should break down the two claims. "Men never die" is about physical death, observable and falsifiable. "Soul survival" posits something beyond perception. If the soul is defined as imperceptible, it can't interact with the physical world, making any claims about it untestable. That's why it's meaningless, not false.

  The user also needs their character to sound authentic to the 1930s Oxford setting. References to Ayer and other positivists like Carnap would add credibility. The character should use precise language, maybe even dismissive terms like "metaphysical nonsense."

  Potential weaknesses in the argument: If the soul's effects were observable, like in near-death experiences, that could be a counterpoint. But Ayer might dismiss that as insufficient evidence. The character could address such objections preemptively to strengthen their position.

  Also, the user might want the character to come off as intellectually rigorous but possibly arrogant. Highlighting the verification principle's strict criteria and dismissing alternatives as emotive or nonsensical would fit. Mentioning how this applies to religious language in general could add depth.

