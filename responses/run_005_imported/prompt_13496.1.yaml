prompt: |-
  So I spent about thirty years doing Bayesian data analysis in astrophysics, and now that I'm retired I've fallen down a philosophy rabbit hole -- currently stuck on Dutch book arguments for probabilism. I get the mechanics fine: incoherent credences let a bookie construct a set of bets you'd accept individually but that guarantee you loose money taken together. What I can't work out is why that's supposed to show your credences are epistemically irrational rather than just imprudent -- being exploitable by a sufficiently clever bookie sounds like a fact about betting behavior, not about whether your beliefs are unjustified or inconsistent in whatever sense epistemologists actually care about. I have a vague memory of someone trying to "depragmatize" the argument so it doesn't lean on the money-pump scenario at all -- can you walk me through how that's meant to work, and whether it actually closes the pragmatic/epistemic gap or just moves it somewhere else?
