prompt: |-
  Random question from my quals reading – I work on philosophy of action, not metaethics, but I keep running into people talking about the "wrong kind of reasons problem" like its this special new puzzle for buck-passing accounts of value. Isn't it basically just Kant's shopkeeper case dressed up in new vocabulary? The shopkeeper has a reason to give correct change (to keep customers happy) that's totally disconnected from whether honesty is actually good, which seems like exactly a wrong-kind-of-reason situation to me. So why does everyone treat this as its own distinctive problem instead of just an old point about motives and moral worth with a fancier label?
reasoning: |-
  Okay, the user is asking about the "wrong kind of reasons problem" (WKRP) in metaethics, specifically whether it's just a rehash of Kant's shopkeeper case. They work in philosophy of action but keep encountering this in metaethics discussions. 

  Hmm, I can see why they'd make this connection—both deal with reasons disconnected from the actual moral value. The user seems slightly annoyed that people treat WKRP as novel when Kant's case feels similar. There's an underlying frustration here about disciplinary silos; they're noticing how the same idea gets rediscovered with new jargon in different subfields.

  Let me unpack this carefully. First, the Kant parallel is absolutely valid on the surface: both involve "alien" reasons (prudence vs. morality in Kant, pragmatic vs. evaluative in WKRP). But the metaethics angle runs deeper. Kant cares about moral worth—whether an action deserves esteem. WKRP asks a more foundational question: what even counts as a reason *for* value? It's not about praising agents but about defining value itself. 

  The user might be underestimating how radical WKRP is for buck-passing theories. If all value reduces to reasons, but "reasons" can include bribery/threats (e.g., "admire this demon or die"), then the definition implodes. Kant never had to deal with demons demanding admiration! That's why metaethicists see it as distinct—it exposes a technical flaw in reducing value to reasons, whereas Kant exposed flaws in reducing moral worth to outcomes. 

  I should also validate their intuition though. The disciplinary disconnect is real: action theorists see motives, metaethicists see metaphysical puzzles. Maybe the user wants ammunition to bridge these conversations? I'll emphasize both the overlap (yes, same DNA!) and the divergence (no, WKRP isn't *just* about motives) to give them tools for future discussions. 

  ...Also noting their tone is "why is everyone making a big deal?"—so I'll position WKRP as an *evolution* of Kant's insight rather than a dismissal. That should feel satisfying.
answer: |-
  You're absolutely right to see a deep connection—the structural parallel between Kant's shopkeeper and the "Wrong Kind of Reasons Problem" (WKRP) is significant and insightful. However, while they share a core concern about the *disconnect* between certain reasons and the *core normative feature* in question, they target different philosophical projects and expose distinct problems. Here's why WKRP is treated as a distinct, specialized puzzle in contemporary metaethics:

  1.  **Different Targets: Moral Worth vs. Value Analysis**
      *   **Kant's Shopkeeper:** Targets the **moral worth** of an action or the **character** of the agent. Kant argues that an action only has genuine *moral worth* (is *praiseworthy*) if it's done *from duty* (because it's the right thing), not merely *in accordance with duty* for self-interested reasons (like prudence). The focus is on *what makes an agent or action morally admirable*.
      *   **WKRP:** Targets **buck-passing accounts of value** specifically. Buck-passing claims that something is *valuable* (good, admirable, desirable, etc.) *just in case* there are reasons (of the right kind) to *respond* to it in a certain way (e.g., to desire it, admire it, promote it). WKRP asks: *What counts as a reason* ***for*** *that valuing response itself?* It exposes a potential circularity or incoherence in defining value *solely* in terms of reasons for pro-attitudes. The focus is on *the analysis of the concept of value itself*.

  2.  **The Nature of the "Alien" Reason:**
      *   **Kant's Shopkeeper:** The "alien" reason is **prudential/instrumental** (keeping customers happy for profit). It's clearly distinct from the *moral* reason (honesty is right).
      *   **WKRP:** The "alien" reasons are often **bizarre or external inducements** specifically designed to *mimic* the structure of reasons for valuing, but intuitively disconnected from the *value* of the object. The classic examples are:
          *   **The Evil Demon:** An evil demon threatens to torture you unless you admire him. You have a *strong reason* to admire him (avoid torture), but this reason doesn't make the demon *admirable*. (Parfit)
          *   **The Bribe:** Someone offers you $1 million to desire a cup of mud. You have a strong reason *to desire* the mud, but this reason doesn't make the mud *desirable* (valuable as an object of desire). (Rabinowicz & Rønnow-Rasmussen)
      *   **Key Difference:** The WKRP cases involve reasons *to have the pro-attitude itself* (admiration, desire) that are *external* to the properties of the object supposedly being valued. The shopkeeper's reason is a reason *to perform an action* (give correct change) for an ulterior motive. The WKRP reasons are direct reasons *to adopt an evaluative stance*.

  3.  **The Specific Problem for Buck-Passing:**
      The WKRP exposes a potentially fatal flaw in the *reductive ambition* of buck-passing:
      *   If value *just is* the property of there being reasons for pro-attitudes towards X...
      *   ...then *any* reason to have that pro-attitude towards X (like the demon's threat or the bribe) would *make* X valuable.
      *   But intuitively, the demon isn't admirable because of the threat, and the mud isn't desirable because of the bribe. These reasons seem like the *"wrong kind"* of reason to ground genuine *value*.
      *   **The Challenge:** Buck-passing needs a principled way to distinguish "right-kind reasons" (which *do* ground value) from "wrong-kind reasons" (which don't), *without* already presupposing the value it's trying to analyze. This is the core technical puzzle. Kant's case doesn't pose *this specific problem* for a reductive analysis of value.

  4.  **Why it's a "Special New Puzzle":**
      *   **Novel Context:** WKRP arises specifically within the highly technical debate about the viability of *buck-passing* as a metaethical theory. Buck-passing gained prominence in the late 20th/early 21st century (building on Scanlon, Parfit, etc.), so the problem it faces is "new" relative to *that specific project*.
      *   **Focus on Attitudes:** It forces a sharp focus on the nature of *reasons for attitudes* (desire, admiration, etc.) versus reasons for *actions*, and how attitudes relate to value constitution. Kant was primarily concerned with reasons for *action* and the will.
      *   **The Threat of Collapse:** WKRP threatens to make buck-passing trivial or incoherent. If *any* reason to value X makes X valuable, then value becomes disconnected from the object's properties in an unacceptable way. Kant's case highlights a flaw in moral *motivation* or *praiseworthiness*, not a potential collapse of the *concept of value itself*.

  **Conclusion: Shared Insight, Distinct Problems**

  You are fundamentally correct: **The core insight that reasons can be normatively "alien" to the core normative feature in question (moral worth in Kant, value in WKRP) is shared.** Kant's shopkeeper brilliantly illustrates this for moral motivation. Philosophers working on WKRP *should* acknowledge this lineage.

  However, WKRP is treated as a distinct puzzle because:

  1.  It targets a specific, contemporary metaethical *theory* (buck-passing).
  2.  It uses extreme, counterfactual cases designed to probe the *reductive analysis of value*.
  3.  It focuses on reasons for *attitudes* (desire, admiration) rather than just reasons for *action*.
  4.  It poses a unique technical challenge: distinguishing "right-kind" from "wrong-kind" reasons *within the buck-passing framework* without circularity.

  Think of it this way: Kant exposed how the *source* of a reason (duty vs. inclination) affects the moral worth of an *action*. WKRP exposes how the *kind* of reason (connected to the object's properties vs. external inducement) affects whether that reason can *constitute the value* of an *object* or *state of affairs*. It's a descendant of Kant's insight, but refined and weaponized for a different battle in metaethics. Calling it "Kant's shopkeeper dressed up" is a fair *provocation* highlighting the shared insight, but misses the specific, technical threat it poses to buck-passing accounts.
