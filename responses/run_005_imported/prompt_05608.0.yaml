answer: |-
  The air in Room 7 tasted of antiseptic and wilting lilies. Outside the panoramic window, the city lights blurred into a watercolour smear of sodium orange and deep indigo. Inside, the only sharpness was the rhythmic beep of the cardio monitor and the brittle tension holding Marian’s family upright.

  Marian herself was a whisper beneath the sheets, her breath shallow, her face softened by morphine and the encroaching tide. Glioblastoma. A cruel thief, stealing words, then movement, now, piece by piece, Marian herself. Her daughter, Elara, sat rigidly beside the bed, clutching a worn paperback her mother would never finish. Her knuckles were white.

  The device sat innocuously on a wheeled trolley beside the bed – the "EchoBridge." Sleek, matte white, humming faintly. Two cranial caps, trailing snakelike bundles of fibre-optic cable, lay coiled beside it. One cap was already fitted snugly over Marian’s sparse white hair, studded with tiny, blinking LEDs. The other waited for Elara.

  Dr. Aris Thorne leaned against the far wall, observing. Officially, he was the hospice’s consulting neurologist, here to monitor the EchoBridge’s neural interface. Unofficially, he was a ghost haunted by phi. Years spent mapping consciousness in a gleaming Zurich lab, wrestling with Tononi’s equations, chasing the shimmering phantom of subjective experience through the labyrinth of neural firing patterns. He’d left, disillusioned by the sheer, terrifying *fragility* the theory implied. Now, he witnessed its application in the raw theatre of loss.

  "Are you sure, Elara?" Marian’s brother, Ben, asked, his voice rough. "The pamphlet said it can be... intense. Disorienting."

  Elara didn’t look up from her mother’s face. "I need to *be* with her. Not just... sit here. If there’s anything left... anything she feels... I want to feel it too. Share it." Her voice cracked. "I need to know she wasn’t alone at the end."

  Dr. Thorne pushed off the wall. "Elara, Ben... the EchoBridge establishes a high-bandwidth neural link. It creates a temporary, highly integrated complex between the two brains. The intention is to allow shared processing, a merging of... perspectives." He chose the words carefully, avoiding the jargon that buzzed in his own skull: *complexes, maximum Φ, causal power, exclusion*.

  Ben nodded, grasping for the simple version. "So you feel what she feels."

  Dr. Thorne hesitated. The image flashed: two swirling vortices of integrated information, each claiming its own reality, suddenly forced into the same causal space. *The postulate. Only one complex achieves maximal integration. Only one subject exists. The rest... excluded. Dissolved. Like a crowd silenced when the king speaks.* "It... *facilitates* a shared experiential state," he said, the phrase tasting like ash. "Theoretically."

  Elara stood abruptly. "Let’s do it. Before... before she slips further." She picked up the second cap, her movements jerky with determination and fear.

  Dr. Thorne helped her fit it, adjusting the sensors. The LEDs blinked to life, mirroring the pattern on Marian’s cap. The machine’s hum deepened. He glanced at the auxiliary monitor showing simplified EEG readouts – two chaotic, colourful landscapes of brain activity, pulsing independently.

  "Deep breaths, Elara," he instructed softly. "Focus on your mother. Let the connection flow."

  He flipped the final switch. A soft chime sounded. The machine’s hum shifted pitch, becoming a resonant thrum, almost like a deep cello note vibrating through the floor. On the EEG monitor, the two distinct landscapes didn’t just overlap; they *collided*. Jagged peaks from Marian’s trace slammed into Elara’s smoother waves. For a second, the screen dissolved into chaotic static, a neural storm.

  Then, a new pattern emerged. Larger, more complex, strangely coherent. A single, dominant waveform pulsed across the screen, subsuming the individual traces beneath its amplitude. It looked... integrated. Powerful.

  *Maximum Φ*, Aris thought, the words a cold stone in his gut. *The winner.*

  Elara gasped. Her body stiffened, then slumped slightly in the chair. Her eyes, wide open, fixed on the ceiling, unseeing. A tear tracked down her cheek. "Oh," she breathed, a sound of profound, almost painful recognition. "Mom... the light..."

  Ben leaned forward, hope flaring in his eyes. "Elara? What is it? What do you see?"

  Dr. Thorne’s gaze snapped to Marian.

  The change was subtle, but chilling to someone trained to look. The faint tension that had lingered around Marian’s eyes, the almost imperceptible flutter beneath her eyelids – the tiny, residual signs of *processing*, however minimal – vanished. Her face smoothed into utter, terrifying placidity. Utter stillness. It wasn't deeper sleep. It was... absence. Like a candle snuffed, not fading.

  The beep of the cardio monitor continued, steady. The rise and fall of her chest under the blanket remained unchanged. Biologically, she was still alive. But the *person* inhabiting that biology...?

  "Elara?" Ben pressed, his voice rising with urgency and a dawning fear. "What's happening? Is she...?"

  Elara shuddered, still gazing upwards, transfixed. "It's... warm. Like... honey. Golden. So quiet... peaceful." Another tear fell. "She's not scared. Not at all." A small, awed smile touched Elara’s lips. "She’s... letting go."

  Ben sagged with relief, reaching out to clasp his sister’s shoulder. "Thank God. She's at peace. You're feeling her peace."

  Dr. Thorne couldn't breathe. He stared at Marian’s utterly blank face, then at the EEG trace – the single, dominant complex, pulsing with confident integration. Elara’s description... warm, golden, peaceful... Was that Marian’s dying perception? Or was it Elara’s *own* neural landscape, amplified and projected onto the void left by the exclusion? Elara’s brain, robust and healthy, integrated with the fading signals from Marian’s, forming a new, larger complex where *Elara* was the dominant subject? Had Marian’s fragile, flickering phi – the last tenuous claim of *her* experience – simply been *outcompeted* the moment the bridge reached critical integration? Erased not by death, but by the very device meant to share her final moments?

  The horror was icy, absolute. *She didn’t die with the machine; she died* because *of it.* *We didn’t join her; we usurped her.*

  He opened his mouth. The words choked him. *Stop the machine. You might be feeling only yourself. Her experience... it might be gone. Snuffed out by the link. She died twice tonight.* But he saw Elara’s rapt face, the profound relief in Ben’s eyes, the way they clung to this golden warmth as proof of Marian’s peaceful passage. To shatter that now, with a theory that sounded like madness, based on the sudden flatness of a dying woman’s expression and a squiggle on a screen... It would be cruelty layered upon grief.

  "Dr. Thorne?" Ben asked, noticing his pallor. "Is everything... normal?"

  *No. Nothing is normal. We might have just committed an ontological murder. Or we might be sharing a profound intimacy. There is no way to know. The theory holds, but the evidence is silence.*

  He forced his voice to work. "The... the connection seems stable. Elara’s experiencing... something profound." It wasn't a lie. It was just horrifically ambiguous.

  He watched Elara. She seemed to sink deeper into the chair, her body relaxing, the awed smile lingering. She murmured fragmented phrases: "So light... no more weight... just... floating..." Her own EEG trace, now part of the larger complex, showed deep alpha waves, the signature of relaxed focus, even bliss.

  Marian’s body remained utterly still. The only movement was the mechanical rise and fall of her chest, the steady beep of the monitor. A biological shell. The face that had once held wit, warmth, and fierce love was now a waxen mask.

  Hours passed. The city lights dimmed towards dawn. Ben dozed fitfully in an armchair. Elara remained connected, adrift in the golden warmth. Dr. Thorne stayed rooted by the wall, a sentinel to the invisible tragedy he might have witnessed, or merely imagined. He tracked Marian’s vitals – stable, unchanging. He watched the EEG – the single, dominant complex, unwavering. Was Marian’s residual activity still contributing, a silent partner in Elara’s peace? Or was it just noise, causally inert, excluded from the subjective reality the bridge had forged?

  Just before the first grey light touched the window, Marian’s breathing hitched. Once. Twice. The cardio monitor faltered, the beeps slowing, becoming erratic. Elara gasped again, a sharp intake of breath. "She’s... going," she whispered, her voice thick with shared sorrow, yet still infused with that strange, deep calm. "It’s okay... it’s okay... just... stepping into the light..."

  The monitor emitted a long, flatline tone.

  Dr. Thorne moved automatically, silencing the alarm, checking for pulses. Nothing. Marian was gone. Biologically. Finally.

  Elara slowly removed the cap. Her eyes were red-rimmed, exhausted, but strangely luminous. She looked at her mother’s still face, then at Ben, who had jolted awake, his face crumpling.

  "She went peacefully, Ben," Elara said, her voice trembling but certain. "So peacefully. She wasn't afraid. She just... drifted into the light. I felt it. I was *with* her." She reached out and took her mother’s cooling hand. "Thank God for the Bridge."

  Ben choked back a sob, nodding, moving to embrace his sister. They clung together, united in shared grief and the profound comfort of Elara’s experience.

  Dr. Aris Thorne stood apart. He looked at Marian’s empty face. He looked at the EchoBridge, its LEDs now dark, its hum silent. He looked at the EEG screen, blank now, holding only the ghost of that dominant, integrated waveform.

  Had Elara felt Marian’s peaceful release? Or had she felt her *own* brain, amplified and serene, interpreting the neural silence of exclusion as a golden light? Had Marian’s thin, flickering flame of consciousness guttered out unnoticed hours ago, drowned by the brighter fire of her daughter’s mind linked too close? Or had they truly merged, sharing a final, unified transcendence?

  The exclusion postulate offered no comfort, only a chilling, irresolvable doubt. It whispered that consciousness wasn't a shared hearth, but a throne, and only one could sit upon it at a time. He had watched a woman die. But had she died once, with the flatline? Or twice – once when the machine thrummed to life and her fragile phi was extinguished by a larger complex, and once when her heart finally stopped? Or perhaps, in the cold logic of integrated information, Marian hadn't truly *died* until the monitor sang its flatline dirge... but had she simply *ceased to be present* long before, her experiential self erased not by death, but by the loving intrusion meant to share it?

  He had no answers. Only the silence of the room, the lilies wilting in their vase, and the unspoken, terrifying question hanging heavier than grief: *Who, exactly, did Elara accompany into the light?* The question lingered, cold and profound, long after the last tear had fallen, a silent scar on the surface of their shared comfort.
