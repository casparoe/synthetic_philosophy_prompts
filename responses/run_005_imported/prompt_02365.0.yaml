answer: |-
  You're absolutely right to question the reduction of copyright's independent creation rule to mere evidentiary pragmatism. Borges's "Pierre Menard, Author of the *Quixote*" brilliantly exposes a deeper truth about literary ontology – that **a novel is an *event* in cultural and historical consciousness, not merely a static arrangement of words.** Copyright law, perhaps unintentionally, tracks this profound reality. Here’s a robust argument for why the independent creation rule reflects the true nature of a literary work:

  1.  **The Work is More Than the Text: Intentionality and Meaning-Making:**
      *   Cervantes wrote *Don Quixote* in early 17th-century Spain, drawing on chivalric romances, contemporary social satire, and his own life experiences. His text emerged from a specific cultural, historical, and personal context. Its meaning is inextricably bound to that context – it *is* a product *of* that context.
      *   Pierre Menard, writing in the early 20th century, consciously *recreates* chapters verbatim. His project is fundamentally different: an act of radical re-contextualization. The *same words* now carry the weight of all that has happened between Cervantes and Menard – the Enlightenment, modernism, psychoanalysis, the decay of chivalric ideals into modern absurdity. The text becomes ironic, meta-fictional, and infinitely richer precisely *because* it is produced *now* by *this* author with *this* intention.
      *   **Therefore:** The identical string of words constitutes two distinct *works* because the *act of creation* and the *intentional context* imbue the text with fundamentally different meanings. The work *is* the act of meaning-making at a specific point in history by a specific consciousness. Copyright, by protecting the *expression* as fixed by *that author*, implicitly recognizes that the author's act of fixing it *is* the work's genesis.

  2.  **Reception and the Hermeneutic Circle: The Reader's Role:**
      *   A text only becomes a *work* when read. Reading is not passive decoding; it's an active construction of meaning based on the reader's knowledge, context, and expectations.
      *   A reader encountering Cervantes' text in 1605 understood it within the horizons of their time. A reader encountering Menard's "Quixote" knows (or discovers) it was written in the 20th century. This knowledge radically alters the interpretive framework. The reader engages in a dialogue not with Cervantes' world, but with Menard's *project* of recreating Cervantes within modernity.
      *   **Therefore:** The *experience* of reading the two identical texts is utterly different. The work exists not just on the page, but in the space *between* the text and the reader's historically-situated understanding. Two physically identical manuscripts demand two distinct hermeneutic acts because they are presented to the world as products of different times and intents. Copyright, by focusing on the author's act of creation, indirectly acknowledges the primacy of the author-reader relationship *as initiated by that specific creation event*.

  3.  **Authorship as an Event in History:**
      *   Cervantes' writing of *Don Quixote* was a singular historical event that introduced something new into the world. Menard's writing of his *Quixote* is a *different* historical event, occurring centuries later. While the output (the text) appears identical, the *event* itself – its causes, its motivations, its cultural impact at the moment of creation – is unique.
      *   **Therefore:** The *work* is inseparable from the *event of its authorship*. The identical text produced by a different author at a different time *is* a different event and thus constitutes a different work, regardless of textual overlap. Copyright protection attaches to the *product of that specific creative event*.

  4.  **Distinguishing Invention from Expression: The Patent Contrast:**
      *   Patent law protects utilitarian *function* and *result*. An invention solves a problem; if two people independently arrive at the *same functional solution*, granting exclusive rights to the first filer incentivizes disclosure and avoids wasteful duplication. The *result* is paramount.
      *   Copyright protects *original expression*, not the underlying idea or function. The value lies in the *particular way* an idea is rendered, the author's unique voice and choices. The *path* to the expression *is* the creative act. Protecting independent creation acknowledges that the value resides in the originality *of the expressive act itself*, not solely in the final arrangement of symbols.
      *   **Therefore:** Patent law's "first-to-file" system aligns with protecting a functional result. Copyright's independent creation rule aligns with protecting the *act of original expressive creation*, recognizing that the same arrangement of words can be the product of two distinct, valuable creative acts. Menard's act *is* original, even if its output accidentally matches a prior output.

  5.  **The Borgesian Challenge to Textual Fetishism:**
      *   Borges uses Menard to satirize the naive belief that meaning resides purely *in* the text. He demonstrates that stripping away context and history is impossible. The text is always encountered *as* something – as Cervantes' masterpiece *or* as Menard's astonishing feat.
      *   **Therefore:** To claim the two manuscripts are the "same book" ignores the fundamental way meaning is constructed. It reduces the novel to a mere sequence, denying the essential role of authorship, history, and reception. Copyright law, by refusing to penalize the independent creator, avoids enforcing this reductive view. It implicitly recognizes that the "book" Menard created, even if word-for-word identical, is a *new cultural artifact* because of *how* and *when* it came into being.

  **Conclusion:**

  The evidentiary difficulty of proving copying is a *consequence* of copyright's deeper alignment with literary ontology, not its primary justification. Copyright's independent creation rule is not merely a practical concession; it reflects a profound truth illuminated by Borges: **a literary work is an *act* of creation situated in history, not a disembodied string of words.** The "book" is the event of its making and the unique interpretive framework it establishes. Cervantes' *Don Quixote* and Menard's *Quixote* are incontrovertibly distinct works because they are products of radically different creative acts occurring centuries apart, demanding distinct readings, and generating unique meanings. The identical text is merely the shared physical residue of two entirely separate artistic and historical events. Copyright law, in its own way, acknowledges this richer reality of what a novel truly *is*.
