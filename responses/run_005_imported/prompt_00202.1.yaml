prompt: |-
  I was watching a documentary on split-brain patients (the corpus callosotomy cases) and it kind of blew my mind. From what I understand, once you cut the corpus callosum, you basically end up with two separate people living in one skull who just happen to share a body, and they were secretly two people all along, we just couldn't tell because the corpus callosum kept "gluing" them into one consciousness. So doesn't this mean literally everyone actually has two independent conscious minds under the hood, and unified consciousness is just an illusion created by the two hemispheres constantly cross-talking? If that's true, why do neuroscientists and philosophers still argue about whether split-brain patients "really" have two minds, isn't the answer just obviously yes at this point? I guess what I'm confused about is why this isn't treated as a completely settled question given how dramatic the lab experiments (like the separate hand-drawing tasks) seem to be.
