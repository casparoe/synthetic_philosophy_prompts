  The user's deeper need is likely confidence in the legal argument. They want to understand if the expert's claim holds water. Confirming that interventionist theory is legitimate and widely used can alleviate their doubts. Explaining how it improves on older models by addressing their limitations (like clarity on interventions vs. simple counterfactuals) adds value.

