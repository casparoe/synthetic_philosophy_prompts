  ### Defense Notes for Office Hours
  - **EPR/Factorizability**: Student’s definitions are textbook-perfect; no points deducted.  
  - **CHSH**: Aspect *advanced* loophole closure but wasn’t definitive; deducting 1 point is standard for overclaiming.  
  - **Stochastic HV**: Student *almost* implies indeterminism saves locality (a common misconception), but self-corrects in the final sentence. 4/5 balances their insight with the need for precision.  
