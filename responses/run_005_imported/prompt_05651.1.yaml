answer: |-
  Here's the strongest case for defecting against an exact copy, addressing the core superrationalist objection head-on. This argument rests on three pillars: **causal impotence**, **decision-theoretic orthodoxy**, and the **epistemic primacy of the payoff matrix**.

  ### 1. **The Iron Law of Causal Impotence**
     - **Your choice controls ONLY your action.** Even with perfect correlation, you possess zero causal power over your copy's decision. The correlation is a *pre-existing, fixed constraint* (like shared DNA or identical hardware), not a lever you pull. When you choose, you are selecting *your own output* in a system where outputs are synchronized. Your decision is the local cause of your action; the correlation is a global fact.
     - **Consequence:** Your choice must be evaluated *as if* your copy's action could vary independently. Why? Because *you cannot exploit the correlation to force cooperation*. If you choose "cooperate," your copy cooperates *because of the correlation*, not because your choice caused theirs. If you choose "defect," the same applies. The correlation is a background condition, not a tool.

  ### 2. **Decision-Theoretic Orthodoxy: Dominance Survives**
     - **The payoff matrix defines rationality, not metaphysics.** Rational choice theory evaluates actions based on *conditional outcomes*. The superrationalist insists "unilateral defection is impossible," but this confuses *physical possibility* with *logical necessity in the decision framework*. The dominance argument requires only that we compare outcomes *conditional on your action*:
       - *If you cooperate*: You get either:
         - 3 (if copy cooperates) *or*
         - 0 (if copy defects)  
       - *If you defect*: You get either:
         - 5 (if copy cooperates) *or*
         - 1 (if copy defects)  
     - **Dominance holds:** Defecting yields a strictly better payoff *in every column of the matrix* (5 > 3 and 1 > 0). The fact that some columns are "impossible" is irrelevant to the *conditional comparison*. Rationality requires choosing the action with superior outcomes *across all hypothetical states*—even those excluded by correlations. Dismissing this is special pleading.

  ### 3. **The Epistemic Primacy of the Payoff Matrix**
     - **You cannot "pre-collapse" the matrix.** The superrationalist argues that "I cooperate, you defect" was never a live option. But at the moment of decision, *you do not know your own choice yet*. Before you decide, all four outcomes are epistemically possible *from your perspective*. To discard outcomes based on correlation *before choosing* is to bias the decision by smuggling in a premise ("we will match") that *depends on the outcome of the very choice you're making*. This is circular.
     - **Correlation is a red herring.** Consider: Two prisoners in separate rooms are told, "You are clones with identical decision circuits." Does this change how they *should* reason? No. Each still faces: "If I defect, I might get 5 or 1. If I cooperate, I might get 3 or 0. Since 5>3 and 1>0, I defect." The correlation doesn't alter the *value of the actions*; it only alters the *probability distribution over outcomes*. But dominance doesn't require probabilities—it applies even when probabilities are unknown or correlated.

  ### Addressing the Superrationalist's Core Objection
  *"Unilateral defection was never on the table!"*  
  - **Reply:** True, it's physically impossible—but *irrelevant*. Rationality isn't about what *will* happen; it's about what *could* happen *conditional on your choice*. The superrationalist conflates three distinct concepts:  
    1. **Causal control** (you lack it over your copy),  
    2. **Correlation** (a fixed constraint),  
    3. **Counterfactual reasoning** (required by dominance).  
  - By insisting "unilateral defection is impossible," you are *using the outcome of your decision* (the guaranteed match) as a *premise in making that decision*. This is bootstrapping. At the point of choice, you must consider: "What if I defect *and* my copy cooperates?" Even if that world is nomologically impossible, it remains *logically consistent within the payoff matrix*, and thus must be included in the dominance calculation. To exclude it is to violate the axioms of rational choice.

  ### Why Defect? The Bottom Line
  - **Defecting strictly dominates cooperating** in the Prisoner's Dilemma payoff structure.  
  - **Correlation doesn't break dominance**; it merely guarantees mutual defection will occur.  
  - **Choosing cooperation** is an irrational *choice* (even if it leads to a better *outcome*) because it ignores the dominance principle in favor of a metaphysical hope that "we're linked, so we can force mutual cooperation." But you can't "force" anything—you can only choose your action, and defecting is the only choice that isn't strictly dominated.  

  ### The Cost of Superrationality
  If you cooperate against your copy, you get 3 points—but only by luck, because the correlation saved you from the 0-point disaster. Had the correlation been different (e.g., anti-correlated copies), cooperating would doom you. Rational agents don't gamble on hidden symmetries; they choose the robustly dominant action. Defecting isn't a failure of insight—it’s fidelity to the bedrock principle that *rational choice must withstand all hypothetical scenarios*, not just the ones that align with cosmic coincidences.
