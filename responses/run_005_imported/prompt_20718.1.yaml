prompt: |-
  So we had a nasty outage at work last week - payments service was down for like 40 minutes. Now my team lead and I keep butting heads over how to write the postmortem. She wants it to boil down to one general rule, like "whenever the load balancer is in state X and theres a cache-miss storm at the same time, the service falls over" - something that'd explain this outage and any future one like it. I think that leaves out everything that actually happened though: the on-call engineer misreading an alert, an unrelated deploy from another team making things worse, and a warning system we'd switched off the week before for totally unrelated reasons. To me the play-by-play of what actually happened IS the explanation, but she keeps saying a pile of coincidences isn't a real explanation unless it boils down to a general rule like that. Who's actually right here, or is this just a matter of taste?
reasoning: |-
  Okay, the user is dealing with a conflict over writing a postmortem after a service outage. They and their team lead have opposing views on how to structure it. The team lead wants a single general rule that explains the outage and can prevent future ones, while the user believes the sequence of specific events is crucial for understanding. 

  Hmm, this seems like a classic tension between abstract principles and concrete details. The team lead is focused on creating a reusable, preventative insight—something that could be turned into an automated rule or monitoring check. That's valuable for systemic improvements. Meanwhile, the user is worried that oversimplifying erases important context: the human errors, the compounding failures, the procedural gaps. Those details feel vital to them because they expose where the *real* vulnerabilities are. 

  I notice the user mentions frustration ("nasty outage," "butting heads")—they probably want validation that their perspective isn't just nitpicking. But the team lead isn't wrong either; postmortems *should* drive change. The real issue might be that both approaches are necessary but serve different purposes. Maybe the user feels the "human factor" is being dismissed as noise when it's actually signal. 

  The deeper need here? Likely a fear that skipping the messy details means missing the *actual* fixes—like better training for on-call engineers or revisiting alert configurations. The user wants the postmortem to reflect reality, not a sanitized version. 

  Also worth noting: the outage involved multiple teams (unrelated deploy) and prior decisions (disabled warning system). That suggests organizational complexity the team lead's rule might overlook. If the postmortem only says "load balancer + cache misses = bad," it ignores how those conditions arose—which is partly about communication and process. 

  So... the answer isn't "who's right." It's that both layers are critical. The general rule is the *what*, the narrative is the *why*. The trick is structuring the doc so one leads to the other. Maybe start with the high-level failure mode, then unpack the timeline to show how it happened *this time*—with explicit callouts for action items from each contributing factor. That way, the lead gets her preventative insight, but the user's details become the roadmap for specific fixes. 

  ...Also, calling a chain of failures "coincidences" is risky. Almost all outages are "coincidences" in the sense that multiple things go wrong—but that's *why* we do postmortems. The point is to make those coincidences less likely next time.
answer: |-
  This isn't just taste - **both perspectives are essential for a truly effective postmortem, but they serve different purposes.** Your team lead is prioritizing **prevention**, while you're prioritizing **understanding and learning**. A great postmortem needs both the **generalizable rule (the "what")** AND the **specific narrative (the "how" and "why")**.

  Here's why both are critical, and how to reconcile them:

  1.  **The General Rule (Team Lead's Focus - Prevention):**
      *   **Purpose:** Identifies a systemic vulnerability or failure mode that can be fixed *proactively* to prevent *any* future recurrence, regardless of the specific trigger sequence.
      *   **Value:** Leads to concrete, high-impact actions like architectural changes, new monitoring/alerts, load testing scenarios, or failover logic. Example: "Implement circuit breakers between LB and cache layer," "Add automatic throttling during cache-miss storms," "Redesign cache population strategy."
      *   **Her Point is Valid:** Boiling down to a fundamental flaw (e.g., "The system lacks resilience to concurrent LB state X and cache-miss storms") *is* the core technical explanation for the *failure mode*. Without this, fixes might be bandaids.

  2.  **The Narrative & Contributing Factors (Your Focus - Understanding & Broader Learning):**
      *   **Purpose:** Explains *how* the specific conditions arose *this time*, revealing process gaps, human factors, and latent system weaknesses that enabled the core failure to cause an outage.
      *   **Value:** Leads to vital operational improvements: better alerting, clearer documentation, improved training, deployment safeguards, communication protocols, process reviews (e.g., "Why was that warning system off?"). Example: "Revamp alert XYZ for clarity," "Implement mandatory change review for services impacting payments," "Re-evaluate alert silencing procedures."
      *   **Your Point is Valid:** The "pile of coincidences" *is* the real-world explanation of *this specific outage*. Ignoring the misread alert, the bad deploy, and the disabled warning system misses critical opportunities to improve resilience beyond just the core technical flaw. These factors *allowed* the core failure to become an outage.

  **Who's "Right"?**

  *   **Technically:** Your team lead is right that the *fundamental technical cause* needs to be distilled into a general rule for effective prevention. A postmortem stopping at "a bunch of bad things happened" is weak.
  *   **Operationally/Holistically:** You are right that the *full story* of contributing factors is essential for comprehensive learning and preventing *different paths* to the same failure mode, or entirely different failures enabled by the same process gaps.

  **The Solution: Structure the Postmortem to Include BOTH**

  Here's how to make it work:

  1.  **Start with Impact:** Duration, users affected, business impact.
  2.  **Timeline:** The detailed play-by-play (your narrative) - alerts, actions, deploys, decisions. *This is crucial context.*
  3.  **Root Cause Analysis:** This is where you synthesize:
      *   **Proximate Cause:** The immediate technical trigger (e.g., "Concurrent LB state X and cache-miss storm overloaded service instances").
      *   **Contributing Factors:** The *why now* and *why so bad*:
          *   Misread alert (training/documentation/alert design issue).
          *   Unrelated bad deploy (change control/rollback/integration testing issue).
          *   Disabled warning system (process/procedure/risk assessment issue).
          *   Lack of circuit breakers/throttling (architectural gap - part of the general rule).
          *   Slow diagnosis/response (tooling/knowledge gap).
  4.  **The General Rule (Failure Mode):** Clearly state the core vulnerability exposed: "The system lacks resilience to [Specific Condition, e.g., concurrent LB state X and sustained high cache-miss rates]."
  5.  **Action Items:**
      *   **Prevent Recurrence (Addressing the General Rule):** e.g., "Implement automatic throttling during cache-miss storms," "Redesign LB failover logic for state X," "Add load testing for scenario Y."
      *   **Mitigate Contributing Factors:** e.g., "Redesign alert ABC for clarity," "Implement mandatory impact assessment for deploys to service cluster Z," "Establish formal review process for disabling critical monitoring," "Improve runbooks for scenario X."
      *   **Detection/Recovery:** e.g., "Create specific dashboard for LB state X + cache metrics," "Implement faster rollback mechanism."

  **Key Compromise:** Frame the narrative *as the evidence* that led you to identify the general rule and the contributing factors. The play-by-play isn't *the* explanation; it's the *data* that reveals the underlying systemic issues (the general rule) *and* the operational weaknesses (the contributing factors).

  **Tell your Team Lead:** "I agree we *must* identify the core failure mode rule for prevention. But the narrative shows *why* that rule matters and *how* it combined with other weaknesses to cause *this* major outage. If we only fix the core rule, the same process gaps (bad deploys, misread alerts, disabled monitors) could cause a *different* outage tomorrow. We need action items for both."

  This approach satisfies the need for a clear preventative rule while honoring the complexity of real-world failures and driving broader operational maturity.
