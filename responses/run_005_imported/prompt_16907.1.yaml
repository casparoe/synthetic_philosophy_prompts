  I spent about thirty years doing experimental physics before I retired, and lately I've fallen down the philosophy-of-physics rabbit hole, currently stuck on Bell's theorem. I keep running into this business -- due to Jarrett, I think, with the now-standard names given by Shimony -- where Bell's factorizability condition isn't really one locality assumption but two seperate ones glued together: parameter independence and outcome independence. From what I can tell, actual quantum correlations happily satisfy the first (so no signalling) while flatly violating the second. Could you compare the two for me: what each one actually asserts, and why nature apparently respects one but not the other? And then tell me straight: does that split mean quantum nonlocality is somehow "tamer" than people make it out to be, or is an outcome-independence failure just as much a threat to relativistic locality as a parameter-independence failure would've been?
