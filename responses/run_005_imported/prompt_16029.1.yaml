answer: |-
  You've raised an excellent point about the historical prevalence of theism, but Schellenberg's argument is more nuanced than a simple statistical observation. Philosophers take it seriously because it targets a specific theological tension within **classical theism** (e.g., an omnipotent, omniscient, perfectly loving God). Here's why the argument remains potent despite widespread historical belief:

  ### 1. **The Core Argument Focuses on "Non-Resistant Non-Belief"**
     Schellenberg distinguishes between:
     - **Resistant non-belief**: Disbelief arising from willful rejection, emotional aversion, or intellectual dishonesty.
     - **Non-resistant non-belief**: Sincere, capable seekers who *want* to believe but find no compelling evidence or experience of God (e.g., honest agnostics).
     
     The argument contends that a perfectly loving God would ensure *no non-resistant non-belief exists*, as such a God desires a meaningful relationship with all capable persons. Even if non-resistant non-believers are a minority, their mere existence is seen as logically incompatible with a loving God.

  ### 2. **Modern Context Amplifies the Problem**
     While theism was historically dominant, **contemporary secular societies** (e.g., Scandinavia, Japan, increasingly urbanized populations) show significant rates of non-belief. In these contexts, non-resistant non-belief isn’t rare—it’s a widespread cultural norm. Schellenberg argues this shift reflects God’s hiddenness in an era when communication should be easiest for an all-powerful being.

  ### 3. **The Quality of Belief Matters**
     Schellenberg notes that widespread "belief" in history often meant:
     - Cultural conformity or superficial assent (e.g., nominal adherence without deep relationship).
     - Belief in deities that don’t match classical theism (e.g., distant gods, amoral spirits, or polytheistic beings).
     
     A perfectly loving God, he argues, would seek **explicit, reciprocal relationship**—not vague cultural theism. Thus, the absence of *robust, conscious communion with a personal God* remains problematic.

  ### 4. **The Argument Challenges Theistic Explanations**
     Theists often explain hiddenness via:
     - **Epistemic distance**: God hides to preserve human freedom or moral growth.
     - **Soul-making**: Uncertainty builds virtue (e.g., faith, humility).
     - **Divine punishment**: Hiddenness results from human sin.
     
     Schellenberg counters that non-resistant seekers *already* desire relationship, so these excuses don’t apply. A loving parent doesn’t hide from a child genuinely seeking comfort.

  ### 5. **Philosophical Impact: A Logical Contradiction?**
     The argument posits a deductive contradiction:
     - **P1**: A perfectly loving God would ensure all capable persons can participate in a conscious relationship with Him.
     - **P2**: Non-resistant non-belief prevents such participation.
     - **Conclusion**: Therefore, a perfectly loving God cannot exist if non-resistant non-belief exists.  
     
     Even rare cases of non-resistant non-belief challenge P1, making it a *logical* problem, not just a statistical one.

  ### Why Philosophers Engage Seriously
  - **Targets specific theism**: It pressures concepts of God as *personally relational* (e.g., Christianity, Islam) more than deism or impersonal ultimate realities.
  - **Unaddressed by traditional theodicies**: Unlike the problem of evil, hiddenness isn’t resolved by appeals to free will or greater goods.
  - **Empirical relevance**: Rising secularism gives the argument contemporary traction.
  - **Theological refinement**: It forces theists to develop nuanced accounts of divine-human interaction (e.g., "sensus divinitatis" in Reformed epistemology).

  ### In Short
  Schellenberg’s argument isn’t undermined by historical theism because it focuses on the **absence of universally accessible, meaningful divine relationship**—not just nominal belief. If non-resistant non-believers exist (even as a minority), and God desires all to know Him, their existence becomes a profound anomaly. This makes it a persistent challenge, especially in modern philosophical theology.

  *Recommended reading: Schellenberg's "Divine Hiddenness and Human Reason" (1993) and Ted Drange’s "Nonbelief & Evil" (1998) for counter-responses.*
