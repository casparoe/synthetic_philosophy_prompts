answer: |-
  Based on **G.E.M. Anscombe's "Mr. Truman's Degree"** and her broader ethical framework (deeply rooted in Catholic natural law and Thomistic philosophy), your instinct was correct: **your friend fundamentally misrepresents Anscombe's argument.** Recalculating casualty figures in Truman's favor **would not undermine her core objection** because her critique is **absolutist and deontological**, **not consequentialist**. Here's a breakdown:

  1.  **The Core of Anscombe's Argument: Intention and the Absolute Prohibition**
      *   Anscombe vehemently opposed the intentional killing of innocent civilians as a *means* to any end, regardless of the consequences. This is an **absolute moral prohibition** derived from natural law.
      *   Her argument hinges **entirely** on the **Double Effect Doctrine** (DDE), which she applied rigorously. For an act with both good and bad effects to be permissible:
          *   **The act itself must be good or neutral.**
          *   **The agent must intend only the good effect, not the bad effect.**
          *   **The bad effect must not be the means to achieve the good effect.**
          *   **There must be a proportionately grave reason for permitting the bad effect.**
      *   **Her Indictment of Truman:** Anscombe argued that the atomic bombings **intentionally targeted civilian populations** (innocents) *as a means* to terrorize the Japanese government into surrender. The deaths weren't a regrettable but unintended side effect of attacking a military target; *the destruction of the cities and their inhabitants was the chosen instrument of coercion.*
      *   **Key Quote:** "For men to choose to kill the innocent as a means to their ends is always murder... Murder is the deliberate killing of the innocent, whether for its own sake or as a means to some further end." (Anscombe, *Mr. Truman's Degree*).

  2.  **Why the "Arithmetic" Misreads Anscombe:**
      *   **Consequentialism vs. Absolutism:** Your friend interprets Anscombe through a consequentialist lens (weighing lives saved vs. lives lost). Anscombe **explicitly rejected consequentialism.** For her, the *kind of act* performed (intentionally killing innocents) rendered it intrinsically evil, making a consequentialist cost-benefit analysis morally irrelevant to its justification.
      *   **"Merely Foreseen" vs. "Intended":** Your recollection is spot-on. The critical distinction for Anscombe was whether the deaths were *intended* (as they were in Hiroshima/Nagasaki, as the mechanism of coercion) or *merely foreseen* (e.g., civilians dying unavoidably near a legitimate military target). Only the latter *might* be permissible under DDE if proportionality held. The bombings failed this test because the deaths were intended.
      *   **The Proportionality Caveat is Secondary:** While proportionality (condition 4 of DDE) is a factor, it only comes into play *after* the first three conditions are met. **Anscombe argued the bombings failed at the *intention* stage (condition 2 & 3).** Therefore, *no* calculation of lives potentially saved by the bombings versus an invasion could ever justify the act *because the act itself was murder*.
      *   **Her View on the Invasion Justification:** Anscombe specifically addressed the argument that the bombings saved lives by averting an invasion. She argued:
          *   The predicted high casualties of an invasion were speculative.
          *   Even if true, it doesn't justify choosing an intrinsically evil means (murdering innocents) to achieve a good end (ending the war/saving lives).
          *   Using the bombings to *avoid* the moral burden of a bloody invasion was itself an evasion of responsibility. Leaders had a duty to pursue legitimate means, even if costly.

  3.  **Would Recalculated Casualty Figures Undermine Anscombe?**
      *   **No. Absolutely not.** Here's why:
          *   **The Core Violation Remains:** Even if historians definitively proved that the bombings saved *millions* more lives than any alternative, Anscombe's argument stands. **She condemned the *act itself* – the intentional killing of innocents as a means – as murder, full stop.** No amount of "good" consequences washes away the intrinsic evil of the chosen means.
          *   **Proportionality is Moot:** Since the act fails the intention criteria of DDE, proportionality becomes irrelevant. You don't get to weigh the numbers *because the act is forbidden categorically*. It's like arguing that robbing a bank to fund a hospital is justified if the hospital saves enough lives – the initial act of robbery is still wrong.
          *   **Her Target Was the Principle, Not Just the Scale:** While the scale of the destruction horrified her, her *moral* argument was about the *type* of action authorized. She would have condemned the intentional targeting of a smaller number of innocents for the same purpose on the same principle. Hiroshima was an egregious *example* of a forbidden act, not the *only* possible instance of it.

  **Conclusion:**

  Your friend reduces Anscombe's profound ethical argument to simple body-count consequentialism, which she explicitly and forcefully rejected. **Anscombe's objection to Truman was fundamentally that he authorized the *intentional mass murder of innocent civilians* as a deliberate tactic of war.** This act, for her, was intrinsically evil and absolutely prohibited by natural law, irrespective of its consequences. Therefore, **recalculating casualty figures to show the bombings "saved lives" compared to an invasion does nothing to address, let alone refute, Anscombe's core deontological argument.** Her outrage was rooted in the violation of a moral absolute concerning intention and the prohibition against directly targeting the innocent, not in a utilitarian calculation gone awry. You were right to push back.
