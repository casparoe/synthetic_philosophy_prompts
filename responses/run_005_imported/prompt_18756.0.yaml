  Breaking down the response: Start with Dummett's immigration stance. His position wasn't open borders but allowed limits for social cohesion. He criticized racist arguments masking as practical concerns. Applying this to modern issues like Brexit, he'd likely challenge the rhetoric around sovereignty, pointing out xenophobia. For small boats, he'd emphasize safe routes and condemn policies leading to drownings. Windrush would anger him as a betrayal of belonging.

