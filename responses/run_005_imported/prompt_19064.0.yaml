prompt: |-
  Our department's speaker series has a guest coming next week who defends semicompatibilism -- she wants to use Frankfurt cases to junk the principle of alternative possibilities entirely, but still ground responsibility in what she calls "guidance control" rather than the regulative kind. I'm chairing the Q&A and dont want the whole hour to just be her re-narrating the Black-and-Jones setup. Can you draft 8-10 questions that actually press on the dialectic? At minimum I want one on the dilemma defense (the worry that under indeterminism the counterfactual intervener can't know in advance what the agent's going to do, so the case either smuggles in determinism or Jones keeps some alternative possibility after all), one on whether "flickers of freedom" are robust enough to actually ground responsibility or if that's just a face-saving retreat, and one that forces her to cash out the guidance/regulative control distinction instead of just repeating the labels. For each question, give me a quick follow-up keyed to whatever answer she's most likely to give -- I don't want to get caught flat-footed if she just says "that's a different sense of could have done otherwise."
