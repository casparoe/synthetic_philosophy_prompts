prompt: |-
  So I run a pretty small podcast on the side (like 300 downloads on a good week) where I talk to people about decision theory and game theory stuff, mostly aimed at other engineers who enjoy this kind of rabbit hole. I got properly obsessed with the centipede game a few months back after a coworker brought it up during an argument about whether to give a downstream team an exact sunset date for an API we were deprecating -- someone said "this is literally the centipede game" and then wouldnt explain what they meant, so I spent a weekend reading about it instead of doing my actual job.

  Next episode's guest is a game theorist who's kind of Extremely Online for defending the hardcore backward-induction answer: that two fully rational players should defect on the very first move, torching all the mutual gains from passing back and forth, because that's what subgame perfection plus common knowledge of rationality supposedly forces (very Aumann-coded argument, if that means anything to you). Pretty much everyone's first reaction is "that's insane, no way that's what rationality actually requires," and her go-to move whenever someone says that is to answer "you're describing a fact about human psychology, that's not a counterexample to the theory" and move on to the next question. I don't want the whole episode to just be her repeating that line.

  Can you draft me like 8-10 interview questions for her? I want at least one that really presses on that "gut reaction" deflection so she can't just wave it away with the psychology-vs-normativity split again, one that gets her to actually spell out how common knowledge of rationality is supposed to generate the unraveling all the way back to move one, and at least one on that weirder meta-level puzzle I keep half-getting, where the whole backward-induction argument seems to require reasoning about what a rational player would do at a later node that, by the theory's own logic, should never get reached if everyone really is rational -- I think this is what people call the "paradox of backward induction," and apparently there's a real fight in the literature (Aumann vs. Binmore-adjacent folks) over whether that's fatal to the argument or a total non-issue. Also throw in something about the actual experiments, where people mostly don't defect on move one and cooperate for a few rounds first, and whether that data should count as evidence against her normative claim or is just beside the point. For each question, add a quick follow-up keyed to whatever answer she's most likely give, and end with the single hardest question you've got -- something that pins down what, if anything, would actually count as evidence against her view.
