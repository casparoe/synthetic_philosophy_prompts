  First, recall the standard information cascade model (e.g., Bikhchandani, Hirshleifer, and Welch, 1992): 
  - Individuals make a binary decision (e.g., invest or not) in sequence.
  - Each has a private signal (e.g., about the startup's quality) and observes the actions (but not the signals) of predecessors.
  - The model assumes that the precision of private signals is known and symmetric (i.e., the same for all).

  In such a model, an information cascade occurs when it becomes optimal for an individual to follow the action of the previous individuals regardless of their own private signal. This can happen when the public information (from observed actions) becomes so strong that a single private signal cannot overturn it.

