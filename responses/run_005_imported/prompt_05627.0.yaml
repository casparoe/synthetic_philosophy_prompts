  ### Adjudication of Moves

  **Move (1): Marcus (causal-role)**  
  Score: **1**  
  *Justification*: Marcus correctly identifies that a trait's current causal contribution (e.g., flight feathers enabling flight) is a core aspect of function, aligning with Cummins' account. This captures the intuitive "what it does now" perspective. However, it oversimplifies by dismissing history entirely, leaving the account vulnerable to overgeneration (e.g., heart sounds as "functions"), as Elena highlights. The strength lies in its focus on present mechanics, but it lacks a principled way to exclude non-functional effects.  

  **Move (2): Elena (etiological)**  
  Score: **2**  
  *Justification*: Elena’s critique is compelling and exposes a critical flaw in causal-role theories: they cannot distinguish functions from mere side effects (e.g., heart sounds vs. blood pumping). By invoking selective history to explain *why* certain effects are privileged as functions, she anchors the account in evolutionary theory. This move successfully defends etiology as necessary to avoid arbitrariness in function attribution.  

  **Move (3): Marcus (against etiology)**  
  Score: **0**  
  *Justification*: Marcus raises a valid challenge—deep history could assign feathers a thermoregulation/display function—but overstates the problem. While tracing origins might lead to "swamping" by ancestral functions, etiological accounts (e.g., Neander’s) typically focus on *recent* selection maintaining the trait, not primordial origins. His claim that this cutoff is arbitrary is partially fair but ignores that evolutionary biology routinely distinguishes stabilizing vs. origin selection. The move is neither clearly wrong nor decisive.  

  **Move (4): Elena (defending etiology)**  
