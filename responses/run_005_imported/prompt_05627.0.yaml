  ### What Both Overlook  
  Elena and Marcus both neglect **function pluralism**: biological traits often simultaneously satisfy multiple function concepts. Flight feathers may have a *current causal role* in flight (per Cummins) while owing their form to *recent selection* for aerodynamics (per etiology). Hybrid accounts (e.g., Griffiths, Godfrey-Smith) reconcile this by distinguishing "selected functions" (historical) from "systemic functions" (current). Additionally, neither addresses **exaptation**—where traits evolve for one role but are co-opted for another (e.g., feathers for insulation → flight). Here, etiology can assign a new function if *subsequent selection* modified the trait for flight, avoiding "swamping" by ancient history. A fuller account must thus integrate both perspectives: history explains trait existence, while current context clarifies its operational role.
