prompt: |-
  A friend and I spent a long walk home last night arguing about the contingency version of the cosmological argument, and neither of us gave any ground. As it happens, next week's guest on my philosophy-of-religion podcast is known for defending exactly that argument: a neo-Leibnizian case for a necessary being, resting on a strong principle of sufficient reason (PSR) that demands an explanation for the cosmos as a whole, not just its parts. Draft eight to ten interview questions that go beyond having her restate the argument's structure. I want at least one question on the 'taxicab' worry -- why PSR is allowed to stop demanding external explanations exactly when it reaches the necessary being, whose own existence is then simply attributed to the necessity of its nature; one on the Hume-Edwards line that explaining every member of an infinite regress of contingent causes already explains the regress as a whole, leaving nothing for a necessary being to explain; and one on the modal collapse objection -- that a PSR strong enough to demand a reason for the cosmos's existence seems to force the necessary being's creative choice to be just as necessary as its own nature, leaving no genuine contingency standing anywhere. For each, add a follow-up question keyed to the answer she's most likely to give.
