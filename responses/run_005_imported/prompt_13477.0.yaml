  ## Memorandum: Ethical Considerations Regarding the Honorary Degree Nomination for General [Redacted]

  **To:** Members of the Honorary Degrees Committee
  **From:** [Your Name/Position], Committee Member
  **Date:** October 26, 2023
  **Subject:** Recommendation Regarding Nomination of General [Redacted]: Addressing the Moral Challenge Posed by Anscombe

  **I. Introduction**
  The nomination of General [Redacted] presents this Committee with a profound ethical dilemma. The General’s subsequent three decades of dedicated disaster relief and reconstruction work undeniably represent "extraordinary service to humanity," meeting the letter of our bylaws. However, the historical record confirms that, as theatre commander, he ordered the firebombing of [City Name], resulting in the deliberate deaths of approximately 11,000 non-combatants. Opposing faculty have powerfully invoked Elizabeth Anscombe’s 1956 argument against awarding an honorary degree to President Truman, asserting a direct parallel. This memo acknowledges the gravity of Anscombe’s challenge, engages her core argument concerning intention on its own terms, and concludes with a recommendation for Committee action.

  **II. Anscombe's Argument: Core Principles**
  Anscombe’s opposition to Truman’s degree rested not on a simple utilitarian calculus (total lives saved vs. lives lost), which she explicitly rejected as insufficient for this moral question, but on the *nature of the act itself* and the *intention* behind it. Her key points, directly applicable here, are:

  1.  **The Absolute Prohibition:** Deliberately killing the innocent is intrinsically evil. It violates a fundamental moral absolute that cannot be overridden by appeals to consequences, no matter how beneficial those consequences might be.
  2.  **Intention is Paramount:** The moral character of an act is defined by the agent’s intention. If the death of innocents is *intended as a means* to achieve a military or political end (e.g., breaking an insurgency by destroying morale through terror), it constitutes murder, regardless of the end sought.
  3.  **Distinction from Foreseen Consequence:** Anscombe distinguishes *intending* evil from merely *foreseeing* it as a side-effect. While foreseen negative consequences require justification under the principle of double effect (PDE), *intending* the evil of innocent deaths is never permissible.
  4.  **Honor and Moral Character:** Conferring an honor signifies institutional approval and recognition of the recipient's character and deeds. Honoring someone who has ordered the deliberate killing of innocents, Anscombe argued, implicates the honoring institution in that moral wrong and corrupts its own values. It signals that such acts can be "balanced out" by later good deeds, a proposition she vehemently denied.

  **III. The Dilemma: Service vs. Action**
  The Committee faces a stark tension:

  *   **The Humanitarian Record:** The General’s post-military career demonstrably saved lives and alleviated suffering on a massive scale. This constitutes "extraordinary service" by any conventional measure.
  *   **The [City Name] Bombing:** The historical evidence strongly indicates that the firebombing targeted the civilian population center held by rebels with the *intent* of destroying the city and its inhabitants to crush resistance. The estimated 11,000 civilian deaths were not a tragic accident or collateral damage incidental to a military target; they were the *method* chosen. This aligns precisely with the kind of act Anscombe condemned: the deliberate killing of innocents as a means to an end.

  **The critical question Anscombe forces upon us is not "Did the later good outweigh the past evil?" but "Can an act that intrinsically involves the deliberate killing of innocents ever be compatible with receiving an honor that signifies 'extraordinary service to humanity'?"**

  **IV. Engaging Anscombe: Can the Act Be Reconciled?**
  To meet Anscombe’s argument on its own terms requires examining the nature of the bombing itself, not offsetting it with subsequent deeds. Possible counter-arguments warrant scrutiny:

  1.  **"Military Necessity / Lesser Evil":** Anscombe explicitly rejected this justification for *intending* innocent deaths. Even if breaking the insurgency saved more lives (a contested claim itself), using the massacre of civilians as the chosen tool remains morally impermissible under her framework. The end cannot justify *this* means.
  2.  **"The Civilians Were Not 'Innocent'":** This argument is ethically untenable. Non-combatants residing in a rebel-held area do not forfeit their fundamental right not to be targeted. International humanitarian law and core just war principles affirm this. Anscombe’s definition of "innocent" in this context is clear and aligns with this understanding.
  3.  **"Intention Was Only to Destroy Infrastructure/Morale, Not Kill":** This strains credulity given the nature of firebombing a densely populated urban center. The foreseeable and inevitable outcome was mass civilian death. When an act is chosen *because* its direct effect is mass civilian death (to achieve "morale breakdown"), that death is intended as the means. Anscombe would dismiss this as sophistry.
  4.  **"The Later Good Redeems":** Anscombe’s core point is that later good deeds do not change the intrinsic moral character of the past act of murder, nor absolve the moral responsibility for it. Honoring the later work while ignoring the foundational act of ordering mass civilian deaths implicitly condones that act and suggests it can be morally offset. This, for Anscombe, erodes the very concept of absolute moral prohibition.

  **V. Institutional Conscience and the Meaning of Honor**
  Our decision reflects the university’s values. An honorary doctorate is not merely a recognition of net positive contributions; it is a symbolic bestowal of the university’s highest esteem upon the *whole person* as an exemplar. Anscombe compels us to ask: Can our institution, in good conscience, place its mantle of honor upon someone who, as a matter of historical record, commanded the intentional killing of thousands of non-combatants, regardless of the context or subsequent actions?

  To proceed with the nomination risks:

  *   **Validating Anscombe’s Critique:** It signals that our institution agrees that the deliberate killing of innocents *can* be counterbalanced by later good works, undermining the moral absolute she defended.
  *   **Causing Profound Hurt:** It inflicts deep pain on victims' descendants, survivors, and those within our community for whom this act represents an unforgivable atrocity.
  *   **Compromising Our Moral Stance:** It associates the university with an act fundamentally incompatible with the values of humanity, justice, and respect for life we purport to uphold.

  **VI. Recommendation: Withdraw the Nomination**
  After careful consideration, engaging directly with the moral force of Anscombe’s argument concerning the intrinsic nature of the act and the primacy of intention, I recommend that the Committee **withdraw the nomination of General [Redacted] for an honorary doctorate.**

  **Rationale:**

  1.  **The Primacy of the Act:** The firebombing of [City Name], involving the deliberate killing of civilians as a means to a military end, constitutes the specific kind of act Anscombe identified as absolutely disqualifying for honor. This is not mitigated by the subsequent humanitarian work under the terms of her argument. The nature of this act fundamentally contradicts the essence of "extraordinary service to humanity."
  2.  **Institutional Integrity:** Awarding the degree would implicitly endorse the proposition that such acts can be morally counterbalanced, a position that violates a core ethical absolute concerning the protection of innocent life and contradicts the foundational values of an academic institution dedicated to human flourishing.
  3.  **Symbolic Weight:** The symbolic message of bestowing our highest honor outweighs a utilitarian tally of good deeds. We cannot honor the later work without implicitly honoring the man whose legacy is irrevocably marked by this command decision. The stain of [City Name] cannot be laundered by subsequent service in the context of conferring an honor.
  4.  **Clarity and Principle:** Withdrawal provides moral clarity. It affirms that certain acts, by their very nature, lie beyond the pale of what our university can honor, irrespective of later achievements. It respects the absolute prohibition against the intentional killing of the innocent that Anscombe defended.

  **VII. Concluding Remarks**
  This is not a recommendation made lightly. The General’s humanitarian work is significant and worthy of respect. However, Anscombe’s argument compels us to recognize that honoring an individual requires confronting the totality of their most consequential actions, judged by the intentions behind them. The act of ordering the firebombing of [City Name] represents a profound violation of the principle protecting innocent life. To confer an honorary doctorate, our symbol of highest esteem, in light of this act, would compromise our institution’s moral standing and betray the victims of that decision.

  Withdrawing the nomination is not a denial of the General’s later service, but a necessary affirmation that the deliberate killing of innocents can never be the foundation upon which our university builds its honor.

  **Recommendation:** **WITHDRAW** the nomination of General [Redacted].
