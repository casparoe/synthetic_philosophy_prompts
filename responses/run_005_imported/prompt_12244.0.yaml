  We are ranking six strategies for resolving the tension between Aumann's agreement theorem / Milgrom-Stokey no-trade theorem and the observed high trading volume in real markets. The goal is to account for trading volume while sacrificing as little as possible of the Bayesian rational-agent framework.

  The theorem relies on several key assumptions:
  1. Common prior
  2. Common knowledge of rationality (and of the fact that a trade is being offered, and that each side is willing to trade)
  3. Bayesian updating
  4. No ambiguity (agents have precise probabilities)

  The strategies relax one or more of these assumptions.

  We are to rank the strategies from S (best at explaining volume without abandoning rationality) to D (closest to giving up the rationality assumptions).

  Let's analyze each strategy:

  1. **Heterogeneous (non-common) priors**: 
     - This relaxes the common prior assumption. Agents start with different priors, so they can agree to disagree even after sharing information. This allows for trade because each agent thinks they are getting a good deal based on their own prior.
     - However, the common prior is a key part of the rational-agent model (often justified by the idea that priors should be based on objective information). Abandoning it might be seen as a significant departure from the standard rationality framework.

  2. **Noise- or liquidity-driven trading unconnected to private information**:
     - This introduces trading for exogenous reasons (e.g., needing cash for an emergency). Such trades are not motivated by information, so the no-trade theorem (which is about speculative trade based on information) doesn't apply. 
     - This preserves the Bayesian framework for informed traders and only adds an exogenous shock. It doesn't require irrationality.

  3. **Failure of common knowledge that a trade is actually being offered**:
     - The theorem requires common knowledge that each side is willing to trade. If it's not common knowledge, then agents might still trade because they are unsure whether the other party is really willing (and hence might have information they don't). 
     - This is a weakening of the common knowledge assumption but still within a rational framework (just with less than full common knowledge).

  4. **Common knowledge of rationality breaking down at some finite order**:
     - The theorem relies on common knowledge of rationality (infinite regress). If this breaks at some finite level, then agents might trade because they doubt the other's rationality (or the other's belief about their own rationality, etc.). 
     - This is a relaxation of the common knowledge requirement, but it still maintains that agents are rational up to the level they can reason. However, it does introduce a bounded rationality element.

  5. **Overconfidence about the precision of one's own private signal**:
     - Agents overestimate the quality of their private information. This is a form of cognitive bias. They trade because they think their signal is more informative than it actually is. 
     - This is a clear departure from the Bayesian rational-agent model because a rational agent would correctly assess the signal precision.

  6. **Ambiguity aversion, which permits disagreement even under a shared prior**:
     - Ambiguity aversion (from behavioral economics) allows for disagreement even with a common prior because agents might have different attitudes toward ambiguous (non-probabilistic) uncertainty. 
     - This relaxes the Bayesian assumption that agents have precise probabilities and updates by Bayes' rule. It is a behavioral model.

  Now, we rank by:
  - How well each accounts for trading volume.
  - How little they sacrifice from the Bayesian rational-agent picture.

  We want to preserve as much rationality as possible while explaining volume.

  Ranking:

