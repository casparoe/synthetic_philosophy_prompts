  For the questions, I’ll start with why telepathy is uniquely problematic. Turing dismisses other anomalies like astrology because they don’t directly break the game’s logic—telepathy does by enabling cheating. Follow-up: if telepathy isn’t testable, why entertain it? This probes his pragmatism. 

