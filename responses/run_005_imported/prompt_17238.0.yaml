  First, I need to recall McMahan's distinction clearly. Deep morality deals with objective moral truths about permissibility, while the law of war incorporates practical constraints like epistemic limitations and coordination problems. This isn't just an ad hoc move; it's rooted in moral philosophy, similar to rule-consequentialism or institutional approaches.

  The user's students argue that switching to convention-based arguments abandons revisionism. I should counter that McMahan's revisionism targets the deep morality, challenging the MEC thesis. Separating deep morality from practical conventions maintains the core critique while addressing real-world complexities.

  Lazar's dilemma has two horns. The near-total war horn (low threshold) risks implicating civilians. McMahan's distinction doesn't resolve this directly but relocates it to the legal domain. The contingent pacifism horn (high threshold) makes unjust combatants non-liable, preventing justified killing. Here, McMahan's distinction shines by allowing deep morality to set high standards while the law permits killing under practical conventions.

  I need to emphasize that the distinction is principled. Drawing from rule-consequentialism and just war theory's practical tradition shows it's not ad hoc. McMahan's argument for symmetry in rules of engagement is based on reducing harm and maintaining incentives, which is a coherent extension of his revisionism.

  The user wants clarity on which horn is defused versus relocated. Contingent pacifism is defused because deep morality's high standards don't paralyze action; the law provides operational rules. Near-total war is relocated to legal discourse, where McMahan can argue against civilian targeting despite their contributions, based on conventions that minimize overall harm.

  Also, the user might need to present this defense effectively in class. Highlighting McMahan's consistency in separating ideal theory from non-ideal contexts could help students see the structure. Addressing the students' dismissal by showing that revisionism isn't abandoned but applied pragmatically.
answer: |-
  Here’s the strongest case for McMahan’s distinction as a principled response to Lazar’s dilemma, explicitly addressing its resolution and limitations:

  ### **Core Argument: The Distinction as Principled, Not Ad Hoc**
  McMahan’s separation of "deep morality" (objective, ideal moral truth) from the "law of war" (practical, convention-based rules) is **independently motivated by three fundamental philosophical commitments**:
  1.  **Epistemic Constraints in Non-Ideal Theory**: Moral agents operate under severe uncertainty in war. Soldiers cannot reliably assess their war’s justice, their own responsibility, or civilians’ contributions in real-time. Deep morality assumes full knowledge; the law must accommodate ignorance.
  2.  **Institutionalist Moral Reasoning**: Rules governing institutions (like war) must prioritize coordination, stability, and harm reduction over individual desert when perfect compliance is impossible (drawing on rule-consequentialism and Rawlsian "practice" concepts).
  3.  **The Action-Guiding/Permissibility Distinction**: What is objectively impermissible (deep morality) may still warrant legal permission if prohibiting it would cause greater harm (e.g., allowing some objectively unjust killings to prevent total war).

  This framework **pre-dates Lazar’s dilemma** in McMahan’s work and just war theory broadly (e.g., in Walzer’s "sliding scale" or Shue’s discussions of conventions). It’s not concocted to evade the dilemma but reflects a realist response to war’s inherent moral messiness.

  ---

  ### **Defusing the "Contingent Pacifism" Horn**
  This is where McMahan’s distinction **directly resolves the dilemma**:
  -   **The Horn**: If liability requires high responsibility (to shield civilians), most unjust combatants aren’t liable, making it impermissible for just combatants to kill them → contingent pacifism.
  -   **McMahan’s Defusal**:  
      - **Deep Morality**: Agrees that *objectively*, many unjust combatants are non-liable (low responsibility). The revisionist core stands: MEC is false in principle.  
      - **Law/Convention**: Argues that *in practice*, symmetric combatant privileges remain justified because:  
          (i) **Epistemic Parity**: Just combatants cannot reliably distinguish *themselves* as "just" or identify *which* enemy combatants are sufficiently responsible.  
          (ii) **Incentive Preservation**: Abandoning symmetry removes mutual restraint incentives, increasing civilian/collateral harm.  
          (iii) **Worst-Case Prevention**: Asymmetric rules would be abused by powerful states to justify unlimited war.  
      - **Result**: Contingent pacifism in deep morality **does not paralyze action**. The law permits killing combatants (even objectively non-liable ones) under rules justified by systemic consequences. This avoids pacifism *in practice* without denying the deep moral truth.

  **Why this isn’t abandoning revisionism**:  
  McMahan’s project has two goals:  
  1.  **Theoretical**: Refute MEC by showing combatants *aren’t* morally equal. The distinction *preserves* this—deep morality still condemns most unjust combatants.  
  2.  **Practical**: Reform the laws of war to better reflect morality *where feasible*. The distinction explains *why* symmetry persists *for now* while guiding incremental reform (e.g., prioritizing civilian immunity, restricting certain weapons).  

  ---

  ### **Relocating (Not Resolving) the "Near-Total War" Horn**
  The distinction **does not directly solve** this horn but **relocates the tension**:
  -   **The Horn**: If liability requires low responsibility (to capture ordinary combatants), many civilians (taxpayers, workers) become liable → near-total war.
  -   **Relocation via Distinction**:  
      - **Deep Morality**: McMahan *could* concede some civilians *are* objectively liable (e.g., a propagandist knowingly inciting genocide).  
      - **Law/Convention**: Argues for retaining *legal* civilian immunity because:  
          (i) **Targeting Risks**: Mistaken/intentional targeting of non-liable civilians would skyrocket.  
          (ii) **Coordination Value**: A bright line ("don’t target civilians") saves lives even if over-inclusive.  
          (iii) **Moral Progress**: Widening legitimate targets erodes humanitarian norms irreparably.  
  -   **Result**: The "near-total war" implication is **shifted from permissibility to legal philosophy**. Deep morality *might* allow killing some civilians, but the law *must* forbid it. The tension remains between individual desert and systemic consequences, but now within the convention-justification framework.

  **Why this relocation is principled**:  
  The same justifications for combatant symmetry (epistemic limits, incentive preservation) apply *more forcefully* to civilians. Granting states leeway to target "responsible civilians" would be catastrophically abuse-prone. The relocation thus coheres with McMahan’s core institutionalist logic.

  ---

  ### **Why This Isn’t a Dodge: The Principled Core**
  1.  **Moral Truth Matters**: Deep morality guides *long-term* reform (e.g., holding leaders accountable, stigmatizing aggression). Conventions aren’t moral truths but damage-control tools.  
  2.  **Avoids Moral Nihilism**: Without the distinction, Lazar’s dilemma forces revisionism into absurdity (pacifism or total war). McMahan offers a third way: *acknowledge* tragic imperfection while *minimizing* harm.  
  3.  **Realism About Agency**: Soldiers aren’t philosophers. Holding them to deep morality’s standards is like demanding perfect Kantian reasoning amid a riot. The law provides actionable, life-saving guidance.  

  **In essence**: McMahan *absorbs* the contingent pacifism horn by separating ideal condemnation from practical permission. He *manages* the near-total war horn by applying the same institutional logic to protect civilians. The dilemma exposes war’s tragic complexity; the distinction is how revisionism matures to address it. This isn’t retreat—it’s sophistication.
