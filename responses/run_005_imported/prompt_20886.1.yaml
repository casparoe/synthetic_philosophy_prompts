  Here’s a 16-exchange dialogue that captures the tension, intellectual honesty, and unresolved friction you’re aiming for. I’ve kept the funeral setting palpable, let both characters land punches, and ensured they engage directly with each other’s points without caricature.  

  **Characters:**  
  - **ELEANOR** (50s): Philosopher of religion, Wittgensteinian leanings. Wears a dark, rumpled blazer; gestures with her wine glass.  
  - **MARTIN** (50s): Analytic philosopher, specializes in epistemology. Adjusts his glasses when agitated; voice tightens when frustrated.  

  **Setting:**  
  A cramped corner of a church hall after a mutual mentor’s funeral. Rain streaks the windows.  

  ---

  ### Dialogue:  
  1.  **MARTIN:** (Sighing, swirling cheap wine)  
      Still defending the unfalsifiable, Elle? I saw your latest book. "Grammar of Faith." You’d think Wittgenstein personally anointed you.  

  2.  **ELEANOR:** (Leans against the wall, weary but alert)  
      And you’re still grading everything like a logic exam. Some things aren’t *meant* to be hypotheses, Martin. The Last Judgment isn’t a weather forecast.  

  3.  **MARTIN:**  
      Right, right—it’s a "framework." But that’s the dodge, isn’t it? When Aunt Mary over there crosses herself, she thinks Christ *literally* rose from the dead. Not "Oh, what a lovely picture!"  

  4.  **ELEANOR:**  
      You’re conflating *expression* with *empirical claim*. When she says "He is risen," she’s not entering data into a cosmic spreadsheet. She’s standing in a river—the belief *is* the current.  

  5.  **MARTIN:**  
      (Leans in, voice lowered but intense)  
      But if the river’s bedrock is "Christ walked on water," and I prove water’s molecular structure makes that impossible, doesn’t the current dry up? You can’t hide behind "grammar" when believers stake their lives on literal truths.  

  6.  **ELEANOR:**  
      You’re missing the point. The bedrock isn’t the *proposition*—it’s what the proposition *does*. If Aunt Mary lives with radical forgiveness because she believes in resurrection, that’s *real*. Debating first-century biology is irrelevant to *that*.  

  7.  **MARTIN:**  
      Irrelevant? If the resurrection didn’t happen, her entire ethic collapses! Or does it? Because under your view, she’s not *wrong*—she’s just playing a different "language game." (Makes air quotes) That’s Nielsen’s critique exactly: you’ve made faith bulletproof. Untouchable.  

  8.  **ELEANOR:**  
      (Sets her glass down hard)  
      No—I’ve made it *human*. Belief isn’t a failed science project. It’s how people weave meaning. You demand she justify her tapestry with a microscope.  

  9.  **MARTIN:**  
      (Points a finger)  
      But she *claims* it’s more than a tapestry! She claims it’s *history*. If I say, "Prove it," and she replies, "Oh, it’s not that kind of claim," that’s shifting the goalposts. Bad faith.  

  10. **ELEANOR:**  
      You’re so obsessed with "claims" you’ve deafened yourself. Listen: when I say "I believe in the Last Judgment," I’m not predicting an event. I’m confessing that *every choice matters infinitely*. That’s not a hypothesis—it’s gravity.  

  11. **MARTIN:**  
      (Rubs his temples)  
      Fine. But if I say, "Prove gravity exists," I can drop this wineglass. *(He doesn’t.)* What’s your "proof"? A feeling? A tradition? If it’s untethered from truth-tracking, it’s just… aesthetics. Comforting fiction.  

  12. **ELEANOR:**  
      (Eyes flashing)  
      Is love "comforting fiction" because I can’t scan your brain and *prove* it? Some realities are lived, not measured. Your error is thinking "true" only means "corresponds to physical facts."  

  13. **MARTIN:**  
      Love has behavioral correlates! Neurochemistry! If you reduce religion to pure subjectivity, you betray what actual believers do—they pray for *actual* intervention. They bury their dead expecting *actual* resurrection. Not metaphor!  

  14. **ELEANOR:**  
      And when prayers go "unanswered"? They don’t scrap the system—they reinterpret. Like a scientist tweaking a theory, but within the framework. It’s not "subjectivity"—it’s *coherence*. The belief sustains a world.  

  15. **MARTIN:**  
      (Quietly bitter)  
      A world where you never have to admit you’re mistaken. How convenient. Meanwhile, the rest of us have to live in *this* world—where evidence matters, and saying "God did it" stops inquiry cold.  

  16. **ELEANOR:**  
      (Softly, looking toward the coffin)  
      And when you stand where Aunt Mary is today, Martin—when it’s *your* sister in that box—tell me what your evidence offers her. Tell me how "inquiry" stitches her world back together.  
      *(Martin opens his mouth, then closes it. The organ music swells. They both turn away.)*  

  ---

  ### Key Elements Used:  
  - **Stakes & Setting:** The funeral raises emotional stakes (dialogue #16) and forces civility. Martin’s near-mockery (#11) is tempered by the context.  
  - **Substance Over Strawmen:**  
    - Eleanor concedes believers *do* assert facts (#6) but argues their *function* is primary.  
    - Martin grants that belief isn’t *only* propositional (#7) but insists truth-claims can’t be sidestepped.  
  - **Tactics:**  
    - Eleanor uses metaphors (river, gravity, tapestry) to deflect reductivism.  
    - Martin attacks coherence (#15) and highlights practical consequences (prayer for intervention, #13).  
  - **Ending:** No resolution, but the funeral’s weight halts the debate. Martin’s silence speaks volumes.  

  Would you like adjustments—more aggression, vulnerability, or a specific thematic emphasis?
