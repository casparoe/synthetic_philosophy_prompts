  ok so we have this tiny philosophy elective at my school (like 9 people) and we just went over van fraassens reflection principle, which i think basically says: whatever credence you're already sure you'll end up having in something at some point in the future, that should already be your credence in it right now, unless you've got a specific reason to think your future opinion is gonna be messed up somehow (memory loss, bias, whatever). my grandma keeps telling me that me and my boyfriend are "just kids" and that i'll look back in five years and know this wasn't real love, and honestly, statistically, shes probably right about what i'll end up thinking eventually. does the principle mean i should basically start believing that now, today, just because im pretty sure thats where i'll land eventually? or is there some kind of catch, like a difference between changing your mind because you actually learn something true vs just getting more jaded as you get older? can you go through the most important implications of the principle for a situation like this — actual arguments please, not just some "everyone's love is valid" non-answer.
