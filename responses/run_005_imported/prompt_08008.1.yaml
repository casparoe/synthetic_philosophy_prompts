  Below is a draft recommendation memo for your committee, designed to engage directly with Anscombe's argument while respecting the consequentialist position. It lands on a clear recommendation with a structured rationale, prioritizing institutional values over utilitarian calculus in this context.

  ---

  **MEMORANDUM**  
  To: Honorary Degrees Subcommittee  
  From: [Your Name/Position]  
  Date: [Current Date]  
  Subject: Recommendation on Nomination of General Marion Voss  

  ### I. Introduction
  This memo addresses the nomination of retired General Marion Voss for an honorary degree in recognition of his military service, specifically his command of the strategic bombing campaign in the [War Name] conflict. The campaign’s doctrine explicitly targeted civilian housing and morale to precipitate a swift end to hostilities. While historians largely agree this approach shortened the war and reduced total casualties, ethical concerns persist regarding the *intentional targeting of non-combatants*. This requires rigorous scrutiny of whether such actions align with the values our institution seeks to honor.  

  ### II. Core Ethical Conflict: Intent vs. Consequences  
  The debate centers on two principled positions:  
  1. **Consequentialist Justification**: The campaign saved lives overall by avoiding a protracted ground invasion.  
  2. **Deontological/Objection**: Intentional targeting of civilians constitutes a fundamental moral wrong that cannot be negated by outcomes.  

  Critically, this is not a generic "ends vs. means" dispute. As philosopher G.E.M. Anscombe argued in her critique of President Truman’s honorary degree, **the distinction between *foreseen* and *intended* harm is morally decisive**.  

  #### A. The Consequentialist Case (Strongest Version)  
  We stipulate the historical consensus:  
  - Civilian targeting was integral to the campaign’s doctrine.  
  - The campaign likely hastened the war’s end.  
  - Total casualties (military + civilian) were lower than projected alternatives.  
  If the *only* consideration were net lives saved, this nomination would be defensible. The outcome achieved a lesser evil, sparing combatants and civilians from greater harm.  

  #### B. Anscombe’s Threshold Argument  
  Anscombe’s position, however, renders the consequentialist calculus irrelevant if *both* of the following are true:  
  - **Intentional Targeting**: Civilians were not merely collateral damage; their deaths/terror were the *chosen mechanism* to force surrender.  
  - **Moral Absolutism**: Deliberately targeting non-combatants is intrinsically wrongful ("murder"), regardless of consequences.  

  **Key Distinction**:  
  - ✔️ **Foreseen Harm** (e.g., bombing a factory near homes, accepting civilian deaths as inevitable) may be excusable under double-effect reasoning.  
  - ❌ **Intended Harm** (e.g., bombing homes to break civilian will) treats innocents as *instruments* of strategy, crossing a moral threshold.  

  General Voss’s campaign falls unambiguously into the latter category. Historical records confirm civilians were *directly targeted* as a matter of doctrine.  

  ### III. Why Consequences Do Not Absolve Intent  
  Even if the campaign saved lives, Anscombe’s framework insists that certain acts are morally disqualifying *in themselves*:  
  1. **Institutional Complicity**: Awarding an honorary degree is not a neutral assessment of outcomes. It is a *sanctioning* of the individual’s choices and methods. Honoring such actions signals that our university condones the deliberate use of civilian terror as a tool of statecraft.  
  2. **Slippery Precedent**: Legitimizing "successful" intentional harm against non-combatants erodes the foundational principle of civilian immunity in wartime—a norm critical to constraining future conflicts.  
  3. **Symbolic Integrity**: Universities are custodians of humanistic values. Celebrating tactics that weaponize the vulnerability of non-combatants undermines our commitment to human dignity, irrespective of outcomes.  

  The "math worked out" argument is valid in policy analysis but insufficient for *moral commendation*. Ends-based reasoning cannot convert an intrinsically wrongful act into an honorable one.  

  ### IV. Recommendation: Decline the Nomination  
  **Motion**: We recommend **declining** the nomination of General Marion Voss for an honorary degree.  

  #### Reasoning:  
  - **Moral Threshold Crossed**: The intentional targeting of civilians, acknowledged as the campaign’s core mechanism, constitutes a categorical violation of the principle of non-combatant immunity. This places it beyond the scope of justifiable honor, regardless of consequences.  
  - **Institutional Values**: Our university cannot endorse the principle that civilian lives are expendable instruments for strategic ends without compromising our commitment to universal human dignity.  
  - **Historical Nuance**: This decision does not negate the complexity of General Voss’s choices or the lives saved. It reflects that *honorific recognition* requires alignment with irreducibly deontological norms.  

  #### Suggested Path Forward:  
  - **Table Pending Further Input (Optional)**: If the committee seeks additional context, we could:  
    1. Commission a brief from ethics/philosophy faculty on Anscombe’s argument.  
    2. Invite a military historian to clarify the doctrine’s implementation.  
    *However*, the factual record of intentional targeting is uncontested, making further deliberation unlikely to resolve the core ethical impasse.  

  ### V. Conclusion  
  Honorary degrees symbolize what our institution esteems. While we acknowledge the consequentialist view and the gravity of wartime decisions, we cannot honor strategies that relied on the systematic terrorization of civilians as a deliberate tool. To do so would violate our duty to uphold the principle that non-combatants are never legitimate targets—a boundary Anscombe rightly deemed inviolable even in the face of "good" outcomes. **We recommend declining this nomination on deontological grounds.**  

  ---  

  ### Key Strengths of This Approach:  
  1. **Engages Anscombe Directly**: Uses her intent/foresight distinction as the fulcrum.  
  2. **Concedes the Consequentialist High Ground**: Explicitly grants that the campaign "worked" to preempt rebuttals.  
  3. **Decisive but Nuanced**: Declines based on institutional symbolism, not personal condemnation.  
  4. **Avoids "Both Sides" Evasion**: Offers a principled threshold (intentional harm) as the deciding factor.  

  This memo provides a clear, defensible path forward that elevates the university’s commitment to moral boundaries over utilitarian pragmatism in matters of honor.
