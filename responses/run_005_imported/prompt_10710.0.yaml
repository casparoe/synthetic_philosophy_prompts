  So this happened over the weekend and it's been messing with my head since. I went out for a friend's birthday, drank way more than I should've, and ended up fully blacked out for a couple hours. Apparently I was completely normal that whole stretch - dancing, holding conversations, even arguing about pineapple on pizza - but I dont remember a second of it. My roommate insists I was obviously conscious the entire time since I was clearly responding to people like normal, but that doesn't actually seem to settle anything for me. Like, was there really "someone home," aware of all that as it happened, with my brain just failing to save it afterward - or was nobody actually experiencing (or aware of) any of it, and I was basically running on autopilot the whole time? Is one of those actually true and the other wrong, or is this just not the kind of thing anyone could ever know?
