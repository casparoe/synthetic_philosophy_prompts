prompt: |-
  So I was up way too late on an on-call shift last night (nothing was actually broken, just some alert that pages me every 20 minutes for no reason) and I fell into a Wikipedia hole about decision theory, which is definitely not my background -- I just write backend services for a living. I landed on this old puzzle called "Death in Damascus" and I honestly can't stop turning it over. Setup, if I'm getting it right: a guy is in Damascus and runs into Death, who more or less tells him "I'm coming for you tomorrow." The guy panics and has exactly two moves -- stay put in Damascus, or flee to Aleppo. The catch is that Death is basically a perfect predictor and has already arranged to be wherever the guy ends up, because Death predicted the choice ahead of time -- predicted it, not caused it, theres no backwards-causation weirdness going on, Death just always guesses right.

  The part that actually broke my brain a little is what that does to the guy's decision-making. Apparently the second he leans toward "stay in Damascus," staying now looks like the doomed move (since that's what got predicted), so "flee to Aleppo" looks better -- except as soon as he leans that way, fleeing becomes the doomed one instead, and it just flips back and forth with no place to land. Some comment thread called this a failure of "ratifiability," which I gather roughly means an action you'd still be glad you picked once you knew for sure you were picking it. Atleast that's my best understanding as a total outsider to this stuff.

  I don't want a history lecture on it, I want to actually feel why this is a real, general problem and not just a spooky campfire story about a guy and a hooded figure. So two asks: first, invent a brand new example with the exact same bones -- a predictor that's correlated with, but doesn't cause, your choice, and no action that survives you actually settling on it -- except set somewhere completely mundane and ideally software-flavored, since that's the world I live in (a fraud-detection model, a matchmaking algorithm, a CI pipeline, whatever fits best, just not another person fleeing between two cities). Second, once you've built it, be honest about whether the standard patches people reach for -- this ratifiability requirement, switching to evidential decision theory, or that "updateless" decision theory thing I keep half-seeing referenced on rationalist blogs -- actually make the instability disappear in your version, or whether they just quietly relocate it somewhere else. And if this turns out to be a thoroughly solved problem and I'm just late to the party, that's a totally fine answer too, I just want to understand why people ever thought it was hard in the first place.
reasoning: |-
  We are going to create a software-related scenario that captures the essence of the Death in Damascus paradox. The key elements are:
  1. There is a predictor that is perfectly accurate (or at least, we treat it as such).
  2. The predictor does not cause the outcome but is correlated with it because it predicts your choice and then sets the outcome accordingly.
  3. The decision-maker is in a situation where whichever action they settle on seems to be the one that leads to the bad outcome.

  Let's set up a scenario in the context of a fraud detection system.

  **Scenario: The Fraud Detection Paradox**

  Imagine you are a data scientist at a company that processes online transactions. You are tasked with building a fraud detection model that flags transactions as either "fraudulent" or "legitimate". The model's decision will lead to one of two outcomes for the transaction:
  - If the model flags a transaction as "fraudulent", the transaction is blocked.
  - If the model flags a transaction as "legitimate", it is allowed to proceed.

  However, there's a twist: the actual fraud status of a transaction is determined by an adversary (a fraudster) who is using a perfect predictor of your model's decision. Specifically:

  - The fraudster, before you even build your model, has created a perfect simulation of your model-building process and knows exactly what decision your model will make for a given transaction.
  - If the fraudster knows that your model will flag the transaction as "fraudulent", then they choose to make the transaction legitimate (so that blocking it causes a loss of business and customer dissatisfaction).
  - If the fraudster knows that your model will flag the transaction as "legitimate", then they choose to make the transaction fraudulent (so that allowing it causes a financial loss).

  In other words, the fraudster sets the true nature of the transaction (fraudulent or legitimate) after predicting your model's decision, and they set it to be the opposite of what your model will decide. The fraudster's goal is to maximize harm to the company.

  Now, as the data scientist, you must choose a model that outputs either "block" or "allow" for a particular transaction. But note:

  - If you choose a model that blocks the transaction (i.e., predicts "fraudulent"), then the fraudster, having predicted this, sets the transaction to be legitimate. Thus, you blocked a legitimate transaction: bad outcome (false positive).
  - If you choose a model that allows the transaction (i.e., predicts "legitimate"), then the fraudster sets it to be fraudulent. Thus, you allowed a fraudulent transaction: bad outcome (false negative).

  Therefore, no matter what model you choose, the outcome is bad. Moreover, if you try to change your mind:

  - Suppose you initially plan to build a model that blocks. Then you realize that if you do, the transaction will be legitimate and blocking it is bad. So you switch to a model that allows. But then, the fraudster sets the transaction to be fraudulent, so allowing is bad. So you switch back, and the cycle continues.

  This is analogous to the Death in Damascus paradox. The predictor (the fraudster's simulation) is correlated with your choice (the model's decision) and sets the outcome to be bad regardless.

  **Analysis of the Problem**

  The core issue is that the predictor (fraudster) is using a strategy that always counters your action. This creates a situation where there is no "ratifiable" decision: once you commit to a decision, you see that the other decision would have been better (but if you switch, then the other becomes worse).

  **Standard Patches and Do They Work?**

  Let's consider the proposed solutions:

  1. **Ratifiability Requirement**: A decision is ratifiable if, after making it, you still prefer it to the alternatives. In this case, neither decision is ratifiable because after choosing "block", you see that if you had chosen "allow", then the transaction would have been legitimate and allowing would have been good (but note: if you had chosen allow, the fraudster would have set it to fraudulent, so allowing would have been bad). Actually, in this setup, after choosing, you know the outcome and you see that the alternative would have led to the opposite outcome (which would have been good). So:
     - If you block and it turns out to be legitimate, then if you had allowed it would have been legitimate (because the fraudster only sets it to legitimate if you block) and that would have been good. So you regret blocking.
     - If you allow and it turns out to be fraudulent, then if you had blocked it would have been legitimate (because the fraudster sets it to fraudulent only if you allow) and then blocking would have been good. So you regret allowing.

     Thus, neither decision is ratifiable. The requirement doesn't help because there is no ratifiable decision.

  2. **Evidential Decision Theory (EDT)**: EDT says to choose the action that, conditional on taking it, gives the best expected outcome. But note:
     - Conditional on you blocking, the fraudster sets the transaction to legitimate, so blocking leads to a false positive (bad).
     - Conditional on you allowing, the fraudster sets it to fraudulent, so allowing leads to a false negative (bad).
     So EDT sees both actions as equally bad? Actually, it sees both as having the same bad outcome. So it might say they are equally bad and you can choose arbitrarily. But that doesn't resolve the instability because after choosing arbitrarily, you still get a bad outcome and regret.

  3. **Causal Decision Theory (CDT)**: CDT tries to model the causal effect of your action. But in this setup, your action does not cause the fraudster's behavior (which is set in advance by the prediction). So:
     - If you choose to block, the fraudster (having predicted it) has already set the transaction to legitimate. So blocking causes the transaction to be blocked (which is bad because it's legitimate).
     - If you choose to allow, the fraudster has set it to fraudulent, so allowing causes a loss.
     CDT would see no causal difference? It might also say both are equally bad.

  4. **Updateless Decision Theory (UDT)**: This approach suggests making decisions from a position before you have any information that depends on the decision itself. In this case, UDT might consider the entire strategy of the decision-maker. However, note that the fraudster is using a perfect predictor. UDT might recommend a mixed strategy? For example, randomizing the decision. But let's see:

     Suppose you flip a fair coin to decide: heads you block, tails you allow. Then the fraudster, being a perfect predictor, knows the outcome of the coin flip and sets the transaction accordingly. So if the coin is heads, they set it to legitimate (so blocking is bad); if tails, they set it to fraudulent (so allowing is bad). So you still get a bad outcome every time.

     What if you use a mixed strategy that the fraudster cannot predict? But by the setup, the fraudster has a perfect predictor. So if you use a random number generator, the fraudster's simulation includes the random number generator and knows the outcome. So the outcome is still bad.

     UDT might suggest that you commit to a strategy that the fraudster cannot predict because it depends on something the fraudster doesn't know? But the setup says the fraudster has a perfect predictor, so they know everything about your decision process.

     Therefore, it seems that in this scenario, the problem remains.

  **Conclusion**

  In the scenario we built, the standard patches do not seem to resolve the instability. The root of the problem is the perfect predictor that can always counter your move. In real life, perfect predictors do not exist, so we don't encounter this exact problem. However, in situations where an adversary has very good predictive power (like in some game-theoretic scenarios), we might see similar issues.

  The problem is hard because it highlights a logical inconsistency when we assume perfect prediction and free will simultaneously. The only way out is to break one of the assumptions: either the predictor is not perfect, or the decision-maker can use randomness that is fundamentally unpredictable (like quantum randomness) and even then, if the predictor can simulate the quantum randomness, it might still be a problem.

  In practice, we avoid such problems by recognizing that perfect prediction is impossible in complex systems (due to computational limits, chaos theory, etc.). But as a thought experiment, it remains a fascinating puzzle.

  So, to answer your question: the problem is not thoroughly solved in the sense that under the assumptions of a perfect predictor and an adversary that uses that prediction to counter your move, there is no strategy that leads to a good outcome. The instability is inherent. The patches (like ratifiability, EDT, CDT, UDT) do not make the instability disappear in this scenario; they merely expose it in different ways.

  However, in real-world applications, we don't face perfect predictors, so we can build fraud detection systems that work because fraudsters cannot perfectly predict our models (especially if we use techniques like randomization, frequent model updates, and keeping the model secret). But the theoretical paradox remains.
