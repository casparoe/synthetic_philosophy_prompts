answer: |-
  You've hit the nail on the head – the popular "Aquinas endorses tyrannicide" narrative is a dangerous oversimplification. Your analysis of the *Summa* passage is sharp; Aquinas *is* doing something subtle with definitions, making the "hard question evaporate" *in this specific context*. Let's unpack his move and reconcile it with *De Regimine Principum*:

  **1. The Logical Move in *Summa* II-II, Q.42:**

  *   **Redefining "Sedition":** Aquinas defines sedition (II-II, Q.42, Art. 1) as "stirring up discord *among the people*" specifically "against the unity of the *multitude*, that is to say, the *common good* of the city or kingdom." It is a sin *against charity and justice* precisely because it attacks the *common good*.
  *   **The Tyranny Exception:** He argues that a tyrant, *by definition*, is ruling for *private* good, *not* the common good. Therefore:
      *   **Tyranny ≠ Just Authority:** The tyrant's rule lacks the essential quality that makes resistance "sedition" – it isn't *just* authority ordered to the common good. Resisting it isn't inherently an attack *on* the common good; it might even be *for* it.
      *   **The Tyrant is the Real Seditious Actor:** By fostering discord and oppression for personal gain, the tyrant is the one actively *destroying* the unity and common good. He's the real sinner against charity and justice.
  *   **The Crucial Caveat:** Even resistance to tyranny isn't automatically justified. It must be done *ordinately*. If the resistance causes *more harm* (chaos, civil war, worse oppression) than the tyranny itself, *then* it becomes sinful because it *does* harm the common good more than the tyrant was. This isn't "sedition" in the original definitional sense, but it *is* a grave sin against the common good due to its *disproportionate harm*.

  **Logical Move Summary:** Aquinas shifts the frame. The question isn't "Is it sedition to resist a tyrant?" because true sedition requires resisting *just* authority. The real question becomes: "Is this act of resistance against the tyrant *actually conducive to restoring the common good*, or does it cause disproportionate harm?" He dissolves the *label* "sedition" for resistance to tyranny, but replaces it with the *substantive test* of proportionality and net benefit to the common good. The sin isn't *sedition*; it's *reckless harm to the common good*.

  **2. Reconciling with *De Regimine Principum* (On Kingship):**

  The *De Regimine* passages (especially Book I, Ch. 6) are crucial context often ignored in the "tyrannicide" narrative. Aquinas here is *extremely* cautious:

  *   **The Danger of Anarchy:** He emphasizes that overthrowing a tyrant often leads to something worse – chaos, factional fighting, or another tyrant. The cure might be worse than the disease ("for the multitude often suffers worse things from a consequent sedition than from the tyrant’s rule").
  *   **The Problem of Private Judgment:** Aquinas is deeply skeptical of *private individuals* taking action. He fears vigilantism, personal vendettas masquerading as resistance, and the breakdown of all public order. Who decides the tyrant is irredeemable? What stops anyone from killing any ruler they dislike?
  *   **The Role of Public Authority:** He suggests that if action *is* to be taken, it should ideally be done by *public authority*:
      *   **Superior Authority:** If the tyrant rules a province under a higher sovereign (like an Emperor over a King), the higher authority has the *duty* to depose him.
      *   **The Community Itself:** If there is no higher earthly authority, the *community as a whole* ("the public authority") might act. This is highly ambiguous but implies a *collective, representative* action, not private assassination. He references the Roman right of the Senate to depose Emperors. He mentions "divine authority" (God acting through events or individuals) but stresses this is exceptional and not a model for human initiative.

  **The Coherent Doctrine Underneath:**

  Aquinas **does not** provide a simple "permission slip for assassination." His doctrine is complex and prioritizes order and the common good above all:

  1.  **Tyranny is Illegitimate:** Rule for private good is unjust and lacks the moral authority of true rulership.
  2.  **Resistance is Not *Sedition*:** Opposing such illegitimate rule isn't inherently sinful *as sedition*.
  3.  **BUT Resistance is Highly Dangerous:** It risks causing greater harm than the tyranny itself. The *burden of proof* is on the resister to show the action will *likely* restore the common good with *minimal* disproportionate harm.
  4.  **Private Individuals Generally Cannot Act:** Vigilantism is almost always forbidden. The judgment and action belong to the community *as a body*, not individuals acting alone. Aquinas deeply distrusts private judgment in such grave public matters.
  5.  **Action Requires Public Authority:** Legitimate action against a tyrant requires:
      *   **Superior Earthly Authority:** Acting within its jurisdiction.
      *   **The Community Represented:** Acting collectively through some established mechanism (however vague Aquinas is on what this looks like practically).
      *   **Divine Providence:** As an exception, not a rule for human planning.
  6.  **Assassination is Implicitly Ruled Out?** While Aquinas never explicitly says "Thou shalt not assassinate," his emphasis on *public authority*, *collective action*, *avoiding greater harm*, and the *dangers of private action* makes it extremely difficult to justify assassination within his framework. It inherently involves private judgment, private action, and carries an enormous risk of disproportionate harm (chaos, revenge killings).

  **Hedging or Nuance?**

  It's less hedging and more **contextual application of core principles**. The *Summa* passage (Q.42) is primarily *defensive*: it answers the charge that *any* resistance is sedition. His goal is to carve out theoretical space for legitimate resistance by redefining the sin. *De Regimine* is *prescriptive*: it's advice to rulers and communities on *how* to govern and avoid tyranny. Here, the practical dangers and the need for order come to the forefront. Both texts are united by the **primacy of the common good** and the **danger of actions that destroy order without a clear, likely benefit**.

  **Conclusion:**

  You're right to second-guess the popular narrative. Aquinas dismantles the *label* "sedition" for resisting tyranny, replacing it with a **high burden of proof** centered on proportionality, net benefit to the common good, and *especially* the requirement for **public, not private, authorization and action**. He provides a powerful *theoretical justification* for resistance to illegitimate authority but surrounds it with **formidable practical and moral cautions** that make tyrannicide by private individuals virtually impossible to justify within his system. His "doctrine" is one of **cautious legitimacy under strict conditions**, not a call to arms. Your piece will be much stronger for recognizing this crucial nuance.
