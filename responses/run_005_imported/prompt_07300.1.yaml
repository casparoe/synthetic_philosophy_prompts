prompt: |-
  So i've been going down a rabbit hole reading the "Embedded Agency" sequence on lesswrong, and I keep getting stuck on this thing called the Lobian obstacle to tiling agents -- the idea that an agent can't fully trust a future version of itself (even one running literally the same source code) to reason correctly, because of Lob's theorem. I get Godel's incompleteness at the hand-wavy "a system cant prove its own consistency" level, but I dont get why that specifically rules out something that seems as simple as "if future-me proves action X is good, just go with X." Can you walk me through the intuition for why that fails -- I don't need the full modal logic proof, just the gut-level reason -- and why it's supposed to be an actual practical problem for building AI systems and not just a cute logic puzzle? Coding/self-reference analogies welcome if they help.
