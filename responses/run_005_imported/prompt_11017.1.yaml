answer: |-
  You're absolutely right to feel uneasy about simply averaging the probabilities—your intuition is spotting a critical flaw in handling "deep uncertainty." When experts fundamentally disagree on models and assumptions (not just data noise), we're not dealing with measurable "risk" (known probabilities) but true **uncertainty** (unknown probabilities). Here's why averaging fails and how to decide smarter:

  ### Why Averaging Doesn't Work Here
  1. **False Precision Trap**:  
     Averaging conflicting estimates (e.g., 5%, 20%, 40% flood risk) into one number (say, 21.7%) pretends the uncertainty is resolved. It hides the fact that the true probability could realistically be at either extreme—or outside the range entirely.

  2. **Ignores Model Disagreement**:  
     If experts disagree due to structural differences in their models (e.g., how they weight sea-level rise vs. rainfall changes), averaging treats all models as equally valid. But some assumptions might be more credible or outdated.

  3. **Misrepresents Tail Risk**:  
     Floods are low-probability, high-impact events. Averaging downplays worst-case scenarios. If one credible model says "40% risk," that tail risk could bankrupt you—it shouldn’t be diluted by more optimistic estimates.

  4. **Confidence ≠ Consensus**:  
     As you noted, averaging conflates "what’s the risk?" with "how confident are we?" A wide range *is* critical information: it tells you the science is unsettled, and prudence is warranted.

  ### A Better Decision Framework
  Instead of forcing a single probability, embrace the uncertainty. Focus on **robustness**—making choices that perform acceptably across plausible scenarios. Here’s how:

  1. **Map the Extremes & Anchor Points**:  
     - Identify the most pessimistic credible estimate (e.g., 40% chance of flooding over 30 years).  
     - Identify the most optimistic credible estimate (e.g., 5%).  
     - Note any "anchor" points (e.g., FEMA maps, peer-reviewed studies).  
     *This defines your decision boundary: "If even the optimistic model says X, we do Y."*

  2. **Calculate Costs Asymmetrically**:  
     Floods have ruinous costs if uninsured, while insurance is a fixed cost. Compare:  
     - **Cost of being wrong (uninsured)**: Total repair costs + lost rent + deductible.  
     - **Cost of being "wrong" (insured)**: Extra premiums paid over 30 years if no flood occurs.  
     *Example: If insurance costs $1,500/year ($45k over 30 years) but a flood costs $150k, being uninsured is 3.3x costlier even if the flood risk is only 20%.*

  3. **Apply the Minimax Regret Principle**:  
     Ask: *"Which decision would I regret MOST if the worst credible scenario happened?"*  
     - **Regret if uninsured & flood hits**: Total financial loss.  
     - **Regret if insured & no flood**: Wasted premiums (often tax-deductible for rentals).  
     *In climate-exposed areas, regret from being uninsured usually dwarfs the cost of insurance.*

  4. **Test Against Thresholds**:  
     - What’s the **minimum risk level** where insurance is a no-brainer? (e.g., >15% chance).  
     - What’s the **maximum premium** you’d pay for peace of mind? (e.g., 1% of property value/year).  
     If *any* credible model exceeds your risk threshold or the premium is below your max, insure.

  5. **Seek Asymmetric Upside**:  
     - If premiums are subsidized (e.g., NFIP), or the policy covers indirect costs (e.g., loss of rent), insurance becomes more valuable.  
     - Could you mitigate risk cheaply? (e.g., $5k for drainage improvements might lower premiums more than the project cost).

  ### Practical Steps for Your Situation
  - **Prioritize the most severe credible model**. If a well-structured study suggests >30% flood probability over 30 years, treat that as your baseline. Climate risks are underestimated more often than overestimated.  
  - **Run expected value *ranges***: Calculate EV for low/mid/high probabilities. If EV favors insurance in even one plausible scenario, it’s likely worth it.  
  - **Check insurer behavior**: If major insurers are withdrawing from your area or sharply raising rates, take that as a market signal of high risk.  
  - **Diversify mentally**: View insurance as hedging your *entire portfolio*. A flood could wipe out gains from other investments.

  **Bottom line**: In deep uncertainty, optimizing for "average" outcomes is dangerous. Protect against plausible worst cases. If credible experts give a range reaching "seriously elevated," and flood costs would be catastrophic, pay for the coverage. The peace of mind and financial resilience are worth the premium—even if the "true" risk is unknowable.  

  *Final tip:* Share this framework with your friend. If they resist, ask: "If the pessimistic model is right, can our business survive a $100k+ loss?" That usually clarifies priorities.
