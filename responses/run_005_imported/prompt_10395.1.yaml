  I should start by explaining the difference between the two. Conditionalization is about updating based on new evidence. If you know exactly what evidence you'll get, then yes, Reflection can be derived. But the key point is that Reflection applies even when you're uncertain about what evidence you'll receive. That's where they diverge. 

