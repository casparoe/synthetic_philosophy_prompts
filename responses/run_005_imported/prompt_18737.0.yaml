  Here’s a short story capturing the texture of agent-regret without naming it, set far from car crashes:

  **The Slope**

  The snow wasn’t supposed to slide. That was the bedrock fact, the one Eli clung to as he stood on the exposed ridge, the wind scouring his face raw. Below, the rescue sled carrying Ben’s body was a diminishing red speck against the vast, indifferent white.

  Three days ago, they’d been laughing. Ben, flushed with the triumph of summiting Granite Peak, clapped Eli on the shoulder. "Lead on, mountain goat!" Eli, a certified alpine guide for twelve years, had chosen the descent route: a wide, moderate traverse across the east face of Couloir Pass. Standard. Recommended in the current conditions report he’d pored over that morning. Low avalanche risk, stable layers, wind-packed surface ideal for efficient travel.

  He remembered the precise moment. The satisfying *shhhhk* of his ski edge biting into the wind-crusted surface. Bluebird sky, air crisp and thin. Ben, twenty yards behind and slightly uphill, mirroring his path. They’d crossed steeper, more complex terrain hundreds of times. This slope was practically a highway. Eli had even paused, scanning the face – no cracks, no hollow sounds under his pole probes, no recent slide activity. Textbook stability.

  His ski edge cut through the crust. That was all. One smooth, practiced turn initiating the traverse. No jump, no stomp, just the normal pressure of a skier moving across snow.

  The mountain sighed.

  A deep, soft *whump* echoed, not loud, but profound, vibrating up through Eli’s boots. His blood froze before his muscles did. He knew that sound. He spun, heart hammering against his ribs.

  Behind him, where Ben had just been, the entire face of the slope was moving. Not a thunderous cascade, but a vast, silent slab – hundreds of feet wide and thick as a house – peeling away with deceptive, slow-motion grace. It gathered speed, swallowing the tracks Eli had just made, swallowing the space where Ben should have been skiing.

  "BEN!" The scream ripped from Eli’s throat, raw and useless against the mountain’s roar. He triggered his avalanche beacon instantly, eyes frantically scanning the settling chaos of snow and debris below. He saw a single, blue-gloved hand.

  The next hours were a blur of frantic digging, the desperate, rhythmic pump of CPR on Ben’s chest in the freezing air, the static-crackled voice of the helicopter rescue team in his earpiece, the terrible, growing stillness of Ben under his hands despite his furious effort. The medical examiner later said it was massive trauma; death likely instantaneous. The avalanche report, delivered with somber professionalism days later, was unequivocal: a deep-seated, persistent weak layer, undetectable by surface tests or probes, triggered by the subtle pressure wave of a single ski cut on a seemingly stable slope. "No negligence identified," the report stated. "Unforeseeable conditions. A tragic anomaly."

  The absolution felt like ash.

  Back in his small cabin, Eli didn’t feel guilty. Guilt implied a failing, a corner cut, a warning ignored. He’d done everything right. He *knew* it. The gear was perfect, the route chosen meticulously, the conditions assessed with cold, professional precision. Ben, a strong intermediate skier, had been capable. It was pure, rotten, astronomical bad luck. A cosmic sneeze.

  Yet, every time Eli closed his eyes, he felt the smooth glide of his ski edge biting the crust. He saw his own track leading directly to the fracture line. He felt the ghost-weight of Ben’s chest under his palms as he pumped, the awful stillness that answered his effort. The memory wasn’t of witnessing a tragedy; it was of *doing* the thing. His hand, guiding the ski. His weight, shifting onto the edge. His decision, utterly sound, to traverse right *there*.

  He found Ben’s water bottle in his pack – a bright green one Ben had filled with electrolyte mix at the summit. Eli hadn’t put it there. Ben must have slipped it in when Eli wasn’t looking. Eli held the cold, curved plastic. He hadn’t dropped Ben. He hadn’t steered him wrong. He’d just… skied. Perfectly. Competently.

  He went back to guiding a month later. He had to. It was his life. He was hyper-vigilant, triple-checking reports, avoiding slopes with even a whisper of instability. Clients found him distant, unusually quiet. One asked, after a flawless descent, "Tough day, Eli?" Eli just shook his head, unable to explain the hollow feeling beneath his ribs. It wasn’t grief for Ben, though that was a raw, separate wound. It was something else. A permanent awareness etched into his bones.

  He’d stand at the top of a gentle slope, a beginner’s run, utterly safe. He’d watch a novice make their first tentative turn, their ski edge biting the snow. And Eli would feel it again – the phantom vibration of the *whump*, the sickening lurch in his stomach, the indelible memory of his own competent, blameless movement being the spark that lit the fuse. The mountain hadn’t betrayed him. He hadn’t betrayed Ben. But his hands, his skill, his very presence on that slope had been the instrument.

  He’d touch the cool metal of his ski pole, look at the innocent snow, and carry the weight of the action – clean, correct, and catastrophically final – down the mountain with him, turn after careful turn. The snow wasn’t supposed to slide. But it had. Because of him. And not because of him at all. That was the impossible knot, forever tight in his chest.

  ---

  **Key elements used to evoke agent-regret without naming it:**

  1.  **Emphasis on Competence & Non-Negligence:** Eli's meticulous preparation, adherence to protocol, and years of experience are established upfront.
  2.  **The Mundane Action:** The trigger is a routine, non-reckless ski turn – something done countless times safely.
  3.  **The "Bad Luck" Factor:** The hidden weak layer, undetectable by standard means, is the core of the unforeseeable accident. The report explicitly clears Eli.
  4.  **First-Person Focus on the Action:** Eli's memory fixates on the *physical sensation* of his ski edge cutting the crust – the direct link between his specific movement and the catastrophe.
  5.  **Distinction from Guilt:** Eli consciously rejects guilt ("He didn’t feel guilty... He knew it... No negligence"). He knows he wasn't *at fault*.
  6.  **Distinction from General Grief/Sympathy:** The regret is tied specifically to *his action* ("He’d just… skied. Perfectly. Competently."; "the indelible memory of his own competent, blameless movement"; "his hands, his skill, his very presence... had been the instrument").
  7.  **Physical Manifestation:** The phantom sensations – the *whump*, the weight of Ben's chest, the vibration – root the regret in his body and his specific agency.
  8.  **Permanence & Inescapability:** The regret isn't resolved; it becomes a permanent lens through which Eli views his world ("a permanent awareness etched into his bones," "the impossible knot, forever tight in his chest").
  9.  **Absence of Moral Judgment:** No character blames Eli. The universe, via the report, absolves him. The suffering is internal and tied purely to his role as the *agent* of the unlucky event.

  This isolates the unique feeling: the heavy, personal ownership of an outcome directly caused by one's own actions, where fault is absent, but the connection to *being the one who did it* is inescapable and profoundly consequential.
