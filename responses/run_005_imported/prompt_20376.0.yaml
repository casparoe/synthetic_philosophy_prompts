  The meta-knowledge question is subtle: does Aumann require agents to know priors are common? Follow-up should note that adding this knowledge might replicate CPA's work, making it redundant.

  Falsifiability is the grand finale. The guest might say "no possible evidence," but that admits CPA is non-empirical. Follow-up should corner them: if CPA can't be wrong, is it even a rationality claim?

  Other angles to include: whether CPA handles radical uncertainty (Knight vs. Keynes), if it demands unrealistic mental states (Savage critique), and how it explains human cognitive diversity. Each needs follow-ups piercing the "type space" shield.

