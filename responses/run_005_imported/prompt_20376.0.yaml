  First, I'll tackle the Aumann angle. The key is distinguishing whether agreement stems from common priors or common knowledge of posteriors. Follow-up should challenge the "partition refinement" dodge by asking how this doesn't reduce CPA to tautology.

  For the prior origin question, I'll emphasize that CPA assumes priors exist before evidence divergence. Follow-up must press on whether differing priors imply irrationality, contradicting CPA's premise.

