answer: |-
  Here's a referee's breakdown of each move, followed by my analysis of the core dispute:

  ### Move-by-Move Scoring (-2 = Major Misstep, +2 = Strong Point)
  **(1) Leo’s Opening Claim (-1)**  
  *Score Rationale*: Leo correctly identifies the "arbitrariness problem" in metaphysics (how do simples compose objects?), but overreaches by declaring composite objects *non-existent* as the "cleanest answer." This ignores functional reality and smuggles in a controversial ontological standard. (-1 for dismissing common-sense ontology as merely "loose" without justification).

  **(2) Marissa’s Rebuttal (+2)**  
  *Score Rationale*: Marissa nails the core issue: empirical evidence (laptop resting on table) must constrain metaphysics. If a theory denies obvious truths, the theory is flawed. This echoes G.E. Moore’s "Here is one hand" argument against radical skepticism. (+2 for exposing theory’s counterintuitive consequences and prioritizing evidence).

  **(3) Leo’s Retreat to "Loose/Strict" Senses (0)**  
  *Score Rationale*: Leo’s distinction between "loose" (everyday) and "strict" (metaphysical) existence is strategically clever but evasive. While "sun rises" is a useful analogy for linguistic pragmatism, it doesn’t resolve whether tables *really exist* in Leo’s intended sense. (0: avoids refutation but doesn’t advance his case).

  **(4) Marissa’s Taboo Move (+1.5)**  
  *Score Rationale*: Marissa correctly identifies that without semantic ambiguity, their *factual agreement* about particle arrangements leaves no disagreement. Her challenge to "stipulated" stricter existence exposes Leo’s move as verbal maneuvering. (+1.5 for effective dissolution strategy; -0.5 for slightly underestimating metaphysical stakes).

  **(5) Leo’s Ontological Commitment Defense (+0.5)**  
  *Score Rationale*: Leo salvages a substantive point: ontology isn’t *just* about words—it’s about whether reality includes "tables-as-irreducible-wholes." This survives tabooing ("Do particles *exhaust* reality?"). (+0.5 for identifying a residual question, but he still owes an argument for why nihilism is *true*, not just "cleaner").

  ---

  ### The Core Dispute: Verbal or Substantive?
  **It’s both**—but not in the way they think.  
  - **Verbal Aspect**: Marissa wins the *pragmatic* layer. In everyday contexts, "table exists" is unambiguously true (as Leo concedes). Tabooing "exists" reveals their agreement on particle arrangements and functional behavior.  
  - **Substantive Aspect**: Leo’s point survives as a *metaphysical* question: **Does reality have hierarchical levels?**  
    - **Leo’s Claim**: Only fundamental particles ("simples") exist; "tables" are just useful labels for particle configurations (anti-realism about composites).  
    - **Marissa’s Implicit Claim**: Tables *emerge* as real entities via their functional organization (realism about composites).  

  This isn’t resolvable by physics or logic alone—it’s about **ontological commitment**: What do we *owe* to the world’s structure?  

  ---

  ### What Neither Sees
  1. **Leo’s Blind Spot**:  
     - He confuses *epistemic convenience* ("cleanest answer") with *metaphysical truth*. Nihilism is elegant but ignores emergence: a table’s rigidity, affordances (holding laptops), and causal powers aren’t reducible to particle-wise descriptions without loss.  
     - His "stricter sense" of existence is question-begging—why privilege *simples* over functional wholes?  

  2. **Marissa’s Blind Spot**:  
     - She underestimates the *metaphysical cost* of realism. If tables exist, where do we "draw the line"? (Clouds? Piles of sand?) Her appeal to "obviousness" doesn’t solve the arbitrariness problem Leo raised.  

  3. **The Hidden Root**: **Explanatory Frameworks**.  
     - Leo adopts a *fundamentalist* view: only the micro-level is "real."  
     - Marissa adopts a *functionalist* view: macro-objects are real if they play causal roles.  
     This clash isn’t about tables—it’s about whether reality is "bottom-up" or admits "top-down" emergence.  

  ---

  ### Verdict
  - **Who "Wins"?** Marissa wins the *practical* dispute (tables exist for all human purposes). Leo’s nihilism is a metaphysical stance with no empirical advantage.  
  - **Survives Tabooing?** Yes—but only as a question about **ontological parsimony**: "Must we posit *composite objects* to fully describe reality, or are particles sufficient?" This is substantive but untethered to everyday truth.  
  - **Resolution Path**: Embrace **ontological pluralism**. Tables exist *as functional entities* in a macroscopic framework, while particles exist *as fundamental entities* in a quantum framework. Neither level is "more real"—they’re different descriptions for different contexts.  

  **Final Thought**: This isn’t just about furniture—it’s about whether human-scale reality is an illusion. Spoiler: your laptop isn’t floating in a particle void. The table’s stability is as real as gravity. Leo’s nihilism, if taken seriously, would make science and life incoherent. Marissa’s pragmatism keeps us grounded—literally. 🔨
