prompt: |-
  Ok so this happened at my ACX meetup's post-talk hangout and I haven't been able to stop chewing on it since. Two regulars, Leo and Marissa, got into an argument that started as a joke about flat-pack furniture and turned into a genuine fight about metaphysics, and neither one budged an inch.

  (1) Leo had just finished assembling a table and said, basically: "technically there's no table here, just wood particles arranged table-wise. If you try to actually specify which arrangements of matter compose a further single object and which don't, there's no non-arbitrary place to draw that line, so the cleanest answer is that composite objects like tables don't exist at all -- only the simples do." (2) Marissa said that's nuts, she's literally resting her laptop on the table right now, and no metaphysical argument gets to override something that obvious -- if his theory implies there's no table, thats a strike against the theory, not a discovery about tables. (3) Leo said fine, "there's a table" is true in the loose, everyday sense, the same way "the sun rises" is true in the loose sense, but there's a stricter sense of "exists" his claim is actually about, and ordinary talk was never trying to answer that stricter question. (4) Marissa said that's a dodge: if "there's a table" comes out true in some sense they both already accept and use constantly, then they don't disagree about any actual fact -- they agree on every detail about the particles and their arrangement -- and his "stricter sense" is just a definition he's stipulating, not something he discovered. She said they should just taboo "exists" and "there is," describe the particle arrangement directly, and watch the disagreement disappear. (5) Leo didn't accept that either: he said whether composition really happens isn't a question about which word to use, it's about whether reality contains tables as extra items over and above the particles, or whether talk of tables is just shorthand for facts that are entirely about particles -- and that question doesnt go away just because you stop saying "exists," you could ask it in any vocabulary you like.

  They went in circles for a solid twenty minutes before someone dragged the conversation elsewhere. I tried the standard "just taboo the word" move on this myself afterward and honestly couldn't tell if it settles anything here, which bugs me, because usually that move clears things up for me pretty fast.

  Could you referee this properly -- move by move, using my numbering, not just an overall impression -- and say who's got the better of each exchange? (Feel free to slap a -2 to +2 score on each move if that helps organize your thinking, I won't complain.) Then, separately, give me your actual take: is this a merely verbal dispute wearing a metaphysical costume, or is there a substantive disagreement in here that survives Marissa's tabooing move -- and either way, what do you think neither Leo nor Marissa is seeing?
