  First, I need to recall Williamson's core argument structure. The margin-for-error principle seems crucial - knowing requires being safe from error across close possibilities. The sorites-like setup with gradual changes creates boundary problems. Pain seems different from feeling cold because it's binary and intense, but is that really true?

