answer: |-
  Here’s a steelmanned case for why a consistent deprivationist should reject McMahan’s time-relative interest account (TRIA) and accept that an infant’s death is at least as bad as a young adult’s—arguably worse—despite intuitions to the contrary:

  ### The Core Deprivationist Commitment
  Deprivationism’s central claim is: **Death is bad because it permanently deprives you of the valuable experiences, projects, and relationships you would have had if you’d lived.** The magnitude of harm depends *solely* on the *quantity and quality of future goods lost*, not on your psychological state *at the time of death*. Once you accept this, TRIA becomes an inconsistent compromise.

  ### Why TRIA Undermines Deprivationism
  1.  **The "Quantity of Goods" Primacy:**
      *   If the badness of death is defined by *deprivation of future goods*, then the infant—who loses 80+ years of potential life—is deprived of vastly more than the young adult who loses 60 years. TRIA’s psychological connectedness modifier doesn’t reduce the *objective quantum of lost goods*; it only reduces the *weight* assigned to them based on the victim’s *current* psychological state.
      *   **Steelman of TRIA:** McMahan argues that what matters *to the individual* isn't just abstract future goods, but goods *they can anticipate, care about, and integrate into their ongoing narrative*. An infant lacks the cognitive capacity to value or project itself into a distant future, so losing that future isn't a profound loss *to its present self*. The young adult, deeply connected to their imminent future plans, suffers a more wrenching disruption *from their current perspective*.
      *   **Deprivationist Reply:** This confuses *the experience of anticipating loss* with *the loss itself*. The deprivationist harm occurs *regardless of whether it is foreseen or felt*. TRIA smuggles in an experiential or phenomenological element ("how connected do I *feel* to my future?") that pure deprivationism explicitly rejects. The infant is still *objectively deprived* of 80 years of joy, learning, and love, even if it couldn't conceptualize that future.

  2.  **The Timing Puzzle Parallel:**
      *   Deprivationists already accept that the harm of death isn't located at a specific experiential moment (pre-mortem fear, post-mortem non-existence). The harm is a *relational fact* about the counterfactual good life cut short. It’s "timeless" or "atemporal."
      *   **Biting the Bullet:** If we accept this atemporal harm for the adult, consistency demands we apply it equally to the infant. Adding TRIA’s psychological connectedness condition creates an *arbitrary asymmetry*. Why privilege the psychological state *at the time of death* for determining the weight of the future loss, when the deprivation itself is defined counterfactually and timelessly? The infant’s future self—the one who *would have been* connected to its past and future—is equally deprived.

  3.  **Diagnosing the Intuition TRIA Saves (and Why It's Misleading):**
      *   **Intuition:** "The young adult's death *feels* worse than the infant's."
      *   **Deprivationist Diagnosis:** This intuition confuses *sympathetic grief*, *salience of lost potential*, and *projected narrative disruption* with the *badness-for-the-victim*.
          *   **Sympathetic Grief:** We grieve the loss of a known person with established relationships and visible potential more acutely than an unknown infant. This is about *our* loss, not necessarily the infant’s greater objective deprivation.
          *   **Salience of Lost Potential:** The young adult’s specific, concrete plans (career, family) are vivid to us. The infant’s potential is vast but abstract and undifferentiated. Vividness ≠ magnitude of loss.
          *   **Projected Narrative:** We easily project a continuous, rich narrative onto the young adult. Projecting an 80-year narrative onto an infant is harder; we might unconsciously discount it. We are biased toward valuing psychologically rich *present* selves over potential *future* selves.
      *   **The Infant's Actual Loss:** The infant loses *all* stages of life: the intense connections of childhood, the autonomy and ambition of adulthood, the reflection of old age. The young adult loses only the later stages. Deprivationism values the *whole possible life*, not just the phase matching the victim's current psychological profile.

  ### The High Cost of TRIA: Dementia, Amnesia, and Dissociation
  Accepting TRIA to save the "young adult worse than infant" intuition forces awkward, potentially repugnant conclusions in other cases where psychological connectedness is eroded *without death*:

  1.  **Advanced Dementia:**
      *   **TRIA Implication:** As dementia progresses, psychological connectedness to past and future selves radically weakens. TRIA suggests that *killing* a person with severe dementia is *less bad for them* than killing a cognitively intact person, as they have weaker time-relative interests in their (limited) future goods.
      *   **Problem:** This risks devaluing the lives of the cognitively impaired. It implies their deaths are less tragic *for them*, potentially undermining protections. A deprivationist simply says: killing the dementia patient still deprives them of whatever remaining positive experiences (comfort, fleeting moments of connection, sensory pleasures) they would have had.

  2.  **Severe Amnesia/Dissociation:**
      *   **TRIA Implication:** Someone experiencing profound dissociative amnesia (losing core autobiographical memory/identity) has drastically reduced psychological connectedness to their past self. TRIA suggests that if they died *during* this episode, their death would be significantly *less bad for them* than if they died before the amnesia struck.
      *   **Problem:** This seems deeply counterintuitive. The amnesiac might still have rich experiences, form new connections, and enjoy a future life. Depriving them of *that* future seems just as bad as depriving their pre-amnesiac self. TRIA implausibly makes the badness of death contingent on a transient psychological state. Deprivationism holds the harm constant: it's the loss of future good experiences, regardless of current memory links.

  3.  **Temporal Discounting Slippery Slope:** If we accept that weaker psychological connectedness reduces the badness of death, where do we stop? Is death less bad during deep, dreamless sleep? Under general anesthesia? During a coma? TRIA needs complex thresholds to avoid absurdity (e.g., death being harmless in deep sleep). Deprivationism avoids this by anchoring badness solely in the counterfactual future lost, independent of current consciousness or connectedness.

  ### Conclusion: Consistency Over Intuition
  The consistent deprivationist must bite two bullets: the timing bullet (accepting timeless harm) *and* the infant/adult bullet (accepting that death is objectively worse the *more* future good life it steals). TRIA offers intuitive comfort but at a high philosophical and ethical cost:

  1.  **Inconsistency:** It grafts a psychological-state-dependent condition onto a theory fundamentally about counterfactual goods.
  2.  **Arbitrariness:** It privileges the psychological profile at the *moment of death* for weighting the value of the entire lost future.
  3.  **Repugnant Corollaries:** It implies reduced harm in killing people with dementia, severe amnesia, or other conditions eroding psychological connectedness, devaluing vulnerable lives.
  4.  **Misattribution:** It fails to distinguish between the *objective magnitude of deprivation* and the *salience of the loss to observers* or the *victim's anticipation*.

  Swallowing the "infant death is worse" bullet is less costly than it seems once we recognize our intuitions often track grief, projection, and narrative salience rather than pure deprivation. Meanwhile, TRIA forces us to swallow far more dangerous bullets regarding cognitive impairment. For a deprivationist committed to the core principle that death's badness lies in *losing life itself*, the quantity of life lost must be paramount. The infant, losing more years, suffers the greater deprivation.
