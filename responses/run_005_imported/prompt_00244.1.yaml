answer: |-
  Your character's use of the Doomsday Argument is **conceptually correct**, but getting to a specific "60-90 years" requires **manipulating the assumptions** – which is perfect for a doomsday cultist! Here's the airtight math she'd use, the necessary distortions, and how critics would attack it:

  **Core Doomsday Argument Logic (Airtight Part):**
  1.  **Premise:** Assume you are a random human among all humans who will *ever* exist (N total).
  2.  **Your Rank:** Your birth rank (n) is approximately 117 billion (humans born before you).
  3.  **Probability:** There's a 95% chance you are *not* in the first 2.5% or the last 2.5% of all humans (the "Copernican Principle").
  4.  **Calculation (95% Confidence Interval):**
      *   Lower Bound (Avoid being in the last 2.5%): n ≤ 0.025 * N → N ≥ n / 0.025
      *   Upper Bound (Avoid being in the first 2.5%): n ≥ 0.025 * N → N ≤ n / 0.025
      *   **Therefore, with 95% confidence:** n / 0.025 ≤ N ≤ n / 0.025 → **N ≤ n / 0.025 = n * 40**
  5.  **Plug in n:** N ≤ 117,000,000,000 * 40 = **4,680,000,000,000** (4.68 Trillion total humans ever).
  6.  **Future Humans:** Future Humans = Total Humans (N) - Humans Born So Far (n)
      *   Max Future Humans = 4,680,000,000,000 - 117,000,000,000 ≈ **4,563,000,000,000**

  **The Cultist's Twist (Getting to 60-90 Years):**
  This is where your physicist-turned-cultist **abandons scientific rigor** for doomsday prophecy. The argument gives a number of *future humans*, not a *timeline*. To get a timeline, you **must assume a future birth rate**. This is her critical distortion:

  1.  **Reject Declining Birth Rates:** She dismisses UN projections showing slowing population growth/decline later this century. "Optimistic nonsense! We're headed for collapse!"
  2.  **Invoke Peak Birth Rates:** She uses the **highest annual birth rates in human history** as the "baseline" for the future.
      *   Peak global births occurred around **1990, at roughly 140 million per year** (140,000,000).
  3.  **Ignore Carrying Capacity:** She assumes this peak rate continues *unchanged* until the last human is born, ignoring resource depletion, famine, war, etc. (Ironically, the things she predicts!).
  4.  **Calculate Time:** Time = Future Humans / Annual Birth Rate
      *   Time = 4,563,000,000,000 / 140,000,000 ≈ **32,593 years**

  **32,000 years isn't 90!** So she adds a **second, even more critical distortion:**

  5.  **The "Imminent Collapse" Premise:** "But the Doomsday Argument only tells us the *maximum* number! The *median* estimate is far more probable! Carter and Leslie showed the *most likely* N is 2*n. And science *itself* proves we can't sustain 140 million births/year for even a century longer! Look at climate models, resource depletion, biosphere collapse! Birth rates *will* plummet catastrophically within decades. Our true sustainable future birth rate is negligible! Therefore, the *effective* number of future humans will be born in a very short window before collapse. **Assume an average of only 1-2 billion humans are born AFTER the coming collapse begins!**"

  **Her Final Calculation (The Stage Moment):**
  "Ladies and Gentlemen of the Conference, the mathematics of our existence is chillingly clear:
  1.  My birth rank: n ≈ 117 billion.
  2.  Applying the Copernican Principle via Bayes: With 95% confidence, total humans ever, N ≤ 117 billion / 0.025 = 4.68 trillion.
  3.  Future humans: ≤ 4.56 trillion.
  4.  **Naïve Timeline:** At peak historical birth rates (140 million/year), this suggests ~32,000 years. A false comfort!
  5.  **Reality Check:** Earth systems are collapsing *now*. IPCC, IPBES – the warnings scream! We *cannot* sustain current populations, let alone growth. Birth rates *will* collapse alongside civilization.
  6.  **The True Probability:** Given the *certainty* of near-term ecological-economic-social collapse, the *relevant* future population is those born *between now and collapse*. The median Doomsday estimate (N=2n=234B) suggests only ~117B future humans. Collapse science dictates this will happen rapidly.
  7.  **Conclusion:** **There is a 95% probability that the total human experiment encompasses fewer than 4.68 trillion souls. Given the *overwhelming evidence* that civilization collapses within this century, forcing birth rates effectively to zero, this translates directly to a >95% probability that Doomsday occurs within the lifetime of children born today – within the next 60 to 90 years.** Probability isn't just math; it's the logic of existence meeting the physics of collapse!"

  **Why it *Sounds* Airtight (But Isn't):**
  1.  **Correct Core Math:** The 95% CI calculation for N based on n is mathematically sound *given the premise* of being a random sample.
  2.  **Appeals to Authority:** Cites Bayes, Copernican Principle, Carter, Leslie, IPCC, IPBES.
  3.  **Mixes Truth & Doom:** Correctly states the birth rank and peak birth rate. Correctly states the existential threats.
  4.  **Plausible (but Distorted) Link:** Links the *maximum possible humans* to the *imminence of collapse* to force the short timeline. The leap is from "maximum humans" to "imminent end of births," hand-waving the actual timeline calculation.

  **How Critics Would Poke Holes (Your Friend's "Reference Class"):**
  *   **The Reference Class Problem:** "Who counts as 'human'? *Homo sapiens* 200,000 years ago? Only anatomically modern humans? Only since agriculture? Only humans in civilizations? Including Neanderthals? The birth rank 'n' changes *dramatically* based on this definition! If you include early *Homo* with much lower birth rates, 'n' could be trillions, making your 4.68 trillion future humans trivial! Your whole calculation rests on an arbitrary definition!" (This is the strongest critique).
  *   **The Constant Rate Fallacy:** "Assuming the *absolute peak historical birth rate* continues unchanged for millennia is absurd, especially while simultaneously predicting collapse! If collapse is coming, use a *projected declining rate model*, not the peak!"
  *   **The Imminent Collapse Distortion:** "You've rigged the game! The Doomsday Argument gives a number of *humans*. You then *separately assert* collapse will happen in 90 years *and* that it will mean zero future births after that. The DA doesn't *predict* the collapse date; you grafted that on using cherry-picked evidence. Your 95% applies to the human count, *not* your collapse timeline."
  *   **Ignoring the Lower Bound:** "Your 95% CI also says N ≥ 117B / (1 - 0.025) ≈ 117B / 0.975 ≈ 120 Billion. We've almost reached that! The DA only says we *probably* aren't *very* early. It doesn't forbid us from being *extremely* early! Humanity could last for millions of years with low birth rates."
  *   **The Gambler's Fallacy Analogy:** "It's like walking into a casino and saying 'I'm probably not the first or the last gambler ever, therefore the casino will probably close soon after I leave.' It ignores the actual mechanisms (the house rules, the economy) determining how long the casino stays open."

  **For Your Scene:**
  Give your character the **core calculation (Steps 1-4)** verbatim. Have her state the peak birth rate factually. Then have her pivot **dramatically** to the collapse argument, **asserting** the link between the maximum humans and the imminent end of births as a consequence of collapse. The power comes from her **conviction** in the distortion, not the rigor of the timeline calculation itself. The "60-90 years" comes from her interpretation of climate/collapse science, *not* directly from the DA math. The DA math provides the "95% chance" for the total human count; her collapse narrative provides the "within 60-90 years."

  This makes her argument terrifyingly plausible to a lay audience at the conference (mixing real math with real threats) but gives your critical characters clear lines of attack (Reference Class, rate assumption, conflation of count with timeline).
