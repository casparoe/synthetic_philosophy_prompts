answer: |-
  You've hit on a fundamental and subtle point that often troubles technically-minded people encountering the Church-Turing Thesis (CTT) for the first time. Your intuition about the *equivalence proofs* is spot-on, but the reason CTT remains a "thesis" and not a "theorem" lies in a crucial distinction: **the difference between *mathematical equivalence* of formalisms and the *philosophical claim* about an informal concept.**

  Here's a breakdown of why CTT isn't considered proven:

  1.  **The Core Distinction: Formal Systems vs. Informal Concept**
      *   **What *is* Proven Mathematically:** It's a rigorous theorem that the class of functions computable by Turing Machines (TMs), the class of functions definable in the Lambda Calculus (λ-calculus), and the class of General Recursive Functions (GRFs) are **identical**. This is a result *within mathematics* about specific formal systems.
      *   **What CTT Claims:** CTT asserts that **any function that could be naturally regarded as "computable" or "effectively calculable" by any means whatsoever (using algorithms, mechanical procedures, physical processes, etc.) is computable by a Turing Machine (or equivalently, by λ-calculus or GRFs).**

  2.  **The Gap: Bridging Formalism and Intuition**
      *   The problem is that "computable" or "effectively calculable" is **not a formally defined mathematical term.** It's an *informal, intuitive concept* grounded in our understanding of what a human following a finite set of rules with finite means (pencil and paper, an abacus, etc.) could potentially calculate, given enough time and resources.
      *   CTT proposes that the *formal* concepts developed by Turing, Church, and Kleene (TMs, λ-calculus, GRFs) **perfectly capture** this *informal* concept.
      *   **The Equivalence Proofs Don't Directly Address This:** Proving TM = λ-calculus = GRFs shows these formalisms are *equivalent to each other*. It doesn't *prove* that any of them is equivalent to the *informal* notion of computability. They are all rigorous mathematical models; the question is whether any of them is the *right* model for the intuitive idea.

  3.  **Why It's Fundamentally Unprovable (in the Strict Mathematical Sense)**
      *   **No Formal Target:** To prove CTT as a theorem, you would need a rigorous, universally accepted *formal definition* of the informal concept "computable function" *independent* of TMs, λ-calculus, or GRFs. Only then could you attempt to prove that this independent definition is equivalent to TMs. But such an independent formal definition doesn't exist. Any attempt to formalize "computable" risks either being circular (implicitly assuming CTT) or creating yet another formalism whose equivalence to the intuitive concept would *itself* need justification.
      *   **Universality Claim:** CTT makes a claim about *any conceivable model of computation*, including ones we haven't invented yet or ones based on physics we don't fully understand. Mathematics can prove things about specific formal systems, but it can't *prove* that no future, radically different model will ever exceed the power of TMs. We can only show that all *proposed* models so far fall within the TM-equivalence class.
      *   **Empirical/Philosophical Nature:** Ultimately, CTT rests on:
          *   **Empirical Evidence:** Decades of attempts to find a convincing counterexample (a function humans agree is intuitively computable but provably not TM-computable) have failed. Every serious computational model proposed has been shown equivalent to TMs.
          *   **Turing's Analysis:** Turing's original paper provided a profound conceptual analysis of human computation, arguing convincingly that any step-by-step procedure a human could follow could be simulated by a TM. This analysis is persuasive but not a formal mathematical proof.
          *   **Lack of Counterarguments:** No coherent alternative characterization of "computable" that excludes some TM-computable functions or includes some non-TM-computable functions has gained widespread acceptance.

  4.  **The Status Quo and Why It's Called a "Thesis"**
      *   **Widely Accepted:** CTT is accepted as true by virtually all logicians, computer scientists, and mathematicians. It's the bedrock foundation of theoretical computer science.
      *   **Functional Axiom:** It's treated *as if* it were an axiom. We use it to define the boundaries of computability theory, prove undecidability results (e.g., the Halting Problem), and analyze complexity classes (all defined relative to TM equivalence).
      *   **Acknowledgment of its Epistemic Status:** Calling it a "thesis" is an honest acknowledgment that while the evidence for it is overwhelming, its truth rests on arguments that are ultimately philosophical, empirical, and based on the analysis of concepts, rather than being derivable purely from mathematical axioms.
      *   **Distinguishing Proven Equivalence from Conceptual Claim:** Textbooks use "thesis" to clearly distinguish the *unprovable conceptual claim* (CTT) from the *provable mathematical equivalences* (TM = λ-calculus = GRFs).

  **What *is* Open? (The Nuance)**

  While the core claim of CTT (that TM-computability = intuitive computability) is considered settled *for all practical and theoretical purposes within standard mathematics and computer science*, the "openness" lies in more philosophical or speculative realms:

  1.  **Hypercomputation:** Are there physically realizable processes (e.g., exploiting hypothetical aspects of quantum gravity, analog systems with infinite precision, oracles accessing non-computable data) that *could* compute functions beyond the TM limit? CTT says *no* if we stick to finite, discrete, step-by-step procedures. Hypercomputation research explores models that *violate* CTT, but whether they are physically meaningful or coherent is highly contentious. CTT acts as the null hypothesis.
  2.  **Nature of Computation:** Does CTT fully capture computation *as it occurs in the physical universe*? Or is physical computation richer? (This often overlaps with hypercomputation discussions).
  3.  **Conceptual Analysis:** Are there alternative, equally compelling analyses of "effective calculability" that might differ subtly from Turing's? (No serious contenders exist, but the possibility remains a philosophical point).
  4.  **Foundations of Mathematics:** Some discussions link CTT to broader questions about the foundations of mathematics (e.g., finitism, constructivism).

  **In Summary:**

  You are absolutely right that the *equivalence of the major formalisms* (TMs, λ-calculus, GRFs) is a rigorously proven **theorem**. The Church-Turing Thesis, however, is the **conjecture** that this specific class of functions defined by these equivalent formalisms *is identical to* the informal, intuitive class of "computable functions." This identity claim bridges the gap between precise mathematics and intuitive human understanding, making it fundamentally unprovable in the strict mathematical sense, despite being overwhelmingly supported by evidence and universally accepted. Calling it a "thesis" accurately reflects this unique epistemological status.
