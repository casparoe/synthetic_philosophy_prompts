answer: |-
  That's a fascinating observation and a genuinely insightful question about intellectual history. Your intuition about a connection between Fletcher's situation ethics and the Harman/Doris situationist critique is perceptive – there *is* a deep resonance. However, it's crucial to distinguish genuine lineage from a powerful conceptual parallel. Here's a breakdown:

  **The Compelling Parallels (Why You're Right to See Connection):**

  1.  **Core Target:** Both explicitly target a perceived rigidity in ethical frameworks.
      *   **Fletcher:** Targets "legalism" (rigid adherence to moral rules/laws) and "antinomianism" (lawlessness/rejection of any rules). He rejects both for being insensitive to context.
      *   **Harman/Doris:** Target the Aristotelian conception of "robust" character traits – stable dispositions that reliably cause virtuous behavior across diverse situations. They argue this conception is empirically unsupported.
  2.  **The Primacy of the Situation:** Both elevate the *situational context* to primary importance in determining ethical action or explaining behavior.
      *   **Fletcher:** The *agapeic* (loving) action is determined solely by the concrete situation; no pre-existing rule can guarantee the right action. "The situation *is* the norm."
      *   **Harman/Doris:** Behavior is overwhelmingly determined by features of the immediate situation (like bystanders, authority figures, time pressure, ambient smells) rather than by stable internal traits. What we call "character" is often just a post-hoc explanation for situationally driven behavior.
  3.  **Critique of "Fixedness":**
      *   **Fletcher:** Rejects fixed rules as inadequate guides for the complexities of real life. Love must be free to respond to the unique demands of each moment.
      *   **Harman/Doris:** Reject the fixedness of character traits as empirically inaccurate psychological entities. People aren't consistently honest or courageous; they are honest *in some types of situations* and cowardly in others.
  4.  **Terminology:** Your point about Fletcher using "situationism" decades earlier is historically accurate and highlights the shared core concept – the *situation* as the decisive factor.

  **Why It's Likely *Not* Direct Lineage (The Crucial Distinctions):**

  1.  **Foundational Aims & Domains:**
      *   **Fletcher:** A **theological ethicist** within **Christian ethics**. His goal is *prescriptive*: to provide a method (love applied situationally) for making morally good *decisions*. It's a normative theory about *what we ought to do*.
      *   **Harman/Doris:** **Philosophers of mind/psychology** engaging with **virtue ethics**. Their goal is primarily *descriptive* and *critical*: to use empirical psychology to challenge the *existence* of the kind of character traits (robust virtues) that Aristotelian virtue ethics *presumes* and relies upon. It's a critique of the *psychological foundations* of a normative theory.
  2.  **The Core Concept:**
      *   **Fletcher:** Centers on **"agape" (neighbor-love)**. This is the *sole* intrinsic good and the only universal principle. The situation determines *how* love is best expressed. It's fundamentally about *deliberation* and *action*.
      *   **Harman/Doris:** Center on **empirical findings in social psychology** (Milgram, Darley & Batson's Good Samaritan, Zimbardo, Asch, etc.). They argue these experiments demonstrate the *power of situational variables* to override presumed internal dispositions. It's fundamentally about *explanation* and *attribution* of behavior.
  3.  **Relationship to Rules/Traits:**
      *   **Fletcher:** Doesn't necessarily *deny* the existence of character; he downplays the relevance of *rules* in favor of a *single guiding principle* (love) applied situationally. Rules are only "illuminators" or "provisional summaries" of past loving acts, not binding laws.
      *   **Harman/Doris:** Directly attack the *existence* of robust, cross-situationally consistent *character traits* as traditionally conceived. They argue virtues, understood as stable dispositions, are largely mythical.
  4.  **Methodology:**
      *   **Fletcher:** Theological reasoning, casuistry (case studies), philosophical argument.
      *   **Harman/Doris:** Reliance on experimental social psychology and philosophical analysis of its implications for ethical theory.

  **Conclusion: Parallel, Not Lineage (But Your Plan is Still Good!)**

  You are absolutely correct that both are forms of "situationism" in the broadest sense: they powerfully argue that context is paramount and that fixed frameworks (rules for Fletcher, traits for Harman/Doris) fail to capture the reality of ethical life. The parallel is profound and intellectually stimulating.

  However, it's unlikely that Harman and Doris were *directly transplanting* Fletcher's theological situation ethics onto virtue ethics. Their critique emerges primarily from engagement with 20th-century social psychology and its perceived challenge to Aristotelian assumptions about character, not from Fletcher's theological project. The shared terminology is more coincidental (highlighting the core concept) than indicative of direct influence.

  **Why Your Reading Plan is Excellent Nonetheless:**

  1.  **Conceptual Grounding:** Fletcher provides a *powerful, accessible, and prescriptive* model of how to *think situationally* about ethics. His arguments against rigid rules are structurally similar to arguments against rigid traits. Reading him will sharpen your understanding of the *logic* of prioritizing context.
  2.  **Contrast is Illuminating:** Seeing how Fletcher *uses* situational thinking to *ground* a positive ethical principle (love) will provide a stark and valuable contrast to Harman/Doris, who use situational thinking to *undermine* a foundational element (robust traits) of an existing ethical theory. This contrast deepens understanding of both.
  3.  **Historical Context:** Fletcher represents a significant 20th-century challenge to rule-based ethics *from within* a religious framework. Understanding this helps map the broader landscape of ethical thought that Harman/Doris later engaged with, even if not directly.
  4.  **Foundations for Critique:** Fletcher's focus on the unique demands of the concrete situation prepares you to engage critically with Harman/Doris. You'll be better equipped to ask: Does their empirical critique *necessarily* destroy virtue ethics, or does it force a reformulation (e.g., towards "local" traits or emphasizing practical wisdom/phronesis as situationally responsive)? Fletcher shows one way ethics can be situational without being arbitrary.

  **In short:** You've identified a brilliant and meaningful conceptual parallel, but not a direct lineage. Fletcher's situationism isn't the *source* of Harman/Doris's situationism. However, reading Fletcher first is an **excellent strategy**. It will give you a rich, normative understanding of ethical situationism that will provide invaluable conceptual tools and a contrasting perspective when you turn to the descriptive, critical project of Harman and Doris. It will help you see both the deep appeal *and* the potential pitfalls of taking situations seriously in ethics. Proceed with your plan – it's intellectually sound and promises a deeper understanding of both traditions.
