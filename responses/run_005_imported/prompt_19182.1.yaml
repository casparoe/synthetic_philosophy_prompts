  The user wants a concrete comparison, not diplomacy. So, I should focus on the identity statement puzzle and substitution failure. For Frege, "Hesperus is Phosphorus" is informative because the senses differ. Salmon says the proposition is the same, but guises explain the cognitive difference pragmatically.

  Where's the real asymmetry? Compositionality is a big one. Fregean senses compose systematically; guises don't. Also, shareability: senses are public, guises are private. And what's part of semantics vs. pragmatics. For Frege, sense is semantic content; for Salmon, it's the Russellian proposition, with guises handling the rest pragmatically.

  The user mentioned the "trenchcoat" charge. I need to show if relabeling senses as guises buys anything. Salmon's approach avoids multiplying semantic content, keeping it extensional. But it shifts the explanatory burden to pragmatics. That might be a trade-off, not a clear win.

  Also, the user wants specifics. So pointing out that guises are psychological entities tied to cognition, while senses are abstract. That affects how beliefs are reported. In Salmon's view, both sentences are true, but the guise explains why we might deny one. 

  I should check if there are weaknesses. Salmon's pragmatic story might feel ad hoc. Frege handles it semantically but at the cost of more complex semantics. The user might care about theoretical parsimony or psychological plausibility. 

  Finally, conclude which account is better. For semantic purity, Frege. For simplicity in semantics with pragmatic heavy lifting, Salmon. But the trenchcoat charge has some merit—guises do similar work, just relocated. The key difference is where the work happens and compositionality.
answer: |-
  You've hit on one of the deepest fault lines in 20th-century philosophy of language, and your "trenchcoat" charge is razor-sharp. Let's cut through the diplomacy: **Salmon's view is a genuine rival to Frege's, but the asymmetry comes at a significant cost, and your intuition about relocated work is largely correct.** Here's the principled breakdown:

  ### Core Differences (Where the Asymmetry Lies)
  1.  **Ontology & Location in Theory:**
      *   **Frege:** Senses are **abstract, objective, third-realm entities**, part of the *semantic content* of expressions. They are *public meanings* – the "mode of presentation" is literally *what the name means*. "Hesperus" and "Phosphorus" have *different semantic values* (their senses), even though those senses determine the same reference.
      *   **Salmon:** Guises are **psychological, concrete (token) entities** – specific ways a particular individual *cognitively grasps* a referent. They belong to *pragmatics/psychology*, not semantics. The semantic content of "Hesperus" and "Phosphorus" is *identical*: just Venus. The BEL relation includes this bare proposition *plus* a guise as separate relata.

  2.  **Compositionality & Semantic Content:**
      *   **Frege:** The sense of a sentence (a Thought) is compositionally built from the senses of its parts. "Hesperus is Hesperus" and "Hesperus is Phosphorus" express *different Thoughts* (different semantic contents), explaining the difference in informativeness/cognitive significance *semantically*.
      *   **Salmon:** The semantic content of a sentence (the proposition expressed) is compositionally built *only* from the referents of its parts (objects, properties, relations). Both "Hesperus is Hesperus" and "Hesperus is Phosphorus" express the *identical, trivial Russellian proposition*: <Venus, Identity, Venus>. The difference in informativeness/cognitive significance is *not* captured at the level of semantic content; it's entirely outsourced to the pragmatics of guises in the BEL relation.

  3.  **Shareability & Publicness:**
      *   **Frege:** Senses are (ideally) *public and shareable*. Competent speakers of the language grasp (or can grasp) the sense of "Hesperus" – it's the public meaning associated with the name as "the evening star". Different speakers can grasp the *same* sense.
      *   **Salmon:** Guises are fundamentally *private and idiosyncratic*. My way of thinking about Venus (e.g., via a visual image, a descriptive cluster, a causal chain traceable to an evening sighting) is likely different from yours, and even different from my own way at different times. The BEL relation uses *the specific guise the believer employs*. There's no requirement that guises be public or shared.

  4.  **"What is Said" (Semantic Content) vs. Implicature:**
      *   **Frege:** The difference in informativeness *is* a difference in "what is said" (the expressed Thought). "Hesperus is Phosphorus" says something different (and informative) compared to "Hesperus is Hesperus".
      *   **Salmon:** "What is said" (semantically expressed) by "Hesperus is Phosphorus" is the trivial proposition <Venus, Identity, Venus>. The intuition that it's informative is *not* about "what is said" but is a *pragmatic implicature* generated by the speaker conveying *which guise* is salient or relevant in the context (e.g., conveying that the Hesperus-guise and Phosphorus-guise are distinct for the believer or in the conversation). The *semantic content* is identical to the trivial identity.

  ### Addressing the Trenchcoat Charge
  Your charge has significant force. **Both theories posit an intermediary cognitive/modal layer between the linguistic expression and the referent to explain cognitive significance.** However, calling it *just* a trenchcoat undersells the *principled relocation* Salmon achieves:

  *   **What's Bought:** Salmon gains a radically simpler, purely extensional *semantics*. Reference is direct, compositionality operates solely on referents, and the semantic content of names and identity statements is straightforward. He avoids multiplying semantic entities (distinct senses for co-referring names) and avoids the problems of defining public senses for proper names (which Kripke's arguments heavily target). The semantics handles reference and truth-conditions cleanly.
  *   **Cost of Relocation:** The explanatory burden for cognitive significance, informativeness, and substitution failures in attitude reports is shifted *entirely* to pragmatics/psychology. The BEL relation becomes complex, and the pragmatic story about how guises generate implicatures (especially explaining the strong intuition that "Lois believes Clark Kent can fly" is *false*) can feel ad hoc or less systematic than Frege's semantic solution. The privacy of guises makes analyzing communication and shared understanding more complex.

  ### Which Gives the Better Account?
  There's no uncontested "winner," as the choice hinges on theoretical priorities:

  1.  **For Capturing Cognitive Significance Semantically:** **Frege wins.** His solution directly builds the explanation for informativeness and substitution failure into the *literal meaning* ("what is said"). Salmon relegates this core phenomenon to pragmatics, which feels like explaining away the data rather than capturing it semantically.
  2.  **For Simplicity & Purity of Semantics:** **Salmon wins.** His semantics is lean, referential, and avoids Frege's problematic ontology of public senses for names. It aligns better with a direct reference view of names and a Russellian view of propositions as structured referents.
  3.  **For Handling Belief Reports:** **Toss-up, with major caveats.**
      *   Frege gives a cleaner *semantic* account of why substitution fails (different senses in the embedded clause).
      *   Salmon gives a unified *semantic* account of the proposition believed (it's always the Russellian one), explaining why both reports can be *strictly speaking true* if Lois accepts the proposition under *any* guise. His pragmatic story *aims* to explain the false intuition, but its success is debated. Is the implicature strong enough to explain why we confidently judge the Clark Kent report *false*? Many find it strained.

  **Verdict on the Trenchcoat:** It's not *just* a trenchcoat. Salmon fundamentally relocates Frege's explanatory mechanism from public semantics to private psychology/pragmatics. This relocation **buys a simpler semantics** but **sells off the direct semantic explanation of cognitive significance**. Whether that's a good trade depends on whether you prioritize lean semantics or think cognitive significance *must* be explained semantically. Your charge highlights that Salmon still needs *something like* senses to do the explanatory work; he just insists they aren't part of meaning. Marco is right about the ontological difference (abstract meaning vs. psychological particular), but you're right that the *functional role* in solving the puzzle is remarkably similar, just operating in a different theoretical module. The deepest asymmetry is **compositionality**: senses compose the thought; guises are tacked onto the BEL relation *after* the proposition is composed referentially. That's the core architectural divergence.
