answer: |-
  You've hit on a crucial and remarkably modern passage! Bentham is indeed dissecting the psychology of moral disgust and its disconnect from actual harm – a radical argument for 1785. Let's break down his logic step-by-step and address your questions:

  **Bentham's Core Argument (Step-by-Step):**

  1.  **The Punishment's Real Source:** Laws punishing "unnatural" acts (like homosexuality) stem primarily from the personal **antipathy (disgust/revulsion)** felt by those in power, not from demonstrable harm.
  2.  **Physical vs. Moral Antipathy:** He distinguishes:
      *   **Physical Antipathy:** Personal disgust ("This act is odious and disgusting *to me*"). *Bentham argues this is irrelevant to morality.* Just because *you* find something gross doesn't mean it's *wrong* for others who enjoy it. (His carrion vs. fresh meat analogy).
  3.  **The Dangerous Confusion:** People naturally and strongly **confuse their physical disgust ("physical impurity") with moral wrongness ("moral impurity")**. This confusion is powerful and illogical.
  4.  **Intolerance Takes Over:** Once someone feels this intense disgust/antipathy, they naturally desire to **punish** those who engage in the act. They actively **seek justifications** ("any pretence, however slight") to legitimize this punitive impulse.
  5.  **Disagreement = Offense:** Bentham observes that differences in taste/opinion provoke animosity as strong as conflicts of interest. Disagreeing with someone's taste or opinion feels like an **affront to their pride and sympathetic feelings** (their sense of what *should* be liked/believed). This makes them hostile.
  6.  **James I Example (Answering your Q1):**
      *   **Purpose:** To illustrate points 4 & 5 in action. James I felt intense **antipathy** (disgust/revulsion) towards:
          *   Anabaptists (religious difference/disagreement).
          *   Tobacco (difference in taste/habit).
      *   **The Key Variable:** *Social/Political Power & Pretext.*
          *   Against Anabaptists: He found religious/political **pretext** and social permission ("circumstances... favourable"). Result: **Burning people.**
          *   Against Tobacco: He found **no strong pretext** or social permission for extreme punishment. Result: **Writing an angry book.**
      *   **Proof:** This shows how the *same* core feeling of antipathy (disgust/revulsion at difference) leads to vastly different *actions* based solely on available justifications and societal tolerance for punishment. The *intensity* of the antipathy doesn't necessarily match the *reasonableness* of the response. The punishment stems from the emotion + power + pretext, not inherent harm.
  7.  **The Role of Pleasure & "Philosophical Pride" (Answering your Q2):**
      *   **The Trigger:** The transition from physical disgust to moral condemnation is *especially* easy when the act in question involves **intense pleasure**.
      *   **"Philosophical Pride":** Bentham is targeting **ascetic moralists** – philosophers and religious thinkers who view pleasure itself (especially sensual pleasure) with deep suspicion or outright hostility. Think:
          *   Platonic traditions distrusting the body/senses.
          *   Stoic ideals of apathy.
          *   Christian asceticism/mortification of the flesh (e.g., St. Augustine).
          *   Puritanical strands of thought.
      *   **Their Flawed Logic:** They condemn pleasurable acts **not** because of proven harms (like causing pain), but simply **because they are pleasurable**. They elevate the *rejection* of pleasure as a moral virtue in itself ("we ought... merely because we ought"). This "pride" comes from seeing oneself as above base pleasures.
      *   **Envy:** Bentham adds that envy makes people resent the pleasure *others* experience, especially pleasure they disapprove of or deny themselves.
  8.  **The Crux: "It is not the pain that angers them but the pleasure" (Answering your Q3):**
      *   **Meaning:** Opponents of acts like homosexuality (or other condemned pleasures) *claim* their anger stems from the potential *harms* or *pains* caused. Bentham argues this is a smokescreen.
      *   **Their Real Motivation:** What *truly* angers them is the **very fact that others are experiencing intense pleasure** from an act they find disgusting or morally repugnant. The pleasure itself is the offense.
      *   **Proof:** If they were genuinely concerned about *harm* (pain), their condemnation would be proportional to the *actual risk* and *severity* of demonstrable harms ("proportioned to the probability... of its producing such greater pains"). But their condemnation is universal and absolute, regardless of context or evidence of harm, focused solely on the *existence* of the pleasure.

  **Does Bentham's Theory Hold Up Today? (Psychologists/Philosophers)**

  Bentham's analysis is **strikingly prescient** and aligns well with modern understandings, though with some nuances:

  1.  **Moral Disgust & Purity:** Modern Moral Foundations Theory (e.g., Jonathan Haidt) identifies **Sanctity/Degradation** (or Purity) as a core moral foundation. Disgust is its primary emotion. People *do* readily moralize things that trigger disgust (bodily fluids, "unnatural" acts, perceived contamination), often independent of harm considerations. Bentham nailed this core mechanism.
  2.  **Disgust ≠ Harm:** Psychologists like Paul Rozin have shown disgust is a powerful motivator of moral judgment, but it's distinct from harm-based judgments. Disgust reactions are quick, intuitive, and often resistant to reason – exactly the "calmness" Bentham said people lack.
  3.  **Confusion of Domains:** The confusion between personal disgust (yuck!) and moral wrongness (immoral!) is well-documented. Disgust can make harms seem worse, and harmless acts seem wrong if they trigger disgust.
  4.  **Intolerance & Seeking Justification:** Bentham's point about using flimsy justifications to support deep-seated antipathy/intolerance resonates with modern concepts of motivated reasoning and cognitive bias. We often reason *backwards* from emotional reactions.
  5.  **The Pleasure Paradox:** His insight that *pleasure itself* can be the target of moral condemnation, especially by ascetic or puritanical ideologies, is valid. The resentment of others' pleasure (envy) is also a recognized factor.
  6.  **What Bentham Might Underplay:**
      *   **Social Identity & Norms:** Modern theorists emphasize that disgust often functions to enforce **group boundaries and social norms**. Condemning "impure" acts reinforces group identity ("us" vs. "them"). Bentham focuses more on individual psychology.
      *   **Evolutionary Roots:** While sometimes misfiring in modern contexts, disgust likely evolved for disease avoidance. This deep biological root makes it a particularly potent and sticky foundation for morality. Bentham treats it more as an irrational confusion.
      *   **Harm Can Be Involved:** While Bentham rightly points out that disgust-driven condemnation often ignores *actual* harm/consent, modern analysis might acknowledge that some acts condemned via disgust *can* involve harm in specific contexts (e.g., exploitation), though the *primary* driver of the *generalized* condemnation is still often disgust/purity, not harm assessment.

  **Conclusion:**

  Bentham's analysis is brilliant and remarkably modern. He correctly identified the core psychological mechanism: the powerful, irrational confusion of personal disgust ("this grosses me out") with moral wrongness ("this is evil"), leading to punitive impulses seeking justification. His examples with James I perfectly illustrate how this antipathy translates into action based on power and pretext. His critique of "philosophical pride" targets ascetic moralists who condemn pleasure for its own sake. And his final line – "it is not the pain that angers them but the pleasure" – cuts to the heart of the matter: the opponents' outrage stems fundamentally from resentment towards the *existence* of the pleasure itself, not from a genuine, proportional concern about harm.

  Modern psychology and moral philosophy largely confirm Bentham's core insights about the role of disgust in moralization, its separation from harm-based reasoning, and the tendency to rationalize deep-seated antipathy. His essay was a courageous and groundbreaking piece of psychological and moral analysis, decades ahead of its time.
