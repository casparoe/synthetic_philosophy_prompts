  Looking at move (1): Owen's contextualist reading is textbook but potentially oversimplified. He's correct that contextualism cleanly handles same-speaker scenarios, but I recall Hawthorne's "knowledge traveler" problem where contextualism struggles when evaluators have different stakes. That might foreshadow Farah's next point.

