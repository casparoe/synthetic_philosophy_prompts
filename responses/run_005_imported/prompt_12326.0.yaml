answer: |-
  ## Committee Ruling: Internal Prediction Market Trading Rules

  **Date:** October 26, 2023  
  **To:** All Prediction Market Participants  
  **From:** The Prediction Market Oversight Committee  
  **Subject:** Final Ruling on Participant Trading Restrictions & Market Structure Enhancement  

  After thorough deliberation on the critical issue of participant trading, particularly concerning individuals with specialized project knowledge (e.g., engineers on migration timelines), the Committee issues the following binding ruling:  

  ### 1. Core Ruling: Insider Participation is Permitted
  *   **Employees with project-specific knowledge ARE PERMITTED to trade on events directly related to their work.** This includes events like "Migration ships by Dec 31st" for engineers actively working on the migration.
  *   **Rationale:** The primary purpose of our prediction market is to aggregate *all* available information into accurate probability forecasts. Banning the most informed participants fundamentally undermines this goal. Prices would reflect uninformed consensus, not genuine expectations, rendering the market useless for forecasting. The "no-trade theorem" highlights the paradox: if insiders are banned, their absence signals their private knowledge, preventing the price from ever fully incorporating it. Allowing their participation is the only way for the market mechanism to function as intended.

  ### 2. Addressing the Fairness Concern: Implementing a Subsidized Market Maker
  We acknowledge the significant and valid concerns raised regarding fairness and demoralization. Observing insiders consistently profit can discourage participation and breed resentment, potentially killing the market as effectively as bad prices. **Therefore, we pair the permission for insider trading with a structural enhancement:**
  *   **A subsidized automated market maker (AMM) will be implemented immediately.** A portion of the bonus pool will be allocated to subsidize this AMM, ensuring it consistently provides liquidity and absorbs trading losses. 
  *   **Purpose & Impact:** 
      *   **Mitigates Demoralization:** Losses incurred by less-informed traders flow primarily to the subsidized AMM (representing the bonus pool/the "house"), not directly to the informed traders. While insiders will still profit *from the market maker*, this is less visibly "at the expense of" their colleagues.
      *   **Overcomes the No-Trade Hurdle:** The subsidy explicitly creates value *within* the market system. Informed traders *can* profit because they are trading against a mechanism designed to lose money on average (funded by the subsidy), not just against potentially equally informed or suspicious peers. This breaks the "no-trade" logjam.
      *   **Improves Liquidity:** An AMM guarantees bids and asks are always available, making the market more vibrant and usable for everyone, regardless of information level.

  ### 3. Serious Consideration of the Ban Argument
  The Committee deeply respects the perspective advocating for a ban on insider trading. Your concerns about fairness, morale, and preventing a perception of exploitation are critical to the market's long-term health and participation. A market perceived as rigged or "for experts only" will fail, regardless of price accuracy. The frustration of repeatedly losing points to specialists with asymmetric information is real and damaging. **We agree that the status quo is unsustainable.** However, we conclude that a ban, while potentially improving perceived fairness in the short term, fatally compromises the market's core utility. Without informed participants, the market becomes a lottery, not a forecasting tool. **The subsidized AMM is our solution to preserve information aggregation while directly addressing the valid fairness concerns underpinning the ban proposal.**

  ### 4. Implementation & Next Steps
  1.  **Immediate:** Trading Rules are updated to explicitly permit trading on events related to one's own work.
  2.  **Within 1 Week:** The Committee will select and configure a suitable AMM mechanism (e.g., LMSR) and determine the initial subsidy level from the bonus pool. Technical implementation begins.
  3.  **Within 2 Weeks:** The subsidized AMM goes live. Clear communication will explain its role: *"The AMM provides liquidity; part of your trading gains/losses come from/to this pool, funded by the overall bonus pool, reducing direct point transfers between participants."*
  4.  **Ongoing:** The Committee will actively monitor:
      *   **Market Activity:** Participation rates, liquidity depth.
      *   **Forecast Accuracy:** Compared to actual outcomes and external estimates.
      *   **Participant Sentiment:** Via anonymous surveys regarding fairness and engagement.
      *   **AMM Subsidy Burn Rate:** To ensure sustainability.

  ### 5. Review
  This structure will be formally reviewed in Q1 2024, assessing its impact on forecast accuracy, participation, and perceived fairness. Adjustments to the subsidy level or AMM parameters may be made based on data and feedback.

  **Conclusion:** Our goal is a prediction market that is both *useful* (generating accurate forecasts by incorporating all knowledge) and *sustainable* (fair and engaging for all participants). Permitting insider trading is essential for usefulness. Implementing a subsidized market maker is essential for sustainability and overcoming the inherent challenges of informed trading. We believe this ruling strikes the necessary balance and provides the mechanism to make the market thrive.  

  **Signed,**  
  The Prediction Market Oversight Committee
