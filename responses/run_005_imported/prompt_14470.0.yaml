prompt: |-
  This term I am taking a seminar on practical reason, and this week's unit on Bernard Williams's "Internal and External Reasons" has left me more puzzled by the secondary literature than by Williams's own paper. As I understand Williams's central move, a reason statement is only intelligible as a genuine reason (rather than a mere assertion that some consideration would be good to act on) if it could, via a "sound deliberative route," connect up to some element of the agent's actual subjective motivational set S — and "sound" carries real weight here, since Williams's well-known example of a man who wants a gin and tonic but unknowingly reaches for a glass of petrol is meant to show that a false belief can produce motivated action without producing a genuine reason. Both John McDowell, who appeals to the practically wise agent's perceptually acquired "second nature," and Christine Korsgaard, who distinguishes the general requirement that reasons be capable of motivating a rational agent from the further Humean claim that reasons must derive from some pre-existing desire, are standardly presented in my seminar as having found a real gap in Williams's argument that leaves room for external reasons after all.

  I am not convinced that either reply actually secures what an external reasons theorist needs, and I would like your help pressure-testing that instinct before committing to it in a term paper. Specifically, please argue for the following thesis as forcefully as you can: that neither McDowell's nor Korsgaard's response establishes the existence of reasons that are genuinely external in Williams's sense, because each is best read as arguing only that S should be understood more expansively — as including latent perceptual capacities, or the power of rational reflection itself — rather than as identifying reasons that float free of S altogether. Please engage with the actual structure of at least one of the two replies rather than a generic gloss on "internalism versus externalism," and be sure to address the strongest objection to your own thesis: that if S can be stretched to cover any capacity an agent could in principle develop, internalism ends up excluding nothing, so my proposed "terminological" diagnosis would end up trivializing Williams's thesis rather than defending it.
reasoning: |-
  Okay, let me approach this systematically. The user is deeply engaged with Williams' internal reasons theory and skeptical about McDowell's and Korsgaard's supposed externalist counters. They want pressure-testing for their instinct that both critics merely expand S rather than escape it. 

  Hmm, the core challenge is tricky: how to show McDowell/Korsgaard don't secure external reasons while preserving Williams' substantive distinction. The user already anticipates the "trivialization" objection - that if S becomes infinitely stretchy, internalism loses bite. That's the pivot I must address head-on.

  First, McDowell. His "second nature" move is sophisticated but when I trace the mechanism - perception engaging with character - it still hooks motivation to existing dispositions. The petrol/gin case is key here: Williams' point is that false beliefs distort, while McDowell's virtuous perception... still needs motivational traction. If the agent lacks even latent sensitivity to virtue, where's the reason? That suggests it's still internal. 

  Korsgaard's appeal to rationality as motivation-conferring seems stronger at first glance. But Williams would pounce: her "motivating the rational agent" quietly presumes rationality is already motivationally present. If not - say in a completely indifferent agent - calling it a reason seems empty. The structural parallel to the petrol case is revealing: just as belief must be true for real motivation, rationality must be motivationally engaged for real reasons.

  Now the big worry: if I argue both just expand S, haven't I gutted Williams? No - because his "sound deliberative route" does real work. Expanding S isn't arbitrary; it's constrained by what can actually motivate via truth-tracking deliberation. That excludes purely external "shoulds." The petrol case isn't just about false belief; it shows reasons require correct sensitivity to S. 

  For the term paper, I'd suggest emphasizing how Williams' "soundness" criterion blocks infinite expansion of S. Neither McDowell's perceptions nor Korsgaard's rationality count unless they can connect to actual motivation under truth. That preserves the substantive gap: the externalist's "brute ought" still can't motivate without that link.
answer: |-
  You're right to be skeptical. Neither McDowell nor Korsgaard successfully establishes reasons *genuinely external* to the agent's subjective motivational set (S) in Williams's sense. Both arguments are best understood as sophisticated *expansions* of what constitutes S, preserving the core internalist thesis. Let's pressure-test this, focusing on McDowell and addressing the crucial trivialization objection.

  **The Core Argument: McDowell's Expansion, Not Escape**

  McDowell's central move, in works like "Virtue and Reason," is to argue that the practically wise person (*phronimos*) perceives objective reasons directly through their cultivated perceptual capacity – their "second nature." These reasons, he claims, are external because they are perceived features of the world demanding action, independent of the agent's pre-existing, occurrent desires.

  *   **Why this seems externalist:** McDowell emphasizes that the *phronimos* doesn't deliberate *from* desires. They see, for example, that "this situation requires kindness," and that perception *itself* motivates. The reason ("be kind") appears grounded in the objective situation, not in a prior desire to be kind.
  *   **Why it's actually an expansion of S:** Williams's S explicitly includes not just desires, but also "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent." McDowell's "second nature" – the cultivated perceptual and motivational capacity enabling the *phronimos* to perceive and be motivated by objective demands – fits squarely *within* this broad conception of S.
      1.  **Latent Capacity, Not External Source:** The capacity for virtuous perception is a *disposition* or *character trait* acquired through habituation and reflection. It is a complex element *within* the agent's motivational economy, shaping *how* they perceive the world and *what* considerations they find salient and motivating. It's not a source *external* to S; it *is* a highly sophisticated element *of* S.
      2.  **The Deliberative Route Requirement Still Holds:** For McDowell's perceived reason ("be kind") to be a genuine reason *for a specific agent*, Williams would insist it must be possible for that agent to arrive at the motivation to be kind *via a sound deliberative route from their actual S*. For the *phronimos*, this route exists: their S *contains* the disposition for virtuous perception. For someone lacking this disposition, perceiving the kindness-demanding feature requires *developing* that disposition – a process that *itself* must connect to *some other element* of their current S (e.g., a desire to be good, a fear of blame, curiosity about virtue). The "soundness" of the deliberative route leading to acquiring the disposition is crucial – false beliefs about what kindness entails or how to cultivate it would undermine the claim that the resulting motivation stems from a *genuine* reason.
      3.  **The Petrol/Gin Analogy Persists:** Imagine a person with a deeply ingrained disposition for callousness (part of their S). They might *falsely believe* a situation demands cruelty (their "perception" is distorted). They act. Williams would say they had a *motivation* (stemming from their callous disposition + false belief) but not a *genuine reason* for cruelty. The requirement for correct belief ("soundness") ensures that the reason attributed must be anchored *correctly* to the world *via* the agent's S. McDowell's virtuous perception requires the same anchoring: the perception must be *accurate* (sound) and it must *be* the agent's perception (stemming from their S). If the perception is inaccurate or doesn't connect to their S, it doesn't yield a reason *for them*.

  **Addressing the Strongest Objection: Trivialization**

  *   **The Objection:** If S can be stretched to include latent capacities like virtuous perception (McDowell) or the power of rational reflection itself (Korsgaard), doesn't internalism become vacuous? Doesn't it allow *any* conceivable motivation to be retrofitted into S, making the claim "all reasons are internal" true by definition and excluding nothing? This would trivialize Williams's substantive argument against external reasons.
  *   **The Defense: Why Williams's Thesis Remains Substantive & Non-Trivial:**
      1.  **"Sound Deliberative Route" Imposes Real Constraints:** This is the key. Williams isn't just saying "whatever motivates you is in S." He's saying a genuine reason must be something the agent *could be motivated by* **after correct and fully informed deliberation starting from their *actual* S**. This excludes:
          *   **Arbitrary Expansions:** You can't just *stipulate* that S contains the disposition to perceive external reason R. You must show a *possible, sound deliberative path* from the agent's *actual, current* S to being motivated by R. For the callous person lacking any germ of empathy or concern for others, there may be *no sound deliberative route* to genuinely perceiving and being motivated by kindness *as an objective demand*, even if we call the capacity "latent." The route might require radical conversion, not sound deliberation from existing motives.
          *   **Motivation by False Belief:** The petrol/gin case is the paradigm. The "reason" (drink this to satisfy gin desire) fails because the deliberation is unsound (false belief about the liquid). Any attribution of a "latent capacity" must similarly pass the soundness test. A false belief about *what would constitute* developing virtuous perception, or *what it would demand*, undermines the claim that the resulting motivation stems from a genuine reason.
          *   **The "Could" is Modal, Not Actual:** Internalism doesn't require the agent *actually* be motivated *now*. It requires it's *possible* they *could* be motivated *after sound deliberation*. This "could" is constrained by the specific content of their actual S and the requirement for truth. If no path exists *from this S, via truth*, to the motivation, the reason isn't internal (and thus, for Williams, isn't a reason *for that agent* at all).
      2.  **Contrast with Genuine Externalism:** A *truly* external reason, per Williams, would be one that applies to an agent *even if* there is *no possible sound deliberative route* from *any* element of their actual S to being motivated by it. The externalist claims "You have a reason to φ" means something like "φ-ing is objectively required, regardless of whether you could ever see it or be moved by it." **McDowell (and Korsgaard) do not secure reasons of this type.** They secure reasons that *only* apply if the agent possesses, or can *soundly* develop from their S, the specific capacity (virtuous perception, rational agency) that allows them to perceive and be motivated by the external demand. The reason is still conditional on the agent's subjective constitution and its potential for correct development.
      3.  **S is the Starting Point, Not the Endpoint:** Williams isn't claiming S is static or that deliberation doesn't transform it. He explicitly allows deliberation to discover new motivations and transform existing ones. The crucial point is that *the engine of that transformation must be powered by, and traceable back to, the agent's starting S via sound deliberation*. Attributing a "latent capacity" only makes sense if its activation or development is a *possible outcome* of such a process *from that specific starting point*. It's not a blank check to attribute any capacity imaginable.

  **Conclusion for Your Thesis**

  Your instinct is sound. McDowell's appeal to the virtuous agent's perception doesn't establish reasons external to S; it demonstrates how a highly cultivated *element within S* (the disposition for virtuous perception) generates motivations that *appear* external because they respond directly to perceived objective features. However, the reason's status *as a reason for that agent* remains utterly dependent on that disposition *being part of their S* and their perception being accurate (sound). The "sound deliberative route" criterion prevents S from becoming trivially all-encompassing by requiring a non-arbitrary, truth-constrained path from the agent's *actual* motivational starting point to the motivation in question. Williams's argument survives not as a terminological trick, but as a substantive thesis about the necessary connection between reasons, motivation, and the agent's subjective perspective under conditions of truth. McDowell enriches our understanding of S and deliberation; he does not escape the internalist framework. The same analysis applies, *mutatis mutandis*, to Korsgaard's emphasis on rational reflection as constitutive of agency – it expands S (to include the commitment to rationality itself) but does not detach reasons from the necessity of a sound deliberative link to the agent's motivational set.
