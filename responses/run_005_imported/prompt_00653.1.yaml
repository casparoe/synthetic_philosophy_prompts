answer: |-
  Here's a full breakdown of Hobbes's argument, why it elevates geometry and politics while sidelining physics, and the connection to his circle-squaring obsession – all in plain terms:

  **Hobbes's Core Argument (Decoded):**

  1.  **"Of arts, some are demonstrable, others indemonstrable..."**
      *   *Plain English:* Not all knowledge can be proven with absolute certainty (like a geometric proof). Some things are demonstrable, others aren't.
      *   *Key Point:* He's setting up his strict criteria for what counts as "science" (scientia) – true, certain knowledge.

  2.  **"...demonstrable are those the construction of the subject whereof is in the power of the artist himself, who, in his demonstration, does no more but deduce the consequences of his own operation."**
      *   *Plain English:* We can only have absolute proof about things **we build ourselves.** The "artist" (scientist/geometer) must have complete control over creating the subject matter. When they prove something, they're just working out the logical consequences of the rules they used to build it.
      *   *Crucial Meaning of "Construction":* This is absolutely technical. Hobbes is a radical materialist/nominalist. For him:
          *   Geometry isn't about abstract Platonic forms. A "point" is literally the mark made by a physical stylus. A "line" is the trace of a moving point (a physical motion). A "circle" is generated by rotating a compass.
          *   We *physically generate* these figures through our own actions. We define their essence by how we make them.
      *   *Why this matters:* Because we *cause* the geometric objects to exist via our operations, we know *exactly* their fundamental properties and causes. Our knowledge comes from being the maker.

  3.  **"The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same; and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for."**
      *   *Plain English:* The *reason* for point #2 is this: True science requires knowing the **causes and the process of generation** *beforehand*. If you know exactly *how* and *why* something is made (its construction/causes), you can prove things about it deductively. If you don't know the fundamental causes (you have to search for them), you can't have that kind of absolute proof.
      *   *Hobbes's Epistemology:* Knowledge = knowing causes. Certain knowledge = knowing causes *because you put them there*.

  4.  **"Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves..."**
      *   *Plain English:* Geometry qualifies as true science because **we physically create** the lines and figures we reason about (via compass, straightedge, motion). We are their makers; we know their causes intimately.

  5.  **"...and civil philosophy is demonstrable, because we make the commonwealth ourselves."**
      *   *Plain English:* Politics (Civil Philosophy) *also* qualifies as true science. Why? Because **human beings create commonwealths (states) through covenants (social contracts)**. We are the artificers of the state (Leviathan is an "artificial man"). We define its structure and authority through our agreements. Therefore, we know its causes and can deduce its properties logically.

  6.  **"But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."**
      *   *Plain English:* **Physics (Natural Philosophy) is different.** We didn't *make* rocks, stars, or animals. We don't know their fundamental "construction" or first causes from the inside out. We can only observe their effects (motion, behavior) and *infer* what their causes *might* be. We can hypothesize and build models, but we can **never** achieve the absolute, deductive certainty of geometry or politics. Physics yields probable knowledge ("what they may be"), not demonstrative proof ("what they be").

  **Why Physics Gets Shut Out (Despite Hobbes's Ambitions):**

  *   Hobbes desperately *wanted* physics to be a demonstrable science based on his mechanistic materialism (everything is matter in motion). He wrote extensively on it.
  *   **BUT,** his own strict epistemological criterion ("true science requires being the maker") **forced him to exclude it.** He couldn't claim humans *constructed* the universe. We can only observe and hypothesize about its workings. Physics, for Hobbes, is fundamentally **hypothetical** and **probabilistic**, not demonstrative. He could propose mechanical *models* of nature, but not claim absolute geometric certainty for them. This was a tension he lived with.

  **The Link to His Circle-Squaring Obsession:**

  1.  **"Artist" of His Own Diagrams:** Hobbes's theory makes the geometer the literal *creator* of the geometric objects via their operations (drawing lines, rotating compasses). This gives him an incredibly strong sense of **intuitive certainty** about his constructions. If he *feels* he's correctly performed the operations to generate a square equal to a circle, and deduced the consequences logically from those operations, *in his mind*, it *must* be true. His sense of being the "maker" overrides external criticism.
  2.  **Nominalism/Materialism in Action:** For Hobbes, geometric truth isn't about matching an abstract ideal; it's about correctly performing the physical/mental operations of generation and deduction. If his process *seemed* sound *to him* based on his understanding of these operations (even if flawed), he felt entitled to the certainty he believed geometry provided.
  3.  **Rejecting the "Experts":** Wallis represented the established mathematical community using more abstract, algebraic methods. Hobbes saw this as straying from the true foundation of geometry: physical generation and deduction from definitions. He dismissed Wallis's criticisms as missing the point or relying on illegitimate abstractions. His own theory told him *he* was the one grounded in the true source of geometric certainty (construction).
  4.  **Inability to Back Down:** Admitting error wasn't just admitting a mistake; it would have been an existential threat to his core epistemological principle. If he, the "maker" of the diagram, could be fundamentally wrong about the consequences of his own operations, what did that say about the certainty of geometry itself? Or worse, about the certainty of *Leviathan*, built using the same logical method? His stubbornness was a defense of his entire philosophical system.

  **Does the Argument Hold Up on Its Own Terms?**

  *   **Internal Consistency:** Within Hobbes's rigid framework (true knowledge *only* comes from knowing causes by being the maker), the argument is **highly consistent**. Geometry and Politics clearly meet the criterion; Physics clearly does not. His stubbornness on circle-squaring, while infuriating, logically follows from his belief that correct operations by the maker guarantee truth.
  *   **External Validity (Flaws):**
      *   **Overly Restrictive:** Hobbes sets an impossibly high bar for "science," excluding virtually all empirical knowledge (physics, biology, etc.) from certainty. Modern science thrives on reliable, testable knowledge *without* needing to be the primal cause.
      *   **The Geometry Problem:** His materialist view of geometry struggles with infinity, irrational numbers (like π!), and concepts not easily reducible to finite physical constructions. His own circle-squaring failure highlights this flaw. Modern mathematics relies on abstraction far beyond literal construction.
      *   **The Politics Problem:** While humans *create* political systems, they are incredibly complex, involving unpredictable human nature, history, and unintended consequences. Deductive certainty about politics akin to geometry is unrealistic. Hobbes's *Leviathan* is a powerful logical model, but not a "demonstration" in the geometric sense applied to the real world.
      *   **Physics' Success:** Modern physics, through rigorous experimentation, modeling, and mathematics, achieves a level of reliable predictive power and understanding that, while not "Hobbesian demonstration," is vastly superior to the hypothetical guesses Hobbes allowed. We *can* know causes deeply without being the primal maker.

  **Summary for Your Readers:**

  Hobbes argued we can only have absolute, geometric-style certainty about things **we build ourselves**, because only then do we truly know their causes. We build geometric figures with compass and straightedge. We build political states through social contracts. Therefore, geometry and politics are true sciences. We *didn't* build the natural universe; we can only observe it and guess at its causes. Therefore, physics can never be as certain as geometry. This belief that the "maker" has privileged access to truth explains why Hobbes clung so fiercely (and wrongly) to his circle-squaring "proof" – he believed his own geometric constructions gave him an unassailable foundation, making the criticisms of mathematicians like Wallis irrelevant to his deeper philosophical certainty. While logically coherent within his own system, Hobbes's standard for true science was ultimately too narrow, excluding the powerful, if less-than-absolute, knowledge gained through empirical science. His geometric stubbornness was the price of his philosophical consistency.
