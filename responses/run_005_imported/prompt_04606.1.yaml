  First, I need to address why rule-based systems fail here. The key points are the frame problem and the open texture of language. The frame problem in AI is about anticipating all possible relevant factors, which is computationally hard. Open texture means language can't cover every real-world scenario. So, the user isn't bad at writing rules; it's a fundamental limitation of rule-based systems.

