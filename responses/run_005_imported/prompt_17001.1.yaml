answer: |-
  ## The Dust of Empires

  The silence in Duncan MacNaught’s counting-house was a physical thing, thick as the dust motes dancing in the weak Glasgow sunlight slanting through the high window. Outside, the bustle of the Trongate seemed muffled, distant. Here, the only sounds were the dull tick of the long-case clock and the hollow scrape of his quill as he traced figures that meant nothing. Columns of pounds, shillings, and pence stretched down the ledger, neat and damning. Where once they had swelled like the tide in the Clyde, promising new ships, finer houses, grander ambitions, now they dwindled. Shrank. Stopped.

  *Virginia Leaf. Prime. 500 hogsheads.* The entry was three months old. The last shipment received before the world turned to gunpowder and smoke across the Atlantic. The *Marlborough* was likely captured, sunk, or rotting in some colonial port. Insurance would cover the capital, barely, but the *profit*... the lifeblood of the trade... was gone. Vanished like the smoke from his last good Havana.

  Duncan leaned back, the worn leather of his chair groaning. He looked around the room. This very house on Virginia Street – named with the brazen optimism of men who saw continents as ledgers – was a testament to the leaf. Its Georgian symmetry, the imported mahogany panelling, the crystal decanters catching the light – all built on the golden dust of Chesapeake tobacco. His father, Lachlan MacNaught, had been one of the original "Tobacco Lords," a title worn with a swagger that echoed in the Exchange. Duncan remembered the old man’s booming voice, the clink of glasses celebrating another record-breaking auction, the tangible sense of *power* that came from controlling the flow of a luxury craved by every court in Europe. He’d inherited not just the business, but the pride. The MacNaught name meant something in Glasgow. It meant the Merchant’s Hospital wing his father funded, the smooth cobbles outside the Trades Hall laid with MacNaught coin, the palpable respect when he walked into the Assembly Rooms.

  He ran a finger along the ledger’s edge. Pride warred with a gnawing sensation deep in his gut, a feeling that had been growing, worm-like, since whispers of rebellion turned to the thunder of Lexington and Concord. It wasn’t just the lost ships or the frozen credits. It was a phrase, echoing in his mind like a half-remembered tune, picked up from a conversation overheard at the Faculty Club, or murmured by his clerk, young Finlay, who had a disconcerting habit of reading radical pamphlets: *"A manifest burden upon the great body of the people..."*

  He knew the source. Everyone in educated Glasgow circles was talking about it. Professor Smith’s monstrous book. *An Inquiry into the Nature and Causes of the Wealth of Nations*. Duncan hadn’t read it, not properly. The sheer bulk of it daunted him, and frankly, the title alone felt like a challenge flung at men like him. But fragments had seeped in. Talk of monopolies being a "dead weight." Of colonies defended at the "exclusive expence of the mother country." Of the whole system being rigged for the "merchants and manufacturers," paid for by the "country gentleman and farmer" through taxes that funded the very wars protecting the trade routes.

  He pushed the ledger away. It landed with a thud that echoed too loudly. *Paid for by whom?* His mind conjured images not of the bustling docks, but of the weavers in the Calton, faces pinched with hunger as the war disrupted linen exports too; of the Highland lads pressed into regiments bound for America, their families left with nothing; of the increased port duties he grumbled about but passed on, ultimately paid by the shopkeeper, the clerk, the farrier. Ordinary folk. The "great body of the people." People who never tasted the profits of prime Virginia leaf, only the cost of the Royal Navy frigates guarding its passage – frigates now blockading the very ports they were meant to protect.

  A knock startled him. Agnes, his wife, entered, her face pale above the dark silk of her gown. "Duncan? Mr. Buchanan is here. About... the fountain."

  Ah, the fountain. His grand civic gesture. Planned for the newly widened Buchanan Street, a monument in Portland stone, an elegant nymph holding an overflowing cornucopia – a symbol of Glasgow’s bounty. *His* bounty. Or what had been. The stonemason needed the next payment.

  "Tell him... tell him we must delay, Agnes. Until... until the situation clarifies." The words tasted like ash. Delay meant the stone would lie exposed to the Glasgow damp, the sculptor would seek other work, the momentum of the project, like his trade, would stall.

  Agnes didn’t argue. Her eyes, usually bright with the assurance their wealth provided, held a quiet dread. "The children’s tutor mentioned... that book. Professor Smith’s. He says it argues we’d be better off without the colonies altogether. That the cost is too high." She paused, twisting her handkerchief. "Is that true, Duncan? After all we built?"

  He looked past her, through the window to the street below. A cart rumbled by, laden with barrels, but not tobacco. Salted herring, perhaps, or oats. Humble goods. The real wealth of a nation? Smith seemed to think so. Duncan saw the elegant spire of the Tolbooth, partially funded by tobacco duties. He thought of his own fine cellar stocked with claret, secured through the intricate, monopoly-protected web of colonial trade. He thought of the intricate silver coffee service in the parlour, bought with profits from leaf sold in Amsterdam at three times the price paid in Virginia.

  *Built.* Yes, they had built. Splendidly. But on what foundation? A foundation that Professor Smith, calmly lecturing just a few streets away while Duncan’s father amassed his fortune, now declared rotten. A foundation cracked by rebellion and crumbling beneath his feet, regardless of Smith’s theories.

  Later, unable to bear the silent accusation of the ledgers, Duncan walked. He avoided the Exchange, where the air was thick with panic and hushed conversations about liquidating assets. He walked instead towards the University grounds, not seeking the Professor, but perhaps the ghost of an idea. He passed the grand houses of his peers – the Speirs, the Cunnynghames, the Oswald – their Palladian facades glowing softly in the twilight. Temples to tobacco. He paused before the MacFarlane Observatory, another gift from the trade, pointing its lens towards the heavens while the earthly empire it symbolized fractured.

  He thought of the Chesapeake planters – men he’d never met, names on manifests – now calling themselves patriots, aiming muskets at the redcoats his taxes helped pay for. He thought of the narrow class of merchants – himself included – who had reaped the rewards. He thought of the pinched faces of the taxpayers Smith wrote about.

  A group of students hurried past, voices animated. "...utterly demolishes the mercantilist fallacy, doesn't it? The natural system of liberty..." One caught Duncan’s eye, recognized the cut of his coat, the aura of the merchant, and fell silent, offering a curt nod before moving on.

  *Fallacy.* The word stung. Was his father’s life’s work, his own inheritance, built on a fallacy? A system that enriched a few while burdening the many, and was now collapsing under its own weight? The pride in what he’d built – the house, the standing, the half-finished fountain – warred violently with this sickening sense of dislocation. He hadn’t *stolen* the wealth. He’d traded, risked capital, managed complex logistics. He’d *earned* it. Hadn’t he?

  But Smith’s ghostly arguments whispered: *At whose cost? And for whose benefit?*

  He reached the edge of the Kelvin, looking down at the dark water. The war wasn’t just strangling his business; it was strangling the very *idea* of what his business meant. The empire was slipping away, yes, but so was the certainty that had underpinned his world. Whether Smith was right or wrong about the future, the present was a ruin. His fortune, meticulously recorded in those silent ledgers, was built on sand – sand that was now blowing away in the Atlantic gales, revealing not bedrock, but a troubling void.

  He turned back towards Virginia Street. The house awaited, solid, elegant, a monument. But as he walked, the sound of his boots on the cobbles echoed with the hollow scrape of that quill on the ledger, tracing the end of an era, and the unsettling birth of a question he had no answer for: what came after the dust of empires settled?
