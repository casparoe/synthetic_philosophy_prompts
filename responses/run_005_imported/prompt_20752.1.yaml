prompt: |-
  I sit on my university's newly formed cybersecurity-incident committee, convened after a peer institution paid a seven-figure ransom to recover encrypted patient and research data -- I suspect I was added because I teach decision theory. We must recommend a standing ransomware policy, and the committee is split: half want a binding public commitment never to pay, since only a credible refusal keeps us from being marked as an easy target; half want case-by-case discretion, since refusing once our systems are already encrypted looks like pure loss for a principle. This feels to me like Parfit's hitchhiker played out at institutional scale: the disposition that keeps you from being chosen as a target in the first place is not the choice that looks rational once you're already staring at the ransom note. Please draft the two-page memo I'll circulate before the vote. It should recommend a specific policy, including whether and how narrowly any exception process should run, and it should take seriously the strongest objection to whichever side it favors -- especially the worry that binding an institution to "resoluteness" is not the same as binding a single person to it, since the costs land on patients, researchers, and students who never agreed to bear them.
reasoning: |-
  Okay, the user is on a cybersecurity committee at their university, formed after another institution paid a huge ransom. They teach decision theory and see parallels to Parfit's hitchhiker paradox. The committee is split: half want a firm "never pay" policy to deter attacks, half want flexibility to decide case-by-case. 

  The user needs a two-page memo recommending a policy that addresses the core dilemma: how to balance deterrence (looking resolute to avoid being targeted) with practical harm reduction (minimizing damage once attacked). The memo must grapple with the ethical weight of imposing "resoluteness" on stakeholders who didn't consent to bearing costs.

  Hmm, the Parfit analogy is sharp. In the hitchhiker story, being known as someone who *would* pay if stranded deters drivers from leaving you stranded. But once stranded, paying is the only way to survive. Similarly, a "never pay" stance might deter attacks, but refusing when data is already encrypted could cause catastrophic loss. 

  The institutional scale complicates it. Unlike an individual, the university's "resoluteness" binds thousands - patients needing medical records, students with thesis data, researchers with irreplaceable work. Their suffering isn't theoretical. 

  Yet... if attackers see the university as likely to pay, it becomes a prime target. More attacks mean more eventual ransoms paid or more catastrophic refusals. Deterrence isn't just posturing; it's risk management. 

  The strongest objection to "never pay" is the moral burden of forcing consequences on uninvolved parties. The strongest objection to flexibility is that it invites more attacks, ultimately harming the same people more frequently. 

  I think the solution is a hybrid: adopt a default public stance of "never pay" for deterrence, but create an extremely narrow, painful exception process for catastrophic cases. The exception must be so costly to invoke (reputational damage, mandatory disclosures) that it's truly last-resort, preserving most of the deterrence. 

  Key elements:
  - Public commitment to non-payment as core policy
  - Exception only if human life/safety at immediate risk AND no alternatives
  - Requires top-level approval with forced transparency
  - Paired with massive investment in prevention

  This answers the ethical worry: by making exceptions near-impossible, we minimize how often stakeholders bear costs, while the "escape valve" acknowledges extreme moral stakes. The transparency forces accountability - if we ever pay, we must explain why to those affected.

  The memo should stress that this isn't indecisiveness; it's structuring incentives. Attackers see a fortress that *might* have a single hidden door, but finding it isn't worth the effort compared to softer targets. Meanwhile, the university can look itself in the mirror knowing it won't sacrifice lives for principles.

  ...Time to draft with academic rigor but urgent clarity. The tone must balance cold game theory with the heat of real human stakes.
answer: |-
  ## MEMORANDUM  
  **To:** Cybersecurity Incident Response Committee  
  **From:** Dr. [Your Name], Department of Philosophy & Decision Theory  
  **Date:** October 26, 2023  
  **Subject:** Recommended Ransomware Policy: Resoluteness with a Catastrophic Exception Valve  

  ### I. The Core Dilemma: Parfit’s Hitchhiker at Scale
  Our committee faces a decision-theoretic paradox mirroring Derek Parfit’s hitchhiker:  
  *   **Pre-Commitment Value:** Publicly vowing *never* to pay ransom signals resolve, deterring attackers who seek easy targets. This reduces the *probability* of an attack.  
  *   **Ex Post Rationality:** Once systems are encrypted and critical data (e.g., patient care protocols, irreplaceable research) is hostage, *refusing* to pay may inflict catastrophic, irreversible harm with no offsetting deterrent benefit (the attack has already occurred).  

  A pure "never pay" policy maximizes deterrence but risks catastrophic losses if breached. Pure "case-by-case" discretion preserves flexibility but signals vulnerability, inviting more attacks and likely *increasing* total ransoms paid over time.  

  ### II. Recommendation: Qualified Resoluteness with a Narrow Catastrophic Exception  
  We recommend adopting a **binding public commitment never to pay ransomware demands**, **except** under an exhaustively defined, highly restrictive, and transparently governed **Catastrophic Harm Exception (CHE)**.  

  **Core Policy:**  
  > *"The University publicly commits to a policy of never paying ransoms to cybercriminals. Payment is fundamentally contrary to institutional ethics, fuels criminal enterprises, and increases systemic risk. Our resources are dedicated exclusively to prevention, resilience, recovery, and prosecution."*  

  **The Catastrophic Harm Exception (CHE):**  
  Payment may *only* be considered as an absolute last resort if **ALL** of the following conditions are met:  
  1.  **Imminent Threat to Human Life/Safety:** The encrypted/locked data/systems *directly* control life-critical infrastructure (e.g., hospital life-support systems in use, active clinical trial safety data with no backup) where disruption poses an *immediate, demonstrable, and unavoidable* threat to human life that cannot be mitigated within the operational timeframe.  
  2.  **Irrecoverability:** Data/system recovery via backups, decryption tools (e.g., No More Ransom), or other means is demonstrably impossible within the critical timeframe.  
  3.  **Payment as Sole Remedy:** All other options (including negotiation without payment, law enforcement assistance, accelerated restoration efforts) have been exhausted and failed.  
  4.  **High Confidence of Success:** There is credible, actionable intelligence (e.g., via law enforcement, reputable threat intel) that payment will *very likely* result in full decryption/restoration.  
  5.  **Pre-Authorization:** Any potential payment requires **pre-authorization** by a designated panel *before* negotiation begins. This panel must include:  
      *   The University President (or designated Provost/COO)  
      *   The Chief Legal Officer  
      *   The Chief Information Security Officer  
      *   An external, independent cybersecurity expert  
      *   A designated ethics officer or committee representative  
      *   *Requires unanimous consensus.*  

  **Exception Process & Transparency:**  
  *   **Invoking the CHE:** Requires a formal, documented petition to the panel detailing evidence for *all* criteria above.  
  *   **Decision & Oversight:** Panel deliberations and the final decision (including rationale) must be formally documented.  
  *   **Mandatory Disclosure:** **Crucially, any invocation of the CHE and any payment made MUST be publicly disclosed by the University within 30 days**, including the specific justification under the CHE criteria (redacting only sensitive operational/security details). This maintains institutional accountability.  
  *   **Post-Incident Review:** An independent forensic and ethical review of any CHE invocation is mandatory, with public findings.  

  ### III. Why This Hybrid Approach? Addressing the Dilemma  
  1.  **Preserves Core Deterrence:** The overwhelming public stance is "We Do Not Pay." Attackers primarily seek low-risk, high-yield targets. A strict default policy, combined with robust security investments (see below), significantly reduces our attractiveness. The CHE is designed to be so narrow, difficult to invoke, and costly reputationally (via mandatory disclosure) that it does not meaningfully erode the "hard target" signal for the vast majority of attacks.  
  2.  **Acknowledges the "Staring at the Ransom Note" Reality:** The CHE provides a strictly bounded, ethically justifiable escape valve *only* for scenarios where the human cost of refusal becomes unconscionable and pertains *directly* to imminent physical harm. It explicitly excludes financial loss, reputational damage, operational disruption, or loss of research data – no matter how severe – unless criterion #1 is met.  
  3.  **Addresses the Strongest Objection to Pure Resoluteness:** This policy directly confronts the ethical burden of imposing unbounded costs on non-consenting stakeholders (patients, students, researchers). The CHE exists *specifically* to prevent the university's resoluteness from causing catastrophic, irreversible harm *to human life* that those stakeholders did not and could not consent to bear. It draws a bright ethical line at physical safety.  
  4.  **Mitigates Moral Hazard & Slippery Slope:** The extreme narrowness of the CHE criteria, the requirement for pre-authorization *before* engagement, the high bar of unanimous consensus, and the mandatory public disclosure create massive institutional friction against invoking it. This prevents its use for convenience, financial pressure, or vague "criticality." The reputational damage from public disclosure acts as a powerful disincentive against casual use.  

  ### IV. Addressing the Strongest Objection (To This Recommendation)
  **Objection:** *"Even with the CHE, a binding public commitment imposes costs on stakeholders. Mandatory disclosure after paying under the CHE still reveals weakness, inviting future attacks targeting 'life-critical' systems to exploit the exception, ultimately increasing risk to the very patients the CHE aims to protect."*  

  **Response:** This is a serious concern. Our rebuttal rests on three points:  
  1.  **Specificity & Difficulty:** The CHE criteria are extraordinarily specific and difficult to meet. Attackers cannot easily engineer a situation where *only* life-critical systems with *no* backups/recovery options are hit *and* they have high-confidence decryptors *and* the University judges the threat truly imminent. Most attacks are opportunistic and broad.  
  2.  **Reputational Cost as Deterrent:** Mandatory disclosure is a double-edged sword. While it reveals an exception occurred, it also:  
      *   Highlights the extreme, unique circumstances required.  
      *   Demonstrates the University's commitment to transparency and accountability under duress.  
      *   Imposes significant reputational cost on the *institution* for invoking the CHE, reinforcing the strength of the core "never pay" commitment and making future invocation *less* likely.  
  3.  **Superior Alternatives:** The alternative – case-by-case discretion – signals a *much* lower threshold for payment, making us a prime target for *all* attacks, significantly increasing the *overall frequency* of incidents and the likelihood stakeholders *will* suffer harm. The CHE aims to make exploitation so difficult and costly that attackers focus elsewhere.  

  ### V. Essential Corollary: Beyond the Policy
  This policy **MUST** be paired with a massive, sustained investment in:  
  *   **Prevention:** Next-gen EDR, rigorous patching, phishing training, network segmentation (especially isolating truly critical systems).  
  *   **Resilience & Recovery:** Robust, immutable, geographically dispersed backups tested *weekly*; proven rapid recovery playbooks; hardened critical systems.  
  *   **Detection & Response:** 24/7 SOC, threat hunting, incident response readiness.  
  *   **Collaboration:** Sharing threat intelligence with peers, law enforcement (FBI, CISA).  

  **A policy is only as strong as the defenses backing it.** The CHE is not an excuse for inadequate security; it is a fail-safe for the unimaginable.  

  ### VI. Conclusion
  The "Qualified Resoluteness" policy with the narrowly defined, transparently governed Catastrophic Harm Exception balances the strategic imperative of deterrence with the ethical imperative to prevent unconscionable human harm. It acknowledges the Parfitian bind while providing a principled, accountable, and difficult-to-exploit mechanism for the extreme edge case. It signals unwavering resolve to attackers while recognizing that institutional ethics, unlike individual commitment, must account for the potentially catastrophic burdens imposed on uninvolved third parties *in extremis*.  

  We must publicly commit to never paying ransoms. We must also be prepared, with the heaviest hearts and strictest oversight, to face the catastrophic exception, should it ever arise, and bear the full accountability that comes with it. This policy provides the structure for both.  

  **Recommended Vote:** Adopt the "Qualified Resoluteness" Policy with the Catastrophic Harm Exception as described.  

  Respectfully submitted,  
  Dr. [Your Name]
