answer: |-
  Here's a toast that uses the *structure* of the kin selection debate as its backbone, weaving in personal warmth and humor while keeping the science accessible through metaphor and self-referential wit. It aims for laughs from both sides simultaneously by framing the scientific tension in human terms:

  **(Clink glass)**

  "Friends, colleagues, Meg’s wonderful family – gather 'round! They asked me to toast Meg. An honour. But also... a significant investment of time and effort. Which got me thinking, as an old kin selectionist might: *Is this worth it?* Let’s apply Hamilton’s Rule! `rB > C`! For the non-biologists, that’s basically: Is the benefit (B) of doing this, multiplied by how related I am to Meg (r), greater than the cost (C) to me?

  Well, the cost (C) is high! Drafting this involved more revisions than a paper rejected by *Nature*. My r? Well, Meg and I shared a lab bench, supervisors, and the unique trauma of grad school in the 70s. That’s a kinship coefficient approaching sibling levels! Maybe r=0.5? Solid.

  Benefit (B)? Ah, now *that’s* enormous. Because praising Meg isn't just beneficial for *her* – it benefits *everyone* who knows her, especially this crowd tonight. Amplifying her virtues? That has high *inclusive fitness* value for this whole room! So, `rB` is huge, definitely outweighing my `C`. The math demands this toast! Science wins! *(Wink at the biologists, gets a chuckle from non-scientists who followed the logic)*

  But Meg... Meg wouldn’t just accept that calculation at face value, would she? She’d peer-review it! She’d demand precise parameters! ‘Define your `r`!’ she’d say. ‘Is it genetic? Shared memes? Proximity during the Great Coffee Spill of ‘78?’ And the Benefit? ‘Is it *direct* fitness for Meg, or *indirect* via inspiring others?’ And the Cost? ‘Did you account for opportunity cost? Could you have been... *polishing wasp nests* instead?’ *(Bigger laugh, especially from biologists recognizing the worker policing reference)*

  That was Meg’s superpower: **precision**. She knew that sloppy thinking, like a lazy wasp trying to sneak an egg into the brood, gets you nowhere. You need rigorous analysis. You need to understand the *fundamental units* – be it genes, or individuals, or arguments. For forty years, she championed the power of seeing things clearly, gene by gene, interaction by interaction, cost and benefit meticulously weighed. She didn't just *defend* a theory; she *honed* it, making sure the foundations were rock solid against any... alternative interpretations. *(Nod to group selection debate without naming it directly, gets knowing smiles)*

  And she policed that rigor! Not with a sting, mind you – though her glare could be potent! – but with fierce intellectual honesty and an unwavering commitment to getting it *right*. Whether it was decoding the intricate conflicts in a wasp nest or navigating the equally complex conflicts in a faculty meeting, Meg always fought for fairness, for logic, for the principle that effort and contribution matter. She policed nonsense, wherever it tried to sneak in. *(Smiles and nods from biologists; non-scientists get "fought for fairness" and "policed nonsense")*

  So, to Meg: You taught us that relatedness matters – not just in genes, but in the bonds we forge over shared benches, shared struggles, and shared dedication to understanding life’s puzzles. You showed that the benefits of collaboration and mentorship ripple out far beyond the immediate cost. And you proved, definitively, that intellectual courage and integrity are traits worth selecting for, generation after generation. Your legacy isn't just in the papers or the debates – though they were monumental – it's in the sharp minds you trained, the colleagues you inspired, and the unwavering standard you set.

  So, raise your glasses! To Meg: A meticulous mind, a fierce defender of clarity, a champion of the rigorous argument, and a friend whose `rB` value in *all* our lives has been incalculably high. May your retirement be filled with well-deserved benefits that far outweigh any costs! Cheers to Meg!"

  **Why this works:**

  1.  **Hamilton's Rule as Framing Device:** It immediately introduces the scientific concept in a humorous, self-deprecating way ("Is this toast worth my effort?"). Non-scientists grasp the cost/benefit/relationship logic intuitively. Biologists get the precise reference and the joke about applying it reflexively.
  2.  **Metaphor Over Jargon:** "Policing nonsense," "sloppy thinking like a lazy wasp," "fundamental units," "cost and benefit meticulously weighed," "ripple out" – these translate complex ideas (worker policing, unit of selection, inclusive fitness) into relatable human actions and consequences.
  3.  **Celebrates the *Debate* Without Relitigating It:** References to "precision," "rigorous analysis," "championed the power of seeing things clearly," "defend/hone a theory," "alternative interpretations," and "intellectual courage" allude directly to the kin/group selection conflict and Meg's role in it, framing it positively as a pursuit of truth and rigor. Biologists hear the history; others hear praise for her intellect and principles.
  4.  **Focus on Meg's Traits:** It pivots from the *science* to the *scientist* – her precision, honesty, commitment to fairness, mentorship, and legacy. This makes it a genuine tribute.
  5.  **Humor for Both:** The initial Hamilton's Rule setup, the "peer-reviewing the toast" bit, "polishing wasp nests," and "glare could be potent" are designed to land for everyone. Biologists get the extra layer of the specific references.
  6.  **Warm Closing:** Ends on a heartfelt note about her broader impact and legacy, connecting the scientific concepts back to human relationships and values.

  **Delivery Tips:**

  *   **Pacing:** Let the humor land. Pause after the initial Hamilton's Rule setup, after "polishing wasp nests," and after "alternative interpretations."
  *   **Tone:** Warm, affectionate, slightly irreverent (in a friendly way), and ultimately deeply respectful.
  *   **Eye Contact:** Sweep the room, connecting with both the biologists and Meg's family/friends during the relevant parts.
  *   **The Clink:** Make sure you actually clink your glass clearly at the start!

  This toast honors Meg's specific scientific journey and battles while ensuring everyone in the room feels included and understands *why* she was such a significant figure. Cheers!
