prompt: |-
  Me and my housemate got into a two-hour argument last night about Kripke's rule-following paradox and neither of us backed down, so now I want to go into this next interview more prepared than I was for that. I run a small philosophy podcast and next week's guest is a philosopher who defends the communitarian reading of Kripke's Wittgenstein -- that solitary rule-following is basically impossible and its communal agreement/sanction that fixes what counts as 'going on the same way,' not some fact about the individual alone. Can you draft me 8 or 9 interview questions that go beyond just having her restate the view? I specifically want one on the Robinson Crusoe case (Kripke himself is weirdly cagey about whether Crusoe alone on his island can be said to follow a rule at all), one that presses on the 'but the community can misapply plus too, so doesn't this just relocate the finitude problem instead of solving it' objection, and one on whether the assertability-conditions-not-truth-conditions move actually survives if shes also a minimalist about truth. For each, give me a quick follow-up keyed to whatever answer she's most likely to give, so i'm not caught flat footed again like I was last night.
