  The key point is the concept of "accommodation." The Bible adapts to human limitations, using non-literal language when necessary. Nature doesn't adapt; it's consistent. So when there's a conflict, it's because the Bible's language is accommodating, not because nature is wrong. Therefore, interpreting scripture in light of scientific findings isn't downgrading the Bible but correctly understanding its intended meaning.

