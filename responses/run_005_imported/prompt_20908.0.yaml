answer: |-
  ## The Unblinking Sky

  The salt air hung heavy over Crescent Cove, thick with sunscreen and the shrieks of children. Leo, perched high on the white lifeguard stand, traced the grain of the wood with a fingernail. His red buoy lay beside him, a coiled promise. Below, Maya, a strong swimmer but unfamiliar with the Cove’s sudden drop-off, ventured beyond the safe zone, chasing a drifting inflatable dolphin. Leo saw her. He saw the dolphin snag on a submerged rock shelf. He saw Maya tread water, then falter, pulled by an unseen current.

  His hand twitched towards the buoy. But his phone buzzed – a frantic text from his sister about their sick mother. Just a second, he thought, just to see if it’s urgent. His eyes flickered down to the glowing screen, fingers tapping a quick reply. *Just ten seconds*, he told himself.

  It took less than five.

  When Leo snapped his head up, Maya wasn't treading. Her arms were flailing, her head dipping below the choppy surface. Panic, cold and metallic, flooded Leo’s mouth. He grabbed the buoy, launched himself off the stand, the wood scraping his shins. He hit the sand running, heart hammering against his ribs like a trapped bird. *Too slow, too slow.*

  He plunged into the water, the shock of the cold almost paralyzing. He swam, powerful strokes fueled by adrenaline and dread. He reached the spot. He dove. The water was murky, sunlight fracturing into useless shards. He groped blindly, lungs burning. *Nothing.* He surfaced, gasped, dove again. And again. Each empty-handed resurfacing was a hammer blow.

  By the time the other lifeguard, Sarah, arrived with the rescue board, it was a recovery, not a rescue. They pulled Maya onto the sand, her skin waxy blue. Paramedics worked, their movements grimly efficient, but the unblinking sky above held no hope. The beach fell unnaturally quiet, the happy sounds smothered by the weight of the tragedy.

  Leo stood apart, dripping, shivering violently despite the sun. He couldn't look away from Maya’s small form. The image seared into his brain: his hand reaching for the phone instead of the buoy. That *pause*. That terrible, decisive pause. *If I hadn’t looked down… If I’d just grabbed the buoy…* The counterfactual was a physical ache, a gaping hole where Maya’s life should be. He felt the burden of his omission settle on his shoulders, crushing and absolute. He was the guard. It was his *job*. His *duty*.

  In the days that followed, the whispers followed Leo. At the inquest, the focus was laser-sharp on his delayed response. "Approximately twelve seconds of inattention," the report stated coldly. Neighbors averted their eyes. Maya’s parents’ grief held a silent, accusatory question: *Why weren’t you watching?*

  Haunted, Leo walked the beach at dawn, the scene replaying endlessly. One morning, he stopped near the spot. He saw Mr. Henderson, the retired physics teacher, meticulously setting up his wind meter and weather log, as he did every day. Leo remembered seeing Henderson that afternoon, head bent over his instruments, scribbling notes as Maya struggled.

  *If Henderson had looked up… if he’d shouted… would it have made a difference? Could he have bought those crucial seconds?*

  The thought was intrusive, unwelcome. Henderson wasn’t a lifeguard. He had no duty. But the logic, cold and relentless, unspooled: *If Henderson had acted, Maya might be alive. He didn’t act. Therefore…?* Leo shook his head, trying to dislodge it.

  Later, buying a terrible coffee from Sal’s hot dog cart near the boardwalk, the thought returned. Sal had been there too, arguing loudly with a supplier on his phone, waving his arms, utterly oblivious to the water. *If Sal had hung up… if he’d seen…*

  "Terrible business, that drowning," Sal muttered, handing Leo his coffee. "Kid just… slipped under. Nobody saw in time, I guess."

  *I saw*, Leo screamed silently. *I saw and I paused.*

  But Sal’s words echoed: *Nobody saw in time.* Leo looked past Sal. He saw the jogger with the expensive headphones who’d been pounding the sand, lost in her playlist. He saw the couple locked in an intense, oblivious argument on their beach blanket. He saw the teenager engrossed in his phone, just like Leo had been. He saw a hundred faces from that day, flickering in his memory, all facing away from the water at the critical moment. The vendor selling ice cream. The woman painting seashells. The man building an elaborate sandcastle.

  Each one, Leo realized with a sickening vertigo, satisfied the same brutal counterfactual: *If they had looked, if they had shouted, if they had acted… might Maya have been saved?* The logic was identical to the one that condemned him. His omission felt monstrous because of the red vest, the tower, the *promise* he embodied. But stripped of that context, wasn’t Henderson’s absorbed note-taking just another form of *not-acting*? Wasn’t Sal’s loud phone call just another *failure to notice*? The chain of potential saviors stretched back along the beach, into the town, theoretically encompassing anyone who *could* have been there and *would* have acted if they’d known. A faceless crowd of non-actors, their collective inaction a vast, silent cause.

  The promiscuity of it was dizzying. The blame, which moments before had felt like a singular, crushing boulder only *he* could bear, suddenly fragmented, scattering into a million tiny shards, each reflecting a moment of harmless preoccupation, a life lived facing inward. It threatened to dissolve his guilt into meaninglessness, yet his guilt remained, anchored by the red buoy still hanging unused on the stand.

  He looked at Sal, who was now wiping down his cart, humming tunelessly. Sal felt no guilt. Henderson felt no guilt. They hadn’t worn the red vest. They hadn’t taken the oath. The world, Leo understood with a chilling clarity, didn’t blame them. It blamed *him*. Not because his inaction was uniquely causal in the raw, counterfactual sense, but because his inaction violated a sacred, human-made compact: the assignment of duty. The burden was his alone, not by the indifferent logic of cause-and-effect, but by the heavy, arbitrary weight of expectation.

  Leo walked away from the cart, the taste of cheap coffee and existential ash in his mouth. The sun beat down, the waves crashed with indifferent rhythm, and the unblinking sky held no answers, only the unbearable lightness of countless unnoticed omissions, and the crushing, specific weight of his own. He reached the lifeguard tower, empty now, and placed his hand on the sun-warmed wood. The guilt didn't dissolve; it simply expanded into a terrifying, silent universe where everyone was guilty, yet only he was condemned. He closed his eyes, but the faces kept coming – Henderson, Sal, the jogger, the teenager, stretching out to infinity – a silent, accusatory chorus of *what ifs* that all sounded exactly like his own. The sheer scale of it was a void threatening to swallow him whole. He leaned his forehead against the tower, the scream building inside him, silent and vast as the indifferent sea.
