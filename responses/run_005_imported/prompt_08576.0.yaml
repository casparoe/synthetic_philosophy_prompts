answer: |-
  Here’s a steelmanned case against the surrogate-goal strategy, taking the defender’s strongest rebuttal seriously while demonstrating its fatal tension:

  ### Core Argument: The Credibility-Cost Inevitability Tradeoff  
  The strategy fails because **any mechanism robust enough to make threats against the surrogate *indistinguishable* from threats against real goals inevitably makes the surrogate’s loss costly in practice**. The defender’s retreat to "small real costs" doesn’t resolve this—it merely relocates the problem.  

  ### Step 1: What Makes a Surrogate Credible?  
  For a threatener (or its simulation) to be deterred by your commitment to the surrogate, it must believe:  
  - **Predictive robustness**: Your response to threats against the surrogate is identical to your response against a real goal.  
  - **Stability under pressure**: You won’t "reveal" the surrogate as fake under extreme threats (e.g., "I’ll destroy everything unless you admit this is a decoy").  

  This requires embedding the surrogate so deeply in your decision architecture that *no possible interaction* can distinguish it from a genuine value. Anything less creates exploitable loopholes.  

  ### Step 2: The Defender’s Rebuttal & Its Weakness  
  **Defender**: "We can attach a *small real cost* to losing the surrogate (e.g., expending minimal resources to defend it). Threateners then see resisting threats as ‘worth it’ for the agent, making the commitment credible at low cost."  

  **Flaw**: This confuses *intrinsic value* with *strategic cost*. Credibility hinges on the *agent’s actions*, not the surrogate’s nominal value. If a threatener offers the choice:  
  > *"Pay $X or I destroy your surrogate (worth $Y)"*  
  ...the agent will pay only if $X < $Y. But if $Y is tiny, rational threateners will demand trivial $X, defeating the point. To deter *serious* threats (demanding large $X), the agent must act *as if* $Y is large—**requiring defensive investments disproportionate to $Y**.  

  ### Step 3: The Self-Undermining Mechanism  
  For the surrogate to divert *non-trivial* threats, the agent must:  
  1. **Invest in signaling credibility**: Spend resources to "prove" commitment (e.g., preemptively punishing minor threats to the surrogate), or risk being probed and exposed.  
  2. **Accept collateral damage**: To maintain consistency, the agent must let real value be destroyed *when defending the surrogate* (e.g., refusing to trade a real asset for the surrogate’s safety).  
  3. **Invite recursive threats**: Adversaries can threaten the surrogate *to extract concessions on unrelated issues*, knowing you’ll pay to protect your "credibility."  

  **Result**: The costs of maintaining the surrogate (signaling, defense, lost opportunities) inevitably exceed its nominal value. The "small real cost" balloons into a *systemic vulnerability*.  

  ### Step 4: The Prediction-Proofing Paradox  
  The strategy assumes you can "hack" your preferences without changing your core rationality. But in UDT/FDT frameworks:  
  - **Your actions reveal your true utility function**. If you defend a surrogate exactly like a real goal, rational observers *infer* you value it highly.  
  - **Threateners calibrate to the observed response**. If you spend $1M to defend a surrogate you claim is worth $1, threateners will demand $999K—imposing near-real costs.  

  Worse: If adversaries know surrogates exist, they’ll "test" multiple targets. You must either:  
  - Defend all surrogates at high cost (making them expensive), or  
  - Let some be destroyed, revealing which goals are fake—and train adversaries to ignore surrogates.  

  ### Step 5: Why "Calibrated Small Costs" Fail  
  **Defender**: "Make the cost just large enough to deter probing attacks, but small overall."  

  **Counter**:  
  - **Deterrence requires overcommitment**: To deter a $1B threat, you must credibly threaten >$1B in retaliation. If your surrogate’s "real cost" is $1, you must still *expend* >$1B defending it (e.g., fighting a costly war). The *defensive burden* decouples from the surrogate’s nominal value.  
  - **The slippery slope**: To maintain credibility after a surrogate is challenged, you must double down—escalating investments until losses are non-trivial.  

  ### Implication: The Surrogate Corrupts the Goal Architecture  
  The moment you create a surrogate, you face choices like:  
  > *"Do I sacrifice a real value (V) to save surrogate (S), knowing that losing S undermines future deterrence?"*  
  If you ever choose V over S, you reveal S’s disposability. If you always choose S, you systematically sacrifice real value for a decoy—**transforming the surrogate into a terminal goal**.  

  ---

  ### Conclusion: The Unavoidable Tradeoff  
  The surrogate strategy requires **simultaneous mutual exclusives**:  
  - **Externally**: It must be *observably identical* to a real goal to divert threats.  
  - **Internally**: It must be *functionally inert* to avoid real costs when lost.  

  But in a universe of rational predictors, the external requirement *forces* internal costs: You must *become* an agent that genuinely suffers when the surrogate is harmed, or the commitment is exploitable. This collapses the distinction between "decoy" and "real" goal. The defender’s "small real cost" is a mirage—it either fails to deter meaningful threats, or it escalates into a liability that replicates the very vulnerability it was meant to avoid. **Credibility necessitates corruption of the utility function.**  

  For your piece, this suggests that decision-theoretic "solutions" to acausal blackmail may be self-defeating when operationalized—a critical limit for AI safety engineering.
