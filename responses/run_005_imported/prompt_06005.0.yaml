answer: |-
  Here are 8 rigorously targeted questions for your Anscombe roleplay, designed to corner her specific arguments in "Mr Truman's Degree," including your three required angles plus follow-ups that pre-empt her likely evasions. Each question cuts to the core of her absolutism and double-effect critique:

  ### Core Question 1: Intention vs. Foresight in Double Effect
  **Question:** Professor Anscombe, you argue Hiroshima fails the double-effect test because the mass death of civilians *was the intended means* to compel surrender – not merely a foreseen side-effect of targeting a military objective. But consider a naval blockade of Japan: it directly intends to cripple war-making capacity (a legitimate target), while foreseeing mass civilian starvation. If that blockade is legally and morally permissible under *jus in bello*, how is Truman’s *foreseen* use of terror to end the war structurally different? Both leverage civilian suffering as a functional tool.  
  *→ Likely Anscombe Response:* "The blockade’s *object* is military-economic collapse; starvation is *per accidens*. The bomb’s *object* is civilian terror; destruction is *per se*."  
  **Follow-Up:** So if the US had *said* the bomb targeted "Japanese morale" or "war-will" (a psychological/military asset), but still vaporized civilians, would that satisfy double-effect? Does moral licitness hinge *entirely* on the verbal framing of the objective, regardless of identical physical outcomes?

  ### Core Question 2: Net Lives Saved & Consequentialist Rebuttal
  **Question:** You dismiss the "saved lives" justification as consequentialist poison. But suppose we grant your absolutist framework: was Truman morally obligated to *choose* Operation Downfall (projected 500k-1m US casualties, 5-10m Japanese deaths) over the bombs, knowing invasion would *also* involve massive foreseeable civilian deaths from bombardment, starvation, and urban combat? Doesn’t absolutism force us into the greater evil?  
  *→ Likely Anscombe Response:* "One may never do evil that good may come. Choosing invasion avoids *intending* civilian murder as a means, even if foreseen."  
  **Follow-Up:** But if Downfall’s planners *intended* to bomb Tokyo/Osaka to soften defenses – foreseeing 100k+ civilian deaths per city as collateral damage – isn’t that structurally identical to Hiroshima on your terms? Or is *any* major urban offensive in total war inherently murderous? If so, how could the Allies licitly fight Japan at all?

  ### Core Question 3: Absolutism in Catastrophic Dilemmas
  **Question:** Your position implies that even if the bombs prevented a global genocide or nuclear holocaust (a *genuinely* catastrophic trade-off), intentionally killing innocents remains intolerable. Does this mean your framework has no moral solution for a true "destroy the world or kill one child" dilemma? Are we simply doomed to choose between two unspeakable evils, with no permissible action?  
  *→ Likely Anscombe Response:* "Such dilemmas are illusions. God does not demand the impossible. One must never commit murder, period. If the world ends, it ends without *my* sin."  
  **Follow-Up:** But doesn’t this reduce ethics to individual purity while abdicating responsibility for preventable catastrophe? If Hitler had a city-hostage doomsday device, would you forbid destroying it (killing hostages) even to stop the Holocaust? Is noncomplicity *really* worth global ruin?

  ### Additional Targeted Questions:
  4. **Epistemic Challenge:** You reject "military necessity" because Truman couldn’t *know* the bombs saved lives versus alternatives. But you demand *moral certainty* of wrongdoing to condemn him. Given the fog of war, how could *any* leader meet your threshold for judging "intentional murder" vs. tragic error? Isn’t this standard paralyzing?  
  *→ Follow-Up:* If Truman sincerely believed invasion was the only alternative (as his generals advised), and believed the bombs would save millions, does his *culpability* hinge on being *factually wrong*? What if he was right?

  5. **Slippery Slope of 'Civilian' Status:** You treat all Hiroshima dead as "innocents." But Japan mobilized civilians in war production (e.g., 100k+ worked on A-bomb components in Hiroshima). Under *your* interpretation of "non-combatant immunity," where is the line? If a seamstress sewing uniforms is a licit target, why not a steelworker?  
  *→ Follow-Up:* Does this mean modern industrial warfare *automatically* violates *jus in bello*, since civilian economies fuel war? Should Churchill have halted Bomber Command in 1940?

  6. **Moral Equivalence & Precedent:** You call Hiroshima "murder" akin to a mob killing. But if Truman is a murderer, what of Churchill (Dresden), Harris (Hamburg), or LeMay (Tokyo firebombing)? If all are guilty, doesn’t this invalidate the entire Allied strategic bombing campaign? And if not, what distinguishes Hiroshima?  
  *→ Follow-Up:* Is the *only* difference the atomic bomb’s efficiency? Does morality turn on the *number* killed per sortie?

  7. **Institutional Complicity:** You argue Oxford’s degree makes it "shared in the glory" of mass murder. But if Truman’s act was intrinsically evil, wouldn’t *any* postwar cooperation with the US government (e.g., Marshall Plan, NATO) also be culpable? Where do you draw the line on "sharing glory"?  
  *→ Follow-Up:* Was Bertrand Russell (who condemned the bomb but accepted a US award) morally compromised? Are *you* compromised by using US-made equipment or accepting US-funded research grants?

  8. **Agency of the Oppressed:** You focus solely on Truman’s guilt. But Japan’s leaders rejected surrender *after* Hiroshima, knowing atomic warfare was possible. If the bombs broke a fanatical regime’s will, doesn’t some responsibility lie with those who *chose* to sacrifice their people rather than capitulate?  
  *→ Follow-Up:* Can a defender ever be morally *required* to accept higher casualties because an aggressor uses civilians as human shields? If yes, how is that consistent with *your* absolutism?

  ### Key Tactics for the Moderator
  * **Quote Her:** Use direct phrases from "Mr Truman's Degree" ("murder," "shared in the glory," "absolutely exclude innocence") to pin her down.
  * **Force the Bullet-Biting:** Don’t let her soften absolutism. If she says "sometimes no good choice exists," demand she explicitly endorse Downfall’s horrors over the bombs.
  * **Highlight Functional Equivalence:** Press analogies (blockades, firebombing) to expose whether her distinction is principled or ad hoc.
  * **Reject Consequentialist Drift:** If she hints at "proportionality" or "necessity," remind her this contradicts her pamphlet’s core thesis.

  These questions force Anscombe into the uncomfortable corners of her position: defending the logical extremes of absolutism, rejecting widely accepted wartime distinctions, and confronting the real-world implications of paralyzing leaders in existential conflicts. Good luck with the dismantling!
