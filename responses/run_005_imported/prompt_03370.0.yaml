  2. **Personal vs. societal action:** For an individual, DA might nudge support for effective longtermist charities (e.g., those preventing AI catastrophes). But it shouldn't paralyze them. The user's kid needs a present parent, not one obsessed with armageddon.  
  3. **Cognitive bias check:** The anxiety here is revealing. DA preys on availability heuristic (recently read about doom → feels imminent). Highlighting that even if DA has merit, it's one highly abstract argument among many. Climate models, AI timelines, etc., are more tangible.  
