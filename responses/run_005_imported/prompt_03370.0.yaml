  Okay, the user is a new parent who's stumbled upon the Doomsday Argument (DA) and is now anxious about their child's future. They mention reading about it on a rationalist blog but got lost in the technical rebuttals like self-indication assumption and reference class problem. Their core question isn't about debating DA's validity, but rather: if taken seriously, what practical implications should this have for an ordinary person's view of extinction risks?

