  First, I need to unpack the core philosophical issue. Dr. Kessler rejected treating religious statements as empirical claims—like "God exists" being similar to "a planet exists." Instead, she saw them as frameworks that shape one's life. The user wants to avoid two pitfalls: reducing the eulogy to a philosophy lesson, or slipping into the literal claims she criticized. 

  The family's presence is crucial. They might expect traditional religious comfort, but Dr. Kessler's work explicitly warned against phrases like "she's watching over us" as category errors. So the comfort must come from how her *framework* gave her life meaning, not from asserting afterlife facts. 

  I recall her fierce opposition to "Wittgensteinian fideism" accusations—she didn’t let religion dodge questions but reframed them. The eulogy must reflect this: show how her beliefs were rigorous, not evasive. 

  Structurally, I’ll avoid academic jargon. Instead of quoting Wittgenstein, I’ll embody the picture/hypothesis distinction. For example:  
  - **Hypothesis approach:** "She’s in heaven" (makes a testable claim).  
