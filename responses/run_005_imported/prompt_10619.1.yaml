  - "We’re not here to speculate about where she *is*; we’re here to remember what she *was* through what she believed."  

  Lastly, the closing should mirror Wittgenstein: the picture persists because it’s woven into how we live now. Her nephews might not know Wittgenstein, but they’ll feel the weight of her absence. The comfort is that her "picture" remains in their actions—debating fiercely, tending gardens, whatever she inspired. That’s where she "lives on," not in a surveillance heaven.  

  ... I’ll draft with this spine:  
  1. **Grief & gratitude** (accessible to all).  
  2. **Her essence** (anecdotes).  
  3. **Her framework** (covertly Wittgensteinian, showing belief-as-verb).  
