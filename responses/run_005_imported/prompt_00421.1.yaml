answer: |-
  Your understanding is **correct for the pure-strategy phase** of Iterated Elimination of Strictly Dominated Strategies (IESDS), but **incomplete once mixed strategies are considered**. Here's the breakdown:

  1.  **Pure vs. Pure Elimination (Your Current Understanding - Correct):**
      *   In the initial rounds, you compare pure strategies against each other using the criterion you described: Pure strategy `s_i` for player `i` is strictly dominated by pure strategy `s_i'` **if and only if**:
          `u_i(s_i', s_{-i}) > u_i(s_i, s_{-i})` for **every** possible combination of pure strategies `s_{-i}` still available to the opponents (`-i`) at that stage.
      *   If `s_i` is strictly dominated by *any single* pure strategy `s_i'` given the opponents' current strategy sets, it is eliminated.
      *   A pure strategy that survives this pairwise comparison against *all other pure strategies* in a given round is "safe" from being eliminated *by a pure strategy* in subsequent rounds *during this pure-vs-pure phase*. You correctly treat it as un-dominated for the rest of *this phase*.

  2.  **The Critical Point: Mixed Strategies Enter the Picture:**
      *   **The problem:** A pure strategy `s_i` that survives elimination by *any single pure strategy* might **still be strictly dominated by a *mixed strategy*** over the player's remaining pure strategies.
      *   **Why?** A mixed strategy can exploit the fact that different opponent strategy profiles yield different payoffs. It can assign higher probability to pure strategies that are best against specific opponent profiles. A single pure strategy has to be good against *all* opponent profiles simultaneously.
      *   **Elimination continues:** Once you've exhausted the elimination of pure strategies dominated by *other pure strategies*, you **must** check if any remaining pure strategy is strictly dominated by a *mixed strategy* over the player's *remaining* pure strategies, given the opponents' *remaining* strategy profiles.

  3.  **How Mixed Strategy Dominance Changes the Procedure:**
      *   **Definition:** Pure strategy `s_i` for player `i` is strictly dominated by a mixed strategy `σ_i` (over `i`'s remaining pure strategies) **if and only if**:
          `u_i(σ_i, s_{-i}) > u_i(s_i, s_{-i})` for **every** possible combination of pure strategies `s_{-i}` still available to the opponents (`-i`).
      *   **Procedure Adjustment:**
          1.  Perform IESDS using only pure strategies until no more pure strategies can be eliminated by domination from another pure strategy.
          2.  **Check for mixed strategy dominance:** For each player `i`, and for each of their remaining pure strategies `s_i`, check if there exists *any* mixed strategy `σ_i` (over `i`'s remaining pure strategies) that strictly dominates `s_i` against the opponents' *remaining* strategy profiles.
          3.  If such a mixed strategy `σ_i` exists for a pure strategy `s_i`, eliminate `s_i`.
          4.  Once you eliminate a strategy via mixed dominance, you must **go back and re-check pure strategy dominance** among the remaining strategies. Why? Removing `s_i` might mean that another pure strategy `s_j` (which was previously not dominated by any pure strategy) *is now* dominated by some pure strategy `s_k` because the opponents' profiles that made `s_j` viable against `s_k` might have been eliminated when `s_i` was removed or because the comparison set changed.
          5.  Repeat steps 1-4 (pure eliminations, then mixed eliminations, then pure again if needed) until no strategies can be eliminated by *either* pure *or* mixed strict dominance.

  **Example Illustration (Simplified):**

  Imagine Player 1 has strategies A, B, C. Suppose against the opponents' current strategies:
  *   A gets: (3, 1, 0) across three opponent profiles.
  *   B gets: (0, 3, 1).
  *   C gets: (1, 0, 3).

  *   **Pure vs. Pure Check:**
      *   Is A dominated by B? A(3) > B(0) in profile 1 -> No.
      *   Is A dominated by C? A(3) > C(1) in profile 1 -> No.
      *   Is B dominated by A? B(3) > A(1) in profile 2 -> No.
      *   Is B dominated by C? B(1) > C(0) in profile 3 -> No? (B(1) vs C(0) in profile 3).
      *   Is C dominated by A? C(3) > A(0) in profile 3 -> No.
      *   Is C dominated by B? C(0) < B(3) in profile 2 -> No? (C(0) vs B(3) in profile 2).
      *   *No pure strategy is strictly dominated by another pure strategy. All survive the pure-vs-pure phase.*

  *   **Mixed Strategy Check:**
      *   Consider a mixed strategy `σ₁` = (0.5 A, 0.5 C).
      *   Payoff of `σ₁`:
          *   Against Opp Profile 1: 0.5 * 3 + 0.5 * 1 = 2.0
          *   Against Opp Profile 2: 0.5 * 1 + 0.5 * 0 = 0.5
          *   Against Opp Profile 3: 0.5 * 0 + 0.5 * 3 = 1.5
      *   Compare to B:
          *   Against Opp Profile 1: B gets 0
          *   Against Opp Profile 2: B gets 3
          *   Against Opp Profile 3: B gets 1
      *   Is `σ₁` > B everywhere?
          *   Profile 1: 2.0 > 0 -> Yes
          *   Profile 2: 0.5 < 3 -> **NO!**
      *   `σ₁` doesn't dominate B. Check another mix...
      *   Consider `σ₁` = (0.5 A, 0.5 B). Payoffs: (1.5, 2.0, 0.5) vs C: (1, 0, 3). Not better everywhere.
      *   Consider `σ₁` = (0.5 B, 0.5 C). Payoffs: (0.5 * 0 + 0.5 * 1 = 0.5, 0.5 * 3 + 0.5 * 0 = 1.5, 0.5 * 1 + 0.5 * 3 = 2.0)
      *   Compare to A (3, 1, 0):
          *   Profile 1: 0.5 < 3 -> **NO!**
      *   **In this specific example, B is not dominated by any pure strategy *or* any mixed strategy over {A, B, C}. All three survive.** (This game often needs a different solution concept, like correlated equilibrium, as hinted by your LessWrong reading). However, it illustrates the *process*: we *had* to check for mixed dominance after pure dominance failed.

  **Key Takeaways:**

  1.  **Your procedure is correct for eliminating strategies strictly dominated by another *pure* strategy.**
  2.  **A strategy surviving pure-vs-pure elimination is only safe from being eliminated *by another pure strategy* in subsequent rounds *of the pure-vs-pure phase*.**
  3.  **After exhausting pure-vs-pure elimination, you MUST check if any remaining pure strategy is strictly dominated by a *mixed strategy* over the player's remaining pure strategies.**
  4.  **Elimination via mixed dominance can "re-open" the possibility of pure strategy dominance elimination in later rounds.**
  5.  **The process iterates between checking for pure dominance and mixed dominance until no more strategies can be eliminated by either.**

  **Recommendation:** Double-check your textbook's definition of "strictly dominated strategy." Many modern game theory textbooks explicitly define dominance *including* domination by mixed strategies (e.g., "strategy `s_i` is strictly dominated if there exists *a strategy* `σ_i` (pure or mixed) such that..."). If it does, then the mixed strategy phase is part of the standard IESDS procedure. If it only mentions domination by "another strategy" implying pure, then it might be describing only the pure-strategy phase. However, the most robust and commonly used version of IESDS includes mixed strategies.

  Your awareness of correlated equilibria (via LessWrong) is excellent context. IESDS is a fundamental solution concept refinement, while correlated equilibrium is a different, often more powerful, concept. Understanding how IESDS works, especially with mixed strategies, is crucial groundwork.
