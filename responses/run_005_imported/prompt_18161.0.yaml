answer: |-
  Here’s a toast that honors the paradox, her character, and the warmth of the moment, designed for that mixed audience:

  **(Raise your glass, pause for quiet, smile warmly at the Professor)**

  "Professor [Her Last Name], for over three decades, you walked into classrooms armed with a paradox. The Surprise Exam. You’d lay it out with devastating elegance: If an exam must happen by Friday and be a *surprise*, it can’t be Friday… because by Thursday night, we’d know. And so, it can’t be Thursday… and so on, backward, until the very possibility vanishes in a puff of logic. A guaranteed-but-unannounced event, you argued, seems impossible.

  **(Nod toward the crowd)**
  And then… you spent the semester *doing the impossible*. Pop quizzes materialized, genuinely unannounced, defying the very induction you’d just proven. It wasn’t just a lecture; it was a dare. A dare to the universe, to logic itself, and most of all, to us: *Could the unexpected truly happen?* You bet it could. You made it happen, week after week, year after year.

  **(Shift tone slightly, more personal)**
  Planning this party, we felt the ghost of that paradox hovering. ‘She’ll deduce it!’ some of us whispered. ‘She’ll apply backward induction to a retirement timeline, rule out possible dates, and land on this one!’ We half-expected you to walk in today, not surprised, but with that knowing look, ready to dissect our failed attempt at surprise with impeccable logic.

  **(Look directly at the Professor, genuine warmth)**
  But you didn’t. By all accounts, you were stunned. Truly, wonderfully surprised. And in that moment, something beautiful happened: the paradox met the professor, and the professor won. Not by disproving the logic, but by embodying something beyond it.

  **(Address the room)**
  You see, Professor [Last Name] taught us that logic is a powerful tool, a map of necessity and possibility. But she also taught us – through every unannounced quiz, every patient explanation after class, every moment she remembered a struggling student’s name or a birthday – that the map is not the territory. Life isn’t lived solely in the realm of pure deduction. It’s lived in the messy, contingent, beautifully *unpredictable* space where human connection, kindness, and genuine care operate.

  **(Back to the Professor)**
  Your signature lecture wasn't just about an abstract puzzle. It was a masterclass in intellectual humility. You showed us the limits of certain kinds of reasoning, not to defeat reason, but to make space for the things reason alone cannot capture: the joy of genuine surprise, the warmth of unexpected kindness, the profound impact a dedicated teacher has on lives spanning decades.

  **(Raise glass higher)**
  So today, we celebrate not just your retirement, but your glorious defiance. You dared the paradox to manifest, and when it did – in your quizzes, in this party – it proved something far deeper than the argument could contain: that surprise isn't just possible, it's precious. That care isn't logical, it's foundational. That a brilliant logician can also be the kindest person in the room.

  **(To the room)**
  To Professor [Last Name] – who taught us that the most important lessons often arrive unannounced, that logic illuminates the path, but humanity walks it, and that sometimes, the best way to honor a paradox is to live right through it, leaving us all delightfully, wonderfully stunned. Thank you for thirty-two years of making the impossible happen. Cheers!"

  **(Clink glasses, sustained applause)**

  **Why this works:**

  1.  **Acknowledges the Paradox Seriously:** It directly engages with the logic, explaining the tension ("ghost of that paradox," "half-expected") without getting bogged down in technicalities. It uses accessible language ("backward induction," "deduce it") while keeping it understandable for non-logicians.
  2.  **Uses the Party's Success:** The core point hinges on her *actual* surprise. It frames this not as a failure of logic, but as a triumph of her humanity *over* the sterile conclusion of the paradox in this specific, human context.
  3.  **Says Something True About Her:** It connects the paradox directly to her teaching *actions* (giving the quizzes) and her *character* (kindness, remembering students, care). The key insight is her embodying "intellectual humility" and showing that logic has limits defined by human experience.
  4.  **Works for the Mixed Audience:**
      *   **Logicians:** Will appreciate the accurate, respectful handling of the paradox and the clever twist ("the paradox met the professor, and the professor won," "map is not the territory").
      *   **Non-Logicians:** Will understand the gist of the paradox setup, relate to the surprise quizzes and her kindness, and feel the emotional core ("human connection," "kindness," "profound impact").
      *   **Everyone:** Connects her intellectual rigor to her personal warmth, creating a unified picture of her legacy. The toast celebrates qualities everyone experienced.
  5.  **Warmth and Focus:** The language is warm, personal ("Professor [Name]", "you taught us," "thank you"), and celebratory. It centers *her* impact and the significance of the moment. The final lines tie logic and kindness together beautifully.
  6.  **Length & Flow:** Designed to be delivered in 4-5 minutes. It moves logically: Setup the paradox -> Her defiance via quizzes -> The party's paradox tension -> Her actual surprise -> The deeper meaning (logic + humanity) -> The toast itself.

  This toast honors her unique blend of intellectual challenge and deep kindness, using the very paradox that defined her approach to illuminate the profound and wonderfully surprising impact she had.
