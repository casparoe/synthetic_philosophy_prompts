answer: |-
  Here is a dialogue between a Traditionalist (Trad) and a Revisionist (Rev), arguing over your specified scenario. Both engage directly with each other's points, drawing on Walzerian and McMahanian frameworks, and highlighting the core philosophical friction:

  **Scenario:** Ivan, a 19-year-old conscript from Agressoria, raised on state propaganda, faces execution for desertion if he refuses to fight. During Agressoria’s invasion of Defendia, Ivan kills Captain Rostova, a professional soldier defending her homeland.

  ---

  **Trad:** Look at this tragedy. Ivan and Rostova. Both soldiers, both following orders, both risking their lives. The law of armed conflict treats them identically: both are lawful combatants, both can be targeted, and if Ivan kills Rostova in combat, he commits no war crime. That symmetry is crucial. Rostova was defending her just cause, yes, but *Ivan* isn’t a criminal. He’s a pawn. How could he possibly know Agressoria’s war is unjust? Raised on propaganda, facing a firing squad for desertion… demanding he adjudicate the *jus ad bellum* is absurd. Combatant equality protects soldiers like Ivan from being judged as murderers simply because their state is the aggressor. It’s the only practical way war can be regulated.

  **Rev:** I agree Ivan isn’t a criminal in the ordinary sense. But the symmetry you praise is purely *legal* and *conventional*. It doesn’t reflect *moral reality*. Rostova was justly defending innocent lives against an unjust aggression. Ivan, however reluctantly, was participating in that aggression. He posed an *unjust threat* to Rostova and those she defended. Why should the *legal* permission granted to Ivan by Agressoria’s uniform magically erase the *moral* asymmetry? Rostova had a right to kill Ivan to stop his unjust threat. Did Ivan have a right to kill Rostova? Can we really say Rostova’s death is morally equivalent to Ivan’s would have been if she’d shot him first?

  **Trad:** Because the alternative is chaos! If we abandon combatant equality, every soldier becomes judge and jury in the fog of war. How is Ivan supposed to know his state’s war is unjust? His propaganda says it’s defensive! How is *Rostova* supposed to know Ivan is a conscript under duress? She sees an enemy soldier advancing. If she must weigh his personal culpability before defending herself, she’s dead. The law must provide bright lines: uniformed combatants are targetable. Making liability hinge on individual *knowledge* of the war’s justice renders the laws of war unworkable and endangers all soldiers.

  **Rev:** You’re conflating two things: moral *liability* to defensive killing, and *culpability* or blameworthiness. McMahan’s key move is separating justification from excuse. Rostova was *justified* in killing Ivan because he posed an *objective unjust threat* as part of the invading force, regardless of his beliefs. That’s her moral right of self-defense. But *Ivan*? His *excusing conditions* are profound: non-culpable ignorance (propaganda), duress (execution threat), lack of alternatives. He may not be *culpable* or *blameworthy* for posing that threat. He might even be *excused* for killing Rostova to save himself. But crucially, **excusability does not create moral symmetry**. Rostova was *justified* in her act; Ivan, at best, was *excused* for his. His excusable threat doesn’t grant him the *right* to kill her or negate her right to defend herself. The moral ledger isn’t balanced.

  **Trad:** So Rostova is justified in killing Ivan, and Ivan, though “excused,” is still morally liable to be killed? That feels perverse. If Ivan is excused – if he bears no moral fault due to circumstances – how can it be morally permissible to kill him? Doesn’t his lack of culpability shield him? And practically, if Ivan knows he’s liable to be killed even if blameless, while Rostova isn’t, doesn’t that destroy any incentive *he* has to follow *jus in bello* rules? Why should he restrain himself if he’s already deemed a legitimate target regardless?

  **Rev:** His lack of *culpability* shields him from *blame* and *punishment*, not necessarily from defensive force. Think of someone having a seizure while driving, veering towards pedestrians. They aren’t culpable, but you’d be justified pushing them off course, even harming them, to save the pedestrians. The pedestrians’ right to life outweighs the non-culpable driver’s interest in not being harmed. Similarly, Rostova and Defendia’s civilians have a right not to be unjustly attacked. Ivan’s excusable participation still makes him an instrument of that unjust attack. Defensive force against him is justified to stop it. His excusability doesn’t make him *innocent* in the relevant sense; he’s still causally contributing to the threat. As for incentives: Ivan *should* follow *jus in bello* because harming the innocent (civilians, prisoners) is always wrong, regardless of *ad bellum* justice. His liability stems from his role in the *unjust threat*, not his personal guilt.

  **Trad:** But you’ve made Ivan’s moral status utterly contingent on facts he cannot possibly know! He believes he’s defending his homeland. In *his* reality, *he’s* the Rostova. Your revisionism requires an impossible God’s-eye view of *jus ad bellum* truth. Soldiers must act on the information available *to them*. The law’s bright line – combatant status – provides that. Your model injects paralyzing doubt. Rostova *must* be able to shoot Ivan without a philosophical inquiry into his conscription status or Agressoria’s propaganda budget. The functional necessity of clear rules *in the field* demands the symmetry.

  **Rev:** And that’s where the crucial gap between morality and law appears. You’re right that *operationally*, bright lines are needed. Perhaps the *laws of war* must retain a form of combatant equality for practicality and to protect soldiers making split-second decisions. But we must not confuse that practical legal necessity with *moral truth*. Morally, Rostova’s act was justified defense; Ivan’s was, at best, excused participation in aggression. The symmetry is a legal fiction necessary for function, not a reflection of equivalent moral standing. We can (and should) craft laws to protect excusable combatants like Ivan *as much as possible*, perhaps emphasizing surrender options or post-conflict leniency, without pretending he had the same moral right to kill as Rostova. The tragedy is that Ivan, through no fault of his own, was placed in a position where he could only avoid wrongdoing by accepting death or imprisonment. That’s a profound injustice *to him*, inflicted by Agressoria. But it doesn’t transform his killing of Rostova into a morally neutral act equivalent to hers.

  **Trad:** So, bottom line: You concede the laws might need symmetry, but insist the *morality* is fundamentally asymmetrical. Ivan is excusable but not justified; Rostova is justified. His threat is still unjust, making him liable to defensive killing, however blameless he is personally. The weight of responsibility ultimately falls on the aggressor state, but the individual soldier still bears the lethal consequences of that state’s actions, morally and physically.

  **Rev:** Precisely. The moral burden of the unjust war creates the asymmetry. Excusing conditions mitigate *personal blame* for Ivan, but they don’t erase the objective wrongness of the threat he participates in, nor the defender’s right to stop it. The tragedy is real, but its source is Agressoria’s aggression, not the moral framework that recognizes Ivan’s excusable yet unjust role within it. Abandoning combatant equality *morally* doesn’t mean abandoning compassion or recognizing the state’s overwhelming culpability – it means honestly acknowledging that not all who kill in war stand on the same moral ground.

  **Where it Bottoms Out:**
  1.  **Epistemology & Feasibility:** Trad insists soldiers *cannot* know the objective *jus ad bellum* status, making individual moral liability assessments impossible mid-combat. Rev concedes operational law needs symmetry but insists this is a practical compromise, not moral truth.
  2.  **Justification vs. Excuse:** Rev’s core move. Ivan may be *excused* (non-culpable) but not *justified*; Rostova is *justified*. Excuse negates *blame* but not *liability* to defensive force for posing an objective unjust threat.
  3.  **Nature of the Threat:** Trad sees soldiers as mutual threats in a state conflict, creating symmetry. Rev sees Ivan (objectively) as an *unjust* threat due to his role in aggression, Rostova as a *just* threat in defense, creating asymmetry.
  4.  **Function vs. Morality:** Trad argues abandoning legal/moral symmetry destroys the functional laws of war. Rev argues we can (and must) separate the practical legal framework (which may retain symmetry) from the underlying moral truth (which is asymmetric), without letting the former obscure the latter.
  5.  **Source of Tragedy:** Both agree Agressoria bears overwhelming responsibility. Trad sees Ivan primarily as its victim. Rev agrees Ivan is *also* a victim, but emphasizes that his victimhood doesn't nullify the unjust nature of the threat he posed or Rostova's right to stop it.

  The fundamental, unresolved tension is between the **practical necessity and moral clarity of bright-line rules** in the horrific context of war (Trad) and the conviction that **objective moral truth about justification cannot be overridden by convention or practicality**, even if law must sometimes diverge from it (Rev). They agree on the tragedy but fundamentally disagree on whether Ivan and Rostova, in that fatal moment, occupied positions of moral equivalence.
