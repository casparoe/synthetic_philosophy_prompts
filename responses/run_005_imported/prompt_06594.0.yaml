answer: |-
  Here are 10 tightly focused interview questions probing the tensions in Aquinas's position on tyrannicide, designed to avoid recapitulation and push for deeper analysis, with strategic follow-ups:

  **Core Tensions & Distinctions:**

  1.  **Question 1:** Aquinas makes a crucial distinction between a tyrant *ex defectu tituli* (usurper) and one *ex parte exercitii* (legitimate title, tyrannical rule). He seems far more comfortable justifying forcible removal, even killing, of the former. *Beyond the obvious lack of legitimacy, what specific features inherent to the situation of "usurpation" does Aquinas leverage in his reasoning to make resistance less problematic under natural law?*  
      *   **Likely Answer:** Emphasis on usurpation as an ongoing act of violence/robbery against the *res publica*, making the usurper analogous to a brigand subject to private self-defense principles. The community retains its *de jure* authority.
      *   **Follow-Up:** If a usurper successfully consolidates power for years, establishing *de facto* control and silencing dissent, does Aquinas's framework still permit private individuals to act, or does the situation effectively morph into the more problematic *ex parte exercitii* case, requiring public authority? Where's the line?

  2.  **Question 2:** Conversely, resisting a tyrant *ex parte exercitii* is severely restricted by Aquinas. He argues the *community* must act through due authority, not private individuals. *Does Aquinas provide a clear, practical mechanism for how a community stripped of its rights and terrorized by a legitimate-born tyrant can actually *constitute* itself as a "public authority" capable of authorizing resistance? Or is this requirement potentially a fatal flaw in his practical doctrine?*  
      *   **Likely Answer:** He relies on existing structures (e.g., lesser magistrates, estates, the nobility as representatives of the community) or vague appeals to the "whole people." He assumes some residual corporate capacity exists.
      *   **Follow-Up:** Precisely in the worst tyrannies – where assemblies are banned, magistrates purged, and nobles cowed or co-opted – this residual capacity vanishes. Does Aquinas's insistence on "public authority" in these cases effectively function as a *prohibition* on resistance, leaving only prayer and suffering? Is his framework adequate for systemic oppression?

  **Prudence vs. Principle & Divine Scourge:**

  3.  **Question 3:** Aquinas's primary argument against private tyrannicide of a *legitimate* tyrant is the danger of abuse by ambitious men killing good rulers. *Is this caution presented by Aquinas as a *prudential application* of natural law principles (e.g., prioritizing order to avoid greater evil), or does it function more as an *external override* of a potential natural law right to remove a manifestly unjust ruler threatening the common good?*  
      *   **Likely Answer:** It's presented as a necessary consequence of natural law itself – the common good requires order and avoiding greater evils like civil war or anarchy. Prudence is integral to practical reason applying natural law.
      *   **Follow-Up:** Doesn't this effectively subordinate the fundamental natural law principle that unjust authority loses its binding force (*raptor iustitiae*) to the contingent fear of *potential* future abuses? Does this not risk making the *effectiveness* of tyranny a shield against its removal?

  4.  **Question 4:** Aquinas invokes the idea that tyranny can be a "scourge of God" permitted for the people's sins (*De Regimine*, I, 6). *How does he reconcile this counsel towards patience and repentance with his *theoretical* allowance for resistance by public authority? Does the "scourge" argument functionally take precedence, especially when no higher temporal authority exists to appeal to?*  
      *   **Likely Answer:** The "scourge" argument counsels patience and introspection *first*, but it doesn't *absolutely* preclude resistance authorized by the community acting corporately. God's permissive will doesn't negate human responsibility under natural law.
      *   **Follow-Up:** But if tyranny is framed as divine punishment, doesn't active resistance risk compounding the sin? In the absence of any identifiable "public authority" capable of acting (the core practical problem), doesn't this theological framing strongly push the suffering populace *only* towards passive endurance and prayer, effectively nullifying the theoretical resistance option?

  **Later Scholastic Developments & Fidelity:**

  5.  **Question 5:** Later scholastics like John of Paris, Suárez, and especially Mariana expanded justifications for tyrannicide significantly beyond Aquinas's cautious position. Focusing on Mariana: *Is his famous, more permissive stance primarily a *logical extension* of Aquinas's core natural law principles (like the common good as the *telos* of rule) once certain prudential hesitations are relaxed, or does it represent a *fundamental departure* in its willingness to empower individuals or small groups acting without formal public authorization?*  
      *   **Likely Answer:** Mariana and others *argued* they were extending Aquinas, emphasizing the core principle that a ruler who destroys the common good forfeits his right. They downplayed Aquinas's prudential fears as context-specific.
      *   **Follow-Up:** Given Aquinas's *explicit* rejection of private judgment and action against a *legitimate* tyrant, and his insistence on public authority, doesn't Mariana's allowance for a "private citizen" (albeit ideally after public declaration of tyranny) actually cross a crucial *procedural* line established by Aquinas, turning a doctrine about corporate action into one potentially sanctioning individual vigilantism? Was the post-Henry IV scandal partly a recognition of this departure?

  **Bonus Nuance Question:**

  6.  **Question 6:** Aquinas discusses the possibility of a higher authority (like the Emperor or Pope) deposing a tyrannical king (*De Regimine* I, 6). *How integral is this appeal to a hierarchical superior to his *overall* framework for resisting *ex parte exercitii* tyranny? Does the absence of such a universally recognized superior in post-medieval Europe fundamentally undermine the applicability of his doctrine?*

  **Structure for 15 Minutes:**

  1.  Start with **Question 1** (Usurper/Legit Distinction - Core Reasoning).
  2.  Move to **Question 2** (Public Authority Mechanism - Practical Flaw?).
  3.  Probe **Question 3** (Prudence vs. Principle - Override?).
  4.  Shift to **Question 4** (Divine Scourge vs. Resistance).
  5.  Conclude with **Question 5** (Mariana - Extension or Departure?).
  6.  Use **Question 6** (Higher Authority) or **Question 2 Follow-Up** if time allows and conversation flows that way.

  **Key to Success:**

  *   **Listen Actively:** Your follow-ups depend entirely on her specific answers. Be ready to adapt the *wording* of your planned follow-ups based on what she says, or even skip one if she preemptively addresses it.
  *   **Signal Transitions:** Briefly acknowledge her point ("That's helpful context on the usurper distinction...") before moving to the next tension/question.
  *   **Keep Concise:** Phrase the questions clearly but economically. You might need to drop one question if discussion is rich.
  *   **End Strong:** Ensure you get to **Question 5** about Mariana vs. Aquinas – it's the perfect capstone linking historical context to your documentary's core theme.

  These questions force engagement with the *why* and the *how* behind Aquinas's distinctions, his unresolved tensions (especially regarding practical implementation), and the critical jump made by his successors, moving beyond the simple "usurper yes, legit tyrant no" summary. Good luck with the interview and the documentary!
