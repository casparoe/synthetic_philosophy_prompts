  The self-undermining aspect is crucial. If Boltzmann brains are more probable, they undermine the theories predicting them. Boltzmann valued predictive success, so this might trouble him. Yet, in his time, he dismissed similar objections by focusing on what we observe. He'd likely do the same now, trusting current observations over far-future probabilities.

