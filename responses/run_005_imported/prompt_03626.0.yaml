  - **Money-pump arguments**: These are at the heart of the debate. They directly illustrate the vulnerability of non-expected-utility agents to exploitation. This is a practical and intuitive demonstration and is central to the AI risk argument. Thus, **S tier**.

  - **Dutch book arguments**: Similar to money-pumps but for probabilistic coherence (usually in the context of betting). They are foundational in Bayesian probability and decision theory. However, they are more about beliefs and probabilities than about actions and outcomes in the same direct way as money-pumps. Still, very core. **A tier** because money-pumps are slightly more direct for the action/utility part.

  - **von Neumann-Morgenstern theorem (VNM)**: This is a foundational theorem in utility theory, showing that if an agent satisfies certain axioms, it must be an expected utility maximizer. It is a key formal result and often cited. However, it assumes the agent has preferences over lotteries and requires the axioms to hold. It's a cornerstone, but the debate often centers around whether these axioms are necessary for rationality. **A tier** (maybe S, but let's see).

  - **Savage's theorem**: This is a more general foundation for decision theory under uncertainty, which derives both probability and utility from preferences. It is a major result and is often considered the gold standard for Bayesian decision theory. However, it is more complex and the assumptions are stronger. It's highly relevant but might be less directly accessible. **A tier**.

  - **Wald's complete class theorem**: This theorem shows that in statistical decision theory, any decision rule that is not Bayesian (i.e., not expected utility maximizing) can be dominated. It's a strong result but is more technical and less commonly discussed in AI risk circles outside of specialized discussions. It's important but not the most cited. **B tier**.

  - **Yudkowsky's "Coherent decisions imply consistent utilities" post**: This is a key piece in the AI alignment literature, making the coherence argument accessible and tying it to AI risk. It's influential and directly argues for the position. However, it's a blog post and not a formal theorem. But in terms of influence in the debate, it's high. **S tier** because it's often the primary reference in the community.

