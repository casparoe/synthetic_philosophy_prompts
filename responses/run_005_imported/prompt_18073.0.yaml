  First, I need to grasp why their friends' answer about "developing a feel" isn't enough. The user wants a principled method, not just intuition. They're dealing with an epistemological problem—how to know truth when access is mediated. The sharp version of the puzzle is that any check you can do is inherently in the verifiable zone, leaving the unverifiable zone untouched. So, is there any way to bridge that gap?

  Looking at possible approaches, redundancy comes to mind. Using multiple fixers or interpreters could help. If their accounts align, especially on unexpected details, that might indicate accuracy. But the user might not always have the resources for that. Also, if all fixers share similar biases, it might not work. 

  Then there's the idea of consistency traps. Designing questions where answers must align later. Like asking for specific examples or future implications. If a fixer is fabricating, maintaining consistency across layers could be hard. But this relies on the interviewee being consistent, which isn't always the case. People contradict themselves, so false positives are possible.

  Another angle is exploiting the fixer's ignorance. Asking something only the interviewee would know, which the fixer couldn't predict. If the fixer relays something unexpected and detailed, it's more likely genuine. But this requires preparation and knowing what to ask. Also, the fixer might still interpolate their own ideas.

  The user’s deeper need seems to be about mitigating uncertainty in a field reliant on human intermediaries. They might also be grappling with the ethics of their role—how their expectations influence the information they receive. The structural vulnerability they describe highlights a fundamental limitation in cross-cultural journalism.

