answer: |-
  Your questions cut to the heart of Pascal's nuanced view on divine hiddenness. Let's unpack the tensions and clarify his position, drawing on the text and his broader thought:

  ### 1. **Obduracy vs. Seeking "With All Their Heart": Compatibility or Tension?**
     - **Superficial Tension:** At first glance, "obduracy" (stubborn resistance/sinfulness) as grounds for merited punishment *seems* at odds with God calibrating revelation to present sincerity ("seeking with all their heart"). One emphasizes past guilt; the other, present disposition.
     - **Pascal's Harmonization:** For Pascal, these are two sides of the *same* human condition:
       - **"Obduracy" as the Default State:** Humans are universally "unworthy" due to fallen nature ("concupiscence"). This explains God's *right* to remain hidden universally.
       - **"Seeking" as the Dispositional Exception:** God's compassion intervenes where individuals actively, sincerely seek Him. This seeking isn't self-generated merit but a grace-enabled disposition overriding obduracy.
       - **Key Synthesis:** Obduracy *is* the barrier God overcomes for the seeker. The non-seeker's hiddenness is both:
         - *Consequence* of persistent obduracy (punitive/just aspect).
         - *Calibration* to their present, active rejection ("fleeing with all their heart") – a dispositional aspect.
       - **Textual Support:** Pascal explicitly links the two: God refuses some "because of their obduracy" **and** hides from those who "flee from Him with all their heart." Obduracy manifests *as* the fleeing/seeking disposition.

     **Verdict:** No fundamental tension. Obduracy is the *root sin*; "fleeing" or "seeking" is its *present epistemic manifestation*. God responds to the manifestation.

  ### 2. **"Visible to Seekers, Not to Non-Seekers": Evidential or Motivational?**
     This is crucial for engaging Schellenberg. Pascal strongly favors a **motivational/volitional interpretation**, not an evidential one:
     
     - **Evidence is Objectively Present, Subjectively Apprehended:** Pascal believes the signs (e.g., prophecy, miracles, Church endurance) are *there* ("There is enough light"). The difference lies in *perception*, not the evidence itself.
     - **Non-Seekers are Epistemically Blinded by Will/Heart:**
       - "Enough obscurity for those who have a contrary disposition": Obscurity arises from the *disposition*, not the evidence.
       - "He could not be known by those who should sincerely seek Him" (implying seekers *can* know) vs. "hidden from those who flee": The barrier is the orientation of the will.
       - **Pascal's Epistemology:** For Pascal (following Augustine), knowledge of God requires "the heart" (*le coeur*) – the seat of love, will, and intuition. Pure reason is insufficient and easily corrupted by desire ("The heart has its reasons..." - Pensée 423). Non-seekers "flee" – they *actively avoid* or *willfully misinterpret* the evidence due to disordered loves (pride, sensuality, distraction).
     - **Not Literal Undetectability:** If the evidence were *literally* undetectable to non-seekers, seeking couldn't start. Pascal implies non-seekers *perceive* the signs but dismiss, ignore, or explain them away ("They have a contrary disposition"). Seeking requires a volitional turn *first*, enabling proper perception.
     - **Schellenberg Relevance:** This directly counters Schellenberg's "non-resistant non-believer." For Pascal:
       - **True non-resistance *is* seeking:** Anyone genuinely open/resistant to *nothing* (including their own pride/desires) *would* be seeking God "with all their heart."
       - **Non-belief implies resistance:** Persistent non-belief *is* evidence of a resistant ("fleeing") heart, blinding the individual to the evidence available. There *are* no "non-resistant" non-believers in the relevant sense.

     **Textual Verdict:** Overwhelmingly motivational/volitional. The *same* evidence is available; the *ability to recognize it as divine* depends entirely on the orientation of the will/heart.

  ### Synthesis & Conclusion
  1.  **Obduracy & Seeking:** Pascal coherently integrates punitive and dispositional elements. Universal human obduracy warrants universal hiddenness, but God's compassionate character leads Him to override this for those whose present disposition is one of active, wholehearted seeking (itself enabled by grace). Non-seekers remain hidden due to both their obduracy (meriting punishment) and their present fleeing disposition (calibrating the revelation).
  2.  **Visibility of Signs:** Pascal's core argument is motivational. God provides sufficient objective evidence ("light"). Non-seekers fail to perceive its divine significance *because* their hearts are turned away ("fleeing"), leading to misinterpretation or dismissal. Seekers, with hearts oriented toward God, perceive the same evidence correctly. This rejects the idea of purely "neutral" access to evidence.

  **Textually Defensible Reading:** The motivational/dispositional reading is far more consistent with:
      - The specific language of "seeking/fleeing with all their heart."
      - Pascal's repeated emphasis on the "heart" as the organ of religious knowledge.
      - His broader theology of human fallenness and the necessity of grace/humility for true perception.
      - The phrase "He so *regulates the knowledge* of Himself" – implying a divine action *responsive* to the human disposition, not a static property of the evidence itself.

  This makes Pascal a potent, though controversial, responder to Schellenberg: divine hiddenness reflects not divine absence or lack of evidence, but the epistemic consequences of human resistance, resolved only by a transformation of the will/heart (seeking). Whether this *satisfies* Schellenberg's challenge (e.g., regarding the possibility of *inculpable* non-belief) is the debate your seminar will likely explore. Pascal would deny such a state exists.
