  First, I need to recall Lob's theorem. It states that if a system can prove that "if I can prove P, then P is true," then it can prove P outright. The user is concerned because this seems to prevent an agent from trusting its future self or successors without falling into inconsistency. They mentioned that intuitive solutions like verifying future reasoning don't hold up formally. 

  The user's main questions are: 1) Is this a fundamental limitation, or does it dissolve with probabilistic/bounded approaches? 2) Are there practical workarounds for their non-formal system? They also mention parametric or bounded versions of Lob's theorem and agents cooperating with weaker copies.

