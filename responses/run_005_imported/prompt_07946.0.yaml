answer: |-
  I argue that CEV *cannot* escape the alienation/authority problem inherent in ideal-advisor theories, and that its "coherence-across-persons" step actively compounds this issue by demanding deference to a consensus of hypothetical strangers. The strongest defense of CEV—that idealization merely removes factual errors and akrasia without altering core values—fails when confronted with the explicit *transformative* elements of the proposal, particularly the "grown up farther together" clause. This clause isn't a minor qualifier; it's a value-altering engine that severs the link between current individuals and their extrapolated counterparts, rendering the resulting consensus alien and authority-less. I'll dismantle the defense step by step.

  ### The Core Alienation Problem: When "You" Become a Stranger
  The Rosati-Sobel objection is devastating because it highlights a paradox: **the more thoroughly you idealize an agent to ensure "reliably wise" preferences, the less those preferences remain *yours***. Consider:
  - **Current You**: Embedded in a specific life history, with values shaped by contingent experiences, biological drives, and cultural context. You might value artistic creation, family loyalty, or personal autonomy, even if inconsistently pursued.
  - **Idealized You**: Factually omniscient, perfectly rational, free of akrasia, *and* "grown up farther together." This entity has processed all human knowledge, lived in a frictionless mental space, and undergone extended moral maturation. Its values are likely *unrecognizable* to current you.  
    - *Example*: Current you might prioritize career ambition. Idealized you, understanding the full psychological and ecological costs of late capitalism, and having "grown" into a broader perspective, might reject competitive individualism entirely in favor of communal sustainability. This isn't a "correction" of current you's factual errors—it's a *value revolution* born of radical self-transformation.  

  The authority problem is clear: **Why should current you defer to this enlightened stranger?** The idealized self's preferences are untethered from the desires, relationships, and commitments that *constitute* current you's identity and ground your practical reasons. Deference becomes self-alienation.

  ### Why the "Just Remove Errors/Akrasia" Defense Fails
  CEV defenders might reply: *"Idealization only strips away irrationality and ignorance; it doesn't invent new values. 'Grown up farther together' just means resolving internal conflicts, not becoming someone else."* This fails for three reasons:

  1.  **"Grown Up Farther Together" Is Inherently Transformative**:  
      Growth isn't neutral. It implies *development through novel experiences and reflections*. To "grow up farther" is to become a person who has grappled with perspectives and consequences *inaccessible* to current you. This isn't merely "fixing" current you—it's *evolving beyond* them.  
      - *Concrete case*: Current you values national sovereignty. Idealized you, having "grown up farther" in a globally interconnected society with full knowledge of history's atrocities, might see sovereignty as a dangerous fiction. This isn't akrasia correction; it's a fundamental shift in moral ontology. The defense reduces growth to a technical adjustment, ignoring its existential depth.

  2.  **Idealization *Creates* New Values Through Integration**:  
      Perfect rationality and full information don't just clarify existing goals; they force *synthesis* of conflicting values in ways that generate novel priorities. Your current "incoherent" values (e.g., "maximize personal freedom" vs. "ensure community stability") aren't errors—they're live tensions. Resolving them under idealization *produces* a new value framework.  
      - *Example*: Current you has unresolved tension between career ambition and family time. Idealized you, free of akrasia and with full knowledge of life outcomes, doesn't just "balance" these—they might synthesize them into a new priority like "cultivating generational legacy," which neither reflects current you's struggle nor feels like their own.

  3.  **The Psychology Drift is Inevitable and Alienating**:  
      "Thinking faster" and "knowing more" alter cognition at a structural level. Neuroscience shows our values are tied to embodied, heuristic-driven cognition. A mind without cognitive biases, processing information at superhuman speed, wouldn't just be "you but better"—it would be a distinct entity with alien preferences.  
      - *Analogy*: Asking why current you should defer to idealized you is like asking why a caterpillar should defer to a butterfly's judgment. The butterfly's preferences (e.g., for open skies over leaves) are incomprehensible to the caterpillar, whose entire world is defined by crawling and chewing.

  ### How the Coherence Step Compounds the Problem
  CEV doesn't just idealize individuals—it demands *consensus* among these alien beings. This "coherence" step is sold as a source of robustness but actually **amplifies alienation and undermines authority**:

  1.  **Consensus Averages Away Individuality**:  
      The "overlap" among extrapolated volitions isn't a discovery of shared humanity—it's a *lossy compression* of divergent idealizations. Unique values (e.g., a musician's devotion to art, a scientist's obsession with truth) are discarded if they don't survive the averaging process. What remains is a bland, lowest-common-denominator utilitarianism alien to all.  
      - *Example*: Extrapolated Alice (formerly an artist) now values cosmic aesthetic harmony. Extrapolated Bob (formerly an engineer) values efficient resource optimization. Their "coherent" overlap might be "maximize systemic harmony," which neither current Alice nor Bob would recognize as their life's project.

  2.  **Drift Magnifies in Aggregation**:  
      Each idealized individual is already estranged from their current self. Forcing consensus among them creates a **double alienation**: current humans are asked to defer not to a version of themselves, but to a *crowd of strangers* negotiating a treaty.  
      - *Concrete case*: Current populations value national identity. Their extrapolated selves, having "grown up farther" into cosmopolitan enlightenment, converge on open borders. But this consensus feels *imposed* on current humans—not because they're irrational, but because their *actual* values (shaped by lived community) were idealized away.

  3.  **Authority Dissolves Completely**:  
      The "coherent" output has no claimant. It isn't *yours* (your extrapolated self was diluted in the consensus), nor is it *humanity's* (humanity never endorsed this process). The superintelligence would be serving a fictional entity—"Coherent Humanity™"—with no moral claim on real humans.  
      - *Why this matters*: For CEV to avoid paternalism, the extrapolated volition must *bind* current humans. But if the process generates alien preferences, real humans have every reason to rebel. Consensus among idealized phantoms doesn't solve this; it makes the output *more* remote.

  ### Verdict: CEV Repeats and Worsens the Ideal-Advisor's Failure
  CEV collapses under the weight of its own idealizations. **The "grown up farther together" clause guarantees value drift that severs authority, and the coherence step transforms alienation from individual to collective.** The strongest defense—that CEV only corrects errors—ignores that *growth and synthesis are creative, not corrective*. Once we admit that idealization can *change* who you are (not just clarify what you want), the tether to current values snaps. The consensus of these transformed selves is then not just alien but *anonymous*, a utopian abstraction no one alive has reason to endorse. 

  If we build a superintelligence targeting CEV, we risk it serving the interests of hypothetical post-humans who bear no meaningful relationship to us—a fate no less terrifying than paperclip maximization. The authority problem isn't solved; it's buried under layers of idealization until the original subject disappears entirely.
