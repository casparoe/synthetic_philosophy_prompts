prompt: |-
  So a few weeks ago the mod team on a subreddit I've been active on for years basically imploded and I got roped into helping out, and this week I hit a case that's honestly been bugging me way more than it probably should. Someone posted a screenshot of a DM where a troll called them a slur, as evidence for a harassment report — so the word is right there in the post, but they're the target, not the one using it. The same day, someone else quoted a line from a song using the same word in a thread discussing the lyrics, and a third guy wrote something like "I'm not calling him [slur], but—" and then said something pretty nasty anyway. Our auto-filter nuked all three posts, and now its on me to decide what actually happens to each one, and "context matters" is basically the only principle I've got, which feels less like a principle and more like an excuse not to have one.

  I took exactly one philosophy of language class in undergrad, like six years ago, and I have this nagging half-memory that theres a whole debate about whether a slur's offensiveness is actually part of its literal meaning (so it works like normal descriptive content and should behave accordingly under things like negation) or whether it's more like a presupposition or some other pragmatic attachment that just rides along with the word no matter what you do to the sentence around it — which would explain why the "I'm not calling him X" guy still seems to be doing something with the word even though he's technically negating it. Can you lay out the most important implications of that semantics-vs-pragmatics debate for how I should actually be handling moderation calls like my three cases above? I'm less interested in a history-of-the-literature answer and more in whether the debate actually cashes out in different verdicts for quoting vs. reporting vs. negating a slur, or whether digging into it just confirms there's no clean rule here and I should stop looking for one.
