prompt: |-
  In my AP European History class, we recently spent a week on the Marquis de Condorcet as part of a unit on the Enlightenment, and the detail that stuck with me most was not his political activism but a mathematical result our teacher mentioned almost in passing: the Condorcet Jury Theorem, from his 1785 essay applying probability theory to majority decisions. The idea that a group of voters who are each only slightly more likely than not to be correct about some factual question will, if their judgments are independent, reach the right verdict with near certainty as the group grows large enough seems to have been, for Condorcet, just one piece of a larger project of building a genuine "social mathematics" that could ground political decisions in something more rigorous than tradition, rhetoric, or aristocratic privilege. What impressed me further is that he applied this commitment to equality with unusual consistency: he was one of the very few Enlightenment figures to argue seriously for extending full citizenship and the vote to women, and he chaired the constitutional committee that in 1793 produced a draft constitution for France, sometimes called the Girondin constitution, which was quietly set aside once his political allies fell from power.

  Not long after that unit, a friend sent me a link to a blog post about "futarchy," a governance proposal from the economist Robin Hanson, whose slogan for it is roughly "vote on values, but bet on beliefs": an elected body would decide on and periodically update some measurable definition of national welfare, while the choice of which specific policy to adopt in order to raise that measure would be handed over to speculative markets, where anyone willing to risk money could bet on the outcomes of different proposed policies, with whichever policy the market currently prices as most likely to raise expected welfare being the one that actually gets implemented. It struck me as a strange descendant of exactly the kind of probability-driven, anti-rhetorical approach to collective judgment that Condorcet was reaching for, except that it replaces his equally-weighted, independent voters with self-selected traders whose influence over the outcome is proportional to how much money they are willing and able to stake.

  I would like you to reconstruct, as specifically as you can from Condorcet's own arguments rather than from a generic impression of "Enlightenment rationalism," what verdict he would likely have reached about futarchy as a mechanism of governance. Would he have welcomed it as finally realizing, through real institutions and incentives, the kind of mathematically disciplined aggregation of judgment his jury theorem only gestured toward on paper? Or would his own theoretical commitments have generated principled objections to it, for instance about whether traders who can observe and imitate one another's positions still satisfy the independence condition his theorem depends on, or about whether letting wealth determine political influence betrays the same egalitarian instincts that led him to defend women's suffrage and to distrust arguments from mere privilege? I would also be curious whether you think the divide at the center of futarchy, between values settled democratically and beliefs settled by markets, corresponds to anything in Condorcet's own writing about which political questions should be left to specialized judgment and which should be decided by the broader citizenry.
reasoning: |-
  Okay, the user is asking about Marquis de Condorcet's potential views on Robin Hanson's futarchy. They provided a lot of context from their AP European History class, focusing on Condorcet's Jury Theorem and his egalitarian principles. The user is curious whether Condorcet would support futarchy as a modern application of his ideas or object to it based on his commitments to equality and independence in decision-making.

  First, I need to recall Condorcet's key principles. His Jury Theorem emphasizes that independent voters, each slightly better than random, can reach correct decisions collectively as the group grows. He valued mathematical rigor in social decisions and was a strong advocate for equality, including women's suffrage. His draft constitution in 1793 reflected these ideals.

  Now, futarchy proposes separating values (voted on democratically) and beliefs (determined by prediction markets). The markets allow people to bet on policies' outcomes, with wealth influencing the impact. I need to compare this with Condorcet's ideas.

  Looking at independence: Condorcet stressed that voters should decide independently without influence from others. Prediction markets, however, involve traders observing and mimicking each other, leading to herd behavior. Condorcet would likely see this as violating the independence necessary for reliable outcomes.

  Next, equality. Condorcet believed in equal political influence regardless of wealth or status. Futarchy's reliance on financial stakes means those with more money have more sway. This directly contradicts his egalitarian principles, similar to his arguments against privileging the wealthy or excluding women.

  The values-beliefs split in futarchy might resonate with Condorcet's distinction between general will and administrative decisions. He might agree that some technical decisions need expertise. However, he still emphasized democratic oversight and accountability, whereas futarchy's markets operate without public deliberation or scrutiny. Condorcet would probably prefer expert bodies accountable to elected officials rather than opaque markets.

  Condorcet also valued public reason and civic education. Decision-making wasn't just about outcomes but fostering an informed citizenry. Markets lack transparency and don't encourage public discourse, which he saw as essential for a functioning democracy.

  Additionally, the risks of market manipulation and short-term thinking in futarchy would concern him. He preferred structured, deliberative bodies over speculative mechanisms vulnerable to corruption and irrational trends.

  So, while the mathematical aggregation in futarchy might initially appeal to Condorcet's love for social mathematics, the violations of independence, equality, and democratic accountability would lead him to reject it. He'd likely see it as a technocratic system that undermines the egalitarian and deliberative foundations he championed.
answer: |-
  Based on Condorcet's specific theoretical commitments and political philosophy, particularly as articulated in his *Essay on the Application of Analysis to the Probability of Majority Decisions* (1785) and his political writings like the *Girondin Constitution* draft, his verdict on futarchy would likely be **sharply critical, rooted in principled objections** rather than welcoming it as a realization of his vision. Here's a reconstruction of his likely reasoning, point by point:

  1.  **Violation of the Independence Assumption:** Condorcet's Jury Theorem *crucially* depends on voters forming their judgments *independently*. In futarchy's prediction markets, traders constantly observe prices (aggregated beliefs) and each other's positions. This creates powerful herding incentives, information cascades, and momentum trading, where decisions are demonstrably *not* independent. Condorcet understood the fragility of his theorem's conditions; he explicitly discussed dependencies (like shared misinformation) as a major source of error. He would see futarchy's markets as structurally amplifying dependence, not minimizing it, thereby undermining the very mathematical guarantee he sought. The market's aggregation mechanism is fundamentally different from the independent-voter model his theorem requires for reliable convergence to truth.

  2.  **Betrayal of Radical Egalitarianism:** Condorcet's commitment to equality was foundational and unusually consistent:
      *   **Wealth ≠ Competence/Rightness:** His Jury Theorem assumes each voter has an *equal and independent* chance (p > 0.5) of being correct. Influence is equal. Futarchy explicitly ties influence in the "belief" domain (the core policy decision) to willingness and ability to stake wealth. Condorcet would see this as substituting a morally arbitrary factor (wealth) for the relevant capacity (epistemic competence on the factual question). He explicitly argued against privilege based on birth or status; wealth-based privilege would be equally anathema.
      *   **Women's Suffrage Analogy:** His advocacy for women's suffrage stemmed from the belief that reason and the capacity for sound judgment were not determined by sex. Extending this principle, he would argue that reason and the capacity to assess policy outcomes are not determined by wealth. Excluding or diminishing the influence of the less wealthy in the crucial policy-selection process would violate the same egalitarian principle that drove his support for women's rights. Futarchy effectively creates a plutocracy for policy choice, which directly contradicts his vision of equal citizenship.
      *   **Constitutional Commitment:** His 1793 draft constitution embodied radical egalitarianism, emphasizing broad suffrage and popular sovereignty. Concentrating decisive power in the hands of those who can bet the most would be seen as a regression, not progress, from this ideal.

  3.  **The Values/Beliefs Divide: Oversimplification and Democratic Abdication:** While Condorcet might find *some* resonance in distinguishing types of questions, futarchy's rigid split would likely strike him as problematic:
      *   **Values are Intertwined with Facts:** Condorcet believed in reason's power to illuminate both facts *and* values. He saw enlightened public deliberation as crucial for refining both. Rigidly separating "values" (voted on) from "beliefs" (bet on) might seem artificial. Deciding *what* constitutes "national welfare" (the value) often involves complex factual assumptions about human nature, causality, and consequences. Locking this in periodically doesn't resolve this entanglement.
      *   **Democratic Oversight of Implementation:** While Condorcet acknowledged the need for expertise in administration and implementation (he envisioned bodies of experts *appointed* by elected representatives), he insisted on mechanisms of popular control and accountability. Futarchy removes the *choice of means* entirely from democratic oversight, placing it in an opaque market mechanism accountable only to its wealthy participants. Condorcet would likely argue that the *how* of achieving public goals is inherently political and requires democratic deliberation and accountability, not just the *what*. His constitutional draft emphasized representative bodies precisely to handle complex governance while remaining answerable to the people.
      *   **"Specialized Judgment" ≠ Speculative Markets:** Condorcet might agree that specialized bodies (e.g., scientific academies, technical committees) could advise on complex factual matters. But he distinguished this sharply from *decision-making power*. These bodies would inform representatives or administrators who remained accountable. A speculative market is not a body of disinterested experts providing reasoned analysis; it's a profit-driven mechanism. He would likely see it as a poor substitute for informed, accountable specialized judgment and a dangerous replacement for democratic control.

  4.  **Rejection of Markets as the Engine of Reason:** Condorcet sought a "social mathematics" grounded in reason, evidence, and deliberation. Speculative markets aggregate beliefs driven by profit motives, information asymmetry, herd behavior, and often short-term thinking. While they *can* be efficient information processors under ideal conditions, Condorcet would likely view them as fundamentally different from, and inferior to, the reasoned, independent judgment of equal citizens that his Jury Theorem idealized. He valued public reason and civic education; markets operate through private incentives and lack transparency in individual reasoning. The "anti-rhetorical" aspect might appeal, but the replacement mechanism (market dynamics driven by wealth) would be seen as substituting one form of potentially irrational or privileged influence (rhetoric) with another (speculative capital).

  5.  **Risk of Manipulation and Distortion:** Condorcet, aware of the fragility of rational systems in the face of passion and power, would likely be acutely concerned about the vulnerability of prediction markets to manipulation by wealthy actors, misinformation campaigns, or irrational bubbles – distortions that directly undermine the epistemic justification futarchy claims. His focus on independence and competence was partly a safeguard against such distortions.

  **Conclusion:**

  Condorcet would likely see futarchy as a **profoundly misguided perversion of his ideals**, not their realization. While the aspiration to ground policy in rigorous probabilistic judgment might initially resonate, the specific mechanism would violate his core principles:

  1.  **Epistemically:** By destroying the independence of judgments and tying influence to wealth (not competence), it undermines the mathematical conditions for reliably reaching correct outcomes.
  2.  **Politically:** By concentrating decisive policy power based on wealth, it betrays his radical commitment to equal citizenship and popular sovereignty, replicating the very privilege-based systems he opposed.
  3.  **Procedurally:** By removing policy choice from democratic oversight and deliberation and handing it to an unaccountable market, it abandons the project of collective reasoning and civic empowerment central to his vision.

  He would likely argue that futarchy replaces the potential tyranny of rhetoric or aristocracy with a potential tyranny of speculative capital, failing to achieve the genuinely egalitarian and rationally grounded "social mathematics" he envisioned. His preferred path would involve strengthening democratic institutions, civic education, and mechanisms for informed deliberation among equal citizens, combined with accountable specialized advice – not bypassing democracy with markets. The "strange descendant" would likely be seen as an illegitimate heir.
