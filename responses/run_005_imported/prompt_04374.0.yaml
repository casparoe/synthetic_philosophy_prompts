  Write a dialogue between a Hartian legal positivist and a Fullerian natural lawyer about the 1949 Bamberg "grudge informer" case -- the woman who denounced her husband to the Nazis back in '44 for bad-mouthing Hitler, then got convicted after the war for unlawfully depriving him of his liberty because the court held that the Nazi statute she'd relied on was never really valid law, being "contrary to the sound conscience and sense of justice of all decent human beings." Have the positivist push Hart's actual objection to this -- that the court dodged the real dilemma, and the honest move would've been to admit she broke no law at the time and then punish her with a frankly retroactive statute -- and have the natural lawyer defend the court's reasoning along Fuller's lines. They should actually engage with each others strongest moves instead of talking past one another: I wanna see the positivist's best answer to "so retroactive punishment is fine as long as your upfront about it?", and the natural lawyer's best comeback to the worry that letting judges void statutes for being insufficiently moral just wrecks legal certainty.
