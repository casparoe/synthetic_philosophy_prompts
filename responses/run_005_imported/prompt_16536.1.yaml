  ok so ive been down a medieval islamic philosophy rabbit hole lately and I keep thinking about how much al-Ghazali's occasionalism sounds like proto-Hume, except it's motivated by basically the opposite concern (protecting God's omnipotence rather than empiricist skepticism). can you write me a dialogue between al-Ghazali and Averroes hashing out the cotton-and-fire example from the Tahafut debate?

  I want Ghazali to actually defend the strong version of the view: that fire has no intrinsic power to burn, the connection we observe is just God's `āda (habitual custom), and its logically possible for cotton to touch fire without burning. And I want Averroes to press what I think is his best move: that if you deny necessary connections between a thing's nature and its effects, you lose the ability to have real knowledge of the natural world at all, since "fire" stops picking out anything with stable powers. Have them go a few rounds on this -- I don't want Averroes to just assert that science requires necessity and declare victory, and I don't want Ghazali to just retreat to "well, God can do anything" without engaging the knowledge objection. Bonus points if Ghazali's response ends up leaning on the same "regularity is enough for practical purposes even without logical necessity" move that Hume makes centuries later, since that's honestly the thread I care about most.

  Doesn't need to resolve neatly, but I want it to feel like neither guy is just mouthing a strawman version of the other's position.
