answer: |-
  Okay, this is a fantastic challenge. Capturing the precise absurdity of the regress *and* contrasting Bradley's vs. Frege's escapes *in joke form* is tricky, but here's an attempt aiming for that specific niche:

  **The Joke:**

  > **Bradley, Frege, and a very confused Gluemaker walk into a philosophy seminar. The Professor points to two bricks on his desk and says: "Explain how these are connected."**
  >
  > *   **The Gluemaker:** "Easy! I use this special glue!" *(He applies glue between the bricks and holds them together.)*
  > *   **Bradley:** *(Shakes head sadly)* "Ah, but now you have the brick, the glue, and the other brick. What connects the *glue* to the *first brick*? You'll need more glue! *(Points)* Glue here! And what connects *that* glue to the first brick? More glue! And what connects... *[Bradley trails off, staring into the distance, murmuring about the Absolute]*
  > *   **Frege:** *(Rolls his eyes, grabs the first brick)* "Nonsense! Look: this brick isn't *complete* yet." *(He slaps the blob of glue onto the brick's side. It doesn't just sit there; it seems to actively *grip* the surface.)* "See? The glue is fundamentally *sticky-sided*. It *demands* something to stick *to*. It latches onto the brick *directly* – no *extra* glue needed for *that* connection!" *(He then slams the sticky side of the glue-brick assembly onto the second brick with a satisfying* ***CLICK*** *)* "And *that* demand is satisfied. One proposition. Done."
  >
  > **The Gluemaker:** *(Staring at the pile of unused glue Bradley demanded, then at Frege's simple assembly)* "So... you're telling me I either need infinite glue... or glue that's just... *lonely*?"

  **Why it (hopefully) works for your audience:**

  1.  **The Regress Mechanic:** The Gluemaker's initial solution perfectly mirrors the naive attempt to add a relation ("glue") to connect two things (bricks). Bradley *correctly* identifies the immediate regress: the glue itself now needs to be related to *each* brick, requiring more glue (relations), ad infinitum. His trailing off captures the descent into infinite regress and hints at his monist conclusion ("the Absolute").
  2.  **Bradley's Escape:** Bradley's reaction isn't *just* pointing out the regress; his sadness and distant stare subtly imply his view that the *entire project* of explaining connection with distinct relations is flawed, pointing towards his belief in the unreality of relations and the ultimate unity of the Absolute.
  3.  **Frege's Escape:** Frege's "unsaturated" solution is directly modeled. The glue isn't just a *thing*; it has an inherent incompleteness ("isn't *complete* yet"), a need ("demands something to stick *to*"), a specific nature ("fundamentally *sticky-sided*"). This allows it to bind *directly* to the first brick without needing a *further* connector. The **CLICK** signifies the completion/saturation when it binds to the second brick, achieving unity without regress. His eye-roll dismisses Bradley's approach as unnecessary complication.
  4.  **The Punchline:** The Gluemaker summarizes the absurd dichotomy the regress forces: either an impossible infinite pile of glue (relations) or accepting that the connector (concept/relation) has a weird, intrinsic "loneliness" (unsaturatedness) that allows direct binding. "Lonely" is the layman's term for "unsaturated" in this context, highlighting its strange-but-necessary nature to avoid the regress.
  5.  **Accuracy Check:** Someone familiar with the problem should recognize:
      *   The initial unity problem (two separate bricks).
      *   The regress triggered by adding a relation (glue).
      *   Bradley's despair leading to monism.
      *   Frege's unsaturatedness as the key to direct saturation/completion.
      *   The core absurdity of needing relations for relations.

  It avoids generic philosophy jokes by being structurally *about* the regress and the two classic responses. The humor comes from the physicalization of the abstract problem (glue, bricks) and the Gluemaker's overwhelmed practicality confronting the philosophers' necessary weirdness. Good luck with your friends!
