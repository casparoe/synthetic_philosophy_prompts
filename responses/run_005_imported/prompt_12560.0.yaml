answer: |-
  Your uncle is referencing a real and important part of Aquinas's thought, but **his characterization is a significant oversimplification and arguably an overstatement.** Aquinas provides a *conditional justification* for removing a tyrant, but framing it as settled Catholic teaching that killing a tyrant is *the virtuous thing to do* misses crucial nuance and context.

  Here's a breakdown of Aquinas's actual position (primarily from **Summa Theologica, II-II, Question 42, Article 2** - "Whether sedition is always a mortal sin?") and why it's more complex than your uncle suggests:

  1.  **The Core Argument (Against Sedition):** Aquinas begins by condemning sedition (rebellion against a just ruler) as a mortal sin because it destroys the unity and peace necessary for the common good.

  2.  **The Tyranny Exception:**
      *   **Not Sedition:** Aquinas then makes his key distinction: "A tyrannical government is not just... Consequently, there is no sedition in disturbing a government of this kind." Resisting a *genuine* tyrant is not sinful sedition *in principle*.
      *   **Justification for Removal:** He argues that if a ruler "usurps power" (is an illegitimate tyrant from the start) or "commands what is unlawful" (a legitimate ruler who becomes tyrannical), "his subjects are not obliged to obey him; except, perhaps, in certain cases, when it is a matter of avoiding scandal or danger." More importantly, he states: **"There may be, indeed, reason for removing him from government, if it can be done without great tumult and disturbance."**
      *   **The "If" Clause is Crucial:** Notice the condition: *"if it can be done without great tumult and disturbance."* This is not a blanket endorsement of assassination.

  3.  **What Aquinas Does NOT Say:**
      *   **He does NOT explicitly endorse *assassination* or *private killing*.** His language focuses on "removing him from government." While this *could* theoretically include killing, Aquinas's emphasis is on *deposition* as the primary goal. His preferred methods lean towards public, authoritative action.
      *   **He does NOT say it's "the virtuous thing to do."** He says it's *not sinful sedition* under specific conditions and *may be justified* if done prudently. Justification is not the same as virtue. Prudence, justice, and consideration of consequences are paramount virtues here.
      *   **He does NOT make it easy or the first resort.** Aquinas places a very high value on order, authority, and the avoidance of scandal and greater evils (like civil war or anarchy, which could be worse than the tyranny). The "great tumult and disturbance" clause is a massive hurdle.

  4.  **Crucial Nuances & Conditions (Implied or from broader context):**
      *   **Severity of Tyranny:** The tyranny must be genuine, severe, and persistent, actively destroying the common good and violating fundamental justice/divine law.
      *   **Last Resort:** All other legitimate means of redress (persuasion, appeals to higher authorities if they exist, non-violent resistance) must be exhausted. Private individuals cannot act hastily.
      *   **Probability of Success & Better Outcome:** The attempt must have a reasonable chance of success *and* result in a clearly better situation for the common good. It cannot simply plunge society into worse chaos or install an equally bad or worse ruler.
      *   **Authority:** Ideally, removal should be undertaken by or with the sanction of some legitimate public authority (e.g., nobles, representatives of the people, a higher prince). Aquinas was deeply skeptical of private individuals taking this upon themselves without such sanction, as it easily descends into vigilantism and anarchy. The Valkyrie plotters, being high-ranking officers and officials, arguably tried to position themselves *as* a legitimate public authority acting for Germany.
      *   **Proportionality:** The means used must be proportional. Deposition is preferred; killing is a last resort inherent in forceful removal, not the primary aim.
      *   **Intent:** The *sole* intent must be the restoration of justice and the common good, not personal vengeance, ambition, or factional gain.

  5.  **Why it's NOT "Settled" as "Killing is Virtuous":**
      *   **Focus on Deposition:** Aquinas's primary emphasis is on the *legitimacy of resistance and removal*, not the method of killing.
      *   **Burden of Proof:** The burden lies *heavily* on those advocating removal to prove *all* the stringent conditions are met. It's an exception carved out of a strong presumption *against* rebellion/violence against rulers.
      *   **Prudence is Key:** Aquinas was a theologian of prudence. Deciding whether *this specific act* against *this specific tyrant* meets *all* the conditions is an act of practical judgment fraught with risk and uncertainty. Agonizing over it is arguably *the mark of a prudent person*, not ignorance.
      *   **Subsequent Church Teaching:** While Aquinas is foundational, later Church teaching (especially post-Vatican II and the modern Catechism) places even greater emphasis on non-violent solutions, the risks of revolution, and the sanctity of life. The Catechism (CCC 2243) reiterates the *right to resistance* under conditions of *prolonged tyranny* threatening fundamental rights and the common good, *after exhausting other means*, but frames it cautiously as a *right*, not necessarily a *virtuous duty*, and avoids explicitly endorsing assassination. It stresses the need for "moral certitude" about success and a better outcome.

  **How to Respond Next Time:**

  1.  **Acknowledge the Core:** "You're right that Aquinas provides a crucial justification for resisting tyranny. He absolutely says it's not sedition to oppose a genuine tyrant and that removal can be legitimate."
  2.  **Highlight the Nuance & Conditions:** "However, Aquinas frames this as a highly conditional *exception*, not a straightforward duty. He emphasizes that removal must be done *'without great tumult and disturbance'* – which is a huge hurdle. He focuses on *deposition*, not necessarily assassination."
  3.  **Emphasize Prudence & Burden of Proof:** "The key virtue here is *prudence*. Aquinas would insist that anyone contemplating such an act must be morally certain the tyranny is severe enough, all other options are exhausted, the act has a high chance of success *and* leading to a better outcome, and ideally involves legitimate authority. Deciding all that is incredibly difficult and risky. Agonizing over it isn't ignorance of Aquinas; it's actually *applying* Aquinas's demand for rigorous prudence and weighing the grave risks of causing greater evils like civil war."
  4.  **Connect to Valkyrie (Optional but effective):** "Think about the Valkyrie plotters themselves. They were agonizingly aware of these complexities – the oath to Hitler, the risk of plunging Germany into chaos, the uncertainty of success, the moral weight of assassination. Their internal struggles *reflect* the very prudence Aquinas demands, not ignorance of him. And significantly, the Catholic Church hierarchy in Germany, aware of Aquinas, did *not* publicly endorse assassination plots, precisely because of these prudential fears and the conditions not being clearly met in a way they could sanction." (Note: Individual Catholics, like von Stauffenberg, wrestled with their conscience based on such principles).
  5.  **Distinguish Justification from Virtue:** "So while Aquinas provides a *possible justification* for removing a tyrant under extreme conditions, he doesn't simplistically say killing them is *the virtuous thing to do*. He says it *might not be sinful sedition* if done correctly, but the 'if done correctly' part is where all the agonizing prudence comes in."

  By focusing on Aquinas's own conditional language ("if it can be done without great tumult"), the paramount importance of prudence, the preference for deposition over killing, and the immense burden of proof, you can show a deeper understanding of the Angelic Doctor than your uncle's oversimplified "case closed" interpretation. Aquinas provides a framework for moral reasoning in extremis, not a simple license to kill tyrants.
