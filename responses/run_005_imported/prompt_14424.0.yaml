prompt: |-
  At the reception after a family friend's funeral last month, two of my cousins fell into a long argument about whether his death was actually bad for him, and not just hard on the people who loved him. I stayed out of it at the time, but I keep turning the exchange over in my head and would like a more careful opinion on it than I can give myself.

  (1) Renee opened by saying that once someone is dead, there is no 'him' left for anything to be bad for, so strictly speaking his death could not have harmed him — only us, the people missing him.

  (2) Marcus said that was a dodge: it is obviously bad for him that he will never see his granddaughter graduate or finish restoring the boat he had spent a decade on, so he has been cheated out of years he would otherwise have had.

  (3) Renee answered that 'cheated out of' assumes the very thing in question, since you cannot point to any moment when this loss actually lands on him. He was not harmed while he was alive and healthy, and there is no 'him' afterward for the harm to attach to, so the badness cannot be pinned to any point in time.

  (4) Marcus replied that plenty of misfortunes work that way: if your friends were quietly badmouthing you and you never found out, you would still have been wronged even though there was no instant at which you felt it — death, he said, is just a more extreme version of the same thing.

  (5) Renee then brought up something she had read once: none of us mourn the centuries before we were born, even though we did not exist then either, so if nonexistence after death is bad, nonexistence before birth should be exactly as bad — and plainly nobody thinks that.

  (6) Marcus said the two cases are not parallel, because dying cuts off a future that was already his to keep living, whereas the time before he was born was never a stretch of his life to begin with — there was nothing there to take from him.

  (7) Renee was not satisfied. She said 'a future that would have been his' is just as made up as 'a past that would have been his,' so Marcus had only put a label on the asymmetry rather than actually explaining it. Neither of them budged, and the conversation broke off there.

  Please go through this move by move rather than picking an overall winner. First give a verdict on each of the seven numbered points as a JSON object of the form {"1": <score>, ..., "7": <score>}, with each score from -2 (clearly mistaken) to 2 (clearly right), then justify every score in a sentence or two. After that, tell me what you think both of them are missing, and close with your own answer to the question they were actually arguing about.
