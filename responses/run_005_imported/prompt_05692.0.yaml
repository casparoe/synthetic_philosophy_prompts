  First, I need to verify if the user applied CC and CW correctly. For CC, they universalized the maxim: everyone exaggerates qualifications when they think they can get away with it. The user argues this doesn't lead to a logical contradiction because employers would just discount resumes, unlike false promises which collapse the institution of promising. That seems right—promising relies on trust, while resume padding just introduces noise. So CC passes. 

  Then for CW, the user points out that universalizing defeats the purpose of gaining an edge. If everyone does it, the advantage disappears. That's a classic CW failure because it undermines the agent's own goal. Kant's beneficence example works similarly—you can't will universal non-helpfulness because you might need help. So the user's application here is solid.

  Next, Marcus's critique: he thinks CC isn't doing real work because any maxim can be tweaked to "survive in a degraded form." The user mentions Korsgaard's argument, which indeed claims that even false promising fails practically, not logically. Korsgaard argues that the maxim's purpose (getting money) is thwarted when universalized because no one would believe promises anymore. So Marcus is referencing a real scholarly debate here. 

  Now, assessing who's closer to being right. The user is correct that there's a structural difference between CC and CW. CC asks if the maxim can exist without contradiction, while CW asks if you can rationally will it given your goals. The resume case clearly fails CW but not CC, supporting the user's point. However, Marcus has a point about Kant's examples—many, like false promising, might be better explained by CW. But that doesn't erase the distinction; it just shows Kant's examples might be misclassified. 

  The deeper issue here is whether the CC/CW distinction holds up. The user is right that the distinction exists in Kant's framework, but Marcus is tapping into valid criticisms about its applicability. The resume case actually helps illustrate the difference: unlike promising, resume padding doesn't rely on a constitutive norm, so it passes CC but fails CW. This shows the distinction is meaningful, even if Kant's own examples are debatable. 

  In conclusion, the user applied the tests correctly, their resume case is a valid CW failure, and while Marcus's criticism is rooted in real scholarship, the CC/CW distinction still does philosophical work by highlighting different ways maxims can fail universalization.
answer: |-
  This is a brilliantly articulated Kantian puzzle, and you've hit on one of the most contentious debates in Kant scholarship. Let's break it down point-by-point:

  **1. Are you running CC vs. CW correctly?**
  *   **Contradiction in Conception (CC):** You nailed the core question: *Can the maxim be conceived as a universal law without logical contradiction?* Your reasoning that universal resume padding wouldn't *logically destroy* the institution of resumes/job applications is sound. Employers would adapt (discounting, verification) – the practice would become dysfunctional but not *inconceivable*. Promising relies on a constitutive norm of trust; resume statements aren't *constitutively* dependent on absolute truthfulness in the same way. A degraded system is still conceivable. **✓ Correct application.**
  *   **Contradiction in Will (CW):** You also correctly identify the core question: *Could you rationally will this maxim as a universal law without your own will contradicting itself?* Your argument that universalizing defeats the *purpose* (gaining relative advantage) is spot-on. It mirrors Kant's non-beneficence case: willing a world where no one helps others contradicts the rational agent's will, as they might need help themselves. Here, willing universal padding destroys the asymmetry you rely on. **✓ Correct application.**

  **2. Does the resume case land where you think it does?**
  *   **Absolutely.** Your analysis is persuasive:
      *   **CC Passes:** No *strict logical* contradiction in conception. The practice survives in a degraded, cynical form.
      *   **CW Fails:** You *cannot rationally will* the universalized version because it directly undermines the very goal (gaining an unfair advantage) that motivated adopting the maxim in the first place. This makes it irrational for you to will it universally.
  *   **Imperfect Duty Analogy:** Framing it as a violation of an imperfect duty (like beneficence) is insightful. CW failures often point to duties to promote certain ends (like honesty in communication, or the conditions for fair competition) without prescribing a single, specific action. The maxim is *impermissible* because it undermines a necessary condition for rational agency (trust in communication for achieving ends, fair competition for merit-based systems), even if it doesn't destroy the *concept* of resumes. **Your landing is accurate.**

  **3. Is "the promising case is secretly a CW argument" a real criticism?**
  *   **Yes, emphatically.** This is **Christine Korsgaard's central argument** in her famous paper "Kant's Formula of Universal Law" (1985), and it's hugely influential. You're remembering correctly.
      *   **Korsgaard's Critique:** She argues Kant's standard "logical contradiction" reading of the false promising case is weak. If everyone lied when convenient, promising wouldn't logically vanish; it would just become unreliable, like your resume example. *The real contradiction is practical.*
      *   **The "Practical Contradiction" Interpretation:** The maxim "I will make a lying promise to get money when in need" *fails* because if universalized, *no one would believe promises*. Therefore, *your specific act* of making a lying promise *wouldn't work*. Your own maxim, when universalized, makes your intended action (successfully deceiving to get money) *impossible*. The contradiction is between your *purpose* (get money via deception) and the *consequence* of universalization (deception fails). This makes it structurally identical to a CW failure – willing the universal law defeats your own purpose.
      *   **Scholarly Impact:** Korsgaard's reading (and similar ones by Onora O'Neill/Barbara Herman) shifted the consensus. Many scholars now see *most* CC failures, especially the paradigmatic ones like false promising and suicide, as ultimately resting on a *practical* contradiction (defeating the agent's purpose) rather than a pure logical one. Marcus is channeling this dominant modern interpretation.

  **4. Who's closer to being right about the CC/CW distinction?**
  *   **You both have strong points, but Marcus has the stronger *scholarly* argument, while you highlight a crucial *structural* distinction Kant intended:**
      *   **Marcus's Strength:** He's correct that Korsgaard's critique is devastating to the traditional "logical contradiction" reading of CC. If *every* maxim can be conceived to "limp on" in some degraded form (lying promises become unreliable, theft leads to hyper-security, suicide... still happens?), then CC as *purely logical* contradiction does very little work. Many of Kant's own examples *do* seem better explained by the "practical contradiction" (defeating purpose) model Korsgaard proposes, collapsing them into CW territory. His point that your resume logic *could* be applied to false promising (it survives degraded) is valid *if* you insist on a strict logical contradiction for CC.
      *   **Your Strength:** You are absolutely right that Kant *intended* a clear distinction:
          *   **CC:** Focuses on the *conceivability* of the *practice/institution* under universalization. Does universalizing make the *very concept* incoherent? (Kant thought "yes" for promises).
          *   **CW:** Focuses on the *rationality* of the *individual agent's will*. Could *you*, as a rational being needing certain things, consistently *will* that universal law? It targets the agent's *ends*.
      *   **The Core Issue:** Kant's *examples* might not perfectly fit his *stated distinction*. The resume case is excellent because it cleanly separates them:
          *   **Resumes:** Survives CC (degraded but conceivable system), fails CW (defeats agent's purpose). **The distinction holds here.**
          *   **False Promising:** Under modern (Korsgaardian) reading, arguably fails *only* CW (or "Practical Contradiction") – universalizing defeats the deceiver's purpose. The "logical" collapse of promising itself is harder to defend.
      *   **Who's Closer?** Philosophically, **Marcus is closer on the *current state* of Kant scholarship** regarding the original examples – Korsgaard's "practical contradiction" reading is widely accepted as showing Kant's *own* CC cases often rely on defeating purpose. However, **you are closer to capturing the *structural logic* Kant *aspired to* and demonstrating it with a novel case.** Your resume example *does* show the distinction *can* work cleanly for some maxims, even if it's messy for Kant's favorites.

  **Conclusion & Sanity Check:**
  1.  **You ran CC and CW correctly.**
  2.  **Your analysis of the resume maxim is spot-on:** It passes CC but fails CW, making it impermissible due to undermining a necessary condition for rational agency (fair information in pursuit of ends), akin to violating an imperfect duty.
  3.  **Marcus's point about false promising being "secretly CW" is a real, major criticism** championed by Christine Korsgaard and central to modern Kant scholarship. You recalled it accurately.
  4.  **On the distinction:** **Marcus wins on scholarship** (Kant's examples are vulnerable to Korsgaard's collapse), **but you win on logic and your novel case** (the resume example clearly demonstrates the *intended* structural difference Kant wanted, even if his own examples wobble). Your core insight – that *some* maxims clearly fail only CW while passing CC, showing the distinction *can* do work – is valid. The distinction isn't *fake*, but its application to Kant's *own* examples is less clean than he claimed.

  **Your sanity is intact.** Your argument is well-reasoned, Kantian, and engages deeply with a real interpretive debate. Marcus is also engaging with a powerful scholarly critique. You've both identified genuine tensions within Kant's framework. The resume case is a fantastic illustration of how the CW test captures the *instrumental irrationality* of maxims that rely on exploiting asymmetries that vanish under universalization. Sleep well!
