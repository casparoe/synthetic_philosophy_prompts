  Also, the colleague's stance might be too rigid. Foreseeability doesn't equal intent. The user's intent is to expose truth and reform systems, not harm the daughter. But the colleague isn't wrong about responsibility; foreseeing harm does impose a duty to minimize it. So maybe the answer lies in taking all possible steps to mitigate harm while proceeding.

