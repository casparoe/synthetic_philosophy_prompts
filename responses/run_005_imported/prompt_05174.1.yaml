  I should also highlight how the explanatory targets differ. Alicke focuses on blame amplification in responsibility attribution, while Knobe's effect reveals something fundamental about how we conceptualize intentional action itself. The fact that the asymmetry persists even when no blame is possible (like with neutral verbs) suggests distinct psychological mechanisms.

