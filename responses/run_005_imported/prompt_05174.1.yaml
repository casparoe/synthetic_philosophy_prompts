  First, I need to verify the accuracy of how both studies are represented. Knobe's original experiment does show a striking asymmetry in intentionality judgments based on moral valence, while Alicke demonstrated how blameworthiness distorts factual judgments like foreseeability. The user correctly notes later extensions of the Knobe effect to non-moral norms (e.g., statistical regularities) and non-blame-related verbs like "deciding." This is crucial - it suggests the mechanism isn't exclusively tied to blame.

