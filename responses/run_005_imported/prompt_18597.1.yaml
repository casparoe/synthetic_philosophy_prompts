answer: |-
  You've nailed a fascinating tension in Sidgwick, but your "compartmentalization/coping mechanism" theory, while containing truth, **significantly flattens the deeper connection to his core philosophy.** Sidgwick himself saw psychical research as a **direct, methodologically consistent extension of his ethical project**, not a separate hobby. Here's why your framing needs refinement:

  1.  **The "Dagger Point" of Utilitarianism:** Sidgwick's utilitarianism faced a profound internal crisis, which he famously called "the profoundest problem in ethics." He concluded that for utilitarianism to be rationally compelling and provide a *complete* guide to life, it needed to demonstrate that virtue was ultimately aligned with individual happiness. However, based on empirical observation of *this* life, he saw no guarantee:
      *   The virtuous often suffer.
      *   The wicked sometimes prosper.
      *   Sacrificing one's own happiness for the greater good might lead to a net loss of happiness *for the individual*.
      **The Solution? An Afterlife.** If consciousness survives death, then the utilitarian calculus changes dramatically. Justice could be served, sacrifices rewarded, and the harmony of duty and self-interest could be restored *across an infinite timescale*. Without proof of survival, Sidgwick felt utilitarianism rested on an ultimately irrational act of faith in cosmic justice – something deeply unsatisfying to his rigorously empirical mind.

  2.  **Psychical Research as Applied Empiricism:** Sidgwick didn't approach ghosts and mediums with credulity, but with the **same relentless demand for evidence and critical scrutiny** he applied to ethics.
      *   **The SPR's Mandate:** He co-founded the SPR precisely to subject paranormal claims to rigorous scientific investigation – to sift fraud from potentially genuine phenomena using methods like controlled experiments, cross-verification of testimony, and exposure of trickery.
      *   **Seeking *Evidence*, Not Comfort:** While the *hope* for an afterlife motivated him, the *method* was pure Sidgwickian empiricism. He wasn't seeking comforting beliefs; he was demanding verifiable proof. As he wrote: "I shall be well content if we can contribute a stone, however small, to the slowly rising temple of Knowledge... We are prepared to accept any conclusion, provided it be based on sound scientific grounds." This is the voice of the philosopher, not the grieving seeker.
      *   **Addressing the Empirical Gap:** His ethical theory highlighted a gap in empirical knowledge (the ultimate connection of virtue and happiness). Psychical research was his chosen method for *investigating* that gap empirically. If survival could be proven, it would provide the missing empirical foundation for utilitarian ethics.

  3.  **Loss of Faith as Catalyst, Not Sole Cause:** You're right that his loss of Christian faith (specifically Anglican orthodoxy) was the initial spark. He desperately wanted a rational basis for morality and meaning that didn't rely on dogma. But his response wasn't just *emotional* coping; it was **intellectual problem-solving**:
      *   **From Theology to Science:** He didn't turn to vague spirituality. He turned to the possibility of *scientifically verifying* the core element (survival) that could resolve the tension in his ethical system and replace the lost theological foundation.
      *   **The Meaning of "Meaning":** For Sidgwick, the universe feeling "meaningful" wasn't just a warm fuzzy feeling; it was about the *rational coherence* of the moral project. Proof of survival would provide that coherence.

  **Why "Compartmentalization" is Misleading:**

  *   **He Didn't Keep Them Separate:** Sidgwick explicitly linked his psychical research to his ethical concerns in his writings and correspondence. He saw it as part of his life's work.
  *   **It Wasn't "Irrational":** While the *subject matter* seems irrational *to us* (given our current scientific consensus), Sidgwick's *approach* was hyper-rational. He applied reason to an area dominated by superstition and fraud, hoping reason could find truth there. It was a high-risk, high-reward intellectual gamble.
  *   **It Wasn't a "Hobby" or "Blind Spot":** It was a sustained, decades-long, organized research program demanding immense intellectual energy, co-founded and led by him. It stemmed from a core philosophical problem, not a peripheral curiosity.

  **A Stronger Framing for Your Piece:**

  1.  **"The Philosopher's Gambit":** Sidgwick identified a fatal flaw in his own brilliant ethical system – the lack of empirical proof for the cosmic justice utilitarianism seemed to require. His investigation of the paranormal was a desperate, decades-long wager: could science find evidence for the one thing (survival) that would make his ethical system rationally complete?
  2.  **"Bridging the Gap with Ghosts":** Sidgwick's psychical research wasn't separate from his philosophy; it was his attempt to build an empirical bridge across the chasm his philosophy had revealed – the gap between earthly consequences and ultimate cosmic justice. He hunted ghosts not for thrills, but to underpin the "greatest happiness principle" with evidence of an infinite future.
  3.  **"The Utilitarian's Afterlife Project":** Framing it as his lifelong project to empirically validate the foundational assumption his ethics needed to be fully coherent. The loss of faith initiated the search, but the *structure* of utilitarianism defined *what* he needed to find and *why* it mattered so much.

  **In Conclusion:**

  While the loss of faith provided the emotional impetus, **the driving force for Sidgwick's psychical research was deeply embedded within the logical structure of his utilitarianism.** It was a direct, albeit unconventional and ultimately unsuccessful, attempt to solve the "profoundest problem" he identified in *The Methods of Ethics*. To call it compartmentalization, a hobby, or an irrational blind spot misses the profound philosophical coherence of his mission. He wasn't abandoning reason; he was pushing reason into uncharted territory in service of his ethical vision. Your piece will be much stronger if you frame it as **the philosopher rigorously pursuing the missing empirical foundation for his philosophy, even if it led him into séance rooms.** Your editor should love the deeper, more integrated story.
