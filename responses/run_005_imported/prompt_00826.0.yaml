  ok so I've been sitting in on a metaphysics reading group (long story) and the session on grounding/fundamentality has been stuck in my head since. The question: does a chain of "X is grounded in Y, Y is grounded in Z..." have to bottom out somewhere fundamental, or could it just descend forever with no floor? Its basically our EFT tower thing (shorter and shorter turtles, no final theory), except these people argue about whether that's even coherent, not just whether it's true of our world.

  Can you write me a dialogue between two grounding theorists hashing this out? One thinks an ungrounded infinite descent is incoherent - like a chain of IOUs that never gets cashed, so nothing ends up actually explained or made true. The other thinks thats foundationalist intuition dressed up as an argument, and points to mereological gunk (no smallest parts, which everyone agrees is at least conceivable) as a reason to think a bottomless grounding structure is a live option too.

  Make them really engage instead of just repeating themselves louder: the foundationalist needs a real response to the gunk analogy (maybe parthood regresses and explanatory regresses aren't the same kind of animal?), and the infinitist needs a real response to the "nothing gets explained" worry instead of just biting the bullet. Bonus if someone raises whether our EFT situation is actual evidence for groundless towers, or just evidence we haven't found the bottom yet - feels like those come apart but I can't quite say why. Neither side should be a pushover, real back-and-forth, ~500 words is fine.
