  Okay, I need to help draft a memo for a forecasting program at a policy-research nonprofit. The user has been involved with rationalist blogs like LessWrong and ACX for over a decade, which informs their perspective. The core issue is whether to switch from the Brier score to the logarithmic score for evaluating staff forecasts, and there's a disagreement within the working group.

  The first half of the group wants the log score because it's strictly proper and local. They're coming from an accuracy-first epistemology angle, citing Joyce and Pettigrew. The other half worries about the log score being unbounded—a single confident wrong prediction could tank someone's score, leading forecasters to hedge toward 50% on high-stakes questions. This undermines the whole purpose of the scoring system. The debate keeps sliding between theoretical justification and practical outcomes.

  The user needs a memo that picks a policy—stick with Brier, switch to log, or a third option—and addresses both sides' arguments thoroughly. The memo must be fair and show that each side's points were seriously considered. 

  First, I should understand the technical aspects. The Brier score is a quadratic scoring rule that averages the squared differences between forecasts and outcomes (1 for happened, 0 for didn't). It's strictly proper, meaning forecasters are incentivized to report their true beliefs. The log score uses the logarithm of the probability assigned to the actual outcome. It's also strictly proper and local, depending only on the probability assigned to what happened. But it's unbounded below—if you assign 0.01 to an event that happens, your score plummets, which can disproportionately affect the average.

  The theoretical argument for the log score is strong: locality and propriety are key in epistemic justifications. But the practical concern is real. In a workplace setting with performance reviews, forecasters might avoid extreme probabilities to protect their scores, especially on high-impact questions. This could lead to less informative forecasts, which is counterproductive.

  For the memo, I need to find a balanced solution. Sticking with Brier might ignore the theoretical benefits, while switching to log could encourage hedging. Third options could include: capping the log score to limit damage from extreme errors, using different rules for the leaderboard (fun) vs. performance reviews (serious), or switching to another proper scoring rule like the spherical score that's bounded.

  The user's background suggests they'd appreciate a nuanced approach that bridges theory and practice. They want the memo to validate both sides—acknowledging the epistemic rationale while addressing behavioral incentives. Also, since scores feed into performance reviews, the system must motivate truthful reporting without punishing risk-taking excessively.

  A hybrid approach might work best: use the log score but with a cap. For example, set a floor probability like 0.01 so scores can't go below a certain point. This preserves locality and propriety while mitigating the unbounded issue. Alternatively, use Brier for high-stakes questions and log for others, but that could complicate things.

  Another idea: keep the log score but adjust how it's aggregated—like using a trimmed mean to ignore worst scores. But that might reduce accountability. Or, have separate metrics: the leaderboard uses log for its theoretical purity, while performance reviews use a modified version for fairness.

  In the memo, I'll outline the trade-offs clearly. The log score is theoretically superior, but Brier is more robust to outliers. The cap offers a compromise. It's important to emphasize that the goal is to encourage accurate forecasting, and the scoring rule should support that without unintended consequences.

  Finally, the memo should recommend a specific policy. Given the concerns, implementing a capped log score seems sensible. It addresses the locality argument while preventing catastrophic drops in scores. This shows engagement with both sides: upholding the epistemic principle but adapting it for real-world incentives.
answer: |-
  ## Memo: Recommendation on Forecasting Scoring Rule Policy  

  **To:** Forecasting Program Working Group  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Resolution on Brier vs. Logarithmic Scoring Rule  

  ### Background  
  Our forecasting program’s success hinges on two goals:  
  1. **Epistemic Integrity**: Eliciting truthful probability estimates that reflect forecasters’ genuine beliefs.  
  2. **Practical Incentives**: Encouraging consistent participation, honest risk-taking, and minimizing perverse incentives (e.g., hedging).  

  The current debate centers on replacing the Brier score (quadratic scoring rule) with the logarithmic score. Both rules are *strictly proper* (theoretically incentivizing honest reporting), but they differ critically in behavior and robustness.  

  ---

  ### Core Arguments Engaged  

  #### 1. **The Case for Logarithmic Scoring (Accuracy-First Epistemology)**  
     - **Strength**: The log score is *local* and *strictly proper*. It exclusively evaluates the probability assigned to the actual outcome, aligning with Joyce/Pettigrew’s argument that propriety is non-negotiable for epistemic justification.  
     - **Theoretical Advantage**: It strongly penalizes overconfidence (e.g., assigning 0% to an event that occurs), which can improve calibration over time.  
     - **Acknowledgment**: This argument is compelling and grounded in decision-theoretic rigor. Rejecting it requires demonstrating that practical trade-offs undermine its intended purpose.  

  #### 2. **The Case Against Logarithmic Scoring (Practical & Behavioral Risks)**  
     - **Strength**: The log score is *unbounded below*. A single extreme error (e.g., forecasting 1% on an event that happens) can catastrophically lower a quarterly average, disproportionately punishing otherwise excellent forecasters.  
     - **Observed Behavior**: Anecdotal evidence suggests forecasters already hedge toward 50% on high-stakes questions to avoid ruinous scores. This violates the goal of truthfulness, effectively *breaking* the theoretical incentive.  
     - **Acknowledgment**: This risk is empirically validated in incentive-sensitive contexts (e.g., performance reviews). Ignoring it jeopardizes participation and honesty.  

  ---

  ### Recommendation: Adopt a **Modified Log Score with a Cap**  
  **Policy**: Switch to the logarithmic scoring rule, but implement a **probability floor of 0.025 (2.5%)** for scoring purposes. Forecasts below this floor are scored as if they were 0.025.  

  #### Reasoning:  
  1. **Preserves Theoretical Advantages**  
     - The log score remains strictly proper and local *within the bounded range*. Capping extreme low probabilities does not distort incentives for forecasts above the floor.  
     - Forecasters retain strong reasons to avoid underconfidence (e.g., assigning 10% to a 50%-likely event still hurts their score).  

  2. **Mitigates Practical Risks**  
     - The cap prevents a single error from dominating quarterly results (e.g., the worst possible score is log(0.025) ≈ −3.69, not −∞).  
     - Hedging incentives are dramatically reduced: forecasting 3% on a true 1%-likely event is still penalized, but not career-damaging.  

  3. **Balances Competing Values**  
     - **Against Pure Brier**: While Brier is robust (bounded), it is not local. It rewards distributing residual probability "correctly," which is irrelevant to the actual outcome and may distract forecasters.  
     - **Against Pure Log**: An uncapped log score’s unboundedness demonstrably encourages hedging, violating its own epistemic justification. A cap aligns theory with real-world incentives.  
     - **Why 2.5%?**: This is stringent enough to penalize overconfidence (e.g., "5% or lower" forecasts) but avoids absurd penalties. It can be adjusted based on data.  

  ---

  ### Implementation Plan  
  1. Apply the capped log score to **all forecasts** (leaderboard and performance reviews) starting next quarter.  
  2. **Track hedging behavior**: Monitor whether forecasters increase <50% probabilities on high-stakes questions post-change.  
  3. **Review after 6 months**: Assess if the cap meaningfully reduces hedging while preserving score differentiation.  

  ### Why Not Other Options?  
  - **Separate Rules (Leaderboard vs. Reviews)**: Fragments incentives and undermines program cohesion.  
  - **Spherical Score/Other Rules**: Less familiar, similar trade-offs to Brier (non-local), with no decisive advantage.  
  - **Keep Brier**: Perpetuates non-locality without solving the hedging risk under log.  

  ---

  ### Conclusion  
  The capped log score resolves the core tension: it upholds the *principle* of propriety and locality central to accuracy-first epistemology, while acknowledging that *unbounded penalties induce pathological behavior*. By rejecting false dichotomies ("theory vs. practice"), we adopt a solution that respects both rationalist foundations and organizational psychology.  

  **Vote Recommended**: **Adopt the modified log score (cap at 2.5%)**.  

  ---  
  **Appendices**:  
  - *Comparative Score Examples* (Brier vs. Log vs. Capped Log)  
  - *Formal Proof*: Capped log remains proper for forecasts >2.5% (available on request).
