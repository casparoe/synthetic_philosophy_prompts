   For (b): Kalai-Smorodinsky solution.

   The Kalai-Smorodinsky solution (KS) is the point on the Pareto frontier where the ratio of the players' utility gains from the disagreement point to their ideal utilities are equal.

   Formally, for a feasible set S and disagreement point d=(0,0), let a1 = max { u1 | (u1,0) in S }  ( though typically the ideal for player 1 is max { u1 | (u1,u2) in S for some u2 } )
   similarly, a2 = max { u2 | (0,u2) in S }.

   Then the KS solution is the Pareto efficient point (u1, u2) in S such that: 
          u1 / a1 = u2 / a2.

   In the example above where we added (0,1.5) to the set with u1+2u2<=2, in the new set S2, the ideal for player 1 is still 2 (achieved at (2,0)) and for player 2 is 1.5.
