          => u1/2 +0.5u1 =1
          => (0.5+0.5)u1=1 -> u1=1
          then u2= -0.75+1.5=0.75.
          So (1,0.75), which is the same as the Nash solution in this expansion.

   But in the example where the Nash solution might decrease, KS will ensure that player 2's utility does not decrease when player 2's ideal increases.

   Why? Because the KS solution has the property that if the set expands in a way that increases a2 (player 2's ideal) and does not decrease a1, then the new KS solution will have u2 at least as large as before.

   Explanation: 
     In the new set, the ideal point (a1, a2) becomes (a1, a2') with a2'>= a2.
     The KS solution in the new set is (u1', u2') such that u1'/a1 = u2'/a2' and (u1',u2') is on the new frontier.
     In the old set, the KS solution (u1, u2) has u1/a1 = u2/a2.

     Now, the new line from (0,0) to (a1, a2') has slope a2'/a1.
     The KS solution is the intersection of the Pareto frontier and the line u2 = (a2'/a1) * u1.

     In the old set, the line was u2 = (a2/a1) * u1.

     Since a2'>= a2, the new line is steeper (more favorable to player 2).

     The new KS solution might be different, but because the new line is above the old line for every u1>0, and the new set is above the old set (or not below) in the direction of player 2, then the new KS solution will have u2' >= u2.

   This is the essence of individual monotonicity.

   For (c): In the literature, there is no clear favorite. 
