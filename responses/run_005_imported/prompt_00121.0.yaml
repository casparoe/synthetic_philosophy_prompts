answer: |-
  That's a deeply insightful ethical dilemma, and you're absolutely right to feel uneasy about the disparity in blame. Your intuition points directly at one of the most significant debates in moral philosophy: **the problem of resultant moral luck.** Here's a breakdown of the relevant ethical frameworks and how they address your situation:

  1.  **Control-Based Theories (Deontology & Virtue Ethics): Blame Tracks the Will/Character**
      *   **Kantian Deontology:** Kant argues that the only thing "good without qualification" is a good will. Moral worth lies solely in the intention behind the action, guided by duty and the categorical imperative. The actual consequences are irrelevant to the *moral worth* of the action itself. In your case, both you and your housemate acted identically: you both formed the *intention* to leave the stove unattended briefly. Neither of you *intended* harm, nor were you aware of a specific, immediate danger (like the frayed cord at that exact moment). For Kant, both actions possess the *same* moral quality – they were equally imprudent or careless *in intention*. The fire was a result of bad luck (the cord's presence and condition), something outside your housemate's control at the moment of decision. Therefore, blame *should* be equal.
      *   **Virtue Ethics (Aristotle):** Focuses on character traits (virtues and vices). The blameworthy element here is the vice of *carelessness* or *imprudence*. Both you and your housemate exhibited the *same* level of carelessness by leaving the stove unattended. A virtuous person (prudent, responsible) would not form the habit of leaving potential hazards unattended. The fire reveals the *existence* of the carelessness, but the *degree* of the vice is the same in both of you. The outcome is a matter of *luck* – your housemate had the misfortune of the cord being present. Her *character flaw* is no worse than yours; she was just unlucky in the consequences revealing it dramatically. Blame should track the character flaw, not the luck.

  2.  **Outcome-Based Theories (Consequentialism): Blame Tracks the Harm**
      *   **Utilitarianism (Classical):** Judges actions based on their consequences. An action is wrong if it leads to bad consequences (reduces overall well-being). While the *act* of leaving the stove was identical, the *consequences* were vastly different. Your action caused no harm. Your housemate's action (identical in form) caused significant harm (property damage, potential danger, cost, stress). Therefore, her action had much worse consequences, making it morally worse *in this instance*. Blame serves a social function – deterring harmful actions and reinforcing responsibility for outcomes. Blaming her more strongly discourages the behavior that *actually* caused harm and acknowledges the greater negative impact.
      *   **Responsibility for Foreseeable Risks:** Consequentialists might argue that while the *specific* cord fire wasn't intended or directly controlled, leaving a heat source unattended creates a *foreseeable risk* of fire. By taking that risk repeatedly, you both accepted responsibility for *possible* bad outcomes. When the bad outcome occurs, the person who "rolled the dice and lost" bears greater responsibility for the *realized* harm, even if the dice roll was luck-based. The outcome makes the inherent risk concrete.

  **The Problem of Resultant Moral Luck (Nagel):**

  Thomas Nagel famously articulated this exact problem. **Resultant moral luck** occurs when the moral judgment of an agent depends on factors outside their control – namely, the *outcome* of their actions or choices. Your situation is a textbook case.

  *   **The Argument Against Moral Luck:** Morality, intuitively, should be about what we *control* – our choices, intentions, efforts. Luck (like the presence of a frayed cord) is arbitrary. It seems deeply unfair that two people who act identically, with identical states of mind, should be judged differently morally just because of a random occurrence. This violates the principle that "ought implies can" – we can only be blamed for what we could have controlled.
  *   **The Persistence of Outcome-Based Blame:** Despite the philosophical argument, we *constantly* judge based on outcomes in real life (legal liability, personal blame, feelings of guilt/remorse). The fire makes the negligence *concrete* and *salient* in a way your near-misses do not. It triggers stronger emotional responses (anger, fear) and a need to assign responsibility for the tangible harm.

  **Resolving Your Dilemma (Philosophically):**

  1.  **Control/Intention is Fundamental:** Philosophically, the strongest argument aligns with your intuition and Kant/Virtue Ethics. The core moral failing – the decision to leave the stove unattended, demonstrating carelessness – was identical in both cases. *What you controlled* was the same. The difference in outcome was pure luck. Therefore, you *are* equally blameworthy *for the choice you made*.
  2.  **Outcomes Matter Pragmatically (but not Morally Fundamentally):** While the *degree of blameworthiness for the initial choice* might be equal, outcomes matter for other reasons:
      *   **Responsibility for Harm:** Your housemate now has a specific responsibility stemming from the *actual* harm caused (e.g., helping pay for damages, apologizing directly to those affected). You don't have this *additional* responsibility because your luckier actions didn't cause harm. This is about rectifying the consequences, not about the initial blameworthiness being higher.
      *   **Revelation of Risk:** The fire *dramatically revealed* the danger inherent in the habit you *both* share. It should serve as a wake-up call to *both* of you. Her "bad luck" exposed the risk; your "good luck" masked it. The fire makes the negligence harder to ignore.
      *   **Deterrence & Social Function:** Society might blame the person who caused harm more strongly as a deterrent and to signal the seriousness of the *potential* consequences. However, this is a practical, social response, not necessarily a reflection of deeper *moral* blameworthiness.

  **Conclusion:**

  You have a solid philosophical basis (deontology, virtue ethics, the critique of moral luck) to argue that **the fundamental level of blameworthiness for the act of leaving the stove unattended should be the same for you and your housemate.** The difference in outcome was due to resultant moral luck – a factor entirely outside either of your control at the moment of action. Your actions and level of attentiveness (and thus the moral quality of your choices) were identical.

  However, the outcome understandably influences people's *reactions* and creates *additional responsibilities* for your housemate related to the specific harm caused. It also highlights the serious risk inherent in a habit you both need to break.

  **What you can do:**

  1.  **Acknowledge Your Shared Responsibility:** Talk to your friends. Explain that while your housemate had the terrible luck to cause a fire, *you* engage in the same risky behavior. Emphasize that the *habit* is the problem, not just the unlucky outcome.
  2.  **Change the Habit (Both of You!):** The fire is a harsh lesson for *both* of you. Commit together to never leaving the stove unattended, even for a moment. Remove hazards like frayed cords proactively.
  3.  **Support Your Housemate:** Recognize that while she has specific responsibilities due to the outcome, the *moral failing* that led to it is shared. Don't let her bear the *entire* burden of blame for a risk you both took.

  Your unease is philosophically well-founded. The situation highlights the tension between our deep intuition that blame should track control and the powerful, often understandable, human tendency to focus on the tangible consequences of actions.
