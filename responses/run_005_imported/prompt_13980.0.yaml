answer: |-
  You've hit on one of the most stubborn problems in causation theory – and your analytical chemist's instinct that omissions fundamentally break the "physical process" model is spot-on. Here's the strongest case that omissions are **not genuine causes** within a conserved quantity (CQ) framework, addressing your concerns head-on:

  ### Core Argument: Causation Requires a Physical Mechanism
  1.  **The Ontological Primacy of Processes:** Dowe/Salmon's core insight is that causation isn't just about correlation or counterfactual dependence; it's about *how* the world physically *produces* change. A cause must *do* something, *exert* an influence, via a concrete spatio-temporal process involving the transfer or transformation of conserved quantities (energy, momentum, charge, etc.). This captures the "oomph" or "production" intuition missing in purely difference-making accounts.
  2.  **The Void Where Omissions Reside:** An omission is an *absence* – no event, no process, no transfer. The lifeguard *not* turning their head involves no physical CQ transfer *from* the non-turning *to* the drowning swimmer. The mechanic's *failure* to check brakes transmits no energy/momentum *to* the failing brake system causing the crash. There is only the *background state persisting* (the lifeguard gazing elsewhere, the mechanic working on another task) while other *positive* causal processes unfold (the swimmer struggling, the brake fluid leaking, the car moving). The omission isn't an intervening link; it's the *lack* of an intervention.
  3.  **Causation vs. Responsibility:** The CQ theory cleanly separates *causal production* from *causal responsibility* or *blameworthiness*. Saying "the lifeguard's omission *caused* the drowning" conflates:
      *   **The physical cause:** The water entering the lungs, muscle fatigue, etc. (involving CQ transfers).
      *   **The counterfactual dependence:** *If* the lifeguard *had* acted (a positive process involving energy/momentum transfer - running, diving, pulling), the drowning *would not* have occurred.
      *   **The normative judgment:** The lifeguard *should have* initiated that positive process. They are *responsible* for the outcome *because* their required positive action was absent when it was needed to *prevent* the physical causal process (drowning) from running its course.
  4.  **Preserving the Causal Nexus:** Including omissions as causes dissolves the causal relation into pure counterfactual dependence plus normativity. If omissions cause, then *every* absence that is counterfactually necessary for an outcome becomes a cause. This destroys the concept of a localized, traceable causal chain. The CQ theory provides a clear, objective criterion for identifying *actual* causal links in the world's fabric.

  ### Tackling "The Many Omissions" Problem (The Fern Example)
  This is the strongest objection, and the CQ theorist *must* bite a bullet here, but it's a principled bite:

  1.  **The Fundamental Point: None are Literal Causes:** Strictly speaking, under CQ theory, *none* of the omissions are the *physical cause* of the fern's death. The physical cause is the dehydration process within the fern cells (loss of water potential, membrane breakdown – involving CQ transfers like molecular kinetic energy, chemical bond energies).
  2.  **Why We *Pick* Your Omission (Not the King's or the Sky's):** This selection is driven **entirely** by normative and contextual factors *external* to the causal relation itself:
      *   **Expectation and Duty:** You had a specific agreement or understanding (explicit or implicit) to perform a positive action (watering). The King of England had no such duty or expectation regarding your fern. The sky's "duty" is non-existent or purely metaphorical.
      *   **Relevance and Specificity:** Your action was the *specific, designated intervention* intended to *prevent* the dehydration process. The King's action or specific rain were not part of the relevant plan or context for sustaining *this* fern.
      *   **Control and Capacity:** You had the physical capacity and opportunity to perform the watering action (a positive process). The King, practically speaking, did not. The sky's behavior is beyond direct human control.
      *   **Counterfactual Salience:** In the context of *your arrangement*, your action is the *most salient* difference-maker. We hold fixed the general state of the world (no fern-specific rain, the King not knowing/caring) and focus on the *one thing that was supposed to change that background state* to prevent the outcome – your watering.
  3.  **The CQ Theorist's Response:** "Yes, *all* these omissions lack a CQ process linking them to the fern's death. Therefore, *none* are literal causes. However, we *rightly* single out *your* omission as *the* relevant difference-maker *for purposes of explanation, responsibility, and blame* because of the specific normative context (your promise/duty). The King's omission or the lack of fern-rain are background conditions, not salient failures within the relevant normative framework. Calling your omission 'the cause' is shorthand for 'the failure of the designated preventative action'."

  ### Addressing Dowe's "Quasi-Causation" Patch: Principled or Ad Hoc?
  Your skepticism is understandable, but there's a case for it being principled:

  1.  **The Problem it Solves:** Pure CQ theory struggles to explain why preventions (stopping a process) and omissions (failing to start a process) feel causally relevant *in a way distinct from random absences*. We need *some* account of their role.
  2.  **The Core Idea:** Dowe defines "quasi-causation" as a relation holding when:
      *   There is a *physical causal process* that would have led to outcome O.
      *   There is a *physical interaction* (involving CQ transfer) *that prevents that process* or *a failure of a physical interaction* that *would have* prevented it.
      *   The *absence* of the prevention (or the failure to initiate it) allows the original causal process to proceed to O.
  3.  **Why it's (Arguably) Principled:**
      *   **Anchored in Actual Processes:** Quasi-causation isn't free-floating. It's *defined in relation to* actual or potential physical CQ processes/interactions. It explicitly references what *would have* happened involving real CQ transfers (the preventative action) and the *actual* CQ process that *wasn't* stopped. The lifeguard diving *would have* involved CQ transfers preventing drowning; the drowning *did* involve CQ transfers. The omission is the *failure* of the first, allowing the second.
      *   **Captures a Real Distinction:** It distinguishes omissions/preventions that are *causally relevant* (because tied to specific potential/actual processes) from the infinite irrelevant absences (like the King not watering). The King's action wasn't a potential preventative process *within the relevant scenario*.
      *   **Separates Levels:** It maintains a clear ontological distinction: "Causation" (proper) = actual CQ process. "Quasi-causation" = a counterfactual relation *defined by* and *parasitic upon* actual or possible CQ processes, accounting for why *these specific* omissions/preventions matter. It doesn't claim omissions *are* processes; it claims they stand in a *different, derivative relation* defined by the failure to interact with processes.
      *   **Avoids Conflation:** It prevents the need to contort the core concept of "causal process" to include absences. It keeps causation proper pure and physical.
  4.  **The "Ad Hoc" Counter & Defense:** Yes, it was invented to handle a problem. But its *justification* lies in the structure above – it builds a new category *using the existing ontology* (actual processes, potential interactions) to handle a distinct *phenomenon* (the significance of *not* interfering). It's not merely labeling the problem; it's offering a structured account *based on* the core CQ commitments. Calling it "quasi" explicitly signals its derivative, non-fundamental status.

  ### Biting the Bullet Without Quasi-Causation
  If you reject quasi-causation, the pure CQ theorist stance is stark:

  1.  **Omissions are Never Causes:** Full stop. They are absences, not processes.
  2.  **Explaining Omission-Talk:** All talk of omissions "causing" is pragmatic, normative, or counterfactual shorthand. It means:
      *   "A positive causal process occurred that led to O."
      *   "There was an expected/prescribed positive action P (involving CQ transfer) that, if performed, would have prevented O by interrupting that process or preventing its initiation."
      *   "The agent responsible for P failed to perform it."
      *   "Therefore, the agent is responsible/blameworthy for O occurring due to their failure to prevent it."
  3.  **The Fern & The King:** The fern died due to dehydration (CQ process). Your not watering is salient *only* because you were the designated preventer. The King's not watering is irrelevant noise because he wasn't. Both are equally non-causes; only your omission is a salient *explanatory factor* and *failure of responsibility* within the context.
  4.  **The Cost:** This requires consistently rephrasing omission claims: "The drowning was caused by water inhalation and physiological failure. The lifeguard's failure to act explains *why this causal process wasn't interrupted* and makes them blameworthy." It feels clunky compared to "the omission caused it," but the CQ theorist argues this clunkiness reveals the conceptual distinction we blur in everyday language.

  ### Conclusion: The Strength of the Exclusion
  The conserved quantity theory's exclusion of omissions is its **greatest strength in preserving a clear, objective, physicalist account of causation**. It refuses to muddy the waters of actual physical production with absences, counterfactuals, and norms. The "many omissions" problem isn't a flaw *for causation proper*; it highlights that our *selection* of which omission matters is driven by pragmatics and normativity, not physics. Dowe's quasi-causation is an attempt to systematize this selection *without* abandoning the physical core, and while arguably ad hoc in motivation, it's structured using the theory's core elements. The pure bullet-biting approach is more ontologically austere but requires disciplined language to separate causation from explanation/responsibility. Both paths defend the core insight: **Genuine causation happens in the realm of energy, momentum, and force – the realm where something *happens*, not where something *doesn't*.** Your instinct as a chemist – seeking the actual mechanism – is why this theory resonates. The legal and moral weight of omissions stems from our expectations and duties concerning *positive actions that should have occurred*, not because absences possess causal power.
