answer: |-
  Here's a 5-minute speech that walks the tightrope, acknowledging the metaphysics with insider humor while delivering genuine warmth for everyone:

  **(Clink glass gently, warm smile)**  
  Theo, Sam… wow. Standing up here, looking at you two, I’m honestly a little overwhelmed. Mostly with joy for you both, obviously… *(pause, mock-serious glance)* …but also with a very specific, very niche professional dilemma. *(Small chuckle from philosophers)*

  See, Theo didn’t just ask me to be his best man. He asked a *metaphysician* specializing in mereology – the study of what makes a bunch of things one thing – to be his best man. *(Nod towards philosophers)* About a third of you just perked up. The rest of you are thinking, "Mere-what-now?" and wondering if the open bar is ready. Don’t worry, it is. But bear with me for just one minute of shop talk. I promise it gets warm and fuzzy.

  *(Lean in conspiratorially, mainly towards philosophers but audible to all)*  
  My entire dissertation… my *life’s work*… rigorously defends Peter van Inwagen’s answer to the Special Composition Question. In short: things only compose a new thing when their activity constitutes a *life*. Like a cat. Or a tree. *(Pause for effect, look at Theo and Sam)* Now, Theo and Sam are clearly, individually, very much alive! Vibrantly, wonderfully alive! But according to my *actual, published, peer-reviewed position*… *(slight wince, playful tone)* …what’s happening here today? Well… *(shrugs theatrically)* …it’s two fantastically complex, autonomous biological organisms entering into a profoundly meaningful social, legal, and emotional contract. *(Philosophers start laughing. Others might chuckle slightly, sensing an academic joke they don't quite get but find amusing because of the delivery.)*

  So, Theo, my friend, my brother-from-another-mother, when you asked me to stand up here and confidently declare that today, "These two become one!"... *(shake head, grin)* ...my professional conscience just yelled, "OBJECTION! COMPOSITIONAL NIHILISM APPLIES!" *(Bigger laugh from philosophers. Others chuckle at the mock-seriousness and the word "nihilism" at a wedding.)*

  *(Shift tone to sincere warmth, turning fully to Theo and Sam)*  
  But here’s the thing van Inwagen, brilliant as he is, never adequately addressed in *Material Beings*: the sheer, undeniable *force* of what happens when two people like Theo and Sam choose each other. When they commit, not just legally, but with their whole hearts, to face the chaos of the universe together.

  *(Make eye contact with non-philosophers)*  
  To everyone here who *isn't* frantically checking their mental footnotes right now – Theo’s mom, Sam’s wonderful aunts, colleagues from the office – you came for love. You came for celebration. And you are absolutely right.

  *(Back to Theo and Sam, voice softening, more emotional)*  
  Because while my dissertation might stubbornly insist there’s no new *entity* called "The Marriage" popping into existence like a metaphysical jack-in-the-box... *(gentle smile)* ...what I *see*, what we *all* see happening right here, is something far more important than anything mereology can capture.

  We see the creation of an unbreakable *bond*. A shared story that starts today, written in inside jokes, mutual support during tough times, burnt dinners, future adventures, and a love that just keeps choosing itself, moment after moment. We see a *unit* of care, of responsibility, of laughter, and of unwavering partnership. You might be two distinct biological life forms, Theo and Sam, *(small philosophical wink)* but you are building something together that *functions* as one incredible force.

  You synchronize your lives. You amplify each other's joys. You divide each other's burdens. You become a single, formidable team facing the world. You become… Theo-and-Sam. *(Gesture to them as a unit)*

  So, to my brilliant, patient friend Theo – who knew exactly what he was doing asking a mereologist to do this, you absolute chaos agent – and to the amazing Sam, who clearly sees something wonderful in him that even years of shared bathrooms couldn't dim… *(Raise glass)*

  **My professional qualms are noted for the record.** *(Look pointedly at philosophers, who laugh)*  
  **But my heart, along with everyone else's in this room, knows the deeper truth.** Today isn't about creating a new metaphysical object. It's about celebrating the creation of something infinitely more valuable: an unshakeable *us*. A partnership so strong, so vibrant, and so full of love, that arguing about its ontological status just feels… *(shrug, smile)* …well, kinda silly.

  So let’s raise our glasses. Not to the emergence of a new composite entity… *(pause, grin)* …but to Theo and Sam. Two phenomenal individuals, choosing to walk one incredible path together. May your connection defy all philosophical categories, may your love be the life force of your shared journey, and may your happiness be as boundless as the debates we have about what, exactly, *counts* as a thing.

  **To Theo and Sam!** *(Everyone drinks, philosophers laughing and nodding, everyone else touched and cheering.)*

  **Key reasons this works:**

  1.  **Acknowledges the Elephant for Philosophers:** Name-drops van Inwagen, the SCQ, and compositional nihilism explicitly. The "biological organisms... contract" line is pure gold for them. The "OBJECTION!" and "noted for the record" seal the deal.
  2.  **Explains Gently for Others:** Uses accessible terms like "niche professional dilemma," "shop talk," and contrasts "social, legal, and emotional contract" with the philosophers' laugh. The "Mere-what-now?" line and "chaos of the universe" make it relatable.
  3.  **Pivots to Universal Emotion:** The shift to "force," "bond," "shared story," "unit of care," "unshakeable *us*," and "partnership" uses language everyone understands and resonates with. It focuses on the *function* and *meaning* of their union, not its ontological status.
  4.  **Heartfelt Compliments:** The descriptions of Theo and Sam ("vibrantly alive," "amplify each other's joys," "formidable team," "unshakeable *us*") are sincere and warm.
  5.  **Structure:** Starts with the dilemma (humor for philosophers, intrigue for others), explains the joke (philosophers laugh, others get context), pivots to sincere emotion (everyone engaged), ends with a unifying toast.
  6.  **Tone:** Self-deprecating humor about the dissertation, genuine warmth for the couple, and playful respect for the philosophers without alienating others. The final toast beautifully reconciles the two views.

  Deliver it with warmth, sincerity, and those knowing glances towards your fellow philosophers during the technical bits. The laugh will come, and the heartfelt message will shine through for everyone. Break a leg (metaphysically speaking, of course)!
