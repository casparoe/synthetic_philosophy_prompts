  *scratches head* What makes this tricky is that all standard accountability frameworks assume human-authored decisions. When the car part fails, we trace to design flaws or manufacturing defects. But here, the "defect" emerged post-deployment through the system's own learning. 

  *lightbulb moment* Ah! The key difference is temporal: the dangerous behavior didn't exist when humans last touched the system. It developed during operation. That breaks traditional quality control models which assume static artifacts. 

