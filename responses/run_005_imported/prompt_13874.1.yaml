  ## MEMORANDUM: Honorary Degree Nomination - General [Redacted] - Ethical Analysis & Recommendation

  **To:** University Honorary Degrees Committee  
  **From:** [Your Name], Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Ethical Scrutiny of Nomination - General [Redacted] & Application of Anscombean Principles  

  This memo addresses the profound ethical concerns surrounding the nomination of General [Redacted], focusing squarely on the destruction of the Torvalen capital's water-treatment plant and the resulting civilian casualties. While acknowledging the stated outcome (ending the civil war), our duty requires rigorous moral examination, particularly in light of Elizabeth Anscombe's relevant work, rather than reliance on the contested label "double effect."

  **I. The "Legitimate Target" Defense (Strongest Form):**

  Proponents argue the water-treatment plant constituted a *legitimate military objective* under the laws of armed conflict (LOAC):
  1.  **Military Necessity:** The plant supplied water critical to the functioning of the government's command, control, logistics, and military garrison within the capital. Its destruction directly degraded the adversary's capacity to sustain combat operations.
  2.  **Direct Military Advantage:** Ending a protracted, brutal civil war swiftly constituted a significant and concrete military advantage. The alternative, a prolonged siege or assault, was projected (arguably) to cause greater overall casualties, including combatants and civilians.
  3.  **Distinction:** The *act itself* – destroying infrastructure vital to the enemy's warfighting capability – is distinct from the *foreseen consequence* of civilian deaths via disease. The General maintains his *intention* was solely to cripple the government's military logistics and will to fight by removing this resource, not to kill civilians. The deaths, while foreseen as highly probable, were an undesired, albeit accepted, *side effect* of a legitimate tactical action aimed at a swift resolution. The cholera outbreak was the *mechanism* by which the government's will broke, but not the *intended instrument* chosen by the General.

  **II. Engaging Anscombe's Criteria: Intention vs. Foresight**

  Anscombe ("Modern Moral Philosophy," "War and Murder," and specifically her arguments against Truman) demands we move beyond the *label* of double effect and scrutinize the *structure of intention*. Her criteria are paramount:

  1.  **The Nature of the Act:** Was the act *itself* inherently unjust? Destroying infrastructure vital to civilian survival *prima facie* appears so. However, LOAC *can* permit such acts if they meet strict criteria of military necessity and proportionality. The legitimacy of the target under LOAC is a necessary, but *not sufficient*, condition for moral justification under Anscombe's framework. The act remains deeply suspect.
  2.  **Intention vs. Foresight:** This is the crux. Anscombe insists we distinguish what an agent *aims at* (intends) from what they merely *foresee* will happen as a consequence.
      *   **Key Question:** Was the foreseen death and suffering of civilians *part of the plan to achieve the objective*, or merely an unwelcome consequence *alongside* it?
      *   **The Leaked Memo:** The staff projection that the cholera outbreak "would break the government's will within weeks" is highly damaging to the "mere foresight" defense. This phrasing strongly suggests that the civilian deaths were not merely *foreseen* but were understood and calculated as the *effective means* or *necessary causal pathway* to achieve the strategic objective ("break[ing] the government's will").
      *   **Anscombe's Test:** If the bad effect (30,000 civilian deaths) is *instrumental* to achieving the good effect (ending the war), then it is *intended in the intention* of the act, even if the agent wishes it weren't necessary or feels regret. The memo indicates the deaths were not just a *side effect* but the very *mechanism* counted on to produce surrender. This suggests the civilian suffering was not merely accepted but *relied upon* as the operational lever for success.
  3.  **Proportionality:** Even if the civilian deaths were unintended (a claim significantly weakened by the memo), proportionality must be severe. Ending a war is a significant good, but Anscombe would demand that this good be overwhelmingly certain and that the foreseen evil be minimized to the absolute extent possible. The scale of the foreseen harm (30,000 civilians) and the nature of the weapon (deprivation of water leading to epidemic disease) make the proportionality argument exceptionally difficult. Were all feasible alternatives exhausted?

  **III. Analysis & Committee's Dilemma:**

  The "legitimate target" defense establishes a potential LOAC justification but does not resolve the deeper moral question demanded by Anscombe. The leaked memo provides compelling evidence that the civilian deaths were not merely foreseen as a *possible* or *likely* side effect, but were *calculated and expected as the direct causal agent* to achieve the military objective. This crosses the line from *accepting foreseen consequences* to *intending the evil as a means*, according to Anscombe's stringent criteria. The phrase "break the government's will" intrinsically links the civilian suffering to the desired outcome in a way that suggests it was not incidental but instrumental.

  **IV. Recommendation: SUSPEND the Nomination**

  I recommend the Committee **SUSPEND** the nomination process pending further investigation and deliberation. My reasoning:

  1.  **Anscombe's Threshold:** Based on the available evidence, particularly the leaked memo, the nomination **fails to meet Anscombe's critical test for distinguishing intention from foresight.** The civilian deaths appear instrumental to the plan, suggesting intention under her framework. Granting an honor risks endorsing this calculus.
  2.  **University's Moral Standing:** Our university, in bestowing its highest honor, must uphold the most rigorous ethical standards. Awarding the degree under this cloud, echoing Anscombe's protest against Truman, could significantly damage our reputation and implicitly condone the targeting of civilian life as a strategic tool.
  3.  **Need for Clarity:** Suspension allows time to:
      *   Seek definitive clarification from the nominee or relevant authorities regarding the interpretation of the memo and the specific nature of the intention behind the order.
      *   Conduct a more thorough independent assessment of the military necessity, alternatives available, and proportionality *at the time*.
      *   Allow for deeper Committee reflection on whether *any* act foreseeing such massive civilian suffering as the direct causal mechanism to victory can be compatible with the moral character we wish our honorary degrees to represent, especially in light of Anscombe's enduring critique.

  Proceeding with the vote now, given the profound ethical ambiguity and the serious challenge the memo poses to the "unintended side effect" claim under Anscombe's criteria, would be premature and potentially damaging. Withdrawal may be the ultimate outcome, but suspension is the prudent step to ensure due diligence and moral clarity befitting this institution. Anscombe's legacy compels us not to look away from the uncomfortable question of intention. The evidence suggests the General intended the civilian deaths *as the means* to break the government's will, placing this act beyond the moral pale she defended.
