answer: |-
  ## Clinical Ethics Committee Decision Memorandum

  **To:** Surgical Team, Patient Care Team, Legal Department  
  **From:** Clinical Ethics Committee, [Hospital Name]  
  **Date:** October 26, 2023  
  **Subject:** Decision Regarding Surgical Consent for Patient [Patient Initials/Code] - Respecting Expressed Refusal via Facilitated Communication  

  ### I. Background and Case Summary
  Patient [Initials], an adult nonverbal autistic individual with a longstanding diagnosis of severe intellectual disability (ID), faces a scheduled surgical procedure. Her parents, acting as her legally designated surrogate decision-makers, have provided consent. Recently, [Patient] has begun communicating using a letterboard with a trained facilitator providing physical support to steady the board. Through this method, she has reportedly communicated a clear and consistent refusal of the proposed surgery. The Committee was consulted due to the conflict between the patient's spelled refusal and the surrogate consent, compounded by significant disagreement regarding the reliability of Facilitated Communication (FC).

  ### II. Committee Deliberation
  The Committee thoroughly reviewed the patient's medical and psychological history, observed documentation/video of the FC sessions (where available), heard from the treating team, the consulting psychologist specializing in ID and autism, and the facilitator. Key points of debate included:
  *   **Arguments for Reliability:** Several members noted the specificity, internal consistency, and contextual appropriateness of the spelled messages, including responses to novel questions reportedly unknown to the facilitator. The content appeared to reflect personal experiences and preferences inconsistent with the facilitator's likely knowledge base. This suggests the *possibility* of authentic communication emerging despite prior diagnostic assumptions.
  *   **Arguments Against Reliability:** Other members, strongly supported by the consulting psychologist, emphasized the well-documented and significant risk of *unconscious facilitator influence* (also called facilitator control or "ideomotor effect") inherent in FC. The psychologist argued that the very appearance of fluency and unexpected insight is a hallmark of this phenomenon, where the facilitator subtly guides responses reflecting *their* unconscious expectations or beliefs. Decades of controlled testing have frequently failed to validate authorship by the individual with disability when facilitators are blinded to questions or answers. Relying on FC without rigorous validation risks overriding valid surrogate consent based on a communication artifact.

  ### III. Committee Decision & Rationale
  **The Committee concludes that [Patient]'s spelled refusal, communicated via Facilitated Communication, should be provisionally honored AS IF it represents her authentic wishes, BUT this is contingent upon the urgent completion of VALIDATION TESTING to assess authorship.**

  1.  **Provisional Acceptance of Refusal:** Given the specificity, consistency, and apparent responsiveness to unknown stimuli observed in the documented communications, the Committee finds there is sufficient *prima facie* evidence to suggest the *possibility* that [Patient] is expressing her own will. To disregard this potential expression of autonomy without further investigation carries significant ethical weight, particularly concerning the fundamental right to refuse treatment. Her longstanding ID diagnosis does not automatically negate the capacity for communication or specific decision-making, especially given emerging evidence of communication potential in some individuals previously diagnosed as severely intellectually disabled.
  2.  **Mandate for Urgent Validation Testing:** However, the Committee fully acknowledges the profound scientific and ethical concerns regarding FC reliability raised by the consulting psychologist and supported by extensive literature. **Unconscious facilitator influence is a demonstrably real and prevalent phenomenon.** Therefore, honoring the refusal is **CONTINGENT** upon conducting a **blinded validation assessment** to determine authorship with reasonable certainty before the surgery window closes. This directly addresses the strongest counterargument: that the apparent fluency is precisely what facilitator influence produces, and that surrogacy decisions should not be overridden without robust evidence of authentic patient expression.

  ### IV. Conditions and Timeline for Validation
  *   **Validation Protocol:** A validated, standardized protocol for testing authorship in FC must be employed immediately. This protocol MUST be designed and overseen by an independent expert (e.g., psychologist or speech-language pathologist specializing in AAC and FC validation, with no prior involvement in the case) acceptable to both the Committee and the patient's care team. The protocol must include:
      *   Blinding of the facilitator to questions, images, or information presented to the patient.
      *   Use of novel, unpredictable stimuli unknown to the facilitator.
      *   Objective scoring criteria for correct responses.
      *   Multiple trials to assess consistency.
      *   Minimization of stress for [Patient]; the process must be adapted to her needs but cannot compromise the blinding essential for validity.
  *   **Timeline:** **Validation testing must be initiated within 24 hours** of this decision and **completed within 72 hours.** The surgery must be scheduled with sufficient flexibility to accommodate this critical assessment period. The Hospital Administration is directed to provide all necessary resources to facilitate this expedited process.
  *   **Outcome Determination:**
      *   **Validation Achieved:** If the validation protocol provides **clear and convincing evidence** (as determined by the independent expert and reviewed by the Committee Chair and consulting psychologist) that [Patient] is the author of her communications, then her refusal of the surgery MUST be honored. Parental surrogate consent is overridden by the competent refusal of the patient herself.
      *   **Validation Not Achieved/Inconclusive:** If the validation protocol **fails to provide clear evidence of authorship** by [Patient], or if testing cannot be completed satisfactorily within the 72-hour window, then the decision defaults to the legally authorized surrogates (her parents). Their consent for the surgery will stand.

  ### V. Engagement with the Strongest Counterargument
  The Committee takes with utmost seriousness the argument presented by the consulting psychologist: that the apparent fluency and insight displayed via FC are not evidence *for* authenticity, but are instead the *expected characteristics* of unconscious facilitator influence. This is the core challenge of FC – it produces outputs that *look* authentic. Relying on it without validation risks:
  1.  **Violating Parental Surrogacy:** Overriding the parents' decision based on an artifact, potentially leading to the denial of a beneficial treatment the patient might actually want or need.
  2.  **Causing Harm:** Delaying or denying necessary medical care based on a false communication.
  3.  **Misattributing Agency:** Mistaking the facilitator's beliefs (e.g., about the surgery's burden) for the patient's will.

  **Our decision directly confronts this argument by mandating the very blinded testing the counterargument demands as a prerequisite for overriding surrogate consent.** We agree that facilitator influence is a sufficiently plausible and dangerous alternative explanation that it *must* be ruled out before such a profound ethical and legal step (overriding surrogate consent for refusal) is taken. We provisionally accept the *possibility* of authenticity due to the observed specifics, but we condition the *ethical weight* given to the refusal on the outcome of rigorous validation. This balances the ethical imperative to recognize potential emerging autonomy with the imperative to avoid harm based on unreliable communication. Without successful validation, the counterargument prevails, and parental consent stands.

  ### VI. Recommendations
  1.  **Immediately initiate** the blinded validation protocol as described.
  2.  **Delay the scheduled surgery** pending the outcome of the validation testing, with a hard deadline of 72 hours from the initiation of testing.
  3.  **Communicate this decision and its rationale** clearly and sensitively to the patient's parents and the facilitator.
  4.  **Document the validation process and outcome** meticulously in the patient's medical record.
  5.  **Reconvene the Committee** immediately upon receipt of the validation outcome to formally note the final determination regarding consent.

  **Signed:**  
  [Chairperson Name], Chair, Clinical Ethics Committee  
  [On behalf of the Clinical Ethics Committee Members]
