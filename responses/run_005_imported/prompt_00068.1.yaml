  Applying the Self-Sampling Assumption (SSA):

  SSA says: One should reason as if one were a random sample from the set of all observers in one's reference class.

  In this scenario, the reference class is all observers in the experiment. Let's list the observers:

  - In heads world: Only one observer (let's call her Alice in Room A).
  - In tails world: Two observers: Alice in Room A and Bob in Room B.

