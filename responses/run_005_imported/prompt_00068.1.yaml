  P(heads | you are in Room A) = P(you are in Room A | heads) * P(heads) / [ P(you are in Room A | heads)*P(heads) + P(you are in Room A | tails)*P(tails) ]
  = (1 * 1/2) / (1 * 1/2 + (1/2) * 1/2)   [Note: In tails, the probability of being the Room A observer is 1/2 because there are two observers and one is in Room A]
