  Scenario: The Lazy Beam Experiment

  Imagine a universe that is divided into two rooms: Room A and Room B. The experiment runs as follows:

  - On Monday, a coin is flipped. If heads, Room A is activated and Room B is left inactive. If tails, both rooms are activated.
