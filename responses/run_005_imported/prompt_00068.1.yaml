  Now, applying the Self-Indication Assumption (SIA):

  SIA says: We should reason as if we are randomly selected from the set of all possible observers, including those who might not have existed. In other words, we should adjust our prior probabilities by the number of observers that would exist in each world.

  SIA effectively says: the probability of a world is proportional to the prior probability of that world multiplied by the number of observers in that world.

