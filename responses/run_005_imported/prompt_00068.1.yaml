  Hence, by SSA, we should assign equal probability to being in either of these two observer-moments. Therefore, P(heads) = P(tails) = 1/2.

  But wait, let's do the calculation with SSA more carefully. The SSA probability of being a particular observer is proportional to 1 over the total number of observers in that world.

