  I was down a Wikipedia rabbit hole about general relativity last night and stumbled on this thing called the "hole argument" against substantivalism (the view that spacetime points are real things in their own right, not just a bundle of relations between objects/events). I think I've got the technical setup down -- you take a solution to Einstein's equations, apply a diffeomorphism that's the identity everywhere except inside some matter-free "hole," and you get a mathematically distinct metric that agrees with the original everywhere outside the hole. What I'm stuck on is WHY that's actually supposed to be a problem for substantivalism instead of just a wierd redundancy in the math -- like, why cant a substantivalist just say "those are obviously just two descriptions of the exact same physical situation" and call it a day? Everyone acts like this is a huge deal for whether spacetime is "real," but I want the actual gut-level intuition for why that easy way out apparently doesn't work, not just the diffeomorphism math again lol.
