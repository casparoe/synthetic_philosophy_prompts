  However, his ethical stance against discounting future welfare suggests he'd oppose pure time preference. He might critique the utilitarian calculus in longtermism, especially if it neglects current injustices. Ramsey might support mitigating extinction risks but question the scale of resources allocated to far-future scenarios. His approach would likely be more grounded, emphasizing institutions and near-term steps over speculative futures.

  The user might also want insights into applying Ramsey's principles to modern debates. How would his balance between present and future inform today's longtermism critiques? They might be seeking a nuanced view that avoids extremes—valuing the future without losing sight of current human context.

