answer: |-
  Here's a joke honed for Lewis readers, turning on the debt/punishment distinction and his "inconsistency" argument:

  **David Lewis walks into a theology seminar just as they’re debating Penal Substitution.**  
  Theologian: *"But how can Christ *justly* bear the punishment meant for sinners? Punishment is personal!"*  
  Lewis, leaning against the doorframe: *"Indeed. You wouldn't let someone else serve your prison sentence, would you? That's the crux: punishment, unlike a debt, isn't transferable. It requires the actual offender. A fine? Payable by proxy. Jail time? Intrinsically tied to the guilty party."*  
  Theologian, sweating: *"So... the Atonement is incoherent?"*  
  Lewis: *"Not necessarily. It's simply inconsistent with how we *actually* treat punishment. Unless..."*  
  Theologian: *"Unless?"*  
  Lewis: *"Unless we redefine 'punishment' as a kind of cosmic *debt*. Then substitution works fine. Problem solved."*  
  Theologian: *"But... isn't that just changing the subject?"*  
  Lewis: *"Precisely. Now we're consistent. Whether it's *true*... well, that's *your* possible world."*  
  *(He tips his hat and walks out, leaving modal dust in his wake.)*

  **Why it works for readers:**

  1.  **The Crux:** It directly uses Lewis's key distinction: debts (transferable) vs. punishments (non-transferable, requiring the offender).
  2.  **The "Inconsistency" Move:** Lewis's central argument is that penal substitution is *inconsistent* with our ordinary practices of punishment. The joke has him explicitly state this ("inconsistent with how we *actually* treat punishment").
  3.  **The "Solution":** Lewis famously (and somewhat cheekily) resolves the inconsistency by suggesting we *redefine* the punishment as a debt. The joke highlights this as "changing the subject," which is exactly the analytical move Lewis makes – dissolving the problem by re-describing the theological claim to fit the transferable model.
  4.  **Lewis's Persona:** The deadpan delivery, the focus on consistency over theological truth, and the final modal shrug ("*your* possible world") capture his style and broader philosophical commitments.
  5.  **The Punchline:** The humor comes from Lewis treating the profound theological mystery as a simple matter of linguistic/ontological bookkeeping to achieve consistency, dismissing the core theological concern with an analytic wave of the hand ("Problem solved"). The theologian's frustration ("isn't that just changing the subject?") is the reader's recognition of Lewis's move.

  Anyone unfamiliar with the paper might get the debt/punishment distinction, but only readers will appreciate the precise mimicry of Lewis's argument structure (identify inconsistency -> propose redefinition/semantic shift to resolve it) and his characteristic philosophical detachment applied to theology. The modal quip at the end is the cherry on top for Lewis fans. Enjoy your reading group!
