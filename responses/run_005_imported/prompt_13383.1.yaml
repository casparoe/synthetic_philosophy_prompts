  Then there's the revisionism worry. Actual believers often assert religious events like the Resurrection as historical facts, similar to Waterloo. The user questions whether Wittgenstein is imposing a philosophical framework that misrepresents believers' self-understanding. They mention Malcolm's view of Wittgenstein's personal struggle with faith as a possible escape route but remain skeptical. 

  I agree with the user's skepticism here. Malcolm's angle—suggesting Wittgenstein's personal tension between attraction to religion and inability to believe—doesn't resolve the revisionism issue. It might explain Wittgenstein's perspective but doesn't address the mismatch between his analysis and believers' self-reports. The user's point stands: Wittgenstein's framework risks being descriptive only for a subset of "contemplative" believers while revising others' experiences. 

  For the user's requests: (a) They're fair to both sides—correctly noting Nielsen's oversimplification of Wittgenstein's position and accurately presenting Wittgenstein's focus on belief function over epistemic isolation. (b) The Malcolm reference doesn't solve the revisionism problem; it merely contextualizes Wittgenstein's viewpoint without bridging the gap with ordinary believers. 

  The user might need to refine their paper by: explicitly differentiating Wittgenstein's descriptive aims (how beliefs function) from believers' self-descriptions, acknowledging the tension as inherent to his approach, and perhaps arguing that his analysis reveals implicit dimensions of belief even when adherents use literalist language. That could turn the revisionism point into a strength—showing how philosophy can uncover underlying structures beneath surface assertions.
answer: |-
  Here’s a clear breakdown of your arguments and concerns, with direct feedback on both your questions:

  ### (a) Fairness to Nielsen & Wittgenstein  
  - **On Nielsen**: You’re fair. Nielsen’s "Wittgensteinian fideism" critique *does* frame Wittgenstein (and Phillips) as insulating religion from rational critique via language-games. Your rebuttal—that Wittgenstein’s focus is on the **grammatical role** (life-regulating function) of religious propositions rather than epistemic quarantine—is well-supported by the 1939 lectures. Key evidence:  
    - Wittgenstein contrasts "historical belief" (e.g., Napoleon) with "belief in the Last Judgement" via their *practical consequences* (e.g., "terror" reshaping one’s life).  
    - He explicitly says religious beliefs aren’t "hypotheses" open to verification/falsification (*Lectures on Religious Belief*, III).  
    Your point that Nielsen misses the *kind* (not degree) of belief distinction is valid.  

  - **On Wittgenstein**: You’re faithful to the text. Wittgenstein *doesn’t* claim religious beliefs are "unreasonable" or exempt due to "internal criteria" (a Phillips emphasis). Instead, he argues their meaning derives from their **existential grammar**: how they "regulate" action, emotion, and self-understanding. Your "kind vs. degree" framing captures his anti-empiricist thrust.  

  **Verdict**: Your critique of the received view is coherent and textually grounded.  

  ---

  ### (b) The Revisionism Worry & Malcolm’s "Way Out"  
  Your concern is spot-on: **Wittgenstein’s analysis *does* risk revisionism** regarding ordinary believers who assert religious claims as straightforward historical facts. Malcolm’s appeal to Wittgenstein’s personal "strange relationship" to religion (e.g., admiration without belief) doesn’t resolve this—it *restates* the problem in biographical terms.  

  #### Why Malcolm’s move fails:  
  1. **It doesn’t address the believer’s self-understanding**. If a Christian insists the Resurrection is factually true "like Waterloo," Wittgenstein’s functionalist reading (treating it as a "pictures" guiding life) overrides their self-report. This *is* revisionist.  
  2. **Wittgenstein’s personal struggle ≠ hermeneutic justification**. His inability to believe doesn’t license reinterpreting believers who *do* assert factual truth.  

  #### A stronger solution (suggested):  
  - **Embrace the tension explicitly**: Argue that Wittgenstein exposes an *implicit grammar* beneath explicit assertions. E.g., when believers say "Resurrection = historical fact," but their *practices* (prayer, sacrifice, hope in suffering) reveal it functions as a *normative/regulative* certainty—not a testable hypothesis.  
    - **Evidence**: Wittgenstein notes that if a believer doubted the Resurrection, they wouldn’t consult historians; they’d pray or seek spiritual counsel (*Lectures*, I). This shows the *grammatical* difference.  
  - **Concede limited scope**: Wittgenstein’s analysis applies best to *contemplative* religiosity (e.g., Kierkegaard, Augustine) — not fundamentalist literalism. His target was likely "belief" as a lived orientation, not doctrinal propositions.  

  **Verdict**: Your worry is valid. Malcolm doesn’t resolve it—but leaning into the "implicit grammar" angle could strengthen your paper.  

  ---

  ### Key Recommendations for Your Paper:  
  1. **Clarify the target**: Explicitly state that Wittgenstein analyzes *belief-as-existential-orientation* (e.g., dread/hope driving life-reform), not doctrinal assertions in isolation.  
  2. **Address revisionism head-on**:  
     > *"While Wittgenstein’s framework may revise the believer’s self-description, it illuminates the *functional role* of their certainty—a role that persists even when they invoke historical language."*  
  3. **Invite Phillips to the rescue?** Briefly note that Phillips *does* defend revisionism (e.g., *Religion Without Explanation*), arguing philosophers must clarify concepts believers "misdescribe." Reject this if it dilutes your critique!  
  4. **Sharpen the conclusion**: Wittgenstein’s aim wasn’t to protect religion from critique, but to **dissolve confusions** about what "believing X" *means* in different contexts.  

  **Overall**: Your core argument is coherent, original, and philosophically sound. The revisionism point is a strength—not a flaw—if framed as Wittgenstein revealing the *depth grammar* beneath surface assertions. **Definitely conference-ready** with minor polishing.
