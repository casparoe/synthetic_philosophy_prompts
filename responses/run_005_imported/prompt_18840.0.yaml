  Their phrasing "self-location or whatever's really going on" suggests they suspect this isn't about math but about identity-in-time. Bingo. That's the lever. The trap springs because when you're disoriented, "now" could be exit one or exit two, but the consequences aren't symmetric - continuing at exit one is safe, at exit two it's fatal. Yet your blurred perspective forces identical behavior at both points. 

