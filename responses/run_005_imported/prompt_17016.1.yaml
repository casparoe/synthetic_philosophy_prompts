prompt: |-
  I'm a PhD student in philosophy of science, and this term our Friday reading group has been working through Bayesian confirmation theory -- we just finished the section on the "problem of old evidence" in Earman's *Bayes or Bust?*, using the standard example of Mercury's perihelion: the ~43 arcsec/century anomaly in its orbit that Newtonian mechanics couldn't explain but that dropped straight out of Einstein's field equations once he worked them out in 1915. Afterwards two people in the group, Reza and Ilana, got into an argument over drinks that turned into a real back-and-forth, and I can't referee it myself, so hoping you can.

  (1) Reza opened by saying the old-evidence case just refutes Bayesian conditionalization as a theory of confirmation, full stop: the community's credence in the perihelion data was already 1 (or near enough) decades before 1915, so conditionalizing on it literally cannot move anyone's credence in GR, and yet everyone agrees this was one of the most dramatic confirmations in the history of physics -- so the model gets its own field's most famous case exactly backwards. (2) Ilana said this moves too fast: what actually happened in November 1915 wasn't a change in anyone's credence in the perihelion data, it was the discovery that GR *entails* that exact number, so you should conditionalize on "GR entails E" rather than on E itself, and once you do that the confirmation shows up fine -- she said she thinks this is basically the standard "Garber" move here, though don't quote me on the name. (3) Rezas comeback was that this quietly gives up logical omniscience, the assumption baked into the whole conditionalization framework that an ideal agent already assigns credence 1 to every entailment among the propositions in their space -- and you don't get to just drop that and keep calling the result "conditionalization" without owing a totally new account of how learning a logical fact even works. (4) Ilana said that's a cost worth paying, since nobody serious thought real scientists were logically omniscient anyway, and everything else about the framework can stay as is. (5) Reza's last move was that it's not that cheap: if merely discovering that a theory entails already-known data is what does the confirming, then any theory you gerrymandered after the fact to entail that same data should get an identical boost, which seems to erase the distinction between GR's result and ordinary ad hoc curve-fitting -- and the only thing that seems to block that is some notion of how surprising or unforced the entailment is, which isn't a Bayesian notion at all.

  Neither of them budged, and honestly I go back and forth every time I retell it. Could you go through moves (1) through (5) and say who's got the better of it at each stage, not just who wins overall -- and flag anything you think both of them are missing? And then stand back for a second: given move (5), is there actually a way to rescue a Bayesian treatment of old evidence, or does the exchange show that whatever's doing the confirming in cases like this isn't Bayesian updating at all?
reasoning: |-
  Okay, I need to tackle this complex debate about Bayesian confirmation theory and the problem of old evidence. The user is a PhD student in philosophy of science who witnessed an argument between Reza and Ilana about whether Mercury's perihelion anomaly refutes Bayesian conditionalization. They want me to analyze each of the five moves in their exchange, judge who has the better argument at each stage, identify what both might be missing, and finally assess whether Bayesianism can be rescued here.

  Hmm, this is a classic but thorny issue in philosophy of science. Let me reconstruct the core problem first: When Einstein derived Mercury's perihelion from GR in 1915, scientists already knew about the anomaly (old evidence E). Since their credence in E was already 1, conditionalizing on E can't increase P(GR|E) - that's Reza's point (1). Ilana's response (2) is the standard Garber solution: conditionalize on "GR entails E" instead. But Reza counters (3) that this abandons logical omniscience, which is foundational to Bayesianism. Ilana says (4) that's acceptable since real agents aren't logically omniscient. Reza's knockout punch (5) is that this makes confirmation too easy - any ad hoc theory entailing E would get the same boost, erasing what's special about GR.

  I should note that both are partly right but missing nuances. For (1), Reza correctly identifies the technical problem, but overlooks that Bayesianism was never meant as a descriptive psychology of scientists. For (2), Ilana's move works mathematically but creates new problems - Garber himself knew this. The logical omniscience point (3) is devastating because Bayesian updating assumes a fixed proposition space, while learning logical relations changes that space. Ilana's pragmatism (4) has merit - scientists aren't perfect logicians - but Reza's (5) exposes a deeper issue: without some "surprise" factor, Bayesianism can't distinguish profound entailments (like GR's) from trivial ones.

  What both miss: First, the community's credence in E wasn't literally 1 - there were alternative explanations (e.g. Vulcan hypothesis). Second, the confirmation wasn't just about entailment but about GR resolving multiple anomalies elegantly. Third, the diachronic aspect: in 1915, scientists were comparing GR against Newtonian models, so the boost came from relative likelihoods. 

  On rescuing Bayesianism: Pure conditionalization fails, but there are sophisticated workarounds. Jeffrey conditionalization could handle non-certain evidence. Alternatively, we could model agents discovering logical connections through "awareness growth" frameworks like Gaifman's. Still, Reza's point stands - Bayesianism alone can't capture why GR's derivation felt explanatory rather than ad hoc. That likely requires additional principles like simplicity or unification, which Bayesians try to incorporate through priors but arguably go beyond the framework.

  The user might also appreciate knowing this isn't just academic - similar issues arise in modern cosmology. Ultimately, the exchange shows that while Bayesian tools are useful, the "aha" moment in scientific confirmation involves elements beyond credence updating.
answer: |-
  Let's break down this excellent dialectic move-by-move, assessing strengths and weaknesses. Both raise crucial points, and the exchange highlights deep tensions in Bayesian confirmation theory (BCT). Here's my analysis:

  **Move (1): Reza's Opening Salvo**  
  *Claim:* Old evidence (E) with P(E) ≈ 1 cannot confirm H via conditionalization since P(H|E) = P(H). GR's confirmation by Mercury's perihelion refutes BCT.  
  *Assessment:* **Reza scores heavily here.** He correctly identifies the *technical impossibility* of confirmation via standard conditionalization when P(E)=1. The case is historically potent: scientists *did* treat Mercury's perihelion as a major win for GR, yet no Bayesian update on E itself occurred in 1915. This is the core "problem of old evidence" (Glymour 1980), and Reza leverages it well.  
  *What's missing?* Reza underplays that Bayesianism often idealizes agents. P(E)=1 *strictly* prevents updating, but scientists might have held P(E) < 1 (e.g., due to measurement error or rival explanations like Vulcan). Still, for Mercury, P(E) was likely *so* high that any boost from miniscule P(H|E) would be negligible.

  **Move (2): Ilana's Garber Move**  
  *Claim:* We should conditionalize on *"GR entails E"* (call this proposition T), not E itself. Learning T *can* boost P(GR).  
  *Assessment:* **Ilana has a strong technical response.** This is indeed Garber's (1983) influential solution. Formally, P(GR|T) > P(GR) is possible even if P(E)=1, provided the agent didn't previously know GR entails E. Mathematically, it works.  
  *What's missing?* Ilana doesn't address *why* we should treat "learning T" as the relevant update. It shifts the locus of confirmation from empirical content (E) to logical discovery—a significant concession.

  **Move (3): Reza's Logical Omniscience Counter**  
  *Claim:* Conditionalizing on T abandons logical omniscience (LO), a core idealization of standard BCT. Without LO, we need a new theory of "logical learning."  
  *Assessment:* **Reza lands a critical blow.** LO *is* baked into standard Bayesianism: agents know all logical truths (so P(T)=1 always). If we drop LO, we must explain how learning T differs from learning empirical facts. Garber-style moves *do* implicitly replace strict conditionalization with a new "logical learning" rule—undermining the purity of Ilana's "everything else stays the same."  
  *What's missing?* Reza overstates LO's centrality for *all* Bayesian applications. Many Bayesians (e.g., Jeffrey) accept non-ideal agents. Still, he correctly notes that abandoning LO requires major scaffolding.

  **Move (4): Ilana's Pragmatic Defense**  
  *Claim:* Dropping LO is a worthwhile cost since real agents aren't logically omniscient. The framework survives.  
  *Assessment:**Ilana has a point, but it's incomplete.** She's right that no serious Bayesian thinks real scientists are logically omniscient. Relaxing LO *is* necessary for realism (e.g., Garber, Field, and later "awareness" models). The mathematical machinery of conditionalization *can* still apply to learning T.  
  *What's missing?* She doesn't address the *cost*: once LO is dropped, confirmation becomes dependent on agents' *ignorance* of logical relations. This feels epistemically awkward—confirmation shouldn't hinge on what Einstein hadn't yet deduced.

  **Move (5): Reza's Gerrymandering Challenge**  
  *Claim:* If confirmation comes merely from learning T, then *any* H' gerrymandered to entail E gets the same boost as GR. This erases the distinction between profound theories and ad hoc ones.  
  *Assessment:* **Reza wins this round decisively.** This is the Achilles' heel of the Garber move. If P(GR|T) rises solely because T was learned, then P(H'|T') for an ad hoc H' (crafted solely to entail E) would rise identically, given equal priors. Yet intuitively, GR's confirmation was *not* equivalent to an ad hoc hypothesis—it was explanatory. BCT lacks resources to distinguish "surprising" entailments (GR) from "trivial" ones (ad hoc H'), as this distinction relies on *priors* or *simplicity*—concepts external to conditionalization.  
  *What's missing?* Reza implies Bayesianism *can't* handle this, but some Bayesians (e.g., Howson) argue priors *can* penalize ad hoc theories. Still, this prioritizes *prior probabilities* over *conditionalization* as the source of discrimination.

  ### Who Wins Each Stage?
  - (1): **Reza** (exposes core technical flaw)  
  - (2): **Ilana** (offers viable technical fix)  
  - (3): **Reza** (reveals hidden cost of fix)  
  - (4): **Ilana** (justifies cost pragmatically)  
  - (5): **Reza** (shows fix undermines key virtue of GR's confirmation)  
  **Overall:** Reza edges it, as (5) is a profound challenge. But Ilana's points stand—BCT *can* be patched, albeit imperfectly.

  ### What Both Miss
  1. **Diachronic vs. Synchronic Confirmation:** They focus on *updating* in 1915, but confirmation might be synchronic: GR's *ability* to explain E (given background knowledge) made it *better confirmed than Newton* at that time, regardless of credence changes.  
  2. **Community Knowledge:** Scientific confirmation is communal. Einstein's derivation *changed the logical landscape* for all scientists, making T common knowledge. This isn't just about individual credences.  
  3. **Role of Multiple Constraints:** GR didn't just explain Mercury; it solved *several* problems (e.g., light bending), making ad hoc alternatives harder to construct. Bayesian networks could model this.  
  4. **The "Aha!" Factor:** Reza hints at this—GR's entailment felt *explanatory*, not just logical. But capturing "explanatory power" requires augmenting BCT (e.g., with unification measures).

  ### Can Bayesianism Be Rescued?  
  Yes, but with caveats:  
  - **Non-ideal Agents:** Embrace models that relax LO (e.g., Garber, Gaifman's "awareness"). Learning T *can* boost P(H) if P(T) < 1.  
  - **Jeffrey Conditionalization:** If P(E) was high but <1, updating on E *could* slightly boost P(H).  
  - **Pragmatic Priors:** Penalize ad hoc theories with low priors (though this shifts the burden).  

  **However, Reza's (5) shows the deeper issue:** Pure conditionalization (even on T) *cannot* distinguish profound from trivial entailments. This suggests that:  
  - **Confirmation isn't just about credence updating.** The *reason* GR impressed was its *explanatory coherence*—it resolved Mercury *naturally* as part of a unified theory. Bayesianism needs auxiliary principles (simplicity, non-ad-hocness) to capture this.  
  - **The "surprise" factor matters.** As Earman notes, old evidence confirms when its *derivation* from H is "intellectually gripping." This is pragmatic and contextual, exceeding standard BCT.  

  ### Conclusion  
  The exchange shows that **while BCT can be technically salvaged for old evidence (via Garber-style moves), it struggles to capture why some confirmations (like GR's) feel epistemically weightier than others.** Reza wins on exposing BCT's limitations, but Ilana is right that non-ideal Bayesian models *can* handle the credence dynamics. Ultimately, Mercury's perihelion suggests that Bayesian updating is *necessary but not sufficient* for full confirmation—explanatory virtues play a role beyond credences. For your reading group: this might point toward "Bayes+": Bayesian tools supplemented with accounts of explanation (e.g., Schurz) or virtue-based priors.
