answer: |-
  Here's a concrete contrast highlighting Kepler's critical approach, grounded in his physical/harmonic principles:

  **Defended Technique: Planetary Aspects (Specifically Conjunction & Opposition)**
  *   **What it is:** The angular relationship between planets measured at specific harmonic angles (e.g., 0° Conjunction, 180° Opposition, 120° Trine, 90° Square). Kepler focused intensely on the *geometric angles* themselves.
  *   **Why Kepler Defended it (His Terms):**
      1.  **Physical Cause (Light & Motion):** Kepler saw celestial influence primarily operating through *light* and the *geometry* it creates. Planets are physical bodies emitting rays of light (and potentially other "influences") into space.
      2.  **Harmonic Resonance:** His core belief was that the universe was structured according to geometric harmonies (inspired by Pythagorean and Platonic ideas, later solidified in *Harmonices Mundi*). Specific angles corresponded to consonant musical intervals (e.g., opposition ~ dissonance/tension like a 7th, conjunction ~ unison, trine ~ perfect fifth).
      3.  **Mechanism for Interaction:** When two planets form a specific geometric aspect (angle), their rays of light (or "species") intersect at that angle relative to the Earth (or another point). Kepler hypothesized that this specific geometric configuration allowed the planetary influences to *mix* or *interfere* in a way that resonated (or conflicted) with the harmonic structure inherent in the human soul and terrestrial matter. A conjunction (0°) meant rays perfectly mingled; an opposition (180°) meant rays pulling directly against each other, creating tension. This interaction could then sympathetically affect sublunary affairs, particularly human temperaments (themselves governed by harmony/disharmony).
      4.  **Empirical Basis (Flawed but Physical):** He saw aspects as observable geometric configurations with a plausible (to him) physical transmission mechanism (light rays interacting at angles), making them fundamentally different from purely symbolic associations.

  **Dismissed Technique: Astrological Houses (Particularly the "House Systems" assigning life areas)**
  *   **What it is:** Dividing the local sky (from horizon to zenith to horizon) into 12 segments ("houses"), each traditionally assigned rulership over specific areas of life (e.g., 1st House = Self, 7th House = Marriage/Partners, 10th House = Career/Status).
  *   **Why Kepler Dismissed it (His Terms):**
      1.  **Lack of Physical Cause:** Kepler saw *no conceivable physical mechanism* connecting the arbitrary division of the local horizon-zenith circle into 12 unequal segments (based on complex calculations like Regiomontanus or Placidus) to specific terrestrial events or human life domains. How could the *local* position relative to *my* horizon physically influence abstract concepts like "marriage" or "career"?
      2.  **Absence of Universal Harmony:** The house divisions were human constructs, varying wildly between different systems and locations. They didn't reflect the *universal* geometric harmonies Kepler believed governed the cosmos (like the aspects did). The harmony was in the celestial spheres and their relationships *to each other*, not in their projection onto an infinitely variable local horizon plane.
      3.  **Arbitrary Symbolism:** He viewed the assignment of life areas to houses as purely symbolic, traditional, and anthropomorphic – placing human concerns onto the sky without a physical or harmonic justification. It was "astrology as superstition," disconnected from the underlying physics and mathematics of the heavens.
      4.  **Focus on the Wrong Geometry:** While aspects dealt with angles *between celestial bodies* in the ecliptic plane (the plane of the solar system), houses dealt with angles relative to the *local observer's position on Earth*. For Kepler, the *celestial* geometry was primary and universal; the *local terrestrial* geometry was secondary and often irrelevant to cosmic influence, which he believed acted more generally via light and harmonic resonance on the Earth *as a whole* or on receptive individuals sympathetically.

  **The Crucial Separation in Kepler's Own Framework:**

  *   **Aspects:** Were **physically grounded** in light rays interacting geometrically and **harmonically justified** by universal geometric/musical principles. They represented *actual* configurations of celestial bodies with a plausible causal chain (light/motion -> geometric interaction -> harmonic resonance -> sympathetic effect).
  *   **Houses:** Were **physically baseless** (no mechanism for local horizon divisions to cause specific life events) and **harmonically irrelevant** (not based on universal celestial geometry, but arbitrary local divisions and symbolic assignments). They represented human *interpretation* imposed onto the sky, not a *physical/harmonic reality* emanating *from* the sky.

  Kepler saw himself as stripping away the superstitious dross of traditional astrology (like houses, fixed-star omens, rigid sign rulerships, over-literal interpretations) to salvage a core "physical astrology" based solely on the *light*, *motion*, and *harmonic geometry* of the planets themselves – primarily manifest through their aspects. He defended the *principle* of celestial influence via physical/harmonic means, not the vast majority of the *practices* of his contemporary astrologers. Your piece can powerfully highlight this distinction as evidence of his critical, reformist approach within the context of his time, rather than simple credulity.
