  First complication: Deutsch-Wallace decision theory. Naive branch-counting contradicts the Born rule that rational agents must weight by amplitude squared. If survival probability is 1/10^9 per trial, amplitude says you're effectively dead, while naive counting says you always survive. That's a fatal flaw for the betting argument. 

