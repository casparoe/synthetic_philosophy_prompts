  Looking at Condorcet's jury theorem - it's fundamentally about equal participation. Each voter's judgment must be independent and better than random. Futarchy's weighting by capital would violate this principle at the structural level. That's a strong strike against it in Condorcet's framework.

  Then there's his constitutional work. The elaborate voting procedures in his Girondin draft weren't just about accuracy - they were anti-oligarchic safeguards. Futarchy's market mechanism would likely trigger his alarm about "partial associations" and wealth concentration. The 1793 warning against financial powers controlling policy feels particularly relevant here.

