  The key constraints are clear: no sappy sentiment (family preference), no implied criticism of their marriage motives, and absolutely no turning the toast into a lecture. The humor needs to land for both crowds—philosophers should recognize the niche reference, while aunts/uncles should still find it charmingly absurd. 

