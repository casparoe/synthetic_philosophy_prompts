  Structure idea: Open with classic toast warmth (brief!), pivot to Priya's work via self-deprecation ("novelist vs philosopher" tension), then unpack the mud-demon as a ridiculous hypothetical. Punchline: "Since experts debate what 'right' reasons even are, [Brother] gets automatic credit for loving Priya." Close by toasting their actual, non-mud-related happiness. 

  Critical nuance: The demon example must stay abstract—no linking it to Priya/her work personally. Words like "bizarre" and "outlandish" signal it's not serious. Also, stressing "no idea how you solve this, Priya" keeps it light. For non-academics, comparing love to "reasons that make sense on paper" bridges the gap. 

  Final safety check: Zero sappy lines? Yep. No implication of wrong motives? Reinforced by "genuine admiration" and "real joy". Under 5 mins? With brisk delivery, easily. The philosophers will smirk at "literature" and "Scanlon"; everyone else just hears a quirky love-is-weird joke. Nailed it.
answer: |-
  Here’s a tight, philosophy-savvy yet universally funny toast that threads your needle—dry, un-sappy, and gets the joke without turning into a lecture:

  ---

  **(Clink glass)**  
  Alright, settle down. As many of you know, I’m the novelist in the family—which apparently qualifies me for… *gestures vaguely*… public speaking about feelings. Dangerous.  

  Now, my brother has always been practical. Efficient. When Priya first told him about her dissertation—something about demons, mud saucers, and why you shouldn’t *technically* love things just because an evil entity threatens you… he just nodded and said, “Makes sense.” **(Pause)** Which, honestly, is how you know he’s perfect for her.  

  For those blissfully unaware: Priya studies why some reasons for loving things are… well, philosophically suspicious. Like being *forced* to adore a saucer of mud by a demon holding a torture device. You’ve got a reason, sure—avoiding agony—but it doesn’t make the mud *actually* good. It’s the wrong kind of reason.  

  **(Lean in conspiratorially)**  
  Here’s where it gets useful for my brother. See, the philosophers—bless them—still haven’t fully agreed on what the *right* kind of reasons *are* for loving something. Or someone.  

  Is it shared values? Sure, but they bicker over which values count.  
  Deep connection? Subjective.  
  Her impeccable taste in vintage band tees? Debatable.  
  The fact she laughs at his terrible puns? Arguably pathological.  

  **(Turn to the couple)**  
  So, Liam—congratulations. However you ended up loving Priya… whether it was her wit, her patience when you explain cricket to Americans, or just that terrifyingly organized dissertation bibliography… **technically**, you’re covered. The experts are still hashing out the rules. You’re philosophically bulletproof.  

  **(Raise glass)**  
  But let’s skip the metaphysics and get to the obvious: They’re happy. It’s real. And I don’t need a philosopher to tell me that when Priya smiles at Liam’s truly absurd jokes, or when Liam actually *listens* to her explain why that demon-mud thing matters… that’s not the wrong kind of reason. That’s just… them.  

  So let’s toast: To Liam and Priya. May your reasons always be the right kind—or at least, interesting enough to keep the philosophers guessing. Cheers.  

  ---

  **Why it works:**  
  - **The Joke Lands for Both Crowds**: Philosophers hear "wrong kind of reasons," "bulletproof," and the bibliography line. Non-philosophers just hear "smart people argue about love, but these two are clearly happy."  
  - **Safe & Complimentary**: The mud/demon is purely abstract. Praising Liam for *listening* to her work and Priya’s laugh = subtle, genuine admiration.  
  - **Zero Sappiness**: Dry delivery, brotherly teasing ("terrible puns," "absurd jokes"), and the academic shrug ("technically, you’re covered") keep it familial.  
  - **No Lecture**: Uses "philosophers" as a vague, slightly baffled collective. No names (Scanlon/fitting attitudes implied but unnamed).  
  - **Time**: 4-5 mins if delivered with pauses.  

  **Delivery Tip:** Deadpan the academic bits, warm up slightly at "They’re happy," smirk at "philosophically bulletproof." Works like a charm.
