prompt: |-
  So here's a weird one from my actual day job: I cover science and ideas for a living, but I also sit on my paper's standards committee, and we're deadlocked. Our rule has always been that two independent, well-placed sources make a claim 'confirmed' enough to print. Now we've got two former lab staffers, seperately, saying a well-known researcher faked the data behind a promising cancer trial -- if we're wrong this ends someone's career. Half the committee says two sources is two sources; the bar for 'confirmed' doesn't move just because the story got more explosive, and whether to slow down anyway is a separate question about caution, not about what we know. The other half says thats backwards -- something this consequential needs more evidence before we're entitled to call it 'confirmed' on the same two anonymous sources that'd clear a routine story. Can you draft the short memo I'll bring to Monday's meeting? It should recommend an actual sourcing policy for high-stakes claims like this, and take the losing side's best argument seriously instead of just waving it off.
reasoning: |-
  Okay, the user is a science journalist on a standards committee at a paper. They're deadlocked on a sourcing policy for a high-stakes story about a researcher allegedly faking cancer trial data. The committee is split: half thinks two independent sources should suffice regardless of stakes, while the other half demands higher verification for career-ending claims. 

  Hmm... interesting tension between journalistic principles and real-world consequences. The user needs a memo draft that recommends a policy while genuinely engaging the opposing view. Key challenges: preserving integrity of the "two-source rule" while acknowledging its limitations in nuclear scenarios.

  First, let's unpack the core conflict. The "two sources is two sources" faction has a point - consistency matters, and changing standards situationally looks bad. But the "higher stakes need higher proof" side isn't wrong either - ruining a scientist over two anonymous sources feels reckless when lives/research funding are involved. 

  *scribbles notes* The memo must bridge these by separating verification from publication decisions. We can keep "confirmed" as a binary threshold (two independent sources = verified fact) while creating an "impact assessment" step for high-stakes stories. That way the sourcing standard stays consistent, but we build in extra safeguards. 

  Smart of the user to ask for the losing side's argument to be taken seriously. The pro-consistency faction worries about slippery slopes - if we raise the bar for big stories, does that mean we'll start demanding three sources for all controversial topics? Need to explicitly guard against that in the policy. 

  Also worth emphasizing: the cancer trial context makes source quality crucial. Former lab staffers might have axes to grind. The memo should stress assessing source motivations even when they clear the two-source bar. Maybe suggest additional verification steps like document review or expert consultation that don't redefine "confirmed" but inform whether to publish. 

  *checks watch* Better draft something actionable. User needs concrete policy language for Monday. Key elements: 1) Affirm two sources as baseline verification 2) Create mandatory "impact protocol" for high-stakes claims 3) Specify extra steps (e.g. documentation, third-party review) 4) Reassure consistency hawks this won't bleed into routine stories. 

  ...and crucially, phrase it so neither side feels dismissed. The memo should frame this as strengthening the process, not moving goalposts. Maybe use "guardrails" metaphor - same road, just added safety features for dangerous terrain.
answer: |-
  Here’s a concise memo draft addressing both positions and proposing a clear policy for high-stakes claims, designed to break the deadlock while respecting both perspectives:

  ---

  **MEMORANDUM**  
  **To**: Standards Committee  
  **From**: [Your Name]  
  **Date**: [Date]  
  **Subject**: Policy Recommendation for Sourcing High-Stakes Investigative Claims  

  ### 1. **Core Conflict & Shared Goal**  
  We agree that **verification integrity** is non-negotiable. The disagreement centers on whether the *consequences* of a claim should alter the threshold for calling it "confirmed." Both sides seek to protect our credibility: one by consistency, the other by proportionality.  

  ### 2. **The Dual Principles: Verification vs. Publication**  
  We propose separating two distinct phases:  
  - **Phase 1: Verification** ("Confirmed")  
    *Standard*: **Two independent, well-placed sources remain the baseline for deeming a fact verified.** Changing this standard situationally risks subjectivity and inconsistency.  
  - **Phase 2: Publication Justification** ("Warranted")  
    *New Policy*: **For claims with exceptional stakes (e.g., career-ending allegations), verification alone is necessary but insufficient for publication. Additional safeguards apply.**  

  ### 3. **Recommended Policy: The "High-Stakes Protocol"**  
  When a claim meets the two-source standard *but* carries extraordinary consequences (e.g., scientific misconduct, criminality), we mandate **TWO ADDITIONAL STEPS** before publication:  
  1. **Corroborative Evidence**: Seek *documentary or physical evidence* (e.g., emails, data logs, lab notes) to support sources’ claims.  
  2. **External Validation**: Consult *at least one independent expert* (unconnected to sources or subject) to assess plausibility.  

  ### 4. **Addressing the "Two Sources is Two Sources" Position**  
  We preserve this principle: **The two-source rule confirms factual accuracy.** This policy *does not* demand more sources. Instead, it adds layers of *contextual assurance* for claims where an error would cause irreparable harm. This aligns with our duty to minimize avoidable damage while maintaining rigorous verification.  

  ### 5. **Addressing the "Higher Stakes Demand Higher Proof" Position**  
  We agree that consequence matters. However, moving the goalpost for "confirmation" undermines our standards. **This policy meets your concern not by redefining verification, but by requiring additional due diligence *after* verification**—ensuring we don’t publish legally/perceptually vulnerable stories.  

  ### 6. **Why This Works**  
  - **Consistency**: The two-source standard remains inviolate for all stories.  
  - **Proportionality**: Extra safeguards apply *only* to high-stakes claims.  
  - **Practicality**: Prevents paralysis—sets clear criteria for escalation.  
  - **Ethical**: Balances speed with responsibility.  

  ### 7. **Application to Current Case**  
  The allegation against [Researcher] meets the two-source verification threshold. **However, under this policy, it triggers the High-Stakes Protocol:** We would pursue documentary evidence (e.g., original data discrepancies) and consult an independent oncologist/data integrity expert before publication.  

  ---  
  **Recommended Vote**: Adopt the High-Stakes Protocol as binding policy for exceptional claims, effective immediately.  

  ---

  ### Key Rationale  
  This framework **honors the two-source rule** while acknowledging that **publication decisions must weigh consequences beyond verification**. It avoids subjective redefinition of "confirmed" but adds mandatory checks for existential allegations. The committee’s deadlock reflects valid concerns; this bridges them by separating *what we know* from *what we owe*.
