  We are ranking replies to Galen Strawson's Basic Argument against moral responsibility. The argument claims that moral responsibility requires being the ultimate cause of oneself, which leads to an infinite regress or an arbitrary starting point, making responsibility impossible.

  The key criterion is how directly each reply engages and defuses the regress itself (as opposed to redefining responsibility, changing the subject, or conceding).

  Let's evaluate each reply:

  1. **P. F. Strawson (reactive attitudes naturalism)**: This approach shifts the focus from metaphysical conditions of responsibility to our natural reactive attitudes (resentment, gratitude, etc.). It doesn't directly address the regress but argues that responsibility is embedded in our social practices. This changes the subject by redefining responsibility in terms of social practices, so it does not block the regress.

  2. **Fischer and Ravizza (semi-compatibilism, guidance control)**: They argue that moral responsibility requires guidance control (which depends on the mechanism of action being responsive to reasons) but not necessarily regulative control (the ability to do otherwise). This redefines responsibility by dropping the requirement for ultimate control, so it does not directly engage the regress.

  3. **Frankfurt-style hierarchical mesh theories**: These theories (e.g., Frankfurt, Watson) claim that an agent is responsible if their actions are in line with their higher-order desires or values. This addresses identification but does not tackle the origin of those higher-order desires. The regress reappears when asking why the agent has those higher-order desires. So, it does not block the regress.

  4. **Robert Kane (event-causal libertarianism with self-forming actions)**: Kane posits self-forming actions (SFAs) that are undetermined and occur at moments of conflict, creating the agent's character. However, the regress still applies: why did the agent have the particular reasons or motives that led to the SFA? The SFA itself is not ultimately self-originated. This partially engages the regress but does not fully block it.

  5. **Agent-causal libertarianism (Chisholm/O'Connor)**: This view posits a substance (the agent) as a cause that is not determined by prior events. The agent is a prime mover. This directly addresses the regress by positing an uncaused cause (the agent) at the moment of choice. However, Strawson would argue that the agent's nature (which causes the action) is not chosen by the agent, leading to a regress about the agent's nature. But agent-causal theories claim the agent is not determined by prior states. On its own terms, it attempts to block the regress by introducing a non-event cause. This is a direct engagement, but it may not fully satisfy because the agent's existence and nature are still given.

  6. **Kant (distinction between empirical and intelligible character)**: Kant posits that we have an empirical character (determined) and an intelligible character (free and outside of time). The intelligible character is the noumenal self that chooses one's empirical character. This directly addresses the regress by positing a timeless, uncaused self. However, this is a metaphysical solution that may be seen as avoiding the regress by placing the self outside the chain of causes. It is a direct engagement but controversial.

  7. **Derk Pereboom (hard incompatibilism)**: Pereboom accepts that we lack free will and moral responsibility (because of the regress and determinism) and argues that we can live without them. This concedes the regress and changes the subject to practical consequences.

  8. **Dennett (demand for ultimate self-origination is incoherent)**: Dennett argues that the kind of ultimate self-origination Strawson requires is incoherent because it demands being causa sui (self-caused). He then redefines responsibility in a compatibilist way. This directly engages the regress by denying its coherence, but then offers a redefined notion of responsibility. So, it engages the regress but then redefines.

  9. **Susan Wolf (Reason View)**: Wolf argues that responsibility requires the ability to act in accordance with the True and the Good. This focuses on the agent's ability to recognize and act on reasons. It does not directly address the regress about the origin of the agent's abilities.

  10. **Buddhist no-self (anātman)**: This dissolves the self that the argument presupposes. Without a fixed self, the regress doesn't get off the ground because there is no enduring self to hold responsible. Actions arise from conditions, but there is no self that is the owner. This directly attacks the presupposition of a self, which is central to the regress.

