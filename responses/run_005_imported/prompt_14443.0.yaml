  The user wants a systematic analysis of the implications of scaling futarchy down. The three core concerns are: manipulation in a small, non-anonymous group, gameability of their satisfaction survey compared to GDP, and moral discomfort similar to the Policy Analysis Market controversy.

  Starting with manipulation and insider trading. In a small group where everyone knows each other, collusion might be easier. Members could form alliances to manipulate the market. For instance, if a subgroup wants a certain speaker, they might coordinate their bets to sway the market. However, because the group is small and meets often, social accountability could deter overt manipulation. If someone tries to corner the market, others might call them out. Also, the stakes are low, so the incentive to manipulate is reduced. But the lack of anonymity means traders might fear social backlash, which could either discourage participation or lead to biased betting to avoid conflict.

