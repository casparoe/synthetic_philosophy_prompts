answer: |-
  ## The Unsettling Shadow of Mercury: Why Old Evidence Haunts Bayesian Confirmation and What (If Anything) Can Be Done

  You've perfectly captured the jarring disconnect. The very example held aloft in rationalist circles as the epitome of Bayesian triumph – Einstein's GR explaining Mercury's anomalous precession – is simultaneously the poster child for a profound, unresolved challenge to the Bayesian framework: Clark Glymour's **Problem of Old Evidence**. This isn't a mere accounting glitch; it strikes at the heart of how Bayesian confirmation theory (BCT) conceptualizes evidence and belief revision. Let's dissect why it's a genuine problem, evaluate the proposed fixes, and arrive at a verdict.

  **Why It's a Genuine Problem, Not a Quirk:**

  The core Bayesian mechanism for confirmation is straightforward: Evidence *E* confirms hypothesis *H* relative to background knowledge *K* if the probability of *H* given *E* and *K* is greater than the probability of *H* given *K* alone: *P(H|E, K) > P(H|K)*. This hinges on the **likelihood ratio** *P(E|H, K)/P(E|K)* being greater than 1.

  The problem with *old evidence* (like Mercury's precession) arises from two key Bayesian commitments:

  1.  **Logical Omniscience & Certainty of Evidence:** BCT typically idealizes agents as logically omniscient and treats known evidence *E* as having a probability of 1 given background knowledge *K*. Once *E* is known and accepted, *P(E|K) = 1*.
  2.  **Conditionalization:** Rational belief update upon learning *E* (even if it was already known) involves conditionalizing: setting your new credence in *H* to your old conditional credence *P(H|E, K)*.

  **The Mercury Precession Anomaly (E)** was a well-established, uncontroversial fact of astronomy long before Einstein proposed GR (H) in 1915. Therefore:

  *   Before GR: *P(E|K) = 1* (Mercury's anomaly is known background knowledge).
  *   Introducing GR: To calculate *P(E|H, K)* – the probability of the anomaly *given* GR and background knowledge. Crucially, *K* already *contains E* (the anomaly). Therefore, *P(E|H, K)* must also equal 1. If *H* & *K* logically entail *E* (which they do, as *K* includes *E*), logical omniscience demands *P(E|H, K) = 1*.
  *   **The Fatal Ratio:** The likelihood ratio *P(E|H, K)/P(E|K) = 1 / 1 = 1*.
  *   **The Update:** Conditionalizing on *E* (which was already known and had *P(E|K)=1*) yields *P_new(H) = P_old(H|E, K)*. But since *P_old(H|E, K)* was defined *before* *H* was even conceived, it couldn't possibly reflect *H*'s ability to explain *E*! Furthermore, since the ratio is 1, *P_new(H) = P_old(H)*. **No confirmation occurs.**

  This is devastating. The paradigm case of evidence powerfully supporting a theory *vanishes* under strict, idealized Bayesian conditionalization. The problem isn't that scientists were irrational; it's that the *formal Bayesian model*, under its standard idealizations, cannot capture *why* the Mercury evidence was so compelling *for the new theory GR*. The evidence is epistemically inert within the model precisely *because* it's old and certain.

  **The Major Fixes and Their Costs:**

  Philosophers have proposed several strategies to rescue BCT. Here are the strongest contenders and their trade-offs:

  1.  **The Logical Learning Fix (Garber, Jeffrey, Niiniluoto):**
      *   **Core Idea:** Relax logical omniscience. The agent doesn't initially know the *logical relationship* between *H* and *E*. What's learned when GR is proposed isn't *E* itself (already known), but the **new proposition *L*: "H entails E"** (or perhaps "H explains E" or "H deductively/nomologically implies E").
      *   **How it Works:** The genuinely new evidence is *L*. The agent updates by conditionalizing on *L*: *P_new(H) = P_old(H|L)*. Crucially, *P_old(L)* might be low (it wasn't obvious *any* theory would explain Mercury so precisely), while *P_old(L|H)* might be high (if *H* is true, it's likely it entails known phenomena). This can yield *P_old(H|L) > P_old(H)*.
      *   **Strengths:** Intuitively captures the "Aha!" moment of seeing how *H* accounts for *E*. Preserves the core conditionalization machinery. Directly addresses the logical omniscience assumption.
      *   **Costs:**
          *   **What is *L* precisely?** Is it strict logical entailment? Nomological necessity? "Explains"? Defining *L* rigorously is tricky.
          *   **Degrees of Entailment:** Does *L* admit of degrees (e.g., *H* makes *E* very probable, not certain)? If so, it blurs into standard likelihoodism. If not, it struggles with evidence that *H* makes highly probable but not certain.
          *   **Prior for *L*:** Assigning *P_old(L)* seems arbitrary and detached from standard scientific reasoning. Did physicists really have a credence about whether a *future* theory would entail Mercury's precession?
          *   **Scope:** Primarily addresses cases of *deductive* confirmation like Mercury. Less clear for probabilistic evidence.

  2.  **The Counterfactual Credence Fix (Howson, Urbach, Sprenger):**
      *   **Core Idea:** Don't conditionalize on the actual old evidence *E*. Instead, imagine what your credence in *E* **would have been** *if you hadn't already known E* and *before considering H*. Calculate the Bayes factor using this hypothetical prior probability of *E*, *P*(*E*|~*K_E*), where ~*K_E* is background knowledge minus *E*.
      *   **How it Works:** In the hypothetical state of ignorance about *E*, *P*(*E*|~*K_E*) would likely be low (Mercury's orbit seemed anomalous, defying Newton). *P*(*E*|*H*, ~*K_E*) under GR would be 1 (or very high). The ratio *P*(*E*|*H*, ~*K_E*) / *P*(*E*|~*K_E*) >> 1, showing strong confirmation. We use this counterfactual ratio to justify updating our *actual* credence in *H*.
      *   **Strengths:** Directly mirrors the intuitive historical narrative: "Before GR, Mercury's orbit was puzzling (low P(E)); GR predicted/explained it perfectly (high P(E|H)); hence GR is confirmed." Captures the comparative explanatory power.
      *   **Costs:**
          *   **Metaphysical and Epistemic Baggage:** Defining and justifying the counterfactual state (~*K_E*) is problematic. What *exactly* is removed? How much background knowledge remains? Our judgments about *P*(*E*|~*K_E*) are highly subjective and hindsight-infected.
          *   **Formalizing the Update:** It's not strictly *conditionalization* on *actual* evidence anymore. It's using a counterfactual calculation to motivate a *revision* of belief. How is this formally integrated into the Bayesian model?
          *   **Arbitrariness:** Different ways of specifying ~*K_E* can yield different values for *P*(*E*|~*K_E*), leading to arbitrariness in the degree of confirmation.

  3.  **The Radical Reinterpretation / Skeptical Response (Glymour, Mayo, Bandyopadhyay):**
      *   **Core Idea:** The problem reveals a fundamental flaw in trying to reduce confirmation *solely* to probabilistic relations between *H* and *E* given *K*. The Mercury case was persuasive for reasons BCT inherently misses: the **absence of ad-hoc adjustments** in GR, its **explanatory unification** (tying gravity, space, time, *and* the anomaly into one framework), its **novel predictions** (light bending), its **mathematical elegance/necessity**. Confirmation involves assessing the *nature* of the fit between *H* and *E*, not just the probability.
      *   **Strengths:** Directly addresses the intuitive reasons scientists found Mercury so compelling for GR, reasons orthogonal to the probability of the evidence itself. Highlights non-Bayesian virtues like explanatory power, coherence, and fruitfulness.
      *   **Costs:**
          *   **Lack of Formal Precision:** While diagnosing the problem, it doesn't offer a single, rigorous *alternative* formal theory of confirmation as complete as BCT aspires to be. It often points towards more complex models (e.g., explanatory reasoning, severity testing).
          *   **Integration Challenge:** It doesn't necessarily *refute* Bayesianism but suggests it's incomplete. Integrating these other virtues into a formal system is difficult.

  **The Verdict: Counterfactuals as a Patch, But Confirmation Demands More**

  While reasonable philosophers disagree on the details, a clear verdict emerges: **Strict, idealized Bayesian conditionalization, with its commitments to logical omniscience and treating known evidence as certain, *cannot* account for the confirmatory power of old evidence like Mercury's precession for a new theory like GR.** The problem is deep and not merely computational.

  Among the fixes, the **Counterfactual Credence approach** offers the most intuitive and pragmatically useful resolution *within a broadly Bayesian framework*. It directly captures the core intuition that GR's power lay in its ability to *predict* or *necessitate* what was previously an unexplained anomaly. Despite its metaphysical and epistemic costs – the inherent subjectivity and difficulty in rigorously defining the counterfactual state – it provides a workable Bayesian *rationalization* for why scientists updated their beliefs as they did. It preserves the "prior times likelihood" structure, albeit in a hypothetical context. If we demand *some* Bayesian account of old evidence confirmation, this is the least bad option.

  However, embracing the counterfactual fix forces a crucial concession: **Bayesian conditionalization alone is *not* the whole story about evidential support, especially regarding old evidence.** The counterfactual move is an *extra*-Bayesian maneuver necessary to rescue the intuition. Furthermore, the Skeptical Response correctly identifies that the *persuasive force* of the Mercury example stemmed significantly from non-Bayesian virtues like explanatory unification and the absence of fudge factors – virtues the counterfactual Bayes factor only indirectly and imperfectly proxies.

  Therefore, the ultimate verdict is nuanced:

  1.  **Yes, Bayesian conditionalization *can* be patched** (primarily via the counterfactual credence approach) to formally represent the confirmation of new theories by old evidence, rescuing the intuition *within an expanded Bayesian formalism*.
  2.  **But, this patch reveals the limitations** of the core machinery. It requires significant, conceptually fraught additions (counterfactual reasoning) that move beyond strict conditionalization on *actual* knowledge states.
  3.  **Most importantly, the puzzle of old evidence demonstrates that credence-updating via conditionalization alone *cannot* be the whole story about evidential support.** The Mercury case's power relied on features like explanatory depth and theoretical coherence that are not reducible to, nor fully captured by, probabilistic relations alone. Bayesianism provides a powerful, often indispensable, toolkit for modeling aspects of belief revision, but it is not a complete epistemology of science. The ghost of Mercury reminds us that understanding why evidence supports a theory sometimes requires looking beyond the probability calculus to the structure of explanation and the character of the theory itself.
