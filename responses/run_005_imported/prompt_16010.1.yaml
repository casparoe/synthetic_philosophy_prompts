  Had a two hour argument with my roommate last night that started over whether I should believe her when she says she already fed the cat, and it spiraled into a whole debate about whether trusting what someone tells you is ever its own basic source of justification, or if it's always secretly parasitic on stuff you could in principle check yourself through perception, memory, induction, etc. She was defending the view that testimony is a baseline human faculty on par with perception, and you're entitled to trust it by default unless you have specific reason not to (I guess that makes her an "anti-reductionist"?). I think thats a cop-out, and that any warrant testimony gives you has to cash out in terms of your own track record of catching people being right or wrong before -- except then I got stuck bc that seems to imply little kids (and anyone talking to a total stranger) could never be justified believing what they're told, which feels wrong too. Neither of us budged. Write an essay that actually digs into the reductionism vs anti-reductionism debate about testimonial justification, deals honestly with the strongest objections on both sides (including the regress/circularity problem for reductionism and the "isn't that just licensed gullibility" problem for anti-reductionism), and then actually commits to a verdict instead of concluding "both sides have a point."
