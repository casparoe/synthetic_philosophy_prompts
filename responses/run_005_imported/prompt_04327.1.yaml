  This ranking emphasizes arguments with clear criteria (Goodman), art-world relevance (Danto/Dutton), and phenomenological weight (Benjamin/Lessing), while acknowledging the deflationary view as a necessary counterpoint. In your scene, let the historian champion Goodman/Danto (objective frameworks) and the forger weaponize the deflationary view/Lessing ("Originality is a myth invented by dealers!"). This creates dialectical tension without caricature.
