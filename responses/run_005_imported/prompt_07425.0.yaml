  ### Key Ranking Justification:
  - **Bird (S-tier)**: Wins on explanatory power by embedding necessity directly into property essences, avoiding brute primitives. Pays a high but arguably justifiable price via ontological revision.
  - **Maudlin (A-tier)**: Perfectly explains "oomph" by fiat but incurs a brute primitive cost. Ranks below Bird due to less integrated metaphysics.
  - **DTA (B-tier)**: Explains necessity cleanly but relies on unexplained necessitation + quidditism, creating circularity worries.
  - **Cartwright (C-tier)**: Explains localized necessity but pays an extreme price: surrendering universal laws altogether, which many find scientifically revisionary.
  - **Lewis (D-tier)**: Actively denies the target phenomena (no "oomph," weak counterfactuals), despite metaphysical parsimony.

  ### For Your Paper:
  Focus on the **necessity/explanatory power vs. metaphysical cost** axis. Anti-Humeans (Bird, Maudlin, DTA) buy "oomph" by positing extra metaphysics (dispositions/primitives/relations), but differ in how well they integrate it. Humeans (Lewis) avoid metaphysics but sacrifice explanatory power. Cartwright sidesteps the debate by rejecting universal laws. Bird’s S-rank shows that grounding necessity in *essences* is seen as less brute than DTA/Maudlin’s primitives, but all anti-Humean views face "why this necessity?" challenges.
