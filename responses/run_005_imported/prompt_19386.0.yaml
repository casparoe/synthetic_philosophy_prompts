     - This is correct. Aquinas does make this distinction in his Commentary on the Sentences and De Regno.

  2. **For the usurper:**
     - "resisting or removing him ... so a private person may licitly use force against him, especially where there's no public body able to act." 
       - This is mostly correct. Aquinas does say that a private individual can kill a usurper because the usurper is not a true ruler but a criminal. However, Aquinas also emphasizes that it is better if the public authority does it, but if not, a private person may.
     - Caveat: "this shouldn't be done from mere private presumption, since a botched attempt can easily make things worse" — This is a good point and correct.

  3. **For the legitimate ruler turned tyrant:**
     - The essay claims: "any private individual he wrongs keeps the natural right to resist him, and if necessary kill him in self-defense, exactly as one may resist any unjust aggressor"
       - **Here is a critical mistake.** Aquinas does NOT allow private individuals to kill a legitimate ruler who has become a tyrant. In his Commentary on the Sentences (Book II, Distinction 44, Question 2, Article 2), he explicitly says that a private person cannot kill a ruler, even if he is a tyrant, because the ruler is a public authority. Only the public authority (or someone appointed by it) can do so. For the legitimate tyrant, Aquinas says that the community as a whole (or the superior authority that appointed the ruler) must act. Private individuals may resist in self-defense if the tyrant attacks them, but they cannot kill the tyrant preemptively or as an act of rebellion. They can only use force to ward off an immediate attack (as in self-defense), but not to kill the tyrant as a punishment or to depose him.

     - The essay also says: "What Aquinas insists on isn't that private individuals lack a right to act here, only that they should exhaust legal and communal channels... before resorting to force."
       - This part is correct in that Aquinas insists on exhausting legal channels, but the previous statement about private individuals having the right to kill in self-defense is overstated. Aquinas allows self-defense against an unjust aggressor, but he does not extend that to killing a legitimate ruler (even if tyrannical) unless the ruler is personally attacking the individual at that moment. The key is that the killing must be in immediate self-defense, not as a political act.

  4. **Aquinas's pessimism about violent solutions:**
     - The essay states: "if no legal remedy is available, he thinks the community should fall back on patient endurance and prayer rather than rebellion"
       - This is correct. Aquinas does suggest that in some cases, enduring the tyranny and praying for deliverance is the better course, because rebellion might lead to worse outcomes or because the tyranny is a divine punishment for sin.

