answer: |-
  You've pinpointed the core pressure point of the argument from illusion and why disjunctivism feels counterintuitive initially. Disjunctivists like McDowell and Martin **do not deny that the oar *looks bent*.** That's the crucial starting point. Granting the phenomenal fact – the oar appears bent – is essential. Where they vehemently disagree is with the *inferences* drawn from this fact and the *assumptions* about the nature of experience that the argument relies upon.

  Here's what a disjunctivist *is* entitled to reject, even after granting the oar looks bent:

  1.  **The Phenomenal Principle:** This is the core target. The argument relies on a principle like: "If something appears to have property F, then *there is something* of which one is directly aware that actually *is* F." (e.g., "The oar appears bent, therefore there is something bent I'm aware of"). Disjunctivists reject this principle outright.
      *   **Their Claim:** The fact that the oar *looks* bent does *not* entail that there exists some mind-dependent, actually bent *object* (a sense-datum) that you are aware of. It only entails that you are having an *experience as of* a bent oar. The experience is real, but its object (the straight oar) is misperceived. The "bentness" is a property *of the experience* (how it presents the world), not a property *of an object* present in the experience. They deny the need for an *intermediary object* that possesses the property.

  2.  **The Common Kind Assumption:** The argument assumes that the fundamental nature of the experience in the illusory case (seeing the straight oar as bent) is the *same kind* of mental state or event as the experience in the veridical case (seeing a genuinely bent oar as bent, or seeing a straight oar out of water as straight). This is the assumption that disjunctivism is defined by rejecting.
      *   **Their Claim:** The veridical perception of a straight oar and the illusory perception of that same oar as bent are *metaphysically different kinds* of mental states, despite potentially sharing similar phenomenal character ("what it's like"). The veridical case is constitutively a state of *direct awareness of the mind-independent oar and its actual properties*. The illusory case is *not* an awareness of a bent object (sense-datum), but a *failure* to be directly aware of the straight oar *as it is* – it's a misleading presentation *of the straight oar itself* caused by abnormal conditions (refraction). The disjunctivist insists that the very nature of the experience – its metaphysical structure – differs: one is object-involving and factive (veridical), the other is not (non-veridical).

  3.  **The Inference to Sense-Data in Veridical Perception:** Even if one *were* forced to posit sense-data in the illusory case (which disjunctivists deny, per point 1), the argument infers that veridical perception must *also* involve sense-data because "it feels the same." Disjunctivists reject this inference based on their rejection of the Common Kind Assumption.
      *   **Their Claim:** If the veridical case is fundamentally a different *kind* of state (direct object-awareness), then its phenomenal character is explained by that direct relation to the object, *not* by the presence of an intermediary sense-datum. The "sameness of feel" is explained by the illusory case *failing* to match the veridical case, or by the illusory case being *indiscriminable* from the veridical case *for the subject*, **not** by both cases sharing an underlying common component (like a sense-datum). Martin, in particular, emphasizes the "epistemic" conception of hallucination: a hallucination is defined as an experience that is *subjectively indistinguishable* from a veridical perception *of a certain kind*. This definition *presupposes* the nature of the veridical perception it mimics, but doesn't imply they share a common metaphysical essence.

  4.  **The Characterization of "Direct Awareness":** The argument often assumes that "direct awareness" must mean awareness *immune to error* or *infallible*. Disjunctivists reject this. Direct awareness can be *fallible*.
      *   **Their Claim:** In the illusory case, you *are* directly aware of the straight oar itself, but under conditions that distort your perception of its properties. The awareness is direct (no intermediary object), but it is *non-veridical* – it misrepresents the property (straightness) of the very object (the oar) you are directly aware of. The "bent look" is a *misrepresentation* of the *actual object*, not an *accurate representation* of a *different* (sense-datum) object.

  **Reconstructing the Disjunctivist Response to the Oar Example:**

  1.  **Grant:** Yes, the half-submerged straight oar *looks bent*. This is a fact about the subject's experience.
  2.  **Deny (Phenomenal Principle):** This does *not* mean there exists an actually bent *thing* (sense-datum) that I am aware of. The "bentness" is how the experience *presents* the world, not a property of an object *in* the experience.
  3.  **Assert (Object-Directedness):** I am directly aware of the *actual, mind-independent, straight oar itself*, even in the illusion.
  4.  **Explain (Misrepresentation):** The abnormal conditions (light refraction in water) cause my perceptual system to *misrepresent* the property of the very object I am directly aware of. It presents the straight oar *as if* it were bent. The experience is *of* the straight oar, but *as* bent.
  5.  **Deny (Common Kind):** This illusory experience is a *fundamentally different kind of mental state* than veridically seeing a genuinely bent oar. The veridical perception is constitutively an awareness of the object and its actual bent property. The illusion is a failure to accurately represent the property of the object I'm directly aware of.
  6.  **Block the Inference:** Therefore, the structure of the illusory case (direct awareness + misrepresentation) tells us *nothing* about the need for sense-data in the veridical case. Veridical perception remains direct awareness of the mind-independent object and its properties.

  **What's "Left" for the Disjunctivist? The Core Moves:**

  *   **Rejecting the Phenomenal Principle:** Denying that appearance entails the existence of a corresponding *object* possessing the apparent property within experience.
  *   **Insisting on Object-Directedness:** Maintaining that perception (both veridical *and* non-veridical) is fundamentally relational – it's *of* mind-independent objects, even when erroneous.
  *   **Embracing Metaphysical Disjunctivism:** Asserting that veridical perceptions and subjectively indistinguishable illusions/hallucinations are *different fundamental kinds* of mental states. Veridical perception is constitutively object-involving; non-veridical experiences are not.
  *   **Explaining Similarity via Indiscriminability:** Accounting for the "same feel" by emphasizing that non-veridical experiences are *defined* by their inability to be subjectively distinguished from veridical ones, *not* by sharing a common component.

  The disjunctivist isn't being churlish about the appearance; they are being radically revisionary about the *metaphysics of experience* inferred *from* that appearance. They argue the argument from illusion only "settles" things empirically if you *already accept* the Phenomenal Principle and the Common Kind Assumption – assumptions they reject as philosophical mistakes, not empirical findings. The empirical fact is the appearance; the rest is philosophical interpretation.
