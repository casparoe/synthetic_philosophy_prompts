prompt: |-
  I've been a longtime lurker on LessWrong and the surrounding rationalist blogosphere, and one topic that keeps pulling me back in is the relationship between subjective credence and objective chance. It started, as these things often do, with an old thread arguing about the Sleeping Beauty problem, which sent me down a rabbit hole into David Lewis's Principal Principle: the idea that rational credence should defer to known objective chance, conditional only on evidence that is "admissible" (roughly, historical facts and facts about the chance-laws themselves, as opposed to anything that outruns what the chance process itself tells you).

  What I actually want help with is a more specific wrinkle that I don't think gets discussed much outside specialist philosophy-of-probability circles: the "undermining" problem. If chances supervene on the entire Humean mosaic, including events in the future relative to the chance event itself, then propositions about the far future can bear on what the chances were at any earlier time -- which threatens to make paradigmatically admissible historical evidence behave as though it weren't admissible after all, undercutting the clean deference the Principal Principle was supposed to secure. Lewis's own patch, worked out in "Humean Supervenience Debugged" and developed in parallel by Ned Hall and Michael Thau, has agents defer not to flat-out chance-propositions but to conditional chances given a complete theory of the world's chance-laws (often called the New Principle). I've never been sure whether this counts as a principled repair or a face-saving retreat, and I'd like to see the dispute actually argued out rather than summarized.

  Could you write me a dialogue between a committed Humean about chance, who thinks the New Principle rescues everything worth wanting from the original principle, and a primitivist about chance, who holds that objective chance is a basic, non-supervenient feature of the dynamical laws rather than a pattern in the mosaic, and who thinks the whole undermining episode shows that Humeanism was never entitled to the Principal Principle in the first place? I'd like both of them steelmanned as genuinely sharp, technically fluent philosophers rather than one being a foil for the other: the Humean should press the primitivist on what could possibly justify deferring credence to a brute, unanalyzed propensity if not the very functionalist story that Humeanism tells about chance, while the primitivist should press the Humean on whether the New Principle quietly gives up the idea that an agent could know what to believe about tomorrow's coin toss without first having views about the entire future history of the universe. Please write it as a real back-and-forth, in which each of them responds to what the other has just said rather than restating a prepared position, and let it end not with a resolution but with each side naming the one consideration that would actually change their mind.
reasoning: |-
  We are to write a dialogue between two philosophers: a Humean and a Primitivist about objective chance and the Principal Principle. The Humean defends the New Principle as a solution to the undermining problem. The Primitivist argues that Humeanism cannot ground the original Principal Principle and that the New Principle is a retreat. The dialogue should be a back-and-forth, with each responding to the other, and end with each naming one consideration that would change their mind.

  Characters:
  - Humean (H): Committed to Humean supervenience of chance on the entire pattern of events (the Humean mosaic). Defends the New Principle.
  - Primitivist (P): Believes chance is a primitive feature of dynamical laws, not supervenient on the mosaic. Criticizes Humeanism for the undermining problem.

  Setting: A philosophy conference during a coffee break.

  Dialogue:

  H: Look, I know you think the undermining problem is a death knell for Humeanism, but I see the New Principle as a refinement that actually strengthens our account. We still have deference to chance, but now it's conditional on the complete chance theory. That's not a retreat; it's just being precise about what we're deferring to.

  P: But that's exactly the problem! The original Principal Principle was elegant: if you know the chance of A is x, and you have no inadmissible evidence, then your credence in A should be x. Now, under the New Principle, I can't set my credence about a simple coin flip without first knowing the complete chance theory T, which on your Humean view depends on the entire mosaic, including the future. That seems to give up the idea that I can have rational beliefs about local events without omniscience about the global pattern.

  H: I see why you say that, but let me push back. First, the New Principle doesn't require omniscience about T. In practice, we often have good evidence about the chance theory. For instance, in the coin flip case, I have a lot of background knowledge about coins and their typical behavior, which gives me a high credence in a particular T that says the chance of heads is 0.5. So my credence in heads is still approximately 0.5. The point is that the New Principle handles the edge cases correctly, like when the entire future might undermine the chance assignment.

  P: But that's just it: the edge cases reveal the flaw. On your view, the chance of an event is determined by the entire mosaic. So, for example, if by some fluke a fair coin in fact lands heads an enormous number of times in a row, then the chance of heads on any particular toss might not be 0.5, because the pattern of outcomes is part of what makes the chance what it is. So even if I have all the historical evidence, I can't set my credence to 0.5 without knowing that the future doesn't contain such a fluke. That seems absurd! In reality, we don't think the fairness of a coin depends on future outcomes.

  H: But we do think that if the coin lands heads a billion times in a row, that is evidence that the coin isn't fair! That's just standard statistical reasoning. The Humean account captures that: the chance is whatever pattern best systematizes the mosaic. If the mosaic includes a billion heads, then the best system might assign a high chance to heads, and that's correct.

  P: But that's not the same. In standard statistics, we have a model (e.g., independent tosses with fixed p) and we update based on data. The chance is a parameter of the model, and it's fixed. On your view, the chance itself is changing because the model is being re-evaluated based on new data. But for the agent at the time of the toss, the chance is supposed to be an objective feature of the world then and there. The undermining problem shows that on Humeanism, the chance at t depends on facts about the future, which the agent at t cannot know. So the agent cannot know the chance at t without knowing the future! That's why the Principal Principle fails.

  H: Not so fast. The New Principle avoids this by conditioning on the chance theory T. The chance at t is still an objective feature at t, but it is defined by the entire mosaic. However, the agent doesn't need to know the entire mosaic; they just need to have credences about T. The New Principle says: your credence in A should equal the chance of A given T (and your evidence). Since T is a proposition about the entire mosaic, it includes the future. But note: the chance conditional on T is well-defined and doesn't depend on the future in the same way. In fact, conditional on T, the chance of A is fixed by T.

  P: But now you've shifted the deference. Instead of deferring to the chance of A, you're deferring to the conditional chance of A given T. And what is that? It's the chance of A in worlds where T is true. But T is a theory about the entire mosaic, so in those worlds, the chance of A is whatever T says it is. So effectively, you're deferring to T's prediction about A. But then why call it "chance" at all? It seems you've reduced chance to a description of the pattern, and the New Principle is just telling us to use the best pattern we have. But that's just good epistemic practice, not deference to an objective modal feature.

  H: That's the Humean story! Chance is a pattern in the mosaic, and it's objective because it's the pattern that best balances simplicity and fit. And we should defer to it because it's the best guide to the future. The functional role of chance is to be that guide. So the New Principle is exactly what you want: it tells you to use the best guide. And note, the conditional chance given T is still an objective chance: it's the chance function that T says is actual.

  P: But now we're back to the beginning. The functional role you describe is exactly what the primitivist thinks is inadequate. We want chance to be a guide to the future because it's a real, irreducible feature of the present. It's not just a summary of the pattern. For example, in quantum mechanics, the chance of a radioactive decay is a fundamental dynamical feature. It doesn't depend on how many decays happen in the future. On your view, if by some fluke a radioactive atom has a very long half-life (so it doesn't decay for a long time), that might change the chance of decay at earlier times? That seems to get the metaphysics backwards.

  H: But in quantum mechanics, the chance is fixed by the laws. And on Humeanism, the laws are part of the best system. So if the actual mosaic includes a particular pattern of decays, the best system will say the chance is such-and-such. And it won't change over time in the way you suggest because the pattern is fixed. The chance at t is fixed by the entire pattern, but that doesn't mean it changes with new events; it's just that the entire pattern is what it is. The agent at t doesn't know the entire pattern, so they have uncertainty about what the chance is. That's why we condition on T.

  P: But then the chance at t is not a local feature. It's a global feature. And that's the rub: we want chance to be local. We want the chance of the decay at t to depend only on the state of the system at t, not on what happens later. Your Humean chance doesn't do that. So it fails to capture the idea that chance is a cause of events, or at least a direct influence.

  H: I don't think chance needs to be a cause. It's a guide. And the Humean guide is the best one. But let me ask you: if chance is primitive, what justifies the Principal Principle? Why should I set my credence to the primitive chance? What connects this primitive propensity to what actually happens?

  P: The connection is built into the concept of chance. Chance just is that thing which, if you know it, you should set your credence to it (absent inadmissible evidence). That's the functional role that defines chance. And it's primitive, so it doesn't need a reduction.

  H: But that seems circular. How do we know that the primitive chance is a good guide? If it weren't, why would we defer to it?

  P: It's not circular. We can observe that when we set our credences to the chances, we do well in the long run. But more deeply, it's a conceptual truth about chance that it constrains rational credence. That's what makes it chance rather than something else.

  H: But without a reductive story, I don't see how you avoid the charge that primitive chance is mysterious. How does this propensity actually influence events? And if it doesn't, why defer?

  P: It's not that it influences events in a causal sense; it's a fundamental feature of reality that certain events have a certain objective probability. And we defer because that's what rationality requires when facing uncertain events. The Humean, however, cannot explain why we should defer to the chance pattern without already assuming that patterns are a good guide, which is exactly what's at issue.

  H: But we have a track record: science uses patterns to predict, and it works. The Humean grounds chance in that practice. You, on the other hand, are positing a primitive modal fact that doesn't supervene on the actual events. How do you even know what the chance is? How can we measure it?

  P: We measure chance by repeated trials, but that's epistemic. The chance itself is a single-case propensity. And it's not that it doesn't supervene; it's part of the fundamental laws. The laws supervene on the whole universe, but in a way that is not reducible to the mosaic. They are an additional layer.

  H: But then you're a dualist about the mosaic and the laws? That seems ontologically extravagant. Humeanism is more parsimonious.

  P: Perhaps, but it doesn't deliver the goods. The undermining problem shows that it can't deliver the Principal Principle without the New Principle, and the New Principle requires knowing the entire chance theory, which is too demanding.

  H: But we don't require knowing T with certainty. We have credences over T, and we update. So in practice, it's manageable.

  P: Still, it's a retreat from the original idea. And it shows that Humean chance is not the thing we thought it was.

  H: And your primitive chance is mysterious and unexplanatory.

  [After a pause, they agree to end with the consideration that would change their mind.]

  H: I'll tell you what would make me abandon Humeanism: if it could be shown that the best system analysis cannot recover the chances we take to be objective, for example, if it turned out that there are multiple equally good systems that assign very different chances to the same events. Then the objectivity of chance would be lost.

  P: And I would abandon primitivism if someone could show that the Principal Principle can be derived from purely non-modal facts about the world, without any primitive chance. That would make Humeanism more attractive.

  H: Fair enough. But I don't think that's going to happen.

  P: Likewise, I think we're at an impasse. But it's been a good discussion.
answer: |-
  ### Dialogue: The Undermining Problem and the Fate of the Principal Principle

  **Characters:**
  - **Humean (H):** Committed to Humean supervenience; defends the New Principle as a robust solution to undermining. Believes chance is a pattern in the "Humean mosaic" (the total history of particular events).
  - **Primitivist (P):** Holds that chance is a fundamental, non-supervenient feature of dynamical laws; argues Humeanism cannot ground rational deference without smuggling in primitivism.

  **Setting:** A quiet corner of a philosophy conference coffee lounge. Papers on probability theory litter the table between them.

  ---

  **Humean (H):** I’ve been thinking about your critique of the New Principle. You call it a "retreat," but I see it as a necessary refinement. The original Principal Principle—that rational credence should equal known objective chance, barring inadmissible evidence—was elegant, but it broke down when we realized that chances supervene on the entire mosaic. The New Principle fixes that by having agents defer to *conditional* chances given the complete chance-theory *T*. It’s not a surrender; it’s precision engineering. After all, *T* encodes the chance-laws, so conditioning on it screens off future-undermining worries. Rational deference is intact.

  **Primitivist (P):** Intact? Hardly. You’ve swapped a simple, actionable norm for one that’s epistemically impossible. On your view, to set my credence for a coin flip tomorrow, I need *T*—a theory that depends on the entire mosaic, including the future. But I can’t know *T* without knowing the future! So now, rational belief about a local event requires global omniscience. That’s not deference; it’s paralysis. Whereas on my view, chance is primitive—a basic, local dynamical feature—so I can know the chance *now* and defer *now*, without peeking at the future.

  **H:** Ah, but you’re conflating metaphysics with epistemology. *T* isn’t a crystal ball; it’s a hypothesis. In practice, I have high credence in a *T* that fits my evidence—e.g., "coins are fair." So my credence for heads is still 0.5, same as yours. The New Principle handles the undermining edge cases (like freak future sequences "retroactively" altering chances) without changing everyday judgments. Your primitivism avoids undermining only by *stipulating* that chances are local—but that’s question-begging. *Why* should we think chance is local? Humeanism explains it: chances summarize patterns, and patterns can be local.

  **P:** Patterns? Let’s press that. Suppose I’m deciding whether to bet on a quantum decay event. For you, the chance supervenes on the entire history, including future decays. But in the lab, I have all admissible evidence—the particle’s state, the law-equations—and I want to set credence equal to the primitive chance, say 0.3. Your Humean agent can’t do that. They must ask, "What’s the chance given *T*?" But *T* depends on whether *this* decay is part of a broader pattern that, say, makes the Humean best system assign a different chance. So your "chance" isn’t a fact about *this* event; it’s a fact about the cosmos. That’s not deference to objective chance; it’s deference to a description.

  **H:** Fair point, but you’re ignoring the functional role of chance. We *want* chance to be the best guide to the future. Humeanism delivers that: the best system’s chances maximize fit and simplicity, so deferring to them *works*. Your primitive chance—this irreducible "propensity"—doesn’t explain *why* it’s a good guide. It’s a metaphysical dangler. If I ask, "Why should I align my credence with this propensity?" your only answer is, "Because it’s chance." That’s circular. Humeanism breaks the circle: we defer because these patterns are empirically successful. The New Principle encodes that success.

  **P:** Success? Only because you’re lucky the mosaic is kind! But imagine a world where the mosaic is "unglued"—say, fair coins land heads 90% of the time by fluke. On Humeanism, the chance of heads *wasn’t* 0.5; it was 0.9, because the best system fits the data. Yet at the time of a flip, no one could know that. So your agent defers to 0.5 based on local evidence, but the "true" chance was 0.9. Deference fails! Whereas for me, chance is fixed by law: the flip had a 0.5 primitive chance, even if the future went wild. Your view conflates chance with *outcome*. That’s why you need the New Principle’s patch—to hide the fact that Humean chance isn’t really *objective* but *retrospective*.

  **H:** That’s uncharitable. The New Principle doesn’t "hide" anything; it respects the metaphysics. If the mosaic is genuinely chaotic, then (a) it’s improbable, and (b) the best system *should* reflect that, so chances *aren’t* 0.5. But crucially, conditional on *T*, the chance is sharp: if *T* says "fair coin," then chance of heads is 0.5, full stop. No undermining, because *T* fixes the chance-laws. Your primitivism, though—what justifies deferring to it? If chance is brute, why should my credence care? You can’t appeal to patterns without conceding my functionalism. All you have is intuition.

  **P:** Not just intuition. The Principal Principle *defines* chance. If something doesn’t constrain rational credence that way, it’s not chance. Your Humeanism can’t underwrite that constraint without the New Principle, which is a shell game. You say "defer to chance given *T*," but *T* is itself a huge proposition about the mosaic. So to defer, I need credences about *T*—which require credences about the future! Thus, I can’t form a rational belief about the coin without first having beliefs about the universe’s end. That’s a far cry from Lewis’s original idea that historical evidence is sufficient. My primitivism avoids this: chance is knowable from present laws, so deference is local and immediate.

  **H:** But your "knowable from present laws" assumes primitivism—it doesn’t argue for it. Humeanism, by contrast, explains why chance deserves deference: it’s the best informational tool. And the New Principle is how we wield it when we’re uncertain about the tool’s specifics. You’re right that it requires credences over *T*, but that’s just Bayesianism—we always have credences over theories. It doesn’t collapse into omniscience. Still, I’ll grant you this: if the New Principle demands *certainty* about *T*, it’s untenable. But it doesn’t. My credence for heads is the expectation of the chance of heads given *T*. That’s computable from my credence over *T*.

  **P:** Computable, but at the cost of locality. You’ve made chance global, so it can’t play its core role: guiding action in local uncertainty. And your "best informational tool" story presupposes that patterns *should* guide us—but that’s normative. Why *should* they? Only because we intuit that chances are trustworthy. But that intuition points to my primitivism! Humeanism borrows the normative force of chance while gutting its ontology. The undermining crisis proves it: you only reached the New Principle because you clung to the Principal Principle’s normative core, which Humeanism can’t ground.

  **H:** And your primitivism can’t ground why that normative core exists! You’re left saying, "Defer because it’s rational," but without explaining why a brute propensity should have rational sway. At least Humeanism demystifies it: patterns are projectable because they’ve worked before. But let’s step back. You think the New Principle is a retreat; I think it’s a discovery. We might be at an impasse. So, to shift gears: what would make you abandon primitivism? For me, I’ll tell you what would kill Humeanism.

  **P:** You first.

  **H:** If someone proved that the best-system analysis *cannot* recover stable chances—say, by showing that for any mosaic, there are multiple equally "best" systems with radically different chance assignments—then Humean chance isn’t objective. It’s just pragmatic. That would undermine the New Principle’s normative force, and I’d join you in primitivism. Your turn.

  **P:** Conversely, if someone derived the Principal Principle—flat credence-equals-chance—from purely non-modal, non-primitivist facts (e.g., from frequencies plus rationality constraints, without sneaking in propensities), I’d concede Humeanism works. But I don’t see how. The moment you tie chance to the mosaic’s totality, you lose the locality that makes deference rational. So I doubt it.

  **H:** And I doubt your primitivism can escape the "why defer?" challenge. But for now, let’s refill our coffee. The next talk on quantum probabilities starts soon.

  **P:** Agreed. I’ll need caffeine to survive more undermining.

  ---

  **End.**  
  *The dialogue ends unresolved, highlighting the core disagreement: the Humean sees the New Principle as a natural refinement within a functionalist framework, while the primitivist argues it exposes Humeanism’s inability to ground local deference. Each identifies a key falsifiable condition that would change their mind—instability in the best-system analysis for the Humean, a non-primitivist derivation of the Principal Principle for the primitivist.*
