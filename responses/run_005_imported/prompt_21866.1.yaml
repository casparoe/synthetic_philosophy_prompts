prompt: |-
  My cofounder and I started our company about four months ago, and lately we keep hitting a wall on stuff like how much runway we actually have and what our next-round valuation should be. He's deep into the rationalist blog world, and whenever we can't agree after a long back-and-forth, he pulls out Aumann's agreement theorem on me: since we're both rational, our priors should already line up, and now that we've both looked at the same spreadsheets, any leftover disagreement means one of us is lying or just broken somehow. Honestly it's gotten in my head a bit, because I don't feel dishonest, I just keep landing somewhere different than him on the numbers even after we talk it through. Is he actually applying that theorem right? Should I take our disagreement as a sign somethings wrong with one of us, or is he stretching it past what it really shows?
reasoning: |-
  Okay, let me unpack this founder's dilemma. They're four months into their startup and hitting walls on fundamental financial disagreements - runway calculations and next-round valuations. The cofounder keeps invoking Aumann's agreement theorem as a rhetorical weapon, suggesting their persistent disagreement implies irrationality or dishonesty. 

  First impression: This feels like a classic case of misapplying theoretical frameworks to messy real-world contexts. The founder's description of their cofounder being "deep into rationalist blogs" raises immediate flags about cargo cult rationality. I recall how Silicon Valley types sometimes fetishize these concepts without grasping their limitations.

  Hmm... the core tension here isn't actually about the theorem itself, but about power dynamics and communication breakdowns. The founder seems to be internalizing guilt ("it's gotten in my head"), which suggests the cofounder's approach is psychologically manipulative, whether intentional or not. That needs addressing before any technical discussion.

  Let me mentally walk through the theorem's actual conditions. Aumann requires perfectly rational actors with common priors - but human founders are neither. Their spreadsheets contain inherent judgment calls: growth projections involve market assumptions, runway estimates depend on burn rate interpretations. These are Bayesian priors in disguise! 

  *scribbles mentally* The real failure mode here is mistaking spreadsheet inputs for objective facts. When one founder assumes 20% monthly growth while the other expects 12%, that's not disagreement about data - it's divergent priors camouflaged as calculation errors. The cofounder's application of the theorem ignores this completely.

  *Pauses* What's unsaid but palpable is the emotional toll. The phrase "I don't feel dishonest" reveals how personal this has become. That's dangerous for an early-stage team. They need conflict resolution frameworks more than game theory right now - maybe something like Ray Dalio's idea meritocracy or radical transparency tools.

  Practical solutions forming... First, depersonalize the disagreements by externalizing assumptions. Instead of arguing outputs (valuation numbers), they should debate inputs: "What would need to be true for your growth projection to hold?" Second, introduce third-party perspectives - a fractional CFO could arbitrate spreadsheet disputes. Third... ah, they must separate epistemic humility from decision urgency. Some disagreements can persist while moving forward.

  Most importantly, the power dynamic needs rebalancing. The cofounder using theorem-as-trump-card indicates unhealthy discourse. Might suggest "disagreement protocols": when stuck, both write memos outlining reasoning chains before meeting. Forces clarity without browbeating.

  *Checks own biases* Am I being too harsh on the rationalist cofounder? Perhaps - his intent is probably optimizing for truth. But impact matters more than intent here. His approach is backfiring by creating self-doubt in his partner. That's antithetical to the collaboration startups require.

  Final thought: The meta-problem is prioritizing "being right" over "getting it right." Survival depends on the latter. Might reference Paul Graham's "How to Disagree" hierarchy - they're stuck at DH3 when they need DH6.
answer: |-
  You're describing a textbook case of misapplied rationality theory, and it's understandable why this is getting under your skin. **No, your cofounder is not applying Aumann's agreement theorem correctly, and using it as a cudgel in founder disagreements is both mathematically flawed and psychologically corrosive.** Here's why:

  ### Core Flaws in Your Cofounder's Application
  1. **"Rational Actors" Assumption is Fiction**: 
     Aumann's theorem requires **perfect rationality**—agents with identical reasoning capabilities, unlimited computing power, and flawless Bayesian updating. Humans (even rationalist bloggers) are cognitively limited, biased, and emotionally influenced. Founders under stress are *especially* not "perfect Bayesian reasoners."

  2. **Priors Are Never Truly "Common"**:
     Your "priors" (deep-seated assumptions) differ fundamentally. Your disagreement isn't about spreadsheets—it's about **interpretations**:
     - Is "runway" based on worst-case or optimistic sales forecasts?
     - Does "valuation" prioritize traction vs. market size vs. team potential?
     - What discount rate applies to future cash flows?
     These are subjective judgments, not objective facts. Your spreadsheets reflect these hidden priors.

  3. **Information Isn't Perfectly Shared**:
     Simply viewing the same spreadsheet ≠ common knowledge. **Mental models differ**:
     - You might see customer acquisition costs as unsustainable; he might see them as investable growth.
     - You might weight qualitative risks (e.g., churn patterns) differently.
     Aumann requires *all* information to be shared *and commonly understood*—impossible with complex financials.

  4. **"Lying or Broken" is a False Dichotomy**:
     The theorem **does not** imply dishonesty or irrationality in cases of persistent disagreement. Real-world reasons include:
     - Legitimate differences in risk tolerance
     - Expertise gaps (e.g., one understands cap tables better)
     - Values misalignment (e.g., "growth at all costs" vs. "sustainable bootstrapping")

  ### Why This Rhetoric is Damaging
  - **Creates Psychological Pressure**: Framing dissent as "irrationality" or "dishonesty" is manipulative and shuts down open debate.
  - **Ignores Founder Dynamics**: Startups require productive conflict. Forcing false consensus via theorem-shaming breeds resentment.
  - **Overlooks Empirical Reality**: Studies show diverse perspectives improve decision-making. Uniformity can be dangerous.

  ### How to Respond Constructively
  1. **Call Out the Misuse Directly**:
     > *"Aumann assumes perfect rationality and common priors—neither applies to us. Our disagreement stems from legitimately different judgments about uncertain futures. Calling that 'irrational' shuts down problem-solving."*

  2. **Surface Hidden Assumptions**: Create an "Assumptions Table":
     | Issue          | Your Assumption | His Assumption | Data/Evidence |
     |----------------|-----------------|----------------|--------------|
     | Runway Length  | 6 mo (conservative sales) | 10 mo (optimistic pipeline) | CRM data, conversion rates |
     | Next-Round Val | $5M (based on comps) | $8M (strategic premium) | Competitor funding data |

  3. **Introduce Decision-Making Frameworks**:
     - **Expected Value Calculations**: Assign probabilities to scenarios (e.g., "20% chance sales double, 50% chance linear growth").
     - **Pre-Mortems**: *"Assume we die in 6 months—why did it happen?"* Forces honest risk assessment.
     - **Third-Party Arbitration**: Engage a fractional CFO to audit models and break deadlocks.

  4. **Set Boundaries on "Rationalist" Rhetoric**:
     > *"Invoking theorems to dismiss my perspective isn't productive. Let's agree to: 1) Ban 'lying/broken' accusations, 2) Require evidence for assumptions, 3) Default to experiments when stuck (e.g., test pricing to resolve valuation debates)."*

  ### When Disagreement is Actually Valuable
  Your divergent perspectives likely reveal blind spots:
  - If he's overly optimistic on runway, you might be undercounting revenue opportunities.
  - If you're conservative on valuation, he might be spotting leverage you’re missing.

  **Healthy Next Step**: Commit to a "Disagreement Protocol":
  1. Document both positions with supporting evidence.
  2. Identify 1-2 quick experiments to test key assumptions (e.g., run a pricing survey to gauge willingness-to-pay).
  3. Set a deadline to reassess with new data.

  ### Bottom Line
  Disagreement isn't proof of irrationality—it's evidence you're grappling with genuine uncertainty. The fix isn't theoretical purity, but better processes to harness your combined insights. If your cofounder weaponizes rationality to override dissent, that’s a cultural red flag worth addressing now before it escalates. Founder alignment requires psychological safety, not rhetorical coercion.
