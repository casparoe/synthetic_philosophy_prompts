  ### Key Insights:
  1. **Pratyakṣa (perception)** emerged as epistemologically foundational, with no school denying its validity—only debating its scope.  
  2. **Anumāna (inference)** was contested only by radical empiricists (Cārvāka), while Nyāya successfully defended its necessity for transcending immediate perception.  
  3. **Śabda (testimony)** faced dual attacks: materialists rejected transcendent claims (e.g., Vedic authority), while Buddhists systematized its reduction to inference.  
  4. **Upamāna (comparison)** was the primary target for reductionism, with Vaiśeṣika/Sāṅkhya offering compelling parsimony arguments that Nyāya struggled to counter decisively.  

  Nyāya's defense typically emphasized unique cognitive outcomes (e.g., *upamāna* yields novel knowledge of analogical relations), but rivals prioritized ontological economy.
