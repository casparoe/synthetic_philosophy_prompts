      "pramana": "upamāna",
      "note": "Faced the strongest objections from Vaiśeṣika and Sāṅkhya, which deemed it reducible to perception + testimony (e.g., recognizing a gavaya via verbal description and sensory similarity, not a distinct cognitive process)."
