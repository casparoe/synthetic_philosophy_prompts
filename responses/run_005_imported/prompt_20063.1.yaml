prompt: |-
  I help maintain a mid-sized open-source project, and as it has grown, the maintainers have started debating whether to set up a more formal governance process, and if so, who should actually count as a voting "member": core contributors, anyone who has ever filed an issue, corporate sponsors who pay people to work on it, or downstream users who never touch the code but are heavily affected by our decisions. While reading around this question, I came across what political theorists call the boundary problem: the puzzle of how to justify the boundary of the demos — the group of people entitled to make a collective decision — which has to be settled before any question of how their votes get aggregated even arises. Two rival standards seem to be on offer: an all-affected-interests principle, under which anyone whose interests are shaped by a decision should get a say, and an all-subjected principle, which restricts the vote to those actually bound by the resulting rules; and, troublingly, there seems to be no way to choose between them, or to draw any boundary at all, without already presupposing some group entitled to do the choosing. Given this, please describe the most important implications of the boundary problem for how I should think about defining the electorate for governance decisions in a project like mine.
reasoning: |-
  Okay, the user is involved in maintaining a mid-sized open-source project and is facing the challenge of defining the electorate for governance decisions. They've come across the boundary problem in political theory, which questions how to justify who gets to be part of the decision-making group. The user mentioned two principles: the all-affected-interests principle and the all-subjected principle, and is struggling with how to choose between them without circular reasoning.

  First, I need to unpack the boundary problem's implications for their situation. The core issue is that any decision about who gets a vote presupposes a group that's already making that choice. In open-source projects, this is tricky because contributors, users, sponsors, and downstream users all have stakes. The user needs practical advice on navigating this philosophical dilemma in a technical setting.

  The user's explicit question is about the implications of the boundary problem for defining their electorate. But their deeper need might be finding a fair and sustainable governance model that avoids conflict and ensures project longevity. They might be worried about excluding important voices or giving too much control to certain groups, like corporate sponsors, which could lead to community dissatisfaction.

  Looking at the rival principles: the all-affected-interests principle includes anyone impacted by decisions, which could mean a vast, unmanageable group. The all-subjected principle limits it to those bound by the rules, like active contributors. The problem is neither is perfect, and choosing one might seem arbitrary without an existing demos.

  The user might not realize that the boundary problem highlights the need for an initial practical decision rather than a perfect solution. They need to accept that the starting point will involve some degree of convention or necessity. Emphasizing transparency and revisiting the decision later is key.

  Also, the user mentioned corporate sponsors and downstream users. Balancing influence between those who contribute labor (developers) and those affected by decisions (users, companies) is critical. Too broad an electorate might dilute core maintainers' efforts, too narrow might alienate the community.

  I should consider suggesting a tiered approach: core maintainers with voting rights, but with feedback mechanisms for wider groups. Precedents in other open-source projects like Apache's committer model or Rust's teams could serve as examples. The idea is to start with a manageable group that has proven commitment, then expand as needed.

  Another point is legitimacy. The initial group must be seen as legitimate by the broader community. Documenting the rationale and being open to evolution can help maintain trust. Processes like RFCs or community forums allow input without granting formal votes, addressing the all-affected principle partially.

  Finally, the user needs actionable steps: define criteria based on contribution levels, establish transparent processes, and plan for periodic reviews. Highlighting that governance is iterative and must adapt as the project grows is essential. They should avoid rigid structures early on but ensure the system can evolve with the project's needs.
answer: |-
  The boundary problem you've described is profoundly relevant to open-source governance, as it exposes the inherent tension between inclusivity and practicality. Here are the key implications for your project, distilled into actionable insights:

  ### 1. **Accept the Necessity of an Initial "Constitutive" Decision**
     - **Implication**: There is *no perfectly neutral starting point*. Your existing maintainers (as the de facto sovereign group) must make a provisional, defensible choice about membership criteria *before* formal governance can exist.
     - **Action**: Frame this as a temporary "constitutional convention." Document the rationale transparently (e.g., "We prioritize contributors to sustain velocity, but will review annually"). Treat the initial boundary as an experiment, not dogma.

  ### 2. **Practical Manageability Trumps Theoretical Perfection**
     - **The All-Affected Trap**: If applied literally, this could include every user, downstream project, and sponsor—making governance unwieldy or impossible.
     - **Action**: **Prioritize agency over impact**. Focus on those with *consistent skin in the game*:
       - **Core Contributors**: Actively shaping the project (e.g., 10+ PRs/year).
       - **Maintainers**: Already making decisions.
       - **Sponsor Representatives**: If funding sustains development, but cap corporate votes (e.g., 1 vote/sponsor regardless of financial contribution).

  ### 3. **Differentiate Between *Voice* and *Vote***
     - **Key Insight**: The boundary problem applies to *formal voting rights*, not influence mechanisms. You can honor "affected interests" without granting votes.
     - **Action**:
       - **Votes**: Restrict to those *subjected to rules* (All-Subjected Principle). E.g., contributors bound by code of conduct, contribution agreements, or release cycles.
       - **Voice**: Create structured input channels for others:
         - User advisory boards (for heavy users).
         - Sponsor liaison roles (non-voting).
         - Public RFCs for major changes (allowing issue-filers to comment).

  ### 4. **Legitimacy Depends on Consent of the Governed**
     - **Implication**: Excluded groups will accept boundaries if:
       - They trust the process is fair.
       - Alternative avenues exist to be heard.
       - They see the system as necessary for project health.
     - **Action**:
       - Publish governance drafts for community comment *before* ratification.
       - Require supermajorities (e.g., 75%) for governance changes.
       - Build sunset clauses (e.g., "This electorate definition auto-expires in 2 years").

  ### 5. **Dynamic Boundaries Beat Static Definitions**
     - **Problem**: Today’s contributor may leave; today’s user may become a core sponsor.
     - **Action**: Implement **renewable membership**:
       - Votes require active contribution (e.g., 1 PR/6 months to retain voting status).
       - Paths to join: e.g., 20 merged PRs + sponsor nomination → voting seat.
       - Retroactive inclusion: Past contributors become "members emeritus" with ceremonial roles but no votes.

  ### 6. **Mitigate Corporate Capture Without Excluding Sponsors**
     - **Risk**: Sponsors’ interests ≠ project health (e.g., pushing niche features).
     - **Action**: **Weighted representation**:
       - Individual contributors: 1 vote each.
       - Sponsor employees: Vote only if they contribute >20 hrs/week to *this* project.
       - Sponsor entities: Max 1 collective vote per sponsor (even if 5 employees contribute).

  ---

  ### Recommended Electorate Structure
  | **Group**               | **Voting?** | **Mechanism**                                  | **Rationale**                                       |
  |--------------------------|-------------|-----------------------------------------------|-----------------------------------------------------|
  | Active Maintainers       | Yes         | Direct vote on all proposals                  | Subjected to decisions daily; sustain development. |
  | Core Contributors        | Yes         | Vote after 12+ merged PRs; renewable yearly   | Proven investment; bound by project norms.         |
  | Corporate Sponsors       | Limited     | 1 collective vote per sponsor (if funding >$X/year) | Sustain resources; prevent dominance.              |
  | Major Downstream Users   | No          | Advisory council (e.g., Kubernetes SIG-style) | Capture "affected interests" without gridlock.     |
  | Community at Large       | No          | RFC comments, user surveys, issue feedback    | Broad input while preserving decisiveness.         |

  ---

  ### Why This Works
  - **Balances Principles**: The All-Subjected group (contributors) holds voting power, while All-Affected groups (users, sponsors) have formalized input channels.
  - **Prevents Entrenchment**: Renewable membership avoids "zombie voters" who left the project.
  - **Scales Legitimacy**: Sponsors get a voice but not control; users feel heard via RFCs.
  - **Adaptable**: Regular reviews allow boundary adjustments as the project evolves.

  **Final Guidance**: Start narrow (active contributors + maintainers) for efficiency, then expand deliberately based on pain points. Document *why* boundaries exist ("Without this, we cannot ship securely") and commit to revisiting them. The goal isn't to solve the boundary problem philosophically, but to build a system your community accepts as *reasonably fair and functional*.
