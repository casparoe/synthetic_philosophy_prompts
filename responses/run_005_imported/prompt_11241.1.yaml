  The tougher part is Theo's "sold his jet last week" gotcha. Here the temporal aspect matters—genuine repentance restores standing because it resolves the contradiction. The key is whether the critic still endorses the wrong through their actions. Current unrepentant hypocrisy shows ongoing endorsement; past reformed behavior shows rejection. 

  I should emphasize that caring about standing isn't about excusing wrongdoing but about effective moral persuasion. The user might also appreciate real-world stakes: if we ignore hypocrisy, we enable bad-faith actors to weaponize true claims while undermining collective trust. 

