prompt: |-
  Had a long, kind of heated argument with my friend Theo last night about hypocrisy, kicked off by that whole news story about a politician getting dragged for taking a private jet to a climate summit. Theo's whole position was that if the criticism is accurate, it doesn't matter one bit who's making it — pointing out that the accuser is themselves a hypocrite is just a deflection move, a way of switching the subject from "is this action bad" to "is the accuser annoying," and doesn't do any real philosophical work. I think that's wrong, and that hypocrisy can actually strip someone of their standing to make a charge even when the charge itself is completely true, but I kept fumbling the explanation and we basically just went in circles for an hour before giving up.

  So I want you to do the work I couldn't do on the spot: make the strongest, most careful case you can that hypocrisy voids or seriously weakens a person's standing to blame, without just falling back on "hypocrites are gross" or pure vibes. Specifically, engage directly with Theo's move instead of dodging it — explain why granting that hypocrisy doesn't make the original wrongdoing one bit less wrong (the "two wrongs don't make a right" point is obviously correct as far as it goes) still leaves open a totally separate question of whether the hypocrite gets to be the one making the charge, and why that second question is actually worth caring about rather than being a distraction.

  Then, if you can, settle something we couldn't: does it matter whether the hypocrite is currently and unrepentantly doing the very thing they're condemning, versus someone who used to do it and has genuinely cleaned up their act? Theo's gotcha was basically "so if the guy sold his jet last week he's suddenly allowed to complain about jets?" and I didn't have a clean answer for that one. I'd rather you actually pin down what "loosing standing" even amounts to here than just assert that it happens.
