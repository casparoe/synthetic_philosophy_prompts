prompt: |-
  I co-host a small philosophy-of-language podcast, and this topic stopped being purely academic for me this year when a committee member's offhand comment about Bradley's regress unsettled the formal-semantics dissertation I thought I'd nearly finished -- I had been treating propositions as structured tuples and could not answer why a tuple is anything more than a list dressed up as a fact, unless the very unity it's supposed to capture has already been smuggled in from outside; next week's guest is a philosopher known for arguing that propositions are unified because entertaining one just is performing a cognitive act of predicating a property of an object, not a matter of finding the right glue between pre-existing constituents. Draft eight interview questions that go beyond letting her restate that picture: I want at least one question on whether locating unity inside the act merely relocates Bradley's regress rather than dissolving it, one on whether the act-based picture really explains directionality -- why predicating loving of John and Mary in that order differs from predicating it of them in reverse -- any better than the relational theories it was meant to replace, and one on how the view accounts for propositions no one has ever entertained, such as necessary truths nobody has worked out or facts about a time before any minds existed, without quietly appealing to merely possible acts that collapse back into the ordinary structured propositions the theory was supposed to improve on -- and for each, a follow-up keyed to the answer she's most likely to give.
reasoning: |-
  Okay, let me approach this query methodically. The user is a philosophy podcast co-host facing a concrete problem - Bradley's regress derailed their dissertation on structured propositions, and they're interviewing an act-theorist next week. They need incisive questions that go beyond surface-level exposition, with three mandatory focus areas: whether act-theory truly avoids Bradley's regress, how it handles propositional directionality, and its account of unentertained propositions.

  First, I need to unpack the core tension. Bradley's regress challenges how constituents form unified wholes - if a proposition requires a relation to bind subject and predicate, what binds that relation? The guest's solution locates unity in cognitive acts rather than relational glue. But the user suspects this might just relocate the problem: what unifies the act itself? 

  For directionality, the classic example is "John loves Mary" vs "Mary loves John." Relational theories struggle to explain why order matters without infinite regress. The user wants to test if act-theory fares better or just hides the ordering problem in performance. 

  On unentertained propositions, the challenge is metaphysical: if propositions exist only through acts, how can truths precede minds? The user fears act-theorists might covertly rely on possible acts, which collapses into the structured entities they reject.

  I'll structure questions to pressure these points. For Bradley's regress relocation: start by inviting the guest to contrast her view with relational glue, then ask what prevents the act's components from needing their own unity. Likely reply: acts are primitive/unanalyzable. Follow-up: why is this not special pleading when relational glue wasn't allowed the same move?

  For directionality: ask how predicative acts encode order. Expected answer: mental directedness. Follow-up: isn't "directedness" just reintroducing relations? Then probe if the view implies a language-of-thought.

  For unentertained propositions: question how necessary truths or pre-cognitive facts exist. Anticipated reply: dispositions for acts. Follow-up: doesn't this make propositions dispositional properties, undermining their truth-bearer status? And are possible acts any less abstract than structures?

  Additional angles could include: how the theory handles complex propositions without syntactic structure, whether it reduces to psychologism about truth, and if it can accommodate shared content across thinkers. Each question should have a "likely reply" anticipation to sharpen the follow-up.

  The goal is forensic but collegial - exposing tensions while respecting the theory's motivations. I'll avoid gotcha questions, focusing on constructive dialectic that serves the podcast's academic audience.
answer: |-
  Here are eight interview questions with follow-ups designed to rigorously engage the core challenges of the act-based proposition theory, moving beyond restatement:

  1.  **Core Challenge (Bradley's Regress Relocation):** You argue that the unity of a proposition comes from the cognitive act of predicating a property of an object, not from some external 'glue' binding pre-existing constituents. But doesn't this merely relocate Bradley's regress? If the act itself involves components – say, an object-component, a property-component, and the predicative operation – what unifies *these* components into a single, non-list-like act? Isn't the problem of unity just pushed inside the act?
      *   **Likely Reply & Follow-Up:** *("The act is primitive; it's a basic cognitive operation, not composed of further 'components' needing unification.")* If the act is truly primitive and unanalyzable, how does this differ significantly from simply asserting that the *proposition* is primitive and unanalyzable? Doesn't this appeal to primitiveness risk being just as mysterious as the 'glue' you reject, especially when explaining the specific structure *within* the act (e.g., why *this* property is predicated of *that* object in *this* way)?

  2.  **Core Challenge (Directionality):** Relational theories of propositions notoriously struggle with explaining the directionality inherent in propositions like <John loves Mary> vs. <Mary loves John> – why the order matters without invoking an infinite regress of ordering relations. How does locating unity in the predicative act *genuinely solve* this problem? Specifically, what within the *act itself* fixes that I am predicating *loving* of the pair <John, Mary> *in the subject-object order* rather than the reverse?
      *   **Likely Reply & Follow-Up:** *("The act intrinsically possesses directionality; it's mentally 'pointing' the property at the object(s) in a specific way.")* Isn't characterizing the act as "pointing" or having intrinsic directionality functionally equivalent to positing an unanalyzable, non-relational ordering feature *within* the proposition itself? Does the act-based view then imply a kind of irreducible mental "arrow" or syntax, making it less ontologically economical than advertised compared to structured propositions with primitive combinatorial rules?

  3.  **Core Challenge (Unentertained Propositions - Timeless Truths):** Your view grounds propositions in actual cognitive acts of predication. How then do you account for the existence and truth of necessary propositions that have *never* been entertained by any mind? For example, complex mathematical truths discovered only recently, or perhaps some still undiscovered? If no one has ever performed the relevant predicative act, in what sense does the proposition exist to *be* true?
      *   **Likely Reply & Follow-Up:** *("Such propositions exist as *possible* acts – dispositions or capacities minds have to predicate in specific ways under certain conditions.")* Doesn't appealing to *merely possible* acts collapse the view? If the proposition *is* the possible act-type, haven't you just reified a structured *type* of cognitive event (e.g., 'predicating property P of object O') which looks suspiciously like the very structured, abstract entity (a type) your view aimed to replace, inheriting similar unity problems? How is this "possible act-type" fundamentally different from a Fregean thought or a structured tuple?

  4.  **Core Challenge (Unentertained Propositions - Pre-Cognitive Facts):** Similarly, how does the act-based view account for propositions about states of affairs that obtained *before any cognitive agents existed*? For instance, <The Chicxulub asteroid impacted Earth 66 million years ago>. If propositions depend on actual or possible acts of predication, but no acts were possible before minds evolved, how can this proposition be true *of that past time*?
      *   **Likely Reply & Follow-Up:** *("The proposition exists now (or whenever a mind *can* entertain it) as a possible act, and it *corresponds* to or is *made true by* the past state of affairs.")* This seems to separate the proposition (the possible act-type) from its truthmaker (the past event). But doesn't this reintroduce a problematic gap? If the proposition is the possible act-type existing *now*, what connects it *semantically* to that specific past event? How does the structure of the *possible act* manage to latch onto or represent that *particular* historical fact without relying on something like causal chains or abstract representation relations that the act-based view wanted to avoid by making propositions mental?

  5.  **Complexity & Structure:** How does the act-based view handle the internal structure of complex propositions, like negations, conjunctions, or quantifications (e.g., <Not all ravens are black> or <Someone loves everyone>)? Is the unity of such a proposition provided by a single, highly complex predicative act? Or is it composed of sub-acts? If composed, what unifies these sub-acts into the single propositional act, and how do you avoid a Bradley-style regress for the composition of acts?
      *   **Likely Reply & Follow-Up:** *("Complex propositions involve complex acts built from simpler predicative acts via logical operations performed by the mind.")* If the logical operations (negation, conjunction, quantification) are themselves cognitive acts that combine simpler acts, what unifies *that* higher-order act of combination with its constituent sub-acts? Doesn't this lead to a hierarchy of acts binding acts, recreating the regress at the level of mental operations?

  6.  **Objectivity & Intersubjectivity:** If a proposition *is* a cognitive act (or act-type), how do you ensure the objectivity of truth? Two thinkers performing distinct cognitive events (different neural firings, different phenomenological experiences) can both grasp and assert the *same* true proposition, say <Snow is white>. What makes their distinct acts instances of the *same* propositional type? Doesn't defining the type require abstracting over the particular acts, appealing to shared *content* or *structure*, which brings us back towards the abstract entities the view rejects?
      *   **Likely Reply & Follow-Up:** *("The acts are the same type if they predicate the same property of the same object(s) in the same way.")* Doesn't specifying "the same property" and "the same object(s)" presuppose an identity condition *for properties and objects* that exists independently of the acts? And doesn't "in the same way" implicitly rely on the kind of structural/directional identity your theory needs to explain without circularity? How is this criterion not parasitic on the very notions of abstract reference and structure it seeks to ground?

  7.  **Acts vs. Contents:** Critics might argue your view conflates the *act* of thinking (a psychological event) with the *content* thought about (the proposition). How do you sharply distinguish the predicative act (which is temporal, causally efficacious) from the proposition (which is the abstract, truth-bearing content of that act)? Doesn't dissolving this distinction risk a form of psychologism where truth becomes mind-dependent?
      *   **Likely Reply & Follow-Up:** *("The proposition just *is* the act-type; there is no separate abstract content. Truth is a property of the act-type when its predication corresponds to the world.")* If the proposition *is* the act-type, and truth is correspondence, doesn't this require the act-type itself to have representational properties? How does a *type of mental event* intrinsically possess representational content directed at specific objects and properties in the world? Isn't explaining this representational 'hook' precisely the hard problem that structured propositions (with their relations of reference/satisfaction) were designed to address?

  8.  **Explanatory Power:** Proponents of structured propositions argue they provide a clear compositional semantics: the reference/truth conditions of a complex proposition systematically depend on the referents/semantic values of its parts and their mode of combination. How does the act-based view match or exceed this explanatory power? Specifically, can you provide a rigorous account of how the truth conditions of, say, <John loves Mary> are determined solely by the nature of the predicative act performed, without implicitly relying on the semantic values of 'John', 'loves', and 'Mary' as independent components?
      *   **Likely Reply & Follow-Up:** *("The truth condition *is* defined by the act: the act is true iff the object (John) instantiates the property (loving Mary) that the act predicates of it.")* Doesn't this analysis covertly rely on the independent identity of John and the property *loving Mary*? How do we understand the complex property *loving Mary* without decomposing it, which would seem to require treating *Mary* as a component? If we *don't* decompose it, how do we account for the systematic contribution of *Mary* to the truth conditions without treating her as a constituent? Doesn't this show the act-based view still needs something like constituents and combination, just relocated into the property being predicated?

  **Key Principles Used:**

  *   **Pressure Points:** Targeting the core advertised advantages (solving unity/directionality) and known vulnerabilities (unentertained truths, complexity) of the act-based view.
  *   **Regress Relocation:** Explicitly framing the Bradley challenge as potentially reappearing *within* the act.
  *   **Directionality Specificity:** Focusing on the *how* of fixing order within the act.
  *   **Collapse Worry:** Highlighting the risk that possible acts reintroduce abstract types identical to structured propositions.
  *   **Truthmaker Gap:** Emphasizing the separation between the act (possible or actual) and the worldly fact for pre-cognitive truths.
  *   **Follow-Up Anticipation:** Predicting likely defenses (primitiveness, possible acts, correspondence, act-types) and immediately pressing on their internal tensions or circularities.
  *   **Comparative Challenge:** Asking how it improves on the theories it seeks to replace, especially on compositionality and objectivity.
  *   **Conflation Charge:** Forcing a distinction between the psychological act and the abstract content.

  These questions should foster a deep, critical, and productive discussion that moves significantly beyond a simple restatement of the act-theoretic position. Good luck with the interview!
