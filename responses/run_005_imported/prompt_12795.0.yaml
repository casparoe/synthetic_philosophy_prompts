  The founders and op-eds are simplifying the argument to "Wilt deserves it," but that's a misreading. They're injecting meritocratic desert into Nozick's framework, which he explicitly avoids. This conflation serves a rhetorical purpose: justifying wealth accumulation without addressing systemic issues or privilege. Silicon Valley's meritocracy talk likely leans on this misinterpretation to frame success as purely deserved, ignoring historical injustices or luck.

