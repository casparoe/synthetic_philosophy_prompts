answer: |-
  You've hit on a crucial tension that exposes a widespread misreading of Nozick – one that's incredibly relevant to your piece on Silicon Valley meritocracy. **You're absolutely right that the founders' "he deserves it" interpretation is a fundamental distortion of Nozick's actual argument.** Here's the breakdown:

  1.  **Nozick's Explicit Rejection of Desert:** You are correct. Nozick was deeply skeptical of desert-based arguments. He argues in *Anarchy, State, and Utopia* (ASU) that desert is incredibly difficult, if not impossible, to establish meaningfully. Why?
      *   **The Arbitrariness Problem:** How much of Wilt's talent is innate luck (genetics)? How much is due to upbringing, environment, or sheer chance? Can he truly *deserve* qualities he didn't choose?
      *   **The Social Contribution Problem:** Does Wilt's "desert" depend on the *value* society places on his skill? But that value is arbitrary and contingent. If society valued juggling more than basketball, a juggler might "deserve" millions instead. Desert tied to social valuation seems arbitrary.
      *   **The Undeserved Starting Point Problem:** Even if Wilt "deserves" his *marginal contribution*, does that account for the undeserved advantages or disadvantages of his starting position? Nozick thinks patterned theories (like those based on desert) founder on this.

  2.  **The *Real* Engine of the Wilt Chamberlain Argument: Liberty & Historical Entitlement:**
      Nozick's argument **doesn't rely on Wilt *deserving* the quarters at all.** It relies on two core principles of his Entitlement Theory:
      *   **Justice in Transfer:** If people come to possess holdings through voluntary transfers from others who are entitled to them, then the new possessor is entitled to them.
      *   **The Primacy of Liberty:** Individuals have the right to dispose of their justly held property as they wish, provided they don't violate others' rights.

      **How the Chamberlain Example *Actually* Works:**
      1.  **Start Justly:** Assume we have some initial distribution of holdings (D1) that everyone agrees is just *by whatever pattern you like* (equal, merit-based, need-based, etc.).
      2.  **Voluntary Action:** Millions of fans, each entitled to their holdings under D1, *freely choose* to transfer 25 cents of their money to Wilt Chamberlain in exchange for watching him play. This is a series of voluntary exchanges.
      3.  **New Distribution (D2):** This results in a new distribution (D2), where Wilt is rich and others have slightly less.
      4.  **The Key Question:** Can D2 be declared unjust *simply because it violates the original pattern* (e.g., equality, merit) that defined D1 as just?
      5.  **Nozick's Answer: NO.** Why?
          *   **D2 Arose Justly:** Every transfer was *voluntary* and involved people disposing of holdings they were entitled to under D1. Justice in transfer was satisfied.
          *   **Liberty Trumps Pattern:** To force the distribution *back* to D1 (or any other pattern) *after* these voluntary acts would require taking money from Wilt and the fans *against their will*. This violates their liberty – their right to use their justly held property as they choose.
          *   **The "Injustice" is the Redistribution:** The *only* injustice would be forcibly taking the money fans *chose* to give to Wilt and the money Wilt *received* voluntarily. The disruption of the pattern isn't the injustice; the *coercive redistribution* to *reimpose* the pattern *is* the injustice.

  3.  **Why Founders/SV/Opt-Eds Love "Desert" and Ignore Entitlement:**
      *   **Intuitive Appeal:** "He deserves it because he's talented/hardworking" is simple, emotionally resonant, and aligns perfectly with meritocratic narratives. It feels like a moral justification.
      *   **Ignoring the Starting Point:** Focusing on "desert" lets them sidestep the messy question of whether the *initial* holdings (D1) were just. In reality, D1 (inherited wealth, systemic advantages, historical injustices) is highly contested. Nozick *requires* D1 to be just for his argument to work – a point often glossed over.
      *   **Conflating Outcome with Process:** They confuse the *outcome* (Wilt is rich) with the *justification* for it. Nozick justifies the outcome *only* because of the *process* (voluntary transfers from a just starting point), *not* because Wilt intrinsically *deserves* wealth.
      *   **Rhetorical Power:** "He deserves it" is a powerful slogan. "His holdings arose through a series of just transfers from a presumptively just initial distribution, and redistributive taxation violates the liberty of those who voluntarily transferred holdings to him" is... less catchy.
      *   **Ignoring Rectification:** Nozick's Entitlement Theory has a third principle: **Justice in Rectification.** If the initial distribution (D1) *wasn't* just (e.g., due to past theft, fraud, injustice), then rectification *is* required *before* his transfer arguments fully apply. This is a massive caveat often ignored by those citing Chamberlain to oppose *all* redistribution.

  **Why Philosophers Avoid "Desert" When Explaining Chamberlain:**

  *   **Accuracy:** They are correctly interpreting Nozick. His argument is explicitly framed as an attack on *patterned* principles (which *include* desert-based patterns) using liberty and historical entitlement.
  *   **Nozick's Own Words:** Philosophers point directly to sections in ASU where Nozick dismantles desert arguments (e.g., pp. 213-231) and builds his entitlement theory as an alternative.
  *   **Focus on Mechanism:** The *power* of the Chamberlain example for philosophers lies precisely in its demonstration that *any* patterned principle (equality, utility, *or desert*) will be disrupted by voluntary exchanges, and that maintaining the pattern requires constant, liberty-violating interference. The mechanism is liberty + voluntary transfer, not desert.

  **Conclusion for Your Longread:**

  The founders are fundamentally misusing Nozick. **The Wilt Chamberlain argument is NOT proof that rare talents intrinsically "deserve" wealth. It is proof that voluntary transactions from a just starting point create new entitlements that liberty forbids us from forcibly rearranging to fit a prior pattern – *even if that pattern was based on desert*.**

  The Silicon Valley appeal to "desert" smuggled into the Chamberlain example reveals a key ideological move: **transforming Nozick's complex, liberty-based defense of existing holdings (which requires a just starting point) into a simplistic, meritocratic moral justification for outcomes.** This allows them to frame their wealth as the deserved reward for exceptional talent and effort, conveniently ignoring the role of luck, historical context, systemic advantages, and the critical question of whether the initial distribution *was* just. Highlighting this misreading exposes how "meritocracy talk" often relies on a philosophically shallow, self-serving interpretation of complex ideas.

  **Key Quote for Your Piece (from ASU, p. 158):** "The general point... is that no end-state principle or distributional patterned principle of justice can be continuously realized without continuous interference with people’s lives." **The enemy is the *pattern*, not the justification for it. Liberty disrupts patterns, including desert patterns.** Founders invoking "desert" within the Chamberlain argument are ironically undermining the very point Nozick was making.
