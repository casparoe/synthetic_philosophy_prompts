answer: |-
  Here's a comparative analysis of Lewis and Skyrms on conventions, addressing your specific questions and defending a verdict:

  ## Core Accounts

  1.  **David Lewis (Convention: A Philosophical Study):**
      *   **Focus:** Philosophical foundation of *meaning* and *normativity* in conventions (especially language).
      *   **Mechanism:** Conventions arise from solutions to pure coordination problems (multiple Nash equilibria where all are equally good, e.g., driving on the left vs. right). The *persistence* of a convention relies crucially on **common knowledge**.
      *   **Common Knowledge (CK):** Not just everyone *knows* the regularity exists, but everyone knows that everyone knows, everyone knows that everyone knows that everyone knows, and so on, ad infinitum. Crucially, CK encompasses:
          *   Conformity: Everyone (or almost everyone) conforms to R.
          *   Expectations: Everyone expects everyone else to conform to R.
          *   Conditional Preference: Everyone prefers to conform to R *on the condition* that others do (this is the coordination aspect).
          *   Arbitrariness: There's an alternative regularity R' that could have served just as well.
      *   **Explanatory Role of CK:** CK explains *why* the convention is stable and *why* individuals feel a normative pressure to conform ("I ought to drive on the right because I know *everyone else expects me to*, and I expect them to, and we all know this, and we all know there's an alternative that would have worked just as well"). It provides a reason for action grounded in mutual expectations.

  2.  **Brian Skyrms (The Stag Hunt, Signals, Evolution of the Social Contract):**
      *   **Focus:** Explaining the *emergence and stability* of conventions (including signalling) as *evolutionary* or *learning* phenomena.
      *   **Mechanism:** Uses evolutionary game theory (replicator dynamics, sexual selection) and reinforcement learning models. Agents interact repeatedly with simple behavioral rules (imitate success, reinforce successful strategies). Crucially, **no common knowledge, beliefs about beliefs, or high rationality is assumed.** Agents need only respond to local feedback (payoffs).
      *   **Process:** Starting from random behavior or simple heuristics, populations can reliably converge to stable conventions (like signaling systems) through purely mechanistic processes of differential replication or learning based on success/failure. The "arbitrariness" is captured by path-dependence or basin of attraction size in the dynamics.
      *   **Explanatory Role:** Shows *how* complex cooperative behaviors and communication systems can bootstrap themselves from simple beginnings through blind variation and selective retention. It explains the *existence* and *persistence* of the regularity mechanistically.

  ## Addressing Your Questions

  1.  **Does Skyrms's success show Lewis's CK clause was never doing real explanatory work?**
      *   **Verdict: Yes, Skyrms demonstrates that CK is *not necessary* for explaining the *emergence and persistence* of behavioral regularities that fit the functional description of conventions. However, it *does* leave out the *normative* dimension central to Lewis's philosophical project.**
      *   **Defense of Verdict:**
          *   **Explanatory Redundancy for Emergence/Persistence:** Skyrms provides robust, empirically plausible (and empirically validated in some learning contexts) models demonstrating that conventions *can* and *do* emerge and stabilize without any agent possessing beliefs about others' beliefs, let alone infinite regress. The regularity persists because it's self-reinforcing through the dynamics (e.g., conforming gets rewarded, deviating gets punished, signals that work get used). **This directly challenges the *necessity* of CK for explaining the *existence and stability* of the behavioral pattern.** Skyrms shows the *real explanatory work* for the regularity's persistence is done by the evolutionary/learning dynamics acting on payoffs and interactions, not by CK.
          *   **Leaving Out Normativity:** What Skyrms *doesn't* capture, and Lewis explicitly aims for, is the **normative force** inherent in conventions. Lewis's CK provides agents with a *reason* to conform: "I know you expect me to do this, and I know you know I expect you to do it, and we both know there's an equally good alternative, so I *should* do it to meet your expectations (and vice versa)." This creates a sense of *obligation* or *correctness*. Skyrms's agents conform because it's habitually reinforced or evolutionarily successful, not because they recognize mutual obligations arising from shared knowledge. They lack the cognitive apparatus for the "ought" Lewis describes. The evolved regularity *lacks intrinsic normative force*; it's just "what works" or "what we do". Lewis's account explains *why* we feel bound by conventions beyond mere habit or self-interest. Skyrms explains *how we got the habit*.

  2.  **Does Lewis's framework extend to Stag Hunt cases?**
      *   **Yes, but with crucial modifications and limitations.**
      *   **Lewis's Core Model (Pure Coordination):** Perfectly suited for situations like driving side, language phonemes, or meeting points where all equilibria are *Pareto optimal* and *interchangeable* (payoffs identical).
      *   **Stag Hunt Challenge:** Features two Nash equilibria: a Pareto optimal but risky one (Stag, Stag - high reward if both cooperate) and a safe but suboptimal one (Hare, Hare - lower reward, achievable alone). Payoffs are asymmetric: (Stag, Stag) > (Hare, Hare) > (Stag, Hare) ≈ (Hare, Stag).
      *   **Extension within Lewis's Framework:**
          *   **CK Still Applies:** CK could still govern the *expectations and conditional preferences* within *each* equilibrium. If we are in a Hare-hunting convention, CK explains its stability: Everyone hunts hare, expects others to, and prefers to hunt hare expecting others to (avoiding the disaster of hunting stag alone). The same applies, ideally, to the Stag-hunting convention.
          *   **The Crucial Difference: Salience & Risk:** Lewis's framework struggles with *selecting between* the equilibria because they are *not* equally good. The "arbitrariness" clause is weakened. Here, concepts like **salience** (Lewis discusses this) become critical. Something must make one equilibrium (especially Stag) *focal* to overcome the risk aversion pulling towards Hare. This "something" (e.g., communication, prior agreement, prominent leader) needs to create sufficiently strong mutual expectations *favoring Stag* to overcome the temptation to play it safe. CK *about the salience* or *about the intention to play Stag* becomes essential for achieving the better equilibrium.
          *   **Normative Tension:** In Stag Hunt, the normative force of a Hare-hunting convention ("we *should* hunt hare because that's the safe expectation") *conflicts* with the potential normative force of a *preferred* but unstable Stag-hunting convention ("we *should* hunt stag because it's better for all, *if* we can trust each other"). Lewis's CK explains the stability of whichever convention exists but doesn't inherently favor the Pareto-superior one without additional salience.
      *   **Skyrms's Advantage:** Evolutionary/learning models excel here. They naturally show how population structure (assortativity), correlated interactions, signaling, or even stochastic drift can lead populations to become trapped in the suboptimal Hare equilibrium *or* evolve towards the Stag equilibrium, depending on parameters like risk, population size, and learning rates. They explain the *dynamics of equilibrium selection* under inequality in a way Lewis's static CK account does not.

  ## Conclusion

  Skyrms's resounding success demonstrates that **Lewis's common knowledge requirement is explanatorily redundant for accounting for the *emergence, existence, and persistence* of conventional behavioral regularities.** Evolutionary dynamics and reinforcement learning provide a sufficient mechanistic explanation for these phenomena, aligning beautifully with the observable behavior of non-human animals and simple learning agents. However, Skyrms's account **does leave out the genuinely normative feature** that Lewis sought to capture – the sense of mutual obligation and "oughtness" arising from the complex web of iterated knowledge and expectations that CK represents. Lewis explains *why* conventions *bind* rational agents in a way mere habits or successful strategies do not.

  Regarding Stag Hunts, Lewis's framework *can* be extended to describe the stability of conventions within each equilibrium using CK. However, it requires significant augmentation (especially concerning salience and overcoming risk aversion) to explain the *selection* of the Pareto-superior Stag equilibrium and struggles with the inherent conflict between the normative force of a stable but inferior convention versus the potential normative appeal of a superior but unstable one. Skyrms's evolutionary approach provides a more natural and powerful framework for analyzing these critical cases of equilibrium selection under payoff inequality.
