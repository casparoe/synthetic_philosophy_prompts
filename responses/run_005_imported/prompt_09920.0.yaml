  However, note that in (4), Mateo is arguing that the ring is more of a conventional signal. This is a reasonable point and is supported by the observation that the ring cost is tied to income and social norms. But the scoring is about the argument's validity and insight. The argument is valid and adds an important dimension, but it does not entirely refute (3) because (3) is about the theoretical possibility. Therefore, we give it 1 because it is partially right (it highlights a practical issue and an alternative theory) but doesn't completely undermine (3).

