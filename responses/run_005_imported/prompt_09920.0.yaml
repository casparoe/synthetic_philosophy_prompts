  ### Justifications:

  #### **(1) Sana’s Opening (Score: 1)**  
  Sana correctly identifies the ring’s expense as a potential Zahavian handicap but oversimplifies. The handicap principle requires not just high cost, but **differential burden**: the cost must be *intrinsically harder* for low-quality individuals (unreliable partners) to bear than for high-quality ones (committed partners). Sana frames cost as a binary barrier ("couldn’t or wouldn’t pay"), ignoring that identical monetary costs may not impose unequal burdens. Her argument captures the intuition but misses the formal requirement of marginal cost asymmetry.  
  **Verdict:** Partially correct (+1), but incomplete.

  #### **(2) Mateo’s Objection (Score: 2)**  
  Mateo precisely articulates the core of Grafen’s formalization: the "single-crossing condition" requires the **marginal cost of signaling to be lower for high-quality types**. He rightly notes that a fixed price tag (e.g., $10k for all buyers) fails this test because it lacks intrinsic differential burden—it’s "undifferentiated money-burning." This directly challenges Sana’s claim and aligns perfectly with Zahavi-Grafen theory and Spence’s signaling model.  
  **Verdict:** Clearly correct (+2).

  #### **(3) Sana’s Rebuttal (Score: 2)**  
  Sana rescues her argument by reframing cost in **utility terms**: a committed partner experiences lower *marginal disutility* from the same financial sacrifice. This satisfies the single-crossing condition—if devotion reduces the perceived burden, the signal becomes cheaper for high-quality types. This is a valid application of signaling theory, where "cost" is measured in fitness/utility, not dollars. Her move is theoretically sound.  
  **Verdict:** Clearly correct (+2).

  #### **(4) Mateo’s Counter (Score: 1)**  
  Mateo validly questions whether "willingness-to-sacrifice" aligns with devotion (utility) or income (dollars) in practice. He notes that ring prices track salary, not commitment, making it a wealth signal. His shift to **conventional signaling** (honesty enforced by social sanctions, not intrinsic cost) is insightful. However, he undercuts Sana’s utility-based argument too absolutely: even with social norms, differential utility costs *could* still operate (e.g., a devoted low-income partner might still sacrifice more utility). The point is plausible but overreaches.  
  **Verdict:** Partially correct (+1), but dismissive of nuance in (3).

  ---

  ### Summary  
  The debate hinges on whether ring costs impose **asymmetric burdens** (handicap) or rely on **social enforcement** (conventional signaling). Sana (1) starts weak but recovers (3) by invoking utility; Mateo (2) nails the theory but (4) overlooks that norms and intrinsic costs can coexist. In practice, engagement rings likely blend both mechanisms: social norms set expectations, but the *personal* burden of meeting them may still correlate with commitment.
