answer: |-
  Your intellectual honesty in questioning this reflex is admirable—it’s precisely the kind of meta-rationality LessWrong aims to cultivate. You’ve hit on a genuine tension between formal logic and moral philosophy, and **neither side needs to "give way" entirely.** The critical-thinking-class version of *tu quoque* isn’t *wrong*, but it’s radically incomplete for real-world moral discourse. Here’s how they coexist:

  ### 1. **The Logical Core: Hypocrisy Doesn’t Invalidate the Proposition**
     - **What the fallacy rule gets right:** If someone says, "Policy X is morally right/effective," and you retort, "But *you* don’t follow it!" you commit *tu quoque*. The truth of Policy X stands independent of the speaker’s behavior. Your austerity-policy example holds here: even if the politician is hypocritical, austerity *could* still be sound policy. Dismissing the argument *solely* due to hypocrisy *is* a logical error.

  ### 2. **The Philosophical Insight: Standing Governs Moral Authority, Not Truth**
     - **What the "standing" literature adds:** Philosophers like Wallace aren’t contesting logical validity. They’re asking: *Who gets to participate in moral blame?* Hypocrisy undermines **moral authority**, not truth. Key reasons:
       - **Reciprocity Failure:** Blaming others presupposes you accept the norm’s bindingness. Hypocrisy violates reciprocity (e.g., "Why should I listen to *your* demand for austerity when you exempt yourself?").
       - **Corruption of the Moral Community:** As Cohen argues, hypocrites poison collective moral dialogue. Their blame isn’t a sincere appeal to shared values but a power move.
       - **Epistemic Disruption:** A hypocrite’s advice often *is* untrustworthy (e.g., a lavish spender advocating austerity may misunderstand poverty’s realities).

  ### 3. **Bridging the Gap: Why This Isn’t a Fallacy in Disguise**
     - **The fallacy applies only when hypocrisy is used to *refute the claim***. Philosophers grant the claim may be true but argue the hypocrite forfeits the **role** of blamer. Consider:
       - **Logical Level:** "Austerity is good." (True/False regardless of speaker.)
       - **Moral-Pragmatic Level:** "This hypocritical politician cannot *credibly demand* austerity." (Standing lost.)
     - **Analogy:** A judge taking bribes hasn’t disproven the law, but they’ve lost standing to enforce it. The law remains valid; the judge is disqualified.

  ### 4. **Why Your Friend Might Be Right (Contextually)**
     - In your politician example, dismissing austerity *solely* due to hypocrisy *would* be fallacious. But if your friend meant, "We shouldn’t let *this politician* dictate austerity *because their hypocrisy destroys their authority*," they’re invoking standing, not logic. This matters because:
       - **Policy implementation** requires trust. A hypocrite’s demands breed resentment and non-compliance.
       - **Democratic accountability** hinges on representatives living under the norms they impose.

  ### 5. **When Standing Matters Most**
     Standing arguments gain force in contexts of:
     - **Moral condemnation** (e.g., condemning violence while funding militias).
     - **Personal integrity-dependent roles** (leaders, judges, ethicists).
     - **Cases where the speaker’s behavior *explicitly contradicts* the norm they’re enforcing** (e.g., "You must quit smoking!" while holding a cigarette).

  ### The Resolution
  - **Critical thinking classes** are correct: Hypocrisy ≠ disproof. Use this to guard against *dismissing valid arguments*.
  - **Philosophers of standing** are correct: Hypocrisy can nullify moral authority. Use this to navigate *who deserves a hearing* in ethical/political discourse.

  In your politician case, you’d win on logic: "Austerity might still be correct." Your friend wins on political morality: "This hypocrite can’t lead this charge." Wisdom lies in seeing both truths.
