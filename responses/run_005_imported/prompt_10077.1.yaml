answer: |-
  Here’s a 5-minute speech weaving Zahavi's principle seamlessly into a heartfelt toast – accurate for the experts, engaging for everyone, and deeply personal:

  **Setting:** *Stand, raise glass, warm smile to the couple, then the room.*

  "Good evening, everyone. For those who don’t know me, I’m [Your Name], [Brother's Name]’s incredibly relieved *older* brother. Relieved, because after 25 years of trying to set an example, I can finally pass the 'responsible adult' baton to his amazing wife, [Fiancée's Name]. Seriously, [Fiancée's Name], you’ve performed a miracle we all thought impossible. Welcome to the family!

  Now, as best man, it’s tradition to share embarrassing stories. And trust me, with [Brother's Name], the vault is overflowing. Remember the hamster incident, [Brother's Name]? Or that time you tried to dye your hair… *permanently*… with beetroot juice? Classic.

  But today isn’t about *those* kinds of surprises. Today is about a different kind of story. A story that, for me, perfectly captures who [Brother's Name] is with [Fiancée's Name], and why we all knew, instantly, how real this was.

  You see, growing up, [Brother's Name] developed a… *reputation* in our family. Let’s call it ‘financial prudence’. Extreme financial prudence. We’re talking reusing teabags, negotiating bulk discounts on *birthday cards*, the kind of guy who considers ‘splurging’ to mean buying the *name-brand* baked beans. His wallet had a padlock, and the key was buried somewhere deep in Fort Knox. We love him for it! Mostly. (Okay, sometimes it drove us nuts.)

  So, when he told us about his plan to propose to [Fiancée's Name], we expected something thoughtful, heartfelt… and probably budget-conscious. Maybe a picnic? A carefully curated playlist? Definitely *not* what he actually did.

  Because what [Brother's Name] did was… well, frankly, it was *extravagant*. Not just a little extravagant. Monumentally, jaw-droppingly, ‘is-this-even-the-same-person?!’ extravagant. He secretly spent *months* – no, *years* – worth of his legendary savings. He flew [Fiancée's Name]’s parents, and both her grandmothers, all the way from [Country] to be there, hidden away, for the moment he asked her. He didn't just buy a ring; he bought an experience, a profound gesture of inclusion for her entire world.

  *(Pause, look at brother and fiancée)*

  The look on [Fiancée's Name]’s face when she turned around… priceless. The look on *our* faces when we heard what he’d done? Utter disbelief. Followed instantly by absolute certainty. *Of course* he meant it. *Of course* this was forever.

  **Why?** Not *despite* the extravagance, but precisely **because** of it. Because this wasn't just spending money. For [Brother's Name], this was spending *who he was*. It was the ultimate sacrifice from the King of Frugality. Anyone *could* theoretically book some flights. But for *him*? For the guy who debates the cost-per-sheet of toilet paper? This cost him *infinitely more* than just the price tag. It cost him his deeply ingrained nature, his security blanket of savings. It was a gesture so wildly out of character, so incredibly *difficult* for him specifically, that it became the most believable thing in the world.

  *(Slightly more conversational tone, leaning in)*

  There’s actually an idea in nature – stick with me, this isn't a lecture! – about how the most powerful signals are often the hardest to fake. Think of a peacock’s tail. It’s huge, it’s flashy, it’s incredibly cumbersome. It makes the bird slower, more visible to predators. Why bother? Because *only* a truly strong, healthy peacock can afford to carry that burden and survive. A weak one couldn’t fake it; the cost would be too high. The very difficulty makes the signal honest.

  *(Gesture towards brother)*

  That’s what [Brother's Name] did that day. He didn’t just show his love; he proved it in a way only *he* could. He took the thing that defined him – his legendary carefulness – and turned it upside down for [Fiancée's Name]. He showed that his commitment wasn't just words or a comfortable gesture; it was worth sacrificing his deepest habits, his security, everything he’d meticulously built. The sheer *cost* to *him* made it utterly credible. We believed it instantly because we knew what that sacrifice *meant* coming from him.

  *(Shift back to full warmth, raising glass)*

  [Brother's Name], that day proved you weren’t just ready to *say* ‘I love you,’ but to *live* it, even when it’s hard, even when it costs you something precious. [Fiancée's Name], you inspired that in him. You unlocked a generosity and boldness we always knew was there, buried under layers of budget spreadsheets. Seeing you two together… it just makes sense. You bring out the absolute best, the most courageous, and yes, occasionally the most unexpectedly extravagant, in each other.

  So here’s to you both. To the strength of your commitment, proven not just in easy moments, but in the ones that truly cost you something. May your life together be filled with joy, laughter, deep love… and maybe just the *occasional* splurge on the name-brand beans. You’ve earned it.

  To [Brother's Name] and [Fiancée's Name]!"

  **Why this works:**

  1.  **Accuracy for Experts:** It nails Zahavi:
      *   Focuses on the **differential cost** ("cost him infinitely more... deeply ingrained nature").
      *   Highlights the **unfakeability** for *him specifically* ("a way only *he* could," "weak one couldn't fake it").
      *   Uses the peacock **analogy correctly** (costly burden proving quality).
      *   Avoids the "expensive = sincere" pitfall by emphasizing the *personal* cost relative to his baseline.
  2.  **Accessibility for All:**
      *   The core story (frugal brother's grand gesture) is universally understandable and touching.
      *   The peacock analogy is introduced simply as an "idea in nature," a quick illustrative comparison, not a theory lecture.
      *   The key takeaway ("proved it in a way only *he* could," "sheer cost to *him* made it credible") is stated clearly in human terms, independent of the analogy.
      *   Humor ("name-brand beans," "Fort Knox wallet") keeps it light.
  3.  **Heart & Toast Structure:**
      *   Starts with classic best man warmth, humor, and connection.
      *   Builds the personal anecdote as the emotional core.
      *   Uses the theory *to illuminate the personal story*, not the other way around.
      *   Clearly links the gesture to his love and commitment.
      *   Ends with a direct, warm toast to the couple's future.
  4.  **Sounds Like a Toast:** Natural language, conversational tone ("stick with me," "we love him for it! Mostly"), heartfelt sentiment, clear focus on the couple, ends with a raised glass.

  **Delivery Tips:**

  *   **Know Your Brother:** Deliver the frugal jokes with clear affection, not mockery.
  *   **Pacing:** Pause after the reveal of what he did. Pause after "...utter disbelief. Followed instantly by absolute certainty."
  *   **Eye Contact:** Connect with the couple during the heartfelt parts, sweep the room during the explanation/humor.
  *   **Confidence:** Deliver the "idea in nature" part conversationally, like sharing an interesting thought, not teaching. You've got this!

  This speech honors your brother's incredible gesture, explains *why* it was so powerful using sound theory, and does it all within the warm, celebratory context of a wedding toast. Congratulations to your brother!
