answer: |-
  Hume's claims about money—that it is a "fiction" or convention lacking intrinsic worth, yet causally impacts commerce through its quantity—can be coherently held together. The resolution hinges on recognizing that **social conventions are not ontologically fundamental but are causally potent through human psychology, collective intentionality, and institutional reinforcement.** Below, I defend this coherence by addressing the philosophical relationship between conventions and causality:

  ### 1. **Money as a "Fiction": The Conventionalist View**  
     - **Lack of Intrinsic Value**: Hume observes that money (e.g., paper currency) has no inherent utility. Its value arises solely from collective agreement. A £10 note is just paper; its worth depends on society’s shared belief that it represents purchasing power.  
     - **Institutional Reality**: Like rules in chess or legal contracts, money is an *institutional fact* (Searle’s term). It exists because we assign it a status function: "X (paper/metal) counts as Y (money) in context C (a given economy)." This status is maintained by mutual recognition.  

  ### 2. **Causal Efficacy of Money Quantity**  
     Hume argues that increasing the money supply stimulates trade in the short term ("Of Money," *Essays Moral, Political, Literary*):  
     - **Mechanism**: More money → higher prices → increased production (as producers respond to rising demand) → economic growth.  
     - **Empirical Link**: Historically, inflows of precious metals to Europe correlated with inflation and commercial expansion, illustrating money’s causal role.  

  ### 3. **Coherence: How Conventions Cause Real Effects**  
     The apparent tension dissolves when conventions are seen as *emergent social structures* with causal power:  
     - **Psychology as the Bridge**:  
       - Conventions shape human expectations and behavior. If people *believe* money is valuable, they act accordingly (e.g., working for wages, trading goods).  
       - Hume’s theory of causation (constant conjunction) applies: repeated observations link money supply changes (cause) to price shifts (effect). The convention enables this linkage by defining money’s role.  
     - **Collective Intentionality**:  
       - Money’s power stems from *intersubjective agreement*. When millions act on the shared belief that paper represents value, their aggregate actions (spending, saving, investing) alter material outcomes (e.g., inflation, employment).  
     - **Systemic Feedback Loops**:  
       - Example: A central bank prints money → banks lend more → businesses invest → employment rises → demand increases → prices inflate. The convention (money’s status) enables this chain by structuring incentives.  
     - **Non-Reductive Causality**:  
       - Conventions exert *downward causation*: though dependent on individual minds, they constrain/enable behavior at a macro level. Traffic laws (conventions) causally reduce accidents by coordinating drivers. Similarly, money conventions coordinate economic activity.  

  ### 4. **Philosophical Grounding: Conventions vs. "Brute" Facts**  
     - **Anti-Reductionism**: Hume rejects the idea that only physical properties cause change. Social facts (e.g., trust in money) are real forces within their domain.  
     - **Humean Custom and Habit**: In *A Treatise of Human Nature*, Hume argues customs/habits underpin causality. Money’s efficacy relies on ingrained habits of market participants responding to its quantity.  
     - **Critique of Essentialism**: Money’s "fictional" nature doesn’t negate causal power; it highlights that its ontology is relational, not intrinsic. A play’s plot (fiction) can cause real emotions—likewise, money (convention) alters real economies.  

  ### 5. **Potential Objections & Responses**  
     - **Objection**: "If money is ‘imaginary,’ how can it cause material effects?"  
       **Response**: Conventions are not *mere* imagination—they are embodied in practices, contracts, and institutions. Their causal power arises from coordinated human action, not material substance.  
       
     - **Objection**: "Doesn’t this imply circularity? Money works because people believe it works."  
       **Response**: This is a feature, not a flaw. Social reality is inherently recursive (e.g., language). Money’s stability emerges from self-reinforcing trust.  

  ### Conclusion  
  Hume’s claims are coherent: money is a convention *and* causally efficacious because **conventions gain causal power through human psychology and collective behavior**. The quantity of money influences commerce by altering incentives within a rule-based system sustained by shared intentionality. This aligns with Hume’s broader empiricism: we observe money’s effects (causality) even as we recognize its foundations in custom (convention). Thus, social constructions can have genuine causal powers without possessing intrinsic properties—a insight foundational to modern institutional economics and social ontology.
