answer: |-
  You've grasped part of Anscombe's argument, but your friend is right – **you're misreading her core point by framing it as a utilitarian calculation.** While she *does* discuss the numbers, her fundamental argument against Truman and the atomic bombings is **deontological and principle-based, not utilitarian.** Here's why:

  1.  **The Core Charge: Intentional Killing of the Innocent:** Anscombe's primary accusation is that Truman *intentionally targeted and killed innocent civilians* as a means to an end (ending the war). This, for her, constitutes **murder**, regardless of the consequences or justifications.
      *   She quotes St. Thomas Aquinas: "If any man uses a sword to kill a man who has not deserved to be put to death... he is a murderer."
      *   Her pamphlet states: "For men to choose to kill the innocent as a means to their ends is always murder... Murder is the deliberate killing of the innocent, whether for its own sake or as a means to some further end."
      *   **This is the absolute principle.** The utilitarian calculation of lives saved vs. lives lost is irrelevant to *this specific charge*.

  2.  **Her Discussion of Numbers is a *Rebuttal*, Not the Basis:**
      *   She *anticipates* the utilitarian defense: "But the bombings saved more lives than they cost by preventing a land invasion."
      *   She *then* argues that **this justification doesn't hold water even on its own terms:**
          *   **Doubtful Premise:** She questions the necessity of the bombings to avoid invasion, suggesting Japan was already close to surrender ("the Japanese had long been trying to surrender").
          *   **Questionable Numbers:** She challenges the predicted casualty figures for an invasion (e.g., the often-cited "one million American lives") as exaggerated propaganda, calling them "a wicked lie" or at best, a figure plucked from thin air. She argues the actual estimates were much lower.
          *   **Ignoring Alternatives:** She points out that alternatives like a demonstration explosion or accepting conditional surrender were not genuinely pursued.
      *   **Her Goal:** By challenging the utilitarian justification, she aims to show that *even if* you accept consequentialist reasoning, the bombing wasn't justified. **But crucially, she argues that *even if* the utilitarian calculation favored the bombings, it *still* wouldn't justify the intentional killing of innocents.** The numbers discussion is secondary to demolishing the *opponent's* argument.

  3.  **Rejection of Utilitarianism:** Anscombe was a staunch critic of utilitarianism. Her moral philosophy was deeply rooted in virtue ethics and Thomistic natural law, emphasizing absolute moral prohibitions based on the inherent nature of acts (like intentionally killing the innocent). She believed ends *never* justify intrinsically evil means.
      *   **Key Quote:** "But if you *could* have victory in such a way, that by the same action you could also destroy an immense number of innocent human lives, would you do it? Could a man choose to do it? If he could, would he not be a murderer? ... To choose to kill the innocent as a means to your ends is *always* murder... The principle is the same if you kill one innocent person or a million."

  **Settling the Argument:**

  *   **You are right that:** Anscombe *does* engage with the numbers and argues that the predicted casualties of invasion were exaggerated and alternatives existed, making the bombings unnecessary *even* on consequentialist grounds.
  *   **Your friend is right that:** You are misreading her if you think her *primary case* or the *reason* she calls Truman a murderer is based on this utilitarian math ("the bombs come out worse"). **Her core case is deontological:** Truman ordered the *intentional killing of innocent civilians* as a means to an end. That act, in itself, was murder, irrespective of any potential net lives saved. The numbers argument is deployed to counter the *opposing* utilitarian justification, not as the foundation of her own moral condemnation.

  **In essence:** Anscombe isn't saying "The bombs killed more civilians than an invasion would have killed soldiers, therefore Truman is a murderer." She is saying: "Truman intentionally murdered civilians. The fact that people try to justify this murder with inflated invasion casualty figures doesn't make it not murder, and besides, those figures are probably wrong." **The accusation of murder stands on the nature of the act itself, not on a comparative body count.**
