prompt: |-
  A friend and I spent two hours last weekend arguing about the surprise exam paradox: a teacher announces there will be a surprise exam next week; a student 'proves' by backward induction that no exam fitting that description can occur -- it can't fall on the last possible day, since by then it would be expected, so it can't fall on the second-to-last day either, and so on back to the first day -- yet the teacher gives one anyway and genuinely catches everyone off guard. My friend calls the argument invalid and dismissible; I think it points to something real, that the announcement behaves less like a false prediction than like a claim that becomes unknowable to its audience the moment it is believed.

  The disagreement turned out to matter more than I expected. I sit on my school's academic policy committee, and a teacher has asked for approval to reinstate unannounced, graded 'surprise quizzes,' given at some point within a two-week unit, with the only promise being that students won't know which day it will fall on until it happens. The student council's formal objection runs exactly the backward-induction argument above and concludes that the policy is either incoherent or bound to violate its own terms; the teacher calls this 'a clever trick, not a real objection.' Draft the committee's decision memo -- approve, reject, or approve with conditions -- with reasoning precise enough that a sharp student couldn't just shrug it off, rather than one that simply asserts that surprises obviously happen in practice.
reasoning: |-
  We are faced with the surprise exam paradox in a real-world context. The student council uses the backward induction argument to claim that the surprise quizzes are impossible, while the teacher insists they are possible. The committee must draft a decision that addresses the logical argument without simply appealing to practice.

  The paradox arises because the announcement itself seems to make the exam predictable on the last day, then the second-to-last, and so on. However, in reality, the exam can be given on any day and still be a surprise if the students do not know which day it will be. The flaw in the backward induction is that it assumes the students are certain that the exam will happen on a particular day when they rule out the remaining days. But in fact, the students cannot be certain until the exam is given because the teacher has the freedom to choose any day until the last moment.

  Decision:

  We approve the teacher's request to reinstate surprise quizzes, but with conditions to ensure the surprise element is maintained and to address the student council's concerns.

  Reasoning:

  1. **The logical flaw in the backward induction argument**: The argument relies on the assumption that the students can use the announcement to deduce, day by day, that the exam cannot occur on any given day. However, this deduction requires that the students believe the exam must occur on a day that is still possible and that they have complete certainty in their reasoning. In reality, the students cannot be sure that the teacher will follow through with the exam until it happens. Moreover, the backward induction breaks down because the students cannot rule out the possibility that the exam might occur on a day that they have not yet eliminated. The announcement does not provide the students with enough information to predict the day with certainty until the exam is given.

  2. **The role of uncertainty**: For the surprise to occur, it is sufficient that the students do not know the exact day of the exam. The teacher can choose a day at random, and as long as the students are not certain of the day, the surprise is possible. The backward induction argument fails because it ignores the possibility that the teacher might choose a day that the students have not yet considered (or that they have considered but not ruled out with absolute certainty). In fact, the students may assign a probability distribution over the possible days, and the exam can be a surprise as long as the probability they assign to the actual day is not 1 until the exam is given.

  3. **Practical considerations**: In practice, surprise quizzes are a common pedagogical tool and can be effective. The committee notes that if the teacher were to give the quiz on the last day, the students might indeed expect it on that day if they have ruled out all previous days. However, the teacher can avoid this by not always waiting until the last day. By varying the day of the quiz, the teacher can maintain the surprise. Moreover, the two-week window provides enough days for variation.

  Conditions:

  To address the student council's concerns and ensure the policy is coherent:

  a. **Randomization Requirement**: The teacher must use a random method to choose the day of the quiz (e.g., drawing from a hat, using a random number generator) and must not follow a predictable pattern. This ensures that the students cannot deduce the day by any means, including by reasoning about the teacher's behavior.

  b. **No Fixed Pattern**: The teacher should avoid giving the quiz on the same day of the week or in a pattern that students might detect over time. This condition is to prevent students from forming expectations based on past quizzes.

  c. **Transparency about Randomization**: At the beginning of the unit, the teacher should inform the students that the quiz day is chosen randomly and that every day (except those explicitly excluded by the teacher, such as holidays or exam days) has an equal chance. This announcement should replace the simple promise of surprise, to avoid the logical paradox.

  d. **One Quiz per Unit**: The teacher must give exactly one quiz during the two-week unit. This prevents the teacher from giving multiple quizzes and thus undermining the surprise element for the first quiz.

  e. **No Announcement on the Day**: The teacher must not give any hint on the day of the quiz until the quiz is distributed. This includes avoiding behaviors that might signal the quiz (e.g., carrying quiz papers in a visible way before class).

  By requiring randomization and transparency, we remove the logical paradox because the students know that the day is chosen randomly and cannot be predicted by deduction. Therefore, the backward induction argument does not apply because it requires the students to be able to rule out days with certainty, which they cannot do when the choice is random.

  The committee also notes that if the teacher fails to adhere to these conditions, the surprise element might be compromised, and the student council would have grounds for complaint.

  Conclusion:

  We approve the request with the above conditions. The surprise quiz policy is reinstated, provided the teacher follows the randomization and transparency requirements. This decision respects the pedagogical value of surprise quizzes while addressing the logical concerns raised by the student council.

  Signed,
  The Academic Policy Committee
answer: |-
  **MEMORANDUM**  
  To: Academic Policy Committee  
  From: [Your Name/Committee Chair]  
  Date: [Date]  
  Subject: Decision on Request to Reinstate Surprise Quizzes  

  ### Decision  
  The committee approves the teacher’s request to reinstate unannounced, graded "surprise quizzes" under the proposed format (one quiz per two-week unit, with students unaware of the exact day until it occurs), **with binding conditions** to ensure pedagogical coherence and address student concerns.  

  ### Reasoning  
  The student council’s objection relies on the "surprise exam paradox," which uses backward induction to argue that surprise quizzes are impossible. While this argument is logically intriguing, it rests on assumptions that do not hold in practice. However, dismissing it as "just a trick" without addressing its core fails to engage with legitimate concerns about predictability. Below, we dismantle the paradox step by step and outline conditions to prevent self-defeating outcomes.  

  #### 1. **The Flaw in the Backward Induction Argument**  
  The paradox assumes:  
  - **Perfect Rationality**: Students and teachers act with flawless logical consistency.  
  - **Common Knowledge**: The announcement is universally known, and all parties know everyone else believes it (and so on, ad infinitum).  
  - **Determinism**: The quiz day is fixed in advance, allowing students to "rule out" days sequentially.  

  In reality, these assumptions collapse under uncertainty:  
  - **Uncertainty Breaks the Chain**: Backward induction fails because students cannot know with absolute certainty that the quiz will occur on a given day until it happens. For example:  
    - On the penultimate day of the unit, students might *suspect* the quiz could occur on the final day, but they cannot be *certain*—the teacher might have chosen an earlier day, or unforeseen events (e.g., an assembly) could intervene.  
    - The teacher’s choice is not predetermined; it can be made spontaneously, preventing students from deducing the day through elimination.  
  - **Probability, Not Certainty**: The paradox treats "surprise" as binary (expected vs. unexpected), but in practice, surprise exists on a spectrum of probabilities. If students assign a low probability to the quiz occurring on a specific day (e.g., <50%), it remains a surprise even if they acknowledge it is *possible*. Random selection ensures no day is certain.  
  - **Self-Referential Contradiction**: The announcement "there will be a surprise quiz" creates a self-referential loop. If students believe the quiz *cannot* occur, they lower their guard, making a surprise *easier* to achieve. The paradox assumes belief in the announcement, yet uses that belief to "prove" the announcement false—a contradiction.  

  Thus, the backward induction argument is invalid in real-world contexts because it ignores:  
  - The role of randomness and imperfect information.  
  - The difference between probabilistic expectation and deductive certainty.  

  #### 2. **Why Surprises Can Occur in Practice**  
  Surprises happen when two conditions are met:  
  - **Unpredictability**: The quiz day is selected randomly (e.g., via a lottery).  
  - **Bounded Rationality**: Students lack complete information about the teacher’s decision process.  

  For instance:  
  - If the teacher rolls a die on the morning of each day to decide whether to give the quiz (with odds set to ensure exactly one quiz per unit), students cannot anticipate the day—even on the final day, the probability remains stochastic.  
  - Empirical evidence (e.g., unannounced fire drills) confirms that surprises occur despite announcements.  

  #### 3. **Conditions for Approval**  
  To prevent self-defeating outcomes and ensure the quiz remains a genuine surprise, the following conditions are mandated:  
  - **Random Selection Protocol**:  
    - The teacher must use a verifiable random mechanism (e.g., random number generator, shuffled cards) to select the quiz day *after the unit begins*, with all days equally likely. Documentation (e.g., a dated log) must be available to the committee upon request.  
    - **Rationale**: This eliminates deterministic selection, breaking the backward induction chain. Students know the day is random, so they cannot "rule out" days through logic alone.  
  - **No Predictable Patterns**:  
    - The teacher must avoid patterns across units (e.g., never giving quizzes on Mondays). If multiple units use surprise quizzes, the gap between quizzes must vary randomly.  
    - **Rationale**: Prevents students from inferring future quiz days from past occurrences.  
  - **Transparency and Scope**:  
    - The teacher must announce: "One quiz will occur on a randomly chosen day during this unit. I will not decide the day in advance."  
    - Excluded days (e.g., field trips) must be stated upfront.  
    - **Rationale**: Clarifies that unpredictability stems from randomness, not secrecy. This reframes the "surprise" as probabilistic, avoiding the paradox’s self-reference.  
  - **One-Quiz Limit**:  
    - Only one quiz may be given per unit. Multiple quizzes would allow students to infer timing (e.g., "if it hasn’t happened by Day 5, it must be on Days 6–10").  
  - **Student Council Oversight**:  
    - The student council may appoint one observer per unit to verify the random selection (without learning the day in advance).  

  #### 4. **Why Not Reject or Unconditional Approval?**  
  - **Rejection** would disregard pedagogical benefits (e.g., encouraging consistent study, reducing cramming) and imply the paradox is insurmountable—which it is not.  
  - **Unconditional approval** risks self-sabotage: if the teacher chooses days non-randomly (e.g., always on Friday), students could predict the quiz, violating the policy’s promise. Conditions enforce rigor.  

  ### Conclusion  
  The surprise quiz policy is approved with binding conditions to ensure unpredictability through randomness. The backward induction argument, while clever, relies on idealized assumptions that do not reflect real-world dynamics. By formalizing randomness and transparency, we preserve the pedagogical intent while demonstrating to students that logical paradoxes—when properly bounded—do not preclude practical outcomes.  

  The teacher must submit a written plan adhering to these conditions before implementation. Non-compliance will result in policy suspension.  

  ---  
  **Approved by:** Academic Policy Committee  
  **Next Steps:** Teacher to submit implementation plan by [Date]. Student council notified.
