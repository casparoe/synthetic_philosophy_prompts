answer: |-
  Here's a nuanced objection for your Dominican theologian, targeting the genuine epistemic tension in Galileo's application of Augustine:

  **Theologian's Objection (Delivered with scholarly precision, not polemic):**

  "Fathers, Brother Galileo wields the authority of the Blessed Augustine most skillfully, invoking his wise counsel in *De Genesi ad litteram*: that where Scripture speaks of natural phenomena in terms seemingly contrary to what is *firmly demonstrated by reason and experience*, we must seek a non-literal interpretation. He further arms himself with the pithy wisdom of that 'eminent ecclesiastic': the Spirit teaches us the *via ad coelum*, not the *coeli vias*.

  "Who among us would dispute Augustine's principle? It is sound theology, born of profound respect for both God's Word and God's Creation. *However*, Galileo's application subtly, yet profoundly, shifts the foundation upon which Augustine built his caution.

  "Augustine's principle rests upon a crucial condition: **the natural conclusion must be *already secured*, *beyond reasonable dispute*, *demonstrated*.** Augustine speaks of truths held with the certainty granted by *scientia* – knowledge established by irrefutable reason and sensory confirmation. He counsels accommodation *after* such certainty is achieved, lest Scripture be mocked for apparent absurdity.

  "Brother Galileo, however, invokes this principle *precisely at the moment when the natural conclusion he champions – the motion of the Earth and stability of the Sun – is the *very heart of the dispute*.* Heliocentrism is *not* an established *scientia* in 1616. It is a brilliant hypothesis, supported by compelling *indications* – the phases of Venus, the moons of Jupiter, the elegance of the Copernican arrangement – yes, these are powerful arguments! But are they *demonstrations* in the Aristotelian sense, or even in the sense demanded by natural philosophy? Do they *necessitate* assent from any rational mind? Many eminent mathematicians and philosophers, examining the same phenomena and arguments, remain unconvinced. The absence of stellar parallax, the counter-intuitive implications for dynamics and Scripture, the lack of any *direct*, incontrovertible proof of Earth's motion – these sustain the dispute.

  "Here lies the divergence, subtle but critical:
  1.  **Who Decides 'Demonstrated'?** For Augustine, 'demonstrated' meant a conclusion so firmly established within the prevailing intellectual framework (largely Aristotelian) that to deny it was irrational. It was a *socially and intellectually settled* matter *before* exegesis adjusted. Galileo, however, applies the principle to a conclusion *he* believes is demonstrated, based on *his* interpretation of new observations and *his* mathematical reasoning, *while that conclusion is actively contested by the majority of the philosophical community*. He asks us to overturn a millennium of exegetical tradition based on a theory whose fundamental proof (stellar parallax) remains elusive and whose physical consequences defy common experience and the best available physics (Aristotelian dynamics, however imperfect).
  2.  **The Burden Shift:** This is Galileo's masterstroke, but also his vulnerability. By invoking Augustine *now*, he subtly shifts the burden of proof. He implies: *'Heliocentrism is so evidently true (or will be imminently proven) that *you*, the theologians, must *already* adjust your reading of Scripture to accommodate it, lest you violate Augustine's rule.'* He demands exegetical retreat based on a natural philosophical position that lacks consensus and conclusive proof. He asks the Church to accept his *assessment* of the demonstration *as if it were already achieved*, thereby pre-empting the very process of philosophical verification Augustine presumed. It puts the cart before the horse.

  "My objection, therefore, is not to Augustine's principle, nor to the investigation of nature, nor even to the potential truth of Copernicus. **It is to the premature application of the principle of accommodation to a natural philosophical proposition that remains vigorously disputed and unproven according to the standards of demonstration recognized in natural philosophy.** To invoke Augustine *here* is to claim a certainty that does not yet exist. It risks destabilizing the interpretation of Holy Scripture based not on established truth, but on a brilliant, yet contested, hypothesis. Until heliocentrism achieves the status of *scientia* – until its proofs compel universal assent from natural philosophers, overcoming the valid objections – the prudent, the *Augustinian* course, is to maintain the traditional interpretation. To do otherwise would be to grant a hypothesis the authority of demonstrated truth prematurely, potentially forcing Scripture to bend to what might yet prove to be a magnificent error. Our duty is to safeguard the Faith, which includes safeguarding the proper relationship between emerging natural philosophy and the eternal Word. We must await the *actual* demonstration Augustine required."

  **Why this hits the mark:**

  1.  **Historical Accuracy:** This reflects the *actual* core of the 1615-1616 debate. Figures like Bellarmine explicitly stated they would reconsider Scripture *if* heliocentrism were proven. The lack of proof (especially parallax) and the counter-arguments (dynamics, scriptural passages) were genuine scientific/theological hurdles, not just dogma.
  2.  **Targets the Epistemic Gap:** It precisely identifies the divergence: Augustine requires settled science *before* exegesis changes; Galileo applies it to unsettled science *to force* exegetical change, effectively declaring the science settled prematurely (in the eyes of his critics).
  3.  **Exposes the Burden Shift:** It highlights how Galileo uses the principle to pressure theologians ("You *must* reinterpret because *I* say it's proven") instead of first achieving the philosophical consensus Augustine presumed.
  4.  **Intellectual Weight:** It grants the validity of Galileo's *arguments* and *observations* but denies they constitute *demonstration* by the standards of the time. It doesn't dismiss science; it questions the *degree of certainty* claimed.
  5.  **Prudence over Obstruction:** The theologian frames the objection as *prudence* and *fidelity to Augustine's actual conditions*, protecting Scripture from being yoked to potentially false theories. It sounds like responsible custodianship, not blind obstruction.
  6.  **Avoids Discredited Arguments:** It doesn't rely on scriptural literalism alone, Aristotelian dogma as unquestionable truth, or personal attacks on Galileo. It focuses on the *procedural* and *epistemic* weakness in Galileo's *application* of a principle both sides respected.

  This gives your theologian a powerful, historically grounded, and intellectually respectable voice within your novel. He's not a villain; he's a cautious guardian, articulating a very real concern about the standards of proof required before overturning centuries of interpretation.
