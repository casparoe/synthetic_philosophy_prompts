answer: |-
  This is a fantastic question that cuts right to the heart of what makes ensemble heists (and group dynamics in general) compelling. You're absolutely right that the differences between Bratman, Searle, and Gilbert have profound implications for your scene and the nature of the obligation the bailing character breaks. Let's break down the substantive differences and see how they play out in your "two minutes to bail" scenario.

  **Core Differences Explained:**

  1.  **Michael Bratman (Reductionist Interlocking Intentions):**
      *   **Substance:** There is *no* "group mind" or irreducible "we." Shared intention *is nothing over and above* the complex web of individual intentions and mutual beliefs held by each member. Crucially, each person intends *their part* of the joint activity *because* they believe the others intend their parts, and they all mutually know this. Their individual plans ("sub-plans") must "mesh" – they must be compatible and coordinated. The glue is mutual responsiveness and interdependence at the individual level.
      *   **Analogy:** Think of a complex Rube Goldberg machine. Each part (individual intention) is designed with the *expectation* of the other parts being present and functioning (mutual belief). The machine (shared action) only works if all parts are correctly positioned and interdependent (meshing sub-plans). But there's no "machine spirit" – just the parts and their relational setup.

  2.  **John Searle (Primitive "We-Intention"):**
      *   **Substance:** While agreeing there's no group mind, Searle argues Bratman's reduction *fails*. He posits that when we genuinely act together, each individual has a *sui generis* (unique, irreducible) mental state: "We intend to do X." This "we-intention" cannot be broken down into "I intend..." plus beliefs about others. It's a primitive form of intentionality directed at the collective action itself. My *individual* contribution flows *from* this "we-intend" state.
      *   **Analogy:** Imagine a choir singing a single note in harmony. While each singer produces their own sound (individual action), their fundamental mental state isn't "I intend to sing my note *because* I believe you are singing yours." It's "**We** intend to sing this chord." The "we" is the primary focus of their intentionality. The harmony emerges from the shared primitive intention, not just from interlocking individual plans.

  3.  **Margaret Gilbert (Plural Subject & Joint Commitment):**
      *   **Substance:** This is the strongest collectivist view. When people jointly commit to doing something as a body, they form a "plural subject." This *is* a new, emergent social entity. The commitment creates *genuine obligations* between the members *to each other* regarding the joint activity. These obligations aren't reducible to individual promises or moral duties; they arise *sui generis* from the act of joint commitment itself. Exiting the commitment requires the agreement of the others or dissolves the obligation only under conditions accepted by the plural subject.
      *   **Analogy:** Think of signing a legally binding partnership agreement. By signing, the individuals create a new entity (the partnership) with its own rights and obligations. Partners owe duties *to the partnership and each other* that didn't exist before the agreement. Breaking these duties isn't just breaking a personal promise; it's violating the terms of the joint entity you helped create.

  **Your Bailout Scene: Why the Philosophy Matters Profoundly**

  The key question: **What kind of obligation does the bailing character break, and what do the others legitimately feel they are owed?**

  1.  **Bratman's World (Broken Interdependence & Promises):**
      *   **The Obligation:** The bailer is primarily breaking a complex web of *individual* commitments *to the others* based on reliance and interdependence. She intended to do her part *because* she believed they would do theirs (and vice versa). By bailing, she:
          *   Breaks her *individual* commitment (intention) to do her part.
          *   Renders false the mutual beliefs the *others* relied upon when forming *their* interdependent intentions and sub-plans ("We believed she would do X, so we planned Y and Z accordingly").
          *   Fails to be responsive to the needs of the joint activity.
      *   **What's Owed?** The others are owed an explanation and perhaps compensation for the *harm* caused by disrupting their individual plans and expectations built on mutual reliance. They might feel betrayed *personally* ("*I* counted on *you*!"). The obligation feels like a cluster of broken personal promises based on interdependence. The anger is about shattered individual trust and the practical fallout ("Now *my* plan is ruined!").
      *   **Your Scene:** Dialogue focuses on practical betrayal and reliance: "We built the *whole* diversion around your signal, Eva! Carlos is *counting* on you being in position! You swore you'd handle the guard! What about *our* plans now?"

  2.  **Searle's World (Breaking the Shared Mental State):**
      *   **The Obligation:** The bailer isn't just breaking a promise; she's fundamentally abandoning the *shared intentional state* ("We intend to pull off the heist") that was the foundation for everyone's participation. Her action reveals she no longer holds (or perhaps never truly held) the primitive "we-intend" state. This disrupts the very *frame* through which the others were acting. They weren't just doing their bit *for* the group; they were acting *as* the group in a fundamental mental sense.
      *   **What's Owed?** The others feel she owes them an explanation for abandoning the *shared project itself*, not just her role in it. There's a deeper sense of fractured unity. The obligation is to the *collective endeavor as a mental reality* they all supposedly inhabited. The anger is less about practical harm (though that exists) and more about the dissolution of the "we" they thought they were part of ("We were *doing this together*! How can you just walk away from *us*?").
      *   **Your Scene:** Dialogue emphasizes the shattered collective mindset: "Eva, we're *in this*. Right now. *We're* hitting the vault. You can't just step out of *us* like this! What about *the job*? What about *us* doing this?" The focus is on the rupture of the shared intentional space.

  3.  **Gilbert's World (Violating the Plural Subject & Its Obligations):**
      *   **The Obligation:** This is the strongest. The bailer isn't just letting down individuals or abandoning a mental state; she is *violating an obligation inherent in the plural subject they jointly created*. By jointly committing to the heist, they formed a social entity with normative force. Bailing without the *consent* of the plural subject (i.e., the agreement of the others, or under conditions they accept) is a fundamental breach of the obligations *to the group itself* and *to each other as members*. It's akin to desertion or breach of contract *with the collective*.
      *   **What's Owed?** The others feel she owes *the group* compliance, or at minimum, a very compelling justification *to the group* for release from the commitment. They have a *right*, as fellow members of the plural subject, to demand her participation or hold her accountable for the breach. The anger is righteous, based on the violation of a social contract they all entered ("We *committed*. All of us. Together. You don't get to just *leave* us hanging like this. You *owe* us – you owe *the crew*."). There's a strong sense of collective entitlement to her participation.
      *   **Your Scene:** Dialogue frames it as a violation of the crew entity: "Commitment, Eva. We made a *commitment*. All five. You don't walk two minutes out. That's not how this *works*. You're part of *this crew*, right now, for *this job*. You don't get to unilaterally dissolve that. Talk to *us*. What gives *you* the right to break *us*?" The emphasis is on the crew as a binding entity.

  **The Crux: Ordinary Promise vs. Collective Obligation**

  *   **Bratman:** It's *like* breaking a complex set of intertwined promises, heavily reliant on mutual expectations. The obligation is *to the individuals* based on interdependence.
  *   **Searle:** It's breaking the *shared mental framework* of collective action. The obligation is to the *integrity of the "we" intention* they all (supposedly) shared.
  *   **Gilbert:** It's **fundamentally different** from an ordinary promise. It's violating an obligation *created by and owed to the collective entity itself* and its members *as members*. This is a distinct kind of social/moral fact generated by joint commitment. The others aren't just disappointed individuals; they are *wronged members* of the plural subject.

  **For Your Novel:**

  *   **Bratman:** Creates tension based on practical interdependence and shattered personal trust. The crew's anger is focused on the *practical disaster* and *personal* betrayal. "You screwed *me* over!"
  *   **Searle:** Creates tension based on the shattering of group unity and shared purpose. The crew feels a deeper existential betrayal of the collective spirit. "You abandoned *us*!"
  *   **Gilbert:** Creates the strongest sense of *rightful entitlement* and *binding obligation*. The crew feels Eva is violating the *rules of the crew itself*. Their demand for her to stay isn't just pragmatic or emotional; it's presented as her *duty*. "You *owe* the crew!"

  **Recommendation:** For a heist crew, where the stakes are high, trust is paramount, and "crew before everything" is often a code, **Gilbert's framework provides the richest and most dramatically potent foundation.** It justifies the intense, almost visceral reaction the others would have to a last-minute bailout. It transforms Eva's action from merely inconvenient or personally hurtful into a fundamental violation of the social pact that *is* the crew in that moment. This aligns perfectly with the genre's need for high stakes and deep bonds (or betrayals). It makes the "we're actually doing this together" moments feel like forging something real and binding, not just vibes. Use the crew's dialogue and internal reactions to reflect this sense of violated collective commitment and obligation to the plural subject they formed. Good luck with the draft – this philosophical grounding will make those moments sing!
