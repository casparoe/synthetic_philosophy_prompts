answer: |-
  ## MEMORANDUM

  **To:** Zoning Board of Appeals Rules Committee  
  **From:** [Your Name], Board Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Resolution for Discrepancies Between Findings Votes and Application Vote & Handling of Recent Case  

  **I. Background & The Problem Encountered**  
  As you know, our recent hearing exposed an ambiguity in our voting procedure when the votes on the individual statutory findings (Uniqueness & Neighborhood Character) achieve majority approval, but the subsequent vote on the *application itself* fails to achieve a majority. In this case:  
  *   **Uniqueness Finding:** Passed 3-2.  
  *   **Neighborhood Character Finding:** Passed 3-2.  
  *   **Application Vote:** Failed 2-3.  

  The Chair treated the passed findings as dispositive and granted the variance. A colleague argues the application vote should control. This situation highlights a known challenge in group decision-making, sometimes called the **"Doctrinal Paradox"** or **"Discursive Dilemma"** (your friend is correct). It arises when collective judgments on premises logically imply a conclusion, but a direct vote on that conclusion yields a different outcome.  

  **II. Recommendation: Which Vote Should Control?**  
  **Going forward, the votes on the individual statutory findings must control the outcome of the application.** The direct vote on the application should be treated as a formal confirmation step, not the dispositive vote. Here's why:  

  1.  **Legal Compliance is Paramount:** Our legal mandate is to apply specific statutory criteria. Granting a variance is *only* lawful if *all* required findings are met. A vote granting an application without positive findings on *all* prerequisites is legally vulnerable. Conversely, if the board collectively finds (by majority vote) that *all* legal prerequisites *are* met, denying the application lacks a legal basis. The findings *define* the legal conclusion.  
  2.  **The Findings *Are* the Decision:** The "application vote" is essentially asking: "Given the findings we just made, should we grant the variance?" If the findings satisfy the law, the logical answer is "Yes." If the findings do *not* satisfy the law, the answer must be "No." The application vote, in its purest form, *should* be a direct consequence of the findings votes.  
  3.  **Precision & Accountability:** Voting on findings forces members to engage directly with the legal requirements. It creates a clear record showing *why* the decision was made (or not made), which is crucial for transparency, judicial review, and public trust. A standalone application vote obscures the reasoning.  
  4.  **Addressing the Paradox:** The Doctrinal Paradox shows that aggregating votes on premises (findings) vs. conclusions (application) *can* yield different results. However, the legally binding elements are the premises (the findings). The law requires satisfaction of the findings, not a standalone majority vote on the conclusion independent of those findings. Prioritizing the findings votes respects the legal structure.  
  5.  **Mitigating the Strategic Voting Concern:** Your colleague raises a valid point: members *might* vote insincerely on findings to manipulate the outcome. However:  
      *   **All Systems Have Vulnerabilities:** No voting procedure is immune to strategic behavior. Members could *also* vote insincerely on a standalone application vote based on bias or external pressure, with *no* requirement to engage with the law.  
      *   **Findings Votes Raise the Bar for Strategy:** To manipulate the outcome via findings, a member would need to strategically vote *against* a finding they believe is true (or *for* one they believe is false) *and* anticipate how others will vote on *multiple* findings. This is harder and riskier (exposing insincerity) than simply voting "No" on an application based on a gut feeling.  
      *   **Focus on Deliberation:** Our best defense is fostering rigorous, evidence-based deliberation *before* votes, emphasizing the legal criteria and the importance of sincere judgment based on the record. Rules alone cannot eliminate bad faith, but prioritizing findings reinforces the *type* of reasoning we require.  

  **III. Handling the Recent Case & Applicant**  
  The Chair's ruling to grant the variance based on the passed findings was **a reasonable interpretation of our ambiguous rules at the time and should stand.** To reverse it now would create significant problems:  

  1.  **Reliance & Fairness:** The applicant acted in good faith reliance on the Board's official decision and obtained a permit. Revoking approval after this reliance would be manifestly unfair and potentially expose the town to legal liability (e.g., estoppel claims).  
  2.  **Legitimacy of Process:** While the procedure was ambiguous, the outcome was reached through our established voting process. Overturning it retroactively undermines the board's authority and the finality of its decisions.  
  3.  **Practicality:** Attempting to rescind a permit already issued based on a procedural technicality (where the Chair's interpretation was plausible) would be administratively messy and legally fraught.  

  **Therefore, the variance granted in the recent case should remain valid.** The focus of the Rules Committee is to prevent this ambiguity in *future* cases.

  **IV. Proposed Rule Amendment & Implementation**  
  To resolve this ambiguity definitively, I propose amending our Rules of Procedure as follows:  

  > **Section [X]: Voting Procedure on Variance Applications**  
  > ...  
  > (c) The Board shall vote separately on each required statutory finding necessary for the granting of a variance. A finding shall be deemed satisfied if approved by a majority of the members present and voting.  
  > **(d) If the Board, by separate majority votes, finds that all statutory prerequisites for the granting of a variance are satisfied, the variance shall be granted. If the Board fails to affirm any one of the required findings by majority vote, the variance shall be denied.**  
  > (e) A vote on the application itself ("Shall Variance Application [Number] be granted?") shall be taken following the findings votes. **This vote shall be considered a formal affirmation of the outcome determined by the findings votes under subsection (d), but shall not supersede that outcome.**  

  **For the Next Hearing (Likely Similar Structure):**  
  1.  **Clarify the Rule:** At the start of the hearing, the Chair should briefly explain the voting procedure, emphasizing that satisfaction of *all* findings by majority vote *requires* granting the variance, and failure on *any* finding *requires* denial. Explain the application vote is confirmatory.  
  2.  **Robust Deliberation:** Encourage thorough discussion on *each* finding, referencing evidence and legal standards. Remind members their duty is to apply the law sincerely to each finding based on the record.  
  3.  **Vote Sequentially:** Conduct votes strictly in order: Findings first (each individually), then application.  
  4.  **Chair's Declaration:** After the votes, the Chair should declare the outcome *based on the findings votes* ("As all required findings were satisfied by majority vote, the variance is granted" or "As the [Specific Finding] finding was not satisfied, the variance is denied"), then note the result of the application vote for the record.  

  **V. Conclusion: Acknowledging the Challenge**  
  Your friend is correct: the Doctrinal Paradox demonstrates that no aggregation method perfectly reconciles individual judgments on multiple premises with a collective conclusion in every instance. Prioritizing the findings votes, as recommended, best ensures our decisions are **legally sound, transparent, and focused on the statutory criteria** we are sworn to apply. It mitigates (though cannot eliminate) the risk of decisions divorced from legal justification. While strategic voting is a potential concern under any system, emphasizing sincere deliberation on the legally mandated findings provides the strongest foundation for legitimate and defensible decisions. I urge the Rules Committee to adopt the proposed amendment.
