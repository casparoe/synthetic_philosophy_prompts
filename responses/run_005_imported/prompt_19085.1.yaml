  - H2: Titan station not built (only Earth rooms) 
  - But you're in a room with Titan decor. 

  Now: 
  SSA: 
  - P(H1) prior 0.5 
  - P(you are in Titan-style room | H1) = 1 / 1001 (since one Titan room + 1000 Earth rooms) 
  - P(H2) = 0.5 
  - P(you are in Titan-style room | H2) = 0 (no Titan rooms) 
  But you are observing a Titan-style room! So SSA updates: 
  P(H1 | Titan room) ∝ (1/1001)*0.5 
  P(H2 | Titan room) ∝ 0 
  → H1 certain? That can't be right... 

  *realization* 
  Ah! The magic happens when the evidence is indexical but the reference class is global. 

  Final scenario: 
  - H1: 1000 Earth rooms + 1 Titan room 
  - H2: 1000 Earth rooms only 
  - You wake in a room with Titan decor. 

  SSA reasoning: 
  Total observers H1: 1001, H2: 1000 
  P(you are specifically in Titan room | H1) = 1/1001 
  P(you see Titan decor | H1) = 1/1001 (only Titan room has it) 
  P(see Titan decor | H2) = 0 
  So upon seeing Titan decor, SSA strongly favors H1 (since only possible under H1, and even there unlikely) 

  SIA reasoning: 
  Weights hypotheses by P(hypothesis | I exist) 
  P(I exist | H1) ∝ 1001 
  P(I exist | H2) ∝ 1000 
  Prior odds equal, so posterior odds (1001/1000) ≈ 1:1 
  Then conditional on existing and seeing Titan decor: 
  P(see Titan decor | H1 and I exist) = 1/1001 (since only one room type) 
  P(see Titan decor | H2 and I exist) = 0 
  So SIA gives: 
  P(H1 | Titan decor) ∝ (1001) * (1/1001) = 1 
  P(H2 | Titan decor) ∝ (1000) * 0 = 0 
  → H1 certain 

  Both converge here? No - wait SSA gives P(H1|data) = [ (1/1001)*0.5 ] / [ (1/1001)*0.5 + 0 ] = 1 
  Same as SIA? 

  *miscalculation* 
  For SSA: 
  Likelihood of data under H1: P(see Titan | H1) = P(you are in Titan room | H1) = 1/1001 
  Under H2: 0 
  So yes both say H1 certain. 

  *grumbles* Need a scenario where the evidence doesn't uniquely determine the hypothesis. 

  *third attempt - success* 
  Make the decor probabilistic. 
  Setup: 
  - Two hypotheses about universe size: Big (B) with 1000 observers, Small (S) with 100 observers. 
  - New twist: all observers see a unique number on their screen (1 to N for their universe). 
