reasoning: |-
  Okay, the user is clearly well-versed in anthropics, having read Bostrom and LessWrong content. They're frustrated with the repetitive use of the Presumptuous Philosopher and Doomsday Argument in the SSA vs SIA debate. They want something fresh - a new scenario where SSA and SIA diverge, plus the underlying mechanics.

