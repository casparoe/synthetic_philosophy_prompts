  - Plus follow-ups anticipating standard defenses 

  *Scratches head*... The philosopher will likely retreat to functionalist arguments ("If it plays the role, it counts!"). Follow-ups must preempt that. For example: if she argues webs function as memory, ask why that role isn't just sensory input. Or if she says trust is irrelevant for spiders, press how we define "reliability" without endorsement. 

  *Nods*... The bloat question is the killer app. If webs extend cognition, is a hermit crab's shell cognitive? Trapped insect twitches as "computation"? The follow-up should force her to choose: either accept absurd endpoints or admit arbitrary limits. 

  *Checks tone*... User wants "sharp" questions but this is collegial—no gotchas. Framing should be "help me understand" not "gotcha." *Makes note*: avoid adversarial phrasing. 

