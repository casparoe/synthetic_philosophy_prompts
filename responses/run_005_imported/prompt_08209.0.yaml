  ---

  ### Justifications

  #### **Move 1: Theo's Initial Claim**  
  *Score: 1 (Mostly right, but incomplete)*  
  Theo correctly identifies that the Knobe effect reveals an **evaluative component** embedded in folk judgments of intentionality. Empirical work (e.g., Knobe 2003) shows people consistently judge harmful side effects as "intentional" but not helpful ones, even with identical mental states. This aligns with the *Normative Bias Hypothesis*: moral evaluation shapes intention attribution. However, Theo overstates the "wired into the concept" claim. Later research shows the effect isn't *exclusively* moral (see Move 2), weakening the idea that moral badness is definitional to "intentional." Still, his core insight—evaluation isn't a distortion but part of competent application—holds merit.

  #### **Move 2: Simone's Challenge**  
  *Score: 2 (Clearly right)*  
  Simone correctly notes that the asymmetry persists in **non-moral norm-violation cases** (e.g., breaking etiquette or statistical norms). For example:  
  - If a CEO’s policy *unusually increases* office clutter (a non-moral "bad"), people call it intentional.  
  - If it *unusually decreases* clutter, they don’t (Uttich & Lombrozo 2010).  
  This refutes Theo’s claim that the effect is *specifically moral*. The asymmetry tracks **any norm deviation** (e.g., prudential, conventional, or statistical), suggesting a broader mechanism. Simone’s move is empirically robust and exposes a flaw in Theo’s initial model.

  #### **Move 3: Theo's Counter**  
  *Score: -1 (Mostly wrong, but not entirely baseless)*  
  Theo argues norm violations "smuggle in" evaluation, making non-moral cases "evaluative too." This is a weak deflection:  
  - **Circularity**: Redefining *all* norm departures (e.g., "unusual outcomes") as inherently "evaluative" stretches "evaluation" beyond recognition. Statistical norms (e.g., "most people don’t do X") lack inherent "should"; calling them "evaluative" is post-hoc relabeling.  
  - **Predictive Failure**: If *any* asymmetry is retroactively deemed "norm violation," the theory can’t predict *which* norms trigger the effect or why moral norms dominate. Empirical work shows moral violations amplify the effect (Cushman 2008), suggesting moral badness isn’t just one norm among others.  
  Theo’s move is a defensive retreat, not progress.

  #### **Move 4: Simone's Rebuttal**  
  *Score: 1 (Mostly right, but incomplete)**  
  Simone’s criticism of Theo’s circularity is **valid** (score +2 for this point). She correctly argues that if "norm violation" explains everything, it predicts nothing—a fatal flaw in scientific terms. Her alternative—that "intentionally" is used **pragmatically to assign blame**—has empirical support:  
  - People deny "intentional" for good outcomes to *avoid praising* the indifferent agent (Pettit & Knobe 2009).  
  - The effect diminishes when blame is irrelevant (e.g., if the CEO is replaced by a tornado).  
  However, Simone understates how deeply evaluation shapes *conceptual structure*. Evidence suggests moral evaluation doesn’t just "pin blame" superficially but modulates cognitive processes for intention attribution (e.g., via affect or counterfactual reasoning). Her "pragmatic use" claim is partially right but ignores that concepts *evolve* through social functions like blame.

  ---

  ### A Better Explanation: **The Deep Self Model**  
  Neither fully captured the leading alternative:  
  - **Theory**: People judge a side effect intentional if it aligns with the agent’s **core values** (e.g., harming the environment reveals the CEO’s *true indifference* to moral goods). Good outcomes don’t reflect deep values because the agent "doesn’t care" (Sripada 2010).  
  - **Why it’s better**:  
    1. Explains moral *and* non-moral cases: Unusual outcomes (e.g., office clutter) imply a disregard for norms, revealing "who the agent really is."  
    2. Avoids circularity: Deep self-concordance is testable (e.g., if the CEO *secretly* wanted to harm, intentionality judgments increase).  
    3. Accounts for dominance of moral norms: Moral violations more powerfully signal character (e.g., harming the environment is a stronger value indicator than cluttering an office).  

  ### Conclusion  
  - **Simone "won" overall**: She exposed the incompleteness of Theo’s moral-specific claim (Move 2) and his circular defense (Move 4).  
  - **Theo’s strongest point**: Evaluation *is* intrinsic to intention attribution (Move 1), but he failed to adapt to broader evidence.  
  - **Best resolution**: The Knobe effect arises because side-effect intentionality is a **proxy for character assessment** (Deep Self Model), where norm violations—especially moral ones—signal agentic indifference. This synthesizes evaluative and pragmatic insights while avoiding their pitfalls.
