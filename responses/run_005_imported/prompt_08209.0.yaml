  We are evaluating the argument between Theo and Simone about the Knobe effect. The Knobe effect shows that people are more likely to say a side effect was brought about intentionally when it is harmful (and the agent is indifferent) than when it is beneficial (with the same indifference). 

  The moves:

  1. **Theo's first move**: He says the concept "intentional" has an evaluative component wired into it, so a bad side effect counts as intentional and a good one doesn't. This is not a bias but a competent application of the concept.

  2. **Simone's response**: She says that the same asymmetry occurs even when the side effect is not morally bad but merely unusual or a departure from a norm. Therefore, the asymmetry is driven by a departure from a norm in general, not specifically moral badness.

  3. **Theo's counter**: He argues that calling something a "departure from a norm" already involves evaluation (i.e., that conforming to the norm would have been better). So, even in non-moral cases, there is an evaluative component, and thus her cases are just the same evaluative story in non-moral clothing.

  4. **Simone's rebuttal**: She claims that Theo's move is too cheap because if any asymmetry can be redescribed as a norm violation after the fact, then the theory doesn't predict anything and is just relabeling the data. She suggests that "intentionally" is being used loosely to assign blame, not that the concept of intention itself has ethics baked in.

  We are to assign scores from -2 (clearly wrong) to 2 (clearly right) for each move and then justify. Also, we are to consider if there is a better explanation.

  Let's break down each move:

  **Move 1: Theo's initial claim**
  Theo's claim that the concept of intentionality has an evaluative component is supported by the Knobe effect. Many philosophers and experimental philosophers have argued that moral evaluation influences our judgments of intentionality. This view is known as the "evaluative account" or "normative account". However, it is not without challenges. Some might argue that the asymmetry is due to other factors (like the agent's attitudes). But the move is plausible and has empirical support. However, it might be an oversimplification because the effect might also occur in non-moral norm violations. So, while it's a strong starting point, it might not capture the full picture.

  Score: 1 (mostly right, but might be incomplete) -> but note: we are scoring the move in the context of the debate. Since Simone will challenge it, we don't give it the highest score.

  **Move 2: Simone's challenge**
  Simone points to studies that show the Knobe effect in non-moral contexts (e.g., violating a conventional norm, or even a statistical norm). For example, if an action has a side effect that violates a rule of etiquette or is statistically abnormal, people are more likely to judge it as intentional. This challenges Theo's claim that the effect is specifically about moral badness. This is a valid point and shows that the effect is broader. This move is well-supported by empirical work (e.g., by Joshua Knobe and others).

  Score: 2 (clearly right) because it correctly points out that the effect extends beyond moral badness.

  **Move 3: Theo's counter**
  Theo argues that even in non-moral cases, a "departure from a norm" involves an evaluation (that the norm should be followed). This is a common response by proponents of the evaluative account. They might argue that norms (even non-moral ones) carry a kind of normative force. For example, if there is a norm of etiquette, then violating it is "bad" in a non-moral sense. Thus, the evaluative component is still present. This is a reasonable point and is defended by some philosophers (e.g., that norm violations inherently involve a kind of evaluation). However, it might be stretching the idea of "evaluation" too thin. Moreover, it could be seen as circular if we then define any context that produces the asymmetry as having a norm that was violated.

  Score: 0 (neutral) because it is a valid theoretical point but may be seen as an ad hoc extension of the evaluative account. It's not clearly wrong, but it might be too flexible.

  **Move 4: Simone's rebuttal**
  Simone argues that Theo's move is too cheap because it can always be applied after the fact. If we can always say that any asymmetry is due to a norm violation (by positing a norm after seeing the data), then the theory becomes unfalsifiable. This is a common criticism in philosophy of science: a theory that can explain any outcome doesn't actually predict anything. She then offers an alternative: that people are using "intentionally" loosely to assign blame (or praise) and that the concept of intention itself doesn't have ethics baked in. This alternative is known as the "pragmatic account" or "blame account". This move is strong because it points out a weakness in Theo's account and offers an alternative. However, the blame account has also been challenged (e.g., in cases where blame is controlled for, the effect still occurs). So, while her criticism of Theo is valid, her positive account might not be the only alternative.

  Score: 1 (mostly right on the criticism, but the alternative account is not without problems).

  Now, let's assign scores:

  - Move 1: Theo's initial claim is plausible and has support, but we now know it's incomplete because of non-moral cases. So we give it a 1.
  - Move 2: Simone's challenge is well-founded and correct. Score: 2.
  - Move 3: Theo's counter is defensible but might be seen as ad hoc. Score: 0 (it's a reasonable point but doesn't fully address the challenge).
  - Move 4: Simone's criticism of Theo's move is valid (the charge of being unfalsifiable is a real concern), but her alternative account (that "intentionally" is being used loosely to assign blame) is one among several and not clearly established. So we give the criticism a positive score and the alternative a neutral one, averaging to 1.

