answer: |-
  What a fascinating connection to draw - and kudos for engaging with Pascal beyond the usual soundbites. That fragment (**Pensée 298, Brunschvicg 103**) is indeed razor-sharp, and its ending is crucial for understanding his bleak realism. Let's walk through his logic step-by-step and apply it to the modern nonproliferation/UN system:

  **Pascal's Core Argument in Fragment 298:**

  1.  **The Fundamental Problem:** Justice and Force are fundamentally separate and often opposed. "Justice is subject to dispute; force is easily recognizable and beyond dispute." True Justice is an ideal, abstract, and debatable concept. Force is concrete, observable, and undeniable in its effects.
  2.  **The Human Failure:** Humans cannot reconcile this divide. We are incapable of making Justice inherently strong ("*puissant*") or Force inherently just ("*juste*").
  3.  **The Cynical Solution:** Faced with this impossibility, humanity resorts to a linguistic and conceptual sleight-of-hand: **"Thus, unable to make what is just strong, we have made what is strong just."** (*Ainsi, ne pouvant faire que ce qui est juste fût fort, on a fait que ce qui est fort fût juste.*) We sanctify existing power structures by *calling* them just. Might doesn't just *make* right; we actively *redefine* right as whatever the mighty do or possess.
  4.  **The Mechanism of Legitimization:** This isn't passive acceptance; it's an active process of creating legitimacy. We invent elaborate systems – laws, customs, titles, rituals, narratives – to clothe raw power in the robes of justice and legitimacy. This is "putting imagination to work" to make force palatable and stable. Kings aren't just strongmen; they are divinely ordained. Conquerors aren't just thieves; they bring civilization. The powerful define the terms of "justice."

  **Applying Pascal to the Modern Nonproliferation/UN System:**

  1.  **The "Cynical Prediction" Playing Out:**
      *   **The Veto Power:** Pascal would see the UN Security Council veto held by the P5 (US, Russia, China, UK, France) as the *perfect* embodiment of his principle. These states emerged victorious from WWII (Force) and *institutionalized* their preeminent power by granting themselves the legal right (Justice) to block any action against their interests. The "justice" of the veto system derives entirely from the pre-existing force of the victors, not from any abstract principle of fairness. Russia ignoring an ICC warrant *because* of its veto/nuclear power is precisely Pascal's point: the structure is designed so that their force *is* the de facto justice within that system regarding actions against them.
      *   **Nuclear Apartheid (NPT):** The Non-Proliferation Treaty formalizes a hierarchy based entirely on who had nuclear weapons by 1967 (Force). It declares this state of affairs "just" (preventing proliferation = good, maintaining arsenals = necessary for stability). The "inalienable right" to peaceful nuclear tech for non-weapon states is a legitimizing narrative, but the core bargain sanctifies the existing power (nukes) of the P5. Pascal would say this treaty doesn't *weld* justice to force; it *declares* the force possessed by the P5 *to be* the just foundation of the international order regarding nukes. The "justice" of non-proliferation applies only to those who didn't have the force to possess nukes before the treaty.
      *   **Enforcement Disparity:** Actions against non-nuclear, non-veto-wielding states (e.g., Iraq 1991, Libya 2011) versus the impunity of nuclear veto powers (e.g., Russia in Ukraine, US in Iraq 2003 arguably) starkly illustrates Pascal's point. Force determines *against whom* the rules (justice) can be effectively enforced. The rules themselves are bent or ignored when applied to the truly strong.

  2.  **Why it's NOT a "Rare Win" for Welding Force to Justice:**
      *   **Justice Remains Subservient:** In Pascal's view, the UN system doesn't subordinate force *to* justice. It subordinates the *concept* of international justice to the *reality* of existing power structures (veto, nukes). Justice is only applied where it doesn't fundamentally challenge the powerful.
      *   **Force Defines the Scope of Justice:** The system doesn't create a mechanism where true justice (e.g., holding a P5 leader accountable for aggression) can overcome their force (veto, nukes). Instead, the system *accepts* the limits imposed by that force and operates *within* the boundaries they set. Justice is confined to the spaces the powerful allow.
      *   **Legitimization, Not Transformation:** The UN and NPT provide a powerful *veneer* of legitimacy and order. They create rules, forums, and processes. But Pascal would argue this elaborate edifice primarily serves to *stabilize and legitimize* the underlying power hierarchy derived from WWII and nuclear weapons, not to establish a justice that transcends or controls that force. It makes the strong *appear* just by the very fact of the system's existence and their privileged place within it.

  **The Verdict (Through Pascal's Lens):**

  Pascal would see the modern international system, especially the UNSC veto and nuclear hierarchy, **not as a welding of force to justice, but as the quintessential, large-scale playing out of his cynical prediction.**

  *   **The Fragment's Ending is Key:** The ICC warrant ignored by Russia *because* of its force (nukes, veto) is the perfect modern illustration of "*unable to make what is just strong, we have made what is strong just.*" Russia's force renders the ICC's attempt at justice impotent *in this specific case*, demonstrating that the ultimate "justice" in the system respects the boundaries set by overwhelming force.
  *   **System as Sanctification:** The UN and NPT are the sophisticated 20th-century mechanisms for "making what is strong just." They provide the narratives, legal frameworks, and diplomatic rituals that transform the raw power of the victors of WWII and the nuclear club into the accepted, "just" foundation of international order.
  *   **Theological Context:** Remember, Pascal's bleak view of earthly justice stems from his belief that *true* justice is divine and unattainable by fallen humans. Earthly systems are inherently corrupted by *libido dominandi* (lust for power). The UN system, for all its aspirations, would appear to him as another inevitably flawed human construct where force, disguised by elaborate legitimizing structures, ultimately reigns. Its relative stability compared to total anarchy might be seen as a practical benefit, but not as a triumph of justice over force.

  **In essence:** The UN/non-proliferation system doesn't overcome Pascal's dilemma; it institutionalizes it at a global level. It doesn't weld force to justice; it dresses force in the ceremonial robes of justice and declares the ceremony itself to be the proof of its righteousness. The ignored ICC warrant isn't a system failure; it's the system working exactly as the underlying power dynamics, which Pascal understood so well, dictate.
