answer: |-
  ## Kiln-Side Metaphysics

  **Setting:** The pottery studio, mid-morning. The kiln has just cooled enough to unload. Gloved hands carefully lift out bisque-fired pieces – some perfect, others cracked or slumped. **MAYA** (late 20s, meticulous, philosophy minor) carefully places a slightly warped bowl on the cart. **LEO** (mid-30s, practical, been potting for years) pulls out a mug with a hairline crack spidering up its side. He sighs, holding it up to the light.

  **LEO:** (Shaking his head) Well, this one’s a goner. Shame. That speckled brown clay was beautiful. Back to the reclaim bucket for *this* lump.

  **MAYA:** (Looks up sharply) Back to reclaim? Leo, that’s not *just* the lump of clay anymore. It *was* a mug. Now it’s… well, a ruined mug. The *mug* didn’t survive the firing. But the *clay*? The clay obviously did – it’s right there in your hand, just arranged… tragically now.

  **LEO:** (Frowns, turning the cracked mug over) Hang on. What do you mean, "the mug didn’t survive"? It’s the same stuff! It was clay arranged mug-wise yesterday, now it’s clay arranged *cracked*-mug-wise. It’s just the clay, enduring a change in shape and structural integrity. There wasn’t some extra "mug-essence" sitting on top of the clay that got zapped away.

  **MAYA:** But that’s exactly the point! Think about persistence conditions. *Before* the bisque fire, that clay could have been reclaimed. Soaked, wedged, thrown again – totally flexible. *After* the fire? Chemically altered. Ceramic. Brittle. Unchangeable in its fundamental nature. *It can't go back.* The *clay* could have survived *not* becoming a mug. It could have been a bowl, or stayed a lump. But the *mug*? The mug *couldn't* survive being dissolved back into slurry! They have different modal properties – different possibilities for survival. Leibniz’s Law: if A and B have different properties, they can’t be identical. Pre-fire lump and post-fire mug have different modal properties. Therefore, distinct objects! The mug came into being *with* the firing and went out of being *with* the crack.

  **LEO:** (Places the cracked mug carefully on the cart, picks up a successful small vase) Okay, Leibniz. But *when*, precisely, Maya? When did the magic happen? Was it at 451°F? 1000°F? The kiln ramps up *slowly*. The clay dehydrates, organic matter burns off, particles start to sinter… it’s a gradual chemical metamorphosis. Is there a *single instant* where the clay-object winks out and the mug-object pops in? That sounds like a sorites paradox nightmare! One second it’s clay, the next it’s mug? What property changes *exactly then* that warrants creating a whole new object? It seems arbitrary! Much cleaner to say it’s one thing – the clay – undergoing a continuous, radical change. We just *describe* it differently at different stages: wet clay, leather-hard, greenware, bisqueware.

  **MAYA:** The *when* is fuzzy, sure, like most boundaries in nature. Dawn isn't a single instant, but night and day are still distinct! The persistence conditions difference is real. And your "one thing" view has its own monster: the grounding problem. *What* grounds the difference in modal properties? *Why* can't the bisque-fired mug survive being slurried? It’s not just water aversion; its molecular structure is locked. But if it’s *just* the clay, and the clay was always potentially this ceramic stuff, why couldn’t the *pre-fire* lump survive becoming ceramic? It *did* survive! That’s *your* view! But on *my* view, it’s clear: the lump survived the firing *as the lump*, gaining new ceramic properties. The *mug*, however, a distinct object coinciding with the lump *after* shaping and *requiring* that fired state to exist, *couldn’t* survive dissolution because dissolution destroys its essential property – being fired ceramic. The modal difference is grounded in the distinct essential properties of the two coinciding objects.

  **LEO:** (Leans against the kiln, thoughtful) Distinct essential properties... born at some vague kiln temperature? So, before firing, there was just clay. Then, during firing, at some point, *poof* – a new ceramic object materializes, perfectly coinciding with the clay object that’s still there? Now I have *two* things in exactly the same place, made of exactly the same particles? That feels ontologically extravagant! What evidence is there for this second entity besides our way of talking? We *could* describe everything just in terms of the clay’s state: plastic, dry, vitrified, cracked. Adding a whole new object at firing feels like linguistic magic, not reality. The "mug" is just a phase the clay is going through, like ice is a phase of water. We don’t say an ice cube and the water it’s made from are two distinct coincident objects when it freezes!

  **MAYA:** But water *can* turn back to liquid! Ceramic *can't* turn back to plastic clay! That’s the irreversible chemical bond. That’s the key! And it’s not magic; it’s recognizing that form and function, locked in by irreversible change, create a new entity with its *own* persistence conditions. Look at that cracked mug. (Points) The *clay* is still there, Leo. It’s still ceramic material. It hasn’t vanished. But the *mug* – the vessel designed to hold coffee without leaking – *is* gone. Its function is destroyed. Its form is fatally compromised. The lump of ceramic material persists, yes. But the thing we *called* ‘the mug’, the artifact defined by that form and function? It ceased to be. You wouldn’t try to sell *that* as a mug, would you? You call it ‘reclaim’. You acknowledge its identity reverted to just… material. Because the *object* defined by its fired form is dead.

  **LEO:** (Picks up the cracked mug again, runs a thumb over the crack. A long pause) Okay... you score a point on the reclaim bucket. I wouldn’t call *this* a mug anymore. It’s scrap. But is that because a distinct "mug-object" perished, or just because *this particular arrangement* of the clay – the arrangement that *allowed* us to usefully call it a mug – has been catastrophically altered? The *clay* (now ceramic) is scrap. Its mug-*arrangement* is ruined. But the underlying substance? Still just… stuff. Changed stuff. I still balk at multiplying entities. That successful vase? (Gestures to the one he placed earlier) It’s the same clay I wedged Tuesday, just finally stable. I shaped it, it dried, it fired. One continuous journey for one lump of earth. Calling it two distinct objects coinciding after firing… it feels like solving a problem that doesn’t exist outside philosophy class. The crack is just damage to the one thing, not the death of a coincident twin.

  **MAYA:** (Smiles faintly, picking up a perfectly fired cup) Then pour water into that cracked mug and tell me it's just 'damaged clay'. The leak proves the *functional object* is gone. The lump remains. Two stories, one lump. The kiln makes the difference undeniable. Pass me that tongs? This cup survived. Both the cup *and* the clay made it. This time.

  *(They continue unloading, the cracked mug sitting on the cart between them – a silent, tangible argument.)*
