answer: |-
  ## The Unsettled Fare: A Dialogue at Town's Edge

  *(The scene: A dusty roadside diner just outside town. HITCHHIKER, still parched but alive, stares at ten crisp $100 bills on the table. CDT FRIEND slides a milkshake towards her.)*

  **CDT Friend:** Look, I'm thrilled you're alive. Seriously. But handing over that cash? Pure sentiment. The ride’s done. The driver’s gone. Paying her now can't *cause* the ride to have happened. It’s fixed. Keeping the money gives you $1000 *and* the ride. Paying gives you just the ride. Strict dominance. End of story. Why create a loss where none exists?

  **Hitchhiker:** It’s not about causing the *past* ride. It’s about what kind of *agent* I am, and crucially, what kind of agent I *was able to be* back in the desert. My sincere intention *then* – the one the detector saw – wasn’t just a fleeting whim. It was a *commitment* to a principle: "If you save me, I pay." Breaking that commitment *now* reveals my intention *then* was… what? A temporary instrumental lie to the universe? But the detector saw *sincerity*. How can I be sincere *then* if I repudiate the commitment *now*?

  **CDT Friend:** Sincerity in the moment! That's all the detector cared about. It scanned your brain-state *at t1* (in the desert). It saw a brain-state consistent with "I will pay at t2." That brain-state *caused* the ride. Done. Your brain-state *now* at t3 (in town) is irrelevant to what caused the ride. You fulfilled the causal requirement *then*. You are free *now*. Holding you to the *outcome* of a past intention ignores the causal separation. Intentions aren't magical bonds; they're brain states that cause actions *later*. The later action happened – the ride. The *money action* is causally inert regarding the ride.

  **Hitchhiker:** But my *ability* to form that sincere intention *then* depended precisely on my disposition to *follow through* *now*. Gauthier had it right: I’m a *constrained maximizer*. My rationality includes the capacity to commit to beneficial cooperative schemes *even when*, viewed myopically at the payoff moment, defection seems better. The driver’s detector wasn’t just scanning a momentary blip; it was scanning the *disposition* that makes me trustworthy. If I defect now, it proves I *lacked* that disposition then. The detector *shouldn’t* have let me in! My current action *constitutively defines* what my past intention truly was.

  **CDT Friend:** That's mystical! The detector reads *current* neurological markers indicative of *current* intention. It doesn't peer into the future or see "dispositions." It saw a state *S* at *t1* highly correlated with paying at *t2*. *S* existed. *S* caused the ride. Whether *S* was sustained by a rock-solid disposition or a flimsy self-deception is irrelevant *now*. The causal chain is complete. You're trying to retroactively change the *meaning* of *S* based on what you do later, but meaning doesn't cause rides, brain states do. Your action now only affects the future: you have $1000 less.

  **Hitchhiker:** So you reduce me to a series of causally disconnected time-slices? That’s not how rationality works in a temporally extended life! McClennen’s "resolute choice" captures this: I adopted a *plan* in the desert – "Intend sincerely, get saved, pay." Resoluteness means *sticking to the plan* when the sub-plan (paying) comes due, *because* it was part of the optimal overall strategy. Abandoning the plan *now* makes the initial choice *less than optimal*. It’s dynamically inconsistent! Sure, *this slice* gains $1000, but the *earlier slice* only got saved because it (falsely) projected a later slice that *would* pay. The *whole agent* is worse off because it can't sustain cooperation.

  **CDT Friend:** "Worse off" how? The earlier slice *got its payoff*: survival! It achieved its goal *by causing the ride*. What the later slice does doesn't harm the earlier slice; it's gone! CDT *is* consistent across time: each slice maximizes *its* expected utility given the fixed past and the possible futures. At *t1*, given the detector, intending sincerely (projecting payment) was optimal – it caused survival. At *t3*, given the fixed fact of survival, keeping the money is optimal – it causes wealth retention. Each slice acts rationally *for itself*. This "whole agent" talk is a fuzzy aggregate. Rationality is local, causal, and temporal.

  **Hitchhiker:** But that localism destroys the possibility of the very cooperation that saved me! The driver relies on agents who are *resolute* – who *will* pay *even when* CDT screams not to. That's Parfit's "rational irrationality" – being "irrational" by the myopic, causal standard *at t3* is *required* to be the kind of agent who can *rationally benefit* from the cooperative scheme *at t1*. It’s not irrationality; it’s *higher-order functional rationality*. Functional Decision Theory says: "Which decision rule, if followed consistently, yields the best outcomes?" The rule "Pay in Parfit cases" gets me saved *and* costs $1000. CDT's rule ("Never pay if the cause is fixed") gets me dead in the desert. FDT wins.

  **CDT Friend:** FDT smuggles in a kind of spooky self-prediction! It assumes my current decision *controls* what the detector saw in the past, which it causally cannot. CDT's rule doesn't *always* lose. If I *knew* I was a resolute FDT agent, I *might* get saved. But if I'm a CDT agent, I know I *won't* pay later, so I *can't* form the sincere intention *now* – the detector would see my self-knowledge! The driver picks up resolute agents and avoids self-aware CDT agents. But *if* a CDT agent somehow magically formed the sincere intention (perhaps through self-deception), they get the ride *and* keep the money! They strictly dominate the resolute agent who pays. CDT *exploits* the system when possible. Why be the sucker who pays?

  **Hitchhiker:** Because the "sucker" is alive! Your "magical self-deception" scenario is incoherent. How can a committed CDT agent sincerely intend to do something they *know* is CDT-irrational later? The detector would see the conflict, the lack of true commitment. The *only* stable agents who *get saved* are those whose decision rule *includes* paying later. FDT isn't spooky; it's acknowledging that rational choice must account for the *logical dependencies* between our choices at different times and how we are *categorized* by others (or detectors) based on our rule. CDT's "exploit when possible" makes cooperation impossible precisely when it's most valuable – like when you're dying of thirst. CDT wins the battle ($1000) but loses the war (survival in cooperation-demanding scenarios).

  **CDT Friend:** And FDT wins the war by sometimes fighting battles it logically *should* lose, based on the actual causal power available *at the time of the battle*! You admit paying *now* has no causal power over the ride. You do it purely as a costly signal about your past self and your general rule – a signal to whom? The driver's gone! It's performative rationality, detached from actual causation. CDT deals with the world as it *is*: causes and effects. Your $1000 is buying... what? A clean conscience? A story for philosophers? Keep it. Buy more water. Be *causally* responsible for your future security.

  **Hitchhiker:** It's buying *integrity as a rational agent* capable of binding commitments. It's buying the *truth* of the intention that saved me. It's ensuring I *am* the kind of entity that detectors (or people) can trust *in the future*. And yes, maybe it’s buying the principle that allows cooperative schemes like this to exist at all. The $1000 isn't gone; it’s the price of admission to a world where promises mean something, even – *especially* – when only you and your principles are watching. The causal power is in sustaining the *rule*, not just the single event.

  **CDT Friend:** Principles don't quench future thirst. Cash does. The ride is over. The money is here. The causal graph has no arrow from "Pay Now" to "Got Saved." Keep it. *That's* rational.

  **Hitchhiker:** *(Hand hovering over the bills)* And *paying* it is what makes me the person who *could* be saved. I *am* that commitment.
  **CDT Friend:** *(Shakes head slowly)* And *keeping* it makes you the person who *was* saved and is now $1000 richer. The past is fixed. The future is yours. Choose.

  *(They lock eyes, the money untouched between them. The argument is spent, but the decision remains.)*
