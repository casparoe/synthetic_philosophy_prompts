answer: |-
  The tension between calibration and equal error rates arises from fundamental statistical constraints when base rates of reoffending differ across groups. Let's break this down intuitively with a minimal example.

  ### Core Concepts
  - **Calibration**: A risk score of 7 means a 70% chance of reoffending, **regardless of race**.  
    Example: Among all defendants (Black or white) given a score of 7, 70% reoffend.  
  - **Base Rate**: The overall reoffending rate in a group.  
    Example: Black defendants have a higher base rate (60%) than white defendants (30%).  
  - **Error Rates**:  
    - **False Positive Rate (FPR)**: % of non-reoffenders labeled high-risk.  
    - **False Negative Rate (FNR)**: % of reoffenders labeled low-risk.  

  ### Key Insight
  Calibration forces the tool to reflect ground-truth risk. If Group A has a higher base rate, the tool **must** assign more high-risk scores to Group A to stay calibrated. This inevitably skews error rates.  

  ---

  ### Worked Example
  Assume 100 Black defendants and 100 white defendants:  
  - **Black defendants**: Base rate = 60%  
    - 60 reoffend, 40 do not.  
  - **White defendants**: Base rate = 30%  
    - 30 reoffend, 70 do not.  

  #### Step 1: Enforce Calibration
  Suppose the tool uses only two scores:  
  - **High-risk (8)**: 80% reoffend (calibrated).  
  - **Low-risk (2)**: 20% reoffend (calibrated).  

  For **Black defendants**:  
  - Total reoffenders = 60.  
  - Let \( x \) = number of Black defendants labeled high-risk.  
  - Calibration requires:  
    \[
    \underbrace{0.8x}_{\text{high-risk reoff}} + \underbrace{0.2(100 - x)}_{\text{low-risk reoff}} = 60
    \]  
    Solve: \( 0.8x + 20 - 0.2x = 60 \) → \( 0.6x = 40 \) → \( x \approx 67 \).  
  - So:  
    - 67 labeled high-risk: \( 0.8 \times 67 \approx 54 \) reoffend.  
    - 33 labeled low-risk: \( 0.2 \times 33 \approx 7 \) reoffend.  

  For **White defendants**:  
  - Total reoffenders = 30.  
  - Let \( y \) = number labeled high-risk.  
    \[
    0.8y + 0.2(100 - y) = 30
    \]  
    Solve: \( 0.8y + 20 - 0.2y = 30 \) → \( 0.6y = 10 \) → \( y \approx 17 \).  
  - So:  
    - 17 labeled high-risk: \( 0.8 \times 17 \approx 14 \) reoffend.  
    - 83 labeled low-risk: \( 0.2 \times 83 \approx 17 \) reoffend.  

  #### Step 2: Calculate Error Rates
  - **False Positive Rate (FPR)**:  
    - **Black**: Non-reoffenders = 40.  
      Falsely labeled high-risk = Total high-risk - True high-risk reoff = \( 67 - 54 = 13 \).  
      \[
      \text{FPR}_{\text{Black}} = \frac{13}{40} = 32.5\%.
      \]  
    - **White**: Non-reoffenders = 70.  
      Falsely labeled high-risk = \( 17 - 14 = 3 \).  
      \[
      \text{FPR}_{\text{White}} = \frac{3}{70} \approx 4.3\%.
      \]  
    → **FPR gap: 28.2%** (Black > White).  

  - **False Negative Rate (FNR)**:  
    - **Black**: Reoffenders = 60.  
      Falsely labeled low-risk = 7.  
      \[
      \text{FNR}_{\text{Black}} = \frac{7}{60} \approx 11.7\%.
      \]  
    - **White**: Reoffenders = 30.  
      Falsely labeled low-risk = 17.  
      \[
      \text{FNR}_{\text{White}} = \frac{17}{30} \approx 56.7\%.
      \]  
    → **FNR gap: 45%** (White > Black).  

  ---

  ### Why This Happens
  1. **Base Rate Difference**:  
     Black defendants have more reoffenders (60 vs. 30). To stay calibrated, the tool **must** assign more high-risk scores to Black defendants (67 vs. 17).  

  2. **Error Rate Trade-off**:  
     - **FPR**: More high-risk labels for Black defendants → more non-reoffenders swept into the high-risk group.  
     - **FNR**: Fewer high-risk labels for White defendants → more reoffenders slip into the low-risk group.  

  3. **Impossibility Theorem**:  
     Calibration fixes the relationship between scores and reoffending. When base rates differ:  
     - Equal FPR would require similar high-risk label rates across groups.  
     - But calibration **forces** different label rates → FPR **cannot** be equal.  

  ### Practical Implication
  - **Vendor's View**: Fairness = calibration (scores match reality).  
  - **Public Defenders' View**: Fairness = equal FPR (similar burden of false alarms).  
  - **Conflict**: Base rate differences make these mutually exclusive.  

  This mathematical inevitability explains the ProPublica findings: well-calibrated tools **cannot** avoid disparate error rates when society exhibits disparate base rates. Your oversight board must now weigh which notion of fairness aligns with community values.
