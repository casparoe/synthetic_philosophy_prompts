prompt: |-
  As a journalist who covers science and ideas, I recently joined a mathematical society's research-standards committee as its public member; the committee is now drafting its first policy on AI-generated results. The case forcing the issue: a search system devised both the strategy and the case-by-case verification for a resolution to a long-standing graph-coloring conjecture, and a proof assistant has checked every branch, so mathematicians are about as sure of it as of any theorem in the literature. But unlike the four-color theorem, where humans at least supplied the reduction strategy and machines only ground through the cases, here no person, and nothing inspectable in the system itself, can say why the construction works or what else it would generalize to. Roughly half the committee wants to certify it as a theorem like any other, since mathematics answers to truth, not to anyone's feeling of understanding; the other half wants to log it as verified-but-unexplained, withholding theorem status and prize eligibility until someone supplies an account. Draft the committee's policy memo: recommend a classification and a review process, with reasoning solid enough to give the losing side something real to answer, not just a restatement of the winners' premises.
reasoning: |-
  We are drafting a policy memo for the committee. The key issue is whether to classify the AI-generated result (which has been verified by a proof assistant) as a full theorem or as a verified-but-unexplained result, withholding theorem status until a human-understandable account is provided.

  The two sides:
  - One side: Mathematics is about truth. If the result is verified by a trusted proof assistant (which has been thoroughly checked for soundness) and the verification covers every branch, then it is a theorem. The method of discovery (AI or human) is irrelevant.
  - The other side: Mathematics also values understanding. Without an explanation of why the construction works and what it might generalize, we have a verified fact but not a mathematical theorem in the full sense. Theorems should come with understanding, which is part of the tradition of mathematics.

  We must recommend a classification and a review process that is fair and provides solid reasoning for both sides.

  Proposed approach:
  1. We acknowledge that the verification by a proof assistant is a form of proof, and thus the result is true.
  2. However, we also recognize that mathematics as a discipline values human understanding and the ability to build on results. An unexplained proof does not contribute to the growth of mathematical knowledge in the same way.
  3. Therefore, we propose a two-tiered system:
     a. **Theorem status with an asterisk (or a new category):** The result is accepted as true and can be cited as such, but it is marked as "verified by machine without human-understandable proof" (or similar). This allows it to be used in further mathematical work, but with a caveat.
     b. We then create an incentive for providing a human-understandable account: the original result will be upgraded to a full theorem (without the asterisk) and become eligible for prizes once such an account is provided and peer-reviewed.

  Review process:
  1. For initial acceptance:
     - The proof assistant's verification must be done with a system that is widely trusted in the mathematical community (e.g., Coq, Lean, Isabelle) and the entire proof must be verified.
     - The code of the AI system that generated the proof and the verification process must be made publicly available for inspection (to the extent possible) to ensure there are no errors in the setup.
     - The committee (or a designated panel of experts) will review the verification setup and the proof assistant's output to confirm the verification.

  2. For upgrading to a full theorem:
     - A human-understandable account (which may be a traditional proof or a high-level explanation that makes the underlying ideas clear) must be provided and submitted for peer review.
     - The peer review will assess whether the account provides a satisfactory explanation of why the construction works and what it might generalize to (if applicable).
     - Once accepted by peer review, the result is upgraded and becomes eligible for prizes.

  Reasoning to address both sides:
  - To the side that wants full theorem status: We are accepting the result as true and allowing it to be used in the literature. This respects the objective truth of the result. The verification by a proof assistant is a form of proof, and we are not requiring human understanding for the truth of the result.
  - To the side that wants an explanation: We are withholding the full cultural status of "theorem" (without qualification) and prize eligibility until a human-understandable account is provided. This recognizes that mathematics is a human endeavor and that understanding is a key part of its advancement. The two-tiered system also incentivizes the production of such understanding.

  This approach also allows for the possibility that the AI-generated proof might be so complex that it is beyond human comprehension, but the community can still build on the result (with the asterisk) while working towards understanding.

  Draft memo:

  ---

  **MEMORANDUM**

  **To:** Members of the Research-Standards Committee  
  **From:** [Your Name], Public Member  
  **Date:** [Date]  
  **Subject:** Policy on AI-Generated Mathematical Results  

  ### Introduction
  This memo proposes a policy for the classification and review of mathematical results obtained with the aid of artificial intelligence (AI), particularly in cases where the AI system devises both the strategy and the verification of a proof, leaving no human-comprehensible explanation. The recent case of a graph-coloring conjecture resolved by an AI system, verified by a proof assistant but without human understanding, has prompted the need for this policy. Our goal is to balance the commitment to mathematical truth with the value of human understanding in advancing mathematical knowledge.

  ### Proposed Classification
  We recommend a two-tiered classification system:

  1. **Verified Result (VR):** A result that has been verified by a trusted proof assistant but lacks a human-understandable account of why the construction works and what it might generalize to. Such a result is accepted as true and may be cited in the literature as a verified fact. However, it will be clearly marked as a "Verified Result" (or "VR") to indicate the absence of a human-understandable proof. It will not be eligible for mathematical prizes at this stage.

  2. **Theorem (T):** The standard classification for a result that has either been proven by traditional means (with a human-understandable proof) or has been upgraded from a VR by the provision of a human-understandable account that has passed peer review. A Theorem is eligible for prizes and carries no special caveats.

  ### Review Process

  #### For Initial Acceptance as a Verified Result (VR)
  1. **Verification by Proof Assistant:** The result must be accompanied by a complete verification by a proof assistant that is widely trusted in the mathematical community (e.g., Coq, Lean, Isabelle). The verification must cover every branch of the proof.
  2. **Transparency:** The AI system that generated the proof and the verification process must be made publicly available (subject to reasonable constraints, such as proprietary concerns, but with as much transparency as possible). The committee may appoint a panel of experts to review the code and the verification setup to ensure the integrity of the process.
  3. **Committee Review:** The committee (or a designated panel) will review the verification and the transparency materials. If satisfied, the result will be classified as a Verified Result (VR) and published as such in the society's records and journals.

  #### For Upgrading a VR to a Theorem
  1. **Submission of Human-Understandable Account:** Any member of the mathematical community may submit a human-understandable account of the VR. This account may take the form of a traditional proof or a high-level explanation that makes the underlying ideas and generalizations clear.
  2. **Peer Review:** The account will undergo standard peer review by experts in the field. The review will assess whether the account provides a satisfactory explanation of the VR, including why the construction works and what it might generalize to (if applicable).
  3. **Committee Approval:** Upon positive peer review, the committee will upgrade the result to a Theorem (T). The result then becomes eligible for any mathematical prizes for which it may qualify (if the prize rules allow for such upgrades).

  ### Reasoning
  This policy balances two core values of mathematics: the pursuit of truth and the pursuit of understanding.

  - **Truth:** The VR classification acknowledges that a proof verified by a trusted proof assistant is a valid proof. It allows the result to enter the mathematical literature and be built upon, thus respecting the objective truth of the result.
    
  - **Understanding:** The requirement for a human-understandable account for full theorem status and prize eligibility recognizes that mathematics is a human endeavor. Understanding is essential for the growth of mathematical knowledge, as it allows for generalization, extension, and teaching. Without it, a result is a dead end.

  This approach also provides an incentive for the community to work towards understanding AI-generated results, which may lead to new insights and connections. The two-tiered system ensures that we do not reject the truth of AI-verified results, while also preserving the cultural and intellectual values of mathematics.

  ### Conclusion
  We recommend adopting this two-tiered classification and review process. It allows the society to embrace the use of AI in mathematical research without abandoning the human element that is central to the discipline. We believe this policy will stand as a model for other societies and will foster both innovation and understanding.

  We welcome discussion and amendments to this proposal.

