  Hmm, the core tension here is between statistical evidence and individual context. The reference class problem perfectly frames why the 91% is contested: the detector's accuracy was measured against some generic essay dataset, but the student represents a subgroup (non-native writers) where false positives are higher. The memo must acknowledge the 91% has *some* weight while showing why it's not decisive.

  The user's deeper needs are clear: they want the council to avoid two extremes—blindly trusting the number or discarding it completely. They also need procedural fairness (deadline awareness) and a reusable standard. The phrase "don't let the council off easy" suggests frustration with oversimplified arguments on both sides. 

  For the memo's structure, I'll start with the case facts, then unpack the reference class problem in plain terms. The analysis should hit three key points: (1) why 91% isn't a "probability" for this specific case, (2) how the student's defense changes the reference class, and (3) why other evidence must break the tie. The recommendation will hinge on investigating her writing history—a practical solution that respects both the detector's signal and its limitations.

  Notably, the strongest counterargument (that 91% is still strong evidence) deserves serious engagement. I'll concede that dismissing all stats would be unreasonable but argue that context reduces the weight here. The policy proposal—treating detectors as "investigative leads, not proof"—balances realism and fairness. 

  The tone must stay neutral and procedural; no philosophy jargon. References to "calibrated subgroups" and "corroboration" give the council concrete factors to evaluate. And crucially, the deadline pressure means recommending immediate steps: pull her past essays today.
answer: |-
  ## MEMORANDUM  
  **TO:** Honor Council Members  
  **FROM:** [Your Name], Student Member  
  **DATE:** [Date of Meeting]  
  **SUBJECT:** Framework for Evaluating AI Detector Evidence in Case # [Case Number] – Deadline: [Date + 2 Weeks from Flag]  

  ### I. Case Summary & Council Disagreement
  *   **Allegation:** Student's essay flagged by AI detector with "91% probability AI-generated."
  *   **Student Defense:** Denies using AI. Cites status as an international student and known detector bias against non-native English writing patterns (e.g., higher false positives due to sentence structure predictability).
  *   **Council Split:** 
      *   **Side A:** Views 91% as highly probative, nearing conclusive evidence.
      *   **Side B:** Views the 91% as meaningless or unreliable *for this specific student* due to potential bias.

  This disagreement reflects a core challenge in interpreting statistical evidence for individuals: **The Reference Class Problem.**

  ### II. The Reference Class Problem: Why 91% is Not "The Probability"
  The detector's "91% probability" is **not** the intrinsic probability *this specific essay* was AI-generated. It is a statistical output derived from the detector's performance on a **specific reference class** – typically, a large dataset of human-written and AI-generated texts used during its development/testing.

  *   **The Problem:** What is the "correct" reference class for *this student*? 
      *   The detector's reported accuracy (e.g., 99%) might be based on "all essays in our test set."
      *   However, evidence suggests performance degrades for specific subgroups, like **non-native English writers**. 
      *   If the false positive rate (FPR) for non-native writers is significantly higher (e.g., 10-20% instead of 1%), the *meaning* of "91%" changes drastically *for this student*. The "91%" tells us where the essay falls *relative to the detector's training data*, not an absolute truth about its origin for *this individual* in *this context*.

  **Consequence:** The 91% score **cannot be taken at face value** as the probability applicable to *this specific student* without considering the relevance of the reference class used to generate it. Ignoring the student's characteristics (international status) potentially uses the *wrong reference class*.

  ### III. Addressing the Strongest Counter-Argument: "91% is Still Strong Evidence"
  **The Valid Point:** Dismissing a high detector score *solely because probabilities for individuals are philosophically complex* is unreasonable. The score *is* evidence. It indicates the essay exhibits patterns strongly associated with AI output *within the detector's framework*. A high score *should* trigger scrutiny. Ignoring it entirely would be negligent.

  **The Critical Nuance:** The weight of this evidence is **context-dependent** and **calibration-dependent**. 
  1.  **Context:** The score exists alongside the student's credible defense (international status, known bias) and any other case evidence (prior work, writing style consistency, access/opportunity).
  2.  **Calibration:** The score's meaning depends on the detector's accuracy *for individuals like this student*. If the detector has a high FPR for non-native writers, a "91%" score is *less surprising* and *less probative* if the student is innocent than if she were a native writer. It becomes weaker evidence.

  **Conclusion on 91%:** The score **is relevant evidence**, but its **probative value is significantly diminished** by the student's membership in a subgroup (non-native English writers) where the detector is known to be less reliable. It cannot, alone, meet the standard of proof ("more likely than not" or "clear and convincing," per our bylaws) given the reasonable doubt introduced by the reference class problem and the specific defense.

  ### IV. Recommendation for This Case
  1.  **Do NOT treat the 91% score as conclusive proof.** Dismissing the case solely based on this score risks a fundamental error by applying an inappropriate reference class.
  2.  **Do NOT disregard the score entirely.** It warrants investigation *corroborated by other evidence*.
  3.  **Investigate Contextual Evidence:** Immediately request and compare:
      *   **The student's prior submitted work** (in this course and others). Does the flagged essay represent a significant, unexplainable deviation in style, vocabulary, grammar, or argument sophistication?
      *   **Draft versions or notes** for the flagged essay (if available).
      *   **Specific writing process details:** Can the student articulate their research, outline, or specific arguments convincingly?
      *   **Course-specific context:** Was the topic/content uniquely challenging? Were there unusual time pressures?
  4.  **Evaluate Holistically:** Weigh the detector score *alongside* the analysis of the student's writing history, the plausibility of her defense regarding bias, and any other relevant evidence. The detector score raises a flag; the *other evidence* must determine if that flag indicates misconduct *in this specific instance*.
  5.  **Deadline Action:** Initiate the request for prior work/evidence **immediately** ([Date]). Schedule review of this evidence for [Date - before deadline]. Our vote must occur by [Deadline Date].

  ### V. Proposed General Standard for Future AI Detector Cases
  The Honor Council should treat AI detector scores as **investigative leads, not determinative proof**. Their weight depends critically on:

  1.  **Acknowledged Limitations:** Explicitly recognize the reference class problem. Scores are statistical outputs based on specific training data, not absolute probabilities for an individual case.
  2.  **Relevant Subgroup Calibration:** If credible evidence suggests the student belongs to a subgroup for which the detector has documented higher error rates (e.g., non-native English writers, specific disciplines), the probative value of a high score is significantly reduced.
  3.  **Corroboration Requirement:** A high detector score, *especially* where potential bias exists, **must be corroborated by independent, contextual evidence** to support a finding of responsibility. This evidence includes:
      *   Significant deviation from the student's established writing style/ability.
      *   Inconsistencies within the submitted work (e.g., anomalous sections).
      *   Lack of credible process documentation (notes, drafts, research trail).
      *   Implausible explanations for the work's quality/content.
  4.  **Transparency:** Require instructors/administration to provide available information on the detector's known limitations and error rates for relevant subgroups when presenting detector evidence.

  **In essence:** The detector score opens the inquiry; traditional, individualized academic integrity investigation methods must close it. We cannot outsource our judgment to an algorithm plagued by the reference class problem, but we also cannot ignore the signal it provides when contextual evidence aligns.

  **Recommended Vote for This Case (Pending Further Evidence):** Based *solely* on the 91% score and the student's defense regarding known bias against non-native writers, the evidence is **insufficient** to find responsibility. However, this is contingent upon review of the requested prior work and contextual evidence. If that review reveals significant deviations supporting the detector's finding, the score regains weight as corroborating evidence. If the prior work is consistent, the defense is strengthened. Let us gather the evidence the *algorithm cannot see*.
