  Anscombe wrote that pamphlet blasting Oxford for giving Truman an honorary degree over the atomic bombings (i think it was called "Mr Truman's Degree"?), and her whole case was basically that the civilians in Hiroshima and Nagasaki were the intended target, not just tragic-but-foreseen damage from hitting some legit military objective — which is what made it murder rather than permissible collateral damage under her double-effect-style reasoning. She died in 2001, right around when the US drone/targeted-killing program was really ramping up, including "signature strikes," where people get killed based on suspicious behavior patterns rather than confirmed identity. Using her actual argument against Truman as the template, what do you think she'd say about that kind of campaign — does it count as intentionally killing the innocent in her sense, or is there a real disanalogy (like what "intending" a death even means when you're not sure who you're killing) that would make her judge it differently?
