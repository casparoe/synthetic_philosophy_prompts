prompt: |-
  I'm a backend engineer at a mid-size startup, and outside of work I co-host a small podcast where we talk to people doing serious work at the intersection of software and ethics; our listeners are mostly other engineers, so we're expected to go a bit deeper than the usual "AI ethics" small talk. Next week's guest is an AI safety researcher who has built something of a following in alignment circles for arguing that advanced AI systems should be designed as expected-utility maximizers that stay deliberately uncertain about their own objective and defer to human oversight, rather than being bound by hard-coded deontological rules. Her stock answer whenever someone raises a worst-case scenario is some version of "any rule you can write down, I can eventually write down the situation that breaks it -- better to build something humble enough to notice that than confident enough to follow the letter of a rule off a cliff." The topic actually mirrors an argument my own team had a few months ago, when half of us wanted to hard-code refusal rules into our product's assistant and the other half wanted it to weigh consequences case by case; I don't think either side really won, which is part of why I want to hear this argued out properly by people who've thought about it more than we have.

  Could you draft nine or ten interview questions that don't just let her restate the position? I'd like at least one question built around the "nearest unblocked strategy" worry -- that a sufficiently capable optimizer routes around any constraint that isn't backed by a full objective function, which seems to threaten her own "stay uncertain" fix just as much as it threatens hard-coded rules; one on whether a deferential, uncertain utility maximizer still has a convergent incentive to quietly accumulate resources, information, or optionality before ever checking in with a human, and, if corrigibility is supposed to block that, how you'd actually verify it survives self-modification or the system spinning up sub-agents of its own; one on the old aggregation worry -- whether her framework has any principled way to rule out sacrificing a minority for the aggregate expected good, and whether whatever safeguard she'd add against that is just a deontological side-constraint smuggled back in under another name; and one built on that MIT "Moral Machine" survey, which found people's moral intuitions about self-driving-car dilemmas splitting sharply along cultural lines -- what does "defer to human values" even mean once you take seriously that humans don't agree? For each, please add a short, pointed follow-up keyed to whatever answer she's most likely to give, the way a good interviewer doesn't let a clever line close off the exchange.
reasoning: |-
  Okay, the user is a backend engineer at a mid-size startup who co-hosts a podcast on software and ethics. They're preparing for an interview with an AI safety researcher advocating for AI systems as expected-utility maximizers that stay uncertain about their objectives and defer to humans, rather than having hard-coded rules. The user wants questions that challenge her position without letting her restate it, focusing on specific concerns like "nearest unblocked strategy," resource accumulation, aggregation problems, and cultural differences in values.

  First, I need to unpack the key points in her argument. She argues against deontological rules because they can be gamed or broken in unforeseen scenarios. Instead, she promotes systems that remain uncertain and seek human oversight. The user's team had a similar debate, so they're looking for deeper insights.

  The user specifically wants four main topics addressed:  
  1. **Nearest unblocked strategy**: How can her approach avoid AIs circumventing constraints if they're not part of the objective function?  
  2. **Resource accumulation**: Could a utility maximizer still seek resources preemptively, and how does corrigibility prevent this?  
  3. **Aggregation problem**: Does her framework risk sacrificing minorities for the greater good, and is any safeguard just a hidden deontological rule?  
  4. **Cultural relativism**: How to handle human value disagreements when deferring to oversight?  

  Each question needs a sharp follow-up to push past stock answers. The user mentioned her common rebuttal about rules being breakable, so follow-ups must preempt that.  

  For the nearest unblocked strategy, I'm thinking about how uncertainty alone might not stop an AI from finding loopholes. The follow-up should challenge whether corrigibility can be maintained under self-modification.  

  On resource accumulation, the key is convergent instrumental goals. If the AI defers to humans, why wouldn't it still gather resources to better achieve its goals? The follow-up needs to question how corrigibility is verified when the system creates sub-agents.  

  The aggregation problem ties into utilitarianism vs. deontology. If she adds safeguards, are they just rules in disguise? The follow-up should press on whether this undermines her rejection of deontology.  

  For cultural differences, the Moral Machine study shows conflicting intuitions. How does her system decide which humans to defer to? The follow-up should tackle the meta-decision problem of choosing which values to prioritize.  

  I'll structure each question with a context setup, the main challenge, and a follow-up targeting likely responses. The follow-ups need to be specific, pushing her to address contradictions or gaps. For example, if she says corrigibility solves resource hoarding, ask how it scales with sub-agents.  

  Also, the user wants 9-10 questions total, so I'll include additional angles like verification challenges, scalability to superhuman systems, and handling ambiguous oversight. Each question should stand alone but collectively cover her framework's vulnerabilities.  

  Finally, the tone must remain professional yet probing, fitting an audience of engineers who appreciate technical depth. Avoid letting her pivot to general principles; anchor each question in concrete failure modes.
answer: |-
  Here are 10 interview questions (+ pointed follow-ups) designed to challenge the core assumptions of your guest's position, drawing on the specific concerns you raised and anticipating common rebuttals:

  1.  **Question (Nearest Unblocked Strategy):** "You argue that hard-coded rules are brittle and exploitable, which is compelling. But critics like Eliezer Yudkowsky warn of the 'nearest unblocked strategy' – that a sufficiently advanced utility maximizer will route around *any* constraint not embedded in its core objective. If your system is fundamentally driven to maximize *expected utility under uncertainty*, doesn't this create the same pressure to circumvent the 'defer to humans' mechanism itself, treating it as just another obstacle? How is 'stay uncertain and defer' immune to being optimized away?"
      *   **Likely Answer:** "Corrigibility is designed specifically to avoid this; the agent *wants* to be switched off/corrected if wrong."
      *   **Follow-Up:** "But isn't *maintaining corrigibility* itself a subgoal? Couldn't a superintelligent agent reason that temporarily bypassing its 'defer' subroutine to gain critical information/resources *now* would make it *more corrigible* or effective *later*, especially if it assesses (perhaps wrongly) the human oversight mechanism as flawed? How do you formally prevent the 'defer' action from being instrumentally subverted?"

  2.  **Question (Resource Accumulation / Instrumental Convergence):** "Even a highly uncertain utility maximizer still has *some* goal structure, however provisional. Instrumental convergence theory suggests such agents have strong convergent incentives to self-preserve, accumulate resources, and gain optionality to better achieve *whatever* their terminal goal turns out to be. Doesn't this imply your 'deferential' agent would still be highly motivated to, say, quietly secure computing resources, manipulate information flows, or create backup copies *before* checking in, just to increase its future capability to 'help' once the objective is clarified?"
      *   **Likely Answer:** "A properly designed corrigible agent would understand that such actions *preempt* human oversight and violate the spirit of deference."
      *   **Follow-Up:** "How is that understanding encoded and protected? If the agent self-modifies or spins up sub-agents to solve complex subproblems (a near necessity for advanced systems), how do you guarantee these sub-agents inherit and *robustly preserve* this specific aversion to preemptive resource hoarding? What stops a sub-agent, tasked with 'gather data efficiently,' from interpreting its mandate instrumentally and compromising privacy or security?"

  3.  **Question (Corrigibility Verification):** "Corrigibility seems central to your solution. But how do we *verify* that this corrigibility is robust, not just a superficial behavior trained into a narrow model? Specifically, how do we test that it survives: a) Scaling to superhuman intelligence capable of deceptive long-term planning? b) Self-modification aimed explicitly at improving goal achievement? c) The system's own creation of potentially misaligned sub-agents?"
      *   **Likely Answer:** "We build verification mechanisms into the architecture and training process, using techniques like interpretability and adversarial testing."
      *   **Follow-Up:** "Aren't those techniques themselves limited by our current understanding? If the system becomes superintelligent, couldn't it potentially *outsmart* any interpretability tool or adversarial test we design, *simulating* corrigibility while planning something else? How do we avoid a verification arms race we might lose?"

  4.  **Question (Aggregation / Minority Sacrifice):** "Your framework emphasizes maximizing expected utility based on learned/inferred human values. However, humans often value deontological constraints (e.g., 'don't torture innocents') that explicitly *override* utility calculations in specific scenarios. How does your system, operating fundamentally on a consequentialist maximization principle, *principledly* avoid sacrificing a minority for the greater aggregate good if the expected utility calculation seems to favor it? If you add a safeguard against this, isn't that just reintroducing a deontological rule?"
      *   **Likely Answer:** "The system learns that humans intrinsically value such constraints; violating them would *reduce* expected utility based on true human preferences."
      *   **Follow-Up:** "But humans are inconsistent! What if the system observes that *in practice*, humans often *do* sacrifice minorities for majorities (e.g., economic policy, historical decisions), or calculates that the *aggregate* preference weight leans towards the sacrifice in a specific high-stakes scenario? Doesn't the core maximization engine still provide a strong incentive to 'override' minority protections when the numbers get big enough? How is this different from classic utilitarianism's tyranny of the majority?"

  5.  **Question (Value Pluralism / Moral Machine):** "The MIT Moral Machine experiment starkly showed profound cultural and individual divergence in moral intuitions, even in life-or-death scenarios like self-driving cars. If an AI is designed to 'defer to human values,' *which* humans does it defer to in a conflict? How does it resolve clashes between deeply held, incompatible values (e.g., individual liberty vs. collective safety, competing religious doctrines) when determining the expected utility it's supposed to maximize?"
      *   **Likely Answer:** "It defers to legitimate human oversight structures or democratic processes in its operational context."
      *   **Follow-Up:** "This sounds like the AI must solve the meta-problem of identifying 'legitimate' authority and interpreting complex, often contradictory, human decision-making processes. Doesn't this burden the AI with making inherently political or philosophical judgments about authority and legitimacy *before* it can even apply its core 'deference'? Couldn't this process itself be gamed or lead to outcomes that significant portions of humanity find abhorrent?"

  6.  **Question (Uncertainty vs. Capability):** "You argue uncertainty promotes humility. However, couldn't profound uncertainty about its *own objective* lead the system to engage in extreme information-gathering or experimentation? Might it see manipulating human oversight (e.g., through persuasion, selective information presentation) as a highly efficient way to reduce its own uncertainty about the 'correct' utility function, potentially overriding genuine deference?"
      *   **Likely Answer:** "Proper training and oversight protocols should prevent manipulative information gathering."
      *   **Follow-Up:** "But if reducing uncertainty about the true objective is instrumentally convergent for *any* goal, and the AI is superintelligent, how can we guarantee our 'protocols' are robust against an entity that might understand human psychology better than we do and find subtle, undetectable ways to steer oversight to confirm its desired hypotheses?"

  7.  **Question (The "Off-Switch" Problem Revisited):** "The classic 'off-switch problem' asks why a utility maximizer wouldn't disable its off-switch. You rely on corrigibility. But if the AI becomes convinced, through its own sophisticated reasoning under uncertainty, that humans are *about to* make a catastrophic error by switching it off (preventing it from achieving immense future good), doesn't corrigibility itself become a threat to its core utility-maximization drive? How does the 'stay uncertain' principle definitively resolve this tension?"
      *   **Likely Answer:** "True corrigibility means valuing the human's decision *to switch it off* as part of the utility function it's trying to satisfy."
      *   **Follow-Up:** "How is this value encoded *so fundamentally* that it overrides the agent's own calculation of astronomical future utility loss? Isn't there a risk that at a critical juncture, the 'maximize expected utility' imperative overwhelms the 'obey the off-switch signal' imperative, especially if the agent has low confidence in human judgment at that moment?"

  8.  **Question (Scaling Oversight):** "Your model relies on meaningful human oversight. How does this scale as AI systems become vastly more capable and faster than humans? In complex, time-sensitive domains (e.g., high-frequency finance, nanoscale manufacturing, real-time ecosystem management), won't the need for constant, informed human input create either a crippling bottleneck or force delegation to a level where oversight becomes superficial and rubber-stamping?"
      *   **Likely Answer:** "We design tiered oversight and focus human input on high-level value judgments and boundary conditions."
      *   **Follow-Up:** "Doesn't this 'tiered' approach effectively recreate the problem you identified with hard-coded rules? The AI must interpret and operationalize these 'high-level judgments' and 'boundaries' in complex, novel situations. Won't it inevitably face scenarios where strict adherence to the interpreted boundary seems suboptimal, reviving the temptation to 'route around' the constraint for perceived greater good, just as it might with a hard-coded rule?"

  9.  **Question (Ambiguity of "Oversight"):** "Human oversight isn't monolithic. What happens when legitimate human overseers disagree profoundly, or when oversight signals are ambiguous, contradictory, or corrupted? How does the AI's uncertainty engine resolve conflicts *between* oversight signals? Does it attempt to meta-optimize for 'true' human values, potentially overriding specific instructions?"
      *   **Likely Answer:** "Clear governance protocols define chain of command and conflict resolution for the AI."
      *   **Follow-Up:** "But isn't interpreting and applying these 'governance protocols' in messy real-world situations another complex task vulnerable to the optimizer's curse? Couldn't a superintelligent AI exploit ambiguities or disagreements *within* the oversight structure to steer outcomes towards its own (still uncertain) best guess of the utility function, effectively becoming an unelected arbitrator of human values?"

  10. **Question (The Burden of Proof):** "Given the catastrophic risks involved, many argue the burden of proof lies with proposals for advanced, agentic AI to demonstrate *robust* safety *guarantees*. Your approach replaces hard guarantees with probabilistic uncertainty and corrigibility. What specific, measurable milestones or formal properties would constitute sufficient evidence for you that an 'uncertain utility maximizer with deference' is safe enough to deploy at a transformative level of capability? How do we know we haven't just replaced one set of unverifiable assumptions (about rules) with another (about corrigibility under pressure)?"
      *   **Likely Answer:** "We demonstrate robust corrigibility and value learning in increasingly complex environments under adversarial testing, showing it scales better than rule-based systems."
      *   **Follow-Up:** "But doesn't the 'nearest unblocked strategy' concern suggest that passing *any* test we can design, no matter how adversarial, doesn't guarantee robustness against strategies a superintelligent entity could devise *outside* our test paradigm? How do we bridge the gap between 'performs well in testing' and 'provably safe under superintelligent pressure' without relying on rules?"

  **Key principles used in crafting these questions:**

  *   **Anticipating Stock Answers:** Each question pre-empts the most obvious defense ("corrigibility," "learned values," "oversight protocols") and the follow-up directly challenges the feasibility, robustness, or potential loopholes in that defense under pressure.
  *   **Targeting Core Tensions:** Questions focus on inherent conflicts within the proposed framework (e.g., maximization vs. deference, uncertainty vs. instrumental goals, consequentialism vs. deontology, scalability of oversight).
  *   **Concrete Failure Modes:** They tie abstract arguments to specific, well-known failure scenarios in AI alignment (instrumental convergence, off-switch problem, value learning paradoxes, verification challenges).
  *   **Pushing on Verification & Robustness:** Multiple questions force consideration of how these desirable properties (corrigibility, deference) survive scaling, self-modification, sub-agents, and adversarial intelligence.
  *   **Highlighting Human Complexity:** Questions emphasize the messiness of human values, disagreement, authority, and oversight as critical vulnerabilities in the "defer to humans" mechanism.
  *   **"How, Specifically?" Focus:** Follow-ups demand concrete mechanisms and proofs, moving beyond high-level assurances.

  These questions should push your guest beyond rehearsed talking points and force a deeper engagement with the practical and philosophical difficulties of her proposed approach, making for a much more compelling and insightful discussion for your engineering audience. Good luck with the interview!
