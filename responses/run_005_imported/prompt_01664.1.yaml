answer: |-
  This is one of the most difficult and emotionally charged situations adult children face. You're grappling with genuine love, practical realities, deep guilt, and complex questions about obligation. There is no easy answer, but let's break down the layers:

  1.  **Your Brother's Comment & Your Sister's Look:**
      *   **Projection/Guilt:** Your brother, who also lives away, suggesting "one of us" move back is classic projection. He likely feels guilt about his own distance and is deflecting it onto you (perhaps because you're the most recently moved, have the "better" job, or he perceives you as more flexible). Saying it aloud might ease *his* discomfort.
      *   **Your Sister's Pressure:** Your sister's look likely stems from feeling overwhelmed or resentful. Living nearby often means she *already* bears an unequal burden (even small things like checking in, driving to appointments, dealing with minor crises). She might feel it's "someone else's turn," and you're the obvious target since you moved *after* the health issues became clearer. Her look was a silent plea for solidarity or shared sacrifice.
      *   **"The Right Thing":** This phrase is loaded with unexamined cultural assumptions. It implies there's only *one* morally correct path (physical proximity and personal sacrifice), ignoring the complexity of modern lives, careers, and relationships. It's emotionally manipulative, even if unintentionally.

  2.  **Your Valid Concerns:**
      *   **Career Impact:** Uprooting now could derail years of hard work and momentum. Finding an equivalent role back home isn't guaranteed.
      *   **Partner's Life:** This isn't just your decision. Asking your partner to abandon their career and community is a massive ask with potential for resentment.
      *   **Financial Reality:** Moving to a HCOL area, potentially taking a pay cut, and entering a tough housing market creates significant financial strain and risk.
      *   **Sustainability:** Sacrificing your career and financial stability *might* help short-term, but could create long-term dependency or resentment that actually harms the care dynamic later.
      *   **Resources:** You rightly point out that hiring help is a valid and often *more appropriate* solution for specific care needs. Your parents' savings exist for this purpose.

  3.  **The Question of Obligation:**
      *   **Love vs. Obligation:** You clearly love your parents. Obligation rooted in love is different from obligation rooted in guilt or societal pressure. Your love motivates you to find the *best* solution, not necessarily the most self-sacrificing one.
      *   **Defining "Obligation":** Your obligation is to ensure your parents' well-being and dignity are cared for. It is *not* an obligation to:
          *   Be the primary, hands-on caregiver yourself.
          *   Live in physical proximity.
          *   Sacrifice your career, relationship, and financial security.
          *   Fulfill your siblings' expectations of how *you* should contribute.
      *   **Shared Responsibility:** The obligation belongs to *all* siblings, and how it's fulfilled can vary based on individual circumstances. Proximity is just one factor.

  4.  **What You Might Be "Not Seeing":**
      *   **Your Sister's Potential Burnout:** Her look might signal real exhaustion or fear of being solely responsible. She needs support, but that support doesn't have to be you moving back.
      *   **Your Brother's Unspoken Anxiety:** His comment likely masks his own worry and guilt about being far away. He might be looking for reassurance or a way to share the emotional load.
      *   **The Spectrum of "Help":** Moving back is presented as the ultimate solution, but help exists on a spectrum. Significant contributions can be made remotely and financially.

  **A More Balanced Approach (What You Owe & What You Can Do):**

  1.  **Initiate a Calm, Sibling-Only Conversation:** Avoid blaming. Frame it as: "I've been thinking a lot since the dinner about Mom's care and how we, as a team, can best support Mom and Dad. Moving back isn't feasible for me for X, Y, Z concrete reasons [career, partner, finances]. But I *am* committed to helping. Let's talk realistically about what Mom and Dad actually need and how we can *all* contribute fairly."
  2.  **Focus on Needs, Not Prescriptions:** Shift the conversation from "who moves" to:
      *   What specific tasks does Mom need help with now? (ADLs - Activities of Daily Living like bathing, dressing, meals? Medical appointments? Transportation? Housework? Financial management?)
      *   What resources do Mom and Dad *have*? (Savings, insurance, pensions, home equity?)
      *   What are the local resources? (Agencies on Aging, home health agencies, geriatric care managers, meal delivery, transportation services, senior centers?)
      *   What can your sister realistically handle *without* burning out?
      *   What can you and your brother contribute *remotely and financially*?
  3.  **Your Potential Contributions (Without Moving):**
      *   **Financial:** Commit to a specific, regular financial contribution to offset the cost of professional care. This is tangible and directly addresses the need.
      *   **Remote Coordination:** Take the lead on research (care options, benefits, local services), manage finances/bills online, schedule appointments, handle insurance paperwork, be the point person for communication with care managers.
      *   **Logistical Support:** Order groceries, medications, supplies online for delivery. Arrange and pay for cleaning services, meal services, or handyman tasks.
      *   **Emotional Support & Visits:** Regular calls/video chats with your parents. Plan more frequent visits than usual (e.g., one week every 6-8 weeks) specifically to relieve your sister, tackle projects, and spend quality time. Ensure your visits are *useful*.
      *   **Support Your Sister:** Acknowledge her burden. Ask what *specific* help *she* needs (even small things like researching something, making a call she dreads, covering a weekend so she can get away). Send her respite care vouchers or treat her to something relaxing.
  4.  **Advocate for Professional Help:** Frame this positively: "To ensure Mom gets the best possible care consistently and to prevent burnout for any of us, especially [Sister's Name], we should seriously invest in professional support. Let's figure out what that looks like and how we can all contribute to making it happen." A professional Geriatric Care Manager can be invaluable for assessment, planning, and coordination.
  5.  **Address Your Parents Directly (Gently):** Have a loving conversation with them. Ask about *their* preferences and fears. Do they *want* one of you to move back? Would they prefer to stay in their home with paid help? Are they open to exploring assisted living? Respect their autonomy where possible.

  **Are you being a bad person?** Absolutely not. Feeling conflicted proves you care deeply. Recognizing the massive cost of moving back and seeking alternatives is responsible. Prioritizing your hard-earned career, your committed relationship, and your financial stability does not negate your love or your willingness to help. It makes you human.

  **The key is shifting the narrative:**

  *   **From:** "I must move back or I'm failing."
  *   **To:** "How can we, as a family unit (parents + siblings + professionals), ensure Mom and Dad are safe, well-cared for, and dignified, while respecting everyone's realities and capacities?"

  This requires difficult conversations, compromise, and financial commitment from *all* siblings. Your obligation is to participate meaningfully, creatively, and financially in finding that solution – not to be the sacrificial lamb. Stand firm on your boundaries (not moving), but step up significantly in the ways you realistically can. That is the true "right thing."
