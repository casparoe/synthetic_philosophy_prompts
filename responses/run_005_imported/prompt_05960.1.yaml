  First, I need to recall the basics of expressivism. When someone says "Stealing is wrong," they're not stating a fact but expressing disapproval, like booing. But when such a statement is in a conditional, like "If stealing is wrong, then..." it's not being asserted. The expressivist can't just say the speaker is disapproving of stealing here because the conditional isn't asserting that stealing is wrong. So the meaning shifts. 

  The user's instinct is that the whole conditional could express a complex attitude. But why doesn't that work? The issue is consistency. The same phrase "stealing is wrong" has to mean the same thing whether it's asserted or in a conditional. Otherwise, arguments using modus ponens would be invalid. For example, if "If P, then Q" and "P" are both accepted, then "Q" must follow. But if "P" in the premise is just an attitude, and "P" in the conditional is something else, the inference breaks. 

  The user mentioned summaries they've read didn't click. Maybe they need a concrete example. Let's use stealing. Suppose someone says, "If stealing is wrong, then getting your brother to steal is wrong." They accept this. Then they say, "Stealing is wrong." So they should conclude "Getting your brother to steal is wrong." But for expressivists, "stealing is wrong" in the premise is expressing disapproval, while in the conditional, it's part of a hypothetical. The disapproval isn't activated. So when they assert "stealing is wrong," they're disapproving, but the conditional didn't involve that disapproval. Thus, the inference doesn't hold because the two instances of "stealing is wrong" aren't the same. 

  The user's friend might not have explained this clearly. The core problem is the univocality of meaning. Expressivists need to explain how moral terms retain consistent meaning across different contexts. If they say the conditional expresses a different attitude, like disapproval of disapproving of stealing without disapproving of getting others to steal, that might work. But then they must show this complex attitude matches our logical intuitions. For instance, why does accepting both premises lead to the conclusion? That requires mapping these attitudes to logical structures, which is tricky. 

  Also, the user might not realize that the challenge is providing a unified theory. Expressivists like Blackburn and Gibbard have tried with higher-order attitudes or norms of planning. But it's complex. The user's deeper need is understanding why philosophers see this as a major hurdle, not just a technicality. They want to grasp the significance beyond summaries. 

  So, the real difficulty is maintaining logical validity while staying true to expressivism's core idea. Without a consistent meaning, moral arguments fall apart. The user needs to see that expressivism isn't dismissed because of Frege-Geach, but it forces a more sophisticated theory, which is still debated. That's why it's a pivotal problem in meta-ethics.
answer: |-
  I completely understand why the Frege-Geach problem feels elusive! It's a subtle but crucial challenge for expressivism, and your instinct about expressing "more complicated attitudes" is exactly where expressivists *start* to respond. The real difficulty lies in explaining **how those complex attitudes can make moral arguments logically valid in the way they clearly seem to be.** Let's break it down step-by-step:

  ### The Core Expressivist Idea (Recap)
  *   When you assert **"Lying is wrong" (asserted)**, you are **expressing your disapproval of lying** (like "Boo lying!").
  *   This is *not* describing a fact "out there" in the world; it's expressing your non-cognitive attitude.

  ### The Problem: Embedded Sentences
  Now, consider an argument using a conditional:
  1.  **Premise 1:** If lying is wrong, then getting your little brother to lie is wrong. *(This is a **conditional**, unasserted)*
  2.  **Premise 2:** Lying is wrong. *(This is **asserted**)*
  3.  **Conclusion:** Therefore, getting your little brother to lie is wrong. *(This **follows logically**)*

  This argument seems **logically valid**. If you accept both premises, you *must* accept the conclusion. Modus Ponens works.

  ### Why This is a Problem *Specifically* for Expressivism
  The expressivist needs to explain what's going on in **Premise 1**. What mental state does *this* sentence express?

  1.  **It's NOT expressing disapproval of lying:** The speaker isn't *asserting* "Lying is wrong" here. They're just *considering the possibility*. Saying "If lying is wrong..." doesn't mean the speaker disapproves of lying right now. You could say this premise even if you *don't* think lying is wrong (e.g., "If lying is wrong [which I'm not saying it is], then..."). So, the simple "Boo lying!" attitude *isn't being expressed* in Premise 1.
  2.  **The Meaning Must Be Consistent:** For the argument to be logically valid, the phrase **"lying is wrong"** must mean the *exact same thing* in both Premise 1 and Premise 2. Otherwise, it's like using the same word with two different meanings – the logic breaks. Premise 2 uses "lying is wrong" to express disapproval. So, Premise 1 *must* also involve that same meaning somehow, even though it's not being used to express disapproval directly.
  3.  **The Challenge:** How can "lying is wrong" in the *unasserted*, *hypothetical* context of Premise 1 involve the *same* kind of attitude expression ("Boo lying!") that it does when it's asserted in Premise 2, *without* the speaker actually disapproving of lying when uttering Premise 1?

  ### Your Instinctive Response & Why It's Necessary But Insufficient
  Your idea is spot on: **Premise 1 expresses a more complex attitude.**

  *   **What complex attitude?** A natural suggestion is that Premise 1 expresses an attitude *about attitudes*. For example:
      *   "**I disapprove of disapproving of lying while *not* disapproving of getting your little brother to lie.**"
      *   Or "**I have a plan to disapprove of getting your little brother to lie in any situation where I disapprove of lying.**"

  *   **Why is this necessary?** Because Premise 1 clearly expresses *some* kind of commitment connecting the disapproval of lying to the disapproval of getting your brother to lie. Expressivists *must* account for this connection as an attitude.

  *   **Why is this insufficient *on its own*?** Because it doesn't yet explain **logical validity**. We need to show *why* accepting Premise 1 (having that complex attitude) and Premise 2 (disapproving of lying) *forces* you to accept the Conclusion (disapprove of getting your brother to lie). How does the *logic* work with attitudes?

  ### The Heart of the Frege-Geach Problem: Explaining Validity
  The killer question for the expressivist is: **"What is it about the *attitudes* expressed by the premises that *logically necessitates* the attitude expressed by the conclusion?"**

  1.  **Premise 2 Attitude:** `Disapproval(Lying)` (Simple "Boo lying!")
  2.  **Premise 1 Attitude (Complex):** Let's call it `Commitment`: Something like "`Disapproval(Lying)` **entails** `Disapproval(GettingBrotherToLie)`" – but expressivists can't use "entails" as a logical fact; they have to explain this *entailment* purely in terms of attitudes.
  3.  **Conclusion Attitude:** `Disapproval(GettingBrotherToLie)` (Simple "Boo getting brother to lie!")

  *   **The Challenge:** How does holding the `Commitment` attitude *and* the `Disapproval(Lying)` attitude *logically force* you to adopt the `Disapproval(GettingBrotherToLie)` attitude? What is the "logic of attitudes" that makes this transition valid?
  *   **The Danger:** If there isn't a robust account of this "logic of attitudes," then expressivism struggles to explain why arguments like the one above feel *compelling* and *truth-preserving* in the same way mathematical or factual arguments do. It risks making moral arguments look like mere psychological quirks ("Oh, you happen to have that complex attitude *and* that simple attitude, so you *also* happen to have this other simple attitude") rather than genuinely logical reasoning.

  ### How Sophisticated Expressivists Respond (Briefly)
  Expressivists like Allan Gibbard and Simon Blackburn *do* offer complex theories to tackle this:

  1.  **Higher-Order Attitudes/Plans:** Gibbard argues moral statements express our acceptance of *norms* or *plans* for what to feel/do. "Lying is wrong" expresses a plan to feel guilt if I lie and anger if others lie. Conditionals express complex plans: "If lying is wrong..." expresses a plan *not* to combine planning to feel guilt/anger about lying *without* also planning to feel guilt/anger about getting your brother to lie. Validity is explained by the *incoherence* of holding incompatible plans/attitudes simultaneously.
  2.  **Logical Structure within Attitudes:** They try to show that attitudes themselves can have a structure analogous to logical operators. The complex attitude expressed by the conditional is designed so that if you have it *and* you have the attitude expressed by the antecedent ("Lying is wrong"), you are *logically committed* (by the standards of this attitude-system) to having the attitude expressed by the consequent ("Getting your brother to lie is wrong").

  ### Why the Problem Persists (The "Real Difficulty")
  1.  **Complexity vs. Intuition:** The sophisticated expressivist responses are highly complex and technical. Critics argue that they stretch the concept of "attitude" so far that it loses its intuitive, non-cognitive character (booing/cheering). Does accepting a norm or having a plan *really* feel like the same kind of thing as simple disapproval?
  2.  **Explaining "Must":** Does the expressivist account *truly* explain the *necessity* we feel in valid moral arguments? Or does it just describe a psychological tendency? If I have the complex `Commitment` attitude and `Disapproval(Lying)`, *could* I still fail to have `Disapproval(GettingBrotherToLie)` without being *logically* inconsistent, but merely psychologically inconsistent? The expressivist needs to show it's genuinely logical inconsistency *within the framework of attitudes*.
  3.  **Univocality:** Is the expressivist *really* able to show that "lying is wrong" means *exactly the same thing* in simple assertions and complex embeddings? Or have they subtly changed its meaning in the complex contexts to make the logic work?

  ### In Plain Terms: The Takeaway
  The Frege-Geach problem isn't just about sentences appearing unasserted. It's about the **logical glue** that holds moral arguments together. Expressivism starts with a simple idea: moral statements express attitudes like boos and cheers. The problem asks: **How can boos and cheers fit together into logically valid arguments that feel as compelling as mathematical proofs?** Your instinct to use "more complex attitudes" is the *beginning* of the answer, but the deep challenge is building a system where these complex attitudes interact in a way that genuinely explains the *force* and *necessity* of logical inference in ethics. Sophisticated expressivists try to build this system, but critics argue it becomes incredibly complex and may lose touch with the original, simple idea of moral language as pure expression. That's why it's considered a major hurdle.
