  Structure the dialogue: Start with setting the scenario—Thorne explaining JT. Voss interrupts with the recalcitrant emotion problem. Thorne responds with sub-doxastic states. Voss counters with perception analogy. Thorne questions if perception is the right model. Voss elaborates on value perception. Thorne brings up irrational fears. Voss differentiates perception from judgment. Thorne argues for cognitive impenetrability. Voss challenges the habit explanation. End with both conceding some points but unresolved.

