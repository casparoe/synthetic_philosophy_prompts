prompt: |-
  I'm the non-physician admin rep on my hospital's Medical Executive Committee, and we've got a genuinely nasty case coming to a head at Monday's meeting. A surgeon has had three different nurses independently report, over the last month, that he seemed unsteady and smelled of alcohol before two separate procedures -- but he was never actually tested in the moment, there's no toxicology on file, and his own explanation for both incidents (allergy meds, a hand-sanitizer mishap) is at least plausible taken on its own. About half the committee wants to put him on interim suspension today pending a full investigation; the other half says nurse impressions plus no positive test has never been our bar for suspending anyone's ability to work before, and that we'd basically be inventing a new, lower standard purely because the downside of being wrong -- a patient hurt mid-surgery -- sounds scarier than the downside in cases we didn't suspend for.

  What's turned this into a two-meeting stalemate is that one of our members has a philosophy MA from before med school, and she keeps insisting this is a live case of "pragmatic encroachment" -- her worry is that if we let how bad it'd be to be wrong shrink how much evidence counts as "enough to act on," we're doing something different in kind from just being extra cautious with the same evidence, and the committee ought to be honest about which one it's actually doing. She's also brought up epistemic contextualism, pointing out that the language we'd use in an interim finding ("reasonable cause to believe") versus a final revocation finding ("the Committee finds") might already be smuggling in exactly the standard-shifting she's worried about, just dressed up as neutral legal drafting.

  I got asked to write the actual decision memo since I'm suppose to be the neutral party here, and I don't want to just paper over her point to get to a recommendation faster -- but I also can't hand the committee three pages of epistemology with no bottom line. Can you draft that memo: a recommendation on the interim suspension with a concrete timeline for the fuller investigation, one that actually takes a stand on whether it's legitimate for the suspension decision to lower the evidential bar itself, versus holding the evidence fixed and doing all the stakes-sensitivity through the choice of action instead.
reasoning: |-
  Okay, the user is a non-physician admin on a hospital committee dealing with a high-stakes ethics dilemma. They need a decision memo about suspending a surgeon accused of possible impairment, but there's a philosophical debate about evidence standards complicating things. 

  Hmm, the core tension here is fascinating - it's not just about patient safety versus due process, but about whether the *definition* of "enough evidence" should change when stakes are high. That philosophy-trained physician really nailed the dilemma with "pragmatic encroachment." 

  Let me unpack the layers: First, the factual situation is messy - three nurse reports but no concrete proof, plausible alternative explanations. Second, the committee is split between "better safe than sorry" and "consistent standards matter." Third, the meta-debate about epistemology could paralyze action if not handled right.

  What the user really needs is a way to: 
  1) Make a defensible safety decision immediately 
  2) Create a fair investigation process 
  3) Acknowledge the philosophical concern without getting bogged down 
  4) Maintain committee unity

  The memo should bridge operational urgency with intellectual honesty. Can't dismiss the philosophy point - it's valid - but can't let it prevent action either. The key is framing suspension not as a punishment but as a precautionary hold, which inherently has lower thresholds.

  Also sensing unspoken needs: The user probably wants to avoid legal vulnerability, prevent committee infighting, and not set a precedent that could be weaponized later. The "neutral party" role is tricky here - they need to satisfy both pragmatists and principle-sticklers.

  The solution path seems clear: Recommend interim suspension as a temporary safety measure (low bar), paired with an accelerated investigation (due process), while explicitly separating the precautionary action standard from the final evidentiary standard. That navigates the encroachment concern by keeping the "evidence sufficiency" definition stable - suspension just uses different triggers.

  Notable risks to address: The surgeon's reputation if cleared, potential staff hesitation to report in future, and the need for concrete investigation steps so this doesn't feel arbitrary. The timeline compression is crucial - 48 hours for preliminary interviews shows seriousness.

  The philosophical point gets honored in the "principles" section rather than driving the recommendation. Contextualism is acknowledged but contained - interim actions use different language because their purpose is different, not because truth changes.
answer: |-
  **MEMORANDUM**  
  **TO:** Medical Executive Committee  
  **FROM:** [Your Name], Administrative Representative  
  **DATE:** [Current Date]  
  **SUBJECT:** Interim Action Recommendation Regarding Surgeon [Name] & Investigation Timeline  

  ---

  ### **I. RECOMMENDATION**  
  **Immediate Interim Suspension**: The surgeon shall be placed on **administrative suspension from all clinical duties** effective immediately, pending a full investigation. This suspension is strictly precautionary, non-punitive, and shall not exceed **14 calendar days** (see Section III for timeline).  

  ---

  ### **II. RATIONALE: BALANCING RISK, EVIDENCE, AND DUE PROCESS**  
  This recommendation balances three imperatives:  
  1. **Patient Safety** (non-negotiable),  
  2. **Procedural Fairness** to the surgeon,  
  3. **Committee Integrity** in applying standards consistently.  

  **Key Considerations:**  
  - **The Evidential Threshold for Interim Action Differs from Disciplinary Action**:  
    - Interim suspension is a **risk-mitigation tool**, not a final judgment. It requires only that evidence suggests a *plausible risk* to safety—not proof of violation. Three independent nurse reports (corroborating unsteadiness + odor) meet this threshold, even with alternative explanations.  
    - **This does not lower our evidentiary standard**; it acknowledges that *the stakes justify acting on incomplete information temporarily*. We suspend pilots for similar reports pre-flight; we do not require a blood test.  

  - **Pragmatic Encroachment is Inherent in Risk Management**:  
    - High-stakes decisions *appropriately* weigh consequences. We routinely act on "reasonable suspicion" (e.g., halting a procedure for a possible fire hazard). To ignore stakes here would be negligence, not epistemic purity.  
    - **However, we hold the *evidence* fixed**: The reports are credible and recurrent. The stakes inform *how we respond to that evidence*, not how we interpret its validity.  

  - **Contextualism in Language is Prudent, Not Deceptive**:  
    - "Reasonable cause to believe" (interim) vs. "The Committee finds" (final) reflects phased certainty—not shifting truth. Interim actions use lower-confidence language *because* investigations are pending. This is legally sound and ethically transparent.  

  ---

  ### **III. INVESTIGATION TIMELINE & NEXT STEPS**  
  To ensure due process and resolve this urgently:  

  | **Timeline**          | **Action**                                                                 |  
  |------------------------|---------------------------------------------------------------------------|  
  | **Day 0 (Now)**        | Surgeon suspended. Notified formally with interim action rationale.       |  
  | **Day 1-2**            | **Preliminary Interviews**: Investigators interview all 3 nurses, OR staff, and surgeon. Review surgeon’s schedule, prior complaints, and medication logs. |  
  | **Day 3**              | **Toxicology & Medical Review**: Surgeon submits to independent drug/alcohol screening + peer review of allergy meds claim. |  
  | **Day 5**              | **Preliminary Findings** presented to Ad Hoc Subcommittee (Chair, Credentials, Legal, Admin). |  
  | **Day 7**              | **Surgeon Response**: Surgeon reviews findings, provides additional evidence/explanation. |  
  | **Day 10**             | **Final Report** to Full Committee with recommendation: Reinstate, extend suspension, or initiate disciplinary action. |  
  | **Day 14**             | **Final Committee Vote** on disposition.                                  |  

  ---

  ### **IV. PRINCIPLES FOR FUTURE INTERIM ACTIONS**  
  To address philosophical concerns and ensure consistency:  
  1. **Interim Suspension Standard**: "Credible evidence suggesting imminent risk to patient safety, pending investigation."  
  2. **Documented Triggers**: Require (a) multiple contemporaneous reports, or (b) direct observation by a physician/administrator.  
  3. **Universal Application**: Apply this standard uniformly (e.g., to anesthesiologists, nurses, etc.).  

  ---

  ### **V. CONCLUSION**  
  Interim suspension is justified by credible reports of observable impairment in high-risk settings. This action prioritizes safety while the investigation determines facts. **We do not lower the bar for evidence; we raise the bar for inaction when evidence suggests danger.** Delaying suspension to seek "proof" places patients at unacceptable risk.  

  This memo recommends decisive precaution—not final judgment—anchored in a rapid, fair process.  

  **Recommended Vote:**  
  ☑ **Approve Interim Suspension & Investigation Timeline**  
  ☐ Reject Interim Suspension  

  **[Your Name]**  
  Administrative Representative, Medical Executive Committee  

  ---  
  **APPENDIX**: Proposed Standard for Interim Suspension (Draft Language for Bylaws)  
  > *"Interim suspension may be enacted when, in the judgment of the Committee, credible evidence suggests a practitioner’s continued practice poses imminent risk to patient safety. Such action requires (1) corroborated reports from multiple parties, or (2) direct observation by a Committee member/administrator. Suspension must be reviewed within 14 days with due process afforded to the practitioner."*
