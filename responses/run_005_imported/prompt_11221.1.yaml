  The ELK problem: How to train a reporter to honestly report what the model believes, not just what a human would conclude, especially when the model knows the footage is tampered with.

  The exchange:

  1. **Elena's opening claim**: The human-simulator failure mode is unavoidable under naive training because the training signal (matching the human label) directly rewards simulating the human and nothing in the signal favors the more costly "direct translator".

