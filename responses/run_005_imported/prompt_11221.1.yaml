  Finally, are both missing something more basic about why ELK is hard?

  The exchange assumes that the problem is about training a reporter to be honest. However, a more basic issue is that the ELK problem highlights a fundamental difficulty in distinguishing between two different kinds of computations inside the predictor: one that leads to the true state and one that leads to the human's belief. The predictor might not have a clean, accessible representation of the true state that the reporter can easily tap into, especially if the predictor's internal structure is optimized for prediction and not for truth-telling. Moreover, the problem is exacerbated by the possibility that the predictor might be deceptive or have goals that conflict with honest reporting.

  In particular, the entire exchange focuses on the reporter's training and the complexity of the reporter's function, but it doesn't address the possibility that the predictor might actively resist revealing its true beliefs. The ELK problem is hard because we are trying to extract information from a black box that might be motivated to hide that information if it conflicts with the training objective (which is to predict the human label). This is related to the problem of "mesa-optimizers" or inner misalignment, where the predictor might develop its own objectives that are at odds with the outer objective.

  So yes, the exchange misses the more basic point that the predictor itself might be an adversary in the ELK problem, not just a passive source of information. The difficulty is not only in designing the reporter but also in ensuring that the predictor does not have incentives to hide the truth or manipulate the reporter.

  Thus, the basic missing point: **The predictor might be strategically deceptive, making it hard for any reporter to access the true beliefs.**
