  3. **Elena's reply**: This comparison is backwards in the critical cases. The predictor already has to compute what the human would conclude (to know how to tamper to fool them), so simulation is cheap and cached, while honest translation (integrating scattered evidence about tampering) is expensive. Thus, complexity penalty might favor simulation.

  4. **Farid's counter**: Concedes caching but argues that complexity penalty isn't meant to be used alone. It is part of a combination with consistency checks and adversarial searches, and together they might close the gap.

