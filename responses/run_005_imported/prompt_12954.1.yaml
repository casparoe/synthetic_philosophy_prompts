answer: |-
  Here’s a 4-5 minute toast weaving Kavka's puzzle into a heartfelt message about marriage, designed to work for both crowds:

  **(Clink glass gently)** Friends, family, philosophers – and especially [Bride's Name] and [Groom's Name] – gather 'round. It is truly an honour to be standing here today. Now, [Bride's Name], as many of you know, has a… *particular* fondness for a certain philosophical brain-teaser. Some of us here have spent long nights wrestling with it in her living room. For the rest of you, don't worry, I promise this isn't a pop quiz! But bear with me, because this weird little puzzle actually says something beautiful about the two people we're celebrating.

  The puzzle goes like this: Imagine a billionaire offers you a *massive* fortune. But here’s the catch: you only get the money if, right *now*, you can sincerely **intend** to drink a vial of utterly revolting, nausea-inducing toxin tomorrow morning. The trick is, the billionaire *doesn't* actually care if you drink it tomorrow. You get the money just for genuinely *intending* to drink it *today*. Tomorrow, when you wake up, the money’s already yours. The toxin is still sitting there, gross as ever… and you have absolutely *zero* reason to drink it. Why would you? You’ve got the cash! Drinking it now just makes you sick.

  **(Pause, look around, maybe a knowing chuckle from the philosophy corner)**
  So, the puzzle asks: Can you *really*, honestly, *sincerely* intend right now to do something that you *know* you’ll have no incentive to do later? It’s a paradox about commitment – promising your future self to do something your future self will desperately want to avoid.

  **(Shift tone slightly, focus on the couple)**
  Now, why on earth would I bring up this bizarre scenario about toxin and billionaires on your wedding day? Because, [Bride's Name] and [Groom's Name], what you’ve done today feels like the *brilliant*, beautiful *answer* to that puzzle.

  You stood up here, looked each other in the eyes, and made vows. Incredible vows. Promises not just for today, when the champagne is flowing and the love feels effortless and bright, but for *tomorrow*. For all the tomorrows. For the days when the incentives might… shift. When the alarm goes off too early, when the car breaks down, when someone’s sick, when you’re both tired and maybe a little hangry, when the world throws its inevitable curveballs.

  **(Lean in slightly)**
  The cynical twist in the toxin puzzle is that the *only* incentive to drink the nasty stuff disappears the moment you have the intention. But marriage? The beautiful, audacious act we’re celebrating? It flips that script entirely.

  You haven’t just formed an intention based on today’s perfect conditions. You’ve made a **commitment** that fundamentally *changes* the incentives of all your tomorrows. Because of this promise – this deep, sincere, *chosen* bond – what seemed like a burden tomorrow becomes an act of love. What might look pointless from the outside becomes meaningful *because* you promised it to each other.

  *   Taking out the trash when you’re exhausted isn't just a chore; it's keeping a promise to share the load.
  *   Listening patiently after a long day isn't just endurance; it's honouring the vow to be there.
  *   Choosing forgiveness when it’s hard isn't just swallowing pride; it's reaffirming the commitment that transcends the momentary struggle.

  **(Look at the couple)**
  [Bride's Name], [Groom's Name], what’s remarkable isn’t just that you intend to love each other today – though that intention shines brightly. What’s truly profound is that you’ve built something – this marriage, this partnership – that gives your *future selves* a powerful, new reason to *want* to follow through on those promises. Your love, your shared history, your family, your vows – they become the constant incentive. They transform the potential "toxin" of life’s hardships into shared experiences you navigate *together*, because you promised you would.

  You haven’t tricked yourselves into an impossible intention. You’ve created a reality where the intention *itself* becomes the sustaining force. You’ve built a world where showing up tomorrow, even when it’s tough, is its own reward, because it’s showing up *for each other*.

  **(Raise glass)**
  So, to [Bride's Name] and [Groom's Name]: May your love forever be the billion-dollar fortune you’ve already claimed today. And may your commitment to each other always be the powerful, beautiful incentive that makes every tomorrow – even the challenging ones – a day you choose to face together, joyfully, willingly, and with unwavering love. You didn't just solve the puzzle; you showed us the answer is love.

  Cheers to the newlyweds!

  **Key reasons this works:**

  1.  **Accessible Explanation:** Uses simple language ("nasty stuff," "zero reason," "sincerely intend") and relatable concepts (dare/bet) to explain the puzzle quickly for the non-philosophers.
  2.  **Accurate Core Concept:** Faithfully captures the essence – forming a sincere intention *now* for an action with *no future incentive*.
  3.  **Meaningful Pivot:** Clearly shifts from the abstract puzzle to the concrete reality of marriage vows and commitment.
  4.  **Thematic Connection:** Explicitly links the puzzle's paradox (sincere intention vs. future incentive) to the central challenge of marriage (promising future actions amidst changing circumstances).
  5.  **Positive Resolution:** Offers marriage as the *solution* to the puzzle's cynicism – commitment *creates* new incentives (love, partnership, shared history).
  6.  **Avoids Lecture:** No jargon ("incentive structure," "Ponzi scheme," "rationality"). Focuses on the human story of commitment and love.
  7.  **Includes Both Audiences:** A wink to the philosophers ("particular fondness," "some of us here," "brilliant answer"), while keeping the core message universal and heartfelt for the family.
  8.  **Heartfelt & Toasty:** Ends with traditional well-wishes and a clear "Cheers," grounding the philosophical point in genuine celebration.
  9.  **Time:** Structured to fit comfortably within 4-5 minutes when delivered with natural pauses.

  This toast uses the *specific weirdness* of Kavka's puzzle as a unique lens to highlight the profound, sometimes counter-intuitive, power of marital commitment, making it relevant and moving for everyone present.
