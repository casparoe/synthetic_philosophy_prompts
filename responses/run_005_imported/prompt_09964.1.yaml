answer: |-
  That's a **fantastic** question cutting straight to the philosophical heart of the accuracy-first program. The "immodesty" move *does* feel like magic, and the worry about strict propriety baking in the conclusion is valid. Let's break down the logic intuitively, step-by-step.

  **The Core Argument (Recap):**

  1.  **Goal:** Justify probabilism (rational credences must be probabilistic).
  2.  **Tool:** Accuracy Dominance Arguments (showing non-prob credences are accuracy-dominated).
  3.  **The Gap:** Why care about *accuracy*? Why *that* scoring rule?
  4.  **The "Immodesty" Move:** Uses a **strictly proper scoring rule** to argue that probabilistic credences are uniquely "immodest," and modesty is irrational.

  **Your Sticking Points & The Intuitive Walkthrough:**

  **Point 1: Why is Modesty Irrational (beyond just being a label)?**

  Think of modesty as **epistemic self-sabotage**. Here's the core intuition:

  *   **Rationality Requires Internal Coherence:** Your credences represent your best current estimate of how the world is. Your *evaluation* of other credence functions (including their expected accuracy) is also based *on your current credences*.
  *   **The Modest Agent's Dilemma:** If your credence function `b` expects some *other* function `c` to be *more accurate* than itself *from its own perspective* (`Exp_b(Acc(c)) > Exp_b(Acc(b))`), this creates a profound incoherence:
      *   **`b` says: "`c` is more accurate than I am."**
      *   But `b` is *supposed* to represent your best judgment. If `b` itself judges `c` to be a better representation of the world (more accurate), then why on earth are you using `b`?
      *   **Sticking with `b` is like hiring a forecaster who says, "Don't listen to me, listen to my competitor over there; they're better at this than I am."** You'd fire that forecaster immediately! Their self-assessment undermines their own claim to the job.
  *   **The Rational Requirement (Immodesty):** A rational agent must be committed to their *own* credences being the *best available guide to the truth*, **according to their own best current judgment**. If your own credences tell you another set is likely more accurate, you *should* adopt that other set! Failing to do so, while *knowing* (by your own lights) it's better, is inherently irrational. It's clinging to a tool you believe is worse.

  **Point 2: Why Strict Propriety? (Is it just baking in the conclusion?)**

  This is the crucial part. Strict propriety *is* doing essential philosophical work, and it *isn't* *just* an arbitrary technical trick. Here's why:

  1.  **The Job of a Scoring Rule:** We need a way to measure "accuracy." But what makes one scoring rule better than another? We need constraints to ensure it's measuring something genuinely *epistemic* (truth-tracking), not just some arbitrary penalty.
  2.  **Key Constraint: Honesty Shouldn't Be Penalized (Propriety):** Imagine you *actually* believe `X` has probability `p`. If a scoring rule incentivizes you to report *anything other than `p`* as your credence (because you expect it to get a better score), that rule is perverse. It rewards *dishonesty* or *gaming the system* relative to your actual beliefs. **Propriety** ensures that *according to your own credences*, honestly reporting them (`b`) gives you the *best possible expected score*. You have no incentive, *by your own lights*, to lie.
  3.  **Strict Propriety Adds Uniqueness:** Regular propriety says `b` is *among* the best expected scorers by its own lights. **Strict propriety** says `b` is *uniquely* the best expected scorer by its own lights. No other function `c` is expected to do as well as `b` itself, *if the world is judged by `b`*.
  4.  **The Link to Immodesty & Probabilism:**
      *   **Immodesty Requirement:** Rational credences must expect *themselves* to be uniquely best.
      *   **Strict Propriety:** Guarantees that *if `b` is probabilistic*, then `b` is immodest. (`Exp_b(Acc(b)) > Exp_b(Acc(c))` for any `c ≠ b`).
      *   **The Non-Probabilistic Case:** If `b` is *not* probabilistic, strict propriety guarantees that there exists *some probabilistic* `c` such that `Exp_b(Acc(c)) > Exp_b(Acc(b))`. **`b` looks at `c` and says, "Yep, that one is expected to be more accurate than I am."** `b` is modest.
      *   **The Punchline:** Only probabilistic credences *can* satisfy the immodesty requirement when we use a strictly proper scoring rule. Non-probabilistic ones are *forced* into modesty.

  **Why Strict Propriety Isn't *Just* Baking in the Conclusion (The Philosophical Defense):**

  The argument *assumes* strict propriety is a requirement for a *legitimate* measure of epistemic accuracy. This isn't pulled from thin air; it's defended on independent grounds:

  1.  **Truth-Directedness:** A good scoring rule should always reward being closer to the truth. (Usually built-in).
  2.  **Extensionality:** Score depends only on the credence assigned to the *actual* outcome and the outcome itself. (Usually built-in).
  3.  **Propriety (Core Justification):** As argued above, a scoring rule that *penalizes honesty* (relative to one's actual beliefs) or *rewards misrepresentation* is not purely measuring *epistemic* accuracy. It's introducing extraneous incentives. A rule satisfying propriety aligns the epistemic goal (accuracy) with the practical incentive (maximize expected score) *from the agent's perspective*. This is seen as essential for the score to genuinely represent *epistemic* utility.
  4.  **Strict Propriety (The Uniqueness Justification):** Without strictness, multiple credence functions could be tied for best expected score by their own lights. This would weaken the argument, as immodesty wouldn't uniquely pick out probabilism. Strict propriety ensures a clean, unique identification. It's justified as a natural strengthening to avoid this ambiguity and because most natural scoring rules (Brier, Log) *are* strictly proper.

  **The Logical Flow Summarized Intuitively:**

  1.  **Rationality Demands Immodesty:** Your current credences must be the ones *you* (given those very credences) expect to be the most accurate. Otherwise, you believe you should be using different credences, making your current ones self-undermining. *(Philosophical Premise: Coherence of Self-Endorsement)*
  2.  **Legitimate Accuracy Measures Must Be Strictly Proper:** A scoring rule that makes honesty the uniquely best policy (by your own lights) is necessary for it to purely measure epistemic accuracy without perverse incentives. *(Philosophical Premise: Propriety as a Constraint on Epistemic Utility)*
  3.  **Strict Propriety + Immodesty ⇒ Probabilism:**
      *   Strict propriety *guarantees* that probabilistic credences *are* immodest. (They uniquely expect themselves to be best).
      *   Strict propriety *guarantees* that non-probabilistic credences *cannot* be immodest. (They always expect some probabilistic function to be better).
  4.  **∴ Probabilism is rationally required.** Non-probabilistic credences are either accuracy-dominated *or* modest (and hence self-undermining), or both.

  **Addressing Your Concern Directly:**

  You're right that strict propriety is a *key enabling assumption*. Without it, the link between probabilism and immodesty breaks. But it's not *merely* technical or circular. The philosophical work is done in **justifying strict propriety as a *necessary condition* for a scoring rule to count as a legitimate measure of purely *epistemic* accuracy.** If you accept that justification (which Joyce, Pettigrew, et al. spend considerable time arguing for), then the immodesty requirement leverages that legitimate measure to show that only probabilism is coherently self-endorsing. The conclusion (probabilism) isn't baked into the *definition* of propriety; it's a *consequence* of applying the (independently motivated) requirement of propriety to the (independently motivated) requirement of immodesty.

  The "magic" comes from how well these two independently plausible ideas (coherent self-endorsement & propriety as a constraint on epistemic utility) fit together to deliver probabilism. The challenge lies in fully defending each premise, especially the philosophical justification for propriety/strict propriety as *the* constraint for epistemic scoring rules. That's where much of the debate in formal epistemology lives! Your skepticism is spot-on for engaging with that debate.
