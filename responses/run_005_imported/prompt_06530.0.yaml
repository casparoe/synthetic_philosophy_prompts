answer: |-
  You've identified a profound and widely debated tension in Lewis's metaphysics. Let's break down the argument that his reliance on **perfect naturalness** compromises Humean Supervenience (HS) in a way parallel to Armstrong's necessitarianism:

  1.  **The Core Tenet of Humean Supervenience (HS):**
      *   HS demands that *everything* about the world – including laws, chances, causation, modality – supervenes entirely on the vast, sprawling mosaic of local particular matters of fact: the spatiotemporal distribution of perfectly natural, intrinsic properties ("point-by-point" or "little-by-little").
      *   Crucially, there is *no* primitive modal, nomic, or necessary structure "over and above" this mosaic. Laws are patterns *within* the mosaic, not governing principles imposed *on* it.

  2.  **The Role of Perfect Naturalness in the Best System Analysis (BSA):**
      *   The BSA defines laws as theorems of the *best* systematization of the mosaic. "Best" means optimal balance of **strength** (describing/entailing as much of the mosaic as possible) and **simplicity** (being concise/elegant).
      *   Lewis argues that *without* a restriction on the language used to formulate competing systems, simplicity becomes trivial. One could always invent a wildly disjunctive, gruesome predicate `F` that applies *only* to all and only the actual events in the mosaic. The system "Everything is F" would be maximally simple (one axiom) and maximally strong (describes everything). But this is absurd; it doesn't capture *lawlike* regularities.
      *   The solution: Restrict the vocabulary of competing systems to predicates expressing **perfectly natural properties**. Only then does the competition for simplicity and strength meaningfully identify *genuinely* lawlike patterns. Natural properties are the "joints" we must carve at.

  3.  **The Problem: Naturalness as Primitive Structure:**
      *   **Primitive & Unanalyzed:** Lewis explicitly treats the distinction between perfectly natural and less natural properties as a *primitive*, fundamental aspect of reality. It is *not* analyzable in terms of human interests, linguistic practices, or patterns within the mosaic *alone*.
      *   **Global Structural Constraint:** The naturalness ranking isn't just a feature *of* the mosaic; it fundamentally *constrains* how the mosaic can be described for the purpose of identifying laws via the BSA. It dictates which patterns "count" as candidates for lawhood based on the properties involved.
      *   **Brute Nomic Relevance:** The naturalness of a property isn't determined by its role in the *actual* regularities of our world (though natural properties *do* feature in them). It's a *pre-existing* metaphysical structure that determines *which regularities are even eligible* to be laws. A regularity involving highly unnatural properties, no matter how robust and exceptionless, simply *cannot* be a law under the BSA because systems stating it couldn't be simple (if stated honestly using unnatural predicates) or would be disqualified for using unnatural predicates.

  4.  **The Parallel to Armstrong's Necessitation Relation:**
      *   Armstrong posits **contingent necessary connections between universals** (N(F, G)) to explain why certain regularities (F's being followed by G's) are *laws* rather than cosmic coincidences. This `N` is a primitive, irreducible nomic relation.
      *   **Lewis's Naturalness as a Brute Nomic Filter:** Similarly, Lewis's primitive naturalness ranking acts as a brute filter determining *which regularities are even candidates* for lawhood under the BSA. It dictates that laws *must* be expressed using certain privileged properties. This privilege isn't earned by the regularity itself within the mosaic; it's imposed from outside the descriptive resources allowed for systematizing the mosaic.
      *   **Supervenience Failure:** Both `N(F, G)` and the naturalness ranking represent structures that *do not* supervene on the spatiotemporal distribution of local qualities alone. Two possible worlds could have *identical* mosaics (same distribution of point-instantiations) but differ in their laws:
          *   For Armstrong: If the `N` relations differed.
          *   For Lewis: If the naturalness rankings differed. Worlds with identical mosaics but different naturalness structures would yield *different* "best systems" and thus different laws under the BSA. This violates HS, which requires that sameness of mosaic entails sameness of *everything*, including laws.

  5.  **The Consequence: Sacrificing Pure Humeanism for BSA's Advantage:**
      *   The BSA's primary advantage over necessitarianism (like Armstrong's) is its *reductionist* and *anti-primitivist* spirit regarding laws: laws *just are* patterns, not irreducible governing relations. It promises a truly Humean account.
      *   **Your Argument's Core Insight:** However, this advantage over necessitarianism is *only secured* by introducing the primitive naturalness structure. This structure plays a role functionally equivalent to Armstrong's primitive `N` – it provides the brute, non-supervenient constraint that separates mere regularities from laws. Without it, the BSA collapses into triviality.
      *   **Quietly Giving Up:** By leaning on primitive naturalness, Lewis *does* quietly give up on the strictest interpretation of HS. While the *laws themselves* supervene on the mosaic *plus the naturalness structure*, the naturalness structure itself is a non-Humean primitive "over and above" the distribution of local qualities. It is a fundamental, non-local, modal-like structure (it carves reality objectively, constraining lawhood across possible systems) that HS explicitly aimed to banish.

  **Conclusion:**

  Your critique is powerful and accurate. Lewis's solution to the "gruesome predicate" problem for the BSA – the essential appeal to primitive, objective, perfectly natural properties – introduces a fundamental structure that **does not supervene** on the spatiotemporal distribution of local qualities. This structure acts as a brute filter, determining which regularities are eligible for lawhood, functionally mirroring the role of Armstrong's primitive necessitation relation (`N`). While the BSA successfully avoids Armstrong's *specific* primitive nomic relation, it replaces it with a *different* primitive structure (naturalness) that is equally non-Humean in its metaphysical status and its role in underwriting lawhood. The BSA's advantage in *reducing laws to patterns* is thus purchased at the cost of abandoning the strictest, most reductive form of Humean Supervenience. Lewis's system is only "Humean" in a significantly qualified sense, relying on a primitive metaphysical structure external to the mosaic itself.
