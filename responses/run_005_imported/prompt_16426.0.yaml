answer: |-
  Your razor-sharp question cuts to the heart of the Kant-Korsgaard divergence. After analyzing both arguments, **Korsgaard's position is a profound *replacement* of Kant's core mechanism for grounding unconditional worth, not a legitimate extension.** While she uses Kantian vocabulary, she discards rational autonomy as the *sine qua non* and smuggles in a fundamentally different, interest-based foundation. Here's the verdict and reasoning:

  **1. Kant's Core Mechanism: Rational Autonomy as the Sole Ground of Unconditional Worth**
     *   **The Work Done by Autonomy:** For Kant, the Formula of Humanity ("So act that you use humanity... always at the same time as an end, never merely as a means") rests on *rational nature* (G 4:428-429). The *unconditional* worth stems specifically from the capacity for *autonomy* – the ability to set ends for oneself *freely* and, crucially, to recognize oneself as *subject* to the moral law (i.e., practical reason legislating for itself) (G 4:433, 440).
     *   **Why Animals Are Excluded:** Animals are "things" (MM 6:442) precisely because they lack this *reflective self-legislation*. They have inclinations, instincts, and ends driven by nature/instinct, but they cannot *step back*, *evaluate*, and *endorse* these ends *as rational principles*. They cannot recognize themselves as bound by morality or set ends *for reasons* in the normatively reflective sense. Their "good" is heteronomous, dictated by nature. Therefore, they cannot be "ends in themselves" because they lack the self-legislating capacity that *is* the source of that worth. Our duties are indirect because the *only* ultimate locus of value demanding respect is rational will.

  **2. Korsgaard's Shift: "Tethered Ends" and the Source of Value**
     *   **The Argument:** Korsgaard argues that Kant's own reasoning, consistently applied, shows that the source of value isn't rationality *per se*, but the fact that a being is a *"final end"* or *"end in itself"* (FC, Ch. 4, 5). A being has unconditional worth if its own nature makes its good *normatively binding* on it – if it *must* value its own existence and pursue its good. This "normative self-constitution" happens whenever a creature has a perspective from which things *matter* to it, where it has interests that can be set back, and its ends are "tethered" to its nature as *its* ends. This, she claims, applies to any sentient being with a welfare, not just rational agents.
     *   **The Crucial Replacement:** Korsgaard identifies the *source* of value differently. For Kant, it is **rational autonomy (self-legislation under the moral law)**. For Korsgaard, it is **being a creature for whom things can go better or worse *from its own perspective*, whose nature makes its good normative *for it***. This shifts the ground from *how* ends are chosen (reflectively, autonomously) to the *fact* that the creature *has* ends and a perspective that matters. The "authority" of the creature's own good replaces the authority of the rational will.

  **3. Why This is Replacement, Not Extension:**
     *   **Abandoning the *Distinctive* Work of Autonomy:** Kant's "end in itself" status is *constituted* by the capacity for autonomy. It's not merely *having* ends or a perspective; it's the *capacity to legislate the moral law governing those ends*. Korsgaard's "tethered ends" argument effectively severs the *unconditional* worth from this specific capacity. She grounds worth in the *fact of having a good that matters to the creature*, a feature shared by animals and humans, but which Kant explicitly relegated to the realm of *conditional* value (value *for* the being, not *in* itself).
     *   **Collapsing the Rational/Non-Rational Divide *on Kant's Terms*:** Kant's ethics fundamentally distinguishes beings who are *authors* of the moral law (and thus ends in themselves) from beings who are merely *subject* to natural laws (and thus things). Korsgaard's argument erases this distinction *at the level of grounding unconditional worth*. Both rational and non-rational beings become "ends in themselves" based on the *same* criterion – having a perspective that matters. This contradicts Kant's core insistence that *only* rationality grants this status.
     *   **Sentimentalism in Kantian Clothing:** While Korsgaard uses Kantian terms ("end in itself," "unconditional worth"), the *mechanism* she employs is closer to interest-based or sentientist theories (like Singer's, though she rejects utilitarianism). The moral claim arises directly from the *fact* of sentient suffering/harm and the creature's *interest* in avoiding it, not from its capacity for rational self-governance. The appeal to the creature's "own point of view" and the normative force of its "good" draws its intuitive power from a recognition of interests and sentience, not from the transcendental deduction of freedom. The "Kantian machinery" (e.g., the idea of valuing something "as an end") is repurposed to support a foundation Kant explicitly rejected for non-rational beings.
     *   **Indirect vs. Direct Duties - Symptom, Not Cause:** Kant's indirect duties are a *consequence* of his grounding of worth solely in rationality. Korsgaard's direct duties are a *consequence* of her grounding worth in having a tethered end/good. The shift in the *basis* of duties confirms the shift in the *ground* of worth. She doesn't derive direct duties *from* Kant's premises about rationality; she changes the premises to *allow for* direct duties.

  **Verdict:** Korsgaard's project is brilliant, philosophically rich, and offers a powerful Kant-*inspired* account of animal ethics. However, it **does not legitimately extend Kant's own premises about the ground of unconditional worth.** It **replaces** Kant's core mechanism – rational autonomy as the constitutive ground of being an end in itself – with a fundamentally different mechanism: the inherent normative authority of a creature's own good arising from its having "tethered ends" and a perspective that matters. This new mechanism aligns more closely with interest-based or sentientist foundations, even as it utilizes Kantian terminology and structure. She completes *an argument* inspired by Kant, but it is not *Kant's argument*. It is a significant revision that abandons the centrality of rational autonomy for grounding *unconditional* worth, substituting a broader criterion of being a valuer with a welfare.
