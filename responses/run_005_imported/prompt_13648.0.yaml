answer: |-
  Your objection is a powerful and well-known critique in the literature, often called the **chaining argument** or **sorites objection** against parity. It *does* pose a serious challenge to Chang's view, and its validity is widely acknowledged. Here's a breakdown:

  ### 1. **Your Argument is Valid and Damaging**
     - **Logical Structure:** Your reconstruction is valid. If:
       - (P1) Parity tolerates small improvements (i.e., if A ≈ B, then A+ ≈ B, where ≈ = parity).
       - (P2) A long chain of small improvements transforms A into A*, where A* > B.
       - Then: There must be a point where A<sup>n</sup> ≈ B but A<sup>n+1</sup> > B.
     - **The Problem:** This implies a **sharp cutoff** between parity and "better than." Yet Chang insists parity is *not* vague or approximative. Accepting vague boundaries seems inconsistent with her core claim that parity is a *sui generis*, precise fourth relation distinct from vague equality.

  ### 2. **Chang's Response (and Its Limitations)**
  Chang *does* address this (e.g., in "Parity: An Intuitive Case" and later work). Her primary rebuttal:
     - **Parity is Not Transitive:** Chang argues that while *each step* in the chain preserves parity (A ≈ B, A+ ≈ B, A++ ≈ B), parity itself **is not transitive across iterations**. Just because A ≈ B and A+ ≈ B, it doesn’t follow that A+ ≈ A (or that all A<sup>n</sup> are pairwise on a par). The chain "bunches up" relative to B, but the options *within* the chain may not be on a par with each other.
     - **Vagueness in Application, Not the Relation:** She concedes that *identifying* when parity gives way to "better than" involves vagueness, but insists this is **metaphysical/epistemic vagueness in the world**, not a flaw in the *concept* of parity. Parity remains a crisp relation; it’s just hard to pinpoint where cumulative improvements push an option out of parity with B.  
     - **The "Rough Neighborhood" Analogy:** Chang’s "career" example relies on options inhabiting different *kinds* of value. A+ (a slightly better lawyer) still belongs to the "legal career" value neighborhood, while B (clarinetist) belongs to an "artistic career" neighborhood. These neighborhoods are incompletely comparable. A* (an *extraordinary* legal career) might escape its neighborhood and become globally better.

  ### 3. **Why Your Worry Persists (and Your Friend's Reply is Incomplete)**
     - **The Transitivity Loophole Feels Ad Hoc:** Denying transitivity for parity avoids the sorites chain, but critics argue this is suspiciously convenient. If parity isn’t transitive, is it even a coherent *comparative* relation? Chang responds that parity is about "being in the same league" – leagues aren’t transitive (Team A ≈ Team B, Team B ≈ Team C, but Team A > Team C).
     - **Vagueness at the Boundary *Does* Threaten the Core:** Your friend is correct that Chang *can* accept boundary vagueness while maintaining a distinct core (e.g., "heap" has vague boundaries but a clear core meaning). **However, the problem runs deeper:**  
       - The small-improvement argument *relies* on the **sharpness of equality** (any improvement tips it). If parity tolerates improvements *and* has vague boundaries, it starts to resemble **vague equality** – precisely what Chang wants to avoid.  
       - If "A ≈ B" means "A and B are roughly equal," then a small improvement *might* not make A+ better than B due to vagueness. Chang’s whole argument collapses if parity is just vague equality by another name.  
     - **The Burden of Proof:** Chang must show why parity isn’t *just* a name for the vagueness of "equally good" or "incomparable." The chaining argument highlights that her positive case rests heavily on rejecting vagueness, yet vagueness resurfaces at the edges.

  ### 4. **Blunt Assessment**
     - **Your objection is VALID and DAMAGING:** It exposes a significant tension in Chang's view. The sorites pressure is real, and her solutions (non-transitivity, boundary vagueness) are contested. Many philosophers (e.g., Broome, Raz) argue it fatally undermines parity.
     - **It doesn't NECESSARILY DESTROY parity:** Chang’s responses are sophisticated and keep the debate alive. Parity *might* survive if we accept non-transitive value relations or if "value neighborhoods" block chaining. However, the objection forces her into concessions (vagueness at boundaries) that weaken her anti-vaguenist stance.
     - **The Core Issue:** The chaining argument shows that **Chang cannot have it all:**  
       - If parity is *precise* and *tolerates small improvements*, it risks incoherence via sorites.  
       - If it avoids sorites via *vagueness* or *non-transitivity*, it risks collapsing into the very views (vague equality, incomparability) it seeks to replace.

  ### Key Literature for Context
  - **Chang's Defense:** "Parity: An Intuitive Case" (2016), *Hard Choices* (2017).  
  - **Critiques:**  
    - John Broome ("Is Incommensurability Vagueness?") argues parity reduces to vagueness.  
    - Larry Temkin ("Rethinking the Good") challenges non-transitive value relations.  
    - Joshua Gert ("Value and Parity") offers alternative models.  

  **Verdict:** Your objection is a serious, valid challenge. Chang has responses, but they require accepting non-standard features (non-transitivity, boundary vagueness) that leave parity vulnerable to the charge that it's not truly a *sui generis*, precise fourth relation. The argument doesn't *refute* parity, but it significantly pressures the view and is a major reason why many philosophers remain unconvinced. Your intuition that it threatens to collapse parity into vagueness is well-founded.
