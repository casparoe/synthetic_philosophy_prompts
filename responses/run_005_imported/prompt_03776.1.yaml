answer: |-
  Here’s a breakdown of epistemic contextualism and pragmatic encroachment that moves beyond surface agreement, focusing on mechanisms, predictive divergence, and core objections:

  ### 1. **Core Mechanisms: Where the "Action" Happens**
     - **Contextualism**:
       - **Mechanism**: The word "knows" is *context-sensitive*. Its truth conditions shift with the **attributor's** conversational context (e.g., their stakes, salience of error possibilities).
       - **Locus of Change**: When we say "Hannah knows the bank is open," the *truth* of this sentence depends on **how demanding the speaker's context is**. In low-stakes attributions, "knows" requires less evidence; in high-stakes contexts, it requires more.
       - **Whose Situation?** The **attributor’s context** determines the semantic standard. Hannah’s own stakes are irrelevant to the *truth* of *our* knowledge attribution (though they might affect whether we *utter* it).

     - **Pragmatic Encroachment (PE)**:
       - **Mechanism**: Knowledge itself depends on **truth-irrelevant practical factors**. Whether a subject *knows* p shifts with **their** practical situation (stakes, interests).
       - **Locus of Change**: Hannah’s *epistemic state* changes with her stakes. In low stakes, her evidence suffices for knowledge; in high stakes, the *same evidence* no longer does, because knowledge requires stronger evidence when stakes are high.
       - **Whose Situation?** The **subject’s practical context** directly determines whether they know. The attributor’s context is irrelevant to the *fact* of Hannah’s knowledge (it only affects whether we *report* it accurately).

  ### 2. **Divergence Case: Attributor High-Stakes, Subject Low-Stakes**
  **The "Bus Schedule" Case:**
  - **Subject (Lena)**: A teenager casually checking if Bus #42 runs on Sundays for a non-urgent mall trip. She glances at the official schedule online (which is reliable). Her stakes are low: missing the bus would be a minor annoyance.
  - **Attributor (Dr. Vance)**: Lena’s philosophy professor. Vance is writing a reference letter for Lena’s scholarship application, which requires confirming her reliability. If Lena is wrong about the bus, Vance’s reputation suffers severely. He overhears Lena say, "I know Bus #42 runs on Sundays."

  **Verdicts:**
  - **Contextualism**: 
    - Vance’s attribution "Lena knows Bus #42 runs on Sundays" is **false**. His high-stakes context sets a demanding standard for "knows" (e.g., requiring schedule verification with transit authority). Lena’s evidence (casual glance) doesn’t meet *his* context’s standard.
    - *Crucially*: Lena might *still know* by her *own* low-standards context, but this is irrelevant to whether Vance’s *sentence* is true.
    
  - **Pragmatic Encroachment**:
    - Lena **knows** the bus runs on Sunday. Her *own* low stakes mean her evidence suffices for knowledge. Vance’s high stakes affect whether *he* can *claim* she knows (he might reasonably deny it), but they don’t change Lena’s epistemic state. 
    - Vance’s attribution "Lena knows" is **true** (though imprudent for him to assert).

  **Why They Diverge**: Contextualism ties truth to the *speaker's* context; PE ties knowledge to the *subject's* stakes. Here, speaker and subject stakes conflict.

  ### 3. **Strongest Objections**
  - **Against Contextualism: The Semantic Blindness Objection**
    - **Charge**: If "knows" is context-sensitive like "tall" or "flat," speakers should recognize this and adjust assertions accordingly. But ordinary speakers:
      - Don’t treat "knows" as obviously context-sensitive (unlike "tall").
      - Engage in disputes where they seem to genuinely disagree (e.g., "She *does* know!" vs. "No, she doesn’t!"), rather than talking past each other.
      - Lack meta-linguistic awareness ("I meant 'knows' by high standards") in knowledge disputes.
    - **Damage**: Contextualism implies speakers are systematically mistaken about their own language, treating "knows" as invariant when it’s not. This strains credibility.

  - **Against Pragmatic Encroachment: The Purification Problem**
    - **Charge**: PE abandons the **purist** intuition that knowledge depends *only* on truth-relevant factors (evidence, reliability, truth). By letting practical stakes affect knowledge, PE:
      - Blurs the line between *epistemic* justification (evidence) and *practical* rationality (action).
      - Undermines knowledge’s theoretical role: E.g., if knowledge justifies action, but knowledge *itself* depends on stakes, circularity arises ("You should act because you know!" vs. "You know only if you should act!").
      - Makes knowledge "shifty" in ways that conflict with its role in explanation, memory, or testimony (e.g., "Lena knew yesterday, but today—with higher stakes—she never knew?").
    - **Damage**: PE sacrifices theoretical unity. Knowledge becomes a "mongrel" concept, unfit for its traditional role in epistemology.

  ### Key Predictive Takeaways
  - **Test for Contextualism**: Ask: *"Who is calling it 'knowledge'?"* If changing the speaker’s context (e.g., making error possibilities salient) changes the truth of their *knowledge claim*, contextualism is at work.
  - **Test for PE**: Ask: *"What’s at stake for the subject?"* If altering the subject’s practical situation (e.g., raising their stakes) changes whether they *know*, even if evidence is fixed, PE is in play.
  - **Adjudication Hinge**: Do you think the *language* of knowledge is elastic (contextualism), or is knowledge itself partly *constituted* by practical concerns (PE)? The former faces linguistic challenges; the latter, conceptual ones.

  This framework lets you predict verdicts: In any case, isolate the attributor’s context and the subject’s stakes. If they pull in opposite directions (as in Bus Schedule), the theories will clash.
