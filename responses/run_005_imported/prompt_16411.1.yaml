answer: |-
  You've hit on the **central objection** to Lewis's modal realism—and it's a powerful one. You're absolutely right that Occam's razor *seems* to shred it. But Lewis (and defenders) have sophisticated replies explaining why they see it as *more* parsimonious *overall* than ersatzism. Here's the core dialectic you're missing:

  ### 1. Lewis's Defense: Parsimony Isn't Just About Counting Things
     * **Qualitative vs. Quantitative Parsimony:** Lewis argues ontological parsimony isn't just about the *number* of entities ("quantitative"), but about the *kinds* of entities ("qualitative"). Positing infinite concrete worlds is quantitatively extravagant, but *qualitatively* parsimonious because they're all the *same fundamental kind of thing*: spatiotemporal concreta like our universe. They require no new fundamental categories.
     * **Ersatz Worlds Introduce New Kinds:** Ersatz worlds (as abstract objects—sets of propositions, maximal consistent states of affairs, etc.) introduce *entirely new fundamental kinds* of entities: abstracta that represent possibilities. Lewis argues introducing a new fundamental ontological category (abstract representational entities) is *worse* qualitatively than multiplying entities within an existing, well-understood category (concreta). It's "more worlds vs. weirder stuff."

  ### 2. The Charge of Circularity/Primitivism Against Ersatzism
     * **What Makes an Ersatz World "Possible"?** Lewis's core attack: Ersatz worlds only work if we can *already distinguish* which sets of propositions/states of affairs are *possible* from those that are impossible. But modal realism was supposed to *analyze* possibility! If ersatzism needs a *primitive* notion of "possible" to select which abstract objects count as worlds, then:
       * It hasn't *reduced* modality, it's *presupposed* it.
       * It's explanatorily circular: "P is possible because there exists a possible world where P" becomes "P is possible because there exists a (primitive-)possible-representation where P."
     * **Lewis's Reductionist Claim:** Modal realism *reduces* modality to non-modal facts: "Possibly P" just means "There exists a concrete world where P." No primitive modality is needed. For Lewis, this reduction is worth the quantitative cost. Ersatzism, he argues, either smuggles in primitive modality or offers no real analysis at all.

  ### 3. Explanatory Power: More Than Just Truth Conditions
     * **Counterpart Theory:** Lewis's concrete worlds provide a natural framework for his counterpart theory, solving transworld identity problems without mysterious "haecceities." While ersatzists can adopt counterpart theory, it arguably fits more naturally with concrete individuals in other worlds.
     * **Recombination Principle:** Lewis can ground the intuitive principle that possibilities can be "recombined" (e.g., "a unicorn could exist" follows from "horns exist" and "horses exist") in the physical arrangement of parts across concrete worlds. Ersatzism struggles to ground recombination without appealing back to primitive modality.
     * **Analysis of Content/Properties:** Lewis uses concrete worlds to analyze propositions (sets of worlds), properties (sets of world-individual pairs), etc., aiming for a unified, naturalistic ontology. He sees abstract ersatz worlds as disconnected from the natural world.

  ### 4. Occam's Razor is a Tool, Not a Decider
     * **Theoretical Virtues Trade-Off:** Philosophers weigh parsimony against other virtues like explanatory power, clarity, non-circularity, fit with science, and intuitive plausibility. Lewis argues modal realism wins *overall* despite quantitative cost because:
       * It offers a clear, non-circular *reduction* of modality.
       * It uses only one fundamental kind of entity (concreta).
       * It provides a unified framework for semantics, properties, and possibility.
     * **Is the Cost Really Higher?** Lewis provocatively argues that positing infinitely many concrete worlds isn't *that* big a deal. Physics posits infinite space, infinite time, or infinite universes (multiverse theories). Why is infinite *causally isolated* concrete worlds metaphysically worse? He sees it as a natural extension of scientific realism.

  ### Why It's Still a "Live" Position
  1.  **The Challenge:** Lewis's formulation is incredibly rigorous and forces everyone else to sharpen their views. It sets the benchmark for a *reductive* analysis of modality. Any alternative must explain why it avoids his circularity charge.
  2.  **The Dialectic:** Defenders argue that ersatzism's apparent parsimony is illusory. If it relies on primitive modality or mysterious abstract representational entities, it hasn't truly saved ontological cost; it's just hidden it. The debate centers on whether Lewis's qualitative parsimony argument and reductionist success outweigh the quantitative cost.
  3.  **No Consensus:** While **most metaphysicians reject modal realism**, they acknowledge its power and ingenuity. It's "respectable" because it's a serious, systematic, and deeply argued attempt to solve fundamental problems. Refuting it requires more than just waving Occam's razor; it requires engaging with its arguments for reduction and against ersatzism's primitivism.
  4.  **Influence:** Even its critics adopt ideas it forced into the debate (e.g., the importance of reduction, the structure of counterpart theory, the challenge to ersatzism).

  **In short:** You're not missing something obvious that *refutes* Lewis. You've correctly identified its biggest weakness. The "piece you're missing" is Lewis's sophisticated counter-argument that ersatz worlds *aren't* cheaper *overall* because they either fail to genuinely reduce modality (relying on primitive "possible") or introduce equally problematic new fundamental kinds of entities (abstract representational objects). He contends that multiplying familiar concrete stuff is less ontologically vicious than introducing weird abstract stuff or leaving modality primitive. **The debate hinges on whether you find this trade-off convincing.** Most don't, but granting it's a *live* debate means acknowledging the force of Lewis's challenge to ersatzism. As Plantinga quipped, Lewis's view is "a paradigm of philosophy gone haywire," but it's a paradigm that must be seriously wrestled with. Good luck on the prelim!
