  Hmm, I recognize this exact frustration—it's almost a rite of passage in modal metaphysics. The user's core question reveals they're thinking critically (spotting the parsimony issue is smart), but they're missing why Lewis's view has staying power. Their phrasing ("every intro treatment...") suggests they've encountered surface-level summaries but not the deeper dialectic. 

  First, I should validate their intuition: yes, on surface level, Lewis's ontology seems wildly extravagant. But the real puzzle is why serious philosophers don't dismiss it outright. The answer lies in what ersatzism sacrifices—explanatory power Lewis thinks is non-negotiable. 

  Let me unpack Lewis's actual argument for concreteness. It's not that he loves infinite universes; he thinks they're forced by the inability of abstract worlds to ground modal truth without circularity. For example: if "unicorns could exist" is true because an abstract description says so, what makes that description possible rather than impossible? Lewis says ersatzists either smuggle in modality (making analysis circular) or lean on primitive modality (which he finds unexplanatory). 

  The user might not realize how slippery "parsimony" is here. Lewis would counter that ontological simplicity isn't worth sacrificing theoretical virtues like clarity and non-primitiveness. His worlds may be numerous, but they're all uniform—just more spacetime like ours—whereas ersatz worlds require mysterious abstracta or brute modal facts. 

  Also worth noting: Lewis's view elegantly handles recombination (how possibilities combine) and counterpart theory (transworld identity without haecceities). Ersatzists struggle here. The user's phil of language background might help them appreciate how Lewis's semantics avoids sticky issues like transworld identity. 

