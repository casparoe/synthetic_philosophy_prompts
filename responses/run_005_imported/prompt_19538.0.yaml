answer: |-
  ## Hallway Debate: Wright vs. Pritchard on Hinges

  **Setting:** The hallway outside the seminar room. Coffee cups in hand, **Elena (Wrightian)** and **Leo (Pritchardian)** continue the debate.

  **Elena:** Leo, I still think you’re misreading Wittgenstein’s river-bed metaphor. Wright gets it right: the river-bed *enables* the flow of inquiry, the language-games. That *requires* a kind of rational warrant, however thin. Entitlement isn’t a "free pass," it’s recognition that trusting "There is an external world" or "My senses are generally reliable" is the *only rational starting point* for *any* investigation. To demand evidence *for them* is to misunderstand their role – it’s like demanding the river-bed justify itself using the water it channels! Without entitlement, skepticism wins by default.

  **Leo:** *(Leans against the wall)* But Elena, calling it "rational entitlement" smuggles in justification where there is none, *precisely* what Wittgenstein warns against! Saying trust in "The Earth is old" is *rational* implies it stands in the space of reasons, open to assessment. But hinges *aren’t* assessable like that – they’re the *bedrock*, the *hinges* upon which assessment turns! Pritchard’s point is crucial: Wright’s "entitlement" is just an honorific label stuck on pure animal certainty. It *feels* rational to us, like breathing feels necessary, but it’s not *grounded* in reasons. It’s pre-rational, a condition for having reasons at all. Calling it "entitlement" concedes the skeptic’s demand for warrant where none exists or is needed.

  **Elena:** Pre-rational? Animal certainty? That sounds dangerously close to saying our deepest epistemic commitments are mere reflexes! But hinges *function* rationally, Leo. Look at how "My hands exist" operates when I *infer* "Therefore, this object I see is real." It plays a premise-like role in countless inferences! How can something "outside the space of reasons" *play a role within reasoning*? Your view makes hinges inert, brute facts. But they’re dynamic, *enabling* justification for other propositions. Wright’s entitlement captures that functional role *as* rational – not justified *by* evidence, but rationally *required* for evidence to function.

  **Leo:** *(Holds up a hand)* Ah, but *that’s* the category mistake! You’re treating the hinge *as if* it were a premise *within* the language-game. But it’s not. It’s the *frame* holding the game together. When you infer "This object is real" from "My hands exist," you’re *already operating within* the framework where hands and objects are real. The hinge isn’t a *step* in the inference; it’s the *stage* on which the inference occurs. Pritchard’s non-doxastic view explains this: hinges are commitments manifested *in* our actions and inquiries, not beliefs *about* which we reason. Trying to treat them as premises drags them illegitimately into the justificatory game they make possible.

  **Elena:** Okay, grant that distinction for a moment. But here’s where Wright has the edge: normativity. If hinges are just "animal certainty," outside reasons, how do we explain why the flat-earther is *wrong*? On your view, isn’t "The Earth is flat" just *their* arational hinge commitment, as legitimate *for them* as "The Earth is old" is *for us*? You seem to leave us unable to say their hinge is defective. Wright’s entitlement avoids this relativism: we are entitled to *our* hinges *because* they underpin successful, frictionless inquiry across vast domains. The flat-earther’s hinge demonstrably *fails* to enable coherent, consistent inquiry – it constantly crashes into recalcitrant experience and requires ad hoc rescues. Entitlement is earned *functionally*, by enabling the smooth operation of the language-game, not bestowed arbitrarily.

  **Leo:** *(Chuckles)* Wright’s functionalism *is* tempting, I’ll grant you. But it’s retrospective justification masquerading as entitlement. *After* our hinge-based inquiry works, we *call* it entitled. But at the moment of *commitment*, when we *act* on "The Earth exists," there’s no calculation of future success or cost-benefit analysis. It’s immediate, instinctive trust – the "animal" part. As for the flat-earther, Pritchard *can* say they’re wrong, but not because their hinge lacks "entitlement." Their *specific empirical claims* within *their own* framework are massively incoherent and clash with other commitments *they likely hold* (like the reliability of technology or certain historical records). Their hinge isn’t *less entitled*; it’s that their *entire epistemic system*, built on *that* hinge, is globally dysfunctional and self-undermining. The defect isn’t in the hinge’s warrant (which it lacks on both views), but in the catastrophic failure of the system it anchors. Our criticism happens *within* our framework, comparing their *results* to ours.

  **Elena:** But Leo, that feels like a dodge. You still reduce our deepest certainties to a kind of epistemic luck – we happened to land on hinges that work! Wright gives us a *reason* to prefer ours: they are the ones that *can* be trusted to deliver coherent inquiry without constant disaster. That’s not retrospective; it’s a constitutive feature of what makes a proposition hinge-worthy *in the first place*. And Wittgenstein’s river-bed *does* shift, slowly – hinges *can* become subject to doubt in extraordinary circumstances. Wright’s entitlement, grounded in their enabling role, explains *why* we hold them fast *until* such extraordinary pressure arises. Your "animal certainty" seems static and immune to any rational pressure whatsoever.

  **Leo:** The river-bed shifts precisely *because* hinges aren’t beliefs! When a hinge dissolves – say, "The Earth is immovable" – it wasn’t *disproven* by evidence gathered *under its auspices*. The *entire framework* changed. The old "hinge" wasn't *falsified*; it ceased to *function* as the unchallengeable ground. Pritchard’s view explains this fluidity *better*. It’s not rational adaptation of a warranted belief; it’s a paradigm shift where old certainties become ordinary, doubtable propositions within a *new* framework anchored by *new* arational certainties. Wright’s "entitlement" risks freezing the river-bed, making hinges seem like permanently warranted, quasi-foundational beliefs. That’s not Wittgenstein’s dynamic picture.

  **Elena:** *(Sighs, looking at her watch)* We’re back to the river-bed... Wright sees it as rationally maintained infrastructure. You see it as primordial geology. I still say your view strips hinges of their essential role *within* our rational lives, making our epistemic agency passive. You make them too brute.

  **Leo:** *(Gathers his bag)* And I say Wright’s view smuggles in justification where Wittgenstein explicitly banishes it, playing the skeptic’s game and losing. It makes hinges too cognitive, too much like beliefs. They’re the *hinges*, Elena, not the door. They enable the opening and closing, but they aren’t part of the room’s contents. See you next week? The Moorean propositions await...

  **Elena:** *(Nods, a wry smile)* Until then. Though I suspect we’ll just be shifting the same bedrock arguments around. Pass the sugar?

  *(They walk towards the common room, the fundamental disagreement unresolved, echoing the seminar’s tension.)*
