  The user is asking if Leibniz would see the violation of Bell inequalities as vindication of his harmony, accepting superdeterminism, or if he'd reject the physicists' concept of locality because of his relational view of space. I need to break this down step by step.

  Leibniz would definitely reject locality as defined in physics because for him, space isn't fundamental. The spatial separation in Bell's setup wouldn't imply causal independence since monads don't interact spatially anyway. So he might argue that locality is misapplied because it assumes space is real, whereas for him, it's just a relation. That's supported by his letters to Clarke where he argues against Newton's absolute space.

