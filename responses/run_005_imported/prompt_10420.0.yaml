  But would he accept the violation as proof? Probably not. He'd see the experiments as revealing the harmony, but his framework is metaphysical, not scientific. He might argue that the experiments just show phenomena that his system already explains, without needing physics' concepts.

  Also, Leibniz might question the whole setup. Bell assumes separate systems with hidden variables, but monads are the only real substances. Particles might be manifestations of monads' perceptions, so the entangled particles aren't fundamental. That's stretching his texts a bit, but it's plausible based on his idealism.

