answer: |-
  The coffee tasted of static and inevitability. Silas Thorne stared into the black depths, the ceramic mug warm against his palm – a familiar anchor in a reality that felt increasingly… *selective*. Forty years dissecting particle collisions had ingrained the Everettian view: every quantum possibility branched, spawning uncountable worlds. He’d accepted it intellectually, like gravity. But accepting it *personally*, as the persistent locus of his own awareness? That was a different kind of scattering experiment.

  It started subtly. The near-miss on the highway – the truck swerving *just so* on the rain-slicked road, missing him by centimeters that felt like parsecs. He’d felt the adrenaline, the visceral shock, then the profound relief. Statistically improbable, sure, but life was full of improbable survivals. A blip.

  Then came the balcony railing. A quiet evening, leaning out to observe a rare comet. Old wrought iron, neglected. It gave way with a sickening groan. He remembered the lurch, the city lights tilting, the wind rushing past… then the impossible, jarring *stop*. His fall arrested by a tangled mess of ancient ivy roots and a miraculously positioned dumpster filled with discarded packing foam. Bruised, shaken, but alive. The paramedic whistled. "Lucky man. That shouldn't have held." Silas nodded, but the word *lucky* rang hollow. In the branching sea of worlds, Silas Thorne had simply found himself in a branch where the ivy held and the dumpster was soft. He’d *always* find himself in such a branch. *Conditional on existence*, he thought, Parfit’s unread arguments suddenly crystallizing in his mind. *The observer is only present where the observation continues.*

  He began noticing the *echoes*. The news reports: Flight 422, catastrophic engine failure over the Atlantic, no survivors. He’d *almost* booked that flight. He’d changed his mind last minute, opting for a later connection. Relief? Or a cold, creeping certainty? He checked the passenger manifest later; a Silas Thorne *was* listed. A version of him *had* boarded. That version was extinguished. *His* consciousness persisted in the branch where he hesitated.

  The lightning strike was the turning point. Hiking the exposed ridge during a brewing storm – a calculated risk, he’d thought, checking the radar. The bolt wasn’t calculated. It hit the ancient oak beside him with a sound like the universe tearing. Splinters flew, heat washed over him, the concussion knocked him flat. He lay there, ears ringing, smelling ozone and burnt wood, waiting for the numbness, the darkness. It didn't come. A massive branch had sheared off the tree, landing precisely to form a crude, charred lean-to over him, diverting the main force and the subsequent rain of debris. He crawled out, unscathed save for the ringing. Rangers found him hours later, pale but walking. "Divine intervention?" one joked. Silas just stared at the shattered tree. The probability was vanishingly small. From the outside, in any *single* universe, Silas Thorne should be a scorched outline on the mountainside. Yet here he was. *Conditional on existence...*

  He stopped flinching. He stopped feeling relief. He started *expecting* persistence. A gas leak in his apartment building? He woke to the faint smell, opened a window, went back to sleep. The explosion that leveled three units happened after he’d left for work. A mugging attempt in a shadowed alley? The assailant’s knife slipped from suddenly sweaty fingers, clattering to the ground as he tripped over unseen rubble. Silas stepped over him, his heart rate barely elevated. He bought a lottery ticket every week, not with hope, but with a detached curiosity. He never won. Of course not. Winning the lottery wasn't necessary for his conscious continuity. Survival was the only non-negotiable variable.

  The asymmetry was the core of it. From the *outside*, in any given branch, Silas Thorne was a statistical freak, a glitch in probability, surviving events that *should* have killed him dozens of times over. His life was a vanishingly thin filament winding through an infinite graveyard of his own corpses. But from the *inside*? There was only continuity. He hadn't *cheated* death; death simply hadn't happened *to him*. Each near-miss wasn't an escape; it was merely the branch his consciousness inhabited. The dread wasn't of dying; it was the dawning horror of realizing he might *never* die, not until the quantum possibilities for survival were truly exhausted – which, in an infinite multiverse, might mean enduring until the heat death of the universe in some grotesquely isolated branch.

  He looked at his life differently. Relationships withered. What was the point of connection when he was, functionally, immortal from his own perspective, while everyone else was statistically guaranteed to vanish from his branch eventually? He saw friends age, succumb to illness, accidents. He attended funerals, feeling like an imposter. His grief was real, but laced with the unbearable knowledge: in countless branches, *he* was the one in the coffin, mourned by *them*. Here, he was the monument to persistence.

  He stopped taking precautions. Why wear a seatbelt? If a crash was fatal, his consciousness wouldn't experience it; he'd only experience the branches where he survived, seatbelt or not. He walked across busy streets without looking, not out of recklessness, but profound indifference. Cars screeched, horns blared, he emerged unscathed. *Always* unscathed. He ate questionable food, ignored minor ailments. They never progressed. Why see a doctor? If the cancer was terminal, he'd only inhabit the branches where the biopsy was negative, or the treatment worked against all odds.

  His apartment became a shrine to his persistence. News clippings of disasters he'd narrowly avoided, photos of shattered wreckage he'd walked away from, the charred splinter from the lightning-struck oak. Not trophies, but evidence. Proof of the theorem unfolding in real-time.

  One rainy Tuesday, sitting in his quiet apartment, the silence broken only by the ticking of a clock (a purely mechanical one; he distrusted electronics now), he had the final, chilling realization. It wasn't just about *his* death. It was about *everything*.

  He picked up a glass paperweight, heavy and cool. He held it over the tiled floor. *If I drop this,* he thought, *it will shatter in almost all branches. But in the branches where I continue to exist, conscious, observing… it might not.* He let go.

  The paperweight struck the tile. There was a sharp *crack*. But it didn't explode into shards. It landed squarely on its base, wobbled precariously for a heart-stopping moment, and settled, intact. A single hairline fracture snaked up one side.

  Silas stared at it. Not relief. Not surprise. Just confirmation. The universe, for Silas Thorne, was bending over backwards to preserve his observation. The laws of physics weren't suspended; they were merely filtered through the sieve of his continued consciousness. Brittle glass could behave like rubber. Trucks could swerve. Balconies could hold. Lightning could miss. *Conditional on existence.*

  He picked up the paperweight. The fracture felt cold under his thumb. He looked out the window at the rain-lashed city. Billions of branches diverged every nanosecond. In most, Silas Thorne was already dead. In a dwindling, statistically absurd fraction, he persisted. And he would keep persisting, experiencing the increasingly bizarre sequence of non-fatal events necessary to sustain him, until the quantum wave function offered no paths forward that included a conscious Silas Thorne. Until entropy itself was forced to yield a habitable pocket for one last observer.

  He poured another coffee. It still tasted of static. He took a slow sip. The rain fell. The clock ticked. He existed. For now, and for an uncomfortable, perhaps immeasurable, stretch of time yet to come, that was the only inevitable truth. He would act accordingly: not courting death, not clinging to life, but simply… persisting. Waiting for the branch where even quantum immortality reached its logical, desolate end.
