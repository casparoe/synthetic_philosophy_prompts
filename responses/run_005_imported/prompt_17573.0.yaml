answer: |-
  Here's a counterexample challenging the "implicit denial of mutual subjection" account and supporting the "unfair enforcement" view:

  **The Case of the Unreformed Habitual Offender (UHO):**

  Dr. Aris Thorne, a senior philosophy professor, is notorious for habitually violating the department's strict "24-Hour Rule" for grading undergraduate essays. The rule requires graded work to be returned within 24 hours of submission. Thorne consistently takes 7-10 days, despite repeated reminders. He openly admits this failing to his colleagues and students alike. When a student complains about late grading, Thorne readily agrees: "You're absolutely right to be upset about late grading. It *is* disrespectful and unprofessional. Frankly, I'm just as guilty of it as anyone else in this department who fails to meet the deadline. I miss the deadline constantly myself, and I have no excuse. The rule applies to me just as much as to anyone – I'm not exempt, I'm just failing."

  Later, Thorne discovers that his junior colleague, Dr. Elena Reed, returned a set of midterm essays 36 hours late due to a family emergency. Thorne publicly reprimands Reed at a department meeting: "Dr. Reed, your failure to meet the 24-hour deadline is unacceptable. It shows a lack of respect for students and undermines departmental standards. This kind of laxity cannot be tolerated." Reed, knowing Thorne's record, objects: "But you *never* meet the deadline yourself!" Thorne responds: "That's entirely true, and I admit it freely. My own chronic lateness is equally wrong and equally subject to criticism. The rule binds us both equally. My failing doesn't make yours any less of a failing. The standard must be upheld."

  **Analysis & Argument Against the "Mutual Subjection" Account:**

  1.  **Explicit Affirmation, Not Denial, of Mutual Subjection:** Thorne explicitly *affirms* that he and Reed are equally subject to the moral demand (the grading rule). He states:
      *   "The rule applies to me just as much as to anyone."
      *   "I'm not exempt."
      *   "The rule binds us both equally."
      *   "My failing doesn't make yours any less of a failing."
      *   He concedes his guilt is identical to Reed's.
      Crucially, he *does not* claim a special exemption. He openly admits he is violating the same standard he holds Reed to. According to the "mutual subjection" account, this explicit affirmation should *restore* his standing to blame, as he is not implicitly denying their equal subjection. Yet, intuitively, Thorne *still* seems to lack standing to blame Reed. His blame feels objectionable, hypocritical, and unfair.

  2.  **The Persistent Intuition of Disqualification:** Why does Thorne's blame still feel illegitimate?
      *   **Unfair Selective Enforcement:** Thorne is actively *enforcing* a standard on Reed that he *habitually and knowingly violates* himself, despite his admissions. He demands Reed bear the burden of compliance (and the sting of blame for non-compliance) while he systematically avoids that burden in his own practice. His admission doesn't change the fact that he *isn't* holding *himself* accountable in any meaningful way; he continues the offending behavior unabated.
      *   **Lack of Moral Authority/Practicing What You Preach:** Blaming effectively often requires a degree of moral authority or credibility. Thorne, by being an unrepentant, ongoing violator, undermines this authority. His actions signal that the rule isn't actually *that* important, or that violating it isn't *that* blameworthy, because he does it constantly without consequence to himself. His blame of Reed rings hollow because his own conduct fundamentally contradicts the seriousness with which he treats the violation when committed by others.
      *   **Exploitation of the Norm:** Thorne benefits from the norm (others grading promptly maintains general student satisfaction and departmental reputation) while freely flouting it himself. His blame of Reed attempts to leverage a norm for his own purposes (disciplining a colleague, perhaps asserting dominance) without contributing to its maintenance through his own compliance. This is exploitative.

  **Defending the "Unfair Enforcement" View:**

  The UHO case supports the rival view: **What disqualifies the hypocrite is the *unfairness* inherent in continuing to *enforce* a standard on others that one is *not holding oneself to in practice*, regardless of one's stated beliefs about mutual subjection.**

  *   **Core Unfairness:** The core wrong in Thorne's blame is the unfairness of imposing a demand (compliance + liability to blame for non-compliance) on Reed that he refuses to impose on himself. He creates a double standard *in practice*. His verbal admissions don't negate this practical double standard; they highlight it. He acknowledges the rule applies to him, yet his actions demonstrate he doesn't *accept* its binding force *for his own conduct* in the same way he demands Reed accept it.
  *   **Focus on Practice, Not Just Belief:** The unfairness view correctly focuses on the *agent's practical relationship to the norm* and the *action of blaming*. Thorne's *actions* (constant violation + blaming others) are unfair, irrespective of his sincere *belief* in mutual subjection. The disqualification stems from the inconsistency *in enforcement*, not primarily from a flawed meta-ethical attitude.
  *   **Explains the Residual Intuition:** This view perfectly explains why Thorne still lacks standing despite his admissions. His ongoing, unaddressed failure to meet the standard he enforces on others makes his blame an act of unfairness. He hasn't leveled the playing field; he's just stated that it *should* be level while standing on a hill scolding someone in the valley.
  *   **Handles Standard Hypocrisy Too:** This view also explains standard hypocrisy cases (where the hypocrite denies or hides their own fault). In those cases, the unfairness *also* exists, *and* there's the added element of deception or bad faith. The UHO case shows that the unfairness is the *fundamental* disqualifying factor; denial of mutual subjection is often a *symptom* or *enabling mechanism* for that unfairness, but not strictly necessary for disqualification.

  **Conclusion:**

  The Unreformed Habitual Offender case demonstrates that explicit verbal affirmation of mutual subjection and rejection of self-exemption is insufficient to restore standing to blame if the blamer continues to *practice* a double standard by systematically violating the norm while enforcing it on others. The persistent intuitive lack of standing in this case strongly supports the "unfair enforcement" account: the hypocrite's blame is disqualified primarily because it is unfair to hold others accountable to a standard one is not holding *oneself* accountable to *in practice*. The disqualification stems from the *action* of selective enforcement and the practical inconsistency it embodies, not solely (or even necessarily) from an implicit denial of shared moral subjection. This view better captures the core ethical failing of hypocritical blame.
