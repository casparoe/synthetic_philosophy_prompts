answer: |-
  ## Dialogue: The Frog's Indeterminate Snapshot

  **Setting:** A university common room after a philosophy of mind colloquium. Coffee cups litter the table. **Dr. Anya Teleos** (Committed Teleosemanticist) and **Dr. Ben Causal** (Causal-Informational Semanticist) continue their debate.

  **Dr. Anya Teleos (Teleos):** Ben, your talk was stimulating, but I keep circling back to our amphibious friend. You dismissed teleosemantics' solution to the disjunction problem for the frog's visual state too quickly. Natural selection *didn't* just shape a detector for "small, dark, moving thing." It shaped a *fly-catching mechanism*. The *proper function* of the entire visual-motor circuit, determined by its selection history, is to get *flies* into the frog’s stomach. That’s the *explanation* for why the detector exists in its current form. When the state tokening is caused by a fly, it’s functioning *properly*. When it’s caused by a BB pellet or a bit of wind-blown detritus, it’s *malfunctioning* – it’s a *false positive*. Teleology provides the normativity that fixes "fly" as the content, silencing the disjunction. What else *could* determine that the frog is *mistaken* when it snaps at a non-fly?

  **Dr. Ben Causal (Causal):** Anya, I appreciate the elegance of the teleological story, truly. But it smuggles in specificity that the selection history doesn't actually warrant. *Why* was fly-catching selected for? Because flies are nutritious *and* they reliably caused "small, dark, moving" retinal patterns in the frog's ancestral environment. Selection didn't "care" about flies *qua flies*; it "cared" about the reliable covariance between that visual pattern and a nutritive food source. The mechanism was selected *because* it responded to that informational signal. The content *is* the reliably covarying property: "small, dark, moving thing" (SDMT). "Fly" is just the *paradigm instance* in the EEA (Environment of Evolutionary Adaptedness). But the mechanism's causal history, both evolutionarily and presently, links it directly to SDMTs, not to the biological category "fly" in any essentialist sense. Attributing "fly" overreaches what the selection forces explain.

  **Teleos:** You're conflating the proximal cue with the distal object of the function! Selection pressures act on the *consequences* of behavior. Frogs that successfully *ate nutritious food* reproduced more. The visual state is part of a system whose *success condition* is ingesting a fly. That success condition – fly-consumption – is what defines the function and hence the content. The SDMT pattern is merely the *means* by which the system was *designed* to detect flies. When the mechanism uses that means but fails to achieve the success condition (e.g., snapping at a BB), it's failing to perform its function. The content *must* be the success condition – "fly" – otherwise, how do you account for the *failure*? If the content *is* SDMT, then snapping at a BB pellet isn't a mistake; it's a *correct* detection of an SDMT! But that's absurd. The frog *isn't* getting nutrition; the mechanism *isn't* fulfilling its biological purpose.

  **Causal:** But Anya, *how* does selection "know" the success condition is "fly" and not "nutritious SDMT"? In the ancestral swamp, SDMTs *were* flies, overwhelmingly. Selection optimized for a detector sensitive to SDMT *because* SDMT reliably correlated with nutrition. It didn't optimize for discriminating flies from non-fly SDMTs *because that distinction didn't matter reproductively*. The mechanism's function, teleologically speaking, *is* to detect SDMTs! That *is* the property it was selected for responding to. The "success" was consuming SDMTs, which happened to be flies. When it snaps at a BB, it *is* correctly detecting an SDMT – the mechanism is functioning as selected. The "failure" is downstream: the SDMT wasn't nutritious. But that failure belongs to the *digestive system* or the *world's correlation*, not the *detector's representational content*. The detector did its job: flag SDMT. Attributing "fly" imposes an anachronistic category onto a process selected for covariance with a simpler property.

  **Teleos:** That reduces biological function to mere reliable causation and ignores the hierarchical nature of functional explanation! The digestive system's function is to extract nutrients from *food*. The *tongue-flick* mechanism's function is to deliver *food* to the mouth. The *visual detection* mechanism's function is to initiate the tongue-flick *when food (specifically flies) is present*. The "nutritious SDMT" isn't the proper object; it's the *fly*, identified *via* SDMT. The selection pressure came from the *absence of flies* meaning *starvation*, not the absence of abstract SDMTs. The frog's visual state is part of a system *for fly-catching*. Its content is fixed by that systemic role defined by evolutionary success. Without that teleological anchor, your "SDMT" is just as disjunctive as Fodor's "fly or bee or speck". Teleosemantics provides the anchor.

  **Causal:** And my point, Anya, is that the anchor you describe – the evolutionary "purpose" – is itself defined at the level of covariance with an environmental feature (SDMT correlated with nutrition), *not* with a specific biological kind. The selection history explains *why* covariance with SDMT was advantageous, but it doesn't magically confer content about a *kind* that the mechanism itself is causally insensitive to. The mechanism is only "tuned" to SDMT. Attributing "fly" content requires projecting *our* knowledge of biological taxonomy onto the frog's simple detection system. Teleosemantics promises determinate content, but when you drill down, the teleology only fixes the content to the level of the reliable *indicator property* that was evolutionarily relevant – SDMT – which remains disjunctive. It doesn’t get you to "fly" without an illicit appeal to our external categorization.

  **Teleos:** But the *failure* condition shows the content *isn't* SDMT! When the detector fires at an SDMT that isn't a fly, and the frog wastes energy snapping, that's a *failure of the visual system's function within the fly-catching system*. That failure only makes sense if its function is to detect *flies*, not SDMTs in general. The teleology *is* specific enough.

  **Causal:** And I maintain that failure is a failure of the *world* to maintain the correlation the detector evolved to exploit, or a failure of the *digestive system* to handle the input, not a failure of *representation* by the detector. The detector represented accurately: SDMT present. The problem lies elsewhere. Teleosemantics conflates systemic failure with representational inaccuracy. The content is fixed by the causal-informational link: SDMT. The teleology explains *why* that link exists, but doesn't change the content it carries.

  *(They both pause, sipping cold coffee. The disagreement remains fundamental – hinging on whether biological function inherently specifies a "proper object" beyond the reliable indicator property it exploits.)*

  **Teleos:** So, we remain at an impasse. You see the selection history as only fixing the indicator property (SDMT), leaving content disjunctive. I see it as fixing the functional target (fly), providing determinacy via systemic normativity.

  **Causal:** Precisely. You find normativity in the systemic purpose; I find it only in the reliable causal covariance. The frog's snap remains ambiguous evidence for both our stories. Another coffee? I think we'll need it.

  **Teleos:** (Sighs, a small smile) Indeed. Black, please. The debate, like the fly detector, seems perfectly designed to keep us engaged, even if we sometimes snap at phantoms.
