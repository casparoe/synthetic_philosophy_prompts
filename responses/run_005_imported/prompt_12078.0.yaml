prompt: |-
  So I fell down a pretty deep internet rabbit hole a couple weeks ago that started from an AI safety argument and somehow ended up on the EA forum / LessWrong pages about decision theory, and I got kind of stuck on this idea called "evidential cooperation in large worlds" (ECL) — apparently Oesterheld originally called it "multiverse-wide superrationality" back in 2017 before people renamed it. I should say upfront I'm a backend dev with zero formal philosophy training, so I'm probably mangling some of the terminology. I tried explaining the idea to my partner over dinner and totally butchered it, so afterward I sat down and wrote up my own version just to get it straight in my head. Before I post it anywhere and embarass myself, I'd love a sanity check from someone who actually knows this stuff, since I definately don't trust my own read on it yet.

  Here's basically what I wrote: "Take Hofstadter's old idea of superrationality: in a one-shot prisoner's dilemma against someone who reasons exactly like you do, you should cooperate, because even though your choice and theirs aren't causally connected, they're correlated — like calling the same pure function twice with the same input, the two calls don't need to 'talk' to each other for you to know they return the same thing. Now stretch that across a multiverse (or honestly just a really big universe) that almost certainly contains a huge number of civilizations we can never causally touch. Some of those, purely by chance, will be running something close enough to our own decision procedure. ECL is the claim that we should act as if we'd struck a deal with all of them: give some weight to their values instead of only our own, because doing that is evidence our distant 'counterparts' are doing the same thing for us, so everybody's values end up better served on average, without a single signal ever passing between any of the parties involved."

  The bit where I get stuck: in the toy example, the two programs literally share source code, so of course they're correlated. But actual alien civilizations (or whatever's out there) obviously aren't running identical decision procedures to ours, they're at best "kinda similar," so isn't the whole "my choice is evidence about theirs" move a lot shakier once you leave the clean twin-program case? It kind of feels like you could talk yourself into being "correlated" with basically anyone if you wanted the trade to go through bad enough. Is that an actual hole in the argument, or is there some standard move in that literature that patches it? And separately, just tell me straight — did I get the core argument roughly right, or mangle it somewhere, and is this actually a serious idea people argue about, or more of a fun thought experiment nobody really puts real weight on?
