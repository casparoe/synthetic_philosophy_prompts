  First, I need to parse Hobbes' argument. He defines necessitation as the sum of all causes leading to an action. Everything is determined, including the will. Liberty, for Hobbes, is just the absence of external obstacles. So even if internal desires are determined, as long as you can act on them without hindrance, you're free. The fire analogy shows that just like fire burns by necessity, humans act on their strongest desire by necessity. But the user is right to question if this redefines liberty too thinly.

