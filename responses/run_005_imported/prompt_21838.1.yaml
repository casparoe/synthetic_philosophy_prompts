  - Tuesday: received $1/3 for a bet that doesn't pay.
  - Net cash: -0.50 + 1/3 + 1/3 = -0.50 + 0.666 = +0.166

  If the coin is Heads:
  - Sunday: paid $0.50 for a bet that pays $1.
  - Monday: received $1/3 for a bet that she must pay $1 (since Heads).
  - (There is no Tuesday awakening.)
  - So net cash: -0.50 + 1 (from Sunday bet) + 0.33 (from selling the bet) - 1 (paying out on the Monday bet) = -0.50 + 1 + 0.33 - 1 = -0.17.

  So she gains $0.166 if Tails and loses $0.17 if Heads. Not a guaranteed loss.

  The bookie could adjust the amounts. Or perhaps we should have the bookie only make one bet on an awakening. But then in the Tails case, there is a 50% chance that the bookie catches her on Monday or on Tuesday? This is getting too complicated.

  In the literature, it's known that diachronic Dutch books in self-locating cases are tricky and may not work as expected.

  For the dialogue, we can have Bailey argue that in the Sleeping Beauty case, the Dutch book seems to work only if we ignore the fact that there are two opportunities in the Tails case, and then it's not a guaranteed loss. And Alex can reply that it's still a Dutch book because the agent has a net loss in one case and not enough gain in the other to compensate, but in my calculation, she gains in Tails and loses in Heads, and the expected loss on Sunday is zero? Let's compute expected utility on Sunday.

  On Sunday, the expected net cash:

  With probability 1/2: Heads -> loss of $0.17
  With probability 1/2: Tails -> gain of $0.166

  But these are close, and due to rounding, they are not equal. Let's use fractions.

  Heads: net = -0.50 + 1 (from Sunday bet) + 1/3 (from selling the bet on Monday) - 1 (payout on Monday bet) = -1/2 + 1 + 1/3 - 1 = -1/2 + 1/3 = -3/6 + 2/6 = -1/6.

  Tails: net = -1/2 (paid on Sunday) + 1/3 (Monday) + 1/3 (Tuesday) = -1/2 + 2/3 = -3/6 + 4/6 = 1/6.

  So expected net: (1/2)(-1/6) + (1/2)(1/6) = 0.

  So no expected loss. Therefore, not a Dutch book.

  So in the Sleeping Beauty case, even though she violates Reflection, there is no diachronic Dutch book that guarantees a loss.

  Alex can then say: "Exactly! Because in this case, the change in credence is rational, and the Dutch book doesn't work. So the Reflection Principle should be restricted to cases where the future credence results from a rational update, and the Dutch book only goes through when the agent is vulnerable due to an update that is not conditionalization or is in some way incoherent."

  Bailey: "But then the Dutch book argument for Reflection is not an independent argument; it's a corollary of the Dutch book argument for conditionalization and other update rules. And it doesn't provide a new justification."

  Alex: "It still has force. It shows that if you violate Reflection in a context where you do expect to update rationally, then you are vulnerable to a Dutch book. That's a pragmatic sanction."

  Bailey: "But in the hypnosis case, if you violate Reflection, you are not vulnerable, because the update is not rational. So the Dutch book argument only applies to the cases where you expect to update rationally, which is exactly when you should satisfy Reflection. It's circular."

  Alex: "It's not circular. The justification for conditionalization is separate and comes from its own Dutch book. Then, for an agent who updates by conditionalization, Reflection is also enforced by a Dutch book. It's a package."

  Bailey: "I see your point, but it feels like the Dutch book for Reflection is then redundant. And more importantly, it doesn't help in the gray areas, like when you expect to update by a rule that is not conditionalization but is still rational, such as in cases of forgetting or self-locating beliefs."

  Alex: "Then we need to extend the Dutch book argument to those update rules. For example, there are Dutch books for Jeffrey conditioning. So the Reflection Principle can be adjusted to the update rule you expect to use."

  Bailey: "But that means that Reflection is not a universal principle; it's always relative to your expected updating strategy. And that, to me, suggests that the principle is empty without a prior commitment to how you will update. The original allure was that it was a simple principle of self-trust that stood on its own."

  Alex: "Perhaps, but I think it's still valuable. And in the standard case of learning by conditionalization, it holds and is justified by the Dutch book."

  Bailey: "Fair enough. But then we've come a long way from van Fraassen's original formulation, and the principle is now hedged with qualifications."

  Alex: "That's philosophy for you."

