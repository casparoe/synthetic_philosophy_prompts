answer: |-
  You've hit on a core tension in Anscombe's argument that continues to spark debate. You're right that the scale of death in Tokyo and other firebombed cities was comparable to Hiroshima and Nagasaki, and that the planners of those raids weren't singled out by Anscombe in the same way. Understanding why requires digging into the *specificity* of her philosophical objection, which was **not primarily about the weapon type (nuclear vs. conventional), but about the *intention* and the *moral principle violated*.**

  Here's a breakdown of Anscombe's core argument and why she focused on Truman:

  1.  **The Principle of Double Effect & Intention:** Anscombe, a leading figure in modern virtue ethics and Catholic moral philosophy, rigorously applied the principle of double effect (PDE). PDE states that it can sometimes be permissible to cause a foreseen but unintended "side effect" (like civilian deaths) while pursuing a legitimate good end (like destroying a military target), provided:
      *   The act itself is good or neutral.
      *   The bad effect is not intended, only foreseen.
      *   The good effect isn't achieved *by means of* the bad effect.
      *   There is a proportionately grave reason for permitting the bad effect.

  2.  **Targeting the Innocent *as a Means*:** Anscombe argued that the atomic bombings fundamentally failed PDE. Her key contention was that the bombings **intentionally targeted the civilian population *as the direct means* to achieve the end (Japan's surrender).**
      *   The bombs were dropped on entire cities, not precision military targets. While there were military installations within the cities, the *primary* and *intended* destructive force was unleashed upon the civilian populace.
      *   The destruction of the civilian population and the terror it caused *was the instrument* used to coerce surrender. As she wrote in her pamphlet "Mr. Truman's Degree," the plan was "to kill the innocent as a means to an end." This, for Anscombe, was the very definition of murder – the intentional killing of the innocent.
      *   She explicitly rejected the argument that the civilians were merely "foreseen" casualties of attacking military targets. The cities *themselves* were the targets.

  3.  **Moral Absolutism:** Anscombe held that intentionally killing innocent non-combatants is **always intrinsically evil**, a moral absolute that cannot be outweighed by good consequences. Even if dropping the bombs *did* end the war sooner and save lives overall (a point she contested on factual grounds), it would still be morally impermissible because it involved committing an intrinsically evil act (intentional murder) to achieve a good end. She saw this as the essence of utilitarianism gone wrong – "the end justifies the means."

  4.  **Why Truman Specifically?**
      *   **Direct Responsibility:** Truman was the President who made the final, explicit decision to use the weapon *in this manner*. He bore direct, personal responsibility for authorizing an act Anscombe believed was murder.
      *   **The Honor:** Oxford University proposing to give an *honorary degree* to Truman was the catalyst. For Anscombe, honoring a man who had authorized such an act was a profound moral scandal. It signaled approval or indifference to what she saw as a grave evil. Her protest ("We teach men to be ready to murder their fellow men...") was aimed at preventing the university from implicitly endorsing his decision.
      *   **Symbolic Power of the Bomb:** While the *moral principle* was about intention and targeting innocents, the unprecedented, singular destructive power of the atomic bomb made the act uniquely horrifying and vivid. It crystallized the issue in a way the firebombing campaign, horrific as it was, perhaps did not for the public and academic conscience at that specific moment. Protesting Truman *was* a way to protest the act itself using a highly visible platform.
      *   **Focus of the Protest:** The protest was occasioned by a specific event (the degree) involving a specific individual (Truman) responsible for a specific act (authorizing the atomic bombings). It wasn't a comprehensive campaign against all Allied strategic bombing leaders, though she certainly believed their actions were also morally wrong.

  **Addressing Your Concerns:**

  *   **"Inconsistency" with Firebombing?** This is a common and valid criticism. Anscombe *did* believe the area bombing of cities like Tokyo and Dresden was also morally indefensible under the same principle – intentionally targeting civilians *as a means* to demoralize the enemy and break their will to fight. She saw it as part of the same morally corrupt strategy. Her failure to mount a similar public campaign against, say, Churchill or Arthur Harris (head of RAF Bomber Command) doesn't necessarily mean she thought their actions were *less* wrong *in principle*. It reflects the *specific context* of the Oxford degree offer to Truman. One could argue she *should* have protested others similarly, but the absence of such protests doesn't invalidate her core argument against Truman's specific action. Her writings make clear she opposed the intentional killing of non-combatants generally.
  *   **"Dressed up as a principled stand"?** Her stand *was* deeply principled, rooted in her understanding of absolute moral prohibitions against intentional killing of the innocent. The atomic bombings provided the starkest, most undeniable example of this principle being violated on a massive scale by a single, identifiable decision of one man who was about to be honored. The weapon's novelty and power amplified the horror, but the *core moral objection* (intentional targeting of innocents) applied equally to the firebombings. The protest against Truman was the application of that principle to a concrete, highly visible situation.

  **In essence:** Anscombe argued Truman was a murderer because he intentionally ordered the killing of tens of thousands of innocent civilians *as the direct means* to force Japan's surrender. This, for her, violated an absolute moral law. While the firebombings were equally horrific and violated the same principle, the offer of an honorary degree to Truman provided a specific, high-profile occasion for her to make a public stand based on this absolute moral principle. Her focus on Truman was about his direct responsibility for *this specific act* being honored, not about nuclear weapons being uniquely evil *in kind* compared to incendiaries, but rather about the uniquely clear and massive *scale* of the intentional evil authorized by one man. Her core argument stands or falls on whether one accepts her absolute prohibition against *intentionally* targeting non-combatants, regardless of the weapon used.
