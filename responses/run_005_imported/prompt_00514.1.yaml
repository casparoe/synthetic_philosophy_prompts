prompt: |-
  So I've read like a million posts about Newcomb's problem over the years (LW loves it) but I recently stumbled on the smoking lesion problem and now I'm confused about how they relate. Can you compare the two? Specifically I want to know if one-boxing on Newcomb commits you to also doing the "irrational" thing on the smoking lesion case, or if theres a principled way EDT/CDT proponents draw the line between them.
reasoning: |-
  Okay, the user is asking about the relationship between Newcomb's Problem and the Smoking Lesion problem. They mention having read many posts on Newcomb's Problem, especially from LessWrong (LW), but are now confused about how it connects to the Smoking Lesion problem. Their main question is whether choosing to one-box in Newcomb's commits them to the "irrational" choice in Smoking Lesion, and if there's a principled distinction that EDT and CDT proponents use.

  First, I need to recall both problems. Newcomb's involves a predictor where one-boxing (taking only the opaque box) is usually associated with EDT, leading to better outcomes. CDT often suggests two-boxing. The Smoking Lesion problem is different: a lesion causes both smoking and cancer, but smoking itself doesn't cause cancer. Here, EDT would avoid smoking, while CDT would smoke since it doesn't cause cancer. The user is confused because both involve correlation, but the recommended actions differ.

  The user's explicit question is about whether one-boxing ties them to not smoking. But their deeper need might be understanding the underlying principles that differentiate these cases. They might be struggling with when to follow EDT or CDT and want a clear framework to decide.

  I should explain the key difference: in Newcomb's, the predictor's choice depends on the agent's decision, creating a dependency that EDT exploits. In Smoking Lesion, the lesion is a fixed state; the decision doesn't affect it. CDT's action doesn't influence the lesion, so it focuses on the direct effect of smoking. This distinction is crucial for why one-boxing is rational in Newcomb's but not smoking in the lesion problem.

  The user might be seeking validation of their understanding or clarity on the principles. They might also be interested in how EDT and CDT handle pre-existing conditions versus actions that affect outcomes. Highlighting the causal graphs could help: Newcomb's has the decision causing the prediction, while the lesion is a common cause. Emphasizing that CDT cares about causal pathways, ignoring non-causal correlations, while EDT considers all dependencies.

  I should also address if there's a principled way to draw the line. Point out that CDT proponents argue Newcomb's predictor is a special case where correlation implies causation backward, but in Smoking Lesion, correlation doesn't imply that quitting affects the lesion. Clarifying the difference in causal structures here is key. Mentioning how EDT and CDT evaluate counterfactuals differently might help too.

  Finally, reassure the user that one-boxing doesn't force them to avoid smoking in the lesion problem. The principles are consistent within each decision theory. Highlighting the role of agency and whether the action causally influences the outcome versus being correlated independently.
answer: |-
  You've hit on a core tension in decision theory! Newcomb's Problem and the Smoking Lesion Problem are designed to pit Evidential Decision Theory (EDT) against Causal Decision Theory (CDT), but they do it in subtly different ways. Here's a breakdown and how they relate:

  **The Core Conflict: EDT vs. CDT**

  *   **Evidential Decision Theory (EDT):** Chooses actions that provide the best *evidence* for desirable outcomes. It maximizes *conditional* expected utility: `EU(A) = Σ [P(O|A) * U(O)]`. EDT cares about the *correlation* between your action and the outcome, even if the action doesn't *cause* the outcome.
  *   **Causal Decision Theory (CDT):** Chooses actions that *cause* the best expected outcomes. It maximizes *causally conditioned* expected utility, often represented using do-calculus or causal models: `EU(A) = Σ [P(O | do(A)) * U(O)]`. CDT tries to ignore correlations that aren't causal.

  **Newcomb's Problem: The Predictor's Game**

  1.  **Setup:** A super-intelligent Predictor (almost always correct) puts $1,000,000 in an opaque box if it predicts you'll take *only* that box (one-box). It puts $0 in the opaque box if it predicts you'll take *both* boxes (two-box). You also see a transparent box containing $1,000.
  2.  **Choices:**
      *   **One-box:** Take only the opaque box.
      *   **Two-box:** Take both boxes.
  3.  **EDT Reasoning (One-box):** "If I one-box, that's *evidence* the Predictor *put $1M in the box*. P($1M in box | I one-box) is very high. Expected value ~$1M. If I two-box, that's *evidence* the Predictor *put $0 in the box*. P($1M in box | I two-box) is very low. Expected value ~$1,000. One-boxing has higher conditional expected utility."
  4.  **CDT Reasoning (Two-box):** "My choice *now* cannot *cause* what the Predictor did *in the past*. Whatever is in the opaque box is fixed. Taking both boxes *causes* me to get the contents of the opaque box *plus* $1,000. This is always better than just taking the opaque box. Two-boxing dominates." (P(O | do(two-box)) = P(O | two-box) because the prediction is already set).
  5.  **Dominant Intuition:** One-boxing seems rational (get $1M) despite CDT's "domination" argument suggesting two-boxing.

  **Smoking Lesion Problem: The Spurious Correlation**

  1.  **Setup:** You have a genetic lesion. This lesion:
      *   Causes a strong *desire* to smoke.
      *   Independently causes lung cancer.
      *   Smoking itself *does not cause cancer* (in this hypothetical).
      The lesion is present from birth. You don't know if you have it.
  2.  **Choices:**
      *   **Smoke:** Indulge the desire.
      *   **Not Smoke:** Resist the desire.
  3.  **EDT Reasoning (Don't Smoke):** "If I smoke, that's *evidence* I probably have the lesion. P(Cancer | Smoke) is very high. If I don't smoke, that's *evidence* I probably *don't* have the lesion. P(Cancer | Not Smoke) is very low. Not smoking provides better evidence for not having cancer." (Even though smoking doesn't *cause* cancer).
  4.  **CDT Reasoning (Smoke):** "My choice to smoke or not *does not cause* whether I have the lesion. That was fixed at birth. My choice *does not cause* cancer; only the lesion does. Smoking itself is pleasurable and harmless in this scenario. Since I might have the lesion anyway, I might as well enjoy smoking. Smoking dominates not smoking in terms of pleasure vs. no pleasure, with cancer risk unchanged by my action." (P(Cancer | do(Smoke)) = P(Cancer) = P(Lesion), P(Cancer | do(Not Smoke)) = P(Cancer) = P(Lesion)).
  5.  **Dominant Intuition:** Smoking seems irrational (why do something correlated with cancer?) despite CDT's "harmlessness" argument. Not smoking is the intuitive choice.

  **Comparing the Problems & Answering Your Questions:**

  1.  **Similarity:** Both exploit the EDT/CDT split by presenting scenarios where an action (one-boxing, not smoking) is *correlated* with a good outcome ($1M, no cancer) but (arguably) doesn't *cause* it. Both challenge CDT's insistence on ignoring non-causal correlations.
  2.  **Crucial Difference - The Direction of Dependency:**
      *   **Newcomb's:** The *outcome* (money in box) *depends on the prediction* of your *future action*. Your action is the *cause* of the prediction (backwards in time). EDT exploits the link between your *choice* and the *predictor's past decision*.
      *   **Smoking Lesion:** The *action* (smoking) and the *outcome* (cancer) are *both effects* of a common *prior cause* (the lesion). There is *no causal link* from action to outcome. EDT exploits the correlation flowing *from the common cause*.

  3.  **Does One-Boxing Commit You to Not-Smoking? (EDT Position)**
      *   **Yes, if you're purely EDT.** A consistent EDT agent uses the same logic in both: maximize conditional probability of good outcomes. One-boxing conditions on getting $1M; not-smoking conditions on avoiding cancer. The source of the correlation (prediction vs. common cause) doesn't change the *evidential* calculation for EDT.
      *   **This is why many find EDT's recommendation in the Smoking Lesion irrational/ineffective.** Not smoking doesn't *change* your cancer risk; it just tells you something about it. You deny yourself pleasure for no causal benefit. CDT proponents see this as EDT falling prey to spurious correlation.

  4.  **Does One-Boxing Commit You to Smoking? (CDT Position)**
      *   **No.** A consistent CDT agent *can* one-box in Newcomb's *without* smoking in the Smoking Lesion. How?
      *   **Refined CDT (e.g., using causal models):** Sophisticated CDT proponents argue Newcomb's *is* causal, just with backwards causation/acausal correlation. The predictor's mechanism creates a situation where your choice *is* a cause of the outcome *through the prediction link*. `P($ in box | do(one-box))` is high because your choice *causes* the prediction (or is acausally linked to it in a way that matters). The causal graph links Choice -> Prediction -> Box Contents -> Reward.
      *   **Smoking Lesion remains non-causal:** The causal graph is Lesion -> Desire to Smoke AND Lesion -> Cancer. Smoking is just an effect of Desire. There's no arrow from Smoke -> Cancer. `P(Cancer | do(Smoke)) = P(Cancer | do(Not Smoke)) = P(Lesion)`. Smoking is causally irrelevant to cancer.
      *   **Principled Distinction (CDT View):** The line is drawn based on the *causal structure*:
          *   In Newcomb's, your action *can influence* the outcome via the predictor's dependency (even if backwards/acausal).
          *   In Smoking Lesion, your action *cannot influence* the outcome (cancer); it's fixed by the pre-existing lesion. The correlation is purely diagnostic, not causal.

  5.  **The Line Drawing (Principled Differences):**
      *   **EDT Proponents:** Draw no fundamental line between the problems. Both involve conditioning on actions to get evidence about desirable states. Rationality is about maximizing expected utility given *all* information, including correlational information. They bite the bullet on Smoking Lesion.
      *   **CDT Proponents:** Draw a sharp line based on *causal influence*. Actions should only be evaluated based on their actual causal effects. Newcomb's is special because of the predictor's design, making the action causally relevant. Smoking Lesion exemplifies the danger of acting on spurious correlations. They bite the bullet on naive CDT in Newcomb's, often refining CDT to handle predictors.
      *   **FDT/UDT Proponents (Functional/Updateless):** Offer a different perspective, treating decisions as outputs of a function across all similar situations. They typically one-box *and* smoke, seeing Smoking Lesion as a case where your decision *reveals* information about the fixed lesion but doesn't change it, so you should optimize for pleasure. They draw the line based on logical dependencies across possible worlds/algorithmic similarity.

  **Conclusion:**

  *   A **pure EDT** agent *is* committed to both one-boxing and not-smoking. They see both as rational evidential moves.
  *   A **pure, naive CDT** agent is committed to two-boxing and smoking. They see both as avoiding irrational correlation-chasing.
  *   **Sophisticated CDT proponents** (the majority view now) argue for a **principled distinction based on causal structure**: They one-box (because the predictor makes choice causally relevant) but smoke in the lesion (because smoking is causally inert). Their line is "Does my action *cause* (or acausally influence) the outcome?"
  *   **FDT/UDT** agents also draw a principled line (logical counterfactuals/algorithmic similarity) and would typically one-box *and* smoke.

  So, no, one-boxing in Newcomb's does not *force* you to not-smoke in the Smoking Lesion. The key question is *why* you one-box. If you one-box based on a causal (or acausal) argument involving the predictor's dependency, you can consistently smoke in the lesion based on the lack of causal effect. If you one-box purely because it's evidence of money, then EDT consistency demands you also treat not-smoking as evidence against cancer. The debate hinges on whether acting on purely correlational evidence, especially when it stems from a common cause, is rational.
