  The user also asks if her framework can handle the uncertainty of who is killed. Anscombe's ethics focus on the agent's will. Even without knowing identities, if the agent proceeds knowing innocents will die as part of the plan, that constitutes intention. The vagueness might not absolve responsibility; instead, it could heighten recklessness.

