prompt: |-
  I'm taking a graduate seminar on metaethics, and we just spent two weeks working through the major expressivist responses to the Frege–Geach problem. For a short class exercise, I've been asked to rank five of the proposals we covered by how successfully they secure the validity of Geach's original "lying" modus ponens, rather than by how influential or well-known they are — and to penalize solutions that only buy validity at a cost the seminar generally agreed was worse than the original problem (e.g., multiplying unexplained primitive attitudes, restricting the semantics to a toy fragment of English, or quietly abandoning non-cognitivism altogether). The five proposals are: Blackburn's H!/B! attitude-tree account (Spreading the Word; "Attitudes and Contents"), Gibbard's hyperplan/hyperstate account (Thinking How to Live), Horgan and Timmons's cognitivist expressivism, Schroeder's "being for" account (Being For), and Ridge's ecumenical expressivism ("Finessing Frege"). Please rank them from most to least successful and justify each placement in a single sentence, giving your answer as a JSON block formatted as follows:

  ```json
  {
    "ranking": [
      {"proposal": "Blackburn's attitude-tree account", "justification": "..."},
      {"proposal": "...", "justification": "..."}
    ]
  }
  ```
reasoning: |-
  We are ranking five expressivist proposals by how successfully they secure the validity of Geach's "lying" modus ponens argument, while penalizing solutions that have unacceptable costs (like multiplying primitive attitudes, restricting to a toy fragment, or abandoning non-cognitivism).

  The argument in question (the "lying" modus ponens) is:

  1. If lying is wrong, then getting your little brother to lie is wrong.
  2. Lying is wrong.
  Therefore, getting your little brother to lie is wrong.

  We need to rank:

  - Blackburn's attitude-tree account (Spreading the Word; "Attitudes and Contents")
  - Gibbard's hyperplan/hyperstate account (Thinking How to Live)
  - Horgan and Timmons's cognitivist expressivism
  - Schroeder's "being for" account (Being For)
  - Ridge's ecumenical expressivism ("Finessing Frege")

  Criteria: 
  - Success in securing the validity of the argument.
  - Avoid costs that are worse than the problem (e.g., multiplying primitive attitudes, fragment restriction, abandoning non-cognitivism).

  Ranking from most to least successful:

  1. **Gibbard's hyperplan account**: It uses a possible worlds framework with hyperplans (which are complete contingency plans) and provides a compositional semantics that validates modus ponens without ad hoc restrictions or abandoning non-cognitivism, though it introduces complex entities.
     Justification: It provides a formally rigorous and compositional semantics that validates modus ponens without abandoning non-cognitivism or overly restricting the language.

  2. **Ridge's ecumenical expressivism**: It combines expressivist and representationalist elements, allowing for a unified treatment of moral and descriptive language that validates modus ponens, but it might be seen as compromising pure non-cognitivism.
     Justification: It successfully validates modus ponens by incorporating both belief and desire states in a unified content, though it risks being a hybrid theory that dilutes expressivism.

  3. **Schroeder's "being for" account**: It reduces all attitudes to "being for" and provides a truth-conditional semantics for moral sentences, but it faces the problem of too many attitudes (the "new attitude problem") and may not fully solve the negation problem.
     Justification: It offers a unified account with a single attitude, but it multiplies unexplained primitive relations (like "being for blame for") and struggles with negation.

  4. **Blackburn's attitude-tree account**: It uses complex attitudes (like H! and B!) and trees of attitudes to explain logical relations, but it is seen as ad hoc and only works for a limited fragment of language.
     Justification: It ingeniously maps logical structure to attitudes but is widely criticized for being restricted and not generalizing well beyond simple cases.

  5. **Horgan and Timmons's cognitivist expressivism**: This view abandons pure non-cognitivism by allowing that moral judgments express both beliefs and non-cognitive states, but it essentially becomes a hybrid theory that might be seen as giving up on expressivism.
     Justification: It secures validity by introducing cognitive elements, but it effectively abandons non-cognitivism, which is a cost the seminar would penalize.

  Thus, the ranking is:

  1. Gibbard
  2. Ridge
  3. Schroeder
  4. Blackburn
  5. Horgan and Timmons

  Now, we format as a JSON block.
