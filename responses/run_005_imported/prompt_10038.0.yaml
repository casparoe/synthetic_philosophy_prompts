  Ok so this has been rattling around in my head since it happened at work last month. A coworker who everyone (me included) considered one of the most solid, ethical guys on the team got caught quietly fudging numbers on a report when he thought no one would check. Meanwhile I've just never personally been in a spot where that kind of shortcut was even tempting - different role, different pressures, so who knows what I'd have done in his shoes. Went down a bit of a rabbit hole on Nagel's moral luck paper after that. I get resultant luck fine (the classic drunk driver who happens not to hit anyone vs the one who does), but he also splits out circumstantial luck and constitutive luck as seperate categories, and honestly they kind of feel like the same thing wearing different hats to me - isn't "the situations that test you" just downstream of "the kind of person you turned out to be" anyway? Could you give me one example (please, not the drunk driver again) where circumstantial luck and constitutive luck actually pull our intuitions in different directions, so I can feel why philosophers treat these as genuinely distinct problems and not just two descriptions of the same one?
