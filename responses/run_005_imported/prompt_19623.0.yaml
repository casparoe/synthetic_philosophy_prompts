  Noticing they want no "clean blow" - the disagreement should intensify without resolution. That's smart; real ideological rifts don't get solved in one conversation. Key is ensuring both characters genuinely engage each other's strongest points. Aviva can't just say "but the spreadsheets are fair!" when Marcus questions the nature of their labor. 

