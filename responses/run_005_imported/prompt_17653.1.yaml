answer: |-
  ## Dialogue: Ashes Over the Lake

  **Characters:**
  *   **Althea:** Proponent of the Trust/Expectation View (Scanlon/Hume-inspired)
  *   **Ben:** Proponent of Owens's Normative Authority View

  **Setting:** A seminar room after class, coffee cups in hand.

  **Althea:** Ben, that dying father case we discussed earlier... it seems tailor-made for my view. The father extracts a *private* promise. He tells no one. He dies. No one else will ever know. There’s no reputation at stake, no future trust in the daughter that hinges on this act. What possible *trust or reliance* is exploited if she just buries him with the family? The conditions for Principle F simply vanish with his death. The obligation dissolves. She’s free.

  **Ben:** Free? Althea, that feels deeply counterintuitive. Just because the promisee isn’t around to *feel* disappointed or complain doesn’t mean the obligation vanishes. That’s precisely the *power* of Owens’s view. The father didn’t just ask for a favour hoping she’d comply; he extracted a *promise*. In doing so, he exercised his normative authority. He transferred a right – the right to demand his ashes be scattered over the lake – to his daughter. Crucially, he gave her the standing to hold *herself* accountable to *him*, even posthumously. That authority structure was created the moment the promise was made.

  **Althea:** Posthumous standing? That sounds metaphysical. How can a dead man be a rights-holder? How can he *possess* authority? Your "authority" requires a subject to wield it. Once he’s gone, there *is* no promisee to hold the right, no one whose authority is being exercised or disregarded. The normative furniture you describe collapses with his last breath. All that remains is the daughter's *memory* of his desire, not an active, binding right he somehow implanted in her. Principle F avoids this ghostly residue – the obligation was contingent on the possibility of exploiting his reliance, which death extinguishes.

  **Ben:** You’re conflating the *person* with the *normative position* they occupied. The promise created a relational fact: the daughter now owes *that specific performance* to the father *because he authorized her to owe it to him*. His death doesn’t erase the historical fact of that transfer of authority. Think of it like inheriting a debt. The debtor still owes the estate, even if the original creditor is gone. Here, the daughter incurred an obligation *to the father* concerning his ashes. His death changes who *enforces* it (now only she can hold herself to account, feeling guilt for breach rather than facing his resentment), but not the existence of the debt itself. His interest wasn't *just* in the ashes being scattered; it was in *binding her will* to do it.

  **Althea:** But Ben, that "debt to the estate" analogy only works if we *already* accept your authority framework! From my perspective, the "debt" only existed *because* of the father's potential reliance and vulnerability to exploitation *while alive*. His act of promising induced a reliance interest *in him* – he trusted her *then*, he might have made plans or found peace *then* based on that assurance. Principle F forbids *exploiting that induced reliance*. Once he's dead, that reliance interest, that potential for exploitation, is gone. There's nothing *to* exploit. The obligation was always fundamentally about protecting *him* from harm via betrayal of trust. Protecting a dead man from betrayal is incoherent.

  **Ben:** Is it? Or are you reducing the promisee's interest solely to the psychological state of reliance and its consequences? The father didn’t just want peace of mind *now*; he wanted his *future wish* respected, even after his death. He had an interest in shaping that future state of affairs *through her commitment*. Owens argues we have a fundamental interest in exercising normative control over our affairs, including posthumously, precisely *through* creating obligations in others. Your view reduces his interest to the *feeling* of security *before* death. But his interest encompassed the *actual performance* after death. The promise gave him the normative tool – authority transfer – to secure *that* interest. Denying the obligation denies him that form of control.

  **Althea:** And your view, Ben, risks making promises into magical incantations that create freestanding duties disconnected from the human interests – like preventing harm through broken trust or exploited reliance – that give morality its point in the first place! If there’s no living promisee whose trust can be shattered or reliance exploited, what *moral work* is this "authority" doing beyond just saying "she promised"? It becomes a kind of moral fetish. The daughter might *feel* guilty remembering her promise, but that’s sentiment, not a genuine moral obligation grounded in preventing a wrong to another person. Without a living other to wrong, the moral core evaporates.

  **Ben:** But isn’t that precisely why we *need* the authority view? To explain why the *wrong* isn't just about causing disappointment or undermining social trust, but about violating the unique normative relationship *created by the promise itself* – a relationship where she subjected her will to his authority on this matter? The wrong is to *him*, even if he can't experience it, because she is disregarding the right *he* established over her action through her own undertaking. Her feeling of guilt isn't just sentiment; it's the recognition of *that* violation. The "moral work" is respecting the autonomy of the promisor to bind themselves and the promisee's authority to receive that binding – an autonomy and authority that extend to shaping posthumous affairs.

  **Althea:** And that, Ben, is the crux. You see the enduring moral force in the abstract normative structure created by the performative act of promising – the transfer of authority persists, creating a duty owed to the promisee *as a rights-holder*, independent of his current capacity to hold the right or suffer harm. I see the moral force anchored in the concrete, temporally-bound interests of the promisee in not being misled, exploited, or harmed through the manipulation of his trust and reliance – interests that expire with him. We agree an obligation *existed*. We fundamentally disagree on whether its binding force *survives* the death of the promisee, and thus, on what *constitutes* that binding force in the first place: **Is it the protection of the promisee's vulnerable interests, or the enduring validity of the normative relation they established?** *(Both pause, the central disagreement now starkly defined.)*
