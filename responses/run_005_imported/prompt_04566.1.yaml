     t4/2 = 1/2 -> t4=1.

  But in our cases, we had either (t3=1,t4=0) or (t3=0,t4=1). The independence with B forces t3=0 and t4=1, i.e., Case 2.

  But we are not out of the woods yet.

  Now, we have Case 2: t3=0, t4=1.

  Now, let's go back to the conditional C > (A > B) that we considered earlier. We had to choose y2 and y4 such that y2+y4=1. We also had to choose z2 and z3 for the conditional (A > B) > B such that z2+z3=1 (since in Case 2: z1=1, z4=0, and we needed z1+z2+z3+z4=2 -> z2+z3=1).

  But now, let's consider a new conditional: let me take the antecedent to be the proposition D that is true in w1 and w4. Then consider the conditional D > (A > B).

  By the Equation:

     P( D > (A > B) ) = P( (A > B) | D ) = P( (A > B) and D ) / P(D)

     P(D) = P(w1)+P(w4)=1/4+1/4=1/2.

     P( (A > B) and D ) = in w1: A>B true and D true -> 1/4
                           in w4: A>B true (t4=1) and D true -> 1/4
                           in w2 and w3: D false.
     so = 1/4 + 1/4 = 1/2.

     Therefore, P( (A > B) | D ) = (1/2) / (1/2) = 1.

     So P( D > (A > B) ) = 1.

     But also, we can express P( D > (A > B) ) by summing over worlds. In each world, the truth value of D > (A > B) is:
          in a world where D is true, it equals the truth value of (A > B) in that world.
          in a world where D is false, it can be anything.

     So:
          w1: D true, so the conditional is true (because (A>B) is true in w1) -> 1.
          w4: D true, so the conditional is true (because (A>B) is true in w4) -> 1.
          w2: D false -> let v2 be the truth value (0 or 1)
          w3: D false -> let v3 be the truth value (0 or 1)

     Then P( D > (A > B) ) = (1/4)*1 + (1/4)*v2 + (1/4)*v3 + (1/4)*1 = (1+v2+v3+1)/4 = (2+v2+v3)/4.

     Set equal to 1:
          (2+v2+v3)/4 = 1
          => 2+v2+v3 = 4
          => v2+v3=2
          => v2=1, v3=1.

     So in w2 and w3, the conditional D > (A > B) is true.

     This is fine.

  But now, let's consider the probability of the conditional in a different way. We have the independence of D and the conditional D > (A > B)? We require that for any conditional with antecedent D, in worlds where D is true, the truth value of D > (A > B) is the truth value of (A > B), which we have. And in worlds where D is false, we have assigned arbitrarily (both 1 in this case).

  But also, we require that D and (D > (A > B)) are independent.

     P( (D > (A > B)) | D ) = P( (A > B) | D ) = 1   [because in worlds where D is true, the conditional is true iff (A > B) is true, and we have both true in w1 and w4]

     P( D > (A > B) ) = 1.

     So P( (D > (A > B)) | D ) = 1 = P( D > (A > B) ) -> so they are equal, hence independent.

     Similarly, condition on not-D:

     P( (D > (A > B)) | not-D ) = P( (A > B) | not-D )? 
          But note: in worlds where not-D is true (w2 and w3), we have assigned the conditional to be true regardless of (A > B). So the truth value in not-D worlds is 1, so the conditional is true in not-D worlds.
          Therefore, P( (D > (A > B)) | not-D ) = 1.

     And P( D > (A > B) ) = 1, so again equal.

     So independence holds.

  We still have a non-trivial model. What's the catch? 

  The catch is that we have to do this for every possible conditional. In particular, we must be able to define, for any proposition B, the conditional A > B in a way that in A-worlds, it matches B, and in not-A worlds, it is defined so that the probability matches P(B|A) and also so that the independence with A holds. Moreover, we must do it for nested conditionals.

  But in our example, we have a specific distribution and we were able to assign. However, the original Lewis result says that the only probabilities that work are trivial ones. In our example, we used a uniform distribution with four worlds, and it seemed to work for the conditionals we considered. 

