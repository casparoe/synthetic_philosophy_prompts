  P(A > B) = 1/2, so P(not (A > B)) = 1/2.

  In Case 1: 
     P(B | A > B) = 1.
     Then: 
          1/2 = 1*(1/2) + P(B | not (A > B)) * (1/2)
          => 1/2 = 1/2 + (1/2) * P(B | not (A > B))
          => 0 = (1/2) * P(B | not (A > B))
          => P(B | not (A > B)) = 0.

