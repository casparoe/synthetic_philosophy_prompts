     But also, we require that it is independent of B2? We don't have to, but let's see what happens.

     However, we have more: we must be able to nest conditionals. In particular, consider the conditional: (A > B2) > B2.

     By the Equation: 
          P( (A > B2) > B2 ) = P( B2 | A > B2 )

     P(B2) = P(w1) = 1/4.
     P(A > B2) = 1/2.

     P(B2 | A > B2) = P(B2 and (A > B2)) / P(A > B2)

     B2 is only true in w1, and in w1, A > B2 is true. In other worlds, B2 is false. So:
          P(B2 and (A > B2)) = P(w1) = 1/4.

     Therefore, P(B2 | A > B2) = (1/4) / (1/2) = 1/2.

     So we require: P( (A > B2) > B2 ) = 1/2.

     Now, we assign truth values to (A > B2) > B2 in each world.

     In worlds where A > B2 is true, then (A > B2) > B2 is true if and only if B2 is true.

     In our Case 2 for B2: we have t3' and t4' with t3'+t4'=1. Let's say we choose t3'=0, t4'=1.

     Then worlds where A > B2 is true: w1 (true) and w4 (true) -> because in w4, we have t4'=1.
     Worlds where false: w2 and w3.

     Now, in w1: A > B2 true, so the conditional (A > B2) > B2 is true if and only if B2 is true. In w1, B2 is true, so it is true.
     in w4: A > B2 true, so the conditional is true if and only if B2 is true. In w4, B2 is false, so it is false.
     in w2: A > B2 is false -> no constraint: let v2 be its truth value.
     in w3: A > B2 is false -> let v3 be its truth value.

     Then P( (A > B2) > B2 ) = (1/4)*1 [w1] + (1/4)*v2 [w2] + (1/4)*v3 [w3] + (1/4)*0 [w4] = (1 + v2 + v3)/4.

     Set equal to 1/2: 
          (1+v2+v3)/4 = 1/2
          => 1+v2+v3 = 2
          => v2+v3 = 1.

     So we can choose v2=1, v3=0.

     This assignment works.

     But now, we require that (A > B2) and ( (A > B2) > B2 ) are independent.

     We have:
          P( (A > B2) > B2 | A > B2 ) = P( B2 | A > B2 ) = 1/2.

     and P( (A > B2) > B2 ) = 1/2.

     So they are equal, hence independent.

     Similarly, condition on not (A > B2) ( which has probability 1/2) and we have:

          P( (A > B2) > B2 | not (A > B2) ) = [sum of probabilities of worlds in not (A > B2) and where the conditional is true] / P(not (A > B2))

          = [ P(w2)*v2 + P(w3)*v3 ] / (1/2) = [ (1/4)*1 + (1/4)*0 ] / (1/2) = (1/4) / (1/2) = 1/2.

     and P( (A > B2) > B2 ) = 1/2.

     So again, equal.

  So it seems we have a non-trivial model. What's the issue? 

  The issue is that we have to do this for EVERY possible consequent. In particular, we must also consider a conditional whose antecedent is a conditional. But the space of propositions might be larger than our worlds can represent. 

  However, the deeper issue is that the number of distinct conditionals might be too many for the number of worlds. In our example with four worlds, there are 2^4=16 possible truth assignments (propositions). But the conditionals, when nested, might require more.

  Moreover, the independence conditions we have are: for any antecedent A and any B, the conditional A > B is independent of A. This is a very strong condition. In our four-world model, let's see what propositions are independent of A.

  A is true in w1 and w2. A proposition X is independent of A if:

     P(X and A) = P(X) * P(A)

  In our example, P(A)=1/2.

  Let X be a proposition. It is defined by its truth values in the four worlds: (x1, x2, x3, x4) in {0,1}^4.

     P(X) = (x1+x2+x3+x4)/4.

     P(X and A) = (x1 + x2)/4   [since A is true only in w1 and w2].

     P(X)*P(A) = (x1+x2+x3+x4)/4 * 1/2 = (x1+x2+x3+x4)/8.

     Set equal:

          (x1+x2)/4 = (x1+x2+x3+x4)/8
          => 2(x1+x2) = x1+x2+x3+x4
          => x1+x2 = x3+x4.

     So the number of A-worlds in X must equal the number of not-A-worlds in X.

     In our four worlds, the propositions that are independent of A are those for which the sum of truth values in {w1,w2} equals the sum in {w3,w4}. 

     For example, the proposition that is true in w1 and w3: 
          w1: true, w2: false, w3: true, w4: false -> sum in A: 1, in not-A: 1 -> independent.
     true in w1 and w4: sum in A: 1, in not-A: 1 -> independent.
     true in w2 and w3: 1 in A, 1 in not-A.
     true in w2 and w4: 1 in A, 1 in not-A.
     true in w1,w2,w3,w4: 2 in A, 2 in not-A.
     true in none: 0 in both.
     true in w1 only: 1 in A, 0 in not-A -> not independent.
     true in w1 and w2: 2 in A, 0 in not-A -> not independent.
     etc.

     So there are 6 propositions that are independent of A: 
          the constant false, 
          the constant true,
          the proposition true in w1 and w3,
          true in w1 and w4,
          true in w2 and w3,
          true in w2 and w4.

