     Now, for any B, the conditional A > B must be independent of A, so it must be one of these 6.

     But also, the Equation requires that P(A > B) = P(B|A).

     For example, if B is true only in w1, then P(B|A)= (1/4)/(1/2)=1/2.
     The propositions among the 6 that have probability 1/2 are:
          true in w1 and w3: probability 2/4=1/2.
          true in w1 and w4: 1/2.
          true in w2 and w3: 1/2.
          true in w2 and w4: 1/2.

     So it could be any of these.

     But also, in the worlds where A is true, the conditional must match B. In w1: A true, so A > B must be true because B is true.
     In w2: A true, so A > B must be false because B is false.

     So in w1: true, in w2: false.

     Among the 6, the ones that are true in w1 and false in w2 are:
          true in w1 and w3: in w1: true, w2: false, w3: true, w4: false -> so in w1: true, w2: false -> matches.
          true in w1 and w4: in w1: true, w2: false, w3: false, w4: true -> matches.
          the others have in w2: true, which doesn't match.

     So for B=true only in w1, we have two choices for A > B: it can be the proposition true in w1 and w3, or true in w1 and w4.

     In our earlier assignment, we chose for B=true in w1 and false in w2, true in w3 and false in w4: then we had A > B true in w1 and w4. So we chose the second option.

     For a different B, we may choose differently.

     The catch is that we have to assign for every B a conditional, and then also for nested conditionals, and we have to do it consistently for all of them.

     But the space of possible conditionals is vast, and the number of worlds is fixed. In particular, the number of possible conditionals as propositions is limited to the 16 in our model, but the number of possible consequents is also 16. For each consequent, we need to assign a conditional (which is one of the 16) that satisfies the truth conditions in the A-worlds and the probability condition.

     Moreover, when we consider nested conditionals, we need to have a assignment for every nested conditional, and the assignments must be consistent with the truth conditions in the worlds of the antecedent.

     In a non-trivial probability space (with more than two worlds with positive probability), it becomes impossible to assign all these truth values consistently for every possible conditional. 

     Lewis's proof shows that the only probability spaces that can possibly work are those that are in a certain sense trivial: for example, they might be limited to at most two worlds with positive probability. In such a space, the number of propositions is very limited.

     For example, with two worlds, there are 4 propositions. We then have fewer conditionals to define, and it might be possible. But in a space with at least three worlds with positive probability, the assignment becomes over-constrained.

     In our four-world example, we were able to assign for a few conditionals, but if we try to assign for all possible conditionals, we will run into a contradiction. 

     To see this, consider a conditional whose antecedent is a conditional itself, and the consequent is something else. The independence conditions will force the probability to be extreme.

     Lewis's proof in the general case: 
          Let's take two conditionals: A > B and A > (B ∨ C) for a carefully chosen C.

     But a standard way is to condition on the conditional A > B itself and on its negation, and then to condition on A within that, and then use the law of total probability to get a system that forces P(A > B) to be either 0 or 1 or P(B|A) in a way that is only possible if the space is trivial.

     Given the complexity, and since you requested an intuition, I hope the above at least shows the constraints and why it is very hard to have a non-trivial model.

     In summary, the Equation forces the conditional to be independent of its antecedent for every possible antecedent and consequent. This independence is a very strong condition that forces the probability function to be very rigid, and in non-trivial spaces, it becomes impossible to assign truth values to conditionals in a way that respects the Equation for every possible conditional.

     Therefore, the only way out is to either:
          (1) give up the idea that conditionals are propositions (à la Adams), 
          (2) give up the Equation in its full generality, or 
          (3) use a non-standard probability theory.

     Now, let's briefly discuss the aftermath.

     - Adams denies that conditionals have truth values at all. Instead, he assigns assertability conditions: the assertability of "if A then B" is given by P(B|A). This avoids the triviality because conditionals are not in the probability space. But then it's hard to account for compound conditionals.

     - McGee and others use a more complex probability theory (like using a family of probability measures) to assign probabilities to conditionals. In this view, the probability of a conditional is still the conditional probability, but it is not the probability of a proposition. This allows for the Equation to hold for simple conditionals, but for compounds, they might not be assigned probabilities in the same way.

     - Kaufmann (and others) use imaging: the probability of "if A then B" is the probability of B under a probability distribution that is shifted to make A true (as in Lewis's imaging). This can be done in a propositional setting, but then the probability of the conditional is not the conditional probability, so the Equation is abandoned.

     - Popper functions (or conditional probability spaces) are another approach. In this case, conditional probability is primitive. This allows for conditioning on events of probability zero. Van Fraassen has a representation result for conditionals using this. In this setting, conditionals are given truth conditions in a way that the Equation holds. However, the truth conditions are given in a richer space. This might avoid the triviality.

     Hájek, in "Triviality Pursuit," argues that all these approaches have their limitations. In particular, he argues that the Equation is so attractive that giving it up is hard, and the non-propositional views make it difficult to account for compounds. He also points out that even in the non-propositional views, there are conditional-conditional probabilities that are not handled. 

     In the end, there is no consensus. But the most popular approaches among philosophers are:

          - The non-propositional view (Adams-style) for simple conditionals, and then a separate account for compounds.

          - The dynamic semantics view, where conditionals are not propositions but rather update procedures.

     Given your background, you might find the imaging approach or the possible worlds semantics with conditional probability as a derived notion appealing. However, none of these are without challenges.

     I hope this helps. If you'd like, I can elaborate on any of the responses.
