          P(B) = P(B | A > B)*P(A > B) + P(B | not (A > B))*P(not (A > B))
          1/2 = (1/2)*(1/2) + P(B | not (A > B)) * (1/2)
          1/2 = 1/4 + (1/2) * P(B | not (A > B))
          => 1/4 = (1/2) * P(B | not (A > B))
          => P(B | not (A > B)) = 1/2.

