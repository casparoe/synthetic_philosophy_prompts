          B is true in w1 and w3. 
          In the not (A > B) worlds: w2 and w3.
          In w2: B is false.
          In w3: B is true.
          So P(B and not (A > B)) = P(w3) = 1/4.
          P(not (A > B)) = P(w2)+P(w3)=1/4+1/4=1/2.
          So P(B | not (A > B)) = (1/4) / (1/2) = 1/2. -> matches.

  So both cases are consistent so far.

  But now, let’s consider a third conditional. Let me take a new antecedent, say, let me consider the proposition that is true in w1 and w4, call it D.

