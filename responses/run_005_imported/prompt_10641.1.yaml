  First, the novel-trait question. The user mentioned a mutant heart that pumps blood immediately without selection history. The core issue is whether something can have a function before selection acts on it. The philosopher might respond by distinguishing between function and mere effect, so the follow-up should challenge that distinction with the intuition that pumping seems functional from day one.

