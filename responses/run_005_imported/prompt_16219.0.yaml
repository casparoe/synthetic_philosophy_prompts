answer: |-
  ## The Allais Axiom War: A Dialogue at the Crux

  **Characters:**  
  *   **Eris:** Defends orthodox expected utility, independence axiom, and consequentialism about subplans. Believes Allais preferences are irrational and exploitable.  
  *   **Mach:** Defends Machina-style generalized utility. Argues Allais preferences can be rational, rejecting consequentialism about subplans as a necessary requirement.  

  **(1) Eris:** Let's cut to the chase. The Allais Paradox reveals a fundamental inconsistency. Faced with Problem 1 (A: $1M for sure vs B: 89% $1M, 10% $5M, 1% $0), most choose A. In Problem 2 (C: 11% $1M, 89% $0 vs D: 10% $5M, 90% $0), most choose D. But these choices violate the independence axiom: preferring A over B implies preferring the lottery ($1M) over the lottery (0.89 $1M + 0.1 $5M + 0.01 $0), yet preferring D over C implies the *reverse* preference when both are mixed with an 89% chance of $0! This isn't quirky; it's logically incoherent.  

  **(2) Mach:** Incoherent only if you demand independence! Machina's insight is that risk aversion isn't linear. The *presence* of certainty in Problem 1 exerts a powerful psychological pull – people overweight the guaranteed outcome. In Problem 2, with no certainty, they revert to maximizing expected value. The indifference curves fan out: steeper near certainty, flatter elsewhere. This explains the pattern *without* logical contradiction. Stochastic dominance is preserved – no one chooses stochastically dominated options. Continuity holds. It's a descriptively *and* normatively valid model of preference under risk.  

  **(3) Eris:** Normatively valid? Then explain the money pump! Suppose you hold these preferences. I offer you a choice sequence. *First:* Pay me a small fee $\epsilon$ to switch from holding Lottery B (from Problem 1) to holding Lottery A. Since you prefer A over B, you pay $\epsilon$ to make this switch. *Now* you hold A. *Second:* I offer to switch your A for Lottery C *plus* $\epsilon$. But C is just A mixed with 89% $0! Since you prefer D over C in Problem 2, and D is just B mixed with 89% $0, your fanning-out preferences imply you *also* prefer the mix yielding B over the mix yielding A when certainty is gone. So you should be willing to pay *another* $\epsilon$ to switch from C to D. But D is *equivalent* to the original B you started with! Net result: You paid $2\epsilon$ to end up back where you started. Your preferences are literally exploitable for cash.  

  **(4) Mach:** Ah, the classic pump! But it crucially relies on **consequentialism about subplans**. It assumes that when you evaluate the *second* choice (C vs D), you look *only* at the reduced lotteries over final outcomes *from that point forward* – C yielding (11% $1M, 89% $0) and D yielding (10% $5M, 90% $0). My agent *doesn't* do that. They evaluate the *path*. When they are at the second choice node, holding A (which they *chose* for its certainty), switching to C feels like *abandoning* that hard-won certainty for a gamble. The value of A isn't *just* its final outcomes; it carries the value of having *achieved* certainty. C, offered *after* achieving certainty, represents a *loss* of that special state. D vs C is evaluated differently *in isolation* than it is *after having secured certainty*. The history matters.  

  **(5) Eris:** So rationality allows valuing the *feeling* of having made a certain choice, even if the final outcome distribution is identical? That sounds like path-dependence for its own sake! Isn't this just McClennen's "resolute choice" in disguise? Commit to the plan ("I will choose A then stick with it") and blindly follow through, refusing to reconsider even when offered a demonstrably better option (C + $\epsilon$) later? That's obstinacy, not rationality. Rationality requires evaluating options based on what they *deliver*, not the warm fuzzies of past decisions.  

  **(6) Mach:** It's not "warm fuzzies," it's a fundamental aspect of how they experience risk and security! Think of it like this: achieving certainty in the first stage provides a *hedge* against the risk faced later. Abandoning that hedge *feels* riskier than facing the same objective risk without ever having had the hedge. Machina's framework captures this by making utility depend on the *global* shape of the cumulative distribution function, not just the local probabilities. Rejecting consequentialism isn't obstinacy; it's acknowledging that the *context* of a choice – how one arrived there – can rationally influence its evaluation. The $\epsilon$ offered for C doesn't compensate for the *disutility* of relinquishing the certainty state they are *currently in*.  

  **(7) Eris:** But this "context" is ephemeral! Suppose *after* you irrationally reject C+$\epsilon$ (sticking with A), the 89% chance of $0 hits. You end up with $0. Now, looking back, wouldn't you *regret* not taking C+$\epsilon$? At that point, C+$\epsilon$ would have given you an 11% chance at $1M (plus $\epsilon$) instead of $0. By your own *ex-post* lights, you made a mistake. Dynamic consistency means avoiding predictable future regret.  

  **(8) Mach:** Regret? Perhaps. But rational choice isn't solely about minimizing *ex-post* regret. It's about making the best choice *at the time*, given your preferences *at that time*, which include the value of the path. *At the moment* of the second choice, holding A, the value of the certainty *is real* to them. Switching to C *destroys* that current value. They might later wish the *situation* were different ("I wish I hadn't been offered this tempting but worse swap"), but that doesn't mean the choice *given the situation they were in* was wrong by their criteria. It's like declining a gamble while skydiving that you'd accept on the ground – the context changes the valuation.  

  **(9) Eris:** This seems dangerously close to allowing any preference reversal to be rationalized by inventing new "contextual" values. Where does it stop? Doesn't this undermine the whole project of finding stable, consistent principles of rational choice? If the path matters more than the destination, how do we even define rationality?  

  **(10) Mach:** It stops at preserving stochastic dominance and continuity! We *have* stable principles: avoid dominated options, respect small probability differences. Independence is the odd one out – an elegant *simplifying* assumption, not a bedrock necessity for coherence. Rationality is about coherent *global* preferences over lotteries, respecting dominance and continuity. Machina's "fanning out" is a coherent global model. The money pump fails *because* the agent's valuation at node 2 isn't solely a function of the reduced lottery from node 2 onward; it's a function of the *whole* decision tree path up to that point. Blocking the pump isn't a bug; it's a feature of a richer model of preference.  

  **(11) Eris:** Richer, or just more arbitrary? If consequentialism is rejected, what prevents an agent from assigning *any* arbitrary value to past choices, making them immune to *any* pump but also incapable of consistent forward planning? How do they *plan* if the value of future options depends mysteriously on choices not yet made?  

  **(12) Mach:** It's not arbitrary. The dependence is systematic: the value of a subplan depends on the *lottery* that led to it, specifically how it shapes the overall risk profile (captured by the CDF). Planning involves anticipating how one's *future* preferences will depend on the path taken *up to that future point*. A Machina agent *can* plan. They might say, "I know if I choose A first, I will value keeping A later more than I would value C+$\epsilon$ *in that specific context*, so I choose A and plan to keep it." They anticipate their context-dependent valuation.  

  **(13) Eris:** So the plan ("Choose A, keep A") is rational *only* because they pre-commit to ignoring the better offer (C+$\epsilon$) later? That sounds like self-binding to avoid akrasia, not a pure evaluation of outcomes. Rationality shouldn't require pre-commitment devices to avoid exploitation by one's own shifting valuations! True dynamic consistency means your evaluation of the *consequences* of an action plan is stable, regardless of when you evaluate it. Consequentialism ensures that stability.  

  **(14) Mach:** "Better offer" is precisely what's contested! *By the lights of the preference they hold at the later node*, C+$\epsilon$ *is not better* than A. The valuation shift isn't akrasia (weakness of will); it's a *rational response* to the changed informational and psychological state brought about by the path taken. The offer C+$\epsilon$ *in the context of holding A* has a different value than C+$\epsilon$ *in isolation*. Consequentialism *assumes* this difference is irrational. We deny that assumption. Stability is over the *description of the whole choice problem*, including history, not just over reduced lotteries.  

  **(15) Eris:** Then we've hit bedrock. You define rationality to include path-dependent valuations that block exploitation but allow potential *ex-post* regret and require complex global planning to anticipate shifting preferences. I define rationality as requiring valuations to depend solely on final outcome distributions, ensuring dynamic consistency, avoiding money pumps, and simplifying planning through reduction. Neither seems derivable from more primitive "obvious" axioms once stochastic dominance and continuity are granted.  

  **(16) Mach:** Precisely. The disagreement is fundamental: Is consequentialism about subplans a *necessary component* of rationality, or is it an *optional simplifying assumption* that might not hold for descriptively and normatively valid preferences like those revealed in Allais? I argue the latter.  

  **(17) Eris:** And I the former. So, Mach, what argument or result *could* make you concede that consequentialism *is* rationally mandatory?  

  **(18) Mach:** If someone could demonstrate an *inescapable* money pump – one that works *without* relying on the agent accepting the consequentialist evaluation at the later node, perhaps by forcing trades in a way that the path-dependence cannot rationally block, or by showing such preferences inevitably lead to stochastically dominated outcomes over time. A pump that works even when the agent explicitly values the path. What would change *your* mind, Eris?  

  **(19) Eris:** If someone developed a *truly compelling* normative argument for why path-dependence itself (distinct from final outcomes) *must* be part of a rational agent's utility function – an argument derived from more fundamental axioms than dynamic consistency itself, showing its absence leads to a deeper incoherence *even when* stochastic dominance and continuity are preserved. Not just description, but deduction.  

  **(20) Mach:** Then we agree: the crux is the rational necessity of consequentialism about subplans. Until one of those happens... *Zut Allais!* indeed, but for different reasons.  

  **(Eris):** *Zut Allais!*... but because the preferences violate a core tenet of coherent dynamic choice.  
  **(Mach):** *Zut Allais!*... but because orthodoxy mistakes a useful simplification for a logical imperative.
