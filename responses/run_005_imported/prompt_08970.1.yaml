  Then the "investigator in the trick" climax. The user suspects circularity—does Sidgwick assume he's listed all possible objections? Actually, it's a concession to critics. He's saying that when all other explanations are exhausted, residual skepticism becomes ad hominem (attacking the investigator's integrity). This isn't proof, but it frames persistent denial as irrational, which serves his persuasive goal. 

  Connecting the dots: Sidgwick builds a case for gradual credibility. Independent witnesses chip away at skepticism (De Morgan), mass evidence overwhelms psychological resistance (anti-Hume), and methodical elimination of alternatives makes denial seem stubborn (rhetorical climax). It's a blueprint for legitimizing marginalized inquiry—not through knockout arguments but through relentless evidence gathering. 

  The user's advisor calls it "rhetorical flourish," but that undersells it. This passage is strategic: Sidgwick knows he can't win with one experiment, so he designs a long-game epistemology of accumulation. For the dissertation, this shows how Victorian thinkers navigated scientific marginalization—not by rejecting mainstream methods but by weaponizing their own rigor against dismissiveness.
answer: |-
  You're right to probe this passage deeply—your advisor may underestimate its systematic importance. Sidgwick isn't just waxing poetic; he's constructing a deliberate epistemology of marginal phenomena that subtly counters Humean skepticism while navigating its constraints. Let's break down the logical architecture:

  ### 1. The De Morgan Metaphor: Corroboration as Cumulative Probability  
  Sidgwick *is* invoking probabilistic reasoning. The "stock of credit" metaphor (likely referencing De Morgan's *Formal Logic* or *Essay on Probabilities*) treats witness reliability as a quantifiable prior probability. Each credible witness provides *incremental* Bayesian updating:  
  - **Key nuance**: He concedes no single witness's "credit" (prior reliability) suffices for extraordinary claims (low prior probability). But multiple *independent* testimonies act as **multipliers** on likelihood ratios.  
  - **Formal implication**: If Witness A has 60% reliability and Witness B (independent) has 60%, their joint probability for a true positive isn't additive but multiplicative: P(A∩B|Event) > P(A|Event). This lifts the posterior probability despite a low prior.  
  - **Strategic purpose**: Sidgwick shifts focus from *individual* evidentiary weight (vulnerable to Humean dismissal) to *systemic accumulation*. The "draft will help" means each testimony reduces the burden on others.

  ### 2. "Burying Alive Under a Heap of Facts": Sidgwick vs. Hume  
  This is a targeted response to Hume, but *epistemologically hybrid*:  
  - **Psychological concession**: Sidgwick grants Hume's point that cultural/scientific priors are entrenched ("long in growing, many strong roots"). Changing minds requires overwhelming *psychological* pressure ("common sense of mankind").  
  - **Epistemological pushback**: Crucially, he implies Hume is wrong about *insurmountability*. For Sidgwick, a "heap of facts" *can* rationally overcome low priors if:  
    - (a) Evidence is methodically gathered ("experiment upon experiment")  
    - (b) It achieves critical mass ("mass of evidence for conviction")  
  - **The pivot**: Where Hume treats natural law as near-certain (making miracles *infinitely* improbable), Sidgwick treats scientific skepticism as *contingent*—a "living" thing that can be "killed" by sufficient counterevidence. This rejects Hume's static prior probability framework.

  ### 3. The "Investigator in the Trick" Climax: Completing the Case  
  This isn't circular—it's the culmination of a **process of elimination**:  
  - **Sidgwick's ladder of criticism**:  
    1. *Methodological flaws*: Addressed by rigorous protocols.  
    2. *Alternative explanations*: Ruled out via controlled experiments.  
    3. *Investigator fraud*: The last resort.  
  - **Logical weight**: When all other objections are methodically eliminated, accusing the investigator of fraud becomes *ad hominem*. Sidgwick implies this accusation is:  
    - (a) *Desperate* ("when he has nothing else left")  
    - (b) *Self-refuting* for critics: If *every* reliable investigator is accused of deceit, skepticism becomes unfalsifiable dogma.  
  - **Not assuming completeness**: Sidgwick doesn't claim alternatives are exhausted a priori. Rather, the *burden shifts* to critics to propose *new* objections beyond fraud once existing ones are resolved.

  ---

  ### Unified Argumentative Strategy  
  Sidgwick constructs a three-stage response to scientific dogmatism:  

  | **Stage**           | **Tactic**                     | **Counter to Hume**                          |  
  |----------------------|--------------------------------|----------------------------------------------|  
  | **1. Corroboration** | Aggregate independent witnesses | Replaces Hume's "miracle vs. witness" binary with incremental probability |  
  | **2. Massification** | Heap facts/experiments          | Treats scientific priors as revisable, not absolute |  
  | **3. Elimination**   | Systematically exclude alternatives | Forces critics into untenable ad hominem territory |  

  This isn't just rhetoric—it's a blueprint for legitimizing inquiry into the "impossible." Sidgwick accepts Hume's challenge but rejects his defeatism: by reframing evidence as *cumulative* and skepticism as *progressively exhaustible*, he creates epistemic space for investigating anomalies.

  ### Why This Matters for Your Dissertation  
  This passage reveals Sidgwick's innovative *methodology of the marginal*:  
  - He doesn't naively assert psychical phenomena exist; he engineers an **epistemic end-run** around a priori dismissal.  
  - It shows Victorian empiricism adapting to study what science excludes—prefiguring later philosophies of anomaly (e.g., Kuhn on paradigm shifts).  
  - The "heap of facts" strategy directly influenced SPR practices (e.g., the Census of Hallucinations).

  **Recommendation**: Build your argument around this. Sidgwick isn't flourishing—he's doing crisis epistemology. Your instinct about its systematic role is correct, and it illuminates how Victorians navigated the boundary between science and the "supernatural" through evidentiary industriousness. This is gold for a dissertation chapter.
