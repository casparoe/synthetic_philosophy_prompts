prompt: |-
  Okay, something happened during my TA duties last semester that's been rattling around in my head ever since, and I'm hoping an outside philosophical perspective can help me figure out why it bugs me so much. Quick background: I'm a cognitive science PhD student, and my actual research is on how people assign blame and credit for other peoples' actions (lots of vignette-based survey studies), so I guess I'm primed to overanalyze stuff like this, but here goes.

  I was proctoring a stats final and noticed two students pretty blatantly copying off each other. I went back and forth for a solid ten minutes about whether to say anything - didn't want to be the bad guy, wasn't totally sure what I'd seen, etc - but I eventually decided, completely on my own, to flag it to the professor once the exam ended. Nobody pressured me into it and nobody even knew I was debating it in my head. The professor looked into it and the students admitted what they'd done.

  Here's the part that's been bugging me: a few days later, the other TA I was working with mentioned, totally offhand, that she had noticed the exact same thing and had already privately decided that if I hadn't said something by the end of the day, she was going to report it herself regardless of what I did. I had zero idea she'd clocked anything, let alone that she had her own contingency plan - it played no role whatsoever in my thinking at the time. So the cheating was basically guaranteed to get caught no matter what I chose to do. I mentioned all this to a friend in the philosophy program and she got weirdly excited, said it reminded her of something from a seminar on free will, but couldn't remember enough to actually explain it. Now I can't decide: do I still deserve full credit for "doing the right thing," since I made the call through my own reasoning and her backup never factored into it at all? Or does the fact that I couldn't have actually changed the outcome mean my decision didn't really matter the way I assumed it did? My officemate insists it's obviously the second one, that intentions barely count once you know the result was locked in either way, but that feels too fast to me and I can't quite say why. Is there an actual principled answer here, or does it just come down to personal intuition?
