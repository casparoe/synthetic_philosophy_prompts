prompt: |-
  So my agent just walked me through how editors actually build a profit-and-loss sheet for my new book before they'll make an offer - they pick a handful of "comp titles" and use those sales numbers to project mine, and depending on whether they comp me to debut literary fiction, multi-generational family sagas, or books from similarly-sized indie presses, the projected advance swings by something like a factor of five. Kind of wierd how much rides on that one choice, honestly. It reminded me of this thing called the reference class problem I half-remember from a philosophy class ages ago - that any single case (my book, me, whatever) technically belongs to a bunch of different reference classes at once, and which one you pick to generate a probability is kind of arbitrary even though it completely changes the answer you get. Can you walk me through the most important implications of the reference class problem for how I (or honestly anyone) should treat projections like this - is there a principled way to pick the "right" class, should I just distrust any single number I'm handed, or does it mean these percentages aren't "real" probabilities in some deeper sense? Mainly trying to figure out how much stock to put in my agent's spreadsheets.
