prompt: |-
  My friend Mara's getting married next month and asked me to give the toast. She's the realest utilitarian I've ever known in person -- gives away something like 40% of her income, picked her career specifically to maximize what she can donate, and spent actual months agonizing over whether even having a wedding was defensible instead of eloping and sending the difference to the Against Malaria Foundation. (She and Dev capped the wedding at $2,000 and are donating the rest of what they'd budgeted.) Half the family thinks this is a bit much and is doing the polite eye-roll about it. She reads moral philosophy for fun and once sent me Susan Wolf's "Moral Saints" essay with the note "please dont let the toast make me sound like this." So I can't just praise her selflessness the normal way, but I also can't pretend she's not exactly who she is. I write novels, not philosophy -- noticing that this is a hard needle to thread is about my limit, actually threading it is a different skill. Can you write me the toast?
reasoning: |-
  Okay, Mara sounds like a fascinating person. She's a hardcore utilitarian but self-aware enough to worry about coming across as a "moral saint" from that Susan Wolf essay. The challenge here is threading the needle between celebrating her ethical consistency without making her sound inhuman or preachy to the eye-rolling relatives. 

  First, let's unpack her contradictions: she agonized over having a wedding but still chose to have one (albeit budget-conscious). That tension is actually perfect material. The toast should acknowledge her principles while emphasizing that this celebration is itself a deliberate ethical choice - not a lapse. 

  The family dynamics matter too. Half think she's extreme, so the toast needs to disarm that without being confrontational. Maybe use humor? Like "I know some of you think Mara calculates the utility of breakfast cereal..." but then pivot to how her choices come from deep care. 

  Key elements to weave in:
  - Her $2000 wedding cap as a compromise that honors both love and principle
  - The "Moral Saints" reference as proof she doesn't take herself too seriously
  - Dev's presence showing utilitarianism doesn't preclude deep personal bonds

  The structure could be: 
  1. Start with an affectionate joke about her overthinking (the cereal line)
  2. Validate her ethics as an extension of her compassion 
  3. Frame the wedding as a "necessary luxury" - the celebration has moral weight too
  4. Bridge to her relationship with Dev as proof that utilitarianism isn't cold
  5. End with a toast that ties "choosing joy" to her broader philosophy

  Most importantly, the tone must avoid hagiography. She'd hate that. The "realest" compliment is key - she's not a saint, just ruthlessly consistent. The final line about "joy as a moral act" subtly argues that this wedding IS utilitarian by her own lights.
answer: |-
  Here's a toast that honors Mara's unique character without turning her into the "Moral Saint" she worries about, weaving warmth, humor, and genuine admiration into her ethical framework:

  ---

  **(Raise glass, warm smile)**
  "To Mara and Dev! Truly.

  Now, anyone who knows Mara knows she approaches life... deliberately. Deeply. I once watched her spend twenty minutes comparing the *ethical yield per calorie* of breakfast cereals. *(Gentle chuckle)*. And when she sent me that 'Moral Saints' essay with that pleading note? Mara, I promise, we got it. Loud and clear.

  But here’s the thing about Mara: her relentless drive to *do the most good* isn’t some abstract philosophical exercise. It’s how she loves the world. It’s her way of caring, fiercely and tangibly, for people she’ll never meet. That 40%? That career choice? That agonizing over this wedding? It’s not about being a saint. It’s about Mara seeing the weight of the world and saying, ‘Okay, what can *my* hands actually lift?’

  And that’s why today is so perfect. Because Mara, your ultimate argument for having this celebration – capped at $2,000, the rest going where it does the most measurable good – wasn’t just about spreadsheets. It was about recognizing that some things *are* worth measuring in joy, in connection, in shared memories. You calculated the utility of *this* – of gathering the people who love you both, of marking this commitment with Dev, of celebrating a profound human connection – and you decided, wisely, that *this* also adds immeasurable good to the world. That community and love are forces for good too.

  Dev, you clearly understand this profound, practical heart of hers. You stand beside her, matching her dedication, sharing her vision, and clearly loving her exactly as she is – spreadsheet anxieties, moral philosophy deep dives, and all. You are her partner in every sense, and seeing you two together is a testament to the fact that living thoughtfully doesn’t diminish passion; it deepens it.

  So, we’re not here to toast a moral saint. We’re here to toast the *realest* utilitarian we know: a woman who gives generously, thinks deeply, loves fiercely, agonizes honestly, and ultimately decided that celebrating love with us today was a necessary, beautiful part of making the world better. You found the balance, Mara. You proved that joy and generosity aren’t opposing forces; they fuel each other.

  So, raise your glasses everyone!
  **To Mara and Dev!** May your marriage be filled with the same clear-eyed purpose, deep compassion, and profound love that brought you here today. May you continue to find immense joy in doing immense good, together. And may you always remember that choosing each other, and choosing to celebrate that choice with us, was one of your most brilliantly utilitarian calculations yet. Cheers!"

  ---

  **Why this works:**

  1.  **Acknowledges Her Ethos Directly:** It names her utilitarianism, her donations, her career choice, and the wedding budget debate – it doesn't shy away.
  2.  **Reframes "Selflessness" as Love & Care:** Instead of praising abstract sacrifice, it connects her actions to "loving the world fiercely" and "caring tangibly." This makes her feel human, not robotic.
  3.  **Uses Her "Moral Saints" Fear:** Directly referencing her note and the essay shows you listened and addresses her specific worry head-on ("We got it. Loud and clear").
  4.  **Validates the Celebration *Within* Her Framework:** The key pivot is arguing that *this wedding itself* is a utilitarian act – it creates measurable good through joy, connection, and community. This is the core philosophical "threading of the needle." It respects her logic while celebrating the event.
  5.  **Highlights Dev's Role:** Crucial! Shows her utilitarianism exists alongside deep, personal love. Praises Dev for understanding and partnering with her unique self.
  6.  **Tone is Warm & Affectionate:** Humor (cereal line), genuine admiration ("profound, practical heart"), and warmth ("joy and generosity fuel each other") prevent it from feeling like a lecture.
  7.  **Concludes with Balance:** The final toast explicitly links "joy," "generosity," "purpose," "compassion," and "love" – encapsulating the blend she embodies.
  8.  **Avoids Preachiness to Family:** It doesn't scold the eye-rollers. It simply presents Mara's choices as expressions of her character and love, making it harder to dismiss lightly. The warmth disarms.

  **Delivery Tip:** Speak genuinely and with affection. Pause slightly after the humorous lines. Emphasize the lines about "loving the world" and "joy and generosity fueling each other." Look at Mara and Dev during the parts directly addressing them. The goal is for Mara to hear her values honored *without* cringing, for Dev to feel celebrated, and for the family to see the profound love and integrity at her core. Good luck!
