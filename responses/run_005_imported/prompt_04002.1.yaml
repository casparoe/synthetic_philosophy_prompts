  First, I need to recall both concepts clearly. Underdetermination means multiple theories can explain the same evidence, like different models in physics. Indeterminacy of translation, from Quine, suggests that for translating languages, there isn't just a lack of evidence but a fundamental lack of fact of the matter. 

  The user's friend thinks it's a special case of underdetermination. Quine himself might disagree. Where's the difference? Underdetermination allows that one theory could be correct, but we can't tell. Indeterminacy says there's no correct answer at all. That's the key point. 

  Quine's argument hinges on the behaviorist perspective. Meaning is tied to observable behavior, so if two translations match all behaviors, there's no deeper fact. That's different from physical theories where there might be hidden realities. 

  Also, the inscrutability of reference—like "gavagai" meaning rabbit vs. rabbit parts—shows that reference isn't fixed by behavior. The proxy function argument extends this: you can systematically reinterpret objects, and the evidence stays the same. 

  But is this defensible? Critics like Chomsky say meaning isn't just behavior. Davidson brings up holism and charity, but Quine might counter that those don't resolve the indeterminacy. The user probably wants to know if Quine's extra claim holds up. 

