answer: |-
  Okay, let's ditch the formalisms and grab the gut-level intuition. The key is understanding **what each aggregation rule fundamentally *cares about* and *needs to know* to make its decision.**

  Imagine you're the social planner distributing a fixed resource (say, water bottles) among a group of people. You have two different ethical principles in mind: Utilitarianism and Rawlsian Maximin.

  ### Scenario 1: Utilitarianism (Maximize Total Utility)
  *   **What it cares about:** *Adding up* everyone's utility. It wants to know "How much *extra* happiness/well-being (utility *gain*) does each person get from an extra bottle?" It's all about the *marginal gains* and summing them.
  *   **What it needs to know:** To add up the gains meaningfully, the *units* of utility must be comparable *across* people.
      *   Does giving a bottle to Alice give her *more, less, or the same amount* of extra utility as giving it to Bob? Is her "+10 utils" the same *size* as his "+10 utils"? If Alice is dying of thirst and Bob is just a bit parched, giving the bottle to Alice creates a *much larger utility gain*.
  *   **Cardinal Unit Comparability (CUC) is PERFECT for this:**
      *   **Gut Feeling:** CUC says: "We can measure *changes* in utility precisely (cardinal), and importantly, a 'util' means the *same thing* for everyone when measuring gains/losses (unit comparable). We can meaningfully say 'Alice gains 10 utils, Bob gains 5 utils, so the total gain is 15 utils.'"
      *   **Why it pins down Utilitarianism:** Utilitarianism *requires* adding up utils. You can *only* add them up meaningfully if a "util" represents the same *amount of gain* for everyone. CUC explicitly allows this. It tells you *exactly* how much total utility changes with different distributions. **Utilitarianism *is* the rule that maximizes the sum of unit-comparable gains.**
  *   **Why the Reverse (Ordinal Level) Doesn't Work for Utilitarianism:**
      *   Ordinal Level Comparability (OLC) tells you *who is worse off* (Alice has level 5, Bob has level 20), but it **doesn't tell you *by how much* Alice gains from an extra bottle vs. Bob.** You know Alice is worse off *now*, but maybe Bob gets *massive* utility from water? Or maybe Alice only gets a tiny bit? OLC gives you no information about the *size* of the gains, only the *ranking* of current levels. How can you maximize the *sum* if you can't measure or compare the *sizes* of the individual additions?

  ### Scenario 2: Rawlsian Maximin (Maximize the Minimum Utility)
  *   **What it cares about:** Identifying the *worst-off person* and making *them* as well off as possible. It asks: "Who has the *lowest absolute level* of utility right now? How can we raise *that specific level*?"
  *   **What it needs to know:** It needs to *compare absolute levels* of utility across people to definitively say who is the worst off. It *doesn't care* about the *size* of gains for people above the minimum, only that the minimum level is raised.
  *   **Ordinal Level Comparability (OLC) is PERFECT for this:**
      *   **Gut Feeling:** OLC says: "We can rank everyone's utility *levels* (ordinal), and importantly, we can *compare those levels across people* (level comparable). We can definitively say 'Alice is at level 5, Bob is at level 20, so Alice is worse off.'"
      *   **Why it pins down Maximin:** Maximin *only* needs to know who has the lowest utility level. Once you know Alice is the worst off (level 5), you give her the bottle to raise *her level* as much as possible. You don't care *how much* Bob gains if he gets it instead; you only care that Alice is at the bottom and needs raising. OLC gives you *exactly* the information needed to identify the worst-off person and rank outcomes based on *their* level. **Maximin *is* the rule that focuses solely on raising the lowest level-comparable position.**
  *   **Why the Reverse (Cardinal Unit) Doesn't Pin Down Maximin:**
      *   Cardinal Unit Comparability (CUC) tells you a *lot* about *gains* and *differences*, but **it doesn't directly tell you who has the *lowest absolute level*!**
          *   Imagine Alice has current utility 100 utils and gains 5 utils per bottle.
          *   Bob has current utility 5 utils and gains 1 util per bottle.
          *   CUC tells you Alice gains *more* per bottle (5 > 1). Utilitarianism would favor Alice.
          *   But Bob is clearly *worse off* (Level 5 vs Level 100)! Maximin would favor Bob.
      *   **The Problem:** CUC gives you precise information about *changes*, but it doesn't anchor the *absolute starting points*. You know the *sizes* of gains, but you don't know *where* people start relative to each other in a level-comparable way. You might know Alice gains more, but without level comparability, you can't be sure if Bob is actually worse off *in absolute terms* or just gains less. Maximin *requires* knowing who is absolutely worst off, which CUC doesn't guarantee.

  ### The Punchline - Why Not the Reverse?

  *   **Utilitarianism + OLC (Levels Comparable, Gains Not):** You know who's worse off *now* (Alice), but you don't know *how much* anyone gains from a resource. How can you maximize the *sum* if you can't measure or compare the *sizes* of the additions? You're missing the crucial information utilitarianism needs.
  *   **Maximin + CUC (Gains Comparable, Levels Not):** You know precisely how much *extra* utility each person gets (Alice gains 5, Bob gains 1), but you don't know their *absolute starting levels*. Is Bob starting at 1 util (desperate!) or 1000 utils (just a bit thirsty)? Maximin *only cares* about the lowest absolute level, which you *cannot identify* without level comparability. You might accidentally give the resource to someone who gains a lot but was already well-off, leaving the truly desperate person even further behind relatively.

  **Think of it like this:**

  *   **Utilitarianism:** Needs a *common measuring cup* for utility *increments*. (CUC provides the calibrated cup).
  *   **Maximin:** Needs a *common scale* to read everyone's *current utility meter*. (OLC provides the calibrated meter reader).

  **Cardinal Unit Comparability** gives you the measuring cup for changes. **Ordinal Level Comparability** gives you the calibrated meter for levels. Utilitarianism needs the cup to add up changes. Maximin needs the meter to find the lowest reading. Giving utilitarianism the meter (OLC) doesn't help it add anything. Giving maximin the cup (CUC) doesn't help it find the minimum level. That's why the pairing makes fundamental sense.
