answer: |-
  Here are 8 targeted interview questions designed to push the "resolute choice" view, complete with likely answers and sharp follow-ups. They cover your requested angles (Bratman, deterrence, your Venmo bet, falsifiability) while probing the core mechanics and implications:

  1.  **Core Mechanism:**
      *   **Q:** "You argue resolute choice is a distinct *rational* mode, not just willpower. But what's the *actual cognitive mechanism*? When Friday arrives and paying $600 gains me nothing, what rational process overrides the obvious 'don't pay' calculation *in the moment*? Isn't it just willpower masquerading as reasoning?"
      *   **Likely Answer:** "It's recognizing the constitutive role of *prior commitment* in making me the kind of agent whose plans are stable and trustworthy. The rationality lies in upholding the identity formed by that commitment."
      *   **Follow-Up:** "But isn't 'upholding identity' just a *desire* (to be trustworthy) that weighs against the desire to keep $600? How is weighing desires *now* fundamentally different from sophisticated choice, which also recognizes future temptation? Isn't this just sophisticated choice with 'commitment to identity' added to the utility function?"

  2.  **Bratman Comparison (Core Request):**
      *   **Q:** "Michael Bratman argues stable intentions are rational because they're essential tools for *planning agents* across time – they reduce cognitive load, coordinate action, etc. How is 'resolute choice' *more* than just Bratman's 'planning stability is good policy' dressed up with a stronger emphasis on personal integrity?"
      *   **Likely Answer:** "Bratman focuses on the *functional benefits* of stability. Resolute choice identifies a distinct *norm* arising *from the commitment itself*. It's not just that stability is *useful*, it's that *making* a sincere commitment rationally *binds* you in a way that transcends subsequent cost-benefit analysis of the act."
      *   **Follow-Up:** "Where does this 'binding norm' come from? If it's not grounded *in* the functional benefits Bratman identifies (better planning outcomes), and it's not a brute moral fact (which would make it non-rational in the instrumental sense Kavka uses), isn't it just postulated? How is this binding force *rational* rather than quasi-moral or psychological?"

  3.  **Nuclear Deterrence Bullet-Biting (Core Request):**
      *   **Q:** "Let's apply this to the nuclear deterrence case. A resolute chooser forms the sincere intention to retaliate if attacked, making deterrence credible. The attack happens. Retaliation is now catastrophic and gains nothing. Does the resolute chooser *launch the missiles*?"
      *   **Likely Answer:** "Yes. To do otherwise would be to betray the commitment that *was* the deterrent. The rationality lies in being true to the prior commitment that secured the peace, even when the immediate act is costly and 'pointless'."
      *   **Follow-Up:** "So, you *bite the bullet*. Isn't this deeply irrational? Millions die for *literally no strategic gain*, purely to maintain the leader's self-conception as 'trustworthy'? Doesn't this reveal resolute choice as potentially monstrous, prioritizing abstract consistency over actual consequences?"

  4.  **The Venmo Bet & Externalization (Core Request):**
      *   **Q:** "In my Venmo bet, I recorded a voice memo *promising to pay*. Doesn't this fundamentally change the case? Kavka's puzzle relies on the intention being purely *internal* – the billionaire reads your mind. My voice memo created external evidence, potentially shame, maybe even legal promissory estoppel. Did I accidentally *solve* the toxin puzzle for myself by adding external stakes, meaning I never truly tested 'resolute choice'?"
      *   **Likely Answer:** "It *complicates* it. The external record might add *motivation* (fear of shame), but the core resolute act was forming the *genuine intention* to pay *despite knowing* the voice memo existed. If you *only* intended because of the memo, that wasn't resolute. If you formed the sincere internal commitment *and* recorded it, the memo is incidental to the resolute rationality."
      *   **Follow-Up:** "But how could *anyone* (including me) distinguish whether my intention was 'sincere and resolute' or *caused* by the fear of the external record? Doesn't the potential for external enforcement make the 'pure' internal commitment Kavka requires psychologically impossible or indistinguishable from sophisticated choice hedging?"

  5.  **The "Trust" Dodge:**
      *   **Q:** "Your party line is 'it's not irrational, it's what it takes to be the kind of person your future self and others can trust.' But Kavka's puzzle is about *instrumental rationality*: achieving a desired outcome (the million) at minimal cost. Isn't 'being trustworthy' just *another outcome you desire*? Why isn't this simply sophisticated choice where 'maintaining trustworthiness' has a high utility value that outweighs the toxin/discomfort/$600?"
      *   **Likely Answer:** "Because 'trustworthiness' isn't just another preference; it's a *constitutive feature* of being a planning agent capable of making binding commitments *at all*. It's foundational, not additive."
      *   **Follow-Up:** "If it's truly constitutive, shouldn't *every* rational planning agent exhibit resolute choice? Yet clearly, sophisticated choosers exist and function as planning agents. Doesn't this show trustworthiness *can* be traded off, making it just another value in the utility calculation?"

  6.  **Psychological Realism & Self-Deception:**
      *   **Q:** "Kavka himself thought genuinely forming the intention to drink the toxin was psychologically impossible without self-deception. How does resolute choice avoid being a form of self-deception – tricking yourself *now* into believing you'll do the costly thing *later*, when you know full well that when 'later' comes, the reasons vanish?"
      *   **Likely Answer:** "It's not deception. It's a clear-eyed recognition *now* that *this commitment* requires following through *then*, regardless of the changed incentives. You know the reasons vanish, but you commit *despite* that knowledge because the commitment *creates* a new reason: fidelity to the commitment."
      *   **Follow-Up:** "But isn't 'fidelity to the commitment' just a *present* reason you *hope* will be strong enough later? How can you be genuinely *certain* this abstract fidelity will override the very concrete aversion to pain/loss *in the moment* without some element of faith or self-persuasion that looks like self-deception?"

  7.  **Personal Identity Over Time:**
      *   **Q:** "Resolute choice seems to require a very robust view of personal identity over time – that 'I' now and 'I' later are the *same agent* in a strong sense, bound by the commitments of the past self. But if the later self faces radically different incentives and information, are they really the 'same' agent in a way that makes the prior commitment rationally binding?"
      *   **Likely Answer:** "Yes. Planning agency *requires* seeing ourselves as temporally extended entities. The later self benefits *from* the prior self's ability to commit. Breaking commitments fractures that essential identity."
      *   **Follow-Up:** "But isn't the 'benefit' (the million) already secured *before* the later self acts? The later self is just left holding the bag (toxin/$600). Why should the later self rationally care about the *prior* self's commitment when it only brings harm *to the later self*? Isn't resolute choice asking the later self to sacrifice for the *prior* self's project?"

  8.  **Falsifiability (Core Request):**
      *   **Q:** "What would constitute decisive evidence that the sophisticated choosers are right? What real-world phenomenon or thought experiment result, if observed, would force you to concede that resolute choice isn't a genuine mode of rational intention-formation, just wishful thinking or sophisticated choice misdescribed?"
      *   **Likely Answer:** "Evidence that agents *cannot* form a sincere intention to perform a purely costly future act *without* self-deception or reliance on external enforcement *and* that such intentions, when formed, *never* actually override the immediate cost-benefit analysis when the time comes *without* those external factors."
      *   **Follow-Up:** "But Kavka already argues the intention *can't* be sincerely formed! And sophisticated choice predicts people *won't* follow through without enforcement. How could we *observe* the failure of a 'pure' resolute intention, distinct from sophisticated choice with high trust-utility, in a way that doesn't just beg the question? Isn't the core dispute unfalsifiable?"

  **Tips for the Interview:**

  *   **Listen Actively:** Don't just wait for your next question. Engage with her answers. The follow-ups are templates; adapt them based on *her specific phrasing*.
  *   **Press the "Why?":** If an answer feels vague or relies on terms like "constitutive" or "binding," ask her to unpack *why* that creates rationality in the Kavka sense.
  *   **Control the Pivot:** If she tries to pivot to "trust" or "identity," gently but firmly bring it back to the *rationality* puzzle: "But how does that *make it rational* to drink the toxin *after* getting the money?"
  *   **Use Her Definitions:** Ensure you're both using terms like "rationality," "intention," and "commitment" the same way she defines them in her work.
  *   **The Venmo Angle is Gold:** It's concrete and personal. Keep coming back to it to ground the abstract discussion. Ask *her* to diagnose your specific actions and intentions.

  These questions force her to defend the *mechanism*, confront the *implications* (especially the nuclear one), distinguish her view from near neighbors (Bratman, sophisticated choice with high trust-utility), and face the core challenge of psychological reality and evidence. Good luck with the podcast!
