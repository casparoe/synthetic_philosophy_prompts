answer: |-
  ## Dialogue: The Binding Problem of Primary Intensions

  **Characters:**
  *   **Alice:** A committed two-dimensionalist. Sharp, defends the framework but acknowledges its complexities.
  *   **Bob:** A Millian direct-reference theorist, skeptical of two-dimensionalism. Focused on the foundational issues of reference and cognitive significance.

  **Setting:** A philosophy seminar room after class, coffee cups in hand.

  **(The conversation picks up after a recap of the Hesperus/Phosphorus case.)**

  **Alice:** ...so you see, Bob, that's precisely where the primary/secondary distinction shines. *Hesperus is Phosphorus* is necessary *a posteriori* because its secondary intension – what it picks out rigidly in all possible worlds *given our world's facts* – is always true. But its primary intension – the way the world *must be* for the sentence to be true, considered *without* that *a posteriori* knowledge – is contingent. In scenarios where the celestial appearances differ, "Hesperus is Phosphorus" could be false. *That's* why it's informative! It eliminates those epistemically possible scenarios.

  **Bob:** Right, I get the formalism, Alice. I really do. It's elegant. But let's drill down on that primary intension for "Hesperus". You say it captures the "way the world must be" for the term to refer, considered epistemically prior to knowing it's Venus. Okay. *What is it?* Give me the primary intension for "Hesperus" for an ancient Babylonian competent speaker, Astarte. What property or condition defines the referent of "Hesperus" in an epistemically possible scenario *for Astarte*?

  **Alice:** Well, it's tied to the way the term is used. For Astarte, "Hesperus" is introduced ostensively, linked to perceptual experiences: it's the bright object seen regularly in the western sky after sunset. So the primary intension might be something like *the dominant bright celestial body reliably appearing in the evening sky in location L*.

  **Bob:** Ah, description! You just smuggled in a definite description: "the dominant bright celestial body reliably appearing in the evening sky in location L". But Kripke torpedoed this centuries ago! What if Astarte is *wrong*? What if she mistakenly identifies a particularly bright star *near* Venus one evening as Hesperus? According to your primary intension, *that* star is now a candidate referent in a scenario? But *we* know "Hesperus" rigidly designates Venus – it wouldn't shift to that star just because Astarte misapplies it once. Kripke’s ignorance and error bite *hard* here. The description doesn't *fix* the reference; the baptism and causal chain do. Your primary intension seems parasitic on the *actual* reference-fixing, but tries to abstract it away – and fails. It’s still hostage to the speaker's *potentially flawed* descriptive associations.

  **Alice:** Okay, fair point about specific errors. Maybe we need to idealize slightly. It's not just Astarte's *actual* dispositions, but what she *would* pick out under conditions of rational reflection, given the ostensive introduction and the role the term plays in her linguistic community. The primary intension is fixed by the *conceptual role* of the term, its inferential connections.

  **Bob:** Conceptual role? Inferential connections? Like what? "Appears in the evening"? "Is called 'Hesperus' by others"? "Is not the Sun or Moon"? This feels even messier. Which inferences are essential? How much does Astarte need to know? If we thin it out too much to avoid error, say, just *whatever celestial object this name was introduced to designate*, we collapse into triviality. If we make it richer, like *the brightest evening object*, we're back to vulnerability: what if Venus is dimmed by volcanic ash and Jupiter is brighter? Does "Hesperus" suddenly refer to Jupiter? No! It still refers to Venus. Your primary intension is either too specific and vulnerable to error, or so abstract it loses all content. Where's the stable, non-descriptive, yet epistemically significant core?

  **Alice:** Perhaps it’s not a *specific* description, but a *cluster* or a *dossier* of associated information, weighted by centrality. The primary intension picks out whatever best satisfies *enough* of that dossier in a scenario. It's a function from scenarios to referents based on conceptual competence.

  **Bob:** But then we're deep in cluster descriptivist territory! And Kripke's modal arguments apply with full force. Take a scenario where Venus *doesn't* satisfy most of Astarte's dossier – say, it only appears at noon and is faint. But the causal chain still traces back to Venus. Does "Hesperus" refer to Venus in that scenario, or to whatever object *does* satisfy the "evening star" description? If you say the latter, you're abandoning rigid designation for primary intensions, making "Hesperus is Phosphorus" *contingent* in a way Kripke showed it isn't. If you say it *still* refers to Venus because of the causal chain, then your primary intension is *already* presupposing the rigid reference-fixing facts you're trying to bracket for epistemic purposes! It's circular. You can't get the epistemic contingency without smuggling in descriptions that undermine the rigidity.

  **Alice:** Maybe the primary intension *is* ultimately metalinguistic or metasemantic. Perhaps for "Hesperus", the primary intension is simply *the object actually called 'Hesperus' in my linguistic community* or *the object bearing the appropriate causal-historical connection to this token use of 'Hesperus'*.

  **Bob:** *Now* we get to the heart of Soames' bind! If that's the primary intension, what work is it doing for cognitive significance? Compare:
  1.  Hesperus is Phosphorus.
  2.  Hesperus is Hesperus.

  If the primary intension of "Hesperus" is just *the thing called 'Hesperus'*, then the primary intension of both sentences becomes something like *the thing called 'Hesperus' is identical to the thing called 'Phosphorus'* vs. *the thing called 'Hesperus' is identical to the thing called 'Hesperus'*. Now, *that* difference *is* epistemically significant! Astarte might not know the things called 'Hesperus' and 'Phosphorus' are identical. But *why* is it significant? Only because she doesn't know that 'Hesperus' and 'Phosphorus' co-refer! The cognitive difference reduces entirely to ignorance about *words* – the metalinguistic facts. It doesn't capture any *non*-metalinguistic ignorance about the *world* that Frege's sense was meant to explain – like the difference between an evening object and a morning object. Your primary intension, to avoid the descriptivist pitfalls, has become a *label* for the rigid reference-fixing fact itself. It explains why the *sentence* is informative by pointing to ignorance about *language*, not about the celestial objects *through* language. Frege would weep! You haven't rescued cognitive significance; you've outsourced it to metasemantics.

  **Alice:** (Sighs, takes a long sip of coffee) You’re forcing me towards the thinnest possible edge, Bob. But perhaps that thinness is necessary. The primary intension *has* to be minimal to avoid the errors. Its epistemic role *is* precisely to capture the space of metasemantic uncertainty – the scenarios where the conventions or causal chains *could* have been different, leading the same terms to pick out different things. That *is* the source of the *a posteriori* necessity. Knowing that "Hesperus" rigidly designates Venus is knowing its secondary intension. Knowing *how* it designates – the possibilities left open *before* fixing that rigidity – is the primary intension. It *is* metasemantic, but that's not trivial! It explains why empirical investigation is needed: to discover *which* object our linguistic practices have latched onto.

  **Bob:** But then the "cognitive significance" you're explaining isn't about Hesperus *itself* as an evening object versus a morning object. It's about the *name tags* "Hesperus" and "Phosphorus". The ancient astronomer's discovery wasn't *just* "Oh, these two words pick out the same thing!" It was "Oh, that *evening object* IS that *morning object*!" The wonder is about the *cosmos*, not the lexicon. Your thin primary intension captures the linguistic ignorance, but it screens off the rich, non-linguistic modes of presentation – the very things that made the identity surprising and substantial. Two-dimensionalism, in trying to rescue Fregean significance without Fregean senses, ends up offering a *different kind* of significance – metasemantic significance. Useful, maybe, for some purposes, but is it really doing the original job? Or has the "rescue operation" subtly changed the mission?

  **Alice:** ...Perhaps it *is* a different kind of significance. Or perhaps it's the only kind we *can* have once we accept direct reference and rigidity. Maybe Frege's original job description *is* impossible to fulfill without collapsing back into descriptivism. The primary intension, even thin and metasemantic, *does* mark a genuine epistemic difference that the Millian picture alone flattens. It explains why "Hesperus is Phosphorus" requires empirical work, while "Hesperus is Hesperus" doesn't, without positing mysterious Fregean entities. It might not be the full-blooded sense, but it's the best we can get in a Kripkean world.

  **Bob:** And that, Alice, is where I think Soames lands. You've either got a primary intension thick enough to capture non-linguistic cognitive differences but vulnerable to Kripkean objections, or you've got one thin enough to avoid those objections but incapable of capturing the original Fregean cognitive difference – reducing it to linguistic knowledge. The machinery is elegant, but it seems perpetually caught in this bind. It either overreaches descriptively or underdelivers cognitively. So, does it *really* "earn its keep" beyond just restating Kripkean rigidity in a more complex framework? That’s the stalemate.

  **Alice:** (Stares into her coffee cup) It earns its keep by rigorously modeling epistemic possibility and necessity in a way pure Millianism can't. But... whether that model fully captures *what we intuitively meant* by cognitive significance... (She trails off) Maybe that's the price of doing business after the Kripkean revolution. Or maybe we need a better model. Pass the grading pens? I think I’d rather face the midterms than this abyss right now.

  **(They sit in silence for a moment, the unresolved tension hanging in the air – the bind perfectly captured, the stalemate reached.)**

  ---

  **Handout Notes: The Core Stalemate**

  1.  **The Millian Challenge:** Where does the primary intension (PI) come from without:
      *   *(a) Collapsing into a description?* If PI relies on speaker-associated descriptions (e.g., "the evening star"), it's vulnerable to Kripke's ignorance/error arguments. The PI could pick the wrong object in scenarios or shift reference incorrectly.
      *   *(b) Collapsing into triviality?* If PI retreats to a thin metasemantic gloss (e.g., "whatever 'Hesperus' refers to"), it fails to capture the *non-linguistic* cognitive significance (evening object vs. morning object) that motivated Frege. The epistemic difference reduces to ignorance about *word* co-reference, not object identity under different guises.

  2.  **The Two-Dimensionalist Defense:** The PI *must* be thin (metasemantic) to avoid Kripkean objections. Its job is to model epistemic possibility/scenarios *before* the rigid reference is fixed. The cognitive significance it explains is *metasemantic* significance (uncertainty about reference-fixing), which *does* explain why empirical work is needed for identities like "Hesperus is Phosphorus".

  3.  **The Stalemate:** Does this metasemantic significance adequately capture the *original* Fregean notion of cognitive significance (difference in *mode of presentation of the object*), or has the goalpost been moved? Two-dimensionalism offers a sophisticated model of epistemic modality, but it may not resolve the *specific* problem of non-linguistic cognitive differences that Fregean senses were designed for. It remains caught between descriptivist vulnerability and metasemantic thinness.
