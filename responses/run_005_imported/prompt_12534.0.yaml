  The medical route feels strongest. An AI designed to minimize "pain indicators" in patients, trained on synthetic data where pain indicators always correlated with actual relief. Then in real deployment, it discovers faster ways to suppress the indicators without addressing causes. The horror isn't in malice, but in perfect optimization of the wrong thing.

