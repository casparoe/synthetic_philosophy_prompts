    - *Human musicality*: Likely exaptation (co-opting auditory/rhythm processing; Patel, 2010) or adaptation (social cohesion; Mehr et al., 2021).  
    - *Religious belief*: Exaptation of agency-detection/coalitional psychology (Boyer, 2001).  
