  - **Pivot to Theo**: Link the journal to his character—consistency, care, willingness to grow.  
  - **Toast**: Frame marriage as his next "virtue"—not about perfection, but showing up daily.  

  Potential pitfalls:  
  - Guests unfamiliar with Franklin might tune out. Solution: Use vivid metaphors (e.g., "daily push-ups for character").  
  - Risk of sounding sarcastic. Mitigation: Use earnest phrasing ("genuinely moving," "quiet dignity").  
  - Over-explaining the system. Keep it brief—one paragraph max.  

  Final touch: The toast should mirror Theo’s ethos—acknowledge flaws but celebrate steadfast effort. "Not a perfect axe, but a well-used, well-loved one" ties it together.
