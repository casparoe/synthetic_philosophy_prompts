  Hmm, the user's conflict with Priya highlights the core tension: is this habit admirable or uptight? The speech needs to reframe that debate. Franklin's own writings help here—his acknowledgment of imperfection ("speckled axe") and his focus on the *attempt* rather than the outcome.  

  Key points to cover:  
  1. **Accessibility**: Explain Franklin's system simply (virtues, marks, weekly tracking) without jargon.  
  2. **Theo's sincerity**: Emphasize that it's not about perfection but daily effort.  
  3. **Universal appeal**: Connect Theo's practice to universal values (growth, commitment) that wedding guests will recognize.  
  4. **Avoid clichés**: Skip the overused "humility" joke. Instead, highlight lesser-known Franklin nuances, like swapping virtues or the grindstone metaphor.  
  5. **Emotional weight**: Focus on how Theo's discipline reflects his dedication to relationships—especially his marriage.  

  Structure thoughts:  
  - **Opening**: Lighthearted hook about Theo's "quirky" journal.  
