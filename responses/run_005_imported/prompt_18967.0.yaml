answer: |-
  Based solely on Pascal's fragments on justice, force, and custom, his analysis of modern international courts like the ICC would likely be cynical yet coherent, leading to specific conclusions and recommendations:

  1.  **Explanation of the Pattern (Justice Subordinated to Force):**
      *   **Powerless Justice vs. Tyrannical Force:** Pascal would see the ICC's actions as a perfect illustration of his core principle. The court possesses a claim to *justice* (prosecuting war crimes, genocide, etc.), but crucially lacks the consistent *force* to compel compliance from powerful states. Against weak states, the court *can* act because external powers (strong states or coalitions) *lend* it force (sanctions, support for arrest, political pressure). Against strong states, this force is absent or actively opposed. The court's justice is thus "powerless" against the strong.
      *   **Calling the Strong "Just":** Pascal argued societies avoid the difficult task of making the just strong by simply *calling* the strong just. The international system, in his view, does the same. Powerful states (and their allies shielded by them) escape ICC jurisdiction not because their actions are inherently just, but because their strength allows them to defy the court's authority. The international community often *de facto* accepts this situation, implicitly treating the powerful state's defiance or non-participation as a legitimate exercise of sovereignty ("just" within their sphere), rather than a fundamental challenge to the court's universal justice. The selectivity *is* the system adapting to label the strong "just" by default, due to their unassailable power.
      *   **Custom as the Mystical Foundation:** The authority of international law and bodies like the ICC rests heavily on *custom* – treaties, norms, habitual acceptance by states, and the *belief* in their legitimacy. Pascal would argue this foundation is "mystical" precisely because it obscures the underlying reality: the ultimate guarantor of any legal order, including international law, is force (or the credible threat thereof). The ICC's effectiveness depends on powerful states *choosing* to lend it force against weaker targets or rivals, while withholding it against themselves or their allies. Exposing this dependency – that the court's power is contingent on the will of the strong, not inherent justice – threatens its fragile authority.

  2.  **Recommendations (Pragmatic Acceptance & Preservation of Illusion):**
      *   **Accept the Reality, Don't Fight the Nature of Power:** Pascal, the realist, would likely argue that trying to *force* the ICC's justice upon truly powerful, resistant states is futile and potentially destabilizing ("tyrannical" if attempted without overwhelming, legitimate force, which doesn't exist globally). He wouldn't recommend quixotic efforts to directly challenge major powers through the court alone.
      *   **Work Within the Constraints of Force:** His recommendation would be pragmatic:
          *   **Focus Where Force is Available:** Continue using the ICC where its justice *can* be backed by force – i.e., against weaker states or non-state actors where powerful states have an interest in supporting prosecution. He might see this as achieving limited justice where possible.
          *   **Build Custom Gradually:** Focus on strengthening the *custom* of compliance and the *illusion* of universal authority. This means securing more ratifications, encouraging voluntary cooperation, and building precedents where possible, even if selectively applied initially. The goal is to deepen the habitual acceptance of the court's role over time.
          *   **Seek Indirect Influence:** While direct coercion of great powers is impossible, Pascal might see value in using the court's findings, moral authority (however fragile), and the weight of custom to exert diplomatic pressure, shape global opinion, and perhaps influence the internal politics of powerful states over the very long term. This leverages the "mystical foundation" rather than directly confronting the force imbalance.

  3.  **Publicizing Selectivity & The Warning Against Exposure:**
      *   **Pascal Would Oppose Publicizing the Selectivity *as a Destructive Act*:** His warning about tracing laws to their real (force-based) origins is directly applicable. Publicly and relentlessly highlighting the ICC's powerlessness against strong states, and framing it *explicitly* as proof that the court's authority rests *only* on the contingent will of the powerful and not on inherent justice or universal law, **does exactly what Pascal warns against.** It exposes the "arbitrary foundation" (force and contingent custom) and directly attacks the "mystical foundation" (the belief in the court's inherent legitimacy and universal mandate).
      *   **Consequence of Exposure:** Pascal would argue this exposure *will* undermine the court's already fragile authority. It weakens the custom/habit of compliance among weaker states and allies of the powerful ("Why should we comply if they don't?"). It reduces the court's moral leverage and its usefulness even as a tool for limited justice against weaker actors. It confirms the cynicism that power, not justice, ultimately rules, potentially destabilizing the entire normative order the court represents.
      *   **Can He Treat This Case Differently? Consistency:** Pascal *could not* consistently treat this case differently based on his commitments. The international legal system, with the ICC as a key example, is a *prime* instance of the dynamics he described: justice claims lacking universal force, power dictating the scope of "justice," and authority resting on custom that obscures underlying power realities. Exposing the selectivity *is* exposing the arbitrary foundation. His logic compels him to see this exposure as dangerous to the social (in this case, international) order the institution sustains, however imperfectly.

  **In Summary:**

  Pascal would explain the ICC's selectivity as the inevitable result of justice lacking force against the powerful, leading the international system to effectively "call the strong just" by default. He would recommend pragmatically utilizing the court where force *is* available (against the weak), while working quietly to strengthen the customary acceptance of its role, avoiding direct confrontations with great powers. Crucially, he would vehemently oppose publicly emphasizing the court's powerlessness against strong states, as this directly exposes the force-based foundation of its authority and undermines the "mystical" custom essential for its continued, albeit limited, function. His warning against exposing arbitrary foundations gives him a strong, consistent reason to oppose such publicizing in this case.
