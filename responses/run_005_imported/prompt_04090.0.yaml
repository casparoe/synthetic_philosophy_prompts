  For the second question on inevitability: Tolstoy isn't saying events are fated without contingency. He's shifting the *level* of contingency. If Napoleon died in 1811, that wouldn't change history because the "sum of wills" would have produced another leader. Contingency exists, but at the granular level of mass human actions, not individual decisions. Counterfactuals about individuals are irrelevant; valid counterfactuals would ask how millions of wills might have summed differently (e.g., broader social conditions). So it's inevitability of large-scale patterns, not deterministic scripting.  

