prompt: |-
  The following passage opens Book Eleven of Tolstoy's *War and Peace* (1869, Aylmer Maude translation), at the point where the narrator interrupts the story of the 1812 campaign to argue, at length, about historical method:

  Absolute continuity of motion is not comprehensible to the human mind. Laws of motion of any kind become comprehensible to man only when he examines arbitrarily selected elements of that motion; but at the same time, a large proportion of human error comes from the arbitrary division of continuous motion into discontinuous elements. There is a well-known, so-called sophism of the ancients consisting in this, that Achilles could never catch up with a tortoise he was following, in spite of the fact that he traveled ten times as fast as the tortoise. By the time Achilles has covered the distance that separated him from the tortoise, the tortoise has covered one tenth of that distance ahead of him: when Achilles has covered that tenth, the tortoise has covered another one hundredth, and so on forever. This problem seemed to the ancients insoluble. The absurd answer (that Achilles could never overtake the tortoise) resulted from this: that motion was arbitrarily divided into discontinuous elements, whereas the motion both of Achilles and of the tortoise was continuous.

  By adopting smaller and smaller elements of motion we only approach a solution of the problem, but never reach it. Only when we have admitted the conception of the infinitely small, and the resulting geometrical progression with a common ratio of one tenth, and have found the sum of this progression to infinity, do we reach a solution of the problem.

  […]

  In seeking the laws of historical movement just the same thing happens. The movement of humanity, arising as it does from innumerable arbitrary human wills, is continuous. To understand the laws of this continuous movement is the aim of history.

  […]

  Only by taking infinitesimally small units for observation (the differential of history, that is, the individual tendencies of men) and attaining to the art of integrating them (that is, finding the sum of these infinitesimals) can we hope to arrive at the laws of history.

  […]

  The historians, replying to this question, lay before us the sayings and doings of a few dozen men in a building in the city of Paris, calling these sayings and doings "the Revolution"; then they give a detailed biography of Napoleon and of certain people favorable or hostile to him; tell of the influence some of these people had on others, and say: that is why this movement took place and those are its laws. But the mind of man not only refuses to believe this explanation, but plainly says that this method of explanation is fallacious, because in it a weaker phenomenon is taken as the cause of a stronger. The sum of human wills produced the Revolution and Napoleon, and only the sum of those wills first tolerated and then destroyed them.

  I would like help with two aspects of the argument:

  1. Reconstruct, step by step, how the analogy with Zeno's paradox and the calculus of infinitesimals is meant to support the conclusion in the final paragraph. Is the mathematical analogy actually doing logical work here — is there a real disanalogy between treating "great men" as causes and treating infinitesimal individual wills as the true units of historical explanation — or is the calculus vocabulary functioning mainly as a rhetorical device?

  2. Does Tolstoy's argument amount to a thesis of strict historical inevitability that would rule out counterfactual questions such as "what if Napoleon had died in 1811?" as simply confused, or does it merely relicense such questions at a different level of description — e.g., as questions about how the "sum" of countless individual wills would have differed, rather than about what one man decided?
