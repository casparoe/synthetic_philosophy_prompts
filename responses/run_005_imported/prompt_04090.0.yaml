  First, I need to unpack Tolstoy's argument. He starts with Zeno's paradox about Achilles and the tortoise to show how arbitrarily dividing continuous motion creates false problems. The solution comes from calculus—using infinitely small units (infinitesimals) and summing them (integration) to understand continuous motion. Tolstoy applies this to history: instead of focusing on "great men" like Napoleon, we should look at the "infinitesimally small units"—the countless individual human wills—and integrate them to find historical laws.

