answer: |-
  You've pinpointed a fascinating and subtle tension between two foundational critiques of moral realism. Let's dissect the arguments, their relationship, and their implications:

  **1. Core Arguments & Their Differences:**

  *   **Quine's Methodological Challenge (Coherence Theory):**
      *   **Core Claim:** Moral disagreements lack an independent, empirical "tribunal" for resolution. Unlike science, where predictions can be checked against sensory experience *independent* of the theory itself, moral judgments can only be assessed against our *existing* web of moral beliefs and sensibilities ("moral standards"). This forces ethics into a "coherence theory" of justification: moral beliefs are justified by their fit with other moral beliefs, not by correspondence to external, non-moral facts.
      *   **Epistemic Skepticism Focus:** Challenges the *methodology* of ethics, questioning whether moral beliefs can achieve the kind of objective, empirical warrant found in science. It implies ethics is fundamentally different in kind.
      *   **Skeptical Strength:** Moderate. It doesn't deny we have moral beliefs or that reasoning occurs; it denies that this reasoning tracks independent facts in the way scientific reasoning does. It leaves room for internal justification ("coherence") but questions its objectivity.

  *   **Harman's Explanatory Challenge (Explanatory Idleness):**
      *   **Core Claim:** While we have moral *observations* (immediate judgments), we don't need to posit *moral facts* to *explain why we have those observations*. The psychological/sociological story (upbringing, evolution, sensibilities) fully explains the occurrence of the moral judgment. Positing a "real wrongness" adds nothing explanatory. (The proton explains the vapor trail; "wrongness" doesn't explain the judgment beyond the psychological causes).
      *   **Metaphysical/Ontological Skepticism Focus:** Challenges the *existence* or *explanatory necessity* of moral facts. Even if we grant the phenomenology of moral observation, it doesn't commit us to moral realism.
      *   **Skeptical Strength:** Stronger/Deeper. It directly attacks the core realist claim that moral facts are part of the "furniture of the world" needed to explain our experiences. It suggests moral discourse, however coherent internally, might be systematically misleading about ontology.

  **2. Distance Between Them & Coherent Acceptance:**

  *   **Different Targets & Levels:** Quine targets *justification* and *method* (how we *know* moral claims), emphasizing the lack of an independent empirical check. Harman targets *ontology* and *explanation* (whether moral *facts exist* and play a causal/explanatory role), granting the psychological reality of moral judgments.
  *   **Potential for Coherent Separation:**
      *   **Accept Quine, Resist Harman:** One could agree ethics relies on coherence (Quine) but argue that *within* this coherent system, moral facts *are* explanatorily necessary *for the system itself*. For example, a moral realist could argue: "The *reason* we judge cat-burning wrong *within our moral framework* is *because* it *is* wrong (a fact internal to the framework)." Harman's challenge is that the *framework's origin* is explained psychologically, not by external facts. But a realist could argue the framework's *internal logic* requires positing facts. This might satisfy Quine's coherence demand but leaves Harman's deeper challenge about the framework's connection to reality untouched.
      *   **Accept Harman, Resist Quine:** This is harder. If moral facts are explanatorily idle (Harman), it strongly suggests they cannot be tested against independent reality (Quine). Why would idle facts be testable? However, one *might* argue that while moral facts don't *explain* our judgments *causally*, they might still be *corresponded to* by our judgments under ideal conditions of coherence (a la ideal observer theory). But this feels like trying to salvage correspondence *after* accepting explanatory idleness, which is unstable. Harman's challenge generally implies Quine's.

  **3. Quine's Holism & the Tension:**

  *   **The Tension:** Quine's famous holism ("Two Dogmas of Empiricism") states that theories face experience "as a corporate body," not sentence-by-sentence. This seems to undermine his sharp science/ethics dichotomy. If *all* beliefs are justified holistically via coherence with experience at the periphery, why single out ethics for lacking "correspondence"?
  *   **Quine's (Attempted) Resolution:** Quine acknowledged this tension. His response was pragmatic and gradational:
      1.  **Degree of Entrenchment:** Scientific beliefs are more deeply entrenched in the web, closer to the sensory periphery. Modifying them causes massive upheaval. Moral beliefs are more peripheral, easier to adjust.
      2.  **Degree of Empirical Content:** While the *whole* web faces experience, the empirical content is unevenly distributed. Sentences like "There's a rabbit" are intimately tied to specific stimulations. Moral sentences like "Charity is good" are connected only very indirectly and diffusely to sensory input through vast networks of other beliefs.
      3.  **Pragmatic Basis for the Distinction:** The distinction between science and ethics isn't absolute but a matter of degree based on how directly and systematically beliefs link to observation and prediction. Science earns its "correspondence" title through its robust, systematic, and direct predictive success about observable events. Ethics lacks this predictive power over the non-moral world.
  *   **Critique of Resolution:** Many find this resolution ad hoc and unconvincing. It seems to reintroduce a form of the analytic/synthetic distinction he famously rejected. *Why* are moral beliefs less entrenched or less empirically contentful *in principle*? Couldn't a moral belief be central to someone's web? Holism seems to suggest ethics *could* be confirmed/disconfirmed, just very holistically. Quine's distinction feels more like a description of current practice than a deep metaphysical divide.

  **4. Which Challenge is More Serious for Robust Cognitivist Realism?**

  *   **Harman's Challenge is Generally More Devastating.**
  *   **Why:**
      1.  **Direct Ontological Threat:** Robust realism asserts that moral facts exist independently and causally explain (or justify) our beliefs. Harman directly denies their explanatory necessity, suggesting they are epiphenomenal. If moral facts don't *do* any work, why believe they exist? Quine questions *how we know*, but leaves open the *possibility* that we know *something* (even if only coherently justified).
      2.  **Escaping Coherence:** A realist can potentially respond to Quine by arguing that *within* a sufficiently developed and coherent moral system, justified by its connection to other beliefs (including empirical facts about human flourishing, social needs, etc.), we *do* achieve a form of correspondence to real (albeit non-natural or response-dependent) facts. Quine's challenge makes this hard, but not logically impossible. Harman's challenge asks *why posit the facts at all*, even for coherence.
      3.  **The Burden of Explanation:** Harman shifts the burden of proof decisively. The realist must show *what work* moral facts do that cannot be done by natural facts (psychology, sociology, evolution). This is a high bar. Quine's challenge is about methodology, which realists might try to meet by refining their epistemology (e.g., moral perception, reflective equilibrium as quasi-empirical).
      4.  **Compatibility with Naturalism:** Harman's challenge resonates powerfully within a naturalistic worldview (which both Quine and Harman shared, and which many realists also aspire to). If physics, biology, and psychology explain everything that happens, including moral judgments, where is the "space" for moral facts to exist and exert influence?

  **Conclusion:**

  While Quine and Harman are often linked, their arguments target moral realism at different levels. Quine's is primarily an *epistemic/methodological* challenge about justification and the lack of independent empirical testing, forcing ethics into coherence. Harman's is a deeper *metaphysical/explanatory* challenge about the very existence and necessity of moral facts. Quine's holism creates tension with his own science/ethics split, resolved pragmatically but not entirely satisfactorily.

  For defending a **robust, cognitivist moral realism**, Harman's Explanatory Challenge is the more formidable obstacle. It directly attacks the core ontological commitment of realism by questioning whether moral facts play any indispensable role in our best explanation of the world, including our own moral experiences. Overcoming Harman requires showing that moral facts *are* explanatorily necessary, not just that our beliefs about them can be coherently justified (which is Quine's domain). While both challenges are serious, Harman's strikes closer to the heart of realist metaphysics.
