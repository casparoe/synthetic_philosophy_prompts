  **Explanation of Scores & Feedback:**

  1.  **Handicap Principle & Peacock (3.5/5):** Lost 1.5 points for the major error of conflating Zahavi's Handicap Principle with Fisher's Runaway Selection. These are fundamentally different evolutionary mechanisms for sexual selection. While both can apply to traits like the peacock's tail, stating they are "essentially the same mechanism" is incorrect and misleading. The explanation of the handicap principle *itself* applied to the peacock was otherwise excellent (costs, honesty through survival ability).
