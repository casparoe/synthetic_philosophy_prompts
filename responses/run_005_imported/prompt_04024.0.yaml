  **Justification for S-tier (Pareto-style comparisons):**  
  This approach, championed by philosophers like Amanda Askell, avoids infinite summation entirely by focusing on *relative improvements* rather than absolute totals. It requires no arbitrary parameters (e.g., discount rates), preserves ethical intuition by prioritizing Pareto dominance (no one worse off, some better off), and sidesteps rearrangement paradoxes. By abandoning cardinal aggregation as fundamentally flawed in infinite contexts, it offers a coherent ethical framework rather than a mathematical workaround.

  **Justification for D-tier (Discounting well-being by time):**  
  Discounting imposes an arbitrary decay rate on future well-being to force convergence, prioritizing mathematical convenience over ethical principles. It systematically devalues the interests of future beings (or distant populations), lacks a non-arbitrary justification for the chosen rate, and fails to resolve the core problem—merely shrinking infinity into a finite number while introducing new biases. This renders it a technical patch that relocates ethical dilemmas rather than solving them.
