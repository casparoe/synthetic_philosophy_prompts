  5. Emphasize that evidence-based tiers prevent both under-protection and overreach

  Must avoid philosophical jargon - keep it actionable for IACUC. Reference the user's point about flies' learning sophistication not implying suffering. The "off-campus" risk is real; the memo should position this approach as preventing that outcome through reasonable, defensible standards.

