  The reformed cheater case is the sticking point: someone who's genuinely reformed but never apologized, now preaching loyalty. The user couldn't explain why this still feels wrong under their theory, almost conceding Jae might be right about standing being irreducible. They want me to: 1) strengthen their reductionist position against this exact case, and 2) honestly judge if it holds up.

  Hmm... first I need to reconstruct both views precisely. The user's "two boring things" approach tries to dissolve standing into component parts: the act of blaming contains truth (X is wrong), while hypocrisy is a separate character flaw. Jae's Wallace-inspired view says hypocritical blame is pragmatically void - like trying to pay debts with counterfeit money. 

  For the cheater case, the user's account seems to work superficially: he's sincere now (no insincerity evidence), past wrongs don't contaminate present statements. But intuitively, his blame still feels... illegitimate. Why? 

  I could attack from three angles: First, the "separate wrong" angle - his current preaching might constitute ongoing harm (harassing exes? exploiting moral capital he never repaid). Second, the insincerity angle - refusing to apologize suggests he doesn't fully own the norm's force. Third, reframe "standing" as about social context: his community hasn't re-endorsed him as a moral agent. 

  But the strongest pushback might be that the user's "two things" already cover it: the hypocrisy isn't in past cheating but current failure to align his moral posture with his unreconciled past. When he blames others while owing apologies, that very act is a new instance of exempting himself from accountability - the core hypocritical wrong. 

  Still... I suspect Jae has a point about performative failure. Even if the blame is true, his utterance might be what Langton calls "blocked as illocution" - the community rejects it not because it's false, but because he's broken the back-and-forth of moral exchange. Like a corrupt judge issuing valid rulings: legally sound, but tainted. 

  If forced to bet? The reductionist view survives but limps. It explains the cheater case by stretching "separate wrong" to cover ongoing relational debt. Yet something irreducible remains about moral address requiring clean hands - not as extra status, but as pragmatic precondition. The user's close, but Jae's onto a real phenomenon.
answer: |-
  Here's the strongest defense of your reductionist position, directly engaging with Jae's unapologetic-reformed-cheater case, followed by an honest assessment:

  **The Strongest Reductionist Case (Your Position Refined):**

  1.  **Separate Wrongs, Distinct Domains:** Hypocritical blame involves *two* distinct moral faults:
      *   **The Content Wrong:** The act being blamed (e.g., cheating, tardiness) is wrong *in itself*, independent of the blamer.
      *   **The Hypocrisy Wrong:** The act of blaming *while unrepentantly engaging in the same behavior* constitutes a *separate* wrong. This is a wrong of *fairness* (applying rules to others you exempt yourself from), *integrity* (failing to align your actions with your professed values), and potentially *manipulation* (using moral language for control without personal cost).

  2.  **Sincerity is Key (and Contextual):** The primary function of pointing out hypocrisy isn't to negate the *truth* of the blame, but to question the *sincerity* of the blamer's commitment to the norm. If the blamer is demonstrably insincere, their "blame" is merely performative manipulation, not genuine moral address. However, sincerity *can* be re-established over time through consistent reformed behavior, even without explicit apologies to past victims. Actions speak louder than words.

  3.  **Engaging the Unapologetic-Reformed-Cheater Case (Jae's Challenge):**
      *   **Sincerity Check:** His five years of fidelity *are* strong evidence of current sincerity regarding the norm against cheating. He *lives* the norm now. His lectures aren't performative hypocrisy *in the present moment*; he's not currently cheating.
      *   **The "Separate Wrong" is Present, But Not of the Blame Content:** The *separate wrong* here isn't inherent to his *current act of blaming others for cheating*. It lies in his **unresolved relational debts** and **ongoing failure of integrity regarding his past**.
          *   **Relational Debt:** By never acknowledging his past wrongs to his exes, he maintains an unjust posture towards them. He benefits from their silence (or lack of confrontation) while positioning himself as a moral authority. This is an *ongoing* failure of accountability and respect *to them*.
          *   **Integrity Gap:** While sincere about the norm *now*, his refusal to confront his past actions creates a disconnect in his *overall moral narrative*. He preaches a norm whose full implications (including accountability for past violations) he still avoids. This is a *present* failure of integrity, distinct from the specific act of blaming others.
      *   **Why the Blame Still "Lands" (Reductively):** When he tells a friend "Cheating is wrong, don't do it," that *statement* is true and carries the normative weight of the moral rule against cheating. Its authority comes from the *rule itself*, not solely from him.
      *   **The Legitimate Recoil Explained (Without Standing):** Our discomfort isn't because his statement about cheating's wrongness is *false* or *lacks authority*. It's because:
          *   He is *currently* committing a *different* wrong: failing his relational debts and demonstrating incomplete integrity by dodging his own past. (**Separate Wrong**)
          *   This *current* behavior *might* (reasonably) cause us to suspect his *motives* for blaming others (e.g., is he overcompensating? deflecting from his guilt? seeking unearned moral high ground?), introducing doubt about his *current* sincerity *in this specific context* of lecturing on loyalty, even if we accept his general fidelity. (**Evidence of *Potential* Insincerity/Questionable Motive**)

  4.  **The Core Argument:** "Standing to blame" isn't a distinct metaphysical status revoked like a license. It's a practical descriptor summarizing two conditions:
      *   **Is the blame-worthy act actually wrong?** (Yes, always, independently)
      *   **Is *this blamer*, at *this moment*, free from the *specific hypocrisy wrong* related to *this act*?** If not, their act of blaming is *itself* tainted by a *separate moral failing* (hypocrisy/unfairness/lack of integrity) and/or provides evidence undermining their *sincerity* in this instance. The *content* of the blame remains true, but the *act of uttering it* becomes morally problematic or suspicious *because of the blamer's own simultaneous or unresolved failings*.

  **Honest Assessment: Does the Reduction Survive? The Referee's Call**

  Jae's unapologetic-reformed-cheater case is potent because it isolates a genuine intuition: the *unresolved past* seems to actively *taint* the present moral address, even when sincerity about the norm itself seems established and the separate wrong of *current* hypocrisy is absent.

  *   **Strengths of Your Reduction:**
      *   It **successfully identifies concrete, present moral faults** in the cheater's lecturing: the ongoing relational injustice and the integrity gap regarding his past. This isn't nothing; it explains *why* we recoil.
      *   It **avoids positing a mysterious "standing" entity**. The work is done by familiar concepts: sincerity, fairness, integrity, relational duties.
      *   It **preserves the objective truth and normative authority of the moral rule** being invoked. The wrongness of cheating doesn't vanish because of the blamer's flaws.

  *   **Where Jae's "Equal Standing" Picture Gains Traction:**
      *   The reduction feels like it's **explaining *around* the core intuition** rather than fully capturing it. The sense isn't *just* "he's doing something else wrong now," but that his *very act of moral address is fundamentally compromised or illegitimate* because he hasn't cleansed himself of the same failing in the eyes of the moral community. He hasn't "paid his dues" to re-enter the space of holding others accountable for *this specific vice*.
      *   The **lack of apology** seems *constitutive*, not just evidentiary. It's not merely *evidence* of potential insincerity; it feels like a *necessary condition* for him to regain the *moral position* to admonish others. Until he acknowledges his own debt to the norm through apology/amends, his voice lacks the moral purity required for the speech act of blame to function *as intended* – as a call from shared moral ground.
      *   **Analogy:** Imagine a corrupt judge who stole but reformed. Legally, they can still issue correct rulings. But morally, their pronouncements on theft cases feel hollow and lack the *moral force* they should carry, *even if legally valid*. The "equal standing" view captures this hollowness better than just saying "they are also guilty of a separate past wrong."

  **The Verdict:**

  If forced to bet, **I lean slightly towards Jae's "equal standing" picture being necessary to fully account for the unapologetic-reformed-cheater case.**

  *   **Why:** The reductionist account explains the *reasons why we find the blamer objectionable* (relational debt, integrity gap, suspicion of motive) brilliantly, and preserves the truth of the moral content. However, it doesn't *quite* capture the intuition that the *performative act of blaming itself fails* or is *blocked* due to the blamer's unresolved history with the *very norm they invoke*. The missing apology isn't just *another* wrong; it specifically negates his position to *authoritatively address* this particular fault in others. The "equal standing" idea (like Wallace/Cohen frameworks) directly addresses this performative failure of the speech act itself.
  *   **The Caveat:** This doesn't mean "standing" is a magical aura. Jae's view (like Wallace's) can *also* be grounded in the *pragmatics of moral communication* and the *conditions for successful illocutionary force* (like Langton/Hornsby on silencing). The blamer's hypocrisy *blocks* the blame from being received as a legitimate moral demand because it reveals they don't truly occupy the shared normative position the speech act presupposes. This is still a reductive explanation, just reducing "standing" to conditions of successful speech acts within a moral practice, rather than to separate wrongs + sincerity evidence.

  **In essence:** Your reduction is powerful and explains *most* cases of hypocrisy effectively. But Jae's counterexample exposes a scenario where the *unresolved past specifically related to the norm* seems to actively undermine the *present performative force* of the blame *itself*, in a way that feels irreducible to *just* the blamer committing a separate current wrong or us doubting their sincerity. The "equal standing" framework provides a more direct explanation for *that specific* performative failure. The debate likely hinges on whether one prioritizes the *truth of the content* above all else (your strength) or the *pragmatic success of the moral speech act* within a community (Jae's strength).
