  I should check if there are any counterpoints. Gödel might push back against conflating proof systems with agents. He might argue that the obstacle assumes agents are mechanistically bound, which he disputed for humans. So he could see the obstacle as relevant only to mechanistic agents, thus supporting the disjunction's second horn for AI, but not for humans.

