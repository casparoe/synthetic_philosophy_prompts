  First, I need to recall the core of Zahavi's handicap principle. He argued that signals must be costly to be honest, with the cost being wasteful. Only high-quality individuals can afford this waste, making the signal reliable. For example, a peacock's tail is heavy and energetically expensive, so only fit peacocks can handle it. Zahavi emphasized that the waste itself is what makes the signal honest.

  Then there's Grafen's model. He used game theory to show how honest signaling can be evolutionarily stable. His model relies on the marginal cost of signaling: the additional cost per unit of signal intensity. High-quality individuals have lower marginal costs, so they can afford to produce stronger signals. But Grafen's model doesn't require the signal to be wasteful overall. The total cost could be low if it's efficient, as long as the marginal costs differ between high and low-quality individuals.

