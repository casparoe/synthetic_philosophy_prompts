  For the verdict: It seems Grafen's model is indeed a distinct theory. It provides a mechanism (differential costs) that can include wasteful signals but doesn't require them. The conflation happened because both involve costs, but the necessity of waste isn't supported by Grafen. A charitable reading might note that Zahavi's examples often involve waste, but his theoretical insistence on waste isn't upheld by the model. So, the two aren't fully reconcilable on the role of waste.

