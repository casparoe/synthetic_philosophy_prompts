  First, I recall Aquinas's key texts: the *Summa Theologiae* and *De Regno*. The user's summary seems oversimplified. Aquinas does discuss tyranny and resistance, but his stance on private individuals killing tyrants is more nuanced. The main reference is ST I-II, Q.42, A.2, ad 3, and ST II-II, Q.64, A.3. In the latter, he discusses killing in self-defense, which is relevant.

  Aquinas's natural law framework emphasizes the common good. Authority is legitimate only when serving it. A tyrant pursuing private advantage violates this, losing legitimacy. But does that mean any subject can kill him? Not exactly. Aquinas distinguishes between public and private actors. Only public authority can justly execute criminals. Private individuals can kill in immediate self-defense, but premeditated killing of a tyrant would be usurping public judgment.

  The user mentions Mariana, who explicitly allowed private tyrannicide. Aquinas is more cautious. He suggests that the community, through public authority, can depose the tyrant. In *De Regno*, he even mentions divine intervention or human agency, but the latter likely means official channels. Private assassination isn't endorsed.

  Conditions for private action: only in immediate self-defense, without intent to kill, as a last resort. The example of killing an attacker illustrates this. For a tyrant, unless there's an imminent threat, private killing isn't permissible. The community must act through representatives.

  I should correct the user's view. Aquinas doesn't grant a general license like Mariana. His conditions are stricter, emphasizing public authority and limiting private action to defense. The user might be conflating Aquinas with later thinkers. Clarifying this is crucial for their lecture accuracy.

  Also, the user is addressing graduate students, so precision matters. Highlighting Aquinas's distinction between tyrannicide by public authority vs. private individuals is key. Mentioning sources like ST II-II, Q.64, A.3 and *De Regno* will help them reference correctly. Emphasizing that forfeiture of authority doesn't automatically permit private killing but necessitates public action.
answer: |-
  Your understanding captures a core element of Aquinas's thought on tyranny but requires significant nuance, particularly regarding the **license for *private* individuals to kill the ruler.** Aquinas **does not** endorse a general permission for *any private citizen* to assassinate a tyrant in the manner later argued by Mariana. Here's a reconstruction of his natural-law argument and the critical conditions he places on resistance:

  1.  **The Foundation of Authority in the Common Good (Natural Law Premise):**
      *   Authority (rulership) exists by natural law and divine ordinance for the sake of the *common good* (ST I-II, Q.90, A.2; Q.96, A.4; *De Regno*, I, 1, 15).
      *   The ruler's legitimacy is contingent upon governing for this common good. His right to command stems from this purpose.

  2.  **Tyranny as a Perversion of Authority:**
      *   When a ruler "governs for his own advantage and not for the good of the multitude subject to him," he ceases to be a true ruler and becomes a *tyrant* (ST I-II, Q.42, A.2, ad 3; *De Regno*, I, 3-6).
      *   By acting contrary to the very *raison d'être* of authority (the common good), the tyrant severs the bond of legitimate obedience. He *forfeits* his claim to rightful authority. Aquinas explicitly states such a ruler is "unjust" and his rule is "not government, but rather a perversion of government" (*De Regno*, I, 3).

  3.  **The Tyrant as a Criminal:**
      *   Aquinas agrees that the tyrant, by oppressing the community for private gain, commits injustice. He can be likened to a "robber" preying on the people (*De Regno*, I, 3). His actions are criminal in nature.

  4.  **The Crucial Distinction: Public vs. Private Action (The Core Limitation):**
      *   **Here is where your statement needs correction.** Aquinas **does not** conclude that *any private individual* may licitly kill the tyrant. His argument hinges on the distinction between *private judgment/action* and *public authority/judgment*.
      *   **Natural Law & Punishment:** Natural law dictates that just punishment, especially capital punishment, requires *legitimate authority*. Only the public power (or God directly) has the right to judge and execute criminals for crimes against the community (ST II-II, Q.64, A.3; ST II-II, Q.67). A private individual usurping this role commits the sin of murder.
      *   **Application to Tyranny:** While the tyrant forfeits his authority *over the community*, this does *not* automatically transfer the right of judgment and execution to *every private citizen*. The tyrant remains a *public figure* who has committed public crimes. His removal and punishment require *public action*.
      *   **Aquinas's Explicit Rejection of Private Tyrannicide:** In ST II-II, Q.64, A.3, while discussing the permissibility of killing in self-defense, Aquinas addresses the tyrant:
          > "It is *not* lawful for a man to intend killing another in self-defense, *except* for those who have public authority*, who, *while intending to kill a man in self-defense*, refer this to the public good..."
          He contrasts this with killing a private evildoer, implying the tyrant falls under the purview of public authority. Killing a tyrant premeditatedly, as an act of private judgment, is murder.

  5.  **Permissible Resistance: Conditions and Forms:**
      Aquinas *does* endorse resistance, but under specific conditions and forms:
      *   **Public Authority:** The primary licit agent for deposing or punishing a tyrant is a *superior public authority* (e.g., the Pope over a Christian prince, an Emperor over a king, or the community itself acting through its legitimate representatives/mechanisms as originally constituted - *De Regno*, I, 6). This authority acts for the common good.
      *   **Non-Obedience:** Subjects are *not* bound to obey tyrannical commands that are sinful or contrary to the common good (ST I-II, Q.96, A.4).
      *   **Removal by the Community:** Aquinas explicitly states that if a ruler becomes tyrannical, it is *not seditious* for the community to depose him, as he is the true seditious one acting against the unity of the common good (ST II-II, Q.42, A.2, ad 3). This action, however, implies a *public* act of the community (or its representatives), not private vigilantism.
      *   **Private Self-Defense (Limited Scope):** The *only* context where Aquinas allows a private individual to kill is in *immediate, necessary self-defense* against an unjust aggressor (ST II-II, Q.64, A.7). This is a universal principle:
          *   The killing must be an unintended side-effect of defending oneself or others.
          *   The force used must be proportionate and necessary *in the moment*.
          *   **Applied to a Tyrant:** If a tyrant personally attacks a citizen *in that moment* (e.g., tries to murder them on the spot), the citizen could licitly use lethal force in immediate self-defense, just as against any other unjust aggressor. This is *not* the same as plotting or carrying out an assassination because the ruler *is* a tyrant. It's a reaction to an imminent, personal threat.

  **Conclusion and Key Distinction from Mariana:**

  *   Aquinas **affirms:** Tyrants forfeit legitimate authority by ruling for private gain, becoming public criminals. The community (acting publicly) has the right and duty to depose them. Private citizens need not obey unjust commands.
  *   Aquinas **denies:** That this forfeiture grants *any private individual* the general license to assassinate the tyrant as an act of public justice. Such an act usurps the proper role of public authority and constitutes murder.
  *   **The Condition for Private Lethal Action:** *Only* in the context of **immediate, necessary self-defense** against a direct, personal, unjust attack by the tyrant (or his agent), where lethal force is the unintended but unavoidable consequence of stopping that attack.
  *   **Mariana Contrast:** Juan de Mariana, SJ, writing centuries later in a different political context (post-Absolutism, post-Reformation), *explicitly argued* for the permissibility of private tyrannicide under certain conditions (*De Rege et Regis Institutione*, 1599). He placed more emphasis on the tyrant as a public enemy whom any citizen could licitly kill *as an act of public defense*, drawing on Aquinas but significantly extending the argument beyond Aquinas's clear restrictions on private judgment and action. Aquinas provides a foundation Mariana built upon, but Aquinas himself did not endorse the general private license.

  **For Your Seminar:** Emphasize Aquinas's crucial distinction between the *forfeiture of legitimacy* (which he affirms) and the *license for private tyrannicide* (which he explicitly denies, limiting private action to immediate self-defense). His solution focuses on the community acting *publicly* or through superior authority. The key texts are ST II-II, Q.42, A.2, ad 3; ST II-II, Q.64, A.3 & A.7; and *De Regno*, I, 3-7.
