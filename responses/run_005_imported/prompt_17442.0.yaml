  I need to pick the best counter for NU. The Very Repugnant Conclusion fits well—CU would prefer a vast population with lives barely worth living over a smaller, happier one. That mirrors the repugnance of world-destruction. Then torture vs. dust specks could be another point: CU would allow immense torture if outweighed by minor pleasures for many, which NU finds abhorrent.

