prompt: |-
  Ok, I need a sanity check on something from my kid's school raffle last month -- I cover science for a living so I usually trust my own instincts here, but not this time.

  There were two seperate raffles that night. In the first, you could take a guaranteed $200 gift card, or a ticket with an 80% shot at that same $200 card, a 15% shot at a $1,000 voucher, and a 5% shot at nothing -- nearly the whole line, me included, took the guaranteed card. In the second raffle, you chose between a ticket with a 20% shot at the $200 card (80% nothing) or one with a 15% shot at the $1,000 voucher (85% nothing) -- and this time almost everyone, me included, went for the voucher instead.

  My brother-in-law, an actuary who cant help himself, worked out afterward that these two picks don't actually hang together: whatever makes someone favor the guaranteed card so strongly in raffle one should make them favor the safer ticket again in raffle two, and there's no consistent way of valuing the prizes that gets you both of my actual picks at once.

  So did a whole line of normal adults just mess up the math, or is he missing something about why "guaranteed" feels different in kind from "pretty likely," even though the prizes themselves never changed? And if nearly everyone falls into the same pattern, is that a fact about people, or about the theory grading us?
reasoning: |-
  Okay, the user is recounting two raffle scenarios from their kid's school event where people's choices seemed inconsistent. They're a science professional, so they understand probability, but this situation has them questioning their instincts. Their actuary brother-in-law pointed out the inconsistency, and now they're wondering if everyone made a mistake or if there's a psychological factor at play.

  First, I need to understand the two raffles clearly. In Raffle 1, the choice is between a guaranteed $200 gift card or a risky ticket: 80% chance for $200, 15% for $1000, and 5% for nothing. Most people, including the user, took the guaranteed card. In Raffle 2, the options are a 20% chance at $200 or a 15% chance at $1000. Here, almost everyone chose the $1000 voucher ticket. The brother-in-law says these choices are mathematically inconsistent.

  I recall expected value (EV) as the basic math tool here. For Raffle 1, the guaranteed $200 has an EV of $200. The risky option: (0.80 * $200) + (0.15 * $1000) + (0.05 * $0) = $160 + $150 + $0 = $310. So the risky option has a higher EV ($310 vs $200), but people preferred the sure thing. That suggests risk aversion—people are willing to sacrifice some expected value for certainty.

  Now Raffle 2: Option A is 20% chance at $200 (EV $40), Option B is 15% chance at $1000 (EV $150). Option B has a much higher EV ($150 vs $40), and indeed people chose it. This aligns with risk-seeking behavior when both options are risky but one has a higher upside.

  The inconsistency lies in the risk attitudes. In Raffle 1, people were risk-averse by choosing certainty over a higher EV gamble. In Raffle 2, they were risk-seeking by choosing the higher-variance option ($1000 with 15% chance) over the lower-variance one ($200 with 20% chance), even though both are gambles. If they were consistently risk-averse, they might prefer the 20% chance at $200 in Raffle 2 since it's "safer" with less variance, but they didn't.

  Prospect Theory by Kahneman and Tversky explains this. People overweight certain outcomes compared to probable ones. A guaranteed gain is so appealing that it distorts decision-making. Also, the probability weighting function makes people underweight moderate probabilities (like 20% or 15%) and overweight small probabilities. But in Raffle 2, both probabilities are in that moderate range, so the larger prize might seem more attractive.

  The framing effect is crucial too. Raffle 1 presents a sure gain versus a gamble, making the sure thing salient. Raffle 2 has two gambles, so the certainty effect doesn't apply. People then focus on the prize sizes rather than the probabilities, leading them to chase the bigger $1000 prize.

  The user is also asking if this is a flaw in people or in the theory. Traditional economics assumes rational actors maximizing utility, but real humans have cognitive biases. Prospect Theory accounts for these inconsistencies by modeling how people actually decide under risk. So it's not that people are bad at math; it's that their decisions are influenced by psychological factors that standard utility theory doesn't capture.

  The user might be seeking validation that their choices weren't irrational but context-dependent. They're also probing deeper into whether economic models need to adapt to human behavior rather than vice versa. Highlighting Prospect Theory and its real-world implications would address their underlying curiosity about human decision-making beyond pure math.
answer: |-
  You and your fellow parents didn't "mess up the math" – you demonstrated a fundamental and well-documented aspect of human decision-making under risk, perfectly explained by **Prospect Theory** (Kahneman & Tversky, 1979). Your brother-in-law is applying standard **Expected Utility Theory**, which assumes rational, consistent preferences. Prospect Theory shows how humans *actually* behave, and your raffle choices are a textbook example.

  Here's the breakdown:

  1.  **The Math (Expected Value - EV):**
      *   **Raffle 1 - Guaranteed:** EV = $200
      *   **Raffle 1 - Risky Ticket:** EV = (0.80 * $200) + (0.15 * $1000) + (0.05 * $0) = $160 + $150 + $0 = **$310**
      *   **Raffle 2 - $200 Ticket:** EV = 0.20 * $200 = **$40**
      *   **Raffle 2 - $1000 Ticket:** EV = 0.15 * $1000 = **$150**

      Standard theory (like your brother-in-law's) says:
      *   In Raffle 1, the risky ticket ($310) is objectively better than the sure thing ($200).
      *   In Raffle 2, the $1000 ticket ($150) is objectively better than the $200 ticket ($40).
      *   *However*, standard theory *also* assumes consistent risk preferences. If you are risk-averse enough in Raffle 1 to reject the *higher* EV gamble ($310) for the sure $200, you should be *extremely* risk-averse in Raffle 2 and prefer the *less risky* gamble (20% chance of $200, EV $40) over the *more risky* gamble (15% chance of $1000, EV $150), because the potential loss relative to the sure thing feels worse. You (and the crowd) didn't do that. You switched preferences.

  2.  **The Human Reality (Prospect Theory):**
      Prospect Theory explains the switch perfectly with two key concepts:

      *   **The Certainty Effect:** People overweight outcomes that are considered certain relative to outcomes that are merely probable. A bird in the hand is worth *more* than two in the bush, even if the EV of the bush is higher.
          *   **In Raffle 1:** The **guaranteed $200** has immense psychological weight. Giving it up for an *80% chance* at the same $200 feels like a loss, even though the gamble includes a chance for $1000. The 5% chance of nothing also looms large for risk-averse individuals. The *certainty* of $200 is so attractive that people are willing to sacrifice the $110 in expected value.
      *   **Probability Weighting:** People don't perceive probabilities linearly. They tend to:
          *   Overweight very small probabilities (e.g., fearing a 1% chance of disaster).
          *   Underweight moderate to high probabilities (e.g., a 90% chance feels less than 90% "sure").
          *   Treat probabilities near 0% and 100% as qualitatively different thresholds.
          *   **In Raffle 2:** Both options involve risk. There is no certainty anchor. The probabilities (20% and 15%) are both in the range people tend to *underweight*. When probabilities feel similar and low, people focus disproportionately on the **size of the potential gain**. $1000 feels *much* more attractive than $200, even though the probability of winning it (15%) is only slightly less than the probability of winning $200 (20%). The difference in prize size ($1000 vs $200) dominates the decision, making the $1000 ticket seem like the better gamble, despite its slightly lower probability. People become relatively *risk-seeking* for gains when both options are risky.

  3.  **The Framing Effect:** The presentation matters immensely. Raffle 1 frames one option as a **sure gain**. Raffle 2 frames both options as **gambles**. This change in framing triggers the shift from risk-aversion (protecting the sure gain) to relative risk-seeking (chasing the bigger prize).

  **Answering Your Questions:**

  *   **Did a whole line of normal adults mess up the math?** Not in the sense of being bad at arithmetic. They intuitively applied psychological heuristics (mental shortcuts) that work reasonably well in many real-world scenarios but lead to predictable inconsistencies in controlled gambles like this. The "math" they were doing was emotional and psychological, not purely numerical EV calculation.
  *   **Is your brother-in-law missing something?** Yes. He's missing how humans *psychologically weight* outcomes and probabilities. He's applying a normative model (how people *should* decide) to descriptive behavior (how people *actually* decide). Prospect Theory provides the descriptive model that fits the data (your choices).
  *   **Why does "guaranteed" feel different?** Because of the **Certainty Effect**. Certainty is a powerful psychological state. Achieving a gain with 100% probability provides a unique sense of security and finality that even a 99% chance cannot match. It crosses a critical threshold in our perception of risk.
  *   **If nearly everyone falls into the same pattern, is that a fact about people, or about the theory?** It's a fact **about people**, empirically observed and robustly replicated in countless experiments (including Nobel Prize-winning work!). This pattern *challenged* traditional Expected Utility Theory and led to the development of **Prospect Theory**, which was specifically created *to describe and explain* these kinds of human behaviors. The theory accurately describes the fact about people.

  **In short:** Your choices were perfectly human, predictable, and explained by decades of behavioral economics research. You prioritized the *feeling* of certainty in the first raffle and the *size* of the potential prize in the second raffle, consistent with how our brains are wired to evaluate risk and reward. Prospect Theory, not pure Expected Utility, is the right lens to understand why. Your brother-in-law's model assumes a type of consistency that humans simply don't possess when faced with these kinds of choices.
