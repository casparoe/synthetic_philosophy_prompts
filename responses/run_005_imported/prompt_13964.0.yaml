answer: |-
  Your argument is sharp and raises a crucial methodological challenge for structural realism (SR). Let's break down your two questions:

  ### 1. Is your characterization of Worrall's argument fair? Does SR *need* inductive support?

  **Yes, your characterization is largely fair, but SR proponents might argue for a more nuanced foundation.**

  *   **Worrall's Core Move:** Worrall's original argument *is* heavily reliant on paradigmatic cases like Fresnel-Maxwell (and perhaps Newton-Einstein as limiting cases). His goal was to *explain* the apparent continuity in scientific success *despite* ontological rupture. The Fresnel case is presented as *exemplary*, demonstrating *how* continuity is possible. It's not initially presented as a statistical induction.
  *   **The Inductive Leap You Identify:** You are absolutely right, however, that for SR to serve as a *general defense* against the Pessimistic Meta-Induction (PMI), the claim that "structure typically/usually/reliably survives" *must* go beyond these showcase examples. To counter Laudan's list (which implies structural rupture *is possible*), SR needs to show that structural continuity is the *norm*, not the exception. To establish this normativity, **an inductive generalization over a broader historical record *is* required.** Worrall didn't provide this survey, and subsequent SR proponents haven't systematically done it for Laudan's entire list either (though some have examined other cases).
  *   **Alternative SR Foundations (Do they avoid induction?):** Some SR proponents try to ground the primacy of structure less inductively:
      *   **Explanatory Necessity:** Structure survives *because* it's what truly explains the success. The mathematical relations are the "working part" of the theory responsible for predictions. Ontology is often the disposable scaffolding used to *formulate* or *visualize* that structure. (But this still needs *evidence* that the structure *does* the explaining, which brings us back to history).
      *   **Epistemic Priority:** We can only have epistemic access to the *structural* aspects of unobservables (relations, dependencies) via their effects, not to their intrinsic natures. Therefore, commitment should only be to structure. (This is more epistemic SR à la Ladyman, and might downplay the historical continuity claim, focusing instead on what we *can* know).
      *   **Pessimistic Meta-Induction *for Structure*:** Some SR versions (e.g., "epistemic" SR) might concede that *all* theoretical content (including structure) is fallible, but argue that structural commitments are *more resilient* or *less likely to be completely abandoned* than ontological ones. This still implicitly relies on historical patterns suggesting structure has a better survival rate.
  *   **Conclusion on Fairness:** Your critique is fair *for Worrall's original argument and its common deployment as a shield against PMI.* To function as a robust response to PMI, SR *does* implicitly rely on the claim that structural continuity is historically prevalent. Worrall's examples are offered as *proof of concept*, but defending against the *generalization* in PMI requires showing this concept applies broadly. **Without a broader historical survey, the claim that "structure survives *in general*" is indeed an under-supported inductive leap based on favorable cases.** You've correctly identified a significant gap in the argument as commonly presented.

  ### 2. Does the reference-class objection flatten Laudan's list too? Is it specific to SR?

  **The objection applies generally, but it bites *differently* and arguably *harder* against Worrall/SR than against Laudan's original PMI.**

  *   **The General Problem:** You are correct that *any* argument based on historical case studies faces the challenge of selecting a representative reference class. This is a fundamental methodological issue in using history for philosophy of science.
  *   **Why it's (Perhaps) Less Damaging for Laudan:**
      *   **Goal of PMI:** Laudan's PMI isn't trying to establish a precise *failure rate*. Its goal is **undermining an inference.** Realists argue: "Success is a reliable indicator of truth (approximate truth, referential success)." Laudan counters: "Here are numerous clear counterexamples to that inference rule. Therefore, success *cannot be a reliable indicator* in the strong sense the realist needs." He only needs enough counterexamples to **falsify the realist's proposed reliability.**
      *   **Burden of Proof:** The realist is making a positive claim about the link between success and truth. Laudan is providing counterevidence to that specific claim. His list, even if not exhaustive, demonstrates that the realist's inference *can* and *has* gone wrong multiple times. The onus is then on the realist to explain why *this time* is different or why the inference is still reliable *despite* these failures.
      *   **Plausibility of the Sample:** While Laudan's list might be selective, the theories he cites (phlogiston, caloric, ether, etc.) *are* widely acknowledged, paradigm examples of once-successful, now-rejected theories. It's hard to argue they aren't relevant counterexamples. He doesn't need to prove *all* past theories failed, just that *enough significant ones did* to cast doubt on the reliability of the success-to-truth inference.
  *   **Why it Bites Harder Against Worrall/SR:**
      *   **Goal of SR Reply:** Worrall/SR is making a **positive claim** about what *persists* (structure) and, by implication, what we should be realist *about*. To *defeat* the PMI, SR needs to show that structural continuity is the *typical* or *reliable* outcome when successful theories are superseded. It needs to establish a *pattern* of survival.
      *   **Need for Generalization:** Unlike Laudan who only needs counterexamples, SR needs to support a generalization *about survival*. Showing it happened in one (or a few) famous cases (Fresnel) isn't enough. It needs evidence that it happens *frequently* or *reliably enough* to warrant realist commitment to structure *despite* ontological losses. **This positive generalization *demands* a broader, more representative historical survey.**
      *   **Vulnerability to Counterexamples:** If someone could point to cases on Laudan's list (or elsewhere) where *not only the ontology but also the core mathematical structure was completely abandoned and not recovered as a limit*, it would directly challenge SR's core claim. Worrall's reliance on Fresnel makes SR potentially vulnerable to the discovery that Fresnel was an *exception*, not the rule. Laudan's argument is *strengthened* by finding more failures; SR is *weakened* by finding more structural ruptures.
  *   **Conclusion on Specificity:** The reference-class problem is general, but its impact is asymmetric. **Laudan can achieve his limited goal (undermining the realist's inference) with a strategically selected list of clear counterexamples.** **Worrall/SR, aiming to establish a positive pattern of persistence to *restore* a specific form of realism, requires a more robust and representative historical basis to support its generalization about structural survival.** Your critique highlights that SR hasn't met this burden, leaving its defense against PMI incomplete.

  **Your Overall Argument's Strength:**

  You've made a compelling case:

  1.  **Concession:** SR concedes ontological losses (PMI's point).
  2.  **Shift:** It shifts realist commitment to structure.
  3.  **Evidential Gap:** Its evidence for structural persistence relies heavily on a few favorable cases.
  4.  **Inductive Problem:** To justify *realism about structure* as a general response to PMI, it needs to show persistence is the *norm*, requiring a broader historical induction.
  5.  **Unsupported Generalization:** This broader induction hasn't been performed systematically, making the claim that "structure survives" itself vulnerable to the same kind of base-rate/selection-bias worry that plagues historical arguments.
  6.  **Demotion, not Blockade:** Therefore, SR doesn't block PMI; it merely demotes it from ontology to structure, leaving a question ("Will our *structure* survive?") that the historical record hasn't been adequately surveyed to answer confidently.

  **Recommendations for Your Paper:**

  *   **Refine the "Demotion" Point:** Emphasize that SR successfully *reframes* the realist commitment, but doesn't *eliminate* the historical challenge posed by PMI. The challenge is transformed but not dissolved.
  *   **Acknowledge the General Issue, But Focus:** Briefly acknowledge the general problem of historical case selection, but then argue forcefully why it's *particularly problematic for SR's positive project* compared to Laudan's negative one, using the points above (burden of proof, need for generalization).
  *   **Clarify SR's Need:** Be precise: Worrall's *illustration* of structural continuity doesn't strictly need induction, but using this continuity as the *basis for a realist commitment resilient against PMI* absolutely *does* require inductive support for its generality.
  *   **Potential SR Response:** Consider briefly addressing how an SR proponent *might* respond. Could they argue that cases of *complete* structural rupture are rare or involve theories that weren't *genuinely* successful in the required way (launching a "divide et impera" move *for structure*)? Acknowledging and rebutting this strengthens your case.
  *   **Conclusion:** Frame your critique not as destroying SR, but as showing it hasn't *yet* fully answered PMI. It opens a crucial research question for SR proponents: systematically investigating the survival rate of mathematical structures across theory changes on Laudan's list and beyond.

  Your argument is insightful and well-targeted. It identifies a genuine methodological weakness in how structural realism is often deployed against the pessimistic meta-induction. Good luck with the paper!
