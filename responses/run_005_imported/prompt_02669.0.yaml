answer: |-
  Here's a concrete counterexample with a specific joint distribution for three voters, each correct with 60% probability, but majority vote accuracy below 60%:

  ### Joint Distribution (True State = 1)
  | Voter A | Voter B | Voter C | Probability |
  |---------|---------|---------|-------------|
  | Correct (1) | Correct (1) | Correct (1) | 0.50        |
  | Correct (1) | Wrong (0)   | Wrong (0)   | 0.10        |
  | Wrong (0)   | Correct (1) | Wrong (0)   | 0.10        |
  | Wrong (0)   | Wrong (0)   | Correct (1) | 0.10        |
  | Wrong (0)   | Wrong (0)   | Wrong (0)   | 0.20        |

  ### Verification of Marginals
  - **P(A correct)** = 0.50 (all correct) + 0.10 (A correct, others wrong) = 0.60
  - **P(B correct)** = 0.50 + 0.10 = 0.60
  - **P(C correct)** = 0.50 + 0.10 = 0.60

  ### Majority Vote Accuracy
  - Majority correct **only** in the first row (all correct): **0.50**
  - All other cases have ≤1 correct vote → majority wrong: 0.10 + 0.10 + 0.10 + 0.20 = 0.50  
  → **Majority accuracy = 50%** (<60%)

  ---

  ### Why This Violates Condorcet Jury Theorem (CJT)
  1. **Independence Assumption Violated**:  
     CJT requires voters' correctness to be *independent* given the state. Here:
     - P(A correct, B correct) = 0.50  
       (only all-correct case)
     - If independent: P(A correct) × P(B correct) = 0.60 × 0.60 = 0.36 ≠ 0.50  
     → **Strong positive correlation**: Voters tend to be correct/wrong together.

  2. **Correlation Structure Flips the Result**:  
     - **High consensus when correct**: 50% probability all agree (correct).  
     - **Fragmented errors**: 30% probability exactly one voter is correct (but majority still fails).  
     - **High collective failure**: 20% probability all wrong.  
     → Majority succeeds *only* when all agree (50%), while independent voters would have >60% majority accuracy.

  ### Why This Isn't Just "Slowed Convergence"
  - CJT under independence: Majority accuracy **increases monotonically** with group size (e.g., 3 voters: 64.8% > 60%).  
  - Here, correlation **reverses the benefit**:  
    - Individual accuracy: 60%  
    - Majority accuracy: 50% (<60%)  
    → Group performs *worse* than individuals.  
  - Key: Correlation concentrates errors in ways that **systematically undermine majority coalitions**.  

  ### Intuition
  - Voters are "herding" on the same information (even when wrong).  
  - When truth is obscure (20% all wrong), no voter has unique insight.  
  - Isolated correct voters (30% of cases) are "outvoted" by the majority.  
  → **Wisdom of crowds fails when diversity of perspectives is low**.  

  This demonstrates that CJT's independence assumption is not just a technicality—it's essential for the "more voters → better truth-tracking" guarantee. Correlations can create systematic error patterns that make groups *less* reliable than individuals.
