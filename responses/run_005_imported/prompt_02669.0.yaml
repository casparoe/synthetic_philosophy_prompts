  ok this has been bugging me. People in the forecasting/prediction-market and epistemic-democracy crowd love citing the Condorcet Jury Theorem like it just straightforwardly implies "pool more independent-ish opinions and you get closer to the truth, basically always." I want an actual counterexample to the naive version of that -- not hand-wavy "errors are correlated in real life" stuff, but a concrete toy model: give me a specific joint distribution over 3 voters correctness where each voter is individually right 60% of the time (marginals should work out to 0.6 each), but a majority vote across the three is right *less* than 60% of the time. Then explain which premise of the theorem is actually violated, and why that particular flavor of correlation flips the result instead of just slowing down the march to certainty.
