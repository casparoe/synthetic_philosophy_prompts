  I should compare both theories' handling of omissions. Dowe's strength is in physical processes but fails with absences. Lewis's strength is in handling omissions but overcounts causes. Neither has a perfect solution. The user's analogy of "papering over cracks" is apt—each theory fixes one problem but creates another. 

  Is there a principled way to draw the line? Dowe's distinction between cause and explanation is principled but may feel inadequate. Lewis's contextual approach relies on pragmatics, which isn't as rigorous. The user might wonder if combining both theories or a different approach (like process theory or difference-making) could help. But based on their query, they want an evaluation of these two. 

