  First, I need to recall Dowe's conserved quantity theory. It requires a physical connection via conserved quantities. Omissions don't involve such transfers, so they're not causes. But we do attribute causation to omissions in everyday language. Dowe might suggest that omissions are explanations rather than causes, but this feels like a workaround. The user, coming from physics, might find this unsatisfying because it dismisses their intuitive examples.

  Then there's Lewis's counterfactual theory. It defines causation based on counterfactual dependence: if the cause hadn't happened, the effect wouldn't have. For omissions, this works—if you watered the plant, it wouldn't die. But the problem is the proliferation of causes. If every person who didn't water the plant is a cause, that's counterintuitive. Lewis addresses this with context and causal chains, but it's messy. The user's example of the mailman not watering the plant highlights this issue. Lewis's solution involves pragmatics, but it's not a clear-cut principle.

