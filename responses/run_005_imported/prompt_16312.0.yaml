answer: |-
  That's an excellent distillation of the core tension! You've perfectly nailed the Achilles' heel of both major theories of causation when it comes to omissions. Let's break down how Dowe's conserved quantity theory and Lewis's counterfactual theory handle (or fail to handle) cases like your wilting ficus, and whether either truly solves the problem.

  **1. Phil Dowe's Conserved Quantity Theory (CQT):**

  *   **Core Principle:** Causation requires a *physical connection* via the exchange or flow of a conserved quantity (like energy, momentum, charge) between cause-event and effect-event. There must be a spatiotemporally continuous process linking them, marked by this transfer.
  *   **Problem with Omissions:** This is fundamental. An omission (the drought, your not-watering) is the *absence* of an event/process. There is *nothing* to transfer a conserved quantity *from*. The drought isn't a physical entity emitting "negative energy" absorbed by the crops. Your failure to pick up the watering can doesn't send "absence particles" to the ficus.
  *   **CQT's Response (The "No Causation Here" Stance):**
      *   Dowe explicitly argues that omissions are *not causes* in the strict, physical sense he defines. Calling the drought the "cause" of the crop failure is a loose, pragmatic, or explanatory way of speaking, not a description of a genuine causal process in the world.
      *   What *is* causally responsible, according to CQT, are the *positive physical processes* enabled by the absence. The *lack of water input* allows the *positive physical process* of water evaporating from the soil and transpiring from the plants, driven by solar energy, to proceed unchecked. This continuous process of water loss *does* involve the transfer of conserved quantities (water molecules, thermal energy) and *directly* causes the plant's dehydration and death.
      *   **Strengths:** Maintains a clear, objective, physical criterion grounded in scientific practice. Avoids the problem of causal overdetermination (every non-waterer being a cause) because omissions aren't causes. Respects the intuition that the physical process (dehydration) is the real mechanism.
  *   **Weaknesses/Drawbacks:**
      *   **Intuition Deficit:** It starkly contradicts strong everyday and legal intuitions. We *do* hold people responsible for failing to act (negligence), blame droughts for famines, and say "your forgetting *caused* the plant to die." Dowe dismisses this as merely "causal explanation," but this feels like a significant concession.
      *   **The "What If?" Problem:** It struggles to explain why *this specific omission* is explanatorily relevant. Why focus on *your* failure to water rather than the failure of rain clouds to form? CQT points to the actual physical process (dehydration), but doesn't provide a principled reason within the theory for why *your specific omission* is the salient explanatory factor over any other necessary condition that was absent (e.g., the mailman's failure).
      *   **Papering Over?** It doesn't so much "paper over" the omission crack as *wall it off* and declare it a different room ("explanation," not "causation"). While principled (based on physical transfer), it arguably dismisses a significant aspect of how we conceptualize causation.

  **2. David Lewis's Counterfactual Theory (CT):**

  *   **Core Principle (Simplified):** Event C causes event E iff E *counterfactually depends* on C: If C had not occurred, then E would not have occurred (in the specific context). Causation is often a chain of such dependencies.
  *   **Handling Omissions (The "Apparent Victory"):** CT seems tailor-made for omissions. Your neighbor's ficus died (E). Consider your not-watering (C). The counterfactual holds: "If you *had* watered the ficus (i.e., if C had not occurred - if you hadn't *not*-watered), then it would not have died." Therefore, your not-watering caused its death. Simple!
  *   **Problem: Proliferation of Causes (The "Victory Pyrrhus"):** As you point out, the counterfactual "If X had watered the plant, it wouldn't have died" holds true for *every possible person X who didn't water it*. The mailman, the neighbor's cousin, you, me, the Pope – we *all* become causes of the ficus's death. This is the infamous problem of **causal overdetermination** or **profligate causes**.
  *   **CT's Response (Pragmatics & Context to the Rescue?):**
      *   Lewis (and followers) employ several strategies:
          1.  **Causal Chains:** They argue we typically look for the *most direct* or *proximate* cause in the chain. Your neighbor entrusted *you*, creating a specific duty/expectation. The mailman had no such duty. Your omission is a direct link; others are too remote or irrelevant to the actual chain of events. The counterfactual dependence might hold for the mailman, but it's not part of the salient causal history.
          2.  **Context and Salience:** What counts as "the cause" depends heavily on context and our interests. In the context of your agreement with your neighbor, *your* omission is the salient, relevant cause. The mailman's omission, while true counterfactually, is irrelevant to the practical or explanatory context.
          3.  **Contrastive Focus:** We often mean "C rather than C* caused E rather than E*". "Your *forgetting* (rather than deliberately neglecting) caused the plant's *death* (rather than just wilting)." This contrast can help rule out irrelevant non-actual alternatives.
      *   **Strengths:** Captures the intuitive connection between omissions and outcomes. Aligns well with legal and moral reasoning about responsibility for failures to act. Explains why we focus on *specific* omissions (like yours) in explanation.
  *   **Weaknesses/Drawbacks:**
      *   **Principled Problem:** The strategies above rely heavily on **pragmatics, context, and salience**, not on a *fundamental feature of causation itself* within the theory. CT, strictly applied, *does* make everyone who didn't water a cause. The "line-drawing" (you vs. the mailman) is done *after* the causal fact is established by counterfactual dependence, using external factors like duty, expectation, or explanatory interest. This feels ad hoc *within the causal theory itself*.
      *   **Vagueness:** Determining the "relevant" alternatives in the counterfactual or the "salient" causal chain can be vague and context-dependent, making the theory less objective.
      *   **Preemption Issues:** While CT handles many cases well, omissions add a layer of complexity to preemption scenarios (e.g., if both you and the mailman *could* have watered, but only one needed to act to save it – who caused the death if neither did? CT struggles even more).
      *   **Papering Over?** CT *embraces* omissions as causes but then uses pragmatic tools to *cover up* the embarrassing proliferation of causes it generates. The "crack" (overcounting) is real within the core theory; the pragmatics are the wallpaper.

  **The Verdict: Drawing the Line or Papering Over?**

  *   **Dowe (CQT):** Has a genuinely **principled line**: Physical transfer of conserved quantity = Cause. No transfer = Not a cause (though maybe an explanatory factor). The line is sharp, objective, and based on the theory's core commitment. However, this line *excludes* omissions entirely, which many find deeply unsatisfying as it clashes with strong intuitions and practical reasoning. It doesn't paper over; it builds a wall and ignores the other side.
  *   **Lewis (CT):** **Lacks a genuinely principled line *within the core theory* for omissions.** The counterfactual criterion *itself* makes every non-preventer a cause. Avoiding absurdity requires **importing pragmatic considerations** (duty, expectation, salience, context) *after the fact* to filter the vast set of counterfactual causes down to the ones we care about. This *is* papering over the crack of profligate causes. The line-drawing isn't derived from the theory of causation itself but from external factors about explanation and responsibility.

  **Conclusion:**

  You're absolutely right to sense that both theories struggle profoundly with omissions, just in different ways and with different coping mechanisms.

  *   **Dowe** sacrifices intuitive "omission causation" entirely to preserve a clean, physicalist, objective account. His line is principled but arguably drawn in the wrong place for capturing how we actually use causal language and assign responsibility.
  *   **Lewis** embraces intuitive omission causation but at the cost of generating an absurdly vast set of causes, requiring significant pragmatic cleanup to be usable. His theory *lacks* a principled internal mechanism for drawing the necessary line between salient omissions (yours) and irrelevant ones (the mailman's, the Pope's).

  **Neither theory offers a fully satisfying, principled solution to the problem of omissions.** Dowe's principled exclusion feels too restrictive; Lewis's inclusive core theory requires unprincipled pragmatic constraints to avoid absurdity. The "crack" of omissions reveals a fundamental tension between a purely physical process view of causation and the explanatory/practical role causation plays in human reasoning involving absences and responsibilities. Later theories (like process theories incorporating "negative events" or difference-making theories with heavy constraints) try to bridge this gap, but the core tension you've identified remains a central challenge in the philosophy of causation. Your physicist's intuition about the physicality of "cause" highlights precisely why omissions are so philosophically vexing!
