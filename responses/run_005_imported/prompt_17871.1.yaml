  First, the user is deep into research but struggling with English sources that lean Jesuit. They want both sides presented fairly without caricatures. The Jesuit needs to explain scientia media and counterfactuals of freedom, while the Dominican should raise the grounding objection. The Dominican must then defend physical premotion against charges of determinism. 

  Hmm, the key challenges are: 1) Avoiding oversimplifications ("Jesuits=free will, Dominicans=predestination") 2) Making complex theology sound like natural debate 3) Keeping both characters intellectually honest to their schools. 

  The user's phrase "arguing like two people who have each spent years with the other's books" is crucial. This can't be Theology 101 - it needs the shorthand and nuanced jabs of scholars who know each other's work intimately. 

  For the Jesuit's part, I should emphasize how scientia media functions as a logical category between possibility and actuality. The counterfactual point is tricky - must show God consulting these "what if" scenarios before creation. The Dominican's grounding objection needs to hit hard: "What makes these truths true before creation exists?" 

  Then the flip side: when the Jesuit challenges physical premotion, I need the Dominican to explain how God's motion supposedly respects the will's nature while still ensuring outcomes. The tension must remain unresolved - no knockout blows. 

  The setting helps: a nighttime corridor before their testimony raises stakes. Physical details (candlelight, echoing footsteps) should underscore the intellectual shadows they're wrestling with. 

  Biggest risk is letting one side "win." Must constantly check balance: when the Jesuit explains scientia media, immediately have the Dominican poke the weak spot. When the Dominican defends premotion, show the Jesuit's skepticism. 

  Theology notes to include: Molina's Concordia distinction between natural/middle/free knowledge; Bañezian "physical premotion" vs Jesuit "simultaneous concurrence"; the unresolved historical outcome should hover over the scene. 

  Final thought: The user wants readers familiar with the debate to feel both sides got their best arguments out. That means no straw men - every objection should be what real Scholastics would actually say.
answer: |-
  Here’s a draft of that corridor confrontation, balancing theological rigor with human tension:

  **Setting:** A shadowed corridor of the Apostolic Palace, late at night. Oil lamps gutter in wall sconces. FATHER ALESSANDRO VALERIO (Jesuit, late 20s) and FRAY TOMÁS DE SANCTO DOMINGO (Dominican, late 50s) meet unexpectedly, their footsteps echoing on cold stone.

  ---

  **TOMÁS:** (Stopping short, his voice a low rumble) Valerio. Burning midnight oil for tomorrow’s… performance? Or merely lost in God’s labyrinthine decrees?

  **ALESSANDRO:** (Stiffening, then offering a curt nod) Fray Tomás. I seek clarity, not theatrics. Though it seems we both haunt these halls when reasoners sleep. Perhaps the weight of *what is said* presses heavier than *who says it*.

  **TOMÁS:** A weight your *Concordia* seeks to lighten for man, no? Making God’s foreknowledge a spectator to our whims. A dangerous levity.

  **ALESSANDRO:** Spectator? Never. Architect. Molina’s insight—*scientia media*—is the keystone, Fray Tomás. Not mere possibility, which God knows infinitely (*scientia simplicis intelligentiae*). Nor the hardened actuality He decrees (*scientia visionis*). *Between* them lies the *scientia media*: God’s infallible knowledge of what *any* free creature *would* freely choose, *were* it placed in any conceivable circumstance. Not forced, not random. Freely.

  **TOMÁS:** (Taking a step closer, his face half in shadow) Freely? You speak of truths etched in eternity, Valerio. But *what etches them*? Before God decrees creation itself, before Peter is even a gleam in divine thought—you say God knows, with infallible certainty, what Peter *would* freely deny Christ *if* placed before a maid in a Jerusalem courtyard? What *grounds* this ‘would’? What makes this counterfactual… *true*? Is it a ghostly Peter, choosing in some phantom realm? Or is it simply God *decreeing* that this is how Peter *shall* choose? Your ‘middle’ knowledge seems suspended over an abyss. Without God’s decree, what *is* there to know?

  **ALESSANDRO:** (His eyes intense, leaning in) The truth of the *hypothetical itself*, Fray Tomás! The truth of the *proposition*: *If Peter were in circumstance C, he would freely choose A*. God knows *all* truths, necessary *and* contingent. This is a contingent truth—not necessary like mathematics—but true nonetheless, grounded in the *possible free nature* God Himself conceives. Before decreeing Peter *exists*, God knows perfectly what *that specific possible nature*, placed in *that specific possible circumstance*, *would* freely do. He consults *that* knowledge—sees the landscape of all possible free responses—*then* decrees which world, which circumstances, to actualize. Thus, Peter’s denial is truly free, yet infallibly foreseen. Grace moves, but does not compel the will.

  **TOMÁS:** (A sharp, dry chuckle) Compel? You charge us Dominicans with compulsion? Listen well, young man. Bañez taught us: God is *Pure Act*. Creation is *radical dependency*. The will is moved *first* by God, or it is not moved at all. But we do not say He moves it *violently*! He moves it *physically*—yes, *praemotio physica*—but *secundum modum naturae suae*, according to its own nature! He moves the stone to fall *as a stone*, the fire to burn *as fire*, and the free will to choose *freely*, according to its own inclination! He *causes* the free choice itself!

  **ALESSANDRO:** (Voice tight with controlled frustration) Causation! There’s the rub, Fray Tomás! If God *causes* the specific free choice itself—this ‘physical premotion’ determining *which* good the will shall incline towards *in this precise instance*—is it truly free *from* divine determination? You say ‘according to its nature,’ but if the premotion infallibly secures the *specific* choice Peter makes in that courtyard, is this not merely… predestination wearing a gentler name? Does Peter’s nature *truly* have the power for contrary choice *in that moment*, or is it a nature *moved* to one outcome alone? Your ‘freedom’ seems confined to the *mode* of reception, not the *origin* of the act.

  **TOMÁS:** (Eyes flashing) And your freedom, Father Valerio, seems to make God a gambler, peering into a crystal ball of *would-be’s* He did not author! Where does this certainty of your ‘counterfactuals’ come from, if not from the very decree you wish to avoid? You place a phantom realm of ‘truths’ outside God’s causality! Is God sovereign over *truth itself*, or is He bound by the whims of possible creatures? We affirm God moves the will *as* free. Its freedom lies precisely in being moved *to act freely*, not coerced. The *certainty* of Peter’s denial comes not from a ‘would-be’ God observes helplessly, but from God’s efficacious grace moving Peter’s will, *securing* the free choice He wills to bring about. Is that not a *greater* sovereignty? A *truer* dependence?

  **ALESSANDRO:** Greater? Or merely… deterministic? If God *causes* the specific choice, how is Peter not a puppet whose strings you call ‘grace’? Molina preserves God’s sovereignty *in the choosing*—choosing which free creatures to place in which circumstances, knowing infallibly their responses. He governs *through* freedom, not over it.

  **TOMÁS:** And we preserve God’s sovereignty as *First Cause*, without whom *no act*, free or otherwise, *exists*. Your ‘freedom’ floats unanchored. Ours is rooted in the very source of being. *That* is the nature of things.

  **ALESSANDRO:** And *that*… Fray Tomás… is what we must persuade the Cardinals is *not* the death of human freedom. Sleep well. Tomorrow, we argue for the soul’s dignity before God.

  **TOMÁS:** (Turning away, his voice fading down the corridor) We argue, Father Valerio, for God’s unchallenged glory. Dignity lies in being moved by Him. Remember that.

  **(Both men walk off in opposite directions, the corridor swallowing them, the unresolved tension hanging thicker than the night air.)**

  ---

  **Key Elements Achieved:**

  1.  **Beyond Caricature:** Both defend core principles (Jesuit: genuine creaturely freedom & God's non-determining foreknowledge; Dominican: God as sole First Cause & the necessity of efficacious grace) without resorting to slogans.
  2.  **Scientia Media Explained:** Alessandro defines it as a *logical* category between natural knowledge (possibles) and free knowledge (actuals), grounded in true propositions about what possible creatures *would* freely do in possible circumstances. He emphasizes God *consults* this before decreeing creation.
  3.  **Grounding Objection:** Tomás presses hard on what *makes* these counterfactuals true *prior* to God's decree or the creature's existence ("What etches them?"). He forces Alessandro to ground them in the *possible free natures* conceived by God.
  4.  **Premotion Challenge:** Alessandro challenges whether "moving according to nature" is sufficient for freedom if the premotion *infallibly determines the specific choice*. He accuses it of being predetermination relabeled. Tomás counters that God *causes* the free act itself, and freedom lies in the non-coerced *mode* of being moved by the First Cause.
  5.  **No Knockout, No Concession:** Alessandro never wavers on scientia media grounding true freedom. Tomás never wavers on God as the sole source of the *act* of choice. Each exposes what they see as the fatal flaw in the other's system (Phantom truths vs. Divine determinism). The reader familiar with the debate should recognize the core arguments faithfully presented.
  6.  **Human Element:** The tension is palpable – personal stakes (careers, loyalty to mentors/orders), intellectual fervor, the weight of tomorrow's testimony, and the fundamental disagreement about God and humanity's relationship. The corridor setting and late hour enhance the intimacy and pressure.
  7.  **Scholastic Language:** Terms like *scientia simplicis intelligentiae*, *scientia visionis*, *praemotio physica*, *secundum modum naturae suae*, *First Cause*, *contingent truth* are used naturally within the argument, demonstrating deep immersion without being jargon-heavy. The *structure* of the argument is scholastic (defining terms, pressing objections, offering counter-arguments).

  This scene leaves the theological conflict vibrant and unresolved, setting the stage for the formal Congregation debates while giving both men credible, passionate voices grounded in their traditions.
