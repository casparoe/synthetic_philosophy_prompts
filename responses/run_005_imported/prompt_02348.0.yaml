prompt: |-
  Been lurking on rationalist-adjacent blogs/forums for like a decade now and this argument happened at my LW meetup reading group last week and it's been living in my head since. Someone had linked Scott Alexander's "My Left Kidney" post (the one about non-directed kidney donation to a stranger) and it turned into a whole thing between two people, Marcus and Ines, about whether donating a kidney to a stranger is supererogatory or actually obligatory. Trying to reconstruct it fairly:

  1. Marcus: if the expected-value math in that post is even roughly right (small risk to you, years of healthy life for a stranger), then not donating isn't just "failing to go above and beyond" — its straightforwardly wrong, same logic as Singer's drowning child. "Supererogatory" is just a label we invented so we don't have to feel bad about not doing the math.

  2. Ines: says thats too fast. Morality has to leave some agent-centered slack — your own body and risk tolerance have to count for something in your own decisions, or the demands of morality become limitless and eat themselves. If Marcus is right about kidney #1, the same argument runs on kidney #2, bone marrow, a liver lobe, eventually all of it, which is absurd, so something upstream in his reasoning has to give before we get there.

  3. Marcus: ok, but then where's the principled stopping point? Nobody's ever given a non-arbitrary line between "drowning child case, everyone agrees you must act" and "donate all your spare organs, nobody thinks that." A continuum with no defensible cutoff is evidence there's no real obligatory/supererogatory distinction, just vibes dressed up as a category.

  4. Ines: no sharp line doesn't kill the distinction — plenty of real categories are vague at the edges (bald vs. not-bald) without the difference between clear cases being fake. Marcus is basically running a sorites argument, and sorites arguments don't actually prove nobody's bald.

  5. Marcus: fine, granting that — but then she owes an actual answer for the kidney case specifically, since by Scott's numbers it isn't a borderline case, and she's using "vagueness in general" to dodge doing the math on this particular one.

  6. Ines: the math already smuggles in the thing in dispute — that a stranger's marginal welfare and your own bodily risk convert at some fixed exchange rate. Whether they do is exactly the agent-relative-vs-impartial question they're arguing about, so leaning on "just run the numbers" here is question-begging.

  They both dug in and it fizzled out unresolved. Can you go through this round by round and say who's got the better of it at each step (not just an overall winner), and flag anything about supererogation as a concept that you think both of them are missing which would've moved the conversation forward?
reasoning: |-
  Okay, the user has presented a detailed reconstruction of an argument between Marcus and Ines about whether non-directed kidney donation is supererogatory or obligatory. They want me to analyze each round of the debate and identify who has the better argument at each step, while also pointing out any overlooked aspects of supererogation that could have advanced the discussion.

  Let me start by understanding the key positions. Marcus is arguing from a utilitarian perspective, similar to Peter Singer's drowning child analogy—if you can save a life with minimal cost to yourself, it's obligatory. He points to Scott Alexander's calculations showing that the risk to the donor is small compared to the life-years gained by the recipient. Ines counters with an agent-centered view, emphasizing that morality must account for personal autonomy and bodily integrity. She warns of a slippery slope: if donating one kidney is obligatory, why not the second, or other organs?

  Breaking it down round by round: In Round 1, Marcus has a strong point because he's applying a consistent ethical framework (utilitarianism) with concrete numbers. But he might be oversimplifying by ignoring psychological and personal factors. Ines is better in Round 2 because she correctly identifies the slippery slope issue and the need for agent-relative considerations. Marcus's challenge in Round 3 about finding a principled stopping point is valid, but Ines effectively counters in Round 4 by comparing it to sorites paradoxes—vagueness doesn't invalidate categories. Round 5 sees Marcus pushing Ines to address the specific case, but in Round 6, Ines makes a crucial point: the math assumes impartiality, which is the very point in dispute.

  Both are missing deeper aspects of supererogation. For example, the concept isn't just about cost but also about the absence of obligation. Historical perspectives from philosophers like Mellema and Heyd could add nuance. Also, practical factors like systemic issues in organ donation (e.g., opt-in systems vs. opt-out) might influence obligations. Emotional costs and personal projects matter too—donating a kidney isn't as simple as wading into a pond. 

  The user might be seeking not just an analysis but a way to resolve such debates in their community. Highlighting overlooked elements like virtue ethics, societal structures, or the phenomenology of moral praise could provide more tools for future discussions. Emphasizing that both frameworks (impartial and agent-relative) have merits, and the conflict arises from their foundational differences, might help. Also, suggesting that supererogation involves a space for moral excellence beyond duty, which respects personal autonomy while encouraging altruism, could bridge the gap.
answer: |-
  Here's a round-by-round analysis of the Marcus/Ines debate, highlighting strengths, weaknesses, and missed nuances about supererogation:

  **Round 1: Marcus' Initial Claim**
  *   **Marcus' Strength:** Effectively applies Singer's drowning child logic (small cost/large benefit) to kidney donation using Scott's numbers. Forces the question: *If the cost/benefit ratio is this favorable, why isn't it obligatory?* Challenges the psychological comfort of the "supererogatory" label.
  *   **Marcus' Weakness:** Overlooks qualitative differences between actions (wading into a pond vs. invasive surgery/body modification). Assumes the utilitarian calculation is straightforward and morally decisive, ignoring potential agent-relative factors *from the start*.
  *   **Ines' Missed Opportunity (Supererogation Nuance):** Could have noted that supererogation often involves **special sacrifice, risk, or effort beyond mere opportunity cost**. A kidney donation *feels* different than pulling a child from a pond precisely because it involves your body and significant personal risk in a way the pond example doesn't. The "body" factor might be a *principled* reason, not just vibes.
  *   **Verdict:** **Marcus scores a tactical point** by directly applying a powerful, widely accepted analogy to the specific case with numbers. He puts Ines on the defensive.

  **Round 2: Ines' Agent-Centered Slack & Slippery Slope**
  *   **Ines' Strength:** Correctly identifies the core issue - **agent-relative prerogatives** (bodily autonomy, personal risk assessment, life projects). Highlights the **demandingness objection** – a morality demanding constant, escalating sacrifice becomes self-defeating and alienating. The slippery slope argument (kidney#1 -> kidney#2 -> everything) is a valid reductio ad absurdum against Marcus's *unqualified* principle.
  *   **Ines' Weakness:** Doesn't *yet* provide a positive principle for *where* the line is, just points out the problem with Marcus's lack of one. The "absurdity" claim might be dismissed by a hardcore utilitarian.
  *   **Marcus' Missed Opportunity (Supererogation Nuance):** Could have conceded that *some* agent-centered slack exists but argued that kidney donation falls *well within* the bounds of what slack should reasonably allow given the massive benefit/small risk ratio. He treats slack as all-or-nothing.
  *   **Verdict:** **Ines scores a significant point.** She identifies the fundamental philosophical disagreement (impartialism vs. agent-relativity) and effectively uses the slippery slope to show Marcus's position leads to intuitively unacceptable demands. She shifts the burden back.

  **Round 3: Marcus Demands a Principled Stopping Point**
  *   **Marcus' Strength:** Correctly points out that **vagueness doesn't eliminate categories**. Demands Ines provide a *principled distinction* for *this specific case* (kidney donation) rather than just pointing to the slope. Highlights the lack of consensus on where the line falls.
  *   **Marcus' Weakness:** Risks conflating the *existence* of a distinction with the *ease of drawing a precise boundary*. His "evidence there's no real distinction" claim is too strong.
  *   **Ines' Missed Opportunity (Supererogation Nuance):** Could have started sketching a principle: e.g., **core bodily integrity vs. external resources**, **significant risk/life-altering sacrifice vs. minimal cost**, or **maintaining the agent's capacity for a normal range of life projects**. She focuses on defending the *category* rather than applying it.
  *   **Verdict:** **Marcus scores a point on debate tactics.** He forces Ines to move beyond criticizing his position and start defending a positive one for the kidney case. His continuum point is fair, but his conclusion ("no real distinction") is premature.

  **Round 4: Ines Invokes Vagueness & Sorites**
  *   **Ines' Strength:** Absolutely correct that **vagueness at boundaries doesn't invalidate clear cases**. The baldness/sorites analogy is apt. The drowning child *is* clearly obligatory for most; donating *all* organs *is* clearly beyond obligation. The existence of a grey area (kidneys? bone marrow? significant $ donations?) doesn't collapse the distinction.
  *   **Ines' Weakness:** While defending the *category*, she still hasn't engaged directly with *why kidney donation specifically* might fall into the supererogatory side of the vague boundary. She's defending the map but not placing the pin.
  *   **Marcus' Missed Opportunity (Supererogation Nuance):** Could have acknowledged the sorites point but doubled down: *"Fine, boundaries are vague, but Scott's numbers put kidney donation firmly in the 'drowning child' clear-obligation zone, not the grey area. Why isn't it?"*
  *   **Verdict:** **Ines scores a solid point.** She successfully defends the coherence of the obligatory/supererogatory distinction against Marcus's continuum/sorites challenge. The distinction survives.

  **Round 5: Marcus Demands Specifics on the Kidney Case**
  *   **Marcus' Strength:** Rightly refocuses on the **specific case in dispute** (kidney donation by Scott's numbers). Accuses Ines of using general vagueness to dodge the concrete calculation. This is a strong rhetorical move.
  *   **Marcus' Weakness:** Still implicitly assumes the utilitarian calculation is the *only* relevant factor and that Ines *must* engage with it on its own terms.
  *   **Ines' Missed Opportunity (Supererogation Nuance):** Should have been prepared to argue *why* bodily integrity/significant personal risk makes kidney donation qualitatively different *even with favorable numbers*. She needs to challenge the *framework*, not just the conclusion.
  *   **Verdict:** **Marcus scores a point.** He successfully forces the debate back to the concrete example and challenges Ines to justify her position *for this act* without hiding behind generalities.

  **Round 6: Ines Challenges the Math's Presuppositions**
  *   **Ines' Strength:** Lands the crucial philosophical point. She correctly identifies that **Marcus's "just run the numbers" approach presupposes impartial consequentialism**, which *is* the core point of contention. The calculation assumes the welfare of self and stranger are directly commensurable on a single scale at a fixed exchange rate, ignoring agent-relative *reasons* (bodily rights, personal sovereignty over risk). This is **question-begging**.
  *   **Ines' Weakness:** Could have explicitly stated the alternative: Morality includes **agent-centered options** or **side constraints** that *limit* what impartial good can demand of an individual, *especially* concerning their body. Kidney donation might be supererogatory *because* it involves a significant sacrifice/risk *of the body* that morality doesn't mandate.
  *   **Marcus' Missed Opportunity (Supererogation Nuance):** Needs to defend *why* agent-relative factors shouldn't count, or why bodily sacrifices *should* be treated like financial ones in this calculus. He doesn't engage with the deeper meta-ethical challenge.
  *   **Verdict:** **Ines scores the decisive point.** She exposes the foundational assumption driving Marcus's argument. The debate isn't *about* the math; it's about *whether the math captures the full moral picture*. Marcus hasn't justified his impartial framework; he assumes it.

  **Overall Winner & Key Oversights:**

  *   **Who Won?** **Ines has the stronger philosophical position.** She successfully defended the *coherence* of the obligatory/supererogatory distinction against Marcus's continuum/sorites challenge (R4) and exposed the core, question-begging assumption in his reliance on the utilitarian calculation (R6). Marcus effectively applied pressure with concrete examples and demands for specificity (R1, R3, R5), but didn't overcome the fundamental agent-relativity objection.
  *   **Critical Supererogation Nuances Both Overlooked:**
      1.  **The Nature of the Cost:** Supererogation often involves **sacrifices that are *personal*, *identity-constituting*, or involve *integrity*** (like bodily organs) rather than just fungible resources like money or time. The *qualitative* difference between risking your body and spending money is crucial.
      2.  **The "Option" vs. "Permission" Distinction:** Some theories frame supererogation as **agent-centered *options*** (you are *permitted* not to sacrifice, even if impartially better) rather than just acts "beyond duty." This directly counters Marcus's "it's wrong not to" claim. (See work by Samuel Scheffler).
      3.  **The Role of Motive & Character:** Supererogatory acts are often praised for **motives like exceptional benevolence or heroism**. Reducing them to obligation might drain them of this special moral value and place an excessive, potentially character-damaging burden on agents.
      4.  **Practical vs. Theoretical Demandingness:** Even if theoretically demanding, morality must be **lived and sustainable**. A system demanding constant organ donation would collapse under psychological and social pressure. Supererogation provides a **psychologically realistic buffer zone**.
      5.  **Systemic Solutions vs. Individual Obligation:** Framing kidney donation as an individual obligation overlooks the **systemic nature of the problem**. Advocating for opt-out organ donation systems or medical advances might be more effective and less demanding than framing it as a universal individual duty. The drowning child is a unique emergency; kidney failure is a systemic issue.
      6.  **The Phenomenology of "Ought":** There's a strong intuitive sense that while we *admire* kidney donors, we don't feel they *ought* to donate in the same way we feel we *ought* to save the drowning child. This intuition points to a real difference in perceived moral force that theories need to account for.

  **Moving the Conversation Forward:** A more productive discussion would require:
  1.  **Acknowledging the Foundational Disagreement:** Is morality fundamentally impartial (maximize good) or does it include strong agent-relative permissions/constraints?
  2.  **Engaging with the Specificity of Bodily Sacrifice:** Why might risks to/sacrifices of one's *body* generate different moral permissions than sacrifices of external resources, even with similar utility calculations?
  3.  **Defining Agent-Centered Slack:** Can Ines articulate a *principled* (even if not perfectly sharp) reason why saving the drowning child falls *within* obligatory demands while kidney donation falls *outside* (into supererogation), grounded in something like bodily integrity, significant risk, or core life projects?
  4.  **Considering Alternatives:** Could kidney donation be supererogatory *for most* but obligatory *for some* (e.g., those with exceptionally low risk or high capacity)? Or is it better addressed systemically?

  The stalemate occurred because Marcus assumed impartial consequentialism, while Ines defended agent-relativity but didn't fully articulate a positive principle for *this case*. Unpacking the unique moral weight of bodily sacrifice within theories of supererogation and agent-centered options is the key to resolving it.
