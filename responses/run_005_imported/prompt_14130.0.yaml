  ## The Unfinished Democracy: Why Spinoza's Exclusion of Women Reveals a Rotten Core in His Power-Based Politics

  Spinoza’s abrupt halt in the *Political Treatise* – mid-sentence in his justification for excluding women from democratic citizenship – feels less like an unfortunate accident and more like a philosophical fault line cracking open. While your friend argues this exclusion is merely an empirical error, easily fixed within Spinoza's system, a deeper analysis reveals it is **a systemic flaw exposing the dangerous limitations and inherent conservatism of grounding political rights solely in existing *potentia* (power/capacity).** Spinoza’s defense of democracy ultimately fails to overcome the tyranny of the status quo inherent in his power-based framework.

  **The Allure of Power: Spinoza's Political Core**

  Spinoza’s radicalism is undeniable: his monism dissolves hierarchies of being; his determinism challenges free will; his critique of superstition paves the way for secular reason. His political philosophy, building on his metaphysics, is equally revolutionary *in intent*. He rejects divine right and natural law based on transcendent moral values. Instead, he grounds political right (*jus*) in *potentia* – the inherent striving (*conatus*) and actual capacity of individuals and collectives to exist and act (Ethics III, P6-7; Political Treatise I, 4-5). A sovereign’s right *is* its effective power to command obedience. Crucially, for Spinoza, the "best" state isn't defined by abstract justice, but by what most effectively maximizes the *potentia* of its citizens – enabling them to live securely and rationally (TP I, 6; V, 1-2). Democracy emerges as the "most natural" form because it seemingly aligns sovereign power most directly with the combined *potentia* of the multitude, minimizing internal conflict and maximizing collective flourishing (TP XI, 1).

  **The Exclusion: Mistake or Manifestation?**

  Here lies the crux: your friend’s view – that Spinoza’s exclusion of women is a simple factual error, correctable with better anthropology – seems plausible *if* we imagine *potentia* as a neutral, measurable capacity independent of social structure. If women *actually* possess equal *potentia* (which they do), then Spinoza, upon realizing his empirical error, would logically include them as full citizens. His argument in the unfinished chapter hinges on the claim that male dominance is *natural*, evidenced by its universality ("since in literally every society men have ended up in charge"). Correct the observation, correct the conclusion.

  However, Spinoza’s own framework undermines this optimism:

  1.  **The Ontological Slippage:** Spinoza explicitly links *natural right* to *actual power*: "Nature's right is co-extensive with her power" (TP II, 4). He defines natural right *not* as an inherent moral claim, but as the *de facto* ability to act. If, within a specific social formation (like 17th-century Europe or the societies Spinoza observed), men *possess* the effective power (political, economic, social) and women are systematically denied it or conditioned into subservience, then, *within that existing power structure*, men *do* possess greater *potentia* relevant to political participation. Spinoza’s theory risks mistaking the *effect* (male dominance due to historical/social oppression) for the *natural cause* justifying exclusion. His argument isn't *just* an empirical error; it's **a logical consequence of defining political right by existing power relations.** If women *are* systematically disempowered, then, by Spinoza’s own definition, they *currently* lack the *potentia* for full citizenship. His "empirical observation" becomes a self-justifying premise.
  2.  **The Absence of a Normative Corrective:** Spinoza offers no independent *normative* principle – no inherent equality, no universal right to reason – capable of challenging existing power imbalances *on principle*. His monism implies all humans are equally "modes" of Substance/God, but this metaphysical equality doesn't translate into a political imperative for equal rights. The *Ethics* aims at individual freedom through reason, but the *Political Treatise* focuses solely on stability and security derived from aligning the sovereign's power with the *existing* power of the multitude. There's no mechanism *within his political theory* to demand the empowerment of the systematically disempowered. Why *should* the currently powerful collective (men) extend citizenship to the less powerful (women) if it doesn't perceive an immediate benefit to *its own* stability or power? Spinoza’s democracy optimizes the power of the *included* multitude, not humanity as such.
  3.  **The Conservatism of the "Natural":** By labeling the near-universal historical subjugation of women as "natural," Spinoza implicitly sanctifies the status quo. His reasoning mirrors arguments used to justify slavery or class hierarchies: "This is how it always has been, therefore this is how it naturally *must* be." This flies in the face of his own radical determinism, which should explain historical female subjugation as a complex product of social, economic, and biological factors interacting, *not* as a reflection of innate female incapacity. His appeal to universality reveals the **rotten core:** a theory grounded solely in *de facto* power struggles and historical outcomes lacks the resources to envision or demand fundamental change towards greater equality. It risks enshrining existing power dynamics as natural and right.

  **Why the Flaw is Fundamental, Not Superficial:**

  Therefore, the exclusion of women isn't a random bug; it's a **stress test revealing a critical failure mode.** Spinoza’s power-based theory:

  *   **Lacks a Foundation for Intrinsic Human Equality:** It provides no philosophical basis to argue that *all* humans, regardless of current social standing or perceived capacity, possess an equal claim to political participation. Rights flow from power, not personhood.
  *   **Is Vulnerable to Majoritarian Tyranny:** If the "multitude" defining the sovereign power holds prejudices (like sexism, racism, xenophobia), the theory offers no principled barrier to excluding disfavored groups. Their disempowerment becomes justification for their continued exclusion.
  *   **Struggles with Systemic Oppression:** It cannot adequately diagnose or prescribe remedies for power imbalances *created and maintained* by the political system itself. If the system denies group X power, the theory says group X lacks the *potentia* for rights, justifying the system's exclusion – a vicious circle.

  **Conclusion: The Unfinished Argument as a Symptom**

  Spinoza’s unfinished chapter on democracy is ironically fitting. His argument for women's exclusion wasn't finished, but more importantly, his power-based theory of democracy is fundamentally **unfinished in its ability to deliver on its own radical promise.** While he brilliantly dismantled theological and feudal justifications for authority and laid crucial groundwork for secular, popular sovereignty, his rejection of any normative foundation beyond *potentia* cripples his defense of genuine universal inclusion. The exclusion of women is not a mere oversight; it is the logical outcome of grounding political right solely in existing power dynamics. This exposes the "rotten" element: **a theory that defines right by might, however sophisticated, ultimately lacks the moral compass and critical leverage to challenge deeply embedded structures of oppression and achieve a truly inclusive democracy.** Spinoza’s democracy, as conceived in the *Political Treatise*, remains a democracy *for the powerful*, not *of the people*. His radical metaphysics deserved a more radical politics, one capable of seeing beyond the power structures of his time. The unfinished sentence on women’s citizenship marks the point where his revolutionary engine stalled, trapped by the very fuel – raw *potentia* – meant to drive it forward.
