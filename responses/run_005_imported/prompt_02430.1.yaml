answer: |-
  That's a fascinating and insightful proposal, and you've definitely identified a real tension in Dummett's work. However, your philosopher friend's reaction is understandable – the connection is **more subtle and indirect than a straight logical line**, and forcing it risks misrepresenting both his philosophy and his activism. Here's a breakdown:

  1.  **The Direct Logical Line (Your Editor's View): Why it's tempting but problematic:**
      *   **The Appeal:** It *seems* intuitive. Anti-realism says truth is tied to justification/verification. National borders and "belonging" are social constructs, not mind-independent natural kinds. Therefore, state claims about exclusion must be justifiable, not based on inaccessible "facts" about who "truly" belongs. Burden of proof shifts to the state.
      *   **The Problems:**
          *   **Domain Mismatch:** Dummett's anti-realism primarily concerns *semantics* and *metaphysics* – the nature of truth and meaning for mathematical statements or statements about the past/future (where verification might be problematic). Applying it directly to *political/legal/social concepts* like borders, citizenship, and rights is a significant leap. Anti-realism about mathematical truth doesn't automatically imply anti-realism about social facts. Social facts *are* constructed through human agreement and practice, but Dummett's anti-realism targeted a different kind of potential "mind-independence."
          *   **Dummett's Own Caution:** Dummett himself was **extremely wary** of applying his technical philosophical views directly to politics. He saw philosophy as a specialized, rigorous discipline, distinct from political advocacy. He explicitly stated that his anti-realism wasn't the *basis* for his political views.
          *   **The Nature of His Political Arguments:** In *On Immigration and Refugees* and his activism, Dummett's arguments are overwhelmingly **empirical, historical, ethical, and practical**, *not* grounded in the technical apparatus of verificationism or anti-realism:
              *   **Empirical Harm:** He documented the immense suffering, injustice, and inefficiency caused by racist immigration policies (especially the Commonwealth Immigrants Act 1962 and subsequent legislation).
              *   **Historical Context:** He emphasized Britain's colonial history and responsibility towards people from former colonies.
              *   **Ethical Principles:** He argued from fundamental principles of justice, fairness, equality, and human dignity. He saw immigration controls as inherently discriminatory and violating these principles.
              *   **Practical Consequences:** He highlighted the bureaucratic nightmare, the dehumanization of individuals, and the arbitrary cruelty of the system.
              *   **Burden of Proof:** His argument for shifting the burden of proof stems from these ethical and practical concerns: the state wields immense power to exclude and cause harm; therefore, it must justify *why* it needs to use that power in each case. It's an argument about power asymmetry and the presumption of liberty/innocence, not a direct corollary of semantic anti-realism.

  2.  **The More Plausible Connection: Shared Intellectual Temperament & Methodological Parallels**
      While not a direct logical deduction, there's a powerful *affinity* or *intellectual temperament* linking his philosophy and his politics. Think of it as a shared spirit or approach to justification:
      *   **Skepticism of the Unverifiable/Unjustifiable:** Anti-realism rejects truths forever inaccessible to verification/justification. His politics reject state claims to exclusion based on vague, unverifiable, or unjustifiable notions of "national identity," "cultural threat," or "belonging" that often mask prejudice. He demanded *reasons* and *evidence* for exclusion, mirroring the demand for verification/justification in semantics.
      *   **Focus on Human Capacities and Practices:** Anti-realism grounds meaning in *human capacities* (to verify, assert). His politics focus on the *human reality* of migrants and refugees – their experiences, needs, capacities, and the actual practices of communities integrating (or failing to). He rejected abstract, dehumanizing state categories.
      *   **Rejection of "Mystical" Foundations:** Anti-realism opposes Platonism or realism where truth floats free of human cognition. His politics oppose notions of nationhood, sovereignty, or border control treated as sacrosanct, mystical entities beyond ethical scrutiny or justification.
      *   **Commitment to Rigorous Argument:** Both domains reflect his core commitment to clarity, precision, and demanding rigorous justification for claims. In philosophy, this meant dissecting truth-conditions; in politics, it meant dissecting state justifications for exclusion and finding them wanting.
      *   **The Primacy of the Ethical (Implicitly):** While not logically derived, his philosophical work on meaning and truth arguably reflects a deep concern with how language and thought connect to human life and action. His activism is the direct application of ethical concern to a specific, urgent human problem. The *intensity* of his commitment to justification in both spheres is consistent.

  **Recommendation for Your Article:**

  *   **Don't Open with the Direct Logical Line as Fact:** Presenting it as "Dummett's argument works like this..." would be inaccurate and likely draw criticism.
  *   **Open with the Intriguing Tension:** Start by highlighting the striking juxtaposition – the highly technical, abstract philosopher of language who was also a fiercely dedicated, boots-on-the-ground activist for migrants. Acknowledge the *temptation* to see a direct line.
  *   **Acknowledge the Nuance:** Quickly clarify that Dummett himself resisted drawing this direct link, and that his political arguments were grounded in ethics, evidence, and history.
  *   **Focus on the Affinity/Temperament:** Frame the connection as one of **shared intellectual spirit and methodological rigor**. Emphasize how his profound skepticism towards unjustifiable claims in semantics manifested as a profound skepticism towards unjustifiable state power and exclusionary narratives in politics. Highlight the parallel demands for verification/justification in both domains.
  *   **Quote Dummett (if possible):** Find a quote where he talks about his activism being driven by witnessing injustice or based on ethical principles, reinforcing the empirical/ethical basis.
  *   **Conclude with the Power of the Juxtaposition:** The real story isn't a neat logical deduction, but how a mind capable of the most intricate abstract thought was simultaneously driven by deep ethical conviction and clear-eyed observation of human suffering to relentless practical action. His philosophy reflects a commitment to grounding meaning in human capacities; his activism reflects a commitment to grounding politics in human dignity and justice.

  **In essence:** You're not bolting unrelated parts together; there is a deep connection. But it's the connection of a consistent intellectual character – skeptical of the unverifiable, demanding of justification, focused on human practices and suffering – operating in two very different but profoundly important domains. The link is temperamental and methodological, not strictly logical or deductive. This makes the story richer and more human, avoiding the potential pitfalls of a forced technical connection.
