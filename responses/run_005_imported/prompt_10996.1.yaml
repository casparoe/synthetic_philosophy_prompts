answer: |-
  You've hit upon a genuinely profound tension in moral philosophy. Your intuition is sharp, but Ord's concept of moral trade *can* be reconciled with moral realism without smuggling in relativism. Here's a breakdown of the key points, showing where your concern arises and how Ord addresses it:

  **Core Argument for Moral Trade (Compatible with Realism):**

  1.  **Value Pluralism & Epistemic Limitations:** Moral realism posits objective moral facts, but it *does not* require that individuals have perfect knowledge of those facts. Two people can:
      *   Care about *different* real moral values (e.g., animal suffering vs. human poverty alleviation).
      *   Hold *reasonable but incorrect* beliefs about the *weight* or *priority* of those values.
      *   Hold *reasonable but incorrect* beliefs about the *best means* to achieve a shared value.
      *   Be *uncertain* about the true moral facts.

  2.  **The Trade Mechanism:** A moral trade exploits differences in *subjective valuation* (based on differing beliefs/uncertainty) or differences in *resources/abilities* to affect different values, *not* a difference in the fundamental nature of moral truth.
      *   **Example:** The vegetarian assigns a *very high* negative value to factory farming based on their belief about animal suffering. The meat-eater assigns it a *lower* negative value or even a positive value (taste/convenience), but assigns a *very high* positive value to, say, effective malaria prevention. The vegetarian is highly effective at donating to malaria charities (their money goes far). The meat-eater finds reducing meat consumption moderately costly but achievable.

  3.  **The "Gain" Under Realism:**
      *   **The Vegetarian's Gain (Realist View):** By getting the meat-eater to reduce consumption, they believe they are preventing significant objective moral harm (animal suffering) at a cost (donating to malaria nets) that they believe involves less objective moral importance *from their perspective*. Crucially, *given their current (possibly wrong) beliefs and uncertainty*, this trade increases the *expected* moral value of the outcome *according to their own best judgment*. It's a way to mitigate harm they perceive as grave using resources they value less for that specific purpose.
      *   **The Meat-Eater's Gain (Realist View):** They receive significant resources for a cause they believe has high objective moral importance (saving human lives) at a cost (reducing meat consumption) they perceive as involving less objective moral disvalue *from their perspective*. Again, *given their current beliefs*, this increases the expected moral value.

  4.  **Why it's NOT Simply "Paying to Act Wrongly":**
      *   **Uncertainty & Risk Mitigation:** Under realism, both parties *could* be wrong. The trade allows each to act on their core convictions *while also* hedging against the possibility they are mistaken. The vegetarian, by funding malaria nets, is *also* doing something that *might* be objectively very good, even if they undervalue it. The meat-eater, by reducing consumption, is reducing something that *might* be objectively very bad, even if they undervalue that reduction.
      *   **Comparative Advantage:** Each party uses their resources (money, willpower to reduce meat) where they believe it has the *most* impact *relative to their own values*. The vegetarian's money is more effective at funding nets; the meat-eater's action is the *only* way to directly reduce *their own* meat consumption.
      *   **Pragmatism Within Ignorance:** Moral realism doesn't demand inaction until perfect knowledge is achieved. Given deep disagreement and uncertainty, finding cooperative ways to increase the likelihood of promoting *some* genuine moral value (even if imperfectly) can be the most rational course *within a realist framework*. It's a form of damage control or value promotion under conditions of imperfect information.

  **Addressing Your Core Concern ("Odd Mutual Gain"):**

  *   **The "Gain" is Subjective & Epistemic, Not Ontological:** The "gain" each party perceives is *not* necessarily a gain in *objective* moral value (though it might be, by luck). The gain is that *according to their own current best judgment and values*, the world is expected to be better *after* the trade than *before*. Moral realism doesn't require that individuals always accurately perceive the *actual* moral state of the world, only that there *is* an actual moral state.
  *   **It Doesn't Require Relativism About Truth:** Neither party needs to believe "eating meat is wrong *for you* but not *for me*" in a relativist sense. The vegetarian firmly believes eating meat is *objectively* wrong. The meat-eater may firmly believe it's *objectively* permissible or even good. The trade works because they disagree *about the facts* (the severity of harm, the weight of values) and can leverage that disagreement for mutual benefit *as they see it*, not because they believe morality itself is relative.

  **Where Relativism *Would* Make it Easier (But Not Necessary):**

  *   If both parties *were* relativists ("Your morality is true for you, mine for me"), the trade would be straightforward: each is simply respecting the other's framework and acting within their own. Ord's point is that you *don't need* this relativist foundation. The trade can function purely based on *differing beliefs about objective facts* and *differing capacities* under realism.

  **Conclusion:**

  You are not entirely missing something; the possibility of moral trade *does* highlight the profound challenge of moral disagreement and uncertainty *under realism*. However, Ord successfully argues that moral trade is *compatible* with realism because:

  1.  It leverages **differences in subjective valuation based on differing beliefs/uncertainty about objective facts**, not a denial of objectivity.
  2.  It operates within the **epistemic limitations** of moral agents who lack perfect knowledge of the true moral facts.
  3.  The "mutual gain" is defined **relative to each agent's own best judgment of the objective moral facts**, not relative to a relativist "moral framework."
  4.  It can be seen as a **pragmatic, cooperative strategy for promoting expected moral value** in a world of deep disagreement and uncertainty.

  Your objection highlights the counterintuitive nature of benefiting from others' "moral mistakes," but Ord's framework shows this is possible precisely *because* of our fallibility within a realist world, not because realism is false. The trade is a tool for navigating ignorance, not proof that objective truth doesn't exist.
