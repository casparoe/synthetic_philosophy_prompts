  The user's doubt is whether this distinction holds or if it collapses into relativism. They mention that if nothing outside language adjudicates rival vocabularies, isn't that relativism? I need to address how Rorty avoids relativism despite this. 

  Rorty insists on objectivity without representationalism. Objectivity comes from intersubjective agreement within a community, not correspondence to reality. But he's not saying any belief is as good as any other because the world causally constrains us. For example, you can't ignore gravity when jumping off a cliff. But explaining why gravity works is a matter of current scientific vocabulary, which can change.

