answer: |-
  You've hit on one of the most subtle and important problems in frequentist statistics (the standard "p-value" approach). Your data guy is fundamentally correct, and your roommate is right that this issue undermines a lot of published research. Here's the breakdown:

  1.  **Is your data guy right? YES, peeking-and-extending *is* a real problem.**
      *   **Why? Alpha Inflation (False Positive Rate Inflation):** The core issue is what the p-value *means* and what guarantees it provides. A p-value of 0.05 means: *"If the null hypothesis (no difference) is true, and we ran this exact same experiment (same sample size, same stopping rule) many times, we would get a result this extreme or more extreme only 5% of the time by random chance."*
      *   **The Crucial Assumption:** This guarantee hinges on **pre-defining your sample size** (or having a strict, pre-defined stopping rule like sequential testing) *before you see any data*.
      *   **What Peeking Does:** Every time you peek at the data and think, "Hmm, not significant yet, let's add more data," you are creating a *new* opportunity to randomly cross the significance threshold purely by chance. Think of it like flipping a coin until you get 3 heads in a row. If you keep flipping *until* you see that pattern, you *will* eventually see it (false positive), even with a fair coin.
      *   **The Simulation Proof:** Imagine the null hypothesis is true (no button difference). You peek daily. Each day, there's a ~5% chance p<0.05 *by chance alone*. If you peek 10 times over 3 weeks, the chance of *ever* seeing p<0.05 *at least once* during those peeks is much higher than 5% (closer to 40%!). You're not testing just once; you're effectively running multiple tests. Stopping when you finally see significance capitalizes on this random fluctuation. The final p-value after extending doesn't account for all these previous looks.
      *   **Analogy:** It's like having multiple lottery tickets. Buying one ticket gives you a small chance to win. Buying 10 tickets gives you a much higher chance. Peeking multiple times is like buying extra lottery tickets for a false positive. The "win" (significant p-value) *is* real for that specific ticket/dataset, but the *overall chance* of winning *any* ticket was inflated because you kept buying more when you didn't win immediately.

  2.  **Why does the timing/process matter if the final data is "real"?**
      *   The *data points themselves* are real and honest. The *interpretation* of the aggregate result via the p-value is *invalidated* by the process used to collect it.
      *   The p-value calculation assumes a single, pre-specified analysis plan. Changing the plan (sample size, stopping point) *based on seeing intermediate results* fundamentally changes the underlying probability model used to calculate the p-value.
      *   **The Final Numbers Aren't Magic:** The p-value isn't just a property of the final data set; it's a property of the data set *and the process used to collect it*. The same final numbers collected under a strict pre-defined plan yield a valid p-value. The *identical* final numbers collected via repeated peeking and extending do *not* yield a valid p-value because the process inflates the false positive rate.
      *   **Analogy:** Imagine two identical races:
          *   **Race 1:** Rules state the race is exactly 100m. Runner A wins by 0.01s. This is a valid win.
          *   **Race 2:** Rules state the race continues until Runner A is ahead at the finish line *on any lap*. Runner A is behind for 9 laps but wins on the 10th lap by 0.01s. The *distance* and *win margin* are real, but declaring Runner A the "faster runner" based *only* on this win is invalid because the rules allowed multiple attempts until success. The *process* designed the win.

  3.  **The "Other School" (Bayesian Statistics) & Does it Fix the Problem?**
      *   **What it is:** Bayesian statistics focuses on updating the *probability* that a hypothesis (e.g., "Button B is better") is true, based on prior beliefs and new evidence (data). It uses Bayes' Theorem. Key outputs are the **Posterior Probability** (e.g., "There's an 85% probability Button B is better") or the **Bayes Factor** (e.g., "The data is 10 times more likely under the hypothesis that Button B is better than under the null hypothesis").
      *   **Does it make the "peeking problem" go away? Largely Yes, but with nuances.**
          *   **Why "Yes":** Bayesian updating is fundamentally sequential. You start with a prior probability. You collect some data and update to a posterior probability. You collect *more* data and update *that* posterior to become your new prior, and so on. Stopping when the posterior probability reaches 95% (or the Bayes Factor reaches 10) *is a valid and coherent thing to do* within the Bayesian framework. The interpretation of the posterior probability or Bayes Factor doesn't depend on *when* you decided to stop or how many times you looked. The evidence is evaluated based on the data you have, relative to your prior.
          *   **The Nuances:**
              *   **The Prior Matters:** The final posterior depends on the initial prior belief. Choosing an unrealistic or overly strong prior can bias results. Transparency about the prior is crucial.
              *   **Decision Thresholds Still Exist:** While you *can* stop based on posterior probability, choosing *when* to stop (e.g., 95% vs 99%) still involves a judgment call. However, this decision doesn't invalidate the *computation* of the posterior like it invalidates a p-value.
              *   **Calibration:** A posterior probability of 95% *should* mean you'd be correct 95% of the time *if* your prior accurately reflected reality and you ran many similar experiments. Ensuring this calibration can be complex.
              *   **Not a Magic Bullet:** It solves the *specific* problem of optional stopping (peeking and extending), but introduces other considerations (choosing priors, interpreting probabilities correctly). It doesn't solve *all* statistical problems (e.g., data dredging, poor measurement).
      *   **Relocating the Issue?** It doesn't relocate the *same* issue. The problem of alpha inflation due to peeking is genuinely solved. However, it replaces it with the challenge of specifying and justifying priors and ensuring users correctly interpret posterior probabilities as degrees of belief rather than frequentist error rates. Some argue this trade-off is worth it, especially for iterative processes like A/B testing.

  **In Summary for Your Startup:**

  *   **Your data guy is correct.** Extending the test after seeing p=0.09 significantly inflates the risk of a false positive. The final p-value after extending is invalid.
  *   **Why it matters:** The *process* of data collection (peeking and deciding to extend) fundamentally breaks the probabilistic guarantee (false positive rate control) that the p-value relies on. The same final data, collected under a pre-defined plan, would be valid.
  *   **The "Other School" (Bayesian):** Offers a way to analyze data where peeking and extending *is* allowed without invalidating the results, as evidence accumulates sequentially. However, it requires careful consideration of prior beliefs and transparent reporting.
  *   **Practical Advice:**
      *   **Pre-register:** Before starting *any* test, define: Primary metric, expected effect size, required sample size (based on power calculation), and the *exact* stopping rule (e.g., "We will collect exactly N=1000 users per variant" or "We will use a formal sequential testing procedure"). Stick to it.
      *   **If you MUST peek:** Use methods designed for it:
          *   **Sequential Testing:** Formal frameworks (SPRT, Group Sequential) allow peeking at pre-defined points with adjusted significance thresholds to maintain overall error control.
          *   **Bayesian Approach:** Implement a Bayesian A/B testing framework with clearly defined priors and a stopping rule based on posterior probability or Bayes Factor.
      *   **Resist Temptation:** Seeing p=0.09 is frustrating, but adding data *because* it's close to significance is statistically dangerous. Collect the pre-defined sample size. If still not significant, accept the result or run a new, properly designed test later if you have strong reason to believe the effect is real.

  Your curiosity is spot-on. This isn't just about a button; it's about the fundamental logic of how we interpret data and avoid fooling ourselves. The fact that this issue plagues published research highlights how non-intuitive, yet critically important, these statistical principles are.
