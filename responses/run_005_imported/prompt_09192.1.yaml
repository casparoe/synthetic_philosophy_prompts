  Okay, the user is a political theory PhD student who's deep into Aquinas's views on tyrannicide. They had seminar discussions revealing Aquinas's nuanced stance, which is more complex than the simplified undergrad version. The user's main confusion is about applying Aquinas's medieval framework to a modern scenario: a legitimately elected president who becomes tyrannical, dismantles institutions, and cancels elections. Their study group is divided on whether such a ruler remains a "tyrant by exercise" or shifts to "defect of title," and whether resistance by private individuals, groups, or foreign entities is permissible under Aquinas's principles.

  First, I need to recall Aquinas's two types of tyrants. "Defect of title" means no legitimate claim (usurper), where Aquinas allows private action if no higher authority exists. "Tyrant by exercise" has a legitimate title but rules unjustly; here, private individuals can't act—only the community or higher authority can intervene. In De Regimine Principum, Aquinas warns against private judgment due to risks of abuse and chaos.

  The modern scenario involves a president elected fairly who then subverts democracy. The key question is whether this ongoing subversion voids his initial legitimacy. Aquinas's texts don't address this directly, so I need to infer from his principles. His focus on title legitimacy is about the initial acquisition, not subsequent actions. However, maintaining power through fraud and coercion might imply a continuous usurpation. But Aquinas doesn't explicitly categorize this as "defect of title." The usurper type is about initial claim, not how power is maintained.

  For the community's role, Aquinas does mention that the community can depose a ruler they appointed. But the problem here is that formal institutions are captured. The user asks if a mass uprising qualifies as community action. Aquinas likely meant institutional channels, but if those are gone, the community's residual authority might justify action. However, Aquinas fears disorder, so he'd probably prefer enduring tyranny over risky revolt.

  The user also asks about foreign intervention. Aquinas doesn't cover this, but his principles might view foreign powers as illegitimate intervenors unless they have higher authority, like a medieval emperor. Without such, he'd likely reject foreign involvement.

  The user's deeper need is a rigorous application of Aquinas's logic to a modern dilemma, avoiding oversimplification. They want to see if Aquinas's framework can adapt or if it breaks here. They might also be exploring whether medieval thought offers tools for contemporary issues, like democratic backsliding.

  I should structure the response by analyzing the title's legitimacy first, then discuss community action versus private initiative, and touch on foreign intervention. Emphasize that Aquinas prioritizes order and fears chaos, so he'd be cautious. Highlight that the community's residual authority is key, but action must be collective, not private. Conclude that while the president started legitimate, his actions might make resistance by the community licit, but private or foreign actions are not.
answer: |-
  Based on a close reading of Aquinas's texts and reasoning (primarily *Commentary on the Sentences* II, Dist. 44, Q. 2, A. 2 and *De Regimine Principum* I, 6-7), here's a reconstruction of how his framework would likely apply to your scenario, acknowledging the inherent tension and limitations of applying medieval categories to modern constitutional crises:

  1.  **Initial Title Classification:** The president **definitely starts as a "Tyrant by Way of Exercise" (Tyrannus Exercitio)**. Aquinas's "defect of title" (*defectus tituli*) is fundamentally about the *origin* of power. Did the ruler seize power unlawfully (usurpation) or inherit it illegitimately? A genuinely free election, by Aquinas's lights, provides a clean title via the community's consent/appointment (*De Regimine* I, 6). The subsequent abuse doesn't retroactively invalidate the *initial* title acquisition. His categories are primarily about *how you got the office*, not solely *how you hold it* later (though holding it tyrannically defines the "exercise" type).

  2.  **The Problem of Maintaining Power Illegitimately:** This is the crux. While the *origin* was clean, the *ongoing* retention of power through fraud, coercion, and subversion of institutions *creates a new defect*. However, Aquinas does **not** explicitly reframe this as a *new* "defect of title" *category*. His discussion of usurpers focuses on initial seizure. His concern in *De Regimine* about ambitious men assassinating decent kings strongly suggests he would **not** automatically classify *maintaining* power tyrannically as creating a "defect of title" justifying *private* action. Why?
      *   **The Slippery Slope Argument:** Aquinas's core fear is *private judgment*. Allowing private individuals (even generals or foreign powers acting unilaterally) to decide that a ruler's *subsequent* actions have voided his *initial* title opens the door to exactly the chaos and pretextual assassinations he warns against. Who determines when "hollowing out courts" or "jailing journalists" crosses the line into title-invalidating tyranny? Aquinas would see this judgment as dangerously subjective if left to private actors.
      *   **Focus on Origin vs. Exercise:** His framework structurally separates the *acquisition* of power (title) from its *use* (exercise). The modern scenario involves a legitimate acquisition followed by an illegitimate *continuation*. Aquinas doesn't have a neat box for this hybrid. His reasoning prioritizes stability and fears anarchy arising from decentralized violence.

  3.  **The Role of "The Community" vs. Private Individuals:** This is where Aquinas provides the most plausible, though difficult, path for legitimate resistance, **not** private action.
      *   **Community as Origin of Authority:** Aquinas firmly states that a ruler appointed by the community (*De Regimine* I, 6: "the authority of a prince elected by the community depends on the community") can be deposed *by that same community* if he becomes a tyrant. The community is the *source* of his just title.
      *   **Formal vs. Substantive Community Action:** Your scenario poses the challenge: what if the formal institutions *through which* the community normally acts (legislature, courts, electoral bodies) are captured? Aquinas doesn't address institutional capture explicitly. However, his concept of "the community" (*multitudo*) is substantive, not purely procedural. He refers to the community acting *as a whole* ("universitas") or through representatives who genuinely speak *for* the community *before* its capture.
      *   **Mass Uprising as "Community" Action?** This is the most arguable point based on his principles, **not** a clear endorsement. Aquinas would **strongly distinguish** a spontaneous mob from "the community acting as a whole." However, if the formal channels are irrevocably closed *by the tyrant himself*, a truly *representative* popular uprising (e.g., led by surviving legitimate local leaders, respected figures, or a broadly representative council formed *ad hoc* from the uncorrupted elements of society) could potentially be construed as *the community* reasserting its original authority to depose the ruler it appointed. This wouldn't be a "private" act by Aquinas's lights, but an act of the *sovereign community itself* exercising its residual authority. It aligns with his statement that the community isn't bound to the tyrant's pact if he breaks it (*De Regimine* I, 6). **Crucially:** Aquinas would likely see this as a last resort fraught with danger and requiring overwhelming popular consensus to approximate "the community acting as a whole." It's not license for a minority coup or a lone assassin claiming to represent "the people."

  4.  **Foreign Intervention:** Aquinas provides **no** clear basis for *foreign* governments to licitly depose a tyrant *by exercise* in a sovereign state lacking a higher temporal authority (like a medieval emperor or pope over kings). His framework is domestic. Foreign intervention would likely be seen by him as:
      *   An act of war/aggression against the *community*, not just the tyrant.
      *   A usurpation of the community's own right/responsibility to act.
      *   Prone to abuse based on the foreign power's self-interest, not justice for the oppressed community. His warnings about ambitious men using tyrannicide as a pretext apply equally to ambitious states.

  **Conclusion & Answer to Your Questions:**

  *   **Classification:** Aquinas would **not** automatically reclassify the president as a "tyrant by defect of title." The initial clean title via election remains the defining factor, placing him firmly in the "tyrant by exercise" category. The *means* of maintaining power, while egregious, wouldn't trigger the "usurper" justification for *private* action in Aquinas's explicit framework due to his fear of subjective private judgment and the slippery slope.
  *   **Private Action:** Aquinas would **adamantly reject** licit action by a lone assassin, a general plotting a coup, or a foreign government acting unilaterally. These are all quintessential examples of the "private initiative" he condemns for tyrants *by exercise*. They bypass the community and invite chaos.
  *   **Community Action & Mass Uprising:** This is the *only* potentially licit path within Aquinas's reasoning, but it's difficult and constrained. He would **not** endorse a spontaneous, disorganized mob. However, **if** the formal institutions are destroyed *by the tyrant*, **and** a truly representative body emerges that can credibly claim to act *as the sovereign community itself* (e.g., a broadly based council of uncorrupted leaders, remnants of legitimate bodies, or figures commanding near-universal popular assent), **then** action by *that body* to depose the tyrant could be argued to align with Aquinas's principle that the community retains the authority to remove the ruler it appointed. This would be seen as the community reclaiming its authority, not "private" resistance. It's Aquinas's principled (though perilous) room for revolution *by the whole people*, not by factions or individuals.

  **In essence:** Aquinas's framework prioritizes order and fears anarchy. For your scenario, he would see the president as a "tyrant by exercise" and reject *private* action (lone assassin, coup, foreign intervention). His sole, highly cautious, avenue for legitimate removal rests with *the community as a whole* acting through the most representative means possible when formal institutions are destroyed *by the tyrant himself*. This requires a collective, public act reclaiming original sovereignty, not individual or factional violence. He would likely advise endurance and prayer until such a representative communal action became genuinely possible, fearing the greater evils unleashed by illegitimate resistance more than the tyranny itself.
