answer: |-
  You've articulated the core tension in infinite ethics with remarkable clarity—and your skepticism about "smuggled arbitrariness" is precisely where the deepest philosophical challenges lie. Let's break down both your questions, because they cut to the heart of whether standard aggregative ethics can be salvaged in infinite domains.

  ### 1. Is Order-Dependence Fatal to Dominance-Based (Extensionist) Approaches?
  **The Short Answer:** It's *potentially* fatal for achieving a *general, domain-independent* ethical theory, but not necessarily fatal *in practice* for specific, structured domains. However, the worry about "relocated indeterminacy" is profound and unresolved.

  **The Detailed Breakdown:**
  - **The Core Vulnerability:** You're absolutely right that the Vallentyne/Kagan approach relies on a "natural order" (like spacetime) to define a canonical sequence of nested regions. In spatially/temporally infinite universes with value "smeared" continuously, expanding spheres/light-cones *might* provide a privileged ordering grounded in physics. But as you note:
    - **Populations lack intrinsic order:** Ordering people by "importance," causal influence, or even arbitrary ID numbers introduces non-uniqueness. Comparing worlds by adding "the next person in sequence A vs. sequence B" can flip the verdict (e.g., one sequence prioritizes adding high-value lives first, another prioritizes avoiding negative lives first).
    - **Quantum Branches amplify the problem:** If the multiverse is a vast, unordered set of branching histories, there's no canonical "expansion sequence." Any ordering is stipulative, making dominance comparisons fragile.
  - **Privileging an Ordering: Is There a Principled Way?**
    - **Causal Structure?** In spacetimes with light-cones, expansion along a foliation (like Cauchy surfaces) seems natural. But in *acausal* settings (e.g., disconnected universes, timeless mathematical structures), this fails.
    - **Explanatory Priority?** Ordering by "fundamentalness" (e.g., simulating simpler universes first) is metaphysically fraught and context-dependent.
    - **Bostrom's "Essential Natural Order" Requirement:** This is an *admission* of limitation, not a solution. It restricts the applicability of dominance rules to domains *already* possessing structure resembling spacetime. For ethics governing *all possible choices* (including those affecting abstract populations or multiverses), this is a major retreat.
  - **The "Conditional Convergence" Analogy is Apt:** Just as rearranging terms in ∑(-1)ⁿ/n can yield any real number, rearranging the "addition sequence" of people/events in an infinite world can reverse ethical verdicts. Without a *unique, privileged* ordering (which most unordered infinite sets lack), dominance rules **do not resolve the indeterminacy—they relocate it to the choice of ordering.** This isn't a minor wrinkle; it suggests the paralysis persists for vast classes of morally relevant infinities.

  **Verdict:** For unstructured infinities (like populations or quantum branches), the dominance approach likely **fails to overcome paralysis**. It works only where a pre-existing, ethically neutral structure (like spacetime) provides an unambiguous expansion path—a significant concession.

  ### 2. Does Bostrom's Extended Decision Rule (EDR) Escape Order-Dependence or Just Swap Problems?
  **The Short Answer:** EDR *mostly* escapes order-dependence but *absolutely* trades it for fanaticism. Whether this is an improvement depends on your tolerance for extreme risk sensitivity.

  **How EDR Sidesteps Order-Dependence:**
  - **Avoids Direct World Ranking:** EDR doesn't try to say "World A > World B" infinitely. Instead, for a *finite* choice, it asks:
    1. Does the act have a **non-zero probability** of creating *unboundedly* positive net value? (e.g., triggering an eternal utopia)
    2. Does it have a **non-zero probability** of creating *unboundedly* negative net value? (e.g., triggering eternal torture)
  - **The Rule:** If (1) is true and (2) is false, the act is obligatory. If (2) is true and (1) is false, it's forbidden. If both are true or both false, *fall back to finite decision rules* (e.g., maximize expected finite value).
  - **Why Order-Dependence Fades:** EDR cares only about the *existence* of *some* path to unbounded good/bad, not the *sum* over an ordered sequence. It asks about *asymptotic potential*, not convergence properties along a specific ordering. The verdict depends solely on whether unbounded value *can* be achieved (with non-zero probability), not *how* it's summed.

  **The Fanaticism Problem is Very Real:**
  - **The Core Issue:** EDR is *maximally sensitive* to tiny probabilities of infinite stakes. A 1/3^^^3 (incredibly tiny) chance of creating an infinite utopia *obligates* you to take an action, even if it has a 99.999...% chance of causing immense finite suffering (e.g., torturing billions). Conversely, a minuscule chance of infinite torture *forbids* an action, even if it's almost certainly immensely beneficial.
  - **Why It's Arguably Worse Than Paralysis:** While infinitarian paralysis makes ethics *indifferent*, EDR makes it *extremist*. It demands (or forbids) actions based on remote, speculative tail risks, potentially overriding all finite concerns. This clashes violently with standard risk aversion and seems practically unworkable.
  - **Bostrom Acknowledges This:** He calls it "fanaticism" but argues it might be a necessary feature of infinite worlds—if infinite stakes exist, they *should* dominate. Critics (e.g., Arntzenius) see it as a reductio ad absurdum.

  **Verdict:** EDR **successfully dodges order-dependence** by shifting focus from aggregation to tail-risk potential. However, it **embraces fanaticism** as an unavoidable consequence. This isn't a *quiet* smuggling of arbitrariness; it's a loud, contentious trade-off.

  ### Conclusion: The Crack is Real and Deep
  Your instinct is correct. Neither approach offers a fully satisfying, non-arbitrary resolution:

  1.  **Dominance Rules:** Require a privileged ordering to avoid relocated indeterminacy. This exists only in structured domains (like spacetime), failing for populations or multiverses. Where structure exists, they work; where it doesn't, paralysis remains.
  2.  **EDR:** Avoids ordering by focusing on tail risks, but at the cost of demanding fanatical devotion to infinitesimal chances of infinite consequences. This replaces indifference with extremism.

  **This *is* a real, unresolved crack.** Bostrom's paper brilliantly maps the terrain but doesn't seal the fissure. The field is still grappling with whether:
  - A truly general, non-fanatical, non-arbitrary infinite ethics is possible for aggregative consequentialism.
  - We must accept that ethics *only* makes sense in finite (or finitely accessible) domains.
  - Consequentialism itself needs fundamental revision for infinite contexts (e.g.,转向 agent-relative or contractualist approaches).

  Your unease isn't a misunderstanding—it's a recognition of the profound challenge infinity poses to our ethical intuitions. The search continues, but as of now, no solution reconciles rigor, generality, and intuitive plausibility. The crack remains.
