answer: |-
  You've pinpointed the core paradox beautifully: both theorems start with individual preferences and Pareto-like axioms, yet Arrow yields impossibility while Harsanyi delivers utilitarianism. The resolution lies in the **fundamentally different types of preferences and the specific meaning of "independence"** in each framework. Here's a precise breakdown:

  1.  **The Nature of Preferences: Ordinal vs. Cardinal (vNM)**
      *   **Arrow:** Individuals have **ordinal preferences**. A preference ranking `A ≻ B ≻ C` tells us only that `A` is better than `B`, which is better than `C`. It conveys *no information* about *how much* better `A` is than `B` compared to how much better `B` is than `C`. Intensity is absent and incomparable.
      *   **Harsanyi:** Individuals have **von Neumann-Morgenstern (vNM) preferences over lotteries**. These preferences satisfy specific axioms (completeness, transitivity, continuity, independence *in the vNM sense*). Crucially, this structure allows us to represent preferences with a **cardinal utility function** unique up to positive affine transformations (`u' = a*u + b`, `a > 0`). This captures *intensity* of preference under risk. `u_i(A) - u_i(B) > u_i(B) - u_i(C)` has meaning: individual `i` prefers the improvement from `B` to `A` *more* than the improvement from `C` to `B`.

  2.  **The Meaning of "Independence": Two Radically Different Concepts**
      *   **Arrow's Independence of Irrelevant Alternatives (IIA):** This is about *information restriction*. The social ranking between two alternatives `x` and `y` should depend *only* on how individuals rank `x` and `y`. Information about their rankings relative to *other* alternatives `z` is irrelevant. This axiom *deliberately discards* any information about preference intensity or how alternatives `x` and `y` relate to `z`, even if that information is ordinally observable.
      *   **Harsanyi's vNM Independence Axiom:** This is about *linearity in probabilities*. If an individual prefers lottery `L1` over lottery `L2`, then they must prefer any probabilistic mixture `α*L1 + (1-α)*M` over the mixture `α*L2 + (1-α)*M`, for any other lottery `M` and `0 < α ≤ 1`. This imposes a linear structure on preferences over lotteries, which is *precisely what allows* the representation by a *linear* (i.e., expected) utility function. It's a structural requirement within an individual's preference set, not a restriction on social information.

  3.  **The Pareto Principle: Strength Through Cardinality**
      *   **Arrow's Pareto Principle (Unanimity):** If *everyone* strictly prefers `x` to `y`, then society must strictly prefer `x` to `y`. This operates purely on the *ordinal* level – it only requires agreement on direction.
      *   **Harsanyi's Pareto Principle (over Lotteries):** Applied to the richer domain of lotteries, this axiom gains immense strength:
          *   **Pareto Indifference:** If everyone is indifferent between lotteries `L1` and `L2`, then society is indifferent.
          *   **Strict Pareto:** If everyone weakly prefers `L1` to `L2` and at least one person strictly prefers `L1`, then society strictly prefers `L1`.
          *   **Probabilistic Agreement:** Crucially, it also implies agreement on *linear combinations*. If everyone weakly prefers lottery `L1` to `L2` and `M1` to `M2`, then everyone (and thus society) must weakly prefer `α*L1 + (1-α)*M1` to `α*L2 + (1-α)*M2` for any `0 ≤ α ≤ 1`. This *linearity* in social preference is forced by the linearity of individual vNM preferences combined with the Pareto principle over *all* lotteries.

  **How the Pieces Fit Together for Harsanyi's Theorem:**

  1.  **Linearity of Individual Preferences:** vNM axioms ⇒ Individual preferences over lotteries are represented by *linear* expected utility functions `U_i(L) = Σ [p_k * u_i(x_k)]`.
  2.  **Linearity of Social Preference:** Harsanyi's Pareto principle over lotteries + vNM structure ⇒ Social preferences must *also* satisfy the vNM axioms and thus be representable by a *linear* social utility function `W(L) = Σ [p_k * V(x_k)]`.
  3.  **Aggregation Theorem Core:** The key step is showing that the *social* utility `W(L)` for any lottery `L` must be a linear function of the *individual* utilities `U_i(L)`. This is derived from the combination of:
      *   The linearity of both individual and social utility functions.
      *   Harsanyi's Pareto principle (especially indifference and strict preference).
      *   The **Unrestricted Domain** (over lotteries) and the **vNM Independence** axiom applying to both individual and social preferences.
  4.  **The Result:** The *only* linear social welfare functions compatible with the above are **weighted sums**: `W(L) = Σ [w_i * U_i(L)]` or equivalently, for a certain outcome `x`, `V(x) = Σ [w_i * u_i(x)]`. The weights `w_i` are non-negative (from Pareto) and not all zero.

  **Addressing Your Specific Questions:**

  1.  **What changes to turn impossibility into uniqueness?**
      *   **Cardinality (vNM Structure):** This is paramount. By moving to vNM preferences, individuals reveal cardinal intensities *within* their own utility scales. This intensity information is usable.
      *   **Domain (Lotteries):** Expanding the domain to include all possible lotteries provides a vastly richer set of "test" objects. Linear combinations allow us to probe trade-offs.
      *   **vNM Independence vs. Arrow's IIA:** Arrow's IIA *prevents* the use of any intensity information (even ordinal comparisons involving third alternatives). Harsanyi's vNM Independence *enables* the linear structure that makes aggregation possible. They are conceptually opposites: IIA restricts information, vNM Independence imposes structure.
      *   **Strength of Pareto over Lotteries:** The linearity forced by Pareto over the lottery domain is incredibly powerful. It directly implies the linear aggregation form.

  2.  **Do Harsanyi's weights imply equal weighting?**
      *   **Absolutely not.** Harsanyi's theorem **does not deliver equal weights** `(w_i = w_j)` on its own. It delivers a *weighted* sum. The weights `w_i` are determined by the social preference relation satisfying the axioms *relative to the individual utility functions*. The theorem proves the *form* (weighted sum) but not the specific weights.
      *   **Interpersonal Comparability Level:** Harsanyi's theorem operates at a level of **Cardinal Non-Comparability (CNC)** or **Cardinal Unit Comparability (CUC)**, *not* full comparability. Individual utilities are unique only up to positive affine transformations (`u_i' = a_i*u_i + b_i`). The social welfare function `W = Σ w_i * U_i` is invariant only if we apply the *same* affine transformation to *all* individuals (`a_i = a`, `b_i = b` for all `i`), which corresponds to **Cardinal Unit Comparability (CUC)**. This allows comparison of utility *differences* (`u_i(x) - u_i(y)` vs. `u_j(x) - u_j(y)`) but not absolute levels. Crucially:
          *   If you transform individual `i`'s utility to `u_i' = a_i*u_i + b_i` (different `a_i`), the original social welfare function `Σ w_i * U_i` is no longer valid. You need to use transformed weights `w_i' = w_i / a_i` and adjust the constant term to maintain representability. The *relative weights* `w_i / w_j` change unless `a_i = a_j`.
          *   **Equal weights require stronger assumptions:** To get `w_i = w_j` for all `i, j`, you need an additional axiom like **Anonymity** or **Symmetry** (social preference is invariant under permutation of individual identities). This imposes **Cardinal Full Comparability (CFC)**, where the zero and unit of measurement are comparable across individuals. Harsanyi's theorem *does not include* such an axiom. The weights reflect the "ethical" weights embedded in the social preference relation defined over lotteries; anonymity forces those ethical weights to be equal.

  **In Summary:**

  The shift from Arrow's impossibility to Harsanyi's utilitarian aggregation hinges on the move from **ordinal preferences over outcomes** to **vNM cardinal preferences over lotteries**. This change:

  1.  **Provides Intensity Information:** vNM utilities capture strength of preference within an individual.
  2.  **Changes the Meaning of Independence:** vNM Independence imposes linear structure, enabling aggregation, while Arrow's IIA discards potentially useful information.
  3.  **Supercharges the Pareto Principle:** Applied over lotteries, Pareto forces social preferences to inherit the linear structure of individual preferences, directly leading to the weighted sum form.
  4.  **Allows Meaningful Weights (but not Equal Weights):** The combination of linear individual utilities, linear social preferences (forced by Pareto), and the aggregation theorem implies social welfare is a weighted sum of individual utilities. The weights `w_i` exist and are non-negative, but they are **not necessarily equal**; equal weighting requires an additional symmetry/anonymity assumption imposing stronger interpersonal comparability (CFC).

  Harsanyi's theorem shows that *if* social preferences over lotteries satisfy the vNM axioms *and* respect individual vNM preferences via the Pareto principle over lotteries, *then* social welfare *must* be a weighted utilitarian sum of individual vNM utilities. Arrow's theorem shows that *if* you only have ordinal preferences and demand IIA (which discards intensity), Pareto, and non-dictatorship, *then* no consistent social ranking exists. The richness of the vNM preference domain and the structural nature of vNM independence are the keys that unlock the possibility—and uniqueness of form—in Harsanyi's framework.
