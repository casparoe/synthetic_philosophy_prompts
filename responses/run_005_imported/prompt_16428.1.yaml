  Looking at move (1), Elena makes a reasonable point about risk indicating commitment. In biology, costly signals like extravagant tails do show fitness because only healthy animals can afford them. But Diego counters in move (2) with a crucial technical point about signal receivers - in Mark's case, it's unclear who the intended audience is. Galleries and buyers aren't actively observing his sacrifice like peahens evaluating tails.

