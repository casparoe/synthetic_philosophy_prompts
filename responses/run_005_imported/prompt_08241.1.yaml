  ## The Unseen Thread: Berkeley's Metaphysics Woven Through *The Querist*

  Your discovery of *The Querist* presents a fascinating puzzle. On the surface, Berkeley's shift from the ethereal realms of immaterialism to the gritty realities of Irish poverty and coin shortages seems jarring. Yet, the resonance in his method – stripping away perceived substance to reveal underlying relations – is undeniable. While the Irish economic crisis provided the immediate context, I argue that Berkeley's monetary theory in *The Querist* is not merely coincidentally similar to his immaterialism; it represents a genuine, though undeclared, extension of his core metaphysical principles into the socio-economic sphere, driven by a consistent intellectual strategy of ontological reductionism. The resemblance rests on a deeper methodological and ontological kinship, not just a superficial rhetorical trick.

  **The Case for Coincidence: Pragmatism Over Principle**

  The strongest argument against a deep connection emphasizes historical context and intellectual precedent. Ireland in the 1730s was indeed gripped by a severe monetary crisis. Absentee landlords draining coin to England, an unfavorable trade balance, a chronic lack of specie, and widespread poverty were tangible, urgent problems demanding practical solutions. Berkeley, as a concerned Anglo-Irish intellectual and later Bishop of Cloyne, engaged directly with these issues. His arguments in *The Querist* – that money is merely a "ticket" or "counter," that true wealth lies in land, labor, and industry – were not revolutionary concepts born of idealism. They echoed mercantilist and proto-classical economic thinkers like Sir William Petty ("Political Arithmetick") and John Locke ("Some Considerations of the Consequences of the Lowering of Interest...").

  Petty emphasized land and labor as the foundations of wealth, while Locke explicitly argued that the value of money is primarily a function of consent and its role as a counter, not intrinsic worth. Berkeley's plan for a national bank issuing paper credit based on land was a practical response to Ireland's specific lack of specie, mirroring contemporary debates about credit and banking elsewhere. Proponents of this view argue that Berkeley, the pragmatic reformer, simply adopted the best economic arguments of his time to address Ireland's plight. The rhetorical move of redefining a familiar concept (money) as less "real" than assumed was a common tool in economic discourse, deployed without any necessary link to metaphysical idealism. The "substance" denied in economics (intrinsic value in coin) is a fundamentally different category from the "substance" denied in metaphysics (material substratum). One is a social construct, the other a philosophical postulate. The similarity, therefore, is superficial, stemming from a general skeptical tendency Berkeley possessed, rather than a deliberate application of his *esse est percipi* metaphysics.

  **The Case for Connection: Methodological Unity and Ontological Reduction**

  However, the parallels run deeper than mere shared skepticism or rhetorical style. The connection lies in Berkeley's fundamental *method* and the *structure* of his arguments, revealing a consistent ontological reductionism:

  1.  **Dethroning the "Substance":** In the *Dialogues*, Berkeley's core strategy is to dismantle the concept of "matter" as an unperceived, inert substance underlying perceived qualities. He argues this substance is an unnecessary abstraction, a "phantom," and that reality consists solely of ideas (qualities) and the spirits that perceive them. *Esse est percipi* eliminates the hidden substratum. In *The Querist*, he performs an analogous operation on "money." Gold and silver coin are stripped of their supposed intrinsic value as "wealth-substance." He reduces them to mere "tickets," "counters," or "measures" (Querist 23, 35, 441). Their value isn't inherent in the metal but is purely relational and functional, dependent on social consent and their role in facilitating exchange. Just as matter is demoted from substance to perceived idea, coin is demoted from wealth-substance to social token. The "hidden reality" in both cases is exposed as an illusion.
  2.  **Redefining the Core Concept as Relation/Power:** Having dismissed the "substance," Berkeley redefines the core concept in relational and active terms. In metaphysics, the reality of an object *is* its being perceived – a relation between the idea and the perceiving spirit. Its qualities are powers to produce sensations. In economics, Berkeley redefines "wealth" itself not as a stockpile of coin (the false substance), but as the "Power of commanding the Industry of others" (Querist 330). Wealth is active potential, the ability to mobilize labor and resources. It's a relational concept – power *over* others' industry – just as the reality of an object is its relation *to* a perceiver. True wealth, like the true reality of an object, lies not in inert stuff but in active capacity and relation. "Whether the real wealth be not the industry of the inhabitants and the produce of that industry?" (Querist 134) echoes the shift from inert matter to active perception.
  3.  **The Primacy of Spirit/Agency:** Berkeley's immaterialism centers reality on active spirits (minds) and the ideas they perceive. Passive matter has no place. *The Querist* mirrors this emphasis on agency. The true source of value is not passive coin, but the active "industry" of the people – their labor, skill, and productive capacity (Querist 2, 6, 134). Just as spirits are the perceiving/creating agents in metaphysics, the laboring population is the productive agent generating wealth in economics. The national bank proposal, issuing paper credit based on the *potential* of the land and the industry of the people, further underscores this reliance on active potential and trust (a form of mental/spiritual consensus) rather than inert metallic substance.
  4.  **A Consistent Intellectual Strategy:** Berkeley wasn't merely applying a rhetorical trope; he was deploying his signature philosophical method: identifying a prevalent but mistaken belief in a hidden substance or intrinsic property, demonstrating its incoherence or redundancy, and replacing it with a definition grounded in perception, relation, and activity. This method, honed in metaphysics, naturally extended to his analysis of society and economy when confronted with Ireland's problems. The "unreality" of matter and the "unreality" of money's intrinsic value both stem from the same core Berkeleyan insight: that we mistake abstractions and tokens for substantial realities, obscuring the true nature of existence (perception and spirit) and value (industry and power).

  **The Verdict: A Genuine, Methodological Extension**

  While the Irish crisis provided the immediate impetus and practical vocabulary, and while Berkeley drew on contemporary economic discourse, the **deep structure and driving force of his argument in *The Querist* are profoundly shaped by his immaterialist metaphysics.** It is not that he explicitly applied *esse est percipi* to coin. Rather, the same intellectual engine that powered his critique of matter – ontological reductionism, the rejection of inert substance in favor of active relations and perceiving/productive agency – powered his critique of mercantilist fetishism of specie.

  The resemblance is not superficial because it rests on the same *type* of "unreality": the unreality of a falsely postulated independent substance. Denying the independent existence of matter apart from perception and denying the independent value of coin apart from its social function are both instances of Berkeley exposing what he sees as fundamental category errors. His solution in both domains is relational: reality *is* perception; wealth *is* the power to command industry.

  Therefore, **yes, Berkeley's economic writing in *The Querist* should be read as a genuine, though undeclared and contextually driven, extension of the core methodological and ontological principles underpinning his immaterialism.** It demonstrates how his radical philosophical vision informed his practical engagement with the world, revealing a consistent thinker who sought to dismantle illusions of substance wherever he found them, whether in the study of perception or the circulation of coin. The "ticket" of money finds its philosophical counterpart in the perceived idea; both are tokens pointing beyond themselves to the true sources of reality and value: active spirit and productive industry.
