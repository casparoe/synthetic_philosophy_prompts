  Okay, let me approach this complex IP dispute methodically. The core tension mirrors the philosophical debate described - problem framing versus solution execution. The student claims inventorship based on developing the specific polymer blend and fabrication sequence that solved the degradation issue, while the supervisor asserts rights based on initiating the project direction and proposing initial materials.

  First, I need to establish the legal framework. Patent inventorship hinges on conception - the mental act of formulating the complete, operative invention. Under US law (which likely governs given the university context), joint inventorship requires collaboration and mutual contribution to the inventive concept. Mere supervision or funding doesn't qualify, nor does proposing a general approach that fails.

  The supervisor's position has three elements: suggesting microneedles for diabetes, securing funding, and proposing initial polymers. The first two are clearly not inventive acts under patent law. The polymer proposal seems more relevant but failed technically - his materials degraded too quickly. The student's breakthrough was independently developing the functional polymer blend and fabrication method after this failure.

  Key precedent: Burroughs Wellcome v. Barr Labs established that conception requires showing how to achieve the result, not just desiring it. Here, the supervisor's initial polymer suggestion couldn't produce the controlled release result. The student's solution was non-obvious and unexpected (noted by the surprise factor).

  For the committee memo, I'll structure it to: 1) clarify the legal standard, 2) analyze facts against that standard, 3) recommend sole student inventorship with supervisor acknowledgement, 4) propose urgent filing process. Need to validate the "surprise" element as it indicates non-obviousness. Also must address lab custom diplomatically - practices can't override patent law.

  Timeline is critical with the conference deadline. Should recommend provisional patent filing within 10 days, using existing disclosure with minor amendments. Supervisor could be credited in "background" section while excluded from claims. This balances legal rigor with academic relationships.
answer: |-
  ## Memorandum: Inventorship Determination for Microneedle Patch Project (Ref: IPC-2024-BME-07)

  **To:** Intellectual Property Committee Members  
  **From:** [Your Name], IPC Member  
  **Date:** October 26, 2023  
  **Subject:** Urgent Recommendation on Inventorship Dispute & Pre-Conference Patent Filing  

  ### I. Executive Summary
  Based on applicable legal standards governing patent inventorship (primarily US law, as the foundation for international priority), the committee recommends **naming the doctoral student as the sole inventor** for the dissolvable microneedle insulin patch. While Professor [Supervisor's Name]'s contributions (problem framing, funding, initial polymer suggestion) were essential to the project's existence, they do not meet the threshold for legal co-inventorship. We propose immediate steps to file a provisional patent application within 10 days, ensuring protection prior to the student's conference presentation. Professor [Name]'s role should be formally acknowledged in the patent background and any publications.

  ### II. Legal Framework for Inventorship
  US patent law (35 U.S.C. § 116, reinforced by *Burroughs Wellcome Co. v. Barr Labs., Inc.*, 40 F.3d 1223 (Fed. Cir. 1994)) defines inventorship strictly:
  *   **Conception is Paramount:** An inventor must contribute to the "conception" of the invention – the "complete performance of the mental part of the inventive act" defining the solution in sufficient detail that one skilled in the art could practice it without extensive further innovation.
  *   **Reduction to Practice ≠ Conception:** Building/proving the invention (reduction to practice) is valuable but secondary; conception is the core inventive act.
  *   **Joint Inventorship:** Requires collaboration and contribution to at least one claim in the patent. Supervisory input, funding, or proposing general approaches that fail do not qualify.

  ### III. Analysis of Contributions Against Legal Standard
  1.  **Doctoral Student:**
      *   **Conception:** Developed the *specific, functional polymer blend and fabrication sequence* enabling controlled insulin release – the core novelty overcoming the fatal flaw (rapid degradation) of the initial approach. This defines the operative solution (the invention).
      *   **Reduction to Practice:** Built and tested the functional device.
      *   **Legal Status:** Sole contributor to the conception of the operative solution claimed in the disclosure. **Meets inventorship standard.**

  2.  **Professor [Supervisor's Name]:**
      *   **Problem Framing:** Proposed applying microneedles to diabetes management. *Legally Insufficient:* This is a research direction, not a specific solution. Microneedles for drug delivery were prior art.
      *   **Funding & Resources:** Secured grants and lab infrastructure. *Legally Insufficient:* Provides opportunity, not conception.
      *   **Initial Polymer Suggestion:** Proposed a family of materials at a lab meeting. *Legally Insufficient:* This suggestion *failed* (materials degraded too quickly). It did not provide a solution enabling controlled release; it was a starting point the student had to invent *beyond*. The "surprise" at the failure underscores its non-enabling nature.
      *   **Lab Practice:** Customary inclusion on patents cannot override statutory inventorship requirements.
      *   **Legal Status:** Contributions were preparatory, supervisory, and ultimately non-enabling for the *specific solution*. **Does not meet inventorship standard.**

  ### IV. Recommended Resolution
  1.  **Inventorship:** The doctoral student is the **sole inventor** on the patent application. Her conception and reduction to practice of the novel polymer blend and fabrication sequence constitute the inventive act.
  2.  **Acknowledgement of Supervisor:** Professor [Name]'s critical role in initiating the project and providing guidance must be formally recognized:
      *   Listed in the "Background" section of the patent.
      *   Included as a co-author (non-inventor) on any publications resulting directly from the patent disclosure.
      *   Explicitly acknowledged in the student's conference presentation.
  3.  **Committee Communication:** The Chair should meet privately with Professor [Name] to explain the legal rationale, acknowledge his vital project role, and emphasize that this determination reflects patent law, not a diminution of his contribution. The student should be informed of the decision and the importance of acknowledging her supervisor appropriately.

  ### V. Urgent Filing Process & Timeline (Pre-Conference)
  *   **Days 1-2 (Immediate):**
      *   Committee ratifies inventorship determination (email vote acceptable given urgency).
      *   IPC Chair briefs student and Professor [Name] (separately).
      *   University Tech Transfer Office (TTO) drafts provisional patent application based on student's disclosure, incorporating supervisor's contribution in Background.
  *   **Days 3-5:**
      *   Student reviews draft application for technical accuracy.
      *   TTO incorporates final edits.
      *   TTO conducts final formal review.
  *   **Day 6-7:**
      *   Student executes inventor declaration/assignment documents.
      *   Application finalized for filing.
  *   **Day 8-10 (Absolute Deadline):**
      *   **File Provisional Patent Application (USPTO).**
  *   **Post-Filing (Before Conference):**
      *   TTO confirms filing receipt.
      *   Student cleared for public presentation (ensure she understands disclosure limits beyond what's filed).

  ### VI. Addressing the Supervisor's Position
  Professor [Name]'s objection is taken seriously as substantive. His perspective – that setting the direction and initial parameters constitutes the fundamental creative leap – resonates deeply within research management. However, patent law draws a clear distinction between identifying a valuable problem/providing resources and conceiving the specific solution that solves it. His proposed materials did not achieve the desired result; the student's inventive step did. While his contributions were indispensable for the project's genesis and execution, they fall into categories explicitly excluded from legal inventorship under established precedent. This outcome protects the university's IP rights by ensuring the patent accurately reflects the source of the novel, non-obvious contribution.

  ### VII. Conclusion
  Resolving inventorship based on legal standards protects the university's interests and the integrity of the patent. The doctoral student conceived the operative solution and is the sole inventor. Professor [Name]'s essential role warrants formal acknowledgement. Immediate action to file a provisional patent within the next 10 days is critical to secure international IP rights before the conference disclosure. I recommend the committee endorse this resolution and authorize the TTO to proceed on the accelerated timeline.
