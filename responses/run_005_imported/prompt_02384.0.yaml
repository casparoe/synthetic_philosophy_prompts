  Skolem’s real target was Hilbert-style formalism. If axioms can’t fix the meaning of "set" or "uncountable," then set theory doesn’t provide a stable foundation—it’s just more syntax. The user’s suggested reply ("it’s just a FOL quirk") misses this: the relativity infects *all* notions, not just uncountability. 

