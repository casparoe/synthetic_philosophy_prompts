  - Recognizable to experts but accessible to laypeople 

  Why Kripke? Gap theories create great narrative tension - things becoming "neither true nor false" feels like fading from existence. The contamination angle (Sentence 7 infecting others) visualizes how paradox spreads. Also, "indeterminate" status forces characters to ACT rather than compute.

  Plot mechanics: 
