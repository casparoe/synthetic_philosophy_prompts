answer: |-
  Here's a reconstruction of Sidgwick's reasoning, integrating the philosophical, biographical, and empirical strands you highlighted, explaining why empirical evidence was *necessary* rather than merely convenient, and addressing the significance of his late admissions:

  1.  **The Nature of the Dualism and the Requirement for Resolution:**
      *   Sidgwick identified a fundamental conflict: Rational Egoism (maximizing one's own happiness) and Utilitarianism (maximizing universal happiness) are both demonstrably rational principles derived from self-evident intuitions (benevolence and prudence). Yet, they can prescribe radically different courses of action.
      *   This wasn't just an academic puzzle; it threatened the very coherence of a rational "Cosmos of Duty." If both principles are equally ultimate and irreconcilable, practical reason is fundamentally fractured. Ethics loses its claim to provide a single, authoritative guide to action.
      *   Sidgwick believed ethics *required* a rational harmony. He sought a "proof" that would reconcile the two principles or demonstrate the supremacy of one, restoring rational unity.

  2.  **Why Kantian Postulates Were Insufficient:**
      *   Sidgwick was deeply skeptical of Kant's strategy of adopting postulates (God, freedom, immortality) based *solely* on the practical needs of morality ("I must, therefore I can").
      *   His philosophical method was rigorously **empiricist and intuitionist**. He demanded *evidence* for fundamental beliefs, not leaps of faith justified by desire or practical necessity. Postulates felt like intellectual dishonesty – a violation of his commitment to **clarity and demonstrable truth**.
      *   He saw Kant's approach as reintroducing the very dogmatism he (Sidgwick) had worked to purge from ethics. It begged the question: Why should practical necessity dictate metaphysical belief? Sidgwick needed an *independent reason* to believe in the harmony, not just a moral wish.
      *   **The Key Philosophical Point:** A postulate adopted *only* because it resolves the dualism is circular and lacks independent justification. Sidgwick sought an *external*, objective guarantee of the harmony between virtue and happiness – something discoverable *about the universe itself*.

  3.  **The Empirical Solution: Guaranteeing the Harmony:**
      *   Sidgwick reasoned that the dualism could be resolved if he could demonstrate that the universe is structured such that **acting on the utilitarian principle reliably leads to the maximization of one's *own* happiness**, either in this life or beyond.
      *   **Utilitarian Supremacy Route:** If empirical evidence showed that self-sacrifice for the greater good *invariably* leads to greater personal happiness (e.g., through divine reward, karmic law, or inherent psychological laws), then Utilitarianism subsumes Egoism.
      *   **Harmonious Order Route:** Evidence for a morally governed universe (e.g., a theistic God ensuring justice, or a karmic law) could guarantee that fulfilling one's moral duty *is* the path to one's own greatest good, making the two principles converge in practice.
      *   **The Role of Psychical Research:** Specifically, evidence for **survival of death** and a **future state of rewards/punishments** tied to moral conduct offered the most direct empirical path to guaranteeing this harmony. If the self persists beyond death and its happiness is determined by its moral actions, then the rational egoist must act morally (utilitarianly) to maximize their *total* happiness. Telepathy and mediumship were pursued as *evidence* potentially supporting the reality of survival and communication with discarnate intelligences, pointing towards that morally ordered post-mortem existence.

  4.  **Why Empirical Evidence was *Necessary*: The Trinity Resignation (1869):**
      *   Sidgwick's resignation from his Trinity Fellowship over the requirement to subscribe to the Thirty-Nine Articles is crucial context. He felt compelled to resign because he could no longer honestly affirm doctrines (like eternal punishment) he found unsupported by evidence.
      *   **The Integrity Imperative:** This act cemented his lifelong commitment to **intellectual honesty above all else**. He refused to base his beliefs or professional position on unproven dogma. Applying this to ethics:
          *   He could not accept religious doctrines (like divine justice) as the *basis* for resolving the dualism without evidence – that would be repeating the Trinity Articles compromise.
          *   He could not accept Kantian postulates – adopting them purely on practical grounds felt like another form of intellectual dishonesty, akin to subscribing to dogma for career convenience.
      *   **Necessity, Not Convenience:** Therefore, empirical evidence wasn't just a *convenient* alternative; it was the *only* path consistent with his foundational commitment to basing belief on demonstrable evidence and avoiding dogma. An empirical solution offered the possibility of a resolution grounded in *reality*, not wishful thinking or pragmatic fiat. It was necessary to preserve the intellectual integrity of his entire ethical project.

  5.  **The Late Admissions and Their Significance:**
      *   Sidgwick's repeated late-life admissions that his psychical research failed to provide the evidence he sought ("never given him what he was looking for") are profoundly important and consistent with his character.
      *   **Honesty and Despair:** They demonstrate his unwavering intellectual honesty. Despite decades of effort and deep personal hope for a resolution, he refused to pretend the evidence was there when it wasn't. It underscores the depth of his despair about the unresolved dualism.
      *   **Validation of the Empirical Stance:** Paradoxically, these admissions *validate* his insistence on empirical evidence. He didn't resort to postulates when the evidence failed. He accepted the negative result, however painful, because his commitment to truth outweighed his desire for a tidy resolution. The lack of evidence *was* the result, and he reported it faithfully.
      *   **The Enduring Problem:** His admissions highlight the unresolved nature of the dualism. The failure of the empirical search meant he died believing the fundamental conflict in practical reason remained, leaving ethics in a state of potential "Chaos." The empirical route was necessary *for him*, but it proved fruitless.

  **Reconstructing the Argument:**

  1.  **Premise 1:** Rational Egoism and Utilitarianism are both fundamental, self-evident principles of practical reason.
  2.  **Premise 2:** These principles can conflict, leading to a "Dualism" that threatens the rational coherence of ethics ("Chaos").
  3.  **Premise 3:** A rational "Cosmos of Duty" requires demonstrating the ultimate harmony or supremacy of these principles.
  4.  **Premise 4 (Methodological Commitment):** Beliefs must be grounded in evidence and clear intuition; accepting postulates based solely on practical need or religious dogma violates intellectual integrity (as demonstrated by the Trinity Resignation).
  5.  **Premise 5:** The Dualism can be resolved if the universe is structured such that acting utilitarially maximizes the agent's own total happiness (e.g., through a future state of rewards/punishments).
  6.  **Conclusion 1 (Necessity of Empirical Route):** Therefore, *only* empirical evidence demonstrating the structure described in Premise 5 can resolve the Dualism in a way consistent with intellectual integrity (Premise 4). Kantian postulates or religious faith are insufficient and violate integrity.
  7.  **Action:** Pursue empirical research (psychical research) to find evidence for survival and a morally governed afterlife.
  8.  **Outcome:** The research failed to provide conclusive evidence (Sidgwick's late admissions).
  9.  **Conclusion 2:** Therefore, the Dualism of Practical Reason remains unresolved, leaving the "Cosmos of Duty" under threat of "Chaos."

  In essence: Sidgwick's unwavering commitment to intellectual honesty, forged in the crucible of the Trinity resignation, demanded that the fundamental harmony of ethics be discoverable *in the fabric of reality itself*, not imposed by wishful thinking or practical fiat. The failure of psychical research to reveal that harmony was a profound personal and philosophical disappointment, but his honest admission of that failure stands as a testament to the very integrity that drove the search in the first place. The dualism remained, empirically unassuaged.
