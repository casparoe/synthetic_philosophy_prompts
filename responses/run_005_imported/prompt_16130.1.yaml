answer: |-
  That's an **excellent** connection! You've pinpointed a fascinating tension in moral philosophy that spans millennia. Let's break down why Mencius would likely **push back strongly against Singer**, seeing him as a modern Mozi, despite the superficial similarity of their thought experiments:

  1.  **The Core Difference: What the Thought Experiment Proves**
      *   **Mencius (Child at the Well):** His primary goal is **anthropological/psychological**. He's demonstrating the *existence* of an innate, spontaneous moral impulse ("sprout" of benevolence - *ren*). This impulse *proves* human nature is fundamentally good. It's about **describing human moral psychology**.
      *   **Singer (Drowning Child):** His goal is **prescriptive/normative**. He uses the intuitive reaction to the nearby drowning child to establish a *universal moral principle*: "if it is in our power to prevent something very bad from happening, without thereby sacrificing anything morally significant, we ought, morally, to do it." The distance/relationship is irrelevant *to the moral obligation itself*. It's about **defining ethical duty**.

  2.  **Mencius vs. Mozi (and by extension, Singer):**
      *   **Mencius's Core Critique of Mozi:** Mencius vehemently opposed Mozi's doctrine of "impartial care" (*jian ai*). He argued:
          *   **Psychological Impossibility:** Humans simply *cannot* feel the same intensity of care for a stranger as they do for their own child or parent. Trying to force this is unnatural and leads to emotional impoverishment.
          *   **Destroys Natural Relationships:** Graded love (*you cha deng* 有差等) isn't a flaw; it's the foundation of social harmony. Specific virtues (filial piety, parental love, loyalty) arise *from* and *depend on* these specific relationships. Impartial care dissolves these bonds.
          *   **Impractical & Undermines Motivation:** Insisting on equal love for all makes fulfilling the *strongest* duties (to family) impossible and drains the motivation to fulfill *any* duties effectively. It leads to neglect of those closest to you in a futile attempt to care for everyone equally.
      *   **Singer as Modern Mozi:** Singer explicitly argues that physical distance and lack of personal relationship are *morally irrelevant* factors when determining our obligation to prevent suffering/death. The principle derived from the drowning child must apply globally. This is precisely the kind of *impartiality* Mencius attacked in Mozi. Singer would say the "graded" feeling is understandable but morally irrelevant bias; Mencius would say the graded feeling *is* the natural moral structure.

  3.  **How Mencius Would Likely Respond to Singer:**
      *   **Agreement on the Sprout:** Mencius would agree with Singer that the spontaneous alarm/compassion at the drowning child (or the child near the well) reveals the innate *sprout* of benevolence (*ren*) in human nature. This is good!
      *   **Fierce Disagreement on the Implication:** This is where he'd part ways sharply:
          *   **Natural Gradation is Moral:** Mencius would argue that the *diminishing* intensity of feeling as distance (physical or relational) increases isn't a moral failing to be overcome, but the *natural and proper expression* of benevolence. Our strongest duties lie where our feelings are strongest and our capacity to act effectively is greatest (within our family, community).
          *   **Proximity & Relationship ARE Morally Significant:** Precisely *because* our natural compassion is triggered most powerfully by immediacy and connection, these factors *do* matter morally. They indicate where our primary moral energy should be directed. Ignoring them is unnatural and counterproductive.
          *   **Duty Arises from Relationship:** Our deepest obligations arise from specific roles and relationships (parent-child, ruler-minister, etc.). A generalized duty to "prevent bad things" regardless of relationship dissolves these concrete duties. Saving a stranger *is* praiseworthy, but it doesn't carry the same *weight* or *obligation* as saving your own child.
          *   **Practicality & Sustainability:** Mencius would likely argue Singer's demand for radical impartiality is unsustainable, leads to burnout or resentment, and ultimately weakens the bonds necessary for a stable, compassionate society. The "extension" (*tui* 推) of benevolence from family outward is gradual and context-dependent, not a flat, universal obligation of equal intensity.

  **Conclusion: Opposites Masquerading as Twins**

  Your instinct is correct. While both use the "child in immediate peril" scenario to trigger an intuitive moral response, **they use it to prove fundamentally opposite points about the nature of moral obligation.**

  *   **Mencius:** Uses it to prove *innate goodness exists*, which *naturally expresses itself in a graded structure of care* based on relationship and proximity. This structure is morally foundational.
  *   **Singer:** Uses it to prove a *universal, impartial moral principle* that *deliberately ignores* relationship and proximity as morally relevant factors. Distance/relationship are biases to be overcome.

  Mencius would see Singer's essay as a brilliant confirmation of the existence of the "sprout" of benevolence, but then a disastrous philosophical error in trying to universalize and impartialize that feeling in a way that ignores human nature and destroys the fabric of natural relationships. He'd see Singer as Mozi reincarnated. They are **philosophical opposites** on the crucial question of whether relationship and proximity matter morally. The shared starting point highlights the deep difference in their conclusions. Great catch!
