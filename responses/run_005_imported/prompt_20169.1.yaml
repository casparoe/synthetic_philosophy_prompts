prompt: |-
  So I've fallen down a bit of a rabbit hole reading old rationalist-community stuff (LessWrong, the Center on Long-Term Risk crowd, that general orbit) for a grad seminar on rational agency and threats I'm putting together, and there's one move in the acausal-blackmail literature I can't fully make sense of: the "surrogate goal" trick. As I understand it, an agent worried about being acausally threatened -- by predictors, distant superintelligences, whatever agent is able to model it well enough to make a credible threat with no causal contact at all -- can protect its actual values by manufacturing an extra goal it doesn't really care about, and then behaving as though it cares about that fake goal a great deal. The hope is that a rational threatener goes after the decoy instead of the real thing, since the decoy is the only lever that actually gets a response out of the agent.

  What I keep getting stuck on is why this doesnt just unravel the moment a threatener is sophisticated enough to have modeled the agent that precisely in the first place. If it can predict the agent well enough to threaten it acausally, why can't it also tell the surrogate goal is fake and go straight for the real target? And theres a regress worry on top of that: if I can just gin up an extra "goal" out of nothing to absorb threats, doesn't that suggest my supposedly ironclad refusal to ever negotiate over my real goals might also be softer than advertised, in a way a sufficiently good adversary could exploit? Could you walk me through the actual game-theoretic mechanics of why surrogate goals are supposed to work as a defense here, ideally with a toy example where the incentives are spelled out? The one-paragraph gloss you get in blog posts is about as far as I've gotten on my own, and it's not cutting it.
reasoning: |-
  We are dealing with a scenario of acausal threats, where an agent (the defender) is worried about being threatened by a predictor (the threatener) that can model the defender perfectly. The defender creates a surrogate goal (a decoy) that it pretends to care about deeply, hoping that the threatener will target this decoy instead of the defender's true values.

   The key question: Why can't a sophisticated threatener, which can model the defender perfectly, see through the ruse and target the real goal?

   The answer lies in the fact that the defender's strategy is not just about having a decoy but about committing to a policy that makes the decoy effective. The defender commits to a policy that, if threatened on the decoy, it will yield (to avoid the threat) but if threatened on the real goal, it will not yield. The threatener, being rational, will only issue a threat if it expects the defender to yield. Therefore, the threatener will only threaten on the decoy because that is the only lever that gets a response.

   However, the threatener can see the entire setup. So why doesn't it threaten the real goal anyway? Because the defender has committed to not yielding on the real goal. Therefore, if the threatener threatens the real goal, the defender will not yield, and the threatener will have to carry out the threat (which is costly for the threatener, because the threatener is assumed to have some cost for carrying out the threat) and also the defender's real goal is harmed (which the threatener might not care about, but the threatener does care about its own costs). 

   The threatener's goal: We assume the threatener has some goal that involves the defender yielding to the threat. The threatener might be motivated by extracting some concession (which in the decoy case would be about the decoy) or by some other objective. However, if the threatener threatens the real goal, the defender does not yield, so the threatener gets nothing and pays the cost of carrying out the threat. Therefore, it is not rational for the threatener to threaten the real goal.

   But then why doesn't the threatener see that the decoy is fake and therefore not threaten at all? Because the defender has set up the decoy to be something that the defender will yield on. So the threatener can get a concession by threatening the decoy. Even if the threatener knows the decoy is fake, it can still get the defender to yield on the decoy. The threatener doesn't care about the defender's true values; it only cares about being able to get the defender to do something (and perhaps about the cost of carrying out the threat). So if the threatener can get the defender to yield on the decoy, that might be sufficient for the threatener's purpose (if the threatener's goal is, say, to get the defender to do X, and the decoy is set up such that yielding on the decoy involves doing X, then the threatener gets what it wants).

   However, the problem of regress: If the defender can create a decoy, why can't the threatener also see that the defender might have multiple layers? And why can't the defender's real goal be threatened if the threatener can force the defender to reveal that it does care about the real goal by making a threat so terrible that the defender breaks the commitment?

   The commitment is key. The defender must precommit to a policy that is rigid: it will never yield on the real goal. This commitment must be credible. How? The defender must design its decision algorithm so that it is physically impossible (or extremely costly) to yield on the real goal. In the context of AI, this might be done by hard-coding the algorithm to ignore any threats to the real goal and only respond to threats on the decoy.

   But then the threatener, seeing this hard-coded policy, would know that threatening the real goal is futile and only threatening the decoy works. So it will threaten the decoy.

   However, the defender doesn't actually care about the decoy. So when the threatener threatens the decoy and the defender yields, the defender loses nothing of real value. The threatener gets the concession (which is about the decoy) and the defender's real goal is untouched.

   Why doesn't the threatener, knowing that the decoy is fake, not bother? Because the threatener might still get some benefit from the concession. For example, the concession might be that the defender pays the threatener some resource. The threatener values that resource. The fact that the defender doesn't value the decoy doesn't matter to the threatener as long as the threatener gets what it wants.

   Now, the regress worry: If the defender can create a decoy, why can't it create multiple decoys? And why can't the threatener threaten the real goal by making a threat that is so large that it would also harm the real goal? But note that the defender's policy is to never yield on the real goal. So even if the threat is huge, the defender will not yield. The threatener, knowing that, won't make the threat because it would have to carry it out and pay the cost without getting any concession.

   However, if the threatener can make a threat that only harms the real goal and not the decoy, then it might try. But the defender's commitment is that it will ignore such threats. The threatener, seeing that the defender will not yield, will not make the threat.

   Let's formalize this with a toy example.

   Players: Defender (D) and Threatener (T).

   The game:
     - T chooses whether to threaten D and on which issue: the real goal (R) or the surrogate goal (S). We assume that T can threaten only one issue at a time (for simplicity).
     - If T threatens, it must also choose a demand (which we can think of as a concession from D). For example, if threatening S, T might demand that D pays 1 unit of resource to T.
     - D then chooses to yield or not yield.
     - If D yields, the concession is implemented and T gets the benefit (say, +b) and D incurs the cost of the concession (which for S is 0 in terms of R, but we'll assign a cost in terms of the surrogate: D loses 1 unit of S-resource, which D doesn't care about, but T gets the resource). If the threat was on R, yielding would mean D loses some real value (say, -c_R) and T gets some benefit (maybe the same b, because T might just want the resource regardless of the issue).
     - If D does not yield, T must decide whether to carry out the threat (which we assume T commits to in the threat). Carrying out the threat costs T some amount (say, -t) and harms D: if the threat was on R, D loses a lot (say, -L_R) and if on S, D loses a lot on S (say, -L_S). Note that D doesn't care about S, so -L_S is 0 to D in real terms. But T incurs the cost -t regardless.

   The defender's true utility:
     - U_D = [state of R] 
     - The state of S does not matter.

   The threatener's utility:
     - We assume T wants to get the concession (so +b if the concession is obtained) and also cares about the cost of carrying out the threat (-t if it has to carry out the threat). T does not care about R or S per se, only about the concession and its own costs.

   The defender's commitment:
     - D has precommitted to the following policy:
          - If threatened on S and the demand is to give up some S-resource, then D will yield (because D doesn't care about S, so giving up the resource is free, but if it doesn't yield, T will carry out the threat and D will lose nothing in real terms but T will be hurt, and D might want to avoid causing harm to T? But note: D doesn't care about T either. However, if D doesn't yield on S, then T will carry out the threat and destroy S. But that doesn't harm D. So why yield? Because D wants to maintain the credibility of the decoy? Actually, we must design the decoy so that D has a reason to yield. How? By making the decoy something that D can afford to lose but also by making the decoy valuable enough to the threatener that the threatener would be willing to carry out the threat if D doesn't yield? But note: if D doesn't yield on S, T will carry out the threat and destroy S, which costs T -t and gives D 0 disutility. So D is indifferent. However, if D is indifferent, then T cannot rely on D yielding. Therefore, the decoy must be set up so that D has a small cost for yielding (maybe the act of yielding is slightly costly in terms of real resources? but we said the concession on S doesn't cost real resources). Alternatively, we can assume that D has a tiny intrinsic concern for the decoy? But that might weaken the real goal.

   Alternatively, we can think of the decoy as being a resource that D can use to pay the threatener without affecting R. Then, if D yields, it loses a little bit of a resource that doesn't affect R. If D doesn't yield, T destroys a lot of S, but again that doesn't affect R. So D is indifferent. Then D might as well yield to avoid the threatener having to pay the cost? But D doesn't care about T.

   This is a problem. To make the decoy work, we must have D care a tiny bit about the decoy? Or we must assume that the threatener's threat on S also has a small chance of harming R? That would break the separation.

   Another way: The threatener's threat on S might be designed to harm S, but if carried out, it might also cause collateral damage to R. But then the decoy is not clean.

   Let me reframe: The defender sets up the decoy as a separate resource that it can use to pay off threateners. The defender's algorithm is programmed to always yield on S (by paying the demanded resource from the S-resource pool) and to never yield on R. The threatener, if it threatens S and D yields, T gets the resource and D loses only from the S-resource pool. If D doesn't yield, T destroys the entire S-resource pool and also incurs cost -t. Since the S-resource pool is large, destroying it would be a big loss for D in terms of S, but D doesn't care about S. However, if the S-resource pool is separate and the destruction doesn't harm R, then D is indifferent. But then D might not yield.

   To break the indifference, we can assume that D has a very small cost for the act of yielding (like a transaction cost) but a zero cost for the destruction of S. Then D would prefer not to yield. That breaks the decoy.

   Alternatively, we can assume that D has a tiny concern for S, but then that means the decoy isn't free.

   Another idea: The defender uses the decoy as a bargaining chip. The defender's policy is to yield on S because by doing so, it preserves the decoy for future use (to pay off other threateners). But if the decoy is destroyed, then the defender cannot use it in the future. So if the defender cares about the long term, it wants to preserve the decoy for future threats. This introduces a small cost for having the decoy destroyed: the loss of the ability to pay off future threateners. But then the defender's real goal is indirectly affected because without the decoy, future threateners might attack R. So the decoy is actually protecting R in the long run. Therefore, D should yield on S to preserve the decoy for future use.

   But then the threatener in the future might be the same as the current one? Or different? This becomes a repeated game.

   To simplify, let's assume a one-shot game and assume that D has set aside a fixed amount of S-resource for paying off threateners. If D yields, it pays from this resource. If D does not yield, T destroys the entire S-resource. D doesn't care about the S-resource per se, but if the S-resource is gone, then if in the future there is another threatener, D will have nothing to pay with and that threatener might threaten R. But in a one-shot game, there is no future.

   So for a one-shot game, we must make D care about yielding on S for the sake of maintaining a reputation? But that requires a repeated game.

   Alternatively, we can assume that the threatener's threat on S is designed to harm S in a way that does not harm R, and D is programmed to yield on S to avoid the threatener incurring the cost -t? But why would D care about T's cost? Unless D is altruistic? But then that altruism becomes a lever.

   This is tricky.

   A better approach: The defender's algorithm is designed to have a built-in response. The algorithm is:

     - If threatened on S, then yield (because the cost of yielding is 0 in real terms and it avoids the risk of any mistake that might harm R? But we assumed no collateral damage).
     - If threatened on R, do not yield.

   But then why yield on S? Because if the threat is on S and D does not yield, T will carry out the threat and destroy S. While D doesn't care about S, D also doesn't gain anything by not yielding. And if D yields, T gets the concession and goes away. So D might as well yield to get rid of T? But if D is indifferent, it might flip a coin. We need D to strictly prefer to yield on S.

   We can break the indifference by assuming that there is a small probability that the threatener's attack on S might accidentally harm R. Then D strictly prefers to yield on S to avoid that small risk.

   But then the decoy is not perfectly safe.

   Alternatively, we can assume that the act of carrying out the threat by T requires T to expend resources that could have been used for something else that D does care about (like if D and T are part of a larger society). But that complicates the model.

   Given these challenges, let me propose a different setup:

   Suppose the defender has two goals: R (real) and S (surrogate). The defender's true utility is R. But the defender has been programmed to act as if its utility is R + k*S, where k is a large number (to an outside observer) but in reality, k=0. However, the threatener does not know k=0? But by assumption, the threatener can perfectly model the defender, so it knows k=0.

   So the threatener knows that D only cares about R. Then the threatener will never threaten S because D doesn't care about S. So the decoy fails.

   Therefore, the decoy strategy only works if the threatener cannot distinguish between the real goal and the surrogate goal. But the whole setup assumes the threatener can perfectly model the defender.

   This seems to be a contradiction.

   The resolution in the literature is that the defender's algorithm is public and fixed. The threatener can see that the defender's algorithm will yield on S and not on R. Therefore, the threatener knows that threatening R is futile (because D won't yield) and threatening S is productive (because D will yield). So the threatener threatens S. The defender yields, giving up some S-resource, and the threatener goes away. The defender's real goal R is untouched.

   But why does the defender yield on S? Because the defender's algorithm is programmed to yield on S. The algorithm doesn't care about S, but it is programmed to output the action "yield" when the threat is on S. How is that implemented? The defender's algorithm is designed to minimize a loss function that includes S when the threat is on S? But that would require the algorithm to be lying to itself.

   Alternatively, the defender has a commitment device: it has set up an external mechanism that will automatically pay any demand on S (like putting the S-resource in an escrow that automatically pays if threatened). Then the defender doesn't have a choice. The threatener sees that the S-resource is in this escrow and knows that if it threatens S, it will get paid. So it threatens S and gets paid. The defender cannot intervene to stop it (because of the commitment) and doesn't care about the S-resource anyway.

   So the mechanics:

     - D sets up an escrow account containing S-resource and programs it to automatically pay any threatener that threatens S with a credible threat. This commitment is public.
     - T sees this and knows that if it threatens S, it will get the concession without D being able to back out.
     - T also sees that D has made no such commitment for R. In fact, D has committed to never paying any concession on R (by, say, putting the R-resource in a vault that cannot be opened for concessions).
     - T then has two options:
          * Threaten R: T will have to carry out the threat (because D cannot pay even if it wanted to) and so T incurs cost -t and gets nothing (because D doesn't yield). T's utility: -t.
          * Threaten S: T gets the concession (say, +b) and doesn't have to carry out the threat (so no cost). T's utility: +b.
     - T prefers +b to -t, so it threatens S.

   The defender's real goal R is safe.

   The regress worry: What if the threatener doesn't care about the concession on S? Then it might threaten R anyway. But by our assumption, T is rational and wants to gain the concession. We assume that T's goal is to get a concession, and it doesn't matter what the concession is (as long as it gets it). So S works as a decoy because it provides a concession that T values.

   What if T's goal is specifically to harm R? Then T might threaten R even if it knows D won't yield, just to harm R. But then T would have to pay the cost -t. If T is willing to pay that cost, then there's nothing D can do. But in that case, the threat is not "blackmail" but pure hostility. The decoy strategy is designed for scenarios where the threatener is trying to extract a concession, not for a purely hostile threatener.

   In summary, the surrogate goal works as a decoy because:
     1. The defender commits to automatically yielding on the surrogate goal (via an irrevocable mechanism).
     2. The defender commits to never yielding on the real goal.
     3. The threatener, being rational and primarily interested in extracting a concession (and not wanting to incur the cost of carrying out a threat for no gain), will choose to threaten the surrogate goal because that is the only way to get a concession.

   The threatener does not need to be fooled about the defender's true values. It only needs to be rational and self-interested.

   Example:

     - D has $1000 in a real account (R) and $100 in a decoy account (S). D only cares about R.
     - D sets up an automatic payment system for S: if a credible threat is made on S, the $100 is automatically paid to the threatener.
     - D also makes R completely inaccessible for such payments.
     - T can send a threat. If T threatens R, D will not pay and T will have to carry out the threat (say, destroy R) which costs T $10 (for effort) and destroys R (which T doesn't care about directly, but T doesn't get any money). So T's net: -$10.
     - If T threatens S, T gets $100 automatically, with no cost. T's net: +$100.
     - T chooses to threaten S and gets $100.

     - D loses $100 from S (which it doesn't care about) and keeps R ($1000).

   The regress worry: Why can't the threatener demand more? What if the threatener says, "Pay me $200 from S or I will destroy R"? But D's commitment for S is only to pay up to $100 (because that's all that's in the escrow). And D has no way to pay from R. So T cannot get $200. Therefore, T will only demand what is available in S.

   Also, what if the threatener threatens both at the same time? We assumed the threatener can only threaten one. But if it can threaten both, then D would have to yield on S (paying $100) and not yield on R. Then T gets $100 and also has to decide whether to carry out the threat on R. If T carries out the threat on R, it costs T $10 and destroys R. T gets $100 from S and -$10 from the attack on R, so net $90. But if T had only threatened S, it would have gotten $100 without the cost. So T would prefer not to threaten R at the same time. Therefore, T will only threaten S.

   This example illustrates the mechanics.

   However, the regress worry about the defender's real commitment: If the defender can create a decoy, why can't it create a decoy for the decoy? But note, the defender doesn't need to. The one decoy is sufficient to absorb the threat. And the defender's commitment to not yield on R is absolute.

   But what if the threatener is so powerful that it can threaten to destroy both R and S unless the defender yields on R? Then the defender's algorithm: 
     - The threat is on both. The defender's commitment says: for R, never yield. For S, yield automatically. But the threatener is not allowing to yield only on S; it demands yielding on R. 
     - The defender cannot yield on R (by commitment) so it doesn't. 
     - The threatener then must decide whether to carry out the threat. If it does, it destroys both R and S and incurs cost -t (for two threats? let's say -t for each, so -2t). The threatener gets nothing. 
     - The threatener's utility: -2t.

   Alternatively, if the threatener had threatened only S, it would have gotten $100. So it prefers to threaten only S.

   Therefore, the threatener will not make a combined threat because it would be less profitable.

   In conclusion, the surrogate goal defense works by providing a cheaper and more effective target for the threatener, which the defender can afford to lose. The defender's commitment mechanisms make the real goal inviolable and the surrogate goal an easy concession, thereby channeling the threatener towards the surrogate.
answer: |-
  To unpack the surrogate goal defense against acausal blackmail, let's clarify the game-theoretic mechanics with a toy example. The core insight hinges on **commitment devices** and the **incentive structure** of the threatener, rather than fooling them about your true values. The threatener's rationality (seeking leverage at minimal cost) and your precommitments do the work.

  ### **Toy Example: The Decoy Vault**
  **Players**:  
  - **Defender (You)**: Care only about preserving your *real* treasure ($REAL).  
  - **Threatener (T)**: Wants to extract concessions. Can credibly threaten to destroy treasure unless paid. Carrying out a threat costs $T (e.g., effort/resources).  

  **Defender's Setup**:  
  1. **Real Goal**: $REAL (e.g., critical infrastructure).  
  2. **Surrogate Goal**: $DECOY (e.g., a vault of worthless trinkets).  
  3. **Commitment Devices**:  
     - **For $REAL**: Irrevocably hardcode your agent to *never* negotiate or pay ransoms. ($REAL is "locked" and inaccessible for concessions.)  
     - **For $DECOY**: Program an *automatic payment system* that pays ransoms from $DECOY if threatened.  

  **Threatener's Options**:  
  1. **Threaten $REAL**:  
     - You *cannot* yield (by commitment).  
     - T must carry out the threat to maintain credibility, costing $T and destroying $REAL.  
     - **Payoff for T**: $-T$ (cost with no gain).  
     - **Outcome**: T loses, you lose $REAL.  

  2. **Threaten $DECOY**:  
     - Your automatic system pays $DECOY to T.  
     - T gains $DECOY at no cost (no need to carry out the threat).  
     - **Payoff for T**: $+DECOY$ (pure profit).  
     - **Outcome**: You lose $DECOY (which you don't care about), $REAL is safe.  

  **Why T Targets the Decoy**:  
  - T is rational and self-interested. Threatening $REAL yields $-T$; threatening $DECOY$ yields $+DECOY$.  
  - Even if T *knows* $DECOY is worthless to you, they still profit by targeting it. Your commitment makes $REAL untouchable, so $DECOY is T's *only* profitable lever.  

  ### **Why Sophistication Doesn't Unravel This**  
  - **T Sees Everything**: T knows your commitments and that you don't value $DECOY. But T doesn't care about your *values*—they care about their *own payoff*.  
  - **No Incentive to Target $REAL**: If T threatens $REAL, they *lose* $-T$ (you won't yield, forcing T to eat costs). Rational T avoids dominated strategies.  
  - **The Decoy is "Real" to T**: $DECOY has transactional value—it's a resource T can extract. Your disinterest in it is irrelevant to T's calculus.  

  ### **Addressing the Regress Worry**  
  **Q**: If you can manufacture a decoy, why can't T demand concessions on $REAL by threatening to destroy *both*?  
  - **Your Commitments Bind You**:  
    - You *cannot* access $REAL to pay ransoms (hardcoded).  
    - T's threat to destroy both would force them to:  
      - Pay $-2T$ (cost for two threats).  
      - Gain nothing (you can't yield $REAL, and $DECOY is depleted).  
    - T prefers threatening *only* $DECOY for $+DECOY$ over a combined threat for $-2T$.  

  **Q**: Couldn't T exploit the fact you "softened" on $DECOY to infer you might yield on $REAL?  
  - **Precommitments Are Asymmetric**:  
    - Yielding on $DECOY is *automated and costless* for you.  
    - Yielding on $REAL is *impossible* (e.g., no physical/algorithmic means to comply).  
  - **T Tests and Learns**: If T experiments with threatening $REAL, they lose $-T$ and learn it's futile. Your commitment is credible because violating it is physically/causally impossible.  

  ### **Key Mechanics**  
  1. **Commitment Over Values**: The defense works by making your *behavior* predictable, not by hiding values. T knows $DECOY is a decoy but attacks it anyway because it's the only profitable option.  
  2. **Threatener's Cost Structure**: Acausal threats rely on *deterrence*. If carrying out threats is costly, T avoids goals where you won't yield.  
  3. **No Infinite Regress**: Adding more decoys doesn't help, but one is sufficient. Each decoy must have:  
     - A commitment device for automated concessions.  
     - No bleed-over to $REAL (e.g., destroying $DECOY doesn't harm $REAL).  

  ### **When This Fails**  
  - **Hostile Threateners**: If T wants to destroy $REAL at any cost (not extract concessions), decoys won't help.  
  - **Collateral Damage**: If threatening $DECOY risks harming $REAL (e.g., shared infrastructure), the decoy becomes a vulnerability.  
  - **Imperfect Commitments**: If your "never yield on $REAL" commitment is penetrable, T will probe it.  

  ### **Conclusion**  
  The surrogate goal defense exploits the threatener's rationality: they attack the *easiest* lever, not the most valuable one. By making $REAL inviolable and $DECOY exploitable, you channel threats toward a target you can sacrifice. It’s not about deception—it’s about strategic precommitments that reshape the threatener's incentives. For deeper dives, study Schelling's *The Strategy of Conflict* (on commitments) or Bostrom's work on acausal bargaining.
