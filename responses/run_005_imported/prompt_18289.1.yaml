  Ok this is going to sound like a weirdly specific question but I've been down a logic rabbit hole for a piece on infinity and cant shake it. Skolem's paradox: the Lowenheim-Skolem theorem says any first-order theory with an infinite model has a countable model too, and ZFC qualifies, so ZFC has a countable model -- except ZFC also proves uncountable sets exist (Cantors theorem and all that). Every pop explainer I've found just says "ah, countability turns out to be relative to the model, not absolute" and acts like that settles it, but that's always felt to me like renaming the puzzle rather than actually dissolving it. Can you walk me through, on a gut level, what's literally going on with the missing bijection -- like why doesn't the model just contain it? Also, semi-related: I vaguely remember Putnam leaning on this paradox for his argument against metaphysical realism (the "Models and Reality" stuff) -- is that actually a legit extension of the math, or is he smuggling in something extra that pure logic can't give him?
