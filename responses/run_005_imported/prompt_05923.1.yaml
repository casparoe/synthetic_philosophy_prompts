  The user wants a joke that hinges on the rational irrationality gap, not just a repackaged Newcomb's problem joke. They mentioned Gauthier's constrained maximization and FDT (functional decision theory) as possible elements. The joke should work on two levels: mildly amusing for those without background, but clever for those who understand the puzzle.

  I should avoid making it too obscure. The setup needs to be simple: a hitchhiker, a driver, the promise, and the payment. The humor should come from the hitchhiker's internal conflict or the absurdity of the situation. Maybe the hitchhiker tries to self-modify but in a humorous way.

