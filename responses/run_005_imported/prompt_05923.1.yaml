answer: |-
  Here's a joke crafted for your Parfit's Hitchhiker seminar, designed to spotlight the "rational irrationality" gap while staying accessible. It uses the core desert setup but twists the hitchhiker’s internal struggle into something absurdly literal:

  **The Joke:**  
  *A causal decision theorist is stranded in the desert. Along comes Paul Ekman’s equally perceptive cousin, Ethel the Driver. Ethel says: “I’ll drive you to town if you *genuinely intend* to pay me $1,000 once we arrive. And no funny business—I’ll know if you’re faking.”*  

  *The hitchhiker panics. He knows if he doesn’t *sincerely* commit to paying now, Ethel leaves him to die. But he also knows that once safe in town, handing over $1,000 won’t *cause* the ride—it’d be irrational! So he hatches a plan. He spends 20 minutes feverishly scribbling in a notebook, muttering: “Dispositional overhaul… constrained maximization… must become the sort of person who pays debts… YES, FUTURE ME WILL PAY!” He beams at Ethel, radiating pure, unfeigned commitment. She’s convinced. They drive to town.*  

  *As they pull up, the hitchhiker whips out his wallet. But just before handing over the cash, he pauses, frowns at the notebook, and slams it shut. “Hold on,” he says. “According to *this*”—he taps the cover—“past me *rationally* turned me into someone who’d do something *irrational* right now. But current me? I’m just… me. And *I* know paying won’t change a thing. So… no thanks!”*  

  *Ethel sighs. “Classic. You spent so much effort *becoming* trustworthy, you forgot to *stay* trustworthy.” She drives off, leaving him stranded in town—alive, but now $0 richer and utterly alone with his pristine causal principles.*  

  **Why it works for your seminar:**  
  - **The Rational Irrationality Gap:** The punchline hinges on the disconnect between the *rationality of becoming* (the notebook plan) and the *irrationality of acting* (refusing to pay). Past him "rationally" self-modified to be irrational later, but present him "rationally" defects—undoing the whole scheme.  
  - **Gauthier/FDT Nod:** The notebook is a physical gag for "constrained maximization" (committing to a disposition) or FDT’s "timeless decision." It makes the abstract struggle visceral.  
  - **Two-Level Humor:**  
    - **Zero Background:** It’s just a story about a hitchhiker outsmarting himself with overcomplicated planning. Mildly funny self-own.  
    - **Parfit Veterans:** The notebook is the "rational irrationality" made literal. The hitchhiker’s fatal flaw? He treated self-modification as a *task to complete* rather than a *state to maintain*. The paradox bites him *after* he survives—highlighting why CDT’s "act-by-act" myopia fails.  
  - **Jolts the Nodders:** The absurdity of being "stranded in town" (alive but friendless/broke) mirrors the CDT hitchhiker’s fate. It’s not death—it’s a hollow victory where "winning" the causal argument feels like losing. That *stings* more than dying dramatically.  

  **Delivery Tip:** Lean into the notebook as a prop. Mime scribbling frantically, then slam an imaginary book shut at the punchline. The physicality helps underscore the "disposition as a constructed thing" angle.  

  Hope this bridges the gap for your students—or at least makes them laugh while contemplating why rational agents might need to be selectively incompetent!
