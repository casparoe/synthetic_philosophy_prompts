prompt: |-
  I've been kinda anxious about tech layoffs lately and tried to put an actual number on my own odds instead of just doomscrolling layoffs.fyi. Problem is, the number depends entirely on how you define the group. "All US software engineers" is something like 4-5% this year. "Engineers at Series A/B startups" is more like 15-20%. "Engineers at my specific company" is 0%, we've never had one. If I factor in stuff thats true of just me (senior, solid reviews, not on a cost-center team) it should be lower still, except now the "group" is just me, one guy, which doesn't really feel like a percentage anymore either. They all seem like legit ways to slice it, but they give wildly different answers. Is there a principled way to know which group i should actually trust for my own odds, or is "my personal probability of getting laid off" just not a coherent idea to begin with?
