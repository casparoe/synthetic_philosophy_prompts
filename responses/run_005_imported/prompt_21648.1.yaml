  Finally, the user's case (fingerprint_context) is in "probably_not_penetration". Why? Because the reversal of the match call is more likely due to a change in the decision criterion (a post-perceptual factor) than a change in the perceptual experience of the print itself. The examiner might be seeing the same features but interpreting them with a more cautious threshold due to the narrative.

