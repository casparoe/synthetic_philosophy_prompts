  Explanation per tier:

  - **strong_case**: This tier includes cases where the effect on perception is direct and difficult to explain by non-perceptual factors, as the measured experience itself changes (e.g., hearing a phoneme that isn't there).
  - **contested**: These cases are often cited as evidence for penetration but are methodologically more vulnerable to alternative explanations (e.g., memory, attention, or response bias), making them the subject of ongoing debate.
  - **probably_not_penetration**: Here, the effects are more parsimoniously explained by post-perceptual processes (e.g., decision bias or attentional shifts) without requiring a change in the underlying perceptual experience.
