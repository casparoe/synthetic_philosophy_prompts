  **Contested** (these are often discussed as evidence but have strong alternative explanations):
  - memory_color: The effect is measured by adjusting the color until it appears gray, which might reflect perception, but it could be due to memory or response criteria.
  - wine_language: The training might lead to a genuine perceptual effect, but it might also be a semantic association.
  - race_lightness: Perceptual judgments are influenced by race categorization, but it might be due to attention or context.

  **Probably not penetration** (likely due to downstream factors):
  - weapon_priming: The effect is often explained by response bias or attentional capture, not a change in the visual experience.
  - fingerprint_context: The change in call is likely due to a shift in decision criterion (inconclusive vs match) rather than a change in the perceptual experience of the print.

  **Counts against**:
  - muller_lyer_knowledge: The persistence of the illusion despite knowledge is a standard argument against cognitive penetration.

  But note: the user's case might be more about memory and decision than perception. The examiner is re-examining a print they had seen two years earlier. The narrative might affect their attention to certain features or their decision threshold.

  We must order within tiers.

  **Ordering within tiers**:

  Strong_case (strongest evidence for penetration):
  1. phonemic_restoration: It directly alters the auditory experience, and it's difficult to explain without penetration.

