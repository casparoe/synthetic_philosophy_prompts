  Pritchard might respond by appealing to externalist conditions for justification—e.g., the good case support is factive because the world cooperates. But this feels thin. If the subject can't reflectively distinguish the cases, insisting they have different rational support risks making justification externally imposed rather than internally accessible, which contradicts his reflective accessibility requirement. 

  The deeper issue is that Pritchard's "neutrality" collapses under pressure. To explain why the good case subject *actually* possesses factive support (rather than just being lucky), he must implicitly rely on a naive realist intuition—that perception directly presents facts. Otherwise, the epistemic asymmetry lacks a foundation. 

