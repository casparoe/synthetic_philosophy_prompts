  We are going to rank six approaches to the liar paradox with respect to their handling of the strengthened liar. The strengthened liar is a version of the liar paradox that says "this sentence is not true" (where "not true" is meant to cover both false and gappy or undefined). The goal is to see how each theory avoids or falls prey to a revenge liar (a new paradox that arises at a higher level).

  The six approaches:
  1. Tarski's hierarchy
  2. Kripke's fixed-point theory
  3. Gupta-Belnap revision theory
  4. Paracomplete contextualism (Burge/Simmons/Glanzberg-style)
  5. Priest's dialetheism
  6. Deflationism about truth

  Tiers:
  - S: Basically immune to revenge (the theory closes off the paradox and does not allow a revenge liar to form)
  - A: Handles the strengthened liar well, but may have some limitations or require additional machinery that could be challenged
  - B: Addresses the strengthened liar but leaves open the possibility of a revenge paradox in a more complex form, or the solution is somewhat ad hoc
  - C: The revenge liar reappears in a recognizable form, requiring significant patches
  - D: The revenge liar walks right back in almost unchanged

  We will assign each theory to a tier and provide a brief justification.

  Analysis:

  1. **Tarski's hierarchy (object-language/metalanguage separation):**
     - In Tarski's theory, truth is always relative to a language level. The liar sentence cannot be expressed in any single level because it would require a truth predicate that applies to its own level. The strengthened liar ("this sentence is not true") would also require a truth predicate of level n to apply to a sentence of level n, which is forbidden. Thus, the liar and strengthened liar are blocked by the hierarchy.
     - However, one might try to form a revenge liar by attempting to quantify over all levels (e.g., "this sentence is not true at any level"). But in Tarski's system, such quantification is not expressible because each level has its own truth predicate and no universal truth predicate exists. Thus, the revenge liar is blocked by the hierarchy's strict separation.
     - **Tier: S** - The hierarchy prevents the formation of the liar and any strengthened version by design.

  2. **Kripke's fixed-point theory (with truth-value gaps):**
     - Kripke's approach allows a truth predicate that can apply to sentences that contain it, but some sentences (like the liar) are neither true nor false (gappy). The strengthened liar: "this sentence is not true" (where "not true" means either false or gappy). In Kripke's construction, this sentence is also gappy? But note: if it is gappy, then it is not true, which is what it says. So it would be true? Contradiction. But Kripke's theory does not allow the truth predicate to apply to gappy sentences. However, the strengthened liar uses "not true" which is meant to cover the gappy case. Kripke's theory does not have a way to express "not true" in a way that covers the gap without causing a new paradox. Specifically, if we introduce a new predicate for "not true" (or "untrue") that covers both false and gappy, then we can form a new liar: "this sentence is untrue". This sentence would be true if untrue and untrue if true. So it leads to a revenge paradox because the language now has a new predicate (untrue) that is not handled by the fixed-point construction for the original truth predicate.
     - Therefore, Kripke's theory is vulnerable to the strengthened liar. It avoids the classic liar by introducing gaps, but then the strengthened liar uses a notion that goes beyond the truth and false of the system.
     - **Tier: C** - The revenge liar reappears when we try to express the concept of "not true" (covering the gap) and requires extending the language with a new predicate, which then leads to a new paradox. The solution is not closed under the intended notion.

  3. **Gupta-Belnap revision theory:**
     - In revision theory, truth is a circular concept that is evaluated by a process of revision: we start with an arbitrary hypothesis about the extension of truth and then revise it until we reach a fixed point (or a set of recurring hypotheses). The liar sentence will oscillate in truth value. For the strengthened liar: "this sentence is not true", it will also oscillate? But note: the revision theory can handle the concept of "not true" because it is defined in terms of the truth predicate. However, the problem is that the strengthened liar might not stabilize. But the revision theory does not claim that every sentence stabilizes. It allows for unstable sentences. The issue of revenge arises when we try to express properties of the revision process itself (like stability). For example, one might form a sentence that says "this sentence is unstable" or "this sentence is not stably true". Such sentences might lead to new paradoxes. However, Gupta and Belnap have extended their theory to handle these kinds of predicates (by introducing stability predicates). But then a new revenge liar might be formed for the stability predicate. This leads to an infinite hierarchy of stability predicates? Or they might handle it by allowing the revision process for multiple predicates. It is complex and might be seen as generating a hierarchy of languages (like Tarski) but in a more unified way. However, the revenge problem is not entirely closed because we can always form a new predicate that captures the current level of the revision process and then form a liar for that. But the theory is designed to be able to handle arbitrary circular definitions, so it might be more robust.
     - **Tier: B** - The revision theory handles the strengthened liar by allowing the truth predicate to be circular and by providing a semantics that accounts for unstable sentences. However, it is vulnerable to revenge problems when we introduce new predicates (like stability) and requires an expansion of the language. It doesn't completely block revenge but provides a framework to keep extending.

  4. **Paracomplete contextualism (Burge/Simmons/Glanzberg-style):**
     - Contextualism holds that the truth predicate is context-dependent. A sentence like the liar may be true in one context and false in another, but the context shifts when we evaluate it. The strengthened liar: "this sentence is not true in any context" or "this sentence is not true in the current context". Contextualists typically handle the liar by saying that the context shifts so that the sentence is evaluated in a new context where it is not true. But the strengthened liar might say "this sentence is not true in any context". If it is not true in any context, then it is true? But then there is a context in which it is true? Contradiction. However, contextualists like Glanzberg argue that the domain of contexts is open-ended and that the strengthened liar requires quantifying over all contexts, which is impossible because contexts are indefinitely extensible. So the sentence "this sentence is not true in any context" cannot be expressed because we can always add a new context. Thus, the revenge is blocked by the open-endedness of the context hierarchy.
     - **Tier: A** - The contextualist approach avoids revenge by the indefinite extensibility of contexts. The strengthened liar cannot be formed because it would require quantifying over an absolute totality of contexts, which is not available. However, this might be seen as a form of hierarchy (like Tarski) but in a dynamic way.

  5. **Priest's dialetheism:**
     - Dialetheism allows some contradictions (true and false) to be true. The liar sentence is both true and false. The strengthened liar: "this sentence is not true" (only). But note: if the sentence is both true and false, then it is true (so it is true that it is not true? which would be a contradiction). But dialetheism can accept that: the sentence is both true and not true. However, the problem of revenge in dialetheism is that the theory must be able to express that a sentence is only true (and not false) or only false (and not true). The strengthened liar might be used to argue that dialetheism cannot have a coherent notion of "just true" without generating new contradictions. Priest addresses this by introducing a notion of "exclusion" or by using a non-detachable notion of "just true". However, if we try to form a sentence that says "this sentence is just false" (or "not true and not both"), it might lead to a revenge paradox. Priest's logic (LP) has a third value (both) and the truth predicate is transparent. The revenge problem for dialetheism is that if we try to introduce a consistency predicate (or a "just true" predicate) then we can form a new liar: "this sentence is not just true". But Priest argues that such predicates are not expressible without leading to triviality. He might say that the language is expressively incomplete in a necessary way. However, this leaves the theory vulnerable to the charge that it cannot express important semantic concepts without collapse.
     - **Tier: B** - Dialetheism handles the liar by accepting the contradiction, but the strengthened liar (or other revenge liars) might be formed by introducing a predicate like "just true". Priest argues that such predicates cannot be consistently added, so the revenge is avoided by expressive limitations. However, this might be seen as a weakness because we want to be able to express that some sentences are not contradictory.

  6. **Deflationism about truth:**
     - Deflationism holds that truth is not a substantive property but just a device for disquotation. The liar paradox is a problem for deflationism because it shows that the truth predicate can lead to contradictions when combined with self-reference. Deflationists typically do not offer a specific solution to the liar but might adopt one of the existing formal approaches (like Tarski or Kripke). Without a specific solution, the strengthened liar is just as problematic. Moreover, some deflationists (like Horwich) have tried to handle the liar by restricting the T-schema, but this leads to the same revenge problems as in Kripke. Because deflationism is a philosophical view about truth, it doesn't by itself provide a formal solution. Therefore, it is vulnerable to the liar and the strengthened liar unless it endorses a specific formal approach. But if it endorses, say, Tarski, then it would inherit Tarski's solution. However, we are evaluating deflationism as a general approach without a built-in solution. Thus, it is the least equipped to handle the paradox.
     - **Tier: D** - Deflationism does not provide a formal solution to the liar and thus leaves the door wide open for the strengthened liar. Even if it adopts a formal approach, it must then be judged by that approach's ability to handle revenge.

  Final Tier List:

  - S: Tarski's hierarchy (because the hierarchy blocks the formation of both the liar and the strengthened liar by disallowing a universal truth predicate and by requiring that truth predicates are always at a higher level)
  - A: Paracomplete contextualism (because it uses an open-ended hierarchy of contexts that prevents the formation of a sentence that quantifies over all contexts, thus blocking the strengthened liar)
  - B: Gupta-Belnap revision theory and Priest's dialetheism (both handle the strengthened liar but are vulnerable to further revenge problems when new expressive resources are added; however, they provide frameworks that can be extended to handle these, albeit with some complexity and potential ad hocness)
  - C: Kripke's fixed-point theory (it avoids the classic liar by gaps but the strengthened liar using "not true" (covering gaps) leads to a revenge paradox that requires a new predicate and then a new fixed-point, which is not provided in the original system)
  - D: Deflationism (without a specific formal solution, it cannot block the liar or the strengthened liar; even when adopting a solution, it inherits the revenge problems of that solution without adding any new resources)

  Note: We have placed Gupta-Belnap and dialetheism in the same tier (B) because both have resources to handle the strengthened liar but face challenges with further revenge. However, they are very different in their approaches.

