  ## Dialogue: The Weight of Stones

  **Setting:** A philosophy department lounge, late afternoon. Rain streaks the windows. **ALEX** (late 20s, intense, gesturing with a coffee mug) and **BLAKE** (early 30s, calmer, leaning back in an armchair) are deep in discussion. Empty whiteboard nearby.

  **Alex:** ...and *that’s* why Senator Vance’s whole tirade against Miller’s affair rings so hollow. It’s not that Miller didn’t do wrong. He clearly did. It’s that Vance, caught in his *own* affair just last year, has absolutely no *standing* to be the one publicly wielding that moral cudgel.

  **Blake:** Hold on, Alex. I get the visceral reaction. It feels gross. Hypocrisy usually does. But I think you’re conflating the *content* of the criticism with the *messenger*. Miller *did* have an affair, presumably violating his own professed values and commitments, just like Vance did. Vance’s *judgment* – that affairs are wrong, damaging, a betrayal of trust – might be entirely *correct*, even sincere! Why shouldn’t he say it?

  **Alex:** Because he’s not just *stating* a moral truth, Blake. He’s *blaming*. He’s holding Miller accountable, demanding justification, expressing moral anger, positioning himself as the enforcer of a standard from which he’s quietly exempted *himself*. *That’s* the forfeiture of standing. It’s a distinct normative failure layered *on top* of Miller’s original wrong. It’s like Vance is trying to throw stones while living in a glass house he refuses to acknowledge he inhabits.

  **Blake:** Okay, unpack this “distinct normative status.” How is it distinct? Isn’t the core problem just that we doubt Vance’s *sincerity*? Maybe he doesn’t *really* believe affairs are wrong; he’s just weaponizing morality for political gain. Or, perhaps the issue is purely *pragmatic* – his criticism is ineffective or counterproductive because no one takes a hypocrite seriously. Or worst case, Miller’s defense is just a cheap *tu quoque* fallacy – “You did it too!” – which deflects from his own misdeed without actually refuting it. None of that touches the *wrongness* of Miller’s act.

  **Alex:** It’s more than sincerity! Vance *could* be genuinely remorseful about his own affair and *still* lack standing to blame Miller. Imagine he says, “Look, I know I messed up horribly. I’m deeply ashamed. *And* what Miller did is also deeply wrong.” That feels different, right? Less objectionable? Because he’s not exempting himself *while* enforcing it on Miller. He’s acknowledging he’s bound by the same rule. Standing, as I see it, is about the *authority to hold another accountable for violating a rule you yourself are currently bound by and actively respecting*. Vance, by his own recent, unrepented, identical action, demonstrates he *isn’t* genuinely bound by that rule in the way his blame implies Miller should be. He’s trying to impose a burden he refuses to shoulder.

  **Blake:** But Alex, this bootstrapping problem… It terrifies me. If hypocrisy *really* strips standing, then the *worse* a person’s own moral record – the more numerous and egregious their sins – the *more* people become immune to their criticism! The serial adulterer can never condemn adultery? The corrupt politician can never call out corruption? That seems perverse! Worse, if *everyone* is a hypocrite about *something* (and who isn't?), doesn't this view effectively dissolve the entire practice of moral criticism? We’d all be perpetually silenced from holding anyone accountable for anything because we’ve all fallen short somewhere, sometime. Moral discourse collapses into mutually assured silence. That can't be right.

  **Alex:** It’s not about *never* being able to criticize, Blake. It’s about *current, relevant* hypocrisy undermining *this specific act* of blame. It hinges on the *relevance* of the past wrong and the *current stance* towards it. Vance isn’t disqualified from criticizing *all* wrongdoing forever because of his affair. He *is* disqualified from blaming *this specific wrong* – marital infidelity – precisely because he’s *currently implicated* in the *identical* wrong *without proper reckoning*. He hasn’t demonstrated a renewed commitment to the norm he’s invoking. As for universality: yes, we’re all flawed. But standing isn’t lost by *any* flaw, only by *relevant* ones where the hypocrite *actively positions themselves* as an enforcer while exempt. If I cheat on taxes, I lack standing to blame *you* for tax fraud. But I *might* still have standing to blame you for cruelty to animals, provided my tax cheating isn’t somehow relevantly connected to *that* norm. The practice survives through specificity and relevance.

  **Blake:** Hmm. You’re trying to quarantine it. Relevance, current stance... I see the move. But why does the hypocrite’s blame feel *so* uniquely bad, then? Worse than just an insincere critic or a clumsy one? If it’s just about relevance and exemption, why the visceral sense of *injustice*?

  **Alex:** Because it *is* a distinct injustice! It’s a second-order wrong. The hypocrite isn’t just pointing out your failure; they’re implicitly *asserting a moral asymmetry* that doesn’t exist. They claim the right to judge and impose a sanction from a position of assumed authority *that their own identical conduct completely undermines*. It’s a kind of normative fraud. They’re polluting the moral atmosphere by pretending the rule applies differentially. *That’s* why it feels like a personal affront beyond the original criticism – it adds the insult of the hypocrite’s *presumption* and their attempt to place themselves above the very law they invoke. It damages the shared fabric of the norm itself by suggesting it’s optional for some.

  **Blake:** Normative fraud... presumption... polluting the atmosphere. Okay, I feel the weight of that. It’s not *just* annoying; it feels like a corruption of the moral exchange itself. Maybe sincerity isn’t the whole story. Even a sincere hypocrite... there’s a profound *unfairness* in their positioning. They demand from others what they won’t demand from themselves, *in the very act of demanding it*. It hijacks the moral high ground illegitimately.

  **Alex:** Exactly! It’s the *enforcement posture* combined with the *exemption* that constitutes the distinct wrong and forfeits the standing. Miller still owes an account *to someone* – to his spouse, his constituents, perhaps even to Vance if Vance had clean hands. But Vance, by his own hands, has made himself the wrong person to *be* that enforcer *right now*. The stone is too heavy for him to throw without hypocrisy tainting the act itself.

  **Blake:** ...I still worry about the practical implications. How do we draw the lines on "relevance" or "current stance"? But... you've convinced me it's not *merely* about sincerity or effectiveness. There's a distinct poison in the hypocrite's blame. It undermines something fundamental about how moral norms are supposed to function *between* people. Maybe standing *is* a real thing we lose, at least temporarily, in those specific, mirrored moments of failure. It’s less that the criticism is false, and more that the hypocrite has temporarily forfeited their *right* to be the one voicing it in *that* accusatory, sanctioning way. The truth gets lost in the frayed social fabric.

  **Alex:** (Nods slowly) That’s the heart of it. The stone might be aimed at the right target, but the thrower’s hands are too dirty to make the throw legitimate. The wrong is compounded, not erased.
