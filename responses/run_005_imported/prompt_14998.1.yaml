prompt: |-
  So in my Free Will & Moral Responsibility seminar this week we spent basically the whole class on Galen Strawson's Basic Argument - the one where he claims true/ultimate moral responsibility is impossible because to be responsible for what you do you'd have to be responsible for the way you are (your character, values, motives, etc.), and to be responsible for THAT you'd have had to choose it for reasons, but those reasons just come from an earlier self you also didn't choose, so it's either an infinite regress or you'd need to be causa sui, which nothing can be. Pretty bleak honestly. Then my professor mentioned almost as a throwaway comment that Galen's own dad, P.F. Strawson, wrote "Freedom and Resentment," like one of the most famous defenses of compatibilism ever, built entirely around reactive attitudes (resentment, gratitude, indignation, that kind of thing) instead of any of the regress/causation stuff his son cares about. She didn't elaborate since we moved on to Frankfurt cases right after, but I brought it up with my study group over coffee and now none of us can stop thinking about how a father and son ended up on opposite sides of basically the same question using totally different methods.

  Could you actually walk me through how these two positions relate to each other, not just that they "disagree"? Like, does P.F.'s reactive-attitudes move genuinely engage with the metaphysical regress problem Galen raises, or is he sort of changing the subject to a psychological/social question about our practices rather then answering whether we're responsible in the deeper sense Galen means? And if you had to judge which position is the stronger piece of philosophy - the son's skeptical argument or the father's attitude-based defense - which would you pick and why? This is pretty much going to be my essay question so I'd rather actually understand the disagreement than just hand in the "they're on opposite sides of compatibilism" stock summary.
