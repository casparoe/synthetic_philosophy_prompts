  Hmm, their seminar context is helpful – they’ve clearly grappled with Greaves/Lenman’s distinction and found the "complex" variant uniquely paralyzing. The bednet example stuck with them, so I’ll avoid that trope. Their visceral reaction ("made me feel ill") suggests the story needs to induce similar unease through situational dread, not gore or melodrama.  

