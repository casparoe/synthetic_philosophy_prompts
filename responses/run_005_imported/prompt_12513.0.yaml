  For the Widerker-Kane dilemma, the question must corner her on whether the prior sign (like Jones' furrowed brow) is causally sufficient for the action. If she says yes, it begs the question against libertarians; if no, alternatives reemerge. The follow-up should press whether Frankfurt defenders subtly redefine "sufficiency" to dodge this.  

