  So 19/20 is 95% -> A.

  But note: the professor might use plus/minus. If so, 95% is an A. However, without specification, we can just assign "A". The professor might expect A+ for 19-20? But typically, A is the highest. Let's stick with A.

  Alternatively, the professor might use:
  - A: 18-20
  - A-: 17
  - etc.

  But since the professor didn't specify, and 19 is above 18, we can assign A.

  However, to be safe, we note that 19/20 is 95%, which is an A. We'll assign letter_grade: "A"

