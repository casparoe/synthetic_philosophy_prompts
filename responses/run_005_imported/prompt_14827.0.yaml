  - Impossible-worlds semantics: Allows worlds where logical laws fail, so an agent might not know a tautology. However, it can make the semantics very complex and might allow too much inconsistency.
  - Levesque's explicit/implicit belief: Uses partial situations (which may be incomplete or incoherent) to model explicit belief. Explicit belief is what is true in all situations considered possible, but situations can be partial. This captures that an agent might not believe a tautology if they haven't considered it. However, the partial situations can be very abstract and the model might not capture computational limitations well.
  - Step/active logics: Beliefs are what the agent has derived in a bounded number of steps. This directly models computational limitations but makes the logic very dynamic and non-monotonic, which might be too far from traditional epistemic logic for some applications.
  - Algorithmic knowledge (Halpern et al.): Knowledge is tied to the output of an algorithm running on the agent's local state. This is computationally oriented and can model resource bounds, but the choice of algorithm is external and might be arbitrary. Also, it might reduce knowledge to a syntactic process.
  - Justification logic (Artemov): Replaces the knowledge operator with explicit justifications. The agent knows p only if they have a justification for p. This avoids logical omniscience because having a justification for p doesn't mean having one for every consequence of p. However, it shifts the focus to justifications, which are syntactic objects, and might not capture the full robustness of knowledge.

