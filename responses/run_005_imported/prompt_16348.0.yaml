  Had this argument with my friend Priya last night that never actually got resolved and its bugging me. Started because I said something like "yeah I know the wine's got me way more confident that my toast was funny than I probably should be, but I still think it was funny," and she said that's literally an incoherent thing to believe — you can't rationally think P while also thinking your own evidence for P is garbage, that's "epistemic akrasia" and there's a principle (she called it the enkratic principle) that just rules it out as irrational, full stop. I pushed back with a version of that classic logic-and-drugs case: you work through a proof, it seems airtight, then someone credible tells you that you'd been given a drug that wrecks people's reasoning about half the time without them noticing any drop in confidence. Do you really have to tank your confidence in a proof that, as far as you can tell, is genuinely valid, just because of some testimony about a pill? But if you don't tank it, aren't you stuck believing the proof AND believing your evidence says you probably shouldn't trust it — which is exactly the akrasia thing? She said that just proves her point, I said banning akrasia across the board just means any rando can talk you out of anything by claiming you're compromised. Went around in circles for like an hour. Write me an actual essay that settles this properly: the strongest case for "akrasia is always irrational, no exceptions" vs the strongest case for "staying akratic can be the rational response to misleading higher order evidence" — and then actually commit to an answer instead of leaving it at "both sides have a point."
