  The user might be worried they're subconsciously adopting behaviors because they learned about them. But research on the suggestibility of autistic individuals isn't conclusive. Autistic people often have strong personal integrity and aren't easily swayed by trends. Instead, they might be unmasking, which is a natural process once they realize they've been suppressing their true selves. The relief they feel from stopping masking isn't creating new issues but addressing old ones. 

  The partner's suggestion to quit groups and forget the label could be harmful. Removing support might lead to isolation. The user needs to evaluate if the groups are helpful. Are they providing coping strategies and validation, or fostering negativity? The user should assess the groups' impact on their well-being. Also, the partner's role is crucial. Are they supportive of the diagnosis, or resistant? The partner might need education on autism to understand the user's experience better.

