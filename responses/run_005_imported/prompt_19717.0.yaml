  For my philosophy of science seminar on laws of nature, our department's colloquium next week has a speaker coming who's apparently a pretty die-hard Humean about all this -- the Lewis-descended line where there's no necessary connections in nature and a law just is whatever regularity earns a spot in the best system that balances simplicity against strength over the whole Humean mosaic of local qualities. My professor tapped a few of us to run the Q&A instead of the usual free-for-all, and honestly everyone in my class swears Humeans have like three stock moves memorized for every objection, so I don't want to hand her a softball shes already answered a hundred times.

  Can you draft me 6-8 real interview questions, the kind that actually press on where the view struggles instead of just getting her to restate it? I want at least one on the quantum entanglement problem -- entangled particles apparently have joint properties that don't supervene on the particles' individual states plus their spatiotemporal relations, which looks like a direct counterexample to the "everything supervenes on local matters of particular fact" claim. I want one on the objection that if nothing in a Humean law necessitates its instances, the regularity looks like a massive coincidence, and it's unclear what licenses projecting it onto the future rather than just the past we've already observed. And I want one on whether her appeal to "perfectly natural properties," which she needs so people can't just gerrymander predicates to make any old pattern look simple, isn't itself extra unexplained metaphysical structure that a view advertised as "nothing but the mosaic" shouldn't need in the first place. For each question, give me a line on the dodge she'll probably reach for and a follow-up that closes it off.
