answer: |-
  Here’s a draft that threads your needle: rigorous for the biologists, heartfelt for the family, and using the handicap principle as the *core* metaphor without reducing love to fitness. It runs about 4.5 minutes when read aloud with pauses:

  ---

  **(Clink glass gently)** Everyone? If I could have your attention… For those who don’t know me, I’m [Your Name], the bride’s older brother. And yes, the philosopher. My sister, in her wisdom, decided that entrusting the toast to someone professionally trained to overthink things was a good idea. Challenge accepted.

  Now, my brilliant sister [Sister's Name] and her wonderful partner [Partner's Name] live in a world where they ask profound questions about life. Why does that gazelle leap high in the air when it sees a predator, making itself *more* obvious? Why does that bird build such an absurdly elaborate nest? Why does that peacock drag around a tail that makes flying awkward? They study signals – honest signals. Because in nature, as my sister could tell you, saying "trust me, I’m strong" or "trust me, I’m committed" is cheap. Anyone can chirp it.

  This brings me to a concept my sister knows well, courtesy of Amotz Zahavi: the **handicap principle**. The idea is that the *most honest* signals are often the *costliest*, the hardest to fake. That gazelle’s stotting? It’s shouting, "See how high I can jump? I’m so fit, I can waste energy *and* still outrun you!" The peacock’s tail screams, "Look at this ridiculous burden I carry and thrive despite! Imagine my genes!" It’s not about efficiency; it’s about **costly proof**. The very difficulty, the extravagance, the *vulnerability* of the signal *is* its honesty. Only the truly capable, the truly committed, can afford it.

  **(Pause, look at the couple)**

  Which brings us to… *this*. Look around. This gathering. These vows about to be spoken. The sheer effort, planning, expense, and emotional exposure of this entire day. Viewed through one lens, it’s a bit like that peacock’s tail or the gazelle’s leap. It’s extravagant. It’s costly. It makes you incredibly vulnerable in front of everyone you care about. You could have just whispered promises to each other in private. That would have been… cheaper. Easier. Safer.

  But you didn’t. You chose *this*. You chose the big, beautiful, burdensome, vulnerable display. Why? Because **love, the deepest kind of commitment my sister studies in nature and lives in her own life, demands its own form of costly honesty.**

  This ceremony, this celebration – it *is* your shared handicap. It’s your way of saying, together, to each other and to all of us: **"What we have is real enough, strong enough, *valuable* enough, that we are willing to invest not just privately, but publicly. We are willing to bear the cost, the effort, the exposure, because *this* is the proof worth giving."** It’s not just about proving something *to* rivals or the world outside – though gathering us all here certainly does that! It’s about proving something *to each other*, and reaffirming it *through* the community that sustains you. The costliness isn't a regrettable side effect; it’s the very mechanism of the vow. It says, "We mean this so much, we stake our comfort, our resources, our pride on it."

  **(Shift tone, more intimate, looking at the couple)**

  [Sister's Name], [Partner's Name], what Zahavi understood about stotting gazelles and flamboyant birds is that the cost *transforms* the signal. It moves it beyond mere convenience into the realm of profound truth. That’s what you’ve done today. You haven’t just declared your love; you’ve *burdened* yourselves with it publicly, beautifully, in a way that only those utterly sure of its worth would dare to do. You’ve made your commitment *hard to fake* by making it *hard to do*. And that makes it breathtakingly real.

  So, as a philosopher, I see the logic. As your brother, I see the love. And as a witness to this magnificent, costly, honest signal you’ve created together, I am deeply moved.

  **Let us raise our glasses: To [Sister's Name] and [Partner's Name]. May your love always be strong enough to bear its beautiful, necessary cost. May your commitment, like the most honest signal in nature, only grow deeper and truer with time. To the costly, glorious, and utterly real proof of your love!**

  ---

  **Why this works:**

  1.  **Rigorous for Biologists:**
      *   Correctly frames Zahavi (handicap principle = costly/honest signals).
      *   Uses accurate examples (stotting, peacock tails).
      *   Addresses the "within-pair" concern: It explicitly shifts the focus *away* from rivals/prospective mates ("It’s not just about proving something *to* rivals...") and *towards* mutual proof and community affirmation ("proving something *to each other*, and reaffirming it *through* the community"). It links the cost to mutual commitment within the pair bond.
      *   Uses precise language ("costly proof," "vulnerability," "mechanism of the vow," "hard to fake by making it hard to do").
  2.  **Emotional for Family:**
      *   Grounds the biology in universal human concepts: effort, vulnerability, public commitment, proof of love.
      *   Explicitly separates the *analogy* from *reductionism*: "You haven’t just declared your love; you’ve *burdened* yourselves with it publicly... in a way that only those utterly sure of its worth would dare to do." This counters the "just fitness display" fear.
      *   Emphasizes *choice* and *value*: "What we have is real enough, strong enough, *valuable* enough..." "You chose *this*."
      *   Ends on pure warmth and well-wishing ("May your love always be strong enough...").
  3.  **Structure:**
      *   **Hook:** Humorous self-deprecation (Philosopher brother).
      *   **Setup:** Introduces the couple's world (signals in nature) and Zahavi's core idea clearly.
      *   **Pivot:** Connects Zahavi to the wedding event ("Which brings us to... *this*").
      *   **Core Argument:** Explains *how* the wedding acts as a costly signal *for their specific commitment*, addressing both the academic and emotional angles.
      *   **Payoff:** The transformation of the signal by cost into profound truth, applied to love.
      *   **Toast:** A clear, warm, and resonant call that encapsulates the theme ("costly, glorious, and utterly real proof").
  4.  **Bonus:** The final toast line is meaningful, resonant, and easy for everyone to raise a glass to.

  **Tips for Delivery:**

  *   **Pacing:** Don't rush. Pause after key lines, especially the punchier biological concepts and the more emotional turns.
  *   **Eye Contact:** Shift between the couple, the biologist section of the room when explaining Zahavi, and the wider family during the more emotional parts and the toast.
  *   **Tone:** Start warm and slightly humorous. Shift to clear and explanatory for the science. Become sincere and heartfelt for the application to the couple and the toast. Let your genuine affection for your sister show.
  *   **Practice:** Read it aloud several times to get the cadence right and ensure it fits your natural speaking style. Trim slightly if needed, but the core argument is important.

  This toast respects your sister's world, satisfies her colleagues, touches the hearts of family, and turns a fascinating biological principle into a profound celebration of love and commitment. Good luck!
