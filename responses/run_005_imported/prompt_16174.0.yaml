prompt: |-
  I'm a philosophy PhD student working on philosophy of physics, and I'm taking a seminar this term on the metaphysics of spacetime where we just spent two weeks on the hole argument. I feel like I've got the technical setup down cold -- the diffeomorphism thats the identity outside some "hole" region but not inside it, how it gives you two models of GR that agree on everything outside the hole but disagree on which point gets which metric value inside it, and why that looks like radical indeterminism if you're a manifold substantivalist. What I'm still kind of stuck on is how the dialectic is supposed to go once "sophisticated substantivalism" enters the picture. My professor thinks that once a substantivalist gives up haecceitism about spacetime points (using something like Lewis's counterpart theory to fix cross-model "identity" by qualitative role instead) and helps themselves to Leibniz equivalence, that's a legitimate way to dodge the indeterminism result without abandoning substantivalism. A friend of mine in the seminar insists this is just relationalism wearing a substantivalist trenchcoat, since giving up primitive identity of points is exactly what made the original dispute have any teeth.

  Could you write me a dialogue between a sophisticated substantivalist and a relationalist actually hashing this out, where they're responding to each other's specific moves rather than just each restating their own view? I'd like the substantivalist to have to defend why borrowing counterpart theory to fix which point in one model corresponds to which point in the diffeomorphic model isn't just an ad hoc patch, and I'd like the relationalist to have to answer for whether they can even state what a diffeomorphism is, or formulate Leibniz equivalence itself, without covertly quantifying over the very manifold points they deny are fundamental. Neither of them should be strawmanned -- I want two people who actually know the literature going at it, not a caricature where one side obviously wins.
