answer: |-
  Here's a scenario designed to sharply highlight Lewis's equivocation on "can," distinct from the grandfather paradox yet leveraging similar tension:

  **The "Self-Rescue" Paradox:**

  1.  **Setup:** Alex, at age 30, carries a vivid, traumatic memory from age 10: while hiking alone on Mount Veridian, she suffered a severe fall down a specific rocky slope. She broke her leg, lay immobilized for 12 agonizing hours in worsening weather before rescuers found her, leading to permanent nerve damage and chronic pain. This event profoundly shaped her life.
  2.  **The Plan & "Local Can":** Alex acquires a time machine. Her plan: travel back to the precise moment *just before* her 10-year-old self (Young Alex) steps onto the unstable rock that causes the fall. She will be positioned further down the slope, ready to shout a warning ("Stop! The rock is loose!") and physically catch Young Alex if she slips. Alex meticulously prepares:
      *   She trains her voice projection.
      *   She studies the exact location and weather conditions of that day.
      *   She rehearses the maneuver to intercept a falling child safely.
      *   She arrives early, hidden, with a clear line of sight and no obstacles between her and Young Alex's path.
      *   Young Alex is alone, distracted, and approaching the fatal spot.
      *   **Local "Can" Sense:** Relative to Alex's *local abilities and immediate circumstances* at the moment of action, she absolutely *can* shout the warning. Her vocal cords work, the air is clear, nothing blocks the sound. She absolutely *can* attempt the catch. She's physically capable, practiced, unhindered, and positioned correctly. All the necessary conditions for the action are present *in that localized slice of time and space*. If we hold fixed only Alex's physical/mental state and the immediate micro-environment, shouting and catching *can* happen.
  3.  **The Failure & "Global Can":** Alex shouts. Young Alex either doesn't hear, ignores it, or hesitates too late. Alex lunges for the catch but slips on the same loose rocks, or Young Alex falls just out of reach. The fall happens *exactly as Alex remembers it*. History remains unchanged. Alex watches her younger self suffer, helpless to prevent the event she knows defines her own past.
      *   **Global "Can" Sense:** Relative to the *complete, fixed history of the actual world* – a history that *includes* Alex's 30-year-old self possessing the memory of the un-prevented fall, the resulting chronic pain, and her motivation to time travel – Alex *cannot* succeed in preventing the fall. The actual, singular timeline has the fall occurring. For Alex to have the memory and motivation she possesses, the fall *must* have happened. Holding fixed the entire history of the world leading up to the time travel event, including Alex's own existence and memories, makes the prevention *impossible*. The global facts constrain what *can* happen at the local level.

  **The Sharp Pull Against Intuition:**
  *   **Local "Can" is Overwhelmingly Strong:** Unlike a grandfather killing, which might involve overcoming guards or moral qualms, Alex's "local can" feels *pure* and *unimpeded*. It's a simple, direct, physical act of warning and catching in ideal conditions. There's no villainy, just desperate self-preservation. Our intuition screams that she *should* be able to do this.
  *   **Global "Can" Feels Cruelly Inevitable:** Yet, the fixed history (including Alex's own memories and injuries) makes the failure just as undeniable. The tension is visceral because the failure isn't due to a lack of skill or effort (local failure), but because the *universe itself* seems to force the outcome despite perfect local conditions. This clashes hard with our ordinary intuition that if you have the ability and the opportunity *right now*, you *can* act.

  **How Lewis's Diagnosis Differs from Branching/Self-Consistency:**

  1.  **Branching Timelines:** A branching model *dissolves* the paradox by saying Alex *can and does* succeed... but only in a *new* branch. In her original branch, she always failed. This avoids contradiction by multiplying realities. Lewis doesn't need new branches. He argues the contradiction in the *single* actual timeline is only apparent, arising from shifting the background facts relative to which "can" is assessed. In Lewis's view, in the one actual world, Alex locally *could* (in the ability+opportunity sense) but globally *could not* (in the consistent-history sense) succeed, and there's no contradiction in stating both once the relativization is clear. The work is semantic, not metaphysical.
  2.  **Novikov Self-Consistency Principle (SCP):** The SCP *physically prevents* the paradox. It would say the laws of physics *guarantee* Alex slips, or Young Alex doesn't hear, or the rock gives way slightly earlier – something always intervenes to make the local success impossible. It adds a *physical constraint* to time travel. Lewis makes no such claim about physics. He agrees that *in the local sense*, Alex genuinely *can* – the physical possibility is there in the moment. The "cannot" comes solely from the logical/modal incompatibility of the action with the fixed past/future, *not* from a physical law actively preventing the action *as it unfolds*. The failure might look like a freak accident (slipping), but for Lewis, it's not that physics *caused* the slip to enforce consistency; it's that the slip *happened* (as part of fixed history), making the success globally impossible. The diagnosis is about the meaning of possibility claims, not a mechanism of enforcement.
  3.  **The Work of Semantics:** Lewis's key point is that the paradox stems from *language* and *context*, not an inherent impossibility in the universe. We naturally shift between contexts when assessing possibility: planning an action (local context) vs. reflecting on fate or inevitability (global context). The word "can" is context-sensitive. Branching and SCP offer *solutions* by changing the rules of time travel (multiple worlds or new physical laws). Lewis offers a *dissolution* by clarifying how we talk about possibility within a single, fixed timeline. He shows why, even in a metaphysically possible block universe where the past and future are equally real, statements about what an agent "can" do aren't inherently contradictory; they just need careful relativization.

  **Why it Works:** The "Self-Rescue" scenario makes the "local can" feel maximally achievable (simple warning/catch) and the "global cannot" feel maximally inescapable (the traumatic memory *proves* failure). This forces the equivocation into sharp relief. Lewis's semantic diagnosis explains the *apparent* contradiction without invoking new physics or branching universes, highlighting how context dictates the relevant set of fixed facts for modal claims like "can." It reveals the paradox as a trick of perspective in our language, not necessarily a flaw in the concept of time travel itself.
