prompt: |-
  At work I've been putting together an internal tool for deciding when to stop an A/B test and ship a feature rather than keep collecting data, and in reading up on the statistics behind that decision I ran across a result a former colleague of mine (a philosophy major before she became an engineer) calls "Good's theorem," after the statistician I. J. Good, from a paper apparently titled "On the Principle of Total Evidence." As I understand it, the theorem shows that for a Bayesian decision-maker, the expected value of any piece of cost-free evidence is never negative: looking before you choose can only help you or leave you exactly as well off, never hurt you, provided you update on it correctly and remain free to act exactly as you would have if you'd never seen it. My former colleague treats this as basically settling, once and for all, that "ignorance is bliss" is a comforting myth rather than a genuinely rational stance for anyone who wants to call themselves a good Bayesian.

  That claim has been nagging at me, though, because it seems to clash with cases that strike me as obviously sensible rather than confused. My sister recently declined to learn the result of a predictive genetic test for a condition with no available treatment either way, on the grounds that finding out would only make her anxious without changing a single thing she'd do. Along similar lines, I have friends who ask not to be told sports scores before watching a delayed broadcast, and who report being genuinely happier, even in hindsight, for having avoided the spoiler. If Good's theorem really proves that a rational Bayesian can never be made worse off by free information, doesn't it follow that my sister and these friends are all committing a rationality error dressed up as a preference, and that a sufficiently rational agent would always choose to look? I would like to understand whether the theorem actually forces that conclusion, or whether I am stretching it further than it was meant to cover.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're working on an A/B testing tool and came across Good's theorem. Their colleague presented it as proof that more information never harms a Bayesian decision-maker. But the user is troubled because real-life examples like their sister avoiding genetic test results or friends avoiding sports spoilers seem to contradict this. They want to know if the theorem really implies these people are irrational.

  First, I need to recall Good's theorem accurately. It states that for a Bayesian, the expected utility of acquiring cost-free evidence is non-negative, assuming they update beliefs correctly and act optimally. But the key here is that utility must only depend on actions and states, not on the information itself. 

  The user’s examples involve cases where information directly affects utility. The sister’s anxiety from knowing the test result, even without any action change, is a direct utility impact. Similarly, spoilers reducing enjoyment of a game—that's hedonic. So, in these scenarios, the information itself changes the utility function's inputs, which Good's theorem doesn't account for because it assumes state-dependent utility.

  I should explain the limitations of the theorem. It's built on specific assumptions: utility based solely on actions and world states, no psychological costs. When info affects emotions or preferences, like causing anxiety, that's an additional utility component. The theorem doesn't cover that. 

  Also, in the sports example, knowing the outcome alters the experience of watching. The user's friends derive utility from suspense and surprise, which are state-dependent but tied to their knowledge state. Good's theorem considers the world state, not the agent's epistemic state. So if utility includes "being surprised," then the information directly impacts that.

  The user might be conflating instrumental value with experiential value. Good's theorem addresses instrumental value—using info for better decisions. But if information has intrinsic effects on well-being, it's outside the theorem's scope. Their sister’s case isn't about decision-making; it's about emotional impact. 

  I need to ensure the user understands that their examples don't violate the theorem because the theorem assumes no psychological costs. Their colleagues' claim that ignorance isn't bliss only holds under strict Bayesian assumptions. Real humans have utility functions that include mental states affected by information. 

  Additionally, the user might wonder if avoiding information is rational. From a Bayesian perspective with a broad utility function that includes happiness, anxiety, surprise, etc., avoiding certain information is perfectly rational. It's not a mistake but a preference encoded in their utility. 

  In conclusion, Good's theorem doesn't force the conclusion that their sister or friends are irrational. The theorem's scope is limited to decision-making utility, not experiential utility. The user's examples highlight situations where information has direct hedonic impacts, which require a more comprehensive utility model.
answer: |-
  You've hit on a profound and often misunderstood point. **Good's theorem does *not* imply your sister or sports-avoiding friends are irrational.** Their choices can be perfectly consistent with Bayesian rationality. The apparent clash arises because Good's theorem makes specific, often unrealistic assumptions that don't hold in your examples. Let's break it down:

  1.  **Good's Theorem Recap (The Core Idea):**
      *   **Assumption 1:** You are a Bayesian agent with well-defined prior beliefs and a utility function.
      *   **Assumption 2:** Your utility *depends solely on the state of the world and the action you take*. It **does not depend directly on the information you possess or the process of acquiring it** (no "psychological" costs/benefits).
      *   **Assumption 3:** Acquiring the evidence is cost-free (no money, time, effort, or psychological cost).
      *   **Assumption 4:** You will update your beliefs correctly (Bayes' theorem) upon seeing the evidence.
      *   **Assumption 5:** You are free to choose the optimal action *after* seeing the evidence, including any action you would have chosen *without* the evidence.
      *   **Conclusion:** Under these assumptions, the *expected* utility (calculated *before* seeing the evidence) of acquiring the evidence is **greater than or equal to** the expected utility of *not* acquiring it. It can never be negative. Information is potentially helpful (if it changes the optimal action) or neutral (if it doesn't), but never harmful *in expectation*.

  2.  **Where the Examples Violate the Assumptions (Especially #2):**
      *   **Your Sister (Predictive Genetic Test):**
          *   **Violates Assumption 2 (Utility Depends on Information State):** Her utility function *does* depend directly on the information she possesses. Knowing a positive result (even if she can't act on it) causes significant anxiety. This anxiety is a *direct disutility*.
          *   **Violates Assumption 3 (Cost-Free Evidence):** The "cost" here is psychological distress (anxiety). The evidence is *not* cost-free for her.
          *   **Violates Assumption 5 (Free to Act the Same):** While she *can* physically act the same way, her *internal state* (anxiety level) is different, impacting her well-being *regardless of action*. The theorem only guarantees she can choose the same *external* actions, not that her *experience* will be the same.
          *   **Rationality:** Her prior belief likely includes the knowledge that a positive result will cause anxiety. Choosing to avoid this guaranteed disutility (anxiety) when there's no compensating instrumental benefit (no action change) is perfectly rational. She is maximizing her *expected utility*, which includes avoiding negative mental states.

      *   **Your Friends (Sports Spoilers):**
          *   **Violates Assumption 2 (Utility Depends on Information State):** Their enjoyment (utility) of watching the game *fundamentally depends* on their epistemic state – specifically, on *not knowing* the outcome. The suspense, surprise, and emotional rollercoaster *are* key components of the utility they derive from watching. Knowing the score directly destroys this utility source.
          *   **Rationality:** Their utility function explicitly values the experience of *uncertainty and surprise* during the game. Acquiring the spoiler destroys that valued experience. Avoiding the information preserves the higher utility experience they desire. This is rational preference maximization. They are not making a decision error; they correctly anticipate that information would directly degrade the quality of their experience.

  3.  **Why Good's Theorem Doesn't Apply Here:**

      *   **"State of the World" vs. "State of Mind":** Good's theorem assumes utility depends only on the *external* state of the world and your *action*. In your examples, utility crucially depends on an *internal* state of mind (anxiety, surprise, suspense) that is directly altered by the information itself.
      *   **Instrumental vs. Experiential Value:** The theorem focuses on the *instrumental* value of information for making better *decisions*. Your examples highlight the *experiential* or *hedonic* value of information (or ignorance) itself. Good's theorem assumes information has *only* instrumental value.
      *   **Psychological Costs are Real Costs:** Anxiety and the destruction of suspense are real negative utilities. Good's theorem explicitly assumes evidence is cost-free, which these psychological impacts violate.

  4.  **What Good's Theorem *Does* Settle (and its Limits):**

      *   **Pure Decision-Making Contexts:** It rigorously proves that if information *only* helps you make better decisions about actions that affect the external world (e.g., investing, medical treatment *with* options, engineering choices for your A/B test tool), and has *no* inherent psychological cost or benefit, then a Bayesian should never rationally *avoid* free information. Ignorance cannot improve your *outcomes* in this pure instrumental setting.
      *   **"Ignorance is Bliss" Myth (Narrowly Defined):** It debunks the idea that you can make *better external world outcomes* happen by deliberately avoiding free, costless information relevant to the decision. In the pure decision-theoretic context, information cannot hurt your *results*.
      *   **It Does *Not* Settle:** Whether information can negatively impact your *happiness*, *peace of mind*, or *enjoyment of experiences* due to its direct psychological effects. Rational agents *can* and *should* avoid information when they rationally anticipate it will cause net disutility through these channels, even if it has no impact on their external actions.

  **Conclusion:**

  Your intuition is correct. Good's theorem is powerful within its specific domain of pure Bayesian decision-making where utility depends solely on actions and external states. However, it does *not* cover situations where information itself directly impacts utility through psychological or experiential channels, like causing anxiety or ruining surprise. **Your sister and friends are not committing a rationality error.** They are rationally maximizing their *overall* expected utility, which includes their mental state and experiential well-being. Good's theorem simply doesn't apply to these cases because its core assumptions (especially utility independent of information state and truly cost-free evidence) are violated. A sufficiently rational agent *with a utility function that values surprise or disvalues anxiety* would rationally choose *not* to look in these specific scenarios. Their "preference" *is* a rational stance for a good Bayesian with a realistically broad utility function.
