  ## The Weight of All Dust

  The rain drummed a hollow rhythm on the coffin as they lowered Ben into the Sussex clay. Marcus stood apart, collar turned up against the damp chill that had nothing to do with the English spring. The vicar’s words – *“ashes to ashes, dust to dust”* – echoed with a new, terrible resonance. Not just Ben’s dust. All dust. Everywhere.

  It had started innocently enough. A late-night seminar, Lewis’s *On the Plurality of Worlds* open on the worn oak table, the air thick with cheap coffee and undergraduate bravado. Marcus, the weary philosophy lecturer, had presented modal realism with clinical precision: infinite concrete worlds, causally isolated, each maximal spatiotemporally interrelated sum of things, differing in any way possible. "Actual" merely indexed the speaker's location. His students had balked, laughed, argued about superheroes and talking donkeys. Marcus had felt the familiar, comfortable distance of the academic.

  Then came the call. Ben, his younger brother, vibrant and reckless, had taken his motorbike out on wet country roads. A bend taken too fast, a patch of diesel. Instantaneous. The paramedics said he wouldn't have felt a thing. Marcus, numb with shock, had found himself staring at a loose pebble on the gravel driveway outside the hospital. *In another world,* the thought slithered in, unbidden, *that pebble wasn’t there. Ben braked half a second earlier. He stayed home.* That world was as real as this one. Concrete. Ben was alive there, laughing, arguing about football, oblivious to the grief crushing Marcus *here*.

  That was the beginning of the unravelling. The funeral cemented it. Every tear shed, every choked-back sob – wasn’t it mirrored infinitely? In countless worlds, Ben lived. In countless others, he died in ways more agonizing, more prolonged. Worlds where the diesel spill was larger, the bike hit a tree instead of sliding, where paramedics arrived too late. Worlds where Marcus himself was the one on the bike, or where neither of them existed at all. The sheer, crushing *volume* of it.

  Lewis’s escape hatch – *reasons for action are agent-relative, tied to our causal context* – felt like tissue paper against a tidal wave. Sure, Marcus could only affect *this* world. His grief was *here*. His responsibilities – marking essays, feeding the cat, remembering to eat – were *here*. But "here" was arbitrary. A cosmic accident of location. Why did *this* grief matter more than the grief of that Marcus-counterpart in the world where Ben died slowly, screaming for help that never came? Why did *this* Marcus's guilt over the last, stupid argument they’d had weigh anything at all, when in most worlds, they’d parted warmly? The guilt wasn't unique; it was mass-produced.

  He stopped marking essays. The cat’s plaintive mews became background noise to the static in his head. He walked. Endlessly. Through the grey streets of the university town, past students laughing, arguing, living their tiny, intense dramas. Each face was a focal point. That girl arguing on her phone? In a branching thicket of worlds, she won the argument, stormed off happily, was hit by a bus, reconciled tearfully, discovered a hidden talent sparked by the stress… an infinite array of concrete lives, joys, and agonies radiating from that single moment.

  He saw Ben everywhere. Not ghosts, not really. Just counterparts. A flash of dark hair like Ben’s disappearing around a corner. The particular way a young man in a café threw his head back when he laughed. The hunch of shoulders under a leather jacket waiting at a bus stop. Each sighting was a knife twist. *He’s alive there. He’s dead differently there. He never existed there.* And all those worlds were equally valid, equally *real*. His grief felt monstrously self-absorbed. A single, insignificant sob in an infinite chorus of suffering and joy.

  One rain-slicked evening, he found himself standing on the bridge where Ben had crashed. The diesel stain was long gone, washed away. He leaned against the cold metal railing, looking down at the dark water swirling below. The thought wasn't of jumping. It was of pointlessness.

  *Why bother?* The question had become his mantra. Why be good? Why try? In worlds beyond counting, he was a saint. In others, a monster. In most, probably, just… average. Flawed. His choices here, in this tiny, arbitrary slice of actuality, meant nothing to the grand, indifferent totality. Saving a stranger from stepping into traffic? In countless worlds, he saved them. In countless others, he didn’t. In others still, *he* was the one stepping out. The net effect? Zero. A perfect, cosmic equilibrium of action and consequence spread across an infinity of concrete realities. Morality wasn't just relative; it was statistically nullified.

  He remembered Lewis’s argument again, like a worn talisman: *You are embedded here. Your causal powers operate here. Therefore, your reasons are here.* It felt like being told to tend a single, wilting flower in the middle of a burning forest spanning all of creation. Yes, he could water *this* flower. But the forest was still burning. The flower was still insignificant. The smoke choked him regardless.

  He saw a figure walking towards him on the bridge. A young man, hood up against the drizzle, shoulders hunched. Something about the way he moved – the slight swing of the right arm, the head tilted just so – was devastatingly familiar. It wasn’t Ben. Marcus knew that rationally. It was a counterpart, statistically inevitable given infinity. A young man who shared a cluster of properties with Ben at some point in his world’s history. But the resemblance, in this dim light, on this bridge… it was unbearable.

  As the young man drew level, Marcus lurched forward, a strangled sound escaping his throat. The young man flinched, startled, pulling his earbuds out. "Alright, mate?"

  Marcus stared. The eyes were wrong. The voice was wrong. But the ghost of Ben lingered in the angle of the jaw, the confusion on the face. "I... sorry," Marcus rasped. "Thought you were... someone else."

  The young man frowned, wary. "Right. No worries." He started to move past.

  "Does it matter?" The words tumbled out, raw and desperate. Marcus grabbed the man’s sleeve, then instantly recoiled as if burned. "Sorry! I... does it matter? Anything? What you do? What happens?"

  The young man backed up a step, eyes wide. "You pissed, mate? Leave off."

  "Please," Marcus pleaded, the dam breaking. "Just tell me. If you knew... if you *knew* that somewhere else, in another place just as real as this, you were doing the opposite... that every choice you make is made differently a million times over... that every bad thing, every good thing... it all happens anyway... why would you *care*? Why bother being decent? Why bother *feeling*?"

  The young man stared at him as if he were rabid. "Christ, you need help." He shoved past Marcus, walking quickly away, muttering about "fucking nutters."

  Marcus slumped against the railing, the cold metal biting through his coat. The rain intensified, plastering his hair to his forehead, mingling with the hot tears he hadn’t realized were falling. He wasn’t crying for Ben. Not just for Ben. He was crying for the infinite Bens who lived and died in every conceivable way. He was crying for the infinite Marcuses drowning in guilt or shrugging it off, for the lovers and the killers, the saints and the tyrants, all equally real, all trapped in their isolated bubbles of causality. He was crying for the sheer, overwhelming *waste* of it all. Why feel anything, when every feeling was echoed, contradicted, and ultimately diluted into meaninglessness across the multiverse?

  He slid down onto the wet pavement, back against the railing, heedless of the damp seeping through his trousers. He picked up a small, smooth pebble from the gutter. It was grey, unremarkable. He weighed it in his palm.

  *In another world, this pebble isn’t here. In another, it’s a diamond. In another, it crushes a beetle. In another, it’s never formed.*

  Lewis was right about one thing: his causal powers *were* limited to this world. He could only throw *this* pebble into *this* dark water below. The splash would be small, local, insignificant against the cosmic backdrop. It wouldn’t change the infinite suffering. It wouldn’t bring Ben back, here or anywhere. It wouldn’t absolve his guilt, felt only in this insignificant corner of reality.

  But the urge to throw it was *here*. The crushing weight of grief for *this* brother was *here*. The memory of the young man’s frightened face was *here*. The damp chill, the drumming rain, the sour taste of despair – all *here*. He couldn’t touch the other worlds. He couldn’t lessen their suffering or augment their joy. He was trapped in this one, dusty, insignificant point.

  He closed his fist tightly around the pebble. The rough edges pressed into his palm. A tiny, localized pain. A reason, of sorts. Not grand. Not cosmic. Not even moral, perhaps. Just... proximate. He couldn't carry the weight of all dust. But he could feel the unbearable, arbitrary weight of *this* dust, *here*.

  He didn’t throw the pebble. He pushed himself stiffly to his feet, legs numb. He slipped the wet, cold stone into his coat pocket. It was a stupid, meaningless gesture. It wouldn’t change a thing, anywhere. But it was an action he could take, in this world, because he was causally embedded here, and the grief, however cosmically insignificant, was *his*, and demanded something.

  He walked away from the bridge, the pebble a small, hard weight against his thigh. The rain fell. The infinite worlds spun on. And Marcus carried his tiny, unbearable fraction of all possible dust back towards the indifferent glow of the streetlights. He still didn't know why it mattered. But the weight insisted that it did.
