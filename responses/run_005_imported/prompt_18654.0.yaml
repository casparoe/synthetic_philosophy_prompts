  We are to rank objections to David Lewis's modal realism. We'll have five tiers: S (essentially fatal), A, B, C, D (minor nuisance). We need at least five distinct objections, spread across at least three tiers.

  Here are some standard objections to Lewis's modal realism, along with a brief gloss and attribution where known:

  1. **The Incredulous Stare** (attributed to common reaction, but Lewis himself named it): The theory is simply too counterintuitive to believe because it posits an enormous number of concrete worlds that are just as real as ours but causally isolated. *Gloss*: The view is so ontologically extravagant that it defies common sense.

  2. **The Problem of Accidental Intrinsics** (Lewis's own problem, but he has a response): How can the same individual exist in multiple worlds when properties like shape are intrinsic and can vary? *Gloss*: If an object has different intrinsic properties in different worlds, then it cannot be the very same object.

  3. **The Epistemological Objection**: How can we have knowledge about other possible worlds if they are causally isolated? *Gloss*: Since there is no causal interaction, we cannot have any epistemic access to these worlds.

  4. **The Parsimony Objection** (a general metaphysical principle): The theory is unparsimonious because it multiplies entities (concrete worlds) without necessity. *Gloss*: Modal realism violates Occam's razor by postulating a vast plurality of worlds.

  5. **The Isolation Problem**: If the worlds are causally isolated, then how can we meaningfully refer to them or have truths about them? *Gloss*: Causal isolation seems to preclude any semantic connection.

  6. **The Problem of Extrinsic Representation**: How can we represent other worlds if they are causally isolated? *Gloss*: Our representations (like language) are causal, so they cannot refer to isolated worlds.

  7. **The Modal Realist's Dilemma** (attributed to Lycan and Shapiro): Either modal realism is circular (because it uses modal notions in its explication) or it is not a reductive theory. *Gloss*: The account of possibility in terms of worlds must either presuppose modality or fail to reduce it.

  8. **The Truthmaker Problem**: What makes modal statements true? For Lewis, it's the existence of concrete worlds, but this seems to require an implausible truthmaking relation. *Gloss*: The theory requires that truths about possibility are made true by entities (other worlds) that are not part of our world.

  9. **The Problem of the Actuality Index** (Lewis's own term): How do we account for the special status of the actual world? *Gloss*: If all worlds are equally real, then what makes our world actual?

  We need to rank at least five of these. We'll choose five to seven and assign them to tiers.

  Tier S (essentially fatal): The objections that are considered the most damaging, potentially fatal.
  Tier A: Very damaging but perhaps not fatal.
  Tier B: Damaging but Lewis has substantive replies.
  Tier C: Lewis can handle with moderate effort.
  Tier D: Minor nuisance, easily handled.

  After reviewing the literature:

