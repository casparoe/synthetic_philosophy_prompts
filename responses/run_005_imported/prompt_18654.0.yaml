  - **Parsimony Objection** (A tier): Lewis argues that the theoretical benefits outweigh the cost, but it's a heavy cost.

  - **Modal Realist's Dilemma** (B tier): Lewis has a reply that his analysis is reductive without circularity, but it's a technical point.

  - **Problem of Accidental Intrinsics** (C tier): Lewis has a solution via counterpart theory, so it's handled.

  - **Truthmaker Problem** (D tier): Lewis can say that truthmaking is not a local relation and that the truthmaker is the entire plurality of worlds, which is a standard move.

  - **Actuality Index** (D tier): Lewis says "actual" is indexical, so it's just the world we are in, and that's a minor patch.

