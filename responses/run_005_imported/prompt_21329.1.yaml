answer: |-
  That's an excellent and perceptive question that cuts to the heart of a common misunderstanding about Bell's theorem. **The persistence of Bohmian mechanics (pilot-wave theory) is absolutely *not* due to stubborn holdouts ignoring "settled physics." It's because Bell's theorem does *not* rule out Bohmian mechanics at all. Bell's theorem specifically rules out *local* hidden variable theories. Bohmian mechanics is explicitly and fundamentally *non-local*, which allows it to evade Bell's conclusion while remaining deterministic and realist.**

  Here's a breakdown of why this is the case:

  1.  **Bell's Theorem: What it Actually Proves:**
      *   Bell showed that *no physical theory* that satisfies **both** of the following conditions can reproduce *all* the statistical predictions of quantum mechanics:
          *   **Realism (Hidden Variables):** Particles have definite properties (like position and spin) *prior to and independent of* measurement. These properties might be specified by "hidden variables" not in the standard quantum description.
          *   **Locality (Local Causality):** No influence of any kind (including the setting of hidden variables) can propagate faster than the speed of light. What happens at one location cannot *instantaneously* affect the state of a physically separated system.
      *   Crucially, experiments (starting with Aspect and continuing to this day) have confirmed the quantum mechanical predictions that violate Bell inequalities. Therefore, **any theory aiming to reproduce quantum mechanics must violate *either* locality *or* realism (or both).**

  2.  **The Orthodox (Copenhagen) Response:**
      *   Standard quantum mechanics (in its Copenhagen interpretation) rejects **realism** for the quantum realm. Particles don't have definite properties until measured. The wave function is the complete description, and its collapse upon measurement is inherently probabilistic. This sacrifices realism to preserve locality.

  3.  **The Bohmian Response:**
      *   Bohmian mechanics embraces **realism** and **determinism** but explicitly rejects **locality**.
      *   **How it works:**
          *   Particles *always* have definite positions (the hidden variables).
          *   There is a real, physically existing wave function (the "pilot wave") that guides the particles.
          *   The equation of motion for a particle's velocity depends *instantaneously* on the positions of *all other particles* in the universe, via the wave function evaluated at the current configuration of the *entire system*.
          *   This instantaneous dependence is the **non-locality**. It's not a bug; it's a core, essential feature that allows the theory to work.
      *   **Why it Evades Bell's Theorem:**
          *   Bell's theorem only forbids *local* hidden variable theories. Bohmian mechanics is explicitly a *non-local* hidden variable theory. Its non-locality allows it to generate the correlations seen in EPR-Bell experiments without contradicting relativity *in principle* (because the theory is formulated in a way that prevents superluminal *signaling* - you can't use the non-locality to send messages faster than light, even though the influences are instantaneous).

  4.  **Why Bohmian Mechanics is Taken Seriously:**
      *   **Empirical Adequacy:** It makes *exactly the same experimental predictions* as standard quantum mechanics for any experiment where both can be applied. It reproduces the Born rule statistically for particle positions.
      *   **Conceptual Clarity (for some):** It provides a clear, deterministic, and realist picture of quantum phenomena. There is no wave function collapse or inherent randomness in the dynamics. Measurement is just a special case of particle dynamics guided by the wave function interacting with a macroscopic apparatus.
      *   **Resolves Quantum Paradoxes:** It offers straightforward resolutions to conceptual puzzles like the EPR paradox and quantum non-locality (by embracing it) and the measurement problem (measurement is just complex particle dynamics). Schrödinger's cat is unambiguously alive or dead at all times.
      *   **Internal Consistency:** It is a mathematically well-defined theory. The ontology (point particles + pilot wave) is clear.
      *   **Fruitfulness:** It continues to be a subject of active research in foundations, quantum chemistry (trajectory-based methods), quantum field theory (though extensions are challenging), and even quantum cosmology. It provides unique insights and calculational tools.
      *   **Pedagogical Value:** Many find it conceptually easier to grasp than the Copenhagen interpretation's inherent indeterminism and collapse.

  5.  **Challenges and Criticisms (Why it's not Mainstream):**
      *   **Non-locality:** While mathematically consistent and not allowing signaling, the explicit, fundamental, and universal non-locality is deeply unsettling to many physicists who prize relativistic locality as a fundamental principle. It feels "unphysical" or "ugly."
      *   **Asymmetry:** The theory treats position as fundamentally special (the "hidden variable"), while other properties (like momentum) are contextual and defined through the wave function. This seems arbitrary to some.
      *   **The Wave Function:** The status of the wave function as a real, non-local field existing in a high-dimensional configuration space (rather than physical 3D space) is ontologically strange to many.
      *   **Extension to Quantum Field Theory:** While possible, formulating a fully relativistic Bohmian QFT that is equally compelling and tractable as the non-relativistic particle theory is an ongoing challenge.
      *   **"Empty" Formalism?:** Critics argue that because it makes the same predictions as standard QM, it doesn't offer new physics, only a different interpretation. Proponents counter that conceptual clarity and a different ontology *are* valuable.

  **Conclusion:**

  Bell's theorem definitively ruled out **local hidden variable theories**. It did *not* rule out hidden variables *in general*. Bohmian mechanics persists because it is a **non-local hidden variable theory** that successfully reproduces all quantum predictions while offering a deterministic and realist picture. Its persistence is based on **sound technical grounds** – it evades Bell's theorem by sacrificing locality, not realism or determinism. While controversial due to its non-locality and other conceptual issues, it remains a viable, consistent, and actively researched interpretation of quantum mechanics, valued by physicists and philosophers for its clarity, determinism, and unique perspective on quantum phenomena. It is not the relic of holdouts but a legitimate contender in the ongoing quest to understand quantum reality.
