prompt: |-
  I'm taking an epistemology seminar this semester, and something that happened with two of my roommates a few weeks back has been bugging me ever since we started the unit on knowledge and justification in class, so I wanted to get some outside opinions on it.

  Basically, my roommates Priya and Jonah were hunting for parking near our building, and there's this one spot with a faded sign that's genuinely ambiguous - it could be read as "no parking on street-cleaning days" or as "no parking on weekdays," depending on how you squint at the paint. They stood there together, read it out loud a couple times, argued about it for a bit, and eventually both agreed: "yeah, pretty sure this one's legal today." Jonah parked there and ran inside for like twenty minutes - if he's wrong, worst case he gets a small ticket, no big deal. Priya, meanwhile, was about to leave her car in that exact same spot for an entire week while she flew home for her sister's wedding, so getting towed would mean missing her flight and a genuinely ruined week. Right before walking off, she looked at the same sign again and said, "wait, actually, I don't think I know this is legal, let me just call the parking office first." Jonah got kind of annoyed: "we literally read the same sign and agreed on it two minutes ago, how can you suddenly not know something I still know?" Our third roommate, who's pre-law, backed Priya up, saying Jonah was being unreasonable because "obviously you should want more evidence when way more is riding on it."

  I've been going back and forth on this ever since. It feels wrong to say Priya just randomly lost her nerve for no reason, but it also feels off to say she stopped knowing something the second the stakes changed, since her evidence - the sign - was identical the whole time and nobody learned anything new in between. So who's actually right, if anyone? Is Jonah correct that they're flat-out contradicting each other, or is there some sense in which both of their claims about what they know can be true at once? And even if you can rescue both of them, does that automatically vindicate our other roommate's point that Priya was right to double-check, or is "what's reasonable to do" actually a totally seperate question from "what she knows"? Sorry for the wall of text, just curious what you think is actually going on here.
