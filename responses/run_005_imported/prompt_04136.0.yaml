answer: |-
  Below is a structured analysis designed for your capstone session, directly confronting the core objections, weighing philosophical costs, and addressing the question of substantive disagreement. I defend the verdict that **counterpart theory pays a higher price due to its deeper revisionism about *de re* modality, while the disagreement remains substantive even for stipulative transworld identity (TWI) theories.**

  ### 1. **Engaging the Core Objections**
     * **Kripke's Humphrey Objection Against Lewis:**  
       When we say "Humphrey might have won," we intend to speak about *Humphrey himself*—not a qualitative duplicate. Lewis’s claim that Humphrey’s *counterpart* winning satisfies this intuition fails because:  
       - **The Intentional Object Problem:** Our modal thought is *directly about Humphrey* (a specific entity in our world), not about a qualitatively similar individual elsewhere. A counterpart’s victory is irrelevant to *Humphrey’s* possibilities; it’s a fact about the counterpart’s world.  
       - **Epistemic Asymmetry:** Humphrey can *know* he might have won without knowing anything about counterparts. Lewis must explain this as knowledge of a similarity relation—but our intuition suggests Humphrey is reflecting on *his own* potential history.  
       *Lewis’s response* (modal claims are contextually about counterparts) feels like a semantic *revision* rather than an analysis of existing practice.

     * **Lewis’s Accidental Intrinsics Objection Against "Overlapping" TWI:**  
       If Humphrey exists in both W1 (sitting) and W2 (standing), then:  
       - Humphrey has both intrinsic properties *simpliciter* (contradiction), or  
       - Properties must be relativized to worlds (e.g., "sits-at-W1"), undermining the intrinsicality of sitting/standing.  
       *Kripke/Plantinga’s response* (non-overlapping worlds, transworld identity via haecceities/essences) avoids this:  
       - Humphrey is *world-bound*; "Humphrey-in-W2" is a distinct entity sharing Humphrey’s haecceity.  
       - Properties are not relativized; "Humphrey-in-W2 stands" is true without contradiction.  
       **Cost:** This requires primitive identities or haecceities—a commitment Lewis avoids.

  ### 2. **Lewis’s Vagueness/Multiplicity Problem & TWI’s Advantage**
     - **Problem:** If Humphrey has multiple counterparts (e.g., one winning, one losing), "Humphrey could have won" lacks a truth value. Lewis’s retreat (allowing anything to be its own counterpart) admits the relation’s artificiality.  
     - **TWI’s Edge:** Kripke/Plantinga avoid this. "Humphrey might have won" is true iff there’s a world *containing Humphrey* where he wins. Vagueness arises only if we doubt the *accessibility* of worlds (a separate issue). TWI preserves bivalence for most ordinary *de re* claims.

  ### 3. **Which View Pays the Higher Price?**
     **Verdict: Lewis’s counterpart theory bears the heavier burden.**  
     - **Metaphysical Cost (TWI):** Primitive haecceities or individual essences. *But* this is a localized ontological commitment, akin to accepting abstract objects or fundamental identities. Many non-modal theories accept similar primitives.  
     - **Philosophical Cost (Lewis):**  
       - **Revisionism of *De Re* Modality:** Counterpart theory reconstructs "what Humphrey could have been" as "what his counterparts are." This severs the intuitive link between an individual and *its own* possibilities. Kripke’s objection reveals a *conceptual loss*—the directness of *de re* thought.  
       - **Semantic Instability:** Vagueness/multiplicity makes modal claims systematically context-dependent or indeterminate. TWI avoids this by grounding truth in singular propositions about Humphrey.  
       - **Epistemic Opacity:** Knowing whether "Humphrey could have won" requires knowing similarity relations across worlds—far removed from ordinary modal knowledge.  
     **Lewis’s ontological parsimony (no "ghostly" transworld individuals) is outweighed by the upheaval to modal semantics and epistemology.**

  ### 4. **Is the Disagreement Substantive?**
     **Yes, even for stipulative TWI.**  
     - **Extensional Equivalence?** A Kripkean could say:  
       *"Humphrey exists only in α-worlds. Any 'Humphrey-in-β' is a distinct individual β-Humphrey who instantiates Humphrey’s haecceity. β-Humphrey’s properties tell us what is possible *for Humphrey*."*  
       This *looks* like counterpart theory (β-Humphrey resembles a counterpart).  
     - **Why It’s Still Substantive:**  
       - **Metaphysical Grounding:** For Kripke, β-Humphrey’s relation to Humphrey is a primitive *identity-of-essence* (e.g., sharing a haecceity). For Lewis, it’s a contextually constrained *similarity relation*. The former is a brute metaphysical fact; the latter is a conventional, mind-dependent comparison.  
       - **Truth Conditions:** "Humphrey could have won" is true, for Kripke, iff β-Humphrey *is Humphrey* (by haecceity) and wins. For Lewis, it’s true iff a suitably similar counterpart wins. The first appeals to *transworld identity*; the second denies identity entirely.  
       - **Modal Innocence:** Kripke preserves the intuition that we refer *directly* to Humphrey in modal contexts. Lewis replaces reference with description.  
     **Even if predictions align, the *mechanisms* differ metaphysically and semantically. Counterpart theory is a *reduction* of *de re* modality to *de dicto* facts about counterparts; TWI is not.**

  ### **Recommendation for Your Seminar**
  Focus the capstone on **two axes**:  
  1. **Cost-Benefit Scrutiny:**  
     - Does Lewis’s solution to accidental intrinsics justify redefining *de re* modality?  
     - Does Kripke’s haecceitism rescue intuition at the cost of explanatory primitives?  
  2. **The "Genuineness" Question:**  
     - If we define Humphrey’s "modal profile" via haecceity-linked individuals in other worlds, have we *tacitly adopted* counterpart theory? Or does the persistence of *transworld identity* (via haecceities) mark a categorical difference?  
     **Provocation:** The deepest divide may be whether modality requires *singular continuity* (TWI) or whether similarity is metaphysically sufficient (Lewis). That choice isn’t merely verbal—it reflects a rift in how we understand individuals and possibility itself.  

  This framework pushes beyond textbook contrasts, forcing students to evaluate foundational commitments. Lewis’s ingenuity in avoiding overlap comes at the price of reengineering modal thought; Kripke’s primitivism preserves intuition but risks obscurantism. Neither escapes cost, but counterpart theory’s reconceptualization of *de re* truth is the more radical—and costly—maneuver.
