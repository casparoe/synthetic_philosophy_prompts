prompt: |-
  I TA a graduate seminar on decision theory that spends a couple of weeks on moral uncertainty -- much of the material overlaps with stuff that gets discussed on the EA Forum and LessWrong, which is originally how I got interested in it. This week I'm grading responses to the seminar's discussion question, and I'd like an independent read on one of them before I finalize a mark, so I've tried to present it here without signalling my own view of it.

  The question was:

  Compare "My Favourite Theory" (MFT) and "Maximize Expected Choiceworthiness" (MEC) as decision procedures for an agent under moral uncertainty. (a) State the standard objection to MFT that motivates adopting MEC instead. (b) Identify the further problem that MEC faces which does not arise for ordinary expected-utility maximization under empirical uncertainty, and explain why it doesn't arise there. (c) Briefly describe the parliamentary-model proposal for handling the problem in (b), including its source, and assess whether it actually succeeds in avoiding that problem.

  Here is the submitted answer:

  (a) My Favourite Theory (MFT) instructs the agent to act on whichever moral theory currently has the highest credence and disregard the rest, regardless of how close the credences are or how much is at stake according to the theories that are outvoted. If I assign 0.51 credence to a theory that calls some act permissible and 0.49 to a theory that calls it a serious wrong, MFT tells me to go ahead as though the second theory did not exist. This produces sharp discontinuities in behavior around the 50% threshold even though credences themselves move continuously, and it throws away information about how strongly the losing theories object. MEC replaces this with a rule that weights each theory's verdict about how choiceworthy an option is by our credence in that theory and sums across theories, so that a theory with just under half our credence can still swing the decision if enough is at stake by its own lights.

  (b) The catch is that summing in this way presupposes that the "choiceworthiness" scores different theories assign are already on a common scale, so that a utilitarian score of +8 and a Kantian score of +2 can be added together meaningfully. Ordinary expected-utility maximization under empirical uncertainty doesn't face this problem because every possible state of the world is evaluated by the same utility function; only the probabilities of the states, not the scale used to value outcomes, are in question. Under moral uncertainty, by contrast, both the credences and the yardsticks are in question at once. This is essentially the same difficulty as the interpersonal comparison of utility in welfare economics, which Arrow's impossibility theorem already demonstrated cannot be resolved in a way that is both principled and non-arbitrary, so it is unsurprising that no consensus procedure for intertheoretic comparison exists either.

  (c) MacAskill's parliamentary model sidesteps this by not attempting cardinal comparisons at all. Each moral theory is treated as a delegate in an imagined parliament, holding a number of votes proportional to our credence in it; delegates then bargain and vote on which action to take, spending more of their voting weight on the choices their theory regards as most important and conceding on choices it regards as minor. Because this only requires each delegate to rank options and weigh how much it cares within its own theory, rather than across theories, it avoids the problem in (b) entirely and lets a low-credence theory with extreme stakes still exert proportionate influence, without our ever having to say how many units of utilitarian value a Kantian violation costs.

  Could you grade this out of 10 (allocate up to 3 points for (a), 4 for (b), and 3 for (c)) and back the mark up with specific, point-by-point comments rather than a general impression -- I want to be able to justify it if the student pushes back? Please return the assessment as a JSON object with keys "a", "b", and "c" (each holding a sub-score and the specific comment justifying it), "total" (out of 10), and "summary" (one sentence).
reasoning: |-
  We are grading the student's answer to a three-part question on moral uncertainty. The answer is presented in three parts (a, b, c) and we are to assign up to 3 points for (a), 4 for (b), and 3 for (c). We will evaluate each part and then provide a total out of 10 and a one-sentence summary.

  Part (a): The student must state the standard objection to MFT that motivates adopting MEC.

  Student's answer:
  - They describe MFT as acting on the highest credence theory and disregarding others, regardless of closeness or stakes.
  - They give an example: 0.51 vs 0.49 credence, where the 0.49 theory might consider the act a serious wrong, but MFT ignores it.
  - They note two issues: discontinuities around the 50% threshold and throwing away information about the strength of objections from losing theories.
  - They then describe MEC as weighting each theory's verdict by credence and summing, allowing a near-half theory to swing the decision if stakes are high.

  Evaluation:
  - The standard objection is well captured: the discontinuity and ignoring the intensity of moral claims from minority theories.
  - The example is clear and the contrast with MEC is appropriately drawn.
  - This answer is thorough and hits the key points. It should receive full marks (3/3).

  Part (b): The student must identify the further problem that MEC faces (which does not arise for ordinary expected utility under empirical uncertainty) and explain why it doesn't arise there.

  Student's answer:
  - The problem: MEC requires that the choiceworthiness scores are on a common scale for the sum to be meaningful. (Example: utilitarian +8 and Kantian +2 being added.)
  - They explain that in empirical uncertainty, we have one utility function evaluating all states, so only probabilities are uncertain, not the scale.
  - They note that in moral uncertainty, both credences and the yardsticks (the scales) are uncertain.
  - They draw an analogy to interpersonal utility comparison in welfare economics and mention Arrow's impossibility theorem to underscore the difficulty.

  Evaluation:
  - The identification of the intertheoretic comparison problem is correct and well explained.
  - The contrast with empirical uncertainty is clear: same utility function vs. multiple utility functions with possibly incommensurable scales.
  - The reference to Arrow's theorem and interpersonal comparisons is appropriate and strengthens the answer.
  - This part is also thorough and accurate. Full marks (4/4).

  Part (c): The student must briefly describe the parliamentary-model proposal (including its source) and assess whether it succeeds in avoiding the problem in (b).

  Student's answer:
  - Description: MacAskill's parliamentary model treats each theory as a delegate with votes proportional to credence. Delegates bargain and vote, spending more voting weight on choices their theory regards as important and conceding on minor ones.
  - They note that this only requires each delegate to rank options and weigh importance within its own theory, avoiding cardinal comparisons across theories.
  - They claim it avoids the problem in (b) entirely and allows a low-credence theory with extreme stakes to exert influence without needing to convert values to a common scale.

  Evaluation:
  - The description of the parliamentary model (attributed to MacAskill) is accurate and includes the key features: proportional votes, bargaining, and within-theory ranking and weighing.
  - The assessment is that it avoids the problem by not requiring cardinal intertheoretic comparisons.
  - However, the student claims it "avoids the problem entirely". This is a bit strong because the parliamentary model itself faces challenges. For instance, the bargaining process may still require some form of comparison (even if not cardinal) and the model might not be fully specified. There is ongoing debate about whether it truly avoids the problem. The student does not acknowledge any limitations.

  Grading:
  - The description is good and the source (MacAskill) is correctly identified.
  - The assessment is positive and notes the avoidance of cardinal comparisons, which is the main point.
  - However, the answer lacks a critical assessment. The question asks to "assess whether it actually succeeds", and a top answer would at least note that there are criticisms or that it may not fully solve the problem. But the student's answer is one-sided.

  Considering the requirement is to "briefly describe" and "assess", and the student does describe well and gives a clear (if overly optimistic) assessment, we can deduct a point for the lack of nuance in the assessment.

  Thus, we assign 2 out of 3 for part (c).

  Total: 3 (a) + 4 (b) + 2 (c) = 9/10.

  Summary: "The answer is excellent on parts (a) and (b) but slightly overstates the success of the parliamentary model in part (c)."

  Now, we format as a JSON object.
