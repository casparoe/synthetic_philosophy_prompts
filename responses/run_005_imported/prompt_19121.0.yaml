answer: |-
  Your friend makes an insightful point about the *practical* equivalence of epistemicism and supervaluationism regarding borderline cases: both ultimately advise "we can't say whether he's tall." However, claiming this reduces the entire debate to mere vocabulary choice significantly underestimates the **substantive logical, semantic, and metaphysical differences** at stake. Here's why the distinction matters:

  1.  **The Nature of Truth & Falsity:**
      *   **Epistemicism:** Preserves **classical bivalence**. Every declarative sentence using "tall" (including about borderline cases) is *objectively, mind-independently* either true or false *right now*. Our ignorance is purely *epistemic* (about knowledge).
      *   **Supervaluationism:** **Rejects bivalence** for borderline cases. The sentence "He is tall" is *genuinely neither true nor false* (it's indeterminate). Its truth status isn't hidden; it's *semantically undefined* due to incomplete meaning.

  2.  **The Logic of Vagueness:**
      *   **Epistemicism:** **Upholds classical logic entirely.** The Law of Excluded Middle (LEM - "Either he is tall or he is not tall") is *always true*, even for borderline cases. One disjunct *is* true, we just don't know which. Modus Ponens, Contraposition, etc., hold without exception.
      *   **Supervaluationism:** **Modifies classical logic.**
          *   LEM can *fail* for borderline cases. "Either tall or not tall" may be *super-true* (true on all precisifications), but neither disjunct is true *simpliciter*. This challenges a fundamental classical principle.
          *   Truth is defined as **super-truth**: true on *all* admissible precisifications. Falsity is **super-falsity**: false on all. This leads to different validities.
          *   While it preserves many classical tautologies (like LEM) as *super-true*, it allows for sentences that are neither true nor false. This necessitates a non-classical semantics.

  3.  **The Source of Vagueness & Metaphysical Commitments:**
      *   **Epistemicism:** Places the burden on **our knowledge**. The world (or language's relation to it) is sharp; *we* are ignorant of the exact boundaries fixed by our own linguistic practices. This implies **sharp cutoffs exist** in reality (e.g., there *is* a precise nanometer difference making one person tall and the next not), even if unknowable. This is a significant metaphysical claim.
      *   **Supervaluationism:** Places the burden on **meaning**. Vagueness arises because language itself is *incomplete* or *indeterminate*. There is **no single sharp cutoff** in reality fixed by "tall"; instead, there are many equally good ways to precisify it. The world/language connection is inherently fuzzy at the boundaries. This avoids committing to unknowable sharp boundaries.

  4.  **Higher-Order Vagueness (The Vagueness of 'Borderline'):**
      *   **Epistemicism:** Faces a **major challenge**. If there's a sharp cutoff between tall and not-tall, there must *also* be sharp cutoffs between clear cases and borderline cases, and between borderline cases and clear non-cases. This seems deeply counterintuitive – how could *those* boundaries be knowable or even exist?
      *   **Supervaluationism:** **Handles it more naturally (though not perfectly).** The "admissible precisifications" themselves can have fuzzy boundaries. What counts as an admissible way of drawing the line can be vague, leading to higher-order indeterminacy without requiring sharp meta-boundaries. The indeterminacy is "built-in" at all levels.

  5.  **The Role of Precisification:**
      *   **Epistemicism:** Precisification (e.g., defining "tall for basketball" as >6'8") reveals a *preexisting, sharp* boundary we were ignorant of. It doesn't *create* the boundary; it *discovers* it (or a contextually relevant part of it).
      *   **Supervaluationism:** Precisification *creates* a sharp boundary where none semantically existed before. It resolves the inherent indeterminacy of the meaning.

  **Why Philosophers Argue: The Substance Beyond "Can't Say"**

  While both theories explain our *inability to assert* a truth value for borderline cases, they offer **radically different explanations** with **profoundly different consequences** for:

  *   **The nature of truth and logic:** Is classical logic sacrosanct, or must it be modified for vague language?
  *   **The metaphysics of language and reality:** Does vague language track (or create) vague features, or are the features sharp and our language/knowledge deficient?
  *   **The semantics of vague terms:** Is the meaning of "tall" incomplete (supervaluationism) or complete but unknowably precise (epistemicism)?
  *   **The possibility of higher-order vagueness:** Can the theory explain the apparent lack of sharp boundaries *anywhere* in the vague spectrum?

  **Conclusion:**

  Your friend is right that the *surface-level output* for borderline cases ("we can't say true or false") is the same. However, the disagreement is far from merely terminological. It's a **substantive clash** about:

  1.  **The fundamental logic** governing vague language (classical vs. non-classical).
  2.  **The nature of truth** for vague statements (bivalent and hidden vs. potentially gappy and super-defined).
  3.  **The metaphysical reality** underlying vagueness (unknowable sharp boundaries vs. genuine semantic indecision).
  4.  **The best explanation** for higher-order vagueness.

  Philosophers argue vigorously because choosing between epistemicism and supervaluationism involves choosing between fundamentally different pictures of how language, truth, logic, and reality interact in the face of vagueness. The practical uncertainty may be the same, but the underlying theoretical machinery and its implications are profoundly distinct. The debate is about *why* we can't say, and what that "can't" reveals about language and the world.
