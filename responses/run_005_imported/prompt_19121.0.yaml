  Also, the user's deeper need might be understanding whether philosophical debates in general have substance beyond semantics. By showing how each theory leads to different logical outcomes and conceptual frameworks, I can illustrate that the disagreement is substantive. The user might also want reassurance that their initial skepticism (after being convinced by their friend) is valid but that the philosophical efforts aren't in vain.

