    - Overstates CEV’s fidelity to Brandt/Railton: Brandt focuses on *cognitive psychotherapy* (eliminating irrational desires via empirical knowledge), while CEV includes non-epistemic elements like "growing up farther" (moral/developmental shifts), creating a subtle but important divergence.  

