  ## Memorandum: To the Advisory Board of the Society for the Philosophy of Language  
  **Subject:** Recommendation Regarding the Frege Early-Career Prize  
  **Date:** October 26, 2023  
  **From:** [Your Name], Advisory Board Member  

  ### I. Introduction
  This memo addresses the serious concerns raised regarding the naming of our Early-Career Prize after Gottlob Frege, following the circulation of his 1924 political diary. The board is rightly divided between those who see the diary’s explicit antisemitism and anti-democratic views as incompatible with the honor of a namesake prize, and those who argue that Frege’s foundational *formal* contributions to logic and philosophy of language exist independently of his reprehensible personal views. Both positions are philosophically coherent and ethically motivated. After careful consideration, I recommend a third path: **retaining the Frege name but pairing it with a permanent, contextualizing statement** acknowledging the tension in his legacy. This honors the complexity of the situation while upholding our commitment to intellectual integrity and historical awareness.  

  ### II. Engaging with the Core Arguments  

  *   **The Case for Renaming (Acknowledged Fully):**  
      Proponents of renaming rightly argue that an award is not merely a citation—it is an act of *honor*. To name a prize after someone is to hold them up as an exemplar, implicitly celebrating the *person* alongside their work. Frege’s diary reveals beliefs (antisemitism, contempt for democracy) fundamentally at odds with the values of inclusivity and critical discourse our society should champion. As Michael Dummett’s struggle illustrates, this is not incidental biographical noise; it forces a reckoning with the man behind the logic. Furthermore, the argument that his *anti-psychologism*—insisting on absolute, impersonal truth—resonates uncomfortably with his political absolutism deserves serious consideration. It highlights how philosophical commitments, however abstract, exist within a human context we cannot wholly ignore. We cannot claim a principle of separating work and person while simultaneously bestowing an honor inherently tied to the person.

  *   **The Case for Keeping the Name (Acknowledged Fully):**  
      Proponents of retaining the name compellingly argue that Frege’s contributions are uniquely formal and separable. The validity of the *Begriffsschrift*, the insights in "Über Sinn und Bedeutung," function like mathematical truths. Their cogency is entirely independent of Frege’s character or politics, unlike the work of a political philosopher whose theories might be intrinsically linked to their ideology, or a novelist whose worldview permeates their text. Frege provided the *scaffolding* for modern logic and philosophy of language; rejecting this foundational work because of his personal failings risks severing our field from its indispensable intellectual roots. Renaming the prize might be seen as performative, doing little to address historical complexity while potentially obscuring the origins of the very concepts we study.

  ### III. Recommendation: Contextualized Retention with a Permanent Statement
  Retaining the name without comment ignores the profound ethical discomfort and historical reality. Renaming risks simplifying history and potentially diminishing the foundational nature of Frege's work. Therefore, I propose a middle path:

  1.  **Retain the Name:** The prize remains formally titled "The Frege Early-Career Prize in Logic and Philosophy of Language." This acknowledges the unparalleled historical significance and formal nature of his contributions to our field.
  2.  **Institute a Permanent, Mandatory Contextual Statement:** A concise, formally approved statement must be permanently displayed wherever the prize name appears (website, call for nominations, award certificate, ceremony announcements). This statement must:
      *   Explicitly acknowledge Frege's documented antisemitism and anti-democratic views as revealed in his diary.
      *   State clearly that these views are antithetical to the values of the Society.
      *   Explain the rationale for retaining the name: the unique, foundational, and formal nature of his contributions to logic and philosophy of language, upon which the field demonstrably rests.
      *   Frame this as an active engagement with the complexity of intellectual history, not an endorsement of the man's character.

      **Example Draft Statement:**  
      > "The Frege Early-Career Prize recognizes outstanding contributions to logic and the philosophy of language. Gottlob Frege's formal work in these areas remains foundational. The Society explicitly acknowledges, however, that Frege held antisemitic and anti-democratic views, as documented in his personal writings. These views are reprehensible and fundamentally conflict with the Society's commitment to inclusivity and reasoned discourse. Retaining Frege's name reflects the specific, enduring significance of his *formal* contributions to our discipline, while this statement serves as a permanent recognition of the complex and sometimes troubling nature of intellectual legacies."

  3.  **Timeline for Implementation:**
      *   **By Next Month's Vote (November 2023):** The Board votes to adopt the principle of "Contextualized Retention" as outlined above.
      *   **Within 1 Month of Vote (December 2023):** A small, diverse subcommittee (including historians of philosophy, working logicians, and ethicists) is formed to draft the precise wording of the mandatory contextual statement, drawing on historical scholarship and ethical deliberation.
      *   **By February 1, 2024:** The draft statement is circulated to the full Advisory Board for feedback.
      *   **By March 1, 2024:** The Advisory Board formally approves the final wording of the contextual statement via vote.
      *   **By April 15, 2024:** The statement is implemented across all Society platforms and materials pertaining to the prize. The statement is read aloud at the next prize award ceremony.

  ### IV. A General Principle for Future Cases
  This situation will not be unique. To navigate future controversies concerning awards named after figures with problematic aspects in their personal archives or histories, the Society should adopt this guiding principle:

  > **The "Acknowledged Legacy" Principle:** When considering an award named after a historical figure, the Society will weigh the *nature* and *indispensability* of the honoree's contribution to the specific field of the award against the severity and relevance of their documented problematic beliefs or actions. **No name is retained without explicit, permanent contextualization if significant ethical transgressions are confirmed.** The burden of justification rests on demonstrating the unique and foundational nature of the contribution relative to the field. Contextualization must be meaningful, visible, and explicitly reject the offensive aspects of the legacy. This process requires periodic review as historical scholarship evolves.

  This principle emphasizes active engagement with history, rejects simplistic erasure or uncritical celebration, demands justification for retaining problematic namesakes, and mandates transparency. It focuses on the *specific* field of the award and the *specific* nature of the contribution, recognizing that separability is more plausible in formal/logical domains than in political or social theory, but never automatic.

  ### V. Conclusion
  Frege presents a profound challenge. His work is the bedrock of our discipline; his personal views are abhorrent. Renaming feels like a necessary moral statement but risks losing historical connection to indispensable ideas. Simple retention feels like tacit complicity. Contextualized retention—keeping the name while permanently and explicitly acknowledging the dissonance—offers a path that respects both the gravity of Frege's failings and the unique, formal nature of his intellectual achievement. It allows us to honor the work without honoring the man, while forcing us and future generations to confront the uncomfortable realities of intellectual history. This approach, guided by the "Acknowledged Legacy" principle, provides a sustainable and ethically responsible framework for the Society moving forward.

  I urge the Board to adopt the recommendation of Contextualized Retention with a Permanent Statement and the accompanying implementation timeline.
