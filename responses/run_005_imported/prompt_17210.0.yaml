answer: |-
  Your grasp of the tension in *On Certainty* is impressive, especially for a self-guided reader. You've pinpointed a genuine and profound interpretive challenge: how to reconcile the **immovable hinge** metaphor (341-343) with the **shifting riverbed** metaphor (96-99). This isn't just an academic quibble; it cuts to the heart of how we understand the foundations of knowledge, disagreement, and change. Let's break down the compatibility of these images and how the two main camps (Wright vs. Pritchard) handle the riverbed's dynamism:

  **1. The Core Tension: Hinges vs. Riverbeds**
      *   **Hinges (Fixed & Enabling):** These propositions (e.g., "The Earth exists," "I have hands," "The world didn't pop into existence 5 minutes ago") are presented as *logically necessary* for the "game" of doubting and justifying to even begin. Doubting *everything* simultaneously isn't doubt; it's paralysis or nonsense. Hinges are the *framework* within which doubt operates. They are treated as *immune* to doubt *in practice* for a system of thought to function. They sound transcendental or structural.
      *   **Riverbed (Dynamic & Historical):** Here, the "hardened" propositions (which include hinge-like propositions) are described as sedimented over time. Crucially, Wittgenstein states: "*The river-bed of thoughts may shift*" (OC 97), and "*...the same proposition may get treated at one time as something to test by experience, at another as a rule of testing*" (OC 98). This emphasizes their *contingency* and *historical mutability*. What is bedrock today might be questioned tomorrow, and vice-versa. This sounds sociological and evolutionary, not logically fixed.

  **2. Are the Images Compatible?**
      *   **Yes, but contextually and temporally.** Wittgenstein isn't offering a single, monolithic theory. He's exploring. The key is to see the *scale* and *context* of each metaphor:
          *   **Hinges are contextually fixed:** *Within a specific language-game or form of life, at a specific time*, certain propositions *must* function as hinges for inquiry and doubt to be possible *in that context*. They are the necessary scaffolding *for that practice*.
          *   **Riverbeds are historically fluid:** *Over long stretches of time, across different forms of life or within the evolution of one*, what functions as a hinge *can change*. The *content* of what is held fast is not eternally fixed. The *structure* (that *something* must be held fast) is necessary, but the *particulars* occupying that structural role are contingent and subject to historical drift.
      *   **Think of it like this:** The *hinge-function* (the need for something to be exempt from doubt for inquiry to proceed) is a permanent structural feature of rational activity. But the *specific propositions* that *serve* that hinge-function at any given moment for a community are like the riverbed – hardened by use and consensus, but potentially subject to erosion and reshaping over geological (historical/cultural) time. A hinge proposition *for us now* might have been a fluid empirical claim in the past, or might become one again in the future (e.g., geocentrism was once a hinge; it eroded).

  **3. Making Sense of the Riverbed: Wright vs. Pritchard**
      *   **Crispin Wright's Entitlement:** This approach *can* readily accommodate the riverbed.
          *   **How:** Entitlement is a *rational permission* to accept certain propositions (hinges) without evidence *because* they are necessary prerequisites for any evidence-based inquiry to get off the ground. Crucially, this entitlement is *contextual* and *defeasible*.
          *   **Explaining the Riverbed Shift:** A proposition loses its hinge status (its entitlement) *when it no longer successfully enables the relevant inquiry* for the community. If accepting "P" as a hinge leads to persistent, unresolvable contradictions within the evolving web of beliefs and practices, or if radically new experiences make doubting "P" *productive* for inquiry rather than paralyzing, then "P" can lose its entitlement. Its epistemic status changes – it becomes fluid, open to empirical test or justification. Conversely, a fluid proposition that becomes so central and indispensable to a stable practice might "harden" and gain entitlement. Wright's view treats hinges as a special *kind of rational commitment* (a belief with a unique warrant), and rational commitments *can* change when their enabling function fails or becomes obsolete.
          *   **Strengths wrt Riverbed:** Directly explains hardening/softening as a change in *epistemic status* (entitlement gained/lost) based on functional role within the system of inquiry.
      *   **Duncan Pritchard's Non-Belief (Arational Commitment):** This approach finds the riverbed *more challenging* but offers a distinct interpretation.
          *   **How:** Pritchard argues hinges aren't *beliefs* at all (beliefs are truth-apt, potentially evidence-responsive cognitive states). Instead, they are *fundamental certainties* manifested in our *actions* and ways of life. They are "animal" or "hinge commitments" – the ungrounded, non-reflective confidence that allows us to act and inquire. Epistemic evaluation (justified/unjustified) simply doesn't apply.
          *   **Explaining the Riverbed Shift (The Challenge & Response):**
              *   **Challenge:** If hinges aren't beliefs or propositional attitudes subject to rational evaluation, how do they "harden" or "soften"? What changes?
              *   **Response:** Pritchard (and others in this camp) emphasize that the *manifestation* of these certainties – the *practices and actions* that constitute our form of life – evolves historically and culturally. What *counts* as a hinge certainty is determined by what underlies *successful action and shared practice* within a community. A "hardened" riverbed proposition reflects a certainty so deeply embedded in action that questioning it is practically inconceivable *within that form of life*. "Softening" occurs when social, technological, or experiential changes make acting *as if* that certainty holds *less stable* or *less necessary* for successful practice. The certainty itself isn't *rationally abandoned*; the *form of life* changes, and different certainties become manifest in the *new* practices. The shift isn't primarily epistemic; it's pragmatic and existential. The "bed" shifts when the *river* (the totality of practices) changes its course, requiring different underlying certainties to support *it*.
          *   **Strengths wrt Riverbed:** Emphasizes the *practical, enacted* nature of certainty. The shift is seen as a change in *what our collective actions non-reflectively take for granted*, driven by the evolution of the actions themselves, not by evidential assessment. It avoids treating hinges as propositions we "hold" like beliefs.

  **4. Which Makes Better Sense of the Riverbed?**
      *   **Wright's Entitlement** provides the *more straightforward and intuitive* explanation for the *epistemic aspect* of the shift: propositions gain or lose a specific kind of rational warrant (entitlement) based on their functional role. It directly maps "hardening" to gaining entitlement and "softening" to losing it.
      *   **Pritchard's Non-Belief** provides a *more radical and practice-oriented* explanation that avoids treating hinges as truth-apt cognitive states. It explains the shift as a change in the *background conditions for action* manifested in evolving practices. It takes Wittgenstein's anti-theoretical, action-focused stance more literally.

  **5. Is it an Unresolved Seam?**
      *   **Yes, to a significant degree.** *On Certainty* consists of notes written near the end of Wittgenstein's life, reacting to G.E. Moore. It's exploratory, not a finalized treatise. The tension reflects Wittgenstein grappling with two crucial insights:
          1.  The *structural necessity* of ungrounded certainty for rational activity (hinge).
          2.  The *historical contingency and mutability* of the specific content of that certainty (riverbed).
      *   **Neither reading fully "closes" the seam:** Wright risks making hinges *too much* like ordinary (though specially warranted) beliefs, potentially underestimating Wittgenstein's desire to put them *outside* the justification game. Pritchard risks making the shift *too arational* and practice-driven, potentially downplaying the way shifts *can* involve elements of rational crisis or reflection (even if not purely evidential). Both camps are trying to systematize insights Wittgenstein left in productive tension.

  **Conclusion & Recommendation:**

  Your intuition is correct: the riverbed metaphor strongly suggests **Wright's entitlement approach handles the *dynamics* of hinge change more directly**, as it allows for a change in the *epistemic status* of the proposition itself. However, **Pritchard's non-belief approach offers a deeper challenge to the very idea of treating hinges as propositional attitudes subject to epistemic evaluation**, aligning with Wittgenstein's focus on action and practice.

  **For your understanding:** Don't feel you *must* choose one camp definitively. The value lies in seeing how each illuminates different facets of Wittgenstein's complex exploration. The tension you identified is real and philosophically fertile. It highlights that while our frameworks of certainty *feel* absolute and immovable *from within* (hinges), they are, in the grand sweep of human history and diverse cultures, remarkably fluid and contingent (riverbed). This profound insight helps explain the frustrating standoff with your family member: you were likely operating with different, deeply embedded hinge commitments, making evidence presented *within* one framework ineffective against the other.

  To delve deeper:
  *   **For Wright:** Read his paper "Warrant for Nothing (And Foundations for Free)?".
  *   **For Pritchard:** Read his book "Epistemic Angst: Radical Skepticism and the Groundlessness of Our Believing".
  *   **For the tension itself:** Look at papers discussing the "framework" vs. "animal" readings of hinges, or the debate between "propositional" and "non-propositional" interpretations. Daniele Moyal-Sharrock's work (e.g., *Understanding Wittgenstein's On Certainty*) offers a strong non-belief view grappling with change, while Annalisa Coliva (e.g., *Moore and Wittgenstein: Scepticism, Certainty and Common Sense*) offers a nuanced perspective incorporating elements of entitlement and the historical dimension.

  Your journey into *On Certainty* started with a very real human problem of disagreement. You've now grasped one of the deepest philosophical explanations for why such standoffs occur: we argue *on* the riverbed, but sometimes, the beds themselves are different, and shifting them takes more than evidence – it takes time, changing practices, and sometimes, a change in the river's course altogether.
