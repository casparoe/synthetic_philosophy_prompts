prompt: |-
  So I'm writing a novel where my main character, who's bipolar, signs one of those psychiatric advance directives before things get bad -- basically pre-authorizing her doctors to hospitalize her even if she's begging them not to once she's manic. I guess these are sometimes called Ulysses contracts, after Ulysses having his men tie him to the mast so he couldnt give in to the sirens later. What I actually want to understand for the book, not just the dictionary version, is the philosophical crux of it: whose autonomy is even being honored when an earlier self gets to override a later self thats objecting in real time? Is there a principled reason to trust the calmer self over the manic one, or does the whole setup just quietly assume that answer instead of arguing for it? Don't dumb it down, I can handle the weeds on this one.
