prompt: |-
  I'm on the steering committee for an open-source project I helped start (~40k GitHub stars, running in prod at a bunch of companies). We're writing a governance charter and it's stuck on one question: who counts as a 'member' with voting rights on RFCs and maintainer elections? One camp wants voting limited to people who've merged commits in the past year -- they're the ones who understand the tradeoffs. The other camp points to what just happened: two maintainers deprecated a widely-used API with no warning, breaking prod for companies that depend on us but have never sent a PR, and now those companies want a real vote since they eat the consequences. Once you start giving a vote to 'anyone affected' though, it's not clear where that stops, and half the committee doesn't even agree on who gets to vote on the charter that decides all this. Can you draft the memo I'll send before we vote next friday -- a real recommendation on eligibility, not a list of tradeoffs, that takes the contributors-only side seriously instead of just siding with the sympathetic underdog companies.
reasoning: |-
  Okay, the user is part of the steering committee for a significant open-source project with 40k GitHub stars and real production usage. They're stuck on defining "member" for voting rights in their governance charter. There are two main camps: one wants voting limited to active contributors (those who've merged commits in the past year), while the other wants to include users affected by decisions, especially after a recent incident where an API change broke production for companies. 

  Hmm, the user specifically asks for a firm recommendation siding with contributors, not just listing tradeoffs. They want to take the contributors-only position seriously while acknowledging the companies' concerns. The memo needs to resolve the immediate deadlock but also preempt future issues like scope creep in voting eligibility.

  First, I should recognize why the contributors-only argument holds weight. Active contributors have deep technical context, skin in the game through maintenance work, and their involvement is measurable. The "affected users" camp has valid pain points, but expanding voting rights to them risks dilution of responsibility, subjectivity in defining "affected," and potential capture by corporate interests. 

  The tricky part is balancing principle with pragmatism. The user needs a solution that respects contributors' expertise but also addresses the companies' frustration. Maybe the answer is a hybrid approach: keep voting rights contributor-only but create formal feedback channels for users. The memo should emphasize that governance isn't just about voting—it's about designing processes that force maintainers to consult users *before* decisions are made. 

  Ah, and the charter vote itself! That's a meta-problem. The committee can't agree on who votes for the charter. The only fair starting point is to let current steering committee members vote, since they're the ones doing the work now. Later, the ratified charter can define future voter eligibility. 

  For the memo structure: start by validating both concerns, then pivot to why contributor-only voting is necessary for effective governance. Acknowledge the API incident as a process failure, not a voter eligibility failure. Propose concrete alternatives for user input (RFC feedback, advisory board). End with clear voting instructions for the charter itself. 

  ...Wait, should I address the "sympathetic underdog companies" angle more explicitly? The user wants to avoid sidelining contributors just because non-contributors have emotional appeal. The memo could note that contributor-only voting *protects* the project from being steered by parties who don't share maintenance burdens. 

  Also, the recommendation needs teeth. Not just "this is better," but "this is how we avoid chaos." Metrics like commit activity are objective; "affected" is nebulous. If you give votes to users today, tomorrow someone will argue that *their* SaaS customers are "affected too." Slippery slope. 

  Finally, the tone: decisive but not dismissive. The contributors' camp needs to feel heard, and the users' camp needs to see their concerns addressed through mechanisms *other* than voting. The memo should position this as strengthening governance, not excluding voices.
answer: |-
  ## Governance Charter Recommendation: Voting Eligibility Memo

  **To:** Steering Committee  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Voting Eligibility for RFCs & Maintainer Elections  

  ### Background & Core Principle
  After extensive debate, I recommend **limiting voting rights to active code contributors** (those with merged commits in the last 12 months). This aligns with a core principle: **those who build and maintain the software must own its technical decisions.** While the concerns of production users are valid and critical, granting them direct voting rights fundamentally undermines sustainable governance and technical integrity.

  ### Why Contributors-Only Voting?
  1. **Technical Accountability:**  
     Voters must understand implementation costs, architectural tradeoffs, and long-term maintenance burdens. Contributors who actively wrestle with the codebase possess this context. Production users, however vital, prioritize business continuity over technical debt—a misalignment of incentives in technical votes.

  2. **Measurable Investment:**  
     Merged commits are objective, fraud-resistant proof of investment. "Affected entities" is inherently subjective and unverifiable. Where do we draw the line? (Companies only? Individual users? Downstream dependencies?) This invites politicization and scope creep.

  3. **Preventing Governance Capture:**  
     Corporations with large deployments but zero contributions could outvote maintainers on technical decisions, prioritizing their short-term needs over the project’s health. This risks turning the project into a free R&D lab with no path to sustainability.

  4. **The API Incident Was a *Process* Failure, Not a *Voting* Failure:**  
     Deprecating a critical API without warning reflects a breakdown in *communication and feedback loops*, not flawed voter eligibility. The solution is better processes (e.g., mandatory RFC comment periods, extended deprecation timelines), not diluting technical governance.

  ### Addressing Production User Concerns
  Voting rights ≠ influence. We *must* formalize user engagement *without* granting votes:
  - **Mandatory RFC Feedback Loops:** Require RFCs impacting public APIs/behavior to be announced to a registered "Production Users" mailing list with a 30-day comment period. Maintainers must respond to material concerns.
  - **User Advisory Board:** Establish a rotating board of major production users (e.g., 5 seats, 6-month terms). They get early visibility into roadmap items, deprecations, and *non-binding* advisory votes on high-impact RFCs.
  - **Extended Deprecation Policy:** Enforce minimum 12-month deprecation timelines for major APIs with clear migration guides. Trigger automatic Steering Committee review if major user impact is anticipated.

  ### Recommendation Summary
  | **Role**               | **Voting Rights** | **Influence Mechanism**               |
  |------------------------|-------------------|---------------------------------------|
  | **Active Contributors** | YES (RFCs, Elections) | Direct technical governance           |
  | **Production Users**   | NO                | Advisory Board, RFC Feedback, Deprecation Policy Oversight |
  | **Maintainers**        | YES               | Direct technical governance           |

  ### Charter Vote Process Itself
  For *this* charter ratification vote: **Only current Steering Committee members may vote.** We cannot define a voter pool retroactively. Once ratified, future amendments follow the new charter’s rules.

  ### Path Forward
  I propose we vote on the following eligibility clause:  
  > **"Voting Members** are individuals with at least one merged commit to any project repository within the preceding 12 calendar months."

  **Next Steps:**  
  1. Vote on voter eligibility per the above language at Friday’s meeting.  
  2. Immediately draft supporting policies:  
     - RFC Process (mandating user feedback periods)  
     - Production User Advisory Board Charter  
     - Deprecation & Breaking Change Policy  

  This approach respects the expertise of those who build the project while creating structured accountability to those who rely on it. It ensures technical decisions remain rooted in maintainability, not political influence.

  [Your Name]  
  Steering Committee Member
