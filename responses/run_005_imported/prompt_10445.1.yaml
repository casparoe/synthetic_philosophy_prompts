  I should address the philosophical tension between determinism and moral responsibility. Explain that blame serves purposes—validating victimhood, enforcing boundaries. But understanding the causes shifts perspective; it's not that blame was wrong, but context changes its relevance. Emphasize that their pain is still valid, regardless of the father's backstory. 

