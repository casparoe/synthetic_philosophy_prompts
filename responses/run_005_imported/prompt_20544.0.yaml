  So in my philosophy of mind seminar we just spent a whole class on Descartes' argument for why the pineal gland is the seat of the soul — his key move is that it's literally the only structure in the brain that isn't paired, so since the soul is one indivisible thing, it has to be joined to a body part that's equally single (also supposedly why it unifies input from our two eyes and two ears into one impression). Next week we start the unit on split-brain/commissurotomy patients, and I can't stop thinking about how these two things collide: severing the corpus callosum produces real behavioral evidence of something like two independent streams of processing in one skull, but the pineal gland itself is never touched by that surgery — its just sitting there in the midline, as singular and undivided as ever. So what would Descartes actually say if confronted with this data? Does his own logic force him to admit there are now two souls sharing one gland, or is there some way for him to wiggle out of it given how he set the argument up originally? Bonus if you can factor in whether the newer research (I think from around 2017) showing split-brain patients have divided perception but apparently still unified agency makes things better or worse for him — please don't just give me the generic 'split brain challenges the unity of consciousness' essay, I want it argued specifically through Descartes' own reasoning.
