prompt: |-
  Bertrand Russell's 1905 paper "On Denoting" — the founding document of his theory of descriptions — contains a notoriously obscure stretch of argument, often called the "Gray's Elegy" argument, in which he tries to show that a Fregean distinction between the "meaning" and "denotation" of a phrase collapses into incoherence. Scholars still disagree about how exactly to reconstruct the reasoning. Here is the core of it:

  "The relation of the meaning to the denotation involves certain rather curious difficulties, which seem in themselves sufficient to prove that the theory which leads to such difficulties must be wrong.

  When we wish to speak about the *meaning* of a denoting phrase, as opposed to its denotation, the natural mode of doing so is by inverted commas. Thus we say: The center of mass of the solar system is a point, not a denoting complex; "the center of mass of the solar system" is a denoting complex, not a point. Or again: the first line of Gray's Elegy states a proposition; "the first line of Gray's Elegy" does not state a proposition. Thus taking any denoting phrase, say C, we wish to consider the relation between C and "C", where the difference of the two is of the kind exemplified in the above two instances.

  We say, to begin with, that when C occurs it is the *denotation* that we are speaking about; but when "C" occurs, it is the *meaning*. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows.

  The one phrase C was to have both meaning and denotation. But if we speak of "the meaning of C", that gives us the meaning (if any) of the denotation. "The meaning of the first line of Gray's Elegy" is the same as "The meaning of 'The curfew tolls the knell of parting day,'" and is not the same as "The meaning of 'the first line of Gray's Elegy.'" Thus in order to get the meaning we want, we must speak not of "the meaning of C", but "the meaning of 'C,'" which is the same as "C" by itself. Similarly "the denotation of C" does not mean the denotation we want, but means something which, if it denotes at all, denotes what is denoted by the denotation we want. For example, let "C" be "the denoting complex occurring in the second of the above instances." Then C = "the first line of Gray's Elegy," and the denotation of C = The curfew tolls the knell of parting day. But what we meant to have as the denotation was "the first line of Gray's Elegy." Thus we have failed to get what we wanted."

  Reconstruct, as literally as possible, the chain of substitutions in that final paragraph: what does Russell set "C" equal to, what does he then compute "the denotation of C" to be, and why does this fail to match what "we meant to have as the denotation"? Say in your own words what result he was trying to obtain, and identify the exact step at which the derivation departs from it. Then say whether the trouble you've located amounts to a genuine proof that meaning and denotation cannot coherently be distinguished at all, or whether it is instead an artifact of some slide between using a phrase and mentioning it — and defend your answer by pointing to specific wording above.
