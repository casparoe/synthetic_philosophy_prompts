      "permanently emigrating to a country with a very different language and culture": {"epistemic": 7, "personal": 9},
      "moving from an individual-contributor engineering role into full-time people management": {"epistemic": 6, "personal": 7},
      "losing a limb in an accident": {"epistemic": 10, "personal": 9},
      "retiring after a long career": {"epistemic": 5, "personal": 8},
      "serving as a combat soldier": {"epistemic": 9, "personal": 10}
    }
  }
  ```

  ### Notes on Ambiguities:
  1. **Management Transition**: Personal transformation is highly variable (6-8/10). Some engineers experience identity-level changes (e.g., shifting from technical validation to leadership values), while others retain core preferences. Epistemic transformation is moderate – the emotional weight of people decisions is hard to simulate, but not wholly unknowable.
  2. **Retirement**: Personal impact (identity loss) is often high (7-9/10), but epistemic transformation is lower – financial/social aspects are researchable. Depends heavily on career centrality to self-conception.
  3. **Emigration**: Personal transformation assumes deep cultural immersion. Without it, scores drop significantly (epistemic: 4-5, personal: 6-7).
  4. **Psychedelics**: Personal transformation (8) assumes ego-dissolution doses. Lower doses may score epistemic: 8, personal: 5.

  ### Key Insights:
  - **Highest Dual Transformation**: Religious conversion, childbirth, and combat soldiering score highest because they fundamentally *reconfigure both knowledge-access and identity* in ways impossible to simulate (e.g., you can't "test-drive" a new metaphysical reality or parental love).
  - **Epistemic Gaps ≠ Prediction Difficulty**: Emigration (epistemic: 7) is *predictably challenging* but lacks the qualitative unknowability of psychedelics (epistemic: 10) – you might anticipate culture shock, but not how LSD alters perception of time.
  - **Your Career Decision**: Founding a startup likely scores epistemic: 8-9 (chaotic uncertainty/responsibility) and personal: 7-9 (reshaping risk tolerance, professional identity). Unlike management transitions, founding roles carry existential stakes that force value reevaluation – aligning with Paul's breakdown of rational choice models.
