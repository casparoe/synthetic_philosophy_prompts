  Looking at the tetralemma structure, Nāgārjuna negates existence, non-existence, both, and neither regarding the Tathāgata after death. Contextualists might say each negation targets a different aspect, but the dialetheist would counter that the negations are comprehensive. For example, when Nāgārjuna negates "neither," it challenges the very framework of predication, which can't be resolved by negation types alone.

