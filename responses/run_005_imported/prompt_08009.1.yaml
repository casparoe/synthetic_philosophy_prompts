answer: |-
  Here is the strongest possible brief for the dialetheist reading, engaging the core objections:

  **The Case for Dialetheism: Why Contextualism Fails and Contradiction Stands**

  1.  **The Exhaustive Scope of the Tetralmema & Prasajya's Limits:** Contextualists argue that prasajya negation (pure rejection without implying an alternative) applied differently across the koṭis dissolves contradiction. However, this fails on two counts:
      *   **Exhaustive Denial:** Nāgārjuna negates *all conceivable positions* regarding the Tathāgata's post-mortem status: existence (A), non-existence (¬A), both (A ∧ ¬A), and neither (¬A ∧ ¬¬A). Prasajya negation *denotes* each position as untenable. Crucially, the fourth koṭi (¬A ∧ ¬¬A) *is* the classical formalization of "neither exists nor does not exist." Denying *this* koṭi via prasajya means rejecting *the very possibility of formulating a coherent position outside A and ¬A within conventional logic*. This isn't denying a different *sense*; it's denying the *exhaustiveness* of the logical framework itself applied to ultimate reality.
      *   **Negating the Logical Space:** When Nāgārjuna denies the fourth koṭi ("naivobhayaṃ"), he isn't merely denying a specific proposition `P` with prasajya. He is denying *the logical possibility* that the proposition `"The Tathāgata exists after death"` (or its core subject-predicate structure) has *no truth-value at all* or resides in some neutral third space *within the conventional framework he is critiquing*. This denial targets the *viability of the logical apparatus* applied to the ultimate. Prasajya negation here doesn't avoid contradiction; it *enacts* the contradiction by showing the framework's breakdown. The negation of "neither" implies that *some* truth-value *must* apply, yet the negations of "exists," "does not exist," and "both" have already shown that *no* truth-value applies coherently. This is the dialetheist core: the framework demands an answer (hence negating "neither"), but provides no consistent answer (negating A, ¬A, and A∧¬A).

  2.  **The Charge of Equivocation (Robinson) and Dialetheism's Response:** Robinson argued that resolving the koṭi via semantic shifts amounts to equivocation, convicting Nāgārjuna of fallacious reasoning. The dialetheist reading *embraces* this charge as revealing the inadequacy of classical logic, not Nāgārjuna's confusion:
      *   **Preserving Semantic Uniformity:** The dialetheist insists that the key terms (e.g., "Tathāgata," "exists," "nirvāṇa") retain their core semantic content *across all four negations*. Nāgārjuna isn't subtly redefining "exists" in each koṭi; he is relentlessly applying the *same conventional concept* to the ultimate and demonstrating its inevitable failure. The contradiction arises precisely *because* the same concept is applied uniformly and yields inconsistent results. Contextualist "resolution" often relies on *implicitly* shifting the semantic ground (e.g., "exists" means something subtly different in koṭi 1 vs koṭi 4), which *is* vulnerable to Robinson's charge of equivocation. Dialetheism avoids this by taking the terms at face value and accepting the resulting inconsistency as real.
      *   **Equivocation as a Symptom, Contradiction as the Diagnosis:** Robinson is right that semantic shifts *would* be equivocation. The dialetheist argues that *avoiding* contradiction *requires* such shifts, thereby *confirming* that the contradiction is genuine within a univocal reading. If contextualism needs to postulate subtle meaning changes to avoid formal contradiction, it demonstrates that a straightforward reading *does* yield contradiction. Dialetheism takes the straightforward reading seriously and argues that the contradiction is not a fallacy but an insight into reality's structure (śūnyatā).

  3.  **The Soteriological Force Demands Dialetheism:** Nāgārjuna's aim is not just logical analysis but *liberation* from conceptual proliferation (prapañca). The tetralemma is a tool to collapse clinging to *any* reified view.
      *   **Draining the Force:** Contextualist resolutions often tame the tetralemma into a sophisticated but ultimately consistent logical maneuver. This risks draining it of its transformative, world-upsetting power. If, after careful parsing, the contradictions disappear and conventional logic reigns supreme, the radical challenge to conceptualization is muted. The dialetheist reading preserves the shocking, apophatic force: *all positions, including the logical framework itself, are fundamentally untenable when applied to the ultimate.* The realization isn't that we picked the wrong logical operator (prasajya vs paryudāsa), but that *logic itself, as conventionally understood, fractures* when pushed to its limits regarding emptiness. This fracture is best modeled as true contradiction.
      *   **Ultimate Truth as Inexpressible *and* Expressed:** MMK 18:8 ("Everything is real, or unreal, or both real and unreal, or neither; this is the Buddha's provisional teaching") directly states the tetralemma applies to *everything*. Contextualists parse this with prasajya, but the dialetheist notes the *persistence* of asserting the koṭis even provisionally. The ultimate truth is inexpressible (MMK 18.9), yet Nāgārjuna spends 27 chapters expressing it via negation. This performative contradiction – using concepts to deconstruct concepts – is inherently dialetheic. It points to truths that are both asserted (to guide) and undermined (to liberate), existing in a paraconsistent state where their conventional assertion co-exists with their ultimate falsity.

  4.  **Paraconsistency as the Faithful Formalization:** The dialetheist doesn't claim Nāgārjuna used modern logic, but that paraconsistent logic provides the *best model* for his arguments' *structure and implications*.
      *   **Non-Explosive Negation:** Prasajya negation is non-implicative; it doesn't *assert* an alternative. Paraconsistent negation is similarly non-explosive; a contradiction (A ∧ ¬A) does not entail *everything* (ex falso quodlibet). This aligns perfectly with Madhyamaka: negating all four koṭis doesn't entail nihilism or eternalism; it leaves the mind in a state of freedom from views (dr̥ṣṭi), not logical chaos. The dialetheist formalization (e.g., using a logic like LP) captures this: the negations stand, the contradictions are localized and contained, and reasoning proceeds without explosion. Contextualist classical recastings often obscure this crucial feature by rendering the negations as merely excluding specific misinterpretations without capturing the *global* negation of the framework.

  **Conclusion:** The dialetheist reading survives the contextualist challenge and Robinson's charge because it takes Nāgārjuna's exhaustive negations at face value, preserving semantic uniformity and the transformative, framework-shattering force of the tetralemma. Prasajya negation, while important, cannot dissolve the contradiction inherent in denying *all possible logical positions* concerning a topic *while implying the topic demands some positionality*. Contextualism dissolves the contradiction only by introducing subtle equivocations or minimizing the scope of the negation, thereby weakening Nāgārjuna's radical critique. Robinson correctly identifies that avoiding contradiction requires semantic shift (equivocation); the dialetheist embraces this by arguing the contradiction is real and reveals the limitations of conventional logic when confronting śūnyatā. Paraconsistent logic provides the most coherent formal model for this non-explosive, contradiction-containing structure, respecting both the letter of the negations and their profound soteriological intent. The dialetheist reading doesn't convict Nāgārjuna of equivocation; it convicts conventional logic of inadequacy.
