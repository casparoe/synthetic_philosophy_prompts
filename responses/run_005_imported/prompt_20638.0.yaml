answer: |-
  You've identified a profound tension in Bentham's framework. Let's construct the strongest possible case that his toleration depends on an *external* restriction on which pains count, rather than flowing inevitably from a pure hedonistic calculus:

  ### The Steelman Argument: Bentham's Dependence on Arbitrary Pain Exclusion

  1.  **The Core Claim of Hedonistic Utilitarianism:** The *only* intrinsic goods are pleasure and the absence of pain. The *only* intrinsic bads are pain and the deprivation of pleasure. The moral rightness of an act is determined solely by its net effect on the sum total of pleasure minus pain across all affected sentient beings. All pleasures and pains count equally in principle, regardless of their source or nature, provided they are experienced.

  2.  **The Reality of Antipathetic Pain:** Disgust, moral outrage, feelings of impurity, fear of societal decay, or simply visceral revulsion felt by members of the public upon learning about or contemplating private consensual "irregular" sexual acts constitute genuine psychological pain. This pain:
      *   Is **intense** for many individuals (especially in Bentham's time, and often still today).
      *   Is **widespread** across a significant portion of the population.
      *   Is **foreseeable** and **directly caused** by the knowledge that such acts occur (even privately).
      *   Can be **durable**, manifesting as persistent anxiety, resentment, or social friction.
      *   **Meets Bentham's own criteria** for pain as an unpleasant sensation or feeling.

  3.  **The Numerical Dominance Argument:** The population experiencing antipathetic pain vastly outnumbers the population engaging in the minority sexual practice. Even if the *intensity* of pleasure experienced by the practitioners is high, and the *intensity* of pain experienced by each disapproving individual is relatively low, the sheer *number* of disapprovers can easily tip the scales:
      *   (Pleasure of Practitioners) - (Pain of Practitioners) = Net Gain (P)
      *   (Pain of Disapprovers) = Net Loss (D)
      *   **Total Net Utility = P - D**
      *   Given a large enough D (due to large numbers), **P - D < 0**.
      *   Therefore, the felicific calculus dictates that suppression (which eliminates P but *also* eliminates D) yields a net gain: **0 > P - D**.

  4.  **Bentham's Exclusion as Ad Hoc & Question-Begging:**
      *   **No Intrinsic Distinction:** The antipathetic pain feels just as "real" to the disapprovers as physical pain, fear, or grief feels to others. There is no *hedonistic* marker within the sensation itself identifying it as "illegitimate" or "not pain." Bentham provides no sensory test.
      *   **The "Sympathy/Antipathy" Dodge:** Bentham's dismissal of "sympathy and antipathy" as a *principle* (i.e., acting *because* of a feeling without regard to consequences) is correct but irrelevant. The issue isn't using antipathy *as a moral principle*; it's *counting the pain caused by antipathy* as an input *into* the utilitarian calculus. Rejecting the pain *because* it stems from antipathy is circular: it assumes the very thing needing justification (that this pain shouldn't count).
      *   **Begging the Question Against Suppression:** To exclude antipathetic pain is to *assume* that suppressing the conduct is wrong *before* running the calculus. It presupposes that the disapprovers' feelings are an illegitimate basis for law, which is precisely the liberal conclusion Bentham seeks to *derive* from utilitarianism. He smuggles the tolerance *in* by defining the relevant pains *out*.

  5.  **The Need for an Independent Moral Restriction:** For the calculus to yield tolerance, Bentham *must* impose a prior restriction: "Only pains and pleasures *directly experienced by the participants in the act* count, OR pains caused *only by the bare knowledge* that the act occurs do not count." This restriction:
      *   Is **not derived** from hedonism itself. Pure hedonism counts *all* felt pains.
      *   Is a **substantive moral claim** about the limits of legitimate social concern. It resembles a proto-"harm principle" or "right to privacy," defining a sphere where individual choices are immune from being overridden by the mere distaste of others.
      *   **Lacks internal justification within utilitarianism:** Why should the pain of knowing your neighbor is gay in his bedroom not count, but the pain of knowing your neighbor is playing loud music at night *does* count? Both are psychological pains caused by knowledge of another's private acts. A consistent hedonism struggles to draw this line without importing non-utilitarian values about autonomy or the proper objects of public concern.

  6.  **The Vulnerability of Utilitarianism to Tyranny of the Majority:** Your argument exposes the core vulnerability of *unrestricted* hedonistic utilitarianism: it can readily justify the suppression of minorities to appease the prejudices or discomfort of the majority. If the majority's pain (from disgust, envy, religious offense, or simple dislike) is counted equally and outweighs the minority's pleasure, suppression becomes the "utilitarian" solution. Bentham avoids this outcome *only* by artificially limiting whose pains are counted in this specific context.

  **Conclusion of the Steelman:** Bentham's remarkably liberal conclusion on sexual conduct is not the inevitable product of a rigorously applied felicific calculus counting *all* pleasures and pains. Instead, it crucially depends on a prior, unacknowledged, and unjustified (within pure hedonism) decision to exclude a specific, powerful, and widespread category of pain – societal antipathy – from the calculation. This exclusion is necessary to avoid the illiberal conclusion potentially demanded by the numbers, but it functions as an independent moral constraint smuggled into the utilitarian framework, undermining the claim that tolerance flows solely from hedonistic premises. His tolerance relies on a substantive restriction on utility inputs that pure utilitarianism cannot generate internally.

  ### Where the Argument Might Break Down (As Requested, Held Until Now)

  1.  **The Derivative/Non-Derivative Pain Distinction:** A sophisticated utilitarian might argue that antipathetic pain *is* different. It's *derivative* pain caused by *false beliefs* (e.g., "sodomy causes earthquakes," "it corrupts youth," "God hates it") or irrational disgust mechanisms. *True* pains (hunger, disease, violence) are non-derivative. Counting derivative pains reinforces error and potentially creates *more* pain long-term by discouraging truth-seeking and toleration. Bentham *does* emphasize the importance of true beliefs for utility. **Counter-Counter:** This requires the utilitarian to make a contentious epistemological judgment about which pains are "based on truth," opening another can of worms. Is the pain of a devout believer knowing someone blasphemed privately "derivative"? What about pain from knowing someone holds racist views privately? The line is fuzzy.
  2.  **The Reflexivity/Instability of Antipathetic Pain:** Suppressing the conduct might not actually *eliminate* the disapprovers' pain; it might merely shift it or intensify it. Knowing suppression exists might cause pain to the minority and their allies. Furthermore, antipathy often *feeds on* prohibition and taboo – legal suppression can validate and amplify disgust rather than soothe it. Counting the pain might lead to a utility-draining cycle of repression and resentment. **Counter-Counter:** This is an empirical claim. In some contexts, suppression *might* reduce majority pain effectively.
  3.  **The "Fecundity" and "Purity" of Pains:** Bentham's calculus considers the tendency of an act to produce *further* pleasure/pain. Antipathetic pain might be argued to have low "fecundity" (it doesn't lead to much *other* pain/pleasure) or low "purity" (acting on it, via suppression, likely produces significant *further* pains - persecution, blackmail, suffering of the minority). **Counter-Counter:** This depends heavily on context. Proponents of suppression often argue it *has* high fecundity (preventing societal decay, boosting birth rates).
  4.  **The Liberty Dynamic:** Mill (influenced by Bentham but going beyond) argued that allowing "experiments in living," even if distasteful to some, fosters societal progress and human development, leading to greater long-term utility. Suppression stifles this. Bentham hints at this, but it's arguably an *addition* to core hedonism. **Counter-Counter:** This is a long-term, uncertain benefit weighed against immediate, intense pain for many.

  **Ultimate Point:** Your core argument is robust: Bentham's exclusion of antipathetic pain *is* necessary for his liberal conclusion and *isn't* dictated by simple hedonism. While sophisticated utilitarian defenses *can* be mounted (like 1-4 above), they require adding significant layers of complexity (epistemology, psychology, long-term dynamics) that go beyond the basic "sum all pleasures/pains" model. These defenses themselves often rely on contestable empirical or normative assumptions, demonstrating that pure hedonistic utilitarianism, applied mechanically, is insufficient to ground the liberal tolerance Bentham sought. It needs help. Your insight highlights a crucial limitation in the ability of *simple* hedonism to protect minorities from majoritarian sentiment.
