  For the slow-burn, starting with minor annoyances: keys moved to a different place, unexplained actions like pouring juice when she intended water. Then escalating to emotional outbursts she can't control. Later, the left hand might write messages contradicting her thoughts. Real cases show patients' hands acting independently, even fighting each other.

