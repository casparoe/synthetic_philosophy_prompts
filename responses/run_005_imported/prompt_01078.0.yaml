answer: |-
  ## The Lingering Debate: Normativity After Lewis

  **Characters:**  
  *   **LEO:** Leans Lewis/Bicchieri, believes rational choice + sophisticated expectations *can* capture genuine normativity. Sharp, precise, slightly impatient.  
  *   **MARA:** Skeptical, argues evolved moral sentiments are necessary for the distinctive "ought" and reactive attitudes. Deeply analytical, persistent, values conceptual clarity.

  **(The scene is a slightly messy seminar room, empty except for Leo and Mara, surrounded by scattered chairs and half-empty coffee cups. The whiteboard is covered in game matrices and terms like "CPD," "Pareto," "Conditional Preference.")**

  **Leo:** (Tapping the Fehr & Gächter paper) Look, Mara, I grant you the *surface* anomaly. Paying to punish a stranger you’ll never see again in a one-shot PGG? On a naive rational choice model with purely self-regarding preferences over material payoffs, it’s inexplicable. But that’s the key: *naive*. Lewis gave us the structure – mutual expectations grounded in a basis. Bicchieri added the crucial layer: *conditional preferences*. The norm *becomes* part of the preference structure. Violating it isn’t just coordination failure; it’s failing *me* because my preference to cooperate is conditional on expecting *you* to cooperate *and* expecting sanctioning if you don’t.

  **Mara:** (Leaning forward intently) That’s precisely where the machinery grinds, Leo. Bicchieri’s "normative expectation" – believing others *expect* compliance and *may sanction* – cleverly smuggles in the reactive attitude *before* the sentiment. But it doesn’t *explain* the sentiment itself. Why does the *expectation* of sanction generate *anger* or *resentment* in the punisher, not just cold cost-benefit? And crucially, why does the defector's act feel like a *wrong*, an *injury* demanding redress, rather than just a disappointing miscalculation on their part? The Fehr & Gächter subjects report *anger*. They *pay* to inflict pain. Lewis’s “basis” indicates a regularity; Bicchieri’s expectations condition preferences. Neither explains the *moralized* sting.

  **Leo:** Hold on. You’re assuming the anger *isn’t* instrumental. Think of the preference structure holistically. If I’ve internalized the norm – meaning I genuinely *prefer* to cooperate conditional on expecting others to do so *and* I prefer to live in a world where defectors are punished – then witnessing defection frustrates multiple strong preferences simultaneously. It frustrates my preference for mutual cooperation, my preference for fairness (itself a complex preference built on expectations), *and* my preference for norm enforcement. Anger is a proximate psychological mechanism for that profound frustration. It *feels* like a wrong because my deeply held conditional preferences are being violated. The "ought" arises from the strength and structure of those interdependent preferences.

  **Mara:** But *why* are the preferences structured that way, with such intensity, specifically around *this* rule and not others? Lewis’s conventions solve coordination problems – driving sides, meeting points. The preference to coordinate is straightforwardly self-interested. The preference to *pay a cost to punish a stranger for violating a rule about contributing to a public good* is not. Your account reduces the reactive attitude to a spandrel of frustrated self-interest. It doesn't capture the *directedness* of the resentment – it’s *at him*, for *what he did to us*. The Lewisian "basis" provides common reason to believe *what is*. It doesn’t ground *what should be* in a way that generates the feeling of a *claim* being violated. Boyd, Richerson, Trivers – they point to the evolutionary advantage of *genuine* moralistic aggression, selected *because* it motivated costly punishment, stabilizing cooperation *despite* the short-term cost to the individual. The sentiment *drives* the preference structure, not the other way around.

  **Leo:** You’re positing a mysterious extra ingredient. Let’s grant the evolutionary *origin*. Fine, we have an evolved psychology that includes strong preferences for fairness and punishment of cheats. But *proximately*, in the mind of the subject *in that lab*, what is happening? They have a preference (conditioned by evolution and culture) to enforce the norm. They see the defection. They have an empirical expectation that others share the norm (the "basis" – the experiment setup, the group context). They have a normative expectation that others expect compliance and sanctioning. Their conditional preference for punishing is triggered. The anger is the affective correlate of that preference activation and frustration. The "claim" you feel *is* the weight of the interdependent expectations and preferences. The violator "owes you better" *because* your entire social equilibrium, built on mutual conditional preferences, depends on it. Sanctioning restores the expected equilibrium. It *is* rational, given those preferences.

  **Mara:** Here’s the rub, Leo. Your account *describes* the cognitive and motivational sequence beautifully for someone who *already* possesses the moral sentiment. It explains *how* the sentiment operates *within* a framework of expectations. But it doesn’t *substitute* for the sentiment. Imagine a purely cold, rational actor with Bicchieri’s conditional preferences. They calculate: "Defection occurred. My preference function includes a term for punishing defectors when I expect others to support the norm. Do I expect others to support punishment? (Looks at basis: experiment context, likely shared understanding). Yes. Is the cost of punishing less than the internal 'disutility' I assign to norm violation going unsanctioned? (Calculates). Yes. Therefore, I punish." Where is the anger? Where is the sense of *wrong*? They might feel frustration at a suboptimal outcome, but not *moral outrage*. The Fehr & Gächter data shows the *anger* predicts punishment better than cool calculation. The sentiment provides the *motivational force* and the *qualitative experience* of normativity that the purely expectation-based preference structure lacks.

  **Leo:** But that "cold actor" is a straw man! Humans aren’t dispassionate utility calculators. Evolution built us with emotions *as* the proximate mechanisms for motivating behavior that was fitness-enhancing *on average*. The anger *is* part of the preference realization mechanism. Saying "the sentiment provides the force" just restates that we have strong, affect-laden preferences. The point is, within the model, those preferences are *conditioned on expectations about others' behavior and expectations*. The *content* of the "ought" – "you ought not to free-ride" – is defined by the regularity and the mutual expectations sustaining it. The *force* comes from the strength of the internalized conditional preference, which includes affective components. We don’t need an extra "moral sentiment" *outside* the preference/expectation framework; we need a richer model *of* preferences.

  **Mara:** And here we bottom out, Leo. You see the affective, punitive response as an *integral part* of a sophisticated, expectation-dependent preference structure fully explicable within rational choice (broadly construed to include internalized norms as preferences). The anger and sense of wrong are *properties* of those activated conditional preferences.

  **Leo:** Exactly. The machinery *does* travel. The "basis" grounds the mutual expectations (empirical and normative). The conditional preferences incorporate the "normative bite." Sanctions are the costly signals restoring the expected equilibrium. The violator "owes better" *because* the entire system of interdependent expectations and preferences collapses without that mutual commitment, making everyone worse off. The resentment is the felt recognition of that threatened collapse.

  **Mara:** And I see that affective, punitive response – particularly its specific, other-condemning quality and its ability to motivate *costly* action *without* future payoff calculation – as evidence of an evolved *sentiment* that is more fundamental. It’s what *makes* the internalization of the norm as a strong conditional preference possible and gives the "ought" its distinctive, non-instrumental feel. The expectations structure the *content* of the norm and enable coordination, but the *normative force* – the feeling that a claim has been violated, demanding a response *in itself* – stems from the sentiment. Your model describes the *operation* of normativity; it doesn’t fully capture its *source* or *phenomenology* in cases like Fehr-Gächter.

  **Leo:** So, the disagreement is ontological? Whether the reactive attitude is *constituted by* complex expectations and conditional preferences, or whether it’s a prior evolved capacity that *enables and shapes* those preferences?

  **Mara:** Precisely. And whether a model built solely on mutual expectations and rational preferences (even very complex, internalized ones) can *generate* the full phenomenology of moral obligation and resentment, or if it merely *routes* an underlying sentiment triggered by perceived violations of evolved cooperative intuitions.

  **Leo:** (Nods slowly) That seems the bedrock. I think the expectations and preferences can do the generative work, enriched by evolution. You think the sentiment is the necessary engine, making the preferences *normatively potent* in the first place. Same data, different interpretations of what’s fundamental.

  **Mara:** Exactly. And that, I suspect, is where we’ll leave it tonight. (Starts gathering her things). Same time next week? We still have to tackle the pluralism paper...

  **Leo:** (Smiling wryly) Wouldn’t miss it. Though I suspect we’ll just find another layer to this particular disagreement.

  **Mara:** (Returning the smile) Undoubtedly. Goodnight, Leo.

  **Leo:** Goodnight, Mara.
