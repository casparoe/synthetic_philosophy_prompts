answer: |-
  ## Eulogy for a Clear-Eyed Guardian

  [Pause. Look around the room, acknowledging both colleagues and family]

  We gather here today with heavy hearts, mourning the sudden loss of a remarkable mind, a demanding mentor, and a fiercely principled human being. For her students, her absence feels like a fundamental law of our intellectual universe has been unexpectedly rewritten. She wasn't just our guide through complex physics and the labyrinthine risks of nuclear weapons or advanced AI; she was our compass for thinking clearly about the world's most perilous challenges.

  Many of you here knew her brilliance – her colleagues witnessed it firsthand in labs and conferences, wrestling with problems that held the fate of nations. Her family knew her warmth, her wit, the person behind the formidable intellect. For us, her students, she existed in that space where deep care met unflinching rigor. She demanded our best, not for her sake, but because the stakes, as she saw them, were that high.

  And above her desk, a constant reminder: a yellowed copy of John von Neumann's 1955 essay, "Can We Survive Technology?" It wasn't just decoration; it was her manifesto, her North Star. She pointed to it often, especially when one of us – usually me, early on – would suggest some neat solution, some regulation or treaty or technological fix that would finally "solve" the dangers of powerful technologies. "Read it," she'd say, her eyes sharp but not unkind. "Understand the argument."

  Von Neumann's core insight, the one she internalized and passed on to us, was devastatingly simple and profoundly unsettling: **Technology has grown to the scale of the Earth itself.** There are no more safe distances. No fresh frontiers to escape to if things go wrong. No "off-ramps" that lead to a permanently safe plateau. The complex systems we build – whether nuclear arsenals or global AI networks – are interwoven with the fabric of civilization and the planet. A catastrophic failure isn't contained; it reverberates everywhere.

  This meant, for her, that the comforting idea of a single, grand solution – a ban, a perfect control mechanism, a global agreement etched in stone – was not just naive, it was dangerously complacent. It offered a false promise of finality where none could exist. The risks evolve as the technologies evolve. The landscape shifts. Complacency is the enemy.

  So, what was her answer? What defense did she see in this seemingly precarious reality? It wasn't despair. She explicitly forbade despair in any remembrance of her. Nor was it blind optimism. She equally forbade eulogies promising it would "all work out."

  **Her answer was the work itself. The long sequence.**

  She believed our only real defense lies in the relentless, patient, flexible commitment to making *small, correct decisions, every single day*. It’s the meticulous calibration of an experiment, the rigorous peer review that catches a flawed assumption, the ethical line drawn in a development meeting, the careful modeling of unintended consequences, the willingness to admit uncertainty and adapt. It’s showing up, day after day, with clear eyes and a commitment to getting the next step right, knowing there’s no ultimate finish line, only the next necessary step. It requires profound patience – the patience to build understanding brick by brick. It demands flexibility – the humility to change course when the evidence demands it. It thrives on vigilance, not panic; on diligence, not grandiosity.

  This wasn't a theory for her; it was her life. She modeled this ethos in her relentless pursuit of understanding, in her meticulous attention to detail, in her willingness to challenge powerful assumptions – including our own wishful thinking. She taught us that safeguarding humanity isn't about finding a magic shield; it's about the sustained, collective practice of disciplined foresight and responsible action. It’s a marathon run as countless sprints.

  For those of us who worked closest with her, that essay above her desk sometimes felt like a private eccentricity, a mentor's particular talisman. But in the quiet of this past week, a profound shift has occurred. Von Neumann's words, filtered through her fierce conviction, no longer feel like her quirk. They feel like an inheritance. A solemn charge. A framework for understanding the world she dedicated her life to protecting, and the work we, her students, must now continue.

  So, to her colleagues: you recognize the weight of von Neumann's question and the fierce clarity of her response. You understand the scale of the challenges she grappled with. To her beloved family: know that the essay above her desk represented the core of her profound sense of responsibility. It wasn't about pessimism; it was about a deep, active, unwavering care for the future, expressed through the most practical, grounded means imaginable – the next, correct decision.

  She didn't want promises of easy victories. She didn't want surrender to darkness. She wanted her clear-eyed view of the challenge and the *form* of the necessary response to be taken seriously. To be understood. To be acted upon.

  That is the inheritance she leaves us. Not a solution, but a method. Not a guarantee, but a calling. The calling to show up, day after day, with patience, flexibility, and unwavering commitment to making the next small, correct decision. To tend the fire of vigilance.

  We will miss her brilliance, her guidance, her sharp wit, her presence. But we carry forward the clarity she insisted upon, the responsibility she embodied, and the profound understanding that our survival hinges not on a single fix, but on the long, patient sequence. We honor her best not with easy words, but by continuing that sequence, one correct decision at a time.

  Thank you.
