  Hendrik rightly notes that sequential decision-making (revisiting choices with new evidence) mitigates Marta’s domination worry. However, he sidesteps the deeper issue: imprecise probabilities often lack clear mechanisms for *dynamically updating* the credal set across sequences. His defense is plausible but incomplete.  

