  Marta validly highlights a core weakness: imprecise probabilities struggle with decision-making. Rules like Gamma-maximin or E-admissibility *can* lead to sequential incoherence (joint domination) or reintroduce sharp probabilities covertly. Her point that action "reveals" sharp probabilities is defensible in revealed-preference frameworks (e.g., Savage’s axioms).  

