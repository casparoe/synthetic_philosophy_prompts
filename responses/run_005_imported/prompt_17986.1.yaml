  User's "punish you extra" concern is crucial. Leo should voice that threateners could impose multiplicative penalties for defiance, making surrender costlier than compliance. Maya's rebuttal: threateners want efficient coercion, not wasteful punishment.

  ...Wait, did the user consider that threateners might prefer preemptively ignoring surrogate-users? That's Maya's strongest point. If the threatener knows surrogate-users won't cave on real values, threatening them is wasted computation. Leo would retort that they might threaten anyway to deter real-value defenders from faking surrogates.

  Ending on unresolved tension feels honest. This isn't solvable; it's about trading off risks. User probably wants to sit with that discomfort.

