answer: |-
  You've hit on a crucial nuance in Aquinas's argument that often gets glossed over in modern "double effect" summaries. Aquinas *is* outlining two distinct justifications for causing death, and understanding why he needs both reveals the deeper structure of his moral framework. Let's break it down:

  1.  **The Core Double Effect (For Everyone):**
      *   **Act:** Repelling an unjust aggressor in self-defense.
      *   **Intended Effect:** Saving one's own life (a good effect).
      *   **Merely Foreseen Effect:** The death of the aggressor (a bad effect).
      *   **Justification:** The act is morally defined by the *intention* (saving life). The bad effect is not intended, only foreseen as a possible outcome. Saving one's life is a natural good, and one has a greater duty to preserve one's own life than that of an unjust aggressor. Crucially, the violence used must be *proportionate* – only what's necessary to stop the threat. Using excessive force ("more than necessary violence") makes the act unlawful because it violates proportionality.

  2.  **The "Public Authority" Exception (Intended Killing):**
      *   **Act:** Repelling an unjust aggressor (e.g., soldier vs. enemy, officer vs. robber).
      *   **Intended Effect:** Killing the aggressor *as a means* to achieve a greater good.
      *   **Justification:** Aquinas holds a foundational principle: **"it is unlawful to take a man's life, except for the public authority acting for the common good."** This is non-negotiable for him. *Only* those vested with public authority (derived from God/godly order, in his view) can *legitimately intend* the death of another human being.
      *   **Why?** Their act isn't *primarily* about private self-preservation. It's about upholding the public order and the common good – defending the community, enforcing justice, protecting the innocent *as a whole*. Killing the aggressor becomes a necessary tool *intended* for achieving this public good. However, even here, proportionality applies ("although even these sin if they be moved by private animosity").

  **Why Aquinas Needs Both Routes:**

  1.  **The Absolute Prohibition on Private Intention to Kill:** Aquinas fundamentally believes that *no private individual* can ever morally *intend* the death of another human being. Life belongs to God, and only God's representatives (legitimate public authorities) can licitly intend its taking for a higher communal purpose. Double effect provides a *narrow escape hatch* for private individuals facing imminent death: they can act *only* intending self-preservation, *accepting* the foreseen but unintended death of the aggressor as a side-effect, provided proportionality is strictly observed.

  2.  **The Reality of Public Defense:** Aquinas recognizes that soldiers, judges, and their officers *must* sometimes *intend* to kill to fulfill their duty to protect society (e.g., a soldier aims to kill the enemy combatant; an executioner intends to kill the condemned). Double effect *doesn't work* for these cases because the death *is* the intended means to the public good. He *needs* a separate justification grounded in the *authority* and the *purpose* (common good) of the actor. This justification *overrides* the general prohibition on intending to kill, but *only* for those specifically authorized.

  **How This Relates to Modern Trolley Problems & Double Effect:**

  1.  **The Modern "Thinning" of DDE:** Contemporary philosophers (like Philippa Foot) often focus *primarily* on the core double effect structure: intending good vs. foreseeing bad, proportionality, necessity. The "public authority" aspect is usually dropped because modern secular ethics generally rejects Aquinas's premise that only divinely-ordained public authority can legitimately intend killing (e.g., we accept self-defense doctrines where intent *might* include killing the attacker under specific circumstances, or just war theories not tied to specific medieval authority structures).
  2.  **What Modern DDE Misses from Aquinas:**
      *   **The Absolute Bar on Private Intention to Kill:** Modern DDE is usually a *balancing test* (intended good vs. foreseen bad + proportionality). Aquinas's framework has a much stricter *absolute rule*: private individuals *cannot intend killing at all*. DDE is the *only* way they can cause death without sin.
      *   **The Role-Based Permissions:** Aquinas's ethics are deeply tied to social roles and duties. The morality of an act depends significantly on *who* is performing it and *for what authorized purpose*. Modern DDE is often presented as more universally applicable, regardless of the agent's role (though role-based duties might factor into proportionality).
  3.  **Implications for Your AV Debate:**
      *   If you strictly apply *Aquinas's original framework* to an AV, the car/programmer is a *private actor*. Therefore, it could *never* licitly *intend* the death of its passenger. Any death caused must be an *unintended side-effect* of an act primarily intended for a proportionately greater good (e.g., swerving to save 5 pedestrians *might* be justified under DDE if the passenger's death is truly unintended and the act is the only proportionate way to save the pedestrians).
      *   **The Crucial Nuance:** Aquinas's DDE justification *for private actors* requires the *passenger's death itself* to be the unintended side-effect of an act aimed at a greater good. If the algorithm *deliberately chooses* to kill the passenger *as the means* to save others (e.g., steering the car into a wall specifically to absorb impact and shield pedestrians), Aquinas would likely condemn this *for a private actor*, as it involves *intending* the passenger's death. Only a "public authority" AV (e.g., a military vehicle on a mission) *might*, under Aquinas's view, be permitted to intend a death for the common good.
      *   Modern philosophers using DDE for trolley problems often *would* permit the "intending death as a means" in scenarios like the "footbridge" variant (pushing one to stop the trolley) *if* it meets proportionality, precisely *because* they've dropped Aquinas's absolute bar on private intention to kill. They focus on the structure of the act and its effects, not the agent's authority.

  **In Summary:**

  *   Aquinas presents **two distinct justifications:**
      1.  **Double Effect (Private Individuals):** Death is an *unintended side-effect* of a proportionate act intended for self-preservation.
      2.  **Public Authority (Officials):** Death can be *intended as a means* to protect the common good, by those specifically authorized to do so.
  *   **He needs both** because of his core principles:
      *   Absolute prohibition on private individuals *intending* to kill.
      *   Recognition that public officials *must* sometimes intend killing to fulfill their duty to the common good.
  *   **Modern Double Effect** discussions typically focus *only* on the first justification (intend good/foresee bad + proportionality), often loosening or ignoring Aquinas's absolute ban on private intention to kill and his role-based permissions. The "public authority" part is largely historical context now.

  Your coworker is right that Aquinas is the source of the core "intend vs. foresee" distinction. However, your close reading uncovered that Aquinas embedded this within a much more complex moral and political framework, where the *agent's role and authority* are just as critical as the structure of the act itself for determining when causing death is permissible. The modern trolley problem debate leans heavily on the *structure* (foreseen vs. intended, proportionality) but generally discards Aquinas's *agent-based* restrictions (who can intend what).
