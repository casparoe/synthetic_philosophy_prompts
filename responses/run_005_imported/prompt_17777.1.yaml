  The core tension is fascinating: their peer wants to implement epistocracy-lite (Brennan/Estlund seminar ideas) via quiz-based vote weighting, while others fear it creates an undemocratic gatekeeping mechanism. The user specifically wants the memo to confront the "who decides what counts as informed" problem head-on, not dodge it. 

  Hmm, their position is tricky. As a dorm rep, they're accountable to constituents who may have voted based on that Instagram infographic. As a poli sci student, they know the theory. And as memo drafter, they need to reconcile: 
  - The real problem of misinformation distorting direct democracy 
  - The dangerous precedent of student government arbitrating voter competence 
  - The need for a proposal that's both effective and legitimate 

  I notice they reject a neutral "both sides" approach, so I'll lean into a modified proposal that addresses misinformation while avoiding vote hierarchy. The sunset clause trial run with mandatory review seems essential - it turns a permanent power grab into a testable hypothesis. 

  The "voter guide co-creation" angle feels key too. If the Senate partners with campus media and fact-checkers instead of monopolizing truth, it mitigates the "who decides" objection. And emphasizing that the quiz is diagnostic (not gatekeeping) aligns with Estlund's acceptability requirement. 

  ...Wait, should I address the half-vote weighting? It's the most incendiary element. Maybe frame it as "proportional influence" rather than devaluation, while noting it's the most legally vulnerable part? But the user wants decisiveness, so the memo should recommend removing it entirely in favor of the knowledge-building process itself as the reform. 

  The tone needs academic rigor but undergrad-practical. No jargon like "epistemic adequacy," just "making sure voters understand what they're deciding." And absolutely must cite the Brennan reading everyone knows - that'll resonate with the seminar peer. 

  Biggest challenge: making the "modified adoption" feel like a strong stance, not a cop-out. Positioning it as "targeting misinformation without disenfranchisement" turns compromise into principle.
answer: |-
  Here’s a draft memo that decisively recommends a modified version of the proposal, directly addresses the "who decides" objection, and provides clear reasoning. It rejects the half-vote weighting while preserving the core goal of combating misinformation:

  ---

  **MEMORANDUM**  
  **TO:** Student Senate, Full Assembly  
  **FROM:** Elections & Governance Subcommittee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Proposed "Informed Voting" Referendum Reform  

  ### I. Proposal Summary
  Senator [Name] proposes requiring voters to complete a Senate-authored "voter guide" and pass a 3-question comprehension quiz before voting on future referenda. Those failing the quiz would retain voting rights but have their ballot weighted at 0.5 votes.  

  ### II. Subcommittee Recommendation: MODIFIED ADOPTION (with critical revisions)  
  **We recommend adopting a pilot program for mandatory voter education, but REJECTING vote-weighting.** The revised framework includes:  
  1. **Mandatory Voter Guide & Quiz:** Voters must review a neutral guide and pass a comprehension quiz *before accessing* the referendum ballot.  
  2. **No Vote Weighting:** All votes count equally, regardless of quiz performance.  
  3. **Sunset Clause:** The policy expires after 2 referenda.  
  4. **Co-Created Content:** Guides authored by a **non-partisan working group** (Senate + independent stakeholders: campus newspaper editors, SGA Judiciary Chair, and faculty advisor).  
  5. **Transparency Safeguard:** Quiz questions and pass rates published pre-referendum.  

  ---

  ### III. Reasoning: Balancing Democratic Integrity and Informed Decision-Making  
  **A. The Problem: Misinformation Undermines Direct Democracy**  
  The recent shuttle defund referendum demonstrated how viral disinformation can distort outcomes. Direct democracy requires voters to understand *what* they are deciding. Our current system fails to ensure baseline comprehension of proposals.  

  **B. Why We Reject Vote-Weighting**  
  While well-intentioned, weighting votes based on quiz performance:  
  - **Violates Core Democratic Norms:** Student government lacks the legitimacy to hierarchize voters’ influence. This risks perceptions of elitism and entrenches Senate power.  
  - **Creates Perverse Incentives:** Future Senates could manipulate quizzes to suppress dissent.  
  - **Legal Vulnerability:** Though not prohibited by bylaws, unequal voting influence in referenda invites challenges under broader student governance principles.  

  **C. Why We Support Education + Access Restriction (Without Weighting)**  
  1. **Promotes Informed Consent:** Voters should understand a policy’s substance before shaping it. A comprehension checkpoint respects the gravity of decision-making.  
  2. **Combats Low-Information Virality:** Mandatory engagement with factual information counters drive-by voting based on social media headlines.  
  3. **Equal Access, Equal Weight:** Withholding ballot access until quiz completion ensures *opportunity* for informed voting without devaluing any student’s voice.  

  ---

  ### IV. Directly Addressing "Who Decides What Counts as Informed"  
  **This objection is valid and central to our modifications:**  
  - **Problem:** Senate-alone authorship risks partisan guides or "gotcha" quizzes.  
  - **Solution:** The **non-partisan working group** (Senate + **campus media, Judiciary, faculty**) ensures:  
    - Guide neutrality via diverse perspectives.  
    - Quiz questions focus on *objective facts* (e.g., "What service is being defunded?") not interpretation or ideology.  
    - Content is publicly scrutinized pre-referendum.  
  - **Accountability:** Sunset clause forces reevaluation after real-world testing.  

  ---

  ### V. Why This Approach Works  
  1. **Targets the Root Cause** (misinformation) without disenfranchisement.  
  2. **Upholds Democratic Equality:** "One person, one vote" remains sacrosanct.  
  3. **Legitimacy Through Process:** Involving stakeholders beyond the Senate builds trust and guards against bias.  
  4. **Pragmatic:** Easily implementable via existing voting platforms.  

  ---

  ### VI. Implementation Timeline (Pilot Program)  
  1. **First Referendum:** Working group drafts guide/quiz; Senate approves by 2/3 vote.  
  2. **Post-Referendum:** Assess voter feedback, pass rates, and guide effectiveness.  
  3. **After Second Referendum:** Full Senate votes to renew, modify, or sunset.  

  ---

  **CONCLUSION**  
  Democracy requires both equal voice and informed engagement. This proposal rejects epistocratic weighting but embraces the duty to promote comprehension. We can combat misinformation without implying some students’ votes matter less. **We urge the Senate to adopt the revised pilot program.**  

  Respectfully submitted,  
  [Your Name], on behalf of the Elections & Governance Subcommittee  

  ---

  ### Key Strengths of This Approach:
  - **Confronts "Who Decides":** Explicitly answers with a multi-stakeholder model.  
  - **Decisive Yet Nuanced:** Rejects the most dangerous element (vote-weighting) while salvaging the proposal’s intent.  
  - **Grounds in Realpolitik:** Sunset clause and co-creation mitigate fears of Senate overreach.  
  - **Theoretically Sound:** Aligns with Estlund’s "acceptable to all reasonable points of view" standard by preserving equality.  
  - **Hard to Demagogue:** Framing it as "access to information" rather than "qualified voting" is more defensible to constituents.  

  This memo gives you a strong, principled stance that acknowledges valid concerns while advancing a practical solution. It positions you as a thoughtful mediator who respects both democratic theory and on-the-ground realities.
