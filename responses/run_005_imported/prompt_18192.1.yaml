answer: |-
  You're hitting the core tension in conditional semantics. Let's dissect how Stalnaker/Lewis similarity-based semantics and Adams' suppositional account handle the Oswald asymmetry, focusing on *explanatory power* and the implications of Lewis' triviality.

  **1. Stalnaker/Lewis: Asymmetry via World Selection Rules**

  *   **Mechanism:** Both conditionals share the antecedent (Oswald didn't kill Kennedy) and consequent (Someone else killed Kennedy). The difference lies in the **world selection function**:
      *   **Indicative ("didn't...did"):** `f(P, i)` selects the *closest possible world to @ (actual world)* **where P is true, holding fixed our current *epistemic situation* as much as possible.** Crucially, "holding fixed" means preserving *known* historical facts *compatible with P*. We *know* Kennedy *was* killed. The closest worlds where Oswald didn't do it are worlds where the *known outcome* (Kennedy dead) is preserved by *some other cause consistent with what we know*. Therefore, in the closest P-worlds *epistemically accessible from here*, someone else *did* kill him. The indicative feels true because it asserts that *given what we know*, non-Oswald-killing scenarios compatible with our knowledge involve a conspiracy/other killer.
      *   **Subjunctive ("hadn't...would have"):** `f(P, i)` selects the *closest possible world to @* **where P is true, allowing for *backtracking* counterfactual dependencies to make P true.** How might Oswald not have killed Kennedy? By not being on the 6th floor, not bringing a rifle, changing his mind, etc. The closest worlds involve small changes to Oswald's plans/actions *prior* to the event. Crucially, in these worlds, the *specific causal chain leading to the shooting* is altered. There's no inherent reason why another assassin *must* be present in Dealey Plaza at that exact moment in these worlds. The consequent (someone else killed him) is *not* true in the closest P-worlds. It feels false because it asserts that the *specific causal setup* without Oswald would *necessarily* have produced the same outcome via another means, which isn't supported by the closest backtracking worlds.
  *   **Explanatory Power:** The asymmetry arises *naturally* from the different constraints on world selection:
      *   **Indicative:** Epistemic constraint (preserve known facts compatible with P). Forces the consequent to hold in the closest P-worlds because the known outcome *must* be explained.
      *   **Subjunctive:** Causal/backtracking constraint (minimal miracle or small divergence). Allows worlds where the antecedent is true *without* the consequent, as the outcome isn't metaphysically necessary given the altered causal precursor.
      *   **Strength:** This doesn't feel like mere stipulation. It's a consequence of integrating conditionals into a broader modal framework where *context* (epistemic vs. counterfactual) systematically alters the accessibility relation/similarity metric. The theory *predicts* the asymmetry based on fundamental differences in how we reason about epistemic possibility vs. causal dependence.

  **2. Adams: Asymmetry via Speech Act & Probability**

  *   **Mechanism:**
      *   **Indicative ("didn't...did"):** Treated as a *suppositional assertion*. Its assertability is determined by the *conditional probability* Pr(Someone else killed Kennedy | Oswald didn't kill Kennedy). Given we *know* Kennedy was killed, Pr(Someone else killed | Oswald didn't) is very high (approaching 1). It feels true because this conditional probability is high.
      *   **Subjunctive ("hadn't...would have"):** Adams argues subjunctives *do* have truth conditions (often analyzed via Stalnaker/Lewis-like worlds). However, the key point for Adams is that the *assertability* of the indicative is *fundamentally different* and *not* truth-conditional. The subjunctive feels false because, evaluated via possible worlds (or simply our beliefs about causal chains), it's judged unlikely that the specific circumstances without Oswald would *guarantee* another killer was present and acted. Pr(Someone else *would have* killed | Oswald *hadn't* killed) is judged to be low.
  *   **Explanatory Power:** The asymmetry arises from a fundamental distinction in the *type of speech act*:
      *   **Indicative:** Expresses high conditional probability *given current knowledge*. It's about *epistemic dependence* under supposition.
      *   **Subjunctive:** Makes a claim about *causal/metaphysical dependence* in alternative scenarios (potentially truth-conditional).
      *   **Strength:** Adams cleanly separates the *logic* of indicative conditionals (governed by probability) from subjunctives. He *explains* why we can't assign straightforward truth conditions to indicatives: their role is probabilistic assertion, not describing world-states. The Oswald pair highlights this role difference. The feeling of truth/falsehood directly maps to high/low conditional probability in the respective contexts.

  **Comparing Explanations:**

  *   **Stalnaker/Lewis:** Explains the asymmetry as arising from *systematic, context-dependent differences in how we access alternative possibilities*. The world selection rules are general principles applied to different modal contexts (epistemic vs. counterfactual). The explanation is integrated into a unified theory of modality.
  *   **Adams:** Explains the asymmetry as arising from a *fundamental difference in the linguistic function* of the two conditionals – one is probabilistic/suppositional, the other is (potentially) truth-conditional/metaphysical. He posits a categorical distinction in their semantic type.

  **Lewis' Triviality Results: The Sword of Damocles for Indicative Truth Conditions**

  This is where Adams' account gains significant traction, and Stalnaker's project faces its biggest challenge.

  *   **The Problem:** Lewis (1976) proved that under seemingly mild assumptions (e.g., the probability of a conditional `Pr(if A then C)` is defined, and the logic of conditionals interacts reasonably with probability), `Pr(if A then C)` *must* equal `Pr(C | A)` (**The Equation**). Crucially, he also proved that *if* indicative conditionals have truth conditions *and* satisfy The Equation, then they *cannot* be propositions in the standard sense – their probability collapses in ways incompatible with a non-trivial probability space. Essentially, `If A then C` becomes equivalent to `C` whenever `A` is true, or other absurdities arise depending on the specific proof.
  *   **Adams' Response:** **Vindication.** Adams *denies* indicatives have truth conditions. For him, The Equation `Pr(if A then C) = Pr(C | A)` is *definitional* of the indicative conditional's assertability. Lewis' result shows that trying to assign truth conditions *while preserving this core probabilistic feature* is impossible. Adams' theory *embraces* the non-truth-conditional nature as essential.
  *   **Stalnaker's Response (and the Challenge):** Stalnaker *does* assign truth conditions and *wants* The Equation to hold (`Pr(if A then C) = Pr(C | A)`). Lewis' result forces him into a corner. His main escape route is **pragmatics**:
      1.  **Context Shift:** Asserting `If A, then C` *changes the context* by adding `A` to the common ground. The probability `Pr(C | A)` is calculated *after* this shift. The truth conditions are fixed relative to a context, but assertion involves dynamic update. Lewis' proofs often assume a static context.
      2.  **Impossible Precision:** Stalnaker suggests that conditionals may only have determinate truth values in contexts where `A` is *epistemically possible* and its probability isn't 0 or 1. The triviality arises when we try to assign probabilities unconditionally across all contexts.
  *   **Why it Should Worry Stalnaker (and you):** While Stalnaker's pragmatic maneuvers are sophisticated, many find them ad hoc compared to the clean impossibility result. They seem designed *specifically* to avoid triviality rather than flowing naturally from the core semantics. **The burden of proof is heavily on the truth-conditionalist:** they must provide a compelling account of truth conditions *that explains why The Equation holds so pervasively in reasoning and assertability*, while simultaneously explaining why Lewis' mathematical proofs (which assume the Equation) don't actually destroy their project. Adams avoids this burden entirely by rejecting truth conditions for indicatives from the start.

  **Conclusion: Which Explains the Asymmetry Better?**

  *   **Stalnaker/Lewis:** Provides a powerful, unified, *modal* explanation grounded in systematic differences in world selection under epistemic vs. counterfactual contexts. The asymmetry feels like a consequence of deep principles about possibility and similarity. However, it carries the heavy burden of Lewis' triviality results, requiring complex (and arguably stipulative) pragmatic defenses to maintain truth conditions.
  *   **Adams:** Provides a clean *functional* explanation: the indicative and subjunctive simply *do different jobs* (probabilistic assertion vs. metaphysical claim). The asymmetry directly reflects this functional difference and the associated probabilities. Lewis' triviality results become a powerful *argument for* Adams' core claim – that indicatives fundamentally lack truth conditions. The explanation feels less integrated into a grand modal theory but is highly parsimonious for the indicative itself.

  **Your Lit Review Angle:** Focus on the **explanatory cost/benefit**. Stalnaker/Lewis offers a deep, integrated modal explanation but pays a high price in contortions needed to handle triviality. Adams offers a simpler, functionally-driven explanation that embraces non-truth-conditionality, making triviality a feature, not a bug. The Oswald asymmetry is a perfect litmus test: Stalnaker/Lewis explains it via world selection rules derived from context; Adams explains it via a fundamental distinction in semantic type/speech act. Which kind of explanation – modal-unificationist or functional-parsimonious – provides more genuine insight? The persistent shadow of Lewis' result significantly tilts the scales towards Adams for indicatives specifically.
