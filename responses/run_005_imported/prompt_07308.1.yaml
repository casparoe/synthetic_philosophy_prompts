  *   **Nature of the Act:** Anscombe focuses on the *kind of act* chosen: the deliberate destruction of entire cities full of non-combatants. This act-type itself is intrinsically murderous. The scale and totality matter to her argument.
  *   **Target vs. Outcome:** The primary moral issue for Anscombe is the *choice to target a city* (a population center), not solely the outcome. Targeting civilians is the defining wrong.
  *   **Personal Responsibility:** Anscombe emphasizes Truman's *personal moral culpability* as the authorizing agent. She holds him directly responsible for the murders.
