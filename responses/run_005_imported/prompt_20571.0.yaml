prompt: |-
  Okay so this has been bugging me for weeks. I started CBT a couple months ago for a doomscrolling/procrastination thing that's gotten pretty bad, and my therapist keeps explaining my behavior in terms of "hyperbolic discounting" -- basically that my brain massively overweights whatever's immediately in front of it compared to literally anything even an hour away, so 11pm-me keeps torching all of 8am-me's plans. Fine, that tracks as a description of what's happening. But then my roommate, who's finishing up a philosophy MA, said something that's been nagging at me since: she thinks economists' hyperbolic discounting model and what philosophers actually mean by "weakness of will" (akrasia) might not be the same phenomenon at all -- that a hyperbolic discounter caving to temptation isn't necessarily being irrational or "akratic" in the classical sense, since in the moment they're being perfectly consistent with their (admittedly warped) current preferences, no Davidson-style clash between judgment and action required.

  I tried googling around this and got lost fast -- there's apparently a whole side-debate about whether you need to add something extra, like resolutions or plans (I think a name like Holton came up, but don't hold me to that), to get back to a picture where "giving in" counts as a genuine failure of will rather than your utility function legitmately just changing shape as the reward gets closer. Could you actually walk me through the substance of this? Specifically I want to understand what the real tension is between the "time-inconsistent preferences, no irrationality required" story and the classical philosophical picture of akrasia, and what has to be true of an agent -- naive vs sophisticated discounter, having made and broken some prior resolution, whatever -- for their hyperbolic discounting to actually count as weakness of will rather than just a different, equally rational-in-context, kind of choice.
reasoning: |-
  Okay, let me try to unpack this user's query. They're dealing with procrastination and doomscrolling, and their therapist explained it using hyperbolic discounting. But their philosophy-savvy roommate mentioned that this might not be the same as the classical concept of akrasia, or weakness of will. The user is confused about the difference and wants to understand the tension between these two models.

  First, I need to recall what hyperbolic discounting is. It's an economic model where people devalue rewards and punishments more steeply as the delay increases. So immediate gratification is overvalued compared to future benefits. The user's therapist is using this to explain why 11 PM them sabotages 8 AM plans. 

  Then there's the philosophical concept of akrasia. In classical philosophy, like Aristotle or Davidson, akrasia is acting against one's better judgment. You know what's best but do something else anyway. The user's roommate is pointing out that in hyperbolic discounting, there's no contradiction—just changing preferences. But in akrasia, there's an internal conflict.

  The user mentioned Richard Holton and resolutions. Holton's idea is that weakness of will involves abandoning a resolution without a good reason. So if the user had resolved to stop scrolling but then gives in, that's akrasia. But in hyperbolic discounting, if they didn't make a resolution, it's just preference change. 

  The key tension is whether changing preferences alone constitutes irrationality. Economists might see it as consistent within the moment, but philosophers argue that violating prior resolutions or better judgment makes it akratic. The user needs to know when their behavior is a rational preference shift versus a failure of will.

  They also brought up naive vs sophisticated discounters. Naive ones don't foresee their future self's changes, leading to repeated procrastination. Sophisticated ones anticipate it and might take steps, like using apps to block sites. Sophistication might involve more self-binding, which relates to resolutions and akrasia.

  The user's deeper need might be understanding how to frame their struggle. If it's just preference change, maybe different solutions are needed versus addressing weakness of will. They might want practical advice but are currently seeking conceptual clarity to inform their approach to CBT.

  I should explain the differences clearly, using examples like the bedtime scenario. Highlight how resolutions and self-binding tie into akrasia. Emphasize that hyperbolic discounting becomes weakness of will when there's a broken resolution or a failure to uphold a commitment, not just preference shifts. Also, mention that the debate isn't settled, but understanding both models can help them work with their therapist effectively.
answer: |-
  This is a brilliant question that cuts to the heart of a fascinating debate about rationality, time, and the self. Your roommate is pointing to a genuine conceptual puzzle. Let's break down the tension step-by-step:

  **1. The Core Models: Hyperbolic Discounting vs. Classical Akrasia**

  *   **Hyperbolic Discounting (HD):**
      *   **Description:** A model of how preferences change over time. Rewards are discounted hyperbolically: a small reward *right now* is valued much more highly than a larger reward slightly delayed, but the preference reverses as both rewards move into the future. The discount rate is steep in the near term and flattens out over the long term.
      *   **Rationality Claim:** At any *single point in time*, the agent is acting rationally *given their current preferences*. When 11pm-you chooses scrolling over sleep, they are maximizing their *current* utility function, which heavily weights the immediate pleasure/release of scrolling and heavily discounts the future pain of tiredness. There's no internal contradiction *at t=11pm*.
      *   **Key Feature: Time-Inconsistency.** The preferences of the agent *at different times* conflict. 8am-you prefers a plan involving work and early sleep. 11pm-you prefers immediate scrolling. Both are "rational" given their temporal perspective.

  *   **Classical Akrasia:**
      *   **Description:** Acting against one's own better judgment. The agent, *at the moment of action*, judges that course A is best overall (e.g., going to sleep), yet voluntarily and intentionally performs course B (doomscrolling).
      *   **Rationality Claim:** Akrasia involves an *internal contradiction within the agent at a single moment in time*. There's a clash between:
          *   **Judgment (J):** "Action A (sleep) is best for me *all things considered*."
          *   **Intention/Action (I):** "I intend/perform Action B (scrolling)."
      *   **Key Feature: Synchronic Irrationality.** The irrationality happens *now*. The agent knows B is worse *by their own current standards*, yet does B anyway. Philosophers like Donald Davidson emphasized this synchronic conflict as essential to weakness of will.

  **2. The Tension: Where the Models Diverge**

  The core tension your roommate identified is this:

  *   **The HD Argument:** In the pure HD model, at 11pm, there *is no* synchronic conflict. The agent *doesn't* judge that sleep is best "all things considered" *at that moment*. Their "all things considered" judgment *is* that scrolling is best *right now*. Their utility function has shifted. They aren't acting against their *current* judgment; they are acting *in line* with their current, time-sliced preferences. Therefore, it's not akrasia in the classical sense – there's no Davidsonian clash between J and I *at t=11pm*.
  *   **The Classical Akrasia Argument:** But this feels deeply unsatisfying as an explanation for why we feel *guilty* or like we *failed* when we scroll at 11pm. We feel like 11pm-us betrayed 8am-us. We feel a conflict *within ourselves* across time. The HD model seems to reduce us to a series of disconnected temporal selves, each rational in their own bubble, but collectively irrational. Akrasia captures the sense of *self-betrayal* and *failure of self-governance* that HD, by itself, doesn't account for.

  **3. Bridging the Gap: Resolutions, Plans, and Sophistication**

  This is where philosophers like **Richard Holton** (you remembered correctly!) come in. They argue that to capture the phenomenon of weakness of will *as we experience it*, we need to add an element that creates the necessary synchronic tension *even within an HD framework*. The key concepts are:

  *   **Resolutions:** These are *prior decisions* or *commitments* made specifically to bind one's future self against anticipated temptation. "I *resolve* tonight to turn off my phone at 11pm." A resolution isn't just a preference; it's a commitment to a plan *despite* knowing future preferences might change.
  *   **Plans:** More broadly, forming an intention or plan (like your 8am plan) involves a commitment to a course of action that spans time.

  **How Resolutions Create Akrasia within HD:**

  1.  **Making the Resolution (t=planning, e.g., 8am):** You judge that consistently following your plan (work, no late scrolling, sleep) is best for your long-term well-being. You *resolve* to act accordingly later (at 11pm).
  2.  **The Moment of Temptation (t=action, 11pm):**
      *   **HD Preference Shift:** Your *preference* has shifted due to hyperbolic discounting. Scrolling *now* feels more appealing than the delayed reward of being rested.
      *   **The Lingering Resolution/Plan:** However, you *also* still hold the *judgment* that sticking to your resolution/plan *is* the best course *all things considered, even now*. You haven't rationally reassessed the long-term value; you're just viscerally drawn to the immediate reward.
      *   **The Synchronic Conflict:** This creates the Davidsonian clash *at 11pm*:
          *   **J (Judgment):** "Sticking to my resolution (sleeping) is best for me all things considered." (This judgment persists from your planning self and is still endorsed, albeit weakly, by your current self).
          *   **I (Intention/Action):** "I intend to/am scrolling."
      *   **The Akratic Failure:** *Weakness of will occurs when you abandon your resolution/plan without a sufficient new reason.* You cave *solely* because of the shifted HD preference, not because you've learned new information or rationally reassessed your long-term goals. You act against your *persisting* better judgment (J).

  **4. Naive vs. Sophisticated Discounters: Who Can Have Weakness of Will?**

  *   **Naive Discounter:** Doesn't foresee their future preference changes. At 8am, they make plans but don't realize 11pm-them will want to break them. They are surprised each time.
      *   *Akrasia?* Less clear. When they break the plan at 11pm, they might not feel the synchronic conflict *as strongly* because they didn't anticipate the struggle. However, if they *still* hold the *judgment* that the plan was best *even as they break it* (perhaps feeling immediate guilt), then it fits the akrasia model (conflict at t=11pm). Their naivety doesn't preclude a synchronic judgment-action clash.
  *   **Sophisticated Discounter:** *Foresees* their future HD preference shifts. At 8am, they know 11pm-them will want to scroll.
      *   **Strategy 1: Self-Binding (Resolution):** They *make a resolution* and perhaps take steps to enforce it (e.g., app blockers, leaving phone in another room). **This is where akrasia becomes possible.** If, at 11pm, they *override* their binding mechanism (disable the app, retrieve the phone) *while still judging it would be better not to*, that's classic weakness of will. They experience the synchronic conflict and fail to stick to their commitment.
      *   **Strategy 2: Preemptive Surrender:** Knowing they'll cave, they never make the resolution/plan in the first place ("Why bother planning? I know I'll scroll"). They avoid the synchronic conflict by lowering expectations. **No akrasia here** – just consistent, time-consistent defeatism. There's no resolution to break and no judgment at 11pm that they *should* be doing otherwise.

  **5. What Makes HD Behavior "Weakness of Will"?**

  For hyperbolic discounting behavior to constitute classical akrasia (weakness of will), the following elements need to be present at the moment of action (t=11pm):

  1.  **A Prior Resolution or Plan:** A specific commitment was made earlier to act in a certain way later (X), anticipating the temptation to do Y.
  2.  **Persisting Endorsed Judgment:** At t=11pm, the agent *still judges*, all things considered, that sticking to the resolution/plan (X) is better than yielding to the temptation (Y). This judgment hasn't been rationally revoked.
  3.  **Action Against Judgment:** The agent voluntarily and intentionally performs Y (scrolling).
  4.  **No Sufficient New Reason:** The switch to Y isn't based on new information or a rational reassessment of values; it's driven *primarily* by the shifted HD preferences making Y *feel* overwhelmingly attractive *now*.
  5.  **Synchronic Conflict:** Points 2 and 3 create the essential clash *within the agent at the single time* t=11pm.

  **In essence:** Hyperbolic discounting *explains the mechanism of temptation* – why scrolling feels so much better *right now*. But it's the **abandonment of a resolution or plan *in the face of that temptation, while still holding the judgment that sticking to it is best,*** that transforms the behavior from a simple (if time-inconsistent) preference shift into **weakness of will (akrasia)**. The resolution acts as the bridge between the time-inconsistent preferences of HD and the synchronic irrationality characteristic of akrasia.

  This debate isn't settled. Some economists and philosophers lean heavily towards the HD model as sufficient. Others, like Holton, argue resolutions are essential to capture the phenomenology and normativity of weakness of will. Understanding both perspectives helps clarify why your 11pm scrolling feels like more than just a different preference – it feels like a failure of self-governance because you're breaking a promise *to yourself* that you still believe was the right one. This insight can actually be powerful fuel for your CBT work, helping you frame the battle not just against time-inconsistency, but *for* keeping commitments to your future self.
