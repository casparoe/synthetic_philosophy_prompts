  Addressing the counterarguments: The autonomy concern is valid, but the prior commitment was autonomous too. The delay isn't outright refusal but a structured pause. For the craving vs. genuine change, the policy should require evidence beyond self-report, like behavioral indicators. Frankfurt's model doesn't fit perfectly here because it's about internal conflict, not an external force. The policy must avoid assuming all requests are weakness of will, hence the need for objective criteria.

