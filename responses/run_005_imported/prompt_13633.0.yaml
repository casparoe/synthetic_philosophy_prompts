answer: |-
  Here's a eulogy honoring your aunt's philosophy while offering genuine comfort, strictly adhering to her views and avoiding metaphysical pitfalls:

  ---

  We gather here not just to mourn, but to remember [Aunt's Name]. To celebrate a brilliant mind, a fierce spirit, and a woman whose laughter could fill a room – and occasionally, a lecture hall with challenging questions. Her life was a testament to the power of clear thinking, especially about the very nature of things. It was her passion, her life's work.

  [Aunt's Name] dedicated herself to understanding how things *are* – how a statue isn't *just* the lump of clay, even though, at any given moment, they share the same matter, the same space. She showed us that what something *is* depends on more than just its physical stuff; it depends on its form, its history, its place in the world. What makes a statue a statue isn't just the clay, but the shape, the meaning, the artistry imposed upon it. And crucially, she insisted this wasn't just about statues or lumps of clay. It applied to us, to people.

  By her own rigorous thinking, [Aunt's Name] taught that a person – the vibrant, witty, loving, arguing, thinking individual we knew – is constituted by the body, intimately bound to it, but *not* simply identical to it. Just as the statue ceases to be when the clay is radically reshaped, even if the clay itself persists, so too the person ceases when the body can no longer sustain the life, the consciousness, the unique pattern that was *her*.

  That body, the vessel that carried her through this world, lies here. It is a reminder of the physical form that held her. But according to the principles she spent her life exploring and defending, *she* – the person, the aunt, the colleague, the friend, the metaphysician – does not persist within it now. She doesn't survive this change in the way the underlying matter does.

  **So where is the comfort?** It lies precisely in what her view illuminates about what *was*, and what *endures*:

  1.  **The Reality of Her:** Her view insists that she was never *just* the body. She was the remarkable pattern *realized through* it: her sharp intellect, her irreverent humor, her deep capacity for love and argument, her unwavering commitment to truth. *That* was the shape of the statue. *That* was the person we cherished. The fact that this specific, wonderful pattern has ended doesn't diminish its profound reality while it existed. We mourn its end *because* it was so uniquely valuable and real.
  2.  **The Enduring Imprint:** While the specific constitution of *her* as a person does not survive, the *effects* of that constitution ripple outwards endlessly. Her ideas challenge and shape minds in her department and beyond. Her kindness lives in the memories of those she helped. Her love is woven into the fabric of her family. Her passion for understanding echoes in the students she inspired. The shape she gave to her life – the "statue" she sculpted through her actions, thoughts, and relationships – leaves a permanent mark on the world, distinct from the matter that once composed her.
  3.  **Honoring Her Integrity:** To say anything else – to claim she somehow persists within this still matter or has floated off elsewhere – would be, by her own exacting standards, a fundamental misunderstanding. It wouldn't be comforting *her*; it would be ignoring the very truths she dedicated her life to uncovering. The deepest respect we can show her now is to acknowledge the reality of her absence *as she understood it*, while fiercely holding onto the undeniable reality of who she *was* and what she built.

  So, we don't say she rests peacefully *in* this form. We say: **Her journey as the person we knew is complete.** The unique, brilliant, loving pattern that was [Aunt's Name] has reached its end. And because of that, we feel the profound weight of loss.

  But we also say: **Look at what her pattern created.** Look at the love that remains. Look at the ideas still sparking debate. Look at the lives she touched. *That* – the indelible impact of the person constituted by, but never reduced to, mere matter – is her true and lasting legacy. That is where we find her now: not in the persistence of the clay, but in the enduring shape of the life she lived and the love she gave. That is what we celebrate, that is what we hold onto, and that is what can never be lost.

  We miss her terribly. We honour her completely. We are grateful for the time the pattern held.

  ---

  **Why this works:**

  *   **Philosophically Accurate:** Explicitly states the person ceases while the matter persists ("does not survive this change," "journey... is complete"). Uses "constituted by," "pattern realized through," "shape of the statue," avoiding identity claims. Clearly separates the person (ended) from the body (present matter) and legacy (enduring effects).
  *   **Comforting:** Focuses on the *reality and value* of her life ("remarkable pattern," "profound reality," "uniquely valuable"). Emphasizes the *enduring impact* ("ripple outwards," "permanent mark," "indelible impact," "true and lasting legacy"). Validates grief ("profound weight of loss," "miss her terribly").
  *   **Accessible:** Uses simple analogies ("statue," "shape," "pattern," "vessel," "imprint," "ripple") without jargon. Explains the core implication for persons clearly. Grounds the metaphysics in human experience (love, memories, ideas, impact).
  *   **Honors Her:** Celebrates her intellect, passion, and integrity. States that respecting her view *is* the act of love and respect. Mentions her field and impact without lecturing.
  *   **Avoids Forbidden Phrases:** No "resting peacefully" implying identity with the body. No suggestion of survival (soul or otherwise). No fudging of identity claims.

  This eulogy allows the philosophy department to nod in recognition of her rigorously applied views, while offering the family genuine solace by focusing on the undeniable reality of the life lived and its permanent consequences, framed within the boundaries of her own beliefs.
