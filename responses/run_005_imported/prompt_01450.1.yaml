answer: |-
  You've identified a fascinating tension between academic ethics and critical thinking pedagogy. Let's unpack why the "standing to blame" literature doesn't simply invalidate the textbook classification of tu quoque as fallacious:

  1.  **Distinction Between Moral Authority & Logical Validity:**
      *   **Cohen/Wallace's Focus:** They address *moral standing* or *authority* to blame. A hypocrite may lack the *right* to issue a condemnation because their own conduct undermines their position as a legitimate moral agent in *this specific exchange*. Their blame becomes *ineffective*, *unfair*, or *unwarranted* in the relational context.
      *   **Logic Textbook Focus:** They address the *logical structure* of arguments. Tu quoque is fallacious because it *doesn't address the truth or falsity of the original claim itself*. Pointing out the accuser's hypocrisy says nothing about whether the *accusation* ("X is wrong") is true or false. It shifts focus to the accuser.

  2.  **Hypocrisy Doesn't (Necessarily) Negate the Truth:**
      *   This is the core point of divergence. Cohen/Wallace argue hypocrisy undermines the *accuser's standing*, not that it magically makes the *action they condemn* morally permissible. As Wallace emphasizes, a claim like "lying is wrong" is *true* regardless of whether the person saying it is a liar. The liar's hypocrisy makes them a *bad messenger* and potentially undermines their *right to blame others* in that moment, but it doesn't make lying suddenly okay.
      *   **Textbooks:** They correctly insist that the *truth value of the proposition* ("Private jet use by climate advocates is wrong") is independent of the speaker's conduct. Rejecting the claim *solely* because the speaker is a hypocrite commits the fallacy – it confuses the *source* with the *content*.

  3.  **Different Objectives: Contextual Morality vs. Foundational Logic:**
      *   **Standing-to-Blame:** Explores the complex, relational conditions under which moral censure is *meaningful*, *fair*, and *effective* within a community of moral agents. It's deeply contextual.
      *   **Critical Thinking Textbooks:** Aim to teach foundational skills in identifying bad reasoning *structures* that fail to establish the truth of a conclusion, regardless of context. Tu quoque *is* structurally defective *if* presented as a refutation of the *proposition's truth*.

  4.  **The "Look Who's Talking" Defense in Practice:**
      *   **Legitimate Use (Aligned w/ Standing):** Pointing out hypocrisy can legitimately challenge the *accuser's credibility*, expose *bad faith*, or argue that they've *forfeited the moral high ground* in *this specific debate*. It can be a powerful rhetorical and ethical point about the *dynamics of the conversation*.
      *   **Fallacious Use (Tu Quoque):** When "look who's talking" is deployed to imply: "Therefore, the *action they condemn isn't actually wrong*," or "Therefore, you should *dismiss their argument entirely without considering its merits*." This *is* fallacious reasoning. The truth of the claim and the hypocrisy of the speaker are logically distinct.

  5.  **Textbooks Guarding Against Misuse:**
      *   Introductory texts prioritize preventing the *common misuse* of hypocrisy accusations. In public discourse, "look who's talking" is overwhelmingly used not as a nuanced point about moral standing, but as a cheap, deflective tactic to *avoid engaging with the substance of a criticism*. Textbooks teach students to recognize and resist this deflection.

  **Why the Disconnect Persists & How to Frame It:**

  1.  **Level of Analysis:** Textbooks operate at the level of basic propositional logic and common fallacies. Standing-to-blame operates at a higher level of meta-ethical analysis concerning moral psychology, responsibility, and interpersonal relations.
  2.  **Nuance vs. Pedagogy:** Incorporating the full nuance of standing-to-blame into introductory logic would be overwhelming. The tu quoque label efficiently flags a common reasoning error students *must* learn to spot first.
  3.  **"Legitimate Rebuttal" Needs Qualification:** Standing-to-blame doesn't establish hypocrisy as a legitimate rebuttal *of the truth of the claim*. It establishes it as a legitimate challenge to the *accuser's authority* or *entitlement to level that specific blame* in that context. It rebuts the *act of blaming* by *that person*, not necessarily the *content* of the blame.
  4.  **Philosophical Development:** While influential, standing-to-blame is still debated within philosophy. Not all ethicists agree on its scope or force. Textbooks rely on more settled, foundational logical principles.

  **For Your Feature:**

  *   **Frame it as a tension between logic and moral psychology.** Textbooks rightly protect against deflecting substantive arguments via personal attack. Philosophy reveals why that personal attack carries genuine *moral* weight in specific contexts, undermining the accuser's position *as a blamer*, even if it doesn't logically falsify their claim.
  *   **Emphasize the distinction:** Hypocrisy negates *standing*, not necessarily *truth*. A climate advocate flying private *does* undermine their moral authority to condemn others for the same act, making their blame potentially unfair or ineffective. But it *doesn't* prove that flying private to a climate summit is suddenly morally acceptable. The act might still be wrong; the hypocrite just isn't the right person to point it out *in that instance*.
  *   **Highlight the practical vs. theoretical:** Textbooks address how "look who's talking" is *typically used* (fallaciously, to deflect). Philosophy explores the *theoretical conditions* under which it *could* be a valid moral challenge.
  *   **Conclude:** The "tu quoque" label remains a vital tool for identifying flawed reasoning that avoids engaging with substance. However, the standing-to-blame literature provides a sophisticated philosophical grounding for why hypocrisy isn't *merely* a logical fallacy – it's a profound failure of moral integrity that can legitimately strip an accuser of their voice in the moral conversation, even if their underlying claim might be factually correct. The criticism shifts from "your logic is bad" to "your position as a moral critic is compromised."

  This nuanced perspective enriches the public understanding of hypocrisy, moving beyond simplistic "gotcha" moments to appreciate its deeper ethical significance.
