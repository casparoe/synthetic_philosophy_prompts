prompt: |-
  Jeremy Bentham's unpublished essay "Offences Against One's Self" (written around 1785, but suppressed by him during his lifetime and only substantially published in the twentieth century) argues that the criminal punishment of homosexual acts in Britain rested on nothing but unreasoned antipathy rather than any harm traceable to the principle of utility. Around the same period he was developing the broader argument, later formalized in the Introduction to the Principles of Morals and Legislation, that both "asceticism" and "sympathy and antipathy" are spurious rivals to utility as a standard of right and wrong, and that any pleasure, however socially disreputable, must be weighed in the same coin as any other, along the dimensions of intensity, duration, certainty, propinquity, fecundity, purity, and extent that make up his felicific calculus.

  I was discussing with a couple of friends recently how strange it would be to explain today's creator-economy sex industry to an eighteenth-century interlocutor, and Bentham seemed like the obvious test case, given that he already went out of his way to defend "irregularities of the venereal appetite" that scandalized his contemporaries. Suppose he could be briefed on subscription platforms such as OnlyFans, where an adult performer sells sexually explicit photos and videos directly to paying subscribers, a for-profit intermediary takes a substantial cut and sets its own content and payment rules, and an opaque recommendation algorithm determines which performers and content are even seen. Using only Bentham's own conceptual toolkit — his hostility to asceticism as a first principle, his diagnosis of antipathy as an illegitimate ground for restricting harmless conduct, and the specific dimensions of the felicific calculus — reconstruct the argument he would most plausibly have made about this arrangement. Would he have treated it as simply one more harmless irregularity to be defended against squeamish moralizing, or are there features distinctive to the platform-and-algorithm structure itself, as opposed to the sexual content it carries, that a rigorous application of his own principles would flag as morally significant in ways a glib "Bentham the sexual liberal" reading would miss? Please work through the reasoning he would have had to do, rather than simply asserting a conclusion.
