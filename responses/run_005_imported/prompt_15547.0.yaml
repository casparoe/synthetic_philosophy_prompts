  Here’s a eulogy that honors Walt’s journalistic legacy, acknowledges his later path with honesty using the "falsifiable vs. self-sealing" distinction, and aims to resonate respectfully with both sides of the room:

  **Eulogy for Walt**

  Good morning. For those who don’t know me, my name is [Your Name]. Walt trained me when I was a green reporter, all nerves and notebooks, decades ago. He saw something in me I didn’t yet see in myself, and he taught me what it meant to chase a story with guts and grit. To be asked to speak today by his family is an honor I carry with deep gratitude, and no small amount of humility.

  Walt was a *reporter*. Not just in title, but in his bones. He possessed that rare, essential instinct: a profound, healthy skepticism of the Official Story. He knew power liked to cloak itself in press releases and polished statements. He knew the truth often lay buried beneath layers of obfuscation, waiting for someone stubborn enough, meticulous enough, to dig it out.

  We all remember the legend. The county water contracts in the 90s. Walt didn’t buy the sanitized version handed to him. He smelled a rat. He followed the money. He asked, relentlessly, “Who benefits?” And because he did – because he demanded evidence, chased leads, built a case that *could be tested* against reality – he exposed a web of kickbacks. He held power accountable. That instinct – **the instinct to question, to verify, to demand evidence that could potentially prove you wrong** – that was Walt at his absolute best. It wasn’t cynicism; it was the engine of accountability. It was journalism as a public service.

  That core instinct – the refusal to accept things at face value – never left Walt. It was as much a part of him as his laugh or his relentless energy. In his later years, he turned that powerful searchlight onto other complex, painful events – 9/11, the pandemic. He kept asking the hard questions, chasing leads, looking for patterns. That drive came from the same place that made him a formidable journalist: a deep desire to understand the hidden mechanisms of the world.

  **But here’s the thing about that vital instinct: its power depends entirely on how we wield it.** Walt taught me, and countless others, that the best investigations are *falsifiable*. That means the theories we build must be open to being *tested*. Did the documents hold up under scrutiny? Did the witness accounts corroborate? Could new evidence *disprove* our hypothesis? Watergate wasn't proven because it explained away every contradiction; it was proven because the evidence stacked up, brick by brick, against the denials. A falsifiable theory risks being *wrong* – and that risk is its strength.

  **In his final years, Walt’s focus shifted towards theories that operated differently.** They weren't just complex; they became *self-sealing*. Contradictory evidence wasn’t a challenge to be weighed; it was often absorbed *as proof* of an even deeper, darker conspiracy. The lack of evidence became evidence of the cover-up. The theory couldn't be disproven, only expanded. It was a logic loop, impervious to the very scrutiny Walt had once mastered.

  This shift caused pain. It fractured friendships he cherished. It pained those of us who revered the reporter who built cases brick by evidential brick, to see him embrace frameworks where the bricks became untestable, unfalsifiable. We wrestled with him. We missed the colleague who thrived on the messy, contradictory, *verifiable* truth.

  So, how do we honor Walt today? We honor him by remembering the power and the necessity of that questioning instinct he embodied so fiercely. We honor him by remembering the *method* that made his skepticism so potent: the rigorous demand for testable evidence, the courage to follow facts even when they led away from your initial hunch, the intellectual humility to say, "This doesn't fit; maybe I need to look again."

  We also honor him by recognizing the totality of the man. The brilliant investigator *and* the loyal friend. The mentor who shaped careers *and* the father, grandfather, and online companion who connected deeply with people. His later pursuits, however we view them, stemmed from that same deep-seated drive to uncover what he believed was hidden – a drive that, when channeled through the discipline of falsifiable evidence, made him a force for genuine good.

  Walt’s legacy isn’t simple. It’s a challenge. It challenges us to cherish that essential skepticism – the refusal to be spoon-fed narratives. But it also challenges us to wield that skepticism wisely, with the tools he once mastered so well: rigor, verification, and the courage to let evidence, not just conviction, guide us. To build cases that can be tested, not just castles that can only be defended.

  He taught us to dig. He taught us to question. He taught us to be brave. Even when his own path became difficult for us to follow, that core – the relentless seeker, the man who wouldn’t take ‘because we said so’ for an answer – never changed.

  Rest easy, Walt. Thank you for the lessons, the fights, the stories, and the unwavering belief that the truth, however messy, was always worth chasing. We’ll keep digging. We’ll keep questioning. We’ll try to do it with the rigor you showed us how. We will miss you terribly.

  ---

  **Why this works for both audiences:**

  1.  **Colleagues/Nodding Along:** Explicitly names and praises his *method* (falsifiable investigation, evidence, testing) as his journalistic peak. Clearly identifies the *problem* in his later pursuits not as "asking questions" but as abandoning that method for "self-sealing" logic. Uses Watergate (journalism's gold standard) as the positive example. Acknowledges the pain and fracture caused without excusing the content of the theories. "We wrestled with him" validates their experience.
  2.  **Family/Online Friends:** Avoids dismissive terms like "crazy" or "delusional." Attributes his later pursuits to the *same core instinct* that made him great ("drive to uncover what he believed was hidden," "stemmed from that same deep-seated drive"). Focuses on his *intent* (seeking truth) rather than judging the *validity* of the specific theories. Emphasizes connection ("loyal friend," "father," "online companion," "connected deeply"). "However we view them" acknowledges differing perspectives without confrontation. The core message honors his character and drive.
  3.  **The Distinction Does the Work:** It doesn't just mention "asking questions." It defines *how* the *right kind* of questioning works (falsifiable, testable, open to disproof) and contrasts it explicitly with the *problematic kind* (self-sealing, immune to disproof). It links the *good* directly to his journalistic triumphs and the *bad* to the breakdown in his later methods and relationships. It makes the point intellectually honest and specific.
  4.  **Tone:** Respectful, mournful, and ultimately unifying in celebrating his core character and impact. Avoids lecturing ("We honor him by remembering..." not "You should remember..."). Focuses on *his* journey and *our* shared loss and challenge. Ends on warmth and appreciation.
  5.  **Length:** Structured to be read aloud in approximately 5 minutes, allowing for pauses and emotion.

  Deliver it with the respect, honesty, and warmth Walt deserved, and the care his family deserves on this difficult day. Good luck.
