answer: |-
  That's an excellent question that cuts to the heart of Strawson's argument. Your instinct is understandable – indeterminism *feels* like it should break the regress by introducing a point of "uncaused causing." Strawson, however, argues forcefully that introducing indeterminism doesn't solve the problem of **Ultimate Moral Responsibility (UMR)** and actually makes things *worse* for attributing responsibility. Here's a breakdown of his reasoning:

  1.  **Recap of the Basic Argument's Core (UMR):**
      *   To be *ultimately* morally responsible for an action (A), you must be responsible for being the *kind of person* who would choose to do A in those circumstances.
      *   To be responsible for being that kind of person (possessing character C1), you must have *chosen* or *formed* C1.
      *   But to make that choice/form C1 responsibly, you must have done so using some *prior* set of principles, reasons, character traits, or preferences (C2).
      *   To be responsible for *having* C2, you must have chosen or formed C2 using some *even earlier* C3.
      *   This regress continues infinitely. Since you cannot be the ultimate cause of your very first C (your initial mental constitution), you cannot be ultimately responsible for anything that flows from it.

  2.  **Why Indeterminism Doesn't Break the Regress: The "Arbitrariness" Objection**
      *   **The Crucial Point:** Strawson argues that introducing an *undetermined* event (a random or uncaused element) into the chain leading to a choice **does not and cannot** make that choice something for which *you* are *ultimately* responsible. Why?
      *   **Lack of Ownership/Control:** If an event (like a specific thought, impulse, or the final "tipping point" of a decision) is genuinely undetermined, it means it happens *without being sufficiently caused by prior states of you and the world*. It's fundamentally *arbitrary* or *random* relative to your prior mental state.
      *   **Responsibility Requires "Mine-ness":** For you to be responsible for a choice, that choice must *issue from you*, be *expressive of you*, be *attributable to you as an agent*. If a key element in the choice is undetermined, it means that element *doesn't* come *from you*. It just *happens to you*.
      *   **Analogy:** Imagine your decision is like the result of a coin flip happening inside your brain. If the flip is truly random (undetermined), the outcome isn't *your doing*. It's luck. You didn't *make* it land heads or tails; it just happened. How could you be *morally responsible* for the outcome of a random coin flip? Similarly, an undetermined mental event is like a random neural spark – it might influence the outcome, but it doesn't originate *from you* in the way required for UMR.
      *   **Breaking the Chain ≠ Creating Responsibility:** While indeterminism *breaks* the deterministic causal chain, it doesn't *create* a point of *self-origination*. It creates a point of *no-origination* or *external-origination* (if we think of randomness as coming from "outside" the chain of prior causes). An uncaused event isn't caused *by you*; it's simply uncaused. Responsibility requires the event to be caused *in the right way by the agent*, not just uncaused.

  3.  **Why Indeterminism Might Be *Worse* for Responsibility (The "Luck" Objection):**
      *   **Determinism vs. Luck:** Under determinism, your choices are *determined* by prior states that constitute *you* (your character, values, desires, reasons). While this doesn't grant UMR (due to the regress), it at least means the choice *stems from who you are*. There's a connection between your character and your actions. Responsibility (if it existed) could be attributed to *that person*.
      *   **Indeterminism Introduces Luck:** Under indeterminism, the crucial undetermined element introduces *brute luck* into the process. The choice isn't *fully* determined by who you are up to that moment. There's a random "swerve" or "hiccup."
      *   **Alienation:** This randomness makes the choice *alien* to you. Part of the reason you chose A rather than B is due to pure chance, not your character, reasoning, or values (which only influenced the *probabilities*, not guaranteed the outcome). How can you be held *fully and ultimately* responsible for a choice where luck played the decisive role? It severs the essential link between your character and the specific action.
      *   **Control:** Responsibility requires control. Indeterminism, by introducing randomness, *reduces* your control over the outcome compared to determinism. In determinism, your character fully controls the outcome (though you didn't control your character). In indeterminism, *neither* your prior character *nor* you "as agent" in the moment fully controls the outcome – randomness does. This makes responsibility attribution even *less* plausible.
      *   **Strawson's Punchline:** "Indeterminism does not give you the control you want and need for ultimate responsibility. It merely substitutes *blind chance* for *deterministic inevitability*, and chance is no basis for responsibility." (Paraphrase).

  4.  **Addressing Your Instinct ("Breaking the Regress"):**
      *   Strawson would argue that introducing indeterminism doesn't *break the regress in a way that helps UMR*. The regress is about *self-creation*: to be UMR for X, you must be UMR for the causes of X, and ultimately UMR for your initial self. Indeterminism doesn't allow you to *create yourself*.
      *   Imagine the undetermined event happens at step C2 forming C1. You still weren't UMR for *having* C2 in the first place (the prior state that generated the undetermined event). The regress simply jumps back to "Who is responsible for C2?" The randomness might mean C1 wasn't *determined* by C2, but it doesn't mean *you* were the ultimate author of the randomness or the outcome. The buck doesn't stop with *you*; it stops with *randomness*.

  **In Essence:**

  Strawson's argument is that **Ultimate Moral Responsibility requires impossible self-creation.** Indeterminism doesn't provide self-creation; it only provides *randomness*. Randomness doesn't solve the problem of ownership or grounding responsibility *in you*. It simply replaces one type of non-responsibility (being determined by prior causes you didn't ultimately choose) with another, arguably worse, type (being partially determined by random events you didn't cause or control). The core requirement – that *you* must be the ultimate, responsible source of your character and choices – remains unmet under both determinism *and* indeterminism. The regress persists because you never get to the point where *you* create the initial "you" responsible for starting the chain, and adding randomness doesn't magically create that self-originating "you" – it just injects arbitrariness into the chain you didn't originate.
