  So my chavruta and I have been slowly working through the Guide for the Perplexed over Zoom (like a page a week, don't judge), and we just got to III:32, where Rambam lays out his big theory of korbanot: God basically let Bnei Yisrael keep sacrificing because that's just what everyone did back then, and yanking it away cold turkey in favor of something like pure prayer would've been too much too fast for people to handle psychologically. My chavruta thinks the argument is pretty much airtight, but it's been bugging me, and it's actually become kind of urgent because I got roped into giving the dvar torah for Vayikra next month and I don't want to just recite the standard "training wheels for pagans" line without actually having wrestled with it myself first.

  Here's my half-formed worry: doesn't this whole accommodation story get complicated once you look at who's already sacrificing earlier on in Tanakh, before there's any idolatry around for God to be weaning anyone off of? Can you give me one specific, fleshed-out example — an actual episode or set of verses, not just the abstract "sacrifice predates idolatry" slogan — where this problem really bites? And since I doubt Rambam (or a good defender of his) would just fold, can you also game out the single most natural comeback he'd have, and tell me honestly whether it actually rescues the theory or whether the tension survives anyway?
