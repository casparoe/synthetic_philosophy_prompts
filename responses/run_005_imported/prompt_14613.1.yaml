answer: |-
  Here’s the strongest case for resolute choice, framed as a radical critique of synchronic rationality—not just defending resoluteness, but exposing the *pathology* of moment-by-choice evaluation:

  ### Core Argument: Synchronic Rationality is Self-Undermining
  The objection that "choosing against current preferences is irrational" assumes rationality must be judged *solely* at isolated choice-nodes. But this synchronic view **destroys the possibility of intentional agency over time**. It reduces you to a passive conduit of shifting preferences, unable to execute plans that require temporary sacrifice for greater goals. Resoluteness isn’t irrational—it’s the *only* way to be a temporally extended agent rather than a myopic preference-satisfier.

  ### The Case (in 3 Steps):
  1. **Agency Requires Temporal Binding**  
     Rational agency isn’t just about satisfying preferences—it’s about *shaping your future* through plans. When you resolve at t0, you’re not ignoring preferences; you’re *exercising a higher-order preference for plan-following* to avoid predictable future regret (e.g., money-pump losses). Refusing to deviate at tn isn’t "irrational"; it’s *enforcing your sovereignty as a temporally extended self*. Synchronic evaluation fractures you into disconnected time-slices, each "rational" but collectively self-destructive.  

  2. **Synchronicity Enables Exploitation**  
     Sophisticated choosers "solve" money pumps by refusing beneficial trades (e.g., declining the first trade in A>B>C>A). But this makes them *vulnerable to extortion*: a devilish counterparty can charge them to *not* offer the next trade in the cycle. Resolute choosers, by contrast, accept the first trade and lock in gains because they know they’ll enforce the plan. Synchronic rationality *rewards paralysis*; resoluteness enables active gains.  

  3. **The Last Step is a Mirage**  
     The "irrationality" at the final choice-node is an illusion created by *judging the act in isolation*. Consider:  
     - **Analogy**: Climbing a ladder. Removing the lowest rung once you’re at the top seems "irrational" if judged in isolation (you’re destroying useful property!). But it’s rational *as part of the descent plan*.  
     - **Decision-Theoretic View**: At tn, your "preference" to deviate only exists *because* you’re at tn. But reaching tn depended on your prior resolution. Evaluating the choice while ignoring this context is like blaming a firefighter for breaking a door *after* they’ve already entered a burning building to save a child.  

  ### Rebutting the "Full Stop" Objection
  - *"But preferences at tn are all that matter!"*:  
    Then you endorse a theory where an agent who pays $1,000,000 to avoid a pinprick tomorrow is "rational"—because *at t0*, they prefer paying. Synchronicity forces absurdities by denying that past/future states are part of rational evaluation.  
  - *"Resoluteness violates dominance!"*:  
    Dominance applies to *acts*, not abstract preferences. The resolute act-sequence (e.g., [Trade A for B, then B for C]) *dominates* the synchronic sequence (e.g., [Refuse all trades]) in overall outcomes. Isolating the final step is cherry-picking.  

  ### Why This is Stronger Than Standard Defenses
  - **Not Pragmatic**: Unlike McClennen, this isn’t "resoluteness avoids exploitation." It’s that synchronic rationality *fails as a normative ideal* because it prohibits agency.  
  - **Not About Regret**: It’s not that resoluteness "feels better," but that it’s *constitutive of rational planning*.  
  - **Radical Implication**: If synchronicity is self-undermining, then rationality *must* be diachronic. The resolute chooser isn’t "bending" rationality—they’re fulfilling its deepest requirement: coherence *over time*.  

  ### Punchline for Your Seminar
  The "fishy" feeling arises from a **category error**: mistaking *part* of a plan (the final choice) for the *whole*. Synchronic rationality is like judging a novel by reading one sentence—it misses the meaning of the entire work. Resoluteness isn’t irrational; it’s the only way to be an author of your life rather than a critic of disjointed moments.
