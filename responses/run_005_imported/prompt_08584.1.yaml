  On retroactive punishment: Bentham despised retroactivity. He called judge-made law "dog law" because it punishes without prior rules. So in the grudge informer case, he'd oppose punishing the wife under retroactive law. That aligns more with Fuller's concerns about legality. But Bentham's solution might be different—maybe pass a new law prospectively but not punish past acts.

