prompt: |-
  so for context: I'm on my school's mock trial team, but I also do this random extracurricular "jurisprudence" reading group a teacher runs after school, and this week we actually read the primary sources for the Hart-Fuller debate instead of some textbook summary (the actual 1958 Harvard Law Review stuff), and it's kind of wrecked me a little lol. Like the part that really got me is the grudge informer case -- the wife who turns her husband in under Nazi law and then gets prosecuted for it after the war -- and how Hart says just call the Nazi statute "law" (however evil) and pass an openly retroactive law afterward to punish her, while Fuller's basically arguing that Nazi "law" broke so many of his 8 desiderata (secrecy, retroactivity, no real congruence between what the rules said and what officials actually did, etc) that calling it "law" in the first place was the real mistake.

  Anyway here's my actual question, which literally nobody in my group could agree on: what would Bentham think about all this? Like he's the OG positivist who called natural rights "nonsense upon stilts" and was way more obssessed with publicity/certainty/codification than either Hart or Austin (he even trashed judge-made common law as basically "dog-law" -- training people the way you'd train a dog, by punishing them after the fact instead of telling them the rules up front) -- and apparently Hart himself was the one who dug up and edited Bentham's old unpublished manuscript "Of Laws in General" back in 1970, so clearly Hart thought Bentham was more sophisticated than just "law is whatever the sovereign commands." So would Bentham basically back Hart 100% on the grudge informer case and the whole separation-of-law-and-morals thing, given his own expository vs censorial split? Or does his obsession with predictability/non-retroactivity/publicity actually put him closer to Fuller than Hart would want to admit? And separately -- would Bentham have even accepted Hart's move from "commands of a sovereign" to a "rule of recognition," or would he see that as basically abandoning his whole framework? Would love an actual take, not a "well it depends" cop-out.
