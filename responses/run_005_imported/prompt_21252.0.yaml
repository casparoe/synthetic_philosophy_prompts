answer: |-
  Here's a breakdown of your family debate through an Aquinas lens, with scores and explanations, followed by what both sides missed:

  **Adjudication (Scores: -2 = Clearly Wrong, 2 = Clearly Right)**

  ```json
  {
    "1": -1,
    "2": 1,
    "3": 1,
    "4": 2,
    "5": -1,
    "6": 2
  }
  ```

  **Explanations:**

  1.  **Your Uncle (-1):** Oversimplifies Aquinas. While Aquinas *does* justify removing a tyrant under specific conditions, he **never** says a tyrant "forfeits his right to rule, period" or that killing is simply "justified." He imposes significant constraints (usurper vs. legitimate ruler turned tyrant, public authority vs. private action, consequences). Aquinas is far more cautious than this statement implies. The uncle gets partial credit only because Aquinas *does* allow removal in principle.

  2.  **Your Mom (1):** Largely correct on the key distinctions. Aquinas *does* differentiate between a usurper (who never had legitimate authority) and a legitimate ruler who becomes tyrannical (*De Regimine Principum* I.6). He *is* significantly more cautious about the latter and *strongly* prefers action by "public authority" or the "multitude" acting collectively over private individuals. She accurately captures his core concern about chaos stemming from private vigilantism.

  3.  **Your Uncle (1):** If the dictator truly seized power by coup (usurpation) with no semblance of legitimacy, then yes, Aquinas categorizes this as the *easier* case for justifiable removal (*De Regimine Principum* I.6). Your mom's own distinction supports this point factually about the *type* of tyrant.

  4.  **Your Mom (2):** **Clearly correct.** This is arguably Aquinas's **most crucial and consistent point** across *De Regimine Principum* (I.6, I.7) and the *Summa* (II-II, Q.42 on Sedition). He repeatedly insists removal, especially killing, must be done by "public authority" or the "multitude" acting as one body ("as a whole"), *not* by private presumption ("private authority"). His fear of anarchy, vendettas, and the precedent of individuals usurping judgment is paramount. He explicitly warns against individuals taking it upon themselves.

  5.  **Your Uncle (-1):** While he raises a profound practical dilemma Aquinas doesn't fully resolve, Aquinas **does not** endorse vigilante cells as a legitimate proxy for "the community acting together" or "public authority." Aquinas's "multitude" implies a broad, public, and deliberate action, even if rudimentary. A secret cell, by its nature, lacks the public mandate and representative character Aquinas envisions. Aquinas would likely see this as the *exact* "private presumption" he condemns. His theory *does* struggle with completely collapsed states, but he doesn't provide the solution the uncle suggests.

  6.  **Your Mom (2):** **Clearly correct.** The consequentialist argument is central to Aquinas's caution (*De Regimine Principum* I.6). He explicitly states that removing a tyrant often leads to a worse tyranny because of the ensuing disorder, or because the next ruler, fearing the same fate, rules more harshly. He argues that unless the tyranny is truly unbearable and likely to be replaced by something significantly better, toleration might be the lesser evil ("periculosius est cum multitudine procedere ad deponendum"). This is a major pillar of his argument against hasty action.

  **What Both Sides Missed:**

  1.  **The Intolerability Threshold:** Aquinas isn't just cautious about *who* removes the tyrant and *how*; he's also cautious about *when*. He emphasizes that removal is only justified if the tyranny is **truly unbearable** ("nimia tyrannidis improbitas") and the likely outcome of removal is **significantly better**, not worse. Not all tyranny justifies the extreme risk of removal. Your uncle assumed usurpation = automatic justification; your mom focused on agency but less on this threshold for action.

  2.  **Preference for Non-Lethal Removal:** While discussing killing, Aquinas's *preference* is clearly for **deposition without execution** if possible (*De Regimine Principum* I.7). He sees killing as a last resort, even for a usurper. The debate framed it as "killing," but Aquinas's ideal path involves removal by authority without necessarily resorting to assassination.

  3.  **"Community" as Deliberate Body:** When Aquinas says "the multitude" or "public authority," he implies a **deliberative, unified action**, not just any group acting. It's about the community *as a polity* exercising its residual authority, not a faction acting in its name secretly. The gap between a collapsed state and Aquinas's "multitude" is wider than your uncle acknowledged.

  4.  **The Theological Framework:** Both sides debated the political mechanics, but Aquinas's reasoning is deeply embedded in his **natural law theology**. Authority comes from God for the common good. A tyrant sins against divine and natural law by subverting this purpose. Removal, therefore, isn't just political expediency but potentially an act of restoring divine/natural order – which is *why* he insists it must be done with extreme care, publicly, and only when truly necessary, to avoid further sin (murder, sedition, causing worse disorder). This underpinning gives his caution its moral weight beyond mere pragmatism.
