  So this happened a couple weeks ago when a few of us were hanging out at my friend Nina's place, and I still can't stop thinking about it. Nina was talking about her boyfriend and at some point she just said, totally straight-faced, 'he's lying about the money, but I don't believe it.' Our friend Marcus laughed and said that sentence doesnt actually make sense -- if you don't believe something then you don't think it, full stop, and she was just being dramatic. Nina got a little defensive and said no, it makes perfect sense: the evidence-following part of her brain has done the math and landed on 'he's lying,' but there's some other part of her, the part that actually runs how she feels and acts, that hasn't caught up yet -- and that gap between the two IS what believing something even means, over and above just being intellectually convinced of it. Then, kind of to back herself up, she added 'and I'm not just guessing either, I've literally seen the bank statements, I know he's lying.' Marcus jumped on that right away -- he said if you know something then you for sure believe it, that's like the bare minimum of what knowing even means, so now she wasn't just saying something poetically weird, she'd straight up contradicted herself in one breath. Nina came back with: people say versions of this to each other constantly and nobody's ever confused about what's meant, no one hears 'I know it deep down, I just don't believe it' and goes 'wait, what?' -- it lands immediately as a sad, true thing to say, and if it were a genuine contradiction it should sound like actual gibberish, the way 'the ball is entirely red and entirely not red' does, and it obviously doesn't sound like that. I looked it up afterward and apparently this shape of sentence has an actual name in philosophy, 'Moore's paradox,' which made me want to actually work out who had the better of this argument instead of just filing it away as a funny thing that happened at Nina's table, since it's honestly been bugging me pretty consistantly since.

  Could you go through their exchange step by step and say who was more right at each specific point, not just hand out an overall winner -- Marcus's opening claim that the sentence is nonsense, Nina's split-mind defense, Marcus's 'but you just said you KNOW it' comeback, and Nina's 'everyone understands it fine' comeback? I'm especially curious whether Marcus's contradiction charge actually survives Nina's points or just gets restated in a new form, and whether Nina's 'people understand it immediately' comeback really proves what she thinks it proves. Finish with a short bit on what you think both of them are missing that would've actually settled things between them.
