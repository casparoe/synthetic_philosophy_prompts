  2. **Quine's natural kinds**: This solution rejects the equivalence of the two formulations by appealing to natural kinds. Only observations of ravens are relevant because the hypothesis is about a natural kind.

     Justification: It successfully explains why we don't accept a white shoe as confirmation by limiting the domain of relevant evidence to the natural kind in question, but it does so by introducing a metaphysical concept (natural kinds) that may be controversial and not entirely independent of background knowledge.

  3. **Goodman's projectibility**: The predicates "raven" and "black" are projectible, while "non-raven" and "non-black" are not. Therefore, only an instance of a raven that is black confirms the hypothesis.

     Justification: It provides a clear criterion (projectibility) to block the paradox, but the criterion itself is not without problems (e.g., defining projectibility) and may seem ad hoc.

