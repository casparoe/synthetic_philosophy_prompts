  D: Puccetti (1) - the two-persons view is outdated and doesn't align with the lived experience of split-brain patients.

  But note: Pinto et al. is a newer and somewhat controversial view. Some researchers still favor dual consciousness. However, for the purpose of the novel, Pinto's unity model might be more original and less cliché.

