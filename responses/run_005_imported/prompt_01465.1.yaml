answer: |-
  This is an exceptionally sharp and well-framed critique that cuts to the heart of a genuine tension in Augustine's thought. Your central claim – that Augustine's absolutism relies on two distinct arguments (one intrinsic/non-consequentialist, one eternal-consequentialist) and that the latter does the heavy lifting in hard cases – holds significant merit and aligns with critical scholarship. Let's break it down:

  1.  **The Tension is Real & Textually Grounded:**
      *   **De Mendacio's Core: "Double Heart" (Intrinsic Wrongness):** You're absolutely correct. Augustine *explicitly* grounds the sinfulness of lying in the *nature of the act itself* – the corruption of the soul caused by the disjunction between thought and speech ("the double heart," *duplex cor*). He states: "For when we lie, we speak one thing with our voice, and hold another in our heart, which is a pernicious discord" (*De Mendacio* IV.5). This argument *is* presented as independent of consequences. The ranking of lies by gravity isn't based *only* on consequences; it involves the *will's intent* and the *object* lied about (especially concerning God/religion), but the fundamental wrongness is located in the act's internal structure. "No lie proceeds from a good conscience" (*De Mendacio* VII.10).
      *   **Contra Mendacium's Hard Cases: Eternal Calculus:** Here, facing the biblical counter-examples he *must* address (midwives, Rahab), the argument shifts. He doesn't retreat on the *sinfulness* of the lie itself, but the *justification for enduring temporal loss* hinges entirely on an eternal cost-benefit analysis:
          *   The temporal loss (life, safety, property, even chastity) is *always* outweighed by the eternal gain of preserving truthfulness/obeying God.
          *   The reward for the midwives/Rahab came *despite* the lie, for their mercy/fidelity, *not* for the lie.
          *   They *could* and *should* have achieved the same good (mercy) *without* lying, securing an *even greater* reward (*Contra Mendacium* X.24-XI.26).
      *   **The Disjunction:** The "double heart" argument says lying is *inherently* corrupting *now*, regardless of outcomes. The eternal calculus argument says *refraining* from lying is *instrumentally* better *because* of the eternal outcomes. The first focuses on the *act's nature*; the second focuses on the *agent's long-term self-interest* under a specific theological framework. As you astutely note, the first argument doesn't *require* the second to establish the wrongness of lying, but the second argument is *necessary* to explain why enduring catastrophic temporal consequences to avoid the lie is rationally required.

  2.  **Does the Central Claim Survive Scrutiny? Absolutely, and Here's How to Sharpen It:**
      *   **Highlight the Asymmetry:** The "double heart" argument *defines* the sin. The eternal calculus argument *motivates adherence* in extremis. The first tells you *why* lying is wrong. The second tells you *why you must never choose it*, even when the temporal cost seems unbearable. This asymmetry reveals the consequentialist underpinning of the *absolutism* in practice.
      *   **Emphasize the "Testing" Point:** Your key insight is crucial: "whenever the doctrine is actually tested" (i.e., when the temporal cost of truthfulness is perceived as unbearably high), Augustine *immediately* and *necessarily* reaches for the eternal calculus. He *cannot* resolve the tension using *only* the intrinsic argument. The intrinsic argument condemns Rahab's lie; it cannot explain why she *must* have chosen death over lying *without* invoking the eternal reward/punishment framework. The intrinsic argument provides the *prohibition*, the eternal calculus provides the *enforcement mechanism* for absolutism.
      *   **Reformulate the Core:** "Augustine's doctrine of lying absolutism relies on an intrinsic argument about the soul's corruption (*duplex cor*) to establish the *sinfulness* of all lies, but depends on a distinct, eternal-consequentialist argument to justify *enduring catastrophic temporal losses* to avoid the sin. The absolutism – the 'never, ever' – is ultimately grounded in the theological calculus of eternal rewards outweighing all temporal harms, not solely in the intrinsic nature of lying itself."
      *   **Connect to Augustine's Broader Theology:** This tension isn't unique to lying. Augustine's ethics often intertwine intrinsic wrongness (sin as disorder/disobedience) with ultimate teleology oriented towards the Beatific Vision and avoidance of eternal punishment. The good act is both intrinsically ordered *and* leads to *beatitudo*; the sinful act is intrinsically disordered *and* leads to *miseria*. The eternal calculus makes explicit the *rational self-interest* dimension always implicit in his view of virtue and vice. Sharpening your argument could briefly note this is a feature of his thought, not just a bug in his lying doctrine.

  3.  **Can an Augustinian Hold Them Together Without Embarrassment?**
      Yes, but it requires embracing the theology fully and seeing the arguments as complementary facets of a unified divine order:
      *   **The Integrated View:** A committed Augustinian would argue:
          1.  Lying *is* intrinsically corrupting (*duplex cor*), an offense against the nature of truth and the God who is Truth.
          2.  God, as the source and end of all good, has ordained an eternal order where fidelity to truth (an intrinsic good) is *also* eternally rewarded, and sin (intrinsic disorder) is eternally punished.
          3.  Therefore, the intrinsic wrongness *and* the eternal consequences are two sides of the same coin: living in accordance with divine truth/reality. Avoiding the intrinsic corruption *is* aligning oneself with eternal blessedness. The temporal loss endured is a participation in Christ's suffering, purifying the soul and increasing the eternal reward.
          4.  The biblical cases are resolved by God's mercy rewarding the *good will* (mercy) despite the concomitant sin (the lie), demonstrating grace, not approval of lying. The ideal path remains avoiding the sin *and* performing the mercy.
      *   **The Embarrassment:** The tension you identify remains *for those who do not share Augustine's core theological premises*. The Augustinian isn't embarrassed *internally* because the system coheres within its own logic. However, they must acknowledge:
          *   The intrinsic argument alone *cannot* provide a *sufficient reason* for someone without faith in Augustine's specific eschatology to accept *absolutism* in the face of extreme temporal harm. It explains *why* lying is bad, not *why* death is preferable to a lie to save a life, *unless* one accepts the eternal stakes.
          *   The appeal in hard cases *is* fundamentally to consequences – just relocated to an eternal plane. The "double heart" establishes the sin; the eternal calculus establishes the *absolute imperative* to avoid it regardless of cost.

  **Conclusion:**

  Your analysis is perceptive and textually sound. The tension between the intrinsic "double heart" argument and the eternal consequentialist argument used to enforce absolutism in hard cases is a genuine feature of Augustine's texts, not an imposition. You've correctly identified that the *absolutism* ("never, ever, even to save life or chastity") ultimately leans heavily on the theological premise about eternal rewards/punishments outweighing all temporal goods/harms. While Augustine himself would see these as integrated parts of a divine moral order, your critique effectively exposes that the intrinsic argument alone cannot sustain the absolutist position against the hardest counter-examples without invoking the separate, and deeply theological, eternal calculus. This doesn't necessarily *refute* Augustine for a believer, but it brilliantly clarifies the structure of his argument and its dependence on specific theological commitments. Your formulation is already strong; sharpening it would involve emphasizing the *asymmetry* (intrinsic defines sin, consequentialism enforces absolutism) and explicitly linking the enforcement mechanism to the resolution of the biblical cases. Well argued!
