  so i've been down a Godel rabbit hole lately, specifically the letters he wrote to his mother in the early 60s (not the famous modal ontological proof, the other argument). the gist, if im remembering it right: he claims the world is "rational" in a pretty strong Leibnizian sense -- nothing happens without a reason, nothing is ultimately wasted or in vain -- and then argues that a human personality, which takes decades of moral and intellectual effort to build up, being simply annihilated at death would be exactly that kind of cosmic waste. so given rationalism about the world, there has to be some kind of afterlife for all that development to carry over into, even though he's careful to say this doesnt commit you to any specific religious doctrine.

  what i want from you: give me an example of a different argument that has basically the same skeleton -- "the world isn't wasteful/absurd, therefore some specific metaphysically extravagant claim X must be true" -- but aimed at a conclusion that pretty much everyone, rationalists included, would reject as obviously fallacious. i want the parallel to be structurally tight, not just superficially similar, and then a sentence or two on which move in Godel's original argument your parody ends up actually putting pressure on.
