  For the theoretical argument, I need to tackle the "why isn't cheap talk sufficient" question. The answer lies in conflicts of interest between signalers and receivers. Also, I should explain why the absolute cost interpretation persists despite Grafen's work—probably because it's more intuitive and Zahavi's examples are spectacularly costly.

  Empirical examples are tricky. Peacock trains seem obviously costly, but I should point out that while they're expensive to produce, the maintenance costs for high-quality peacocks might be relatively lower. For stotting, the key is the differential cost: a weak gazelle would pay a higher survival cost for stotting than a healthy one.

