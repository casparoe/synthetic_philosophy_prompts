  First, I need to contrast Condorcet's core principles with futarchy's mechanics. Condorcet cared about voter competence, independence, and sincere voting. His jury theorem shows that under these conditions, majority decisions become more reliable as group size increases. But futarchy replaces voting with betting markets where traders profit by predicting outcomes accurately. 

