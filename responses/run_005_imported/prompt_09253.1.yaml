  Here’s a warm, heartfelt toast weaving in the "moral trade" concept subtly, focusing on love and mutual respect, not transaction:

  **(Raise glass, warm smile, genuine tone)**

  "Hi everyone. For those who don’t know me, I’m [Your Name], [Sister's Name]’s incredibly proud, slightly intimidated-by-her-intellect, younger sibling. Three weeks ago, I found out I was giving this toast... and three weeks ago, my moral uncertainty seminar covered this fascinating philosopher, Toby Ord. Bear with me – I promise this isn’t a lecture! He talked about something called ‘moral trade’. The simple idea that people who see the world *very* differently can still find ways to make each other's lives *better*, according to their *own* deeply held values. Not by compromising those values, but by understanding what truly matters to the other person.

  **(Shift focus to the couple, soften tone)**

  "And honestly? The moment I heard it, I didn't think of some abstract ethical puzzle. I immediately thought of [Sister's Name] and [Groom's Name]. Because watching the two of you navigate your differences hasn't been about winning arguments or demanding surrender. It’s been a masterclass in seeing the *person* behind the perspective. In understanding that love isn't about erasing who you are, but about creating space for both of you to flourish *as* yourselves.

  **(Give concrete, warm examples)**

  "[Sister's Name], your passion for animal welfare is a core part of your moral compass – it’s fierce and beautiful. [Groom's Name], you might not share every detail of that view, but you've seen how vital it is to *her*. Funding those donations? That wasn't just generosity; it was you speaking *her* language of care. And [Sister's Name], those Thursday poker nights? They might not be your cup of tea, ethically speaking, but you recognized they’re part of [Groom's Name]'s rhythm, his connection with friends. Letting go of that grief wasn't giving up a principle; it was giving *him* the gift of understanding, in *his* language.

  **(Connect back to love & marriage, emphasize warmth)**

  "This isn't some cold deal, ticking boxes on a spreadsheet. What Toby Ord calls a 'moral trade,' I just see as... **love in action.** It’s the quiet, daily choice to say, *'Your values matter to me because* you *matter to me. Your happiness is part of my happiness.'* It’s building a shared world where both of you feel seen, respected, and supported in what you hold dear, *especially* when you hold different things dear. That’s not transaction; that’s the profound, deeply moving foundation of a true partnership.

  **(Conclude with heartfelt wishes)**

  "So today, as you stand here surrounded by love – from philosophers who definitely get the reference **(small chuckle, glance towards cohort)** and family who just get *you* – we celebrate not just your union, but the incredible way you’ve already built it. You haven’t found common ground by sacrificing your selves; you’ve built *new* ground, together, brick by loving brick, understanding by generous understanding. It’s a rare and beautiful thing.

  **(Raise glass higher)**

  "To [Sister's Name] and [Groom's Name]: May your marriage forever be a testament to the power of seeing each other truly, loving each other deeply in your own unique languages, and finding endless ways to make each other's world brighter by your own lights. Cheers to you both!"

  **Key elements addressed:**

  1.  **Warmth Over Coldness:** Focused on "love," "understanding," "respect," "seeing the person," "gift," "profound partnership." Framed actions as expressions of care, not contractual obligations.
  2.  **Accessibility:** Explained "moral trade" simply without jargon ("people who see the world differently... make each other's lives better by their own values"). Used relatable metaphors ("speaking her language," "love in action," "building new ground").
  3.  **Subtle Reference:** Named Toby Ord and "moral trade" explicitly once, early on, for the philosophers. The rest of the description avoids the term but clearly conveys the concept through the examples and explanation. The cohort will absolutely make the connection.
  4.  **Concrete Examples:** Used the specific, personal examples provided (vegetarianism/donations & poker nights) to illustrate the abstract concept warmly and relevantly.
  5.  **Focus on Love & Partnership:** The core message is about their unique, loving bond built on mutual respect for differences. The "trade" concept is the *lens* to view their *love*, not the definition of it.
  6.  **Tone:** Heartfelt, sincere, celebratory, with just one small, gentle chuckle to acknowledge the cohort. Avoids being overly academic or jokey.
  7.  **Length:** Structured to flow naturally within a 3-minute spoken timeframe.

  This toast celebrates their specific dynamic in a way that honors both their intellectual depth and the genuine warmth of their relationship, making the philosophical concept serve the emotion of the day.
