  ok so my friend and i got into a two hour argument last night that neither of us won. shes trying to decide between two totally different job offers and kept saying "there's no way to know which one is actually better," and i said maybe that's the point -- maybe theyre not comparable in the way where one option is secretly better and we just dont know which, like Ruth Chang's "parity" idea, a real fourth relation beyond better/worse/equal. she said that's overcomplicated, its just garden-variety vagueness (like whether someone counts as "tall"), no need for some new primitive relation. where we both got stuck was Chang's small-improvement move -- if you sweeten one option slightly and the comparison still feels like a toss-up instead of flipping in its favor, that's supposed to rule out plain vagueness too, not just rule out equality. neither of us could reconstruct a good vagueness-theorist comeback to that on the spot (i vaguely remember someone, maybe Broome, having one).

  can you write a dialogue between a Chang-style parity theorist and a vagueness theorist actually working this out, set around one concrete hard choice? i want real back-and-forth -- the vagueness theorist needs to get a genuine answer to the small-improvement argument, not just concede, and the parity theorist shouldn't get the last word for free either.
