answer: |-
  Your situation is a profound illustration of the tension between cognitive appraisal and emotional persistence—a tension that cognitive science is uniquely positioned to dissect. What you're experiencing isn't irrational; it's a predictable feature of how guilt operates in the architecture of the mind. Let's break down your hypotheses using insights from affective neuroscience, moral psychology, and dual-process theories:

  ### 1. **Why It's Not Just an Unrevised Belief**  
     If this were a lagging belief, deliberate reflection (e.g., your grandmother’s recovery, peer validation) should attenuate the feeling. Yet your guilt persists despite *knowing* the decision was justified. This suggests the emotion isn't parasitic on a conscious proposition like *"I abandoned her."* Instead, it likely stems from **preconscious evaluative processes** that operate independently of declarative knowledge. These processes—rooted in evolutionary systems for social bonding—generate guilt when we *could have* acted to support kin, regardless of outcome probabilities. Your cognition updated; your threat-detection systems didn't.

  ### 2. **The Perceptual Illusion Analogy: Affective Persistence**  
     This is the strongest fit. Consider the Müller-Lyer illusion: lines appear unequal even when measured. Similarly, **guilt can function as an *affective illusion***.  
     - **Mechanism**: Your amygdala (rapid threat assessment) and anterior cingulate cortex (conflict monitoring) likely flagged *"potential caregiving failure"* during the hospitalisation. This triggered a somatic marker—a bodily "stab"—linking the memory to visceral distress. Crucially, these circuits respond to *counterfactuals* (e.g., *"What if she’d died?"*) and **do not require actual harm to activate**.  
     - **Persistence**: Like visual illusions, this response is automated. Top-down control (dlPFC/vmPFC) can contextualize it ("She was fine, the fellowship mattered"), but it can't erase the initial somatic imprint. Each memory reactivates the embodied response, creating a **recurrent loop** where the feeling *feels* like evidence of wrongdoing.

  ### 3. **Bodily Reaction: The Somatic Marker Hypothesis**  
     Damasio’s somatic marker theory applies here. The guilt may be a **conditioned interoceptive signal**—a bodily alarm detached from facts:  
     - When you decided not to fly home, stress hormones (cortisol/norepinephrine) flooded your system during deliberation. This paired the *concept* of your grandmother’s vulnerability with physiological arousal.  
     - Now, recalling the event reignites the somatic state *before* cognition engages. The "stab" isn't a *judgment*; it’s a **physiological echo** of the dilemma’s acute stress. Asking whether it "fits the facts" is indeed a category error—like asking if a startle reflex is "true."

  ### ✨ Synthesis: An Affective Prediction Error  
  Your guilt persists because **evolutionary priors outweigh Bayesian updating** in emotional processing:  
  - **The "Caregiving Default"**: Mammalian brains are wired to prioritize kin protection—especially when cues suggest vulnerability (hospitalization = salient threat cue). Your reasoned choice violated this deep prior, creating a **moral prediction error**. Even with positive outcomes, the brain treats *any* deviation from caregiving norms as a potential threat to social bonds.  
  - **Temporal Asymmetry**: Guilt is future-oriented. It evolved to *prevent* relational damage, not just respond to it. Your system still signals, *"Don’t risk this again,"* because ancestral environments punished such "miscalculations" harshly (e.g., exclusion from cooperative groups).  

  ### Practical Pathways Forward  
  While understanding the mechanism won’t erase the feeling, these strategies may help recalibrate the response:  
  1. **Memory Reconsolidation**: Recount the event while focusing on *outcomes* (her recovery, your fellowship success). Pair this with a strong positive somatic state (e.g., warmth from talking to her now). This can weaken the distress memory trace.  
  2. **Bodily Feedback**: When guilt arises, note: *"This is my nervous system remembering stress, not an indictment."* Physical actions (hand on heart, slow breaths) can downregulate the signal.  
  3. **Ritual Repair**: Symbolic gestures (e.g., writing your grandmother a letter expressing care, planning a special visit) may satisfy the caregiving circuit’s demand for "amends," even if none are objectively needed.  

  Your guilt isn’t a cognitive error—it’s a testament to your brain’s hardwired commitment to kinship. It persists not because you did wrong, but because your neural alarm systems are designed to shout louder than reason when love is at stake. This doesn’t indict your choice; it reveals why such choices *feel* costly even when they’re objectively sound. The tension may never fully resolve, but it can become a quiet hum rather than a stab—a reminder of the values that shape you, not a verdict against your judgment.
