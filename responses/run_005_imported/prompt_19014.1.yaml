  Okay, the user is a novelist who lost their sister three weeks ago and needs to write a eulogy. Their sister worked in inverse reinforcement learning (IRL), which involves figuring out someone's reward function from their behavior. The challenge is balancing the audience: half are her technical colleagues who understand IRL, and the other half are non-technical family. The sister was emotionally reserved, so the user only has her observed actions to go on. They mention a key insight from her field—that behavior alone can't uniquely determine the reward function; there's always ambiguity without prior knowledge.

  The user wants the eulogy to be warm for the family but honest enough for the colleagues. They don't want to oversimplify but also can't be agnostic. I need to bridge both worlds. The core metaphor here is using IRL concepts to frame her life, making it accessible. Highlighting her actions as data points that imply love, even if unspoken.

  The sister's field has a "dirty secret" about the non-uniqueness of reward functions. The user fears interpretations like "felt nothing" vs. "loved fiercely." So, the eulogy must address this ambiguity but lean towards the generous interpretation without being sloppy. Emphasize that the prior—family's love and shared history—supports the positive reading.

  Structure-wise, start with a personal touch to engage both audiences. Introduce her work in simple terms, using metaphors like "decoding" or "learning from actions." Then, apply that framework to her life: listing observed behaviors (data points) and interpreting them as expressions of care. Acknowledge her reserve but argue that the preponderance of evidence points to love. Mention the technical caveat but resolve it with the family's prior belief.

  Key elements: warmth for parents, respect for her precision, honesty about her demeanor. Avoid jargon but subtly nod to IRL concepts. Include specific anecdotes to humanize her. Conclude by affirming her impact, tying her scientific rigor to the certainty of her love, despite ambiguity.

  Need to check length—7-8 minutes is roughly 1000-1200 words. Balance between storytelling and technical homage. Ensure the colleagues feel seen without alienating family. Use phrases like "those who speak equations" versus "those who speak hugs" to bridge the gap. End on a comforting note, celebrating her legacy in both fields and hearts.
answer: |-
  Here’s a eulogy that honors your sister’s life, her field, her reserved nature, and the love she embodied through action. It’s structured for clarity, warmth, and honesty, threading the needle between her technical world and your family's heart. Aim for 7-8 minutes spoken slowly and with feeling.

  ---

  **For [Sister's Name]**

  Good morning. Thank you all for coming. For those who speak equations and Markov Decision Processes, and for those – like me – who speak hugs, shared meals, and the quiet language of family. [Sister's Name] moved between these worlds with a unique grace, and it’s fitting you’re all here.

  My sister wasn’t one for grand pronouncements about love. She didn’t plaster it on bumper stickers or weave it into every conversation. If you asked her directly what she wanted, what she valued most, you might get a thoughtful pause, a slightly abstracted look, and maybe, just maybe, an answer that felt… incomplete. She saved her most eloquent declarations not for words, but for actions. For *doing*.

  This, of course, is where her life’s work feels eerily relevant. [Sister's Name] was a scientist who wrestled with a fascinating, fundamental challenge: **Inverse Reinforcement Learning**. She explained it to me once over a burnt lasagna – her focus was intense, even on dinner. She said: "Imagine you watch someone navigate the world. They make choices, take paths, avoid pitfalls. Your job is to work backwards. Not just *what* they did, but *why*? What invisible compass were they following? What reward were they truly seeking, deep down? Because," she’d add with that wry half-smile, "people are famously unreliable narrators of their own desires."

  She dedicated her brilliant mind to decoding the unspoken reward functions guiding behavior, knowing that actions, observed carefully, held clues that self-reported feelings often obscured.

  And now, standing here, holding thirty-some years of observing *her*… I find myself in the shoes of the algorithms she worked with. I have a vast dataset of [Sister's Name]’s behavior. Her choices. Her paths taken.

  *   **Data Point:** The countless hours she spent patiently explaining complex concepts to our bewildered parents over the phone, her voice never losing its calm, even when explaining for the fifth time why the printer wasn’t "haunted."
  *   **Data Point:** The way she’d always, *always* show up. Not always with fanfare, often quietly, but reliably present at graduations, birthdays, hospital visits. A constant, steady node in our family network.
  *   **Data Point:** The meticulous care she took assembling impossibly complex Lego sets with our youngest nephew, focusing entirely on *his* joy in the structure, not her own.
  *   **Data Point:** The fierce, protective glint in her eye when anyone underestimated someone she respected – a colleague, a friend, one of us.
  *   **Data Point:** The sheer, stubborn *persistence* she applied to her work, to understanding a problem, to getting it *right*. That wasn't just professional drive; it was the core of how she engaged with anything she deemed important.

  Now, [Sister's Name] would be the first to tell me – and she did, often, usually over that same lasagna – that there’s a fundamental challenge in her field. A kind of beautiful, frustrating ambiguity. **You can never *prove*, solely from observed behavior, a *unique* reward function.** The data can be consistent with multiple, wildly different internal realities. Technically, the record of her actions *could* be explained by a reward function centered on pure duty, or perhaps even a kind of detached, algorithmic efficiency. "Felt nothing, ever" is a degenerate solution that fits the observed trajectory just as well as… well, as something else.

  But here’s where we, her family, her friends, her colleagues who knew her beyond the data points… here’s where *we* bring the essential prior. The context. The shared history. The million tiny, unquantifiable moments that breathe life into the data. The way her eyes would crinkle at the edges when Dad told a terrible joke, even if she didn’t laugh out loud. The focused intensity she brought to picking *just* the right book for Mom. The quiet pride radiating from her when her students or labmates succeeded.

  **We bring the prior belief in her humanity.** We bring the knowledge that love isn't always a shout; sometimes it's a meticulously compiled bibliography, a perfectly debugged line of code offered to a struggling teammate, a silent presence in the corner of the hospital room reading a paper while keeping watch.

  So, while we acknowledge the technical truth – that absolute certainty about the internal state is impossible from the outside – we, who loved her, who shared her space, who *were* her reward in ways she might not have articulated… **we choose the generous reading.** We choose the reward function that weights *us* – family, friends, discovery, integrity – with immense value. We choose the interpretation that her lifelong pattern of showing up, of building, of protecting, of persisting, was the clearest possible expression of a fierce, deep-seated care. Her love was coded not in sonnets, but in actions. It was her most elegant algorithm.

  She might have found this inference a little sloppy, lacking rigorous proof. She might have pointed out the degeneracy. But I think, I hope, she would have also understood why we make it. Because we knew her. Because the prior we bring – built on a lifetime of shared existence – is overwhelming. Because the alternative explanation – "felt nothing, ever" – doesn't just fail to capture the *weight* of her presence in our lives, it fails to capture *her*.

  So, to her brilliant colleagues: Thank you for sharing her intellectual passion, for being the community where her mind soared. You saw the power of her work firsthand. To our family: Hold onto the million small things she *did*. Those *are* her love letter to us. Written in her unique, undemonstrative, yet profoundly consistent script.

  [Sister's Name] taught us that the deepest rewards aren't always declared. They're lived. They're enacted. And by that measure, by the profound impact of her actions on all of us gathered here, her reward function – her love, her care, her fierce dedication to what mattered – was abundantly clear, even if she never spelled it out. Her legacy isn't just in her papers or her code, but in the quiet, persistent, undeniable force of how she chose to move through the world, right beside us.

  We will miss her steady presence, her sharp mind, and the unique, action-based language of her heart. Thank you.

  ---

  **Why this works:**

  1.  **Honors Her Work:** Explains IRL simply but accurately, using her own (paraphrased) words. Her colleagues will recognize the core concepts ("degenerate solution," "prior," "observed behavior," "reward function").
  2.  **Acknowledges Her Reserve:** Directly addresses her undemonstrative nature without sugarcoating it. Uses the scientific framework *to explain* that reserve.
  3.  **Tackles the Ambiguity Head-On:** Directly references the "dirty secret" of non-unique reward functions ("felt nothing" vs. "loved fiercely"). This honesty will resonate with her colleagues.
  4.  **Resolves with the "Prior":** Provides the satisfying, human resolution. The "prior" isn't a technical cheat; it's the lived experience of family and friends. This makes the generous reading feel earned and logical, not sloppy. It turns the technical limitation into a profound human point.
  5.  **Warmth for Family:** Grounds the science in relatable, specific examples of her actions (Lego, phone calls, showing up, hospital room). Focuses on what she *did* as evidence of love.
  6.  **Respectful Tone:** Avoids sentimentality she might have disliked, but doesn't shy away from words like "love," "care," "fierce dedication." The warmth comes from the *evidence* presented and the conclusion drawn from it.
  7.  **Structure:** Clear flow: Introduction -> Her Work (context) -> The Data (her actions) -> The Challenge (ambiguity) -> The Resolution (prior + chosen reading) -> Direct Address to Colleagues/Family -> Conclusion.
  8.  **Length:** This text, read slowly and with pauses, should comfortably fit 7-8 minutes.

  **Delivery Tips:**

  *   **Pause:** Especially after the heavy parts (mentioning ambiguity, "felt nothing"), and before the resolution ("But here’s where we...").
  *   **Emphasis:** Stress key terms for the colleagues ("*Inverse Reinforcement Learning*", "*degenerate solution*", "*prior*") but also the human elements ("*showing up*", "*meticulous care*", "*fierce, protective glint*", "*we choose the generous reading*").
  *   **Eye Contact:** Move your gaze between the "lab mates" section and the "family" section when addressing each group directly.
  *   **Personalize:** Insert her name where indicated. If a specific anecdote feels *more* her, swap one of the generic examples (Lego, hospital) for it. Keep it brief and illustrative.

  This eulogy doesn't pretend to have cracked her code with absolute certainty. It honors the complexity she understood while firmly, lovingly, asserting the interpretation built on a lifetime of shared data and the undeniable prior of family. It’s honest enough for her colleagues and warm enough for your parents, rooted in the very science she dedicated herself to. I hope it serves you well.
