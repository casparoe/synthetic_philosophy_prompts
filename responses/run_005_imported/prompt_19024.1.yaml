answer: |-
  Here’s a set of 10 questions designed to push past rehearsed critiques, preempt dodges, and force engagement with concrete biological and philosophical stakes. Each includes the predicted dodge and a surgical follow-up:

  ### **1. Architectural Precision & Metaphor Integrity**
     **Question:** "You’ve noted that Gould and Lewontin’s spandrel metaphor relies on the San Marco mosaics being non-adaptive byproducts of architectural constraints. But art historians clarify those mosaics sit in *pendentives* (triangular concave supports), not spandrels (the residual *space* between arches). If the core example mislabels the structure, does this undermine the biological argument that ‘byproducts’ are misidentified as adaptations?"  
     *Predicted Dodge:* "The exact term isn’t important—it’s about *conceptual* byproducts of constraint."  
     **Follow-Up:** "But pendentives are load-bearing innovations, not accidental spaces. If biologists analogize traits to ‘pendentives’ instead of ‘spandrels,’ doesn’t that imply they *are* functional from inception? Should we retire the metaphor?"

  ### **2. Methodology Gap & Falsifiability**
     **Question:** "Critics like Queller and Dennett argue the spandrels critique fails because it never produced a *rival methodology* generating unique, risky predictions. If structuralism only critiques adaptationism without offering testable alternatives, isn’t it equally unfalsifiable—just a ‘just-not story’?"  
     *Predicted Dodge:* "Critique is essential science! Adaptationism dominates resources; we expose its overreach first."  
     **Follow-Up:** "But if structuralism can’t predict *which* traits will be spandrels versus adaptations, or *when* constraints dominate selection, how is it more than a philosophical stance? Can you name one *novel* prediction structuralism made that was later confirmed?"

  ### **3. Exaptation as Adaptationism’s Trojan Horse**
     **Question:** "Gould and Vrba’s ‘exaptation’ concept seems to concede that even co-opted spandrels (like feathers for flight) undergo intense *post-hoc* adaptation. Doesn’t this imply selection *is* the primary sculptor of functional complexity, reducing structuralism to a footnote about origins?"  
     *Predicted Dodge:* "Exaptation separates *origin* from *current utility*—that’s the key insight! Selection refines, but doesn’t create."  
     **Follow-Up:** "If selection massively retools a trait (e.g., feather microstructure for aerodynamics), is the ‘spandrel’ origin biologically relevant? Or does adaptation swamp the signal, making structuralism untestable for extant traits?"

  ### **4. Constraints vs. Selection: The Burden of Proof**
     **Question:** "When you reject an adaptationist account as a ‘just-so story,’ you invoke developmental constraints or phylogenetic inertia as the null. But what *positive evidence* shifts the burden *away* from constraint and *toward* adaptation for a specific trait? Is it even possible?"  
     *Predicted Dodge:* "We don’t default to adaptation! Constraints are pervasive; adaptationists must *disprove* them."  
     **Follow-Up:** "Doesn’t this make structuralism unfalsifiable? If adaptationists must disprove every conceivable constraint, but structuralists needn’t prove constraints exist, is that asymmetric burden scientifically tenable?"

  ### **5. The ‘Hard Core’ Structuralist Prediction**
     **Question:** "Can structuralism make a bold, counter-adaptationist prediction? For instance: ‘In clade X, trait Y—despite complex function—will show no molecular signatures of selective sweeps, but will align with conserved developmental pathways.’ Has this ever been tested/confirmed?"  
     *Predicted Dodge:* "Biology is historical; predictions are hard. We explain stasis, inefficiency, homologies..."  
     **Follow-Up:** "But without risky predictions, how is structuralism distinguishable from ‘explanations of the gaps’ where adaptationist models are incomplete?"

  ### **6. Spandrels in the Genomic Era**
     **Question:** "Modern genomics finds pervasive ‘exaptation’ at the molecular level (e.g., transposable elements co-opted for regulation). Doesn’t this suggest spandrels are *raw material* for selection, not an alternative explanation? Isn’t genomics adaptationism’s best ally?"  
     *Predicted Dodge:* "Non-adaptive origins are everywhere! Genomics proves our point."  
     **Follow-Up:** "But if exapted elements are swiftly optimized by selection (e.g., gene regulatory networks), doesn’t that make selection the driver of *functional* complexity? When does a ‘spandrel’ stop being one?"

  ### **7. The ‘No Free Lunch’ Counter**
     **Question:** "Dennett notes that even if spandrels exist, selection must ‘recognize’ and exploit them. Doesn’t this cognitive metaphor imply an adaptive filter is still doing the heavy lifting? Are structuralists just describing selection’s menu, not the chef?"  
     *Predicted Dodge:* "That misrepresents us! We emphasize multiple causal routes beyond selection."  
     **Follow-Up:** "But if constraints merely bias the variation selection acts upon, isn’t structuralism subsumed within an expanded adaptationism? Where’s the *causal independence*?"

  ### **8. Feathers: A Case Study**
     **Question:** "Take feathers. They likely originated for insulation (non-flight spandrel?), but were exapted for flight and refined into irreducibly complex airfoils. At what point—and by what evidence—would you agree that ‘flight feathers’ are true adaptations, not spandrels? Is it even a useful distinction now?"  
     *Predicted Dodge:* "Their *origin* is key! Current function doesn’t erase historical contingency."  
     **Follow-Up:** "If the origin is buried, and current form is honed by selection, should biologists care? Or is insisting on ‘spandrel’ just a historical footnote?"

  ### **9. What Would Falsify Structuralism?**
     **Question:** "What observable evidence would force you to concede that a specific trait (say, the human eye) is *predominantly* an adaptation, with constraints playing a minor role? Be concrete: experimental, genetic, fossil, or comparative data."  
     *Predicted Dodge:* "No trait is ‘pure’ adaptation! It’s always interaction."  
     **Follow-Up:** "Agreed—but science weighs *dominant* causes. If we found eye precursors had no non-visual function, showed strong selection gradients across lineages, and were genetically modular for visual performance, would that satisfy you? If not, what would?"

  ### **10. The Ultimate Follow-Up: Your Own Standard of Proof**
     **Question:** "You demand adaptationists prove ‘no constraints existed’—an impossible standard. What standard do *you* hold structuralist explanations to? If I claim trait X is a spandrel, what evidence would *you* require to accept it? And can you meet that bar for your own work?"  
     *Predicted Dodge:* "We show plausibility via development/phylogeny. Perfection isn’t possible!"  
     **Follow-Up:** "But if ‘plausibility’ suffices for structuralism while adaptationists need ‘perfection,’ isn’t that a double standard? Shouldn’t both frameworks risk falsification equally?"

  ---

  **Why this works:**  
  - **Precision on Spandrels/Pendentives:** Forces engagement with the metaphor’s empirical grounding.  
  - **Methodology Focus:** Targets the "critique without construction" weakness.  
  - **Exaptation Tension:** Explores how Gould’s own concept may undermine strict structuralism.  
  - **Feathers as Rosetta Stone:** Demands concrete criteria applied to a real trait.  
  - **Follow-Ups:** Anticipate rhetorical exits and block them by circling back to evidence, asymmetry, and testability.  

  **Key Strategy:** Never let "It’s about historical contingency!" or "Adaptationists ignore constraints!" stand as answers. Push for *how we know* and *what would change her mind*. This exposes whether structuralism is science or ideology.
