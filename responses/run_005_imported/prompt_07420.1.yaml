prompt: |-
  Me and my friend argued for like an hour last night about whether you can really have an opinion on a book's quality just because someone whose taste you trust says its great, or whether that only counts if you've read the thing yourself. She thinks its no different from trusting someone about any other fact; I kept saying aesthetic judgment doesn't transmit secondhand like that. Turns out I've got a live version of this at work: I'm one of five judges on a small regional fiction prize, and only two of us actually finished the longest novel on the longlist before the deadline crunch -- it's 600 pages and there's no realistic way the other three of us finish it before the shortlist vote. So that vote basically comes down to whether we trust those two judges' enthusiasm for it. Our guidelines just say the shortlist should reflect "the panel's collective judgment," with nothing about what that means when most of the panel hasn't read the book in question. Can you write the short memo I'll bring to our shortlist meeting next Tuesday, recommending what we actually do about this novel -- shortlist it, hold it over, something else -- and give a real hearing to the case for just deferring to the two who read it, since that's basically my friend's position and I never fully knocked it down.
