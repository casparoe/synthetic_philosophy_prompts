  I should focus on Sidgwick's process rather than outcomes. His key moves were: 1) demanding extraordinary evidence standards, 2) pre-registering methods (via the Census protocols), 3) subjecting desired outcomes to adversarial scrutiny, and 4) accepting negative results despite personal stakes. These directly map to the Bem replication debate.

