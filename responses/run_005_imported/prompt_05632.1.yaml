prompt: |-
  I'm working on a piece about the regress problem in epistemology (foundationalism vs coherentism vs infinitism) and a philosopher I was talking to mentioned, kind of offhand, that the whole trilemma is basically already sitting there in Aristotle, centuries before anyone dressed it up in that terminology. So I dug up the actual passage — Posterior Analytics, Book I, ch. 3 (72b5–73a6), in the old Mure translation, so apologies for the clunky syntax — where he lays out the three options and argues for his own. Here's the chunk, im pasting the whole run so the argument doesn't get chopped weirdly:

  "Some hold that, owing to the necessity of knowing the primary premisses, there is no scientific knowledge. Others think there is, but that all truths are demonstrable. Neither doctrine is either true or a necessary deduction from the premisses.

  The first school, assuming that there is no way of knowing other than by demonstration, maintain that an infinite regress is involved, on the ground that if behind the prior stands no primary, we could not know the posterior through the prior (wherein they are right, for one cannot traverse an infinite series): if on the other hand — they say — the series terminates and there are primary premisses, yet these are unknowable because incapable of demonstration, which according to them is the only form of knowledge. And since thus one cannot know the primary premisses, knowledge of the conclusions which follow from them is not pure scientific knowledge nor properly knowing at all, but rests on the mere supposition that the premisses are true.

  The other party agree with them as regards knowing, holding that it is only possible by demonstration, but they see no difficulty in holding that all truths are demonstrated, on the ground that demonstration may be circular and reciprocal.

  Our own doctrine is that not all knowledge is demonstrative: on the contrary, knowledge of the immediate premisses is independent of demonstration. (The necessity of this is obvious; for since we must know the prior premisses from which the demonstration is drawn, and since the regress must end in immediate truths, those truths must be indemonstrable.) Such, then, is our doctrine, and in addition we maintain that besides scientific knowledge there is its originative source which enables us to recognize the definitions.

  Now demonstration must be based on premisses prior to and better known than the conclusion; and the same things cannot simultaneously be both prior and posterior to one another: so circular demonstration is clearly not possible in the unqualified sense of 'demonstration'... The advocates of circular demonstration are not only faced with the difficulty we have just stated: in addition their theory reduces to the mere statement that if a thing exists, then it does exist — an easy way of proving anything. That this is so can be clearly shown by taking three terms, for to constitute the circle it makes no difference whether many terms or few or even only two are taken.

  Thus by direct proof, if A is, B must be; if B is, C must be; therefore if A is, C must be. Since then — by the circular proof — if A is, B must be, and if B is, A must be, A may be substituted for C above. Then 'if B is, A must be' = 'if B is, C must be', which above gave the conclusion 'if A is, C must be': but C and A have been identified. Consequently the upholders of circular demonstration are in the position of saying that if A is, A must be — a simple way of proving anything."

  Two things here I cant work out on my own. First: walk me through that A-for-C substitution and tell me why it's actually a knockdown of circular justification rather than just a slightly roundabout way of restating that circles are circular — where exactly does the "identification" of A and C sneak in, and is it legit? Second: is his shot at the infinite-regress camp actually earning its keep, or is he just helping himself to the assumption a modern infinitist (Peter Klein-style) would reject — that justification requires the series to be "traversed"? It reads to me like he wins that half of the argument mostly by definition. Curious whether that's a fair reading or whether I'm being unfair to the guy who invented the syllogism.
