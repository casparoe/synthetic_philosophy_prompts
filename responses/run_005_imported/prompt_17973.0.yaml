  For the primary occurrence, the negation is inside the scope of the description. That means the description still asserts existence and uniqueness, but denies the predicate. So, "there exists a unique King of France, and he is not bald." Since there's no king, this is false because the existence part fails.

  For the secondary occurrence, the negation applies to the whole proposition. So, it's denying the conjunction of existence, uniqueness, and predication. That becomes "it is not the case that (there's a unique king and he's bald)." Since there's no king, the whole conjunction is false, and negating it makes it true.

