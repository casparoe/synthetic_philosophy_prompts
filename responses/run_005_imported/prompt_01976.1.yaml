prompt: |-
  So my philosophy elective has been stuck on Wittgenstein for like two weeks now and honestly my brain is a little fried lol. We read part of his lectures on religious belief where he talks about this hypothetical guy who believes in the Last Judgement, and Wittgenstein's whole point is that even though he personally doesn't believe in it, that doesn't mean he's contradicting the guy — he actually says at one point that if you asked him straight out whether he contradicts the man, he'd say no. His argument is that the religious belief isn't functioning as a normal factual claim the way "the bus arrives at 3pm" is, its more like a picture that regulates someone's whole life, so the believer and the non-believer aren't even disagreeing about the same kind of thing. Took me a while to wrap my head around that ngl.

  Then this weekend my friend had a bunch of old Dawkins and Hitchens debate clips going on his laptop (we watched way too many, like 3 hours worth), and it made me think about this. Dawkins literally calls it "the God Hypothesis" in The God Delusion and argues that whether God exists is a scientific question you settle with evidence like any other, which seems like basically the opposite of the "its a totally different kind of belief" thing Wittgenstein was going for.

  So what do you think Wittgenstein would've actually said about the whole New Atheist movement (Dawkins, Hitchens, Sam Harris, that whole crowd) if he'd somehow been alive to see it blow up? Would he have been on their side since he wasn't religious either, or would he think they're completely missing the point of what religious belief is even doing and basically arguing against a hypothesis nobody serious actually holds? I want an actual argued answer based on his specific views, not just a "guess we'll never know" type answer.
