  We are grading a student's answer to an exam question about Anscombe's "Mr. Truman's Degree". The rubric has 5 criteria with point allocations. We need to evaluate the student's response against each criterion and assign points. Then calculate the total and assign a letter grade.

  The student's answer is provided. We break it down by the rubric:

  1. **Criterion 1 (6 points):** The intention/foresight distinction and the work it does in the murder charge.
     - The student explains that the distinction is crucial because if the deaths were intended (as means to break morale and force surrender) then it is murder. If they were merely foreseen but unintended (as side effects of attacking a military target), then double effect might excuse. The student correctly notes that the intention makes the killing impermissible regardless of consequences.
     - This is a strong answer. Award: 6/6.

  2. **Criterion 2 (5 points):** The doctrine of double effect and where it actually does its work.
     - The student describes double effect as the traditional test for separating permissible collateral harm from murder. They note that in this case, because the civilian deaths were intended (as the means to an end), double effect does not apply. The student contrasts this with a scenario where deaths are unintended side effects of a legitimate military target.
     - The student correctly identifies that double effect is the framework that would allow unintended deaths but not intended ones. However, they don't explicitly say that double effect does its work in cases of unintended consequences (though they imply it by contrast). Also, the student does not detail the conditions of double effect (e.g., that the action must be good or neutral, the bad effect must not be intended, the good effect must be proportional, etc.). But the question only asks for "where it actually does its work" and the student correctly says it would work in the case of unintended side effects. Given the rubric, this is acceptable. Award: 5/5.

  3. **Criterion 3 (5 points):** The link to consequentialism, including whether the essay-level attribution is accurate.
     - The student states that Anscombe first named and attacked consequentialism in this pamphlet, defining it as the view that no act is intrinsically forbidden and that results alone matter. They link this to the reasoning of Truman's defenders (that the bombs shortened the war and saved lives overall) and argue that consequentialism makes murder respectable by calling it necessity.
     - This is accurate. The pamphlet is indeed where Anscombe coined the term "consequentialism" and attacked it. The student correctly connects the objection to Truman's justification. Award: 5/5.

  4. **Criterion 4 (2 points):** The characterization of Anscombe's stance on pacifism and just war.
     - The student notes that Anscombe was not a pacifist and thought killing enemy combatants in a just war was permissible. They clarify that her complaint is narrowly about the deliberate killing of non-combatants.
     - This is correct and concise. Award: 2/2.

  5. **Criterion 5 (2 points):** Overall clarity and organization.
     - The answer is well-structured, clear, and covers all the required points without unnecessary digression. It flows logically and is easy to follow. Award: 2/2.

  Total points: 6+5+5+2+2 = 20.

