answer: |-
  Your argument is admirably clear and engages deeply with the core metaphysical problem. Here’s a critical assessment of your position, your friend’s objection, and the broader landscape:

  ### 1. **Does the Normality Move Survive Your Friend’s Objection?**
     **Her Challenge:** The lifeguard’s "default" is fixed by her contract (a normative fact), so normality collapses into duty.  
     **Your Vulnerability:** This is the crux. Hitchcock/Knobe-style normality *can* be purely statistical (e.g., "lifeguards usually scan the water"). But in **this specific case**, the strongest basis for the default *is* the contractual duty. Role-based defaults often derive from institutional/social norms – which *are* normative. If the *only* reason the lifeguard’s inaction is "abnormal" is her contractual obligation, then yes, normality is parasitical on duty here.  

     **Possible Defense (for Normality):**  
     - Normality isn’t *solely* moral. Even absent a contract, societal roles create expectations (e.g., parents feed children; this is "normal" due to biology/social structure, not necessarily moral duty).  
     - Hitchcock (e.g., "Prevention, Preemption, and the Circuit Breaker") argues norms can be *functional* (e.g., a lifeguard’s *function* is to watch swimmers). Function might be non-moral (like a thermostat’s function).  
     - **But:** In law/torts, the contract *is* what establishes the function. Your friend’s point stands: **for this case**, normality relies on a normative fact. To escape, you’d need a version of normality untethered from institutional roles (e.g., "statistically, people on beaches rarely save strangers"), but that *would* make the triathlete’s inaction abnormal too – reviving over-generation.

  ### 2. **Fairness to Beebee & Schaffer**
     - **Beebee:** You’re fair. Her "eliminativism" (absences aren’t causes) *does* avoid the dilemma by denying omissive causation entirely. Responsibility is grounded in **duties + counterfactual dependence**, not causation. Your case perfectly illustrates her view: both exhibit dependence, but only the lifeguard had a duty. The cost? It clashes with ordinary language ("her negligence *caused_ the death"). Beebee bites this bullet, arguing such talk is blame-assigning shorthand.  
     - **Schaffer’s Contrastivism:** You slightly flatten it. Schaffer ("Contrastive Causation") doesn’t just offer an "alternative move"; he **dissolves** the problem by making causation inherently question-relative.  
       - *For "Why did he drown rather than not?"*: Both omissions might be causes (over-generation).  
       - *For "Why did he drown rather than being saved by the lifeguard?"*: Only the lifeguard’s omission is a cause.  
       - *For "Why did he drown rather than being saved by the triathlete?"*: Only the triathlete’s omission is a cause.  
       - **Your friend’s challenge reappears:** What makes *the lifeguard contrast* salient? Schaffer says pragmatic interests (like duties) select the relevant contrast. Normality might guide this, but again, duties could be what make the contrast salient. Contrastivism *shifts* the problem rather than solves it outright.

  ### 3. **Is This the Sharpest Case?**
     The lifeguard/triathlete case is good, but a **better-known literature case** sharpens the normality vs. eliminativist clash:  
     - **Billy and Suzy the Snipers (Hall variant):**  
       *Suzy (on duty) and Billy (off-duty sniper) both have clear shots at a victim. Both shoot. Suzy’s bullet hits first; victim dies. Billy’s bullet would have hit a millisecond later.*  
       - **Normality View:** Suzy’s shot is the cause; Billy’s is preempted. "Snipers shoot when on duty" is normal; "off-duty snipers shoot randomly" is abnormal.  
       - **Eliminativist View (Beebee):** Only Suzy’s *positive action* (firing the bullet) caused the death. Billy’s *inaction* (not restraining himself) isn’t a cause, but he may be blameworthy.  
       - **Why it’s sharper:** Removes omissions, focusing on positive actions where preemption relies on normative/functional roles (duty). It tests if "normal process" can be defined non-normatively. If normality depends on "duty" here too, your friend’s objection gains force.  

     *For pure omissions:* **Two Doctors:**  
       *A patient codes in a hospital. Dr. A (on shift) is scrolling Twitter. Dr. B (off-duty, visiting family) is in the cafeteria. Both could have saved him.*  
       Identical counterfactual dependence. Only Dr. A’s omission seems causal. Why? Her *role*-defined default is to monitor patients. Is this role purely statistical, or normatively constituted?

  ### Where the Argument Needs Thickening
  1. **Normality’s Foundations:** You must confront whether "role-based" or "functional" defaults *can* be non-normative. Is a lifeguard’s function defined by biology, statistics, or social agreement (which implies normativity)? Hitchcock’s "functional norms" often sneak in teleology. Can you ground defaults in *pure* statistical frequency without inviting over-generation (e.g., "sunbathers rarely save swimmers" is statistically normal, making the triathlete’s inaction normal too)?
     
  2. **Explanatory Priority:** You want causal facts to ground responsibility. But if causal facts (via normality) depend on social roles/contracts, is this circular? Contracts exist *because* we assign responsibility for certain roles. This loops back to McGrath’s dilemma. Can you break the loop? Perhaps by appealing to *evolutionary* or *biological* defaults (e.g., parents' role), but this won’t cover contracts.

  3. **Contrastivism’s Edge:** Explore whether Schaffer’s framework *absorbs* the normality/duty distinction pragmatically without making causation itself normative. The causal *relation* is contrast-relative; *which* contrast we care about may be duty-laden, but causation itself isn’t. This might salvage explanatory priority: duties select contrasts, but causation itself remains non-normative.

  4. **Beebee’s Strength:** Her view cleanly separates metaphysics (positive causation only) from ethics (duties + dependence). Embrace this! Argue that tort law’s "proximate cause" is fundamentally ethical, not metaphysical. The lifeguard’s *breach of duty* + counterfactual dependence justifies liability without misapplying "causation."

  ### Conclusion
  Your normality move **partially survives** but **not decisively**. It works best if defaults can be robustly non-normative (e.g., evolutionary functions, pure statistics). In institutional contexts (like torts), your friend is right: contracts/duties *constitute* the default. Here, Beebee’s eliminativism or Schaffer’s contrastivism offers a cleaner split. To strengthen your case:  
  - Ground defaults in non-normative regularities (e.g., "lifeguards *statistically* save swimmers 99% of time").  
  - Argue that role-based norms, while socially constructed, are *causal-explanatory facts* (like software functions) that ground responsibility *without* moral circularity.  
  - Use the **Two Doctors** case to isolate omissions.  

  This is a profound debate – your argument is already strong, but wrestling with the normativity embedded in "defaults" is key to advancing it.
