  I recall theories like Dahl's affected interests principle, which argues that everyone affected should have a say. But the challenge is the ripple effect—where do you draw the line? In watersheds, effects cascade downstream, so downstream counties are directly impacted. However, including everyone could make decisions unfeasible. 

