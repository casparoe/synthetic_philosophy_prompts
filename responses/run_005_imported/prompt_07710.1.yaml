  So, the solution might lie in nested governance structures. Watersheds as functional units could have multi-jurisdictional bodies with weighted voting. Precedents like the TVA or Delaware River Basin show this can work. Also, mitigation requirements could internalize costs, making the upstream county address downstream impacts, thus aligning responsibilities. 

  The strongest objection is feasibility—sovereignty concerns and bureaucratic hurdles. But examples exist where shared resources led to cooperative governance. Emphasizing that watersheds require integrated management could counter this. 

  The user might appreciate connecting this to polycentric governance literature, like Ostrom's work. Highlighting that advisory roles aren't enough but institutional designs can balance inclusion and efficiency. He needs both theoretical grounding and practical solutions, bridging his experience with philosophy.
answer: |-
  Your experience bridges a profound gap between technical water management and democratic theory—precisely where this dilemma lives. This is indeed a recognized problem, often discussed as the **"Boundary Problem in Democratic Theory"** or the **"Problem of the Demos,"** with specific applications in environmental governance as the **"Watershed Democracy Problem."** The core tension is between *jurisdictional sovereignty* (decisions made by those with legal authority) and the *affected interests principle* (those impacted should have a say). Neither pure approach is satisfactory here, but a defensible middle path exists.

  ### A Defensible Framework: Functional Representation with Mitigation Imperatives
  1.  **The Affected Interests Principle as Starting Point:**  
      Robert Dahl's principle ("everyone affected by a decision should have a say") is morally compelling but operationally vague. The key is defining "affected" rigorously:
      *   **Direct, Foreseeable, and Significant Impact:** Stakeholders are those whose *core interests* (livelihood, essential ecosystem services, legally protected rights) face *direct, foreseeable, and significant* alteration by the decision. Mere ripple effects or negligible impacts don't qualify.
      *   **Application:** Downstream irrigators and the salmon run (representing both economic and ecological/cultural interests) clearly suffer *direct, significant, foreseeable* harm (reduced summer flows). A resident 100 miles further downstream with no reliance on this tributary likely does not.

  2.  **Functional, Not Just Geographic, Stakeholder Definition:**  
      Jurisdiction based solely on political boundaries is arbitrary when impacts cross borders. The relevant "demos" should reflect the *functional unit* of the resource system:
      *   **The Watershed as the Functional Unit:** Hydrologically, a watershed *is* a coherent system. Decisions within it inherently have transboundary effects. Legitimate governance must reflect this reality.
      *   **Weighted Representation, Not Simple Majority:** Downstream stakeholders shouldn't necessarily have an *equal* vote to upstream residents funding the project, but they *must* have a *formal voice proportional to the impact they bear*. This could be:
          *   **Veto Power on Specific Harms:** Downstream counties gain binding veto power *only* over aspects causing demonstrable, significant harm to their core interests (e.g., flows falling below a pre-determined ecological/economic threshold), not over the entire project.
          *   **Weighted Voting in a Watershed Council:** A basin-level body with representatives from all affected counties, with votes weighted by severity of impact or dependency, makes the final decision on projects with cross-border effects.
          *   **Mandatory Mitigation Agreements:** Approval is contingent on legally binding agreements where the upstream county *funds* mitigation for downstream harm (e.g., financing water efficiency downstream, habitat restoration, or purchasing water rights to augment summer flows). This internalizes the externality.

  3.  **The Insufficiency of Advisory Consultation:**  
      The current environmental review process is a **fig leaf**, not a solution. It offers:
      *   **Voice Without Power:** Downstream concerns can be voiced but are easily ignored if politically inconvenient.
      *   **No Leverage:** It provides no mechanism to compel modification or mitigation.
      *   **Information Asymmetry:** Upstream decision-makers lack direct accountability to downstream stakeholders, reducing incentives to genuinely weigh their interests.
      *   **Symbolic Legitimacy Without Substance:** It creates the *appearance* of inclusion while preserving the *reality* of exclusion. This can breed resentment and litigation.

  ### A Concrete Proposal for This Case
  *   **The Decision:** Upstream County retains authority for project approval *only if* it demonstrably avoids significant harm to downstream core interests OR provides full mitigation.
  *   **The Mechanism:** A legally established **Watershed Management Commission** for the tributary basin, with seats for:
      *   Upstream County (weighted vote, e.g., 40%)
      *   Downstream County A (impacted agriculture, 30%)
      *   Downstream County B (impacted salmon habitat, 30%)
  *   **The Power:** The Commission must approve any project significantly altering flow regimes. Approval requires either:
      1.  Proof (via independent hydrologic modeling) that downstream flows remain above ecologically/agriculturally sustainable thresholds, *or*
      2.  A binding mitigation plan, funded by the upstream project, to offset the harm (e.g., paying for downstream irrigation efficiency gains equal to water lost, funding salmon habitat restoration).
  *   **Financing:** Upstream County remains solely responsible for project construction costs via its bonds. Mitigation costs are part of the project's *total cost* borne by the upstream county, reflecting the true social cost.

  ### The Strongest Objection (Feasibility and Sovereignty)
  **The objection:** "This destroys local sovereignty and makes infrastructure impossible. Upstream residents bear the direct financial cost and physical presence of the dam/reservoir. Granting formal power or imposing costly mitigation on downstream actors, who pay no taxes for the project and don't host it, disincentivizes development and infringes on the upstream community's right to manage resources within its borders. Creating new bureaucratic layers (Watershed Commissions) is slow, costly, and politically fraught."

  **Response:** This objection rightly highlights practical and normative concerns but underestimates the cost of exclusion:
  1.  **Moral Hazard:** Pure local sovereignty incentivizes upstream actors to externalize costs onto downstream neighbors. The "right to manage" shouldn't equate to a right to harm others significantly without recourse.
  2.  **True Cost Accounting:** The upstream county *isn't* bearing the full cost; it's exporting environmental and economic costs downstream. Mitigation internalizes these externalities, leading to more efficient and just outcomes. Projects that only make sense by imposing uncounted costs on others *should* be disincentivized.
  3.  **Sovereignty is Relational:** Sovereignty over shared resources like water cannot be absolute. Just as international law governs transboundary rivers, sub-state jurisdictions must acknowledge interdependence within a watershed. Functional governance *protects* downstream sovereignty from upstream infringement.
  4.  **Precedent Exists:** Models like the Delaware River Basin Commission (US) or catchment management authorities in the EU show multi-jurisdictional governance *can* work for shared water resources, balancing development and protection.

  ### Why This is a Core Democratic Problem
  This case crystallizes the conflict between:
  *   **Formal Equality:** "Only voters in Jurisdiction X decide matters within X."
  *   **Substantive Equality:** "Those who bear the brunt of a decision's consequences should have meaningful influence over it."

  Your upstream county holds formal authority but bears the least substantive cost. Downstream counties bear the highest cost but possess only symbolic consultation. This asymmetry violates basic fairness in collective decision-making.

  ### Relevant Literature
  *   **The Boundary Problem:** Whelan (1983), Dahl (1989), Arrhenius (2005).
  *   **Affected Interests Principle:** Shapiro (1999), Goodin (2007).
  *   **Watershed Governance & Environmental Justice:** Ostrom (1990) on polycentric governance, Schlosberg (2007) on networked injustice, works on Integrated Water Resource Management (IWRM).
  *   **Democratic Legitimacy for Externalities:** Christiano ("The Authority of Democracy," 2004) discusses legitimacy when decisions impose costs on outsiders.

  **In essence:** Legitimacy in decisions impacting shared resources requires moving beyond rigid borders and purely advisory input. It demands formal mechanisms—like functional representation with weighted influence or binding mitigation—that force decision-makers to internalize the full costs of their choices on those foreseeably and significantly harmed. Advisory review alone fails because it provides voice without power, perpetuating the very injustice the affected interests principle seeks to correct. The solution isn't unbounded inclusion, but rather *principled inclusion based on the severity and directness of impact on core interests within the functional system*.
