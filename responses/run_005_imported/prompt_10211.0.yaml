  1. **Causal Structure**: The game unfolds sequentially. Players don't choose the order; nature does. Each term corresponds to a possible outcome path. Rearrangements might group outcomes that never co-occur in reality. For example, rearranging might pair high positive and negative payoffs in a way that doesn't reflect actual gameplay.

