  so in my decision theory seminar we spent a good chunk of a lecture on the Pasadena game (flip a coin till it lands heads, payoff is +/- 2^n/n depending on which toss n it first lands heads on) and my prof's takeaway was basically "unlike St Petersburg, this isn't just infinite, its literally undefined, because the series is only conditionally convergent so Riemann's rearrangement theorem lets you sum it to whatever you want." that felt kind of like a cop out to me. can you make the strongest possible case FOR the position that the game still has a principled expected value of ln(2), by arguing that the "natural" summation order (the one matching the actual temporal order the tosses happen in) deserves to be privileged over all the other rearrangements, rather than treating every ordering as equally legit just because the math allows it? there's apparently also an "Altadena" variant that's supposed to make that move harder to sustain, so bring it in if it actually helps your case, but don't just hand me a restatement of why the expected value is "undefined" - i want an actual defense of privileging that one ordering.
