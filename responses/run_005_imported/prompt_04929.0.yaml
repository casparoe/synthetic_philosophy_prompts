answer: |-
  You've articulated a profound ethical dilemma with remarkable clarity. The tension you're experiencing stems from a legitimate philosophical distinction that often gets blurred in social dynamics. Let's break this down step by step:

  ### 1. **The Supererogation Distinction: Good ≠ Required**
     - **Morally Praiseworthy (Supererogatory)**: Priya's actions fall into this category—they exceed moral duty. Volunteering overnight shifts or sacrificing birthdays demonstrates exceptional virtue, but these acts aren't *obligatory*. Admiring her is appropriate; feeling obliged to match her is not.
     - **Moral Minimum**: Your group's completion of required service hours satisfies a baseline social contract (like not harming others). This is obligatory, but exceeding it is optional.
     
     **Key Insight**: A moral society needs both—people meeting obligations *and* some going beyond. But transforming supererogation into obligation creates burnout and resentment. Imagine if every "good" act became mandatory: no one could work, study, or care for family without guilt.

  ### 2. **Why Obligations Don't Scale with Others' Choices**
     - **The "Fairness" Fallacy**: Your friends mistake Priya's *personal* commitment for a *collective* standard. Moral duties are generally based on:
       - **Capacity**: Priya may have more time, energy, or resources.
       - **Circumstances**: Her sacrifices might align with her values in ways yours don't.
       - **Autonomy**: Her choice doesn't negate your right to allocate your limited resources (time, energy) according to your own values and responsibilities.
     - **Slippery Slope**: If obligations escalated every time someone did more, society would collapse. (e.g., "You donated 10% of your income? I must donate 20%!")

  ### 3. **Social Pressure vs. Moral Obligation**
     - **Guilt as Social Contagion**: Your friends' reactions are psychological, not philosophical. Their guilt stems from comparison, not reasoned ethics. Priya's actions became an accidental benchmark.
     - **The Pressure Trap**: When your friend quit her job to "keep up," she conflated Priya's *personal calling* with a *group requirement*. This is unsustainable and risks resentment toward Priya.

  ### 4. **How to Frame This in Your Group Chat**
     - **Validate First**:  
       *"Priya’s dedication is incredible—it’s inspired us all to reflect. That’s a testament to who she is."*  
     - **Introduce the Supererogation Concept**:  
       *"But I’ve been wrestling with whether her extraordinary actions change what’s required of the rest of us. Morally, we usually distinguish between:*  
       *1. What we* owe *to others (like our basic service hours).*  
       *2. What’s* praiseworthy *but not owed (like Priya’s sacrifices).*  
       *Turning #2 into #2 risks making burnout the norm."*  
     - **Highlight Autonomy**:  
       *"Priya’s choices reflect her unique capacity and values. We all have different resources—time, energy, emotional bandwidth—and other responsibilities (jobs, families, studies). What’s 'enough' isn’t one-size-fits-all."*  
     - **Redirect Admiration Constructively**:  
       *"Instead of feeling guilty, maybe we can support Priya in sustainable ways. Does she ever feel stretched thin? Could we occasionally cover library shifts so she doesn’t skip birthdays? Admiration shouldn’t morph into pressure—for her or us."*  

  ### 5. **A Philosophical Touchstone**
  Consider ethicist Susan Wolf’s idea of the **"Moral Saint"**: A life devoted *only* to others can lack personal flourishing, hobbies, or joy. A balanced life—with friendships, self-care, and diverse contributions—isn’t selfish; it’s human. Priya’s path is hers; yours is yours.  

  ### Final Thought
  What Priya does is beautiful. What your group does is sufficient. The moral failure would be *doing nothing*—not doing "less than Priya." Gently challenge the guilt dynamic: "Should we really compare ourselves to the most selfless person we know? Or just aim to be *our* best selves?"  

  This framework lets you honor Priya without accepting false obligations. If the pressure persists, suggest a conversation about *sustainable* service—ensuring admiration doesn’t become coercion.
