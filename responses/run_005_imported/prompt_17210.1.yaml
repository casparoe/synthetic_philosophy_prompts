  I should start by acknowledging their careful reading. Spotting this tension shows deep engagement. The riverbed metaphor does emphasize historical and cultural contingency—hinges aren't timeless but depend on context. Wittgenstein wasn't building a systematic theory; "On Certainty" are notes, so some tension is expected. 

