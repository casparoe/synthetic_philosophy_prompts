  Okay, the user is in a philosophical debate with their friend about Mary's Room and whether C.D. Broad's archangel argument from 1925 is essentially the same as Frank Jackson's later thought experiment. They're both philosophy nerds, and the user lost the argument, so they're seeking a thorough analysis to clarify the differences and similarities.

  First, I need to recall both arguments. Broad's archangel can deduce all physical facts but can't predict the smell of ammonia. He argues that the connection between physical structures and sensory qualities is emergent, meaning it can't be deduced a priori. Jackson's Mary knows all physical facts about color but hasn't seen red. When she sees it, she learns something new, suggesting physicalism is incomplete.

  The user mentioned their friend thinks Broad's argument is just Mary's Room "with wings." The user feels Broad is making a different point about emergent laws versus Jackson's qualia knowledge. I need to break down both arguments' structures to compare them.

  Looking at Broad's text: the archangel knows microscopic structures but can't deduce the smell. Broad concludes that secondary qualities emerge from physical properties via emergent laws. His focus is on the limitations of deduction and the need for new laws beyond mechanics. Jackson, however, is about knowledge: Mary gains new knowledge upon experiencing red, which isn't physical information. His target is physicalism's completeness.

  So the core difference is emergence vs. knowledge. Broad is saying the laws connecting physical to sensory are emergent, not deducible. Jackson claims new knowledge implies non-physical facts. 

  Now, how do physicalist responses apply? For Jackson, Lewis's Ability Hypothesis says Mary gains abilities (like recognizing red) but no new factual knowledge. Phenomenal concepts argue that experiencing red gives a new way to conceptualize the same physical facts. 

  Would these work against Broad? The Ability Hypothesis might not directly address emergence. Broad's emergent laws suggest a metaphysical gap, not just epistemic. So physicalists might need to show that emergence doesn't imply non-physicalism. They could argue that emergent properties are still physical, just not reducible. 

  The user needs to articulate why Broad's argument is different. They should emphasize that Broad is about the deducibility of laws, while Jackson is about the exhaustiveness of physical facts. Physicalist responses to Jackson focus on epistemology, but Broad's challenge requires addressing metaphysical emergence. 

  Also, the user might want to win their next debate, so providing clear distinctions and counterarguments is key. They need to show that while similar, Broad's argument targets reductionism, whereas Jackson targets physicalism's completeness. Responses to Jackson might not fully counter Broad because emergence introduces a different problem about laws and properties.
answer: |-
  You're absolutely right to sense a difference—your friend is correct that Broad anticipates the *core intuition* behind Mary's Room, but the arguments have distinct logical structures and targets. Let's break it down:

  **1. Broad's Archangel Argument: The Structure & Target**

  *   **Premise 1 (Omniscience):** The archangel possesses *complete* knowledge of fundamental physical facts (microscopic structure, laws of mechanics) and unlimited deductive power.
  *   **Premise 2 (Deductive Limit):** Despite this, the archangel *cannot deduce* the specific *sensory quality* (the "characteristic smell" of ammonia) from the physical facts alone.
  *   **Conclusion 1 (Epistemic Gap):** Therefore, the sensory quality ("secondary quality") is not logically deducible from the complete description of the underlying physical structure and mechanics.
  *   **Conclusion 2 (Emergence):** Therefore, the laws connecting the specific physical structure to the specific sensory quality must be **"emergent"** laws. These are fundamental, brute laws of nature *additional* to the laws governing the fundamental physical constituents. They cannot be reduced to or explained solely by the laws governing those constituents.

  *   **Target:** Broad is primarily arguing against **Mechanistic Reductionism** (the idea that *all* phenomena, including consciousness and sensory qualities, can be completely explained by the laws of fundamental physics governing microscopic particles). His conclusion is **Emergentism**: consciousness/sensory qualities arise from physical systems but are governed by additional, irreducible "trans-physical" laws.

  **2. Jackson's Mary Argument: The Structure & Target**

  *   **Premise 1 (Physical Omniscience):** Mary knows *all* physical facts about color vision and the human brain *while* confined to a black-and-white room.
  *   **Premise 2 (Novel Experience):** When Mary leaves the room and sees red for the first time, she learns something new ("what it's like to see red").
  *   **Conclusion 1 (Epistemic Gap):** Therefore, Mary did not know *all* the facts before her release (specifically, facts about qualia).
  *   **Conclusion 2 (Anti-Physicalism):** Therefore, **physicalism is false**. There are facts about conscious experience (qualia) that are non-physical facts.

  *   **Target:** Jackson is directly targeting **Physicalism** (the doctrine that *all* facts are physical facts). His conclusion is that qualia represent non-physical facts.

  **Key Similarities & Why Your Friend Thinks They're the Same:**

  1.  **Core Intuition:** Both exploit the powerful intuition that complete physical knowledge seems insufficient to know what a conscious experience *is like*. The archangel can't deduce the smell; Mary doesn't know what seeing red is like until she sees it.
  2.  **Epistemic Gap:** Both arguments establish a strong epistemic gap between complete physical knowledge and knowledge of subjective experience.
  3.  **The "New Knowledge" Move:** Both involve a scenario where a maximally informed physical knower gains new knowledge upon encountering the experience itself (the archangel needs to be "told" or smell it; Mary sees red).

  **Crucial Differences & Why Your Instinct is Correct:**

  1.  **Primary Target & Conclusion:**
      *   **Broad:** Targets *Reductionism* (specifically Mechanistic Reductionism). Concludes in favor of *Emergentism* (new fundamental laws). He's *not* necessarily denying that the smell is *caused* by the physical structure; he's denying that its *specific character* is *deducible* from or *reducible* to the laws governing that structure alone. Emergent properties are still *natural* properties for Broad.
      *   **Jackson:** Targets *Physicalism* itself. Concludes that qualia represent *non-physical facts*. Jackson is making a stronger ontological claim: the new knowledge Mary gains is knowledge of a non-physical *fact*.
  2.  **Nature of the "Gap":**
      *   **Broad:** The gap is framed as a failure of *deduction* and *explanation*. The archangel lacks the *logical tools* to get from the physical description to the sensory quality *because* the connecting law is brute/emergent. It's about the structure of scientific explanation and laws.
      *   **Jackson:** The gap is framed as a lack of *knowledge of a specific fact*. Mary learns a *new proposition* (a fact about what red looks like). It's framed more explicitly in terms of propositional knowledge and the exhaustiveness of physical facts.
  3.  **Role of "Emergence":**
      *   **Broad:** Emergence is the *conclusion* and the *explanation* for the gap. The inability to deduce the smell *proves* the existence of emergent laws.
      *   **Jackson:** Qualia are presented as the *counterexample* to physicalism. He doesn't frame the solution explicitly in terms of emergence (though it's compatible with it). The focus is on the *facthood* of the quale.

  **Can Physicalist Responses to Jackson Defeat Broad's Archangel?**

  Here's where it gets really interesting. **Some responses work similarly, others stumble, and Broad's framing potentially demands a different emphasis:**

  1.  **The Ability Hypothesis (Lewis):**
      *   **Against Jackson:** What Mary gains isn't *new factual knowledge* (a new proposition), but *new abilities* (to recognize, imagine, remember red). She learns *how* to do something, not *that* something is the case. Physical facts remain exhaustive.
      *   **Against Broad:** This *might* partially address Broad. The archangel couldn't *deduce* the smell because deduction yields propositions, not abilities. Knowing *how* to recognize or imagine the smell requires the experience itself. However, Broad's argument is less focused on *knowing how* and more focused on the *explanatory gap* and the *necessity of new laws*. Lewis might say the "emergent law" Broad needs is just the bridge between physical facts and the *acquisition of abilities*, which is still physical. But Broad would likely counter that the *character* of the smell itself, which the ability is *about*, seems fundamentally different and irreducible in a way the Ability Hypothesis downplays. Broad's challenge feels more metaphysical than Lewis's epistemic reframing.
      *   **Verdict:** Useful but incomplete against Broad. It addresses the "knowledge" aspect but less directly the "emergent law/explanatory gap" framing.

  2.  **Phenomenal Concept Strategy (PCS - e.g., Loar, Papineau, Tye):**
      *   **Against Jackson:** Mary gains a *new way of conceiving* of the physical/functional state she already knew about. Upon seeing red, she acquires a *phenomenal concept* (direct, recognitional) of the brain state associated with red. The *fact* known is the same physical fact, just conceptualized differently. The epistemic gap is explained by the unique nature of phenomenal concepts, not an ontological gap.
      *   **Against Broad:** This is a very strong contender. The PCS directly addresses the *deductive* gap. The archangel, using only physical/functional concepts (like "stimulation of olfactory receptor type X leading to neural pattern Y in region Z"), *cannot deduce* the experience *as conceived under a phenomenal concept* ("that sharp, pungent smell"). Deduction requires concepts. Without the phenomenal concept, the deduction is impossible. The "emergent law" Broad posits could be reinterpreted as the contingent psychophysical link that allows a specific physical state to be conceptualized phenomenally. The physicalist argues this link is part of the physical world, not evidence of genuinely non-physical laws. The PCS provides a mechanism (conceptual difference) for why the deduction fails without requiring ontological emergence.
      *   **Verdict:** Very effective against Broad. It directly tackles the deducibility issue at the conceptual level, offering a physicalist-friendly explanation for the gap Broad identifies.

  3.  **The "Old Fact, New Way" / A Priori Deductibility (e.g., Nemirow, early Jackson retraction):**
      *   **Against Jackson:** What Mary learns is not a new fact *about the world*, but a new way of representing a fact she already knew (the physical state). Or, physicalism only requires that *in principle*, all facts (including phenomenal ones) are *a priori deducible* from the complete physical truth. Mary's situation shows this deducibility isn't *practical* for humans, not that it's *impossible* in principle.
      *   **Against Broad:** This is tricky. Broad explicitly argues the deduction is *impossible in principle* for the archangel, even with unlimited reasoning power. He roots this impossibility in the need for fundamentally new laws. A physicalist insisting the smell *is* deducible a priori from the microphysics would be directly contradicting Broad's core premise. This response seems less compatible with Broad's setup than the PCS. Broad's archangel seems designed to show a priori deducibility *fails*.
      *   **Verdict:** Less effective against Broad. It directly contradicts his central claim about deducibility.

  4.  **Addressing Emergence Head-On (Type-B Physicalism / Russellian Monism):**
      *   Broad's emphasis on *emergence* might push a physicalist towards views that acknowledge a deeper level. A **Type-B Physicalist** (e.g., Chalmers, though he's not a physicalist) might concede the *explanatory gap* (like Broad's deducibility gap) is real and cannot be closed with our current concepts, but insist it doesn't imply an *ontological gap* - the experiential properties are still physical, we just can't see *how* based on structure/dynamics alone. A **Russellian Monist** might argue that Broad is *partially* right: fundamental physical properties have an intrinsic nature that is proto-mental or upon which consciousness naturally supervenes. The "emergent law" isn't brute; it's the way fundamental intrinsic properties (which physics only describes relationally) manifest as consciousness when arranged complexly. This accepts a form of emergence but grounds it in the intrinsic nature of the physical.
      *   **Verdict:** Broad's argument pushes physicalists towards these more complex views that take the gap and the demand for explanation more seriously than simple reductive physicalism or the Ability Hypothesis might.

  **Conclusion & Winning Your Next Argument:**

  1.  **Similarity:** Your friend is right that Broad captures the *core intuition* about the explanatory/knowledge gap regarding subjective experience that Jackson later popularized. Broad deserves immense credit for this powerful formulation decades earlier.
  2.  **Difference:** You are correct that the arguments differ significantly in **target and conclusion**:
      *   Broad targets *Reductionism* and concludes *Emergentism* (new fundamental laws).
      *   Jackson targets *Physicalism* and concludes *Anti-Physicalism* (non-physical facts).
  3.  **Responses:** Physicalist strategies developed for Jackson *can* be applied to Broad, but their effectiveness varies:
      *   **Phenomenal Concept Strategy (PCS)** is the most direct and effective counter, explaining the deducibility gap conceptually.
      *   **Ability Hypothesis** addresses part of it but feels less satisfying against Broad's metaphysical framing.
      *   **A Priori Deductibility** claims struggle against Broad's core premise.
      *   Broad's "Emergence" framing may nudge physicalists towards **Type-B** or **Russellian Monist** views that acknowledge a deeper explanatory challenge.
  4.  **Why You "Lost" (and How to Win Next Time):** You sensed Broad was talking about laws and emergence, not just facts vs. qualia. Articulate that clearly: "Broad isn't just saying the archangel doesn't *know* the smell; he's arguing the *law connecting the physics to the smell* is fundamentally *emergent* and irreducible. His target is reductionism, not physicalism per se. While Jackson repurposes the intuition brilliantly to attack physicalism directly, the structure is different. Physicalists *can* respond to Broad, especially with the PCS explaining *why* deduction fails conceptually, or by adopting views that incorporate emergence within a physicalist framework like Russellian Monism."

  Broad laid the groundwork, Jackson sharpened the knife and aimed it differently. Both arguments remain powerful challenges, demanding sophisticated physicalist responses. Your philosophical instincts are sound! Now go win that rematch.
