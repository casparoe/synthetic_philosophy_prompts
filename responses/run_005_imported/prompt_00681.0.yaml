answer: |-
  This is a deeply thoughtful dilemma at the heart of zoning ethics. There *is* a principled way to weigh "community character" concerns against the absence of proven harm, but it requires careful, rigorous analysis to avoid collapsing into mere prejudice. Here's a framework to consider:

  1.  **Legally Valid Grounds: "Community Character" CAN Be Legitimate:**
      *   **Zoning Law Recognizes Character:** Protecting the "character" of a district (e.g., historic, residential, family-oriented commercial) is a traditional and legally accepted purpose of zoning. The Supreme Court (e.g., *Young v. American Mini Theatres*) has acknowledged that localities *can* regulate adult uses based on their *secondary effects* (crime, property values) *and* to preserve community character, though the latter must be carefully defined.
      *   **"Secondary Effects" Doctrine (Use with Caution):** Courts often allow regulation based on the *presumed* negative secondary effects of adult businesses. However, **your observation is crucial:** if opponents presented *no evidence* of these effects (crime stats, traffic studies, property value analyses), relying solely on this doctrine *without local evidence* is weak and potentially vulnerable to legal challenge. A denial based *only* on assumed effects could be seen as pretextual.

  2.  **Moving Beyond Vague Discomfort: Defining "Character" Concretely:**
      *   **Reject Vagueness:** "This isn't who we are" is meaningless legally and ethically without specificity. **Demand Concreteness:** What *specific* aspects of the town's character are threatened? Is it:
          *   **Physical Character:** Proximity to schools, churches, parks, historic districts, or primarily family-oriented businesses?
          *   **Economic Character:** Being marketed as a tourist/family destination? Dominated by daytime retail/service businesses incompatible with late-night adult venues?
          *   **Social Character:** A demonstrable pattern of community events, public spaces, or investments aimed explicitly at families or a certain "vibe" (e.g., artsy, historic, outdoor recreation)?
          *   **Operational Impacts:** Hours of operation, exterior signage, lighting, noise, or clientele behavior conflicting with adjacent uses?
      *   **Evidence, Not Emotion:** Can proponents of the "character" argument point to specific plans, investments, ordinances, or established patterns of use that define this character? Does the *specific location* make this use incompatible?

  3.  **The Principled Balancing Test: Harm vs. Values vs. Rights:**
      *   **Identify the Actual Harm/Conflict:** Is the harm *only* offense to sensibilities? Or is there a *demonstrable conflict* with the *physical function or established purpose* of the area? (e.g., A loud, late-night venue next to a quiet residential zone *is* a functional conflict, regardless of content).
      *   **Weight of Community Values:** A community's *demonstrated* investment in a specific character (e.g., decades fostering a historic downtown, recent major investments in family-friendly amenities) carries more weight than vague discomfort. Values become more legitimate when tied to tangible community planning and investment.
      *   **Business Owner's Rights:** The applicant has legal rights to operate a lawful business. Denial based purely on subjective distaste is legally suspect and ethically problematic.
      *   **The Least Restrictive Means:** Even if character is a valid concern, is *denial* the only option? Could conditional approval (e.g., strict signage limits, buffering requirements, limited hours, specific entrance location) mitigate the perceived conflict without banning the use? **This is often the most ethical and legally sound approach.**

  4.  **Avoiding the "Majority Taste" Trap:**
      *   **Scrutinize Motive:** Is the opposition truly about *character* defined by land use, or is it moral disapproval disguised as character? Listen carefully to the *language* used. Moralizing language ("immoral," "sinful," "degrading") signals potential unconstitutional viewpoint discrimination.
      *   **Protect Minority Views:** Just because many residents find it distasteful doesn't make their preference determinative. Zoning should protect rights, not just cater to the majority's comfort.
      *   **Focus on Land Use, Not Content:** Frame the discussion around *where* such uses are appropriate based on *land use compatibility*, not whether the *content* is good or bad. Ask: "Would *any* late-night entertainment venue with similar operational characteristics (noise, hours, clientele volume) be problematic in this location?"

  **Recommendations for Your Vote & Deliberation:**

  1.  **Insist on Specifics:** During board discussion, push colleagues to articulate the *specific* threat to *defined* community character, separate from moral disapproval.
  2.  **Examine the Location:** Is this parcel genuinely incompatible with surrounding uses *based on operational characteristics*? Review the zoning code's intent for this district.
  3.  **Consider Conditions:** Propose exploring conditions of approval to address potential character conflicts (signage, lighting, hours, management plans) rather than outright denial.
  4.  **Demand Evidence if Citing Harm:** If secondary effects are discussed, insist on local data or credible studies. Don't rely on assumptions.
  5.  **Acknowledge the Discomfort Honestly:** You can say, "While many residents find this use distasteful, distaste alone is not a legally sufficient basis for denial. We must focus on whether this specific location, with potential conditions, creates a demonstrable conflict with the defined character or function of this zoning district."
  6.  **Vote Based on Land Use Rationale:** Base your decision on a concrete land use rationale (compatibility, operational conflicts, location-specific character defined in the plan/code) supported by evidence from the record, or vote to approve if no such rationale exists.

  **Conclusion:** Yes, "community character" *can* be a principled factor, but **only when it is concretely defined, tied to specific land use goals or physical incompatibilities, and not merely a mask for moral disapproval or unsubstantiated fears.** Your role is to rigorously separate legitimate land use concerns from unconstitutional viewpoint discrimination. If the objections boil down to "we don't like it" without demonstrating a concrete conflict with the area's *defined function or character*, then approval, potentially with mitigating conditions, is likely the most principled outcome.
