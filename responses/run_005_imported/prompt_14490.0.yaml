  For the recommendation: Human routing strikes the best balance. It avoids the paternalism of outright refusal (respecting the professional framing) while addressing legitimate "what if?" worries. Crucially, it treats the policy as a living document - showing how standards can evolve without being discarded. The key is framing this not as policy failure but as responsible calibration. 

