answer: |-
  Your unease points to something profound and real—a tension between two valid perspectives on human agency that philosophers and scientists have grappled with for centuries. Your friend’s argument about neural randomness doesn’t fully resolve this, and your discomfort reveals why. Let’s break this down:

  ### 1. **The Limits of "Randomness" as a Solution**
     - While it’s true that the brain isn’t *deterministic* in the way a clock is (due to quantum randomness, chaotic neural firing, etc.), **randomness ≠ free will or deservingness**. A random neural event isn’t "chosen" by *you*—it’s still a product of blind physics or biology. As philosopher Galen Strawson argues: *If my actions are determined by prior causes (genes/upbringing), I’m not free. If they’re random, I’m also not free—I didn’t author the randomness.*  
     - Your friend’s point might counter strict determinism, but it doesn’t create room for the kind of "self-creation" we intuitively associate with deserving credit. Randomness might make outcomes unpredictable, but it doesn’t make them *yours* in a way that satisfies your need to "earn" praise.

  ### 2. **The Deeper Source of Your Unease**
     You’re touching on what philosophers call **"the problem of moral luck"** (Nagel) and **"the illusion of self-authorship"** (Strawson). Your insight is correct: 
     - **Temperament/Genes**: You didn’t choose your innate drive or focus.  
     - **Upbringing**: Your parents’ values and structure shaped your habits before you could "consent" to them.  
     - **Luck**: Early breaks (e.g., meeting a mentor, avoiding crises) set conditions for later success.  
     - **Even your "efforts"**: Your attempts to build discipline were likely *fueled* by the very temperament and upbringing you question.  

     This creates a **regress problem**: If every effort stems from prior unchosen causes, where does "I did this myself" begin? This isn’t just theoretical—it’s why praise feels unearned. You sense that your discipline isn’t a *pure achievement* but an *unfolding of givens*.

  ### 3. **A More Nuanced View: Agency Within Constraints**
     While you may not have ultimate self-creation, you still exercise **meaningful agency**:
     - **Endorsement and Effort**: Even if your drive originates in temperament, *how you channel it* matters. Facing obstacles (your degree, business) required *persistent focus* and *value-driven choices*—actions that weren’t guaranteed by your starting point. As philosopher Susan Wolf notes, we deserve credit when our actions align with our "deep self" (values we reflectively endorse).  
     - **Responsiveness to Reasons**: When you chose to push through difficulty *because you valued the goal*, that wasn’t randomness—it was a rational response. This is the heart of compatibilist free will (Dennett, Frankfurt): agency lies in acting for reasons *you identify with*.  
     - **Ownership Without Origin**: Think of your discipline as a tool you inherited. You didn’t forge the tool, but *you wielded it skillfully*. Credit lies in the *deployment* of your traits—especially when others with similar advantages didn’t act as you did.

  ### 4. **A Path Forward: Reframing Deservingness**
     Instead of asking, "Did I *cause* my discipline?" (which leads to infinite regress), ask:  
     - **"Do I *own* these actions?"** (Did they express your values?)  
     - **"Did they require *genuine struggle*?"** (Even if rooted in temperament, effort *felt* real.)  
     - **"Are my actions *praiseworthy*?"** (Praise isn’t just for creating traits but for using them well—e.g., we praise kind people even if kindness is innate.)  

     This shifts credit from *self-creation* to *self-direction*. Your achievements *are* yours because they reflect your sustained commitment to goals you cared about—not because you magically authored your genes.

  ### Why Your Friend’s Answer Felt Unsatisfying
  It reduced a rich philosophical question about identity and merit to a narrow scientific point. Random neural firing might disrupt determinism, but it doesn’t address your deeper concern: **"Am *I* the true source of my successes, or a conduit for luck and biology?"** 

  ### The Takeaway
  Your unease is valid—it points to the humbling truth that no one is an "unmoved mover." Yet this doesn’t erase your worth. **Credit isn’t binary**; it exists on a spectrum of agency. You deserve praise not because you created yourself ex nihilo, but because you *leaned into* your strengths, navigated challenges with integrity, and built something meaningful *with* the cards you were dealt. That’s where genuine pride lives—not in absolute self-creation, but in faithful stewardship of your gifts.  

  As you move forward, consider this reframe:  
  *"I didn’t choose my starting point, but I chose how to run the race—and that deserves acknowledgement."*
