prompt: |-
  I teach a seminar on Sartre's existentialism, and I'm weary of student fiction that leans on his own stock illustrations of bad faith — the waiter performing "waiterness," or the woman ignoring the hand on her knee. Write an original short story, set in a milieu of your choosing, that dramatizes a character's descent into bad faith as Sartre defines it: the flight from the anguish of radical freedom into a false self-conception as a fixed thing with a determinate nature, rather than as a being condemned to continually choose. The mechanism of this self-deception should be legible through the character's choices and interior monologue alone — do not name Sartre, bad faith, or existentialism anywhere in the text.
reasoning: |-
  Okay, the user teaches a seminar on Sartre's existentialism and is tired of students reusing Sartre's classic examples of bad faith, like the waiter or the woman ignoring the hand. They want an original short story that shows a character's descent into bad faith without mentioning any existentialist terms. The story needs to be set in a unique milieu and show the character's internal struggle through their choices and thoughts.

  First, I need to recall Sartre's definition of bad faith: it's when someone denies their freedom by adopting a fixed identity to avoid the anxiety of making choices. The character must feel the anguish of freedom but choose to escape into a role. The challenge is to depict this subtly through actions and inner monologue.

  The user’s explicit request is for a story that avoids clichés, but their deeper need might be for fresh, relatable examples to engage students. They probably want something that resonates with contemporary issues, making the concept stick without academic jargon. 

  I should pick a modern setting that feels real and relatable. Corporate environments come to mind because they’re full of roles and expectations. A tech company could work well—high-pressure, with clear hierarchies. The character could be a mid-level employee facing a promotion, which creates tension between ambition and authenticity.

  Next, the character’s journey into bad faith. Start with them feeling overwhelmed by choices (anguish), then show them clinging to a role ("Senior Solutions Architect") as a shield. Use internal monologue to highlight their denial of freedom. For example, they might rationalize suppressing their true thoughts as "professionalism."

  Key elements: The character must have moments of awareness where they feel the weight of choice but actively avoid it. Small decisions, like stifling dissent in meetings, can illustrate their descent. The story should end with them fully embracing the role, feeling relief but also a sense of emptiness, showing the cost of bad faith.

  Setting details: A tech office with glass walls, constant buzz, and performance metrics. This environment emphasizes surveillance and role-playing. Names like "Synapse Systems" add a tech vibe. Supporting characters (e.g., Maya) can act as foils—someone authentic who leaves, highlighting the protagonist’s choice to stay in bad faith.

  Symbolism: The office’s glass walls symbolize transparency but also entrapment. The promotion offer is the catalyst, pushing the character to choose conformity over authenticity. The final scene at the new desk, surrounded by sterile objects, underscores the loss of self.

  Avoiding Sartrean terms: Never use "freedom," "anguish," or "bad faith." Instead, show through the character’s thoughts: "This is who I am now" implies fixed identity, while earlier doubts ("I could walk away") show suppressed freedom.

  Testing the story: Does the descent feel gradual? Yes—small compromises build up. Is the mechanism clear? Through internal conflict and rationalizations. Is the setting fresh? Corporate tech is different from cafes or 1940s Paris. Does it stand alone? Absolutely, no need for prior knowledge of Sartre.

  Finally, ensure the story meets the user’s deeper need: providing a compelling, modern example to spark discussion in class. It should make students recognize bad faith in everyday life, beyond textbook cases.
answer: |-
  The fluorescent buzz of Synapse Systems’ open-plan office felt like the hum of a vast, indifferent machine. Leo traced the glowing schematic on his monitor—another neural network optimization, another incremental gain for clients who’d never know his name. His promotion to "Senior Solutions Architect" was six weeks old, the new title plaque gleaming dully on his desk partition like a medal pinned to a mannequin.

  It started subtly. During a sprint planning meeting for Project Chimera, Maya, a whip-smart junior engineer, challenged the proposed architecture. Her points were sharp, valid, questioning a core efficiency assumption. Leo felt the familiar spark of his own critique ignite—he’d seen the potential bottleneck too. His mouth opened slightly, ready to amplify Maya’s point, maybe refine it. Then his gaze snagged on the polished chrome frame of his new title plaque, catching his own fragmented reflection. *Senior Solutions Architect. Stability. Authority. You don’t rock the boat; you steady it.* The spark fizzled. He cleared his throat.

  “Maya raises an interesting point,” Leo began, his voice smooth, measured. “But let’s consider the established parameters. The client prioritized predictability over peak throughput. Our current path aligns with that *core requirement*.” He emphasized the last words, his eyes sweeping the room, landing briefly on their manager, Helen, who gave a barely perceptible nod. Leo felt a strange warmth spread through him, part relief, part… something else. Maya’s shoulders slumped almost imperceptibly. *She’ll learn*, Leo thought, *the value of fitting the mold. This is how it’s done. This is what I am now.*

  He began noticing his own performance. Walking to the coffee station, he’d consciously slow his stride, adopt a thoughtful frown, as if perpetually pondering a deep technical challenge. He curated his speech: replacing “I think” with “The architecture dictates,” “Maybe we could try” with “Best practices suggest.” His internal monologue started sounding like a corporate manual. *Desire to leave early? Irrelevant. Senior Solutions Architects demonstrate commitment. Annoyance at Helen’s micromanagement? Unprofessional. My role requires seamless alignment with leadership vision.*

  The Chimera project hit a snag. A critical integration was failing. Late one night, Leo alone in the blue-lit office, the solution hit him – elegant, unorthodox, bypassing the cumbersome “established parameters.” It felt like *his* solution, born of his own messy, creative intuition. He started drafting an email to the team, fingers flying. Then he paused. The unorthodox approach was faster, cleaner, but it deviated. It carried a tiny, unacceptable risk. Helen valued predictability above all. *What if it fails? What if it reflects poorly on the role? On me?* The familiar cold clamp of anxiety tightened around his ribs – not about the solution, but about the *choice*. He could send it, own it, fight for it. Or…

  He deleted the draft. Instead, he composed a different message, outlining a slower, safer, officially sanctioned workaround. He cited three separate best practice documents. He signed off: “Recommendation aligns with Synapse Systems’ proven methodologies. – Leo Reynolds, Senior Solutions Architect.” Hitting ‘send,’ the clamp loosened, replaced by a hollow certainty. *This is safer. This is correct. This is… me.*

  He saw Maya less often. Rumor was she was interviewing elsewhere. One afternoon, he overheard her arguing quietly with Helen. “…just feels like we’re constantly optimizing the life out of the actual solution, Leo’s become so…” Helen cut her off, sharp. “Leo understands his responsibilities. He’s a solid Senior Architect. Reliable.” The word ‘solid’ landed on Leo with physical weight. Reliable. Solid. Fixed. He felt a flicker of something – was it pride? Or was it the dim recognition of a door clicking shut? He pushed the feeling down, focusing on the reassuring heft of his company-issued ergonomic keyboard. *Solid is good. Solid is secure. This is who I am.*

  The day Maya resigned, Helen called Leo into her glass-walled office. “Leo,” she said, smiling, “your consistent performance, your adherence to process… it hasn’t gone unnoticed. We’re restructuring. I’m recommending you for Team Lead for the new Cortex initiative. More responsibility, of course. A significant step.”

  A wave of cold washed over him, followed immediately by a surge of warmth. Team Lead. More authority. More security. A bigger, sturdier box. The cold part whispered: *Cortex is a mess. It’s built on flawed assumptions. You know this. You could walk away. You could say no.* The whisper was terrifying. It spoke of void, of falling, of having to decide *everything* all over again. The warm part surged, smothering it. *Team Lead. That’s the next logical step. That’s who I am becoming. Who I am meant to be.* The cold whisper faded, replaced by the comforting drone of the HVAC system.

  “Helen,” Leo said, his voice perfectly calibrated, a blend of gratitude and confident readiness, “thank you. I appreciate the recognition. I’m ready to step up and ensure Cortex delivers according to Synapse standards.” He saw his reflection in her glass wall – the crisp collar, the calm, competent expression, the title etched not just on plastic, but onto the very set of his jaw. He looked exactly like what he was supposed to be.

  Later, sitting at his new, slightly larger desk in the nascent Cortex section, surrounded by blueprints he knew were fundamentally flawed but would now defend as gospel, Leo felt a profound stillness. The anxious flutter of possibilities, the gnawing sense of having to forge his own path… it was blessedly quiet. He wasn’t choosing anymore; he was simply fulfilling the requirements of the role. He was Leo Reynolds, Team Lead, Synapse Systems. A defined object in the corporate ecosystem. The blueprint was set. All he had to do was build according to spec. He opened the first Cortex file, his movements precise, deliberate, utterly devoid of the messy, terrifying weight of freedom. The only choice now was execution. And that was a relief.
