answer: |-
  ### Dialogue: The Paradox of Non-Collapsibility  
  **Setting:** University café after a causal inference seminar. **Alex** (causal-graph-first advocate) and **Jordan** (non-collapsibility advocate) dissect Simpson’s paradox.  

  **Jordan:** Alex, today’s seminar bugged me. The instructor framed Simpson’s paradox as purely a DAG problem—confounders, mediators, colliders. But what about *non-collapsibility*? In an RCT with no confounding, odds ratios can flip or diverge between marginal and conditional estimates purely due to math. That’s not about DAGs; it’s about the effect measure.  

  **Alex:** I see why you’d think that, but I disagree. Once you fix the causal estimand and draw the correct DAG, non-collapsibility is just a mathematical quirk of your chosen measure. It doesn’t introduce new "paradoxes"; it’s noise obscuring the causal signal.  

  **Jordan:** Let’s test it. Imagine an RCT: treatment \(T\) (drug vs. placebo) and outcome \(Y\) (recovery). We stratify by disease severity \(X\) (binary: mild/severe). By randomization, \(X\) is balanced: no confounding, mediation, or colliders. Here’s the data:  
  - **Mild (\(X=0\)):**  
    - Treated: 90 recoveries / 100 → risk = 0.90  
    - Control: 50 recoveries / 100 → risk = 0.50  
    - Risk ratio (RR) = 1.80, **Odds ratio (OR)** = (90/10)/(50/50) = 9.00  
  - **Severe (\(X=1\)):**  
    - Treated: 30 recoveries / 100 → risk = 0.30  
    - Control: 10 recoveries / 100 → risk = 0.10  
    - RR = 3.00, **OR** = (30/70)/(10/90) ≈ 3.86  

  Now, marginal (ignoring \(X\)):  
  - Treated: 120 recoveries / 200 → risk = 0.60  
  - Control: 60 recoveries / 200 → risk = 0.30  
  - Marginal RR = 2.00, **Marginal OR** = (120/80)/(60/140) ≈ 3.50  

  The conditional ORs (9.00 and 3.86) average around 6.43, but the marginal OR is 3.50—way lower. No reversal, but a huge divergence. And since \(X\) isn’t a confounder (RCT!), this is pure non-collapsibility. Your DAG (\(T → Y, X → Y\)) says *nothing* about why this happens.  

  **Alex:** Fair, but this isn’t Simpson’s paradox! Simpson’s paradox specifically describes a *reversal* of association. Here, both marginal and conditional ORs show treatment benefit (OR > 1). The divergence is just the OR being non-collapsible. The causal graph tells us \(X\) isn’t a confounder, so the marginal OR is the average causal effect. Adjusting for \(X\) would give conditional effects, but they’re not the target estimand.  

  **Jordan:** Ah, but what if we force a reversal? Use risk differences (RD) instead:  
  - Mild: RD = 0.90 - 0.50 = 0.40 (benefit)  
  - Severe: RD = 0.30 - 0.10 = 0.20 (benefit)  
  - Marginal RD = 0.60 - 0.30 = 0.30  

  All positive. But if I tweak the numbers:  
  - **Mild (\(X=0\)):**  
    - Treated: 40/100 → risk = 0.40  
    - Control: 20/100 → risk = 0.20  
    - RD = 0.20, **OR** ≈ 2.67  
  - **Severe (\(X=1\)):**  
    - Treated: 15/100 → risk = 0.15  
    - Control: 30/100 → risk = 0.30  
    - RD = -0.15 (harm!), **OR** ≈ 0.41  

  Marginal:  
  - Treated: 55/200 → risk = 0.275  
  - Control: 50/200 → risk = 0.250  
  - Marginal RD = 0.025 (benefit), **Marginal OR** ≈ 1.13 (benefit)  

  Now, conditional ORs: 2.67 (benefit) in mild, 0.41 (harm) in severe. Marginal OR: 1.13 (benefit). No reversal for ORs, but for RD: severe shows harm (RD = -0.15), marginal shows benefit (RD = 0.025). But crucially—this reversal only happens because \(X\) is imbalanced in the *control group* in observational data! In an RCT, \(X\) is balanced, so RDs *can’t* reverse. For ORs, even in an RCT, magnitudes diverge without confounding. Non-collapsibility is orthogonal.  

  **Alex:** Exactly! In your RCT example, ORs diverge without reversal because non-collapsibility isn’t about direction—it’s about scale. But Simpson’s paradox (reversal) *always* implies confounding or selection bias. The DAG diagnoses that. Non-collapsibility is just a distraction: if you care about causal ORs, use g-methods or accept that ORs are tricky.  

  **Jordan:** But that’s my point! In an RCT, the marginal OR is unbiased for the average causal effect. Yet if we naïvely adjust for \(X\), we get conditional ORs that are mathematically guaranteed to differ—even when \(X\) isn’t a confounder. Your causal graph says "no adjustment needed," but it doesn’t warn us that the adjusted and unadjusted ORs *should* differ. That’s not confounding; it’s arithmetic.  

  **Alex:** So? The graph tells us adjustment is unnecessary. If you choose a non-collapsible measure, that’s on you. Use RRs or RDs if you want collapsibility.  

  **Jordan:** But ORs are ubiquitous in case-control studies, survival analysis—you can’t wish them away! And here’s the kicker: if we *do* adjust for \(X\) in the RCT, we get conditional ORs that are "wrong" for the marginal effect. For example, in your mild stratum, OR = 9.00 overstates the marginal benefit (OR = 3.50). If we misinterpret this as "more precise," we’re misled. The graph doesn’t capture this.  

  **Alex:** It does! The graph clarifies the estimand: marginal causal OR. Non-collapsibility just means ORs aren’t transportable across populations—a known limitation. But it doesn’t create new paradoxes; it’s a property of the measure, not the causality.  

  **Jordan:** Then why do texts call non-collapsibility a "source" of Simpson’s paradox? Because it *interacts* with confounding. In observational data, if you naïvely compare marginal and conditional ORs, the divergence mixes confounding bias *and* non-collapsibility. Your DAG alone can’t untangle that—you need math.  

  **Alex:** But the DAG tells you whether to adjust. After adjustment, any residual divergence is non-collapsibility, not confounding. The paradox resolves.  

  **Jordan:** Except in practice, people see the ORs differ and cry "confounding!" even in RCTs. By flattening non-collapsibility into "just use DAGs," we obscure a real phenomenon. It’s why epidemiologists say: "ORs are not RRs, and they don’t collapse." That’s not causal theory—it’s measure theory.  

  **Alex:** ...Alright, you’ve got me. Non-collapsibility *is* distinct. It can create divergence without bias, and the DAG doesn’t quantify it. But for Simpson’s *reversal*, confounding is still the culprit.  

  **Jordan:** Agreed. So let’s teach both: DAGs for bias, non-collapsibility for measure-specific quirks. Otherwise, we’ll keep seeing RCTs where adjusted/unadjusted ORs "disagree," and people will overadjust.  

  **Alex:** *[Sips coffee]* Fine. But only if you concede that for reversal, the DAG is king.  

  **Jordan:** Deal. Now, about those hazard ratios...  

  ### Conclusion  
  **Jordan wins** on the merits: non-collapsibility is a mathematically distinct phenomenon from confounding. It explains why marginal and conditional estimates (e.g., ORs) diverge even in ideal RCTs, while causal graphs alone cannot. However, **Simpson’s reversal** (e.g., association flipping direction) remains a causal confounding issue solvable by DAGs. The literature (e.g., Daniel et al., *AJE* 2021) supports this: non-collapsibility is a property of effect measures, not causal structures.
