answer: |-
  You've hit upon one of the most subtle and philosophically charged debates in modern decision theory. Let's dissect the Kelly criterion, ergodicity economics, and expected utility theory systematically. The distinction between "geometric rationality" (time-average optimization) and expected utility maximization is profound—both mathematically and conceptually—though often obscured by the shared use of the logarithm.

  ### Core Distinction: Time-Averages vs. Ensemble Averages
  1. **Ergodicity Economics (Peters' Framework)**:
     - **Premise**: Wealth evolves *multiplicatively* (geometric Brownian motion). The process is non-ergodic: the time-average growth rate along a single trajectory \(\lim_{T \to \infty} \frac{1}{T} \log \frac{W_T}{W_0}\) does *not* equal the ensemble average \(\mathbb{E}[\log \frac{W_t}{W_0}]\) for finite \(t\).
     - **Objective**: Maximize the time-average growth rate:  
       \[
       g = \mathbb{E}[\log(1 + f \cdot r)] 
       \]
       where \(f\) is the fraction bet, and \(r\) is the stochastic return. This is derived from the law of large numbers for multiplicative processes.
     - **Philosophy**: No subjective utility function. The logarithm emerges from the *dynamics* (multiplicative growth), not psychology. It’s a "physical" observable: the growth rate a single agent experiences over time.

  2. **Expected Utility Theory (EUT)**:
     - **Premise**: Maximize \(\mathbb{E}[U(W)]\), where \(U\) is a concave utility function encoding risk aversion.
     - **Kelly as Special Case**: If \(U(W) = \log W\), maximizing \(\mathbb{E}[\log W]\) maximizes long-term growth. But this treats \(\log\) as one utility function among many (e.g., \(U(W) = W^{1-\gamma}/(1-\gamma)\) for CRRA).
     - **Philosophy**: The choice of \(U\) is subjective. \(\log\) utility implies a specific risk preference (gambling indefinitely, bankruptcy aversion).

  ### Key Differences: Beyond Shared Algebra
  While both frameworks maximize \(\mathbb{E}[\log W]\), their foundations diverge:

  | **Aspect**               | **Geometric Rationality (Peters)**        | **Expected Utility Theory**               |
  |--------------------------|------------------------------------------|------------------------------------------|
  | **Origin of \(\log\)**   | Dynamics of multiplicative growth        | Assumed risk preference (concave utility) |
  | **Risk Preference**      | None assumed; "objective" growth maximization | Subjective (embedded in \(U\))          |
  | **Ergodicity Focus**     | Critical: non-ergodicity invalidates ensemble averages | Often ignored; relies on ergodic axioms |
  | **Single vs. Repeated Bets** | Only defined for repeated bets (time-average) | Applies to single bets via \(\mathbb{E}[U]\) |
  | **Bankruptcy**           | Avoided (growth rate \(\to -\infty\))    | Handled by \(U'(W) \to \infty\) as \(W \to 0\) |

  ### Samuelson's Critique: Does Geometric Rationality Escape It?
  Samuelson’s 1979 paper attacked the *universalization* of max \(\mathbb{E}[\log W]\) for all decision contexts. His core arguments:
  1. **Finite Horizons**: For finitely repeated bets, max \(\mathbb{E}[\log W]\) may not dominate other strategies.
  2. **Non-Multiplicative Contexts**: Applying Kelly to additive risks (e.g., income shocks) is invalid.
  3. **Utility Arbitrariness**: Demanding \(\log\) utility ignores individual risk tolerance.

  **Geometric rationality responds**:
  - **Restricted Domain**: Peters explicitly limits geometric rationality to *repeated multiplicative processes*. It makes no claim about additive risks or single bets. Samuelson’s critique of over-extension is thus pre-empted.
  - **No Utility Assumption**: By deriving \(\log\) from dynamics (not preferences), geometric rationality avoids "imposing" risk aversion. It answers: "What *must* you do to survive in multiplicative systems?"  
  - **Time-Average Justification**: For infinitely repeated bets, max \(g\) is the only strategy ensuring non-zero wealth almost surely. Samuelson’s finite-horizon concerns remain valid but are orthogonal.

  ### Why the Confusion? The Duality of \(\log\)
  The logarithm appears in both frameworks because it uniquely satisfies:
  - **Utility Perspective**: \(\log W\) has constant relative risk aversion (CRRA = 1).
  - **Dynamic Perspective**: \(\log W\) converts multiplicative dynamics to additive ones (via Itô’s lemma), making time-averages tractable.

  This duality masks a deeper rift:
  - **EUT** sees \(\log\) as a *tool* for modeling preferences.
  - **Geometric rationality** sees \(\log\) as a *consequence* of multiplicative ergodic theory.

  ### Conclusion: Distinct Philosophies, Shared Math
  1. **Geometric rationality is not repackaged EUT**:  
     - It replaces subjective utility with an objective growth-rate observable.  
     - It *restricts* applicability to ergodic (or non-ergodic) multiplicative systems, avoiding Samuelson’s over-extension critique.  
     - Its normative force comes from survival in repeated gambles, not preference satisfaction.

  2. **Samuelson’s critique is partially defanged**:  
     - Geometric rationality doesn’t advocate \(\mathbb{E}[\log W]\) as a universal rule. It’s a physics-derived strategy for multiplicative systems. Samuelson’s warnings about finite horizons still apply but are acknowledged in the framework.

  3. **The Irreducible Difference**:  
     - EUT answers: "What should I do given my preferences?"  
     - Geometric rationality answers: "What should I do to avoid ruin and grow wealth in this specific dynamic system?"  

  Your colleague is right that the *algebra* overlaps, but Peters’ emphasis on non-ergodicity reveals a foundational shift: the ensemble average \(\mathbb{E}[\log W]\) is justified not because it models risk aversion, but because it equals the time-average growth rate—a physically meaningful quantity for a single trajectory. This reframes Kelly as a law of *dynamics* rather than a utility-based axiom. Whether this constitutes a "genuinely distinct normative principle" depends on whether one views dynamic survival as a deeper imperative than preference satisfaction. For multiplicative systems, geometric rationality offers a compelling, physics-grounded alternative to subjective utility.

  > "The Kelly strategy is not about utility; it’s about the geometry of survival."  
  > — Ole Peters (paraphrased)
