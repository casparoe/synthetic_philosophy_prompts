  The user mentions their reading group couldn't resolve this. That suggests existing interpretations might be too binary. Maybe the answer lies in distinguishing between different types of hinges. Some might be "bedrock" (like logical rules), others more contextual (scientific assumptions). The riverbed's mix of rock and sand (§99) supports this—some parts are near-permanent, others changeable.

  Next, the Bayesian mapping. The user notes rationalist blogs treat hinges as ur-priors. But if hinges can change, that's more like high-inertia priors. Wittgenstein might reject credences for hinges entirely—they're not propositions to believe but rules enabling belief. When a hinge shifts, it's not via Bayesian updating but a change in the language-game itself. The user's link to Kuhn is apt here; it's about paradigm shifts, not rational updates.

  The regress problem from Yudkowsky: Wittgenstein's solution isn't foundationalist but practical. Justification ends in action, not in indubitable beliefs. The user might be seeking whether this avoids the regress. Yes, by making hinges non-propositional, Wittgenstein sidesteps the need for justification, anchoring in forms of life instead.

  I should check if the user's deeper need is reconciling Wittgenstein with Bayesian epistemology. They might want to integrate these ideas into their rationalist framework. But Wittgenstein challenges that framework's assumptions. Highlighting the difference in kind—hinges as enabling conditions vs. credence-assigned propositions—is crucial.

  Also, the user questions if hinge shifts are rational. Wittgenstein doesn't provide a rationality account because the shift isn't evidence-based; it's a change in the conceptual framework. Evidence only applies within a framework. This might frustrate the user, who's used to evidence-responsive updates. Emphasizing that hinges aren't "known" but acted upon could clarify.

  Finally, the user might feel that blog summaries oversimplified Wittgenstein. They want a close reading that respects the text's nuances. Addressing §96's "hardened propositions" and §343's "must stay put" together shows that hinges are contextually fixed but historically mutable. The key is the distinction between logical necessity in a context and empirical change over time.
answer: |-
  Your close reading catches a genuine tension in Wittgenstein's text—one that reveals the subtlety of his view. Let's break it down by reconciling the riverbed (§95-99) and hinge (§341-343) metaphors, then address the Bayesian and regress questions.

  ### Resolving the Tension: Fluidity vs. Fixity
  1. **Functional Immutability vs. Historical Mutability**  
     The key is distinguishing two perspectives:  
     - **Within a language-game/practice**: Hinges *must* be fixed for doubt/investigation to function. As §343 states, hinges enable movement (questioning) precisely by not moving *during the act*. This is *pragmatic* fixity: you don't question grammar while speaking, or the reliability of senses while testing a hypothesis.  
     - **Across historical/cultural contexts**: Hinges *can* change, as §96-99 emphasizes. What is bedrock in one era (e.g., geocentrism) becomes revisable in another. The riverbed shifts, but slowly and not via standard empirical updating.  

     Wittgenstein isn't contradicting himself but describing different modes:  
     > "The same proposition may get treated at one time as something to test by experience, at another as a rule of testing." (§98)  
     A "hinge" isn’t defined by its content but by its *role* in a practice at a time.  

  2. **The Riverbed’s Dual Nature**  
     The "hard rock/sand" distinction (§99) resolves the apparent conflict:  
     - **Hard rock**: Near-permanent hinges (e.g., "The world exists," "My senses are generally reliable"). These rarely shift and anchor all practices.  
     - **Sand**: Contextual hinges that erode/deposit (e.g., "Diseases are caused by humors" → "Diseases are caused by germs"). These can harden/soften based on cultural/scientific evolution.  

     §343’s "hinges must stay put" applies to *current* investigations. But over time, practices themselves evolve, and new hinges form (§97: "mythology changes back into flux").  

  ### Bayesian Mapping: Ur-Prior or High-Inertia Prior?
  - **Against Ur-Priors**: Wittgenstein explicitly rejects treating hinges as truth-apt propositions with credences. They aren’t "known" but *shown* in action (§204: "Giving grounds... comes to an end"). Assigning probabilities to hinges (e.g., "P(senses reliable) = 0.99") already presupposes them—you’d need hinges to justify that probability.  
  - **High-Inertia Prior? Closer, but still misleading**: While hinges resist revision during local updates, their change isn’t Bayesian. Bayesian updating requires fixed priors *within a model*. Hinge shifts involve changing the model itself. As §96 notes, fluid/hardened propositions change roles *outside* standard evidence-response.  

  **Wittgenstein’s view**: Hinges are *enabling conditions* for evidence to matter. They’re not beliefs but the "scaffolding" (§211) making belief/doubt possible.  

  ### Hinge Shifts: Rational or Kuhnian?
  - **Not Evidence-Responsive**: When a hinge shifts (e.g., Euclidean → non-Euclidean geometry), it’s not because new evidence *directly* refutes it. Evidence is only intelligible *within* a hinge framework (§105: "Testing itself rests on not being tested").  
  - **Paradigm-Like Change**: Shifts occur when practices break down or new forms of life emerge (§617: "At the foundation of well-founded belief lies belief that is not founded"). This resembles Kuhn: anomalies accumulate until the framework reorganizes. Wittgenstein gives no *algorithm* for rational hinge-change because it’s not rule-governed; it’s a practical shift in "what we do" (§110).  
  - **Regress Problem**: This *is* Wittgenstein’s solution to the regress. Justification ends not in an infallible belief but in action (§204: "My spade is turned"). Hinges aren’t "justified" but are the bedrock where justification *stops*. Yudkowsky’s recursive justification assumes all beliefs need evidence; Wittgenstein denies this for hinges. They’re the riverbed, not the water.  

  ### Why the "Must" in §343?
  The absoluteness is pragmatic, not metaphysical:  
  > "If I want the door to turn, the hinges *must* stay put."  
  This is conditional on engaging in the practice of turning (doubting/investigating). You can *stop* turning the door (abandon the practice), but *while* turning, hinges are fixed. The fixity is relative to the activity.  

  ### Conclusion: Wittgenstein vs. Rationalist Glosses
  - **Hinges are not propositions**: They’re norms embedded in practices. Treating them as "ur-priors" mislocates them *within* the epistemic game they constitute.  
  - **Change is non-rational (not irrational)**: Hinge shifts arise from practical/cultural evolution, not evidence accumulation. Like switching games from chess to Go: the rules don’t "update"; the activity changes.  
  - **Regress resolved by doing**: Justification ends in forms of life (§358: "I act with certainty"). The riverbed shifts when our actions carve new channels.  

  Your instinct is right: blog summaries often flatten this. Wittgenstein’s genius lies in showing how *certainty* is not epistemological but practical—a quiet background against which doubt screams. The tension you spotted isn’t a flaw but an invitation to see certainty as both rigid in use and fluid in history.
