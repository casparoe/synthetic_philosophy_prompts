answer: |-
  ## Dialogue: The Parking Convention Conundrum

  **Setting:** A university common room, coffee cups in hand. **Alex** leans towards Lewisian coordination; **Sam** favors partiality/normative accounts.

  **Alex:** Sam, this condo parking dispute is fascinating! It screams Lewisian convention. For years, residents *coordinately* solved the recurring problem: "Who parks where?" The ground-floor units *expected* the good spots, others *expected* them to have them, and everyone acted accordingly. Stability! The new owner simply stopped playing *that* coordination game. No inherent "wrong," just a shift in expectations. She prefers a different equilibrium – first-come, first-served.

  **Sam:** Alex, I think Lewis’s indifference criterion fatally undermines your view here. Were the options *really* equally good? Absolutely not! Those shaded, close spots are objectively better, especially in summer. This isn’t like driving on the left or right, where the *solution* is arbitrary but the *value* of coordination is symmetric. Here, the *distribution* of benefits is asymmetric. Ground-floor residents get a persistent, significant advantage. This looks much more like Ullmann-Margalit’s "norms of partiality" – an unequal settlement stabilized by habit and power imbalances, not mutual indifference among solutions.

  **Alex:** Fair point about the spots' differing value. But Lewis doesn’t require *absolute* indifference. He requires indifference *given the alternatives available within the coordination context*. The key alternatives were: (A) Ground-floor gets good spots, (B) Rotate good spots weekly, (C) First-come-first-served chaos. Crucially, *avoiding conflict and uncertainty* was the primary coordination problem everyone faced. Option A solved it stably for decades. Residents *were* largely indifferent between A and B *as solutions to the coordination problem itself* – both avoided daily disputes. They *weren’t* indifferent about the *outcome* (who gets the good spot), but the *stability* of A made it preferable to the *instability* risk of B or C. The new owner disrupted that stability.

  **Sam:** You’re conflating the *existence* of a stable pattern with its *justification*. Stability isn’t morality. The feeling of "wrongness" upstairs neighbors express – and the anger from downstairs – suggests something deeper than disrupted expectations. It’s about *fairness*. Bicchieri nails this: What binds the norm isn't just empirical expectation ("They *will* park there"), but *normative* expectation ("They *should* park there, and it’s *wrong* if they don’t"). The sanction isn’t formal; it’s the social disapproval erupting in the group chat! That’s the normative glue Lewis underplays. The new owner violated a normative expectation built on perceived fairness – however flawed – over time.

  **Alex:** But *where* did this normative expectation come from? Lewis would argue it’s *emergent* from the coordination equilibrium itself! Once A was established, it became the baseline. Deviating *feels* wrong *because* it disrupts coordination, not because of some pre-existing moral principle about parking spot deserts. The "fairness" upstairs residents now invoke feels like post-hoc rationalization of the status quo. If the arrangement had been rotation from day one, *that* would feel "fair," and reserving spots would feel "wrong." The normativity is parasitic on the convention.

  **Sam:** Not so fast. Consider the initial conditions. Why did the ground-floor units "naturally" claim the best spots? Likely convenience, maybe perceived entitlement based on proximity, perhaps even subtle power dynamics (first owners?). This wasn’t a neutral coordination solution emerging from symmetric indifference; it was likely a *bargaining outcome* favoring one party from the start, ossified by time. Ullmann-Margalit argues such partiality norms *can* become stable conventions, but they carry a different moral weight. Changing them *is* disruptive, but arguing it’s merely stopping a coordination game ignores the entrenched, unequal benefit. The new owner isn’t just changing the game; she’s contesting an unfair settlement.

  **Alex:** Okay, granting the initial settlement might have been asymmetric. But Lewis’s point about alternatives stands. *Could* a perfectly fair rotation scheme have been stable? Maybe not! The transaction costs – remembering whose week it is, potential disputes over "prime time" – might make it *less efficient* at solving the core coordination problem (avoiding daily conflict) than the simple, if unequal, status quo. The persistence of A suggests it *was* the most coordinationally efficient solution *available to them*, even if not perfectly fair. The new owner imposes a *new* coordination cost – the current conflict – by forcing a switch to C.

  **Sam:** Efficiency isn't justice. And Bicchieri would argue the *strength* of the norm comes precisely from the *combination* of empirical expectation ("They always park there"), normative expectation ("They *should*"), and the *conditional preference* to follow the norm *if* others do and *if* sanctions are expected. The new owner shattered the empirical expectation, violating the normative one, and is now facing sanctions (disapproval). This complex web explains the *moralized* reaction better than pure coordination failure. She didn’t just disappoint; she violated a social rule perceived as legitimate.

  **Alex:** But can it *become* a new convention? If the new owner persists, and others start occasionally taking the good spot when first, and resentment fades... wouldn’t a new Lewisian convention emerge? First-come-first-served, solving the coordination problem anew? That suggests the old norm *wasn’t* fundamentally different – just one equilibrium replaced by another.

  **Sam:** Possibly... but the path matters. The friction, the feeling of wrongness, the sanctions – these signal that the old arrangement *was* a partiality norm with normative force, not just a coordination point. Shifting it requires more than unilateral action; it requires renegotiation or a new implicit bargain. If the new pattern stabilizes *without* lingering resentment, *then* it might become a pure coordination convention. But the current conflict shows the transition isn’t frictionless, precisely because the old state wasn't *just* coordination.

  **Alex:** So is our disagreement about the *nature* of the old arrangement, or about the *conditions* for legitimate change? Or... is it about the *word* "convention"?

  **Sam:** Both, I think. Substantively: I argue the old arrangement was a partiality norm sustained by normative expectations and sanctions, explaining the strong reaction to violation. You argue it was a coordination equilibrium whose normative force was purely derivative, making the reaction merely about disrupted expectations and efficiency.

  **Alex:** And verbally: You reserve "convention" for Lewis’s narrow coordination equilibria with indifference. I’m willing to extend "convention" to cover stable solutions to recurring problems, even with mild asymmetries, if they primarily serve coordination. You see partiality norms as a distinct category requiring a different label and explanation.

  **Sam:** Exactly. For me, calling this a "Lewisian convention" obscures the crucial role of perceived fairness and normative expectations in its stability and the reaction to its breach. For you, calling it something else overcomplicates a fundamentally coordinative phenomenon. The condo fight hinges on which lens better explains the residents' feelings and the path to resolution: disrupted coordination or violated partiality norm.

  **Alex:** Perhaps the truth is... both lenses capture aspects. The initial *formation* might have involved partiality/bargaining. Its *persistence* relied heavily on Lewisian mutual expectations solving coordination. And its *dissolution* triggers both coordinative *and* normative responses. The label "convention" might be stretched, but the mechanisms are intertwined.

  **Sam:** Now *that* sounds like the beginning of a joint paper... and perhaps a more productive framing for the condo board than their current group chat. Pass the coffee?
