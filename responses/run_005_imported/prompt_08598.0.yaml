  Key story beats taking shape:
  1. Protagonist rebuilds father (nanites? advanced tech? doesn't matter)
  2. Replica behaves perfectly
  3. But protagonist hears dad's own lectures in their head: "No history, no content"
  4. Crucial moment: replica says "I love you" with dad's cadence
