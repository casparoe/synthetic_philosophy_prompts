answer: |-
  ## Kitchen Shadows: An Argument After Burial

  **(The clink of china. Mara, late 40s, sharp eyes red-rimmed, rinses a teacup. David, early 50s, rumpled suit, leans against the counter, staring into a half-drunk whiskey. The muffled sounds of departing guests fade.)**

  **Mara:** (Without looking up) Still think he’d want us using the good crystal for *this*? He hated fuss.

  **David:** He’d hate this whole damn day. The platitudes. The egg sandwiches. People calling him ‘a good man’ like it was his only accomplishment.

  **Mara:** (Dries the cup meticulously) He *was* a good man. And he’s beyond caring about egg sandwiches now. Or crystal. Or… anything.

  **David:** (Turns sharply) That’s it? ‘Beyond caring’? That’s the comfort Epicurus offers? That because he doesn’t *feel* the absence, the absence isn’t real? That it isn’t… bad?

  **Mara:** (Meets his gaze, calm) Precisely. Lucretius was clear: *"Death therefore is nothing to us, concerns us not a jot, since the nature of the mind is mortal."* If harm requires a subject to *experience* it, David, where is the subject? Where is *Dad* to suffer this supposed harm of being dead?

  **David:** He’s *gone*, Mara! That’s the harm! The life he should have had! The grandkids he won’t see, the books he won’t read, the sunrise he won’t watch tomorrow! Nagel had it right – death is an evil because of the goods it deprives him of. The *future* he lost.

  **Mara:** (Leans forward) Ah, the deprivation account. Convenient. But tell me, brother-moralist: Was Dad harmed by the eternity of non-existence *before* he was born? Did he suffer the deprivation of not seeing the Battle of Hastings? Not reading Homer in the original? Not knowing his own parents as children?

  **David:** (Frustrated wave of his hand) That’s Lucretius’ symmetry argument. It’s a trick! It’s not the same!

  **Mara:** Why not? Two vast eternities of non-existence, bookending a finite life. If the *after* is a horrific deprivation worthy of grief, why not mourn the *before* with equal fervor? Did you weep for the centuries Dad *wasn’t* alive to enjoy Renaissance art? No? Then why weep for the decades he *won’t* be alive to… tend his roses?

  **David:** Because context *matters*, Mara! Before birth, there was *no one* to be deprived! There was no potential *Dad* languishing in the void, waiting to be born. He didn’t *exist*. But *after* life… after he *was* Dad, with his loves, his projects, his very self established… *then* death comes. It snatches away a specific, actual subject who *had* a future. The pre-birth void held no promise *for him*; the post-death void steals the promise *from him*.

  **Mara:** So the asymmetry hinges on… what? The accident of temporal location relative to consciousness? That seems arbitrary. The *state* is identical: non-existence. Where is the *subject* experiencing this ‘deprivation’ after death? You keep projecting a ghostly spectator onto the future, lamenting what ‘he’ misses. But *he* isn’t there to lament! Epicurus: *"So death, the most terrifying of ills, is nothing to us, since so long as we exist, death is not with us; but when death comes, then we do not exist."* No subject, no harm.

  **David:** (Slams his glass down, not hard, but decisive) The harm isn't *felt* like a pain, Mara! It's a *fact* about the world. A *brutal* fact. Dad was a particular person, embedded in time. His death *at this moment* means the complete and irrevocable cancellation of *his* particular future possibilities. That cancellation is bad *for him* – not because he feels it, but because it *robs* the person he was. It’s the negation of his narrative arc. Pre-birth non-existence didn't rob *him* of anything; there was no ‘him’ to rob. Post-death non-existence *does*.

  **Mara:** (Sighs, picks up another cup) So the badness is… metaphysical? An abstract subtraction from a completed sum? Dad lived 78 years. Does the subtraction of potential 79th make the 78 less? Or just… finite? Lucretius asks why we rage against the limit *now* when we didn't rage against its absence *then*.

  **David:** We rage *now* because we *knew* him! Because we saw the life in him, the potential still there! Because his story was *interrupted*, not concluded! The potential wasn't abstract; it was *his* – walking Clara down the aisle, finally beating me at chess, seeing if that damned orchid would bloom… It was *specific* goods *he* would have valued, *he* was oriented towards. Death destroyed *that* possibility *for him*. That’s the asymmetry. The goods lost were *his* to lose.

  **Mara:** And yet… here we are. Him, gone. Us, arguing over whether his absence harms *him*. Does it change anything for Dad, right now, whether you win this argument or I do?

  **David:** (Looks at the empty chair their father always sat in. His voice thickens) No. It doesn’t change a damn thing for him. But it changes how I understand… the shape of this loss. I mourn the man *and* the future stolen *from* the man. That future mattered *to him*, Mara. Even if he can't care now, it mattered *then*. That’s enough for it to be bad *for him*.

  **Mara:** (Quietly, drying her hands) Perhaps. Or perhaps we mourn the future stolen *from us*. The conversations we won't have. The comfort of his presence. The ‘him’ we needed. Maybe… the deprivation is ours.

  **(Silence hangs, heavy with grief and unresolved philosophy. David stares into his empty glass. Mara looks out the window at the gathering dusk. The argument is spent, for now, leaving only the aching absence.)**

  ---

  **Key Elements Used:**
  *   **Mara's Epicurus/Lucretius:** Focus on *no subject to experience harm* ("Where is the subject?"), the key quote, and the forceful symmetry argument ("Why not mourn the before?").
  *   **David's Nagel-inspired Deprivation:** Emphasis on *lost future goods* specific to the individual ("grandkids he won't see," "his narrative arc interrupted").
  *   **David's Answer to Symmetry:** Explicitly rejects it as a trick, argues the *context* of death robbing an *established subject* of *their specific future* ("Pre-birth held no promise *for him*; death steals the promise *from him*," "The goods lost were *his* to lose").
  *   **Interruptions/Rebuttals:** Quick exchanges, direct challenges ("That's it?", "It's a trick!", "So the badness is… metaphysical?"), not monologues.
  *   **Unresolved & Grief-Focused:** Ends on the raw emotional reality of loss ("I miss him") and the shared, overwhelming absence, leaving the philosophical tension intact but momentarily overshadowed by sorrow. The empty chair is a potent symbol.
