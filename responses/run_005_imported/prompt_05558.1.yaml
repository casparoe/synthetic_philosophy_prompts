prompt: |-
  Random Frege-Geach question that's been bugging me while I prep for comps. I feel solid on the classic modus ponens case -- needing some higher-order attitude, à la Blackburn, to explain why an argument like "lying is wrong; if lying is wrong then getting your little brother to lie is wrong; so getting your little brother to lie is wrong" comes out valid. But I keep running into people (Unwin, Schroeder) treating "the negation problem" as this whole seperate obstacle that needs it's own fix, and I don't really get why. Isn't negation just a degenerate, simpler case of the conditional problem? Like, if Blackburn or Gibbard already have machinery telling you which combinations of attitudes toward "wrong" are consistent across a conditional, shouldn't "not wrong" just fall out of that automatically, instead of needing a whole separate solution?
reasoning: |-
  Okay, the user is grappling with the negation problem in the context of the Frege-Geach problem, specifically why it's treated as separate from the conditional case. They mention being solid on modus ponens with higher-order attitudes (like Blackburn) but confused about why negation requires its own solution.

  First, I need to recall the Frege-Geach problem. It's about how non-cognitivist theories (like expressivism) handle logical operations in moral language. The classic case is conditionals, like modus ponens. Blackburn and Gibbard use higher-order attitudes to explain validity. For example, in "lying is wrong; if lying is wrong, getting your little brother to lie is wrong; therefore...", the validity comes from the consistency of attitudes across the conditional.

  The user's confusion is why negation is seen as a separate problem (the negation problem) when they think it should be a simpler case of the conditional. After all, negation is a component in conditionals. So, if the machinery for conditionals works, negation should follow.

  But why do Unwin and Schroeder treat negation as distinct? Let me break down the issues. The problem with negation in expressivism is that it's not straightforward to attach an attitude to a negated moral sentence. If "lying is wrong" expresses disapproval, what does "lying is not wrong" express? Approval? Indifference? Neither seems right. Approval might be too strong, and indifference fails to capture the rejection of disapproval.

  This is different from conditionals. Conditionals involve complex attitudes, like disapproval of combining attitudes. Negation is atomic but problematic because expressivism ties attitudes to atomic sentences. So, while conditionals build on simpler components, negation itself is a basic operator that needs its own account.

  The user might be missing that expressivist accounts define attitudes for atomic sentences first. So the negation problem arises at the foundational level. Even if conditionals are handled with higher-order attitudes, the base case of negating an atomic moral sentence remains unresolved. Solutions for conditionals might not directly apply to negation without additional work.

  Also, Schroeder's point about minimal negation not being sufficient. Expressivists need to explain why "not wrong" isn't just the absence of disapproval but a distinct attitude. This ties into the attitude identity problem, which is unique to negation. Conditionals don't have this issue because they involve combinations of attitudes, not defining what a single attitude's negation means.

  The user's deeper need might be understanding the structure of expressivist solutions. They might think that solving conditionals should automatically solve negation, but the literature points out specific hurdles for negation. Clarifying why negation is a distinct challenge—due to attitude identity and minimal negation issues—would help them see why it's treated separately. They might also need reassurance that their grasp of the modus ponens case is correct, but negation requires additional steps in expressivist frameworks.
answer: |-
  That's a *fantastic* question that cuts right to the heart of why the Negation Problem is tricky for expressivism. Your intuition is spot-on: negation *should* be a simpler case falling under the same machinery developed for conditionals. The fact that it doesn't work seamlessly is precisely why it's considered a distinct, stubborn problem. Here's a breakdown:

  1.  **The Conditional Success (Broadly):** You're right that expressivists like Blackburn (quasi-realism) and Gibbard (norm-expressivism) developed sophisticated machinery (higher-order attitudes/prohibitions on combinations) primarily to handle *complex* embeddings, especially conditionals and modus ponens. This machinery *does* successfully explain why the argument form is valid *without* assigning truth-conditions to moral sentences. The attitude expressed by the conditional ("If lying is wrong...") is a higher-order attitude *about* the combination of the attitudes expressed by the antecedent and consequent.

  2.  **Why Negation *Seems* Simpler (and Why Your Intuition is Understandable):**
      *   Logically, `~P` is equivalent to `P -> ⊥` (where ⊥ is absurdity/falsum). So, handling conditionals *should* give you the tools to handle negation.
      *   The expressivist machinery for conditionals involves attitudes towards combinations of attitudes. Rejecting an attitude (`~P`) should just be a specific *instance* of disapproving of a combination involving the attitude for `P` and... well, something else (like ⊥).

  3.  **The Core of the Negation Problem (Why it's Separate):** The problem isn't *logical form* per se, but **attitude identity and expression**. The challenge is specifying *exactly what non-cognitive mental state* is expressed by a *negated atomic moral claim* like "Lying is **not** wrong." Let's contrast it with the conditional:

      *   **Conditional ("If P, then Q"):** Expresses a *higher-order* attitude (HOA). For Blackburn, it's being for `blaming` someone who has the attitude for `P` but lacks the attitude for `Q`. For Gibbard, it's a plan to avoid having the attitude for `P` without also having the attitude for `Q`. The HOAs are complex but defined *relationally* in terms of the attitudes for `P` and `Q`.
      *   **Negated Atomic ("~P"):** Expresses... *what*? It needs to be a *first-order* attitude state that directly competes with the state expressed by `P`.
          *   If `P` ("Lying is wrong") expresses `DISAPPROVAL(lying)`...
          *   What does `~P` ("Lying is **not** wrong") express?
              *   `APPROVAL(lying)`? That's too strong. "Not wrong" isn't necessarily "right" or "good."
              *   `INDIFFERENCE(lying)`? That doesn't capture the *rejection* of `DISAPPROVAL`. You can be indifferent *and* think lying is wrong, or indifferent *and* think it's not wrong. Indifference is compatible with either.
              *   `DISAPPROVAL(of disapproving of lying)`? This is a higher-order attitude *like* the one used for conditionals. But now we have a problem: **Attitude Identity / Minimal Negation**.
                  *   **Problem 1 (Minimal Negation):** `~P` needs to be the *minimal* or *direct* rejection of `P`. Saying `~P` expresses `DISAPPROVAL(of DISAPPROVAL(lying))` feels convoluted and *not* what the speaker primarily means. They mean lying *lacks* the property of wrongness, not that they disapprove of disapproval. The expressivist account seems to misrepresent the *content* of the attitude expressed by the negated sentence.
                  *   **Problem 2 (Attitude Identity & Logic):** Crucially, `DISAPPROVAL(of DISAPPROVAL(lying))` is a *different type* of attitude state than `DISAPPROVAL(lying)`. This creates a problem for logic:
                      *   `P` expresses State A (`DIS(lying)`)
                      *   `~P` expresses State B (`DIS(DIS(lying))`)
                      *   But `~~P` should be equivalent to `P`. What state does `~~P` express? `DIS(DIS(DIS(lying)))`? That's clearly not the same state as `DIS(lying)` (State A). Expressivism seems to predict that `P` and `~~P` express *different* mental states, which is absurd. Logic requires them to be equivalent. The machinery built for complex embeddings doesn't automatically ensure that iterating the operation (like double negation) gets you back to the original state *of the same kind*.

  4.  **Why the Conditional Machinery Doesn't Automatically Solve This:**
      *   The conditional machinery brilliantly solves *compositionality* and *validity* for *complex* sentences by defining HOAs *in terms of* the component attitudes. It tells you what attitude a complex sentence expresses *given* the attitudes expressed by its parts.
      *   **The Negation Problem exposes a gap at the *foundational* level:** It asks what the *basic, atomic* attitude is for the *negation* of a *basic, atomic* moral sentence. The conditional machinery *presupposes* that we know what `~P` expresses *before* we can plug it into a conditional like `P -> ~Q`. If we can't give a satisfactory account of the attitude for `~P` itself, the whole compositional project is undermined *at its base*.
      *   The machinery tells you which combinations of attitudes are inconsistent, but it doesn't automatically define what the *negation attitude state* *is* for an atomic sentence in a way that satisfies minimal negation and ensures `P == ~~P`.

  **In essence:** The Conditional Problem is about **compositionality and validity within complex embeddings**. The Negation Problem is about **the identity and expression relation for the most basic form of logical opposition in atomic sentences**. While negation is logically simpler, its treatment in expressivism forces a confrontation with the core question: "What *is* the mental state of thinking a basic moral claim is *false*, if thinking it's true isn't a belief?" The solutions for complex sentences rely on having a stable account of the states expressed by the atomic components, including their negations. The Negation Problem shows that providing that stable account for negated atomics is surprisingly difficult and requires specific solutions beyond just applying the higher-order attitude framework.

  **Think of it like building blocks:**

  1.  **Expressivism needs atomic blocks:** `P` (e.g., `DIS(lying)`), and `~P` (e.g., ???).
  2.  **The Negation Problem:** What shape/identity does the `~P` block have? We struggle to define it in a way that fits intuitively and allows `~~P` to be identical to `P`.
  3.  **The Conditional Machinery:** Is a set of *connectors* that tell you how to combine the atomic blocks (`P`, `Q`, `~P`, `~Q`) into larger structures (`P -> Q`, `P ∨ ~Q`) and which combinations are stable/invalid. It *presupposes* you have well-defined atomic blocks to connect.
  4.  **The Issue:** The connectors work great, but if the `~P` block itself is misshapen or ill-defined (doesn't satisfy minimal negation, `P != ~~P`), then even perfect connectors won't build a logically sound structure. The problem lies in the fundamental nature of the `~P` block, not the connectors.

  So, you're absolutely right to see the connection, and expressivists *do* try to leverage their core ideas (about combinations of attitudes) to solve negation (e.g., Gibbard's later work). But the Negation Problem highlights that this application isn't trivial and reveals deep challenges about the nature of the attitudes expressed by negated atomic claims that aren't fully resolved by the solution to the conditional problem alone. It forces expressivists to refine their account of *what the basic attitudes are* and how they relate logically at the most fundamental level. Unwin and Schroeder emphasize it as separate because successfully composing complex sentences doesn't automatically guarantee you've correctly defined the building blocks for negation.
