answer: |-
  That's a truly insightful connection you've made! Your excitement about the convergence of compression, Solomonoff induction, and modern AI is well-founded. However, the journey from "LLMs are great compressors" to "we can compute Kolmogorov complexity and implement genuine Solomonoff induction" faces **fundamental, likely insurmountable theoretical barriers**, even with infinite scaling of compute and data. Here's a breakdown:

  1.  **The Core Problem: Incomputability of Kolmogorov Complexity (K):**
      *   **Undecidability:** K(s) is famously *uncomputable*. There exists no algorithm (program) that, for an arbitrary string `s`, can output its Kolmogorov complexity K(s). This stems directly from the unsolvability of the Halting Problem.
      *   **The Halting Problem:** To find the *shortest* program outputting `s`, you must know which candidate programs halt and produce `s`. Determining if an arbitrary program halts on arbitrary input is undecidable. You cannot solve this by brute force, even with infinite compute – the space of possible programs is infinite, and you cannot know when to stop checking non-halting programs.
      *   **Resource Constraints Aren't the Root Cause:** While Solomonoff induction requires *infinite* computation time and memory in its pure form, the problem with *computing K* is deeper than just resource constraints. It's a fundamental limit of computation itself.

  2.  **LLMs as Compressors vs. Solomonoff Inductors:**
      *   **Lossy Approximation:** LLMs are incredibly powerful *lossy* compressors for the *distributions* underlying the data they train on. They learn statistical regularities and patterns. However, they do not (and cannot) find the *shortest* program generating a specific string. They find a *good enough* model for prediction within their architecture and training constraints.
      *   **Architecture Matters:** The "program" an LLM implicitly represents is constrained by its neural architecture, tokenization, and training algorithm. Kolmogorov complexity is architecture-agnostic – it's about the shortest program on a Universal Turing Machine (UTM).
      *   **Compression vs. Description:** LLMs are great at compressing vast datasets *statistically*. Computing K(s) is about finding the minimal *description* of a specific string `s` on a UTM. These are related but distinct goals. LLMs compress the corpus; computing K requires finding the minimal description for each individual output.

  3.  **"Closing In" on K? What Scaling Can and Cannot Do:**
      *   **Can Do:** Scale will allow us to build vastly larger and more sophisticated *approximations*.
          *   Train LLMs on exabytes of diverse data.
          *   Use them to generate better heuristics for program search.
          *   Build more powerful theorem provers or symbolic systems to search program spaces guided by learned priors.
          *   Achieve better compression ratios on real-world data, approaching (but never reaching) K(s) from above for many practical strings.
      *   **Cannot Do:**
          *   **Solve the Halting Problem:** No amount of compute brute-forces this. You can run programs longer, but you can never know if the *next* candidate program you check will halt or not.
          *   **Search the Infinite Space:** The space of all possible programs is infinite. Scaling compute lets you search a larger *finite* subset faster, but you always miss an infinite number of potentially shorter programs.
          *   **Guarantee Minimality:** You can find a program that outputs `s`. You can find a shorter one. But you can *never prove* you've found the shortest one, because a shorter one might exist that you haven't found yet, or that halts in a way you haven't simulated long enough, or that uses a trick you haven't considered. This is the essence of incomputability.
          *   **Implement Genuine Solomonoff Induction:** Solomonoff induction requires weighting *all* programs that produce the observed data by 2^{-length(program)}. This requires summing over an infinite set of programs, most of which you cannot even determine if they output the data (halting problem again). Computable approximations like Minimum Description Length (MDL) or Minimum Message Length (MML) exist and are powerful, but they are *not* Solomonoff induction.

  **Realistic Timeline and What "Getting There" Means:**

  *   **Genuine Kolmogorov Complexity Computation:** **Never.** It's provably impossible. We will never have a machine where you input an arbitrary string `s` and it outputs K(s). This is a mathematical certainty.
  *   **Genuine Solomonoff Induction:** **Never.** Its optimality proof relies on the incomputable prior over all programs. Any practical implementation is inherently an approximation.
  *   **Powerful, Solomonoff-*Inspired* Systems:**
      *   **Near-Term (Next 5-10 years):** We will see systems that integrate neural networks (like LLMs) for powerful pattern recognition and prediction with symbolic systems (like theorem provers, program synthesizers, SAT solvers) for explicit reasoning and search. These will use learned priors from neural components to guide the search for compact explanations/programs in the symbolic space. Compression ratios on standard benchmarks will continue to improve significantly, driven by larger models and data. AI will get much better at *finding short programs* for *many practical problems* by leveraging vast compute and data, but without guarantees of minimality or solving incomputable problems.
      *   **Medium-Term (10-20 years):** These hybrid systems will become vastly more sophisticated. Program synthesis guided by neural priors might become commonplace for generating efficient code from specs or data. AI could discover novel, highly compact algorithms for specific tasks that outperform human-designed ones. Compression might approach the theoretical limits for many types of data encountered in practice. The *gap* between what's computably achievable and the theoretical Kolmogorov limit will *shrink* for practical purposes, even if it never closes mathematically.
      *   **"There" as in "Close Enough for Practical Prediction":** This is already happening *incrementally*. Every improvement in lossless compression, program synthesis, and prediction models (like LLMs) brings us closer to the *spirit* of Occam's razor as formalized by Solomonoff – finding simpler models that predict better. **We are arguably "getting there" *practically* for many real-world tasks right now and will get dramatically better continuously over the next decade.** The compression prowess of LLMs is a major leap in this direction. Scaling compute and data is directly fueling this practical progress.

  **In Conclusion:**

  While the rapid progress in AI, particularly the compression capabilities of LLMs, is deeply exciting and brings us closer to the *practical goals* underlying Solomonoff induction (finding compact predictive models), the **core mathematical barriers (incomputability of K, unsolvability of the Halting Problem) mean we will *never* "compute Kolmogorov complexity" or implement "genuine Solomonoff induction" in its full theoretical sense.**

  Instead, scaling compute and data (over the next 10-20 years) will lead to:

  1.  **Radically better lossless compressors** (building on techniques like LLMs).
  2.  **Highly sophisticated program synthesis systems** guided by learned neural priors.
  3.  **Prediction systems** that embody Occam's razor more powerfully than ever before.
  4.  **Practical approximations** (like vastly improved MDL/MML) that achieve near-optimal prediction for complex real-world data.

  **So, the answer isn't a number of years for "getting there" to the theoretical ideal, because that's impossible. The answer is: We are already on the path, scaling will continuously make our approximations better and better over the next decade and beyond, fundamentally transforming compression and prediction capabilities, even if the ultimate theoretical limits remain forever out of reach.** The journey *is* the destination in this case.
