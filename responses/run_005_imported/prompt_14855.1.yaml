answer: |-
  Here's a joke playing directly on the "rational irrationality" of becoming someone who acts against their future self-interest:

  **Joke:**
  After being rescued by the skeptical driver and arriving safely in town, you proudly stride into the bank to withdraw the promised $100. As you hand it over, you beam: "See? Told you I was good for it! Becoming the kind of person who'd pay you back, even though it's completely irrational *now*, was the smartest, most rational thing I've ever done!"

  The driver pockets the cash, looks you dead in the eye, and says: "Buddy, if becoming the kind of person who *brags* about how rationally irrational they are was part of the plan... you might have overshot the mark. Now you're just a *dumb* rational person. No refunds."

  **Why it works on the "rational irrationality" twist:**

  1.  **Acknowledges the Core Paradox:** The rescued person explicitly states they *became* someone who pays *because* it was rational at the time of the promise (to get rescued), even though paying *now* is irrational (costly with no benefit).
  2.  **The Twist - Overshooting Rationality:** The driver points out the flaw in the *application* of the rationality. The rescued person didn't just become someone who pays; they became someone who *publicly celebrates* the cleverness of their own rationally-engineered "irrational" trait.
  3.  **"Dumb Rational Person":** This is the punchline. It highlights the absurdity:
      *   **Rational:** They correctly identified and executed the Parfitian strategy to survive.
      *   **Dumb:** By bragging about it *after* paying, they reveal the trait wasn't just a survival mechanism; they've *internalized* it as part of their identity *and* their ego. They're now proudly acting against their self-interest *and* advertising it, which serves no rational purpose whatsoever. The "rational" creation of an "irrational" trait has backfired, making them someone who *irrationally* values the *appearance* of sophisticated rationality, even at a cost.
  4.  **"No Refunds":** Underscores the finality and cost of their overshot commitment to the "irrational" trait they rationally cultivated.

  The humor comes from taking the philosophical mechanism seriously but showing how its successful execution can lead to a comically pointless form of self-sabotaging pride, turning "rationally becoming irrational" into "irrationally celebrating being rationally irrational."
