  7. **Bounded utility**: Fails—doesn't resolve existing infinity; just assumes it away despite unbounded welfare being plausible.  
  8. **Person-affecting/local view**: Changes the subject—abandons aggregation entirely, rejecting core utilitarian comparability.  

