    - **2. Comparing limiting densities or averages**: This is a leading candidate because it provides a finite answer and is relatively straightforward. However, it does have the Pareto flaw. But in the literature, it is often taken seriously.

  - **Workable but seriously flawed**: Approaches that can be made to work but have significant drawbacks that are hard to ignore.
    - **5. Finitely-additive value theory**: This is a well-known proposal and has been developed by Vallentyne and Kagan. It is workable but has been criticized for allowing violations of dominance and for being counterintuitive in some cases.
    - **4. Hyperreal/surreal-valued utility**: This is a technical fix that can work but is often seen as arbitrary and not directly tied to ethical intuition.

  - **Doesn't really solve the problem**: Approaches that fail to provide a consistent way to compare actions in infinite contexts.
    - **3. Comparing cardinalities**: This fails because many different distributions can have the same cardinality of good and bad events, and it doesn't account for the magnitude of the goods and bads.
    - **6. Lexical/leximin orderings**: The arbitrariness of the enumeration and the violation of anonymity make this approach problematic. It doesn't fully solve the problem in a satisfactory way.
    - **7. Bounded utility**: By fiat, it avoids the problem, but it doesn't solve the underlying issue of how to aggregate if utilities are unbounded (which they might be). It's more of a way to avoid the problem than to solve it.

  - **Just changes the subject**: Approaches that avoid the problem by redefining the scope of ethics in a way that abandons key aggregative principles.
    - **1. Restricting to causal future**: This changes the scope of ethical concern to only what we can affect, which might be a significant departure from the original problem (which is about the entire universe).
