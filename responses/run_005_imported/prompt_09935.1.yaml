prompt: |-
  I spent about thirty-five years as an observational cosmologist before I retired (mostly a laptop and a lot of fighting for telescope time, not exactly a lab-coat kind of job), and one thing that always sat at the back of my mind is that our best flat-universe measurements from the CMB are perfectly consistent with space being genuinely infinite, not just "really, really big." Now that I've got time to read actual moral philosophy, a friend from my old department pointed me at this literature on "infinite ethics" a few months back -- turns out that if the universe (or the multiverse, if you like eternal inflation) really is spatially infinite, then on any garden-variety aggregative view like utilitarianism it already contains an infinite amount of both good and bad, so the usual trick of totalling up the consequences of an act and comparing sums just breaks: every act comes out either infinitely good, infinitely bad, or flat-out incomparable to every other act. I gather Bostrom coined the term "infinitarian paralysis" for this in a paper from around 2011, which is definately a good name for it.

  What I can't tell from the papers I've dug up is which of the proposed fixes people actually take seriously versus which ones only get mentioned so the author can shoot them down in the literature review. Could you rank the following approaches to the infinite-aggregation problem from most to least promising, where "promising" means it actually dissolves the paralysis while sacrificing as little as possible of ordinary ethical intuition (not violating Pareto for no good reason, not being totally arbitrary about which chunk of the universe counts, etc.): (1) restricting your evaluation to whatever's in your causal future, (2) comparing limiting densities or averages of value per unit of spacetime volume, (3) comparing the cardinalities of the sets of good and bad events directly, (4) switching to hyperreal- or surreal-valued utility so the infinite sums stop being undefined, (5) a finitely-additive rather than countably-additive value theory (I think this is basically Vallentyne and Kagan's move, if I've got the name right), (6) lexical or leximin orderings built on some enumeration of people or events, (7) just insisting utility functions be bounded so nothing can diverge to begin with, and (8) giving up on aggregation entirely in favour of a person-affecting or purely local view. Throw in one or two more if theres an obvious one I've left off the list.

  Please put the actual ranking in a JSON block with four buckets, like this:

  ```json
  {
    "genuinely promising": ["...", ...],
    "workable but seriously flawed": ["..."],
    "doesn't really solve the problem": ["..."],
    "just changes the subject": ["..."]
  }
  ```

  and then underneath the JSON give me a sentence or two per item on why it landed where it did -- I'd like an actual verdict on each one, not "it depends" straight down the list.
reasoning: |-
  We are given a list of approaches to the infinite-aggregation problem in ethics (infinitarian paralysis). The goal is to rank them from most to least promising, with "promising" meaning that it dissolves the paralysis while sacrificing as little as possible of ordinary ethical intuition. We are to categorize them into four buckets: "genuinely promising", "workable but seriously flawed", "doesn't really solve the problem", and "just changes the subject".

  The approaches listed are:

  1. Restricting your evaluation to whatever's in your causal future.
  2. Comparing limiting densities or averages of value per unit of spacetime volume.
  3. Comparing the cardinalities of the sets of good and bad events directly.
  4. Switching to hyperreal- or surreal-valued utility so the infinite sums stop being undefined.
  5. A finitely-additive rather than countably-additive value theory (Vallentyne and Kagan's move).
  6. Lexical or leximin orderings built on some enumeration of people or events.
  7. Insisting utility functions be bounded so nothing can diverge to begin with.
  8. Giving up on aggregation entirely in favour of a person-affecting or purely local view.

  We are also allowed to add one or two more if obvious. However, the user has provided a comprehensive list. We'll stick to these eight.

  Let's evaluate each approach:

  ### 1. Restricting your evaluation to whatever's in your causal future.
  This approach limits the scope of ethical consideration to the part of the universe that can be influenced by one's actions. This avoids the infinite aggregation because the causal future might be finite (or at least the part we can affect is finite). However, it changes the subject by ignoring the rest of the universe. It sacrifices the intuition that we might care about beings we cannot affect (e.g., in distant galaxies). Also, if the causal future is infinite (as in an open universe), the problem may reemerge. This might be seen as changing the subject.

  ### 2. Comparing limiting densities or averages of value per unit of spacetime volume.
  This approach uses average utility per unit volume. It is a common proposal and can give finite answers even in an infinite universe. However, it violates Pareto principles: for example, improving the welfare of a finite number of people does not change the average, but intuitively it should be better. Also, it might be arbitrary in how we define the volume (e.g., spatial volume vs. spacetime volume). Despite these flaws, it is a workable solution that is often discussed.

  ### 3. Comparing the cardinalities of the sets of good and bad events directly.
  In an infinite universe, the sets of good and bad events might both be infinite and of the same cardinality (e.g., both countable). Then we cannot distinguish between a universe with a little more good and one with a little more bad. This approach does not solve the problem because it leads to incomparability in many cases. Also, cardinality does not capture the intensity of good or bad.

  ### 4. Switching to hyperreal- or surreal-valued utility.
  This approach uses non-standard analysis to define infinite sums. It can assign different hyperreal values to different infinite sums. However, the choice of how to represent the utility in the hyperreals can be arbitrary (e.g., which ultrafilter to use). It might also be seen as overly technical and not grounded in ethical intuition. It does, however, provide a way to compare infinite sets. But it is not clear that it is widely accepted as a solution.

  ### 5. Finitely-additive value theory (Vallentyne and Kagan).
  This approach (by Vallentyne and Kagan) uses finite additivity but not countable additivity. It allows for the assignment of values to infinite sets without requiring that the value of the whole be the sum of the values of the parts (in the countable sense). This can avoid some paradoxes, but it may lead to violations of dominance principles and can be counterintuitive. It is a serious proposal but has been criticized.

  ### 6. Lexical or leximin orderings built on some enumeration of people or events.
  This approach orders the well-being of individuals lexically (like in leximin). However, in an infinite universe, the ordering might depend on an arbitrary enumeration of the individuals. Also, it may violate anonymity (the idea that the identity of individuals doesn't matter). It is not clear that this approach can handle all cases without arbitrariness.

  ### 7. Insisting utility functions be bounded.
  This approach avoids the problem by assuming that utility per person is bounded (so that even with infinitely many people, the total utility is bounded). However, this is an ad hoc restriction and may not reflect reality. For example, if we allow unbounded utility per person, then even one person could have infinite utility. Also, it is not clear why we should assume boundedness. It changes the problem by imposing a restriction that might not be justified.

  ### 8. Giving up on aggregation entirely in favour of a person-affecting or purely local view.
  This approach abandons the idea of aggregating utility across individuals. Instead, it focuses on how actions affect particular individuals. This avoids the infinite aggregation problem but at the cost of giving up on aggregative ethics entirely. It is a significant departure from utilitarianism and might be seen as changing the subject.

  ### Additional Approach: 
  One common approach that the user did not mention is the **extended decision rule** (like the one by Lauwers and Vallentyne) that uses relative utilities or ratios. But the user's list is already long, and we are not required to add.

