  Looking at move (1): Nora claims the tears can't be grief because the characters don't exist. I recall philosophers like Colin Radford would agree with her - this is the classic "belief requirement" position. But contemporary thinkers like Kendall Walton might counter with his make-believe theory. I'll score this as partially valid but overly restrictive (-1).

