    - costly religious fasting rituals

  weak_or_miscast: none in this list

  However, note that for Arabian babblers, there might be some debate about the extent to which the behavior is driven by costly signaling versus other factors (like mutualism). But it is still a prominent example.

  Given the above, we'll assign:

  rock_solid: 
    peacock trains, gazelle stotting, Arabian babblers, Veblen goods, potlatch

  contested:
    suicide bombing, religious fasting

  But let me double-check:

  - **Veblen goods**: While accepted, note that the handicap principle was originally for biology, but the application to economics is common. So we'll keep it in rock_solid.

  - **Potlatch**: This is a classic example in anthropology and is often used in discussions of costly signaling. Rock solid.

  - **Suicide bombing**: This is highly debated. Some papers apply costly signaling, but others argue it's not a good fit because the signaler does not survive to reap benefits. So contested.

  - **Religious fasting**: There is a body of work that applies costly signaling to religion (e.g., by Sosis and others), but it is not without criticism. Contested.

