    "rock_solid": [{"example": "...", "why": "..."}],
    "contested": [...],
    "weak_or_miscast": [...]
  }
  ```

  One short reason per item is enough, no need for a full essay on each.
reasoning: |-
  We are classifying the given examples into three tiers: rock_solid, contested, and weak_or_miscast, based on how well they hold up as genuine handicap-principle cases.

  The handicap principle, proposed by Amotz Zahavi, suggests that signals are honest because they are costly to produce. Only high-quality individuals can afford to produce such signals. The classic example is the peacock's train.

  Let's go through each example:

  1. **Peacock trains**: The classic example. The long, colorful tail is costly because it makes the peacock more vulnerable to predators and requires energy to maintain. Only the fittest males can bear this cost, so it's an honest signal of fitness. This is rock solid.

  2. **Gazelle stotting**: When a gazelle spots a predator, it may stot (jump high in the air) instead of running away immediately. This is thought to be a signal to the predator that the gazelle is fit and can escape, so the predator should not waste energy chasing. This is a well-known example and generally accepted. Rock solid.

  3. **Arabian babblers' sentinel/helping behavior**: Arabian babblers take turns acting as sentinels, watching for predators while others forage. This is altruistic behavior because the sentinel is at risk and forgoes feeding. However, it may also be a form of costly signaling to show off their quality and gain social status within the group. This has been studied and is often cited as an example of costly signaling in cooperative behavior. It is supported by research, so we can consider it rock solid.

  4. **Veblen goods**: These are goods for which demand increases as the price increases, because they serve as a status symbol (e.g., luxury cars, designer bags). The high cost is the signal of wealth. This is a well-established economic concept and fits the handicap principle (the cost signals the buyer's wealth). However, note that the handicap principle is about biological signals, but Veblen goods are a human cultural phenomenon. Still, the principle is often extended to human behavior. It is generally accepted as a valid example, so we can put it in rock solid.

  5. **Potlatch ceremonies**: These are traditional ceremonies among some Indigenous peoples of the Pacific Northwest, where hosts give away or destroy wealth to demonstrate their wealth and status. This is a classic example in anthropology of conspicuous consumption and is often cited as a form of costly signaling. It is well-supported and fits the handicap principle. Rock solid.

  6. **Suicide bombing**: This is a complex behavior. Some have suggested that it can be seen as a form of costly signaling (signaling commitment to a group or cause). However, it is controversial and there are alternative explanations (e.g., coercion, indoctrination). Moreover, the cost is extreme (death) and the benefits may be to the group (or the bomber's family) rather than the individual. The application of the handicap principle here is debated and not universally accepted. Therefore, we'll put it in contested.

  7. **Costly religious fasting rituals**: Fasting as a religious practice can be seen as a signal of devotion. The cost (hunger, weakness) may signal commitment to the faith. However, the extent to which this is driven by the handicap principle versus other factors (e.g., social conformity, spiritual reasons) is debated. Also, the cost might not necessarily be a handicap that only the high-quality can bear, but rather a test of willpower. It is applied in the literature but not without criticism. Given that, we'll put it in contested.

  But note: for fasting, some researchers do see it as costly signaling. However, it is less straightforward than the animal examples and may be influenced by cultural factors. It's not as universally accepted as the others.

  Now, let's structure the JSON:

  rock_solid: 
    - peacock trains
    - gazelle stotting
    - Arabian babblers' behavior
    - Veblen goods
    - potlatch ceremonies

  contested:
