  The answer gives an objection: that the worst-case rule ignores most of the credal set, so two agents with very different credal sets (one with a wide range, one concentrated near 0.5 but still including extremes) would make the same choices if the worst-case is the same. The answer states this is a cost and that it makes decisions insensitive to differences in belief. The answer also says the author finds it fairly persuasive.

