  Based on the criteria of permissiveness toward private tyrannicide (defined as a private individual acting alone, without authorization from a public body or magistrate), the ranking from most to least permissive is as follows. Aquinas is integrated into the spectrum based solely on *De Regno* Book I (excluding Ptolemy of Lucca’s additions) and the *Summa Theologiae* treatment of sedition. The justifications focus on each thinker’s stance on private initiative.

