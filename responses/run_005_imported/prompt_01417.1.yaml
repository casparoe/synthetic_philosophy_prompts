  Also, the user mentions that all real channels are unreliable. That's true, but in practice, systems often assume channels are reliable after a certain point. For instance, TCP handles acknowledgments and retransmissions to ensure message delivery. While not theoretically perfect, it's practically sufficient. Similarly, in human interactions, repeated confirmations can reduce uncertainty to negligible levels, making common knowledge effectively achievable.

  Another angle: Aumann's theorem might be used to explain why rational agents should update their beliefs when they communicate, even without perfect common knowledge. The theorem highlights the logical force of shared rationality. If both agents know they share a prior and are rational, any exchange of information should push them toward agreement, even if full common knowledge isn't reached. The impossibility result from distributed systems doesn't negate this; it just points to practical limitations.

