  So I recently quit my consulting job to spend way more time painting and hanging out with my closest friends, and when my parents flipped out about it I threw out this G.E. Moore idea I'd read about, that personal affection and the enjoyment of beauty are basically the greatest goods there are, just to sound like I had some philosophical backup lol. My brother (who's doing a philosophy PhD) wasn't buying it though, he said that since Moore basically defines those goods as just certain mental/emotional states, that's not actually any different then Mill's hedonism, Moore just swapped in classier pleasures to maximize. So have I not actually escaped hedonism here at all, just found fancier flavors of it, or is my brother missing something about what Moore's actually claiming?
reasoning: |-
  Okay, let me try to unpack this user's query. They quit their consulting job to focus on painting and friends, and their parents got upset. They cited G.E. Moore's idea about personal affection and aesthetic enjoyment as the greatest goods. Their brother, a philosophy PhD, argued that Moore's view is just hedonism with classier pleasures. The user wants to know if they've really escaped hedonism or if their brother missed something.

  First, I need to recall Moore's ethics. Moore was a non-naturalist, right? He rejected naturalism and the idea that "good" can be defined by natural properties. So in *Principia Ethica*, he argues that good is simple and indefinable. Hedonism, like Mill's, defines good as pleasure. But Moore separates intrinsic value from pleasure. His intrinsic goods include personal affection and aesthetic enjoyment, which aren't just about pleasure states.

  The brother's point is that Moore's goods are mental states, similar to hedonism. But Moore distinguishes between the state itself and the pleasure it brings. For example, appreciating beauty involves a cognitive element beyond mere pleasure. Also, the objects of these states matter. Personal affection requires real relationships, not just feelings. So there's an external element.

  I should explain Moore's concept of organic unities. The value of a whole isn't just the sum of its parts. A loving relationship has value beyond the individual pleasures of the people involved. That's different from hedonism, which aggregates pleasures.

  The user might be looking for validation that their life choices have philosophical backing beyond hedonism. They want to justify prioritizing art and relationships over a traditional career. The deeper need could be reassurance that their choices are meaningful and not just seeking pleasure. They might also want to counter their brother's argument effectively.

  The brother's critique oversimplifies Moore by equating mental states with pleasure. Moore's goods involve intentionality—being directed at real objects. So aesthetic enjoyment isn't just a feeling; it's about engaging with actual beauty. Personal affection depends on mutual relationships. This relational aspect adds complexity beyond hedonism.

  Also, Moore's non-naturalism means that intrinsic value isn't reducible to natural properties like pleasure. He uses the open-question argument: even if something causes pleasure, we can still ask if it's good. So pleasure isn't synonymous with good.

  The user needs to understand that Moore offers a pluralistic value theory. While hedonism sees all value derived from pleasure, Moore has multiple intrinsic goods. This justifies prioritizing diverse experiences like art and friendships, each valuable in their own right.

  However, Moore's view still centers on conscious experiences. If the brother is a strict hedonist, he might not see the distinction as significant. But the user can argue that the qualitative differences in experiences matter. Painting isn't just about the pleasure; it's about creating and appreciating beauty, which has intrinsic worth.

  In conclusion, the user hasn't just found fancier hedonism. Moore's framework provides a non-hedonistic justification for their choices, emphasizing relational and aesthetic values beyond mere pleasure states. The brother's critique misses Moore's distinctions in intentionality, organic unities, and the indefinability of good.
answer: |-
  That's a fantastic philosophical skirmish! Your brother makes a sharp point, but he's oversimplifying Moore and missing some crucial nuances. Here's a breakdown:

  **Your Brother's Argument (The Hedonism Charge):**

  1.  **Moore's Goods are Mental States:** Personal affection and aesthetic appreciation *are* conscious states – states of mind involving feelings, perceptions, and judgments.
  2.  **Hedonism Defines Good as Pleasurable Mental States:** Classic hedonism (like Mill's) argues that pleasure (and the absence of pain) is the sole intrinsic good. Pleasure is also a mental state.
  3.  **Therefore, Moore is Just Specifying *Which* Pleasures:** By elevating certain complex mental states (affection, aesthetic joy) as the "greatest goods," Moore is essentially advocating for a refined hedonism that maximizes sophisticated pleasures rather than base ones. The fundamental structure – good = desirable mental states – remains the same.

  **Why Your Brother Isn't Entirely Wrong (The Superficial Resemblance):**

  *   Moore *is* fundamentally concerned with **conscious experience**. The good *is* realized within minds. Hedonism also locates value in conscious experience (pleasure).
  *   Both reject purely external, material, or "objective" lists of goods divorced from subjective experience. A beautiful painting locked in a vault where no one sees it isn't *intrinsically* valuable for Moore; its value *is* its appreciation.

  **Why Your Brother *Is* Missing Moore's Key Points (Escaping *Simple* Hedonism):**

  Moore offers significant departures from classical hedonism:

  1.  **The Indefinability of "Good" & Non-Naturalism:** This is Moore's *most fundamental* point. For Moore, "good" is a simple, non-natural property. You can't *define* it as "pleasure," "happiness," "desire-satisfaction," or anything else natural. Hedonism commits the "Naturalistic Fallacy" by trying to define "good" as "pleasure." Moore argues that asking "But is pleasure *good*?" remains a meaningful open question, proving they aren't identical. **Moore doesn't *swap* pleasures; he argues the good *isn't reducible* to pleasure at all.** He identifies affection/beauty *as* intrinsically good, not *because* they are pleasures.
  2.  **The Objects of the States Matter:** Moore isn't valuing just *any* pleasant feeling. The value arises from the *specific intentional object* of the state:
      *   **Personal Affection:** The good isn't just *feeling* affection; it's the admiration of *true mental qualities* (goodness, intelligence, etc.) *in another person*, combined with the pleasure of companionship. It requires a *real, reciprocal relationship* with a worthy object. Random warm fuzzies don't cut it. The *object* (the friend's qualities) is crucial to the value of the *state*.
      *   **Aesthetic Enjoyment:** The good isn't just *feeling* aesthetic pleasure; it's the appropriate emotional apprehension of *beautiful qualities inherent in an object*. The *beauty of the object itself* is a necessary component. The value lies in the *correct* appreciation of *actual* beauty. A hallucinated beautiful landscape wouldn't have the same intrinsic value for Moore.
  3.  **Organic Unities:** This is crucial. Moore argues that the value of a complex whole is *not* simply the sum of the values of its parts. A loving relationship (the whole) has vastly more intrinsic value than the sum of the pleasure each person feels individually (the parts). The *relational structure* itself generates unique, non-additive value. Hedonism typically sees value as additive pleasure-units. Moore sees wholes (like genuine friendship or appreciating a masterpiece) as generating value beyond their constituent feelings.
  4.  **Pluralism vs. Monism:** Hedonism (especially Mill's qualitative version) is still fundamentally *monistic*: all intrinsic value reduces to one type of thing – pleasure (even if qualitatively different). Moore is a *pluralist*. He identifies *several* distinct intrinsic goods (affection, beauty, knowledge – though affection/beauty are supreme). These goods are *sui generis* – valuable in their own right, not *because* they produce pleasure. Pleasure *accompanies* them but isn't their defining essence or sole source of value.
  5.  **Cognitive vs. Sensuous Elements:** While involving feeling, Moore's goods have a strong *cognitive* dimension – admiration of qualities, apprehension of beauty, recognition of truth. This contrasts with simpler sensuous pleasures that classical hedonism might also value (though Mill distinguishes "higher" pleasures). The "mental state" is richer and more complex than mere sensation.

  **The Verdict for Your Life Choice:**

  *   **You haven't *fully* escaped a focus on conscious states.** Moore's ethics is still "experientialist" – the good resides in conscious experiences (albeit complex, object-directed ones).
  *   **However, you *have* escaped *classical hedonism*.** Your justification isn't *merely* that painting and friends make you feel good (though they do!). Moore gives you grounds to argue:
      *   Creating and appreciating beauty is intrinsically worthwhile *as an engagement with beauty itself*.
      *   Deep friendship is intrinsically worthwhile *as a mutual appreciation of genuine human qualities in another person*.
      *   The value lies in the *activity and its object*, not just the resulting pleasant feeling. The feeling is a *consequence* or *component* of engaging with the good, not the *definition* of the good.
      *   These activities constitute distinct, irreducible forms of the good life, not just fancy ways to get pleasure units.

  **In short:** Your brother is right that Moore values complex mental states, making his view *experiential*. But he's wrong to collapse it into hedonism. Moore vehemently rejects defining "good" *as* pleasure (the Naturalistic Fallacy), emphasizes the essential role of the *objects* of affection/beauty, invokes organic unities, and is a pluralist. You're not just maximizing fancier pleasures; you're pursuing distinct, irreducible intrinsic goods identified by Moore – the appreciation of beauty and personal affection. That's a much stronger philosophical foundation for your choices than simple hedonism. Tell your brother to check Moore's arguments against the Naturalistic Fallacy and Organic Unities again! 😉
