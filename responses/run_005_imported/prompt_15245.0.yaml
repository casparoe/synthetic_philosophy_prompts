answer: |-
  You're not unhinged, and this isn't just "grad student brain." There **is** a real, principled distinction here, and your annoyance stems from a legitimate sense of being *disrespected* within a small but meaningful social contract, not just disappointment.

  Here's the breakdown of the distinction you're grasping for:

  1.  **The Nature of the Commitment:**
      *   **(a) Changing One's Own Future Plans:** This involves a *personal intention* or a *solo commitment*. "I plan to go to the gym Tuesday" or "I intend to cook pasta tonight." Changing these is purely about individual autonomy. You affect only yourself.
      *   **(b) Ending a Shared Practice/Arrangement:** This involves a *mutual commitment* or a *jointly constituted practice*. "We agreed to cook together Sundays" isn't just two individual intentions coinciding; it's a *shared understanding* and *interdependent action*. It creates a small "we" entity with its own norms and expectations.

  2.  **The Act of Unilateral Declaration:**
      *   In **(a)**, announcing a change ("Not going to the gym Tuesday") is merely *informing* others about a shift in *your* plans. It doesn't presume to dictate *their* actions regarding the *shared* space.
      *   In **(b)**, announcing "I don't want to keep doing Sunday dinners... you don't have to either" commits two distinct acts:
          *   **Withdrawing Consent/Participation:** This is her absolute right. "I will no longer participate." This is the **(a)** part – changing her *own* plans.
          *   **Dissolving the Joint Entity & Releasing You:** This is the problematic part. By declaring *the arrangement itself* over ("gonna just do my own thing going forward") *and* explicitly releasing *you* ("you don't have to either"), she assumes an authority she doesn't possess. She speaks *for* the "we" and *to* you about *your* obligations within that dissolved "we." She unilaterally dismantles the shared structure without consultation.

  3.  **Why it Feels Wrong, Not Just Disappointing:**
      *   **Disregard for Mutual Agency:** The shared practice belonged to *both* of you. Its continuation, modification, or dissolution ideally requires *mutual* acknowledgment or agreement, however informal. Her text skipped this entirely. She acted as the sole arbiter of the "we."
      *   **Presumption of Authority:** By releasing *you* ("you don't have to either"), she implied she held the authority to bind *you* to the arrangement in the first place, or that your continued participation was contingent solely on hers. This diminishes your own agency and stake in the practice. *You* get to decide if *you* want to cook alone on Sundays now, not her.
      *   **Lack of Minimal Process:** Even for informal agreements, a basic social norm suggests: "Hey, I'm thinking I might not want to keep doing the Sunday dinners. What do you think?" acknowledges the shared nature *before* declaring it over. Her message treated it as her personal subscription service she was canceling.
      *   **Denial of Shared Value:** The phrasing ("you don't have to either") subtly frames the whole endeavor as something *she* was allowing or enabling *you* to do, rather than a mutually valued and constructed ritual. It dismisses the possibility that *you* might see inherent value in the *shared* act itself, beyond just the meal.

  **The Philosophical Clothes Fit (and are valid):**

  You're touching on concepts like:
  *   **Joint Commitment (Margaret Gilbert):** Where two or more people commit to doing something as a body, creating mutual obligations.
  *   **Social Contracts (informal versions):** Even tiny agreements create expectations of reciprocity and consultation regarding changes.
  *   **Agency & Recognition:** Being recognized as an equal participant whose consent matters in the continuation or dissolution of shared activities.
  *   **Speech Acts:** Her text wasn't just *informing*, it was *declaring* the end of a shared state of affairs, an act that requires a certain (unpossessed) authority.

  **Why the "It's Just Dinner" Crowd is Missing the Point (Partially):**

  They're right that the *stakes* are low (no one died, you can cook alone). But low stakes don't negate the *principle* of how we treat shared commitments and respect each other's agency within them. Small social friction often illuminates larger patterns. Feeling "wronged" here is valid because a small but real social norm (consultation on ending shared practices) was breached, displaying a lack of respect for your role in the "we."

  **The Pragmatic Reality (that doesn't negate the principle):**

  *   She absolutely has the right to stop participating (the **(a)** part).
  *   Practically, if one person withdraws, the *shared* activity *is* functionally over.
  *   You cannot force her to cook, nor should you want to.

  **Conclusion:**

  You're absolutely right. There *is* a distinction. Your annoyance isn't just about the lost dinners; it's about the *manner* in which it was done – the unilateral dissolution of the "we" and the presumptuous release of you from *your* end of the bargain without consultation. It disregarded your equal stake and agency in the shared practice. It was disrespectful of the small social contract you'd built, even if the contract was informal and the stakes were culinary. Feeling "wronged" rather than merely "disappointed" is justified because the *action* breached a norm of mutual consideration inherent in small joint commitments. It wasn't just *what* she did (stop participating), but *how* she did it (declaring the end of the *shared* thing and speaking for you).

  **What to do now?** If the feeling lingers, you could say something like: "Hey, just wanted to follow up about the Sunday dinners. Totally respect your not wanting to do them anymore! I was just thrown by the text because it felt like you were announcing the end of *our* agreement and releasing *me*, rather than just letting me know *you* were stopping. Made me feel like my part in it wasn't really considered. Anyway, no big deal, just wanted to clear the air." This focuses on the *process* (the "how") rather than trying to resurrect the dinners.
