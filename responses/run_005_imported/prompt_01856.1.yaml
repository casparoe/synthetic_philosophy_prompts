answer: |-
  ## Dialogue: The Character Conundrum

  **Setting:** A conference room at the State Bar Association. **Virtue Ethicist (VE)** and **Situationist (SIT)** face members of the Character and Fitness Committee.

  **VE:** (Nodding politely) Thank you for inviting us. This case highlights a fundamental question: can we reliably assess an applicant's *enduring moral character* – their virtues – through past actions and references? I believe we can, provided we look for consistent patterns of practical wisdom (*phronesis*), not just isolated acts.

  **SIT:** And thank you. But the empirical evidence strongly suggests that what you call "enduring character" is largely an illusion. Consider this applicant: a decade of spotless references, yet one instance of backdating. This isn't an anomaly; it's predictable. John Doris, in *Lack of Character*, dismantles the idea of robust "global" traits like honesty that manifest across all situations. Instead, people have "local" traits – they might be scrupulously honest in reporting expenses to their firm, yet cut corners under intense deadline pressure in court filings. This applicant likely possesses *local* traits conducive to good references, but lacked the *local* trait specific to deadline pressure in that previous role.

  **VE:** You cite Doris, but he misconstrues the Aristotelian view. Virtue isn't a simplistic behavioral reflex triggered identically in every context. It's grounded in *phronesis* – practical wisdom that *interprets* situations. A virtuous person doesn't just "be honest"; they deliberate about *what honesty requires here and now*. Rachana Kamtekar rightly argues that the experiments Doris relies on – like Isen and Levin's "dime in the phone booth" – test thin, automatic behaviors (helping pick up dropped papers), not the exercise of practical wisdom. Finding a dime induced a fleeting mood, altering a trivial helping behavior. Does that prove a person lacks the *character* to be just or courageous in complex professional dilemmas? Hardly. It tests a different psychological mechanism.

  **SIT:** But the mechanism matters! If a trivial mood swing from a found dime can drastically alter helping behavior (Isen & Levin showed helping jumped from 4% to 88%), imagine the power of intense situational pressures like crushing deadlines, fear of job loss, or perceived authority demands. Milgram's obedience experiments are stark proof: ordinary people, likely with "good" references, inflicted severe harm simply because an experimenter told them to. This wasn't about lacking practical wisdom *in that moment*; the *situation* powerfully overrode any presumed stable character. Your applicant faced a high-pressure deadline situation; the situational trigger won. Predicting future behavior requires understanding those triggers, not assuming a monolithic "honest character" will always prevail.

  **VE:** Milgram is precisely my point! Kamtekar contends these experiments don't target virtue *as conceived by Aristotle*. Virtue requires *understanding* the good. Participants in Milgram were *conflicted* and *distressed*; they lacked the practical wisdom to correctly *discern* the moral reality – that their duty wasn't to the experimenter but to the suffering learner. They failed in *phronesis*, not necessarily in some global honesty trait. A truly virtuous person, possessing *phronesis*, would have recognized the illegitimate authority and the harm being done. Your applicant's backdating wasn't a mere reflex; it involved a *deliberate choice* to falsify a date, indicating a failure in practical reasoning – a misjudgment of priorities under pressure. The question isn't just "did the situation cause it?" but "did they possess, or fail to exercise, the wisdom to navigate that situation rightly?"

  **SIT:** You separate "deliberate choice" from situational influence too neatly. Doris argues that situational factors *shape* our perception, our deliberation, and our choices. The intense pressure *impairs* practical wisdom. It wasn't that your applicant suddenly forgot honesty was good; the salience of the deadline, fear of consequences, perhaps even routinization of minor corner-cutting in that office culture, *framed* the decision differently in that moment. The "failure in practical reasoning" *was* the situational effect. And crucially, our committee relies heavily on references – which overwhelmingly reflect behavior in *supportive, low-pressure* situations where "local" honesty traits shine. They tell us little about behavior under the specific, high-stress triggers this applicant encountered before.

  **VE:** I agree references have limits, especially if they only capture low-friction environments. But that argues for *better* character assessment, not abandoning the concept. We *should* probe how applicants reason about past failures. Did this applicant learn? Do they now demonstrate deeper *phronesis*? Can they articulate *why* backdating was wrong, not just procedurally, but as a failure of integrity undermining the law? The decade of spotless behavior *since* isn't irrelevant; it suggests the capacity for growth and the potential establishment of more robust dispositions, *if* integrated through reflection and good practice. Aristotle emphasized virtue is cultivated through *habit* and *learning*. Ignoring that longitudinal evidence because of one pressured failure risks being reductive.

  **SIT:** And focusing solely on the longitudinal evidence risks being naive. Situationism doesn't deny learning or habit formation; it shows habits are often context-bound. The decade of spotless behavior likely occurred in contexts *without* that specific, powerful trigger. The "capacity for growth" you cite might simply mean avoiding *that specific type* of high-pressure situation, or developing better *local* coping strategies for deadlines. But can we be sure a novel, equally potent situational pressure in their future legal practice won't elicit a similar failure? The studies show consistency is often situational, not dispositional. Our prediction is inherently probabilistic and must weigh the *risk* of certain situational constellations recurring.

  **VE:** Prediction is always probabilistic. But your model risks reducing agency to mere reactivity. If *phronesis* is real – the cultivated capacity to perceive, deliberate, and act well across diverse situations – then it *can* provide resilience against situational pressures. The applicant's decade of good conduct *involving various challenges* (even if less intense) suggests the development of that capacity. The single failure was a lapse *in its exercise*, perhaps under exceptional duress, but not proof of its absence. To dismiss the possibility of stable, practically wise character is to despair of moral education and growth altogether. Our procedure may be imperfect, but seeking evidence of *phronesis* through patterns of behavior, reflection, and demonstrated learning isn't a "mistake" – it's acknowledging human moral potential, while demanding rigorous proof of its cultivation.

  **SIT:** And my caution isn't despair, but realism born of evidence. Acknowledging the profound power of situations isn't denying agency; it's understanding its constraints and triggers. We *can* predict better by understanding an applicant's *specific* vulnerabilities – like how they handle extreme deadline pressure – rather than relying on a global "good character" label inferred from mostly benign contexts. The procedure risks a mistake if it confuses "no *recent* bad acts in *favorable* situations" with "possesses a robust, cross-situational virtue." Our prediction for this applicant hinges less on whether they *have* "good moral character" in some abstract sense, and more on whether the *specific situational constellation* that led to past failure is likely to recur in their legal practice, and if so, whether there's evidence they've developed *specific, local* strategies to resist it. The philosophical foundation needs grounding in the messy, context-dependent reality of how behavior actually unfolds.

  **VE:** And my point is that *phronesis* is precisely the faculty meant to navigate that "messy, context-dependent reality." Dismissing it ignores the core of what virtue ethics offers for understanding moral development and resilience. We remain at an impasse, but a productive one: our assessment must be more nuanced, probing both the applicant's understanding and the specific pressures they faced and may face again, without abandoning the search for integrated moral character expressed through practical wisdom.

  **SIT:** Agreed on nuance. But let that nuance be informed by the evidence that "integrated moral character" is often fragmented, and situational pressures are decisive. The best prediction may lie in mapping local traits and vulnerabilities, not assuming global virtue. We may never fully reconcile these views, but the committee's decision must grapple with this tension: the weight of a decade of good conduct versus the demonstrable power of a single, potent situation to override it. Neither reference letters nor a single transgression tell the whole story alone. The philosophical foundation is contested, demanding humility in prediction.

  **(The dialogue ends, highlighting the core tension without resolution, leaving the committee to weigh the arguments.)**
