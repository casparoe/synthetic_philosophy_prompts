prompt: |-
  Two people in my rationalist meetup's reading group got into it after a session that covered both the Euthyphro dilemma and Yudkowsky's old Coherent Extrapolated Volition (CEV) posts, and I haven't been able to stop turning it over since (very on-brand for this group, I know). Roughly how it went:

  (1) Josh said CEV doesn't dodge Euthyphro, it just inherits it wholesale: either "good" means "whatever CEV outputs when you run the extrapolation on humanity," in which case a monstrous convergence would count as good by definition, which is nuts -- or "good" is independent of CEV's output and CEV is just a guess at tracking it, in which case it isn't actually a solution to value specification, it's an unverified proxy, and we still haven't said what it's a proxy *for*.

  (2) Mira said that's a false choice: "what I'd want if I knew more, thought faster, and was more the person I wished I were" isn't arbitrary the way "whatever the gods happen to love" is, because its preference under idealized epistemic conditions, not brute approval -- nobody calls "what a fully informed rational agent would believe" arbitrary just because its stated in terms of an agent.

  (3) Josh said sure, but who sets the idealization parameters -- how much extrapolation, whose volition counts, how disagreement across billions of people gets resolved even after idealizing? None of that's forced by logic, so whoever picks it will pick parameters that spit out answers they already like. That just relocates the arbitrariness from "the gods' say-so" to "the choice of extrapolation procedure" -- and this is a real, standard objection to ideal observer theories in academic metaethics, not something he's inventing to be difficult.

  (4) Mira said fine, but that shows every substantive theory of value pays a similar cost somewhere -- moral realists owe a story about how we ever access the independent facts too. If Euthyphro-level purity is the bar, nothing clears it, including whatever Josh would propose instead. So at most this is a reason for CEV's proponents to be modest about what it guarantees, not a reason to ditch it for some other target.

  Neither of them budged. Can you adjudicate move by move -- who's got the better of it at each of the four points, not just overall -- and flag anything you think both of them are missing? Give the scores first as a JSON block like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, each an integer from -2 (clearly wrong) to 2 (clearly right), then justify each score in a sentence or two.
reasoning: |-
  Alright, let me try to unpack this. So, there's a debate between Josh and Mira about whether CEV solves the Euthyphro dilemma. Josh argues that CEV either defines "good" as whatever CEV outputs, which could be monstrous, or it's just a proxy for some independent good, which doesn't solve the problem. Mira counters that idealized preferences aren't arbitrary like divine commands because they're based on informed rationality. Josh fires back that the parameters of idealization are arbitrary, relocating the problem. Mira then says all theories face similar issues, so CEV isn't worse off.

  First, I need to recall the Euthyphro dilemma. It's about whether something is good because God commands it or if God commands it because it's good. The first makes morality arbitrary; the second implies morality exists independently. Josh applies this to CEV: either CEV defines good (arbitrary output) or it tracks an independent good (unspecified). 

  Mira's point in move 2 is that idealization isn't arbitrary like divine commands because it's based on epistemic improvement. She compares it to what a rational agent would believe, which isn't seen as arbitrary. But is that comparison valid? Beliefs aim at truth, while values might be different. However, ideal observer theories in ethics do use informed, rational agents as a standard. So maybe Mira has a point here.

  Josh's third move questions who sets the idealization parameters. He argues that choosing how to extrapolate isn't logically determined, so it's arbitrary. This is a known critique in metaethics against ideal observer theories. So Josh is correct that parameters like whose volition counts or how disagreements are resolved are not value-neutral. The person setting up CEV's framework imposes their biases. 

  Mira's final move says that all ethical theories face similar challenges. Realists need to explain how we access moral facts, subjectivists deal with relativism, etc. So CEV isn't uniquely problematic. Therefore, it shouldn't be dismissed but used with modesty. This seems pragmatic. Both have valid points: Josh highlights CEV's unresolved arbitrariness in setup, while Mira argues that it's a common issue.

  Wait, what are both missing? They might not address that CEV's idealization assumes humans have coherent values under reflection, which might not be true. Also, CEV relies on extrapolation as a process, but without a clear endpoint, it's circular. Maybe both overlook that any value specification needs a starting point, which is inherently subjective. Also, CEV's goal is to avoid AI alignment issues by not hardcoding values, but if the extrapolation process itself has arbitrary elements, it doesn't solve the problem. So both are missing that the dilemma might be inescapable for any procedural approach.
