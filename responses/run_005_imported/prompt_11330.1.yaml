answer: |-
  You're facing a classic case of **"voluntary role escalation"** combined with **unspoken social contracts** – and your feelings are completely valid. Here's the breakdown:

  **1. You Have No Formal Obligation:**  
  Legally or morally, you never agreed to an indefinite DM role. Campaigns built organically without explicit consent aren't binding commitments. Your partner's "just say yes" view oversimplifies social dynamics – **passive agreement ≠ enthusiastic consent to a long-term responsibility.**

  **2. But There *Is* a Social Reality:**  
  The campaign *feels* real because it *is* real to your friends. Their investment (backstories, chat names, emotional attachment) creates perceived reciprocity. Their reaction ("we're in this together") stems from this shared narrative, not malice. They likely see you as the irreplaceable architect of their fun.

  **3. Burnout Trumps "Obligation":**  
  DM burnout is intense. Continuing out of guilt damages your mental health and *will* tank the campaign's quality. A resentful DM helps no one. Stepping back isn't abandonment – it's sustainability.

  ### How to Step Back Fairly (Without Ghosting):
  **Goal: Acknowledge the shared investment while prioritizing your well-being.**

  | **Step** | **Action** | **Purpose** |
  |----------|------------|-------------|
  | **1. Frame it as "Necessity," not "Choice"** | "I've hit severe DM burnout after 2 years. If I keep going, the campaign will suffer and I'll resent it." | Makes it about capacity, not rejection. Harder to argue with. |
  | **2. Validate Their Investment** | "I love what we built – your characters, the story, [villain name] chat. That’s why this isn’t easy." | Prevents defensiveness. Shows you value their effort. |
  | **3. Offer Concrete Next Steps (Give Agency)** | • Pause for 3 months?<br>• Rotate one-shots?<br>• Someone else takes over?<br>• Co-DM?<br>• Archive campaign? | Shifts focus to solutions. Makes it collaborative, not unilateral. |
  | **4. Set Boundaries Kindly** | "I need at least [X months] off. After that, I might run occasional one-shots, but not this campaign weekly." | Prevents vague hope. |
  | **5. Pass the Torch (Optional but Powerful)** | "If anyone wants to DM, I'll share notes/NPCs/maps." | Eases transition. Shows goodwill. |

  ### Example Script:
  > "Hey everyone, I need to talk about the campaign. I've loved building this world with you all – seeing your character backstories come to life and even naming the group chat after [Villain] has been awesome. But after two years of DMing, I’m completely burnt out. If I keep forcing myself to run sessions, the quality will nosedive and it’ll stop being fun for everyone.  
  >   
  > **I need to step back indefinitely as DM.** I know this sucks, and it’s not because I don’t care about the story we’ve told. To make this less abrupt:  
  > - I’m happy to pause for [3 months] while we figure this out.  
  > - If *anyone* wants to try DMing (this campaign, a new one, or one-shots), I’ll help with notes/lore.  
  > - We could also rotate DMs or take a break to play board games.  
  >   
  > I’m not quitting *you* – I just can’t carry this role anymore. Let’s chat next week about what feels right for the group."

  ### Why This Works:
  - **Acknowledges the organic commitment** without accepting false blame.  
  - **Makes burnout the "villain"**, not you or the players.  
  - **Offers agency** – they choose the next step, reducing helplessness.  
  - **Preserves the friendship** by focusing on collective problem-solving.  

  ### If They Guilt-Trip:
  Stay calm: *"I understand you’re disappointed, but continuing would hurt the game and my well-being. Let’s focus on what we *can* do next."* Repeat as needed. True friends will respect your limits.

  **Bottom Line:** You’re not on the hook. Fairness means giving them clarity and transition options – not sacrificing your health. A campaign that requires martyrdom isn’t sustainable. Good DMs know when to close the book, and great players respect that.
