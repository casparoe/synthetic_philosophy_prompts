answer: |-
  Your skepticism is well-founded—both arguments face significant philosophical challenges, and the claim that Joyce's approach "supersedes" Dutch Book arguments requires careful scrutiny. Let's address your concerns systematically.

  ### 1. **Is Joyce's Argument Truly "Nonpragmatic"?**
     - **What "Nonpragmatic" Means**: Joyce aims to ground coherence in *purely epistemic* norms—specifically, the goal of **accurately representing the world**—rather than in pragmatic avoidance of financial loss. Epistemic rationality, on this view, is about *truth-seeking*, not practical success.
     - **Scoring Rules vs. Wagers**: 
       - *Structural Resemblance*: Yes, scoring rules penalize credences based on outcomes (e.g., Brier score), resembling a "wager against nature." However, the *telos* differs: Dutch Books tie rationality to avoiding *financial exploitation*, while accuracy measures tie it to *proximity to truth*. The penalty is epistemic (inaccuracy), not material loss.
       - **Legitimacy Constraints as Relocated Pragmatism?** Joyce imposes constraints on scoring rules (e.g., **strict propriety**, **truth-directedness**, **convexity**) to ensure they reflect epistemic virtues. Critics argue these constraints might encode hidden pragmatic values (e.g., risk-aversion via convexity). Joyce (2009) defends them as necessary for any coherent concept of "accuracy" (e.g., a non-strictly-proper rule could reward *less informed* credences). 
       - **Assessment**: Joyce earns the "nonpragmatic" label *relative to Dutch Books* by decoupling coherence from betting behavior. However, **the legitimacy constraints remain philosophically loaded**. If you view epistemic values (e.g., "truth-aptness") as ultimately pragmatic (e.g., Rorty-style neopragmatism), the distinction collapses. But within a realist epistemology that treats truth as a fundamental epistemic good, Joyce's approach is nonpragmatic.

  ### 2. **Aggregation Across Propositions: Joyce vs. Dutch Book**
     - **Berker's "Separateness" Objection**: Accuracy-dominance evaluates credence functions *holistically* (e.g., total inaccuracy = sum of individual inaccuracies). This permits trade-offs: a suboptimal credence in *P* might be "compensated" by accuracy gains in *Q*, violating the intuition that belief in *P* should depend *only* on evidence for *P*.
     - **Dutch Book Comparison**: 
       - Dutch Books also operate holistically—a book exploits incoherence across *multiple* bets. However, the "separateness" worry manifests differently:
         - *In Dutch Books*: A bet on *P* is bundled with bets on other propositions, but the *rationale for avoiding exploitation* is proposition-independent (e.g., a sure loss on ¬*P* is bad regardless of *Q*). 
         - *In Accuracy-Dominance*: The scoring rule's *additivity* directly links accuracy across propositions, making rational credence for *P* sensitive to *global* performance.
       - **Key Difference**: Dutch Books exploit *logical/mathematical* incoherence (violations of probability axioms), while accuracy-dominance penalizes *epistemic inefficiency* across the entire belief system. Berker’s objection bites deeper for Joyce because it challenges the **consequentialist framework** itself: should epistemic rationality care about *overall* accuracy, or proposition-wise responsiveness to evidence?

  ### 3. **Which Foundation for Probabilism is More Secure?**
     - **Dutch Book Argument (DBA)**:  
       - **Strengths**: Concrete, behaviorally verifiable (via betting dispositions), and directly exposes the inconsistency in non-probabilistic credences.
       - **Weaknesses**: 
         - **Pragmatic Taint**: Reduces epistemic rationality to instrumental rationality (avoiding financial loss). 
         - **Descriptive Irrelevance**: Actual agents may not have betting dispositions matching their credences.
         - **Scope Limitations**: Applies only to propositions with betting stakes, raising questions about non-empirical beliefs.

     - **Accuracy-Dominance Argument (ADA)**:
       - **Strengths**: 
         - Pure epistemic justification: Coherence is tied to *accuracy*, not practical stakes.
         - **Generalizability**: Extends to non-empirical domains (e.g., logic) where betting is nonsensical.
         - **Theorems**: Joyce's dominance theorem (and later generalizations by Predd et al.) are mathematically robust.
       - **Weaknesses**:
         - **Legitimacy Constraints**: The choice of scoring rule (e.g., Brier score) is not uniquely justified; alternatives (e.g., log score) exist, though strict propriety narrows options.
         - **Separateness Problem**: Holistic assessment clashes with evidentialist intuitions about propositional independence.
         - **Consequentialism**: Treats beliefs as "tools" for accuracy maximization, which may misrepresent the nature of epistemic reasons.

     - **Overall Assessment**:  
       **Joyce's ADA provides the *more purely epistemic* foundation**, successfully decoupling probabilism from pragmatic concerns. However, its **consequentialist structure and holistic aggregation introduce new philosophical problems** absent in Dutch Book arguments. Neither argument is decisively "superior":
       - If you prioritize **epistemic purity**, ADA is stronger—it grounds coherence in truth-seeking, not dollars.
       - If you prioritize **evidentialist separateness** or reject epistemic consequentialism, DBA’s focus on local incoherence (though still holistic in execution) may feel less revisionist.
       - **For foundational security**: ADA’s mathematical generality and epistemic focus make it the more compelling *vindication of probabilism as an epistemic norm*. However, its dependence on contentious legitimacy constraints and its holistic approach leave it vulnerable to deeper metaphysical objections (e.g., "What *is* accuracy?"). Dutch Books, while pragmatically limited, rest on fewer contestable philosophical premises.

  ### Conclusion
  Your TA is right that Joyce supersedes Dutch Books *as an epistemic justification*, but not that the argument is unproblematic. The "nonpragmatic" label holds if epistemic goals are distinct from practical ones, but ADA replaces pragmatic worries with metaphysically fraught questions about accuracy measures and epistemic value aggregation. The separateness problem is *more acute* for ADA due to its explicit additive structure, though Dutch Books are not immune to holistic assessment. Ultimately, **both arguments reveal different facets of coherence**: Dutch Books highlight *consistency in practical commitments*, while Joyce highlights *efficiency in truth-tracking*. The "more secure foundation" depends on whether you find truth-conduciveness a more compelling rationale than exploit-avoidance—a question that hinges on your metaepistemology.
