answer: |-
  You're absolutely right to push back against the glib dismissal of causal decision theory (CDT) here. Parfit's hitchhiker case *is* clever, and the functional/updateless crowd *does* often smuggle in a bait-and-switch by conflating the rationality of the *disposition* with the rationality of the *act*. Let's defend the unfashionable CDT verdict: **Once you are safely in town with cash in hand, paying the driver is objectively irrational for a purely self-interested agent.** Full stop. Here's the strongest case:

  1.  **The Irrelevance of Past Payoffs & Dispositions:** The evolutionary argument (Frank, Schelling) establishes that *having a disposition* to keep promises *can be* rational *ex-ante* because it secures beneficial cooperation *over time*. This is about the *instrumental rationality of a trait*. However, CDT assesses the *instrumental rationality of a specific act*, *given the circumstances at the moment of choice*. At the moment you stand in town, wallet in hand, the payoff for *developing* or *maintaining* the disposition is **already cashed out and irrevocable.** You got the ride. The driver's prediction is history. Whether you pay or not *now* has zero causal impact on your *past* success in securing the ride or your *future* ability to secure similar rides (Parfit explicitly designs this as a one-shot interaction). The disposition served its purpose; acting on it *now* is vestigial. Insisting that the *act* is rational *because* the *disposition* was rational is like arguing that feeling fear *after* escaping a predator is rational because fear *before* escaping motivated the escape. The functional benefit is gone; the costly output remains irrational.

  2.  **The Brutal Logic of Causal Consequences:** CDT's core tenet is ironclad: *Choose the act that causes the best expected outcome.* Let's map the causal structure *at the moment of payment*:
      *   **Act: Pay Driver**
          *   *Direct Consequence:* You lose $X (cash).
          *   *Causal Impact on Driver:* He gains $X. (But he's irrelevant to your self-interest now).
          *   *Causal Impact on *Your* Future State:* None. You are already safe. Your reputation with *this* driver in *this* one-shot interaction is irrelevant to future outcomes. No new doors open; no punishments are avoided.
          *   *Net Causal Outcome for You:* -$X. Worse off.
      *   **Act: Don't Pay Driver**
          *   *Direct Consequence:* You keep $X.
          *   *Causal Impact on Driver:* He gains nothing. (Again, irrelevant).
          *   *Causal Impact on *Your* Future State:* None. You are safe. Driver leaves. No repercussions.
          *   *Net Causal Outcome for You:* +$X relative to paying. Better off.
      *   **Conclusion:** Not paying causes strictly better consequences *for you* than paying. Ergo, paying is causally dominated and irrational under CDT. This isn't a flaw in CDT; it's CDT *correctly identifying* the causal nullity of the payment *at this point*.

  3.  **The "But You *Are* That Agent" Red Herring:** Functional Decision Theories (FDT, UDT) argue you should pay because "you" are the *type* of agent who pays, and being that type got you the ride. This commits a fundamental category error:
      *   **The Agent at T1 (Stranded) vs. The Agent at T2 (Safe):** The "you" making the decision in the desert (T1) and the "you" deciding to pay in town (T2) are *different decision-makers facing different games*. The T1 "you" *correctly* sees the value in being the paying-type to get the ride. The T2 "you" faces a *completely different* causal matrix: the ride is secured, the prediction is fixed. The "type" is a *description of past behavior*, not a causal lever T2 "you" can pull to change the past or magically create future benefits *in this scenario*. FDT/UDT effectively demand that T2 "you" sacrifice resources *as a ritual* to maintain a *label* that has *already served its purpose and has no future utility in this interaction*. This is mysticism, not rationality. Rationality requires adapting action to the *current* causal landscape, not slavishly adhering to an identity defined by past strategic needs.

  4.  **The Slippery Slope of Counterfactual Identity:** FDT/UDT relies on evaluating acts based on what *would* happen if a *counterfactual version* of you (the one who pays) *had been* predicted. But at T2, you are *not* that counterfactual agent *making the prediction*; you are the *actual* agent *facing the consequence of the already-made prediction*. Linking your T2 act back to the driver's T1 prediction requires a magical, acausal influence – the very thing CDT rightly rejects. Your T2 decision *does not cause* the driver's T1 prediction; it was the *expectation* of your T2 behavior (based on your perceived type/disposition at T1) that caused his action. By T2, that expectation is fixed. Acting *as if* you can retroactively justify the prediction by fulfilling it is irrational; the prediction was either right or wrong *before* you acted.

  5.  **The Evolutionary Analogy Holds, and It Cuts Against Paying:** Your instinct is correct. Evolution favors dispositions (e.g., vengefulness) because they deter future exploitation. But *acting* on vengefulness *in a specific instance* where there are *no future interactions* and *no observers* (like Parfit's desert) is often biologically costly and irrational *for that individual act*. The lioness who expends precious calories chasing the hyena *after* it has already dropped her cub's carcass and fled is acting on a useful disposition but making an irrational *act* in that isolated moment. Evolution "solves" this via inflexible heuristics because the cost of *not* having the disposition is usually higher than the occasional wasted cost of acting on it pointlessly. But rationality, especially CDT's narrow instrumental focus, *should* be able to identify the pointless cost. Demanding the T2 agent pay is demanding they mimic the evolutionary heuristic *even when its functional justification is absent*.

  **Conclusion & Why CDT Stands:**

  Parfit's hitchhiker case brilliantly exposes a *limitation* of pure, myopic CDT for agents operating in repeated social contexts where reputation matters. It powerfully argues for the *instrumental rationality of cultivating certain inflexible dispositions*. **However, it does *not* prove that the *act* of paying at T2 is rational.** It proves that *being the type of agent who will irrationally pay at T2* is advantageous *at T1*.

  CDT delivers the correct, albeit uncomfortable, verdict at T2: paying is irrational. The functionalist "refutation" only works by:
  1.  Illegitimately importing the strategic context of T1 into the causally isolated moment of T2.
  2.  Confusing the rationality of a *trait* (the disposition) with the rationality of an *act* (paying).
  3.  Relying on acausal, counterfactual reasoning that CDT explicitly rejects as non-rational (in the instrumental sense).

  Your discomfort is well-founded. The crowd declaring this a "knock-down refutation" of CDT is often guilty of moving the goalposts. They haven't shown paying at T2 is rational; they've shown *wanting to be the type who pays at T2* is rational *at T1*. CDT remains the clearest, most objective standard for evaluating the causal consequences of an *individual act at the moment of choice*. In the stark isolation of Parfit's desert town, paying the driver is throwing good money after a benefit already secured. That's irrational. The evolutionary biologist in you recognizes the value of the disposition; the philosopher should recognize the distinction between that value and the irrationality of its final, causally inert expression. CDT gets the act right, even if it makes building a cooperative society harder.
