  We are analyzing a debate about Gibbard's Lumpl and Goliath case. The moves are:

  (1) He: Accepting Kripke's necessity of identity, contingent identity is impossible. Either they are necessarily identical or they are distinct from the start because the lump survives squashing and the statue doesn't.

  (2) She: Having two distinct objects that are indistinguishable in all actual properties (except modal ones) is stranger than contingent identity, so we should reject a premise of Kripke's argument.

  (3) He: Leibniz's Law (using the property "can survive being squashed") shows non-identity without needing contingent identity or touching Kripke's argument.

  (4) She: Using "can survive being squashed" as a property assumes the very distinction in question (which object we are tracking), so it's question-begging.

  We'll score each move from -2 (badly mistaken) to 2 (clearly right) and then explain.

  First, let's recall the context: Gibbard's example has a statue (Goliath) and the lump of clay (Lumpl) that are created at the same time and destroyed at the same time. However, the lump could have been reshaped (e.g., into a ball) without being destroyed, while the statue would be destroyed by such reshaping. So, they have different modal properties.

  Now, the moves:

  Move (1): He argues that if identity is necessary (as per Kripke), then either Lumpl and Goliath are necessarily identical (which they can't be because in some possible worlds they come apart) or they are distinct from the beginning because of the difference in modal properties.

  Scoring (1): This is a standard and valid point. Kripke's necessity of identity (if x=y, then necessarily x=y) implies that if there is any world in which one exists without the other or they have different properties, then they are not identical. The argument is sound. However, note that Gibbard's contingent identity view is precisely an attempt to challenge the necessity of identity in such cases. So, while the move is correct within the framework that accepts Kripke's argument, it doesn't engage with Gibbard's challenge to that framework. We'll score it as 1 (correct but not the whole story).

  Move (2): She says that having two distinct objects that are coincident and indistinguishable in all non-modal properties is stranger than accepting contingent identity, so we should reject a premise of Kripke's argument.

  Scoring (2): This is also a good point. The idea of two objects occupying the same space at the same time and having all the same intrinsic and extrinsic properties (except modal ones) is metaphysically odd. Gibbard's view avoids this by allowing contingent identity. The move correctly identifies the cost of the alternative and suggests rejecting a premise (presumably the necessity of identity) to avoid it. This is a reasonable move in the debate. Score: 1.

  Move (3): He counters that Leibniz's Law (indiscernibility of identicals) alone shows non-identity because the two have different properties now (e.g., one has the property "can survive being squashed" and the other doesn't). So, we don't need the necessity of identity.

  Scoring (3): This is a clever move. Leibniz's Law states that if x and y are identical, then they must share all properties. The property "can survive being squashed" (or more precisely, the modal property of being able to survive being squashed) is a property that one has and the other lacks. Therefore, by Leibniz's Law, they are not identical. This avoids the necessity of identity argument and directly uses a core principle. However, note that the property in question is modal, and one might question whether modal properties are genuine properties for the purpose of Leibniz's Law. But in standard metaphysics, they are. This move is strong. We'll score it 2.

  Move (4): She responds that using the property "can survive being squashed" as a distinguishing property assumes that we are talking about two different objects to which the property applies. But the very issue is whether there is one object or two. If we are tracking the lump, it survives; if we are tracking the statue, it doesn't. So, the property is not a neutral one but depends on how we individuate the object. Thus, using it in Leibniz's Law begs the question.

  Scoring (4): This is a profound point. The property "can survive being squashed" is not a categorical property but a modal one that depends on how we identify the object across possible worlds. If we are considering the lump, then it can survive being reshaped; if we are considering the statue, it cannot. But the debate is about whether the lump and the statue are the same object. To say that they have different modal properties is to already assume that they are distinct. Therefore, using Leibniz's Law with this property is circular. This move successfully undercuts the previous one. Score: 2.

  Now, let's summarize the scores:

  - Move (1): 1 (correct but doesn't address the challenge to the framework)
  - Move (2): 1 (good point about the cost of the alternative, but it doesn't refute the necessity of identity)
  - Move (3): 2 (initially seems strong, but as move (4) shows, it may be circular)
  - Move (4): 2 (effectively points out the circularity in move (3))

  However, note that move (4) doesn't necessarily refute move (3) entirely. It just shows that the property used in move (3) is not neutral. But if we accept that modal properties are genuine and that we can attribute them without presupposing the identity of the object, then move (3) stands. The debate hinges on whether modal properties are legitimate for Leibniz's Law and whether they can be attributed independently.

  Also, neither side addressed a deeper issue: the puzzle often leads to discussions about the criteria of persistence and identity over time, and about the nature of artifacts versus their matter. For instance, one might argue that the statue is a different kind of thing (an artifact) than the lump (a quantity of matter) and hence they have different persistence conditions. But then the question becomes: can two things of different kinds occupy the same space at the same time?

  Moreover, Gibbard's solution (contingent identity) is not widely accepted because it conflicts with the necessity of identity. But the alternative (coincident entities) is also controversial. Some philosophers (like David Lewis) use counterpart theory to handle such cases without contingent identity or coincidence. Others (like Judith Jarvis Thomson) accept coincidence but with temporal parts.

  So, the scores:

  {"1": 1, "2": 1, "3": 2, "4": 2}

  But note: move (3) is scored 2 because it is a valid application of Leibniz's Law if we accept modal properties. Move (4) is also scored 2 because it correctly identifies the circularity. However, move (3) is not necessarily wrong; it just depends on prior commitments. So the high scores reflect that both are strong within their own assumptions.

