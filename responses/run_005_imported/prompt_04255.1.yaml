answer: |-
  You're absolutely right that Aquinas plants a crucial seed for tyrannicide arguments, but your "90% of the way" and "any private citizen may licitly kill" summary *does* flatten a critical nuance that likely explains your TA's unease. Aquinas provides the *theoretical justification* but surrounds it with profound practical and theological cautions that significantly differentiate him from later Monarchomachs like Mariana. Here's the breakdown:

  1.  **The Radical Core (Your Point):** Yes, Aquinas unequivocally states the principle that a ruler governing for private gain, not the common good, is a *tyrant* and forfeits legitimacy, becoming a mere private enemy of the community.
  2.  **The Crucial Nuance (The Flattening):** Aquinas **does not** frame tyrannicide by a private citizen as a straightforward, licit *right* or *duty* akin to killing a common criminal. He presents it as an **extraordinarily dangerous, last-resort act of desperation**, fraught with peril and requiring immense personal virtue and sacrifice. The *locus classicus* (De Regimine Principum, I, 6) is more complex than the "brave men" snippet suggests.

  **Key Passage & Its Full Context (De Regimine Principum, I, 6):**

  > "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power. It must not be thought that such a multitude is acting unfaithfully in deposing the tyrant, even though it had previously subjected itself to him in perpetuity, because he himself has deserved that the covenant with his subjects should not be kept, since, in ruling the multitude, he did not act faithfully as the office of a king demands... **Nevertheless, it seems that to proceed against the cruelty of tyrants is an action to be undertaken, not through the private presumption of a few, but rather by public authority.** If to attack the authority of a tyrant has been the right of public authority from the beginning, when the multitude set him up, *much more is the right of public authority operative when the body of the community provides a remedy against the king's wickedness.* **But if no human aid can be invoked against a tyrant, recourse must be had to God, the King of all, who is a helper in due time in tribulation. For it lies in his power to turn the cruel heart of the tyrant to mildness.** According to Solomon: 'The heart of the king is in the hand of the Lord, withersoever he will he shall turn it'... **Indeed, if there be no possibility of human resistance against the tyrant, recourse must be had to God, the King of all. Yet it is praiseworthy, if the opportunity presents itself, for a man to act against the regime of a tyrant even at the risk of his life, in order to liberate the community, just as a man is also praised if he risks his bodily life for the salvation of a friend.** But one who fails to make such an attempt is not to be blamed. Hence, among the Romans, although the earlier emperors tyrannically persecuted the faith of Christ, many eminent men attempted to liberate the community, and lost their lives in the attempt, gaining the name and glory of martyrs. This is what we read of in the case of the blessed Polyeuctus and of many others." (Emphasis added)

  **Analysis & Why it's not "90% of Mariana":**

  1.  **Strong Preference for Public Authority:** Aquinas *explicitly prioritizes* action by "public authority" (e.g., councils, representatives of the community, higher authorities like the Pope/Emperor over a king). Private action is *not* the primary or preferred route. Mariana and the Monarchomachs are far more direct in legitimizing private action.
  2.  **Recourse to God First:** When public authority fails, Aquinas's *first* recourse is **prayer and divine intervention**, trusting God to change the tyrant's heart. Tyrannicide is positioned *after* this, as a desperate human act *only* when divine aid seems delayed or absent. This theological framework is central to Aquinas but largely absent in the secularizing arguments of the early moderns.
  3.  **Praiseworthy, Not Necessarily "Licit" as a Right:** Aquinas frames the act as "praiseworthy" (*laudabile*) under specific conditions (opportunity, risk of life, intent to liberate), comparable to dying for a friend. He contrasts it with inaction, which is "not to be blamed." This is *not* the language of a clear *right* or *duty*. He avoids the stronger "licit" (*licitum*) here. It's an act of supreme, risky virtue, not a juridical permission. Mariana uses much more permissive and legalistic language.
  4.  **Danger of Worse Outcomes:** While not explicit in this passage, Aquinas's overall political philosophy (rooted in Aristotle) deeply fears disorder and civil war. The unstated but powerful context is that a botched tyrannicide or one undertaken without overwhelming public support could easily lead to greater evils or a worse tyrant. This fear tempers the "praiseworthiness." The Monarchomachs were writing in contexts (French Wars of Religion) where this risk was deemed necessary.
  5.  **Focus on Liberation, Not Just Killing:** The goal is "to liberate the community" (*ad liberationem multitudinis*). The act is justified by its *public* purpose, not merely the removal of a bad ruler. It's framed as an act *for* the community.

  **Passages to Drive the Parallel (While Acknowledging Nuance):**

  Beyond *De Regimine* I.6, these reinforce the theoretical basis *for* resistance/tyrannicide, showing Aquinas laid the groundwork, even if later thinkers ran further with it:

  1.  **Summa Theologiae II-II, Q.42, A.2, ad 3 (On Sedition):**
      > *"Sedition is opposed to the unity of the multitude, namely, of the people or city... **Therefore, just as it is praiseworthy to unsettle the unity of a band of robbers, so it is praiseworthy to unsettle a tyrannical regime.** For this is not sedition properly speaking, except perhaps metaphorically, since a tyrant does not govern for the common good but for his own private advantage, and therefore there is no just unity to disturb."*
      *   **Why it's relevant:** Explicitly states that resisting a tyrant is *not* sedition but a praiseworthy act analogous to breaking up a criminal gang. This directly undermines the tyrant's claim to represent legitimate unity. It provides the crucial "he's no longer a legitimate ruler" argument.

  2.  **Summa Theologiae II-II, Q.64, A.3 (On Killing):**
      > *"It is lawful to kill an evildoer only in so far as it is directed to the welfare of the whole community... **Now the care of the common good is entrusted to persons of public authority. Therefore, to them alone it belongs to kill evildoers, and not to private individuals.**"*
      *   **But also:** *"A private person cannot lawfully kill another even in self-defense, except accidentally... **But it is lawful for a private individual to resist by force an attack upon himself or his property, using only such force as is necessary to defend himself.**"*
      *   **Why it's relevant:** While affirming the *general* principle that only public authority can kill *as punishment*, Aquinas carves out the space for private *defensive* killing. The Monarchomachs argued that killing a tyrant was precisely an act of *public* self-defense by a private citizen acting *for* the community when authorities failed. Aquinas's self-defense principle is the seed from which this argument grows, even if he doesn't explicitly apply it to tyrants here.

  3.  **Summa Theologiae II-II, Q.104, A.6 (On Obedience):**
      > *"As stated above (Article 5), a subject is not bound to obey his superior if the latter command him to do something wherein he is not subject to him. **Now one is not subject to a superior in matters contrary to God's command. Therefore, in such matters, one is not bound to obey a human authority.**"*
      *   **Why it's relevant:** Establishes the bedrock principle that obedience to human authority is *not* absolute and ceases when that authority commands evil or acts contrary to divine law/governs tyrannically. This is the fundamental theological justification for *any* resistance, passive or active. Without this, tyrannicide arguments collapse. It's the essential precondition for the arguments in *De Regimine* I.6.

  **How to Adjust Your Presentation (Keeping the Punch, Adding Accuracy):**

  1.  **Reframe the Claim:** Instead of "90% of the way to Mariana," say something like: "Aquinas provides the *theological and philosophical bedrock* for the radical early modern position on tyrannicide. He establishes the core principle that a tyrant forfeits legitimacy and becomes a public enemy, *and* he explicitly states that a private citizen acting to liberate the community at great personal risk can be *praiseworthy*. However, Aquinas wraps this explosive idea in profound cautions: he strongly prefers action by public authorities or divine intervention first, and frames private tyrannicide as a dangerous, last-resort act of supreme virtue, not a straightforward right. The Monarchomachs and Mariana took Aquinas's core justification and stripped away much of his Aristotelian and theological caution, making the private citizen's 'right' to kill far more explicit and central."
  2.  **Use the Passages:** Put up *De Regimine* I.6 (fuller context, highlighting "public authority," "recourse to God," and "praiseworthy"), ST II-II Q.42 A.2 ad 3 (resisting tyrant not sedition), and ST II-II Q.104 A.6 (limits of obedience). Briefly contrast with a short, punchy quote from Mariana (e.g., on the permissibility of poison or the right/duty of any citizen).
  3.  **Highlight the Nuance:** Explicitly point out the differences: Aquinas's fear of disorder, his trust in God and established hierarchies, vs. the Monarchomachs operating in a context of collapsing authority and religious war, needing a more direct, actionable doctrine.
  4.  **Keep the Fun:** The core point *is* still radical and surprising to students! Framing it as "Aquinas gave them the intellectual dynamite, but carefully wrapped it in Aristotelian caution tape; later thinkers decided to just light the fuse" can be just as engaging while being more accurate.

  Your TA likely sensed that Aquinas's profound emphasis on order, hierarchy, divine providence, and the *dangers* of private action was being minimized. By acknowledging this crucial nuance while still showcasing the genuinely revolutionary core of his thought, you make the comparison *more* powerful and pedagogically richer.
