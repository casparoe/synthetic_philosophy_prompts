answer: |-
  David Lewis would likely view contemporary internet-scale norm formation as a **significant challenge to his theory**, possibly falling outside his strict definition of convention, but he might also offer nuanced concessions about *approximations* of common knowledge. Here’s how his framework would likely respond to your concerns:

  ### Core Tensions with Lewis's Model:
  1. **Common Knowledge in Anonymous Masses**:  
     Lewisian common knowledge requires "iterated mutual expectations" (I know that you know that I know...). In algorithmically mediated spaces (e.g., TikTok, Reddit), users are often pseudonymous, transient, and lack stable mutual awareness. A viral meme’s "rules" might be known *to many*, but not necessarily *mutually expected among participants* in a way that satisfies Lewis’s recursive criterion.

  2. **Stable Populations vs. Fluid Networks**:  
     Lewis assumed repeated interactions among a fixed group. Online "communities" are dynamic: users join/leave, algorithms amplify content unpredictably, and subcultures fragment. This undermines the "recurrence" needed for conventions to stabilize via precedent.

  3. **Algorithmic Mediation ≠ Mutual Adjustment**:  
     Lewisian conventions emerge from *decentralized* individual responses to shared expectations. Platforms *centralize* norm formation: algorithms push content (creating artificial salience), while metrics (likes, shares) *simulate* consensus without genuine mutual belief. A "trending" hashtag isn’t a focal point negotiated by users—it’s engineered.

  ### Lewis's Likely Response:  
  He might bifurcate internet norms into two categories:

  #### A. **Cases Resembling Conventions** (with weakened common knowledge):  
     - **Platform-Specific Microcosms**: Small, persistent subcommunities (e.g., a niche Discord server) *could* develop Lewisian conventions if members have recurring, identity-aware interactions and mutual observation (e.g., "In this server, 🌿 means 'source?'").  
     - **Salience via Virality**: Viral phenomena (e.g., "distracted boyfriend" meme) might act as **focal points** due to algorithmic amplification. Lewis (*Convention*, Ch. 3) allows that salience can bootstrap common knowledge. If a format is *universally visible* (e.g., Twitter's trending page), it *approximates* common knowledge by sheer exposure—though he’d note this is **epistemically thinner** than face-to-face reciprocity.  

  #### B. **Non-Conventional Phenomena**:  
     Most large-scale digital "norms" (e.g., emoji semantics, AI ethics debates) would fail his criteria:  
     - **No Coordination Equilibrium**: Many online behaviors (e.g., using 😂 sarcastically) aren’t solutions to *recurring coordination problems* but fleeting expressions.  
     - **External Enforcement**: Content moderation/AI filters impose norms *top-down*, violating Lewis’s requirement that conventions are *arbitrary* and self-sustaining.  
     - **Fragmented Knowledge**: In polarized spaces (e.g., political subreddits), opposing groups lack shared expectations—undermining "common" knowledge.  

  ### Theoretical Implications:  
  Lewis would likely argue that his model **exposes limitations of digital normativity**, not its own inadequacy:  
  > *"What you call 'conventions' on social media are often **signaling cascades** or **algorithmic herd behaviors**—not solutions to coordination problems sustained by mutual expectations. They lack the ontological structure of convention."*  

  However, he might concede that **platform infrastructures create *functional substitutes* for common knowledge**:  
  - **Metrics as Proxies**: Upvotes/retweets act as *public indicators* of behavior, enabling users to form higher-order beliefs ("Many people expect 🙏 to mean 'please' or 'thank you'").  
  - **Scalable Salience**: Algorithms engineer focal points (e.g., "challenges" on TikTok), artificially creating *common ground* at scale.  

  ### Critical Evolution: Toward a "Thinner" Theory?  
  Lewis might accept that digital environments necessitate **weaker forms of mutual expectation**:  
  - **"Bounded" Common Knowledge**: Users act *as if* expectations are shared within a platform/context, despite imperfect knowledge.  
  - **Role of Artifacts**: Meme formats/emojis become *stabilizing artifacts* that reduce the need for deep mutual knowledge by standardizing expression.  

  Yet he’d insist this diverges from his core model. Modern theorists (e.g., Cristina Bicchieri) extend Lewis with **"scripted" norms** and **networked expectations**, arguing digital conventions rely on:  
  - **Visibility structures** (e.g., quote-tweets exposing norms),  
  - **Algorithmic curation** creating *pseudo-common knowledge*,  
  - **Impersonal trust** in platform-wide signals over interpersonal reciprocity.  

  ### Conclusion:  
  Lewis would likely see internet-scale norms as **proto-conventions** or **convention-adjacent phenomena** that highlight the *fragility* of common knowledge in fragmented, mediated spaces. While platform affordances enable novel coordination, they often lack the mutualistic, self-perpetuating structure definitive of Lewisian convention. This suggests his theory remains robust for bounded communities but requires augmentation for anonymity and scale—perhaps through concepts like **ambient common knowledge** (public metrics as belief scaffolding) or **algorithmically assisted salience**.  

  For your seminar: Emphasize that Lewis’s value lies in *diagnosing* why digital norms feel unstable—they often fail his criteria for deep convention, operating instead as thin, platform-dependent equilibria.
