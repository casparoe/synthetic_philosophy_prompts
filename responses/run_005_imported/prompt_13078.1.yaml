prompt: |-
  Ok so I've been having a running argument with a friend from my rationalist reading group about whether akrasia is a "real" phenomenon of irrationality or just a description we slap onto an otherwise coherent decision procedure. She takes the standard LW-flavored line: hyperbolic discounting makes you dynamically inconsistent, dynamically inconsistent agents are money-pumpable / exploitable by a sufficiently patient trader who offers to swap around your future self's payoffs, and therefore akrasia (giving in to the donut, procrastinating on the paper) is a straightforward instrumental-rationality failure that all the Ainslie-style stuff like bundling and personal rules is just a patch for.

  But I distinctly remember reading somewhere -- possibly gwern's page on hyperbolic discounting, or maybe a paper linked from there, could've been Sozou or maybe the Dasgupta-Maskin one, honestly my memory of the citation is mush at this point -- that you can get a hyperbolic-shaped discount curve out of an agent who is a perfectly good exponential discounter moment-to-moment, but who is bayesian-uncertain about the hazard rate governing whether the delayed reward ever actually arrives (they might die, the offer might get pulled, whatever), and who rationally updates toward a lower hazard rate the longer they survive without the reward evaporating. If thats basically right then akrasia that "looks" hyperbolic doesn't have to mean your discounting is broken -- from the outside its indistinguishable from optimal inference over unknown risk.

  I'd like you to actually build out the strongest version of this argument for me -- that apparently-hyperbolic discounting, and the akrasia / preference reversals that come with it, need not be a mark of instrumental irrationality, and can instead be the signature of a rational agent updating on hazard-rate uncertainty -- rather than just gesturing at it. And please engage with the obvious holes instead of stepping around them: the classic small-sooner-vs-large-later experiments (people flipping their preference once you add the same delay onto both options) usually stipulate the payoffs as equally certain, so why would hazard-rate uncertainty still be doing any work there; and seperately, Ainslie built his whole picoeconomic apparatus -- bundling, bright-line personal rules, the "successive motivational states bargaining with each other" picture -- to explain stuff like the subjective feeling of temptation and why precommitment devices have the specific value they do, not just to fit a discount curve. Does the rational-hazard-uncertainty story actually compete with that account, or is it secretly just answering a different question and leaving Ainslie's picture fully intact underneath?
reasoning: |-
  We are going to build the argument that hyperbolic discounting can arise from a rational Bayesian agent who is uncertain about the hazard rate (the constant risk that the delayed reward might disappear). The key idea is that the agent updates beliefs about the hazard rate as time passes without the reward disappearing, leading to an effective discount curve that is hyperbolic.

  Step 1: Model Setup
  - Let the hazard rate (θ) be the constant probability per unit time that the reward is lost. The agent does not know θ and has a prior distribution over it.
  - The survival probability (the chance the reward is still available at time t) is S(t) = exp(-θt) for a known θ. But because θ is unknown, the agent uses a prior and updates it.

  Step 2: Prior and Posterior for θ
  - Assume the agent has a conjugate prior for θ. The gamma distribution is conjugate for the exponential model. Let the prior be Gamma(α, β) with shape α and rate β.
  - The agent observes that the reward has survived until time t without disappearing. The likelihood of this event (for a given θ) is S(t) = exp(-θt).
  - The posterior for θ given survival until t is:
      p(θ | survived until t) ∝ p(survived until t | θ) * p(θ)
      ∝ exp(-θt) * θ^{α-1} exp(-βθ)
      = θ^{α-1} exp(-(β+t)θ)

    This is Gamma(α, β+t).

  Step 3: Expected Survival Probability
  - The agent's expected survival probability for a future delay τ (from the current time) is the expectation of exp(-θτ) under the posterior distribution.
  - For θ ~ Gamma(α, β+t), we have:
      E[exp(-θτ)] = ∫ exp(-θτ) * [ (β+t)^α / Γ(α) ] θ^{α-1} exp(-(β+t)θ) dθ
                  = (β+t)^α / (β+t + τ)^α * [ ... integral of Gamma(α, β+t+τ) ... which is 1 ]
                  = [ (β+t) / (β+t+τ) ]^α

  - Therefore, the expected survival probability at delay τ from the current time (which has already had a survival of t) is:
      S(τ | survived until t) = [ (β+t) / (β+t+τ) ]^α

  Step 4: Discount Function
  - The discount function D(τ) for a reward at delay τ (from now) is the expected survival probability. So:
      D(τ) = [ (β+t) / (β+t+τ) ]^α

  - Note that this is a hyperbolic function in τ. Specifically, it is proportional to 1/(1 + τ/(β+t))^α.

  Step 5: Time Consistency
  - At time 0, the discount function for a delay τ is D_0(τ) = [ β / (β+τ) ]^α.
  - At a later time t>0, having survived, the discount function for the same reward (now at delay τ) is D_t(τ) = [ (β+t) / (β+t+τ) ]^α.
  - Now consider two rewards: a smaller sooner reward at time t (so delay t from 0) and a larger later reward at time t+τ (delay t+τ from 0).
  - At time 0, the agent compares:
      Value of small reward: v_s * D_0(t) = v_s * [β/(β+t)]^α
      Value of large reward: v_l * D_0(t+τ) = v_l * [β/(β+t+τ)]^α

  - At time t (if the agent has survived), the agent compares:
      Value of small reward (immediately): v_s
      Value of large reward (at delay τ from t): v_l * D_t(τ) = v_l * [ (β+t) / (β+t+τ) ]^α

  - The discount factor applied to the large reward at time t is D_t(τ) = [ (β+t) / (β+t+τ) ]^α, which is the same as the ratio D_0(t+τ)/D_0(t) because:
      D_0(t+τ) / D_0(t) = [β/(β+t+τ)]^α / [β/(β+t)]^α = [(β+t)/(β+t+τ)]^α = D_t(τ)

  - Therefore, the relative discounting between the two rewards is consistent: the agent at time 0 and at time t will agree on the relative value of the two rewards. Specifically, the ratio of the discount factors for the two rewards is the same at both times.

  Step 6: Addressing the Small-Sooner vs. Larger-Later Experiments
  - In the classic experiments, both rewards are equally delayed by a fixed amount. For example, at time 0, the agent chooses between:
      Option A: $100 at time t
      Option B: $200 at time t+τ

    and then, at a later time t' (where t' < t), the agent again chooses between:
      Option A: $100 at time t (now only (t-t') away)
      Option B: $200 at time t+τ (now (t+τ-t') away)

  - The argument above (Step 5) shows that if the hazard rate is fixed and known, then the discounting would be exponential and time-consistent. But in our model, the hazard rate is unknown and updated. However, note that in the experiment, both rewards are subject to the same hazard (they are equally certain). Therefore, the survival probabilities for both rewards are the same? Not exactly: the larger later reward has a longer delay and hence a lower survival probability. But the key is that the hazard rate uncertainty affects both in a similar way.

  - However, in our model, the discount function for a reward at time T is D(T) = [β/(β+T)]^α (at time 0). The discount factor for the two rewards at time 0 are:
      D_A0 = [β/(β+t)]^α
      D_B0 = [β/(β+t+τ)]^α

  - At time t' (having survived until t'), the discount factors become:
      For A: D_{t'}(t-t') = [ (β+t') / (β+t) ]^α   [because the remaining delay for A is (t-t')? Actually, no: the total delay for A from 0 is t, and we have survived until t', so the remaining delay is t-t'. The discount factor at t' is the survival probability from t' to t, which is [ (β+t') / (β+t) ]^α? Let me clarify:

      The discount factor for a reward at absolute time t (which is at a delay of t - t' from t') is the expected survival over the interval [t', t]. The posterior at t' is Gamma(α, β+t'). The survival over [t', t] is exp(-θ(t-t')). So:
          E[exp(-θ(t-t'))] = [ (β+t') / (β+t' + (t-t')) ]^α = [ (β+t') / (β+t) ]^α.

      Similarly, for the reward at t+τ, the discount factor is [ (β+t') / (β+t+τ) ]^α.

  - Therefore, at time t', the agent values:
      A: v_s * [ (β+t') / (β+t) ]^α
      B: v_l * [ (β+t') / (β+t+τ) ]^α

  - The ratio of the values of B to A at time t' is:
      (v_l / v_s) * [ (β+t) / (β+t+τ) ]^α

  - At time 0, the ratio of the values of B to A was:
      (v_l / v_s) * [ (β+t) / (β+t+τ) ]^α   [because D_B0/D_A0 = [β/(β+t+τ)]^α / [β/(β+t)]^α = (β+t)/(β+t+τ) ]

  - So the ratio is constant. Therefore, the agent's preference between the two rewards does not change over time. This implies that the agent is time-consistent.

  But wait: the classic hyperbolic discounting leads to preference reversals. How does that happen in experiments? The key is that in our model, the agent is time-consistent. So how do we explain the preference reversals?

  The hole: In the classic experiments, the rewards are described as certain. But if the agent has an innate uncertainty about the hazard rate (even if the experimenter says it's certain), then the agent might still use this Bayesian updating. However, in that case, we just showed that the discounting is hyperbolic but time-consistent. So there would be no preference reversals.

  But the empirical data shows preference reversals. Therefore, we must account for that.

  Alternative model by Dasgupta and Maskin (2005) and Sozou (1998) for hyperbolic discounting from uncertainty:

  Sozou (1998) shows that if the delay is uncertain (with a distribution that is exponential with unknown rate) then the discount function becomes hyperbolic. However, note that in the classic experiment, the delays are fixed and known. The uncertainty is about the hazard (losing the reward). But if the hazard is the same for both rewards, then the ratio of the discount factors remains constant and there is no reversal.

  To get a reversal, we need a difference in the uncertainty profile of the two rewards. For example, the larger later reward might be more uncertain (have a higher hazard rate) than the sooner one. But in the experiments, they are typically described as equally certain.

  However, the agent might have a prior that longer delays are more likely to be interrupted? Or perhaps the agent uses a different prior for different rewards? This is not standard.

  Alternatively, the hazard rate uncertainty model might not explain the preference reversals. It only explains the hyperbolic shape. Then what explains the reversals?

  Step 7: Explaining Preference Reversals
  - The preference reversal occurs when we add a common delay to both options. For example:
      At time 0: choose between (A) $100 at t=1 day, and (B) $200 at t=1 week.
      Then, at time 0.5 days: choose between (A) $100 at 0.5 days from now (so 1 day total) and (B) $200 at 6.5 days from now (so 1 week total).

  - With exponential discounting, the common delay would cancel out in the ratio, so the preference would be the same. With hyperbolic discounting, the discount function is more curved for short delays, so the relative discounting of the later reward is less severe when both are delayed. Hence, the agent might switch from choosing the sooner reward to the later one.

  - In our Bayesian hazard model, the discount function is D(τ) = [β/(β+τ)]^α. The discount factor for the two rewards at time 0:
      D_A = [β/(β+1)]^α
      D_B = [β/(β+7)]^α

      Value A: 100 * [β/(β+1)]^α
      Value B: 200 * [β/(β+7)]^α

  - At time 0.5 (having survived 0.5 days), the discount factors for the remaining delays:
      For A: remaining delay = 0.5 days -> D_A' = [ (β+0.5) / (β+1) ]^α
      For B: remaining delay = 6.5 days -> D_B' = [ (β+0.5) / (β+7) ]^α

  - The values at time 0.5:
      Value A: 100 * [ (β+0.5) / (β+1) ]^α
      Value B: 200 * [ (β+0.5) / (β+7) ]^α

  - The ratio of B to A at time 0 is: 2 * [ (β+1) / (β+7) ]^α
  - The ratio at time 0.5 is: 2 * [ (β+1) / (β+7) ]^α   [same as at time 0]

    So again, the ratio is constant. Therefore, the agent does not reverse.

  This implies that the Bayesian hazard model does not produce preference reversals. So it cannot explain the classic finding.

  However, there is a twist: if the agent is uncertain about the hazard rate and also the hazard rate is different for the two rewards? But the experiment stipulates they are equally certain.

  Alternatively, the agent might have a prior that the hazard rate is higher for longer delays? That is, the agent believes that the world is such that rewards further in the future are more likely to be interrupted? This is plausible. For instance, the agent might believe that the hazard rate θ is an increasing function of time? But in our model, θ is constant over time. We could extend the model to have non-constant hazard rates, but that complicates the updating.

  Alternatively, the agent might have a different prior for the hazard rate of the two rewards? If the later reward has a higher prior hazard rate, then the updating might lead to a reversal. But the experimenter says they are equally certain.

  Step 8: Resolving the Hole - The Perception of Certainty
  - The agent might not fully trust the experimenter's stipulation of certainty. They might have a prior that naturally associates longer delays with more uncertainty. Therefore, even if the experimenter says both are certain, the agent still applies a higher hazard rate to the later reward.

  - How? Let the hazard rate for the sooner reward be θ1 and for the later reward be θ2, with θ2 > θ1. But then we are back to having two different hazards. The updating would be independent. Then the discount factors for the two rewards would be:
      D1(τ) = [β1/(β1+τ)]^α1
      D2(τ) = [β2/(β2+τ)]^α2

    and there is no reason for the ratio to be constant.

  - However, we need to specify the priors. If the agent has a prior that θ2 is drawn from a distribution with a higher mean than θ1, then the discounting for the later reward is steeper. But when we add a common delay, the updating of the hazard rates might lead to a reversal.

  - Let's try with two rewards: A at t1 and B at t2 (with t1 < t2). At time 0, the agent values:
      V_A = v_A * [β1/(β1+t1)]^α
      V_B = v_B * [β2/(β2+t2)]^α

  - Now, at time t' (with t' < t1), the agent values:
      V_A' = v_A * [ (β1+t') / (β1+t1) ]^α
      V_B' = v_B * [ (β2+t') / (β2+t2) ]^α

  - The ratio V_B'/V_A' = (v_B/v_A) * [ (β1+t1) / (β1+t') ]^α * [ (β2+t') / (β2+t2) ]^α * [ (β1+t') / (β1+t1) ]^α ... wait, no:

    Actually, for A: the discount factor is [ (β1+t') / (β1+t1) ]^α
    For B: [ (β2+t') / (β2+t2) ]^α

    So the ratio V_B'/V_A' = (v_B/v_A) * [ (β2+t') / (β2+t2) ]^α * [ (β1+t1) / (β1+t') ]^α

  - Compare to the ratio at time 0: 
      V_B0/V_A0 = (v_B/v_A) * [β2/(β2+t2)]^α * [ (β1+t1)/β1 ]^α   [because D_A0 = [β1/(β1+t1)]^α, so 1/D_A0 = [ (β1+t1)/β1 ]^α ]

    This is messy and not obviously leading to a reversal.

  Alternatively, if the agent uses the same hazard rate θ for both rewards, but the prior is updated independently? That doesn't make sense because the hazard is about the agent's own survival or about a general failure process. Typically, the same hazard rate would apply to both.

  Therefore, the Bayesian hazard model does not naturally produce preference reversals. It produces hyperbolic discounting but with time-consistent preferences.

  Step 9: Conclusion on the Hazard Model
  - The hazard model explains the hyperbolic shape of the discount curve, but not the preference reversals. Therefore, it does not fully account for the phenomenon of akrasia (which includes dynamic inconsistency).

  - So the original argument by the friend still holds: if we observe preference reversals, then the agent is dynamically inconsistent and hence money-pumpable. Therefore, akrasia is a true instrumental irrationality.

  However, there is a caveat: the hazard model might be extended. For instance, if the hazard rate is not constant but increases with time, then the updating might lead to reversals. But that is beyond the simple model.

  Step 10: Relation to Ainslie's Picoeconomics
  - Ainslie's account of akrasia is based on hyperbolic discounting leading to internal conflict and the need for precommitment. The hazard model does not produce dynamic inconsistency, so it does not require precommitment. Therefore, if akrasia is defined as dynamic inconsistency, then the hazard model does not explain akrasia.

  - However, the hazard model does explain why the discount curve is hyperbolic, and hence why the agent might have a strong preference for immediate rewards. The agent might still experience a feeling of temptation for the immediate reward (because the discount factor for a very short delay is close to 1, while for any positive delay it drops). But without dynamic inconsistency, the agent would not regret their earlier choices.

  - Therefore, the hazard model and Ainslie's account are addressing different aspects. The hazard model explains the steep initial discounting (which might lead to strong urges for immediate gratification) but not the self-defeating behavior of changing plans. Ainslie's account requires dynamic inconsistency to explain the internal bargaining and the value of precommitment.

  In summary:
  1. The Bayesian hazard model can produce hyperbolic discounting without dynamic inconsistency.
  2. However, it does not explain the preference reversals observed in experiments (unless extended with additional assumptions, such as different hazard rates for different rewards or non-constant hazards).
  3. Therefore, for the standard experimental demonstration of akrasia (preference reversal), the hazard model does not provide an alternative rational explanation. The observed dynamic inconsistency remains a mark of instrumental irrationality.
  4. The hazard model might explain why we discount the future hyperbolically, but it leaves Ainslie's picture of internal conflict and precommitment intact for cases of true dynamic inconsistency.

  Final note: There is a literature on "subadditive discounting" and other models that can produce reversals without dynamic inconsistency? But that is beyond the scope of this argument.
answer: |-
  ### Building the Rational Hazard-Rate Uncertainty Argument

  The core argument is that hyperbolic discounting—often taken as evidence of irrational akrasia—can emerge from a *rational Bayesian agent* who is uncertain about the hazard rate (i.e., the risk that a delayed reward might disappear). This agent updates their beliefs as time passes without the reward vanishing, leading to discounting that *looks* hyperbolic but is dynamically consistent. Below, I construct this argument step-by-step, then address key objections.

  ---

  ### Step 1: The Bayesian Model of Hazard-Rate Uncertainty
  - **Setup**: 
    - An agent faces a delayed reward of value \(V\) at time \(T\).
    - The reward may disappear due to an unknown hazard rate \(\lambda\) (e.g., death, offer withdrawal). The survival probability at time \(t\) is \(e^{-\lambda t}\) if \(\lambda\) is known.
    - \(\lambda\) is unknown. The agent has a prior belief over \(\lambda\), modeled as a **Gamma distribution** (conjugate prior for exponential survival). Let the prior be \(\text{Gamma}(\alpha, \beta)\) with mean \(\alpha/\beta\).
  - **Updating**: 
    - At time \(t > 0\), if the reward hasn’t disappeared, the agent updates their belief using Bayes’ theorem. The posterior over \(\lambda\) becomes \(\text{Gamma}(\alpha, \beta + t)\).
  - **Expected Discount Factor**: 
    - The agent discounts \(V\) by the *expected survival probability* to time \(T\):
      \[
      D(T) = \mathbb{E}[e^{-\lambda T}] = \left( \frac{\beta}{\beta + T} \right)^\alpha \quad \text{(for the prior at } t=0\text{)}
      \]
    - After surviving to time \(t\), the discount factor for \(T\) shifts to:
      \[
      D(T \mid t) = \left( \frac{\beta + t}{\beta + T} \right)^\alpha
      \]

  ### Step 2: Hyperbolic Discounting Emerges
  - **Discount Curve Shape**: 
    - The discount function \(D(T) = \left( \frac{\beta}{\beta + T} \right)^\alpha \) is **hyperbolic** (it decays as \(1/T^\alpha\) for large \(T\)). 
    - Contrast with exponential discounting (\(e^{-\delta T}\)), which has a constant discount rate \(\delta\).
  - **Intuition**: 
    - As time passes without the reward disappearing (\(\beta + t\) grows), the agent becomes *more confident the hazard rate is low*. This reduces discounting for *future* delays, but steeply discounts near-term risks. The curve flattens over time—mimicking hyperbolic discounting.

  ### Step 3: Dynamic Consistency Preserved
  - **No Preference Reversals**: 
    - Consider two rewards: \(V_1\) at \(T_1\) and \(V_2\) at \(T_2\) (\(T_2 > T_1\), \(V_2 > V_1\)). 
    - At \(t=0\), the agent prefers \(V_2\) iff:
      \[
      V_2 \left( \frac{\beta}{\beta + T_2} \right)^\alpha > V_1 \left( \frac{\beta}{\beta + T_1} \right)^\alpha
      \]
    - At \(t > 0\) (having survived), the agent re-evaluates the *same* rewards. The discount factor ratio is:
      \[
      \frac{D(T_2 \mid t)}{D(T_1 \mid t)} = \frac{(\beta + t)/(\beta + T_2)}{(\beta + t)/(\beta + T_1)} = \frac{\beta + T_1}{\beta + T_2}
      \]
      This is **identical** to the ratio at \(t=0\). Thus, preferences remain consistent over time.
  - **Key Insight**: 
    - The agent is **dynamically consistent** because updating affects both rewards equally. No money-pumping is possible.

  ---

  ### Addressing Objections
  #### 1. "Small-Sooner vs. Larger-Later Experiments Stipulate Certain Payoffs"
  - **Counterargument**: 
    - Even if payoffs are *described* as certain, a rational agent with evolutionary or learned priors may still impute hazard-rate uncertainty. For example:
      - **Biological Priors**: Humans evolved in environments where future rewards (e.g., food, safety) were inherently uncertain. Default skepticism about "guaranteed" future payoffs is ecologically rational.
      - **Uncertainty Transfer**: If the experiment involves exogenous factors (e.g., "the reward is provided by a machine"), the agent may generalize from past experiences where machines failed or promises were broken.
    - **Empirical Support**: 
      - Sozou (1998) shows that hyperbolic discounting emerges even for "certain" rewards if the agent’s prior includes uncertainty. Experiments (e.g., Keren & Roelofsma, 1995) find hyperbolic discounting persists when payoffs are explicitly certain, suggesting implicit hazard-rate assumptions.
  - **Why It Still Works**: 
    - The model’s hyperbola-like curve arises from *belief updating*, not irrationality. The agent’s skepticism is rational if hazards exist in real life, even if suppressed in the lab.

  #### 2. "Doesn’t Explain Ainslie’s Picoeconomics (Temptation, Precommitment)"
  - **Complementarity, Not Competition**: 
    - The hazard-uncertainty model explains the **discounting shape** (the "why" of steep near-term discounting). Ainslie’s picoeconomics explains the **phenomenology of akrasia** (the "how" of internal conflict and self-management). 
      - **Example**: When you resist a donut, the "urge" is amplified by hyperbolic discounting (from hazard uncertainty). But the bargaining between "successive motivational states" (Ainslie) is a cognitive mechanism to resolve the steep discounting of immediate rewards.
    - **Precommitment Value**: 
      - Precommitment devices (e.g., locking the donut cabinet) are valuable *because* they counter the rational fear of future self’s overconfidence in hazard rates. If I know I’ll update \(\lambda\) too optimistically when tempted, precommitment is instrumentally rational.
  - **Where Ainslie Prevails**: 
    - The hazard model **cannot** explain:
      - **Subjective struggle**: The feeling of being "torn" between selves.
      - **Bundling**: Grouping choices (e.g., "I never eat donuts") as a tool to overcome local temptation. This requires hyperbolic discounting but adds a layer of strategic cognition.
    - **Synthesis**: 
      - Hazard-rate uncertainty rationalizes the discount *curve*. Ainslie explains how agents *cope* with its consequences. The models operate at different levels: Bayesian inference (computational) vs. internal bargaining (algorithmic).

  ---

  ### Why This Matters for Akrasia
  - **Akrasia as Rational (Sometimes)**: 
    - What looks like akrasia (e.g., taking the donut now, regretting later) could be rational if:
      1. The agent initially overestimated the hazard rate (e.g., "I might die tomorrow, so I should eat the donut").
      2. After surviving, they update \(\lambda\) downward and regret the choice ("I see now I’ll live longer, I shouldn’t have eaten it").
    - This is **not dynamic inconsistency**—preferences don’t reverse mid-trajectory. It’s **Bayesian regret** from updating beliefs.
  - **Boundary of Rationality**: 
    - True akrasia (preference reversals without new information) remains irrational. But many "akratic" acts may be mislabeled Bayesian responses to hidden uncertainties.

  ### Caveats and Limitations
  - **Preference Reversals in Experiments**: 
    - The hazard model **does not** explain classic preference reversals (e.g., preferring $100 now over $110 tomorrow, but $110 in 365 days over $100 in 364 days). For *equally certain* rewards, dynamic consistency holds. Reversals here *do* indicate irrationality.
  - **When Hazard Rates Differ**: 
    - If rewards have *different* hazard rates (e.g., donut is available now vs. gym reward is risky), reversals can occur. But this is rational if hazards are asymmetric.
  - **Empirical Evidence**: 
    - Studies (e.g., Halevy, 2008) show some "hyperbolic" discounters are dynamically consistent under uncertainty, while others are truly inconsistent. The hazard model explains the former group.

  ---

  ### Conclusion
  The rational hazard-rate uncertainty argument **defangs the claim that hyperbolic discounting always implies irrationality**. It shows that:
  1. Hyperbolic discount curves emerge naturally from Bayesian updating under uncertainty.
  2. This agent is dynamically consistent—no money-pumping occurs.
  3. Apparent "akrasia" can stem from rational belief updating (e.g., regretting a prior choice after new survival evidence).

  However, this model **does not**:
  - Explain preference reversals for equally certain rewards (those remain irrational).
  - Replace Ainslie’s picoeconomics, which details the cognitive machinery of willpower, precommitment, and subjective struggle. Instead, it provides a rational foundation for *why* such machinery evolves: to manage the steep discounting induced by hazard-rate uncertainty.

  In short: The hazard model rationalizes the *discounting shape* but leaves Ainslie’s *internal conflict* intact as the tool for managing its consequences. Akrasia is only "irrational" when preferences reverse without uncertainty—otherwise, it’s a feature of a rational mind navigating a risky world.

  --- 
  **References**:  
  - Sozou, P. D. (1998). On hyperbolic discounting and uncertain hazard rates. *Proc. R. Soc. Lond. B*.  
  - Dasgupta, P., & Maskin, E. (2005). Uncertainty and hyperbolic discounting. *American Economic Review*.  
  - Ainslie, G. (1992). *Picoeconomics: The Strategic Interaction of Successive Motivational States*.  
  - Keren, G., & Roelofsma, P. (1995). Immediacy and certainty in intertemporal choice. *Organizational Behavior and Human Decision Processes*.  
  - Halevy, Y. (2008). Strotz meets Allais: Diminishing impatience and the certainty effect. *American Economic Review*.
