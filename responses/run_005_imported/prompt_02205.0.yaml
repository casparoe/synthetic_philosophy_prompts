  First, I need to recall Rorty's key ideas. He was heavily influenced by pragmatism and thinkers like Wittgenstein and Davidson. Rorty argued against representationalism—the belief that language and thoughts mirror an external reality. Instead, he saw language as a tool for coping with the world, not representing it. Knowledge and truth, for him, are about social justification rather than accurate representation.

  Now, applying this to the LLM debate. The "real understanding" side likely assumes that true comprehension requires internal representations of meaning or reality. The "stochastic parrot" side argues that LLMs only predict text without such representations. Both seem to hinge on whether there's an internal mirroring of reality. Rorty would probably say both camps are stuck in a representationalist framework, which he rejected.

  But why? Because for Rorty, understanding isn't about having correct mental representations. It's about using language effectively within a social context. So, asking if LLMs "really" understand presumes there's a fact of the matter beyond their utility. Rorty would shift the question to how useful LLMs are in various contexts, not whether they possess some metaphysical understanding.

