prompt: |-
  Quick one for a piece I'm chewing on about how stakes affect knowledge claims. I've been reading up on Hannah and the bank cases, and it seems like epistemic contextualism and pragmatic encroachment are basically just two names for the same insight — that whether you count as "knowing" something depends on how much is riding on it. Am I missing some real difference between the two camps, or is it more just a branding split between people studying the exact same phenomenon? Everytime I ask a philosopher they just restate their own camp's jargon back at me, so I could use a straight answer.
reasoning: |-
  Okay, the user is writing a piece about how stakes affect knowledge claims and is confused about whether epistemic contextualism and pragmatic encroachment are essentially the same thing. They mention Hannah and the bank cases, which are classic examples in epistemology. The user feels that philosophers from each camp just repeat jargon without clarifying the differences. They need a straight answer to understand if there's a real distinction or if it's just branding.

  First, I recall that both theories address how practical stakes influence knowledge ascriptions. The bank cases by DeRose show that in high-stakes situations, people are less likely to say someone "knows" something. But the key difference lies in what exactly is affected by the stakes.

  Epistemic contextualism, championed by DeRose and Cohen, argues that the word "knows" is context-sensitive. The meaning of "knows" changes based on the speaker's context. So in high-stakes contexts, the standards for what counts as knowledge get higher. It's about the semantics of the knowledge attribution itself.

  Pragmatic encroachment, associated with Fantl, McGrath, and Stanley, claims that the stakes affect the epistemic facts themselves. Knowledge isn't just about truth, belief, and justification; practical factors can make a difference to whether someone truly knows. So it's not about language but about what knowledge is.

  The user might be conflating the two because both deal with stakes affecting whether we attribute knowledge. But the underlying mechanisms are different: one is linguistic, the other is metaphysical. The user's frustration with jargon is understandable, so I need to explain this without technical terms.

  I should use the bank cases to illustrate. In both low and high stakes, Hannah's evidence is the same. Contextualists say the word "knows" has different meanings in each context. Pragmatic encroachers say her actual knowledge status changes due to stakes, not just the word usage.

  The user's deeper need is clarity for their article. They want to accurately represent both theories without oversimplifying. They might also need to address why the distinction matters, perhaps in debates about skepticism or applied epistemology. Highlighting the "what vs. how" difference could help: contextualism is about how we talk, encroachment is about what knowledge is.

  Also, noting the objections each theory faces could add depth. Contextualism struggles with semantic issues, while pragmatic encroachment faces the purist objection. Mentioning this shows the user the ongoing debates and that it's not just semantics.

  Finally, reassure the user that their initial insight isn't wrong—both respond to the same intuition—but the philosophical underpinnings differ. Emphasizing the semantic vs. epistemic split should clarify the distinction for their piece.
answer: |-
  You're absolutely right that both epistemic contextualism and pragmatic encroachment spring from the same powerful intuition showcased in "bank cases" (like DeRose's Hannah scenarios): **whether we attribute "knowledge" to someone seems highly sensitive to the practical stakes involved.** Your frustration with jargon-laden answers is understandable. While they share this core insight, they offer *fundamentally different explanations* for *why* stakes matter. It's **not just branding** – it's a deep philosophical disagreement about what's *actually happening* when stakes shift.

  Here's the breakdown:

  1.  **Epistemic Contextualism (DeRose, Cohen, Lewis):**
      *   **Thesis:** The word "knows" and related epistemic terms (like "certain") are **context-sensitive.** Their meaning (specifically, the *standards* they require to be satisfied) shifts depending on the context of the *speaker* making the knowledge attribution.
      *   **Mechanism:** In high-stakes contexts (e.g., attributing knowledge to Hannah about the bank being open when huge sums are at risk), the word "knows" automatically demands *much higher standards of evidence or justification* to be true. In low-stakes contexts (small sums), "knows" demands lower standards. Hannah's evidence stays the same, but what *counts* as "knowing" changes with the conversational context.
      *   **What Changes:** The *semantic content* (meaning/truth-conditions) of the *knowledge claim itself*. "Hannah knows the bank is open" expresses a *different proposition* in the low-stakes context (easier to satisfy) than it does in the high-stakes context (harder to satisfy).
      *   **Analogy:** Like the word "tall." "Is John tall?" means different things (has different truth-conditions) when asked about a junior high basketball team vs. the NBA. John's height is fixed, but the standard denoted by "tall" shifts.
      *   **Core Objection:** It makes knowledge attributions frustratingly unstable and potentially misleading. If Hannah *really* possesses the same strong evidence in both cases, why does calling it "knowledge" depend on *someone else's* context?

  2.  **Pragmatic Encroachment (Fantl & McGrath, Stanley, Hawthorne):**
      *   **Thesis:** Practical stakes (and interests) don't change the *meaning* of "knows." Instead, they **directly affect whether a person genuinely *has* knowledge.** Knowledge itself has a pragmatic component.
      *   **Mechanism:** Whether a true, justified belief counts as *knowledge* depends not only on traditional factors (truth, belief, justification/reliability) but also on the **practical costs of being wrong** relative to the subject's situation. High stakes *raise the bar* for what counts as sufficient justification *for it to be knowledge*.
      *   **What Changes:** The *epistemic status* of the *subject's belief*. In high-stakes Hannah's situation, her *identical evidence* is **no longer sufficient justification *for knowledge*** because the cost of error is too high. She genuinely *doesn't know* in the high-stakes scenario, even though she *does know* in the low-stakes scenario with the same evidence.
      *   **Analogy:** Like the justification needed for a medical decision. The *same diagnostic test result* might be sufficient justification for a doctor to *know* a benign condition is present (low stakes), but utterly *insufficient* justification to *know* a life-threatening condition *isn't* present (high stakes) – even if the test result is equally reliable in both cases. The stakes change what level of justification is *required for knowledge*.
      *   **Core Objection:** It seems to "blur" the line between purely epistemic factors (truth, evidence, reliability) and practical concerns. Purists argue knowledge *should* be determined solely by the relationship between the believer and the truth, not by what's riding on it.

  **The Crucial Distinction Summarized:**

  *   **Contextualism:** Stakes change **how we *talk* about knowledge** (the meaning of the word "knows" shifts). The subject's *actual epistemic position* might be fixed, but whether we *call* it "knowledge" varies.
  *   **Pragmatic Encroachment:** Stakes change **whether the subject actually *has* knowledge** (by changing the justification threshold required). The subject's *epistemic status itself* varies with the stakes.

  **Why the confusion? Shared Intuition & Shared Target:**

  *   Both accept the **Bank Case Data:** Our willingness to *say* "S knows that P" decreases as the stakes for S (or the attributor) increase.
  *   Both reject **Classical Invariantism:** The idea that the standards for knowledge are fixed and context/stakes-independent. Both agree classical invariantism can't explain the bank cases.
  *   Both oppose **Skepticism:** They aim to preserve the idea that we *do* know lots of ordinary things in low-stakes contexts.

  **In your piece, emphasize this:** While contextualists and encroachers agree stakes *matter*, they wage a philosophical war over *where the action is happening* – in the language we use (contextualism) or in the nature of knowledge itself (encroachment). It's a debate about **semantics vs. metaphysics.** The bank cases reveal the phenomenon; these are competing explanations for *why* the phenomenon occurs. Neither camp thinks the other is describing the *same* mechanism – they think the other camp is fundamentally *mistaken* about the mechanism!
