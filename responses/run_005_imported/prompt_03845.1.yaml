answer: |-
  Your intuition is spot-on—this is a fascinating philosophical puzzle (specifically, **causal overdetermination** with **preemption**) that can be resolved with a principled, asymmetric approach. Here's how to justify it narratively and legally without authorial fiat:

  ### Key Philosophical/Legal Framework: **Actual Cause & Preemption**
  1. **The "But-For" Test (Counterfactual Dependence)**  
     Legally, causation often asks: "But for the defendant's action, would the harm have occurred?"  
     - **Child 1 (Fast Poison):** "But for Child 1's poison, would the father have died *at that exact moment*?" → **No.** He’d have died later.  
     - **Child 2 (Slow Poison):** "But for Child 2's poison, would the father have died at that moment?" → **Yes.** Child 1’s poison alone caused the immediate death.  

     Child 1’s action is necessary for the death *as it happened* (timing and manner). Child 2’s action is redundant for *this specific outcome*.

  2. **Preemption Over Symmetry**  
     This is **preemptive overdetermination**: Child 1’s act preempted Child 2’s by causing death before Child 2’s poison could take effect. The slow poison never had a chance to operate as a lethal agent.  
     - **Analogy:** Two arsonists set fires to a house simultaneously—one with gasoline (fast), one with kerosene (slow). The gasoline fire destroys the house before the kerosene ignites. Only the gasoline arsonist caused *this* destruction. The kerosene arsonist is guilty of *attempted* arson.

  3. **Proximate Cause & Completion**  
     Child 2’s poison did not **complete its causal process**. Toxins require time to metabolize, disrupt biological functions, and cause death. The fast poison completed this process; the slow poison was interrupted mid-process.  
     - **Autopsy Evidence:** The detective can find only metabolites of the fast poison in lethal concentrations at death. The slow poison is present but below the fatal threshold *at the time of death*.

  ---

  ### How to Implement This in Your Story
  1. **The Detective’s Reasoning:**  
     > "The father died of acute [fast poison] toxicity within minutes. [Slow poison] was present, but its concentration was only 20% of the lethal dose at the time of death—it hadn’t had time to circulate. Had [Child 1] not acted, [slow poison] *would* have killed him by midnight. But it didn’t. What killed him *here, now* was [Child 1]’s poison. [Child 2]’s actions show intent to kill, but they didn’t cause this death."

  2. **Moral Asymmetry:**  
     - **Child 1** is guilty of **murder**: They directly caused death.  
     - **Child 2** is guilty of **attempted murder**: They intended to kill and took substantial steps, but their actions didn’t cause the actual death.  
     - **Psychological Angle:** Child 2 might feel shock ("I failed?") or perverse relief ("He died before my poison could work"). Child 1 bears the weight of knowing they succeeded.

  3. **Forensic Clues for the Reader:**  
     - The fast poison causes specific symptoms (e.g., cyanosis, convulsions) matching the father’s death.  
     - The slow poison leaves traces (e.g., bitter almond scent) in the wine glass, but no corresponding physiological effects.  
     - A toxicology report showing lethal levels of FastPoison™ and sub-lethal levels of SlowPoison® in the corpse.

  ---

  ### Why This Isn’t Authorial Fiat
  - **Causality in Law:** Real courts distinguish actual vs. potential causes. Precedents like *R v. White* (1910) acquitted a slow poisoner because the victim died of heart failure *before* the poison took effect.  
  - **Philosophical Consensus:** Theorists like David Lewis argue that preempted causes (Child 2) are not actual causes—they’re "trumped" by the preempting cause (Child 1).  
  - **Scientific Reality:** Toxins operate on biological timelines. If Death Event occurs before Toxin B’s mechanism completes, Toxin B didn’t cause it.

  ---

  ### Pitfalls to Avoid
  - **Don’t make the poisons identical:** Emphasize the fast poison’s rapid action (e.g., cyanide) vs. the slow poison’s delayed mechanism (e.g., heavy metals).  
  - **Don’t let Child 2’s poison contribute:** Ensure the fast poison alone explains *all* fatal symptoms.  
  - **Address the "He’d have died anyway" argument:** Have the detective dismiss it:  
    > "This isn’t about hypotheticals. It’s about what *actually happened*. [Child 2]’s poison didn’t kill him—it was rendered irrelevant."

  This approach preserves your asymmetry while grounding it in real-world logic. The detective (and reader) can confidently condemn Child 1 as the killer and Child 2 as a failed murderer.
