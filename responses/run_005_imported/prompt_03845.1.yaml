  I recall the "preemptive causation" framework: Child 1's poison is the actual cause because it (1) produced the death, (2) did so before any alternative could operate, and (3) made the second poison's effect redundant. Crucially, Child 2's poison never had a chance to kill—it was interrupted. That creates asymmetry. Legally, this aligns with "but-for" tests: but for Child 1's action, death wouldn't have occurred *when it did*. Child 2's poison would kill later, so their action isn't necessary for the death that happened.

