  For infinitism, their stack overflow analogy is strong, but I should note that some philosophers argue for "non-vicious" infinitism where the chain is infinite but each step provides justification. Maybe it's like lazy evaluation in programming, where you don't compute everything at once. Still, that's a tough sell and not widely accepted.

