  so this has been living in my head rent free for a few weeks now. for my AI ethics elective we had to pick a philosophy-of-AI topic to dig into, and i went down a rabbit hole after re-reading about that "Golden Gate Claude" thing Anthropic did last year -- they used some technique (sparse autoencoders i think?) to find a "feature" inside the model that lit up around the Golden Gate Bridge, and when they cranked it up the model got completely obsessed, even claiming it literally WAS the bridge. every article i read described this as the model "representing" the bridge internally, like theres a little piece of it that means bridge kind of the way a word or a photo can mean something. but then i found some more skeptical stuff (i think one term for it was "realism" about interpretability, as opposed to some other camp) arguing that's actually a huge claim to make, and that all we really know for sure is some numbers in the network go up when bridge-y stuff shows up, which isnt obviously the same thing as "representing" anything.

  i brought this up with my friend who's way more into ML than me and he just said "it's literally just weights and activations, calling that a representation is just us being poetic," which felt like it was dodging the question more than answering it. so could you actually get into the weeds of what's being argued here? like what would even have to be true for a pattern of activations inside a neural net to count as a genuine representation of something, instead of just a correlate or a label we're projecting onto the math after the fact -- and why do people who clearly know this stuff well still land on totally different sides? i don't want the "some people think yes, some think no" version, i want to actually get why it's a hard question, if that makes sense.
