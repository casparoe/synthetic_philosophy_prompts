answer: |-
  Here's the sharpest formulation of the Darwinian debunking argument against moral realism, explicitly addressing the "But what about math/logic?" counterargument. This draws heavily on Sharon Street's work and the "tracking vs. coincidence" distinction you recalled:

  **The Core Darwinian Debunking Argument (Genealogical Critique):**

  1.  **The Selective Influence:** Our moral intuitions, sentiments, and cognitive faculties for forming moral judgments (e.g., empathy, reciprocity, outrage, guilt) were overwhelmingly shaped by natural selection.
  2.  **Selection for Fitness, Not Truth:** Natural selection favors traits that enhance *reproductive fitness* (survival and reproduction). It cares about *adaptive behavior*, not *truth*. Traits promoting cooperation, kin protection, alliance formation, and conflict avoidance *within a specific ancestral environment* were selected for.
  3.  **The Reliability Challenge:** Therefore, there is a powerful *evolutionary* explanation for why we hold the moral beliefs we do, entirely independent of whether those beliefs correspond to any mind-independent moral truths. Our moral faculties were "designed" (by natural selection) to produce *adaptive* judgments, not necessarily *true* ones.
  4.  **The Coincidence Problem:** If Moral Realism were true (i.e., there are objective, mind-independent moral facts), then for our evolved moral faculties to reliably track *those* truths would require an implausible coincidence. Why would the moral truths *just happen* to align perfectly with the set of judgments that enhanced fitness in the Pleistocene? It would be an astonishing piece of luck if the adaptive judgments evolution selected *also* corresponded to the objective moral reality.

  **Anticipating and Crushing the "Math/Logic" Counterargument:**

  *   **The Counter:** "Hold on! Our capacities for arithmetic, logic, and basic empirical reasoning are *also* products of evolution. We don't think *those* faculties are unreliable or that math/logic is 'debunked' just because it helped our ancestors count berries or avoid predators. Why treat morality differently? Doesn't evolution select for *truth-tracking* in these domains?"
  *   **The Sophisticated Rebuttal (Tracking vs. Coincidence):**
      *   **Direct Tracking in Math/Logic:** In domains like arithmetic, logic, and basic empirical perception (e.g., object permanence, spatial relations, cause-and-effect), **the *adaptive value* of the faculty *depends directly* on its *tracking the relevant mind-independent truths***. Getting 2+2=4 *wrong* consistently would have been catastrophically maladaptive. Misjudging the trajectory of a predator or the structural integrity of a branch would get you killed. Successfully navigating the physical world *required* that these cognitive faculties track (at least approximately) the actual structure of that world. Evolution *couldn't* have selected for systematically false beliefs here because false beliefs would lead to fatal actions. The fitness benefit *derives from* truth-tracking accuracy.
      *   **No Necessary Tracking in Morality:** For moral judgments, the situation is fundamentally different. The adaptive value of believing "one ought to care for one's offspring" or "one ought to reciprocate favors" lies **solely in the *behavior* these beliefs motivate** – behavior that enhances survival and reproduction. Crucially, evolution *could* have produced these adaptive behaviors *via* beliefs that are completely *false* from the perspective of objective moral truth. The fitness benefit comes *directly* from the behavior, *not* from the belief accurately representing some moral fact "out there."
      *   **The Crucial Distinction:** Evolution *designed* our math/logic/perception faculties to *get the world right* because getting it right *was* the adaptive advantage. In contrast, evolution *designed* our moral faculties to *get us to behave adaptively*; whether the accompanying beliefs *also* get some mind-independent moral reality right is irrelevant to their selective advantage. It's a happy accident *if* they do, but there's zero evolutionary pressure *ensuring* this alignment.
      *   **The "Why Not Both?" Objection:** A realist might argue, "Couldn't evolution have selected for both adaptive behavior *and* true moral beliefs?" The debunker's reply: **Yes, but it *didn't have to*, and there's no reason to think it *did*.** The *entire* selective history can be explained by the adaptive value of the behaviors alone. Adding objective moral truth is explanatorily superfluous. The realist must then explain the *mechanism* by which evolution ensured this alignment, which seems entirely mysterious. The default assumption, given the selective pressures, is that our moral beliefs track fitness, not moral truth.
      *   **Contingency Test:** Imagine radically different evolutionary pressures. Could a species evolve with moral intuitions praising pointless suffering or condemning cooperation? If such intuitions enhanced *their* fitness in *their* niche, then yes (think hyena infanticide, parasitic wasps). Yet, the realist presumably thinks their moral truths are universal. This highlights the contingency of our intuitions on our specific evolutionary path, undermining their claim to track universal truth. Now imagine a species evolving math/logic faculties that systematically got 2+2=5 or violated modus ponens. Such a species would likely go extinct quickly. This highlights the *necessity* of truth-tracking in those domains for basic functioning.

  **The Professor's Cynical Punchline (Substance):**

  "Look, evolution built us to *survive and breed*, not to be moral philosophers. It wired us to feel outrage at cheaters because cooperation was a winning strategy, not because cheating *really is* objectively wrong in some cosmic sense. Our math works because getting the physical world wrong got you eaten. Our morals 'work' because feeling them helped us outbreed the neighbors. The idea that this messy, self-serving biological kludge somehow stumbled upon the eternal, objective Moral Law? That’s not science, that’s theology in a lab coat. The universe is indifferent; our moral compass points only to the graves of our ancestors."

  **Key Concepts for the Professor to Weave In:**

  *   **Genealogy:** Explaining the *origin* of our moral faculties to challenge their *authority*.
  *   **Teleosemantics:** What a faculty was *selected for* (its "proper function").
  *   **Explanatory Independence:** The adaptive explanation works *without* needing moral truths.
  *   **Reliability Challenge:** How can we trust a faculty shaped by forces indifferent to truth?
  *   **Contingency:** Our specific moral intuitions are accidents of history, not revelations of universals.
  *   **Superfluousness (Occam's Razor):** Moral realism adds nothing to the evolutionary explanation.

  This gives your professor the rigorous, steel-trap argument that acknowledges the math/logic counter but dismantles it by showing the fundamental difference in *how* evolution shaped these faculties and *what* their successful function depends upon. It's the difference between a faculty designed as a map (which fails if it doesn't correspond to territory) and a faculty designed as a motivational prod (which succeeds purely by causing adaptive action).
