prompt: |-
  I'm doing a PhD in philosophy (mostly social ontology / phil language stuff) and we just spent two whole seminar sessions on David Lewis's *Convention*, grinding through the coordination-equilibria-plus-common-knowledge machinery. It's put me in the annoying position of overanalyzing my own house. Three of us live together, and there's this norm where whoever notices we're out of a staple -- coffee, dish soap, toilet paper, whatever -- just quietly buys more themselves, no reimbursment, no discussion. As far as I can tell it started because one housemate did this once back in year one and it just... stuck. Two of us definately think it's a bad system since it obviously screws over whoever burns through stuff fastest, and we'd rather do a shared kitty everyone tops up monthly. Every time it comes up at "house meeting" everyone nods along that the kitty is better, and then nothing changes and we're back to the old pattern within a week.

  Using Lewis's actual account of what makes something a convention in the first place -- the arbitrariness condition (there has to be a real alternative regularity that would've worked just as well), the common knowledge requirement, and especially his stuff on precedent as a source of salience that makes one equilibrium self-perpetuating -- what does his theory imply about why we're stuck, and about what it would actually take for a small group like ours to shift onto a new convention? I'm especially curious whether his framework predicts that everyone privately agreeing the kitty is superior should be almost beside the point, and whether "let's all just agree to switch" at a house meeting even counts as the kind of common-knowledge-generating event his theory requires, or whether that's smuggling in more than the theory can actually license. Don't just recap the book's definitions for me -- I want the implications actually worked out for a case like this.
reasoning: |-
  Okay, let me tackle this user's problem. They're a philosophy PhD student focused on social ontology and language, currently analyzing their household situation using David Lewis's convention theory. The issue is a persistent norm where housemates replace staples without reimbursement, despite agreeing that a shared kitty system would be better. They want to understand why they're stuck in this convention and what it would take to switch, using Lewis's framework.

  First, I need to recall Lewis's key elements: conventions as solutions to coordination problems, requiring regularity, common knowledge, arbitrariness, and precedent. The current system is a regularity where replacing items is the norm. Even though two housemates see it as unfair, it persists. The arbitrariness condition is satisfied because the kitty system is a viable alternative. 

  The user mentioned that house meetings result in agreement but no change. According to Lewis, mere agreement isn't enough without common knowledge and precedent. During meetings, nodding along might not establish common knowledge if there's doubt about others' commitment. Precedent plays a big role here—the existing system has a history of working, making it salient. The kitty lacks this history, so it's not as compelling.

  The user wonders if private agreement is irrelevant. Lewis's theory suggests that without common knowledge, individual preferences don't shift the convention. Even if all think the kitty is better, they might not believe others will act on it. The house meeting might not generate common knowledge if there's skepticism about follow-through. 

  To effect change, they need a common-knowledge event that breaks the precedent. Something unambiguous, like all transferring money simultaneously or using a visible ledger. Starting small with a trial period could help establish new precedents. The key is creating mutual expectations that everyone will adhere to the new system.

  Also, the user's deeper need might be practical solutions grounded in theory. They want to apply Lewis's concepts to real life, not just academic discussion. Emphasizing actionable steps that align with the theory would address their real goal of changing their household system while satisfying academic curiosity.
answer: |-
  Based on Lewis's framework, your household is a textbook case of a convention trapped by precedent and insufficient common knowledge generation. Here's why you're stuck and what Lewis implies is needed to shift:

  1.  **The Current System *is* a Lewisian Convention:**
      *   **Regularity:** There's a stable pattern: "Whoever notices a shortage buys the item without expectation of reimbursement."
      *   **Coordination Problem:** Avoiding simultaneous non-purchase (leading to shortages) or simultaneous purchase (leading to waste). The current system *does* solve this problem, albeit imperfectly and unfairly.
      *   **Arbitrariness:** The condition is **clearly satisfied**. The "shared kitty" system is a demonstrably *real alternative* that would also solve the coordination problem (ensuring staples are purchased) and likely solve it *better* (fairer distribution of cost). Its existence makes the current system arbitrary.
      *   **Precedent & Salience:** This is the **crucial lock-in mechanism**. The very first time a housemate bought something without asking for reimbursement created a *precedent*. Each subsequent instance reinforced it, making it the *salient* solution. Its history *is* its power. It's the path of least resistance because it's "what we *always* do."
      *   **Common Knowledge (Fragile):** There's common knowledge *that the regularity exists* ("We all know we do this"). There's likely common knowledge *that everyone prefers not to run out of staples*. There might even be common knowledge *that the system is imperfect*. However, crucially, **there is *not* robust common knowledge *about the universal commitment to change or the viability of the alternative*.**

  2.  **Why "Agreeing it's Better" Isn't Enough (Lewis Explains the Impotence):**
      *   **Private Beliefs ≠ Common Knowledge:** Lewis is adamant that conventions operate on *mutual expectations*, not private beliefs. You and the other critical housemate *privately* believe the kitty is better. The third might too. But Lewis's point is that *your actions depend on what you expect others to do*, not just what you prefer.
      *   **The "Agreement" at Meetings Lacks Key Elements:**
          *   **No Binding Salience:** The *idea* of the kitty is discussed, but it lacks the *salience* generated by precedent. The old system has a concrete history; the kitty is just an abstract promise.
          *   **Ambiguous Commitment:** Nodding along creates *suspicion* of agreement, but likely **not Lewis-grade common knowledge** about *intent to act*. Did everyone leave the meeting *knowing* that everyone else *knew* that everyone else was *definitely* going to start using the kitty *tomorrow*? Or was there lingering doubt? ("They said yes, but will they *really* remember? Will *they* think *I'll* remember? Will they just revert if I buy coffee?")
          *   **No New Precedent:** The meeting *discusses* change but doesn't *enact* it. It fails to create the first concrete instance of the new regularity. Without that first step, there's nothing to build new precedent/salience upon.
      *   **The Power of Precedent Trumps Preference:** Lewis argues that an established convention persists *precisely because* it's established and salient, *even if* a slightly better alternative exists. The cost/risk of coordinating the switch often outweighs the marginal gain. In your case, the perceived cost/risk is the uncertainty: "If I stop buying staples spontaneously and wait for the kitty, but others don't, we'll run out." The old system, while unfair, *works* predictably. The new system requires a leap of faith no one takes.

  3.  **Why "Let's Just Agree to Switch" Fails Lewis's Test:**
      *   **It Assumes Common Knowledge it Doesn't Generate:** Merely saying "Let's switch" doesn't automatically create the necessary common knowledge about *universal, unwavering commitment to act*. Lewis's common knowledge requires iterated "I know that you know that I know..." reasoning, anchored in a public event. A casual house meeting agreement often lacks the unambiguous, inescapable publicity needed.
      *   **It Lacks a Concrete Salience-Generating Event:** The agreement is verbal. The old convention has countless concrete actions (instances of buying) backing it. The new convention needs its own concrete starting point.
      *   **It Doesn't Break the Precedent Cycle:** The agreement *acknowledges* the alternative but doesn't *displace* the existing precedent. The next time someone notices an empty coffee container, the salient solution pulled from memory is still "buy it myself," reinforced by years of habit, *not* "wait for the kitty process."

  4.  **What Lewis's Framework Implies is Needed for a Shift:**
      *   **Creating Unambiguous Common Knowledge:** You need an event so public and unambiguous that it *forces* the iterative reasoning of common knowledge about the switch. Examples:
          *   **Simultaneous Action:** At a meeting, *immediately* have everyone physically transfer a fixed, visible amount of cash ($50?) into a labeled jar/box placed centrally. The *act* of everyone doing this *at the same time*, seeing each other do it, creates powerful common knowledge: "We all *saw* everyone commit money *right now*." This is the new precedent #1.
          *   **Explicit, Recorded Pact:** Draft a *very* simple written agreement: "As of [Date], all staple purchases will be made from the shared kitty. Initial purchases require [Process - e.g., note in ledger, receipt in box]. Kitty replenished monthly on the 1st: [$Amount] from each." Everyone signs and dates it *in front of each other*. The physical, signed document serves as a constant, public reminder and anchor for common knowledge.
      *   **Establishing the First Precedent(s):** The initial kitty funding (the jar stuffing) is precedent #1. You *need* to quickly generate precedent #2:
          *   **Manufacture a Shortage/Need:** Immediately after funding the kitty, identify the *first* item needed (maybe even something minor running low). Have someone *explicitly* use kitty funds to buy it, announcing "Buying [item] with kitty money!" and perhaps placing the receipt in the box. This act is highly salient – it's the *first performance* of the new regularity.
          *   **Make it Visible:** The kitty box/jar, the ledger, the receipts – keep them physically present in a common area. This reinforces the new regularity's existence constantly.
      *   **Leveraging Salience Differently:** The switch event needs its *own* salience to compete with the old precedent. The physicality and simultaneity of the actions above (money transfer, signing, first purchase) create *new* salient events that can override the old "buy it myself" reflex *in the moment* and begin building new expectations.
      *   **Enduring the Transition Coordination Problem:** Acknowledge Lewis's point: Shifting conventions *is* a coordination problem itself. The solution requires an event salient enough for everyone to confidently expect everyone else to switch *at that specific point*. The old convention persists because switching requires simultaneous belief in the switch, which is hard to achieve without a catalytic event.

  **In Short, Lewis Predicts:**

  1.  Private agreement on superiority is largely irrelevant to maintaining the convention. Conventions run on expectations, not preferences.
  2.  House meeting discussions fail because they don't generate the robust common knowledge of *commitment to act* or create the necessary *salient precedent* for the new system. They remain "talk," easily overwhelmed by the "action" history of the old system.
  3.  Breaking free requires a **highly salient, unambiguous, common-knowledge-generating event** that simultaneously:
      *   Establishes the *universal commitment* to the new rule (e.g., simultaneous funding).
      *   Creates the *first concrete precedents* of the new regularity (e.g., the funded kitty, the first purchase made explicitly from it).
      *   Provides *ongoing salience* for the new system (e.g., the visible kitty box/ledger).

  Your challenge is to engineer that catalytic event. Lewis suggests the theory *works* – the convention persists due to precedent and insufficient common knowledge for change. It also provides the recipe: create a new, more salient precedent anchored in undeniable common knowledge. The kitty isn't just a better idea; it needs a better *launch*.
