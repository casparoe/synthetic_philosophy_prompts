answer: |-
  You're absolutely *not* overreading – your instincts about the "weirdness" of this passage are spot-on. While Newton presents his argument as a careful, almost linguistic/philosophical deduction grounded in common usage, it's deeply intertwined with his radical theological views and serves specific doctrinal purposes. Here's a breakdown:

  1.  **The Core Argument & Its Implications:**
      *   **Godhood = Dominion:** Newton explicitly defines divinity ("Deity") not as an inherent, shared substance (like the traditional Trinitarian view he rejected), but as *dominion over servants*. This is revolutionary and deeply problematic for orthodox Christianity.
      *   **Relational & Functional, Not Ontological:** "God" is a *relative term* signifying a relationship (Lord/servant). It's not primarily about *what God is* (eternal, infinite, perfect substance), but about *what God does/possesses* (dominion).
      *   **Gradational Divinity:** This is the critical implication you identified. "A true, supreme, or imaginary dominion makes a true, supreme, or imaginary God." This inherently creates a *hierarchy* of divinity. Dominion can vary in scope and reality, therefore the title "God" can apply with varying degrees of truth and supremacy. This directly challenges the co-equal, co-eternal, consubstantial Trinity where Father, Son, and Spirit are all equally "God" in the fullest sense.
      *   **The Word-Usage Argument:** This isn't just inductive pedantry; it's a *rhetorical weapon*. By pointing out we say "my God" but not "my Eternal," Newton is attempting to ground his radical definition in common linguistic practice, making it seem like an unavoidable empirical observation. He's using language to *disguise* the theological bomb he's planting. It's a way to argue his heterodoxy looks like simple logic.

  2.  **Why This Isn't Neutral "Inductive Science":**
      *   **Presupposition, Not Observation:** Newton *starts* with the assumption that God must be a Lord with dominion. He's not inductively deriving this solely from the "Book of Nature." He's imposing a specific *interpretive framework* onto the concept of God, one heavily influenced by his Arian/Unitarian beliefs (denying Christ's full divinity and eternal equality with the Father).
      *   **Targeting Specific Doctrines:** The dig "not over his own body, as those imagine who fancy God to be the soul of the world" is a swipe at pantheism/Stoicism. But the *real* target, especially with the "dominion" definition and the gradational implication, is the orthodox doctrine of the Trinity and the co-equality of Christ. If Godhood is defined by supreme dominion, and Christ is subordinate to the Father (as Newton believed), then Christ cannot possess the *supreme* dominion defining the "true God." He might be *a* god (with dominion over creation, perhaps), but not *the* Supreme God. This is precisely Newton's private view.
      *   **"No Hypotheses" is Partly Performative:** The "Hypotheses non fingo" stance in the Scholium is partly Newton constructing a persona of the pure empirical scientist. But the *entire Scholium*, including this passage, is a theological-philosophical argument. He *is* making hypotheses about the nature of God and language, framed as deductions.

  3.  **The Doctrinal Work It's Doing:**
      *   **Undermining the Trinity:** As you intuited, this is the primary function. By defining Godhood solely through supreme dominion held by one supreme Being, Newton logically excludes the possibility of multiple co-equal divine persons sharing the *same* supreme dominion. It creates a rigid hierarchy where only the Father possesses the defining characteristic of true Godhood.
      *   **Distinguishing God from Creation:** His emphasis on God being "spiritual" and ruling *over* servants (not *as* the soul of the world) reinforces a transcendent, personal God distinct from creation – countering pantheism but also subtly reinforcing the Creator/creature distinction that underpins his subordinationist Christology (Christ is a created being, albeit the highest).
      *   **Grounding God's Attributes in Action:** While he mentions God's eternity, infinity, and perfection, he argues these *alone* don't constitute Godhood without dominion. This shifts the emphasis towards God's *active rulership* and power as the defining characteristic, again fitting his view of a sovereign, legislating God.

  **Why Bother with the Word-Usage Argument?**

  *   **Plausible Deniability:** It allows Newton to present his radical theology as a simple, logical deduction from common language and observation, masking its heretical implications. He can claim he's just "describing" what the word means, not imposing doctrine.
  *   **Appeal to "Objectivity":** By grounding it in linguistic usage, he tries to position his definition as more "objective" and less vulnerable to accusations of heresy than arguments based purely on contested scriptural interpretation or metaphysics.
  *   **Rhetorical Force:** It's a clever rhetorical move. Pointing out the asymmetry between "my God" and "my Eternal" *feels* like an empirical observation, making his subsequent definition seem more inevitable and less like a theological innovation.

  **Conclusion:**

  You are correct. Newton's argument in this passage is **not** neutral, purely inductive science. It is a carefully constructed **theological argument** using linguistic and philosophical reasoning to advance his core heretical belief: the denial of the Trinity and the full co-equality of Christ. The definition of Godhood as dominion, the gradational nature implied, and the specific word-usage argument are all tools designed to undermine the orthodox position while appearing to be a sober deduction from common experience. Your friend is missing the profound theological agenda embedded in Newton's seemingly empirical language. Newton was always doing both theology-flavored physics *and* physics-flavored theology, and in the General Scholium, especially this passage, the theological agenda is paramount and deeply heterodox.
