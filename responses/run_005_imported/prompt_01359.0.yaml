answer: |-
  That's an incredibly sharp observation, and you've nailed the *apparent* radicalism in Aquinas's logic. However, the gap between Aquinas's theoretical justification and the scarcity of actual medieval regicides stems from several crucial contextual factors and nuances within Thomistic thought itself:

  1.  **Aquinas's Stringent Conditions (The "Fine Print"):**
      *   **Not Private Vendetta:** Aquinas explicitly states that killing a tyrant is **not** the right of private individuals acting alone ("a private person"). It must be an act of public authority or a representative body acting for the common good (like a council of nobles or, implicitly, the Pope acting as universal spiritual authority). Random nobles or disgruntled peasants couldn't just invoke Aquinas.
      *   **Last Resort & Proportionality:** Tyrannicide is only justified *after* all other peaceful and legal means of redress have been exhausted. It's not the first option. The evil of the tyranny must also demonstrably outweigh the likely evils unleashed by the act itself (civil war, foreign invasion, anarchy).
      *   **"Manifest Tyrant":** The ruler's tyranny must be *blatant, undeniable, and severe* – not just unpopular policies or personal failings. Aquinas distinguishes between a "tyrant in government" (harsh but potentially legitimate) and a "tyrant in dominion" (ruling purely for personal gain, destroying the common good). Only the latter clearly forfeits legitimacy.
      *   **No Better Alternative:** Killing the tyrant must demonstrably lead to a *better* situation for the common good. If it would likely result in a worse tyrant or prolonged chaos, it's not justified. Aquinas is deeply pragmatic.

  2.  **The Church's Institutional Self-Preservation & Stability:**
      *   **Slippery Slope:** Endorsing tyrannicide, even theoretically, was incredibly dangerous for the Church, a major feudal landowner and political player. If subjects could kill "unjust" rulers, what stopped them from killing "unjust" bishops, abbots, or even Popes? The entire hierarchical structure depended on obedience.
      *   **Fear of Chaos (Anarchy):** The Church was the primary force preaching social order as divinely ordained. Unleashing the idea that rulers could be justly killed risked widespread instability, rebellion, and the breakdown of the social fabric – anathema to the Church's interests and its view of a well-ordered Christian society.
      *   **Preferring Other Tools:** The Church had powerful, less destabilizing weapons: **excommunication** (cutting the ruler off from sacraments, delegitimizing them spiritually), **interdict** (denying sacraments to the *entire realm*, turning the populace against the ruler), deposition by Papal decree (requiring secular enforcement), and intense diplomatic pressure. These were preferred first lines of attack.

  3.  **Medieval Political Theology & Divine Right:**
      *   **Sacred Kingship:** The concept that kings ruled "by the Grace of God" was deeply ingrained. Even a bad king was seen as holding an office ordained by God. Removing him was not just a political act, but potentially a sacrilegious one, inviting divine wrath. Aquinas's argument had to contend with this powerful cultural and theological current.
      *   **Legitimacy through Lineage:** Hereditary right was a bedrock of legitimacy. An unjust king was still the *rightful* king by blood. Removing him inherently created a legitimacy crisis for his successor, potentially triggering civil war (the Wars of the Roses being a prime example of this danger).

  4.  **Practical Power Dynamics:**
      *   **Noble Self-Interest:** The nobility, who might theoretically act as the "public authority," often preferred a weak or self-serving king they could manipulate or extract concessions from, rather than risking a strong replacement or the chaos of removal. Their calculus was often personal gain, not abstract Thomistic justice.
      *   **Risk of Failure & Retribution:** Attempting tyrannicide and failing meant certain, horrific death for the perpetrators and likely their families. Success didn't guarantee safety; the victim's heirs or allies would seek vengeance.
      *   **Succession Crises:** Killing a king without a clear, universally accepted heir was a recipe for devastating civil war. The potential consequences were often seen as worse than enduring the tyrant.

  5.  **Selective Application & Historical Examples:**
      *   **The Church DID Use the Logic (Cautiously):** The most famous example is Pope Gregory VII deposing Emperor Henry IV (1076) and absolving his subjects of their oaths of allegiance. While not ordering assassination, this invoked principles Aquinas later systematized about forfeited legitimacy. Boniface VIII did similar against Philip IV of France.
      *   **Becket's Murder (1170):** The backlash against Henry II after Becket's murder (even though Henry likely didn't intend "kill him") shows the *dangers* of regicidal impulses. It led to Henry's humiliation and the strengthening of ecclesiastical privilege, demonstrating how such acts could backfire spectacularly.
      *   **Assassinations Did Happen (Rarely):** Think of the murder of Edward II (1327) or Richard II (1400). These were usually framed as *internal dynastic/political* acts by powerful nobles (acting as de facto "public authority"), often cloaked in claims of tyranny *after the fact* to legitimize the coup. They rarely invoked Aquinas *explicitly* at the time, precisely because it was too dangerous a doctrine to normalize.

  **In essence:** Aquinas provided a powerful *theoretical* justification, but it came wrapped in layers of restrictive conditions that made its practical application rare and extremely high-stakes. The medieval Church, deeply embedded in the feudal power structure and prioritizing order, was far more likely to use spiritual and diplomatic weapons than openly endorse the dagger. The doctrine was a **theological nuclear option** – acknowledged to exist under strict conditions, but the costs and risks of using it were almost always seen as too high for both the Church and potential secular actors. The gap between the radical potential of the logic and the conservative reality of medieval politics explains why it remained largely a tool of last resort, invoked more often in theory than in bloody practice.
