prompt: |-
  Me and my friend had this whole argument last night about whether longtermism is actually a new idea, and I brought up Frank Ramsey, which did not help. Two things about him stuck with me from a decision theory seminar: in his essay "Epilogue" he says he refuses to feel humbled by the vastness of the universe -- stars are big, sure, but they can't think or love, so size just isn't the kind of thing that should impress you -- he calls this the "human mood" as opposed to the "cosmic mood" (might be misremembering the exact wording). But then in his savings paper he argues that discounting future generations' welfare just because they come later in time is basically indefensible, which economists now treat as the founding argument for taking the far future seriously. My friend's point was that these two Ramseys contradict each other: one tells you to ignore cosmic scale, the other is basically the ancestor of arguments that we should care enormously about trillions of hypothetical future people and treat existential risk as the only thing that really matters. I said they're reconcilable but couldnt say why on the spot. So: if Ramsey had somehow lived to see modern longtermism and Bostrom-style existential risk arguments, would he have been sympathetic, hostile, or somewhere weirder in between? Actually use what we know of his views to argue it rather than just guessing.
reasoning: |-
  Okay, let me unpack this user's query. They had an argument with a friend about whether longtermism is a new idea, and brought up Frank Ramsey. The user recalls two key points from Ramsey: his "Epilogue" essay where he dismisses being humbled by the universe's vastness since stars can't think or love (the "human mood"), and his savings paper arguing against discounting future welfare. The friend sees a contradiction here—ignoring cosmic scale versus caring about future generations. The user wants to know if Ramsey would support modern longtermism.

  First, I need to reconcile these two aspects of Ramsey's thought. The "human mood" emphasizes valuing human capacities over mere size. The savings paper argues for ethical impartiality across time. The core of Ramsey's philosophy seems to be about prioritizing conscious experience and moral equality, not physical scale. 

  Modern longtermism focuses on preventing existential risks to ensure vast future populations exist. But Ramsey might question if sheer numbers equate to value. He'd likely prioritize the quality of existence—thought and love—over quantity. So while he'd agree on not discounting the future, he might challenge the emphasis on maximizing population size.

  Also, Ramsey was a utilitarian, so he'd evaluate longtermism based on its impact on conscious welfare. He might worry about neglecting current suffering for speculative futures. And his rejection of the "cosmic mood" suggests skepticism towards grand cosmic significance narratives, which longtermism sometimes invokes.

  The user probably wants a nuanced answer that uses Ramsey's principles to assess longtermism. They might also seek intellectual validation after their argument. Highlighting how Ramsey's human-centered ethics and temporal impartiality interact should address both the surface question and deeper need for a coherent philosophical resolution.
answer: |-
  That's a brilliant and nuanced question! Your friend raises a fascinating tension, but I believe Ramsey's core philosophy reconciles these positions and suggests he'd be a *critical* longtermist sympathizer, leaning towards what you called "somewhere weirder in between" – likely agreeing on the *ethical principle* but deeply skeptical of the *scale-driven metaphysics* and potential neglect of the present.

  Here's the argument, grounded in Ramsey's known views:

  1.  **The "Human Mood" (Epilogue): Valuing Consciousness, Not Scale:**
      *   **Core Message:** Ramsey explicitly rejects the idea that physical vastness ("mere bigness") confers intrinsic value. Stars are big but lack consciousness, thought, love, and ethical concern. What matters is the *quality of conscious experience* and *moral agency*. The "human mood" centers ethical value on beings capable of these things.
      *   **Not Anti-Future:** Crucially, this isn't a dismissal of *time* or the *future*. It's a dismissal of valuing *cosmic scale devoid of consciousness*. Future generations capable of thought and love are *precisely* the kind of beings the "human mood" values. The target is cosmic insignificance arguments, not future people.

  2.  **The Savings Paper (Discounting): Temporal Impartiality:**
      *   **Core Message:** Ramsey argues that pure time preference (discounting future well-being *just* because it's in the future) is "ethically indefensible" and arises "merely from the weakness of the imagination." This is a foundational argument for *temporal impartiality*.
      *   **Scope:** He applies this to future generations ("posterity"). His utilitarianism demands we weigh the welfare of all sentient beings equally, regardless of *when* they exist. The future matters immensely *because* it contains beings who matter.

  **Reconciling the Two:**

  *   **Common Ground: The Primacy of Conscious Welfare.** Both positions stem from Ramsey's utilitarian philosophy. Value resides in the conscious experiences (happiness, suffering, thought, love) of beings capable of having them.
  *   **Different Targets:**
      *   The "Epilogue" targets **mistaken sources of value** (cosmic bigness without consciousness).
      *   The savings paper targets **mistaken forms of partiality** (discounting conscious welfare based on temporal location).
  *   **No Contradiction:** Valuing future conscious beings equally (savings paper) is perfectly consistent with not being impressed by the sheer physical size of the universe if it lacks consciousness (Epilogue). The former is about *who* matters (conscious beings across time), the latter is about *what doesn't matter* (mindless bigness).

  **Ramsey vs. Modern Longtermism (Bostrom-style):**

  He'd likely agree with the **core ethical principle** derived from his savings argument:

  *   **Sympathy Point 1: Existential Risk Importance.** He'd agree that catastrophically destroying the *potential for all future conscious life* is an almost unimaginable ethical loss, far outweighing many present concerns *if* the future holds vast amounts of valuable conscious experience. Preventing this loss aligns with temporal impartiality.
  *   **Sympathy Point 2: Future Generations Matter.** The fundamental argument against pure time preference is bedrock longtermism. Ignoring the far future because it's distant would be anathema to him.

  **However, he'd be profoundly skeptical or hostile to key *metaphysical* and *practical* aspects:**

  *   **Hostility/Skepticism Point 1: The Fetishization of Scale ("Astronomical Waste"):** This is where the "Epilogue" kicks in hardest. Ramsey would likely view arguments focused primarily on the *trillions* of potential future lives as falling back into the "cosmic mood" he despised. For him:
      *   Value isn't created by *adding more units* of consciousness mindlessly. It resides in the *quality* of the conscious experience itself.
      *   He'd ask: What is the *content* of these trillions of lives? Are they lives rich in thought, love, and fulfillment, or are they merely existing? Maximizing *numbers* without regard to the depth and quality of experience per life might strike him as ethically hollow, even barbaric, echoing his critique of valuing mere bigness.
      *   He'd be suspicious of arguments that hinge on the sheer *scale* of potential future populations as the primary source of value, rather than the inherent value of conscious flourishing *whenever* it occurs.
  *   **Hostility/Skepticism Point 2: Neglect of the Present & Near Future:** Ramsey was a practical utilitarian concerned with measurable welfare *now*. He'd likely worry that an excessive focus on vast, speculative future populations could:
      *   Justify neglecting acute suffering and pressing moral issues affecting existing people (contra utilitarian impartiality applied to the present).
      *   Rely on highly uncertain predictions about the very long-term future, violating his emphasis on evidence and probability (he was a pioneer in subjective probability!). He might see cosmic-scale longtermism as requiring faith in unknowable futures rather than sound probabilistic reasoning.
  *   **Hostility/Skepticism Point 3: Abstractness vs. Concrete Experience:** Ramsey's "human mood" emphasizes the concrete reality of human experience – thought, love, the struggle for understanding. He might find the abstraction of "trillions of potential future people" alienating and less motivationally compelling than improving the lives of concrete individuals, present *or* future. The scale argument might feel like a regression to the impersonal cosmic perspective.

  **Conclusion: The "Weirder In Between"**

  Ramsey would likely be **sympathetic to the core ethical imperative** derived from his own work: taking the welfare of future conscious beings seriously, including the catastrophic loss represented by human extinction, and rejecting pure time preference. He'd agree that safeguarding the potential for future thought and love is paramount.

  **However, he would be deeply skeptical and probably hostile to the framing that emphasizes *astronomical scale* as the primary justification.** He would see this as falling prey to the very "cosmic mood" he rejected – mistaking vastness for value. He'd insist that the value lies in the *quality of conscious experience* itself, not in the sheer number of experiencers. He would demand rigorous probabilistic reasoning and fiercely guard against neglecting the suffering and potential of the present for a speculative cosmic future.

  **Therefore, if Ramsey encountered modern longtermism, he would likely be:**

  *   **A critical sympathizer** on the principle of caring for the long-term future and avoiding extinction.
  *   **A fierce critic** of arguments based primarily on maximizing the number of future lives ("astronomical waste").
  *   **An advocate for balance**, insisting that the concrete welfare of present and near-future individuals must not be sacrificed on the altar of vast, uncertain future potential.
  *   **Focused on the *content* of the future** (will it contain thought, love, fulfillment?) rather than just its *scale*.

  He wouldn't be a straightforward Bostrom-style longtermist. He'd push for a version grounded firmly in the welfare of conscious beings across time, deeply skeptical of cosmic-scale justifications, and fiercely protective of the present – a longtermism filtered through the "human mood." His unique perspective would indeed be "somewhere weirder in between."
