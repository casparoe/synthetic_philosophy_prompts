  We are going to consider a four-move centipede game. The game tree is as follows:

  - At the initial node (Player 1's first move), Player 1 can either TAKE (ending the game with payoffs (1,0)) or PASS (passing to Player 2).
  - If Player 1 passes, Player 2 at the second node can either TAKE (ending the game with payoffs (0,2)) or PASS (passing back to Player 1).
  - If Player 2 passes, Player 1 at the third node can either TAKE (ending the game with payoffs (3,1)) or PASS (passing to Player 2).
  - If Player 1 passes, Player 2 at the fourth node can TAKE (ending with (2,4)) or PASS (ending with (4,3)).

  Note: The payoffs are increasing as the game goes on, but the first player has an incentive to take at the first node to avoid getting 0 in the second node if the other player takes. The backward induction solution is:

  - At the last node (if reached), Player 2 will TAKE to get 4 instead of 3 (so (2,4) is the outcome at that node).
  - Therefore, at the third node, Player 1, knowing that Player 2 will take at the next node, would take to get 3 rather than passing and getting 2 (if the game proceeds and Player 2 takes). So Player 1 takes at the third node, yielding (3,1).
  - At the second node, Player 2, knowing that Player 1 will take at the third node (yielding 1 for Player 2) would rather take at the second node to get 2 (instead of 1). So Player 2 takes at the second node, yielding (0,2).
  - At the first node, Player 1, knowing that Player 2 will take at the second node (yielding 0 for Player 1) would rather take at the first node to get 1 (instead of 0). So Player 1 takes at the first node, yielding (1,0).

