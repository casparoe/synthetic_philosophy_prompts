  For the gradual improvement point: The key is framing why "not immediate but fast" matters. Locke/Molyneux expected flat "no," but if skill emerges rapidly, is that still "no" or a qualified "yes"? Need to force the scientist to distinguish between innate ability vs. learning speed. 

