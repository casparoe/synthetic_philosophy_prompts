  After a set theory reading group last week, a friend and I ended up in a long argument that we never quite resolved. The trigger was the familiar but strange fact that a whole cluster of statements — Zorn's Lemma among them — are all provably equivalent to the Axiom of Choice over ZF, and yet strike almost anyone encountering them cold as having wildly different degrees of obviousness. My friend, who never misses a chance to point out that Hausdorff had a version of the maximal principle in 1914 and Kuratowski another in 1922, well over a decade before Zorn's own 1935 paper, took this as evidence that mathematical "intuition" about such statements is basically noise: since the statements are logically interchangeable, any difference in how plausible they feel to us must be tracking nothing but familiarity and phrasing. I disagreed — my sense is that felt plausibility here tracks something real, such as how visibly infinite and uncontrolled the implicit selection process is, or how far the statement sits from set theory's home turf. We went back and forth for over an hour without making progress, and my friend, mostly to be difficult, insisted on throwing the Banach–Tarski paradox into the mix as well, though I suspect it doesn't actually belong on the list in the way the others do.

  I'd like a more disciplined take on this than either of us managed. Below are several statements associated with the Axiom of Choice. Treating "intuitive plausibility" as roughly: how obviously true each statement would strike a mathematician who accepts ordinary ZF reasoning but has never been told anything about its relationship to the Axiom of Choice, please rank them from most to least intuitively plausible on first encounter, and separately flag any item you think is not, in fact, equivalent to the Axiom of Choice over ZF (whether because it is strictly weaker or for some other reason).

  - Zorn's Lemma: every partially ordered set in which every chain has an upper bound contains a maximal element.
  - The Well-Ordering Theorem: every set admits a well-ordering.
  - Cardinal trichotomy: for any two sets, there is an injection from one into the other.
  - Every vector space, over any field, has a basis.
  - Tychonoff's Theorem: an arbitrary product of compact topological spaces is compact.
  - Every surjective function between two sets has a right inverse.
  - The Hausdorff Maximal Principle: every partially ordered set contains a maximal chain.
  - The Banach–Tarski paradox: a solid ball can be split into finitely many pieces and reassembled, using only rotations and translations, into two balls each congruent to the original.

  Please give your answer as a JSON block, formatted as follows:

