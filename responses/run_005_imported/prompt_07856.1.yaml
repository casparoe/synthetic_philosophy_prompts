prompt: |-
  Quick one -- I help edit a small literary quarterly as a favor to a friend who runs it (mostly I write novels). We're stuck on a submission and I said i'd sort out a memo since nobody else will. The writer's cover letter admits she used AI pretty heavily: she'd describe a character, ask it to 'write in this person's voice,' then cut and rewrite what came back over several rounds. Some editors say that's fine -- it's a tool she steered, so the story's entirely hers. Others say once you're asking something to inhabit a voice and generate prose as that persona, its functioning as a co-author with its own take on the character, and our guidelines only take single-human-authored work. A third editor thinks both framings are wrong -- that it isn't a tool or an agent here so much as its simulating what an author would write, which is its own separate problem for a fiction magazine, closer to uncredited ventriloquism than either tool-use or co-authorship. Can you draft the short memo that settles this -- a straight accept/reject/accept-with-conditions on the story, plus a rule we can point to next time -- and be fair to whichever camp turns out wrong?
reasoning: |-
  Okay, the user is an editor for a literary quarterly who's stuck on an AI-assisted submission. They need a memo that decides the story's fate and establishes a clear rule, while being fair to dissenting editors. 

  Hmm, the core tension here is philosophical: is AI a tool (like a fancy typewriter), a co-author (with creative intent), or a simulator (creating derivative output)? The writer's method—feeding character prompts and rewriting outputs—sits in a gray zone. 

  First, let's unpack the editorial camps: 
  - Camp 1 sees AI as passive tool → "author retains full ownership"
  - Camp 2 frames it as creative collaborator → "violates solo authorship"
  - Camp 3's "ventriloquism" angle is fascinating—it implies the prose isn't truly *hers*, just a mimicry. That feels closest to literary ethics concerns.

  *Scratching head* The user's hidden need might be preserving the magazine's integrity while avoiding team conflict. They want the memo to feel principled, not personal. 

  Key considerations:
  - Literary magazines thrive on human voice. Allowing AI-generated prose (even rewritten) risks homogenization.
  - But outright banning *all* AI use might be impractical—what about grammar checks?
  - The writer's transparency is a plus, but honesty doesn't solve the ethical dilemma.

  *Pausing*... I should avoid framing this as "lazy writing." The writer clearly iterated. The issue is provenance, not effort. 

  Solution structure:
  1. Reject this story because the *prose generation* was AI-led → protects against simulated voices
  2. Future rule: allow assistive tools (editing/structuring), ban generative ones for core creative acts → clear bright line
  3. Explain why this isn't about quality but about safeguarding human creative primacy

  *Nodding* The memo must validate all viewpoints: Camp 1 isn't wrong about tools, Camp 2 about authorship, Camp 3 about authenticity—but the magazine's mission tips the scale. 

  Final touch: Emphasize this isn't anti-tech, just pro-human-voice. Leave room for future policy evolution if needed.
answer: |-
  Here’s a concise, principled memo that addresses the submission, sets a clear precedent, and respects all viewpoints while prioritizing the journal’s integrity:

  ---

  **MEMORANDUM**  
  **TO:** Editorial Team  
  **FROM:** [Your Name/Editorial Lead]  
  **DATE:** [Current Date]  
  **SUBJECT:** Decision & Policy: AI-Assisted Submissions  

  ### I. Ruling on Current Submission  
  **Decision: Reject**  
  - While the author’s transparency is appreciated, the work does not meet our criteria for human authorship. The core creative act—generating prose *in a character’s voice*—was delegated to AI, making the AI’s output foundational to the narrative. Subsequent edits do not sufficiently mitigate this, as the voice, tone, and stylistic essence originated non-humanly.  

  ### II. New Policy: AI Use in Submissions  
  Effective immediately, submissions must adhere to:  
  > **"Human Authorship Principle":**  
  > *"We accept only work where the core creative conception, narrative voice, and prose generation originate solely from the human author. AI may be used for auxiliary tasks (e.g., grammar checks, brainstorming, or structural editing), but not to generate or substantially shape expressive content (e.g., dialogue, descriptions, voice, or thematic development)."*  

  #### Key Clarifications:  
  - ✅ **Permitted:** AI as a tool for refinement (spelling, syntax), idea prompts, or research.  
  - ❌ **Prohibited:** AI as a voice generator, co-writer, or substantive prose originator.  
  - **Why?**  
    - **Integrity:** Our readers expect authentically human creative perspectives.  
    - **Originality:** Voice and style must arise from the author’s unique consciousness, not algorithmic extrapolation.  
    - **Fairness:** Avoids ambiguity between human/algorithmic creation in a literary context.  

  ### III. Rationale for Fairness  
  We acknowledge valid perspectives:  
  - **Tool-Use Argument (Pro-AI):** Rewriting AI output *is* labor-intensive, but it does not alter the AI’s role as the *originator* of expressive elements. Our policy permits tool-assisted editing, not tool-sourced creation.  
  - **Co-Author/Simulation Argument (Anti-AI):** This policy aligns with concerns that AI voice-generation simulates authorship, risking homogenization and ethical opacity. We uphold human primacy in creative acts.  

  This rule prioritizes **creative provenance** over debates about "steering" or "editing." It ensures clarity, consistency, and fidelity to our mission: publishing *human*-driven literature.  

  ### IV. Next Steps  
  - The author will receive a respectful rejection citing our new policy.  
  - Guidelines will be updated publicly and in submission portals.  
  - We revisit this policy annually as technology and ethics evolve.  

  ---  

  ### Why This Works:  
  1. **Clarity:** Draws a bright line at "generation of expressive content" (voice/prose), not just "use of tools."  
  2. **Principled:** Grounded in literary values (human voice, originality) rather than abstract debates.  
  3. **Inclusive:** Validates all camps by permitting *non-generative* AI use (e.g., editing) while protecting creative essence.  
  4. **Forward-Looking:** Annual reviews acknowledge evolving tech without compromising current standards.  
  5. **Diplomatic:** Avoids accusing the author of "cheating"; focuses on the work’s provenance, not intent.  

  This resolves the impasse by centering the journal’s mission—not the tool, nor the effort, but the *origin* of the creative spark.
