answer: |-
  You've nailed the core tension in Sidgwick's "Methods of Ethics" – his "dualism of practical reason" is famously unresolved, and that concluding passage is indeed the philosophical downer ending. Let's break down the logic and the link to the Society for Psychical Research (SPR).

  **1. Decoding Sidgwick's Logical Move:**

  Sidgwick isn't just saying he has two conflicting intuitions. He's claiming these intuitions are both presented by **Practical Reason itself** as *fundamentally authoritative* and *rationally compelling*. Here's the chain:

  1.  **Two Rational Requirements:** He identifies two seemingly self-evident principles:
      *   **Rational Egoism:** It is rationally required to pursue your own greatest happiness (self-interest).
      *   **Utilitarianism:** It is rationally required to pursue the greatest happiness overall (virtue/duty).
  2.  **The Conflict:** These two principles *can* and *do* conflict. What's rational for me (maximizing *my* happiness) might be irrational from the universal standpoint (failing to maximize *total* happiness), and vice versa.
  3.  **Practical Reason Demands Harmony:** Sidgwick argues that **Practical Reason inherently demands consistency and harmony.** It cannot tolerate an ultimate, fundamental contradiction within its *own* deliverances. Reason, by its nature, seeks a unified system.
  4.  **The "Vital Need":** This is why he feels a "vital need" to postulate a connection between Virtue (Utilitarian duty) and Self-Interest. Without this connection, the conflict remains irreconcilable *at the fundamental level*.
  5.  **The Devastating Conclusion:** If Practical Reason presents two fundamental principles that are *irreducibly contradictory* ("an ultimate and fundamental contradiction"), then the authority of Practical Reason itself is undermined. It cannot be a reliable guide if its core intuitions conflict irreconcilably. Hence, the "apparently intuitive operation of the Practical Reason... is after all illusory." It *looks* like we're receiving authoritative rational commands, but if they fundamentally contradict, that authority is an illusion. Reason would be self-defeating.

  **Why it's stronger than just "two conflicting axioms":**

  *   **Nature of the Principles:** These aren't just any axioms; they are presented as the *foundations* of rational action itself. Conflicting foundational principles destabilize the entire edifice.
  *   **Demand for Unity:** Sidgwick believes reason *requires* systematic coherence. A permanent, fundamental conflict violates this requirement at the deepest level. It's not like choosing between two equally valid but different paths; it's like reason telling you to go both North and South simultaneously as the *only* rational directions.
  *   **Undermining Authority:** If both feel self-evidently *binding* yet contradict, how can *either* truly be binding? Their apparent authority cancels each other out, leaving no rational basis for action. This is the existential threat to ethics as a rational enterprise.

  **2. The Link to Psychical Research (SPR):**

  Sidgwick's decades-long obsession with psychical research (telepathy, mediums, survival after death) was directly fueled by the "dualism of practical reason." He saw it as a potential *empirical* solution to the philosophical deadlock. Here's the chain:

  1.  **The Required Connection:** To resolve the dualism, Sidgwick needs a guarantee that acting virtuously (utilitarianly) *ultimately coincides* with acting in one's true self-interest. Virtue must be rewarded; vice punished.
  2.  **Theological Problem:** As your quote shows, Sidgwick found no *self-evident intuition* or rational proof for the existence of a God who provides this moral order (the "connexion of Virtue and self-interest").
  3.  **Empirical Hope:** If he couldn't prove God *philosophically*, perhaps he could find *empirical evidence* for a structure of reality that *implies* this connection. Specifically:
      *   **Survival After Death:** If consciousness survives bodily death, it opens the possibility of rewards/punishments *beyond* this life.
      *   **Communicating Intelligences:** If mediums could genuinely communicate with discarnate spirits or a higher intelligence, it might provide *evidence* of a moral order in the universe – perhaps even *messages* confirming that virtue is rewarded and vice punished in the grand scheme.
      *   **Cosmic Justice:** Evidence of survival and communication could empirically support the existence of a *cosmos structured for justice*, where the dualism is resolved over an infinite timescale. My sacrifice of self-interest *now* (for the greater good) would be compensated *later*, aligning duty and self-interest.
  4.  **SPR as the Tool:** Sidgwick co-founded the SPR precisely to investigate these phenomena with scientific rigor (as understood at the time). He hoped rigorous investigation would yield conclusive proof of survival or communication, thereby providing the empirical foundation for the required connection.
  5.  **Patching the Hole:** Empirical proof of survival + communication wouldn't *logically prove* God or the *exact* moral order Sidgwick needed. However, it would:
      *   **Make the Connection Plausible:** It would provide strong evidence for a reality beyond the material where rewards/punishments *could* occur.
      *   **Support Postulation:** It would give him a solid *empirical* basis upon which to "postulate" the required moral order (the connection) as the most reasonable explanation for the evidence, making his earlier philosophical postulate far less arbitrary.
      *   **Rescue Practical Reason:** By providing evidence for a universe where duty and self-interest *could* ultimately align, it would remove the threat of the "ultimate contradiction," preserving the authority of Practical Reason. The intuitions wouldn't be illusory; they would point to a deeper cosmic truth accessible partly through empirical investigation.

  **In short:** Sidgwick's psychical research was a desperate (and ultimately unsuccessful) empirical quest to find evidence for a cosmic structure that would resolve the fundamental contradiction he discovered at the heart of rational ethics – the dualism of practical reason. He needed to show that the universe itself guarantees that doing the right thing is also, ultimately, the best thing for oneself.
