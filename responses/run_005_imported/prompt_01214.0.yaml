prompt: |-
  So I've been prepping my seminar on chance and think I've talked myself into a genuine counterexample to Lewis's Principal Principle - tell me where I've gone wrong. The principle says my credence should just match the objective chance, so for a fair coin thats about to be flipped, credence in heads should be 0.5. But say a friend who can somehow see the future tells me, before the flip, that it's going to land heads - I obviously shouldn't just sit there believing 0.5 anymore, even though the objective chance of heads at that moment is still 0.5 right up until the coin actually lands. Seems like a totally ordinary case where matching credence to chance is the irrational thing to do, which just sinks the principle as it's usually stated, no?
reasoning: |-
  Okay, the user is presenting what they believe is a counterexample to Lewis's Principal Principle. They describe a scenario where they have a fair coin about to be flipped, so the objective chance of heads is 0.5. But then a friend who can see the future tells them it will land heads. The user argues that in this situation, maintaining a 0.5 credence in heads would be irrational, even though the objective chance remains 0.5 until the flip occurs. They conclude this sinks the Principal Principle.

  Hmm, this is an interesting challenge to the Principal Principle. The user seems knowledgeable about philosophy of probability, likely a grad student or academic preparing a seminar. Their tone suggests they're excited about having found what they think is a flaw in a well-established principle. I should address this carefully while acknowledging the insight in their example.

  The key here is understanding what Lewis's Principal Principle actually says. The user might be interpreting it too simplistically. Lewis was much more sophisticated - his principle includes an explicit "admissibility clause" precisely to handle cases like this. The principle states that credence should match chance conditional on total evidence, unless that evidence includes "inadmissible" information about the future outcome.

  Ah, that's the crucial point! The friend's testimony is inadmissible information because it directly reveals the future outcome. The Principal Principle was never meant to apply when we have such "crystal ball" knowledge. It's designed for situations where chance is our best guide precisely because we lack future knowledge.

  I should explain that Lewis distinguished between "admissible" and "inadmissible" evidence. Admissible evidence includes historical data and physical laws, while inadmissible evidence would be direct knowledge of future outcomes. The friend's prophecy clearly falls in the latter category.

  The user might be conflating the epistemic and metaphysical aspects here. Objective chance exists in the world (the coin's physical symmetry), while credence is about our knowledge state. When our knowledge includes future facts, chance becomes irrelevant to our beliefs - but that doesn't invalidate chance's role when we lack such knowledge.

  I recall Lewis actually discussed similar cases - like a demon whispering the outcome. His response was always that the principle requires screening off such inadmissible evidence. The user's example isn't novel but rather a standard test case for the admissibility clause.

  What's the user's deeper concern here? They might be wrestling with how objective probability relates to subjective belief, or perhaps questioning whether "chance" is a useful concept at all. I should emphasize that the Principal Principle isn't defeated by this example - rather, the example shows why the admissibility clause is necessary.

  I'll structure my response by first acknowledging their insight, then explaining the admissibility distinction clearly, showing how it resolves the apparent paradox. I'll emphasize that with the clause properly applied, the principle still stands: in ordinary situations without future knowledge, matching credence to chance remains rational.
answer: |-
  You've hit on a classic and important challenge to the Principal Principle (PP), but Lewis anticipated precisely this type of case! Your scenario highlights the crucial role of the **"admissibility clause"** in the PP, which you might have overlooked in its usual statement. Here's why your case isn't a counterexample:

  1.  **The Full Principal Principle (Lewis's Version):** Lewis didn't simply say "Set credence equal to chance." He said:
      > `C(A | H_t & Ch_t(A) = x) = x`
      Where:
      *   `C` is your credence function (subjective probability).
      *   `A` is the proposition in question (e.g., "The coin lands heads").
      *   `H_t` is the *total admissible* evidence available to you at time `t`.
      *   `Ch_t(A) = x` is the proposition that the chance of `A` at time `t` is `x`.

      **The critical part is "admissible evidence".**

  2.  **Admissible vs. Inadmissible Evidence:**
      *   **Admissible Evidence (`H_t`):** This is evidence that, at time `t`, does *not* "give information about whether or not A is true *over and above* that given by the chance of A itself" (Lewis, 1980). Typically, this includes:
          *   The entire history of the world up to time `t`.
          *   The laws of nature.
          *   General truths about how chances work.
      *   **Inadmissible Evidence:** This is evidence that *does* give information about `A` beyond what the chance value provides. Crucially, **information about the actual future outcome of `A` is paradigmatically inadmissible evidence at time `t`.**

  3.  **Applying it to Your Case:**
      *   **Initial Situation (No Friend):** Before your friend speaks, your total admissible evidence `H_t` includes the setup (fair coin, about to be flipped), the laws of physics, and the proposition `Ch_t(Heads) = 0.5`. The PP *correctly* prescribes `C(Heads | H_t & Ch_t(Heads)=0.5) = 0.5`.
      *   **Your Friend's Testimony:** Your friend tells you: "It's going to land heads." **This testimony is *inadmissible* evidence at time `t` (before the flip).** It directly tells you the future outcome (`A` is true), providing information that trumps the chance value.
      *   **Updated Situation:** Your total evidence *now* includes this inadmissible information. The PP *does not apply* to this new body of total evidence `H_t*` (which includes the friend's testimony), because `H_t*` contains inadmissible evidence relative to time `t`. The PP *only* constrains your credence conditional on `H_t` (admissible evidence) *and* the chance proposition.
      *   **Rational Belief:** Of course, your credence in Heads *should* shoot up close to 1! But this isn't because you're violating the PP *when applied correctly*. The PP never told you to ignore this new, inadmissible information. It only told you what your credence should be *conditional on the admissible evidence and the chance*. Once you gain inadmissible evidence, the PP's constraint simply no longer applies to your *unconditional* credence.

  4.  **Why the Chance is Still 0.5:**
      *   You're absolutely right that the objective chance of Heads *remains* 0.5 right up until the flip. Chance is an objective feature of the world at a time, based on the setup and the indeterministic process. Your friend's knowledge doesn't *change* that physical propensity.
      *   The PP doesn't say "chance determines the outcome" (it doesn't, it's probabilistic). It says how you *should set your credence* when chance is your *best guide* because you *lack* inadmissible information.
      *   Your friend gives you inadmissible information, *bypassing* the need to rely on the chance as your best guide. The chance is still 0.5, but it's no longer your best guide to the outcome because you have better information.

  **Where You Went Wrong (The Insight):**

  You correctly identified a situation where setting credence *equal* to chance (0.5) *after* hearing your friend *would* be irrational. **The mistake is attributing this irrationality to the Principal Principle itself.** The PP, *as properly formulated with the admissibility clause*, *does not prescribe* setting credence to 0.5 in this situation. It explicitly restricts its prescription to cases where your evidence is limited to the admissible kind. Your case demonstrates *why* the admissibility clause is essential, not that the principle fails.

  **Conclusion:**

  Your friend's testimony is classic **inadmissible evidence**. The Principal Principle, with its crucial admissibility clause, is specifically designed *not* to apply when you possess such information. It governs how to set rational credence *when chance is your best guide*, precisely *because* you lack direct knowledge of the future outcome. Your case is a perfect illustration of the *need* for the admissibility clause and shows the PP working as intended, not a counterexample that sinks it. Lewis's formulation elegantly handles your "counterexample" by recognizing that future truths are inadmissible. Your seminar prep has led you to a key insight about the PP's structure!
