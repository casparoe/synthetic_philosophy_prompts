prompt: |-
  I teach formal epistemology and decision theory, and for the past two years I've also served, somewhat incongruously, as the faculty senate's representative on my university's Emergency Preparedness Committee. We have an actual case bearing down on us: a hurricane is projected to make its closest approach to our coastal campus in roughly 60 hours, and the committee must decide by tomorrow morning whether to order a mandatory evacuation of the residence halls. The National Hurricane Center's official wind-speed probability product currently gives our specific location a 28% chance of sustained hurricane-force winds before the storm passes. Our longtime severe-weather consultant, who has an unusually good track record on storms taking this particular track, believes the real risk is considerably higher, based on a specific interaction between forward speed and wind shear that he thinks this model run underweights -- though he can't give us a number of his own, only his confidence that 28% is too low.

  The committee has split into two camps that have more or less stopped listening to each other. One camp says we rely on the Hurricane Center's model precisely so that individual hunches, however well-credentialed, don't drive a decision this consequential, and that letting our consultant's dissent move us off the official figure is exactly the mistake the literature on clinical versus actuarial judgment has been warning about since Paul Meehl's original studies in the 1950s. The other camp says refusing, as a matter of policy, to ever let an articulable expert judgment shift our number isn't really deference to objective chance at all, since the actual disagreement is over what the current chance is, not over whether we should act on it once we know it. A third member, more or less accurately, keeps insisting that the whole dispute really turns on whether our consultant's evidence counts as "admissible" in David Lewis's sense for purposes of the Principal Principle, and that nothing gets settled until someone says what admissibility requires here -- but she hasn't managed to finish that thought, and neither, honestly, have I.

  Could you draft the short memo I'll send the committee tonight? It needs to end in a specific decision procedure with a real deadline attached to it -- not just "gather more information" -- and it should take the actuarial camp's worry as seriously as it deserves, rather than resolving the dispute by simply declaring the more philosophically fashionable side the winner.
reasoning: |-
  Okay, the user teaches formal epistemology and decision theory but is also on an Emergency Preparedness Committee facing a hurricane decision. They need a memo to break a deadlock between two camps: one strictly following the Hurricane Center's 28% probability, the other wanting to adjust based on their consultant's expert opinion. Plus, there's the Lewis's Principal Principle admissibility angle.

  First, I need to understand the core conflict. The actuarial camp fears subjective judgment overriding models, citing Meehl's work. The expert camp argues that the model might not capture all current evidence, so updating isn't ignoring data but refining chance estimates. The third member brings up Lewis's admissibility, which is crucial here. 

  The user wants a decision procedure that respects both sides without favoring philosophical trends. The memo must lead to a concrete action with a deadline. They can't just gather more info; they need to decide by tomorrow morning.

  Key points: The NHC gives 28%, but the consultant, with a good track record, thinks it's higher due to specific factors like forward speed and wind shear. He can't quantify it, only says 28% is too low. The challenge is how to incorporate his input without arbitrary adjustments.

  Lewis's Principal Principle says to align credence with known chances unless inadmissible evidence exists. Admissibility here means evidence not already accounted for in the chance setup. The consultant's insight about model underweighting certain interactions might be inadmissible if the NHC model doesn't include it. But how to verify that?

  The memo should propose a practical approach: contact the NHC to ask if the consultant's concerns are factored into their model. If yes, then 28% stands. If not, then his input is inadmissible and can be used to adjust. If unsure, default to a precautionary adjustment. This addresses both camps by seeking clarification from the source and provides a clear deadline for the consultant to respond.

  Also, the decision threshold. Evacuation is costly, but not evacuating risks lives. They need to set a threshold where expected costs balance. Using a cost-benefit analysis with the probability helps. If the adjusted probability is above the threshold, evacuate. Otherwise, not. But since the consultant can't give a number, the procedure must handle uncertainty.

  Including a decision tree in the memo makes it actionable: contact NHC, get confirmation, adjust if needed, calculate expected costs, decide by morning. This respects actuarial concerns by validating the model first and allows expert input only if it's new information. It turns a philosophical debate into a concrete process with deadlines.
answer: |-
  ## MEMORANDUM  
  **TO:** Emergency Preparedness Committee  
  **FROM:** [Your Name], Faculty Senate Representative  
  **SUBJECT:** Decision Framework for Hurricane Evacuation (Deadline: 06:00 Tomorrow)  
  **DATE:** October 26, 2023  

  ### I. The Core Disagreement & Why Both Camps Are Partly Right
  1.  **Actuarial Camp's Valid Concern:** Blindly overriding a rigorously developed, statistically validated model (NHC’s 28%) with unquantified expert intuition *is* the classic error Meehl identified. We adopted the NHC model precisely to avoid subjective bias in high-stakes decisions. Ignoring this risks arbitrariness and undermines institutional reliance on objective risk assessment.
  2.  **Expert Camp's Valid Concern:** The NHC model is not an oracle of "the current objective chance"; it’s an *estimate* based on available data and assumptions. If our consultant possesses specific, articulable evidence (wind shear/forward speed interaction) *not adequately captured* in the model’s current run, this *is* new information relevant to the *actual* current chance. Refusing *in principle* to ever update based on such evidence is not deference to chance, but deference to a potentially flawed *model* of chance.

  ### II. Resolving the Impasse: Admissibility & A Practical Path Forward
  The Lewisian member is correct: The key is **admissibility** (Lewis, 1980). Does the consultant’s evidence qualify as "inadmissible" relative to the NHC’s 28% probability? That is:
  *   Is it **information not already accounted for** in the causal-historical basis of the NHC model's output?
  *   Is it **specifically about the outcome-generating process** (this storm's dynamics) rather than just the outcome itself?

  **Our Consultant's Claim:** He argues the *specific model run* underweights a known physical interaction (shear/forward speed) *for this specific storm track*. **This sounds like potentially inadmissible evidence:** It’s a critique of *how the model weights inputs* for *this particular instance*, suggesting the model’s output doesn’t fully reflect the true present chance due to a specific, articulable limitation *in this run*.

  **The Problem:** He hasn’t quantified it. We cannot blindly "adjust" the 28% without a method.

  ### III. Decision Procedure: Validation, Quantification, Threshold
  **Action Plan (Deadlines Embedded):**

  1.  **Immediate Validation Check (Deadline: 21:00 Tonight):**
      *   The Chair contacts the NHC liaison (or our consultant contacts his NHC counterpart) *immediately*.
      *   **Specific Question:** "Does the current probabilistic wind forecast (28%) for our location *explicitly account for and weight* the potential interaction between the storm's current forward speed [X knots] and the observed wind shear profile [Y] along its projected track in the manner our consultant believes is critical? If not, is this interaction typically captured in the model ensemble, and was it potentially underweighted *in this specific run*?"
      *   **Goal:** Determine if the consultant's concern reflects a *known gap or known limitation in this specific model output*. If NHC confirms the concern is valid and *not* fully accounted for, this strongly supports the evidence being inadmissible. If NHC states it *is* fully accounted for, the 28% stands.

  2.  **Expert Quantification Attempt (Deadline: 23:59 Tonight):**
      *   **Simultaneously,** the Committee Chair tasks our consultant: "Based *solely* on your concern about the shear/forward speed interaction being underweighted in the NHC model run for *this specific storm*, and given your track record on this track type, provide a *minimum plausible adjustment* to the NHC's 28% probability for our location. We need a single percentage point estimate representing the lowest value you believe is defensibly *higher* than 28% based *only* on this factor. Justify this minimum adjustment briefly." (e.g., "Based on past analogs where this occurred, I believe a minimum plausible adjustment is +7 percentage points, yielding 35%").
      *   **Rationale:** Forces articulation of a *conservative*, *defensible*, *scoped* adjustment based *only* on the alleged inadmissible evidence. Avoids open-ended hunches.

  3.  **Decision Threshold Application (By 06:00 Tomorrow):**
      *   **Scenario A (NHC Validates Gap / Consultant Provides Min-Adjustment):** Use the **Adjusted Probability (AP)** = max(28%, Consultant's Min-Adjustment). Proceed to cost-benefit.
      *   **Scenario B (NHC Confirms 28% Accounts for Concern / Consultant Cannot Quantify):** Use **AP = 28%**.
      *   **Scenario C (NHC Unclear / Consultant Provides Min-Adjustment):** Use **AP = 28% + (Min-Adjustment * 0.5)**. (Acknowledges uncertainty but incorporates concern cautiously).
      *   **Apply Evacuation Threshold:** We have an existing cost-benefit threshold (T) based on evacuation costs (C_evac) vs. expected cost of damage/injury given hurricane-force winds (C_damage). Simplified: Evacuate if `AP > T`, where `T = C_evac / C_damage`. (Assume T is pre-established; if not, Committee must set T quantitatively before 06:00).
      *   **Recommendation:** Based on AP and T, recommend Evacuate or Do Not Evacuate.

  ### IV. Why This Respects Both Camps & Philosophy
  *   **Respects Actuarial Priority:** The NHC 28% remains the baseline. It is only overridden if:
      1.  We identify a *specific, articulable reason* (via NHC consultation) why it might *not* fully represent the current chance (inadmissibility), AND
      2.  The expert provides a *quantified, scoped, minimal* adjustment based *only* on that specific reason. This is the opposite of unanchored intuition; it’s constrained updating based on identified model limitation.
  *   **Respects Expert Insight:** Provides a structured, auditable mechanism to incorporate specific, inadmissible evidence *if it exists and can be minimally quantified*, moving beyond the paralysis of "hunch vs. model."
  *   **Resolves Admissibility Practically:** We operationalize "admissibility" through direct validation with the source (NHC) regarding the model's basis. If the evidence *isn't* in the model's causal history, it's likely inadmissible and updatable.
  *   **Forces Action:** Mandates specific information gathering (NHC call, expert quantification) with hard deadlines, leading to a calculable decision by 06:00.

  ### V. Required Actions & Deadlines
  *   **Chair:** Contact NHC re: specific model weighting question **BY 21:00 TONIGHT.** Report result to Committee.
  *   **Consultant:** Provide minimum plausible probability adjustment (+X%) based *only* on the specified shear/speed concern **BY 23:59 TONIGHT.** Email Committee.
  *   **All:** Be prepared for final calculation (AP) and decision via email/vote **BETWEEN 05:00 - 06:00 TOMORROW MORNING.**

  This framework avoids philosophical stalemate by focusing on actionable verification and constrained quantification. It respects the model while acknowledging that models can have localized limitations requiring expert interpretation, provided that interpretation is specific, validated where possible, and quantified conservatively. Let’s execute this plan. Time is critical.
