prompt: |-
  I'm taking a graduate seminar on population ethics this term, and one thing that's struck me is that essentially every systematic axiology on offer for handling Derek Parfit's repugnant conclusion seems to buy its escape at the price of some other conclusion that is just as hard to swallow -- a pattern that Gustaf Arrhenius's impossibility theorems suggest is a structural feature of the problem rather than a coincidence. When I complained about this in office hours, my professor's suggestion was to stop looking for "the" solution and instead map the terrain by weighing the going proposals' costs directly against each other, which is what prompted the exercise below.

  Please rank the following eight approaches into tiers from S (most defensible overall package, all things considered) down to D (least defensible), weighing both (a) how costly the specific counterintuitive implication each view ends up accepting really is, and (b) how independently motivated the view is apart from its role in avoiding the repugnant conclusion: total (unrestricted aggregative) utilitarianism; average utilitarianism; critical-level utilitarianism; variable value theory (diminishing marginal value of additional lives, associated with Hurka and Sider); Parfit's lexical view; narrow person-affecting views; wide person-affecting views; and rank-discounted utilitarianism (Asheim and Zuber). Tiers may contain any number of theories, including none. Please give the ranking as a JSON block formatted as below, and then add one or two sentences per theory identifying the specific cost -- the named conclusion it accepts, or the adequacy condition from Arrhenius's impossibility results that it violates -- that justifies its placement:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
reasoning: |-
  We are ranking eight population ethics theories based on two criteria: (a) the cost of the counterintuitive implication they accept, and (b) their independent motivation apart from avoiding the repugnant conclusion. The repugnant conclusion (RC) is the problem that a large population with lives barely worth living can be better than a small population with very high quality of life. Arrhenius's impossibility theorems show that no population axiology can satisfy all intuitive desiderata.

  The theories and their typical costs:

  1. **Total Utilitarianism (TU)**: Accepts the repugnant conclusion. The cost is that it leads to the repugnant conclusion, which is widely considered counterintuitive. However, it is independently well-motivated (e.g., by impartiality and additive goodness).

  2. **Average Utilitarianism (AU)**: Avoids RC but faces the "Mere Addition" problem (adding a person with above-average welfare makes the average go down if the new person is below the original average, but if above, then it's good; but also, it implies that a population of one very happy person is better than a large population with slightly less but still very high welfare). Also, it violates the "Non-Anti-Egalitarianism" condition and may lead to anti-egalitarian conclusions. Independent motivation: it focuses on per capita welfare, which might seem relevant for quality.

  3. **Critical-Level Utilitarianism (CLU)**: Sets a critical level above zero (e.g., c>0) such that adding a life is good only if it is above c. Avoids RC but may lead to the "Sadistic Conclusion" (it can be better to add lives that are negative but above the critical level than to add lives that are positive but below the critical level, even if the latter are better). Independent motivation: it generalizes total utilitarianism and can be seen as having a threshold for a "good enough" life.

  4. **Variable Value Theory (VVT)**: The marginal value of additional lives diminishes. Avoids RC but violates the "Non-Sadism" condition (it may prefer adding a life with negative welfare over adding a life with positive welfare if the negative one is added to a smaller population). Also, it may violate the "Quality Addition" condition. Independent motivation: it captures the intuition that we care more about average welfare when populations are large.

  5. **Parfit's Lexical View (Lexical)**: Holds that there are lexical levels of welfare; a life at a higher level is always better than any number at a lower level. Avoids RC but faces the "Reverse Repugnant Conclusion" (a population with very high welfare might be better than a population with even higher welfare but at a lower lexical level, even if the latter has a huge number of lives). Also, it violates the "Continuity" condition. Independent motivation: it captures the idea that some goods (e.g., creative achievements) are incomparably better than others.

  6. **Narrow Person-Affecting Views (Narrow PA)**: Only consider effects on existing people. Avoids RC but leads to the "Non-Identity Problem" (it cannot explain the wrongness of bringing a person into existence with a life barely worth living when the alternative is not to bring them into existence, because the person isn't worse off). Also, it violates the "Negative Mere Addition" condition. Independent motivation: it adheres to a strong form of the person-affecting principle.

  7. **Wide Person-Affecting Views (Wide PA)**: Includes possible future people in the person-affecting scope. Avoids RC but may lead to the "Procreation Asymmetry" problem (it is wrong to create a person with negative welfare but not obligatory to create one with positive welfare). It may also violate the "Avoidance of the Sadistic Conclusion" condition. Independent motivation: it extends the person-affecting principle to include future people.

  8. **Rank-Discounted Utilitarianism (RDU)**: Weights the welfare of individuals by a discount factor based on their rank in the population ordering. Avoids RC but violates the "Separability" condition (the relative ordering of two populations can depend on the welfare of individuals who are equally well off in both). Also, it may lead to time-inconsistency. Independent motivation: it captures the idea that we give priority to the worse off, and it generalizes prioritarianism.

  **Tier Ranking**:

  We consider the overall package: how bad is the cost, and how independently motivated the theory is.

  - **S Tier**: The most defensible. The cost is relatively low and the theory is well-motivated.
  - **A Tier**: Good, but with some notable cost or less independent motivation.
  - **B Tier**: Moderate, with significant costs but still some motivation.
  - **C Tier**: Problematic, with high costs and/or weak motivation.
  - **D Tier**: Least defensible, with severe costs and little independent motivation.

  **Reasoning**:

  - **Total Utilitarianism**: Accepts the repugnant conclusion, which is a major cost, but it is the most independently motivated (simple, additive, impartial). Many consider RC a bullet to bite. We place it in A tier because it's a benchmark and the cost is a direct implication of its core.

  - **Average Utilitarianism**: Has multiple problems: anti-egalitarian, mere addition paradox, and the problem that it can prefer a small population with high average to a larger one with slightly lower average even if total welfare is much higher. Its independent motivation is moderate (per capita welfare is intuitive for quality). We place it in C tier because the costs are high and it doesn't avoid all problems.

  - **Critical-Level Utilitarianism**: Avoids RC, but the sadistic conclusion is a significant cost. However, it is independently motivated as a generalization of TU and captures a threshold for a "life worth starting". We place it in B tier.

  - **Variable Value Theory**: Avoids RC, but violates non-sadism and may have other problems. Its independent motivation is moderate (diminishing marginal value of lives is intuitive). We place it in B tier.

  - **Parfit's Lexical View**: Avoids RC, but the reverse repugnant conclusion and violation of continuity are major costs. Its independent motivation is philosophical but somewhat ad hoc. We place it in C tier.

  - **Narrow Person-Affecting**: Avoids RC, but the non-identity problem is a severe issue. Independent motivation is strong for some (person-affecting principle) but it fails to account for many intuitive obligations. We place it in D tier.

  - **Wide Person-Affecting**: Avoids RC, but the procreation asymmetry and potential for sadistic conclusion are problematic. Independent motivation is stronger than narrow PA but still controversial. We place it in C tier.

  - **Rank-Discounted Utilitarianism**: Avoids RC, but violates separability and may be time-inconsistent. However, it has independent motivation from prioritarianism and fairness. We place it in A tier because it is a sophisticated approach that captures prioritarian concerns.

  **Tier Assignment**:

  - S: None of the theories escape without a significant cost, so we leave S empty. Alternatively, we might put the best in A.

