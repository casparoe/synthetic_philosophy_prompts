prompt: |-
  For a seminar on social ontology and the philosophy of norms, I have been reading David Lewis's Convention, and I think I have worked out a general way of using his account to predict how resistant a given social practice will be to change. On Lewis's definition, a regularity counts as a convention, rather than as a rule imposed by nature or necessity, only if several conditions hold together: people generally conform to it, it is common knowledge that they do, each person prefers to conform on condition that others do (so that the regularity solves a coordination problem), and, crucially, at least one alternative regularity could in principle have solved that same coordination problem just as well. This last requirement is Lewis's arbitrariness condition, and it is meant to mark off genuine conventions from regularities that hold simply because the situation leaves no real alternative.

  It seems to follow fairly directly that arbitrariness, in this specific sense, should track how easy a practice is to change: if nothing about the underlying coordination problem favors the status quo regularity over some alternative, then a population that wants to switch should be able to do so with relatively little friction, just by enough people coordinating on the alternative instead. Practices that persist for some other, non-arbitrary reason should by contrast be comparatively rigid. I mentioned this to a couple of classmates and they found it fairly intuitive as well, so we started testing it on a couple of standard illustrations of his view, such as driving-side conventions and the pairing of words with meanings within a shared language.

  Here is where I would like your help: does identifying a practice as "arbitrary" in Lewis's technical sense really support the conclusion that it should be comparatively easy to shift away from, once a population recognizes it as arbitrary? And if so, how should I square that with the fact that practices like driving-side conventions and word meanings are, if anything, notoriously hard to change from within a population, short of some external shock or coordinated edict? I would like to know whether the trouble lies in my reconstruction of Lewis's view, in the further inference from arbitrariness to ease of change, or somewhere else entirely.
reasoning: |-
  Okay, let me start by understanding the user's question. They're working on social ontology and norms, focusing on David Lewis's Convention. They've developed an idea that the arbitrariness of a convention should predict how easy it is to change. But they're confused because driving-side and language conventions, which are arbitrary, are actually hard to change. I need to figure out where the disconnect is.

  First, I should recall Lewis's definition. Arbitrariness means there's at least one alternative that could solve the same coordination problem. The user thinks that because it's arbitrary, switching should be easy. But real-world examples show resistance. So why is that?

  I remember Lewis's coordination equilibria. People conform because others do. The preference is conditional. Even if an alternative exists, switching requires coordination. If everyone else is driving on the right, I can't switch to left alone. That's dangerous. So the equilibrium itself creates inertia.

  Then there's common knowledge. Everyone knows everyone knows the convention. This stabilizes it. To change, you need a critical mass to shift together. But getting that coordination is tough without a central authority or focal point. The user mentioned external shocks or edicts—those act as focal points. Otherwise, spontaneous coordination is hard.

  Also, the user might overlook transaction costs. Even if alternatives exist, organizing change involves effort. People might prefer the status quo to avoid these costs. Plus, network effects: in language, the value increases with more users. Switching loses that network benefit temporarily, which discourages change.

  The user's reconstruction isn't wrong, but they might be missing that arbitrariness doesn't imply low switching costs. The costs come from coordination dynamics, not the nature of the problem. So the inference from arbitrariness to ease of change oversimplifies.

  I should explain that Lewis’s conditions create stability. The very mechanisms that sustain conventions (conditional preferences, common knowledge) make them sticky. Change requires overcoming collective action problems, which isn't accounted for in the arbitrariness condition alone.

  Also, maybe the user’s classmates agreed because it seems intuitive, but real-world complexity adds friction. Emphasizing the difference between theoretical possibility and practical feasibility would help. Pointing out examples like QWERTY vs. Dvorak or language reforms that failed without top-down intervention could strengthen this.

  In conclusion, the issue is in the inference from arbitrariness to ease of change. The user correctly applied Lewis's conditions, but didn't factor in the stability mechanisms inherent in conventions. Highlighting coordination costs, network effects, and path dependency would address their confusion. Suggesting further reading on collective action problems or path dependence in institutions might be useful for their seminar.
answer: |-
  Your reconstruction of Lewis's core framework is precise, and your inference about arbitrariness *potentially* facilitating change is logically sound *in principle*. However, the difficulty you encounter with real-world examples like driving-side rules and language highlights a crucial nuance: **Lewis's conditions explain the *stability* of conventions, and this stability inherently creates *inertia* against change, even when the convention is arbitrary.** The trouble lies primarily in the inference from "arbitrariness" to "ease of change," specifically underestimating the *coordination costs* and *collective action problems* inherent in shifting equilibria.

  Here's a breakdown:

  1.  **Lewis's Arbitrariness Condition is Correctly Understood:** You are right that arbitrariness means there exists at least one alternative equilibrium that could solve the coordination problem just as well. The driving side *could* be left or right; the sound "dog" *could* mean a feline (if everyone coordinated on that).

  2.  **The Inference: Arbitrariness *Enables* Change (But Doesn't Guarantee *Ease*):**
      *   **True:** Arbitrariness *is* a necessary condition for the *possibility* of change *within the framework of rational coordination*. If a regularity *wasn't* arbitrary (e.g., breathing oxygen), no amount of coordination could change it to a viable alternative. Arbitrariness opens the door.
      *   **True:** If a population *simultaneously and instantaneously* coordinated on switching to the alternative equilibrium, the change would be frictionless *in theory*. The problem is that "simultaneous and instantaneous coordination" rarely, if ever, happens spontaneously in large groups.

  3.  **Why Arbitrary Conventions are Still Hard to Change (The Stability Creates Inertia):**
      *   **Conditional Preferences & Equilibrium Stability:** Lewis's core insight is that conventions are stable *because* each individual's best response is to conform *given that others are conforming*. This creates a Nash equilibrium. Even though an alternative exists, **no single individual has an incentive to deviate unilaterally.** Switching alone is disastrous (driving on the wrong side) or pointless (using a word meaning no one else uses). Change requires *coordinated deviation*.
      *   **Coordination Costs & Collective Action Problems:** Switching requires a *critical mass* (often a large one) to switch *together*. Organizing this coordination is costly:
          *   **Transaction Costs:** Communicating, agreeing on the alternative, agreeing on the timing.
          *   **Assurance Problems:** How do I know *enough* others will switch? If I switch and others don't, I suffer. I need assurance they will switch *if* I do. This creates mutual hesitation.
          *   **Lack of a Focal Point:** The *existing* convention is the dominant focal point. The *alternative* is often not salient or lacks a clear signal for coordination. "Let's all drive on the left tomorrow" is vague and lacks the salience of law or mass media campaigns. What *is* the specific alternative word meaning? How do we signal we're adopting it?
      *   **Common Knowledge Reinforces the Status Quo:** Common knowledge of the convention reinforces everyone's expectation that others *will* conform, making the assurance problem for switching even harder. It solidifies the current equilibrium as the default.
      *   **Network Effects & Increasing Returns:** Many conventions (especially language) exhibit network effects. The value of participating increases with the number of others participating. Switching disrupts this network benefit temporarily, creating a loss aversion. The current convention has a massive installed base.
      *   **Path Dependence:** The current convention, even if arbitrary, is the path we are on. History matters. The costs of switching (learning a new side/direction, relearning word meanings) often outweigh the negligible benefits of an equally good alternative, *unless* the current convention becomes dysfunctional (which it usually isn't, precisely because it solves the coordination problem).
      *   **The "External Shock or Coordinated Edict" is the Solution:** Your observation is key. Lewis himself acknowledges that conventions often change via:
          *   **Exogenous Shocks:** Events disrupting the old coordination (e.g., revolution, technological change, merging populations with different conventions).
          *   **Salient Focal Points:** A clear, salient signal that creates common knowledge *of the switch* and acts as a new coordination point (e.g., a new law, a powerful leader's decree, a massively publicized campaign, a technological standard). These overcome the coordination problem *for the switch itself*.

  4.  **Applying to Your Examples:**
      *   **Driving Side:** Arbitrary? Absolutely. Easy to change spontaneously? No. Switching requires massive, simultaneous public re-education, re-signage, vehicle modifications, and law changes precisely to *overcome* the coordination costs and assurance problems. Sweden's switch in 1967 ("Dagen H") is a classic example requiring years of planning and a massive, state-coordinated campaign.
      *   **Language (Word Meaning):** Deeply arbitrary. Easy to change spontaneously? Extremely difficult. Speakers are locked into a network. Changing a word meaning requires convincing a critical mass to adopt the new meaning *and* use it consistently *and* understand each other, while the old meaning persists and causes confusion. Successful changes usually involve slow drift, subcultural adoption that later becomes mainstream, or top-down imposition (e.g., academies, powerful media).

  **Conclusion & Where the Trouble Lies:**

  *   **Your Reconstruction of Lewis:** Is fundamentally sound. You correctly identify arbitrariness as a key feature enabling *possible* change.
  *   **The Further Inference:** This is where the primary issue lies. You correctly deduced that arbitrariness *removes a barrier* to change (the lack of a viable alternative), but **you underestimated the powerful *stabilizing forces* inherent in Lewis's very definition – the conditional preferences and common knowledge that create self-reinforcing equilibria.** These forces *create* the friction and inertia you observe.
      *   Arbitrariness is necessary for change *to be possible without solving a new coordination problem*, but it is **not sufficient** for change to be *easy*.
      *   **Ease of change depends primarily on the *costs of coordinating the switch* away from the current stable equilibrium, not just the existence of an alternative equilibrium.** Lewis's framework brilliantly explains *why* these coordination costs are high.

  **How to Square It:**

  *   **Refine Your Prediction:** Instead of "arbitrariness predicts ease of change," think: **"Arbitrariness is a precondition for change *without fundamental alteration of the underlying coordination problem*, but the *actual ease* of such change is inversely proportional to the *coordination costs* involved in moving from the current equilibrium to an alternative one."**
  *   **Lewis Explains Stability, Change Requires More:** Lewis's core model explains *persistence*. Explaining *change* within his framework requires adding factors that overcome the stability mechanisms he identified – factors like exogenous shocks, the emergence of powerful new focal points, or explicit coordinated action (often top-down) that solves the *meta-coordination problem* of switching conventions.
  *   **"Hard to Change" is Evidence *for* Lewis, Not Against:** The very fact that driving rules and word meanings *are* hard to change spontaneously, despite being arbitrary, is powerful evidence *for* Lewis's model of conventions as self-reinforcing coordination equilibria sustained by conditional preferences and common knowledge. Their resistance to change *is* a consequence of their conventional nature as Lewis defined it.

  Your insight is valuable – arbitrariness *does* matter for the *type* of change possible. But the friction you observe isn't a flaw in Lewis; it's a direct consequence of the powerful stability mechanisms his theory identifies. The challenge is to model *how* those stability mechanisms are overcome.
