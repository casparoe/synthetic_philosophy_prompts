answer: |-
  Here’s a take, leaning into your funeral pyre image but keeping the philosophy implicit in action and perception:

  The coals glowed like a slow heartbeat under the ash. Marta fed another split log to the pyre, the wood hissing as flame tongues claimed it. Tomorrow, they’d light David’s pyre here. Tonight, she tended this fire, her hands moving with the memory of fifty winters spent feeding stoves. *He was his laugh*, she thought fiercely, watching the new log blacken and curl. That booming sound that shook his whole frame, inseparable from the man. Like the heat *was* the wood, burning. But the laugh was gone now. Just a silence where it lived. And the wood wasn’t the heat, was it? This log was cold at its core, even as flame ate its skin. If David *was* just his laugh, his kindness, his stubbornness… where was he now? The fire spat an ember. A hollow opened in her chest. No. He wasn’t *only* those things. That couldn’t be right.

  She stepped back, wiping soot on her apron. The night air bit. Maybe he was *something else*, then. Something that *had* the laugh, wore the kindness like a coat. A soul, floating free now, watching her? She scanned the dark treeline beyond the firelight. Nothing. Just wind in the pines. If he were some separate thing, apart from his body, his voice, his habits… where would it live? Like fire without fuel – a warmth hanging in empty air? Unthinkable. There was no ghostly shimmer above the pyre, only smoke vanishing upwards. The cold at her back felt more real than any phantom David. The idea of a separate *him*, untouched by the flesh that had held her, felt… thin. False. Like trying to cup moonlight.

  Frustration tightened her jaw. She thrust the iron poker into the heart of the blaze. *Alright then, both.* He *was* his laugh, his rough hands, his stories… *and* he was something more, something that escaped the telling. Like the fire *is* the burning wood *and* the heat radiating out, warming her face. But the wood turned to ash, the heat faded into the night. David was gone. Utterly. If he was *both* the parts and something beyond… where did that leave him now? The contradiction snagged. Trying to hold both thoughts felt like clutching smoke – solid for a second, then nothing. The fire crackled, indifferent.

  She pulled the poker out, its tip white-hot. The heat pulsed against her skin. It wasn’t the wood. It wasn’t some disembodied spirit of heat floating free. It wasn’t both wood *and* spirit. And it certainly wasn’t neither – the warmth on her face was undeniable, born of the wood, yet more than unburned timber. Exhaustion washed over her, not despair, but the weariness of a path walked in circles. She stopped trying to *find* David in the categories. She simply knelt, feeling the fire’s warmth *on* her skin, *through* the air, *from* the burning wood. The warmth that needed the wood, yet wasn’t owned by it. The warmth that existed *between* things, *because* of things. Tomorrow, David’s body would feed the flames. The warmth she felt then wouldn't *be* him, wouldn't be *separate* from him, wouldn't be *both*, nor would it be *nothing*. It would be… connection. Like this warmth now – real, present, dependent, empty of any fixed essence, yet undeniable. She added one last log, not to define the fire, but to sustain the warmth a little longer in the vast, cold night.

  ---

  **Why this works for your goals:**

  1.  **Dramatized Logic:** The fire isn't just a symbol; it actively resists Marta's attempts to categorize it (and, by extension, David/her grief). Each stage of the tetralemma ("He *is* his laugh," "He *is* something separate," "He *is* both," "He *is* neither") is shown through her direct interaction *with* the fire and her internal struggle. The failure of each position is demonstrated physically (hollowness, scanning empty darkness, clutching smoke, exhaustion).
  2.  **Load-Bearing Metaphysics:** Remove the underlying logic of dependent origination and emptiness, and the scene loses its coherence. Why does Marta fixate on these specific contradictions? Why does the fire's behavior matter so much? The emotional resolution ("connection," "warmth... dependent, empty... undeniable") only makes sense *because* of the preceding struggle with the four positions. The warmth isn't just comfort; it's the direct experience of the interdependence she couldn't conceptualize.
  3.  **Avoids Nihilism:** The ending isn't "nothing matters." It's the opposite: the warmth is *real*, the connection is *real*, precisely *because* it isn't some fixed, independent, self-existing "thing." Its reality lies in its dependent, relational nature. The "emptiness" here is the *lack* of inherent, isolated existence, making relationship and warmth *possible*.
  4.  **No Lectures:** Nagarjuna, aggregates, tetralemma, emptiness – none are named. The philosophy is embedded in Marta's actions, perceptions, and the concrete reality of the fire. The reader experiences the logic through her frustration and eventual quietude.
  5.  **Fire as Vessel:** The fire is perfect. It visually embodies the paradox (fuel/flame), allows physical interaction (feeding, poking, feeling heat), and provides a natural setting (funeral pyre) for existential questioning. It's active, changing, and undeniable – the ideal teacher.
  6.  **Emotional Core:** The philosophy serves the human story of grief and the search for meaning in loss. The metaphysics aren't decorative; they are the structure through which Marta processes her pain. Her "aha" moment isn't intellectual, it's sensory and emotional, rooted in the physical reality of the fire's warmth.

  This approach shows how the abstract structure of Nagarjuna's argument can become the invisible scaffolding for a deeply human moment, where the struggle *is* the understanding. Good luck with your novel – this is a fascinating challenge!
