prompt: |-
  A friend and I spent an entire evening arguing about testimony and got nowhere. The question was whether someone is ever entitled to believe a claim purely because they were told it, without any independent, non-testimonial check on the speaker's reliability. I defended some version of reductionism; he objected that this demands more of ordinary belief-formation than even small children could supply, since they plainly trust testimony well before they could have amassed any track record to draw on. As it happens, next week's guest on my philosophy podcast is an epistemologist who defends anti-reductionism about testimony in the tradition of Reid: the view that our default trust in what we're told is a basic entitlement, not something inferred from experience. Draft eight to ten interview questions that go beyond having her restate the view. I want at least one question on Reid's own circularity charge against reductionism, and whether anti-reductionism can escape a parallel charge; one on the worry that an unearned default entitlement simply licenses gullibility toward unfamiliar or unreliable speakers; and one on whether cases where testimony seems to generate knowledge that no single speaker in the chain possessed -- rather than merely relaying a warrant someone already had -- sit comfortably with her position. For each, add a follow-up keyed to the answer she's most likely to give.
