answer: |-
  Here is a dialogue capturing the core philosophical clash, focusing on your grandfather's situation:

  **Characters:**
  *   **Dr. Hartley (Hartian Positivist):** Believes law is defined by valid social rules, separate from morality. Justice requires applying laws as they *were* at the time.
  *   **Professor Fuller (Fullerian Natural Lawyer):** Believes law inherently requires a moral foundation ("internal morality"). A system failing this isn't truly law, and its commands lack legitimacy.

  **Setting:** A university common room, coffee in hand.

  **(The conversation turns to post-reunification German trials)**

  **Dr. Hartley:** ...which brings me back to the Mauerschützen trials, Professor. Take a young conscript guard in the early 70s. He's handed a rifle, told the Border Act is the law, and ordered to stop escapes. The *published* Border Act says "proportionate force." But his commanders drill into him: "Schieszbefehl" – shoot to kill. Secret orders, yes, but within a system where those orders *were* the operational reality, backed by the state's coercive power. Charging him *decades later* with manslaughter? It reeks of the same flaw Hart identified in the Grudge Informer case!

  **Professor Fuller:** The flaw, Dr. Hartley, being?

  **Hartley:** Retroactivity disguised as jurisprudence! At the moment he acted, according to the *valid legal system* he existed within – however repugnant we find it – his action *was* legally sanctioned. The secret orders, while morally abhorrent and perhaps ultra vires *within* that system, were the functional law for the border guards. To void his defense *after* the fact, based on a moral or legal standard applied retroactively, is to punish him for something that wasn't illegal when he did it. It's victor's justice, not the rule of law. How can he be guilty of a crime if his defense – "I was obeying a valid legal order" – was legally sound *then*?

  **Fuller:** "Valid legal system"? That's precisely where we diverge. Radbruch's formula cuts to the heart of it: When positive law conflicts intolerably with justice to the point of denying it entirely ("unerträglich ungerecht"), it ceases to be law. The published Border Act demanding "proportionate force" was a facade. The *actual* command, enforced with brutal consistency, was "kill escapees." This wasn't just an immoral law; it was a fundamental *betrayal* of law's very purpose. The regime failed the most basic tests of law's internal morality: it wasn't general, it wasn't public, it wasn't consistent (secret orders vs. public statute), and it demanded the impossible – reconciling the public law with the secret command.

  **Hartley:** But Radbruch's formula *is* retroactive application of morality! You're judging the DDR system by *our* standards, *now*. For that guard in 1972, the command structure *was* the reality. Declaring it "not law" after the fact doesn't change what he reasonably believed his legal duty was *then*. He wasn't a legal philosopher; he was a conscript facing imprisonment or worse for disobedience within *his* system. Punishing him for failing to intuit a higher natural law we only *later* apply feels deeply unjust.

  **Fuller:** It's not about him intuiting natural law abstractly. It's about the *contradiction* thrust upon him. The public law told him one thing ("proportionate force"); the secret command told him another ("kill"). This gap wasn't a minor bureaucratic glitch; it was the regime's *deliberate* strategy to evade the minimal requirements of legality. By operating through secret, unpublicized decrees that flagrantly contradicted the published statutes, the regime forfeited any claim that its *actual* commands constituted valid law. The guard wasn't caught between two laws; he was caught between the *semblance* of law and its *corruption*.

  **Hartley:** So, what was he to do? Become a martyr? Refuse and end up in Hohenschönhausen? Your theory demands heroic dissent as the only legal course? Law, even imperfect law, needs to operate for the average person within the system as it exists, not as we wish it did.

  **Fuller:** The legal culpability lies precisely in *choosing* to pull the trigger knowing he was ending a human life based on a secret order that *nullified* the public legal constraint. The published Border Act *was* the law he *could* and *should* have known. The secret order wasn't law; it was a criminal conspiracy masquerading as law. By obeying the secret order over the published statute, he participated in that illegality. His defense fails because the order he obeyed lacked legal legitimacy *at the time*, due to its contradiction of the public, general rule and its violation of law's internal morality. He committed an act – killing a human being – that the only *valid* published law did not authorize in that manner.

  **Hartley:** I see the force of the gap argument. The contradiction is stark. But my core objection remains: declaring the secret order "not law" *retroactively* still feels like changing the rules after the game. Even if the system was corrupt, its *effective* command power over him was real. Punishing him for not seeing through its illegitimacy *at the time*...

  **Fuller:** Perhaps our disagreement narrows here. Is your objection fundamentally to the *concept* of convicting the guard, or to the *justification* used? Could a Hartian positivist *ever* convict such a guard?

  **Hartley:** (Pauses thoughtfully) It would be extraordinarily difficult, bordering on impossible, under strict positivism. It would require finding the secret orders *invalid within the DDR's own constitutional or legal framework at the time*. If they violated a higher DDR statute or principle that *was* valid law then, perhaps. But proving that operational command was ultra vires *under DDR law* is messy. The courts seemed to rule it was *always* invalid because it contradicted fundamental justice – which loops back to natural law.

  **Fuller:** And there lies the practical convergence, perhaps. For me, the Radbruch formula and the gap demonstrate the invalidity *at the time*. For you, retroactive application remains problematic. Yet... consider the verdict itself. Manslaughter. It requires *unlawfulness*. The natural lawyer says the killing was unlawful *because* the order was invalid due to the system's failure as law. The positivist struggles to find a clear *contemporary* DDR legal source declaring the order invalid. But... might both agree that the *act* of killing an unarmed escapee, absent a *truly valid* legal authorization (which the secret order, due to its contradiction and secrecy, could not provide), constitutes manslaughter? That the guard lacked a *legitimate legal defense*?

  **Hartley:** You mean... that regardless of our *path* to get there, we might both conclude his defense of "superior orders" fails? For me, it fails only if the order was illegal *under DDR law then*, which is uncertain. For you, it fails categorically because the order wasn't *law* at all. But the *outcome* – no valid defense, therefore potential guilt for manslaughter – could be the same?

  **Fuller:** Precisely. The natural lawyer sees the order as void *ab initio* due to the regime's failure. The positivist might see the order as potentially valid DDR law but argue that *even DDR law* didn't authorize killing in all circumstances, or that the guard's interpretation/applicaton was unreasonable given the published statute's text. Or, reluctantly, accept that applying the Radbruch gap argument, while philosophically retroactive in *labeling* it "not law," is the necessary practical tool to deny the defense *without inventing a new crime*, since the core act (unjustified killing) was always *malum in se*. We might reach the same verdict – that he is not shielded from culpability by the order – though our philosophical justifications for *why* the order provides no shield remain distinct. The core disagreement persists on the *nature of law*, but the application to *this specific defense* might lead us to the same courtroom conclusion: no exoneration.

  **Hartley:** (Nods slowly) It's a nuanced point. I remain deeply uncomfortable with the retroactive element inherent in declaring the whole edifice "not law." But I concede that the chasm between the published law and the brutal reality creates a unique space where even a positivist might find the legal defense of superior orders fatally compromised *without* necessarily invoking natural law first principles. The gap itself creates a legal uncertainty *within the system* that undermines the defense's validity. Perhaps, in this specific, egregious case, built on deception and contradiction, our paths, though starting from opposite poles, lead us closer on the outcome than I initially thought... even if we still argue fiercely about the map we used to get there. The question of *personal* guilt, of course, involves mens rea and circumstances – was he a fanatic, a terrified conscript, somewhere in between? That’s separate from the legal defense.

  **Fuller:** Agreed. The *legal* question of whether the order provided a valid defense is one thing. The *moral* culpability of the individual guard, given his context, is another layer entirely. Our dialogue concerns the former. And on that, perhaps we find the defense fails, though the journey through legal philosophy to reach that conclusion remains our battleground.

  **(They sip their coffee, the weight of history and philosophy hanging in the air.)**
