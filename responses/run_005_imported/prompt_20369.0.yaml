prompt: |-
  I'm on the new workload-equity subcommittee at my company (an HR-adjacent panel that handles job-description and workload disputes), and honestly this case hits close to home. A colleague filed a grievance because she keeps getting pulled into unpaid extra work that never shows up on her review -- running the inclusion panel discussions, being the go-to person whenever a manager has a question about accommodations, explaining her own disability to every curious new hire -- and she wants it formally recognized, either as comp time or credit toward promotion. Half the committee says this is just normal good-citizen stuff everyone does a bit of, and that formalizing it opens the floodgates (what about the guy who always fixes peoples printers, or whoever organizes the holiday party?). The other half thinks somethings different when the "extra work" is basically mining someone's identity for free rather than a skill they'd have anyway. I have to help draft the actual recommendation before next weeks meeting. Could you write the short memo -- a real decision (approve / deny / approve with conditions), a timeframe (including whether its retroactive and when it'd get reviewed again), and reasoning that seriously engages the "this is just normal citizenship work" objection instead of brushing it off? Sorry if this reads a bit ranty, I got asked to run another unpaid lunch-and-learn this morning so i'm kind of heated about it lol.
reasoning: |-
  Okay, the user is part of a subcommittee dealing with a workload-equity case. They need to draft a memo recommending whether to approve or deny a colleague's grievance about unpaid extra work related to her disability. The colleague is asked to run inclusion panels, answer accommodation questions, and explain her disability to new hires—tasks that aren't on her review or compensated. The committee is split: some see this as normal "good citizenship," while others argue it's exploitative because it mines her identity. The user wants a balanced memo that addresses both sides, with a clear decision, timeframe, and reasoning.

  First, I need to understand the core issue. The colleague's extra duties are tied to her identity as a disabled person. Unlike fixing printers or organizing parties, these tasks require her to repeatedly disclose personal experiences, which can be emotionally taxing. The key question is whether this crosses the line from voluntary contribution to exploitative labor.

  The user mentioned their own frustration about being asked to run an unpaid lunch-and-learn, so they're personally invested. This suggests they might lean toward approving the grievance but need to present a fair, defensible argument that won't cause backlash or set impractical precedents.

  The committee's "floodgates" concern is valid. If they compensate this, will they have to pay everyone who does extra unpaid work? But identity-based labor is different. Research shows that women and minorities often handle disproportionate "diversity tax" work without recognition. That's not the same as someone choosing to fix printers—it's imposed because of their identity.

  For the memo, I should recommend approval with conditions. Full approval might be too broad, and denial ignores the injustice. Conditions could include: only formalizing identity-specific tasks, requiring documentation, and setting a review period. This balances equity with practicality.

  Timeframe: Make it prospective, not retroactive. Retro pay could be messy and set a tricky precedent. Review in 6 months to assess impact and adjust.

  Reasoning must tackle the "good citizenship" argument head-on. Emphasize that identity labor is often invisible, mandatory-feeling, and emotionally costly. Unlike optional tasks, declining it might harm her reputation or career. Also, it directly serves company DEI goals—so recognizing it aligns with organizational values.

  Structure the memo clearly: decision, timeframe, detailed reasoning. Use formal but empathetic language. Cite the imbalance in workload and the committee's duty to ensure equity. This should satisfy both the user's need for a strong stance and the committee's need for a reasoned approach.
answer: |-
  ## Workload Equity Subcommittee Recommendation Memo  
  **Case:** Grievance Regarding Uncompensated Identity-Based Labor (Disability Advocacy & Education)  
  **Recommended Decision:** **Approve with Conditions**  
  **Effective Date:** Prospective from date of committee ratification (not retroactive)  
  **Review Date:** 6 months after implementation  

  ### Recommendation Summary
  The subcommittee recommends formally recognizing and compensating the specific category of identity-based labor described in the grievance (running inclusion panels, serving as the accommodations resource, explaining personal disability experience to new hires) as *distinct work duties*. These duties shall be documented in the employee’s job description, tracked for performance evaluation, and eligible for comp time or promotion credit under the following conditions:

  1.  **Formal Assignment:** Tasks must be formally requested/directed by management or an official committee (e.g., "Please lead the Q3 Inclusion Panel," "Serve as the HR liaison for accommodation process questions this quarter").
  2.  **Identity-Specific Nexus:** The work must demonstrably rely *primarily* on the employee's lived experience of a protected identity (e.g., disability, race, gender identity, etc.) to fulfill an organizational DEI/accessibility need, rather than a general skill or voluntary social activity.
  3.  **Documentation:** Employee and manager agree on scope, estimated time commitment, and compensation method (comp time *or* performance credit) *before* or immediately upon task assignment. Time spent must be tracked via existing systems (e.g., project code, timesheet note).

  ### Reasoning & Engagement with "Good Citizenship" Objection
  We acknowledge the valid concern regarding "floodgates" and the desire to maintain a culture where employees contribute beyond strict role definitions ("good citizenship"). However, we find the contested work fundamentally distinct from general office citizenship in three critical ways, necessitating differential treatment:

  1.  **Nature of the Labor & Personal Cost:**  
      *   **Identity Mining vs. Skill Sharing:** Fixing a printer or organizing a party utilizes a *skill* (technical, organizational) an employee possesses *separately* from their core identity. The labor in question requires the employee to repeatedly *mine their personal, often vulnerable, identity experience* for organizational benefit. This involves significant emotional labor, potential re-traumatization, and a unique personal cost absent in general helpfulness. Declining such tasks can carry disproportionate social or professional risk for individuals from marginalized groups.
      *   **Burden of Representation:** This work often places the employee in the position of being the *de facto* representative or educator for their entire identity group within the organization, a burden not shared equally.

  2.  **Voluntariness & Power Dynamics:**  
      *   While holiday party planning is typically truly voluntary, identity-based requests often carry an implicit (or explicit) expectation rooted in the employee's identity. Saying "no" can feel riskier due to perceptions of lacking "team spirit" or commitment to DEI, creating an uneven power dynamic compared to declining to fix a printer. This work is rarely *neutrally* optional.

  3.  **Organizational Value & Alignment:**  
      *   This work directly serves core strategic goals around inclusion, accessibility, and legal compliance. It is *essential work* for the organization, not incidental social activity. Failing to formally recognize, compensate, and distribute this labor equitably places an unfair and invisible burden on specific individuals and risks burnout, resentment, and attrition of valuable talent. It also signals that this vital DEI work is less valued than technical or revenue-generating tasks.

  **Addressing the "Floodgates" Concern:**  
  Our conditional approval specifically targets *identity-based, strategically requested labor*. It does *not* cover:  
  *   General technical assistance (printer fixes).  
  *   Social event organization (holiday party).  
  *   Truly spontaneous, peer-to-peer mentoring or help.  
  *   Tasks utilizing general skills unrelated to identity (e.g., a graphic designer making a flyer for an ERG event).  
  The "Identity-Specific Nexus" and "Formal Assignment" criteria create a clear, defensible boundary. This framework ensures recognition is applied equitably *across* identity groups (e.g., race, gender, LGBTQ+, etc.) for similar essential labor, preventing ad-hoc decisions.

  ### Implementation & Next Steps
  1.  **Ratify Recommendation:** Formal subcommittee approval.  
  2.  **Develop Process:** Collaborate with HR to create a simple intake/tracking form and guidelines for managers on requesting/documenting this work.  
  3.  **Communicate:** Clearly explain the new policy, its rationale, and scope to all managers and employees to set expectations and encourage equitable distribution of this work.  
  4.  **Review:** Assess usage, employee feedback, managerial adherence, and any unintended consequences at the 6-month review. Refine criteria/process as needed.

  **Conclusion:** Recognizing and compensating this specific category of identity-based labor is a matter of workload equity and organizational integrity. It acknowledges the unique personal cost and strategic value of this work while establishing clear, fair boundaries that distinguish it from general office citizenship, addressing the valid concerns of the committee. This approach fosters a more sustainable and genuinely equitable workplace.

  ---
  **This memo provides a firm decision grounded in the unique aspects of identity labor, directly counters the "good citizenship" objection with clear distinctions, sets practical boundaries to prevent overreach, and establishes a timeframe for review. It balances the need for equity with operational reality.** Good luck with the meeting – your personal experience clearly informs a crucial perspective on this issue!
