answer: |-
  Here’s a toast that threads your needle—grounded in Lewisian theory but warm, inclusive, and celebratory. It runs about 4.5 minutes when spoken naturally, with pauses for laughter/applause:

  ---

  **(Raise glass, smile at the couple)**  

  "Friends, family, colleagues… and everyone who’s ever witnessed my sister try to ‘coordinate’ breakfast orders with her now-husband: we’re here to celebrate something extraordinary.  

  Now, I know many of you are experts in game theory or philosophy. And many of you… are experts in surviving family gatherings where people say things like ‘coordination equilibrium.’ (*Gentle laughter*). So, let’s start with a story everyone gets.  

  Picture two people walking toward each other on a narrow path. They need to pass. Instinctively, they veer—one left, one right—bump, awkward laugh, try again. But if they *both* veer left? Smooth sailing. If they *both* veer right? Also smooth. **Either way works**—as long as they pick the *same* way. And if they do it again tomorrow? They’ll likely choose the same side again. Why? Because it worked last time. Because they expect the other to do it. Because… well, why fix what isn’t broken?  

  *(Pause, turn to couple)*  

  Sarah and Ben, you met in a graduate seminar dissecting exactly this idea: how shared expectations and repeated success turn a simple solution into a **convention**. A ‘regularity in behavior’ that just… sticks. Because it serves everyone involved. Because it’s self-reinforcing.  

  *(To the room)*  

  To their colleagues: Yes, they’re describing their marriage in the terms of David Lewis’s *Convention*. To our family: Don’t panic. They’re not saying their love is ‘random.’ They’re saying something far more profound about **choice** and **commitment**.  

  *(Lean in, conversational)*  

  The beautiful twist Sarah and Ben found is this: Lewis taught us that conventions solve coordination problems where *multiple solutions could have worked equally well*. The specific solution isn’t ‘fated.’ It’s not written in the stars. **It’s built in the doing.** What makes it powerful isn’t that it was the *only* possible path, but that it’s the path *they keep choosing together*.  

  Think about it: On that narrow path, left works. Right works. What *doesn’t* work is standing still, or veering unpredictably. What *does* work is paying attention, responding, and moving forward in sync.  

  *(Shift tone slightly, more intimate)*  

  Sarah and Ben didn’t bump into each other once and call it destiny. They built a **shared history of successful coordination**. Every shared joke understood, every quiet moment of support, every tough conversation navigated… each one was a moment where they chose the same ‘side of the path.’ They created expectations of kindness, respect, and delight in each other’s minds. And crucially—they *renewed* those expectations. Every day.  

  That’s why their inside joke is so meaningful. Their love isn’t ‘arbitrary’ like a coin toss. It’s ‘arbitrary’ like Shakespeare choosing *this* word instead of *that* one to write a sonnet. The specific choice might not be inevitable, but the *beauty* and the *meaning* come from the commitment to the choice itself, and the world it builds.  

  *(Raise glass higher, voice warm and strong)*  

  So, here’s to Sarah and Ben—masters of their own convention.  
  To the ‘regularity’ they’ve nurtured: a rhythm of mutual understanding, fierce support, and joy.  
  To the ‘precedent’ they set every single day: choosing each other, again and again.  
  To the ‘common knowledge’ they’ve created: that in this room, among all these people who love them, **we all know** this is right. This works. This is worth celebrating.  

  Their convention isn’t cold. It’s alive. It’s the warm, humming engine of a partnership built on attention, adaptation, and the sheer will to say: *‘This. Us. Again.’*  

  So, let’s raise our glasses:  
  To Sarah and Ben—may your coordination always be in equilibrium, your expectations always be met with kindness, and your shared path always be the one you choose… together. Cheers!"  

  ---

  **Why this works:**  

  1.  **Accessible Entry Point:** The sidewalk analogy is universal. It lets non-academics grasp "coordination equilibrium" intuitively *before* the term is used.  
  2.  **Reframes "Arbitrariness":** By comparing it to Shakespeare's word choice, it transforms "arbitrary" from "random" to "deliberate artistry." The salad fork/fish fork analogy (implied) also helps—arbitrary customs become meaningful through shared practice.  
  3.  **Theory as Sentiment:** The toast *derives* its warmth *from* the theory. The emphasis on **renewal** ("choosing again"), **shared history**, **mutual responsiveness**, and **building meaning** through practice *is* the romantic core. "This. Us. Again." is the Lewisian heart made poetic.  
  4.  **Dual-Payoff Moments:**  
      *   *"They’re not saying their love is ‘random.’ They’re saying something far more profound about **choice** and **commitment**."* (Family: relieved understanding. Academics: Nods at precise distinction).  
      *   *"What makes it powerful isn’t that it was the *only* possible path, but that it’s the path *they keep choosing together*."* (Universal "Aha!", academic precision).  
      *   *"Every shared joke... each one was a moment where they chose the same ‘side of the path.’"* (Family: Sweet imagery. Academics: Sees "ratification event").  
      *   *The Final Toast Lines:* "Regularity" (Lewis term), "Precedent" (Lewis concept), "Common knowledge" (Key Lewis term) – used in an emotionally resonant list everyone cheers to.  
  5.  **The Heckle-Proof Line:** *"Their love isn’t ‘arbitrary’ like a coin toss. It’s ‘arbitrary’ like Shakespeare choosing *this* word..."* directly addresses the couple's own language and reframes it beautifully. They won't heckle; they'll beam.  
  6.  **Common Knowledge Climax:** *"**we all know** this is right."* This is the golden moment. Academics hear the formal Lewisian concept ("common knowledge" of their love's rightness). Family hears a simple, powerful statement of shared joy and support. Both sides feel it deeply.  

  **Delivery Tip:** Pause slightly before "common knowledge" in the final lines for emphasis. Let the "we all know" land with a smile that includes the whole room. Your genuine affection for them will bridge any remaining gaps. Good luck! They'll love it.
