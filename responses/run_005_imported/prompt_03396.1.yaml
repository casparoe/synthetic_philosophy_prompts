answer: |-
  ## The Unknowing Sea

  The *Silver Shoal* rocked gently in the predawn grey, the only sound the slap of waves against her hull and the distant cry of a gull. Aboard, the four men of the syndicate moved with the quiet efficiency of long practice: Halvard, the grizzled captain with eyes like flint; Finn, whose wiry frame belied surprising strength; Kael, young and restless; and Silas, solid and silent as bedrock. Their arrangement was simple, ancient, and depended entirely on the capricious sea: they shared the catch equally. Not by weight after the haul, but by pooling the entire day’s uncertain bounty and dividing it four ways. In a world where one net could bulge with silver herring while another dragged up only kelp, it was the only way to ensure no man starved because of a single unlucky cast. It demanded trust, forged in salt spray and shared hardship. It demanded *not knowing* until the nets were emptied back in port.

  Kael brought the sonar unit aboard one Tuesday. It wasn’t large – a compact, waterproof box with a small screen and a transducer cable. "Found it cheap," he mumbled to Halvard, avoiding the older man’s gaze. "Old Jonas was upgrading. Thought it might… help. See where the fish *are*, maybe avoid the barren patches." His reasoning was pure Good: *Free information before acting. Why wouldn’t you look?* Knowing a patch was barren meant not wasting time and fuel dragging an empty net. Knowing where the fish were thick meant maximizing the haul for everyone. Individually, it was impeccable logic.

  Halvard grunted, his face unreadable. "Seems like cheatin' the sea, lad. But…" He ran a calloused hand over the smooth plastic. "Can't argue with knowing, I suppose. If it works." His own reasoning clicked silently: *If Kael uses it and finds the fish while the rest of us waste time… he gets the same share as us for less effort? Or worse, if he finds a motherlode solely for his net… but the share system forces him to pool it. Still… knowing where *not* to go saves my energy, my nets. Individually rational.*

  Finn watched, his sharp eyes calculating. He saw Halvard’s reluctant acceptance and Kael’s eager fumbling with the device. *If Halvard and Kael start knowing where the fish are, and Silas and I don’t… we become the fools dragging empty nets, subsidizing *their* good luck with our wasted effort. Even with pooling, my sweat is worth more if I’m fishing fertile ground too. I need that knowledge just to keep pace.* Silas said nothing, but his knuckles whitened slightly on the rail. His thoughts were simpler, colder: *If they know, and I don’t, I lose. I need to know.*

  The first day Kael used the sonar was revelatory. He pointed them away from a stretch of water Finn swore held promise. "Nothing but sand down there, Finn," Kael announced, tapping the glowing green screen. They moved. Halvard’s net, guided by Kael’s readings near a submerged ridge, came up heavy. Finn’s, in an adjacent spot Kael deemed "promising, maybe," was mediocre. Silas’s was poor. Back in port, the glittering pile of herring was divided equally. Finn stared at his quarter-share, then at the significantly larger portion Halvard had pulled from the water. *My share is the same, but I worked harder, burned more fuel chasing ghosts Kael *knew* weren't there. My effort was devalued by his knowledge.* Silas looked at his meager pile, then at the sonar unit sitting on the deck. His face was stone.

  The next trip, Finn "borrowed" Kael’s unit for ten minutes before casting his net. Halvard, seeing this, insisted on a turn too. Silas watched, then wordlessly held out his hand when Halvard was done. The shared ritual of blind casting was gone. Now, each man scanned the screen before choosing his spot, seeking the optimal patch for *his* net, knowing the catch would be pooled. The sonar didn’t lie. They found fish more consistently, avoiding barren wastes. The *total* catch, week by week, began to rise slightly. Good’s theorem held: individually, each was better off for consulting the free evidence. They wasted less time, caught more fish per hour worked.

  But the syndicate began to fray.

  The problem wasn’t malice, but the evaporation of shared uncertainty. Previously, a poor haul for Silas could be bad luck, a shared burden. Now, when Silas dragged up a light net after the sonar showed a modest school, it felt like *his* failure, *his* poor positioning. Halvard’s larger haul wasn’t luck, but proof of his superior skill in interpreting the flickering screen. The equal share no longer felt like mutual insurance against misfortune; it felt like Silas was being carried, his smaller contribution subsidized. When Kael hit a massive school purely because he’d gambled on a deeper channel the sonar hinted at, his triumphant yell grated on the others. His quarter-share of *that* haul was enormous, while Finn, who’d fished a decent but unspectacular patch nearby, felt cheated. *My patch was fine, but his was spectacular because he took a risk based on the data. Why should I get less than him when we both used the tool? Why should my decent catch subsidize his jackpot?*

  The resentment wasn't spoken aloud, but it seeped into the boat like cold seawater. Conversations grew terse. The easy camaraderie during hauling vanished, replaced by focused efficiency and sidelong glances at the sonar screen. The pool, the very heart of their arrangement, started to feel unjust. It no longer pooled *risk*; it pooled *outcomes* derived from individual decisions made with near-perfect information. Why share equally when the contributions were demonstrably unequal, traceable directly to choices informed by the sonar?

  One blustery morning, Finn broke. After Silas pulled another modest net from a sonar-confirmed "medium-density" zone, Finn snapped. "Enough! This charade! We're not pooling ignorance anymore, Halvard. We're pooling skill, or luck with a damned machine. I pulled twice what Silas did today. Why does he get a quarter of mine?"

  Silas flinched but didn’t look up, methodically coiling his rope. "The sonar said it was medium. I fished it. You fished the hot spot Kael found. That’s your skill, or his. Not my fault."

  "Exactly!" Finn jabbed a finger at the sonar. "We *know* now! We know who caught what, where, and why! This," he gestured wildly at the pile of fish, "this sharing made sense when the sea was a mystery. It doesn't when we’ve got a window into its belly!"

  Halvard sighed, the sound heavy with the death of something old. He looked at Kael, who was staring at his boots, and then at Silas, who finally met his gaze, weary resignation in his eyes. Halvard saw the logic, the inexorable pull of individual rationality laid bare by Hirshleifer. Each had rationally sought the information. Each was, individually, catching more fish for less wasted effort because of it. But the glue that held their collective bargain together – the shared, inescapable *unknowing* – was dissolved.

  "You're right, Finn," Halvard said, his voice rough. "The sea’s not a mystery to us like it was. The arrangement… it was built for that mystery." He looked at the sonar, its green glow reflecting in his flinty eyes. "We keep using it. But we split the catch by the net. Each man takes his own haul."

  Kael nodded, relief warring with guilt on his face. Silas just gave a single, slow nod. It was the only rational response. The insurance against individual misfortune, the beautiful, fragile equilibrium born of shared uncertainty, was gone. Replaced by the cold efficiency of perfect, individual knowledge.

  The *Silver Shoal* still sailed. The catches were often larger, more consistent. But the work was lonelier. Halvard fished cautiously near known reefs. Finn chased the strongest sonar signatures relentlessly. Kael experimented with deep drops, seeking untapped bonanzas. Silas stuck to reliable, moderate grounds, his catches smaller but steady, his isolation profound. They shared fuel costs. They helped with tangled nets. But the deep, unspoken trust, the shared vulnerability that had bound them against the vast indifference of the sea, was fractured.

  Back in port, they divided the fish by the pile beside each man’s net. No words were needed. The sonar unit sat on the deck, its screen dark now, a silent monument to the knowledge that had set them adrift, each in his own small boat, on the suddenly knowable sea. They were each, rationally, better off than they might have been blind. But the harbor they’d built together, the harbor of shared ignorance, was irrevocably behind them.
