answer: |-
  Let's dissect both your queries with philosophical precision, drawing directly from Goodman's *Languages of Art* and contrasting with Lessing's view.

  **Part 1: Goodman's Argument for the Aesthetic Relevance of History (vs. Lessing)**

  Goodman's core argument hinges on the **ontology of the work** and **contingent indistinguishability**. Here are the steps:

  1.  **Definition of Autographic Art:** An art form is autographic if and only if even the most exact duplication of it produced otherwise than as prescribed does not thereby count as genuine. The identity of the work is tied inextricably to its history of production – the specific act(s) of its creation by the specific artist(s) at a specific time/place.
  2.  **The Forger's Product is a Different Work:** A perfect forgery of Rembrandt's *Lucretia*, even if atom-for-atom identical, is *not* Rembrandt's *Lucretia*. It is a distinct work – "Forgery of Rembrandt's *Lucretia*" or "Smith's *Lucretia* (in the style of Rembrandt)". Its different history of production makes it ontologically different.
  3.  **Indistinguishability is Ephemeral & Contingent:** Goodman readily admits a perfect forgery might be *currently* indistinguishable from the original. His crucial point is that this indistinguishability is **not a necessary or permanent property**. It depends entirely on our *current* perceptual capacities, scientific tools, and knowledge.
  4.  **The Possibility Principle:** Aesthetic properties relevant to a work include properties that *might be discovered or become relevant in the future*. What matters is not just what we *can* see *now*, but what we *might* see *later*.
  5.  **The Aesthetic Relevance of Authenticity:** Because the original and the forgery are different works (Step 2), and because they *might* become discriminable in the future (Step 3 & 4), **knowing which is which *now* matters aesthetically.** When we look at the genuine Rembrandt, we are engaging with the work *as produced by Rembrandt*, with all the potential connections to his life, era, technique, and artistic development that future discoveries might illuminate. Looking at the forgery, we are engaging with a different work, created under different circumstances, even if we currently see the same visual array. The *knowledge* of its origin fundamentally alters the context of our aesthetic experience and the potential properties we ascribe to it. The "Rembrandt" we perceive in the forgery is illusory; we are really perceiving the forger's skill *at mimicking Rembrandt*.
  6.  **The Case Against Permanent Undetectability:** Goodman argues the *logical possibility* of future discriminability is sufficient. We can never guarantee a forgery is *permanently* undetectable. New analytical techniques, historical discoveries, or even shifts in critical perception could always reveal differences. Therefore, the *contingency* of indistinguishability makes the history of production aesthetically relevant *now*.

  **Goodman vs. Lessing:**

  *   **Lessing (Focus on Credit):** Alfred Lessing ("What is Wrong with a Forgery?") argues the *only* wrong in forgery is the deception regarding **authorship and achievement**. The forger steals credit that rightfully belongs to the original artist. The *object itself* has the same aesthetic properties whether it's an original or a perfect forgery. Its aesthetic value is intrinsic and independent of its history. The harm is ethical (fraud) and economic (misrepresentation of value), but *not* aesthetic. The object doesn't become aesthetically worse upon discovery; we just realize we were wrong about who made it.
  *   **Goodman's Rebuttal:** Goodman fundamentally disagrees with Lessing's object-centric view. For Goodman:
      *   The forgery is **not the same work** as the original (Step 2). Therefore, they *cannot* have identical aesthetic properties *as works of art*, even if they share identical physical properties *at this moment*.
      *   The aesthetic experience is **context-dependent**. Knowing you are looking at a genuine Rembrandt vs. a perfect fake changes the *meaning* of what you see and the *artistic achievement* you are appreciating (Rembrandt's genius vs. the forger's mimicry).
      *   The **potential for future discrimination** (Step 3,4,5) means the works are *in principle* different, and this difference is aesthetically relevant *now* because it shapes our understanding of the work's genesis and potential.

  **Goodman's key insight:** Authenticity isn't just a label; it's part of the work's identity and the framework through which we understand and value it aesthetically. History matters because it defines *what the work is*.

  **Part 2: Textual "Forgery" in an Allographic Art (Novels)**

  Goodman's scheme creates a stark contrast:

  1.  **Novel as Allographic:** A novel's identity is defined solely by its **compliance with a notational scheme** (the sequence of letters/words/punctuation). Any inscription (manuscript, printed book, ebook, correctly copied handwritten note) that complies with this scheme is a genuine instance of *Moby Dick*. History of production is irrelevant to the *work's identity*. Melville's manuscript, a pirated edition, and a perfect typeset copy are all equally *Moby Dick*.
  2.  **Implication for Forgery:** Since the work is the *text structure*, not the physical object or its history, **there is no "forgery of the work itself" in Goodman's strict autographic sense.** You cannot forge *Moby Dick*; you can only produce another genuine copy or produce a *different text*.

  **Analyzing the Three Offenses through Goodman's Lens:**

  *   **Fabricated Manuscript of a Genuine Novel (e.g., a fake Hemingway manuscript of *The Sun Also Rises*):**
      *   **Goodman:** This is **not** a forgery *of the work* (the novel). The *work* is the text structure. If the manuscript contains the correct text, it *is* a genuine instance of the work, regardless of when/where/by whom it was written. However, it **is a forgery *of an artifact***. It falsely claims a specific history of production (written by Hemingway in the 1920s). The wrong is **fraudulent misrepresentation of provenance**, not the creation of a fake *work*. It deceives about the artifact's history and potentially its market value, but not about the identity of the *literary work* it instantiates.
  *   **Invented Story Falsely Attributed to a Dead Author (e.g., a newly written story passed off as a lost work by Jane Austen):**
      *   **Goodman:** This is **not** a forgery of an *existing* Austen work. It is the **creation of a *new* literary work** (the text structure of the invented story) coupled with **fraudulent misattribution of authorship**. The wrong is entirely about **false authorship claim**, not about faking an existing work. The new text is a genuine instance of *itself*, but falsely presented as an instance of an Austen work. It exploits the author's name/reputation.
  *   **Plagiarism (e.g., copying passages verbatim into your own novel without credit):**
      *   **Goodman:** This involves **copying the text structure** of another work (or part of it). The plagiarist produces genuine instances of the *copied text segments* (since they comply with the notational scheme), but **falsely claims authorship** for those segments within the context of their *new* work. The wrong is **misappropriation of authorship/credit** and **failure to acknowledge the source**, not creating a forgery *of the original work*. The original work remains untouched; the plagiarist creates a derivative work with fraudulent authorship claims over parts of it.

  **Goodman's Conclusion on the Three Offenses:** From Goodman's autographic/allographic distinction, **these three offenses do *not* share the *same kind* of wrong as autographic forgery.** Autographic forgery (faking a painting) creates a fake *work* by violating its ontological dependence on history. The textual offenses involve:
      *   Fraudulent misrepresentation of an artifact's history (fake manuscript).
      *   Fraudulent misattribution of authorship for a *new* work (invented story).
      *   Misappropriation of authorship/credit for copied text within a new work (plagiarism).
  The common thread Goodman *might* acknowledge is **deception about authorship/provenance**, but the *ontological status* of the "faked" element (the work vs. the artifact vs. the authorship claim) is fundamentally different in each case, and crucially, *none* involve forging an *allographic work itself*.

  **Analyzing the Three Offenses through Lessing's Lens:**

  *   **Lessing (Focus on Credit):** Lessing's view unifies these offenses much more readily. The core wrong in *all* cases is the **theft or misappropriation of artistic credit/achievement**:
      *   **Fake Manuscript:** The forger steals credit for the *achievement of creating the artifact* (the historical manuscript) and deceives about its connection to the author, potentially inflating its value based on that false provenance.
      *   **Invented Story:** The perpetrator steals credit for the *achievement of creating the literary work* by falsely attributing it to the dead author, exploiting their reputation and denying the actual creator credit.
      *   **Plagiarism:** The plagiarist steals credit for the *achievement of creating the specific text* they copied, denying the original author credit for that portion of the work.
  *   **Lessing's Conclusion:** For Lessing, **these three offenses *do* share a single kind of wrong: the fraudulent misappropriation of credit for artistic achievement.** The specific mechanism (faking an artifact, faking a whole work, copying parts) differs, but the core ethical violation – lying about who deserves credit for the creation – is the same. This contrasts sharply with autographic forgery, where Lessing *also* sees the wrong as misappropriation of credit (for the original artist's achievement), but Goodman sees an additional aesthetic/ontological wrong.

  **Conclusion for Your Novel:**

  *   **Goodman's Line:** The autographic/allographic distinction *does* show that textual "forgery" offenses are fundamentally different in kind from autographic forgery. Textual offenses revolve around fraud concerning authorship, provenance, or credit, but *not* about creating a fake instance of the *work itself* (which is impossible for allographic arts). The three textual offenses share elements of deception but target different things (artifact history, authorship of a new work, credit for copied text).
  *   **Lessing's View:** Lessing *unifies* the wrongs across autographic forgery and the textual offenses. The common core is the **theft of credit** for artistic achievement, regardless of the art form. The three textual offenses are simply different methods of achieving this theft.

  This tension – between the ontological distinction (Goodman) and the credit-based unity (Lessing) – is fertile ground for your novel. Your forger protagonist, operating in the autographic realm (painting), embodies Goodman's world where the history *is* the work. Yet, the textual elements of the story (diaries, provenance documents, perhaps even the novel you're writing itself!) exist in the allographic realm, where identity lies in the structure, not the history. Exploring how your character navigates, exploits, or is trapped by these differing ontologies of art could be profoundly insightful. Does he understand the philosophical gulf? Does he see all deception as simply stealing credit (Lessing), or does he intuitively grasp the deeper ontological violation (Goodman) inherent in his own forgeries? The contrast highlights the unique burden and nature of the autographic forger's crime.
