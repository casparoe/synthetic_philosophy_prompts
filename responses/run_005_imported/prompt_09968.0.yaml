answer: |-
  ## The Anti-All-In Best Man Speech

  (Lifts glass, takes a deep breath, maybe a *slightly* nervous glance at Theo)

  Okay. Deep breaths. Hi everyone. For those who don’t know me, I’m [Your Name], Theo’s friend, and apparently the guy he trusts not to completely embarrass him up here. No pressure, right? Especially since Theo… well, Theo approaches life a little differently. You see, before he was crunching numbers as a quant, Theo was crunching *probabilities* at poker tables. And he didn’t just play cards; he lived by this… thing. This philosophy called the Kelly Criterion.

  (Lean in conspiratorially, especially towards the non-poker half)

  Now, for our families, imagine Kelly like… the perfect recipe for baking bread. You don’t dump *all* your flour into one risky loaf hoping for a miracle sourdough. You use a *calculated fraction* each time. Why? Because if one loaf flops, you’ve still got flour left. And over time, baking consistently like that? That’s how you build a bakery empire, not a pile of burnt crumbs.

  (To the poker/finance side)

  For the rest of you nodding knowingly, Theo didn’t just *use* Kelly; he *breathed* it. It’s not about the biggest potential win on a single hand. It’s about maximizing your *growth rate* over the long run. You size your bet – *always* a fraction of your bankroll, *never* your whole stack – based on your edge. Shove everything on a "sure thing"? Theo would shudder. Why? Because even the best edge has variance. Over enough hands, enough time, the guy who goes "all-in" eventually busts. Kelly is the math of *staying in the game forever*. It’s about discipline, position-sizing, and respecting the long run.

  (Shift focus to Theo and his partner)

  So, why am I telling you this at Theo’s *wedding*? Because Theo pulled me aside, dead serious – which for Theo usually involves explaining ergodicity or why time-averages aren’t ensemble averages… (pause for Theo’s knowing groan/laugh) – and said, "Please, for the love of all that is rational, don’t give me that 'Love is the one bet you go all-in on' garbage."

  (Beat. Look at Theo)

  And he’s absolutely right. Because Theo’s confidence in marrying [Partner's Name] isn’t some reckless, heart-over-the-cliff, push-all-the-chips-in moment. That’s not how he thinks. That’s the *opposite* of how he’s built his life.

  (Smile warmly at the couple)

  Theo sees marrying [Partner's Name] as the ultimate validation of the Kelly mindset. This isn't betting his whole stack on one hand. **This is making the single most important, long-term position-sizing decision of his life.**

  He’s looked at the "edge" – the incredible connection, the shared values, the laughter that fills a room, the way [Partner's Name] somehow understands both his poker stories *and* his quant spreadsheets… and he’s calculated that committing *everything he is and will be* to this partnership isn't reckless. It’s *optimal*. It’s the fraction that maximizes their *joint* growth rate over the decades ahead.

  This marriage? It’s not a single bet. It’s the *entire bankroll*. It’s the foundation from which every future decision – every adventure, every challenge, every quiet Tuesday night – will be sized. It’s the structure that ensures they weather the inevitable variance life throws at them, together, without ever risking ruin. It’s the disciplined, calculated commitment to building something that grows, steadily and beautifully, forever.

  (To the poker/finance folks)

  And yes, Theo, I know what you're thinking. "But what about Samuelson?" For the uninitiated, the legendary economist Paul Samuelson apparently hated Kelly so much, he wrote an entire academic paper trashing it… using *only* one-syllable words. "No, you are wrong. It is bad. Think on it." (Pause for chuckles) Point is, Theo loves this stuff enough to argue with dead economists. But even Samuelson, I suspect, would look at Theo and [Partner's Name] and admit: *This* position? This fraction? It’s not just sound math. It’s pure, brilliant, geometric growth.

  (Raise glass)

  So, Theo and [Partner's Name], here’s to the ultimate Kelly bet. To sizing your commitment perfectly for the infinite game. To building a wealth of love, laughter, and partnership that compounds beautifully over every single day of your long, incredible run together. May your growth rate be maximized, your variance be manageable, and your bankroll… well, may it be infinitely deep in joy.

  Cheers!

  **Why this works:**

  1.  **Nails the Core Logic:** Explains Kelly simply (fractional betting, avoiding ruin, long-term growth) and directly links it to marriage as a *foundation* for long-term growth, not a single reckless bet.
  2.  **Anti-"All-In":** Explicitly rejects the cliché Theo hates, replacing it with the "optimal position-sizing for the entire bankroll" metaphor.
  3.  **Humor & Accessibility:** Uses the bread analogy for families. Self-deprecating jokes about ergodicity and Theo's seriousness. The Samuelson anecdote is a perfect, quirky insider nod that lands lightly.
  4.  **Respects Theo:** Shows understanding of his core philosophy and validates his perspective. The "position-sizing decision of his life" line is key.
  5.  **Warmth & Romance:** Despite the math, the core message is deeply romantic – commitment as the foundation for enduring growth and partnership ("building something that grows, steadily and beautifully, forever").
  6.  **Structure:** Clear intro, explanation of Kelly, pivot to marriage application, toast. Fits 5 minutes.
  7.  **Landing the Punchline:** The "ultimate Kelly bet" and "sizing your commitment perfectly for the infinite game" lines deliver the reversed "all-in" concept perfectly.

  Good luck! Remember to deliver it with genuine warmth and a smile. Theo (and the poker table half) will love the accuracy, and everyone will feel the love.
