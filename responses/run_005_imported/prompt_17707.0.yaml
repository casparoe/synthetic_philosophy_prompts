prompt: |-
  I host a little philosophy of language podcast, and next week's guest is a philosopher who's spent her career arguing that indicative conditionals dont have truth conditions at all -- she's most known for using the Oswald/Kennedy pair (going back to Adams) to argue indicatives just track conditional credence rather than stating facts. Can you draft me 8-10 interview questions that don't just let her restate the view? I want at least one question on why Lewis's triviality results are supposed to show indicatives have no truth conditions at all rather then just showing Adams' thesis is false (the conclusion a truth-conditional theorist would draw instead), one on the embedding problem -- what a conditional's even doing semantically once you negate it or nest it in the antecedent of another conditional if there's no proposition there to embed -- and one pushing on whether her replacement notion of 'probabilistic validity' really earns the name or just quietly changes the subject. For each of those three, give me a follow-up keyed to whatever answer she's most likely to give.
reasoning: |-
  Okay, the user hosts a philosophy podcast and has an upcoming guest who argues that indicative conditionals lack truth conditions. They want interview questions that go beyond restating her view. Specifically, they need questions on three topics: Lewis's triviality results, the embedding problem, and probabilistic validity. Each needs a follow-up based on likely responses.

  First, I need to recall the core arguments. The guest follows Adams, using the Oswald/Kennedy example to show that conditionals express conditional credence rather than truth conditions. Lewis's triviality results are central here—they suggest that if conditionals had truth conditions, they'd lead to triviality, meaning probabilities couldn't behave as they do. The user wants to challenge why this implies no truth conditions rather than falsifying Adams' thesis. The embedding problem questions how conditionals function in complex sentences without truth conditions. Probabilistic validity needs scrutiny: does it truly replace classical validity or just shift the topic?

  For Lewis's triviality, the main question should force the guest to explain why triviality implies no truth conditions. A truth-conditional theorist might argue that Adams' thesis is false instead. The follow-up could challenge the assumption that probabilities must equal conditional probabilities. If the guest says probabilities must be conditional, the follow-up asks why we should accept that constraint.

  The embedding problem question should ask how conditionals embed without propositions. The likely response involves pragmatic explanations or dynamic semantics. The follow-up should press on whether this approach can handle complex embeddings systematically or if it's ad hoc. For instance, negation of conditionals often feels like negating the consequent, but without truth conditions, that's tricky.

  For probabilistic validity, the question needs to question if it's genuine validity. The guest might say it preserves certainty or probability. The follow-up could ask if this applies to multi-premise arguments where probabilities don't add up, like the lottery paradox. Does probabilistic validity handle such cases, or does it reveal limitations?

  The user also wants 5-7 more questions. These should explore alternatives, test the view with new examples, and connect to broader implications. For example, asking if the view applies to subjunctives, or how it handles conditional probabilities of 0. Also, considering the impact on logic and philosophy of language: does rejecting truth conditions for conditionals lead to more global anti-realism?

  I should ensure questions avoid being leading but push for deeper engagement. Each follow-up anticipates responses to challenge the guest further. Structuring them to build on each other, starting with technical arguments, then applications, alternatives, and broader consequences. The goal is a dynamic interview that reveals the strengths and weaknesses of the position without letting the guest just reiterate their standard points.
answer: |-
  Here are 8 focused interview questions probing the edges of your guest's view, including your three specified areas with tailored follow-ups:

  1.  **The Oswald/Kennedy Challenge:** You famously use the Oswald/Kennedy pair to argue that the acceptability of an indicative conditional tracks conditional probability, not truth conditions. But couldn't a truth-conditional theorist simply bite the bullet here? They might argue that *both* "If Oswald didn't kill Kennedy, someone else did" and "If Oswald didn't kill Kennedy, no one else did" are *technically true* (given Oswald did it), but that we find the latter pragmatically defective or unassertable for other reasons. What, beyond intuition about assertability, *forces* us to abandon truth conditions entirely in this case?
      *   *Likely Response:* Emphasizes the *strength* of the intuition and the lack of plausible pragmatic story to explain the radical difference in acceptability *solely* based on known falsity of antecedent.
      *   *Follow-Up:* Suppose we grant the intuition is strong. Couldn't a sophisticated contextualist or dynamic semantic truth-conditional theory *still* capture this? For example, by making the truth conditions themselves sensitive to the epistemic state in a way that renders the "no one else did" conditional false *relative to our knowledge*? Isn't abandoning truth conditions an overreaction?

  2.  **Lewis's Triviality & The Core Argument:** Lewis's triviality results are central to your argument against truth conditions. But a truth-conditional theorist like Dorothy Edgington or (later) Robert Stalnaker might respond: "Lewis didn't show conditionals *can't* have truth conditions; he showed that Adams' Thesis (P(If A, B) = P(B|A)) *can't hold universally* if conditionals have truth conditions *and* we assume standard probability calculus. So Adams' Thesis is false. Why does this entail conditionals *lack* truth conditions altogether, rather than just requiring a more complex relationship between their probability and their truth conditions?"
      *   *Likely Response:* Argues that Adams' Thesis captures the *core, undeniable datum* about how we *use* and *evaluate* conditionals. Any truth-conditional theory that violates it fundamentally misdescribes our practice. The triviality proofs show that preserving this core datum *requires* abandoning truth conditions.
      *   *Follow-Up:** That assumes Adams' Thesis is non-negotiable. But isn't the truth-conditional theorist precisely *challenging* that thesis? They might point to embeddings or complex arguments where treating the conditional as having a probability *equal* to the conditional probability seems to lead to trouble (e.g., in certain nested cases or with conditional excluded middle). Isn't the insistence that P(If A, B) *must* equal P(B|A) just begging the question against the truth-conditionalist?

  3.  **The Embedding Problem - Semantics in the Void:** If indicative conditionals don't express propositions, what happens semantically when we embed them? Take negation: What does "It is not the case that if it rains, the match will be canceled" mean? Or nesting: "If (if the supply lines are cut, the city will fall), then we must reinforce the depot." If there's no proposition denoted by the embedded conditional, what are we negating or using as the antecedent? What *semantic value* does the embedded conditional contribute?
      *   *Likely Response:* Acknowledges the challenge. Likely suggests a pragmatic story (negating a conditional often implicates the antecedent is true and consequent false) or invokes a dynamic semantic framework where conditionals update contexts or propose tests, and embeddings involve complex operations on these contexts/tests. May downplay the frequency or naturalness of deep embeddings.
      *   *Follow-Up:** Let's focus on negation. Your pragmatic story might explain why "It's not true that if A, B" often *sounds like* "A and not-B". But doesn't this collapse into precisely the truth-conditional account you reject (where ~(A→B) ≡ A∧~B)? And if it doesn't always collapse – if there are contexts where negating a conditional genuinely *isn't* asserting the antecedent and denying the consequent – can your theory provide a *systematic, compositional* semantics predicting *when* it means what? Or is it fundamentally non-compositional?

  4.  **Probabilistic Validity - Earning the Name?** You propose replacing classical validity with "probabilistic validity" (an argument is p-valid if it's impossible for the premises to be highly probable while the conclusion is improbable) for arguments involving conditionals. But critics like Hartry Field argue this simply *changes the subject* from truth-preservation to probability-preservation. Why should we call this "validity"? Isn't it abandoning the core logical notion of *necessary truth preservation* and replacing it with something else (highly reliable inference)?
      *   *Likely Response:* Argues that in domains without truth conditions (like indicatives), probability-preservation *is* the relevant notion of good inference. Classical validity is inapplicable where there's no truth to preserve. P-validity captures the *rational force* of inferences involving conditionals in our reasoning.
      *   *Follow-Up:** Consider multi-premise p-valid arguments. The Lottery Paradox shows that p-validity doesn't guarantee that high probability premises entail a highly probable conclusion if many premises are involved. If I accept premises P1, P2, ..., Pn (each highly probable, but not certain), and the argument {P1, P2, ..., Pn} ∴ C is p-valid, C might *still* be highly improbable. Doesn't this show p-validity is *not* sufficient for rational confidence preservation in complex reasoning, undermining its claim to be the *correct* notion of validity for uncertain domains? How does your theory handle multi-premise inference?

  5.  **Zero-Probability Antecedents:** How does your theory handle conditionals with antecedents to which we assign zero probability? For example, "If 2+2=5, then logic is broken." According to Adams' Thesis, P(B|A) is undefined when P(A)=0. Yet, such conditionals seem perfectly intelligible and often assertable. Does this pose a problem? What does the acceptability of such conditionals depend on, if not conditional probability?
      *   *(Potential Follow-Up if needed: If she appeals to subjunctive conditionals or "closeness," ask how this fits with a unified account of indicative conditionals.)*

  6.  **The Scope of the View:** Does your rejection of truth conditions apply *only* to standard indicative conditionals, or does it extend to other types? For instance, what about future-directed indicatives ("If it rains tomorrow..."), subjunctive/counterfactual conditionals, or even logical conditionals like "If it's a triangle, it has three sides"? If there's a difference, where exactly do you draw the line and why?

  7.  **Alternatives and Burden of Proof:** Defenders of truth-conditional accounts (Stalnaker, Jackson, more recent epistemic modals/dynamic approaches) argue their theories can capture the probabilistic data *and* handle embeddings compositionally within a broader semantic framework. Given the significant theoretical cost of abandoning truth conditions and compositionality for a core grammatical construction, why is your non-propositional view *preferable* to these sophisticated truth-conditional alternatives? What can your view explain that they fundamentally *cannot*?

  8.  **Beyond Conditionals - A Broader Anti-Realism?** If indicative conditionals, which are grammatically and seemingly logically integrated, lack truth conditions, does this point towards a more general anti-realism or non-factualism about other areas of language? Does it undermine the project of giving truth-conditional semantics more broadly? Or is there something uniquely problematic about conditionals?

  **Key to the Three Requested Areas & Follow-Ups:**

  *   **Lewis's Triviality (Q2 & F/U):** Targets the *inference* from "Adams' Thesis conflicts with truth-conditions + probability" to "Therefore, no truth conditions." Follow-up challenges the sacrosanct status of Adams' Thesis itself.
  *   **Embedding Problem (Q3 & F/U):** Forces engagement with compositionality. Follow-up specifically hones in on negation, the most basic embedding operator, pushing whether the explanation avoids collapsing into truth-conditional equivalence or remains ad-hoc.
  *   **Probabilistic Validity (Q4 & F/U):** Challenges whether p-validity is genuinely *validity*. Follow-up uses the Lottery Paradox to expose a weakness in p-validity's ability to secure rational confidence in multi-premise inferences, questioning its adequacy as a *replacement* for classical validity.

  These questions aim to push beyond exposition into the justifications, implications, and potential vulnerabilities of the position, forcing the guest to defend the *necessity* of her view against alternatives and its *coherence* in handling core semantic phenomena like embedding. Good luck with the interview!
