  The strongest evidence against supervaluationism is the Stoic commitment to bivalence. Cicero mentions Chrysippus's silence as a response to the slippery slope, not a denial of truth values. Also, Chrysippus's logical innovations, like conditional statements, assume bivalence. If he allowed truth gaps, that would contradict his other positions. So maybe his silence is epistemic: there is a cutoff, but we can't know it, so we shouldn't assent.

  But the counterargument is that the impossibility of kataleptic impressions in borderline cases suggests these propositions aren't knowable because they lack a clear truth value. The sage's silence isn't just about uncertainty; it's about the nature of vagueness making assent impossible. That aligns more with supervaluationism's truth gaps. The textual evidence from Sextus about vague predicates not being "apprehensive" supports this.

