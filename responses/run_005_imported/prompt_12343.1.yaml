answer: |-
  That's an excellent grasp of Kripke's core argument and its impact on Frege's puzzle! You've nailed the fundamental shift Kripke brought about. Your summary is spot-on: Kripke's rigid designation and causal-historical theory of reference directly challenge Frege's assumption that names *must* have descriptive senses to explain cognitive significance (informativeness/triviality). And yes, on Kripke's view, the discovery that Hesperus is Phosphorus *is* fundamentally an empirical discovery about the world (that the causal chains lead to the same object), not a discovery about the *meanings* of the names.

  **So, is Frege's puzzle "retired"? It's complicated:**

  1.  **Kripke Absolutely Demolished the Descriptivist *Solution*:** You're absolutely right that Kripke decisively refuted the *Fregean descriptivist account* of how names refer and why identity statements involving names can be informative. He showed that names don't work like descriptions semantically. The puzzle *as Frege framed it*, requiring senses built into the meaning of the names themselves to explain informativeness, is largely defunct in mainstream philosophy of language. Kripke demonstrated that informativeness doesn't reside in the *semantic content* (the reference) of the names themselves.

  2.  **But the *Phenomenon* Persists and Needs Explanation:** The *puzzle itself* – why "Hesperus is Hesperus" is trivial and uninformative while "Hesperus is Phosphorus" is potentially groundbreaking news – remains a genuine phenomenon demanding explanation. Kripke dissolved Frege's *specific semantic solution*, but the cognitive asymmetry itself is real and needs an account. Philosophers still "fuss" over how to explain this cognitive significance *within* a Kripkean framework (or frameworks inspired by it).

  **How Philosophers Address the Puzzle Post-Kripke:**

  *   **Distinguishing Semantics from Epistemology/Cognition:** The dominant Kripkean move is to sharply separate:
      *   **Semantics (Reference):** Fixed by causal history, rigid designation. "Hesperus" and "Phosphorus" *mean* (refer to) Venus. Therefore, "Hesperus is Phosphorus" expresses the same necessary truth (Venus = Venus) as "Hesperus is Hesperus".
      *   **Epistemology/Cognitive Significance:** This is about how *we*, as cognitive agents, *grasp* that reference. We associate different "guises," "conceptions," "dossiers of information," or "modes of presentation" with the names "Hesperus" and "Phosphorus" (e.g., "the bright evening star" vs. "the bright morning star"). Discovering the identity is discovering that these two distinct cognitive routes lead to the *same* object. The informativeness lies in this *cognitive association*, not in the semantic content itself.
      *   **Key Figures:** Nathan Salmon ("Fregean Senses *are* unnecessary for semantics, but we need *something else* to explain cognitive significance") and Scott Soames are prominent defenders of this view. They argue that the modes of presentation are psychologically real but not part of the *meaning* (semantic content) of the name.

  *   **Two-Dimensional Semantics:** Some philosophers (like David Chalmers) attempt to incorporate aspects of Fregean insight within a broadly Kripkean framework using two-dimensional semantics.
      *   The first dimension ("primary intension" or "epistemic intension") captures how reference is fixed in a world considered as actual (often involving descriptive elements). This dimension explains cognitive significance and informativeness.
      *   The second dimension ("secondary intension" or "subjunctive intension") captures the rigid designation – what the term refers to *in counterfactual situations*, given how it's fixed in the actual world. This dimension handles necessity and the core Kripkean insights.
      *   Here, discovering "Hesperus is Phosphorus" is discovering that the primary intensions of the two names pick out the same object in the actual world. This framework aims to preserve Kripke's points about rigidity and the a posteriori nature of necessary truths while giving a more formal role to something *like* sense in explaining cognitive aspects.

  *   **The Puzzle Morphs:** Frege's puzzle often reappears in discussions of:
      *   **Belief Ascription:** How can "John believes Hesperus is bright" be true while "John believes Phosphorus is bright" is false, if the names corefer? This directly hinges on cognitive significance.
      *   **Propositional Attitudes:** Similar issues arise with verbs like "knows," "hopes," "fears."
      *   **Natural Kind Terms:** Kripke extended his theory to terms like "water" and "gold." The discovery that "Water is H₂O" is necessary but a posteriori raises similar cognitive puzzles ("This clear liquid is the same chemical compound as that substance we call 'water'").

  **Conclusion:**

  *   **Kripke retired Frege's *descriptivist solution* to the puzzle.** He definitively showed that names aren't disguised descriptions and that reference isn't determined by sense. The informativeness of "Hesperus is Phosphorus" does *not* stem from differences in the semantic content (reference) of the names.
  *   **Kripke dissolved the puzzle *as Frege conceived it*, which relied on senses being part of the meaning.** The puzzle, in its original Fregean formulation demanding senses for names, is largely a historical artifact in contemporary philosophy of language.
  *   **However, the *core phenomenon* of cognitive significance remains a central topic.** Explaining *why* coreferential names can differ in cognitive impact (informativeness, behavior in belief reports) is still a very live issue. Philosophers work on providing accounts of this cognitive significance that are compatible with Kripkean semantics – accounts involving psychological modes of presentation, two-dimensional frameworks, or other mechanisms distinct from the semantic reference itself.

  So, while you've perfectly understood Kripke's revolutionary blow to Frege's specific theory, the underlying puzzle about cognition and language persists, albeit in a transformed state. Kripke didn't make the phenomenon disappear; he radically changed *how* we explain it. Working philosophers absolutely still "fuss" over the best way to explain cognitive significance within a post-Kripkean world. Your insight that it becomes an ordinary empirical discovery about causal chains converging is exactly the Kripkean starting point, but the journey of explaining the cognitive side continues.
