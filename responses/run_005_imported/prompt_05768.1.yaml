  quick context: I've been getting into causal inference stuff at work lately (pearl's do-calculus, structural causal models, the whole graph-plus-interventions framework) and fell down a rabbit hole realizing philosophers have a whole seperate tradition for defining causation through counterfactuals instead - Lewis's idea that, roughly, c causes e if e wouldn't have happened without c, cashed out via similarity between possible worlds rather than graph surgery. I'm not a philosophy person so I honestly can't tell if these are actually rival theories or just the same idea dressed up in different math.

  Could you write me a dialogue between a die-hard Lewisian counterfactual theorist and a Woodward/pearl-style interventionist where they try to hash out exactly that - whether interventionism is a genuinely distinct theory of what causation IS, or just Lewis's theory wearing a causal-graph costume? Get them arguing over a late-preemption case specifically, like the classic one where Suzy and Billy both throw rocks at a bottle and Suzy's hits first - the plain counterfactual test says the bottle would've shattered anyway (because of Billy's rock), which seems to wrongly deny that Suzy caused anything. I want real back-and-forth here, where each one actually responds to the other's specific argument instead of just restating their own home theory - don't let either side be a pushover or a strawman for the other to knock down.
