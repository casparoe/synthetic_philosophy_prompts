prompt: |-
  Quick one for a science piece I'm working on. A small town near me is fighting over PFAS contamination in its water: the state environmental agency wants a panel of toxicologists to set a fixed safety threshold from the risk-assessment numbers and call it done, while residents are pushing for ongoing public meetings so the standard stays open to revision as people report health effects over time - even though most of them admit they can't read a dose-response curve. Something about just locking in the experts' number bugs me, but I can't say why, and I don't want to lazily default to 'public input is always good' if thats not actually a real argument. Who's actually got the better case here?
reasoning: |-
