prompt: |-
  Ok this is a weird one but my philosophy elective has been going through Hobbes's Leviathan and we were only actually assigned the "state of nature" chapters (the nasty brutish and short part, ch. 13) but I got curious and started flipping through earlier parts of the book too, which is how I ended up stuck on this bit from chapter 5 instead of doing my actual homework. My teacher's out this week so I can't ask her, and my mom (who has a philosophy degree from forever ago) just laughed and said "oh boy, good luck" when I showed her, which was not helpful lol.

  Here's the passage (my teacher's version has the spelling modernized a bit so its not just random capital letters everywhere):

  "When a man reasoneth, he does nothing else but conceive a sum total, from addition of parcels; or conceive a remainder, from subtraction of one sum from another: which (if it be done by words) is conceiving of the consequence of the names of all the parts, to the name of the whole; or from the names of the whole and one part, to the name of the other part... In sum, in what matter soever there is place for addition and subtraction, there also is place for reason; and where these have no place, there reason has nothing at all to do... For REASON, in this sense, is nothing but reckoning (that is, adding and subtracting) of the consequences of general names agreed upon for the marking and signifying of our thoughts."

  I think I get the general vibe (thinking = math, but with words instead of numbers?) but I can't figure out the actual mechanics, like what is literally being "added" or "subtracted" when you reason through something that has nothing to do with numbers, and whether "names" means spoken/written words specifically or something more like concepts in your head that words just point to. On top of that, my friend Deja (who's way more into cognitive science than me) took one look at this and said its basically a 300-years-early version of the "language of thought hypothesis," where your brain apparently computes over some inner mental code ("mentalese") that's supposedly not the same thing as English or whatever language you actually speak. Is she right that Hobbes is groping toward the same basic idea, or is that alot more of a stretch than she's making it sound, since Hobbes here seems to be talking about actual public words that people agree on, while I thought the whole point of mentalese is that its NOT a spoken/written language and works underneath one? Can you first help me understand what Hobbes is actually claiming, step by step, and then tell me honestly whether the comparison to that later idea holds up or whether Deja is just pattern-matching two things because they both mention "computing" with symbols?
