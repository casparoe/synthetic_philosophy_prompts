  The key differences here are accessibility and personal engagement. Medical knowledge requires years of study, but ethical reasoning is something everyone can and should engage with. The user's passive reliance might hinder their moral growth. They're not internalizing the principles, just following instructions. That's different from a child who's in the learning phase.

