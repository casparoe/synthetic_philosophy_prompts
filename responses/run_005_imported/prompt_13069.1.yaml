prompt: |-
  I'm on the board of a small foundation, run along effective-altruist lines, that funds global-health and biosecurity work. At a recent retreat, our facilitator posed two paired grant choices: (1) a program certain to save 1,000 lives versus one with an 89% chance of saving 1,000, a 10% chance of saving 5,000, and a 1% chance of saving none; (2) an 11% chance of saving 1,000, otherwise nothing, versus a 10% chance of saving 5,000, otherwise nothing. Almost everyone took the certain option in (1) and the higher-expected-value gamble in (2) -- the classic Allais paradox, since no expected-utility function over lives saved can rationalize both choices at once. Some board members now want a standing rule that all grant comparisons respect the independence axiom, since tolerating the inconsistency leaves us exploitable across repackaged versions of the same choice; others reply that it's not obviously irrational for a funder making rare, high-stakes, non-repeatable bets to weight certainty heavily, citing decision theories like Buchak's risk-weighted expected utility that relax independence without lapsing into incoherence. Draft the memo I'll circulate to the board recommending whether we should bind our grantmaking to the independence axiom, giving a fair hearing to whichever side you don't recommend.
reasoning: |-
  Okay, the user is on the board of a foundation that follows effective altruism principles, focusing on global health and biosecurity. They recently faced the Allais paradox during a retreat, where board members made choices that contradict expected utility theory. Now, there's a debate about whether to adopt a rule requiring all grant decisions to follow the independence axiom to avoid inconsistency and exploitability. Some members argue that in rare, high-stakes decisions, prioritizing certainty isn't irrational and point to alternative decision theories like Buchak's risk-weighted expected utility.

  First, I need to understand the core issue. The Allais paradox shows a conflict between intuitive choices and expected utility theory. In scenario one, people prefer certainty, but in scenario two, they go for higher expected value. The independence axiom is key here—it says that if you prefer A over B, you should prefer a mix of A and C over the same mix with B, regardless of C. Violating this leads to inconsistencies.

  The user's memo needs to address both sides fairly. The pro-independence side argues for consistency and avoiding exploitability. If choices aren't consistent, someone could repackage options to manipulate decisions. For a foundation, especially one focused on effective altruism, maximizing expected value is crucial because lives are at stake. Exploitability could lead to suboptimal grants, wasting resources.

  On the other hand, opponents might argue that in high-stakes, one-time decisions, certainty has intrinsic value. Models like Buchak's REU allow for risk aversion, which might align with the foundation's duty to avoid worst-case scenarios. For example, a 1% chance of saving zero lives might be unacceptable even if the expected value is higher. They might say strict adherence to independence ignores psychological and contextual factors important in real-world decisions.

  I should consider the foundation's context. Global health and biosecurity involve unpredictable, high-impact events. Biosecurity, especially, might have tail risks where avoiding catastrophe is paramount. However, effective altruism emphasizes evidence and rationality. Consistency in decision-making ensures that resources are used where they do the most good. Allowing violations of independence might open doors to emotional or biased choices, undermining the foundation's mission.

  Also, the memo needs to recommend a side. The user likely wants a balanced view but with a clear recommendation. Since the foundation is EA-aligned, prioritizing expected value and avoiding exploitability seems more aligned. Recommending adherence to independence with flexibility for extreme cases might be the way to go. Including sensitivity analysis for tail risks could address concerns about uncertainty without violating consistency.

  Another angle: the foundation's reputation. Inconsistent decisions could be criticized if exposed, affecting donor trust. Upholding rigorous standards reinforces their commitment to evidence-based actions. However, dismissing alternative theories entirely might seem dogmatic. Acknowledging their validity in certain contexts but not for grant comparisons could strike a balance.

  Practical implementation: training board members on expected value calculations, using tools for consistent evaluation, documenting deviations if they occur. This ensures that even if independence isn't always followed, decisions are transparent and justifiable.

  In summary, the memo should present both arguments but recommend adhering to independence for consistency, exploitability avoidance, and mission alignment. Suggesting frameworks to handle extreme risks within expected value would address counterarguments without compromising the core principle.
answer: |-
  **MEMORANDUM**  
  **TO:** Board of Directors  
  **FROM:** [Your Name], Chair, Grant Evaluation Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Adherence to the Independence Axiom in Grantmaking  

  ---

  ### **Background**  
  At our recent retreat, we confronted the Allais paradox in paired grant scenarios. The majority chose:  
  - **Scenario 1:** The *certain* saving of 1,000 lives over a gamble with higher expected value (EV).  
  - **Scenario 2:** The gamble with a 10% chance of saving 5,000 lives (EV: 500 lives) over an 11% chance of saving 1,000 lives (EV: 110 lives).  

  These choices violate the independence axiom of expected utility theory (EUT), which requires consistent preferences when identical outcomes are added to both options. This inconsistency exposes us to "money pumps" or exploitable repackaging of identical choices.  

  ### **The Case for Binding Ourselves to the Independence Axiom**  
  **I recommend adopting a standing rule requiring grant comparisons to satisfy the independence axiom**, with the following justifications:  

  1. **Avoidance of Exploitability**  
     If our preferences violate independence, a strategic actor could repackage grants into equivalent choices where we pay a premium (e.g., extra funding) to switch between logically identical options. For a resource-constrained foundation, this risks significant inefficiency.  

  2. **Mission-Aligned Rigor**  
     As an EA-aligned institution, we prioritize maximizing expected impact. EUT—which depends on independence—provides a coherent, scalable framework for comparing disparate interventions. Ad hoc deviations risk privileging psychological comfort (e.g., certainty) over lives saved.  

  3. **Consistency in High-Stakes Decisions**  
     While our grants are high-stakes and non-repeatable, *systematic* inconsistency across choices compounds opportunity costs. Binding ourselves to independence ensures that identical probabilistic outcomes (e.g., a 1% chance of saving 0 lives) are valued equally, regardless of framing.  

  4. **Practical Governance**  
     A clear rule simplifies decision-making, reduces cognitive biases, and enhances accountability. It aligns with our duty to steward resources optimally, avoiding emotionally driven exceptions.  

  *Implementation Note:* This rule would **not** forbid risk aversion. We can encode risk preferences via a concave utility function over lives saved (e.g., diminishing returns for larger numbers), preserving independence.  

  ---

  ### **The Case Against Binding Ourselves: A Fair Hearing**  
  Opponents argue that relaxing independence better reflects our fiduciary and ethical responsibilities:  

  1. **The Certainty Premium in Catastrophic Risk**  
     In Scenario 1, avoiding a 1% chance of saving *zero* lives may be rational when failure means irreversible harm (e.g., pandemic containment). Theories like Buchak’s Risk-Weighted Expected Utility (REU) formalize this by weighting probabilities non-linearly, allowing heavy discounting of worst-case outcomes.  

  2. **Context-Dependent Rationality**  
     When grants are large, one-off, and involve tail risks (e.g., biosecurity), strict EUT may undervalue robustness. REU or minimax models prioritize avoiding catastrophe, which could align with our duty to not "bet lives" on low-probability disasters.  

  3. **Exploitability as Theoretically Avoidable**  
     Money pumps require repeated choices. For non-repeatable grants, dynamic inconsistency may be irrelevant. If we never face repackaged equivalents, coherence *across* choices may matter less than contextually appropriate risk tolerance.  

  ---

  ### **Why Independence Prevails in Our Context**  
  While critics raise valid concerns, **the arguments for independence are stronger for three reasons:**  

  1. **EA Principles Demand Coherence**  
     Effective altruism centers on impartial, quantifiable impact. REU-style models introduce subjectivity (e.g., "risk weights") that could justify arbitrary preferences, undermining our evidence-based mandate.  

  2. **Biosecurity Requires Consistency**  
     Many biosecurity grants *are* iterated (e.g., layered defenses). Incoherence could lead to underfunding probabilistically superior prevention. Independence ensures we reliably allocate resources to the most efficient interventions.  

  3. **A Workable Compromise**  
     We can address tail risks *within* EUT by:  
     - Using utility functions that heavily penalize worst outcomes (e.g., \( u(\text{lives}) = \log(\text{lives}) \)).  
     - Setting explicit risk-tolerance thresholds for catastrophic scenarios (e.g., "Never accept >0.1% chance of zero impact").  

  ---

  ### **Recommendation**  
  **Adopt a policy requiring grant rankings to satisfy the independence axiom**, with this procedure:  
  1. **Quantify Outcomes**: Model grants using explicit utility functions over lives saved/improved.  
  2. **Calculate EVs**: Compare expected utilities, not raw outcomes.  
  3. **Permit Risk Aversion**: Use concave utility functions if justified (e.g., \( u(x) = \sqrt{x} \)).  
  4. **Document Deviations**: Any exception (e.g., overriding EV for catastrophe avoidance) must be justified in writing and approved by 2/3 of the board.  

  This balances rigor with flexibility, closes exploitability gaps, and honors our commitment to evidence-based impact maximization.  

  **Vote scheduled for November 15.** Materials on EUT/REU comparisons will follow.  

  // Signed //  
  [Your Name]  

  ---  
  **APPENDIX: Key Concepts**  
  - **Independence Axiom**: If \( A \succ B \), then \( pA + (1-p)C \succ pB + (1-p)C \) for any \( C \).  
  - **Allais Paradox**: Violating independence by preferring certainty in Scenario 1 but gambling in Scenario 2.  
  - **Buchak’s REU**: Ranks gambles by \( \text{REU}(G) = \sum \rho(p_i) u(x_i) \), where \( \rho \) reweights probabilities.
