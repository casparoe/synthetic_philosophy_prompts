prompt: |-
  So a while back I went down a youtube rabbit hole about octopus and bee intelligence, and I kept running into this idea called 'higher order theories of consciousness' - basically the claim that your not actually conscious of a sensation unless some other part of your brain is also representing that you're having it, not just the sensation happening in you somewhere. Can you break down the most important implications of specifically this theory (not consciousness theories in general) for whether the lobster I boiled last month, or the ants I keep spraying under my sink, could actually be suffering? What I really want to know is whether this gives an actual principled reason to think simpler animals don't feel anything, or if its more just a smart sounding excuse for people (me included) to keep doing what we were gonna do anyway.
reasoning: |-
