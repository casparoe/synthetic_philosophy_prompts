  Absent-Minded Driver Problem:
  - A driver is on a highway with two exits.
  - The first exit leads to a bad outcome (payoff 0).
  - The second exit leads to a good outcome (payoff 4).
  - If the driver misses both, the payoff is 1 (which is better than 0 but worse than 4).
  - The driver cannot tell whether he is at the first or the second exit (they look identical).
  - He must choose a single probability p of exiting at an exit (to be used at both exits).

  The driver's strategy is to choose p (the probability to exit at an exit) in advance. The expected payoff depends on p:

  We can model the driver's journey:
  - With probability p, he exits at the first exit (payoff 0).
  - With probability (1-p), he continues to the second exit.
    - At the second exit, with probability p he exits (payoff 4) and with probability (1-p) he continues (payoff 1).

  Thus, the total expected payoff is:
    E = p * 0 + (1-p) * [ p * 4 + (1-p) * 1 ]
      = (1-p) * [4p + 1 - p]
      = (1-p) * (3p + 1)

  We can expand:
    E = 3p(1-p) + (1-p) 
      = 3p - 3p² + 1 - p
      = -3p² + 2p + 1

  We can maximize E by taking the derivative with respect to p:
    dE/dp = -6p + 2

  Setting to zero:
