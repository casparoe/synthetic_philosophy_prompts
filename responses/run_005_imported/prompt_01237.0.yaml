  ok this has been bugging me since we covered it in ap psych. we learned about the mirror test (put a mark on an animal, see if it notices in the mirror and reacts to it) and apparently only a handful of species ever pass it, chimps, dolphins, elephants, magpies, stuff like that. my dog fails it every single time, zero recognition, he just barks at the mirror like its another dog. so does that mean hes not actually self-aware or conscious in there the way i always assumed, and its really just instinct with nobody home? kinda a bummer if true but i can't find the hole in the logic.
