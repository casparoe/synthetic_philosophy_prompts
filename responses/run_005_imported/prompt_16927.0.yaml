answer: |-
  Here’s a rigorous argument for your thesis, grounded in philosophy of probability and metaphysics, suitable for a feature challenging the epistemic foundations of actuarial risk tools:

  ### The Argument: Probability Statements About Individuals Are Not Truth-Apt  
  **Core Thesis**: Claims like "this defendant has a 68% chance of reoffending" are neither true nor false because they attempt to assign an *objective frequentist probability* to a *singular event*—a category error that conflates group-level statistics with non-existent individual-level properties.  

  ---

  ### Key Steps in the Argument  
  1. **The Nature of Frequentist Probability**:  
     - Actuarial tools rely on **frequentist probability**, defined as the long-run frequency of an event within a *reference class* (e.g., "35-year-old men with two prior convictions reoffend 68% of the time").  
     - Crucially, this probability is a property of the *class*, not the *individual*. As philosopher Ian Hacking observed: *"No frequency probability pertains just to this trial."*  

  2. **The Reference Class Problem as Metaphysical, Not Empirical**:  
     - A defendant belongs to infinitely many reference classes (e.g., "35-year-old left-handed men raised in ZIP 12345," "college dropouts with anxiety disorders," "people with identical prior convictions *and* a supportive family").  
     - Each class yields a different probability. **There is no fact of the matter** about which class is "correct" because:  
       - **No privileged class exists**: The choice isn’t dictated by data but by *normative decisions* about which traits "matter" (e.g., prioritizing demographics over psychology).  
       - **The singleton fallacy**: The limit case—a "class" containing *only* the defendant—collapses probability into tautology (e.g., "this defendant reoffends with probability 0 or 1").  

  3. **Reichenbach’s "Narrowest Class" Fix Fails**:  
     - Reichenbach proposed using the "narrowest class with reliable statistics." But:  
       - **Arbitrary termination**: Stopping at (e.g.) "age + prior record" isn’t epistemically justified; it’s a *practical concession* to data limitations.  
       - **The illusion of precision**: Narrower classes appear more "accurate," but they inherit bias from the broader classes used to define them (e.g., "men in ZIP 12345" presumes ZIP codes are causally relevant).  

  4. **Why Better Data Doesn’t Solve This**:  
     - Perfect data could calibrate *all possible reference classes*, but it cannot resolve:  
       - **The individuation problem**: Which traits define a "relevant" class? Race? Income? Neurobiology? The choice reflects *social values*, not empirical truth.  
       - **Causal opacity**: If trait *X* correlates with reoffending, is it causal (e.g., poverty) or a proxy for bias (e.g., policing patterns)? Actuarial tools conflate correlation with propensity.  

  5. **The Truth-Aptness Gap**:  
     - For a statement to be "true or false," it must refer to a determinate state of affairs. But:  
       - **No individual propensity exists**: Unlike a coin’s mass (a physical property), "68% chance of reoffending" isn’t a property *of the person*. It’s a summary of group behavior misapplied to an individual.  
       - **The map-territory error**: The score is a map of *past group data*—not the defendant’s future. As Wittgenstein warned: *"A probability proposition is a fossilized pattern of inference."*  

  ---

  ### Implications for Criminal Justice  
  - **False Objectivity**: Presenting scores as "scientific truths" masks value-laden choices (e.g., weighting criminal history over rehabilitation efforts) as neutrality.  
  - **Epistemic Injustice**: Defendants are judged by group traits they cannot alter (ZIP code, race), violating the legal principle of *individualized justice*.  
  - **Practical Alternatives**: Shift to **causal models** (e.g., "How would risk change with access to therapy?") or **due process safeguards** (e.g., requiring courts to justify reference class choices).  

  ---

  ### Philosophers to Cite  
  - **John Venn** (1866): First identified the reference class problem.  
  - **Hans Reichenbach** (1949): His "pragmatic" solution fails under indeterminacy.  
  - **Nancy Cartwright**: Modern critiques of conflating statistical with causal claims.  
  - **Émile Durkheim**: Prefigures the problem in *Suicide*—social facts ≠ individual actions.  

  ### Punchy Conclusion for Your Feature  
  > "Actuarial tools don’t need better data; they need better metaphysics. A '68% chance of reoffending' isn’t a fact about a person—it’s a statistical ghost haunting a moral choice. When courts mistake group frequencies for individual destinies, they don’t calculate justice; they calcify bias."  

  This framing elevates the debate beyond technical tweaks to expose the tools’ conceptual bankruptcy—a potent angle for your feature. Would you like expansion on any segment?
