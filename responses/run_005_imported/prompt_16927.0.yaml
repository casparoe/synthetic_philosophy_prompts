  The user's audience might include legal professionals and policymakers. They need to understand that these tools aren't neutral. The reference class choice reflects values—prioritizing certain group traits over others. This has ethical implications, especially in criminal justice where stakes are high. Pretending these scores are objective truths masks subjective judgments.

