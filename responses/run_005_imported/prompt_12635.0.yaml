  First, I recall the Judy Benjamin problem. It's a well-known paradox where conditional information leads to disagreement on probability updates. The user mentioned it, so they have some background. The core issue is how to update priors when new evidence is conditional on a subset.

  The user needs a policy for their team. The memo must be clear for field use, persuasive for skeptics, and address both arguments. They want a decision before the spring training, so urgency is key.

  Looking at both sides: Team A argues that the tip only affects internal West probabilities, so P(West) stays 50%. Team B uses max entropy, which shifts P(West) downward. Max entropy minimizes assumptions, but in this case, it might introduce unintended changes.

  I remember that in the Judy Benjamin problem, several approaches exist, but max entropy is common. However, critiques point out that it can violate intuitions about irrelevant information. The user’s scenario is similar—updating based on conditional info shouldn't affect the overall probability if the tip doesn't relate to East.

  The user’s deeper need is reliability in life-or-death decisions. They need a method that’s both mathematically sound and practical. Overcomplicating could lead to errors in the field. The solution should avoid unnecessary shifts without evidence.

  Team A's approach is simpler and aligns with the principle that no new info about East vs. West means no change. Team B's method, while mathematically rigorous, might overcorrect. Given the stakes, simplicity and avoiding unintended consequences are crucial.

  I should recommend Team A's method. It’s straightforward: adjust sub-zone probabilities but keep the zone split unchanged. Commanders can apply this easily. For persuasion, explain that the tip doesn't provide evidence favoring one zone over the other, so the prior stands. Address Team B by acknowledging max entropy's intent but highlight risks in this context.

  Also, consider implementation. Software might need tweaking to handle conditional updates without altering parent probabilities. Training should emphasize that conditional tips only refine within zones, not between them.

  Finally, the memo must be concise. Outline steps clearly: receive tip, adjust sub-areas, keep zone probabilities. Use the example to illustrate. Reassure that this method is backed by expert debate and prioritizes operational safety.
answer: |-
  ## MEMORANDUM  
  TO: Protocols Subcommittee, Backcountry Search-and-Rescue Unit  
  FROM: [Your Name], Subcommittee Member  
  DATE: 23 October 2023  
  SUBJECT: Protocol Update for Conditional-Form Tips in Probability Mapping  

  **1. RECOMMENDED PROCEDURE**  
  Effective immediately, **conditional-form tips** (e.g., "If in Zone X, subject is more likely in Subzone A than Subzone B") **will update probabilities *within* the specified zone but leave the probability *of* that zone versus others unchanged**, provided no direct evidence about inter-zone likelihood is given.  

  **Operational Steps for Incident Commanders:**  
  1. **Identify the conditioned zone** (e.g., West Zone).  
  2. **Adjust subzone probabilities** within that zone per the tip (e.g., increase P(Lake Basin | West), decrease P(Lookout Trail | West)).  
  3. **Leave all zone-level probabilities UNCHANGED** (e.g., P(West) = 50% → remains 50%).  
  4. Re-normalize subzone probabilities only within the conditioned zone.  

  *Example (Last Month’s Scenario):*  
  - Initial: P(East) = 50%, P(West) = 50%.  
  - Hunter Tip: "If in West, more likely at Lake Basin than Lookout Trail."  
  - Update: P(Lake Basin | West) ↑, P(Lookout Trail | West) ↓.  
  - **P(West) REMAINS 50%.**  

  ---

  **2. RATIONALE: WHY THIS APPROACH IS CORRECT & OPERATIONALLY SOUND**  
  The disagreement stems from the *Judy Benjamin Problem*—a known Bayesian paradox. Here’s why we adopt the "no shift" rule:  

  **A. The Tip Provides No Evidence About East vs. West**  
  - The hunter explicitly stated he had "no opinion about East vs. West."  
  - The tip *only* refines our understanding of *where the subject might be **if** in West*. It does not make West more or less probable *relative to East*.  
  - Mathematically: Evidence about sub-areas of West is **probabilistically independent** of the East/West question. Updating P(West) violates the *Principle of Total Evidence*—we cannot invent information not present in the tip.  

  **B. Avoiding Spurious Shifts Protects Mission Integrity**  
  - The maximum-entropy update (Team B’s approach) artificially lowers P(West) because it assumes the tip implies *something* about East, despite no such evidence. This is a known flaw in max-ent for conditional constraints.  
  - Example: If we learn "If in West, subject is near Lake Basin," max-ent *decreases* P(West) because it assumes East is now "safer" by default. This is illogical—East’s risks (terrain, weather) are unaffected by a tip about West’s internals.  
  - In field operations, such shifts misallocate scarce teams away from plausible zones without justification.  

  **C. Simplicity Under Pressure**  
  - Commanders can apply this rule instantly: "Conditional tip → update inside the zone, leave zone probabilities alone."  
  - No software overrides or entropy calculations are needed. Our current system can handle sub-zone adjustments without altering zone priors.  

  ---

  **3. ENGAGING WITH THE ALTERNATIVE VIEW**  
  We acknowledge Team B’s argument: maximum entropy is a mathematically rigorous way to handle incomplete information, and it *is* our software’s default. However:  
  - **Max-ent is designed for true ignorance**, not cases where we have explicit testimony (e.g., "no opinion on East/West"). Forcing it here overrides direct evidence.  
  - While max-ent minimizes assumptions, it can create artifacts (like lowering P(West)) that contradict the tip’s intent. In search theory, unsupported probability shifts risk lives by diverting resources from areas with unchanged risk.  
  - Academic debate *does* exist (e.g., van Fraassen vs. Grove/Halpern), but operational safety demands we prioritize transparent, evidence-based updates.  

  ---

  **4. POLICY IMPLEMENTATION**  
  - **Training:** New volunteers will learn: "Conditional tips refine search *within* zones; they don’t change which zones are likely."  
  - **Software:** Our mapping tool will be updated to lock zone-level probabilities when conditional constraints are applied.  
  - **Documentation:** Field guides will include the hunter-scenario example.  

  **Final Word:** This protocol aligns with Bayesian principles *and* operational reality. It ensures tips refine—not distort—our probability maps, keeping teams focused on evidence-driven decisions.  

  **APPROVED:**  
  _________________________________________  
  Subcommittee Chair  

  ---  
  *Attachment: 1-Page Quick-Reference Guide for Field Commanders*
