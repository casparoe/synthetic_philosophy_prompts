answer: |-
  Your reading of the problem of old evidence is technically correct *within a naive application of strict Bayesian conditionalization*, but the philosophical upshot is **not** that retrodictions are evidentially worthless. Instead, the problem highlights a **limitation of the simple Bayesian framework** and has spurred sophisticated responses that preserve the evidential value of explaining known anomalies like Mercury's precession. Here's a breakdown:

  ### 1. **The Core Problem (As You Stated It)**
     - **Yes**: If \( P(E) = 1 \) (Mercury's precession is already certain), then \( P(T|E) = P(T) \). Conditioning on \( E \) does nothing.
     - **Implication**: On this view, GR's "prediction" of Mercury's precession *could not* have increased anyone's credence in GR at the time it was proposed. Only *novel* predictions (e.g., light bending) should count.

  ### 2. **Why This Isn't the Final Word: Philosophical Solutions**
  The problem is widely seen as a *puzzle for Bayesianism to solve*, not proof that scientists are irrational. Key responses:

  - **Counterfactual Credence (The Standard Fix)**  
    Bayesianism should model the scientist's credence *before learning E*. In 1915, physicists *knew* \( E \) (Mercury's anomaly), but Einstein (and others) could ask:  
    > *"What would my credence in GR be if I didn't already know about Mercury's precession?"*  
    Here, \( P_{\text{old}}(E) < 1 \) (pre-GR, the anomaly was unexplained), so \( P_{\text{old}}(T|E) > P_{\text{old}}(T) \). The evidential boost comes from recognizing that GR *would have* predicted \( E \) if \( E \) weren't already known. This resolves the formal issue while capturing why physicists felt confirmed.

  - **Logical and Explanatory Reinterpretation**  
    GR didn't just "retrodict" \( E \); it *explained* a known anomaly that was deeply puzzling under Newtonian gravity. The Bayesian update reflects the *explanatory power* of \( T \), not just prediction. If \( T \) entails \( E \) and \( E \) was previously mysterious, \( T \) gains credence by solving a problem. Formal approaches (e.g., Garber's solution) treat the discovery that \( T \vdash E \) as new evidence, even if \( E \) itself is old.

  - **Changing Background Knowledge**  
    When GR was proposed, Mercury's precession was *not* fully integrated into physical theory. GR altered the background knowledge \( K \), making \( E \) *expected* under \( T \) but *surprising* under \( K \) alone. Thus, \( P(E|K) < 1 \) conceptually, even if \( P(E) = 1 \) psychologically.

  ### 3. **Why Physicists Were Right to Feel Confirmed**
  - **Unification**: GR explained Mercury's precession *through the same principles* as light bending and time dilation (unlike ad-hoc Newtonian fixes). This coherence is evidentially significant.
  - **Severe Test**: Mercury's orbit was a notorious anomaly. A theory that resolved it *precisely* (43"/century) passed a test where competitors failed.
  - **Historical Context**: In 1915, GR was *not* the only candidate theory (e.g., Nordström's scalar theory). Mercury's precession helped distinguish GR empirically *at the time*.
  - **Pragmatic View**: Scientists rarely hold \( P(E) = 1 \) rigidly. Unexplained anomalies subtly undermine confidence in existing theories; resolving them restores coherence.

  ### 4. **Novel Predictions vs. Explanations: A Balanced View**
  - **Novel predictions** (e.g., light bending) are *stronger* evidence because they avoid concerns about tuning or bias.  
  - **But explanations of old evidence** are still evidentially valuable:  
    - They demonstrate a theory's *consilience* (ability to unify disparate phenomena).  
    - They satisfy the "no-miracles" intuition: A theory that explains known puzzles is less likely to be coincidental.  
    - In practice, most theories gain traction through a *mix* of retrodiction and prediction (e.g., Dirac's equation explained electron spin and predicted antimatter).

  ### What to Tell Your Colleagues
  > "The problem of old evidence shows a quirk in simple Bayesian updating: if evidence is already certain, it *formally* can't boost credence. But philosophers see this as a technical flaw in the model, not proof that Mercury's precession didn't support GR. Einstein's theory *explained* a stubborn anomaly, unified it with other phenomena, and passed a precise quantitative test. That’s why physicists were right to take it seriously—even if Bayesians need fancy footwork to capture it. Novel predictions are gold-standard, but explaining known puzzles still counts as evidence."

  **In short**: You’re not overreacting to a triviality—the problem is real and important—but its lesson is that Bayesianism needs refinement, not that half of physics' confirmations are illusions. Retrodiction retains epistemic value, especially when it resolves profound anomalies.
