      "comments": "Excellent summary of Prakash findings (initial inability, rapid learning). Overstated conclusion: The results confirm Locke/Berkeley on *immediate* post-sight identification but do not fully refute Leibniz, who allowed for quick inference. Under-discusses evidentiary limits (e.g., critical-period plasticity vs. innate concepts)."
