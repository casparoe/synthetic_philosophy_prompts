answer: |-
  Your intuition is spot-on: separating Sidgwick's ethics and psychical research into neat, ironic compartments **risks flattening a profound, even agonizing, connection** that was central to his intellectual and personal life. While the contrast is stark and inherently dramatic, the "why" runs much deeper than mere eccentricity or consolation. Here's why and how to integrate them:

  1.  **The Core Ethical Problem Driving Psychical Research: The "Dualism of Practical Reason"**
      *   Sidgwick's *Methods of Ethics* (1874) meticulously analyzed three methods of ethical reasoning (Intuitionism, Egoistic Hedonism, Utilitarianism). His devastating conclusion was that while Utilitarianism (maximizing general happiness) was rationally compelling, he could find no *rational* way to prove that it was always an individual's *duty* to follow it over Egoistic Hedonism (maximizing one's own happiness).
      *   This impasse, the "Dualism of Practical Reason," meant that at a fundamental level, duty and self-interest *might* irreconcilably conflict. Sidgwick saw this as a potential shipwreck for systematic ethics.
      *   **The Psychical Connection:** Sidgwick believed this dualism *could* be resolved **if** one could rationally believe in a future state where virtue was rewarded and vice punished (a kind of divinely administered Utilitarian harmony). However, the decline of orthodox religious belief (which deeply affected Sidgwick and his circle – the "Apostles" crisis of faith) stripped away the traditional foundation for that belief. *Psychical research became the desperate search for empirical, scientific evidence for personal survival after death* – evidence that could potentially provide the rational basis for resolving the Dualism and saving ethical coherence. The ghost-hunter wasn't indulging a hobby; he was conducting a critical salvage operation on his own ethical system.

  2.  **"Credulous" is Fundamentally Wrong: The Rigor of the SPR**
      *   Sidgwick and the early SPR (founded 1882, precisely your period) were **anything but credulous.** Their methodology was explicitly modeled on the emerging scientific norms of the time, adapted to a notoriously difficult subject.
      *   **Key Aspects of Their Approach:**
          *   **Extreme Skepticism & Fraud Detection:** They assumed fraud was the default explanation. Sidgwick, the Myers brothers (Arthur and Frederic), Edmund Gurney, and later Eleanor Sidgwick were relentless in exposing fraudulent mediums. They developed elaborate controls, used private detectives, and meticulously documented exposures.
          *   **Systematic Collection & Sifting:** They collected thousands of cases of hallucinations, premonitions, death-coincidences, etc., using questionnaires and rigorous cross-examination to weed out unreliable testimony. Gurney, Myers, and Podmore's *Phantasms of the Living* (1886) is a monument to this tedious, critical sifting.
          *   **Focus on Anomalous, Verifiable Details:** They prized "supernormal" information – specific names, dates, facts unknown to the medium but verifiable after the séance – as potential evidence. Automatic writing was scrutinized for such details.
          *   **Statistical Analysis:** They pioneered the use of statistics (probability calculations) to assess the likelihood of coincidences in telepathy experiments and death-visitation cases.
          *   **The "Will to Believe" vs. Evidence:** While William James famously articulated the "Will to Believe," Sidgwick's approach was more accurately a desperate *"Need to Disbelieve, But..."*. He *wanted* to find evidence to resolve his ethical dilemma, but his philosophical rigor demanded an extraordinarily high standard of proof, which he consistently felt he never met. His reports often express profound disappointment and frustration.
      *   **The Right Word:** **Methodologically skeptical but existentially desperate.** They approached the phenomena with critical tools honed by their philosophical and scientific training, driven by a profound hope (even need) to find something *despite* their skepticism. Sidgwick was often described as the most skeptical member of the group.

  **How to Integrate This for Your Novel:**

  1.  **Make the Ethical Dilemma the Engine:** Show your protagonist grappling with the Dualism *on the page*. Have him write passages in the treatise where the problem crystallizes, feel the existential dread of the potential shipwreck. His frustration with the unresolved tension should be palpable. This isn't abstract; it undermines the foundation of his life's work.
  2.  **Show the Research as a Direct, Logical (if Desperate) Extension:** Frame his evening activities not as a credulous escape, but as a rigorous, albeit unconventional, *experimental investigation* prompted by the treatise's dead end. He attends séances not for comfort, but as a scientist testing a critical hypothesis: "If survival is empirically proven, *then_ the Dualism might be resolved." His meticulous notes are data points in this high-stakes experiment.
  3.  **Emphasize the Methodological Rigor (and Frustration):** Don't shy away from the weirdness of the séances, but counterpoint it by showing:
      *   His intense focus on controls: checking for drafts, hidden devices, prior knowledge.
      *   His scrupulous note-taking: timings, exact words, physical descriptions, witness accounts.
      *   His profound disappointment when phenomena are exposed as fraud or remain ambiguous ("Was that a cold draft, or...?").
      *   Debates *within* his circle (Myers more hopeful, Gurney analytical, Sidgwick deeply cautious) about evidence standards.
  4.  **Highlight the Personal & Existential Stakes:** Sidgwick lost his brother. His wife, Eleanor, was deeply involved. This wasn't just academic; it was tied to grief, loss, and the fear of meaninglessness if the Dualism remained unresolved *and* survival was disproven. The research carried immense emotional weight precisely *because* of its connection to his philosophy and his loss of orthodox faith.
  5.  **The Irony is Deeper:** The true irony isn't just "day philosopher/night ghost-hunter." It's that the **most rigorously skeptical, systematic moral philosopher of his age felt compelled to spend decades chasing ghosts in a desperate attempt to save his own ethical system from internal collapse.** The methods of ethics *demanded* the methods of psychical research, even as the latter consistently failed to deliver the evidence the former so desperately needed. This creates a profound tragic tension.

  **In Conclusion:**

  Abandon the "separate compartments" plan. Instead, **braid the ethical crisis and the psychical research tightly together.** Show the treatise's unresolved Dualism as the *direct cause* of the nocturnal investigations. Portray the investigations with the methodological skepticism Sidgwick embodied, making his persistent hope *despite* the lack of conclusive proof all the more poignant. This integration doesn't diminish the contrast; it deepens it into a profound exploration of reason, despair, hope, and the lengths a brilliant mind will go to in search of coherence in a potentially incoherent universe. Sidgwick wasn't compartmentalizing; he was fighting a single, continuous battle for meaning on two interconnected fronts. Capturing *that* struggle will give your novel far greater intellectual depth and emotional power.
