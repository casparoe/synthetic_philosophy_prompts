  One friend wants to maximize the average payout across the group, arguing it's rational since no one knows their role yet. The user prefers maximizing the minimum payout (making the worst-paid role as good as possible), even if it means a lower average. They're wondering if their instinct is just risk aversion or if there's a real principle behind it.

