answer: |-
  Your instinct isn't just risk aversion; it reflects a **fundamental philosophical and economic principle known as the Maximin criterion (or Rawlsian Justice)**, and it's *particularly* well-suited to a worker co-op context. Here's why your approach has a strong foundation:

  1.  **The Veil of Ignorance (Rawls):** You've intuitively described philosopher John Rawls' concept. When designing institutions *before* knowing your position ("under a veil of ignorance"), Rawls argues rational individuals would prioritize making the *worst-off* position as good as possible. Why? Because if you end up in that worst-off position, you want it to be tolerable. Maximizing the average offers no such guarantee – you could easily be the one significantly worse off.

  2.  **Maximin Criterion:** This is the decision rule derived from Rawls. When faced with uncertainty about future states (like your role), you choose the option with the *least bad worst-case scenario*. This explicitly prioritizes downside protection over potential upside or average gains. It's a rational strategy when:
      *   **The stakes are high (your livelihood).**
      *   **The consequences of a bad outcome are severe.**
      *   **You have a strong aversion to inequality or being exploited.** (Highly relevant in a co-op!)

  3.  **Co-op Values & Long-Term Stability:** Worker co-ops are founded on principles of solidarity, equity, and democratic control. Prioritizing the minimum pay:
      *   **Builds Trust & Solidarity:** Everyone knows that even the "least desirable" role is valued and provides a decent living. This fosters mutual respect.
      *   **Reduces Resentment & Conflict:** If the gap between highest and lowest is large *even after* ensuring the lowest is better off, resentment can fester. Maximin inherently constrains excessive inequality.
      *   **Enhances Commitment:** Knowing the floor is high makes members more likely to be committed, even if they land in a lower-paid role. It reduces the feeling of "losing the lottery."
      *   **Aligns with Democratic Control:** In a democratic workplace, the interests of *all* members, especially the potentially vulnerable, should carry significant weight.

  4.  **The Flaw in Pure Average Maximization ("Rational Bet"):**
      *   **Ignores Distribution:** A higher average can mask significant inequality. You could have one member earning vastly more while others are only marginally better off than under an equal split.
      *   **Risk Exposure:** While it maximizes *expected* value, it offers no protection against the *actual* outcome of landing in the worst-paid role. For an individual's livelihood, the actual outcome matters far more than the average expectation.
      *   **Assumes Risk Neutrality:** It assumes all members are indifferent to risk. Many people (rightly) are risk-averse regarding their primary income.
      *   **Potential for Exploitation (Perceived or Real):** In a co-op, maximizing average could incentivize designs where higher-paid roles benefit disproportionately from the work of lower-paid roles, undermining the cooperative ethos.

  **Addressing Your Friend's Argument:**

  *   **"Rational Bet":** While maximizing expected value is rational for a *single* decision under uncertainty with replicable bets (like many small gambles), it's less compelling for a *one-time, high-stakes allocation* of your *primary income role* in a venture built on solidarity. You don't get to "play" this lottery multiple times to average out.
  *   **Growing the Pie:** You've *already* agreed that pay differentials must grow the pie enough to benefit the lowest role vs. equal split. Your friend's "average" argument pushes *beyond* this constraint, potentially accepting a *lower floor* for a *higher average*. Your Maximin stance says, "We've ensured the lowest role gains vs. equal split. Now, *among options that meet that bar*, let's make sure that lowest role is as strong as possible."

  **Conclusion:**

  You are **not** just being risk-averse. You are advocating for a principle deeply rooted in ethics (Rawlsian justice), decision theory (Maximin), and the core values of worker cooperatives (solidarity, equity, protection of members). Prioritizing the worst-paid role:

  *   Provides crucial downside protection for every member.
  *   Builds a more stable, trusting, and equitable cooperative foundation.
  *   Is a rational choice under high-stakes uncertainty where the consequences of a bad outcome are severe (your paycheck!).

  **Practical Suggestion:** Frame the discussion using Rawls' "veil of ignorance": *"Before we know our roles, which pay structure would we choose if we knew we might end up in the* ***lowest-paid*** *position? Let's make that position as secure and rewarding as possible, since that security benefits everyone's peace of mind and the co-op's health."** This makes your principle less about personal fear and more about collective rationality and fairness. Your instinct is well-founded and aligns perfectly with cooperative ideals.
