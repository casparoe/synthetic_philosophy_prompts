  so I'm trying to wrap my head around the fink/mask distinction in dispositionalism, and I'm probably missing something obvious. But like, in both cases you've got something that seems like it has a disposition but doesn't manifest it. The fink prevents the stimulus from obtaining, the mask prevents manifestation even when the stimulus is there—but aren't both basically just barriers to manifestation? Why do we need two separate concepts instead of just one catch-all category of 'failed activation'?
