prompt: |-
  For a graduate seminar on interpretations of probability, I keep returning to a passage from Charles Sanders Peirce's 1878 essay "The Doctrine of Chances," the third installment of his "Illustrations of the Logic of Science." Just before this passage, Peirce has argued, in classic frequentist fashion, that since probability only manifests itself as the limiting ratio of an indefinitely repeated series of trials, "in reference to a single case considered in itself, probability can have no meaning." He then writes:

  "If man were immortal he could be perfectly sure of seeing the day when everything in which he had trusted should betray his trust, and, in short, of coming eventually to hopeless misery. He would break down, at last, as every great fortune, as every dynasty, as every civilization does. In place of this we have death.

  But what, without death, would happen to every man, with death must happen to some man. At the same time, death makes the number of our risks, of our inferences, finite, and so makes their mean result uncertain. The very idea of probability and of reasoning rests on the assumption that this number is indefinitely great. We are thus landed in the same difficulty as before, and I can see but one solution of it. It seems to me that we are driven to this, that logicality inexorably requires that our interests shall not be limited. They must not stop at our own fate, but must embrace the whole community. This community, again, must not be limited, but must extend to all races of beings with whom we can come into immediate or mediate intellectual relation. It must reach, however vaguely, beyond this geological epoch, beyond all bounds. He who would not sacrifice his own soul to save the whole world, is, as it seems to me, illogical in all his inferences, collectively. Logic is rooted in the social principle."

  Three things I would like your help sorting out, in some depth rather than in outline:

  1. Reconstruct, as explicitly as you can, the chain of inference running from "death makes the number of our risks... finite" to the conclusion that "logicality inexorably requires that our interests shall not be limited." Where does the argument need a suppressed premise to go through, and what would that premise have to say?

  2. Is this best read as a genuine repair of frequentism's single-case problem, or does it tacitly concede that frequentism cannot ground single-case probability at all and simply relocate the difficulty onto ethics? Defend your reading against the most obvious objection to it.

  3. Popper introduced propensity theory partly to handle the very single-case difficulty Peirce starts from here, while a subjectivist would say the difficulty never arises, since credence is well-defined for single cases from the outset. Does Peirce's communitarian move anticipate anything in propensity theory, or does it belong to a different strategy altogether?

  I would rather have your own close reading of the argument than a general survey of how frequentism is usually characterized.
