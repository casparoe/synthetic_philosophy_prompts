  I should emphasize that *without* constraints on UTMs, Solomonoff is radically subjective. Any "principled" machine choice (e.g., based on physical realizability) smuggles in empirical assumptions—exactly what induction was supposed to justify. That's the vicious circle. 

  The user might appreciate linking this to Wittgensteinian rule-following: no formal system fixes its own interpretation. Even if Solomonoff picks "green," it doesn't know *why* that corresponds to our world's regularities. The machine's "naturalness" is parasitic on our embodied experience. 

  ...I’ll structure the rebuttal as: 
