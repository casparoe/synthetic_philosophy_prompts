  Notably, the user didn't request epistemology questions (e.g., whether surveys access concepts or just intuitions) or cross-cultural variations - wise, as those could derail the focus. I'll stick strictly to their three pain points while weaving in lesser-known studies like Guglielmo's blame-mitigation work or Hitchcock/Knobe's competence norms to surprise the guest.

