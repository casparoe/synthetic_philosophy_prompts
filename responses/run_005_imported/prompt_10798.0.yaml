answer: |-
  Here are 8 targeted questions designed to press the sore spots in the classic Knobe Effect interpretation, complete with sharp follow-ups anticipating common defenses:

  1.  **The Norm-Violation Challenge (Sripada/Konrath):** "Your work argues moral badness *specifically* shapes the folk concept of intentional action. But studies show violating *non-moral* norms – like a CEO ignoring a silly rule about font color that causes a side-effect – also increases 'intentionally' judgments. Doesn't this suggest it's norm-violation *in general*, not uniquely moral badness, doing the conceptual work?"
      *   **Likely Defense:** "Ah, but moral norms are *special*; they have a different weight/authority."
      *   **Follow-Up:** "What specific empirical evidence demonstrates that moral norms trigger a *qualitatively different cognitive mechanism* for attributing intentionality compared to other salient norms, rather than just being a stronger instance of the same norm-sensitivity mechanism? How do we rule out a 'strength-of-norm-violation' account?"

  2.  **The Pragmatic Blame-Language Objection (Adams, Steadman):** "Critics like Frederick Adams argue that when people say the chairman harmed the environment 'intentionally,' they aren't revealing a *conceptual truth* about intentional action, but engaging in pragmatic blame-enhancement – using 'intentionally' as a rhetorical intensifier. How do you rule out this purely pragmatic explanation for the asymmetry in judgments?"
      *   **Likely Defense:** "The effect is robust across contexts and persists even when blame isn't the focus. People genuinely *judge* the action as intentional."
      *   **Follow-Up:** "But doesn't the fact that people readily *deny* using 'intentionally' for blame when explicitly asked (Guglielmo & Malle) suggest it's often an unconscious pragmatic move? If 'intentionally' functions as a reliable *blame-marker* in discourse, how can we be sure survey responses aren't capturing *this pragmatic role* rather than a core conceptual component?"

  3.  **The Legal Implications & Conceptual Contamination:** "If the folk concept of intentional action is genuinely 'morally contaminated' as you argue, what are the implications for how juries and judges assess *mens rea*? Should the law actively *correct* for this bias when determining legal intent, perhaps instructing juries to ignore moral valence, or even abandon the folk concept altogether?"
      *   **Likely Defense:** "The law already has refined legal definitions distinct from folk concepts. Juries are instructed on these definitions."
      *   **Follow-Up:** "But juries are instructed using *words* like 'intentional' and 'knowing,' which your research suggests carry inescapable folk meanings biased by moral evaluation. If the contamination is deep and automatic, can legal instructions realistically overcome it? Doesn't this inherent bias risk unjust outcomes, especially where moral disapproval is high but specific intent is weak (e.g., controversial self-defense cases)?"

  4.  **The Competence/Performance Distinction:** "Some argue the Knobe Effect reveals a performance error – how people *apply* the concept under certain conditions (moral emotion) – not the structure of the concept *itself*. How do you demonstrate that moral judgment alters the *core competence* of the intentional action concept, rather than just influencing its deployment?"
      *   **Likely Defense:** "The effect is systematic, predictable, and reflects genuine intuitions about the concept's application conditions."
      *   **Follow-Up:** "If it's truly about competence, shouldn't people, upon reflection or with minimal training, recognize their judgment as mistaken when the asymmetry is pointed out? Yet, many don't. Doesn't this persistence suggest the moral evaluation *is* constitutive of their operative concept in these cases?"

  5.  **The "Skill" or "Expectation" Alternative (Hitchcock & Knobe later work?):** "Could the asymmetry stem from judgments about the *agent's skill* or *expectation management* rather than intentionality *per se*? We might judge the harming CEO as having a higher degree of skill/knowledge in bringing about the bad outcome, making it seem more 'under his control,' which gets mislabeled as intentionality."
      *   **Likely Defense:** "Skill and knowledge are components of intentional action! Our judgments track the complex conditions required."
      *   **Follow-Up:** "But in the classic vignettes, both CEOs *know* the side-effect and *choose* to proceed. If skill/knowledge/control are held constant descriptively, why does the moral valence shift the *intentionality* judgment specifically? Doesn't this suggest the moral valence is acting *directly* on the intentionality component, not just via skill/knowledge?"

  6.  **The "Counterfactual Robustness" Challenge:** "If the folk concept is genuinely morally loaded, altering the core *meaning* of 'intentional,' wouldn't we expect this asymmetry to hold robustly across *all* variations of the scenario? Yet, tweaking details – like making the side-effect extremely unlikely or the benefit negligible – can sometimes weaken or eliminate the effect. Doesn't this context-dependence undermine the claim of deep conceptual penetration?"
      *   **Likely Defense:** "It shows the concept is complex and sensitive to multiple factors, but moral valence remains a powerful and primary one."
      *   **Follow-Up:** "If moral valence is fundamental to the *concept itself*, why is its effect so easily modulated by these other factors? Doesn't this suggest moral valence is more of a powerful *input* or *influencer* on the application of a concept whose core structure *isn't* inherently moral?"

  7.  **The "Why Not All Bad Things?" Challenge:** "If moral badness directly shapes the concept, why don't we see symmetrical 'intentionality inflation' for *all* foreseen negative side-effects? Why is the effect so strong for *harming* the environment but less pronounced (or even reversed) for, say, *failing to help* it in structurally similar scenarios?"
      *   **Likely Defense:** "The effect tracks *blameworthiness*. Harming is typically seen as more blameworthy than merely failing to help."
      *   **Follow-Up:** "Doesn't this concession actually support the pragmatic/rhetorical blame-enhancement view? It seems the 'intentionality' judgment is tracking the *degree of blame we want to assign*, rather than revealing an independent conceptual truth about the action's structure."

  8.  **The Burden of Proof:** "Given the existence of plausible rival explanations (norm-violation, pragmatics, skill/control judgments) that don't require positing a fundamental moral contamination of the *concept* of intentional action, what specific evidence or argument definitively shifts the burden of proof onto these rivals and conclusively supports your conceptual penetration thesis?"
      *   **Likely Defense:** "The sheer robustness and intuitiveness of the asymmetry across cultures/settings, and the failure of purely pragmatic accounts to explain all the data (e.g., reaction times, neural correlates)."
      *   **Follow-Up:** "But couldn't a sophisticated *pragmatic competence* model (explaining *when* and *why* we deploy 'intentionally' as a blame-marker) also account for robustness and intuitive feel? If both conceptual and pragmatic theories can explain the data, isn't the more parsimonious explanation the one that doesn't require fragmenting or morally loading a core action concept?"

  **Key Principles Used:**

  *   **Specificity:** Questions name rival theorists and specific experiments (Sripada/Konrath, Adams, Guglielmo/Malle, Hitchcock/Knobe).
  *   **Anticipation:** Follow-ups are designed based on standard defenses offered by proponents of the conceptual penetration view.
  *   **Pressure Points:** Focused on empirical counter-evidence (non-moral norms), alternative mechanisms (pragmatics, skill/control), logical implications (legal system), and internal consistency (context-dependence, asymmetry types).
  *   **Stakes:** Highlighting the real-world consequences (legal implications) makes the debate concrete.
  *   **Clarity:** Avoids jargon where possible, framing complex ideas accessibly.

  Use these to push beyond the standard vignette rehash and delve into the genuine philosophical and empirical controversies surrounding this fascinating effect. Good luck with the taping!
