  Okay, the user is a PhD student in philosophy focusing on promissory obligation. They're stuck on a debate between housemates Owen and Nadia about whether a promise to oneself is binding. Let me unpack their arguments step by step.

  First, Nadia claims Owen broke a promise by playing poker after declaring he quit. She emphasizes the verbal commitment and intent. Owen counters that self-promises lack an external enforcer, so they're not binding. Here, I need to analyze if the act of speaking aloud creates an obligation even without another party. Philosophical views like Searle's speech acts might apply here—uttering "I promise" could create an intention, but without a second party, it's not a true promise.

  Next, Nadia points out Owen hid his relapse, suggesting guilt and awareness of wrongdoing. Owen compares it to New Year's resolutions, where guilt is self-directed, not moral. The key here is distinguishing personal disappointment from moral obligation. Owen's hiding might indicate perceived obligation, but is that sufficient? Philosophers like Thomas Hobbes might argue self-promises lack the mutual covenant necessary for obligation.

  Then, Nadia argues that without self-binding commitments, long-term goals like saving money become impossible. This touches on the practical necessity of self-trust. Owen responds by comparing it to other self-imposed rules like diets, where lapses aren't moral failures. He sees it as willpower, not ethics. The ambiguity here is between moral obligation and personal resolve. Maybe the distinction lies in whether the promise creates a duty or just a personal goal.

  The user might be seeking clarity on the nature of promises—whether they require two parties intrinsically. They also might need unexplored angles, like the role of social context. Owen made the promise in front of Nadia, which adds a witness, potentially making it a social commitment even if not directed at her. Also, the concept of "second-personal reasons" from Stephen Darwall could apply, where obligations arise from mutual recognition, which self-promises lack.

  Overall, Owen's argument holds stronger because without a second party, there's no one to release the promisor or claim a right. Self-commitments are about integrity, not obligation. But Nadia's point about hiding suggests social elements, though not sufficient to create a binding promise. The verdict leans towards Owen.
answer: |-
  Let's break down the exchange move by move, analyzing the core arguments and identifying potential ambiguities:

  **(1) Nadia:** Claims Owen broke a promise because he declared it out loud and meant it.  
  *Analysis:* Nadia emphasizes the performative aspect (uttering "I promise") and the speaker's intention. This resonates with speech-act theories (e.g., Searle) where uttering certain words under appropriate conditions creates an obligation. **However**, the critical weakness is the *audience*. Standard promise theory requires a promisee who gains a right to performance. Owen *addressed himself* as both promisor and promisee, which is structurally anomalous. **Verdict: Slight edge to Owen.** While the declaration has psychological weight, the lack of a distinct promisee weakens the claim of a "real" promise creating an obligation *to another*. Nadia conflates a solemn declaration of intent with a promise.

  **(2) Owen:** Argues self-promises aren't genuine because they lack a distinct party to hold you accountable or be wronged.  
  *Analysis:* Owen hits the core of most philosophical accounts (e.g., Hume, Rawls, Raz, Owens): promises create *relational* obligations. The promisee gains a right, and the promisor owes performance *to them*. Self-promises lack this relational structure. No one else is wronged or entitled to release; only self-disappointment occurs. **Verdict: Owen.** This accurately reflects the standard conceptual framework for promissory obligation requiring two distinct agents.

  **(3) Nadia:** Points to Owen's secrecy as evidence he felt bound, not just revisiting a preference.  
  *Analysis:* Nadia shrewdly identifies behavior suggesting *guilt* rather than mere regret, implying an internalized sense of obligation. This speaks to the phenomenology of self-commitment. Hiding suggests Owen perceived his act as *wrongdoing*, not just a change of mind. **Verdict: Nadia.** Owen's behavior provides strong psychological evidence that *he experienced* the declaration as binding in a way distinct from ordinary preferences, even if the *philosophical justification* for that feeling is debatable.

  **(4) Owen:** Counters that feeling bad doesn't prove a wronged party; New Year's resolutions provoke similar guilt without obligation to others.  
  *Analysis:* Owen effectively distinguishes *moral guilt* (implying wronged others) from *personal disappointment/shame*. Many self-improvement failures feel awful without involving violated obligations *to others*. His analogy is apt. **Verdict: Owen.** He correctly identifies the ambiguity of guilt feelings. Nadia hasn't shown why Owen's guilt stems from a *moral obligation* rather than personal failure or shame.

  **(5) Nadia:** Argues that if self-commitments lack binding force, long-term projects (training, saving) become impossible, as you could always release yourself. The demanding nature *requires* self-binding.  
  *Analysis:* Nadia raises a profound practical and existential point about agency and integrity. If we can *always* instantly release ourselves from self-promises, the concept of *commitment to future selves* seems hollow. This challenges the sufficiency of purely relational accounts for explaining personal resolve. **Verdict: Nadia.** She highlights a crucial gap in Owen's (and standard promise theory's) account: the need for a concept of *intrapersonal commitment* that isn't merely prudential but involves a normative demand on oneself, crucial for identity and projects.

  **(6) Owen:** Distinguishes self-imposed rules (diets, budgets) from promises. Lapses are failures of willpower, not moral betrayals; reserving "broken promise" for interpersonal contexts avoids inflation.  
  *Analysis:* Owen makes a vital conceptual distinction. Treating all self-commitment failures as "broken promises" dilutes the specific moral force of interpersonal promises. Self-regulation involves different norms (prudence, discipline, integrity) than the distinct moral obligation created by promising *to another person*. **Verdict: Owen.** He successfully defends the conceptual boundary. Calling a diet lapse a "broken promise to myself" adds little explanatory power and risks confusing different normative domains (moral vs. personal integrity/prudence).

  **Hidden Ambiguity:** The core ambiguity is the **nature of "binding" force**.  
  *   **Nadia** focuses on the *internal, first-personal* experience of being bound: the feeling of obligation, guilt upon lapse, and the practical necessity for commitment to future projects. She conflates *solemn commitment* or *resolution* with *promise*.  
  *   **Owen** focuses on the *relational, second-personal* structure of promises: creating rights and duties *between* individuals. He equates "binding" strictly with this interpersonal moral obligation.

  **Missing Consideration:** Neither fully explores the **role of the witness (Nadia)**. While Owen promised *himself*, he did it *in front of Nadia*. This introduces a social dimension. Did Owen implicitly make a *representation* to Nadia about his future conduct, inviting her reliance or judgment? This shifts the focus from a self-promise to potentially creating an expectation or assurance *to Nadia*, which might ground a different kind of obligation (e.g., to not mislead, or to maintain consistency in one's declared character). Owen's secrecy supports this interpretation. This moves the debate away from pure self-promising towards social accountability for public declarations.

  **Overall Verdict:** While Nadia makes compelling points about the psychology and practical necessity of self-commitment (steps 3 & 5), Owen more accurately captures the *specific conceptual structure of promissory obligation* as understood in the dominant philosophical tradition, which requires distinct parties (steps 1, 2, 4, 6). Promises create *interpersonal* rights and duties. Solemn resolutions to oneself are existentially and practically crucial but operate under a different normative logic – one of integrity, prudence, or commitment to one's future self, not promissory obligation in the strict sense. Owen's behavior was weak-willed and perhaps dishonest (in hiding it from Nadia after his public declaration), but it didn't constitute breaking a *promise* in the philosophical sense Nadia asserts.

  \answer{Owen}
