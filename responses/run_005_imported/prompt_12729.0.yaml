answer: |-
  Here’s a toast draft weaving her commitment into a tribute that honors the wager, respects the impossibility, and resonates with both halves of the room. Aim: ~6.5 minutes, warmth with intellectual heft, and one subtle "glance moment" for the legal crowd.

  ---

  **(Clink glass gently, warm smile)**  

  Friends, family, colleagues, Mom – thirty-four years. Thirty-four years of briefs, arguments, deliberations, and… well, more than a few raised eyebrows in chambers. **(Gentle laughter)**. Today, we celebrate not just a retirement, but a remarkable career defined by a fierce, unwavering light – the light of *reason*.  

  Mom, to your clerks, your colleagues, and frankly, to anyone who ever watched you dissect a problem over Sunday dinner, you embody a profound truth: **how** we decide matters just as much as **what** we decide.  

  You taught us – and I mean this literally in my classroom, and figuratively to everyone here – that truth isn’t always a single, simple switch you flip: "Guilty" or "Not Guilty," "Liable" or "Not Liable." Sometimes, truth is built brick by careful brick. Was there a duty? Was it breached? Did that breach cause the harm?  

  **(Lean in slightly, conversational but clear)**  
  Now, I know some of your fellow judges might have occasionally sighed, just a little, when you insisted on voting on *each* of those bricks separately before declaring what the whole wall looked like. *(Nod knowingly towards the judges/lawyers section)*. Why not just take one vote on who wins and be done with it? It seems faster, cleaner.  

  But you knew something fundamental. You knew that sometimes, if you only vote on the final outcome, the *reasons* can get lost in the shuffle. Three thoughtful people, each perfectly logical on their own, can find themselves forced into a collective verdict that feels… disconnected from the path they took to get there. It’s a strange quirk of group decisions. Lawyers have a name for it. Philosophers study it. Mom? She *lived* it.  

  **(Shift tone: More personal, reflective)**  
  She famously told her clerks, “I would rather lose a case than lose the reasons for it.” Think about the courage in that. In a world obsessed with winners and losers, outcomes and bottom lines, Mom bet on the *process*. She wagered that meticulously building the verdict, step-by-step, issue-by-issue – even if it was harder, even if it sometimes led to a different result than the quick vote – was worth it. Worth it because it preserved the integrity of the reasoning. Worth it because it ensured the law wasn’t just applied, but *understood*, in all its intricate detail.  

  **(The "Glance Moment" - Delivered slightly drier, directly to the legal crowd)**  
  And yes, as those former clerks still discuss, there was that time where voting brick-by-brick led one panel down a different path than voting on the whole building would have… proving that sometimes, you *can* win the battle on the facts but lose the war on the outcome, or vice versa. **(Pause briefly, allow the knowing glances/little nods among lawyers/judges)**.  

  **(Crucial Shift: Addressing the Impossibility & The Wager)**  
  Mom understood something profound scholars later formalized: there’s no magic voting machine. No perfect system that guarantees we’ll always preserve every good thing – consistency, fairness, efficiency – when combining individual judgments into one collective decision. It’s an impossible puzzle. A beautiful, frustrating impossibility.  

  **(Tone: Warm admiration, respect)**  
  **Her issue-by-issue vote wasn’t her claiming to *solve* that puzzle.** It wasn’t her saying colleagues who voted differently were wrong. It was her **considered wager**. Her profound choice about *what to prioritize* in the face of that impossibility. When the gears of collective reasoning inevitably grind in tension, she chose to sacrifice the simplicity of the quick outcome vote to protect the clarity, the accountability, the very *structure* of the legal reasoning itself. She bet on the bricks.  

  **(Broaden out: Connect to Universal Values)**  
  And isn’t that just… *her*?  
  *   To the neighbors and choir friends: It’s the same care she brought to planning the block party, making sure every detail reflected the community spirit.  
  *   To the grandkids: It’s the same patience she shows explaining *why* the sky is blue, not just saying it is.  
  *   To all of us: It’s a deep belief that **how** we build things – a verdict, a community, a family – matters as much as the final product. That the integrity of the process *is* part of the result.  

  **(Rising to the Close)**  
  So, Mom, we raise our glasses to thirty-four years of building verdicts, brick by reasoned brick. To your unwavering commitment to the *why*, even when the *what* might have been reached another way. To your courage in making that wager – choosing the harder path of meticulous reason, knowing perfection wasn't possible, but believing the pursuit of clarity and accountability was worth every moment.  

  You showed us that in law, as in life, **the reasons are the legacy**.  

  To Judge [Mother's Name]! May your retirement be filled with all the well-reasoned joy you so richly deserve!  

  **(Raise glass high)** Cheers!  

  ---

  **Why this works:**

  1.  **Accessible Analogy:** "Bricks vs. Building" is concrete. Non-experts grasp the step-by-step vs. final vote idea. Lawyers/philosophers see the doctrinal paradox/discursive dilemma instantly.
  2.  **Honors the Wager:** Explicitly states her approach was a *choice* about what to prioritize in the face of impossibility ("considered wager," "sacrifice simplicity," "chose to protect"). Avoids implying a "solution."
  3.  **Mom's Voice:** Directly quotes her key principle ("lose a case... lose the reasons").
  4.  **The Glance Moment:** The slightly drier delivery of "win the battle on the facts but lose the war on the outcome" is classic legal understatement referencing a known case type. Lawyers will get the specific allusion and appreciate the phrasing.
  5.  **Universalizes the Value:** Connects her judicial habit to broader values of care, patience, process, and integrity applicable to neighbors, family, and life generally ("how we build things... matters").
  6.  **Warmth & Celebration:** Starts and ends with personal warmth and celebration. The "core" section is substantive but framed as admiration for *her* character and commitment.
  7.  **Respects Colleagues:** Explicitly notes it wasn't about claiming others were wrong ("wasn’t her saying colleagues who voted differently were wrong").
  8.  **Length & Tone:** Designed to be read aloud in 6-7 minutes. Mixes conversational warmth with moments of respectful gravity.

  **Key Adjustments:**
  *   Insert her actual name at the end!
  *   Practice pacing. The "glance moment" needs a slight pause after.
  *   Adjust the "neighbors/choir/grandkids" examples if others fit better, but keep the universalizing intent.

  This toast makes the paradox *active* – not a quirky footnote, but the central metaphor illuminating her judicial philosophy and personal character, celebrating the wager inherent in her career-long commitment.
