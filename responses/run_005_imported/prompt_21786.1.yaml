answer: |-
  You've hit on one of the most fascinating tensions in moral discourse: the interplay between logical validity, moral standing, and human psychology. Your wife is **technically correct on pure logic**, but your gut feeling points to something deeper about **moral authority and hypocrisy** that philosophers have wrestled with for centuries. Here's a breakdown:

  ### 1. **The Logical Core (Your Wife's Point)**
     - **Tu Quoque Fallacy**: Your brother-in-law accused you of *argumentum ad hominem tu quoque* ("you also"). Logically, pointing out his hypocrisy **does not absolve you** of responsibility for skipping the party. The truth-value of "You skipped an important event" is independent of the accuser's behavior.
     - **Separate Issues**: Whether you acted wrongly (Issue A) and whether your brother-in-law has standing to accuse you (Issue B) are distinct questions. Philosophers like J.L. Mackie would argue that Issue A must be addressed on its own merits.

  ### 2. **Why Your Gut Feels Right (The Moral Psychology)**
     - **Hypocrisy as a Poisoned Well**: While hypocrisy doesn't *disprove* the accusation, it **corrodes moral credibility**. Thinkers like Scanlon emphasize that criticism carries weight only if the critic is *committed to the norm they're invoking*. Your brother-in-law's pattern suggests he doesn't genuinely value attendance norms—he's weaponizing them selectively.
     - **The "Standing" Principle**: In moral philosophy (e.g., Wallace, "Hypocrisy, Moral Address, and the Equal Standing Principle"), we often lack *standing* to blame others for violations we routinely commit. Your brother-in-law’s history means he forfeits the right to *perform the moral act of blaming you*, even if the underlying norm (attend family events) is valid.
     - **Power Dynamics**: Hypocritical accusations can be tools of control. By dismissing his own record with "that’s got nothing to do with it," he avoids accountability while demanding it from you—a classic double standard noted by philosophers like Cheshire Calhoun.

  ### 3. **The Scientific Analogy You'll Appreciate**
     Think of it like an experiment:
     - **Hypothesis**: "Family members should prioritize key events."
     - **Your Data Point**: Skipped 1 event.
     - **His Data Set**: Skipped multiple high-stakes events (mother's 70th, Thanksgivings, nephew's birthday).
     - **Confounding Variable**: His claim that his record is irrelevant is like ignoring calibration errors in his measuring instrument. His inconsistency makes his application of the norm suspect—even if the norm itself holds.

  ### 4. **A Philosophical Middle Path**
     - **Separate the Issues** (as your wife urges):  
       *"You're right that missing the party was my responsibility, and I regret disappointing [niece]. I'll apologize to her."*  
       (This addresses Issue A cleanly.)
     - **Then Challenge the Hypocrisy** (as your gut demands):  
       *"But Frank, when you bring this up while dismissing your own history of missing events, it feels like you're holding me to a standard you reject. If we value family time, let's both commit to doing better—starting with you acknowledging your pattern."*  
       This refuses to let hypocrisy hide behind logic.

  ### Why This Bothers You as a Scientist
  You're trained to spot **systemic inconsistencies**. A critic applying a principle *selectively* triggers your instinct that their model is flawed—even if the underlying principle (family attendance) has merit. His "that's got nothing to do with it" feels like ignoring a control variable.

  ### Conclusion
  Your wife is right that **his hypocrisy doesn't exonerate you**—but you're also right that **his hypocrisy invalidates *his role* as accuser**. The solution? Address the accusation directly (own your action), then refuse to let the hypocrite control the moral high ground. Philosophers from Aquinas to modern ethicists agree: while hypocrisy doesn’t negate truth, it *does* undermine the hypocrite’s moral community. 

  What happened wasn’t just about logic—it was about **who gets to speak for the family’s values**. And on that, your gut nailed it.
