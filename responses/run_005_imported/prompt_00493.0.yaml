  so i was reading about that parfit teleporter thought experiment, where the machine scans your body, destroys it, then builds an exact copy on mars. seems pretty obvious to me that this proves teleporting is just death plus making a clone that thinks its you. if thats the conclusion parfit reached, why do philosophers still treat this like some open question instead of just admitting teleporters are murder machines and shoudnt be used?
