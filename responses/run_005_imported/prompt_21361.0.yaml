  First, I need to recall Leibniz's core principles. He was all about sufficient reason and indiscernibles. For him, if two things are identical in all properties, they must be the same thing. That's why he rejected absolute space—shifting the entire universe wouldn't change anything observable, so absolute space is meaningless. 

