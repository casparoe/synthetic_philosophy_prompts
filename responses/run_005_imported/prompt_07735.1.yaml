answer: |-
  You've hit on a profound and persistent critique in philosophy of science. Let's dismantle the Fresnel-to-Maxwell poster child for structural realism (SR), exposing why it fails as a robust defense against Laudan's pessimistic meta-induction (PMI). We'll attack on three fronts: **ontological rupture masquerading as structural continuity, the underdetermination and plasticity of "structure," and the cherry-picking problem that creates a new PMI against SR itself.**

  ## Core Argument: The Fresnel-to-Maxwell Transition is NOT Structural Continuity

  1.  **The Illusion of Syntactic Similarity Hides Semantic and Ontological Rupture:**
      *   **Fresnel's Ontology:** Light = *transverse mechanical vibrations* propagating through an all-pervading, material *elastic-solid luminiferous ether*. The equations described the displacement of this solid medium.
      *   **Maxwell's Ontology:** Light = *coupled, self-sustaining oscillations* of *electric and magnetic fields* propagating *through empty space* (or matter, conceived very differently). The ether, as a material mechanical medium, is *eliminated*, not reinterpreted. Fields are fundamentally new ontological entities.
      *   **The Equations Themselves:** While the *form* of Fresnel's equations for reflection/refraction coefficients bears a striking *syntactic resemblance* to the results derived from Maxwell's equations for the same phenomena, this is superficial.
          *   **Operational vs. Fundamental:** Fresnel derived his equations *from* his mechanical ether model. Maxwell derived formally similar equations *from* a radically different fundamental theory (his field equations: ∇·E = ρ/ε₀, ∇×E = -∂B/∂t, ∇·B = 0, ∇×B = μ₀J + μ₀ε₀∂E/∂t). The Fresnel equations are *consequences* or *approximations* within Maxwell's theory under specific conditions (e.g., linear, isotropic media), not its core structure.
          *   **Meaning of the Symbols:** In Fresnel's equations, the symbols represented mechanical displacements and properties of the elastic solid. In Maxwell's context, the *same symbols* now represent components of the electric and magnetic fields and properties of the electromagnetic medium (permittivity ε, permeability μ). The *physical meaning* of the variables and parameters underwent a revolutionary change. The "structure" is preserved only if you strip the mathematics of *all* physical interpretation – but then, what is "structural realism" *about*?
          *   **Loss of Causal Mechanism:** Fresnel's structure was inextricably linked to a specific causal mechanism (elastic vibrations). Maxwell's structure describes a completely different causal mechanism (field interactions). SR claims the "structure" is what's real, but the causal power attributed to that structure was utterly false in Fresnel's case.

  2.  **What "Structure" Survives? The Problem of Granularity and Underdetermination:**
      *   **Which Level of Structure?** Is "structure" the high-level phenomenological equations (Fresnel's reflection formulas)? Or the mid-level dynamical equations (wave equations)? Or the fundamental theoretical structure (Navier-Cauchy elasticity theory vs. Maxwell's field equations)?
          *   The *phenomenological* equations (Fresnel's formulas) survived. But PMI targets *fundamental* theories. If SR only saves *phenomenological* structure, it concedes Laudan's point about fundamental ontology being wrong and offers a weak realism.
          *   The *fundamental* structures are utterly different: continuum mechanics tensors vs. vector partial differential equations describing coupled fields. There's no meaningful structural continuity at this level.
      *   **Plasticity of Structure:** The formal similarity of the Fresnel equations only appears *after* Maxwell's theory is established. Could Fresnel's equations have been successfully embedded into a *different* successor theory, incompatible with electromagnetism? Almost certainly. The equations are compatible with various underlying mechanisms. Their "survival" doesn't uniquely point to Maxwell's *specific* structure as being "retained" or "approximately true"; it points to their being a useful *phenomenological tool* derivable from *multiple*, potentially incompatible, fundamental structures. This undercuts the realist claim.
      *   **"Structure" as a Vacuum:** If the "structure" is just the bare mathematical relationships devoid of the specific physical content Fresnel attributed to them (elastic displacements, ether properties), then what does SR claim *was* real about Fresnel's theory? A set of abstract relations? But these relations only gained their significance *from* the discredited ontology. Without it, the claim that *this specific structure* was the "real" part becomes arbitrary. Why *these* equations and not others within Fresnel's theory? The selection is retrospective.

  ## The Cherry-Picking Problem and the New PMI Against Structural Realism

  1.  **The Atypical Poster Child:** Worrall (and Poincaré) lean heavily on Fresnel/Maxwell precisely because it's an *exceptionally clean* apparent case. But PMI draws its force from the *graveyard*. What about:
      *   **Caloric Theory:** Highly successful thermodynamics (heat flow, gas laws). Its core "structure" (caloric as a conserved fluid) was *entirely abandoned*, replaced by kinetic theory and statistical mechanics. No structural continuity at the fundamental level.
      *   **Phlogiston Theory:** Successful explanations of combustion, calcination, respiration. Its core structure (release/absorption of phlogiston) was *inverted* by Lavoisier (absorption/release of oxygen). The mathematical structures (if any existed at that stage) didn't survive meaningfully.
      *   **Newtonian Gravitation:** Wildly successful. Its core structure (instantaneous action-at-a-distance force as fundamental) was *replaced* by the spacetime curvature structure of General Relativity. While Newtonian gravity is an approximation *under specific conditions*, the fundamental structure (force acting in flat space) is false, and the approximation breaks down severely in key domains (GPS, Mercury's orbit, cosmology). The mathematical *form* F=Gm₁m₂/r² survives only as a limiting case within a radically different structural framework.
      *   **Classical Mechanics -> Quantum Mechanics:** The core structure (deterministic trajectories in phase space) was *shattered*. While Ehrenfest's theorem shows *averages* behave classically, the fundamental structure of state description (wave functions/Hilbert space) and dynamics (Schrödinger equation, collapse) are revolutionary ruptures. Continuity exists only at a vanishingly abstract level (Poisson brackets -> Commutators) or in the macroscopic limit, not at the level of the theory's core ontology and dynamics.
  2.  **The New PMI Against Structural Realism:**
      *   Premise 1: Structural Realism (SR) proposes that the *mathematical structure* of successful theories is preserved (or approximately preserved) through theory change and is what we should be realist about.
      *   Premise 2: History shows numerous past scientific theories (Caloric, Phlogiston, Newtonian Gravity as fundamental, Classical Mechanics as fundamental) that were highly successful but whose *core mathematical structures were fundamentally abandoned or radically reinterpreted* in subsequent theories, not preserved. (The Fresnel case is the *exception*, not the rule).
      *   Premise 3: Therefore, by induction, it is likely that the *core mathematical structures* of our *current* best theories (Quantum Field Theory, General Relativity, Standard Model) will be fundamentally abandoned or radically reinterpreted in future theories.
      *   Conclusion: Therefore, we should *not* be structural realists about our current best theories. The structural realist's own strategy for rescuing realism from PMI is itself vulnerable to a meta-induction based on the failure of structural continuity in most historical cases. SR merely *shifts* the locus of pessimism from entities to structures.

  ## Why Fresnel Fails as a Rescue: The Metaphysical Work "Structure" Doesn't Do

  *   **"Structure" Without Anchors is Meaningless:** For Fresnel, the structure *was* the structure *of the ether*. The mathematics described the *behavior of a specific substance*. When the ether was discarded, the claim that "the structure was real" becomes mysterious. Real *for what*? If the structure isn't the structure *of* some entity or mechanism, what is its ontological status? SR struggles to answer this without smuggling in a thinly veiled ontology or collapsing into pure instrumentalism about mathematics. The mathematical relationships, divorced from the context that gave them physical meaning and causal power in Fresnel's theory, are just abstract formalism. Claiming *this specific formalism* was "the real part" is a retrospective imposition.
  *   **Continuity is Imposed, Not Discovered:** The apparent continuity between Fresnel and Maxwell is largely a product of *how we choose to present the history* and *which level of description we focus on*. If we focus on the fundamental explanatory mechanisms and ontologies, the discontinuity is stark. Structural realists focus on the phenomenological equations precisely *because* they survived, defining "structure" in a way that makes survival likely *only* for those rare cases where such equations *did* survive. This is circular and cherry-picks the evidence that fits the desired narrative of continuity. It doesn't demonstrate a *general* feature of theory change that defeats PMI; it demonstrates that *sometimes*, useful phenomenological tools persist.

  ## Conclusion

  The Fresnel-to-Maxwell transition is a fascinating historical episode, but it's a **profoundly misleading foundation** for Structural Realism's defense against the Pessimistic Meta-Induction. The apparent structural continuity is:

  1.  **Superficial:** Confined to high-level phenomenological equations, masking a radical ontological and fundamental structural rupture.
  2.  **Ambiguous:** The meaning of "structure" is ill-defined and plastic, allowing the same mathematics to be interpreted as evidence for continuity only after the fact, while ignoring its original (false) ontological grounding.
  3.  **Atypical:** It stands as a rare exception against a backdrop of historical cases (Caloric, Phlogiston, Newtonian Gravity, Classical->QM) where the core structures *were* abandoned, demonstrating that structural discontinuity is the historical norm for fundamental theories.
  4.  **Self-Undermining:** This reliance on a single, convenient, cherry-picked case opens SR itself up to a devastating *Pessimistic Meta-Meta-Induction*: just as past successful *theories* turned out to be fundamentally wrong, past successful *arguments for structural continuity* (based on specific historical cases) might also turn out to be poor guides, suggesting the structures we currently believe are preserved will likely be abandoned.

  Worrall's move doesn't rescue scientific realism; it merely relocates the battleground. The graveyard of past theories contains not just discarded furniture, but also shattered foundations and blueprints. The Fresnel case, upon rigorous examination, proves to be a fragile monument, unable to bear the weight of defending current theories against the profound historical challenge posed by Laudan. The force of the PMI remains largely intact: the deep structure of our best current theories is likely as provisional as their ontologies.
