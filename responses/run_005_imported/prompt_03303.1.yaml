  For names: "C" for conciliationist, "S" for steadfaster keeps it clean. The bill discrepancy ($120 vs $125) is deliberately small to maintain peer status. 

  The tricky part is making the meta-turn feel natural. Maybe have S refuse to conciliate in the first scenario, prompting C to accuse them of inconsistency. Then S flips it: "But you won't conciliate with ME about disagreement theory!" That should organically expose the paradox.

  Potential resolutions to consider:
