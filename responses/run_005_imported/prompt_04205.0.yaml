answer: |-
  You're right to be skeptical—your friend is collapsing two distinct projects: Borges's philosophical-literary exploration of time and Everett's physical theory. While the comparison isn't baseless, Borges wasn't "working out" a multiverse theory. Here's why:

  1.  **Borges's Goal Was Philosophical/Literary, Not Scientific:**
      *   Borges was obsessed with time's paradoxes, idealism (the mind-dependence of reality), labyrinths, infinity, and the limitations of human perception and language.
      *   "The Garden of Forking Paths" uses branching paths primarily as a **metaphor for narrative structure and choice**, inspired by detective fiction and Chinese philosophy. Ts'ui Pên's labyrinth *is* the nonlinear novel itself.
      *   "A New Refutation of Time" argues for **idealism and the unreality of time** based on solipsism and Berkeleyan philosophy. Its "refutation" is deliberately paradoxical and literary, aiming to unsettle our conventional understanding, not propose a scientific model. He dismantles linear time but doesn't replace it with a *physical* branching structure.

  2.  **Borges Embraced Paradox and Incompleteness; Physics Seeks Consistency:**
      *   Borges *delighted* in unresolvable paradoxes, infinite regresses, and self-contradictory systems (like the Library of Babel or the Book of Sand). His branching paths often lead to absurdity or collapse.
      *   Everett's Many-Worlds Interpretation (MWI) is a **serious attempt within quantum mechanics** to resolve the measurement problem *without* paradox. It's a formal, mathematical model predicting that all possible outcomes of quantum events *actually occur* in branching, non-communicating universes. It aims for logical consistency within physics.

  3.  **The Nature of "Reality" in Each:**
      *   Borges: Often questioned the very *reality* of a single, objective world. His branching paths are frequently presented as **mental constructs, fictional possibilities, or literary devices**. Reality, for Borges, is often a labyrinth of perceptions and texts. He wasn't arguing for the *physical existence* of branching worlds.
      *   Everett: MWI posits that the branching universes are **physically real**, even if empirically inaccessible from our branch. It's a claim about the fundamental structure of objective reality.

  4.  **Borges's Influences Were Philosophical/Literary, Not Scientific:**
      *   Borges drew heavily from Schopenhauer, Berkeley, Hume, Bradley (explicitly cited in "Refutation"), Zeno's paradoxes, mystics like Kabbalah, and literary figures like Chesterton and Kafka.
      *   While he read widely, there's no evidence he engaged deeply with the cutting-edge physics of his day (like quantum mechanics) in a way that would inform a *physical* model. His "branching" comes from narrative, logic puzzles, and metaphysics.

  **Why the Comparison Persists (and Where Your Friend Has a Point):**

  1.  **Striking Imagery:** The *visual metaphor* of branching paths/universes is undeniably similar. Both challenge linear, singular history.
  2.  **Rejection of Determinism:** Both undermine the idea of a single, predetermined future.
  3.  **Influence on Physicists:** Some physicists (like Bryce DeWitt) explicitly acknowledged Borges as an inspiration for *visualizing* or *popularizing* the *concept* of branching realities. This cemented the cultural link.
  4.  **Exploration of Possibility:** Both deal with the nature of possibility and actuality, though Borges does so metaphysically/literally, and MWI does so physically.

  **Conclusion:**

  Your friend overreaches. Borges did not "work out... the same branching picture of reality that physicists only formalized decades later." He was not a proto-physicist. Instead:

  *   Borges used branching paths as a **powerful literary and philosophical metaphor** to explore time, choice, narrative, infinity, and the unreliability of perception/reality.
  *   He dismantled linear time through **idealist philosophy**, not physics.
  *   Everett developed a **specific, mathematical physical theory** to explain quantum phenomena, proposing physically real branching universes.

  The comparison is valid at the **level of evocative imagery and a shared challenge to linear time/singular history**. Borges's work brilliantly prefigured the *conceptual space* and the *metaphorical language* that physicists later found useful for explaining MWI. He anticipated the *idea's cultural resonance*. However, he was not arguing for a *real, physical, branching multiverse* governed by quantum mechanics. The projects, methods, and claims about reality are fundamentally different. Attributing a scientific theory to Borges collapses his rich, paradoxical, literary-philosophical explorations into something they were not intended to be.
