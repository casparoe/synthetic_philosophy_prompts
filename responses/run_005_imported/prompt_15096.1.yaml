answer: |-
  ## OPINION: In re Disabled Veteran Surcharge Exemption Appeal  
  **Recommended Ruling:** Grant the exemption. The omission of "not" is a scrivener’s error, and enforcing the literal text would contravene unambiguous legislative intent while creating an absurd result.  

  ### I. The Textual Argument Has Merit But Is Overcome Here  
  The Department rightly emphasizes our duty to apply enacted text (*Chevron* deference is inapplicable to unambiguous statutes). Its concerns are valid:  
  - **Separation of Powers:** Courts/boards cannot rewrite statutes; corrections belong to the legislature.  
  - **Slippery Slope:** "Obviousness" is subjective. Permitting exceptions risks judicial policymaking.  
  - **Reliance Interests:** Tax authorities require clear rules to ensure uniform administration.  

  These principles ordinarily compel adherence to plain text. *But this case presents the rare exception where textual fidelity produces an outcome irreconcilable with legislative design.*  

  ### II. Overwhelming Evidence of Scrivener’s Error Warrants Correction  
  Four factors coalesce to prove the text reflects a drafting error, not intent:  
  1. **Explicit Legislative Disclaimer:** The reorganization committee report *repeatedly* stated "no substantive changes" were made. This is contemporaneous, authoritative evidence of intent.  
  2. **Historical Context:** Every prior version (including the immediate predecessor statute) contained the exemption. The provision’s *sole purpose* since inception was to *exempt* disabled veterans.  
  3. **Absurd Result:** Applying the surcharge contradicts 50+ years of consistent policy benefiting a protected class, undermining the statute’s remedial purpose.  
  4. **Ministerial Nature of Change:** Reorganization aimed to renumber and rephrase without altering substance. Deleting "not" during formatting is precisely the type of technical error such processes risk.  

  ### III. This Ruling Preserves Institutional Boundaries  
  We do not "correct" the statute. We *construe* it in light of irrefutable evidence that the text fails to convey the legislature’s intended meaning—a recognized exception to textualism (*Holy Trinity Church v. United States*). Courts routinely consult legislative history to resolve scrivener’s errors producing absurdity (*Public Citizen v. U.S. Dept. of Justice*).  

  **Limiting Principle:** This holding applies *only* where:  
  (a) Unambiguous legislative history (e.g., committee reports disclaiming substantive changes) contradicts enacted text;  
  (b) The textual anomaly arose from a non-substantive recodification;  
  (c) Enforcement would produce a result universally acknowledged as contrary to decades of settled law; and  
  (d) The error is grammatically apparent (e.g., a missing negation).  

  ### IV. Conclusion  
  The exemption is reinstated for Appellant. While the Department’s caution honors the rule of law, rigid textualism here would elevate a demonstrave typo over democratic intent, harming both the veteran and the legislature’s authority. We urge the Department to seek a technical corrective bill, but until then, equity and intent compel this outcome.  

  **VOTE:** Grant Appeal.
