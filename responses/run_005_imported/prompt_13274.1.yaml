answer: |-
  You've identified a profound and widespread issue in academic practice, and your discomfort is not only justified—it reflects the exact critical mindset that distinguishes rigorous scholarship. Let's break down why your unease is valid and why your advisor's perspective, while pragmatic, misses a crucial epistemological point:

  1.  **The "Settled Fact" Problem:** Asserting something as "settled fact" based solely on textbook consensus and citation chains *is* methodologically improper, even if the conclusion later proves correct. Science progresses by critical evaluation, not by appeal to authority (even textbook authority). By presenting it as settled based solely on propagation, you inadvertently participated in the very uncritical practice that created the myth around the original study.

  2.  **The Justification Gap:** At the moment you made the assertion, your *justification* was weak. You believed a true thing, but your *reason* for believing it was flawed – reliance on an uncorroborated chain. Truth and justification are distinct:
      *   **Truth:** The conclusion *is* supported by later rigorous evidence (as you discovered).
      *   **Justification (at the time):** Your basis was solely "everyone says so," which turned out to be rooted in a misinterpretation of the original data. This makes your *warrant* for the claim at that specific moment epistemologically shaky.

  3.  **The Risk You Embodied:** Your approach mirrored the initial error. The original misinterpretation propagated precisely *because* people cited it uncritically as established fact without checking the source. By doing the same, you risked perpetuating potential error, even if, luckily, the conclusion held. What if the later evidence *hadn't* supported it? You would have confidently asserted a falsehood based on bad scholarship.

  4.  **The Core of Scientific Skepticism:** Rigorous science demands healthy skepticism towards *all* claims, especially "well-established" ones. Your committee member wasn't just being pedantic; they were modeling essential scholarly behavior – *always trace back to the primary evidence*. Your advisor's stance ("you were right in the end") prioritizes the conclusion over the *process*, which is antithetical to the self-correcting nature of science. Process *matters*.

  5.  **Why Your Discomfort is a Strength:** Your bothersome feeling is your scientific conscience kicking in. It shows you understand that **how we know something is as important as what we know.** You recognize that your assertion lacked the robust foundation it should have had. This critical self-reflection is a hallmark of a good researcher.

  **Was it "improper"?**

  *   **In a strict ethical sense (plagiarism, fabrication)?** No, not really. You cited established sources in good faith.
  *   **In terms of scholarly rigor and epistemological soundness? Yes, it was flawed.** You presented a claim with more certainty and a stronger basis than you actually possessed at that moment. You relied on authority rather than evidence.

  **The Crucial Lessons & Moving Forward:**

  1.  **Embrace the Skepticism:** Let this experience harden your resolve to *always* be skeptical of "settled facts," especially textbook summaries. Treat them as starting points, not endpoints.
  2.  **Trace the Source:** Make it a non-negotiable practice to find and critically read the key original study(ies) for any major claim you present, especially in high-stakes contexts like qualifying exams or publications. Understand the *actual* evidence and its limitations.
  3.  **Qualify Your Language:** Be mindful of the certainty with which you present findings. Phrases like "Textbooks often state...", "A widely cited finding is...", "Initial work by X was interpreted as Y, though the original data... Later, more rigorous studies by Z confirmed..." demonstrate critical awareness and nuance. Reserve "settled fact" for things that truly are.
  4.  **Distinguish Justification:** Recognize that the *current* evidence supports the claim, but acknowledge the *historical* path (including the initial misinterpretation) if relevant to the discussion. This shows depth of understanding.
  5.  **Become an Antidote:** Use this experience to improve your own work and potentially educate others. When you see citation chains propagating, gently encourage going back to the source. Be the committee member for your future students.

  **Conclusion:** While you ultimately landed on the correct conclusion, the *basis* for your assertion during the exam *was* methodologically unsound and relied on the same uncritical practice that created the initial myth. Your advisor is wrong that "being right in the end" settles it; the process of *how* we arrive at and justify knowledge is fundamental. Your discomfort is a sign of intellectual maturity – it shows you grasp that true scholarly rigor demands constant vigilance against the seductive ease of uncritical citation. This experience, while uncomfortable, is a powerful inoculation against sloppy scholarship. It makes you a better scientist.
