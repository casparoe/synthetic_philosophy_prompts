answer: |-
  Good's theorem is a cornerstone of Bayesian decision theory, but its real-world applicability hinges critically on often-unstated assumptions. Let's dissect the theorem, its implications, and its limits—especially regarding your friend's concerns.

  ### I. Good's Theorem: The Formal Result
  *   **Agent:** A perfectly rational Bayesian decision-maker.
  *   **Assumptions:**
      1.  **Utility Maximization:** The agent has a well-defined utility function over outcomes, capturing *all* relevant values (pleasure, pain, wealth, health, peace of mind, etc.).
      2.  **Consistent Beliefs:** The agent has coherent prior probabilities over all relevant states of the world.
      3.  **Bayesian Updating:** Upon receiving new evidence, the agent updates beliefs strictly via Bayes' theorem.
      4.  **Instrumental Value Only:** Information is valued *solely* for its potential to change actions, leading to better outcomes (higher expected utility). Information has no *direct* positive or negative utility (e.g., joy of knowing, pain of bad news).
      5.  **Costless & Free:** Acquiring the information has zero cost (monetary, time, psychological, strategic).
      6.  **Perfectly Relevant & Truthful:** The information is perfectly accurate and directly pertains to the decision problem.
      7.  **Action Flexibility:** The agent is always free to choose any available action *after* receiving the information.
      8.  **No Strategic Interaction:** The agent's decision does not affect, nor is affected by, the decisions of other strategic agents (unless explicitly modeled in the states/actions/utilities).
  *   **The Theorem:** For such an agent, the **Expected Value of Information (EVoI)** for any free, relevant piece of information is *non-negative*. It is strictly positive if and only if there is a positive probability that learning the information will cause the agent to change their optimal action compared to acting without it.
  *   **Intuition:** Information can't force you to make a *worse* decision than you would have made without it. At worst, you ignore it and do what you would have done anyway (EVoI=0). If it *might* lead you to make a better choice, then on average, it helps (EVoI>0).

  ### II. Implications & Limits for Real-World Reasoning
  Good's theorem provides a powerful baseline: *if* all assumptions hold, seeking free, relevant information is never irrational. However, the real world often violates these assumptions, making "rational" ignorance possible or even advisable:

  1.  **Violated Assumption: Instrumental Value Only (Direct Utility of Information)**
      *   **Implication:** Information can directly impact utility. Bad news *hurts* intrinsically. Good news *feels good*. Ignorance *can* be bliss.
      *   **Example: Terminal Prognosis.** Knowing one has a terminal illness often causes significant psychological distress (anxiety, depression) *regardless* of whether treatment options change. This distress directly reduces utility. The theorem assumes utility depends *only* on the ultimate outcome (death), not on the psychological state *en route* to that outcome. If "living in hopeful ignorance" has higher utility *now* than "living with certain dread," avoiding the information can be rational. The theorem doesn't cover this direct disutility of knowing.
      *   **Application to Genetic Test:** Your friend might rationally believe that the *anxiety of knowing* she carries the gene (even before symptoms) would lower her quality of life *more* than the *anxiety of uncertainty* she currently experiences. The information's *direct* negative utility outweighs its potential instrumental value (which is zero, as no actions change).

  2.  **Violated Assumption: No Strategic Interaction / Action Flexibility**
      *   **Implication:** Information can constrain your future actions or alter how others strategically interact with you.
      *   **Example: Insurance Contract.** Ignorance can be a prerequisite for beneficial agreements. If both parties *knew* the high-risk individual was high-risk, the insurer wouldn't offer affordable coverage (or any at all), and the high-risk individual couldn't get insured. Mutual ignorance allows a Pareto-improving contract (both are better off insured at a "pooled" rate than uninsured). Learning the information *destroys the possibility of the beneficial agreement itself*. The theorem assumes the agent is a single decision-maker acting freely *after* learning. Here, learning changes the *strategic landscape* and eliminates desirable options. Ignorance preserves the valuable option of contracting.
      *   **Example: Negotiator's Reservation Price.** Knowing your own reservation price (the minimum you'll accept) can make you vulnerable. If you *learn* it definitively, you might inadvertently reveal it through body language or be pressured into disclosing it. Crucially, *not knowing* it precisely can make you a tougher negotiator – you genuinely don't know your absolute walk-away point, making bluffs more credible and concessions less likely. The theorem assumes the agent can freely choose the best action *after* learning. Here, learning might *cause* you to take a suboptimal action (revealing the price) *because* you now know it. Ignorance acts as a commitment device, preventing a tempting but suboptimal action.
      *   **Application:** In strategic settings, information can weaken your position or destroy valuable opportunities. Rational ignorance serves as self-commitment or preserves cooperative equilibria.

  3.  **Violated Assumption: Costless Information**
      *   **Implication:** Acquiring information often has costs (time, money, effort, psychological toll of anticipation).
      *   **Application to Genetic Test:** While the test itself might be free, the *process* of deciding, waiting for results, and coping with potential bad news carries significant psychological costs (anxiety, dread). If the instrumental value (chance of changing an action) is zero (no prevention/treatment), the net expected utility of testing is negative due to these costs. The theorem assumes zero cost, so it doesn't apply when costs exist.

  4.  **Violated Assumption: Perfectly Relevant & Truthful / Complex Beliefs**
      *   **Implication:** Information might be misinterpreted, ambiguous, or lead to belief distortions not captured by strict Bayesian updating (e.g., overconfidence after a negative test).
      *   **Application to Genetic Test:** A negative test might induce dangerous complacency ("I'm invincible"), while a positive test might lead to excessive, debilitating anxiety disproportionate to the actual risk timeline. This mis-calibration of beliefs *after* learning can lead to worse decisions (e.g., neglecting other health issues, abandoning life plans unnecessarily).

  5.  **Violated Assumption: Well-Defined Utility Function**
      *   **Implication:** Humans struggle to define utilities for complex, long-term, or existential outcomes. Preferences might be incomplete or context-dependent.
      *   **Application:** How does one *really* weigh 20 years of worry-free life against 30 years with a known high risk? The "rational" choice depends entirely on this personal, often inchoate, valuation.

  ### III. Where Your Friend's Examples Land

  1.  **Insurance Contract:** **Not a counterexample, but a limit case.** Good's theorem assumes a *single* decision-maker. The insurance case involves *strategic interaction between multiple agents*. The theorem doesn't apply to this multi-agent scenario. Ignorance is rational here *because* it enables a mutually beneficial outcome that would be destroyed by information revelation. This falls under strategic information economics/game theory.
  2.  **Negotiator's Reservation Price:** **Not a counterexample, but a limit case.** Again, involves strategic interaction. More importantly, it highlights how information can *cause* suboptimal actions (inadvertent revelation) that ignorance prevents. Ignorance serves as a commitment mechanism, a concept outside the scope of Good's basic theorem. The theorem assumes the agent *can and will* choose the optimal action *after* learning, which strategic pressure can prevent.
  3.  **Terminal Prognosis:** **Not a counterexample, but a limit case.** This directly violates the "Instrumental Value Only" assumption. The disutility comes from the *knowledge itself*, not from a changed action leading to a worse outcome. Good's theorem only considers the instrumental value of information for changing actions. The intrinsic pain of knowing bad news is a *direct* utility cost not accounted for in the theorem's calculation of EVoI.

  ### Conclusion for Your Friend

  Good's theorem powerfully demonstrates that for an idealized rational agent, *instrumentally valuable* information cannot be harmful. **However, your friend's reluctance is likely rational because:**

  1.  **No Instrumental Value:** Since a positive test wouldn't change her actions (no treatment/prevention), the instrumental EVoI is zero.
  2.  **Significant Costs:** The process involves psychological costs (anxiety, dread).
  3.  **Potential Direct Disutility:** Knowing she carries the gene could cause ongoing psychological distress ("the shadow of the future"), directly lowering her utility *now* and for potentially decades before any symptoms.
  4.  **Complex Utility:** Valuing "peaceful ignorance" vs. "burdened knowledge" is deeply personal and falls outside the theorem's narrow focus on action-driven outcomes.

  **Therefore, her decision hinges on a personal trade-off:** Is the reduction in *current* uncertainty worth the potential costs and burdens of knowing? Good's theorem doesn't compel testing when information has no instrumental value and carries potential costs or intrinsic disutility. Her reluctance is not irrational; it's a nuanced judgment about the nature of her own well-being in the face of unavoidable uncertainty. The strategic examples further illustrate that Good's theorem, while foundational, operates within a specific and often idealized framework that doesn't capture the full complexity of human decision-making, especially involving intrinsic costs of knowledge, strategic interactions, and self-commitment.**
