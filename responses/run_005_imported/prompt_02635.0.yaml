  Then confront each counterexample head-on. The insurance case likely breaks on non-strategic actors; the negotiation on self-commitment; the prognosis on utility-function misspecification. Crucially, I must flag where "rational" diverges from "psychologically optimal" - that's probably the heart of his friend's resistance. For instance, knowing one has a terminal illness might lead to depression, which isn't accounted for in a simple utility model of health outcomes.

  The response should validate that her examples aren't irrational - they reveal boundary conditions of the model. Maybe add that Good himself later explored limitations of his theorem. Ultimately, the genetic test case is thorniest: if utility includes psychological burden, her reluctance could be Bayesian-rational. That's the pivot from math to philosophy he needs.

