answer: |-
  Here is the strongest possible case for your friend's position, arguing that Lewis underestimates the explanatory power of his own "sloppy thinking" hypothesis (the conflation of punishment-as-debt due to practical tolerance of substitution for fines). The core argument is that the **absence of explicit, free-standing complaints about fines' vulnerability to substitution is entirely predictable and consistent with the hypothesis being true**, due to psychological, pragmatic, and conceptual factors Lewis overlooks. Its absence carries minimal evidential weight against the hypothesis.

  ### 1. **Practical Futility & Adaptive Acceptance: The "Why Bother?" Argument**
     * **The Hypothesis Implies Substitution is Inevitable for Fines:** Lewis's mechanism explicitly relies on the *impracticality* of preventing substitution for monetary penalties. If it's impossible or prohibitively costly to stop a third party from handing cash to the offender (who then pays) or even paying directly in many systems, complaining about this vulnerability is futile. People don't waste energy complaining about immutable facts of reality (e.g., "gravity makes things fall").
     * **Adaptation to the Status Quo:** Societies adapt their norms and expectations around practical constraints. Because substitution *cannot* be effectively policed for fines, it becomes tacitly accepted as a feature of the system, not a bug. People focus their normative energy on aspects of the system that *can* be changed. The lack of complaint reflects resigned acceptance of a practical reality, not a deep-seated moral endorsement of substitutability *as a principle of punishment*. This silence is evidence *for* the practical constraint driving the tolerance, not against the hypothesis explaining the origin of the conceptual confusion.

  ### 2. **Conceptual Opacity & the Embedded Metaphor: The "Invisible Framework" Argument**
     * **The Metaphor is Foundational, Not Superficial:** Lewis suggests the "debt of punishment" metaphor arises *because* of the practical tolerance for fines. If this metaphor becomes deeply embedded in the cultural and legal understanding of punishment (as he argues it has, influencing penal substitution theology), it ceases to be seen *as* a metaphor. It becomes the conceptual lens through which punishment itself is viewed.
     * **Complaints Target Symptoms, Not the Framework:** When people object to punishment (fines included), they object to *specific injustices* (excessive amounts, unfair laws, disproportionate impact on the poor) or *specific outcomes* (a rich offender escaping all hardship via a friend's payment). They rarely object to the *underlying conceptual structure* that makes the substitution seem unproblematic in the first place. Critiquing the foundational metaphor requires meta-ethical reflection that is uncommon in everyday discourse. The lack of *free-standing* complaints about substitutability doesn't mean people intuitively find it justified; it means the conceptual framework enabling it is so ingrained it's invisible. The sloppy thinking has succeeded in becoming the default mode of thought.

  ### 3. **Discourse Asymmetry & the Focus on Egregious Cases: The "Misdirected Outrage" Argument**
     * **Outrage is Reserved for the Unthinkable:** Lewis notes the profound intuition against substituting prison/death. This very strength directs moral outrage. When substitution *does* occur in egregious cases (e.g., a wealthy family paying a huge fine for a serious crime, allowing the offender to feel no consequence), outrage focuses on the *specific injustice* ("the rich get away with everything!") or the *leniency of the punishment type* ("fines are just a cost of doing business for them!"), not on the abstract permissibility of substitution *for fines as a category*. Complaints about fines being "unjust" because substitutable would require people to first isolate the substitutability feature from other factors (wealth inequality, perceived adequacy of fines as punishment), which is cognitively harder than reacting to concrete instances of perceived unfairness.
     * **Fines Exist in a Pragmatic Zone:** Fines serve multiple purposes: punishment, deterrence, revenue, and restitution. Their monetary nature makes substitutability pragmatically useful in some contexts (e.g., parents paying a child's library fine). This multi-functionality further obscures the purely *punitive* element that makes substitution conceptually problematic when applied to other punishments. Complaints about substitutability are drowned out by pragmatic acceptance and the focus on other, more salient issues like proportionality or ability to pay.

  ### 4. **The Christian Atonement Analogy as Reinforcement, Not Counterevidence: The "Cultural Blind Spot" Argument**
     * **Lewis's Own Example Undermines His Retraction:** Lewis identifies the "debt of punishment" metaphor as central to understanding penal substitution in Christian theology. This widespread, deeply held religious narrative *actively reinforces and sanctifies* the very conceptual conflation he hypothesizes. If a culture venerates a story where penal substitution is presented as the ultimate moral act (Christ's atonement), this creates a powerful background condition that *discourages* critical scrutiny of the underlying metaphor in *secular* contexts like fines. The metaphor isn't just a mistake; it's a culturally endorsed and valorized concept. Critiquing it feels like challenging a deep cultural/religious intuition, leading to silence or deflection rather than explicit complaint about fines. The absence of complaint in secular discourse is partly *because* the core idea is protected by its sacred counterpart.

  ### 5. **Cognitive Dissonance & Status Quo Bias: The "Don't Rock the Boat" Argument**
     * **Avoiding the Inconsistency:** The human mind seeks cognitive consistency. The stark asymmetry Lewis identifies (accept substitution for fines, reject it for prison) is uncomfortable. Acknowledging that tolerance for fine-substitution rests *only* on practicality and has led to a harmful conceptual confusion creates significant dissonance. It forces a re-evaluation of a settled practice (fines) and a cherished belief (penal substitution theology). It's psychologically easier to maintain the status quo by *not* articulating the complaint, leaving the inconsistency unexamined. The lack of explicit complaint is a form of dissonance reduction.
     * **The Pragmatism of Legal Systems:** Legal systems prioritize function and finality. Once a fine is paid, the case is closed. The system has little institutional incentive to question *who* paid, as long as payment occurs and the deterrent/revenue function is arguably partially met. This systemic pragmatism further discourages raising meta-level complaints about substitutability, as it offers no practical benefit to the functioning of the courts or legislature.

  ## Conclusion: Why Lewis's Retraction is Premature

  Lewis treats the absence of a specific complaint ("fines are problematic *because* they allow substitution") as strong evidence against the hypothesis that this very substitutability leads to a dangerous conceptual conflation. However, this absence is *precisely what the hypothesis predicts and explains*:

  1.  **Practical Futility:** Complaining about the unavoidable is pointless.
  2.  **Conceptual Invisibility:** The metaphor becomes the water we swim in; we don't see the framework itself as the problem.
  3.  **Misdirected Focus:** Outrage targets concrete injustices or other features, not the abstract permissibility of substitution for this punishment type.
  4.  **Cultural Reinforcement:** The valorized religious analogy protects the underlying metaphor from scrutiny.
  5.  **Cognitive Ease:** Avoiding the dissonance of the asymmetry is more comfortable than confronting it.

  The lack of explicit complaint isn't evidence the sloppy thinking *isn't* happening; it's evidence that the sloppy thinking has been *so successful* that the problematic substitutability of fines has been normalized, rendered pragmatically inevitable, and shielded by cultural narratives. Its absence doesn't falsify the hypothesis; it’s a symptom of the hypothesis being correct. Lewis gave up too quickly because he underestimated how deeply ingrained conceptual confusions become and how effectively practical constraints and cultural narratives suppress the articulation of the very critique his hypothesis implies. Your friend is right: the "sloppy thinking" hypothesis remains robust.
