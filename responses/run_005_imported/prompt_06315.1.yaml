prompt: |-
  The formal ethics reading group I'm part of has spent the last few weeks working through Harsanyi's aggregation theorem, and I want to sanity-check a framing I'm planning to use in a talk for our department's graduate workshop next month, since a couple of the group's members are decision theorists who won't let a sloppy statement of the theorem pass unchallenged. As I understand it, once both individuals and the social evaluator are required to have preferences over lotteries satisfying the von Neumann–Morgenstern axioms, the Pareto indifference condition forces the social utility function to be an affine combination of the individual utility functions. I've been presenting Harsanyi (1955) to the group as, in effect, a mathematical vindication of classical utilitarianism: any rational social planner who respects unanimous indifference among expected-utility maximizers is thereby committed to summing everyone's utility with equal weight, on pain of violating one of the axioms. On this reading, prioritarian or Rawlsian departures from equal-weight aggregation are not merely contestable value judgments but outright violations of rationality once uncertainty enters the picture.

  One of the economists in the group objected that this smuggles in more than the theorem actually delivers, gesturing at something about the weights being arbitrary depending on how each person's utility scale is normalized, and mentioned a "Harsanyi-Sen debate" that I have only encountered in passing footnotes. Before I build part of the talk around an "utilitarianism is mathematically mandatory" framing, could you help me work out whether the theorem really pins down equal weighting across individuals, or whether I am reading something into the axioms that is not there? If it is the latter, I would appreciate a precise account of what further assumption is needed to move from "some affine combination of individual utilities" to "the equally weighted sum," and how that gap bears on whether the theorem genuinely forecloses non-utilitarian views as irrational.
reasoning: |-
  Okay, the user is part of a formal ethics reading group and has been discussing Harsanyi's aggregation theorem. They want to present it as a mathematical vindication of utilitarianism, implying that any rational social planner must use equal weights for everyone's utilities. But an economist in their group pointed out issues with utility normalization and mentioned the Harsanyi-Sen debate. The user needs to ensure their framing is accurate before presenting at a graduate workshop.

  First, I need to recall Harsanyi's theorem. It requires both individuals and the social planner to have vNM-rational preferences over lotteries. Pareto indifference means if everyone is indifferent between two options, society must be too. The theorem shows the social welfare function is an affine combination of individual utilities. But affine combination means weights can be any real numbers, not necessarily equal. 

  The key point is normalization. vNM utilities are unique up to affine transformations. So each individual's utility scale can be shifted and scaled. The weights in Harsanyi's theorem depend on how these scales are set. For example, if you rescale one person's utility, their weight must adjust to keep the social ordering consistent. Therefore, without fixing a normalization, the weights are arbitrary. Equal weighting only makes sense if all utilities are on the same scale, like with a zero and unit.

  The user mentioned prioritarianism and Rawlsian approaches. Harsanyi doesn't rule these out as irrational because they might use different utility scales. For instance, prioritarianism could be seen as applying concave transformations to utilities, but that violates the vNM axioms since they require linearity in probabilities. So any non-linear social welfare function would conflict with the expected utility framework. 

  The Harsanyi-Sen debate is relevant here. Sen argued that the theorem assumes utilities are vNM, which are about choice under risk, not necessarily well-being. So the social weights based on these might not reflect ethical weights. For example, someone could be risk-averse in outcomes, making their vNM utility concave in wealth, but ethically, we might want to prioritize their welfare differently. 

  The user's framing of "utilitarianism as mathematically mandatory" is too strong. The theorem forces a weighted sum, but weights aren't necessarily equal. To get equal weights, you need to assume interpersonal comparability and a common scale. Without that, the weights are arbitrary. So prioritarian or Rawlsian views aren't irrational per se; they might reject the vNM axioms for social evaluation or require different utility scales. 

  For the user's talk, they should clarify that Harsanyi shows a linear aggregation, but equal weighting requires additional assumptions. They could mention Sen's critique about conflating vNM utilities with well-being. Emphasize that the theorem is about consistency under risk, but ethical weights need more normative input. This way, they avoid overclaiming while still highlighting the importance of Harsanyi's result.
answer: |-
  You're right to scrutinize this framing—your economist colleague has identified a crucial nuance. Harsanyi's theorem **does not uniquely pin down equal weighting** (summing utilities with equal weights) without additional, ethically substantive assumptions. The gap lies in the **normalization of individual utility functions** and the interpretation of what vNM utilities represent. Here's a precise breakdown:

  ### 1. **What Harsanyi's Theorem Actually Shows**
     - **Premises**:
       - Each individual \(i\) has preferences over lotteries satisfying vNM axioms \(\implies\) each has a vNM utility function \(u_i\) (unique up to *positive affine transformations*: \(u_i' = a_i u_i + b_i\) where \(a_i > 0\)).
       - The social planner has vNM-rational preferences over the same lotteries \(\implies\) a social vNM utility function \(U\).
       - **Pareto Indifference**: If all individuals are indifferent between two lotteries, society must be indifferent.
     - **Conclusion**:  
       \(U\) must be an **affine combination** of individual utilities:  
       \[
       U = \sum_{i=1}^n \lambda_i u_i + \gamma \quad \text{(with } \lambda_i > 0 \text{ for all } i\text{)}
       \]  
       (The constant \(\gamma\) is irrelevant for preferences and can be ignored.)

  ### 2. **The Problem: Arbitrary Weights (\(\lambda_i\))**
     - **Key Issue**: vNM utilities are *ordinal* and *cardinally measurable only up to individual-specific affine transformations*.  
       - If you rescale/rezero person \(i\)'s utility to \(u_i' = a_i u_i + b_i\), the social welfare function must adjust to:  
         \[
         U' = \sum_{i=1}^n \lambda_i' u_i' + \gamma' \quad \text{where} \quad \lambda_i' = \frac{\lambda_i}{a_i}.
         \]  
         The weights \(\lambda_i\) **change arbitrarily** with the choice of scaling for \(u_i\).  
       - **Example**: Doubling \(i\)'s utility scale (\(a_i = 2\)) *halves* their weight \(\lambda_i\) to preserve the same social ordering. The weights are **meaningless without interpersonal comparability**.

  ### 3. **When Does "Equal Weighting" Follow?**
     To get **equal weights** (\(\lambda_i = \lambda_j\) for all \(i,j\)), you need **strong interpersonal comparability**:
     - **Additional Assumption**: Utilities are *cardinally measurable and interpersonally comparable* on a **common scale**.  
       - This requires fixing a *zero* and *unit* for utility that are identical across individuals (e.g., "one unit of utility for Alice is ethically equivalent to one unit for Bob").  
     - **How it Works**:  
       With a common scale, the affine transformations are constrained: \(a_i = a_j\) and \(b_i = b_j\) for all \(i,j\). Now \(\lambda_i\) weights *can* be meaningfully compared, and **equal weights** (\(\lambda_i = \lambda_j\)) becomes a specific ethical choice (classical utilitarianism).  

  ### 4. **Why Prioritarianism/Rawlsianism Aren't "Irrational"**
     - **Prioritarianism**: Uses a *concave transformation* of utilities (e.g., \(\sum_i v(u_i)\) where \(v\) is concave). This violates Harsanyi's linearity requirement unless all \(u_i\) are identical.  
     - **Rawlsianism**: Maximizes the minimum utility (\(\max \min_i u_i\)) is *non-linear* in utilities and violates vNM axioms (especially continuity and independence).  
     - **Crucially**: Both reject the **vNM rationality axioms for social evaluation** or require **non-comparable utility scales**. Harsanyi's theorem shows these views are incompatible with *his specific premises*, not that they are universally irrational. They reflect different normative commitments (e.g., risk-aversion for the worst-off).

  ### 5. **The Harsanyi-Sen Debate (Simplified)**
     Sen's critique centers on two points:  
     - **Utility Interpretation**: vNM utilities reflect *risk attitudes*, not necessarily well-being. A person's \(u_i\) being "linear in outcomes" might mean they are risk-neutral, not that their welfare has constant marginal value.  
     - **Ethical Neutrality?**: Harsanyi presents the weights as "ethical" (e.g., \(\lambda_i = 1/n\) for utilitarianism), but they are entangled with arbitrary scaling. Sen argues true ethical weights require independent normative justification (e.g., via capabilities, primary goods).  

  ### Recommended Framing for Your Talk
  Avoid claiming "utilitarianism is mathematically mandatory." Instead, emphasize:

  > **"Harsanyi's theorem shows that under vNM rationality and Pareto indifference, social welfare *must* be a *weighted sum* of individual vNM utilities. However, the weights \(\lambda_i\) depend critically on how we normalize each person's utility scale.  
  >  
  > **Equal weighting (\(\lambda_i = \lambda_j\)) requires an ethically substantive assumption: that utilities are interpersonally comparable on a common cardinal scale. Without this, prioritarian or Rawlsian approaches aren't 'irrational'—they reject either the vNM framework for social choice or the comparability assumption."**

  ### Why This Matters
  - **For decision theorists**: This framing accurately separates mathematical necessity (linear aggregation) from ethical choice (weights/scaling).  
  - **For ethics**: It clarifies that Harsanyi's theorem doesn't *refute* prioritarianism/Rawlsianism; it shows they operate outside a specific (vNM/Pareto) framework. The "rationality" of social evaluation depends on foundational commitments.  

  If you want to salvage a "vindication of utilitarianism," stress that Harsanyi provides a **coherent foundation for additive aggregation** once comparability is assumed—but the theorem itself doesn't force that assumption. This keeps your presentation rigorous while acknowledging the economist's valid concern.
