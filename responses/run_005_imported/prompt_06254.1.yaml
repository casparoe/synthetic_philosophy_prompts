answer: |-
  ## The Unequal Burden: Why McMahan's Revisionism Undermines the Moral Equality of Combatants

  The question of whether soldiers fighting for just and unjust causes share a fundamental moral equality on the battlefield is a profound challenge at the heart of modern just war theory. Michael Walzer's *Just and Unjust Wars* established the dominant paradigm of symmetrical *jus in bello*, while Jeff McMahan's revisionist critique launched a formidable assault on its moral foundations. While Walzer presents a powerful case grounded in practicality and the realities of combat, McMahan's focus on individual moral responsibility ultimately provides a more coherent and defensible account of the ethics of killing in war, revealing the "moral equality of combatants" as a necessary legal fiction rather than a genuine moral doctrine.

  **The Fortress of Symmetry: Walzer's Case for Moral Equality**

  Walzer's defense rests on several interlocking pillars, forming a robust structure emphasizing practicality and the unique nature of war:

  1.  **The Separation of Jus Ad Bellum and Jus In Bello:** This is the cornerstone. Walzer argues that the justice of the war (*jus ad bellum*) is a political question concerning states and leaders. The conduct *within* the war (*jus in bello*) is a separate domain governed by rules applicable to all soldiers equally. Judging individual soldiers based on their state's cause is impossible and unfair; they are instruments of policy, not policymakers.
  2.  **The War Convention as a Mutual Compact:** Battlefield rules (proportionality, distinction, non-combatant immunity) form a fragile "war convention." Treating soldiers asymmetrically based on their war's justice destroys this reciprocity. Why would an "unjust" soldier follow rules if they know they are considered morally illegitimate targets with no right to fight? Symmetry provides the mutual restraint essential to limiting war's horrors.
  3.  **The Epistemic Fog of War:** Soldiers under fire, especially conscripts or those subject to state propaganda, lack the capacity, information, and perspective to reliably judge the *ad bellum* justice of their nation's cause. Holding them individually liable for a judgment they cannot reasonably make is profoundly unjust.
  4.  **The Functional Role of Soldiers:** Soldiers are trained and placed in a unique role: to fight the enemy presented to them by their state. They confront an immediate, lethal threat from enemy soldiers. Their moral task is to fight that threat *within the rules*, regardless of the broader political context. Their duty is to their comrades and immediate survival, not abstract global justice.
  5.  **Preventing Utter Barbarism:** As the user's friend argues, abandoning symmetry risks unleashing total war. Soldiers deemed "unjust" could be treated as outlaws or murderers, stripping them of all protections and making surrender or negotiation impossible. Symmetry provides a baseline of humanity amidst the chaos.

  Walzer's argument is compelling because it reflects the brutal realities of conflict. It provides clear, actionable rules for soldiers and offers the best hope for mitigating suffering. It acknowledges that war creates a distinct moral arena where ordinary moral judgments are suspended or radically transformed.

  **The Scalpel of Responsibility: McMahan's Revisionist Assault**

  McMahan dismantles Walzer's edifice by insisting that the ethics of killing cannot be suspended by the context of war. His argument hinges on individual moral liability:

  1.  **Liability as the Foundation of Permissible Killing:** McMahan argues that killing is only morally permissible if the target is *liable* to be killed. Liability arises when an individual, through their voluntary actions, contributes significantly to an *unjustified* threat of harm. Merely posing a threat is insufficient; the threat must be unjust.
  2.  **The Collapse of Independence:** Consequently, *jus ad bellum* and *jus in bello* cannot be independent. Whether a combatant is liable to attack depends *crucially* on whether the threat they are part of is just or unjust. A soldier fighting in a war of unjust aggression is *contributing to an unjust threat*. Therefore, they are liable to defensive harm by those they threaten (the "just" combatants). Conversely, the just combatant, defending against unjust aggression, does not pose an *unjust* threat. Killing them constitutes murder.
  3.  **The Justification/Excuse Distinction:** McMahan readily acknowledges mitigating factors Walzer highlights, but crucially reclassifies them. Duress, epistemic limitations (not knowing the war is unjust), or lack of alternatives might *excuse* an unjust combatant's participation, reducing or eliminating their *blameworthiness*. However, an *excuse* does not create a *justification*. Even if excused, the unjust combatant's *actions* still contribute to an unjust threat. They therefore remain *liable* to defensive attack. Their killing might be understandable or less blameworthy, but it isn't *morally permissible* for them to kill just combatants in the same way it is permissible for the just combatant to kill them.
  4.  **The Myth of Functional Role:** McMahan rejects the idea that simply occupying the "role" of a soldier grants a blanket moral license to kill enemy soldiers. Morality doesn't vanish with the uniform. If the role requires one to inflict unjust harms, then participating in that role makes one morally liable, barring valid excuses.
  5.  **The Limits of Reciprocity:** While McMahan acknowledges the practical value of symmetrical *legal* rules (like the Laws of Armed Conflict - LOAC), he denies this reflects underlying moral truth. The practical benefits of reciprocity (maintaining restraint) might necessitate *treating* soldiers *as if* they were morally equal *for legal purposes*, but this is purely pragmatic. Morally, the asymmetry is fundamental. The risk of increased brutality stems from actors *ignoring* moral constraints, not from recognizing the truth of moral asymmetry.

  McMahan's argument is philosophically rigorous. It refuses to compartmentalize morality. It forces us to confront the uncomfortable reality that many soldiers, even conscripts or misled ones, might be participating in acts that are objectively morally wrong – contributing to mass killing based on an unjust cause – and that this has profound implications for their moral status on the battlefield.

  **The Verdict: Equality as Fiction, Asymmetry as Truth**

  While Walzer's framework offers invaluable practical guidance and acknowledges the tragic realities of war, McMahan's revisionism provides the more defensible account of the *genuine morality* of killing in war.

  1.  **Moral Responsibility Cannot Be Outsourced:** Walzer's separation of *ad bellum* and *in bello* effectively absolves individual soldiers of moral responsibility for the larger enterprise they enable through violence. This is unsustainable. If knowingly and voluntarily participating in an aggressive war is morally wrong at the political level (which Walzer concedes), it strains credulity to argue that pulling the trigger in service of that aggression is morally neutral or symmetrical with defensive killing. McMahan correctly locates moral weight on the individual's contribution to an unjust harm.
  2.  **The Justification/Excuse Distinction is Decisive:** Walzer's practical concerns – duress, ignorance, reciprocity – are powerfully addressed by McMahan, not as justifications creating moral equality, but as potential *excuses* mitigating blame. This distinction is crucial. A frightened soldier coerced into fighting for an aggressor may be *excused* (we understand why he did it, we might not punish him harshly), but his *action* of killing a defender remains *unjustified*. The defender, conversely, is *justified* in killing him to stop the unjust threat. This inherent asymmetry in the permissibility of the act is the core moral truth Walzer's equality obscures.
  3.  **Liability Reflects the Reality of Harm:** McMahan's liability criterion directly links the permissibility of killing to the moral status of the threat posed. A just combatant poses a *justified* threat to the unjust combatant (defending against aggression). The unjust combatant poses an *unjustified* threat to the just combatant. Treating these fundamentally different moral positions as equivalent is a profound category error at the level of individual morality.
  4.  **Practicality ≠ Morality:** Walzer's strongest suit is practicality: symmetry saves lives. And he is likely correct that widespread adoption of McMahan's *moral* view *as the governing legal framework* could be disastrous. However, the user explicitly asks for a judgment on the *moral doctrine*, not its pragmatic implementation. Recognizing that the law must often diverge from perfect morality for practical reasons (like maintaining reciprocity and clear rules) does not mean the moral truth itself is symmetrical. We can (and should) maintain symmetrical *legal* rules (LOAC) to mitigate suffering, while simultaneously acknowledging that these rules create a *legal fiction* of moral equality that does not reflect the underlying moral reality McMahan exposes. The moral equality *is* a useful, perhaps essential, fiction for the law of war, but it remains a fiction.

  **Conclusion**

  The moral equality of combatants, as defended by Walzer, is a powerful and necessary *pragmatic construct* for regulating the conduct of warfare. It provides clear rules, fosters reciprocity, acknowledges soldiers' epistemic limitations, and helps contain war's brutality. However, as a *genuine moral doctrine*, it cannot withstand McMahan's critique. By focusing relentlessly on individual moral responsibility and the justification for causing harm, McMahan demonstrates that liability to attack arises from contributing to an *unjust* threat. Soldiers fighting for an unjust cause generally lack the moral right to kill those defending against their aggression, even if excuses mitigate their blame. Conversely, just combatants act within their rights when defending themselves and others against unjust aggression.

  Therefore, while we may wear the mask of moral equality in the courtroom of war to prevent utter chaos, beneath that mask lies the unequal burden of moral truth: killing in an unjust war is, fundamentally, morally distinct from killing in a just defense. McMahan forces us to confront this uncomfortable asymmetry, revealing Walzer's equality not as bedrock moral principle, but as a vital, tragic, and ultimately fictional compromise with the hellish reality of war. For your paper, this provides a clear, defensible verdict: the moral equality of combatants is not defensible as a genuine moral doctrine, though its practical utility in law and strategy remains immense.
