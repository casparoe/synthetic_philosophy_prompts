  The user's confusion between causation and justification is central. For instance, when a rock hurts your foot, the pain causes the belief "this rock is hard." But the justification for that belief comes from other beliefs within the web, like previous experiences with rocks, not the pain itself. The world causes sensory inputs, but our linguistic frameworks interpret those inputs. 

  Another point: truth as warranted assertibility. Rorty thinks "truth" is just a compliment we pay to statements that cohere well within our current belief system. So, when science progresses, it's not getting closer to reality but solving more puzzles efficiently. The user might see this as instrumentalism, but Rorty rejects the instrumentalist label because he denies any access to reality outside our descriptions. 

  The user might worry this leads to relativism. But Rorty argues that justification is always within a social context, not relative to individuals. It's about community agreement, not arbitrary views. So, while there's no absolute truth, it's not relativistic in the "anything goes" sense. 

  Using the geophysics example: seismic wave data causes beliefs, but interpreting that data depends on current theories. If a new model explains more data, it's not truer because it matches reality better, but because it's more useful for predictions. 

  I should emphasize that Rorty isn't saying science is arbitrary. He's shifting focus from representation to social practice. The user's background in a hard science might make the social aspect seem dismissive, but it's about how communities justify knowledge. 

  Finally, addressing the "having it both ways" charge. Rorty's point is that causation is non-linguistic, while justification is linguistic. They operate in different domains. The world constrains our beliefs causally, but only through our conceptual schemes. So, it's not dodging but redefining the terms to avoid metaphysical traps. 

