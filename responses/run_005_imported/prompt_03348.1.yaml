prompt: |-
  I filed my application for naturalization last month, after eleven years as a permanent resident, and the process has left me oddly preoccupied with a question I can't quite shake: what actually justifies the criteria being used to decide whether I get to join the group of people entitled to govern themselves here? Some reading turned up the fact that this is basically what political theorists call the "boundary problem" — the puzzle of how a demos can legitimately fix its own membership, given that any procedure for doing so seems to presuppose an answer to the very question it's supposed to settle.

  Looking for earlier discussions of the issue, I came across this passage from Henry Sidgwick's The Elements of Politics (1891), Chapter XIV ("The Area of Government — States and Districts"), §4, where he tries to work out how membership of a state is acquired in the first place. I can follow the individual sentences, but I'm having trouble reconstructing what the actual argument is supposed to be:

  > How, then, is membership of a political society to be determined, if mere local habitation is not sufficient to determine it? There are two obvious alternatives, (1) Birth, and (2) Consent: and the first subdivides again into two, according as "birth" is understood to mean either "birth from parents who are members" or "birth within the territory". The decision in favour of any one of the three principles is, however, of minor importance: because ordinarily all these characteristics are found in combination. Ever since political societies have existed, the quality of membership has been handed down from parents to children, along with the common language, customs, and traditions that constitute the normal bonds of national unity: thus in any modern country the great majority of the inhabitants — born from native parents and on the soil — have been regarded as inchoate members from their birth, and as they have grown up have assumed the rights and obligations of full membership, without any formal act of consent. With regard, then, to this great majority, it would be superfluous and disturbing to admit any doubt as to their membership, so long as they remain within the territorial limits of the state…
  >
  > We are thus led to consider the conditions under which aliens generally should be admitted to (1) residence and (2) citizenship… Here, then, I shall only point out that the residence of a large number of persons permanently excluded from citizenship within the territory of any community involves an obvious danger of weakening the internal coherence of the community. Accordingly, if a State permits the free immigration of foreigners, it seems expedient that admission to citizenship should be generally open to those resident aliens — provided they have, by sufficiently long, orderly, and unblemished residence within its territory, both shown a settled preference for the social order that it maintains, and acquired a sufficient acquaintance with its laws and political habits to render it fairly probable that they will adequately perform the duties of citizenship.
  >
  > It remains to settle the minor point, whether parentage or soil is to decide citizenship, in the case of children born in the territory of a state other than that of which their parents are members… we may lay down that — as it is obviously undesirable, other things being equal, that either State should have unwilling members — the children of resident aliens should be allowed to choose their nationality when they come to years of discretion; so long at least as there is no need of discouraging the residence of aliens on account of their numbers.

  Could you help me reconstruct the argument here?

  1. Sidgwick offers birth-by-descent, birth-by-soil, and consent as candidate criteria for membership, then says the choice between them is "of minor importance" because they usually coincide — and on that basis treats the native-born as members automatically, "without any formal act of consent," while still requiring resident aliens to show a "settled preference" before naturalizing and letting their children choose "when they come to years of discretion." Is there a principled reason for holding insiders and outsiders to such different standards of legitimation, or is this just existing practice dressed up as theory?
  2. Stepping back: does starting from the state as an already-constituted "going concern," and asking only how individuals are added to or subtracted from it, let Sidgwick quietly sidestep the regress that later boundary-problem theorists worry about (that any decision procedure for fixing the demos already presupposes a demos to run it) — or does it just relocate that same problem onto the unexamined "great majority" he takes for granted from the outset?
reasoning: |-
  Okay, the user is grappling with the boundary problem in political theory, specifically how a demos legitimately determines its membership. They've cited Sidgwick's text and are questioning whether his approach is principled or merely a justification of existing practices. Let me break this down.

  First, the user's main confusion is about Sidgwick's treatment of native-born versus immigrants. Sidgwick argues that for the native majority, membership is automatic via birth (either descent or soil), while immigrants need consent through naturalization. The user wonders if this is ad hoc. 

  Hmm, looking at Sidgwick's reasoning, he prioritizes social cohesion and stability. The automatic inclusion of natives is based on their lifelong socialization into the community's norms. For immigrants, the requirement to demonstrate settled preference and knowledge serves to ensure they're assimilated. So his rationale is functional: preserving the state's unity. But the user is right to question if this just codifies status quo biases.

  Then there's the deeper boundary problem: how can the initial demos be defined without circularity? Sidgwick sidesteps this by taking the existing state as given. His focus is on managing membership within an already functioning system, not justifying its origins. This pragmatic approach avoids the regress but doesn't solve the theoretical puzzle. Later theorists like Whelan would point out that this presupposes the very demos in question.

  The user is clearly well-read, connecting Sidgwick to modern boundary problem discourse. Their personal stake in the naturalization process adds depth—they're not just theorizing abstractly but living this tension. They might be seeking both intellectual clarity and personal validation of their experience with the system's asymmetries.

  I should emphasize that Sidgwick's solution is pragmatic, not foundational. He acknowledges the arbitrariness of birthright membership but sees it as necessary for stability. The consent requirement for aliens then becomes a tool for assimilation. The children-of-aliens provision shows some flexibility, but it's still framed by state interests. 

  The user's second question is sharper: does Sidgwick's approach relocate the boundary problem rather than solve it? Absolutely. By starting mid-stream, he avoids the regress but leaves the initial constitution of the demos unexamined. That's the trade-off between practical governance and philosophical rigor. The user seems to sense this tension acutely, given their position as an applicant navigating a system built on these unexamined premises.
answer: |-
  Here's a reconstruction of Sidgwick's argument and its implications for your questions:

  ### Core Argument Reconstruction
  1.  **The Problem:** Mere physical presence ("local habitation") isn't a sufficient criterion for membership.
  2.  **Candidate Principles:** Birth (subdivided into descent/jus sanguinis and soil/jus soli) and Consent.
  3.  **Practical Convergence & Stability:** Sidgwick argues the *choice* between these principles is "of minor importance" because, for the vast majority of the population in a stable state, all three coincide: they are born on the soil to citizen parents and grow up assimilated into the society, implicitly consenting through participation.
  4.  **The "Great Majority" - Automatic Membership:** For this native-born majority, membership is automatic and unquestioned ("inchoate members from birth"). Requiring formal consent from them would be "superfluous and disturbing" because:
      *   Their membership is inherited alongside language, customs, and traditions ("normal bonds of national unity").
      *   Their lifelong socialization within the territory ensures they understand and are integrated into the political community.
      *   Challenging their membership destabilizes the state's core identity and cohesion.
  5.  **Aliens - Conditional Membership:** For resident aliens, membership is *not* automatic. Admission to citizenship requires demonstration of:
      *   **Settled Preference:** "Sufficiently long, orderly, and unblemished residence" showing a commitment to the host society and its social order.
      *   **Assimilation:** Acquisition of sufficient knowledge of laws and political habits to perform civic duties adequately.
      *   **Justification:** Permanent exclusion of a large alien population weakens internal coherence ("obvious danger"). *Therefore*, if immigration is permitted, citizenship should generally be open to those who meet the criteria above. This serves the state's interest in stability and integration.
  6.  **Children of Aliens - Deferred Choice:** Children born to aliens *within* the territory should be allowed to choose their nationality at maturity ("years of discretion"). The rationale is:
      *   Avoiding "unwilling members" for either state (parents' origin or birth state).
      *   Pragmatism: Discouragement is only necessary if alien numbers are problematic.

  **Sidgwick's Overarching Principle:** The primary goal is the **stability, coherence, and functional unity of the existing political community.** Membership rules are instruments to achieve this. The "great majority" constitutes the stable core whose automatic membership *is* the foundation of that unity. Rules for aliens (and their children) are designed to integrate newcomers *into* this pre-existing core without destabilizing it.

  ### Addressing Your Questions

  1.  **Different Standards for Insiders vs. Outsiders: Principled or Practice?**
      *   **Sidgwick's Principle:** Yes, he offers a *functional* principle: **Preservation of Social-Political Cohesion.** The native-born majority *is* the embodiment of the demos and its shared norms. Their automatic inclusion is essential *for* stability. Requiring consent from them would undermine the very foundation of the community.
      *   **Requirement for Aliens:** Their path to membership is justified *because* their presence without integration threatens cohesion ("obvious danger"). The criteria (settled preference, assimilation) are designed to *replicate* the conditions of the native-born majority: long-term commitment and understanding of the society. Consent (via the naturalization process) is necessary *precisely because* they lack the automatic legitimacy derived from birth and lifelong socialization within the core community.
      *   **Is it Just Existing Practice?** While Sidgwick *describes* existing practice, he *justifies* it theoretically based on the functional necessity of stability and cohesion for the state. He elevates practice to principle by arguing that automatic inclusion of the core majority is *essential* for the state to function as a coherent unit capable of self-government. The different standards stem from this functional distinction between the constitutive core and potential new members. So, it's more than *just* dressing up practice; it's grounding the practice in a specific theory of state stability.

  2.  **Sidestepping or Relocating the Boundary Problem?**
      *   **Sidestepping?** Absolutely. Sidgwick explicitly *avoids* the foundational question of how the *initial* demos is constituted. He takes the existing nation-state, with its historically formed "great majority" sharing "language, customs, and traditions," as the given starting point ("a going concern"). His question is not "How is *a* demos possible?" but "How does *this specific, existing* demos manage membership *within its already established framework* to maintain itself?"
      *   **Relocating?** Yes, but productively (from his perspective). The "boundary problem" regress (who decides the deciders?) is *resolved* by fiat: the "great majority" is the unexamined, pre-political foundation. Their existence, unity, and automatic membership are the **presuppositions** upon which all subsequent membership decisions (regarding aliens) are built. The legitimacy of the core isn't derived from consent or a prior procedure; it's derived from historical fact, cultural unity, and the functional necessity of their cohesion *as* the state.
      *   **Implication:** Sidgwick doesn't "solve" the philosophical boundary problem. He *brackets* it. His solution is pragmatic and conservative: the legitimacy of the demos's self-definition rests on the historical and cultural reality of its core population. The "problem" of defining the demos only arises at the *margins* (aliens), and the solution there is designed to *preserve* the core's pre-existing unity. Later theorists (like Frederick Whelan or Robert Dahl) focusing on the boundary problem challenge this bracketing, arguing that the core itself requires justification, leading to the regress Sidgwick avoids.

  **In Summary:** Sidgwick's argument is fundamentally pragmatic and stability-oriented. The different standards for insiders (automatic inclusion) and outsiders (conditional inclusion based on demonstrated assimilation and consent) are justified by the *functional necessity* of preserving the cohesion of the pre-existing, historically formed "great majority" that constitutes the core of the state. He sidesteps the foundational boundary problem by taking this core as an unquestioned given, the foundation upon which the state rests and from which it manages its borders (literal and membership). His focus is on the practical governance of an existing state, not its ultimate philosophical justification.
