  **Justifications:**  
  1. **edt-dependence** (most damaging): If ECL fundamentally relies on EDT and fails under dominant decision theories like CDT (with unresolved debates about updateless/functional alternatives), the core mechanism collapses before other considerations even apply.  
  2. **correlation-strength**: Even assuming EDT, lacking evidence of correlation with *diverse* agents (vs. near-copies) undermines the premise that cooperation with value-alien counterparts is relevant.  
  3. **large-world-uncertainty**: Without reasonable confidence in a "large world" (infinite/quantum/modal), the evidential link to other agents dissolves, though this is less fundamental than EDT or correlation failures.  
  4. **compromise-risk**: The threat of compromise worsening outcomes by your own values is severe, but this becomes moot if prior concerns prevent the mechanism from activating.  
  5. **pascalian-structure**: The unbounded-stakes criticism is serious, but applies to many longtermist arguments and is less unique to ECL than compromise risks.  
  6. **no-behavioral-upshot**: While the lack of testable implications weakens justification for prioritization, it doesn't directly falsify ECL like higher-ranked issues.  
  7. **explanatory-idleness** (least damaging): If ECL merely reinforces existing impartiality, it may still add decision-theoretic rigor without being harmful, making this the weakest critique.
