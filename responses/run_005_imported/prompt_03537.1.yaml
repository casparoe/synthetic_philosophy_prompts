   The scenario: Omega flips a fair coin. Tails: asks for $100. Heads: pays $10,000 only if predicted that you would have paid in the tails case. The coin came up tails, and Omega is asking for $100.

   Arguments:
   1. Mara: Do not pay. The coin is tails, so there's no chance of getting the $10,000. Paying loses $100 for sure.
