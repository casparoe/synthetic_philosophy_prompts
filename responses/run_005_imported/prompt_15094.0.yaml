prompt: |-
  I'm doing a live Q&A at a small philosophy of biology workshop, and one of my panelists is a die-hard Popperian who still defends the idea that natural selection is, at bottom, a 'metaphysical research programme' rather then a genuinely testable scientific theory. Can you draft me eight or nine interview questions that push her past the standard tautology complaint ('survival of the fittest' just means 'survival of the survivors')? I want at least one question on whether the propensity interpretation of fitness actually defuses that charge, one that makes her spell out exactly what Poppers partial recantation in the late 70s conceded and whether it was substantive or just face-saving, and one that turns Popper's own evolutionary epistemology against the view -- if conjectures-and-refutations in science is basically selection by another name, how does he get to call selection itself unfalsifiable? For each question, throw in a quick follow-up keyed to whatever dodge she's most likely to reach for.
reasoning: |-
  Okay, the user is prepping for a philosophy of biology workshop Q&A and needs to challenge a Popperian panelist who views natural selection as a "metaphysical research programme." They want sharp questions that go beyond the tired tautology critique, with specific angles: propensity interpretation of fitness, Popper's 1970s recantation, and turning evolutionary epistemology against Popper. 

  Hmm, the user's clearly well-versed—they're using insider terms like "propensity interpretation" and know about Popper's late-career waffling. Their frustration with superficial debates is palpable. Probably an academic hosting this panel, maybe a postdoc or early-career prof? Needs ammunition to push the discussion beyond recycled talking points. 

  Breaking this down: First, gotta tackle the tautology charge properly. The propensity interpretation (fitness as probabilistic disposition) is key—it turns "survival of the fittest" from circular to predictive. But Popperians might dodge by saying propensities aren't directly observable. Follow-up should corner them on whether *any* scientific dispositions (like solubility) get the same skepticism. 

  Then Popper's 1970s shift... that's messy. He conceded natural selection is testable *in principle* but still called it "metaphysical" because it's too flexible. Classic Popperian fence-sitting. Follow-up must force the panelist to admit: if he granted testability, what exactly makes it "metaphysical"? The unfalsifiable auxiliary assumptions? 

  The evolutionary epistemology angle is deliciously ironic. Popper modeled scientific progress on natural selection (conjectures ≈ mutations, refutations ≈ selection). So how can he call the original process untestable? Panelist might retreat to "analogy isn't identity," but that's weak—follow-up should press whether scientific criticism is *literally* a selection pressure. 

  ...Also, should sneak in a curveball about units of selection. Popperians hate multilevel selection—it breaks their neat "falsification" criteria. Good tension-builder. 

  User definitely wants bloodless academic combat, but framed collegially. Questions must be surgical but not aggressive. Tone: curious rigor with hidden teeth.
answer: |-
  Here are 9 targeted questions (+ likely dodges & sharp follow-ups) designed to push beyond tautology complaints and probe the core Popperian stance:

  1.  **Core Tautology & Propensity:**
      *   **Q1:** "You reject the 'survival of the fittest' tautology charge as superficial. Can you explain *exactly* how Elliott Sober's 'propensity interpretation of fitness' (fitness as a probabilistic disposition for reproductive success *relative to an environment*) transforms 'fitness' from a circular *outcome* into a measurable *predictive* antecedent, thereby defusing the tautology claim for *scientific* applications?"
      *   *Likely Dodge:* "Propensities are still metaphysical dispositions; you don't measure fitness directly, only outcomes."
      *   **Follow-Up:** "If measuring the *causal basis* of a propensity (e.g., beak depth, drought tolerance) and its *probabilistic consequences* (differential survival/reproduction in controlled or predicted field studies) doesn't count as testing a scientific concept, does that render *all* dispositional properties in science (like solubility or electrical conductivity) equally 'metaphysical' and untestable?"

  2.  **Poppers' Recantation & Its Meaning:**
      *   **Q2:** "In the late 1970s, Popper conceded that natural selection *is* testable 'in many cases'. Could you spell out the *specific* kinds of tests or potential falsifiers he had in mind when he made this partial recantation? What concrete examples did he point to, or should he have pointed to?"
      *   *Likely Dodge:* "He merely acknowledged trivial tests; the core 'research programme' aspect, its universality and explanatory plasticity, remained metaphysical."
      *   **Follow-Up:** "If Popper explicitly granted the existence of specific, non-trivial tests (e.g., predicting trait frequency shifts under environmental change, or falsifying selective hypotheses via mismatch), doesn't this fundamentally undermine the claim that selection is *inherently* unfalsifiable? Isn't the 'metaphysical' label then just a statement about its broad scope and the role of auxiliary assumptions, which applies equally to Newtonian mechanics or atomic theory?"

  3.  **Evolutionary Epistemology - The Irony:**
      *   **Q3:** "Popper championed 'evolutionary epistemology', arguing that scientific progress mirrors natural selection: conjectures (variation) face refutation (selection). If this analogy is robust, and 'conjectures-and-refutations' *is* a testable, scientific process, how can the *biological mechanism* it supposedly mirrors – natural selection itself – be dismissed as fundamentally *un*falsifiable?"
      *   *Likely Dodge:* "It's just an analogy! Scientific criticism is rational, biological selection is blind. The *processes* are different."
      *   **Follow-Up:** "But doesn't Popper *insist* on the fundamental similarity in the *logic* of the process – trial and error elimination? If the *logical structure* of selection (variation, differential perpetuation) is testable when applied to ideas, why is that *same logical structure* inherently metaphysical when applied to genes? Isn't this a contradiction at the heart of Popper's system?"

  4.  **The "Metaphysical Research Programme" Label:**
      *   **Q4:** "What *specific* characteristic(s) of natural selection theory, absent in theories Popper *did* deem scientific (like GR or QM), forces it into the 'metaphysical research programme' category? Is it the role of historical contingency, the reliance on auxiliary assumptions, its probabilistic nature, or something else?"
      *   *Likely Dodge:* "Its universality – it explains *anything* that survives. It's too flexible, lacks specific, risky predictions without ad hoc additions."
      *   **Follow-Up:** "Doesn't Newtonian gravity also 'explain' any observed motion (with enough auxiliary assumptions about forces)? Isn't the *real* issue the *fecundity* of the selection programme in generating specific, testable *subsidiary hypotheses* (e.g., about specific selective pressures, genetic architectures, phylogenetic constraints) that *are* falsifiable, much like specific models within the Newtonian framework?"

  5.  **Predictive Power & Novel Facts:**
      *   **Q5:** "Setting aside the 'tautology', can you identify a *single* novel, risky, and subsequently corroborated *prediction* made *solely* by the core logic of natural selection *itself*, without relying on specific auxiliary hypotheses (like genetics, ecology, etc.)? If not, does this support your 'metaphysical' view? If yes, what is it?"
      *   *Likely Dodge:* "The core logic doesn't make *specific* predictions; it guides the *formulation* of testable hypotheses using auxiliary theories."
      *   **Follow-Up:** "But doesn't this apply equally to the core logic of atomic theory ('matter is composed of atoms') or plate tectonics ('continents move')? They don't predict specific compounds or mountain ranges alone either. Isn't the *ability to successfully guide the generation of testable, fruitful subsidiary hypotheses* a hallmark of a powerful scientific framework, not metaphysics?"

  6.  **Falsifiability vs. Explanatory Power:**
      *   **Q6:** "Popper prioritized falsifiability. But if natural selection, as you argue, lacks decisive falsifiers at its core, yet demonstrably possesses immense unifying and explanatory power across biology (from antibiotic resistance to the fossil record), does this suggest Popper's criterion might be too narrow for evaluating complex, historical sciences?"
      *   *Likely Dodge:* "Explanatory power without falsifiability is just persuasive storytelling. Metaphysics can be explanatory too."
      *   **Follow-Up:** "Is the detailed genetic and selective explanation for industrial melanism in peppered moths, including predictions about reversal if pollution declines, merely 'storytelling'? If not, what aspect of that explanation *is* genuinely testable science, and how is it fundamentally distinct from the core selection logic you deem metaphysical?"

  7.  **Units & Levels of Selection:**
      *   **Q7:** "Debates about the 'unit of selection' (gene, individual, group) are central to modern evolutionary biology. These debates generate competing, often mutually exclusive, predictions about patterns of altruism, genomic conflict, etc. Doesn't the very *existence* of these empirically tractable disputes, resolvable by evidence, demonstrate that natural selection theory *can* be formulated in specific, falsifiable ways?"
      *   *Likely Dodge:* "These are debates *within* the metaphysical framework, testing auxiliary hypotheses *about* selection, not the core idea itself."
      *   **Follow-Up:** "If the core idea is so flexible that it can accommodate genes, individuals, *or* groups as the unit, doesn't that *increase* its potential falsifiability? If strong empirical evidence emerged *incompatible* with *any* formulation of selection acting at *any* level (e.g., pervasive complex adaptation arising purely through drift or physical constraint), wouldn't that falsify the core proposition that natural selection is a major force in evolution?"

  8.  **The Role of Mathematical Models:**
      *   **Q8:** "Population genetics provides precise mathematical models of natural selection. These models make quantitative predictions about allele frequency changes under defined parameters (fitness coefficients, population size, mutation rates). If a model's predictions consistently fail across varied empirical tests (e.g., in microbial evolution experiments), doesn't this constitute a direct falsification of that *specific formulation* of selection, and by extension, challenge the adequacy of the core theory?"
      *   *Likely Dodge:* "Falsifying a *model* only falsifies that specific parameterization and its assumptions, not the core heuristic of 'differential survival/reproduction'."
      *   **Follow-Up:** "But if *every* plausible mathematical instantiation of the core heuristic consistently fails to match empirical data across diverse systems, wouldn't that accumulation of failures eventually undermine confidence in the core heuristic itself? Isn't this how falsification works for complex theories – through the erosion of auxiliary hypotheses?"

  9.  **Contrast with Genuinely Untestable Ideas:**
      *   **Q9:** "To clarify the boundary, could you contrast natural selection with a concept you *do* consider genuinely metaphysical and untestable (e.g., a non-interacting deity, some forms of panpsychism)? What *specific* feature does natural selection lack that these concepts possess, making it scientific, or possess that these lack, keeping it metaphysical?"
      *   *Likely Dodge:* "Natural selection *guides* testable research, unlike pure metaphysics. But its core is too universal to be falsified."
      *   **Follow-Up:** "Doesn't the concept of 'energy' also guide immense amounts of testable research in physics while being incredibly universal? If 'guiding testable research' combined with universality isn't enough to make 'energy' metaphysical, why is it sufficient to make 'natural selection' metaphysical? What's the *qualitative* difference?"

  **Key Strategy:** Listen closely to the *specific* reasons given for the "metaphysical" label. Is it universality? Flexibility? Role of auxiliaries? Probabilistic nature? Historical contingency? Be ready to pivot your follow-ups to challenge that specific justification using concrete biological examples and comparisons to accepted scientific theories. Force clarity on what *would* count as falsification. Good luck!
