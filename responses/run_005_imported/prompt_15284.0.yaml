  My friend is getting married next month and I'm giving the toast. She and her fiancé actually met in a reading group working through MIRI's embedded agency material -- the stuff about how a real agent is stuck inside the environment its trying to model, instead of observing it from outside with a complete self-model like the idealized agents in decision theory papers get to -- and it turned into a running joke between them. I want to build the whole toast around that: you can never get a complete model of your own relationship because you're too small and too embedded to see it from outside, you have to trust your future self (and hers) without any way to verify in advance that the trust is warranted, that kind of thing. About half the room is her old research group and will catch every reference, the other half is just family and has never heard the phrase "logical uncertainty" in their life. Can you write the toast -- around 4 minutes, warm rather than lecture-y, and make sure the embedded agency stuff is actually doing real work in the jokes and structure, not just name-dropped?
