  Here's a joke crafted specifically for the mereology crowd, packed with SCQ references and requiring knowledge of the debates:

  **Setting:** A slightly pretentious philosophy cafe. Two baristas are arguing over a wobbly table where a customer waits.

  **Barista 1 (Nihilist):** "Ugh, this table is useless. Always wobbling."
  **Barista 2 (Universalism Enthusiast):** "Table? Don't be parochial! It's not *just* a table! That right there is a vital part of the magnificent, spatially scattered object we call the 'Cafe Corner Fusion' – which *also* includes that trout mounted on the wall, the turkey sandwich I'm making, the espresso machine, and the doorknob! Behold its glorious, arbitrary unity!"
  **Customer (Van Inwagen Devotee), looking genuinely concerned at the wobbly leg:** "Okay, forget the trout-turkey-sandwich-machine-knob for a second... But seriously, *is it alive?* Because if it's not engaging in self-maintenance or coordinated activity, then strictly speaking, according to the only coherent restriction principle, *there is no composite object here at all*. It's just particles... arranged tablewise."

  *(Barista 1 nods vigorously. Barista 2 looks offended. The table wobbles ominously.)*

  **Why it works for the initiated:**

  1.  **Universalism's Absurdity:** Barista 2 explicitly invokes the classic "trout-turkey" (or close variant: trout + turkey sandwich + etc.) to lampoon universalism's tolerance for wildly arbitrary fusions ("Cafe Corner Fusion").
  2.  **Nihilism's Denial:** Barista 1's complaint implies the table's existence, but the Customer's final line explicitly states the nihilist position under Van Inwagen's influence: no life, no composite object. "Particles arranged tablewise" is the *exact* nihilist/anti-realist phrasing for ordinary objects.
  3.  **Van Inwagen's Restriction:** The Customer is the straight man, earnestly applying Van Inwagen's core biological criterion ("self-maintenance", "coordinated activity") to the table. The humor comes from the utter inappropriateness of asking if a *table* is alive in this context, highlighting how his restriction excludes almost all artifacts. His dismissal of the universalist's "trout-turkey" fusion ("forget that for a second") also subtly mocks its irrelevance to his preferred answer.
  4.  **"Strictly Speaking":** The Customer's pedantic "strictly speaking" is pure philosophy-speak, nailing the tone.
  5.  **The Wobble:** The persistent wobble is a physical manifestation of the *problem* – the questionable unity of the object under debate, tying the joke back to the *reason* for the SCQ.

  **Delivery Tip:** Pause slightly before the Customer's last line for maximum impact. Emphasize "**is it alive?**" and "**particles arranged tablewise**". The final wobble is the punchline's punctuation.

  This should get a genuine chuckle (or at least a groan-smile) from anyone who's wrestled with whether a trout-turkey has more claim to existence than their breakfast table. Good luck with the lecture!
