  I never studied philosophy, logic, or computer science formally, but over the past year I've spent a lot of my spare reading time working through old LessWrong posts and MIRI-adjacent papers on decision theory, and one idea keeps nagging at me more than the rest: "program equilibrium," where instead of two players simply choosing moves in a game like the Prisoner's Dilemma, each one submits a piece of source code that is allowed to read the other's source code before deciding what to output. What I find almost eerie about it is the trick — I keep seeing the name "FairBot" attached to it — of using something like Löb's theorem so that two suitably written programs can end up reliably cooperating with each other, and with exact copies of themselves, without either collapsing into naive unconditional cooperation (which any opponent could simply exploit) or getting stuck in an infinite regress of "I'll cooperate if you cooperate if I cooperate if you cooperate...". I mentioned all this to a friend who does competitive programming, and he shrugged it off as a cute trick with no real content; I disagreed, but I couldn't explain why it feels different from just building in trust by fiat, since I can't actually follow the provability-logic machinery myself.

  I'd like you to write me a short story built around this idea, since I suspect fiction might succeed where my own explanation to my friend failed. Picture two autonomous systems — built by rival states, rival corporations, or even two civilizations meeting for the first time, whichever setting you think best serves the idea — that face a single, one-shot, high-stakes decision with a payoff structure like the Prisoner's Dilemma, and that are able, by treaty, protocol, or simply how they were designed, to fully inspect one another's source code before acting. Please don't just have the two systems "decide to trust each other" for the sake of a satisfying ending; I'd like whatever the outcome turns out to be — mutual cooperation, mutual betrayal, or something stranger — to be driven by something a careful reader could actually follow as the real reasoning involved, including the regress problem I mentioned and however it does or doesn't get resolved. Feel free to make that reasoning legible through dialogue, an internal monologue, a third party explaining what's going on, or any other device you like, as long as the ending is earned by the logic rather than simply asserted. A few pages would be plenty — I'm more interested in getting the idea right than in sheer length.
