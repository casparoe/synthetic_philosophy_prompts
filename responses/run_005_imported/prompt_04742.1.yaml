answer: |-
  Here’s a toast that threads your needle: warm, inclusive, and quietly honest about the boundary paradox—framing it as a *shared human project* rather than a flaw. It runs about 4 minutes when spoken conversationally:

  ---

  **(Clink glass, warm smile)**  
  "Friends, family, Priya—welcome. I’m honored to say a few words as we celebrate Priya officially becoming a U.S. citizen. Now, full disclosure: I’m a philosophy professor, and my day job is overthinking things for money. So when Priya asked me to speak, I panicked. Because how do I stand here and talk about Priya ‘joining *us*’… when my whole field argues about who ‘us’ even *is*?  

  *(Light chuckle, glance at Priya)*  
  Seriously. Academics have written entire books proving that the line Priya just crossed—the one that says ‘you’re in the club now!’—isn’t drawn by logic or nature. It’s drawn by history, paperwork, and a roomful of strangers raising their right hands. If you think too hard, it starts to feel arbitrary. Like we’re all just… agreeing to play the same game.  

  *(Pause, shift to sincere warmth)*  
  But here’s what I realized watching Priya today: **that’s the point**. The beauty isn’t that the line is perfect. The beauty is that she *chose* to cross it. That after years of living here, building her life, paying taxes *(smile at Priya)*—and probably overpaying immigration lawyers—she stood up and said: ‘Yes. This arbitrary, messy, contested ‘us’? I want in.’  

  *(Lean in, conversational)*  
  And isn’t that true for all of us? Nobody here *earned* being born on the ‘right’ side of that line. We just showed up. But Priya? She *fought* to be here. She studied maps of a history that isn’t inherently hers. She learned our bizarre idioms *(mock whisper)*—even though ‘break a leg’ is objectively terrifying. She chose this imperfect, unfinished project.  

  *(Raise glass slightly)*  
  So this isn’t about Priya finally becoming ‘one of us’ because some line on a map magically makes it so. It’s about her *claiming* us. And in doing that, she does something profound: she reminds us that this ‘us’ isn’t a wall to keep people out. It’s a circle we redraw every time someone like Priya stands up and says, ‘I’ll help build what comes next.’  

  *(Turn fully to Priya, warm eye contact)*  
  Priya, your courage and commitment humble those of us who took this for granted. You didn’t just cross a line today—you made it mean more. You turned an accident of history into an act of love. So welcome *in*, welcome *home*, and thank you for choosing our messy, arbitrary, wonderful ‘us’.  

  *(Full raise of glass)*  
  To Priya: citizen by choice, neighbor by kindness, and friend by every measure that truly counts. Cheers!"  

  ---

  ### Why this works
  1. **Disarms the tension early**: Acknowledges the academic dilemma ("my whole field argues about who ‘us’ even *is*") with self-deprecating humor, making it relatable.  
  2. **Reframes arbitrariness as agency**: The "line" isn’t natural—but Priya’s *choice* gives it meaning. This flips the boundary problem into a celebration of active participation.  
  3. **Academic Easter eggs**:  
     - "Contested ‘us’" nods to Whelan/Dahl.  
     - "Circle we redraw" hints at the circularity problem while transforming it into collective action.  
     - "Imperfect, unfinished project" echoes democratic theory’s view of nations as ongoing constructions.  
  4. **Wins the "extra credit"**: Makes arbitrariness *moving* by focusing on **shared effort** ("we redraw every time someone... stands up") and **gratitude** ("you made it mean more").  
  5. **Keeps it warm**: Ends on "home," "kindness," and "friend"—universal values that resonate emotionally.  

  Your colleagues will hear the quiet critique of naturalized boundaries; Priya’s book club will hear a toast about choice and belonging. And your spouse? They’ll just be relieved you didn’t say "pre-political unit."  

  *(Side note: If Priya knows your work, she’ll likely appreciate the depth. If not, it’s just a heartfelt toast. Win-win.)*
