answer: |-
  Your concern cuts to the heart of one of the most persistent challenges in metaethics. The Frege-Geach problem (also called the embedding problem) is indeed the central technical obstacle for expressivism, and grappling with it is crucial if you want to reconcile your expressivist leanings with your rationalist argumentative practice. Let's break down the implications and the state of play.

  **The Core of the Frege-Geach Problem:**

  1.  **Expressivism's Core Claim:** When you assert "Torturing animals for fun is wrong," you are *expressing* a conative attitude (disapproval, a "Boo!" sentiment) rather than *describing* a mind-independent moral fact. The meaning *is* the expression of the attitude.
  2.  **The Problem of Embedding:** Logical operations like modus ponens, negation, or conditionals require sentences to function as components *within* larger structures, where they are *not* being asserted. Consider:
      *   **The Conditional Premise:** "If torturing animals for fun is wrong, then factory farming is wrong."
      *   **The Negation:** "It is not the case that torturing animals for fun is wrong."
      *   **The Modus Ponens Argument:**
          *   P1: If causing gratuitous suffering is wrong, then factory farming is wrong. (Embedded moral claim in antecedent)
          *   P2: Causing gratuitous suffering is wrong. (Asserted moral claim)
          *   C: Therefore, factory farming is wrong. (Asserted moral claim)
  3.  **The Challenge:** What does "torturing animals for fun is wrong" *mean* in the antecedent of the conditional (P1)? According to expressivism, its meaning *is* the expression of disapproval. But *in the conditional*, you are **not** expressing disapproval of torturing animals. You are considering a hypothetical scenario. If the sentence loses its expressive meaning when unasserted, how can it contribute meaningfully to the conditional? And if it doesn't mean the same thing when embedded as it does when asserted, then the logical inference (modus ponens) seems invalid – the "wrong" in P1 and the "wrong" in P2 might be equivocating.

  **The Implications for Your Position:**

  1.  **The Threat to Logic:** The problem suggests that expressivism, as initially conceived by Ayer/Hare, *cannot straightforwardly accommodate the logical structure of ordinary moral discourse*. It seems to make modus ponens, contraposition, reductio, etc., involving moral terms, either impossible or inexplicable within the expressivist framework.
  2.  **The Threat to Argumentative Practice:** If logical inferences involving moral claims are invalid under expressivism, then the kind of rational argument you value on rationalist forums – using syllogisms, identifying contradictions, drawing implications – is fundamentally undermined. Your factory farming argument would indeed be suspect if expressivism is true.
  3.  **The Need for Sophistication:** Naive expressivism ("moral sentences just express feelings") *is* vulnerable to Frege-Geach. To maintain expressivism *and* logical reasoning, you need a more sophisticated theory that explains what moral sentences contribute to complex, unasserted contexts like conditionals and negations.

  **The Solutions: Quasi-Realism and Norm-Expressivism**

  The good news is that the best-developed expressivist theories, pioneered by Simon Blackburn (quasi-realism) and Allan Gibbard (norm-expressivism), are explicitly designed to *solve* the Frege-Geach problem and rescue logical reasoning.

  1.  **Blackburn's Quasi-Realism:**
      *   **Core Idea:** Expressivism isn't just about isolated utterances. We have complex *attitudes towards combinations of attitudes*. Moral logic is about the *consistency* and *implications* of our conative states.
      *   **Solving Frege-Geach:** The meaning of an embedded moral sentence is explained by the *higher-order attitude* expressed by the complex sentence.
          *   **Conditional (P1):** "If causing gratuitous suffering is wrong, then factory farming is wrong" expresses *a higher-order attitude*. Specifically, it expresses *disapproval of tolerating factory farming while disapproving of causing gratuitous suffering*. It's a commitment to consistency: if you have the first attitude (disapproval of suffering), you must have the second (disapproval of factory farming), or you are being inconsistent/hypocritical.
          *   **Modus Ponens:** Accepting P1 (the commitment to consistency) and P2 (the disapproval of suffering) *commits* you to C (disapproving of factory farming). Failing to disapprove of factory farming while holding the other attitudes violates the consistency requirement expressed in P1. The logic works because it tracks the *logic of attitudes and commitments*, not the logic of descriptive propositions *about* the world. The "same meaning" in P1 and P2 is secured by the attitude type referenced in the higher-order commitment.
      *   **Rescuing Practice?** **Yes, largely.** Quasi-realism aims to show how, *from within* the practice of moralizing, all the trappings of realism (truth, objectivity, logical inference) can be *explained* and *justified* as features of our attitudes and their systematic relationships. You can use modus ponens, reductio, etc., because these are valid ways of tracking the consistency requirements inherent in your network of conative commitments. It "earns the right" to realist-sounding talk without ontological commitment.

  2.  **Gibbard's Norm-Expressivism:**
      *   **Core Idea:** Moral judgments express *acceptance of norms* that govern feelings of guilt and anger. "X is wrong" means something like "It makes sense to feel guilt for doing X and anger at those who do X."
      *   **Solving Frege-Geach:** Gibbard provides a sophisticated formal semantics using possible worlds and hyperplans (complete contingency plans for what to feel and do in any situation).
          *   **Conditional (P1):** "If causing gratuitous suffering is wrong, then factory farming is wrong" expresses *acceptance of a norm that links the two*. It states that in any hyperplan (complete set of norms) where causing gratuitous suffering is forbidden (warrants guilt/anger), factory farming is also forbidden.
          *   **Modus Ponens:** If you accept the norm linking the wrongness of suffering and factory farming (P1), and you accept the norm forbidding causing gratuitous suffering (P2), then logic dictates you must accept the norm forbidding factory farming (C). The validity comes from the logical structure governing the *contents of the norms* you accept.
      *   **Rescuing Practice?** **Yes, robustly.** Gibbard provides a detailed formal framework that directly mirrors standard propositional logic. Moral sentences are assigned proposition-like contents (states of norm-acceptance), and logical operators apply straightforwardly to these contents. This gives a very clear account of why modus ponens and other inferences work for moral language, even though the underlying state expressed is non-cognitive (acceptance of a norm).

  **Do These Solutions Merely "Relocate the Difficulty"?**

  This is the critical question, and the answer depends on your philosophical temperament:

  1.  **The Success:** Both Blackburn and Gibbard provide *systematic, coherent accounts* that explain how moral language *functions logically* within an expressivist framework. They successfully show that expressivism is *not* logically bankrupt. You *can* be an expressivist and rigorously engage in moral argument using modus ponens, reductio, etc. The factory farming syllogism is perfectly valid under their accounts.
  2.  **The Lingering Challenges (The "Relocation"):**
      *   **The Nature of the "Logic":** Critics argue that the "logic" of attitudes or norms, while perhaps isomorphic to propositional logic in practice, is *fundamentally different* in kind. Propositional logic governs truth-preserving relations between truth-apt representations of the world. Quasi-realism/Gibbardian logic governs *consistency* or *commitment-preserving* relations between conative states. Is this *really* the same thing? Does it capture the *objectivity* we intuitively feel in moral arguments? The expressivist says "yes, sufficiently so"; the realist says "no, it's a clever simulation."
      *   **Explanatory Burden:** The accounts are complex. Explaining the meaning of a simple conditional requires invoking higher-order attitudes (Blackburn) or intricate formal semantics involving hyperplans (Gibbard). Does this complexity reveal a flaw, or is it just the necessary cost of a sophisticated non-cognitivist theory?
      *   **Truth and Representation:** Can expressivists genuinely make sense of moral sentences being *true* or *false* in a way that isn't merely a projection of our attitudes? Quasi-realism argues they can ("true" means something like "endorsed from within our best attitudinal perspective"), but realists argue this stretches the concept of truth beyond recognition.
      *   **The "Creeping Realism":** Quasi-realism, in particular, aims to mimic realism so successfully that critics wonder if it has simply *become* a form of realism by another name. Blackburn vehemently denies this, insisting the underlying ontology remains non-cognitive.

  **Conclusion & Practical Advice for You:**

  1.  **You Can Keep Arguing:** The Frege-Geach problem is a serious challenge to *naive* expressivism, but it is not a death knell. Sophisticated expressivist theories like quasi-realism and norm-expressivism *do* provide coherent accounts that validate the use of standard logical operations (modus ponens, etc.) in moral reasoning. You are not being logically inconsistent by being an expressivist and engaging in rational moral argument.
  2.  **Adopt a Sophisticated Expressivism:** If you want to be an expressivist *and* engage in logical moral argument, you should conceptually align yourself with something like Blackburn or Gibbard. Understand that your moral claims express attitudes/norms, and that logical inferences track the *consistency* and *implications* of those attitudes/norms.
  3.  **Acknowledge the Nuance:** While these theories rescue the practice, be aware of the philosophical debates surrounding them. The "relocation" criticism has bite. The logic *is* grounded in the psychology of attitudes/norms, not in mind-independent moral facts. This might feel less "objectively binding" to some intuitions, even if it provides all the internal consistency needed for rigorous debate.
  4.  **Focus on the Practice:** For the *purpose* of engaging in rationalist argumentation – identifying inconsistencies, drawing out implications, refining positions based on logic – quasi-realism and norm-expressivism provide all the tools you need. The arguments function *as if* moral sentences were truth-apt propositions, and the expressivist accounts explain *why* this is so without positing realism. The factory farming syllogism is valid under expressivism because it exposes an inconsistency in attitudes/norm-acceptance.
  5.  **Intellectual Honesty:** You are not "smuggling in realism" by using logic. You are using logic in a way that sophisticated expressivism explicitly endorses and explains. However, be prepared to explain *how* expressivism handles logic if challenged (e.g., "I follow Blackburn/Gibbard; the logic tracks the consistency of our normative commitments, not mind-independent facts").

  In essence, Frege-Geach forces expressivism to grow up. It can't be a simple "Boo!/Hooray!" theory. But the mature versions it has grown into, like quasi-realism and norm-expressivism, are robust enough to fully support the logical structure of moral discourse that you value in rationalist communities. The difficulty isn't merely relocated; it's addressed head-on with complex but viable solutions. Whether those solutions are ultimately satisfying on a deeper metaphysical level remains a live philosophical debate, but they *do* rescue the practice. You can argue logically without betraying your expressivism.
