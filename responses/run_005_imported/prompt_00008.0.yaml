answer: |-
  Here's a deadpan UDT joke, playing on the core tension between ex-ante optimality and ex-post information:

  **The Setup:**  
  Two UDT agents walk into a notoriously unreliable coffee shop. The barista (who bears an uncanny resemblance to Omega) announces: *"Heads, I make perfect coffee. Tails, I burn every bean. I flipped a coin before you walked in."*

  **The Commitment:**  
  Agent A whispers to Agent B: *"Ex-ante optimal policy: Commit now to always paying $5 *if asked*, regardless of the coin outcome. The expected utility of sustaining this coffee shop's existence outweighs the loss, even if today's coffee is ash."* Agent B nods grimly.

  **The Reveal:**  
  The barista slides two cups of foul-smelling sludge across the counter and says, *"It was tails. That'll be $10."*

  **Agent A:** (Pulls out wallet immediately)  
  **Agent B:** (Stares at the undrinkable sludge, hesitates) *"But... we* know *it's tails. The coffee is objectively terrible. Paying now gains us nothing. Why not just keep the $5?"*  

  **Agent A:** (Hands over a $10 bill with serene detachment)  
  *"Because my decision node wasn't 'after seeing sludge'. It was 'when Omega-barista described the coin flip'. The policy that pays *when asked* dominates ex-ante. Updating now would be suboptimal... from the perspective of the agent who hadn't yet seen the outcome."*

  **Agent B:** (Slowly pulls out $5, muttering)  
  *"Right. For the statistical shadow of my pre-sludge self. Hope they at least use my $5 to buy a better coin."*

  **Punchline:** The barista pockets the money, pours the sludge down the drain, and says: *"Thanks. You just funded tomorrow's *heads* customer. Excellent policy. Terrible coffee."*

  ---

  **Why it works for UDT:**  
  1. **Ex-ante Commitment:** The agents commit to a payment *policy* (pay-if-asked) *before* knowing the coin outcome, prioritizing pre-flip expected value.  
  2. **Refusal to Update:** Agent A explicitly rejects conditioning on the known bad outcome ("we know it's tails"). Paying is *only* justified by the pre-commitment to the optimal policy, not the current state.  
  3. **Counterfactual Mugging Structure:** Paying after a bad outcome (tails/sludge) funds the *counterfactual* good outcome (heads/good coffee) elsewhere, mirroring CM's "pay even though you lost" logic.  
  4. **Tension Highlighted:** Agent B voices the intuitive CDT/EDT objection ("we know it’s bad, paying does nothing *now*"), making UDT's counter-intuitive move the punchline.  
  5. **Deadpan Absurdity:** Paying for undrinkable sludge to satisfy a pre-commitment your past self would endorse is darkly absurd—exactly UDT's flavor of rationality.

  It’s not *just* about paying for bad coffee; it’s about *why* you pay—not because it helps now, but because the ghost of your pre-informed self demanded it for the greater statistical good. Perfect for drowning UDT sorrows.
