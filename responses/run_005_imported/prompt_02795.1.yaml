answer: |-
  ## The Lineup Debate  
  *[Epi and SuperV stand before 10 people arranged left-to-right by increasing height. Person 1 is 150cm, Person 10 is 200cm. Borderline cases cluster in the middle.]*

  **Epi:** Look at the gradient. There *is* an exact point – say, between Person 5 and 6 – where ‘tall’ stops applying. It’s fixed by the meaning of ‘tall’, however unknowable that boundary is to us. Vagueness is epistemic ignorance.

  **SuperV:** Epistemic? Meaning *just is* use! Show me the usage pattern – the shared conventions, the training scenarios, the corrective behavior – that could *possibly* fix a precise cutoff down to the millimeter. Does anyone *use* the word as if it has that hidden sharpness? No. Usage patterns are inherently tolerant to small changes. That’s why there’s *no fact of the matter* whether Person 5 is tall – it’s a truth-value gap until precisified.

  **Epi:** Precisified? Ah, the retreat to ‘acceptable precisifications’. So you say Person 10 is *definitely* tall, Person 1 is *definitely not* tall, and the middle is indeterminate. But what fixes *that*? Where does ‘definitely tall’ start? Is there a sharp boundary between being *definitely tall* and merely *borderline tall*? If so, you’ve just hidden *your* sharp boundary one level up! If not, then ‘definitely tall’ is vague too, and you need precisifications *of your precisifications* – ad infinitum. You haven’t solved the boundary problem, you’ve kicked it upstairs into higher-order vagueness!

  **SuperV:** Nonsense. Higher-order vagueness isn’t a regress; it’s the *structure* of the phenomenon. ‘Definitely tall’ isn’t vague in the same way. It’s supertrue – true on *all* admissible precisifications. Its boundary *emerges* from the constraints on what counts as an admissible way of making ‘tall’ precise, given actual use. There’s no sharp line between admissible and inadmissible precisifications – *that* boundary is genuinely fuzzy, grounded in our linguistic practices. *Your* sharp cutoff is a metaphysical imposition with no basis in use.

  **Epi:** Fuzzy constraints? So meaning floats on a cloud of indeterminacy? That’s not an explanation, it’s surrender! How can a competent speaker *ever* be wrong if admissibility itself is vague? If I call Person 3 ‘tall’, you say it’s unsettled. But if *every* precisification consistent with vague ‘admissibility’ rules counts, maybe *some* admissible precisifications *do* include Person 3! Your framework seems to make truth *too* easy, undermining actual disagreement. My ignorance account preserves classical logic and the reality of error – I can be wrong, I just can’t know *when* near the boundary.

  **SuperV:** Your ‘error’ near the boundary is an illusion! There *is* no fact to be wrong *about* in the borderline zone. Competence isn’t about tracking a hidden line; it’s about sensitivity to the *range* of acceptable uses and the contexts that trigger precisification. Disagreement in borderline cases isn’t factual error; it’s a clash of legitimate precisifications. *Your* view makes competent speakers systematically and inescapably ignorant about the very meanings they supposedly grasp. How is *that* compatible with meaning being use?

  **Epi:** Meaning constrains use, not the other way round in lockstep! The constraints are sharp, even if our *access* to them, through the noisy signal of communal use, is imperfect. Your supertruth relies on ‘admissibility’, but without a sharp meta-boundary defining it, your whole semantics collapses into inconsistency or higher-order mush. My sharp cutoff is mysterious? So is your infinitely ascending tower of vagueness! At least mine stops at ground level. The burden is on *you* to explain how truth-gaps plus vague constraints avoid sharp boundaries *somewhere*.

  **SuperV:** The burden is on *you* to show how usage magically encodes a precise, unknowable threshold! Look at the line. Does *any* feature of how we learned ‘tall’, teach ‘tall’, or apply ‘tall’ suggest a single millimeter matters? No. It suggests tolerance. Admitting semantic indeterminacy in borderline cases *is* respecting use. Your cutoff is a philosopher’s fiction, unsupported by the phenomenon it tries to explain. Vagueness isn’t ignorance; it’s *lack of specificity* in meaning itself.

  **Epi:** And *your* lack of specificity just pushes the specificity problem up a level. We agree on the endpoints. The fight is over the middle. I see ignorance where you see indeterminacy. But mark my words: banish sharp boundaries from the base, and they’ll haunt you in the meta-language. The problem won’t vanish; it just relocates. Good luck finding a room for it upstairs that isn’t just as sharp!

  **SuperV:** And good luck finding that ghostly, usage-transcending, unknowable point on the line! We’ll stick with the messy reality of language as it’s actually used. The boundaries *are* fuzzy – all the way up. That’s not a bug; it’s the feature. Your ghost doesn’t exist.

  *[Both glare at the middle of the line, unconvinced.]*
