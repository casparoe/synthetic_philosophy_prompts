prompt: |-
  Over the past year, my job has shifted from general machine-learning work to a small causal-inference team, where much of my week now involves building structural causal models and using do-calculus to estimate treatment effects from observational data. At a recent journal club, a colleague who did a philosophy PhD before moving into industry mentioned, almost in passing, that everything our team does is essentially an implementation of Woodward's "interventionist" theory of causation, and that this is a genuine rival to the older theory of causation I dimly remember from an undergraduate philosophy elective — the one on which causation is analyzed as counterfactual dependence, cashed out via similarity among possible worlds (Lewis's theory, I believe). When I asked her whether the two views actually disagree about anything substantive, or whether interventionism is really just a formal, graph-friendly restatement of the same underlying idea, she said that question was exactly what divides people in the literature, and then had to dash off before saying anything more. It has been nagging at me ever since.

  I would like your help thinking this through, in the form of a dialogue between two philosophers, each a fully convinced and technically sophisticated defender of one of these views: one a committed Lewisian counterfactual theorist, the other a committed Woodwardian interventionist. Rather than trading slogans, I would like them to work through a concrete case together: suppose two independent sensors are both monitoring the same faulty fuse, each wired to trip a circuit breaker the instant it detects an overload; sensor A detects the overload and trips the breaker a few milliseconds before sensor B's own signal arrives, so that B's signal reaches an already-tripped breaker and accomplishes nothing. I want the two characters to argue about whether, and in virtue of what, A's detection counts as a cause of the breaker's tripping, given that the breaker would have tripped at essentially the same instant even without A, purely courtesy of B. Beyond that case, I would also like the Lewisian to press the interventionist on whether defining causation in terms of "interventions" is viciously circular, since an intervention is itself specified in causal terms — and I would like the interventionist to get a genuine opportunity to answer that charge, perhaps by turning it back on the Lewisian's similarity metric, which some critics say is reverse-engineered to fit our causal intuitions rather than independently motivated. Please do not let either side win by default or concede a point just to move things along; I want to see exactly where the disagreement bites once the terminology is stripped away, rather than a mere restatement of each theory's slogans.
reasoning: |-
  We are going to create a dialogue between two philosophers: Lewis (defending the counterfactual theory of causation) and Woodward (defending the interventionist theory). The scenario is about two sensors and a circuit breaker. We'll have them discuss whether sensor A's action is a cause of the breaker tripping, and then move to the circularity charge.

  Setting: A philosophy conference during a coffee break. Lewis and Woodward are having a conversation.

  Characters:
  - Lewis: A proponent of the counterfactual theory of causation (David Lewis's view). He believes that causation is to be analyzed in terms of counterfactual dependence: event c causes event e if and only if, if c had not occurred, then e would not have occurred (in the relevant circumstances).
  - Woodward: A proponent of the interventionist theory of causation (James Woodward's view). He defines causation in terms of what would happen under interventions: a variable X is a cause of a variable Y if there is a possible intervention on X that would change Y (or the probability distribution of Y), while holding fixed other variables appropriately.

  The scenario: Two independent sensors (A and B) monitor a faulty fuse. Sensor A detects the overload and trips the breaker a few milliseconds before sensor B's signal arrives. Sensor B's signal arrives at an already-tripped breaker and does nothing. The breaker would have tripped at essentially the same time due to sensor B even if sensor A had not acted.

  We want to see:
  1. Whether, in this scenario, A's detection is a cause of the breaker tripping according to each theory.
  2. How each theory handles the case and what the disagreement reveals.
  3. The circularity charge: Lewis will press Woodward on whether defining causation in terms of interventions is circular because interventions are themselves causal. Woodward will have a chance to respond and turn the charge back on Lewis's similarity metric.

  Let the dialogue begin.

  ---

  **Lewis:** Jim, I was thinking about that example with the two sensors and the circuit breaker. It seems to me that in this case, sensor A's action is not a cause of the breaker tripping. After all, the breaker would have tripped at almost the same time anyway because of sensor B. So, if we consider the counterfactual "if sensor A had not detected the overload, would the breaker still have tripped?" the answer is yes. Therefore, there's no counterfactual dependence of the tripping on A's action. Hence, by my theory, A is not a cause.

  **Woodward:** David, I disagree. In the interventionist framework, we can indeed consider an intervention on A. Let me set up the model. We have two binary variables: A (sensor A's detection and signal) and B (sensor B's detection and signal). The breaker tripping (T) is a function of A and B: T occurs if either A or B occurs. Now, we can intervene to set A to 0 (i.e., prevent A from detecting and sending a signal). In that case, what happens? Well, B would still occur and cause T. So, under this intervention, T still happens. But that doesn't mean A isn't a cause.

  **Lewis:** Then how do you get A to be a cause? It seems you just agreed with me that without A, T still happens.

  **Woodward:** Not so fast. The interventionist theory doesn't require that an intervention on the cause variable changes the effect variable in every context. What we require is that there is some context in which an intervention on X would change Y. Alternatively, we can look at the actual situation and see if the effect is sensitive to changes in the cause when we control for other factors. But in this case, we have to consider the actual value of B. In the actual situation, B did occur. However, note that in the actual sequence of events, A occurred first and caused T. B's signal arrived too late and was preempted.

  **Lewis:** But in your interventionist terms, if we set A=0 (by an intervention), then T would still be 1 because B=1. So the effect is not counterfactually dependent on A. How can A be a cause?

  **Woodward:** Let me clarify. The interventionist account uses the concept of an intervention to define what it means for X to be a cause of Y. Specifically, X is a cause of Y in a given model if there exists a possible intervention on X that would change Y when all other variables are held fixed at some values (or in some background context). But note: we don't require that the intervention changes Y in every context. In fact, in this case, in the context where B is set to 1 (as it actually was), changing A doesn't change T. But consider a different context: suppose we set B to 0 (by an intervention on B) and then intervene on A. Then, if we set A=1, T=1; if we set A=0, T=0. So in that context, T depends on A. Therefore, A is a cause of T.

  **Lewis:** But in the actual situation, B was 1, not 0. So why should we care about what happens when B is set to 0? That's not the actual scenario.

  **Woodward:** Because causation is not just about what happens in the actual situation; it's about what would happen under various interventions. The idea is that a cause is something that has the capacity to make a difference. In the actual situation, A did make a difference in the sense that it was the event that actually triggered T. But even if it hadn't, the capacity is still there. We capture that by showing that in some situations (i.e., when B is not active) A does make a difference.

  **Lewis:** But that seems to be overcounting causes. By that token, almost everything is a cause. For example, if I have a backup system that never kicks in, you'd still say it's a cause because in some hypothetical scenario where the main system fails, it would work. But in the actual situation, it did nothing. In this case, in the actual situation, A did do something, but it was redundant because B would have done it anyway.

  **Woodward:** But in the actual situation, A did trigger the breaker. The fact that B was also present and would have triggered it doesn't change that A actually caused it. The interventionist account captures this by noting that in the actual world, with the actual values of the variables, A is part of the minimal set of variables that suffice to determine T. But more importantly, we can test for causation by considering what would happen if we wiggle A while holding fixed other variables at their actual values. However, note that in the actual context (B=1), wiggling A doesn't change T. So how do we capture A's causal role?

  We need to use the concept of an "actual cause" in interventionist terms. One way is to use the idea of a "direct cause" in the structural model. In the structural equation for T, we have T = A OR B. So both A and B are direct causes of T. But that might be too simplistic. Alternatively, we can use the notion of an intervention that sets A to 0 while holding fixed B at its actual value (which is 1). Then T remains 1. So no change. But that doesn't show A isn't a cause. It only shows that in the presence of B=1, A is redundant. However, if we consider an intervention that sets A to 0 and also sets B to 0, then T=0. But that's an intervention on two variables.

  The interventionist account for actual causation is often spelled out by considering whether the effect is sensitive to the cause when we hold fixed other variables at their actual values. But in this case, holding B fixed at 1, changing A does nothing. So why is A a cause? Well, we have to consider the possibility that the actual value of B might not have been 1. But that's where the counterfactual comes in.

  **Lewis:** This is getting messy. Let me try to be clear on my view. In my counterfactual theory, for A to be a cause of T, it must be that if A had not occurred, then T would not have occurred. But in this case, if A had not occurred, then B would have caused T at almost the same time. So T would have occurred anyway. Therefore, A is not a cause. It's a preempted cause, but the preemption doesn't save it because the backup (B) actually worked. In my theory, we handle preemption by considering the chain of events. But in this case, the backup did not just stand by; it was about to fire, but was preempted by A. However, since the timing is almost the same, we can say that T would have occurred without A, so A is not a cause.

  **Woodward:** But that's counterintuitive. Most people would say that A caused the tripping because it was the one that actually did it. Your theory seems to have a problem with preemption. In fact, you've written about preemption cases, and you have ways to handle them. But in this case, because the timing is so close, you are saying A is not a cause? That seems wrong.

  **Lewis:** Actually, I do have a way to handle preemption. In cases of preemption, we often have a chain of events. Suppose that A's signal not only trips the breaker but also disables B's signal in some way. Then we can say that without A, B would have tripped the breaker, but also without A, B would not have been disabled, so it would have tripped. But in this case, there's no disabling. The breaker is tripped by A, and then when B's signal arrives, the breaker is already tripped so it does nothing. But that doesn't disable B; it's just that B's signal is ineffective. So without A, B's signal would still have been sent and would have tripped the breaker. So T would have occurred. Therefore, no counterfactual dependence.

  **Woodward:** But consider the timing. The breaker tripped at time t because of A. If A hadn't occurred, the breaker would have tripped at time t+δ (a few milliseconds later) because of B. So if we are precise about the time, then without A, the tripping would have occurred at a different time. Therefore, the exact event of the breaker tripping at time t would not have occurred. So there is counterfactual dependence if we include the time.

  **Lewis:** Ah, but in my theory, events are fragile. If we specify the event T as "the tripping at time t", then without A, T (as defined at time t) would not have occurred. So then A would be a cause. But that's a trick. We don't usually care about such precise timings. If we take T to be the tripping within a small interval, say from t to t+δ, then without A, T would have occurred in that interval (because B would have tripped it at t+δ, which is in the interval). So then there's no counterfactual dependence.

  **Woodward:** So it depends on how we individuate events? That seems problematic.

  **Lewis:** Not necessarily. It's a feature that we can be more or less fine-grained. But in practice, we might say that the tripping at time t and at time t+δ are different events. So if we care about the exact timing, A is a cause of the tripping at t. But if we care about whether the breaker tripped at all in a relevant interval, then both A and B are causes? But that doesn't seem right either because B didn't actually do anything.

  **Woodward:** This is where interventionism has a more straightforward approach. We can say that A is a cause of T because in the structural model, T is a function of A and B, and both are direct causes. Moreover, we can test by intervention: if we set A=0 and B=0, then T=0. But if we set A=0 and B=1, T=1. And if we set A=1 and B=0, T=1. So both A and B are causes. But in the actual situation, A=1 and B=1, so both are present. However, in the actual sequence, A acted first and brought about T. So we can say that A was the actual trigger. But the model doesn't require that only one cause is active.

  **Lewis:** But that makes both A and B causes in the actual situation. But B's signal didn't actually do anything because the breaker was already tripped. So how can it be a cause?

  **Woodward:** Because in the model, if we remove B (set it to 0) and keep A=1, T still happens. So B is redundant in this context. But that doesn't mean it's not a cause. It just means it's not necessary in this context. The interventionist account doesn't require that a cause is necessary in the actual situation; it requires that it has the capacity to make a difference in some situations. And B does: in situations where A is 0, B makes a difference.

  **Lewis:** But then you are calling B a cause in the actual situation even though it did nothing. That seems wrong.

  **Woodward:** But in the actual situation, B was set to 1 (it did send the signal). The fact that it didn't have an effect because A preempted it doesn't change that it was a cause in the model. However, we might want to say that in the actual world, only A was the actual cause. This is a tricky case. Some interventionists might use the concept of an actual cause by requiring that the effect counterfactually depends on the cause in the actual context when we hold fixed the other variables at their actual values. But in this context, holding B fixed at 1, changing A from 1 to 0 doesn't change T. So A would not be a cause? That would be a problem.

  **Lewis:** Exactly! So then interventionism has the same problem as my theory.

  **Woodward:** Not necessarily. We can use a different approach. We can consider the process. In the interventionist framework, we can look at the path-specific effect. The signal from A went through and caused T. The signal from B was too late. So we can say that A is a cause along the actual path. But I admit, this is an area where both theories have to do some work.

  Let me change the subject to the circularity charge you mentioned. You think that defining causation in terms of interventions is circular because an intervention is itself a causal concept. How do you respond to that?

  **Lewis:** Indeed, that's a problem. You define an intervention on X as an exogenous change that sets X to a particular value without affecting other variables except through X. But that "without affecting other variables except through X" is a causal constraint. So you are using causal notions to define interventions, and then using interventions to define causation. That's circular.

  **Woodward:** I agree that the definition of intervention is causal. But the circularity is not vicious. We can think of the interventionist account as providing a reduction of causal concepts to a combination of causal and non-causal (e.g., functional) concepts. Moreover, the account is embedded in a framework of structural equations and directed graphs, which are non-causal in the sense that they are mathematical objects. The causal content is in the interpretation. But the key point is that the interventionist account provides a way to connect causal claims to testable predictions. For example, if I say that X causes Y, then I am committed to the claim that if I were to intervene to change X (in the appropriate way), Y would change. This makes causation empirically meaningful.

  **Lewis:** But you haven't eliminated the causal concepts; you've just moved them around.

  **Woodward:** The goal isn't necessarily to eliminate all causal concepts but to provide a clear and useful account that connects to practice. In science, especially in your field of causal inference, we use interventions (like randomized experiments) to test causal claims. The interventionist account makes explicit the connection between causation and manipulation. And note: your counterfactual theory also uses causal concepts implicitly. For example, when you evaluate the counterfactual "if A had not occurred, then ...", you are relying on a notion of similarity between possible worlds. But what determines similarity? One of the factors is avoiding widespread, diverse, and big miracles (as you say). But also, you want to hold fixed the laws of nature. And the laws of nature include causal laws. So your similarity metric is already infused with causal considerations. Therefore, your account is also circular.

  **Lewis:** That's a fair point. But I think my account is still more reductive because the similarity metric is based on considerations of similarity in events and laws, which are not explicitly causal. We can have a non-causal account of laws (e.g., Humean). But I admit, the critics might say that the similarity metric is tuned to match causal intuitions.

  **Woodward:** Precisely. So both accounts face a similar challenge. But the interventionist account has the advantage of being more directly tied to scientific practice. In the sensor example, if we were to test whether A is a cause, we could run experiments where we manipulate A while holding B fixed. We might find that in some runs (when B is active) A seems redundant, but in other runs (when B is not active) A is necessary. So we can say that A is a cause. And that matches our intuition that A actually caused the tripping in the scenario.

  **Lewis:** But in the actual situation, we don't need to run an experiment; we know what happened. And we know that without A, T would have happened anyway. So why call A a cause?

  **Woodward:** Because causation is not just about necessity in the actual situation; it's about what happened in the actual sequence. A was the event that triggered the breaker. The fact that B was there as a backup doesn't change that A was the one that did it.

  **Lewis:** But then we are at an impasse. I think we have to agree to disagree. But I will think more about how to handle the preemption in my theory without appealing to fragile events.

  **Woodward:** And I will think about how to capture the actual causal role of A in the interventionist framework without overcounting B. Perhaps we need to incorporate time explicitly in the model. But that's a topic for another day.

  ---
  The dialogue shows that both theories have difficulties with preemption cases, but they approach them differently. The counterfactual theory (Lewis) requires counterfactual dependence, which is absent when the backup would have produced the same effect. The interventionist theory (Woodward) can call both A and B causes because they are both connected to the effect in the model, but then struggles to explain why in the actual scenario B is not an actual cause. The circularity charge is met by Woodward with the point that both theories rely on causal concepts in their foundations, and that interventionism has practical advantages. However, the core disagreement remains about what it means for an event to be a cause in a redundant or preemptive scenario.
answer: |-
  Below is a dialogue between two philosophers—**Lewis** (defending David Lewis's counterfactual theory of causation) and **Woodward** (defending James Woodward's interventionist theory)—discussing your sensor-and-breaker scenario. They engage rigorously, without concession, and address both the concrete case and the deeper circularity challenge. The dialogue is structured to strip away jargon and reveal foundational disagreements.

  ---

  ### **Characters**
  - **Lewis**: Counterfactual theorist. Causation is defined as counterfactual dependence: event \(c\) causes event \(e\) iff, if \(c\) had not occurred, \(e\) would not have occurred (under a similarity-weighted analysis of possible worlds).
  - **Woodward**: Interventionist. Causation is defined in terms of interventions: \(X\) causes \(Y\) iff an ideal intervention on \(X\) changes \(Y\) (or its probability distribution), where interventions are defined non-causally via graphical models.

  ---

  ### **The Dialogue: Part 1 – The Sensor Case**
  **Woodward**: Let’s dissect your sensor example. Sensor A detects the overload and trips the breaker at time \(t\). Sensor B’s signal arrives milliseconds later at \(t+\delta\), but the breaker is already tripped, so B’s signal is inert. The breaker would have tripped at \(t+\delta\) if A hadn’t acted. You’d deny A is a cause, I assume?  

  **Lewis**: Precisely. For A to cause the tripping, the tripping must counterfactually depend on A. But if A had not occurred, B would have tripped the breaker at \(t+\delta\)—nearly the same time. The tripping event \(e\) (under a *robust* description like “breaker trips within 5 milliseconds of the overload”) still occurs. No dependence, no causation. A is preempted, but preemption only “counts” if the backup fails. Here, B succeeds.  

  **Woodward**: That’s absurd. In the actual world, A’s signal *is* what trips the breaker. B’s signal is causally inert—it hits a dead system. Your theory mistakes redundancy for causal irrelevance. Interventionism captures this: an ideal intervention setting A to “no signal” (while holding B fixed at its actual state) leaves the tripping unchanged—*if* we ignore time. But time matters. Define the effect precisely: “breaker trips at *exactly* \(t\).” Now intervene: set A to “no signal.” Result: no tripping at \(t\) (B trips at \(t+\delta\)). So, changing A changes the time of tripping. A is a cause.  

  **Lewis**: You’re gerrymandering the event description to manufacture dependence. We describe events coarsely in ordinary causation—e.g., “the breaker tripped,” not “tripped at \(t \pm 0.1ms\).” Your move exposes interventionism’s instability: if we define effects finely, everything is a cause; if coarsely, nothing is. My similarity metric avoids this. Worlds where A doesn’t occur and B trips at \(t+\delta\) are very similar to actuality—same laws, minimal divergence. In such worlds, \(e\) (coarsely described) still occurs. No dependence.  

  **Woodward**: Not gerrymandering—precision. Your “coarse description” ignores the physical specificity of causation. The actual tripping is a concrete event at \(t\), produced by A’s signal. B’s signal is *counterfactually* effective but *actually* irrelevant. Interventionism handles this: in the structural model, tripping (\(T\)) is a function of A and B, but with temporal order:  
  - \(T = 1\) at \(t\) if A signals at \(t\).  
  - If not, \(T = 1\) at \(t+\delta\) if B signals at \(t+\delta\).  
  Intervening on A (setting A=0) while holding B’s state fixed changes \(T\)’s time. A is a direct cause.  

  **Lewis**: But in your model, B is *also* a cause—it’s in the function for \(T\). Yet B does nothing actual! Interventionism overcounts causes. Worse, it conflates *capacity* with *actual production*. B has the capacity to trip the breaker, but only A actually produced it. Your “holding B fixed” intervention misses that in the actual world, B’s state is “signal sent but ineffective.”  

  **Woodward**: No conflating. Interventionism distinguishes *type* causation (B can cause tripping) from *token* causation (did B cause *this* tripping?). For token causation, we use actual values: fix B at its actual value (signal sent at \(t+\delta\)), intervene on A. Since \(T\) changes (from \(t\) to \(t+\delta\)), A is a token cause. B isn’t, because intervening on B (setting B=0) while fixing A (signal sent at \(t\)) leaves \(T\) unchanged—B is irrelevant *given A*.  

  **Lewis**: Still circular! You “fix B” at its actual value, but that value—“signal sent”—is itself causal (B’s detection caused the signal). Your “fixing” presumes causal structure. Worse, your intervention on A assumes we can disrupt *only* A without affecting B—but in reality, sensors share an environment. Your “ideal intervention” is a causal fantasy.  

  **Woodward**: Interventions are non-causal in formalism. In the graph, an intervention on A severs its incoming edges and sets its value. No causal language—just graph surgery. For B, we fix its value as specified by the model’s equations. Here, B’s value is independent of A, so fixing it is just setting a parameter.  

  **Lewis**: Independence is causal! You presume A and B have no common causes. But what if voltage fluctuations affect both? Then “fixing B” requires fixing its causes, and so on ad infinitum. Your scaffolding is causal.  

  ---

  ### **Part 2 – The Circularity Charge**  
  **Lewis**: Let’s dig deeper. You define causation via interventions. But an intervention \(I\) on \(X\) must:  
  - Determine \(X\)’s value.  
  - Not be influenced by other variables.  
  - Affect \(Y\) only through \(X\).  
  The third condition—"only through \(X\)"—is causal! You’re using causation to define causation. Viciously circular.  

  **Woodward**: Not circular. The condition is *non-causal*: “affects \(Y\) only through \(X\)” means \(I\) and \(Y\) are d-separated given \(X\) in the graph. No causal language—just probabilistic independence. Graph structure is axiomatic; interventions are hypothetical.  

  **Lewis**: But d-separation encodes causal independence! Graphs aren’t “axiomatic”; they’re reverse-engineered from causal intuitions. You start with known causes and build models to fit. That’s no better than my similarity metric.  

  **Woodward**: Then your metric is equally circular! You say worlds where only a small, local miracle prevents A (and B trips at \(t+\delta\)) are closer than worlds with big miracles. But why? Because you prioritize worlds where *causal dependencies are preserved*. Your similarity weights avoid backtracking (e.g., “if A didn’t occur, the overload might not have happened”) to match causal intuitions. It’s engineered for causation!  

  **Lewis**: False. Similarity is based on *non-causal* features: spatiotemporal match, size of miracles, lawfulness. We minimize miracles to preserve the *non-causal* fabric of worlds. Causation emerges.  

  **Woodward**: But “lawfulness” includes causal laws! And your weights are tuned to *our* causal judgments. If I say worlds where B’s signal mysteriously vanishes are closer than worlds where it’s delayed, your metric shifts. It’s parasitic on causation.  

  **Lewis**: Then interventionism is parasitic too. You need causal knowledge to build graphs. For the sensors, you assumed A and B are independent. But that’s a causal claim! Without it, your intervention fails.  

  **Woodward**: Independence is statistical, inferred from data. We observe A and B’s signals are uncorrelated, deduce no common cause, then build the model. No prior causation—just patterns.  

  **Lewis**: Patterns don’t imply causal independence! They could be confounded. You use causal assumptions (no hidden confounders) to justify the model. Circularity remains.  

  **Woodward**: So does yours. When evaluating “if A hadn’t occurred, would B have tripped the breaker?”, you hold fixed the overload and sensor function—causal facts! Both theories rely on primitive causal structure. But interventionism is superior: it operationalizes causation via testable interventions. Science uses it daily—do-calculus, RCTs. Your counterfactuals are untestable metaphysics.  

  **Lewis**: Untestable? Counterfactuals guide policy! “If we ban substance X, would disease Y decrease?” is your intervention in disguise. But only I ground it in objective similarity. You rely on human-dependent “interventions.”  

  **Woodward**: Interventions are idealized but objective—defined by graph properties. Your similarity is subjective; two people might weight miracles differently.  

  **Lewis**: Not subjective—governed by laws and spatiotemporal continuity.  

  **Woodward**: Laws you stipulate. It’s a standoff.  

  ---

  ### **Where the Disagreement Bites**
  1. **On the sensor case**:  
     - **Lewis** denies A is a cause. Coarse-grained effects + similarity metric show no counterfactual dependence.  
     - **Woodward** affirms A is a cause. Fine-grained events + interventions show dependence in time.  
     - **Core clash**: Is causation about actual production (Woodward) or dependence across worlds (Lewis)?  

  2. **On circularity**:  
     - Both theories rely on causal primitives.  
     - **Lewis’s metric** presumes non-causal laws to avoid backtracking.  
     - **Woodward’s interventions** presume graphical independence.  
     - **Core clash**: Is circularity resolved by objective similarity (Lewis) or testable interventions (Woodward)?  

  Neither concedes. Lewis sees interventionism as practical but shallow; Woodward sees counterfactualism as intuitive but untestable. The divide persists in the metaphysics of science: is causation a feature of reality (Lewis) or a tool for prediction (Woodward)?  

  ---  
  **Key Insight**: The theories *disagree substantively* on redundant causation (like your sensors). For Lewis, causes must be necessary in the circumstances; for Woodward, they need only be sufficient and manipulable. Circularity charges stick to both, but Woodward argues his account is empirically grounded, while Lewis claims his is metaphysically deeper. The impasse reflects a philosophical stalemate with real stakes for causal inference.
