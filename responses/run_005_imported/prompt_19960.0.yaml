prompt: |-
  For the past three years, a former colleague of mine, Owen, and I have co-produced and sold a self-paced online course on backend system design. We've always split the revenue 50/50 without much debate, since we contribute roughly equally to keeping it updated. A well-known tech-education company has now offered to acquire exclusive rights to the entire back catalog for $120,000, an amount Owen and I are free to divide between ourselves however we like (we co-own the material outright, so the exclusivity deal requires both of our signatures). Separately, the company also wants to sign one of us to a two-year, $300,000 "staff instructor" contract to build new flagship content; based on their audience testing, they've made clear they want Owen specifically for that role, and it isn't something I could take even if I wanted to. Crucially, the instructor contract only exists as part of the same bundle: the company won't do it unless we also grant exclusivity, and won't grant exclusivity unless I agree too. If we don't reach an agreement on the whole package, their fallback is a smaller, non-exclusive license on the existing catalog worth $40,000 total, split 50/50 as usual — meaning $20,000 each — and the instructor offer disappears entirely.

  Owen's proposal is to split the $120,000 catalog payment 50/50, giving each of us $60,000, and to keep the entire $300,000 instructor contract for himself, on the grounds that "that one's mine, you couldn't have done it anyway." That leaves him with $360,000 total and me with $60,000. Something about this nags at me: yes, I can't do the instructor work, but Owen also can't unlock any of that $300,000 without my signing off on exclusivity, and it feels like my agreement ought to be worth more than just my usual half of a licensing fee. At the same time, I don't think I'm owed some kind of half-share of the $300,000 either, since that money really is tied to work only Owen can do. A mutual friend who practices law told us Owen's proposal "sounds about standard," which didn't really settle anything for me, since I'm not sure what principle she was applying. We're meeting the company's lawyers again next week, and I'd like to reason this through properly rather than negotiate from gut feeling. Is Owen's proposed split defensible, and if not, what would a more principled way of dividing this actually look like?
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been co-producing an online course with Owen for three years, splitting revenue 50/50. Now there's a complex offer from a tech-education company involving two parts: a $120k buyout for their existing catalog, and a $300k instructor contract specifically for Owen. 

  The user feels uneasy about Owen's proposal to take the entire $300k while splitting the $120k equally. The key tension seems to be that while Owen is the only one who can fulfill the instructor role, the user's consent is essential to make the entire deal happen. 

  Hmm, I need to analyze why the user finds this unfair despite Owen's "you couldn't have done it anyway" argument. The mutual friend/lawyer saying it's "standard" didn't help - probably because it ignores how the deal components interconnect. 

  Breaking it down: without user's agreement, Owen gets zero from the instructor contract. The $300k isn't just payment for future work - it's enabled by the exclusivity the user controls. But equally, the user couldn't access that $300k alone either. 

  The BATNA clarifies things: if they walk away, both get $20k. So the total cooperative surplus is ($360k + $60k) minus ($20k + $20k) = $380k. That's the value created by their agreement. 

  Owen's proposal gives him $340k surplus vs user's $40k. But since both are equally necessary to create the $380k, shouldn't they split that surplus equally? That would mean each getting $190k above BATNA - so user gets $210k total, Owen gets $550k. 

  The user explicitly says they don't expect half the instructor fee, which shows good faith. My calculation gives them 35% of combined payouts rather than 14% in Owen's plan - which better reflects their veto power over the deal's most valuable part. 

  I should emphasize this isn't about claiming credit for Owen's skills, but about the leverage created by mutual dependency. The company's bundle design makes them co-dependent negotiators. 

  Also worth noting: if Owen rejects this and insists on his split, the user could reasonably block the deal since $60k vs $20k BATNA isn't compelling. That nuclear option benefits nobody, which is why finding a principled middle ground matters.
answer: |-
  Your discomfort is justified—Owen's proposal overlooks the critical interdependence of the two offers. While the $300k instructor contract is tied to Owen's skills, it **only exists because you agree to grant exclusivity**. This creates a bargaining dynamic where your consent unlocks value for Owen beyond your usual collaboration. Here's a principled framework for a fair split:

  ### Core Principles
  1. **Your BATNA (Best Alternative to Negotiated Agreement)**:  
     - Without a deal: $20,000 (from the $40k non-exclusive license).  
     - Owen’s BATNA: $20,000 (same).  

  2. **Total Joint Value from the Deal**:  
     - Combined gain: **$120k (catalog) + $300k (instructor) = $420k**.  
     - Minus BATNA value ($40k total): **$380k in cooperative surplus**.  

  3. **Veto Power & Mutual Dependency**:  
     - The $300k instructor contract requires your signature on exclusivity.  
     - Owen cannot access the $300k without you, just as you cannot access the instructor role.  

  ### Fair Division Strategy: Equal Surplus Split
  - **Step 1**: Calculate individual BATNAs:  
    - You: **$20k**  
    - Owen: **$20k**  
  - **Step 2**: Distribute the $380k surplus equally:  
    - Each gets **$190k** of surplus value.  
  - **Step 3**: Add BATNA back:  
    - You: $20k + $190k = **$210k**  
    - Owen: $20k + $190k = **$210k**  
  - **Step 4**: Assign payments from the deal:  
    - Catalog payment ($120k): Entirely to you ($120k).  
    - Instructor contract ($300k): $90k to you + $210k to Owen.  
    - **Total**: You = $120k + $90k = $210k; Owen = $210k.  

  ### Why This Is Fair
  - **Recognizes interdependence**: Your agreement unlocks $300k for Owen, so you deserve a share of that value.  
  - **Preserves equity**: You split the surplus generated by cooperation equally, respecting both BATNAs.  
  - **Practical implementation**:  
    - You receive the entire $120k catalog payment.  
    - Owen receives $210k from the instructor contract, while you get $90k (paid via invoice or side agreement).  

  ### Addressing Owen’s Argument
  - Owen’s claim that "you couldn’t have done the instructor work" is valid **but incomplete**.  
  - Without your consent, Owen’s $300k opportunity vanishes. Your veto power over exclusivity creates shared leverage.  
  - This split compensates you for enabling Owen’s windfall, without claiming credit for his labor.  

  ### Comparison to Owen’s Proposal
  | **Proposal**       | Your Total | Owen’s Total |  
  |---------------------|------------|--------------|  
  | Owen’s Split        | $60k       | $360k        |  
  | Equal Surplus Split | $210k      | $210k        |  
  | BATNA (No Deal)     | $20k       | $20k         |  

  ### Negotiation Path
  1. **Frame it cooperatively**:  
     > *"We both gain by making this deal, but my agreement unlocks $300k for you. A 50/50 surplus split reflects that mutual dependency."*  
  2. **Highlight the company’s role**:  
     - The bundle only works if both sign. The company’s offer design makes you co-gatekeepers.  
  3. **Compromise if needed**:  
     - If Owen resists, aim for a smaller surplus share (e.g., 60/40): You get $154k total ($134k surplus), Owen gets $266k ($246k surplus).  

  ### Key Takeaway
  **Your signature has direct economic value** because it unlocks $300k for Owen. A 50/50 surplus split above BATNAs is the most defensible principle, giving you **$210k** to Owen’s **$210k** from the combined $420k. This is neither "half the instructor fee" nor "standard licensing terms"—it’s a tailored solution for joint leverage.  

  Present this as a partnership-preserving approach: Without your consent, Owen’s $300k vanishes. With it, you both gain substantially beyond your fallbacks.
