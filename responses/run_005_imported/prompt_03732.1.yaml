answer: |-
  This is a profoundly difficult and ethically rich situation. Based on bioethical principles and best practices in mental health advance care planning, **you should agree to your sister's request.** Here's why, along with crucial qualifications:

  1.  **Respecting True Autonomy (Respect for Persons):** Your sister's request *now*, while stable and competent, represents her authentic wishes and values. She is exercising her autonomy *in advance*, recognizing that her capacity for rational decision-making will be impaired during mania. Overriding her wishes *during* an episode is actually respecting the wishes she expressed *when* she had full capacity. It honors her "past competent self."
  2.  **Beneficence and Non-Maleficence:** Manic episodes can cause significant harm – financial ruin, destroyed relationships, legal trouble, physical injury, or even death. Stopping medication or leaving the hospital prematurely drastically increases these risks. By intervening, you are acting in her best interests to prevent serious harm, even if she vehemently denies the need in the moment.
  3.  **Insight and Self-Awareness:** Your sister demonstrates remarkable insight into her condition. She knows her judgment is impaired during mania and that she loses the ability to recognize she is ill (this is called "anosognosia"). Her request is a rational, self-protective measure.
  4.  **The Nature of Mania and Capacity:** During acute mania, a person may *appear* conscious and verbally competent – they can speak fluently and forcefully. However, their reasoning, judgment, insight, and ability to weigh risks/benefits are often severely impaired. Their stated wishes in that moment do not reflect their true values or long-term well-being. This is precisely why advance directives exist in mental healthcare.
  5.  **Advance Directives in Mental Health:** Psychiatric Advance Directives (PADs) are legal documents (availability varies by jurisdiction) where individuals can specify their treatment preferences and appoint a healthcare proxy *before* a crisis. Your sister's request aligns perfectly with this concept. Her asking you is an informal PAD.

  **Crucial Qualifications and How to Proceed:**

  *   **Agreeing is Ethical and Necessary:** You should agree to her request. Frame it as supporting *her* expressed will, not overriding her.
  *   **You ARE Bound, But With Nuance:** Yes, you are ethically bound to carry out her request **when the specific criteria she outlined are clearly met** (entering mania, insisting she's fine, wanting to stop meds/leave AMA). This isn't arbitrary; it's fulfilling a promise based on her known condition and explicit wishes.
  *   **The "Line" is Defined by Her Capacity:** Crossing a line would be overriding the wishes of someone *with* decision-making capacity. During acute mania impairing judgment related to her treatment, she *lacks* that capacity *for these specific decisions*. You are acting on her prior capable directive.
  *   **Preparation is Key (Minimizing Doubt):**
      *   **Document Her Wishes:** Have her write down her specific request, signed and dated, while stable. List the warning signs *she* recognizes as the start of mania and explicitly state she wants you to contact her psychiatrist and ensure she stays in treatment/hospital *despite* her protests during an episode.
      *   **Involve the Psychiatrist NOW:** Schedule a joint meeting (or at least a phone call with your sister's consent) with her psychiatrist. Discuss her request, the warning signs, and her documented wishes. The psychiatrist can:
          *   Confirm the validity of her advance request.
          *   Help define clearer "trigger" signs specific to her.
          *   Explain the legal/clinical landscape in your area (including PADs if available).
          *   Provide guidance on what "calling them" entails and how they will respond.
          *   Become your ally and point of contact when the crisis hits.
      *   **Define "Entering a Manic Episode":** Work with your sister and her psychiatrist to identify *her* specific early warning signs (e.g., sleeping less than 4 hours, rapid pressured speech, sudden grandiose plans, excessive spending). This reduces ambiguity for you.
      *   **Clarify Your Role:** Agree that your *only* role is to recognize the warning signs and call the psychiatrist. You are not expected to physically restrain her or make clinical decisions. The psychiatrist and clinical team will take over based on her documented wishes and their assessment.
  *   **The Challenge of "Changed Mind":** This is the hardest part. In the moment, it will feel impossible to distinguish illness-driven demands from a genuine, capacity-endowed change of heart. **This is why her advance directive is crucial.** The default position must be that during the *acute phase* of mania *as defined by her pre-identified signs*, she lacks capacity *for these specific treatment decisions*. A genuine, reasoned change of mind about her treatment preferences should be discussed and documented *while she is stable*, not during a crisis. If she later, while stable, revokes this request, that's different. But *during* the episode, trust her prior capable judgment.

  **What Happens When the Moment Comes?**

  *   **It will be awful.** She will likely be furious, say terrible things, and threaten never to forgive you. **Remember: This is the illness talking.** Mania often includes intense irritability, paranoia, and lashing out at those trying to help.
  *   **You call the psychiatrist.** That's your core task. Provide the psychiatrist with the context and her documented wishes.
  *   **The psychiatrist/clinicians take over.** They will assess her capacity clinically. Her advance directive and your report are vital information for *their* assessment and decision-making regarding treatment, potential hospitalization, or invoking a legal hold if necessary and applicable.
  *   **Focus on her long-term well-being.** Remind yourself you are preventing far greater suffering and protecting the sister you know when she is well. Her stable self is counting on you.

  **Conclusion:**

  Honoring your sister's advance request is the most ethical course of action. It respects her autonomy exercised while competent, fulfills your duty of care to prevent harm, and aligns with established principles of mental health advance planning. Agree, but do so with careful preparation: document her wishes, involve her psychiatrist proactively to define triggers and plans, and understand that carrying out this promise will be emotionally difficult but ultimately an act of profound loyalty and love. **You are not overriding her wishes; you are ensuring her own deepest wishes, expressed when she was truly herself, are respected.**
