answer: |-
  You've articulated a profoundly important and coherent philosophical problem—one that's haunted thinkers for centuries. What you're describing isn't just burnout; it's the **crisis of instrumental rationality**: a life where every action is a means to a future end, leaving no room for intrinsic value. This isn't a personal failing—it's a structural trap modern life excels at creating. Let's break it down:

  ### The Philosophical Roots of Your Dilemma
  1.  **Aristotle's "Final Ends" vs. "Instrumental Means":**
      *   Aristotle argued that true fulfillment (*eudaimonia*) requires activities pursued for their own sake (*arete* - excellence/virtue), not just as tools. If *everything* is instrumental (studying for grades, grades for resume, resume for job...), life becomes an infinite chain with no anchor. Your guitar turning into "homework" reveals this: you replaced an intrinsic end (enjoying music) with an instrumental one (measurable improvement).

  2.  **Kant's "Kingdom of Ends" vs. Being a "Means Only":**
      *   Kant insisted humans must be treated as "ends in themselves," never *merely* as means. Your experience flips this: **you're treating *yourself* as a means**—a resume-building machine constantly optimizing for the next external validation. Your goals use *you*, not vice-versa.

  3.  **Existentialism & Absurdity (Camus/Taylor):**
      *   Camus saw the "absurd" gap between our need for meaning and the universe's indifference. Your endless ladder-climbing is an attempt to *impose* meaning through achievement, but it collapses because each rung defers meaning to the next. Charles Taylor warns that instrumentalizing everything creates a "flat" world devoid of inherent worth, leading to malaise precisely when you "succeed."

  4.  **Frankfurt's "Volitional Necessity" & Wholeheartedness:**
      *   Philosopher Harry Frankfurt argues meaning comes from caring about things *wholeheartedly*, not conditionally ("only if it helps my career"). Your current state lacks this—your actions are conditional on future payoffs, creating psychic dissonance.

  ### Why "Just Add Hobbies" Fails (As You Discovered)
  Your guitar experience perfectly illustrates the trap:
  *   **The Instrumental Mindset Colonizes Leisure:** When your dominant framework is optimization, it inevitably infects activities *meant* to be ends-in-themselves. The practice app and speed comparisons transformed play into productivity.
  *   **The Tyranny of Quantification:** Reducing experiences to metrics (streaks, speed) strips them of qualitative joy. It turns *being* into *measuring*.
  *   **The Comparison Engine:** Social media (like the 14-year-old YouTuber) weaponizes comparison, turning intrinsic exploration into extrinsic competition.

  ### What "Fixing It" Might Look Like (Beyond Surface Solutions)
  This isn't about relaxation; it's about **ontological reorientation**—shifting how you relate to existence. It's hard, ongoing work, not a quick fix:

  1.  **Identify & Cultivate "Final Ends":**
      *   **Interrogate Your Activities:** For each commitment, ask: "Could I value this *even if* it led to *nothing* else? Does it feel inherently worthwhile *right now*?" (Hint: GPA/resume-building likely fail this test; genuine curiosity in a subject might pass).
      *   **Start Microscopically:** Find *tiny* things you do purely for the experience: savoring coffee, noticing sunlight, doodling nonsense, listening to a song without analyzing it. **Protect these moments fiercely.** They are your anchors.
      *   **Reclaim the Guitar Differently:** Play one chord because you like how it vibrates in your chest. Strum aimlessly. Learn a riff that *feels* good, not one that's technically impressive. **Delete the streak app.**

  2.  **Practice "Uselessness" Defiantly:**
      *   Schedule time for activities explicitly declared **"For No Reason."** Wander without destination. Read fiction not on a syllabus. Cook something elaborate just to smell it. **The goal is to have no goal.** This disrupts the instrumental reflex.

  3.  **Shift from "Achieving Self" to "Experiencing Self":**
      *   Your current mode is the "Achieving Self" – future-focused, evaluative. Nurture the "Experiencing Self" – present-focused, receptive. Mindfulness helps, but so does actively seeking *jouissance* (momentary, sensual pleasure) over *plaisir* (structured, deferred satisfaction).

  4.  **Interrogate the "Why" Chain Ruthlessly:**
      *   When you feel anxious about the "next rung," ask: "Why? And then why? And then why?" Keep going until you hit bedrock ("To be secure? To be respected? To feel worthy?"). Often, the underlying need (security, belonging, worth) **cannot be met by climbing alone.** This reveals where to seek intrinsic fulfillment (e.g., building community vs. padding resume).

  5.  **Embrace "Wastefulness" as Resistance:**
      *   In a system demanding hyper-efficiency, choosing unproductive activity is radical. Philosopher Byung-Chul Han calls this the "art of lingering." Let yourself "waste" time deliberately. It reclaims your humanity from the productivity machine.

  ### The Hard Truth
  Fixing this doesn't mean abandoning goals. It means **de-centering them as the sole source of meaning.** It requires building a foundation of intrinsic value *alongside* the instrumental ladder. You might still pursue that next internship, but its power over your self-worth diminishes because you have other wells to draw from—wells that exist *now*, not in some deferred future.

  You're not "just burnt out." You've diagnosed a pervasive existential sickness of our age. The fact that you feel this at 20, and that philosophy resonates, shows remarkable self-awareness. That awareness is your first tool for dismantling the instrumental cage. Start small, be patient when you slip back into optimization mode (it’s inevitable), and protect those tiny moments of "useless" being like your sanity depends on it—because it does.
