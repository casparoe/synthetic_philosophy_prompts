answer: |-
  The dust tasted of iron and lost hopes. Captain Aris Volkov scraped another layer of the grey grime from the viewport, her eyes fixed on the impossible geometry of the *Haven’s Resolve*. The generation ship, a city carved from asteroid rock and spun for gravity, hung in the void, its surface pocked with the scars of countless micro-meteorite impacts. Her own vessel, the *Scout’s Edge*, was a speck beside it, a messenger perpetually delivering grim news.

  "Command, *Edge* actual. Resupply Fleet Echo-Seven failed to rendezvous. No debris signature. Presumed total loss." Her voice was flat, worn thin by repetition. The comm hissed, a sound like escaping atmosphere.

  "Acknowledged, *Edge*." Fleet Command’s voice was crisp, devoid of the weight Aris felt crushing her ribs. "Statistical projections remain within acceptable parameters. Proceed to designated extraction zone for Fleet Echo-Eight."

  Acceptable parameters. The phrase curdled in Aris’s gut. For Fleet Command, nestled deep within the *Haven’s Resolve*, reality was a spreadsheet. They saw the Exodus Fleet not as twelve fragile arks carrying the last dregs of humanity, but as twelve columns in a grand optimization problem. Resources were finite: fuel isotopes, water ice, precious metals for repairs. Each resupply mission – sending out smaller craft like the *Edge* to mine volatile resource pockets – was a gamble. Invest too little, and you barely replenish losses. Invest too much, and a single failure cripples your capacity to try again.

  Command’s model was elegant. It maximized the *expected* total resources across the entire fleet over the projected journey time. They calculated the mathematically optimal fraction of the fleet’s remaining reserves to risk on each mining sortie. It balanced the high probability of moderate gains against the low probability of catastrophic loss. On paper, across twelve identical ships playing the long game, it *should* yield the greatest collective wealth.

  Aris saw the cracks. She saw *Endeavour’s Hope* drift dark after a "low probability" cascade failure during a high-investment mining op. She’d watched *New Dawn*’s desperate, under-resourced mission fail to find viable ice, condemning them to slow suffocation. Command called these "statistical outliers," necessary sacrifices in the ensemble average. But Aris lived in the time average. For *her*, aboard the *Edge*, each sortie wasn't a column in a spreadsheet; it was a binary event: survival or ruin. There were no parallel universes where another *Edge* succeeded if she failed. Failure meant the *Edge* ceased to exist, and with it, her thread of humanity’s story ended.

  This time, Echo-Eight’s target was a volatile lithium cloud in a turbulent nebula. Lithium – critical for energy storage. The potential yield was enormous. Command’s optimal allocation? 22% of the fleet’s remaining mobile reserves. Enough to outfit the *Edge* and two other scouts lavishly. On paper, the expected return dwarfed the risk.

  "*Edge*, confirm receipt of resource allocation manifest. Echo-Eight launch window in T-minus six hours." Command’s voice was annoyingly buoyant.

  "Confirmed," Aris rasped. 22%. It felt like balancing on a knife edge. Too much mass, too much energy signature, attracting the nebula’s violent plasma eddies. She thought of the silence where Echo-Seven should have been.

  The nebula swallowed them whole. Emerald and violet tendrils of ionized gas clawed at the *Edge*’s shields. Sensors screamed warnings about magnetic shear and particle density. The lithium cloud glittered ahead, a siren song promising salvation.

  "Plasma surge, bearing 270 mark 15! Intensity spiking!" Her navigator, Kael, slammed a fist on his console. "Shields buckling!"

  "Divert auxiliary power!" Aris barked. The gamble was in motion. The 22% allocation meant powerful shields, robust engines. They weathered the first surge. Then the second. They reached the cloud’s fringes, grappling arms deploying.

  "Extraction rate optimal, Captain!" Kael reported, a flicker of hope in his voice. "This haul could replenish half the fleet’s reserves!"

  The spreadsheet was working. The ensemble average was smiling. Then the third surge hit. Not a wave, but a wall. It wasn't predicted. It wasn't in the model's 'acceptable parameters'. The *Edge*’s powerful, resource-intensive shields flared white-hot and failed like glass. Alarms became a single, deafening shriek. Lights died. Gravity plates stuttered.

  Aris was thrown against her harness. Through the flickering emergency lights, she saw the main viewer. The beautiful, deadly lithium cloud was dissolving into chaos, consumed by the nebula’s fury. Their precious extraction gear was molten slag. The *Edge* tumbled, helpless, systems critical.

  "Structural integrity failing!" Kael’s voice was raw. "Main drive offline! Life support on reserves!"

  The comm crackled weakly. "Scout’s Edge, Scout’s Edge, this is *Haven’s Resolve* Fleet Command. Report status. We show critical systems failure."

  Aris looked at the dead consoles, the flickering lights, the terrifying stillness of space visible through a cracked viewport. She thought of the 22%. The mathematically optimal bet. The one that, across twelve ships, *should* yield the greatest expected resources.

  She keyed the mic, her voice hollow. "*Haven’s Resolve*... this is *Scout’s Edge* actual. Mission failure. Total loss. Repeat... total loss." The static that followed wasn't just interference; it was the sound of atoms failing, the sound of her single, linear timeline hitting zero.

  Deep within the spinning rock of the *Haven’s Resolve*, Fleet Command received the update. A technician frowned at the main display. "Echo-Eight lost. Confirmed total loss of vessel and allocated resources."

  The Fleet Coordinator, a man whose world was percentages and aggregates, sighed. "Unfortunate. Update the ensemble model. Current projections show... a 0.3% decrease in overall expected resource accumulation by journey's end due to this event." He tapped a screen, adjusting parameters. "Allocate resources for Echo-Nine. Optimal fraction remains... 22%. Probability of mission success remains above the viability threshold for the fleet average."

  On another screen, the rolling tally updated. The 'Expected Fleet Resources' graph dipped slightly, then continued its slow, statistically inevitable climb upwards. The model was robust. The ensemble thrived, mathematically.

  Meanwhile, the *Scout’s Edge* spun silently in the emerald gloom. Inside its fractured hull, the air grew thin and cold. Aris Volkov floated beside her dead console, watching her breath fog in the freezing air. The nebula’s light played across her face, indifferent to the meticulous calculations that had led her here. Her wealth, her future, her very existence, had been optimized into oblivion. The ensemble marched on, its average brightening imperceptibly, while her time – her single, precious, non-replicable thread – had reached its abrupt, multiplicative ruin. She closed her eyes, not against the dying light, but against the crushing silence of a universe that averaged out her extinction. The optimal fraction had gambled her life, and the mathematics had collected its due. There would be no Echo-Nine for the *Edge*. Only the long, cold drift into the statistical noise.
