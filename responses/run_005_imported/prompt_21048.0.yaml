answer: |-
  Your attempt to reconcile Sidgwick's dual legacy is thoughtful, but your "separate chapter" assumption significantly underestimates the profound integration of his psychical research with his ethical project. Sidgwick himself saw it as a crucial, rigorous extension of his philosophical work—not a sentimental hobby. Here's why:

  1.  **The "Dualism of Practical Reason" as the Driving Force:** The unresolved conflict in *The Methods of Ethics* wasn't just an academic puzzle; it was an existential crisis for Sidgwick. How could rational egoism (acting for one's own greatest good) be reconciled with utilitarianism (acting for the greatest good of all)? He saw **personal immortality and a justly ordered post-mortem existence as the only potential rational solution.** If virtue guaranteed personal happiness *beyond death*, the dualism collapses. Psychical research wasn't about vague comfort; it was a **scientific search for empirical evidence needed to resolve the core problem of his life's work.**

  2.  **Ethics Demanded the Investigation:** Sidgwick viewed the investigation of claims about survival not as credulous belief, but as an **intellectual and moral duty.** Given the immense importance of the question for ethics (potentially resolving the dualism) and human welfare, *not* investigating rigorously would have been irrational and irresponsible from his perspective. He famously stated: *"I regard it as a religious duty to 'test all things'... and to hold fast only to what is good, but not to treat the great questions of Fact which are involved as closed because they are important."*

  3.  **Methodological Rigor Applied:** Sidgwick brought the same meticulous, critical, and self-critical approach to psychical research that he applied to ethics. He co-founded the Society for Psychical Research (SPR) explicitly to apply scientific methods and critical thinking to these phenomena. He designed controls, exposed frauds (like Eusapia Palladino), and demanded extraordinary evidence. His decades of "essentially null results" weren't a failure of rigor; they were the *outcome* of it. His despair wasn't sentimental disappointment, but the **philosophical despair of a key solution to the dualism remaining empirically unverified.**

  4.  **The Personal Stakes and "Failure":** Sidgwick was deeply private about his *hopes* for survival, fearing bias, but he was transparent about the *philosophical necessity* of the search. His famous deathbed remark to his wife, Eleanor Sidgwick (also a leading SPR investigator): *"It's all been a failure... the great work of my life... has come to nothing"* is widely interpreted as referring to his failure to find conclusive evidence for survival, thus leaving the dualism unresolved. This underscores how central psychical research was to his life's project.

  5.  **Connection to *Methods of Ethics*:** While the *Methods* stands on its own logical arguments, the specter of the unresolved dualism hangs over it. Sidgwick's psychical work was the practical, empirical effort to find a foundation that could potentially complete the system. It was the **experimental counterpart to the theoretical impasse.** Without evidence for survival, the dualism remained a stark, unsolved problem for practical reason.

  **A Fairer Understanding:**

  Sidgwick's psychical research was **not a separate, sentimental chapter, but a rigorous, ethically mandated extension of his core philosophical quest.** It was:

  *   **Motivated by Philosophy:** Driven by the need to resolve the "dualism of practical reason."
  *   **Governed by Ethics:** Pursued as a duty to investigate questions of profound importance.
  *   **Conducted with Rigor:** Applying his characteristic scrupulousness and critical method.
  *   **Integrated with Despair:** Its failure deepened his philosophical pessimism about resolving the fundamental conflict in ethics.

  **What to Tell Your Aunt:**

  You can honor both her comfort and Sidgwick's integrity:

  1.  **Acknowledge the Human Need:** "It makes sense that connecting with Grandma brought comfort. Sidgwick himself understood that deep human need for connection and the hope for something beyond."
  2.  **Explain Sidgwick's Quest:** "He wasn't just interested in comfort, though. He was a famously rigorous philosopher struggling with a huge problem in ethics: how to reconcile doing what's best for yourself with doing what's best for everyone. He thought evidence for life after death *might* solve this, so he spent decades scientifically investigating mediums and psychic claims, hoping for proof."
  3.  **Highlight his Standards & Results:** "What's remarkable is how strict he was. He desperately *wanted* to find evidence to resolve his philosophical dilemma, but his honesty was absolute. He co-founded a society to test these claims scientifically, exposed frauds, and demanded the highest proof. Despite decades of looking, he concluded on his deathbed he'd found nothing adequate. He let the evidence lead him, even when it meant his deepest hope – and a solution to his life's work – remained unproven."
  4.  **Respectful Nuance:** "So, while the *experience* gave you comfort (and Sidgwick would understand that human feeling), his own life shows that rigorously examining these claims, even with the highest hopes, didn't yield the proof he sought as a philosopher and scientist. He accepted that difficult truth."

  This approach respects your aunt's feelings while grounding the conversation in Sidgwick's actual, deeply integrated, and ultimately unsuccessful philosophical project. It shows that seeking comfort is human, but Sidgwick's legacy is one of unwavering intellectual honesty in the face of profound personal and philosophical desire.
