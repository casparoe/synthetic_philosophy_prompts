prompt: |-
  I'm one of about four people who maintain a small internal Lean library at my company -- basically a tiny in-house mathlib we use to verify parts of a job scheduler. Someone opened a PR with a lemma that says any partial schedule can be extended to a maximal one, proved via Zorn's Lemma (treat partial schedules as a poset ordered by extension, chains get an upper bound by just unioning them, so a maximal element exists). Because that proof bottoms out in choice, Lean forces the definition to be marked noncomputable. Half the maintainers are fine merging it since the theorem's true and we actually need it, the other half think noncomputable lemmas shouldn't live in the same library as our executable scheduler code, since it blurs the line between "this exists" and "here's how to actually build it," and once that norm slides people stop noticing the difference. Our contribution guide says nothing about this case. I've gotta send a short memo before next weeks review recommending one of: merge as-is, quarantine anything noncomputable into its own module, or reject and require a constructive version. Can you draft that memo -- actually pick one, give the reasoning, and don't just wave away the quarantine side as being precious about purity, there's something real going on there so take it seriously.
reasoning: |-
  We are at a crossroads regarding the inclusion of a noncomputable lemma in our Lean library. The lemma in question states that any partial schedule can be extended to a maximal one, and its proof relies on Zorn's Lemma, which in turn relies on the axiom of choice. This forces the definition to be marked as `noncomputable` in Lean. The debate is between merging the lemma as-is, quarantining noncomputable definitions into a separate module, or rejecting it until a constructive version can be provided.

  After careful consideration, I recommend that we **quarantine noncomputable definitions and lemmas into their own module**. Below is the reasoning, which takes into account the concerns of both sides and the practical needs of our project.

  ### Reasoning:

  1. **Respect for Constructive Concerns**: 
     - Our library is used to verify an executable scheduler. The presence of noncomputable code in the same module as executable code can indeed blur the line between existence and construction. This is not merely a purity issue; it has practical implications for maintenance and clarity. By isolating noncomputable results, we make a clear distinction: the core scheduler code remains entirely computable, while the noncomputable module serves as a theoretical extension for proofs that require classical reasoning.

  2. **Practical Need for the Lemma**:
     - The lemma is needed for our verification efforts. Rejecting it outright would block progress. A constructive version might be very difficult (or even impossible) to achieve, because the existence of maximal schedules in general might require the axiom of choice. Therefore, we should accept the lemma, but in a controlled manner.

  3. **Minimizing Risk of Misuse**:
     - By putting noncomputable code in a separate module, we create a natural barrier. Developers working on the executable parts will not accidentally import noncomputable definitions unless they explicitly opt in. This helps maintain the discipline that the executable part remains constructive. Moreover, Lean's module system will enforce that any use of noncomputable results in the executable part will be immediately visible because of the required import.

  4. **Flexibility for Future Work**:
     - We may encounter other noncomputable results in the future. Having a designated module for such results establishes a pattern that is scalable and clear. It also allows us to document the use of classical reasoning in one place, making it easier to review and justify.

  5. **Addressing the Quarantine Concern**:
     - The quarantine is not about being "precious" but about maintaining a clear contract. The executable scheduler code must be able to run, and we rely on the fact that the definitions and lemmas in the main library are computable. Mixing noncomputable code in the same module would break this contract and could lead to accidental noncomputable "contamination" in the executable part. The separate module acts as a safeguard.

  ### Implementation:

  We can do the following:
  - Create a new directory (e.g., `Noncomputable`) or a module (e.g., `Scheduler.Maximal.Noncomputable`) for such results.
  - Move the current PR's lemma (and any future noncomputable results) into that module.
  - Clearly document that this module uses classical reasoning (via `noncomputable` and possibly axioms) and that it is intended for theoretical proofs only.
  - In the executable part, we avoid importing this module. If we need to use the existence result in the executable part, we must do so in a way that does not break computability (e.g., by using it only in proofs, not in definitions).

  ### Conclusion:

  This approach balances the need for the lemma with the imperative to keep our executable code constructive. It sets a clear precedent and provides a structured way to handle similar situations in the future. Therefore, I recommend that we merge the PR but only after moving the lemma to a designated noncomputable module.

  We should also update our contribution guide to reflect this decision and provide guidelines for when and how to use the noncomputable module.
answer: |-
  **To:** Lean Library Maintainers  
  **Subject:** Recommendation on Noncomputable Lemma in PR #X  

  **Recommendation:** Quarantine noncomputable definitions into a dedicated module (`Noncomputable/` or similar). Do not merge as-is, but do not reject outright.  

  ### Reasoning:  
  1. **The Lemma is Theoretically Necessary**:  
     The result (extending partial schedules to maximal ones via Zorn’s Lemma) is critical for our scheduler’s correctness proofs. Rejecting it would block progress, and a constructive version may be impractical (or impossible) without major tradeoffs.  

  2. **But Noncomputability Risks Contaminating Executable Code**:  
     While the lemma is "just a proof," merging it into our core library blurs the line between existence proofs and executable constructs. Our scheduler code *must* remain computable (e.g., for simulation/validation). Allowing `noncomputable` in shared modules risks:  
     - **Accidental Misuse**: Someone might unknowingly reference noncomputable logic in a computable function, breaking extraction.  
     - **Erosion of Trust**: If `noncomputable` proliferates, we lose confidence that our core scheduler proofs translate to executable artifacts.  

  3. **Quarantine Preserves Both Values**:  
     - **Practicality**: We get the lemma without blocking the PR.  
     - **Pragmatic Purity**: Isolating noncomputable items into a dedicated module (`Noncomputable/`) explicitly segregates:  
       - **Constructive Core**: The main library remains computable and extraction-friendly.  
       - **Classical Extensions**: Noncomputable results live under an "opt-in" import path (e.g., `import Scheduler.Noncomputable.Maximal`).  
     This enforces discipline: users must consciously cross a boundary to use classical logic, preserving clarity about what’s executable.  

  4. **Why Not Merge As-Is?**  
     Even one noncomputable lemma in a core module forces `noncomputable` pollution downstream. Lean propagates the tag, which could taint unrelated definitions and complicate audits.  

  5. **Why Not Require a Constructive Proof?**  
     A constructive maximal schedule (e.g., via iterative search) may not exist without strong constraints. Forcing this could delay us indefinitely or yield a weaker result.  

  ### Action Plan:  
  1. Move the PR’s lemma to a new module `Scheduler.Noncomputable.PartialOrders`.  
  2. Add a header comment:  
     ```lean  
     /-!  
     WARNING: This module uses classical logic (via `noncomputable`/Zorn's Lemma).  
     Import only for proofs, not for executable constructions.  
     -/  
     ```  
  3. Update our contribution guide:  
     - Noncomputable content is allowed but *isolated* in designated modules.  
     - Core scheduler code/library may never import `Noncomputable/` modules.  

  This balances necessity with discipline. We keep the proof without compromising executable integrity.  

  ---  
  **Final Note:** This isn’t pedantry—it’s about ensuring our scheduler’s verified properties actually reflect runtime behavior. The quarantine is low-effort and scales to future classical lemmas. I’ll implement the module split if the PR author agrees.
