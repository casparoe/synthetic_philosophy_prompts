  We are creating a dialogue between an Epicurean (E) and a defender of the deprivation account (D). The topic is Lucretius's symmetry argument and the standard asymmetry response. The Epicurean will press the symmetry argument, the deprivationist will respond with the asymmetry (that pre-natal non-existence is not bad because we could not have existed earlier without being a different person, but post-mortem non-existence deprives us of time that could have been ours). Then the Epicurean will push back on whether this asymmetry actually solves the problem or just relocates it.

  Key points for the Epicurean:
  - The symmetry argument: why is non-existence after death bad but not before birth?
  - Push back on the asymmetry: challenge the idea that the future is "ours" in a way that the past is not.

  Key points for the deprivationist:
  - The asymmetry: we cannot be deprived of the time before we existed because we could not have existed earlier without being a different person. But we could have existed longer in the future without being a different person, so death deprives us of that future time.
  - However, the Epicurean will challenge whether this asymmetry really establishes the badness of death or merely shifts the problem.

  Structure:
  1. Epicurean presents the symmetry argument.
  2. Deprivationist gives the standard asymmetry response (the "person-affecting" view: the past non-existence doesn't deprive a subject, but future non-existence does).
  3. Epicurean pushes back: 
     - If the asymmetry is based on the idea that we could have had more future time without being a different person, then what is the basis for saying that the past non-existence doesn't harm us because we would be a different person? 
     - Is the asymmetry merely a psychological one (we care about the future but not the past) or is there a metaphysical grounding?
     - How does the deprivationist account for the fact that in the case of past non-existence, there was no subject to be deprived, but in the case of death, the subject ceases to exist and so also cannot be deprived? (This is the "no subject" problem again, but now applied to the asymmetry.)

  We want the dialogue to be substantive and for each character to respond to the other's last point.

  Let's begin.
answer: |-
  ### Dialogue: The Asymmetry Puzzle in Lucretius's Symmetry Argument

  **Characters**:  
  - **Epicurean (E)**: Defends the symmetry argument; denies death is bad.  
  - **Deprivationist (D)**: Defends death’s badness via future deprivation; rejects symmetry.  

  ---

  **Setting**: A sunlit Athenian courtyard, hours before a symposium.  

  ---

  **E**: Let’s return to Lucretius’s challenge. If nonexistence after death is bad for us, why isn’t nonexistence before birth equally bad? Both are infinite voids where we don’t exist. If the prenatal abyss wasn’t harmful, the posthumous one can’t be either. Symmetry holds.  

  **D**: I deny the symmetry. Prenatal nonexistence *couldn’t* harm me because I wasn’t deprived of anything that could have been *mine*. Had I been born earlier, I’d be a numerically different person—different sperm, egg, life history. That past time was never available to *me*. But my death robs me of future time that *this very self* could have experienced. Only the future contains moments that are genuinely mine to lose.  

  **E**: Clever, but you’ve relocated the problem, not solved it. Your asymmetry rests on a counterfactual: "Had I existed earlier, I wouldn’t be *me*." But apply this to death. "Had I existed later, I’d still be *me*." True—but only if we ignore the metaphysics of persistence. If death annihilates me, there’s no "me" to *be* deprived. Just as there was no "me" before birth to lament missing the Peloponnesian War, there’s no "me" after death to lament missing future symposia. Where’s the subject of harm in either case?  

  **D**: The harm occurs at the moment of death—or more precisely, in the comparison between actual and possible worlds at that moment. When I die, I’m deprived of future goods I *would* have enjoyed had I lived. Before birth, there’s no such deprivation: no possible world where *I* exist earlier without being a different person. The asymmetry is in the modal accessibility of identities.  

  **E**: But that’s question-begging! You assert that only future possibilities are "accessible" to my identity. Yet if we take personhood as a four-dimensional continuum—as you metaphysicians often do—my birth is just as arbitrary a boundary as my death. Why privilege the future? Suppose I’d died yesterday. Today, I’d be deprived of *this* conversation. But had I been born a day later, I’d have missed yesterday’s dawn. Both are equally inaccessible to my actual identity. Why is one deprivation and the other not?  

  **D**: Because identity isn’t just about spacetime coordinates; it’s about causal and narrative continuity. My past is fixed and constitutive of who I am. My future is open—a continuation of my life’s trajectory. Death *interrupts* that trajectory; prenatal nonexistence doesn’t, because there was no trajectory to interrupt. The badness isn’t in "being dead" but in the curtailment of a life in progress.  

  **E**: Ah, so the asymmetry is psychological, not metaphysical! You’re smuggling in a bias toward *anticipation*. We fear death because we project ourselves forward, but we don’t resent missing the past because we can’t imagine ourselves backward. But if death’s badness hinges on subjective projection, not objective ontology, then a brain-dead person isn’t harmed by death—they can’t anticipate loss. Yet you’ll say death harms them regardless. Contradiction.  

  **D**: Not psychological—*teleological*. A human life has an inherent telos: flourishing over time. Death thwarts that telos; late birth doesn’t. If I die young, my life’s potential is unrealized. If I’m born late, no potential existed earlier to be unrealized. The asymmetry is in life’s directional thrust.  

  **E**: Directional thrust? That sounds Aristotelian, not materialist. If we’re just atoms in the void, there’s no "telos"—only events. Lucretius was right: symmetry forces us to admit that death is nothing to us. Your "deprivation" is just a story we tell about time. But if the "us" in the story vanishes at death, the story has no protagonist. Without a subject, there’s no harm.  

  **D**: Unless the subject is the life itself. The deprivation is bad *for the life that was cut short*, even if not *for the extinguished person*. We evaluate harms from the standpoint of what a life could reasonably have been—a normative, not just metaphysical, judgment.  

  **E**: Now you’ve shifted from personal identity to abstract life-narratives. But if death’s badness isn’t bad *for me*, what moral weight does it carry? If I’m not around to experience the lack, how is it *my* harm? Symmetry stands: no subject before, no subject after. Your asymmetry dissolves into poetry.  

  **D**: Then let me reframe. Death is bad because it makes my actual life worse than some alternative. Prenatal nonexistence doesn’t make my life worse—it just sets its starting point. The asymmetry is in counterfactual comparisons anchored to *this* life.  

  **E**: Anchored how? Without a persistent self, the anchor drifts. You’ve replaced Lucretius’s puzzle with a deeper one: What makes the future "mine" if the "mine" dissolves at death? Until you solve that, deprivation is elegant, but empty.  

  *(A bell rings. The symposium begins. Both rise, unsatisfied.)*  

  ---

  ### Key Philosophical Moves:  
  1. **Epicurean’s Core Challenge**:  
     - Denies a *subject* for posthumous harm, mirroring prenatal non-harm.  
     - Presses the deprivationist to explain why future time is "ownable" without a persistent self.  

  2. **Deprivationist’s Asymmetry**:  
     - Grounds harm in modal identity constraints (past alterations change *who* we are; future ones don’t).  
     - Shifts to teleology/narrative to escape the "no subject" problem.  

  3. **Epicurean’s Pushback**:  
     - Argues deprivationist conflates metaphysics with psychology or normativity.  
     - Concludes the asymmetry relocates but doesn’t resolve the subject problem.  

  **Unresolved Tension**:  
  - Is the future "mine" in a way the past isn’t? If so, is this a fact about *time*, *identity*, or *value*?  
  - Can deprivation survive the annihilation of the subject? Deprivationist says yes via counterfactuals; Epicurean says no.  

  This dialogue mirrors contemporary debates (e.g., Fischer, Nagel, Williams). For further work, consider engaging with:  
  - McMahan’s *time-relative interests* (addresses identity but not Epicurus’s subject problem).  
  - Parfit’s *Relation R* (challenges whether identity matters morally at all).  
  - Kamm’s *inviolability* (posits a normative, non-experiential harm in deprivation).
