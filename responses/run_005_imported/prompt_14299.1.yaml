  The user might be missing that the controversy isn't just about statistical correctness but about values. Northpointe emphasized calibration, which benefits their tool's perceived fairness. ProPublica highlighted error rates, showing disparate impacts. The mathematical result shows you have to choose, but the choice depends on ethical considerations. 

