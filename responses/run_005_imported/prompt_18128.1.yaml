answer: |-
  Here’s a toast that walks the tightrope—philosophically sharp for the cohort, warm and clear for the relatives, and deeply sincere without the saccharine. (Clockwise: ~3.5 minutes spoken aloud.)

  ---

  **(Clink glass gently)**  
  "Alright, everyone. For those who don’t know me, I’m the proud older brother of our brilliant bride. And for the past few years, family dinners have featured… lively debates. You see, my sister studies something called ‘the wrong kind of reasons problem.’  

  **(Lean in slightly, conversational)**  
  "Now, bear with me for just *one* sentence of philosophy – I promise it’s worth it. Her work tackles a puzzle: How do we know when a reason to admire or desire something is the *right* kind of reason? The kind that actually speaks to the thing’s *goodness*? Because, clever minds realized, you can have perfectly *good* reasons – strategic reasons, practical reasons, reasons involving hypothetical bribes, threats, or even philosophers’ favourite evil demons – to *say* you admire or desire something… reasons that have absolutely nothing to do with whether the thing itself actually *deserves* it. The reason might be sound, but it’s the *wrong kind* for truly valuing the thing.  

  **(Pause, smile at the couple)**  
  "And it struck me, planning this toast, that marriage proposals present a *very* real-world version of this problem. Think about it. What are the *wrong* kinds of reasons to marry someone?  
  *(Count on fingers, slightly playful)*  
  "Well, maybe you’re marrying them for their *truly* impressive inheritance. That’s a reason! A demon threatens to turn your hair green unless you propose? Also a reason! Citizenship? A bet? Because they own a vineyard? Or maybe you just really, *really* want to impress their intimidatingly brilliant philosophy advisor? *(Glance towards advisor, slight grin)* All potentially compelling reasons! Logically sound! But… they’re the *wrong kind*. They’re reasons circling *around* the person, not reasons that touch the core of why they, *themselves*, are someone to cherish.  

  **(Shift tone, warmer, focus on the couple)**  
  "But here’s the beautiful thing about today, about [Groom's Name] and my sister. Looking at them – truly looking at them – cuts through the philosophical fog. We don’t need complex arguments or thought experiments about demons.  

  **(Raise glass slightly higher)**  
  "Because while the ‘wrong kind of reasons’ problem might still keep philosophers up at night debating the finer points… *this* marriage? It solves the practical application. The evidence is overwhelming. It’s in the way they talk about their weirdly compatible hobbies, the way they make each other laugh after the longest days, the quiet support when the PhD felt impossible, the sheer, uncomplicated *light* that seems to surround them when they’re together.  

  **(Directly to the couple)**  
  "[Sister's Name], [Groom's Name], what you have built, why you are choosing each other today… it isn’t strategic. It isn’t transactional. It isn’t demon-coerced (we hope!). It’s the deepest, most fitting kind of reason. It’s the *right* kind. Anyone in this room, philosopher or not, can *see* it. You two aren’t just a solution to an abstract puzzle; you’re the living, breathing proof of the answer.  

  **(Raise glass fully)**  
  "So, let’s raise our glasses. To the happy couple: May your reasons for cherishing each other always be the profoundly *right* kind. May your admiration and desire for one another forever be as fitting, as genuine, and as utterly demon-proof as it is today. Cheers!"

  ---

  **Why this works:**

  1.  **The Joke Lands:** The marriage proposal parallels ("inheritance," "citizenship," "demon," "impressing the advisor") are concrete, relatable, and funny. Philosophers get the deep cut; others get the absurdity of marrying for green hair threats or vineyards.
  2.  **Philosophy Lite:** Explains the core idea clearly in one go, using the sister's own examples (bribes, threats, demons). Relatives grasp the "reasons that miss the point" concept.
  3.  **The Pivot to Sincerity:** Explicitly states the problem isn't *fully* solved in philosophy, but that *this couple* makes the answer obvious through observable reality ("looking at them cuts through the fog," "evidence is overwhelming," "anyone... can *see* it"). Uses the key phrase "right kind of reason."
  4.  **Avoids Sentality/Seminar:** Concrete examples (weird hobbies, laughter, support) ground the sincerity. The closing lines ("living, breathing proof," "demon-proof") keep it warm but sharp. No cloying metaphors.
  5.  **Respects Both Audiences:** Philosophers feel seen (advisor nod, accurate problem statement). Relatives feel included and understand the core sentiment. The sister feels her work is honoured meaningfully.
  6.  **Timing:** Concise explanation, focused examples, clear emotional pivot. Well within 4 minutes.

  Deliver it with warmth, a knowing smile for the philosophy bits, and genuine affection during the sincerity. It’ll land perfectly. Congratulations to your sister!
