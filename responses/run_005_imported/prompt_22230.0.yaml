answer: |-
  Your scene has tremendous potential for intellectual tension, but Laidlaw's current argument **misrepresents Hume's core revolutionary insight.** Hume explicitly *rejected* the mercantilist doctrine equating national wealth with hoarded specie. However, a well-read character like Laidlaw could *selectively* or *misinterpretively* use Hume, especially emphasizing Hume's arguments *for* industry and frugality, while downplaying the automatic adjustment mechanism. Here's how to sharpen his reasoning with fidelity to Hume's texts:

  **Hume's Actual Doctrine (From "Of Money" & "Of the Balance of Trade"):**

  1.  **Wealth ≠ Specie:** Hume argues forcefully that money (specie) is merely a tool for facilitating exchange. True wealth consists of "the commodities of life" and "the stock of labour" ("Of Money").
  2.  **The Price-Specie Flow Mechanism:** This is Hume's revolutionary contribution. He posits that an imbalance in trade (and thus specie flows) is *self-correcting*:
      *   If Scotland exports more linen than it imports (favourable balance), silver flows *in*.
      *   This influx *increases* the money supply in Scotland.
      *   Increased money supply leads to *higher prices* for Scottish goods (including linen) and *higher wages*.
      *   Higher Scottish prices make Scottish exports (linen) *less competitive* abroad and foreign imports *more attractive* at home.
      *   Result: Exports decrease, imports increase, silver flows *out* until the imbalance corrects itself. The reverse happens for an unfavourable balance.
  3.  **Hoarding is Futile (and Harmful):** Attempting to permanently hoard specie is impossible due to the mechanism above. More importantly, Hume argues it's counterproductive: "It is indeed evident, that money is nothing but the representation of labour and commodities... Nor can any thing be more foolish, than to increase the one beyond its natural proportion to the other." ("Of Money").
  4.  **Focus on Industry and Frugality:** While rejecting specie hoarding as the *goal*, Hume *strongly* advocates for policies that promote industry, skill, and frugality. A nation excelling in producing valuable goods *will* tend to have a favourable balance *temporarily*, but the *real* benefit is the productive capacity and the goods themselves, not the fleeting influx of silver. Luxury imports drain this productive capacity.

  **Sharpening Laidlaw's Argument (The Selective/Pragmatic Interpretation):**

  Laidlaw, as a practical merchant, might *focus* on the initial effects Hume describes and the emphasis on industry, while conveniently ignoring or downplaying the automatic correction. He could argue:

  1.  **"Hume Shows the Immediate Power of Specie Influx":** "You've read Mr. Hume, surely? Recall his words in *Of Money*: 'In every kingdom, into which money begins to flow in greater abundance than formerly, every thing takes a new face: labour and industry gain life...' *That's* the engine we must feed! Every ounce of silver we bring back from France or Holland isn't just profit, lad; it's *lifeblood* circulating through Edinburgh's workshops, paying wages, funding new looms. It makes *us* competitive *now*."
  2.  **"The Drain is Immediate and Painful":** "And what happens when we squander that hard-won silver on French fripperies? Hume observes the reverse: 'Wherever money departs in too great abundance... everything falls to decay.' Paying in silver for their wine *drains* that lifeblood *directly*. It weakens *our* position *before* any mythical 'balance' can restore it. Why invite that drain?"
  3.  **"Credit for Luxuries Doubles the Risk":** "Taking their wine *on credit*? Madness! We send out our linen – the fruit of *Scottish* labour – and receive only a promise. Meanwhile, *they* have our goods, and *we* have a debt. If their market falters, or their merchant fails, we lose *twice*: the linen's value *and* the specie we must eventually send to settle the debt. Hume, in *Of the Balance of Trade*, warns against relying on the 'good faith of individuals' across borders. Demand silver – secure the *substance* of wealth immediately."
  4.  **"Frugality and Industry are the True Lessons":** "Hume's deeper lesson, young man, is that greatness lies in *making*, not *taking*. 'The greatness of the sovereign and the happiness of the state... are... inseparable from the industry of the subjects.' ("Of Commerce"). Every bolt of linen we export is industry. Every cask of brandy we import is idleness. Silver is the *measure* and the *fuel* for that industry. Let's keep the fuel here! Insist on payment in silver for our industry, and be frugal in spending it on foreign trifles. *That* is the patriotic merchant's duty according to Hume's principles."

  **The Vivid Mechanism/Example for Laidlaw to Cite (From "Of the Balance of Trade"):**

  *   **The Vessel Analogy:** Hume uses this explicitly. Laidlaw could lean on it heavily, interpreting it in a mercantilist light: "Think of it as Hume instructs us! Picture all the trading nations as interconnected vessels filled with water – water being silver. If we pour water *out* (by buying French wine), the level *here* falls immediately! Prices may adjust later, but *we* feel the scarcity *now*. Why should *we* be the vessel willingly draining itself for the benefit of France? Our job is to channel the flow *inwards* through our exports, keeping *our* vessel brimming." (Hume actually uses this to show levels *equalize*, but Laidlaw can focus on the immediate local effect of an outflow).
  *   **The French Example:** Hume discusses France. Laidlaw could twist it: "Look at France! Hume notes their vast population and fertile soil – immense potential wealth. But what drains it? Their insatiable appetite for *luxury*! They pour out their silver for silks and spices from the East, weakening their own position. We see the effects even now. Is that the model we wish to follow? Let us export our sturdy linen – a good of *intrinsic use and value* – and bring back the *solid reward*, silver, to strengthen our own foundations against such folly."

  **Why this works for the character and scene:**

  1.  **Plausible Misinterpretation:** Laidlaw is not an academic. He's a practical man applying ideas he finds useful. Many contemporary readers *did* initially interpret Hume as reinforcing mercantilism because he started by explaining how money *works* within that framework before dismantling it. Focusing on the early parts of the essays (influx good, drain bad) and Hume's praise for industry/frugality is a realistic selective reading for a merchant focused on short-term advantage and national pride.
  2.  **Highlights Generational/Ideological Conflict:** The younger partner could represent newer, more "enlightened" views, perhaps influenced by nascent free-trade ideas or just a desire for immediate luxury/risk. Laidlaw's (slightly flawed) invocation of Hume creates intellectual tension.
  3.  **Rooted in Hume's Text:** Laidlaw's arguments *reference* real Humean concepts (power of influx, harm of drain, importance of industry, futility of relying on distant credit, the vessel analogy, critique of luxury) even if he draws the *wrong conclusion* (that permanent hoarding is possible/desirable).
  4.  **Dramatic Potential:** This sets up potential later scenes where the younger partner might challenge Laidlaw by pointing out Hume's *full* argument about automatic correction, or where economic events (like rising Scottish prices making their linen less competitive) illustrate Hume's mechanism despite Laidlaw's efforts.

  **In essence:** Have Laidlaw use Hume's powerful descriptions of *how specie flows affect a local economy in the short term* and his moral/practical emphasis on *industry and frugality* to justify a mercantilist *policy* (demand bullion, restrict luxury imports), while conveniently ignoring or downplaying Hume's central thesis that *permanent* hoarding is impossible and that true wealth lies beyond the specie. Use the **Vessel Analogy** ("Of the Balance of Trade") as his vivid, concrete example of why outflows are dangerous to be avoided. This makes him sound learned, patriotic, and prudent within his worldview, while remaining historically plausible for a merchant interpreting complex new ideas for practical gain.
