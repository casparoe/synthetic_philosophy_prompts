  The Berkeley case requires special handling. Many texts oversimplify it, but the user knows the nuance - that department choice mediates the gender-admission path but also reflects pre-existing gender biases. I'll need to explain why this makes it a contentious adjustment case while relating back to the core decision rule.

  For the practical rule, I'm considering a flowchart-like approach in text: start with whether stratification was pre-planned (preserves randomization), then examine variable relationships. The key insight should be that collider stratification is always dangerous, confounder stratification is often necessary, and mediator stratification requires careful causal goal clarification. 

  I wonder if they'd appreciate the term "Table 2 fallacy" - it's clinical research jargon for inappropriate adjustment that might resonate. Also must emphasize that "adjustment" includes both design and analysis techniques beyond just stratification. 

  The defense section needs clear examples: maybe a collider case where sickest patients get Treatment A and appear to do worse, creating false associations. For mediators, perhaps use blood pressure in hypertension trials where the drug works through that mechanism. 

  Finally, for Berkeley, I should acknowledge that both adjusted and unadjusted numbers tell complementary stories about structural bias versus individual department discrimination. That reflects current statistical consensus while satisfying their request for real-case implications.
answer: |-
  Your decades in the trenches with Simpson's paradox perfectly frame the core tension: pooled vs. stratified estimates. Pearl's causal lens *does* provide a decisive, principled rule, moving beyond "it depends" to "it depends *on the causal role of the stratification variable*." Here's the rule, its defense, and the messy Berkeley implications:

  **The Usable Rule:**

  > **Trust the stratified analysis when the stratification variable is a *confounder* of the treatment-outcome relationship. Trust the pooled analysis when the stratification variable is a *collider* or a *mediator* (unless your specific causal question *requires* blocking the mediator's path).**

  **Defense via Causal Roles:**

  1.  **Confounder (C): A common cause of Treatment (T) and Outcome (Y).**
      *   **Diagram:** `C -> T` and `C -> Y` (and possibly `T -> Y`).
      *   **Problem:** C creates a non-causal association between T and Y in the pooled data. Simpson's paradox occurs because the distribution of C differs across T groups.
      *   **Example:** In your trials, `Site Severity (C)` influences both which `Drug (T)` a patient gets (e.g., sicker patients get Drug B per protocol) and `Outcome (Y)` (sicker patients do worse). Pooling mixes these severity groups.
      *   **Why Stratify:** Stratifying on C *blocks* the non-causal backdoor path `T <- C -> Y`. Within each stratum (level) of C, the groups receiving T and control are comparable *on C*. The stratum-specific estimates reflect the causal effect *within that group defined by C*. Pooling these stratum-specific estimates (e.g., via standardization or IP weighting) gives the correct *average causal effect*, controlling for C. **Trust Stratified.**
      *   **Your Rule of Thumb Vindicated (for Confounders):** Your instinct to "trust the split-up numbers" when the lurking variable is a confounder was fundamentally correct. Stratification *does* control for the confounder.

  2.  **Collider (B): A common effect of Treatment (T) and Outcome (Y) (or other variables).**
      *   **Diagram:** `T -> B <- Y` (or `T -> B <- U`, `Y -> B <- U`, etc., where U is another variable).
      *   **Problem:** Conditioning on B (stratifying) *induces* a non-causal association between T and Y, even if none exists.
      *   **Example:** Imagine studying `Drug Effect (T)` on `Recovery (Y)`, stratifying by `Hospitalization Length (B)`. Both T (effective drug shortens stay) and Y (recovery allows discharge) cause B. Conditioning on B (e.g., looking only at long-stay patients) creates a spurious link: among long-stay patients, those who got the effective drug (T=1) *must* be the ones who were very sick (otherwise they wouldn't have stayed long *despite* the drug), making T=1 look *worse* than T=0 within this stratum. Pooling avoids this bias.
      *   **Why Pool:** Conditioning on a collider opens a non-causal path (e.g., `T -> B <- U -> Y`, conditioning on B creates `T <-> U <-> Y`). The stratum-specific estimates are biased. The pooled estimate, *not* conditioning on B, reflects the true association (or lack thereof). **Trust Pooled.**
      *   **Your Rule of Thumb Fails Dangerously:** Trusting the stratified numbers here leads directly to false conclusions.

  3.  **Mediator (M): Lies on the causal path between Treatment (T) and Outcome (Y).**
      *   **Diagram:** `T -> M -> Y` (and possibly `T -> Y` directly).
      *   **Problem:** Stratifying on M blocks part of the causal effect of T on Y that flows through M.
      *   **Example:** Studying `Drug (T)` effect on `Heart Attack (Y)`, stratifying by `Blood Pressure (M)`. The drug works *by* lowering M, which lowers Y. Stratifying on M (e.g., looking only at patients with high BP) removes the drug's effect *through* lowering BP. The stratum-specific effect (`T -> Y | M=high`) only shows the *direct* effect (if any), not the *total* effect (direct + indirect via M).
      *   **When to Trust Which:**
          *   **Trust Pooled for Total Effect:** If you want the *overall effect* of T on Y (including effects mediated through M), the pooled estimate (or an analysis *not* controlling for M) is correct. Stratifying on M biases the estimate of the total effect towards zero.
          *   **Trust Stratified for Direct Effect (Carefully):** If your *specific causal question* is "What is the effect of T on Y *not* operating through M?" (the direct effect), then stratifying on M (or otherwise controlling for it) is necessary. However, this requires strong assumptions and careful methodology (like the mediator not being influenced by post-treatment confounders).
      *   **Your Rule of Thumb is Inadequate:** Blindly trusting stratified estimates here answers the *wrong question* if you care about the total effect.

  **The Messy Berkeley Case: Why Adjusting for the Mediator Fuels Debate**

  *   **The Paradox:** Pooled data showed men admitted at a higher rate than women. Stratified by department, most departments showed *no significant bias* against women, and some even favored them.
  *   **The Causal Roles (The Debate):**
      *   **Department Choice (M) is a Mediator:** Gender (T) influences Department Choice (M) (due to societal norms, preparation differences, etc.), and Department Choice (M) influences Admission (Y) (departments have different selectivities and applicant pools).
      *   **But is M *only* a Mediator?** Critics argue Department Choice (M) is *also* a reflection of pre-existing gender discrimination/biases influencing application patterns and departmental cultures (`Discrimination (U) -> M` and possibly `U -> Y`). U is an unmeasured confounder of M and Y.
  *   **Applying the Rule & The Fight:**
      *   **Total Effect (Discrimination in Admissions Process):** If you want to know "Does the university admissions process, overall, discriminate against women?", you want the *total effect* of Gender (T) on Admission (Y). This includes *both* any bias in the final admission decision *and* any bias funneling women into more selective departments earlier in the pipeline. **Trust the Pooled Estimate.** It shows apparent discrimination.
      *   **Direct Effect (Department-Level Fairness):** If you want to know "Conditional on applying to a specific department, is the admissions decision within that department fair based on gender?" (the direct effect), you need to stratify/control for Department (M). **Trust the Stratified Estimate.** It generally showed fairness *within* departments.
  *   **Why the Fight?** The controversy stems entirely from the *causal question* being asked:
      *   Advocates of the *pooled* estimate argue the total effect reveals systemic discrimination impacting women *before* the final application decision (e.g., advising, recruitment, perceived fit).
      *   Advocates of the *stratified* estimate argue it shows the core admissions process itself (evaluating applicants within a department) is fair, and the disparity arises from earlier choices influenced by broader societal factors.
  *   **The Mediator Trap:** Adjusting for M (department) in the total effect estimate is wrong *if* M is influenced by the same discrimination (U) affecting Y. By blocking the path `T -> M -> Y`, you also block the path `T -> M <- U -> Y`, hiding part of the discriminatory effect flowing through U. Pearl would argue the total effect (pooled/unadjusted) is necessary to expose the systemic issue, while the direct effect (adjusted) answers a narrower question about final-stage decisions.

  **Conclusion:**

  Your old rule ("trust the stratified numbers") works *only* when the lurking variable is a **confounder**. It fails catastrophically for **colliders** (inducing bias) and misleads for **mediators** (answering the wrong question). The decisive rule is:

  1.  **Identify the causal role:** Confounder, Collider, or Mediator?
  2.  **Confounder:** Trust Stratified (blocks backdoor path).
  3.  **Collider:** Trust Pooled (avoids inducing bias).
  4.  **Mediator:**
      *   Want **Total Effect?** Trust Pooled (or unadjusted).
      *   Want **Direct Effect?** Trust Stratified (adjusted, with caveats).

  Berkeley exemplifies the mediator dilemma: the fight isn't about statistics, but about whether department choice is part of the discriminatory system (favoring total effect/pooled) or merely a neutral choice preceding a fair decision (favoring direct effect/stratified). Pearl's framework doesn't resolve the *value judgment* of which question is more important, but it rigorously defines *what question each estimate answers*. Your retirement reading provides the key: causal diagrams force clarity on the target estimand, making the choice between pooled and stratified not arbitrary, but a direct consequence of the causal story you need to tell.
