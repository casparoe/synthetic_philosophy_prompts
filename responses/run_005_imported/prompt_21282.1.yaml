prompt: |-
  Ok, this has been bugging me since it happened. I sit on the jury for a smallish science journalism prize, and this year we switched to ranked-choice voting because everyone agreed it'd be the fairest way to pick a winner among the five finalists. Afterward, one of the other judges admitted she didn't rank her actual favorite piece first — she put a solid, crowd-pleasing runner-up on top instead, since she figured her real favorite had no shot and didn't want her ballot to end up helping the entry she liked least actually win. That felt like exactly the kind of gaming ranked-choice voting is supposed to make pointless, and yet it clearly worked out fine for her anyway. I write about science and ideas for a living and still can't answer my own question here: is there some voting rule where being honest about your rankings is always your best strategy, no matter how many candidates their are, or is this kind of gaming just unavoidable once you've got three or more options on the ballot?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a jury for a science journalism prize and switched to ranked-choice voting (RCV). One judge strategically ranked a crowd-pleaser first instead of her true favorite, thinking her top choice couldn't win. This worked for her, but the user is confused because RCV is supposed to prevent such gaming. They're wondering if any voting system makes honesty always the best strategy.

  First, I need to recall voting theory concepts. Arrow's Theorem comes to mind—it says no system can be perfect with three or more options. That's a key point. The judge's strategy is called strategic voting or tactical voting. I should explain why RCV isn't immune, despite common beliefs.

  The user mentioned the judge feared her favorite was a spoiler. In RCV, if her true favorite is eliminated early, her vote transfers. But if she ranks them first and they lose, her vote moves to her second choice. However, by not ranking the favorite first, she avoids "wasting" her vote. But in RCV, ranking the favorite first shouldn't harm the second choice, right? Actually, in some cases, it can. If her favorite is a weak candidate, voting for them first might lead to them splitting votes with a similar candidate, causing both to lose. That's the spoiler effect. So if her second choice is viable, boosting them might prevent a less preferred candidate from winning.

  The user is a science writer, so they'll appreciate a thorough explanation. They might also want to know if any system avoids this. I should mention Gibbard-Satterthwaite, which proves that all systems are manipulable. But some systems, like approval voting or Condorcet methods, might reduce incentives for dishonesty. However, they have trade-offs. Approval voting lets you vote for multiple candidates equally, which might help express preferences without ranking. But it doesn't capture ranked preferences as well.

  The user's deeper need might be understanding if there's a truly fair system. They might feel disillusioned that even RCV can be gamed. I should emphasize that while no system is perfect, some are better in certain contexts. For a journalism prize, maybe approval voting could work since it's simpler and reduces the need for strategy. But the judges might value ranking nuances.

  Also, the user might want reassurance that their voting method isn't flawed. Explaining that strategic voting in RCV is rare but possible, and that her colleague's strategy could backfire, might help. Context matters—small jury vs. large elections. In small groups, honest discussion might be better than complex systems.

  Finally, suggest alternatives without overcomplicating. Highlight that no system is strategy-proof, but some minimize risks. Encourage considering the prize's goals: is it about consensus, majority, or preventing the worst winner? Tailor the advice to their specific needs.
answer: |-
  That's an incredibly sharp observation – you've put your finger on a fundamental tension in voting theory. The short, somewhat frustrating answer is: **No, there is no perfect voting rule for three or more options where ranking honestly is *always* the best strategic move.** Your fellow juror's behavior is a classic example of "strategic voting," and Arrow's Impossibility Theorem (along with the Gibbard-Satterthwaite Theorem) tells us this is largely unavoidable.

  Here's a breakdown of why:

  1.  **Arrow's Impossibility Theorem (Kenneth Arrow, 1951):** This Nobel Prize-winning theorem proves that *no* voting system can simultaneously satisfy all of the following seemingly reasonable criteria when there are three or more options:
      *   **Unrestricted Domain:** Any possible ranking by voters is allowed.
      *   **Non-dictatorship:** No single voter dictates the outcome.
      *   **Pareto Efficiency:** If everyone prefers A over B, then B shouldn't win.
      *   **Independence of Irrelevant Alternatives (IIA):** The ranking between A and B shouldn't depend on whether some other option C is present or not.
      *   Crucially, **IIA is the one that gets violated** in scenarios like your juror's. Her *perception* that her favorite (say, Candidate A) had "no shot" meant the *presence* of A might affect the outcome between her second choice (B) and her least favorite (C). By demoting A, she tried to ensure B beat C. RCV (and most other systems) violate IIA, making strategic ranking like this possible and sometimes rational.

  2.  **The Gibbard-Satterthwaite Theorem (Allan Gibbard 1973, Mark Satterthwaite 1975):** This directly addresses strategic voting. It states that **every** voting system for choosing one winner out of three or more options is *either*:
      *   **Dictatorial** (one voter decides everything), or
      *   **Susceptible to Tactical Voting:** There will be situations where some voter, knowing how others will vote, can get a *better* outcome by misrepresenting their true preferences (like your juror did) than by voting honestly.
      *   *This is the mathematical hammer confirming your intuition: strategic voting like your colleague's is fundamentally unavoidable in non-dictatorial systems with 3+ options.*

  3.  **Why RCV Isn't Immune (And Your Colleague's Logic):**
      *   **The "Spoiler" Fear:** Your juror feared her true favorite (A) was a "spoiler." If A is eliminated early, her vote transfers to B. But she worried that if *too many* people like her voted for A first, A might stay in the race longer than B, potentially causing B to be eliminated *before* A. Then, when A is finally eliminated, her vote might transfer too late to help B against C.
      *   **The "Wasted Vote" Fear:** Alternatively, she might have feared that ranking A first was "wasting" her vote on a non-viable candidate when she could be boosting the chances of B, whom she also liked and saw as viable, against C, whom she disliked.
      *   **The Strategy (Compromising):** By ranking B first instead of A, she immediately boosts B's count. This helps B survive longer *against C*. If A is truly non-viable, it gets eliminated anyway, and her vote *still* transfers to B, just as it would have if she ranked A first. But by giving B that initial boost, she *might* have helped B survive a round where it otherwise might have been eliminated by C, ensuring B faces C later. Her gamble paid off *in this specific instance*.

  **Are Some Systems *Less* Prone to This?**

  Yes, but none eliminate it entirely (thanks to Gibbard-Satterthwaite). Some try to *reduce* the incentive or frequency:

  *   **Approval Voting:** Voters can "approve" as many candidates as they like (no ranking). Votes are simple counts of approvals. Winner has the most approvals.
      *   *Why it *might* reduce strategic dishonesty:* It's often optimal to approve every candidate you like *more* than the expected winner. You don't have to agonize about whether ranking your marginal favorite first hurts your stronger favorite. Honesty (approving all you find acceptable) is frequently a good strategy.
      *   *Trade-off:* It doesn't capture strength of preference well. Lumping your "love" and your "like" together can feel unsatisfying and might lead to winners with broad but shallow support.

  *   **Condorcet Methods:** These aim to elect the candidate who would beat every other candidate in a head-to-head matchup (the "Condorcet Winner"). Methods like Ranked Pairs or Schulze resolve cycles.
      *   *Why it *might* reduce strategic dishonesty:* They satisfy the Condorcet Criterion, which is robust in many scenarios. Strategic voting often requires complex coordination or precise knowledge of others' votes to be effective and can backfire more easily than in RCV.
      *   *Trade-off:* They can be complex to understand and count. Ties or cycles (though resolvable) can seem messy. Strategic voting is still theoretically possible.

  *   **Borda Count:** Voters rank all candidates. Points are assigned: 1st place = n-1 points, 2nd = n-2, ..., last = 0. Sum points, highest wins.
      *   *Why it *might* reduce strategic dishonesty (sometimes):* Demoting a strong contender risks significantly hurting them. The incentive is often to *exaggerate* differences (rank a serious threat last, even if you mildly prefer them to someone else) rather than *compromise* (demote a favorite).
      *   *Trade-off:* Highly susceptible to "burying" (ranking a strong rival last) and "cloning" (similar candidates splitting points). Violates IIA severely.

  **The Reality for Your Jury:**

  1.  **Your Colleague Wasn't Wrong (Mathematically):** Given her assumptions about the viability of her favorite (A) and the threat of her least favorite (C), and her desire to ensure B beat C, ranking B first *was* a rational strategic move under RCV. Gibbard-Satterthwaite says systems *allow* this.
  2.  **It Doesn't Mean RCV is "Broken":** RCV still solves the "spoiler effect" present in plurality voting (vote-splitting between similar candidates leading to a worse candidate winning). Strategic voting like this is generally *less* common and *less* impactful in RCV than in plurality, but it's not eliminated. It often requires more voter knowledge/sophistication.
  3.  **The Human/Jury Context Matters:** In a small jury with discussion, the *expectation* is often honesty to find the best winner. Her action, while strategically rational within the pure voting mechanism, might feel like a breach of that collaborative spirit. The "gaming" feels more salient in this intimate setting than in a large anonymous election.
  4.  **Is There a "Best" System for a Jury?** Consider:
      *   **RCV:** Good for capturing rankings, familiar to many, avoids plurality spoilers. The strategic temptation your colleague felt is its main weakness here.
      *   **Approval Voting:** Very simple, hard to "game" in a way that feels dishonest about preferences ("Do I approve this? Yes/No"). Might be excellent if the goal is broad acceptability rather than identifying a single passionate favorite. Less expressive than ranking.
      *   **Discussion + Consensus:** Sometimes, a formal voting rule is less important than jurors advocating for their favorites and finding common ground through conversation before voting (perhaps using a simpler method like approval or even plurality after discussion). This leverages the small group dynamic.

  **Conclusion:**

  You've hit upon a deep truth. While Ranked-Choice Voting improves upon simple plurality voting by reducing spoilers and encouraging positive campaigning, **it is mathematically impossible (Gibbard-Satterthwaite Theorem) to design a voting rule for three or more options that is both non-dictatorial and completely immune to strategic voting.** Your colleague's "gaming" is an inherent vulnerability in the system, not a flaw in her understanding. Systems like Approval or Condorcet methods might *reduce* the frequency or impact of such strategies in different ways, but they don't eliminate the theoretical possibility. The best system often depends on the specific context (number of voters, candidates, level of voter sophistication, importance of expressiveness vs. simplicity) and accepting that perfect strategy-proofness is unattainable. For your jury, emphasizing pre-voting discussion or considering Approval Voting might be worth exploring if the potential for strategic ranking feels corrosive to the group's trust.
