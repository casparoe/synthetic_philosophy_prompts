  ### Adjudication of Moves

  | Move | Score | Justification |
  |------|-------|---------------|
  | 1    | -1    | Jonah overstates the case. While dialetheism is a defensible reading (Priest/Garfield), Nāgārjuna explicitly rejects contradictions elsewhere (e.g., *Vigrahavyāvartanī* 29), and the catuṣkoṭi can function contextually without violating classical logic. The move ignores non-dialetheist Madhyamaka interpretations (e.g., Tsongkhapa, Siderits). |
  | 2    | +2    | Yuki's presupposition-failure model is textually and logically sound for Chapter 1. The analogy to "King of France" is apt: rejecting all options due to shared faulty assumptions (svabhāva) avoids contradictions. This aligns with Candrakīrti's *prasaṅga* (reductio) method. |
  | 3    | +1    | Jonah correctly identifies a tension in Chapter 25. The identity claim ("saṃsāra = nirvāṇa") *appears* to use "sameness/difference" substantively after negating them, straining Yuki's presupposition model. This isn't fatal but demands further explanation. |
  | 4    | -1    | Yuki's "no thesis" defense is incomplete. While Nāgārjuna *does* reject assertions (VV 29), calling the text purely "therapeutic" doesn’t resolve why the identity claim isn’t *itself* a tacit assertion. It risks becoming a carte blanche to evade logic. |
  | 5    | +2    | Jonah’s dilemma is decisive: Yuki *must* either (a) treat "no thesis" as a self-refuting assertion, or (b) explain the asymmetry between Chapter 1’s reductio (which "establishes" emptiness) and Chapter 25’s identity claim (which "opts out"). Her position lacks a principled distinction. |

