answer: |-
  Here are 10 interview questions designed to push beyond mere exposition of Lewisian modal realism, targeting your specific areas of interest, each with a likely follow-up. They're phrased conversationally for podcast flow:

  1.  **The "Incredulous Stare" Revisited:** "Lewis famously dismissed the 'incredulous stare' as not an argument, just an expression of disbelief. But isn't that intuition – the sheer *weight* of believing in infinitely many concrete dinosaurs, alien civilizations, and versions of me typing this right now – pointing to a genuine *explanatory cost*? How do you weigh that visceral cost against the theoretical benefits Lewis claims?"  
      *   *Likely Answer/Follow-up Key:* (If she downplays intuition) "Sure, intuitions can mislead, but isn't the burden *precisely* on the view making such an extraordinary claim to *overcome* this deep-seated intuition, rather than dismiss it? If not intuition, what *is* the ultimate arbiter for judging the acceptability of a metaphysical theory's ontological commitments?"

  2.  **Epistemic Access & Causation:** "If other concrete worlds are completely causally isolated from ours – no energy, information, or causal chains crossing the boundary – how is it possible for *us*, embedded solely within *this* causal nexus, to have any knowledge *whatsoever* about their existence or contents? Doesn't this causal isolation seem to render them, in principle, unknowable?"  
      *   *Likely Answer/Follow-up Key:* (If she says we know via logic/math/reasoning) "But doesn't this make modal knowledge (knowledge of possibility/necessity) fundamentally *different in kind* from our knowledge of, say, dinosaurs or distant galaxies, which ultimately relies on causal chains (fossils, light)? If modal knowledge isn't grounded in causal contact with its objects, what *is* its grounding, and how does it avoid being purely stipulative?"

  3.  **The Indexical Dodge on "Actual":** "Lewis argues 'actual' is indexical, like 'here' or 'now' – it just picks out the world *I'm in*. While elegant, doesn't this feel like it *relabels* the problem rather than solves it? We still experience *this* world as uniquely vivid, real-time, and causally potent *to us*. Does indexicality genuinely explain why *this* concrete totality feels so ontologically privileged in our experience, or does it just tell us we *call* it 'actual'?"  
      *   *Likely Answer/Follow-up Key:* (If she emphasizes parity) "But *within* our experience, 'here' and 'now' *do* feel privileged relative to 'there' and 'then' – that's the point of the indexical! Doesn't Lewis's view require us to accept that the *entire qualitative feel* of being 'here and now actual' is somehow an illusion generated solely by our spatiotemporal location, even though it's the bedrock of all experience? How is *that* not just as mysterious?"

  4.  **Recombination & Modal Circularity:** "Lewis's recombination principle (roughly: anything can coexist with anything else, unless prevented by size or shape) is central to generating possibilities without presupposing modality. But critics like van Inwagen argue recombination *itself* smuggles in modal notions. Doesn't saying 'patches of spacetime *can be* arranged thusly' or 'there *is no contradiction* in such an arrangement' already rely on unanalyzed modal concepts? How is recombination genuinely non-modal?"  
      *   *Likely Answer/Follow-up Key:* (If she frames it combinatorially) "But doesn't combinatorialism about *concrete* spacetime already presuppose that spacetime *can be* divided and rearranged? Aren't concepts like 'arrangement', 'part', 'size', and 'shape' themselves implicitly modal? How do we cash out recombination *without* relying on what spacetime or its parts *can* or *cannot* do?"

  5.  **Kripke's "Changing the Subject" (Counterpart Theory):** "Kripke famously objected that counterpart theory doesn't solve the problem of transworld identity; it *changes the subject*. If I ask 'Could *I* have been a plumber?', I care about *this very person* being a plumber. Counterpart theory tells me about someone *else*, merely similar, in another world. Doesn't this fail to capture what we *mean* in ordinary modal discourse about ourselves?"  
      *   *Likely Answer/Follow-up Key:* (If she says it captures what's *important*/representational) "But doesn't this concede Kripke's point? If I fear future pain, I fear it happening to *me*. If counterpart theory says that pain happens only to someone *like* me in another world, why should *I* care? Hasn't the object of my concern (my *own* possible pain) literally disappeared from the analysis, replaced by something else (a counterpart's pain)?"

  6.  **Parsimony vs. Explanatory Power:** "Lewis prioritized theoretical unity and explanatory power (e.g., for modality, properties, content) over quantitative parsimony (sheer number of entities). Can you elaborate on why *this specific kind* of ontological explosion is justified, where positing, say, infinitely many epiphenomenal ghosts wouldn't be? What's the qualitative difference in the *kind* of entities postulated that makes this cost worth bearing?"  
      *   *(Optional Follow-up):* "Is the justification purely systemic/internal to the theory, or are there external anchors?"

  7.  **The Elegance Trap:** "Lewis's system is incredibly elegant and systematic – worlds explain modality, properties, content, etc., in one go. But couldn't this elegance be a double-edged sword? Might it blind us to the cost, or make the view resistant to refutation because any problem can seemingly be 'solved' by adding more structure to the theory (more relations, more constraints on counterparts)? Is there a risk of creating a beautifully self-contained but ultimately unfalsifiable metaphysical bubble?"

  8.  **Beyond Recombination - Genuine Impossibilities:** "Recombination handles 'local' possibilities well. But what about *genuine impossibilities* – square circles, married bachelors? Lewis needs to say these involve contradictory properties that *cannot* be instantiated. But if properties are just sets of possibilia (individuals across worlds), how does he account for the *impossibility* of their co-instantiation without sneaking modality back in? Where does the 'cannot' come from?"

  9.  **Science & Modal Realism:** "How does concrete modal realism interact with contemporary physics? For instance, interpretations of Quantum Mechanics involving 'many worlds' (like Everett) are sometimes conflated with Lewis's view, but they seem fundamentally different (branching vs. isolated, emergent vs. fundamental). Does modal realism offer any insight into, or face challenges from, modern scientific cosmology or QM?"  
      *   *Likely Answer/Follow-up Key:* (If she distinguishes them) "Does the *isolation* of Lewis worlds become harder to maintain if our best physics suggests the fundamental structure of reality might be more interconnected or 'holistic' than classical spatiotemporal chunks? Or does modal realism remain entirely orthogonal to empirical science?"

  10. **Falsifiability & Evidence:** "Finally, a key tenet of scientific (and often philosophical) reasoning is that a theory should suggest what evidence *could* count against it. What conceivable observation, logical discovery, or theoretical development *would* convince you that Lewisian modal realism is false? Or is its strength precisely that it's insulated from empirical refutation by its metaphysical nature?"  
      *   *Likely Answer/Follow-up Key:* (If she says nothing empirical could falsify it) "If it's insulated from empirical evidence, how do we adjudicate between Lewis's view and other grand metaphysical systems (e.g., a different fundamental ontology, or a primitivist modal view) that also claim systemic benefits but posit radically different entities? Are we left with only aesthetic or pragmatic criteria?"

  **Tips for Delivery:**

  *   **Listen Actively:** Don't just wait to ask the next question. Build on her answers. The follow-ups are templates; adapt them based on *what she actually says*.
  *   **Clarify, Don't Interrogate:** Phrase follow-ups as "Help me understand..." or "So, if I follow you, that means...?" rather than "But that's wrong because...".
  *   **Embrace the "Stare":** Acknowledge the weirdness! "I know this sounds wild, but..." can make it more engaging.
  *   **Focus on Consequences:** Keep bringing it back to "What does this *mean*?" or "How does this impact X?".
  *   **It's a Conversation:** If she gives a particularly fascinating answer to one question, it's okay to linger there even if it means skipping a later one.

  Good luck with the interview! Your preparation (skimming Plurality!) already puts you ahead of many interviewers. Your background in software engineering might even give you a fresh perspective on the systematic nature of Lewis's "system"!
