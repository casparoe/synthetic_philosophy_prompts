  ### Move-by-Move Justification

  1. **Ines (1): Score 1**  
     *Ines is partially correct.* Deploying an opaque system without exhaustive testing or explainability mechanisms is a culpable business decision. The company assumes risk by releasing technology whose failures are inherently unpredictable. However, framing this as "fully responsible" oversimplifies the ethical landscape (e.g., ignoring contributory negligence by the door-opener).  

  2. **Marcus (2): Score -1**  
     *Marcus’s analogy is flawed.* Human unpredictability arises from autonomy and consciousness, whereas AI unpredictability stems from deliberate design choices (e.g., training data scope, model architecture). Equating a licensed teen (a moral agent) to a corporate-deployed AI system ignores that the company *chose* to deploy an unexplainable system—a decision within its control. His "unpredictability is inevitable" claim dismisses accountability for mitigatable risks.  

  3. **Ines (3): Score 2**  
     *Ines decisively refutes Marcus.* The car lacks moral agency or legal personhood, so responsibility cannot "settle" on it. Unlike a human driver, it cannot be deterred, rehabilitated, or punished. Thus, residual responsibility *must* transfer to the entity that created, deployed, and benefited from the system. This is legally consistent with product liability principles.  

  4. **Marcus (4): Score -1**  
     *Marcus’s rebuttal confuses moral responsibility with pragmatic compensation.* "Nowhere else for it to go" is precisely why strict liability exists for inherently dangerous activities (e.g., operating industrial machinery). Denying culpability because "we want someone to blame" ignores that the company *created the risk*. Covering damages is necessary but insufficient; it fails to address negligence in deploying opaque systems.  

  5. **Ines (5): Score 2**  
     *Ines exposes a critical flaw in Marcus’s position.* Reducing responsibility to financial payouts commodifies harm, allowing companies to budget for accidents as operating costs. True accountability requires acknowledging fault (e.g., via regulatory penalties, design mandates) to incentivize safety investments. Her point aligns with tort law’s deterrence function.  

  6. **Marcus (6): Score 0**  
     *Marcus fairly warns against scapegoating individuals* for emergent AI behavior, but he misrepresents Ines. She targets *corporate* responsibility (e.g., policy failures), not individual engineers. While punishing individuals would be unjust, corporate liability (e.g., fines, operational restrictions) is feasible and ethically coherent. His concern is valid but deflects from systemic solutions.  

  ---

  ### What Both Are Missing  
  - **Shared oversight gaps:** Neither addresses the role of regulators in certifying AI systems. Responsibility could be distributed across manufacturers, regulators, and users (e.g., the door-opener).  
  - **Risk mitigation:** Both overlook that unpredictability *can* be reduced (e.g., simulation testing for edge cases, "explainable AI" tools). The company’s failure to do so is negligence.  
  - **Holistic accountability:** Financial compensation, while vital, should coexist with non-monetary measures (e.g., mandatory safety retrofits, transparency reports) to prevent harm commodification.  

  **Conclusion:** Ines correctly identifies corporate responsibility for deploying opaque systems, but Marcus validly cautions against punitive overreach. The company is culpable for foreseeable *categories* of risk (e.g., erratic maneuvers near cyclists), even if this specific swerve was unforeseeable.
