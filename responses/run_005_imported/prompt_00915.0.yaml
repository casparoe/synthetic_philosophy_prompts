answer: |-
  Based on Douglass's specific arguments in the 1860 Glasgow speech, particularly his explicit rejection of historical practice as the arbiter of constitutional meaning concerning liberty, he would **strongly criticize the current Court's "history and tradition" methodology** as articulated in *Glucksberg*, *Dobbs*, and *Bruen*. Here's a breakdown of why, grounded in his reasoning:

  1.  **Explicit Rejection of Historical Practice as Definitive Proof:**
      *   Douglass directly confronted the argument that "over seventy years of pro-slavery practice" proved the Constitution *was* pro-slavery. He conceded the practice existed ("I do not dispute it") but vehemently denied that practice settled the *meaning* or *moral character* of the text.
      *   His core argument was that **practice under oppression does not legitimize oppression or reveal the true meaning of liberty-granting text.** He saw pro-slavery practice as a *betrayal* of the Constitution's principles, not an *interpretation* of them.
      *   **Applying to Today:** He would see the Court's reliance on historical traditions (especially pre-20th century traditions reflecting limited views of women's rights, bodily autonomy, or other liberties) as repeating the same error. Just as 70 years of slavery didn't prove the Constitution sanctioned it, 150 years of restrictive views on abortion or other rights wouldn't prove those restrictions were constitutionally mandated. He would argue that historical practice, especially when rooted in inequality or injustice, is poor evidence for defining the *scope* of fundamental liberty.

  2.  **Demanding "Something More Than History — Something More Than Tradition":**
      *   Douglass's central plea was for a higher standard when interpreting liberty. He insisted that for "human liberty and justice," interpreters need principles *beyond* mere historical custom or past governmental actions.
      *   **Applying to Today:** He would view the *Glucksberg/Dobbs/Bruen* framework – which anchors rights in specific, narrowly defined historical practices and traditions – as the *antithesis* of this demand. The Court's method *is* fundamentally "history and tradition," precisely what Douglass argued was insufficient and potentially dangerous when liberty is at stake.

  3.  **The Presumption of Liberty and "Irresistible Clearness":**
      *   Douglass advocated for a **canon of construction favoring liberty**: Ambiguous constitutional text *must* be read to *protect* liberty. The government could only curtail fundamental rights if the language authorizing that curtailment was of "irresistible clearness." This placed a very high burden on the government to justify restrictions.
      *   **Applying to Today:** The current "history and tradition" method often *inverts* this presumption. Instead of starting with a presumption of liberty requiring unmistakable text to restrict, it starts by asking if the *right claimed* was historically recognized in a specific, narrow way (*Dobbs*) or if the *regulation* has a historical analogue (*Bruen*). If the specific historical tradition isn't found, the liberty claim fails or the regulation stands. Douglass would see this as allowing tradition to *curtail* liberty absent "irresistible clearness" in the text *authorizing the curtailment*. The burden shifts away from the government.

  4.  **Distinguishing "Fixed Constraints" vs. "Moral Convictions":**
      *   Your friend correctly identifies Douglass's desire for constraints beyond personal moral feelings. However, Douglass located those constraints in:
          *   **Textual Fidelity:** Interpreting the words based on their public meaning and principles.
          *   **Liberty-Presuming Canons:** The specific rule of construction requiring "irresistible clearness" to limit rights.
          *   **The Underlying Principles:** The "spirit" of the document, grounded in concepts of justice and human liberty.
      *   **Applying to Today:** Douglass would argue that the Court's "history and tradition" method substitutes one problematic source (personal morals) for another (historical practice), *neither* of which are the textual/principle-based constraints he advocated. He sought constraints rooted in the *purpose* of the Constitution (securing liberty) and clear textual commands, not constraints defined by the often-illiberal practices of the past. He would see original public meaning (if focused on principles) as closer to his view than historical practice/tradition.

  5.  **Douglass's *Use* of History vs. the Court's *Method*:**
      *   Douglass *did* use history – but to show the *Founders' intent* was *not* pro-slavery (citing the Preamble, slave trade clause sunset, etc.), and to expose the hypocrisy of practice. He used history to support his *liberty-based interpretation*, not as the *source* of the right's definition or limitation.
      *   **Applying to Today:** The current Court uses history as the *source* and *limiting principle* for defining rights. Douglass used history to *challenge* the dominant practice and *bolster* a principled, liberty-oriented reading. His use was critical and aspirational; the Court's use is often restrictive and definitional.

  **Conclusion:**

  Frederick Douglass, based squarely on his 1860 arguments, would view the Supreme Court's current "history and tradition" framework with profound skepticism and likely outright condemnation. He would see it as:

  1.  **Repeating the Pro-Slavery Error:** Mistaking entrenched historical practice (especially practices rooted in the subjugation of groups like women or marginalized communities) for constitutional meaning, just as pro-slavery forces did.
  2.  **Failing the Liberty Test:** Abandoning his core demand for "something more than history — something more than tradition" when defining fundamental liberties.
  3.  **Inverting the Burden:** Replacing his presumption of liberty (requiring "irresistible clearness" for restrictions) with a methodology that allows historical absence or restriction to defeat liberty claims.
  4.  **Misidentifying the Constraint:** Offering "history and tradition" as the fixed constraint instead of the principled, liberty-presuming textual interpretation he advocated.

  Douglass sought to *use* the Constitution's text and principles to *break the chains* of oppressive tradition. The current Court, in his view as expressed in Glasgow, is using tradition to *justify* the chains, or at least to deny their constitutional violation, by pointing to their historical existence. He would argue that the scope of constitutional rights must be determined by the document's commitment to liberty and justice, interpreted with a heavy presumption in liberty's favor, not by cataloging the limitations of the past.
