  Why would a fix for one not work for another? For example, using multiple proxies (regressional fix) doesn't help in extremal cases if all proxies fail in low-density areas. Adversarial requires specific defenses against malicious actors, which statistical methods can't address. The user needs concrete examples to illustrate these differences. 

