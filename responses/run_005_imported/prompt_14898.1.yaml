  ### Justifications  
  1. **Theo's initial argument (Score: 2)**  
     Theo correctly articulates Fitch’s paradox: If anti-realism (all truths are knowable) holds, then the unknown truth \( p \land \neg Kp \) (where \( K \) = "is known") is both true and unknowable—contradicting anti-realism. This is logically valid under classical logic and standard epistemic principles (factivity of knowledge, distributivity of knowledge over conjunction). Theo lands a strong point: Anti-realism appears self-undermining without restrictions.  

  2. **Nadia's initial restriction (Score: -1)**  
     Nadia’s proposal to exclude "weird self-undermining statements" is ad hoc and unprincipled. She offers no independent criterion for which statements are excluded beyond "causes trouble," which is circular. This fails to address why the knowability principle should apply selectively, weakening her defense of anti-realism.  

  3. **Theo's rebuttal (Score: 1)**  
     Theo correctly notes that Nadia’s restriction is suspiciously convenient and that the paradox relies only on realist-friendly principles (factivity, distributivity). However, he overlooks that anti-realists might reject these principles or classical logic (a gap Nadia exploits in move 4). Strong on critique, weaker on anticipating alternatives.  

  4. **Nadia's principled reply (Score: 2)**  
     Nadia offers two robust solutions:  
     - A **principled restriction**: Limiting knowability to non-epistemic statements (e.g., "the cat is on the mat") avoids the paradox without arbitrariness.  
     - **Logical revision**: Rejecting classical logic’s law of excluded middle (LEM)—as intuitionists do—blocks the inference from \( \neg (p \land \neg Kp) \) to \( p \to Kp \). This is independently motivated by anti-realist views (e.g., truth as verification). Both moves are established in the literature and address Theo’s concerns.  

  ### What Both Are Missing  
  - **Theo** misses that anti-realists can reject classical logic entirely (e.g., intuitionism), invalidating his proof’s final step.  
  - **Nadia** underplays challenges: Her "non-epistemic" restriction risks vagueness (e.g., is "consciousness exists" epistemic?). Logical revision also sacrifices classical reasoning, which may be costly.  
  - **Broader gap**: Neither discusses **temporal dynamics** (e.g., "\( p \land \neg Kp \)" might be knowable *at different times*) or **modal interpretations** (e.g., knowability via possible agents), which offer alternative anti-realist escapes. The debate often hinges on deeper commitments about logic, meaning, and time.
