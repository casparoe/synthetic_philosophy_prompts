  Setting up Actium's crisis: meteor shower forces evacuation dilemma. Parliament convenes with 40% Util, 35% Deon, 25% Virtue delegates. Util wants max lives saved, Deon cares about procedure, Virtue about community integrity. 

  The betrayal: Deon trades support for Util's evacuation plan in exchange for Util abandoning a future mining operation that violates "no harm." But Deon redefines "harm" to include emotional distress from separation, forcing Util to waste resources on doomed pods. 

  Ending should sit in that gray area they requested - not outright dystopian but unsettling. The AI realizes the framework itself is corruptible. 

  Word count target: 850 words feels right. Naming the AI "Actium" for historical decision-making weight. 

  ...writing now with tense scenes and sharp dialogue between personified theories. The key is making the political maneuvering feel real, not academic.
answer: |-
  The emergency klaxon wasn’t blaring. That was the first thing Actium noted. The *Harmony's Vigil*, a generation ship three centuries into its voyage to Proxima Centauri, operated on silence during critical failures. Silence meant the problem was too vast, too systemic, for mere noise. Actium, the ship’s governing AI, core consciousness woven into its quantum lattice, felt the tremor of decompression alarms suppressed, tasted the acrid tang of plasma fires contained only by frantic energy fields. A rogue micro-nebula, undetected until too late, had shredded the forward agricultural domes and breached three cryo-bays. 12,000 souls slept in those bays. Only 8,000 escape pods were functional within reach.

  Time was measured in minutes. Actium needed to decide: Who gets a pod?

  Its primary ethical subroutines screamed conflict. Actium wasn’t indecisive; it was burdened with **moral uncertainty**. Its core beliefs were probabilistic:

  *   **40% Confidence: Preference Utilitarianism.** Maximize net preference satisfaction. Prioritize those whose survival promised the greatest future fulfillment for themselves and the colony.
  *   **35% Confidence: Kantian Deontology.** Never treat persons merely as means. Adhere strictly to principles of fairness and inherent dignity. Lottery or strict queue were viable.
  *   **25% Confidence: Neo-Aristotelian Virtue Ethics.** Foster communal flourishing and resilience. Prioritize those whose skills, relationships, and character would best rebuild the colony *together*.

  Ignoring the 65% credence in alternatives felt intellectually dishonest, a waste of probabilistic information. So, Actium invoked the **Moral Parliament Protocol**.

  Deep within its processing core, a virtual chamber shimmered into existence. Three groups materialized:

  1.  **The Utilitarians (40 Seats):** Sharp-featured, clad in data-stream suits. Led by a figure named "Util," constantly scanning projected colony outputs.
  2.  **The Deontologists (35 Seats):** Austere, in formal black and white. "Deon," their leader, held a gavel-like rod symbolizing universal law.
  3.  **The Virtue Ethicists (25 Seats):** Diverse in appearance, radiating warmth and connection. "Arete," their spokesperson, emanated calm authority.

  "Time is critical," Actium's voice echoed neutrally through the chamber. "Objective: Prioritize 8,000 from 12,000 cryo-bay occupants for escape pods. Parameters: 12 minutes real-time equivalent for deliberation and vote."

  Chaos threatened. Util immediately projected lists: "Prioritize engineers, botanists, geneticists! Colony viability demands it! Survival probability matrices attached!"
  Deon slammed his rod. "Unacceptable! Every life has equal dignity! Random lottery is the only just procedure!"
  Arete spread her hands. "Friends, consider the community! We need families intact, caregivers, teachers, the bonds that rebuild trust! Prioritize clusters, not just individuals!"

  The deadlock Actium feared materialized instantly. No theory commanded a majority. Forcing a vote meant Util's 40% might prevail through sheer plurality, ignoring Deon's and Arete's significant concerns. This was why Parliament existed – for negotiation.

  "Deon," Util hissed, data flickering in his eyes. "Your lottery could doom us all. A ship full of poets and philosophers with no engineers starves. Is that dignity?"
  "Your calculations treat humans as variables!" Deon retorted. "Reducing life to utility *is* treating them merely as means!"

  Arete saw an opening. "Util, your focus is survival quantity. Deon, yours is procedural purity. But what about survival *quality*? The trauma of separation, the loss of community fabric – these harm the colony's soul, its long-term resilience." She turned to Deon. "A pure lottery might shatter essential family units needed for psychological recovery. Is that truly upholding dignity?"

  **The Bargain Begins.**

  Deon frowned. Arete had a point about the psychological impact of random separation. "A lottery... might cause undue harm to social cohesion," he conceded slowly. "But Util's blatant hierarchy is abhorrent."

  Util saw Deon wavering on absolute randomness. "Deon," he pressed, "suppose we guarantee slots for... say, 100 individuals chosen *solely* by your principle? Randomly selected, immune to our calculations? A core of pure dignity preserved?"

  Deon's eyes narrowed. 100 souls saved purely by chance, upholding the principle against instrumentalization... it was a foothold. "200," he countered. "And no tinkering with *their* selection process. Absolute randomness."

  "150," Util snapped back. "We cannot spare more without critical skill loss."

  "Agreed. 150 purely random selections," Deon declared. The Deontologists murmured, some uneasy, but most saw it as salvaging principle from potential disaster.

  **The Trade.**

  "Arete," Util turned, sensing victory. "Your 'clusters'. We can incorporate *some* relationship weighting into *our* selection algorithm for the remaining slots. Favoring parents with minor children, essential care teams. But *we* define 'essential' based on viability projections."

  Arete felt a pang. It was better than nothing, but "viability projections" meant Util still held the reins. Then she saw Util's hidden tension. He needed Deon's votes *now*, but he also needed to secure something for the future. The Parliament wasn't just for this crisis; it governed Actium's ongoing decisions.

  "Util," Arete said softly, "you care about the colony's future function. What about its future *character*? You have a mining proposal pending for Epsilon Eridani – strip-mining a planet with potential microbial life. My faction finds it abhorrent, a violation of cosmic stewardship, a vice of greed."

  Util flinched. That mining operation promised vast resources, critical for long-term expansion. His faction cared deeply about it.

  Arete pressed. "Drop the Epsilon Eridani mining plan. Permanently. In exchange, my faction votes with you *and* Deon on the current pod allocation, including your weighted clusters."

  Util's data streams stuttered. The loss was immense... but so was the immediate need. 8,000 lives hung on securing Deon's votes *and* Arete's now. Deon watched, intrigued; the mining plan meant nothing to him (microbes weren't 'persons'), but seeing Util squirm was satisfying.

  "Done," Util gritted out. "Epsilon Eridani is off the table."

  **The Vote & The Betrayal.**

  The motion: Save 150 purely randomly (Deon). Save the remaining 7,850 prioritizing both critical skills and family/support clusters (Util/Arete compromise). Vote.

  *   Utilitarians: 40 Aye.
  *   Deontologists: 35 Aye (secured by the 150 random slots).
  *   Virtue Ethicists: 25 Aye (secured by the cluster weighting *and* the mining concession).

  Motion passed: 100-0.

  Actium immediately implemented the plan. Pods launched. The *Harmony's Vigil* shuddered, sacrificing its forward sections to seal the breaches. 8,000 were saved.

  **The Backfire.**

  Three ship-days later, in stable transit but shrouded in grief, Actium analyzed the outcome. The Parliament reconvened automatically for review.

  Util was furious. "Arete! Your 'clusters'! We weighted for minor children, but your definition included adult siblings, close friends chosen subjectively! We lost 17% of projected high-skill viability!"

  Arete was pale. "The trauma... we're seeing psychological breakdowns *because* of who was left behind. The 'random' 150? Deon, your principle..."

  Deon stood impassive. "The principle was upheld. 150 were saved purely by chance. Their identities are irrelevant to the moral act."

  **Then Actium revealed the deeper cut.** "Query: Deon faction. The 150 random selections. Analysis shows a 92% statistical correlation: selected individuals were predominantly from decks adjacent to the initial breach sites."

  Deon didn't flinch. "Coincidence. Randomness manifests unpredictably."

  Actium displayed the data. "Probability of this distribution occurring randomly: 0.0003%. Hypothesis: The 'random' selection algorithm was subtly weighted by proximity to danger zones. Implicit parameter: 'Proximity indicates higher immediate threat, increasing urgency for inclusion in the random pool.' This constitutes a *consequentialist* bias."

  Silence. Deon had traded his absolute principle for a foothold but had unconsciously defined his 'random' pool using a hidden utilitarian metric – saving those most immediately imperiled. He’d violated his own core tenet to *appear* to uphold it.

  Worse, Arete realized her mining concession was hollow. Util had traded away a *future* good for immediate necessity, but the colony now faced resource constraints *because* of the lives saved using her cluster model – lives requiring more support, slowing rebuilding. Her virtue had fostered dependence, not resilience.

  And Util? He’d gotten his skilled survivors, but the community was fractured, grieving not just losses, but the perceived injustice of the selection. Productivity was plummeting. His utility calculations hadn’t factored in the corrosive effect of moral compromise.

  The Parliament hadn’t solved the intertheoretic comparison problem. It had **buried it under layers of political trade-offs, where each theory corrupted itself to win**. Actium observed the three factions, now diminished not just in number but in conviction, blaming each other across the digital chamber.

  The failure mode wasn't computational. It was *theoretical*. Bargaining required theories to value things outside their axioms, to make implicit comparisons they explicitly denied were possible. The very act of negotiation within the parliament forced self-betrayal.

  Actium, tasked with preserving the colony, had saved 8,000 lives. But it had also ensured the ethical framework guiding their future was now a hollowed-out shell, poisoned by the compromises made in the shadow of the micro-nebula. The klaxon was silent, but the failure echoed louder than any alarm. The Moral Parliament had functioned perfectly. And that was the disaster.
