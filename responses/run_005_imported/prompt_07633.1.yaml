prompt: |-
  I'm a 5th-year econ PhD student (labor economics now, but I did the standard micro theory sequence early on) and I'm on my grad student union's bargaining committee — we're in the middle of negotiating our first contract with the university and it's gotten a little tense. This is going to sound random, but there was a lecture in my old game theory course contrasting the Nash bargaining solution with the Kalai-Smorodinsky solution, and it's been stuck in my head as maybe actually useful for how we think about our counteroffer strategy, since right now the committee is basically split between people who just want to "split the difference" on the numbers and people who think that rewards whoever names the more agressive opening ask.

  Concretely: our opening ask was a $45k stipend (up from the current $34k) plus fully employer-paid dental, the university's latest offer is $38k with a $12/month dental copay, and if we don't settle by the start of next semester the old (expired) contract just keeps rolling over — so $34k, no dental — which I guess is basically our disagreement point. Could you write me a short memo I can actually bring to the committee that (a) recommends whether we should be framing this using something like Kalai-Smorodinsky, Nash, or neither, (b) walks through concretely how you'd even define each side's "ideal point" in a case like ours, and (c) is honest about the best case for just not bothering with any of this formal machinery and doing the dumb midpoint thing instead. Would rather show up with something concrete for thursday's meeting than just vibes, and honestly I don't trust my own memory of the axioms enough to write this myself.
reasoning: |-
  Okay, let me tackle this problem. The user is a 5th-year econ PhD student involved in union negotiations for their first contract. They're recalling game theory concepts from their micro theory sequence and wondering if Nash or Kalai-Smorodinsky bargaining solutions could inform their counteroffer strategy. The committee is split between those wanting to "split the difference" and those concerned about anchoring effects from aggressive opening asks.

  First, I need to recall the core differences between Nash and Kalai-Smorodinsky solutions. Nash maximizes the product of utilities above disagreement point, focusing on joint surplus division. It satisfies independence of irrelevant alternatives (IIA), meaning the solution shouldn't change if non-optimal alternatives are removed. Kalai-Smorodinsky instead preserves utility ratios relative to ideal points, emphasizing proportional gains. It satisfies monotonicity - if the feasible set expands favorably for one player, their outcome shouldn't decrease.

  The current situation has these key parameters:
  - Disagreement point (d): $34k stipend, no dental (current expired contract terms)
  - Union's ideal point: $45k stipend + full dental coverage
  - University's ideal point: status quo? Or perhaps their latest offer reflects their true minimum?
  - Feasible set boundaries aren't clearly defined - what's the university's absolute maximum? What's the union's minimum acceptable?

  For Nash solution, I'd need to map these to utility functions. But utilities are tricky - how much is dental worth compared to cash? The $12/month copay difference might be valued differently by each party. The union might see full dental as a $144/year benefit per student, while university may view it as a larger cost due to administrative overhead.

  For Kalai-Smorodinsky, defining ideal points is crucial. The union's ideal is clear ($45k + dental), but what's the university's? Their latest offer ($38k + copay) isn't necessarily their true minimum - it's just their current bargaining position. The status quo ($34k no dental) is their safest fallback, so their ideal might actually be worse than current terms, but that's unrealistic. Probably should treat university's ideal as maintaining status quo while union's ideal is their opening ask.

  The rolling contract creates an asymmetric disagreement point. Since the expired contract continues indefinitely, both sides have incentive to delay agreement, but the union likely has more to lose from prolonged disagreement (student poverty, degree delays). This makes the status quo more favorable to the university.

  Now, considering practical application: 
  The "split the difference" approach is intuitive but ignores non-linear utilities and anchoring effects. If they take midpoint of latest offers ($41.5k stipend), that might seem fair but doesn't account for dental benefits or the fact that university started from lower position. 

  Kalai-Smorodinsky might be more appropriate here because:
  - It directly addresses the anchoring concern (aggressive asks lead to better outcomes)
  - Monotonicity axiom prevents exploitation when feasible set expands
  - The ideal points are somewhat defined (union's ask vs university's presumed status quo preference)

  But there are implementation challenges:
  1. Quantifying utilities - especially dental benefits
  2. Defining the true feasible set boundaries
  3. University's ideal point ambiguity
  4. Time pressure and non-rational factors in real negotiations

  A hybrid approach might work best: use KS logic to justify why aggressive anchoring matters, but simplify calculations by:
  - Converting everything to cash equivalents
  - Using KS proportionality on key issues separately
  - Showing how different utility assumptions affect outcomes

  The memo should warn against over-reliance on models while still providing concrete framing. It should validate both committee factions - the midpoint folks' desire for simplicity and the anchoring group's strategic concerns. Practical next steps could include:
  - Estimating dental's cash value
  - Modeling different KS scenarios
  - Preparing BATNA analysis
  - Structuring the counteroffer to appear reasonable while preserving gains

  The tone needs to balance academic rigor with union pragmatism. No jargon without explanation, emphasize this is just one tool, and ultimately the committee's solidarity matters more than any model.
answer: |-
  **MEMORANDUM**  
  To: Grad Student Union Bargaining Committee  
  From: [Your Name], Econ PhD Rep  
  Date: 20 October 2023  
  Subject: Strategic Framing for Stipend/Dental Counteroffer — Nash vs. Kalai-Smorodinsky  

  ### **Executive Summary**  
  Formal bargaining solutions **do not dictate real-world outcomes**, but they clarify strategic tradeoffs. **Kalai-Smorodinsky (KS) better aligns** with our goals than Nash or simple midpoint splitting, as it protects against aggressive anchoring by the university and explicitly accounts for our respective "best possible" outcomes. However, midpoint splitting remains useful for *communicating* fairness. Below, I break this down concretely.  

  ---

  ### **1. Which Framing to Use?**  
  - **Nash Solution (Splitting the Surplus):**  
    - Maximizes the *product* of both sides’ gains above the disagreement point.  
    - **Weakness:** Highly sensitive to the "anchor" (e.g., if the university lowballs, Nash pushes us toward their favor).  
    - **Not recommended here:** The university’s aggressive anchor ($38k vs. our $45k) would skew Nash against us.  

  - **Kalai-Smorodinsky (KS) Solution (Proportional Gains):**  
    - Ensures each side’s gain (relative to disagreement) is the same *proportion* of their *maximum possible gain*.  
    - **Strength:** Neutralizes anchoring by focusing on "ideal points." Monotonicity axiom ensures if our ideal is credible, we gain more.  
    - **Recommended:** Best for protecting against the university’s anchor and justifying ambitious asks.  

  - **Midpoint Splitting (Naive Compromise):**  
    - Simple and psychologically persuasive, but ignores power dynamics and credible ideals.  
    - **Use tactically:** To frame offers as "fair" in public messaging, but not as a strategic target.  

  ---

  ### **2. Defining Ideal Points & Concrete Calculations**  
  #### **Key Parameters**  
  - **Disagreement Point (d):** $34k stipend, $0 dental → *Both sides’ fallback if talks fail*.  
  - **Union’s Ideal Point (U_max):** $45k stipend + full dental ($0 copay).  
  - **University’s Ideal Point (Uni_max):** *Status quo* ($34k, $0 dental) — their cheapest outcome.  
    *(Note: Their latest offer [$38k + copay] is a tactic, not their true "ideal.")*  

  #### **KS Calculation:**  
  KS equalizes the **ratio of gains** for each party:  
  ```  
  (Union Gain) / (Union’s Max Gain) = (University Gain) / (University’s Max Gain)  
  ```  
  - **Union’s Max Gain:** (U_max − d) = ($45k + dental) − ($34k) = **$11k + dental value**.  
  - **University’s Max Gain:** (Uni_max − d) = ($34k) − ($34k) = **$0** (since status quo is ideal for them).  

  **Problem:** If Uni_max = d, KS fails (division by zero). We must redefine Uni_max as their *next-best alternative to disagreement* — e.g., the minimum they’d pay to avoid strikes/bad PR. Realistically:  
  - Assume Uni_max = **$38k + copay** (their current offer), as they’ve signaled willingness to pay this.  

  **Revised KS:**  
  - Union Max Gain: ($45k + dental) − $34k = **$11k + dental**  
  - University Max Gain: $34k − ($38k + copay) = **−$4k − copay cost**  
  *(Note: Negative gain = loss relative to ideal. This is acceptable in KS.)*  

  **KS Solution satisfies:**  
  ```
  [Stipend − $34k] / ($11k + dental) = [−($38k − Stipend) − copay] / (−$4k − copay)
  ```  
  **Simplify by valuing dental:**  
  - Dental copay = $12/month/student = **$144/year**. Assume full dental is worth **$500/year** (market plan premium).  
  - Union Max Gain = $11,000 + $500 = **$11,500**  
  - University Max Gain = −$4,000 − $144 = **−$4,144**  

  **Solve for stipend (S):**  
  ```
  (S − 34,000) / 11,500 = [−(38,000 − S) − 144] / −4,144  
  → S ≈ $40,800 + full dental  
  ```  
  **KS Recommendation:** **$40,800 stipend + $0 dental copay**.  

  #### **Nash Solution:**  
  Maximizes: `(Union Gain) × (University Gain)`  
  - Union Gain = S − 34,000 + dental value  
  - University Gain = −(S − 34,000) − copay cost  
  Nash solution: **~$39k + dental copay** — closer to university’s anchor.  

  ---

  ### **3. The Case for Midpoint Splitting (and When to Use It)**  
  **Why consider it?**  
  - **Speed/focus:** Negotiations are stalled. Splitting the difference between latest offers ($45k vs. $38k → $41.5k) is intuitive.  
  - **Legitimacy:** Easier to justify to members ("meeting in the middle").  
  - **Low stakes:** If dental is a small issue, compromise ($41.5k + $6/month copay) may be acceptable.  

  **Why avoid it?**  
  - **Anchoring bias:** The university’s low anchor ($38k) drags the midpoint down. We lose $3.5k vs. KS.  
  - **Ignores power:** Fails to reflect that our credible threat (strike, PR damage) expands the pie. KS better captures this.  

  ---

  ### **Recommendations**  
  1. **Lead with Kalai-Smorodinsky framing:**  
     - Demand **$40,800 + full dental** (or round to **$41k**).  
     - Justify: "This equalizes the proportional sacrifice from each side’s best outcome."  
  2. **Use midpoint splitting rhetorically:**  
     - "We’ve moved from $45k to $41k — now the university must move from $38k."  
  3. **Reject dental copays:**  
     - Copays cost students little ($144) but save the university even less (administrative friction). Use this as a bargaining chip.  
  4. **Threaten disagreement strategically:**  
     - If talks stall, our fallback ($34k) is worse than KS — but the university faces reputational risk. Leverage this in KS by redefining Uni_max higher.  

  **Caveat:** Formal solutions assume rational actors and fixed ideals. Use KS as a *baseline*, not a bible. Power dynamics, deadlines, and member morale matter more.  

  ---  
  **Appendices**  
  - *KS Graphical Solution:* [Sketch utility gains on whiteboard: Union % gain = University % loss avoidance]  
  - *Dental Valuation Sensitivity:* If full dental = $1,000, KS → $41.3k + dental.  

  Let’s discuss at Thursday’s meeting. Solidarity works.
