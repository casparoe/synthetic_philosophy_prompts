answer: |-
  You've hit on a fascinating historical and philosophical tension! While your intuition captures an important dynamic, the reality is more nuanced: **Wallis's refutations *did* expose genuine, specific mathematical errors in Hobbes's constructions *without* needing the general impossibility proof.** His victory wasn't *just* institutional authority; it rested on demonstrable flaws within Hobbes's own arguments using the mathematical tools available at the time. Here's a breakdown of why:

  1.  **Refuting Specific Claims vs. Proving General Impossibility:**
      *   Lindemann's 1882 proof established the *universal impossibility* of squaring the circle with compass and straightedge. This was a monumental achievement.
      *   However, Wallis (and others before him) didn't need to prove universal impossibility to show that *Hobbes's specific method* was wrong. They only needed to demonstrate that Hobbes's *particular sequence of reasoning or construction steps* contained an internal inconsistency, violated a known geometric principle, or failed to produce the claimed result.
      *   **Analogy:** You don't need to prove it's impossible to build a perpetual motion machine to show that *this specific design* violates the conservation of energy. Wallis was pointing out the equivalent of energy leaks in Hobbes's specific blueprints.

  2.  **The Nature of Hobbes's Errors:**
      *   Hobbes's attempts weren't subtle failures near the edge of possibility. They contained fundamental mathematical blunders that were identifiable with 17th-century mathematics. Jesseph's work meticulously details these. Key types of errors Wallis exposed included:
          *   **False Assumptions:** Hobbes sometimes based his constructions on incorrect premises about ratios, proportions, or the properties of lines and curves that were demonstrably false within Euclidean geometry.
          *   **Inconsistent Reasoning:** Hobbes's arguments often contained logical contradictions or non sequiturs. He might assert that two magnitudes were equal based on flawed geometric reasoning that Wallis could dissect step-by-step.
          *   **Misapplication of Methods:** Hobbes tried to use arithmetic ratios or algebraic concepts (which he distrusted!) in ways that were invalid or misapplied to geometric magnitudes.
          *   **Failure to Achieve the Result:** Crucially, Wallis could often demonstrate algebraically or geometrically that the point or line Hobbes claimed was the solution *simply wasn't*. He could show it didn't satisfy the necessary equations or geometric conditions, using the algebraic geometry developed by Descartes and advanced by Wallis himself.

  3.  **The Power of Algebra (Even Without Transcendence):**
      *   While Lindemann needed transcendental number theory, Wallis wielded the powerful tool of **algebraic geometry** (coordinates and equations). By the mid-17th century, mathematicians knew how to represent geometric problems algebraically.
      *   Squaring the circle algebraically means solving the equation `x² = πr²` for `x` in terms of `r` using only rational operations and square roots (equivalent to compass and straightedge). While they didn't know π was transcendental, they *did* know:
          *   Compass and straightedge constructions correspond to solving quadratic equations (or systems thereof).
          *   The solutions (lengths constructed) must be roots of polynomials with rational coefficients.
      *   **Wallis's Strategy:** He could take Hobbes's *specific* construction sequence, translate each step into algebraic operations, and show that the final result Hobbes claimed (e.g., a line segment equal to the circumference or the side of the square) *did not satisfy* the equation defining the problem (e.g., `x² = πr²`), or that it depended on an unsupported assumption, or that it led to a contradiction like `1=2`. He didn't need to prove *no* solution existed; he only needed to show that *Hobbes's proposed solution* was incorrect.

  4.  **Hobbes's Response and Institutional Factors:**
      *   **Hobbes's Dogmatism:** This is where institutional and personal factors *amplified* Wallis's victory. Wallis identified clear errors. Hobbes, however, rarely conceded these points mathematically. Instead, he:
          *   Doubled down on his constructions.
          *   Attacked Wallis's character and the new algebraic methods.
          *   Claimed Wallis (and the Royal Society) were engaged in a conspiracy against him.
          *   Argued his geometric reasoning was superior to "symbolic" algebra.
      *   **Institutional Credibility:** Hobbes's refusal to engage with the technical mathematical criticisms on their own terms, combined with his increasingly vitriolic and mathematically unconvincing responses, made him appear obstinate and unscientific to the emerging community represented by Wallis and the Royal Society. Wallis's position gave him a platform, but it was his *mathematical competence* and Hobbes's *failure to answer the technical critiques* that solidified Wallis's credibility within that community. The institution provided the audience and the megaphone; the mathematics provided the substance.

  **Conclusion:**

  You are absolutely right that **Wallis did not, and could not, prove the general impossibility of squaring the circle in the 17th century.** Lindemann's proof was centuries away.

  However, **Wallis *did* provide genuine, checkable mathematical refutations of Hobbes's specific attempts.** He exposed concrete errors in Hobbes's reasoning, false assumptions, internal inconsistencies, and failures to achieve the claimed result, using the powerful tools of algebraic geometry available at the time. Hobbes's inability to satisfactorily answer these *specific mathematical criticisms* on mathematical grounds was the core reason for his loss of credibility among mathematicians.

  **So, while institutional authority played a role in amplifying Wallis's voice and marginalizing Hobbes, the foundation of Wallis's victory was mathematical: he successfully demonstrated that Hobbes's particular solutions were mathematically flawed.** The dispute wasn't about proving the task impossible; it was about proving that Hobbes, in this specific instance, had demonstrably failed. Wallis won that mathematical argument decisively in the eyes of his peers. The subsequent proof of impossibility merely confirmed that Hobbes's failure was not an isolated incident but a necessary consequence of the nature of π.
