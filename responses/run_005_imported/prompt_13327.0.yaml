answer: |-
  Here’s a 4-minute toast that bridges the gap between logic and love, honors the couple’s history, and makes the "common knowledge" moment feel profound—without a lecture. It’s structured for both crowds:

  **(Clink glass gently)**  
  "Hi everyone. For those who don’t know me, I’m Alex, Priya’s friend since college. And like many of you, when Priya and Dan announced their engagement, my first thought was... *'Wait, wasn’t this already true?'*"  

  **(Laughter, nods from crowd)**  

  "Seriously. Seven years together. Five years building a home. We’ve all seen it: the way Dan knows Priya needs tea *before* she even asks, how Priya laughs at Dan’s terrible puns like it’s the first time. We’ve watched you two navigate careers, losses, and Ikea furniture assembly. To everyone here, it’s been obvious for ages: You’re it for each other. Lifelong partners. So… what *changes* today?"  

  **(Pause, lean in conspiratorially)**  
  "Well, there’s this idea some nerds like me love called **common knowledge**. It’s not just *knowing* something. It’s knowing that *everyone else knows it*, and knowing they know *you* know it. Sounds abstract? Imagine if I whispered, *‘It’s raining outside.’* You believe me. But if I stand here, in front of all of you, and shout it? Suddenly, we all *share* that reality. It becomes… undeniable. Collective."  

  **(Shift to warm sincerity)**  
  "For seven years, we’ve all *believed* in Priya and Dan. Priya’s mom believed. Dan’s brother believed. Their dog, Loki, definitely believed *(laughter)*. But those beliefs lived in separate pockets. Today? Today, you two stand before us—your people, your village—and declare, ‘This is us. Forever.’ And we *all* witness it. We see you promise it. We hear you vow it. And crucially… **we see each other seeing it.**"  

  **(Nod to the rationalist crew with a wink)**  
  "For my fellow puzzle-heads: Yes, it’s the moment the islanders *see* the blue eyes. But for everyone? It’s deeper. Today, your private certainty becomes our public truth. It’s not that your love *changes*—it’s that the world *snaps into alignment* with what you’ve always known. This gathering isn’t just a party; it’s a **foundation**. From this moment on, there’s no ‘Priya and Dan might…’ or ‘Do you think they’ll…?’ There’s only: *‘Remember when they promised? We were there.’*"  

  **(Raise glass)**  
  "So let’s toast not to a new beginning, but to a brilliant, undeniable confirmation. To making the deepest truth of your lives into **common knowledge**. To Priya and Dan—officially, joyfully, and now *undeniable*."  

  **(Everyone drinks. Then, add with a grin:)**  
  "...Also, Dan? If you ever forget it’s common knowledge that Priya hates loading the dishwasher wrong? We *all* saw you promise to try. We’ve got witnesses."  

  **(Laughter, applause. Sit down.)**  

  ---

  **Why this works:**  
  1. **Acknowledges Reality:** Starts by validating the "Weren't you already married?" feeling, making the room feel understood.  
  2. **Logic → Emotion:** Translates "common knowledge" into human terms (shouting about rain, village witnessing). Nerds get the reference; others get the metaphor.  
  3. **No "Everything Changed":** Focuses on the *social* shift, not the *personal* one. "The world snaps into alignment" honors the existing bond.  
  4. **Warmth Over Lecture:** The Ikea, dog, and dishwasher jokes keep it grounded and funny.  
  5. **Strong Finish:** The final toast ties logic ("undeniable confirmation") to tradition ("officially, joyfully").  
  6. **Time:** ~3.5 mins reading calmly, leaving room for ad-libs or pauses.  

  **Delivery Tip:** Smile during the "nerdy" part—signal it’s playful, not pretentious. Pause after "What changes today?" to let the question land. Dan’s family will follow because it’s built on universal ideas: witnessing, community, and promises.
