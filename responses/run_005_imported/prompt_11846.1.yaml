  - The Markov blanket (3) is a foundational concept and if it's misapplied, the whole framework might be in trouble. However, Friston and colleagues have written extensively to defend it.

  - The scope problem (5): Friston claims that FEP is a principle for self-organization in living systems. If it applies to non-living systems equally, then it might not be specific enough. But Friston argues that the Markov blankets in living systems are particular. This is a challenge but not fatal.

  - The old wine charge (4): This is the least damaging because even if it is a reformulation, it can still be a valuable synthesis.

  However, I note that the unfalsifiability charge is the most fundamental and severe. Without falsifiability, the theory is not scientific.

  Therefore, I propose:

