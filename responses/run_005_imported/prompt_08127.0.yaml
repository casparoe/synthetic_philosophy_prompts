answer: |-
  You've zeroed in on a crucial and sophisticated argument Bentham makes against using majority antipathy as a justification for legal punishment. Let's reconstruct his reasoning step-by-step and assess its strength against your friend's critique:

  **Bentham's Argument Reconstructed:**

  1.  **The Core Rejection:** Bentham explicitly **rejects antipathy/disgust *as a sufficient independent ground* for punishment.** He does *not* claim these feelings don't cause pain, but argues this pain *alone* cannot justify state action.

  2.  **The Slippery Slope/Reductio ad Absurdum (The Heresy Analogy):**
      *   *Premise:* If the mere existence of widespread disgust/antipathy towards an act (like "paederasty") is sufficient grounds for legal punishment...
      *   *Consequence:* Then the same logic must apply to *any* act that provokes widespread disgust/antipathy in *any* society.
      *   *Specific Example:* This would justify punishing "heresy" wherever the majority holds intense religious antipathy (e.g., Spaniards burning Moors, Portuguese burning Jews).
      *   *Bentham's Point:* This consequence is morally repugnant and logically inconsistent for anyone (like his contemporaries) who condemns religious persecution but supports persecuting "paederasts" based on antipathy. It exposes the hypocrisy and arbitrariness of using antipathy as a foundational principle.

  3.  **The "Already Punished" Argument (Antipathy's Natural Consequence):**
      *   *Observation:* The very existence of widespread and intense antipathy *itself* inflicts significant suffering ("a very galling punishment") on the targets of that antipathy.
      *   *Mechanism:* This suffering arises from social ostracism, shame, fear, loss of reputation, exclusion, and psychological distress. It happens "without having recourse to the political magistrate" – meaning it's a *social* consequence, not a legal one.
      *   *Scalability:* The severity of this informal punishment increases with both the *intensity* of individual antipathy and the *number* of people holding it.
      *   *Bentham's Point:** Adding *formal legal punishment* (fines, imprisonment, execution) on top of this pre-existing, substantial social punishment is **redundant and excessive.** It compounds suffering without adding any countervailing utility.

  **Addressing Your Interpretations & Your Friend's Worry:**

  *   **Not Exclusion, But Demotion & Redundancy:** Bentham is **not** saying the *pain caused to the majority by disgust* (antipathy-pain) should be excluded from the calculus *entirely*. He *is* saying:
      *   It cannot be the *sole* or *primary* justification for punishment (because that leads to absurd/tyrannical consequences).
      *   Its weight is significantly *diminished* because:
          *   **Legitimacy:** Using it *as justification* is illegitimate and hypocritical (the reductio argument). This implicitly questions the *moral weight* we should assign to pains arising purely from prejudice.
          *   **Redundancy:** The *consequence* of that antipathy (the social punishment inflicted *on the target*) is already a significant disutility. Adding legal punishment on top is "double-counting" the disutility caused by the antipathy itself. The target is *already* bearing the cost of the majority's disgust through social suffering. Inflicting *additional* legal pain is gratuitous.

  *   **Does This Block Your Friend's Worry?**
      *   **Partially, but not completely.** It *relocates and reframes* the problem significantly:
          *   **Against Simple Aggregation:** It successfully argues that aggregating the raw "disgust-pain" of the majority and letting it outweigh the pleasure/absence-of-pain of the minority is a flawed approach that justifies tyranny. Bentham shows this logic collapses under its own weight when applied consistently.
          *   **Highlights the Cost:** It forces the utilitarian to acknowledge that the *primary disutility* caused by the antipathy (the social suffering of the target) is already being inflicted. Adding legal punishment only adds *more* disutility without preventing the initial social pain (which exists regardless of legality).
          *   **Raises the Bar:** It means the utilitarian case *for* legal punishment must demonstrate *additional, concrete harms* beyond the mere existence of disgust and the social suffering it *already* causes. The burden of proof shifts heavily onto those advocating punishment.
      *   **The Remaining Worry:** Your friend could counter:
          *   What if the *aggregate* "disgust-pain" of the majority is *so immense* that it *still* outweighs *all* the pleasures of the minority *plus* the disutility of the social punishment they suffer *plus* the disutility of the legal punishment itself? Couldn't the sheer scale of majority suffering justify suppression, even acknowledging Bentham's points?
          *   Bentham doesn't explicitly address this scenario mathematically. His argument relies on the *illegitimacy* of giving decisive weight to such pains and the *redundancy* of adding legal punishment on top of existing social punishment.

  *   **Bentham's Implicit Deeper Move:** While not stated outright in this passage, Bentham's overall project suggests a crucial distinction:
      *   **Harm/Pain vs. Mere Dislike:** He implicitly differentiates between pains arising from *direct, tangible harm* (theft, assault) and pains arising from the *mere knowledge or idea* that others are acting in ways one finds distasteful or immoral *but which cause no direct harm*. He rejects the latter as a valid basis for state coercion. This is a core liberal principle embedded within his utilitarianism. The "reductio" argument powerfully illustrates why allowing the latter opens the door to oppression.

  **Conclusion:**

  Bentham's argument is **primarily about the *illegitimacy* of using majority antipathy/disgust as a *sufficient justification* for punishment** and the **redundancy/excessiveness of adding legal punishment on top of the substantial social punishment that antipathy *already* inflicts.** He doesn't technically exclude "disgust-pain" from the calculus, but he severely undermines its legitimacy as a decisive factor and reframes the calculation by highlighting the pre-existing disutility borne by the targets.

  *   **Against Your Friend:** It successfully blocks the *simplistic* argument that majority disgust-pain automatically justifies suppression. It forces a more complex calculation that must account for the hypocrisy of the justification, the illegitimacy of the pain source (prejudice), and the existing social disutility.
  *   **The Persistent Worry:** It doesn't *absolutely* block the *theoretical possibility* that overwhelming, aggregated disgust-pain *could*, in a purely mathematical sense, outweigh everything else. However, Bentham's arguments make this outcome far less likely and expose the profound moral and practical problems with giving significant weight to such pains in the calculus. His point is that consistently applying the principle of counting disgust-pain leads to morally abhorrent conclusions, suggesting that a *consistent* hedonistic utilitarian *must* find ways to discount or minimize the weight given to pains arising purely from prejudice and the bare knowledge of others' harmless pleasures. Modern utilitarians (like Peter Singer) explicitly argue for excluding such "external preferences" for precisely these reasons. Bentham's argument here is a powerful step in that direction.
