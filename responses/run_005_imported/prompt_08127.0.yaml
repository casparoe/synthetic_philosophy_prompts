  Hmm, this requires careful unpacking. First, I need to reconstruct Bentham's actual argument from that dense 18th-century prose. The key moves appear to be: 1) He rejects antipathy as an independent justification by showing it would legitimize clearly immoral historical persecutions (reductio ad absurdum). 2) He then argues that existing social condemnation already inflicts "galling punishment" without state intervention. 

  But the deeper philosophical tension remains - if social disgust causes real psychological pain to observers, doesn't utilitarianism require weighing it? Bentham's solution seems to be that such pain is fundamentally illegitimate when rooted in prejudice, but he never explicitly says this. His argument works better as a warning against double standards than as a technical solution to the aggregation problem.

  The user's friend has a valid point that Bentham hasn't fully resolved the tension in his system. The "already punished" argument only addresses redundancy, not the core issue of whether majority disgust should count. Still, Bentham's reductio is powerful - if we accept disgust as utility, we collapse into justifying any majority tyranny. That's probably why modern utilitarians like Singer explicitly discount external preferences.

