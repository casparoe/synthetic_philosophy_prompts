     The student states that for Haslanger, being a woman is about occupying a social position that counts as female in a given context, and that this is a status function. The student also notes that Haslanger's approach is ameliorative because it aims to define the term in a way that is useful for feminist politics. The student correctly links Haslanger's view to Searle by describing gender as a status function imposed on bodies. However, Haslanger's analysis of race is mentioned only briefly and without the same level of detail. Also, the student does not fully capture that Haslanger's account of gender is based on social positions defined by oppression (being subordinated on the basis of perceived sex) and that race is similarly defined by oppression based on perceived ancestry. The ameliorative aspect is correctly noted but could be expanded to show that the goal is to identify the social structures for political purposes.

