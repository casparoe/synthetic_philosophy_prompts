answer: |-
  Here's a sharp comparison and a definitive verdict, designed for clarity and quotability in your piece:

  **Core Concepts & The "Trade" Analogy:**

  1.  **Toby Ord's Moral Trade (Interpersonal):**
      *   **What's Traded:** *Moral Labor* or *Moral Burdens*. Individuals with differing *actual* values agree to take on specific actions or burdens that the *other* person finds morally costly but they themselves find less costly (or even neutral), in exchange for the other person doing the same for them.
      *   **The Analogy:**
          *   **Holds Up:** Directly applies comparative advantage. Each party specializes in the "moral work" where they have the lower subjective cost (like producing goods you're efficient at). Gains from trade are real Pareto improvements *relative to their own fixed values* – both end up with a world they prefer (more good done/less bad happening by their own lights) without changing their minds.
          *   **Strains:** Lacks formal enforcement mechanisms (no "moral courts"). Requires finding suitable partners with complementary values/costs. Assumes values are stable and known. Doesn't inherently lead to global moral improvement (just mutual benefit relative to fixed views).

  2.  **Bostrom's Parliamentary Model (Intrapersonal):**
      *   **What's Traded:** *Policy Support* or *Votes*. Within one agent's mind, different moral theories (or value systems) in which they hold *credence* act as delegates. They "trade" votes or support across different decisions to form a governing coalition that satisfies the aggregate "constituency" of the agent's own moral uncertainty.
      *   **The Analogy:**
          *   **Holds Up:** Captures logrolling ("I'll support your preferred policy X if you support mine on Y") and vote-trading within a legislature. The "compromise policy" (the agent's action) emerges from bargaining between distinct factions (moral theories) weighted by their influence (credence).
          *   **Strains:** Severely. Delegates aren't independent agents; they are fragments of *one* mind. Genuine bargaining between them is metaphorical – the outcome is a computational aggregation rule. There's no true "trade of burdens" happening, only weighted averaging or strategic voting under uncertainty. The "delegates" don't have independent preferences; they *are* the credences. Risk of incoherence (can a "Nazi delegate" legitimately trade votes?).

  **Key Distillation:**

  *   **Moral Trade:** Real-world deals between separate agents with *actual* conflicting values to mutually reduce their *subjective moral costs*.
  *   **Parliamentary Model:** A metaphorical decision-making procedure *inside one mind* grappling with *uncertainty* about which moral theory is *true*, aiming for an action that best reflects the *aggregate credences* across theories.

  **The Verdict:**

  **Toby Ord's Moral Trade is the significantly more defensible normative idea.**

  **Here's why, unequivocally:**

  1.  **Conceptual Coherence & Grounding:** Moral trade operates within a well-understood framework (game theory, bargaining) applied to real agents with fixed, diverse preferences. Its mechanics are clear, even if practical implementation has hurdles. The Parliamentary Model, however, is a *useful fiction for calculation*, not a literal description of a process. It papers over the deep problem of how to *aggregate* fundamentally incompatible moral demands into a single agent's action. The "trading" is illusory; it's really just a complex aggregation rule hiding behind a metaphor that breaks down under scrutiny (e.g., trading with reprehensible "delegates").
  2.  **Avoids the Morality-of-Aggregation Problem:** Moral trade doesn't require agents to endorse or compromise *their own core values* in an existential way. They simply outsource burdens they dislike to others who dislike them less. The Parliamentary Model forces the single agent to *act* on a compromise that might violate *every* theory they give credence to in some way, or even require acting on a theory they find abhorrent (if it "wins" the vote or extracts concessions). This creates a normative quagmire: why is this specific aggregation rule (voting, logrolling) the *right* way to handle deep moral uncertainty?
  3.  **Practicality & Risk:** Moral trade, while challenging, happens in the real world (e.g., pledge collaborations, issue-specific agreements between activists). Its failure modes are bounded (ineffective deals, non-compliance). The Parliamentary Model, taken seriously as normative guidance, risks demanding incoherent actions or lending undue legitimacy to horrific moral theories simply because the agent hasn't ruled them out with 100% certainty. Its failure modes involve profound internal conflict or potentially immoral actions justified by procedural aggregation.
  4.  **Normative Force:** Moral trade's normative claim is modest and powerful: *if* you can make a Pareto-improving deal relative to your own values without changing them, you *should*, because it makes you better off by your own lights. The Parliamentary Model makes a much stronger, and far less justified, claim: that you *should* act according to this specific (and metaphorically strained) aggregation procedure whenever you face moral uncertainty. The justification for *this specific procedure* as *the* normative answer to uncertainty is weak compared to the intuitive force of mutual benefit in moral trade.

  **Quotable Conclusion:**

  > "While both ideas borrow economic language, Toby Ord's Moral Trade leverages genuine comparative advantage between real agents to reduce subjective moral burdens – a conceptually coherent and practically achievable form of ethical cooperation. Nick Bostrom's Parliamentary Model, in contrast, is a strained metaphorical tool for aggregating internal moral uncertainty. Its 'trades' are illusory, its aggregation rule is normatively dubious, and it risks demanding incoherent or dangerous compromises. For handling conflicting values *between* people, Moral Trade offers a defensible path to mutual gain. For the solitary mind wrestling with uncertainty, the Parliamentary Model is more a provocative thought experiment than a sound normative guide – Moral Trade provides the cleaner conceptual lift."

  This verdict prioritizes conceptual rigor, avoids the pitfalls of forced intrapersonal aggregation, and recognizes the practical potential of interpersonal moral bargaining, making Moral Trade the stronger normative framework.
