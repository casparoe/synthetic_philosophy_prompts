prompt: |-
  I'm a retired chemist who's fallen down the rabbit hole of decision theory in retirement (turns out philosophy is way more addictive than titration curves ever were). I've been reading about updateless decision theory in the context of stuff like counterfactual mugging and Newcomb's problem, and there's one thing that's bugging me that none of the blog posts I've read really clear up.

  The whole pitch of UDT, as I understand it, is that you shouldn't update on the fact that you've observed yourself in some particular branch or situation -- instead you commit, from behind a kind of veil, to whatever policy is best across all the ways things could've gone, rather than reasoning from where you currently happen to find yourself. Fine, I think I get that much. But then whenever people actually work out what the UDT-optimal policy is for a given problem, they seem to lean pretty heavily on logical/mathematical updating -- like, the agent has to figure out what the predictor would do, or derive what follows from the setup, and that seems to require updating on logical facts as it goes, the same way any of us updates once we've actually worked through a calculation. So how is "don't update on indexical/empirical evidence" compatable with "you must update on logical/computational facts just to act at all"? Is there a principled line between these two kinds of updating that I'm just not seeing, or is this a known soft spot in the theory that people mostly just wave hands over? I'd love an explanation that actually engages with the guts of this rather than just restating the "updatelessness" slogan.
reasoning: |-
  Okay, let me start by unpacking the chemist's question. They're a retired chemist diving into decision theory, specifically updateless decision theory (UDT). They get the basic idea of UDT—committing to a policy without updating on indexical information. But they're confused about how logical updating fits into this. They see that when people compute UDT policies, they still use logical reasoning, which feels like updating. So they're asking if there's a principled distinction between updating on empirical vs. logical facts, or if this is a hand-wavy area in UDT.

  First, I need to recall the core of UDT. The key point is avoiding indexical updates. For example, in Newcomb's problem, don't update on being in the box where the predictor put money or not. Instead, choose a strategy beforehand. But to figure out the best strategy, you have to simulate the predictor's behavior, which involves logical deductions. So the chemist is pointing out a tension here: logical reasoning seems like updating, but UDT claims to be updateless.

  I remember that UDT separates epistemic and decision processes. The epistemic part handles all updates—logical and empirical. The decision part is where updatelessness applies. So maybe the answer lies in that separation. The chemist might not have encountered this distinction clearly in the blogs they read. They need an explanation that doesn't just repeat slogans but digs into the mechanism.

  Let me think about how logical updating differs from empirical. Logical facts are necessary; once proven, they're true everywhere. Empirical facts are contingent and indexical. In UDT, the agent computes a policy by considering all possible worlds defined by logical possibilities. The policy is a function that maps world-states to actions. The updateless part is committing to this function before knowing which world-state you're in. But to build that function, you need logical deductions about how the world works, including predictors or other agents.

  The chemist mentioned counterfactual mugging. In that scenario, Omega asks for money if it predicts you lost a coin toss. UDT says to pay up because your policy should benefit all versions of you, even the counterfactual ones. To decide this, the agent must deduce Omega's reliability, which involves logical updating. But once the policy is set, you don't update on the coin toss outcome.

  So the distinction is between constructing the policy (which requires logical reasoning) and executing it (where no empirical update occurs). The chemist's confusion might stem from seeing the policy creation as part of the decision-making, but UDT treats them as separate phases. The "updateless" applies only at the moment of action, not during the prior reasoning.

  I should also consider the computational aspect. UDT agents are often modeled as programs that output policies. The program performs computations (logical updates) to determine the best policy. But once outputted, the policy is followed without further updates. So the logical work is pre-decision, while empirical data is handled by the policy without real-time updating.

  Is this a known issue in UDT? I recall that logical uncertainty is a big topic. UDT assumes the agent can solve all logical problems instantly, which isn't realistic. But the chemist's point is more about the conceptual compatibility. The answer lies in the separation of stages: logical reasoning is in the epistemic phase, updating on logic is fine there, but the decision rule itself doesn't update on empirical data.

  The chemist wants a "principled line." The line is between necessary logical truths and contingent empirical facts. Logical facts are global; empirical are local to a branch. When UDT commits to a policy, it's for all branches, using logical deductions made beforehand. So the policy already accounts for what's logically necessary, and only the empirical context varies per branch.

  In summary, the resolution is that UDT allows logical updating during the policy formulation but forbids empirical updating when applying the policy. The chemist's deeper need is understanding how UDT isn't cheating by allowing one type of update. The key is that logical updates affect the entire policy uniformly, while empirical updates would make the policy branch-specific, which UDT avoids.
answer: |-
  Ah, a fellow traveler down the decision theory rabbit hole! It's a delight to engage with someone who's tackled titration curves and now wrestles with predictors and counterfactuals. Your question cuts right to a core conceptual tension in Updateless Decision Theory (UDT), and it's incredibly astute. Many expositions *do* gloss over this distinction, making UDT seem like it smuggles in updating through the back door. Let's dissect this carefully. The resolution lies in distinguishing **epistemic updating** (which UDT absolutely does and needs) from **indexical/empirical updating at the decision boundary** (which UDT seeks to avoid). Here's the breakdown:

  ### 1. **The Core Tenet of UDT: Avoiding Indexical Conditioning**
     UDT's fundamental move is this: When choosing an *action* or a *policy*, you should not condition your decision on the *specific empirical situation you find yourself in* (your "indexical" facts). Instead, you choose a *single, universal policy function* that maps the entire *logical* description of the universe (or the relevant decision problem) to actions. You commit to this policy *before* knowing which "branch" or "instance" you actually are.

      *   **Why?** To avoid self-defeating behavior in problems like:
          *   **Counterfactual Mugging:** If Omega flipped a coin, asked you for $100 only if it landed tails, and now (heads) asks you to pay $100 to the counterfactual "tails-you," conditioning on "I see heads" makes you refuse. UDT says: Commit to the policy "Pay if Omega asks" *regardless of the coin outcome*, because this policy benefits *all possible versions* of you across branches.
          *   **Newcomb's Problem (One-Boxing):** Conditioning on "I see Box B full or empty" tempts you to two-box. UDT says: Commit to the policy "One-box" *before* seeing the boxes, as this is the policy that makes the predictor (who models your *policy*, not your momentary state) fill Box B.

      **The "Veil" you mention:** This is the commitment *before* knowing your specific location/index within the logical structure of the world. You don't update on "I am *this* particular agent-instance at *this* point in time with *these* sensory inputs."

  ### 2. **The Inevitability of Logical/Mathematical Updating**
     Here's where your observation hits perfectly. To even *formulate* the universal policy function, the UDT agent *must* engage in intense logical/mathematical reasoning. This involves:
      *   **Deducing the structure of the problem:** What are the players (Omega, you)? What are their capabilities (perfect predictor?)? What are the dependencies (your policy determines Omega's action)? What are the possible logical worlds/branches?
      *   **Solving logical equations:** What policy `P` outputs actions `A` such that, when plugged into the world-model `M`, leads to the best expected outcomes *across all branches*? This often involves fixed-point reasoning: "What `P` would I want to have committed to, knowing that Omega simulates/responds to `P` itself?"
      *   **Overcoming logical uncertainty:** In real-world implementations, the agent doesn't instantly know all mathematical truths; it has to compute them, updating its beliefs about logical facts (e.g., "Is this proof valid?", "What does this simulation output?").

     **This *is* updating:** As you work through the deduction, your state of knowledge about logical/mathematical facts changes. You start not knowing if Fermat's Last Theorem is true; after verifying the proof, you update your belief. A UDT agent computing its policy does the same for the logical facts relevant to the decision problem (e.g., "Does `Program X` output `Y`?").

  ### 3. **Reconciling the Two: The Principled Line**
     The seeming contradiction dissolves when we recognize **two distinct phases** and **two distinct types of facts**:

      | Feature              | Logical/Mathematical Facts                     | Indexical/Empirical Facts                     |
      | :------------------- | :--------------------------------------------- | :-------------------------------------------- |
      | **Nature**           | Necessary truths, global to all branches. True everywhere or nowhere. Dependent only on abstract structure. | Contingent truths, local to a branch. True *here* but possibly false *there*. Define "where/when/who" you are. |
      | **UDT Phase 1: Policy Formulation (Epistemic Phase)** | **Updating REQUIRED & ESSENTIAL.** Agent must deduce the logical structure of the problem, the consequences of policies, and solve for the optimal `P`. This involves continuous logical updating. | **Irrelevant.** The agent hasn't "located" itself yet. It reasons about *all possible* empirical situations/branhes abstractly. |
      | **UDT Phase 2: Policy Execution (Decision Phase)** | **Already Incorporated.** The fixed policy `P` encodes the *results* of the logical deductions. No *further* logical updating about the *problem structure* is needed at execution. | **Updating FORBIDDEN.** The agent *has* empirical data (sense inputs). But it **does NOT use this data to choose an action.** It simply plugs the *entire logical world-state description* (which *includes* the empirical data as an input) into its precomputed policy function `P` and outputs `P(world-state)`. |
      | **Analogy**          | Writing the code for a function `P(input)`. You need to understand math/logic to write correct code. | Running the function `P` on a specific input `world_state_42`. You don't rewrite the code based on the input; you just execute `P(world_state_42)`. |

      *   **The Crucial Distinction:** UDT forbids updating your *decision rule* based on indexical/empirical information. It *requires* updating your *logical knowledge base* to *derive* the optimal decision rule in the first place. The policy `P` is a *function* of the *entire world state*, including the empirical data. But `P` itself is fixed *before* the agent knows which specific world state (which includes the empirical data) it will be fed.
      *   **Why this resolves the tension:** The logical updating happens *during the design of the function* `P`. The empirical data is merely the *argument passed to* `P` at runtime. Updating on the empirical data would mean dynamically *changing* `P` based on the input – which is exactly what UDT avoids. The logical facts were used to *build* `P` to handle *any* input correctly.

  ### 4. **Illustration: Counterfactual Mugging**
     1.  **Policy Formulation (Logical Updating Happens Here):**
         *   Agent deduces: "There exists an entity Omega. Omega flips a fair coin. Omega asks me for $100 iff the coin was tails. If I am asked (tails branch), I face a choice: Pay or Refuse. If I am *not* asked (heads branch), Omega may ask me to pay $100 to the counterfactual tails version."
         *   Agent solves: "What policy `P` should I commit to? `P` must specify an action for the 'asked' state and the 'not asked but requested to pay counterfactually' state."
         *   Logical deduction: "If I commit to `P(Pay if Asked; Pay if Counterfactually Requested)`, then:
             *   In Tails Branch (Asked): I pay $100. Outcome: -$100.
             *   In Heads Branch (Counterfactually Requested): I pay $100. Outcome: -$100.
             *   BUT: Omega, simulating my policy, sees I pay in the counterfactual. It values this cooperation and rewards me (say +$200) in the Heads branch *because* of my policy. Expected Utility (EU): (0.5 * -$100) + (0.5 * (+$200 - $100)) = -$50 + $50 = $0.
             *   If I commit to `P(Refuse if Asked; Refuse if Counterfactually Requested)`:
                 *   Tails: Refuse. Outcome: $0.
                 *   Heads: Refuse. Outcome: $0. EU: $0.
             *   If I commit to `P(Pay if Asked; Refuse if Counterfactually Requested)`:
                 *   Tails: Pay. Outcome: -$100.
                 *   Heads: Refuse. Outcome: $0. EU: -$50.
             *   If I commit to `P(Refuse if Asked; Pay if Counterfactually Requested)`:
                 *   Tails: Refuse. Outcome: $0.
                 *   Heads: Pay. Outcome: -$100. EU: -$50.
         *   **Logical Conclusion:** `P(Pay; Pay)` yields EU $0, same as `P(Refuse; Refuse)`. BUT, if Omega rewards cooperation *only* in the Heads branch *if you pay the counterfactual*, then `P(Pay; Pay)` might be strictly better (EU=$0 vs potentially negative). Assume it is optimal. **Policy Fixed:** `P(world_state)` = "Pay" if the world-state description includes "Omega is requesting money from me (whether in my branch or counterfactually)".
     2.  **Policy Execution (No Empirical Updating at Decision Boundary):**
         *   Agent finds itself in a specific world-state: `world_state_actual = {Coin = Heads, Omega is presenting me with: 'Please pay $100 for the counterfactual Tail-you.'}`.
         *   Agent **does NOT think:** "I observe Heads! Therefore, I should update my decision rule and refuse, keeping my $100." That would be indexical updating.
         *   Agent **executes:** `P(world_state_actual)`. The policy `P` says "Pay" for this input. Agent pays $100.
         *   The logical fact "`P(Pay; Pay)` is optimal" was established *before* knowing the coin flip. The empirical fact "Coin = Heads" is merely part of the input fed to the pre-committed policy.

  ### 5. **Is This a "Soft Spot" or Hand-Waving?**
      *   **Conceptually:** The distinction is principled. Logical facts define the *rules of the game* and the *consequences of strategies*. Indexical facts define *which seat you're sitting in* at the game table. UDT says: Choose your strategy (policy) based *only* on the rules and consequences, *before* you know your seat. Then, when you see your seat, just follow the strategy.
      *   **Practically/Computationally:** This is where the real challenges lie, and your skepticism is warranted regarding "hand-waving":
          1.  **Logical Omniscience:** UDT typically assumes the agent can perfectly solve all necessary logical/mathematical problems during policy formulation. This is unrealistic. Real agents have **logical uncertainty**. Figuring out how UDT agents should handle *uncertainty about logical facts* (e.g., "What's the output of this complex simulation of me?") is a major area of active research (logical induction, etc.). *This* is the true "soft spot," not the indexical/logical updating distinction itself.
          2.  **Specifying the "World State":** How does the agent formally describe the entire "logical world state" as input to `P`? This requires a universal representation, which is non-trivial.
          3.  **Computational Complexity:** Finding the optimal UDT policy can be astronomically hard, equivalent to solving very hard fixed-point problems over possible universes.

  ### Conclusion
  Your intuition is spot-on: UDT agents *must* update on logical/mathematical facts to even figure out what the optimal policy *is*. This is fundamental and unavoidable. The "updatelessness" specifically refers to **not allowing the *empirical/indexical data* about *which specific situation/branch the agent is currently in* to influence the *selection of the action* at the moment of decision.** The policy `P` is chosen *updatelessly* (without knowing your index) based on logical reasoning about all possibilities. Execution is then a mechanical application of `P` to the full world-state description (which includes the indexical data as an input parameter, not a basis for changing `P`).

  The principled line is clear: **Logical updating builds the map (the policy function). Updateless decision-making means following the map strictly once you know your location, without redrawing the map based solely on where you are.** The challenges lie in drawing the map perfectly under logical uncertainty, not in the core distinction itself. Keep wrestling with it – this is exactly the depth where decision theory gets fascinating! Feel free to throw a concrete problem or another point of confusion my way.
