answer: |-
  Your analogy to finite-size scaling is remarkably insightful—it captures the core structural similarity supervaluationism seeks. But higher-order vagueness exposes a critical disanalogy related to the *grounding* of the idealization. Let's dissect why this regress is particularly problematic for supervaluationism and evaluate the fixes.

  ### Core Tenets of Supervaluationism (SV) & the Problem
  1.  **Truth-Value Gaps:** SV posits that for a borderline case (e.g., a collection `n` grains), "`n` is a heap" is *neither true nor false* (a truth-value gap). This contrasts with epistemicism's bivalence.
  2.  **Admissible Precisifications (APs):** The meaning of "heap" is defined by the set of all *admissible precisifications* (complete, consistent, classical assignments of T/F to every collection respecting penumbral connections, e.g., if `k` grains is a heap, so is `k+1`).
  3.  **Supertruth:** A statement is **supertrue** (simply true) iff it is true on *all* APs. Superfalse iff false on all APs. Gappy otherwise.
  4.  **Sharp Cutoff in the Limit:** While each AP has a sharp cutoff (e.g., at `m_i` grains), the *supertruth* cutoff exists only as a *global* property across *all* APs (e.g., `n` is supertrue heap only if *every* AP calls `n` a heap). The "real" boundary is the point where *all* APs agree on "heap" vs. the point where *all* agree on "not heap". Between these lies the borderline region where APs disagree.

  **The Vulnerability:** The definition of **admissibility** is itself vague. What counts as an "admissible" precisification? Consider:
  *   Must an AP respect *only* obvious penumbral connections? How "obvious"?
  *   Does "heap" require structural stability? To what degree?
  *   Is there a precisification excluding purple grains? Including sand dunes?

  **Higher-Order Vagueness (HOV) Attack:** There is no sharp boundary between precisifications that are admissible and those that are not. `Precisification P` itself might be a **borderline case** of admissibility. SV needs a precise set of APs to define supertruth, but determining membership in *this set* suffers from the same vagueness SV was designed to handle!

  **Why This is *Especially* Damaging for SV:**
  1.  **Foundational Instability:** SV's entire semantic machinery (supertruth, the borderline region) *depends critically* on a precisely defined set of APs. If *that set* is vague, the definitions built upon it become ill-defined. What does "true on all APs" mean if "all APs" isn't a determinate set? The theory collapses into incoherence at its foundation. *(Contrast with Epistemicism: Epistemicism bites the bullet: there IS a sharp cutoff (`n` grains is the heap boundary), and ALL vagueness (1st-order, 2nd-order, etc.) is simply ignorance of where this precise boundary lies. HOV is just deeper ignorance about a precise fact. The theory doesn't rely on vague sets; it relies on our inability to know a precise fact. HOV is a consequence, not a foundational threat.)*
  2.  **Loss of Explanatatory Power:** SV promised to explain the *appearance* of no sharp boundary by showing the real boundary is "smeared out" over APs. But if the smear itself (the set of APs) is vague, we haven't eliminated the vagueness; we've relocated it to a meta-level without resolving it. The core phenomenon re-emerges within the model.
  3.  **Infinite Regress Threat:** To define the set `S0` of 1st-order APs, we seem to need a *higher-order* set `S1` of precisifications for "admissible precisification", and then a set `S2` for "admissible precisification of 'admissible precisification'", and so on *ad infinitum*. Can this regress be grounded?

  ### Standard Fixes: Relativization and Iteration – Do They Work?
  SV proponents offer two main strategies, often combined:

  1.  **Relativized Precisification (Contextualism/Para-consistency):**
      *   **Idea:** Don't fix "The Set" of APs absolutely. Instead, supertruth is *relative* to a context `C`, which (perhaps implicitly) selects a specific set `S_C` of APs deemed admissible *in C*. "`n` is a heap" is supertrue-in-C iff true on all APs in `S_C`.
      *   **HOV Response:** HOV manifests as contexts `C1` and `C2` selecting *different* sets `S_C1` and `S_C2`, where the difference lies in precisifications that are borderline admissible. There's no context-independent fact about which set is "really" admissible.
      *   **Evaluation:** This *manages* the regress by stopping it at a contextual level. However:
          *   **Relocates, Doesn't Resolve:** The vagueness of "admissible" is now located in the *indeterminacy between contexts*. Why is `C1`'s selection privileged over `C2`'s? It isn't. We still lack an account of why contexts shift or what constrains them beyond avoiding contradiction. The fundamental vagueness persists in the space of contexts.
          *   **Threatens Normativity:** If truth is context-relative, what governs correct assertion across contexts? Why is asserting "That's a heap" wrong in a context using a stricter `S_C`? Norms seem to dissolve into contextual whim.

  2.  **Iterated Precisification (Hierarchical SV):**
      *   **Idea:** Explicitly build a hierarchy of orders of vagueness. Define:
          *   `S0`: The (vaguely defined) set of 1st-order APs for "heap".
          *   `S1`: A set of meta-precisifications, each assigning a *precise* set `P_j` to `S0`. "`P` is admissible" is supertrue-at-level-1 iff `P` is in `S0` according to *all* meta-precisifications in `S1`.
          *   `S2`: A set of meta-meta-precisifications assigning precise sets to `S1`, and so on.
      *   **HOV Response:** HOV is modeled by the gaps *between* levels. `P` being borderline admissible means it's in the gap between "supertrue-at-level-1 to be in `S0`" and "superfalse-at-level-1 to be in `S0`".
      *   **Evaluation:**
          *   **Formal Tractability:** This provides a formal structure to model HOV. One can define "`n` is a clear case of a heap" (true on all APs in all `P_j` in `S0` according to all meta-precisifications in `S1`... etc.).
          *   **Regress Remains:** The hierarchy is either:
              *   **Finite:** Arbitrarily capped at some level `k`. But then the set `S_k` itself is vague! The problem reappears at the top level.
              *   **Infinite:** Requires infinitely many distinct semantic levels. This is complex, arguably ontologically extravagant, and lacks a clear foundation. What grounds the *entire* infinite hierarchy? How does it connect to actual language use?
          *   **Explanatory Deficiency:** While it *describes* the structure of vagueness, it doesn't *explain* why this structure exists or how finite minds grasp it. It feels like a formal description of the phenomenon rather than a resolution. The physicist might note this resembles a Kadanoff block-spin renormalization procedure, but without a fixed point or universality class to ground it.

  ### Why Epistemicism Avoids the *Foundational* Embarrassment
  Epistemicism's core claim is **semantic precision + epistemic limitation**:
  1.  Every predicate ("heap," "bald," "admissible") has a **perfectly sharp extension** fixed by usage, causal chains, and the environment (however complex).
  2.  Our **inability to know** these precise boundaries is due to:
      *   **Complexity:** The factors determining the boundary are too intricate and numerous.
      *   **Stability:** Our dispositions to use the word are stable across nearby cases but shift imperceptibly.
      *   **Lack of Coordinating Mechanism:** No process forces communal agreement on the exact boundary.
  3.  **HOV Treatment:** Higher-order vagueness is simply **higher-order ignorance**. It's indeterminate *for us* whether `n` is borderline because we don't know if `n` is the cutoff or `n-1`/`n+1` is, and we *especially* don't know the precise boundaries of the complex factors *defining* the cutoff. The ontology remains sharp; the epistemology is limited. There's no vague set threatening the theory's foundation.

  ### Conclusion
  Your phase transition analogy is potent: SV locates the sharp boundary in an idealized limit (AP-space), just as the critical point exists only in the thermodynamic limit. **The crucial disanalogy is this:** In physics, the *idealization itself* (infinite system size) is mathematically well-defined and grounded in the formalism. In SV, the idealization (the set of all admissible precisifications) is *itself infected by the very phenomenon it tries to model* (vagueness of "admissible"). This meta-vagueness undermines the foundation upon which SV builds its account of first-order vagueness.

  Higher-order vagueness is thus a **special embarrassment for SV** because it attacks the theory's core semantic mechanism – the set of admissible precisifications – revealing it to be just as vague as the predicate it was supposed to precisify. Epistemicism avoids this by denying the need for truth-value gaps and vague sets, attributing all appearances of vagueness to ignorance of underlying precision.

  The standard **fixes – relativization and iteration – primarily relocate the regress** rather than block it. Relativization pushes it into context-indeterminacy, while iteration builds an infinite or arbitrarily capped hierarchy that lacks a clear grounding principle. They provide formal frameworks for *describing* HOV but struggle to *resolve* the fundamental challenge SV faces: grounding the idealization without presupposing the very vagueness it seeks to eliminate. Your physicist's intuition that the "finite-size" nature of actual language use prevents a sharp cutoff holds; the challenge for philosophy is whether any semantic theory can consistently model this without collapsing into incoherence or resorting to epistemic mystery.
