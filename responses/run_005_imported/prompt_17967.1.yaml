  I'm a political theory PhD student and I co-host a pretty low-key podcast on the side with a couple people from my cohort. Next week's episode is with a guest I'm inventing for the purposes of this ask -- basically a political theorist who's built her whole career defending and updating Hannah Arendt's account of lying in politics (the "Truth and Politics" essay and "Lying in Politics: Reflections on the Pentagon Papers") for the social-media/deepfake era. I've been re-reading both essays for a dissertation chapter on political epistemology, and my cohort keeps half-joking that Arendt basically predicted the whole fake-news discourse, but I don't want the episode to just be her restating the standard reading -- so can you draft me like 8-10 interview questions, each paired with a quick follow-up keyed to whatever answer she's most likely to give first?

  At minimum I want: one question on whether her rational-truth/factual-truth split is doing real philosophical work or is kind of ad hoc (it feels custom-built just to explain why math and factual history get persecuted differently); one on that genuinely strange move where she says the liar's freedom to insist 'this need not have been so' comes from the same source as the political actor's freedom to start something new -- natality and all that -- which sounds uncomfortably like she's making lying and acting cousins rather than opposites, so push on how she keeps them apart; one on the self-deception bit from the Pentagon Papers essay, where the 'problem-solvers' and image-managers apparently end up conning themselves as much as the public, and whether that story even survives once the lying isn't coming from one identifiable bureaucracy anymore but from a decentralized swarm of bots, algorithims and randos online, where there's arguably no coherent 'self' left to be self-deceived; and one on whether the gap between the old limited statesman's lie and the modern wholesale substitution of 'image' for reality is a difference in kind or just of scale and organization. Fill out the rest however rounds it out best, but end on a question that forces her to say what would actually count as evidence that Arendt's framework has broken down for our situation, rather than letting her retreat to 'well, it's more complicated now.'
