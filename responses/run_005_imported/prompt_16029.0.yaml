answer: |-
  You've raised an excellent and nuanced point. While widespread explicit atheism *is* a relatively modern phenomenon, Schellenberg's Divine Hiddenness Argument (DHA) remains a serious philosophical challenge for several reasons, addressing the core logic rather than just statistical prevalence:

  1.  **Focus on "Nonresistant Nonbelief":** Schellenberg's key concept isn't just "nonbelief," but **"nonresistant nonbelief"** – individuals who:
      *   Are capable of a meaningful relationship with God.
      *   Are *not* actively resisting belief (e.g., through willful rejection, sinful rebellion, or culpable ignorance).
      *   Are genuinely open to finding and relating to God if evidence were available.
      *   Yet, through no fault of their own, lack belief due to a lack of sufficient evidence or experience.
      The argument claims that the existence of *even one* such person is incompatible with a perfectly loving God who desires a reciprocal relationship with all capable beings.

  2.  **Quality over Quantity (Though Quantity Matters Too):** While widespread nonbelief strengthens the argument rhetorically, the *philosophical core* hinges on the *possibility* and *existence* (even if rare) of nonresistant nonbelief. If such individuals exist (and Schellenberg argues they demonstrably do), that's the problem for classical theism, regardless of whether they are 1% or 50% of the population historically. A perfectly loving parent wouldn't hide from a *single* child genuinely seeking them.

  3.  **The Argument Isn't Primarily About Explicit Atheism:** It encompasses:
      *   **Sincere Seekers:** Individuals throughout history who earnestly pursued spiritual truth but concluded no personal God exists (e.g., certain philosophers, mystics, or adherents of non-theistic religions like some forms of Buddhism).
      *   **Ambiguous/Uncertain Belief:** Many people throughout history held vague, culturally inherited, or superstitious beliefs that fall far short of a conscious, meaningful relationship with a perfectly loving God as conceived in classical theism. Schellenberg would argue this *is* a form of hiddenness.
      *   **The Problem of "Unknowing":** Why isn't God's existence and loving nature *obvious* and *unambiguously available* to every person capable of relationship? The hiddenness is the *lack* of this kind of universally accessible, compelling evidence/experience.

  4.  **The Qualitative Experience of Hiddenness:** The argument also captures the *existential* experience reported by *believers* – periods of profound doubt, feeling abandoned by God ("dark night of the soul"), or a sense of God's silence. This pervasive *quality* of hiddenness, even amidst belief, is part of the phenomenon the argument addresses. A perfectly loving God, it's argued, would prevent such profound experiences of absence in those who *do* believe.

  5.  **Challenging Theistic Explanations:** The DHA directly targets common theistic defenses used for the Problem of Evil (e.g., free will, soul-making):
      *   **Free Will:** Schellenberg argues nonresistant nonbelief isn't a *free choice* against God; it's a *lack of opportunity* to choose for God due to insufficient evidence. A hidden God doesn't enhance meaningful freedom; it prevents it.
      *   **Soul-Making/Character Development:** Could hiddenness build virtue (seeking, faith)? Schellenberg counters that a perfectly loving God could achieve these goods *without* allowing the profound harm of being cut off from the relationship itself, especially for nonresistant seekers. The absence of the supreme good (God) seems disproportionate.
      *   **Divine Punishment/Testing:** This is incompatible with perfect love directed at the nonresistant.

  6.  **Highlighting a Specific Tension in Theism:** The DHA isolates a potential contradiction within classical theism:
      *   God is perfectly loving and desires a personal relationship with all humans.
      *   God is all-powerful and all-knowing, capable of making His existence and nature unambiguously known to any nonresistant person.
      *   Yet, nonresistant nonbelief (apparently) exists.
      Philosophers take it seriously because it forces theists to either:
      *   Deny the existence of genuine nonresistant nonbelief (hard to maintain convincingly).
      *   Reinterpret divine love (risks making it unrecognizable).
      *   Reinterpret divine power/knowledge.
      *   Accept the argument's conclusion (atheism).

  **Why Philosophers Still Engage With It, Despite Your Valid Historical Point:**

  *   **Logical Rigor:** The argument is logically valid and rests on seemingly plausible premises about love, relationships, and divine capabilities. Its force lies in its structure, not just empirical claims about numbers.
  *   **The Existence of the Nonresistant:** Philosophers argue that examples of sincere, open-minded individuals who investigated theism and found the evidence lacking *do* exist (e.g., thoughtful agnostics/atheists raised in secular environments, seekers disappointed by theistic answers). Their existence, however statistically small historically, is the focal point.
  *   **Modern Context Amplifies It:** While explicit nonbelief *was* rarer historically, it's undeniably widespread and growing rapidly now in many societies. This modern context makes the argument feel more urgent and empirically salient, even if its core logic doesn't depend on this.
  *   **It Targets the "Best Case" God:** The argument specifically challenges the concept of a *maximally great, perfectly loving* God, which is the God most philosophically interesting theists defend. It's not primarily aimed at deism or polytheism.

  **In Conclusion:** You're right that explicit atheism hasn't been the historical norm. However, Schellenberg's argument is potent because it focuses on the *possibility* and *existence* of "nonresistant nonbelief" – individuals genuinely open to God but finding insufficient reason to believe – and argues that a perfectly loving God *would not allow even one such person to exist*. This creates a specific logical tension within classical theism that demands a response, making it a persistent and serious topic in philosophy of religion, regardless of the exact historical statistics on nonbelief. It challenges the *quality* and *availability* of the divine-human relationship expected under perfect love.
