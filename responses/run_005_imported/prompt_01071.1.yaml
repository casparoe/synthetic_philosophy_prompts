answer: |-
  The air in the library annex hung thick with dust motes and the weight of unread pages. Boxes of longlisted novels stood like sentinels against the oak-panelled walls. Nadia, leaning against a bookshelf, rubbed her temples. Julian sat across the small table, meticulously aligning his notes.

  **Nadia:** Julian, we need to talk about the Branson. And the Chen. Possibly the Okafor.

  **Julian:** (Without looking up) They’re demanding reads. The Branson especially requires… immersion.

  **Nadia:** Immersion I don’t have time for. The shortlist is due Thursday. I’ve got the Patel, the Dubois, and frankly, my own sanity to preserve. I won’t do them justice skimming.

  **Julian:** (Finally meeting her gaze) Then you can’t judge them. It’s that simple.

  **Nadia:** It’s not simple. Martin finished the Branson weeks ago. He’s practically written a thesis on it. Detailed, nuanced, passionate. He knows my taste, my critical framework. I trust his account implicitly. I can cast an informed vote based on his testimony.

  **Julian:** Testimony? Nadia, this isn’t a courtroom fact. "Did the butler do it?" Martin can tell you *what* happens, *how* the prose functions, even *why* he thinks it succeeds or fails. But he cannot give you the *experience* of reading Branson. The judgment we’re tasked with *is* the judgment of that experience. A vote based on Martin’s experience isn’t a vote for the novel; it’s a vote for Martin’s *version* of the novel. It’s aesthetic hearsay.

  **Nadia:** (Leans forward, voice sharpening) Hearsay? That’s dramatic. And hypocritical. You rely on testimony constantly! You cite other critics in your reviews, build arguments on historical scholarship you didn’t unearth yourself. You trust the testimony of editors, translators, biographers. Why is *this* chain of testimony suddenly invalid? Martin reads it, processes it, articulates it. I process *his* articulation. Where’s the break in the chain of knowledge? Can true belief about a book’s quality *not* be transmitted?

  **Julian:** (Steeples his fingers) You’re blurring domains, Nadia. Historical fact, textual analysis, even critical interpretation – these *can* be transmitted. They are propositions about the work. But the *aesthetic quality itself* – the *reason* we care about those propositions – resides in the encounter. Imagine describing the taste of a peach. You can list its chemical components, its texture, its colour, even the cultural associations. But does that description transmit the *taste*? Can you truly judge the peach based solely on my description, however eloquent? I submit you cannot. The judgment *is* the tasting. Similarly, the judgment *is* the reading.

  **Nadia:** But we’re not judging a *sensation*, Julian. We’re judging a complex artifact – structure, language, theme, originality, emotional resonance. These *are* communicable concepts. Martin can convey the intricate structure of the Chen, the devastating power of its final metaphor. He can articulate *why* it moved him, *why* the language is innovative. If his testimony accurately reflects the novel’s properties, why can’t I form a valid judgment? If he tells me the peach is succulent, complex, perfectly balanced between sweet and tart, and he’s never been wrong about a peach before… why shouldn’t I believe him and judge accordingly? Isn’t that how knowledge *works*?

  **Julian:** (Sighs, runs a hand through his hair) You might *know* things *about* the peach. You might even hold a *true belief* that it is, objectively, a good peach. Martin is reliable; his description matches the peach’s properties. Epistemologically, perhaps, you’re covered. But…

  **Nadia:** But what? That sounds like concession. What else is there?

  **Julian:** (His voice lowers, becoming more intense) There’s the *doing*. There’s the *debt*. You owe it *to the novel*. Not just to the *idea* of the novel, but to the specific arrangement of words on those specific pages, the labour and vision that put them there. You owe it *to the office we hold* as judges. This isn’t just about acquiring information to tick a box. It’s about *engagement*. Direct, unmediated confrontation. Only then can you feel the weight of a clumsy sentence, the thrill of a perfect cadence, the cumulative power of a narrative arc *you* have traversed. Martin felt it *for himself*. You would be feeling… Martin. Or rather, your *idea* of Martin’s feeling.

  **Nadia:** So it’s about authenticity of feeling? Purity of experience? What about blind jurors? They rely on the text alone, no biography, no context. Is their judgment purer than ours because they have *less* testimony? Is direct encounter with the text the *only* valid input? That seems absurdly restrictive.

  **Julian:** No, context matters. Biography, history, critical discourse – they illuminate the text, enrich the *encounter*. But they orbit the central act: *you* reading *it*. The blind juror engages directly with the text, even if lacking external context. You, relying solely on Martin, are engaging directly with *Martin’s engagement*. It’s a different object. The testimony might give you true belief about the novel's quality, Nadia. I’ll grant you that possibility in principle. But the *act* of judging – the sacred, frustrating, essential burden of it – demands that *you* meet the work. Not its ambassador. Anything less… it feels like a dereliction. A failure to show up for the very thing we’re here to honour.

  **Nadia:** (Stares at the stacks of books, then back at Julian, her expression weary but resolute) Dereliction? That’s harsh. I’m trying to be responsible with limited time. To leverage trust and expertise within the group. You make it sound like a sacrament.

  **Julian:** (Meets her gaze, unflinching) Isn’t it? Or something perilously close? We’re stewards. We owe the books our full attention. Not a filtered version of someone else’s.

  **Nadia:** And if full attention is impossible? What then? Abstain? Hand the vote to Martin? Neither seems right. (She pushes back from the table). You haven’t convinced me it’s *invalid*, Julian. Only that it feels… insufficient *to you*. A point of honour. I respect that. But I can’t magically create time. I need to think.

  **Julian:** (Nods slowly, the fervour receding into tired frustration) And I can’t shake the conviction that honouring the work *requires* the work. Not a report. Think, Nadia. But please… think about *what* you’re truly judging if you rely on Martin.

  Nadia stands, gathering her bag. She looks at the box labelled "Branson," then at Julian, his face etched with a stubborn, almost painful conviction. No resolution hangs in the dusty air, only the heavy awareness of a gulf neither can easily bridge – between the practical necessity of shared knowledge and Julian’s uncompromising ideal of direct, personal encounter. She walks out without another word, the question of the Branson, and the very nature of their task, throbbing unresolved between them. Julian stares at the closed door, then down at his perfectly aligned notes, his finger tracing a line as if searching for an answer in the paper grain.
