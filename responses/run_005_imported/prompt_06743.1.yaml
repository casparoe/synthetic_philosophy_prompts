   2. Metric-field essentialism: attributes the identity of spacetime points to the metric field. A point is nothing without the metric. The hole diffeomorphism does not change the metric (it is an active diffeomorphism that moves the metric and matter fields together) so the points are the same. Alternatively, the metric is essential to the points.

   3. Leibnizian relationalism: denies the reality of spacetime points. Only physical objects and their relations exist. The hole diffeomorphism does not change the relations, so no indeterminism.

   4. Structuralism about spacetime points: points are nodes in a structure and have no identity outside that structure. The hole argument is dissolved because the structure is what matters, and the diffeomorphic models represent the same structure.

   5. Biting the bullet: accept that there is indeterminism but argue that it is harmless because it is unobservable and does not affect empirical predictions.

   6. Deflationary view: the substantivalist/relationalist debate is not well-posed because general relativity does not support the notion of spacetime points as independently existing entities. We should instead focus on the invariant structure.

