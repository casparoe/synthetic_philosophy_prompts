  Been going back and forth on this for days and can't land on an answer. My friend found out I told our other friend about her breakup, and now she's giving me the silent treatment for "not being trustworthy." Thing is, this is a girl who gossips about literally everyone, including stuff i've told her in confidence, so it feels weird that she's the one lecturing me about it. When I brought that up she said it doesn't matter what she does, I still did something shitty by telling. Is she right that her own gossiping is beside the point, or does it actually matter that she's the one calling me out on this?
