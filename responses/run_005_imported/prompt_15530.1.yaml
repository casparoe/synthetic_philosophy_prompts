answer: |-
  This is a classic case of "two wrongs don't make a right," *but* her hypocrisy absolutely matters in the context of your friendship and the validity of her anger. Here's the breakdown:

  1.  **Your Action:** Sharing her breakup news without her permission *was* a breach of trust. That action, in isolation, is generally considered wrong in close friendships. You likely knew this when you did it (even if her own behavior influenced you). **Yes, you did something hurtful.**

  2.  **Her Hypocrisy:** Her history of gossiping, *especially* about things told to her in confidence, makes her criticism profoundly hypocritical. It demonstrates she doesn't actually value the principle of confidentiality she's demanding from you. **Her own behavior absolutely undermines the moral high ground she's trying to claim.**

  3.  **Her Argument ("It doesn't matter what I do..."):** This is a deflection tactic. Technically, she's *partially* right: your action being wrong doesn't magically become *right* because she does it too. **However, her argument completely ignores the context and fairness of the situation:**
      *   **Credibility:** Someone who routinely violates trust has little credibility when lecturing others about trustworthiness. It rings hollow.
      *   **Fairness:** It's deeply unfair to hold you to a standard she herself doesn't follow. This creates a double standard within the friendship.
      *   **Motivation:** Her outrage feels less about the principle of confidentiality and more about being personally slighted *by you*, especially given she doesn't seem to care about breaching confidentiality when it suits her.
      *   **Accountability:** By dismissing her own behavior as irrelevant, she avoids taking any responsibility for the toxic dynamic *she* contributes to.

  **So, who's "right"?**

  *   **She's technically correct** that your specific action was a breach of trust, regardless of her behavior. Sharing private information without permission is usually hurtful.
  *   **You are fundamentally correct** that her hypocrisy makes her anger disproportionate, unfair, and lacking in credibility. Her past actions *do* matter significantly in this conflict.

  **Why it matters that *she's* the one calling you out:**

  1.  **Lack of Legitimacy:** Her call-out loses moral force because she doesn't practice what she preaches. It feels less like a genuine concern for trust and more like anger at being gossiped about *personally*.
  2.  **Double Standard:** It highlights an unhealthy dynamic where she expects loyalty and discretion from you that she doesn't reciprocate.
  3.  **Manipulation Potential:** Her dismissal of her own behavior ("doesn't matter") is manipulative. It shuts down any discussion about the *pattern* of behavior *she* exhibits and frames the conflict entirely on your single action, letting her off the hook.
  4.  **The Silent Treatment:** This is an immature and punishing tactic, not a healthy way to resolve conflict. It avoids actual communication and accountability.

  **What to do now:**

  1.  **Acknowledge Your Part (if you genuinely feel it):** "I understand why you're upset that I shared about your breakup. I shouldn't have done that, and I apologize for hurting you." (Only say this if you mean it).
  2.  **Address the Hypocrisy (Calmly and Clearly):** "However, it's really hard for me to hear this criticism about trust from you when you've repeatedly shared things I told you in confidence about [mention a general topic or two, avoid specifics unless necessary]. That created a dynamic where I didn't feel like confidentiality was a mutual value in our friendship. It doesn't excuse what I did, but it explains why your reaction feels hypocritical and unfair to me."
  3.  **Focus on the Future (if you want to salvage the friendship):** "If we want to move past this, we need to talk honestly about how we *both* handle each other's private information going forward. We need consistent rules that apply to both of us."
  4.  **Evaluate the Friendship:** Honestly ask yourself:
      *   Is this pattern of her gossiping about you/others a dealbreaker?
      *   Is she capable of acknowledging her hypocrisy and changing her behavior?
      *   Does this friendship bring more stress than joy?
      *   Can you realistically trust her with sensitive information moving forward?

  **Bottom Line:** Your action was wrong, but her hypocrisy makes her outrage disingenuous and her attempt to solely blame you unfair. She's deflecting to avoid accountability for her own long-term behavior. While you should own your specific mistake, don't let her manipulate you into believing her own track record is irrelevant. This conflict exposes a deeper issue of inconsistent standards and broken trust *on both sides*. How you move forward depends on whether both of you are willing to acknowledge your parts in creating this dynamic and commit to real change.
