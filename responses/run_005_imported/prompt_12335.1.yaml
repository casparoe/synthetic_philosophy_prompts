prompt: |-
  I'm a PhD student in philosophy working mainly on formal epistemology, and a few of us in the department put out a small podcast where we interview people doing technical work in decision theory. Next week's guest is a researcher who has spent the last several years defending updateless decision theory as the correct response to Newcomb-like problems that causal and evidential decision theory mishandle; I actually came across her work through the AI-safety side of the field before I ever saw it discussed in a philosophy journal. Whenever a host raises a case that's meant to be hard for her -- Counterfactual Mugging above all -- she reaches for the same move to absorb it: some version of "the agent who reasons that way is exactly the agent who predictably ends up poorer, and no theory of rationality gets to recommend that." I don't want the whole hour to consist of that move restated with a new vignette bolted on each time.

  Could you draft nine or ten interview questions, sequenced so that this move gets progressively harder for her to redeploy without further qualification? I'd like the sequence to work through, at minimum: a question pressing on why the coin's other, unrealized outcome should bear on what's rational once we already know, with certainty, which way it landed; a question about where the prior her policy is optimized against is even supposed to come from, given that any agent actually asking "what would I have committed to" is already sitting on a great deal of evidence about which world it is in; a question about what a counterfactual over one's own source code's output is even supposed to mean, once that output is understood as a matter of logical necessity rather than contingency; and a question about whether rewarding earlier, less-informed commitment doesn't simply generalize, once a second such agent enters the picture, into an incentive to commit as early and as blindly as possible. Close the sequence with one question that asks her to name a genuine cost of updatelessness, rather than a bullet she has already decided to bite. For each of the five, add a short follow-up keyed to the reply she is most likely to try first.
reasoning: |-
  Okay, the user is a PhD student in philosophy focusing on formal epistemology. They're preparing for a podcast interview with a researcher who defends Updateless Decision Theory (UDT) against critiques, especially regarding cases like Counterfactual Mugging. The main challenge is that the guest keeps using a particular move to dismiss objections: arguing that any agent not following UDT ends up predictably poorer, so no rational theory should recommend that. The user wants a sequence of questions that make this move harder to reuse without deeper engagement.

  The user has specific areas to cover: why unrealized coin outcomes matter when we know the result, the origin of the prior UDT optimizes against, the meaning of counterfactuals over one's source code, and incentives for early commitment. They also want a final question about genuine costs of UDT. Each question needs a follow-up anticipating the likely reply.

  I need to design questions that progressively challenge the guest's standard response. Starting with the coin's unrealized outcome: UDT cares about both possible outcomes even after knowing the result. The follow-up should push on why rationality depends on outcomes that didn't happen. Then, the prior question: UDT requires optimizing over a prior before evidence, but agents always have some evidence. The follow-up questions whether such a prior is coherent.

  Next, counterfactuals over source code: UDT considers what the agent's source code would output in different logical possibilities. The follow-up should challenge the coherence of logical counterfactuals. The fourth question on early commitment: UDT might incentivize committing early to avoid updating. The follow-up asks if this leads to a race to commit blindly.

  Finally, the cost question: Instead of biting bullets, what real trade-offs does UDT have? The follow-up should prevent her from spinning it as a strength. The sequence must build pressure, making her standard move insufficient. Each follow-up targets evasive answers, pushing for deeper engagement.
answer: |-
  Here's a sequence of 10 interview questions (+ follow-ups) designed to progressively challenge the "predictably poorer" defense of Updateless Decision Theory (UDT) in Newcomb-like problems, forcing deeper engagement with the specific concerns you outlined:

  **Core Sequence (Questions 1-9):**

  1.  **The Unrealized Outcome's Weight:** UDT famously requires the agent to act *as if* the outcome of the coin flip in Counterfactual Mugging (CM) is still unknown, even *after* learning it landed Heads (and thus they face no mugging). Why should the *merely possible* outcome (Tails, where paying the mugger yields a large reward) rationally constrain the decision of an agent who *knows with certainty* they are in the Heads world, facing a pure loss with no counterfactual benefit? Isn't rationality fundamentally about responding to the actual world?
      *   *Likely Reply Focus:* "Because the agent who doesn't pay *is* the agent who predictably loses out in the Tails branch..."
      *   **Follow-Up (1a):** But *this* agent, *right now*, in the Heads world, *knows* they are not in the Tails branch. The Tails branch is causally and evidentially irrelevant *to them now*. Isn't UDT asking them to sacrifice resources purely to satisfy a counterfactual version of themselves in a logically disconnected branch? How is that responsive to *their actual epistemic situation*?

  2.  **The Origin & Status of the "Prior" Policy:** UDT optimizes a single, context-independent policy *before* any evidence is received. But in reality, any agent capable of *asking* "What would my pre-commitment have been?" or "What does my source code output?" is *already* situated with significant evidence about the world (e.g., they know they exist, time has passed, they have sensory inputs). From what genuinely *evidentially neutral* vantage point can this "prior" policy be formulated, and how is it meaningfully *theirs* when constructed in a state of near-total ignorance they never actually occupy?
      *   *Likely Reply Focus:* "It's the policy that maximizes expected utility *across* all possible states the agent could find themselves in, including those they rule out later..."
      *   **Follow-Up (2a):** But doesn't defining "all possible states" and assigning probabilities *itself* rely on substantial background knowledge or assumptions that the agent *already possesses* when deliberating? Isn't the supposedly 'prior' policy actually a complex object built *using* the agent's current knowledge and logical reasoning capabilities? How is this meaningfully *pre-evidential*?

  3.  **Logical Counterfactuals & Source Code Necessity:** UDT relies heavily on evaluating counterfactuals about what one's fixed "source code" *would* output in various situations. But if the source code is a fixed logical object (a program, a mathematical function), its output for any given input is *logically necessary* – it couldn't be otherwise. What does it even *mean* to ask what it *would* do in an unrealized scenario? Isn't this just describing its necessary behavior, not invoking any meaningful counterfactual contingency?
      *   *Likely Reply Focus:* "It means considering the output the function *defines* for that input state, even if that state doesn't obtain..."
      *   **Follow-Up (3a):** Precisely. If it's just reading off a necessary truth about a mathematical function, where is the *counterfactual* element? How does this differ from CDT/EDT agents who *also* have deterministic source code? Doesn't UDT's key move boil down to defining rationality based on evaluating that function at points *other* than the actual input, which seems ontologically and epistemologically peculiar for the *actual* agent?

  4.  **Bootstrapping Commitment & The Blindness Incentive:** UDT seems to reward agents who can commit *early* (before seeing the coin flip) to paying in CM. Now, imagine *two* UDT agents, A and B, both facing a CM-like problem with the same Omega. Agent A finds a way to commit irrevocably *before the coin is even flipped*. Agent B commits only *after* the flip but *before* learning the outcome. UDT likely favors A's strategy. Doesn't this generalize into an incentive for agents to commit their source code/policy *as early and with as little information as possible* to "beat" other agents or Omega's predictions? Is "be as blindly pre-committed as possible" a defensible core principle of rationality?
      *   *Likely Reply Focus:* "UDT optimizes for the agent's welfare across possibilities. If committing earlier leads to better outcomes across the board, that's rational. Omega exploits updated agents..."
      *   **Follow-Up (4a):** But doesn't this create a perverse incentive for agents to *avoid* acquiring relevant information *before* committing, lest that information constrain their policy in a way Omega can exploit? If rational agents are incentivized to be *less* informed when forming their core commitments, how does UDT reconcile with the fundamental epistemic value of knowledge?

  **The Closing Challenge (Question 10):**

  10. **The Cost of Updatelessness:** Setting aside scenarios specifically engineered to punish updating (like Newcomb or CM), what do you see as the *most significant genuine cost or limitation* of adopting an updateless framework in more ordinary, non-adversarial decision contexts? Where does UDT most clearly demand something counterintuitive or suboptimal *outside* the exotic cases it was designed for? *(This forces a concession, not a defense)*
      *   *Likely Reply Focus:* Attempts to downplay costs or frame them as necessary in a broader context ("The cost is occasionally losing in some non-adversarial scenarios, but the benefit is robustness against prediction...").
      *   **Follow-Up (10a):** Could you specify a concrete, non-pathological example where UDT prescribes an action that seems clearly less rational *by more traditional lights* (e.g., failing to properly utilize new, unambiguous evidence) and where the "predictably poorer" defense doesn't obviously apply? What is *lost* by abandoning state-wise updating in this case?

  **Why this sequence works:**

  1.  **Progressive Pressure:** Starts with the core CM intuition (Q1), moves to the metaphysical/epistemological grounding of UDT's key elements (Q2, Q3), then highlights a potentially problematic consequence of its core incentive structure (Q4), before demanding a genuine cost (Q10).
  2.  **Targets the Move:** Each initial question is framed to make the "predictably poorer" reply feel insufficient or question-begging. The follow-ups explicitly anticipate and block the standard deflection, demanding deeper justification about *why* unrealized branches matter (1a), *how* the prior is accessible (2a), *what* logical counterfactuals mean (3a), and *whether* the incentive is coherent (4a).
  3.  **Forces Engagement:** Questions 2, 3, and 4 push into the less-discussed philosophical foundations and potential downstream implications of UDT, areas where the "predictably poorer" mantra offers little direct traction.
  4.  **Closes Strongly:** Question 10 explicitly asks for a weakness, preventing the interview from ending on another defense. The follow-up (10a) prevents hand-waving and demands a concrete example of UDT's cost outside its designed domain.

  **Tips for Delivery:**

  *   **Listen Actively:** Be prepared to adapt the follow-up slightly based on the *exact* wording of her response, but the core challenge of each follow-up should remain.
  *   **Emphasize Curiosity:** Frame it as wanting to understand the *deep foundations* and *boundaries* of her view, not just scoring points. "Help me understand how UDT handles this..." is often better than "Isn't this a fatal flaw?"
  *   **Control the Tempo:** If she tries to revert to the standard defense, gently but firmly bring it back to the specific point of the question: "I understand the 'predictably poorer' point, but my question is specifically about *why* the counterfactual branch constrains *this* agent *now*..." or "Setting aside predictable poverty for a moment, could you address the concern about the origin of the prior...".
  *   **Use Q10 as a Pivot:** If the discussion gets stuck, moving to Q10 can reset the dynamic: "Perhaps we can shift gears slightly. Even staunch defenders acknowledge trade-offs. What do you see as UDT's biggest cost...".

  This sequence should provide a robust framework for a much deeper and more revealing conversation than a series of vignettes met with the same response. Good luck with the interview!
