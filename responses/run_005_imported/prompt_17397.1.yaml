answer: |-
  ## The Kelly Gambit: A Dialogue at the Edge of Ruin

  **Setting:** A quiet bar. KELLY (calm, precise) and VAL (intense, driven) nurse drinks. Between them, a notepad sketches 40 coin flips, 60% heads, even money.

  **Val:** (Leans forward) Twenty percent? *Seriously?* Kelly, the math screams opportunity! This bet is pure gold dust: 20% expected return *per flip*. Betting your measly 20% fraction, your expected final wealth is good... but go all-in every time? Boom! (Stabs the pad) *Expected* final wealth explodes! It dwarfs your safe little strategy. Isn't maximizing expected value the *definition* of rational play? Why kneecap yourself with timidity?

  **Kelly:** "Timidity" is a value judgment, Val. It's about optimizing the *growth rate* of wealth, not its *expected final value*. The ensemble average you worship – averaging outcomes across infinitely many parallel universes – diverges from the time-average growth a single agent experiences. That’s the ergodicity break. My 20% maximizes the *geometric mean* growth per bet. It ensures my wealth compounds optimally along my *single path* through time.

  **Val:** (Waves dismissively) "Ensemble average," "time-average"... fancy words! So what if the ensemble average is dominated by vanishingly rare paths where I win every flip? They *exist*, they contribute massively to the expected value, and that EV is *objectively higher* than yours! Why should I care that *my* specific path might go bankrupt? That's the cost of admission for those stellar outcomes! Rationality is about maximizing expected payoff, full stop. Your "almost surely" beats me in the long run? Great! But in *expectation*, I crush you after 40 flips, or 400, or 4000. Prove that expectation isn't king.

  **Kelly:** Because expectation *isn't* king when the process isn't ergodic for linear wealth. Consider your all-in strategy. After 40 flips, what's the *median* outcome? Ruin. Near-certain ruin. The *probability* of ending with more than your starting stake is tiny. That astronomically high EV? It’s almost entirely carried by the probability-weighted value of the *single* path where you win all 40 flips – a probability of (0.6)^40, roughly 1 in 13 *trillion*. In the other 13 trillion minus one paths? You’re busted.

  **Val:** (Eyes gleaming) Exactly! And that one path? It’s *worth* it! Multiply that payoff by its tiny probability – it still drags the *expected* value way above your steady plodding. Why optimize for the boring median when the *mean* is stratospheric? You’re confusing prudence with rationality. EV is the compass.

  **Kelly:** But can you *access* that mean, Val? Can you *experience* it? Ergodicity asks: What happens to *one* system over time? For your all-in strategy, the overwhelming *time-average* outcome for a single player is ruin. The ensemble average (EV) is high only because we average *across* countless ruined players and a few obscenely lucky ones. But *you* only get one sequence. You don’t get to average across universes. You get *one* trajectory. My strategy optimizes the growth rate along *that* single trajectory. It avoids ruin almost surely, ensuring my wealth grows *exponentially* at the maximum possible *rate* for my path. Your strategy, for any *individual*, almost surely leads to ruin, meaning their *time-average growth rate is negative infinity*.

  **Val:** (Pauses, frowning slightly) So... you're saying maximizing EV *here* is irrational because it's optimizing for a multiverse average I can't access? That the *sustainable* growth for *me*, right here in this chair, is what matters? That the ensemble mean is a phantom for a single player?

  **Kelly:** Precisely. The Kelly fraction, 20%, maximizes the *expected logarithm* of wealth. This translates directly to maximizing the *long-run exponential growth rate* of your single bankroll. It’s the fraction where the ensemble average of the *growth rate* aligns with the time-average growth rate – it *restores* ergodicity for multiplicative growth. Betting more might juice the ensemble EV, but it *reduces* your expected growth rate per bet and introduces ruin risk. Betting less also reduces your growth rate. 20% is the ergodic optimum.

  **Val:** (Leans back, swirling his drink, a reluctant respect dawning) Hmph. So the "expected value" I'm chasing is a siren song. It promises riches averaged across ghosts, while guaranteeing *my* ghost joins the choir invisible almost every time. And your boring 20%... it's the only bet that actually maximizes what *I* can reliably accumulate on *my* journey through time? The growth I can *live*?

  **Kelly:** (Nods) Exactly. Maximizing expected *terminal* wealth when wealth multiplies isn't rational for a single player. Maximizing expected *log* wealth is. It’s the compass calibrated for your actual path, not the average of all possible shipwrecks and one gilded yacht.

  **Val:** (Sighs, a small smile) Damn you, Kelly. Pour me another. Maybe we calculate that 20% again... just to be sure. But I still hate how boring winning looks.

  **Kelly:** (Smirks) Boring beats busted. Almost surely. Cheers.
