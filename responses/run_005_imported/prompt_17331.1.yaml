  So in my ethics elective we spent this whole week on just war theory and I got kind of stuck on this one part called the "moral equality of combatants" thing, and my teacher never really resolved the debate before we moved on so it's been bugging me since. Basically the traditional view (Walzer's, from Just and Unjust Wars I think) is that a soldier fighting on the unjust side of a war isn't doing anything more wrong than a soldier on the just side, as long as both of them stick to the actual rules of fighting -- don't target civilians, don't execute POWs, etc. The whole point is that whether your war is justified (jus ad bellum) is supposed to be a completely separate question from whether you're fighting it in a permissible way (jus in bello), so an ordinary soldier on the "bad" side isn't a murderer just becuase their government started the war unjustly.

  But then my teacher mentioned theres a bunch of philosophers, mainly McMahan (and I think Rodin too?) who basically reject this whole thing and argue that soldiers fighting for an unjust cause are actually liable to be killed in a way that just-cause soldiers aren't, kind of like how an attacker in ordinary self-defense law doesn't get to claim self defense against the person defending themselves. And apparently there's people who bite back against THAT too, saying something like equality between combatants might still be necessary as a kind of legal/social convention even if it's not literally true at some deeper level, or even that it's grounded in something like an actual contract between soldiers/states and not just a useful fiction -- I don't remember the names, sorry. I tried reading a tiny bit about it on my own and got totally lost between "liability" vs "justification" vs "excuse" as different technical terms, which all seem to matter a lot here but I can't keep straight.

  Could you write me a proper essay (not just bullet points) that actually lays out the strongest version of each side of this fight, explains the distinctions i'm fuzzy on along the way, and then actually lands on a verdict instead of ending on some wishy-washy "there are good points on both sides" note? Like, I want you to actually commit -- does the moral equality of combatants survive the revisionist critique, does it collapse completely, or is there some more specific middle position (e.g. equality holds for blame but not for justification, or something like that) -- and back it up properly. This isn't for a grade, I just want to actually get my head around it since we never settled it in class.
