  ## The Moral Equality of Combatants: Tradition Under Siege and the Case for Convention

  The doctrine of the Moral Equality of Combatants (MEC) stands as a cornerstone of traditional Just War Theory (JWT), most famously articulated by Michael Walzer in *Just and Unjust Wars*. It posits a profound separation: soldiers fighting on either side of a conflict, provided they adhere to the laws of war (*jus in bello* – governing conduct *within* war, like distinction and proportionality), share an equal moral status. A Wehrmacht soldier fighting defensively on the Eastern Front in 1943, obeying the rules, is not inherently committing a greater *moral wrong* by merely fighting than an Allied soldier storming Normandy. Walzer grounds this in the idea of soldiers as "moral equals" due to their shared condition: they are coerced instruments of their state, subject to its authority and conscription, fighting a collective battle where individual culpability for the war's initiation (*jus ad bellum* – justice *of* going to war) is largely absent. The separation of *ad bellum* and *in bello* is thus absolute. Responsibility for the unjust *cause* rests solely with political leaders; soldiers are judged only on their *conduct*. This separation serves a crucial practical purpose: it allows for reciprocal application of the laws of war, facilitating humane treatment of prisoners and limiting atrocities, even amidst an unjust aggression.

  **The Revisionist Onslaught: McMahan and the Collapse of Separation**

  Jeff McMahan, leading the "revisionist" charge alongside thinkers like David Rodin, launches a devastating critique from the perspective of individual moral liability. He argues that Walzer's separation is incoherent and morally unsustainable. McMahan contends that the justification for killing in war (*jus in bello*) *cannot* be independent of the justice of the war itself (*jus ad bellum*). His core analogy is illuminating: ordinary self-defense law.

  1.  **The Self-Defense Analogy & Liability:** In a mugging, the mugger (unjust aggressor) poses an unjust threat. The victim (just defender) has a right to use necessary force, including lethal force, to defend themselves. Crucially, the mugger **lacks a right of self-defense** against the victim's defensive force. He is **liable** to be killed because his own unjust action has forfeited or overridden his right not to be harmed. Conversely, the victim retains their right of self-defense; they are **not liable** to be killed by the mugger. McMahan applies this logic directly to war: soldiers fighting for an *unjust cause* are, like the mugger, posing an unjust threat. They are therefore **liable** to defensive or preventive harm by soldiers fighting for the *just cause*, who are analogous to the victim defending themselves. Soldiers on the just side, posing only a *just* threat, are **not liable** to be killed in the same way. Their killings are justified, while killings by unjust combatants are, at best, excusable (see distinctions below).
  2.  **Rejection of Moral Equality:** This framework utterly demolishes MEC. The unjust combatant, by participating in an unjust war (even if following *in bello* rules), is fundamentally engaged in a wrongful activity – imposing violence without just cause. Their adherence to *in bello* rules might mitigate their *personal culpability* or make their actions *excusable* under duress, but it does not make their participation *morally permissible* or grant them a right to kill just combatants. Their moral status is inherently lower because their very role is morally tainted by the unjust cause. The separation of *ad bellum* and *in bello* collapses; the justice of killing *in* war depends fundamentally on the justice *of* the war.
  3.  **"Justification" vs. "Excuse" vs. "Liability": Clarifying the Terms**
      *   **Liability:** This refers to *moral status*. If someone is liable to be harmed, it means they lack a right *not* to be harmed in that specific context, typically because their own actions have forfeited that right. They are a *legitimate target*. (McMahan: Unjust combatants are liable; just combatants are not).
      *   **Justification:** An action is *justified* if it is morally *permissible* or even *right* under the circumstances. It is the *act* that is sanctioned. (McMahan: Killing by just combatants against liable unjust combatants is justified. Killing by unjust combatants, even against liable just combatants? *Not justified*, as their overall enterprise is unjust).
      *   **Excuse:** An action might be *wrong* (unjustified), but the actor is not fully *blameworthy* for performing it due to mitigating factors like coercion, ignorance, or duress. The *act* is still wrong, but the *agent* is less culpable. (McMahan: An unjust combatant following *in bello* rules might have an *excuse* for fighting, reducing their *blameworthiness*, but their killing acts remain *unjustified* because they lack the just cause. They are still liable).

  **The Defense of Tradition: Convention, Pragmatism, and Moral Necessity**

  Faced with McMahan's compelling logic, defenders of a form of MEC don't deny its theoretical force but argue that abandoning the doctrine in practice would be disastrous and that there are deeper moral reasons for upholding it as a *convention*.

  1.  **Epistemic Limitations & Reciprocity (Hugo Grodin, Henry Shue, Seth Lazar):** Soldiers on the ground often lack the capacity to reliably judge the *ad bellum* justice of their own cause, let alone the enemy's. Propaganda, fog of war, and complex geopolitics cloud judgment. If soldiers believed they fought for the just side and the enemy was liable, it would incentivize ruthless prosecution of the war, demonization of the enemy, and rejection of reciprocal restraints ("Why give quarter to murderers?"). Maintaining MEC as a *convention* – a mutually agreed-upon rule – is essential for sustaining the fragile framework of *in bello* constraints. It fosters the minimal trust needed for surrender, POW treatment, and medical care. Abandoning it risks a descent into total war.
  2.  **The "Instrumental" Justification:** Some argue MEC isn't a deep moral truth but a *morally necessary fiction*. Recognizing the epistemic fog and the paramount importance of limiting wartime suffering, we *treat* combatants as moral equals *as if* they were, *regardless* of underlying liability, because the consequences of not doing so are morally worse. It's a pragmatic moral choice to save lives and preserve civilization amidst chaos.
  3.  **The "Contract" Argument (Grotian echoes):** While less prominent, some suggest a quasi-contractual basis. By becoming soldiers and accepting the role, combatants implicitly enter a reciprocal agreement governed by the laws of war. Their moral equality stems from this shared role and the reciprocal duties and immunities it entails, bracketing the *ad bellum* question for the sake of mutual survival under rules. Their status is defined by their function, not the cause they serve.
  4.  **Focus on Conduct, Not Cause:** Defenders emphasize that judging soldiers primarily on their *conduct* (Did they target civilians? Torture POWs?) is the only feasible and morally salient standard applicable *to them*. Holding them individually responsible for the complex geopolitical decision to go to war is unfair and unworkable. Their immediate moral duty is to fight *well* (within the rules), not to adjudicate the war's ultimate justice.

  **The Verdict: Moral Equality Stands (Barely) as a Necessary Convention, Not a Deep Truth**

  McMahan's revisionist critique lands a devastating blow to the *deep moral truth* of the Moral Equality of Combatants. **He is fundamentally correct:** At the level of abstract, individual moral liability, grounded in principles like self-defense, a soldier fighting for an unjust cause *is* participating in a collective moral wrong. They are posing an unjust threat and are therefore liable to defensive harm in a way that a just combatant is not. Their killings lack the same fundamental justification. The complete separation of *jus ad bellum* and *jus in bello* cannot withstand rigorous moral scrutiny; the justice of the cause *does* permeate the moral status of the actors within the conflict.

  **However, the MEC doctrine does not collapse entirely. It survives, battered but essential, as a morally necessary *convention*.** The revisionist position, while theoretically purer, founders on the rocks of human fallibility and the catastrophic potential of asymmetric moral judgments in warfare. The epistemic barriers to soldiers reliably discerning true *ad bellum* justice are immense. Abandoning MEC would almost certainly lead to:

  1.  **Erosion of *Jus in Bello*:** Each side, convinced of its own righteousness and the enemy's inherent liability, would feel justified in disregarding restraints. Why treat "murderers" humanely? Why avoid harming civilians if the enemy soldiers are legitimate targets *only* because they fight for an unjust regime? Reciprocal adherence to the rules would collapse.
  2.  **Increased Atrocity & Brutality:** The demonization inherent in seeing the enemy as uniquely liable criminals would fuel hatred and remove psychological barriers to torture, summary execution, and total war tactics.
  3.  **Perverse Incentives:** Unjust aggressors, knowing their soldiers are seen as liable criminals regardless of conduct, would have *less* incentive to impose *in bello* restraints, leading to worse outcomes overall.

  Therefore, **the verdict is this:** The Moral Equality of Combatants, understood as a deep metaphysical or individual liability-based truth, does *not* survive McMahan's critique. It is false. **But,** the *functional principle* of treating combatants symmetrically under the laws of war – acting *as if* they possess moral equality regarding their status as legitimate targets and their obligations under *jus in bello* – is a morally indispensable convention. It is a pragmatic, second-best solution demanded by the realities of war, the limits of human knowledge, and the paramount importance of mitigating suffering. We uphold it not because it reflects a fundamental equality of moral desert concerning the *cause*, but because rejecting it would unleash far greater moral horrors than it contains.

  **This is not wishy-washiness; it is a hard-nosed moral choice.** We accept a theoretical inconsistency – treating liable and non-liable agents symmetrically in practice – because the alternative is practically and morally catastrophic. The MEC, as a governing *convention* for the conduct of hostilities, remains essential for the preservation of any semblance of humanity in war, even if its foundations in deep individual morality have been irrevocably shaken. We judge soldiers primarily on *how* they fight, recognizing that judging them definitively on *why* they fight is often impossible and always perilous. The convention stands, not as truth, but as a vital shield against the abyss.
