answer: |-
  ## Coffee & Conditionals: A Post-Seminar Debate
  *(The scene is a university cafe, cluttered with empty mugs and seminar notes. CALLISTA, sharp-eyed and gesturing emphatically, sips espresso. MARTIN, leaning back with a skeptical frown, stirs his tea. They've just left a seminar on David Lewis's triviality results for indicative conditionals.)*

  **Callista:** ...so Lewis showed that *if* conditionals express propositions whose probability *always* equals the corresponding conditional probability – the Equation, P(A > C) = P(C | A) – *and* if we assume standard probability kinematics, then conditionals must be *trivial*. Their probability must be 1 or 0, or they collapse into the consequent. Absurd! But Stalnaker’s escape hatch is elegant: the proposition expressed by "If A, C" *shifts* with context, particularly with the salient possibilities or the agent’s credence state. The Equation holds *relative to a context*, not universally. It’s not one rigid proposition being tortured by every conceivable probability function.

  **Martin:** Elegant, Callista? Or just elaborate evasion? Adams and Edgington saw the real lesson: Lewis exposed a *category error*. We’re trying to force conditionals into propositional straightjackets when they simply don’t belong. "If it rains, the match will be cancelled" doesn’t express a proposition about the world with a truth value waiting to be found; it expresses a *conditional attitude*. Its assertability *is* P(C | A). Full stop. Trying to save propositionality by making content float on a sea of credence just moves the bump under the rug. The triviality demon haunts any *single* context where you try to apply the Equation universally to *all* probability functions defined over that context’s fixed domain. Your contextual shift doesn’t banish it; it just tells it to only haunt one room at a time.

  **Callista:** Moving the bump? Hardly! It dissolves it by recognizing context-sensitivity, something we do for quantifiers, modals, gradable adjectives… Why not conditionals? But let’s press *your* bump: embedding. If "If A, C" isn’t truth-apt, what on earth is "It is not the case that if A, C"? Or worse, "If B, then if A, C"? What is being negated or conditioned upon? You deny it has truth conditions, so negation seems meaningless. And nesting? That looks like a complex proposition crying out for compositional semantics your view denies it.

  **Martin:** Adams and Edgington have paths, even if they’re less traveled by truth-conditional semantics. Negating "If A, C" typically expresses a *different* conditional attitude: high credence that *not-C* given A. "It’s not true that if I go, she’ll be angry" isn’t asserting some mysterious negative fact; it’s expressing that *given I go*, she probably *won’t* be angry. As for nesting, "If B, then if A, C" expresses a *conditional* conditional attitude: roughly, high conditional credence in C given (A and B). It’s about the *constraint* on my credences, not a truth-evaluable content about the world. The assertability of the whole complex tracks P(C | A & B).

  **Callista:** "Expresses an attitude," "expresses a constraint" – that feels like hand-waving the semantic structure! Compositionality demands *inputs* for operators like negation and 'if'. If the embedded "if A, C" provides no truth-apt input, what is negation *operating* on? Your "different attitude" story seems like a semantic kludge to mimic what truth-conditional semantics handles systematically. And what about belief *reports*? "John believes that if A, C." If John doesn’t believe a proposition, what *does* he believe? A constraint? How does *that* fit into a standard theory of belief as a propositional attitude?

  **Martin:** Perhaps standard theories of belief need refining for conditionals! Or perhaps "John believes that if A, C" reports that John has a high conditional credence in C given A. It’s reporting his cognitive state regarding the connection, not a standalone belief in a truth. But let’s turn your contextual escape back on you, Callista. Isn’t making the *semantic content itself* hostage to the speaker’s (or assessor’s?) *credence* incredibly ad hoc? Stalnaker needs the proposition expressed to shift precisely so that *in that specific context*, for *that specific probability function*, the Equation holds. That looks suspiciously like defining the proposition *just* to satisfy the probabilistic constraint you need to avoid triviality. You’re rescuing the Equation by making the propositional content *epiphenomenal* to the credence! Is that principled semantics or just a clever salvage operation?

  **Callista:** Ad hoc? No more than fixing the domain for "every bottle" depends on context! The context, including the salient possibilities and relevant information state, *determines* which possible worlds are in play and how they are partitioned. This fixes the proposition expressed by "If A, C" – typically the selection of the closest A-worlds where C holds. *Given that context*, the probability of *that specific proposition* just *is* the conditional probability P(C | A), because the probability measure is defined over the same space of possibilities made salient by the context. The content isn’t *defined by* the credence; both content and credence are anchored to the *same contextual parameters*. The Equation holds *relative to a coherent setup*, not by fiat.

  **Martin:** But Lewis’s proof targets that very setup! Suppose we fix a context, Callista. We have a fixed domain of worlds, a fixed selection function defining the proposition for "If A, C" in that context. Now apply Lewis’s construction: find probability functions that treat A and C in specific, conflicting ways. If the Equation *must* hold for *every* such probability function defined over *this fixed domain* with *this fixed proposition for the conditional*, Lewis shows it leads to triviality. Your contextual shift avoids this by saying "Ah, but *that* probability function, with its weird weighting, would shift the context, so the proposition expressed changes!" But that means the proposition isn’t truly *fixed* by the initial contextual parameters alone; it’s hyper-sensitive to the very credence state applied to it. The content is unstable under probabilistic pressure. That doesn’t feel like robust, shareable propositional content; it feels like content dissolving into credence.

  **Callista:** It’s stable under *reasonable* variations within a coherent context! Lewis constructs pathological probability functions designed to break things by treating A as both highly probable and evidentially irrelevant to C in bizarre ways. These functions don’t represent *rational* or *salient* credence states *within the original context*. Invoking them *forces* a contextual shift because they violate the presuppositions or relevance structure of the original utterance. The proposition is fixed relative to a coherent epistemic perspective. Demanding it satisfy the Equation under *any arbitrary* probability measure, even one that disrupts the context itself, is asking too much. The triviality proof shows conditionals *can't* be rigid, context-insensitive propositions satisfying a universal Equation. Stalnaker accepts that and builds a semantic theory where their context-sensitivity *explains* why the Equation holds where it matters – in actual, rational use.

  **Martin:** And we non-propositionalists think that "actual, rational use" is best explained *without* invoking truth-conditional content at all. The Equation holds *by definition* for us: assertability *is* conditional credence. We don’t need contextual acrobatics to save a propositional ghost. When you embed or negate, we provide pragmatic or quasi-semantic rules that capture the communicative function. It might be less familiar than truth tables, but it avoids the specter of content that morphs to avoid probabilistic contradiction. Your contextual Stalnakerian propositions are elegant phantoms, Callista, but they still dance to the tune of the triviality results, just on a shifting stage.

  **Callista:** And your attitudes are ghosts that vanish when we try to pin them down with logic or embedding, Martin. They lack the substance to interact systematically. My shifting stage is the real world of context-dependent language. The dance is coherent, even if the floor moves.

  **Martin:** *(Sighs, finishes his tea)* Agree to disagree, then. Until the next triviality seminar? I hear there’s one on probabilistic validity…

  **Callista:** *(Smiles wryly)* I’ll bring my context-sensitivity. You bring your… attitude adjusters. May the best conditional win. *(She taps her empty espresso cup.)* Another round?

  **Martin:** Only if you admit the probability it’s good is high *given* we’re in this cafe.

  **Callista:** Touché. But I assert it categorically: the coffee here *is* good. Proposition expressed, truth value: true. See? Some things *are* simple.

  **Martin:** *(Chuckles)* Point taken. But only because you shifted the context away from conditionals. One coffee, then. Black. No ‘ifs’.
