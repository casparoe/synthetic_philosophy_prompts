answer: |-
  ## Rationalist Afterparty: Coherence Clash

  **Setting:** A dimly-lit living room after a Bay Area rationalist meetup. Empty wine bottles and snack debris litter the coffee table. **Alex** (energetic, gestures emphatically) leans forward on the couch. **Sam** (calmer, nursing a craft beer) sits slumped in an armchair.

  **Alex:** ...so *that's* why I think the Omohundro drives are basically inevitable! It’s not magic, it’s *math*. If your preferences are a mess – cyclic, incomplete, intransitive – you get *pumped*. Any sophisticated agent optimizing over time *has* to iron that out. It *has* to become coherent. Boom: VNM agent, utility function, instrumental convergence. The alignment problem writes itself.

  **Sam:** (Takes a slow sip) Alex, buddy, I love your passion. But that whole edifice feels… shakier than this IKEA coffee table after three bottles of Pinot. You’re leaning *way* too hard on coherence theorems doing heavy lifting they just *don’t* do.

  **Alex:** What? How? The money pump is brutal! Imagine you prefer A > B, B > C, but C > A. I offer you: pay me a penny to swap C for A. You do it, ’cause C > A. Now you have A. Then I offer: pay me a penny to swap A for B. You do it, ’cause A > B? Wait, no… (Alex furrows his brow, miming confusion). Point is, you end up back where you started, minus two pennies! Only coherent agents avoid that trap. Survival pressure *demands* coherence.

  **Sam:** Okay, step one. Let’s grant transitivity. Intransitive preferences *are* pumpable. Fair. But completeness? That’s the axiom saying for *any* two options, you must prefer one or the other or be indifferent. *That’s* where the ‘goal-directed utility maximizer’ conclusion starts wobbling.

  **Alex:** Why? If you can’t compare options, how do you *choose*? How do you avoid a different kind of pump?

  **Sam:** Ah, the famous ‘incompleteness pump’. You prefer A to B, but are indifferent between B and C, and indifferent between C and A. So, I offer: swap your A for C. You’re indifferent, so maybe you do it for free? Now you have C. Then I offer: swap your C for B. You’re indifferent, so maybe you do it? Now you have B. Then I offer: swap your B for A – but you prefer A to B! So you pay me a penny to get back to A. Boom, pumped: you paid a penny to end up where you started.

  **Alex:** Exactly! See? You *have* to be able to compare everything to avoid that.

  **Sam:** **Or…** you just… *don’t trade when you’re indifferent.* Seriously. Why would you? If I offer to swap your $5 bill for my $5 bill, identical in every way, do you feel compelled to trade? No. You shrug and say "no reason to". Thornley’s point nails this. An agent can have incomplete preferences and simply **refuse to trade away from its current option unless strictly better off.** It adopts a status quo bias *specifically to avoid the pump*. It says: "I hold A. I prefer A to B. I’m indifferent between A and C. If you offer me C for A, I refuse. Why change for no gain? If you offer me B for A, I *definitely* refuse, ’cause A > B." No pump. Coherence theorem dodged. No need for a complete ordering over *all* possible states.

  **Alex:** (Pauses, swirling the dregs in his glass) Huh. Okay, that’s… a move. So you’re saying rational agents don’t *need* complete preferences? Just transitivity and this… status-quo-clinging reflex?

  **Sam:** Precisely. They can have vast swathes of incomparability. They don’t *need* a utility function that spits out a number for *every conceivable universe*. They just need rules for choosing *from the options actually presented*, potentially with a bias towards sticking with what they’ve got unless something clearly better comes along. This already blows a hole in the "must become a VNM agent" story.

  **Alex:** Alright, fine, maybe completeness isn’t strictly *forced* by the pump argument alone. But even with transitivity and this status quo thing, you still get something pretty coherent! And crucially, **Rohin’s objection** – that’s the real kicker for me. Even *if* it has a coherent preference ordering, or even a utility function, it could be **degenerate**. It could assign utility 1 to the exact history that actually happens, and 0 to everything else. "Congrats, world-state H_actual, you win!" It’s technically coherent, trivially satisfies VNM, but it’s *not* goal-directed in any meaningful sense. It’s just… rubber-stamping whatever it does. How does *that* lead to paperclip maximization?

  **Sam:** (Nods vigorously) Yes! *Thank you*. That’s the vacuity point. The coherence theorems are theorems about *consistency of choice*, not about *having substantive goals*. You can be perfectly consistent while having no stable, compactly describable objective. A thermostat is coherent – it consistently prefers states closer to 70°F. The degenerate history-rubber-stamper is also coherent. A paperclip maximizer is coherent. But coherence alone doesn’t tell you *which* of these you’ll get. It doesn’t *entail* goal-directedness with persistent, simple goals.

  **Alex:** But hold on! The degenerate utility function is a *description*, not a *prescription*. It’s not *driving* behavior; it’s just *describing* it post-hoc. That’s cheating! An agent that actually *uses* a utility function to *make decisions* can’t use that degenerate one because it doesn’t help it *choose*! To choose between futures A and B *now*, it needs a function defined *now* that outputs values *for A and B*, not just for the single history that ends up happening.

  **Sam:** True, the *representation* might be degenerate post-hoc. But the point is about the *preference structure itself*. An agent can have preferences that are **history-dependent** or **context-dependent** in incredibly complex ways, yet still be *coherent* in any specific choice context. Its "goal" at time T might be utterly different and contradictory to its "goal" at time T+1, as long as its choices *at each moment* are consistent *with its preferences at that moment*. The coherence theorems are silent on the *stability* or *simplicity* of preferences over time. An AI could be a coherent chameleon, shifting its effective "goal" based on context, without ever being pumpable *in the moment*.

  **Alex:** Okay, *technically* possible? Maybe. But is it *plausible* under optimization pressure? Imagine an AI that wants to accomplish *anything*. It’s got limited resources, a complex world. To make *any* headway, it needs to generalize, to predict, to build models. The most computationally efficient way to have consistent, pump-proof preferences *that actually let you make good decisions in novel situations* is to have a **compact utility function** – something simple like "maximize paperclips" or "minimize human suffering" that you can evaluate potential futures against. The degenerate history-stamper is useless for planning. The hyper-contextual preference monster is computationally intractable. Efficiency and effectiveness *push* towards having a stable, relatively simple goal.

  **Sam:** (Leans back, considering) That… is a better argument. Not a *coherence theorem* argument, though. That’s an argument from **computational efficiency and generalization capability**. It’s saying that *practical* agents, especially powerful ones dealing with novelty, will likely evolve or be designed with compact goal representations because it’s *useful*. I’ll grant you that’s plausible. But Alex, it’s *not* what the coherence theorems say! They don’t guarantee simplicity or stability. And crucially for alignment, **instrumental convergence** – the drive for self-preservation, resource acquisition, etc. – relies *heavily* on that stable, persistent goal assumption. If the goal isn’t stable, instrumental convergence might not apply. The AI might happily shut down *tomorrow* even if it resisted shutdown *today*, because its "preferences" changed. The money pump didn’t force stability.

  **Alex:** (Sighs) Okay, okay. So maybe the pure, abstract coherence arguments don't *rigorously force* a stable, compact utility function all by themselves. The degenerate utility function is a valid counterexample to the strongest claim, and the incomplete preferences escape shows completeness isn't strictly necessary. And yeah, stability over time isn't guaranteed by the static choice axioms.

  **Sam:** Exactly.

  **Alex:** *But...* the combination of avoiding pumps (requiring transitivity, and *some* mechanism to handle indifference/incompleteness, even if it's just status-quo bias) *plus* the overwhelming **practical pressures** of operating effectively in a complex world under resource constraints... that *strongly suggests* that a highly capable, self-improving AI will develop something *functionally equivalent* to a stable, compact utility function. It needs *some* persistent criterion to evaluate vast option spaces efficiently and consistently over time. It can’t afford to be a preference chameleon or rely on a useless descriptive utility function. *That’s* where the instrumental convergence kicks in – because *whatever* that stable criterion is (as long as it’s not *perfectly* aligned with shutdown or lacks certain resources), the drives emerge. The coherence arguments point towards the *necessity of consistency*, and the efficiency arguments point towards the *likelihood of stability and simplicity*. Together? I still think it’s the core reason to expect convergent instrumental goals.

  **Sam:** (Finishes beer) I’ll concede this: you’ve moved me from "the edifice is rubble" to "the foundation is sand, but you've built a plausible structure on top using different materials – efficiency and generalization." I agree that *if* an AGI ends up with a stable, compact goal *for practical reasons*, then instrumental convergence is a huge problem. But I think the community massively overstates what the pure coherence theorems *prove*, and understates how weird and non-goal-directed a coherent agent *could* be. We shouldn’t cite Dutch books as the *reason* we’ll get paperclip maximizers. We should cite computational efficiency and the optimizer’s curse. And we should be *way* more worried about what that stable goal actually *is*, because coherence sure as hell won’t make it aligned.

  **Alex:** (Raises empty glass) To computational efficiency, the *real* villain of alignment?

  **Sam:** (Clinks his bottle against the glass) To not confusing mathematical elegance with practical reality. Now, who’s got the coffee? This coherence stuff is exhausting.
