  We are ranking strategies for repairing the Principal Principle in light of the undermining problem. The Principal Principle (PP) states that one's credence in an event, conditional on the chance of that event being x and on any admissible background information, should be x. The undermining problem arises in Humean accounts of chance (like Lewis's best-system analysis) because the chances are determined by the entire pattern of events, including the future. Thus, an improbable sequence of events could make the chance theory false, leading to a contradiction: the chance theory assigns a low probability to the very sequence that would make it true.

  We are to rank at least six strategies from most to least successful, where success means preserving a substantive, non-circular link between credence and chance. The tiers are S (best), A, B, C, D, F (worst). We name the philosopher(s) chiefly associated with each strategy.

  Here are some prominent strategies and their associated philosophers:

  1. **New Principle (NP) / Conditional Principal Principle**: This strategy, proposed by Lewis and developed by Hall, modifies the PP by conditioning on the entire theory of chance. The idea is to set credence in A equal to the chance of A conditional on the chance theory T. Formally: Cr(A | T) = T(A | T). This avoids the undermining problem because the chance of the undermining future is conditioned on T. (Lewis, Hall)

  2. **Historical Principal Principle (HPP)**: Proposed by Arntzenius and Hall, this strategy restricts the chance to the past and present. The chance at a time t is determined by the history up to t, and the PP applies only to events that are about the future relative to t. This avoids the undermining problem because the future does not affect the chance at t. (Arntzenius, Hall)

  3. **Non-Humean Accounts**: Some philosophers (e.g., Bigelow, Pargetter) reject the Humean account of chance and instead adopt a non-Humean metaphysics where chances are primitive and not reducible to patterns. This avoids the undermining problem because chances are not defined by the entire history. (Bigelow, Pargetter)

  4. **Self-undermining chances**: Lewis himself considered allowing self-undermining chances and modifying the PP to apply only when the chance theory is not undermined. However, this leads to a weakened PP that might be inapplicable in many cases. (Lewis)

  5. **Chance as Analyzed by the Best System for an Agent**: This approach, associated with Ismael, suggests that the best system for an agent is one that maximizes the balance of simplicity, strength, and fit relative to the agent's epistemic situation. This makes chance relative to the agent and avoids the global undermining. (Ismael)

  6. **Typicality Approaches**: Some (e.g., Schaffer) propose that we should condition on typicality. The idea is that we are typical observers and thus should expect to see typical outcomes. This might avoid the undermining problem by assuming we are not in an atypical part of the universe. (Schaffer)

  7. **Indexical Account of Chance**: Proposed by Thau, this strategy separates chance from credence by introducing an indexical element. However, this approach has been criticized for being too weak. (Thau)

  8. **Rejecting the Humean Account**: Some philosophers (e.g., Maudlin) argue for a non-Humean account of laws and chances, which would avoid the undermining problem from the start. (Maudlin)

