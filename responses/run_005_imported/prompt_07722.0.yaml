  Okay, let me unpack this. The user is a retired population geneticist diving into teleosemantics via a philosophy reading group. Their core concern isn't the usual Swampman/disjunction objections but rather whether "proper function" can bear the weight teleosemantics places on it, given biological realities like drift, exaptation, and pleiotropy. They've drafted a critique and want feedback before sharing it.

  First, I need to verify their understanding of Millikan. They're spot-on about the historical requirement and derived functions, but might underappreciate how "Normal explanations" handle exaptation. Millikan's framework allows functions to emerge from how systems *should* operate based on evolutionary design, even if the trait wasn't originally selected for that role. Still, the user rightly points out that this relies on speculative historical inferences.

  Their population genetics lens reveals a genuine gap: teleosemantics assumes we can cleanly isolate selection histories, but biology shows traits often have messy, layered origins. This *is* distinct from disjunction problems—it's not about multiple candidate contents but whether there's *any* determinate function to interpret. A frog's fly-detector has a clear history; human abstract reasoning likely doesn't.

  Possible replies? A Millikan defender might argue that derived functions cascade through learning or cultural evolution, but that risks circularity (what grounds *those* functions?). Neander could emphasize design evidence over history, yet that veers toward non-historical theories. Ultimately, teleosemantics might need to concede limited scope, which undermines its ambition as a general theory of representation.

  The user's worry stands: for complex cognition, the required historical facts may be inaccessible or nonexistent. Their expertise lets them spot this in ways philosophers might miss. I should affirm their critique while suggesting nuanced counterarguments—they'll want steelmanning, not just agreement.
answer: |-
  Your critique cuts straight to the deep tension between philosophical idealization and biological granularity. You haven't embarrassed yourself; you've identified a legitimate and underdiscussed vulnerability in teleosemantic foundations. Let's break this down point by point.

  ### 1. Your Grasp of Millikan's Apparatus
  You've captured the core correctly. Millikan's "proper function" *is* irreducibly historical and relies on selection *for* F. Regarding **derived proper functions**, you're right about their primary role for token states (e.g., *this* beaver dam, *your* belief about rain). However, they *do* extend further through her concept of "Normal explanations" (capital N, meaning the historically explanation supporting survival/reproduction). When a novel capacity emerges (e.g., feathers used for flight), it can acquire a *new* proper function *if*:
  - Its performance of F contributes to fitness *now*,
  - This performance relies on the same underlying mechanisms that had a prior proper function (e.g., feather structure shaped by thermoregulation),
  - And crucially, *selection begins acting on F itself*.

  Where derived functions hit their limit is precisely where you point: **indeterminate historical scaffolding**. If a cognitive capacity (e.g., probabilistic reasoning) arises from:
    - **Pleiotropy**: Selection for spatial navigation enhances general inference.
    - **Exaptation**: Ancient threat-detection circuits repurposed for social prediction.
    - **Drift/Culture**: Neutral variation amplified by cultural transmission.
  ...then pinning down *the* proper function becomes biologically implausible. Millikan's machinery *assumes* a discernible selection pathway; you argue this is often absent.

  ### 2. Is This a Distinct Problem?
  **Absolutely, and it's more fundamental than disjunction.** The disjunction problem asks: *Which* F (flies vs. small-dark-moving-things) does a state represent? Your objection asks: *Is there a determinate F at all?* This is a prior challenge about **metasemantic grounding**. 

  - **Disjunction** assumes a clear selective history but debates its *content*.
  - **Your challenge** questions whether a coherent selective history *exists* for complex traits. 

  You’re not redescribing old problems; you’re exposing the **adaptationist presupposition** underlying teleosemantics. Gould/Lewontin’s critique applies directly: teleosemantics risks being a "just-so story" generator when the trait’s origin is murky. 

  ### 3. Strongest Replies & Their Limits
  #### Millikan/Neander's Likely Counterarguments:
  - **"Normal Explanations" as Salvage**: Millikan might argue that even if a trait’s *origin* is messy, its *current* contribution to fitness, operating via mechanisms shaped by *some* historical selection, can stabilize a proper function. The "Normal explanation" for why a cognitive mechanism persists *now* could fix content, bypassing exact origins.  
    - *Your rebuttal*: This conflates *current utility* with *selected function*. A trait maintained by drift or cultural inertia lacks a teleosemantic "proper function," no matter how useful. Teleosemantics collapses into a forward-looking theory, abandoning its historical core.

  - **Derived Functions via Learning/Culture**: Neander emphasizes that learning mechanisms themselves have proper functions (e.g., updating beliefs via perceptual inputs). A culturally acquired concept (e.g., "electron") inherits derived functions from these mechanisms.  
    - *Your rebuttal*: This pushes the problem upstream. What fixes the content of *those* learning mechanisms? If *their* functions are indeterminate (e.g., evolved for social cueing, not truth-tracking), derived content inherits that indeterminacy.

  - **Etiological Pluralism**: Neander allows that a trait can have *multiple* proper functions (e.g., feathers: thermoregulation *and* flight). Content could be disjunctive or context-sensitive.  
    - *Your rebuttal*: This dissolves determinacy. If human inference has 10 possible selective histories, representation becomes radically ambiguous—worse than disjunction, as there’s no stable "family" to ground meaning.

  #### Does This Succeed?
  **Only partially, and at great cost.** These replies salvage teleosemantics for *simple, domain-specific* traits (frog detectors, bee dances) but expose its **empirical undetermination** for higher cognition. The strongest defense—"Proper functions emerge from *current* contribution to fitness plus *some* historical selection"—effectively waters down the theory. It risks making content hostage to speculative reverse-engineering, precisely the adaptationist pitfall you describe.

  ### Where You Stand
  **Philosophy:** Your critique is trenchant and distinct. Teleosemanticists *must* confront the gap between their need for clean selective histories and the biological reality of complex traits. This isn’t overreach—it’s a necessary challenge from the science.  
  **Biology:** Your concerns are empirically sound. Work on evolvability, neural reuse, and cultural evolution (e.g., Anderson’s "neural reuse" hypothesis) shows cognition is built from repurposed, multi-functional systems with tangled histories. Demanding a single "selected-for-F" is often biologically naive.

  ### Suggested Refinement for Your Piece
  1. **Tighten the Target**: Explicitly distinguish "simple" cases (where functions *are* determinate) from "complex" ones (abstract thought, language). Argue teleosemantics works for the former but not the latter.  
  2. **Invoke Gould & Vrba**: Contrast "adaptation" (selected *for* F) vs. "exaptation" (co-opted *without* initial selection for current use). Teleosemantics struggles with the latter.  
  3. **Propose a Starker Dilemma**: Either:  
     - Teleosemantics applies only to simple traits (abdicating its aim to explain human cognition), OR  
     - It stretches "proper function" beyond recognition (losing its explanatory power).  

  Your voice as a biologist is invaluable here. The reading group needs this challenge—don’t soften it. If anything, emphasize that for many cognitive traits, **the question "What was this selected for?" has no determinate answer.** Teleosemantics, in those cases, may be chasing a ghost.
