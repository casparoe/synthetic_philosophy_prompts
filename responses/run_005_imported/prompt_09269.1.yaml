  }
  ```

  ### **Key Clarifications for Norming**
  - **Swampman vs. Indeterminacy:** Swampman questions whether *any* content exists without history. Millikan’s **actual indeterminacy problem** (e.g., *LTOBC*, Ch. 9) asks why "fly" is preferred over "food particle" or "moving dark speck" *given* a history.  
  - **Fodor’s Role:** Fodor (*Psychosemantics*, 1987) developed asymmetric dependence *against* teleosemantics. Millikan explicitly rejects it (*White Queen Psychology*, 1993).  
  - **Millikan’s Solution:** She appeals to "Normal conditions" (evolutionarily recurrent contexts) to fix content determinacy (e.g., the frog’s mechanism was *Normalized* by flies, not BB pellets).
