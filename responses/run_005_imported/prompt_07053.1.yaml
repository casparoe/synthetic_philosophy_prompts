  The knockout punch comes in step 5: the neuroscientist exposes the philosopher's moving goalposts. But I wonder... is there a middle ground? Perhaps the missing piece is functionalist criteria: if pain behavior serves identical biological functions (learning, protection, motivation) regardless of implementation, that might bridge the gap.

