  Me and a friend got into it last night over van Fraassen's Reflection principle and neither of us backed down. Her line was that once you carve out the standard exceptions -- you're about to lose your memory, you're about to get some drug that'll make you sincerely believe something absurd -- there's nothing left of the principle except a restatement of the fact that ordinary conditionalizers satisfy the law of total probability, so its either trivial or just a patch job with no real content. I was arguing the qualified version still has bite in ordinary cases and that the diachronic dutch book argument shows a genuine kind of irrationality, not just an accounting trick. We went back and forth for like an hour and neither of us moved an inch. Can you write a dialogue between two people having this exact argument, where each one actually has to engage the other's strongest move (her triviality charge, my dutch-book/expert-deference point) instead of just restating their side louder every round? Don't let either one win too easily.
