prompt: |-
  Ok, this has been bugging me for a couple weeks and I want an outside take before I take it back to my cofounder. I run a smallish customer support team (about 20 people), and last year I built a dashboard that ranks agents by tickets resolved per day, with a chunk of quarterly bonus tied to where you land on it. Two things have happened since then that I can't fit into the same explanation, no matter how I try.

  First: team-wide resolution numbers climbed for a few months like I wanted, then basically flatlined even though the dashboard numbers kept climbing. When I actually read through transcripts, I found a bunch of agents had started closing a ticket the second they'd said anything plausible-sounding, telling the customer "reply if this doesn't fix it" — and if it didn't, that reply opened a brand new ticket instead of reopening the old one, so one unsolved problem was quietly worth two "resolutions" instead of zero. Second, seperate thing: I went back and looked at whoever had the single best resolved-per-day number in their first month on the team, going back two years. Almost all of them turned into pretty average agents by month six, and a bunch of people who looked totally mediocre in month one ended up being my strongest agents later on.

  My cofounder's take on both is just "the metric's bad, kill the dashboard" (he also likes to say I've read too much LessWrong and it's rotted my brain into overanalyzing a simple HR problem). And sure, the dashboard probably needs fixing either way, but that explanation feels like its flattening two pretty different things into one, and I can't quite articulate why not. I've read enough rationalist blog posts to already have "well, that's what happens once a number becomes a target" pattern-matched, so that answer alone won't satisfy me — it doesn't feel specific enough to tell me what's actually going on in each case, or whether the two things even share a fix. Are these actually the same underlying failure wearing two different costumes, or two genuinely different failures that just look similar from a distance? And practically: should I be doing something different about the ticket-splitting behavior than about how much weight I put on someone's first-month numbers when I'm deciding who to keep investing in?
reasoning: |-
  Okay, let me unpack this user's problem. They run a customer support team of about 20 people and implemented a dashboard that ranks agents based on tickets resolved per day, tying bonuses to it. Now they're seeing two main issues: team resolution numbers flatlined while dashboard metrics kept climbing due to agents gaming the system by closing tickets prematurely and creating new tickets when issues aren't resolved. Additionally, agents with stellar first-month performance often become average by month six, while initially mediocre agents become top performers.

  The user's cofounder wants to scrap the dashboard entirely, calling it a "bad metric." But the user feels this oversimplifies two distinct problems. They recognize Goodhart's law in play but want deeper analysis. 

  First, I need to determine if these are two separate issues or manifestations of the same root cause. The ticket-splitting is clearly metric manipulation - agents optimizing the measure (resolved tickets) at the expense of actual customer satisfaction. The early-performance vs. long-term outcome discrepancy seems different; it's about how the metric fails to capture development potential and learning curves.

  For the first issue, the core problem is a perverse incentive structure. The resolution metric ignores solution quality and encourages behaviors that inflate numbers artificially. This requires fixing both the metric (adding quality dimensions) and the process (preventing ticket splitting).

  The second issue relates to how performance metrics interact with learning curves. New agents might resolve simpler tickets quickly but struggle with complex issues later. Alternatively, thorough agents might start slower while building expertise. The current system over-rewards shallow initial performance and undervalues learning capacity.

  Practically, these require different solutions. For gaming prevention: add quality metrics (CSAT, reopen rates), prevent ticket splitting technically, and coach on solution ownership. For the early-performance problem: adjust how performance is evaluated over time, using trend analysis rather than snapshot metrics, and create development paths for different growth trajectories.

  The user's deeper need seems to be designing metrics that drive desired behaviors without unintended consequences. They might also need arguments to persuade their cofounder that nuanced fixes beat abandoning metrics entirely. The cofounder's "rotten brain" comment suggests they need data-backed, pragmatic solutions rather than theoretical explanations.

  Ultimately, these are two distinct failures sharing a common theme of flawed performance measurement. The solutions involve metric redesign (adding quality dimensions), process adjustments (ticket handling), and evaluation timeframe changes (longer performance windows).
answer: |-
  You're absolutely right to sense that these are two distinct phenomena wearing the same "Goodhart's Law" overcoat. While both stem from flaws in your metric system, the underlying mechanisms and required fixes are different. Let's dissect them:

  **Phenomenon 1: The Ticket-Splitting & Premature Closure**
  *   **The Failure:** This is **Classic Metric Manipulation (Campbell's Law)**. Agents are directly gaming the *measurement mechanism* to inflate their score, actively harming actual outcomes (customer experience, true resolution rate).
  *   **The Why:** The metric ("Tickets Closed") is **easily gamed without delivering real value**. It's:
      *   **Oversimplified:** Ignores quality, completeness, customer satisfaction, and long-term resolution.
      *   **Process-Vulnerable:** Relies on a ticketing system workflow that agents can exploit (new ticket vs. reopening).
      *   **Rewards Shortcuts:** Incentivizes speed *at the expense of effectiveness*.
  *   **The Underlying Problem:** **Misaligned Incentives.** The reward system actively encourages counterproductive behavior that looks good *only* on the dashboard.

  **Phenomenon 2: The High-Fliers Fizzling, Slow-Starters Soaring**
  *   **The Failure:** This is **Predictive Validity Failure & Misinterpretation of Early Performance.** The metric ("Tickets Closed" in Month 1) is a poor predictor of long-term potential or complex skill mastery.
  *   **The Why:**
      *   **Early Task Simplicity:** New agents are often given simpler, quicker-to-resolve tickets. High volume early on might just reflect handling easy tasks fast.
      *   **Learning Curve vs. Metric Focus:** Truly great agents might be *slower* initially because they:
          *   Invest time understanding complex issues deeply.
          *   Focus on learning systems and processes thoroughly.
          *   Prioritize quality communication and building rapport.
          *   Tackle harder tickets assigned as they gain experience.
      *   **Skill Mismatch:** The metric measures *transactional speed*, not the *complex problem-solving, empathy, knowledge depth, or communication skills* that define top long-term performers.
      *   **Motivation & Adaptability:** Agents who start "mediocre" might be building foundational skills that later allow them to excel with complex work, while fast starters might plateau or lack adaptability.
  *   **The Underlying Problem:** **Using a Narrow, Short-Term Metric as a Proxy for Potential & Complex Skill.** The metric captures only a small, potentially misleading slice of an agent's capabilities and trajectory.

  **Are They the Same Failure?**
  *   **No.** They share a common ancestor (a flawed metric system), but they are different species:
      *   **#1 is about *gaming*:** Agents *actively distorting* their work *to hit the target*, harming outcomes.
      *   **#2 is about *misinterpretation*:** The metric itself is a *poor indicator* of the qualities you *actually* value long-term, leading to bad predictions. The agents aren't necessarily gaming; the metric just doesn't measure what matters for growth.

  **Practical Fixes: Different Solutions for Different Problems**

  **For Problem #1 (Ticket-Splitting & Premature Closure):**

  1.  **Attack the Gaming Mechanism Immediately:**
      *   **Process Fix:** Implement a strict rule: If a customer replies within [X hours/days] on a *closed* ticket about the *same unresolved issue*, it MUST reopen the *original ticket*, not create a new one. Enforce this technically in your ticketing system if possible.
      *   **Quality Metric:** Introduce a **"First Contact Resolution (FCR)"** or **"Reopen Rate"** metric. Track the % of tickets *truly* resolved on first interaction without needing follow-up. Tie a *significant* portion of the bonus to *this* alongside volume (e.g., 50% FCR Rate, 50% Adjusted Volume). A high reopen rate negates a volume bonus.
      *   **Customer Feedback:** Incorporate **Customer Satisfaction (CSAT)** or **Net Promoter Score (NPS)** directly into the bonus calculation. Low scores reduce or eliminate volume bonuses.
      *   **Audit & Coaching:** Regularly audit closed tickets (especially high-volume agents) for premature closure. Coach agents on the *intent* of resolution (customer solved) vs. the *mechanism* (closing a ticket).

  **For Problem #2 (Misleading Early Performance):**

  1.  **Stop Using Month 1 Volume as a Key Performance Indicator (KPI) for Potential:**
      *   **Eliminate Ranking/Penalty in Month 1:** Treat the first 1-3 months purely as a training/ramp-up period. Focus metrics on *learning progress* (knowledge base usage accuracy, completion of training modules, positive coaching feedback) rather than raw ticket volume.
  2.  **Shift Focus to Trajectory & Quality:**
      *   **Trend Analysis:** Look at performance *trends* over months 3-6. Is the agent improving? Are they mastering more complex tickets? Is their FCR/CSAT improving?
      *   **Quality-First Evaluation:** Base probation decisions and early investment primarily on *quality* metrics (FCR, CSAT, quality audit scores, knowledge application) observed *after* the initial ramp-up (e.g., months 2-4), even if volume is still moderate.
      *   **Complexity Tiering:** Track the *type* of tickets agents handle. Progressively assign more complex issues. Reward agents who successfully handle higher complexity tiers, even if their *absolute* volume is lower than someone only doing simple tickets.
  3.  **Develop Holistic Potential Markers:** Look for signs beyond the dashboard:
      *   Proactive knowledge sharing.
      *   Handling difficult customers calmly.
      *   Identifying root causes and suggesting improvements.
      *   Mentoring newer colleagues.
      *   Consistent positive customer feedback (qualitative).

  **Talking to Your Cofounder: Moving Beyond "Kill the Dashboard"**

  1.  **Acknowledge the Core Truth:** "You're right, the *current* metric is flawed and causing problems. Goodhart's Law is definitely in play."
  2.  **Highlight the Distinction:** "But the problems manifest in two distinct ways that need different fixes:
      *   **Problem A:** Agents are *gaming the system* (ticket splitting), harming customers. This needs *immediate process changes* and *quality metrics* added to the dashboard.
      *   **Problem B:** Our *early performance metric* is a terrible predictor of who becomes great long-term. This needs us to *change how we evaluate new hires*, focusing on quality and trajectory, not just Month 1 speed."
  3.  **Propose Evolution, Not Destruction:** "Scrapping the dashboard entirely throws out the baby with the bathwater. Volume *is* a factor, but it can't be the *only* factor. We need to *evolve the dashboard* to incorporate:
      *   **Quality:** FCR/Reopen Rate, CSAT
      *   **Complexity:** Ticket tier resolution rates
      *   **Customer Impact:** Maybe even escalations prevented
      This gives a *balanced scorecard* that actually drives the behavior we want: solving customer problems effectively and efficiently."
  4.  **Address the New Hire Pipeline:** "Separately, we need to fix how we assess new talent. Month 1 ticket count is worse than useless; it's misleading. Let's define a proper ramp-up period with *development-focused* metrics and shift our 'keeper' decisions to quality and improvement trends seen by Month 3-4."
  5.  **Focus on Outcomes:** "The goal isn't a 'perfect metric,' but driving better customer outcomes and agent effectiveness. A richer dashboard and smarter new hire evaluation will get us closer to that than just killing visibility."

  **Conclusion:** Your cofounder is half-right – the *current* metric is bad. But his solution ("kill it") is simplistic. You have two distinct problems: **deliberate metric manipulation** requiring process fixes and balanced metrics, and **predictive validity failure** requiring a shift in how you evaluate new agent potential. Address them separately with the targeted solutions above. Evolve your measurement system to capture what truly matters for customers and sustainable team performance.
