answer: |-
  You're hitting the metaphysical bedrock where intuitions clash and ontological costs get weighed. Let's defend adverbialist endurantism against Lewis's dismissal, showing it's neither desperate nor perdurantism in disguise, and arguably *cheaper* than the worm view. I'll build the case step-by-step, incorporating the homogeneous disc worry as potent ammunition.

  **Core Argument: Adverbialism as a Legitimate Primitive, Not Smuggled Perdurantism**

  1.  **The Target: Lewis's "Desperate Moves" Charge:**
      Lewis dismisses endurantist solutions to temporary intrinsics as either:
      *   *Relationalizing Intrinsics:* Making shape "bent-at-t" a relation to time, violating the "about me alone" nature of intrinsics.
      *   *Adverbialism ("Mysterious Primitive"):* Having the same object instantiate "bent" *t-ly* (e.g., "bent-ly-at-t1") and "straight" *t-ly* (e.g., "straight-ly-at-t2"). He sees this as an unexplained, ad-hoc dodge.

  2.  **Defending Adverbialism's Legitimacy:**
      *   **Not Ad-Hoc, But Structurally Necessary:** Adverbial modification isn't invented *just* for time. We already use it for other modes of instantiation. Consider:
          *   *Spatial:* "The desert is hot *here* but cold *over there*." We don't say the desert has spatial parts with different temperatures (like perdurantism), nor do we make "hot" a relation to a location (like relationalizing). We understand the *whole desert* instantiates hotness *here-ly* and coldness *there-ly*. Temporal adverbialism is structurally analogous.
          *   *Modal:* "This lump *could-ly* be a statue, but *actually-ly* isn't." We modify instantiation for modality without invoking parts or relations.
      *   **Capturing the Phenomenology of Persistence:** Our pre-theoretic intuition is that *we*, the whole being, *change*. We don't experience ourselves as a sequence of temporal slices handing off existence; we experience being wholly present *now*, yet different from how we were wholly present *then*. Adverbialism directly models this: the *same me* instantiates properties differently *at different times*. Perdurantism replaces this with a different entity (the worm) composed of distinct experiencers (the slices).
      *   **Primitive, But Not *More* Mysterious than Perdurantism's Primitives:** Lewis accepts "parthood-at-t" and "instantiation-at-t-by-a-temporal-part" as primitives. Why is "instantiation-t-ly-by-a-whole-object" inherently *more* mysterious? Both theories need *some* primitive machinery to handle change. Adverbialism posits a primitive mode of instantiation tied to time; perdurantism posits primitive temporal parts and temporalized parthood. Neither is obviously simpler. Arguably, adverbialism's primitive (a modifier on instantiation) is *less* ontologically committing than perdurantism's (a whole new *category* of entity - temporal parts).

  3.  **Why It's NOT Perdurantism in Disguise:**
      *   **The "Wholly Present" Divide:** This is crucial. For the perdurantist, at time `t`, *only* the `t`-slice of the worm is present. The rest is past/future. For the adverbialist endurantist, the *entire object* is literally, wholly present at `t`. When I sit bent at `t1`, *all of me* is present and instantiates bent-`t1`-ly. When I stand straight at `t2`, *all of me* is present and instantiates straight-`t2`-ly. There are no "bent parts" and "straight parts" of *me*; there is just *me*, wholly present, instantiating different properties at different times via temporal modification.
      *   **No Hidden Parts:** Adverbialism doesn't postulate *any* temporal parts. The property bearer is the numerically identical, part-free (in the temporal sense) object at every moment it exists. Perdurantism is *defined* by its commitment to temporal parts.

  **The Rotating Homogeneous Disc: Perdurantism's Achilles' Heel & Adverbialism's Strength**

  This is where the adverbialist gains significant ground. Imagine a perfectly homogeneous disc (uniform density, color, etc.) rotating in empty space.

  *   **The Problem for Perdurantism:**
      1.  Perdurantism says the disc-worm consists of temporal parts (disc-slices).
      2.  At any instant `t`, the disc-slice is homogeneous. Its intrinsic properties (density, color, material composition) are identical at every point and across time.
      3.  **Where is the rotation?** If every temporal part is intrinsically identical (same homogeneous state), what grounds the fact that the disc *rotates* rather than being completely static? Rotation implies a *change* in orientation of the *same* material points over time.
      4.  **Perdurantist Responses & Their Cost:**
          *   *Velocity Vectors?* They might add primitive instantaneous velocity properties to the temporal parts. But this is a *new fundamental intrinsic property* solely to account for change. It feels like cheating – smuggling in change via a new primitive because the core ontology of temporal parts fails to capture it naturally.
          *   *Relations Between Parts?* They might say rotation is a matter of the *spatial relations* between the material points in *successive* temporal parts. But this requires facts about how material points in *different* temporal parts relate. How is *identity* of material points across time established? Perdurantism typically grounds this in genidentity relations between temporal parts... which itself becomes another primitive. This route makes rotation an extrinsic, relational property of the worm, not an intrinsic property of the disc *at a time* or *over time* in a simple way. It becomes complex and ontologically heavy.

  *   **The Adverbialist Endurantist Solution:**
      1.  The *whole disc* is wholly present at each moment.
      2.  At each time `t`, it instantiates its homogeneous properties (density, color) *simpliciter* (or `t`-ly, but homogeneity makes this moot).
      3.  Crucially, it also instantiates a specific *orientation* `t`-ly. At `t1`, it instantiates orientation-O1-`t1`-ly. At `t2`, it instantiates orientation-O2-`t2`-ly, where O2 is a rotation of O1.
      4.  **Rotation is grounded directly:** The change in orientation over time is simply the numerically identical disc instantiating different orientation properties at different times via temporal modification. No new primitives (beyond the adverbial modifier itself, which they already have for shape change), no appeal to relations between distinct temporal parts, no need for velocity vectors. The rotation supervenes neatly on the sequence of `t`-ly instantiated orientations by the wholly present object.

  **The Ontological Cost Argument: "Wholly Present" vs. "Never Wholly Present"**

  This cuts to your core point about cost:

  *   **Perdurantism's Cost:** It denies that the object you touched, sat on, or were, was ever *wholly present*. Only slices were present. The "whole you" or "whole chair" is the worm, a four-dimensional aggregate that is never fully present at any moment. This requires:
      *   A fundamental commitment to temporal parts as basic entities.
      *   A theory of parthood that includes temporal parthood.
      *   Genidentity relations or similar to bind parts into worms.
      *   Potentially extra primitives (like velocity vectors) to handle certain kinds of change (like rotation). **This is ontologically inflationary.**

  *   **Adverbialist Endurantism's Cost:**
      *   Commitment to enduring objects (the familiar 3D-ish entities).
      *   Commitment to a primitive temporal modifier on the instantiation relation (`P-t-ly`).
      *   **Crucially, it preserves the intuition that the object *is* wholly present when you interact with it.** When you sat on the chair yesterday, the *entire chair* was there. When you were born, *all of you* came into existence then (even though you lacked future properties). This matches our lived experience and linguistic practices far more directly.
      *   It handles rotation and other changes without needing temporal parts, genidentity, or extra intrinsic properties. **The adverbial modifier is its main ontological addition.**

  **Conclusion: A Strong Case for Adverbialism**

  Lewis was too quick. Adverbialism isn't a mysterious dodge; it's a structurally coherent account of property instantiation over time, analogous to spatial and modal modification. It directly captures the core endurantist intuition of numerical identity through change – the whole object persists, instantiating different properties at different times via temporally modified instantiation.

  It is fundamentally distinct from perdurantism: no temporal parts, and the whole object is present at each moment. The homogeneous disc problem highlights perdurantism's weakness – its core ontology struggles to ground intrinsic change like rotation without significant additional (and arguably ad-hoc) machinery. Adverbialism handles it elegantly with its existing resources.

  Finally, the ontological cost favors adverbialist endurantism. Perdurantism multiplies entities (temporal parts), requires a complex temporalized mereology, and may need further primitives. Adverbialism adds only a modifier to instantiation while preserving the fundamental category of wholly present, enduring objects. Paying the price of a primitive temporal modifier is arguably cheaper than fragmenting every object you've ever loved, touched, or been into an infinity of temporal shards, none of which were ever truly *there* in their entirety. The adverbialist offers a world where chairs are wholly sat upon, people are wholly born, and discs wholly rotate – a world that feels much more like the one we inhabit and describe. That's a significant metaphysical advantage.
