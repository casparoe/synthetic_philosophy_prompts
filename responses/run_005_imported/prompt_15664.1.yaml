prompt: |-
  ok so for my IB extended essay i've been going down a rabbit hole on humean vs anti-humean laws of nature (specifically lewis's best-system account) and every paper i read brings up the same handful of objections but nobody ever says which ones are actually supposed to be fatal vs which ones humeans have a decent comeback to. the objections i keep running into are:

  1. the "big bad bug"/undermining problem (humean chance messing with the principal principle)
  2. ramseyan humility - the quidditism/permutation-of-roles argument
  3. armstrong's complaint that on a pure regularity theory, laws are basically unexplained cosmic coincidences (the accidental-generalizations problem)
  4. the charge that "simplicity" and "strength" in the best-system criteria are language/vocabulary dependent
  5. tooley's cases of possible worlds where certain property combos never actually get instantiated together

  can you rank these from most to least damaging to humeanism? do it as tiers, S = basically unanswerable for a humean, C = humeans have a solid comeback, as a json block like this:

  ```json
  {
    "S": [],
