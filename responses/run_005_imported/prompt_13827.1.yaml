prompt: |-
  I'm putting together questions for a podcast chat with a decision theorist who's a true believer in coherence arguments -- the claim that any sufficiently advanced AI has to end up acting like an expected utility maximizer, since an agent that doesnt can always be money-pumped. Give me 8ish interview questions that go beyond just having her restate the argument: I want at least one on whether the argument actually needs full completeness of preferences to dodge the pump (or whether an agent with incomplete preferences that just refuses dominated trades gets off the hook too), one on the 'resolute choice' escape hatch where an agent commits to a whole plan up front instead of having consistent preferences at every single decision node, and one on Savage's small-world/large-world worry about whether a theorem proved over a small fixed set of options actually transfers to a messy, open-ended environment -- and for each, add a quick follow-up keyed to whatever answer she's most likely to give.
