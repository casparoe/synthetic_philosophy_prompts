prompt: |-
  So a few months back I somehow got talked into joining the board of the co-op building I live in — twelve units, five of us on a volunteer board, none of us has any kind of legal or policy background, we just take turns because somebody has to sign the checks. Anyway we've got a mess on our hands that's had me loosing sleep. One of the other owners, who's lived here almost a decade without a single complaint against her, got outed on the neighborhood Facebook page as running a legal, home-based dominatrix business — strictly appointment-only, clients in and out the side door, everything arranged over text beforehand, she pays taxes on it as an LLC, nothing illegal going on as far as anyone's been able to find out. Three of the other four board members now want to use the "conduct objectionable to the co-op or its residents" clause in our proprietary lease (which is one vague sentence and has never actually been used before) to start termination proceedings against her. Their case is basically: it's degrading, they don't want to live over top of "that," and if it gets more attention then the one nosy local blog post it already got, it'll tank what all our units are worth and turn the building into a punchline. The rest of us (me included, most days) think that's exactly the kind of reasoning that could get used to push out literally any owner the majority happens to find distasteful for reasons that have nothing to do with how she actually treats her neighbors, and that "objectionable" can't just mean "some of us are grossed out by it."

  We vote in a week and a half, and since I'm the one who's spent every night since this started reading state landlord-tenant law and old "morals clause" court opinions (none of which map onto us super cleanly), I got stuck writing the memo the board's actually going to vote off of. I need it to land on one clear recommendation — proceed with termination, issue a formal warning, or drop the matter entirely — with an actual timeline attached, not a wishy washy "reasonable minds differ." And I really don't want it to just wave off the property-value argument as pure prejudice and move on, because even my husband, who thinks this whole thing is a non-issue, admits that if resale values genuinely take a hit, that's a real cost to people who didn't sign up for it. Can you put that memo together for me?
reasoning: |-
  Okay, the user is part of a co-op board dealing with a member running a legal dominatrix business from home. Three board members want to terminate her lease using a vague "objectionable conduct" clause, citing property values and discomfort. The user needs a balanced memo recommending a clear action.

  First, I need to understand the core issues. The business is legal, appointment-only, low-profile, and the owner has a clean record. The opposition argues it's degrading and could hurt property values. But the user is worried about setting a bad precedent where personal biases dictate policy.

  The memo must address property values without dismissing concerns. How to prove impact? Currently, only one blog post, no evidence of actual value drop. Precedent is key here—if they act without evidence, it could open doors for arbitrary actions against other owners.

  Legal risks are a big factor. Co-ops have broad discretion but must act reasonably. Terminating a lease without clear violations or harm might lead to expensive litigation. The business isn't illegal, so discrimination claims could arise. Courts often strike down vague morals clauses unless there's tangible harm.

  The user wants a decisive recommendation. Drop the matter but draft a policy for future clarity. This avoids punishing the current owner while protecting the co-op long-term. It shows proactive governance without targeting her.

  Also, the user's deeper need: preserving community harmony and fairness. They fear creating divisions or a slippery slope. The memo should emphasize governance principles—evidence-based decisions, preventing arbitrary use of power.

  Timeline is crucial. The vote is soon, so the memo must be actionable. Include immediate steps: draft policy, consult attorney, communicate decision. This provides a clear path forward, showing leadership.

  Balancing property values: acknowledge the concern but stress lack of evidence. Suggest monitoring the market. This validates the worry without acting on speculation.

  Finally, the tone should be neutral, factual. Avoid moral judgments. Focus on legality, precedent, and practical governance. The goal is unity and stability, not siding with either faction.
answer: |-
  Here’s a draft memo for your board vote, balancing legal pragmatism, ethical governance, and genuine concern for property values. It recommends a decisive path forward with a timeline:

  ---

  **MEMORANDUM**  
  **TO:** Board of Directors, [Co-op Name]  
  **FROM:** [Your Name], Board Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Unit Owner Business Activity & Proprietary Lease Clause 7.1 ("Objectionable Conduct")  

  ### I. Background
  Owner [Name] (Unit [X]) operates a legal, appointment-only professional services business (LLC) from her unit. The business involves no illegal activity, noise violations, foot traffic beyond client appointments (using side door), or prior complaints in her 10-year tenancy. Recent public attention (neighborhood Facebook, local blog) prompted board review under Proprietary Lease Clause 7.1 prohibiting "conduct objectionable to the co-op or its residents."  

  Three board members advocate initiating termination proceedings, citing:  
  - Moral objection to the business’s nature;  
  - Concern that publicity could damage the building’s reputation and depress unit resale values.  

  Two board members (including myself) oppose termination, citing:  
  - Lack of evidence of actual harm/disturbance;  
  - Risk of arbitrary or discriminatory enforcement of vague standards;  
  - Legal exposure for the co-op.  

  ### II. Key Considerations  
  **A. Legal & Precedential Risk**  
  - **Vagueness of Clause 7.1:** Courts often invalidate enforcement of overly broad "morals" or "objectionable conduct" clauses absent **tangible harm** (e.g., disruption, safety risks, illegal activity). *[State/County]* case law (e.g., *[Insert brief citation if possible, e.g., "similar to Smith v. Oakridge Co-op, 1999"]*) shows such clauses require a direct nexus to community welfare.  
  - **Discrimination Risk:** Targeting a legal, in-home business based solely on its *nature* (absent operational impacts) risks claims of discrimination (e.g., based on gender/occupation), inviting costly litigation. Home-based businesses are generally protected if compliant with zoning/law.  
  - **Burden of Proof:** Termination requires proving "objectionable conduct" is severe and materially harms the co-op. Current evidence (one blog post, social media chatter) likely fails this threshold.  

  **B. Property Value Concerns (Acknowledged & Analyzed)**  
  *This concern is valid but currently speculative:*  
  - **No Demonstrated Impact:** There is **no evidence** (e.g., appraisals, broker feedback, failed sales) showing current market impact. The single blog post generated limited attention.  
  - **Precedent vs. Panic:** Acting on *fear* of future devaluation, absent proof, sets a dangerous precedent. Any owner’s legal activity (e.g., controversial art, political activism, unconventional profession) could be targeted by a majority claiming hypothetical value loss.  
  - **Mitigation vs. Escalation:** Termination proceedings would generate FAR greater publicity (legal filings are public) than the current situation, guaranteeing wider attention and potentially *creating* the stigma/value loss we aim to avoid.  

  **C. Governance & Community Integrity**  
  - **Arbitrary Enforcement:** Using Clause 7.1 based solely on subjective distaste erodes trust and sets a precedent for factional targeting of owners.  
  - **Duty to Act Reasonably:** Boards must exercise discretion in good faith and proportionally. A decade of peaceful tenancy versus unproven value claims weighs heavily.  

  ### III. Recommendation: DROP THE MATTER & ADOPT A NEUTRAL BUSINESS POLICY  
  **Proposed Board Motion:**  
  *"The Board will take no further action regarding [Owner Name]'s current business operations under Lease Clause 7.1. The Board will draft a clear, content-neutral Home Occupation Policy for all units to be voted on at the next annual meeting."*  

  **Reasoning:**  
  1. **Termination is Legally & Ethically Unsupportable:**  
     - No evidence meets the legal threshold for "objectionable conduct" (disturbance, illegality, material harm).  
     - Attempting termination is high-risk litigation (costly win or loss) and likely triggers significant negative publicity.  

  2. **Formal Warning is Unnecessary & Antagonistic:**  
     - No lease violation or operational nuisance exists. A warning implies wrongdoing where none is established, inviting conflict.  

  3. **Addressing Core Concerns Proactively:**  
     - **Property Values:** Avoiding a public, punitive process minimizes attention. A future policy protects values by preventing *disruptive* businesses (e.g., high traffic, signage, noise) without targeting content.  
     - **Governance:** A clear policy (e.g., limits on client visits/day, signage, noise) applies equally to *all* businesses (tutoring, consulting, massage, crafts), preventing future disputes. This is a normal co-op governance tool.  
     - **Community:** De-escalation preserves harmony. The owner has been discreet and compliant for 10 years; confrontation is unnecessary.  

  **IV. Timeline & Next Steps**  
  1. **Vote (Date):** Board votes on above motion.  
  2. **Immediate (Day After Vote):**  
     - **If Motion Passes:** Chair notifies [Owner Name] *verbally and confidentially* that the board considers the matter closed pending new policy development. NO written reprimand.  
     - **If Motion Fails:** Consult co-op attorney *immediately* before proceeding.  
  3. **Within 30 Days:** Form a committee (include neutral owners) to draft a **Content-Neutral Home Occupation Policy**. Key elements:  
     - Permitted by right: Low-traffic, no external signage, no nuisance (noise/smell), compliant with law.  
     - Requires Board Approval: Activities exceeding thresholds (e.g., >3 client visits/day, storage of hazardous materials).  
     - Explicitly excludes regulation based on service/content if otherwise compliant.  
  4. **Next Annual Meeting (Date):** Owners vote to adopt the policy as a lease amendment/rules update.  

  **V. Why This Path?**  
  - **Protects the Co-op:** Avoids costly legal battles, harmful publicity, and charges of capricious governance.  
  - **Addresses Legitimate Concerns:** Future-proofs against disruptive businesses via clear, fair rules.  
  - **Upholds Fairness:** Respects an owner’s right to legal activity while affirming the co-op’s power to regulate *impacts*.  
  - **Preserves Value:** Mitigates reputational risk by resolving the issue quietly and professionally.  

  **Submitted for deliberation and vote.**  

  ---

  **Key Strengths of this Approach:**  
  *   **Decisive:** Recommends a clear "drop it" action with proactive next steps.  
  *   **Validates Concerns:** Takes property value fears seriously but demands evidence, showing why termination is counterproductive.  
  *   **Reduces Liability:** Avoids shaky legal ground and potential discrimination claims.  
  *   **Promotes Stability:** De-escalates conflict and builds governance capacity.  
  *   **Long-Term Solution:** The policy prevents future disputes over ANY home business.  

  **Before the vote:** Briefly emphasize that co-op boards wield significant power over people's homes. Using that power against a long-standing, rule-abiding neighbor based on speculation and discomfort – without a clear, consistently applied standard – is a dangerous step for a community built on shared ownership and trust. The proposed path offers protection without persecution. Good luck!
