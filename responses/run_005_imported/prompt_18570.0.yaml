prompt: |-
  I'm working on a feature about the stranger cooperative norms that effective altruists and decision theorists derive from thinking about very large or infinite universes. Please compare evidential cooperation in large worlds (ECL) with Douglas Hofstadter's older notion of superrationality. Both are invoked to argue that agents with no causal contact should still act cooperatively toward one another, yet the two arguments seem to rest on different foundations. Explain precisely what ECL requires that Hofstadter's original superrationality argument does not, and judge whether that extra requirement makes ECL's case for cooperating with distant, dissimilar agents more or less compelling than Hofstadter's case for cooperation between identical reasoners.
reasoning: |-
  Okay, the user is working on a feature about cooperative norms in large or infinite universes, specifically comparing ECL and Hofstadter's superrationality. Let me start by recalling the core concepts of both. Hofstadter's superrationality, from his 1983 Metamagical Themas, is based on identical agents in symmetric games like the Prisoner's Dilemma. The idea is that since both players are identical and know it, they'll reach the same conclusion, leading to mutual cooperation as the only consistent outcome. The key here is symmetry and identical reasoning processes.

  Then there's ECL, which comes from effective altruism and decision theory, dealing with large or infinite worlds. ECL suggests that even without symmetry, if the universe is vast, you should cooperate because your actions provide evidence about others' actions. The focus is on correlation between decisions, not necessarily symmetry. 

  The user wants to know what ECL requires that superrationality doesn't. Superrationality hinges on strict symmetry: identical agents, same knowledge, same decision-making. ECL, however, only requires that agents' decisions are correlated, possibly due to shared decision theories or reasoning methods, even if they aren't identical. So the extra requirement for ECL is less about symmetry and more about decision correlation in large populations.

  Now, judging which is more compelling for cooperating with distant, dissimilar agents. Superrationality's strict symmetry makes it less applicable to real-world scenarios where agents aren't identical. ECL's reliance on decision correlation in large universes could be more flexible, but it depends on whether such correlations exist. If the universe is vast and agents use similar reasoning, ECL's argument might hold, but if decision-making varies too much, the correlation weakens. So ECL might be more applicable to dissimilar agents, but its strength depends on the assumed correlation structure.

  The user's deeper need might be understanding which framework better justifies cooperation in real-world EA contexts, where agents are diverse. They might also be interested in the philosophical underpinnings and practical applicability of these theories. I should highlight how ECL addresses the limitations of superrationality but also point out its own assumptions. Emphasizing the difference in requirements and the contexts where each excels would help the user present a balanced analysis in their feature.
answer: |-
  Here's a precise comparison of ECL and Hofstadter's Superrationality, focusing on their requirements and the compellingness of their case for cooperation with distant/dissimilar agents:

  **Core Arguments for Cooperation:**

  1.  **Hofstadter's Superrationality (c. 1983):**
      *   **Foundation:** Symmetry and logical consistency for *identical* agents.
      *   **Mechanism:** In a symmetric game (like Prisoner's Dilemma), two *perfectly identical* agents, aware of their perfect identity and mutual awareness, must reach the *same* decision through pure reason. The only mutually consistent, non-contradictory outcome where both agents choose identically *and* maximize their payoff is mutual cooperation. Defection leads to an inconsistency (if both are identical, they both defect, yielding a worse outcome than mutual cooperation).
      *   **Requirement:** **Strict Symmetry.** Agents must be identical in their reasoning, knowledge, goals, and situation. They must *know* they are identical and *know* the other knows this, etc. (Common knowledge of identity/symmetry).

  2.  **Evidential Cooperation in Large Worlds (ECL) (Modern DT/EA):**
      *   **Foundation:** Evidential decision theory (EDT) and probabilistic correlation in large/infinite populations.
      *   **Mechanism:** In a vast or infinite universe, your decision provides *evidence* about the decisions of other agents sufficiently "similar" to you in their decision algorithm or situation. If you cooperate, it slightly increases the probability that other similar agents also cooperate. In large enough populations, even a tiny positive correlation can make the expected utility of cooperation higher than defection, as the benefits of others' cooperation outweigh the local cost. It leverages the "Law of Large Numbers" for decision correlations.
      *   **Requirement:** **Decision Correlation.** Agents must be "similar enough" in their *decision-making process* or *decision-relevant situation* such that learning your own decision provides non-zero probabilistic evidence about the decisions of others in the reference class. The universe must be sufficiently large/infinite to amplify the impact of this correlation.

  **What ECL Requires That Superrationality Does Not:**

  *   **Probabilistic Correlation, Not Identity:** ECL does **not** require strict identity or perfect symmetry. It requires only that agents are *sufficiently correlated* in their decisions due to shared decision theories, similar reasoning, or similar circumstances. Your decision acts as weak evidence for theirs.
  *   **Large/Infinite Population:** ECL fundamentally relies on the universe being **large or infinite** to make the small evidential effect significant. Superrationality works for just two identical agents.
  *   **Reference Class Definition:** ECL requires defining a relevant **reference class** of agents whose decisions are correlated with yours. Superrationality deals only with the specific, identical counterpart(s).

  **Judging Compellingness for Distant/Dissimilar Agents:**

  *   **Superrationality's Case:** **Weaker for dissimilar agents.** Its requirement of strict identity/symmetry is its Achilles' heel. Real-world agents (even distant EAs) are *not* identical twins with common knowledge of identity. Differences in values, reasoning, information, or context break the symmetry. Its case for cooperating with *dissimilar* agents is very weak or non-existent. It's compelling only for highly idealized, identical agents.

  *   **ECL's Case:** **Potentially Stronger, but with Crucial Caveats:**
      *   **Strength:** It explicitly *doesn't* require identity, only correlation. This makes it *far more applicable* to real-world scenarios involving distant agents who share *some* relevant similarity (e.g., using similar decision theories like EDT/UDT, being part of the EA community, facing structurally similar problems). It directly addresses cooperation across vast distances where causal contact is impossible.
      *   **Caveats & Weaknesses:**
          *   **The Correlation Assumption:** The core challenge is *justifying the assumed decision correlation*. How strong is it? How do we define the "similar" reference class robustly? If agents use vastly different decision theories, the correlation might be negligible.
          *   **Reference Class Problem:** Defining the relevant group whose actions correlate with yours is notoriously difficult and can lead to counterintuitive or paradoxical results depending on how it's drawn.
          *   **Decision Theory Dependence:** ECL heavily relies on Evidential Decision Theory (EDT) or its variants (like Updateless Decision Theory - UDT). If you reject EDT (e.g., favoring Causal Decision Theory - CDT), ECL's reasoning collapses. Superrationality, while often linked to EDT, has a more foundational symmetry argument.
          *   **Infinity Reliance:** The argument hinges critically on the universe being large/infinite. In a small, finite world, the evidential effect is negligible, and defection dominates. Superrationality works even in small worlds (if symmetry holds).

  **Conclusion:**

  ECL's case for cooperating with distant, dissimilar agents is **more compelling than Superrationality's** in realistic scenarios involving large-scale coordination problems (like existential risk mitigation or global priorities in a vast universe).

  *   **Why More Compelling:** It explicitly relaxes the unrealistic requirement of *perfect identity* and replaces it with the more plausible (though still debatable) requirement of *probabilistic decision correlation* among agents sharing relevant similarities (like decision frameworks or goals). This directly targets the scenario of cooperating with distant, non-identical agents who are "similar enough" in key aspects.
  *   **The Caveat:** The compellingness **hinges entirely on accepting the premises of evidential decision theory and the existence of non-trivial decision correlations in large universes**. If these premises are rejected or the correlation is deemed too weak/ill-defined, ECL's case weakens significantly. However, compared to Superrationality's reliance on an implausible level of symmetry for distant agents, ECL offers a more adaptable and scalable framework for the kind of large-world cooperation central to effective altruism and longtermist thinking.

  **In essence:** Superrationality requires agents to be *mirror images*. ECL requires them to be *statistically similar dots in a vast constellation*. For the problem of cooperating with distant, non-identical agents in a potentially infinite universe, the statistical similarity argument (ECL), despite its own challenges, is generally seen as a more robust and applicable foundation than the mirror-image argument (Superrationality).
