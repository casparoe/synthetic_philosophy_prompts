  - **2 (Sam): +1** – Right that *practical* systems (like tort law) tie consequences to liability, but this conflates legal conventions with moral philosophy. Fails to address why outcomes *should* matter ethically when unforeseeable.  
  - **3 (Elena): +2** – Brilliantly exposes the asymmetry: if outcomes justify blame, they should also justify praise. The "coin flip" analogy reveals the inconsistency in outcome-focused views, making Sam’s position unstable.  
  - **4 (Sam): +1** – Correct that society *does* punish harmful negligence more severely, and this asymmetry isn’t arbitrary (it serves deterrence/justice). But this defends *practice*, not moral principle, and dodges Elena’s ethical challenge.  
  - **5 (Elena): +2** – Devastating extension of the "control" argument: if outcomes are discounted due to luck, so is the agent’s temperament. Forces Sam to confront the implications of moral luck all the way back.  
