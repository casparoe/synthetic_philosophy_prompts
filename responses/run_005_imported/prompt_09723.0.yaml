  **Core Disagreement:**  
  The debate tracks the irreconcilable tension between **moral agency** (judging only what agents control, as Elena advocates) and **social consequence-management** (holding people accountable for harms they *causally* contribute to, as Sam implies). Elena’s view prioritizes fairness to the *agent*; Sam’s prioritizes accountability to *victims* and societal deterrence. Neither names this deeper conflict: whether ethics should be agent-centered (focused on intent/effort) or outcome-centered (focused on harm/restoration). The law hybridizes both imperfectly, explaining their stalemate.
