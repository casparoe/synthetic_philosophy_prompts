prompt: |-
  ok, decision theory rabbit hole from quals prep — want an actual argument built this time, not just a summary of the mess. There's this Pasadena game (Nover & Hájek): flip a coin til first heads on toss n, you win 2^n/n if n's odd and pay 2^n/n if n's even. Summed in the obvious order that's just the alternating harmonic series, ln(2), but its only conditionally convergent, so the terms can be rearranged to sum to literally any number, or to +/- infinity — meaning the expected value isn't infinite like St Petersburg, its just flat out undefined.

  The standard move (Colyvan) is to bite the bullet: fine, some gambles have no expected utility, cordon them off, move on with life. My advisor thinks that settles it, I don't buy it, because of what people call the "contagion problem" — once you admit even a tiny credence that you might be facing something pasadena-like, ordinary expected utility comparisons between completely mundane options stop being well-defined too, so cordoning off the weird cases doesn't actually work. I want to argue that the only move which genuinely blocks contagion is going full Arrow: rational utility functions have to be bounded, not as an ad hoc patch but as the only thing that keeps gambles like this from ever being assignable nonzero credence in the first place. Can you write the strongest version of that argument, and also take a real swing at the obvious complaint that bounding utility just arbitrarily caps how good an outcome is allowed to be?
reasoning: |-
  Okay, the user is diving deep into decision theory, specifically the Pasadena game and its implications for expected utility. They mention that their advisor thinks the standard move (Colyvan's approach) of cordoning off such gambles is sufficient, but the user isn't convinced because of the contagion problem. They want to argue that bounded utility is the only solution and need help crafting that argument while addressing the objection that bounding utility arbitrarily caps outcome values.

  First, I need to recall the Pasadena game. It's a game where you flip a coin until heads appears on toss n. If n is odd, you win \(2^n / n\); if even, you pay that amount. The expected value, when summed in order, is the alternating harmonic series which converges to \(\ln 2\). But since it's conditionally convergent, rearranging terms can make it sum to any real number or diverge. Thus, the expected utility is undefined.

  The contagion problem is key here. If an agent assigns even a tiny probability to facing a Pasadena-like game, then any gamble involving that possibility could inherit the undefined expected utility. For example, comparing two mundane options A and B might become undefined if there's a small chance of a Pasadena gamble affecting the outcome. This makes standard decision theory inapplicable in many real-world scenarios where such probabilities aren't zero.

  The user's position is that bounded utility functions are necessary to prevent these issues. The common objection is that bounding utility seems arbitrary—why should there be a cap on how good an outcome can be? The user needs a strong argument that addresses this.

  To build the argument, I should start by emphasizing the severity of the contagion problem. Show that even infinitesimal probabilities lead to undefined expectations, which paralyzes decision-making. Then argue that bounded utility isn't just a patch but a foundational necessity. It ensures that all possible gambles have well-defined expected utilities, avoiding the Pasadena problem entirely.

  Addressing the objection: The cap isn't arbitrary but a structural requirement for coherent preferences. Unbounded utility allows for gambles that break expected utility theory, so the bound is a prerequisite for rationality. Also, in practice, humans and agents have natural bounds due to finite lives and resources. Philosophical arguments from infinite value being incoherent could also support this.

  I need to present this logically, step by step, reinforcing why other solutions fail. Colyvan's cordoning off doesn't work because contagion still occurs. Other approaches like tail-conditional expectations or weak dominance might not fully solve the issue. Thus, bounded utility is the only robust solution.

  Finally, tackle the "arbitrary cap" complaint head-on. Argue that without bounds, utility functions can't fulfill their role in decision theory. The cap isn't ad hoc but emerges from the need to avoid contradictions. Conclude that bounded utility is essential for a consistent and applicable decision theory.
answer: |-
  Here’s the strongest version of the bounded utility argument, framed as a necessary safeguard against decision-theoretic paralysis, with a direct engagement against the "arbitrary cap" objection. The core structure is: **Contagion is catastrophic → Existing fixes fail → Bounded utility is necessary and principled → The "cap" is not arbitrary but constitutive of rationality.**

  ### The Argument: Bounded Utility as a Shield Against Contagion-Induced Collapse
  1.  **The Pasadena Problem is a Symptom of a Fatal Flaw:**  
      The Pasadena game’s undefined expected utility isn’t an isolated pathology—it’s a consequence of unbounded utility combined with infinite state spaces and conditionally convergent series. The game’s payoff structure \(u(\text{outcome}_n) = (-1)^{n+1} 2^n / n\) exploits this to make the expected utility series non-absolutely convergent. Rearrangement invariance fails, so EU is undefined.

  2.  **Contagion is Inevitable and Disastrous:**  
      If an agent assigns *any* non-zero credence (no matter how tiny) to facing a Pasadena-like gamble *or any gamble whose EU definition depends on a similar convergence pathology*, contagion occurs. Consider:
      -   **Scenario:** Agent compares two mundane options, A and B (e.g., $10 vs. $20). But they assign credence ε > 0 to being in a "Pasadena-verse" where the *true* choice involves a Pasadena gamble modifier.
      -   **Result:** The EU calculation for *both* A and B now includes an ε-weighted term of the form: EU(Pasadena Modifier) + EU(Mundane Outcome). Since EU(Pasadena Modifier) is undefined, the *entire* EU for A and B is undefined. **Rational comparison becomes impossible.**
      -   **Scope:** Contagion isn’t limited to explicit Pasadena games. Any gamble with unbounded utility and sufficiently divergent positive/negative tails can induce similar conditional convergence issues under tiny perturbations. The set of such "pathological" gambles isn't negligibly small; it's pervasive in any rich possibility space.

  3.  **Cordon Sanitaire Strategies Fail Fundamentally:**  
      Attempts to "quarantine" Pasadena-like gambles (e.g., Colyvan) are fatally flawed:
      -   **Epistemic Vulnerability:** An agent can *never* justify assigning *precisely* zero credence to encountering a pathological gamble. Weird possibilities (e.g., deceptive demons, exotic physics, unsuspected game structures) always deserve non-infinitesimal consideration under a regular probability measure. Requiring absolute certainty of non-existence is an impossible epistemic standard.
      -   **Dynamic Instability:** Even if one pathological gamble is cordoned off, the *structure* of the problem remains. Slightly modified pathological gambles (e.g., \(2^n / \sqrt{n}\)) can easily arise or be constructed, forcing an endless and futile game of whack-a-mole. The problem class isn't isolatable.
      -   **Contagion Resists Containment:** As shown in the scenario above, contagion doesn’t require directly facing the full pathological gamble; it only requires a tiny credence in *any* scenario where EU depends on an undefined quantity. The cordon is porous.

  4.  **Bounded Utility is the Only Effective and Principled Solution:**  
      Imposing a bound \( |u(\text{outcome})| \leq M < \infty \) for all possible outcomes is **necessary and sufficient** to prevent EU pathologies and contagion:
      -   **Necessity:** Unbounded utilities *create the possibility* of conditionally convergent or divergent EU series. Without a bound, pathological gambles like Pasadena are constructible, and contagion remains a threat.
      -   **Sufficiency:** With bounded utilities, every EU calculation is an absolutely convergent series (or integral). Rearrangement is irrelevant; dominance principles hold; and EU is always well-defined and finite, *regardless* of the gamble’s complexity or the agent’s credences. Contagion is impossible because every component EU exists.
      -   **Principled Foundation:** This isn’t an "ad hoc patch"; it’s a **precondition for coherent expectational reasoning**. Just as countable additivity prevents Dutch books in probability, bounded utility prevents expectational collapse. It ensures the *mathematical integrity* of the EU framework under *any* probabilistic beliefs an agent might hold. Rationality requires that comparisons are *always* definable; bounded utility guarantees this.

  ### Addressing the "Arbitrary Cap" Objection Head-On
  The objection: "Bounding utility artificially caps how good things can be! Why can't I value an infinite paradise infinitely?"

  **Rebuttal: The 'Cap' is Not Arbitrary—It's Constitutive of Rational Choice:**

  1.  **The 'Infinite Value' Fantasy is Incoherent in Decision Contexts:**  
      -   **Operational Meaninglessness:** What does it *mean* for an outcome to have "infinite utility"? It cannot rationally guide finite actions. If outcome Ω has u(Ω) = ∞, then:
          -   Getting Ω with probability ε > 0 dominates *any* finite gamble, no matter how terrible its risks (e.g., 0.0001% chance of Ω outweighs 99.9999% chance of torture). This violates basic intuitions about trade-offs and makes normative decision theory useless for real choices.
          -   Distinctions vanish: Any outcome short of Ω (e.g., saving 1 life vs. saving 1 billion lives) is infinitely worse than Ω, rendering all finite improvements irrelevant. Rational prioritization collapses.
      -   **Structural Impossibility:** Infinite utility creates internal contradictions within EU theory. The St. Petersburg paradox (finite price for infinite EU) and Pasadena show that unbounded utility + infinite states breaks the link between EU and rational preference. The "cap" avoids these inconsistencies.

  2.  **Boundedness Reflects the Finitude of Agency:**  
      -   **Cognitive/Practical Limits:** Agents have finite cognitive resources, finite lifetimes, and act in finite time. Valuing outcomes beyond a certain scale (e.g., "more than the total happiness achievable in the lifespan of the universe") has no operational significance for choice. A bound M reflects the maximum *pragmatically relevant* value difference an agent *can* respond to.
      -   **Moral Humility:** Assigning infinite value to any outcome implies absolute certainty in its supreme worth—a stance difficult to justify epistemically. Bounded utility acknowledges the possibility of error or incomplete understanding by preventing any outcome from dominating all others a priori.

  3.  **The Bound is Not a Fixed Number, It's a Structural Requirement:**  
      -   **M is a Parameter, Not a Dictate:** The theory doesn't specify *what* M is, only that *some* finite M exists. Different agents (or the same agent in different contexts) can have different bounds reflecting their capacity for discernment or their moral framework. A utilitarian might set M proportional to the maximum sustainable happiness; a deontologist might set M based on the weight of fundamental rights.
      -   **The Key is Existence, Not Magnitude:** Criticizing the arbitrariness of *where* M is set misses the point. The necessity is that *a bound exists* to ensure EU is defined. *Where* it’s set is a separate normative question (like choosing a discount rate), answerable by other principles. The boundedness itself is what safeguards the framework.

  4.  **The Alternative is Worse:**  
      Accepting unbounded utilities means accepting that rational EU theory is **fragile** and **locally inapplicable** almost everywhere due to contagion risk. It surrenders the core promise of decision theory: to guide rational choice under uncertainty. Bounded utility, while constraining, preserves the *universal applicability* of rational comparison—a far greater good than the empty promise of "infinite value" that destroys the machinery of choice.

  ### Conclusion
  The Pasadena game isn't a curiosity; it's a detonator for decision theory. Contagion proves that cordoning off pathological gambles is impossible, making unbounded utility functions incompatible with robust, universally applicable rational choice. Bounding utility is not an arbitrary restriction on valuing outcomes; it is a **necessary structural feature** that prevents the expectational machinery from imploding. It transforms EU from a fragile formalism, vulnerable to tiny epistemic uncertainties, into a resilient tool for reasoning under any beliefs. The "cap" isn't a limitation on how good the world can be; it's the foundation that makes coherent trade-offs about that goodness possible. If rationality requires comparable preferences, then bounded utility is non-negotiable.
