answer: |-
  The fluorescent lights of the courtroom hummed with a sterile insistence that felt at odds with the messy, throbbing ache behind Emma’s temples. Across the worn oak floor, her younger brother, Daniel, sat beside his lawyer, posture unnervingly straight. He looked like Daniel again. The gauntness had filled out, the frantic, darting eyes were steady, focused on the judge. The tumor – a slow-growing, walnut-sized meningioma nestled against his frontal lobe for God knew how long – was gone. Removed. The scans proved it. The neurologists testified. *He* was back.

  Their father, seated beside Emma, radiated a weary relief. He’d absorbed the shove that awful night two years ago – the one that sent him stumbling into the hall table, shattering a vase that had belonged to Emma’s mother – and had filed it away under ‘Not My Son’. He’d already started talking about Daniel moving back home temporarily, “while he gets back on his feet.”

  Emma’s feet felt leaden, rooted to the scuffed linoleum. She was a lawyer herself, specializing in contract disputes, not criminal defense. But the evidence for exemption was overwhelming, clinically pristine. The tumor explained the erratic disappearances, the inexplicable lies – elaborate fictions spun to extract thousands from their parents for non-existent courses, emergency repairs, investments that evaporated. It explained the paranoia, the sudden rages that culminated in that shove, an act so violently out of character it had fractured the family’s trust completely. They’d stopped calling, stopped inviting. Daniel became a ghost haunting their periphery, a source of dread and whispered arguments.

  Now, the judge was speaking. Probation. Mandatory counseling. Community service. Acknowledging the “mitigating medical circumstances.” A just verdict, legally. Objectively. Emma’s father squeezed her hand, a tear tracking through the lines on his cheek. “It’s over, Em. He’s back.”

  But Emma felt the cold, hard nugget of resentment lodged deep in her chest, untouched by the judge’s words or the medical consensus. It wasn’t a general bitterness; it was fiercely specific. The image of her father stumbling, the shock on his face, the sound of the shattering porcelain – her mother’s vase. The vase her mother had loved, rescued from her own childhood home. Gone, because Daniel, in that moment, wasn’t Daniel. *Except he was standing right there.*

  Later, at the obligatory, awkward family dinner at their father’s house, the tension thickened the air like gravy. Daniel was trying. He spoke softly, apologized again – a genuine, pained apology directed at their father. He avoided Emma’s gaze. Their father accepted it readily, patting Daniel’s shoulder, urging him to eat.

  "Remember that time Mum grew those ridiculous oversized courgettes?" their father said, forcing joviality. "Daniel, you carved one into a spaceship."

  Daniel managed a small smile. "Yeah. Took me hours. Mum pretended it was brilliant, even though it looked like a deformed zeppelin."

  Emma stabbed a piece of chicken. The memory was sweet, warm. But it felt like it belonged to someone else, a stranger sitting across the table wearing her brother’s face. Her resentment fixated on the vase. Its absence on the hall table was a physical void. Strawson’s essay, recommended by her philosopher friend Maya, echoed in her mind: *Excusing* the act – *he was pushed, he didn’t know* – was one thing. *Exempting* the person, stepping wholly into the ‘objective attitude’, was another. Treating Daniel now like a convalescent, a patient to be managed with care and lowered expectations, felt… wrong. A denial. But clinging to the resentment felt like poisoning herself.

  "Dad," she said, her voice sounding unnaturally loud in the tentative silence. "The hall table looks bare without Mum’s vase."

  Her father flinched slightly. Daniel froze, fork halfway to his mouth. "Em," their father began, his voice heavy with warning, with the plea to file it away.

  "I know," Emma pressed on, looking directly at Daniel now. His eyes held confusion, then a flicker of the old, defensive panic. "I know *why* it happened. I know it wasn’t *you*. Not the *real* you." She heard the strain in her own voice. "But knowing that… it doesn’t make the vase unbroken. It doesn’t erase the feeling of seeing Dad shoved. Knowing you lied to them, took their money…" She couldn't mention the worst part: the months after their mother's death, when Daniel’s escalating behavior felt like a second, brutal loss, a desecration of her memory. The tumor might explain it, but it didn't *undo* the desolation.

  Daniel put his fork down. "I don't remember it clearly," he said, his voice tight. "The… the pushing. Or most of that year, really. It’s foggy. Like a nightmare I was stuck in." He looked at their father, then back at Emma, his eyes pleading for understanding. "The doctors say… the tumor…"

  "I *know* what the doctors say!" Emma’s voice cracked. "I’ve read the reports. I understand frontal lobe impairment. Impulse control. Personality changes. It *explains* it. Objectively. Perfectly." She took a shaky breath. "But knowing *why* the knife slipped doesn’t stop the wound from hurting. Doesn’t make the scar disappear. And pretending the knife wasn’t in *your* hand…" She trailed off, the analogy feeling clumsy but necessary.

  Her father looked pained. "Emma, please. He’s sick. Was sick. He needs our support now. Forgiveness."

  "This isn't about forgiveness, Dad," Emma said, the Strawsonian distinction suddenly blazingly clear. "Or not *just* about that. It’s about… what do we *do* with this? Do I look at him," she gestured towards Daniel, "and just… switch off? Treat him like a fascinating neurological case study? Be endlessly patient, never get angry, never hold him to account because, well, *poor thing, his brain was broken*?" The thought revolted her. "Is that love? Or is that just… management?"

  Daniel flinched as if struck. "I don't want you to pretend, Em," he whispered. "I know what I did. Or… what *it* did through me. I have to live with that fog, with the shame of things I barely recall doing. I *want* you to be angry. It’s better than… than you looking at me like I’m glass."

  There it was. Strawson’s point hammered home not by theory, but by her brother’s raw, desperate plea. The objective attitude – detached, explanatory, therapeutic – was a refuge. It offered clean absolution, a neat compartmentalization: *The tumor did it.* But stepping wholly into that refuge meant stepping *out* of the messy, reciprocal dance of human relationship. It meant Daniel ceased to be her *brother* in the full, demanding sense; he became a patient, a responsibility, a problem to be solved with kindness but without the risk, the vulnerability, of truly engaging. She couldn't *reason* with a tumor. She couldn't feel *gratitude* towards it if he did something kind now. She couldn't feel the complex, painful *resentment* that was currently knotting her stomach.

  That resentment, Strawson insisted, wasn’t just an ugly emotion to be scrubbed away by better understanding. It was a *participant* attitude. It belonged to the fabric of seeing Daniel as a person, a moral agent, someone *capable* of wronging her, someone whose actions *mattered* to her in a way that transcended cause and effect. To relinquish it entirely, to adopt pure objectivity, wasn't emotional maturity; it was a subtle form of abandonment. It severed the connection on her end as surely as the tumor had severed it on his.

  Emma looked at Daniel, really looked. She saw the fear in his eyes – not just of punishment, but of being forever exiled, even in forgiveness, to the land of the exempt. She saw the man who carved the courgette spaceship, and she saw the man whose hands had shoved their father. They were the same hands. The same person, fractured then, perhaps healing now.

  "I *am* angry," she said, the words thick but clear. "I’m furious about the vase. I’m furious you scared us, hurt Dad, vanished when… when we were already grieving Mum." She saw him wince, but he held her gaze. "Knowing *why* doesn't magic that fury away. It just… complicates it."

  Silence stretched. Her father looked bewildered, caught between his desire for harmony and this uncomfortable, jagged honesty.

  Daniel nodded slowly, a sheen of tears in his eyes. "Okay," he breathed. "Okay. That’s… fair. I can… I can try to live with your anger. It’s better than nothing."

  It wasn't absolution. It wasn't the warm embrace of forgetting. It was something harder, messier. It was Emma refusing the cold comfort of the objective lens. Her resentment wasn't a failure of understanding; it was the stubborn, painful assertion of Daniel’s place in her moral universe. The tumor had stolen him, but demanding he be treated *only* as its victim felt like letting it steal him all over again. The scar remained, the vase was still gone, the memory of the shove was a cold stone in her gut. But holding onto the resentment, acknowledging its right to exist even in the face of irrefutable medical exemption, was her way of holding onto *him* – not the patient, not the neurological anomaly, but her brother, flawed, responsible, capable of causing pain and, perhaps, capable of earning back something more than detached pity. It was the price, Strawson might say, of keeping the door to genuine relationship – with all its risks and reactive attitudes – stubbornly, painfully open.
