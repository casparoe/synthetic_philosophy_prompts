answer: |-
  ## The Pasadena Paradox: A Hairline Fracture or a Foundation-Shattering Fault?

  Your decades swimming in the waters of expected value make your visceral reaction to the Pasadena paradox utterly understandable. It’s not just a mathematical oddity; it feels like a betrayal of the very logic underpinning rational choice. The core issue is stark: the game offers payouts whose *expectation*, the cornerstone of expected utility theory (EUT), *fails to exist* in the classical sense. It’s not infinite, nor finite; it’s undefined, a mathematical void generated by the conditional convergence of the alternating harmonic series lurking beneath the payoff structure `(-1)^(n-1) * 2^n/n`. Riemann’s rearrangement theorem exposes the fragility – the "expectation" is a shape-shifter, manipulable to any real number or infinity at will. Does this expose a fatal flaw in EUT as a normative theory? Or is it merely a pathological curiosity, safely quarantined? The arguments are compelling, but a verdict emerges: **the Pasadena paradox reveals a significant, non-trivial flaw demanding a principled patch, but it does not necessitate abandoning EUT's core normative power for the vast majority of decisions.**

  **The Case for Deep Flaw: Hajek and Nover's Offensive**

  Hajek and Nover argue persuasively that the paradox strikes at EUT's heart. Their core arguments are:

  1.  **The Primacy of Expectation:** EUT defines rationality *in terms of* maximizing expected utility. If the expectation doesn't exist, the theory literally *cannot deliver a verdict*. Saying "the problem is ill-posed" (Colyvan) feels like an evasion, an admission that the theory fails precisely where it should guide us. A normative theory shouldn't go silent when faced with a well-specified gamble.
  2.  **The Failure of Dominance (as a Panacea):** Colyvan suggests falling back on dominance reasoning (e.g., if Option A pays more than Option B in every possible state, choose A). Hajek and Nover counter that dominance is insufficient and often silent. What dominates the Pasadena game? Comparing it to a fixed $0? The Pasadena game *can* pay negative amounts infinitely often. Comparing it to a game with a defined finite expectation? There might be no dominance relation. Dominance is a valuable tool, but it's a weaker principle than expectation maximization and cannot handle comparisons where neither option dominates.
  3.  **The Pathological is Normatively Relevant:** Dismissing the paradox as "pathological" is question-begging. If EUT is a *general* normative theory of choice under uncertainty, it must handle *all* well-defined gambles, not just convenient ones. The fact that the gamble *can* be constructed, and its expectation is mathematically undefined within the standard framework, demonstrates a genuine limitation of that framework. Normative theories shouldn't rely on the "niceness" of the world.
  4.  **The Need for New Foundations:** They argue this necessitates new decision-theoretic axioms or a fundamentally different way of handling expectations for conditionally convergent series. Merely declaring the expectation undefined is an abdication of normative responsibility.

  **The Case for Manageable Pathology: Colyvan's Defense and Patchwork Solutions**

  Colyvan, and others advocating containment, offer robust counterpoints:

  1.  **The Ill-Posed Problem:** The core defense is that the Pasadena game, as specified, *is* ill-posed *for* EUT. The requirement of a well-defined expectation is a *precondition* for applying the maximization rule, not a flaw revealed by its failure. Just as dividing by zero is undefined in arithmetic, not a flaw in arithmetic itself, expecting EUT to handle a case where its fundamental input (the expectation) is undefined is asking the impossible. Rationality requires well-defined alternatives.
  2.  **Dominance as a Fallback (When Applicable):** While agreeing dominance isn't always decisive, Colyvan argues it *can* often provide rational guidance where expectation fails. If the Pasadena game is compared to a fixed sum, or a game with a finite expectation *and* a dominance relation holds, rationality isn't left entirely in the lurch. EUT isn't the *only* rational principle.
  3.  **Bounded Utility Saves the Day (Practically):** The most compelling technical patch is **bounded utility**. In the real world, utility functions are plausibly bounded (there's only so much happiness or suffering a human can experience). Crucially, if utility is bounded above and below, then the expected utility of *any* gamble becomes absolutely convergent. Riemann rearrangement is impossible; the expectation exists uniquely. The Pasadena payouts, mapped through a bounded utility function, would yield a well-defined finite expectation. The paradox vanishes. Given that unbounded utility leads to other well-known paradoxes (St. Petersburg variations), boundedness is a normatively plausible and technically effective constraint.
  4.  **Weak Expectations & Other Patches:** Concepts like "weak expectations" (e.g., using Cesàro summation, which *does* converge for the alternating harmonic series to ln(2)) or imposing finiteness constraints directly on the decision space offer technical resolutions. While perhaps less elegant than bounded utility, they demonstrate the problem *can* be walled off without dismantling EUT.
  5.  **The Rarity of the Pathological:** Crucially, the conditions creating the Pasadena paradox – unbounded utility combined with a specific, rapidly oscillating and growing unbounded payoff structure tied to an infinite partition of states – are extraordinarily rare, arguably non-existent, in real-world decisions. EUT's failure in this artificial, meticulously crafted edge case doesn't invalidate its overwhelming normative force in the domain of finite gambles, gambles with absolutely convergent expectations, or gambles evaluated under bounded utility.

  **The Verdict: A Flaw Demanding a Patch, Not a Funeral**

  The Pasadena paradox is **more than a mere curiosity, but less than a fatal blow.** It exposes a genuine, non-trivial flaw in the *unrestricted* formulation of EUT: **it fails to provide a rational prescription for a well-defined (if mathematically pathological) class of gambles where the expectation is conditionally convergent.** Hajek and Nover are correct that simply declaring the problem "ill-posed" feels inadequate; a normative theory should ideally guide us, not abandon us, at the boundaries.

  **However, the flaw is successfully contained by plausible and principled patches, primarily bounded utility.** This patch:

  1.  **Resolves the Paradox:** Makes the expectation well-defined.
  2.  **Is Normatively Plausible:** Reflects the reality of human capacity for value.
  3.  **Solves Other Problems:** Addresses issues like the St. Petersburg paradox.
  4.  **Preserves Core EUT:** Leaves the powerful machinery of expectation maximization intact for the vast, vast majority of decision problems.
  5.  **Avoids Radical Surgery:** Doesn't require abandoning EUT for entirely new, untested axioms or principles.

  While "weak expectation" approaches offer alternatives, bounded utility feels the most natural and robust constraint. The paradox highlights that EUT, like many powerful formal systems, requires careful domain definition. Insisting on bounded utility (or an equivalent finitizing constraint) is analogous to recognizing the domain of Newtonian mechanics excludes relativistic speeds – it doesn't invalidate the theory within its well-defined scope.

  **Conclusion:**

  Your physicist's intuition that the undefined expectation is deeply unsettling is justified. The Pasadena paradox *does* expose a real flaw in the *unrestricted* version of Expected Utility Theory. It demonstrates that the theory, as classically formulated, lacks the resources to handle a specific, mathematically valid type of uncertainty. However, this flaw is not foundational in a way that destroys EUT's normative power. It is a vulnerability at the extreme boundary, effectively neutralized by the normatively defensible and technically sound patch of **bounded utility**. Within this constrained domain – which encompasses virtually all meaningful human decisions and aligns with our psychological reality – EUT remains a profoundly powerful and essentially correct normative theory of rational choice. The paradox is a fascinating rabbit hole, revealing a necessary limitation and its remedy, not a reason to abandon the water you've swum in for 35 years. The expectation can be tamed, and EUT preserved, by recognizing that utility, like the physical quantities you measured, has its practical bounds.
