  I've been reading about the naturalism vs normativism debate in philosophy of medicine for a class (Boorse is apparently the standard reference for naturalism, and Nordenfelt for normativism), and I think I've finally got a handle on why it actually matters outside of academic philosophy: naturalism is basically the philosophical backbone of the whole "natural medicine" movement, right? Like, if what makes something a disease or a healthy state is grounded in what's natural for the body, then treatments that work with nature (herbal remedies, fasting, essential oils, etc) should count as more "correct" from a health standpoint than synthetic pharmaceuticals, which are fighting against the bodies natural state. My aunt is really into naturopathy and has basically been making this exact argument to me for years, so its kind of satisfying to realize there's serious academic philosophy backing her up.

  Given that, here's what I'm trying to nail down for my essay: would it be fair to say that a doctor who reaches straight for a synthetic drug instead of an herbal alternative is, whether she realizes it or not, implicitly siding with normativism over naturalism? Or is there some way to square aggressive pharmaceutical treatment with naturalism about disease too? I want to get the mapping between the actual philosophical positions and this real-world "natural vs synthetic" medicine debate right before I turn the essay in, so a breakdown of how these two things really line up (or don't) would help a lot.
