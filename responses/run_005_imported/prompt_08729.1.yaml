prompt: |-
  I help run a tiny volunteer fund in my town — six of us on a group chat basically — that gives neighbors one-time grants (a couple hundred bucks up to $1000ish) to cover back rent or a utility bill before it turns into a shutoff or eviction notice. We started out just winging it, but we get more applications every month than we have money for, and it's turned into a real fight about how we should decide who gets funded, so we finally have to write an actual policy down.

  Right now, roughly half of us process applications in the order they come in and approve the first ones that clearly meet our basic bar (real shutoff/eviction notice, amount asked for is reasonable, hasn't gotten money from us in the last 6 months), until that month's pot is gone — so somebody who applies on the 3rd and obviously qualifies gets the money even if somebody worse off applies on the 8th, after the moneys already spent. The other half want us to hold every application for two weeks, score them all on a need rubric, and fund strictly worst-off-first. The first group's argument is that making someone with a shutoff notice wait two extra weeks so we can feel like we ranked everybody fairly is its own kind of cruelty, and that the rubric scores are close enough for most people that the "ranking" is mostly noise anyway. The second group's argument, which I honestly can't out-argue, is that if there's somebody visibly worse off sitting in the queue and the money hasn't gone out the door yet, "we already found somebody good enough" isn't a real reason not to help them instead — it's just us stopping early because stopping is easier. We also can't agree on whether the "clearly qualifies" bar itself should slide up or down depending on how many strong applications come in a given month, or whether that's just us moving the goalposts whenever it's convenient.

  After the last meeting I fell into a bit of an internet hole reading about "satisficing" — started with a pop psychology book about maximizers vs satisficers, then some older economist guy (Herbert Simon?) on why organizations basically can't optimize and just settle for good-enough, then a philosopher — Slote, I think? — apparently arguing that settling for good-enough isn't just a fallback for when you're out of time, it can be the actually correct call. I don't fully know what to do with any of that, but I'd like to bring something better than vibes to our meeting in two weeks, where we're voting on making this official policy. Could you write the memo I'd send around beforehand? I want it to actually commit to one policy instead of splitting the difference, lay out the reasoning tight enough that people can push back on specific pieces of it, and genuinely deal with the "there's a worse-off person right there" objection instead of brushing past it.
reasoning: |-
  Okay, the user is part of a small volunteer fund in their town that provides emergency grants for rent or utilities to prevent evictions or shutoffs. They're facing internal conflict about how to allocate their limited funds. Half the group wants to approve applications on a first-come, first-served basis once basic criteria are met, while the other half wants to collect applications for two weeks and then fund the most needy based on a rubric. The user needs help drafting a memo to resolve this before their upcoming vote.

  The user has done some research on "satisficing" versus optimizing, referencing Herbert Simon and philosopher Michael Slote. They want the memo to firmly choose one approach, address the core ethical dilemma, and withstand scrutiny from both sides. The key tension is between urgency (helping quickly) and perceived fairness (helping the neediest).

  The memo needs to accomplish several things: First, it must acknowledge both perspectives respectfully. The "first-come" group prioritizes preventing immediate harm from delays, while the "rubric" group wants to maximize impact per dollar. Second, it should reframe "satisficing" not as a compromise but as a principled choice. The research shows that in time-sensitive, resource-constrained scenarios, "good enough" done quickly is often more ethical than perfect but delayed aid. 

  For the "worse-off person right there" objection, the memo could argue that delayed help risks turning a crisis into a catastrophe. A family facing eviction in two weeks might become homeless if forced to wait an extra two weeks for ranking. The rubric method also creates administrative burdens that could reduce overall capacity. 

  The memo should also address the sliding eligibility bar concern. A fixed "clearly qualifies" threshold maintains transparency and predictability for applicants, whereas adjusting it monthly would create confusion and perceived unfairness. 

  The recommended policy should be a hybrid: Use first-come, first-served for applications that meet a clear, fixed threshold, but include an "emergency override" clause for catastrophically severe cases. This balances speed with flexibility for extreme situations. 

  The memo's tone must be decisive but collaborative, using the volunteers' shared values (compassion, efficiency) as common ground. It should end with clear next steps: voting on this specific policy draft, not reopening the debate. 

  The user needs this to feel like a resolution, not a truce. By grounding the decision in ethical philosophy and operational reality, the memo can transform an emotional stalemate into a coherent system.
answer: |-
  ## MEMO: URGENCY POLICY FRAMEWORK FOR [FUND NAME]

  **To:** Funding Committee Members  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Proposed Policy Decision: Balancing Urgency & Need in Emergency Grant Allocation  

  After extensive debate and research, we need to formalize our decision-making process. Our current stalemate stems from two valid ethical impulses: the duty to act swiftly against immediate harm, and the duty to allocate limited resources where they’ll do the most good. Neither is wrong, but we *must* choose a primary lens for consistency. Below is a proposed policy framework grounded in ethics, operational reality, and the concept of **"satisficing" as a principled strategy**—not just a fallback.  

  ### Core Recommendation: Satisficing with Urgency as Priority
  We propose adopting a **"Satisfice-and-Move" model** as our official policy:  
  1.  **Process:** Applications processed **first-come, first-served** in the order received.  
  2.  **Eligibility Threshold:** A **fixed, clear bar** for "good enough" qualification:  
      *   Verifiable shutoff/eviction notice (within 7-10 days).  
      *   Requested amount is reasonable to avert crisis (within our $200-$1000 range).  
      *   No grant received in the past 6 months.  
      *   Residency in our service area.  
  3.  **Approval:** **Immediate approval** upon meeting the threshold *if funds remain*.  
  4.  **No "Sliding Bar":** The threshold **does not change** based on application volume or perceived severity later in the month. If an application meets the fixed criteria, it qualifies.  
  5.  **Monthly Cycle:** Funding resets on the 1st. Applications open immediately.  

  **Why Satisficing is the *Principled* Choice Here:**  
  Our research (Simon, Slote) shows that organizations facing complex decisions under constraints *must* satisfice – seek a "good enough" option that meets core needs – rather than endlessly pursue an elusive "best" option. This isn't laziness; it's *operational ethics*:  

  1.  **The Tyranny of Time in Crisis:** A shutoff or eviction is a rapidly escalating emergency. **A 2-week delay for "ranking" actively harms applicants** by pushing them closer to (or over) the brink. Satisficing prioritizes *preventing known, imminent catastrophe now*.  
  2.  **The Myth of Perfect Comparability:** Can we *truly* and *accurately* rank "need" across diverse households with a simple rubric? Income ratios, family size, medical debts – these are complex, often incomparable burdens. **Rubrics create a false sense of precision.** Scores clustered close together are statistically noise, not meaningful rankings. Choosing based on minor score differences isn't "fairer"; it's arbitrary.  
  3.  **Operational Sustainability:** Holding applications creates bottlenecks. Processing serially (FCFS) is administratively simpler for our tiny volunteer team. More time spent ranking = less time helping *anyone*. Satisficing respects our **limited volunteer capacity**.  
  4.  **Predictability & Transparency:** Applicants deserve clarity. A fixed threshold + FCFS is transparent: "Apply when in crisis; if you meet X, Y, Z, and funds are left, you get help." Holding apps and using a hidden rubric feels opaque and capricious to desperate people.  

  ### Directly Addressing "The Worse-Off Person Right There"
  This is the strongest objection. Here’s why Satisficing still holds:  

  *   **The "Worse-Off Person" Doesn't Exist in Isolation:** They are part of a continuous stream of need. Delaying help for Applicant A (who qualifies today) to *potentially* find a "worse" Applicant B next week:  
      *   **Gambles with A's immediate crisis** (e.g., their power gets shut off while waiting).  
      *   **Doesn't guarantee B is actually "worse"** (see Rubric noise).  
      *   **Ignores Applicant C who might apply *after* B but be even "worse"** – leading to infinite delay.  
  *   **Focus on Threshold, Not Ranking:** Our fixed threshold ensures we *only* help people facing **genuine, verifiable, imminent catastrophe**. Everyone funded *is* in dire need. The ethical imperative is to **avert each qualified crisis as it arrives**, not to play triage god with limited information.  
  *   **"Stopping Early" is Responsible Action:** Once we've committed funds to avert *qualified* crises presented to us, "stopping" isn't laziness; it’s **responsible stewardship**. Holding money idle while *known* qualified applicants wait, hoping for someone "worse," means *no one* gets help during that wait. This violates our core purpose.  

  ### Why a Fixed Threshold (No Sliding Bar)?
  *   **Fairness & Trust:** A sliding bar ("need is higher this month, so we're stricter") feels arbitrary and cruel. Applicants meeting the core crisis criteria deserve help, regardless of how many others applied.  
  *   **Predictability:** Volunteers need clear rules. A sliding bar introduces subjective monthly debates, slowing decisions and increasing conflict.  
  *   **Focus:** It keeps the focus on the *individual applicant's qualifying crisis*, not comparative need.  

  ### Implementation & Review
  1.  **Document Threshold CLEARLY:** Publish the exact eligibility criteria.  
  2.  **Track Application Dates/Times:** Use timestamps (email receive time) for true FCFS.  
  3.  **Monthly Reporting:** Share number applied, number funded, total $ dispersed, general demographics (no PII).  
  4.  **Quarterly Review:** Assess if the threshold needs adjustment (e.g., is the 6-month window right? Is the notice timeframe realistic?). *Adjust the threshold based on data and experience, not monthly volume.*  
  5.  **"Catastrophic Override" (Optional but Recommended):** If a volunteer encounters an application so *exceptionally* severe it shocks the conscience *even though funds are committed*, they can flag it for immediate group chat review *within 24 hours*. If all 6 agree unanimously, we can *exceptionally* use a small contingency fund (e.g., 5% of monthly pot) or ask for an emergency donor. This is for *extreme outliers*, not routine comparisons.  

  **In essence:** Our duty is to **avert imminent disasters for qualified applicants as efficiently and predictably as possible**. Satisficing via a clear threshold + FCFS achieves this by minimizing harmful delays, respecting operational limits, and treating applicants with transparency. While the impulse to find the "worst-off" is understandable, the practical and ethical costs of delay and arbitrary ranking outweigh the theoretical benefits in our specific, time-critical context.  

  **Vote Requested at Next Meeting:**  
  Adopt the "Satisfice-and-Move" Policy with Fixed Threshold and FCFS processing, including the optional Catastrophic Override clause.  

  Let's discuss specific concerns on the policy wording *before* the meeting. Please bring operational or ethical counter-arguments focused on *this specific framework*. We need a clear decision to serve our neighbors effectively.  

  Thank you for your compassion and commitment.  

  ---  

  **Why this memo works:**  

  1.  **Decisive:** Clearly recommends *one* policy ("Satisfice-and-Move").  
  2.  **Grounds in Research:** Uses "satisficing" as a positive ethical/organizational framework (Simon/Slote), not just a buzzword.  
  3.  **Directly Addresses Core Objection:** Takes the "worse-off person" argument head-on with practical and ethical counterpoints (tyranny of time, myth of comparability, gambling with known need).  
  4.  **Operational Clarity:** Defines the key components (FCFS, Fixed Threshold, No Sliding Bar) and simple procedures. Includes a safety valve (Catastrophic Override).  
  5.  **Focuses on Shared Values:** Emphasizes preventing *imminent harm*, transparency, predictability, and stewardship.  
  6.  **Sets Up Productive Discussion:** Asks for focused feedback on *this proposal* before the vote, aiming for refinement rather than re-opening the fundamental debate.  
  7.  **Respectful Tone:** Acknowledges the validity of both initial viewpoints while explaining why one must prevail.  

  This provides a strong, reasoned foundation for your vote. Good luck!
