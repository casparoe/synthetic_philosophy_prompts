prompt: |-
  So I went down a rabbit hole this weekend on this "Kripkenstein" rule-following thing (started from a philosophy podcast, obviously, because where else) and now it's stuck in my head because it smells exactly like a bug I've hit at work, just wearing a trenchcoat. The setup: I've only ever added numbers below 57 in my life, so my past behavior is 100% consistent with me having computed "plus" the whole time, OR some deviant function "quus" that agrees with plus on every pair I've actually tried but returns 5 the moment either number is 57 or bigger. Basically my brain is a function with zero test coverage past a certain branch, and apparently there's no fact about which function I "really" meant. Fine, I get that part immediately -- any dev who's shipped code that passed all the tests but was secretly wrong on inputs nobody tried yet knows that feeling in their bones.

  What I don't get is why the obvious programmer move -- "just point at the actual algorithm/disposition physically sitting in my head, that settles it" -- apparently doesn't work, and Kripke supposedly has a real argument for why not, something about dispositions being finite and about "normativity" (whatever that means, is vs ought?) rather than him just being difficult. And then instead of actually resolving the paradox he pulls this move where he says ok fine, there's no fact, but meaning-talk is still legit because it's licensed by the community rather than truth conditions -- his "skeptical solution" as opposed to a "straight" one -- and somehow this means a guy alone on a desert island literally can't mean anything by "plus," which sounds insane and like he's just relocating the problem rather then solving it. Can you actually walk me through, slowly, with coding-flavored examples where it helps: (1) why the dispositional/"check the algorithm" move fails, (2) what a "straight" solution would even look like vs the "skeptical" one Kripke goes with, and (3) why the community suddenly becomes load-bearing when the original puzzle seemed to be entirely inside one person's head? I don't want the wikipedia-summary version, I want the actual mechanics of why each move fails.
