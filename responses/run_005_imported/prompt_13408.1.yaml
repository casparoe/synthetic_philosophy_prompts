  ### Dialogue: Resolute vs Traditional on the Money Pump

  **Characters:**  
  - **Resolute (R):** Defends resolute choice as vindicating cyclic preferences.  
  - **Traditional (T):** Argues money pumps require transitivity.  

  **Setting:**  
  A philosophy seminar room. The pair reengage over coffee, using a concrete case: an agent with cyclic preferences over goods A, B, and C:  
  - A ≻ B (prefers A to B),  
  - B ≻ C (prefers B to C),  
  - C ≻ A (prefers C to A).  

  Trades are sequential with a $1 fee:  
  1. Trade A (+$1) for C.  
  2. Trade C (+$1) for B.  
  3. Trade B (+$1) for A.  
  Starting with A, myopic choice leads back to A minus $3.  

  ---

  **T:** Let’s recap: Your resolute agent commits upfront to a plan to avoid the pump. But that just hides the problem. At step 1, they’re offered A-for-C plus $1. Their *momentary* preference favors it—C ≻ A, so C-with-$1-loss ≻ A. Yet they refuse, violating their own preference! If cyclic preferences never manifest in choice when it counts, aren’t they inert? Preferences must explain actions, not be overridden by "policies."  

  **R:** You’re conflating synchronic and diachronic rationality. At each moment, the preference *explains the temptation*: yes, C ≻ A makes the trade appealing. But the agent knows myopia leads to disaster. Resoluteness isn’t overriding—it’s *enlightened* self-governance. The cyclic preferences are real, but context-dependent. In isolated pairs, they’d manifest (e.g., if *only* A vs. C were offered, they’d trade). The sequential context demands a plan.  

  **T:** Fine, but your “enlightenment” undermines your defense. If the agent must *suppress* their momentary preference to avoid exploitation, that proves cyclic preferences are dysfunctional. Transitivity isn’t a “policy”—it’s a synchronic constraint ensuring preferences cohere *without* external fixes. Resoluteness patches a leak; it doesn’t prove the boat was seaworthy.  

  **R:** Not so. Consider the bundle wrinkle: all three trades offered at once as a single deal—pay $3 to start with A and end with A. Would anyone accept? Of course not! But that’s not because preferences are transitive. Even a cyclic agent refuses: they prefer more money, so A-with-$3-loss ≺ A. Yet this refusal doesn’t erase their cyclic pairwise rankings. Similarly, in the sequence, resolute refusal is rational *because* the net outcome (A minus $3) is worse, not because pairwise rankings changed.  

  **T:** Ah, the bundle! You think this helps you, but it exposes the flaw. In the bundle, the agent compares two outcomes:  
  - *Status quo*: A with initial wealth.  
  - *Bundle*: A with $3 less wealth.  
  They pick the status quo. But this reveals an *all-things-considered* preference against the cycle. Yet in pairwise comparisons, they have A ≻ B, B ≻ C, C ≻ A—which, if fundamental, should imply *some* gain from the cycle. But there’s none! The bundle forces synchronic evaluation, showing cyclic preferences don’t cohere: sacrificing $3 for no change is irrational, and pairwise rankings can’t justify it. Resoluteness just mimics this coherence retroactively.  

  **R:** You’re misrepresenting the cyclic agent. The bundle doesn’t test pairwise preferences—it tests a *net outcome*. The agent dislikes the bundle’s outcome (A minus $3) for independent reasons (money preference), not because they’ve abandoned cyclic goods-preferences. In fact, if you offered a bundle that swapped A for C *without* a fee, they’d take it—because C ≻ A! The fee is the issue. Similarly, in the sequence, they might accept a *single* trade if it’s beneficial (e.g., A to C minus $1), but reject the full cycle. Resoluteness enables this selectivity.  

  **T:** But that’s my point! If the agent would accept a fee-based A-for-C trade *in isolation* (since C ≻ A), but rejects the *cycle* bundle, their “preferences” are fragmentary. In transitivity, preferences are stable across contexts: if A ≻ B ≻ C ≻ A is irrational in the bundle, it’s irrational everywhere. Resoluteness is just rationalization—you’re admitting the rankings are defective by needing a “policy” to avoid their implications.  

  **R:** Let’s press your bundle point. Suppose we offer three *separate* bundles simultaneously:  
  1. A-for-C plus $1.  
  2. C-for-B plus $1.  
  3. B-for-A plus $1.  
  The agent evaluates each pairwise: they’d accept each trade (since C ≻ A, etc., and fees are small). But accepting all three lands them back at A minus $3—the same as the cycle bundle! Yet they might accept all if not forced to see the whole. Isn’t that incoherent?  

  **T:** Exactly! And it’s incoherent because cyclic preferences *are* irrational. Transitivity prevents this: if A ≻ B ≻ C, they’d reject B-for-C and A-for-C trades outright. No policy needed.  

  **R:** But your transitivity “solution” is arbitrary. Why not demand other constraints? Resoluteness handles it: the agent sees the exploitation risk and commits to no trades, or only profitable ones. In the simultaneous bundles, they might accept one (e.g., A-for-C minus $1) and reject the rest, ending better off. Cyclic preferences aren’t incoherent—they’re context-sensitive. The money pump only threatens myopic agents, not rational ones with plans.  

  **T:** Then answer this: In the sequence, if the agent commits to “only trade if net beneficial,” they might accept step 1 (A to C minus $1) but reject step 2 (C to B minus $1), since B ≻ C might not offset the fee. But after step 1, they hold C, and their preference says B ≻ C—so why *wouldn’t* they trade? If they override it, preferences don’t explain actions. If they don’t, they risk the pump. Resoluteness is either self-defeating or irrelevant.  

  **R:** Not irrelevant—adaptive. Post-trade, they have C. Their preference B ≻ C makes trading appealing, but they recognize that trading would likely lead to step 3 (B to A minus $1), and since A ≻ B, they’d accept it, netting a loss. So they reject step 2 *not* by overriding B ≻ C, but because the *prospective outcome* (A minus $2) is worse than holding C. Preferences inform, but don’t dictate, choices in extended contexts. This isn’t transitivity—it’s foresight.  

  **T:** But foresight relies on *evaluating outcomes*, which cyclic preferences can’t do consistently. In your scenario, they compare holding C to the *sequence* ending in A-minus-$2. But if they truly have C ≻ A, then C ≻ A-minus-$2, so stopping at C is better. Yet if they have B ≻ C, why is holding C better than trading to B-minus-$1? Your agent is secretly using a stable ranking—C > B-minus-$1?—which is transitive! Resoluteness smuggles in coherence.  

  **R:** No, it uses the same cyclic preferences, applied diachronically. They prefer B to C, but *not* B-minus-$1 to C, because money matters. After step 1, they have C. Trading to B costs $1, so they compare C to B-minus-$1. Since B ≻ C doesn’t imply B-minus-$1 ≻ C (the fee may outweigh the gain), they might keep C. No transitivity needed—just pairwise comparisons with fees. The cycle persists: they’d still prefer B to C in a fee-free choice.  

  **T:** So in the bundle case, where all trades are simultaneous, they reject the cycle because fees accumulate. But if preferences are cyclic, why does fee accumulation “break” the cycle? It’s ad hoc. Transitivity explains it naturally: outcomes are evaluated holistically, and A ≻ A-minus-$3 is rational. Your defense reduces to “cyclic preferences work as long as we ignore their implications in dynamic or bundled contexts”—which is where rationality is tested.  

  **R:** And your demand for universal transitivity is a straitjacket. Real agents have complex preferences. Resoluteness handles them without exploitation. The bundle shows that *any* agent rejects dominated outcomes, cyclic or not. That doesn’t impeach pairwise rankings—it just means money pumps are a pathology of myopia, not of cyclic preferences per se.  

  **T:** Then we remain at an impasse. But concede this: the money pump shows that cyclic preferences *require* diachronic management to avoid irrationality, while transitive preferences don’t. That’s a cost.  

  **R:** I’ll concede it’s a *feature*: rationality isn’t just about preferences; it’s about planning. Your “cost” is just the price of richer psychology.  

  *They sip coffee, neither yielding ground.*  

  ---  
  **Key Issues Explored:**  
  1. **Resolute’s defense:** Cyclic preferences are viable with commitment; money pumps exploit myopia, not cyclic rankings.  
  2. **Traditional’s challenge:** Resoluteness overrides momentary preferences, making cyclic rankings inert or incoherent.  
  3. **Bundle wrinkle:** Both agree the bundle (net loss) is rejected, but Resolute argues this is consistent with cyclic preferences plus money sensitivity, while Traditional insists it reveals a synchronic incoherence resoluteness can’t fix.  
  4. **No clear winner:** Resolute emphasizes diachronic rationality; Traditional demands synchronic constraints.
