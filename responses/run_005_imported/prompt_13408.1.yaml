  Alternatively, consider a different cycle: the agent might be made to go around the cycle multiple times. But if they are resolute, they can commit to not start or to stop after one cycle.

  I think the resolute defender has a point.

  But then the bundle wrinkle: if offered the entire cycle as a bundle (pay 3ε to go from A to A), they would refuse. And that's what the resolute agent does in the sequential case by not making any trade or by making only a partial trade. So it's consistent.

  Therefore, the dialogue may end with the resolute defender standing firm.

  Let's write accordingly.
