answer: |-
  You've hit on a crucial tension in decision theory! Your skepticism about UDT "throwing away information" is understandable, but the key lies in understanding *why* UDT behaves that way in scenarios like Counterfactual Mugging and what problem it solves that CDT and EDT don't. Let's break it down:

  1.  **The Core Problem UDT Solves: Logical Counterfactuals and Predictors:**
      *   CDT and EDT fundamentally base decisions only on the *actual* causal structure or evidence *within the world the agent finds itself in*. They are "updateful."
      *   UDT tackles situations where the *agent's own decision algorithm is known or predicted by another entity (like Omega)* *before* the agent observes the relevant information. The outcome depends on what the agent *would have done* in *counterfactual* situations it now knows didn't occur (like heads in the Mugging).
      *   Omega isn't offering the deal based on what you'll do *now* (after seeing tails), but based on what your *entire decision policy* dictates you *would do* in *both* possible worlds (heads and tails) *before you see the coin flip*. Your policy is evaluated *from the prior perspective*.

  2.  **Why "Updatelessness" Isn't Throwing Away Information (In This Context):**
      *   **Information is Already Accounted For in the Policy:** When a UDT agent computes its optimal policy *from the prior*, it explicitly considers *all possible observations it might make* (heads or tails) and what action it *should take conditional on each observation* to maximize *overall expected utility*. The information *is* used, but *in the planning stage* to define the optimal response function.
      *   **The "Information" in Counterfactual Mugging is Fatal to the Deal:** The "information" you get (tails) tells you definitively you are in a world where paying nets you -$100 and no gain. *Any* policy that conditions its action *on seeing tails* by *not paying* gets -$100 in the tails world and $0 in the heads world (because Omega, knowing your policy refuses on tails, never offers the deal when heads). Expected utility: -$50.
      *   **The "Commitment" is What Enables the Win:** The *only* way to get the $10,000 in the heads world is to have a policy that *commits* to paying if tails *even after seeing tails*. Omega, seeing *that* policy, *will* offer the deal when heads. Expected utility: (0.5 * $10,000) + (0.5 * -$100) = $4,950. This vastly outperforms the "updateful" policy.
      *   **"Responding to Evidence" Breaks the Necessary Precommitment:** If you design an agent that "responds to what it learns," meaning it sees tails and then re-evaluates "what's best *now*," it *will always refuse to pay* in the tails world. Omega knows this, so it never offers the lucrative deal in the heads world. The agent that "uses the information" *destroys the possibility of the favorable counterfactual*.

  3.  **UDT vs. CDT/EDT in Counterfactual Mugging:**
      *   **CDT:** Focuses on causal impact *in the current world*. "Paying $100 causes me to lose $100. It has no causal link to the coin flip (which is in the past) or any hypothetical heads world. Don't pay." Loses $100. Gets $0 in heads worlds (no deal offered).
      *   **EDT:** Focuses on evidence *in the current world*. "Paying $100 is evidence that... what? The coin was tails? I already *know* that. Paying is strongly correlated with losing $100. Don't pay." Same outcome as CDT.
      *   **UDT:** "My decision function must specify an action for both heads and tails. If I specify 'Pay on Tails,' Omega offers the deal on Heads and I get $10,000 there. I lose $100 on Tails. Net expected gain: $4,950. If I specify 'Don't Pay on Tails,' Omega *doesn't* offer the deal on Heads. I get $0 on Heads and $0 on Tails (since I don't pay). Net expected gain: $0. 'Pay on Tails' is the better policy." Pays on Tails, nets -$100 but only because it secured the $10,000 in the counterfactual Heads world via its precommitment.

  4.  **When is UDT Actually Better? The Core Insight:**
      UDT shines in scenarios involving:
      *   **Perfect Predictors (Omega):** Entities that know your decision algorithm before you observe key facts.
      *   **Logical Dependence:** Situations where the outcome depends on the *logical relationship* between your decision in *this* world and what your algorithm dictates in a *counterfactual* world.
      *   **Coordination Problems:** Problems where multiple agents face the same dilemma and need to coordinate on a strategy that works best globally, even if locally suboptimal (e.g., variants of Prisoner's Dilemma with pre-commitment).
      *   **Self-Referential Decisions:** Situations where the outcome depends on the consistency or properties of your own decision-making algorithm.

      In these cases, "responding to evidence" *after the predictor has acted* is too late. The predictor has already made its move based on your entire policy. Optimizing locally in each possible world (like CDT/EDT do) leads to globally worse outcomes because it fails to establish the beneficial logical dependencies between worlds.

  5.  **Is UDT "Throwing Away Information"? A Nuanced Answer:**
      *   **In the narrow sense of *using observed information to change the intended action within the current world*:** Yes, UDT ignores this *local* information *for the sake of maintaining a globally optimal precommitment*.
      *   **In the broader sense of *using information to maximize expected utility*:** **No.** UDT uses *all* information available at the *time of policy formulation* (the prior, the game structure, the knowledge of predictors) to compute the *optimal mapping from future observations to actions*. It throws away *local* information *only when* using it would break the logical counterfactual dependency that makes the globally optimal outcome possible. It's a strategic sacrifice.

  **Why it's an Advance:**

  UDT provides a formal framework for making optimal decisions in precisely those tricky scenarios involving predictors, logical counterfactuals, and self-referential reasoning that cause CDT and EDT to fail demonstrably (like Counterfactual Mugging and Newcomb-like problems). It recognizes that optimality sometimes requires binding yourself to a course of action *before* you have all the information, specifically *because* other agents (or the environment) anticipate your future responses. It's not that UDT agents *never* update; it's that they choose a policy *in advance* that specifies how they *will* update, knowing that the *existence* of that specific update rule is what unlocks better outcomes in counterfactual branches.

  Think of it like signing an enforceable contract before an uncertain event. Signing the contract ("pay if tails") locks you into an action that might be locally bad later, but it's the only way to get the other party to take the beneficial action in the favorable scenario ("pay $10,000 if heads"). Breaking the contract later ("not paying when tails") might feel locally optimal, but it destroys trust and ensures you *never* get the good deal. UDT formalizes this "contractual" commitment at the level of decision algorithms, which is essential for handling superintelligent predictors or coordinating with copies of yourself – key concerns in AI safety.
