answer: |-
  You've accurately captured the core *logic* of Aquinas's position on tyranny, but his actual stance on **private citizens killing a ruler** is significantly more nuanced and restrictive than your summary (or Mariana's later position). Here's a reconstruction of his natural-law argument and its crucial conditions:

  1.  **The Foundation of Authority in Natural Law:**
      *   **Purpose of Government:** Political authority exists *solely* for the "common good" (ST I-II, Q. 90, A. 2; De Regno I, 1). This is its natural law justification.
      *   **Source of Legitimacy:** A ruler's right to command ("auctoritas") derives *from* this service to the common good and the law (divine, natural, and just human law), not merely from power or title (ST II-II, Q. 42, A. 2, ad 3; De Regno I, 6).

  2.  **Tyranny as a Perversion of Authority:**
      *   **Forfeiture of Legitimacy:** When a ruler governs "not for the common good, but for his own private advantage," he ceases to be a true ruler ("rector") or public authority figure (ST II-II, Q. 42, A. 2). He becomes a "tyrant."
      *   **Status as Aggressor:** By subverting the purpose of government and acting against the common good, the tyrant effectively wages war *against* the community he is supposed to serve (ST II-II, Q. 42, A. 2; De Regno I, 6). He is no longer a lawful authority but an illegitimate aggressor ("homo tyrannus").

  3.  **The Argument for Licitness of Killing:**
      *   **Self-Defense/Defense of the Community Analogy:** Natural law permits killing an unjust aggressor in self-defense or defense of others, provided the intent is defense and the force used is proportionate (ST II-II, Q. 64, A. 7). Aquinas explicitly extends this principle to the tyrant: "Therefore, to proceed against the cruelty of tyrants is an action to be undertaken, not through the private presumption of a few, but by public authority... **Unless perhaps it be that he who kills a tyrant undertakes the deed to deliver his country, and incurs no danger, or rather gains glory and reward.**" (Commentary on the Sentences of Peter Lombard, II, dist. 44, qu. 2, a. 2 - *This is the key text often cited for the "licit kill" argument, though note the context*).
      *   **The Core Logic:** Since the tyrant is an unjust aggressor against the *res publica* (the commonwealth), killing him *can* be likened to killing any other criminal aggressor endangering the community. His forfeiture of legitimate authority removes the special protection rulers normally enjoy.

  4.  **Crucial Conditions and Restrictions on Private Action (Where Aquinas Differs Sharply from Mariana):**
      Aquinas places **strict and significant conditions** on the licitness of killing a tyrant, *especially* by a private citizen:
      *   **No "Private Presumption" (Privata Praesumptio):** This is the most critical point. Aquinas **explicitly rejects** the idea that individuals can act on their own private judgment: "to proceed against the cruelty of tyrants is an action to be undertaken, **not through the private presumption of a few**, but by public authority" (Comm. Sent. II, dist. 44, qu. 2, a. 2). The *default* mode of action is through constituted public authority.
      *   **Public Authority as the Primary Agent:** Removal, including forceful removal, is ideally the responsibility of the community acting through its legitimate representatives or institutions (like nobles, estates, or even a higher temporal authority like the Emperor). This is the "public authority" path (De Regno I, 6-7).
      *   **Private Action Only as a Last Resort & Under Extreme Duress:** Aquinas *only* countenances private action in the specific scenario where:
          *   **No Recourse to Public Authority Exists:** There is absolutely no way to appeal to any higher or public authority capable of acting (e.g., no nobles, no superior lord, the tyranny is absolute and all institutions are corrupted or cowed).
          *   **The Tyrant's Oppression is Blatant and Intolerable:** The tyranny must be manifestly evident and causing grave, immediate danger to the community.
          *   **Intent is Purely Defensive:** The killer's intent must be solely to liberate the community from imminent, grave danger, not for personal gain, vengeance, or ambition.
          *   **Proportionality and Necessity:** The killing must be the *only* viable means to stop the tyranny and achieve the defense of the community. Lesser means must be impossible.
          *   **Reasonable Hope of Success (Implied):** The action must have a reasonable chance of actually ending the tyranny, not simply provoking worse reprisals. Aquinas warns that private attempts often lead to worse outcomes (De Regno I, 6).
      *   **No General License:** It is **not** a general permission for any individual subject. It's an exceptional, desperate act justified *only* under the specific conditions above, analogous to extreme individual self-defense against an immediate, overwhelming threat when no help is available.

  **Reconstruction of Aquinas's Natural Law Argument Chain:**

  1.  Authority exists *only* for the common good (Natural Law Principle).
  2.  A ruler who governs for private advantage violates this principle.
  3.  Such a ruler forfeits legitimate authority and becomes a tyrant (a private criminal aggressor).
  4.  Natural law permits killing an unjust aggressor in defense of self or others (proportionate, necessary, defensive intent).
  5.  Therefore, *in principle*, killing a tyrant *can* be licit, as he is an aggressor against the community.
  6.  **HOWEVER,** due to the grave disorder and danger involved:
      *   Removal *must* be sought through public authority first.
      *   Private individuals acting alone may only licitly kill a tyrant **if**:
          *   No public recourse exists.
          *   The oppression is extreme and immediate.
          *   The intent is purely defensive (liberating the community).
          *   It is necessary and proportionate (the *only* viable means).
          *   There's a reasonable chance of success without worse evil.

  **Key Difference from Mariana:** While both base authority on the common good, Mariana (in *De Rege et Regis Institutione*) is far more explicit and permissive regarding tyrannicide by private individuals. He argues that a manifest tyrant who seizes power or destroys the state *can* be justly killed by *any* private citizen acting for the public good, with fewer explicit caveats about exhausting public avenues first. Aquinas's position is much more cautious, emphasizing public authority and restricting private action to near-impossible, last-resort scenarios.

  **For Your Seminar:** Emphasize Aquinas's profound **ambivalence**. He lays the *theoretical groundwork* for resistance by establishing the tyrant's forfeiture of legitimacy and the analogy to defense against aggression. However, he is deeply wary of the chaos of private violence and strongly prefers action through established (though perhaps dormant) public mechanisms. The "license" for private citizens is a narrow, perilous exception, not a general rule. This tension between principle and prudence is central to understanding medieval resistance theory.
