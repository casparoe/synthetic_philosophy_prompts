  Below is a draft opinion structured to meet your requirements. It confronts the intention debate directly, rejects evasion, and offers a concrete recommendation while rigorously engaging the strongest counterarguments. The recommendation leans toward withholding the degree, but the reasoning ensures both sides' core concerns are addressed with intellectual honesty.

  ---

  **MEMORANDUM**  
  To: University Honorary Degrees Committee  
  From: [Your Name], Graduate Assessor  
  Subject: Recommendation on Nomination of Lt. Gen. Daniel Ashworth (Ret.)  
  Date: [Current Date]  

  ### I. Core Ethical Conflict  
  The deadlock over Lt. Gen. Ashworth’s nomination hinges on whether his targeting of civilian infrastructure during the [Region] War constitutes *intentional harm to noncombatants as a means to military ends* (per Anscombe’s objection) or a *foreseen but unintended consequence of attacking dual-use targets* (per double-effect reasoning). This is not a dispute about proportionality, historical context, or the value of Ashworth’s post-military work. It is a question of moral intention.  

  ### II. Adjudicating Intention: Memoir vs. Contemporaneous Orders  
  - **Anscombe’s Argument (Withhold Degree)**:  
    Ashworth’s memoir states the broadcaster, power, and water utilities were targeted to “bring the war home to the population and hasten the collapse of its will.” This is a direct admission that *breaking civilian morale* was the chosen mechanism for victory. Anscombe’s position—that intentionally using innocent lives as leverage is murder, irrespective of net lives saved—applies squarely here. Civilian suffering wasn’t a byproduct; it was the instrument. Historical success (ending the war) cannot cleanse this moral violation.  
    **Strongest Counterargument to Engage**: Ashworth’s humanitarian legacy is profound and distinct. Punishing him retroactively ignores 30 years of life-saving diplomacy and implies moral growth is irrelevant.  

  - **Double-Effect Argument (Award Degree)**:  
    Contemporaneous orders framed strikes as degrading “military capability” (e.g., broadcaster as propaganda/command hub, utilities supporting war production). This suggests an intention to weaken the enemy’s *material capacity*, with civilian harm foreseen but not directly willed. Under double effect, such harm is permissible if (a) the act itself (destroying dual-use infrastructure) is good or neutral, (b) the bad effect (civilian deaths) is not intended, and (c) the good effect (swift war termination) outweighs the bad.  
    **Strongest Counterargument to Engage**: Ashworth’s memoir, written decades later, risks anachronism or oversimplification. Judging wartime decisions by peacetime reflections may be unfair, and rejecting the degree discounts his unambiguous post-service contributions to peace.  

  ### III. Why Intention Matters More Than Contemporaneous Framing  
  - The memoir is not merely “thin evidence.” It is a veteran’s reflective admission that undermines the double-effect defense. Wartime orders often employ sanitized language (“degrading capability”) to obscure strategic realities. Ashworth’s candid post-hoc account reveals a deliberate calculus: civilian despair was *instrumentalized* to achieve surrender. This aligns with Anscombe’s critique of “consequentialism” — no good outcome (averted invasion) justifies *choosing* to inflict civilian suffering as a method.  
  - **Rebuttal to “Different Era” Evasion**: The laws of armed conflict then (e.g., Additional Protocol I to the Geneva Conventions) explicitly prohibited attacks causing disproportionate civilian harm or targeting objects indispensable to survival. Ashworth’s strategy tested these boundaries, making ethical scrutiny then *and now* imperative.  

  ### IV. Recommendation: Withhold the Degree, with a Path to Recognition  
  I recommend **withholding the honorary doctorate**, but propose an alternative:  

  #### (A) **Do Not Confer the Degree**  
  Rationale: The university cannot endorse an honorific for actions that, by Ashworth’s own account, treated civilians as a means to an end. Anscombe’s principle—that universities must not honor those who “choose the killing of the innocent as a means to their ends”—retains its force. Awarding the degree implicitly absolves the intentionality revealed in the memoir and risks diminishing the gravity of targeting civilian morale.  

  #### (B) **Concrete Middle Path: Public Symposium + Named Humanitarian Award**  
  To avoid dismissing Ashworth’s humanitarian work and to acknowledge the committee’s divide:  
  1. **Host a University Symposium** on “Ethics in War & Peace: The Legacy of [Campaign Name],” inviting Ashworth to dialogue with critics (e.g., scholars of just war theory, affected regional voices). This confronts history without valorization.  
  2. **Establish a Named Humanitarian Award** in Ashworth’s honor, administered by his mediation institute, funded by the university. This recognizes his post-1990s diplomacy while decoupling it from contested wartime conduct.  

  ### V. Why This Addresses the Strongest Counterarguments  
  - **For Double-Effect Advocates**: The symposium engages their view that Ashworth’s contemporaneous orders reflect licit intent. It allows debate over whether the memoir retroactively mischaracterizes the campaign. The humanitarian award affirms their emphasis on his post-service legacy.  
  - **For Anscombe Advocates**: Withholding the degree upholds the principle that intentional harm to innocents is indefensible. The symposium ensures the university does not “look away” from the campaign’s ethics.  

  ### VI. Conclusion  
  Honorary degrees symbolize institutional values. Awarding one to Ashworth would imply that ends (peace, humanitarianism) absolve morally forbidden means (intentional targeting of civilians). Withholding it is not a condemnation of his entire life but a refusal to whitewash a grave ethical breach. The middle path allows the university to engage this complexity with intellectual courage: examining the past while investing in the future he helped build.  

  ---  
  **Vote Recommendation**: Withhold the honorary doctorate; implement the symposium and humanitarian award.  

