  Diane's final point (point 4) is legally pragmatic. We do need a clear line for transplants and end-of-life care. But I should acknowledge Paul's unease—it feels counterintuitive that a warm body is "dead." Maybe flag how cultural/spiritual views conflict with medical definitions here. 

