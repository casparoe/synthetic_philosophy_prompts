  Still, the complaint raises valid concerns about communication norms. The authors' "everyone does it" defense feels unsatisfying - it ignores how their strong claim might have wasted others' research resources. Maybe the solution is separating the misconduct question from broader scientific discourse issues. 

  I'm considering how to structure the memo: First establish no misconduct occurred per policy. Then acknowledge the legitimate epistemic concern without endorsing the "reckless" framing. Finally, suggest channeling this energy into developing discipline-wide communication standards. 

  The trickiest part is engaging substantively with both positions while maintaining the committee's limited mandate. For the complainants: Their knowledge-standard has merit but is impractical for initial findings. For the authors: Their reasonable-belief stance overlooks how preliminary evidence warrants linguistic caution. 

  Perhaps we can reframe this as an opportunity - using this case to prompt psychology to clarify its assertion norms, similar to how replication standards evolved recently. That turns a contentious complaint into forward-looking policy development. 

  Timeline-wise: The misconduct finding should be closed by Friday's meeting, while the standards discussion could begin next term. That gives everyone a clear path forward without overstepping the committee's role.
