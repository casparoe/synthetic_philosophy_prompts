answer: |-
  The desert highway unspooled before the headlights, a black ribbon under an indifferent sprawl of stars. Inside the cab, the hum of the engine and the rhythmic thump of tires on seams in the asphalt were the only constants. Vera watched the scrubland blur past, the tension from her initial relief at being rescued hardening into something else. Nadia’s challenge hung in the air, thick as the smell of old vinyl and diesel.

  "You recognized it," Nadia stated, her eyes fixed on the road, hands steady on the wheel. Her voice was matter-of-fact, devoid of malice but utterly devoid of concession. "Parfit’s hitchhiker. Stranded soul promises the world *now* to get the ride, then ghosts *later* when the cost comes due. Rational self-interest dictates the ghosting. Every time."

  Vera shifted, the seatbelt digging slightly. "Only if you freeze rationality at the moment of payment," she countered, her voice low but intent. "That's the shortsightedness of causal decision theory. The truly rational move wasn't made *now*, in this cab, promising. It was made *back there*, at the roadside, when I decided to become the kind of person who honours agreements *even when* the immediate incentive vanishes."

  Nadia snorted softly. A coyote, eyes gleaming momentarily in the headlights, darted off the shoulder. "So rationality is just... stubbornness? A pre-commitment to ignore the actual costs and benefits staring you in the face? That sounds less like reason and more like blind faith in a past self who wasn't facing the loss."

  "It’s about *integrity* of the self over time," Vera pressed, leaning forward slightly. The dashboard lights cast sharp angles on her face. "Re-opening the question in town isn't clear thinking, Nadia. It’s evidence the initial decision *wasn’t* truly made. It’s succumbing to temptation, fracturing your agency. The rational person at the roadside binds their future self to the promise."

  "And what binds them?" Nadia’s tone was sharper now. "Warm feelings? Moral rectitude? That’s not decision theory, that’s wishful thinking disguised as strategy. McClennen’s ‘resolute choice’ or Gauthier’s ‘constrained maximizer’ – it’s just dressing up ‘I promised’ as a rational imperative. Once the ride’s done, the cost-benefit sheet is brutally simple: Keep money: +$50. Give money: -$50. Game over. Your ‘binding’ evaporates under that logic."

  Vera met Nadia’s quick, sidelong glance. "You’re reducing rationality to a myopic calculator in a single moment. But rationality isn't just about *this* choice in isolation. It’s about the *policy* that generates choices over time. The best *policy* is to be the person who makes binding agreements and keeps them, because that’s the only way you get rescued in the first place! It’s not some external rule imposed; it’s the output of optimizing for survival and cooperation across *many* situations."

  "Ah," Nadia cut in, a note of triumph in her voice. "The policy. The ‘functional’ or ‘updateless’ dodge. ‘The rational act is whatever the optimal policy outputs.’ Convenient! It lets you sidestep the actual, painful cost-benefit analysis *right here, right now*. You’re telling me rationality demands I ignore the cold, hard facts of this specific situation because of some abstract, timeless rule? That’s not decision-making, Vera, that’s dogma. You’re just outsourcing the stubbornness to a ghost policy."

  Vera felt a flush rise on her neck. "It’s not ignoring facts! It’s recognizing that the *fact* of having adopted that policy *is* the crucial datum. Rejecting it now *is* irrational because it undermines the very structure of trust and commitment that makes mutually beneficial interactions possible. Your ‘cold, hard facts’ only look advantageous *because* you’re ignoring the cost of becoming someone no one can trust!"

  The silence stretched, filled only by the engine and the wind. A road sign flashed past: *Town Limits - 10 Miles*.

  Nadia finally spoke, her voice quieter, almost weary. "Let’s lay the paradox bare then, PhD dropout. *My* theory, the one I teach, the one that says ‘don’t pay’, logically demands that *everyone* become the kind of person who *won’t* pay. Because it’s the ‘rational’ thing in town. But if *everyone* becomes that person... who the hell picks up the hitchhiker in the first place? My theory seems to want a world full of people it deems irrational for acting cooperatively *before* the payoff point."

  "Exactly!" Vera breathed. "Your theory self-destructs. It can’t sustain the very interactions it sometimes needs. It breeds its own undoing. Constrained maximization doesn’t have that flaw. It builds the cooperative world it relies on."

  Nadia shook her head slowly, the green dashboard glow reflecting in her eyes. "Maybe. Or maybe it just papers over the inevitable cracks with wishful thinking. You say the rational person binds their future self. But the future self *is* the one holding the cash, facing the loss. Why *should* that self care about a past decision made under duress, miles back in the dark? Why *shouldn't* they recalculate? Saying ‘I decided then’ doesn’t answer the *now* self’s question: ‘What’s in it for *me*?’ And if the answer is ‘nothing but a fuzzy sense of integrity,’ then causal decision theory wins. Every. Damn. Time. Because the ‘now’ self is always the one holding the money."

  She gestured vaguely ahead. "See those lights? That’s town. In ten minutes, you’re safe. Warm. Near an ATM. And I’m just the sucker who drove you. My theory says you *won’t* pay. Your theory *hopes* you will. But hope isn't a deduction, Vera. And the burden of proof isn't on me to believe in your integrity. It’s on you to prove my cynicism wrong. History’s on my side."

  Vera stared out at the approaching glow on the horizon, the first scattered lights of the outskirts. The intellectual exhilaration curdled into a cold knot of uncertainty. She believed in the logic of the constrained choice, in the rational necessity of binding oneself. But facing Nadia’s weary, unyielding skepticism, honed by real disappointment under these same stars, the theory felt suddenly fragile, abstract. The desert had a way of stripping things bare. The truck slowed slightly, approaching the first stoplight on the edge of town.

  "History might be," Vera said, her voice tight. "But history isn't destiny. Or rationality."

  Nadia didn't look at her, her gaze fixed on the road leading into the lit streets. "We'll see," she said flatly. The light turned green. The truck rolled forward, leaving the open darkness behind, carrying its unresolved argument into the uncertain light of town. Neither had won. The standoff held, as stark and unyielding as the desert they’d just crossed.
