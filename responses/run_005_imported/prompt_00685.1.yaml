answer: |-
  You're right to feel uneasy about Danny's reasoning. While his logic seems airtight on the surface ("decision is made, effort now is pointless"), he's making several critical errors that reveal a fundamental misunderstanding of your grandpa's values and the actual situation. Here's why Danny is missing the point:

  1.  **The Decision Was Based on *Genuine Love*, Not Performance:** Your grandpa explicitly stated the inheritance goes to the grandchild who "genuinely loves the craft." His decision wasn't based on who showed up *the most* or *the longest*, but on his assessment of their authentic passion. Stopping now because the decision is made **is the single most revealing action possible** about Danny's (and anyone else who follows him) true motivation.
      *   **If Danny stops:** It screams, "I was only doing it for the money/inheritance." This *validates* your grandpa's judgment if he *wasn't* chosen, and potentially undermines it (morally, if not legally) if he *was* chosen, proving the love wasn't genuine.
      *   **If others stop:** It provides clear evidence to your grandpa that his read on *their* lack of genuine passion was correct.

  2.  **The "Locked Envelope" is a Final Test in Disguise:** By announcing the decision is final and sealed, your grandpa has created the perfect conditions to observe genuine motivation. He doesn't need to change the paperwork; he gets to see, with absolute clarity, who truly cares about the craft and the business *for its own sake*, and who was merely performing for the reward. **Continuing to show up *after* the inheritance incentive is removed is the ultimate proof of genuine love.**

  3.  **It's About the Relationship and Respect, Not Just the Asset:** The business isn't just a financial asset; it's your grandpa's life's work, his passion, and his legacy. Showing up on weekends isn't (or shouldn't just be) about currying favor for the inheritance; it's about:
      *   **Spending time with him:** Sharing his passion, learning from him, being part of his world.
      *   **Helping him:** Lightening his load, contributing to the thing he built.
      *   **Showing respect:** Honoring his work and his values.
      Abandoning that *now*, simply because the "prize" is decided, is incredibly disrespectful and demonstrates a transactional view of both your grandpa and his business. It prioritizes personal convenience over family connection and shared purpose.

  4.  **The Craft Itself Might Have Value to You:** Do you *enjoy* working in the shop? Do you learn things? Do you find satisfaction in the work itself? If so, stopping just because the inheritance is decided means you're depriving *yourself* of something meaningful based on Danny's cynical calculus. Genuine love for the craft would mean you *want* to be there, inheritance or not.

  5.  **Grandpa's "Freakish" Insight is Watching:** You emphasize his uncanny ability to read people. Do you really think he won't see *exactly* what Danny's sudden withdrawal means? He anticipated this kind of reaction. He'll see who stays and who goes, and it will confirm (or, in a very unlikely scenario, cause private regret about) the decision he made. He won't change the paperwork, but he'll *know*.

  **Why Danny's Logic Feels Superficially Rational (But Isn't):**

  Danny is applying pure game theory to a situation defined by character and intrinsic motivation. He's focused solely on the **outcome** (the inheritance) and the **mechanism** (the locked envelope). He ignores the **values** underlying the decision (genuine love) and the **ongoing relational context** (family, respect, shared passion). His reasoning reduces the entire situation to a cold transaction, which is precisely the attitude your grandpa sought to avoid by making his criteria about love of the craft.

  **What This Means For You:**

  *   **Trust your gut feeling:** Your unease is valid. Danny's approach feels wrong because it *is* wrong on a deeper level – it violates the spirit of your grandpa's wish and reveals a lack of genuine connection to the craft or the man himself.
  *   **Focus on your own reasons:** Why do *you* go to the shop? If it's because you enjoy it, value time with your grandpa, respect his work, or genuinely want to learn the craft – **keep going**. Those reasons haven't changed.
  *   **See Danny's move for what it is:** It's a massive tell. His withdrawal is strong evidence that your grandpa's assessment of his motivations was likely spot-on. Don't let his cynical logic pressure you into abandoning something you value or disrespecting your grandfather.
  *   **The "Smart Move":** Danny thinks the smart move is to go enjoy Saturdays elsewhere. The *truly* smart move, especially if you have any hope of being the chosen one or simply value the relationship and the craft, is to **keep showing up precisely because the decision is made.** That's the only action consistent with genuine love. Even if you aren't the heir, showing authentic passion and respect for your grandpa and his life's work is its own reward and strengthens your bond with him.

  In short: Danny is being transactionally rational but profoundly misunderstanding the human, relational, and values-based reality of the situation. His actions now are likely the final confirmation your grandpa needed about where everyone's true heart lies. Keep showing up if it means something to *you*.
