prompt: |-
  I'm taking a seminar on free will and moral responsibility, and this week's readings covered the debate over whether Frankfurt-style cases really defeat the Principle of Alternative Possibilities. I follow the basic Jones-and-Black set-up, but I'm stuck on the objection, associated with Widerker and Ginet, that targets the "prior sign" Black relies on: the sign is either causally sufficient for Jones's decision or it isn't, and each horn of that dilemma is supposed to create a different problem for the anti-PAP conclusion. Could you walk me through both horns at an intuitive level, and then explain how later versions of the case — ones built around "blockage" rather than a predictive sign, like Mele and Robb's — are meant to escape it? I'd also like to know whether a "flicker of freedom" survives even in those revised cases, or whether it's genuinely eliminated.
