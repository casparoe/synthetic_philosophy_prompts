  Let's break this down step by step, starting with Goodman's core argument and its contrast with Lessing, then tackling the literary forgeries.

  **Part 1: Goodman's Argument for the Aesthetic Relevance of History (vs. Lessing)**

  Goodman's argument in *Languages of Art* hinges on the **ontological distinction** between autographic and allographic arts and the **epistemic implications** for aesthetic experience.

  1.  **The Autographic/Allographic Distinction:** An art form is autographic if and only if even the most exact duplication *cannot* count as an instance of the original work. The work's identity is tied to its history of production (its genesis). Painting is autographic. An art form is allographic if and only if instances are identified solely by compliance with a notation (e.g., musical score, literary text). Any instance complying with the notation is genuine. Literature and music are allographic.

  2.  **The Challenge of the "Perfect Forgery":** Suppose we have a hypothetical forgery of a Rembrandt so perfect that *no expert, now or ever, using any conceivable means, could distinguish it from the original*. Intuitively, we still feel the original is "more valuable" or "more authentic." Lessing argues this intuition is purely *ethical*: the original was created by Rembrandt, achieving something difficult, while the forgery, though visually identical, misrepresents who achieved that feat. The *object* itself, aesthetically, is identical. The wrong is deception about achievement/credit.

  3.  **Goodman's Counter: The Argument from Future Discriminability (The "Aesthetic Risk"):** Goodman rejects Lessing's object-focused view. His core argument is:
      *   **a) The Meaning of "Undetectable":** "Undetectable" is always relative to *current* knowledge and technology. We can never guarantee a forgery is *permanently* undetectable. New scientific techniques (e.g., improved spectroscopy, AI analysis of brushstroke micro-patterns) or historical discoveries *might* emerge.
      *   **b) The Difference in "Aesthetic Risk":** The *original* work has a specific history embedded within it. This history means it possesses a unique set of *potential* aesthetic properties that *could* be revealed by future discoveries/technologies. The forgery, having a *different* history, possesses a *different* set of potential aesthetic properties.
      *   **c) The Consequence for Aesthetic Experience:** When we engage with an artwork, part of the experience involves our understanding of *what it is* and what properties it *might* reveal. Knowing we are looking at the *original* Rembrandt means we know we are engaging with an object that *could* yield new insights about Rembrandt's technique, materials, or historical context *in the future*. Knowing we are looking at a forgery (even a perfect one) means we know we are engaging with an object whose potential revelations are limited to the forger's context and methods.
      *   **d) The Aesthetic Relevance:** This difference in "aesthetic risk" or potential for future revelation *is* an aesthetic difference *right now*. It affects our cognitive engagement and anticipation. The history of production isn't just a label; it fundamentally shapes the *kind* of aesthetic object we perceive it to be and the *kind* of aesthetic experience it promises. The original carries the weight and potential of its true genesis; the forgery carries the limitations of its deceptive genesis.

  4.  **Goodman vs. Lessing Summary:**
      *   **Lessing:** The *only* wrong in forgery is the misrepresentation of *achievement/credit*. The aesthetic properties of the object itself are unaffected. Value lies in the object's appearance and the credit for creating it.
      *   **Goodman:** The history of production is *constitutive* of the work's identity in autographic arts. This identity determines the *scope of potential aesthetic properties* the work can possess. A forgery, having the wrong history, has a different identity and thus a different (limited) aesthetic potential, making it aesthetically distinct *now* because of the *possibility* of future discrimination. Value lies in the object's authentic history and the unique potential it embodies.

  **Part 2: Literary "Forgery" in Goodmanian and Lessingian Terms**

  Goodman's framework creates a stark divide between autographic and allographic arts regarding the possibility of "forging the work itself." Let's analyze your three cases:

  1.  **Fabricated Manuscript of a Genuine Novel:** (e.g., creating a physical manuscript falsely purporting to be Hemingway's handwritten draft of *The Sun Also Rises*).
      *   **Goodman:** The *work* (the novel *The Sun Also Rises*) is allographic. Any correctly spelled copy is genuine. The *manuscript* is an *autographic artifact*. Forging *it* is possible because its identity *is* tied to its history of production. You are forging an *instance* (a particular physical object) falsely claiming a specific history (being written by Hemingway). The *wrong* is deception about the artifact's provenance, not about the work itself. The work remains untouched.
      *   **Lessing:** This is straightforward forgery. The forger is falsely claiming the achievement of *creating that specific physical artifact* (the manuscript) by Hemingway. The credit for the artifact's creation is stolen.

  2.  **Invented Story Falsely Attributed to a Dead Author:** (e.g., writing a new story in the style of Jane Austen and claiming it was a newly discovered work by her).
      *   **Goodman:** The *work* (this new story) is allographic. Its identity is defined by its text (the notation). However, the *attribution* is false. The forger is not forging the *work* (any correct copy of the text *is* the work), but they are forging the *authorship* or *provenance* of the work. This is deception about the *genesis* of the textual notation. Goodman might call this a "false attribution" rather than a "forgery of the work" since the work itself (defined by text) isn't forged. The wrong is misrepresentation of the work's origin.
      *   **Lessing:** This is also straightforward forgery. The forger is falsely claiming the achievement of *creating the work* (the story itself) belongs to the dead author. They are stealing the credit for the creative act of composing that specific text.

  3.  **Plain Plagiarism:** (e.g., copying passages from another author's novel verbatim and presenting them as one's own original work).
      *   **Goodman:** This is fundamentally different. The plagiarist *is* creating a new allographic work. The text they present *is* the genuine instance of *their* work (the plagiarized text). However, they are falsely claiming *authorship* of the notation. They are lying about *who composed the text*. The wrong is misrepresentation of the creative origin of the notation, not forging an instance or an attribution in the same sense as above. The plagiarist's text *is* a genuine instance of the plagiarist's work (which happens to be identical to someone else's).
      *   **Lessing:** This is clearly theft of credit. The plagiarist claims the achievement of creating the text, which rightfully belongs to the original author. The core wrong is identical to the invented story case: falsely claiming authorship/creative achievement.

  **Do These Three Share a Single Kind of Wrong? The Autographic/Allographic Line's Impact:**

  *   **According to Goodman:** **No, they do not share a *single* kind of wrong in the strict sense defined by the autographic/allographic distinction.**
      *   The **fabricated manuscript** involves forging an *autographic artifact* (the physical object).
      *   The **invented story/false attribution** involves deception about the *genesis of an allographic work* (who authored the text).
      *   **Plagiarism** involves deception about the *authorship of an allographic work* presented as the plagiarist's own creation (creating a new work with stolen notation).
      *   The common thread Goodman *might* concede is **deception about origin/provenance**, but the *ontological category* of the thing being deceived about (artifact vs. work authorship) differs based on the autographic/allographic nature. The "forgery" label, strictly applied only to autographic works/artifacts, only fits the first case cleanly.

  *   **According to Lessing:** **Yes, fundamentally, they share a single kind of wrong: the misrepresentation of achievement/credit.**
      *   In all three cases, someone is falsely claiming credit for an achievement that belongs to another.
          *   Fabricated Manuscript: Credit for creating that specific physical artifact.
          *   Invented Story: Credit for creating the literary work (the story).
          *   Plagiarism: Credit for creating the text (the literary content).
      *   For Lessing, the core ethical wrong is the deception about *who performed the creative act*, regardless of whether it's forging an object, falsely attributing a work, or stealing text. The object/work itself is secondary to the act of achievement and its proper attribution.

  **Conclusion:**

  Goodman's autographic/allographic line **does** show that the three literary "forgeries" are not the *same kind* of offense *if* we define the offense strictly by the ontological nature of what is being falsified (an artifact vs. the authorship of a work). The fabricated manuscript is a true forgery (of an autographic object), while the false attribution and plagiarism involve deception about the authorship/provenance of allographic works.

  However, both ordinary language and Lessing's ethical perspective **rightly group them together** under the umbrella of "literary fraud" or "misrepresentation of authorship." The common denominator, ignored by Goodman's formal ontology but central to Lessing and our moral intuition, is the **theft of credit** and the **deception about creative achievement**. Your novel about a forger grapples with this fascinating tension: the philosophical distinction (Goodman) that makes painting forgeries uniquely ontological crimes versus the pervasive human concern with authorship, credit, and deception (Lessing) that applies across all arts. The autographic nature of painting makes forgery an attack on the work's very identity, while literary deceptions are attacks on the story we tell *about* the work's origin. Both are potent sources of drama and moral ambiguity for your protagonist.
