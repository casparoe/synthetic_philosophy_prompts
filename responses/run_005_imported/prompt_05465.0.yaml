  Regarding quoting slurs in reports, the taboo view explains the discomfort as violating the ban, even in reporting. Expressivism would say quoting still expresses contempt, but that doesn't fit because the reporter isn't endorsing it. The taboo view's emphasis on context-independent prohibition makes more sense here.

  The user mentioned legal flags on reports, which aligns with the taboo view's idea that the word itself is problematic regardless of intent. They need a solution that avoids typing slurs, maybe using IDs or placeholders. 

  The user's deeper needs are practical solutions for their app. They want to justify changing the system to legal by explaining why quoting is problematic without intent. The taboo view provides a stronger argument here. Also, understanding reclamation helps them adjust filters to allow in-group use without flagging.

