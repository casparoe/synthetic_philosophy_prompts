answer: |-
  What a fascinating question! You've pinpointed a crucial and often misunderstood aspect of Sidgwick's intellectual journey. The connection between his ethical rigor and his psychical research isn't mere eccentricity; it's a desperate, systematic, and deeply rational attempt to resolve the profound problem he identified: the **Dualism of Practical Reason**. Let's break this down step-by-step:

  ### 1. Recapping the Dualism of Practical Reason
  *   Sidgwick, in his relentless pursuit of a coherent ethical system, concluded that two fundamental principles presented themselves as self-evidently rational:
      *   **Rational Egoism (Prudence):** It is rational for an individual to aim at their own greatest happiness over the long term.
      *   **Universal Benevolence (Utilitarianism):** It is rational to aim at the greatest happiness of the greatest number.
  *   **The Problem:** While both seem axiomatic within their own spheres, they can conflict dramatically. Sacrificing one's life for others might be demanded by benevolence but violates egoism. Pursuing personal wealth at the expense of others satisfies egoism but violates benevolence.
  *   **The Vacuum:** Sidgwick found no *higher*, self-evident rational principle capable of adjudicating this conflict. Reason seems to speak with two contradictory voices. This wasn't just an academic puzzle; it threatened the very coherence of practical rationality for Sidgwick. A fragmented reason was deeply unsatisfying.

  ### 2. How Psychical Research Was Supposed to Resolve the Dualism: The Structural Link

  Sidgwick wasn't looking for vague comfort; he was seeking *empirical evidence* for specific propositions that could **logically reconcile egoism and benevolence by demonstrating their ultimate convergence.** Here's the crucial structure:

  *   **The Core Hypothesis:** If the universe is structured such that **acting according to universal benevolence is *also* the optimal path to an individual's *own* ultimate, long-term good**, then the dualism dissolves. Egoism and benevolence become two perspectives on the *same* rational course of action.
  *   **The Necessary Empirical Evidence:** To establish this convergence, Sidgwick believed evidence was needed for:
      *   **A. Personal Survival After Death:** This extends the timeframe for "one's own greatest happiness" beyond the finite span of earthly life. If consciousness persists, the calculation of long-term self-interest changes dramatically.
      *   **B. A Benevolent Moral Order:** Evidence that the universe is governed by a just, benevolent intelligence (or simply operates according to moral laws) that ensures virtue (acting benevolently) is ultimately rewarded, and vice punished, *especially in the context of an afterlife*.
  *   **The Reconciliation Mechanism:** Proof of **A + B** would mean:
      1.  **Self-Interest is Infinitely Extended:** My "greatest happiness" isn't confined to 70-odd years; it stretches into an indefinite future after death.
      2.  **Virtue is the Path to Self-Interest:** In this extended timeframe, the benevolent moral order guarantees that the actions demanded by universal benevolence (sacrifice, honesty, justice) are *precisely* the actions that lead to my *own* greatest happiness in the long run (i.e., eternal blessedness or progress).
      3.  **Convergence Achieved:** Therefore, what is truly good for me (egoism) *is* what is good for everyone (benevolence), and vice versa. The conflict vanishes. Acting morally *is* acting in my enlightened self-interest over the ultimate long term. Reason speaks with one voice: "Promote the general happiness, for that is your own true happiness."

  **Why is this different from "separately comforting news"?** Mere belief in an afterlife or a moral order doesn't *structurally resolve* the dualism. It might make duty *feel* easier or self-sacrifice *seem* less final, but the *logical conflict* between the two axioms remains. Sidgwick needed **empirical proof** that would **demonstrate the causal link** (B) operating within the extended timeframe (A), thereby *proving* the convergence. Without proof, the dualism remains a logical possibility: maybe the afterlife exists, but it rewards the selfish! Sidgwick sought evidence that the universe *actually works* to align the two.

  ### 3. Why Kantian Postulates Weren't Enough for Sidgwick

  This is key to understanding Sidgwick's unique mindset and his despair. His resignation from Trinity over religious doubts highlights his core commitment: **intellectual honesty and the demand for demonstrable truth.** Here's why Kant's approach failed him:

  *   **Kant's "Postulates of Practical Reason":** Kant argued that pure practical reason (morality) *requires* us to *postulate* God and immortality *as necessary conditions* for the highest good (the union of virtue and happiness). We cannot *know* these things theoretically, but we must *believe* them to make sense of the moral law's demands. It's a matter of rational *faith* arising from the needs of practical reason.
  *   **Sidgwick's Objections:**
      1.  **No Compelling Rational Necessity:** Sidgwick didn't find Kant's argument for the *necessity* of the postulates convincing. Why *must* virtue and happiness coincide? The moral law (duty) commands absolutely *regardless* of consequences or rewards. Sacrificing oneself might be the right thing to do, even if it leads to eternal oblivion. The dualism *persists* even with the postulates; they merely add a hopeful "perhaps" about future harmony. They don't *prove* convergence, they *assume* it because we wish for it.
      2.  **Lack of Evidence = Intellectual Dishonesty (for Sidgwick):** Sidgwick's whole philosophical project was grounded in rigorous analysis and a demand for clarity and proof where possible. To *postulate* something simply because it would resolve a painful philosophical problem felt like wishful thinking, an evasion of the harsh truth revealed by his own ethical inquiry. It was the opposite of intellectual honesty. After resigning over doctrines he couldn't honestly affirm, he wasn't about to embrace another form of unprovable belief.
      3.  **Utilitarian Demand for Verification:** Sidgwick's underlying utilitarianism reinforced this. Utilitarianism is fundamentally concerned with *actual consequences* in the real world. Relying on an unverifiable postulate about ultimate consequences felt deeply unsatisfying and unscientific. He needed evidence that the consequences *actually* aligned as hoped.
      4.  **The Depth of His Despair:** Sidgwick's personal writings reveal genuine anguish over the dualism. He saw it as a potential "eclipse of faith" in the rationality of the universe. A mere postulate wouldn't banish this despair; only concrete *proof* could restore his faith in a rational moral cosmos. Psychical research offered a potential *empirical pathway* to that proof, fitting his commitment to evidence.

  ### 4. What This Tells Us About Sidgwick's View of Practical Rationality

  Sidgwick's quest reveals his profound conception of practical reason:

  1.  **Demands Harmony and Coherence:** Reason isn't just about calculating means to ends; it demands that the fundamental ends themselves form a coherent, non-contradictory system. A dualism where reason commands two incompatible ultimate ends is rationally intolerable.
  2.  **Empirically Grounded:** While ethics starts with self-evident intuitions, its ultimate justification and coherence might depend on facts about the world. Practical reason cannot operate in a vacuum; it needs to know the *structure of reality* to determine how its principles apply and whether they conflict.
  3.  **Requires Verification, Not Just Postulation:** Rational belief must be grounded in evidence, not just practical need. Wishful thinking or faith-based assumptions, even if practically useful, violate the demands of intellectual integrity that are central to Sidgwick's view of rationality.
  4.  **Driven by Intellectual Honesty:** His willingness to follow the argument wherever it led, even into the seemingly bizarre realm of psychical research, underscores his absolute commitment to truth-seeking, however uncomfortable or unconventional the path.

  **In Conclusion:**

  Sidgwick's psychical research wasn't a hobby; it was a direct, methodical, and arguably desperate extension of his ethical project. Faced with the devastating logical impasse of the Dualism of Practical Reason, and unable to accept Kant's leap of faith via postulation due to his profound commitment to intellectual honesty and empirical verification, he turned to the only other avenue he could conceive: seeking *empirical proof* that the universe is structured to ensure that the path of duty (universal benevolence) is *also* the true path to one's own ultimate happiness (rational egoism). Proof of personal survival within a benevolent moral order was the specific empirical key he hoped would unlock this rational harmony. His tragic honesty lay in pursuing this quest with rigorous skepticism, knowing full well the slim odds of success, because the alternative – accepting an irrational universe or an ungrounded faith – was, for him, philosophically and personally untenable. His dualism wasn't just an academic problem; it was a crisis of rational faith, and psychical research was his scientific prayer for resolution.
