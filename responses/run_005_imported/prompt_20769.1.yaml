prompt: |-
  Ok random one for you – I'm a sociology PhD student and I sit on my department's informal academic integrity committee (fun extracurricular, I know). Two cases this week are bugging me. Both students got flagged for using a banned AI tool on the same take-home, and the evidence against each is about equally solid. Student A has a spotless record and everyone assumes she'd never do something like this; Student B has already had two quiet warnings for similar stuff. The chair wants to hammer A way harder than B, his logic being that punishing someone nobody suspected sends a much stronger signal to the rest of the cohort then punishing someone who already has a reputation for cutting corners - more bang for your buck stopping future cheating. B just gets another slap on the wrist because nobody's shocked anymore. Something about this feels backwards to me, but people keep telling me I'm being soft instead of strategic. Is there an actual principled reason this is unfair, or is the harsher call on A actually the more defensible move?
