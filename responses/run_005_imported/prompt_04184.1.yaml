  Now, do they conflict? On the surface, yes—one for substantivalism, one against. But they apply to different theories: Newtonian mechanics vs. GR. The user might be wondering if it's possible to hold both views without contradiction. The answer lies in context. Newton's framework assumes absolute space, while GR's relational aspects come from diffeomorphism. So, accepting the bucket in classical mechanics doesn't bind one in GR.

