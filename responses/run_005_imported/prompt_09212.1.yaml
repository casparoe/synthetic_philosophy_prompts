answer: |-
  You're wrestling with a classic time travel conundrum, and your instincts are spot-on – Lewis and Novikov offer distinct solutions, even if they arrive at a similar *feeling* outcome ("change is impossible"). Understanding their core differences is crucial for your novel's internal logic and avoiding that sharp-eyed reviewer's wrath.

  Let's dissect them:

  **1. David Lewis's Philosophical Account (Modal Realism & Counterfactuals)**

  *   **Core Premise:** Lewis treats time travel as logically possible within a specific framework: **Modal Realism** (all possible worlds are equally real) and a **"Block Universe"** view of time (past, present, and future all exist eternally).
  *   **Mechanism Against Paradox:** **Logical Consistency & Counterfactual Dependence.**
      *   **Consistency is Paramount:** In the *actual* world (the one consistent timeline), events must be logically coherent. Your time traveler's presence in the past is a *fact* of that timeline, just like any other historical event.
      *   **"Can't" is Logical, Not Causal:** The statement "You *cannot* kill your grandfather (before he sires your parent)" doesn't mean some force actively stops you. It means that in the consistent timeline where you exist and travel back, the *actual events* that transpired did *not* include you successfully killing him. The "can't" refers to the *impossibility of that specific outcome within the consistent timeline*.
      *   **Counterfactual Near-Misses:** This is where your "eerie near-misses" shine. Lewis *absolutely* gives you license for them. If you *try* to kill Grandfather, what happens? Something *logically consistent* happens instead. Maybe you slip on a banana peel you didn't see. Maybe your gun jams inexplicably. Maybe Grandfather ducks at the exact right moment because a bird startled him. **These near-misses *are* the mechanism.** They aren't "enforcement" by the universe; they *are* the actual, consistent events that *did* occur. The timeline was always one where you *tried* but *failed* due to a confluence of ordinary-seeming events.
      *   **The "Can" Relative to Facts:** Your friend nailed it. "You *can* raise the gun and pull the trigger" is true relative to your local abilities and intentions. But "You *can* kill Grandfather" is false relative to the *global fact* of your own existence and the fixed nature of the consistent timeline. Your attempt is part of history; its failure is also part of history.
  *   **What it Rules Out:** Lewis rules out the *existence* of a timeline containing a genuine paradox (like your successful grandfather murder leading to your non-existence). Such a timeline is logically impossible and simply doesn't exist among the possible worlds. It doesn't rule out the *attempt* or the *frustration* of the traveler.
  *   **Enforcement Mechanism:** **None.** It's purely a matter of logical consistency within the description of the single, actual timeline. The near-misses are just *what happened*, not evidence of intervention.

  **2. Novikov Self-Consistency Principle (Physics of Wormholes)**

  *   **Core Premise:** This is a proposed principle within the framework of **General Relativity**, specifically applied to solutions like **traversable wormholes** (which could act as time machines). It assumes the laws of physics are paramount.
  *   **Mechanism Against Paradox:** **Physical Law Enforcement & Global Consistency.**
      *   **Physics Dictates Consistency:** Novikov asserts that the laws of physics *only* allow solutions to the equations (describing matter and spacetime) that are globally self-consistent. A paradox (like changing the past) represents an *inconsistent* solution – physics simply forbids it.
      *   **"Can't" is Physical:** Here, "you *cannot* change the past" *does* imply a physical enforcement mechanism. The universe's laws actively constrain events to prevent inconsistencies.
      *   **The Billiard Ball Example:** This is key. Imagine a billiard ball entering a wormhole (time machine) at time T2, emerging in the past at T1, and hitting its younger self to *prevent* it from entering the wormhole at T2. This is inconsistent. Novikov says physics ensures that the ball emerging at T1 *must* hit the younger ball in such a way that it *still* enters the wormhole at T2. The trajectory is adjusted, perhaps by an improbable glancing blow or quantum fluctuation, to ensure consistency. **The enforcement is physical.**
      *   **Near-Misses as Physical Adjustment:** Your car accident near-misses *could* fit, but they are framed differently. The flat tire isn't just a random coincidence that *happened* to be there (Lewis); it's the *result* of physical laws subtly (or dramatically) adjusting probabilities or events *in the moment* to steer the timeline back to consistency. It might feel like "the universe intervening" because, in a sense, the global constraints of physics *are* intervening locally.
  *   **What it Rules Out:** Novikov rules out *inconsistent worldlines* as physically impossible solutions to the equations of General Relativity. Only consistent histories are allowed.
  *   **Enforcement Mechanism:** **Yes, Implicitly.** While not a conscious force, the principle relies on the fundamental laws of physics (gravity, quantum mechanics) acting in such a way that probabilities for inconsistent events become zero or paths leading to inconsistency are dynamically forbidden. The "adjustment" *is* the mechanism. It requires the universe's laws to have this global consistency-enforcing property.

  **Key Differences Summarized:**

  | **Aspect** | **David Lewis (Philosophy)** | **Novikov Principle (Physics)** |
  |------------|------------------------------|---------------------------------|
  | **Foundation** | Modal realism and logical consistency in block universe | General relativity and physical law enforcement |
  | **"Can't" Mechanism** | Logical impossibility within consistent timeline | Physical law forbidding inconsistent solutions |
  | **Near-Miss Nature** | What actually happened in fixed timeline | Physical adjustment to maintain consistency |
  | **Enforcement** | None - pure logical constraint | Yes - fundamental physical laws |
  | **Paradox Prevention** | By definition of what exists | By prohibition of what's physically possible |
  | **Storytelling Flexibility** | Allows coincidences without explanation | May require implied physical mechanisms |

  **Addressing Your Specific Questions:**

  1.  **Does Lewis give license for "eerie near-misses"?** **Absolutely Yes.** In fact, they are the *hallmark* and primary mechanism of his solution. The infuriating flat tire, the car that won't start, the sudden downpour – these *are* the consistent past events that always happened. They aren't interventions; they *are* the history. Lewis *requires* this kind of thing to resolve the tension between the traveler's intent and the fixed past.
  2.  **Is Novikov just Lewis in physics packaging?** **No.** While both prevent paradoxes, the *reasoning* and *mechanism* are fundamentally different:
      *   Lewis relies on the *logical necessity* of consistency within a single, fixed timeline. Near-misses are just descriptive of *what is*.
      *   Novikov relies on the *physical laws* forbidding inconsistent configurations of matter/energy in spacetime. Near-misses (or more dramatic adjustments) are the *result* of those laws dynamically enforcing consistency. Novikov *implies* an active, physical process of constraint that Lewis explicitly denies.
  3.  **Which gives a picky reader less to complain about?** This depends on your novel's *tone* and *how much you want to explain*:
      *   **Lewis (Philosophy):**
          *   **Pros:** Perfectly fits your existing "eerie near-miss" structure. Doesn't require any technobabble or explanation of *how* the universe enforces things – the coincidences *are* the explanation within the logic. Focuses beautifully on the protagonist's frustration and the existential horror of a fixed fate. More forgiving for literary fiction.
          *   **Cons:** A physicist might scoff that it's "just philosophy" and doesn't engage with actual physics. A very picky philosopher might debate modal realism (but most readers won't care).
      *   **Novikov (Physics):**
          *   **Pros:** Sounds more "sciency." Might satisfy readers who want a pseudo-physical mechanism. Could allow for more dramatic, less coincidental-seeming interventions later (e.g., the time machine malfunctions when a paradox is attempted).
          *   **Cons:** Requires at least *hand-waving* towards physics (wormholes, quantum gravity, probability fields). The "enforcement" mechanism needs *some* rationale, even if vague ("chroniton fields," "temporal inertia," "the universe correcting itself"). Your near-misses might start feeling less like eerie fate and more like plot armor if the physics isn't hinted at convincingly. Risk of technobabble overload if explored deeply.

  **Recommendation:**

  Stick with **David Lewis**. Here's why:

  1.  **It Matches Your Existing Structure:** Your "universe won't let you" is *already* a perfect layman's description of Lewis's logical constraint. The near-misses are already Lewisian.
  2.  **Less Exposition Needed:** You don't need to invent physics. The frustration *is* the point. Explaining *why* the car wouldn't start beyond "it just didn't, that's what happened" is often more powerful and unsettling in a novel focused on character and fate.
  3.  **Philosophical Depth:** It allows you to explore themes of free will, determinism, and the nature of time in a way that feels organic to the character's experience, rather than getting bogged down in hypothetical physics.
  4.  **Avoiding the Physics Trap:** Unless your novel is *about* the physics of time travel (like a Greg Egan novel), delving into Novikov might distract from your core story about grief, obsession, and acceptance. A physicist reader might still note it's "not real physics," but Lewis gives you solid philosophical grounding that's equally valid within fiction.

  **How to Handle the Physicist BIL (and Picky Readers):**

  *   **Acknowledge Lewis:** Have a character (maybe even the BIL type!) mention Lewis's solution explicitly as a *philosophical* framework for understanding why change seems impossible. This shows you've done your homework.
  *   **Keep Physics Ambiguous:** The *method* of time travel can remain mysterious or use vague sci-fi terms. You can say it "exploits loopholes in causality" or "accesses the block universe." You don't need to commit to wormholes or Novikov.
  *   **Focus on Effect:** Emphasize the *experience* – the infuriating, statistically impossible run of bad luck that *always* thwarts the protagonist. That's powerful storytelling whether rooted in Lewis's logic or hand-waved physics.
  *   **Embrace the Horror:** The true horror in Lewis isn't an enforcing universe, but the realization that *you were always part of the tragedy*. Your attempts were always doomed, and your presence was always factored in. That's rich narrative soil.

  In conclusion: You haven't mashed incompatible ideas, but you *are* instinctively using Lewis's framework. Embrace it fully. The "eerie near-misses" are not just allowed; they are essential to his solution. They create the perfect narrative tension for your protagonist's struggle against an immutable past. Run with that, and let the physics remain a background mystery. Your sharp-eyed reviewer is more likely to applaud the consistent application of a philosophical concept than complain it's not hard physics. Now go write that next page!
