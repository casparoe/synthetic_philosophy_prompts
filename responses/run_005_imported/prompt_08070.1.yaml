    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  Add one sentence per tier explaining what the criteria placed in it have in common.
reasoning: |-
  We are ranking six fairness criteria for high-stakes automated risk-assessment tools. The criteria are:
  1. Demographic Parity (DP) - requires that the proportion of positive predictions is the same across groups.
  2. Equalized Odds (EO) - requires that true positive rates and false positive rates are equal across groups.
  3. Equal Opportunity (EOpp) - a relaxation of equalized odds that only requires true positive rates (or false negative rates) to be equal across groups.
  4. Predictive Parity (PP) - requires that the precision (positive predictive value) is the same across groups, or sometimes defined as having equal PPV and NPV.
  5. Calibration within Groups (Cwg) - requires that for any predicted probability score, the proportion of positive outcomes is the same across groups (i.e., the score is equally meaningful across groups).
  6. Counterfactual Fairness (CF) - requires that the prediction for an individual would be the same in the actual world and in a counterfactual world where the individual belonged to a different demographic group.

  The impossibility results (Chouldechova and Kleinberg et al.) show that when base rates differ and the classifier is imperfect, it's impossible to satisfy both calibration within groups and equalized odds (or equal opportunity, which is part of equalized odds) at the same time.

  Given the context of high-stakes risk assessment (e.g., pretrial detention, lending) and the requirement that only one criterion can be mandated, we must choose the most defensible as the default legal standard.

  Key considerations for regulators:
  - High-stakes decisions require fairness and accuracy.
  - The criterion should be robust to base rate differences and not create perverse incentives.
  - It should avoid known impossibility conflicts when possible.

  Ranking tiers:

  S (most defensible): This tier should contain the criterion that is most aligned with both fairness and practical utility in high-stakes settings, and that avoids the most severe pitfalls.

  A, B, C, D: Decreasing order of defensibility.

  Analysis:

  1. **Calibration within Groups (Cwg)**: This is important for risk assessments because it ensures that the risk score means the same thing across groups. For example, a score of 0.7 for group A and group B should correspond to a 70% chance of the event. This is crucial in lending or bail decisions because it reflects the accuracy of the risk assessment. However, it is incompatible with error rate balance (like equalized odds) when base rates differ. But in many legal contexts, calibration is seen as a minimal requirement for fairness because it ensures that predictions are equally reliable.

  2. **Equalized Odds (EO)**: This requires that the classifier has the same error rates (FPR and FNR) across groups. It is a strong notion of non-discrimination because it requires that the classifier is equally good at predicting positive outcomes for the actually positive and actually negative individuals in each group. However, when base rates differ, it cannot be achieved with calibration. But it is often seen as a good standard for avoiding disparate mistreatment.

  3. **Equal Opportunity (EOpp)**: This is a relaxation of EO that only requires equality of true positive rates (or equivalently, false negative rates). This is particularly important in settings where the positive outcome (e.g., being denied bail) is the unfavorable one, and we care about not disproportionately harming the positive class in one group. It is less strict than EO because it doesn't constrain the false positive rate.

  4. **Predictive Parity (PP)**: This requires that the precision (PPV) is the same across groups. This means that among those predicted positive, the proportion that actually is positive is the same. This is important for the utility of the decision (e.g., not lending to people who won't repay). However, it is also incompatible with other criteria when base rates differ. In fact, the impossibility results show that if base rates differ, you cannot have both calibration and equal PPV (unless the classifier is perfect). Also, PP might lead to different treatment if base rates are different.

  5. **Demographic Parity (DP)**: This requires that the selection rate (proportion of positive predictions) is the same across groups. This is often used to ensure proportional representation. However, in high-stakes risk assessment, if base rates differ (e.g., one group has a higher true risk), then forcing equal selection rates might require either under-predicting for the high-risk group or over-predicting for the low-risk group, leading to unfairness and inefficiency. It is often seen as a blunt instrument.

  6. **Counterfactual Fairness (CF)**: This is a causal notion that requires that the prediction is the same in the actual and counterfactual scenarios. While it is a strong individual-level fairness notion, it is very difficult to implement in practice because it requires a causal model and knowledge of the underlying data-generating process. Regulators might find it hard to mandate because it is not testable without strong assumptions and causal models. Thus, it is the least practical for a regulatory standard.

  Tiering:

  - S: Calibration within groups. Why? In high-stakes risk assessment, it is critical that the risk scores are meaningful and equally reliable across groups. This criterion ensures that individuals with the same risk score have the same chance of the outcome regardless of group. It is a foundational requirement for any risk assessment tool.

  - A: Equalized Odds. Why? It provides strong guarantees against disparate mistreatment by requiring equal error rates. It is a well-established criterion that is particularly relevant when both false positives and false negatives are important.

  - B: Equal Opportunity. Why? This is a relaxation of equalized odds that focuses on the equal treatment of the disadvantaged group (e.g., equal chance of being correctly identified as high-risk). It is especially relevant when false negatives (e.g., releasing someone who is high-risk) are a major concern.

  - C: Predictive Parity and Demographic Parity. Why?
     - Predictive Parity: It is important for the utility of the decision (e.g., not lending to people who won't repay) but can be in conflict with calibration and may not be achievable when base rates differ. Also, it might lead to disparate impact if base rates are different.
     - Demographic Parity: It ensures proportional representation but ignores differences in qualifications or risk, which can lead to unfairness and inefficiency.

  - D: Counterfactual Fairness. Why? While it is a strong theoretical notion, it is impractical for regulatory purposes due to the requirement of causal models and unverifiable assumptions.

