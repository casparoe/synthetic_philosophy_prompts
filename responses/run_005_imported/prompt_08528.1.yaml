prompt: |-
  I'm a few years into a philosophy PhD, mostly working on moral psych / experimental philosophy, and I'm still chewing on an arguement two of my labmates had after our reading group last week (we'd just gone through a stack of Knobe-effect papers, so everyone was primed for it). One of them, Naomi, is piloting a vignette for her dissertation that's basically a reskinned version of the classic chairman/environment case: a hospital administrator is told that switching scheduling software will save money, and in one version it'll also increase nurse burnout as a side effect, in the other version it'll decrease burnout as a side effect, and either way she says something like "I don't care about that, I just want to cut costs" and goes ahead. Like clockwork, way more of her pilot subjects said she "intentionally increased burnout" in the harm version than said she "intentionally decreased burnout" in the help version.

  The argument was about what to make of that asymmetry, and it went back and forth enough that I wrote it down afterward because I knew I'd want to chew on it more. (1) Theo said this just shows moral valence is constitutively part of the ordinary concept of intentional action -- we're not erring, we're correctly applying a concept that's always had a normative component built in, same as "reckless" does. (2) Naomi said if that were true you shouldn't need morality specifically to get the effect, and that the pattern looks a lot more like Alicke's culpable-control story: people fix a global blame verdict first and then reverse-engineer the supporting judgments (foresight, causation, intent) to match it, which makes the asymmetry a bias, not a competence. (3) Theo came back with the fact that this is apparently one of the most robust results in the whole x-phi replication literature -- I want to say it held up across nearly every site in that big Cova et al. cross-cultural project -- and argued a sloppy, ad hoc, motivated-reasoning bias has no business being that stable across cultures and contexts. (4) Naomi said robustness has nothing to do with correctness -- plenty of very robust, automatic biases exist too -- so at most he'd shown people can't help doing it, not that they're right to. (5) Theo then brought up a finding I'm pretty sure is Uttich and Lombrozo's, that you get basically the same intentional/unintentional split even for purely non-moral, conventional or statistical norm violations, and said this generality is exactly what real conceptual competence would predict, whereas a blame-justifying bias has no obvious reason to show up when there's nobody around to blame. (6) Naomi's comeback was that abnormal outcomes are just independently more salient and attention-grabbing regardless of morality, which would inflate perceived foresight and hence perceived intentionality through completely mundane attention mechanisms, no norm-tracking required -- so his cross-domain finding doesn't actually favor his side over hers.

  Neither of them budged and then we all had to go grade sections, so its been rattling around in my head since. Could you go through it move by move -- (1) through (6) -- and say who's got the better of it at each step, rather than just declaring an overall winner, and flag anything you think both of them are missing? And then, since I know that's already a lot, close with your own overall take on whether the "competence" side or the "bias" side is closer to right about the Knobe effect, and why.
reasoning: |-
  Hmm, the user is a philosophy PhD student working on moral psychology and experimental philosophy. They've described an argument between two labmates about interpreting the Knobe effect, where people are more likely to say a side effect was intentional when it's harmful versus helpful. The user wants me to analyze each step of their argument (1 through 6) and then give my overall take on whether the competence or bias interpretation is stronger.

  Let me break down each move in the argument:

  For move (1): Theo is making a competence argument that moral valence is part of the concept of intentional action. This is similar to Knobe's original position. The strength here is that it explains the asymmetry directly through conceptual structure, but the weakness is that it might be too specific to morality when we see similar effects in non-moral domains.

  For move (2): Naomi counters with a bias explanation using Alicke's culpable control model. Her point about specificity is good - if it's truly conceptual, why does it disappear in non-moral contexts? But she hasn't addressed how the effect persists even when blame isn't applicable.

  For move (3): Theo brings up cross-cultural robustness as evidence against a "sloppy bias." This is a strong point since robust phenomena across cultures often indicate deep cognitive structures. But Naomi could counter that many biases are culturally universal too.

  For move (4): Naomi correctly notes that robustness ≠ correctness. This is philosophically important - a common error doesn't make it right. But she hasn't explained why such a "bias" would be so persistent if it's truly irrational.

  For move (5): Theo extends to non-moral norm violations (Uttich & Lombrozo). This significantly weakens Naomi's purely moral-blame account since the effect appears without moral stakes. Her account would need stretching to cover this.

  For move (6): Naomi attributes it to salience of abnormal outcomes. This could work for both moral and non-moral cases through attention mechanisms. But it doesn't fully explain why "intentionality" judgments specifically are affected, not just foresight or causation.

  What both might be missing: First, the competence/binary might be too simplistic - hybrid models exist. Second, they're not considering developmental evidence showing the effect emerges early. Third, the effect's sensitivity to counterfactuals (e.g., what if the outcome was inevitable) suggests complex integration of norm-violation and alternative-possibilities tracking. Fourth, the pragmatic aspects of "intentionally" as a blame-imputation tool even in non-moral contexts.

  Overall, I lean toward a competence-oriented view but not Theo's strong version. The cross-domain robustness and early emergence point to a deep cognitive tendency to track norm violations (moral or conventional) when attributing intentionality. However, this likely interacts with blame-driven amplification in moral cases - so Alicke isn't entirely wrong, just incomplete. The best account is probably Knobe's later "normative competence" view or Machery's "trade-off hypothesis" where multiple factors contribute.
answer: |-
  Let's break this down move by move, highlighting the strengths and weaknesses of each position. I'll flag key insights and oversights before giving my overall assessment. For clarity: Theo represents the "competence" view (intentionality concept has normative structure), Naomi the "bias" view (asymmetry stems from blame-driven reasoning).

  ### Move-by-Move Analysis
  **(1) Theo: Moral valence is constitutively part of the concept**  
  *Strengths*:  
  - Directly explains the asymmetry without extra mechanisms.  
  - Aligns with Knobe's original "conceptual competence" account (e.g., *Intentional Action and Side Effects*, 2003).  
  - Fits linguistic data showing "intentionally" is applied asymmetrically to positive/negative outcomes.  
  *Weaknesses*:  
  - Doesn't explain *why* the concept evolved this way.  
  - Struggles with non-moral variants (see Move 5).  
  *Who has the edge?* **Theo, narrowly**. This is a parsimonious starting point, but it risks being descriptively accurate without explanatory depth.  

  **(2) Naomi: Asymmetry reflects blame-driven motivated reasoning (Alicke)**  
  *Strengths*:  
  - Explains why the effect is *moral*-valence-specific (initially).  
  - Accounts for real-time judgment shifts under blame motivation (Alicke, 2000).  
  - Predicts that reducing blame should reduce the asymmetry (supported by some studies).  
  *Weaknesses*:  
  - Blame isn't always necessary for the effect (see Move 5).  
  - Overstates "reverse engineering" – foresight/intent often co-vary with blame.  
  *Who has the edge?* **Naomi, conditionally**. Her critique exposes a hole in Theo's account (why morality specifically?), but she hasn't yet addressed broader patterns.  

  **(3) Theo: Cross-cultural robustness favors competence**  
  *Strengths*:  
  - The Knobe effect *is* remarkably stable (Cova et al.'s 2018 cross-cultural study found it in 25/26 cultures).  
  - Universal features often reflect core conceptual structure (e.g., theory of mind).  
  - A "sloppy bias" shouldn't persist identically in diverse contexts (e.g., small-scale societies).  
  *Weaknesses*:  
  - Robustness ≠ competence (e.g., fundamental attribution error is universal but arguably biased).  
  - Doesn't rule out a *universal* bias.  
  *Who has the edge?* **Theo**. Robustness in diverse contexts leans toward a deep cognitive feature, not a contingent bias. Naomi's reply in (4) is valid but undersells this.  

  **(4) Naomi: Robustness ≠ correctness; automatic biases exist**  
  *Strengths*:  
  - Correctly notes that automaticity/stability ≠ rationality (e.g., cognitive illusions).  
  - Preserves the possibility that the asymmetry is systematically misleading.  
  *Weaknesses*:  
  - Doesn't engage with *why* a "bias" would be so stable.  
  - Ignores that competence accounts can accommodate automaticity (e.g., grammar processing).  
  *Who has the edge?* **Draw**. Naomi scores a philosophical point (competence ≠ rationality), but Theo's empirical challenge stands.  

  **(5) Theo: Generality to non-moral norms favors competence**  
  *Strengths*:  
  - Uttich & Lombrozo (2010) show Knobe-like effects for conventional/statistical norms (e.g., "intentionally violated office policy").  
  - Suggests norm-violation tracking, not *moral* blame, drives the effect.  
  - Predicts asymmetry should appear wherever an outcome flips a salient norm.  
  *Weaknesses*:  
  - Moral cases still show stronger effects (suggesting amplification).  
  - "Norm" is broad – could include non-moral salience (see Move 6).  
  *Who has the edge?* **Theo decisively**. This severely undermines Naomi’s "moral-blame-specific" account. If non-moral norms trigger the asymmetry, Alicke’s model needs stretching.  

  **(6) Naomi: Salience explains non-moral cases via attention**  
  *Strengths*:  
  - Abnormal outcomes *are* more salient (e.g., Hilton & Slugoski, 1986), boosting perceived foresight.  
  - Avoids positing "normativity" as a primitive (could be reduced to cognitive efficiency).  
  - Accounts for why harmful/abnormal outcomes draw more attention.  
  *Weaknesses*:  
  - Salience alone doesn’t explain *intentionality* judgments specifically (why not causation or recklessness?).  
  - Norm-violations often drive salience (e.g., a "decreased burnout" outcome is salient *because* it violates expectations).  
  *Who has the edge?* **Naomi, partially**. She offers a plausible alternative, but it’s less predictive than norm-based accounts.  

  ### What Both Are Missing
  - **Hybrid Models**: Competence and bias aren’t mutually exclusive. Knobe’s later work (e.g., 2010) posits a *default* normative competence that blame *amplifies*.  
  - **Pragmatics**: "Intentionally" may function as a blame-imputation tool in conversation (Adams & Steadman, 2004), muddying the competence/bias line.  
  - **Developmental Evidence**: Children show Knobe-like effects early (e.g., Pellizzoni et al., 2010), suggesting a cognitive default.  
  - **Multiple Mechanisms**: The effect may stem from norm-violation *plus* alternative possibilities (Guglielmo & Malle, 2010) – neither side fully integrates this.  

  ### Overall Assessment: Who’s Closer to Right?  
  **The competence view (Theo) is stronger, but needs refinement**. Here’s why:  
  1. **Generality**: The effect’s extension to non-moral norms (Move 5) is fatal to pure blame-bias accounts. Norm-violation tracking explains *both* moral and non-moral cases parsimoniously.  
  2. **Robustness**: Cross-cultural stability (Move 3) suggests a deep cognitive feature, not a flexible bias.  
  3. **Attention Isn’t Enough**: While salience (Move 6) plays a role, it doesn’t explain why *intentionality* (not foresight or causation) is asymmetrically attributed. Norm-based accounts predict this specificity.  
  4. **Bias as Amplifier**: Naomi’s blame-driven reasoning likely *intensifies* the effect in moral contexts but isn’t the core mechanism (supported by weaker but present asymmetry in non-moral cases).  

  **Best current synthesis**: The Knobe effect arises from a **competence for linking intentionality to norm-violating outcomes** (moral or conventional), which is a fundamental feature of action understanding. This competence is then *modulated* by blame-related processes in high-stakes moral contexts, creating the strongest asymmetries. Rejecting the competence entirely ignores the architecture revealed by cross-domain and cross-cultural data.  

  *Key references*:  
  - Knobe (2003) on competence  
  - Alicke (2000) on culpable control  
  - Cova et al. (2018) on cross-cultural robustness  
  - Uttich & Lombrozo (2010) on non-moral norms  
  - Knobe (2010) on hybrid models  

  This should give you plenty to chew on – and maybe even resolve your lab’s stalemate!
