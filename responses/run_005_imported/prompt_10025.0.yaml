answer: |-
  Your grasp of the Leibniz-Lewis contrast is admirably precise. Let's reconstruct Leibniz's likely reactions to Lewis on your two specific points, drawing directly from his core principles as articulated in works like the *Discourse on Metaphysics*, the *Theodicy*, and the Arnauld correspondence:

  **1. Actuality, Theodicy, and the Indexical Analysis:**

  Leibniz would **vehemently reject** Lewis's indexical analysis of actuality as dissolving the very foundation of his metaphysics and theodicy. His reaction would center on the following points:

  *   **God's Choice is Non-Relative & Foundational:** For Leibniz, God's free choice to create the *best* possible world is the absolute, non-relative ground of all existence. This act isn't just another event *within* a universe; it is the transcendent cause *of* the universe. Lewis's framework, where every world is "actual" relative to itself, has no place for this transcendent creative act. There *is* no "selector" God in Lewis's pluriverse; worlds just *are*. Leibniz would see this as eliminating the *reason* for existence and the cornerstone of his theodicy – the explanation for why *this specific* world, with all its apparent evils, exists (because it's the best *possible*).
  *   **"Actual" Denotes Real Existence vs. Mere Possibility:** Leibniz maintains a fundamental, absolute distinction between *merely possible* worlds (ideas in the divine intellect) and the *actual* world (the one concretely existing by God's will). Lewis's indexical view collapses this distinction at the metaphysical level. While Leibniz acknowledges that inhabitants of *any* created world *would* call their own world "actual" (just as we do), this subjective perspective is derivative and secondary. The *metaphysical* fact is that only *this* world *is* actual. Calling other worlds "actual" relative to their hypothetical inhabitants is, for Leibniz, a category error – it attributes existence to what is merely possible. Lewis's semantics doesn't merely offer a different *label*; it denies the underlying *metaphysical reality* Leibniz posits.
  *   **The Dissolution of "Best":** The claim that "God selected our world as uniquely and non-relatively the best" is utterly incoherent within Lewis's framework. In Lewis's pluriverse, *all* concrete worlds exist on equal ontological footing. There is no "selection," no "best" relative to an external standard (like God's wisdom and goodness), and no "non-relative" actualization. The "best" simply disappears as a meaningful metaphysical concept relevant to existence. Leibniz would argue that Lewis's view **does indeed dissolve the very distinction theodicy needs** – the distinction between the realm of divine contemplation (possibility) and the singular outcome of divine action (actuality). Without God as the selector and actualizer based on the principle of the best, the central question of theodicy – "Why *this* world?" – evaporates, replaced by a brute fact of plurality. Lewis's "actual" is, for Leibniz, a hollowed-out term lacking the metaphysical weight of divine creation.

  **2. Trans-World Identity, Complete Concepts, and Counterpart Theory:**

  Leibniz's doctrine of complete concepts does commit him to a view that *functionally resembles* Lewis's counterpart theory in its denial of strict trans-world identity for individuals, but Leibniz would **strongly resist the assimilation**, seeing Lewis's *grounds* and *ontology* as profoundly mistaken:

  *   **The Functional Resemblance:** You are correct. Leibniz's response to Arnauld is definitive: "Adam" is defined by his complete concept, which includes *all* his predicates, including sinning. A possible individual with Adam's defining characteristics *except* sinning is *not* Adam; it's a *different* possible individual. This entails that no individual exists in more than one possible world. In this *outcome* – no strict trans-world identity – Leibniz and Lewis agree.
  *   **The Profound Disagreement (Grounds & Ontology):**
      *   *Leibniz's Grounds: Logical Necessity & Divine Concepts:* Leibniz's denial of trans-world identity stems from his understanding of *individual substance* and the *Principle of Sufficient Reason* (PSR). An individual substance's complete concept contains *everything* true of it *necessarily* (in the broad sense of "following from its concept"). Sinning is part of *Adam's essence* as *this* particular individual. It's not contingent; it's part of what defines *him*. This is a matter of *logical incompatibility*: the concept "Adam who does not sin" is a *different concept* from the concept "Adam who sins." Possible worlds are configurations of *compossible* complete concepts in God's intellect. "Adam" is tied inextricably to his concept, which exists only in the worlds where that *entire* concept is realized. There is only one "Adam" across all possibilities *by definition* – he is his complete concept.
      *   *Lewis's Grounds: Concrete Realism & Similarity:* Lewis denies trans-world identity because he takes worlds as concrete, spatiotemporally disconnected universes. Strict identity across such disconnected realms is deemed impossible or meaningless. We use *counterparts* – individuals in other worlds *sufficiently similar* to an individual in our world – to make sense of modal claims *de re*. The relation is based on similarity, not logical identity of concept.
  *   **Leibniz's Likely Reaction:** Leibniz would see counterpart theory as a crude approximation based on a fundamentally flawed ontology.
      *   *Rejection of Concrete Worlds:* Leibniz would find Lewis's concrete pluriverse absurd. Possible worlds are not concrete realities; they are *abstract objects* (divine ideas). Talking about "concrete Adams" in other universes is nonsensical to Leibniz. Only *concepts* exist in other possible worlds.
      *   *Misunderstanding of Essence:* Counterpart theory treats properties like "sinning" as contingent features that could vary while preserving the "core" individual. Leibniz's superessentialism rejects this. For Adam, sinning isn't a contingent feature that could be peeled away; it's part of his *haecceity* (thisness). Counterpart theory, by allowing similarity-based substitution, fundamentally misunderstands the nature of individual substance for Leibniz.
      *   *PSR vs. Similarity:* Leibniz's PSR demands that everything has a sufficient reason. Why is *this* counterpart Adam's counterpart? Lewis appeals to context-dependent similarity, which Leibniz would likely see as arbitrary and lacking a sufficient reason grounded in the intrinsic nature of the individual concepts themselves. The link between concepts in God's intellect provides a rigorous, non-arbitrary structure that counterpart theory lacks.
  *   **Conclusion on Identity:** While Leibniz's complete concepts entail that Adam only exists in one possible world (the actual one, once created, and conceptually only in worlds containing his exact concept), he would **not** endorse counterpart theory. He would see it as a misguided attempt to solve a pseudo-problem generated by the mistaken belief in concrete possible worlds. His denial of trans-world identity is a consequence of the *logical necessity inherent in complete individual concepts* within God's intellect, not a semantic device for handling modal discourse about concrete individuals scattered across a multiverse. The resemblance is superficial, masking deep metaphysical divergence.

  **In Summary:**

  1.  **On Actuality:** Leibniz would see Lewis's indexical analysis as abolishing the absolute distinction between possibility and actuality, eliminating God's creative choice based on goodness, and thereby dissolving the foundation of theodicy. Lewis's "actual" is a pale shadow lacking metaphysical weight.
  2.  **On Trans-World Identity:** While Leibniz's complete concepts functionally rule out strict trans-world identity like Lewis's counterpart theory, Leibniz would vehemently reject the *basis* of counterpart theory. He would see it as grounded in the absurdity of concrete possible worlds and a misunderstanding of individual essence (confusing contingent similarity with necessary conceptual inclusion), offering only an arbitrary similarity relation where his system provides a rigorous, divinely grounded structure of compossible concepts.

  Leibniz's reaction, presented with Lewis's book, would likely be one of profound metaphysical disagreement, seeing Lewis as having constructed an elaborate system that ignores the necessary roles of God, divine intellect, the Principle of Sufficient Reason, and the absolute distinction between possibility and actual existence – the very pillars of Leibniz's own rationalist theology.
