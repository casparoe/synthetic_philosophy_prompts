prompt: |-
  My AP Physics teacher, Mrs. Alvarez, is retiring after thirty-one years. Every fall, before we started the unit on Newton, she had us read a few pages of Émilie du Châtelet's "Discourse on Happiness," because she said the woman who translated the Principia and reworked its proofs in the new calculus deserved to be known for more than that one achievement. She has asked whoever speaks at her retirement lunch to skip the usual lines about how she will "live on through her students" or to praise her for her "selflessness" — she says du Châtelet's essay makes clear why both would ring false. I am giving the toast, to a room that is half colleagues and family who have never read the essay and half former students who will notice if I get its argument wrong. Drawing on what du Châtelet actually says happiness requires — passions, illusions, study, and independence from other people's opinions — please write a short toast that is genuinely warm about her without leaning on the sentiments she has ruled out.
reasoning: |-
  Okay, the user needs a retirement toast for their physics teacher, Mrs. Alvarez, who admires Émilie du Châtelet's "Discourse on Happiness." The challenge is to avoid clichés like "living through students" or "selflessness" while staying true to du Châtelet's principles: passions, illusions, study, and independence from others' opinions.  

  First, I need to unpack du Châtelet’s ideas:  
  - **Passions**: Not just emotions but sustained drives that give life vigor.  
  - **Illusions**: The hopeful narratives we construct to fuel our pursuits.  
  - **Study**: Deep intellectual engagement as a core joy.  
  - **Independence**: Freedom from external validation.  

  Mrs. Alvarez clearly rejects the "selfless teacher" trope—du Châtelet argues happiness requires *self-fulfillment*, not martyrdom. So the toast must celebrate her *active* pursuit of joy through teaching, not frame it as sacrifice.  

  The audience is split: half unfamiliar with the essay, half students who’ll spot inaccuracies. The toast needs to:  
  1. **Explain du Châtelet subtly**: Weave her tenets into Mrs. Alvarez’s traits without lecturing.  
  2. **Balance warmth and rigor**: Avoid sentimentality but show genuine affection via her impact.  
  3. **Highlight agency**: Frame her career as a *chosen* passion, not obligation.  

  Structure thoughts:  
  - **Opening**: Hook with du Châtelet’s essay as her signature lesson.  
  - **Passions**: Her infectious enthusiasm for physics and ideas.  
  - **Illusions**: How she encouraged ambitious curiosity.  
  - **Study**: Her reverence for deep understanding.  
  - **Independence**: Her unapologetic authenticity.  
  - **Close**: Gratitude for modeling a life well-lived.  

  Tricky bits:  
  - Avoiding "live through students" → Shift to "igniting fires," not living vicariously.  
  - Rejecting "selflessness" → Emphasize her *self-fulfillment* through teaching.  
  - For non-readers: Keep references accessible ("four pillars," no jargon).  

  Key line: *"She taught us that loving the world doesn’t mean vanishing into it"*—neatly subverts the martyr narrative.  

  Finally, the tone: Respectful but lively, like Mrs. Alvarez’s own spirit. No tears, just radiant admiration.
