  So for my 19th-century ethics seminar we have this assignment where you "interview" a philosopher we've covered, podcast-style, and I picked Henry Sidgwick because everyone in class only ever talks about the Methods of Ethics and the whole dualism of practical reason thing and completely skips over the fact that he spent like decades as a founder and president of the Society for Psychical Research, doing that big hallucination census thing and sitting in on mediums. Can you draft me 8-10 interview questions (each with a quick follow-up note anticipating the answer he'd probably give) that actually connect the two -- not generic "why were you into ghosts" stuff, but questions pressing on whether proving survival or some cosmic moral order would even rationally resolve the dualism (vs. just handing people a prudential reason to behave), why the SPR's evidence had to be so brutally rigorous when the whole project was driven by a pretty personal ethical need of his own, and how he squares decades of mostly null results (like the Eusapia Palladino cheating mess) with still hoping anyway. He'll probably try to hide behind "I'm just a dispassionate investigator here" so structure it so that gets harder to say as the questions go on.
