answer: |-
  That HR curiosity exposed a deep crack in group decision-making logic—and your confusion is *exactly* why judgment aggregation theory exists. Let's break this down without jargon, using your committee as the blueprint. The core tension is shockingly simple: **When a group votes separately on premises (the "bars") that are *logically connected* (AND/OR), the majority's overall conclusion might not match the conclusion you'd get if they voted directly on the outcome.** Here's why it's inevitable:

  ### Your Committee, Deconstructed
  Imagine your 3 voters (A, B, C) and their honest stances:

  | Voter | Tech Bar (T) | Leader Bar (L) | Promote? (T AND L) |
  |-------|--------------|----------------|---------------------|
  | A     | ✅ Yes       | ✅ Yes         | ✅ Yes (both pass) |
  | B     | ✅ Yes       | ❌ No          | ❌ No (L fails)    |
  | C     | ❌ No        | ✅ Yes         | ❌ No (T fails)    |

  **Premise-Based Voting (your original process):**  
  - Tech Bar: ✅✅❌ → **Majority YES** (2-1)  
  - Leader Bar: ✅❌✅ → **Majority YES** (2-1)  
  → **PROMOTE** (both bars cleared by majority)

  **Conclusion-Based Voting (HR's "overall" vote):**  
  - Promote? ✅❌❌ → **Majority NO** (2-1)  
  → **NO PROMOTION**

  **The Paradox:** *Identical voters, no mind-changing, yet opposite outcomes.* Why? Because **premise-based voting ignores how individual voters *combine* the premises**. Voters B and C each blocked promotion by rejecting *one* bar, but their rejections got "diluted" in separate majority votes. The direct vote captures their *overall* "no."

  ### Why This Split is Structurally Inevitable
  The magic (or curse) lies in the **logical connective** between premises. Your rule is "T **AND** L → Promote." This creates **asymmetry**:

  - A "Promote" vote **requires both premises** to be true for that voter.  
  - A "No Promote" vote only requires **one premise false**.

  This asymmetry means "No Promote" coalitions can form in *different ways* (T-fail OR L-fail), while "Promote" requires unanimity on both premises. In your case:
  - Only voter A supports promotion (needs both bars).  
  - Voters B and C form a majority *against* promotion, but **for different reasons** (B fails L, C fails T).

  **Premise-based voting** misses this coalition because it tallies T and L *independently*. It sees majority support for T and majority support for L, but **fails to see that the supporters of T and L are *different people*** who don't support promotion themselves.  
  **Conclusion-based voting** sees the anti-promotion majority directly.

  ### The Minimal Guarantee of Chaos
  The divergence is **always possible** for any group with 3+ voters deciding 2+ binary premises connected by **non-linear logic** (like AND, OR, implications). Why?  
  1. **Universal Domain**: Voters can hold *any* logically consistent views (e.g., all 4 possible combinations of T/L for AND rules).  
  2. **Asymmetry of Connectives**: AND/OR create "fragile" outcomes (e.g., Promote needs consensus on *all* bars; No Promote needs dissent on *any*).  

  In your case, the combination of votes where:  
  - At least 2 support T,  
  - At least 2 support L,  
  - But fewer than 2 support T *and* L together  
  ...is **logically possible and common**. The List-Pettit theorem proves that *no* aggregation rule (premise, conclusion, or hybrid) can satisfy all "fairness" axioms (like non-dictatorship, unanimity, and logical consistency) for complex premises. **Premise vs. conclusion voting forces a trade-off.**

  ---

  ### Premise-Based vs. Conclusion-Based: Which is "Less Wrong"?
  Neither is perfect—it depends on your goal:  

  - **Premise-Based (your original method):**  
    **✅ Pros:** Ensures the *criteria* are met. Useful if bars represent objective standards (e.g., "published 5 papers," "led 2 projects").  
    **❌ Cons:** Can promote someone most voters *oppose* (like your case), or reject someone who *should* qualify (e.g., if a voter supports promotion but misapplies a bar).  

  - **Conclusion-Based (HR's vote):**  
    **✅ Pros:** Directly reflects the group's will on the outcome.  
    **❌ Cons:** Hides *why* someone was rejected/accepted. A candidate could fail for wrong reasons (e.g., 2 voters reject based on gender bias, but premise voting might expose this).  

  **Practical Advice for Your Committee:**  
  1. **Stick with premise-based voting** if the bars are *meaningful independent standards*. Your HR likely defined them for a reason—e.g., to prevent promoting brilliant jerks (L-fail) or likeable incompetents (T-fail).  
  2. **But add a sanity check**: If both bars pass *but* a majority opposes promotion, pause. Discuss: Did voters misinterpret the bars? Is there unspoken context? This exposes hidden biases or rule flaws.  
  3. **Never use conclusion-based alone**—it reduces nuanced criteria to a popularity contest.  

  ---

  ### Bottom Line
  This isn't a fluke—it's a **mathematical inevitability** when groups vote on interconnected truths. Like Arrow’s theorem, it reveals a cruel fact: **there’s no "fair" way to merge individual judgments into a group decision without sacrificing consistency, direct democracy, or depth of reasoning.** Your committee hit the trifecta. The fix isn't technical—it's philosophical. Own the trade-off.  

  > "The paradox doesn't mean your voters are irrational. It means *rationality is collective fiction*." — Adapted from List & Pettit.
