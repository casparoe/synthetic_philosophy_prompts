  So I've been prepping a seminar on the centipede game and keep getting stuck on the same knot. Backward induction says defect on move one, full stop -- fold back from the last node and cooperation can never even get started. But Pettit and Sugden's old "paradox of backward induction" keeps nagging at me: the argument only works if its common knowledge that both players are rational at every node, including nodes that, if everyone really were rational from the start, would never actually be reached. So once a player has visibly already deviated from that path, what's her opponent even supposed to believe about her going forward -- does the deviation itself count as evidence that cooperation might continue, or is that just a confusion about what counterfactual reasoning in extensive-form games is for (basically the Binmore vs. Aumann fight)? Write me an essay that actually takes a side: does this paradox show defecting immediately isn't really forced by rationality after all, or does backward induction survive once we're careful about what "rational at every node" should even mean? Weigh both camps properly, but don't hedge at the end -- I want a real verdict, bullet-biting allowed.
