answer: |-
  ## MEMO: Grant Committee Recommendation & Analysis of Infinite EV Claim  
  **To:** Grant Committee Members  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Final Slot Recommendation & Critical Analysis of "Infinite EV" Argument for AI-Safety Project  

  ### I. Recommendation
  **I recommend we fund the Pandemic Preparedness Project for the final slot.** While both projects address critical existential risks, the pandemic project offers a higher *robustly expected value* given our knowledge, resources, and the imperative to make defensible comparative decisions. The AI-safety project's "infinite expected value" (EV) argument, while theoretically intriguing, is operationally incoherent for prioritization and fails under scrutiny. Below is a detailed analysis.  

  ---

  ### II. Engaging the "Infinite EV" Argument  
  *The Claim:* "Any project with a nonzero probability of reducing extinction risk has infinite EV because it preserves an unbounded future; thus, it dominates any finite-EV project."  

  *Why This Demands Scrutiny:*  
  1. **Paralysis in Prioritization:**  
     If *any* extinction-risk reduction project has infinite EV, then:  
     - All such projects are *equally* infinitely valuable.  
     - We cannot distinguish between a 0.1% chance and a 0.0000001% chance of success.  
     - We cannot compare two extinction-risk projects (e.g., AI safety vs. asteroid defense).  
     **→ This makes rational allocation impossible.** If we accept this logic, we could fund *any* extinction-risk project arbitrarily—even one with negligible plausibility—and justify neglecting all others.  

  2. **"Pascal's Mugging" Vulnerability:**  
     The argument reduces to: *"If outcome X has infinite value, then any probability ε > 0 implies infinite EV."* This is vulnerable to [Pascal's Mugging](https://en.wikipedia.org/wiki/Pascal%27s_mugging):  
     - A project claiming a 1/10¹⁰⁰ chance of saving the universe could demand all resources, no matter how implausible.  
     - **Practical consequence:** We lose the ability to filter based on *credible pathways to impact*.  

  3. **Neglects Probability & Tractability:**  
     Expected Value = Probability of Success × Impact. While the AI project’s *impact* (if successful) is vast, its *probability of success* is:  
     - Highly speculative (no validated theory of change).  
     - Contingent on unresolved technical/political hurdles.  
     - **Key insight:** Multiplying a microscopic probability (e.g., 10⁻⁶) by infinity is mathematically undefined in real-world decisions. We *must* weigh likelihoods.  

  4. **Ignores Opportunity Cost in a Multithreat World:**  
     Extinction risk is multimodal (AI, pandemics, nuclear war, etc.). Hyper-focusing on one risk:  
     - Increases vulnerability to *other* near-term threats (e.g., a pandemic could end humanity before AI risk materializes).  
     - Violates the **minimax principle**: Mitigate the most pressing credible threats first.  

  ---

  ### III. A Better Framework: Robustly Comparing Existential Risk Projects  
  We should evaluate projects using **practical expected value** (pEV):  
  ```
  pEV = (Probability of Success) × (Percent Reduction in Extinction Risk) × (Timeframe) × (Tractability)  
  ```  
  *Applied to our finalists:*  

  | **Metric**               | **Pandemic Preparedness Project**         | **Speculative AI-Safety Project**       |  
  |--------------------------|------------------------------------------|-----------------------------------------|  
  | **Probability of Success** | High (builds on proven models)           | Very Low (novel, untested approach)     |  
  | **% Risk Reduction**     | Bounded but significant (e.g., 0.5–2%)   | Unbounded potential, but deeply uncertain |  
  | **Timeframe**            | Near-term (3–10 years)                   | Long-term (15+ years)                   |  
  | **Tractability**         | High (clear milestones, expertise exists)| Low (requires conceptual breakthroughs) |  
  | **pEV (Qualitative)**    | **High confidence, moderate scale**      | **Low confidence, unknown scale**       |  

  **Crucially:** The pandemic project reduces *current* risk, preserving future optionality to address AI risk later. Failing to mitigate near-term risks *forecloses* all future opportunities.  

  ---

  ### IV. Why Pandemic Preparedness Wins the Slot  
  1. **Diversification:** We already fund multiple AI-safety projects. Adding pandemic mitigation hedges against single-failure modes.  
  2. **Neglectedness:** AI safety attracts >100× more funding than pandemic preparedness ([source](https://forum.effectivealtruism.org/posts/vYuu8ZvGyP6gx9KM6/global-catastrophic-risks-and-solution-areas-funding)).  
  3. **Execution Advantage:** Our committee has expertise in biosecurity; the project’s leader has a track record.  
  4. **Pathfinding Value:** Success here builds institutional credibility for funding riskier longtermist projects later.  

  ---

  ### V. Addressing the AI-Safety Advocate  
  *"Your project’s vision is vital, and we strongly support AI-risk mitigation. However, claiming infinite EV:*  
  - *Undermines our ability to prioritize among extinction threats.*  
  - *Could justify funding implausible projects over robust ones.*  
  - *Ignores that resources saved from near-term risks compound future efforts.*  
  *We need a framework that respects both the stakes and our epistemic limits. Let’s collaboratively refine this project for future rounds—focusing on measurable milestones to improve its pEV."*  

  ---

  ### VI. Final Decision  
  **Fund the Pandemic Preparedness Project.** Its bounded impact is *actionable*, and it mitigates a credible near-term threat without relying on metaphysical mathematics. Rejecting "infinite EV" doesn’t diminish AI risk; it ensures we allocate resources wisely across *all* existential threats.  

  **Next Steps:** I propose we:  
  1. Approve the pandemic project.  
  2. Commission a working group to develop a practical pEV framework for future grants.  
  3. Invite the AI-safety team to resubmit with concrete feasibility studies.  

  ---  
  *"The future is vast... but only if we survive the present. Let’s ensure we do."*  
  — Adapted from Nick Bostrom
