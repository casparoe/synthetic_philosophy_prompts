answer: |-
  Here’s a eulogy draft that honors Marguerite’s complexity, her devotion to Tolstoy’s "infection," and the beautiful, revealing contradiction of her secret romance novels. It aims to resonate with both the workshop alumni and her family/neighbors by grounding the theory in accessible human experience and her own life:

  **Eulogy for Marguerite**

  Good morning. For many of us here, Marguerite wasn't just a teacher; she was a force of nature contained in a converted garage. For thirty years, she held court there, surrounded by words and writers, demanding one thing above all else: honesty. Brutal, beautiful, gut-wrenching honesty.

  And she had a compass for finding it. Every autumn, like clockwork, she’d pull out that battered copy of Tolstoy’s essay, "What Is Art?" She’d assign the same chapter – the one about "infection." Marguerite believed, fiercely, that the highest purpose of art wasn’t to be clever, or stylish, or even necessarily "important" in the way critics often mean. It was to *infect*. To transmit feeling directly from one soul to another. "Does it *infect* you?" she’d press us in workshop, leaning forward, her eyes sharp. "Does it make you *feel* what the writer felt? Or is it just… clever?" She wasn’t satisfied until the work achieved that transmission, that spark jumping the gap. She saw so much celebrated writing – dazzling, technically perfect, admired – as what Tolstoy called "counterfeit art." Beautifully empty. Dead at the center.

  She held herself to this standard with terrifying rigor. We all knew about the "serious" novel. The one she polished for decades. The one she wrestled with, sentence by sentence, searching for that perfect transmission of truth. The one she never submitted. Because for Marguerite, if it didn’t truly *infect*, if it wasn't utterly honest, it wasn't ready. It wasn't *real* art by her own exacting measure. That unpublished manuscript wasn't a failure to her; it was a testament to her integrity. She wouldn't counterfeit.

  But Marguerite, as we all knew, was gloriously, wonderfully complex. And life, like the best art, is full of revealing contradictions. After she passed, going through her papers, we discovered something astonishing, something that perfectly illuminates this fierce, beautiful woman. Marguerite had a secret.

  For decades, alongside the demanding work of teaching and wrestling with her "serious" novel, Marguerite wrote something else. Under a pen name, she wrote six romance novels. Wonderful, unapologetically emotional, *trashy* in the best possible sense. The kind of books people devour on beaches and subways, the kind that make grown men blush and maybe, just maybe, shed a tear when no one's looking. Books designed purely to make you *feel* – joy, longing, heartache, triumph.

  And here’s the breathtaking part, the punchline Marguerite wrote with her own life: **By her own Tolstoyan logic – the logic she hammered into us year after year – those secret paperbacks might be the purest art she ever created.**

  Think about it. They weren't written for prestige. They weren't written to impress the literary elite she often viewed with skepticism. They were written to *connect*. To transmit feeling directly and powerfully to the reader. To *infect*. They made people feel deeply, immediately. They did exactly what she demanded of art in that garage workshop. They bypassed the "clever" and went straight for the heart.

  The unpublished novel? It was her lifelong quest for a *different* kind of infection, perhaps a more complex one, on her own uncompromising terms. But those vibrant, pulpy romances? They *worked*. They achieved the very transmission she held sacred. They were alive at the center.

  This discovery isn't a scandal; it’s a revelation. It shows us that Marguerite didn't just preach Tolstoy's infection theory; she *lived* it, in ways both profound and delightfully unexpected. Her secret wasn't hypocrisy; it was *integrity*. She practiced what she preached, even when the vessel for that truth was a paperback with a swooning heroine on the cover. She understood that real art – art that transmits genuine feeling – can wear many disguises. It doesn't reside only in the highbrow or the difficult; it thrives wherever honest emotion sparks and catches fire.

  So, what do we make of Marguerite? A teacher who demanded ruthless honesty. A writer who held her "serious" work to an impossible standard. And a secret author who, under a different name, mastered the very art of emotional transmission she championed.

  She taught us that art isn't about the container – the genre, the perceived prestige. It’s about the current that flows through it. Does it connect? Does it make you feel less alone? Does it *infect* you?

  Marguerite infected all of us in that garage. With her passion, her fierce intelligence, her unwavering belief in the power of genuine feeling on the page. And now, we know, she infected countless readers out in the world, making them laugh, cry, and swoon with her secret stories. She lived the truth she taught: that real art is alive. It transmits. It connects. It infects.

  And Marguerite, in all her brilliant, demanding, secretly romantic glory, was a master of the infection. We will miss her terribly, but the feeling she transmitted – her passion for real, honest, connective art – lives on in every writer she nurtured and every reader she moved. Thank you, Marguerite, for the honesty, the rigor, the secret swoons, and the unforgettable spark.

  ---

  **Why this works:**

  1.  **Grounds "Infection":** It explains the concept simply and vividly ("transmit feeling," "spark jumping the gap," "dead at the center") early on, making it accessible to the whole room. The repetition of "infect/infection" becomes a thematic anchor everyone can follow.
  2.  **Honors the Contradiction:** It doesn't shy away from the tension between the unpublished novel and the romances. It *uses* the tension as the central, revealing point.
  3.  **Applies HER Logic:** It explicitly states the core argument: "By her own Tolstoyan logic... those secret paperbacks might be the purest art she ever created." This is the heart of the tribute.
  4.  **Resolves the Contradiction with Integrity:** It frames the romance writing not as a betrayal, but as the ultimate act of integrity towards her own deepest belief about art ("She practiced what she preached," "Her secret wasn't hypocrisy; it was *integrity*").
  5.  **Universalizes the Lesson:** It connects her secret to the core principle she taught ("art isn't about the container... it's about the current that flows through it"). This makes the "insider" concept meaningful to outsiders.
  6.  **Celebrates Her Wholeness:** It paints a picture of a complex, passionate, rigorous, and unexpectedly playful human being. It avoids sainthood by embracing the contradiction.
  7.  **Tone:** It balances respect, warmth, and a touch of affectionate humor ("gloriously complex," "delightfully unexpected," "secret swoons") that feels true to someone who loved both Tolstoy *and* a good, emotional story.
  8.  **Focuses on Impact:** It ends by connecting her teaching impact and her secret writing impact, both under the umbrella of successful "infection."

  This eulogy doesn't just *mention* Tolstoy; it *uses* his central idea as the lens to understand and celebrate the fascinating, seemingly contradictory, but ultimately coherent truth of Marguerite's life and work. It should resonate with the workshop alumni who will recognize the depth of the argument, while also giving family and neighbors a clear, moving, and surprising insight into her passion and character. Good luck. She sounds like she was an incredible teacher and human.
