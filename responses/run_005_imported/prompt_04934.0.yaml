  First, I need to recall the core issue. Fitting-attitude theories say something is good if there's reason to have a pro-attitude (like desiring or admiring) toward it. The 'wrong kind of reasons' problem arises when there's a reason to have that attitude, but not because the object itself is valuable. Instead, the reason comes from external factors, like avoiding punishment. The distinction between object-given (reasons based on the object's properties) and state-given (reasons based on the state of having the attitude) is key here.

