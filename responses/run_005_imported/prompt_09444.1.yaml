  Gott's approach uses the Copernican principle to estimate the future duration based on how long something has already existed. His Berlin Wall example is key here. If you visit the wall 8 years after it was built, you're in the middle 95% of its existence with 95% confidence. That means there's a 2.5% chance it's in the first 2.5% or last 2.5% of its lifespan. From that, he calculates the remaining time. The formula involves a prior that's uniform in the logarithm of time. But this prior is a problem because it assumes that the total lifespan is equally likely to be any order of magnitude, which might not hold for human existence.

  On the other hand, Carter-Leslie is based on the self-sampling assumption. Here, you consider your birth rank among all humans who will ever live. If you're born around the middle of total humans, doom is likely soon. This method uses Bayesian updating without assuming a prior over the total number of humans. Instead, it requires a prior over the total number, but the update shifts probability towards earlier doom as you observe your birth rank.

  The user mentioned objections like reference class, self-indication, and self-application. For Gott, the reference class is tricky. What counts as the "observation period"? Human history? Civilization? Also, his prior might not fit human timelines. The self-indication objection might not hit Gott as hard because his method isn't about observer selection. But his prior is arbitrary, and applying it to humanity's timeline feels off.

  Carter-Leslie struggles more with reference class. Who counts as an observer? All humans? Modern humans? Birth rank isn't clear either. Self-indication is a bigger issue here. If more observers exist in the future, you're more likely to exist in a long-lived species, which counters the doomsday argument. Self-application might lead to absurdities if applied to individuals, like predicting your own death.

  Comparing the two, Gott's method is simpler but has a problematic prior. Carter-Leslie's Bayesian approach is more rigorous but gets tangled in observer selection issues. The user probably wants to understand which version is more defensible philosophically. They might be interested in the robustness of each against critiques, especially since the objections target different weaknesses.

