  ### Justifications
  - **Move 1 (Theo's argument)**: Score 2 (clearly right). Theo accurately reconstructs Fitch's paradox: the core argument is logically valid in classical logic and exposes a genuine tension in anti-realism. It relies only on uncontroversial principles (knowledge is factive, and knowledge distributes over conjunction), which even realists accept. This move successfully frames the paradox as a self-contradiction for unrestricted anti-realism.
    
  - **Move 2 (Nadia's restriction)**: Score -1 (wrong, but not egregiously so). Nadia's proposal to exclude "self-undermining statements" is ad hoc and unprincipled. As Theo later notes, she offers no independent criterion for the restriction beyond avoiding the paradox. This undermines anti-realism's generality and invites accusations of cherry-picking. While restriction strategies exist, this specific formulation lacks rigor.

  - **Move 3 (Theo's rebuttal)**: Score 1 (somewhat right). Theo correctly identifies the ad hoc nature of Nadia's restriction and notes that the paradox relies only on realist-friendly principles (factivity and conjunction distribution). However, he overlooks that anti-realists might reject classical logic independently (as Nadia later points out), weakening his claim that restriction "just hides the body." His critique is strong against Nadia's initial move but incomplete.

  - **Move 4 (Nadia's principled defenses)**: Score 2 (clearly right). Nadia lands two strong points:  
    (a) Restricting knowability to *non-epistemic statements* (e.g., those not about knowledge itself) is a principled, independently definable class (e.g., "the cat is on the mat" vs. "p and nobody knows p"). This avoids arbitrariness.  
    (b) Anti-realists (e.g., intuitionists) already reject classical logic's law of excluded middle (LEM). Without LEM, the step from ¬(p ∧ ¬Kp) to p → Kp (i.e., "all truths are known") fails. This is a non-ad hoc escape, as verificationists adopt intuitionistic logic regardless of Fitch's paradox.

  ### What Both Are Missing
  - **Theo** misses that anti-realism isn't monolithic: many versions (e.g., intuitionistic or paraconsistent approaches) reject classical logic *by default*, nullifying the paradox without post-hoc fixes. His argument assumes classical logic is mandatory, but anti-realists often dispute this on semantic grounds (e.g., truth as verification).
    
  - **Nadia** (and Theo) overlook deeper implications:  
    - Her restriction strategy might *over-constrain* anti-realism, excluding meaningful truths (e.g., "there are no epistemic agents" could be unknowable if all truths require knowability).  
    - Neither addresses whether "knowability" must be *uniform* (applying identically to all statements) or if pragmatic/perspectival variants could avoid the paradox without logic changes.  

  Fitch's paradox remains a technical challenge for anti-realism, but Nadia's intuitionistic logic defense (move 4b) is a robust, principled counter. Theo's initial critique stands only if anti-realism is forced into classical logic—a premise many anti-realists reject.
