  First, I need to reconstruct Aquinas's epistemological framework from Summa Theologiae I.14 and De Veritate 2.12. The key principles are: 1) God's knowledge is exclusively actual and causal, 2) all divine knowledge depends on God's will as first cause, 3) counterfactuals require an ontological anchor. These seem fundamentally at odds with Molina's pre-volitional middle knowledge.

  The user specifically wants to see where tensions arise within Thomism itself. So I should highlight the crux: Aquinas's insistence that God knows possibles only through His essence as unlimited imitability (ST I.15.3) versus Molina's claim that counterfactual truths exist independently. For Aquinas, a "free choice in unrealized circumstances" has no ontological status to be known infallibly.

  But I must also acknowledge where Aquinas leaves room for debate. His treatment of conditional futures in De Veritate 6 shows awareness of the conceptual problem Molina would later address. When he says God knows "what would happen if something else happened," he doesn't specify the metaphysical grounding - this is the gap Molinists exploit.

  The user's phrase "genuinely underdetermine" suggests they'd reject facile answers. So I'll emphasize that Aquinas's principles don't strictly prohibit middle knowledge; they render it redundant. If God's causal knowledge already encompasses all actual free choices, and His knowledge of possibilities covers what could occur, why posit a third category? The burden falls to Molinists to prove this layer is necessary.

  For the defense portion, I should contrast divine application of power (ST I-II.10.4) with Molinist circumstances-selection. Aquinas's God causes the will's existence and movement toward the good universally, while permitting specification - a simultaneous causal intimacy and contingency that makes middle knowledge seem like an explanatory wedge where none is needed.

  Ultimately the indeterminacy lies in whether "truths about non-existent freedoms" can be meaningful without divine causation. Aquinas would likely deny this, but since he never faced this precise formulation, we must deduce from his treatment of similar concepts like prophetic knowledge of conditionals. That's where I'll show the careful reasoning the user requested.
answer: |-
  Based on Aquinas's core principles regarding divine knowledge, causality, providence, and free will, his system **fundamentally rules out the coherence of Molina's *scientia media* as a distinct, pre-volitional category of infallible knowledge.** Here's the Thomistic argument reconstructed from his commitments, step by step:

  1.  **The Exclusively Actual and Causal Nature of God's Knowledge of Creatures:** Aquinas is unequivocal: God knows all things *because* He is their cause (ST I.14.8). His "knowledge of vision" (scientia visionis) – knowledge of what actually exists or will exist – is not merely observational; it is *causally constitutive*. As the First Cause, God's knowledge is the reason things *are* as they are and *happen* as they happen (ST I.14.8, ad 3; De Veritate 2.14). Knowledge and causality are intrinsically linked for God regarding the actual created order.

  2.  **The Dependence of All Contingent Truths on God's Will:** For Aquinas, truths about the created order, including future contingent truths, depend ontologically on God's creative and providential decree. Nothing contingent (including counterfactual truths about non-existent creatures) exists independently of God's causal act. "The divine will stands to all created things as their cause. Hence it is impossible that God should will anything apart from Himself without its coming to pass" (De Veritate 23.4, ad 2). Truths about *what would be* if God created differently are ultimately grounded *in God's knowledge of His own power and essence* (ST I.14.9), not in some realm of autonomous counterfactual facts.

  3.  **The Problem of Grounding Counterfactuals of Freedom:** Molina posits *true propositions* about what *any* possible free creature *would* freely choose in *any* possible circumstance, existing *logically prior* to God's creative decree. Aquinas's system provides no ontological grounding for such truths:
      *   **No Existing Subjects:** The creatures described don't exist.
      *   **No Existing Circumstances:** The circumstances described don't exist.
      *   **No Actual Causal Nexus:** There is no actual causal chain (divine or secondary) linking the non-existent creature to the non-existent choice in the non-existent circumstance.
      *   **Dependence on Divine Causality:** For Aquinas, the truth of a proposition about a creature's act requires that act to be grounded in reality, ultimately traceable to God as First Cause. These counterfactual acts lack *any* such grounding prior to God's decree.
      Therefore, Aquinas would argue these "counterfactuals of freedom" *simply are not true* in any meaningful, infallibly knowable sense *before* God freely decides to create a specific world order that includes specific creatures in specific circumstances. They are mere possibilities, known by God only through His knowledge of His own power and essence (scientia simplicis intelligentiae - ST I.14.9), not as settled truths.

  4.  **God as Universal Cause of Free Will Acts:** Aquinas's doctrine of divine causality is comprehensive: "God moves man's will... as the Universal Mover to the universal object of the will, which is good... Nevertheless, man determines himself by his reason to will this or that particular good" (ST I-II.9.6, ad 3; I.83.1, ad 3; I.105.4). God is the transcendent First Cause of the *very existence and operation* of the created will, including its free acts, while the creature is the *proximate cause* of the act's specific determination (its contingency). This simultaneous divine causality and creaturely freedom is a mystery, but it's fundamental to Aquinas. Molina's *scientia media* attempts to *isolate* the free choice from God's causality, making it a purely self-contained event known independently. For Aquinas, this is impossible. God's knowledge of the *actual* free choice *is* His knowledge of the *effect* of His own universal causal act upon the created will *in that specific circumstance*. There is no "free choice" *as an effect* to be known infallibly prior to God's causal act of creating *that* will *in that* circumstance.

  5.  **Providence and Predestination:** Aquinas's providence works *through* divine causality. God "provides for all things from eternity, ordering them towards their end" (ST I.22.1). Predestination (a subset of providence) is God's eternal plan for rational creatures to attain salvation, "including the preparation of grace in the present, and of glory in the future" (ST I.23.2). This plan is executed *causally*. God doesn't merely place creatures in circumstances based on foreseen independent choices; He *causes* their existence, their graces, and the circumstances themselves *as part of* effecting His providential plan for them. Molina's model, relying on foreseen independent choices to guide circumstance-placement, separates providence from God's intrinsic causality over the will's act in a way Aquinas's system cannot accommodate. God's knowledge of the outcome is part of His *causal* knowledge of the plan He is *executing*.

  **Conclusion on Coherence:** Aquinas's principles – the causal nature of divine knowledge of creatures, the dependence of all contingent truths on God's will, the lack of grounding for autonomous counterfactuals of freedom, and the doctrine of God as universal cause of the free act itself – **render Molina's *scientia media* incoherent within a Thomistic framework.** It posits a category of infallible knowledge divorced from divine causality, concerning truths that lack ontological grounding prior to the divine decree. Aquinas would likely see it as an unnecessary and ultimately incoherent layer that undermines the unity of divine knowledge and causality, and God's role as universal First Cause of all acts, including free ones.

  **Where Indeterminacy Arises & Points of Tension:**

  While the *core principles* strongly point to rejection, Aquinas's texts *do* contain points that create some interpretative space for debate, explaining the historical controversy:

  1.  **Knowledge of Conditional Futures:** Aquinas explicitly states God knows conditional futures: "God knows... even what would happen if something else happened" (De Veritate 2.12, ad 4; see also ST I.14.13). *However*, he doesn't provide a detailed metaphysical account of *how* God knows these or what *grounds* their truth. The Molinist argues this *is* middle knowledge. The Thomist (Báñezian) counters that Aquinas grounds this knowledge *entirely* in God's knowledge of His own will and causal power: God knows what *He would cause* or *permit* to happen if He willed different circumstances, not what a creature would autonomously do. **The indeterminacy lies in Aquinas's lack of explicit elaboration on the *grounding mechanism* for these conditional truths.** Molina fills this gap with his theory; Thomists fill it by insisting the grounding remains God's own causal knowledge and power.

  2.  **The Scope of "Possibles" (Scientia Simplicis Intelligentiae):** God knows all possibilities via His essence (ST I.14.9; I.15.3). This includes knowing *what a creature is capable of* doing freely in various situations. The Molinist might argue this *includes* knowledge of what it *would* choose. The Thomist insists this is only knowledge of *capacities* or *powers* inherent in the creature's nature, *not* knowledge of specific, contingent, free choices that would *actually* occur in non-actual circumstances. Knowing the nature of a lion tells you it *can* roar, not that it *would* roar at 3 pm tomorrow in a non-existent jungle. **The tension is whether knowing the *nature* and *power* of a possible free creature includes knowing its specific *exercises* of that power in infinite non-actual scenarios as settled truths.**

  3.  **The Mode of Divine Causality on the Will:** While Aquinas is clear God moves the will as Universal Mover, the precise metaphysical mechanism preserving contingency is subtle. Some interpretations lean towards "physical premotion" (Báñez), emphasizing God's direct causal influx determining the will's *act* (though not its specific choice *against* reason). Others emphasize God causing the will's *existence and power* while the creature specifies the act. **The tension arises in how "passive" the will is relative to God's motion.** A stricter interpretation (like Báñez's) leaves *no room* for Molinist independence; a slightly looser interpretation *might* (though unconvincingly to most Thomists) be stretched to imagine God knowing the outcome based purely on the creature's nature *given* the motion. Aquinas's core causality principle makes even this stretch difficult.

  **In summary:** Aquinas's explicit principles – divine knowledge as causal, the dependence of contingent truth on God's will, the lack of grounding for non-actual free choices, and God as universal cause of the free act – **strongly and logically rule out *scientia media* as a distinct, pre-volitional knowledge of infallible counterfactuals of freedom.** The theory is incompatible with his view of God's relationship to creation. The genuine points of indeterminacy arise primarily from his *brief* and *undetailed* treatment of conditional futures and the precise boundary between knowing possibilities (natures/powers) and knowing specific, contingent, non-actualized exercises of free will. While Thomists like Báñez offered one coherent resolution grounded in Aquinas's causal principles, the lack of explicit textual resolution on *that specific boundary* provided the opening Molina exploited and the reason Rome declined to definitively condemn either view. Nevertheless, integrating Molina's core concept would require abandoning or radically reinterpreting fundamental Thomistic commitments regarding divine causality and knowledge.
