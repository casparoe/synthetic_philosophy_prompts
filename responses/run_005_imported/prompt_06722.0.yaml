answer: |-
  Your frustration is completely understandable—this paradox cuts to the heart of how we define "expected value" and whether it meaningfully guides decisions when mathematical formalisms break down. Let's build intuition step by step, leveraging your physics background.

  ### 1. **The Core Tension: Temporal Reality vs. Mathematical Ambiguity**
  You're right: in any *actual* play of the Pasadena game, tosses unfold sequentially (n=1,2,3,...), and payouts occur in that order. Why not just sum in that order and call ln(2) the "true" expectation? The problem isn't computational—it's *conceptual*. Expected value (EV) is traditionally defined as a property of the *gamble itself*, independent of how we analyze it. Riemann rearrangement shows that this gamble lacks an *intrinsic* sum. If we demand that "the" EV must be a unique number satisfying basic properties (like linearity), the Pasadena game has none.

  ### 2. **Why Reshuffling Isn't Just a Curiosity: The Ensemble Perspective**
  As a physicist, consider how we define expectation: it's the long-run average over infinitely many *independent realizations* of the game. Crucially, there's no "temporal order" *across different plays*. Each realization is a distinct experiment. When you compute the average payout, you're free to *order these realizations* however you like before summing.  
  - **Example:** Imagine running 4 plays:  
    - Play A: Heads on n=1 → Payout = $2  
    - Play B: Heads on n=2 → Payout = -$2  
    - Play C: Heads on n=3 → Payout = ≈$2.67  
    - Play D: Heads on n=4 → Payout = -$4  
    Natural order sum: (2 - 2 + 2.67 - 4)/4 ≈ -$0.33  
    But reshuffle: Order them as A, C, B, D → (2 + 2.67 - 2 - 4)/4 ≈ -$0.33  
    *Or* reshuffle as B, D, A, C → (-2 -4 + 2 + 2.67)/4 ≈ -$0.33  
    **So far, no problem!** But with infinite plays, Riemann says I can reshuffle the *sequence of outcomes* to get *any* average. For instance, I could group all "high-magnitude positive" plays early and postpone negatives. Since the series is conditionally convergent, this reshuffled partial sum can converge to π, -10, or nothing.  
  - **Decision-Theoretic Bite:** If you offer me this gamble, should I accept? If the "average over many plays" can be rigged to look arbitrarily good *or* bad by reordering *which play I consider "first" in the ensemble*, the gamble lacks a well-defined long-run value. There's no stable answer to "What will I earn per game on average?".

  ### 3. **Altadena: The Dominance Argument That Sharpens the Knife**
  The Altadena game (Hájek & Nover, 2006) fixes the Pasadena payouts but scales them by λ > 0. Payout for first heads on *n* is now:  
  **(-1)^(n+1) · λ · 2^n / n**  
  - For 0 < λ < 1, the series is absolutely convergent → EV = λ·ln(2).  
  - For λ ≥ 1, it's conditionally convergent → no unique EV.  

  **Now consider dominance:**  
  - For *every possible outcome* (i.e., for every *n* where heads first occurs), the Altadena payout is *strictly greater* than the Pasadena payout (since λ > 1).  
  - By strict dominance, any rational agent should *strictly prefer* Altadena to Pasadena.  

  **The paradox:**  
  - If we compute in natural order:  
    - Pasadena "EV" = ln(2) ≈ $0.69  
    - Altadena (λ=2) "EV" = divergent series (e.g., partial sums oscillate wildly)  
  - How can we justify preferring Altadena when its "EV" is divergent/undefined, while Pasadena's is finite and positive?  

  **This exposes the flaw:** Insisting on natural-order summation for Pasadena (yielding ln(2)) but not for Altadena (where it diverges) violates dominance. If we *only* allow natural order, we lose the ability to compare gambles rationally. The reshuffling argument forces us to confront that "EV" fails its core purpose: ordering gambles by rationality.

  ### 4. **What "Order-Independent EV" Really Means**
  An expectation is "order-independent" if it satisfies:  
  **(i) Linearity:** EV(α·X + β·Y) = α·EV(X) + β·EV(Y)  
  **(ii) Stability under regrouping:** Summing over outcomes in any order (or partitioning outcomes into subgroups) gives the same value.  

  The Pasadena game violates (ii). In physics terms, it's like a divergent path integral whose value depends on the contour of integration. Riemann rearrangement proves that conditional convergence implies *failure* of stability under regrouping. Decision-theoretically, this means:  
  - If you define "EV" as natural-order summation, you must abandon linearity (as Altadena shows).  
  - If you demand linearity and dominance, you cannot define a unique EV for Pasadena.

  ### 5. **Philosophical Resolution: What Hájek/Nover Suggest**
  The solution isn't to dismiss reshuffling but to recognize that **some gambles lack an expected value**. We might:  
  - Use a **relative expectation** framework (Hájek): Compare gambles pairwise without assigning cardinal values.  
  - Adopt **finitely additive probabilities** or **weak expectations** (Nover).  
  - Accept that **natural order is a choice**, but then justify *why* it's privileged (e.g., "pragmatic resolution" as in Easwaran, 2019).  

  ### Intuitive Takeaway for the Physicist
  Think of the Pasadena game as an "ill-posed observable" in decision theory. Just as a quantum operator with no unique eigenvalue requires careful interpretation, this gamble has no unique expectation. Reshuffling isn't a trick—it's a stress test revealing that the gamble's value isn't intrinsic. **Temporal sequence fixes the order of payouts *within a single play*, but EV is an *ensemble* property over many plays, where ordering isn't constrained.** Altadena's dominance argument proves that clinging to natural order forces irrational trade-offs. The paradox shows that standard EV is fragile, and decision theory needs richer tools for such gambles.  

