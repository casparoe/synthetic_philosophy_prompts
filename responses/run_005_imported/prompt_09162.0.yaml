  The toast should feel like handing Mom a compass, not a critique. Her "what will I do" isn't weakness - it's the first step in Keynes' grand experiment. And crucially, her career wasn't waiting room time; it taught her how to build structure, which is exactly what leisure requires.

  Personal touch: Those garden metaphors work because they mirror accounting - nurturing growth, patience for results. And the grandkid line? Pure emotional payoff.
