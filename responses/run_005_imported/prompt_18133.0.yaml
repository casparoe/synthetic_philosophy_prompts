answer: |-
  ## The Urn and the Abyss

  **Setting:** A university common room, two armchairs facing Ellsberg’s urns – Urn 1 (50 red, 50 black), Urn 2 (100 red or black, unknown ratio). Peter (Precise Bayesian) leans forward, Anna (Imprecise Probabilist) observes calmly.

  **Peter:** Anna, let’s cut to the chase. Urn 2. What odds would you bet on red? You *must* name a number. Stating odds *is* stating your credence. Refusing is incoherent. Either you secretly think it’s 50%, just like Urn 1, and you’re being perverse, or… you simply have *no* rational opinion. Which is it?

  **Anna:** Neither, Peter. That’s the false dilemma. My rational state *isn’t* captured by a single number for Urn 2. Urn 1? Absolutely. I know the physical chance is 0.5, so my credence is sharp: 0.5. I’d bet at even odds. Urn 2? The evidence is silent on the ratio. It could be 0 red, 1 red, ... up to 100 red. Any prior probability distribution over the possible ratios is equally compatible with my total ignorance. My credal state is the *set* of all probability functions consistent with that ignorance. So, for ‘red’, it’s the interval (0,1). Saying I refuse to name a single number isn’t evasion; it’s honesty about the indeterminacy the evidence warrants. I *have* an opinion: it’s indeterminate within those bounds.

  **Peter:** (Scoffs) Indeterminacy? Sounds like indecision masquerading as virtue. But fine, let’s grant your ‘credal set’. How does it guide action? You use E-admissibility, right? An act is permissible if it maximizes expected utility under *some* probability in your set. Now, imagine a sequence of bets. First, I offer you a bet *against* red in Urn 2 at odds slightly *better* than fair for *any* probability above, say, 0.4. Since for some P in your set (those below 0.4), betting against red maximizes EU, it’s E-admissible. You accept. Later, I offer you a bet *for* red at odds slightly better than fair for any probability *below* 0.6. Again, for some P in your set (those above 0.6), this bet is E-admissible. You accept. Congratulations, you’ve just bought a pair of bets guaranteeing you a loss, no matter what the ratio is! A sharp credence agent, anchored at 0.5, would see the incoherence and reject one bet. Your credal set, and E-admissibility, got you pumped for money. How is that rational? To avoid this, you’d need a rule forcing consistency across choices, which smuggles in a sharp credence!

  **Anna:** Peter, that’s a clever pump, but it misapplies E-admissibility diachronically. My credal set represents my epistemic state *at a time*. When I accept the first bet *against* red, I do so based on my state *then*. Accepting that bet doesn’t magically change the composition of Urn 2, but it *does* change my total situation. When you offer the second bet *for* red *later*, I evaluate it based on my *then-current* epistemic state and resources. Crucially, I haven’t learned anything *new about the urn* between bets. My credal set for the urn’s composition remains (0,1). However, my financial situation has changed because I hold the first bet. Evaluating the second bet requires considering the joint outcome of *both* bets relative to my *current* credal set. For *any* fixed ratio in the urn, holding both bets *is* a guaranteed loss. Relative to my *unchanged* credal set over urn compositions (0,1), *every* probability function sees this combination as dominated – it has lower EU than simply taking neither bet, or only one. Therefore, taking the second bet is *not* E-admissible *given that I already hold the first bet*. Levi’s rule handles this; it evaluates acts relative to the *current* state, including prior commitments. Your pump requires me to evaluate acts in isolation, ignoring the diachronic context my rule inherently respects.

  **Peter:** Hmph. Diachronic consistency saves you *this* time, perhaps. But your indeterminacy creates other pathologies. Take **dilation**. Imagine a fair coin *C* you’ve never seen tossed. Your credence for heads is sharp at 0.5, right? Now, draw a ball from *your* beloved Urn 2 (unknown ratio). Let proposition *H* be: The coin lands heads *iff* the drawn ball is red. Before drawing, what’s your credence in *H*?

  **Anna:** Given total ignorance linking the coin and the urn, and knowing the coin is fair? My credal set for *H* remains the set generated by combining the sharp 0.5 for the coin with the full (0,1) for red. So, credence in *H* is still (0,1). Learning whether the ball is red or black tells me nothing about the coin’s fairness.

  **Peter:** Exactly! Now, *condition* on the ball’s color. Suppose you learn it’s Red. Now, *H* is true iff the coin lands heads. What’s your credence in *H* *now*?

  **Anna:** (Pauses) It dilates. Learning the ball was red doesn’t tell me the coin’s bias changed. But it *does* mean that *H*’s truth now depends *solely* on the fair coin. So my credence in *H* sharpens to 0.5.

  **Peter:** But *before* learning the color, your credence in *H* was spread over (0,1). *After* learning a highly relevant piece of evidence – the color of the ball – your credence *collapses* to a sharp 0.5. You’ve become *more* certain about *H* after getting evidence! That’s the opposite of learning. If you learn it’s Black, same thing: credence in *H* becomes 0.5. So, no matter what you learn – Red *or* Black – your credal set *narrows* from (0,1) to {0.5}. You become *less* uncertain after gaining evidence! How can conditioning on genuinely relevant evidence *reduce* your uncertainty in this perverse way? A sharp agent starts at 0.5, stays at 0.5 – learning the color changes nothing, as it should. Your set inflates uncertainty where there should be none, and then collapses it arbitrarily upon learning.

  **Anna:** It *is* counterintuitive, I grant you. But it’s not arbitrary; it’s a consequence of faithfully representing the *limits* of the evidence. *Before* the draw, the link *H* is maximally ambiguous because it depends entirely on the unknown urn ratio. Learning the color *resolves the ambiguity introduced by the urn* by fixing the relevant outcome. Once the color is known, *H*’s dependence shifts entirely to the *known fair coin*, hence the sharp 0.5. The dilation reflects the *removal of one source of ambiguity*, leaving only the well-understood source. It’s not that I’m *more* uncertain after learning; it’s that the *nature* of the uncertainty changes from deep ambiguity (unknown chance) to risk (known chance). The set accurately tracks this shift. Your sharp 0.5 *masked* the initial ambiguity, pretending knowledge where there was none. Dilation reveals the hidden complexity your sharpness glosses over. It’s a cost of honesty, not irrationality.

  **Peter:** Honesty that leads to money pumps – narrowly avoided by complex rules – and credences that widen upon learning? Your ‘honesty’ looks suspiciously like a lack of commitment. My sharp credence, grounded in indifference or estimated frequency where possible, provides clear, actionable guidance without these paradoxes. It might be a precisification, but it’s a *rational* one.

  **Anna:** And your ‘precisification’ forces an artificial certainty onto ignorance, Peter. It pretends ambiguity doesn’t exist or must be resolved arbitrarily. My credal set *acknowledges* the abyss of the unknown urn. The sequential choice rules prevent exploitation *without* collapsing to sharpness, and dilation, while jarring, reflects the genuine evidential dynamics when ambiguity is present. Your way is tidy but can be misleadingly precise. Mine is messy but faithful to the poverty of evidence. That’s the core of it, isn’t it? Whether rationality demands we always fill the gaps, or sometimes admit they exist.

  **Peter:** (Looks at the urns, then back at Anna) It seems it is. The gap… or the bridge. We build our bridges differently. Mine gets me across cleanly. Yours… shows me the depth of the chasm, perhaps too vividly.

  **Anna:** And sometimes, Peter, seeing the chasm clearly is the only way to avoid falling in. Even if it makes crossing less straightforward.

  *(They both stare at the enigmatic Urn 2, the unresolved tension hanging as palpable as the unknown ratio within it.)*
