  ### Grading Breakdown (16/20)

  1.  **Knowledge Norm Explanation (5/6):**
      *   **Strengths:** Clear definition, correct attribution (Williamson), excellent use of Moorean paradox example. Correctly contrasts with truth/belief norms.
      *   **Weaknesses:** Minor imprecision in calling Moorean sentences "logical contradictions." (They are paradoxical/absurd/moorean, but not logically contradictory like "P and not-P").

  2.  **Lottery Case Argument (7/8):**
      *   **Strengths:** Textbook example of the lottery paradox for assertion. Perfect setup (fair lottery, 1 ticket). Correctly identifies the high justification but lack of knowledge. Clearly states the intuition against flat assertion and the need for hedging. Strongly links this to the inadequacy of justified belief and the need for knowledge.
      *   **Weaknesses:** Could slightly emphasize that the belief is justified *and* (if the ticket loses) *true*, yet still not knowledge. This makes the case even stronger against the justified belief norm (as it shows J+B+T isn't sufficient for proper assertion if it's not K).

  3.  **Discussion: Knowledge Norm vs. Truth Norm (4/6):**
      *   **Strengths:** Correctly notes that knowledge entails truth. Correctly dismisses irrelevant factors (lying, misremembering) for the core conceptual point.
      *   **Weaknesses:** **Major Error:** The claim "anything true is something you know" is fundamentally wrong. This conflates truth with knowledge. The key difference is that a pure **truth norm** allows assertions that are *merely* true, even if the asserter has no justification, or only a lucky guess (Gettier cases are prime examples). The **knowledge norm** forbids such assertions. While the knowledge norm *implies* the truth norm (if you know p, p must be true), the converse is false. P being true does *not* mean you know it. Therefore, the norms differ significantly: the knowledge norm is stricter, ruling out lucky true assertions. Dana misses this core objection/point in the literature.

  **Recommendation for Dana:** Focus on the distinction between *entailment* (Knowledge -> Truth) and *equivalence* (Knowledge <-> Truth). The knowledge norm *entails* the truth norm but is not equivalent to it. The truth norm allows assertions the knowledge norm forbids (lucky true assertions). This is the standard response to the "collapse" objection Dana raised.
