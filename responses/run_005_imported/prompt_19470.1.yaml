  I should check if there are nuances they missed. Nietzsche's mention of "half-educated" people suggests he's criticizing a cultural misconception, not just making a logical argument. This adds a psychological dimension. The user might appreciate noting that Nietzsche combines logic with cultural critique, making his version richer but less precise than Strawson's. 

