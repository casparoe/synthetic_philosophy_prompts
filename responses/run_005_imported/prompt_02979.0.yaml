  Okay, the user is in a social epistemology seminar studying the Bikhchandani-Hirshleifer-Welch model. They understand the math but want a concrete example to grasp the intuition. The core request is for a short story demonstrating rational herding - where someone ignores their private signal to follow the crowd, yet this remains rational given limited information. 

  Hmm... they specifically want three elements: 
  First, a clear case of someone rationally overriding their private signal due to public actions. 
  Second, a cascade collapse triggered by minor new information. 
  Third, the story should highlight why this isn't mere peer pressure but Bayesian rationality. 

  The restaurant choice scenario feels ideal - it's relatable and allows sequential decisions. Let me structure it around "The Golden Duck" vs "Lucky Noodle" dilemma. Key mechanics to show: 
  - Person 1: Chooses based solely on private signal (say, a "Golden Duck" flyer) 
  - Person 2: Sees Person 1's choice, gets conflicting signal ("Lucky Noodle" coupon), but rationally follows Person 1 because two signals > one 
  - Person 3 onward: Even with contradictory private signals, the accumulated public actions outweigh their own info 

