  hey so in my social epistemology seminar we've been going over the Bikhchandani-Hirshleifer-Welch model of information cascades and rational herding, and i get the math but i dont really *feel* it yet. could you write me a short story (any setting, a jury, a restaurant, people buying stock, whatever) that actually shows the mechanism — someone has a private signal pointing one way, but they look at what everyone before them did and rationally decide to ignore their own info and go with the herd instead. bonus points if it ends with the whole cascade collapsing because of like one small new piece of public info, so it's obvious in hindsight how little actual information the 'consensus' was ever built on. basically trying to understand why this counts as rational and not just peer pressure, if that makes sense
