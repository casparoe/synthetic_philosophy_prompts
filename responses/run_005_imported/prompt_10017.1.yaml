answer: |-
  Okay, let's ditch the jargon and gut-punch this with Blackburn's quasi-realism, focusing *specifically* on how modus ponens ("Lying is wrong; If lying is wrong then getting your brother to lie is wrong; Therefore, getting your brother to lie is wrong") works without sneaking in truth-aptness. The key is **higher-order attitudes**.

  Here's the breakdown, step-by-step, using the lying example:

  1.  **"Lying is wrong" (The First Premise):**
      *   **Expressivist Gut-Level:** This isn't stating a fact "out there." It's you *expressing* a **negative attitude** towards lying – disapproval, condemnation, "boo lying!" Call this attitude **A-**.

  2.  **"If lying is wrong, then getting your little brother to lie is wrong" (The Second Premise):**
      *   **Expressivist Gut-Level:** This *isn't* saying "If some fact obtains, then another fact obtains." That *would* sneak truth-aptness in.
      *   **Blackburn's Move:** This conditional expresses a **higher-order attitude** about the *relationship* between your first-order attitudes. Specifically, it expresses **rejection of a certain combination of attitudes**.
      *   **What combination?** Rejection of having **A-** towards lying *while simultaneously NOT having* **A-** towards getting your brother to lie.
      *   **Gut-Level Translation:** "**Boo!** to the idea of me disapproving of lying but *not* disapproving of getting my brother to lie." It's expressing disapproval (*another* attitude!) towards the *inconsistency* of holding the first attitude without the second.

  3.  **The Inference (Modus Ponens):**
      *   You've expressed **A-** towards lying. (Premise 1)
      *   You've expressed rejection (let's call it **R**) towards the combo [**A-** towards lying + *lack* of **A-** towards getting brother to lie]. (Premise 2 - the conditional)
      *   **What happens when you put them together?** You are now *committed* to having **A-** towards getting your brother to lie. Why?
          *   If you *didn't* have **A-** towards getting your brother to lie, you would *precisely* be in the state of mind that Premise 2 (**R**) expresses disapproval *towards*. You'd be holding the forbidden combo: [**A-** towards lying + *lack* of **A-** towards brother lying].
          *   But Premise 2 shows you **reject** that combo (**R**). You find that inconsistency unacceptable.
          *   And Premise 1 shows you *do* have **A-** towards lying.
      *   **Therefore:** To avoid being in the state of mind you yourself condemn (**R**), you *must* adopt **A-** towards getting your brother to lie. The conclusion is forced by the *commitment to consistency* embodied in your higher-order attitude (**R**).

  **How This Solves Frege-Geach Without Truth-Aptness:**

  *   **No "Facts" Needed:** The validity doesn't come from the premises *describing* states of affairs that make the conclusion *true*. It comes from the *practical inconsistency* of holding the premises' attitudes while rejecting the conclusion's attitude.
  *   **Attitudes All the Way Down:** The conditional premise isn't a truth-apt description of a logical relationship "out there." It's *another expression of an attitude* (rejection of inconsistency). The inference is a *practical* constraint: "Given the attitudes you've *expressed*, expressing this *other* attitude would make your overall set of attitudes incoherent in a way *you yourself* have condemned."
  *   **Validity Preserved:** Modus ponens works because rejecting the conclusion while accepting both premises lands you in a state of mind (holding the forbidden attitude combo) that the second premise *itself* expresses an attitude *against*. The inference rule tracks *attitudinal consistency*, not truth-preservation in the realist sense.

  **Analogy (Gut-Level):**

  Imagine attitudes like moves in a game you've committed to playing:

  1.  Premise 1 ("Lying is wrong"): You make the move "Boo Lying!" (**A-**).
  2.  Premise 2 (The Conditional): You make the move "Boo to anyone who says 'Boo Lying!' but *doesn't* also say 'Boo Getting Brother to Lie!'" (**R**). This is a rule *you* just imposed on the game.
  3.  Conclusion: Now, if you *don't* say "Boo Getting Brother to Lie!", you've broken the rule you just laid down in move #2. You're violating your *own* declared standard for coherent play. Saying "Boo Getting Brother to Lie!" isn't about describing reality; it's the *only move* that keeps you playing by the rules *you* established with your previous moves.

  **Why it's not smuggling truth-aptness:**

  *   **The "Truth" is Internal:** The "validity" or "correctness" of the inference isn't about correspondence to moral facts. It's about the *internal coherence* of your own expressed commitments and the attitudes you reject. It's like saying, "Given the rules *you* set for your own attitudes, you *must* adopt this attitude to avoid self-contradiction in your expressive commitments." The "must" is practical and commitment-based, not metaphysical.
  *   **Quasi-Realism's Triumph:** Blackburn argues that developing a sophisticated enough account of these higher-order attitudes and commitments *earns the right* for expressivists to *mimic* realist talk ("validity," "truth," "moral facts") *without* actually believing in moral properties out in the world. The logic works *because* of the structure of our attitudes, not *despite* it.

  **The Core Takeaway:** Gibbard's hyperplans work similarly (planning to blame lying; planning to adopt the plan to blame brother-lying if you adopt the plan to blame lying; therefore, you are committed to planning to blame brother-lying). The power comes from seeing moral language as expressing complex states of planning/commitment whose internal structure generates logical constraints. The "rescue" of modus ponens isn't a sneaky trick; it's demonstrating that the *expressive function* of language, even non-truth-apt language, can have a rich logical structure based on the consistency of the states being expressed. The validity is grounded in avoiding *expressive* or *commitmental* self-contradiction.
