  First, I need to recall how expressivism traditionally fails with embeddings. In a conditional like "If lying is wrong, then getting your brother to lie is wrong," the antecedent isn't being booed; it's hypothetical. So how do expressivists account for the validity of modus ponens here?

  For Blackburn's quasi-realism, the key is higher-order attitudes. Instead of seeing the conditional as truth-conditional, it's about expressing attitudes towards combinations of attitudes. So "If lying is wrong, then getting your brother to lie is wrong" becomes a rejection of approving lying while not condemning making others lie. That makes sense. The validity of modus ponens comes from the consistency of these higher-order commitments. If you condemn lying and also reject condemning lying without condemning making others lie, then you're committed to condemning making others lie. No truth values needed; it's about the coherence of your attitudes.

  Gibbard's hyperplans approach moral judgments as planning what to do in conceivable situations. "Lying is wrong" means planning to blame lying. The conditional becomes a plan to adopt certain plans based on others. Modus ponens works because if you plan to blame lying and plan that if you blame lying, you blame making others lie, then you're committed to blaming making others lie. It's about the structure of your plans being consistent.

