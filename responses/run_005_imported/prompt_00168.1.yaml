  I should explain why personal transformation breaks expected utility theory. It's not just about unknown probabilities or utilities; it's that the utilities change fundamentally based on the choice. The evaluative standard shifts, so there's no stable basis for comparison. For example, becoming a parent might make you value different things, so your pre-parent self can't predict if you'll endorse those values later.

  The user also needs examples to illustrate this. Vampire turning shows epistemic transformation—learning what it's like to be a vampire. But personal transformation changes your desires, like no longer caring for sunlight. The problem is the post-decision self has new values, making pre-decision evaluation incoherent.

  Connecting to authenticity: if your values change based on the choice, how can the decision be authentic? Rational choice assumes a consistent self, but transformative choices create a new self. This ties into debates about whether rationality requires fixed preferences or if evolving preferences can be rational.

