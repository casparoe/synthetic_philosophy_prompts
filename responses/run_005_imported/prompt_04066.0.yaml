  First, I need to recall the core of Zahavi's handicap principle. He proposed that costly traits act as honest signals because only high-quality individuals can afford the waste. For him, the waste itself was essential—it wasn't just a byproduct but the mechanism ensuring honesty. The example of peacock tails is classic: the tail is heavy and cumbersome, so only the fittest can survive with it. Zahavi emphasized that the cost must be wasteful, not just costly in terms of energy but genuinely inefficient.

  Then there's Grafen's model. He used game theory to show how honest signaling can be evolutionarily stable. His model focuses on marginal costs—the additional cost of increasing the signal intensity. High-quality individuals have lower marginal costs, meaning it's cheaper for them to produce a more intense signal. This allows honesty without requiring the signal to be wasteful overall. For instance, a signal might be efficient if it diverts resources from less critical areas, but the differential cost maintains honesty. Grafen's approach is about strategic optimization, not inherent waste.

