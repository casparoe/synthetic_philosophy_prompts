answer: |-
  That passage from Newton's Scholium is a fascinating and often-overlooked gem, revealing a core *metaphysical* commitment underlying his substantivalism. Let's break it down sentence-by-sentence, assess its structure and validity, and craft a sharp relationist reply:

  **Sentence-by-Sentence Analysis & Argument Reconstruction:**

  1.  **"As the order of the parts of time is immutable, so also is the order of the parts of space."**
      *   **Argument:** Newton establishes an analogy between time and space. He takes the immutability of temporal sequence (that past, present, future events have a fixed order) as intuitively obvious and uncontroversial. He then claims the same immutability applies to the *spatial* order – the relative positions of the "parts of space" themselves.
      *   **Purpose:** This sets the stage. It frames space as having an inherent, fixed structure analogous to time.

  2.  **"Suppose those parts to be moved out of their places, and they will be moved (if the expression may be allowed) out of themselves."**
      *   **Argument:** Newton presents a *reductio ad absurdum*. He asks us to imagine the fundamental parts of space *themselves* being moved. The consequence, he claims, is paradoxical: moving a "place" would mean moving it *away from itself*. What was *here* would no longer be *here*, but the concept of "here" is defined by that very place. This creates a contradiction in terms.
      *   **Key Move:** This is where the argument hinges. Newton treats "parts of space" (places) as *individuated entities* with an intrinsic identity tied to their location *within the whole structure of space itself*. Moving them implies they lose this identity, becoming something else, which is nonsensical.

  3.  **"For times and spaces are, as it were, the places as well of themselves as of all other things."**
      *   **Argument:** He justifies the previous step. Time and space are not *in* something else; they are the fundamental *containers* or *frameworks*. They are the "places" where *everything*, including themselves, exist. Time is the "place" of events and moments; space is the "place" of objects and locations. They are self-grounding.
      *   **Purpose:** Reinforces the substantivalist view: space is an entity *in which* things happen, not merely a relation *between* things. Its existence and structure are primary.

  4.  **"All things are placed in time as to order of succession; and in space as to order of situation."**
      *   **Argument:** Restates the fundamental role of time and space. Time orders events sequentially; space orders objects positionally. This ordering is provided *by* time and space themselves.
      *   **Purpose:** Emphasizes that the ordering relation is *imposed by* the substantival container, not emergent from the relations of the contained entities.

  5.  **"It is from their essence or nature that they are places; and that the primary places of things should be movable, is absurd."**
      *   **Argument:** This is the conclusion drawn from the *reductio*. The very *essence* (the fundamental, defining characteristic) of space (and time) is *to be the primary framework of location*. Because this is their essence, the idea that these primary locations themselves could *move* is logically absurd. Movement is defined *relative to* these primary locations. To move them requires some *super-space*, which contradicts their status as primary.
      *   **Core Claim:** Places (parts of space) have an *intrinsic identity* defined by their position in absolute space. Moving them destroys this identity, leading to contradiction. Therefore, they *cannot* move; they are fixed. This immobility and fixed identity necessitate absolute space.

  6.  **"These are therefore the absolute places; and translations out of those places, are the only absolute motions."**
      *   **Argument:** Having "proven" that the primary places are immovable, Newton concludes they are *absolute* places. Motion, then, is absolute when it is translation relative to *these* fixed absolute places, not just relative to other bodies.
      *   **Link to Empirics:** This sets up the need for his later arguments (bucket, globes) to show that we can *detect* this absolute motion empirically, as relative motions alone are insufficient to explain phenomena like inertia and centrifugal force.

  **Reconstructed Core Argument (Non-Empirical & Metaphysical):**

  1.  **Premise 1 (Analogy):** The order of time is immutable. (Taken as axiomatic).
  2.  **Premise 2 (Analogy Extension):** By analogy, the order of space is similarly immutable.
  3.  **Premise 3 (Individuation):** The "parts of space" (places) are individuated by their intrinsic position within the immutable spatial order. This position constitutes their essence/identity.
  4.  **Premise 4 (Reductio Premise):** Suppose a place could be moved.
  5.  **Premise 5 (Reductio Consequence):** Moving a place would mean moving it *away from itself* (since its identity *is* its position). This is a contradiction.
  6.  **Conclusion 1 (Reductio):** Therefore, places cannot move. They are immobile.
  7.  **Conclusion 2 (Substantivalism):** Therefore, space is an absolute, immobile, substantival entity providing the fixed framework of locations (absolute places).
  8.  **Conclusion 3 (Motion Definition):** Absolute motion is change of location relative to these absolute places.

  **Assessment: Does it Succeed? Is it Circular?**

  *   **Independent Argument?** Yes, it is genuinely intended as a *prior*, non-empirical, metaphysical argument for the *existence* and *nature* of absolute space, distinct from the later empirical arguments which aim to show its *necessity for physics* and our ability to detect motion relative to it.
  *   **Trading on Definitions?** **Yes, critically, and this is its fatal flaw.** The argument **presupposes substantivalism** in its core premises, making it **circular** or **question-begging** against a relationist.
      *   Premise 3 is the crux: Newton *assumes* that places have an *intrinsic* identity defined by an absolute spatial background ("their essence or nature"). A relationist denies precisely this. For a relationist, a "place" *just is* a set of spatial relations to other material bodies. There *is no* "itself" beyond those relations to move "out of."
      *   The *reductio* only works if you already accept that a "place" is an entity with an identity independent of the bodies within it. If "place" is relationally defined, then "moving space" is meaningless – you can only move bodies relative to *other bodies*. Changing all relations uniformly isn't "moving space," it's just a different relational configuration with no absolute change. Newton's paradox ("moved out of themselves") vanishes.
      *   The analogy to time is weak. While temporal ordering feels intuitive, the immutability of *spatial* order in Newton's absolute sense is precisely what's disputed. Relationists argue spatial relations *can* change (when bodies move relative to each other), and that's all there is.
  *   **Verdict:** The argument **fails as a demonstration against relationism**. It doesn't *prove* substantivalism; it *articulates* the substantivalist intuition and attempts to defend it by showing the perceived absurdity of the alternative *from within the substantivalist framework*. It trades on the very concept (intrinsically individuated places) that the relationist rejects. It's more of a *declaration* of Newton's metaphysical commitment than a standalone proof.

  **Sharp Relationist Reply (Leibnizian or Contemporary):**

  "Newton's argument rests upon a fundamental confusion, conflating the *framework* with the *entities* it describes. He begins by correctly noting that we *use* space to describe the order of situation of bodies (a relational concept). But then, illicitly, he reifies this framework into an entity possessing its own 'essence' and immutable 'parts.'

  His *reductio* is ingenious but hollow. The absurdity of a place being 'moved out of itself' arises *only* if one first assumes that a 'place' is a *substance* with an identity fixed absolutely, rather than merely a *relational property* defined by the contingent configuration of bodies. If 'place' simply *means* 'position relative to bodies A, B, C...', then the concept of 'moving the place itself' independent of moving those bodies is literally incoherent. It's like speaking of 'moving' the concept of 'leftness.' What would it move *relative to*? Newton illicitly demands an answer using the absolute framework whose existence he's trying to prove.

  Furthermore, his analogy to time fails. Temporal succession *also* need not be absolute. The 'immutable order' of events can be understood relationally – event E1 precedes E2, which precedes E3 – without requiring an absolute 'flowing now' or a container of time itself. Modern physics, from relativity to Barbour's timeless formulations, strongly suggests both space and time are fundamentally relational. Newton's appeal to 'essence' is an artifact of a pre-relational metaphysics, mistaking a useful descriptive framework for an independent entity. The true 'primary places' are defined by material relations; to posit an absolute space behind them is to add a superfluous entity that explains nothing observable *except* through the very circularity of this argument."

  **In Summary:**

  Newton offers a genuine *metaphysical* argument for substantivalism, independent of his later empirical points. It hinges on the claim that places must have an intrinsic, immobile essence defined by their position in an absolute order, and that moving them leads to absurdity. However, the argument is circular: it assumes the intrinsic individuation of places (core to substantivalism) to "prove" substantivalism. The sharpest relationist reply denies this premise, arguing that "place" is purely relational, rendering Newton's *reductio* incoherent and his appeal to "essence" a reification error. This passage reveals the deep metaphysical bedrock of Newton's position, but it doesn't successfully dislodge the relationist alternative.
