answer: |-
  You've nailed the core philosophical tension at the heart of climate economics. Your economist friend is fundamentally right: **there *is* a deep, principled distinction between "pure time preference" (PTP) and "growth-adjusted discounting" (consumption discounting).** Philosophers (and ethically-minded economists) object to PTP for strong moral reasons, while accepting growth-based discounting as a logical consequence of fundamental welfare economics. Here's the breakdown:

  **1. Pure Time Preference (PTP): Discounting Because It's Later**
  *   **Definition:** Assigning less weight to a unit of *well-being* (utility, welfare) *solely* because it occurs at a later point in time. Valuing the same level of happiness less if it happens to someone in 2124 than to someone identical in 2024.
  *   **Ramsey's Indictment (1928):** This is the core of his "ethically indefensible" critique. His reasoning is powerful:
      *   **Impartiality:** Ethical reasoning demands impartiality between persons. Location in space (e.g., valuing someone less because they live far away) is arbitrary discrimination. Location in time is *also* arbitrary. Why should the calendar date *itself* determine the moral weight of well-being?
      *   **No Rational Justification:** There's no inherent moral reason why well-being in the future is less valuable than identical well-being now. It's pure chronological discrimination.
      *   **Analogy:** Discounting future lives/well-being purely due to time is akin to discounting the well-being of people in a different country purely due to distance – both are ethically arbitrary.
  *   **Why Philosophers/Objectors Care:** PTP violates the principle of the equal moral standing of persons across generations. It systematically devalues the interests of future people simply because they aren't born yet. This is seen as a fundamental injustice in intergenerational ethics, especially for irreversible harms like climate change where future people bear the cost of current actions but have no voice.

  **2. Growth-Adjusted Discounting (Consumption Discounting): Discounting Because It's Worth Less**
  *   **Definition:** Assigning less weight to a unit of *consumption* (or monetary value) in the future because future people are expected to be richer. This arises from the principle of **diminishing marginal utility of consumption**.
  *   **The Logic:**
      1.  **Diminishing Marginal Utility (DMU):** An extra dollar (or ton of damage avoided) provides less additional well-being (utility) to a richer person than to a poorer person. This is a bedrock assumption of welfare economics and utilitarianism.
      2.  **Expected Growth:** We generally expect future generations to be wealthier than the current generation due to economic growth and technological progress (though climate damage threatens this).
      3.  **The Discounting Consequence:** Therefore, a dollar of cost or benefit *in the future* translates into *less additional well-being* than a dollar today, *because the future recipient is likely richer*. We discount future *consumption* flows because their *marginal well-being impact* is lower.
  *   **Why Philosophers/Objectors Accept This (or at least don't object on the same grounds):**
      *   **It Respects Equal Moral Standing:** This approach *does not* devalue the *well-being* of future people. It values *a unit of well-being* equally, regardless of when it occurs.
      *   **It Respects Context:** It acknowledges that the *value* of a dollar depends on the recipient's circumstances. Giving $100 to a starving person creates vastly more well-being than giving $100 to a billionaire. This is ethically sound reasoning.
      *   **It's Consequentialist Logic:** Within a utilitarian or welfare-economic framework (which dominates cost-benefit analysis), accounting for DMU is essential for accurately comparing the *net impact on well-being* of different actions. Ignoring DMU would lead to inefficient and potentially inequitable resource allocation *even within a generation*.
      *   **It's Not About Time, It's About Wealth:** The discounting stems from the *expected wealth* of the future recipient, not the *time* itself. If we expected future generations to be *poorer* (e.g., due to collapse), this logic could imply a *negative* discount rate – future dollars would be weighted *more* heavily.

  **The Crucial Distinction in Practice (Stern vs. Nordhaus):**
  *   **Stern:** Set the PTP component (`ρ`) near zero (`~0.1%`), reflecting a strong ethical stance against chronological discrimination. He used a low elasticity of marginal utility (`η ~ 1`) and high projected damages. This led to a low overall discount rate (`~1.4%`), making future damages loom very large in present value terms. He *did* include consumption discounting via `η * g`, but with low `g` projections and moderate `η`, this component was small.
  *   **Nordhaus:** Used a much higher PTP (`ρ ~ 1.5%`), arguing it reflects observed behavior (market interest rates, individual savings choices) and is a necessary concession to reality. He also used a higher `η (~2)`. This resulted in a much higher overall discount rate (`~4-6%`), drastically reducing the present value of distant future damages.

  **Your Verdict: Is Growth-Based Discounting Just PTP in Disguise?**

  **No.** There is a genuine, principled distinction. **Growth-based discounting is *not* simply pure time preference wearing a lab coat.**

  *   **Ethical Foundation:** Growth discounting rests on the uncontroversial (within welfare economics) principle of diminishing marginal utility and the empirical expectation of growth. PTP rests on an ethically dubious preference for the present based solely on timing.
  *   **Moral Object:** Growth discounting adjusts for the *differing economic context* of future beneficiaries, respecting their equal moral standing. PTP directly devalues their moral standing *because* of their place in time.
  *   **Practical Divergence:** While they *can* sometimes produce similar discount rates *numerically*, the *reasons* are different, and the implications under different scenarios diverge:
      *   If future growth stalls or reverses (e.g., due to severe climate impacts), growth discounting would *decrease* or become negative (valuing future $ *more*), while PTP would still devalue the future purely because it's later.
      *   PTP always discounts future well-being. Growth discounting only discounts future *consumption* because of its lower marginal utility; future *well-being* itself is not intrinsically discounted.

  **Why the Confusion? The "Utility Discount Rate" (`δ`)**

  The *overall* discount rate applied to future *utility* (`δ`) is often expressed as: `δ = ρ + η * g`

  *   `ρ = Pure Rate of Time Preference` (discounting utility because it's later - ethically problematic)
  *   `η = Elasticity of Marginal Utility of Consumption` (how fast utility increases as consumption rises)
  *   `g = Growth rate of per capita consumption`

  The `η * g` term is the growth-based consumption discounting. The `ρ` term is PTP. **The key philosophical fight is over `ρ`.** Setting `ρ > 0` is the act philosophers object to. The `η * g` term is generally seen as an ethically necessary adjustment *if* you accept utilitarian welfare economics and expect positive growth.

  **Conclusion:**

  Your instinct is correct. The conflation of these two discounting concepts within the standard "discount rate" obscures a profound ethical debate. Philosophers (and ethically-driven economists like Stern) object vehemently to **pure time preference (`ρ > 0`)** because it constitutes arbitrary discrimination against future generations solely based on their temporal location. This is the core of Ramsey's critique. In contrast, **growth-adjusted discounting (`η * g`)** is seen as a legitimate, even necessary, adjustment within standard welfare economics to account for the diminishing marginal well-being impact of money on richer future people. It does *not* devalue their moral worth.

  The Nordhaus-Stern battle wasn't just about numbers; it was a clash between an ethics-first approach demanding intergenerational impartiality (Stern, `ρ ≈ 0`) and a revealed-preference/observed-markets approach willing to accept some chronological bias (Nordhaus, `ρ > 0`), wrapped within the complex mechanics of discounting. The growth component (`η * g`) was a secondary battleground, primarily concerning empirical estimates (`η`, `g`), not its fundamental ethical justification within the utilitarian framework. The *real* moral lightning rod is, and always has been, pure time preference.
