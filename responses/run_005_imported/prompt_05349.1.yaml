answer: |-
  Here's a rigorous evaluation of your classmate's answer based on the specific demands of the question and Bentham's core principles, presented as requested:

  **Grading Rubric (JSON):**

  ```json
  {
    "rubric": [
      {
        "criterion": "Identification of Rival Principle (a)",
        "points_possible": 5,
