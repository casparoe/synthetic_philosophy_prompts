  Hmm, how to illustrate this... Imagine knowing your bank balance precisely. If the website might lag by 1 millisecond, you can't know the exact balance at t because it could change imperceptibly fast. The reliability buffer applies regardless of vagueness. That's why KK fails too - knowing P requires a margin, but knowing that you know would require a narrower margin, creating infinite regress of buffers. 

