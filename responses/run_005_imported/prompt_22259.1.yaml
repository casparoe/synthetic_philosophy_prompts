prompt: |-
  I'm a retired physicist (condensed matter, mostly) who's only in the last couple of years gotten serious about philosophy, working through the old texts on my own with nobody around to check my reading against. Right now I'm stuck on Newton's Scholium on space and time, in the part that comes just after the bucket experiment, where he switches to the two-globes case. Here's the passage (Motte's translation, Cajori's revision, which is the edition I've got):

  "For instance, if two globes, kept at a given distance one from the other by means of a cord that connects them, were revolved about their common centre of gravity, we might, from the tension of the cord, discover the endeavor of the globes to recede from the axis of their motion, and from thence we might compute the quantity of their circular motions. And then if any equal forces should be impressed at once on the alternate faces of the globes to augment or diminish their circular motions, from the increase or decrease of the tension of the cord, we might infer the increment or decrement of their motions; and thence would be found on what faces those forces ought to be impressed, that the motions of the globes might be most augmented; that is, we might discover their hindmost faces, or those which, in the circular motion, do follow. But the faces which follow being known, and consequently the opposite ones that precede, we should likewise know the determination of their motions. And thus we might find both the quantity and the determination of this circular motion, even in an immense vacuum, where there was nothing external or sensible with which the globes could be compared."

  What I cant work out is this: he says you could find out which face of a globe is "leading" and which is "following" even in a universe with nothing else in it at all to compare the globes too. But leading relative to what, then, if not some other body? Feels to me like the directional language is quietly smuggling in the absolute space he's supposed to be proving, rather than the tension in the cord actually earning it honestly. Is that a fair complaint, or is there something about the physics of the tension itself that legitimately gets him there without begging the question? And does the globe case actually do argumentative work the bucket hadn't already done, or is it the same point in a different costume?
