answer: |-
  Your reading is astute, and your physicist's intuition is spot-on. Newton's two-globes argument is brilliant but deeply problematic precisely for the reason you identify. Let's break it down:

  1.  **What the Tension Tells You (Honestly):**
      *   The tension in the cord directly measures the *magnitude* of the centrifugal force acting on each globe. This force arises due to their *acceleration* (centripetal acceleration towards the center of mass).
      *   This acceleration is *absolute* in Newton's framework. It's real acceleration relative to absolute space, not just relative to other bodies. The tension is a dynamical measure of this absolute rotational motion, just like the concavity of the water in the bucket.
      *   **So far, so good (within Newtonian assumptions):** The tension tells you the *quantity* (magnitude) of the circular motion and that such motion *exists* absolutely, even in an otherwise empty universe. This much is consistent with the bucket experiment.

  2.  **The Problem: Determining "Leading" and "Following" Faces:**
      *   Newton claims that by applying "equal forces... on the alternate faces" and observing the resulting change in tension, you can determine which face is "hindmost" (following) and which is "foremost" (leading).
      *   **The Operational Test:** If you apply a force *in the direction of the existing tangential velocity* to a face, you *increase* the rotational speed (angular momentum). This increases the centrifugal force and thus the tension. If you apply a force *opposite* to the tangential velocity, you *decrease* the speed, centrifugal force, and tension.
      *   **The Inference:** The face where an applied force *increases* the tension is the face moving tangential to the rotation at that point. Therefore, the *opposite* face must be the one "following" (hindmost). Knowing the "following" face tells you the "leading" face and thus the *direction* (determination) of the rotation.

  3.  **The Crux of Your Complaint - "Leading Relative to What?":**
      *   **This is absolutely the core issue.** Your complaint is entirely fair and points to the fundamental circularity.
      *   Newton's language ("leading," "following," "hindmost," "foremost") inherently implies motion *relative to something else*. But in the empty universe scenario, what is that "something else"? He explicitly rules out other bodies ("nothing external or sensible").
      *   **The Smuggling:** The *only* "something else" available is **Absolute Space itself**. Newton is implicitly assuming that space itself provides a directional structure against which "leading" and "following" make sense. The dynamical test (applying forces and seeing tension change) *only identifies the direction relative to this assumed background absolute space*.
      *   **The Circularity:** Newton uses the dynamical effects to *claim* he can discover the direction of motion in absolute space. However, the very concept of "direction" applied to a lone rotating system in an otherwise empty universe *presupposes* the existence of absolute space as a directional background. The test doesn't *prove* the existence of this background; it *requires* it to make sense of the directional result. He's using the *concept* of absolute direction (which relies on absolute space) to *argue for* the existence of absolute space and direction. This is begging the question.

  4.  **Does the Globe Case Add Anything New Over the Bucket?**
      *   **Yes, but it doesn't solve the core problem.**
      *   **The Bucket:** Proves the *existence* of absolute rotational motion (distinguishes it from mere relative rotation) and measures its *magnitude* (via water curvature). It shows rotation has absolute physical effects.
      *   **The Globes:** Aims to show that you can also determine the *direction* (axis orientation and sense of rotation - clockwise/counter-clockwise) of that absolute rotation, even in complete isolation, using purely dynamical measurements (tension changes).
      *   **The Argumentative Work:** The globe case *extends* the argument. The bucket says "rotation is absolute and has magnitude." The globes say "...and we can also find out *which way* it's spinning absolutely." However, this extension **fails** precisely because the method for determining direction surreptitiously relies on the absolute spatial framework it's supposed to help prove. The bucket showed absolute acceleration exists; the globes try but fail to show absolute direction can be determined without presupposing it.

  **Conclusion:**

  You are correct. Newton's argument for determining the "leading" and "following" faces in the two-globes experiment **does smuggle in the concept of absolute space**. The tension change test successfully identifies which tangential push *increases* the rotational kinetic energy (and thus tension). However, labeling one face "following" and the other "leading," and claiming this reveals the "determination" of the motion *in an otherwise empty universe*, **requires** the pre-existing directional structure of absolute space to give those terms meaning. The physics of the tension gets you the *magnitude* of rotation and identifies which way to push to speed it up *relative to the current state of rotation*. It does **not**, without presupposing absolute space, tell you the absolute direction of that rotation relative to a universal background. The directional language ("leading," "following") implicitly references that background. Your complaint is not only fair, it highlights the core philosophical weakness in Newton's argument for absolute space that figures like Leibniz (contemporaneously) and later Mach and Einstein would forcefully challenge.

  Your physicist's instinct that the globes case feels like "the same point in a different costume" is partially right regarding magnitude/existence, but it's a costume specifically designed to tackle the *new* problem of direction – a problem it ultimately fails to solve without circularity. Newton brilliantly used dynamics to probe motion, but he couldn't escape the need for a background against which "direction" makes sense when all other matter is removed.
