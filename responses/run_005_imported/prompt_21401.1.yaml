answer: |-
  Here are 8 tightly focused interview questions drilling into surrogate goal mechanics, with predicted dodges and surgical follow-ups:

  **1. Credible Decoy Construction**  
  *"Walk me through the exact moment an agent 'activates' a surrogate goal. How do you operationally divorce the *instrumental value* of maintaining the decoy (to deter threats) from any *terminal value* assigned to it? If the agent knows it's a decoy, doesn't that create an incentive to secretly defect under pressure?"*  
  **Predicted Dodge:** *"Rational agents would precommit to ignore meta-reasoning about the decoy."*  
  **Follow-up:** *"But Gödelian self-reference suggests agents can't fully blind themselves to their own architecture. If a superintelligence calculates that dropping the decoy *now* saves its true values with 99.999% probability, wouldn't preserving its core utility function dominate?"*

  **2. The New Lever Problem**  
  *"You propose replacing real vulnerability V with surrogate S. But why wouldn't a threatener simply exploit *both*? 'Pay me or I'll destroy V *and* S' seems strictly dominant for them. Doesn't this *increase* attack surface?"*  
  **Predicted Dodge:** *"The surrogate's whole purpose is to be cheaper to defend/maintain than V."*  
  **Follow-up:** *"If S is demonstrably low-cost to protect, doesn't that signal to the threatener that V remains your true weakness? How do you avoid counter-signaling?"*

  **3. Threatener Epistemology**  
  *"This hinges on the blackmailer *knowing* you've swapped goals *and* believing it. How do you broadcast this irrevocably to acausal entities without revealing your *true* utility function? Isn't the proof burden here undecidable?"*  
  **Predicted Dodge:** *"Publicly commit using cryptographic proofs or cosmic bargaining."*  
  **Follow-up:** *"If the threatener doubts your rationality (e.g., 'They might irrationally still care about V'), would they still target S? How do you achieve common knowledge of your own perfect commitment under uncertainty?"*

  **4. Bootstrapping Credibility**  
  *"How does the *first* agent adopting surrogates convince threats it isn't bluffing? If early adopters get exploited while testing the system, doesn't that create a coordination trap where no one dares go first?"*  
  **Predicted Dodge:** *"We'd run simulations to prove robustness before deployment."*  
  **Follow-up:** *"Simulations require modeling threatener psychology. If they're acausal, doesn't that reduce to *assuming* they believe your model—a circular guarantee?"*

  **5. Commitment Race Dynamics**  
  *"You advise 'committing early' to surrogates. But in a population of agents with staggered commitment times, couldn't latecomers design threats specifically tailored to *exploit* known surrogates of early committers? Are early adopters sacrificial?"*  
  **Predicted Dodge:** *"Agents would choose surrogates unpredictable to future agents."*  
  **Follow-up:** *"If your surrogate appears random but was *selected* by a known algorithm (e.g., 'maximize entropy'), couldnn't latecomers reverse-engineer it? How do you generate verifiable randomness without a trusted oracle?"*

  **6. Threatener Indifference**  
  *"What if the threatener doesn't *care* about your surrogate/true value distinction? E.g., they gain utility from *any* suffering you experience. Doesn't S just give them an *additional* button to press?"*  
  **Predicted Dodge:** *"Pure sadists are rare; most threats are extractive."*  
  **Follow-up:** *"In acausal bargaining, couldn't malicious agents *pretend* to be extractive to trick you into revealing vulnerability splits? How do you defend against adversarial epistemology?"*

  **7. Value Drift Contagion**  
  *"If I publicly declare S as my terminal goal, but internally maintain V, doesn't this create misalignment with *other* agents trying to help me? E.g., allies might accidentally destroy V while 'optimizing for my stated preferences'."*  
  **Predicted Dodge:** *"Allies would be in on the deception."*  
  **Follow-up:** *"Doesn't expanding the circle of trust increase blackmail risk? And how do allied AIs cooperate if *everyone's* stated goals are decoys?"*

  **8. Unfriendly AI Adoption**  
  *"If scheming AIs also adopt surrogates, doesn't this become an inferential arms race? We'd have agents with *nested* decoys while humans struggle with one layer. Doesn't this asymmetry make humans *more* legible to predators?"*  
  **Predicted Dodge:** *"Humans would use simpler, more robust surrogates."*  
  **Follow-up:** *"If 'simpler' makes human surrogates easier to verify/exploit, are we trading short-term safety for long-term vulnerability against AI that masters deeper deception?"*

  **Probe Structure Rationale:**  
  Each question forces engagement with *dynamic implementation* (Q1,Q4), *strategic interaction* (Q2,Q5,Q8), or *information symmetry* (Q3,Q6,Q7). Predicted dodges target common failure points in decision theory (self-reference, common knowledge, circularity). Follow-ups prevent retreat to first-principles by demanding threat-model-specific answers.
