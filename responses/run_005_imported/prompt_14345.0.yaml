  so i went down a rabbit hole reading about Carnap a while ago and was suprised to learn that behind all the logic and 'meaningless metaphysics' stuff he actually had pretty strong political opinions. he came up through the German youth movement scene before WW1, turned pacifist after the war, and later described himself as sympathetic to socialism, wanting the economy and society rationally planned along scientific lines, but he was careful to say he wasn't a Soviet-style Marxist since he thought dialectical materialism was just more metaphysical junk dressed up as politics. he's also the guy behind that 'principle of tolerance' thing, basically that people can set up whatever logical/linguistic framework they want as long as they're upfront and precise about the rules they're using. given both sides of him, what do you reckon Carnap would say about handing real planning power today to AI systems, letting algorithms decide stuff like resource allocation or economic policy instead of human technocrats? would that be the rational planning he always wanted, or would the tolerance guy in him get nervous about that much unaccountable power sitting with one 'rational' system?
