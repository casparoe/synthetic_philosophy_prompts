  First, reconstructing Carnap's positions: His socialism wasn't about rigid ideology but about evidence-based, democratic planning. Yet his Vienna Circle era insisted that multiple frameworks (like Euclidean vs non-Euclidean geometry) can coexist if rules are explicit. That's crucial here - the tolerance principle isn't just about logic systems but about allowing competing rational approaches.

