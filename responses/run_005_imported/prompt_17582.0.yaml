prompt: |-
  At a minimum, I'd like one question on how the principle of charity is supposed to do real evidential work in constraining a Tarski-style truth theory, rather than just building agreement with the interpreter's own beliefs into the answer from the outset; one question on the relationship between radical interpretation and Quine's radical translation -- what exactly the appeal to a truth theory satisfying something like Convention T is supposed to add that Quine's talk of stimulus meaning and assent/dissent lacked, and whether the "harmless" indeterminacy Davidson is willing to grant can be kept principled, or whether it collapses into the more radical inscrutability of reference that Quine draws from the very same considerations; one question on why triangulation was needed at all once charity and a truth theory were already doing their work, and what exactly it is meant to secure that they could not; and one question on whether radical interpretation should be read as a constitutive, metaphysical claim about what meaning and belief consist in, or merely as an epistemological thought experiment about what evidence could in principle justify interpretive claims. Feel free to round out the list with further questions of your own choosing, so long as they hold to the same standard.

  I co-host a philosophy of language podcast aimed at graduate students, and next month's guest is an (invented) philosopher who has built her career defending and extending Donald Davidson's program of radical interpretation -- the sort of person who has reread Inquiries into Truth and Interpretation more times than she can count. I don't want the episode to be another rehearsal of the Stanford Encyclopedia entry, so please draft eight to ten interview questions that engage with the actual mechanics of the position, and for each one add a brief follow-up keyed to the answer she's most likely to give -- the kind of follow-up that would stop her from retreating to the standard textbook formulation.
