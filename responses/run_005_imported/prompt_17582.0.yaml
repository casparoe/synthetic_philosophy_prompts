  On Quine vs Davidson: The key difference is Davidson's truth-theoretic structure. Quine has stimulus meanings and assent/dissent, but Davidson adds compositional semantics via T-sentences. The follow-up should challenge whether this really solves Quine's problems or just disguises indeterminacy. When Davidson says reference is inscrutable but truth isn't, is that stable? What about "rabbit" vs "undetached rabbit part" cases under a truth-theory?

