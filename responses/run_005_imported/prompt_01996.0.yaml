  First, I recall that mystery novels rely on fair play. Readers expect clues to be presented so they can solve the puzzle alongside the detective. If the detective's hunch comes out of nowhere, readers feel cheated because they didn't have a chance. It's about the journey, not just the destination.

  The user might not realize that the genre conventions are key here. Mystery readers enjoy piecing together clues. If the solution hinges on a guess, it undermines the intellectual satisfaction. Even if the result is the same, the lack of logical progression makes the reveal feel unearned.

  Also, character credibility is at stake. A detective who guesses right might seem lucky rather than skilled. This affects how readers perceive her competence. Over-reliance on intuition can make her less compelling as a protagonist. The user might need to show her deductive skills throughout to build credibility.

  The critique group's feedback points to emotional engagement. Readers invest in the detective's process. If they can't follow the reasoning, they feel left out. The user could address this by planting subtle clues early on that the detective subconsciously picks up, making her hunch plausible in retrospect.

