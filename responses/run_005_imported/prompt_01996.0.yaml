prompt: |-
  Random question but it's been bugging me all week. In my mystery draft, my detective cracks the case off a hunch about the killer that comes out of nowhere around chapter 10 - she can't actually back it up with real reasoning til the very end, she just acts on it and it happens to be right the whole way through. End result's identical either way: she gets the killer, nobody else gets hurt. My critique group keeps saying the reveal feels cheap, but I don't get why that should matter if she was right and it all worked out the same. Is there actually a meaningful difference between "guessed right" and "figured it out" if they land you in the exact same place, or are my readers just being fussy about process for it's own sake?
