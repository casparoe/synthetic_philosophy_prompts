    "B": ["Humphreys' paradox about propensities not inverting the way ordinary conditional probabilities do"],
    "C": ["Sleeping Beauty-style self-locating credence puzzles"]
  }
  ```

  ### Brief Justification
  - **S-Tier**: Undermining futures directly threatens the *consistency* of PP within Lewis's Humean framework, while determinism/no-chance scenarios challenge PP's *domain of applicability*. Both strike at PP's foundational role.
  - **A-Tier**: Admissibility vagueness exposes PP's *operational fragility*; the reference class problem undermines its *practical utility* in grounding credences. Both reveal deep ambiguities in implementation.
  - **B-Tier**: Humphreys' paradox challenges PP's *interpretation* of chance (if propensity-based) but is less damaging if chances are Humean/functional.
  - **C-Tier**: Sleeping Beauty tests PP's handling of *edge cases* (self-location) but doesn't challenge its core mechanism in ordinary chance contexts.
