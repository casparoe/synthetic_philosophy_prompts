answer: |-
  You've grasped Nietzsche's core critique brilliantly - and your frustration is precisely where he wants you. Let's untangle this:

  **1. Nietzsche's Goal Isn't to "Prove Morality Isn't Real" (in a simplistic way):**
     *   He **is** exposing the *origins* of *specific* moral values (Judeo-Christian "slave morality") as rooted in psychological pathology (ressentiment), not divine command or pure reason.
     *   He **is** arguing this origin *disqualifies* these specific values from claiming **universal, objective, transcendent truth** or being the *only possible* foundation for morality.
     *   He **is not** saying "therefore, no values are possible or meaningful." He's attacking the *foundation* and *pretensions* of the *dominant* morality to clear space for something else.

  **2. The "Genetic Fallacy" Trap:**
     *   Your question hits on a crucial philosophical point: the **Genetic Fallacy**. This is the mistake of believing that *where an idea comes from* automatically determines its *truth, value, or validity*.
     *   **Example:** Just because Newton developed calculus partly due to his interest in alchemy doesn't mean calculus is false or useless. The *origin* is separate from the *current justification and utility*.
     *   **Applied to Morality:** Nietzsche shows morality *emerged* from ressentiment. This **discredits its claim** to be *eternal, God-given, or purely rational*. However, it doesn't *automatically* prove that the *content* of these values (e.g., compassion, humility) is inherently "bad" or that they serve *no* positive function *now*. Their *origin story* weakens their *authority*, not necessarily their current *effects*.

  **3. Nietzsche's More Radical Point: Beyond Truth/Falsehood:**
     *   Nietzsche isn't *just* interested in whether morality is "true" in a traditional sense. He challenges the *framework* itself. He argues:
          *   **Values are Human Creations:** Morality isn't discovered "out there"; it's *created* by humans (or specific groups of humans) to serve certain needs, drives, and power dynamics.
          *   **The "Value of Values":** The critical question isn't "Is this moral statement true?" but rather "**What does this value *do*?** Does it serve life, affirm existence, enhance power and creativity ('Life-Affirming')? Or does it stem from weakness, deny life, promote stagnation, and breed resentment ('Life-Denying')?"
          *   **Slave Morality's Function:** He argues Judeo-Christian morality *primarily serves* the weak by:
              *   Morally disarming the strong (calling their natural drives "evil").
              *   Providing psychological comfort and a sense of superiority to the powerless ("we are *good*, they are *evil*").
              *   Leveling the playing field through guilt and internalization.
          *   **The Problem is its *Dominance* and *Pretense*:** Nietzsche's fury is directed at this *specific* morality claiming to be the *only* morality, suppressing other potential value systems (like the "master morality" of strength, nobility, self-affirmation), and disguising its pathological origins as divine truth. *That's* the "con" – the deception about its origins and its claim to universality.

  **4. So, Does Origin Settle Truth?**
     *   **For Objective/Transcendent Truth Claims:** **Yes, origin *can* be devastating.** If a moral system claims its authority comes from God or Pure Reason, showing it actually emerged from historical resentment *fundamentally undermines that specific claim to authority*. It reveals the claim as false.
     *   **For Functional Value/Pragmatic Truth:** **No, origin isn't decisive.** A tool forged in anger might still be useful. Values born of resentment *might* (Nietzsche would argue they largely don't, but it's possible) foster social cohesion, protect the vulnerable, or create conditions for other forms of flourishing *despite* their origin. Their *current effects* need separate evaluation. Nietzsche would demand we evaluate them harshly by his "life-affirming" standard.

  **5. What Nietzsche *Really* Wants (The Constructive Part Often Missed):**
     *   He doesn't leave you in nihilism ("nothing matters"). His goal is **Revaluation (Umwertung)**.
     *   By destroying the false idol of slave morality, he wants to free exceptional individuals to create **new values** – values rooted in strength, creativity, self-overcoming, and a "Yes" to life, akin to the ancient "master morality" but consciously created by free spirits. This is the path to the *Übermensch* (Overman).
     *   He's clearing the ground, arguing that recognizing morality's human, contingent, often ugly origins is the *first step* towards genuine freedom and the possibility of creating *healthier*, more life-affirming values.

  **In Conclusion:**

  *   **Did Nietzsche prove morality is a "con"?** Yes, in the specific sense that he exposed the *dominant* morality's claim to divine/rational/universal authority as a mask hiding its origins in psychological weakness and resentment. Its pretensions to objective, transcendent truth *are* a con.
  *   **Does this mean "morality isn't real"?** Not exactly. It means the *specific, dominant form* of morality we inherited lacks the objective foundation it claims. Values are real human phenomena with real effects, but they are human creations, not divine revelations. Their "reality" is cultural, psychological, and historical, not transcendental.
  *   **Does origin settle truth?** It destroys claims to *certain kinds* of truth (divine, eternal, purely rational), but it doesn't automatically settle questions about the *current function, usefulness, or life-enhancing potential* of those values. However, Nietzsche strongly argues that values born of *ressentiment* are *inherently* life-denying and harmful, even if functional for the weak.

  You're grappling with the core shock of Nietzsche's project. He doesn't just want you to understand morality differently; he wants that understanding to *shatter* your comfortable assumptions and force you to confront the terrifying/exhilarating responsibility of potentially creating meaning *for yourself*. Your discomfort is the sign you're engaging deeply. Keep wrestling with it! Your friend's dismissal missed the profound challenge Nietzsche poses.
