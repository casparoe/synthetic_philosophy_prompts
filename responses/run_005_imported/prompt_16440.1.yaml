answer: |-
  The air in the study hung thick with dust motes and the faint, metallic scent of fear. Emil Richter – *Professor* Richter, though the title felt like a discarded coat in this shuttered room – traced the edge of the ledger with a trembling finger. Columns of numbers marched down the page, neat, precise, immutable. Proof. Against the chaos outside the locked door, against the whispers in the hallway, against the insidious, unseen threat, this was his anchor. Logic was the bedrock. Reason, the only reliable map.

  Yet, his stomach clenched, a hollow ache that had nothing to do with hunger and everything to do with the untouched tray beside him. Steaming broth. Soft bread. Poison, undoubtedly. They were clever. They knew Anna was gone.

  Anna. His Anna. For years, his bulwark. She’d sit across from him, her eyes weary but steady, lift the spoon to her own lips first. *See, Emil? Perfectly fine.* A simple, physical ritual that defied the complex architecture of his dread. A bridge built on love over the chasm of his suspicion. Now, confined to the hospital with her own failing heart, that bridge was gone. The chasm yawned.

  He pushed the ledger aside, the neatness suddenly an affront. His gaze drifted to the window, barred from the inside years ago. Outside, Princeton’s autumn blazed, a riot of irrational, dying beauty. His mind, that instrument he had honed to dissect the universe’s deepest structures, circled back to the old argument. The one he’d penned in letters to his mother decades ago, long before the shadows lengthened so grotesquely within his own mind.

  *Either,* he reasoned silently, the familiar syllogism unfolding like a protective mantra, *the cosmos is fundamentally ordered, rational. A comprehensible system.* He paused, the ache in his gut deepening. If that were true, then the emergence of a mind capable of grasping infinity – of formulating the Incompleteness Theorems, for God’s sake! – only to snuff it out at the very threshold of its potential? It was an absurdity. A monstrous non sequitur. A rational universe would not cultivate such a capacity merely to annihilate it at the moment of nascent understanding. Continuity *must* follow. Not necessarily heaven, not ghosts, but… *something*. A transition. A preservation of the pattern that was consciousness. *Therefore, some form of persistence is logically necessary.*

  *Or,* the alternative clawed at him, *the universe is fundamentally irrational. Chaotic. Absurd.* He swallowed, a dry click in his throat. If *that* were true, then reason itself was a flimsy illusion. A trick of the light on the cave wall. Including this very reasoning! Including the fear that gnawed at him now. The terror of annihilation, the suspicion of poison – all of it would be meaningless noise generated by random firings in a doomed lump of meat. You couldn’t trust logic to tell you logic was untrustworthy. The argument against persistence, born of that same unreliable reason, would cancel itself out. The worry dissolved in its own acid.

  It was airtight. Elegant. A fortress of thought. He had built it brick by logical brick. It should have brought peace.

  Instead, he looked at the broth. A thin skin had formed on its surface. *They’re patient,* he thought. *They know Anna isn’t coming back. They know I’ll weaken.* The scent, once potentially nourishing, now smelled cloying, treacherous. His hand, skeletal beneath the loose sleeve of his cardigan, hovered near the spoon. To eat was to trust. To trust the cook, the nurse, the grocer, the farmer, the very atoms comprising the food not to rearrange themselves into venom under their malevolent gaze. His reason screamed the dichotomy: *Persistence or Meaningless Chaos! Choose!*

  But his nerves, raw and exposed, shrieked a different imperative: *Poison. Betrayal. Extinction.*

  He pulled his hand back as if burned.

  ***

  Nurse Evans adjusted the pillow behind Anna Richter’s head. The hospital room was bright, sterile, a stark contrast to the oppressive gloom Anna had described in the old house on Mercer Street. Anna’s face was pale, etched with worry that far exceeded her own cardiac concerns.

  “He won’t eat, Helen,” Anna whispered, her voice raspy. “He thinks… he thinks they’ll poison him. Now that I’m not there…” Tears welled, but didn’t fall. She was too tired, too heartsick.

  Helen Evans sighed, smoothing the blanket. She’d seen paranoia before, the cruel tricks aging minds could play. But Professor Richter was different. Even in his fear, there was a terrifying clarity, a chilling intellect turned inward. “We’ve tried, Mrs. Richter. Dr. Klein has spoken to him. I bring the trays myself. He just… looks at them. Talks about logic.”

  “His argument,” Anna murmured, closing her eyes. “He wrote it for his mother. He believed it so deeply. That the mind… such a mind… couldn’t just *stop*. It was illogical. An insult to reason itself.” She opened her eyes, fixing Helen with a desperate intensity. “How can he believe *that* and be so afraid of *this*? How can he think they’d just… switch him off? After proving it couldn’t happen?”

  Helen didn’t have an answer. She’d only glimpsed the Professor’s world – a world of symbols and proofs that felt alien to the tangible realities of blood pressure and bedpans. “Fear doesn’t always listen to reason, dear,” she offered lamely. “Even the smartest people…”

  “But it *was* his reason!” Anna insisted, a spark of her old fire flickering. “He built a fortress with it. Against the darkness. And now… now the darkness is inside the walls, laughing.” She turned her face away, towards the window where a lone, late-season bird darted past. “He’s starving to death because he fears the very thing his logic says is impossible.”

  ***

  Back in the study, the light faded. Emil Richter shivered, though the room was warm. He felt the cold core within, the furnace of his metabolism burning its last reserves. His bones pressed against paper-thin skin. Thirty kilograms? Less, perhaps. He was becoming pure structure, an architecture of angles and hollows. A mind clinging to a scaffolding of logic as the physical platform crumbled beneath it.

  He picked up a pen. Not to work on the ledgers. To write to Anna. Words formed, precise, loving even in their detachment. He described the clarity of his argument again, the beautiful, inescapable dichotomy. *Dearest Anna,* he wrote, *the universe cannot be so irrational as to create the capacity for understanding infinity only to negate it in an instant. The very concept is self-refuting. Therefore, we may proceed with a justified confidence…*

  His hand shook. A drop of ink fell, blurring the word ‘confidence’. He stared at it. Outside, a car backfired. He flinched violently, the pen clattering to the desk. *They’re testing the mechanism. Or signaling.*

  The fear surged, a black tide breaching the seawall of his syllogism. It wasn't a counter-argument; it was a visceral tsunami that swept thought aside. The broth congealed on the tray. The locked door felt flimsy. His own body felt like the ultimate trap, a vessel primed for betrayal.

  He remembered Anna tasting the soup. Her calm assurance. The simple, physical proof of safety. Without her, the physical world became suspect. Every atom a potential assassin. His magnificent argument for the persistence of mind existed in a realm above the grubby, treacherous physicality he now inhabited. It couldn't touch this gnawing terror in his gut, this primal scream against the darkness he *knew* – knew with every fading cell – was coming. *His* darkness. *His* extinction. Delivered not by cosmic absurdity, but by malice. By *them*.

  The dichotomy held, pristine and untouched in the empyrean realm of ideas: *Rational Universe implies Continuation. Irrational Universe invalidates all fear, including this one.*
  But here, in the failing body, in the locked room smelling of dust and fear and untouched food, a third, unaccounted-for possibility raged: *A Rational Universe populated by Irrational Actors. Betrayers. Poisoners.* His logic hadn't accounted for the human capacity for malice within a potentially rational framework. Or perhaps it had, and the fear simply refused to be bound by such distinctions.

  He pushed the tray away with the last of his strength. It slid to the edge of the desk, teetered, but didn't fall. The broth, cold now, stared back like a dark, accusing eye. The argument for his mind's inevitable continuation shimmered in his thoughts, a beautiful, untouchable crystal. The certainty of his impending annihilation, delivered bite by withheld bite, was a cold stone in his belly. One spoke of eternity, the other of the next agonizing hour. They existed in parallel, irreconcilable, the grand proof and the base fear sharing the same dwindling space inside his collapsing frame, neither able to conquer nor console the other, as the light outside the barred window finally failed.
