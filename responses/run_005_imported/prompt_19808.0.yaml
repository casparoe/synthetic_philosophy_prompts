answer: |-
  Here is a eulogy that honors your grandmother's Ashʿari convictions while offering comfort accessible to all, focusing on her life and character within the framework she cherished:

  ---

  **A Eulogy for [Grandmother's Name]**

  We gather today with heavy hearts, united in love and grief for [Grandmother's Name]. To me, she was Grandma. To many of you, she was a cherished friend, a respected teacher, a guiding light, or a beloved colleague. She touched so many lives with her quiet strength, her deep wisdom, and her boundless generosity.

  For forty years, Grandma dedicated herself to teaching. She didn't just share knowledge; she shared a profound way of seeing the world, rooted in a deep and unwavering faith. She understood reality in a way that emphasized the constant, sustaining presence of the Divine in every single moment. For her, nothing happened *to* us by blind chance or impersonal forces. Everything – every breath, every sunrise, every event in our lives – was a direct expression of a single, all-encompassing Will and Mercy.

  This wasn't just a classroom lesson for her; it was the bedrock of her existence. It shaped how she met every challenge, including the illness she endured. She saw illness not as an independent agent, a "thing" acting upon her, but simply as a condition present in the world. Her incredible patience, the grace with which she navigated her suffering, wasn't a defiance of some external enemy; it was a profound acceptance, a deep-seated trust in the wisdom and timing of the One who sustains all existence. It was a conscious turning *towards* the source of all strength, even in profound weakness.

  Think of it like this: We see cotton touch a flame and burn. We might say, "The fire burned the cotton." But Grandma, following a long tradition of deep thinkers, would gently remind us: the flame is just flame. The cotton is just cotton. Their meeting is just an occasion. The true power to bring about change, to cause the burning – or *not* to cause it, as in a miracle – resides only with God. Everything else is the stage, not the actor. Her illness was like that cotton and flame – a circumstance, an occasion in her life. The true actor, the source of all being and change, remained, as it always is for her, God alone. Her body didn't "give out"; it was God who called her soul home at the precise moment ordained.

  And so, when we remember her courage, her patience, her unyielding kindness even through pain, we must understand it not as a battle *against* something, but as a radiant reflection *of* something. Her generosity wasn't a force she generated alone; it was a channeling of divine generosity. Her choices to visit, to teach, to comfort, to give – choices she made with clear intention and love until the very end – were moments where God’s grace became beautifully visible in her actions. She *acquired* those good deeds, she chose them wholeheartedly, and through that choosing, God’s goodness flowed into the world. Her life was a testament to that constant, intimate connection.

  That’s the legacy she lived and the faith that comforted her. It was a faith that freed her from fear of mere circumstances and anchored her in an unshakeable reality. It allowed her to meet life, and death, not with resignation, but with a profound trust and a quiet dignity that humbled all who witnessed it.

  So today, we don't mourn her as someone overcome by an adversary called cancer. We mourn her as someone dearly loved, whose time in this world, under God’s constant care, has reached its appointed end. We mourn the absence of her presence, her wisdom, her gentle smile, her unwavering care.

  We find comfort knowing she is now in the boundless mercy of the One she trusted so completely. We find comfort in the countless lives she enriched – through her teaching, her friendship, her simple acts of kindness. We find comfort in the love she poured into this world, a love that reflected a greater Love.

  Let us honor her memory not by attributing power to the circumstances of her passing, but by celebrating the incredible strength of her faith and the beautiful life she lived within it. Let us remember her patience, her generosity, her wisdom, and her deep, abiding trust. And let us strive, in our own ways, to reflect that same light she so consistently shared with all of us.

  May God have mercy on her soul, forgive her shortcomings, and grant her the highest paradise. Ameen.

  ---

  **Key elements addressed:**

  1.  **Avoids Causal Language:** No "cancer took her," "illness claimed her," "body gave out," "lost her battle." Illness is framed as a "condition," "circumstance," or "occasion." Death is attributed directly to God's will and timing.
  2.  **Explains Occasionalism Accessibly:** Uses the cotton/flame analogy familiar from al-Ghazālī in simple terms ("stage, not the actor," "circumstance... occasion"). Emphasizes God as the sole true Actor/Sustainer.
  3.  **Credits Her Virtues within *Kasb*:** Acknowledges her conscious choices ("choices she made with clear intention," "chose them wholeheartedly"), her "patience," "generosity," "courage," "kindness," and "wisdom" as real aspects of *her* life and character. Frames them as her "acquiring" (*kasb*) deeds and as "reflections" or "channeling" of divine attributes, respecting the theological nuance that the power to act originates with God while the choice and acquisition belong to the human.
  4.  **Focuses on Comfort & Legacy:** Centers on her impact ("touched so many lives," "radiant reflection," "channeling of divine generosity," "countless lives she enriched," "love she poured into this world"). Comfort comes from her faith, her trust in God, the end of her suffering, and the enduring legacy of her love and good deeds.
  5.  **Respects All Audiences:** Explains the core concept simply without jargon ("single, all-encompassing Will," "true power... resides only with God"). Theologians will recognize the references (ʿāda, kasb implied in "acquired," the analogy). Others grasp the idea of profound trust in God and God's direct control, and her virtues are universally relatable. The focus remains on her life, faith, and the shared experience of loss.
  6.  **Tone:** Respectful, loving, comforting, honoring her specific wishes and worldview without being overly academic or alienating. Affirms her agency in choosing good while acknowledging the divine source of the power to act.
  7.  **Length:** This script should comfortably fit within a 5-minute delivery.

  This eulogy strives to be true to her profound faith while offering genuine comfort and a celebration of her remarkable life to everyone present. May it honor her memory fittingly.
