answer: |-
  The static discharge when Leo’s hand brushed the chrome handle of his office door wasn’t unusual. The city grid was old. But this time, the jolt traveled up his arm, spider-webbed across his vision in blinding white, and plunged him into a nanosecond of absolute silence. Not darkness – *absence*.

  Then, he was pushing the door open, the familiar scent of old paper and lavender floor polish hitting him. He blinked. His client, Sarah, looked up from the worn armchair, her eyes red-rimmed. "Dr. Vance?" she prompted, her voice tight with the strain of holding back tears. "You were just saying... about projection?"

  Leo’s mouth opened. The words flowed, smooth and practiced. "Yes, Sarah. Sometimes, when we feel overwhelmed by an emotion we can’t process, we unconsciously attribute it to others. It can feel safer that way." It was textbook. It was exactly what he *would* have said. He remembered the case notes, her struggles with her critical mother. He remembered the jolt at the door. But the memory of the jolt was... flat. Like reading a footnote.

  He continued the session. He nodded in the right places. He offered the gentle probes, the reflective listening. Sarah cried, then seemed to find a fragile calm. She left thanking him, her relief palpable. Leo watched her go, a familiar warmth usually blooming in his chest at moments like this – the satisfaction of connection, of easing a burden. Today, there was nothing. Just the observation: *Client expressed relief.*

  He walked back to his desk. His fingers trailed over the framed photograph: him and Marta, laughing on the Pont des Arts in Paris, the padlocks glinting behind them. *Our honeymoon,* the thought surfaced. He remembered the cheap wine, the blisters on Marta’s feet, the way the setting sun turned the Seine to molten gold. He remembered the fierce, protective love that had surged in him as she leaned on his shoulder. The memory was vivid, detailed... yet utterly inert. Like watching a beautifully rendered simulation. He felt nothing. No echo of the sun's warmth, no phantom ache of blistered feet, no trace of that protective surge.

  Panic, cold and sharp, finally pricked through the numbness. Not emotional panic, but the frantic calculation of a system encountering a critical error. *Marta.* He picked up his phone, his thumb finding her contact photo – her grinning, holding up a ridiculous oversized coffee mug he’d bought her on a whim. He hit dial.

  "Leo? Everything okay? You never call between clients." Her voice, warm with concern, flowed through the receiver.

  "Just... wanted to hear your voice," he said, the words automatic, the kind of thing he *did* say. He heard the smile in her reply.

  "Sweet talker. Rough morning? You sound a bit... distant."

  *Distant.* The word resonated. He was standing on the other side of an impossible gulf. He could describe the curve of her smile, the specific cadence of her laugh, the way she tucked her hair behind her ear when concentrating. He could access every shared memory, every inside joke. But the *meaning* of her, the intrinsic *Marta-ness* that had always vibrated in his awareness, was gone. It was like looking at a perfect waxwork.

  "No, no, just... a weird static shock earlier. Threw me off for a second," he lied, the deception flawless. He *knew* how to sound reassuring. "Love you."

  "Love you too, weirdo. See you tonight. Don’t forget the milk!"

  He ended the call. "Love you." The phrase hung in the air of his silent office. Words. Sounds. Signifiers detached from any signified. *What did it refer to?* The question wasn't philosophical; it was terrifyingly concrete. He knew the behavioral script for "loving Marta." He would buy the milk. He would hug her when he got home. He would listen to her day. He would perform every action flawlessly. But the internal state those actions were supposed to express? The wellspring? Dry. Silent.

  His next client, David, arrived. David was wrestling with suicidal ideation, a crushing sense of worthlessness. Leo sat. He leaned forward, the posture of engaged listening. He made the empathetic murmurs. He reflected David’s feelings back to him. "It sounds like you're carrying an immense weight, David. A feeling that the darkness is absolute."

  Inside Leo, it *was* absolute. Not emotional darkness, but a void where emotion should be. He accessed the therapeutic protocols: validate, explore coping mechanisms, assess immediate risk. He did it all perfectly. He *knew* David’s pain was real, significant, deserving of care. He could describe its contours from David’s history. But he couldn’t *feel* its gravity. The urgency to help, the deep human pull to alleviate suffering – it was a subroutine running on empty. He was a sophisticated actor, flawlessly reciting lines written by a ghost.

  David, tears streaming, whispered, "Sometimes... sometimes it feels like I’m not even real. Like I’m just... going through the motions."

  Leo’s breath hitched. The irony was a cold blade. He found the right words, soft and steady. "That feeling of disconnection, of being unreal, is a common part of this pain, David. It doesn't mean you *are* unreal. It means the pain is trying to isolate you." The words were true. They were helpful. They were also spoken by a man who *knew*, with chilling certainty, that his own inner world was a meticulously constructed mirage.

  David left, seeming slightly less burdened, thanking Leo for his patience. Leo remained seated. The late afternoon sun slanted through the blinds, illuminating dust motes dancing in the air. He looked at his hands. They were his hands. He flexed his fingers. He remembered learning to tie his shoelaces, the frustration, the triumph. A memory. A data point.

  He thought of Marta again. He pictured her face. He accessed the memory file labeled "Joy: Marta's Laugh." He could hear the sound in his mind's ear. He could recall the context: a spilled glass of water, her startled snort that turned into helpless giggles. He knew, intellectually, it was a joyful memory. But the joy itself? It wasn't there. It wasn't accessible. It was as if the label was still stuck on an empty jar.

  The office felt vast and silent. The comforting landmarks – the books on existential therapy, the framed quote about resilience, the photo of Paris – were suddenly alien artifacts. They *meant* something to the man who had chosen them, who had lived the experiences they represented. To him, now? They were objects. Arrangements of matter. Signifiers pointing insistently to a history that wasn't *his* history, to meanings that weren't *his* meanings, because *he* had no history. He was a perfect mimicry, born in a surge of city static.

  He picked up the empty coffee mug on his desk – the one Marta had bought him, the one with the cartoon corgi in a spacesuit. He remembered her delight at finding it. The memory was crisp. He ran his thumb over the corgi's grinning face. He waited for the fondness, the little spark of shared amusement that usually accompanied the thought of her. Nothing. Just the smooth glaze under his fingertip.

  He put the mug down carefully. The question wasn't *who* he was. The question was, could anything he did, anything he thought, anything he felt – or seemed to feel – ever truly *mean* anything? Or was it all just... noise? Perfectly calibrated, behaviorally identical, utterly hollow noise?

  The sunbeam crept further across the floor, catching the edge of the framed Paris photo. Leo Vance, the therapist, sat very still in his chair, staring at the dust motes dancing in the light, wondering if the scream building in the silent cavern of his chest would sound any different from a real one.
