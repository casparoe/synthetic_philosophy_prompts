  ok, down a decision theory rabbit hole again. every rationalist-blog treatment of "Death in Damascus" i've read treats it as a clean win for FDT over CDT — CDT supposedly has no ratifiable act and just cycles between "flee to Aleppo" and "stay in Damascus" depending on whatever you currently believe you'll do. but some CDT defenders call that a strawman: a careful causal reasoner doesn't cycle forever, they settle into genuine indifference (a mixed equilibrium), which is a lot less embarassing than "CDT is just broken."

  so: compare that ratifiable/mixed-equilibrium defense of CDT to FDT's subjunctive-dependence story, both as answers to Death in Damascus. do they actually disagree about what a rational agent should do, or just about how to justify the same behavior? and does Ahmed's "Dicing with Death" coinflip variant (where you pay to become unpredictable to Death) actually settle it in favor of one theory, or does FDT end up wanting to randomize there too?
