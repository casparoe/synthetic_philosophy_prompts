prompt: |-
  I'm a student member of my high school's Honor Council, which hears academic-integrity cases and votes on findings. We're deadlocked on a case, and I'd like a memo to circulate before we reconvene next Tuesday.

  A classmate's English essay was flagged by our school's AI-writing detector as 71% likely to be AI-generated. The council members who read it closely didn't notice anything that struck them as templated, his handwritten in-class drafts are stylistically consistent with it, and he denies using AI. Our handbook says a flag "shall be weighed alongside all other available evidence," but doesn't say how heavily. Half the council wants to treat the flag as close to decisive: we were told when the school adopted the tool that trained readers are barely better than chance at spotting AI prose by eye, while the detector's own accuracy is much higher, and nobody on the council can name a specific flaw in its read of this essay -- only their own impression that it seems genuine. The other half thinks our impression should outweigh a general accuracy statistic, partly because the detector can't explain itself case by case and is known to misfire more often on some writing styles than others, including that of non-native English speakers. One teacher summed up her own position bluntly: she doesn't believe the essay is AI-written, but thinks the council should rule as though it is, since the detector knows better than she does.

  Please draft the memo I'll circulate. It should recommend a specific finding for this case and a standard the council can reuse for future flags, and it should take the strongest version of the "defer to the detector" position seriously rather than dismissing it.
reasoning: |-
  Okay, the user is a student member of their high school's Honor Council, dealing with a deadlock on an AI-detection case. They need a memo to break the impasse before next Tuesday. Let me unpack this carefully.

  First, the core conflict: half the council wants to treat the 71% AI-detection flag as near-conclusive evidence, citing the detector's supposed superiority over human judgment. The other half argues that stylistic consistency, draft evidence, and human impressions should outweigh a statistical tool known to have biases. 

  Hmm... the teacher's quoted position is particularly revealing - she personally doubts the AI claim but wants to defer to the machine. That captures the tension perfectly: it's about epistemic authority. Who gets to "know" - humans or algorithms?

  The user's request has three layers: 
  1) Immediate case resolution 
  2) Future standard-setting 
  3) Respecting the pro-detector viewpoint without dismissing it

  I notice they emphasize taking the "defer to detector" position seriously. That's crucial. The memo can't just pay lip service - it needs to engage deeply with their concerns about human fallibility while addressing detector limitations. 

  Key angles to balance:
  - The detector's aggregate accuracy stats vs. its opaque, unaccountable nature in individual cases
  - The council's direct engagement with evidence (drafts, style) vs. abstract claims about human inability to detect AI
  - The handbook's vague "weigh alongside" directive needing operationalization

  The proposed solution should probably reject binary thinking. A middle path might be: treat detectors as evidentiary triggers requiring human verification, not verdicts. For this case, that means "not responsible" given the corroborating evidence, while establishing that detectors alone aren't sufficient for convictions. 

  Biggest challenge: validating both sides. The pro-detector camp isn't wrong about human limitations, but their solution (algorithmic deference) creates new problems. The memo must show why human judgment - imperfect as it is - remains indispensable when supported by tangible evidence like drafts. 

  Also must address equity concerns about detector bias upfront. Non-native speakers etc. can't be collateral damage.
answer: |-
  ## Memorandum: Honor Council Deliberation Framework for AI-Detection Flags  
  **To:** Honor Council Members  
  **From:** [Your Name], Student Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Resolution & Standard for Case #2023-10 (AI Detection Flag)  

  ### I. The Impasse & Core Principles
  This memo addresses our deadlock regarding Case #2023-10, where an essay received a 71% AI-detection flag. Both sides present compelling arguments rooted in our duty to uphold academic integrity fairly:  
  - **Pro-Detector View:** AI detectors offer statistically superior accuracy compared to human readers. Ignoring a high-confidence flag without concrete counterevidence risks undermining a tool the school relies on.  
  - **Pro-Human Judgment View:** Detectors lack transparency, exhibit documented biases, and cannot contextualize individual cases. Our direct review of evidence (drafts, stylistic consistency, testimony) must carry weight.  

  Both positions share a commitment to evidence-based decisions. The conflict arises from *how we weigh probabilistic machine output against qualitative human analysis when they conflict*.  

  ### II. Recommended Finding for Case #2023-10: **Not Responsible**  
  After reviewing all evidence, I propose we find the student **not responsible** for using AI-generated content. This recommendation balances the detector’s flag with the following corroborating evidence:  
  1. **Handwritten Drafts:** Stylistic and structural consistency between in-class drafts and the final essay.  
  2. **Human Review:** No council member identified non-human patterns despite close reading.  
  3. **Student Testimony:** The student’s denial is consistent with the physical evidence.  
  4. **Detector Uncertainty:** A 71% confidence rating inherently acknowledges a 29% chance of error.  

  **Why not “defer to the detector”?**  
  While the detector’s aggregate accuracy demands serious consideration, it cannot adjudicate *this specific case*. Without an explainable rationale for the flag, and with affirmative human-created evidence contradicting it, the detector alone cannot meet our burden of proof.  

  ### III. Proposed Standard for Future AI-Detection Flags  
  To resolve future deadlocks, I propose adopting this evidentiary framework:  

  > **"The AI-detection flag shall be treated as *probative but not conclusive* evidence. It obligates the Council to seek corroborating evidence for or against AI use. A flag may support a finding of responsibility *only* when one or more of the following exist:**  
  > **A)** *Anomalies in Writing Style:* Significant, specific deviations between the flagged work and the student’s verifiable prior work.  
  > **B)** *Inconsistencies with Drafts:* Material differences in substance or structure between drafts and the final submission.  
  > **C)** *Technical or Contradictory Testimony:* Unpersuasive or inconsistent explanations from the student.  
  > **D)** *High Confidence + Contradictory Human Review:* If human reviewers identify *specific, concrete indicators* of AI use (e.g., factual incoherence, template phrasing), a high-confidence flag may corroborate those findings.  
  >   
  > **Absent such corroborating evidence, the detector flag alone is insufficient for a finding of responsibility.**"  

  ### IV. Why This Standard Honors Both Viewpoints  
  1. **Respects the Detector’s Role:** It formally acknowledges the flag as a trigger for scrutiny and requires active investigation. Corroborating evidence (A-D) may align with the detector’s output.  
  2. **Centers Human Contextual Judgment:** It prevents over-reliance on opaque algorithms by requiring tangible, case-specific evidence for a violation.  
  3. **Addresses Equity Concerns:** By requiring stylistic/draft consistency analysis, it mitigates risks of bias against non-native speakers or distinctive writers.  
  4. **Aligns with Handbook Intent:** "Weighed alongside all other evidence" means the flag informs—but does not replace—holistic review.  

  ### V. Path Forward  
  I move that we **vote on the finding of "Not Responsible" for Case #2023-10** and **adopt the proposed standard** for future cases. This framework ensures we:  
  - Treat AI detectors as *investigative tools*, not arbiters of truth.  
  - Prioritize explainable, contextual evidence over statistical generalizations.  
  - Uphold fairness while respecting the school’s investment in detection tools.  

  Let’s discuss this at Tuesday’s meeting. I welcome amendments to the standard but urge we resolve this case by recognizing that *our judgment, guided by tangible evidence, must remain sovereign*.  

  Respectfully,  
  [Your Name]  

  ---

  ### Key Strengths of This Approach:
  - **Balances Probabilistic & Qualitative Evidence:** Doesn’t dismiss the detector’s 71% flag but requires human-verifiable proof to act on it.  
  - **Future-Proof:** Sets clear, repeatable criteria for corroboration.  
  - **Prevents Over-Deference:** Rejects "the detector knows better" by demanding case-specific accountability.  
  - **Protects Equity:** Explicitly guards against documented detector biases.  
  - **Decisive Yet Nuanced:** Resolves the deadlock while honoring both sides’ core concerns.
