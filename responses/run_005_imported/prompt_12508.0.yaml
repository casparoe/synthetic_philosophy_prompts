prompt: |-
  F. H. Bradley's regress purports to show that uniting a relation with its terms requires a further relation, which in turn requires another, and so on ad infinitum, so that mere relation-positing can never by itself secure the unity of a proposition. Please rank the following proposed solutions from most to least successful at genuinely blocking the regress, as opposed to merely stipulating the unity they are meant to explain: Frege's doctrine that concepts are unsaturated; Russell's multiple-relation theory of judgment; Wittgenstein's picture theory in the Tractatus; Armstrong's treatment of states of affairs as ontologically fundamental, non-mereological wholes; and trope theorists' appeal to a primitive relation of compresence. Please give your answer as a JSON block, formatted as follows:

  ```json
  ["Frege", "Russell", "Wittgenstein", "Armstrong", "Trope theory"]
  ```
reasoning: |-
  We are to rank the proposed solutions to Bradley's regress from most to least successful at genuinely blocking the regress (as opposed to merely stipulating the unity). The proposals are:

  1. Frege: doctrine that concepts are unsaturated.
  2. Russell: multiple-relation theory of judgment.
  3. Wittgenstein: picture theory in the Tractatus.
  4. Armstrong: states of affairs as ontologically fundamental, non-mereological wholes.
  5. Trope theory: primitive relation of compresence.

  Bradley's regress: If a relation R relates two terms a and b, then we have a, b, and R. But then we need a further relation to relate R to a and to b, leading to an infinite regress.

  The goal is to see which solution genuinely blocks the regress without circularly stipulating unity.

  Analysis:

  1. Frege: Concepts (relations) are unsaturated, meaning they have gaps that must be filled by objects. The unity of the proposition comes from the fact that the concept is incomplete and requires completion by the object. This avoids the regress because there is no need for a further relation to bind the concept to the object; the concept is by nature something that must be saturated by objects. This seems to be a genuine block because the unity is built into the very nature of concepts.

  2. Wittgenstein (Tractatus): The picture theory holds that a proposition is a picture of a state of affairs. The elements of the proposition are arranged in a way that mirrors the arrangement of objects in the state of affairs. The unity is achieved by the logical form, which is shared by the proposition and the fact. The regress is blocked because the arrangement of the elements in the proposition is not an additional component but the way the elements are combined. This is a non-relational unity. However, some might argue that this merely stipulates the unity without explaining it.

  3. Armstrong: He takes states of affairs as fundamental. They are non-mereological wholes, meaning that the constituents (particulars and universals) are bound together without being parts in a mereological sense. The state of affairs is a fundamental unity. This avoids the regress by positing a basic ontological unit. But critics might say that this is just stipulating that states of affairs are unified without explaining how.

  4. Trope theory: Tropes are particular properties. The primitive relation of compresence binds tropes together to form an object. But then the compresence relation itself might need to be bound to the tropes, leading to a regress. Trope theorists typically take compresence as primitive and unanalyzable, which might be seen as stipulating unity without blocking the regress.

  5. Russell: Multiple-relation theory of judgment. In this theory, judgment is a multiple relation that relates the mind to the objects and the relation (which is not asserted but just one of the objects). This was Russell's attempt to avoid the unity of the proposition (to avoid false propositions having being). However, it faces the problem that the relation must be related to the other terms in a way that the judgment is about that relation holding. This leads to a regress because the multiple relation must also relate the relation to the terms? Russell's theory is often considered unsuccessful because it doesn't block the regress and leads to other problems (as pointed out by Wittgenstein).

  Ranking from most to least successful:

  Most successful: Frege's unsaturated concepts because it provides an intrinsic account of unity without requiring a further relation.

  Next, Wittgenstein's picture theory: It offers a structural account of unity through logical form, which is not an additional component.

  Then, Armstrong: Fundamental states of affairs are taken as unanalyzable wholes, which avoids the regress by stopping it at the fundamental level, but it might be seen as less explanatory than Frege or Wittgenstein.

  Then, Trope theory: Primitive compresence might lead to a regress because the compresence relation itself would need to be bound to the tropes, unless compresence is taken as a non-relational tie. But it is typically considered a relation and thus vulnerable.

  Least successful: Russell's multiple-relation theory, which is widely regarded as failing to block the regress.

  So the ranking:

  1. Frege
  2. Wittgenstein
  3. Armstrong
  4. Trope theory
  5. Russell

  But note: There is debate in the literature. Some might put Wittgenstein first. However, Frege's solution is often seen as the most direct and influential. Wittgenstein's picture theory is also highly regarded but more complex.

  Another view: Armstrong's solution is explicitly designed to stop the regress by taking states of affairs as fundamental. But the criticism is that it doesn't explain the unity, it just postulates it. Similarly, trope theory uses a primitive compresence which is also a kind of postulate.

  So I think:

  - Frege: genuine block by the nature of concepts.
  - Wittgenstein: structural unity without additional relations.
  - Armstrong: fundamental wholes, but might be seen as stipulative.
  - Trope theory: primitive compresence, which might lead to regress if compresence is a relation.
  - Russell: fails.

  Thus, the order:

  1. Frege
  2. Wittgenstein
  3. Armstrong
  4. Trope theory
  5. Russell

