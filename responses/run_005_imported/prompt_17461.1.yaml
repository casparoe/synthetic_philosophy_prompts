prompt: |-
  Okay this is going to sound pretty niche but bear with me. I've been slowly working through a secondhand book on classical Indian philosophy (got into it wanting to understand where all the yoga/vedanta stuff floating around actually comes from) and I got stuck for like a week on the Nyaya school's theory of knowledge. They claim there's exactly four legit ways of coming to know something - perception, inference, comparison, and testimony (sabda, basically knowing something because a trustworthy person or text told you). Thing is, apparently the Buddhist logicians (Dignaga, Dharmakirti, that whole lineage) thought four was one too many: they said only perception and inference are real pramanas, and testimony is secretly just inference wearing a disguise, since believing someone amounts to reasoning "this source is reliable, reliable sources tend to be right, so this is probably true" - which is an inference, full stop, no matter how automatic it feels. I brought this up with a friend who's way more into Buddhist stuff than me and he basically sided with Dignaga on the spot, which annoyed me enough that now I want to see the other side actually argued properly instead of just summarized in some neutral textbook way.

  So here's what I want: argue, as hard as you can, FOR the Nyaya side - that testimony is genuinely its own basic, seperate pramana and can't be fully cashed out as a case of inference, however you slice it. I think the crux is supposed to be this thing called vyapti, the fixed, exceptionless connection between a sign and what it points to that a real inference apparently needs (like smoke and fire) - and the Nyaya move seems to be that the link between a word and its meaning is just conventional, nothing like that natural, necessary connection, so testimony can't be forced into the inference mold. Feel free to bring in whatever those conditions are called that a sentence needs to actually land as knowledge in a listener's head (I've seen terms like yogyata and akanksa thrown around for this but don't fully get them) if it strengthens the case, but please don't just hand me a glossary - I want an actual, built-up argument, and especially want you to deal with the "trusting a reliable speaker just is inferring from a general reliability pattern" comeback, because on its face that one seems pretty strong to me.
