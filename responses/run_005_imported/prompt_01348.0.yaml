  Okay, the user is working on their EPQ about philosophers influencing public policy, focusing on Michael Dummett. They know him as a logician but are surprised by his activism in immigration. They've read his book "On Immigration and Refugees" and want to know how Dummett would react to post-Brexit free movement ending and the Rwanda asylum scheme. They need a careful reconstruction based on his principles, not just a verdict.

  First, I need to recall Dummett's key principles from his book. He argued for a strong presumption in favor of free entry, only overridden by substantial reasons. He linked UK immigration laws to racism and introduced the "right not to be submerged," which is a qualified response to Thatcher's "swamped" comment. He emphasized obligations to refugees under the Geneva Convention and duties of rich nations to poorer ones.

  For the Brexit free movement ending, Dummett would likely oppose it. His presumption for free entry clashes with ending EU free movement. He'd see this as driven by xenophobia, similar to past racist policies. However, the "right not to be submerged" might offer a counterpoint, but he'd argue the numbers weren't high enough to justify ending free movement. His focus was on non-white immigrants, so EU free movement might be less central, but the principle of free entry still applies. There's tension here, but his overall stance would be against the policy.

  Regarding the Rwanda scheme, this is clearer. Dummett was critical of deterrence policies. Sending asylum seekers to Rwanda violates the Geneva Convention by denying proper status determination. He'd see this as evading responsibility and might view it as racist, targeting vulnerable groups. His principles strongly oppose offshoring asylum processing, emphasizing direct obligations to refugees.

  I should note where his principles conflict or underdetermine. The "right not to be submerged" is vague on scale, making it hard to apply quantitatively. Also, his focus on racism might not directly address EU policies, but his broader anti-xenophobia stance applies. For Rwanda, his principles are more straightforwardly opposed due to Geneva Convention violations and evasion of duties.

  The user wants detailed reasoning, not just conclusions. They also want uncertainties highlighted. I'll structure each policy with Dummett's likely views, reasoning, and tensions. Make sure to reference his book's principles, like obligations under the Geneva Convention and the presumption for free entry. Also, mention that he died in 2011, so we're extrapolating carefully from his written work.
answer: |-
  Based on Dummett's core principles articulated in *On Immigration and Refugees*, here's a careful reconstruction of his likely responses to the two posthumous policies, highlighting both clear inferences and points of tension or underdetermination:

  **1. Ending Free Movement for EU Citizens (Post-Brexit):**

  *   **Strong Presumption Against the Policy:** Dummett's foundational principle is the "strong presumption in favour of free entry," which can only be overridden by "substantial reasons." Ending a pre-existing regime of free movement for a large, geographically and culturally proximate group like EU citizens directly contradicts this presumption. He would likely view the termination as a *removal* of existing freedom, requiring an even higher burden of justification than restricting initial access.
  *   **Scrutinizing the "Substantial Reasons":** Dummett would demand rigorous examination of the reasons offered for ending free movement (e.g., control over borders, reducing immigration numbers, sovereignty). He was deeply skeptical of arguments based primarily on numerical targets or vague notions of cultural preservation, which he often saw as proxies for xenophobia. His analysis of postwar UK immigration law concluded it was "driven largely by racism." While the EU context differs (involving predominantly white Europeans initially), Dummett would likely probe whether the *rhetoric* and *political drivers* behind ending free movement echoed the same xenophobic and nationalist sentiments he identified historically. The "swamping" narrative he countered directly, albeit with his qualified "right not to be submerged," was often deployed during the Brexit campaign. He would argue that anxieties about scale or cultural impact needed concrete, non-discriminatory evidence to override the presumption of free movement.
  *   **The "Right Not to Be Submerged" - A Qualified Counterpoint?** This is the most complex point. Dummett conceded a narrow state right to prevent cultural or demographic "submergence." However, his qualification is crucial: he saw this as an *exceptional* justification requiring *genuine, imminent threat* at a scale far exceeding anything likely posed by EU migration. He emphasized this right was *not* a license for general restrictionism and was easily abused. Applying this to the EU:
      *   **Scale:** Dummett would question whether EU migration, even at its peak, approached the level of "submergence" he had in mind (which was likely conceptualized in terms of massive, sudden influxes from vastly different cultures under dire circumstances, not managed movement within a developed bloc).
      *   **Cultural Proximity:** He might argue that cultural integration challenges from EU citizens (sharing broadly similar historical, religious, and democratic traditions with the UK) were significantly less than those from non-European migrants, making the "submergence" argument weaker in this specific context.
      *   **Burden of Proof:** He would place the burden squarely on proponents to demonstrate a *clear and present danger* of submergence caused *specifically* by EU free movement, which he would likely find unsubstantiated by evidence compared to the tangible benefits of free movement removed.
  *   **Likely Conclusion:** Dummett would almost certainly condemn the ending of EU free movement as a violation of the strong presumption for free entry, driven by insufficiently justified and potentially xenophobic political motives rather than a genuine, narrowly defined threat of "submergence." His "right not to be submerged" would likely be seen as inapplicable or misapplied in this scenario.
  *   **Tension/Underdetermination:** The main tension lies in applying the abstract "right not to be submerged" to a specific, large-scale but relatively culturally familiar migration flow. How does one *quantify* the threshold for "submergence" in Dummett's framework? His principle provides a conceptual limit but offers little concrete guidance for measuring it, leaving room for debate about whether the *scale* of EU migration *could* theoretically meet his threshold under some interpretations (though his overall emphasis suggests he'd find it unlikely).

  **2. The Rwanda Asylum Scheme (Offshoring Processing):**

  *   **Fundamental Violation of Obligations:** Dummett would view this scheme as a profound betrayal of core principles. His work emphasizes:
      *   **Geneva Convention Obligations:** He stressed the absolute importance of the Refugee Convention. The Rwanda scheme's core purpose – deterrence by removing asylum seekers before their claims are substantively heard in the UK – directly undermines the Convention's spirit and likely its letter (regarding *non-refoulement* and the right to a fair process). Sending claimants to a third country, especially one with a different human rights context and no connection to their flight, severs the link between the asylum seeker and the state where they arrive/claim protection, which Dummett saw as fundamental.
      *   **Rich States' Duties:** Dummett argued rich states have significant positive duties towards refugees fleeing persecution and poverty, largely borne from global inequality and historical responsibility. The Rwanda scheme is explicitly designed to *evade* these duties by transferring them elsewhere, a move he would condemn as an abdication of responsibility. He saw deterrence policies as inherently cruel and based on a denial of obligation.
      *   **Racism and Dehumanization:** Given his life's work against racial injustice in immigration policy, Dummett would likely see the Rwanda scheme as a stark example of dehumanization and racialized exclusion. Targeting a specific group (arrivals by "irregular" means, often from particular regions) for removal to a distant African country would fit his analysis of policies driven by racial prejudice and the desire to exclude the "Other."
  *   **Rejection of Deterrence Logic:** The scheme's stated aim is deterrence. Dummett explicitly rejected deterrence as a legitimate basis for immigration policy, arguing it inevitably leads to inhumane treatment and violates fundamental rights and duties. He believed states should focus on fair processing and meeting obligations, not on preventing arrivals through punitive measures.
  *   **The "Right Not to Be Submerged" - Largely Irrelevant:** This principle is unlikely to be seen as applicable justification here. The scheme doesn't primarily address *scale* or *cultural submergence*; it's a procedural evasion of responsibility for processing claims. Even if numbers were cited, Dummett would argue that offshoring is an illegitimate *method* to address numbers, violating core refugee protections. Fair processing within the UK, potentially with faster systems and better integration support (as he advocated), would be his prescribed solution to numbers, not externalization.
  *   **Likely Conclusion:** Dummett would unequivocally condemn the Rwanda scheme as a gross violation of the UK's obligations under the Refugee Convention, a cowardly evasion of its duties as a wealthy state, a morally repugnant deterrence policy, and a policy likely infused with the same racialized thinking he spent his life fighting. It attacks the very foundation of asylum protection he sought to uphold.
  *   **Tension/Underdetermination:** This is clearer cut than the free movement case. His principles offer little to no support for offshoring asylum processing. The main potential underdetermination lies in his specific prescriptions for *how* to handle large numbers of claims *fairly and efficiently* within the UK. While he advocated for fairer and faster systems, his book doesn't provide a detailed blueprint. However, the Rwanda scheme's fundamental evasion of the *location* of responsibility (processing *in* the UK) is so antithetical to his core tenets that his opposition would be vehement and based on clear principles rather than implementation details.

  **Summary of Likely Stances & Key Tensions:**

  *   **Ending EU Free Movement:** Strong opposition based on violation of the presumption of free entry, insufficient justification overriding it, and the likely role of xenophobia mirroring past racism. The "right not to be submerged" offers a potential counter-argument in theory, but Dummett's stringent qualifications and the specific context make its application here weak and unlikely to sway his overall condemnation. The main tension is the *quantification* of "submergence."
  *   **Rwanda Asylum Scheme:** Unequivocal and fierce opposition based on violation of the Refugee Convention, evasion of duties of rich states, rejection of deterrence logic, and the high probability of racialized exclusion. This policy directly contradicts multiple core principles without offering any plausible justification within his framework. Opposition is clear-cut; the underdetermination relates only to the specifics of his preferred *alternative* processing system.

  Dummett's strength lies in his clear moral framework centered on fundamental rights, anti-racism, and state obligations, particularly towards the vulnerable. Both policies would likely fall foul of this framework, though the reasoning is more complex regarding free movement due to the "submergence" caveat. The Rwanda scheme represents the kind of policy he would see as a direct assault on the principles of refugee protection he championed.
