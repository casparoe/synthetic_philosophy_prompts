answer: |-
  Your discomfort tracks something profoundly real: you've both witnessed how **artistic merit and authorial skill can be severed from critical reception by forces entirely beyond the creator's control.** This isn't just "how publishing works"—it's a collision of craft with the brutal randomness of cultural attention and institutional gatekeeping. Here's how to understand it, and how to frame it for M.:

  ### The Core Truths
  1.  **The Choice Itself Was Identical:** Your narrative gambit was conceptually and artistically equivalent. The courage, intention, and craft involved in *making* the choice were the same. Judging the *choice itself* as "bold" in one case and "self-indulgent" in the other is **logically incoherent.** It reflects the *outcome*, not the intrinsic quality of the decision.
  2.  **Execution Matters, But Context Distorts Its Perception:** While you both seeded carefully, even *perfect* execution can be rendered invisible by context. A reader primed by hype, a prestigious imprint, and a glowing review *looks for and finds* the subtle clues, appreciating the craft. A reader encountering a self-published book with a dismissive review (or no review) *starts from skepticism* and may dismiss the clues as flaws or carelessness. **The context frames how the execution is *perceived*, often overriding its actual quality.**
  3.  **Publishing Luck Isn't Neutral; It's Transformative:** The divergences weren't minor hiccups; they were catastrophic for M.'s book's reception:
      *   **Loss of Institutional Legitimacy:** An editor leaving (especially during restructuring) often means losing the book's internal champion and institutional backing. Your book had the full weight of a publisher's marketing, distribution, and *perceived authority* behind it. M.'s self-published book lacked this crucial signal of "worthiness," making critics less likely to engage deeply.
      *   **The First Impression Cascade:** Your influential, positive review set a narrative. It told other critics and readers *how* to read your book – what to look for, how to interpret the twist. M.'s single, negative review (or lack of attention) did the opposite. Once these narratives solidify, they become incredibly hard to shift.
      *   **The Halo/Horns Effect:** Success breeds positive reinterpretation; obscurity or early negativity breeds dismissal. Your "nerve and control" reading is partly a *result* of your success. M.'s "bait-and-switch" reading is partly a *result* of her lack of platform and that one dismissive voice. **The reception actively rewrites the perception of the identical artistic choice.**

  ### Is There Any Principled Difference in Credit/Blame?
  *   **For the Choice Itself? No.** Based on your description, you deserve *equal* credit for the conceptual boldness, structural ambition, and careful seeding of that narrative device. Neither of you deserves *blame* for making the choice – it's a valid artistic strategy.
  *   **For the *Perceived* Execution? Unfortunately, Yes (but it's not fair).** Because your execution was seen through the lens of success and institutional support, it *appeared* more masterful. Because M.'s identical execution lacked that lens (and faced an actively hostile one), it *appeared* flawed or clumsy. **This perceived difference is an illusion created by the reception machinery, not a reflection of reality.** Calling it "bold" vs. "self-indulgent" is indeed "luck wearing the costume of judgment."

  ### How to Talk to M.: Framing the Gap
  Your goal isn't to dismiss her hurt or just say "that's publishing," but to help her decouple the *reception* from the *act of creation* and her *worth as a writer*. Focus on these points:

  1.  **Acknowledge the Brutal Randomness:** "M., what happened isn't a verdict on our choices or your skill. We made the *exact same* ambitious, difficult choice. The difference is pure, brutal luck: which editor stayed, which critic picked it up first, which tiny ripple in the publishing world caught your book and mine. My book landed in a spotlight that made people *look* for the craft; yours, through no fault of its own, didn't get that chance. It's deeply unfair."
  2.  **Separate the Choice from the Noise:** "The gamble we both took – the lying narrator, the recontextualization – that was pure authorial nerve. *That* part is identical. The 'bold' vs. 'self-indulgent' label? That's just the noise *around* the book after it left our hands – who talked about it, how they framed it, what platform it had. It tells us about the noise machine, not about our core choice or your incredible skill in seeding it."
  3.  **Reframe the "Evidence":** "Look at the *only* thing that actually proves our choices were equivalent: *we did the same thing, independently, at the same time, for the same reasons.* That's the real evidence of judgment and nerve. The different reactions afterwards? That's evidence of chaos and gatekeeping, not a difference in our craft. Your manuscript proves your mastery just as mine does."
  4.  **Challenge the Narrative, Not Her Worth:** "People discuss it as a 'lapse' for you because the narrative got set early against you. But that narrative is wrong. It wasn't a lapse; it was the same bold stroke. The failure was in the *system* not seeing it, not in you not doing it. Your judgment was sound. The reception was unsound."
  5.  **Focus on the Work Itself (If Appropriate):** "Can we look at your Chapter 3 seeding, or that moment in the diary? *That's* where your skill is, identical to mine. *That's* what deserves the 'nerve and control' label, regardless of who noticed it. The work itself is the truth, not the chatter."

  ### Your Own Unease
  Your discomfort is healthy integrity. It recognizes that the accolades you received for the *choice* are partly unearned luck, while M.'s criticism for the *same choice* is profoundly unjust. It highlights the uncomfortable gap between artistic merit and cultural validation. 

  **How to live with it:** 
  *   **Acknowledge your luck** privately and, if appropriate, publicly when discussing the *industry* (without undermining M.).
  *   **Champion M.'s work actively.** Use your platform to direct readers to her book, highlighting the *craft* of the twist.
  *   **Remember the work.** Ultimately, you both wrote the book you intended. The core achievement remains, even if the world's recognition is fickle and unfair.

  The gap isn't a verdict on M.'s skill; it's a stark illustration of how fragile the connection between artistic intention and public perception can be. Your shared creative choice remains a point of genuine connection and equivalent courage. Helping M. see *that* as the enduring truth is the most powerful support you can offer.
