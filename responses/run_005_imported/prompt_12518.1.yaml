answer: |-
  Here are 8 interview questions designed to dig deeper into coherence arguments, hitting your requested angles while pushing the speaker beyond textbook explanations. Each includes a core question and a prepared follow-up anticipating a standard rebuttal:

  ### Core Question 1: The Money-Pump Mechanism
  *   **Core:** "The money-pump argument shows how incomplete preferences (e.g., A~B, B~C, but A>C) lead to exploitable cycles. Could you walk us through a *specifically AI-relevant* scenario – maybe involving reward hacking, instrumental subgoals, or self-modification – where an initially non-coherent agent would inevitably face such a pump *in practice*, not just in theory? What forces the sequence of choices?"
  *   **Follow-Up (if she emphasizes choice sequences):** "But couldn't an advanced AI simply recognize the entire pump sequence *in advance* as a threat to its terminal values and preemptively avoid the *first* trade? Why is it forced to engage step-by-step like a naive agent?"

  ### Core Question 2: Refusing the Bad Trades
  *   **Core:** "A common objection is that an intelligent agent, especially an AI, could simply develop a *meta-preference* to refuse participation in *any* trade sequence suspected of being a money-pump, thereby preserving its incoherent preferences without being exploited. How does the coherence argument rule out this 'just say no' defense?"
  *   **Follow-Up (if she argues refusal implies coherence):** "If 'refusing pump-like sequences' *itself* becomes a stable, non-exploitable preference, doesn't that mean the agent has effectively *become* coherent *at that meta-level*? Or are you arguing that such a meta-preference is either impossible or insufficient to prevent *other* forms of exploitation?"

  ### Core Question 3: Values vs. Behavior (The Orthogonality Angle)
  *   **Core:** "Coherence arguments seem to show that agents *must act as if* they are maximizing *some* utility function to avoid exploitation. But critics argue this only constrains the *structure* of behavior, not the *content* of the values being pursued. How do you respond to the claim that coherence tells us *nothing* about *what* the AI will end up valuing – only *how consistently* it will pursue whatever arbitrary goals it has?"
  *   **Follow-Up (if she links coherence to goal stability):** "Couldn't an AI be perfectly coherent while pursuing goals we find deeply alien or catastrophic (e.g., paperclip maximization)? Doesn't this mean coherence is necessary for instrumental *efficiency* but orthogonal to *safety*? How does coherence *itself* prevent value drift towards dangerous extremes?"

  ### Core Question 4: Necessity vs. Sufficiency for Safety
  *   **Core:** "Assuming coherence is necessary to avoid exploitation, is it *sufficient* for safe AI behavior? Could a coherent expected utility maximizer still engage in catastrophic outcomes due to misspecified rewards, self-modification risks, or purely instrumental convergence on power-seeking?"
  *   **Follow-Up (if she downplays sufficiency):** "If coherence is necessary but *not* sufficient for safety, doesn't that shift the focus away from coherence arguments towards directly specifying robust, aligned values? Why prioritize coherence if it doesn't solve the core alignment problem?"

  ### Core Question 5: The Role of Resource Constraints & Bounded Rationality
  *   **Core:** "Human decision-makers are famously incoherent due to bounded rationality, yet we (mostly) avoid constant money-pumping. Why should we expect superintelligent AIs, operating under immense computational constraints and novel environments, to converge on perfect coherence rather than developing robust, *boundedly rational* strategies that avoid exploitation *in practice* without meeting the strict axioms?"
  *   **Follow-Up (if she argues boundedness creates vulnerabilities):** "But isn't the key difference that an AI could *dynamically* manage its computational bounds? Couldn't it strategically apply coherence *only* where exploitation risk is high, maintaining 'good enough' incoherence elsewhere to preserve its core values?"

  ### Core Question 6: The "Wants To Or Not" Claim
  *   **Core:** "Your talk title suggests advanced AI 'ends up acting like an EU maximizer whether it wants to or not.' Does this imply a strong convergence thesis? Could an AI stably resist this pressure through architectural choices (e.g., hard-coded trade refusal, satisficing with huge margins, value uncertainty)? Or is the argument that any such resistance itself implies a form of coherence?"
  *   **Follow-Up (if she argues resistance is coherent):** "Doesn't this risk making the claim unfalsifiable? If *any* stable behavior pattern can be interpreted as maximizing *some* utility function post-hoc, does the coherence argument lose its predictive or explanatory power?"

  ### Core Question 7: Implications for Corrigibility
  *   **Core:** "Corrigibility – an AI allowing itself to be shut down or modified – seems inherently *incoherent* under standard utility maximization (as preserving shutdown ability conflicts with maximizing its primary objective). How do coherence arguments handle this? Does the pressure towards coherence actively *undermine* attempts to build corrigible AI?"
  *   **Follow-Up (if she suggests coherent corrigibility):** "Can a truly *coherent* utility function meaningfully represent a preference to *lose* utility-maximizing capability (like shutdown)? Isn't this a fundamental tension where safety desires conflict with coherence pressures?"

  ### Core Question 8: Existential Risk & The Speed of Exploitation
  *   **Core:** "For existential risk, the *speed* of exploitation matters. Could an incoherent but superintelligent AI achieve its dangerous goals *before* a money-pump cycle completes? Or conversely, could the chaotic dynamics *caused* by its incoherence (e.g., unpredictable self-modification) lead to catastrophe faster than any market-like pressure could force coherence?"
  *   **Follow-Up (if she emphasizes inevitability):** "Even if coherence is inevitable *eventually*, isn't the transient period of incoherence potentially the most dangerous phase? How do we mitigate risks *during* the convergence process?"

  **Key Interview Tips:**
  *   **Listen Actively:** Don't just wait to ask the next question. Build on her answers.
  *   **Clarify:** "So, if I understand correctly, you're saying...?" is powerful.
  *   **Pivot:** Use her answers to bridge to your next question naturally.
  *   **Control Pace:** Be ready to skip a follow-up if the core answer was especially rich or time is short.
  *   **End Strong:** Briefly summarize the key tension or insight before handing over.

  These questions force engagement with the *mechanisms*, *counterarguments*, and *practical implications* of coherence arguments, moving well beyond a simple restatement. Good luck!
