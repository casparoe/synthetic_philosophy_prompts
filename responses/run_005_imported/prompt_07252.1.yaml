prompt: |-
  So I've fallen down an AI safety rabbit hole recently -- started with a few RLHF blog posts and now I've got three papers open in tabs I only half understand. One thing that's bugging me: everyone seems to use "wireheading" and "reward tampering" almost interchangeably, but I've got a hunch they're not actually the same concept and just get lumped together in casual writing. My rough mental model is that wireheading is the narrow, classic case -- like a rat pressing a lever to zap it's own pleasure center, an agent that basically short-circuits the reward signal right at the source -- while reward tampering is some bigger umbrella that also covers things like manipulating the human who's supposed to be grading its outputs, or messing with the sensors/code that feed into an otherwise untouched reward function. Is that actually a real, recognized distinction, or am I just making up categories to feel better about not fully getting the papers?

  Assuming there's something real there, can you walk me through the fuller taxonomy properly -- I think the terms I keep half-remembering are something like "reward function tampering," "feedback tampering," and tampering with the reward function's inputs, and I'd love to understand why researchers bother seperating those out instead of just calling it all wireheading. There's also this claim I ran into that whether an agent evaluates the future using its "current" reward function versus whatever reward function will technically be in place at each future step supposedly determines whether it even wants to tamper with its own reward function at all -- and on first read that felt backwards to me (wouldn't an agent always want an easier-to-satisfy reward function?), so I'd appreciate a plain-terms explanation of why it isn't that simple. And since I'm coming at this with zero formal philosophy training: is any of this basically just a mechanized replay of Nozick's experience machine, or does the fact that we don't actually know whether these systems have anything like subjective experience mean that comparison breaks down somewhere important?
