  Structure-wise, I'll open with collective gratitude to the entire department, then pivot to Ray's uniqueness via communal values. Phrases like "the standard he set wasn't about hours logged" redirect attention from comparison to inspiration. Ending on shared legacy ("this department's soul") unites everyone.

