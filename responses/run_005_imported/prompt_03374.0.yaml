      *   **Ideal Points:** Alex's max = $60, Sam's max = $60.
      *   **Nash Solution:** Maximizes (Alex * Sam). The midpoint (50, 50) achieves 50*50=2500. Any other point gives less (e.g., 40*60=2400, 60*40=2400). **Result: (50, 50)**.
      *   **KS Solution:** Equalizes the *proportion* of their ideal points achieved. Alex gets 50/60 ≈ 83.3% of her ideal. Sam gets 50/60 ≈ 83.3% of his ideal. **Result: (50, 50)**. Same as Nash.

  *   **Scenario B (Added Irrelevant Alternative?):**
      *   **New Bargaining Set:** Same as Scenario A, but *add one more possible outcome*: Alex gets $99, Sam gets $1. (This point is "irrelevant" because it's worse for Sam and wasn't chosen in Scenario A). The set now looks like a triangle: baseline (0,0), points (40,60), (60,40), and (99,1).
      *   **Ideal Points:** Alex's max is *still* $99 (the new point). **Sam's max is *still* $60** (the best Sam can get *without* Alex taking $99 is still $60 at (40,60)).
      *   **Monotonicity Expectation:** Alex's ideal point improved ($99 > $60). Sam's ideal point ($60) *did not change*. Monotonicity says Alex should not be worse off than in Scenario A (she should get at least $50). KS respects this. Nash does not.

