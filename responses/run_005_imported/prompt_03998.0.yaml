  Been rereading Eliezer's old quantum physics sequence and I keep getting stuck on the locality bit. He argues pretty confidently that many-worlds is a fully local theory, and that Bell's theorem never actually proves nonlocality - it just rules out theories where measurements have a single, definite outcome produced locally. But most other explanations of Bell's theorem I've run into just treat it as ruling out local theories, full stop, no asterisks. Are these two claims actually compatible, or is Eliezer quietly redefining "local" so MWI sneaks in under the wire? I vaguely remember the locality condition in Bell's proof is actually a bundle of two seperate assumptions (parameter independence and outcome independence, or something close to that), and that MWI keeps one and drops the other. Is that the actual crux, and if so does dropping outcome independence still deserve to be called "local" in any physically meaningful sense, or is that just semantics? Would love an actual walkthrough of what's going on, not another "shut up and calculate."
