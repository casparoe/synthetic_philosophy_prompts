prompt: |-
  Had a long, kind of heated argument with my friend last night about van Fraassen's Reflection Principle - you know, the claim that your current credence in something, conditional on your future credence in it being r, has to also be r, on pain of a diachronic Dutch book. I brought up the obvious counterexample where you know you're about to get drugged or brainwashed into being certain of something absurd, and pointed out that van Fraassens own fix - only defer to future-you when you expect the change to come from genuine rational learning - basically just smuggles a whole theory of personal identity in through the back door. My friend thinks Hume would've dismissed the whole principle instantly given his bundle theory of the self and his general skepticism about necessary connections, but I think it's more complicated than that. Based on what Hume actually wrote about personal identity, induction, and belief, what's your best reconstruction of how he'd have reacted both to the original Reflection Principle and to van Fraassen's rationality patch for it?
