  So random one for you ahead of my evo-phil seminar tmrw. You know how Darwin was so bothered by the peacock's tail that he told Asa Gray the mere sight of one of its feathers made him sick, since the thing seemed totally pointless under natural selection? His eventual fix was sexual selection via female choice - basically, females just have an arbitrary 'taste for the beautiful,' full stop, no further explanation required. Two very different descendants of that idea showed up later though: Fisher's runaway model doubles down on that arbitrary-taste logic, while Zahavi's handicap principle (formalized decades later by Grafen's ESS proof) goes the opposite way and insists the ornament has to be a costly, honest signal of quality - which is basically the same kind of utilitarian objection Wallace kept throwing at Darwins theory back in the day. So if Darwin himself somehow got to referee between these two, which do you reckon he'd find more convincing and why? Don't just summarize the two theories for me, I want your actual best reconstruction of his reasoning - grounded in stuff we know about him, his gradualism, his letters, the whole fight with Wallace, Descent of Man, etc.
