answer: |-
  That's a **partially accurate but incomplete summary** of Rousseau's position. While the *content* of plays (displaying immorality/passions) is a significant concern, it's only one layer of his deeper, more fundamental objections. **Even a theatre restricted to "morally edifying" tragedies would likely *not* satisfy Rousseau's core objections for Geneva.**

  Here's a breakdown:

  1.  **Your Summary Has Merit (The Content Argument):**
      *   Rousseau *does* vigorously critique the typical repertoire (especially French theatre of his time) for glorifying passion, vice, and immoral behavior, even if vice is "punished" at the end. He argues that the *depiction* itself is corrupting, normalizing behaviors that should be abhorred.
      *   He is skeptical that theatre can truly teach virtue effectively, arguing it often portrays virtue as dull or weak compared to passionate vice.
      *   He famously criticizes Molière's *The Misanthrope*, arguing that Alceste (the virtuous truth-teller) is made ridiculous, while the social hypocrites are portrayed as charming and successful – thus teaching the *wrong* lesson.

  2.  **Rousseau's Deeper, More Fundamental Objections (Why "Virtuous" Theatre Still Fails):**
      Rousseau's critique goes far beyond content to the **very nature of theatre as an institution and its impact on a small, virtuous, republican society like Geneva:**

      *   **Passivity vs. Active Participation:** Theatre turns citizens into *passive spectators*. Instead of actively participating in their community through festivals, games, public assemblies, or militia drills (which Rousseau champions), they sit silently in the dark, consuming entertainment. This passivity erodes the civic spirit and sense of agency essential for a republic.
      *   **Artificiality & Inauthenticity:** Theatre is inherently artificial. Actors pretend to be someone they are not, portraying artificial emotions and situations. Rousseau sees this as fundamentally opposed to the ideal of the *authentic*, transparent citizen living a genuine life according to shared republican values. It fosters a culture of performance and dissimulation.
      *   **Erosion of Community Bonds & Simplicity:** Theatre introduces luxury, idleness, and complex social rituals (dress, manners, gossip). It replaces simple, wholesome communal gatherings with a commercialized, exclusive spectacle that fosters social stratification and vanity. It draws people away from productive labor and family life.
      *   **Introduction of Foreign Influence & Corruption:** Actors, Rousseau argues, are inherently corrupting figures. They live outside conventional morality, are dependent on public opinion, and bring foreign (often French) morals and fashions. Their presence and influence would undermine Geneva's unique republican character.
      *   **Economic Distraction & Idleness:** Theatre encourages idleness and diverts resources (money, time, attention) away from productive work, family duties, and civic engagement. It creates a class of idle spectators and parasitic actors.
      *   **Negative Impact on Women:** Rousseau expresses particular concern about theatre's effect on women. He argues it encourages vanity, idleness, and coquetry, drawing them away from their domestic roles and making them objects of unhealthy public attention, potentially destabilizing the family unit.
      *   **Replacement of True Public Festivals:** Rousseau contrasts the corrupting theatre with his idealized vision of wholesome, participatory public festivals – open-air gatherings where citizens themselves are the actors, celebrating their community, patriotism, and simple virtues through games, dances, and military exercises. Theatre displaces this authentic, unifying civic life.

  **Would a "Virtuous" Theatre Satisfy Rousseau?**

  **Almost certainly not.** While restricting content might mitigate *one specific concern*, it fails to address the core structural and social objections:

  1.  **Passivity Remains:** Citizens are still spectators, not active participants.
  2.  **Artificiality Remains:** The performance is still an artificial representation, not authentic communal life.
  3.  **Institution of Theatre Remains:** It still introduces actors, luxury, idleness, foreign influence, complex social rituals, and economic diversion.
  4.  **Threat to Simplicity & Community:** It still creates a space distinct from the productive, family-oriented, and directly participatory civic life Rousseau values.
  5.  **Distraction:** It still consumes time, money, and attention that could be directed towards civic duties and wholesome communal activities.

  **Conclusion:**

  Your summary captures Rousseau's *explicit critique of immoral content* well. However, it misses his deeper, more radical critique of *theatre as an institution* and its *inherently corrosive effects* on the specific social and political fabric of a small, virtuous republic like Geneva. Rousseau's objection is not merely to *what* is shown on stage, but to *the act of spectating itself* and the *social institution* of professional theatre. He argues that even the *best* theatre would undermine the active citizenship, authenticity, simplicity, and tight-knit community bonds he sees as essential for Geneva's survival as a free republic. **A theatre restricted to "virtuous" plays would still be, in Rousseau's view, a dangerous and alien institution incompatible with Geneva's ideal republican character.** His positive alternative is always active, participatory, authentic civic festivals, not passive consumption of any form of staged performance.
