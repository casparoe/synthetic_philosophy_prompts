  The key challenge they pose is twofold: (1) argue that "unsaturatedness" is a label, not an explanation, for how concepts unify propositions, and (2) counter the Fregean rebuttal that unsaturatedness is a primitive fact making regress unnecessary. They also ask whether Bradleyans could similarly stipulate relations as primitively "relational." 

