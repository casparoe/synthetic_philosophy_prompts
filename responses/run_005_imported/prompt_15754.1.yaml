  Then, confront Frege's "primitive fact" defense: if Frege can take combination as brute, why can't Bradleyans take relationality as brute? If Frege replies that unsaturatedness avoids needing a *further* relator, note that Bradley could equally say a relation's relationality is intrinsic, needing no *additional* glue. Both seem equally stipulative. 

  Crucially, stress that the problem isn't infinite regress *itself* but the lack of explanation for unity. Frege avoids regress by fiat, but the mystery remains: what *is* this "unsaturatedness" beyond "combines without mediation"? That's circular. 

  For the seminar: I'd frame this as exposing Frege's move as elegant but ultimately a metaphysical placeholder. The students might be mistaking *naming* the solution (unsaturatedness) for *providing* it. The real takeaway is that all solutions here—Frege's, Russell's, Bradley's—rely on some brute fact. Frege's advantage is elegance, not deeper insight. 

  User's pedagogical goal seems to be unsettling complacency. Perfect—this objection should achieve that by showing Frege's "stop" to the regress rests on unexplained primitives too.
answer: |-
  Here’s a sharpened objection to Frege’s "unsaturatedness" solution, designed to challenge the claim that it genuinely resolves Bradley’s regress rather than merely repackaging the problem. I’ll structure it to directly confront the Fregean rejoinder and address the parity issue with Bradleian relations:

  ---

  ### **Core Objection: Unsaturatedness as a Label, Not an Explanation**
  Frege’s doctrine of unsaturatedness does not *explain* propositional unity but *presupposes* it. By defining concepts as "unsaturated" entities that automatically combine with "saturated" objects, Frege stipulates that combination occurs as a brute fact. But this merely **relabels the explanandum** (how unity emerges) as a **primitive feature** of concepts. The puzzle was always: *Why do certain entities combine into unities rather than lists?* Saying "because concepts are unsaturated" restates this puzzle in Fregean jargon without illuminating *how* or *why* unsaturatedness enables combination. It replaces Bradley’s regress with a **categorial mystery**.

  ### **Confronting the Fregean Rejoinder**
  *Frege’s Defense*: "Unsaturatedness is primitive, so no ‘further connector’ is needed. The regress stops because concepts *just are* the kind of thing that binds objects."  
  *Rebuttal*:  
  1. **Primitivism as a Retreat**:  
     - Claiming unsaturatedness is "primitive" concedes that Frege offers no *mechanism* for unity—only a *redescription* of what needs explaining. Bradley’s regress arises because we seek an account of *how* relations connect relata. Frege avoids regress by declaring combination automatic for concepts, but this doesn’t answer *why* unsaturated entities unify while saturated ones do not. It **shifts the regress into a black box**.  
     - *Analogy*: Saying "opium induces sleep because it has a dormitive virtue" (Molière’s joke) restates the effect as a cause. Similarly, "concepts unify because they’re unsaturated" restates unity as an intrinsic property.  

  2. **The Threat of Vacuousness**:  
     - If "unsaturated" means nothing beyond "combines with objects," the term is **circular**: it defines the solution in terms of the problem. For Frege’s view to be substantive, unsaturatedness must be independently characterizable—yet he insists it is indefinable and graspable only through analogy (e.g., "a predicate is like a function with gaps"). But this analogy *presupposes* we already understand how functions apply to arguments—which is the very unity at issue.  

  ### **The Parity Objection: Could Bradley Say the Same?**
  *Your Question*: Could a Bradleian not stipulate that relations *primitively* "relate," making further glue unnecessary?  
  *Answer*: **Yes—and this exposes Frege’s lack of explanatory advantage**.  

  1. **Bradley’s Rejoinder Made Explicit**:  
     - Bradley could co-opt Frege’s move: "Relations *just are* entities with a primitive *relating-ness*; they don’t *need* a further relation to connect to relata because relating is their essential nature." This mirrors Frege’s "unsaturatedness is primitive" defense.  
     - *Consequence*: If Frege can help himself to brute categorial facts (unsaturatedness), Bradley can too (relating-ness). But then Frege hasn’t *solved* anything Bradley couldn’t—he’s merely **replaced Bradley’s primitive *relating* with a primitive *unsaturatedness***.  

  2. **Frege’s Alleged Advantage Undermined**:  
     - Frege might argue that Bradley’s relations are "saturated" terms, inviting regress, while concepts are *ontologically different*. But this difference is asserted, not argued. Bradley could retort:  
       *"Call my relations ‘unsaturated’ if you like—what matters is whether they’re assigned a brute unifying power. If Frege’s concepts can have it, why can’t my relations?"*  
     - **The symmetry** reveals that both proposals rely on an inexplicable "unifying essence" (whether called "unsaturatedness" or "relating-ness"). Frege’s solution only *appears* superior because he builds unity into the *category* of concepts, whereas Bradley treats relations as a distinct *type of object*. But categorizing concepts as "unsaturated" doesn’t make their unifying power less mysterious.  

  ---

  ### **Why This Matters for Your Seminar**
  - **Pedagogical Punchline**: Frege’s move avoids Bradley’s *infinite regress* but not the *explanatory gap*. It dissolves the regress by positing a brute fact—which is progress in terms of ontological economy, but not a deep solution to the unity problem.  
  - **Student Takeaway**: Unsaturatedness succeeds as a *formal device* (e.g., for logic) but fails as *metaphysics*. It answers "How do we model unity?" not "What *is* unity?"  
  - **Dialectical Edge**: Press students to consider whether *any* solution to Bradley’s regress must bottom out in primitivism (Frege’s unsaturatedness, Bradley’s relating-ness, Russell’s "understanding" in the multiple relation theory). If so, Frege’s "victory" is merely aesthetic.  

  This objection forces students to confront whether Frege’s framework genuinely advances the metaphysics of unity—or if it’s a sophisticated way to restate the problem while dodging the regress.
