answer: |-
  ## The Hitchhiker's Guide to Rationality: Dissolving the Ghost of "Rational Irrationality"

  Parfit's Hitchhiker presents a stark dilemma: stranded in the desert, a driver offers a ride only because she can infallibly predict you *will* pay upon arrival. Once safely in town, however, paying $100 yields no further benefit – keeping it is locally optimal. Parfit concluded that true rationality demands a **disposition** to pay, even though the act of paying itself, judged in isolation, is irrational. This "rational irrationality" – being rationally required to be disposed towards irrational acts – is a deeply unsettling conclusion. Competing responses – Gauthier's constrained maximization, McClennen's resolute choice, and updateless/functional decision theories (UDT/FDT) – all advocate paying but vehemently reject Parfit's characterization. The core question is whether "rational irrationality" is an irreducible feature of rationality exposed by the case, or whether these alternative frameworks successfully eliminate it by fundamentally changing the object of rational evaluation. I argue the latter: **"Rational irrationality" is not a genuine feature of rationality but a byproduct of an inadequate unit of analysis; serious responses eliminate it by correctly evaluating extended agents or policies, rendering the act of paying rationally justified *at the moment of action* within that broader context.**

  **Deconstructing the Dilemma and Parfit's Surrender**

  The apparent force of "rational irrationality" stems from two premises:
  1.  **Local Act Rationality:** Rationality is judged solely on the consequences of the immediate, isolated act. In town, paying costs $100 for zero benefit, hence irrational.
  2.  **Global Outcome Dependence:** The *opportunity* to get the ride (the vastly superior outcome) depended entirely on the driver's prediction of the future act (paying). Getting the ride required having the *disposition* to pay.

  Parfit accepts both premises. Since the desirable outcome (survival) necessitates the disposition, rationality *requires* possessing that disposition. Yet, when the moment to act arrives, exercising the disposition (paying) violates premise (1). Hence, rationality compels you to be disposed to act irrationally later. This is a profound paradox, suggesting rationality might be self-undermining or fragmented across time.

  **The Denial: Gauthier, McClennen, and the Rejection of Isolation**

  Gauthier (constrained maximization) and McClennen (resolute choice) reject premise (1), arguing rationality cannot be confined to isolated acts divorced from the plans and dispositions that made them possible.

  *   **Gauthier (Constrained Maximization):** Rational agents adopt *dispositions* to cooperate (like keeping agreements) when interacting with others who can detect such dispositions. While defecting (not paying) *feels* locally optimal, it's irrational *ex ante* to adopt a disposition (straightforward maximization) that precludes beneficial cooperation. The *disposition* to pay is rationally chosen because it enables gains impossible otherwise. When paying, you are *fulfilling* your rational disposition; the act isn't irrational, it's the *expression* of prior rational choice. Gauthier shifts evaluation to the disposition chosen before the interaction.
  *   **McClennen (Resolute Choice):** Truly rational agents can form and *resolutely stick to* plans that maximize expected utility over time, even when tempted by local optima. Choosing the plan "Accept ride if offered, then pay" *ex ante* is rational. Resolutely executing the "pay" step *in town* is not an irrational act; it's the rational *continuation* of the optimal plan. McClennen shifts evaluation to the plan adopted at the outset.

  Both frameworks dissolve "rational irrationality" by arguing the act of paying *is* rational *when viewed as part of the chosen disposition or plan*. The irrationality vanishes because the unit of evaluation is expanded.

  **The Dissolution: UDT/FDT and the Primacy of Policy**

  Updateless (UDT) and Functional (FDT) Decision Theories launch a more radical attack, rejecting the very idea that the "moment of action" is the primary locus of evaluation. They argue rationality evaluates *policies* or *decision functions* that map all possible situations (including information about how one's choice is predicted) to actions.

  *   **The Core Idea:** Rationality asks: "What *general policy* for situations *of this type* (involving predictors or logical dependencies) maximizes expected utility?" Crucially, this evaluation is "updateless" – it considers the policy's consequences *across all possible worlds it could be implemented in*, including those where the predictor exists.
  *   **Solving the Hitchhiker:** The optimal policy is "Pay upon arrival *if* picked up by a predictor who only picks up payers." Why?
      *   If you specify a policy of not paying, the predictor (knowing this) never picks you up. You die.
      *   If you specify a policy of paying, the predictor picks you up. You pay $100 but survive, a net gain over death.
      *   The policy "Pay" yields survival; "Don't Pay" yields death. "Pay" dominates.

  When you pay in town, you are not performing an irrational isolated act. You are *implementing the optimal policy you are rationally committed to*. There is no "moment of irrationality." The act is rational *because* it is the output of the globally optimal decision function. FDT explicitly frames the agent as a *function* whose outputs are evaluated based on the logical consequences of its code being known. Paying is simply the correct output of the rational function for this input.

  **Verdict: Rational Irrationality Dissolved**

  "Rational irrationality" is a phantom. It arises only when we insist on judging acts in extreme isolation, ignoring:
  1.  **The Causal History:** The act (paying) was the *necessary condition* enabled by the disposition/policy that secured the vastly superior outcome (the ride/survival). Judging it without this context is arbitrary.
  2.  **The Logical Dependencies:** In predictor scenarios, the *act itself* is part of the initial conditions (via prediction). Isolating it ignores this counterfactual dependence.
  3.  **The Unit of Agency:** Rational agents are extended in time (Gauthier, McClennen) or are best modeled as functions/policies (UDT/FDT). Evaluating sub-components (single acts) in isolation often yields nonsense, like judging a single chess move without the strategy.

  Gauthier, McClennen, and especially UDT/FDT successfully eliminate "rational irrationality" **by changing the unit of rational evaluation to the correct level:** dispositions, plans, or policies/functions. Within these frameworks, the act of paying **is rationally justified at the moment of action**:
  *   For Gauthier: It fulfills the rationally chosen cooperative disposition.
  *   For McClennen: It executes the resolutely chosen optimal plan.
  *   For UDT/FDT: It is the output of the globally optimal decision policy/function.

  The driver's predictor doesn't create irreducible irrationality; it vividly exposes why the *isolated act* is the wrong unit of analysis. Rationality requires coherence across time and logical possibility.

  **Implications for Ordinary Promises: Policy Rationality Without Predictors**

  What about keeping a promise when the immediate benefit is gone? (E.g., returning a borrowed book after finishing it, honoring a contract when reneging is profitable but undetectable). Lacking a dramatic predictor, does "rational irrationality" resurface?

  No. The UDT/FDT perspective provides the clearest answer. Rationality still involves choosing an optimal *general policy* for dealing with commitments:

  1.  **The Optimal Policy:** A policy of "Keep promises unless actively coerced or impossible" generally dominates "Break promises whenever immediately beneficial." Why?
      *   **Reputation & Trust:** While a specific broken promise might go undetected, a *policy* of promise-breaking (or even the *risk* inherent in an unreliable policy) destroys trust. This incurs massive long-term costs: lost opportunities for cooperation, damaged relationships, exclusion from beneficial agreements. Humans constantly (if imperfectly) predict reliability based on past behavior and perceived character.
      *   **Coordination & Norms:** Promise-keeping is a social norm essential for complex coordination. Adhering to the norm, even in isolated instances, supports the system that benefits everyone, including oneself. Breaking it erodes the norm.
      *   **Self-Conception & Integrity:** Consistently breaking commitments for short-term gain often leads to internal conflict, loss of self-respect, and makes it harder to form beneficial long-term intentions – costs factored into a rational policy.

  2.  **The Act of Keeping:** When you keep the promise, you are not acting irrationally in isolation. You are implementing the *globally optimal policy* for navigating a social world where trust, reputation, and norms are crucial capital. The benefits secured by this policy (trustworthiness, reliable partnerships, self-integrity) are realized *because* you keep promises *even when* a narrow calculation might suggest defection. The immediate "loss" is the price paid to maintain the vastly more valuable asset of being a promise-keeper.

  While the absence of a perfect predictor makes the calculation fuzzier than in the Hitchhiker case, the fundamental logic remains: **Rationality evaluates policies over a lifetime of potential interactions.** Keeping the promise is the locally correct output of the globally optimal policy. There is no "rational irrationality," only the rational execution of a strategy designed for a complex, socially embedded existence. The Hitchhiker doesn't reveal a dark truth about fragmented rationality; it illuminates why true rationality must consider the extended self and the logical fabric of the world in which it acts.
