answer: |-
  ## Diner Debate: Trout, Turkey, and the Troubles of Composition

  **Setting:** A slightly greasy, retro diner. Red vinyl booths, chrome accents. The smell of coffee and fried food hangs in the air. **Orin (Organicist, Van Inwagen Defender)** is picking at a plate of trout. **Sid (Universalist, Lewis/Sider Fan)** is halfway through a towering turkey club, fries scattered like debris.

  **Sid:** (Gesturing at Orin's trout with a fry) Still sticking with the "life-only" club, Orin? Even after three weeks of your group sweating over *Material Beings*? That trout makes sense to you – simples arranged trout-wise, constituting a life. Fine. But look at this monstrosity. (He lifts his sandwich, mayo threatening to drip). Turkey, bacon, lettuce, tomato, bread. According to Pete, they compose something *only* if they constitute a life. Which they spectacularly do not. So... just simples? No turkey-club *object*? Seems... inconvenient. And wrong. I *see* a thing. I'm *eating* a thing.

  **Orin:** (Sighs, puts down fork) Convenience isn't the metric, Sid. Van Inwagen's point is *ontological rigor*. Your universalism sidesteps the Special Composition Question entirely – composition *always* occurs. Any random assortment – (He gestures vaguely at Sid's plate) – this turkey slice, that fry, a molecule of ketchup on your thumb – *poof*, they compose a new object! The infamous "trout-turkey"! You get *that*, but deny my trout is a single object? That's not solving the SCQ, that's declaring it meaningless! How is *that* rigorous?

  **Sid:** (Takes a defiant bite) Meaningless? No. *Answered*. Unrestrictedly. Composition is cheap and easy. There *is* a trout-turkey fusion. Right here! (He taps his plate). It has parts: trout parts over there, turkey club parts over here. It exists. It's just utterly arbitrary and unimportant *except* for the purposes of mereology. *Your* answer pretends to find a "joint in nature," but when I press on that joint, it gets mushy. Vagueness central! Van Inwagen booted Contact and Fastening for vagueness, then snuck Life in the back door. How's *life* immune?

  **Orin:** Because life isn't just *any* arrangement, Sid. It's a specific, highly complex, self-sustaining, goal-directed *activity*. A dynamic *pattern* instantiated by the simples. That pattern either is or isn't occurring. The trout on my plate? The activity has ceased. It's dead. So *now*, it's just simples arranged fish-wise. But *before* it was caught? Definitely a life, definitely an object. The joint *is* there – it's the presence or absence of that specific, unified biological process.

  **Sid:** (Leans forward, eyes sharp) Oh, *really*? Specific and unified? Let's press that joint. What about a slime mold? Is it one organism when it's a plasmodium? Or billions of individual amoebas when it disperses? Is a virus "alive" in van Inwagen's sense? Does it compose an object? What about a bacterium in stasis, frozen? Is *that* activity "occurring"? Or my Aunt Edna in a persistent vegetative state? Is she still composing an object, or just simples arranged Edna-wise? Suddenly, your "precise" joint looks suspiciously blurry, Orin. Doesn't this reintroduce the *exact* vagueness van Inwagen feared? How many things are in the room with Edna? One? Or trillions? Seems vague to me!

  **Orin:** (Pushes his plate aside, focuses) Edge cases exist, Sid. Biology has borderline situations. That doesn't mean the *category* is vague in a way that infects *ontology*. Van Inwagen argues the vagueness is *epistemic* or *semantic* – it's about *our* difficulty classifying complex biological phenomena, not about a genuine ontological indeterminacy in the number of concrete objects. The activity constituting a life is an objective, physical phenomenon. Either the complex, self-sustaining processes are happening, or they aren't. The fact that *we* might struggle to define the exact boundary in marginal cases doesn't mean there *is* no boundary, or that the number of objects becomes vague. It means *our knowledge* or *our concepts* are imperfect.

  **Sid:** (Snorts) That's a dodge worthy of Lewis himself! "Oh, the vagueness isn't *in the world*, it's just in *us*!" Convenient. But the problem *for ontology* is the same: depending on how we draw the line (or where the "objective phenomenon" line actually lies, if it's even sharp), the *count* of objects changes. Van Inwagen needs a *precise* criterion to avoid vague counts. "Life" doesn't deliver precision at the boundaries. Therefore, by his *own logic*, it should be rejected. Universalism *does* deliver precision: there's always a fusion. Always. Count is always definite. Messy? Sure. But ontologically clean.

  **Orin:** "Clean"? Your precision is bought at the cost of ontological profligacy and absurdity! You get your definite count, but it includes *every arbitrary fusion imaginable*. The fusion of my left shoe and the Eiffel Tower right now exists? The fusion of Sid's nose and the trout's tail? *These* are the objects you populate the world with? How is *that* a coherent picture of reality? It renders the concept 'object' ontologically vacuous! At least organicism ties composition to a genuinely significant, non-arbitrary feature of the world – the emergence of biological unity. It explains why organisms are *paradigmatic* objects. Your world is just... dust. Dust and arbitrary heaps.

  **Sid:** (Finishes his sandwich, wipes his mouth) Heaps are real, Orin. Simple, definite, and they obey the axioms of mereology perfectly. And they *explain* your organisms: your trout *is* a heap, just a very special, interesting, causally integrated one. But denying the existence of all the other heaps because you find them "messy" or "insignificant" is metaphysics driven by aesthetic preference, not logical rigor. Van Inwagen's fear of vague counts led him to propose a criterion – life – that *itself* introduces borderline cases where counts *seem* vague, forcing him into awkward appeals to "objective phenomena" and blaming our epistemology. My world has definite counts and admits all the fusions. Yours has a privileged class but dances around the vagueness at its edges. I'll take the dust and the heaps. More coffee?

  **Orin:** (Stares at the remains of his trout) More coffee. And maybe a stronger argument for why "significant" shouldn't matter to fundamental ontology... but you're still stuck with trout-turkeys. Pass the sugar.

  **(The waitress refills their coffees. The debate simmers, unresolved, much like the question of what, exactly, constitutes a "thing" on Sid's now-empty plate.)**
