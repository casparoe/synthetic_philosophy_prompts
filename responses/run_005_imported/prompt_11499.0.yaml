  Hmm, this is actually a fascinating philosophical question disguised as a research problem. The user isn't just asking for numbers—they're wrestling with how much specificity matters when creating believable fiction. Their frustration is palpable: the more precise the data, the smaller the sample size, until it becomes meaningless. But generic stats feel dishonest to the character's particular circumstances. 

