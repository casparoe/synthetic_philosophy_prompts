prompt: |-
  I cover science and ideas for a magazine, and on the companion podcast next week I'm interviewing a formal epistemologist who has built her career defending accuracy-first epistemology: the attempt to derive probabilism and rules like Conditionalization from the premise that rational credences should minimize expected inaccuracy, as measured by something like the Brier score. Whenever I push on why the argument gets to assume one particular way of scoring closeness to the truth, she deflects by insisting that any 'legitimate' inaccuracy measure -- continuous, truth-directed, strictly proper -- yields the same dominance result, so nothing controversial is smuggled in. Draft eight to ten interview questions that go beyond having her restate Joyce's accuracy-dominance argument: at least one pressing on whether 'legitimate' is quietly doing the work that needs independent justification, one on what 'immodesty' -- the idea that a coherent credence function must rate itself uniquely best -- implies about two rational agents who each think the other has erred, and one on whether the framework assumes epistemic risk-neutrality by fiat. For each, add a follow-up keyed to the answer she's most likely to give.
