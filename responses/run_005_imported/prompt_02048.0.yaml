answer: |-
  You've hit on a profound psychological dilemma: **Your bias likely *is* distorting your perception, not just your interpretation, and it feels like objective reality.** This is the insidious power of the **"Expectancy Effect"** (where expectations literally alter perception) combined with **"Confirmation Bias"** (seeking evidence to confirm the expectation). Here's the breakdown and actionable steps:

  ### Why It's Likely Bias, Not Your Co-Manager Being Oblivious
  1.  **The Blind Test:** Your co-manager, lacking the negative priming, saw neutrality. This is powerful evidence. If the defensiveness were as unambiguous as a blue shirt, she'd likely have seen it too.
  2.  **The Feeling of Obviousness:** The *intensity* of your feeling ("screams defensive/shut-down") is a hallmark of bias kicking in. Your brain is amplifying subtle cues (or misinterpreting neutral ones) to match the expectation.
  3.  **The Source:** An off-hand, non-specific "heads-up" is potent priming. It creates a lens *before* you had direct experience, shaping your initial interactions and setting a trajectory.
  4.  **Neurological Basis:** Expectations literally alter how our sensory cortices process information. You *are* perceiving differently than your co-manager.

  ### Why "Just Be Objective" Isn't Helpful (And What To Do Instead)
  Objectivity isn't a switch you flip. It's a practice requiring structured tools to bypass ingrained biases. Here’s what actually works:

  1.  **Radically Depersonalize Feedback & Evaluation:**
      *   **Focus on Behavior, Not "Attitude":** Instead of labeling "defensive," note specific, observable behaviors: *"When I mentioned X, D paused for 5 seconds, looked down, and said 'Okay' in a flat tone."* Describe actions and words, not inferred states.
      *   **Use Rubrics & Pre-Defined Criteria:** For feedback and future evaluations (like raises), base them *entirely* on pre-established, measurable goals and competencies (e.g., "Completes project milestones on time," "Incorporates feedback into revised drafts," "Collaborates effectively on X task"). Remove vague terms like "attitude" or "receptiveness."
      *   **Document Observed Behaviors, Not Interpretations:** Keep a log: *"Date: Feedback given on Y report section. Observed: D listened silently, asked 2 clarifying questions about data sources, committed to revise by Z date."* NOT: *"D seemed defensive about report feedback."*

  2.  **Leverage Recordings Systematically (Your Best Tool):**
      *   **Watch *Before* Meetings:** Review past recordings *before* your next 1:1 with D. Note objectively what *actually* happened last time, countering your memory bias.
      *   **Review with a Specific Question:** After a meeting where you *felt* defensiveness, re-watch *only* that segment. Ask: *"What specific words did D use? What was their exact body language (e.g., crossed arms? slumped? neutral expression?)? How long were the pauses? Did they ask questions? Did they commit to action?"* Compare this to your immediate emotional impression.
      *   **Track Patterns Objectively:** Over several meetings, look for objective patterns in D's *behavior* during feedback. Does he *consistently* ask clarifying questions? Does he *consistently* implement the feedback later? Does he *consistently* pause before responding? This data is more valuable than the "vibe."

  3.  **Actively Challenge Your Own Perception:**
      *   **The "Alternative Explanation" Test:** When you feel defensiveness, force yourself to generate 2-3 *neutral or positive* explanations for the behavior you see. (e.g., "He paused and looked down... maybe he's deeply processing the feedback? Maybe he's tired? Maybe he's thinking how to phrase his question?")
      *   **Seek Counter-Evidence:** Consciously look for instances where D *does* receive feedback well, asks good questions, or implements changes smoothly. Document these too.
      *   **Role Reversal (Mentally):** Imagine *you* were told a new manager had heard you were "difficult." How might you feel in 1:1s? Might you be overly cautious, trying hard not to seem defensive, potentially coming across as stiff or quiet?

  4.  **Proactively Engage with D (Neutrally):**
      *   **Direct but Neutral Check-in:** In your next 1:1, address it neutrally: *"D, I want to ensure our feedback sessions are productive for you. How do you typically prefer to receive critical feedback? Is there anything I can do to make these discussions more effective or comfortable?"* This focuses on *process* and *his needs*, not an accusation of defensiveness.
      *   **Focus on Impact, Not Intent:** If a specific behavior *objectively* hinders work (e.g., he stops contributing after feedback), address *that*: *"I noticed after we discussed X, the collaboration on Y seemed to stall. What happened there?"* NOT: *"You get defensive and shut down."*

  5.  **Utilize Your Co-Manager Strategically:**
      *   **Blind Spot Checks:** Periodically (and sparingly), ask your co-manager for her *specific* observations on D's behavior in meetings where feedback was given, *before* sharing your own perception. Compare notes on observable actions.
      *   **Joint Evaluation:** When it's time for formal evaluation, review the *objective evidence* (project outcomes, behavior logs, documented feedback implementation) together *before* discussing subjective impressions.

  ### The Key Mindset Shift
  *   **Acknowledge the Bias is Real & Active:** You aren't "failing" by being biased; it's how brains work. The goal is *managing* it, not eliminating it.
  *   **Trust Data Over Gut (Especially Here):** Your gut is primed. Rely on observable behaviors, recorded evidence, documented results, and structured criteria.
  *   **Separate "Perception" from "Reality" for Evaluation:** Your *perception* of defensiveness is data *about you and the interaction*. D's *actual work output and behavioral patterns* are the data about *him*.

  **Bottom Line:** The offhand comment likely *did* alter your perception. "Trying to be objective" alone won't fix it. Implement structured tools (behavioral observation logs, rubrics, systematic recording review, direct process-focused conversations) to bypass the bias and evaluate D fairly based on tangible evidence of his work and observable actions. This protects D, protects your integrity as a manager, and leads to more accurate evaluations.
