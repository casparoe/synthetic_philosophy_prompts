  Here’s a draft that navigates those tricky waters, honoring Nadia and Cole's unique foundation while keeping it warm, inclusive, and grandma-safe, without shying away from the Russell context or its complexities:

  **(Clink glass gently, warm smile)**

  "Hi everyone. For those I haven’t had the pleasure of meeting yet, I’m [Your Name], and I’ve had the immense joy of being Nadia’s friend for [Number] years. It’s a true honor to be standing here today, celebrating her and Cole.

  Now, anyone who knows Nadia and Cole knows they don’t do things by accident. Especially when it comes to ideas. They met, famously, in a reading group – diving deep into the works of a rather brilliant, complex philosopher named Bertrand Russell. And honestly, that feels incredibly fitting. Because what’s struck me most about their relationship, from the very beginning, isn’t just the obvious love and laughter, but the sheer *intention* behind it.

  They approach their partnership like they approached those Russell texts: thoughtfully, critically, and with a deep commitment to understanding. They’ve built something not just on feeling, but on a shared set of values they actively choose every day. Values like **radical honesty**. Like the courage to have the conversations others might avoid. Like a belief in **continuous growth**, both individually and together.

  Russell wrote powerfully about challenging societal norms, about questioning the things we often just accept as 'natural' – including some of the messier emotions that can surface in relationships. He suggested that perhaps some of the things we assume are fixed instincts... might actually be habits we’ve learned, patterns we can choose to examine and reshape with conscious effort and communication.

  **(Pivot slightly, acknowledge the complexity gently)**

  Now, Russell was a brilliant thinker, but he was also human. Like all of us, he grappled with putting his lofty ideals into practice. His own life was... complicated. He discovered, painfully, that understanding jealousy intellectually didn't magically erase the feeling when it arose. That’s the messy, beautiful reality of being human, isn’t it? Ideas are powerful, but the lived experience is where the real work happens.

  **(Bring it back to Nadia & Cole, focusing on their strength and core values)**

  And *that* is where Nadia and Cole truly shine. What’s so remarkable, so inspiring about them, isn’t that they’ve found some perfect, philosophical formula immune to human complexity. It’s the *way* they navigate that complexity. They don’t shy away from the hard stuff. They lean into the conversations – the vulnerable, honest, sometimes challenging conversations – with a level of mutual respect and courage that takes my breath away.

  They understand that **real commitment isn’t about avoiding difficulty; it’s about facing it together, openly and authentically.** Their commitment is built on a foundation of profound trust, not in the absence of challenges, but in their shared ability to meet them head-on, to learn, to adapt, and to grow *through* them. They’ve redefined what partnership means for them, not by ignoring tradition, but by consciously choosing what resonates, what serves their love and their individual flourishing.

  **(Universalize the message for all guests)**

  In the end, isn’t that what we all hope for? A love that is **deeply honest**. A partnership that **encourages growth**. A bond strong enough to weather life’s inevitable complexities, not because it’s perfect, but because it’s **rooted in unwavering respect, clear communication, and the courage to be truly seen**. Nadia and Cole have built exactly that – a vibrant, evolving testament to the power of choosing your love story consciously, every single day.

  **(The heartfelt conclusion & toast)**

  So, Nadia and Cole, today we celebrate not just your love, but the incredible *way* you love each other. We celebrate your bravery, your honesty, your fierce intellect, and the profound respect that flows between you. We celebrate the unique, beautiful, and deeply intentional partnership you’ve created. May it continue to grow, challenge, and delight you for all the years to come.

  **(Raise glass high)**
  **To Nadia and Cole – may your journey together always be as honest, as brave, and as full of love as the remarkable foundation you’ve built today. Cheers!"**

  **Why this works:**

  1.  **Honors the Russell Connection:** Explicitly mentions him, the reading group, and the core idea of questioning "natural" instincts/emotions (jealousy) without using the word. Friends in the know will absolutely recognize the references to *Marriage and Morals*.
  2.  **Acknowledges Russell's Failure Subtly:** Framing it as "he was human," "grappled with putting ideals into practice," and "discovered understanding didn't erase feeling" addresses the complexity without being a downer. It shows you know the history but pivots it to highlight Nadia and Cole's *strength*.
  3.  **Focuses on Core Universal Values:** Radical honesty, courageous communication, continuous growth, conscious choice, facing challenges together, unwavering respect, deep trust. These resonate with *any* strong marriage or partnership, monogamous or not. Grandma hears beautiful sentiments about commitment and working through difficulties.
  4.  **Avoids Explicit Terminology:** No mention of "non-monogamous," "open," "poly," etc. The focus is entirely on the *qualities* of their relationship that stem from their philosophy.
  5.  **Celebrates *Their* Strength & Choice:** The toast centers Nadia and Cole's courage, intentionality, and the *way* they navigate complexity, not the specific structure itself. "Consciously choosing," "redefined partnership for them" – friends get it, others hear deep thoughtfulness.
  6.  **Warm, Positive, and Uplifting:** The language is celebratory ("immense joy," "remarkable," "inspiring," "beautiful," "vibrant"). The acknowledgment of complexity is framed as a testament to their strength, not a warning or critique.
  7.  **Grandma-Safe:** She hears a toast about deep love, honesty, commitment, facing challenges, respect, trust, and building a strong foundation – all classic wedding toast virtues, just articulated with a slightly more intellectual and intentional flair that reflects the couple.

  **Key:** Deliver it with warmth, sincerity, and a focus on the love and admiration you genuinely feel for them. The respect and care in your tone will carry the message beautifully for everyone. Good luck! You've got this.
