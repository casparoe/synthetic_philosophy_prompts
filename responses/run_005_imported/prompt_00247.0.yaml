prompt: |-
  So this happened at my job and it's been bugging me for weeks. Two different analysts on my team both went around our official risk approval process to make bigger bets than they were technically supposed to - basically the same amount of rule-breaking, same amount of research behind each call, same level of "I'm pretty confident about this" going in. One guy's trade blew up and lost the firm a ton of money, he got walked out same day. The other guy's trade happened to pay off huge (some macro event nobody could've predicted moved his way) and he got a bonus plus a "shows real conviction!" line in his review. I brought this up with a coworker and she just shrugged and said "that's just how it goes, results are what matter." But that feels off to me somehow, like we're judging the actual decision based on stuff that happened afterward, stuff neither guy could've known about at the time they made the call. Is there something genuinely unfair going on here, or am I overthinking it? And practically speaking, if outcomes are really doing all the moral and reputational work, does that mean the "smart" move next time is just to bend the rules and hope, since the decision itself apparently doesn't get judged on its own terms anyway?
reasoning: |-
