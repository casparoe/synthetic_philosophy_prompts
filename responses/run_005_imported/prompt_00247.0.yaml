  First, I need to validate their feelings. Yes, this is absolutely unfair. The core issue is outcome bias—judging decisions based on results rather than the decision-making process itself. Both analysts made identical mistakes: bypassing risk protocols with the same level of confidence. The only difference was luck. 

  The user's coworker shrugged it off with "results are what matter," which probably made them feel dismissed. That attitude is dangerous—it encourages rule-breaking and punishes bad luck instead of bad judgment. The firm is basically incentivizing gambling. 

  Then there's the practical dilemma: if outcomes trump everything, should the user also bend rules and hope for luck? That's a scary thought. The firm's inconsistency creates moral hazard. If they reward rule-breaking when it pays off, others will take reckless risks. 

  I should emphasize that the unfairness isn't just perceived—it's systemic. The firm failed twice: first by not catching the rule-breaking beforehand (control weakness), then by handling the aftermath inconsistently (poor culture signaling). 

  The user might also be wrestling with deeper questions: "Is this a place I want to work? Can I trust leadership?" They’re likely feeling uneasy about the firm’s ethics and their own future choices. 

  For advice: they’re right not to emulate the "successful" rule-breaker. Stress that integrity matters long-term, even if the firm doesn’t see it. Suggest documenting concerns quietly, but caution against die-on-this-hill activism unless they’re senior. 

