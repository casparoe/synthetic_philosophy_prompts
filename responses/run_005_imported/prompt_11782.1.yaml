answer: |-
  Here’s a 3-4 minute toast that navigates the Keynes tension, celebrates Dan, and works for the mixed crowd – respectful to colleagues who get it, accessible to family, and still feels like a warm send-off:

  **(Clink glass gently)**  
  Alright everyone, gather 'round! For those who don’t know me, I’m [Your Name], and I’ve had the dubious honour of knowing Dan for... well, long enough to know this furniture-making leap isn’t *entirely* out of character. Mostly, yes. But not entirely.

  Dan, mate. Eight years in banking. You wrestled spreadsheets, conquered compliance dragons, and navigated the unique thrill of predicting what markets *might* do on a Tuesday. You were good at it. Really good. And yet… here we are. Standing in a pub, celebrating you trading in your calculator for a chisel. Trading quarterly reports for… quarter-sawn oak.

  **(Light chuckle, gesture to Dan)**  
  Now, last night, my friend Priya and I got *deep* into the weeds over this. Priya reckons Dan’s not just brave, he’s practically living out a prophecy. She reminded me of this old economist, John Maynard Keynes – wrote nearly a century ago. He dreamt of a future where, once we’d sorted the basics – food, shelter, security – we wouldn’t be chained to our desks 50 hours a week. We’d scale right back. Maybe work three-hour days. And spend the *real* time… well, on beautiful, maybe even slightly pointless things. Art. Gardens. Crafting something perfect just because you can. Priya thinks Dan’s gone full Keynesian hero. The future, arriving right on schedule.

  **(Pause, slightly more thoughtful)**  
  And I see her point. Dan *has* got the basics covered. He’s stepping off the relentless treadmill. Choosing creation over calculation. Choosing the tangible satisfaction of a dovetail joint fitting perfectly over the abstract satisfaction of a spreadsheet balancing. He’s prioritising joy and craft. It *is* beautiful. It *is* brave.

  **(Shift tone slightly, more conversational)**  
  But… and there’s always a ‘but’, isn’t there? That same old economist, Keynes, also spotted a snag. He figured that *some* human needs… well, they might be bottomless. Not the need for shelter or food, but the need to feel… ahead. Important. To have *more* than the next person. The need for status. And he worried that *that* hunger might keep us running on the treadmill long after the basic needs were met. He just hoped it wouldn’t be the *main* driver for most people.

  **(Look around, include the colleagues gently)**  
  And look around this room. Look at Dan’s brilliant team back at the bank. Smart, capable people. Many of whom, let's be honest, *could* probably afford to scale back too. To chase *their* version of beautiful, pointless things. But they don’t. Most of us don't. Is it because we’re chumps? Trapped? Or is it because that other need – the drive, the ambition, the comfort of the known, maybe even just the fear of the leap – is stronger? Is Dan proving Keynes gloriously right, or did he just get incredibly lucky in finding the courage and the means to jump *despite* those insatiable needs pulling the rest of us along?

  **(Pause, soften, focus back on Dan)**  
  Here’s the thing, though, Dan. Sitting here tonight, watching you genuinely excited about wood grain and joinery instead of LIBOR and leverage... it doesn’t actually matter whose economic theory you fit into. Priya can think you’re the vanguard of a leisure-filled utopia. I can ponder the stubborn power of status anxiety. The truth is simpler, and far more powerful.

  You looked at the life you *could* keep living – successful, comfortable, predictable – and you asked: "Is this *it*? Is this what I want my days to be *for*?" And you answered honestly. You saw a different path – one driven by passion and craft, not just security or status. You had the guts to say "enough" to one perfectly good life to chase another that *feels* more like *yours*.

  **(Raise glass significantly)**  
  So, whether you’re fulfilling an 80-year-old economic prediction, or just being incredibly, uniquely Dan… we raise our glasses. We toast your courage. We toast your skill – because let’s be clear, mate, we *will* be commissioning pieces, family discount applies! We toast the beautiful, tangible things your hands will now make instead of abstract numbers on a screen. And most of all, we toast the reminder you give *all* of us – colleagues, friends, family – that while the path isn't always clear, and the pressures are real, it *is* possible to ask that question: "What do I want my days to be *for*?" And then, bravely, to start walking towards the answer.

  To Dan! The bravest woodworker we know, and a brilliant friend. Cheers!

  **Why this works:**

  1.  **Acknowledges the Tension:** It explicitly mentions the Keynes debate (framed accessibly) and the two viewpoints (Priya vs. You/Keynes's caveat).
  2.  **Respects Both Sides:** Doesn't definitively say who's "right." It presents both angles fairly without insulting colleagues ("chumps") – instead framing their choice as complex ("drive, ambition, comfort, fear").
  3.  **Centers Dan:** The debate serves as a *lens* to highlight Dan's courage and the significance of his choice, not the main event. The final paragraphs focus entirely on celebrating *him*.
  4.  **Accessible:** Explains Keynes simply ("old economist," "dreamt of a future," "beautiful, pointless things," "bottomless needs"). Avoids jargon. Family understands the core conflict: Dan chose passion/craft over security/predictability.
  5.  **Colleague Wink:** Phrases like "spreadsheet balancing," "compliance dragons," "LIBOR and leverage," "abstract numbers" resonate with the banking crowd without alienating others.
  6.  **Warm & Toasty:** Starts and ends with warmth and celebration. Includes humour ("dubious honour," "family discount"). The final sentiment ("What do I want my days to be *for*?") is universally resonant and uplifting.
  7.  **Not a Seminar:** It uses the debate as a *story* to lead into the celebration of Dan's character, not as an academic exercise. The conclusion transcends the theory.
  8.  **Time:** Structured for a natural 3-4 minute delivery with pauses.

  **Delivery Tip:** Vary your pace. Be warm and slightly humorous at the start, more thoughtful when discussing Keynes and the tension, then build warmth and sincerity towards the end. Make eye contact with Dan, then the room, especially during the final toast. Good luck!
