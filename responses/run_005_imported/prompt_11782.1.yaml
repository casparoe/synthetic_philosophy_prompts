prompt: |-
  Ok so backstory: my friend Dan is quitting his job at the bank after eight years to go make furniture for a living, and he's asked me to say a few words at his leaving drinks on Friday. Last night my friend Priya and I got into this whole hour-long argument over dinner that kind of killed the mood - she reckons what Dan's doing is basically Keynes's vision from "Economic Possibilities for our Grandchildren" finally showing up, the 'once your basic needs are covered you should be working three-hour shifts and spending your life on beautiful pointless things' bit. I said thats generous to Keynes, because he did clock that some needs (feeling superior to other people, not just having enough) might be totally insatiable, he just assumed those wouldn't be the main event for most people - which is exactly the bit that's gone wrong, since half of Dan's old team could probably afford to scale back too and none of them are. We never sorted out who's right. There's gonna be a real mix of people at these drinks - old colleagues who'll clock the econ reference immediately, and Dan's family who'll have zero idea what I'm on about. Can you write me something to say, 3-4 minutes read aloud, that leans into this tension - is Dan proving Keynes right, or did he just get lucky in a way that doesn't generalise, and does that make everyone staying behind a chump or not - instead of doing generic 'follow your dreams' stuff, but that still works as an actual toast and not a philosophy seminar.
