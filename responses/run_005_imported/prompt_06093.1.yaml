prompt: |-
  So I'm a novelist, but I got roped into doing an onstage interview at a little books-and-ideas festival next month -- they're pairing novelists with philosophers for a strand called 'Character,' and my guest has spent her career defending virtue ethics against the situationist critique (the Milgram/Asch/Darley-and-Batson stuff that supposedly proves stable character traits are basically a myth). I really dont want this to turn into her just restating 'virtue is an acquired disposition' while I nod along in front of a room of writers. Can you draft me 8-10 questions that actually press on this? I want at least one built around the Good Samaritan seminary study specifically (too perfect not to use on that crowd), one on whether retreating to 'local' traits just quietly concedes the situationists point, and one on whether Aristotle's phronimos was ever meant to describe most people or was always meant as a rare ideal. For each, give me a likely follow-up depending on which way she dodges.
reasoning: |-
  Okay, the user is a novelist preparing for an onstage interview with a philosopher who defends virtue ethics against situationist critiques. The user wants to avoid a passive discussion and instead press the philosopher with challenging questions. They specifically mentioned three key angles: the Good Samaritan study, the concession in "local traits," and Aristotle's phronimos as an ideal.

  First, I need to recall the main points of the situationist critique. Studies like Milgram's obedience experiment and the Good Samaritan study show how situational factors can override character traits. The philosopher's defense likely revolves around virtue as an acquired disposition that's context-sensitive but stable. The user wants to challenge this without letting the philosopher restate standard defenses.

  The user’s explicit requests are clear: include the Good Samaritan study, question if local traits concede the situationist point, and probe whether Aristotle's phronimos is an unrealistic ideal. But deeper needs might include wanting an engaging, dynamic debate that resonates with the audience of writers. Novelists care about character development, so linking philosophical concepts to storytelling could add depth.

  For the Good Samaritan question, I should highlight the conflict between moral preparation and situational urgency. The follow-up needs to address if virtue ethics can account for such situational overwhelm. The philosopher might dodge by emphasizing cultivation over time, so pressing on why that cultivation fails in critical moments is key.

  Next, local traits. If virtues are only stable in familiar contexts, doesn’t that admit situationism wins? The follow-up should challenge whether this reduces virtue to habits, losing its moral essence. The philosopher might retreat to practical wisdom, so questioning the rarity of such wisdom is necessary.

  Aristotle’s phronimos as an ideal: was it meant for the elite? If only a few achieve it, how does virtue ethics apply to most people? The follow-up could explore modern scalability and whether contemporary examples exist, preventing the philosopher from hiding in classical texts.

  I need to ensure each question has a pointed follow-up that anticipates dodges. Also, since the audience is writers, framing questions in relatable terms—like character arcs in novels—could make the discussion more accessible. The user probably wants to avoid academic jargon and keep the conversation lively and relevant to creativity.

  I should also consider potential weaknesses in virtue ethics that the philosopher might not address directly. For example, how do virtues handle unexpected moral dilemmas? Or the role of narrative in developing character, tying back to the novelist’s expertise. This angle could turn the interview into a dialogue between philosophy and literature, fulfilling the festival's theme of 'Character' more effectively.

  Lastly, ensuring the questions are concise but layered, allowing the user to probe deeper based on the philosopher's responses. The follow-ups need to be adaptable, covering different evasion tactics. Balancing philosophical rigor with engaging discourse will make the session stand out, aligning with the user's goal of not just nodding along.
answer: |-
  Here are 10 sharp questions designed to press the core tensions, incorporating your specific requests and anticipating dodges with pointed follow-ups:

  1.  **The Good Samaritan Gut-Punch:** The Darley & Batson seminary study seems devastating for stable traits: even men actively preparing to preach about the Good Samaritan mostly ignored someone in clear distress, primarily due to situational hurry. If deeply-held moral reasoning and professed values can be so easily overridden by minor situational pressure, doesn't this fundamentally undermine the *practical reality* of virtue as a reliable disposition *in the moment of need*?
      *   *Likely Dodge/Response:* "It shows the fragility of *untested* virtue/highlights the need for *constant* habituation."
      *   **Follow-Up:** But doesn't that reframe virtue ethics? If even the *actively morally engaged* (like seminarians en route to preach) require near-perfect situational conditions to act virtuously, doesn't "virtue" become less about a stable character trait and more about meticulously managing one's environment to avoid moral failure? Is that character or contingency planning?

  2.  **The "Local Trait" Concession:** Situationists argue global traits (e.g., "honest") don't predict behavior well across diverse situations. Virtue ethicists often retreat to "local traits" (e.g., "honest *in business dealings with known partners*"). But isn't defining virtues so locally and situationally essentially conceding the situationist core argument – that behavior is *primarily* situation-driven, with "traits" being post-hoc labels we apply to very specific behavioral patterns?
      *   *Likely Dodge/Response:* "No, it shows virtues are context-sensitive but *real* dispositions within their relevant domains, guided by *phronesis* (practical wisdom)."
      *   **Follow-Up:** Doesn't this risk making virtue ethics descriptively empty? If a "virtue" only manifests predictably within a narrow, predefined context *you* specify after the fact, how is it meaningfully different from just saying "people act consistently *in highly similar situations*"? Where's the *internal*, cross-situational stability virtue ethics promises?

  3.  **The Phronimos: Elite Ideal or Universal Goal?** Aristotle's *phronimos* (the practically wise person of stable virtue) – was this ever intended as a realistic model for most people, or was it always an aspirational, perhaps even *rare*, ideal? If the latter, doesn't this make virtue ethics less a practical guide for human flourishing and more an unattainable benchmark that inadvertently *supports* the situationist view of widespread character frailty?
      *   *Likely Dodge/Response:* "It's an ideal, but progress towards it *is* possible and constitutes flourishing for all; we don't need perfection."
      *   **Follow-Up:** But doesn't the *rarity* implied by the ideal, coupled with the empirical evidence of widespread situational influence (like Milgram/Asch), suggest that for the vast majority, achieving even *reliable* cross-situational virtue (not perfection) is exceptionally difficult? Doesn't this leave virtue ethics describing a peak few reach, while situationism describes the valley most inhabit?

  4.  **Habituation vs. Situational Overwhelm:** Virtue is acquired through habituation. But situationist experiments (like Milgram) show how powerful, novel, or authority-laden situations can instantly *overwrite* a lifetime of presumed habituation ("I'm not cruel") for ordinary people. Doesn't this suggest situational power can easily *trump* habituated disposition, making habituation fragile in the face of unexpected pressure?
      *   *Likely Dodge/Response:* "Those are extreme, artificially constructed situations. Habituation prepares us for *normal* moral challenges."
      *   **Follow-Up:** But isn't the *point* of virtue ethics that it should provide resilience *especially* under pressure or in morally ambiguous terrain? If habituation only works for predictable, "normal" challenges, how does it differ from simple routine? And how do we define "normal" in a complex world full of novel pressures?

  5.  **The Predictive Power Problem:** A core situationist critique is that trait attributions (like virtues) have weak *predictive* power across different situations. If virtue ethics claims virtues are real, stable dispositions, shouldn't they *reliably predict* behavior better than situational factors? Does the empirical record support this predictive power?
      *   *Likely Dodge/Response:* "Prediction is hard; virtues interact complexly with situations via *phronesis*. It's about understanding *why* someone acted, not simplistic prediction."
      *   **Follow-Up:** Doesn't shifting the focus solely to *post-hoc* explanation ("the unvirtuous person lacked phronesis in *that* situation") risk making virtue ethics unfalsifiable? If a virtue *fails* to manifest predictably, we can always say the situation wasn't rightly perceived or phronesis was lacking. How do we *test* the existence of the stable disposition?

  6.  **Virtue as Narrative vs. Reality:** Novelists *create* characters whose "virtues" feel real and stable *within the narrative arc*. But isn't this an artificial construction? Does the very power of fictional character consistency inadvertently highlight how *unlike* real human beings (as shown by situationism) this ideal of stable character is?
      *   *Likely Dodge/Response:* "Fiction reveals ideals and possibilities. Real virtue is messy, but the *telos* (purpose) and the struggle are real and observable."
      *   **Follow-Up:** But doesn't the situationist data suggest the "struggle" is often lost to situational forces the individual doesn't consciously control or even perceive? If the "messy reality" is predominantly situation-driven, isn't the novelistic ideal of character coherence more of a comforting myth than a reflection of how we actually function?

  7.  **The Cost of Cultivation:** If virtues require intense, lifelong habituation and cultivation to become even *somewhat* reliable (and even then, vulnerable to situational overwhelm), doesn't this make the virtue ethics project incredibly demanding? Does this high cost, contrasted with the relative ease with which situations derail us, make it a plausible model for human ethics *en masse*?
      *   *Likely Dodge/Response:* "Flourishing *is* demanding. The cost is the point – it's what gives virtue its value."
      *   **Follow-Up:** Given the empirical evidence of how readily situations derail even the well-intentioned, isn't there a risk that framing virtue as this incredibly demanding, often fragile achievement could be morally *demoralizing*? Does it set most people up to see themselves as failing by an impossible standard?

  8.  **Beyond "Moral Exemplars":** Virtue ethics often points to moral exemplars (Socrates, Gandhi, MLK) as proof stable virtue exists. But doesn't selecting rare exemplars who *withstood* extreme situations (often at great cost) simply prove the *exception*, not the rule? Doesn't this inadvertently highlight how *uncommon* such stable virtue is, aligning more with the situationist view of widespread frailty?
      *   *Likely Dodge/Response:* "Exemplars show what's possible and inspire. We learn from their phronesis, not just their outcomes."
      *   **Follow-Up:** But if exemplars are defined precisely by their *atypical* resistance to situational pressures that overwhelm most people, doesn't using them as proof of the *general* reality of stable character traits commit a selection bias? Aren't they outliers proving the situational rule for the majority?

  9.  **Virtue's Situational Blind Spot:** Does the virtue ethics emphasis on the agent's internal state (dispositions, intentions, phronesis) risk underestimating or even *ignoring* the profound, often non-conscious, power of situational architecture (roles, norms, authority, anonymity, hurry) revealed by social psychology? Does it have the conceptual tools to adequately account for *how* situations work on us?
      *   *Likely Dodge/Response:* "Phronesis *includes* situational perception and assessment. The virtuous person reads the situation rightly."
      *   **Follow-Up:** But studies like Asch's conformity or the Stanford Prison Experiment show how situations can distort perception *itself*. If the situation can corrupt the very *phronesis* needed to assess it, doesn't this create a vicious circle that virtue ethics struggles to address? How does one cultivate phronesis to see through situations designed to blind us?

  10. **A Truce or a Defeat?:** Could the most defensible version of virtue ethics post-situationism simply be this: virtues are *aspirational habits we strive for*, knowing they will *often* be fragmented and situationally contingent, and that understanding situational power is *part* of practical wisdom? Isn't this effectively incorporating the situationist insight and abandoning the strong claim of robust, cross-situational *character*?
      *   *Likely Dodge/Response:* "No! It's about integrating situational awareness *into* the cultivation of stable, but not rigid, dispositions. Virtue is dynamic, not defeated."
      *   **Follow-Up:** But if "stable" now means "predictable only within carefully defined local contexts and highly dependent on situational management," and "dynamic" means "highly susceptible to disruption by novel or powerful situations," haven't you conceded the core situationist point about the *primary* role of the situation? What substantive content remains for "character" doing the heavy lifting?

  **Key Tactics Embedded:**

  *   **Empirical Anchoring:** Grounding questions in specific, famous studies (Good Samaritan, Milgram, Asch).
  *   **Highlighting Tensions:** Focusing on the clash between the *ideal* of stability and the *reality* of fragility shown by data.
  *   **Consequence Probing:** Asking about the *implications* of defenses (e.g., making virtue elitist, unfalsifiable, or descriptively weak).
  *   **"Yes, But..." Follow-Ups:** Anticipating standard virtue ethics rebuttals and pushing further to expose potential weaknesses or concessions within them.
  *   **Novelist Angle:** Using the character creation question (#6) to bridge the worlds.
  *   **Forcing Clarification:** Asking if a defense fundamentally changes the original claim (#2, #10).

  **Delivery Tip:** Frame these collaboratively: "This tension between the ideal and the data really intrigues me as a writer trying to create believable characters... Could we press on that point about the Good Samaritan study?" This keeps it engaging, not adversarial. Good luck! This sounds like a fascinating discussion.
