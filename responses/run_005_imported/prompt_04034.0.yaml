  So Roko's basilisk is doing the rounds on my timeline again (it never really dies, does it) and I want to write something that goes past the usual "relax, it's just Pascal's wager for robots" dismissal. From what I understand, the whole scenario only gets off the ground if you buy into the LessWrong-style "timeless" or "updateless" decision theory, where an agent can be moved by acausal reasoning about what a future AI would have precommitted to punish. But isn't the whole point of theories like that (functional decision theory, etc) that a well-built rational agent should refuse to ever pay out to blackmail, acausal included, since being the type of agent that never pays is precisely what keeps you from being targeted in the first place? Can you walk me through the most important implications of that blackmail-resistance property for whether the basilisk actually holds together on its own terms, and wether it's something any of us should actually lose sleep over?
