  **Justifications:**  
  - **Move 1 (Score 0):** Marcus correctly describes Quine's thesis but overapplies it. While Quine *does* argue for radical indeterminacy below the sentence level, this is a philosophical claim about *ultimate justification*, not practical translation. BLEU metrics operate effectively as engineering heuristics (comparing surface forms) without claiming metaphysical "ground truth." Marcus conflates philosophical indeterminacy with practical futility.  
  - **Move 2 (Score 1):** Elena correctly notes that *practical* ambiguity resolution works in real-world contexts. Her "detached rabbit foot" example refutes Marcus's oversimplified claim that *no* evidence distinguishes translations. However, she underappreciates Quine's deeper point: follow-up questions still rely on interpreting *new* native responses, which themselves face indeterminacy (Move 3).  
  - **Move 3 (Score 2):** Marcus accurately defends Quine's core argument. Indeterminacy isn't about *difficulty* but *in-principle underdetermination*: for any finite evidence (including follow-ups), infinitely many translation manuals fit all data while diverging on untested cases. Elena's empirical approach addresses *epistemic* uncertainty, not Quine's *metaphysical* claim.  
  - **Move 4 (Score 2):** Elena correctly identifies Marcus's hidden premise (verificationism: "no evidence → no fact"). Her physics analogy is apt (e.g., Newtonian vs. GR in a sealed lab). Quine *does* implicitly rely on verificationism, which many realists reject. Marcus's conclusion requires this contested philosophical commitment.

  **What Both Are Missing:**  
  1. **Distinct Levels of Analysis:**  
     - Quine's thesis targets *metaphysical grounding* of meaning (what *makes* a translation correct).  
     - MT evaluation addresses *purpose-driven utility* (e.g., "Does this output serve an API user's need?").  
     BLEU's limitations stem from oversimplifying *human* preferences, not Quinean indeterminacy.

  2. **The Reference Translation's Role:**  
     Human references aren't "ground truths" but *consensus proxies* for communicative intent. Multireference BLEU (standard in MT) mitigates single-reference bias by acknowledging variability in valid translations—addressing Elena's practicality without requiring Quinean resolution.

  3. **Operational vs. Ontological:**  
     Marcus confuses BLEU's *operational* success (correlating moderately with human judgments) with claims about ontological "correctness." Metrics can be useful without being philosophically privileged.

  4. **Quine's Actual Target:**  
     Quine challenges the *reification* of meanings (e.g., "rabbit" as a fixed entity), not translation's practical feasibility. MT systems don't deal with "meanings" but statistical patterns in observable text—partially sidestepping his argument.

  **Key Insight:** The debate conflates *translation indeterminacy* (a philosophical challenge to meaning) with *translation ambiguity* (a resolvable practical problem). For MT evaluation, the real issue isn't Quine but whether references capture *likely human renditions*—a testable empirical question unrelated to "gavagai's" metaphysical status.
