  ## The Markov Blanket's Burden: Adjudicating Internalism and Embodiment in Predictive Processing

  The dispute between Jakob Hohwy’s internalist interpretation of the Free Energy Principle (FEP) and Predictive Processing (PP), and Andy Clark’s embodied/enactive challenge, strikes at the heart of how we conceptualize the mind. While the FEP formalism provides a powerful unifying framework, its implications for the metaphysics of mind remain fiercely contested. After weighing the strongest arguments on both sides, I argue that **while the Markov blanket formalism cannot inherently bear the weight of Hohwy’s strong internalism, active inference fundamentally shifts the internalism/externalism calculus decisively toward an embodied perspective, revealing the internalist reading as an unnecessary and restrictive gloss on the formalism.**

  ### (a) Can the Markov Blanket Bear Metaphysical Weight?

  *   **Hohwy’s Internalist Claim:** Hohwy contends the Markov blanket (MB) is not merely a statistical convenience but a *constitutive boundary*. The MB formally separates the internal states (system) from external states (world) and sensory/active states (interface). Crucially, the system only ever has access to sensory states (effects) and must *infer* the hidden external causes. The brain’s model is self-evidencing – it exists to minimize surprise about *its own sensory states*, not to directly mirror the world. This, Hohwy argues, necessitates an internalist view: the mind *is* the internal model enclosed by the MB, forever locked in an inferential bubble. The MB, on this view, maps directly onto the skull/skin boundary. The formalism’s strength lies in precisely defining this boundary and the inferential isolation it entails.
  *   **Clark’s Embodied Counter:** Clark argues Hohwy over-interprets a statistical tool. The MB is a device for defining conditional independencies within a probabilistic model. Its purpose is to make tractable the problem of inference by defining what states shield internal states from external states. Crucially, *nothing in the formalism dictates what physical substrate constitutes the MB*. It could, in principle, encompass parts of the body, tools, or even social structures, as long as the statistical dependencies hold. Insisting the MB *must* be the skull is adding a metaphysical commitment not required by the math. The formalism is *compatible* with internalism but does not *demand* it.

  **Verdict on (a):** **Clark is correct.** The Markov blanket formalism is fundamentally a tool for managing statistical dependencies and complexity. It defines a functional separation, not a necessary ontological one. While it perfectly models the brain-in-a-vat scenario Hohwy emphasizes, it equally models an organism actively engaged with its environment where sensory states are reliably generated *by* action. The formalism *allows* an internalist interpretation (MB = skull) but does not *entail* it. Hohwy places a metaphysical weight on the MB – the claim that it defines the *essential boundary of the mind* – that the formalism itself does not support. The MB defines a boundary for *a particular model*, not necessarily *the mind as such*. To claim the MB *is* the mind's boundary requires additional, non-formal arguments.

  ### (b) Does Active Inference Shift the Calculus?

  *   **Hohwy’s Response to Active Inference:** Hohwy concedes action changes *how* prediction error is minimized but maintains it doesn't alter the *fundamental ontology*. Action, he argues, is still driven by internal predictions (of desired proprioceptive states or sensory consequences). The point of action is to make sensory input conform to internal predictions, thereby minimizing surprise *internally*. The MB boundary remains intact; action is merely the means by which the internal system manipulates its sensory input channel. The system is still fundamentally self-evidencing within its boundary. Action is inference "all the way out," but the locus of control and the model remains resolutely internal.
  *   **Clark’s Embodied Leverage:** Clark counters that active inference fundamentally reconfigures the relationship between organism and world. Minimizing prediction error isn't just passive perception *or* internal belief updating; it's *orchestrating action to sample the world in ways that fulfill predictions*. This makes the body and environment *constitutive* parts of the inference process:
      1.  **Action as Perception:** Resolving prediction error by moving your eyes, hands, or whole body makes sensorimotor contingencies and embodied skills fundamental to perceiving. Perception isn't just *in* the brain; it's *for* and *through* action.
      2.  **The Shifting Blanket:** During skilful action, the functional boundary defined by statistical dependencies *can* extend. When using a tool proficiently (e.g., a blind person's cane, a surgeon's scalpel), the tool's properties become transparently incorporated. Sensory predictions and motor commands factor in the tool's dynamics. The MB, understood statistically, now potentially encompasses the tool, as the internal states become statistically shielded from the world *via* the tool. The "interface" (active/sensory states) extends.
      3.  **World as Partner:** The environment isn't just a passive source of surprise; it's actively structured (through niche construction) to be predictable and actionable. Action leverages reliable environmental structure, making external resources part of the cognitive loop. The brain doesn't just model the world; it *enacts* a world it can successfully predict through action.

  **Verdict on (b):** **Active inference decisively tips the balance toward embodiment and against strong internalism.** Hohwy is right that internal predictions drive action. However, Clark demonstrates that this process fundamentally *entangles* the internal with the external in a way belief-updating alone does not.

  1.  **Action Dissolves the Purity of the Internal:** Minimizing surprise via action means the "internal" model's success is *directly dependent* on the reliable coupling of bodily dynamics and environmental affordances. The model isn't self-sufficient; it's co-dependent with the body-world system. The MB, as a functional boundary, becomes dynamically defined by the *current action-perception cycle*, not a fixed anatomical shell. When acting skillfully with a tool, the relevant statistical dependencies *include* the tool.
  2.  **Cognitive Offloading Becomes Integral:** Active inference makes exploiting environmental structure (like arranging notes, using a calculator, or gesturing) not a mere external aid, but a primary strategy for minimizing prediction error efficiently. This is cognition leveraging the world *as part of its own process*. The FEP logic encourages this offloading – it's often the most efficient way to minimize long-term surprise. A theory that *endorses* such deep integration as a core mechanism struggles to maintain a strict internalist boundary.
  3.  **Formal Equivalence Undermines Internalist Privilege:** The FEP treats perception and action as formally equivalent ways of minimizing prediction error (gradient descent on free energy). Privileging internal belief updating as the "core" cognitive process, while demoting action to a mere input-manipulator, is an asymmetry *not* found in the formalism itself. Active inference forces a truly parity-based view.

  ### Conclusion: Embodiment as the Natural Reading

  The Markov blanket formalism, in isolation, is metaphysically flexible. It *can* model a solipsistic brain. However, **when the full implications of the Free Energy Principle – particularly the centrality of active inference – are taken seriously, the internalist interpretation becomes strained and requires imposing an external constraint (the skull boundary) not demanded by the math.** Active inference reveals that cognition, under the FEP, is fundamentally a dynamic, embodied engagement with the world. Minimizing prediction error is achieved *through* and *by means of* bodily action and environmental exploitation. The statistical boundary defined by the Markov blanket shifts and extends with skillful action, encompassing tools and reliable environmental structures.

  Therefore, while Hohwy highlights the crucial inferential isolation formalized by the MB, he oversteps by reifying it as a metaphysically necessary skull-boundary. Clark, by embracing the transformative role of action, provides the more coherent and less restrictive interpretation of the formalism's implications. **The Free Energy Principle and Predictive Processing, especially through active inference, imply that cognition is fundamentally embodied and embedded. The mind is not a bounded internal model merely receiving input and sending output commands; it is an active, extended process of minimizing surprise through continuous, dynamic interaction with the body and the world.** The internalist gloss, while highlighting the inferential challenge, ultimately obscures the deeply interactive and extended nature of cognition revealed by the full predictive processing framework. The formalism, when fully deployed, leans inherently toward embodiment.
