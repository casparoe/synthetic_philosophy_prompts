  Eleanor knows Cicero inside out, so a straightforward recap of Cato's arguments (like old age having its own occupations, authority compensating for lost strength, or life as a well-composed play) would feel tired and unoriginal to her. Plus, she's a materialist who rejects Cicero's afterlife consolation, so that's off-limits. 

