  Hmm... Eleanor's fear isn't about idleness but losing her *arena*—the classroom, debates, mentorship. Cato's farm wasn't just leisure; it was purposeful work scaled to age. For Eleanor, retirement might feel like exile from her "Senate." So the key is reframing withdrawal not as loss but as strategic repositioning. 

  Cato’s arguments to unpack:
  1. **Authority through long practice**: True, but academic authority relies on institutional validation. How does it translate when the title "professor" is shed? 
  2. **Composing life like a play**: Tricky! Academics often see careers as endless research, not art with intentional closure. 
  3. **Occupations proper to age**: Roman *otium* (leisure) was productive. Modern retirement? Can feel like a void. 

  Modern equivalents could be:
  - **Authority → Influence**: Without a podium, her expertise shifts to informal guidance (letters, conversations, legacy projects). 
  - **Strength → Depth**: Less energy for teaching, but more for sustained thinking/writing. 
  - **"Play’s end" → Curation**: Not stopping but consciously shaping her legacy (archives, memoirs). 

