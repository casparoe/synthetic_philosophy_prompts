answer: |-
  Here are eight targeted interview questions (plus follow-ups) designed to press the specific commitments of Subject-Sensitive Invariantism (SSI) and its displacement claim against contextualism, drawing on your key concerns:

  1.  **Core Displacement Challenge:**
      *   **Question:** "You argue SSI should *displace* contextualism, not just compete with it. Contextualists locate the shifting intuitions in cases like the bank in the *semantics* of 'knows' – the word's standard changes with the speaker's context. SSI locates it in the *subject's practical situation*. Why is it *more theoretically virtuous* to explain the shifting intuitions via a complex metaphysical shift in the knowledge relation itself (dependent on the subject's stakes), rather than via a simpler semantic shift in the meaning of the word used to *ascribe* that relation?"
      *   *Likely Answer:* Appeal to linguistic neutrality ("We say 'S knows' regardless of ascriber stakes"), simplicity in unifying subject/ascriber intuitions under one mechanism, or metaphysical priority (knowledge is a state of the subject).
      *   **Follow-up:** "But doesn't SSI create its *own* complexity? It requires positing that the *very same body of evidence* can constitute knowledge relative to low-stakes context S but fail to constitute knowledge relative to high-stakes context S' *for the same subject at the same time*, purely based on practical factors metaphysically external to the evidence. Isn't positing a semantic ambiguity for 'knows' a less metaphysically loaded way to explain the linguistic data?"

  2.  **The Unaware High-Stakes Surgeon (Jessica Brown-style Objection):**
      *   **Question:** "Consider a surgeon who performs a routine, low-risk appendectomy. She has excellent evidence, based on scans and symptoms, that it's appendicitis. Unbeknownst to her, the patient has a rare, fatal allergy to the anesthetic she always uses. The stakes are objectively sky-high, but she has no clue. According to SSI, does she *know* it's appendicitis before surgery? If not, how is this different from simply *stipulating* that knowledge requires meeting the *actual* practical demands of the situation, regardless of the subject's awareness?"
      *   *Likely Answer:* Argue that knowledge *does* depend on the *actual* practical situation/stakes, not the subject's *belief* about them. The surgeon doesn't know because the cost of being wrong is catastrophic, even if she's unaware.
      *   **Follow-up:** "But this seems deeply counterintuitive. Her evidence, reasoning, and confidence are identical to a case where there *is* no hidden allergy. Intuitively, she *does* know it's appendicitis. If SSI forces us to deny she knows here, doesn't that show SSI is mislocating the source of our shifting intuitions? Isn't our intuition about the *aware* high-stakes surgeon driven by *her* perspective, not hidden facts?"

  3.  **Moral Encroachment Boundary Defense:**
      *   **Question:** "Some philosophers (e.g., Basu, Schroeder, Moss) argue that if practical stakes can encroach on knowledge, so can *moral* stakes – particularly regarding when it's permissible to rely on statistical generalizations involving race or gender. If SSI accepts pragmatic encroachment, what *principled* reason is there to reject the extension to *moral* encroachment? Why do practical costs get to gatekeep knowledge, but moral costs of relying on beliefs (e.g., perpetuating harmful stereotypes) do not?"
      *   *Likely Answer:* Distinguish between stakes affecting the *epistemic cost* of being wrong (core to SSI's action/knowledge link) versus stakes involving the *moral wrongness* of acting/believing a certain way (potentially independent of the epistemic status).
      *   **Follow-up:** "But isn't the link often argued to be *via* action? Fantl and McGrath, for instance, link knowledge to *actionability*. If acting on a racial generalization in a high-stakes social context (e.g., hiring, policing) could cause significant moral harm, doesn't SSI's core principle suggest that *acting* on that belief requires a higher epistemic standard, implying the agent *lacks knowledge* precisely because of the moral stakes? Doesn't SSI naturally *invite* moral encroachment?"

  4.  **The "Flickering Knowledge" Objection (Salience without Evidence Change):**
      *   **Question:** "A common objection to SSI is the 'flickering knowledge' problem. Imagine Hannah has ample evidence the bank is open Saturday (past experience, website). She's in a low-stakes situation. She *knows*. Then, her partner merely *says*, 'What if we get it wrong? We'd lose the house!' – instantly making the stakes salient and high. According to SSI, does her knowledge instantly vanish? If so, how is this not absurd? Her *evidence* hasn't changed a bit, only her *awareness* of potential consequences."
      *   *Likely Answer:* Argue that knowledge *can* be lost purely due to a change in practical situation (salience making the stakes *operative*), even without evidence change. Emphasize the tight link between knowledge and rational action (Fantl & McGrath).
      *   **Follow-up:** "But doesn't this make knowledge incredibly fragile and dependent on fleeting psychological states or external reminders, divorced from the actual quality of evidence? If mere *mention* of dire consequences can destroy knowledge without any new doubt about the evidence itself, does SSI reduce knowledge to a kind of psychological confidence calibrated to stakes, rather than a robust relation to the truth?"

  5.  **Explaining Ascriber Context Shifts:**
      *   **Question:** "Contextualism elegantly explains why an *ascriber* in a high-stakes context might deny 'S knows' even when S is in a low-stakes context: they're using a higher standard. How does SSI explain this same phenomenon? If knowledge is a fact about the *subject's* situation, why would an ascriber's *own* context affect the *truth* of their claim about S's knowledge?"
      *   *Likely Answer:* Argue that the ascriber is either (a) mistakenly applying their *own* high standards to S, or (b) describing S as not satisfying the standards *relevant for the ascriber's own potential actions*.
      *   **Follow-up:** "But doesn't option (a) make frequent mistakes in ordinary language? And doesn't option (b) essentially concede that the *word* 'knows' *is* context-sensitive (to the ascriber's practical needs), precisely what contextualism claims? How is this not a covert concession to contextualism?"

  6.  **SSI vs. WAM (Warranted Assertability Maneuvers):**
      *   **Question:** "DeRose and other contextualists often use Warranted Assertability Maneuvers (WAMs) to explain away intuitions that seem to support invariantism. They argue we mistakenly deny 'S knows' in high-stakes ascriptions because it would be *unwarranted to assert it* (misleading, risky), not because it's false. How does your argument for SSI *outperform* or *undercut* the contextualist's WAM explanations for the very same data?"
      *   *Likely Answer:* Argue WAMs are ad hoc, that SSI provides a more unified explanation grounded in the nature of knowledge itself (linking it to action), or that the data (like the unaware surgeon) *can't* be explained by WAMs.
      *   **Follow-Up:** "But contextualists counter that SSI's explanation of ascriber shifts *is* essentially a WAM (saying ascribers are describing warranted assertability for their context, not truth). If both theories ultimately rely on pragmatic explanations *somewhere*, why is SSI's metaphysical claim about the knowledge relation itself more justified than contextualism's semantic claim?"

  7.  **The Threshold Problem & Comparability:**
      *   **Question:** "SSI requires that there's some threshold of evidence/certainty required for knowledge, and this threshold *shifts* with practical stakes. But how is this threshold defined? Is it comparable across different stakes contexts? Can we meaningfully say that the evidence required for knowledge *in a low-stakes context* is *less* than that required *in a high-stakes context*, or are these just incommensurable standards applied in different 'modes'?"
      *   *Likely Answer:* Argue that the threshold is defined by what's sufficient for rational action in that context; it's comparable in principle (more evidence is needed when stakes are higher for the same proposition).
      *   **Follow-up:** "But doesn't this lead to counterintuitive results? Imagine two agents, A (low-stakes) and B (high-stakes), both contemplating P. A has evidence just strong enough to know P in her context. B has *significantly better* evidence than A, but still not enough to know P in *her* (high-stakes) context. Does SSI really commit us to saying that A knows P while B, with vastly superior evidence, does *not*? How is that epistemically coherent?"

  8.  **Displacement vs. Coexistence: Why the Aggression?**
      *   **Question:** "Many philosophers see contextualism and SSI as rival but potentially compatible explanations operating at different levels (semantics vs. metaphysics). Why do you argue SSI should *displace* contextualism entirely? What specific inadequacy in contextualism, beyond SSI merely offering a different explanation, necessitates its outright rejection as an account of the bank-case intuitions?"
      *   *Likely Answer:* Argue that contextualism misdiagnoses the *source* of the intuition shift (it's the subject's stakes, not the word's meaning), that it cannot handle cases like the unaware surgeon, or that it fragments the concept of knowledge unnecessarily.
      *   **Follow-up:** "If SSI is primarily a metaphysical thesis about the nature of knowledge (dependent on practical factors), and contextualism is a semantic thesis about the word 'knows', why can't both be true? Couldn't 'knows' semantically denote a relation that is itself, metaphysically, stakes-sensitive? Isn't your displacement claim perhaps an overreach?"

  **Key Interview Tips:**

  *   **Listen & Adapt:** These follow-ups are predictions. *Listen* carefully to her actual answers. If she surprises you, pivot. Don't rigidly stick to the script if the conversation flows differently.
  *   **Clarify & Paraphrase:** If an answer is complex or jargony, ask her to rephrase for the audience or paraphrase it back to her for confirmation ("So, if I understand, you're saying that...").
  *   **Press Gently but Firmly:** Your role is to challenge her position to elicit the best defense, not to "win." Use phrases like "Help me understand...", "How would you respond to the concern that...", "That seems to lead to [counterintuitive consequence], is that acceptable?"
  *   **Bridge for Audience:** After a technical exchange, briefly summarize the core disagreement or why it matters before moving on. ("So the heart of the debate here is whether the context-sensitivity is in the language or in the world itself...")
  *   **Use the Surgeon Hook:** Briefly mention your friend's case when asking Q2 or Q4 to ground it and show its personal relevance.

  These questions go straight to the heart of SSI's distinctive claims, its vulnerabilities, and its rivalry with contextualism, pushing beyond a simple restatement of pragmatic encroachment. Good luck with the interview!
