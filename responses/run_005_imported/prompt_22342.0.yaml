  Okay, let's tackle this Hume problem step by step. The user is a PhD student struggling with Hume's regress argument about promises in the Treatise. They understand the big picture but get lost in the footnote's logic. 

  First, I need to reconstruct the regress clearly. Hume's core move is showing that "willing an obligation" leads to infinite recursion because each act of willing requires another obligation to ground it. The footnote is indeed a rationalist version of his sentimentalist argument - a backup for those who think morality comes from reason. 

  Hume's chain goes: 
  New obligation → requires new relations → requires new volition → which aims at new obligation → and so on. The key absurdity is that the initial volition lacks an object until the obligation exists, but the obligation can't exist without the volition. It's not a stable loop because no first term gets established.

  For the modern relevance part: While Hume's convention-based view is foundational, contemporary philosophers have moved beyond it. Scanlon's expectation-based theory and Shiffrin's intrinsic wrongness approach offer alternatives, but Hume's critique of "natural" obligation remains influential. 

