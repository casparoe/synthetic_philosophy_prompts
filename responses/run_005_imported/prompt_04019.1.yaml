prompt: |-
  Write a joke that plays on a genuine epistemic difference between the lottery paradox and the preface paradox, rather than on the superficial fact that both are cases in which a set of individually justified beliefs turns out to be jointly inconsistent. The punchline should only really land for someone who can say what actually distinguishes the two cases, rather than for someone who has merely heard that philosophers tend to mention them in the same breath.
