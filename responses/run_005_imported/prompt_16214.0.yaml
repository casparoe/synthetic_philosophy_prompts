  So I had a two-hour argument with my friend last night that's still bugging me. We were talking about Frege's 1924 diary -- the antisemitic, anti-democratic stuff, wanting jews' political rights curtailed, all of it. My friend's take is that this isn't just a moral stain seperate from the logic -- its actually the same move he made his whole career. His big philosophical thing was fighting 'psychologism,' insisting logical laws are objective and don't answer to any individual mind's say-so, and she says that's structurally the exact same move as denying individuals (jews especially, in his eyes) a say in what counts as politically true -- anti-individualism pointed at propositions instead of people, so of course the same guy produced both. I couldn't push back except to say 'that feels like a stretch' without being able to say why. Is there an actual flaw in that argument, or do Frege scholars genuinely think the logic and the politics are that tightly connected?
