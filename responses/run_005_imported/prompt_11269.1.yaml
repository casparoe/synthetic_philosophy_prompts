  Okay, let me tackle this user's problem. They're stuck on how their brother-in-law's non-cognitivist view of morality—where moral statements are just emotional expressions like cheers or boos—can handle moral conditionals. The example given is an argument that uses a conditional statement with a moral premise, which seems to function logically just like a factual conditional. 

  First, I need to recall the core of non-cognitivism. Emotivism, like Ayer's, says moral judgments are expressions of emotion, not truth-apt statements. So "cheating is wrong" is like booing, not stating a fact. But the user's puzzle is about embedding such expressions in logical structures, especially conditionals. 

  The user's example argument is modus ponens: If owning up is right, then telling the boss is right. Owning up is right. Therefore, telling the boss is right. This feels logically valid, similar to "If it rains, the sidewalk is wet. It's raining. So sidewalk is wet." But if the moral premise is just a cheer, how can it be part of a conditional? Conditionals rely on truth values, but cheers aren't true or false. That's the inconsistency the user is pointing out.

  I remember the Frege-Geach problem is exactly this issue. It challenges non-cognitivism by showing that moral terms in embedded contexts (like conditionals) don't function as mere expressions. In the conditional premise, no one is actually cheering; it's a hypothetical. Yet the logic still works. So how can non-cognitivism account for this?

  Possible solutions? Blackburn's quasi-realism tries to explain how moral language can mimic truth-apt discourse even without objective truths. He uses higher-order attitudes: accepting the conditional expresses approval of maintaining consistent attitudes. For example, accepting "If owning up is right, then telling the boss is right" means approving of consistency between endorsing owning up and endorsing telling the boss. 

  But the user might find this complicated. Explaining it simply is key. Maybe say that even though moral statements express attitudes, we use logic to keep our attitudes consistent. So the argument isn't about truth but about coherent commitments. 

  Alternatively, hybrid expressivism or inferentialist views might help. Hybrid theories allow that moral statements have both expressive and descriptive content. In conditionals, the descriptive part carries the logical weight. Inferentialism focuses on the role in reasoning rather than truth values. 

  The user's deeper need is to resolve this tension before the next family gathering. They want a clear explanation to present to the brother-in-law. So simplicity is crucial. Highlighting that non-cognitivism struggles with logic but has responses like quasi-realism. However, pointing out that it's a recognized problem (Frege-Geach) shows it's a legitimate challenge, not just a wrinkle. 

  Also, the user teaches ethics, so they might appreciate referencing academic solutions but need a digestible version. Emphasize that logical validity in ethics relies on consistency of attitudes rather than truth. The brother-in-law's argument works because it aligns attitudes consistently, not because moral facts exist. 

  In conclusion, yes, it's a problem for pure emotivism, but developed theories like quasi-realism address it. The explanation should focus on consistency of attitudes and how moral language functions in logic beyond simple expressions.
answer: |-
  That's an **excellent** observation, and you've perfectly identified one of the most famous and persistent challenges to simple non-cognitivist views like emotivism (the "cheering/booing" theory) – the **Frege-Geach Problem** (or the Embedding Problem). Your intuition that there's a real puzzle here is spot on.

  **The Problem Laid Bare:**

  1.  **Core Claim of Non-Cognitivism:** Moral judgments ("X is wrong," "Y is right") are not statements of fact; they are expressions of non-cognitive attitudes (approval/disapproval, desire, commitment) – essentially, emotional prescriptives like cheers or boos. They lack truth-value.
  2.  **The Conditional Puzzle:** Your brother-in-law used a moral claim *inside* the antecedent of a conditional ("*If* owning up... is the right thing to do..."). Crucially:
      *   When asserting the conditional itself ("If P then Q"), he wasn't *expressing* approval of owning up (P). He was stating a *logical relationship*.
      *   When asserting the second premise ("P is the right thing to do"), he *was* expressing approval of owning up.
      *   The conclusion ("Q is the right thing to do") followed logically, and *he* (and everyone else) felt the force of that logical entailment, compelling assent to the conclusion *as if* it were a factual inference.
  3.  **The Contradiction:** How can something that is *merely* an expression of emotion (a cheer/boo) function *logically* within a complex sentence like a conditional? How can it be the *subject* of logical operators (like "if...then") that seem to require truth-apt components? How can an expression of attitude be *logically entailed* by premises? The rain/sidewalk argument works because all parts are truth-apt. If "P is right" isn't truth-apt, how does the moral argument work in the same way?

  **Why is this a Problem for Simple Emotivism?**

  1.  **Loss of Logical Structure:** Simple emotivism struggles to explain the *meaning* of the conditional premise. What does "If owning up is right, then telling your boss is right" *mean* if "owning up is right" is just a cheer? Is it "If I cheer owning-up, then I cheer telling the boss"? But that seems to be a statement *about* my psychology, not the logical connection between the two *moral* propositions that everyone grasped at the table.
  2.  **Validity vs. Psychology:** Logical validity depends on the *form* of the argument, not the speaker's *current* psychological state. In the conditional premise, the speaker isn't *actually* cheering for owning-up; they are considering a *hypothetical* connection. Simple emotivism ties meaning too tightly to the expression occurring *at the moment of utterance*.
  3.  **Entailment:** How can a cheer (for P) *logically entail* another cheer (for Q)? Logic governs relations between propositions with truth-values. If P isn't truth-apt, how can it entail Q? The feeling of logical compulsion you all experienced suggests there's more going on than just sequential expressions of attitude.

  **So, Is it a Fatal Problem or Just a Wrinkle?**

  It's **definitely a serious problem** for the simplest "pure cheer/boo" versions of non-cognitivism. However, sophisticated non-cognitivists (like Simon Blackburn with *quasi-realism* and Allan Gibbard with *norm-expressivism*) have developed complex responses. It's not necessarily fatal, but it forces the view to become much more nuanced.

  **Clever Patches (The Solutions Sophisticated Non-Cognitivists Propose):**

  1.  **Higher-Order Attitudes (Blackburn's Quasi-Realism):** Accepting the conditional "If P is right, then Q is right" isn't expressing a simple attitude towards P or Q. It's expressing a *higher-order attitude* about the *relationship* between attitudes. Specifically:
      *   It expresses *approval of having a certain combination of attitudes*: approval of disapproving of not owning up *and* approving of disapproving of not telling the boss in this situation.
      *   It expresses *disapproval* of *combining* approval of owning up *with* disapproval of telling the boss in this case. It's a commitment to *consistency* in one's normative attitudes.
      *   The logical "tightness" comes from the *inconsistency* one feels if they accept the premises ("P is right" and "If P is right then Q is right") but reject the conclusion ("Q is right"). This inconsistency is *practical* (a clash of commitments) rather than *factual* (a clash of beliefs).
  2.  **Expressing Plans or Norms (Gibbard's Norm-Expressivism):** Moral judgments express acceptance of norms that govern planning and feeling. "P is right" expresses acceptance of a norm that prescribes P.
      *   The conditional "If P is right, then Q is right" expresses a *planning norm*: It's a norm about what to plan *if* you accept the norm prescribing P. It says: *Plan to accept the norm prescribing Q if you accept the norm prescribing P*.
      *   The argument works because accepting the premises involves accepting a plan that *requires* accepting the norm prescribing Q, given you accept the norm prescribing P. Denying Q while accepting both premises is a failure in planning consistency.
  3.  **Hybrid Theories:** Some theories propose that moral judgments *do* have a minimal descriptive content alongside their expressive force (e.g., "wrong" might express disapproval *and* describe the action as falling under a certain socially recognized category). In conditionals, the descriptive element might bear the logical load.

  **Explaining it to Your Brother-in-Law (The Thanksgiving Bonus):**

  Here’s a clean, hopefully persuasive way:

  "Hey [Brother-in-Law's Name], remember that argument you made to Sis about telling her boss? It was really solid logic: 'If owning up is right, then telling her boss is right; owning up *is* right; so telling her boss is right.' We all nodded because it felt exactly like a math proof or 'if it's raining, the sidewalk is wet.'

  "But here's the puzzle for the cheering/booing idea. When you said '*If* owning up is right...', you weren't actually *cheering* for owning up in that moment, right? You were just setting up a connection. And the *logic* of the 'if...then' part felt completely separate from cheering or booing – it was just about what follows from what.

  "If 'owning up is right' is *only* a cheer with no truth value, how can it plug into that logical 'if...then' machinery the same way a factual statement like 'it's raining' does? How can a cheer be the *reason* why another cheer logically *has* to follow? It seems like the 'right' in your argument was doing more than just expressing your feeling at that moment; it was playing a logical role that usually requires something truth-apt.

  "Sophisticated versions of your view (like Blackburn's 'quasi-realism') try to solve this by saying that when we use morals in logic, we're actually expressing higher-level commitments to being *consistent* in our attitudes. So your argument wasn't about facts, but about committing to booing *both* 'not owning up' *and* 'not telling the boss' in that situation, and recognizing that it would be inconsistent to do otherwise. The 'tightness' comes from avoiding that practical inconsistency in our commitments, not from discovering a moral fact.

  "So, while it's a really interesting challenge to the simple 'just cheering' picture, the best non-cognitivist thinkers *do* have ways to explain how moral arguments work logically by focusing on the consistency of our emotional commitments and plans. It just means the view is more complex than 'just booing'."

  **Conclusion:**

  Your observation **is a significant problem** for naive emotivism. It shows that moral language *functions* logically in ways that simple expressions of emotion cannot easily explain. Moral claims embedded in conditionals, negations, etc., seem to behave like truth-apt propositions participating in logical relations. This is the core of the Frege-Geach problem.

  However, **it's not necessarily a death knell** for non-cognitivism. Sophisticated versions (quasi-realism, expressivism) offer complex solutions by appealing to higher-order attitudes, planning commitments, or consistency in normative frameworks. These solutions try to preserve the core non-cognitive insight while explaining the logical behavior. Whether they *fully* succeed is still debated, but they show the view can be developed to address this powerful challenge. Your Thanksgiving dinner perfectly captured why metaethics remains a fascinating and contested field!
