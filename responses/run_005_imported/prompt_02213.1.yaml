   3. Smooth Ambiguity Model (Klibanoff, Marinacci & Mukerji, 2005)
   4. Variational Preferences (Maccheroni, Marinacci & Rustichini, 2006)

   Criteria:
   - Dynamic consistency: Choices made initially should be consistent with choices made at later stages, conditional on the information available.
   - Consequentialism: The evaluation of an act depends only on the outcomes that occur in the event that has been realized (i.e., conditional on the current information, future choices should not depend on what would have happened in unrealized events).
   - Without imposing extra structure: We are to avoid models that require additional assumptions (like specific belief structures) to achieve the desired properties.

