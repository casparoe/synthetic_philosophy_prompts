   In the literature, variational preferences are known to be dynamically consistent in a recursive setting without additional assumptions beyond the initial setup. The updating rule is defined by:

      V_t(ω)(f) = min_{P} [ E_P[ u(f) | F_t ](ω) + c_t(ω, P) ]

