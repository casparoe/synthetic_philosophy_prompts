   1. Choquet Expected Utility (CEU):
      - Uses a non-additive probability (capacity) to model ambiguity.
      - Updating rules: The most common is the Dempster-Shafer rule (full Bayes for capacities) but it leads to dynamic inconsistencies.
      - Alternative: The naive Bayesian updating (using the conditional capacity) is dynamically consistent but violates consequentialism (because it uses the whole capacity, including parts that are irrelevant to the conditioning event).
      - There is an updating rule (Eichberger, Grant, and Kelsey, 2007) that uses a generalization of Bayesian updating for capacities and can achieve dynamic consistency and consequentialism only under specific conditions (like convex capacities) but not generally.

   2. Maxmin Expected Utility (MEU):
      - Represents preferences by a set of priors and a utility function. The decision maker evaluates an act by the minimum expected utility over the set.
      - Updating: The natural approach is to update each prior in the set by Bayes' rule. This is called the full Bayesian updating (FBU).
      - However, FBU leads to dynamic inconsistency because the updated set of priors might become too large and the min operator changes arbitrarily.
      - Epstein and Schneider (2003) show that dynamic consistency can be achieved if the set of priors is rectangular (also called the product of marginals). Without such an assumption (which is extra structure), dynamic consistency fails.

   3. Smooth Ambiguity Model (KMM):
      - The decision maker has a second-order probability distribution over the set of priors and evaluates acts by taking an expectation (with respect to this second-order distribution) of a function of the expected utilities.
      - Updating: Update the second-order probability by Bayes' rule and then condition each prior. This seems straightforward.
