  Hmm... the user wants judgment on each move plus what both miss. Let me analyze step by step:

  For (1): Marco's fallacy charge isn't wrong per se, but oversimplifies. Nietzsche isn't doing naive "bad origins = bad now" - he's showing how resentment poisons the values themselves. The chemistry analogy fails because morality isn't neutral technique. 

  (2) Ada is stronger here. Nietzsche explicitly says he's doing psychology not logic. The "slave revolt" makes morality reactive - that's the critique, not logical fallacy. 

  (3) Marco has a point about evaluation though. If genealogy only describes, how can it condemn ascetic ideal? Ada needs to explain how description becomes evaluation. 

  (4) Ada's "undermining authority" is core to Nietzsche. Values presented as divine commands lose power when exposed as human inventions. But...

  (5) Marco nails the weakness: modern secular ethics don't claim divine origin. If compassion stands on consequentialist grounds, does genealogy touch it? 

