  Write me a dialogue between a committed Nozickian and a critic channeling G.A. Cohen, arguing it out in the stands right after the Wilt Chamberlain thought experiment (the move from D1 to D2) gets laid out -- I want something to hand my political phil seminar alongside the reading. Don't give me the usual "liberty upsets patterns, so any patterned distribution needs constant interference" followed by an egalitarian who just says thats unfair. Have the critic actually press the point that D1 was never just an unstructured pile of holdings -- it already has to specify what people are entitled to do with their shares -- so calling the move to D2 "free transfer" rather than "interference" might just be smuggling in full private property rights (say, via a joint-ownership or restricted-transfer setup) from the get-go. Then make the Nozickian really answer that, instead of just restating the thought experiment louder. Both sides need to be sharp and actually responding to each others points, not talking past one another -- neither one should fold. Eight to ten exchanges is plenty.
