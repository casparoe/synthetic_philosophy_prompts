  Okay, let me unpack this user's query. They had a late-night debate with their friend Jonas about metaethics, specifically emotivism. The user defended the idea that moral statements like "stealing is wrong" are just expressions of feeling, not factual claims. Jonas brought up the Frege-Geach problem as a major objection, mentioning that emotivism can't explain how moral terms work in unasserted contexts like conditionals. The user wants to understand this problem better and whether quasi-realist solutions (like Blackburn's or Gibbard's) can save their view without compromising its core.

  First, I need to ensure I grasp the Frege-Geach problem clearly. The issue is about compositional semantics: how the meaning of a word contributes to complex sentences. Emotivism explains simple assertions as expressions of attitude, but in conditionals like "If lying is wrong, then getting your brother to lie is wrong," the antecedent isn't asserted. So how does "lying is wrong" retain its meaning here? If it's just "boo," then the conditional might become "If boo lying, then boo getting brother to lie," which isn't logically valid. That's the crux.

  The user mentioned Blackburn and Gibbard. Blackburn's quasi-realism uses expressivist logic where attitudes can be embedded. He introduces higher-order attitudes. For example, in the conditional, you're expressing a higher-order attitude about combining attitudes. If you disapprove of lying, you must disapprove of getting someone to lie. But the user might wonder if this complicates the simple "boo" idea. Gibbard's norm-expressivism frames it in terms of planning: accepting a norm. The conditional becomes about planning to disapprove of both actions. The user needs to know if these solutions work or just delay the problem.

  The user's deeper needs: They want to maintain that moral claims are attitude-based, not factual, but also respond to Jonas's logical challenge. They might fear that admitting to quasi-realism means conceding to realism. So I should clarify that quasi-realism allows keeping the non-cognitivist core while accounting for logic. But they might have to accept that moral language can behave "as if" it's truth-apt, even without objective truths. The user's repeated "that's just your opinion" might need refinement—acknowledging that while moral claims express attitudes, they participate in rational discourse.

  Also, the user's scenario involves a casual debate, so the explanation must be accessible. Avoiding jargon where possible. Highlighting key points: why Frege-Geach is a problem, how quasi-realism addresses it, and what trade-offs exist. Emphasize that quasi-realism doesn't sink emotivism but sophisticates it. The user might need to give up the simplicity of "just boo" for a more nuanced view where expressions have logical structure. But they don't have to concede that moral facts exist independently.

  Potential pitfalls: The user might conflate validity with truth. Quasi-realism shows how arguments can be valid without truth-conditions. Also, distinguishing between minimal truth (warranted assertibility) and robust truth. The user can still say "that's just your opinion" but within a framework where opinions can clash rationally. 

  Lastly, the user’s identity seems philosophically inclined but not a specialist. They enjoy debates but got stuck on this objection. Providing a clear, step-by-step breakdown with relatable examples (like beer, siblings) will help. Ensuring they walk away understanding that their view isn't demolished but requires refinement, and they can still argue non-cognitivism effectively with quasi-realist tools.
answer: |-
  Okay, let's break down the Frege-Geach problem – it's *the* major hurdle for simple emotivism, and understanding how quasi-realism tackles it is crucial for your next round with Jonas. Grab a metaphorical beer, here's the deep dive:

  **1. Your Core View (Simple Emotivism):**
  *   "Stealing is wrong" = Expressing disapproval of stealing. ("Boo stealing!")
  *   It's *not* stating a fact about the world that can be true or false; it's venting an attitude.
  *   Hence, "That's just your opinion" is your go-to response.

  **2. The Frege-Geach Problem: The Hammer Blow**
  Jonas is spot-on about the core issue. It's about how words work in *different grammatical contexts*, especially in **unasserted positions** like:
  *   Conditionals: "**If lying is wrong**, then getting your little brother to lie is wrong."
  *   Questions: "**Is lying wrong**?"
  *   Belief reports: "Jonas believes **that lying is wrong**."
  *   Negations: "**Lying is not wrong** in this situation."

  **The Problem in Steps:**

  *   **a) Meaning Constancy:** For logic and language to work, the meaning of "lying is wrong" needs to be *the same* whether it's shouted assertively ("Lying is wrong!") or sitting quietly inside the "if" clause of a conditional.
  *   **b) Emotivist Meaning (Asserted):** When asserted alone, "Lying is wrong" means (on your view) "Boo lying!" – an expression of attitude.
  *   **c) Emotivist Meaning (Unasserted - The Problem):** What does "lying is wrong" mean inside the *if-clause* of "**If lying is wrong**, then..."?
      *   You're *not* currently expressing "Boo lying!" You're just *supposing* it hypothetically for the sake of the argument.
      *   What is this "thing" you're supposing? If it's *only* an expression of attitude ("Boo!"), how do you suppose an *expression*? How does "Boo!" fit into the logical structure?
  *   **d) Validity & Logic:** The argument "If lying is wrong, then getting your little brother to lie is wrong. Lying is wrong. Therefore, getting your little brother to lie is wrong." is clearly logically valid (Modus Ponens).
  *   **e) The Challenge for Emotivism:** How can simple emotivism explain *why* this argument is valid?
      *   If the first premise ("If lying is wrong...") *doesn't* contain a genuine proposition (a thing that can be true/false) in its antecedent, what is the logical connection?
      *   Translating naively: "**If [Boo lying!], then [Boo getting brother to lie!].** [Boo lying!]. Therefore, [Boo getting brother to lie!]." This makes no logical sense. "Boo!" isn't the right *kind* of thing to be the antecedent of a conditional or the premise of an argument. You can't have "If [an expression of feeling], then..." logically.
      *   **The Wall:** Simple emotivism seems unable to account for the *logical behavior* and *compositionality* (how meanings build complex sentences) of moral language. It struggles to explain how moral sentences can be embedded in logic, arguments, and unasserted contexts *without* changing their core meaning. If meaning changes, logic breaks.

  **3. Quasi-Realism: The Fix (Blackburn & Gibbard)**
  This is where Simon Blackburn (Projectivism/Expressivism) and Allan Gibbard (Norm-Expressivism) come in. They don't abandon the core non-cognitivist insight (that moral judgments fundamentally express conative states - attitudes, plans, commitments). Instead, they build a sophisticated framework to explain how moral language *mimics* realist talk and logic *without* positing objective moral facts.

  **How Quasi-Realism Tackles Frege-Geach (The Gist):**

  *   **Focus on States of Mind:** Instead of just "Boo!", they analyze the *complex state of mind* expressed by moral claims, especially in embedded contexts.
  *   **Higher-Order Attitudes (Blackburn):** The key is expressing attitudes *about* having other attitudes.
      *   **Simple Assertion:** "Lying is wrong" expresses disapproval of lying (D-lying).
      *   **The Conditional Premise ("If lying is wrong, then getting your brother to lie is wrong"):** This expresses a *higher-order attitude*. Crucially, it expresses **disapproval of *combining*** approval of lying *with* disapproval of getting your brother to lie.
          *   You're saying: "**Boo to anyone who both disapproves of lying *and* does *not* disapprove of getting their brother to lie!**" Or, "**Hooray for consistency between disapproving of lying and disapproving of getting your brother to lie!**"
      *   **The Logic Works:** When you then assert "Lying is wrong" (expressing D-lying), and you *also* hold the attitude expressed by the conditional (disapproving of the inconsistent combination), you are *committed* to disapproving of getting your brother to lie (D-brother-lie). If you don't, you hold an inconsistent set of attitudes that you yourself disapprove of! The validity of Modus Ponens is preserved *as a constraint on consistent attitudes*.
  *   **Planning States (Gibbard):** Gibbard frames it in terms of accepting norms or plans.
      *   "Lying is wrong" expresses acceptance of a norm that forbids lying.
      *   The conditional "If lying is wrong, then..." expresses a *plan* or *norm* about what to do *if* you accept the norm against lying. Specifically: "If you accept the norm forbidding lying, then you *must* accept the norm forbidding getting your brother to lie."
      *   Asserting the antecedent ("Lying is wrong") means you accept the norm against lying. Combined with your plan/norm expressed by the conditional, you are now committed to accepting the norm against getting your brother to lie. Again, logic is grounded in consistency of planning/norm-acceptance.
  *   **Minimal Truth & Quasi-Realism:** Both Blackburn and Gibbard develop a concept of "minimal" or "quasi" truth for moral claims.
      *   Saying "Stealing is wrong" is true *doesn't* mean it corresponds to an objective moral fact "out there."
      *   It means something like "We are warranted in asserting 'Stealing is wrong'" or "The judgment 'Stealing is wrong' is one we can defend within our practices of giving and asking for reasons, based on our shared sentiments/commitments/plans."
      *   This allows moral claims to *function* in logical contexts *as if* they were truth-apt, even though their *underlying metaphysics* is still non-cognitive (based on attitudes/plans).

  **4. Can You Still Say "That's Just Your Opinion"? (Implications & What You Give Up)**

  *   **The Fixes Work (Enough):** Yes, quasi-realism provides a sophisticated, coherent, and logically robust framework that solves the Frege-Geach problem for non-cognitivism. It's widely considered the most successful defense against that objection. You *can* keep holding a view where moral claims fundamentally express attitudes, not beliefs about objective facts.
  *   **But... What You Likely Need to Give Up:**
      *   **The Extreme Simplicity of "Just Boo!":** Your "fancy boo" view is *too* simple. Quasi-realism requires acknowledging that the states of mind expressed are more complex (involving higher-order attitudes, plans, commitments to consistency) and that moral language has a complex logical structure that needs explaining.
      *   **"Just Your Opinion" as a Conversation Stopper:** While you can *still* say the fundamental disagreement is about attitudes/plans rather than objective facts, quasi-realism shows moral discourse is **rationally constrained**. It's not *just* clashing feelings like preferring chocolate vs. vanilla ice cream. Attitudes can be:
          *   **Inconsistent:** Your disapproval of lying combined with your lack of disapproval for getting your brother to lie might be inconsistent in a way *you yourself* would disapprove of.
          *   **Supported by Reasons:** We give *reasons* for our moral attitudes ("Stealing causes harm," "Breaking promises destroys trust"). Quasi-realism explains how these reasons work *within* the framework of expressing and coordinating attitudes/plans. Saying "that's just your opinion" in response to a well-reasoned moral argument might now seem dismissive of the *rational structure* surrounding those attitudes.
          *   **Truth-Apt (Minimally):** You have to accept that "Stealing is wrong" can be *minimally* true (i.e., warrantedly assertible based on our standards and sentiments), even if it's not *objectively* true. This minimal truth does the logical work realism needed objective truth to do.
  *   **What You Keep:**
      *   **The Non-Objective Core:** You still deny that moral properties are part of the fundamental fabric of the universe, independent of human sentiments, attitudes, or commitments. There are no "Platonic Forms of Goodness."
      *   **Attitudes as Foundation:** Moral judgments are still fundamentally expressions of conative states (disapproval, approval, plans, commitments), not cognitive beliefs about objective facts.
      *   **Disagreement as Clash of Attitudes:** At rock bottom, fundamental moral disagreement is still a clash of attitudes/plans. Quasi-realism just shows this clash happens on a rationally structured battlefield.

  **What to Tell Jonas:**

  "Okay Jonas, Frege-Geach is a serious challenge for *simple* 'boo-hooray' emotivism. You're right; it struggles with unasserted contexts and logic. But that's where quasi-realists like Blackburn and Gibbard step in. They show how we can keep the core idea – that moral judgments express our attitudes or plans, not beliefs about objective facts – *while* fully accounting for moral logic, embedding, and even minimal truth.

  Their fix involves seeing complex moral sentences as expressing higher-order attitudes or plans about consistency. So, 'If lying is wrong, then getting your brother to lie is wrong' expresses disapproval of *combining* disapproval of lying with *not* disapproving of getting your brother to lie. This explains the validity without needing objective truth.

  I still think moral claims are rooted in our attitudes, not cosmic facts. So, in a deep sense, it *is* about our opinions, plans, and commitments. But quasi-realism forces me to admit it's more sophisticated than just 'boo!' – our attitudes operate within a framework of rationality, consistency, and giving reasons. So, 'that's just your opinion' still captures the non-objective foundation, but it shouldn't be used to dismiss the rational structure and logical force that moral arguments genuinely have *within* that framework. The can wasn't just kicked; they built a whole new cart to carry it."

  **In short:** Quasi-realism saves the non-cognitive core but demands you acknowledge the rational complexity and logical structure built *on top* of that core. Frege-Geach doesn't sink you, but it forces you to upgrade from "boo!" to a much more sophisticated expressivism. Good luck with round two!
