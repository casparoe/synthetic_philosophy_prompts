answer: |-
  Your parallel between the "fitness tautology" in biology and the circularity critique of revealed preference in economics is profoundly insightful. Both grapple with the legitimacy of concepts defined by their outcomes. Let's dissect the utility conceptions and assess Sen's charge, concluding with the biological analogy.

  ### 1. **The Two Conceptions of Utility**
  *   **Mentalistic Utility (Bentham/Jevons):**
      *   **Core Idea:** Utility is a *cardinal, introspectively accessible psychological state* – pleasure, satisfaction, or desire fulfillment. It exists prior to and independently of choice.
      *   **Role of Choice:** Choice is *evidence* of underlying utility. Agents *aim* to maximize this psychic state. Choice can *misrepresent* true utility due to error, ignorance, weakness of will, or external constraints ("I chose the apple, but the cake would have given me more pleasure; I just felt guilty").
      *   **Nature:** Ontologically subjective, potentially measurable (via introspection, hedonimeters?), causally potent (drives behavior), and normatively rich (directly linked to welfare).
  *   **Revealed-Preference Utility (Samuelson et al.):**
      *   **Core Idea:** Utility is *ordinal and defined solely by consistent choice behavior*. "x is preferred to y" *means* "x is chosen when both x and y are available". Utility is a *numerical representation* of an underlying preference ordering revealed by choices satisfying consistency axioms (e.g., transitivity, completeness).
      *   **Role of Choice:** Choice *defines* preference/utility. There is no deeper psychic state being revealed; the choice *is* the preference. Misrepresentation is incoherent within the pure theory ("I chose the apple, therefore I preferred it at that moment under those constraints").
      *   **Nature:** Ontologically behaviorist, inferred from observable data, devoid of intrinsic psychological content. It's a *representation* of a pattern in choices, not their cause. Its normativity is ambiguous.

  ### 2. **Sen's Charge: Does it Stick?**
  Sen's critique hits the mark precisely where revealed-preference theory attempts to move beyond pure positive description into normative welfare economics. The "both ways" problem is real:

  *   **Where Revealed Preference Succeeds in Avoiding Mentalism:**
      *   **Positive Microfoundations:** As a *positive* theory of choice *under given constraints*, it rigorously avoids mentalism. It provides a powerful tool for modeling behavior based solely on observables (choices, budgets, prices). It doesn't care *why* choices are consistent; it just describes the pattern. This operationalism was its core achievement.
      *   **Predictive Power (Within Limits):** If choices are stable and satisfy the axioms, the theory predicts future choices well within similar constraint sets, without needing to postulate unobservable mental states.
      *   **Circularity Managed (Descriptively):** The claim "agents maximize utility" *is* tautological within the descriptive framework – it means "agents make choices consistent with a stable preference ordering." This is seen as a virtue: it makes the theory logically coherent and testable via violations of consistency axioms. Axiom violations (e.g., intransitivity) falsify the hypothesis of stable preferences for that agent/context.

  *   **Where Mentalism is Smuggled Back In (Sen's Target):**
      *   **Welfare Economics & Normative Claims:** This is Sen's main battleground. When economists use "revealed preference" to infer *welfare* ("choosing x over y means x makes you better off"), they *necessarily* reintroduce mentalistic assumptions they formally disavow:
          *   **Assumption 1: Choice Reveals "True" Well-being:** This assumes choice accurately reflects the agent's *actual* welfare, denying Sen's examples of "counterpreferential choice" (e.g., choosing out of commitment, duty, sympathy, or even simple mistake – the polite guest choosing the smaller apple).
          *   **Assumption 2: Unfettered Choice = Welfare:** Welfare judgments based solely on choice implicitly assume the *absence* of constraints that distort the link between preference and welfare (e.g., addiction, lack of information, social pressure, adaptive preferences formed under oppression). Revealed preference theory, by construction, cannot distinguish between a free choice reflecting welfare and a constrained choice masking it.
          *   **Assumption 3: Preference Stability & Exogeneity:** Welfare analysis assumes preferences are stable and exogenous (not manipulated). Yet revealed preference only observes choices, not the *source* or *stability* of the underlying preference ordering. Preferences adapted to unjust circumstances pose a severe problem.
      *   **Interpretation of "Preference":** Even in positive work, the *language* of "preference" and "utility" constantly risks importing mentalistic connotations economists officially reject. We naturally think "preference" means a *feeling* or *judgment*, not just a pattern in choices.
      *   **Handling Inconsistency:** When axioms are violated, the pure behavioral theory simply notes inconsistency. But *explaining* it often implicitly invokes mental states (changing tastes, regret, temptation, framing effects) that the theory was designed to avoid.

  **Conclusion on Sen:** The charge sticks decisively regarding **normative welfare economics**. Revealed preference theory cannot ground welfare judgments without smuggling in mentalistic assumptions about the link between choice and well-being, assumptions it explicitly rejects. It succeeds admirably as a *descriptive, positive theory of choice behavior under constraints*, rigorously avoiding mentalism, but fails completely as a *sufficient foundation for welfare economics* on its own purely behavioral terms.

  ### 3. **The Biological Analogy: Can Propensity Rescue Revealed Preference?**
  Your insight about the biological resolution is sharp. Let's compare:

  *   **Biology's Success:** Defining fitness as *propensity* (expected reproductive output *given a specific environment and trait set*) breaks the tautology. It separates the *causal property* (the trait's propensity to boost reproduction *in context*) from the *historical outcome* (actual reproductive success). Fitness is *predictive* and *explanatory*: high propensity traits are *expected* to increase in frequency; if they don't, we look for reasons (environment changed, sampling error, etc.). The propensity is defined relative to an independently specifiable environment and measurable biological traits.

  *   **Can Economics Mimic This?**
      *   **The Challenge:** The core difference is the *anchor point*. Biology has a clear, independent, measurable outcome: **reproductive success**. This grounds the propensity. Economics lacks a comparable, universally agreed-upon, independent anchor for "utility" or "welfare" that isn't *itself* behavioral or mentalistic.
      *   **Attempted Moves & Their Problems:**
          1.  **"Expected Utility" under Uncertainty:** Savage's axioms extend revealed preference to choices under risk/uncertainty, defining utility over outcomes and subjective probabilities. This *resembles* a propensity (expected welfare gain). However:
              *   It's still defined *by* choices over lotteries. The "propensity" (expected utility) is inferred from the very choices it's meant to explain/predict. It escapes the triviality of *actual* outcomes but remains vulnerable to the charge of circularity defined by *hypothetical* choices. It doesn't provide an independent anchor beyond choice consistency.
              *   It doesn't solve Sen's welfare critique. Choosing a risky gamble doesn't necessarily mean its expected outcome maximizes your true welfare if you misjudge probabilities or the desirability of outcomes.
          2.  **Reintroducing Mentalism (Covertly):** Some argue that revealed preference axioms implicitly model "rational deliberation" or "coherent desire." This *does* inject a propensity-like element (a *disposition* to choose consistently), but it abandons strict behaviorism by invoking internal cognitive processes Sen would see as mentalistic.
          3.  **Finding an External Anchor (Problematic):** Could we anchor "utility propensity" to something like neural activation patterns (neuroeconomics) or physiological states? This:
              *   Abandons revealed preference's core behaviorist project.
              *   Raises the "hard problem" of linking physiology to subjective welfare.
              *   Doesn't resolve normative questions (e.g., should we maximize dopamine?).

  **Conclusion on the Analogy:** The biological move succeeds because it anchors fitness propensity to a clear, independent biological outcome (reproduction). Revealed preference utility lacks such an anchor. Attempts to create an analogous "choice propensity" (e.g., via expected utility theory) remain vulnerable to the core circularity/tautology charge because the propensity is *defined by* the structure of choices (actual and hypothetical), not by an independent outcome measure. **The economic case fails for reasons the biological one does not:** the lack of an independent, non-behavioral anchor for welfare. Revealed preference can describe *consistent choice dispositions*, but it cannot, without smuggling, define a *welfare propensity* independent of those choices themselves.

  ### Final Synthesis
  Revealed preference theory successfully purged mentalism to build a rigorous, positive theory of observable choice behavior, avoiding the older tradition's commitments to unobservable psychic states. Its "tautology" (utility maximization = consistent choice) is a feature, not a bug, within this descriptive domain. However, Sen is fundamentally correct: when economists leverage revealed preference for **welfare economics**, they inevitably and illegitimately reintroduce the mentalistic assumption that choice *reliably reveals well-being*. Unlike evolutionary biology, which resolved its tautology by anchoring fitness as a propensity to an independent outcome (reproduction), revealed preference theory cannot escape the circularity when making normative welfare claims because it lacks a comparable, non-behavioral anchor for utility. The concept remains descriptively powerful but normatively hollow on its own terms. Your cross-disciplinary perspective brilliantly illuminates this enduring conceptual tension.
