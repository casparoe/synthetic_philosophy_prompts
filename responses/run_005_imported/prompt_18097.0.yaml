answer: |-
  Based on Quine's core positions in epistemology, philosophy of language, and ethics, he would have **vehemently rejected** the Universal Moral Grammar (UMG) program, likely seeing it as suffering from *both* the flaws he attributed to Chomsky's linguistic nativism *and* the fundamental problems he identified in ethical discourse. Here's a breakdown of his probable objections:

  1.  **The Epistemological Objection (Moral Values Redux):**
      *   **Core Quinean Argument:** Objective knowledge requires a connection to the "sensory periphery" – empirical inputs that constrain theory formation and adjudicate disputes. Science has this (observations, experiments). Ethics, for Quine, lacks this crucial input. Moral claims aren't confirmed or falsified by sensory experience in the same way.
      *   **Objection to UMG:** Quine would argue that positing an innate "moral syntax" doesn't solve this fundamental problem. *What inputs constrain this module?* If it's generating "intuitive judgments," what empirical reality are these judgments *about* and *answerable to*? He saw moral values as arising from social conditioning and the web of beliefs, not as tracking an independent moral reality. An innate mechanism generating *unconstrained* intuitions doesn't grant them objectivity; it just makes the source of subjectivity biological rather than purely cultural. It dodges the *epistemological* question of justification and truth, not the ontological one about what moral properties *are*.

  2.  **The Anti-Nativism/Objection to Rich Innateness (Chomsky Redux):**
      *   **Core Quinean Argument (vs. Chomsky):** Quine rejected Chomsky's rich, domain-specific, innate Universal Grammar (UG). He argued that language learning could be explained by general learning mechanisms (conditioning, hypothesis testing) operating on sensory input ("stimulus meaning"). Positing a complex innate module was unnecessary and violated his principle of parsimony ("No entity without necessity") and his naturalized epistemology rooted in observable behavior.
      *   **Objection to UMG:** Quine would see UMG as making the *same mistake* Chomsky did, but transplanted into an even less hospitable domain (morality).
          *   **Unnecessary Posit:** He would argue that observed patterns in moral judgment (e.g., trolley problem intuitions) can be explained by *general learning mechanisms* – conditioning, socialization, reinforcement, trial-and-error learning within a cultural context – applied to the complexities of social living. There's no need to postulate a dedicated, innate "moral organ."
          *   **Lack of Stimulus Anchor:** While language learning *does* have a stimulus anchor (the sounds and situations associated with utterances), Quine would see morality as lacking even the *kind* of anchor language has. What is the specific sensory stimulus triggering the innate moral "principle" against incest, for example? He'd argue it's learned associations and cultural transmission, not an innate rule firing.
          *   **Indeterminacy of Translation (Moral Version):** Quine might extend his famous Indeterminacy of Translation thesis. Just as there's no unique "correct" translation of one language into another (only empirically adequate ones), there might be no unique "correct" description of an innate moral grammar underlying diverse cultural moral systems. Different innate grammars could be postulated to account for the same behavioral outputs, making the specific innate structure indeterminate and empirically unverifiable.

  3.  **The Holism Objection:**
      *   **Core Quinean Argument:** Knowledge is a web of belief. "Meaning" and justification are holistic, not confined to isolated sentences or modules. Sentences face the "tribunal of experience" not individually, but as part of the interconnected web.
      *   **Objection to UMG:** Quine would likely view the UMG model as overly modular and atomistic. Moral judgments aren't produced in isolation by a dedicated module; they are deeply intertwined with factual beliefs about the world, social norms, emotional responses, and other parts of the web of belief. Severing "moral syntax" from the holistic web of knowledge and conditioning would seem artificial and inadequate to him. The "fast intuitive judgments" studied by UMG proponents are still embedded within and influenced by the learner's entire conceptual scheme acquired through experience.

  4.  **The Naturalism Objection (Subtle but Important):**
      *   **Core Quinean Argument:** Philosophy should be continuous with science. Explanations should be naturalistic, based on observable evidence and mechanisms.
      *   **Objection to UMG:** While UMG proponents use empirical methods (psychology, neuroscience), Quine might argue that the *specific content* of the postulated innate module (e.g., abstract principles like the Doctrine of Double Effect) is *not* derived from naturalistic observation but is a theoretical posit imported from philosophy/folk morality. He'd demand a stronger link between the observable behavior (moral intuitions) and the *specific* proposed innate structure, grounded solely in conditioning/learning history, without appealing to pre-existing abstract rules. The innate structure might seem like a non-naturalistic intrusion.

  **Conclusion: Would Quine have "torn into it"? Absolutely.**

  Quine would see UMG as a **double error**:
  1.  It imports Chomsky's controversial nativism, which he already rejected as unnecessary and unparsimonious for language.
  2.  It applies this nativism to the domain of *ethics*, which Quine fundamentally believed *cannot* achieve scientific objectivity due to the lack of a sensory periphery.

  He wouldn't see it as "dodging" his objections; he'd see it as **exemplifying them**. UMG attempts to ground moral objectivity in biology (innateness) rather than empirical reality (sensory input). For Quine, this misses the point entirely. Innate mechanisms don't confer objectivity unless their outputs are answerable to sensory evidence, which he believed moral judgments fundamentally are not. The lack of a sensory anchor for ethics remained the insurmountable problem, and positing an innate generator for intuitions didn't solve it – it just relocated the source of the subjectivity. He would likely dismiss UMG as a biologically dressed-up version of the intuitionism he found philosophically bankrupt. His critique would be a fusion of his anti-nativist arguments from the linguistics debate and his deep skepticism about moral objectivity from his ethics writings.
