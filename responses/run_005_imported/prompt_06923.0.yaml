prompt: |-
  I'm running a graduate seminar on laws of nature this term, and this week we finally worked backwards from all the contemporary "Humean vs. anti-Humean" stuff (Lewis's Best System Analysis, Armstrong/Dretske/Tooley on necessitation, dispositional essentialism, etc.) to the actual Hume text that the label comes from, instead of just gesturing at "regularity theory" the way the textbooks do. My TA and I ended up arguing about the passage below yesterday and I want another set of eyes on it before Thursday's class. Its from Section VII of the first Enquiry, right near the end, just before he moves on to liberty and necessity:

  "Similar objects are always conjoined with similar. Of this we have experience. Suitably to this experience, therefore, we may define a cause to be an object followed by another, and where all the objects, similar to the first, are followed by objects similar to the second. Or, in other words, where, if the first object had not been, the second never had existed. The appearance of a cause always conveys the mind, by a customary transition, to the idea of the effect. Of this also we have experience. We may, therefore, suitably to this experience, form another definition of cause, and call it an object followed by another, and whose appearance always conveys the thought to that other. But though both these definitions be drawn from circumstances foreign to the cause, we cannot remedy this inconvenience, or attain a more perfect definition, which may point out that circumstance in the cause which gives it a connexion with its effect. We have no idea of this connexion, nor even any distinct notion what it is we desire to know, when we endeavour at a conception of it."

  Here's what's bugging me. Those two definitions don't have to pick out the same cases: you can imagine a brute regularity nobody's mind has ever tracked (no "customary transition" involved), and you can imagine a mind forming that habitual transition off a run of coincidences that isnt a real regularity at all. So they can come apart pretty easily. And Hume himself seems to admit the whole exercise is a bit of a bust, since both definitions are "foreign to the cause" and leave us with "no idea of this connexion." Given that, I'm no longer sure this passage actually licenses the standard textbook move of crowning Hume the founding father of the regularity theory of laws - it almost reads like neither definition is supposed to capture what we're really after, which sounds closer to the "New Hume" sceptical-realist line (Strawson, Kail) than to the tidier regularity-theorist Hume you get in Mackie or in a lot of the laws-of-nature literature. Could you help me untangle this a bit? Specifically: is the gap between the two definitions an actual problem for reading Hume as a regularity theorist, or is there a standard way of dissolving it that I'm forgetting, and does the "foreign to the cause"/"no idea of this connexion" bit really support the sceptical-realist reading, or am I over-reading two throwaway lines?
reasoning: |-
  Okay, the user is teaching a graduate seminar on laws of nature and is focusing on Hume's original text. They've encountered a passage in Section VII of the Enquiry where Hume gives two definitions of cause. The user is questioning whether this passage supports the standard regularity theory interpretation of Hume or if it leans more towards the skeptical-realist view.

  First, I need to recall Hume's two definitions. The first is about constant conjunction: similar objects followed by similar objects. The second involves the mind's customary transition to the effect when perceiving the cause. The user points out these can come apart—like a regularity no one has observed, or a habitual transition based on coincidences. 

  Hume's admission that both definitions are "foreign to the cause" and that we lack an idea of the connection is key. The user wonders if this undermines the regularity theory reading. The skeptical-realist interpretation (like Strawson or Kail) suggests Hume is agnostic about real causal powers, while regularity theorists (like Mackie) see him as denying them.

  I should check the context. Hume's project is epistemological, not ontological. He's saying we can't know necessary connections, not that they don't exist. The two definitions represent the observable (constant conjunction) and the psychological (habit of mind). For Hume, they coincide because the psychological response is based on observed regularities. The gap between them might be theoretical but not practical in his system.

  The "foreign to the cause" part indicates that both definitions describe experiences and mental habits, not the cause itself. This supports the skeptical-realist view that Hume leaves open the possibility of real connections we can't grasp. However, he doesn't affirm their existence either. The regularity theory reading might oversimplify by ignoring this nuance.

  The user's deeper need is to present an accurate interpretation in class. They want to avoid textbook simplifications and explore Hume's subtleties. Highlighting the two definitions' roles—epistemological vs. psychological—shows Hume's focus on human understanding's limits. Emphasizing the "New Hume" perspective could enrich the seminar discussion, showing that Hume might be more complex than the standard narrative.
answer: |-
  You've nailed a profound tension in Hume's text that often gets flattened in textbook summaries. Let's unpack this passage step-by-step, because your instincts are spot-on – this *isn't* a straightforward endorsement of regularity theory as later systematized, and the gap between the two definitions *is* significant. Here's a breakdown:

  1.  **The Two Definitions & Their Gap:**
      *   **Definition 1 (DF1):** "an object followed by another, and where all the objects, similar to the first, are followed by objects similar to the second." (Constant Conjunction)
      *   **Definition 2 (DF2):** "an object followed by another, and whose appearance always conveys the thought to that other." (Psychological Determination/Customary Transition)
      *   **The Gap:** As you note, these *can* come apart:
          *   **Regularity without Custom:** Undiscovered laws, cosmic regularities before minds existed. DF1 applies, DF2 does not.
          *   **Custom without Regularity:** Spurious correlations reinforced by coincidence, superstitions, or limited experience. DF2 applies (the mind *is* determined), DF1 does not (no *genuine* constant conjunction).

  2.  **Hume's Admission of Failure:**
      *   "both these definitions be drawn from circumstances **foreign to the cause**" – This is crucial. Hume explicitly states that neither definition captures anything *inherent* in the cause itself or the causal relation. They describe observable patterns (DF1) and psychological responses (DF2), *not* the "circumstance in the cause which gives it a connexion with its effect."
      *   "we cannot remedy this inconvenience" – He declares the search for a definition capturing the connection futile *from within his epistemological framework*.
      *   "We have no idea of this connexion, nor even any distinct notion what it is we desire to know" – This is the core of his scepticism. We lack the cognitive content to even conceive of what the supposed necessary connection *is*. This isn't just "we haven't found it yet"; it's a claim about the limits of ideas derived from experience.

  3.  **Does this Undermine the "Regularity Theorist" Reading?**
      *   **Yes, in its simplistic form:** The standard textbook "Hume = Regularity Theory" gloss *does* oversimplify and often ignores DF2 and the explicit scepticism about capturing "connexion." It presents Hume as offering DF1 *as the metaphysical truth* about causation, which this passage actively resists.
      *   **No, in a nuanced sense:** Hume *does* ground our *knowledge* and *conception* of causation entirely in constant conjunction (DF1). It's the *only* basis we have for identifying causes and making predictions. Metaphysically, he refrains from *affirming* anything beyond regularities (and the psychological habits they produce). His project is fundamentally *epistemological*: explaining the *origin* and *content* of our causal *ideas* and *beliefs*. DF1 is central to that explanation.

  4.  **The Sceptical-Realist Reading ("New Hume"):**
      *   **Strong Support:** The "foreign to the cause" and "no idea of this connexion" passages are *exactly* the ammunition sceptical realists (like Galen Strawson, Peter Kail) use. They argue Hume is *not* denying the existence of real causal powers or necessary connections in nature. He is denying that we can have any *positive idea* of them derived from experience or that we can incorporate them into a meaningful definition. He is agnostic or sceptical *about our access* to the metaphysical ground, *not* necessarily denying its existence. The definitions are descriptions of the *manifestations* and *effects* of causation on our minds and observations, not accounts of its intrinsic nature.
      *   **Your Insight is Correct:** You are not over-reading "throwaway lines." These are central, emphatic statements of his sceptical conclusion. They show Hume recognizing the inadequacy of both definitions to capture what we *intend* by "cause" (the "connexion"), while simultaneously arguing that these inadequate definitions are all we *can* have.

  5.  **Dissolving the Gap? A Standard Move:**
      *   **The "System" Reading:** The most common way to reconcile DF1 and DF2 within a broadly regularity-focused interpretation is to see them as **two sides of the same coin within the framework of human experience.**
          *   DF1 describes the *objective pattern in the world* that we observe.
          *   DF2 describes the *subjective, psychological mechanism* (custom/habit) *produced* by the repeated observation of DF1.
          *   **For us, in practice:** They are inextricably linked. We only *identify* a constant conjunction (DF1) *because* it produces the customary transition (DF2) in us. Conversely, the customary transition (DF2) is only reliably formed (and thus, for Hume, only constitutes a genuine causal *belief*) by the experience of constant conjunction (DF1). The gap exists in extreme hypotheticals, but *within the lived world of human cognition*, genuine DF1 reliably produces DF2, and DF2 (when justified) reliably tracks DF1.
      *   **Hume's Goal:** His aim isn't to provide a metaphysically watertight definition capturing some hidden essence. It's to explain the *origin* of our *idea* of cause. Both definitions contribute to that explanation: DF1 provides the external stimulus, DF2 describes the internal mental response. Together, they exhaust the experiential content of the idea.

  **Conclusion & Implications for Your Class:**

  *   **Against Simplistic Regularity Theory:** This passage **does not** straightforwardly license crowning Hume as the founder of regularity theory *as a positive metaphysical doctrine* about what laws/causes *are in themselves*. He explicitly denies capturing the "connexion" and roots both definitions in phenomena "foreign to the cause."
  *   **For Epistemological Regularity/Scepticism:** Hume **does** establish that constant conjunction (DF1) is the *sole foundation* of our *knowledge*, *reasoning*, and *conception* of causation. It's the only thing we can meaningfully talk about or use. Metaphysical speculation about "connexion" is empty.
  *   **Strong Support for Sceptical Realism:** The "foreign to the cause" and "no idea" admissions are **powerful evidence** for the New Humean reading. Hume is pointing *beyond* the definitions to something we cannot grasp, not affirming DF1 as the whole story. He leaves room for the *possibility* (though not the knowability) of a deeper connection.
  *   **The Gap Matters:** The gap between DF1 and DF2 isn't a problem to be dissolved away; it's a **feature** highlighting the core tension in Hume's account. It underscores the distinction between the *world as we experience it* (regularities) and the *psychological mechanisms* that experience generates, both of which fall short of capturing the "connexion" we instinctively seek. Acknowledging this gap is crucial for understanding Hume's deep scepticism.

  **For Your Seminar:**

  *   **Pose the Gap:** Start by highlighting the two definitions and asking *why* Hume gives two and how they *can* come apart. This immediately problematizes the "Hume=Regularity" shorthand.
  *   **Focus on the Admission:** Drill down on "foreign to the cause" and "no idea of this connexion." Ask: What *is* he admitting here? What does it imply about his view of our ability to understand causation metaphysically?
  *   **Contrast Interpretations:** Explicitly pit the "Epistemological Regularity + Scepticism" reading (DF1/DF2 as the exhaustive content/knowledge base) against the "Sceptical Realist" reading (DF1/DF2 describe phenomena, but point to an unknowable ground). Use the passage as the battleground.
  *   **Emphasize the Project:** Remind students Hume's primary question is *not* "What is causation (in itself)?" but "What is the origin of our *idea* of necessary connection?" The definitions answer *that* question (custom arising from observed regularity), while the sceptical admission explains *why* we can't answer the former.

  You're absolutely right to be bugged by this passage. It's the heart of Hume's profound and unsettling insight. Don't dissolve the tension – teach it! Your students will get a much richer, more accurate picture of Hume's nuanced and sceptical view of causation. Good luck on Thursday!
