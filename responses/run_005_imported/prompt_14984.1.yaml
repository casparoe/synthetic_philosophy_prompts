  Then, variation. Lewis allows for any logically possible world—different laws, ontologies, even magic, as long as no contradiction. Physical multiverses are constrained by the parent theory. Eternal inflation varies constants but within GR and QFT. String landscape has different vacua but same fundamental laws. Many-worlds has the same universal wave function and Hamiltonian across branches. So Lewis's variation is vastly broader, limited only by logic, while physics is bound by specific theories.

