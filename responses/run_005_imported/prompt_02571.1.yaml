answer: |-
  That's a fantastic question diving deep into the connection between scoring rules and the philosophical foundations of probabilistic reasoning. You're right about Joyce's accuracy-dominance argument (and similar arguments by de Finetti and others). The key difference between "proper" and "strictly proper" scoring rules is precisely what allows the argument to **force** probabilistic coherence as the *only* rational strategy. Here's the intuition breakdown:

  1.  **The Goal:** Show that if your degrees of belief (credences) violate any probability axiom (e.g., credences don't sum to 1, or P(A) > P(B) when B implies A), then your beliefs are *accuracy-dominated*.
  2.  **Accuracy-Domination Defined:** Belief system A is accuracy-dominated by belief system B if, **for every possible state of the world**, system B is *at least as accurate* as system A according to the chosen scoring rule, **and** for *at least one possible state of the world*, system B is *strictly more accurate* than system A.
  3.  **Why Domination Matters:** If your belief system is accuracy-dominated, it means there's another system that is *guaranteed* to be *at least as good* as yours no matter how the world turns out, and *strictly better* in some cases. Choosing a dominated system seems irrational if your sole goal is accuracy.

  **Where Strict Propriety Comes In (The Tie-Breaker):**

  Imagine you have a scoring rule that is **proper but not strictly proper**. This means:

  *   **Proper:** For any true probability `P`, reporting `P` minimizes your *expected* score.
  *   **Not Strictly Proper:** There might be *other* reports `Q` (where `Q != P`) that *also* minimize your expected score if `P` is the truth. They are *tied* for the optimum.

  **How This Breaks the Dominance Argument:**

  1.  **Target an Incoherent Credence:** Suppose an agent holds an incoherent set of credences `C` (e.g., `C(Heads) = 0.6`, `C(Tails) = 0.5` for a fair coin).
  2.  **The Plan:** Find a coherent credence system `C*` that accuracy-dominates `C`.
  3.  **The Challenge (with non-strict propriety):** When we try to construct the dominating `C*`, we need to show that `C*` is *strictly better* than `C` in *at least one possible world*.
  4.  **The Tie Problem:** Because the scoring rule isn't strictly proper, it's possible that for the *true* probability `P` in a specific world `w`:
      *   The *best possible* score (the minimum) is achieved not only by reporting `P` but *also* by reporting other credences `Q1, Q2, ...` (including potentially the incoherent parts of `C`!).
      *   **Crucially:** In world `w`, the agent's incoherent report `C(w)` might accidentally achieve this tied-for-best score.
  5.  **Dominance Fails:** In this world `w`, `C*` *cannot be strictly better* than `C` because `C` achieved the best possible score (it was tied for the minimum). At best, `C*` is *equally good* in `w`. But for `C*` to dominate `C`, it *must* be strictly better in *at least one world*. We've found a world (`w`) where it isn't strictly better. Therefore, `C*` does not accuracy-dominate `C`.

  **Strict Propriety to the Rescue:**

  *   A **strictly proper** scoring rule guarantees that for any true probability `P`, reporting `P` is the *unique* report that minimizes your expected score.
  *   **No Ties:** There are *no* other reports `Q != P` that achieve the same minimum expected score. Reporting anything other than `P` gives a *strictly higher* expected score if `P` is true.
  *   **Closing the Loophole:** Now, when we look at a world `w` with true probability `P_w`:
      *   The *only* way to achieve the best possible score in `w` is to report `P_w`.
      *   If the agent's incoherent report `C(w)` is *not equal* to `P_w` (which it almost certainly won't be, especially since `C` is globally incoherent), then `C(w)` *cannot* achieve the best possible score in `w`.
      *   The coherent alternative `C*` we construct *will* report `P_w` in world `w` (because `C*` is coherent and matches the world).
      *   Therefore, in world `w`, `C*` *must* be strictly better than `C` (since `C*` gets the unique best score and `C` gets a worse score).
  *   **Dominance Achieved:** Since we can find at least one world `w` where `C*` is strictly better than `C` (specifically, any world where the agent's incoherent report doesn't match the true probability, which is guaranteed by global incoherence), and `C*` is at least as good everywhere else, `C*` accuracy-dominates `C`.

  **Concrete Analogy (Oversimplified but Intuitive):**

  *   **Non-Strictly Proper Rule (e.g., a rule with flat minima):** Imagine a target where hitting the bullseye *or* a specific ring around it both give the maximum score of 10. An archer using a broken sight (incoherent beliefs) might *sometimes* accidentally hit that ring and get 10. A perfect archer (coherent beliefs) always hits the bullseye and gets 10. The perfect archer is never *worse*, but they are *never strictly better* than the broken-sight archer in the worlds where the broken-sight archer hits the ring. There's no dominance.
  *   **Strictly Proper Rule:** Now, *only* the bullseye gives 10. Hitting the ring gives 9. The perfect archer *always* gets 10. The broken-sight archer *sometimes* gets 9. The perfect archer is strictly better (10 > 9) in every world where the broken-sight archer doesn't hit the bullseye (which they never do consistently due to the broken sight). The perfect archer dominates.

  **Philosophical Significance:**

  Strict propriety is what ensures that *any* deviation from reporting your true credence (which, when globally coherent, aligns with the true probabilities) *inevitably* makes you accuracy-dominated in a way that can be *strictly* punished in some possible world. It removes the possibility of "getting lucky" with an incoherent report matching the optimum score in a world, thereby making incoherence fundamentally indefensible from a pure accuracy-seeking perspective. The "unique minimum" property is the linchpin that allows the dominance argument to conclusively rule out *all* non-probabilistic credence systems.
