answer: |-
  You've articulated a profound ethical dilemma with remarkable clarity. Your intuition that there's a fundamental difference between the two kinds of reasons—genuine respect versus instrumental gain—is philosophically sound and morally significant. Let's break this down systematically.

  ### 1. **The Two Kinds of Reasons: A Real Distinction**
     - **Instrumental Reasons**: These are grounded in *consequences* (e.g., "I should do X to get the house"). They’re about achieving an external goal.
     - **Normative Reasons**: These concern what *ought* to be done or felt based on the *inherent qualities* of the object (e.g., "Grandfather deserved respect because he was kind/wise/honorable").  
     
     **Why the distinction matters**:  
     - Respect, by definition, is a response to perceived *value in the person*. If your "admiration" stems solely from the inheritance, it’s not respect—it’s a transactional performance.  
     - Philosophers like Immanuel Kant would argue that respecting someone *only* for personal gain violates the moral duty to treat persons as "ends in themselves," not merely as means to an end.  

  ### 2. **Acting vs. Believing: Does It Matter?**
     - **Mere Performance**: Acting respectfully at family dinners without believing it is *deception*. While arguably less harmful than self-deception, it still:  
       - Exploits your grandmother’s grief and values.  
       - Risks eroding your integrity if sustained long-term.  
     - **Genuine Self-Persuasion**: Convincing yourself to feel admiration is ethically riskier:  
       - It requires distorting your authentic judgment of your grandfather’s character.  
       - As you noted, the resulting "admiration" tracks the *payoff*, not the man. This is **epistemic corruption**—compromising your rationality for gain.  
       - Over time, this can create psychological dissonance or resentment.  

  ### 3. **Which "Pull" Should Govern Your Actions? A Principled Approach**
     Weigh these ethical frameworks:  
     - **Virtue Ethics**: What kind of person do you want to be?  
       - If honesty, integrity, and authenticity are virtues you value, manufacturing false respect compromises your character.  
       - Conversely, compassion for your grandmother’s need to idealize her late husband might justify gentle diplomacy.  
     - **Deontology**: Are there duties here?  
       - Duty to truth: Not misrepresenting your feelings.  
       - Duty to family: Honoring your grandmother’s emotional needs without manipulation.  
     - **Consequentialism**: What outcomes matter most?  
       - *Short-term*: The house could significantly benefit your life.  
       - *Long-term*: A relationship built on deception may harm familial trust. Your self-respect could also suffer.  

  ### 4. **A Path Forward: Integrity Without Rigidity**
     Instead of "faking" respect or forcing admiration, consider a third way:  
     - **Acknowledge Complexity**: Tell your grandmother, *"Grandad was complicated. I didn’t always understand him, but I’ve been reflecting on how hard he worked to provide for this family."*  
       - This is truthful (you *can* respect his work ethic without admiring his character).  
       - It honors her need to hear his struggles validated.  
     - **Focus on Shared Values**: "I respect how committed he was to this family, even when things were tough."  
       - This redirects attention to values you *genuinely* hold.  
     - **Prioritize Connection**: Ask her to share stories about him. Listen actively.  
       - This shows respect for *her grief/love* without requiring you to misrepresent your own feelings.  
       - You may uncover redeeming facets of him you overlooked.  

  ### Final Thought
  Your reluctance to commodify respect reveals a commendable moral sensitivity. The house is temporary; your integrity is permanent. If you choose engagement, do so through honest framing of your grandfather’s complexity—not fabrication. This approach:  
  - Honors your grandmother’s emotional reality without deception.  
  - Preserves your self-respect.  
  - May even fulfill her wish more authentically than performative admiration, as it demonstrates *respect for her* and the truth of your shared history.  

  As philosopher Harry Frankfurt observed: "Truthfulness... is the foundation of trust." Build your case on that foundation, not illusion. The outcome may surprise you.
