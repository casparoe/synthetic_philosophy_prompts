  ## MEMORANDUM: RECOMMENDATION RE: HONORARY DOCTORATE FOR FORMER PRESIDENT [NAME]

  **To:** University Honorary Degrees Committee  
  **From:** [Your Name/Position]  
  **Date:** [Date]  
  **Subject:** Recommendation Regarding Honorary Doctorate for Former President [Name] – Navigating the Moral Imperative  

  **Background:**  
  The committee faces a profoundly difficult decision regarding an honorary doctorate for former President [Name], credited with ending a brutal three-year war through decisive military action targeting critical civilian infrastructure (water treatment and power plants). Historical analysis suggests this action, while causing significant civilian casualties from disease, resulted in a *net reduction* in overall loss of life compared to projected casualties from a prolonged conflict. This calculation forms the core argument for approval. The counter-argument, invoking principles akin to those expressed by Elizabeth Anscombe regarding President Truman and Hiroshima, contends that deliberately targeting civilian survival capabilities constitutes an impermissible act of murder, morally distinct from and unmitigated by utilitarian "lives saved" calculations.

  **Analysis of the Competing Arguments:**

  1.  **The "Net Lives Saved" Argument (Approval):**
      *   **Strength:** It engages with the horrific reality of war calculus. If the historical assessment is credible – that the action demonstrably shortened the war and resulted in *fewer* total deaths than the alternative – it represents a terrible but potentially necessary choice under catastrophic circumstances. It prioritizes the minimization of overall human suffering.
      *   **Weakness:** It relies heavily on counterfactual historical analysis ("what if?"). More critically, it potentially validates a dangerous principle: that targeting non-combatants and essential civilian life-support systems is permissible if it achieves a "greater good." This erodes fundamental tenets of just war theory and international humanitarian law, specifically the principle of distinction and the prohibition on making civilians the object of attack. It reduces human lives to interchangeable units in a calculation.

  2.  **The "Moral Line" Argument (Anscombe-Inspired - Decline):**
      *   **Strength:** It upholds a crucial absolute: the immunity of non-combatants from direct, intentional attack. Destroying a population's water and power, foreseeing widespread disease and death, constitutes a direct assault on civilians *as a means* to force surrender. This, proponents argue, is murder or a crime against humanity, morally impermissible regardless of consequences. Honoring the architect of such a strategy implicitly endorses the method and weakens the university's commitment to fundamental humanitarian principles.
      *   **Weakness:** It can appear rigid in the face of horrific alternatives. It doesn't negate the *factual claim* that net lives were saved; it argues that this fact is *morally irrelevant* to the core wrong committed. Some may perceive it as failing to grapple adequately with the impossible choices faced by leaders in existential conflicts.

  **Engaging the Core Conflict:**  
  The committee cannot resolve the historical "what if?" definitively. Nor can it definitively settle the profound philosophical debate between consequentialism and deontology in extremis. **The central question for this committee is not "Was the war ended?" or even solely "Were net lives saved?" but rather: "Does the *manner* in which this outcome was achieved align with the core values this university seeks to honor and exemplify?"**

  Honorary doctorates are not mere awards for effectiveness; they are the institution's highest symbolic endorsement. They communicate what we admire, what principles we hold sacrosanct, and what examples we set for our students and society.

  **Recommendation: Decline the Honorary Doctorate. Propose an Alternative Recognition.**

  *   **Reasoning for Declining the Doctorate:**
      *   **Upholding Foundational Principles:** Granting the doctorate risks being interpreted as endorsing the *method* – the deliberate targeting of civilian survival infrastructure – as acceptable or even laudable strategy under pressure. This directly contravenes fundamental principles of distinction and civilian immunity enshrined in international law and widely held ethical norms. The university must not blur this line.
      *   **Symbolic Weight:** The Anscombe argument holds significant weight here. There *is* a qualitative moral difference between foreseeable tragic civilian deaths *within* a war fought against combatants and the *intentional infliction* of mass civilian suffering *as the primary mechanism* to achieve victory. The latter crosses a threshold that an institution dedicated to learning, humanity, and the future should not honor, regardless of the net outcome.
      *   **The University's Role:** Our role is not to adjudicate history's toughest calls with an award, but to affirm the principles we believe should guide humanity, even (especially) when they are hardest to uphold. Honoring this method, however effective in this specific instance, sets a dangerous precedent and undermines our voice on humanitarian issues.

  *   **Proposed Alternative: A Distinguished Lecture or Symposium Series:**  
      To fully engage the complexity without conferring our highest endorsement:
      1.  **Invite the Former President (or Key Representatives) & Leading Critics:** Host a major, rigorous public symposium on "Leadership, Ethics, and Ending Atrocity." Feature the former president (or senior advisors/historians representing their perspective) alongside prominent moral philosophers, historians of war, and humanitarian law experts (including proponents of views like Anscombe's).
      2.  **Focus:** Examine this specific decision, the "net lives saved" calculus, the moral arguments for and against such tactics, the historical context, and the long-term implications for conflict resolution and humanitarian norms. Make it a model of deep, respectful, and challenging intellectual engagement.
      3.  **University's Role:** Frame it as the university providing a vital platform for examining profound moral dilemmas in leadership, leveraging this controversial historical moment for deep learning and discourse, *without* bestowing an honor that could be misconstrued as approval of the contested method.
      4.  **Honor the Complexity, Not (Specifically) the Method:** This approach acknowledges the significance of the historical moment and the individual's role without endorsing the specific, morally contested tactic. It honors the *difficulty* of the decision and the *gravity* of the consequences by subjecting it to the highest level of scholarly scrutiny.

  **Conclusion:**  
  The "net lives saved" argument is powerful and demands serious engagement, reflecting the tragic arithmetic of war. However, the university's highest honor cannot be reconciled with the specific means employed, which fundamentally violated the principle of non-combatant immunity. To award the doctorate would signal that such methods, if "successful" in a grim calculus, are worthy of our highest academic accolade. This committee should decline the honorary doctorate.

  Instead, we recommend harnessing the undeniable significance of this moment for a profound educational purpose. By convening a major, high-profile symposium examining the ethical dimensions of this decision with intellectual honesty and rigor, the university can fulfill its mission far more meaningfully than by granting a degree that risks endorsing a morally catastrophic tactic. This path allows us to engage deeply with the "lives saved" argument while unequivocally upholding the principle that some lines, even in war, must not be crossed, and certainly not celebrated.

  **Recommendation:**  
  **VOTE TO DECLINE** the conferral of the honorary doctorate.  
  **PROPOSE** the organization of a Distinguished Lecture or Public Symposium Series on "Leadership, Ethics, and Ending Atrocity: The Case of [War Name]" as the university's formal engagement with this historical moment.  

  **Prepared for Committee Discussion & Vote on Thursday.**
