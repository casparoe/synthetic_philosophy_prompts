  I think no-sign cases work. Let me build the argument step by step. First, sketch Pereboom's Tax Evasion case—it's clean. Jones decides on his own to cheat, but a neuroscientist (Black) has implanted a device that would force him to cheat if he wavered. Crucially, no prediction: the device activates only if Jones shows signs of choosing otherwise.  

  Now, why does this escape the dilemma? On horn one (causal sufficiency): the blockage isn't triggered! Jones' actual decision is untouched. The device is a dormant failsafe. So no determinism smuggled in. On horn two (AP preserved): sure, technically Jones *could* have tried to choose not to cheat, but then the device would force him to cheat anyway. But is that a *robust* alternative? Libertarians need AP that could actually lead to a different *outcome*. Here, any alternative path leads to the same result (tax evasion). So PAP isn't satisfied in the way libertarians require.  

