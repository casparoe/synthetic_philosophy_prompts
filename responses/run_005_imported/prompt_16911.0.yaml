prompt: |-
  So I've been arguing with a colleague about whether Frankfurt cases actually do the work Frankfurt wanted against PAP. The move that worries me most is the "dilemma defense" from Widerker and Kane: the prior sign Black relies on to know what Jones will do is either causally sufficient for the decision (in wich case the case just assumes determinism and begs the question against libertarians) or it isn't sufficient (in which case Jones really does retain alternative possibilities, so the case doesn't refute PAP after all). Mele and Robb, and separately Pereboom, tried building "no-sign" or blockage versions that ditch the prior sign entirely and just directly block the alternative outcome instead of predicting it. I want you to actually stake out a position here rather than just summarizing the back-and-forth: argue that these no-sign, blockage-style Frankfurt cases succeed in escaping the dilemma defense and still manage to refute PAP. Make sure you deal with the strongest version of the objection against your own view before you're done.
