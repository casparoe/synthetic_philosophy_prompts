answer: |-
  Your deep engagement with this core tension in philosophy of science—between the historical fragility of theories and the desire for realism—is precisely where the debate gets most interesting. As an experimental physicist, your experience with discarded ontologies gives you a unique perspective on Worrall's structural realism (SR) and its attempt to salvage realism from Laudan's pessimistic meta-induction (PMI). Let's break down the arguments using the Fresnel-to-Maxwell transition as the critical case study:

  ## 1. Laudan's Pessimistic Meta-Induction (PMI)
  *   **Core Argument:** The history of science is a "graveyard" of theories (caloric, phlogiston, mechanical ether, etc.) that were empirically successful for their time but are now judged to be fundamentally *false* in their descriptions of the deep structure of reality. Therefore, it is inductively probable that our *current* best theories, despite their empirical success, are also fundamentally false. Success is no guarantee of truth.
  *   **Target:** "Standard" scientific realism, which typically asserts that our best scientific theories are (approximately) true in their descriptions of both observable *and unobservable* entities and processes.
  *   **Implication:** If PMI holds, realism is untenable. We cannot rationally believe our theories capture the "way the world is" beyond saving the observable phenomena.

  ## 2. Worrall's Structural Realism (SR) & the Fresnel-to-Maxwell Case
  Worrall (1989) directly targets PMI by arguing that while Laudan is right about radical ontological *discontinuity*, he overlooks a crucial element of *continuity*: the mathematical structure.

  *   **The Fresnel Example:**
      *   **Fresnel's Theory (Elastic Solid Ether):** Light is a transverse wave vibration in an all-pervading, mechanical elastic-solid luminiferous ether. He derived mathematical equations describing the *intensity* of light reflected and refracted at the interface between two transparent media (e.g., air/glass). These equations, expressed using sine functions and refractive indices, successfully predicted complex phenomena like the "white spot" at the center of the shadow of a circular disc (Arago spot).
      *   **Maxwell's Theory (Electromagnetic Field):** Light is an electromagnetic wave, a self-propagating disturbance in electric and magnetic fields, requiring no mechanical medium. The ether ontology is entirely abandoned.
      *   **The Claimed Preservation:** Worrall argues that while Fresnel's *interpretation* of *what was waving* (the elastic solid ether) was completely wrong and discarded, the *mathematical form* of his equations describing the *relationships* between light intensity, angle of incidence, polarization, and refractive indices **survived intact** within Maxwell's electromagnetic theory. Maxwell's theory *subsumed* Fresnel's equations as a special case, applying them directly to the electromagnetic field components rather than ether displacements.

  *   **Core Argument of SR:** What is preserved across theory change, and what truly captures the objective content of science, is **mathematical structure**. We should be realists about this structure – the equations describing the relations between physical quantities – but agnostic (or at least cautious) about the specific nature of the entities postulated to "fill in" or realize that structure (the ontology). The world's *structure* is what we get right and what persists; our interpretations of the *nature* of the relata within that structure are historically contingent and prone to revision.
  *   **Response to PMI:** PMI successfully attacks a naive realism about ontology, but *not* realism about structure. The historical record shows structural continuity even amidst ontological revolutions. Therefore, realism about the *structural content* of our best theories is justified.

  ## 3. What Exactly is Preserved? (The Devil in the Details)

  This is where the debate gets nuanced, and your concern about "relocating instability" is astute. Worrall claimed the *form* of Fresnel's equations was preserved. Let's be precise:

  *   **Preserved:** The specific mathematical expressions for the *amplitude reflection and transmission coefficients* for light waves at a dielectric interface. These coefficients dictate the *ratios* of reflected/transmitted wave amplitudes to incident wave amplitude as functions of angle and polarization. The *functional form* relating these quantities (sines, cosines, refractive indices) remained identical. The *predictions* for observable intensities were retained.
  *   **Not Preserved:**
      *   **The Ontology:** Elastic solid ether vs. electromagnetic fields.
      *   **The Interpretation of Variables:** What the amplitudes represented (displacement of the ether vs. magnitude of electric/magnetic field vectors).
      *   **The Causal Mechanism:** Mechanical restoring forces vs. mutual induction of electric and magnetic fields.
      *   **The Broader Theoretical Framework:** Fresnel's equations were embedded in a Newtonian, mechanical worldview; Maxwell's in a field-theoretic, relativistic (eventually) worldview.

  ## 4. Assessment: Does SR Rescue Meaningful Realism or Relocate Instability?

  This is the crux, and opinions differ sharply:

  *   **The Rescue Argument (For SR):**
      *   **Meaningful Continuity:** The Fresnel case *is* compelling. That specific, complex mathematical structure yielding precise predictions survived a complete ontological overhaul. This suggests it captured *something* genuinely objective about how light interacts with matter at interfaces.
      *   **Explains Progress:** SR offers an explanation for scientific progress beyond mere predictive utility: we are progressively uncovering the world's invariant structural relations. Maxwell didn't just replace Fresnel; he explained *why* Fresnel's equations worked by embedding them in a deeper, more fundamental structure (electromagnetism).
      *   **Pragmatic Realism:** It provides a robust form of realism compatible with the historical record. We *can* trust the structural content of theories to "latch onto" reality, even if our ontological pictures are provisional. This resonates with how physicists often use equations divorced from their original interpretation.

  *   **The Relocation Argument (Against SR / PMI Bites Back):**
      *   **Structure is Not Epistemically Safe:** PMI can be reformulated: History is also littered with *structures* (mathematical formulations) that were abandoned or drastically reinterpreted (e.g., Newtonian gravity's action-at-a-distance structure vs. GR's curved spacetime; classical phase space vs. Hilbert space). If past structures proved unstable, why believe current ones are stable? SR hasn't escaped the induction; it just shifted the target from ontology to structure.
      *   **The Problem of "Structure":** What *is* "structure"? Is it just the equations? Their observable consequences? Their formal symmetries? The Fresnel case seems clear-cut, but is it representative? In other transitions (e.g., classical mechanics to quantum mechanics, caloric to thermodynamics), the structural continuity is messier, involving approximations, limiting cases, or radical reformulations. The line between "preserved structure" and "fundamentally new structure" can be blurry.
      *   **The Ontology/Structure Dichotomy is Porous:** Can we cleanly separate "structure" from "ontology"? The interpretation of the mathematical symbols matters deeply to the theory's content and how it guides research. Fresnel's equations derived meaning *from* the ether ontology. Maxwell reinterpreted them within a new ontology. Is the "structure" truly the *same* if its physical interpretation and embedding context are utterly different? (This is the "Newman Problem" applied historically).
      *   **Epistemic vs. Ontic SR:** Worrall's original "Epistemic Structural Realism" (ESR) says we can only *know* structures, not the underlying nature. "Ontic Structural Realism" (OSR) says structures *are* all that fundamentally exists. ESR faces the challenge of explaining *why* structures are preserved if we know nothing about the underlying nature causing them. OSR is metaphysically radical and struggles to explain how structures relate to manifest phenomena or how they can change. Both versions face the historical challenge of structural discontinuity in other cases.
      *   **Fresnel: A Best Case?:** Critics argue the Fresnel-Maxwell transition is an unusually clean example of structural preservation hand-picked by Worrall. Cases like the transition from phlogiston chemistry to oxygen chemistry or classical space-time to relativistic space-time show much less clear structural continuity at the level of fundamental equations.

  ## Conclusion

  Worrall's structural realism, using the Fresnel-Maxwell transition, provides a powerful and nuanced counter to Laudan's pessimistic meta-induction. It successfully identifies a genuine form of continuity—mathematical structure governing relations between quantities—that persists even through radical ontological upheavals. This *does* rescue a meaningful form of scientific realism: realism about the objective, structural relations in the world captured by our equations. It explains progress better than anti-realism and aligns with the physicist's pragmatic trust in mathematical laws.

  However, your concern about "relocating instability" is valid and reflects deep ongoing debates. Structural realism does not guarantee the permanence of *current* structures. History shows structures *can* and *do* change fundamentally (not just ontologies). PMI can be reapplied at the structural level. The clean separation between structure and ontology is philosophically and historically contentious. Worrall's ESR leaves us agnostic about the "stuff" that realizes the structure, which can feel unsatisfying, while OSR demands a radical metaphysical shift.

  **In your assessment as a physicist:** Structural realism offers the most plausible *version* of realism compatible with the history of theory change you've witnessed. It acknowledges the fragility of ontological interpretations while grounding realism in the demonstrable, progressive accumulation of robust mathematical relationships that capture invariant features of physical behavior. It rescues a realism worth having – a realism about the world's enduring structural patterns – even if it cannot promise the absolute permanence of today's specific equations or guarantee immunity from future structural revolutions. It shifts the locus of realism, but arguably to a more defensible and historically informed level. Whether this is sufficient, or whether the instability inherent in scientific development ultimately undermines even structural confidence, remains a profound philosophical question, but SR provides a compelling framework for navigating it.
