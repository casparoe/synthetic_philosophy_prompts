prompt: |-
  Lately I can't stop thinking about the version of me that didn't drop out of nursing school, or the one that stayed with my ex instead of taking a job across the country. Thinking about them gives me this real ache, like I actually lost that whole other life. But then I start second guessing the feeling itself, like is that other person really ME, just with a different history, or basically a different person who happens to share my exact past up until the point we split off? When I picture "what if I'd stayed," am I picturing myself actually staying, or some similar-but-separate person who isnt me at all? I genuinely can't tell if grieving the life I "could've" had makes any sense, or if im just grieving something that was never mine to lose in the first place. Anyone have a good way to think about this, or am i just overthinking it?
