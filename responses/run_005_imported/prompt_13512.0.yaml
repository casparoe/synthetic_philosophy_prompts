  ### 1. Weber's account of social action (2 pts)
  The student writes: "For Weber, the basic unit of explanation is social action: an action is 'social' when the actor attaches a subjective meaning to it that takes account of, and is oriented toward, the behavior of others. Because meaning only exists for individuals, any institution ... ultimately has to be explained through the beliefs and actions of the people who make it up."

  This captures the essence of Weber's social action: the subjective meaning and the orientation toward others. It also correctly ties it to methodological individualism. The explanation is accurate and complete.

  **Score: 2/2**  
