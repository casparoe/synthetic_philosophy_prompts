  ### 2. Durkheim's account of social facts (2 pts)
  The student writes: "Durkheim takes the opposite view: social facts, ways of acting, thinking, and feeling that are external to any one individual and exert a coercive power over them, are a distinct, sui generis reality that can only be explained by other social facts, not by individual psychology."

  This correctly defines social facts as external, coercive, and sui generis. It also contrasts with individualism by stating they must be explained by other social facts. This is a solid summary.

  **Score: 2/2**  
  Justification: Correctly characterizes Durkheim's social facts, including externality, coercive power, and sui generis nature.

  ### 3. Correct use and attribution of "Coleman's boat" (2 pts)
  The student writes: "Weber's own boat model shows ... Protestant theology (a macro fact) doesn't act directly on capitalism (another macro fact); instead, it works by first changing individual believers' motivations and habits, which then aggregate back up into a new macro-level economic system. That is the whole point of drawing the diagram as a loop down and back up rather than a straight arrow across the top."

  There are two issues here:
  - The model is attributed to Weber, but Coleman's boat is actually a model by James Coleman, not Weber. Weber did discuss micro-macro links (as in the Protestant Ethic), but the specific diagrammatic representation (the boat) is Coleman's. The student incorrectly attributes it to Weber.
  - However, the explanation of the model (macro to micro to macro) is correct and well applied to Weber's Protestant Ethic thesis.

  Because of the misattribution, we must deduct points. The content about the mechanism is accurate.

  **Score: 1/2**  
  Justification: Explanation of the macro-micro-macro process is correct and applied well to Weber's thesis, but the model is misattributed to Weber instead of Coleman.

  ### 4. Whether methodological individualism entails denying the reality of collective entities (3 pts)
  The student writes: "Because explanation always has to bottom out this way, methodological individualism really does commit Weber to denying that entities like 'the state' or 'a social class' are real in their own right — they are convenient names for very large, coordinated patterns of individual belief and action, not separately existing things in the way Durkheim's social facts are supposed to be."

  This is a clear statement of the reductionist view of methodological individualism. It correctly states that collective entities are not seen as having independent reality but as patterns of individual actions. However, note that the question asks about "denying that collective entities ... are real." The student's answer aligns with a strict interpretation of methodological individualism, but there are nuances. Some individualists (like Weber) might allow for the reality of collective entities as emergent phenomena without independent causal powers. But the student's answer is consistent with a common interpretation, and the rubric might expect this view.

  The student's answer is accurate for the strict individualist position. The point is well argued.

  **Score: 3/3**  
  Justification: Correctly states that methodological individualism denies independent reality to collective entities, reducing them to patterns of individual actions.

