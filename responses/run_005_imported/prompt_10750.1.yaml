  I recall Parfit’s cluelessness problem: consequentialism struggles when outcomes are truly incalculable. But rejecting all such interventions is paralyzing—most policy/advocacy work falls here. The key is distinguishing "unknowable in principle" from "currently unmodeled but tractable." 

  For the memo structure: 
