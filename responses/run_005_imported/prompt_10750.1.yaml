  - Crucially, cite past grants that passed similar scrutiny—this forces the "certainty camp" to confront inconsistency. 

  The risk: hardliners might still veto. But tying funding to concrete evaluation steps (like the cage-free campaign’s data roadmap) makes uncertainty actionable. Also, emphasizing the bednets' ironclad numbers gives the "certainty" side a win while keeping systemic change alive. 

