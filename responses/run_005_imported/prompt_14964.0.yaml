  For the dual identity, I'm imagining a character who's both a compassionate hospice nurse and a cutthroat corporate lawyer. This creates rich tension: mourners would genuinely hold opposite views ("kind angel" vs "ruthless shark") while describing the same person. The funeral setting heightens the irony - death becomes the revealer of truth that life obscured.

  The structural challenge is making the philosophical reveal feel inevitable, not gimmicky. I'll build through:
  - Early dialogue showing contradictory descriptions (Evelyn's warmth vs Elena's coldness)
