prompt: |-
  I teach a graduate seminar, cross-listed with the psychology department, on the philosophical foundations of statistical inference, and much of our discussion this term has turned on how much of the replication crisis is really a symptom of frequentist methodology specifically, as opposed to something that would survive a wholesale switch to Bayesian methods. A psychology postdoc auditing the course offered his own recent practice as evidence for the Bayesian side of that debate: he had specified a prior for his key parameter before running an experiment, found that the resulting posterior left his hypothesis looking distinctly unpromising, decided on reflection that his original prior had actually been too uninformative given a closely related result in the literature, revised it accordingly, and reran the analysis, arriving at a posterior that supported his hypothesis comfortably. That is the version now heading toward publication. He maintains that since his revised prior is, if anything, more defensible than his original one, nothing methodologically suspect is going on here, in contrast to the sort of data-contingent flexibility that produces false positives under null hypothesis significance testing.

  I could not say exactly why this bothered me at the time, beyond a sense that he had relocated a familiar problem rather than escaped it. Is he right that moving to Bayesian inference insulates a researcher from the kind of analytic flexibility that produced so many false positives in the first place, or is there something wrong with what he did, even though each step in his reasoning about the prior sounds reasonable taken on its own?
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach a seminar on the philosophical foundations of statistical inference, and there's a debate about whether the replication crisis is tied to frequentist methods. A psychology postdoc presented a case where he adjusted his prior after seeing initial results, leading to a supportive posterior. The postdoc argues this is defensible and avoids the pitfalls of NHST. The user feels uneasy but can't pinpoint why.

  First, I need to recall the core issues in the replication crisis: p-hacking, HARKing, selective reporting. These involve flexibility in analysis that inflates false positives. The postdoc claims Bayesian methods prevent this because the prior is explicitly stated. But his process—revising the prior after seeing data—raises red flags.

  I should consider the difference between pre-specification in frequentist vs. Bayesian frameworks. In NHST, changing analyses based on data is problematic. In Bayes, priors are supposed to be set before data collection. But the postdoc revised his prior after seeing unfavorable results, citing a related study. That's similar to HARKing. 

  The key point is whether the prior revision is data-dependent. Even if the related literature exists, using the initial results to inform the prior update introduces bias. It's like moving the goalpost. The prior should be based on existing knowledge, not the current experiment's data.

  I remember concepts like "double-dipping" or "researcher degrees of freedom." In Bayes, this manifests as prior flexibility. Each step might seem reasonable, but the sequence is suspect. The postdoc's final prior is more informative, but the timing suggests confirmation bias.

  The user's unease likely stems from recognizing that the problem isn't the method but the researcher's behavior. Whether frequentist or Bayesian, flexible practices without safeguards lead to inflated effects. Transparency alone doesn't fix it; preregistration and sensitivity analysis are crucial.

  I should also mention solutions: pre-registering priors, using Bayes factors with informed vs. default priors, sensitivity checks. The postdoc's approach lacks these safeguards. His argument overlooks that methodological integrity requires constraints beyond choosing a framework.
answer: |-
  Your unease is entirely justified. The postdoc's approach represents a sophisticated form of Bayesian "researcher degrees of freedom" that replicates, rather than solves, the core problem of contingent flexibility leading to inflated false positives. Here's why:

  1.  **The Ghost of HARKing (Hypothesizing After the Results are Known):**
      *   **The Core Issue:** The fundamental problem in his sequence is the *data-dependent revision of the prior*. He specified Prior A *before* seeing the data. The data under Prior A was unfavorable. He *then* revised to Prior B *after* seeing the unfavorable result, leading to a favorable conclusion.
      *   **Why it's HARKing-like:** This is analogous to HARKing in frequentist contexts. He effectively *changed his prior hypothesis* (or the weight/confidence assigned to it) *based on the outcome of the current experiment*. The "closely related result in the literature" was known *before* he specified Prior A. Why wasn't it incorporated then? The *trigger* for its incorporation was the unfavorable result with Prior A.

  2.  **The Illusion of Objectivity:**
      *   **"More Defensible" is Subjective:** While he argues Prior B is "more defensible," its defensibility is being judged *post-hoc*, specifically *because* it rescued the desired hypothesis. This introduces confirmation bias into the prior justification process. A prior truly defensible *before* seeing the data should have been specified *before* seeing the data.
      *   **The Literature as a Flexible Tool:** The "closely related result" provides a veneer of justification, but the *timing* of its use is suspect. It becomes a tool to justify the desired conclusion after the initial analysis failed, rather than a genuine foundation for pre-data expectations.

  3.  **Replicating the Problem:**
      *   **Contingent Flexibility:** The key driver of the replication crisis is *analytic flexibility contingent on the data outcome*. This is exactly what happened here:
          *   **Step 1:** Run analysis with default/simple prior (A). Result unfavorable.
          *   **Step 2:** Modify the analysis (switch to Prior B) *because* Step 1 was unfavorable.
          *   **Step 3:** Run modified analysis. Result favorable. Publish.
      *   **False Positive Inflation:** This sequence *guarantees* that if the true effect is zero or very small, the researcher is likely to explore different priors until one yields a favorable result. This inflates false positives just as much as p-hacking or optional stopping in NHST. The flexibility has simply moved from p-values and stopping rules to prior specification.

  4.  **Why Transparency Alone Isn't Enough:**
      *   The postdoc might argue that stating both priors and the revision process is transparent. While transparency is essential, it doesn't negate the *bias* introduced by the data-dependent revision. Reporting a flawed process transparently doesn't make the conclusion reliable. Readers need to know *why* Prior B was chosen *after* seeing the data, which inherently weakens the inference.

  5.  **Contrast with Ideal Bayesian Practice:**
      *   **Pre-Specification:** Methodologically robust Bayesian analysis requires *pre-specifying the prior* based *solely* on existing knowledge *before* data collection begins, ideally in a preregistration. Revising the prior *after* seeing the data based on that *same* data is circular.
      *   **Sensitivity Analysis:** The *correct* way to handle uncertainty about the prior is **sensitivity analysis**: pre-specifying a *range* of reasonable priors (e.g., weakly informative, informed by different aspects of the literature) and reporting the results *across that range*. If the conclusion is robust across reasonable priors, it's stronger. If it flips dramatically (as it did here), that signals high sensitivity to prior choice and weak evidence from the data itself.
      *   **Bayes Factors:** If hypothesis testing is the goal, using Bayes Factors (BF) requires extreme care. The BF comparing H1 to H0 depends critically on the prior for the effect size under H1. Changing this prior *after* seeing the data to get a favorable BF suffers from the same inflation problem. Robustness checks across a *pre-specified* range of plausible priors for the effect size under H1 are crucial.

  **Conclusion:**

  The postdoc is incorrect. What he did is **not** methodologically sound Bayesian practice. He relocated the problem of data-contingent flexibility from frequentist p-value hacking to **Bayesian prior hacking**. While Bayesian methods offer powerful tools and philosophical advantages, they are *not* immune to researcher degrees of freedom. The core issue of inflating false positives through *post-hoc* adjustments based on the current data outcome remains.

  **What Should He Have Done?**

  1.  **Pre-Specify:** Base Prior A *fully* on existing literature *before* collecting data. If the "closely related result" existed, it *should* have been incorporated into Prior A.
  2.  **Sensitivity Analysis:** If genuinely uncertain about the prior *before* data collection, pre-specify a *set* of plausible priors (e.g., Prior A: Weakly informative; Prior B: Informed by specific literature X; Prior C: Informed by literature Y). Report results under all.
  3.  **Report Honestly:** If the pre-specified prior yielded an unpromising posterior, report that result. Discuss why it might be surprising given other literature and suggest it warrants further investigation *with pre-specified priors based on that literature*.
  4.  **Preregistration:** Preregister the primary analysis plan, including the intended prior(s), to avoid the temptation of *post-hoc* revision.

  **Your Seminar Point:** This case is a *perfect* illustration for your seminar. It demonstrates that the replication crisis stems less from the *specific statistical paradigm* (Frequentist vs. Bayesian) and more from fundamental issues of **researcher behavior, incentives, and the exploitation of methodological flexibility contingent on data outcomes**. Solving the crisis requires addressing these root causes through practices like preregistration, pre-specification, sensitivity analyses, and a cultural shift towards valuing robustness and transparency over novel, statistically significant findings, regardless of the statistical toolbox used. Bayesian methods offer no magic shield against motivated reasoning.
