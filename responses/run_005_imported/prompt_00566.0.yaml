      *   **Net Change:** `0.80 (worse on R) - 0.01 (better on B) = 0.79 worse`? This contradicts the joke! **Ah, here's the deeper twist: The epistemologist is calculating the *expected score of the new forecast* GIVEN their *original* credence *before* the Mayor's revelation!**
