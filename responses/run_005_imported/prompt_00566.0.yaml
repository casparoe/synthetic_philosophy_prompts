              *   **Increase in Loss on R:** `0.81 - 0.01 = 0.80` (Joke approximates 0.72? Likely a simplification for flow, or using a different base. The point stands: it's a large local loss).
              *   **Decrease in Loss on B:** `0.00 - 0.01 = -0.01` (Joke says "nails it" = -0.00 loss, which is correct for B itself).
              *   **Net Change in Total Loss:** `0.80 (worse on R) - 0.01 (better on B) = 0.79 WORSE`. **Ah, but the joke says *"save 0.28 points"*.** This requires one last layer: comparing the *original forecast's expected loss (0.18)* to the *new forecast's expected loss calculated under the original uncertainty (0.83)* doesn't work. **The "saving" must be the difference between the new forecast's *actual* loss (0.81) and the *hypothetical loss the original forecast would have gotten if `B` were still uncertain* (which wasn't calculated). The simplest resolution is that the *exact numbers in the punchline are slightly fudged for comedic timing and clarity** (e.g., perhaps using `Cr(R)=0.8` makes `0.8^2=0.64`, `0.1^2=0.01`, etc., leading closer to their numbers: Sacrifice ~0.64, Gain ~0.09? Net save ~0.55? Not 0.28). **The core conceptual point remains crystal clear and technically grounded:** The epistemologist is choosing a forecast that they know is locally inaccurate on `R` because, given the *aggregate* scoring and the *specific equivalence*, it gets `B` perfectly right and `R` *less wrong* than the original forecast would have been on `B` *if the world had been different*. The holistic calculation, considering both propositions under the original uncertainty, justifies the seemingly insane `R=0.1` report *even after learning `R=1`* to avoid a catastrophic score on `B` in the other possible world. This absurdity highlights the holistic trade-off Berker objects to.
  3.  **"Joyce would understand / Berker would be furious":** Name-checks the key figures and positions them correctly on the holistic debate within the accuracy-first program.
  4.  **Tragicomic Epistemic Vice:** The epistemologist is acting *rationally* according to the aggregate accuracy norm while clearly violating common sense and basic conditionalization (they ignore the logical implication of `B=0` on `R`!). This creates the comedic dissonance.

