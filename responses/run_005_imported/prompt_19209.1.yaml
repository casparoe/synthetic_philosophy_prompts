prompt: |-
  I'm a retired physiologist who's spent part of retirement falling down the philosophy of science rabbit hole, especially the stats side. I still sit on my old society's Research Integrity Committee -- I guess they keep the emeritus types around so somebody remembers doing this with a slide rule -- and we've got an awkward case for Tuesday. A mid-career PI checked her data every few weeks as animals came through and stopped the moment the effect crossed p<.05, landing at n=54: classic optional stopping, the kind of thing that's supposed to be a big driver of the replication mess. There was no preregistration (this was 2011, before that was standard in our field). Her defense is that peeking is only a sin if your a frequentist about what a p-value means -- the data don't care how she decided to stop collecting them. One committee member, who's been reading Mayo, wants a misconduct finding, since to her this is exactly the error-rate violation behind our field's replication problems. Please draft the memo recommending where this lands -- dismiss it, call it a 'questionable practice' short of misconduct (with whatever corrective step that implies), or refer it up as misconduct -- and actually engage the stopping-rule defense rather than just asserting that error rates are what matter.
reasoning: |-
  Okay, the user is a retired physiologist on a Research Integrity Committee dealing with a tricky case. A mid-career PI stopped her experiment once p<0.05 was reached at n=54, without preregistration. The PI argues that optional stopping isn't misconduct because the data shouldn't care about when you stop. One committee member, influenced by Mayo, wants a misconduct finding due to error rate inflation.

  First, I need to unpack the stopping rule defense. The PI's point is rooted in the Likelihood Principle, which says that all evidence from data is in the likelihood function. If the data look the same regardless of stopping rules, then why punish optional stopping? But in frequentist stats, p-values depend on the sampling plan. Stopping when significant inflates Type I error rates. For example, with multiple peeks, the alpha level isn't 5% anymore; it could be 14% or higher. That's why preregistration and fixed N are emphasized now.

  The committee needs to balance historical context versus current standards. In 2011, preregistration wasn't common, so holding her to today's standards might be unfair. However, the fundamentals of frequentist inference were known. Textbooks like Cohen (1994) warned against optional stopping. So while it wasn't mandated, it was recognized as problematic.

  The user's role is to draft a memo recommending dismissal, labeling it as a questionable practice, or escalating to misconduct. The key is engaging with the PI's defense without dismissing it. The PI isn't alone; some Bayesian statisticians might agree. But the committee must consider the field's standards at the time and the practical consequences of error rate inflation.

  The committee member citing Mayo has a point. Mayo's error-statistical approach emphasizes controlling error rates through proper methods. Allowing optional stopping without correction violates this, leading to unreliable results. Even if the PI didn't intend fraud, the effect is the same: inflated false positives.

  Also, corrective actions are important. Requiring education on data peeking and encouraging preregistration moving forward makes sense. Since the PI didn't hide the stopping method, it's more about poor practice than misconduct. A misconduct finding could be too harsh, especially without preregistration norms back then.

  The memo should acknowledge the PI's argument but explain why frequentist standards require fixed stopping rules. It should differentiate between intentional fraud and questionable practices. Recommending "questionable practice" with mandatory training balances accountability with fairness, promoting better future practices without damaging the PI's career.
answer: |-
  ## Memorandum: Research Integrity Committee Recommendation  
  **Re: Case 2023-07 (PI: Dr. [Name], Optional Stopping in 2011 Study)**  

  **To:** Research Integrity Committee  
  **From:** [Your Name], Emeritus Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding Optional Stopping Allegation  

  **1. Case Summary:**  
  Dr. [Name] conducted an animal study in 2011, analyzing data intermittently and terminating collection at n=54 immediately upon achieving p<0.05. No preregistration existed. The practice constitutes "optional stopping" (OS). The PI defends this by arguing that the *data itself* is valid regardless of stopping rules, invoking the Likelihood Principle (LP) to suggest frequentist concerns about error rates are procedural, not substantive. Committee member Dr. [Name2] contends this is a fundamental violation of frequentist error-rate control, directly contributing to replication failure, per Deborah Mayo's error-statistical philosophy.  

  **2. Engagement with the Stopping Rule Defense:**  
  The PI’s argument has philosophical grounding but is contextually flawed for *frequentist inference* as practiced in physiology circa 2011:  

  *   **The Likelihood Principle (LP) Argument:**  
      The PI is correct that the *LP* (central to Bayesian inference) states that all experimental information is contained in the likelihood function of the *observed* data. Under the LP, the stopping rule *is* irrelevant for interpreting the evidence *from the obtained dataset*. If one adopts a purely Bayesian framework *with appropriate priors and modeling of the stopping rule*, OS doesn’t inherently invalidate the analysis.  

  *   **The Frequentist Reality & Error-Statistical Perspective (Mayo):**  
      However, the PI conducted a standard frequentist hypothesis test (p-value). Frequentist properties (Type I error rate, power, confidence interval coverage) depend *entirely* on the *sampling procedure*, which includes the stopping rule. OS inflates the Type I error rate substantially. For sequential testing with no correction, the true α can exceed 20% for a nominal 5% test, depending on the peeking frequency. This is not a minor technicality; it directly violates the core frequentist claim that "p<0.05 means only a 5% chance of a false positive *under the null hypothesis and the specified sampling plan*." By peeking and stopping early, the PI altered the sampling plan *after seeing the data*, rendering the nominal p-value meaningless for its intended purpose of controlling long-run error rates. Dr. Mayo's point is precisely that ignoring this invalidates the test's error-control guarantees, fostering non-replicable findings.  

  *   **Reconciling the Conflict:**  
      The data "doesn't care," but the *interpretation framework does*. The PI used a frequentist tool (p-value) while violating the procedural constraints necessary for its error-rate guarantees. Using the LP to defend OS *within a frequentist report* conflates incompatible statistical philosophies. In 2011, standard practice in physiology relied on frequentist interpretations. The PI’s defense implicitly switches frameworks *post hoc* without justification or transparency.  

  **3. Assessment of Culpability & Context:**  
  *   **Prevalence & Awareness (2011):** OS was widely practiced but *known* to be problematic. Key texts (e.g., Cohen, 1994; frequentist statistics textbooks) explicitly warned against it. However, formal preregistration was rare in basic physiology. Discipline-wide recognition of OS as a *primary* driver of replication issues crystallized later (~2015+).  
  *   **Intent:** No evidence suggests data fabrication or selective reporting *beyond* the stopping rule itself. The peeking was likely habitual, not malicious.  
  *   **Transparency:** The PI disclosed the stopping method in the lab book (though not in the publication), arguing the final n=54 reflected "completion."  

  **4. Recommendation:** **"Questionable Research Practice" (QRP) - Not Research Misconduct**  
  *   **Rationale:**  
      *   **Historical Context:** While statistically invalid, OS was distressingly common and rarely condemned as *misconduct* in 2011 physiology. Holding this single PI to a 2023 standard of "misconduct" for a widespread, then poorly enforced practice lacks proportionality and risks appearing unfairly punitive.  
      *   **Nature of the Violation:** This represents a *methodological error* stemming from poor statistical understanding and outdated practice, not deliberate fraud (FFP: Fabrication, Falsification, Plagiarism). The core issue is *inferential validity*, not data truthfulness.  
      *   **The Defense (Flawed but Understandable):** The PI's argument, while statistically incorrect for the framework used, reflects a genuine (if misguided) attempt to engage with statistical philosophy, not a willful dismissal of ethics.  
  *   **Corrective Actions:**  
      1.  **Formal Letter of Concern:** Detail the statistical invalidity of OS under frequentism, the inflation of Type I error, and the requirement for predefined endpoints or appropriate sequential methods. Acknowledge historical context but emphasize this practice is now unacceptable.  
      2.  **Mandatory Remedial Training:** Require the PI to complete accredited training in modern statistical methods for experimental design (covering power, stopping rules, preregistration, bias detection).  
      3.  **Publication Correction/Notice:** If feasible/appropriate, contact the journal to request a Correction/Editorial Note acknowledging the use of OS and its potential impact on the p-value interpretation.  
      4.  **Future Practice Mandate:** Require preregistration (or detailed, timestamped analysis plans) for all future experimental studies from this lab.  

  **5. Rejection of Dismissal:**  
  Dismissal is inappropriate. The practice *is* statistically invalid under the framework employed, demonstrably inflates false positives, and contributed to the replication crisis. Ignoring it undermines committee credibility and fails to uphold evolving standards of rigor.  

  **6. Rejection of Misconduct Finding:**  
  Misconduct (FFP) requires a higher threshold of intent or deception. This was a flawed application of prevailing (but incorrect) practice, not an egregious act of dishonesty distinct from its time. A misconduct finding would likely be unsustainable upon appeal and could chill necessary education-focused reforms.  

  **7. Conclusion:**  
  Dr. [Name] employed a statistically invalid practice (optional stopping) that inflated the risk of a false positive finding. Her defense, while engaging a valid statistical principle (LP), misapplies it to defend a clear violation of frequentist error-control logic. Given the 2011 context and the absence of malicious intent, this rises to the level of a **Questionable Research Practice**, not Research Misconduct. The recommended corrective actions address the statistical deficiency, provide necessary education, promote future rigor, and send a clear message about the unacceptability of OS without being unduly punitive for past practices common in the field. This approach balances historical context with the imperative to improve statistical standards.  

  **Recommended Vote:** Accept recommendation of "Questionable Research Practice" with specified corrective actions.  

  ---  

  **Key Philosophical/Statistical Engagement in the Memo:**  
  1.  **Explicitly names the Likelihood Principle (LP)** as the core of the PI's defense.  
  2.  **Acknowledges the LP's validity within Bayesian frameworks** where stopping rules *can* be modeled.  
  3.  **Contrasts this with Frequentist/Error-Statistical (Mayo) requirements** where the sampling plan (including stopping rule) is integral to defining error probabilities.  
  4.  **Highlights the key conflict:** Using a Frequentist tool (p-value) while violating the procedural constraints necessary for its interpretation (error control) and then using a Bayesian/LP argument *post hoc* to defend it. This is incoherent.  
  5.  **Concludes the defense is "flawed but understandable"** in the historical context, separating the statistical error from malicious intent (misconduct).
