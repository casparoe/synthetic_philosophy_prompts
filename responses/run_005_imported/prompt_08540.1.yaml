  ## MEMORANDUM

  **TO:** Frege Lecture Trustees  
  **FROM:** [Your Name], Trustee  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation for Approval of 2024 Frege Lecture Abstract (with Revisions)  

  **BACKGROUND:**  
  This memo concerns the abstract submitted by our invited speaker for the 2024 Frege Lecture, focusing on Frege's 1924 diary and its proposed connection to his philosophical work. Trustee feedback reflects a significant division:  
  *   **Argument FOR Approval:** This topic courageously confronts an uncomfortable but essential aspect of Frege's legacy, exploring potential philosophical continuities (e.g., anti-psychologism, objectivity) with his political extremism. It aligns with the series' mission to foster deep, critical engagement with logic's history, even when challenging.  
  *   **Argument AGAINST Approval:** The approach risks veering into speculative psychobiography, potentially overshadowing Frege's foundational contributions and reducing the lecture's value to controversy-seeking, damaging the series' scholarly reputation.  

  **RECOMMENDATION:**  
  **Approve the talk CONTINGENT on the speaker submitting a revised abstract by [Date - 10 days before printer deadline] that explicitly incorporates the following elements:**  

  1.  **Scholarly Contextualization:** The abstract must clearly frame the argument *within established academic discourse* on this topic (e.g., referencing Dummett's initial concerns, subsequent debates by Weiner, Sluga, etc.), demonstrating it builds upon existing scholarship rather than presenting novel speculation.  
  2.  **Philosophical Primacy:** The abstract must emphasize that the core of the lecture will rigorously analyze *how specific philosophical concepts* (e.g., objectivity, anti-psychologism, the nature of truth) are argued to connect to the political views, not just assert the connection. The primary lens must remain philosophical analysis.  
  3.  **Clarity on Scope & Contribution:** The abstract must precisely articulate the lecture's specific contribution to understanding Frege's *philosophy* and the *history of logic*, avoiding overly broad claims about "the real philosophy" and clearly distinguishing analysis from biographical narrative.  

  **RATIONALE & ENGAGEMENT WITH CONCERNS:**  

  *   **To Trustees Supporting Approval:** This recommendation affirms the vital importance of engaging with Frege's disturbing later writings. Avoiding this topic risks presenting a sanitized history, contrary to our intellectual responsibility. The revisions ensure the lecture delivers on its promise of a *philosophically rigorous* exploration of continuity, moving beyond mere biographical shock value and grounding it squarely in relevant academic debate, strengthening its legitimacy and impact.  

  *   **To Trustees Concerned about Speculation/Controversy:** Your concerns about academic rigor and protecting the series' reputation are valid and taken seriously. A talk focusing *only* on the diary's disturbing content without robust philosophical linkage *would* risk descending into psychobiography and sensationalism. The required revisions directly address these risks:  
      *   Mandating **scholarly contextualization** ensures the argument is presented as a contested but recognized strand within Frege scholarship, not fringe speculation. It signals academic seriousness.  
      *   Requiring **philosophical primacy** guarantees the diary serves as a text for analyzing Frege's *philosophical concepts*, keeping logic and its history central. This prevents the philosophy from becoming a mere footnote to the politics.  
      *   Demanding **clarity on scope** explicitly guards against overreach and ensures the audience understands the lecture's specific philosophical-historical argument, not a general character assassination.  
      *   These requirements transform the lecture from potentially controversial speculation into a disciplined contribution to a difficult but necessary scholarly conversation *about the philosophy itself*.  

  **CONCLUSION:**  
  The 1924 diary presents a profound challenge to Frege's legacy. Ignoring it feels intellectually dishonest, yet handling it poorly risks trivializing both his philosophy and the serious issues it raises. Conditional approval with these specific revisions offers a responsible path forward. It allows us to host a talk confronting a critical, unsettling dimension of logic's history with the scholarly depth our series demands, while directly mitigating the valid concerns about speculation and controversy-mongering. The revised abstract will demonstrate a commitment to philosophical analysis grounded in existing discourse, upholding the series' integrity and educational purpose.  

  **NEXT STEPS:**  
  I recommend we vote on this conditional approval. If approved, I will communicate the revision requirements to the speaker immediately, with a deadline of **[Date - 10 days before printer deadline]** for resubmission. If the revisions are satisfactory, we proceed. If not, we will regrettably need to decline and explore alternative options for this year, though time is extremely tight.  

  I urge us to seize this opportunity to demonstrate how the Frege Lecture series can engage with complex, challenging historical realities with nuance and intellectual rigor.
