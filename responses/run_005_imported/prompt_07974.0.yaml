answer: |-
  ## Memorandum: Policy on Classical Axioms in Capstone Proofs  
  **To:** Capstone Committee, Formal Methods Concentration  
  **From:** Student Representative, Philosophy & Computer Science Double-Major  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Use of Excluded Middle and Choice in Extracted Proofs  

  ### I. Context and Core Conflict  
  The committee must resolve a tension between two valid imperatives:  
  1. **Engineering Integrity:** Extracted code must be executable on its intended inputs (no inert stubs).  
  2. **Proof Flexibility:** Students should leverage efficient reasoning tools where extraction is irrelevant.  

  Last year’s root-finding case illustrates the risk: classical case-splitting (`x < y ∨ x = y ∨ x > y`) broke executability, violating the capstone’s purpose. However, banning *all* classical reasoning risks overcorrection—e.g., forbidding excluded middle in a non-extracted proof of a specification lemma about finite sets.  

  ### II. Guiding Principles  
  1. **Brouwer-Heyting-Kolmogorov (BHK) Interpretation:** Proofs of existence *must* yield witnesses for extracted code.  
  2. **Dummettian Semantics:** Meaning-as-use demands that assertions correspond to verifiable constructions *when computation is required*.  
  3. **Pragmatic Pluralism:** Classical logic remains valid for reasoning about *abstract specifications* if extraction is unaffected.  

  ### III. Recommendation: A Contextual Ban  
  **Classical axioms (excluded middle, choice, or constructively equivalent principles) should be permitted *only* in proofs residing in `Prop` or other non-computational universes, and banned outright in proofs contributing to extracted `Type`-level code.**  

  #### Implementation Rules:  
  1. **`Prop`-Only for Classicality:**  
     - Classical reasoning may be used freely in propositions (`Prop`), e.g., for specification lemmas or non-constructive meta-theorems *not* used to build computational content.  
     - Example: Proving `∃ x, P(x)` classically in `Prop` is acceptable if the witness is *not* extracted.  
  2. **Strict Constructivism in Extracted Code:**  
     - All proofs in `Type` (or `Set`) that contribute to extracted code must be constructive.  
     - Ban: `Import Coq.Logic.Classical_Prop`, `classic`, `choice`, etc., in modules defining computational objects.  
  3. **Documentation Requirement:**  
     - Students must annotate which proofs are intended for extraction and justify any classical axioms in non-extracted proofs.  

  ### IV. Justification  
  1. **Solves the Root-Finding Problem:**  
     By forbidding classical case-splits in computational proofs (e.g., real number comparisons), we ensure extracted code is executable. This upholds the capstone’s goal: *verified, runnable software*.  
  2. **Respects Both Philosophical Positions:**  
     - **Professor A (Constructivist):** Satisfied that extracted code adheres to BHK semantics (proofs ⇔ constructions).  
     - **Professor B (Classical Pragmatist):** Retains classical reasoning for non-computational mathematics, avoiding artificial barriers in specification proofs.  
  3. **Educational Value:**  
     - Teaches students to distinguish *specification logic* (classical OK) from *implementation logic* (constructive required).  
     - Mirrors industry best practices (e.g., using classical axioms in Frama-C specifications but not in C code extraction).  

  ### V. Addressing Concerns  
  - **"This Imposes Metaphysics on Students":**  
    The policy is *procedural*, not doctrinal. It restricts classical logic only where it breaks extraction—a technical constraint. Students learn *why* constructive proofs are necessary for computation without declaring classical math "wrong."  
  - **"Proofs Will Become Too Hard":**  
    Most specification lemmas (e.g., "this finite graph property holds") need not be constructive. For computational lemmas, constructive alternatives exist (e.g., `x <? y` for decidable comparisons). Resources will be provided on constructive analysis libraries (e.g., Coq’s `StdLib` or `Coquelicot`).  

  ### VI. Action Plan  
  1. **Adopt the above policy** for all capstones starting 2024.  
  2. **Provide Training:** Workshop on constructive reasoning in Coq and identifying extraction boundaries.  
  3. **Audit Tool:** Add a CI check to flag classical axioms in `Type`/`Set` during extraction.  

  ---  
  **Endorsed Reasoning:** This policy balances philosophical coherence with practical flexibility. It ensures extracted programs are truly executable while honoring the full scope of mathematical reasoning where computation is not at stake. By contextualizing classical logic, we uphold the capstone’s integrity without dogma.
