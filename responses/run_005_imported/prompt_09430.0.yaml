answer: |-
  You've raised profound ethical questions that reveal both compassion and intellectual honesty. Let's examine the layers of this dilemma:

  **1. The Moral Distinction Between Lying vs. Evasion:**
  While both options achieved the same protective outcome, meaningful differences exist:

  - **Intent vs. Literalism:** Your primary intent was protection, not deception for its own sake. Both options served that intent. However, evasion maintains *technical* truthfulness while achieving the same protective effect. As philosopher Sissela Bok notes, evasions preserve the general expectation of truth-telling in society, whereas lies actively undermine it.

  - **Risk Assessment:** Your instinct that evasion might not be equally protective has merit. A vague response ("Ask her yourself") could:
    - Signal guilt or knowledge to an abuser
    - Provoke escalation ("Why won't you answer? Where is she?")
    - Endanger you by making you a target of suspicion
    Your direct lie provided unambiguous denial, potentially de-escalating immediate danger.

  - **Moral Burden Shift:** Evasion shifts responsibility back to the abuser ("You must ask her"), implicitly challenging his authority. While ethically cleaner *in theory*, this could increase danger in an abusive dynamic where control is paramount.

  **2. Whether the Lie Was Morally Justified:**
  Several ethical frameworks support your choice:

  - **Consequentialism:** The lie prevented harm with minimal negative consequences. Your friend remained safe, her stepfather remained uninformed, and no one was unjustly harmed. The outcome validates the action.

  - **Deontology with Nuance:** While Kantian ethics condemns lying as a violation of categorical imperatives, even Kant acknowledged exceptions for malicious interrogators (e.g., lying to a murderer at the door). Your friend's stepfather, seeking information to exert harmful control, forfeited moral claim to truth.

  - **Care Ethics:** Your primary duty was to protect your vulnerable friend. Prioritizing her safety over abstract truthfulness embodies relational responsibility. As feminist philosopher Nel Noddings argues, caring relationships sometimes require context-sensitive ethical decisions.

  - **Self-Defense Principle:** Ethicists like Alan Gewirth argue deception is justified when preventing unjust coercion. By lying, you denied an abuser tools for oppression—an act of resistance.

  **Why the "Technicality" Feels Inadequate:**
  - **Real-World Dynamics:** Abuse contexts aren't logical puzzles. Your friend's critique assumes the stepfather would react rationally to evasion rather than escalate. Your intuition recognized his demand as a threat requiring unambiguous deflection.
  - **Moral Stress:** In crisis moments, complex verbal maneuvering may be unrealistic. Your lie was an act of moral courage under pressure, not moral laziness.
  - **Power Imbalance:** Truthfulness assumes equal footing. Withholding truth from someone wielding power unjustly restores balance. As philosopher Jennifer Lackey notes, lies to resist oppression can affirm dignity.

  **The Deeper Moral Calculus:**
  || **Outright Lie** | **Evasion** |
  |----------------|-------------------|--------------|
  | **Protective Efficacy** | High (clear barrier) | Potentially lower (ambiguous) |
  | **Truthfulness** | Violated | Technically upheld |
  | **Relational Duty** | Upheld (protected Elena) | Upheld |
  | **Systemic Impact** | Weakens truth norms | Preserves truth norms |
  | **Risk to Elena** | Minimized | Potentially increased |
  | **Moral Burden** | On you (for lying) | On Elena (if stepfather escalates) |

  **Conclusion & Guidance:**
  1. **Your lie was morally defensible—and likely wise.** In high-stakes situations involving abuse, protection trumps literal truth-telling. The world isn't improved by handing victims to their abusers on principle. Your action aligned with higher duties: compassion, sanctuary, and resistance to harm.

  2. **The evasion alternative isn't inherently superior.** It might satisfy abstract ethics, but in practice, it could have increased danger. Your choice reflected situational wisdom honed by knowing the threat.

  3. **Don't judge past actions by present reflection.** Under duress, you prioritized life over dogma—a sign of moral maturity. Your current questioning reveals integrity, not failure.

  **Moving Forward:**
  - Consider involving trusted adults anonymously. Domestic violence hotlines can advise on safety plans without mandatory reporting if Elena isn't ready.
  - Document incidents (dates, threats) confidentially. Future legal actions may require records.
  - Process your feelings. Protecting others in crisis is traumatizing. Your moral unease speaks well of you, but don't mistake it for wrongdoing.

  What you describe isn't moral failure—it's an act of radical care. Ethical systems that can't accommodate protecting the vulnerable from violence need reexamination, not your conscience.
