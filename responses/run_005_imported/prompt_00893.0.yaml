  Working on a piece about how 'the Duhem-Quine thesis' gets thrown around like Duhem and Quine were basically saying the same thing about underdetermination of theory by evidence. Pretty sure thats not quite right though? Can you compare the two properly - like, where does Quine's holism in Two Dogmas actually go further than what Duhem originally argued (I vaguely remember his version was restricted to physics and had some kind of 'good sense' escape hatch)? Basically, in what specific ways is Quine's version more radical, and is it fair that everyone just mashes them into one thesis?
reasoning: |-
  Okay, the user is working on a piece about the Duhem-Quine thesis and how it's often conflated in discussions. They want to clarify the differences between Duhem and Quine's views, especially how Quine's holism in "Two Dogmas" goes beyond what Duhem originally argued. Let me start by recalling the core ideas of both philosophers.

  Duhem, a physicist and philosopher of science, focused on physics. He argued that experiments test a whole group of hypotheses, not single ones. So, when an experiment fails, you can't pin it on one specific hypothesis. But Duhem had limits: he thought this underdetermination was specific to physics, not all sciences. Also, he believed that "good sense" could help scientists decide which hypothesis to adjust. That's his escape hatch.

  Quine, on the other hand, expanded this idea. In "Two Dogmas," he applied holism to all knowledge, not just science. He rejected the analytic-synthetic distinction, meaning no statement is immune to revision. His web of belief includes everything from logic to everyday facts. That's a big jump from Duhem's physics-only scope. Plus, Quine didn't have an equivalent to "good sense"; his underdetermination is more pervasive, with no clear method to resolve it beyond pragmatic choices.

  The user mentions that people mash both into one thesis. I need to highlight why that's problematic. Conflating them ignores Quine's broader application and his rejection of foundationalism. Also, Duhem's "good sense" is a key difference that often gets overlooked.

  The user's deeper need might be to accurately present both theories in their piece, preventing oversimplification. They might also want to show how Quine's radical approach influenced later philosophy, like naturalized epistemology. Ensuring they understand the specific extensions Quine made—scope, no escape hatch, rejection of analyticity—will strengthen their argument. Clarifying these points will help them explain why lumping Duhem and Quine together does a disservice to both.
answer: |-
  You're absolutely right to push back against the conflation of Duhem and Quine. While their ideas share a core insight about **holism** and **underdetermination**, Quine's version in "Two Dogmas of Empiricism" (1951) is significantly more radical and far-reaching than Duhem's original formulation in *The Aim and Structure of Physical Theory* (1906). Mashing them into a single "Duhem-Quine Thesis" often obscures crucial differences. Here's a breakdown:

  **Duhem's Original Argument (Physics-Specific Holism):**

  1.  **Core Insight (Holism of Testing):** An experimental test in physics *never* confronts a single hypothesis in isolation. It confronts a *whole group* of hypotheses:
      *   The specific theory being tested (e.g., Newton's laws).
      *   Auxiliary hypotheses about the experimental setup (e.g., how instruments work, purity of materials).
      *   Initial and boundary conditions.
      *   Ceteris paribus assumptions (other things being equal).
      *   Even the validity of logical and mathematical principles used.
  2.  **Underdetermination:** If the predicted outcome fails, logic dictates only that *at least one element* in this whole group is wrong. It does *not* tell the experimenter *which* one. The physicist faces a choice: modify the core theory, adjust an auxiliary hypothesis, question the setup, or re-examine the data/logic.
  3.  **Crucial Limitations:**
      *   **Scope:** Duhem restricted his holism **explicitly to physics** (and perhaps similar complex theoretical sciences). He believed other sciences (like physiology) or everyday observation involved more direct testing of single propositions. Physics was unique due to its high level of abstraction and mathematization.
      *   **"Good Sense" Escape Hatch:** Duhem argued that while logic alone couldn't pinpoint the error, the physicist possessed **"good sense"** (*bon sens*). This was a non-logical, non-algorithmic faculty – akin to scientific intuition or judgment – guided by experience, simplicity, coherence, and a sense of the "natural" order. "Good sense" could reliably (though fallibly) guide the scientist to blame the auxiliary hypothesis rather than the core theory, or vice versa, *without* needing to test the core theory in complete isolation (which Duhem argued was impossible anyway). This provided a practical way out of underdetermination.

  **Quine's Radicalization in "Two Dogmas" (Universal Epistemic Holism):**

  Quine embraced Duhem's core insight about holism and underdetermination but demolished Duhem's limitations, creating a much more profound and radical picture:

  1.  **Radical Expansion of Scope:** Quine rejected Duhem's restriction to physics. He argued that **our *entire* "web of belief"** faces experience as a whole. This includes:
      *   All sciences (physics, biology, psychology, etc.).
      *   Common-sense observations about the world.
      *   Logic and mathematics.
      *   *Even the analytic/synthetic distinction itself.*
      *   **No Sacred Cows:** *Any* statement, no matter how seemingly foundational (like "2+2=4" or logical laws), is *in principle* revisable if we make drastic enough adjustments elsewhere in the web to accommodate recalcitrant experience. This is the famous rejection of the analytic/synthetic distinction.
  2.  **No "Good Sense" Escape Hatch:** Quine offered **no equivalent to Duhem's "good sense"** as a privileged, reliable guide for resolving underdetermination in specific cases.
      *   **Pragmatism Reigns:** Decisions about what to revise are based entirely on **pragmatic considerations**: conservatism (minimize change), simplicity, fecundity, and overall coherence with the rest of the web. There is *no* deeper foundation or unique "correct" answer dictated by logic *or* a special faculty like "good sense." Different revisions might be equally pragmatically valid, leading to genuine, persistent underdetermination.
      *   **No First Philosophy:** This leads directly to Quine's **naturalized epistemology**. If there's no privileged starting point outside the web of science itself to judge revisions, then the study of how we build and revise our web *becomes* a scientific enterprise (psychology, neuroscience), not a prior philosophical one.
  3.  **Underdetermination is More Profound:** Because the web is universal and includes logic/math, and because pragmatic choices replace "good sense," the *scope* and *persistence* of underdetermination are vastly greater for Quine. It's not just a temporary puzzle in physics; it's a fundamental feature of *all* knowledge acquisition.

  **Key Differences Summarized:**

  | Feature             | Duhem                                     | Quine                                       |
  | :------------------ | :---------------------------------------- | :------------------------------------------ |
  | **Scope**           | Restricted to **Physics**                 | **Entire Web of Belief** (all knowledge)    |
  | **Analytic Truths** | Untouched (Implicitly accepted)           | **Rejected** (No analytic/synthetic divide) |
  | **Logic/Math**      | Implicitly foundational                   | **Revisable** (In principle)                |
  | **Resolution**      | **"Good Sense"** (Non-logical guide)      | **Pragmatic Factors Only**                  |
  | **Underdetermination** | Localized, resolvable (in practice)     | Universal, persistent, fundamental feature  |
  | **Epistemology**    | Traditional (Philosophy guides science)   | **Naturalized** (Science studies itself)    |

  **Is it Fair to Mash Them Together?**

  *   **No, it's often misleading.** Conflating them under a single "Duhem-Quine Thesis" typically:
      *   **Obfuscates Scope:** It hides Quine's radical expansion beyond physics to *all* knowledge, including logic and math.
      *   **Ignores the Analytic/Synthetic Rejection:** This is central to Quine's holism but absent from Duhem.
      *   **Downplays Radicalism:** It glosses over Quine's elimination of any privileged resolution mechanism like "good sense," leaving only pragmatic choices and profound underdetermination.
      *   **Oversimplifies:** It treats a nuanced historical development as a monolithic idea.

  *   **Yes, *cautiously*, for the core insight:** It *is* fair to say both identified **holism** and the consequent **underdetermination of theory by evidence** as fundamental problems. Quine explicitly built upon Duhem's insight. Referring to the "Duhem-Quine problem" or noting "Duhemian-Quinean holism" *while explicitly acknowledging the differences* can be useful shorthand for that shared core.

  **Conclusion:**

  Duhem provided a powerful critique of hypothesis testing in *physics*, highlighting holism and underdetermination but offering "good sense" as a practical resolution within a limited domain. Quine, demolishing the analytic/synthetic distinction, universalized this holism to encompass *all* human knowledge, eliminated any special faculty for resolving conflicts ("good sense"), and grounded revisions solely in pragmatic choices within a seamless web of belief. This resulted in a profoundly more radical and far-reaching thesis concerning the nature of evidence, theory revision, and the very foundations of knowledge. Calling it simply the "Duhem-Quine Thesis" without qualification does a disservice to the distinctiveness and radical implications of Quine's contribution. Your piece is right to tease them apart! Emphasize Quine's **universal scope, rejection of analyticity, revisability of logic/math, and purely pragmatic resolution** as the key radicalizing steps beyond Duhem.
