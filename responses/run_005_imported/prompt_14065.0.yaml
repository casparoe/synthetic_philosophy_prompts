  **Why is this counterintuitive?**
  The neighbor's message only gave information about the relative likelihood within the sunny yards. It did not say anything about the shady yards or the overall likelihood of sunny versus shady. Therefore, one might expect that the overall probability of sunny should remain 0.5. But the update rule (minimizing cross-entropy) has caused a shift: it decreased the probability of the sunny yards and increased that of the shady yards.

