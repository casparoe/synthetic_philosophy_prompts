prompt: |-
  I've owned a cottage on Birch Lake for eleven years, and for the last three I've served as one of five trustees on the water and lake-management district that governs the place -- we set water rates, dock permits, and shoreline rules for about four hundred parcels. Our bylaws, written back in 1968 when this was still basically a summer colony, give exactly one vote per parcel to whoever holds recorded title, regardless of how many people actually live on the property or whether the owner has ever set foot on it. That arrangement made a rough kind of sense when nearly everyone here was both owner and full-time resident, but it no longer describes the place.

  More than a third of our houses are now rented out year-round to tenants who have no ownership interest in the units they occupy, several longtime owners have died and left their parcels to adult children who live out of state and have never seen the lake, and the man who runs the marina just outside our boundary depends entirely on our water-quality decisions for his livelihood despite owning no land inside the line we draw. A group of the year-round tenants has petitioned the board to extend a vote to any adult who has resided in the district for at least twelve months, on the grounds that they are the ones drinking the water and living with the consequences of our decisions, whatever the deed says. Several absentee owners -- including a couple who spend barely six weeks here each summer but reliably vote by mail -- are pushing back hard, arguing that ownership, not residence, is what creates the long-term financial exposure the vote is meant to control, and that tenants have every incentive to vote themselves short-term benefits at the owners' expense and then move away.

  I don't have any background in political theory, just a lot of time spent turning this over at the kitchen table, and what strikes me is that there doesn't seem to be a neutral place to draw this line at all: ownership, residence, being affected by a decision, and paying into the district budget are all real candidates, and whichever one our bylaws currently use was itself chosen by people who were already on the inside of that boundary. I'd like you to write the short memo I'll circulate to my fellow trustees before we vote on the tenants' petition next month. Please recommend a specific, concrete change to our voting rules -- or a deliberate decision to keep the current one -- including how any change would be phased in and by what date, and please take the absentee owners' "no lasting stake" argument seriously rather than waving it away, since at least two of my fellow trustees will raise it and I want something better to say than that renters deserve a voice too.
reasoning: |-
  Okay, the user is a trustee on a lake-management district board facing a voting rights dilemma. They need a memo recommending concrete changes to voting rules, balancing year-round tenant petitions against absentee owner concerns. 

  First, let's unpack the core tension: the 1968 bylaws tie voting to property deeds, but demographic shifts (35% rentals, inherited parcels, affected non-owners) make this outdated. Tenants argue they're directly impacted by water decisions, while absentee owners fear renters might vote for short-term benefits without long-term accountability. 

  The user's hidden challenge is philosophical - they've realized all voting boundaries are arbitrary but need a defensible solution. Their ask is practical: a memo that doesn't just say "renters deserve voice" but substantively addresses the "no lasting stake" counterargument. 

  I'm considering three approaches:
  1) Keep status quo (risks alienating growing tenant population)
  2) Pure residence-based voting (ignores financial exposure)
  3) Hybrid model (best path - gives voice to residents while protecting owners' investments)

  The hybrid solution should:
  - Phase in voting rights for long-term residents (12+ months occupancy)
  - Maintain owner oversight via parcel votes
  - Require residents to demonstrate commitment (tax payments, lease terms)
  - Grandfather existing voters to ease transition

  Key defenses against "no lasting stake":
  - Renters pay water fees too (through rents)
  - 12-month requirement filters transient residents
  - Owners retain ultimate control via property rights
  - Shared oversight actually protects property values

  Implementation should include voter registry audits and a 3-year phase-in. Memo tone must be pragmatic - acknowledge valid concerns while showing how reform strengthens community governance.
answer: |-
  ## Memorandum: Voting Eligibility Reform Proposal  
  **To:** Birch Lake Water & Lake Management District Trustees  
  **From:** [Your Name], Trustee  
  **Date:** October 26, 2023  
  **Subject:** Balancing Stakeholder Representation in District Governance  

  ### Background
  Our current voting system (one vote per parcel, tied solely to recorded title) no longer reflects Birch Lake’s reality. With >35% of parcels occupied by year-round tenants, inherited properties held by distant heirs, and critical stakeholders like the marina operator excluded despite bearing operational risks, our governance structure is misaligned with those most impacted by our decisions. The petition from year-round residents highlights legitimate concerns about democratic deficits. Conversely, absentee owners rightly emphasize that long-term financial liability remains with deed holders.  

  ### Core Principles for Reform
  1.  **Impact & Accountability:** Those subject to daily decisions (e.g., water quality, shoreline rules) deserve input.  
  2.  **Financial Stake:** Deed holders bear ultimate fiscal responsibility for district assessments/infrastructure.  
  3.  **Stability & Commitment:** Voting power should correlate with enduring ties to the community.  

  ### Recommended Solution: A Hybrid Voting Model  
  **Proposal:** Adopt a **"Parcel Vote + Occupant Vote"** system, phased in over three years:  

  1.  **Each Parcel Retains One (1) "Ownership Vote":**  
      *   Exercised by the recorded title holder(s) or their designated legal proxy.  
      *   Ensures direct representation for those bearing long-term financial liability.  

  2.  **One (1) "Resident Vote" Per Parcel for Eligible Occupants:**  
      *   **Eligibility:** Any adult (18+) who is the *primary resident* of a district parcel for **twelve (12) consecutive months** or more, *and* is listed on a lease of **12+ months duration** or provides proof of permanent residency (e.g., driver's license, tax filings).  
      *   **Activation:** The Resident Vote is *only* activated if a qualifying occupant resides on the parcel. It is *exercised by that qualifying occupant*, not the owner.  
      *   **Exclusivity:** Only one Resident Vote is allocated per parcel, regardless of the number of occupants. Occupants must collectively designate one voter per parcel via a simple district registration form.  

  3.  **Non-Parcel Stakeholder Voice (Advisory):**  
      *   Businesses/individuals materially affected by district decisions (e.g., marina operator) may be granted non-voting *Advisor* status. They receive all board materials and can speak at hearings but do not vote.  

  ### Addressing the "No Lasting Stake" Concern Directly  
  The absentee owners raise a valid point: renters lack direct, lasting financial exposure equivalent to ownership. This proposal directly addresses this:  
  *   **Owners Retain Control:** The Ownership Vote safeguards the core financial stake. No owner loses their existing vote.  
  *   **Resident Vote Requires Commitment:** The 12-month residency and lease term requirements filter out transient occupants, ensuring voters have a demonstrated, stable connection to the community and its long-term well-being.  
  *   **Shared Incentives:** Long-term tenants *do* have a stake – their quality of life, health (water), and community stability. Their vote is tied to the *parcel*, not an individual, aligning their interests with the property's condition. Destructive short-termism would harm their own living environment.  
  *   **Accountability:** Resident voters are identifiable and registered, creating accountability within the community.  

  ### Phased Implementation & Timeline  
  *   **January 1, 2024:** Adopt amended bylaws incorporating the Hybrid Model.  
  *   **January - March 2024:** Establish a secure registration process for Resident Voters (proof of residency, lease, occupant designation form). Audit existing voter rolls.  
  *   **April 1, 2024:** Resident Vote eligibility begins (residency clock starts for new tenants/occupants).  
  *   **January 1, 2025:** **First Eligible Resident Votes Cast.** (Requiring 12 months residency from April 1, 2024, or proof of prior 12+ month residency as of Jan 1, 2024).  
  *   **Ongoing:** Annual verification of Resident Voter eligibility (e.g., lease renewal, utility bill).  

  ### Why This Approach?  
  *   **Balanced:** Recognizes *both* the financial stake of owners *and* the lived experience of long-term residents.  
  *   **Practical:** Maintains a manageable voter count (max 2 votes/parcel). Avoids complex fractional votes or disenfranchising existing voters.  
  *   **Stable & Phased:** Grandfathers current voters while smoothly integrating new stakeholders. The 12-month requirement ensures commitment.  
  *   **Legally Defensible:** Ties voting to tangible connections (deed/long-term residency) and maintains a clear link to the parcel-based district structure.  
  *   **Strengthens Governance:** Incorporates the perspectives of those most directly impacted by daily decisions, leading to more informed and sustainable outcomes that protect both property values and community health.  

  ### Recommendation
  I move that we amend the district bylaws to adopt the Hybrid Voting Model outlined above, with implementation phased according to the proposed timeline. This reform acknowledges our community's evolution while respecting the legitimate interests of all stakeholders – ensuring Birch Lake's governance remains effective, equitable, and grounded in shared responsibility for our shared resource.  

  I welcome discussion on the specific thresholds and implementation details. Let's ensure Birch Lake remains a vibrant community for owners and residents alike.
