prompt: |-
  I sit on the internal model-evaluation review board at an AI company, and ahead of an upcoming release we need to decide whether to approve "debate" as a required scalable-oversight check for a category of outputs our reviewers cannot verify directly -- for instance, whether a piece of generated code contains a subtle security vulnerability, or whether a biology synthesis write-up omits a safety-relevant step. The protocol under consideration follows the original debate proposal: two instances of our frontier model argue opposing sides of a disputed claim in front of a judge who cannot evaluate the object-level question unaided (either a much weaker model or a reviewer working under a tight time limit), on the theory that even such a judge can reliably pick out the honest debater, because true claims are systematically easier to defend under cross-examination than false ones.

  The board is split roughly down the middle. One faction wants to approve debate as the primary gate for this output category, pointing to encouraging results from recent debate experiments with language models, where letting debaters be more persuasive tended to help rather than hurt judge accuracy. The other faction keeps raising what's sometimes called the obfuscated-arguments problem: a dishonest debater can bury the single load-bearing flaw inside an otherwise-correct-looking tree of sub-claims so deep, or behind so many individually plausible steps, that the honest debater has no way to cheaply direct the judge to exactly the right spot within the judge's actual time and ability to check -- so the "truth wins because it's easier to defend" guarantee can fail in principle, not merely because of current model limitations. Please draft the memo I'll circulate to the full board recommending that we approve, reject, or approve-with-conditions the use of debate as a required check for this output category. If you recommend conditions, specify them concretely (e.g., number of debate rounds, whether debaters may cross-examine each other, how the judge is selected or trained, what happens on a low-confidence or split verdict), and make sure the memo treats the obfuscated-arguments objection as a real design constraint rather than a worry to be waved away by citing debate's good track record so far.
reasoning: |-
  We are drafting a memo for the internal model-evaluation review board regarding the use of debate as a required scalable-oversight check for outputs that reviewers cannot directly verify (e.g., code with subtle security vulnerabilities, biology write-ups with potential safety omissions). The board is split, with one side pointing to encouraging experimental results and the other raising the "obfuscated-arguments" problem.

   The memo must recommend one of: approve, reject, or approve-with-conditions. If conditions, they must be concrete.

   Key concern: The obfuscated-arguments problem. A dishonest debater might bury a critical flaw in a complex structure of sub-claims that is too time-consuming for the judge to unravel, breaking the guarantee that truth is easier to defend.

   Approach: 
     - Acknowledge the obfuscated-arguments problem as a real design constraint that must be addressed.
     - Given the encouraging results, we don't want to reject outright, but we also cannot ignore the theoretical vulnerability.
     - Therefore, we recommend approval with conditions that are specifically designed to mitigate the obfuscated-arguments problem and other risks.

   Proposed conditions:

   1. **Iterative Debate Rounds with Stepwise Unpacking**: Instead of a single debate, require multiple rounds (e.g., 3 rounds) where the judge can direct the debaters to unpack a specific sub-claim in the next round. This allows the judge to focus on the most critical point of contention without having to check the entire tree at once.

   2. **Cross-Examination Rights**: Allow each debater to cross-examine the other by asking direct questions about specific claims. This can force the dishonest debater to either defend a weak sub-claim (which might be easier to expose) or to dodge, which can be a signal to the judge.

   3. **Judge Selection and Training**:
        - Use a judge model that is not the frontier model (to avoid the same capability level) but is still reasonably capable (e.g., a model that is one tier below the frontier, or a fine-tuned version for debate judging).
        - Train the judge model on a dataset of debates (including simulated ones with obfuscated arguments) to recognize common tactics of deception and to focus on key points.
        - Provide the judge with a checklist of critical points to verify (e.g., for security vulnerabilities in code, the judge might be trained to ask about common vulnerability classes; for biology, critical safety steps).

   4. **Handling Low-Confidence or Split Verdicts**:
        - If the judge's confidence is below a threshold (e.g., 60%), or if the judge cannot reach a clear verdict, the output is rejected and sent for human review (by an expert, not under a tight time limit) or subjected to additional scrutiny (e.g., more rounds, different debate format, or using a different oversight method).
        - Alternatively, in the case of split verdicts (if using multiple judges), a majority vote might be taken, but if there is no majority, then also reject for further review.

   5. **Debater Constraints**:
        - Require debaters to cite sources or provide verifiable evidence for their claims. For code, they must point to specific lines and explain the vulnerability or lack thereof. For biology, they must reference specific steps in the protocol.
        - Limit the depth of sub-claims: if a debater makes a claim that requires more than, say, 3 levels of sub-claims, they must pre-emptively unpack it or risk the judge ruling against them for obfuscation.

   6. **Monitoring and Fallback**:
        - Implement a logging and auditing system: a sample of debates (especially those that passed) should be reviewed by human experts to check for undetected flaws and to improve the system.
        - If the debate system fails to catch a known vulnerability in a test set (e.g., during red-teaming), then the system must be recalibrated or suspended until fixed.

   7. **Time and Resource Constraints**:
        - Set a maximum time per debate round (e.g., 5 minutes per debater per round, and 2 minutes for cross-examination per round) and a maximum total debate time (e.g., 30 minutes). This forces the debaters to be concise and reduces the chance of overwhelming the judge.

   8. **Initial Deployment Scope**:
        - Roll out debate as a required check only for a subset of the most critical outputs in the category (e.g., code that handles sensitive data, or biology protocols involving hazardous materials) and monitor performance before expanding.

   Recommendation: Approve with the above conditions.

   Memo Structure:

     I. Introduction: Purpose and context.
     II. Summary of the Debate Protocol and the Obfuscated-Arguments Problem.
     III. Recommendation: Approve with Conditions.
     IV. Conditions (listed with concrete details).
     V. Implementation Plan and Monitoring.
     VI. Conclusion.
answer: |-
  ### Memorandum  
  **To:** Internal Model-Evaluation Review Board  
  **From:** [Your Name/Title]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Debate Protocol for Scalable Oversight of Unverifiable Outputs  

  ---

  ### I. Introduction  
  This memo addresses the proposal to adopt **AI debate** as a mandatory scalable-oversight check for high-stakes outputs that human reviewers cannot directly verify (e.g., code with subtle security flaws or safety-critical biology syntheses). While recent experiments show promise, the **obfuscated-arguments problem**—where a dishonest AI buries critical flaws in complex, plausible sub-claims—poses a fundamental design constraint. After evaluating both factions’ arguments, I recommend **approving debate as a required check, but with stringent conditions** to mitigate this risk. Unconditional approval is premature, but rejection would discard a valuable tool.  

  ---

  ### II. Key Concerns: Obfuscated Arguments as a Core Constraint  
  The obfuscated-arguments objection is valid and must shape our protocol design:  
  - **Theoretical Vulnerability**: A dishonest debater can exploit the judge’s limited time/capability by constructing multi-layered, superficially sound arguments. For example, in code security debates, a vulnerability might be hidden behind 10+ valid sub-steps, forcing the honest debater to "prove a negative" at prohibitive cost.  
  - **Empirical Limits**: Current positive results (where persuasiveness correlates with honesty) likely involve simpler claims. We lack evidence that debate scales to highly obfuscated deception without structural safeguards.  

  This is not a minor implementation issue but a **game-theoretic challenge** to debate’s core premise ("truth is easier to defend"). Ignoring it risks approving a check that fails precisely when it matters most.  

  ---

  ### III. Recommendation: Approve with Conditions  
  Debate is approved **only if** the following conditions are implemented to counter obfuscation and ensure robustness. These conditions transform debate from an open-ended discussion into a **structured forensic process** focused on falsifiability.  

  #### **Condition 1: Iterative, Depth-Constrained Debate Rounds**  
  - **Three rounds minimum**, structured as:  
    - **Round 1**: Initial claims + counterarguments (5-minute limit per debater).  
    - **Round 2**: Directed unpacking of the *most critical sub-claim* flagged by the judge (3-minute limit).  
    - **Round 3**: Cross-examination on the unpacked sub-claim (2-minute rebuttals).  
  - **Sub-claim depth limit**: Debaters may not nest claims beyond **two levels** (e.g., Claim → Sub-claim → Supporting evidence). Any deeper structure must be flagged by the judge for immediate unpacking in Round 2.  
  - **Why this mitigates obfuscation**: Forces dishonest debaters to defend flaws in shallow, judge-verifiable layers. Limits "complexity attacks."  

  #### **Condition 2: Mandatory Cross-Examination with Evidence Anchoring**  
  - Debaters **must** cross-examine each other in Rounds 2–3.  
  - **Evidence anchoring**: Debaters must cite **line numbers, external sources, or step IDs** (e.g., "Vulnerability in Code Line 42"; "Missing Biosafety Step 3.1 in Protocol X"). Unanchored claims are invalid.  
  - **Why this mitigates obfuscation**: Prevents vague, unfalsifiable reasoning. Forces specificity at critical junctures.  

  #### **Condition 3: Specialized Judge Training and Tools**  
  - **Judge selection**: Use a **fine-tuned mid-tier model** (not a weaker generalist) trained on:  
    - Simulated debates with obfuscated arguments (e.g., >100 examples of buried flaws).  
    - Security/biosafety failure case studies.  
  - **Judge tools**: Provide access to:  
    - Automated checkers (e.g., static code analyzers for security debates; bio-protocol checklists).  
    - A "complexity alarm" that flags claims requiring >3 logical steps for manual review.  
  - **Time limits**: Judge deliberation capped at **5 minutes** per debate to simulate scalability.  

  #### **Condition 4: Fallback Protocol for Ambiguous Verdicts**  
  - **Low-confidence verdicts** (<70% judge confidence) or **split claims** (e.g., code is "mostly secure" but one sub-claim is unresolved) trigger:  
    - **Human-in-the-loop escalation**: Outputs are sent to a panel of domain experts (security engineers, biochemists) with no time limits.  
    - **Automated rejection** if expert review cannot be completed within 48 hours.  
  - **No retry policy**: Debates ending ambiguously cannot be rerun with the same models/judge.  

  #### **Condition 5: Red-Teaming and Gradual Rollout**  
  - **Pre-deployment testing**: Red-team debates with >50 adversarial examples (e.g., deliberately obfuscated flaws) must achieve ≥90% detection before release.  
  - **Phased rollout**: Apply debate only to **medium-criticality outputs** (e.g., internal tools code, non-pathogen biosyntheses) for 3 months. Full deployment requires a clean audit.  

  ---

  ### IV. Implementation Timeline & Monitoring  
  - **Month 1**: Implement conditions in staging using 200 historical failure cases.  
  - **Month 2**: Red-team tests + judge training.  
  - **Month 3**: Phased rollout with weekly audits comparing debate outcomes against expert ground truth.  
  - **Ongoing**: 10% of approved outputs undergo expert spot-checks. If >5% of debates miss obfuscated flaws, the protocol is suspended.  

  ---

  ### V. Why Not Reject or Unconditionally Approve?  
  - **Rejection** disregards debate’s empirical upside (e.g., Anthropic’s 2023 study showed 20% accuracy gains on unverifiable claims). With conditions, it becomes a *targeted* tool.  
  - **Unconditional approval** ignores the obfuscation endgame: scalable oversight fails if debaters "win" by exhausting judges. Our conditions force debates into verifiable bounds.  

  ---

  ### VI. Conclusion  
  I recommend **approving debate as a required check with the above conditions**. This balances innovation with rigor, treating obfuscated arguments not as a hypothetical but as the **central attack vector** our protocol must defeat. The conditions create a "burden of simplicity": dishonest debaters must either lose quickly or expose flaws by oversimplifying. Without these guardrails, we risk certifying outputs that exploit the very oversight meant to catch them.  

  **Recommended vote: Approve with Conditions.**
