  ### Constructed Game for Iterated Elimination of Dominated Strategies

  Consider the following two-player game with Player 1 (row player) and Player 2 (column player). Player 1 has three pure strategies: \(A1\), \(A2\), and \(A3\). Player 2 has three pure strategies: \(B1\), \(B2\), and \(B3\). The payoff matrices are given below, with Player 1's payoffs first and Player 2's payoffs second in each cell.

  #### Full Payoff Matrices

  **Player 1 Payoffs (Row Player):**

  |          | \(B1\) | \(B2\) | \(B3\) |
  |----------|--------|--------|--------|
  | **\(A1\)** | 4      | 0      | 0      |
  | **\(A2\)** | 0      | 4      | 0      |
  | **\(A3\)** | 0      | 0      | 5      |

  **Player 2 Payoffs (Column Player):**

  |          | \(A1\) | \(A2\) | \(A3\) |
  |----------|--------|--------|--------|
  | **\(B1\)** | 2      | 1      | 1      |
  | **\(B2\)** | 1      | 2      | 1      |
  | **\(B3\)** | 0      | 0      | 0.5    |

  #### Step-by-Step Iterated Elimination

  1. **Initial Game (No Domination for Player 1's \(A3\)):**
     - Examine Player 1's pure strategy \(A3\):
       - Against \(B1\), \(A3\) yields 0, which is less than \(A1\)'s 4, but not dominated by \(A1\) because against \(B3\), \(A1\) yields 0 while \(A3\) yields 5.
       - Against \(B2\), \(A3\) yields 0, which is less than \(A2\)'s 4, but not dominated by \(A2\) because against \(B3\), \(A2\) yields 0 while \(A3\) yields 5.
       - Now consider mixed strategies of Player 1. Let \(\sigma = p \cdot A1 + (1-p) \cdot A2\) for \(p \in [0,1]\).
         - Payoff against \(B1\): \(u_1(\sigma, B1) = p \cdot 4 + (1-p) \cdot 0 = 4p\)
         - Payoff against \(B2\): \(u_1(\sigma, B2) = p \cdot 0 + (1-p) \cdot 4 = 4(1-p)\)
         - Payoff against \(B3\): \(u_1(\sigma, B3) = p \cdot 0 + (1-p) \cdot 0 = 0\)
       - Compare to \(A3\):
         - Against \(B3\), \(u_1(A3, B3) = 5 > 0 = u_1(\sigma, B3)\), so \(\sigma\) does not strictly dominate \(A3\) for any \(p\).
       - Since no pure or mixed strategy yields a higher payoff than \(A3\) against all of Player 2's strategies (specifically, \(A3\) is strictly better against \(B3\)), \(A3\) is not strictly dominated in the original game.

  2. **Eliminate Player 2's Strictly Dominated Strategy \(B3\):**
     - Examine Player 2's pure strategy \(B3\):
       - Against \(A1\), \(B3\) yields 0, while \(B1\) yields 2 and \(B2\) yields 1. Thus, \(B3\) is worse than both \(B1\) and \(B2\).
       - Against \(A2\), \(B3\) yields 0, while \(B1\) yields 1 and \(B2\) yields 2. Again, \(B3\) is worse.
       - Against \(A3\), \(B3\) yields 0.5, while \(B1\) yields 1 and \(B2\) yields 1. Since 0.5 < 1, \(B3\) is worse.
       - \(B3\) is strictly dominated by pure strategies \(B1\) or \(B2\) (or any mixed strategy involving them). For example:
         - \(B1\) strictly dominates \(B3\): \(u_2(B1, A1) = 2 > 0 = u_2(B3, A1)\), \(u_2(B1, A2) = 1 > 0 = u_2(B3, A2)\), and \(u_2(B1, A3) = 1 > 0.5 = u_2(B3, A3)\).
       - Eliminate \(B3\). The reduced game has only Player 2's strategies \(B1\) and \(B2\).

  3. **Reduced Game (After Eliminating \(B3\)):**
     - Player 1's payoffs against remaining strategies:
       |          | \(B1\) | \(B2\) |
       |----------|--------|--------|
       | **\(A1\)** | 4      | 0      |
       | **\(A2\)** | 0      | 4      |
       | **\(A3\)** | 0      | 0      |
     - Now, \(A3\) yields 0 against both \(B1\) and \(B2\).
     - Consider a mixed strategy \(\sigma = 0.5 \cdot A1 + 0.5 \cdot A2\):
       - Against \(B1\): \(u_1(\sigma, B1) = 0.5 \cdot 4 + 0.5 \cdot 0 = 2 > 0 = u_1(A3, B1)\)
       - Against \(B2\): \(u_1(\sigma, B2) = 0.5 \cdot 0 + 0.5 \cdot 4 = 2 > 0 = u_1(A3, B2)\)
       - Thus, \(\sigma\) strictly dominates \(A3\).
     - No pure strategy dominates \(A3\):
       - \(A1\) against \(B2\) yields 0, equal to \(A3\)'s 0 (not strictly better).
       - \(A2\) against \(B1\) yields 0, equal to \(A3\)'s 0 (not strictly better).
     - Therefore, \(A3\) is strictly dominated by the mixed strategy \(\sigma\) in the reduced game.

  #### Why Elimination of Player 2's Strategies Creates New Domination
  The elimination of Player 2's strategy \(B3\) causes Player 1's strategy \(A3\) to become strictly dominated because:
  - In the original game, \(A3\) was not strictly dominated due to its strong performance against \(B3\) (payoff of 5). This "protected" \(A3\) from domination, as any competing pure or mixed strategy of Player 1 performed worse against \(B3\) (e.g., payoff of 0 for mixtures of \(A1\) and \(A2\)).
  - After eliminating \(B3\), the scenario where \(A3\) excels is removed. In the reduced game (only \(B1\) and \(B2\)), \(A3\) performs poorly (payoff of 0 against both), while mixtures of \(A1\) and \(A2\) perform well (e.g., payoff of 2 against each). Thus, the mixed strategy now dominates \(A3\).
  - Crucially, the change depends on eliminating Player 2's strategy, not Player 1's. If a Player 1 strategy were eliminated first (e.g., \(A1\) or \(A2\)), it would not affect the dominance relation for \(A3\) because:
    - \(A3\)'s vulnerability only arises when \(B3\) is gone, and \(B3\) is eliminated based on Player 2's payoffs, not Player 1's actions.
    - Eliminating a Player 1 strategy might remove a potential dominator but would not create the condition where \(A3\) is uniformly worse against the remaining Player 2 strategies. In this case, no Player 1 strategy is dominated initially, so elimination starts with Player 2.

  In summary, the elimination of Player 2's \(B3\) removes the strategy against which \(A3\) was uniquely strong, exposing \(A3\)'s weakness against the remaining strategies and allowing a mixed strategy to dominate it. This demonstrates how iterated elimination of dominated strategies for one player can reveal new dominations for the opponent.
