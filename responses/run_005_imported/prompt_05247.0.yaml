  ### Scoring Logic:
  **Exploitation** (Capital Vol.1):  
  - 0 = No surplus value extraction  
  - 10 = Maximal surplus appropriation  
  - *Gig/YouTube nuance*: Scores reflect platform capitalism's indirect extraction (fees/ads) + cost externalization  

  **Alienation** (1844 Manuscripts):  
  - 0 = No estrangement from product/labor/species-being/others  
  - 10 = Total disconnection from work's purpose/humanity  
  - *Key factors*: Creative control, ownership, task meaningfulness, social relations  

  ### Why Your Roommate's Wrong:  
  Gig work's "independent contractor" status doesn't negate exploitation:  
  1. Platforms control pricing/labor conditions → **structural domination**  
  2. Your labor generates platform value → **surplus appropriation**  
  3. "Flexibility" masks **wage precarity** (you absorb risks/costs)  

  Marx's alienation resonates because you're disconnected from:  
  - The **product** (delivery as abstract transaction)  
  - The **process** (app-controlled routes/ratings)  
  - Your **human potential** (skills don't develop meaningfully)  
  - Other **humans** (customers/restaurants as ratings, not relationships)  

  The core issue: *Contractual form* ≠ *economic substance*.
