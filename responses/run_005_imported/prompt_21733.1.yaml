prompt: |-
  Hey, so this semester I'm TAing the intro proof-based linear algebra course in my department (the one where everyone meets infinite-dimensional vector spaces for the first time), and I'm also taking the grad-level axiomatic set theory elective, where we just spent two whole lectures picking apart Zorn's Lemma, the well-ordering theorem, and the rest of the AC-equivalent zoo. Its honestly made me way less confident grading "apply Zorn's Lemma" proofs than I used to be, since now I keep clocking all the ways these things can go subtly wrong even when the overall shape of the argument looks totally standard.

  Anyway, I've got a stack of homeworks to grade and want a second opinion on one before I commit to a score. The question (worth 10 points) was: "Let V be a vector space over a field F, not necessarily finite-dimensional. Using Zorn's Lemma, prove that V has a basis." Here's the student's answer, copied over pretty much as submitted:

  "Let S be the collection of all linearly independent subsets of V, partially ordered by inclusion. S is nonempty since the empty set is vacuously linearly independent, so ∅ ∈ S.

  Let C be a chain in S, and let U be the union of all the sets in C. Clearly every A in C satisfies A ⊆ U, so it suffices to show U is linearly independent to conclude U is an upper bound for C in S. Since C is a chain, for any two sets A, B in C we have A ⊆ B or B ⊆ A, so A ∪ B is just whichever of A, B is bigger, which is linearly independent. Since this holds for every pair of sets in C, the full union U is built up out of these pairwise unions and so is linearly independent too. Hence U ∈ S and C has an upper bound.

  Since every chain in S has an upper bound in S, Zorn's Lemma tells us S has a maximum element B, i.e. a linearly independent subset of V that contains every other linearly independent subset of V as a subset.

  Now I claim B spans V, which together with independence makes it a basis. Suppose not, so there's some v in V with v not in span(B). I claim B ∪ {v} is linearly independent: if cv + c_1b_1 + ... + c_nb_n = 0 is a nontrivial relation with the b_i in B, then c can't be 0 (else we'd have a nontrivial dependence among the b_i, contradicting independence of B), so we can solve v = -(1/c)(c_1b_1+...+c_nb_n), putting v in span(B), a contradiction. So B ∪ {v} is a linearly independent set strictly bigger than B. But B contains every linearly independent subset of V, so no linearly independent set can be strictly bigger than B. Contradiction, so B spans V, and B is a basis for V."

  Could you grade this as if you were me? I want an actual score out of 10 and a letter grade, but mainly I want the reasoning spelled out point by point instead of a vibes-based "looks good to me" -- go through the setup, the chain/upper-bound argument, the invocation of Zorn's Lemma itself, and the final spanning argument seperately, and flag anything that's technically imprecise or unjustified, not just outright wrong. If you can, put the step-by-step part in a JSON object (a short comment plus points-earned/points-possible for each step), then give the total score and letter grade at the end.
