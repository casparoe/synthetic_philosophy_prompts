  The user mentions this isn’t like timing conception naturally because the embryos already exist as distinct entities. That’s a key point. In natural conception, choosing when to conceive might affect which sperm and egg meet, leading to a different genetic child. But with IVF, the embryos are already created, so the selection is between existing potential individuals. The user is wondering if this changes the moral obligations.

  I should consider philosophical concepts like person-affecting morality versus non-identity problem. The non-identity problem, from Derek Parfit, is relevant here. It asks whether choices that affect who exists can be judged as harmful if the person wouldn’t exist otherwise. For example, selecting an embryo without Huntington’s means the child born wouldn’t exist if the affected one was chosen instead. Since the unaffected child has a life worth living, not choosing them doesn’t harm them because they’d never exist to be harmed. Conversely, choosing an affected embryo would create a child who suffers, which could be seen as a harm inflicted by that choice.

