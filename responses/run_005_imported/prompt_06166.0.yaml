answer: |-
  Your reconstruction is impressively precise and captures the core tension between Rortyan pragmatism and rationalist representationalism. You've avoided strawmanning Rorty – your characterization aligns closely with his arguments in *Contingency, Irony, and Solidarity* and his engagement with Davidson/Putnam. Here's a breakdown addressing your specific questions:

  1.  **Fairness of Representation:**
      *   **Spot On:** You correctly identify the fundamental divergence: Rorty *does* deny the existence of any "joint-having world sitting outside every vocabulary, ready to be fit" as an explanatory backstop. For Rorty, the idea of "mind-independent structure" or "real causal joints" *independent of description* is precisely the representationalist illusion he attacks. He sees "reality" as what we can talk about *within* our vocabularies, not something *outside* language that language "fits."
      *   **The Core Move:** Your phrase "the picture of a joint-having world... is itself an artifact of the representationalist picture" perfectly encapsulates Rorty's position. He argues that the very *demand* for a scheme-independent reality, the "backstop," is generated by the representationalist framework itself. Abandoning the framework means abandoning the demand.
      *   **Rationalist Relocation:** You're also correct that the Sequences relocate correspondence to the conceptual scheme level (tracking mind-independent structure). Rorty rejects *this too* as still smuggling in the representationalist core – the idea that the *scheme's* value lies in its correspondence to something non-human, non-purposive. For Rorty, a scheme's value is purely its utility for *our* purposes (solidarity, prediction, coping), full stop.

  2.  **The Differential-Success Objection & Rorty's Response:**
      *   **Your Characterization is Accurate:** You've nailed the standard objection (Putnam, Searle, et al.) and Rorty's *actual* response. He *does* see the demand for a vocabulary-transcendent explanation of physics' predictive success as a relapse into representationalism. His considered response *is* essentially: "We care about prediction, physics vocabularies are currently the best tools we have for that purpose. That's the explanation. Asking *why* they are the best tools *in a way that appeals to something beyond our practices and purposes* is asking an incoherent question from a discarded framework."
      *   **Is it Defensible or a Dodge?** This is the crux. Whether it's defensible depends on your meta-philosophical commitments.
          *   **As a Well-Dressed Refusal:** Critics argue it *is* a dodge. They claim Rorty provides a sociological/historical *description* of *how* we came to privilege prediction and physics, but fails to provide a *normative* or *explanatory* account of *why* this particular vocabulary *works so much better* for that purpose than, say, astrology. They see this explanatory gap as fatal, leaving pragmatism unable to account for the apparent *robustness* and *objectivity* of scientific success. "It works for us" feels insufficient against the sheer weight of predictive efficacy across contexts and cultures.
          *   **As a Defensible Flag-Planting:** Rortyan pragmatists argue the demand *itself* is illegitimate. They insist:
              *   **Genealogy over Ontology:** The "why" question only makes sense *within* a representationalist ontology. Once you abandon that ontology, the question dissolves. Explaining *how* we developed these successful tools (through contingent historical processes of trial, error, and social justification) *is* the full explanation.
              *   **No "Better" Beyond Purpose:** "Works better" only means "serves *our* specific, contingent purposes (like prediction, control, coherence) better." There is no "better" simpliciter, independent of human interests. The success of physics *is* its instrumental value for *our* goals, not evidence of mirroring a transcendent structure.
              *   **Redescription is the Point:** Insisting that "redescription is not explanation" *presupposes* that only a representationalist explanation counts. For the pragmatist, the redescriptive account *is* the complete explanation – it tells us all we can meaningfully say about the phenomenon.
              *   **The Danger of Reification:** Attempting a deeper explanation inevitably reifies our current successful practices or posits an inaccessible "reality" they track, both moves pragmatism rejects as unhelpful metaphysics.

  3.  **Genuine Rortyan Answers Beyond Simple Refusal?**
      While the core response *is* the refusal of the demand's premise, Rorty and neo-pragmatists offer more fleshed-out redescriptions that address the *phenomenon* without conceding the representationalist framework:
      *   **Darwinian/Neurathian Metaphor:** Physics vocabularies are tools that have survived rigorous competitive testing against other tools within the contingent project of prediction/control. They are the best we've *built so far* through a messy, social, fallible process of tinkering on the boat while at sea. Their success is explained by the evolutionary pressure of our practical needs and the harsh "friction" of experience, not correspondence to noumenal joints.
      *   **The "Friction" of Experience (without Representationalism):** Rorty (drawing on Davidson/Dewey) allows that there is a causal impact from a non-linguistic world ("reality" in a minimal, causal sense) that constrains our beliefs. We bump up against things. However, this "friction" doesn't dictate *how* we describe it. Physics vocabularies are successful because they offer descriptions that *reliably mediate* our interactions with this source of friction *for specific purposes*. The "friction" explains why *some* beliefs fail (they lead to painful surprises), but not why the *successful* ones succeed *in representational terms*. Success is defined by the absence of painful surprise within our chosen project.
      *   **Solidarity and Social Justification:** The success of physics is also a matter of *social agreement within a community* committed to prediction, testability, and coherence. Its dominance reflects the contingent triumph of a particular form of life and its associated epistemic norms. Its "reliability" is demonstrated *within* the ongoing conversation of this community, not by pointing outside it.
      *   **Contingent Convergence:** Different vocabularies (physics, biology, chemistry) show remarkable convergence and interoperability *within the project of prediction/control*. This convergence is a remarkable, contingent fact about how our tools have co-evolved, not evidence they are all latching onto the same underlying representational bedrock. It's a happy accident of tool development.

  **Conclusion:**

  You've represented Rorty fairly and accurately pinpointed his core response to the differential-success objection. There is no Rortyan answer that satisfies the demand for a vocabulary-transcendent explanation *because he fundamentally rejects the legitimacy of that demand*. His answer *is* the redescription: "These tools work best *for our purposes*; here's how we contingently developed them and maintain them through social practices." Whether this is a profound insight that liberates us from metaphysical pseudo-problems or an unacceptable evasion of a crucial philosophical question is the central debate surrounding his work.

  **For your post:** You might emphasize that the rationalist representationalist and the Rortyan pragmatist are operating within fundamentally *incommensurable* frameworks regarding the nature of truth, reality, and explanation. The disagreement isn't just about *what* explains success, but about *what kind of explanation is even possible or desirable*. The rationalist seeks an explanation grounded in ontology (the structure of the world), while the pragmatist seeks an explanation grounded in genealogy and social practice (the development and use of our tools). This meta-level clash is where the real action is. Your draft already strongly implies this; making it explicit could strengthen the post.
