prompt: |-
  So in my APUSH class we just got done with this whole thing on Frederick Douglass and the Constitution and its kind of messing with my head ngl. Turns out he used to be all in with William Lloyd Garrison, who thought the Constitution was so pro-slavery that he literally called it "a covenant with death, and an agreement with hell" and once burned a copy of it at a rally. But then at some point Douglass basically flips and starts arguing that if you actually read the text instead of guessing what the framers secretly meant, the Constitution is an anti-slavery document. Now my teacher's making us do this debate thing next week where half the class has to defend Douglass's later position using only arguments he actually made, not stuff we just make up on the spot, and I got picked as "captain" for my side, so I'm the one who has to decide which arguments we lead with, since after every point the other side gets like 90 seconds to try and rip it apart.

  Here's what I've got so far from the reading packet, his six main arguments: (1) the words "slave" and "slavery" never once show up anywhere in the document, just stuff like "other persons," which he says proves the framers were ashamed of it and didn't want it locked into the law forever; (2) the three-fifths clause is actually a restriction on slaveholding states since the South wanted their slaves counted as full people for representation and didn't get that, plus calling them "persons" at all already contradicts treating them as pure property; (3) the fugitive slave clause never says "slave" either and doesn't even specify who's supposed to enforce it; (4) the clause protecting the international slave trade only until 1808 is basically a built-in expiration date, meaning the framers expected Congress to be able to kill it eventually (which it did); (5) the Preamble talks about "justice" and "the blessings of liberty," and Douglass's point is that's a weird thing to write if you're secretly building a pro-slavery government; and (6) his bigger, more legal-sounding point that you interpret a document by what it actually says, not by secretly guessing what a handful of guys meant when they wrote it decades earlier.

  I don't need these explained to me, I already get the gist of each one, what I actually need is help figuring out which ones would survive getting pushed on hard and which ones are gonna loose fast if the other team is smart about it. Could you sort all six into tiers by how well they'd hold up, and send it back as a JSON block, something like:

  ```json
  {
    "lead_with_this": ["..."],
    "solid_backup": ["..."],
    "risky_last_resort": ["..."]
  }
  ```

  and then just a sentence each somewhere explaining why you put it where you did. I gotta have this ready by Wednesday so appreciate any help!
