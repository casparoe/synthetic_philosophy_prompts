answer: |-
  Here’s a set of 8 interview questions designed to cut through abstraction, pressure key vulnerabilities, and force concrete engagement with her view. Each flagged request is addressed, with follow-ups anticipating common dodges:

  ### Core Questions & Follow-Ups
  1. **Concrete Case Demand (Statue/Lump):**  
     *"Take the classic puzzle: a statue (Goliath) and the clay lump it’s made from (Lump). They coincide spatially but seem to have different persistence conditions. By your lights, is the dispute between someone who says ‘There’s only one object here’ (a mereological universalist) and someone who says ‘There are two objects here’ (an anti-reductionist) merely verbal? If so, how do their quantifier meanings functionally differ in this specific case?"*  
     *Follow-up (if she appeals to "context" or "paraphrase"):* "But both philosophers insist they’re describing the *fundamental* structure of reality, not making context-dependent claims. If their quantifiers mean something different *at the fundamental level*, what practical test could distinguish ‘There exists one thing’ in Universalist-speak vs. ‘There exist two things’ in Anti-Reductionist-speak?"

  2. **Bootstrapping Worry:**  
     *"When you declare an ontological dispute ‘merely verbal,’ you’re making a metaontological claim: that both sides speak truly in their respective languages. But doesn’t this claim itself require a privileged vantage point? How do you avoid begging the question against the realist who insists *their* quantifier tracks the objective, joint-carving structure of reality, and thus that your ‘neutral’ description is just another partisan perspective?"*  
     *Follow-up (if she appeals to "charitable interpretation" or "lack of practical difference"):* "But the realist argues your charity *presupposes* deflationism. If their quantifier *is* objectively joint-carving, isn’t your insistence on interpreting their rivals charitably itself a refusal to engage their core claim – that there’s one metaphysically privileged meaning?"

  3. **Sider’s Reference Magnetism Rebuttal:**  
     *"Ted Sider argues reference magnetism explains why ordinary speakers converge on stable quantifier meanings over time: our usage ‘latches onto’ objectively natural joints in reality. If quantifier meanings are purely pragmatic/conventional as you suggest, why *do* we see such robust convergence in ontological intuitions (e.g., ‘there is a table’) across cultures and time? Isn’t magnetism the best explanation?"*  
     *Follow-up (if she dismisses convergence as "superficial" or "pragmatic"):* "But if convergence arises *only* from shared practical interests (e.g., table-talk helps us navigate the world), why do ontologists – who explicitly abstract away from pragmatics – *still* find deep disagreements intractable? Wouldn’t magnetism better explain why ‘joint-carving’ feels like a substantive goal even in theoretical discourse?"

  ### Deepening the Challenge
  4. **The Cost of Deflationism:**  
     *"If quantifier variance is correct, does this mean there’s no fact of the matter about whether ordinary objects like tables ‘really exist’ at the fundamental level? Or are you saying tables exist *relative to* some conceptual schemes but not others? If the latter, what fixes the ‘scheme’ relevant for fundamental ontology?"*

  5. **Disagreement vs. Merely Talking Past:**  
     *"Van Inwagen claims only living things compose objects; the universalist says any two things compose a fusion. They seem to genuinely disagree – each thinks the other is *mistaken* about reality. How does quantifier variance account for the *phenomenology* of disagreement here, if they’re just talking past each other?"*

  6. **Explanatory Scope:**  
     *"Could quantifier variance ‘deflate’ *any* ontological dispute? For instance, if a philosopher claimed ‘There are no electrons, only vibrating strings,’ and another disagreed, could this be merely verbal? If not, what makes some disputes substantive and others not?"*

  ### The Crucial Closer
  7. **The Substantive Dispute Test (Your Priority):**  
     *"You’ve argued many classic debates are verbal. But what, positively, *would* a genuinely substantive, non-verbal metaphysical dispute look like by your lights? Can you describe a hypothetical (or real!) example where two ontologists *aren’t* talking past each other, and where quantifier variance *doesn’t* apply? What features would that dispute have?"*  
     *Follow-up (if she struggles or gives a trivial example):* "If no plausible examples come to mind, does this suggest ‘merely verbal’ functions less as a precise diagnostic tool and more as a universal solvent dissolving any debate you find unproductive? How do you avoid the charge that deflationism is itself a conversation-stopper?"

  ### Bonus: Pressing the Motivation
  8. **The Stakes:**  
     *"Why should non-philosophers care about metaontology? If your view is right, does it imply that projects like fundamental physics or consciousness studies – which make bold existence claims – are ultimately just choosing useful ways of talking, with no deeper ontological implications?"*

  ### Why this works
  - **Forces Concreteness:** The statue/lump question (#1) grounds the abstraction immediately. The follow-up blocks retreat into "they mean different things" without explaining *how*.
  - **Targets Meta-Justification:** Bootstrapping (#2) and Reference Magnetism (#3) hit the *foundations* of her view. Follow-ups anticipate appeals to charity/pragmatics and demand why her explanation beats realism.
  - **Exposes the Stakes:** Questions #4-6 push her to define boundaries and consequences, preventing deflationism from becoming vacuously applicable.
  - **The Money Question:** #7 directly addresses your core concern. Making her describe a *substantive* dispute tests whether "merely verbal" is a principled claim or a reflex. The follow-up is deliberately provocative if she dodges.
  - **No Safe Harbor:** Follow-ups are tailored to common deflationist maneuvers (appeals to context, pragmatics, charity), forcing her to defend meta-commitments.

  **Delivery Tip:** Frame these as collaborative explorations ("Help me understand how your view handles...") rather than attacks. Her answers to #1 and #7 will be most revealing – if she waffles on concrete cases or can’t name a substantive dispute, the audience will sense it.
