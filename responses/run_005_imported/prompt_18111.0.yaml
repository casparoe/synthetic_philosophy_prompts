answer: |-
  This is a brilliant example of a genuinely deep metaphysical puzzle! Your intuition that both possibilities feel strange is spot-on, and philosophers have debated similar questions for centuries under topics like **mereology** (the study of parts and wholes), **identity over time**, and **ontological commitment** (what we believe exists). Here's a breakdown of the key perspectives:

  ### 1. **The Commonsense/Functional View (Your Roommate's Joke Has Truth):**
     * **Argument:** Objects are defined by their function and arrangement. When the units are connected in an L-shape, they collectively function *as a single couch*. When separated, they function *as three distinct chairs*. The "couch" isn't just the sum of parts; it's a unified functional entity that emerges from their specific arrangement.
     * **Existence Claim:** The couch *did* genuinely exist when the units were connected and ceased to exist when they were separated. The three chairs came into existence when the units were pulled apart.
     * **Why it feels strange:** It implies objects can pop in and out of existence based on minor spatial changes (a few inches). It also raises questions: *Exactly how connected must they be?* (Velcro? Gravity? Bolted?) *Does the couch exist if no one sits on it?*

  ### 2. **The Mereological Nihilism / Reductionist View (Only the Three Units Ever Existed):**
     * **Argument:** Only the fundamental parts are real. There are three cushion units. When arranged together, we *describe the arrangement* as "a couch" for convenience, but this is just a linguistic label for a temporary configuration of the three real objects. Pulling them apart doesn't destroy or create anything fundamental; it just rearranges the three persistent units.
     * **Existence Claim:** Only the three cushion units exist throughout. "Couch" and "chairs" are just ways of talking about how the units are arranged and used at a given time. No composite object ("couch") ever genuinely existed or ceased to exist.
     * **Why it feels strange:** It denies the reality of everyday objects like tables, cars, or mountains, reducing them to mere "arrangements of particles." It clashes with our strong intuition that a functioning couch *is* a single thing.

  ### 3. **Mereological Universalism (Everything is a Whole):**
     * **Argument:** Any collection of objects, *regardless of arrangement or function*, constitutes a further composite object. When the units are together, there exists: each unit, the couch, and also arbitrary sums like "unit A + unit B". When apart, there exists: each unit, each chair, the scattered object "unit A + unit B + unit C" (even miles apart!), and countless other arbitrary combinations.
     * **Existence Claim:** The couch *was* a composite object while together. When apart, the composite object "the sum of the three units" *still exists* (it's just scattered), but the *functional object* "couch" ceases to exist because it can't perform its function. New functional objects (chairs) come into existence.
     * **Why it feels strange:** It posits a vast, undetectable universe of objects (e.g., "the sum of my left shoe and the Eiffel Tower") that seems ontologically extravagant and useless.

  ### 4. **Perdurantism / Four-Dimensionalism (The Couch is a "Space-Time Worm"):**
     * **Argument:** Objects persist through time by having temporal parts. The "couch" is a four-dimensional entity stretching through time. During the period the units are connected and functioning as a couch, the temporal part of this entity *is* a couch. When the units are separated, the later temporal part *is* three chairs (or a scattered object). The entire space-time worm exists, but its properties change over its temporal parts.
     * **Existence Claim:** The couch-stage existed during the connected time, the chair-stages exist during the separated time. All are parts of a larger, temporally extended object (the "life" of the matter composing the units).
     * **Why it feels strange:** It treats objects as static "slices" in time, which feels counterintuitive. We usually think of the *same* object persisting and changing.

  ### So, Who's Right? Is it Just Semantics?

  * **Both perspectives reveal something real:** Your dispute highlights fundamental questions about what it means for something to be an "object," how arrangement and function relate to existence, and whether composition is a fundamental feature of reality or just a useful fiction.
  * **It's not *just* semantics, but language matters:** The words "couch" and "chair" are functional concepts. We apply them based on arrangement and use. Whether we say "the couch ceased to exist" or "we stopped using the arrangement as a couch" depends partly on linguistic convention. However...
  * **The underlying metaphysical question is real:** Is there a genuine ontological difference between the units arranged couch-wise and the units arranged chair-wise? Does reality contain composite objects like couches, or just fundamental particles arranged couch-wise? Philosophers genuinely disagree on this.
  * **There's no single "correct" answer:** Different metaphysical frameworks (Nihilism, Universalism, Commonsense, Perdurantism) provide different answers, each with strengths and weaknesses. Your intuition of strangeness reflects the genuine tension between these frameworks.

  **Conclusion:** You and your roommate are both "onto something real." Your argument exposes a core problem in metaphysics: **the problem of ordinary objects.** What makes a bunch of parts a unified whole? When does a whole begin or cease to exist? 

  The couch's existence isn't as straightforward as it seems. While we effortlessly use the word "couch," its ontological status (is it a *real* entity beyond its parts?) is philosophically contested. Your disagreement isn't trivial – it's a miniature version of a profound debate about the nature of reality and how we conceptualize it. Embrace the strangeness; it's the sign you're thinking deeply!
