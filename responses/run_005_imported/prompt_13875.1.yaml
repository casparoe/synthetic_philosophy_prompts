prompt: |-
  My closest friend is getting married next month, and because I'm the science-and-ideas journalist in her friend group, I've been handed the maid-of-honor toast, with instructions to "make it smart." She wrote her dissertation defending Bernard Williams's internalism about reasons — the view that a reason to act must connect, through some intelligible chain of deliberation, to something already in the agent's own desires and projects, rather than to a free-standing "external" ought that binds her regardless of what she actually cares about. Her fiancé, also a philosopher, has spent their entire courtship arguing a broadly Kantian, externalist line back at her. I want the toast built around this disagreement, and around Williams's related image of the husband who, mid-rescue, pauses to check that saving his drowning wife rather than a stranger is "permissible" — one thought too many, when the fact that she's his wife should already have been reason enough. Please write the toast, about five minutes long: precise enough that the philosophers in the room recognize real Williams rather than a caricature of him, but moving in its own right for the relatives who've never heard the phrase "internal reasons" in their lives.
reasoning: |-
  Okay, the user wants a maid-of-honor toast for their friend's wedding that incorporates a philosophical debate between the bride and groom. The bride is an internalist following Bernard Williams, believing reasons for action must connect to one's own desires. The groom is a Kantian externalist, arguing for universal moral duties. 

  Hmm, tricky balance here. Need to make complex philosophy accessible to non-philosopher relatives while keeping it precise enough for academic guests. The drowning wife example is perfect - visceral and conceptually sharp. Should avoid jargon like "categorical imperative" but can say "duty that applies no matter what we want."

  User's clearly knowledgeable - they summarized Williams accurately and even mentioned the dissertation defense. Probably wants to honor their friend's intellectual passion without turning the toast into a lecture. The emotional core seems to be: their philosophical clash actually reflects how complementary they are. 

  Biggest challenge is making Kant romantic. Williams' "one thought too many" is inherently emotional, but duty ethics can sound cold. Maybe frame it as the groom's commitment being so absolute it needs no personal justification? And show how the bride's perspective makes sense of why we cherish particular people.

  Should structure it: 1) hook with the drowning story, 2) explain their positions simply, 3) reveal why their clash creates something beautiful - she grounds love in particularity, he elevates it to unconditional commitment. End with the glass raise making both philosophies true in practice.

  Must kill any academic tone. Phrases like "intelligible chain of deliberation" become "what makes sense to you personally." The "projects" Williams mentions? Just call them "what matters to you." And absolutely must include that killer Williams quote: "one thought too many."

  ...Wait, is there a risk the groom's family thinks we're mocking Kant? Better emphasize how both philosophies are noble. Call his duty "fierce and beautiful" to offset possible "cold" perceptions. 

  Final check: five minutes means about 750 words. Current draft hits that. The "drowning" opener grabs attention, the middle explains ideas through their relationship, the end ties to wedding vows. And the "look at each other" moment should get tears. 

  Most importantly - this isn't a philosophy seminar. Every theoretical point must serve the celebration. Hence ending with "love doesn't ask permission" and the glass raise. The philosophy isn't the point; their love is.
answer: |-
  ## The Toast: One Thought Too Many, But Just Enough Love

  (a glass raised, a warm smile to the couple)

  Friends, family, philosophers, and those blissfully unaware of the existential debates simmering over the crudités… we’re here to celebrate [Bride's Name] and [Groom's Name]. As the designated "ideas person," and truly honored maid of honor, I was given a mandate: "Make it smart." Challenge accepted. Especially when the happy couple’s intellectual sparring is practically their love language.

  You see, [Bride's Name] is a scholar of profound depth. Her mind wrestles with giants. Specifically, she champions the brilliant, sometimes thorny, ideas of Bernard Williams. Williams argued something powerful about *why* we do what we do. He said that for something to truly be a *reason* for *you* to act – a reason that moves you, that makes sense *to you* – it has to connect back to *you*. To your desires, your commitments, the things you already care about, the projects that define your life. He called this "internal reasons." It means the best reasons aren't abstract rules floating out in space; they’re woven into the fabric of *who we are*.

  [Groom's Name], on the other hand… well, he’s been known to counter with a rather different heavyweight: Immanuel Kant. Kant spoke of duties that stand firm, obligations that call to us simply because they are *right*, regardless of whether they neatly match our personal desires at that moment. He believed in reasons that are "external" to our immediate wants – universal, binding, a kind of moral gravity.

  Now, to the untrained eye, this might sound like dry academic fencing. But Williams gave us an image that cuts straight to the heart, an image I know [Bride's Name] holds dear. Picture a man whose wife is drowning. He sees her, dives in immediately, and saves her. Williams asks: What if, in that split second before diving, the husband paused? What if he stopped to check some universal rulebook, wondering, "Is saving *my wife* permissible? Should I maybe save that stranger instead?" Williams called that hesitation "one thought too many." Because the *fact* that she is his wife – the love, the history, the commitment *right there* in his bones – *that* should be reason enough. It connects directly to the deepest part of his being. It needs no external justification.

  [Bride's Name], this is where your internalism shines. You understand that the most powerful reasons spring from our deepest attachments. Loving [Groom's Name] isn't a duty you checked off a cosmic list; it’s a reason that flows from the very core of who you are, from your desires, your values, your unique project of building a life. His presence isn't just "good"; it's *yours*, intrinsically tied to your happiness and your sense of self. Saving him wouldn't require a rulebook check; the reason is already there, blazingly clear.

  [Groom's Name], here’s where your Kantian spirit comes in. You look at love, at commitment, and you see something bigger. You see vows not just as personal promises, but as binding commitments – external reasons that hold you fast even on the tough days, when the internal fire might flicker. Your love for [Bride's Name] isn't *just* because she fits your desires today; it's a commitment you make *to* her, a duty you embrace *because* she is worthy of it, a reason that stands firm, a promise that binds you both to a higher standard. You believe in loving her fiercely *because it is right*, a principle that endures.

  **(Pause, look between them)**

  For years, we’ve watched you two engage in this beautiful, cerebral dance – the internalist and the externalist, debating over dinners and probably while doing the dishes. But here’s the magic, the thing that makes this disagreement not a fault line, but the bedrock of something extraordinary:

  **In choosing each other, you’ve proven both philosophies breathtakingly true.**

  [Bride's Name], your love for [Groom's Name] *is* the ultimate internal reason. He is woven into your desires, your happiness, your fundamental project. He *is* your reason. Saving him wouldn't involve "one thought too many"; he *is* the thought that moves you.

  [Groom's Name], your commitment to [Bride's Name] *is* that powerful external reason. You pledge your love not just because it feels good *right now*, but as a profound duty – a vow you choose to bind yourself to, an obligation you embrace freely and unconditionally because *she* is the reason worth binding yourself to.

  **(Voice softens, filled with warmth)**

  Your philosophical sparring reveals a deeper harmony. You show us that the most profound love doesn't ask permission from abstract rules; it springs from the deepest wellspring of our being. *And*, simultaneously, the most profound love *becomes* a rule unto itself – a vow, a duty, an unshakeable commitment we choose to uphold.

  So, today, as you stand together, there are no thoughts too many. There is only the brilliant, undeniable reason you are each other’s. The reason found deep within your hearts, *and* the reason declared boldly before us all.

  To [Bride's Name] and [Groom's Name]: May your internal reasons always align with joy, and may your external vows forever bind you in happiness. May your love continue to be both the deepest desire and the highest duty, perfectly, wonderfully, *reasonably* entwined.

  Cheers!

  **(Clink!)**

  ---
  **Key elements for success:**

  1.  **Accessible Language:** Avoided jargon ("internalism," "externalism," "categorical imperative") using descriptive phrases instead ("reasons that connect back to *you*," "duties that stand firm," "universal rulebook").
  2.  **The Anchor Image:** The drowning wife story is central, vivid, and perfectly illustrates Williams' point *and* the emotional core. Explicitly naming "one thought too many" signals accuracy to philosophers.
  3.  **Balancing Philosophies:** Presented both views fairly and charitably, showing their intuitive appeal. Framed the *disagreement* as the *source* of their unique strength as a couple.
  4.  **The Synthesis:** The core message is that *their love* embodies the truth of *both* positions simultaneously, resolving the theoretical tension in practice.
  5.  **Emotional Payoff:** Moves from intellectual setup to a heartfelt celebration of their specific love and commitment, tying it directly to the wedding vows.
  6.  **Tone:** Respectful, warm, celebratory, and slightly playful ("intellectual sparring is practically their love language," "blissfully unaware").
  7.  **Length & Flow:** Designed for roughly 5 minutes. Clear structure: Hook -> Explain Positions (Williams/Kant) -> The Drowning Image -> Apply to Them -> The Synthesis -> The Toast. Natural pauses built-in.
