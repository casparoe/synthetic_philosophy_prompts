prompt: |-
  So in my just war theory seminar we just finished Walzer's Just and Unjust Wars and we're starting some of McMahan's revisionist stuff next week, and i think im missing something basic about how the "moral equality of combatants" thing is actually supposed to work. My understanding is that on the traditional Walzerian view, individual soldiers on either side of a war are morally equal as combatants -- neither one is a murderer just for fighting, and both sides are equally legitimate targets for each other in bello, regardless of whose cause was actually just at the ad bellum level, as long as everyone sticks to the rules of engagement. But if that's really true, I don't get why the theory even bothers with the whole ad bellum side of things (just cause, proportionality of going to war, last resort, etc). Like if it doesn't matter morally which side is in the right once the shooting starts, why spend so much energy working out when a state is even justified in starting a war in the first place?

  me and my study group actually got into it about this last night -- one guy was arguing that "moral equality of combatants" basically commits Walzer to saying no war can be more just than another, which seemed off to me since Walzer treats the Allies in WW2 as pretty much THE textbook example of a just war fought for a just cause. but i couldn't really articulate why he was wrong, if he even is wrong. is there something off with that reasoning, and if so where exactly does it break down? or is this actually a real inconsistency in Walzer's theory that the revisionists are right to jump on?
reasoning: |-
  Okay, let me try to figure out what this student is really struggling with. They’re in a just war theory seminar, moving from Walzer to McMahan, and they’re confused about the moral equality of combatants. Their main question is: if soldiers on both sides are morally equal once the war starts, why does the ad bellum part even matter? 

  First, I need to recall Walzer’s framework. He separates jus ad bellum (justice of going to war) and jus in bello (conduct in war). The moral equality means that soldiers aren’t criminals just for fighting, even if their side is unjust. But the student is puzzled because if in bello doesn’t care about ad bellum, why bother determining which side is just?

  They mentioned a study group argument where someone claimed Walzer’s view implies no war is more just than another. But the student knows Walzer cites WWII Allies as a just war example. That seems contradictory to them. So they’re wondering if this is an inconsistency that revisionists like McMahan exploit.

  I should break down Walzer’s reasoning. The separation exists to protect soldiers and ensure in bello rules are followed regardless of ad bellum. But ad bellum still matters for judging the war’s initiation. The moral equality applies to combatants’ status, not the war’s overall justice. The student might be conflating individual soldier morality with the war’s justification. 

  Also, the student’s friend might misunderstand that moral equality doesn’t negate ad bellum justice. WWII Allies had just cause, but German soldiers weren’t murderers just for fighting. Walzer’s point is that in bello rules are symmetrical, but ad bellum is asymmetrical. The revisionists attack this by arguing that an unjust combatant can’t have the same in bello rights.

  The student needs to grasp that Walzer’s separation is pragmatic—to maintain wartime conduct rules. But they’re right to question how ad bellum and in bello interact. McMahan’s critique is that if a war is unjust, soldiers fighting for it can’t be morally equal. That’s the core of the revisionist challenge.

  I should explain that Walzer’s moral equality is about liability to attack, not moral innocence. Soldiers on the unjust side aren’t guilty of murder, but their war is still unjust. The student’s confusion might stem from not distinguishing between individual guilt and collective justification. Their friend’s point misses that ad bellum assesses the state’s decision, not individual soldiers.

  In essence, the student needs to see that Walzer’s theory has two levels: the state’s responsibility for ad bellum and combatants’ mutual equality in bello. The inconsistency isn’t real; it’s a deliberate separation for practical ethics. McMahan rejects this, linking in bello rights to ad bellum justice. The student’s seminar will likely explore this tension next.
answer: |-
  That's an incredibly sharp observation, and you've hit on one of the *most* contentious and debated points in contemporary just war theory – the exact relationship between *jus ad bellum* (justice of resorting to war) and *jus in bello* (justice in the conduct of war). Your confusion is well-founded; the "moral equality of combatants" (MEC) *does* create significant tension with the importance of *jus ad bellum*, and McMahan's revisionism targets this very point.

  Let's break down Walzer's view and why the tension exists, but why it's *not* necessarily an inconsistency *within his own framework*, even if it might be a weakness:

  1.  **Walzer's Core Argument for Moral Equality of Combatants (MEC):**
      *   **The "War is Hell" / Reciprocal Risk Argument:** Soldiers are thrust into a situation of extreme violence not entirely of their own making. They face a lethal threat. To demand they first determine the ultimate justice of their own nation's cause before defending themselves (or following orders) is unrealistic and unfair. They are coerced by the state and the situation.
      *   **The "Mutual Threat" Argument:** Regardless of *why* the war started, once combat begins, soldiers on both sides pose a lethal threat to each other. This mutual threat creates a kind of moral symmetry *on the battlefield*. Shooting back at someone trying to kill you is fundamentally different from murdering an innocent civilian, even if the *overall war* your side is fighting is unjust. Combatants are "dangerous men" to each other.
      *   **The Functional/Pragmatic Argument (Crucially Important):** Separating *jus ad bellum* and *jus in bello* is essential for getting combatants on *both* sides to adhere to the rules of war (e.g., no targeting civilians, no torture, humane treatment of POWs). If soldiers on the unjust side believed that simply by fighting they were committing murder, they would have *no incentive whatsoever* to follow *any* humanitarian rules. Why refrain from atrocity if you're already damned? MEC provides a moral basis for *all* soldiers to follow *jus in bello* constraints. It protects civilians and limits suffering.

  2.  **Why *Jus ad Bellum* Still Matters Profoundly for Walzer:**
      *   **Judging the War Itself:** *Jus ad bellum* criteria are how we judge the *state* (or political leadership) and the *decision to go to war*. Walzer absolutely believes some wars are just (WWII Allies) and others are unjust (Nazi aggression). This judgment is crucial for history, international law, holding leaders accountable, and shaping future state behavior.
      *   **Soldier's *Conscience*, Not Legal/Moral Status *in Bello*:** While soldiers on the unjust side aren't *murderers* simply for fighting (due to MEC), Walzer acknowledges they *can* and *should* feel moral unease or guilt about fighting for an unjust cause. They *are* contributing to an unjust enterprise. MEC protects them from being labeled individual murderers *in the act of combat*, but it doesn't absolve their participation in an unjust war *at a deeper moral level*. They might have a duty to refuse *unjust orders* or even *conscientious objection*.
      *   **Post-War Justice:** *Jus ad bellum* is vital for determining reparations, war crimes trials for *leaders* (e.g., Nuremberg focused heavily on crimes against peace - *ad bellum* crimes), and the moral standing of states after the war.

  3.  **Where the Tension Lies & Your Friend's Argument:**
      *   **The Tension:** You've nailed it. If *jus in bello* rules and the moral status/permissibility of killing combatants are completely independent of *jus ad bellum* (thanks to MEC), it *does* seem to functionally insulate the actual fighting from the justice of the cause. This can feel like saying: "This war was a monstrous crime of aggression... but once it started, killing the aggressor's soldiers is morally equivalent to killing the defenders, and the aggressor soldiers killing defenders is morally permissible." That *is* jarring.
      *   **Your Friend's Claim ("No war more just"):** This **overstates and misapplies** MEC. Walzer **vehemently rejects** this conclusion.
          *   MEC applies **only to the moral status and liability of *individual combatants* during the fighting (*in bello*)**. It says nothing about the overall justice *of the war itself*.
          *   For Walzer, WWII was **absolutely** a more just war for the Allies than for the Axis. The *ad bellum* judgment is profoundly different. The Allies fought a just war; the Axis fought an unjust war of aggression. This asymmetry is central to Walzer.
          *   MEC doesn't make the wars *themselves* morally equal; it makes the *combatants* morally equal *in their reciprocal roles as fighters* once the war has begun. It's about the micro-level ethics of combat, not the macro-level ethics of the conflict.

  4.  **Why Your Friend is Wrong (and Walzer isn't *Inconsistent* on this point):**
      *   **Level of Analysis:** Walzer is deliberately separating two levels:
          *   *Macro (Ad Bellum):* Justice of the state's decision/resort to war. Asymmetric (one side just, one side unjust).
          *   *Micro (In Bello):* Justice of the actions of individual soldiers *towards each other and civilians* during combat. Symmetrical (rules apply equally, combatants are equally liable to attack *by each other*).
      *   **Functional Justification:** The separation is *designed* to achieve a vital goal: constraining the horrors of war *regardless* of who started it. He believes abandoning MEC would make war *worse* by removing any incentive for unjust combatants to follow rules.
      *   **Distinction Between Liability and Innocence:** Soldiers on the unjust side are not *innocent* in the grand scheme (they are part of an unjust aggression), but they are *liable* to attack *because* they are posing a lethal threat. Soldiers on the just side are also liable to attack (because they pose a threat), but they are fighting for a just cause. Their *liability* is symmetrical; their *overall moral position* is not.

  5.  **Why McMahan and Revisionists Jump On This (The Core Challenge):**
      *   **Moral Fundamentalism:** McMahan argues morality can't be neatly compartmentalized like this. If a war is profoundly unjust (*ad bellum*), then the soldiers fighting for that unjust cause *cannot* have a moral right to kill soldiers defending a just cause. Killing in self-defense or defense of others against unjust aggression is morally justified; killing to further unjust aggression is not.
      *   **The "Deep Morality" Critique:** McMahan argues Walzer's view is pragmatic/conventional, not based on fundamental individual moral liability. He thinks Walzer sacrifices deep morality (individual responsibility for participating in unjust killing) for a useful convention (MEC to enforce *in bello* rules).
      *   **The Incentive Problem Rebuttal:** Revisionists argue that soldiers on the unjust side *should* feel the full moral weight of their participation and that this might actually deter participation in unjust wars more effectively. They also propose alternative ways to incentivize *in bello* compliance (e.g., focusing on individual war crimes prosecution).
      *   **"Unjust Combatants Cannot Fight Justly":** A core revisionist claim is that if your cause is unjust, *any* killing you do in its pursuit is morally impermissible (though perhaps excusable under duress). Therefore, they *cannot* have the same moral permissions (*jus in bello*) as just combatants. MEC is thus morally false.

  **In Summary:**

  *   You understand MEC correctly: Walzer argues combatants on both sides are morally equal *in their role as fighters* – not murderers, equally liable to attack, bound by the same *in bello* rules.
  *   **The tension is real:** It *does* seem to downplay the relevance of *jus ad bellum* for the actual conduct and permissions *in bello*.
  *   **Your friend is wrong:** MEC does **not** mean Walzer thinks no war is more just than another. He emphatically believes the opposite. MEC applies *only* to the status and permissions of combatants *during fighting*, not to the justice of the war itself.
  *   **Walzer's defense (not inconsistency):** He separates levels (macro vs. micro) for powerful functional reasons – to save lives by giving *all* soldiers a reason to follow humanitarian rules. *Jus ad bellum* still matters enormously for judging the war, leaders, and the state's action.
  *   **McMahan's target:** Revisionists argue this separation is morally incoherent at the fundamental level of individual responsibility. They claim combatants fighting for an unjust cause lack the moral right to kill, making MEC deeply mistaken. They see Walzer's view as a useful but ultimately morally flawed convention.

  Your seminar is heading into the heart of the debate! McMahan will forcefully argue that Walzer's MEC shields unjust combatants from the moral consequences of their actions and that *jus in bello* permissions *must* be linked to *jus ad bellum* justification. Be prepared to wrestle with whether the pragmatic benefits of MEC outweigh the potential moral costs identified by the revisionists. Your confusion is spot-on – it's the central puzzle.
