  Notably, they want four specific angles covered: the intuitive cost of undecided statements, why intuitionistic logic *specifically*, whether the Gödel-Gentzen embedding trivializes the debate, and internal constructivist divisions. The challenge is crafting questions where "you're begging the question" would sound evasive—like asking why meaning-theory licenses *exclusion* over other non-classical logics, or whether semantic arguments can resolve technical choices like accepting Markov's Principle. 

