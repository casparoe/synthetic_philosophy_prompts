  Another angle is trust and social contract. Public institutions should serve all citizens equitably. Targeting a vulnerable group erodes trust, especially if the community learns the harm was deliberate. This could have long-term effects on civic engagement and trust in government.

  I should also address the director’s assumption that backlash will work. It’s speculative. Relying on public outrage is uncertain, and if it fails, the consequences are severe. The fair cuts, while painful, distribute burden more justly, aligning with principles of distributive justice.

  The user might also be seeking reassurance that their moral intuition is correct. They want to know if opposing the director is the right stance. Confirming that there’s a substantive difference between foreseeable harm and intentional harm can empower their argument.

