answer: |-
  ## The Frege-Geach Gauntlet: Expressivism's Partial Victory and Enduring Burden

  The Frege-Geach problem isn't just a puzzle for expressivism; it’s an existential challenge. If moral language functions primarily to express non-cognitive attitudes (disapproval, commendation, plans), how can moral terms embedded within unasserted contexts—like the antecedents of conditionals, within questions, or under negation—retain their meaning and logical force? Geach’s core insight was devastatingly simple: the meaning of "lying is wrong" must be identical whether asserted or embedded, and any semantic theory must explain how this invariant meaning validates logical inferences like modus ponens. For the expressivist, whose core thesis ties meaning directly to the *act* of expression (e.g., disapproval), embedding threatens to sever meaning from its functional role, leaving embedded clauses semantically inert or incoherent. After weeks immersed in the sophisticated replies from Blackburn, Gibbard, and Schroeder, alongside critiques like Dreier’s, I conclude this: **Expressivism has successfully navigated the core challenge of inconsistency arising from negation and simple conditional attitudes, demonstrating that non-cognitivism *can* generate a recognizable logic of moral commitment. However, it has not yet fully discharged the burden of explaining the *general logical form* of moral inferences in a way that mirrors the semantic structure captured by truth-conditional theories, leaving a significant explanatory gap concerning validity itself.**

  ### The Expressivist Arsenal: From Attitudes to Plans to Being For

  1.  **Blackburn's Quasi-Realist Projectivism:** Blackburn's solution is foundational. He argues that the problem isn't meaning *identity* per se, but *functional equivalence* in inference. When "Lying is wrong" appears unasserted in "If lying is wrong, then getting your little brother to lie is wrong," we aren't *expressing* disapproval of lying. Instead, we're expressing a *higher-order attitude*: disapproval of *combining* approval of lying with disapproval of getting your little brother to lie. The inconsistency isn't logical contradiction but *practical* inconsistency: holding attitudes that clash. Modus ponens works because accepting both premises commits one to a state of mind that *must* disapprove of getting your little brother to lie on pain of attitudinal incoherence. Blackburn successfully shows how a logic of attitudes can mimic logical consequence for core cases like negation and simple conditionals, grounding the *feeling* of logical compulsion in practical demands on our conative states. This is the core of the quasi-realist project: explaining logical phenomena without abandoning expressivism.

  2.  **Gibbard's Hyperplan Semantics:** Gibbard offers a more formal apparatus. Moral judgments express the endorsement of *hyperplans* – comprehensive contingency plans for what to do in any conceivable situation. "Lying is wrong" expresses ruling out all hyperplans that permit lying. The conditional "If lying is wrong, then getting your little brother to lie is wrong" expresses ruling out hyperplans that both forbid lying *and* permit getting your little brother to lie. Modus ponens then tracks a *plan-theoretic* inconsistency: accepting both premises commits you to ruling out hyperplans that permit getting your little brother to lie. Crucially, Gibbard provides a compositional semantics where complex sentences express plan-laden properties of possible worlds (or world-plan pairs), offering a structure closer to truth-conditional models. This seems to handle embedding more systematically by providing abstract objects (plans) that complex sentences can "operate" on, even when unasserted.

  ### The Lingering Shadow: Schroeder, Dreier, and the Validity Problem

  Despite these sophisticated moves, powerful objections persist, revealing the depth of the challenge:

  1.  **Schroeder's Bifurcation and the Formality of Logic:** Schroeder's critique in *Being For* is pivotal. He argues that Blackburn and Gibbard primarily solve the "negation problem" – showing how moral inconsistency can arise without truth-apt beliefs. However, he contends they fail to fully solve the "Frege-Geach problem proper": explaining why modus ponens *specifically*, and logic *in general*, works for moral language *in virtue of its form*. His point is that logic is formal; it cares about the *structure* of sentences, not the specific attitudes expressed. Blackburn and Gibbard explain why *particular* combinations of attitudes are inconsistent, but they don't provide a general, compositional *semantic value* for moral sentences that validates inferences *solely* based on their logical structure, independently of the specific content of the attitudes. Schroeder argues that expressivists need semantic values that can be *operated on* by logical operators (like 'if...then...' or 'not') in a way that directly mirrors truth-functional operations. His own "being for" semantics is an attempt to provide such truth-like, compositional semantic values (e.g., "being for blaming for lying"), but he readily admits its artificiality and the difficulties it faces. His key point stands: without such formal, compositional values, expressivists haven't fully explained the *logic* of moral discourse; they've only explained the *inconsistency* of certain attitude combinations.

  2.  **Dreier's Relocation Problem:** Dreier sharpens the critique. He argues that sophisticated expressivist solutions like Blackburn's and Gibbard's don't *solve* the Frege-Geach problem; they merely *relocate* it. They explain the inconsistency of *accepting* a set of sentences (like P, P→Q, and ~Q) by appealing to the inconsistency of the mental states expressed by *accepting* them. But, Dreier points out, the original problem wasn't just about the inconsistency of *acceptance*; it was about the *sentences themselves* having meanings that entail logical relations *independently* of anyone's psychology. The expressivist explains why *holding* certain attitudes is inconsistent, but the realist wants to know why the *sentence* "If lying is wrong, then getting your little brother to lie is wrong" *means* what it does, such that it licenses the inference *in virtue of its semantic structure*. The expressivist account of the conditional's meaning *is* defined in terms of the attitudes toward attitude combinations – it explains the meaning *by* explaining the functional role in reasoning. Dreier argues this is circular: the meaning is defined by the very inferential role (attitude consistency) that the meaning was supposed to explain. The problem of explaining the logical relations between sentences *as linguistic entities* has been replaced by the problem of explaining the consistency relations between mental states. While the latter might be solvable (as Blackburn/Gibbard show), it doesn't directly answer the original semantic challenge about sentence meaning and validity.

  ### The Verdict: Success on Inconsistency, Stalemate on Validity

  Where does this leave us?

  1.  **Partial Victory: Inconsistency Solved.** Expressivism has demonstrably succeeded in its core defense against the charge that non-cognitivism makes moral logic impossible. Blackburn and Gibbard have shown, convincingly in my view, that a logic of attitudes *can* underpin the phenomena of moral inconsistency, negation, and simple conditional reasoning. We can explain why someone who holds "Wrong(lying)", "Wrong(lying) → Wrong(inducing lying)", and "~Wrong(inducing lying)" is in an incoherent state of mind. This is a significant achievement, rescuing expressivism from the early, crude objections that dismissed it as incapable of handling logic.

  2.  **Enduring Burden: The Formal Semantics of Validity.** However, expressivism has not yet fully met the deeper challenge concerning the *semantic basis of logical validity*. Schroeder and Dreier pinpoint the crux:
      *   Expressivist accounts explain *why* accepting certain premises *commits* you to an attitude (or plan) corresponding to the conclusion (Schroeder's "taking-expressivism").
      *   They do not yet provide a fully satisfying account of *what the complex sentence itself means* in a way that formally grounds *why* the inference is valid *solely in virtue of the semantic values of its parts and their logical structure* (Schroeder's "semantic-expressivism").
      *   Dreier is right that the solution often feels like relocation: the logical relations between sentences are explained by the consistency relations between the mental states of those who accept them, rather than deriving the consistency relations directly from the compositional semantics of the sentences themselves in a truth-like fashion.

  3.  **Leveling the Field?** Is this burden unique? Realists have their own embedding problems (e.g., explaining the meaning and inferential role of moral terms embedded in fictional contexts, or under epistemic modals like "might be wrong"). More importantly, **the expressivist can rightly argue that the "demand for a truth-conditional semantics" is question-begging.** The expressivist project *starts* from the premise that moral sentences aren't straightforwardly truth-conditional. Insisting that they *must* be assigned truth-conditional semantic values to validate logic simply assumes realism is correct. The expressivist achievement is showing that *another kind of semantic story*, based on expression and commitment, *can* underpin a recognizable logical structure for moral discourse. The challenge of providing a formal compositional semantics akin to truth-conditional models is real, but it may be a challenge of *developing a new kind of formal semantic framework*, not proof that expressivism is impossible. Schroeder's "being for" is one such attempt, however clunky.

  **Conclusion: The Gauntlet Remains, But Expressivism Stands**

  Therefore, my verdict is this: **Expressivism has decisively answered the most threatening aspect of Frege-Geach – demonstrating that non-cognitivism can coherently account for moral inconsistency, negation, and core conditional inferences through sophisticated accounts of higher-order attitudes or planning states. On this front, Geach's challenge has been met.** However, **it has not yet provided a fully general, formal compositional semantics that seamlessly validates the logical structure of moral inferences in a way that mirrors truth-conditional models and satisfies demands for a purely structural explanation of validity.** Schroeder’s distinction between handling inconsistency and validating logical form, and Dreier’s point about relocation, highlight this enduring gap. Yet, this gap is not necessarily fatal. It represents the frontier of expressivist semantics, the effort to build a formal apparatus equal to the complexity of language *from expressivist first principles*. While the realist objection concerning the *semantics of validity* retains significant force, it does not negate expressivism’s success in explaining the *phenomenology and practice* of moral reasoning. Frege-Geach is no longer a knockout blow, but it remains a demanding standard against which expressivist semantic theories must be rigorously tested. Your paper should argue this nuanced position: acknowledge the substantial progress made in handling inconsistency, but contend that the quest for a fully satisfying expressivist semantics of logical form remains the field's most pressing theoretical challenge. The burden of proof has shifted, but it has not vanished.
