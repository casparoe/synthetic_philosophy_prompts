  So I got into it with my father in law over Christmas about evolution — he's big into intelligent design stuff, and at one point he pulled up this Karl Popper quote on his phone about natural selection basically being a tautology, not a real testable scientific theory, more like "a metaphysical research programme." I didn't have a great comeback in the moment, but afterwards I looked into it and it turns out to be way messier than either of us made it sound. Apparently Popper actually published a whole "recantation" later on where he said he'd changed his mind about the testability of natural selection, but then I stumbled on some ID-leaning blog posts arguing the recantation wasn't really a retraction at all, more like he snuck his original criticism back in under cover of "changing his mind."

  I'd like you to lay out what Poppers actual, considered view on Darwinism ended up being (his views clearly shifted more than once over the decades, so as best as it can be reconstructed), and what, if anything, really changed between the "almost tautological" phase and the "recantation" phase. But more than the history itself, I'm curious what you think are the most important implications of this whole saga for how I should evaluate similar "is X actually falsifiable/scientific" arguments going forward — not just about evolution, but about other theories that get accused of being just-so stories dressed up as science, like alot of evolutionary psychology, or psychoanalysis (which Popper also loved to pick on). Is there a principled way to use Popper's falsifiability criteria here without it collapsing into either "everything's unfalsifiable if you squint" or "everything's falsifiable if you're generous enough with auxiliary hypotheses"?
