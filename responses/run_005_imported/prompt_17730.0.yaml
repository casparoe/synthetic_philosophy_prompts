prompt: |-
  I spent my career as a comparative physiologist (mostly amphibians, some fish), retired a few years back, and lately I've fallen properly down a philosophy rabbit hole -- currently stuck on the brain-death literature, which my niece (she's in med school) got me started on. It scratches the same itch the species problem used to scratch for me professionally: everyone's confident there's a real fact being tracked, nobody agrees on the criterion, and which criterion you pick changes real cases on the ground.

  Here's my rough list of the live contenders for what actually makes a human organism dead:
  1. the classic whole-brain view -- death is the irreversible loss of the organism's "integrative unity," seated in the brain
  2. the Presidents Council's 2008 patch-job -- forget integration, death is loosing the capacity for the basic "vital work" of a living thing (openness to the world, acting on it, needing to)
  3. the higher-brain/neocortical view -- what matters is irreversible loss of the capacity for consciousness, brainstem be damned
  4. the plain old circulatory-respiratory criterion, which is what donation-after-circulatory-death actually runs on in practice
  5. Shewmon's objection -- correctly-diagnosed "whole-brain-dead" bodies keep on healing wounds, fighting infections, even gestating, for years, so the integration story is just bad biology
  6. the "legal fiction" view -- brain death was never meant to track real biological death, it's a useful category so transplant programs can operate within the dead-donor rule

  Rank these 1 through 6, most to least defensible as an account of when the organism (not necessarily the person, if you want to pull those apart) has actually died. No ties, and no cop-out "it depends which metaphysics you like" -- I want an actual order. Give it to me as JSON, like:

  ```json
  [
    {"rank": 1, "position": "...", "reason": "one sentence, no hedging"},
    ...
  ]
  ```
reasoning: |-
  We are ranking the positions based on their defensibility as an account of when the human organism (as a biological entity) has died. The focus is on biological death of the organism, not necessarily personhood.

  Key considerations:
  - Biological integration: Is the organism functioning as a whole?
  - Irreversibility: The cessation must be irreversible.
  - Practical and conceptual coherence: How well does the criterion align with biological reality and avoid contradictions?

  Ranking:

  1. **Shewmon's objection (5)**: It points out that whole-brain death does not necessarily mean the loss of all integrative unity because some bodies can still perform integrative functions (like healing, fighting infection, gestating). This is a strong critique because it is based on empirical evidence and challenges the biological foundation of the whole-brain criterion. Thus, it is the most defensible as it highlights the biological reality.

  2. **The plain old circulatory-respiratory criterion (4)**: This is the traditional criterion: cessation of circulatory and respiratory functions, which leads to the death of the organism because without these, cells die rapidly. It is biologically fundamental and irreversible in the context of death determination (when circulation stops and does not return). It is the basis for donation after circulatory death and is straightforward.

  3. **The classic whole-brain view (1)**: Despite Shewmon's critique, this view has been the standard and attempts to capture the loss of the organism as a whole. The brain is the central integrator, and its irreversible loss means the body cannot function as a coordinated unit. However, Shewmon's evidence weakens it.

  4. **The Presidents Council's 2008 patch-job (2)**: This redefines death as the loss of the capacity for the "basic vital work" of a living thing (openness, acting, needing). It tries to avoid the integration problem but is vague and not clearly tied to a specific biological marker. It's an attempt to salvage the whole-brain view but lacks precision.

  5. **The higher-brain/neocortical view (3)**: This focuses on the loss of consciousness. However, for the organism as a biological entity, consciousness is not necessary. An organism can be alive (e.g., in a persistent vegetative state) without consciousness but still have integrated biological functions (e.g., maintained by the brainstem). Therefore, it is less defensible for organismic death.

  6. **The "legal fiction" view (6)**: This admits that brain death is a legal construct for practical purposes (like transplantation) and not biological death. While it might be honest, it does not provide an account of biological death and instead avoids the biological question. Thus, it is the least defensible as an account of when the organism actually dies.

  Therefore, the ranking from most to least defensible is: 5, 4, 1, 2, 3, 6.

