  Okay, the user is a co-host of a podcast on decision theory and rationality. They're preparing for an interview with a decision theorist specializing in Updateless Decision Theory (UDT). They want to go beyond basic explanations and dive into deeper, more nuanced aspects of UDT. Let me break down their request.

  First, they mentioned three main areas to cover: intuitive resistance in counterfactual mugging, evaluating policies 'from the prior', and the shift from UDT1 to UDT1.1. They also want to end with what could count as evidence against UDT. 

  For the counterfactual mugging, the user is aware that people struggle with paying after knowing the coin is tails. The guest might explain it as precommitment or logical uncertainty, but the deeper issue is why this feels irrational. The follow-up should challenge whether UDT's solution feels like rationalization rather than true rationality. Need to frame the question to address the emotional vs. logical conflict.

  Next, evaluating from the prior. The user wants the mechanical explanation, especially for logical vs. physical uncertainty. The guest might say it's about logical correlations, but the follow-up needs to push on whether this is just a trick or if there's a real epistemic stance. Also, clarify if logical cases change the evaluation process.

  Then, UDT1 vs. UDT1.1. The user recalls the patch was for coordinated actions, like in Parfit's Hitchhiker. The guest will mention that UDT1.1 optimizes the entire policy. Follow-up should ask if this makes UDT more descriptive than normative, or if it's computationally feasible. Highlighting the shift from individual actions to global mapping.

  Finally, what would falsify UDT. The user wants to avoid perpetual patches. The guest might mention edge cases or coherence. Follow-up should push for concrete scenarios where UDT clearly fails, maybe in multi-agent settings or emergent problems. Ask if there's a point where the framework becomes too cumbersome.

  Need to ensure questions are respectful but probing. The user and co-host are software engineers without formal philosophy training, so avoid jargon. Make sure questions lead to insightful discussions beyond standard explanations. Also, end with a forward-looking question about the future of UDT to wrap up positively.
answer: |-
  Here are 8 focused interview questions probing the deeper conceptual edges of UDT, designed to move beyond standard exposition, with follow-ups keyed to likely answers:

  1.  **Core Resistance in Counterfactual Mugging:** "The visceral objection to paying in Counterfactual Mugging (after knowing Omega was right about tails) seems rooted in a feeling that rationality *must* be 'myopic' – only caring about actual causal consequences *now*. How does UDT fundamentally reframe the concept of 'consequence' to overcome this, and does it require abandoning the intuitive link between rationality and *local* causal efficacy entirely?"
      *   *Likely Answer:* Appeal to precommitment, logical correlation across branches, or the agent's identity being tied to its policy.
      *   **Follow-Up:** "If UDT tells me to pay *despite* knowing my $100 literally cannot cause the $10k to exist, doesn't that risk feeling like a *post hoc rationalization* for cooperation rather than true instrumental rationality? How do you distinguish UDT's 'consequence' from a kind of magical thinking where paying 'honors the idea' of the precommitment?"

  2.  **Mechanics of Prior Evaluation (Physical Uncertainty):** "Walk us through the *mechanics* of evaluating a policy 'from the prior' in a case you *already know* obtained. Say, in Newcomb's, *after* seeing the $1M in Box A. UDT says to one-box because the *policy* of one-boxing was best *ex ante*. But what does it mean, operationally, for the agent *in that moment* to 'evaluate from the prior'? Is it literally simulating its past ignorant self's calculations, or is it something else?"
      *   *Likely Answer:* The agent executes the action dictated by the *optimal policy* it computed *ex ante* using its prior, regardless of subsequent knowledge that renders the counterfactual irrelevant causally.
      *   **Follow-Up:** "So is the 'evaluation from the prior' *only* a justificatory story we tell *about* why the policy was chosen beforehand? Is the *actual* decision *in the moment* simply 'follow the precomputed optimal policy', making the 'prior evaluation' purely historical?"

  3.  **Mechanics of Prior Evaluation (Logical Uncertainty):** "How does this 'evaluation from the prior' change when the uncertainty is logical (e.g., an unknown digit of Pi)? Here, the 'prior' isn't over physical states but over mathematical truths. How does UDT formally model the 'prior' over logical possibilities, and how does it evaluate a policy's performance against a logical fact it hasn't proven yet?"
      *   *Likely Answer:* Use a logical prior (e.g., universal prior over programs/statements). The agent evaluates the expected utility of a policy by weighting outcomes according to the *probability it assigned ex ante* to different logical possibilities being true.
      *   **Follow-Up:** "Doesn't this create a potential disconnect? The agent might compute a policy based on a high *ex ante* probability that (say) P=NP, leading to one action. But if it later *proves* P!=NP, doesn't executing the 'optimal *ex ante* policy' feel irrational because the *ex ante* probabilities were fundamentally *wrong* about the logical structure of reality? Is UDT vulnerable to being 'surprised by proof'?"

  4.  **The UDT1 to UDT1.1 Jump - Motivation:** "You've mentioned UDT1 and UDT1.1. My understanding is UDT1 evaluated the best action *per observation*, potentially leading to inconsistency. UDT1.1 evaluates the entire mapping (policy) *jointly*. What was the specific failure mode in UDT1 that necessitated this shift to joint optimization? Was it just Parfit's Hitchhiker, or something deeper?"
      *   *Likely Answer:* Parfit's Hitchhiker is the classic example (UDT1 might defect at the end, ruining the driver's reason to save it earlier). The deeper issue is lack of coordination across different decision nodes within the same policy for a single agent across time/information states.
      *   **Follow-Up:** "Doesn't moving to joint policy optimization fundamentally change the *unit* of agency? Instead of an agent deciding 'what to do *now*', it's an abstract entity choosing a complete contingent plan. Does this make UDT less a theory of *decision-making* and more a theory of *optimal plan design* for a hypothetical creator?"

  5.  **UDT1.1 - Normative Status vs. Computational Reality:** "UDT1.1 requires finding the globally optimal policy over all possible observations. For any remotely complex agent embedded in the real world, this seems computationally intractable – literally impossible. Does this undermine UDT's claim to being a *normative* theory of rationality? If rationality is defined by an uncomputable ideal, can it guide real agents?"
      *   *Likely Answer:* Normative theories often posit ideals (e.g., Bayesian reasoning). We aim for approximations (heuristics, bounded UDT).
      *   **Follow-Up:** "But unlike, say, Bayesian updating which *can* be approximated incrementally, UDT1.1 seems to require a *simultaneous* global optimization that resists decomposition. Are there principled ways to *decompose* the UDT1.1 problem into tractable chunks without reintroducing the inconsistencies UDT1.1 was designed to fix?"

  6.  **Counterfactuals and Agent-Causation:** "UDT relies heavily on evaluating counterfactuals about what would happen if it chose different policies. How does UDT ground these counterfactuals, especially concerning the agent's *own* actions? Does it require a specific theory of causation or agent-counterfactual independence that might be contentious?"
      *   *Likely Answer:* It relies on a logical/correlation-based view of counterfactuals, often using models like logical induction or proof-based worlds.
      *   **Follow-Up:** "Critics might argue this smuggles in a form of 'acausal causation' that lacks clear metaphysical grounding. How does UDT respond to the charge that its counterfactuals are merely useful fictions for achieving coordination, rather than descriptions of real dependencies?"

  7.  **Falsifiability - What Counts Against UDT?:** "UDT has evolved through patches (UDT1 -> UDT1.1, logical priors, etc.) to handle various thought experiments. What kind of result or scenario would you consider a *fundamental* challenge to UDT, rather than just another edge case requiring a patch? Is there a conceivable failure mode that would make you significantly reconsider its core tenets?"
      *   *Likely Answer:* Perhaps an unavoidable trade-off situation where UDT mandates clearly dominated strategies, or a multi-agent scenario where UDT agents reliably lose out to agents using simpler, updateful strategies in iterated settings. Maybe a deep inconsistency revealed in the logical prior framework.
      *   **Follow-Up:** "Relatedly, does UDT have clear *competitors* that offer a comparably broad solution to Newcomb-like problems *without* what some see as its counterintuitive epistemic leaps (like ignoring known information when 'evaluating from the prior')? If not, does that lack of alternatives make UDT harder to falsify?"

  8.  **The Future & Philosophical Commitments:** "Looking beyond technical refinements, what do you see as the biggest *philosophical* hurdle UDT needs to overcome for wider acceptance? Is it the handling of logical uncertainty, the grounding of counterfactuals, the computational demands, the intuitive resistance to 'updatelessness', or something else? And what's the most exciting frontier for UDT right now?"
      *   *(This ends on a forward-looking note, inviting reflection on the broader landscape and challenges).*

  **Key Considerations for Delivery:**

  *   **Tone:** Frame these as genuine inquiries born from deep engagement, not gotchas. Phrases like "Help us understand...", "How does UDT grapple with...", "Some critics argue X, how do you respond?" set a collaborative tone.
  *   **Listen Closely:** The follow-ups depend *entirely* on her specific answers. Be prepared to adapt or skip a follow-up if her answer already pre-empts it or takes the discussion in a different but fruitful direction.
  *   **Clarify Jargon:** If she uses terms like "logical inductor," "proof-based decision theory," or "acausal trade," don't hesitate to ask for a brief layman's explanation for the audience.
  *   **UDT1/1.1 Confirmation:** Start Question 4 with: "Just to confirm my terminology, when I refer to UDT1 and UDT1.1, am I correctly characterizing the shift from per-observation to joint policy optimization?"

  This set should push the conversation into the philosophical and technical heartwood of UDT, exploring its justifications, mechanics, limitations, and boundaries, while respecting the guest's expertise. Good luck with the episode!
