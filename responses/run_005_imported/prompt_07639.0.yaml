  ### Key Corrections:
  1. **Greaves' Actual Conclusion** (from 2016 paper, §7-8):  
     Complex cluelessness makes consequentialism *epistemically inaccessible*, not false. She explicitly rejects that it "refutes consequentialism" and argues it remains the correct *theory* even if we cannot apply it practically.

  2. **Complex Cluelessness Example**:  
     A complete example requires two elements:  
     - An intervention with systematic long-term effects (e.g., malaria eradication)  
     - An *axiological conflict* (e.g., increasing population may boost total utility but lower average utility)  
     The student omitted the second, which is essential to the "moral uncertainty" point.

  3. **EV Cancellation Nuance**:  
     Simple cluelessness cancellation relies on the *expectation* of net effects being zero (not just narrative symmetry). The student's phrasing implied but didn't emphasize this probabilistic foundation.

