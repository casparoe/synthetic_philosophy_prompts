      "attribution_accuracy": {"score": <0-4>, "comment": "<string>"}
    },
    "overall_comment": "<string>"
  }
  ```

  I would rather you be exacting than charitable: where the answer earns its marks, say precisely why, and where it does not, say exactly what is wrong and, ideally, what the correct view actually is.
reasoning: |-
  Alright, let me tackle this grading request. The user is an experienced EA Forum reader and GPI paper consumer who's TAing a grad seminar - they clearly know cluelessness literature inside out. Their worry about over/under-grading due to expertise is very valid. 

  Hmm, the student's answer is impressively fluent but I spot some subtle inaccuracies. Starting with simple cluelessness: the student correctly describes symmetric uncertainties canceling out, but misses that the cancellation happens in expectation calculation, not just narratively. That's a 3/4 point - mostly right but lacking precision.

  For complex cluelessness, they nail the asymmetric uncertainty aspect but misrepresent Greaves' example. The population dynamics case isn't just about size effects; it's specifically about how size interacts with value trajectories. Also minor but important: they say "effects on population size" when Greaves frames it as affecting population growth rates. Still, 3/4 feels fair.

  The examples section is tricky. Their simple cluelessness airplane example is perfect textbook material. But the complex one... oof. Paraphrasing Greaves' population case without specifying the value-theoretic uncertainty (average vs. total utilitarianism) is a significant omission. That drops it to 2/4.

  On consequentialism implications: big problem here. The student claims Greaves thinks complex cluelessness falsifies act consequentialism, but that's inverted! Greaves explicitly argues it doesn't undermine the theory itself, just our ability to apply it. Major error - this deserves 1/4 at best.

  Attribution accuracy is mostly solid: correct years, core concepts attributed properly. But exaggerating Lenman's original scope ("indefinitely into the future" vs his 100-200 year frame) and that consequentialism falsification claim are nontrivial. 3/4 seems right.

  Overall? The answer showcases good comprehension but has dangerous misreadings of key conclusions. 12/20 feels harsh but justified - the normative implications error is particularly serious for a grad ethics seminar. My feedback should emphasize how close-but-wrong some points are, especially given Greaves' actual defense of consequentialism.
