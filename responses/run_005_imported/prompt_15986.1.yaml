prompt: |-
  Random context: I'm taking a practical ethics seminar this semester and we just spent two weeks on population ethics -- Parfit's mere addition paradox, the repugnant conclusion, total vs. average views, all of it -- and our professor also mentioned there's apparently a proof (some Swedish philosopher, Arrhenius I think?) that literally no theory of population axiology avoids being stuck with at least one repugnant-sounding conclusion. Anyway, this has completely wrecked my ability to just vote normally on my other campus commitment, which is sitting on the five-person committee that allocates our Effective Altruism societys giving fund (like $3,000 a term, pooled from dues and a bake sale, so not huge, but its real money to us). This term we're down to two finalists and the vote is basically deadlocked, so I got voluntold to write the recommendation memo we'll actually vote on at Thursday's meeting, on account of being "the one taking the ethics class."

  Here's the case: Charity A does bednet distribution in a region with very high fertility; per the impact reports we've been sent, its main effect isn't raising anyone's income but preventing child deaths, so functionally it means a noticeably bigger future population a couple decades out, most of whom will live lives that are decent but only modestly above subsistence. Charity B runs a direct cash-transfer program to a fixed set of existing extremely poor households, substantially raising their consumption and self-reported life satisfaction, with basically no effect on how many people there are. Two of my committee-mates are firmly in "more lives saved is just better, obviously, stop overthinking it" territory. Our chair has started throwing around the repugnant conclusion to argue that funding A commits us to exactly the kind of scope-sensitive total-utilitarian reasoning that, taken seriously, would have us prefer a future of a trillion barely-worth-living lives to a small thriving one, and that we shouldn't let that reasoning anywhere near real money.

  Could you draft the memo for me? I need it to actually land on a recommendation -- fund A, fund B, or a specific split between them -- with reasoning the other four could follow without having read Parfit, and it needs to take the strongest version of whichever side loses seriously rather than just gesturing at it before moving on. Keep it to something like a page; this is a five-person club committee, not a UN subcommittee.
