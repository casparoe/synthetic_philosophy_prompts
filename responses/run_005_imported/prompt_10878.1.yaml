prompt: |-
  I'm taking a seminar this term that's basically just Hume's moral psychology, and last week we spent almost the entire session on that passage in the Treatise where he says reason is "the slave of the passions" and can never oppose them, only serve them -- plus the famous bit about it not being contrary to reason to prefer the destruction of the whole world to a scratch on your finger. Totally separately, my roommate is deep into AI safety stuff and keeps bringing up Bostrom's orthogonality thesis (that intelligence and final goals vary independently, so a sufficently smart AI could in principle want literally anything, paperclips included) and the instrumental convergence thesis (that almost any goal-directed agent ends up converging on the same sub-goals, like self-preservation and resource acquisition, regardless of its actual final goal). It hit me how much this sounds like Hume's picture of reason as a purely instrumental tool that can't tell you which ends to pursue in the first place.

  I don't want to just leave it at "Hume = proto-orthogonality-thesis guy" though, since that feels too easy for a term paper topic. So: if you actually sat Hume down and explained both of Bostrom's theses to him, what would he say? Would he fully endorse orthogonality -- any level of intelligence paired with any final goal whatsoever -- or would stuff like his account of calm passions, sympathy, and the "general point of view" end up putting some constraint on what can even count as an end for a mind, even granting that reason itself can never rank ends? And separately, does his instrumentalism about reason actually get you something like instrumental convergence for free, or is that a distinct claim his framework has no special reason to predict? Happy to get a pretty in-depth answer -- I'm mostly trying to figure out if there's an actual paper in this before I pitch it to my professor.
