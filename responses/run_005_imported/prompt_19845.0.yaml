  "I think disjunctivism actually has an easier time with hallucination than illusion, since in hallucination there's simply no object there at all, so the disjunctivist can just say nothing perceptual is going on, whereas illusions involve a real object being misperceived in a way that seems to invite a common causal story after all."

  This is a bit mixed. The question is: whether the disjunctivist has an easier time blocking the argument from illusion or the argument from hallucination.

  The argument from hallucination is similar to the argument from illusion: it uses cases of hallucination (which are subjectively indistinguishable from veridical perception) to argue that in the veridical case we are not directly aware of the external object because the same kind of experience (a sense-datum) is present in both.

  Disjunctivism typically holds that veridical perception and hallucination are fundamentally different kinds of mental states, so they do not share a common factor. However, disjunctivism must account for the subjective indistinguishability.

  The answer claims that disjunctivism has an easier time with hallucination because in hallucination there is no object, so "nothing perceptual is going on". But this is an oversimplification. Disjunctivists do not typically say that in hallucination "nothing perceptual is going on". Instead, they might say that the hallucination is a state that is introspectively indistinguishable from perception but is not a perception (because there is no object). However, the challenge for disjunctivism is to explain how a hallucination can be subjectively indistinguishable from a perception if they are fundamentally different. This is often called the "screening off" problem.

  On the other hand, for illusion, the disjunctivist might say that in an illusion, one is still perceiving the object, but it is appearing in a non-veridical way. The answer says that illusions "seem to invite a common causal story", which might make it harder for disjunctivism because in illusion there is an object and in veridical perception there is an object, so the causal story might be similar, leading to the idea of a common factor.

  However, the standard view in the literature is that disjunctivism has a harder time with hallucination than with illusion. Why? Because in illusion, the disjunctivist can maintain that the subject is directly perceiving the object (the stick) but that it appears bent due to the conditions (water). So they can deny that there is a sense-datum and say that the object is directly perceived, just not all its properties are accurately represented. But in hallucination, there is no object at all, so the disjunctivist must say that the state is not a perception, but then how can it be subjectively the same? This is a challenge.

