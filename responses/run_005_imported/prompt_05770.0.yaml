  So last night my friend Priya and I ended up in a two hour argument about her motorbike of all things -- she's swapped out literally every part since she bought it in uni (frame, engine, tank, the lot, just never all at once) and she insists its still "the same bike," which somehow spiralled into a full-on fight about perdurantism vs endurantism that neither of us was really equipped to have and ended with me reading about temporal parts on my phone at 1am instead of sleeping. Anyway the timing works out because I co-host a tiny philosophy podcast and next month's guest is a metaphysician who's built her career defending stage theory -- the four-dimensionalist view where ordinary objects are momentary stages and all the "was a child," "will be at the concert" talk gets cashed out through counterpart relations instead of literal identity over time. I don't want to waste the slot on questions she's clearly answered a thousand times before, so I want to actually get into the machinery of the view.

  Could you draft me eight to ten interview questions that push past having her just restate the position? I want at least one question, plus a natural follow-up keyed to whatever answer she's most likely to give, on each of: the rotating homogeneous disc case, where two disc-histories look stage-by-stage identical but one is supposedly spinning, and how she gets a real difference out of that without quietly reintroducing something like primitive persistence; whether her counterpart-theoretic story about "survival" can actually justify ordinary prudential concern, given that on her view the stage enjoying my birthday party next week just isn't numerically me; the tension between her presumed sympathy for Sider's argument from vagueness -- which pushes toward accepting weird unrestricted fusions like trout-turkey -- and the "too many thinkers" problem that same permissiveness seems to generate, since practically any random sub-fusion of my temporal parts looks like it'd satisfy the criteria for being a thinking person too; and whether her answer to Lewis's problem of temporary intrinsics is actually doing different work than the endurantist who just relativizes property-having to times, or whether that's ultimately a verbal dispute. Keep it sounding like a real conversation and not a written exam.
