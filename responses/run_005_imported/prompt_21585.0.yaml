prompt: |-
  In my decision theory seminar, we've just moved from causal and evidential decision theory to Wei Dai's updateless decision theory (UDT) as a way of handling puzzles like counterfactual mugging, where an agent who conditions on which branch of the problem it actually ended up in seems to talk itself out of the choice that would have served it best beforehand. My understanding is that UDT resolves this by having the agent simply decline to update its probabilities on new evidence, since conditionalizing on what it observes is exactly what gets ordinary Bayesian agents into trouble in these cases. For this week's problem set we have to apply UDT to a new variant of counterfactual mugging, and I want to make sure I'm setting it up correctly: when the agent learns which way the coin landed, should its credence stay fixed at the prior probability rather than being updated on that observation, since that's presumably what makes the theory "updateless"?
reasoning: |-
  Okay, the user is in a decision theory seminar and they're tackling Wei Dai's Updateless Decision Theory (UDT). They need to apply UDT to a new counterfactual mugging variant. Their main question is about whether credences should stay fixed at the prior when the coin flip outcome is observed. Let me unpack this.

  First, I recall that UDT is designed to handle problems where updating on evidence leads to suboptimal decisions. In counterfactual mugging, if a Bayesian agent updates on the coin flip, they might refuse to pay in the losing branch because it doesn't benefit them directly. UDT avoids this by not conditioning actions on the observed state. 

  The user's confusion might stem from the term "updateless." It doesn't mean ignoring all information. Instead, it means choosing a strategy in advance that considers all possible observations. So when the agent observes the coin result, they don't update their beliefs about the coin's probability because they already know the prior. But more importantly, they stick to a precommitment strategy.

  The key here is that UDT agents decide on a policy (a function from observations to actions) before getting any information. The agent evaluates this policy based on expected utility over all possible worlds, using the prior. When they observe an outcome, they don't change their strategy; they just execute the precommitted action for that observation. 

  In the counterfactual mugging example, the prior probability of heads is 0.5. Even after seeing tails, the agent knows the prior but doesn't use it to recalculate expected utility. Instead, they follow the policy: if heads, do nothing; if tails, pay up. This policy is chosen because it maximizes expected utility pre-observation, considering both branches.

  So the user should set up the problem by defining the strategy first, then calculating expected utility using the prior. The agent's action upon seeing the outcome is determined by this precomputed strategy, not by updating credences and recalculating on the spot. The "updateless" aspect is about not changing the strategy based on new information, even though they use the information to select the appropriate action from their predefined plan.
answer: |-
  You've grasped the core intuition behind UDT, but the term "updateless" can be slightly misleading. Let's clarify how UDT handles observation and credences in your counterfactual mugging variant:

  1.  **UDT Does Not Ignore Observations:** The agent *absolutely* learns and uses the observation (e.g., which way the coin landed). This information tells it *which branch* of the decision problem it is actually in.

  2.  **UDT Does Not Update *Strategies* Based on Observations:** This is the crucial "updateless" part. Instead of:
      *   Observing evidence (`Coin = Heads`),
      *   Updating its beliefs about the world *in a way that might change its fundamental decision rule*,
      *   Then calculating the optimal action *given its new position* (which leads to CDT/EDT failures),
      UDT takes a different approach:
      *   **Before** seeing any evidence, the agent considers *all possible observations* it *could* make (e.g., `Heads` or `Tails`).
      *   It evaluates **policies** (or **strategies**). A policy is a function that maps each possible observation to an action (`f(Heads) = Action_A`, `f(Tails) = Action_B`).
      *   It chooses the *single policy* `f` that maximizes **expected utility according to its *prior* probabilities** over all possible worlds/observations.
      *   **After** observing the actual evidence (e.g., `Tails`), it simply **executes the action specified by its pre-selected policy for that observation** (`f(Tails)`).

  3.  **Credences in UDT:**
      *   **Prior Probabilities:** The agent absolutely uses its prior probabilities (e.g., P(Heads) = 0.5, P(Tails) = 0.5). This is essential for calculating the expected utility of different policies.
      *   **"Not Updating" Credences?** The agent *knows* the observation has happened. However, it **does not use the *posterior* probability of the coin flip state *to re-evaluate the optimality of its chosen policy*** at the moment of action. Why? Because the optimality was *already decided* in the timeless/god's-eye view *before* the observation, considering the full prior distribution.
      *   **The Role of the Observation:** The observation *only* serves to tell the agent *which line of its pre-committed policy to execute*. It doesn't trigger a re-calculation of "what's best for me *now* given this new information," because that re-calculation is what leads to CDT/EDT failures. The agent trusts the pre-commitment made under the prior.

  **Applying UDT to Your Counterfactual Mugging Variant:**

  1.  **Define the Problem:** Clearly state the possible states (e.g., `Heads`, `Tails`), the prior probabilities (e.g., `P(Heads) = p`, `P(Tails) = 1-p`), the possible observations (presumably the coin outcome itself), the possible actions (e.g., `Pay`, `Don't Pay`), and the payoffs in each state-action combination.
  2.  **Enumerate Policies:** List all possible functions from observations to actions. For a binary coin and binary action, there are 4:
      *   `f1`: `Heads -> Pay`, `Tails -> Pay`
      *   `f2`: `Heads -> Pay`, `Tails -> Don't Pay`
      *   `f3`: `Heads -> Don't Pay`, `Tails -> Pay`
      *   `f4`: `Heads -> Don't Pay`, `Tails -> Don't Pay`
  3.  **Calculate Expected Utility (EU) under Prior:** For each policy `f_i`, calculate its expected utility using the **prior probabilities** over the states/observations:
      `EU(f_i) = P(Heads) * U(f_i(Heads), Heads) + P(Tails) * U(f_i(Tails), Tails)`
      Where `U(action, state)` is the payoff for taking `action` in `state`.
  4.  **Choose Optimal Policy:** Select the policy `f_i` with the highest `EU(f_i)`.
  5.  **Execute Policy:** When the agent observes the actual coin outcome (e.g., `Tails`), it looks up the action specified by the optimal policy for that observation (e.g., `f_optimal(Tails)`) and performs that action.

  **How Credences Appear in the Setup:**

  *   The prior probability `P(Heads)` and `P(Tails)` are **crucially used** in Step 3 to calculate the expected utility of each policy.
  *   **When the agent observes the coin land (e.g., Tails):**
      *   It *knows* it's in the `Tails` state.
      *   Its "credence" that it's in `Tails` is effectively 1.0 (it's certain).
      *   **However, it does *not* use this certainty to re-calculate:** "Given I'm *definitely* in Tails, what action maximizes *my* payoff *now*?" Doing that would be CDT/EDT thinking and leads to `Don't Pay`.
      *   Instead, it recalls the *pre-committed policy* chosen under the *prior* (`P(Heads)=0.5, P(Tails)=0.5`). That policy was chosen *because* `Pay` in `Tails` was part of a strategy that yielded a higher *overall* expected utility across *both* possible worlds. It executes `f_optimal(Tails)` = `Pay`.

  **In Summary:**

  *   **Yes**, the agent uses its prior probabilities to evaluate policies.
  *   **Yes**, the agent learns and uses the observation to know which branch it's in.
  *   **The "updateless" aspect means:** The agent does **not** use the *observation itself* as a reason to *re-evaluate which strategy is optimal*. It pre-commits to a strategy (a map from observations to actions) based on prior expectations and then follows that map faithfully, *even if* following the map in the observed branch seems locally suboptimal by CDT/EDT standards.
  *   **Credences:** The prior credences are essential for policy selection. The agent *becomes certain* of the state after observation, but this certainty **does not override the pre-commitment** made under the prior uncertainty. The "not updating" refers to **not updating the *decision rule/strategy*** based on the observation.

  **For your problem set:** Focus on defining the states, priors, observations, actions, payoffs, enumerating the policies, calculating their expected utilities using the priors, selecting the best policy, and specifying what action that policy dictates for each possible observation. That's the core UDT procedure. Don't get hung up on the agent "ignoring" the observation; it uses it to select the correct action from its pre-chosen playbook.
