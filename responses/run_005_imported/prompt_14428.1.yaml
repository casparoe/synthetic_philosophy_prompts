  ### Final Verdict
  - **Marcus is technically correct for EUT**: No single EUT utility function justifies both choices. EUT defines "rationality" as consistency with its axioms, so by that narrow definition, your choices are irrational.
  - **But descriptively, you are not irrational**: Prospect Theory—a Nobel Prize-winning framework—explains your choices as predictable, human, and coherent within its own assumptions. Your feelings ("both choices feel right") align with how most people react.
  - **Cost of holding both preferences**: While defensible under PT, these preferences **make you vulnerable to exploitation** in structured decisions (e.g., compound lotteries, sequential bets). A savvy counterparty could use your inconsistent weighting of probabilities or reference points to create situations where you lose money.

