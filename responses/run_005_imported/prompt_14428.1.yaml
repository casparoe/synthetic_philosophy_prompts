    u_{50} > 0.89u_{50} + 0.10u_{250}
    \]
    Simplifying:
    \[
    0.11u_{50} > 0.10u_{250} \implies u_{50} > \frac{10}{11}u_{250} \quad \text{(Equation 1)}
    \]

  **Second Choice:**
  - \(11\%\) chance of \(50K\): EU = \(0.11u_{50}\).
  - \(10\%\) chance of \(250K\): EU = \(0.10u_{250}\).
