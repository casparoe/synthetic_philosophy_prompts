  #### 2. **Is There a Coherent Rational Defense?**
  Yes! **Prospect Theory (PT)**, developed by Kahneman and Tversky, explains your choices without labeling them as irrational. PT accounts for how people *actually* decide under risk, incorporating:
  - **Reference Dependence**: Outcomes are evaluated relative to a reference point (e.g., status quo).
  - **Probability Weighting**: Small probabilities are overweighted, large probabilities underweighted.
  - **Loss Aversion**: Losses hurt more than equivalent gains.

  **Defending Your Choices with Prospect Theory:**
  - **First Choice**: The guaranteed \(50K\) sets a natural reference point. Here:
    - The gamble is framed as:
      - \(89\%\): No change (gain of \(0\) relative to \(50K\)).
      - \(10\%\): Gain of \(200K\) (\(250K - 50K\)).
      - \(1\%\): Loss of \(50K\) (down to nothing).
    - Loss aversion makes the \(1\%\) chance of losing \(50K\) feel extremely aversive. Even if \(u(200K)\) is large, the overweighted small probability of loss (due to PT's probability weighting function) tips the scales toward the safe option.
  - **Second Choice**: Both options are gains relative to \(0\), so loss aversion doesn't apply. Here:
    - The outcomes are large ($50K vs. $250K), and the probabilities are small (10% vs. 11%).
    - PT's probability weighting function overweights small probabilities (e.g., 10% feels like 15–20%). The higher overweighting for the rarer, larger gain (\(250K\)) makes it more attractive despite its slightly lower probability.
    - Additionally, PT's value function is concave for gains (diminishing sensitivity), so \(u(250K)\) is less than 5 times \(u(50K)\), but the overweighted probability compensates:
      \[
