  Let me unpack this philosophical debate. The core tension is between conciliationism (Lena's view that peers should average their estimates) and steadfastness (Owen's view that one can stick to their estimate based on domain expertise). This touches on deep issues in epistemology - how we justify beliefs when experts disagree.

