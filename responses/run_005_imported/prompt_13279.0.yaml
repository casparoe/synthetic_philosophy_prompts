answer: |-
  Here are eight interview questions designed to press the historian on the continuity thesis, incorporating your specific requirements and including follow-ups. Each core question targets a key aspect of the argument, and the follow-ups aim to deepen the analysis based on predictable answers:

  1.  **Core Question (Bridging the Gap):** Your biography argues Sidgwick saw psychical research as a continuation of his struggle with the "dualism of practical reason." Sidgwick explicitly framed the dualism as a *logical* problem in practical reasoning – the inability to rationally reconcile egoism and utilitarianism. How, precisely, would *empirical* evidence for personal survival – even if obtained – have resolved this *philosophical* impasse? Would proof of an afterlife genuinely make egoism rationally *subordinate* to utilitarianism, or merely make them coincidentally aligned?
      *   **Likely Answer:** She might argue survival transforms self-interest to encompass eternal consequences, making duty (utilitarianism) the *only* rational long-term self-interest.
      *   **Follow-up:** But doesn't this merely make utilitarianism *prudent* for the selfish individual? Sidgwick despaired that reason alone couldn't prove duty *intrinsically* superior. Doesn't relying on survival evidence sidestep that core philosophical problem, potentially reducing ethics to enlightened self-interest based on a contingent fact?

  2.  **Core Question (Failed Investigation & Philosophical Weight):** Sidgwick invested immense hope in Eusapia Palladino, only for the SPR to later expose her fraud conclusively after his death. Given his profound personal investment, what does his documented reaction (or lack thereof, due to timing) to the *pattern* of such disappointments (e.g., Slade, other mediums) reveal about how much *philosophical resolving power* he genuinely rested on obtaining *positive* results? Did failure shake the foundations of the research program for him, or was the *process* itself fulfilling a different philosophical need?
      *   **Likely Answer:** She might emphasize his persistent hope, rigorous methodology despite disappointment, or argue the search itself embodied a moral commitment.
      *   **Follow-up:** If the *search* was paramount, doesn't that suggest the psychical research was less about *solving* the dualism through evidence and more about performing a kind of existential due diligence or maintaining a necessary "hope" – which sounds closer to a psychological or moral stance than a rigorous philosophical resolution?

  3.  **Core Question (Inconclusive Reports: Honesty or Paralysis?):** Sidgwick and Eleanor were famously scrupulous, often concluding reports with statements like "nothing conclusive." You frame this as intellectual honesty within the continuity of his ethical project. Could this relentless inconclusiveness, however, also be read as a manifestation of the *very paralysis* induced by the dualism? Was their methodological rigor, admirable as it was, also a way to perpetually defer a definitive answer they perhaps feared wouldn't come, or wouldn't solve the core problem even if it did?
      *   **Likely Answer:** She'll likely defend it as exemplary scientific integrity, reflecting his philosophical commitment to truth over wishful thinking.
      *   **Followup:** Granting the integrity, does the *persistence* of this pattern across decades, coupled with Sidgwick's known personal despair over the dualism, suggest the research program functioned more as a demanding ritual of intellectual purity – a way to *live* with the unresolved dualism – rather than a viable path to its actual resolution?

  4.  **Core Question (Modern Evidential Parallels):** The controversy surrounding Daryl Bem's precognition experiments highlighted intense debates about evidential standards, replication, and prior plausibility in psychology. Drawing on your understanding of Sidgwick's approach, what's the most telling parallel or disanalogy between the standards *he* demanded for SPR phenomena (like telepathy) and the standards invoked *against* Bem? Does this comparison strengthen or weaken the idea that Sidgwick's psychical research maintained his characteristic philosophical rigor?
      *   **Likely Answer:** She might note Sidgwick's demand for extraordinary evidence, focus on fraud prevention, and statistical care were ahead of his time, aligning with modern critiques of Bem.
      *   **Followup:** But Sidgwick actively *sought* evidence for the extraordinary, driven by a profound philosophical need. Doesn't this underlying *motivation* – the "will to believe" in a solution to the dualism – create a crucial disanalogy with modern critics of Bem, who often start from a stance of high skepticism? Could Sidgwick's rigor, however strict procedurally, have been inherently biased by his desperate *hope* for a specific outcome?

  5.  **Expansion Question (Eleanor's Role & Shared Burden):** How central was Eleanor Sidgwick's own intellectual temperament and ethical outlook – particularly her formidable analytical mind and caution – to the *form* that Sidgwick's psychical research took? Does their partnership, especially in those inconclusive reports, suggest the "continuity" was as much about a shared existential and ethical burden as solely Henry's philosophical project?
  6.  **Expansion Question (Methodology as Philosophy):** Sidgwick insisted on applying the most rigorous available empirical methods to psychical phenomena. Can this methodological stance itself be seen as the "continuation of the argument"? Was he, in effect, testing whether the tools of natural science and reason *could* meaningfully engage with questions he feared lay beyond them, thereby probing the limits of his own rationalist philosophy?
  7.  **Expansion Question (Theology vs. Philosophy):** Sidgwick was famously skeptical of theological solutions to the dualism. Did psychical research offer a potential path that felt *distinct* from traditional theology – a scientifically-grounded, empirically verifiable foundation for ethics – thereby preserving his commitment to rationalism and secular inquiry in a way dogma could not?
  8.  **Closing Question (Defining Success):** After decades of meticulous, often frustrating investigation yielding mostly negative or ambiguous results, what result or state of knowledge *would* have constituted genuine "success" for Henry Sidgwick, specifically in terms of addressing the fundamental problem of the dualism of practical reason? Was absolute proof necessary, or would a strong balance of probability have sufficed? Or was success always just out of reach, defined by the perpetual search itself?

  **Why this approach works:**

  *   **Holds to the Thesis:** Each question explicitly references or builds upon the continuity thesis, forcing the historian to engage with it directly in challenging contexts.
  *   **Targets Specific Weaknesses:** The questions pinpoint potential vulnerabilities in the continuity argument (empirical vs. philosophical resolution, weight on results vs. process, inconclusiveness as symptom, motivation vs. methodology).
  *   **Uses Concrete Examples:** Palladino, inconclusive reports, and the Bem parallel ground the discussion in specific historical and modern instances.
  *   **Follow-ups Deepen Inquiry:** They anticipate common defenses and push further, probing logical implications, potential contradictions, and underlying motivations.
  *   **Closes with the Stakes:** The final question forces a definition of "success," crucial for evaluating whether the research program could ever have achieved what Sidgwick ostensibly needed it to.

  Remember to listen actively and adapt the follow-ups based on her *actual* answers, using these as templates. Good luck with the interview! This sounds like a fascinating piece.
