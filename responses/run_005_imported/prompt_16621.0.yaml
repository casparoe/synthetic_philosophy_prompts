  Okay, let me start by unpacking the user's problem. They're preparing a seminar on moral responsibility and are stuck on the hypocrisy puzzle in the "standing to blame" literature. Specifically, they're confused about why hypocrisy undermines standing to blame but doesn't seem to affect praise, and they want to check their intuitions before lecturing.

  First, I need to recall the two main theories they mentioned: the fairness-based approach (like Wallace) and the demand-based approach (like Todd). The user is struggling with how these theories handle the asymmetry between blame and praise. The classic example is the adulterous politician whose hypocrisy invalidates his standing to blame others for infidelity, but an undisciplined coach can still praise discipline without issues. 

  The user's main concern is whether either theory can explain this asymmetry without just stipulating it. They also want to avoid the ad hominem fallacy—since the truth of the criticism isn't negated by hypocrisy. So, the core question is: what exactly does hypocrisy undermine if not the truth?

  Breaking down the fairness approach: Wallace's idea is that blame requires a symmetrical moral relationship. Hypocrisy breaks this symmetry because the blamer exempts themselves, making the relationship unfair. But why doesn't this apply to praise? If the coach is undisciplined but praises discipline, isn't that also asymmetrical? Here, I need to think about the nature of praise versus blame. Praise doesn't demand compliance; it acknowledges someone's adherence. There's no enforcement, so the unfairness isn't present. The coach isn't holding the athlete to a standard they themselves reject; they're celebrating the athlete's success. So the fairness issue only arises in enforcement contexts, which blame involves but praise doesn't.

  Now, the demand-based approach (Todd). Blame is like issuing a demand. When a hypocrite blames, their action contradicts the demand they're making, creating a Moore's paradox situation. For example, "Don't cheat!" while cheating themselves. But praise doesn't have this performative contradiction. Praising discipline doesn't require the praiser to be disciplined. There's no contradiction because praise isn't a demand for compliance; it's recognition of someone else's action. So the inconsistency only matters in contexts of demands.

  The user also mentioned complicity and "none-of-your-business" cases. The demand-based approach handles these better because they all involve failures in authority or consistency in holding others accountable. Praise doesn't involve holding someone accountable, so those issues don't arise. 

  The deeper need here might be for a coherent framework to present to students that resolves the asymmetry without ad-hoc explanations. The user might also want to confidently address potential student questions about why hypocrisy doesn't invalidate praise. They might be looking for real-world examples to illustrate the theoretical points. 

  Another angle: the user might be concerned about the meta-ethical implications. If hypocrisy doesn't affect truth, how does standing relate to moral realism? Emphasizing that standing is about the act of blaming, not the content, could help. The seminar needs to clarify that the criticism's truth remains, but the hypocrite isn't the right person to deliver it.

  I should also consider if there's a third theory. Scanlon's relational approach might add that blame affects relationships, and hypocrisy poisons that dynamic. Praise, however, can strengthen relationships even if the praiser isn't perfect. But the existing two theories seem sufficient if their differences in blame vs. praise are highlighted.

  In conclusion, both theories explain the asymmetry by focusing on the nature of blame as involving enforcement or demands, which praise lacks. The user can present both, noting how each handles the praise case, and perhaps use the demand theory for a unified account of standing issues. Emphasizing the distinction between the validity of the norm and the authority to enforce it should help students grasp the concept without conflating it with ad hominem.
answer: |-
  This is an excellent and notoriously tricky puzzle – you've nailed the core tension. Let's break down the hypocrisy/blame asymmetry and see how each theory handles it, starting from the gut-level intuition you requested.

  **Gut-Level Intuition on Why Hypocrisy Undercuts Blame (Surviving Ad Hominem):**

  Imagine your adulterous politician scolding *you* for infidelity. The gut reaction isn't "Hmm, maybe infidelity *isn't* wrong?" It's **"Who the hell are *you* to lecture *me* about this?"** The discomfort isn't primarily about the *content* of the criticism (which might be true), but about the *authority*, *audacity*, or *presumptuousness* of *this specific person* delivering it *in this context*.

  1.  **Unfairness:** It feels profoundly unfair. He's demanding adherence to a standard he flouts, placing a burden on you he refuses to shoulder. This creates a power imbalance – he's positioning himself as judge while exempting himself from the very law he's judging you by. You feel singled out for scrutiny he escapes.
  2.  **Self-Undermining Demand:** His act of blaming *itself* seems inconsistent. By blaming you, he's implicitly demanding "Don't cheat!". But his own cheating simultaneously screams "Cheating is fine for *me*!". The *act of demanding* compliance clashes violently with his *demonstrated rejection* of that compliance. It's performatively incoherent. His blame feels hollow, like counterfeit currency offered in payment.

  **Why This Isn't *Just* Ad Hominem:**

  Ad hominem *fallaciously* attacks the person to dismiss the *argument*. Here, the *truth* of "infidelity is wrong" isn't being denied. Instead, we're questioning the *propriety* or *effectiveness* of *this particular agent* delivering *this particular speech act* (blame/demand) *in this relational context*. We're rejecting *his standing as a blamer*, not necessarily the proposition he's uttering. The flaw is in the *transaction* of blaming, not the abstract moral truth.

  **Explaining the Praise/Blame Asymmetry:**

  This is where your coach example is perfect. Why can the undisciplined coach sincerely praise discipline?

  1.  **Fairness/Symmetry Theory (Wallace-esque):**
      *   **Blame:** Enforces a norm, demands compliance, implies a cost for violation. Hypocrisy creates unfairness because the blamer avoids the cost they impose.
      *   **Praise:** *Celebrates* adherence, *rewards* compliance (even if just verbally). There's no cost imposed *on the person being praised*. The undisciplined coach praising discipline isn't *demanding* the athlete be disciplined *while exempting himself*; he's simply *applauding* the athlete's achievement.
      *   **Why Asymmetry?** Fairness concerns arise primarily in contexts of *enforcement* and *cost-imposition*. Blame imposes a cost (reproach, sanction), praise confers a benefit (recognition, esteem). Hypocrisy in blame is unfair because it's "do as I say, not as I do" *while punishing you*. Hypocrisy in praise is "I admire in you what I lack myself" – this might make the praise *ironic* or *sad*, but it doesn't create the *unfair power dynamic* or *imposition of cost* that undermines standing in blame. The athlete isn't *harmed* or *burdened* by the hypocritical praise; they might even find it motivating or simply irrelevant to their own merit.

  2.  **Demand/Holding Accountable Theory (Todd-esque):**
      *   **Blame:** Functions as a demand for compliance with a norm *you yourself are bound by*. The hypocrite's act of blaming generates the Moorean paradox: "You must comply with Norm N (demand) / I need not comply with Norm N (my actions)." This performative contradiction undermines the authority/coherence of the demand.
      *   **Praise:** Does *not* function as a demand. It's an *acknowledgment* or *expression of approval* for meeting a standard. The undisciplined coach saying "Your discipline is fantastic!" contains no performative contradiction. There's no implied "You *must* be disciplined" in the same binding, authoritative way blame implies "You *must not* have cheated." It's simply "Your discipline is good." His own lack of discipline doesn't contradict *this specific speech act* in the same way his cheating contradicts his act of blaming *for cheating*.
      *   **Why Asymmetry?** The self-undermining contradiction is specific to *issuing demands* or *holding accountable* for norms *that bind the speaker*. Praise doesn't issue a binding demand on the recipient; it comments on their past action. The standard applied to the recipient doesn't inherently imply the *same* level of bindingness on the praiser *in the act of praising*. We can recognize and admire virtue in others without possessing it ourselves, without logical inconsistency in the act of admiration.

  **Which Theory Handles the Asymmetry Better?**

  *   **Fairness Theory:** Explains it clearly by focusing on *cost-imposition*. Blame imposes a cost unfairly when hypocritical; praise confers a benefit regardless of the praiser's merit. The asymmetry stems from the inherent nature of the speech act (punitive vs. rewarding).
  *   **Demand Theory:** Explains it clearly by focusing on the *performative contradiction inherent in demanding compliance while flouting it*. Praise lacks this demand structure, so no contradiction arises. The asymmetry stems from the presence/absence of a performative demand.

  **Do They Stipulate or Explain?**

  Both theories *explain* the asymmetry by grounding it in deeper features of the speech acts involved (cost-imposition/enforcement vs. benefit-conferral/celebration; demand-structure vs. acknowledgment-structure). They don't merely *stipulate* "hypocrisy only breaks blame."

  **A Third Angle? Relational/Sanction Authority (Scanlon-esque):**

  One could emphasize blame as a *sanction* that alters relationships (Scanlon). Hypocrisy poisons this because the blamer, by violating the norm, has already damaged the normative relationship *their sanction presumes to operate within*. They lack the moral authority to sanction *because* their own violation demonstrates disregard for the relationship the norm governs. Praise, conversely, *strengthens* relationships through appreciation. The undisciplined coach praising discipline isn't presuming an authority to sanction; they're offering positive recognition, which doesn't require the same relational standing. This also explains the asymmetry by linking standing to the *kind* of relational work the speech act performs (repairing/enforcing vs. affirming/encouraging).

  **Conclusion & Seminar Advice:**

  1.  **Clarify the Target:** Emphasize that hypocrisy undermines *standing to blame*, not the *truth of the moral claim*. This directly addresses the ad hominem worry.
  2.  **Core Intuition:** Focus on the visceral "Who are *you*?" reaction. It's about the *relational impropriety* or *performative incoherence* of *this person* delivering *this rebuke*.
  3.  **Explain the Theories:** Present both Fairness/Symmetry and Demand/Holding Accountable clearly. Use your politician and coach examples.
  4.  **Highlight the Asymmetry:** Explicitly contrast praise and blame using the coach. Ask students *why* it feels different.
  5.  **Show How Theories Explain Asymmetry:**
      *   **Fairness:** Blame imposes cost unfairly; praise confers benefit without unfairness.
      *   **Demand:** Blame creates performative contradiction ("Do as I say, not as I do"); praise lacks this demand structure.
      *   (Optional: Mention Relational/Sanction angle).
  6.  **Acknowledge Nuance:** Note that *extreme* hypocrisy might sometimes make praise seem insincere or ironic (e.g., a notorious liar praising honesty), but this is different from the *standing* problem inherent in hypocritical blame. The core standing issue is unique to enforcement/demand contexts.
  7.  **Todd's "Unified Account":** Point out that Todd's approach *aims* to unify standing problems (hypocrisy, complicity, meddling) under the umbrella of lacking the authority to hold accountable/demand. The praise/blame asymmetry *fits* this because only blame involves the relevant kind of demanding/holding accountable. Complicity/meddling also represent failures of authority to *demand* compliance from *this person*.

  By grounding the explanation in the distinct natures of blame (as enforcement, demand, sanction) vs. praise (as celebration, acknowledgment, reward), both major theories successfully explain the intuition behind the hypocrisy puzzle and its asymmetry with praise, moving beyond mere stipulation. Good luck with the seminar – it's a fascinating topic!
