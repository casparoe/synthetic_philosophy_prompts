answer: |-
  ## ATM Aftermath: A Parfitian Standoff

  *(The dusty town square. A battered ATM hums under the afternoon sun. ALEX, the hitchhiker, stares at the cash slot, then at the wad of bills in their hand. SAM, their friend, watches intently.)*

  **Alex:** Okay. Safe and sound. Driver’s long gone. Mission accomplished. *They start pocketing the cash.* So... why exactly am I burning fifty bucks right now?

  **Sam:** Because you *promised*. Because that’s the kind of person you *are*. The kind who pays their debts.

  **Alex:** *Snorts.* The kind of person I *am*? Sam, look at me. I *am* the person who just got a free ride out of the desert by *saying* I’d pay. The person I *am* right now is the one who knows handing over this cash does precisely *nothing*. The ride happened. Burning this money now is pure, unadulterated loss. Causal Decision Theory 101: Choose the action that causes the best outcome. Paying causes... me being fifty bucks poorer. Not paying causes... me being fifty bucks richer. Game over. What part of ‘rational’ says ‘choose the worse outcome’?

  **Sam:** It’s not about *this* action in isolation, Alex. It’s about the *kind of agent* you are over time. The rational *disposition*. You got picked up *because* the driver believed you were the type who would pay. *Being that type* was rational – it got you out of a life-threatening situation. That disposition *saved your life*.

  **Alex:** Fine! Disposition-Rationality: 10/10. Gold star. But we’re not in the desert anymore! The disposition did its job. The *act* of paying *now*? Act-Rationality: Negative infinity. Why should the ghost of a disposition compel me to do something actively stupid *now*? It’s like thanking the wizard *after* he’s vanished. Pointless!

  **Sam:** It’s not pointless! The disposition isn’t a one-shot costume you discard. It’s *you*. Or at least, the *rational you* strategically built. If you don’t pay now, what does that say about that disposition? That it’s brittle? Contingent? That it only exists *until* the immediate threat is gone? That’s not a stable, reliable disposition – that’s opportunism masquerading as one.

  **Alex:** So? Why should *I care* about maintaining some abstract ‘reliable disposition’ label *right now*? You’re just *defining* ‘rational disposition’ as ‘the one that makes you pay,’ and then saying acting against *that* is irrational. That’s begging the question! Prove to me why *act-rationality* should bow down to *disposition-rationality* in this concrete moment where they clash. The ‘reliable disposition’ already served its purpose – survival. Mission accomplished. Maintaining it *now* costs me fifty bucks for zero future causal benefit. Show me the *causal chain* where paying now helps *me, Alex-at-the-ATM*.

  **Sam:** The causal chain is *you*. Your future self in future interactions! If you cultivate the disposition – truly internalize it – that you *are* the kind of person who pays *even when it’s locally costly*, that disposition becomes credible. It shapes how others interact with you *in the future*. People *will* find out. Word gets around. The driver might tell others. *I* know. If you walk away now, you’re broadcasting that your commitments are cheap, conditional only on immediate leverage. Future-you might need a similar favor, rely on a similar promise. Why should anyone believe future-you if present-you welches the second the immediate pressure’s off? You’re burning future credibility for fifty bucks.

  **Alex:** Future credibility? That’s speculative! Maybe the driver tells no one. Maybe people don’t care. Maybe future situations aren’t analogous. You’re asking me to pay a *certain cost* now for a *highly uncertain, probabilistic future benefit*. CDT doesn’t gamble on maybes when the *certain* outcome of paying is loss. It takes the guaranteed win. And besides, why can’t I just *act* trustworthy *in the moment* when it’s causally beneficial, without binding myself to some costly dispositional straightjacket? Be strategically trustworthy, not dispositionally dogmatic!

  **Sam:** Because ‘strategic trustworthiness’ is often transparent! People aren’t idiots. They can sense when your cooperation is purely contingent on immediate payoff. The *power* of the disposition comes from its *counter-preferential* nature – paying *when it hurts*. That’s what makes it a credible signal, a reliable anchor for others to base *their* decisions on. If you only pay when it’s *also* locally beneficial, the dispositional signal is weak. It doesn’t distinguish you from a pure opportunist. The *rationality* of cultivating the disposition lies precisely in its ability to secure benefits *in situations where pure act-by-act rationality would fail* – like getting picked up in the desert when you *couldn't* pay upfront. Maintaining it *requires* sometimes acting against local, myopic rationality. That’s not ‘irrationality,’ it’s *instrumental* rationality playing the long game through self-binding.

  **Alex:** *Hesitates, fingers tightening on the cash. Stares hard at the ATM.* Self-binding... paying to maintain the fiction for future games. *Sighs.* So the ‘rational’ me back in the desert built a trap for the ‘rational’ me right here. And the only way out of the trap... is to be irrational *now* to preserve the rationality of the *whole mess*? That feels... perverse. Like paying protection money to my past self’s ghost.

  **Sam:** Maybe. Or maybe it’s recognizing that ‘rationality’ isn’t a single, context-free point. It’s layered. The rational *strategy* over time sometimes demands actions that look irrational under the microscope of a single moment. Parfit’s point is that calling the payment ‘irrational’ *in isolation* doesn’t invalidate the profound rationality of the *disposition* that demanded it. They operate on different levels. Ignoring the dispositional level because the act-level screams ‘loss’ is... well, *shortsighted*. Even if the loss is real. *Sam nods towards the ATM.* The question is, what kind of player do you want to be in the long game?

  *(Alex stares at the bills, then at the ATM slot. The hum of the machine seems louder. They don’t move.)*
