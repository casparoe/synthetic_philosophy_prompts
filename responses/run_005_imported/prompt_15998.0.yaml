answer: |-
  You're absolutely right to call out this distinction – it's not pedantry, it's fundamental to the ethical and economic debate around climate change. Your friend is confusing two distinct reasons for discounting, and conflating them *does* obscure important ethical judgments. Let's break it down with the equation you vaguely remember: **The Ramsey Rule.**

  The standard formula for the social discount rate (r) is:

  **r = ρ + η * g**

  Here's what each term represents and why they're conceptually distinct:

  1.  **ρ (rho) = Pure Rate of Time Preference (PTP):**
      *   **Concept:** This is the component that discounts the future *simply because it is in the future*. It reflects a inherent preference for well-being now over identical well-being later, *even if there's no expectation of future scarcity or abundance*.
      *   **Justification?** Often described as "impatience." Ethical arguments for a positive ρ often cite uncertainty about the future existence of society itself (existential risk) or myopia. However, many philosophers and economists (like Stern) argue that applying PTP *across generations* is ethically indefensible. Why should the mere fact of being born later make a person's well-being inherently less valuable? This is seen as discrimination based on birth date.
      *   **Example:** Imagine two identical people, one alive today, one alive in 100 years. If we set ρ > 0, we inherently value the well-being of the person today *more* than the identical well-being of the future person, *only* because they exist later.

  2.  **η (eta) * g = Diminishing Marginal Utility of Consumption (due to Growth):**
      *   **Concept:** `η` is the elasticity of the marginal utility of consumption. It measures how much the *additional well-being* gained from an extra unit of consumption decreases as consumption increases. `g` is the expected growth rate of per capita consumption. `η * g` captures the idea that if future generations are richer (`g > 0`), an extra dollar (or unit of consumption) will provide *less additional well-being* to them than it would to poorer present generations.
      *   **Justification:** This isn't about devaluing future people *per se*. It's about efficient allocation of resources across time based on expected relative scarcity/abundance. A dollar transferred from a poorer present person to a richer future person might result in a net *loss* of total well-being because the marginal utility lost by the present person is greater than the marginal utility gained by the future person. Discounting future costs/benefits by `η * g` accounts for this expected difference in marginal utility.
      *   **Example:** Giving $1000 to a very poor person today might prevent starvation (huge well-being gain). Giving $1000 to a very rich person in the future might mean an extra luxury item (small well-being gain). If we expect the future person to be richer (`g > 0`), the *well-being impact* of that future $1000 is smaller. We discount its *value* accordingly.

  **Why Economists & Philosophers Insist on Keeping Them Separate:**

  1.  **Ethical Clarity:** Conflating ρ and `η * g` obscures a crucial ethical choice. Setting ρ > 0 is an explicit ethical judgment that the well-being of future generations *inherently* matters less simply because they live in the future. `η * g` is a technical adjustment based on expected economic conditions and the principle of transferring resources to where they yield the most well-being *at the margin*. Keeping them separate forces transparency about the ethical stance (ρ) versus the efficiency argument (`η * g`).
  2.  **Different Policy Implications:** The source of discounting matters. A high discount rate driven mainly by a high ρ justifies *less* investment in long-term projects like climate mitigation, regardless of future wealth. A high discount rate driven mainly by high expected growth (`g`) might justify less investment *if* we are very confident future generations will be vastly richer and better able to handle the problem. But if growth is uncertain or climate damage itself threatens growth, the `η * g` argument weakens significantly.
  3.  **Addressing Catastrophic Risk:** High ρ heavily discounts far-future catastrophic risks. Arguments based solely on `η * g` might still justify strong mitigation if catastrophic damage would *reverse* growth (`g` becomes negative) or if η is high (meaning society is very averse to inequality in consumption levels).
  4.  **Analytical Rigor:** Separating the components allows economists to analyze the sensitivity of results to different ethical assumptions (ρ) versus different economic forecasts (g) and inequality aversion parameters (η).

  **The Stern vs. Nordhaus Fight: Conflation is the Core Issue**

  *   **Nordhaus (DICE model - Higher discount rate ~5-6%):**
      *   Used a *positive* ρ (around 1.5% per year). This embodies the ethical judgment that the well-being of people born in, say, 2200 inherently matters significantly less than people alive today *just because they are born later*.
      *   Combined this with η and g values that also contributed to a relatively high discount rate.
      *   **Result:** His models prescribe relatively modest, gradual near-term carbon taxes and mitigation efforts. The high discount rate, heavily influenced by ρ > 0, drastically reduces the present value of avoiding far-future climate damages.

  *   **Stern (Stern Review - Very Low discount rate ~1.4%):**
      *   Argued **ρ should be zero (or near-zero) on ethical grounds** for intergenerational decisions. Discounting the well-being of future generations simply because they live in the future is unjustifiable discrimination.
      *   His low discount rate came almost entirely from `η * g` (η ~1, g ~1.3%), reflecting an adjustment for expected future wealth, *not* inherent devaluation.
      *   **Result:** His model prescribed urgent, aggressive, and immediate mitigation efforts. The low discount rate, driven by the rejection of pure time preference across generations, gave far-future catastrophic damages significant weight in the present.

  **The Crux of the Fight:** Nordhaus's higher discount rate heavily relied on the ethically controversial ρ > 0. Stern rejected ρ > 0 as unethical. Nordhaus argued Stern's near-zero ρ was "extreme." But Stern countered that Nordhaus's ρ > 0 was the ethically extreme position when applied across generations. The different discount rates flowed *directly* from this core ethical disagreement about pure time preference, amplified by different assumptions about η and g. **Conflating ρ and η*g would have completely masked this fundamental ethical dispute, making it look like a purely technical disagreement about growth forecasts or inequality aversion.**

  **Why Your Friend is Wrong (and Why it Matters):**

  Your friend is describing **η * g** (discounting because future dollars provide less utility due to higher expected wealth). But he's calling it **ρ** (pure time preference). This conflation:

  1.  **Hides the Ethical Sting:** By labeling an efficiency argument (`η * g`) as "pure time preference" (ρ), he avoids confronting the much more ethically problematic nature of *actual* ρ > 0. It makes discounting future generations seem purely logical ("they'll be richer") rather than partly resting on a debatable ethical judgment ("they matter less because they aren't born yet").
  2.  **Muddies the Waters:** It prevents a clear discussion about the core ethical question: *Should we value future generations less simply because they live in the future?* Your friend's argument (`η * g`) doesn't require answering "yes" to that question, while using ρ > 0 explicitly *does* answer "yes."
  3.  **Understates the Case for Action:** If future growth is uncertain, or if climate damage itself could severely hamper growth (making `g` low or negative), the rationale for `η * g` weakens or even reverses. Relying solely on `η * g` could *justify higher present investment* if we fear future impoverishment. A positive ρ always pushes towards less investment. Conflating them locks in the discounting effect.

  **Tiebreaker Verdict:** You win. Your friend is describing the justification for the `η * g` component of the discount rate, but incorrectly labeling it as "pure time preference" (ρ). These are distinct concepts with distinct ethical foundations. Economists and philosophers keep them separate precisely to force transparency about the underlying ethical choices, which is crucial in high-stakes, long-term decisions like climate change. The Stern-Nordhaus debate is the prime example of how conflating them obscures the most fundamental ethical disagreement at the heart of climate policy.
