  Had this whole argument with my friend last night about climate discount rates and now I need a tiebreaker. He was saying its totally fine to discount future generations' wellbeing because they'll almost certainly be richer than us, so a marginal dollar (or unit of wellbeing, whatever) just matters less to them anyway. I said thats not actually 'pure time preference,' thats a totally different justification for discounting, and he's basically sneaking it in under the same label to make the whole move seem less shady than it is. He thinks im just being pedantic to win the argument. Can you explain the actual conceptual difference between pure time preference and discounting because of diminishing marginal utility / expected future growth (i vaguely remember an equation with a rho and an eta in it from an econ class)? Why do economists and philosophers insist on keeping these two apart instead of just lumping them into one discount rate? Bonus points if you can explain how conflating them is basically what's at the center of stuff like the Stern vs Nordhaus fight over climate discounting.
