answer: |-
  The ranking of objections to the practical viability of acausal trade is based on their potential to undermine the feasibility of real-world implementation. The analysis considers the core mechanisms of acausal trade—relying on mutual predictability, updateless decision theories, and functional modeling—and evaluates how each objection impedes these mechanisms in practice.

  - **Fatal objections** are fundamental show-stoppers that make acausal trade effectively impossible to initiate or execute, as they prevent the basic conditions for trade (e.g., identifying mutual benefits or achieving reliable modeling).
  - **Serious objections** are major hurdles that severely limit practicality but might be partially mitigated in ideal or constrained scenarios (e.g., through approximations or heuristics), though they remain highly damaging.
  - **Moderate objections** are significant but addressable challenges that could be managed with strategic design or in specific contexts, without wholly preventing trade.
  - **Negligible objections** have minimal impact on practical viability, as they concern theoretical or metaphysical concerns that do not directly obstruct implementation.

  Rationale for the ranking:
  - **(f) Preference opacity** is fatal because without knowledge of the counterpart's values, agents cannot identify mutually beneficial terms, making trade initiation impossible. This is a prerequisite failure.
  - **(c) Bounded simulation** is fatal due to computational limitations; realistic agents cannot achieve the high-fidelity modeling required for mutual predictability, collapsing the foundation of acausal reasoning.
  - **(a) Verification problem** is serious because the absence of causal interaction prevents confirmation of compliance, eroding trust and deterring engagement, even if trade is theoretically possible.
  - **(b) Partner-selection problem** is serious due to the vast, symmetric space of possible counterparts, which dilutes focus and makes targeted coordination impractical without arbitrary or unstable selection methods.
  - **(d) Commitment-race worry** is moderate as it describes a strategic inefficiency that can lead to suboptimal outcomes, but it does not block trade entirely and might be mitigated by decision-theoretic refinements.
  - **(e) Counterfactual-dependence objection** is negligible because it questions metaphysical coherence, not practical implementation; agents can operationally use counterfactual dependence in decision algorithms without resolving philosophical obscurity.

