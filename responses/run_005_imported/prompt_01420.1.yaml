  First, I need to recall how probabilities should work. Probabilities of mutually exclusive and exhaustive events should add up to 100%. That means all possible outcomes are covered without overlap. In football, the three outcomes are win, draw, loss. So, the percentages should sum to 100%. If they don't, it could indicate a problem.

  The brother-in-law's method is creating what are called "Dutch book" odds. This is a situation where inconsistent probabilities allow someone to place multiple bets that guarantee a profit no matter the outcome. The key here is that if the implied probabilities sum to more than 100%, there's an arbitrage opportunity. 

  For the example with 110% (55%, 25%, 30%), the overround is 10%. That means the bookmaker's margin is 10%. But in this case, since the brother-in-law is offering to bet at these odds, he's acting as the bookie. If the user bets proportionally on all outcomes based on the inverse of the probabilities, they might lock in a profit. 

  Let me do the math. Suppose the user bets $55 on United at 55% (which implies odds of 100/55 ≈ 1.818). If United wins, the payout would be $55 * (1.818) = $100. Similarly, $25 on the draw at 25% (odds 100/25 = 4.0), payout $100. $30 on Chelsea at 30% (odds 100/30 ≈ 3.333), payout $100. Total bet is $55+$25+30=$110. No matter who wins, the user gets $100 back. So they lose $10 overall. Wait, that's not profitable. That's a loss. 

  I think I messed up. If the implied probabilities sum to 110%, which is over 100%, the odds are actually worse for the bettor. To guarantee a profit, the user should bet amounts such that the payout is the same for all outcomes. But since the total probabilities are over 100%, the required bets would exceed the payout. 

  Wait, no. Let me recalculate. The brother-in-law is offering odds based on his percentages. So if he says 55% for United, he's implying that the odds are 100/55 ≈ 1.818, meaning for a $55 bet, he pays out $100 if United wins. But to find the stake for each outcome to get the same payout, the user should bet an amount proportional to the probability. 

  To guarantee profit, the user should bet on each outcome such that the payout is equal. For outcome i with probability p_i, the odds are 1/p_i. So to get $100 payout on United, bet $55. On draw, bet $25. On Chelsea, bet $30. Total stake $110. Payout $100 regardless. So net loss of $10. That's not profitable. 

