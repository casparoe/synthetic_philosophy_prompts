answer: |-
  You're absolutely right to feel that something's off—your brother-in-law's approach contains a **fundamental probabilistic error** that *does* allow you to construct a combination of bets guaranteeing you a profit, no matter the outcome, **if his percentages sum to less than 100%**. This is a classic case of **incoherent probabilities**, violating the basic rules of probability theory.

  Here's why it matters:

  ### 1. **The Core Mistake: Probabilities Must Sum to 100%**
     - In any set of **mutually exclusive and exhaustive outcomes** (like "Team A wins," "Draw," "Team B wins"), the probabilities *must* sum to 100%. This isn't pedantry—it's a mathematical necessity.
     - Your brother-in-law treats each probability as an isolated "gut feeling," ignoring that the outcomes are interconnected. If United has a 55% chance, Chelsea *cannot* simultaneously have a 30% chance in the same match unless the draw is negative (which is impossible).

  ### 2. **How to Exploit This (The Dutch Book)**
     - When his percentages sum to **< 100%**, you can "Dutch book" him: place bets on *all* outcomes in proportions that guarantee you profit.  
     - **Example**: Suppose he says:  
       - United: 40%  
       - Draw: 30%  
       - Chelsea: 20%  
       **Total: 90%**  
       - You interpret his percentages as odds and bet accordingly:
         - Bet **$40** on United at "40%" odds (pays $100 if United wins).  
         - Bet **$30** on Draw at "30%" odds (pays $100 if draw).  
         - Bet **$20** on Chelsea at "20%" odds (pays $100 if Chelsea wins).  
       - **Total stake: $90**.  
       - **No matter who wins, you receive $100**.  
       - **Your profit: $10** (guaranteed).  

     - If his percentages sum to **> 100%** (e.g., 110%), you *could* force a loss on him by letting him bet on all outcomes, but he'd be overcharging (like a bookie's margin). The real vulnerability is when sums are **< 100%**.

  ### 3. **Why His Defense Fails**
     - His claim that "each number is separate" ignores **dependence between outcomes**. If United's chance increases, Chelsea's or the draw's *must* decrease.  
     - This isn't about "imprecision"—it's about **internal inconsistency**. Even if his gut feelings are rough, they should still sum to ~100% for a coherent view.

  ### 4. **What This Means for Him**
     - **If he accepts bets based on these odds**:  
       - He loses money if his total < 100% and you exploit it (as above).  
       - Even if sums > 100%, he may misprice individual odds (e.g., if United is *actually* 60% likely but he says 55%, savvy bettors will exploit United alone).  
     - **If it's just conversation**: It's mathematically sloppy but harmless. Once money is involved, it's a critical error.

  ### Practical Advice
  1. **Challenge him**: Ask how he'd respond if you proposed the bet combination above (e.g., for a match where his sum is 90%). If he accepts, you profit risk-free.  
  2. **Explain the fix**: His percentages need normalization. For the United 55%/Draw 25%/Chelsea 30% example (total 110%), coherent probabilities would be:  
     - United: 55% / 110% = 50%  
     - Draw: 25% / 110% ≈ 22.7%  
     - Chelsea: 30% / 110% ≈ 27.3%  

  ### Bottom Line
  **Yes, this is a real mistake**—not harmless imprecision. It violates probability axioms and creates arbitrage opportunities. If he’s serious about betting, this error will cost him money. If it’s just dinner-table bravado, it’s a fun way to tease him about his "math tax." Either way, your intuition was spot-on.
