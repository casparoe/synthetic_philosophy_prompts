prompt: |-
  Random question that's been distracting me from grading. My brother-in-law loves announcing his own betting odds before football matches -- like "United 55%, draw 25%, Chelsea 30%" -- and he says he'd happily bet either side of any of those numbers, since that's just his honest gut feeling about each outcome. Bored at dinner last week, I started adding up his percentages match by match, and they're never exactly 100%: that United game came to 110%, another one he did was more like 90%. When I pointed it out he shrugged and said each number is seperate and doesn't need to relate to the others. Something about that feels off to me -- like maybe it means I could set up a combination of bets with him that comes out in my favor no matter who wins -- but I can't tell if that's actually true or if I'm just being pedantic. Is he making some kind of real mistake here, or is this just harmless imprecision in how people talk about confidence?
