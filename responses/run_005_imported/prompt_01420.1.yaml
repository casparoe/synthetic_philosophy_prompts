  Ah, so when the sum is less than 100%, there's an arbitrage opportunity. The user can profit by betting on all outcomes. In the original case with 110% sum, betting on all outcomes would result in a loss. So for the brother-in-law, if his probabilities sum to over 100%, he's safe because anyone betting all outcomes loses. But if they sum to under 100%, he's vulnerable to arbitrage. 

  The user mentioned a match with 90% total, which is under 100%. So in that case, the user could have placed bets on all three outcomes and guaranteed a profit. For example, if the brother-in-law said 40% United, 30% draw, 20% Chelsea (sum 90%). The user bets $40 on United, $30 on draw, $20 on Chelsea. Total stake $90. If United wins, payout $100 (since 40% implies odds 2.5, 100/40=2.5, so $40 * 2.5 = $100). Similarly, draw pays $100, Chelsea pays $100. So the user gets $100 back on a $90 bet, net $10 profit regardless of outcome. 

