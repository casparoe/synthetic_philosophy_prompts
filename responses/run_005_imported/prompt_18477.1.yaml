prompt: |-
  My younger sister is getting married in about six weeks and I got asked to give the toast, which is stressful enough on its own, but theres a wrinkle. She and her fiance Danny met in some intro philosophy of time class in college, and the story they always tell at parties is that they started arguing on literally the first day over that Aristotle thing about the sea battle -- like, if it's already true today that there will be a sea battle tomorrow, doesn't that mean the whole thing was fixed in advance and nobody involved actually could've done anything different. That argument basically became their whole relationship, so I really want one decent line in the toast that lands for the three or four old classmates of theirs who'll be in the room and will get it, without turning the speech into a lecture that loses my grandma and everyone else who just wants a nice toast.

  Here's where I've gotten myself stuck though. I started writing something like "these two were always going to end up together" and then, trying not to butcher the reference, I actually went and looked into the sea battle thing properly for the first time, and now I can't unsee the problem. Apparently there's a bunch of different camps on this: one says a claim about tomorrow just doesn't have a truth value yet, one (the "Peircean" one, I think) says a future claim only counts as true if it's guaranteed no matter what happens, there's this "thin red line" idea that there's secretly already one real future even though no one can know which one it is, and then something called supervaluationism that I am not even going to attempt to explain out loud at a wedding. Once I'd read all that, "these two were always going to end up together" suddenly sounded exactly like the fatalist line Danny would gently roast me for, but I also don't want the toast to go all hedgy and uncertain right at the one moment I'm supposed to sound sure of something.

  So could you actually write the toast for me? Aim for something like 3-4 minutes out loud, warm and funny, with one good joke or callback to the sea battle stuff that the philosophy people will clock but that still works as a normal joke for everyone else. And for the part where I wish them a happy life together, I want it to feel fully certain and not wishy-washy, but without secretly implying their whole future is already written somewhere and they don't get a say in it -- if there's a way to make the open-future stuff feel romantic instead of like a hedge that would be perfect, but I'll leave the actual approach up to you.
