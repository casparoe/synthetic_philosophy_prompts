prompt: |-
  I've got a guest on my philosophy podcast next week who defends the buck-passing account of value against the wrong-kind-of-reasons problem, and his whole move is the object-given/state-given reasons distinction. Problem is, whenever someone raises a counterexample he just says 'that's a state-given reason in a trenchcoat' and moves on, which drives me a little nuts. Can you draft 8-10 interview questions that make that dodge progressively harder to pull off: at least one that makes him actually work through the classic demon-threatens-you-into-valuing-worthless-stuff case step by step rather then just naming it, one pressing on whether theres a non circular way to say what makes a reason 'object-given' in the first place, one built around the promising-to-admire-something case (which never seems to fall cleanly on either side of the line), and one asking whether the same distinction is meant to rescue evidentialism from pragmatic reasons for belief. Add a quick note after each on the reply he'll probably give, and close with a question about what would actually count as evidence against the distinction itself.
reasoning: |-
  Okay, the user is preparing for a philosophy podcast interview with a guest who uses the object-given/state-given reasons distinction to defend the buck-passing account against the wrong-kind-of-reasons problem. The user is frustrated because the guest dismisses counterexamples by labeling them as "state-given reasons in a trenchcoat" without engaging deeply. The user wants interview questions that force the guest to address specific challenges without dodging.

  First, I need to recall the buck-passing account of value. It says that something is valuable if there are reasons to value it. The wrong-kind-of-reasons problem arises when there are reasons to value something that aren't related to its actual value, like a demon threatening you if you don't value a saucer of mud. The guest uses the distinction between object-given reasons (related to the object's properties) and state-given reasons (related to the state of valuing) to handle this.

  The user's main pain points are:
  1. The guest dismisses counterexamples too quickly.
  2. They want the guest to engage step-by-step with the demon case.
  3. They want to challenge the non-circular definition of "object-given."
  4. They want to explore the promising case, which is ambiguous.
  5. They want to connect this to evidentialism in belief.

  So, I need to craft questions that:
  - Force step-by-step analysis of the demon case.
  - Probe the definition of "object-given" without circularity.
  - Tackle the promising case's ambiguity.
  - Link to evidentialism and pragmatic reasons for belief.
  - End with what evidence could falsify the distinction.

  For the demon case, the question should make the guest walk through each part: the threat, the reason to value the object, and why it's state-given. The guest might still say it's state-given, but the key is to push them to explain why it's not object-given, forcing them to clarify the distinction.

  For the definition of "object-given," the question needs to ask how to define it without referencing value. If the guest says it's based on the object's properties, ask how we identify which properties count without circularity. Their likely response is appealing to fitting attitudes, but that might still be circular.

  The promising case is tricky. Promising to admire something creates a reason, but is it object-given or state-given? The guest might argue it's state-given because it's about the attitude itself, but the user wants to highlight the ambiguity here.

  Connecting to evidentialism: State-given reasons for belief are pragmatic, like believing for happiness. But evidentialists say only truth-related reasons count. If the guest uses a similar distinction, they need to explain the parallel and whether it holds. The guest might say reasons for belief are different, but that could be a dodge.

  Finally, asking what evidence could falsify the distinction. The guest might say if all reasons were state-given, but that's unlikely. Or if the distinction collapses. The user wants to know what would make the guest reconsider.

  The user's deeper needs: They want rigorous engagement, not dismissals. They might want to expose weaknesses in the guest's position or push them to refine their view. Also, making the podcast compelling by challenging the guest effectively.

  I should structure questions that progressively corner the guest, starting with examples, moving to definitions, then edge cases, and ending with falsifiability. Each question needs a note on probable replies and how the guest might dodge, so the user can anticipate and counter.

  Potential pitfalls: The guest might still try to label things quickly. The questions must force detailed explanations. For instance, in the promising case, ask why it's not object-given if the reason stems from a promise related to the object. Highlight the tension: the promise generates a reason, but the admiration is towards the object. The guest has to explain why that reason isn't about the object's properties.

  For evidentialism, if the guest applies the same distinction, they must address whether pragmatic reasons for belief are analogous to state-given reasons. If they deny the parallel, they need to justify why the distinction works for value but not belief.

  Overall, the questions should be structured to prevent easy outs and demand thorough analysis, making the discussion more substantive for the podcast.
answer: |-
  Here are 9 interview questions designed to progressively challenge the object-given/state-given (OG/SG) distinction as a solution to the Wrong Kind of Reasons (WKR) problem for buck-passing accounts of value. Each includes a note on the likely reply and how to anticipate/pre-empt the "trenchcoat" dodge:

  1.  **The Demon Deep Dive:**
      *   *Question:* "Let's take the classic demon case: I have no reason to value a saucer of mud *intrinsically*, but a demon threatens to torture me unless I value it. You'd say the demon's threat provides only a *state-given* reason to *value* the mud, not an *object-given* reason *for* the mud. Walk me through exactly *why* the reason generated by the threat—which is contingent on my *attitude*—doesn't somehow become a property *of the mud itself* in this scenario, making it object-given? After all, the mud now has the relational property 'causes demonic torture if not valued'."
      *   *Note:* He'll likely insist the reason's *source* (the demon's threat) targets the *state* of valuing, not properties constitutive of the mud's nature. Push: "But isn't 'causing torture if not valued' now a *real property* of the mud *in this context*? Why doesn't *that* property ground an OG reason?"

  2.  **Defining "Object-Given" Non-Circularly:**
      *   *Question:* "The distinction hinges on OG reasons being 'grounded in the object's properties.' But how do we identify *which* properties ground OG reasons without circularly appealing to the *value* they confer? For instance, why is 'being pleasurable' an OG-reason-grounding property for admiring an experience, but 'being such that admiring it prevents torture' isn't, *without* already assuming the former is value-conferring and the latter isn't?"
      *   *Note:* He might appeal to "fittingness" or "standard correctness conditions" for attitudes. Push: "Isn't 'fittingness' just value in disguise? How do we define the 'standard correctness conditions' for admiration non-circularly if not via prior value judgments?"

  3.  **The Promising Problem - The Ambiguity:**
      *   *Question:* "Consider the 'promising to admire' case: I promise my dying friend I will admire a particular ugly teapot. This seems to give me a genuine reason *to admire* the teapot. Is this reason object-given or state-given? On one hand, it's about the *attitude* (admiring) I promised to have (suggesting SG). On the other, the reason *arises from a relation* *to the specific object* (the teapot I promised about) and my duty to keep promises *regarding that object* (suggesting OG). Where does this fall on your distinction, and why?"
      *   *Note:* This is notoriously tricky. He *might* bite the SG bullet ("It's a reason to *have the state* of admiration because you promised to have it"). Push: "But doesn't my promise specifically *reference the object*? Doesn't the reason disappear if I admire a *different* teapot? Doesn't that tie the reason tightly *to this object*, making it look OG?"

  4.  **Promising Problem - Collapse or Category Error?**
      *   *Question:* "Building on the promise case: If you classify this reason as SG, does that mean *any* reason generated by a promise to value something (like promising to love someone) is always SG? Doesn't that seem deeply counterintuitive for promises about relationships? Conversely, if you call it OG, haven't you just let a clear WKR (the promise) sneak in as the 'right kind'? Does this suggest the OG/SG distinction might not be the right tool for promises?"
      *   *Note:* He'll likely double down on SG, arguing the *source* is the promise, targeting the attitude state. Push: "Doesn't this imply that reasons generated by commitments *to objects* are fundamentally different in kind from reasons generated by the object's intrinsic features? Is that plausible?"

  5.  **The Evidentialism Parallel:**
      *   *Question:* "You use the OG/SG distinction to block WKRs for *valuing*. Evidentialists use a similar 'right kind/wrong kind' distinction (epistemic vs. pragmatic reasons) to block pragmatic reasons for *believing*. Is your distinction fundamentally the same move? If so, do you think it's equally successful? If not, what's the crucial difference between pragmatic reasons for belief and state-given reasons for valuing?"
      *   *Note:* He might agree it's analogous, claiming both distinctions isolate the "proper" reasons constitutive of the relevant domain (truth for belief, value for attitudes). Push: "Critics argue both distinctions are *ad hoc*. If pragmatic reasons for belief can sometimes *feel* like genuine reasons (e.g., believing for happiness), just like demon threats can feel like reasons to value mud, doesn't the same skepticism apply? Why is your distinction more secure?"

  6.  **Pressing the Analogy to Evidentialism:**
      *   *Question:* "Suppose someone argues: 'Just as the buck-passer says state-given reasons (like the demon's threat) don't make the mud valuable, the evidentialist says pragmatic reasons (like the benefit of believing) don't make the belief *true*.' But critics of evidentialism (pragmatists) argue that pragmatic reasons *can* sometimes be genuine reasons for belief. If a pragmatist is right about belief, does that undermine your use of the OG/SG distinction for value? Does the success of your distinction depend on evidentialism being true?"
      *   *Note:* He'll likely deny dependence, arguing domains differ. Push: "If pragmatic reasons *can* be genuine reasons for belief in some cases, why couldn't state-given reasons be genuine reasons constituting value in some cases? Doesn't the analogy cut both ways?"

  7.  **The "Trenchcoat" Charge - Burden of Proof:**
      *   *Question:* "When you dismiss a counterexample as 'state-given reasons in a trenchcoat,' you're asserting it *doesn't* fit the OG category. What's the *positive test* listeners can use to verify your claim? What specific, observable feature distinguishes a *genuine* OG reason (like 'it's beautiful') masquerading as nothing, from an SG reason (like the demon threat) masquerading as OG? How do we *tell the trenchcoat apart* without relying on your intuition?"
      *   *Note:* He might revert to the source/target explanation. Push: "But in complex cases (like the promise), the 'source' and 'target' seem intertwined. Isn't your distinction ultimately relying on an *unexplained intuition* about what 'belongs' to the object vs. the state?"

  8.  **Is the Distinction Doing Real Work or Just Labeling?**
      *   *Question:* "Critics like Mark Schroeder argue the OG/SG distinction might just be *labeling* the problem (WKRs are SG, RKRs are OG) rather than *solving* it. How do you demonstrate the distinction *explains* why SG reasons don't count towards *value*, rather than merely stipulating that they don't? Isn't the core challenge explaining *why* only OG reasons count, and doesn't the distinction itself presuppose that answer?"
      *   *Note:* He'll argue the distinction *is* explanatory: OG reasons connect to the object's value-conferring properties. Push: "But doesn't 'value-conferring property' just mean 'property grounding an OG reason'? This seems circular. What *independent* grip do we have on these properties?"

  9.  **The Falsifiability Question (Closing):**
      *   *Question:* "Finally, let's imagine we're trying to test the robustness of the object-given/state-given distinction itself, not just its application in buck-passing. What specific scenario or argument would you accept as genuine evidence *against* the coherence or usefulness of the distinction? If no such evidence is conceivable, how is this different from it being a conceptual truth, and does that make it immune to counterexamples?"
      *   *Note:* This forces him to confront the distinction's status. Likely reply: He might say a scenario where reasons clearly constitutive of value *must* be classified as SG, or where the distinction becomes utterly indeterminate in clear cases. Push gently: "Can you sketch what such a scenario *might* look like, even if you think it's impossible? Or is its immunity to counterexamples part of its strength?"

  **Key Interview Strategy:**

  *   **Anchor in Examples:** Force engagement with the *specifics* of demon/promise cases. Don't let him name-drop; demand step-by-step application of the distinction *to the details*.
  *   **Challenge Foundations:** Focus on the non-circular definition of "object-given" and the independent test for the distinction. This is the core vulnerability.
  *   **Highlight Analogies:** The evidentialism parallel shows the distinction isn't unique to value and faces similar critiques elsewhere.
  *   **Shift Burden of Proof:** When he cries "trenchcoat," immediately ask *how we know* it's a trenchcoat. Demand his positive test.
  *   **Seek Falsification:** The closing question pushes him to admit what would make him doubt his core tool, moving beyond mere defense.

  Good luck with the interview! This should make for a much more dynamic and less frustrating discussion.
