answer: |-
  Your source is absolutely onto something important—this isn't a statistics flunk but a profound insight into decision-making under **deep uncertainty**. Her unease highlights a core limitation of averaging when facing **Knightian uncertainty** (where probabilities are indeterminate) and **expert disagreement rooted in fundamental ambiguity**.

  ### Why Averaging is Problematic Here
  1.  **Illusion of Consensus:** The average (e.g., ~30%) implies a precision and shared belief that doesn't exist. A tight cluster (25%-35%) signals relative agreement; a spread (5%-65%) signals fundamental disagreement about the nature of the problem or the evidence.
  2.  **Hides Tail Risks:** The pessimistic estimate (5%) represents a non-trivial chance of near-total failure, while the optimistic (65%) suggests a high chance of significant success. Averaging buries these critical tail risks. In existential risk contexts, the downside tail (failure) often demands disproportionate attention.
  3.  **Assumes Symmetric Error:** Averaging implicitly assumes errors are random and symmetric. Here, the disagreement isn't random noise; it's *structured* uncertainty stemming from defensible but incompatible interpretations of thin evidence. The errors are likely systematic and asymmetric.
  4.  **Discards Information:** The *magnitude of disagreement itself* is valuable information. It signals high ambiguity, fragility of the evidence, and potentially unresolvable model uncertainty. Averaging discards this crucial diagnostic signal.
  5.  **Misleading for Expected Value (EV):** EV = Probability x Impact x Cost. A wide probability range means the *EV itself has a massive range*. Reporting a single EV point estimate derived from an averaged probability hides this vast uncertainty about the proposal's *actual* expected value. The EV could realistically be 5x higher or 5x lower than the point estimate suggests.

  ### Principled Objections: Beyond "Ordinary Uncertainty"
  *   **Model Uncertainty:** Experts aren't just disagreeing on parameters within a shared model; they likely hold different *mental models* of how AI risk evolves, what interventions work, and how the proposed research fits. Averaging across incompatible models is statistically dubious.
  *   **Epistemic State:** The evidence isn't just noisy; it's genuinely *inconclusive* in a way that allows multiple defensible interpretations. This is a state of knowledge problem, not just an estimation problem.
  *   **High Stakes & Asymmetry:** Existential risk decisions often involve potential for irreversible, catastrophic outcomes. Here, the cost of underestimating the pessimistic view could be vastly higher than the cost of overestimating the optimistic view. Averaging treats all errors equally.

  ### Handling It Well: Practical Steps for the Committee
  The goal isn't necessarily consensus, but **transparently characterizing and incorporating the uncertainty** into the decision. Here's a framework:

  1.  **Report the Full Distribution & Key Metrics:**
      *   **Always Report the Range (Min/Max):** This is the minimum viable improvement. It immediately signals the level of disagreement/uncertainty.
      *   **Report Interquartile Range (IQR):** Shows where the middle 50% of estimates lie, reducing outlier influence while still showing spread.
      *   **Report the Mean/Median *Alongside* Spread Metrics:** Don't abandon the central tendency, but *always* contextualize it with the range/IQR. E.g., "Mean: 32%, Range: 5%-65%, IQR: 15%-50%".

  2.  **Quantify EV Uncertainty:**
      *   **Monte Carlo Simulation:** Instead of plugging a single average probability into the EV formula, run simulations. Sample each advisor's probability estimate (or a distribution around it) and the cost estimate thousands of times. This produces a *distribution of possible EVs*. Key outputs:
          *   Mean/Median EV.
          *   Range of plausible EVs (e.g., 5th to 95th percentile).
          *   Probability the EV exceeds the cost (or a threshold).
      *   **Visualize:** Show a histogram of the EV distribution. A wide, flat distribution screams uncertainty; a tall, narrow peak suggests relative confidence.

  3.  **Structured Deliberation (Optional but Valuable):**
      *   **Pre-Mortem:** Ask advisors: "Assume this project failed to reduce risk in 10 years. What are the most plausible reasons why?" This surfaces pessimistic model assumptions.
      *   **Scenario Planning:** Frame the estimates around specific, articulated scenarios (e.g., "Probability if technical approach X is viable," "Probability if governance landscape Y emerges"). This makes the models behind the numbers explicit.
      *   **Conditional Estimates:** Could advisors provide estimates conditional on key uncertainties being resolved favorably/unfavorably? This identifies critical assumptions.

  4.  **Decision Framework Adjustments:**
      *   **Explicit Uncertainty Premium:** Apply a higher hurdle rate (e.g., require a higher median EV) for proposals with extremely wide probability spreads. This builds in a margin of safety for ambiguity.
      *   **Pessimism Weighting (High Stakes):** In decisions involving catastrophic tail risks, explicitly give more weight to the lower quartile or pessimistic estimates in the final funding decision *if the potential downside is deemed unacceptable*. This is a *policy choice* acknowledging risk aversion, not a statistical necessity.
      *   **Focus on Robustness & Info-Gap:** Prioritize proposals that are *robust* across the range of plausible probabilities/models, or that specifically target reducing the *crucial uncertainties* causing the disagreement (info-gap decision theory).
      *   **Stage-Gated Funding:** Fund a smaller initial phase explicitly designed to reduce the key uncertainties identified by the disagreement, then re-evaluate probabilities for a larger phase.

  5.  **Communicate the "Why":**
      *   Ensure the committee's report explicitly states: *"Advisors expressed high uncertainty based on thin evidence, leading to a wide range of defensible probability estimates (5% to 65%). This implies significant uncertainty about the expected value of this proposal. The mean/median EV is X, but plausible values range from Y to Z."*
      *   Briefly summarize the *reasons* for the disagreement (e.g., "Disagreement centered on assumptions about the scalability of the proposed safety mechanism and the likelihood of near-term regulatory triggers").

  **For Your Source's Committee:** The immediate, practical steps are **#1 (Report Range/IQR)** and **#2 (Monte Carlo EV Distribution)**. This replaces the misleading average with a transparent picture of the uncertainty. If they want deeper analysis, adding **#3 (Structured Deliberation)** can clarify the roots of disagreement. **#4 (Decision Adjustments)** requires policy buy-in but is crucial for high-stakes contexts.

  **Conclusion:** Your source correctly identified that averaging discards critical information under conditions of deep uncertainty and expert model disagreement. This isn't ordinary noise; it's a signal about the state of knowledge itself. Handling it well means moving beyond single-point estimates to explicitly characterize, quantify, and communicate the full scope of the uncertainty, and potentially adjusting decisions to account for ambiguity, especially when catastrophic downsides loom. Her unease wasn't statistical failure; it was statistical *insight*. Foundations working on existential risks *must* develop methods to grapple with this kind of uncertainty explicitly.
