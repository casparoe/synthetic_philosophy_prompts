prompt: |-
  I'm taking a seminar on classical Islamic philosophy this term, and I've been given the chance to interview a guest speaker for our class podcast: a contemporary philosopher who specializes in reconstructing and defending al-Ghazālī's occasionalist account of causation. Draft eight to ten interview questions that go beyond having her simply restate the position. I want at least one question on the cotton-and-fire example and exactly what it's meant to establish about necessary connection between cause and effect; one on how appeals to God's 'custom' or habitual way of acting are supposed to explain nature's apparent regularity without quietly reintroducing the very causal powers the view denies; one on how the account avoids collapsing human moral responsibility once God is treated as the sole real agent behind every event, including human choices; and one on whether denying secondary causation leaves any rational basis for induction and experimental science. For each of these, add a follow-up question keyed to whatever reply she's most likely to reach for -- an appeal to 'acquisition' to rescue responsibility, say, or a comparison to Malebranche or Hume meant to make the view sound less radical than it is.
