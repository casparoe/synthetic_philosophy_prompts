  Okay, the user is asking me to adjudicate a debate they had with their friend about G.E.M. Anscombe's pamphlet "Mr. Truman's Degree." They want me to compare her argument to the doctrine of double effect (DDE), specifically analyzing where her verdict follows directly from DDE and where she adds extra elements. Then I need to determine whether it's primarily a clean application of DDE or driven by her broader philosophical commitments.

  First, I need to recall Anscombe's main arguments in the pamphlet. She argues that Truman's decision to bomb Hiroshima and Nagasaki was murder because it intentionally targeted civilians to terrorize Japan into surrender. Her friend claims this is a straightforward application of DDE, particularly failing the "not-a-means" condition. The user pushed back, pointing out that Anscombe makes confident claims about intent, refuses to consider proportionality once intent is settled, and diagnoses a broader corruption in moral thinking.

  The doctrine of double effect has four conditions: 1) The act itself must not be intrinsically wrong. 2) The bad effect must not be intended, only foreseen. 3) The bad effect cannot be the means to the good effect. 4) There must be proportionality between good and bad effects.

  For the first point, Anscombe argues that intentionally killing innocents is intrinsically wrong. Her friend is correct that she applies DDE's "not-a-means" condition here—the civilian deaths weren't just a side effect but the very mechanism of terror to force surrender. That part seems standard.

  But the user's pushback is crucial. Anscombe insists we can know the planners intended the civilian deaths, not just foresaw them. DDE typically requires careful interpretation to distinguish intent from foresight, but Anscombe seems certain based on statements like targeting cities to break morale. She bypasses the usual interpretive work, implying that such strategic bombing inherently involves intention.

  Then there's proportionality. Anscombe explicitly says that if an act is murder (intrinsically wrong), proportionality doesn't matter. DDE usually requires proportionality even if the other conditions are met. By dismissing proportionality entirely, she adds a premise: intrinsic wrongness trumps consequences.

  Finally, her broader critique aligns with her later coining of "consequentialism." She's not just applying DDE but attacking the moral framework that justifies atrocities for good ends. This is evident when she condemns the willingness to calculate civilian deaths as morally corrupt.

  So, while DDE provides the structure, Anscombe tightens its application—especially on intention—and adds her own philosophical stance. The pamphlet isn't just a DDE application; it's a manifesto against consequentialist thinking, using DDE as a starting point. Her certainty about intent and dismissal of proportionality go beyond standard DDE, reflecting her deeper commitments to absolute moral prohibitions.

  Therefore, the user's view that Anscombe adds extra premises seems correct. The pamphlet uses DDE's vocabulary but is driven by her broader anti-consequentialist philosophy. The structure shows this: she prioritizes intention, dismisses proportionality after establishing intent, and frames the issue as symptomatic of moral corruption.
answer: |-
  Based on a close reading of "Mr. Truman's Degree" and the standard formulation of the Doctrine of Double Effect (DDE), your analysis is more accurate: Anscombe uses the *vocabulary* and *structure* of DDE but significantly tightens its application, adds crucial premises regarding intention and the irrelevance of proportionality, and ultimately grounds her argument in deeper anti-consequentialist commitments that go beyond DDE itself. Here's a breakdown:

  1.  **Where the Verdict *Seems* to Follow Directly from DDE: The "Means" Condition**
      *   **DDE Condition:** "The bad effect must not be the means by which the good effect is produced."
      *   **Anscombe's Argument:** She argues relentlessly that the terrorizing of the civilian population *was* the chosen means to compel surrender. The destruction of the cities and the killing of non-combatants weren't incidental collateral damage from targeting military installations; they *were* the instrument to break the enemy's will. Statements from planners about targeting cities to induce terror and surrender are cited as evidence.
      *   **Analysis:** This is the core of her friend's point, and it's strong. On a standard reading of DDE, using the intentional killing of innocents *as a tool* to achieve a good end (like ending a war) clearly violates the "means" condition. If the bombing *only* makes sense strategically *because* it kills civilians to induce terror/surrender, then the civilian deaths are instrumental and intended as means. Anscombe's application here is a powerful and arguably correct use of this DDE criterion against the bombings. **Verdict: Direct application of DDE's means condition.**

  2.  **Where Anscombe Tightens DDE & Adds Premises: Intention & Epistemic Certainty**
      *   **DDE Condition:** "The bad effect must be foreseen rather than intended." DDE requires careful *interpretation* to distinguish intention from foresight. Did the planners *aim at* civilian deaths, or merely *accept* them as a consequence of aiming at something else (like destroying war industry concentrated in cities)?
      *   **Anscombe's Argument:** She asserts with absolute confidence that the planners *intended* the deaths of the civilians. She rejects *any* ambiguity. Her reasoning is twofold:
          *   **a) The Nature of the Target:** Targeting whole cities, knowing they are densely populated with non-combatants, *constitutes* an intention to kill them. She argues this is inherent in the act of strategic area bombing.
          *   **b) The Stated Objective:** She heavily relies on documented statements (like the U.S. Strategic Bombing Survey) explicitly stating the objective was to destroy morale through terror, achieved by mass civilian casualties. This, for her, settles the question of intent beyond doubt.
      *   **Analysis:** Here, Anscombe significantly tightens DDE's usual application.
          *   **Tightening Intention:** She adopts a very broad, "objective" view of intention. If an act *logically requires* or *is defined by* a certain outcome (killing civilians to terrorize), then that outcome is intended, regardless of subjective mental gymnastics. This is stricter than some interpretations of DDE, which might allow for a more subjective "direct object of the will" analysis that could potentially exonerate planners who focus mentally only on "ending the war."
          *   **Epistemic Certainty:** DDE usually requires a nuanced judgment call about the agent's state of mind. Anscombe bypasses this interpretive work, substituting near-moral certainty. She treats the planners' own stated objectives as *conclusive proof* of intent, dismissing any suggestion that foresight and intention could be separated in this context. **Verdict: Significant tightening of DDE's intention condition and substitution of moral certainty for interpretive nuance.**

  3.  **Where Anscombe Adds a Crucial Extra Premise: The Irrelevance of Proportionality**
      *   **DDE Condition:** "The whole must be proportionate" (i.e., the good effect must sufficiently outweigh the bad effect, even if unintended).
      *   **Anscombe's Argument:** She explicitly states that if an act is intrinsically wrong (like intentional killing of the innocent, which is murder), **proportionality doesn't even come into play.** Once the act is classified as murder based on intention, it is absolutely forbidden, regardless of the potential good consequences. Calculating the "proportion" of murdered innocents against some supposed greater good is, for her, morally abhorrent *in principle* when dealing with an intrinsically evil act.
      *   **Analysis:** This is a fundamental *addition* to the standard DDE framework. Standard DDE presents proportionality as a *necessary condition*, even if the other conditions (intrinsic permissibility, intention, means) are satisfied. Anscombe *removes* proportionality as a relevant consideration *entirely* once the act is judged intrinsically evil by intention. This flows directly from her absolutist natural law stance: certain acts (like intentionally killing innocents) are always and everywhere wrong, *period*. Consequentialist calculation is inadmissible for such acts. **Verdict: Major extra premise added, fundamentally altering DDE's structure by rendering proportionality irrelevant for intrinsically evil acts.**

  4.  **The Broader Diagnosis: Beyond DDE to Anti-Consequentialism**
      *   **Anscombe's Argument:** The pamphlet isn't just about Truman or the bomb; it's a scathing indictment of the *moral mindset* that justifies such actions. She attacks the willingness to weigh innocent lives against political or military objectives as a profound corruption – a "corruption of the mind" that has "eaten out the heart of old England." This foreshadows her later coining of "consequentialism" as a term of abuse. She argues that honoring Truman endorses this corrupt mode of thinking.
      *   **Analysis:** While DDE is a *tool* used *within* non-consequentialist ethics (like natural law), it is a specific technical doctrine for analyzing *single actions* with mixed effects. Anscombe's broader critique targets the entire *system* of moral reasoning that prioritizes outcomes over absolute prohibitions. DDE provides the *language* for analyzing the bombing (intention, means), but the *force* of her condemnation stems from this deeper commitment to the absolute wrongness of intentionally killing the innocent and the inherent evil of consequentialist justification *as a method*. **Verdict: The driving force is Anscombe's own deep anti-consequentialism and natural law absolutism, which uses DDE as an analytical tool but transcends it.**

  **Conclusion: Beyond a Clean Application**

  "Mr. Truman's Degree" is **not best read as a clean application of double effect to a hard case.** While it powerfully utilizes the DDE's "means" condition and relies heavily on the concept of intention central to DDE, Anscombe significantly modifies the doctrine's application:

  1.  **Tightening Intention:** She adopts a stricter, more objective standard for establishing intention, substituting moral certainty for DDE's typical interpretive requirement.
  2.  **Adding a Premise:** She introduces the critical extra premise that proportionality is irrelevant for acts judged intrinsically evil by intention, effectively removing a key condition of standard DDE.
  3.  **Driving Force:** The essay's ultimate power and polemic stem from her deeper philosophical commitments – her absolute prohibition on intentional killing of innocents and her fundamental rejection of *any* form of consequentialist justification for such acts. DDE provides a structured vocabulary for condemning the bombing *as murder*, but the *conviction* that murder is absolutely impermissible and that consequentialism is a corruption comes from Anscombe's own robust natural law ethics.

  Therefore, the pamphlet **borrows the vocabulary and structure of DDE while being fundamentally driven by Anscombe's own commitments that go beyond it.** The structure reveals this: the confident assertion of intent bypasses DDE's nuance; the explicit dismissal of proportionality alters DDE's framework; and the broader condemnation of the moral reasoning *behind* the act points to the deeper anti-consequentialist foundation that motivates the entire argument. While the "means" condition provides a strong technical argument, the essay's distinctive force lies in its absolutism and its condemnation of the consequentialist mindset, which are Anscombe's own contributions, using DDE as a vehicle rather than being strictly confined by it.
