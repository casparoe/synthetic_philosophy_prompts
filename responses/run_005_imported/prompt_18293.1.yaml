answer: |-
  ## The Muddy Waters of Value: A Dialogue on Fitting Attitudes

  **Characters:**
  *   **Alexis:** Defends the Fitting-Attitude (Buck-Passing) Analysis of Value.
  *   **Ben:** The Critic, pressing the "Wrong Kind of Reasons" problem.

  **(The scene is a university common room. Alexis sips tea while Ben leans forward, animated.)**

  **Ben:** Alexis, I appreciate the elegance of your buck-passing account – goodness reduces to reasons to favour. But there’s this persistent thorn: the "Wrong Kind of Reasons" problem. Let me paint a picture. Imagine an eccentric billionaire offers me a life-changing sum, say ten million dollars, *if* I can sincerely come to admire... this utterly unremarkable patch of mud right here. *(Ben gestures vaguely towards a nondescript spot on the floor.)* Now, the prospect of gaining ten million dollars gives me a powerful, genuine, *prudential* reason to *want* to admire the mud. I might even hire hypnotists, take courses in mud-appreciation, desperately try to cultivate that feeling.

  **Alexis:** Ah, the classic demon/billionaire case. Yes, I know it well. You have a reason to *bring about* the state of admiring the mud, Ben. But that doesn’t mean you have a reason *of the right kind* to admire the mud *itself*, grounded in *its* features.

  **Ben:** Precisely! According to your analysis: something is admirable if it has features that provide reasons *to admire it*. Here, the mud *does* seem to have a feature – namely, its connection to the billionaire’s reward – that provides me with a powerful reason to admire it. Yet, intuitively, the mud remains utterly *un*admirable! Its intrinsic qualities – being brown, wet, inert – provide no reason at all to admire it. The analysis seems to yield the wrong result: it falsely declares this mud admirable because of a reason generated by an external incentive.

  **Alexis:** But Ben, you’ve hit upon the crucial distinction! The analysis requires that the reasons to favour the object be grounded *in the object’s own properties*. The reason provided by the billionaire stems not from the mud's inherent nature, but from the *consequences* of *my having the attitude* towards it. It’s a reason *for desiring to have* the attitude of admiration, or *for bringing about* that attitude, not a reason *provided by the object* that makes admiration *fitting* or *appropriate* as a response to *it*. The mud’s own features provide no such reason.

  **Ben:** Okay, I see the move: distinguishing *object-grounded* reasons from *state-grounded* or *attitude-dependent* reasons. But here’s my deeper worry, Alexis. *How* do you draw that distinction *without already presupposing* what counts as a "value-relevant" feature of the object? You say the reason must be grounded in the object's "own properties" for it to count towards its value. But which properties *are* the relevant ones? Isn't that precisely what the buck-passing account is supposed to *explain*? It feels circular. To identify *which* reasons are the "right kind" (object-grounded), don’t we need a prior, independent notion of what makes the object good or admirable? Otherwise, what stops me from saying the mud's property "being the target of a billionaire's reward scheme" *is* one of its value-relevant features?

  **Alexis:** Hmm. That’s a fair challenge. The distinction *must* be drawn in terms of the *content* or *basis* of the reason, not smuggled-in value judgments. Perhaps it's about the *direction of fit*. An object-grounded reason for admiration presents the object *as having features that merit* admiration – it's reason to *track* the object's actual properties. The billionaire’s reason presents admiration *as having beneficial consequences* – it’s reason to *impose* an attitude regardless of the object. It’s about what the reason is *for*: is it for responding to the object *as it is*, or for manipulating our mental states?

  **Ben:** Let me press you further, because this problem isn't unique to value attitudes. Consider belief. Pascal’s Wager: I have a powerful prudential reason to believe in God – the prospect of infinite reward and avoiding infinite punishment. According to a similar buck-passing-style analysis for truth (something is true if it has features that provide reasons to believe it), doesn't Pascal’s reason threaten to make God’s existence *true*? Yet, intuitively, the Wager provides a reason to *make myself* believe, not a reason grounded in evidence *for* God’s existence. Your defender of truth would make the same move: distinguish *evidential* reasons (object-grounded, based on truth-relevant features) from *pragmatic* reasons (state-grounded, based on the benefits of believing).

  **Alexis:** Exactly so. The structure is parallel. Pragmatic reasons for belief are the "wrong kind" for determining truth, just as state-grounded reasons for favouring are the "wrong kind" for determining value. The distinction *needs* to hold for both domains independently. In the belief case, we *do* have an independent grip on what counts as evidence – observation, logic, testimony – that isn't purely defined in terms of truth *already*.

  **Ben:** But is that grip *really* independent? Doesn't our concept of evidence *itself* involve a constitutive link to truth? Evidence is *that which indicates truth*. Isn't the buck-passer for truth similarly threatened by circularity? How do we define "evidential reason" without invoking truth? And if we *can* define it independently (e.g., as reasons arising from sensory inputs, logical coherence, reliable testimony), then perhaps you *can* define "object-grounded reasons for attitudes" independently too – as reasons arising from features perceived as inherently favour-worthy *as such*, like beauty, kindness, or functionality, without *first* calling them "value-relevant."

  **Alexis:** That's the hope, Ben. But you're right to highlight the parallel challenge. The buck-passer needs a non-circular, non-question-begging way to characterize the *kind* of reason that counts – one that doesn't covertly rely on the very value (or truth) it's trying to analyze.

  **Ben:** So, let me summarize where we land. For your buck-passing analysis to truly work and avoid the Wrong Kind of Reasons problem, Alexis, you need to successfully draw a distinction between:
  1.  **Object-Grounded Reasons:** Reasons to favour X that are *based solely on X's intrinsic or non-instrumental properties* and present favouring X as a fitting response *to those properties themselves*.
  2.  **State-Grounded/Attitude-Dependent Reasons:** Reasons to favour X that are *based on the beneficial consequences* (or avoidance of harmful consequences) *of having the attitude* towards X, regardless of X's own properties.

  **Alexis:** Precisely. And crucially, this distinction must be:
  *   **Non-Circular:** It cannot rely on a prior, unanalyzed notion of value or admirability to *define* which reasons are object-grounded.
  *   **Genuinely Explanatory:** The concept of an "object-grounded reason" must be independently intelligible and capable of *grounding* our judgments about what is valuable, not merely reflecting them.
  *   **Parallel-Holding:** It must work analogously for other domains like belief, where a similar distinction (evidential vs. pragmatic reasons) is needed and arguably available.

  **Ben:** And whether that distinction *can* be drawn in such a robust, non-question-begging way... that, Alexis, remains the million-dollar question. Or should I say, the ten-million-dollar-mud-patch question? *(Ben smiles wryly.)*

  **Alexis:** *(Chuckles)* Indeed, Ben. The mud patch stands, the billionaire waits, and the distinction bears the weight. The analysis hinges entirely on whether that distinction can carry it. We’ve clarified the task, even if we haven't settled it today.

  **Ben:** Agreed. The battleground is clearly marked: the nature and independence of "the right kind of reasons." Let's see if the buck-passer can fortify that position. More tea?

  **Alexis:** Please. The discussion, at least, is genuinely valuable. *(They both smile, the unresolved tension hanging in the air alongside the steam from the teapot.)*
