  So in my personal identity seminar we just wrapped up a unit comparing Parfit-style reductionism to the Abhidharma no-self analysis (the five aggregates thing, no atman behind them or whatever), and now I gotta write a short response paper ranking a bunch of Western personal identity theories by how compatible they actually are with anatta. Can you rank these five: Parfit's psychological continuity theory, Hume's bundle theory, animalism (Olson), narrative identity theory (Ricoeur/Schechtman), and Nozick's closest continuer theory - from most to least compatible with the Abhidharma claim that theres no self over and above the aggregates? For each one say real quick whether its basically doing the same move as the Abhidharma or if its secretly smuggling a self back in somewhere. Format it as JSON like:

