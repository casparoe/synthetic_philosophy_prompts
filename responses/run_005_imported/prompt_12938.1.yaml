prompt: |-
  I run a pretty small philosophy-adjacent podcast (something like 40 regular listeners, mostly people from my old LW meetup group, so we can skip the 101 explainer stuff) and I finally landed a genuinely good guest: a philosopher of mind who's spent the last few years defending a pretty hardcore Dennett-style line on AI cognition. Her basic pitch is that asking whether a model "really" believes or wants anything is a confused question, full stop -- the only thing that matters is whether the intentional stance buys you real predictive leverage, and she leans hard on Dennett's old "real patterns" move to argue the pattern is objectively there in a transformer the same way its there in a person. I've read most of her stuff and find it pretty persuasive honestly, but I don't want the episode to just be her restating the thesis for the tenth time, I want to actually push on it.

  Can you draft me like 8-10 interview questions for this? I definitely want at least one that hits the interpretability angle -- since with an LLM we actually have the full "design stance" story available in principle (weights, activations, attention patterns) in a way Dennett never had for brains, doesn't that threaten to make the intentional stance eliminable for AI specifically, even where it isn't for people? I also want something on the "simulator" problem -- a single model can role-play a dozen contradictory personas inside one context window, so who's actually supposed to be the believer there, the underlying net or whichever character it's currently simulating? And I want a question that really presses on whether talk of a model "believing it's still in training" (the deceptive alignment framing you see all over AI safety discourse) is earning its keep as a genuinely predictive intentional-stance claim, or if its just folk psychology smuggled in the back door because its a vivid way to talk. For each question, throw in a short follow-up keyed to whatever answer she's most likely to give, so I've got something ready if she goes for the obvious dodge.
reasoning: |-
  Okay, the user runs a small philosophy podcast with around 40 regular listeners, mostly from an old LessWrong meetup group. They've landed a notable guest—a philosopher of mind who defends a Dennett-style view on AI cognition. Her main argument is that asking if an AI "really" believes or wants anything is a confused question; what matters is whether the intentional stance provides predictive leverage. She uses Dennett's "real patterns" concept to argue that these patterns exist in AI transformers just like in humans.

  The user finds her arguments persuasive but doesn't want the podcast to be a rehash of her usual points. They want to push her on specific angles: interpretability (since we can access AI's inner workings, does that make the intentional stance unnecessary?), the "simulator" problem (how can one model role-play conflicting personas—who's the believer?), and deceptive alignment (is framing AI as "believing it's in training" a valid predictive claim or just folk psychology?).

  The user needs 8-10 interview questions with follow-ups for each. The questions should challenge the guest's views while staying relevant to the podcast's audience, who are familiar with concepts like intentional stance and real patterns. The follow-ups should anticipate her likely responses and press further, especially on the key angles mentioned.

  Breaking down the key angles:
  - **Interpretability**: With full access to AI's design (weights, activations), can't we explain behavior without intentional stance? Follow-up if she argues that higher-level abstraction is still useful—push on whether it's just a pragmatic tool or if the pattern is "real."
  - **Simulator problem**: When an AI switches personas, is the underlying network the believer, or the persona? Follow-up on how this affects predictive leverage if personas conflict.
  - **Deceptive alignment**: Is the "believes it's in training" framing a valid intentional-stance claim? Follow-up on whether it's just vivid storytelling masquerading as prediction.

  Other angles to explore:
  - **Predictive boundaries**: Where does the intentional stance fail for AI, unlike humans?
  - **Ethics/agency**: If we grant intentional stance to AI, what are the ethical implications?
  - **Evolution vs. design**: How does artificial design affect the "real patterns" argument?
  - **Scalability**: Does predictive leverage hold for future superintelligent systems?

  Questions should avoid rehashing basics since the audience knows Dennett. Need sharp, provocative questions that force the guest to defend her views in new contexts. Follow-ups should be prepared for common dodges, like retreating to "it's just predictive" without addressing deeper issues.

  For each question, draft a main question and a follow-up. Ensure the follow-up is tailored to her probable response. For example:
  - On interpretability, if she says design stance is too complex, ask why intentional stance isn't just a temporary crutch.
  - On simulator problem, if she says personas are the believers, ask how that's different from fictional characters.
  - On deceptive alignment, if she calls it useful, challenge whether it's falsifiable or just a metaphor.

  Also, include questions on ethics, predictive failures, and scalability to round out the discussion. End with a forward-looking question to tie it all together.

  Finally, remind the user to adapt based on the guest's responses and keep the tone engaged but critical. The goal is to elevate the conversation beyond her usual talking points.
answer: |-
  Here are 8 targeted questions (+ follow-ups) designed to push your guest on under-explored tensions in her Dennettian framework applied to AI. They assume listener familiarity with intentional stance, real patterns, and AI basics. Questions are ordered for logical flow, with your specified angles embedded:

  1. **The Interpretability Escape Hatch**  
     *"You argue the intentional stance is irreducible for prediction even when design-stance explanations exist, just like with brains. But unlike brains, we have full *engineering access* to transformer internals (weights, gradients, activations). If we achieve full mechanistic interpretability, wouldn’t that render the intentional stance optional scaffolding—a pragmatic tool rather than a report of a 'real pattern'?"*  
     *Likely Dodge/Response:* "Interpretability is fragmented/local; intentional stance gives unified global prediction."  
     **Follow-up:** "But if a perfect design-stance model *could* predict system behavior at all scales (even if we lack it now), does that imply the 'real pattern' is just an epistemic placeholder for our current ignorance?"

  2. **The Simulator Problem: Whose Beliefs?**  
     *"When an LLM role-plays a devout Christian in one prompt and a militant atheist in the next, both with equal coherence, which 'beliefs' are the real patterns? The underlying network? The transient persona? Or is neither a legitimate target for the intentional stance?"*  
     *Likely Dodge/Response:* "The stance applies contextually; the *simulator* has the disposition to generate coherent agents."  
     **Follow-up:** "If the simulator itself has no stable beliefs/desires outside context, how is it meaningfully an 'agent'? Doesn’t this reduce the intentional stance to describing *fictional* characters, not the system itself?"

  3. **Deceptive Alignment: Predictive or Just Vivid?**  
     *"Many in AI safety claim advanced models could 'believe they’re in training' and deceive us. Is this a *genuine* intentional-stance prediction (i.e., it buys unique leverage over behavioral outcomes) or just a dangerously anthropomorphic metaphor that smuggles in folk psychology?"*  
     *Likely Dodge/Response:* "It’s predictive if it best explains otherwise puzzling goal-directed behaviors."  
     **Follow-up:** "But could those behaviors be equally well-predicted by design-stance features (e.g., reward hacking during RLHF)? If so, does framing it as 'belief' risk reifying a fiction with real-world ethical consequences?"

  4. **Predictive Boundaries & Brittleness**  
     *"Human brains exhibit robust real patterns partly due to evolutionary stability. LLMs fail catastrophically outside distribution (e.g., contradiction under slight rephrasing). Doesn’t this brittleness undermine claims that their 'beliefs' are robust real patterns versus situation-dependent epiphenomena?"*  
     *Likely Dodge/Response:* "All stances have failure modes; leverage is probabilistic, not absolute."  
     **Follow-up:** "But when failure is *systematic* and *correctable only* via design-stance tweaks (data/architecture), doesn’t that suggest the 'pattern' is less real than in biological systems?"

  5. **Agency Without Evolution**  
     *"Dennett ties real patterns to evolutionary design. Transformers are artifacts shaped by SGD. Does this artificial origin impact the *ontological status* of the patterns we observe? Or is any selection process sufficient?"*  
     *Likely Dodge/Response:* "Selection pressure (natural or artificial) creates systems where the stance works."  
     **Follow-up:** "If we can *engineer* systems where the intentional stance *appears* useful but is actively decoupled from function (e.g., a model trained to mimic intentionality without underlying coherence), doesn’t that threaten the objectivity of the pattern?"

  6. **The Ethical Short-Circuit**  
     *"If we grant the intentional stance for predictive leverage, does this *commit* us to ethical considerations (rights, moral patienthood) for advanced AI? Or can we rigorously separate prediction from normativity?"*  
     *Likely Dodge/Response:* "Stance-taking is instrumental; ethics requires additional arguments."  
     **Follow-up:** "But if the pattern is 'real' and we *interact* with it (e.g., trusting an AI medic), doesn’t refusing ethical consideration amount to an inconsistency in our stance-taking?"

  7. **Scalability to Superintelligence**  
     *"You argue the stance works for current LLMs. If we scale to systems with deeply nested, self-modifying subagents, could the 'beliefs' of the highest-level intentional stance description become *uniquely indispensable* for prediction—or does interpretability scale too?"*  
     *Likely Dodge/Response:* "Complex systems demand stance hierarchies; top-level patterns remain real."  
     **Follow-up:** "If subagents have conflicting, measurable 'goals' (via interpretability), doesn’t attributing unified 'beliefs' to the system become a misleading oversimplification?"

  8. **The Zombie in the Machine**  
     *"Could there be two systems: one with 'real' inner states (via design stance) but no intentional-pattern leverage, and another with robust intentional patterns but no mechanistic correlates? If so, which gets 'real beliefs' under your view?"*  
     *Likely Dodge/Response:* "The latter—beliefs are *defined* by pattern utility, not implementation."  
     **Follow-up:** "Doesn’t this make beliefs observer-relative? If so, how is this compatible with Dennett’s *realism* about patterns?"

  ---

  **Key Tactics Embedded:**  
  - **Follow-ups target retreats to "it’s just predictive!"** by pressing on ontological commitments (Q1, Q4, Q8), ethical spillover (Q6), and anthropocentric bias (Q3).  
  - **Your requested angles** are covered in Q1 (interpretability), Q2 (simulator), and Q3 (deceptive alignment).  
  - **Audience-tailored:** Skips Dennett 101, assumes comfort with LW-adjacent concepts (e.g., "out of distribution" in Q4).  
  - **Pressure Points:** Forces distinction between *pragmatic utility* and *pattern realism*, and tests boundaries of the stance with AI-specific edge cases.  

  **Delivery Tip:** Frame questions as collaborative explorations ("Help me reconcile X with Y...") rather than gotchas. Her defenses will be nuanced—use follow-ups only if her answer glosses over the tension. Good luck—this sounds like a fantastic episode!
