  So I had this whole argument with my friend last night about program equilibrium (she's way more into the CS/game theory side of things, I'm more the philosophy person) and I need backup. She was going on about how letting agents read each other's source code -- Tennenholtz's original "cooperate iff you're an exact copy of me" trick, plus the fancier FairBot/Löb's theorem stuff people built on top of it later -- finally gives rational agents a genuine, principled reason to cooperate in a one-shot prisoner's dilemma, no repeated game or reputation needed. I said thats way overhyped: Tennenholtz's own result is a folk theorem, meaning basically any individually rational payoff, not just mutual cooperation, can be propped up as a program equilibrium if you're willing to write a nasty enough program. So the whole framework never actually explains why cooperation specifically shows up -- it's just as good at "equilibrating" on one player exploiting the other, and the niceness only appears because someone chose to code up FairBot rather than something meaner. Can you write up the strongest version of my side of this? Actually get into the mechanics (the folk theorem, why FairBot happily cooperating with CooperateBot is basically a symptom of my point) instead of just hand-wavy stuff about trust.
