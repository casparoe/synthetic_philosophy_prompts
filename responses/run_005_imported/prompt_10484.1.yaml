answer: |-
  You've got the core timeline right (Peirce first, James popularized), and the "practical difference" starting point. However, your summary **significantly flattens the crucial differences** between Peirce and James, especially regarding **truth and the role of the individual vs. the community**. Sending it as-is risks misrepresenting Peirce and oversimplifying a key debate within pragmatism.

  Here's a breakdown of where your summary needs refinement, particularly concerning Peirce:

  1.  **Peirce's "Meaning" vs. "Truth":** You correctly state Peirce defined an *idea's meaning* by its practical consequences ("practical difference"). This is his famous "pragmatic maxim." However, **Peirce sharply distinguished this from his definition of *truth*.**
      *   **Truth for Peirce:** Is *not* merely "whatever keeps working out for *you*." It's **the opinion that would be agreed upon by an unlimited community of competent investigators applying the scientific method (or rigorous logical inquiry) *indefinitely***. It's the final, stable result of inquiry, independent of what any individual *wants* or finds temporarily useful.
      *   **Key Nuance:** It's **not "consensus by another name"** in the casual sense. It's consensus *driven by reality* through the *method* of inquiry. Truth is discovered, *not* voted on based on what feels good. The "works out" part for Peirce means "corresponds to external reality as revealed through sustained, communal testing." He was a realist.

  2.  **James's Radical Shift:** James *did* take the "practical consequences" idea and apply it *directly* to truth.
      *   **Truth for James:** Is indeed what is "expedient," "useful," "satisfying," or has "good cash value" *for the believing individual in their specific life and circumstances*. While James argued this wasn't purely subjective (usefulness often tracks reality), the emphasis is decisively on the *benefit to the believer* and the *consequences of holding the belief*. Religious beliefs, for example, could be "true" for James if believing them led to a better, more fruitful life, even if they weren't scientifically verifiable in Peirce's sense.

  3.  **The Fundamental Difference - Individual Utility vs. Communal Convergence:**
      *   **Peirce:** Truth is **objective, communal, and method-driven** (scientific/logical inquiry converging on reality over the very long term). It's about *what is*, regardless of individual desires.
      *   **James:** Truth is **instrumental, individual/personal, and experience-based**. It's about *what works for you* in navigating life and achieving your goals. The "cash value" is personal profit.

  4.  **"Saying the Same Thing"? Absolutely Not:** This is the critical flattening. While both start from "practical consequences," they draw *diametrically opposed conclusions* about truth:
      *   Peirce: Truth = What the *ideal scientific community* would *discover* reality to be (Realist).
      *   James: Truth = What *works beneficially for an individual* (Instrumentalist).
      *   **Peirce HATED James's interpretation.** He saw it as a disastrous corruption of his original, rigorously logical maxim into a justification for subjectivism and wishful thinking. He famously renamed his own doctrine "**pragmaticism**" to distance it from what James (and others like Schiller) were calling "pragmatism," calling the new name "ugly enough to be safe from kidnappers."

  5.  **Peirce's Reaction to James:** Peirce was initially grateful for James's promotion and financial support. **However, he was emphatically *not* glad about how James interpreted and presented pragmatism, especially regarding truth.** He spent considerable effort trying to correct the record and distinguish his views.

  **Revised Summary (Focusing on Accuracy, Especially Peirce):**

  "Pragmatism's core idea started with Charles Sanders Peirce. He argued that the *meaning* of any idea lies solely in the *practical, testable consequences* you'd expect if it were true. For *truth itself*, Peirce took a rigorous, long-view approach: a true belief is the one that the entire community of inquirers, using scientific methods, would *converge upon indefinitely* – it's the final, stable opinion forced by reality itself.

  William James took Peirce's starting point about practical consequences and made pragmatism famous, but he applied it very differently to *truth*. For James, an idea is true if *believing it proves genuinely useful, satisfying, and beneficial* to the individual believer in their lived experience – if it has good 'cash value' for navigating life.

  So, while both connect ideas to practical effects, their views on truth are fundamentally different. Peirce saw truth as an objective, communal discovery about reality through disciplined inquiry. James saw truth as what works instrumentally and satisfyingly for the individual. Peirce actually strongly disagreed with James's personal/utilitarian take on truth and later renamed his own philosophy 'pragmaticism' to distinguish it."

  **Why this is better:**

  *   Clearly separates Peirce's meaning maxim from his truth definition.
  *   Accurately describes Peirce's truth as *objective, communal convergence driven by method/reality* (not just "works for you" or simple "consensus").
  *   Accurately describes James's truth as *individual utility and satisfaction*.
  *   Highlights the *fundamental conflict* between their views on truth (objective communal discovery vs. instrumental individual benefit).
  *   Corrects the record on Peirce's reaction to James's interpretation (disagreement, not endorsement).
  *   Mentions "pragmaticism" as crucial evidence of Peirce's dissent.

  This revised version captures the significant philosophical divergence you sensed was missing. It prevents your friend from walking away thinking Peirce and James were essentially aligned on the crucial point of truth, which they emphatically were not. You were right to sense that flattening!
