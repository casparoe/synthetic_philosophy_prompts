  Ah, and here’s the kicker: if substantivalism were true, you’d need extra physical data to specify which point is which, beyond the metric. But GR doesn’t provide that—it’s pure geometry. So substantivalists either admit undetectable structure (metaphysical ouch) or deny that diffeomorphic models are identical (contradicting GR). 

  The user might also be hinting at a deeper question: why should physics care about metaphysical positions? The answer is that substantivalism (if true) would make GR underdetermined—there’d be physical facts not captured by the theory. That’s why it’s not "just math." 

