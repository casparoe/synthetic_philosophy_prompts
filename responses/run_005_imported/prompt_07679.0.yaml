prompt: |-
  Last night my friend got really drunk after a bad breakup and almost sent her ex a huge paragraph pouring her heart out. I grabbed her phone and made her wait til morning, figuring she'd regret it once she was sober and thinking straight. Shes still mad about it - we argued for an hour today. Her point is that sober-her doesn't get to overrule drunk-her just because people trust sober-her more, and that the alcohol didn't distort her feelings, it just took the filter off what she already actually wanted. Honestly I didnt have a great comeback for that. Was I right to take the phone, or was I just deciding for her what she 'should' want?
reasoning: |-
  Okay, the user is dealing with a tough situation with their drunk friend who almost sent an emotional text to her ex. They took her phone to stop her, but now she's mad, arguing that sober-her shouldn't override drunk-her. The user is questioning if they did the right thing.

  First, I need to unpack the friend's argument. She claims alcohol removes filters but doesn't distort true feelings. That's a common belief, but it's not entirely accurate. Alcohol impairs judgment, lowers impulse control, and affects emotional regulation. People do things drunk they'd never do sober, like texting an ex at 3 AM. Even if the emotions are real, the way they're expressed can be messy and regrettable.

  The user's main concern is whether they overstepped by deciding for their friend. They're worried about disrespecting her autonomy. But protecting someone from immediate harm when they're incapacitated is different from controlling their choices. Drunk decisions aren't fully autonomous because the person isn't in their right mind. It's like stopping someone from jumping into a pool they think is full but is empty.

  Also, the friend's anger now might be misplaced. She's probably embarrassed or still emotional about the breakup. The user gave her a chance to reconsider when sober, which is fair. If she still wants to send the text, she can, but at least it's a conscious choice.

  The user might also need reassurance. They did the right thing, even if the friend is upset now. Friends sometimes have to make tough calls. It's about caring, not controlling. Maybe suggesting ways to communicate this to the friend could help. Emphasizing that the action was about preventing regret, not silencing her feelings.

  Underlying needs: The user might feel guilty and need validation. They might also want strategies to handle the conflict with their friend. Reaffirming their decision and explaining the reasoning could help them feel confident. Also, considering the friend's emotional state post-breakup, the user might need advice on supporting her without enabling self-destructive actions.
answer: |-
  You were absolutely right to take the phone. Here's why your friend's argument, while understandable in her emotional state, doesn't hold up, and why your intervention was necessary:

  1.  **Alcohol Impairs Judgment & Impulse Control:** This is the core issue. Alcohol doesn't just "remove the filter"; it actively disrupts prefrontal cortex function. This area is responsible for:
      *   **Impulse Control:** Drunk-her had significantly reduced ability to stop herself from sending that text, regardless of the feelings involved.
      *   **Consequence Assessment:** Drunk-her was far less capable of rationally considering the potential fallout – how the ex might react, how sending it might make *her* feel later, how it could prolong her pain or prevent healing.
      *   **Emotional Regulation:** Alcohol amplifies emotions and makes them harder to manage rationally. Raw feelings are unleashed without the sober mind's ability to temper them with perspective or long-term thinking.
      *   **Communication Skills:** Drunk communication is notoriously messy, rambling, and unclear. Even if the feelings are real, expressing them incoherently while intoxicated rarely achieves the desired outcome.

  2.  **Drunk Decisions ≠ Authentic Decisions:** While the *feelings* (hurt, sadness, anger, love) were authentic, the *decision* to act on them in that specific way (sending a huge, unfiltered paragraph at that moment) was heavily influenced by the chemical impairment. Sober-her isn't "overruling" drunk-her; she's the *only* version capable of making a considered, autonomous decision free from significant chemical interference. Drunk-her lacks full agency.

  3.  **Regret is Highly Likely:** Your instinct was spot-on. The overwhelming likelihood is that sober-her *would* have deeply regretted sending that text. It could have:
      *   Embarrassed her.
      *   Given the ex power or satisfaction.
      *   Prolonged her pain by reopening wounds.
      *   Prevented her from moving on.
      *   Created an awkward or hostile dynamic if they need to interact (e.g., shared belongings, mutual friends).
      *   Been used against her.

  4.  **The "Wait Until Sober" Test is Fundamental Wisdom:** This is practically universal advice ("sleep on it," "sober second thought") because it works. You didn't delete the text; you simply enforced a pause. If the feelings and the desire to express them were truly that urgent and core to her being, *sober-her could still send it in the morning*. You preserved her *option* to send it with full agency, while preventing her from sending it *without* full agency.

  5.  **Friendship Duty of Care:** When a friend is severely intoxicated and about to do something potentially self-destructive with lasting negative consequences, intervening is an act of care, not control. It's similar to stopping them from drunk driving, getting into a dangerous situation, or making a huge financial decision. You protected her future self from a probable source of significant regret and pain.

  **Addressing Her Argument Directly:**

  *   **"Sober-her doesn't get to overrule drunk-her":** Sober-her *is* the baseline, fully functional self. Drunk-her is a chemically impaired state. Protecting the baseline self from actions taken in an impaired state *is* respecting their core autonomy. Letting drunk-her act is *disrespecting* sober-her's right to make decisions with full capacity.
  *   **"Alcohol didn't distort her feelings, it just took the filter off":** Partially true, but critically incomplete. While the raw feelings might be present, the *decision to act on them immediately, intensely, and unfiltered* is absolutely distorted by the alcohol. The "filter" isn't just social niceties; it's the complex cognitive machinery needed for healthy decision-making.

  **What You Could Say Now:**

  "Look, I understand you're angry and feeling raw. My intention wasn't to silence you or decide what you *should* want. I know those feelings are real and intense. My *only* intention was to protect you in a moment where you weren't yourself. Alcohol makes it incredibly hard to think about consequences or control impulses. I was terrified you'd wake up filled with regret and embarrassment about something you said while impaired. I didn't delete it; I just hit pause. If, now that you're sober and thinking clearly, you still feel sending that text is the absolute right thing for *you* and your healing, then you can send it. That's your choice, made with your full mind. I only wanted you to have the chance to make that choice clearly."

  **Conclusion:** You did the right thing. It was a tough-love move born from genuine care. Her current anger is likely fueled by the breakup pain, residual embarrassment, and the frustration of being stopped in an emotionally charged moment. Stand firm in knowing you acted as a true friend by preventing a highly probable future regret. Her sober self will likely thank you eventually, even if she can't see it right now.
