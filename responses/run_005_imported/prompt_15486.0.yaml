  Coherence Constraints as Fundamental. Some, like de Finetti, see coherence as inherently rational, with Dutch books as illustrative. But this might not satisfy someone seeking a deeper justification. The user might want more than an assertion that coherence defines rationality.

  Structural Rationality. Recent work by Worsnip or Kolodny frames coherence as a structural requirement. This avoids tying rationality to consequences but might feel like relabeling the problem rather than solving it.

  Assessing success: Each approach has critiques. Depragmatization might not fully escape pragmatics. Representation theorems rely on preference axioms that could be challenged. Accuracy arguments depend on scoring rules, which might be contested. Coherence as fundamental might seem dogmatic. Structural rationality is abstract and may not convince skeptics.

