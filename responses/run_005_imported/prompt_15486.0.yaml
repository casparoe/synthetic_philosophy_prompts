  First, I need to recall the standard Dutch book argument. It shows that if someone's credences violate probability axioms, a bookie can create a set of bets that seem fair individually but guarantee a loss collectively. The issue is moving from "you can be exploited" to "your beliefs are irrational." The user also mentions that defining degrees of belief via betting quotients might beg the question by assuming additivity from the start.

