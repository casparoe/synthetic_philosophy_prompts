answer: |-
  ## The Sea Battle and the Sands of Time: Defending Ockhamist Bivalence Against Aristotelian Indeterminacy

  Aristotle’s "sea battle" passage in *De Interpretatione* (Chapter 9) presents a profound logical and metaphysical puzzle that has echoed through millennia. If the statement "There will be a sea battle tomorrow" is *already* true (or false) today, it seems the future event is fixed, rendering human deliberation and action causally inert – a logical path to fatalism. Conversely, if such future-contingent statements lack a truth value, we seemingly abandon the principle of bivalence (every proposition is true or false), a cornerstone of classical logic. Trapped between fatalism and logical revisionism, two main escape routes have been charted: Aristotle’s (and later Łukasiewicz’s) rejection of bivalence for future contingents, and the Ockhamist/Prior approach preserving bivalence while denying its fatalist implications through tense logic. While both offer refuge, the Ockhamist solution, by maintaining logical integrity and offering a more intuitive account of agency, ultimately provides the superior harbour.

  Aristotle himself, deeply committed to the reality of deliberation and contingency, tentatively suggests the first escape: statements about singular future contingents are *neither true nor false* yet. Their truth-value is genuinely indeterminate until the event unfolds. Łukasiewicz formalized this intuition in the early 20th century with his three-valued logic, introducing a third truth-value ("possible" or "indeterminate") specifically for future contingents. This move directly blocks the fatalist inference: if "There will be a sea battle tomorrow" is not true *now*, then its current lack of truth does not entail the *necessity* of the battle happening (or not happening). The future remains genuinely open; admirals can meaningfully deliberate because their choices *will* determine the truth-value. The appeal is clear: it seemingly safeguards human freedom and the openness of the future by a localized surgical strike on classical bivalence.

  However, the Aristotelian/Łukasiewicz approach faces significant shoals. Firstly, it fundamentally alters the nature of assertion and propositional content. What does it mean to *assert* "There will be a sea battle tomorrow" if the proposition lacks a truth-value? Assertions typically aim at truth; an assertion devoid of truth-value seems defective or incomplete. Secondly, it struggles with complex propositions and reasoning. Consider the disjunction: "Either there will be a sea battle tomorrow or there will not be." Classically, this is a tautology, always true. Under Łukasiewicz’s system, if both disjuncts are indeterminate, the disjunction itself might also be indeterminate, violating a fundamental logical intuition. Thirdly, it risks making *all* future-directed assertions problematic, even mundane ones like "I will eat breakfast tomorrow." Must we suspend judgment on all such claims until the moment they occur? This seems counterintuitive and paralyzing for practical reasoning and planning. Finally, it introduces a problematic asymmetry: why are past contingents determinately true or false, while future ones are not? If the openness of the future demands indeterminacy, does the fixity of the past demand determinacy? This raises deep questions about the nature of time itself that the solution doesn't fully resolve.

  The Ockhamist solution, championed by Arthur Prior building on medieval insights attributed to William of Ockham, takes the opposite tack: **Preserve bivalence.** "There will be a sea battle tomorrow" *is* either true or false right now. However, Ockhamists deploy the sophisticated machinery of tense logic to dismantle the fatalist syllogism. They argue that the fatalist mistakenly conflates *truth* with *necessity*. Just because a statement about the future *is* true now, does *not* mean that the event it describes is *necessary* or causally determined *now*.

  The key lies in the *grounds* of the truth. The truth of "There will be a sea battle tomorrow" today is not grounded in some present, determining cause that forces the admirals' hands. Instead, its truth is grounded in the way the actual, branching future *will* unfold. Crucially, this future unfolds *through* chains of causes that include genuine human choices and contingent events. The statement is true *because* the admirals, acting freely tomorrow, *will* choose to fight. Prior’s tense logic allows us to express this: The proposition `P` ("Sea battle occurs at time t") is true *at* the present time `t0` *because* the actual future history of the world includes the event described by `P` at `t`. This "because" is temporal and historical, not causal in a deterministic sense. The admirals deliberating today are part of the causal chain that *will* lead to the truth or falsity of the proposition. Their deliberation is not futile; it is precisely what *makes* one future outcome true and the other false. The necessity mistakenly inferred is merely the necessity of the *present truth* of a future-tensed statement – "It is now true that F(P)" – not the necessity of the event P itself (`F` meaning "It will be the case that"). The future event remains contingent in its *occurrence*, even if the *proposition* describing it is presently true.

  The Ockhamist defence is compelling for several reasons. Firstly, it upholds classical logic and the intuitive principle of bivalence, avoiding the counterintuitive consequences and logical complexities of introducing a third truth-value. We can confidently reason about the future using familiar logical tools. Secondly, it provides a robust account of the *efficacy* of deliberation. My deliberation today is causally relevant precisely *because* it helps determine which future becomes actual, thereby determining the present truth-value of future-tensed propositions. The truth is a *consequence* of future free actions, not their *cause*. Thirdly, it elegantly handles the asymmetry between past and future. Past-tensed statements ("There *was* a sea battle yesterday") are also determinately true or false now, grounded in the fixed past. The Ockhamist explains this fixity as a result of the past being causally closed and unalterable, while the future remains causally open. The difference lies in the *direction of causation and possibility*, not in the fundamental logic of truth. Finally, it avoids the semantic awkwardness of indeterminate assertions. When I say "It will rain tomorrow," I am making a claim I believe to be true, grounded in present evidence and future (contingent) events; the Ockhamist preserves this natural understanding.

  While Łukasiewicz’s indeterminism offers an initial intuitive appeal for safeguarding freedom, its cost to logical coherence, its problematic implications for assertion and reasoning, and its inability to satisfactorily explain the past/future asymmetry are too high. The Ockhamist solution, by rigorously distinguishing the timeless truth of propositions from the temporal modality of events and leveraging the resources of tense logic, provides a far more powerful and elegant resolution. It affirms that the present truth of a future contingent statement is a reflection of the world's unfolding history, a history woven through genuine contingency and free action, not a deterministic blueprint. The sea battle's occurrence tomorrow may be true today, but that truth is written on water, shaped by the very deliberations it seems to threaten, vindicating both logic and liberty. The Ockhamist, therefore, offers not just an escape from fatalism, but a coherent map for navigating the logical landscape of time and truth.
