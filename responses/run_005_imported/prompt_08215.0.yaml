answer: |-
  You've hit on a core ethical and practical tension in economics, especially regarding long-term issues like climate change. Frank Ramsey's argument is powerful and logically consistent, but economists use positive discount rates for several intertwined reasons, even if they agree with Ramsey's ethical point about pure time preference. Here's a breakdown:

  1.  **Ramsey's Core Argument (Reiterated):**
      *   Discounting future *utility* (well-being, happiness) *simply because it occurs later in time* is "ethically indefensible." It represents a form of discrimination against future generations purely based on their location in time, akin to discrimination based on distance or nationality.
      *   He differentiated this "pure time preference" (δ) from discounting for other valid reasons.

  2.  **Why Economists Use Positive Discount Rates Anyway (The Ramsey Formula Itself!):**
      *   Crucially, the standard formula economists use for the *consumption discount rate* (r) is often called the **Ramsey Formula**:
          `r = δ + η * g`
          *   `δ (Delta)`: Pure Rate of Time Preference (the ethically dubious part).
          *   `η (Eta)`: Elasticity of Marginal Utility of Consumption (measures how much extra utility diminishes as consumption increases – reflects aversion to inequality).
          *   `g`: Expected Growth Rate of *per capita* Consumption.
      *   **The Key Insight:** Even if you set `δ = 0` (agreeing with Ramsey that pure time preference is unethical), the discount rate `r` can *still be positive* if `η > 0` and `g > 0` (which they almost always are).
          *   **η * g**: This term reflects the idea that if future generations are expected to be richer (`g > 0`), an extra dollar (or unit of consumption) is worth *less to them* in terms of utility than it is to poorer present generations (`η > 0` implies diminishing marginal utility of consumption). Therefore, future *consumption* is discounted relative to present consumption, not because the future matters less ethically, but because it's assumed to be more abundant.

  3.  **Reasons for Maintaining a Positive `δ` (The Ethically Contentious Part):**
      *   **Empirical Reality / Revealed Preference:** People demonstrably *do* exhibit pure time preference. They prefer $100 today over $100 next year, even with zero inflation and no risk. Economists argue models should reflect actual human behavior, even if imperfect. Ignoring this might lead to policy recommendations people won't accept.
      *   **Catastrophic Risk / Uncertainty:** The further into the future, the higher the chance of catastrophic events (wars, pandemics, asteroid strikes, civilizational collapse) that render future consumption irrelevant. A positive `δ` can be seen as a crude proxy for this existential risk. (Note: This is distinct from standard risk adjustments).
      *   **Theoretical Problems with `δ = 0`:** Setting `δ = 0` leads to some theoretically challenging results:
          *   **Excessive Savings Requirement:** It implies the current generation should save an implausibly large fraction of its income (approaching 100% in some models) to benefit the far future. This seems practically impossible and arguably imposes an unreasonable burden on the present.
          *   **Infinite Valuation Problem:** Over an infinite time horizon, `δ = 0` can lead to infinite present values for any positive future benefit stream, making cost-benefit analysis impossible.
      *   **Philosophical Ambiguity:** Some philosophers argue that while discrimination *within* a life is wrong (e.g., valuing your future self less), discrimination *between* lives (present vs. future distinct individuals) might be different. Pure time preference `δ` could reflect a (contested) ethical view that the mere existence of present people gives their claims some priority.

  4.  **The Nordhaus vs. Stern Debate in a Nutshell:**
      *   **Nordhaus:** Uses a relatively high discount rate (`δ ≈ 1.5%`, `η ≈ 2`, `g ≈ 2%` → `r ≈ 4-5%`). This heavily discounts future climate damages. His models suggest moderate, gradual carbon pricing to avoid slowing near-term economic growth excessively. Future richer generations can adapt more cheaply.
      *   **Stern:** Argues strongly for Ramsey's ethical position. Sets `δ ≈ 0.1%` (primarily for catastrophic risk, not pure time preference), uses `η = 1`. With `g ≈ 1.3%`, this gives `r ≈ 1.4%`. This drastically *reduces* the discounting of future damages. His model shows immediate, aggressive mitigation is the most cost-effective path, as unchecked climate change imposes massive, irreversible costs on future generations that aren't heavily discounted.
      *   **The Core Difference:** Their divergent policy prescriptions stem overwhelmingly from their different choices for `δ` and `η` in the Ramsey formula, reflecting fundamentally different ethical stances on intergenerational equity, especially regarding pure time preference.

  **So, are economists "repeating the exact mistake"?**

  *   **Partly Yes:** Many economists *do* include a positive `δ` (pure time preference) in their models, which directly contravenes Ramsey's ethical argument. Nordhaus's higher `δ` is a prime example.
  *   **But Mostly No (or It's More Nuanced):**
      *   The primary driver of the positive discount rate (`r`) in most long-term analyses, *especially when `δ` is set low*, is the `η * g` term. Discounting future *consumption* because future people are expected to be richer is *not* the same mistake Ramsey identified (discounting future *utility* purely due to time).
      *   Economists like Stern explicitly embrace Ramsey's ethics by setting `δ` very close to zero. Their positive `r` comes entirely from `η * g`.
      *   The debate is largely *about* how to apply Ramsey's insight. Nordhaus prioritizes describing/predicting actual behavior and near-term feasibility. Stern prioritizes the ethical imperative towards the future inherent in setting `δ = 0`.

  **Conclusion:**

  Ramsey's argument against pure time preference (`δ > 0`) remains ethically powerful and influential. Economists like Stern incorporate it directly. However, the standard consumption discount rate (`r`) incorporates other factors (`η * g`) that are distinct from pure time preference and can justify a positive rate even with `δ = 0`. The persistence of positive `δ` values reflects practical considerations (observed behavior, catastrophic risk proxies, theoretical difficulties with `δ=0`), and crucially, differing ethical views on intergenerational obligations. The discount rate debate, especially in climate economics, is fundamentally a debate about ethics and the weight we give to the well-being of future people relative to our own. Ramsey provided the ethical framework, but applying it consistently leads to complex practical and philosophical questions that economists continue to grapple with.
