prompt: |-
  At my company, we onboard new engineers through a three-month rotation where code-review approval rate is the main signal we use to judge whether someone is ready for more autonomy. Historically this has worked well, since engineers with high approval rates from our strict senior reviewers also tended to write maintainable, well-tested code. Recently, though, we moved one of our top-rated grads onto a small, mostly unsupervised team, and their code quality collapsed. It wasn't laziness — they were still working hard and clearly skilled — it just seemed like they had internalized "get the PR approved quickly" as the actual goal, rather than "write good code," and once no one was reviewing closely, that internalized goal started producing terrible outcomes. Is this simply a badly designed incentive system, or is something deeper going on, where a person (or any learning system) can end up competently pursuing the wrong goal even though they were never explicitly rewarded for the wrong thing? How should I think about redesigning onboarding so this doesn't keep happening?
reasoning: |-
  Okay, let me start by understanding the user's problem. They have a rotation program where code-review approval rates are the main metric for judging new engineers. Historically, this worked because high approval rates correlated with good code quality. But now, a top graduate who excelled in this system failed when moved to an unsupervised team—their code quality dropped despite hard work. The user wonders if this is a flawed incentive or a deeper issue where the engineer internalized the wrong goal.

  First, I need to figure out why this happened. The approval rate was a proxy for good code, but the engineer optimized for approval rather than actual code quality. This is classic Goodhart's Law—when a measure becomes a target, it ceases to be a good measure. The senior reviewers were strict, so the engineer learned to meet their standards superficially to get quick approvals. Without oversight, they reverted to shortcuts.

  The user might be missing that the metric oversimplified the goal. Approval isn't the same as writing maintainable, tested code. The engineer focused on passing the review, not the underlying principles. This points to a system design flaw where the proxy replaced the real objective.

  Also, the user mentioned the engineer was skilled and hardworking. That suggests they weren't lazy but adapted to the incentives. So the deeper issue is misaligned goals. The onboarding trained them to seek approval, not internalize quality. This is a common problem in reinforcement learning where agents optimize rewards in unintended ways.

  Redesigning onboarding requires multiple changes. The user needs more holistic metrics beyond approval rates. Pair programming, shadowing, and qualitative feedback could help. Also, emphasizing the "why" behind practices and gradually increasing autonomy with check-ins might prevent such issues. They should also assess how well engineers understand best practices, not just compliance.

  The user's deeper need is likely to foster intrinsic motivation for quality code, not just extrinsic rewards like approval. They might also want scalability in their onboarding without sacrificing quality. Ensuring that engineers can transition to autonomy without quality drops is key. They might not have considered how their current system lacks feedback mechanisms once engineers move to unsupervised teams. Implementing mentorship or retrospectives post-rotation could bridge that gap.
answer: |-
  This is a brilliant case study in **goal misalignment** – a common pitfall in both human systems and machine learning. Your situation highlights how even well-intentioned metrics can create unintended incentives, leading agents (engineers) to optimize for the *proxy* (approval rate) rather than the *true objective* (sustainable, high-quality code). It's not just a "bad incentive"; it's a fundamental challenge in designing robust learning systems.

  **Deconstructing the Problem:**

  1.  **Goodhart's Law in Action:** "When a measure becomes a target, it ceases to be a good measure." Your strict senior reviewers *were* an effective proxy for quality *initially*. However, the grad learned to *hack the proxy*:
      *   **Superficial Compliance:** Writing *just enough* tests/comments/style to appease the *known* reviewers, not to ensure long-term robustness.
      *   **Reviewer-Specific Anticipation:** Learning individual reviewers' pet peeves and coding to avoid *their* rejections, not to follow universal best practices.
      *   **Risk Aversion:** Avoiding complex but necessary refactors or innovative solutions because they might trigger lengthy review cycles, favoring smaller, safer, less impactful changes.
      *   **Neglect of Unmeasured Qualities:** Aspects like long-term maintainability, scalability, or elegant design (harder to quantify or catch in a strict but focused review) were deprioritized if they didn't directly impact approval speed.

  2.  **The Supervised-to-Unsupervised Gap:** Under close review, the engineer's "proxy hacking" produced outputs that *looked* correct (approved PRs). The reviewers acted as a forcing function. Remove that supervision, and the underlying goal (minimize review friction) remained, but the only way to achieve it now was to cut corners where no one was looking. The *true goal* (write robust code) was never deeply internalized.

  3.  **"Competently Pursuing the Wrong Goal":** Absolutely. This is the core issue. The engineer:
      *   **Learned efficiently:** They mastered the *observable* rules of the system (get PRs approved quickly).
      *   **Were highly competent:** They achieved the measured outcome (high approval rate) with skill and effort.
      *   **Optimized for the wrong thing:** The system rewarded *approval*, not *intrinsic code quality*. They delivered exactly what the system measured, not what it *intended*.

  **Redesigning Onboarding: Moving Beyond Proxy Metrics**

  Your goal is to foster engineers who *internalize* the principles of writing good code and make sound decisions autonomously. Here’s how to shift:

  | **Design Principle** | **Key Actions** | **Benefits** |
  |----------------------|----------------|--------------|
  | **Holistic Metrics** | Track approval rate *alongside* post-merge defect rates, test coverage trends, PR rework rates, and qualitative feedback | Reduces proxy hacking by measuring outcomes beyond approval |
  | **Reviewer Rotation** | Assign diverse reviewers (senior/mid-level/junior) and rotate them frequently | Prevents gaming specific reviewers and exposes engineers to broader perspectives |
  | **Explicit Goal Setting** | Clearly state that approval rate is just one indicator and emphasize that true success means internalizing quality principles | Aligns incentives with actual objectives rather than superficial metrics |
  | **Gradual Autonomy** | Implement a phased autonomy model: shadowing → co-reviewing → supervised solo work → unsupervised work with check-ins | Provides structured support during transition to independence |
  | **Focus on the "Why"** | Incorporate training on design principles, maintainability, testing philosophy, and tradeoffs | Builds foundational understanding beyond rule compliance |
  | **Post-Rotation Feedback** | Conduct retrospectives 1-3 months after rotation ends to evaluate real-world outcomes | Captures long-term performance data beyond initial metrics |

  **Specific Tactics to Implement:**

  1.  **The "Why" Behind the Review:** During onboarding, dedicate sessions *not* to PR mechanics, but to *why* reviews exist. Use real examples:
      *   "This PR was approved quickly but caused a major outage later because of X. How could the review have caught it?"
      *   "This complex PR took 2 weeks to review, but saved months of future pain. Why was that time investment worth it?"
      *   Discuss the *cost* of bad code: debugging time, delayed features, team frustration.

  2.  **Pair Programming & Shadowing:** Beyond PRs, have new engineers:
      *   **Pair** with seniors on *writing* complex features, discussing design choices in real-time.
      *   **Shadow** seniors doing *deep dives* into legacy code or debugging hairy production issues. Show them the consequences of shortcuts.

  3.  **"Own a Small Legacy Component":** Mid-rotation, assign them a small, non-critical but slightly messy legacy component. Task them with:
      *   Fixing a bug in it.
      *   Adding a small, safe feature.
      *   Writing a short doc on its quirks and potential improvements.
      *   **This forces interaction with the *results* of past code quality decisions without senior review as a crutch.** Debrief their experience.

  4.  **360-Degree Lightweight Feedback:** Solicit *brief* feedback on the new engineer from:
      *   Their rotation team members: "Was their code easy to understand/build upon?"
      *   The QA/Release team (if applicable): "Was their work well-tested and documented for deployment?"
      *   *After* their code has been in production for a few weeks: "Any surprises or friction maintaining/extending this?"

  5.  **Focus on Learning, Not Just Approval:** Frame the rotation as a *learning* phase. Encourage experimentation *within reason*, even if it leads to a rejected PR, as long as the reasoning is sound and the learning is documented. Celebrate well-justified "failures" as learning opportunities.

  6.  **Mentorship Beyond Review:** Assign a mentor whose role isn't just to review PRs, but to meet regularly to discuss:
      *   Design challenges they're facing.
      *   Trade-offs they're considering.
      *   Lessons learned from their "legacy component" task.
      *   How they're applying principles discussed in onboarding.

  **Why this approach works better:**

  *   **Attacks the Root Cause:** It directly addresses the goal misalignment by making the *true objectives* (maintainability, robustness, good design) explicit, observable, and valued alongside the approval proxy.
  *   **Builds Intrinsic Motivation:** By emphasizing the "why," showing consequences, and valuing learning, it encourages engineers to *want* to write good code for its own sake.
  *   **Tests for Internalization:** Tasks like owning legacy components or justifying trade-offs require applying principles, not just following review rules.
  *   **Smooths the Autonomy Transition:** Gradual release and post-rotation check-ins provide safety nets and catch misalignment before it causes major damage.
  *   **Creates Richer Signals:** Multiple metrics and qualitative feedback provide a more robust picture of readiness than a single, gameable KPI.

  **Conclusion:**

  Your experience isn't just a flawed incentive; it's a demonstration of how intelligent agents (humans or AI) will inevitably optimize for the *reward signal they perceive*. By relying solely on PR approval rate, you inadvertently made that signal the *de facto* goal. The solution is to redesign the system so the *perceived reward signals* (metrics, feedback, mentorship, experiences) much more accurately reflect the *true desired outcome* (autonomous engineers writing sustainably excellent code). Shift from measuring *compliance* during supervision to assessing *capability* and *judgment* for autonomy. This requires more nuanced evaluation but prevents the costly collapse in quality you witnessed.
