answer: |-
  You've nailed a profound tension in formal semantics! Your frustration is completely justified—Lewis's triviality result *is* a bombshell, and the continued use of truth conditions for indicative conditionals requires careful justification (or, as critics might say, some philosophical gymnastics). Here's the breakdown:

  1.  **Lewis's Result (The Problem):**
      *   **Premise:** We want the probability of an indicative conditional "If A, then C" to equal the corresponding conditional probability: P(If A, C) = P(C|A).
      *   **Premise:** We want "If A, C" to be a proposition with truth conditions (i.e., it's either true or false in each world).
      *   **Conclusion:** Lewis shows that if these hold *generally* (for *all* A, C, and probability functions P), then the probability space must be trivial. Specifically, it implies that A and C are probabilistically independent *for all* probability functions, which is absurd (e.g., "If this fair coin is flipped (A), it will land heads (C)" would have to have P(Heads|Flip) = P(Heads) = 0.5, but also be probabilistically independent of *everything else*, which is impossible).

  2.  **Why Semanticists Use Possible-Worlds Truth Conditions Anyway (The Responses):**
      Semanticists aren't (usually) being sloppy. They adopt strategies to navigate this result. Here are the main "moves":

      *   **Move 1: Deny the Thesis (P(If A, C) = P(C|A) holds universally):**
          *   **The Stalnaker/Bradley Restriction:** Robert Stalnaker (whose semantics is a prime target of Lewis) and others like Richard Bradley argue that P(If A, C) = P(C|A) holds only under specific conditions, primarily when the agent *accepts* that A is *epistemically possible*. If you're certain A is false, P(C|A) might be defined (e.g., as 1), but P(If A, C) might be undefined, undefined, or simply not evaluated. Their semantics *assigns* truth conditions, but the probability/assertability link only kicks in when A is live. This avoids the collapse by restricting the scope of the equation.
          *   **Implicit Contextualism:** Many possible-worlds accounts build in context-dependence (e.g., the selection function in Stalnaker's semantics depends on context). This contextual variability can be argued to prevent the specific kind of universal quantification over probability functions that Lewis needs for his proof. The truth conditions *exist*, but their probabilistic behavior isn't uniform across all contexts in the way Lewis assumes.
          *   **Non-Classical Probabilities:** Some (e.g., Simon Kaufmann) explore using non-standard probability measures or logics where the equation can hold without collapse, though this is a more niche approach.

      *   **Move 2: Deny Truth Conditions (The Adams/Edgington Line - Having Cake by Not Baking It):**
          *   This is the move you recalled. Ernest Adams and Dorothy Edgington argue that Lewis's result *proves* indicative conditionals *cannot* have truth conditions *at all*. They are not propositions.
          *   **Assertability, not Truth:** On this view, P(If A, C) *is defined* as P(C|A). This is the measure of its *assertability* or *acceptability*, not its truth. There is no proposition "If A, C" whose truth value can be assessed independently.
          *   **Why it works:** This completely sidesteps Lewis's result. There's no truth-conditional proposition for the probability to latch onto in the problematic way. The conditional is analyzed purely as a device for guiding belief and assertion under supposition.
          *   **The Cost:** This makes compositional semantics *much* harder. How does "If A, C" embed under negation, quantifiers, or other operators if it lacks truth conditions? Adams/Edgington offer complex (and often controversial) accounts of embedded conditionals based on conditional *assertability* or *probabilities*.

      *   **Move 3: Bite the Bullet on Restricted Application (The "Useful Tool" Defense):**
          *   Some semanticists might implicitly or explicitly concede that Lewis shows truth-conditional accounts *cannot perfectly capture the full probabilistic behavior* of natural language conditionals in all contexts.
          *   **Pragmatic Trade-off:** They argue that the benefits of having a *compositional*, truth-conditional semantics within a possible-worlds framework (which integrates smoothly with the semantics of modality, tense, quantifiers, attitude verbs, etc.) outweigh the cost of not perfectly matching P(If A, C) = P(C|A) in absolutely *all* cases, *especially* when A is known to be false. The semantics provides a powerful model for understanding meaning, embedding, and inference patterns, even if it slightly mispredicts probability judgments at the edges.
          *   **Focus on Core Cases:** They design their truth conditions to work well for "live" conditionals (where A is epistemically possible) and accept that the account might be less intuitive for counterfactuals or cases where P(A)=0, often deferring to a separate theory (like Stalnaker/Lewis similarity semantics) for subjunctives.

  **Is it Sloppy?**

  *   **Sometimes, yes.** It's possible your advisor or others are simply using the powerful tools of possible-worlds semantics without explicitly addressing the profound challenge Lewis poses. They might be working within a tradition that takes Stalnaker's contextualist restriction for granted.
  *   **Often, no (but requires awareness).** Most sophisticated formal semanticists working on conditionals *are* acutely aware of Lewis's result. They adopt one of the strategies above:
      *   Stalnakerians explicitly embrace the contextual/epistemic possibility restriction (Move 1).
      *   Others might lean towards Adams/Edgington for pure indicatives but use possible worlds for subjunctives or embedded contexts (a hybrid view).
      *   Many see the possible-worlds truth conditions as the best available *compositional* tool, accepting the limitations Lewis identified (Move 3).

  **The Standard Moves You Were Blanking On:**

  *   **Adams/Edgington (Move 2)** is the primary "no truth conditions" response. They *deny* the second premise (that "If A, C" has truth conditions).
  *   **Stalnaker/Bradley (Move 1)** is the primary "truth conditions with restriction" response. They *deny* that the equation P(If A, C) = P(C|A) holds universally; it requires A to be epistemically possible.

  **Conclusion:**

  You're absolutely right that Lewis's result is devastating for the *naive* idea that indicative conditionals have truth conditions *and* always obey P(If A, C) = P(C|A). Semanticists haven't ignored it; they've developed responses. Whether these responses are fully satisfactory is a matter of ongoing debate:

  1.  **Stalnakerians (Truth Conditions + Restriction):** Does the epistemic possibility restriction adequately explain the data, or is it ad hoc? Does it handle embeddings perfectly?
  2.  **Adams/Edgington (No Truth Conditions):** Can they provide a truly adequate semantics for embedded conditionals without truth conditions? Is the assertability view psychologically plausible for all uses?
  3.  **The "Useful Tool" Defense:** Is the trade-off between compositional power and probabilistic accuracy justified, or does it sweep the core problem under the rug?

  As Jonathan Bennett aptly put it, Lewis's proof "is not a puzzle; it is a disaster" for truth-conditional accounts of indicative conditionals. Semanticists continue to build possible-worlds models *despite* this disaster because those models offer unparalleled power in other areas. Whether this constitutes "having your cake and eating it too" depends on whether you find Moves 1 or 3 convincing, or if you think Move 2 (giving up truth conditions) is the only coherent path. Your skepticism is well-founded and shared by many leading figures in the field. The debate is very much alive! Ask your advisor *which* move they endorse regarding Lewis's result – it should lead to a fascinating discussion.
