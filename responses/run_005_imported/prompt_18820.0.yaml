  When Leo argues dogs show flexible communication too, he's raising a valid modern objection. Descartes absolutely underestimated animal cognition based on 17th century knowledge. But Dana's distinction between stimulus-response signaling versus open-ended reasoning holds water - there is a qualitative gap between canine whines and human debate about metaphysics.

