answer: |-
  What you're experiencing is a profound and exquisitely human conflict between the *external narrative* of your actions and the *internal reality* of your motivations. It's not just guilt; it's a dissonance arising from several intersecting truths:

  1.  **The Work is Genuine, the Motive is Complicated:** You are absolutely correct that the *quality of care* your mother receives is objectively excellent and unchanged by your internal state. This is significant. Your actions *are* materially good. However, the "goodness" ascribed to you ("the good one") carries an implicit assumption of *loving sacrifice*. Your motive—avoiding familial condemnation and preserving your legacy for your children—is a different currency: obligation, duty, perhaps even fear. The praise feels wrong because it credits you with a nobility of feeling you don't possess. You're being lauded for a *character* you aren't playing from the heart.

  2.  **The Burden of the "Good One" Label:** This label isn't just praise; it's a *burden* and a *distortion*.
      *   **Burden:** It absolves others (especially your brother) and implicitly sets an expectation for you to continue bearing the load. It traps you in the role.
      *   **Distortion:** It erases your complex reality—your lack of closeness, your emotional detachment, your *real* motivation. It simplifies you into a trope you don't identify with ("The Dutiful, Loving Child"). As a novelist, you understand the violence simplification does to a character. This label does violence to *your* internal narrative.

  3.  **The Shadow of Your Brother:** His proximity and detachment create a stark, unsettling contrast. His apparent lack of trouble highlights *your* burden (both logistical and emotional). His labeling of you as "the good one" feels like him defining the terms of your effort while exempting himself. The praise, partly flowing from this comparison, might taste bitter because it underscores the unfair distribution of labor and emotional weight. His ease throws your complex struggle into sharp relief.

  4.  **Authenticity vs. Performance:** You are performing an act of care with immense personal cost (flying bi-weekly, nights of vigil). Yet, the *emotional core* of the performance feels inauthentic to you. The praise highlights this disconnect. It feels like applause for a performance where you know you're not truly inhabiting the lead role's emotional motivation. The "good one" label feels like a review praising the character you're *supposed* to be, not the actor you *are*.

  5.  **Guilt's Sophisticated Disguise?** Is this just guilt? Partly, yes, but it's more layered.
      *   **Guilt for not loving her?** Possibly, but you acknowledge the distance is long-standing and real. This feels less like guilt for the *absence* of love, and more like...
      *   **Guilt for the *presence* of "impure" motives?** You feel your reasons are "lesser" than the love assumed by others. This is the sophisticated guilt: feeling guilty for *why* you're doing the right thing, even while doing it.
      *   **Guilt for resenting the role?** For resenting your brother? For wishing you *could* be as untroubled as he seems? Absolutely.
      *   **Existential Discomfort, not just Guilt:** Ultimately, this feeling "sits wrong" because it challenges your self-understanding. It forces you to confront the gap between how you are perceived ("the good one") and how you perceive yourself (someone acting from complex, largely non-affectionate motives). It's an identity dissonance, amplified by your profession which is *all* about dissecting motive and character.

  **So, does it "count for less"?**

  *   **Objectively (Impact):** **No.** Your mother receives excellent care. That is concrete and valuable. The impact on *her* is the same regardless of your internal state.
  *   **Subjectively (Meaning for You):** **Yes, it feels like it counts for less *to you*.** Because the meaning *you* ascribe to your actions (duty, legacy-preservation) feels less noble, less warm, less *validating* than the meaning ascribed by others (love, inherent goodness). The cost to you is high, but the internal reward (the feeling of "goodness") is absent or feels fraudulent.
  *   **Morally:** This is complex. Kant might argue the moral worth *is* diminished because the action isn't done purely from duty itself. Others would argue the *action itself* is what matters most. Your discomfort suggests you feel the moral worth *is* lessened by your motives, even if the outcome is good.

  **What you're likely grappling with is this:** You are doing a hard, necessary, materially good thing for reasons that feel existentially uncomfortable and inauthentic to your internal state, while being praised for motivations you don't possess, creating a dissonance that highlights the emotional cost and the perceived unfairness compared to your brother.

  **This isn't merely sophisticated guilt; it's a crisis of narrative.** As a novelist, you craft coherent character arcs and clear motivations. Your own life, in this intense chapter, defies that clarity. You are acting against your emotional grain for a future narrative (how you'll be remembered) that matters deeply to you, while feeling misread in the present narrative ("the good one"). The praise highlights the misalignment.

  **What can you do?**

  1.  **Acknowledge the Complexity:** Stop judging your motives as "less than." They are what they are: practical, self-protective, legacy-conscious, dutiful. They are *human*. They are sufficient to drive profoundly difficult action.
  2.  **Own Your Narrative (Internally):** Remind yourself: "I am doing this difficult thing. My reasons are complex and not rooted in affection, but they are *my* reasons. The care is real. That is enough for now."
  3.  **Separate Action from Feeling:** Accept that the action (providing care) and the feeling (lack of love) can coexist. You don't need to feel love to do the right thing *as you define it* (being present to avoid future condemnation).
  4.  **Reframe the Praise:** When called "the good one," hear it as an acknowledgement of the *action and its impact*, not as a commentary on your internal emotional state. Mentally translate it to: "Thank you for doing what needs to be done."
  5.  **Be Gentle with Yourself:** This is incredibly hard. You are expending enormous energy on someone you are emotionally detached from, driven by fear of future judgment. That is a heavy load. Your feelings are valid, even the uncomfortable ones about the praise and your brother.
  6.  **Consider the Legacy You're Actually Building:** For your children, the legacy won't just be "Grandma was cared for." It will also be witnessing the complexities of duty, family obligation, and the difficult choices adults make. Showing up, even for complicated reasons, *is* a form of integrity they will understand more deeply as they age.

  The unease you feel isn't a sign you're doing something wrong; it's a sign you're doing something incredibly hard for deeply complex reasons, while being framed in a way that doesn't match your internal truth. It’s the friction between the story being told *about* you and the story you are living *within* yourself. Hold space for that friction. It’s the mark of an honest person navigating an impossible situation.
