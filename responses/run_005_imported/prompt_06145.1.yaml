answer: |-
  ### Dialogue: Simpson's Paradox or Non-Collapsibility?  
  **Setting:** Two causal inference researchers, Alex (causal-graph-first advocate) and Jordan (non-collapsibility advocate), debate over coffee after a seminar.  

  ---

  **Jordan:** Alex, today’s seminar bugged me. The instructor acted like Simpson’s paradox is *only* about confounding, mediation, or colliders. But what about non-collapsibility? You can see reversals in odds ratios even in pristine RCTs with *zero* confounding.  

  **Alex:** I disagree. If you define the estimand properly and draw the correct DAG, Simpson’s paradox vanishes. Non-collapsibility isn’t a "distinct" phenomenon—it’s just a mathematical quirk that dissolves when you clarify the causal target.  

  **Jordan:** Let’s test that. Consider this RCT: We randomize 800 patients to Drug or Placebo for a disease. Half have Severe disease (stratum S=1), half have Mild (S=0). Randomization balances severity, so S isn’t a confounder. Here’s the data:  

  | **Severe (S=1)** | Recovered | Not Recovered |  
  |------------------|-----------|---------------|  
  | Drug (T=1)       | 30        | 70            |  
  | Placebo (T=0)    | 20        | 80            |  
  | **Mild (S=0)**   | Recovered | Not Recovered |  
  | Drug (T=1)       | 70        | 30            |  
  | Placebo (T=0)    | 90        | 10            |  

  **Marginal Table** (ignoring S):  
  |          | Recovered | Not Recovered |  
  |----------|-----------|---------------|  
  | Drug     | 100       | 100           |  
  | Placebo  | 110       | 90            |  

  Now compute odds ratios (OR):  
  - **Stratum-specific ORs:**  
    - Severe: OR₁ = (30/70) / (20/80) = (0.429) / (0.250) = 1.71  
    - Mild: OR₂ = (70/30) / (90/10) = (2.333) / (9.000) = 0.26  
  - **Marginal OR:**  
    - OR_marg = (100/100) / (110/90) = (1.000) / (1.222) = 0.82  

  The marginal OR (0.82) suggests Drug *harms* recovery, but in the Severe stratum, Drug *helps* (OR₁=1.71). Simpson’s reversal! Yet S isn’t a confounder—it was randomized. This is pure non-collapsibility.  

  **Alex:** I see why you’re tempted, but you’re conflating the *estimand*. The odds ratio isn’t collapsible, but in causal inference, we care about *effects*, not arbitrary statistics. Let’s draw the DAG:  
  ```plaintext
  (T) → [Y] ← (S)  
  ```  
  T (treatment) is randomized, so no backdoor paths. S (severity) affects Y (recovery) but isn’t a confounder. The stratum-specific ORs differ (1.71 vs. 0.26) because S *modifies the effect*. The marginal OR is a weighted average distorted by non-collapsibility—it’s not the right causal estimand.  

  **Jordan:** Exactly! But the instructor claimed Simpson’s paradox *always* reflects confounding/mediation. Here, there’s none. The reversal occurs because the marginal OR fails to account for heterogeneity. Adjusting for S isn’t about blocking bias—it’s about respecting the mathematical properties of the OR.  

  **Alex:** You’re missing my point. The paradox disappears once we define our target: the *average treatment effect* (ATE). For binary outcomes, we should use risk differences or collapsible effect measures. The OR’s non-collapsibility is a red herring—it’s not a "paradox" if we’re clear about what we’re estimating.  

  **Jordan:** But in practice, odds ratios are ubiquitous—logistic regression, case-control studies, survival analysis. Even in this RCT, if I naively report the marginal OR (0.82), I mislead people into thinking Drug is harmful. Non-collapsibility *is* the culprit.  

  **Alex:** Then your estimand is incoherent. The causal risk ratio (RR) is collapsible. Let’s compute it:  
  - Severe: RR₁ = (30/100) / (20/100) = 1.50  
  - Mild: RR₂ = (70/100) / (90/100) = 0.78  
  - Marginal RR: (100/200) / (110/200) = 0.909  
  No reversal! The marginal RR (0.91) is between 0.78 and 1.50. The "paradox" vanishes with a sensible effect measure.  

  **Jordan:** But odds ratios arise naturally in models with binary outcomes or time-to-event data. Ignoring non-collapsibility is dangerous. Suppose we run a logistic regression for Y ~ T, ignoring S. We get OR_marg ≈ 0.82 (harm). But if we include S (Y ~ T + S), we get a conditional OR for T of, say, 0.95—still biased because the true effects are heterogeneous! Non-collapsibility means adjusted ORs aren’t transportable.  

  **Alex:** Now you’ve shifted to effect modification. Yes, S modifies the effect, so we *shouldn’t* report a single OR. We should stratify or use interaction terms. The DAG tells us S isn’t a confounder, but it *is* an effect modifier. Simpson’s paradox here is a call to clarify effect heterogeneity—not evidence of a "new" phenomenon.  

  **Jordan:** But why does the marginal OR reverse direction? Non-collapsibility! In your RR example, the marginal RR didn’t reverse because RR is collapsible. The OR’s behavior is uniquely pathological. Even if S isn’t a modifier, if the conditional OR is constant, the marginal OR is biased toward 1.0. Try it:  
  - Severe: OR₁ = 4.0 (Drug rec: 40/60, Placebo: 20/80)  
  - Mild: OR₂ = 4.0 (Drug: 80/20, Placebo: 50/50)  
  - Marginal OR: (120/80) / (70/130) ≈ (1.5) / (0.538) ≈ 2.79 ≠ 4.0  
  No reversal, but attenuation—purely from non-collapsibility.  

  **Alex:** And? This is well-known: the marginal OR is a weighted average of conditional ORs only under no association between S and Y. Here, S affects Y, so the OR isn’t collapsible. But this isn’t paradox—it’s expected. Calling it "Simpson’s paradox" conflates mathematical quirks with causal structure.  

  **Jordan:** Then why do textbooks use the kidney stone example (with risk differences) to illustrate Simpson’s paradox? They’re highlighting a *pattern* (reversal/divergence), not just confounding. Non-collapsibility produces the same pattern without confounding. Dismissing it ignores a key lesson: marginal and conditional estimates can disagree for *mathematical* reasons, even in perfect RCTs.  

  **Alex:** Fair, but the kidney stone example is about confounding! The "paradox" resolved by adjusting for stone size. Your RCT example has no confounding, so it’s not Simpson’s paradox—it’s a different issue. Conflating them risks misdiagnosis. If you see reversal, first check the DAG for confounding/mediation. Only then consider non-collapsibility.  

  **Jordan:** But in practice, we don’t know the DAG a priori! If I see reversal, I must consider *both*. Non-collapsibility isn’t "noise"—it explains why adjusted/unadjusted ORs disagree in RCTs. Calling it "just math" ignores real-world implications: in meta-analyses, unadjusted ORs introduce bias even when studies are confounder-free.  

  **Alex:** Then the solution is to avoid non-collapsible effect measures when possible. Use g-computation or targeted maximum likelihood for the ATE. The paradox dissolves when you target the right quantity.  

  **Jordan:** Agreed—but until we eradicate odds ratios from practice, non-collapsibility remains a distinct pitfall. Simpson’s paradox is a basket: confounding *and* non-collapsibility can both put apples in it.  

  ### Resolution  
  **Alex:** ...Fine, you’ve convinced me. In this RCT, non-collapsibility alone causes the reversal, and DAGs alone can’t explain it. We should teach that Simpson’s paradox has two faces:  
  1. **Causal** (confounding/mediation), fixed by adjustment.  
  2. **Mathematical** (non-collapsibility), fixed by choosing collapsible measures.  

  **Jordan:** Exactly. And in this case, literature favors the non-collapsibility view: Gail et al. (1984) and Greenland et al. (1999) show odds ratios diverge marginally/conditionally without confounding. The causal-graph-first view needs this caveat.  

  **Alex:** Point taken. Next coffee, I’ll bring a DAG—you bring an RCT dataset. We’ll reconcile them.  

  **Jordan:** Deal. But I’m choosing the odds ratios.  

  ---  
  **Key Takeaways:**  
  - Non-collapsibility *is* a distinct source of Simpson-style reversals, demonstrable in RCTs with no confounding.  
  - Causal DAGs diagnose confounding/mediation but don’t explain mathematical non-collapsibility.  
  - The paradox dissolves only by clarifying the estimand: use collapsible measures (e.g., RR) for population effects, or accept that ORs require careful interpretation.  
  - Methodological literature (e.g., Greenland, Gail) supports Jordan’s view: non-collapsibility is irreducible to causal structure.
