  **Specific Justification Notes for Pushback:**

  1. **Hume Error (Major -1pt):**  
     *"The Querist" (1735-37) predates Hume's economic essays (1752). Berkeley was building on* earlier *anti-bullionists like Nicholas Barbon. Hume likely developed his views independently or through continental influences. Crediting Berkeley with influencing Hume here is historically inaccurate.*

  2. **Chartalism Overstatement (-0.5pt):**  
     While Berkeley saw money as a social institution, he emphasized *public trust* and *utility* over *state decree* as the source of value (Query 441: "Whether the credit of a national bank be not the *public credit?"*). Modern chartalism (Knapp/MMT) focuses more on state power than Berkeley did.

  3. **Immaterialism Connection (-0.5pt):**  
     Though the student's analogy is philosophically clever, there's *no textual evidence* Berkeley applied his metaphysical immaterialism to economics. His economic arguments stand on empirical/practical grounds in *The Querist*. This is a retrospective interpretation by historians, not Berkeley's explicit link.

  4. **Minor Omission (-0.5pt):**  
     Berkeley's proposal wasn't *just* about paper credit – he stressed credit must fund *productive labor* (fisheries, linen manufacture) and *public infrastructure* (roads, schools), not just "circulate." This operational detail strengthens his wealth=industry thesis.

  **What the Student Got Right:**  
  - Perfect summary of money≠wealth & "ticket" analogy  
  - Correct Ireland solution (paper credit via national bank)  
  - Valid rejection of bullionism  
  - Generally correct philosophical *contrast* (social practice vs. intrinsic substance)  

  **Why 8.5 is Fair:**  
  The core economics (5/5 points) is flawless. Deductions are for historical context errors and philosophical overreach. The immaterialism link, while not strictly textual, shows critical thinking and earns partial credit. The answer remains strong despite minor flaws.
