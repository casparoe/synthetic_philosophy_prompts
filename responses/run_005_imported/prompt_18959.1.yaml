  The collapse happens because the conditional has to be equivalent to the material conditional in all scenarios. But then probabilities don't align, leading to contradiction. For example, P(A⊃B) can be high even when P(B|A) is low, like when A is unlikely. 

  Why does closure cause this? Because each conditionalization forces the conditional to be true or false based on subsets of possibilities. When you learn A, the conditional must match B. When you learn not A, it must be true. But those can't hold simultaneously unless the conditional is A⊃B. And since A⊃B doesn't satisfy the probability requirements, the only solution is if there are no non-trivial conditionals, meaning all possibilities are such that A and B are both true or both false.

