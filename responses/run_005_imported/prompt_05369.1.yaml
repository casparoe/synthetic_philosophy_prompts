answer: |-
  You've hit on a core insight that aligns with significant philosophical traditions (like Kantian deontology), but the "obvious fix" runs into several practical and theoretical hurdles that keep moral luck a persistent puzzle. Here's why philosophers haven't simply dissolved it:

  1.  **The Inescapability of Outcome in Moral Experience & Practice:**
      *   **Emotions & Blame:** Our reactive attitudes (anger, resentment, blame, guilt) are *intrinsically* tied to outcomes. We feel profound anger at the driver who killed a child, even knowing an equally reckless driver caused no harm. This emotional response feels morally significant, not just an error. Dismissing it entirely seems to ignore a deep part of human moral psychology.
      *   **Legal Systems & Social Consequences:** Societies *must* respond to actual harm. Punishment, restitution, and deterrence are primarily concerned with the consequences of actions. A legal system based *solely* on intentions/effort would be impractical and arguably unjust (e.g., no penalty for attempted murder that failed only by chance, or for reckless endangerment that luckily hurt no one).
      *   **Character Assessment:** Outcomes often reveal something about an agent's character or the true nature of their intention/effort *in practice*. While the *intent* might be identical, the reckless driver who killed someone confronts the horrific reality of their choices in a way the "lucky" one does not. This lived consequence shapes moral understanding and responsibility differently.

  2.  **The Problem of "Control" and Epistemic Limits:**
      *   **What *is* truly within control?** Our intentions and efforts themselves are shaped by factors arguably outside our full control (upbringing, genetics, circumstances, even luck in forming good habits). If we push "control" too far, moral responsibility itself might vanish (hard determinism).
      *   **Foreseeability & Risk:** Recklessness *is* culpable precisely because it involves knowingly or negligently imposing an *unjustifiable risk* of harm on others. Judging the *magnitude* of that risk and the *culpability* for imposing it inevitably involves considering the *potential* outcome, even if the actual outcome is luck-dependent. The unlucky driver didn't just have bad luck; they engaged in behavior that made such bad luck tragically possible for others.

  3.  **Counterintuitive Implications of Pure "Control" Theory:**
      *   **Moral Indifference to Results:** If outcomes are irrelevant, then:
          *   A surgeon who intends well and tries hard but kills a patient due to an unforeseeable allergic reaction is *as blameworthy* as one who kills through gross negligence.
          *   Someone who donates to charity with pure intent but whose money is stolen by a corrupt official is *as praiseworthy* as someone whose donation actually feeds thousands.
          *   Attempted murder (where luck prevents death) deserves *identical* punishment to successful murder.
      *   **Neglect of Moral Luck in *Praise*:** Moral luck applies to praise too (e.g., two equally kind people, one of whom happens to be in a position to save a life). If we ignore outcomes, praiseworthiness becomes equally divorced from actual good done.

  4.  **Different Types of Moral Luck Compound the Problem:**
      *   **Constitutive Luck:** Luck in who you are (temperament, inclinations) – which shapes your "intentions and effort".
      *   **Circumstantial Luck:** Luck in the situations you face – which determines what intentions you even *get* to form or act upon (e.g., living in a time/place where you never face a major moral test vs. one where you do).
      *   **Resultant Luck:** Luck in how your actions turn out (the driver case).
      *   **Causal Luck:** Luck in how one is situated in the causal chains leading to outcomes.
      Focusing *only* on intentions/effort doesn't eliminate the influence of constitutive and circumstantial luck on *forming* those very intentions and efforts.

  **Why Philosophers Haven't Just "Fixed" It:**

  Philosophers recognize the force of your intuition (Kant is the prime example). However, they grapple with moral luck because:

  1.  **It exposes a deep tension:** Between our desire for a morally just universe where responsibility tracks *only* what we control (the "control principle") and the undeniable moral significance we attach to actual consequences and the role of luck in human life.
  2.  **Pure solutions create new problems:** As shown above, strictly applying the control principle leads to counterintuitive results and seems to ignore crucial aspects of our moral lives (emotions, social practice, character development).
  3.  **It's fundamental to agency:** Moral luck forces us to confront the messy reality of human action in an uncertain world. We act with limited knowledge, influenced by factors beyond our control, aiming at outcomes we can't guarantee. Any theory of responsibility must account for this.

  **Your Insight is Valid, But...**

  You are absolutely right that shifting focus *towards* intentions, effort, and controllable factors is a crucial *corrective* to overly outcome-focused judgment. It highlights the unfairness inherent in judging people *only* by results. Many philosophers (like Nagel, Williams, and later commentators) argue that we need to *acknowledge* moral luck as a pervasive feature of the ethical landscape rather than trying to eliminate it entirely. The goal becomes understanding how responsibility functions *despite* luck, or how we can incorporate an awareness of luck into fairer judgments.

  **In essence:** While judging *solely* by intentions and effort solves the *conceptual* unfairness in the reckless driver case, it creates significant practical problems, ignores deep aspects of moral psychology and social necessity, and fails to resolve the influence of other forms of luck. The puzzle persists because the tension between the ideal of control and the reality of luck is fundamental to the human condition. Philosophers aren't making it harder than it needs to be; they're wrestling with its genuine complexity.
