prompt: |-
  A university research integrity committee is finalizing its findings on a fabrication case. A paper's three co-first authors jointly produced its central dataset. Per standard practice, every coauthor -- including these three -- signed a statement accepting accountability for the integrity of the whole work, not just the sections they personally wrote. One of the three has since admitted to fabricating part of that dataset; the committee's investigation confirms the other two never saw the raw files and had no reason for suspicion. Members are split: some want a misconduct finding against the fabricator alone, clearing the other two as uninvolved; others argue the joint authorship statement bound the three to a commitment the group failed, regardless of individual knowledge. Draft the committee's findings memo -- what each co-first author is responsible for, and what follows -- and engage seriously with the objection that a 'joint failure' here just relabels ordinary negligence in trusting a colleague.
reasoning: |-
  Okay, the user is asking me to draft a university research integrity committee's findings memo regarding a fabrication case involving three co-first authors. One admitted to fabricating part of the dataset, while the other two apparently never saw the raw files and had no reason for suspicion. Committee members are split between holding only the fabricator responsible versus holding all three accountable based on their joint authorship statement.

  I need to understand the core tension here. The committee is grappling with the concept of collective responsibility versus individual culpability in research misconduct. On one side, there's the argument that the fabricator alone committed misconduct through intentional deception. On the other side, there's the view that all authors failed in their collective responsibility to ensure data integrity, regardless of individual knowledge.

  The key documents here are the authorship statement signed by all co-authors, which typically includes accepting accountability for the entire work. This creates a contractual obligation that goes beyond personal contributions. I should address the objection that calling this a "joint failure" might just be relabeling ordinary negligence in trusting a colleague.

  For the memo structure, I'll include standard sections: introduction, investigation findings, analysis of responsibilities, conclusions, and recommendations. I need to be balanced but firm about research integrity principles. 

  For the fabricator, the responsibility is clear: intentional misconduct through data fabrication. For the other two co-first authors, I should emphasize their responsibility stems from the authorship agreement they signed, not from negligence per se. They had a duty to verify the data they co-produced and put their names on. Their failure to implement reasonable verification measures constitutes a breach of their collective responsibility.

  Regarding the objection about "relabeling negligence," I should acknowledge that trust among collaborators is normal, but argue that in research, trust must be coupled with verification mechanisms. The problem isn't trust itself, but the absence of safeguards when producing shared data. 

  I'll recommend different consequences: retraction of the paper, misconduct proceedings for the fabricator, and corrective but non-disciplinary actions for the other two authors like mandatory research integrity training. This balances accountability with proportionality.

  The memo should maintain a formal, objective tone while making it clear that research integrity requires both individual honesty and collective vigilance. The goal is to uphold standards without being unfairly punitive to those who were deceived.
answer: |-
  ## University Research Integrity Committee: Findings Memorandum

  **Subject:** Determination of Responsibility in Fabrication Case - Paper [Paper Title/ID], Authors [List All Authors]  
  **Date:** [Date]  
  **Committee Chair:** [Chair Name]  
  **Distribution:** University Provost, Dean of Research, Department Heads (Relevant Departments), Authors (via Official Channels), Research Integrity Office File  

  **1. Introduction**  
  This memorandum details the findings and determinations of the Research Integrity Committee (RIC) regarding allegations of data fabrication in the paper titled "[Paper Title]," published in [Journal Name] on [Date]. The investigation focused on the central dataset, jointly produced by the three co-first authors: Dr. [Fabricator Name] (hereafter "Researcher A"), Dr. [Co-Author 1 Name] ("Researcher B"), and Dr. [Co-Author 2 Name] ("Researcher C"). All co-authors, including these three, signed the journal's standard authorship declaration accepting accountability for the integrity of the entire work. Researcher A has admitted to fabricating a specific portion of the central dataset ([Specify portion if possible, e.g., "Figure 3 results"]). The RIC investigation confirmed Researchers B and C did not participate in the fabrication, were unaware of it, and had no specific reason, based on the information presented to them, to suspect misconduct at the time of submission and publication.

  **2. Investigation Findings of Fact**
  *   The central dataset underpinning the paper's key conclusions was produced jointly by Researchers A, B, and C as co-first authors.
  *   Researcher A intentionally fabricated [Specify portion] of this dataset. This constitutes scientific misconduct (fabrication).
  *   Researchers B and C did not fabricate any data.
  *   Researchers B and C did not have direct access to or review the raw data files associated with the fabricated portion prior to submission/publication. The data was managed and processed primarily by Researcher A for this segment.
  *   Researchers B and C were presented with processed/summary data and results by Researcher A. The investigation found no evidence suggesting this processed data appeared implausible or inherently suspicious in a way that should have triggered specific doubt or further investigation *by them at that time*.
  *   All co-authors, including A, B, and C, signed the journal's authorship statement declaring their contribution and accepting accountability for the entire work's integrity.

  **3. Analysis of Responsibility**

  The RIC acknowledges the differing interpretations debated by its members regarding the scope of responsibility for Researchers B and C. After careful deliberation, the Committee finds:

  *   **Researcher A:** Is solely and directly responsible for the act of **fabrication**, a serious violation of research integrity constituting scientific misconduct. Researcher A breached their individual ethical and professional obligations.
  *   **Researchers B and C:** While not culpable for the *act of fabrication* itself, and while lacking *mens rea* (guilty mind) or demonstrable negligence in their *specific oversight of Researcher A's actions* on this occasion, **bear responsibility for the collective failure to ensure the integrity of the central dataset they jointly produced and presented as reliable.** This responsibility arises directly from:
      *   Their status as **co-first authors** specifically responsible for generating the central data.
      *   Their explicit **signature on the joint authorship statement**, which constitutes a formal commitment to stand behind the *entire* work's validity, not merely their individual technical contributions.
      *   The inherent professional obligation within a research team, especially among lead authors generating core results, to implement and adhere to practices ensuring data integrity *as a group*.

  **4. Engagement with the "Relabeling Negligence" Objection**

  The Committee seriously considered the objection that finding a "joint failure" responsibility for Researchers B and C merely relabels ordinary negligence in trusting a colleague, especially since no specific grounds for suspicion were identified.

  The Committee distinguishes its finding from simple negligence in the following ways:

  1.  **Source of Obligation:** The responsibility here stems not *primarily* from a failure to detect deception (which might approach negligence), but from the **prior affirmative commitment** made via the joint authorship statement. By signing, Researchers B and C *contractedually assumed* a duty of collective guardianship over the whole paper's integrity. This duty exists *independently* of whether they could have detected the specific fraud.
  2.  **Scope of "Failure":** The failure is not defined narrowly as "failing to catch the fabricator," but broadly as **failing to establish and follow robust group practices** sufficient to *reasonably discharge* the collective accountability they had accepted. While trust is essential, it cannot be the *sole* safeguard when producing shared core data under a joint accountability framework. The absence of basic verification mechanisms *within the co-first author group* (e.g., routine spot-checks of raw data by another co-first author, shared access to raw data repositories) constitutes a failure to operationalize their shared commitment. This is a failure of the *group structure and process*, for which all lead authors share responsibility.
  3.  **Preventative Focus:** Characterizing this as a "joint failure" emphasizes that research integrity is not solely an individual virtue but also a **collective practice**. Upholding the meaning of co-first authorship and the declarations that accompany it requires proactive systems, not just reactive trust. Finding responsibility here reinforces the need for such systems to be standard practice among collaborators, especially those jointly producing critical results.
  4.  **Proportionality:** This finding acknowledges Researchers B and C were deceived and lacked intent. It does not equate their responsibility with Researcher A's misconduct. The consequences (see below) reflect this distinction. The "joint failure" label accurately describes their role in the *systemic breakdown* that allowed the fabricated data to enter the scientific record under their joint authorship, without alleging they were negligent detectives.

  **5. Committee Conclusions**

  1.  **Researcher A** committed scientific misconduct through fabrication. They bear sole responsibility for this intentional act.
  2.  **Researchers B and C** bear responsibility for the failure of the co-first author group to implement adequate shared safeguards commensurate with their joint accountability for the central dataset's integrity, as pledged in their authorship statement. This constitutes a breach of their collective responsibility under the authorship agreement, though not misconduct per se.
  3.  **All co-authors** share responsibility for the publication of a paper containing fabricated data. The validity of the paper's core conclusions is compromised.

  **6. Recommendations**

  Based on these findings:

  1.  **Paper Retraction:** The University will formally request the journal retract the paper due to fabricated data in the central dataset. The retraction notice should clearly identify the fabricated portion and the findings regarding authorship responsibility as determined here.
  2.  **Researcher A (Fabricator):**
      *   Referral to appropriate University disciplinary procedures for scientific misconduct.
      *   Mandatory completion of intensive research ethics and integrity training before any future research involvement.
      *   Notification to relevant funding agencies per University policy.
  3.  **Researchers B and C:**
      *   **Required Completion:** Mandatory completion of a University-approved research integrity training program focused on collaborative research practices, data management, and fulfilling co-authorship responsibilities.
      *   **Corrective Action Plan:** Development and implementation, in consultation with their Department Head and the Research Integrity Office, of a plan outlining specific steps they will take in future collaborative research (especially as lead authors) to ensure robust data verification practices within the team (e.g., shared raw data access protocols, cross-verification procedures). This plan must be submitted to the RIC for review.
      *   **Letter of Censure:** A formal letter from the RIC Chair will be placed in their personnel files detailing their responsibility for the collective failure described above. This is not a finding of misconduct but a record of failing to meet the standards of collective accountability inherent in their co-first authorship role.
  4.  **All Authors:** Notification of the retraction and these findings.
  5.  **University Policy:** The Research Integrity Office is tasked with reviewing and clarifying guidance on co-authorship responsibilities, emphasizing the practical steps expected of collaborative teams, particularly those generating core data under joint leadership/first authorship, to fulfill their collective accountability commitments.

  **7. Signatures**

  [Signature of RIC Chair]
  [Name of RIC Chair], Chair
  University Research Integrity Committee

  [Date]
