  Had a long argument with a friend last night about costly signaling that we never really resolved, so hoping you can settle it. We both know the story that Darwin once wrote to Asa Gray something like 'the sight of a feather in a peacock's tail makes me sick,' becuase it looked like exactly the kind of pointless, costly ornament natural selection should've weeded out -- which is basically why he came up with sexual selection as a separate mechanism. My friend's whole position is that if you explained Zahavi's handicap principle to Darwin (that a signal's cost is *why* it's trustworthy, since a low-quality faker couldn't afford to produce it convincingly) he'd just nod and say 'yes, that's basically what I already meant.' I think that's giving him too much credit -- his actual theory was pretty much just 'females happen to prefer trait X,' with no real mechanism for why that preference wouldn't eventually get swamped by cheap fakers, which is the specific gap Zahavi filled a century later. So based on what Darwin actually committed himself to in Descent of Man, not just the general vibe of the idea, would he have seen the handicap principle as a natural extension of his own theory, or is there something about it that would've genuinely bugged him? Curious which of us is closer to right, if either.
