  ok so we're reading silas marner in english rn and my teacher mentioned as almost a side note that george eliot actually translated feuerbach's essense of christianity into english before she ever wrote a novel, which seems like a huge deal nobody really talks about?? feuerbachs basic argument (i think?) is that god is just humanity's own best qualities projected outward, so worshipping god is secretly just worshipping ourselves. can you compare that actual argument to what eliot does with religion in her own fiction (silas marner, or middlemarch/adam bede if u know those better)? like does she basically just turn his philosophy into plot, or does her version of ditching-god-but-keeping-morality end up somewhere meaningfully different from his? and honestly, which one of them do you think is more radical about religion?
