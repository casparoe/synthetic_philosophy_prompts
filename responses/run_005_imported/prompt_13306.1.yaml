  Structure matters: start with personal stories to connect emotionally, weave in her intellectual rigor subtly, then address her views on death by honoring her refusal to speculate. End with gratitude for her presence, not assumptions about her absence. 

  Check potential pitfalls: "energy returning to the universe" is out—too close to what she hated. "Her spirit lives on" might imply dualism. Even "her consciousness continues" is forbidden. Stick to observable impact: memories, influence, the gap she left behind. 

