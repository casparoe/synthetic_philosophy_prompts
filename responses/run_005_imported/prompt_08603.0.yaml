  So I've been falling down a rabbit hole on the "moral equality of combatants" debate in just war theory -- Walzer's traditionalist claim that soldiers on either side are equally permitted to kill enemy combatants no matter whose cause is just, versus McMahan's revisionist line that unjust combatants never actually have the right to kill, even when they're blameless for being there. For a piece I'm working on, could you write me a dialogue between a sharp defender of each camp, centered on the hardest case for both sides: a conscript who reasonably suspects his side's war is unjust but has basically no real option to refuse? I don't want either side strawmanned -- they should know the literature cold and actually push back on each other's best move (like the "reciprocity" argument that treating unjust combatants as already committing wrongs just by fighting removes their incentive to obey the in bello rules at all), rather then just restating their opening positions.
