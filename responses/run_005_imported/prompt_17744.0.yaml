  But why in the first attempt (trying to trade in all efficient cases) did we fail? Because the incentive constraints forced the prices to be the same across different type profiles, and then the IR constraints for the high-cost seller and low-value buyer conflicted.

  In summary, the key points about SPIs:

  1. They are defined relative to a baseline (which in our example is no trade).
  2. They must be ex-post individually rational (so no player regrets participating after knowing all types) and incentive compatible (so players don't want to lie about their types).
  3. They must be a Pareto improvement over the baseline for every type profile (i.e., no one is worse off and at least one type profile is strictly better off).

  The "safe" part means that players do not need to trust each other or a mediator: they can safely participate without revealing their private information beyond what is necessary (because the mechanism is IC and IR).

  Why can't we always find a non-trivial SPI? Because the constraints (IR and IC) might be too tight. In particular, if the baseline is already Pareto efficient (i.e., there is no way to improve without hurting someone in some state), then no SPI exists. Also, even if there are potential gains from trade, the incentive constraints might prevent realizing them without violating the safety conditions.

