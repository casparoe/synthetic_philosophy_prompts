  5. Owen's suggestion to just follow the most convincing view ignores the information from other views, especially when the probabilities are not overwhelmingly in favor of one view. In a close call (e.g., 55% vs 45%), this can lead to disregarding a substantial chance of doing something very wrong. (Score: -1)

