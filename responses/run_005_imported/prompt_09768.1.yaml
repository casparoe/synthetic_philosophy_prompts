  But here's the clincher: Turing's 1948 "Intelligent Machinery" paper explicitly compares the human computer (brain) to discrete state machines. He saw biological information processing as computable. Given that, he'd recognize the ribosome as a physical instantiation of his theoretical tape reader. 

