  so we covered the Judy Benjamin problem in my formal epistemology seminar this week (the soldier dropped in that Red/Blue territory scenario, where she's told that IF she's in Red territory the odds are 3:1 she's in their HQ area, and updating on that somehow shifts her credence on Red-vs-Blue too). Prof called it 'a problem for probability kinematics' but didnt really explain why beyond that, so I looked into it more on my own. From what I can tell it basically just shows that Bayesian conditionalization is inconsistent - she's getting info that's only about the HQ/2nd company split WITHIN red territory, so obviously that shouldn't touch her Red-vs-Blue odds at all, but the math moves them anyway. if conditionalization can break something that basic (not updating on stuff that's irrelevant), why do people still treat it as THE rational updating rule instead of just admitting its broken for whole classes of cases like this?
