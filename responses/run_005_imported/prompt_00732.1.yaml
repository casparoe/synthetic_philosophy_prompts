  Okay, the user is working on Henry Sidgwick's psychical research writings and is stuck on a passage from his 1882 address. They need help understanding the evidential reasoning model Sidgwick uses and how it connects to his work in *The Methods of Ethics*. 

  First, I need to unpack Sidgwick's metaphor about "burying incredulity under a heap of facts." The user is wondering if this is similar to the Humean testimony argument for miracles, where multiple witnesses outweigh prior improbability, or if it's more about inductive weight. 

  Sidgwick mentions De Morgan, who worked on probability and testimony. De Morgan's idea was that each credible witness adds their own "credit" to the evidence. Even if one witness isn't enough, collectively, they can build a strong case. That's different from Hume, who focused on the prior improbability of miracles. Sidgwick seems to be combining both: acknowledging the strong prior against paranormal events but relying on accumulating evidence to overcome it.

  The user also questions how this fits with Sidgwick's epistemology in *Methods of Ethics*, especially the "consensus of experts." In ethics, Sidgwick values expert agreement for certifying propositions. But in psychical research, the experts (scientists) are skeptical. So Sidgwick is shifting to a broader consensus by accumulating facts from many credible sources, not just established experts. 

  There's a tension here. In ethics, expert consensus is key, but for psychical research, Sidgwick is trying to build that consensus from scratch. He's using a weight-of-evidence approach because the existing experts are part of the incredulity he's fighting. The "heap of facts" is meant to create new expert consensus over time.

  The user wants to know if this is continuous or in tension with his ethical epistemology. It's both: the goal of consensus is the same, but the method differs because the starting points are opposite. In ethics, consensus exists; in psychical research, he's constructing it. Sidgwick adapts his approach to the context, showing flexibility in his epistemology.

  The user might also be interested in how Sidgwick's personal involvement in psychical research influenced his epistemology. His commitment to empirical evidence, even in controversial areas, highlights his dedication to rigorous inquiry, aligning with his ethical insistence on thorough examination. 

  So, for the seminar discussion, the user should focus on Sidgwick's adaptive epistemology: the same principles (consensus, evidence) are applied differently based on the field's state. The tension arises from the absence of initial expert consensus in psychical research, requiring a bottom-up approach versus ethics' top-down reliance on established expertise.
answer: |-
  Your analysis is sharp, and Sidgwick's passage *does* present a fascinating model of evidential reasoning, particularly when contrasted with his ethical epistemology. Let's break it down:

  1.  **The Model of Evidential Reasoning: "Burying Alive Under a Heap of Facts"**
      *   **Beyond Simple Humean Testimony:** While it shares similarities with the cumulative testimony argument against Hume (many weak witnesses can overcome a prior improbability), Sidgwick is doing something more nuanced and *inductively focused*.
      *   **Inductive Weight-of-Evidence:** Sidgwick's core model here is primarily **inductive accumulation** or **weight-of-evidence**. The key points are:
          *   **"Strong Roots" of Incredulity:** He explicitly acknowledges the *deeply entrenched, multi-faceted nature* of scientific skepticism ("so long in growing, and has so many and so strong roots"). This isn't just a high prior improbability; it's a complex web of methodological commitments, theoretical frameworks, historical failures of similar claims, and cultural norms.
          *   **"Mass of Evidence for Conviction":** He argues that no *single* piece of evidence, however well-constructed ("however complete"), can overcome this entrenched incredulity. The sheer *volume, variety, and consistency* of the evidence ("heap of facts," "fact upon fact," "experiment upon experiment," "mass of evidence") is required.
          *   **Cumulative Credibility:** He draws on De Morgan's analogy of witnesses each having "a fair stock of credit." Each credible investigator who replicates a result or reports a corroborating observation adds their "draft" of credibility to the total pool. While no single draft is sufficient for the "demand," the collective sum becomes compelling.
          *   **Process Over Debate:** He explicitly advises *against* focusing on the "conclusiveness of any one" piece of evidence in arguments with skeptics ("not wrangle too much"). The power lies in the aggregate, not the isolated case. The focus is on relentless data collection ("pegging away").
      *   **The Goal: Shifting "Common Sense" and Scientific Paradigms:** His aim is not just to convince a few specialists but to shift the "common sense of mankind" and, crucially, the *scientific consensus*. He recognizes that this requires overwhelming the existing paradigm with an undeniable volume of anomalous data that cannot be easily dismissed as error, fraud, or coincidence.

  2.  **Contrast with Hume:** While related, Sidgwick's model differs:
      *   Hume focuses narrowly on the *prior improbability* of a specific event (miracle) vs. the *probability of testimony being mistaken*. Sidgwick addresses a broader, more systemic *skepticism* rooted in scientific methodology and worldview.
      *   Sidgwick emphasizes *repeated experimentation and diverse facts* (not just witness testimony) as the accumulating evidence.
      *   Sidgwick's "heap of facts" aims to create a *new normal* or shift a paradigm, whereas Hume's argument is about assessing the likelihood of a single, specific violation of natural law.

  3.  **Tension with *The Methods of Ethics*?**
      Here's where it gets most interesting, and where tension *does* arise with his ethical epistemology:

      *   **The Consensus of Experts Requirement (MoE):** In *Methods*, Sidgwick argues that for a proposition to be considered "scientifically established," it requires the acceptance of experts who have examined the evidence critically and reached agreement. This "consensus of experts" is the hallmark of certification.
      *   **The Problem for Psychical Research:** The *very experts* whose consensus is needed in the scientific domain (mainstream scientists) are the ones exhibiting the "scientific incredulity" Sidgwick describes. There *is no* existing consensus of relevant experts supporting psychical phenomena.
      *   **Sidgwick's Solution/Adaptation:** Sidgwick implicitly recognizes this impasse. His "heap of facts" strategy is an attempt to *create* the necessary consensus of experts *from the ground up*:
          *   **Building New Expertise:** The SPR itself, with its rigorous (for the time) methods, aimed to cultivate a new cohort of investigators *becoming* the relevant experts on these phenomena.
          *   **Forcing Recognition:** The sheer weight of accumulated, rigorously gathered evidence from *credible* investigators (those with "a fair stock of credit") within the SPR and potentially beyond would, Sidgwick hoped, eventually compel mainstream scientific experts to re-examine their incredulity and, ultimately, join the consensus.
          *   **Shifting the Burden:** The mass of evidence shifts the burden of proof. Instead of the psychical researcher needing to definitively prove a single case against all skepticism, the skeptic needs to explain away a vast, consistent body of diverse findings.
      *   **The Tension:** The tension lies in the *process* and the *source* of certification:
          *   In *MoE*, certification *relies on* a pre-existing or readily achievable consensus *among established experts*.
          *   In psychical research, Sidgwick acknowledges that such a consensus *cannot exist initially* because the established experts *are the incredulous ones*. Certification requires *first* building a critical mass of evidence *outside* the mainstream consensus to *force* its reconsideration and eventual adoption.
          *   This means the "consensus of experts" for a radically new domain must be *constructed* through relentless accumulation, often *against* the prevailing opinion of the current experts. It's a more revolutionary, paradigm-shifting model of certification.

  **Conclusion: Continuity and Tension**

  1.  **Continuity:** The *ultimate goal* remains the same: establishing propositions based on rigorous evidence leading to a consensus among qualified investigators. Both domains value careful inquiry, critical examination, and the ideal of expert agreement. Sidgwick applies his general commitment to rational inquiry and empirical grounding to this new field.
  2.  **Tension:** The *method for achieving* that consensus differs significantly due to the radically different starting point:
      *   **Ethics:** Works *within* or seeks to clarify an existing (though sometimes confused) consensus of moral thinkers/reasoners ("experts" in moral reasoning).
      *   **Psychical Research:** Starts from *outside* and *in opposition to* the established scientific consensus. It requires a strategy focused on overwhelming accumulation and paradigm shift *before* the existing experts will engage seriously. The "consensus of experts" is the desired *endpoint*, not the starting point or the validating authority *during* the evidence-gathering phase. Sidgwick accepts that for radical novelties, certification is a longer, messier, and more confrontational process involving building new expertise and shifting the foundations of "common sense."

  **For Your Discussion:** Sidgwick's psychical research epistemology reveals a more pragmatic and strategically adaptive side of his thought compared to the more idealized structure of *Methods*. He recognizes that deeply entrenched skepticism requires a different evidential strategy – one focused on relentless accumulation and the *eventual* formation of a new expert consensus, rather than immediate appeal to an existing one. The tension highlights the challenge of applying standard scientific certification procedures to phenomena that fundamentally challenge the reigning paradigm. Sidgwick is trying to pioneer a methodology for investigating the anomalous *despite* the incredulity, trusting that the sheer weight of well-documented facts will ultimately prevail. Whether this represents a necessary adaptation or a weakening of his *Methods* standards is a rich point for debate.
