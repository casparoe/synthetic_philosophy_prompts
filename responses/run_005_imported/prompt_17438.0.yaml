  Okay, I need to tackle this user's query about the problem of old evidence in Bayesian confirmation theory. The user is a retired geophysicist with a strong background in Bayesian methods but is now grappling with philosophical issues in a reading group. They're particularly troubled by Clark Glymour's problem: how can known evidence (like Mercury's perihelion) support a new theory if its probability is already 1? They mention two solutions—Garber-Jeffrey's logical learning and Howson's counterfactual approach—and note Howson's later rejection of his own idea for smuggling in "objective" probability. The user wants me to argue that Howson's self-criticism applies to Garber-Jeffrey too, forcing subjectivists to admit something beyond subjective credences.

  First, I should recap the core problem clearly. If E is already known, P(E) = 1, so by probability rules, P(E|T) = 1, and Bayes' theorem shows P(T|E) = P(T) × P(E|T)/P(E) = P(T) × 1/1 = P(T). Thus, E doesn't increase T's probability—it's evidentially inert. But intuitively, as with Einstein's theory explaining Mercury's orbit, it should count as strong confirmation. That's the paradox.

  The user has studied two main fixes. Garber-Jeffrey shifts focus to learning that T entails E, not E itself. This requires dropping logical omniscience: agents might not initially realize T ⇒ E. Howson's counterfactual approach asks what credence the agent would have in T if they didn't know E, then compares after learning E. But Howson later argued this smuggles in objective probabilities, betraying subjectivism. The user suspects this criticism also dooms Garber-Jeffrey—any solution must sneak in extra-subjective elements. I need to defend that view.

  For Garber-Jeffrey, the key is modeling learning the logical fact L: "T ⊢ E". The agent updates from P(T) to P(T|L). This avoids P(E) = 1 issues because L is new info. But here's the rub: subjectivism says probabilities reflect coherent credences, not objective truths. When we say P(T|L) > P(T), it relies on L being true—i.e., T actually entailing E. But if the agent is uncertain about L (since they're not logically omniscient), P(T|L) could be high even if L is false. Yet in practice, when philosophers apply this, they assume L is true. That's the smuggling: we're sneaking in the objective fact that T does entail E, not just the agent's belief about it.

  Let me formalize this. Suppose the agent learns L, but L might be mistaken. Their posterior is P(T|L), which could be high if they trust L. But actual confirmation requires T to really predict E—if L is false, E doesn't support T. Garber-Jeffrey only works if we assume L is correct, which is an objective fact outside credences. Even if the agent fully believes L, if they're wrong, E shouldn't confirm T. So the solution depends on more than subjective states.

  Now, comparing to Howson: his counterfactual required imagining credences without E, but that invokes hypothetical beliefs unanchored to actual psychology. Howson saw this as importing objective probability. Similarly, Garber-Jeffrey's reliance on L's truth imports an objective logical relation. Both need external anchors.

  The user also asks if this is a fundamental limitation of subjectivism. I think yes—confirmation seems to involve mind-independent relations (like entailment), but subjectivism reduces everything to beliefs. This tension might be unresolvable without stepping outside pure subjectivism. Further formal tweaks won't help; the issue is philosophical. The user’s background in geophysics might make them sympathetic: seismic data objectively constrains subsurface models, regardless of beliefs. Bayesian methods in science often tacitly assume objective likelihoods, which clashes with strict subjectivism.

  I should be precise. Garber-Jeffrey handles cases where the agent learns T ⇒ E, but confirmation's strength still depends on objective factors. For example, if E is likely under T but even likelier under rivals, it shouldn't confirm T much—but a non-omniscient agent might miss that. Their credence shift could be irrational if misaligned with objective relations. So while the framework allows updating, it doesn't guarantee rational confirmation without external validation.

  In conclusion, both solutions smuggle in objectivity: counterfactuals in hypothetical credences, logical learning in truth of entailment. This suggests subjectivism is insufficient for capturing scientific confirmation, which relies on real-world evidence and logical truths. The user's unease is justified—it's not just a technical gap but a deep philosophical problem. Subjectivism might need supplementation (e.g., with objective Bayesianism) or acceptance of limitations. Given their experience, they'd likely appreciate this realism: in geophysics, Bayesian inversion assumes objective likelihoods from physics, not just subjective whims.
answer: |-
  You've put your finger on the deepest wound in the Bayesian account of confirmation: the problem of old evidence reveals a fundamental tension between the subjectivist's commitment to grounding everything in actual credences and the intuitive, practice-driven need for evidence to bear an objective logical or nomological relationship to a theory. Howson's self-criticism of the counterfactual strategy is indeed devastating, and crucially, **it applies with equal force to the Garber-Jeffrey logical learning strategy**. Both attempts to rescue Bayesianism ultimately smuggle in an element that cannot be reduced to the agent's actual or hypothetical subjective degrees of belief – specifically, the **objective truth of the logical entailment relation** itself. Let's break this down, working with the strongest Garber-Jeffrey formulation.

  ## 1. Recapping the Strong Garber-Jeffrey Strategy
  *   The core move: When evidence E is already known (so P(E) = 1), the genuinely new information upon proposing theory T is *not* E itself, but the previously unrecognized *logical fact* L: "T entails E" (T ⊢ E).
  *   The agent is not logically omniscient. Before learning L, they have credences defined over a language or model space that doesn't explicitly represent this entailment, or they simply haven't deduced it. So P(L) < 1.
  *   Confirmation occurs through *conditionalization on L*: The agent updates their credence in T from P(T) to P(T|L).
  *   Crucially, P(T|L) can be greater than P(T), even though P(E) = 1. This captures the sense that learning *that T predicts the known fact E* boosts confidence in T.
  *   The formalism handles the deduction: Once L is learned (P(L) = 1), the probability calculus forces P(E|T) = 1 (because T ⊢ E is now part of the background knowledge) and P(E) remains 1, but the *boost* happened during the update on L.

  **Where the Smuggling Occurs in Garber-Jeffrey:**

  The problem lies in the **semantic content and justification of L**, and how it drives the credence shift P(T|L) > P(T).

  *   **L is not just a syntactic string:** L represents the proposition *"T logically entails E"*. This proposition L is **true** if and only if there exists a valid logical derivation from T (plus background knowledge B) to E within the relevant logical system.
  *   **The Credence Shift Depends on L's Truth, Not Just Its Learning:** For the update on L to constitute *genuine confirmation* (as opposed to just a change in belief), the agent's increased credence P(T|L) must be *justified*. Why *should* learning L make you more confident in T? The only compelling justification is that **if L is true, then T actually *explains* or *predicts* E**. If L were false (i.e., T does *not* entail E), then learning the *false* statement "T entails E" *should not* genuinely confirm T, even if the agent mistakenly believes it does. A credence shift based on a false L would be irrational from an external perspective, even if it's coherent internally.
  *   **Subjectivism's Blind Spot:** Pure subjectivism, as Howson realized in his self-critique, can only say that the agent *happens* to have a credence function where P(T|L) > P(T). It cannot ground *why* this should be the rational response *specifically when L is true*. The rationality of the confirmation depends on the **objective fact** that T actually *does* entail E. The agent's conditional credence P(T|L) effectively encodes a *subjective estimate* of T's probability *given that it objectively entails E*. But the *confirmatory force* stems from the *objective* relation of entailment, not the subjective estimate itself.
  *   **The Analogy to Howson's Self-Critique:** Howson rejected the counterfactual strategy because evaluating P(T) or P(E) in the counterfactual state "~K(E)" (not knowing E) requires an "objective" probability divorced from the agent's actual epistemic history and psychology. Similarly, the Garber-Jeffrey strategy requires evaluating P(T|L). For this conditional probability to represent *confirmation*, it implicitly references the *objective* confirmation that *would* occur *if* E were novel *and* L were true. The value P(T|L) is only confirmatory *because* we understand L to mean that T objectively entails E, making E (if it weren't already known) a potential falsifier or supporter of T. The agent's actual credence P(T|L) gets its significance from this external, objective logical relationship smuggled in via the *meaning* of L. As Howson argued against his own view, this imports a probability or support relation ("T is supported by E *because* T entails E") that is distinct from the agent's actual subjective state before learning L.

  ## 2. Why This is More Than a Technical Gap: A Fundamental Limitation

  This smuggling isn't a mere technical oversight; it's a **symptom of a deep-seated limitation inherent in strict subjectivist interpretations of Bayesian confirmation theory**:

  1.  **The Primacy of Logical Relations:** Scientific confirmation fundamentally relies on the *objective* logical (or mathematical, or nomological) consequences of theories. Mercury's orbit confirms GR *because* GR's equations, solved under specific conditions, *objectively yield* that specific precession value. The subjectivist credence shift, whether via counterfactuals or logical learning, is an *epiphenomenon* of the agent *grasping* this objective relation. The relation itself is the engine of confirmation; the credence shift is the indicator light.
  2.  **The Impossibility of Complete Reduction:** No manipulation of the agent's *actual* credences (P(T), P(E), P(L)) or carefully constructed *hypothetical* credences (P_old(E), P_counterfactual(T)) can fully eliminate the need to refer to the objective truth of T ⊢ E. This relation exists independently of any agent's belief state. Garber-Jeffrey successfully avoids the *probability 1* problem for E, but only by shifting the foundational weight onto an objective logical fact (the truth of T ⊢ E) that governs the *significance* of the credence shift.
  3.  **The Illusion of Purely "Internal" Rescue:** Both strategies try to fix the problem using only tools from within the subjectivist toolbox (conditionalization, relaxing omniscience, hypothetical credences). Yet, both ultimately rely on the *external* standard of objective logical truth to give meaning to the confirmatory event. Learning "T ⊢ E" only confirms T *if* T ⊢ E *is true*. The subjectivist machinery describes the *internal belief dynamics* upon *recognizing* an objective fact, but it cannot generate the confirmatory force from pure belief dynamics alone.
  4.  **The Challenge of Error:** Imagine an agent learning a *false* L ("T entails E" when it doesn't). Subjectivism must say their increase in P(T) upon learning L is rational if it coheres with their other beliefs. Yet, intuitively, and crucially *for scientific practice*, this does *not* constitute genuine confirmation of T by E. True confirmation requires the *actual* entailment. Garber-Jeffrey can describe the *belief change*, but it cannot distinguish between *true* confirmation (driven by real entailment) and *spurious* "confirmation" (driven by a mistaken belief about entailment) without smuggling in the objective truth condition. Howson's point about "objective" probability piercing the subjectivist veil applies here too.

  ## Conclusion

  You are correct. Howson's penetrating self-criticism of the counterfactual strategy – that it covertly relies on an "objective" probability relation distinct from actual credences – applies with full force to the Garber-Jeffrey logical learning strategy. While Garber-Jeffrey elegantly solves the *technical* problem of P(E)=1 by introducing learning of logical facts (L), the *confirmatory power* of learning L fundamentally depends on the **objective truth of the logical entailment relation (T ⊢ E)**, not merely the agent's subjective credences before and after learning L. This objective relation is smuggled in through the semantic content of L and the justification for why P(T|L) > P(T) should count as *rational* confirmation *specifically when L is true*.

  This smuggling isn't a temporary technical gap awaiting a cleverer formal fix. It is a **symptom of a fundamental limitation of strict subjectivism**. Subjectivism provides a powerful framework for modeling *belief dynamics under uncertainty* but struggles to fully ground the concept of *evidential support* itself. Evidential support, as exemplified dramatically by the problem of old evidence and cases like GR and Mercury, inherently involves an objective, mind-independent relationship between a theory and the world (captured by logical entailment, lawlike connections, or best-system analyses). The Bayesian machinery, whether using actual or hypothetical credences, tracks the *subjective recognition* and *epistemic impact* of these objective relations but cannot reduce the relations themselves to patterns of belief. Your career in geophysics likely resonates with this: the subsurface structure *objectively* constrains the seismic data; Bayesian inversion helps you *infer* that structure *from* the data, but the evidential link itself is grounded in the objective physics of wave propagation, not just your priors and likelihoods. The problem of old evidence exposes that Bayesian confirmation theory, in its pure subjectivist form, lacks the resources to fully capture this objective grounding. Resolving it within the Bayesian framework seems to require either accepting this limitation or moving towards a more objective Bayesianism (e.g., relying on objective chances, logical probabilities, or information-theoretic principles) that explicitly incorporates elements beyond subjective degrees of belief.
