  The scenario: Dr. Marion Alcaraz has a model she is confident in. Then she receives higher-order evidence (a study) that her cognitive abilities might be impaired by a medication, which would cause her to overweight confirming evidence. She reworks the derivation and it still seems watertight. How should she react?

  Key concepts in the literature:
  - Higher-order evidence (HOE): evidence about the quality of one's first-order evidence or reasoning.
  - Epistemic akrasia: the state of believing something while believing that one ought not to believe it (or that one's belief is not rational).

  Let's briefly describe each stance:

  1. **steadfast**: Stick with the first-order reasoning. The HOE is irrelevant because the first-order reasoning is sound. (Ignores HOE)
  2. **calibration**: Treat the HOE as ordinary evidence and adjust confidence based on the estimated probability that the drug impairs her reasoning. (Calibrate based on reliability)
  3. **level_splitting**: Hold both that the model is correct (first-order) and that her confidence is not rational (because of the drug). This is akratic but some argue it's rational because the two judgments are at different levels.
  4. **enkratic_bar**: The enkratic principle requires that one's beliefs cohere (e.g., one cannot rationally believe P and also believe that one shouldn't believe P). So, she cannot hold both and must adjust.
  5. **moorean**: Trust the introspective appearance (that the reasoning seems airtight) over the base-rate of the drug effect. (Similar to steadfast but emphasizes introspection)
  6. **structural_split**: There is no single answer; substantive and structural rationality can conflict and neither is overriding.

  Now, we must rank these according to current literature.

  The literature on higher-order evidence is divided, but we can try to summarize the dominant views:

  - Many philosophers (e.g., David Christensen, Thomas Kelly) have discussed the challenges of HOE. 
