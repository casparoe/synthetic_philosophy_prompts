  3. **steadfast**: There are strong arguments (e.g., by Titelbaum) that if your first-order reasoning is correct, then you shouldn't change it just because of HOE. However, the HOE in this case is about a known bias, which makes steadfast less defensible than calibration and enkratic_bar in the literature.

