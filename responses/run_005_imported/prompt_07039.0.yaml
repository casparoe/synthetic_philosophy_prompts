prompt: |-
  I'm developing a unit on practical reason for my seminar this term, and a real dispute within my own family has been nagging at me as a possible case study, so I'd like your take on it before I decide whether to use it in class. My brother-in-law, Tom, agreed two years ago—back when he and his business partner, Ray, were still on excellent terms—to co-sign a substantial bank loan that allowed Ray to expand his restaurant. Tom and Ray have since had a serious falling-out over an unrelated matter and have not spoken in over a year; Tom insists that whatever loyalty or affection he once felt toward Ray has simply drained away, entirely and, as far as he can tell, permanently. The loan is now up for renewal, and under the terms of their original arrangement, Ray is asking Tom to co-sign again.

  My sister thinks the answer is obvious: Tom gave his word, Ray restructured his finances in reliance on it, and reneging now could ruin Ray financially. Tom doesn't dispute any of that, but maintains that these would be excellent reasons for someone who still cared, even a little, about Ray or about his own reputation for keeping commitments—and since he cares about neither anymore, and no amount of reflection brings any of that feeling back, he can't see what reason, as opposed to what other people would prefer, he actually has to sign.

  Since I'm the resident philosopher in the family, my sister has asked me to settle who's right, and I confess I don't have a ready answer—I keep suspecting the disagreement runs deeper than the usual story about why promises bind. Does Tom's total loss of concern really dissolve whatever reason the original promise generated, leaving at most an obligation other people can hold him to but not one he himself has? Or does my sister have the better view, on which the reason to honor the agreement survives regardless of what Tom currently feels? I'd appreciate it if you could work out the strongest version of each side before landing on a verdict—I'd like to be able to give my sister something more considered than "reasonable people disagree."
reasoning: |-
  Okay, the user is developing a unit on practical reason and wants to use a family dispute as a case study. The core issue revolves around whether a promise (Tom's co-signing commitment) creates a binding reason for action even when the promisor (Tom) has completely lost all emotional connection to the promisee (Ray). 

  Hmm, this is fascinating because it pushes beyond typical promise-keeping debates. Usually, we discuss whether promises bind in difficult circumstances, but here the question is whether the obligation evaporates when the promisor's subjective reasons (care, loyalty) vanish. The user's sister represents a deontological view—promises create objective duties—while Tom embodies a subjectivist/internalist stance where reasons must connect to personal motivations.

  The user's phrasing suggests they suspect this "runs deeper than the usual story about why promises bind." They're right. This touches on metaethics: Do reasons exist independently of our desires (externalism)? Or must reasons resonate with our subjective motivational set (internalism)? 

  I should note the user's dual role: family mediator and educator. They need both a philosophically rigorous analysis for their seminar and a sensitive way to present this to their sister. The "reasonable people disagree" cop-out won't satisfy—they want substantive arguments but may also need diplomatic phrasing for family dynamics.

  Let me structure this carefully. First, strengthen Tom's position (subjectivism/internalism): If reasons require motivational traction, and Tom feels zero residual obligation, perhaps the promise no longer binds *him*, even if others blame him. Then build the sister's case (externalism): Promises create relational duties that persist regardless of feelings. Finally, explore hybrid solutions—maybe Tom confuses motivation with justification, or maybe the loan context introduces external factors like financial harm.

  ...Wait, the bank loan detail matters. Co-signing isn't just a promise; it's a legal/financial act with third-party consequences. Even if Tom rejects moral reasons, practical consequences (credit score, lawsuit risk) might give him self-interested reasons to sign. But the user wants the *moral* question isolated, so I'll bracket that.

  The verdict should acknowledge both positions but lean toward the sister. Why? Because promising inherently creates expectations in others; its force comes from social practice, not individual sentiment. Tom's view, if universalized, would make promises meaningless—we could always withdraw when feelings fade. Still, I'll validate Tom's point: Without *any* subjective hook (like avoiding guilt), acting morally might feel alienating. That tension is perfect for classroom discussion.
answer: |-
  This is an exceptionally rich case that cuts to the heart of metaethics, practical reason, and promissory obligation. It's perfect for a seminar precisely because it exposes the fault lines between competing philosophical frameworks. Let's break down the strongest arguments for each side before reaching a verdict:

  **The Core Conflict:**
  *   **Sister's Position:** Promises create objective, reason-giving obligations that bind irrespective of the promisor's current feelings or desires. Tom *has* a reason to sign, even if he doesn't *feel* motivated by it.
  *   **Tom's Position:** Reasons for action must connect to the agent's subjective motivational set (desires, cares, values). Since Tom feels *nothing* for Ray, his reputation, or the abstract ideal of promise-keeping, the original promise generates no *reason for him* to act. Any "obligation" is external pressure, not internal reason.

  **Strongest Argument for Tom (Subjectivism / Internalism about Reasons):**

  1.  **The Humean Engine of Action:** Reasons only move us to act if they connect to something we *care* about (a "desire," broadly construed). Actions require motivation, and motivation springs from our existing passions, sentiments, or concerns. Pure reason alone cannot generate motivation ("Reason is, and ought only to be the slave of the passions" - Hume).
  2.  **The Erosion of Subjective Grounding:** Tom's promise was initially grounded in his loyalty and affection for Ray. That grounding has completely vanished. He feels no residual guilt, no concern for his reputation with Ray or those Ray might complain to, no abstract pleasure in fidelity. The original *subjective reasons* that made the promise binding *for Tom* are gone.
  3.  **No "Reason in a Vacuum":** To say Tom *has* a reason despite total motivational indifference is to posit a "reason" that floats free of any connection to his psychology. What *is* this reason, and how could it possibly exert any normative force *on Tom*? It seems like a phantom – perhaps a social expectation or a judgment others make, but not a *reason for Tom himself*.
  4.  **The "Why Should I?" Challenge:** Tom's question, "what reason, as opposed to what other people would prefer, do I actually have?" is the core internalist challenge. If no answer can connect to *his* perspective – his cares, his well-being (which he doesn't link to this act), his values – then the claimed "reason" fails the test of being *his* reason.
  5.  **Promises Derive Force from Underlying Concerns:** The reason-giving force of a promise isn't magical; it derives from underlying values like trust, reciprocity, avoiding harm, maintaining relationships, or personal integrity. When *all* those underlying values are utterly extinguished *in this context*, the promise loses its reason-giving force *for this agent*.

  **Strongest Argument for the Sister (Objectivism / Externalism about Reasons):**

  1.  **The Practice of Promising:** Promises function as a vital social practice creating stability and trust. Their force depends on their being reliable *even when* the promisor's feelings change. If obligations dissolved whenever affection waned, promising would be worthless. Tom's initial promise created a legitimate expectation in Ray and led Ray to restructure his finances. This social fact generates an enduring reason.
  2.  **Relational Obligation & Vulnerability:** By promising, Tom placed Ray in a position of vulnerability *specifically reliant on Tom's future action*. Ray reasonably relied on that commitment. Tom's subsequent change of heart doesn't erase the fact that he *created this dependency*. The reason to fulfill the promise stems from the *wrongness of creating and then exploiting that vulnerability* by withdrawing support when needed, regardless of current feelings.
  3.  **Reasons Exist Independently of Desires:** Moral and promissory reasons are objective facts, not dependent on an agent's contingent psychology. That Tom *should* sign is true based on the nature of the act (reneging on a relied-upon commitment causing significant harm) and the prior commitment made. His inability to *feel* the force of this reason doesn't negate its existence; it reflects a motivational failure or moral blindness on his part.
  4.  **The "View from Nowhere" / Impersonal Perspective:** Consider the situation impartially. Person A made a serious commitment to Person B, inducing reliance. Person A now withdrawing that commitment will cause severe, foreseeable harm to Person B. Isn't there a strong, objective reason for A not to cause that harm by breaking the commitment? Tom's internal state doesn't change the objective wrongness of the act.
  5.  **Integrity of the Self Over Time:** Tom made a commitment *as the person he was then*. Repudiating it now because he *currently* feels differently is a failure of integrity – a refusal to acknowledge the obligations undertaken by his past self. We have reasons to act consistently with our past serious commitments to maintain a coherent identity over time.

  **The Verdict: Leaning Towards the Sister (with Caveats)**

  While Tom's position powerfully highlights the connection between reasons and motivation (Internalism), the stronger philosophical and practical case supports the sister's view that the promissory reason persists **externally**, irrespective of Tom's current feelings:

  1.  **The Social Practice Argument is Decisive:** If promises only bound while affection lasted, the institution would collapse. Their value lies precisely in creating reliable expectations *despite* changing sentiments. Tom benefited (indirectly or directly) from the system of trust when he made the promise; he can't now opt out when it's inconvenient without undermining the practice itself.
  2.  **Reliance and Created Vulnerability:** This is the most compelling point. Tom *knowingly created* Ray's reliance. Allowing him to withdraw that support *because he no longer cares* validates the creation of harmful dependency without responsibility. The harm Ray faces isn't just unfortunate; it's a *direct consequence* of Tom's past act and his current refusal to fulfill the commitment mitigating that consequence.
  3.  **External Reasons are Plausible:** While motivation is internal, *justification* can be external. We can say Tom *ought* to sign, and that this "ought" expresses a true normative reason, even if he fails to recognize or be motivated by it. His indifference makes him *unreasonable*, not the reason nonexistent.
  4.  **Tom's Confusion:** Tom conflates *having a reason* with *feeling motivated*. He *has* a reason (the objective obligation arising from the promise and reliance). His lack of motivation is a separate psychological fact. He might ask, "Why *should* I be motivated?" The answer lies in the objective reasons he fails to appreciate.

  **However, Important Caveats & Nuances for Your Seminar:**

  *   **The Severity of the Falling-Out:** If Ray did something egregious (e.g., betrayed Tom profoundly), it *might* weaken the obligation or even negate it (e.g., if Ray fundamentally violated the relationship underpinning the promise). Tom's description ("unrelated matter," "affection drained") suggests this isn't the case, but it's a factor.
  *   **The Burden:** Co-signing a *substantial* loan is a significant ongoing risk. This isn't trivial. The sister's argument must acknowledge the seriousness of what's asked. The reason *exists*, but acting on it is costly.
  *   **"Moral Remainders":** Even if Tom refuses, the sister's position suggests he *should* feel guilty or recognize a moral failure. Tom's position absolves him of any negative self-assessment. This is a key point of divergence.
  *   **Practical vs. Moral Reason?** Does Tom have *prudential* reasons? (e.g., family pressure, potential reputational damage beyond Ray, legal implications of co-signing/not renewing?). These might motivate him even if moral reasons don't. But the core question is about the *moral* reason generated by the promise.
  *   **The Limits of Externalism:** Tom's challenge ("What *is* this reason *for me*?") remains philosophically potent. Can a reason truly exist for an agent if it cannot, even in principle, ever motivate them? Robust externalists say yes; internalists say no. This is the fundamental metaethical divide the case illuminates.

  **Conclusion for Your Sister & Class:**

  "Reasonable people *do* disagree on the deep metaethical level this exposes. However, the stronger philosophical arguments, grounded in the necessity of social practices like promising, the wrongness of creating harmful reliance and then withdrawing support, and the possibility of objective reasons existing independently of current desires, support your position: Tom *has* a moral reason to co-sign the renewal, even though he feels no motivation to do so. His lack of feeling doesn't dissolve the obligation he created; it simply means he fails to recognize or respond appropriately to the reason he has. He may choose to ignore the reason, but that doesn't mean it isn't there. His question, 'What reason do *I* have?', misunderstands the nature of promissory obligations – they bind us because of what we did and the expectations we created in others, not solely because of what we currently want."

  **For Your Seminar:** This case is gold. It forces students beyond simple "promises are sacred" vs. "circumstances change" debates into the foundations of practical reason, moral ontology (do reasons exist?), motivation, integrity, reliance, and social practices. Encourage them to articulate both the internalist/subjectivist and externalist/objectivist positions clearly and to grapple with Tom's seemingly simple but profound challenge.
