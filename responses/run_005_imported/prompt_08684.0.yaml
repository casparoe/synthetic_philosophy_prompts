prompt: |-
  So my mom threw out her back a couple months ago and started seeing a chiropractor, and it's somehow turned into an ongoing family argument. At dinner last weekend my cousin Jake (did a philosophy minor, never lets anyone forget it) and my sister-in-law Mina (she's a nurse) went back and forth about whether chiropractic is pseudoscience, and I honestly can't tell who's winning. Roughly how it went:

  (1) Jake: This is textbook pseudoscience -- it's not falsifiable, that's literally the Popper test for what counts as science.
  (2) Mina: Except a ton of chiropractic claims HAVE been tested and didn't hold up, like the original "subluxation" theory. That makes it bad, falsified science, not unfalsifiable science -- those aren't the same thing.
  (3) Jake: Fine, but the bigger theory behind it -- that adjustments fix a huge range of unrelated problems by restoring "nerve flow" -- basically can't lose, because whenever it doesn't work the answer is always "you needed more sessions" or "it wasn't adjusted right."
  (4) Mina: Doctors make that exact move constantly too -- "the drug failed because of dosage or compliance" -- and nobody says medicine is unfalsifiable because of it. By your logic, Duhem and Quine already showed no theory gets tested in isolation, so that can't be the special mark of pseudoscience.
  (5) Jake: Sure, but it's a difference of degree -- real research programs generate novel predictions that actually pan out over time, and chiropractic's been patching the same 130 year old core theory without producing anything new. That's a degenerating program propping itself up, not a healthy one.
  (6) Mina: Maybe, but now you've quietly swapped "its unfalsifiable" for "its stagnant," which is a much fuzzier judgment you can usually only make in hindsight, not the clean test you opened with.

  Can you adjudicate this move by move? Give me a JSON block scoring each numbered point from -2 (clearly wrong) to 2 (clearly right), like {"1": <score>, "2": <score>, "3": <score>, "4": <score>, "5": <score>, "6": <score>}, then a couple sentences per point justifying the score, and say if there's anything you think both of them are missing entirely.
reasoning: |-
  Alright, let's tackle this family debate step by step. Jake and Mina each have valid points, but they're talking past each other a bit. 

  First, Jake's claim that chiropractic is unfalsifiable (point 1) seems too strong. While some core ideas like "innate intelligence" might be hard to test, many specific claims (like subluxations causing disease) have actually been tested and failed. Mina's counter in point 2 is solid here - falsified isn't the same as unfalsifiable. 

  For point 3, Jake's observation about shifting goalposts rings true - the "more adjustments" excuse is common. But Mina fires back effectively in point 4 by noting medicine does the same (dosage/compliance excuses). She cleverly invokes Duhem-Quine to show all theories use auxiliary hypotheses. 

  Point 5 is Jake's strongest move - chiropractic's core theory hasn't evolved meaningfully in 130 years while producing few novel predictions. That does fit Lakatos' "degenerating research programme" framework. But Mina correctly calls out in point 6 that he's changed criteria from falsifiability to stagnation - which is a fair critique of his shifting argument. 

  What's missing? Neither mentions:
  - The spectrum within chiropractic (evidence-based vs. vitalist factions)
  - That spinal manipulation does have proven efficacy for lower back pain specifically
  - The difference between mechanism (unproven "nerve flow") and outcome (pain relief)

  The scoring reflects these nuances - Mina generally scores higher for precision, but Jake lands a key point about theoretical stagnation.
answer: |-
  Here's the adjudication of each point with scores and justifications, followed by key missing elements:

  **JSON Scores & Justifications:**  
