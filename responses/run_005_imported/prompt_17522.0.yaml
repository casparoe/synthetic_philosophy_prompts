answer: |-
  The fluorescent hum of the neurology clinic felt thinner than usual to Dr. Aris Thorne. He scanned the chart again: *Silas Vance. 42. Cotard’s Syndrome. Primary delusion: "I am not alive. My body is an echo."* Standard protocols noted: antidepressant trials, antipsychotics, neuroimaging inconclusive. But the intake nurse’s scribble caught him: *"Patient unusually calm. States his 'condition' isn't illness, but 'seeing the riverbed shift.'"*

  Thorne pushed into the consultation room. Silas Vance sat upright in the chair, not slumped. His eyes weren’t vacant, but focused with an unnerving clarity on the window, watching pigeons bicker on the ledge. He turned as Thorne entered, offering a small, bleak smile that didn’t touch his eyes.

  "Dr. Thorne," Silas said, his voice steady, almost conversational. "Thank you for seeing the echo."

  Thorne sat, deliberately placing his pen on the desk. A grounding ritual. "Mr. Vance. Silas. How are you feeling today?"

  "Feeling?" Silas tilted his head, a birdlike gesture. "An interesting word. Like asking water how it feels about the riverbed. The water *is*. The riverbed *holds*. Until it doesn't." He looked down at his own hands, resting on his knees. "My hands... they move. I see them move. I tell them to pick up that pen." He nodded towards Thorne’s. "They do it. But the *doing*... it's like watching a recording. There's no... *foundation* beneath the action anymore. The 'I' that should be *behind* the telling, the moving... it's absent. Rotted out."

  Thorne resisted the urge to reach for his pen. "You believe you are dead?"

  Silas sighed, a soft exhalation devoid of frustration. "Belief requires grounds, Doctor. Evidence. Like... 'This is water'." He tapped the plastic cup on the desk beside him. "You see it, you drink it, it quenches thirst. Grounds enough. But what grounds *that*? What grounds the seeing, the drinking, the quenching? You don't *believe* water is water. You *act* with it. It *stands fast*." He used the phrase deliberately, like a term from a foreign text. "It’s the hinge everything else swings on. 'I am alive'... that was my hinge. Now?" He spread his hands, a gesture encompassing the room, himself. "The hinge is gone. The door hangs loose. Nothing swings true."

  Thorne felt a familiar professional frustration, but laced with a new, colder thread. This wasn't the agitated denial or florid hallucinations of typical psychosis. Silas wasn't arguing *against* evidence; he was describing the collapse of the framework that *made* evidence evidence. *Giving grounds has to come to an end somewhere,* Thorne recalled, a line surfacing from his own long-ago philosophy elective, Wittgenstein’s *On Certainty*, dredged up by the nurse’s note. *And the end isn't an ungrounded presupposition: it is an ungrounded way of acting.*

  He tried a standard probe. "Silas, look at your hand. Touch your face. What do you feel?"

  Silas obediently raised his right hand, pressed fingertips to his cheek. "Pressure. Coolness. Nerve signals firing. Data." His voice remained flat. "But the 'me' feeling it? The 'me' *owning* this face, this hand? That certainty... it's not there. It's not *wrong*, like mistaking salt for sugar. It's that the whole kitchen... the very possibility of tasting... has vanished. The riverbed has shifted. The water flows, but over nothing familiar. It finds new channels, meaningless ones."

  Thorne pushed. "But you speak. You reason. You came here."

  "Does the river *choose* to flow?" Silas asked. "Does the recording *decide* to play? Actions happen. Words are formed. But the conviction... the *world-having* that should be underneath... it's silt now. Washed away." He looked directly at Thorne, his gaze unsettlingly lucid. "You think you're treating a delusion, Doctor. A faulty belief. But this isn't about a *fact* being doubted. It's the ground for doubt itself crumbling. How can you doubt 'I exist' when the 'I' required to *do* the doubting is the very thing in question? It’s not a proposition I disbelieve. It’s a hinge that no longer holds the door of my world."

  A silence stretched, filled only by the fluorescent buzz. Thorne looked at his pen. *This is a pen.* The certainty hit him with physical force. He didn't deduce it, didn't justify it. He *used* it. It *stood fast*. It was part of the bedrock of his actions, his diagnoses, his life. The horror of Silas’s condition wasn't just the content of the delusion, but its *nature*. It wasn't a mistake *on* the map; it was the annihilation of the territory the map described. Silas wasn't lost *in* the world; the world, *his* world, the one built on those silent, action-anchoring hinges, had dissolved.

  He tried one last thing, grasping for the empirical. "The brain scan, Silas. It shows activity. Electrical impulses. Blood flow. That's life."

  Silas nodded slowly. "A recording of activity, Doctor. Like the sound of water flowing over stones. But the riverbed... *is it still there?*" He touched his chest, not over his heart, but lower, as if indicating a void. "The scan shows the water. It doesn't show the bed beneath. How could it? The bed isn't *in* the water. It’s what the water *moves over*." He leaned forward slightly. "Where is your proof, Dr. Thorne, that *you* are alive? Not the heartbeat, the breath... but the *certainty* behind them? Can you point to it? Or do you just... *act*?"

  Thorne had no answer. The pen on his desk seemed suddenly alien, a small, hard object whose existence he could no longer simply *assume*, but had to, impossibly, prove to himself. The solidity of the chair beneath him felt less like a given and more like a temporary agreement with reality. Silas’s calm, reasoned description wasn't a symptom to be fixed; it was a terrifying glimpse into an abyss where the most fundamental hinges had sheared off. The riverbed *had* shifted. Silas wasn't drowning in the turbulent water of madness; he was standing on the exposed, shattered bedrock, watching the once-familiar current flow away into a meaningless sea.

  Silas stood up, his movement smooth, unhurried. "Thank you for your time, Doctor. I know you act according to your riverbed. Your hinges hold." He offered that bleak smile again. "Mine are silt now. The water... it just finds its level."

  He walked out, leaving Thorne alone in the humming room. The doctor didn't reach for his pen. He stared at his own hand, flexing the fingers. *I move it. I feel it.* But the words echoed hollowly. The unshakeable certainty, the hinge that had always just *stood fast*, felt suddenly... *noticed*. And anything noticed, Thorne realized with a chill that had nothing to do with the clinic's air conditioning, could, perhaps, be questioned. He picked up the pen. It felt heavy. Unreal. He wrote a single word on the pad: *Hinge?*

  The ink flowed. The paper held. But the bedrock beneath the action felt, for the first time, perilously soft.
