  First, I need to recall the Hart-Fuller debate. Hart argued for the separation of law and morality, suggesting that laws can be valid even if immoral. Fuller, on the other hand, believed that laws must meet certain procedural moral standards to be considered valid. The grudge informer case is a classic example used in this debate, where a woman denounced her husband under Nazi law, and post-war courts had to decide her guilt.

  Looking at Marcus's first point: he supports Fuller's view that the Nazi legal system degraded so much that the anti-Hitler statute wasn't valid law. Therefore, punishing the wife didn't require retroactivity. Naomi counters that this proves too much because other Nazi laws, like traffic or contract laws, were still valid. She argues that Fuller needs to explain why this specific statute fails, not just point to systemic issues. This touches on whether Fuller's criteria can apply to individual statutes without collapsing into Hart's separation.

  Marcus responds that Fuller's test is a matter of degree and can target single enactments. The anti-Hitler statute was substantively evil and used as a tool of terror, unlike traffic laws. Naomi then points out that this is just relabeling Hart's point—making a moral judgment openly via retroactive law rather than through validity. She adds the historical wrinkle that the actual court didn't invalidate the statute but convicted on narrower grounds. Marcus dismisses this as irrelevant to the theoretical debate.

  The user's main questions are: who has the better argument at each step, and does the historical accuracy of the case affect the theories? They also want to know if both sides are missing something. 

