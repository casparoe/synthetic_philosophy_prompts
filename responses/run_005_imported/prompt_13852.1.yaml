prompt: |-
  So this might be kind of a heavy thing to ask but I've been stuck on it for weeks. My grandpa passed away back in September and ever since then I keep lying awake some nights kind of spiraling about the fact that someday I'm just not going to exist anymore. I brought it up to my friend (hes really into those philosophy podcasts) and he gave me this whole spiel about how being dead can't actually be bad for me, because once I'm dead there's no "me" left for it to be bad for, so being scared of it doesn't even make logical sense, kind of like being scared of a triangle having four sides. It helped for like a day and then stopped making sense to me again.

  Heres the thing I can't get past though: I also didn't exist for something like 13 billion years before I was born, and that nonexistence doesn't bother me even a little, I never lie awake sad about all the stuff that happened in history before I got to be alive for it. So if not-existing-before-birth and not-existing-after-death are both just "nothing happening to nobody," why does my brain treat them so differently? I asked my friend about this and he just said "its different because ones in the future" without really explaining why that matters. Is there an actual answer for why those two nonexistences aren't equivalent, or did I just stumble onto a hole in his argument that nobody's actually patched? Id rather not just hear the "you won't be around to feel it" line again since that's the exact part I'm questioning.
