answer: |-
  You've touched on one of the deepest paradoxes of human consciousness – and your intuition is spot-on. The asymmetry between our indifference to pre-birth nonexistence and our dread of post-death nonexistence is a well-known philosophical puzzle called the **Asymmetry Problem** (or Lucretius' Symmetry Argument). Your friend's "it's different because it's in the future" answer is insufficient. Here's why the two "nothings" feel fundamentally different, even if they're logically similar:

  ### Core Reasons for the Asymmetry
  1.  **The Direction of Time & Psychological Ownership:**
      *   **Pre-Birth:** You emerged *from* nothingness *into* existence. Your conscious self only began at birth, so there's no "you" to mourn the absence of what came before. It feels like a neutral starting point.
      *   **Post-Death:** You exist *now*, fully immersed in life, relationships, experiences, and self-awareness. Death represents the *forcible removal* of everything you currently possess and value. You're facing the *loss* of your entire subjective world from your current perspective of having it. This anticipation of loss triggers fear.

  2.  **The Experience of Continuity & Projection:**
      *   **Pre-Birth:** There's no continuity to break. You have no memory or sense of self stretching backward into that void. It's simply *not part of your narrative*.
      *   **Post-Death:** Your consciousness flows forward in time. You naturally project your current self, desires, and attachments into the future. Death represents an absolute, irreversible *rupture* in that projected continuity. The brain struggles to conceptualize the cessation of its own stream of experience.

  3.  **Biological Hardwiring for Self-Preservation:**
      *   Fear of death (or more accurately, fear of threats *leading* to death) is a fundamental evolutionary adaptation. Organisms wired to avoid death are more likely to survive and reproduce. This deep-seated biological imperative screams against the prospect of annihilation, regardless of logic. Pre-birth nonexistence doesn't trigger this instinct because it poses no *threat* to an existing organism.

  4.  **The Sting of Anticipation:**
      *   **Pre-Birth:** You never experienced *anticipating* your pre-birth state. You never existed to worry about it.
      *   **Post-Death:** As a conscious being aware of mortality, you *do* experience the anticipation of death *right now*. It's the *present experience of dreading future nonexistence* that causes suffering. The dread itself is real, even if the state of death isn't "bad."

  5.  **The Shadow of Loss:**
      *   Death isn't just about *your* nonexistence. It's about the loss experienced by others who love you (as you're experiencing with your grandfather). It's also about *your* loss of everything you cherish – people, experiences, potential, the beauty of the world. Pre-birth involved no such losses *for you* because you had nothing *to* lose.

  ### Why "You Won't Be Around to Feel It" Doesn't Resolve the Fear
  It addresses the *state* of death (which is indeed neutral, like deep dreamless sleep you never wake from), but it ignores:
  *   The **anticipatory fear** you feel *now*.
  *   The **perceived loss** of everything you hold dear *from your current perspective*.
  *   The **biological terror** programmed into you.
  *   The **rupture of continuity** your mind projects.

  ### You Didn't Find a Hole - You Found the Core Tension
  Your insight is profound. Lucretius (ancient Roman philosopher) famously argued *for* symmetry: "Look back at time... before our birth. In this way Nature holds before our eyes the mirror of our future after death. Is this so grim, so gloomy?" Yet, as you've discovered, humans consistently *don't* feel this symmetry. Philosophers like Thomas Nagel and Bernard Williams have grappled intensely with this asymmetry.

  **The "Answer":** There isn't one neat logical patch. The difference lies in the **inescapable perspective of the living, conscious self**. We are temporal beings hurtling forward, clinging to existence. Pre-birth is behind us, outside our narrative. Death is ahead of us, as the inevitable end of our narrative. Logic struggles against the raw current of existence and the evolutionary fear of cessation.

  ### What Can Help (Beyond Logic)
  Since logical arguments often bounce off this deep existential fear, consider these approaches alongside philosophy:
  1.  **Acknowledge the Grief:** Your grandfather's death is a raw, recent loss. Existential dread is often intertwined with grief. Allow yourself to mourn him fully.
  2.  **Focus on "Being Towards Life":** Instead of dwelling on the end, consciously shift focus to engagement *now* – connection, meaning, contribution, experiencing beauty. This doesn't negate the fear, but builds a counterweight.
  3.  **Mindfulness/Meditation:** Helps observe the fear without being consumed by it, reducing the nighttime spiraling. It anchors you in the present.
  4.  **Therapy (Existential/Grief):** A skilled therapist can provide a space to explore this fear safely, separate it from grief, and develop coping strategies rooted in your values.
  5.  **Reframe the Narrative:** Consider: Your 13 billion years of pre-birth nonexistence didn't prevent *this* existence. The fact that you *get* to exist, even temporarily, is statistically miraculous. Death is the price of admission for the incredible experience of life.

  **Your fear isn't illogical; it's deeply human.** It stems from being a self-aware creature who loves being alive. While the *state* of death may be neutral like pre-birth, the *prospect* of it, from the vantage point of a conscious, valuing being hurtling towards it, is inherently terrifying. Recognizing this asymmetry is a sign of deep reflection, not a failure of logic. Be gentle with yourself as you navigate this profound question, especially while grieving.
