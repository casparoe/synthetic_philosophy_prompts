answer: |-
  You've hit on a fascinating and genuinely debated point in Aquinas scholarship! Your initial reading of the *Sentences Commentary* (specifically, *Scriptum super Sententiis*, Book II, Dist. 44, Q. 2, A. 2) is spot-on: Aquinas argues that a tyrant who seizes power *without any legitimate title* (a pure usurper, *per violentiam et non per ius*) is effectively a private individual committing the crime of oppression. Since there is no higher *human* authority to appeal to, any private citizen can licitly kill them, just as one could kill a robber or brigand. This is a powerful statement grounded in natural law self-defense/defense of the common good against an unjust aggressor.

  **So why the tension, and why does your professor emphasize *De Regno* (On Kingship)?**

  1.  **The *De Regno* Context & Nuance:** While the *Sentences* commentary is a relatively early work (1250s), *De Regno* (c. 1267) is a mature political treatise directly addressing kingship and tyranny. Here, Aquinas takes a much more cautious and institutional approach:
      *   **Focus on Public Authority:** Aquinas strongly prefers that action against a tyrant come from *public authority*, not private individuals. He explicitly states that if there exists a superior authority (like an assembly of nobles or the people collectively), the tyrant should be deposed *by them*, not by private initiative (*De Regno*, Book I, Ch. 6).
      *   **Danger of Vigilantism:** He warns gravely against private action (*De Regno*, Book I, Ch. 6): "The danger is that if private persons take upon themselves the authority to kill rulers, even if they are tyrants, this could lead to great disorder among the people; for it might happen that someone who is killed was not really a tyrant but was thought to be one by the killer, who acted on the basis of his private judgment. Moreover, even if the ruler is a tyrant, it might happen that the killer exposes the people to greater dangers." He fears chaos, mistaken judgments, and the potential for a worse tyrant to emerge.
      *   **Distinguishing Usurpers from Tyrants:** *De Regno* primarily discusses rulers who *acquired power legitimately* but then *rule tyrannically*. For these, Aquinas argues removal must generally be by public authority. He doesn't explicitly revisit the *pure usurper* scenario from the *Sentences* with the same stark "anyone can kill him" language. The focus shifts to *how* to remove *established* tyrants.
      *   **The "Per Accidens" Loophole (and its Limits):** Aquinas *does* say in *De Regno* (Book I, Ch. 6) that if there is *no human recourse* ("*non sit recursus ad superiorem iudicem per quem tyranni potestas valeat coerceri*"), then it is *per accidens* praiseworthy ("*laudabiliter accidit*") for someone to liberate the multitude by killing the tyrant. This *seems* to echo the *Sentences*. However:
          *   The phrasing ("*laudabiliter accidit*") is more qualified than the *Sentences*' direct permission. It highlights the act's accidental goodness (freeing the people) rather than formally endorsing the *means* (private killing) as the ideal or primary solution.
          *   The context emphasizes this is a *last resort* when *all* institutional avenues are utterly closed, and the act *must* be motivated purely by zeal for the common good, not private vengeance or ambition.
          *   He immediately follows this with the warnings about danger and disorder quoted above.

  2.  **The Source of Tension:**
      *   **Radical Natural Law vs. Political Prudence:** The *Sentences* presents a seemingly straightforward application of natural law principles to a political vacuum. *De Regno* tempers this radical potential with a deep concern for *political order, stability, and the dangers of vigilantism*. It reflects Aquinas's mature understanding of the fragility of political society.
      *   **Emphasis Shift:** *Sentences* focuses on the *status of the usurper* (no title = outlaw). *De Regno* focuses on the *process of removal* and the *dangers of private action*, regardless of the tyrant's initial title.
      *   **Audience & Purpose:** The *Sentences* is a theological commentary addressing a specific question about authority. *De Regno* is practical political advice, likely for a king, emphasizing responsible governance and the perils of instability.
      *   **The "Hitler Question" Nuance:** While the *Sentences* logic *could* apply to a pure usurper like Hitler (who manipulated the system but arguably never held *legitimate* authority in a Thomistic sense – authority ordered to the common good), *De Regno*'s overwhelming emphasis would likely lead Aquinas to *prefer* removal by a recognized public authority (like the military high command in the July 20 plot, acting as representatives of the German people/state, however imperfectly) over a lone citizen assassin. He would see the plot as aligning *better* with his *De Regno* cautions, even if the *Sentences* logic might cover the lone assassin. The *tension* lies in whether the *Sentences* permission is implicitly *superseded* or merely *contextualized* by *De Regno*'s prudential warnings.

  3.  **Why Your Professor is Right to See Tension:**
      *   **It's Not Just Phrasing:** The difference is substantive. *De Regno* actively *discourages* private action as the primary or desirable solution, placing significant hurdles (exhausting public avenues, pure motivation, grave danger of worse outcomes) that aren't prominent in the *Sentences* passage. It "walks back" the permissibility by making it a dangerous exception rather than a straightforward right.
      *   **The Core Dilemma:** Aquinas wants to affirm the right/responsibility to resist manifest injustice (*Sentences*) but is terrified of the anarchy and potential for greater injustice that private vigilantism could unleash (*De Regno*). This *is* a fundamental tension in his thought – between the demands of justice and the requirements of order.
      *   **Scholarly Debate:** Historians and philosophers genuinely argue about how to reconcile these texts. Does *De Regno* represent a development/softening of his view? Does it merely provide necessary context for applying the *Sentences* principle? Is the "usurper vs. established tyrant" distinction the key?

  **Conclusion:**

  You are correct that the *Sentences* commentary provides a clear, radical justification for killing a pure usurper by any private citizen. However, your professor is also right that *De Regno* introduces significant tension by:

  1.  Strongly prioritizing removal by public authority.
  2.  Issuing stark warnings about the dangers and potential for disaster inherent in private action.
  3.  Framing private killing as a *per accidens*, last-resort option fraught with peril, rather than a straightforward right.
  4.  Shifting focus towards the tyrannical *exercise* of power, even if initially legitimate.

  While Aquinas never explicitly *contradicts* his *Sentences* position in *De Regno*, he surrounds it with so many caveats, preferences for institutional action, and warnings that it radically changes the *practical import* of the doctrine. The tension is real: it's the tension between the ideal demands of justice in a vacuum and the messy, dangerous realities of political action in the fallen world. The July 20 plotters, acting as representatives of the state apparatus, arguably align *better* with Aquinas's mature *De Regno* preference than a lone citizen assassin would, even if the *Sentences* logic *could* cover both. Understanding this tension is crucial to grasping the complexity of Aquinas's political thought.
