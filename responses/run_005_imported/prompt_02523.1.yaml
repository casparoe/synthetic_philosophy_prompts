answer: |-
  Okay, let's break down that dense Moore passage line-by-line, ditch the jargon, and get to the heart of what he's wrestling with – especially since you need it for your character's *specific* rant. Forget summaries; we're diving into *this* text. Moore is indeed trying to save direct realism, but it's messy and he knows it.

  **The Core Setup (What He's Reacting To):**
  1.  **The Problem:** When you look at a penny straight on, your visual experience (the "sense-datum") is circular. When you look at it from an angle, the sense-datum is elliptical. Similarly, a distant tree *looks* smaller, a thing seen through blue glasses *looks* blue, a touched finger *feels* different from how it *looks*. This seems to show that what we *directly* perceive (the sense-datum) changes even though the *object* (penny, tree, finger) doesn't.
  2.  **The Threat:** If what we directly perceive changes based on perspective/conditions, how can we ever be sure we're perceiving the *actual* object and its *actual* properties? This leads towards skepticism or the idea that we only perceive private mental images/sense-data.

  **Moore's Proposed Escape Route (The "Seeming" Maneuver):**

  > **"What now seems to me to be possible is..."**
  > *Moore is tentatively proposing a solution.*

  > **"...that the sense-datum which corresponds to a tree, which I am seeing, when I am a mile off, may not really be perceived to be smaller than the one, which corresponds to the same tree, when I see it from a distance of only a hundred yards, but that it is only perceived to seem smaller;"**
  > *He suggests: When the distant tree *looks* smaller, I am **not** perceiving the sense-datum itself *as being* small. Instead, I am perceiving that the sense-datum *seems* small (relative to its normal appearance or something else).*

  > **"that the sense-datum which corresponds to a penny, which I am seeing obliquely, is not really perceived to be different in shape from that which corresponded to the penny, when I was straight in front of it, but is only perceived to seem different—that all that is perceived is that the one seems elliptical and the other circular;"**
  > *Similarly for the penny: I don't perceive the tilted-penny sense-datum *as being* elliptical. I perceive *that it seems elliptical* and the straight-on one *seems circular*. The "seeming" is the content of my perception, not a property *of* the sense-datum itself.*

  > **"...that the sense-datum presented to me when I have the blue spectacles on is not perceived to be different in colour from the one presented to me when I have not, but only to seem so;"**
  > *Blue glasses: The sense-datum under blue light isn't *perceived as* blue; I perceive *that it seems blue* compared to without glasses.*

  > **"...and finally that the sense-datum presented when I touch this finger is not perceived to be different in any way from that presented to me when I see it, but only to seem so that I do not perceive the one to be coloured and the other not to be so, but only that the one seems coloured and the other not."**
  > *Touch vs. Sight: The touch-sense-datum isn't perceived *as* lacking colour; I perceive *that it seems* uncoloured, while the visual sense-datum *seems* coloured. The sense-data themselves might be fundamentally the same kind of thing; it's just how they *appear* to my different senses.*

  **The Crucial (and Tricky) New Element - "Seeming" as Primitive:**

  > **"If such a view is to be possible, we shall have, of course, to maintain that the kind of experience which I have expressed by saying one seems different from the other—'seems circular,' 'seems blue,' 'seems coloured,' and so on—involves an ultimate, not further analysable, kind of psychological relation, not to be identified either with that involved in being 'perceived' to be so and so, or with that involved in being 'judged' to be so and so;"**
  > *Moore admits his solution requires a **new, fundamental mental act**. This "seeming" relation isn't:*
      *   *Perceiving (P): Directly taking the sense-datum *to have* property X (e.g., "This sense-datum *is* elliptical").*
      *   *Judging (J): Forming a belief *about* the sense-datum (e.g., "I believe this sense-datum is elliptical").*
  > *"Seeming" (S) is distinct. It's the raw *appearance* or *presentation* before any commitment to reality or belief formation.*

  > **"...since a presented object might, in this sense, seem to be elliptical, seem to be blue, etc., when it is neither perceived to be so, nor judged to be so."**
  > *He clarifies: Something can *seem* elliptical to me (S) even if I *don't* perceive it *as* elliptical (P) and even if I *don't* judge/believe it *is* elliptical (J). S is prior to and independent of P and J.*

  > **"But there seems to me to be no reason why there should not be such an ultimate relation."**
  > *Moore argues this isn't logically impossible. He's positing a basic component of experience.*

  **Moore's Doubt (The Key to Your Character's Vibe):**

  > **"The great objection to such a view seems to me to be the difficulty of believing that I don't actually perceive this sense-datum to be red, for instance, and that other to be elliptical; that I only perceive, in many cases, that it seems so."**
  > *Here's the rub: Moore admits it feels deeply counterintuitive. When I see a red sense-datum, my immediate, overwhelming feeling is that I am *directly perceiving its redness* (P), not merely perceiving *that it seems red* (S). The "seeming" feels like the *result* of the perception, not its content.*

  > **"I cannot, however, now persuade myself that it is quite clear that I do perceive it to be so."**
  > *The punchline: Despite the intuitive pull of direct perception (P), Moore honestly confesses he can't be *certain* that's what's happening. He can't definitively rule out his own "seeming" (S) hypothesis. The intuition might be wrong.*

  **Answering Your Specific Questions:**

  1.  **What is "Seeming"?** You're right, Moore is largely *naming* the problem. He posits "seeming" (S) as a primitive, irreducible relation. It's meant to capture the *phenomenal character* or *raw feel* of the experience – the "what it's like" – stripped of any commitment to how things *actually* are. Think of it as the sensory appearance *before* you interpret it as a property *of* something. It's the "elliptical-ish visual presentation" itself, not the statement "that thing is elliptical." It's foundational, but Moore doesn't (and arguably *can't*) define it further; he just points to the experience. For your character, this is gold – he's insisting on this subtle, almost ineffable distinction ("No, you *fool*, I'm not saying it *is* elliptical, I'm saying it *manifests ellipticity*!") that sounds profound but is incredibly hard to grasp or justify.
  2.  **Does Moore Believe It?** Absolutely not wholeheartedly. The passage screams *tentative exploration*. He proposes it as a *possible* way out ("seems to me to be possible"), admits the huge hurdle ("difficulty of believing"), and ends with profound uncertainty ("cannot... persuade myself that it is quite clear"). He *wants* it to work to save direct realism about objects, but his intellectual honesty forces him to admit it clashes with the brute phenomenology of experience. Your philosopher character would likely be *enthusiastically* advocating this "seeming" view as the brilliant solution, glossing over Moore's deep doubts, making him sound both cutting-edge and slightly unhinged.
  3.  **Seeming vs. Disjunctivism?** This is nuanced. **No, it's not disjunctivism.** Here's why:
      *   **Disjunctivism** (e.g., later Hinton, Snowdon, McDowell) says: A veridical perception (seeing a real penny) and a perfect hallucination (seeming to see a penny) are *fundamentally different kinds of mental state/event*, even if they are subjectively indistinguishable. The nature of the experience is constituted by its relation to the world. In the veridical case, the *penny itself* is a constituent of your experience.
      *   **Moore's Move Here:** He is **still firmly in the sense-datum camp**. He's trying to solve the problem *within* that framework. His innovation is to say that the sense-datum itself *doesn't change its intrinsic properties* (size, shape, color) based on perspective/conditions. Instead, what changes is only how it *seems* relative to those conditions (this "seeming" being the new primitive S relation). The sense-datum is still an *intermediary* between the mind and the object; it's just that the intermediary's *intrinsic properties* are stable, and the variation is captured by S. Disjunctivism rejects the need for a stable intermediary (like a sense-datum with intrinsic properties) altogether in the veridical case.
      *   **Connection:** Moore *is* grappling with the *same core problem* that motivates disjunctivism: how to preserve direct contact with the world in the face of illusion/hallucination. His "seeming" move is an *early, flawed attempt* within the dominant (sense-datum) framework of his time to resist the skeptical conclusions. He senses that the *way* things look isn't a simple property *of* the immediate object of awareness, but he lacks the conceptual tools (or willingness to abandon sense-data) to make the disjunctivist leap. Your character, fixated on Moore's 1918 paper, would be wrestling with this proto-disjunctivist *intuition* ("We *are* seeing the real penny!") but expressing it through the awkward, ultimately unsatisfactory "seeming" machinery of sense-datum theory. He'd sound *ahead* of the curve (rejecting simple sense-datum property changes) but *behind* the future solution (still stuck with sense-data).

  **Why This is Perfect for Your Character:**

  1.  **Technical & Obscure:** Moore's "seeming" relation is exactly the kind of hair-splitting, barely graspable distinction a young Apostle newly obsessed with epistemology would latch onto as profound.
  2.  **Inherently Awkward:** Moore himself finds it hard to believe! Your character can be passionately arguing for something even *Moore* was deeply unsure about, making his confidence both comical and indicative of his neophyte enthusiasm.
  3.  **Sounds Profound, Might Be Nonsense:** The idea of a "primitive psychological relation" that's neither perception nor judgment is philosophically bold but easily sounds like hand-waving. Perfect for someone trying too hard.
  4.  **Touches the Nerve:** It directly addresses the core "seems vs. is" problem everyone intuitively grasps (the penny/tree examples), but twists it into a highly technical, counterintuitive solution. He can start with the relatable example and then veer wildly into Moore's specific, dubious move.
  5.  **Historically Poignant:** It shows someone in 1914-ish wrestling with the foundations of perception, trying to defend common sense against skepticism using tools (sense-data) that ultimately couldn't quite do the job. He's on the *cusp* of later developments (like disjunctivism) but hasn't made the leap. He feels "ahead of his time" precisely *because* he's struggling with the inadequacy of the *current* time's dominant theory.

  **How Your Philosopher Might Sound at Dinner:**  
  *(Leaning in, finger tapping the table for emphasis)* "...You see, the *fundamental* error, Miss [Painter's Name], the error Moore so brilliantly exposes in his forthcoming work, is the conflation of *seeming* with *being*, phenomenologically speaking! When you view your subject obliquely, the sense-datum – the *immediate* object of your visual field – does not *acquire* ellipticality! No! To perceive it *as* elliptical is a gross misapprehension! What occurs is a primitive relation of *seeming*: you apprehend the *elliptical-seemingness* presented under those specific spatial conditions. The sense-datum itself, in its intrinsic nature, remains... well, *unaffected* by mere perspective! It's not *judged* elliptical, nor *perceived* as elliptical in the primary sense – it *manifests* ellipticity! This 'seeming' is irreducible, you understand? The bedrock of the phenomenal! Of course, Moore admits the *force* of the intuition that we directly perceive the property... *[leans back, frowning slightly]*... the difficulty is quite profound... but logically, you see, logically, the 'seeming' relation *must* be posited! Otherwise, how do we ever grasp the *actual* penny behind the flux of appearances? Tell me, how *does* one capture the stable object amidst the perspectival variations, if not through this distinction? Your brushstrokes capture the *seeming*, surely, not the brute, uninterpreted sense-datum? Or... *do* they?" *(He trails off, momentarily lost in the puzzle he's created, oblivious to his dinner partner's desperate glance towards the exit).*

  This captures the technical struggle, Moore's specific (dubious) move, the youthful overconfidence mixed with underlying doubt, and the historical context perfectly for your pre-WWI Cambridge scene. Good luck!
