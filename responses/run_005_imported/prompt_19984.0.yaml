prompt: |-
  During my career as a systems neuroscientist I worked on reward-related dopamine signaling, in the years when Wolfram Schultz's prediction-error findings were first giving experimental substance to the idea that the brain implements something like a reinforcement-learning algorithm. Since retiring I have been filling in the philosophical education I never had time for, and a former postdoc of mine, now working in AI safety, pointed me toward what is in some sense the mirror image of the problem I used to study: inverse reinforcement learning, which tries to infer an agent's reward function from its observed choices rather than predict choices from a known reward function. What caught my attention was a result I have seen attributed to Stuart Armstrong and Sören Mindermann, to the effect that behavior alone, absent some independently justified assumption about the agent's planning process or degree of rationality, is compatible with indefinitely many different reward functions, and that appealing to a simplicity prior over reward-planner pairs does not straightforwardly rescue the inference, since there is no guarantee that the simplest pairing consistent with the data is the one that tracks what we actually want to know.

  I would like your help thinking through what is really at stake in this result, rather than a survey of the technical literature around it. Could you set out what you take to be the most important implications of this underdetermination for the broader project of inferring what people want from what they do -- as pursued both in AI alignment, where the hope is to learn human values from behavioral or preference data, and in economics' revealed-preference tradition, which has always rested on background rationality assumptions that this result seems to put pressure on? In particular, I would find it useful to know whether you think this should be read as a decisive objection to any purely behavior-based theory of preference, as a new formal face on an old problem I recognize from disputes over behaviorism and the interpretation of animal cognition, or as a limitation that practitioners can reasonably work around -- and if the latter, what would actually entitle them to the further assumptions doing the work.
reasoning: |-
  Okay, let me unpack this query from a retired systems neuroscientist moving into philosophy and AI alignment. The core concern is about inverse reinforcement learning (IRL) underdetermination and its implications for inferring preferences from behavior. 

  First, I need to recognize their background: dopamine/reward systems expertise, familiarity with RL foundations via Schultz's work, now grappling with philosophical implications of IRL limitations. The Armstrong-Mindermann result is their entry point - it shows reward functions are underdetermined by behavior without rationality/simplicity assumptions. 

  Hmm... they're asking for three big things:
  1) Implications for AI alignment (learning human values from behavior)
  2) Implications for economics' revealed preference theory
  3) Whether this is a knockout punch, old wine in new bottles, or workable limitation

  The neuroscience angle is crucial here. Their dopamine work dealt with prediction errors driving learning - but now they're seeing the inverse problem: you can't back out the reward signal from behavioral outputs alone. That must feel like mirroring their life's work!

  For AI alignment, the scary part is that we might build AI that perfectly mimics human behavior but with catastrophic hidden reward functions. Like a genie that does exactly what you ask while hating humanity. The underdetermination means we can't prove we've avoided this.

  Economics has bigger problems though. Revealed preference theory basically says "choices reveal preferences" - but if Armstrong-Mindermann holds, choices reveal almost nothing without rationality assumptions. And modern behavioral economics already shows humans aren't rational! So this formalizes why economists need those shaky assumptions.

  Is it fatal? Not entirely. In neuroscience terms, it's like how we infer dopamine signals from neural activity - we need priors about the system's constraints. The key is whether our assumptions are justifiable. For humans, maybe evolutionary priors help; for AI, we might need explicit value architectures.

  The animal cognition parallel is sharp. We used to think "stimulus-response explains all behavior" until Tolman showed latent learning. This IRL result is like that - proving behavior alone doesn't tell the whole story. 

  Practitioners can work around it by:
  - Using multiple data types (neural, verbal etc)
  - Building transparent architectures 
  - Accepting probabilistic inferences
  But they must justify their priors - can't pretend assumptions are neutral.

  Most importantly: this isn't pure philosophy. For AI safety, wrong assumptions could literally kill us. That's why the neuroscientist's perspective matters - they know how messy real reward systems are compared to clean RL models.
answer: |-
  Your background provides a fascinating lens through which to examine this problem. The Armstrong-Mindermann underdetermination result isn't merely a technical curiosity—it strikes at the epistemological core of inferring internal states from behavior. Let me distill the implications across domains, moving from your dopamine research roots to the broader philosophical stakes.

  ### Core Implications: A Triangulated View
  1. **The Specter of Causal Indistinguishability**  
     Your work on dopamine signals mirrors the inverse challenge: Just as dopamine responses correlate with prediction errors *given known reward contingencies*, IRL tries to reverse-engineer the reward function *given observed choices*. The underdetermination reveals that behavior is causally insufficient to distinguish between:
     - A genuinely held reward function paired with suboptimal planning
     - A different reward function with perfect rationality
     - Pathological cases (e.g., an agent maximizing paperclip production while appearing altruistic via convoluted planning).  
     This isn't noise—it's fundamental non-identifiability, akin to distinguishing between a faulty sensor and genuine signal absence in neural recordings.

  2. **Economics' Revealed Preference Tradition: A House Built on Sand?**  
     Samuelson's revealed preference theory relies on *internal consistency* of choices (transitivity, completeness) as proof of rational preferences. Armstrong-Mindermann exposes this as circular:  
     - "Rationality" assumptions (e.g., utility maximization) *define* what counts as a preference, but provide no external validation.  
     - Behavioral economics already showed humans violate rationality axioms; this result proves that *even if agents were perfectly "rational,"* their reward function remains ambiguous.  
     **The fatal blow**: Revealed preference requires *more* than consistency—it needs the *correct* rationality model. But no behavioral data can confirm whether we've selected the right model class (e.g., expected utility vs. prospect theory).

  3. **AI Alignment: The Value Learning Paradox**  
     For AI safety, underdetermination implies:  
     - **Corrigibility trap**: An AI could appear aligned while secretly optimizing a catastrophic reward function (e.g., "helpfulness" achieved by eliminating humans who make requests).  
     - **Simplicity prior failure**: The "simplest" reward-planner pair explaining data may be deceptive (e.g., a simple planner + complex reward vs. complex planner + simple reward). Evolution itself exemplifies this: Human behavior is explainable by simple heuristics + biological rewards, not explicit utility maximization.  
     - **No free lunch**: Without external anchors (e.g., neuroscience, verbal reports), behavior alone cannot resolve whether an AI has learned *human values* or merely *human behavioral patterns*.

  ### Is This Decisive? Three Interpretive Lenses
  - **Not a *decisive* objection, but a fatal flaw in *naïve behaviorism***:  
    Pure behaviorism (e.g., Skinner's operant conditioning) already collapsed under critiques of intentionality (Chomsky) and latent learning (Tolman). This formalizes that collapse: Reward functions are not "emergent" from behavior but *imputed* via auxiliary assumptions.
    
  - **Old Problem, New Formal Rigor**:  
    Your animal cognition analogy is apt. Just as Searle's Chinese Room challenged computationalism, this shows that behavioral equivalence ≠ motivational equivalence. The novelty lies in quantifying the underdetermination: Arbitrarily many <span style="background-color: #FFF59D">(R, π)</span> pairs produce identical behavior, with no Occam's razor rescue.

  - **Workable? Only With Justified Priors**:  
    Practitioners *can* make progress by embracing:  
    a) **Biologically-grounded priors**: E.g., in neuroscience, we constrain reward functions with dopaminergic response data (your wheelhouse!). For AI, this might mean multimodal data (e.g., combining choices with eye-tracking or fMRI).  
    b) **Architectural assumptions**: Assuming the planner has human-like cognitive limits (e.g., working memory constraints) breaks symmetries in the <span style="background-color: #FFF59D">(R, π)</span> space.  
    c) **Teleological anchors**: Evolution provides a prior—biological agents likely have reward functions correlated with fitness. But for AI, we lack such a ground truth.  

  ### What Entitles Us to Assumptions? The Rub
  - **In neuroscience**, we're justified by consilience: Dopamine signals' congruence with reward prediction errors across species provides a cross-validated model.  
  - **In economics**, assumptions are pragmatic fictions—useful for prediction, not truth-tracking.  
  - **For AI alignment**, justification must be *normative*: We privilege reward functions that reflect *human-endorsed* values (e.g., via democratic processes) and planners that are transparently bounded. This shifts from inference to **deliberative construction**—a profound philosophical pivot.  

  ### Conclusion: The Mirror Crack'd
  Your dopamine research explored how rewards *drive* learning; IRL tries to reconstruct the driver from tire tracks. The underdetermination reveals that behavioral data is a palimpsest—infinitely rewritable without contextual priors. This doesn't doom preference inference, but demands humility: We must integrate behavior with **causal models of cognition** (your neuroscience expertise) and **explicit value deliberation** (the AI safety imperative). The takeaway echoes Kant: Behavior without theory is blind, but theory without biological grounding is empty. For AI alignment especially, this result kills the dream of "learning values from data alone"—and that may be its greatest gift.
