    - The federation (foedus pacificum) is not a world state but a voluntary association that grows and strengthens over time.
    - Cosmopolitan right and commercial interdependence (trade) make war less attractive and more costly.
  - Challenge the stagnation metaphor: is it naturalizing war? Does it ignore the moral status of individuals as ends?

  Structure of the dialogue:
