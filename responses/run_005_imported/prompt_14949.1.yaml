  Also, Fodor's requirement for context-invariance might be too strict. Why is absolute invariance necessary? If a system can reliably extract the filler across different roles using fixed operations, that should suffice for systematicity. The tensor approach achieves this through mathematical operations that are consistent, even if the surface vector changes.

  The user wants me to argue that explaining systematicity doesn't need context-invariant constituents. So I should challenge the classical notion that constituents must be atomic symbols. Connectionism shows that distributed representations can support systematic behavior through patterns of activation and transformations, not symbolic tokens.

