prompt: |-
  I'm a retired evolutionary biologist (34 years on sexual selection in birds, if it matters) whose spent the last year or so happily reading philosophy now that I don't have grad students to supervise anymore. Recently I got hooked on Sharon Street's "Darwinian Dilemma" paper against moral realism -- her argument that realists owe us an explanation of why natural selection, which pretty clearly shaped our evaluative attitudes because they promoted survival and reproduction rather than because they tracked mind-independent moral truths, would also have made us reliable trackers of those truths. Either there's no link between selection and the independent truths (so our moral beliefs are probably mostly off track), or realists have to posit a wildly convenient coincidence where tracking the truth and being fitness-enhancing just happen to line up. As a biologist this felt very familiar, and, honestly, pretty devastating.

  But then someone in my reading group pointed out the obvious follow-up worry: our logical and arithmetical faculties were surely shaped by selection too (theres a pretty clear fitness payoff for ancestors who could infer and count correctly), yet basically nobody thinks 2+2=4 or modus ponens gets "debunked" this way. So there's got to be some asymmetry that lets math and logic off the hook while morality stays on it. I've run across a few candidate asymmetries in my (admittedly amateur) reading -- that necessary truths make reliability trivially "safe" regardless of the process that produced the belief, that mathematical objects might be "plenitudinous" (every consistent structure exists, so there's nothing external left to fail to track), and that math is indispensable to our best science in a way moral facts aren't. What I'd like is for you to actually mount the hard-nosed case that none of these three moves restores the asymmetry -- argue, as rigorously as you can, for full "companions in guilt": that if Street's dilemma is fatal to robust moral realism, it's equally fatal to mathematical and logical realism, and nobody gets to keep their platonism just because it's about numbers instead of norms. Take each escape route at its strongest rather than swatting down a cartoon version of it.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired evolutionary biologist with 34 years in sexual selection of birds, now diving into philosophy. They've been grappling with Sharon Street's Darwinian Dilemma against moral realism. The dilemma points out that evolution shaped our moral attitudes for survival, not for tracking objective truths, which challenges moral realists to explain why our moral beliefs would align with these truths without invoking a massive coincidence.

  The user's reading group raised a counterpoint: our logical and mathematical faculties also evolved for survival benefits (e.g., counting, inference), yet we don't doubt truths like 2+2=4. The user is looking for a rigorous argument that if Street's dilemma undermines moral realism, it should equally threaten mathematical and logical realism. They mentioned three common defenses for math/logic: necessary truths making reliability trivial, plenitudinous mathematical structures, and indispensability to science. The task is to show these don't restore the asymmetry.

  First, I need to address each defense robustly. For necessary truths, the key is that evolution doesn't guarantee our grasp of necessity. We might have useful but incomplete heuristics. For example, believing "if P then Q; P; therefore Q" works in many contexts but might not cover all logical structures. Evolution favors practicality over exhaustive truth-tracking.

  Next, plenitudinous realism. Even if all consistent structures exist, evolution likely shaped us to perceive only those structures that were fitness-enhancing. Our mathematical intuitions might map to a subset of possible structures, missing others that are consistent but irrelevant to survival. So reliability isn't guaranteed.

  The indispensability argument claims math is essential to science, hence justified. But the user wants a case that this doesn't resolve Street's dilemma. Science itself relies on cognitive faculties shaped by evolution. If those faculties are questioned for morality, the same applies to math. Indispensability might justify math's use but not its truth-tracking reliability in an evolutionary context.

  The user's deeper need might be understanding whether consistent naturalism leads to skepticism beyond morality. They might also seek validation of Street's argument's implications without special pleading for math/logic. Their expertise in biology suggests they appreciate detailed evolutionary mechanisms, so examples like modular arithmetic or non-Euclidean geometry could illustrate mismatches between evolved intuitions and broader truths.

  I should ensure each counterargument directly engages the strongest form of the defenses. Avoid straw men. Emphasize that evolution selects for fitness, not truth, even in necessary domains. Highlight that the process doesn't guarantee comprehensive access, only sufficiency for survival. Conclude that without an independent reason to trust evolution for math/logic, they face the same coincidental alignment as morality.
answer: |-
  Your challenge cuts to the heart of the evolutionary debunking debate. Let's take the three strongest realist escape routes for math/logic seriously and argue why, under a consistent application of Street's dilemma, they fail to restore the asymmetry with morality. We'll grant the realist their best shot each time.

  **Core Assumption:** Street's dilemma rests on a fundamental *contingency*: evolution selects for cognitive faculties and outputs that enhance fitness, not for truth-tracking per se (especially not for tracking highly abstract, causally inert truths). Reliability about such truths would require either an *explained link* between fitness and truth-tracking in that domain or an *inexplicable coincidence*.

  **The Target:** Robust Platonism about math/logic (i.e., the view that mathematical/logical truths are mind-independent, abstract, necessary facts that we can discover).

  **Escape Route 1: Necessity Guarantees Reliability (The "Safe Because Necessary" Move)**

  *   **The Strongest Case:** Mathematical and logical truths are necessary. If we grasp them at all, we grasp them truly. There is no possible world where 2+2=5 or Modus Ponens is invalid. Therefore, *any* process that produces a belief in these necessary truths, *if it produces a belief about them at all*, produces a true belief. Evolution didn't need to "track" a contingent external landscape; it just needed to get us to latch onto these necessary structures, and once we do, we can't be wrong about their core truths. Reliability is trivialized. This doesn't apply to morality because moral truths (if they exist) are not necessary in the same way – there are possible worlds where different moral facts hold.
  *   **The Hard-Nosed Companions-in-Guilt Rebuttal:**
      1.  **Grasp, Not Truth, is the Issue:** The problem isn't whether the *proposition believed* is necessary. The problem is whether our *faculty for grasping and reasoning about* these necessary structures is reliable *across the relevant domain*. Necessity guarantees that *if* we correctly grasp "2+2=4", it's true. But it says nothing about whether evolution equipped us to *correctly grasp the full range or true nature* of mathematical necessity. Our evolved cognitive toolkit might give us reliable access *only to a small, fitness-relevant subset* of necessary truths, while being systematically misleading about others.
      2.  **The Scope of Evolved Competence:** Evolution plausibly shaped us for competence in *small finite numbers, basic Euclidean geometry in midsize dry goods, and simple causal/logical inferences relevant to immediate survival and reproduction*. Why think this competence reliably extends to understanding *actual infinity, transfinite arithmetic, non-Euclidean geometries, complex modal reasoning, or highly abstract set theory*? Our intuitions often fail spectacularly in these areas (e.g., Hilbert's Hotel, Banach-Tarski paradox, Monty Hall problem). This looks like *exactly* the kind of "mostly off track" scenario Street predicts for domains where truth-tracking wasn't the selection pressure. We have useful heuristics, not a reliable truth-tracking faculty for the whole domain.
      3.  **The "If At All" Dodge Fails:** The realist says "if we grasp it, we grasp it truly." But the debunker asks: *How do we know which structures we are "grasping" when we use our evolved faculties?* Our evolved intuitions might lead us to *believe* we are grasping the necessary truth that "every number has a successor" or "the parallel postulate is necessary," but these very intuitions could be fitness-driven misrepresentations of the actual necessary structures. Evolution shaped us to *treat* certain inferences as necessary for practical purposes, not to perceive necessity itself. The "grasping" might be an illusion generated by useful cognitive shortcuts.
      4.  **The Coincidence Remains:** Why would the specific necessary structures our evolved cognitive toolkit *allows us to access and find intuitively compelling* just happen to be *the actual* necessary structures? The realist must still posit that the necessary structures accessible and compelling to minds shaped purely by fitness pressures in a finite, contingent world align perfectly with the true, vast, abstract realm of mathematical necessity. This *is* a "wildly convenient coincidence" from an evolutionary perspective. Selection didn't care about Cantor's paradise, only about avoiding predators and finding mates.

  **Escape Route 2: Plenitudinous Realism (The "Nothing to Fail to Track" Move)**

  *   **The Strongest Case:** Mathematical Platonism can be "plenitudinous": *every logically consistent mathematical structure exists*. There isn't a single "true" arithmetic or geometry; there are infinitely many consistent alternatives (e.g., Euclidean vs. non-Euclidean geometries, PA vs. non-standard models of arithmetic). Our evolved faculties latch onto *some* consistent structures – specifically, those that were useful for survival (e.g., simple finite arithmetic, local Euclidean-ish space). But since *all* consistent structures exist, we aren't "failing to track" anything. We're reliably tracking *some* mathematical reality; it's just a different slice than we might naively think. Morality, the realist argues, doesn't have this plenitude – there are (allegedly) objective moral facts, not just any consistent normative system.
  *   **The Hard-Nosed Companions-in-Guilt Rebuttal:**
      1.  **The Tracking Problem Persists:** Plenitude doesn't dissolve the core tracking problem; it merely relocates it. The question becomes: Why did evolution lead us to latch onto *this specific subset* of consistent mathematical structures (e.g., the standard natural numbers, local Euclidean geometry) rather than countless other equally consistent structures (e.g., arithmetic modulo 4, hyperbolic geometry)? The answer is purely instrumental: *fitness*, not truth. There's no reason to think the structures we evolved to find intuitive correspond to structures that are "privileged" or "more real" even within plenitude. They are just the useful ones.
      2.  **The Illusion of Uniqueness & Discovery:** Plenitude undermines the realist intuition that we are *discovering* a unique, pre-existing mathematical reality. Our evolved faculties *construct* or *select* a useful fiction from the vast plenitude. When we prove a theorem in PA, we aren't revealing a universal necessary truth; we're exploring the properties of one particular consistent structure our brains happened to evolve to model. The sense of "discovery" and "unavoidable necessity" is an artifact of our cognitive wiring, shaped by fitness, not a reflection of accessing *the* fundamental truth. This parallels the debunking of moral "discovery" as shaped by fitness-driven attitudes.
      3.  **The Coincidence Morphs But Endures:** The coincidence Street identifies transforms but doesn't vanish. The realist must explain why the *specific subset* of the mathematical plenitude that our fitness-shaped minds find compelling and "necessary" *just happens* to be the subset that is maximally useful for describing the *actual physical world* (which physics relies upon) and for developing internally consistent, powerful formal systems. Why didn't evolution wire us for a consistent but utterly useless or physically inapplicable mathematical structure? The alignment between the structures we evolved to find intuitive, the structures useful for science, and the structures that actually describe the physical universe requires explanation beyond mere plenitude. It still looks like a remarkable evolutionary coincidence that our fitness-tuned math aligns so well with the universe's deep structure. Plenitude explains why we aren't *wrong*, but not why we are *so surprisingly right* about which math applies to the world.

  **Escape Route 3: Indispensability (The "Scientific Seal of Approval" Move)**

  *   **The Strongest Case:** Mathematics is indispensable to our best scientific theories (Quine-Putnam Indispensability Argument - QIA). We cannot do physics, chemistry, biology, etc., without quantifying, using functions, employing geometry, etc. The empirical success of science, which relies fundamentally on mathematics, provides strong abductive/confirmatory reason to believe mathematical entities exist and our mathematical beliefs are (at least approximately) true. Science, crucially, *is* a reliable truth-tracking endeavor (or we have the best reasons to think it is). Morality, the realist argues, lacks this kind of indispensable, confirmatory role within our best empirical science.
  *   **The Hard-Nosed Companions-in-Guilt Rebuttal:**
      1.  **Science Rests on Evolved Faculties Too:** The QIA assumes the reliability of science. But science itself is conducted using the very same evolved cognitive faculties (perception, induction, deduction, mathematical intuition) whose reliability is under scrutiny by the evolutionary debunker. If Street's dilemma undermines our trust in these faculties' ability to track abstract truths *in general* (because they were selected for fitness, not truth), then the success of science cannot simply be taken as an independent validation. It's potentially circular: we use potentially unreliable faculties to confirm the reliability of... those same faculties. The empirical "success" of science might just reflect the fitness-enhancing predictive power of our models, not their truth. Evolution could have given us faculties adept at constructing instrumentally successful scientific theories *without* those theories (or their mathematical components) accurately depicting mind-independent abstract reality.
      2.  **Instrumental Success ≠ Truth-Tracking:** The debunker argues that evolution could easily have equipped us with mathematical heuristics that are *instrumentally successful* (for building tools, predicting harvests, navigating) without those heuristics corresponding to *mind-independent abstract truths*. Think of Newtonian physics: incredibly successful instrumentally for centuries, but fundamentally *false* about the true nature of space, time, and gravity. Its mathematical apparatus was indispensable and successful, yet not truly descriptive of mind-independent reality in the relevant ways. Our current best math might be similarly indispensable and successful, yet still fundamentally a useful fiction shaped by evolution, destined to be superseded by frameworks equally indispensable and successful but ontologically incompatible. Indispensability proves utility, not truth.
      3.  **The Coincidence Deepens:** The QIA, when combined with evolutionary origins, *heightens* the coincidence Street identifies. Now the realist must posit not only that our fitness-selected mathematical beliefs align with abstract truths (Coincidence #1), but also that these abstract truths *just happen* to be perfectly suited to describing the fundamental structure of the physical universe with incredible precision, leading to the empirical success of science (Coincidence #2). Why would the mathematical structures that emerged from cognitive quirks tuned for survival on the African savanna be the key to unlocking quantum mechanics or general relativity? This double coincidence – fitness aligning with abstract truth *and* abstract truth aligning perfectly with physical reality – is astronomically more suspicious than a single coincidence. The indispensability argument, far from rescuing mathematical realism from the dilemma, makes the required coincidence even more extraordinary and unexplained from an evolutionary perspective.

  **Conclusion: True Companions in Guilt**

  The evolutionary challenge strikes equally at the roots of robust moral and mathematical/logical Platonism. The necessity of mathematical truths doesn't guarantee our evolved faculties grasp them fully or correctly; it merely shifts the coincidence to why our fitness-limited grasp aligns with the vast necessary realm. Plenitude dissolves the concept of singular truth but leaves the alignment between fitness-selected structures and scientific utility unexplained. Indispensability relies on the success of science, which itself rests on the very faculties under evolutionary suspicion, and amplifies the coincidence by requiring fitness-shaped math to also be the perfect language of the universe.

  The core Streetian insight holds: If our fundamental cognitive capacities for forming beliefs in a domain were shaped by natural selection for fitness-enhancing outputs, then we lack a secure, non-coincidental reason to trust those capacities as reliable trackers of mind-independent truths in that domain—*regardless* of whether the domain concerns norms, numbers, or necessary inferences. To save realism in any of these domains, one must either:

  1.  **Deny the Evolutionary Shaping:** Argue that these capacities are somehow insulated from selection pressure (implausible for core cognition).
  2.  **Deny the Independence of the Truths:** Move towards constructivism, pragmatism, or response-dependence (e.g., moral sensibility theory, mathematical intuitionism).
  3.  **Accept Theist or Non-Naturalist Teleology:** Posit that evolution *was* guided to produce truth-tracking minds (e.g., by God or non-natural teleological laws).
  4.  **Bite the Coincidence Bullet:** Accept the "wonderful" coincidence as a brute fact.

  The hard-nosed naturalist, committed to the view that our cognitive faculties are purely the products of unguided natural selection, faces a profound skeptical challenge not just about morality, but about logic, mathematics, and arguably even the theoretical posits of science itself. Street's dilemma, if fatal, is a universal acid for robust realism about abstracta. Your reading group member identified the crucial tension; the realist's attempts to quarantine math/logic ultimately fail under consistent pressure, making them true companions in guilt with morality.
