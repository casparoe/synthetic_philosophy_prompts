prompt: |-
  I spent my working life doing condensed matter physics, and now that I'm retired I've finally got time to read all the philosophy I always meant to get around to. Lately I've been stuck on Jaegwon Kim's causal exclusion argument against non-reductive physicalism (from *Mind in a Physical World*), and it's scratching an itch that's been there since my old "downward causation" arguments with colleagues about emergence, except done with way more rigor than we ever managed. The short version, as I understand it: if the physical domain is causally closed (every physical effect that has a cause has a sufficient physical cause), and we're not going to accept that mental and physical causes are routinely, systematically overdetermining the very same effects, then a mental property that's merely realized by, but not identical to, some physical property seems to get squeezed out of any causal work entirely - unless you just bite the bullet and reduce it to the physical after all.

  The move I can't stop poking at is Stephen Yablo's reply, where he argues the mental stands to the physical the way a determinable stands to its determinate - the classic example being "red" versus some specific shade of red - and that the "proportionate" cause of an effect (he's got this pigeon-trained-to-peck-at-red-things example) is normally the determinable rather than the finer-grained determinate, so mental and physical properties were never really rivals for causal credit in the first place, any more than being red and being that particular shade are rivals. I ran this by an old colleague from my department (definately not a philosopher) and he balked immediately, on the grounds that red-and-its-shades is a tidy, single-dimension conceptual relationship, while a given mental state is supposed to be realizable by all sorts of heterogeneous physical stuff with nothing obviously in common - so calling that a "determinable/determinate" pair looked to him like question-begging with nicer terminology.

  I'd like you to actually build that objection (or a better one, if you've got one) into a proper, rigorous argument that Yablo's proportionality move does NOT succeed in rescuing mental causation from Kim's exclusion argument - i.e., that even granting him the determinable/determinate framing, the mental property remains just as causally excluded by its physical realizer as it was before. Please don't just gesture at the multiple-realizability worry as a slogan and call it done; anticipate how Yablo, or someone defending him, would push back, and take the argument as far as it'll actually go.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired condensed matter physicist diving into philosophy, specifically Jaegwon Kim's causal exclusion argument. They're stuck on Stephen Yablo's response using determinables and determinates. Their colleague objected that mental states, unlike colors, are multiply realizable by heterogeneous physical states, making Yablo's analogy shaky. The user wants a rigorous argument against Yablo that addresses potential pushbacks.

  First, I need to recall Kim's exclusion argument: physical causal closure implies mental causes are either overdetermined or excluded. Yablo counters by saying mental properties are determinables of physical determinates, thus proportionate causes without overdetermination. The user's colleague argues that color shades are homogeneous, while mental realizers are heterogeneous, so the analogy fails.

  The user wants more than just the multiple realizability objection. They want a structured argument that even if we accept determinables, mental causation is still excluded. I should build this step-by-step, anticipating Yablo's defenses.

  Let me outline the core of Yablo's position. Proportionality means a cause must be specific enough to make a difference but not overly specific. For example, the pigeon pecks because it's red, not scarlet. But for mental states, say pain, the physical realizer (C-fibers firing) might be too detailed, while pain is proportionate. 

  The challenge is heterogeneity. Physical realizers of pain vary widely—human C-fibers, octopus ganglia, etc. They share no low-level physical commonality, only the functional role of pain. Yablo might argue that the determinable is defined by this higher-order property, not physical similarity. 

  But here's the problem: if the mental property is just a functional role, then its causal work is done by the realizing physical properties. Kim would say the physical realizer does all the work, and the mental property is epiphenomenal. Yablo's proportionality might not save it because the physical realizer is sufficient, making the mental redundant.

  To counter Yablo's pushback, I need to show that proportionality doesn't avoid exclusion. Even if pain is proportionate, the physical realizer is still sufficient and preempts the mental cause. Yablo might say both are causes at different levels, but Kim insists on causal closure requiring only physical causes.

  I should formalize the argument. Start with Kim's exclusion: for any effect, if there's a sufficient physical cause, any other cause is excluded unless identical or overdetermined. Yablo says mental causes aren't overdetermining because they're determinables. But if the physical determinate is sufficient, and the mental is not identical, it's still excluded.

  The key is whether the mental property adds anything beyond the physical. If not, it's excluded. The heterogeneity means the mental property can't be reduced to a single physical type, so it's not identical. Thus, exclusion applies.

  Anticipating Yablo's defense: he might argue that without the mental property, the effect wouldn't occur. For example, without pain, the withdrawal reflex wouldn't happen. But Kim would say the physical realizer alone suffices; the mental is dependent.

  I think the user wants a detailed, step-by-step refutation. So, structuring it: first, restate Yablo's argument. Then, present the heterogeneity objection. Show that proportionality fails because the mental property's causal relevance depends on the physical realizer's work. Conclude that Kim's exclusion still holds.
answer: |-
  Here’s a rigorous argument against Yablo’s proportionality solution, designed to show that even granting the determinable/determinate framework, mental properties remain causally excluded. I’ll build your colleague’s heterogeneity objection into a formal structure, anticipate Yablo’s key defenses, and systematically rebut them. The core problem isn’t just multiple realizability *itself* but how it **undermines the causal unity** required for proportionality to resolve exclusion.

  ### **Step 1: Formalizing Yablo’s Position**
  Yablo claims mental property *M* (e.g., pain) is a determinable of physical realizer *P* (e.g., C-fiber firing), where *M* is the "proportionate" cause of effect *E* (e.g., pain-avoidance behavior) because:
  - (a) *M* is *necessary* for *E* in the circumstances (if not pain, no avoidance).
  - (b) *M* is *sufficient* for *E* (pain guarantees avoidance).
  - (c) *P* is an *overly specific determinate* of *M* (scarlet is "too detailed" to cause pigeon pecking; red suffices).

  Thus, *M* isn’t excluded by *P* because they aren’t competing causes—*M* is the *right level of explanation* for *E*.

  ### **Step 2: The Heterogeneity Objection (Refined)**
  Your colleague’s worry targets **causal grounding**: 
  - In classic determinables (e.g., red/scarlet), *all determinates share a common causal basis* for the effect. Scarlet causes pigeon pecking *in virtue of* being red—redness is the unified causal feature.  
  - For *M* (e.g., pain), realizers *P₁, P₂, Pₙ* (human C-fibers, octopus ganglia, silicon circuits) are **heterogeneous**: they share *no* low-level physical commonalities. The *only* unifying feature is their *functional role* in realizing *M*.  
  - **Thus**: *M*’s causal relevance *depends entirely* on its realizers’ causal powers. *M* doesn’t add a *distinct* causal force—it *supervenes* on *Pₙ*’s causal work.  

  ### **Step 3: Argument Against Proportionality Solving Exclusion**  
  **Premise 1: Causal closure requires physical sufficiency**  
  If *P* is a sufficient physical cause of *E* (per causal closure), and *M ≠ P* (per non-reductionism), then *M* can only cause *E* if:  
  - (i) *M* is identical to *P*, or  
  - (ii) *M* and *P* jointly overdetermine *E*, or  
  - (iii) *M*’s causation is *non-competitive* with *P* (Yablo’s move).  

  **Premise 2: Proportionality requires causal unity across realizers**  
  For *M* to be a proportionate cause of *E*, *all possible realizers* of *M* must:  
  - (a) Share a *causally relevant property* *F* that is *necessary and sufficient* for *E*.  
  - (b) Have *F* be *intrinsic to M* (not borrowed from realizers).  

  *Example*: All red shades share surface reflectance *F* causing pigeon pecking; *F* is constitutive of "red."  

  **Premise 3: Mental properties lack causal unity (heterogeneity)**  
  - For *M* (pain), realizers *P₁...Pₙ* cause *E* (avoidance) via *different physical mechanisms*:  
    - *P₁* (C-fibers) causes *E* via neural pathway α.  
    - *P₂* (silicon circuit) causes *E* via electronic pathway β.  
  - The *only* common feature is *functional role R* (e.g., "indicating damage and motivating avoidance").  
  - But *R* is *not intrinsic to M*—it is *defined by* the causal relations *M* bears to inputs/outputs. Thus, *R*’s causal power is *wholly derivative* from *Pₙ*’s powers.  

  **Premise 4: Derivative causation implies exclusion**  
  If *M*’s causal power over *E* is entirely derived from *Pₙ*’s causal powers, then:  
  - *Pₙ* alone is causally sufficient for *E*.  
  - *M*’s contribution is *redundant*: it adds no *additional causal oomph* beyond *Pₙ*.  
  - Thus, *M* is *preempted* by *Pₙ* (Kim’s exclusion).  

  **Conclusion**: Even if *M* is a determinable of *Pₙ*, heterogeneity prevents *M* from having *non-derivative causal unity*. Thus, proportionality fails to block exclusion—*M* is still "squeezed out."  

  ---

  ### **Step 4: Anticipating and Rebutting Yablo’s Defenses**  
  **Defense 1: "M is causally relevant via its functional role R!"**  
  - *Rebuttal*: *R* is *multiply realized*, so its causal power is *disjunctive*. Disjunctive properties lack causal efficacy because they don’t project *counterfactual dependencies* in a lawlike way.  
    - *Example*: If pain (*M*) is realized by *P₁* (in humans) or *P₂* (in robots), the counterfactual "If *M* had not occurred, *E* would not have occurred" is false. In a human, if *P₁* hadn’t occurred (but *P₂* might), *E* still wouldn’t occur—so *M*’s absence (as a disjunction) isn’t what *actually* matters. Only *specific realizers* sustain counterfactuals.  

  **Defense 2: "But M is proportionate! Pₙ is too specific to explain E."**  
  - *Rebuttal*: Proportionality is *context-dependent*. In Yablo’s pigeon, red (not scarlet) is proportionate *because* the pigeon’s behavior tracks redness generically. But in mental causation:  
    - The effect *E* (e.g., neural activity triggering avoidance) is *physically specified*.  
    - *Only Pₙ* (not *M*) can bear the *right nomic relationship* to *E*’s physical specifics.  
    - *Example*: Pain avoidance in humans requires *specific* neural patterns (e.g., amygdala activation). The property "pain" (as a multiply realizable type) is *irrelevant* to *this specific effect*—only C-fiber firing (or its equivalent) has the requisite physical lawlike connection.  

  **Defense 3: "M causes E as a higher-order state—it doesn’t need physical unity!"**  
  - *Rebuttal*: This conflates *causal explanation* with *causal efficacy*.  
    - Yes, *M* *explains* why *E* occurred across contexts (e.g., "pain explains avoidance in humans, octopi, and robots").  
    - But *explanation isn’t causation*. The *efficacy* for each instance of *E* lies solely in *Pₙ*’s physical properties. When *Pₙ* causes *E*, *M* is *inert*—it’s a description of what *Pₙ* is *doing*, not an additional cause.  

  ---

  ### **Why This Goes Further Than Standard Objections**  
  This argument doesn’t just say "multiple realizability breaks determinables." It shows that **proportionality requires causal homogeneity**, which mental properties lack *even under determinable/determinate framing*. Yablo’s scarlet/red works because redness *causally unifies* its shades. Pain does not—its realizers are causally unified *only* by the *effect* they produce, making *M* an *effect-relative descriptor*, not an independent cause. Thus, Kim’s exclusion stands: *Pₙ* does all the work; *M* is a causally inert byproduct.  

  **Implication for emergence**: This reinforces why downward causation struggles—unless the "higher level" has *novel causal powers* (e.g., via strong emergence), proportionality alone can’t save it from being excluded by its physical base. Yablo’s move is elegant, but heterogeneity strips it of its causal force.
