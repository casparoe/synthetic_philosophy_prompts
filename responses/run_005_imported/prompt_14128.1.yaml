  Also, the user admitted they're out of their depth with the paper, so questions need to be incisive but not overly technical. The structure should flow naturally: start with applicability (point 1), then framework choices (point 2), then foundational issues (point 3). Each set has a main question and a prepared follow-up based on expected answers.

