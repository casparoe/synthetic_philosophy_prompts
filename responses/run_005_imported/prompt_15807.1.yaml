answer: |-
  You've hit on one of the most enduring and sophisticated debates in political philosophy and social choice theory! Your intuition aligns perfectly with Harsanyi's critique. However, Rawls had *very specific* and philosophically grounded reasons for rejecting the Bayesian expected utility approach (leading to average utilitarianism) in favor of maximin. It wasn't sloppiness; it was a deliberate choice based on his conception of the original position and justice. Let's break it down:

  1.  **The Core Disagreement: Risk vs. Radical Uncertainty under the Veil:**
      *   **Harsanyi's View (Bayesian/Expected Utility):** As you said, behind the veil, individuals are ignorant of their position but can still assign *probabilities*. Assuming no reason to favor one position over another, they assign *equal probability* to landing in any social position. They then rationally maximize their *expected utility*. This leads directly to choosing the social arrangement that maximizes the *average* utility across society (Average Utilitarianism).
      *   **Rawls's View (Maximin under Radical Uncertainty):** Rawls argues that the veil of ignorance creates a situation of **radical uncertainty**, not mere risk with known or reasonably estimable probabilities.
          *   **No Basis for Probabilities:** Individuals behind the veil have *no knowledge whatsoever* about the structure of their society, its history, its demographics, or the likelihood of ending up in any particular position. They lack *any* information to ground a probabilistic assessment, even an equal probability one. Assigning equal probabilities is, for Rawls, an *arbitrary assumption* smuggled in from outside the constraints of the veil. It presumes knowledge (that positions are symmetric in a probabilistic sense) that the veil explicitly denies.
          *   **The Thickness of the Veil:** Rawls deliberately makes the veil "thick" enough to exclude *any* knowledge that could bias the choice of principles, including probabilistic knowledge. The point is to force a choice based purely on securing fundamental interests (primary goods), not on gambling calculations.

  2.  **Why Maximin is Rational *in this Specific Context*:**
      Rawls argues maximin is rational under the veil when three specific conditions are met (which he believes they are):
      *   **Condition 1: No Reliable Probabilities:** As above – the decision-maker has no basis for assigning probabilities to the possible outcomes (social positions). (This directly contradicts Harsanyi's setup).
      *   **Condition 2: The Worst-Case Outcome is Intolerably Bad:** The decision-maker cares so much about avoiding the worst possible outcome that they are willing to sacrifice potentially higher gains under other outcomes to rule it out. In the original position, the "worst outcome" is being a member of the *least advantaged group* in society. Rawls argues that because individuals care about their *basic liberties, self-respect, and fundamental interests (primary goods)*, ending up in a position where these are severely compromised (e.g., destitute, oppressed, lacking basic opportunities) is an unacceptable risk that rational agents would prioritize avoiding.
      *   **Condition 3: Gains Above the Minimum Don't Matter Much:** The potential gains offered by other principles (like average utilitarianism) above the secured minimum are not significant enough to outweigh the catastrophic risk of the worst-case scenario. Once basic liberties and a decent minimum share of primary goods are secured, further gains in average utility are less compelling compared to the risk of falling below that threshold.

  3.  **The Moral Argument Embedded in the Setup:**
      *   **Justice as Fairness, Not Gambling:** Rawls fundamentally sees the choice of basic social principles as a matter of *justice*, not a gamble. Using expected utility calculations, even with equal probabilities, treats people's life chances as stakes in a lottery. Rawls finds this morally repugnant. Justice requires guaranteeing that the basic structure of society doesn't create positions that are *intrinsically unacceptable*, regardless of how many people might benefit.
      *   **The Priority of the Worst-Off:** The Difference Principle (which follows from maximin in this context) embodies a strong moral commitment: social and economic inequalities are only justifiable if they work to the *absolute* benefit of the least advantaged. This reflects a fundamental concern for reciprocity and the idea that no one should be left behind as mere means to the greater good of others. Average utilitarianism could easily justify sacrificing the worst-off if it raises the average enough – a trade-off Rawls explicitly rejects as unjust.

  4.  **Harsanyi vs. Rawls: The Stakes:**
      *   **Harsanyi:** Focuses on *rational choice under impartial uncertainty*. The outcome (average utilitarianism) maximizes *ex-ante* expected welfare.
      *   **Rawls:** Focuses on *establishing fair terms of social cooperation* that guarantee basic freedoms and a minimum position compatible with self-respect and dignity *no matter who you turn out to be*. The outcome (justice with the difference principle) prioritizes the *ex-post* guarantee for the worst-off.

  **Conclusion:**

  Rawls wasn't being sloppy; he was making a profound philosophical argument about the nature of the choice under the veil and the demands of justice. He deliberately constructed the original position to exclude probabilistic reasoning because he believed:

  1.  **Epistemic Constraint:** There genuinely *is* no basis for assigning probabilities.
  2.  **Moral Constraint:** Justice requires principles that protect fundamental interests unconditionally, not principles chosen by gambling on people's lives. The stakes (basic liberties, self-respect) are too high for probabilistic trade-offs.
  3.  **Rationality under Radical Uncertainty:** When facing potentially catastrophic worst-case scenarios without probabilistic knowledge, focusing solely on securing the best possible worst-case outcome (maximin) *is* the rational strategy.

  So, while Harsanyi's setup *is* coherent and rational within *its own* assumptions (impartial observers with probabilistic knowledge), Rawls forcefully argues that *his* thicker veil of ignorance creates a fundamentally different decision problem – one defined by radical uncertainty and high stakes – where maximin becomes the uniquely rational and morally compelling choice. The debate hinges entirely on whether you accept Rawls's characterization of the epistemic and moral constraints within the original position. Your reading group is grappling with the very heart of modern liberal egalitarian theory!
