  Okay, the user wants me to compare Simon Blackburn's and Allan Gibbard's solutions to the Frege-Geach problem for expressivism. Let me start by recalling what the Frege-Geach problem is. Expressivists say moral statements express non-cognitive attitudes like approval or disapproval. But the problem arises when these statements are embedded in complex sentences, like conditionals or negations. How do you explain the meaning of "If lying is wrong, then getting your brother to lie is wrong" without treating "lying is wrong" as a truth-apt assertion?

  Blackburn's quasi-realism uses a "logic of attitudes." He analyzes accepting a conditional as having a higher-order attitude. For example, accepting "If lying is wrong, then getting your brother to lie is wrong" means disapproving of both approving of lying and not disapproving of getting your brother to lie. Logical inconsistency is explained as a clash of attitudes that can't be jointly satisfied. But I wonder if this approach handles all embeddings well. What about negations or disjunctions? If someone says "Lying isn't wrong," does Blackburn explain that as a rejection of the attitude of disapproval? How about iterated embeddings, like conditionals within conditionals? That might get messy.

  Gibbard's norm-expressivism uses a possible-worlds model with hyperplans. Hyperplans are like complete sets of instructions for what to do in any situation. So moral claims express states of planning. A sentence is true relative to a world-hyperplan pair. This way, logical connectives work as usual. The truth conditions for "not wrong" or "P or Q" are straightforward using set complements and unions. Consistency in disagreement means that the same world-hyperplan pair can't satisfy both conflicting statements. That seems more unified.

  Now, comparing generality: Gibbard's approach seems more systematic. He uses standard logic over the world-hyperplan pairs. Blackburn's higher-order attitudes might work for simple cases but could become ad-hoc with complex embeddings. For example, negation as a higher-order attitude might not capture the full logical force. Also, iterated embeddings could lead to infinitely complex attitudes, which is problematic.

  On explaining disagreement: Gibbard's account clearly shows that two speakers disagree logically when their statements can't be true in any same world-hyperplan pair. Blackburn explains inconsistency as conflicting attitudes that can't coexist. But is that as strong? It might reduce to practical inconsistency rather than logical contradiction. Gibbard's model preserves the standard notion of logical inconsistency better.

  Can Blackburn borrow from Gibbard? Maybe by incorporating a planning framework. But Blackburn's quasi-realism is rooted in projectivism, which might resist such formal semantics. Still, adopting hyperplans could help systematize attitudes. However, it might lose the essence of quasi-realism, which is explaining moral discourse without positing truth conditions.

  The user is likely a philosophy student or researcher looking for a clear comparison to understand which solution is more robust. They might need this for a paper or thesis. Their deeper need is to grasp the strengths and weaknesses of each approach and whether a hybrid solution is viable. They might also be interested in the broader implications for expressivism's viability against realist theories.

  In conclusion, Gibbard's approach seems more general and less ad-hoc, especially for complex embeddings. Blackburn's method, while innovative, struggles with full logical range. Borrowing hyperplans could help Blackburn, but it might compromise his projectivist foundations. The user might benefit from seeing why Gibbard's model is more extensible and how it handles logical disagreement more robustly.
answer: |-
  ## Comparing Blackburn and Gibbard on the Frege-Geach Problem

  Both Blackburn's quasi-realism and Gibbard's norm-expressivism offer sophisticated expressivist solutions to the Frege-Geach problem, which challenges expressivism to explain the logical behavior of moral sentences when embedded in complex contexts (conditionals, negation, disjunction, etc.) without appealing to truth-conditional meaning. However, their strategies differ significantly, leading to different strengths and weaknesses regarding generality, non-ad-hocness, and explaining logical inconsistency in disagreement.

  1.  **Blackburn's Quasi-Realism (Logic of Attitudes):**
      *   **Core Idea:** Accepting a complex sentence (e.g., a conditional like "If lying is wrong, then getting your brother to lie is wrong") is analyzed as having a *higher-order attitude* towards combinations of first-order attitudes. Logical inconsistency arises when the attitudes expressed by the premises cannot be jointly satisfied in practice.
      *   **Mechanism:**
          *   "Lying is wrong" expresses disapproval of lying (D(L)).
          *   The conditional expresses a higher-order attitude: disapproval of *combining* D(L) with *not* having D(getting brother to lie). It's disapproval of (D(L) & ~D(GBL)). This is a state of mind that *cannot* hold D(L) while being indifferent or approving of GBL.
          *   **Logical Connectives:** Each connective requires a bespoke attitudinal analysis:
              *   **Negation ("~P"):** Disapproval of the attitude expressed by P (e.g., disapproval of D(L) for "Lying is not wrong").
              *   **Disjunction ("P v Q"):** Disapproval of having *neither* the attitude for P *nor* the attitude for Q. It's disapproval of (~Att-P & ~Att-Q).
              *   **Iterated Embeddings:** Higher-order attitudes become increasingly complex. For example, "If (If P then Q) then R" involves an attitude towards attitudes towards attitudes. While formally possible, it becomes psychologically implausible and structurally unwieldy.
      *   **Explanation of Inconsistency:** Two speakers disagree logically if the *attitudes* they express are *practically inconsistent* – it is impossible for a single agent to hold both sets of attitudes coherently at the same time. Disapproving of lying and approving of lying cannot coexist in a single coherent psychology.
      *   **Strengths:** Deeply rooted in the expressivist core – moral language fundamentally expresses practical stances. Explains why logic *matters* for practice (incoherent attitudes lead to practical incoherence). Handles simple modus ponens elegantly.
      *   **Weaknesses:** The analysis of logical connectives feels **ad-hoc** and **disunified**. Each connective requires a different, complex attitudinal recipe. **Iterated embeddings** become extremely cumbersome and psychologically implausible (e.g., attitudes about attitudes about attitudes). Explaining why the "logic of attitudes" perfectly mirrors classical logic is challenging. **Generality** is limited; it works best for simple connectives and struggles with complex logical structures common in ordinary discourse.

  2.  **Gibbard's Norm-Expressivism (World-Norm/Plan Semantics):**
      *   **Core Idea:** Normative judgments express states of *planning* or *acceptance of norms*. He models this using a **possible-worlds-style semantics**, but where truth is evaluated relative to pairs: a possible world (w) *and* a maximally specific "hyperplan" (h) – a complete set of contingency plans for what to do in any conceivable situation.
      *   **Mechanism:**
          *   "Lying is wrong" is true relative to (w, h) iff the hyperplan h *rules out* lying in w.
          *   **Logical Connectives:** They are analyzed *exactly* as in standard truth-conditional semantics, but relative to (w, h) pairs:
              *   **Negation ("~P"):** True at (w, h) iff P is *not* true at (w, h).
              *   **Disjunction ("P v Q"):** True at (w, h) iff P is true at (w, h) *or* Q is true at (w, h) (or both).
              *   **Conditional ("If P then Q"):** True at (w, h) iff *if* P is true at (w, h), *then* Q is true at (w, h).
              *   **Iterated Embeddings:** Handled seamlessly via recursive application of the standard semantic rules. "If (If P then Q) then R" poses no special problem beyond the inherent complexity of the formula.
      *   **Explanation of Inconsistency:** Two speakers have a logically inconsistent moral disagreement if there is *no single pair (w, h)* relative to which both of their claims are true. Their expressed planning states are *logically incompatible* across all possible worlds and hyperplans. If one says "Lying is wrong" (h rules out lying) and the other says "Lying is not wrong" (h does *not* rule out lying), there is no (w, h) pair satisfying both statements.
      *   **Strengths:** Offers a **unified, non-ad-hoc** treatment of *all* logical connectives and embeddings using standard semantic tools. Handles **iterated embeddings** with ease and naturalness. Provides a clear, formal explanation for why normative discourse exhibits classical logical structure. **Generality** is high; it easily extends to the full range of complex logical constructions. Provides a clear, objective criterion for logical inconsistency in disagreement.
      *   **Weaknesses:** The ontological commitment to hyperplans (maximally specific contingency plans) is heavy and arguably psychologically unrealistic. The expressivist "flavor" – that moral claims fundamentally express non-cognitive states – can seem obscured by the formal truth-conditional apparatus, potentially making it look more like a form of realism. Explaining why *planning states* are the right kind of state for expressivism requires careful argument.

  ## Evaluation: Which Approach is Stronger?

  1.  **Generality and Non-Ad-Hocness:** **Gibbard's approach is decisively stronger.** His use of a standard possible-worlds (or rather, world-plan) semantics provides a single, unified framework for analyzing *all* logical connectives (negation, disjunction, conjunction, conditional, quantifiers) and embeddings of *any* depth. The rules are familiar, systematic, and non-ad-hoc. Blackburn's approach, while ingenious, requires inventing distinct, complex attitudinal analyses for each logical operator. This feels piecemeal, ad-hoc, and struggles significantly with iterated embeddings, making it less general across the full range of connectives and complex sentences found in real discourse.

  2.  **Explaining Logical Inconsistency in Disagreement:** **Gibbard's explanation is more robust.** He provides a clear, objective, logical criterion: inconsistency arises when two claims *cannot be jointly true relative to any (w, h) pair*. This mirrors the standard semantic account of logical inconsistency for descriptive claims (incompatibility across all worlds). Blackburn's explanation – practical impossibility of jointly *holding* the attitudes – is compelling for simple cases but is less straightforwardly *logical*. It relies on a substantive claim about psychological coherence that might not perfectly map onto logical inconsistency (e.g., could there be logically inconsistent attitudes that are *not* practically incoherent for some agents?). Gibbard's account more directly captures the idea that the disagreement is *about how the world ought to be guided*, and their views cannot coexist in a single coherent system of guidance.

  **Conclusion:** Gibbard's norm-expressivism, utilizing a world-hyperplan semantics, offers the **more general, less ad-hoc, and more robust explanation of embedding and logical inconsistency** for expressivism. Its systematic, unified treatment of logic using standard semantic tools grants it significant advantages over Blackburn's more bespoke "logic of attitudes," especially regarding complex embeddings and providing a clear criterion for logical inconsistency in disagreement.

  ## Can Blackburn Borrow from Gibbard? A Potential Repair

  Yes, elements of Gibbard's framework could potentially strengthen Blackburn's quasi-realism, although it might dilute its distinctiveness:

  1.  **Incorporating Plans/Hyperstates:** Blackburn could adopt the idea that fundamental normative attitudes are *planning states* or commitments to norms governing action and feeling, rather than simpler pro/con attitudes. This provides a richer, more structured object for higher-order attitudes to target.
  2.  **Formalizing the "Logic of Attitudes":** Instead of analyzing each connective via bespoke attitudes, Blackburn could use the world-hyperplan framework *as a model* for the "satisfaction conditions" of attitudes. Accepting "If P then Q" could be understood as having an attitude whose satisfaction *entails* that whenever the planning state for P is satisfied in a (w, h) pair, so is the state for Q. This leverages Gibbard's formal machinery to systematize Blackburn's core insight about higher-order disapproval of combinations.
  3.  **Explaining Inconsistency:** Blackburn could explicitly define the "practical impossibility" of jointly satisfying attitudes in terms of Gibbard's criterion: the attitudes expressed by two claims are inconsistent if there is *no possible (w, h) pair* relative to which *both* planning states expressed by the claims are realized. This grounds the practical incoherence in a clearer logical incompatibility.

  **Potential Cost:** This move risks making quasi-realism look more like Gibbard's view. The core projectivist idea – that we *project* attitudes onto the world creating the *illusion* of moral truth – might become harder to maintain when employing a formal semantics that looks so much like a truth-conditional account. Blackburn might argue the semantics is merely a useful *model* of our practical commitments, not a description of moral reality, preserving the quasi-realist spirit. However, the boundary becomes finer.

  Ultimately, while borrowing Gibbard's resources could make Blackburn's solution *more systematic and general*, it arguably moves towards Gibbard's framework. Gibbard's proposal already provides the more powerful and general expressivist solution to Frege-Geach, making a repaired Blackburn view potentially converge with it.
