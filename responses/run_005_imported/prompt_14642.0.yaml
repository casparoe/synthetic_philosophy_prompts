  **MEMORANDUM**  
  To: Inter-Club Council, Robotics Club President, Photography Club President  
  From: [Your Name], ICC Representative  
  Date: October 26, 2023  
  Subject: **Fair Allocation of Joint Car Wash Proceeds ($1,800)**  

  ### **Recommended Solution**  
  After reviewing the dispute, the ICC recommends splitting the **$1,800** as follows:  
  - **Robotics Club: $1,115**  
  - **Photography Club: $685**  

  This allocation uses the **Kalai-Smorodinsky (KS) solution**, a fairness principle endorsed by neutral economists. It ensures both clubs benefit equally *relative to their best possible outcomes* (unlike simple splits or hours-worked methods).  

  ---

  ### **Why This Is Fair: Plain English Explanation**  
  Imagine both clubs are runners in a relay race. Robotics can sprint **700 meters alone** (their guaranteed solo earnings), but with perfect conditions, they *could* hit **1,600 meters** (best-case scenario). Photography can run **500 meters alone**, but maxes out at **900 meters** (their hard ceiling).  

  By teaming up, they ran **1,800 meters together**—farther than either could alone. The KS solution asks:  
  > *"What split lets both clubs reach the* **same percentage** *of their personal bests, starting from their solo run?"*  

  #### Here’s the math (simplified):  
  1. **Robotics’ "Opportunity Range":**  
     - Solo: $700 → Best-case: $1,600  
     - *Possible gain through teamwork*: **$900** ($1,600 - $700)  

  2. **Photography’s "Opportunity Range":**  
     - Solo: $500 → Best-case: $900  
     - *Possible gain through teamwork*: **$400** ($900 - $500)  

  3. **Teamwork’s Total Added Value:**  
     - Combined solo earnings: $700 + $500 = **$1,200**  
     - Actual joint earnings: **$1,800**  
     - *Extra value created by cooperating*: **$600**  

  The KS solution divides the **$600 bonus** so both clubs achieve **equal progress toward their best-case scenarios**:  
  - Robotics gets **46.2%** of their $900 opportunity ($415 bonus → $700 + $415 = $1,115).  
  - Photography gets **46.2%** of their $400 opportunity ($185 bonus → $500 + $185 = $685).  

  **Why not 50/50?**  
  Splitting evenly ($900 each) ignores Photography’s lower ceiling. Giving Robotics $1,300 ignores Robotics’ reliance on Photography’s members to exceed $1,600. KS balances both constraints.  

  ---

  ### **Addressing Concerns: Why Neither Club Is "Cheated"**  
  - **Robotics might feel shortchanged** ("We could’ve made $1,600!"):  
    Yes, but *solo*, you’d only guarantee $700. With Photography’s help, you cleared $1,115—**$415 more than solo**, and far above your *realistic* expectation. Without them, hitting $1,600 was unlikely.  

  - **Photography might feel undercut** ("We’re getting less than our $1,000 ask!"):  
    Your solo earnings were $500. Here, you get $685—**$185 more than solo**. Your $900 ceiling made teamwork essential to unlock the extra $600. Demanding $1,000 (66% of the bonus) ignores Robotics’ larger growth potential.  

  **The Big Picture**:  
  - **Cooperation created $600 in "new value."**  
  - KS ensures both clubs **share that value proportionally** to what was *possible* for each.  
  - Any other split lets one club exploit the other’s limitations.  

  ---

  ### **If a Club Rejects This Solution**  
  Per ICC bylaws (§4.3):  
  1. Funds will be **held in escrow** by the school until both parties agree.  
  2. The rejecting club forfeits **ICC funding/event support** for the next semester.  
  3. Future joint ventures between these clubs will require **ICC pre-approval of profit splits**.  

  ---

  ### **Next Steps**  
  1. Vote to approve this allocation at the upcoming meeting.  
  2. Presidents sign a joint agreement (drafted by ICC).  
  3. Funds disbursed within 48 hours of signing.  

  **Compromise isn’t surrender—it’s respecting what each brings to the table.** This solution honors both clubs’ contributions while ensuring neither bears disproportionate risk. Let’s put the dispute behind us and celebrate a successful collab!  

  ---  
  *Appendix: KS Calculation Summary*  
  - *Robotics:* $700 + [($1,600 - $700) × λ]  
  - *Photography:* $500 + [($900 - $500) × λ]  
  - Solve $700 + 900λ + $500 + 400λ = $1,800 → λ = 0.462  
  - Robotics: $700 + (900 × 0.462) = $1,115  
  - Photography: $500 + (400 × 0.462) = $685
