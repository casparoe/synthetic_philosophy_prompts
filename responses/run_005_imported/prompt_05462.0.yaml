     Majority:
          P: true (1,3) -> true.
          Q: false (2,3) -> false.
          R: true (1,2) -> true.

     Inconsistent because true and false -> R should be false.

     Premise-based: if we take P and Q, then by majority: P true, Q false. Then we deduce R: false. So collective: P, ¬Q, ¬R.

     Kemeny: We did this earlier and got the same: P, ¬Q, ¬R with total distance 4 (and other sets also had 4, but this was one of them).

     But what if we have:

       Judge 1: P, Q, R
       Judge 2: ¬P, ¬Q, R
       Judge 3: ¬P, Q, ¬R   # consistent: ¬P and Q, then R should be false? Because (P↔Q) is false when ¬P and Q -> so R false.

     Majority:
          P: false (2,3) vs true (1) -> false.
          Q: true (1,3) vs false (2) -> true.
          R: true (1,2) vs false (3) -> true.

     Check: P false, Q true -> R should be false. But we have R true -> inconsistent.

     Premise-based: P false, Q true -> deduce R: (P↔Q) is (false↔true)=false -> R false. So collective: ¬P, Q, ¬R.

     Kemeny: Find consistent sets with min distance.

     The inconsistent set (¬P, Q, R) has distance:
          J1: P: different, Q same, R same -> 1.
          J2: P same, Q different (J2 has ¬Q), R same -> 1.
          J3: P same, Q same, R different -> 1.
          Total: 3.

     Consistent sets:

       Set A: P, Q, R -> 
          J1:0, 
          J2: P different, Q different, R same -> 2.
          J3: P different, Q same, R different -> 2.
          Total: 4.

       Set B: ¬P, ¬Q, R -> 
          J1: P different, Q different, R same -> 2.
          J2:0.
          J3: P same, Q different, R different -> 2.
          Total: 4.

       Set C: P, ¬Q, ¬R -> 
          J1: P same, Q different, R different -> 2.
          J2: P different, Q same (J2 has ¬Q, so if we have ¬Q, then same), R different -> 2.
          J3: P different, Q different (J3 has Q, we have ¬Q), R same? (J3 has ¬R, we have ¬R) -> same -> 2.
          Total: 6.

       Set D: ¬P, Q, ¬R -> 
          J1: P different, Q same, R different -> 2.
          J2: P same, Q different, R different -> 2.
          J3:0 -> total 4.

     So the Kemeny winners are Set A, Set B, and Set D, each with distance 4.

     The premise-based outcome is Set D: ¬P, Q, ¬R.

     But note: Set D is among the winners. So they might still agree if we pick Set D.

     However, if the tie-breaking rule in Kemeny picks Set A or Set B, then we get a different outcome.

     For example, if Kemeny tie-breaks by alphabetical order on the proposition values and picks Set A: (P, Q, R), then this is different from the premise-based outcome (¬P, Q, ¬R).

     So they can disagree when there are multiple Kemeny winners and the tie-breaking does not pick the premise-based outcome.

     Therefore, in general, they can disagree when the agenda is more complex than two independent premises and a conjunction, and there are multiple consistent sets that are equally close to the profile.

     Specifically, in the example above with the equivalence agenda and three judges, the premise-based procedure yields Set D, but the Kemeny rule has three winners (including Set D) and might choose a different one.

     So the note: "The Kemeny rule and the premise-based procedure may disagree when there are multiple consistent judgment sets that are equally close to the profile (in terms of Hamming distance) and the tie-breaking in the Kemeny rule does not select the judgment set derived by the premise-based method. This can happen in agendas that are not simple conjunctions, such as agendas with equivalence (P↔Q) or other non-monotonic operators."
