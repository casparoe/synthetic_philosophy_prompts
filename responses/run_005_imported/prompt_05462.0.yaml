     After several tries, it appears they often agree. 

     But literature suggests they can disagree. Let me recall:

     In "Judgment Aggregation: A Survey" by List and Puppe, they might have an example.

     Alternatively, consider a non-symmetric example:

     Agenda: P, Q, R, with R = (P∧Q) ∨ (¬P∧¬Q)   [which is P↔Q]

     Judges:

