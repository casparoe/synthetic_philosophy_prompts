    "justifications": {
      "Quota rules with proposition-specific thresholds": "A: Sacrifices neutrality across propositions but maintains consistency by design. Highly tractable (linear time) for any group size. Robust in complex agendas when thresholds are properly calibrated. Best balance of consistency and practicality for real committees.",
      "Premise-based procedure": "B: Sacrifices systematicity (treats premises/conclusions asymmetrically) but guarantees consistent outcomes. Computationally trivial. Breaks down when premises aren't clearly identifiable or when logical dependencies are non-monotonic (e.g., implications with disjunctions).",
      "Distance-based (Kemeny) procedure": "B: Sacrifices tractability (NP-hard for agendas >10 propositions) but preserves collective rationality and minimizes disagreement. Optimal for consistency but impractical for large/complex agendas. Best reserved for small panels (<10 members) with computational support.",
      "Sequential/priority procedures": "C: Sacrifices order-independence (outcomes path-dependent). Computationally feasible but vulnerable to agenda manipulation. Degrades severely in complex agendas with bidirectional logical dependencies where priority ordering becomes arbitrary.",
      "Conclusion-based procedure": "D: Sacrifices collective rationality (ignores premise-conclusion consistency). While computationally trivial, it produces logically incoherent outcomes in interconnected agendas. Only viable when no reasoning transparency is required."
    },
    "Kemeny_vs_premise_note": "They disagree when the agenda contains logical connections beyond conjunctions, particularly with: (1) Disjunctive dependencies (e.g., R = P∨Q) under split majorities, or (2) Biconditional relationships (e.g., R ↔ (P∧Q)∨(¬P∧¬Q)) where Kemeny may prioritize global coherence over premise majorities. Example: In R↔(P↔Q) with judges {(P,Q,R), (¬P,¬Q,R), (¬P,Q,¬R)}, premise-based yields (¬P,Q,¬R) while Kemeny may select (P,Q,R) if tie-breaking favors that outcome."
  }
  ```

  ### Key Rationale:
  - **Quota rules** earn **S-tier** by avoiding impossibility through tailored thresholds (sacrificing neutrality) while excelling in tractability and scalability. They're the only method that remains both consistent *and* feasible in agendas like multi-premise chains (A→B→C) or nested conditionals.
  - **Premise-based** and **Kemeny** are **A-tier** but flawed: Premise-based fails when premises are contested (e.g., judicial panels debating which facts are "premises"); Kemeny becomes computationally prohibitive with >20 propositions.
  - **Sequential procedures** (**B-tier**) work acceptably only with natural priority orders (e.g., constitutional courts with stare decisis), but fail catastrophically in circular agendas (e.g., P→Q→R→P).
  - **Conclusion-based** (**C-tier**) is relegated to D-tier *despite* its simplicity because it fundamentally abandons rational justifiability – the core concern of your research.

  ### Kemeny-Premise Divergence Explained:
  They disagree when the logical operators in the agenda enable **multiple coherence pathways**. Specifically:
  - In disjunctions (e.g., R=P∨Q), if majorities reject P and Q individually but accept R, premise-based rejects R while Kemeny accepts it to match individual judgments.
  - In biconditionals (e.g., R↔(P↔Q)), Kemeny may prioritize minimizing total judgment flips over premise majorities when the Hamming distance to multiple consistent sets is equal (see embedded example in JSON). This worsens with negated premises or XOR relationships.

  This reflects how Kemeny optimizes for *global* coherence while premise-based enforces *local* (premise-determined) coherence. The divergence emerges precisely when the path from premises to conclusions isn't injective.
