          Total: 0+1+0 = 1.

     Any other consistent set? For example, (¬P, Q, ¬R) has distance:
          J1: ¬P same, Q different, ¬R same -> 1.
          J2:0.
          J3: ¬P same, Q different (J3 has ¬Q, we have Q) -> different, ¬R same -> 1.
          Total: 2.

