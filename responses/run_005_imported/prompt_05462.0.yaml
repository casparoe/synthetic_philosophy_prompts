          J1: 4 (all different)
          J2: 2 (P same? J2 has ¬P -> same; Q: J2 has Q -> different; R same; S: J2 has S -> different) -> 2.
          J3: 3 (P: different, Q same? J3 has ¬Q -> same? we have ¬Q, so same; R same; S: different) -> 1? 
