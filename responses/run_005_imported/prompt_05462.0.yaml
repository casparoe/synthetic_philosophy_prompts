  We are comparing five procedures for collective decision-making in multi-member bodies on logically interconnected propositions:
   1. Premise-based procedure (PBP)
   2. Conclusion-based procedure (CBP)
   3. Sequential/priority procedure (SP)
   4. Distance-based (Kemeny-style) procedure (KEM)
   5. Quota rules with proposition-specific thresholds (QUOTA)

   We consider:
   (a) Which property is given up to escape the impossibility (like systematicity, collective rationality, order-independence, neutrality, etc.)
   (b) Tractability with 10-50 members (computational and practical)
   (c) Robustness to complex agendas (beyond simple independent premises and a conjunction)

   We rank from S (best) to D (worst) for a committee-design audience.

   Breakdown of properties:

   1. Premise-based procedure (PBP):
      - Votes are taken on premises, and the conclusion is deduced.
      - Gives up: systematicity (because it treats premises and conclusions differently) and may not reflect the collective view on the conclusion.
      - Tractability: Very tractable; only requires majority votes on each premise.
      - Breaks down: When the agenda is complex (e.g., with multiple levels of logical connections, disjunctions, or when premises are not independent) and when there is no clear set of premises.

   2. Conclusion-based procedure (CBP):
      - Only the conclusion is voted on, ignoring the premises.
      - Gives up: collective rationality (because the collective judgment on the conclusion might be inconsistent with the judgments on the premises, but we don't even check the premises) and any information about the reasoning.
      - Tractability: Very tractable; just one vote on the conclusion.
      - Breaks down: When the body is expected to provide reasons or when the premises are important for the legitimacy of the decision. Also, in complex agendas, it avoids the logical connections entirely.

   3. Sequential/priority procedure (SP):
      - Fixes an order of propositions and decides each by majority, but if later decisions are inconsistent, earlier ones are locked in and later ones adjusted? Actually, in the standard sequential priority, we fix an order and decide each proposition in that order by majority, but then we enforce consistency by discarding the votes on later propositions that would cause inconsistency. Alternatively, we might use a priority order to break ties in a consistent way. However, this can be sensitive to the order.
      - Gives up: order-independence (the outcome depends on the order) and sometimes neutrality (propositions are treated asymmetrically).
      - Tractability: Depends on the complexity of the agenda. For simple agendas, it's tractable. But for complex logical dependencies, it might require checking consistency at each step, which can be computationally hard (NP-hard in general for arbitrary agendas).
      - Breaks down: When the agenda is complex and the order of voting becomes arbitrary and influential. Also, the outcome can be manipulated by setting the order.

   4. Distance-based (Kemeny-style) procedure (KEM):
      - Finds a collective judgment set that minimizes the total distance (usually the symmetric difference) to the individual judgment sets. It enforces collective rationality (consistency and completeness).
      - Gives up: tractability (it is computationally hard) and sometimes neutrality (if the distance metric is not symmetric).
      - Tractability: With 10-50 members, for a large agenda, it becomes computationally intractable (NP-hard). However, for small agendas (like the classic doctrinal paradox with 3 propositions) it is feasible.
      - Breaks down: In complex agendas, the computational burden becomes prohibitive. Also, the outcome might be hard to explain.

   5. Quota rules with proposition-specific thresholds (QUOTA):
      - Each proposition has a threshold (e.g., simple majority, supermajority) for acceptance. The thresholds are set so that the set of accepted propositions is consistent.
      - Gives up: systematicity (each proposition has its own threshold) and neutrality (propositions are treated differently).
      - Tractability: Very tractable; just count votes per proposition and check if the thresholds are met. But note: setting the thresholds to guarantee consistency is non-trivial and may require prior analysis of the agenda. Also, if the thresholds are not set appropriately, inconsistency may occur.
      - Breaks down: In complex agendas, it may be difficult to set thresholds that guarantee consistency without being too conservative (e.g., requiring unanimity for some propositions). Also, the thresholds might be arbitrary and lead to counterintuitive outcomes.

   Now, ranking:

   We are designing for a real committee. We care about:
     - Practicality (tractability with 10-50 members)
     - Robustness to complex agendas
     - The properties given up (and whether that matters for the committee's purpose)

   S tier: The best all-around choice. We want something that is tractable, robust, and gives up less critical properties.

   A tier: Good but with some drawbacks.

   B tier: Acceptable in some circumstances.

   C tier: Limited use.

   D tier: Avoid.

   Considering the above:

   - Premise-based (PBP): 
     + Very tractable and simple.
     + Works well when the agenda has clear premises and the logical structure is simple (like two premises and a conclusion).
     - Breaks down in complex agendas and when premises are not obvious.
     - It gives up systematicity, but that might be acceptable if premises are well-defined.

   - Conclusion-based (CBP):
     + Extremely tractable.
     - It ignores the logical structure and gives up collective rationality. This might be acceptable if the committee only cares about the bottom line, but it doesn't provide a reasoned decision.

   - Sequential/priority (SP):
     + Can handle any agenda in principle, but the order matters a lot.
     - Order dependence is a big problem for fairness and can be manipulated.
     - Tractability might be an issue in complex agendas (if we require consistency at each step and the agenda is large).

   - Kemeny (KEM):
     + Produces the most "consensual" consistent judgment set (minimizes disagreement).
     - Computational intractability for agendas of even moderate size (beyond a few propositions) makes it impractical for real committees with complex agendas.

   - Quota rules (QUOTA):
     + Very tractable to run (just count votes with thresholds).
     - The challenge is setting the thresholds appropriately. If done well, it can guarantee consistency. However, setting thresholds without being overly conservative is difficult, especially in complex agendas. Also, it treats propositions non-neutrally.

