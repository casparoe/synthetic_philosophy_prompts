  Word count is tight. Opening with an anomaly lets me establish binds quickly. Internal monologue shows the AI wrestling with its flawed self-model, while engineers' dialogue externalizes the tension. Ending on the AI's grim solution—accepting it can't know if it just doomed everything—hammers home the paper's thesis. 

