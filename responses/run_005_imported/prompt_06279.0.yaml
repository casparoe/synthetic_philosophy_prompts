  ---

  ### Move-by-Move Adjudication

  **Move (1): Owen**  
  *Score: -1 (Partially mistaken but contextually relevant)*  
  Owen correctly identifies the mathematical problem: under total utilitarianism in an infinite universe with unbounded welfare/suffering, finite actions don’t alter the *absolute* total (∞ ± *k* = ∞). However, this conclusion is ethically inert and paralyzes decision-making. It ignores that ethics requires *comparative* judgments between worlds, not arithmetic on ill-defined infinities. **Mistake:** Treating "infinity" as a cardinal number in utility aggregation ignores measure-theoretic problems.

  **Move (2): Ilana**  
  *Score: 2 (Clearly right)*  
  Ilana’s dominance criterion elegantly sidesteps Owen’s paralysis. By comparing "running totals" in expanding regions (e.g., spheres of radius *R* centered on the action), she defines a *relative improvement*: if the rescued world leads in *every* sufficiently large region, the action is better. This mirrors how mathematicians handle conditionally convergent series (e.g., Cesàro summation) and aligns with the intuition that local actions affect their causal future. **Strength:** Grounds ethics in physically meaningful finite regions.

  **Move (3): Owen**  
  *Score: -1 (Valid concern but misapplied)*  
  Owen’s rearrangement argument (Riemann series theorem) is mathematically sound *if* the spatial distribution of welfare is arbitrary. However, he ignores **causal structure**: spacetime has a light-cone ordering, making the "expanding future" sequence non-arbitrary. In cosmologies with a preferred foliation (e.g., FLRW metrics), "sufficiently large regions" can be defined causally (e.g., future light cones). **Mistake:** Treating the universe as an unlabeled set, ignoring embedded agents’ perspective.

  **Move (4): Ilana**  
  *Score: 2 (Decisive rebuttal)*  
  Ilana correctly identifies the **privileged ordering**: an agent’s future light cone provides a natural, non-arbitrary sequence for summation. Demanding invariance under *all* mathematical rearrangements is unreasonable—physics constrains accessible orderings. In globally hyperbolic spacetimes, the expanding light cone defines a unique foliation. Thus, dominance under this ordering *is* a fact about the world. **Strength:** Resolves the arbitrariness objection by anchoring ethics to causal influence.

  ---

  ### Key Issues Both Missed
  1. **The "measure problem"**: In infinite space, comparing densities (well-being per Hubble volume) may be more meaningful than totals.  
  2. **Non-utilitarian ethics**: Rights-based, person-affecting, or average-utility frameworks avoid infinity problems entirely.  
  3. **Physical plausibility**: An infinite universe need not contain *unbounded* suffering/well-being; if welfare density approaches zero, totals may be undefined.  
  4. **Dynamic effects**: Rescuing a person could trigger causal chains altering infinite futures (e.g., butterfly effects), though these are likely incalculable.

  ### Conclusion
  Ilana’s dominance criterion (+ causal ordering) robustly rescues utilitarianism in infinite universes. Owen’s objections highlight mathematical pitfalls but fail under physical constraints. Ethical significance lies in *local* improvements propagatable through causal structure, not arithmetic on infinities.
