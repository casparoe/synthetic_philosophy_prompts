  I'm supposed to be reading for comps but keep falling down a rabbit hole on "commitment races" instead (Kokotajlo's old LW post, building on stuff from Wei Dai/Garrabrant/Demski on updateless decision theory) - the idea that consequentialist agents have an incentive to lock in commitments as early as possible, before they've reasoned things through carefully, because whoever "moves first" in a Schelling-style bargaining sense tends to dictate the outcome, which can produce disasters when two agents commit to incompatible things in mutual ignorance of each other. Problem is every write-up I can find illustrates it with the same two moves: the steering-wheel-chicken case, or two AGIs pre-committing to punish "bullying" under slightly different fairness norms and ending up at war. Can you give me a genuinely different example - no chicken, no nukes, no AGIs with mismatched bargaining solutions - ideally involving human agents or institutions (historical, economic, evolutionary, whatever) - where you can point to exactly what makes it a commitment race specifically, rather then just a run of the mill coordination failure or garden variety brinksmanship?
