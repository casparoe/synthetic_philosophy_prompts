answer: |-
  Here's a fresh example grounded in historical economics and institutional path-dependence: **The U.S. Railroad Gauge War (c. 1860s-1880s)**.

  **The Setup:**
  1.  **Actors:** Multiple, competing private railroad companies building lines across the expanding American frontier (e.g., Union Pacific, Central Pacific, Southern Pacific, numerous smaller regional lines).
  2.  **Stakes:** Dominance in regional/national transportation networks, market share, profitability. Connecting lines meant capturing through-traffic revenue.
  3.  **Decision Point:** Choosing the track gauge (width between rails) for newly built lines. Key options included:
      *   **"Standard Gauge" (4 ft 8.5 in):** Used increasingly in the Northeast/Midwest.
      *   **"Broad Gauge" (5 ft 0 in, 5 ft 6 in, etc.):** Favored by some lines (notably the Erie, some Southern lines, and initially the Central Pacific) for perceived stability/speed.
      *   **"Narrow Gauge" (3 ft 0 in):** Cheaper to build in mountainous terrain, adopted by some Western lines.

  **The Commitment Race Dynamics:**

  1.  **Irreversible Early Commitment:** Building a railroad line is a massive, sunk-cost investment. Choosing a gauge and laying hundreds of miles of track *is* the commitment. Changing gauge later requires physically ripping up track, modifying rolling stock (engines, cars), and rebuilding terminals – an enormously expensive and disruptive process.
  2.  **Mutual Ignorance/Uncertainty:** Companies were building lines simultaneously across vast, poorly connected territories. They often had:
      *   **Uncertainty about competitors' choices:** Would the line building west from Chicago use Standard or Broad? Would the line building east from California use Narrow or Standard? Communication was slow.
      *   **Uncertainty about future connections:** Where *exactly* would competing lines meet? Which gauge would dominate key junctions?
  3.  **Schelling Point / First-Mover Advantage:** A company building a line *first* into a new region effectively set the de facto gauge standard for that area. Subsequent lines connecting *to it* faced a stark choice:
      *   **Match the existing gauge:** Incur the cost of using a potentially suboptimal gauge (for their terrain or preferences) to gain seamless connection and traffic.
      *   **Stick to their preferred gauge:** Sacrifice all direct through-traffic and force expensive transshipment (unloading cargo from one gauge train to another) at the connection point, crippling competitiveness.
  4.  **The Race:** Each company faced intense pressure:
      *   To build first into lucrative territories to capture the "first-mover standard-setting advantage."
      *   To commit to *a* gauge *early* in construction to avoid delays and secure financing/land grants.
      *   To do this *without* definitive knowledge of what competitors hundreds or thousands of miles away were choosing.
  5.  **The Disaster (The "Gauge War"):** The result was a chaotic patchwork of incompatible gauges across the US:
      *   Key junctions like Chicago, St. Louis, and later locations in the West became notorious "break-of-gauge" points.
      *   Passengers and freight faced delays, damage, and extra costs from constant transshipment.
      *   National efficiency and economic growth were significantly hampered.
      *   *This was not merely poor coordination.* Lines were often *physically incompatible* by the time they neared connection points because they had *committed* to different gauges *years earlier*, based on local incentives and incomplete information, racing to build territory.

  **Why it's specifically a Commitment Race (not just coordination failure/brinksmanship):**

  *   **Updatelessness Analogue:** Companies had to choose their gauge *before* they could "update" on the critical information – the gauge choices of competitors on connecting routes and the definitive location of future junctions. Their commitment (track construction) locked them in *prior* to resolving this uncertainty.
  *   **Costly Precommitment:** The commitment (laying track) was inherently costly and irreversible in the short-to-medium term. It wasn't just a threat or a statement; it was a physical fait accompli.
  *   **First-Mover Dictates Terms:** The company that built first into a territory didn't just *suggest* a standard; they *forced* it upon later arrivals connecting to them. The Schelling point became the *existing track*.
  *   **Mutual Damage through Incompatible Commitments:** The disastrous outcome (widespread incompatibility) arose directly from multiple agents making locally rational but globally incompatible irreversible commitments *in mutual ignorance* of each other's specific choices. Each was racing to lock in *their* preferred standard (or the one most expedient for them locally) in territory they controlled before someone else locked in an incompatible one.
  *   **Avoids Standard Examples:** No chicken (no deliberate threat of mutual destruction), no nukes (physical incompatibility, not destruction), no AGIs (human economic actors), no explicit bargaining over a surplus (just setting a standard that creates compatibility *if* matched).

  **The Resolution (Highlighting the Cost of the Race):**
  The "war" only ended through massive, government-pressured (and later, government-funded) standardization efforts in the 1880s, where thousands of miles of track were physically converted (mostly to Standard Gauge) at enormous national expense – a cost directly attributable to the earlier commitment race.

  **Key Takeaway for Comps:** This historical episode perfectly illustrates the core UDT/commitment race problem: Agents, operating under uncertainty about others' actions and needing to act early, are incentivized to make irreversible commitments that lock in their position. When multiple agents do this simultaneously based on incomplete models, they often lock in *incompatible* positions, leading to strictly worse outcomes for all than if coordination *before* commitment had been possible. The railroad gauge war shows this playing out in concrete, physical infrastructure with measurable economic consequences.
