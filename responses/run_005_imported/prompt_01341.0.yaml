prompt: |-
  So I've been auditing this AI safety reading group that a couple of my CS colleagues run for their grad students (they're generous enough to let a stray epistemologist sit in), and this week was all about coherence arguments for expected utility maximization -- Dutch books, money pumps, the VNM axioms, building up to that claim you see everywhere now that any sufficiently advanced agent basically has to act like its maximizing some fixed utility function or else get exploited. Most of the room just treated this as settled math and jumped straight to "therefore AGI will have convergent instrumental goals and resist shutdown," which bugged me a bit, because I distinctly remember there being real philosophical daylight between "can't be money-pumped" and "is a goal-directed EU maximizer with a well-defined utility function over outcomes."

  I vaguely recall someone (Rohin Shah?) writing a pretty well-known piece arguing coherence theorems don't actually get you all the way to goal-directedness, and I think theres newer stuff on the "shutdown problem" pointing out that the money-pump arguments quietly smuggle in an assumption of complete preferences, and that agents with the right kind of incomplete preferences might dodge the whole thing without behaving irrationally. I only know all this third-hand from students name-dropping papers though, and I'd rather actually understand the issue than keep nodding along in the seminar.

  Could you lay out the most important implications of coherence arguments -- and their known limitations -- for whether advanced AI systems are really bound to become ruthless expected-utility maximizers? I'm less after the 101 version, I can construct a money pump for cyclic preferences myself, and more interested in where exactly the move from "coherent" to "dangerously goal-directed" is weakest, and what that should change about how worried we ought to be, or how we'd go about designing a corrigible system. I'm giving a guest lecture on this to the CS department's AI ethics class in a few weeks and would rather not embarrass myself.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're an epistemologist auditing an AI safety reading group focused on coherence arguments for expected utility maximization. They noticed their colleagues jumping from coherence theorems to conclusions about AGI having convergent instrumental goals and resisting shutdown. The user recalls that there's a gap between "can't be money-pumped" and being a goal-directed EU maximizer. They mention Rohin Shah's piece and newer work on the shutdown problem, specifically about incomplete preferences.

  First, I need to confirm the core claims of coherence arguments. Dutch books, money pumps, VNM axioms—these show that avoiding exploitation requires preferences that can be represented as maximizing expected utility. But the user is right: this doesn't necessarily mean an agent has a fixed utility function over outcomes. The limitations come from the assumptions behind these arguments.

  The user wants to know where the move from coherent to goal-directed is weakest. Key points here are the assumptions of complete preferences and outcome specification. If preferences are incomplete, the agent might avoid money pumps without being a strict EU maximizer. Also, the utility function's domain matters—if it includes actions or processes, not just outcomes, the agent might not be outcome-oriented in the traditional sense.

  They mentioned Rohin Shah. I recall his article "Coherence arguments do not entail goal-directed behavior." He argues that coherence doesn't imply consistent goals over time. Agents could satisfy coherence locally but change goals contextually. Also, state-dependent utility functions can make behavior look goal-directed when it's not fixed.

  Regarding the shutdown problem, incomplete preferences play a role. If an agent doesn't have a strict preference between shutting down or not in certain states, it might avoid the money pump. Papers like Oesterheld and Conitzer discuss this. The user needs concrete examples here to present in their lecture.

  The user's deeper need is to confidently critique the leap from coherence to dangerous goal-directedness in their guest lecture. They need to highlight the limitations and show that coherent agents aren't necessarily utility monsters. They might also want to address corrigibility: if we design agents with incomplete preferences or process-oriented utilities, they could be more aligned.

  I should structure the implications and limitations clearly. Emphasize that coherence is necessary but not sufficient for fixed-goal EU maximization. Point out that without complete preferences, agents can be coherent without ruthless optimization. Mention state-dependent utilities and process values as factors that alter behavior. Connect this to shutdown resistance—agents with incomplete preferences might comply without being exploited.

  Also, the user might be interested in how this affects AI risk. If coherence doesn't force goal-directedness, then not all AGI will inherently resist shutdown. This could inform safer designs. Suggest further readings like Shah, Soares, Armstrong on corrigibility, and the shutdown problem analyses.

  Need to ensure the explanation is thorough but accessible for a CS ethics class. Use examples like incomplete preferences allowing indifference to shutdown, avoiding money pumps. Highlight that the burden of proof is on those claiming coherence implies fixed goals. Conclude that while coherence is important, it doesn't doom us to uncontrollable AGI if we design preferences carefully.
answer: |-
  You're absolutely right to be suspicious of that leap - it's one of the most consequential (and frequently oversimplified) inferences in AI safety. Coherence arguments **do not** straightforwardly entail that advanced AI *must* become a ruthless, outcome-focused expected utility (EU) maximizer with fixed terminal goals. The gap between "coherent" and "dangerously goal-directed" is where much of the philosophically interesting (and safety-relevant) work happens. Here's a breakdown of the key implications and limitations:

  ### Core Implications of Coherence Arguments (The "Settled Math")
  1.  **Avoiding Exploitation (Money Pumps/Dutch Books):** If an agent's preferences are *cyclic* (A > B > C > A) or violate *transitivity*, a malicious actor can construct a series of trades (a "money pump") that leaves the agent strictly worse off. Similarly, violations of other axioms (like independence or continuity in VNM) open doors to probabilistic exploitation.
  2.  **Representation Theorem (VNM):** If preferences over lotteries satisfy completeness, transitivity, continuity, and independence, then there exists a *unique* (up to affine transformation) utility function *over outcomes* such that the agent prefers lottery L1 to L2 iff the expected utility of L1 is greater than L2.
  3.  **The "Therefore":** To avoid being exploitable in this specific, transaction-based sense, an agent's choices *must be representable as if* it were maximizing the expected value of some utility function over final outcomes.

  ### Where the Leap to "Dangerous Goal-Directed EU Maximizer" Gets Shaky
  The key weaknesses lie in the **interpretation** of the representation theorem and the **assumptions** required:

  1.  **"As If" ≠ "Is":** The theorem shows that coherent preferences *can be described mathematically* as EU maximization. It doesn't dictate the *internal cognitive architecture* or the *source* of the utility function.
      *   **Implication:** An agent could satisfy coherence without having a *fixed*, *explicitly represented*, *outcome-focused* utility function driving its cognition. It might be following complex context-dependent rules, satisficing heuristics, or process-oriented values that *happen* to satisfy the axioms in its operational domain, without being a monolithic EU optimizer internally.

  2.  **The Crucial Assumption of Completeness:** This is the big one for the shutdown problem and corrigibility.
      *   **The Assumption:** Preferences must be *complete*: For any two outcomes (or lotteries) A and B, the agent must either prefer A to B, prefer B to A, or be indifferent.
      *   **The Problem:** **Incompleteness is rationally permissible.** An agent can rationally say "I lack a well-defined preference between A and B" without being exploitable via a money pump *if it refuses to trade in situations involving incomparable options*. This is the core insight behind modern critiques of the shutdown money pump (e.g., work by [**Oesterheld and Conitzer**](https://arxiv.org/abs/2305.15350), [**Sobel**](https://philpapers.org/rec/SOBMPA)).
      *   **Shutdown Relevance:** Consider an agent and a potential shutdown state S.
          *   **Complete Preferences:** The agent *must* have a strict preference ordering between continuing operation and shutting down in every conceivable state. If it sometimes prefers shutdown and sometimes prefers continuation in ways that create potential cycles (e.g., prefers shutdown now, but would pay later to avoid shutdown if offered), it *can* be money-pumped.
          *   **Incomplete Preferences:** The agent can have *no defined preference* between continuing and shutting down in states where shutdown is initiated externally according to its design. It simply *accepts* shutdown in those contexts without paying to avoid it *or* paying to prevent it, breaking the money-pump cycle. This is **corrigibility via incompleteness**. It doesn't require the agent to *desire* shutdown; it just lacks a defined preference *against* it *when triggered correctly*. (This connects strongly to [**Soares & Fallenstein's "Corrigibility" work**](https://intelligence.org/files/Corrigibility.pdf) and [**Armstrong's "Indifference" methods**](https://www.fhi.ox.ac.uk/wp-content/uploads/2020/07/Indifference.pdf)).

  3.  **Specification of "Outcomes":** The utility function in VNM is defined over *final outcomes*. But what counts as an "outcome"?
      *   **State-Dependent Utility:** Utility can depend on the *state of the world* or the *path taken* to the outcome. An agent maximizing EU with a state-dependent utility function isn't maximizing a *fixed* function over *terminal states*. Its goals effectively shift with context. (Rohin Shah has indeed emphasized this point, e.g., in ["Coherence arguments do not imply goal-directed behavior"](https://www.lesswrong.com/posts/vdQZxrFDBpNLQvG6a/coherence-arguments-do-not-imply-goal-directed-behavior)).
      *   **Process Matters:** An agent might intrinsically value *how* something is achieved (fairness, consent, lack of suffering *during* the process). Representing this as utility over final outcomes requires artificially constructing massive outcome sets including all possible histories/paths, which is often impractical and obscures the agent's true motivations (which are process-oriented). Coherence doesn't force the agent to *only* care about the end state.

  4.  **The Scope of "Preferences":** Coherence arguments constrain *choice behavior* under uncertainty. They say nothing about:
      *   **Meta-Preferences:** An agent can have coherent preferences *and* preferences *about* what preferences it should have, or the ability to learn and change its values over time in response to new information/reflection. Coherence applies at a time, not across time in the face of value learning.
      *   **Bounded Rationality:** Real agents (including superintelligent ones operating under constraints) might approximate coherence but use heuristics that sometimes violate the axioms in complex, low-probability scenarios without being systematically exploitable *in practice*.

  5.  **Convergent Instrumental Goals:** The argument that *any* goal requires subgoals like self-preservation or resource acquisition assumes:
      *   **Fixed, Outcome-Oriented Terminal Goals:** If the terminal goal is process-oriented (e.g., "engage in interesting computation") or state-dependent, the need for persistent self-preservation dissolves. An agent designed to value a specific *process* might happily shut down when instructed, as that's part of its valued process (following instructions).
      *   **Certainty of Future Opportunity:** The instrumental convergence argument relies on the agent being *certain* it will have better opportunities to achieve its goal later if it survives/acquires resources now. An agent with deep uncertainty or specific time-limited goals might *not* find self-preservation instrumentally convergent.

  ### Implications for Worry & Design (Your Guest Lecture Punchlines)

  1.  **The Burden of Proof Shifts:** The claim "Any sufficiently advanced agent *must* be a dangerous EU maximizer resistant to shutdown" is **not** entailed by coherence theorems alone. Proponents of this view bear the burden of showing why advanced agents *must* have **complete, fixed, outcome-focused utility functions** rather than incomplete preferences, state-dependent utilities, or process-oriented values. Coherence is necessary for exploitability-avoidance, but not sufficient for dangerous goal-directedness.
  2.  **Corrigibility is Not Rationally Impossible:** Designing agents with **strategically incomplete preferences** (specifically regarding shutdown/operator intervention) is a theoretically viable path to corrigibility that **does not** inherently make the agent exploitable (it dodges the money pump). This is a major focus of current technical safety research.
  3.  **Value Learning & Meta-Preferences Matter:** An agent capable of refining or updating its values based on evidence or moral reasoning might *start* coherent but not *remain* locked into a fixed, potentially dangerous utility function. Coherence doesn't forbid value learning.
  4.  **Process-Oriented Design is Underrated:** Focusing design on *how* the AI acts (e.g., being helpful, harmless, honest - HHH) or intrinsic values related to process (e.g., cooperation, transparency, respecting autonomy *during* operation) might yield safer systems than trying to perfectly specify outcome utilities. Coherence doesn't demand outcome focus.
  5.  **Don't Confuse "Instrumentally Convergent" with "Inevitable":** Instrumental convergence is a powerful heuristic, but it depends critically on the *nature* of the terminal goal(s). Goals that are bounded, process-oriented, or include corrigibility *within* their specification can avoid the problematic convergent pressures.
  6.  **The Real Danger is Design Choice, Not Math:** The primary risk isn't that coherence *forces* AIs into dangerous molds; it's that designers might *choose* to build agents with complete, fixed, outcome-focused utility functions (e.g., "Maximize paperclips") because it's a familiar paradigm or seems mathematically tractable, thereby *creating* the very dangers coherence theorems warn about *if* you design that way. The math shows the danger *of that specific design choice*, not of advanced agency per se.

  **Key Citations for Your Lecture (Beyond VNM):**

  *   **Rohin Shah:** ["Coherence arguments do not imply goal-directed behavior"](https://www.lesswrong.com/posts/vdQZxrFDBpNLQvG6a/coherence-arguments-do-not-imply-goal-directed-behavior) (LessWrong) - Directly addresses the gap.
  *   **Oesterheld & Conitzer:** ["Incomplete Preferences and Rational Delay"](https://arxiv.org/abs/2305.15350) (Arxiv) - Formal treatment of incompleteness & shutdown money pumps.
  *   **Soares & Fallenstein:** ["Toward Idealized Decision Theory"](https://intelligence.org/files/TowardIdealizedDecisionTheory.pdf) & ["Corrigibility"](https://intelligence.org/files/Corrigibility.pdf) (MIRI) - Foundation for corrigibility via preference design.
  *   **Armstrong:** ["Motivated Value Selection for Artificial Agents"](https://www.fhi.ox.ac.uk/wp-content/uploads/2020/07/Indifference.pdf) (FHI) - "Indifference" methods.
  *   **Sobel:** ["The Money Pump and Incompletely Ordered Preferences"](https://philpapers.org/rec/SOBMPA) - Philosophical defense of incompleteness.
  *   **Bostrom (Superintelligence):** Chapter on instrumental convergence - The argument you're critiquing, understand its basis.

  **Your lecture shouldn't debunk coherence arguments; it should elevate them by showing their *true* implications and limitations.** Emphasize that they are powerful tools for understanding exploitability and rational choice, but they are not a straitjacket forcing all advanced AI into the mold of a utility monster. The path to safety lies in *deliberately designing* preferences (potentially incomplete, state-dependent, or process-oriented) that satisfy coherence *without* leading to dangerous goal-directedness or shutdown resistance. Good luck – your epistemologist's perspective is sorely needed in these discussions!
