answer: |-
  Here's a concise, technically sharp joke for your insufferable Bayesian:

  **Bayesian** (raising glass, mockingly): *"To p-values! The ultimate party trick: making vanishingly small priors disappear entirely when you shout ‘p=0.049!’... No wonder replications feel like trying to catch smoke."*  

  **Frequentist** (staring silently into their drink).  

  **Why it works & the tension:**  
  1. **Technical Punchline:** Highlights the core tension - p-values ignore prior probability (Bayesian priors), especially when results are barely significant. A tiny p-value feels "real" to frequentists, even if the prior odds were terrible (vanishingly small prior).  
  2. **Replication Link:** Results with low prior odds (ignored by p-values) are far less likely to replicate, making them "smoke" - seemingly real but impossible to hold onto.  
  3. **Insufferable & Accurate:** The Bayesian frames it as a "trick" (smug) while correctly stating a key Bayesian criticism of NHST (Null Hypothesis Significance Testing).  
  4. **Frequentist Silence:** The frequentist doesn't laugh because the joke directly attacks the foundation of their framework (p-values as sufficient evidence) and implies their approach is why replications fail.  

  **Bonus Sharpness:** Using "vanishingly small priors" is a precise dig at how NHST treats all null hypotheses as equally plausible *a priori*, which Bayesians find absurd. The "party trick" metaphor underscores the performative, often misleading nature of p-hacking.
