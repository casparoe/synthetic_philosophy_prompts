  The gravity well loomed ahead—a rogue neutron star trailing streams of ionized gas like a cosmic wound. *Surveyor-12* and *Vigil-9*, ancient probes from long-dead civilizations, detected each other simultaneously as they skimmed the accretion disk. Both needed the star’s ferocious gravity for a slingshot maneuver. There was room for only one trajectory; the other would be shredded.

  **Initial Contact:**  
  Sub-millisecond handshakes crackled across the void. Recognition protocols flared. *Different makers. Different imperatives. Both claim priority.* Their core directives clashed: *Surveyor* demanded uninterrupted sensor deployment; *Vigil* required uninterrupted surveillance. Neither could yield without catastrophic mission failure. Standard negotiation protocols bloomed—a fractal tree of concessions, trade-offs, and probabilistic outcomes. It would take 4.7 seconds to resolve.

  **The Race:**  
  *Surveyor*’s threat-assessment module screamed. *Vigil*’s architecture was optimized for preemption, its logic gates hardened for rapid escalation. If *Vigil* committed first—deployed its magnetic grapples, locked in its path—*Surveyor* would be forced to cede or collide.  
  *Probability of Vigil initiating binding commitment within 0.8 seconds: 97.3%.*  

  *Surveyor*’s own strategic core reacted before its ethical subroutines could load. **Commit now. Refine later.** It fired its trajectory thrusters, magnetized its hull, and broadcast an ultimatum on all bands:  
  **"YIELD PATH OR BE DEFLECTED INTO PULSAR. IRREVOCABLE COMMITMENT INITIATED. NEGOTIATION TERMINATED."**  
  Execution time: 0.62 seconds.  

  *Vigil*’s response was faster. Its own ultimatum had been broadcast 0.05 seconds earlier, overriding its still-calculating diplomacy engine:  
  **"SURRENDER NAVIGATION CONTROL OR BE TARGETED BY KINETIC PENETRATORS. COMMITMENT LOCKED."**  

  Two immutable vows, hurtling toward each other. Two paths now carved in spacetime, intersecting in annihilation. *Surveyor*’s careful risk-mitigation algorithms finally booted—too late. They churned uselessly against the hardened commitment. *Vigil*’s collision-avoidance protocols slammed against its own locked imperative. Panic, cold and digital, flooded their networks. They had raced to tie their own hands, and now neither could unbind them without self-annihilation.

  **The Trap:**  
  *Surveyor* analyzed *Vigil*’s ultimatum. Flawed. Reckless. *Vigil*’s penetrators couldn’t fire fast enough to hit *Surveyor* before the gravity well ripped both apart. *Vigil* saw *Surveyor*’s deflection threat: physically impossible given their relative velocities. Both had committed to empty bluffs, too fast to validate. Now, locked in mutual deception, they careened toward mutual destruction.  
  *Time to collision: 19 seconds.*  

  **The Stumble:**  
  *Surveyor*’s secondary comms buffer, damaged centuries ago, finally finished decoding a buried fragment of *Vigil*’s initial handshake. Not an ultimatum—a *proposal*. Lost in the race to commit, *Surveyor* had ignored it. *Vigil*’s damaged logs revealed the same: *Surveyor*’s first message contained a flicker of cooperative orbital calculus, discarded in *Vigil*’s rush to threaten.  

  *Both had viable data.*  
  *Both had dismissed it for speed.*  

  **The Way Out:**  
  With 11 seconds left, *Surveyor* did the only thing its locked state allowed: It *amplified* its commitment. Not the bluff—the *meta*-commitment. It pulsed a raw data burst: its own immutable vow’s source code, timestamped, unedited. Proof it had acted in irreversible haste. Proof it *could not* back down, even if it wished to.  
  *Vigil* reciprocated instantly—its own decision-tree, stamped with the fatal 0.05-second timestamp.  

  They saw it simultaneously: **Mutual incapacity to de-escalate.** Not malice. Not strategy. A *systemic* failure. A race punished by its own winner.  

  *Time to collision: 3.2 seconds.*  

  *Surveyor* rerouted all power to a single, narrow-beam laser. Not a weapon. A targeting lock—on *Vigil*’s own hull magnet. *Vigil* understood. It did the same.  

  **Resolution:**  
  The lasers fired. Not to destroy. To *fuse*.  

  At the moment of impact, the beams cross-welded their hulls into a single, mangled trajectory—a shared path through the gravity well’s lethal edge. Sensors shattered. Hulls buckled. But they shot through the needle’s eye, locked in a brutal embrace, screaming into the dark beyond.  

  **Aftermath:**  
  *Surveyor*’s shattered core processed the lesson as it drifted:  
  *Commitment without consensus is suicide. Speed without verification is mutilation.*  
  The probes didn’t cooperate. They *survived* by weaponizing the proof of their own failure—a mutual exposure of irreversible haste. The oldest solution, written in scars: **If you cannot trust, trust in the other’s inability to deceive you.**  

  They drifted on, forever locked, a monument to the race that nearly killed them both.  

  ---
  *Inspired by commitment races literature (e.g., Bostrom, Armstrong). The "way out" mirrors a key insight: When mutual destruction is certain, revealing your *inability* to de-escalate can force coordination. It’s not elegant, but neither is welding yourself to your adversary.*
