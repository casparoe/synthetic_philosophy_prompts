answer: |-
  You're asking for the strongest possible defense of the ergodicity economics/Kelly perspective against Samuelson's dismissal. Having spent decades in statistical mechanics, you grasp classical ergodicity, so let's cut to the core arguments where the ergodicity camp claims genuine novelty and superiority. Here’s the steel-manned case:

  ### 1. **The Core Distinction: Ensemble Averages vs. Time Averages in Non-Ergodic Systems**
     - **Samuelson's Blind Spot:** Expected utility theory (EUT) fundamentally relies on *ensemble averages*: it averages outcomes over a hypothetical parallel ensemble of identical agents at a single point in time. This is valid *only* if the system is ergodic (time average = ensemble average). 
     - **The Non-Ergodic Reality:** Wealth dynamics under multiplicative growth (compounding bets) are *non-ergodic*. The ensemble average (e.g., expected value E[W]) diverges from the time-average growth rate (lim<sub>T→∞</sub> (1/T) log[W(T)/W(0)]). 
     - **Concrete Example:** 
       - Bet: 50% chance to double wealth (x2), 50% chance to lose 60% (x0.4). 
       - *Ensemble Average (EUT):* E[ΔW] = (0.5 × 2 + 0.5 × 0.4) = 1.2 → +20% expected gain per bet. 
       - *Time Average (Ergodicity Econ):* Growth rate g = E[log(ΔW)] = 0.5×log(2) + 0.5×log(0.4) ≈ 0.5×0.693 – 0.5×0.916 = **-0.111** → -11.1% per bet. 
       - **Crucial Point:** The ensemble suggests growth (+20%), but a single agent *almost surely* goes bankrupt (g < 0). EUT optimizes a fiction (parallel worlds), while Kelly optimizes the real-world trajectory (your future). Samuelson's "it's just log utility" ignores *why* log is chosen: it’s the unique functional that linearizes the non-ergodic dynamics to recover ergodicity.

  ### 2. **Rationality Redefined: Survival Over Hypothetical Optima**
     - **Kelly as a Prerequisite for Rationality:** In repeated bets, any strategy not maximizing g = E[log(1+r)] *guarantees* underperformance or ruin over time. A strategy with higher E[W] but lower g will be dominated in the long run. Rationality isn't about abstract preference ordering (EUT), but about *not accepting guaranteed long-run inferiority*. 
     - **Samuelson's Misdirection:** His "log utility is fine if you prefer it" stance treats Kelly as a special case of EUT. But the ergodicity camp argues: maximizing g is *the only rational choice* for repeated multiplicative growth, because alternatives lead to certain economic death. It’s not "preference" – it’s survival. Using log utility in EUT without this insight misses the physics of the problem.

  ### 3. **The Ontological Argument: You Only Live Once (YOLO)**
     - **The Ensemble is Metaphysical:** EUT requires aggregating outcomes across infinitely many parallel "yous." But you only experience *one path*. Optimizing over imaginary ensembles is irrational when your actual existence depends on a single, non-replicable timeline. 
     - **Kelly is Path-Wise:** It maximizes what happens *along your actual path* through time. The growth rate g is an emergent property of the *dynamics* (geometric compounding), not a static preference. Samuelson's rebuttal fails to engage with the fundamental difference between averaging *across* systems (ensemble) vs. averaging *through* time (trajectory).

  ### 4. **Superiority in Decision Contexts: Ruin Avoidance & Scale Invariance**
     - **Bankruptcy Matters:** Kelly explicitly avoids ruin (g > 0 guarantees no bankruptcy with probability 1). EUT with linear or concave utility can endorse bets with high expected value but high risk of ruin (e.g., St. Petersburg paradox with finite wealth). 
     - **Scale Invariance:** Kelly bets are fraction-based (% of wealth), making them invariant to wealth rescaling. This aligns with the multiplicative nature of compounding. EUT with arbitrary utility functions lacks this property, leading to inconsistencies (e.g., betting more on favorable odds as wealth grows, which Kelly avoids).

  ### 5. **The Physics Analogy Isn't Superficial – It's Foundational**
     - **Ergodicity Economics ≠ Statistical Mechanics:** Peters explicitly redefines ergodicity for observables in non-stationary, multiplicative systems. The key is that *wealth is an observable whose dynamics break ergodicity*. Maximizing E[log W] isn't a "utility function" – it's the *necessary condition* for the time average of growth to converge to a constant (making the observable ergodic). 
     - **Samuelson's Error:** Dismissing this as "physics costume" ignores that the mathematical structure of multiplicative processes (like particle paths in disordered media) *demands* time-average optimization. Log isn't arbitrary; it's the Lyapunov function stabilizing the system.

  ### 6. **Kelly as Information-Theoretic Optimum**
     - **Link to Shannon:** Kelly's criterion maximizes the expected growth rate *and* minimizes the expected time to reach a wealth goal. It’s equivalent to maximizing the entropy of growth paths, making it information-theoretically optimal. EUT lacks this deep connection to information theory.

  ### Conclusion: Why Ergodicity/Kelly is Distinct and Often Superior
  The ergodicity camp's strongest case is that **maximizing time-average growth is the unique rational criterion for repeated multiplicative decisions because it correctly accounts for the non-ergodic dynamics of wealth.** It replaces metaphysical averaging over parallel worlds with optimization of your single, irreversible trajectory. While EUT *can* replicate Kelly via log utility, it does so *accidentally* – without diagnosing why log is necessary (ergodicity breaking) or why alternatives are irrational (guaranteed long-run failure). 

  Samuelson's critique holds only if you ignore the dynamics: yes, EUT *formally* contains Kelly, but it obscures the physics of why it’s essential. For compounding bets, Kelly isn't *one* rational choice—it's *the only* strategy that avoids almost-sure dominance. That’s not just utility theory in disguise; it's a recognition that rationality must respect the mathematics of time.
