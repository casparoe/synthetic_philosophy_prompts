answer: |-
  Here’s a detailed scenario designed to isolate a loss of standing independent of hypocrisy or complicity:

  **Scenario: The Detached Observer**  
  *Setting*: A small, close-knit rural community has endured years of water contamination due to negligence by a local factory owned by a wealthy outsider. The contamination caused severe health issues, financial ruin for farmers, and the death of a beloved community elder, Ms. Elara, who drank from a well for decades. After a prolonged legal battle, the factory owner, Mr. Vance, is found liable. At a tense town hall meeting where Vance is present, a community member, Liam (whose child developed chronic illness from the water), confronts Vance with raw anger, shouting: "You knew! You sacrificed us for profit, and you killed Ms. Elara!"  

  *Enter the critic*: Dr. Aris Thorne, a renowned urban ethicist specializing in environmental justice, is visiting the town to collect data for a book. Though he witnessed none of the suffering firsthand, he knows the case from court records. Hearing Liam’s outburst, Thorne interjects sternly: "Liam, this rage is understandable but morally counterproductive. True accountability requires measured discourse, not vitriol. You owe it to the process to condemn calmly."  

  **Conditions Satisfied**:  
  (a) **No hypocrisy**: Thorne has never owned a polluting factory, exploited vulnerable communities, or caused environmental harm. His career is built on condemning such acts.  
  (b) **No complicity/benefit**: Thorne had no involvement in Vance’s actions. He doesn’t benefit from the contamination (he arrived after its discovery) and actively campaigns against such injustices globally.  

  **The Robust Intuition**: Despite (a) and (b), Thorne lacks standing to blame Liam for his anger. His criticism feels intrusive, alien, and illegitimate—even if technically correct that calm condemnation might be strategically wiser.  

  **Feature Stripping Standing**:  
  The **total absence of relational or experiential connection to the harm and its victims**. Specifically:  
  1. **No shared moral community**: Thorne isn’t part of the affected community. He has no stake in their history, relationships, or collective trauma.  
  2. **No epistemic authority from suffering**: He observed the wrong *abstractly* (through legal documents), not experientially. He didn’t endure the fear, loss, or erosion of trust.  
  3. **No reciprocity of risk**: Thorne’s life/well-being was never vulnerable to Vance’s choices, nor will he face the consequences of how Liam’s anger resolves.  
  4. **Timing/context**: By intervening *in the moment* of Liam’s raw confrontation with Vance, Thorne positions himself as an arbiter of grief he doesn’t comprehend.  

  **Why Standing is Lost**:  
  Thorne’s criticism fails because he speaks from a position of **detached judgment**, not **participant accountability**. Standing requires not just moral consistency (avoiding hypocrisy) but also a *relational right* to hold someone accountable within a shared moral ecosystem. Here, Thorne lacks:  
  - **Relational authority**: He has no bonds with the victims that might entitle him to mediate their grievances.  
  - **Experiential weight**: His abstract knowledge cannot ground the moral gravity needed to censure *how* a victim expresses their pain.  
  - **Symbolic representation**: His intervention inadvertently dismisses the community’s lived reality as "data," amplifying the very marginalization he condemns in theory.  

  **What This Shows**:  
  1. **Standing cannot be reduced to a consistency-with-conduct requirement**. Hypocrisy matters, but Thorne’s conduct is impeccable. His failure stems from his *positionality*, not inconsistency.  
  2. **Standing is a heterogeneous cluster of conditions**. Beyond hypocrisy/complicity, it includes:  
     - **Relational stakes** (e.g., being part of the affected community).  
     - **Epistemic grounding** (e.g., experiential understanding of the harm).  
     - **Reciprocal vulnerability** (e.g., sharing in the risks/costs of the wrong).  
  3. **Hypocrisy-centered accounts are incomplete**. Wallace’s "equal standing" focuses on mutual moral expectations among agents, but Thorne’s problem isn’t unequal expectations—it’s his *externality* to the moral exchange. Cohen’s "stone-throwing" entitlement emphasizes purity from sin, but Thorne *is* pure—yet still unentitled.  

  **Conclusion**:  
  Standing to blame is not monolithic but **contextually relational**. It demands a nexus between blamer, wrongdoer, and victim that hypocrisy-centric models ignore. A blamer must occupy a role within the moral ecosystem of the wrong—whether as potential victim, co-member of a community, or participant in the norms violated. Without this nexus, even factually correct blame can become a voyeuristic imposition, stripping the critic of standing. This reveals standing as a multifaceted precondition sensitive to *whose voices count* in specific webs of harm and accountability.
