answer: |-
  ## INTEROFFICE MEMORANDUM  
  **TO:** Members, State Parole Board  
  **FROM:** [Your Name]  
  **DATE:** October 7, 2023  
  **SUBJECT:** Policy Recommendation for Handling Conflicting Actuarial Risk Scores & Resolution of Case #2023-187  

  ### I. The Core Problem: Epistemic Uncertainty
  The current case starkly illustrates that **risk is not an intrinsic property of an individual, but a statistical property of a group.** Our instrument estimates risk by locating an individual within a defined reference group. The fundamental challenge is that **no single "correct" reference group exists for any unique individual.** Different defensible groupings (narrow, broad, or moderate) yield different risk estimates – all mathematically valid from the same data. This is not a data-quality issue resolvable by larger datasets; it is an inherent limitation of group-based prediction applied to individuals. Our policy must acknowledge this uncertainty while enabling consistent, principled decisions.

  ### II. Resolution of Immediate Case #2023-187
  For this inmate, **the Board should utilize the instrument’s default output (24%) as the primary statistical reference point**, while explicitly acknowledging the *range* of defensible estimates (6%-38%) in its deliberation. The 24% figure should *not* be treated as the inmate’s "true" risk, but as the baseline derived from the comparison group our adopted policy instrument deems most generally appropriate.  

  *   **Why not the narrowest group (6%)?** A group of 17 is statistically unreliable. Small samples magnify random variation and overfit idiosyncrasies. Extreme granularity sacrifices the stability and generalizability that justify actuarial tools.  
  *   **Why not the broadest group (38%)?** The statewide cohort likely includes inmates with meaningfully different profiles, reducing relevance to *this* individual. Overly broad groups dilute predictive power.  
  *   **Why the default (24%)?** It represents the Board’s prior policy choice for a balanced comparison group. Using an alternative *ad hoc* (narrow or broad) without a clear, consistent policy undermines the instrument's purpose and invites arbitrariness.  

  **Crucially, the panel must integrate this statistical context with individualized factors:** the inmate’s conduct since incarceration, insight into the offense, parole plan, victim impact (as presented by the family), and clinical assessments. The 24% anchor informs but does not replace holistic judgment.

  ### III. Proposed Standing Policy: The "Reasoned Framework" Approach
  To handle recurring cases with defensibly different comparison groups, I propose the following policy:  

  1.  **Default to Instrument Output:** The actuarial score generated by the Board’s adopted instrument, using its predefined comparison group logic, serves as the **primary statistical baseline**. This maintains consistency, predictability, and accountability to our chosen tool.  

  2.  **Mandatory Disclosure of Significant Discrepancies:**  
      *   If a party (defense, prosecutor, victim) presents a *statistically defensible* alternative calculation using the *same core dataset* that yields a materially different risk estimate (e.g., differing by >10 percentage points), this must be explicitly noted in the hearing record.  
      *   Proponents must clearly define the alternative comparison group and justify its relevance.  

  3.  **Explicit Deliberation Framework:** Hearing panels *must* address the following in their reasoning:  
      *   **Acknowledge the Range:** State the instrument's baseline score and any materially significant alternative estimates presented.  
      *   **Assess Relevance:** Briefly discuss the perceived strengths/weaknesses of the comparison groups used (e.g., "The statewide cohort is broad but may include less relevant cases; the hyper-specific group is highly tailored but statistically unstable").  
      *   **Anchor on the Baseline:** Affirm that the Board's adopted instrument provides the primary statistical benchmark.  
      *   **Integrate Individualized Factors:** Explain how individualized clinical and case-specific factors (behavior, progress, victim statements, release plan) support deviating from, reinforcing, or contextualizing the baseline risk estimate. The score informs, but does not dictate, the final risk assessment.  

  4.  **Reject Automatic Defaults to Extremes:**  
      *   **No Auto-Narrowest:** Narrow groups are often statistically unreliable and prone to manipulation.  
      *   **No Auto-Broadest:** Broad groups sacrifice relevance.  
      *   **No Abandonment of Actuarial Input:** Clinical judgment alone demonstrably underperforms structured tools. Abandoning scores discards valuable, empirically grounded information.  

  5.  **Transparency:** The final decision documentation must clearly state the baseline score used, acknowledge significant alternative calculations presented, and articulate how the panel integrated this statistical context with individualized factors.

  ### IV. Why This Approach?
  *   **Acknowledges Reality:** Accepts the inherent uncertainty of group-based prediction for individuals without pretending it can be eliminated.  
  *   **Maintains Consistency & Legitimacy:** Uses the Board’s pre-defined instrument as the anchor, avoiding arbitrary case-by-case selection of reference groups.  
  *   **Mitigates Manipulation:** Prevents parties from "shopping" for extreme scores by requiring disclosure and deliberation on alternatives, while anchoring to the standard metric.  
  *   **Balances Structure & Discretion:** Retains the proven benefits of actuarial tools while preserving the Board’s essential role in applying human judgment to unique cases.  
  *   **Provides Accountability:** Requires explicit reasoning about risk estimates, enhancing transparency and reviewability.  
  *   **Practical & Actionable:** Can be implemented immediately without technical overhauls or paralyzing the Board.

  ### V. Recommendation & Vote
  I recommend the Board **adopt the "Reasoned Framework" policy** outlined in Section III effective immediately. For Case #2023-187, **utilize the instrument’s baseline score (24%) as the primary actuarial input**, explicitly acknowledge the presented range (6%-38%) during deliberation, and base the final parole decision on a holistic assessment integrating this statistical context with all individualized factors pertinent to this inmate.  

  This approach respects the complexity of risk assessment, leverages the tool we adopted, and empowers the Board to fulfill its duty with principled consistency. I move we vote on this policy and the resolution of Case #2023-187 on the 14th.  

  **Attachments:**  
  *   Summary of Case #2023-187 details  
  *   Research Brief: Limitations of Small Sample Sizes in Risk Assessment  
  *   Research Brief: Actuarial vs. Clinical Prediction Meta-Analyses
