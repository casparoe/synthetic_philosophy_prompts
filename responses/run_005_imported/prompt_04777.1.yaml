  7. Supervaluationism: A statement about the future is true now only if it is true in every possible future (i.e., it is settled). Otherwise, it is false or indeterminate. This preserves classical logic for settled truths but allows for indeterminacy for contingents. However, it faces the problem that it may lead to truth-value gaps and the loss of bivalence. Also, it doesn't really explain how the future becomes determinate. But it is a popular modern approach. It does avoid fatalism by allowing that the future is open. However, it might be seen as a sophisticated version of Aristotle's solution. So it might be real but costly because it requires a non-standard semantics.

