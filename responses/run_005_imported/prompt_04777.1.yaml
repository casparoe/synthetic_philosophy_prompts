  We are evaluating seven historical responses to Aristotle's sea battle puzzle. The puzzle: if it is true today that there will be a sea battle tomorrow (or not), then the future seems settled, leading to fatalism. The responses:

  1. Aristotle: future contingents are neither true nor false.
  2. Diodorus Cronus: accepts fatalism (via the Master Argument).
  3. Stoics: everything is fated, but some things are "up to us" (compatibilism).
  4. Boethius & Aquinas: God's eternal present (outside time) knows future contingents without causing necessity.
  5. Ockham: God foreknows contingent events without making them necessary (divine foreknowledge is compatible with contingency).
  6. Łukasiewicz: uses a third truth-value (indeterminate) for future contingents.
  7. Supervaluationism: a statement about the future is true now only if it is true in every possible future (i.e., settled), otherwise it is false or indeterminate.

