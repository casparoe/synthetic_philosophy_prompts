  - **B-tier**: Improves statistical practices but doesn’t fix incentives.  
    Bayes factors reduce p-value misuse. Effect sizes/interval estimates avoid dichotomous thinking.  
  - **C-tier**: Supports better science but doesn’t prevent poor practices.  
    Open data enables verification but not design rigor. Adversarial collaborations resolve disputes but are niche.  
  - **D-tier**: Superficial tweaks.  
    Lowering p-thresholds ignores p-hacking and incentives; it’s a band-aid on a broken system.  

