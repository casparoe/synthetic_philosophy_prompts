  ### Standard Resolution or Distinction:
  A standard way to sharpen this dispute is to distinguish between **synchronic** and **diachronic** Dutch books. The argument discussed here is synchronic (at a single time). However, there are also diachronic Dutch books that argue for updating by conditionalization. But that is not the main issue here.

  More relevant is the distinction between **pragmatic** and **non-pragmatic** justifications for probabilism. The Dutch book argument is a pragmatic argument: it shows that incoherent credences lead to practical losses. However, there are non-pragmatic arguments, such as the **accuracy dominance argument** (also known as the scoring rule argument). This argument, developed by de Finetti and more recently by James Joyce, shows that for any incoherent set of credences, there is a coherent set that is strictly more accurate in every possible world (according to a proper scoring rule). This argument does not rely on betting or utility; it is epistemic. It directly targets the idea that credences aim to represent the world accurately. 

  By introducing the accuracy dominance argument, Leah could have strengthened her case without relying on the betting setup. Theo's objections about the betting protocol and utility would not apply to this argument. Similarly, the circularity objection (point 4) would be less relevant because the accuracy argument is not behaviorist.

  So, the accuracy dominance argument provides a resolution: it shows that incoherent credences are not just pragmatically problematic but also epistemically defective because they are dominated in terms of accuracy.
