  ### Philosophical Distinction to Resolve the Dispute: **Pragmatic vs. Epistemic Rationality**  
  Neither Leah nor Theo invokes the standard distinction that clarifies this debate:  
  - **Pragmatic Dutch books** (Leah’s focus) show that incoherent credences lead to *avoidable practical losses* (e.g., money-losing bets).  
  - **Epistemic Dutch books** (or *accuracy dominance arguments*) show that incoherent credences are *accuracy-dominated*: there exists a coherent credence function that is *more accurate in every possible world* (e.g., under proper scoring rules like the Brier score).  
    
  This distinction (developed by Joyce, Pettigrew, etc.) resolves Theo’s objections:  
  1. **No betting protocol needed**: Accuracy arguments don’t rely on accepting bets. They show incoherent beliefs are *epistemically defective* by the standard of accuracy-alone.  
