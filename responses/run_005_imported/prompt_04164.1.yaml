answer: |-
  The spreadsheet glowed, a grid of cold certainty on Dr. Aris Thorne’s monitor. Malaria Intervention Assessment: Region 7. Rows ranked districts by DALYs averted per dollar. At the top, predictably, was the Riverbend Valley: high transmission, weak infrastructure, cheap bed nets. A 97% confidence interval, the model chirped. A near-sure bet.

  Aris had built this model. He knew its veins – the demographic data, the parasite prevalence surveys, the cost projections for permethrin-treated nets. He could recite the error margins on infant mortality rates. This was *calculable* risk. Like knowing a vaccine was 92% effective. You acted, knowing the odds.

  But Dr. Elara Vance’s words, delivered two weeks prior in the foundation’s too-warm seminar room, echoed now, chilling that certainty. *Complex cluelessness*. It wasn't about unknowable butterfly effects fluttering randomly. It was about *systematic*, foreseeable shifts with utterly unforeseeable *moral valences* further down the causal river.

  Saving a child in Riverbend Valley didn't just save *that* child. The model accounted for that child potentially having children of their own. It factored in reduced strain on healthcare, increased economic productivity in the *local* area over a 20-year horizon. Standard stuff. But Vance had pointed to the deeper current: saving that child, and thousands like them, meant more people. A denser, potentially more resilient, potentially more resource-strained population decades, centuries hence. And *that* population’s trajectory – towards peace or conflict, sustainability or collapse, flourishing or suffering – was utterly opaque. The consequentialist ledger demanded they weigh *that*, but offered no pen to write in the figures. It wasn't missing data; it was a missing *scale*.

  **(Interlude: 134 Years Post-Intervention)**
  *The Riverbend Valley, now the Nexus Plains. The descendants of those saved by the bed nets (funded by Aris’s recommendation, approved three weeks after his spreadsheet) form the backbone of a regional agricultural consortium. Their stability attracts displaced populations from coastal regions flooded by the slow creep no one in Aris’s time fully grasped. The consortium’s efficient, terraced farms feed millions. They also monopolize water rights, diverting ancient rivers. Downstream, a once-fertile delta begins to wither. A nascent political movement gathers there, fueled by thirst and resentment. Is the net good of the fed millions greater than the suffering of the displaced and the soon-to-be-parched? The question hangs, not in a spreadsheet, but in the dust-laden wind. No ledger exists to balance these columns.*

  Aris stared at the "97% Confidence" cell for Riverbend. It felt like a local truth, a neighborhood map. Vance’s point was that consequentialism claimed this local map was *only* justified by the *global* territory – a territory forever beyond surveying. His confidence wasn't false, exactly; it was... incomplete in a way that undermined its very foundation. Was reporting that 97%... honest? Or was it professional theater, necessary to move money but built on sand?

  His colleague, Ben, leaned over. "Riverbend’s a slam dunk, right? Committee meets tomorrow. Final sign-off." Ben tapped the top row. "This number sings."

  "It’s a snapshot," Aris said, his voice tighter than intended. "It sings a very short song."

  Ben chuckled. "Philosophy hangover? Look, we do the calculable good. We can't solve heat death or guarantee utopia. We save kids *now*."

  "But *saving* them *now*," Aris pressed, "it *changes* the future. Systematically. We know that. What if that change… isn’t good? Not by random chance, but structurally? What if more people *now* inevitably leads to… worse later? Or better? We have *no idea* how to weigh 'more life now' against 'potential for greater suffering later' or 'potential for greater flourishing later'. They aren't commensurate."

  Ben sighed. "So we do nothing? Let the kids die on the off-chance their grandchildren might face a problem we can't foresee? That way lies paralysis. The calculable good *is* good, Aris. Tangible. Measurable in tears not shed *today*."

  Aris knew Ben was right, pragmatically. But the *ground* felt different. Before Vance, the unseen future felt neutral, a blank that averaged to zero. Now it felt like a vast, dark ocean beneath the thin ice of his calculations. You could measure the ice's thickness right where you stood (97%!), but the ocean's depth, currents, and hidden reefs were not just unknown; they were *unknowable* in any way that could inform the step you were about to take. The risk wasn't of falling through *here*; it was that the entire ice sheet rested on depths whose nature made the concept of "safe thickness" meaningless.

  **(Interlude: 287 Years Post-Intervention)**
  *The political movement born in the withered delta has evolved. It toppled the water-monopolizing consortium generations ago. Now, it governs the Nexus Plains with an ideology forged in scarcity: rigid population controls and absolute prioritization of essential resource production. The arts, pure research, leisure – deemed luxuries – wither. The population is stable, fed, and grimly efficient. Infant mortality is near zero. Suffering from preventable disease is negligible. The descendants of the children saved by the bed nets live long, secure, and largely joyless lives under constant surveillance. Is this *better* than a potentially larger, more chaotic, but freer population that might have emerged without Aris’s intervention? The question is never asked. History only flows one way. The cost-effectiveness of the bed nets, in terms of lives saved *then*, remains mathematically impeccable.*

  The committee approved Riverbend Valley. The bed nets shipped. Aris signed the approval memo, his signature looking alien on the page. He pictured the nets: bright, synthetic blue, settling over sleeping mats. He pictured children waking, unbitten. The *immediate* good was real, vivid. He clung to that image.

  But as he closed the spreadsheet, the gridlines seemed to bleed, dissolving into a fractal haze of branching futures. He saw not probabilities, but possibilities stacked upon possibilities, each fork leading not to calculable outcomes, but to new sets of incommensurate goods and evils, stretching into a foggy infinity. His model was a flashlight beam in that fog, illuminating a small, clear circle. The confidence interval was the sharp edge of that beam. Outside it wasn't just darkness; it was an unfathomable expanse where the very metrics of "good" and "bad" shifted and warped beyond recognition.

  He hadn’t felt uncertainty. He’d felt *risk*. Now, he felt the weight of the cluelessness. It wasn't that nothing mattered. It was that what mattered extended so far beyond his capacity to measure or comprehend that the act of measurement itself felt like a desperate, necessary fiction. The vertigo wasn't from the possibility of being wrong; it was from the realization that "right," in any final, consequentialist sense, might be a category error when applied across the abyss of time. He saved the spreadsheet, the numbers glowing with their pristine, local certainty. Outside his window, the city lights stretched towards an unseen horizon. He wondered what unseen ledgers, in what unimaginable futures, were being irrevocably altered by the bright blue nets on their way to the Riverbend Valley. And he knew, with a chilling certainty, that no calculus existed to tell him if it was worth the cost.
