  But wait, case 2: I put in A because it's a strong case but the dynamic generation might be a caveat. Case 8: I put in F, but let's reconsider. The conditions:

  - Constancy: Only for big decisions -> not constant. Clark and Chalmers require constant use. So it fails constancy.
  - Trust: Yes, but with the caveat that the user knows it's not real. However, they do trust it for the purpose of making decisions. But the trust is not in the truth of the information but in the ritual. This is different from Otto's notebook which is about factual beliefs. The extended mind thesis is about belief, not decision-making rituals. So it fails the endorsement condition for belief. Thus, F.

