     Therefore, the likelihood under ~H is the product of the probabilities of:
       - The spike happening at 2:37pm (or within a minute of it) by chance: very low (about 0.002).
       - The two anomalies happening at the exact times of the vendor's batch schedule: also very low (if we assume they are rare and we don't know the schedule, then we might model the time as uniform?).

