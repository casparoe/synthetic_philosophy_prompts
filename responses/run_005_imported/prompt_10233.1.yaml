     We must remember: the evidence E1 and E2 are fixed. The likelihood of H is P(E1, E2 | H). The likelihood of the alternative (say, ~H) is P(E1, E2 | ~H).

     How do we assign P(E1, E2 | H) and P(E1, E2 | ~H)?

     - For H: since H predicts E1 and E2, we can set P(E1, E2 | H) to be high (close to 1).
     - For ~H: without H, what is the probability of these events? We had no explanation. The spike E1 was observed daily and we had no idea why. The two anomalies E2 were rare and we wrote them off. So without H, we might assign a low probability to these events happening in the way they did? But note: we already observed them, so in a sense we know they happened. However, from a modeling perspective, we can think about how surprising they are under ~H.

     The key is that H provides a unified explanation for both E1 and E2. Under ~H, we might have considered E1 and E2 as independent and unlikely events. So:

     P(E1, E2 | ~H) = P(E1 | ~H) * P(E2 | ~H)   [if we assume independence under ~H]

