  The user mentioned not wanting greeting-card platitudes. So the toast should explicitly reference Moore's elements: moving beyond surface feelings and detached admiration to genuine connection. Highlighting Priya and Sam's real qualities and how their combination creates something irreplaceable.

  Structure-wise, start with a hook to engage both crowds—perhaps a funny anecdote. Then introduce the book and concept simply. Use personal stories about Priya and Sam to illustrate Moore's points. Ensure the philosophy isn't a lecture but woven into stories. End with a heartfelt toast tying back to the idea of organic unity.

  Check for tone: warm, inclusive, slightly self-deprecating humor (mentioning the charity shop book). Avoid cringe by grounding the philosophy in observable traits. For example, Sam's practicality balancing Priya's passion, showing their unity creates a "third thing" more valuable than individual traits.

