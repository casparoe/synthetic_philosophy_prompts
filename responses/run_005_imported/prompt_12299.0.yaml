prompt: |-
  So I got picked for jury duty last month, first time ever, and we ended up on a criminal case that went to deliberation for like two full days before we finally convicted the guy. It was split 9-3 for most of the first day and I could not stop thinking about whether we'd actually gotten it right, so afterward I went down kind of a rabbit hole reading about the statistics of group decisions, which is how I found Condorcet's jury theorem. As I understand it, the theorem basically proves that if you get a bunch of people voting yes/no on something and each person is even a little bit better than a coin flip at getting it right, the majority verdict becomes almost guaranteed to be correct once the group is big enough - like, mathematically guaranteed, not just "probably." That part seems pretty solid to me since it's really just probability at the end of the day, not some soft social-science claim.

  So now I dont get why courts are so conservative about jury design. If the theorem is right, shouldnt we be empaneling like 40 or 50 people per trial instead of 12, and requiring something like 90% agreement instead of either simple majority or full unanimity, since that would obviously get us way closer to the "guaranteed correct" limit the theorem describes? My cousin, who's a public defender, told me it's "not that simple" because deliberating jurors aren't voting independently the way the theorem needs them to, but I don't really buy that objection - they still each cast one individual vote at the end, so I don't see why the underlying math would stop applying. To make things more confusing, I also stumbled on an old political-science paper arguing that requiring unanimity can actually make wrongful convictions MORE likely rather than less, which sounds completely backwards to me and I can't figure out how that's even consistent with the jury theorem in the first place. Is there something wrong with how i'm reading the theorem here, or is this really just a case of the justice system not having caught up with two-hundred-year-old math?
reasoning: |-
  Okay, let me unpack this user's query. They're clearly someone who dove deep into Condorcet's jury theorem after a real jury experience, and now they're questioning why courts don't use larger juries or supermajority requirements. Their frustration makes sense - if math says bigger groups yield more accurate verdicts, why stick with 12 jurors? 

  First, I need to validate their correct understanding of the theorem's core premise: independent voters with >50% individual competence do create near-certain majority accuracy. That part is rock-solid math. But their application misses crucial real-world constraints. 

  The cousin's "not independent" objection is actually key. During deliberation, jurors influence each other's judgments through group dynamics - informational cascades, charismatic leaders, conformity pressure. That violates the theorem's independence assumption. Plus, evidence isn't equally visible to all jurors, which compounds the problem. 

  Then there's the unanimity paradox paper they mentioned. That likely references Feddersen & Pesendorfer's work showing how strategic voting under unanimity can make rational jurors vote guilty even when doubtful, expecting others to block conviction. It's a perverse incentive that doesn't exist in majority systems. 

  I should also address practical barriers they might overlook: exponential cost increases with larger juries, vanishing jury pools in small districts, and how longer deliberations increase hung jury risks. The trade-off isn't just accuracy - it's systemic viability. 

  Most importantly, I must emphasize that verdict accuracy isn't the sole legal value. Unanimity forces thorough deliberation protecting minority views, while majority systems risk marginalizing dissent. And the "beyond reasonable doubt" standard intentionally prioritizes avoiding false convictions over catching all guilt - something Condorcet's neutral accuracy goal doesn't capture. 

  The user's math isn't wrong, but their model is incomplete. I'll structure the response to first affirm their correct insights, then systematically introduce the layers where law and game theory diverge from probability theory. The punchline: courts aren't ignoring math; they're solving a different equation where justice includes variables Condorcet didn't weight.
answer: |-
  You've hit on a fascinating tension between mathematical theory and legal practice. Let's break this down step by step, because your intuition is partially correct, but the real-world application is far more complex than Condorcet's assumptions allow:

  **1. Condorcet's Jury Theorem (CJT) - The Core Insight (Which You Understand Correctly):**
  *   **Premise:** If each juror has independent competence *p > 0.5* (better than chance at reaching the correct verdict)...
  *   **Conclusion:** As jury size *n* increases:
      *   The probability of the *majority* reaching the correct verdict approaches 1.
      *   Larger majorities (e.g., 90% vs. simple majority) are even *more* reliable for a given *n*.
  *   **Your Reasoning:** Therefore, larger juries (40-50) with supermajority requirements (90%) should yield near-perfect accuracy. *Mathematically, under CJT's strict assumptions, you are absolutely right.*

  **2. Why Courts Don't Do This: The Real-World Violations of CJT's Assumptions**

  The legal system isn't ignoring 200-year-old math. It's grappling with the fact that *actual juries violate CJT's core assumptions*:

  *   **A. Independence is Radically Compromised (Your Cousin is Right):**
      *   **Deliberation is the Point:** CJT assumes jurors vote *independently* based solely on their private assessment of evidence. But the *entire purpose* of deliberation is for jurors to *share* interpretations, challenge biases, correct misunderstandings, and persuade each other. Votes are *not* independent private judgments; they are the culmination of a complex group process.
      *   **Informational Cascades & Herding:** A few strong personalities, early statements, or perceived expertise can disproportionately influence others, leading jurors to disregard their private information and follow the perceived group trend, even if incorrect.
      *   **Common Evidence Source:** Unlike CJT's model of independent information sources, jurors all see/hear the *same* evidence presented in court. Systemic flaws in that evidence (e.g., faulty eyewitness ID, misleading expert testimony) corrupt *all* jurors simultaneously, defeating the "independence" that protects against correlated errors.
      *   **Groupthink & Conformity Pressure:** Social dynamics (desire for harmony, deference to authority, fear of isolation) can suppress dissenting views, leading to premature consensus on an *incorrect* verdict. Unanimity requirements can exacerbate this pressure.

  *   **B. Individual Competence (p > 0.5) is Highly Questionable & Variable:**
      *   **"p" Isn't Fixed or Known:** CJT assumes each juror has a fixed, known *p > 0.5*. Reality is messy:
          *   Competence varies wildly between jurors (education, cognitive biases, attentiveness).
          *   Competence depends heavily on case complexity, evidence quality, and lawyer effectiveness.
          *   Jurors aren't calibrated machines; they can be swayed by irrelevant factors (attractiveness, race, emotion).
          *   **Is p even >0.5?** For complex cases involving scientific evidence or nuanced legal standards, average juror competence might be *close to or even below 0.5*. CJT fails catastrophically if *p < 0.5* – larger groups become *more* likely to be wrong! We simply don't know the true *p*.

  *   **C. The Unanimity Paradox (The Paper You Found):**
      *   This is likely referencing work by Feddersen & Pesendorfer or similar scholars. Their argument hinges on **strategic voting under unanimity**:
          *   Rational jurors know a conviction requires *everyone* to vote guilty.
          *   A juror with *reasonable doubt* might strategically vote *guilty* anyway if they believe:
              *   The defendant is *probably* guilty.
              *   *Other* jurors definitely have reasonable doubt and will vote "not guilty," blocking conviction.
          *   Why do this? To avoid a hung jury/mistrial (which they perceive as costly/inconvenient/futile) while *hoping* the holdouts will "do their job" and acquit.
          *   **Result:** Under unanimity, *rational* jurors with doubt may vote guilty *strategically*, expecting others to acquit. If *too many* jurors think this way, an innocent defendant can be convicted *unanimously*.
      *   **Contrast with Majority Rule:** Under a simple majority (say, 10-2), a juror with genuine doubt has a stronger incentive to vote "not guilty" because their vote is more likely to be pivotal (directly influence the outcome). This *reduces* strategic guilty voting by doubtful jurors.
      *   **This is NOT inconsistent with CJT:** It highlights how *voting rules change juror incentives and behavior*, violating the independence and fixed-competence assumptions. CJT assumes honest, non-strategic voting based purely on private belief about guilt/innocence. Real jurors behave strategically based on the voting rule and their expectations of others.

  *   **D. Practicality & Systemic Costs:**
      *   **Logistical Nightmare:** Finding, vetting, seating, paying, accommodating, and deliberating with 40-50 jurors per trial is exponentially more expensive, time-consuming, and burdensome on citizens and the court system than using 12.
      *   **Jury Pool Exhaustion:** Many jurisdictions would struggle to find enough eligible jurors for frequent 50-person panels.
      *   **Diminishing Returns:** While CJT shows accuracy increases with size, the *marginal gain* decreases. Moving from 12 to 50 might offer a theoretical boost, but the immense practical costs likely outweigh it, *especially* given the violated assumptions.
      *   **Hung Jury Risk:** Requiring 90% agreement (e.g., 45 out of 50) makes it statistically *more* likely that a small number of holdouts (5-6) will cause a hung jury, even if the vast majority agree. This increases mistrials and system costs.

  **3. Why the Current System (Small Juries, Unanimity/Majority Rules) Persists:**

  *   **Balance of Values:** The system balances the *theoretical* accuracy gains of CJT (via group deliberation) against other critical values: efficiency, feasibility, protection against groupthink (smaller groups *can* deliberate more deeply), the high burden of proof ("beyond reasonable doubt" favors protecting innocence), and the symbolic importance of consensus (unanimity).
  *   **Deliberation as Error-Correction:** The primary mechanism for accuracy isn't *just* aggregating independent votes (CJT), but *improving* individual competence *through* deliberation. A well-functioning 12-person jury can significantly raise the *effective p* of its members through discussion.
  *   **"Beyond Reasonable Doubt" as the Safeguard:** The legal system relies heavily on the high burden of proof and jury instructions to guide deliberation, aiming for high accuracy even with smaller groups.
  *   **Evolution & Pragmatism:** The 12-person unanimous/majority system evolved through centuries of common law practice, balancing the ideals of fairness, community representation, and practicality. While imperfect, it's a workable compromise.

  **Conclusion:**

  You're absolutely right that *under the strict, idealized assumptions of Condorcet's Jury Theorem*, larger juries with supermajority requirements would be mathematically superior. **The disconnect isn't that courts ignore math, but that real juries operate in a way that fundamentally violates the theorem's core assumptions (independence, fixed p>0.5, non-strategic voting).**

  The unanimity paradox paper highlights how strategic behavior under specific rules can perversely *increase* errors. The practical costs of massive juries are prohibitive. Courts prioritize a system that *facilitates effective deliberation* within a manageable group to *improve* individual competence and reach a just verdict, acknowledging that perfect mathematical guarantees are unattainable in the messy reality of human judgment, shared (and potentially flawed) evidence, and complex social dynamics. The current system is a pragmatic compromise between the theoretical ideal and the constraints of law, human nature, and resources.
