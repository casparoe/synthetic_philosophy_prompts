  First, I need to recall the technical details of Reflection. The principle requires that your current credence equals the expected future credence, but only under specific conditions. The key here is the distinction between rational and irrational belief changes. The cult scenario involves irrational updating—brainwashing isn't a rational process. So the principle might exclude such cases by design. 

  The user mentioned Dutch-book arguments. If someone could be Dutch-booked due to the brainwashing, that would show irrationality. But in this case, if they know they'll be brainwashed, they can avoid bets that exploit the future irrational credence. That's a crucial point. The principle's application hinges on whether the future credence is based on evidence or not.

  The professor's response about assuming rational updates is actually the standard defense. But the user felt it was hand-wavy. I should explain why it's not just jargon. The Reflection Principle is conditional on the future credence being rational given new evidence. Brainwashing isn't updating on evidence; it's coercion. So the principle doesn't apply. 

