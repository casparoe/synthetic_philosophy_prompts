answer: |-
  Your geological expertise brings a unique and valuable perspective to Wittgenstein's metaphors. Let's reconcile the river-bed and hinge passages without diminishing either, acknowledging the tension while showing how they cohere within Wittgenstein's project in *On Certainty*.

  ### Core Tension Articulated
  You rightly identify the challenge:  
  1.  **Hinges (341-343):** Certain propositions (e.g., "The Earth exists," "I have hands," "Objects don't vanish without cause") function as *unmoved movers*. They are the fixed "hinges" on which the "door" of doubt/testing turns. To doubt *anything*, some things *must* be exempt from doubt. Their certainty is *logical/constitutive*, not psychological.
  2.  **River-Bed (96-97, 99):** Propositions forming the "bedrock" of thought *can* shift over time. What is "hardened" (taken as given) today might become "fluid" (questioned/tested) tomorrow, and vice-versa. The bed itself (the framework) evolves historically. The distinction between "hard rock" (immovable) and "sand" (shifting) adds complexity.

  ### A Close Reading: Reconciling Fluidity and Fixity
  Wittgenstein isn't contradicting himself; he's describing certainty operating at *different levels* and *timescales*. Here's how the passages integrate:

  1.  **Hinges Operate Within a Framework (River-Bed):**
      *   The "hinges" are the *current* hardened propositions within the *existing* river-bed. At any given moment for a community, specific propositions *must* function as fixed hinges for the language-game of doubting/testing to be possible *at that time*.
      *   **Analogy:** While mapping *within* a specific geological epoch, you rely on certain stable features (e.g., the current river course, underlying bedrock) as fixed references. These are your "hinges" for *that* mapping project. However, over geological time, even that bedrock *can* shift (river-bed metaphor). The fixity is relative to the timeframe of the activity.

  2.  **Fluidity Happens on a Different Timescale:**
      *   Wittgenstein emphasizes the *slowness* and *fundamentality* of bed-shifts (97: "not a sharp division," 99: "imperceptible" alteration of hard rock). The shift of the bed itself is a profound, historical change in a *world-picture* (e.g., geocentrism to heliocentrism, Newtonian to relativistic physics).
      *   **Hinges are Contextual:** A proposition functions as a hinge *within a specific historical/cultural "river-bed" framework*. "The sun revolves around the Earth" was once a hinge for medieval cosmology. It ceased to be one. Its *status* changed, not necessarily the sentence itself (99: "one and the same sentence...").

  3.  **The "Hard Rock" vs. "Sand" Distinction Mitigates Relativism:**
      *   Wittgenstein *does* suggest degrees of fundamentality (99). Not all "hardened" propositions are equally fluid.
          *   **"Sand":** Propositions tied to specific, contingent theories or observations (e.g., "Phlogiston causes combustion," "The Earth is 6,000 years old"). These are highly susceptible to being "washed away" as knowledge evolves. They might function as hinges *locally* or *temporarily*.
          *   **"Hard Rock":** Propositions expressing the *deepest conditions of human experience and language itself* (e.g., "The world exists," "Objects persist," "My senses generally inform me," "Other minds exist," "2+2=4"). These are far more resistant to change, constituting the "valley" the river flows through. Their alteration would signify a catastrophic breakdown of sense-making itself, not just a theory change.
      *   **Hinge Function & "Hard Rock":** The most fundamental "hard rock" propositions are the *prime candidates* for hinges *across* different world-pictures. While specific formulations might change, their *functional role* as the deepest anchors of intelligibility persists. Doubting *them* isn't just false; it risks nonsense (e.g., Moorean propositions like "Here is one hand").

  4.  **Hinge Certainty vs. Confidence: A Difference in Kind:**
      *   Wittgenstein *insists* hinge certainty is *not* merely "extreme confidence." Its nature is *grammatical* or *framework-constitutive*.
          *   **Ordinary Belief/Empirical Proposition:** Can be meaningfully doubted, investigated, verified/falsified *against* the hinges. Its truth/falsity makes a difference *within* the game. (Water flowing).
          *   **Hinge Proposition:** Its acceptance defines the "rules of the game." Trying to doubt it *undermines the very possibility* of the doubt being meaningful. It's not "highly probable"; it's the *scaffolding* for assessing probability. (Part of the river-bed itself - hard rock or sand).
      *   **The "Same Sentence" Point (99):** This highlights the *functional* nature of hinges. A sentence like "Water boils at 100°C at sea level" can be:
          *   **Fluid:** An empirical hypothesis being tested in a lab.
          *   **Hardened:** A rule used to calibrate thermometers or diagnose engine problems.
      *   Its status as "fluid" or "hardened" depends on its *role in the specific language-game*, not intrinsic properties. When hardened, it functions *like* a hinge *within that localized context*, though it may not be "hard rock" bedrock.

  5.  **Relativism? A Nuanced Answer:**
      *   **Yes, in a Limited Sense:** Wittgenstein *is* a contextualist regarding *which specific propositions* function as hinges and *which parts* of the bed are hard rock vs. sand. This varies historically and culturally. There is no single, eternal, absolutely fixed bedrock *at the level of specific propositions*.
      *   **No, in a Fundamental Sense:** He resists *wholesale* relativism because:
          1.  **The Need for *Some* Bedrock:** *Every* world-picture *must* have *some* propositions functioning as fixed hinges. Complete fluidity is impossible for meaningful language/doubt. Relativism requires a framework too.
          2.  **Shared Human Form of Life:** The deepest "hard rock" hinges arise from our shared biological and perceptual nature ("animal certainty" - OC 359). While expressed differently, the *kinds* of certainties needed (persistence of objects, reliability of senses, efficacy of action) are rooted in universal human embodiment and interaction with the world. We share the "valley," even if the river's path shifts within it.
          3.  **Non-Arbitrariness of Shifts:** Bed shifts aren't random. They respond to massive accumulations of "fluid" propositions becoming untenable within the old framework (e.g., planetary observations overwhelming geocentrism). The new bed must *work* for navigating the world.

  ### Conclusion: Compatibility Through Function and Scale
  The passages are compatible when viewed through the lens of **functional role** and **timescale**:

  1.  **Synchronic View (Hinges):** At any given moment, for a community engaged in the language-game of knowing/doubting, *specific propositions must function as fixed hinges*. This is a logical requirement for the game itself. These hinges are the current "hardened" parts of the river-bed (potentially including both "hard rock" and more stable "sand").
  2.  **Diachronic View (River-Bed):** Over historical time, the *composition* of the river-bed changes. Propositions can move between "fluid" (empirical) and "hardened" (hinge-like) status. The bed itself, the overall world-picture, *can* shift significantly. The "hard rock"/"sand" distinction shows this shift isn't uniform; some certainties are far more deeply anchored than others.
  3.  **Hinge Status is Relational:** What makes a proposition a hinge is not its eternal truth, but its *current, indispensable role* in anchoring doubt and inquiry *within its framework*. The river-bed metaphor beautifully captures how this framework itself evolves.
  4.  **Relativism Contained:** While the *specifics* of the bed are relative to historical context and human forms of life, the *need* for a bed/hinges is absolute. The deepest "hard rock" hinges, rooted in our shared existence, provide significant stability and guard against arbitrary relativism. Wittgenstein offers a *contextualist foundationalism* – foundations exist, but they are framework-relative and can evolve.

  Your geological insight is apt: mapping terraces requires assuming stable references *for the duration of the project* (hinges), while your very discipline studies how those references (landforms, deposits) are products of immense, slow, continuous change over time (river-bed shift). Wittgenstein's genius lies in applying this dynamic, geological perspective to the very foundations of knowledge and certainty. The tension you perceive is real, but it's the productive tension inherent in understanding human knowledge as both anchored *and* evolving.
