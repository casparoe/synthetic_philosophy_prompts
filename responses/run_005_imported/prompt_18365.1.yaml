  2. **Functional role over content**. What makes a hinge isn’t the *proposition* but its *use* in a language-game. "Water boils at 100°C" can be testable (fluid) or axiomatic (hardened) depending on context.  
  3. **Non-relativist escape**: The "hard rock" (e.g., logic, sensory certainty) might be universal conditions for *any* language-game. Sand (e.g., "the Earth is 6,000 years old") is culturally specific.  

  User’s geology expertise is key. They know river-beds *do* have stable bedrock beneath movable alluvium. Wittgenstein’s metaphor isn’t loose—it’s precise! They’d appreciate mapping "hinges" onto geological strata: deep crust (immovable) vs. surface deposits (shift with epistemic climate).  

  Must stress: Wittgenstein *denies* relativism by anchoring hinges in shared human forms of life (e.g., needing to eat, having bodies). Even if some certainties drift, the river *still flows*—doubt requires *something* fixed.  

