  The apparent contradiction: If hinges can erode like sand, are they truly fixed? But Wittgenstein’s "hard rock" suggests *some* bedrock is permanent. So maybe hinges aren’t monolithic—some are sedimentary (contingent), others igneous (necessary)?  

  User’s hidden worry: Does this undermine objectivity? If even "hinges" shift, is everything relative? They want a reading that doesn’t dismiss either passage.  

  My approach:  
