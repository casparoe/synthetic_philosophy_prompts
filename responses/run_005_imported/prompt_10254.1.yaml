answer: |-
  ## The Unresolved Edge: Epistemicist vs. Supervaluationist

  **Setting:** A slightly-too-bright campus coffee shop, late afternoon. Empty espresso cups litter the table.

  **Characters:**
  *   **Alex (Epistemicist):** Leans forward, gesturing emphatically with a pen. Believes reality is sharp, even if our access is blurry.
  *   **Sam (Supervaluationist):** Sits back, fingers steepled, radiating calm reason. Believes vagueness is semantic indecision, not epistemic darkness.

  **(The dialogue picks up mid-argument about a borderline tall person, say, someone 5'11")**

  **Alex:** ...so you're telling me, Sam, that the statement "He is tall" isn't true *or* false for this guy? It's just... indeterminate? That feels like a cop-out. You're just replacing my sharp boundary between *tall* and *not-tall* with a sharp boundary between what counts as an *admissible precisification* and what doesn't. Where does *that* boundary lie? Is it vague too? Then you need super-supervaluationism, and it's turtles all the way up! The sharp edge is still there, you've just hidden it in the meta-language defining "admissible."

  **Sam:** Alex, it's *not* the same kind of boundary. My sharpness isn't in the *world*, it's in the *description*. For "tall," there isn't *one* set of people who are tall and one set who aren't. There's a *range* of equally legitimate ways to draw the line – precisifications where 5'10" is the cutoff, some where it's 6'0", some where it's 5'11.5". A statement is **supertrue** only if it's true on *every single one* of these legitimate precisifications. That's what avoids the single, mysterious, unknowable cutoff you posit. The boundary isn't relocated; it's *smeared* across a spectrum of acceptable meanings.

  **Alex:** But who decides what's "legitimate"? Who decides what counts as an "admissible precisification"? *That's* where your sharp boundary lives now, Sam. There's a precise set S of precisifications that are admissible. A precisification P is either definitively *in* S or definitively *out*. *That's* your sharp cutoff point. You haven't eliminated sharp boundaries; you've outsourced them to the definition of "admissible." And what makes *that* boundary non-vague? If it's vague too, then "supertrue" becomes vague, and we're back to needing higher-order vagueness *ad infinitum*.

  **Sam:** The admissibility condition *can* be vague! Higher-order vagueness *isn't* a fatal flaw; it's a feature reflecting the open-texture of language. We don't need a super-sharp meta-boundary to avoid your single, ontological sharp cutoff. Admissibility is constrained by usage, context, and the intended meaning of the term – it's not arbitrary. Crucially, for clear cases, *every* admissible precisification agrees. That's why "Shaquille O'Neal is tall" is supertrue – it's robust across all legitimate interpretations. The borderline cases are precisely where precisifications *diverge*. That's indeterminacy, not hidden precision.

  **Alex:** But that's my point about *truth*! You're redefining "true" as "supertrue." For your clear case, Shaq, fine, "He is tall" is supertrue. But for our borderline guy at 5'11", on *your* view, "He is tall" is *not* true *simpliciter*. It's just not false either. But in ordinary language, we *do* say things like "Well, whether he's tall depends on how you define it" or "It's borderline." We don't say "That sentence lacks a truth value." We treat it as a sentence *about the world* that we can't definitively judge. Your "supertrue" seems like a *replacement* for ordinary truth, not an analysis *of* it. Ordinary truth is bivalent: true or false. You've sacrificed bivalence to avoid my epistemic mystery, but at the cost of making vast swathes of ordinary discourse literally truth-valueless!

  **Sam:** I'm not *redefining* truth; I'm *explaining* how truth works for vague predicates. Ordinary truth *is* supertruth for these cases. When we assert "He is tall" in a clear case, we're committing to it holding under any reasonable way of making the term precise. That *is* the robust, ordinary truth we care about. In the borderline, we *correctly* refrain from asserting it's true or false *because there is no fact of the matter* under the meaning fixed by our linguistic practices. Your epistemicism posits a hidden fact – a precise height – that *nobody* can ever know, *in principle*. *That* seems like the more mysterious, ontologically profligate move. My indeterminacy is a reflection of semantic indecision, not cosmic secrecy.

  **Alex:** Semantic indecision sounds nicer, but the mystery just shifts. *Where* does the indecision end? How many precisifications are admissible? 100? 1000? Is there a sharp number? If not, then "admissible" is vague, meaning "supertrue" is vague. If "supertrue" is vague, then the statement "'Shaq is tall' is supertrue" might itself be borderline! But that's absurd – it's *obviously* true that Shaq is tall! Your framework seems to dissolve the very certainty of clear cases under higher-order vagueness. My view preserves the obvious truth of clear cases and explains the borderline as our ignorance of the precise line. The cost is epistemic humility, not semantic collapse.

  **Sam:** Higher-order vagueness doesn't dissolve clear cases. While "admissible" might have borderline cases itself, for core instances of clear cases like Shaq, *every* precisification that even *vaguely* resembles an admissible one will count him as tall. The supertruth of "Shaq is tall" remains stable even if the *exact* boundaries of the set of precisifications are fuzzy. The robustness is preserved. Your epistemicism, on the other hand, forces you to say that for *every single person*, there's a precise millimetre at which they become tall, and we are forever ignorant of where that is for *anyone*, even Shaq! That seems far less intuitive than acknowledging that our language sometimes simply doesn't decide.

  **Alex:** And your supervaluationism forces you to say that for the borderline guy, the sentence "He is tall" isn't true *or* false. That violates the deeply ingrained principle of Bivalence, which underpins classical logic and most ordinary reasoning. We *treat* borderline statements as if they *are* either true or false, we just don't know which. Your view makes a whole class of meaningful statements... meaningless in terms of truth. *That's* the cost of avoiding my "mystery." You trade an epistemic problem for a semantic/syntactic one – abandoning fundamental logical principles.

  **Sam:** Classical logic is a powerful tool, Alex, but it's a tool *we* built. If the phenomenon of vagueness shows it doesn't perfectly fit reality – or rather, the way we talk *about* reality – then maybe the tool needs adjusting, not the phenomenon ignored. We use three-valued logics, fuzzy logics, or supervaluationist logics precisely to model this aspect of language *without* positing unknowable facts. The "cost" is acknowledging the complexity of meaning. Your cost is positing facts forever beyond human ken.

  **Alex:** And your cost is making truth itself hostage to an infinite regress of precisifications and admissibility conditions that can never be fully pinned down. You call it 'smeared'; I call it 'relocated and obscured'. We both see the problem of the borderline; I think my solution, while requiring epistemic humility, preserves a cleaner, more realist picture of truth and the world. Yours, while elegant, seems to dissolve truth into a cloud of potential meanings.

  **Sam:** And I think your 'clean' picture smuggles in an implausible, inaccessible precision. My 'cloud' reflects the genuine flexibility and context-dependence of how we actually use language. We accommodate borderline cases by *not* committing to a single cutoff, not by insisting one exists in hiding.

  **(They both fall silent, looking at their cold coffee. Alex taps the pen nervously. Sam sighs.)**

  **Alex:** So... turtles or mystery?
  **Sam:** Smear or secret?
  **Alex:** ...Another coffee?
  **Sam:** Yeah. Decaf this time. My head hurts enough.

  **(The argument remains unresolved, the sharp edge – wherever it is, or isn't – still glinting just out of reach.)**
