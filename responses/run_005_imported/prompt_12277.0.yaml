prompt: |-
  I'm working on a novel set in New York in the early 70s, and there's a scene where my journalist character finally lands an interview with Hannah Arendt not long after her 'Lying in Politics' essay on the Pentagon Papers came out. I don't want the scene to just be her restating the thesis for the reader's benefit, I need it to read like she's genuinely getting pushed. Can you draft me eight or nine interview questions that dig into the specifics -- at least one on why she thinks factual truth is so much more fragile then rational or philosophical truth, one on that odd move where she ties our capacity to lie to the very same faculty that makes free political action possible in the first place, and one that basically throws the leak back at her: if facts and truth-tellers supposedly have so little power of their own, why did those documents help sink a presidency? For each one, flag the deflection she'd probably reach for and give me a sharp follow-up so my journalist doesn't just let it slide.
reasoning: |-
