answer: |-
  Here's a detailed comparison focusing on your two harder points, pushing towards a verdict on which view holds up better overall:

  **1. Higher-Order Vagueness: The Cost of Iteration**
  *   **Epistemicism:** Williamson's strategy is indeed recursive application of the core idea. For "heap," there's a sharp cutoff between heaps and non-heaps (1st order). There's *also* a sharp cutoff between *definite* heaps and the borderline zone (2nd order), and another sharp cutoff between the borderline zone and *definite* non-heaps (also 2nd order). This hierarchy continues infinitely: sharp boundaries exist between definite^n heaps and definite^n borderline cases, and between definite^n borderline cases and definite^n non-heaps, for every n. The unknowability at each level is explained by the **Margin for Error Principle (MEP)**: To know that n grains make a heap, it must be true that n grains make a heap in *all* sufficiently similar worlds where our evidence is the same. Worlds where the cutoff differs slightly are "sufficiently similar," making knowledge of the exact cutoff impossible at every level.
      *   **Cost:** This commits epistemicism to an **infinite hierarchy of unknowable sharp boundaries** within a single sorites series. While ontologically parsimonious (just boundaries!), it feels deeply counterintuitive and arguably violates the very phenomenon of seamless continuity that motivates the sorites paradox. The MEP explains ignorance but doesn't alleviate the sense that reality is being carved with infinitely many razor blades where experience suggests smoothness.
  *   **Supervaluationism:** The standard approaches are:
      *   **Hierarchy of Precisifications:** Define a precisification not just for "heap," but for "definitely a heap," "definitely definitely a heap," etc. Each level requires its own set of precisifications defining the admissible sharpenings *of the previous level's operator*. This quickly becomes **semantically complex and ontologically bloated**.
      *   **"Definitely" Operator (D):** Introduce a sentential operator `Dφ` meaning "It is definite that φ". `Dφ` is true iff φ is true on *all* admissible precisifications. Borderline cases are neither `Dheap(n)` nor `D~heap(n)`. Higher-order vagueness arises because `Dφ` itself is vague – there are borderline cases of definiteness. Supervaluationism handles *this* vagueness by allowing the set of admissible precisifications itself to have borderline members. `DDφ` is true iff `Dφ` is true on *all* admissible precisifications *of the set of admissible precisifications* for the base language. This threatens **regress**: `D` itself generates a new sorites series (Is `Dheap(n)` true? What about `Dheap(n-1)`?), requiring higher-order precisifications for `D`, and then for `DD`, and so on. While this avoids infinitely many sharp boundaries *in the object language*, it requires infinitely many levels of *semantic machinery* (sets of sets of precisifications) or faces the paradox anew at the meta-level.
  *   **Comparison:** Both incur significant costs. Epistemicism's cost is primarily **metaphysical** (infinite sharp boundaries) and **phenomenological** (clashing with the felt continuity). Supervaluationism's cost is primarily **semantic complexity** (hierarchies of precisifications) or the **regress problem** with `D`. While the regress is unattractive, the supervaluationist avoids positing sharp boundaries *in the world*, which arguably respects the core intuition driving vagueness better. Epistemicism's MEP provides a unified explanation of ignorance across levels, but the infinite sharp boundaries feel like a high price. **Slight edge to Supervaluationism** here, as its cost seems more technical/formal, while epistemicism's feels more deeply at odds with the phenomenon.

  **2. Penumbral Connections: The Cost of "Getting Them For Free"**
  *   **Supervaluationism:** Penumbral connections (e.g., "If x is taller than y and y is tall, then x is tall") are handled **directly and explicitly** via the **admissibility constraints** on precisifications. Any precisification that violates such a connection is deemed *inadmissible*. This is a core feature of the semantics. The connection holds (is supertrue) because it holds on every admissible way of making the predicates sharp.
      *   **Cost:** Admissibility constraints are an **additional stipulation** in the semantics. The supervaluationist needs to provide a theory of what makes a constraint "penumbral" and why it should be built into admissibility (often appealing to meaning/conceptual role/use).
  *   **Epistemicism:** Epistemicism claims a significant advantage: penumbral connections *are* **classical logical entailments** of the single, sharp interpretation. If the sharp cutoff for "tall" is at 180cm, then *classically*, anyone taller than someone who is ≥180cm must also be ≥180cm. So "Taller than a tall person is tall" comes out straightforwardly true (and necessarily so) on the actual, unknown sharp interpretation. No extra semantic stipulation needed.
      *   **Cost:** This is where epistemicism's "advantage" becomes its Achilles' heel. The crucial question is: **Why does the *actual*, unknown sharp cutoff *necessarily respect* the penumbral connection?** The epistemicist answer relies *entirely* on how meaning is fixed by use. The problem is that **patterns of use are *vague* and *tolerant***, precisely generating the sorites paradox. Use *seems* equally consistent with many slightly different sharp cutoffs, *some of which violate the connection*. For example, imagine use fixes "tall" such that 180cm is tall, but due to tolerance, 179.9cm is also considered tall in enough contexts that it *just barely* falls into the extension. Now imagine someone 179.8cm tall who is taller than someone 179.9cm tall. On *this* sharpening, the penumbral connection fails. If use patterns genuinely *underdetermine* the exact cutoff (as epistemicism requires for ignorance), why is it *impossible* for the cutoff to be fixed in a way that violates "taller than tall is tall"? Epistemicism needs **strong metasemantic principles** ruling out *any* sharpening that violates such connections as *ineligible* to be the actual meaning. This looks suspiciously similar to the supervaluationist's admissibility constraints, smuggled in at the metasemantic level. Epistemicism doesn't get the connection "for free"; it pays for it by needing **additional, non-classical constraints on how meaning supervenes on use**, undermining its claim to pure classical semantics and bivalence *all the way down*. Its explanation *why* the cutoff respects the connection is arguably *weaker* than the supervaluationist's explicit semantic rule.
  *   **Comparison:** Epistemicism's promise of "getting penumbral connections for free via classical logic" is **illusory**. It avoids a semantic stipulation only by requiring equally strong (and less transparent) **metasemantic stipulations** about which sharp interpretations are *possible* referents given vague use. This exposes a tension within epistemicism: the very tolerance in use that creates ignorance *also* seems compatible with cutoffs violating intuitive connections. Supervaluationism handles penumbral connections transparently within its core semantics via admissibility. **Clear edge to Supervaluationism** on this point.

  **Verdict: Supervaluationism is in Better Overall Shape**

  While both theories face serious challenges with higher-order vagueness (a draw, leaning slightly supervaluationist), epistemicism **falters decisively on penumbral connections**. Its inability to genuinely explain *why* the unknown sharp cutoff *must* respect logical connections like "taller than tall is tall" without appealing to metasemantic constraints functionally equivalent to supervaluationist admissibility is a major weakness. This undermines epistemicism's core claim to preserve pure classical logic and bivalence without hidden costs.

  Supervaluationism:
  1.  **Respects the Phenomenon:** Avoids positing sharp boundaries in the world, accommodating the intuition of seamless transition.
  2.  **Handles Penumbral Connections Transparently:** Builds them directly into the semantics via admissibility constraints.
  3.  **Accommodates Truth-Value Gaps:** Provides a natural home for genuine borderline cases, aligning with linguistic intuition.
  4.  **Manages Higher-Order Vagueness (with effort):** While complex or regressive, its strategies don't posit metaphysically jarring infinite sharp boundaries.

  Epistemicism's strengths (preserving classical logic/bivalence, offering a unified explanation of ignorance via MEP) are outweighed by its high metaphysical cost (infinite sharp boundaries) and its fatal struggle to genuinely ground penumbral connections in vague use without covertly adopting supervaluationist-like constraints. **Supervaluationism, despite its semantic complexities, offers a more coherent and phenomenologically faithful account of vagueness overall.**
