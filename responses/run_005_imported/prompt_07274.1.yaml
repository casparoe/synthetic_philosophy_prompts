  Next, penumbral connections. These are logical constraints (e.g., if someone is taller than a tall person, they're tall). Supervaluationism builds these into admissibility conditions for precisifications. Epistemicism, however, might get them as classical entailments from a single sharp cutoff. The user questions if epistemicism truly gets them for free or if it struggles to explain why the cutoff respects such connections based solely on usage patterns.

