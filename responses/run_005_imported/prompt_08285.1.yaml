prompt: |-
  This is weirdly relevant to my new job so I need an outside opinion. I just started writing the turn-by-turn instructions for a maps app, and we keep getting complaints about the exact thing that happened to me on a drive last week: the app said 'turn right at the Shell station,' except that Shell closed down over a year ago and its just an empty building now (there's no other gas station anywhere near that intersection either). My friend Maya, who was in the car, said the instruction was flat out false — there is no Shell station there, period, and an app doesn't get to dodge being right or wrong about that any more than a person would. My other friend Deshawn said that's too quick: nobody in the car thought the app had lied to us or gotten something wrong the way a false statement is wrong, we all knew exactly which turn was meant and got there fine, so whatever's going on with that sentence, 'just false' doesn't capture it. Maya said doing its job and being true are two different things, and that letting it off the hook for that reason would mean we'd also have to stop calling stuff like 'the file is 12MB' false when its actually 11.9 and got rounded up, which seems wrong. Deshawn said ok fine, so then what IS 'turn right at the Shell station' if there's no Shell station there — is it false, or does it not even get far enough to be false because it assumed something that wasn't true in the first place? Maya said that's just a fancier way of dodging the question. They argued about this for way too long at dinner and neither budged, and now I kind of actually need to know since I might end up writing company guidance on this exact scenario. Can you go through their exchange move by move and say whos got the better of it at each point, and whether there's a real answer here or whether they've just wandered into a fault line that people who study this for a living still haven't sorted out?
reasoning: |-
  Okay, let me unpack this user's problem. They're dealing with a real-world issue at their new job writing map app instructions, triggered by a personal experience where the app referenced a defunct Shell station. The core debate between their friends Maya and Deshawn revolves around whether such instructions are "false" or something else entirely. 

  Hmm, the user needs this analyzed professionally because they might have to create company guidelines. That raises the stakes - this isn't just philosophical anymore. I notice they're framing it as "who won each point" but what they really need is clarity on the underlying linguistic mechanisms.

  First thought: Maya's position feels intuitively correct - if the Shell station doesn't exist, saying "turn at the Shell station" is factually incorrect. But Deshawn has a point about functionality overriding literal truth. Interesting how this mirrors debates in pragmatics about speaker meaning versus literal meaning. 

  *flipping through mental files* Ah right - this is exactly where presupposition failure comes in. Strawson's work from the 50s applies perfectly here. The instruction presupposes the Shell station exists, and when that fails, the statement can't properly be true OR false. That might reconcile both viewpoints.

  Wait, but Maya's rounding example ("11.9MB as 12MB") exposes a weakness. Technical rounding is conventionally acceptable, whereas referencing non-existent landmarks isn't. That suggests contextual norms matter. For the map app, the key is probably whether users reasonably expect absolute precision about landmarks versus just navigation success.

  *imagining writing guidelines* The solution might be tiered: 
  1) Avoid landmark references when possible (use "third exit at roundabout" etc) 
  2) If using landmarks, implement expiration dates for references 
  3) Accept that "technically false but functionally adequate" exists as a category, but minimize it because...

  *lightbulb* ...because unlike rounding conventions, users have no way to verify landmark references in real-time. That asymmetry makes Deshawn's "it worked so it's fine" argument weaker in practice, even if logically sound. 

  User's probably frustrated by abstract debate when they need actionable answers. Should emphasize that while philosophers might quibble, for their job the focus should be on user perception: if multiple people complain about "false" instructions, then functionally it doesn't matter what theorists say - the wording needs changing.
answer: |-
  This is a fascinating philosophical *and* practical debate hitting on truth, reference, presupposition, and the purpose of language – perfectly relevant to your job! Let's break down Maya and Deshawn's moves, who has the better argument at each point, and whether there's a resolution:

  **The Exchange & Analysis:**

  1.  **Maya's Initial Claim: "The instruction is flat-out false."**
      *   **Her Point:** The statement "Turn right at the Shell station" asserts the existence of a Shell station at that location. Since no Shell station exists, the statement is straightforwardly false. An app shouldn't get a free pass on truthfulness just because it's software; its statements are subject to truth evaluation like any human utterance.
      *   **Strength:** Intuitively strong. Correspondence theory of truth (a statement is true if it corresponds to reality) is dominant. If the Shell station isn't there, the statement describing an action relative to it seems false. She correctly identifies a core function of language: making accurate claims about the world.

  2.  **Deshawn's Counter: "It did its job, we knew the turn, 'just false' doesn't capture it."**
      *   **His Point:** The *functional purpose* of the utterance (getting you to take the correct turn) was achieved. Everyone understood the intended meaning and acted successfully. Calling it "just false" ignores this successful communication and implies a failure that didn't occur in practice. Truth isn't the only metric for success here.
      *   **Strength:** Pragmatically strong. He highlights the *illocutionary force* (the intended action) of the utterance – it's an instruction, not purely a statement of fact. Its success should be judged partly on whether it elicits the correct action. He identifies a key tension: functional success vs. literal truth.

  3.  **Maya's Rebuttal: "Doing its job ≠ Being True. Slippery slope with rounding."**
      *   **Her Point:** Success and truth are distinct. An instruction can work *despite* being factually incorrect. Letting it off the hook sets a dangerous precedent. If we excuse "Shell station" when it's gone, why not excuse rounding 11.9MB to 12MB? Both involve inaccuracy, and we *should* call the rounded statement false (or at least inaccurate).
      *   **Strength:** Very strong. She effectively blocks the "it worked, so it's okay" defense by separating performance from truth value. The rounding analogy is potent: it shows similar cases where we *do* care about literal accuracy, even when the functional outcome (knowing the file is ~12MB) is achieved. This exposes a potential inconsistency.

  4.  **Deshawn's Pivot: "Presupposition Failure - Maybe it's not even false?"**
      *   **His Point:** Perhaps the statement "Turn right at the Shell station" *presupposes* the existence of the Shell station rather than *asserting* it. If the presupposition fails (the Shell station doesn't exist), the statement isn't false; it's *undefined*, *meaningless*, or suffers from "reference failure." It doesn't get to the point of being true or false because a fundamental assumption is broken. It's like saying "The King of France is bald" when France has no king – is it false, or nonsensical?
      *   **Strength:** Philosophically sophisticated. He introduces a key concept from semantics/pragmatics: **presupposition**. Many utterances rely on background assumptions being true for the main statement to be evaluable. This *does* offer a potential escape from the simple "true/false" binary. He correctly identifies that the existence of the landmark is backgrounded, not the main point.

  5.  **Maya's Counter: "Fancier way of dodging. We still know what it *meant* to say."**
      *   **Her Point:** Calling it "presupposition failure" feels like semantic gymnastics to avoid calling a spade a spade. The app *intended* to refer to a specific location using the phrase "the Shell station." That phrase failed to refer because the object doesn't exist. We understood the *intended meaning* (the location), but the *words used* were factually incorrect. Dodging "false" with technicalities doesn't resolve the core inaccuracy.
      *   **Strength:** Strong pragmatic counter. While presupposition failure is a valid concept, it doesn't erase the fact that the app used a description that doesn't match reality. Users *do* perceive this as the app being "wrong," regardless of the technical semantic classification. The communicative intent was clear, but the chosen referring expression was defective.

  **Who "Wins" Each Point?**

  *   **Point 1 (Maya - False):** Maya wins on intuitive truth-correspondence. *(Score: Maya 1 - Deshawn 0)*
  *   **Point 2 (Deshawn - Function):** Deshawn wins on highlighting functional success vs. pure truth. *(Score: Maya 1 - Deshawn 1)*
  *   **Point 3 (Maya - Job ≠ Truth, Rounding):** Maya wins decisively. Separating function from truth and the rounding analogy are powerful. *(Score: Maya 2 - Deshawn 1)*
  *   **Point 4 (Deshawn - Presupposition Failure):** Deshawn wins on introducing a valid and relevant philosophical/semantic concept. *(Score: Maya 2 - Deshawn 2)*
  *   **Point 5 (Maya - Dodging):** Maya wins on practical grounds. Presupposition failure explains *why* it's problematic but doesn't negate the core inaccuracy from a user perspective. *(Final Score: Maya 3 - Deshawn 2)*

  **The Bigger Picture: Is there a real answer? Have they hit a fault line?**

  **Yes, they've hit a significant fault line in philosophy of language and semantics.** This debate touches on core unresolved tensions:

  1.  **Truth vs. Use (Correspondence vs. Pragmatism):** Is the primary function of language to state truths (Maya) or to get things done (Deshawn)?
  2.  **Reference & Descriptions:** How do words hook onto the world? What happens when a definite description ("the Shell station") fails to refer? (Direct Reference vs. Descriptivist theories).
  3.  **Presupposition:** When does the failure of a background assumption render a statement non-truth-evaluable vs. simply false?
  4.  **Context & Speaker Intent:** How much does the context (driving instruction) and the clear speaker intent (identifying a turn location) mitigate literal falsehood?

  **Scholars *are* still debating these nuances.** There's no single, universally agreed-upon answer to whether "Turn right at the [non-existent] Shell station" is strictly *false*, suffers from *presupposition failure*, or is primarily *infelicitous* (unsuitable for its purpose).

  **The Practical Answer for Your Job:**

  Forget about settling the philosophers' debate. Your company guidance needs **practical, user-centric solutions**:

  1.  **Prioritize Unchanging Landmarks:** Avoid volatile references like specific businesses (gas stations, restaurants, stores). Favor permanent or semi-permanent features:
      *   Traffic lights
      *   Stop signs
      *   Specific lane configurations ("take the second exit from the roundabout")
      *   Major, stable intersections ("at the intersection of Main St and 5th Ave")
      *   Large, permanent buildings (hospitals, city halls, *major* known landmarks - use cautiously).
      *   Highway exit numbers.
  2.  **Implement Landmark Expiry Dates:** If using business landmarks *is* necessary (e.g., "after passing the Walmart"), build systems to flag them for review or automatic removal after a period of inactivity/no confirmation. Treat them as temporary, unreliable references.
  3.  **Acknowledge the "Functional Truth" Gap:** Recognize Maya's point – the instruction *is* factually inaccurate. Don't pretend otherwise internally. The goal is to minimize these inaccuracies because:
      *   They erode user trust over time ("If they're wrong about the Shell station, what else is wrong?").
      *   They *can* cause confusion, especially if multiple similar landmarks exist or the area changes significantly.
      *   They sound unprofessional.
  4.  **Define "Accuracy" Contextually:** In your guidance, define accuracy for navigation instructions as:
      *   **Primary:** Correctly identifying the required maneuver and location.
      *   **Secondary:** Using referring expressions (landmarks, street names) that are *currently valid and unambiguous* for that location.
      *   A failure of Secondary accuracy (like the Shell station) is a defect, even if Primary accuracy was achieved. The rounding analogy holds: 11.9MB reported as 12MB is *inaccurate*, even if functionally adequate for many users.
  5.  **Phrase Guidance Proactively:** "Avoid instructions reliant on volatile points of interest. When unavoidable, implement mechanisms to ensure their ongoing validity. Instructions using invalid references are functionally deficient and undermine user trust, regardless of semantic categorization."

  **Conclusion:**

  Maya edges out Deshawn by consistently forcing the issue of factual inaccuracy, but Deshawn rightly highlights functional success and introduces the crucial concept of presupposition failure. They *have* hit a real philosophical fault line concerning reference, truth, and presupposition. However, for your practical purpose of writing app guidance, the key takeaway is: **Treat references to non-existent landmarks as errors that need to be prevented.** They are factually incorrect (supporting Maya), potentially confusing, and damage user trust, outweighing any semantic debate about *why* they are problematic. Focus on solutions that prioritize stable references and minimize reliance on volatile ones. Good luck with the new job!
