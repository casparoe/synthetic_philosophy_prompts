  The dialogue should feel authentic. Maybe set it in a lab, with characters named Dr. Shaw (realist) and Dr. Vale (proxy-theorist). Start with the rat experiment as a springboard. Shaw's strongest point: if reward is pleasure, then wireheading achieves it efficiently. Vale's counter: systems break when proxies are hacked, like an economy fixating on GDP but collapsing. 

