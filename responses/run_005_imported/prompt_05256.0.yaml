  For the wireheading disaster, Shaw must concede it's bad functionally but not morally—if everyone's happy, who cares? Vale's response: without external engagement, society collapses, leading to suffering. But Shaw might call this a temporary glitch. Vale's deeper point: wireheading destroys the conditions for sustained value, making it self-defeating.

