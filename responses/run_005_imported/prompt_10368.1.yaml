   5. Normandy bombardment: The target was military (German defenses). The civilian deaths were collateral damage. This seems to fit the double effect: the act (bombing military targets) is legitimate, the civilian deaths are foreseen but not intended, and the proportionality must be considered (the importance of D-Day). So, arguably permissible.

   6. US submarine campaign: The merchant ships are legitimate targets because they are carrying war supplies. The deaths of the civilian sailors might be considered as part of the destruction of the target (so intended) or as a foreseen side effect. However, in naval warfare, enemy merchant vessels are considered legitimate targets. But the sailors are non-combatants? In practice, they are often considered as taking part in the war effort. However, the subsequent effect on the Japanese population (starvation) is a foreseen consequence. The intention of the campaign is to cut off supplies, not directly to kill civilians. The deaths of the sailors might be seen as a side effect of sinking the ships. The starvation of the population is a further side effect. But if the starvation is then used as a means to force surrender, then it becomes intended? However, the campaign was primarily aimed at military supplies. This is contested.

