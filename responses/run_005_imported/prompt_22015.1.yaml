  I was a geologist for almost 40 years, and since retiring I've gotten pretty into philosophy - books, podcasts, that sort of thing. Something's been nagging at me about a situation with my brother. Our late father's will set up a joint investment account for the two of us with an odd rule: each year, control alternates between us, and whoever's turn it is can either cash out immediately for a noticeably bigger cut, something like 60-40, or leave it invested for another year, letting it keep compounding while control passes to the other one. The whole thing automatically ends after year six regardless, split evenly at that point. We're in year four now, and we've both happily left it invested every year so far since the pot keeps growing alot. But it's my brother's turn this year, and he just announced he's cashing out, with this reasoning: "in year six, whoever's turn it is will obviously just take the 60% instead of letting it split evenly by default - so in year five, knowing that, same logic applies, take the 60% instead of passing it to someone who'll just do that to you - and so on, back to right now, so I should just take mine today." Being a scientist I appreciate a clean chain of reasoning, but something about this one feels off, and it's bugging me because it kind of reminds me of some philosophy thing I've read about recently but can't quite place. Is my brother actually being rational here, or is there a flaw in his logic somewhere?
