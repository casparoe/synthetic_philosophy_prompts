   Key points:
   1. The highest art is "religious art" that conveys feelings of brotherhood and Christian love (or universal religious feeling) accessible to all.
   2. Next is "universal art" that sincerely infects the common person with a feeling that is universally accessible (even if not explicitly religious).
   3. "Bad art" is art that may be infectious but the feeling it conveys is bad (e.g., pride, lust, exclusive patriotism) and thus divisive.
   4. "Counterfeit art" is art that does not sincerely infect, but is admired by the elite due to training and pretense.

   Steps for each work:
   - Assess the sincerity and infectiousness (Tolstoy might question some on sincerity, especially if they are complex and require training).
   - Assess the feeling conveyed: is it universal and good (brotherhood, love, simple human experiences) or bad (divisive, exclusive, immoral) or only accessible to the elite?
