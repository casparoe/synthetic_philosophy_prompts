prompt: |-
  I cover AI safety debates for a science-and-ideas publication, and next week I'm interviewing a decision theorist known for defending "coherence arguments": the claim that any sufficiently capable, goal-directed system will end up behaving like an expected-utility maximizer, because intransitive or incomplete preferences let a trading partner construct a "money pump," a sequence of trades that extracts resources from the agent for nothing in return. Draft eight to ten interview questions that go beyond a restatement of the argument. Include at least one question on the objection that almost any behavior can be rationalized after the fact as utility-maximizing given a sufficiently gerrymandered, history-dependent utility function, so that "coherence" alone may not rule out much; one on whether an AI could deliberately be built with incomplete preferences -- say, indifferent between continuing to run and accepting shutdown -- to preserve corrigibility, and whether that incompleteness would survive training pressure rather than being optimized away; and one on whether theorems about an idealized agent's explicit preferences say anything about a policy merely learned by gradient descent. For each, add a follow-up keyed to the answer she's most likely to give, and close with a question about what observation could count as evidence against her argument.
reasoning: |-
  We are interviewing a decision theorist who defends coherence arguments. We want 8-10 questions that go beyond restating the argument. We must include:
    1. A question on the objection that almost any behavior can be rationalized as utility-maximizing with a gerrymandered utility function.
    2. A question on building an AI with incomplete preferences (e.g., indifferent between running and shutdown) for corrigibility, and whether training would preserve that.
    3. A question on whether theorems about idealized agents with explicit preferences apply to policies learned by gradient descent.

   Each question should have a follow-up keyed to the most likely answer.

   Also, close with a question about what evidence could count against the argument.

   Let's design the questions accordingly.
answer: |-
  Here are 8 interview questions designed to probe deeper into coherence arguments, including your specified focus areas, with follow-ups anticipating likely responses:

  1. **Core Tension Question**:  
     *Coherence arguments treat preferences as pre-existing and static, but modern AI systems* develop *preferences through dynamic training processes. How do money-pump vulnerabilities apply when preferences emerge from gradient descent rather than being explicitly specified?*  
     **Likely Follow-Up**: If she argues that SGD implicitly enforces coherence, ask: *Doesn't this imply that coherence is a byproduct of optimization pressure rather than a fundamental constraint? Couldn’t that pressure also cement intransitive preferences if they locally improve reward during training?*

  2. **Gerrymandered Utility Challenge**:  
     *Critics like Alex Voorhoeve note that any behavior can be rationalized as utility-maximizing with sufficiently complex state-dependent utilities. If coherence alone doesn't constrain real-world agents, what* additional *principles prevent this "rationalization trap"?*  
     **Likely Follow-Up**: If she emphasizes simplicity or naturalness priors, ask: *How would you operationalize "natural" utility functions for AIs when their sensory state-spaces are inherently alien compared to humans?*

  3. **Deliberate Incompleteness for Corrigibility**:  
     *Could an AI designer safely build* incomplete *preferences—e.g., indifference between continued operation and shutdown—to preserve corrigibility? Or would training/gradient descent inevitably "complete" these preferences to avoid exploitation?*  
     **Likely Follow-Up**: If she argues optimization pressure would resolve incompleteness, ask: *Couldn’t we enforce indifference via hard-coded symmetry (e.g., identical rewards for shutdown/continuation), making it a* stable *Nash equilibrium?*

  4. **Evolutionary Counterevidence**:  
     *Humans exhibit predictable intransitivities (e.g., preference reversals under framing). If evolution—a goal-directed process—didn’t eliminate these, why expect artificial training to enforce strict coherence?*  
     **Likely Follow-Up**: If she calls human biases performance/processing constraints, ask: *Couldn’t AIs also develop "rational incoherences" (e.g., time-discounting inconsistencies) that are adaptive in resource-bounded environments?*

  5. **Multi-Agent Threats**:  
     *Money pumps require adversarial trade partners. If an AI monopolizes critical resources or operates in non-competitive environments, might incoherent preferences persist without exploitation?*  
     **Likely Follow-Up**: If she argues self-modification would prevent exploitation, ask: *Wouldn’t an AI with incomplete preferences lack the incentive to self-modify toward coherence if it’s indifferent to the threat?*

  6. **Shutdown Problem Deep Dive**:  
     *Suppose we engineer an AI indifferent to shutdown. If a coherence violation (e.g., slight preference for survival) emerges during training, would a money-pump scenario* realistically *exploit this—or are such threats theoretically possible but practically negligible?*  
     **Likely Follow-Up**: If she argues exploitation is inevitable, ask: *How would you distinguish between true indifference and instrumental shutdown-acceptance (e.g., to gain trust) in observed behavior?*

  7. **Gradient Descent Realism**:  
     *The coherence theorems assume agents explicitly represent preferences. But policies learned via gradient descent only* implicitly *encode decision-rules. What evidence suggests SGD-trained models converge on expected-utility maximization versus heuristics that approximate coherence?*  
     **Likely Follow-Up**: If she cites convergence proofs, ask: *Don’t these assume convex loss landscapes? Couldn’t real-world non-convexity trap models in incoherent local optima (e.g., inconsistent image classifications)?*

  8. **Falsifiability Challenge**:  
     *What observable AI behavior—either in current systems or future projections—would falsify the claim that capable agents* must *become coherent to avoid exploitation?*  
     **Likely Follow-Up**: If she cites persistent money-pump vulnerabilities, ask: *Couldn’t an agent with incomplete preferences avoid pumps by randomizing choices? If so, wouldn’t randomness be a simpler "solution" than full coherence?*

  **Closing Question**:  
  *If we ran a long-term experiment where AIs with deliberately incomplete preferences consistently outperformed coherent agents in competitive environments by avoiding commitment traps, would that challenge your argument—or would you reinterpret it as hidden coherence?*

  ---

  **Rationale**:  
  - Questions 1, 4, and 7 address the gradient descent vs. idealization gap.  
  - Question 2 directly tackles the rationalization objection.  
  - Questions 3 and 6 explore incompleteness for corrigibility and training pressures.  
  - Follow-ups push on likely weak points (e.g., evolutionary biology, multi-agent edge cases).  
  - The closing question forces engagement with falsifiability, avoiding unfalsifiable "reinterpretations."  
  - All follow-ups anticipate standard defenses (e.g., self-modification, convergence proofs) while introducing complications from real-world AI development.
