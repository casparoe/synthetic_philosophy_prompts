answer: |-
  Here is a self-contained, hypothetical legal system designed to satisfy all eight of Fuller's conditions while enforcing a substantively cruel and unjust law. I'll then analyze whether this vindicates Hart's position.

  ---

  ### **The State of Exemplaria: The Genetic Purity Act (GPA)**  
  **Core Substance:**  
  All citizens must undergo mandatory genetic screening at age 18. Those carrying markers for *any* of 20 designated "hereditary defects" (e.g., genetic predispositions to depression, dyslexia, or myopia) are permanently sterilized. The state claims this ensures "biological optimization."  

  **Application of Fuller’s Eight Conditions:**  
  1. **Generality**  
     The GPA applies to *all* citizens equally. It is a general rule: "Any person reaching 18 years shall submit to genetic screening..."  

  2. **Promulgation**  
     The law is published in the *Exemplaria Legal Gazette*, publicly accessible online and in libraries. Citizens receive mailed notices at 17.5 years.  

  3. **Non-Retroactivity**  
     The GPA applies only to those turning 18 *after* its enactment. No one is punished for pre-existing conditions.  

  4. **Clarity**  
     The law defines "hereditary defects" with scientific precision (e.g., "FGF20 gene deletion, rs12720208 genotype CC"). Screening protocols are detailed in annexes.  

  5. **Non-Contradiction**  
     No conflict with other Exemplarian laws. A "Genetic Review Board" resolves ambiguities (e.g., rare gene variants).  

  6. **Possibility of Compliance**  
     Compliance is physically possible: citizens report to state clinics for a blood test. Non-compliance is punished by forced screening + fines.  

  7. **Constancy**  
     The law remains unchanged for decades. Citizens know the requirements from birth.  

  8. **Congruence**  
     Officials apply the GPA exactly as written. Screening results trigger automatic sterilization orders. No hidden exemptions.  

  ---

  ### **The Moral Horror**  
  - **Injustice:** The law pathologizes benign genetic variations, violating bodily autonomy and imposing irreversible harm based on pseudoscientific eugenics.  
  - **Cruelty:** Targets vulnerable groups (e.g., those with family histories of anxiety) and denies them fundamental rights.  
  - **Yet** it satisfies *every* procedural condition of Fuller’s "inner morality."  

  ---

  ### **Does This Vindicate Hart?**  
  **Yes, decisively.** Hart argued that procedural legality and substantive morality are *conceptually distinct*. Exemplaria’s GPA proves his point:  
  - A legal system can be impeccably "law-like" (clear, consistent, non-retroactive) while enforcing monstrous rules.  
  - Fuller’s conditions ensure *efficiency* and *predictability*, not justice. They make the state’s cruelty *more effective* by eliminating excuses for non-compliance.  

  **Hart’s Core Insight:**  
  > *"The grimmest tyranny can wear the mask of legality. Efficiency in evil is still evil."*  

  ---

  ### **Could a Fuller Defender Explain This Away?**  
  Fullerians might offer three rebuttals—but each has flaws:  

  1. **"The System Collapses Over Time"**  
     *Claim*: Such injustice would inevitably violate congruence (e.g., officials secretly exempt elites) or clarity (e.g., manipulating genetic definitions).  
     *Counter*: Exemplaria *assumes* perfect compliance. If Fuller’s conditions *require* moral substance to be sustainable, that concedes Hart’s point: the "inner morality" isn’t purely procedural.  

  2. **"It Degrades Law’s Purpose"**  
     *Claim*: Law’s function is to guide behavior through rules. Sterilizing citizens for innate traits makes planning impossible, violating the "possibility of compliance."  
     *Counter*: The GPA *does* guide behavior: citizens know to report for screening. The cruelty is in the *outcome*, not the rule’s structure.  

  3. **"Fuller’s Conditions Are Necessary but Not Sufficient"**  
     *Claim*: Fuller never argued his conditions *guarantee* justice—only that without them, a system isn’t "law" at all.  
     *Counter*: This retreats to minimalism. Hart would agree Nazi "laws" were dysfunctional—but not because they were immoral. They were retroactive, secret, and inconsistent. Exemplaria has none of those flaws.  

  ---

  ### **Conclusion: Hart Wins the Logical Battle**  
  Exemplaria demonstrates that **procedural integrity and substantive justice are separable**. Fuller’s conditions create a *well-functioning* legal system, not a *just* one. Hart was right: legality alone cannot prevent tyranny. It may even empower it.  

  **However**: Fuller’s deeper insight—that law *aspires* to reciprocity between rulers and ruled—remains compelling. Exemplaria’s citizens might revolt, proving that purely coercive "law" is unstable. But as a philosophical matter, Hart’s razor cuts clean: morality is not baked into law’s DNA. It must be fought for elsewhere.  

  > *"A guillotine that drops predictably on the third Tuesday of each month is no less a guillotine."*  
  > —Hypothetical Hartian footnote.
