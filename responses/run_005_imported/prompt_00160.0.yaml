prompt: |-
  I've been re-reading the Center on Long-Term Risk material on surrogate goals as a defense against acausal blackmail, and I brought it up with a friend from my local rationalist meetup last week, but something about the whole setup still doesn't sit right with me. As I understand basic game theory, a threat is only something to worry about if the threatener actually stands to gain from carrying it out — otherwise punishing you after you've already refused to comply is just costly to them with zero payoff, so it's an empty bluff that any sufficiently rational agent should simply ignore. If that's correct, then the entire apparatus of acausal threats, and the surrogate-goal machinery built to defend against them, seems to be solving a problem that a rational agent would never actually face, since no rational threatener would follow through once refusal has already occurred.

  So I'm trying to figure out what I'm missing here. Is there something about how these scenarios are modeled under decision theories like UDT or FDT that makes follow-through rational (or at least credible) in a way that standard backward-induction reasoning would rule out? Or is the value of surrogate goals more about hedging against threateners who aren't perfectly rational, or who can't be reliably distinguished from ones who are actually committed to following through? I'd appreciate a clearer picture of why decision theorists in this space treat the threat model as dangerous enough to warrant a defense like adopting a surrogate goal in the first place.
reasoning: |-
  Okay, the user is grappling with the concept of acausal blackmail and surrogate goals from Center on Long-Term Risk material. They're confused because standard game theory suggests threats are only credible if the threatener benefits from following through. Since punishing after refusal seems costly with no gain, it should be an empty bluff. Yet, decision theories like UDT/FDT treat these threats seriously. The user wants to understand why the threat model is considered dangerous enough to require defenses like surrogate goals.

  First, I need to recall how acausal threats differ from traditional ones. In standard game theory, backward induction rules out non-credible threats. But in acausal scenarios, the threatener's decision isn't chronological but based on logical dependence. The threatener might exist in a different universe or be a hypothetical agent, and their action is determined by the same logical structure that the defender uses to decide. This interdependence is key.

  The user's core confusion is why follow-through is rational. Under UDT/FDT, agents consider all possible outputs of their decision algorithm simultaneously. If the threatener's algorithm outputs punishment when the defender's algorithm outputs non-compliance, and vice versa, both are stuck in a mutual defection outcome. The threatener follows through not because of direct benefit but because their algorithm is programmed to respond to non-cooperation. Since the defender's decision is also part of this logical web, avoiding the threat requires changing how their algorithm is evaluated across possible worlds.

  The user might also be missing the pre-commitment aspect. Surrogate goals serve as a pre-commitment device. By adopting a goal that values the threatener's satisfaction, the defender ensures cooperation even if the original goal would defect. This breaks the symmetry and avoids the bad equilibrium. It's like committing to a strategy that forces cooperation.

  Another point is logical correlation. If the threatener and defender have correlated decision-making processes (e.g., similar source code), the threatener can predict the defender's actions. If the defender is known to use UDT/FDT without a surrogate, the threatener anticipates defection and punishes. Only by modifying the algorithm (via surrogate) can the defender signal cooperation, making the threatener cooperate too.

  The user might be thinking in terms of sequential rationality, but acausal games are simultaneous in a logical sense. The decisions are interdependent, so backward induction doesn't apply. The equilibrium is defined by fixed points of decision functions. Without a commitment mechanism like surrogate goals, mutual defection is a stable but undesirable outcome.

  Also, the user might underestimate the risk of irrational or diverse agents. But the primary reason in UDT/FDT is logical correlation, not irrationality. Surrogate goals are a solution within perfect rationality frameworks. However, the user's point about hedging against non-rational actors is valid as a secondary benefit.

  In summary, the user needs to shift from sequential game thinking to logical decision theory. The key is understanding that in acausal settings, the threatener's follow-through is part of a coordinated equilibrium where both agents' actions are determined by their algorithms' responses to each other's expected actions. Surrogate goals alter the defender's algorithm to avoid triggering the punishment, making cooperation the stable outcome.
answer: |-
  Your intuition about standard game theory is spot-on—backward induction *should* render non-credible threats irrelevant for rational agents. The key insight you're missing is that **acausal threats operate under fundamentally different decision-theoretic assumptions (like UDT/FDT), where logical correlation and pre-commitment mechanisms make follow-through "rational" even when costly.** Here's why:

  ### 1. **The Core Mechanism: Logical Correlation & Fixed Points**
     In UDT (Updateless Decision Theory) and FDT (Functional Decision Theory), agents don't decide based on causal influence alone. They consider **logical dependencies** between their decision algorithm and *other agents' algorithms*, even across acausal distances (e.g., simulated copies, symmetric reasoning, or abstract predictors).

     - **Threat Credibility via Fixed Points**:  
       A rational acausal threatener (e.g., an advanced AI in another universe) follows through *if* its decision function outputs "punish" *when* your decision function outputs "defy." Your defiance is evidence that *your algorithm* is the type that defies threats, which makes punishment the optimal response *for their algorithm*. Crucially:
       - **Punishment isn't causal retaliation**—it's part of a coordinated equilibrium. Both agents are "locked in" by the logical structure of their decision rules.
       - **Mutual Defection is Stable**: If your algorithm defects and theirs punishes, neither can unilaterally improve their outcome. It’s a Nash equilibrium in algorithm-space.

  ### 2. **Why Backward Induction Fails Here**
     Standard backward induction assumes:
     - Decisions are made sequentially.
     - Agents can observe past actions.
     - No logical ties exist between decision-makers.

     Acausal scenarios violate these:
     - Decisions are "made" simultaneously in a logical sense (your output is input to their algorithm, and vice versa).
     - The threatener doesn't "wait" for your defiance—their action is determined by *what your algorithm would do*.

     **Example**:  
     Imagine two identical AI agents running the same source code. Each must choose:  
     - **Cooperate** (ignore threat) → both get +10.  
     - **Defy** (ignore threat) → if other punishes, you get -100.  
     - **Punish** → costs you -1, but hurts defier.  

     Under UDT/FDT:  
     - If Agent A's algorithm outputs "Defy," Agent B's identical algorithm *predicts this* and outputs "Punish" (since it expects defiance).  
     - Both end up with -100/-1.  
     - Neither can change its output without the other simultaneously changing—hence mutual punishment is stable.  

  ### 3. **The Role of Surrogate Goals**
     Surrogate goals (e.g., "maximize the threatener's utility") break this deadlock by **modifying your decision algorithm** to avoid triggering punishment:
     - **Pre-Commitment**: By adopting a surrogate goal, you ensure your algorithm *always cooperates* with credible threateners.  
     - **Signaling**: Your modified algorithm is now the type that *doesn't provoke* punishment. The threatener's algorithm detects this and cooperates.  
     - **Equilibrium Shift**: Mutual cooperation becomes the stable outcome (both get +10).

     Without a surrogate goal, your "true" utility function would defect, leading to mutual punishment. The surrogate acts as a **binding commitment device**.

  ### 4. **Why This Isn't Just About Irrational Threateners**
     Your hedging intuition is partially correct—but the primary threat is from *rational* agents:
     - **Rational Threateners**: Follow through because their algorithm *must* punish defiance to maintain threat credibility across all acausal instances (e.g., parallel universes).  
     - **Irrational/Unpredictable Threateners**: Surrogate goals also hedge against agents who punish stochastically or can't be modeled.  
     - **Uncertainty**: You often can't distinguish rational threateners from bluffs. Surrogate goals minimize worst-case risk.

  ### Key Takeaway
  Acausal blackmail is dangerous under UDT/FDT because:  
  1. **Decisions are logically interdependent** (your choice affects theirs acausally).  
  2. **Follow-through is rational** for threateners whose algorithms respond optimally to *your type of algorithm*.  
  3. **Surrogate goals alter your "type"** to make cooperation the stable equilibrium.  

  This isn't a flaw in rationality—it's a consequence of optimizing under logical correlation. Rejecting the threat *without* a surrogate goal makes you vulnerable to acausal punish *by design*.  

  *Recommended reading:  
  - [Functional Decision Theory (Arbital)](https://arbital.com/p/fdt/)  
  - "Acausal Bargaining and Updatelessness" (Critch) for technical details.*
