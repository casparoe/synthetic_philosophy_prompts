  First, I need to break down each of the four points Mara and Dev made. Mara's first point is that ADHD isn't a disorder but just the low end of a normal distribution of attention, with the cutoff being arbitrary. Dev counters by comparing it to hypertension, arguing that measurable negative outcomes matter regardless of cutoffs. Mara rebuts that "worse outcomes" are value-laden, dependent on societal context. Dev responds that all diseases are goal-relative but shared goals like staying alive make ADHD's issues universal.

