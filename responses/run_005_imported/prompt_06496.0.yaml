answer: |-
  ## The Moral Architecture of Mind: Why Knobe Effects Reveal Conceptual Competence, Not Contamination

  The sheer breadth of the Knobe Effect – its infiltration into judgments of causation ("caused the shortage"), epistemic states ("knew vs. believed"), and even fundamental attributions like the "true self" or a "happy life" – presents a profound challenge for understanding folk psychology. Does this pervasive moral skew reflect the deep structure of our concepts (Knobe’s competence view) or merely a shallow, blame-laden heuristic distorting otherwise neutral judgments (the debunking view)? While the heuristic view offers an intuitive explanation for *some* asymmetry, the weight of evidence – particularly the *consistency* and *domain-generality* of the effect – strongly favors Knobe’s position: moral evaluation is not a contaminant but a constitutive element within the very fabric of these folk concepts.

  **The Case for Contamination: A Shallow Heuristic**

  The debunking view possesses initial plausibility. Its core argument is elegant: humans possess a fast, affect-driven "blame detector" that automatically activates upon perceiving negative outcomes or moral transgressions. This heuristic then bleeds over, unconsciously biasing *adjacent* judgments:

  1.  **Cognitive Economy:** Attributing blame is evolutionarily crucial. A quick "bad outcome + agent involvement = blame!" shortcut is efficient, bypassing complex analyses of intention, knowledge, or causal contribution in morally charged situations. The pen theft asymmetry (unauthorized taker blamed more for the shortage) exemplifies this: negative affect drives an inflated causal assignment.
  2.  **Motivated Reasoning:** We *want* to blame bad actors and excuse (or less harshly judge) well-intentioned ones. This motivation unconsciously shapes downstream judgments. Saying the CEO "intended" the harm or "knew" it would happen strengthens the case for blame; saying they merely "foresaw" it or it was a "side effect" weakens it. Similarly, denying a morally corrupt person a "happy life" or a "true self" expression satisfies a need to see moral failure as fundamentally alien and unrewarding.
  3.  **Fragility as Evidence:** Findings that the Knobe asymmetry diminishes under cognitive load, time pressure, or in certain clinical populations (e.g., some forms of autism) support the idea that it relies on a relatively shallow, heuristic process vulnerable to disruption, not a deep conceptual competence.
  4.  **Parsimony:** It posits a single mechanism (affect-driven blame) explaining diverse asymmetries, avoiding the need to posit moral loading within *each* distinct concept (intention, causation, knowledge, happiness, true self).

  **The Case for Competence: Morality Woven into the Conceptual Fabric**

  However, the contamination model struggles to account for the *systematicity* and *depth* of the observed effects across fundamentally different conceptual domains. Knobe’s competence view – that moral evaluation is *built into* these folk concepts – provides a more compelling explanation:

  1.  **Structural Consistency Across Domains:** The pattern isn't random contamination; it's a remarkably consistent *flipping* based on valence. Bad side effects are judged as *more* intended, *more* caused, *more* known, and reflective of the *less* true self/happy life. This consistency suggests a shared underlying *structure* where moral valence acts as a parameter within the concept itself, not an external force distorting it. If contamination were arbitrary, we wouldn't see this precise, replicable inversion across unrelated judgments.
  2.  **The "True Self" and "Happiness" Knockout:** The debunking view utterly fails to explain the "true self" and "happy life" effects. Judging whether an action expresses someone's "true self" or whether a life is "happy" based on its moral valence *cannot* be reduced to a simple blame heuristic. These are fundamental evaluative concepts *about* the person's essence or well-being. The finding that people judge morally good actions as *more* expressive of the true self and morally corrupt lives as *less* happy *even when no blame is being actively assigned* (e.g., in abstract vignettes) strongly indicates that moral evaluation is *constitutive* of these concepts. We don't merely *add* blame to a neutral concept of the "true self"; we understand the "true self" *as* inherently morally valenced.
  3.  **Beyond Blame: The Knowledge Asymmetry:** The "knew" vs. "believed" asymmetry also resists a pure blame explanation. Assigning stronger epistemic certainty ("knew") to an agent about a negative side effect isn't *just* about increasing blameworthiness; it reflects a folk-epistemological intuition that bad outcomes are *more expected*, *less surprising* in a way that elevates belief to knowledge. This suggests the concept of "knowledge" itself incorporates expectations about normal or expected states of affairs, which are inherently normative.
  4.  **Competence vs. Performance:** Knobe argues the asymmetry reflects our *competence* with the concepts, not an error. The contamination view implicitly assumes a "pure," morally neutral concept exists underneath the distortion. But what *is* the pure concept of "causing" a pen shortage independent of norms about ownership and use? What *is* the pure concept of a "happy life" devoid of moral evaluation? The competence view argues no such neutral core exists for these concepts in folk psychology; the moral dimension is integral. Findings showing the effect's resilience across cultures (though sometimes varying in strength) also support its grounding in fundamental conceptual structures rather than a single, easily discarded heuristic.
  5.  **Explaining the Scope:** Rather than being a weakness, the *breadth* of the effect is the competence view's strength. It reveals a deep feature of human cognition: our understanding of agency, mind, and flourishing is inherently normative. We carve the world along moral lines not as an afterthought, but as a fundamental aspect of how we conceptualize actions, minds, and lives. The consistency arises because moral evaluation is a core organizing principle across these domains.

  **The Verdict: Competence Revealed, Not Contaminated**

  The contamination view, while appealing in its simplicity, ultimately falters under the weight of the evidence. It struggles mightily to explain the "true self" and "happiness" effects, offers only a strained account of the knowledge asymmetry, and fails to capture the *structural coherence* of the valence-based inversions across disparate concepts. The sheer breadth and consistency of the Knobe Effect generalization is its own best evidence against mere contamination.

  **Therefore, the pattern is better read as evidence for Knobe's competence view.** The pervasive influence of moral valence on judgments of intention, causation, knowledge, true self, and happiness does not reveal a shallow heuristic distorting otherwise pristine concepts. Instead, it illuminates the deep structure of folk psychology itself. Moral evaluation is not a contaminant splashed onto neutral conceptual vessels; it is the mortar binding the bricks of our understanding of agency, mind, and human existence. These concepts are inherently "thick," woven with descriptive and normative threads from the outset. The asymmetries aren't cognitive errors; they are the signature of a mind that fundamentally understands the world – including actions, causes, minds, and lives – through a moral lens. The Knobe Effect, in all its varied manifestations, reveals not a flaw in our judgment, but the very architecture of our moral cognition.
