prompt: |-
  I've been reading LessWrong and the decision-theory corners of the rationalist blogosphere since roughly the Sequences era, and a couple of years ago that turned into a small interview podcast I co-host with a friend from my old grad-school reading group. The audience is small but demanding: people who already know what a Newcomb problem is and will notice immediately if a guest is allowed to coast on a stock answer.

  Next week's guest is a decision theorist who has spent most of her career defending updateless decision theory against just about every objection that's come out of the LessWrong and Alignment Forum literature on Wei Dai's original proposal. She has a habit, whenever someone raises the standard complaint about counterfactual mugging — that paying up in the branch where you get nothing back can't be rational — of saying some version of "that's just your updated self trying to renegotiate a deal it already struck" and moving on to the next question. I'd rather she not get to use that line again without being pushed on it.

  Could you draft eight to ten interview questions that don't let her simply restate the view? I want at least one question that presses directly on that stock reply rather than letting it stand as a settled answer, one on where the prior an updateless agent is supposed to be updateless "with respect to" is actually supposed to come from, given that no embedded agent ever occupies a genuine pre-evidential vantage point, one on whether treating one's own source code as subject to counterfactuals is coherent at all or just a useful fiction, and one on the so-called commitment-races worry — that agents who reason this way have an incentive to lock in policies before they know enough to choose them well. For each question, add a short follow-up keyed to the answer she's most likely to give, the way a good interviewer would have it prepared in advance rather than improvising on the spot.
reasoning: |-
  Okay, the user is a podcast host preparing for an interview with a decision theorist who defends updateless decision theory (UDT). They want questions that challenge the guest's standard responses, especially regarding counterfactual mugging. Let me break down their needs.

  First, the guest often dismisses the counterfactual mugging objection by saying the updated self is renegotiating a prior deal. The user wants to press on that point. I need a question that forces the guest to justify why the prior agreement should bind the updated self, especially when there's no benefit. The follow-up should challenge the rationality of honoring such a commitment without any gain.

  Next, the origin of the prior. UDT agents are supposed to be updateless, but no agent exists before evidence. So where does this prior come from? The follow-up needs to question whether this prior is arbitrary or if there's a non-circular way to define it.

  Third, treating source code as subject to counterfactuals. Is this coherent or just a useful fiction? The follow-up should push on the ontological status of the source code. If it's a useful fiction, does that undermine UDT's foundations?

  Lastly, commitment races. Agents might lock in policies too early. The follow-up should ask how UDT avoids this without ad-hoc solutions. 

  The user also mentioned wanting eight to ten questions total. I need to ensure all specified areas are covered and add more that probe other weaknesses. Possible angles: logical counterfactuals vs. causal reality, precommitments in multi-agent scenarios, evolutionary stability, and whether UDT reduces to something else.

  For each question, anticipating the guest's likely responses is key. For example, on counterfactual mugging, she might say the prior self made a binding commitment. The follow-up should ask why that commitment is rational to uphold when it's net harmful. 

  I should also consider the audience: knowledgeable in decision theory, familiar with Newcomb problems. The questions need to be precise and avoid stock answers. Need to push beyond surface-level defenses.

  Another point: the user wants the guest to explain the normative force of the prior agreement. The follow-up could challenge if this is any different from sunk cost fallacy. 

  On the prior's origin, if the guest says it's defined by the problem, follow up on how real agents can have such priors without a specified problem framework.

  For source code counterfactuals, if she calls it a useful fiction, ask if that means UDT isn't describing true agency but a heuristic.

  Commitment races: if she says the policy is chosen with all logical information, ask how that's possible without knowing future computations.

  Need to ensure each question has a pointed follow-up. Avoid letting the guest retreat to rehearsed answers. The goal is to elicit new insights or expose unresolved issues in UDT.
answer: |-
  Here are 10 targeted interview questions with anticipated responses and sharp follow-ups, designed to challenge standard UDT defenses and force novel engagement:

  1.  **Core Challenge to the "Renegotiation" Reply:**
      *   **Question:** When you say the updated self in Counterfactual Mugging is "renegotiating a deal it already struck," you imply the prior commitment has normative force. But why *should* the impoverished, post-coin-flip self rationally feel bound by a "deal" made by a causally disconnected prior self, especially when honoring it provides *zero* benefit to *any* temporal stage of the agent? Isn't upholding this commitment purely an act of sunk-cost fallacy on a cosmic scale?
      *   *Likely Answer:* "Because the *overall* policy maximizes expected utility across all possible branches. Failing to pay violates the globally optimal strategy chosen when all possibilities were open."
      *   **Follow-Up:** But doesn't "overall" utility dissolve upon branch actualization? The *actualized* agent in the losing branch faces a *real* utility loss with *no* compensatory gain in *their* branch. Isn't demanding they pay solely to satisfy a counterfactual abstraction akin to demanding sacrifice to a non-existent god? Where is the *agent-relative* rationality *for that branch*?

  2.  **The Elusive Origin of the "Prior" Perspective:**
      *   **Question:** UDT requires reasoning from a hypothetical "updateless" prior perspective before any evidence is received. But no embedded agent *ever* occupies this state. Where does this crucial prior perspective *actually come from* in practice? Is it defined solely by the problem statement, conjured by the agent's current knowledge of its source code, or is it a metaphysical abstraction?
      *   *Likely Answer:* "It's defined by the agent's source code and the logical structure of the problem it faces *before* any specific observations. The 'prior perspective' is the viewpoint that considers all logically possible worlds consistent with the agent's existence and the problem setup."
      *   **Follow-Up:** Doesn't this create a vicious circularity? The "prior perspective" is defined *using* the agent's source code *and* its knowledge of the problem structure – which is precisely the information an *actual* agent *always already has* as part of its "evidence." How is this distinct from a convoluted form of *updated* reasoning masquerading as updatelessness? Isn't the "prior" just a thought experiment built *from* the updated state?

  3.  **Source Code Counterfactuals: Coherent or Convenient Fiction?**
      *   **Question:** UDT relies heavily on counterfactuals about what *would* happen *if* the agent's source code output a different action. But in a deterministic universe, the source code outputs what it outputs. Is reasoning about counterfactual variations of one's own immutable source code a coherent metaphysical possibility, or merely a pragmatically useful fiction for achieving desirable outcomes in specific problem classes?
      *   *Likely Answer:* "It's a logical necessity for reasoning about optimal behavior under uncertainty. We *must* consider what different algorithms would do to evaluate which algorithm we *are* should choose. It's a standard tool in computer science and game theory."
      *   **Follow-Up:** But isn't there a crucial difference? In standard game theory, we counterfactually consider *other players'* strategies – entities logically distinct from ourselves. When UDT applies counterfactuals to *its own fixed source code*, isn't it treating its own identity as a variable? Doesn't this fundamentally confuse the map (the algorithm *describing* the agent) with the territory (the agent *itself* executing deterministically)? Can a rock coherently ask "What if I were scissors?"

  4.  **Commitment Races & Locking-In Policies Prematurely:**
      *   **Question:** UDT agents choose policies *before* encountering specific evidence. Doesn't this create a dangerous incentive for "commitment races" – where agents are pressured to lock in a UDT policy *as early as possible* (e.g., during programming/self-modification) to bind their future, better-informed selves, even if waiting would allow a *better* policy choice with more information?
      *   *Likely Answer:* "The UDT policy is chosen *considering* all the logical information available, including the structure of future decisions. Waiting doesn't provide new *logical* information relevant to the global optimum; it just provides an indexical update about which branch you're in, which UDT correctly ignores."
      *   **Follow-Up:** But what about *empirical* information discovered *after* the initial policy commitment, relevant to the *consequences* of actions in unforeseen states? If an agent learns new physics or discovers a novel trap after committing, UDT seems to forbid adapting its *core decision rule*, forcing it to follow a policy chosen with strictly less knowledge. Isn't this a recipe for catastrophic inflexibility in complex, evolving environments?

  5.  **Normative Force vs. Causal Power:**
      *   **Question:** UDT often justifies actions (like paying in Counterfactual Mugging) based on the *normative* force of the pre-commitment to the globally optimal policy. However, in the actual branch where the agent pays, there's *no causal mechanism* by which this payment benefits any version of the agent. How do you reconcile the *normative* argument for paying with the apparent *causal futility* of the action from the perspective of the acting agent?
      *   *Likely Answer:* "Rationality isn't defined solely by causal efficacy in the current branch. It's defined by adherence to the best possible *strategy* across the multiverse of possibilities. The causal futility *in this branch* is irrelevant; what matters is that *this action* is part of the globally optimal plan."
      *   **Follow-Up:** Doesn't this radically divorce rationality from the actual welfare of the agent *as it exists*? If an action demonstrably harms the agent in its actual situation and helps nothing else real, isn't calling it "rational" purely a semantic choice that abandons the core intuition linking rationality to the agent's interests?

  6.  **Logical vs. Subjective Uncertainty in the Prior:**
      *   **Question:** When formulating the updateless prior, how does UDT handle uncertainty *about its own source code* or *about the true nature of the logical universe*? Is this uncertainty even representable within the "updateless" view, or does it collapse back into a form of subjective Bayesian updating hidden within the prior specification?
      *   *Likely Answer:* "The source code is known. Uncertainty about the logical universe (e.g., mathematical facts) is handled by logical uncertainty, which can be incorporated into the prior. The updateless agent chooses a policy maximizing expected utility over logical possibilities weighted by its logical uncertainty."
      *   **Follow-Up:** But doesn't the *specification* of the logical uncertainty prior *itself* require assumptions equivalent to updated knowledge? If I'm uncertain whether P=NP, doesn't forming a prior over that *logical* fact depend on my current understanding of complexity theory? How is this prior fundamentally different from a Bayesian prior updated by my mathematical education?

  7.  **UDT and Anthropic Reasoning / Self-Location:**
      *   **Question:** How cleanly does UDT resolve problems involving self-locating uncertainty or anthropic reasoning (e.g., Sleeping Beauty, Doomsday Argument)? Does the "updateless prior" naturally incorporate indexical information, or does it require special handling that might undermine its claim to being truly "updateless"?
      *   *Likely Answer:* "UDT can handle these by including indexical information (like 'which copy am I?') as part of the 'state of the world' evaluated in the prior. The policy chooses actions based on the full logical state, including location."
      *   **Follow-Up:** But doesn't *knowing* you are in a specific branch *constitute* the indexical update? How does specifying indexical possibilities *in the prior* differ from *updating* on the information "I am now in branch X"? Isn't UDT essentially smuggling the update into the definition of the state space?

  8.  **Evolutionary/Adaptive Stability of UDT Agents:**
      *   **Question:** If UDT agents consistently pay in Counterfactual Mugging and similar dilemmas where resources are sacrificed without return in their branch, wouldn't they be outcompeted by more "selfish" agents (e.g., CDT agents or simple defectors) who keep their resources in the actualized branch? Doesn't this cast doubt on UDT as a *stable* or *evolvable* model of rational agency?
      *   *Likely Answer:* "In many multi-agent interactions, UDT policies like pre-commitment to cooperation *do* lead to better outcomes and can be evolutionarily stable. In pure decision problems against nature, the 'competition' argument doesn't apply in the same way."
      *   **Follow-Up:** But in the *specific* Counterfactual Mugging scenario against Omega (a perfect predictor), the UDT agent *loses* resources compared to a defecting agent *in the branch that actually occurs*, with no countervailing benefit elsewhere (since Omega's prediction is fixed). In a population where such muggings occur, wouldn't UDT agents bleed resources while defectors thrive? How is this sustainable?

  9.  **The Regress of Self-Reference:**
      *   **Question:** UDT requires the agent to simulate the outputs of its own source code (or variations thereof) within its decision process. Doesn't this introduce a dangerous regress? How does the agent avoid infinite loops or undecidability when its decision procedure must contemplate what its decision procedure would decide?
      *   *Likely Answer:* "This is handled through quining or diagonalization techniques. The agent doesn't need to fully simulate itself 'from the inside'; it reasons abstractly about the mathematical function its code implements."
      *   **Follow-Up:** But doesn't this abstract reasoning *still* require the agent to have a fixed point – to assume it *has* a definite output while simultaneously trying to determine it? Isn't this fundamentally similar to the challenges of self-referential paradoxes? Can UDT be formally specified without encountering uncomputability or undefinability issues in non-trivial cases?

  10. **Is UDT Just CDT in Disguise?**
      *   **Question:** Some critics argue UDT, by relying on counterfactuals about source code outputs, is ultimately performing a sophisticated form of causal modeling where the "cause" is the abstract algorithm rather than the physical action. If we interpret the algorithm's choice as the causal lever, does UDT effectively collapse back into Causal Decision Theory (CDT) operating at a higher level of abstraction?
      *   *Likely Answer:* "No, the key difference is that UDT considers *logical* counterfactuals and correlations, not just physical causation. CDT fails in Newcomb-like problems precisely because it ignores the logical dependence between its decision and the predictor's action, which UDT captures."
      *   **Follow-Up:** But isn't UDT's "logical counterfactual" just a way of *modeling* a causal dependency that exists *by construction* in the problem (i.e., Omega predicts perfectly)? If we view Omega's prediction mechanism as part of the causal structure, isn't UDT simply CDT correctly modeling a complex causal graph, rather than introducing a fundamentally new decision principle?

  **Key Interview Strategy:**

  *   **Listen Closely:** Her first answer will likely contain keywords/phrases signaling her well-rehearsed position. Use your follow-up to *immediately* challenge the core assumption or implication of that phrase, not just the surface statement.
  *   **Control the Frame:** Don't let her dismiss objections as mere "confusion." Insist on answers addressing the *specific* normative, metaphysical, or practical challenge posed. Use phrases like "But that doesn't address the point about..." or "Let me rephrase the core tension..."
  *   **Demand Specificity:** When she uses terms like "overall," "global optimum," or "logical perspective," ask her to define exactly *for whom* or *from where* this perspective exists and acquires its normative force.
  *   **Connect to Reality:** Ground abstract arguments in concrete consequences: "So, in this actual branch, the agent pays $1000 and receives absolutely nothing tangible or intangible in return, and you contend this is the *most rational* action? Explain why to the agent holding the empty wallet."

  These questions target the philosophical foundations, practical coherence, and potential vulnerabilities of UDT, moving far beyond restating its solutions to standard problems. Good luck with the interview!
