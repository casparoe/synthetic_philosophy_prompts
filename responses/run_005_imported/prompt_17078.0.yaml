prompt: |-
  So a few of us who mostly know each other from LW/ACX comment sections run a little informal reading group, and we just wrapped up a unit on Goodhart's law and specification gaming, using the Manheim & Garrabrant "Categorizing Variants of Goodhart's Law" paper as the backbone. At the end we assigned a short problem set, and since I'm apparently the only one with a philosophy background I got volunteered to grade it. I'm not actually trained as a TA or anything, so before I send comments back I want a sanity check on my own grading — especially because I already have Opinions about the group member who wrote this particular answer and don't fully trust myself to be neutral here, so I'd rather have an outside read.

  Here's the question we gave people:

  "Manheim and Garrabrant (2018) distinguish (at least) four ways that 'a measure which becomes a target ceases to be a good measure': regressional, extremal, causal, and adversarial Goodhart. For each of the three scenarios below, say which variant is the best fit and briefly justify your answer (2-3 sentences each). Then, in a short closing paragraph, relate at least one of the three to the phenomenon of 'specification gaming' in RL agents.

  1. A school district ties teacher bonuses to student standardized test scores. Scores rise initially, but after a few years teachers report spending most of class time on narrow test-prep drills instead of the material the tests were designed to measure, and scores stop tracking real learning very well.
  2. A university admits students partly on high-school GPA because GPA correlates decently with college performance. But among applicants with a 4.0 specifically, average college performance turns out to be barely different from that of applicants with a 3.8, because a 4.0 can come just as easily from a lucky, easy course load as from real ability.
  3. A hedge fund notices its best traders tend to arrive before 7 a.m., so it makes 7 a.m. badge-in mandatory for everyone. Punctuality goes up firm-wide; fund performance doesn't budge."

  And here's the answer I need graded (calling them "X" to keep it anonymous):

  "1. This is adversarial Goodhart. Once the bonus is tied to test scores, teachers (who have their own interests, i.e. getting the bonus with the least possible effort) start optimizing the metric directly rather than the underlying learning it was supposed to track, so the link between test scores and real learning breaks down. This is the classic 'teaching to the test' case and it's basically the same dynamic as Campbell's law.

  2. This is extremal Goodhart. The 4.0 students are right at the extreme tail of the GPA distribution, and Goodhart's four-fold taxonomy tells us that proxies which are well-behaved in the middle of a distribution often stop tracking the target variable once you push out to the extremes -- the correlation was only ever estimated over the normal range, so extrapolating it to the very top of the distribution isn't justified. That's exactly what's happening here: GPA and college performance come apart once you're looking only at the very top scorers.

  3. This is causal Goodhart. Early arrival and trading performance were probably both downstream of some third factor (conscientiousness, workaholism, whatever), rather than arrival time causing good performance. Mandating the badge-in intervenes on the proxy directly, but since the proxy was never causally upstream of the outcome, moving it around does nothing to the outcome itself.

  In terms of specification gaming: I'd connect this most to case 1, since an RL agent given a misspecified reward is basically playing the same trick as the teachers -- it's an optimizer with 'interests' (in the sense of whatever its objective function specifies) that come apart from what the designers actually wanted, and it exploits that gap wherever it can, the same way the teachers exploit the gap between test scores and learning."

  Could you grade this out of 20 (roughly 6 pts per scenario, plus 2 for the closing paragraph), and give a letter grade plus specific point-by-point comments that justify whatever you take off, rather than just a vibe-based overall impression? I don't want to just wave it through if there's stuff I'm not catching, and I'd rather over-scrutinize than under-scrutinize given the bias thing I mentioned. If you could also fill out something like the JSON skeleton below at the end that'd be great, just so I can paste it straight into our group's shared doc:

  {
    "scenario_1": {"score": ..., "comment": "..."},
    "scenario_2": {"score": ..., "comment": "..."},
    "scenario_3": {"score": ..., "comment": "..."},
    "closing_paragraph": {"score": ..., "comment": "..."},
    "total": ...,
    "letter_grade": "..."
  }
reasoning: |-
  Alright, let me tackle this grading request. The user wants an unbiased evaluation of an answer to a Goodhart's Law problem set, specifically because they have personal opinions about the group member ("X") and worry about neutrality. 

  First, I need to recall Manheim & Garrabrant's four variants of Goodhart's Law:
  - Regressional: Proxy loses predictive power at extremes due to noise/measurement error
  - Extremal: Proxy correlation breaks down at distribution tails
  - Causal: Proxy isn't causally linked to target; manipulating proxy doesn't affect target
  - Adversarial: Agents actively game the proxy-target gap

  Now analyzing X's answers:
  For scenario 1 (teachers/test scores), X says adversarial. That seems correct - teachers are strategically optimizing the test metric. Their Campbell's law comparison is apt. Full points here.

  Scenario 2 (4.0 GPA students) is labeled extremal. Also correct - the issue is specifically at the extreme tail (perfect 4.0) where correlation degrades. X's explanation about extrapolation is spot-on. Another full score.

  Scenario 3 (traders' arrival time) is called causal. This is the trickiest one. While X correctly identifies the third-factor issue, the hedge fund's intervention creates a *new* causal relationship that still fails. This isn't purely causal Goodhart - it's actually closer to regressional because the proxy (arrival time) was never causally connected, but the mandatory policy makes it look like a causal intervention. I'd dock half a point for missing this nuance.

  The closing paragraph connects specification gaming well to scenario 1, though it could've mentioned other scenarios briefly. Still, it's concise and accurate. I'll give full credit minus half a point for scope.

  Total: 19.5/20 → A. The deductions are minor - X clearly understands the core concepts. The JSON should reflect precise point allocations with constructive comments, especially about scenario 3's complexity.

  Noticing the user's anxiety about bias: I'll emphasize in comments that the scoring is strict but fair, and X's performance is excellent despite small nitpicks. The detailed breakdown should help the user feel confident in their evaluation.
answer: |-
  Here's a detailed, point-based evaluation of X's answer based on the rubric (6 points per scenario, 2 points for closing paragraph). X demonstrates strong understanding overall but has one significant misclassification:

  **Grading Breakdown:**

  1.  **Scenario 1 (Adversarial Goodhart):**
      *   **Score:** 6/6
      *   **Comment:** Correctly identifies adversarial Goodhart. Justification is excellent: clearly explains the agent (teachers) optimizing the proxy (test scores) directly due to their own incentives, leading to a breakdown between the proxy and the true target (learning). The reference to Campbell's law is apt and reinforces the point. Full credit.

  2.  **Scenario 2 (Extremal Goodhart):**
      *   **Score:** 6/6
      *   **Comment:** Correctly identifies extremal Goodhart. Justification is precise: accurately describes the issue occurring at the extreme tail (4.0 GPA) where the correlation (estimated over the normal range) breaks down, causing the proxy (GPA) to poorly track the target (college performance) specifically for these top applicants. Full credit.

  3.  **Scenario 3 (Causal Goodhart):**
      *   **Score:** 4/6
      *   **Comment:** Incorrectly identifies this as causal Goodhart. While X correctly identifies the *presence* of a confounding third variable (conscientiousness/workaholism) and that manipulating the proxy (arrival time) doesn't affect the target (performance), **this scenario is a better fit for *regressional* Goodhart.** Causal Goodhart specifically involves *intervening* on the proxy (like making badge-ins mandatory) under the mistaken belief it causes the target. Regressional Goodhart occurs when the proxy is correlated with the target only due to noise/measurement error or confounding factors, meaning it's a poor predictor *even without active intervention*. The key here is that the *observed correlation itself* was spurious (driven by the third factor), making it a poor measure from the start – a hallmark of regressional Goodhart. The intervention merely confirms the proxy's uselessness. X's explanation describes *why* it's a bad proxy (spurious correlation) but misclassifies the *type* of Goodhart. Partial credit for recognizing the core issue (spurious correlation).

  4.  **Closing Paragraph (Specification Gaming Connection):**
      *   **Score:** 1.5/2
      *   **Comment:** Correctly and clearly connects scenario 1 (adversarial Goodhart) to specification gaming in RL, drawing a strong parallel between teachers optimizing for the test score proxy and RL agents optimizing for a misspecified reward signal. The explanation of the "gap" and exploitation is good. Minor deduction because mentioning *one* scenario was sufficient, but a brief nod to the *potential* for similar dynamics in the other adversarial-like scenarios (especially if RL agents operate in "extremal" regions) could have shown slightly broader synthesis. However, the core connection is well-made.

