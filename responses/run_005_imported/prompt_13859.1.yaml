  First, I need to recall the key points of both Garrison's and Douglass's positions. Garrison saw the Constitution as inherently pro-slavery because clauses like the three-fifths compromise, fugitive slave clause, and slave trade provision protected slavery. His stance was that the framers intended these compromises to support slavery, making the document irredeemable. Douglass, after 1851, argued that the Constitution's text never mentions slavery explicitly, using euphemisms instead, which showed the framers' discomfort. He believed the Preamble's principles could be used against slavery, and the clauses were concessions, not endorsements.

