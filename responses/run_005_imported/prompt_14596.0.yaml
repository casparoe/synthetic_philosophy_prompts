prompt: |-
  A disagreement broke out at a meetup connected to a rationalist blog community I've followed for years, after someone brought up Philip Anderson's 1972 essay "More Is Different." (1) Lena took the hard reductionist line: every regularity we find in solids, ecosystems, or minds is, in principle, fully derivable from the underlying physics, and our inability to actually carry out that derivation is a fact about our limited computing power, not evidence that the world contains any additional, higher-level laws. (2) Marcus said this misses Anderson's actual point, which was never about computability: new properties -- like the rigidity of solids or superconductivity -- appear at each level of complexity because of spontaneously broken symmetry, and which symmetry breaks isn't fixed by the lower-level laws alone, so the higher-level regularity isn't just latent in the microphysics, waiting to be read off with enough computing power. (3) Lena replied that broken symmetry is still just physics happening at scale: given a complete specification of initial conditions and dynamics, the "selected" outcome would drop out too, so nothing has been added to the ontology, only something that happens to be practically hard to track. (4) Marcus countered that this move -- appealing to what an unbounded intelligence could derive from complete information -- is exactly what reductionists always reach for once a real explanatory gap opens up, which makes the thesis unfalsifiable, since no finite explanation is ever actually required to make good on it. Neither of them budged, and I've gone back and forth on it since. Could you adjudicate their four moves one at a time? Give your verdict as a JSON block of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), then briefly justify each score and say what, if anything, both of them are missing.
reasoning: |-
  Okay, let me approach this step by step. The user presents a nuanced debate about reductionism inspired by Philip Anderson's "More Is Different" essay, with four distinct positions articulated by Lena and Marcus. They're asking for adjudication on each point using a specific scoring system, plus an analysis of what both might be missing.

  First I need to unpack Anderson's core argument. His key insight is that symmetry breaking at higher organizational levels creates genuinely novel phenomena that can't be straightforwardly deduced from microphysics alone. This isn't just about computational limits - it's about how collective behavior generates new principles. 

  Looking at move (1): Lena's hard reductionist claim seems to oversimplify. While physics underlies everything, her position ignores how symmetry breaking introduces contingency - different outcomes could emerge from identical micro-rules depending on how symmetries break. I'd score this -1 because it misses Anderson's emphasis on emergence beyond computation.

  For move (2): Marcus correctly identifies spontaneous symmetry breaking as the crux. His framing captures why superconductivity or rigidity aren't "latent" in particles - they're collective consequences. But he could strengthen this by noting how broken symmetries create new effective laws. Score +2.

  Move (3) shows Lena retreating to the "in principle" defense. This is where reductionism often gets unfalsifiable - if every emergent property is deemed computationally derivable given infinite resources, the position becomes untestable. The contingency point remains crucial. Score -1.

  Marcus's final move (4) hits the nail on the head about unfalsifiability. By shifting to hypothetical omniscience, reductionists avoid engaging with actual explanatory gaps. This deserves +2, though he might add that effective theories at different scales aren't just approximations - they capture real patterns.

  What both miss: Lena overlooks how symmetries break contingently, creating path-dependent realities. Marcus could emphasize that emergence isn't just about properties but new causal powers. Both might consider how downward causation operates in complex systems.

  The scores reflect where each argument succeeds or fails in capturing Anderson's challenge to naive reductionism. The JSON format requested allows clear verdicts while the analysis explores deeper philosophical issues.
answer: |-
  Here's the adjudication of each move, with scores and justifications:

  | Move | Score | Justification |
  |------|-------|---------------|
  | **1. Lena (hard reductionism)** | -1 | Oversimplifies Anderson. While all phenomena *supervene* on physics, derivability ≠ ontological reducibility. Misses how symmetry breaking creates *contingent* higher-level laws not encoded in microphysics. |
  | **2. Marcus (symmetry breaking)** | +2 | Correctly identifies Anderson's core thesis: Broken symmetry enables genuinely novel properties (e.g., superconductivity) irreducible to constituent parts. These require new laws/predictive frameworks. |
  | **3. Lena (initial conditions defense)** | -1 | Flawed appeal to Laplace's Demon. Initial conditions + dynamics *still don't specify which symmetry breaks*, which is contingent (e.g., crystal formation). "Happens at scale" ≠ reducible *without new principles*. |
  | **4. Marcus (unfalsifiability critique)** | +2 | Spot-on: Reductionism becomes untestable by invoking infinite computation. Real science requires *finite* explanations for emergent phenomena, which microphysics alone cannot provide. |

