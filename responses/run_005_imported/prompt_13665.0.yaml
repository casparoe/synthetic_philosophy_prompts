  Bernoulli might argue that any measurable welfare—individual or collective—must have diminishing marginal returns. If global welfare is aggregated from individuals, each experiencing diminishing utility, then the aggregate should too. So, even for a global planner, the utility of doubling welfare isn't linear. A logarithmic utility function applied to total welfare would make repeated gambles have finite expected utility, avoiding SBF's infinite bet acceptance.

  But if welfare is seen as linear (like total resources), Bernoulli's framework doesn't directly address it. He might still insist that practical constraints (like risk of ruin) make infinite gambles untenable, but his core argument relies on diminishing utility. Without that, he'd need a different rationale, which he didn't provide.

