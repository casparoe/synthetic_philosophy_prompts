  Okay, the user needs a wedding toast that perfectly balances inside jokes about probability philosophy with universal warmth. Let me unpack this.

  First, the core challenge: the toast must satisfy two very different audiences. On one hand, the groom's academic colleagues who specialize in David Lewis' Principal Principle - they'll catch any philosophical inaccuracies. On the other, regular wedding guests who just want emotional moments. The key is weaving precise probability concepts into relatable metaphors.

  Hmm... the meet-cute story is golden - they literally fell in love debating whether "70% chance of rain" represents objective reality or subjective uncertainty. That's the perfect hook. The groom built his career defending Lewis' idea that objective chances demand rational deference (Principal Principle), while the bride literally produces those chance numbers professionally. Their love story is a living embodiment of the philosophy.

  Important technical nuances to honor:
  - Must avoid implying chances are "hidden facts" - Lewis/Humean view sees them as emergent patterns
  - Can't claim "100% chance" for future contingencies (that made his friend wince)
  - Should acknowledge Lewis' "undermining" wrinkle where future events retroactively affect present chances

  The emotional throughline should be: their relationship demonstrates how to balance certainty with openness. The meteorologist provides objective forecasts (chances), the philosopher shows how to live by them (deference) - together they create a stable but adaptable union.

  For structure: open with their debate story, explain the philosophy through their eyes (simple metaphors needed!), then reveal how their love resolves the philosophical tension. The "principal principle" becomes "principal partnership" - that pivot could work beautifully.

  Biggest risk is getting too technical. Need to simplify concepts like "admissible evidence" into relationship terms ("inside information" they share). The undermining problem can become poetic - how their future choices will redefine their present bond.

  Ending should tie back to weather metaphors - something like "may your forecasts be clear and your uncertainties joyful." Keeps it light while nodding to their professions.

  Most importantly: every philosophical point must serve the love story. The precision isn't for show - it's proof we truly see them. His colleagues will appreciate the care, others will feel the sincerity beneath the jargon.
answer: |-
  Here’s a toast that threads the needle—philosophically precise for the cohort, emotionally resonant for the room, and built entirely around their unique love story. Timing: ~5 mins.  

  **(Clink glass gently. Warm, conversational tone.)**  

  "Friends, family, philosophers, meteorologists... and those wisely keeping score at both ends of the table—thank you for being here. Now, as best man, I’ve been instructed: *no sloppy probability talk*. (Pause for laugh) Seriously. [Groom]’s exact words were, 'If you say *100% chance they’ll make it*, I will physically cringe. Future events are contingent. Don’t do it.' So… challenge accepted.  

  You all know how these two met. At a party, arguing about a forecast. '70% chance of rain tomorrow.' Was that a fact about the world? Or just the forecaster’s uncertainty? (Smile at Bride) She saw a precise pattern emerging from the chaos of the atmosphere. (Nod at Groom) He saw a rational constraint on belief—a number demanding deference.  

  For those not steeped in 1980s philosophy journals… (lean in conspiratorially) [Groom]’s academic life’s work defends David Lewis’s *Principal Principle*. Roughly: **If you know the objective chance of something, and you don’t have some secret, inadmissible evidence tucked away… your own belief must align with that chance.** You defer to it. You trust it. Even if it’s not 100%. Even if the future could, in some wild way, undermine what that chance *meant* in the present. (Brief eye contact with philosophy cohort—they’ll catch the "undermining" nod.)  

  **Turns out, that’s also how you build a life with a meteorologist.**  

  (Bride) spends her days *producing* those objective chances. Maps of likelihood. The atmosphere’s best offer. (Groom) spent his career insisting: **When you get a number like that—you don’t fight it. You build your expectations around it.** You let it guide you.  

  (Pivot to heartfelt)  
  That’s what I’ve watched them do. Not with rain forecasts… but with each other.  

  When [Groom] met [Bride], he didn’t have *inadmissible evidence* about their future. No hidden cheat sheet. (Smile) Just the observable pattern: her brilliance, her kindness, the way she argued with him about probability without throwing a wine glass. (Pause for laugh) And [Bride]? She saw *his* pattern: relentless integrity, that rare willingness to change his mind when the evidence shifted… and how weirdly hot he looked whiteboarding Humean metaphysics.  

  (Slow down, emotional shift)  
  **The Principal Principle isn’t about certainty. It’s about trust in the best signal you have.**  
  Today, their best signal isn’t a percentage. It’s the years of choices that brought them here:  
  - The shared laughter in grad-school kitchens at 2 AM,  
  - The way they weather professional storms,  
  - The profound respect for each other’s craft—even when one’s craft involves debating whether *chance* is a real thing or just a ‘summary of history’s mosaic’. (Philosophy friends grin; others get the gist.)  

  So—no, I won’t say there’s a *100% chance* they’ll make it. (Groom smirks approvingly)  
  But I will say this: **If the Principal Principle holds… if rational belief *should* defer to the best available chance…**  
  ...then every single one of us here is rationally required to believe *very, very strongly* in these two.  

  (Clink glass again. Raise it high.)  
  To [Bride] and [Groom]:  
  **May your forecasts be clear, your uncertainties joyful, and your shared history—the great mosaic you’re building—always give the best possible odds.** Cheers!"  

  ---

  **Why This Works:**  
  1. **Precision Nods:**  
     - "Inadmissible evidence," "Humean mosaic," "undermining" are flagged correctly but conversationally.  
     - The "100% chance" gag addresses the contingency taboo upfront.  
     - Lewis’s core idea (deference to chance = rational) is the toast’s engine.  

  2. **Universal Beats:**  
     - Meet-cute story (funny), professions (respectful), shared traits (emotional).  
     - "Secret cheat sheet," "2 AM kitchens," "weirdly hot" = relatable laughs.  
     - "Weather professional storms" ties metaphor to sentiment.  

  3. **The Pivot:**  
     The Principal Principle becomes a metaphor for *how they love*: trusting the observable pattern, adjusting to evidence, building on the best signal they have.  

  4. **The Close:**  
     "Rationally required to believe very, very strongly" satisfies both crowds: logicians hear a justified credence; Grandma hears "they’re meant to be."  

  **Delivery Tip:** Pause after jargon-heavy lines to let the room breathe. Your tone tells them when it’s a philosophy joke (wry smile) vs. heartfelt (softer, eye contact).  

  They’ll feel seen. His cohort won’t grimace. And you? You just threaded a needle David Lewis himself would respect. Break a leg!
