answer: |-
  Here’s a rigorously constructed argument against Nozick’s hybrid view ("utilitarianism for animals, Kantianism for persons"), addressing the marginal cases challenge while engaging with the strongest possible defenses of his position. The argument avoids begging the question by granting Nozick’s core premises initially and then exposing their internal tensions.

  ---

  ### **The Argument: The Dilemma of Grounding Personhood**

  **Step 1: Reconstructing Nozick’s Hybrid View**  
  Nozick grounds inviolability (Kantian side-constraints) in properties like *rational agency*, *autonomy*, or the capacity to "conceive of and steer one’s life as a whole." Animals lack these properties, so their interests are subject to utilitarian trade-offs. Persons possess them and are thus morally inviolable. This hybrid view promises:  
  - **Protection for all humans** (assuming they possess the relevant properties).  
  - **No speciesism** (the line is drawn by intrinsic capacities, not species membership).  

  **Step 2: The Marginal Cases Challenge as a Dilemma**  
  Let **P** = the property (or set of properties) justifying inviolability (e.g., rational agency, autonomy, future-directed self-narrative capacity).  
  - **Horn (A): Strict Capacity Criterion**  
    If **P** is necessary and sufficient for inviolability, then:  
    - Humans who permanently lack **P** (e.g., late-stage dementia patients, anencephalic infants, profoundly intellectually disabled individuals) are not "persons" in the morally relevant sense.  
    - Many animals (e.g., chimpanzees, elephants, crows) exhibit **P**-like capacities (e.g., autonomy, future planning, self-awareness) *at least as much* as these humans.  
    *→ Consequence*: The hybrid view permits sacrificing these humans for the greater good (e.g., medical testing), just like animals. This violates the core intuition that *all* humans are inviolable.  

  - **Horn (B): Weakened Criterion**  
    To avoid Horn (A), Nozick might weaken **P** by appealing to:  
    - **Species-typical potential**: Humans are inviolable because they *typically* develop **P**, or belong to a kind *defined* by **P**.  
    - **Relational properties**: Humans are inviolable due to social ties (e.g., being part of a "human community").  
    - **"Kantian Will" as essential**: Humans possess an a priori moral status irrespective of empirical capacities.  
    *→ Consequence*: **P** is no longer doing the justificatory work. Inviolability is now grounded in species membership (directly or indirectly), which is arbitrary and speciesist.  

  **Step 3: Engaging Nozick’s Strongest Replies**  

  1. **Reply: Species-Typical Potential**  
     *Defense*: Humans with impairments are inviolable because they are members of a species whose *typical* members possess **P**, or because they have the *potential* for **P** (e.g., infants).  
     *Counter*:  
     - **Potential ≠ Actual Status**: Potential does not confer *current* inviolability. A fetus has the potential for **P**, but Nozick (a libertarian) likely denies it full personhood. Conversely, a pig has the potential for complex cognition but is denied inviolability.  
     - **Typicality is Irrelevant**: Why should *typical* capacities of a group grant inviolability to *atypical* members who lack those capacities? This reduces to species membership.  
     - **Problem of Permanence**: A permanently non-**P** human (e.g., severe genetic disorder) has no relevant potential. If they are still inviolable, **P** is irrelevant.  

  2. **Reply: "Kantian Will" as Essential Human Nature**  
     *Defense*: All humans possess a "Kantian will" (noumenal self) irrespective of empirical capacities. This grounds inviolability.  
     *Counter*:  
     - **Empirical Grounding Failure**: Nozick grounds ethics in *value-creating beings*. If a human entirely lacks rational will (e.g., irreversible coma), there is no empirical basis to attribute a "noumenal self."  
     - **Begging the Question**: Asserting all humans have a Kantian will *because they are human* assumes the conclusion.  
     - **Practical Irrelevance**: If the Kantian will is undetectable, it cannot guide real-world decisions (e.g., medical triage).  

  3. **Reply: Relational or Social Properties**  
     *Defense*: Humans are inviolable due to social relations (e.g., being loved, human solidarity).  
     *Counter*:  
     - **Arbitrary Exclusion**: Some humans (e.g., isolated orphans) lack these relations. Some animals (e.g., pets) have them.  
     - **Undermines Kantianism**: Kantian inviolability is *intrinsic*, not relational. Shifting to relational properties abandons Nozick’s core justification.  

  4. **Reply: The "Moral Agency" Gambit**  
     *Defense*: Only beings capable of *moral reciprocity* (e.g., respecting others’ rights) are inviolable. Animals and impaired humans cannot reciprocate.  
     *Counter*:  
     - **Infants and Reciprocity**: Infants cannot reciprocate but are still granted inviolability.  
     - **Reductio**: If a cognitively impaired adult cannot reciprocate, may we harm them? If not, the criterion fails.  

  **Step 4: The Implosion of the Hybrid View**  
  - **Horn (A)** forces Nozick to accept that some humans are violable → *contradicts his commitment to universal human inviolability*.  
  - **Horn (B)** forces him to ground inviolability in species membership → *collapses into speciesism, abandoning his capacity-based justification*.  
  - **No Third Way**: Attempts to soften **P** (e.g., "partial autonomy") either include advanced animals or exclude impaired humans.  

  **Conclusion**: Nozick’s hybrid view cannot simultaneously:  
  1. Ground inviolability in capacities like rational agency,  
  2. Guarantee inviolability for *all* humans,  
  3. Deny inviolability to *all* animals.  
  Any defense of (1) and (2) either includes many animals (undermining (3)) or excludes some humans (contradicting (2)). The view is either **over-inclusive** (animals gain protection) or **under-inclusive** (humans lose protection), revealing that species membership is the unacknowledged foundation.  

  ---

  ### **Why This Works as a Teaching Model**
  1. **Charitable Engagement**: Takes Nozick’s project seriously, granting his premises before exposing tensions.  
  2. **Structure**: Uses a clear dilemma (Horn A/B) to organize objections.  
  3. **Depth on Replies**: Addresses nuanced defenses (potential, Kantian will) rather than strawmen.  
  4. **Rigorous Logic**: Shows how *internal* commitments (universal human inviolability + capacity-based personhood) conflict.  
  5. **No Easy Escape**: Demonstrates that appeals to "potential" or "species-typicality" covertly rely on speciesism.  

  This forces students to confront whether they truly endorse capacity-based personhood (risking exclusion of impaired humans) or prioritize species membership (admitting speciesism). Either choice destabilizes the hybrid view’s promise of a clean, principled divide.  

  For seminar use: Pair this with Nozick’s cow/finger-snap example to show how his own thought experiment invites the marginal cases challenge. Highlight that the problem isn’t just "marginal humans" but the *incoherence* of grounding universal human rights in non-universal capacities.
