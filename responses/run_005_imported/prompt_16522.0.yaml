  For trumping preemption, the intuitive cause is the major's order, but without the sergeant's order, the outcome still happens. So counterfactual dependence fails. Lewis's influence approach looks at a range of alterations. If we imagine the major not ordering, the soldiers might not charge (if the sergeant also doesn't order), but with the sergeant ordering, they charge. This pattern shows the major's influence. But is this principled or ad hoc? The user might see it as a natural extension, but the worry is that influence requires specifying the right range of alterations, which could be arbitrary.

