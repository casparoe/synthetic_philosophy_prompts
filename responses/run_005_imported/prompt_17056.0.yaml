  Aumann's position is that rationality is a property of entire strategies. Common knowledge of rationality (CKR) means that in any state of the world, players choose rationalizable strategies, leading to backward induction without needing to consider off-equilibrium reasoning. Critics like Reny and Binmore argue that at unreachable nodes, CKR can't hold because reaching those nodes contradicts the initial assumption of rationality. 

