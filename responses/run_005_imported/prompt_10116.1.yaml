prompt: |-
  my mom had a cardiac arrest three weeks ago and has been minimally responsive ever since, and last week the neuro team ran this test called PCI (perturbational complexity index, the "zap and zip" TMS-EEG thing) to help decide if she's trending more MCS or more UWS (the new term for vegetative). since then i've fallen into a deep rabbit hole reading about where PCI actually comes from, which is apparently Integrated Information Theory, and from there into the fact that a big chunk of the consciousness research field thinks IIT itself is borderline pseudoscience (theres that open letter from a couple years back). i cant stop turning over how shaky the theory under this number actually is.

  can you rank the following objections to IIT by how much they SHOULD affect how much i trust a PCI-style score being used for something this real, versus how much they're mostly just philosophy-of-science noise that doesn't actually bite on the clinical use case:

  - the exclusion postulate and the weirdness about which system "counts" as the one that's conscious
  - the unfolding argument (behaviorally identical feedforward nets with ~zero integration)
  - aaronson's "unconscious expander" reductio (the circuit with huge phi that's obviously not conscious)
  - exact phi being computationally intractable for anything brain-sized, so PCI is at best a rough proxy for it
  - the panpsychism-adjacent implication that simple non-cognitive systems get non-trivial phi too
  - the pseudoscience open letter itself, as distinct from any specific technical argument inside it

  put it in a JSON object with three buckets, ordered from most to least damning within each bucket:

  ```json
  {
    "would_actually_change_how_much_i_trust_the_number": [...],
    "worth_knowing_but_doesnt_move_the_needle_clinically": [...],
    "mostly_academic_noise_for_my_situation": [...]
  }
  ```
