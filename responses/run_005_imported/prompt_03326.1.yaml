  - Virtue Ethicist (Golden Mean, seeks balance in character)
  - Care Ethicist (Heartsworn, prioritizes relational harm)
  - Egoist (Self-Made, only cares about personal benefit proxies)

  The plot hook: A trolley problem-esque vote where a hospital can be illegally built on sacred land to save lives. Perfect for highlighting clashes — utilitarians see obvious math, Kantians see property rights violations, care ethicists see community trauma. 

  The Kantian delegate (Dutybound) will be the "absolute rule" blocker. Their refusal to bargain should break the expected vote-trading dynamics. Maybe show the utilitarian (Pure Calculus) frustrated that they "only" need to flip Dutybound but can't offer anything because "don't violate duties" isn't quantifiable. 

  Key scene: The vote-trading floor where Self-Made (egoist) tries to auction their votes. Golden Mean (virtue) offers aesthetic concessions ("we'll make the hospital architecture harmonious") but Heartsworn (care) finds that offensive — revealing how different theories weight the same "concession." When Dutybound stares blankly at Pure Calculus's offer of "future welfare gains," it should feel like two people speaking different languages.

  Ending with the forced compromise: They build the hospital but add costly reparations to appease Dutybound and Heartsworn, making the utilitarian rage about "suboptimal outcomes." Exactly what the user wanted — the system "works" but fails to resolve incomparability, just buries it under political messiness.
answer: |-
  The polished marble floor of the Moral Parliament echoed with the murmur of weighted arguments. Sunlight streamed through high windows, illuminating dust motes dancing above the delegates' heads. Each seat bore a plaque: **Pure Calculus (Utilitarian - 35%)**, **Dutybound (Kantian - 25%)**, **Golden Mean (Virtue Ethics - 20%)**, **Heartsworn (Care Ethics - 15%)**, and **Self-Made (Ethical Egoist - 5%)**. Their physical presence reflected their credence – Pure Calculus was large, imposing; Self-Made was slight, perched on the edge of his oversized chair.

  The Speaker’s gavel cracked. **"Resolution 7B: Authorize construction of the Riverside Hospital on disputed ancestral lands of the Tellen Tribe. Projected: Save 5,000 lives/year from preventable disease. Violates: Tellen sacred covenant and property rights recognized under historical treaties."**

  Pure Calculus adjusted his monocle, tapping a tablet. **"Net positive welfare gain is undeniable. 5,000 lives annually outweighs abstract cultural or property concerns. My vote is a resounding YES. The math is clear."**

  Dutybound rose, her posture rigid, face like carved stone. **"The act is theft and a violation of autonomy. The ends *cannot* justify the means. Moral law forbids it. My vote is NO. There is no negotiation on principle."**

  Golden Mean stroked his beard. **"A balance must be sought. Perhaps a smaller hospital, designed with Tellen input? Or significant reparations elsewhere? I lean NO, pending concessions."**

  Heartsworn clasped her hands, eyes shimmering. **"The violation isn't abstract! It's a deep wound to a vulnerable community's trust and identity. The relational harm is immense. NO."**

  Self-Made smirked. **"Does it benefit *me*? Indirectly, perhaps, through societal stability. But the Tellen might offer me something better later if I oppose. I'm... open to persuasion."**

  **"Vote-trading session is now open,"** the Speaker announced. The chamber buzzed. Pure Calculus immediately approached Golden Mean and Heartsworn.

  **"Golden Mean,"** Pure Calculus boomed, **"you care about harmony. The hospital brings health, a form of harmony. Vote YES, and I pledge my substantial voting weight to support your 'Public Arts Initiative' next session – beauty for all!"**

  Golden Mean considered. **"Beauty *is* a virtue... and the lives saved are significant. If the Arts Initiative passes, it *could* balance the scales aesthetically... Perhaps YES becomes tenable."**

  **"Heartsworn,"** Pure Calculus turned, softer now. **"The suffering prevented! Think of the families kept whole. Vote YES, and I will dedicate my weight to your 'Community Kinship Grants' program – strengthening relational bonds elsewhere."**

  Heartsworn looked conflicted. **"But the Tellen bonds *here*... it's a direct assault. Your grants are good, but... are they *equal* to *this* harm? How do I measure the depth of a broken promise against the warmth of a new grant?"** She shook her head. **"It feels... incomparable. Like trading tears for sunlight. I need more."**

  Meanwhile, Self-Made sidled up to Dutybound. **"Stuck on NO? Fine. But what's it worth to you? I have votes. Make me an offer. Maybe I can be persuaded to join you... for the right price."**

  Dutybound didn't even turn her head. **"There is no price. The act is wrong. Your votes are irrelevant to the moral imperative. Negotiation implies the principle is fungible. It is not."** She stared straight ahead.

  Self-Made rolled his eyes. **"Useless."**

  Pure Calculus, seeing Golden Mean wavering, pressed Heartsworn. **"Name your price! What specific concession makes the harm commensurate?"**

  **"I... I don't *know*!"** Heartsworn cried. **"It's not a currency! How many 'kinship units' offset a desecrated burial ground? How many saved lives justify a lie to the tribe elders? Your 'welfare units' and my 'relational integrity units'... they don't convert! I can't find the exchange rate!"**

  Golden Mean, witnessing this, grew uneasy. **"Pure Calculus, perhaps... perhaps if the hospital included a Tellen-run healing center? Integrating their traditions?"**

  **"Inefficient!"** snapped Pure Calculus. **"But... if it secures your YES, I'll support it. 5% efficiency loss is acceptable."**

  **"Heartsworn?"** Golden Mean asked.

  **"It helps... a little,"** Heartsworn admitted. **"But it feels like putting a bandage on a severed limb. The initial violation remains... absolute."** She glanced at Dutybound's immovable back. **"Like hers."**

  Self-Made saw an opportunity. **"Heartsworn! Your pain is palpable. Vote NO, and *I'll* vote NO too. Together, with Dutybound, that's 45%. Enough to block it! And all I ask... is your future support for deregulating my business sector. Harm reduction through economic growth!"**

  Heartsworn recoiled. **"Deregulation harms vulnerable communities! That's the *opposite* of care! Your 'price' is poison!"**

  **"See?"** Self-Made shrugged. **"Incomparable values. My benefit isn't your benefit. Your 'care' is my 'cost'."**

  The trading floor stalled. Pure Calculus couldn't quantify Heartsworn's relational harm. Heartsworn couldn't translate Dutybound's absolute prohibition or Self-Made's self-interest into her framework. Golden Mean sought balance but found only shifting sands. Dutybound remained a monolith, rendering a chunk of the vote-trading pool inert.

  Finally, a messy compromise emerged, brokered by a desperate Golden Mean: The hospital would be built, but with the Tellen healing center *and* significant land reparations elsewhere, funded by redirecting Pure Calculus's beloved Arts Initiative budget. Dutybound voted NO, her principle uncompromised. Heartsworn, sickened but seeing Dutybound's stance as a kind of anchor, voted a reluctant NO. Golden Mean, securing his concessions, voted YES. Self-Made, seeing the Arts Initiative gone and the reparations costing him nothing, sold his YES to Pure Calculus for a future favor. Pure Calculus voted YES, furious at the inefficiency.

  The resolution passed 60%-40% (Pure Calculus 35% + Golden Mean 20% + Self-Made 5%).

  Pure Calculus glared at Dutybound. **"Your inflexibility forced suboptimal outcomes! Lives will be saved, but fewer than could have been!"**

  Dutybound didn't flinch. **"Evil was prevented. There are no optimal outcomes built on sand."**

  Heartsworn wept quietly. **"We traded wounds. We didn't heal anything. We just moved the pain."**

  Golden Mean sighed, looking at the complex, costly plan. **"Balance... of a sort. But at what cost to coherence?"**

  Self-Made counted imaginary profits. The Speaker slammed the gavel. **"Resolution 7B passes, as amended."**

  The delegates dispersed, the air thick not with consensus, but with the metallic tang of incommensurable values grinding against each other. The Parliament had functioned, but the deep, aching problem – the lack of a common measure for the things that mattered most – remained unresolved, etched into the very structure of every bargain struck and every principle held inviolate. The "how hard" of bargaining wasn't a solution; it was just the sound of the incomparability biting down.
