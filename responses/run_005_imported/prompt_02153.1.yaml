  To bridge this, the user needs to verify that the probability measure derived from VNM satisfies the axioms. The most efficient way is to check if the credences are derived from preferences via the VNM axioms. If the agent's preferences satisfy VNM, then the credences are probabilistic. So once money-pump immunity is confirmed (implying VNM coherence), the credences should already be Dutch-book coherent. 

