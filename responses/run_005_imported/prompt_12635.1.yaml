  ---

  **MEMORANDUM**

  To: Search-and-Rescue Unit Protocols Subcommittee  
  From: [Your Name]  
  Date: [Date]  
  Subject: Protocol Update for Incorporating Conditional Tips in Probability-of-Location Maps  

  ### Purpose
  This memo provides a recommended protocol for updating probability-of-location maps when receiving a credible tip that provides conditional information about the subject's location within one of the search regions (e.g., "if in region X, then subregion Y is more likely than subregion Z"). This update addresses the debate arising from last month's callout and ensures consistency and clarity in future operations.

  ### Background
  During last month's search, we received a credible tip that, if the subject was in the West zone, she was far more likely to be in the lake basin than the old lookout trail. The tip did not provide any information comparing East and West. The subcommittee split on whether this tip should change the marginal probability of the West zone (initially 50%):

  - One camp argued that the tip, being solely about the interior of West, cannot constitute evidence about East versus West and therefore should leave the marginal probabilities unchanged.
  - The other camp applied a maximum entropy update (as implemented in our software) to the entire distribution, resulting in a shift in the marginal probability of West.

  This memo resolves this issue by adopting a clear, field-operable procedure.

  ### Recommended Protocol
  When a credible tip provides **only conditional information within a single region** (i.e., it constrains the distribution within that region without comparing regions), the update shall proceed as follows:

  1. **Leave the marginal probabilities of all regions unchanged.**  
     Example: If East and West were equally likely (50% each) before the tip, they remain equally likely after the tip.

  2. **Update the conditional distribution within the affected region to incorporate the tip.**  
     - The conditional probabilities within the region (e.g., the relative likelihood of subregions within West) shall be updated to satisfy the tip's constraint.  
     - If the constraint is insufficient to fully determine the conditional distribution, the update shall minimize the relative entropy (maximize entropy) within the region relative to the prior distribution within that region. (This is handled by our software.)

  ### Reasoning
  - **Evidence Specificity:** The tip only provides information about the subject's behavior within West. It explicitly does not compare East and West. Therefore, it cannot justify changing the relative probability of East versus West.  
  - **Principle of Conservation of Probability:** Without evidence that directly bears on the East/West split, the initial marginal probabilities (based on the last known position and elapsed time) remain our best estimate.  
  - **Simplicity and Transparency:** This rule is intuitive and easy to apply under field pressure. Commanders can focus on updating subregions without recalculating region-level probabilities.  
  - **Avoiding Counterintuitive Shifts:** Maximum entropy updates at the entire distribution level can unintentionally shift marginal probabilities (as seen in the Judy Benjamin problem). This is not justified here, as the tip lacks comparative information about regions.  

  ### Addressing the Alternative Approach
  The alternative approach (updating the entire distribution via maximum entropy) is mathematically principled but has drawbacks in this context:
  - It can alter the marginal probability of a region even when the evidence does not directly pertain to that marginal. This is counterintuitive and unsupported by the evidence.  
  - It adds unnecessary complexity for field commanders, who must trust software outputs without clear justification.  
  While maximum entropy is useful for handling incomplete information, it is not the only method, and its application here conflicts with the evidence structure. We therefore confine maximum entropy updates to within-region adjustments only.

  ### Implementation
  - Our probability-mapping software will be updated to default to this behavior for conditional tips. Commanders will select the "Conditional Update (Within Region)" option when inputting such tips.  
  - Field volunteers will be trained to:  
     a. Identify tips that are purely conditional (e.g., "if in Region X, then Subregion Y is more likely").  
     b. Apply the update without altering region-level probabilities.  
  - Example:  
     Initial state: P(East) = 50%, P(West) = 50%. Within West, P(Lake|West) = 40%, P(Trail|West) = 60% (based on prior assumptions).  
     Tip: "If in West, Lake is twice as likely as Trail."  
     Update:  
       - Solve: P(Lake|West) = 2 * P(Trail|West), and P(Lake|West) + P(Trail|West) = 100%.  
       - New: P(Lake|West) = 66.7%, P(Trail|West) = 33.3%.  
       - Marginals unchanged: P(West) = 50%, so P(Lake) = 50% * 66.7% ≈ 33.3%, P(Trail) = 50% * 33.3% ≈ 16.7%.  
       - East remains 50%.

  ### Conclusion
  This protocol ensures that updates are evidence-based, intuitive, and field-operable. It resolves the subcommittee’s debate by honoring the structure of the information provided by the tip while avoiding unjustified shifts in region-level probabilities. We will implement this for all future conditional tips.

  Approved by:  
  [Your Name/Subcommittee]  
  Protocols Subcommittee, [Unit Name]
answer: |-
  **MEMORANDUM**  
  **To:** Search-and-Rescue Unit Protocols Subcommittee  
  **From:** [Your Name], Protocols Subcommittee Member  
  **Date:** [Current Date]  
  **Subject:** Protocol for Conditional Tips in Probability-of-Location Maps  

  ### **1. Purpose**  
  This memo resolves the dispute over updating probability-of-location maps when receiving conditional tips (e.g., "If in West zone, lake basin is far more likely than lookout trail"). It establishes a clear, field-operable procedure for incident commanders, effective immediately.  

  ### **2. Recommended Procedure**  
  **When a credible tip provides *only* conditional information about a subregion (e.g., "If in Zone X, Subregion A is likelier than Subregion B"):**  
  - **Leave the marginal probability of the parent zone (e.g., P(West)) UNCHANGED.**  
  - **Update *only* the conditional probabilities *within* the affected zone** to reflect the new constraint.  
  - **Apply equal scaling** to subregions not mentioned in the tip to satisfy the constraint minimally.  

  **Field Implementation (3 Steps):**  
  1. **Identify the zone and subregions** in the tip (e.g., West zone → lake basin [W1] / lookout trail [W2]).  
  2. **Hold the zone’s marginal probability fixed** (e.g., P(West) remains 50%).  
  3. **Recalculate subregion probabilities within the zone** using the tip’s constraint:  
     - If the tip states "W1 is far more likely than W2 if in West," set:  
       \[
       \text{New } P(\text{W1} | \text{West}) = \frac{k}{k+1}, \quad \text{New } P(\text{W2} | \text{West}) = \frac{1}{k+1}
       \]  
       where \(k = 3\) (default for "far more likely").*  
     - Scale probabilities of *other* subregions in West (if any) proportionally to maintain relative likelihoods.  
     - Re-normalize all subregion probabilities within West to sum to P(West).  

  > _*Rationale for \(k = 3\): Balances tip credibility with conservatism. Commanders may adjust \(k\) based on source reliability (e.g., \(k = 2\) for moderate confidence; \(k = 4\) for high confidence)._

  ### **3. Why This Approach? Evidence-Based Reasoning**  
  #### **Core Principle: Information Requires Evidence**  
  - The tip **only constrains the *distribution within West*** (e.g., "lake basin > lookout trail"). It provides **zero information** comparing East vs. West.  
  - Updating P(West) without new evidence about East violates the **principle of insufficient reason**: With no new East/West evidence, the 50/50 prior must stand.  
  - Example:  
    - Prior: P(East) = P(West) = 50%.  
    - Tip: "If West, then P(lake basin) = 3 × P(lookout trail)."  
    - Valid update: P(lake basin | West) = 75%, P(lookout trail | West) = 25%, **P(West) = 50%** (unchanged).  
    - Invalid update: Altering P(West) implies evidence about East, which doesn’t exist.  

  #### **Addressing the Maximum-Entropy Argument**  
  The opposing camp advocates rerunning the map with a maximum-entropy (max-ent) update, which *can* shift P(West). We acknowledge this view’s technical rigor but reject it for three reasons:  
  1. **Counterintuitive Shifts Without Evidence:**  
     Max-ent redistributes uncertainty to satisfy the constraint globally. However:  
     - If East has subregions (e.g., E1, E2), max-ent *implicitly assumes* the tip indirectly affects East by altering its "information entropy." This is not grounded in evidence.  
     - Example: If West’s subregions are constrained, max-ent *lowers* P(West) to "balance" uncertainty, even without East/West evidence. This artificially penalizes West.  
  2. **Operational Risk:**  
     - Shifting P(West) away from 50% reduces resources allocated to West despite no new East/West evidence. In a real search, this could delay finding the subject.  
  3. **Philosophical Dispute:**  
     - The "Judy Benjamin problem" (yes, that was the name!) remains contentious in Bayesian epistemology. Max-ent is one solution, but not the only one—and not the safest for SAR.  

  #### **Why Equal Scaling for Unmentioned Subregions?**  
  - If West had a third subregion (e.g., "cliff area"), we scale it proportionally to maintain prior assumptions (e.g., if cliffs were half as likely as trails pre-tip, they remain so). This minimizes unnecessary changes.  

  ### **4. Benefits for Field Operations**  
  - **Simplicity:** Commanders fix P(zone) and adjust subregions—no complex math.  
  - **Speed:** Update takes <2 minutes (vs. rerunning entire map).  
  - **Safety:** Avoids under-searching a zone without evidence.  
  - **Consistency:** Aligns with how we handle non-conditional tips (e.g., "Saw subject near lake" only affects lake-adjacent zones).  

  ### **5. Implementation Plan**  
  1. **Software Update:** Reprogram max-ent default for conditional tips to hold parent-zone marginals fixed. (Ready by spring training.)  
  2. **Training:** Drill commanders on the 3-step process during spring exercises.  
  3. **Field Guide:** Laminated cheat sheet for radios:  
     > "Conditional tip? → FIX zone probability. ADJUST subregions inside. Use k=3 for 'far more likely.'"  

  ### **6. Conclusion**  
  This protocol honors the evidence: Tips about *within-zone* behavior should not alter *between-zone* probabilities without direct comparison. It ensures scarce SAR resources are allocated based on defensible probabilities—not philosophical disputes. We adopt this as our standard for conditional tips.  

  **Approved by:**  
  [Your Name], Protocols Subcommittee  
  **Endorsed for Training:**  
  [Incident Command Lead Name]  

  ---  
  **APPENDIX: Quick Example**  
  *Scenario:*  
  - Prior: P(East) = 50%, P(West) = 50%.  
  - Within West: P(lake basin) = 30%, P(lookout trail) = 20% (other subregions: 50%).  
  - Tip: "If West, lake basin far more likely than lookout trail." (k=3)  

  *Update:*  
  1. Hold P(West) = 50%.  
  2. Set P(lake basin | West) = 75%, P(lookout trail | West) = 25% of West’s probability.  
  3. Scale other West subregions: Original 50% × (25/20) = 62.5% of West.  
     - New: P(lake basin) = 50% × 75% = 37.5%  
       P(lookout trail) = 50% × 25% = 12.5%  
       P(other West) = 50% × 62.5% = 31.25%  
     - P(East) unchanged at 50%.
