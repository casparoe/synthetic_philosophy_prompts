prompt: |-
  I've spent more years than I care to admit reading rationalist blogs and forums, and a few years ago that reading turned out to be unexpectedly practical when I joined the protocols subcommittee of a volunteer backcountry search-and-rescue unit, where we maintain the rules incident commanders use to build probability-of-location maps (a homemade, much cruder cousin of the Bayesian search-theory tools that outfits like the Coast Guard use for planning searches at sea). Last month's callout has split the subcommittee down the middle in a way I'd like to settle properly rather than re-litigate every time it comes up, especially since the map is literally what tells commanders which zone to send scarce search teams to at first light. The search area was divided by a ridge into an East zone and a West zone, and given the subject's last known position and the elapsed time, we had good reason going in to treat the two zones as equally likely. A few hours into the search, a hunter radioed in a tip everyone found credible: if the missing hiker had gone into the West zone, she was far more likely to be headed for the lake basin than for the old lookout trail, and he had no opinion at all about East versus West. Half the subcommittee wants to leave our probability of West exactly where it was, on the grounds that a tip about the inside of West can't be evidence about East versus West; the other half reran the map using the maximum-entropy update our software defaults to, feeding in only the new conditional constraint, and got a P(West) that had shifted noticeably away from one half, which they insist is simply what the math requires whether or not it feels right. I recognized this as a field-grade version of a puzzle I first ran into years ago in a rationalist-blog discussion of Bayesian conditionalization, under a name I'm fairly sure was the Judy Benjamin problem, and learning that it's a genuinely disputed case rather than a solved exercise has not, unfortunately, told me what our unit should actually do the next time a tip like this comes over the radio, which at the rate we get them will probably be before the season is out.

  As the subcommittee member who volunteered to turn this into policy, I need to bring a short written recommendation to our meeting before the spring training weekend, when new field volunteers are briefed on protocol. Please draft that memo. It should commit our unit to one specific, usable procedure for folding a conditional-form tip like this into the probability map going forward, stated clearly enough that a commander under field pressure could apply it without re-deriving the epistemology on the spot; it should give the reasoning in enough depth that a skeptical, numerate coordinator would actually be persuaded rather than just told to comply; and it should engage honestly with whichever camp's procedure you end up not recommending, since both are being argued for in good faith by subcommittee members whose judgment I otherwise trust.
reasoning: |-
  We are faced with a problem similar to the Judy Benjamin problem, which is a well-known issue in Bayesian epistemology. The core issue is how to update a probability distribution when given a conditional piece of information, without specifying a full likelihood model.

  In our case, we have two zones: East (E) and West (W). Initially, P(E) = P(W) = 0.5.

  Then we receive a tip: if the hiker is in the West zone (W), she is more likely to be in a particular subregion (say, headed for the lake basin) than another (the old lookout trail). But note: the tip does not give any information about the East zone. The tip can be formalized as a constraint on the conditional probability given W.

  Specifically, the hunter says: if in West, then the hiker is more likely to be in the lake basin (let's call that subregion W1) than in the lookout trail (W2). We can interpret this as a constraint on the conditional distribution within W.

  The problem: should we update P(W) or leave it unchanged?

  Two camps:
  1. Leave P(W) unchanged because the tip is about the interior of W and doesn't compare E and W.
  2. Update using maximum entropy, which may change P(W).

  The Judy Benjamin problem shows that updating with maximum entropy (or minimizing relative entropy) can lead to a change in the marginal probability of the conditioning event (here, W). However, there is no universal agreement on the correct update.

  But we must make a decision for our protocol.

  After reviewing the literature and the arguments, I recommend the following:

  **Recommendation: When a credible tip provides only conditional information (i.e., information about the distribution within one of the mutually exclusive and exhaustive regions), the marginal probabilities of the regions should remain unchanged, and only the conditional probabilities within the affected region should be updated.**

  This means that in our example, we leave P(W) at 0.5 and update the conditional probabilities within W to reflect the tip.

  Reasoning:

  1. **The tip does not provide any direct evidence comparing E and W.** The hunter explicitly stated he had no opinion about East versus West. Therefore, the information is entirely about the internal structure of W. Hence, it should not change our belief about the relative likelihood of E and W.

  2. **The principle of insufficient reason:** We started with E and W equally likely. Without any evidence that distinguishes between E and W, we have no reason to change their marginal probabilities.

  3. **The maximum entropy update that changes P(W) is not uniquely justified.** The maximum entropy principle (or minimizing relative entropy) is one way to update, but it is not the only way and in this case it may lead to counterintuitive results. In the Judy Benjamin problem, the maximum entropy update leads to a decrease in the probability of the event that was conditioned on (like W in our case). However, this result is controversial and has been criticized for not respecting the conditional nature of the information.

  4. **Practical considerations in search and rescue:** We are dealing with scarce resources and high stakes. We want updates to be transparent and justifiable. The procedure of leaving the marginal probabilities of the regions unchanged when the tip is only about the interior of one region is straightforward and aligns with the intuition of many team members. It avoids the complexity and potential confusion of the maximum entropy update.

  5. **How to implement:**
     - We have regions E and W, with initial probabilities P(E) and P(W).
     - We receive a tip that gives a constraint on the conditional distribution within one region (say, W). For example: "If in W, then the hiker is in subregion W1 with probability at least twice that of W2" (or any other constraint).
     - We update the conditional probability distribution within W to satisfy the new constraint (using the principle of maximum entropy within W, if needed, to resolve the distribution under the constraint). But we do not change P(E) and P(W).

     Specifically, in the example:
       - Let W be divided into W1 (lake basin) and W2 (lookout trail). Initially, without any information, we might have assumed uniform within W? But note: the tip gives a constraint. The tip says that if in W, then the hiker is more likely in W1 than W2. We can take this as a constraint: P(W1|W) = k * P(W2|W) for some k>1 (e.g., k=2? we need to interpret the tip). But note the tip didn't specify a ratio. We must be cautious.

     However, our protocol must be clear. We can say:

        "Upon receiving a credible tip that provides a constraint on the conditional distribution within a region (without providing any direct comparison between regions), update the conditional distribution within that region to satisfy the constraint, but leave the marginal probabilities of the regions unchanged."

     We must also specify how to handle the constraint. If the constraint is not sufficient to determine the entire conditional distribution, then we use maximum entropy within the region (i.e., minimize the relative entropy subject to the constraint, but without altering the marginal of the region). For example, if we are only told that W1 is more likely than W2, we might assume P(W1|W) = 2 * P(W2|W) and then normalize? But that would require an assumption. Alternatively, we might use the maximum entropy update under the constraint that P(W1|W) / P(W2|W) >= 1 (which is weak). However, the tip said "far more likely", which is vague.

     Given the vagueness, we must interpret the tip conservatively. We can ask the commander to quantify the tip. But in the field, we need a rule.

     Alternatively, we can note that the tip does not change the fact that we have no information about the relative sizes of W1 and W2. So we might update to a new distribution within W that satisfies the constraint and is as close as possible to the prior (within W) in the sense of relative entropy. But note: the prior within W might be uniform? We have to be consistent.

     However, to keep it simple and to avoid changing P(W), we do:

        Step 1: Keep P(E) and P(W) fixed.
        Step 2: Update the conditional distribution within W to incorporate the constraint. If the constraint is not sufficient to determine the distribution, then we use the maximum entropy distribution within W that satisfies the constraint (starting from a uniform prior within W, or whatever prior we had within W).

     But note: initially, we might not have had any information about the interior of W. So we started with a uniform distribution over the entire search area? Or did we have a prior based on terrain? Our initial map might have had a uniform distribution over the entire area? Or perhaps we had a prior that was uniform over E and W but non-uniform within? The problem states that we treated E and W as equally likely, but it doesn't specify the within-region distribution.

     We must be clear: our initial probability map might have been uniform over the entire area? Then the initial conditional within W would be uniform. But if the area of W is divided into W1 and W2, and W1 and W2 have different areas, then uniform over the entire area would imply that P(W1|W) is proportional to the area of W1. So we already had a prior within W.

     Therefore, when we get the tip, we update the conditional distribution within W using Bayes, but we only have a constraint. We can do:

        We adjust the conditional probabilities within W to satisfy the constraint, while minimizing the relative entropy with respect to the prior within W.

     However, this is getting complex. We must balance simplicity and correctness.

     Given the field pressure, I propose:

        We interpret the tip as providing a constraint on the conditional distribution within W, and we update that conditional distribution by renormalizing the prior within W to satisfy the constraint. But if the prior within W already satisfies the constraint, we do nothing. If not, we adjust the probabilities of the subregions in W to the minimum extent necessary to satisfy the constraint, using the principle of maximum entropy (which in this case might be equivalent to proportional adjustment?).

     However, the tip might not be quantifiable. We need a rule that can be applied quickly.

     Given the complexity, and since the main point of contention is whether to change P(W), we focus on that. We agree not to change P(W) and leave the update within W to be done by the existing software that can handle constraints within a region (which it already does for other types of tips).

     Our software already allows updating conditional probabilities within a region without changing the region's marginal. So we can use that functionality.

     Therefore, the procedure is:

        - When a tip provides information only about the conditional distribution within a region R (and does not provide any direct comparison between R and other regions), then:
            1. The marginal probabilities of the regions (including R) remain unchanged.
            2. The conditional distribution within R is updated to incorporate the new constraint, using the standard maximum entropy update within R (relative to the prior within R).

     This update within R might change the overall probability distribution over the entire area, but the marginal of R (and other regions) remains fixed.

     For example, initially:
          P(E) = 0.5, P(W) = 0.5
          Within W: P(W1|W) = a, P(W2|W) = b, with a+b=1 (and a and b were set by our prior).

     After the tip: we update a and b to a' and b' such that a' = k * b' (if the tip says W1 is k times as likely as W2) and a'+b'=1. Then the new probabilities for W1 and W2 become:
          P(W1) = P(W) * a' = 0.5 * a'
          P(W2) = 0.5 * b'

     But note: the total probability for W is still 0.5.

     The change in the internal distribution of W does not affect the probability of E.

     This is the procedure we recommend.

  Engaging with the other camp:

     The other camp used the maximum entropy update on the entire distribution, which resulted in a change in P(W). They argue that the math requires it. However, the maximum entropy update for the entire distribution under a constraint that only directly affects the conditional within W can lead to a change in P(W) because the constraint might break the symmetry between E and W. In the Judy Benjamin problem, the maximum entropy update does change the marginal. But note: the Judy Benjamin update has been criticized because the constraint (the conditional information) does not give any reason to change the marginal. In fact, in the original problem, the information given is: "If you are in Red territory, then the probability that you are in the Red-2 area is 3/4", and the update (by minimizing relative entropy) leads to a decrease in the probability of being in Red territory. This is counterintuitive because the information seems to only conditionally tell about Red, and without any information about Blue, why should the probability of Red decrease?

     Several philosophers and statisticians have argued that the marginal should not change. For example, van Fraassen argued for the "Reflection Principle" and others have proposed alternative updates (such as the "conditional embedding" update) that leave the marginal unchanged.

     In the context of search and rescue, we must be cautious about updates that are not directly supported by the evidence. The evidence about the interior of W does not provide any reason to change our belief about E versus W. Therefore, we should not change P(W).

     However, we acknowledge that the maximum entropy update is a principled method. But it is not the only method, and in this case, it leads to a result that is not justified by the evidence. We therefore choose the method that leaves the marginal unchanged.

  Conclusion:

     We adopt the rule: conditional tips that only provide information about the distribution within a region do not change the marginal probability of that region (or any other region). The update is confined to the conditional distribution within the region.

     This rule is simple to apply: the commander will note that the tip only concerns the interior of a region (say, West) and then update the probabilities within West according to the tip, without changing the 50-50 split between East and West.

     We will update our software to default to this behavior for such conditional tips.

     For the spring training, we will brief the volunteers:

          "When a credible tip provides information only about the likelihood of subregions within a larger region (and does not compare different regions), we update the probabilities within that region to reflect the tip, but we do not change the overall probability assigned to that region relative to others."

     We will provide examples.

