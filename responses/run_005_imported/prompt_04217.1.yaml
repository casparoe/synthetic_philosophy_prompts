answer: |-
  Your approach is both defensible and insightful—it captures a crucial nuance in Aquinas's thought. The tension between *In II Sent.* and *De Regimine Principum* reflects a distinction between **theoretical moral permissibility** and **practical political prudence**, not a contradiction. Here’s how to frame your argument and address counter-evidence:

  ---

  ### **Core Argument: Principle vs. Prudence**
  1. **Sentences Commentary: The Moral Foundation**  
     Aquinas establishes that a tyrant forfeits legitimacy by ruling for private gain, becoming a "public enemy" (*hostis publicus*). Tyrannicide is not murder but an act of just defense of the common good. This is a **deontological judgment**: the act is intrinsically licit when the tyrant’s illegitimacy is certain.  

  2. **De Regimine Principum: Prudential Restraint**  
     Here, Aquinas shifts focus to **consequences and authority**. He doesn’t retract the moral principle but warns that private action risks chaos. His objections are pragmatic:  
     - **Ineffectiveness**: Private attempts often fail and provoke worse tyranny.  
     - **Misjudgment**: Individuals may misidentify tyranny due to limited perspective.  
     - **Anarchy**: Vigilantism undermines the social order, a greater evil than enduring a moderate tyrant.  
     Crucially, he insists action should come from "public authority" (e.g., representatives, nobles, or institutions), not random individuals.  

  ---

  ### **Reconciling the "Private Presumption" Language**
  Aquinas’s emphatic warnings in *De Regimine* target **recklessness**, not the core permissibility. Use these strategies:  

  1. **Contextualize the Audience**  
     - *Sentences* is academic theology, exploring abstract principles.  
     - *De Regimine* is advice for rulers (and citizens) in a fallen world. His harsh tone reflects realpolitik, not moral revision.  

  2. **Reframe "Presumption"**  
     When Aquinas condemns "private presumption," he targets:  
     - Acts based on *personal grievance* (not the common good).  
     - Actions *without broad consensus* or in the absence of legitimate avenues.  
     This aligns with *Sentences*—the tyrant-killer is praised only when acting as a *defensor civitatis* (defender of the state), not a vigilante.  

  3. **Emphasize the "Usually" Clause**  
     Aquinas says private attempts "**usually** accomplish nothing" (my emphasis). This implies exceptions exist—consistent with *Sentences*. His concern is the *typical outcome*, not the *absolute morality*.  

  4. **Hierarchy of Goods**  
     For Aquinas, preserving social order is a high good. Even a just act (tyrannicide) becomes illicit if it threatens greater chaos. *De Regimine* thus layers a **proportionality test** onto the *Sentences* principle.  

  ---

  ### **Strengthening Your Thesis: Key Scholarly Supports**
  1. **Textual Synthesis**  
     Cite Aquinas’s *Summa Theologiae* (I-II, q. 96, a. 4): He reiterates that laws lose binding force if unjust, but subjects should endure mild tyranny to avoid "scandal or danger." This bridges both texts.  

  2. **Scholarly Backing**  
     - **J.H. Burns**: Notes Aquinas’s distinction between a tyrant *ab initio* (usurper, fair game) and one who degenerates (requires public judgment).  
     - **Harold J. Berman**: Argues *De Regimine* addresses *implementation*, not negating the right of resistance.  
     - **Mariana Himself**: In *De Rege* (1599), he cites *both* texts, viewing *De Regimine* as cautionary, not prohibitive.  

  3. **Historical Context**  
     Aquinas wrote *De Regimine* (c. 1267) amid papal-imperial conflicts. His caution reflects fear of factional violence destabilizing Christendom—context absent in his academic *Sentences* (1254–56).  

  ---

  ### **Structure for Your Response Paper**
  1. **Introduction**: State thesis—Aquinas’s "inconsistency" is a misreading; he separates *moral justification* from *prudential execution*.  
  2. **Sentences as Foundation**: Analyze d. 44, q. 2, a. 2 to establish tyrannicide’s permissibility.  
  3. **De Regimine as Prudential Corollary**: Explain how its warnings presuppose the *Sentences* principle but prioritize order.  
  4. **Reconciling Key Passages**: Address "private presumption" using the strategies above.  
  5. **Conclusion**: Argue Mariana *was* Thomistic—he applied Aquinas’s core principle to 16th-century absolutism, where "public authority" was inert.  

  **N.B.**: Avoid framing this as Aquinas "changing his mind." Stress his consistent ethic: tyranny voids obedience, but action must serve—not destroy—the common good. Your approach honors both texts while explaining their emphases. Well argued!
