     Now, suppose the agent is in possession of A. We can offer to trade A for B- (which is worse than B). Since the agent does not have a preference between A and B, but we know the agent prefers B to B-, why would the agent accept trading A for B-? It wouldn't, because it would be going from A to something worse than B, and it doesn't have a reason to do so.

     So how does the pump work?

     A common construction is to use a chain:

     Step 1: Offer to trade A for B. Since the agent has no preference, it might be willing to make this trade for a very small positive incentive (say, a penny). So we pay the agent a penny to switch from A to B. Now the agent has B and a penny.

