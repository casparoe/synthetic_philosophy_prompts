     - Start: A
     - Step 1: We offer to trade A for B and charge the agent $1. Why would the agent accept? It has no preference and is being charged $1 to switch? It wouldn't.

     So the money pump for incompleteness might not be as clear-cut as for intransitivity. 

     However, there is a different kind of vulnerability: if the agent is not indifferent between A and B, then it might be willing to pay a small amount to get from A to B (or from B to A). But by definition, in incompleteness, the agent doesn't have a strict preference, so it should not be willing to pay anything to switch. Therefore, a rational agent with incomplete preferences would not accept any trade that costs money to switch between A and B. It might only switch if offered a bonus. 

     Thus, the agent with incomplete preferences is not vulnerable to the same kind of money pump as an agent with intransitive preferences. The standard money pump argument for completeness is not as strong.

  2. **What does "resolute choice" need to assume?**
     Resolute choice requires that the agent can commit to a plan over time. Specifically, at the initial time, the agent chooses a plan for the entire sequence of decisions and sticks to it, even if at a later time it would be tempted to deviate. 

     For the pump to be blocked, the agent must:
     - Be able to foresee the entire sequence of decisions and their consequences.
     - Have the ability to commit to a plan and not deviate when later choices come up.

     This requires that the agent does not suffer from dynamic inconsistency. In other words, the agent's ex-ante preferences (at the initial time) are consistent with the plan, and it does not change its mind as the plan unfolds.

  3. **Does resolute choice reintroduce coherence at the level of plans?**
     This is the critical point. If the agent is resolute and commits to a plan, then at the level of plans, it must have a preference ordering over the possible plans. 

     - At the initial time, the agent must compare the plan "stick with A throughout" versus the plan "switch to B and then switch back to A and pay fees". The agent will see that the latter plan leaves it worse off (if there are fees) and choose the former.

     - But to make that choice, the agent must have a preference between the outcome of the first plan (A) and the outcome of the second plan (A minus fees). And since the agent has a preference for more money (or against losing money), it will prefer the first plan.

     However, note that the agent's preferences over the outcomes are still incomplete (by assumption) for some pairs. But the plan comparison might force completeness at the level of the entire sequences? Not necessarily: the agent might still have incomplete preferences between some plans that don't involve money. But in the specific pump scenario, the plans lead to outcomes that differ in money, and the agent is assumed to have a strict preference for more money (at least in these outcomes). 

     So, to block the pump, we don't need completeness per se, but we do need that the agent can compare the two plans in this particular case. And if the plans lead to outcomes that are comparable (because they involve the same underlying option but different amounts of money), then the agent can have a strict preference.

     However, the worry is that by requiring the agent to be able to compare the plans, we are effectively requiring that the agent's preferences over the final outcomes (with money) are complete. But note that we only require comparability in this specific context. The agent might still have incompleteness elsewhere.

     But more fundamentally, the resolute agent must be able to form preferences over plans (which are sequences of outcomes) and choose among them. This requires that the agent's preferences over the set of plans are coherent enough to choose. In particular, to avoid being money pumped, the agent must prefer the plan that avoids the pump. But that doesn't necessarily require completeness over all possible plans, only that in this specific case it can choose.

     However, if we consider a more complex set of plans, the agent might again run into incompleteness. But the point is that the money pump is avoided for the specific threat.

     But does this mean that the agent must have a complete preference ordering over the set of all plans? Not necessarily. It might only need to have preferences in the relevant comparisons. But then, if there are many such potential money pumps, the agent must have enough completeness to avoid each one. This might lead to a de facto completeness in the relevant domain.

     Alternatively, one might argue that the agent's commitment device (resolute choice) is a way of extending the agent's preferences to cover the necessary comparisons without having to assume completeness over all options. However, the agent must still have a way of choosing among the available plans. If the agent has incomplete preferences between two plans that are both safe from being pumped, then it might be vulnerable to a different kind of pump? 

     Overall, resolute choice does not necessarily reintroduce completeness over the entire domain, but it does require that the agent can make a choice in the specific dynamic decision problem. And that choice might be based on a local comparability (e.g., having more money is better) that is not part of the original incomplete preference relation.

  ### Conclusion
  The money pump argument for completeness is not as strong as for transitivity. An agent with incomplete preferences can avoid being money pumped by simply refusing to trade between incomparable options without compensation. Resolute choice provides a dynamic decision-making approach that blocks the pump by allowing the agent to commit to a plan. However, this commitment requires that the agent can compare the outcomes of different plans in the specific context of the pump. This does not necessarily reintroduce completeness over the entire domain, but it does require that the agent has enough structure in its preferences to avoid the pump. 

  In practice, an agent with incomplete preferences might be able to avoid money pumps without having a complete preference ordering, as long as it is not willing to pay to switch between incomparable options and can commit to plans when necessary.

  So, the incompleteness side does win a limited victory: it is possible to have incomplete preferences and avoid money pumps, but this requires either a cautious approach to trading (only trading when there is a strict improvement or compensation) or resolute choice. However, the agent must still have some coherence at the level of dynamic choices to avoid being exploited.
answer: |-
  Let's unpack the dialectic around completeness, money pumps, and resolute choice. The core issue is whether the absence of a complete preference ordering necessarily makes an agent vulnerable to exploitation via money pumps, and whether resolute choice genuinely blocks this without smuggling in coherence requirements. I'll address your three questions systematically.

  ### (1) How the Money-Pump Argument for Completeness Works
  The argument attempts to show that if an agent lacks a complete preference ordering (i.e., has "gaps" where it neither prefers A to B nor B to A, and is not indifferent), it can be exploited through a series of trades. Here's the canonical construction:

  - **Setup**: Suppose an agent has no preference between options A and B (a genuine gap). Let C be an option strictly worse than both A and B (e.g., A > C and B > C, but A and B are incomparable).
  - **The Pump**:
    1. **Start**: Agent possesses A.
    2. **Trade 1**: Offer to swap A for B, plus a small payment (e.g., $1) to the agent. Since the agent has no preference between A and B, it accepts (the payment breaks the tie).
    3. **Trade 2**: Offer to swap B (now held by the agent) for C, but charge the agent a fee (e.g., $2). Since B > C, the agent agrees to pay to avoid C.  
       *(Rationale: If the agent strictly prefers B to C, it would pay to avoid C. The fee is set high enough to compensate for B > C but low enough that the net loss is acceptable.)*
    4. **Trade 3**: Offer to swap C for A, but charge another fee (e.g., $2). Since A > C, the agent pays to return to A.  
  - **Result**: Agent ends with A (its original state) but net loss of $3 ($1 gained in Trade 1, $4 paid in Trades 2 and 3). The agent has been "pumped."

  **Why this targets incompleteness (not transitivity)**:  
  - The vulnerability arises from the **gap itself**, not a cycle. The agent accepts Trade 1 solely because of the small payment, exploiting its lack of preference between A and B.  
  - Without completeness, the agent has no reason to reject Trade 1, as it gains $1 for no perceived cost. Trades 2–3 then exploit its strict preferences involving C.  
  - **Key difference from transitivity pumps**: Transitivity pumps exploit cyclic preferences (A > B > C > A). Here, the gap (A≁B) creates a "weak spot" where the agent is indifferent to marginal changes (e.g., small payments) that bridge the gap.

  **Objection**: Why accept Trade 1? If the agent truly has no preference, why not reject it?  
  - **Pro-pump response**: If the agent *always* rejects trades in gaps, it forgoes Pareto improvements (e.g., free money). If it *sometimes* accepts, a pump can be constructed by offering trades when it’s "tempted." Resolute choice blocks this by pre-committing.

  ### (2) How Resolute Choice Blocks the Pump
  Resolute choice, formalized by Edward McClennen, allows an agent to evaluate and commit to entire *plans* in advance, rather than choosing step-by-step ("myopically"). This blocks the pump:

  - **The resolute agent**:  
    - Before any trades, it evaluates the *entire sequence*: Start with A → Trade 1 (A to B + $1) → Trade 2 (B to C - $2) → Trade 3 (C to A - $2).  
    - It compares the outcome (A - $3) to the status quo (A). Since it prefers more money to less, it rejects the entire plan.  
    - When later offered Trade 1 (A for B + $1), it refuses, adhering to its pre-commitment.  

  **What resolute choice assumes**:  
  - **Foresight**: The agent must anticipate future choices and their consequences.  
  - **Commitment mechanism**: It must bind itself to the pre-chosen plan, even if later preferences would deviate (e.g., refusing Trade 1 despite the $1 incentive).  
  - **Non-myopic rationality**: Decisions are based on global outcomes of plans, not local incentives at each step.  

  **Why this blocks the pump**: The agent avoids the sequence entirely by seeing the net loss upfront. No completeness is needed—only the ability to compare *this specific plan* to the status quo.

  ### (3) Does Resolute Choice Secretly Reintroduce Coherence?
  This is the crux. Critics argue resolute choice implicitly assumes coherence at the *plan level*, undermining incompleteness. Let’s dissect:

  - **The case for "smuggling coherence"**:  
    - To choose a plan, the agent must compare *outcomes of whole plans*. For example:  
      - Plan 1: Keep A (outcome: A).  
      - Plan 2: Accept all trades (outcome: A - $3).  
    - If the agent can definitively prefer Plan 1 over Plan 2 (due to money loss), it has a *complete* preference between these two plans.  
    - If such comparisons *always* resolve when plans lead to different outcomes, the agent effectively has a complete ordering over *plans*, even if preferences over *atomic options* are incomplete.  

  - **The defense from incompleteness advocates**:  
    - Resolute choice requires only **local comparability**, not global completeness. The agent needs to compare *only the specific plans relevant to this pump*, not all possible plans.  
    - The preference between Plan 1 and Plan 2 derives from a **situational dominance heuristic** (e.g., "losing money is bad"), not a comprehensive utility function.  
    - Incompleteness in atomic preferences (A≁B) can persist, as the agent never forces a comparison between A and B—it only rejects the *plan* that exploits the gap.  

  **The verdict**:  
  - Resolute choice **avoids money pumps** without requiring completeness over atomic options.  
  - However, it **does require coherence over plans** in specific contexts (e.g., when plans differ in dominated attributes like money). This is a weaker requirement than full VNM completeness, but it’s not "no coherence at all."  
  - **True incompleteness survives only if**:  
    - Gaps are preserved for atomic options (A≁B remains).  
    - The agent can make resolute commitments *without* resolving those gaps.  
    - Comparisons of plans are limited to cases where one plan is situationally dominant (e.g., via monetary loss).  

  ### Conclusion: The Dialectic Resolved
  - **Money pumps for incompleteness** work only if the agent is myopic and lacks commitment. The pump exploits the gap by offering marginal incentives to "bridge" it, then leveraging strict preferences elsewhere.  
  - **Resolute choice blocks this** by allowing agents to pre-commit to plans, avoiding exploitative sequences. It requires foresight and commitment but not completeness over atomic options.  
  - **Coherence is reintroduced—but minimally**: Resolute choice demands coherence over *outcomes of plans* in specific decision contexts (e.g., when plans differ in money). This doesn’t collapse into full VNM coherence, but it does require more than "radical" incompleteness where *no* comparisons are possible.  

  **Your takeaway**: The incompleteness advocate wins a partial victory. An agent can have incomplete preferences and avoid money pumps via resolute choice—but only by endorsing a form of "local" coherence at the plan level. This is a genuine escape hatch from strict VNM requirements, though it concedes that *some* coherence is needed for dynamic consistency. The debate ultimately hinges on whether this local coherence is a trivial add-on or a substantive concession.
