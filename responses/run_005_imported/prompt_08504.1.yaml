     - Step 2: Trade B+1¢ for C plus 2¢. (You have C+3¢) [because you require 1¢ compensation for the loss of B to C? But then you get 2¢ so net 3¢?]
     - Step 3: Trade C+3¢ for A plus 2¢. (You have A+5¢) [because you require 2¢ to go from C to A? Then we give you 2¢ and take C+3¢? So you have A and 2¢?]

     Then you end with A and 2¢? So you made 2¢? 

     This is not a pump.

     I think I have been misremembering. The standard money pump for incompleteness might not be as straightforward as for intransitivity.

     However, there is a different argument: if the agent has incomplete preferences, then it might be vulnerable to a pump that exploits dynamic inconsistency. But that is where resolute choice comes in.

     Let me turn to the defense by resolute choice.

  ### Resolute Choice
  The idea of resolute choice, introduced by Edward F. McClennen, is that an agent can avoid being money pumped by committing in advance to a plan. Even if the agent has incomplete preferences, if it can commit to a plan that avoids the series of trades, then it won't be pumped.

  For example, suppose the agent is offered the following sequence of trades:

     - At time 0: Agent has A.
     - At time 1: Offered to trade A for B for a small fee (or bonus) of $1.
     - At time 2: Offered to trade B for A for a small fee of $1.

  If the agent is myopic and decides at each step, it might:

     - At time 1: Accept the trade to get B and $1 (if the fee is negative, meaning a bonus) or pay $1 to get B (if it's a fee). But without a preference, it might not pay to switch? 

     Let's reframe: we offer a sequence of trades that individually seem acceptable but lead to a cycle that costs money.

     The resolute agent, however, can look ahead and see that if it accepts the first trade, it will then be tempted to make the second trade and end up back at A but having paid $1. So it will refuse the first trade.

     Thus, by being resolute (i.e., choosing a plan at the beginning that avoids the entire cycle), the agent avoids the pump.

  ### The Dialectic

  1. **How does the money-pump argument for completeness work?**
     The argument is that if an agent has incomplete preferences, then there exists a pair of options A and B such that the agent does not prefer A to B, does not prefer B to A, and is not indifferent. The money pump tries to exploit this by offering a sequence of trades that moves the agent from A to B and back to A, charging a fee each time. However, as we've seen, the agent might not accept every trade without compensation. 

     A more sophisticated pump might use three options: A, B, and a third option C that is strictly worse than both A and B. The pump might go:

