  ## The Toast: For the Economist Who Saw Through the Veil

  (Sound of glass tapping) Friends, colleagues, and especially [Economist's Family Members], we’re gathered to celebrate [Economist's Name]. Now, trying to sum up a brilliant career in central banking without putting half the room to sleep is a challenge worthy of its own monetary policy committee! But bear with me, because [Economist's Name] herself gave us the perfect key, a North Star she returned to time and again, drawn from a thinker much older than any of our economic models: David Hume.

  Hume, back in 1752, penned an essay called "Of Money." And in it, he laid down a fundamental truth that became the bedrock of [Economist's Name]'s intellectual world. He said, essentially, that money is a **veil**. Think of it like... well, imagine a thick curtain hanging over the real workings of an economy – the factories, the farms, the skills of workers, the innovation. You can print more money, shower the economy with paper promises, but Hume argued you can't *truly* create more of that real stuff – more factories, more fertile land, more ingenuity – just by printing. The curtain gets thicker, prices eventually rise to match, and the real wealth behind it? It stays fundamentally the same in the long run. The veil obscures, but doesn't fundamentally alter, what's behind it.

  Now, most economists stop there. They nod sagely, quote Hume, and say "Long-run neutrality! See? Central banking is just about keeping the curtain tidy, preventing rips." But not [Economist's Name]. Oh no. Her sharp eyes always zeroed in on the *next* thing Hume said, the part others sometimes skim over. Because Hume, being honest and observant, admitted something crucial: **in the interval** – that messy, uncertain space *between* printing the money and prices fully catching up – something real *does* happen. Output can surge. Factories hum louder. People get hired. Jobs are created. Real, tangible work gets done. It’s a genuine, if temporary, kick.

  *That* interval. *That* was where [Economist's Name] lived. That was her passion. Because she understood, with profound clarity, that **while the veil might be neutral in the distant future, the lives lived beneath it during that transition are anything but neutral.** People lose jobs *now*. Businesses fail *now*. Dreams stall *now*. And if smart, careful, deliberate action – the kind she dedicated her life to analyzing, advising on, and shaping – could soften the blows during a downturn, or gently nudge potential into reality during that "interval," then that action wasn't just technical fiddling. It was profoundly meaningful. It was the difference between despair and dignity, between stagnation and progress, for real people in real time.

  Her whole case for the worth of central banking, the meticulous, often thankless work she did, wasn't built on the illusion that printing money created perpetual motion machines of wealth. It was built on the fierce, pragmatic conviction that **mastering the dynamics of that "interval" – navigating the short run with wisdom while respecting the long-run truth of the veil – was how you protected people.** How you gave economies breathing room to adjust, to find their real footing again. How you ensured that the unavoidable adjustments dictated by the long run weren't unnecessarily brutal.

  She spent forty years ensuring we understood that long-run neutrality wasn't an excuse for inaction; it was the essential context that made skillful short-run action *so vital*. She corrected us, gently but firmly, when we blurred the lines or forgot the fundamental difference between the nominal and the real. Her legacy isn't measured in units of currency – (raises glass slightly higher, acknowledging the economists with a knowing look) – and certainly *not* by any simplistic multipliers! It's measured in the stability preserved during crises, the recessions potentially shortened, the inflationary spirals avoided, and the countless individuals and businesses who, because of work like hers, weathered storms a little better, found opportunity a little sooner, within that critical "interval."

  So, [Economist's Name], as you lift the veil on this next chapter, we raise our glasses. Not just to the brilliant economist who understood the profound tension Hume described, but to the woman who dedicated her career to the messy, human, and utterly essential work that happens *within* it. You saw through the veil to the real people beneath, and your work made their journey smoother. For your wisdom, your clarity, and your unwavering commitment to making the 'interval' matter, we salute you. To [Economist's Name]!
