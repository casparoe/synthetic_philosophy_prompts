prompt: |-
  Me and my friend Sam got into it after our philosophy reading group last night over whether Frege's sense/reference distinction actually solves his own identity puzzle. Like sure, sense vs reference explains why "Hesperus is Phosphorus" is informative while "Hesperus is Hesperus" is empty, fine. But then I brought up Kripke's Pierre case: the French guy who sincerely believes "Londres est jolie" from hearsay back home, then moves to a grim part of London and learns english purely by immersion, never translating, so he ends up also sincerely believing "London is not pretty," without ever realizing Londres and London are the same city. Sam's take was that this is just a seperate puzzle about belief and rationality that doesn't actually touch Frege's original problem. I think that's a cop out, since "London" and "Londres" don't obviously differ in sense for someone fluent in both languages, so the sense/reference move doesn't really get you out of the informativeness puzzle, it just relocates it. We never settled it. Can you actually build out the case for my side - basically that Kripke's puzzle shows Frege's solution doesn't generalize - instead of giving me some wishy-washy both-sides answer?
