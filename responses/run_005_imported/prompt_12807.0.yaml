  First, I need to recall Frege's original identity puzzle. Frege used "Hesperus is Phosphorus" to show that two names with the same reference can have different senses, making the statement informative. The user accepts this part. But Kripke's Pierre case introduces a bilingual scenario where Pierre learns "London" and "Londres" without connecting them. Pierre holds contradictory beliefs without realizing it's the same city.

