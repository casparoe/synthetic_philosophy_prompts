  Also, Pierre's beliefs are de re and de dicto. His belief about London being pretty is tied to the name "Londres," but when he uses "London," it's a different linguistic token. This highlights that senses aren't sufficient to prevent contradictory beliefs when names are learned in isolation.

  The user might want to emphasize that Frege's model relies on senses being transparent, but Kripke shows that reference-fixing can be opaque. The core issue is that senses don't capture all cognitive aspects, especially in cases of linguistic separation.

  I should also address Sam's point that it's about belief and rationality. While true, Kripke's puzzle directly questions if sense can explain informativeness in all scenarios. If senses were the only factor, Pierre wouldn't have contradictory beliefs if the senses were the same. But he does, showing senses alone aren't adequate.

