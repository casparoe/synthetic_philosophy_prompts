prompt: |-
  I'm a philosophy PhD student finishing a dissertation chapter on Moore's Principia Ethica, and a few weeks ago a reading group I attend (mostly people working on population ethics and effective altruism) spent a session on Eliezer Yudkowsky's "torture vs. dust specks" dilemma: is it worse for one person to be tortured horribly for fifty years, or for an inconceivably large number of people, standardly written 3^^^3 in Knuth's up-arrow notation, each to receive a single, barely noticeable dust speck in the eye, given that on a simple additive hedonic calculus the summed disutility of the specks comes out larger? Most of the group treated this as a contest between "scope-sensitive" consequentialism and squeamish intuition, but it struck me that Moore, of all the classical figures I work on, had the most directly relevant theoretical resources for resisting the aggregative step itself, even though he obviously never considered anything resembling this example.

  I'd like you to reconstruct, as rigorously as you can, how Moore would most plausibly have responded to this dilemma. Please draw specifically on (a) his principle of organic unities and what it implies about assuming that the disvalue of an enormous aggregate of harms is simply the sum of the disvalues of its parts, and (b) his rejection of hedonism in favor of what is often labeled, after Rashdall, his "ideal utilitarianism," on which goods and evils are plural and only partly commensurable rather than reducible to quantities of pleasure and pain. On balance, do these commitments push Moore toward preferring the torture, toward preferring the dust specks, or toward rejecting the dilemma as posed altogether? Please also state the strongest reply a committed aggregative utilitarian could make against the Moorean position you reconstruct, and say whether, on Moore's own principles, he has the resources to meet it.
reasoning: |-
  Okay, let me approach this systematically. The user is a philosophy PhD student working on Moore's Principia Ethica, specifically interested in how Moore would handle Yudkowsky's torture vs. dust specks dilemma. They've identified two key Moorean concepts: organic unities and ideal utilitarianism. 

  First, I need to recall Moore's core objections to aggregative hedonism. His principle of organic unities means that the value of a whole isn't just the sum of its parts - which directly challenges the utilitarian premise that billions of dust specks could outweigh torture. Then there's his pluralism about goods: pain isn't the only evil, so comparing torture (which involves dignity violations) to specks (mere discomfort) might be category error.

  The dilemma pushes utilitarianism to absurdity by exploiting large numbers. Moore would likely reject the aggregative step entirely - not because he denies math, but because moral value doesn't scale linearly. Torture isn't just "more pain"; it's qualitatively different. 

  For the utilitarian counterargument: they'd insist that if we accept any aggregation (e.g., minor pains summing to serious harm), refusing aggregation at scale is arbitrary. But Moore can reply that ethical reasoning requires contextual understanding of wholes - we recognize a broken arm's disvalue holistically, not as 10^6 papercuts. 

  Ultimately, Moore would probably choose torture over specks because torture's evil is organic and irreducible. The specks scenario, while vast, lacks the moral horror of profound injustice. His framework has resources to defend this, though utilitarians will cry inconsistency. The PhD student seems to suspect Moore offers a third way beyond "aggregate or don't", which is correct - it's about rethinking value ontology.
answer: |-
  Based on Moore's core commitments in *Principia Ethica*, here's a rigorous reconstruction of his likely response to the torture vs. dust specks dilemma, incorporating his principle of organic unities and ideal utilitarianism:

  **1. Rejection of the Aggregative Premise via Organic Unities:**  
     Moore's principle of organic unities (Ch. I, §18-22) states that *"the value of a whole bears no regular proportion to the sum of the values of its parts."* Applied to the dilemma:
     - A single dust speck's disvalue is trivial (perhaps even negligible as an "evil" in Moore's sense).
     - An astronomical collection of dust specks (**3↑↑↑3** instances) does **not** constitute an organic unity with aggregate disvalue equal to the sum of individual disvalues. The whole lacks the *emergent property* of profound suffering that defines serious evil.  
     - Conversely, 50 years of torture *is* an organic unity: its disvalue arises from the holistic experience of sustained agony, degradation, and destruction of personal integrity. Its evil isn't reducible to "X units of pain × duration."

  **2. Rejection of Hedonic Reductionism via Ideal Utilitarianism:**  
     Moore's pluralism (Ch. VI) holds that goods/evils are irreducibly diverse. Pain intensity is only one relevant factor; other *sui generis* evils matter:
     - **Torture:** Involves intrinsic evils beyond pain: violation of dignity, destruction of personal projects, and injustice. These are *qualitatively distinct* from physical discomfort.
     - **Dust Specks:** Primarily involve fleeting, minor sensory discomfort. No significant violation of dignity or autonomy occurs.  
     - **Commensurability Problem:** Moore denies all evils are reducible to a common hedonic currency. Torture's disvalue includes incommensurable elements (e.g., moral corruption of the torturer, destruction of a life narrative) that dust specks lack entirely.

  **3. Moore's Likely Verdict:**  
     Moore would **choose the dust specks** – but *not* due to aggregative calculus. His reasoning:
     - Torture is an *intrinsically greater organic evil* due to its complex, dignity-destroying nature. A single instance outweighs any number of trivial annoyances because they belong to different moral categories.
     - The dust specks scenario, while vast, is a *disorganized aggregate* lacking the emergent properties of profound suffering or injustice. No organic unity forms from disconnected minor irritations.
     - Thus: **Torture is worse** because it constitutes a *higher-order evil* that cannot be offset by accumulating lower-order disvalues, regardless of quantity.

  **4. Rejection of the Dilemma's Framing:**  
     Moore would likely dismiss the dilemma as based on false premises:
     - **Misplaced Concreteness:** Treating **3↑↑↑3** as a meaningful quantity in ethics ignores that moral value isn't mathematically scalable. At such scales, the scenario becomes epistemically incoherent, violating Moore's emphasis on introspective access to goods/evils.
     - **Hedonic Fallacy:** Assuming pain/discomfort is the *only* relevant disvalue ignores Moore's pluralism. The dilemma falsely reduces ethics to a single dimension.

  **Strongest Utilitarian Counterargument:**  
  A committed aggregative utilitarian (e.g., a total hedonistic utilitarian) could argue:  
  > *"If you accept that* any *amount of minor pain sums to a serious harm (e.g., 1 billion papercuts > 1 papercut), consistency demands accepting the aggregative premise at large scales. Denying aggregation for **3↑↑↑3** specks but accepting it for smaller numbers is arbitrary. Moore's 'qualitative distinction' is an ad hoc escape hatch to avoid counterintuitive conclusions."*

  **Moorean Reply to the Counterargument:**  
  Moore *can* meet this challenge on his own terms:  
  1. **Contextual Holism:** Smaller aggregations (e.g., chronic pain from many minor injuries) *can* form organic unities with emergent disvalue (e.g., persistent distress, disability). At **3↑↑↑3**, no such unity emerges – it remains a statistical abstraction lacking psychological or moral coherence.  
  2. **Threshold Effects:** Moore can argue that evils exist on discontinuous scales. Torture surpasses a *threshold* where qualitatively new evils (e.g., annihilation of agency) appear, making it incommensurable with sub-threshold disvalues like dust specks.  
  3. **Epistemic Limitation:** For Moore, we grasp intrinsic value via intuition. The disvalue of **3↑↑↑3** specks is *literally inconceivable*, whereas torture's evil is directly apprehensible. Moral reasoning cannot operate with incoherent inputs.  

  **Conclusion:**  
  Moore would reject the dilemma's aggregative logic, deem torture intrinsically worse due to its organic and plural evils, and likely view the dust specks option as preferable *only* because it avoids creating the qualitatively worse evil. His framework doesn't fully align with either standard consequentialist response, instead dissolving the dilemma by challenging its reductionist axiology. While the utilitarian counterargument presses on consistency, Moore's emphasis on emergent properties, qualitative thresholds, and epistemic constraints provides a principled (if controversial) defense against it. His resources are strongest for rejecting aggregation at inhuman scales, not for resolving the dilemma on its own terms.
