  3. Meg: Good critique of anthropocentrism; UAL is plausible. Score 2.
  4. Dave: Necessary point about architectural constraints. Score 2.
  5. Meg: Morally relevant but shifts debate; doesn't resolve science. Score 0.
  6. Dave: Correct on needing evidence thresholds. Score 2.

