        "verdict": "correct",
        "explanation": "The student accurately describes Wright's account: functions are selected effects from evolutionary history."
      },
      {
        "claim": "Cummins' causal-role account defines function as a current causal contribution to a system's capacity, without evolutionary history.",
        "verdict": "correct",
        "explanation": "The student correctly identifies Cummins' focus on current causal roles in a system, independent of history."
      },
      {
        "claim": "Cummins built his account specifically for biological traits and it was later adopted by philosophers of mind.",
        "verdict": "partially correct",
        "explanation": "Cummins' account was designed as a general theory of function (not exclusively biological), though it applies to biology. It was indeed adopted in philosophy of mind, so this is partially right but overemphasizes biology."
      },
      {
        "claim": "Diaphragm example for Wright: Function is rhythmic contraction due to ancestral selection for breathing.",
        "verdict": "correct",
        "explanation": "The example properly illustrates Wright's historical/selection-based view."
      },
      {
        "claim": "Diaphragm example for Cummins: Function is current contribution to respiration, regardless of history.",
        "verdict": "correct",
        "explanation": "The example correctly shows Cummins' ahistorical, systems-based approach."
      },
      {
        "claim": "Cummins' account handles malfunction more easily than Wright's because it focuses on current performance.",
        "verdict": "incorrect",
        "explanation": "This reverses the standard view. Cummins' account lacks a normative standard for what a trait *should* do, making malfunction harder to define. Wright's selected-effect norm (e.g., 'hearts *should* pump blood because they were selected for it') cleanly explains malfunction."
      },
      {
        "claim": "Wright's account struggles with malfunction due to reliance on unobservable evolutionary history.",
        "verdict": "partially correct",
        "explanation": "While unobservable history poses practical challenges, Wright's account *theoretically* explains malfunction well (failure to perform the selected function). The core issue is misattributed; Cummins has deeper *theoretical* trouble defining norms."
      }
    ],
    "grade": 6,
    "total_points": 10
  }
  ```

  ### Explanation of the Grade (6/10)
  - **Part 1 (Differences + Example): 5/6 points**  
    The student nailed the core definitions of both accounts (Wright: 2/2, Cummins: 2/2) and gave accurate examples (1/1). The claim about Cummins targeting biology was partially oversimplified (–0.5), but the overall contrast was clear.
    
  - **Part 2 (Malfunction): 1/4 points**  
    The student incorrectly claimed Cummins handles malfunction better and that Wright struggles due to history. While the unobservability of history is a *practical* limitation for Wright (–1), it doesn’t negate his account’s *theoretical* strength for defining malfunction. Cummins' lack of norms is the deeper problem, which the student missed (–3). Partial credit for identifying a challenge (even if misapplied).

  ### Key Philosophy Note for Your Partner
  The malfunction issue hinges on **normativity**:  
  - Wright’s account provides a natural norm (selected effect = what the trait *should* do).  
  - Cummins’ account only describes *what a trait does* in a system, not what it *ought* to do. If a heart clots blood instead of pumping it, Cummins can note the change but can’t inherently call it "malfunction" without smuggling in norms from elsewhere (e.g., etiological or design-based views). This is why Cummins’ account is widely seen as weaker on malfunction.  

  You can share this breakdown with your partner—it’s aligned with standard philosophy of biology critiques (e.g., Neander, Millikan). Good luck grading! 😊
