answer: |-
  This is a compelling scene with rich thematic potential—you've captured both sisters' voices and the tension between psychological explanation and moral accountability. Let's break down your questions:

  ### 1. **Marion's Argument: Fair or Caricature?**
     - **Overall**: Her summary is *mostly* fair to the situationist position, but edges toward overstatement in ways Iris could credibly pounce on.
     - **Strengths**: 
       - She correctly cites core studies (Milgram, Zimbardo, Good Samaritan, Isen/Levin, Mischel).
       - The "weather, not character" metaphor effectively distills Doris/Harman.
       - Highlighting the seminarian study's "hurry" variable is spot-on.
     - **Weaknesses Iris Might Target**:
       - **Harman's Scope**: Marion implies Harman dismisses *all* character traits. In reality, Harman attacks "robust" character traits (e.g., "courageous everywhere"), not local ones ("classroom-defender"). Iris could note this.
       - **Correlation Oversimplification**: The ".3 correlation" (Mischel) is often misused. It’s an *average*—some traits/situations show higher stability (e.g., conscientiousness in structured environments). Marion presents it as a universal ceiling.
       - **Doris’s Nuance**: Doris (*Lack of Character*, 2002) concedes "local traits" (e.g., "office-brave but party-shy") can exist. Marion’s "inconsistency runs all the way down" ignores this.

     → **Fix**: Tweak Marion’s last line: *"...something on the order of a .3 correlation, which means in most situations, character might as well be noise."* (Keeps her pessimism but avoids absolute denial of local consistency.)

  ### 2. **Iris's Reply: Strong Enough?**
     - **Current Strengths**: 
       - She correctly notes Doris targets *globalist* traits.
       - Invoking Kamtekar (2004) on *phronesis* is astute—it reframes virtue as perception, not reflex.
       - Annas’s "amateur" analogy is elegant and accessible.
     - **Stronger Rebuttals Available**:
       - **Methodological Critiques**: Iris could shred the studies’ ecological validity:  
         *"Those seminarians weren’t ‘themselves’—they were stressed grad students role-playing for a professor. Zimbardo’s guards knew they were in a performance. Real virtue isn’t tested in labs; it’s built in relationships, over time."*  
         (Draws on Kristjánsson’s critique that experiments isolate "snapshots," ignoring moral development.)
       - **Socially Embedded Virtue**: This is narratively potent—it implicates Marion’s isolation. Iris could say:  
         *"Aristotle’s virtues aren’t solitary achievements. They’re sustained by *practices*—communal habits that shape perception. You didn’t just fail to act; you’ve spent years avoiding the staff-room alliances that make intervention possible."*  
         (Uses Alasdair MacIntyre/Julia Annas on virtue-as-practice.)
       - **Situationism’s Self-Defeat**: *"If situations control us, why do you feel guilty? Your regret proves you expected better of yourself—and that expectation is character."*  
         (Adapts Sabini & Silver’s 2005 critique: guilt implies a stable self-conception.)

     → **Recommendation**: Weave in the social-embeddedness argument. It’s thematically richer (ties to Marion’s isolation) and avoids dry Aristotelian exegesis.

  ### 3. **Does It Feel "Metabolized"?**
     - **Almost—but needs subtle tweaks**:
       - **Strengths**: 
         - Marion’s "here’s the detail I can’t get past" feels personal. 
         - Iris’s "don’t ask whether... ask whether..." shifts focus deftly.
         - The "amateurs at an instrument" analogy is organic.
       - **Weaknesses**:
         - **Jargon Overload**: "Globalist traits," "phronesis," "fundamental attribution error" in quick succession feels lecture-y. *Solution*: Make Iris rephrase Kamtekar: *"Aristotle isn’t shocked beginners crack under pressure. He cares whether a trained musician hears the discord—and you were trained to see injustice."*
         - **Emotional Subtext Missing**: Marion should sound defensive (not academic); Iris frustrated but caring. *Add*: Marion fumbling with her wineglass; Iris pausing to soften her tone.
         - **"Encyclopedia" Smell**: They cite *too many* thinkers (Harman, Doris, Milgram, Zimbardo, Isen/Levin, Mischel, Kamtekar, Annas) in 2 paragraphs. *Solution*: Cut 1-2 references. Let Marion focus on the seminarian study (it haunts her); Iris on Kamtekar/Annas.

  ### Suggested Rewrite (Key Excerpts):
  **Marion**:  
  *"It’s not just inconsistency—it’s that everything depends on the weather. Take those seminarians: in a hurry, only one in ten helped a dying man. When they weren’t rushed? Most did. And these were people literally en route to preach about the Good Samaritan! Doris shows it’s everywhere: Milgram’s subjects, Zimbardo’s guards... even finding a dime in a phone booth made strangers kinder. Mischel proved ages ago that who we ‘are’ barely predicts what we do. A .3 correlation. So when I froze in that staff room... maybe that’s just the weather winning."*  
  *(More personal, fewer names, focuses on her trauma)*  

  **Iris**:  
  *"You’re using lab failures to excuse real-world cowardice. Those studies test snap reactions in artificial chaos—not the habits we build over years. Kamtekar’s right: virtue isn’t about always rushing in. It’s about seeing when to rush. That man in the doorway? The seminarians running late didn’t see a person—they saw an obstacle. And you didn’t see a colleague being broken; you saw social suicide. But here’s what your situationism misses: we don’t cultivate courage alone. We do it in communities that practice looking out for each other. You’ve spent years avoiding those alliances. That’s why you froze—not because character is a myth, but because you stopped tending yours."*  
  *(Connects to Marion’s life, emphasizes social practice, sharper emotional thrust)*  

  ### Final Thoughts:
  - **Philosophy**: Solid foundation. Iris needs the "social practice" angle to land the moral punch.
  - **Character**: Marion’s argument should feel like a shield; Iris’s reply should threaten to shatter it.
  - **Narrative**: This scene isn’t about "winning" a debate—it’s about Marion confronting the gap between her self-image and her actions. Iris’s best line should force Marion to ask: *"Do I want to be someone who excuses collapse—or builds resilience?"*

  This exchange already has depth—trust your instincts. With minor tweaks, it’ll resonate as both intellectually rigorous and painfully human.
