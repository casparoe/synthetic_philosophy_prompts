  We are ranking eight strategies for dealing with the Gibbard-Satterthwaite theorem. The goal is to assess how genuinely each resolves the tension between strategy-proofness (non-manipulability) and non-dictatorship, as opposed to redefining the problem.

  The Gibbard-Satterthwaite theorem states that for a social choice function with at least three outcomes and defined on the universal domain of strict preferences, it must be either manipulable or dictatorial.

  The strategies:

  1. Restrict preferences to a single-peaked domain (median-voter schemes)
     - This restricts the domain of preferences, so that the median voter theorem applies. It achieves strategy-proofness and non-dictatorship in that restricted domain.

  2. Replace dominant-strategy incentive compatibility with Bayesian (interim) incentive compatibility
     - This weakens the incentive requirement from dominant-strategy to Bayesian (i.e., truth-telling is optimal in expectation given prior beliefs). It doesn't require strategy-proofness in every situation, but only in expectation.

  3. Introduce quasi-linear utility and monetary transfers (VCG/Groves mechanisms)
     - This changes the setting by allowing transfers (money) and assuming quasi-linear utilities. VCG mechanisms are strategy-proof and efficient, but they require transfers and might not be budget-balanced.

  4. Randomize over outcomes (e.g., random dictatorship)
     - Random dictatorship is strategy-proof (in the sense that truth-telling is dominant for the lottery) and non-dictatorial (everyone has an equal chance to be dictator). However, the outcome is random.

  5. Restrict the outcome set to two alternatives (May's theorem)
     - With only two alternatives, majority rule is strategy-proof and non-dictatorial. But this avoids the problem by reducing the number of alternatives to two.

  6. Allow set-valued outcomes, i.e., social choice correspondences rather than single-valued functions
     - Instead of choosing a single outcome, we choose a set. This might allow for non-manipulable correspondences (e.g., using the core), but the problem is then shifted to selecting from the set.

  7. Tolerate manipulability in principle, but rely on its computational intractability in practice
     - The mechanism might be manipulable, but if computing a profitable manipulation is hard, then agents might not manipulate. This doesn't remove manipulability, just hopes it won't be exploited.

  8. Simply accept a dictator
     - This gives up on non-dictatorship.

