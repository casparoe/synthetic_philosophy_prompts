answer: |-
  You've hit on a crucial distinction often glossed over in popular summaries. Your intuition is spot-on: **the "White Horse" and "Hard and White" arguments are fundamentally different maneuvers tackling distinct philosophical problems.** Lumping them together as "sophistry" misses their unique contributions and the different "argumentative engines" at work. Let's break them down side-by-side:

  **1. The White Horse Argument (Baima Lun)**

  *   **Core Claim:** "A white horse is not a horse" (Bai ma fei ma).
  *   **Argumentative Engine: Semantics, Reference, and Category Inclusion.**
      *   **Premise 1:** Words ("names") refer to specific concepts or attributes. "Horse" (馬, *ma*) names the *form* or *category* (形, *xing*). "White" (白, *bai*) names the *color* (色, *se*).
      *   **Premise 2:** The concept referred to by "horse" (the form/category) is distinct from the concept referred to by "white" (the color).
      *   **Premise 3:** The compound term "white horse" names a *specific instance* within the broader category "horse," defined by the *combination* of form *and* color.
      *   **Premise 4:** The scope of reference differs. "Horse" refers to *all* horses (yellow, black, etc.). "White horse" refers *only* to horses that are white.
      *   **Conclusion:** Therefore, "white horse" cannot be identical to "horse" because:
          *   The meaning of "white horse" (form + specific color) is not identical to the meaning of "horse" (form alone).
          *   The reference of "white horse" (only white horses) is not coextensive with the reference of "horse" (all horses). "Horse" includes yellow horses; "white horse" excludes them.
  *   **What it's *Really* Doing:** It's a sophisticated argument about **language, reference, and the logic of categories.** It challenges the assumption that adding an attribute modifier ("white") to a general term ("horse") doesn't change the *essential reference* of the term. Gongsun Long argues it *does* create a new, more specific concept with a different extension. It highlights how language carves up reality and the potential for slippage between general terms and modified instances.
  *   **Is it Sophistry?** It's deliberately counter-intuitive to provoke thought, but it's not *mere* wordplay. It makes a valid logical point about set inclusion: the set of white horses is a *subset* of the set of horses; a subset is not identical to the whole set. Calling it "not a horse" is rhetorically provocative shorthand for this non-identity of reference and meaning.
  *   **Holds Up Today?** **Partially, as a significant contribution to philosophy of language/logic.** It anticipates core debates about:
      *   **Sense and Reference (Frege):** The distinction between the concept ("horse" vs. "white horse") and the objects they pick out (all horses vs. only white ones).
      *   **Intension and Extension:** The meaning ("intension") of "horse" (equine form) vs. "white horse" (equine form + white color), and the differing sets of objects they apply to ("extension").
      *   **The Logic of Modifiers:** How adjectives change the meaning and reference of nouns.
      *   **Category Mistakes:** Highlighting potential confusion between levels of abstraction (category vs. specific instance within it).
      *   **Limitation:** Its conclusion phrased as "is not a horse" is easily misunderstood as denying the white horse is *a member of* the horse category, which it doesn't logically do. It denies *identity*, not *membership*. Its lasting power is in *highlighting the problem*, not in the literal truth of its provocative statement.

  **2. The Discourse on Hard and White (Jian Bai Lun)**

  *   **Core Claim:** "Hard, White, Stone: Two" (堅白石二, *jian bai shi er*) - meaning the hardness and whiteness are two separate existents, distinct from each other *and* from the stone itself as a unified object.
  *   **Argumentative Engine: Epistemology of Perception Sliding into Metaphysics of Properties.**
      *   **Premise 1 (Epistemological):** Sensory modalities are distinct and mutually exclusive *in a single moment of perception*. Sight perceives color (whiteness) but not hardness. Touch perceives hardness but not color. You cannot *simultaneously* perceive hardness *with your eyes* or whiteness *with your fingers*.
      *   **Premise 2 (From Epistemology to Metaphysics):** Since hardness and whiteness are never apprehended *together by a single sense organ* in the same act, they must be fundamentally distinct existences. Your eye only ever "grasps" whiteness; your hand only ever "grasps" hardness.
      *   **Premise 3 (The "Self-Hiding" - Zicang):** When a property is not being perceived by its appropriate sense organ (e.g., hardness when you're only looking, whiteness when you're only touching), it doesn't cease to exist; it "hides itself" (自藏, *zicang*). It exists independently, waiting to be perceived again.
      *   **Conclusion:** Therefore, the stone as a unified object possessing both hardness and whiteness simultaneously is an illusion of common sense. Hardness and whiteness are two separate, independent properties ("hard-white-stone-two"). The unity of the object dissolves under perceptual scrutiny.
  *   **What it's *Really* Doing:** It's an argument primarily about **the nature of perception and the ontological status of properties.** It starts with the limitations of human senses and argues that these limitations reveal a deeper metaphysical truth: properties are not inherently bound together in objects; they are independent entities ("universals" or "tropes" in Western terms) that merely coincide. The "stone" as a unified substance is undermined.
  *   **Is it Sophistry?** It's not *merely* verbal trickery. It starts from a genuine observation about perception (Premise 1) and pushes it to a radical metaphysical conclusion. The trick lies in the questionable leap from "not perceived together *by the senses*" to "not existing together *in the object*" and then to "existing independently and self-hiding."
  *   **Holds Up Today?** **The starting point is insightful, but the conclusion is highly contentious and generally rejected:**
      *   **Insightful Epistemology:** Premise 1 is empirically sound and remains a crucial point in philosophy of perception and cognitive science. Our senses *are* modality-specific. This is foundational to understanding qualia and the binding problem (how the brain integrates different sensory inputs into a unified object).
      *   **Problematic Metaphysical Leap:** The jump from sensory separation to ontological separation is a *non sequitur*. Modern science and philosophy overwhelmingly support the view that properties inhere in objects/substances, even when not perceived. A rock's hardness *is* its molecular structure; its whiteness *is* its surface reflectance. These are states *of the rock*, not free-floating entities that hide. "Self-hiding" is a poetic but scientifically and metaphysically dubious concept.
      *   **The Binding Problem Reversed:** Gongsun Long uses the separation of senses to *dissolve* the object. Modern cognitive science studies how the brain *overcomes* this separation to *create* the perception of a unified object, suggesting the unity exists at the neural level even if not at the raw sensory input level. The problem is synthesis, not dissolution.
      *   **Legacy:** Its enduring value lies in its **radical challenge to naive realism** and its exploration of the gap between perception and reality. It forces us to question how we know an object's properties cohere. It prefigures debates about phenomenology (how things appear) vs. ontology (how things are), and the nature of universals/particulars. However, its specific metaphysical conclusion about independent, self-hiding properties is not considered viable.

  **Your Key Questions Answered:**

  1.  **Real Distinction? Absolutely.** You are not imposing a false Western framework.
      *   **White Horse:** Primarily **Semantics/Logic of Language** (Meaning, reference, categories, modifiers).
      *   **Hard and White:** Primarily **Epistemology of Perception** sliding into **Metaphysics of Properties/Objects** (Sensory modalities, the nature of qualities, the unity of objects).
  2.  **Which Holds Up as Serious Philosophy Today?**
      *   **The White Horse Argument** holds up **better** in its core insight about language and categories. While its conclusion is provocatively phrased, the underlying point about sense, reference, intension, extension, and the logic of modifiers is foundational to modern philosophy of language and logic. It remains a valuable thought experiment.
      *   **The Hard and White Argument** has **significant enduring value in its starting point** (the modality-specific nature of perception) which is crucial to epistemology and cognitive science. **However, its radical metaphysical conclusion (independent, self-hiding properties) does not hold up** as a viable description of reality against modern scientific understanding and mainstream metaphysics. Its power lies in its challenge to perceptual assumptions, not in its proposed solution.

  **In essence:** The "White Horse" is a puzzle about *how words hook onto the world*. The "Hard and White" is a puzzle about *how the world appears to our senses and what that implies about what the world really is*. They are distinct maneuvers, both philosophically provocative, but only the linguistic core of the first, and the epistemological starting point of the second, retain broad philosophical traction today. Gongsun Long wasn't just a "sophist"; he was a sharp, early explorer of deep problems in language and perception that still resonate. Your close reading uncovered the real difference – well done!
