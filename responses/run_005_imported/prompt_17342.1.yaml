    },
    "3": {
      "score": 1.5,
      "justification": "Diane correctly defends internalism's robustness: we can condemn the brother as 'selfish' or 'bad son' based on *societal/ethical standards*, not invented internal reasons (+). She rightly distinguishes evaluation of character from existence of reasons (+). Minor deduction for not addressing how 'bad son' implies external expectations."
    },
    "4": {
      "score": -1,
      "justification": "Elena conflates blameworthiness with the *existence* of reasons (-). Internalists can blame based on *external* moral standards without granting the agent had subjective reasons. Her 'sound deliberation' point is valid (+), but she overstates it: Williams requires *actual* motivational elements to engage with deliberation. She can't assume reflection would necessarily surface *filial* concern."
