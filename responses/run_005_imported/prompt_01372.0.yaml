  hey, random one from my diss reading. I'm doing a phil-of-science chapter that touches on Neurath and got stuck on a bit from his 1936 book "International Picture Language" (the one laying out the rules for Isotype). Fun fact: the whole book is written in Basic English (Ogden's stripped-down 850-word version of English) as a kind of demo of the system, which makes the prose sound simple but is weirdly hard to actually parse. Here's the bit, sorry its a bit long but i think you need the whole thing:

  "But the uses of a picture language are much more limited than those of normal languages. It has no qualities for the purpose of exchanging views, of giving signs of feeling, orders, etc. It is not in competition with the normal languages; it is a help inside its narrow limits. But in the same way as Basic English is an education in clear thought—because the use of statements without sense is forced upon us less by Basic than by the normal languages, which are full of words without sense (for science)—so the picture language is an education in clear thought—by reason of its limits."

  The surface claim is clear enough: isotype can't do feelings/opinions/orders, only word-language can. What I can't get straight is the move right after — he says THIS lack is exactly why it counts as "an education in clear thought," on analogy with how Basic's tiny vocab supposedly stops people talking nonsense. That feels backwards to me? shouldn't being less expressive just make a language less useful, rather than turn it into a better teacher of clear thinking? Is there an actual argument buried here that connects to the vienna circle's whole meaningless-metaphysics thing, or is he just dressing up a design rationale for his charts as epistemology? Can you help me reconstruct the strongest version of whatever's actually being gestured at?
