answer: |-
  Here’s a dialogue between **Dr. Aris Thorne** (zero pure time preference advocate) and **Dr. Lena Voss** (pragmatic discounting advocate), locked in a conference room at 2 AM, surrounded by whiteboards covered in equations and half-empty coffee cups. Both are exhausted but sharp, forcing each other to engage deeply with the core tensions:

  ---

  **Aris Thorne:** (Rubbing temples) Lena, we’ve been at this for six hours. The ethical line is clear: pure time preference is temporal discrimination. Full stop. Stern was right—discounting someone’s welfare *solely* because they’re born later is no different than discounting them for being born farther away. We can’t build intergenerational justice on that.

  **Lena Voss:** (Leaning against the whiteboard) Aris, I agree it *feels* unjust. But policy isn’t built on feels. Set δ (pure time preference) to zero in a standard Ramsey model with infinite horizons, and the integral diverges. Poof. No policy comparison. You can’t optimize for a sum that explodes to infinity. That’s not bias—it’s arithmetic.

  **Thorne:** (Tapping the board) **That’s the overtaking criterion.** Koopmans laid it out decades ago. We don’t need the infinite sum to converge. We say Path A is better than Path B if, for *some finite time T*, the cumulative welfare up to T is always greater for A beyond that point. It’s rigorous. It avoids the divergence trap without imposing δ > 0.

  **Voss:** (Sighs) Rigorous? Theoretically, yes. Practically? It’s a nightmare. How do you *operationalize* "overtaking" for real-world cost-benefit analysis? Climate damages in 2200 vs. abatement costs today? The criterion gives no clear shadow price, no marginal value. Governments need numbers, Aris. Not asymptotic hand-waving.

  **Thorne:** So we sacrifice ethics for computational convenience? That’s the tail wagging the dog. Besides, you’re conflating discounting *wellbeing* (η) with discounting *consumption* (ρ). Ramsey’s δ is about wellbeing—utility itself. We can set δ=0 for wellbeing but still discount *consumption* because future generations will likely be richer (η > 0). That’s not temporal bias—it’s accounting for diminishing marginal utility of wealth.

  **Voss:** (Pacing) Fine, let’s disentangle them. Assume δ=0 for wellbeing. But even then, η alone doesn’t save you from divergence if growth is positive. And crucially: **existential risk.** You can’t pretend the far future is certain. A 1% annual chance of human extinction means there’s only a 37% chance we survive 100 years. That’s not "smuggling bias"—it’s basic probability. Discounting for *risk* is fundamentally different from pure time preference.

  **Thorne:** (Leaning forward) Ah, but *how* do you model that risk? Nordhaus-style models bake it into δ as a "hazard rate," blurring the line between genuine risk and pure impatience. If you want to discount for extinction risk, do it explicitly in the *damage function*, not by inflating δ. Otherwise, you’re still sneaking in "these people might not matter because they might not exist" instead of "their existence is uncertain, so we weight it fairly."

  **Voss:** Fair point. Explicit catastrophic risk modules are better. But even with δ=0 and explicit risk, you face another wall: **the tyranny of the present.** Near-term costs dominate so massively under zero discounting that it demands unprecedented sacrifice *now* for uncertain gains in 2300. Is that politically feasible? Or even desirable, if near-term suffering means losing the capacity to act long-term?

  **Thorne:** (Quietly) That’s the hardest question. But answering it by *devaluing* future lives feels... corrosive. If a policy saves 10 million lives in 2300 at modest cost today, zero δ says "do it." A positive δ says "those lives are worth less, so maybe not." That math enables moral abdication. The overtaking criterion at least forces us to ask *when* benefits outweigh costs, without writing off the future.

  **Voss:** (Sits down, weary) And what if the benefits *never* overtake? Infinite horizons are unforgiving. Look—I want to value the future too. But insisting on δ=0 ignores how humans *actually* value time, markets price assets, and democracies make trade-offs. We discount. Not out of malice, but because agency diminishes over distance, resources are scarce now, and yes... we’re imperfectly patient. A tiny δ > 0 (say, 0.1%) isn’t a death sentence for the future; it’s recognition of finitude.

  **Thorne:** But that "recognition" is precisely the bias! We don’t accept "humans are racist" as justification for discriminatory pricing. Why accept "humans are impatient" for intergenerational theft? The overtaking criterion *is* clunky, and existential risk *must* be modeled carefully. But if we start with δ > 0, we bake in the conclusion that the future is worth less. That’s not a technical fix—it’s an ethical surrender.

  **Voss:** And if we start with δ=0, we risk building castles in the sky while the foundation floods. Maybe… the answer isn’t "δ=0 always" or "δ=0.03 forever." Maybe it’s a declining schedule. High implicit δ for the first 50 years (reflecting uncertainty, political constraints), falling towards zero after 200 years when the climate signal is clearer. A bridge between the math and the morality.

  **Thorne:** (Stares at the equations) A declining pure rate? That still accepts the principle of discounting wellbeing by birth date… just more politely. But… it might be the least unjust compromise. For this white paper? We note the overtaking criterion, demand explicit catastrophic risk modules, use η > 0 for consumption growth… and set δ to 0.1%, with a footnote that it’s ethically contentious but mathematically pragmatic.

  **Voss:** And we footnote *your* dissent. Loudly. Because you’re right—it feels like surrender. But until we have a theory of intergenerational justice that doesn’t require infinite sums... this might be the bridge we walk.

  **Thorne:** (Nods grimly) We build the bridge. But we hang a sign: "Cross here at your descendants’ peril."

  ---

  **Key Engagements:**  
  1. **Convergence/Overtaking:** Voss concedes overtaking *works* but challenges its practicality; Thorne admits it’s clunky but insists δ>0 is unethical.  
  2. **Risk vs. Time Preference:** Thorne forces Voss to decouple existential risk from δ, demanding explicit modeling; Voss counters that risk fundamentally alters valuation.  
  3. **Wellbeing (η) vs. Consumption (ρ):** Both agree η>0 (for richer futures) is defensible, keeping the fight focused on δ—discounting utility itself.  
  4. **No Strawmen:** Voss acknowledges the ethical weight of δ=0; Thorne admits the real-world constraints of infinite horizons and political will.  

  This captures the grinding, nuanced tension between ethical rigor and operational reality—where both sides walk away bloodied but wiser.
