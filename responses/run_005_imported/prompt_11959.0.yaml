answer: |-
  ### Analysis of the Argument: Pluto's Planetary Status and the Verbal vs. Substantive Dispute

  The dispute between Renata (orbital dynamicist) and Dev (planetary geologist) centers on whether Pluto's reclassification is a substantive disagreement about the nature of planetary science or a merely verbal dispute about the definition of "planet." I'll break down each move, drawing on philosophical frameworks from Eli Hirsch, David Chalmers, Karen Bennett, and others, to assess who has the stronger case. Hirsch emphasizes that a dispute is verbal when parties agree on non-linguistic facts but disagree due to semantic differences, while Chalmers adds that verbal disputes dissolve when meanings are precisified. Bennett's "unhappy-faced" verdict applies when a dispute is neither purely verbal nor straightforwardly substantive because it involves equally legitimate but incompatible ways of "carving reality."

  #### Move (1): Renata's Opening Argument
  - **Renata's claim**: The IAU's 2006 definition (requiring a body to "clear its orbital neighborhood") is not arbitrary; it reflects a dynamically real property (orbital dominance) that predicts formation history and orbital stability. This is a fact about Pluto, not a preference.
  - **Strength**: Renata has a strong case here. She appeals to a natural kind—orbital dominance—that is "joint-carving" (i.e., it corresponds to a real structure in the world, as per Ted Sider's metaphysical framework). Orbital dominance explains why Pluto differs dynamically from the eight planets: it arose in a crowded Kuiper Belt, leading to instability and a different formation path. Philosophers of science (e.g., Quine) would endorse definitions that support lawlike generalizations, and Renata shows that "clearing the neighborhood" does this for solar system dynamics. This moves beyond semantics to a substantive feature of reality.
  - **Verdict**: Renata's case is stronger. She establishes that the IAU criterion is not merely lexical but tracks a causal-explanatory property.

  #### Move (2): Dev's Response
  - **Dev's claim**: "Cleared its neighborhood" is not intrinsic to Pluto but relational (dependent on its environment). Intrinsic properties like roundness, geology, and atmosphere are what historically defined "planets" and do "explanatory work." Once these facts are agreed upon, the dispute reduces to where we draw the word-boundary for "planet," making it verbal (like debating if a hot tub is a "pool").
  - **Strength**: Dev effectively frames this as a verbal dispute using Hirsch's criteria: both sides agree on non-linguistic facts (Pluto is round, geologically active, and orbitally un-dominant), so the disagreement hinges on semantic preferences. He also invokes Chalmers' idea that disputes are verbal when they persist due to ambiguous or underspecified meanings. By emphasizing intrinsic properties, Dev highlights a different natural kind (geophysical "planethood") that is equally real and explanatory for geological phenomena (e.g., internal heat driving activity). This weakens Renata's claim that orbital dominance is uniquely "factual."
  - **Verdict**: Dev's case is stronger here. He successfully argues that the core disagreement is about word usage, not reality, by showing both criteria are grounded in facts but serve different explanatory contexts.

  #### Move (3): Renata's Rebuttal
  - **Renata's claim**: Not all predicates are equal; orbital dominance supports broader generalizations about formation and stability that roundness cannot, making the choice between them substantive.
  - **Strength**: Renata partially blocks Dev's "merely verbal" diagnosis by invoking explanatory depth. She argues that orbital dominance is more fundamental to solar system architecture: it predicts long-term orbital stability (e.g., Pluto's orbit crosses Neptune's, risking destabilization) and formation pathways (e.g., dominant bodies accrete faster in cleared zones). Philosophers like Kitcher would call this a "natural kind" with greater unifying power across astronomy. If orbital dominance explains phenomena that roundness cannot (e.g., why the asteroid belt lacks "planets"), then privileging it is a substantive theoretical choice, not just semantics.
  - **Weakness**: Renata overstates her case by implying orbital dominance is universally superior. Dev could counter that roundness explains equally vital phenomena (e.g., habitability potential) in different domains. As such, she doesn't fully refute Dev's pluralism.
  - **Verdict**: Renata has the stronger case for this move. She shows that definitions can be evaluated based on explanatory utility, making the dispute partly substantive. However, she doesn't prove orbital dominance is objectively "better," leaving room for Dev's counter.

  #### Move (4): Dev's Final Counter
  - **Dev's claim**: Roundness supports real generalizations (e.g., predicting differentiation and atmospheres), so both criteria are equally "joint-carving." With no fact of the matter about which property "deserves" the word "planet," the dispute reverts to verbal.
  - **Strength**: Dev successfully reinstates the verbal diagnosis. By arguing that both properties are epistemically on par (both track real patterns: dynamics for system-wide behavior, geophysics for body-level features), he invokes Bennett's "unhappy-faced" insight: when two candidate meanings are equally natural, the choice is conventional. Chalmers' "bedrock" test applies: if fixing the meaning of "planet" to either criterion resolves the dispute without factual disagreement, it's verbal. Dev also highlights disciplinary context—geologists care about roundness for activity, dynamicists about orbits—supporting a Carnapian view that frameworks can be pragmatically chosen.
  - **Verdict**: Dev's case is stronger. He shows that neither criterion is privileged, reducing the dispute to semantics. Renata's move (3) is blocked because she fails to demonstrate orbital dominance's superiority across all contexts.

  ### Overall Philosophical Assessment
  - **Verbal elements**: Both agree on Pluto's non-linguistic properties (round, geologically active, orbitally un-dominant). Per Hirsch, the residual disagreement stems from divergent semantic preferences for "planet." Chalmers' "verbal dispute" test is passed: specifying "planetD" (dynamic) or "planetG" (geophysical) resolves the conflict.
  - **Substantive elements**: Renata correctly argues that criteria choices reflect deeper theoretical values (e.g., explanatory scope), making this not purely verbal. As Bennett notes, such disputes can be "unhappy-faced"—neither side is wrong, but the disagreement reflects a lack of shared priorities. Here, Renata prioritizes system-level dynamics, Dev prioritizes body-level geology. This is substantive in the sense that it involves competing scientific virtues (unification vs. specialization), but not in the sense of a discoverable "fact" about Pluto.
  - **Unhappy-faced verdict**: Bennett's framework applies best. Both criteria are natural kinds that "carve reality at its joints" for different purposes. The dispute is unresolved at a deeper level because it exposes a meta-disagreement about which scientific perspective (dynamics vs. geology) should dominate taxonomy. This isn't merely verbal (since the choice affects research and classification), nor is it straightforwardly substantive (since neither criterion is objectively "correct"). Instead, it reflects a pragmatic, context-dependent decision about language and theory.

  ### Final Verdict
  The dispute is primarily verbal, as it hinges on how to define "planet" given agreed-upon facts. However, Dev's move (4) reveals an unhappy-faced dimension: the choice between criteria involves substantive but equally valid scientific values. Ultimately, Pluto's status is a matter of convention, not discovery.

  \verdict{verbal}
