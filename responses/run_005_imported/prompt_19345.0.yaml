answer: |-
  The air in the private dining room hummed with expensive wine and the low thrum of accumulated wealth. Priya Chakrabarti, sleek in tailored silk, swirled her Barolo, her gaze coolly assessing the man opposite. Dana Vance, her dark hair pulled back severely, traced the rim of her mineral water glass, radiating a contained intensity. Marcus Thorne, their mutual friend and host, leaned back, a vulpine grin playing on his lips. The remnants of a decadent meal lay scattered before them.

  "Ladies," Marcus purred, refilling Priya's glass, "this has been delightful. But frankly, predictable. Priya’s fund outperformed the market again, Dana’s ‘Geometric Edge’ returned a steady twenty percent with volatility lower than my grandmother’s blood pressure. Admirable. Boring." He snapped his fingers. A server materialized with a polished wooden box. Inside, nestled in velvet, lay a heavy, unmistakably fair coin. "Let’s inject some… philosophy."

  He outlined the game: infinite fair coin flips. Before each flip, they decide what fraction *f* of their *current* wealth to risk. Heads: the risked amount grows by 60%. Tails: it shrinks by 50%. The pot starts at $1000 for each of them. Marcus would back both, tonight only, based on their stated strategy.

  Priya arched an eyebrow. "Marcus, darling, it’s arithmetic expectation. Each flip, betting *f*, the expected change in wealth is `E[ΔW] = f * W * (0.5*0.6 + 0.5*(-0.5)) = f * W * 0.05`. Positive five percent expected growth per flip, regardless of *f*. Why wouldn’t I bet it all every time? Maximize expected growth." She shrugged elegantly. "f=1. Always."

  Dana didn’t look up from the coin. "Because, Priya, you won’t exist long enough to collect that expectation." Her voice was low, precise. "Bet everything each time? You have a fifty percent chance of halving your wealth on flip one. Then another fifty percent chance of halving the miserable remainder on flip two. Play long enough, and ruin isn’t just probable; it’s almost certain. Your expected value calculation is a beautiful, dangerous mirage."

  Priya smiled faintly. "A mirage? It’s the foundation of rational decision theory for eighty years. It averages the *possible* outcomes, weighted by their probability."

  "That’s precisely the error," Dana countered, finally meeting Priya’s eyes. Her gaze was fierce. "It averages *across* a hypothetical ensemble of identical gamblers at a single point in time. But you aren’t an ensemble. You are *one* gambler moving *through* time. The wealth multiplier per flip is either 1.6 or 0.5, depending on the outcome. Wealth compounds *multiplicatively*, not additively. The critical quantity isn’t the arithmetic mean of the possible multipliers; it’s the *geometric mean*. For a single player repeating the bet, the relevant measure is the long-run *growth rate* per flip: `g = (1/2) * log(1 + 0.6f) + (1/2) * log(1 - 0.5f)`."

  She tapped the table for emphasis. "Your `E[ΔW]` tells you what happens on average *to the crowd* of hypothetical Priyas after one flip. But *you* are walking a single path. The time-average growth rate `g` tells you what happens *along your path* as the flips pile up. Maximize *that* for survival and long-term growth. Betting `f=1`? `g = (1/2)*log(1.6) + (1/2)*log(0.5) = (1/2)*0.47 + (1/2)*(-0.69) = -0.11`. Negative growth. Ruin awaits. My `f`? It’s set by maximizing `g` – the Kelly fraction. For this bet, it’s `f=0.2`."

  Priya leaned forward, her composure unbroken but her intellect fully engaged. "Dana, you mistake a *choice* for a *discovery*. Von Neumann and Morgenstern didn't prescribe *which* utility function to use; they provided an axiomatic framework for consistent preferences *given* a utility function. Expected utility is normative for consistency, not descriptive of some objective 'right' outcome. If my utility function is linear in wealth, maximizing expected wealth *is* rational for me. Log utility, which your geometric mean maximization implicitly assumes, is just one concave function among many. It expresses *your* particular, and quite strong, risk aversion. Calling it the 'only sane target' is dogma, not math."

  Dana shook her head sharply. "It’s not about *my* aversion, Priya. It’s about the *mathematical structure of the process*. When wealth compounds multiplicatively over repeated trials, the arithmetic mean growth factor *overestimates* the typical outcome because it’s dominated by exponentially unlikely, astronomically high paths that pull the average up but which no single player ever experiences. The median path, the *likely* path for the individual gambler, is determined by the geometric mean. Ignoring that isn't a different preference; it's a fundamental mis-specification of the dynamics. Ergodicity economics highlights this: for multiplicative growth, the ensemble average diverges from the time-average for the single trajectory. The latter is what matters to the person *living* the sequence."

  "And the horizon?" Priya countered swiftly. "Your 'almost surely in the long run'? Real traders don't have infinite horizons. We operate over finite time periods with specific goals. Your 'ruin with certainty' might take a thousand flips. I might only need to play ten. My expected wealth after ten flips betting `f=1` is `1000 * (1.05)^10 ≈ $1629`. The most probable outcome? Lower, yes, but ruin in ten flips? Only if I get ten tails in a row – probability 1/1024. A risk, but hardly a certainty. Your Kelly fraction minimizes the chance of ruin *over infinity*, but it also drastically underperforms in finite, favourable runs. Why sacrifice substantial finite-horizon expectation for asymptotic safety I might never need?"

  "Because," Dana shot back, "the risk of ruin isn't linear. One bad streak can wipe you out completely, ending the game. You can't recover from zero. The finite-horizon argument cuts both ways – a few bad flips early on cripples your ability to capitalize on later good flips, even over ten rounds. My `f=0.2` gives me a growth rate `g ≈ 0.02`. Expected wealth after ten flips? `1000 * exp(10*0.02) ≈ $1221`. Lower than your $1629? Yes. But the *distribution* is far tighter. My chance of being below, say, $800 is miniscule. Yours? Substantial. And my chance of ruin? Effectively zero, even over thousands of flips. Yours climbs relentlessly."

  "And diversification?" Priya pressed, landing her strongest orthodox counter. "No trader faces a single, isolated bet. We hold portfolios of thousands of imperfectly correlated assets. Mean-variance optimization, maximizing expected return for a given level of variance, *already* manages the risk of catastrophic drawdowns you’re so obsessed with. It incorporates correlation, something your single-bet Kelly fixation ignores. Diversification smooths the path, reduces the volatility drag on compounded returns, and achieves essentially what you claim only geometric rationality can do – protecting long-run growth while capturing upside."

  Dana actually smiled, a tight, knowing curve of the lips. "Ah, the portfolio argument. Diversification *helps*, Priya, absolutely. But it doesn't *solve* the ergodicity problem; it just pushes the boundary of ruin further out and makes the geometric mean optimization more complex. Correlation isn't constant, especially during crises – the very times you most need protection. Assets that seem uncorrelated suddenly move together. Mean-variance optimization assumes normally distributed returns and stable correlations, a fragile assumption. Kelly for multiple assets *does* incorporate correlation – it optimizes the vector of fractions to maximize the long-run growth rate of the *entire portfolio*, considering the joint distribution. It’s the multi-dimensional extension. Mean-variance often approximates it under certain assumptions, but it’s not the same thing. And crucially, mean-variance still focuses on the mean and variance of *single-period* returns, not the long-run multiplicative growth. The variance drag on compounding is real and insidious, even in diversified portfolios. Geometric optimization tackles it head-on. It’s not just about avoiding ruin; it’s about maximizing the *robust* growth path through the multiplicative noise."

  Silence fell, thick with the weight of unresolved calculus. The coin glinted under the chandelier light. Priya studied Dana, seeing not a dogmatist, but a formidable intellect operating from a different, internally consistent axiom. Dana saw the same in Priya – the elegant, established framework wielded with precision.

  Marcus chuckled, breaking the tension. "Marvelous. Truly. Two masters, one coin, irreconcilable truths. The beauty is," he gestured to the server holding the coin, "you both get to play. Tonight. Out loud. Before each flip: Priya, what fraction? Dana, what fraction? Let’s see the philosophies in action."

  Priya took a slow sip of wine, her eyes never leaving Dana’s. "Very well, Marcus. Flip one. I risk it all. `f=1`. Expected value demands it."

  Dana didn't hesitate, her voice calm, certain. "Flip one. `f=0.2`. Geometric rationality requires it."

  The server poised the coin on his thumb. The air crackled. The argument wasn't over; it had merely moved to the felt-lined box and the spinning silver disc. The long run, for both of them, started now.
