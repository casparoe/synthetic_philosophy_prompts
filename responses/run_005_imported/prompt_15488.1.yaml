prompt: |-
  I've been reporting a longer feature on kidney-paired-donation chains for a health desk piece, and one thread from my interviews keeps nagging at me way more than it should for a story I'm supposed to have basically finished by now. I talked to a woman in her early 30s who donated a kidney to a total stranger, not to save a relative, she just walked into a transplant center and asked to be the first link in one of these donation chains. Her recovery was easy enough that she was back at her desk job in under a month, and when I asked why she did it she basically shrugged and said the math seemed obvious to her: a few weeks of minor surgery on her end versus someone else slowly dying on dialysis. She actually got a little annoyed when people called her a hero or a saint, like that framing was missing the point entirely.

  Then, for contrast, I talked to a guy on the transplant waitlist whose sister is a confirmed match for him and has decided not to donate, for reasons that are completely hers to have (a demanding job, fear of surgery, whatever else). Nobody in the family will say out loud that shes doing anything wrong, everyone repeats the line that of course she's not obligated, but there's this thick unspoken cloud of disappointment hanging over her that isn't hanging over literally anyone else on the planet who also didn't donate a kidney to this guy. So on one hand, doing the costly-good thing for a total stranger gets treated as purely optional, above-and-beyond, saintly, pick your word. On the other hand, not doing basically the same thing for your own brother, arguably at a lower relative cost given the guaranteed match, quietly gets treated as a moral failure, even though everyone insists in the same breath that she's under no obligation at all.

  I skipped every philosophy elective in college, so it's entirely possible this already has a name and I just don't know it, but is there some actual framework for thinking about this gap, where an act is officially classified as beyond the call of duty but starts to curdle into a real expectation once it looks cheap enough, or once someone else has already shown its doable? I keep half-explaining this in the piece as just "social pressure" or "guilt," and it feels like I'm missing the sharper, more precise thing that's actually going on. Would love a steer before this goes to my editor.
reasoning: |-
  Okay, the user is a journalist who's been working on a feature about kidney donation chains. They've interviewed two contrasting subjects: a woman who donated to a stranger and a man whose sister (a match) chose not to donate. The journalist is struggling to articulate the moral tension between these cases - how society frames the stranger's donation as saintly while treating the sister's refusal as a quiet failure, despite both parties having no official obligation. 

  Hmm, what's really eating at them is the cognitive dissonance in how we assign moral weight. The stranger gets hero status for an act we deem supererogatory (beyond duty), yet the sister faces implicit condemnation for not doing something technically optional too. The journalist keeps defaulting to "social pressure" or "guilt" but senses there's a sharper conceptual framework. 

  Let me unpack why this bothers them professionally: First, they're frustrated because they skipped philosophy classes and feel out of their depth. Second, they're on deadline and this moral thread is haunting an otherwise finished piece. Third, they suspect naming this tension could elevate their reporting from observational to analytical. 

  The core question is about moral expectation gradients. When does "extraordinary" become baseline? The sister's case reveals how relational proximity collapses moral distance - we intuitively feel kinship creates stronger duties than universal altruism. But why? Time to dig into ethics terminology...

  Ah! The perfect fit is the "supererogatory" concept. The stranger's act fits that definition cleanly: praiseworthy but not obligatory. The sister's situation is messier because of what ethicists call "special obligations" - duties arising from specific relationships. That's why her refusal feels like a betrayal while a random person's doesn't. 

  But there's another layer: the "moral proximity" theory. Peter Singer would argue physical/emotional nearness shouldn't affect moral duty, yet clearly it does psychologically. The sister is "close" in both senses, making her inaction conspicuous. 

  Also relevant: "moral licensing" dynamics. The stranger's donation paradoxically makes the sister look worse by proving the act's feasibility. It shifts the Overton window of expectations. 

  For their article, I should emphasize how these concepts explain the "unspoken cloud" around the sister. The family's insistence she's "not obligated" rings hollow because relational ethics operate at gut-level, not intellectual. That's why "social pressure" feels inadequate - it's not peer pressure, it's deeper: a violation of tacit kinship contracts. 

  Should warn them about potential pitfalls: Don't frame this as the sister being wrong. The piece should dissect societal hypocrisy, not judge her choice. Also avoid false equivalence - the stranger's motivation (simple cost-benefit math) differs from the sister's complex personal calculus. 

  Final thought: Suggest they quote an ethicist to crystallize this. The gap between abstract morality ("no obligation!") and lived morality ("how could she?") is the story's nerviest insight.
answer: |-
  You've hit on a profound ethical tension that absolutely deserves sharper framing than "social pressure" or "guilt." This gap *does* have names and frameworks in moral philosophy and sociology. Here are the key concepts to articulate what you're observing:

  1.  **Supererogation vs. Special Obligations:**
      *   **Supererogation:** Acts that are morally good but *beyond* what is required by duty or obligation (e.g., the stranger donating). They are praiseworthy but not mandatory. We call people who perform them "heroes" or "saints" precisely because they went *further* than expected.
      *   **Special Obligations:** Duties we owe specifically to certain people based on our relationships with them (e.g., parent-child, siblings, close friends, promises made). These are stronger than general duties owed to strangers.
      *   **The Gap:** The sister exists precisely at this collision point. While donating a kidney might still be considered supererogatory in an *absolute* sense (it's a significant sacrifice), the **special obligation** arising from the sibling relationship creates a powerful *expectation* that she *should* perform this act. Her refusal feels like a violation of that specific relational duty, even if everyone intellectually agrees there's no *universal* obligation to donate an organ. The stranger, lacking any special relationship, operates purely in the realm of supererogation, making her act purely "extra."

  2.  **The Proximity Effect (Moral Proximity):**
      *   This describes how we feel stronger moral demands from those physically, emotionally, or relationally *close* to us. A child drowning right in front of you creates a far stronger perceived duty to act than children starving overseas, even if the latter need is objectively greater. The sister is the *closest* possible match, both genetically and relationally. Her proximity (being the identified, willing match *within the family*) makes the expectation intensely personal and the perceived "cost" of her refusal feel higher within that specific moral circle (the family).

  3.  **The Shifting Baseline of "Cost":**
      *   **The Stranger's Impact:** Her story ("minor surgery," "back at work in a month") actively *lowers* the perceived cost barrier for others, including the family. It makes donation seem more feasible and less burdensome *than they might have imagined*. This inadvertently makes the sister's reluctance seem *less* justified in comparison.
      *   **"Cheap Enough" to Expect:** You nailed it with "once it looks cheap enough." When an act moves from seeming impossibly heroic/difficult to appearing manageable and relatively low-risk (based on examples like the stranger), it can subtly shift from being purely supererogatory to something that feels more like a *reasonable expectation*, especially within a relationship where strong special obligations already exist. The sister isn't being asked to perform a miracle; she's being asked to do something demonstrably "doable" that would save her brother.

  4.  **The "Ought Implies Can" Principle & Moral Licensing:**
      *   **Ought Implies Can:** This principle states that we can only have a moral obligation to do something if we *can* actually do it. The sister *can* donate (she's a match, physically able). This strengthens the perception that she *ought* to, especially compared to others who *can't*.
      *   **Moral Licensing (Indirectly):** The insistence that "she's not obligated" functions almost as a form of moral licensing *for the family* – saying the words absolves them of the guilt of *directly* blaming her, allowing them to maintain the social nicety. But it doesn't erase the underlying feeling that she *could* and *should* do this thing she *can* do for her brother. The words deny the obligation, but the emotional reality confirms the powerful expectation.

  5.  **The "Unspoken Cloud" as Tacit Moral Judgment:**
      *   This cloud is the manifestation of the violated **special obligation** amplified by the lowered **perceived cost** (thanks to the stranger's example) and the **proximity** (she's the identified solution within the family). It's a social sanction reflecting the collective, unspoken sense that within *this specific relational context*, her choice falls short of what the relationship demands, even if it falls within her abstract rights. It's the gap between formal rights ("no obligation") and lived relational ethics ("but you're his *sister* and you *can*").

  **How to Frame This in Your Piece:**

  *   **Lead with the Contrast:** Explicitly state the paradox you observed – the saintly framing of the stranger vs. the unspoken condemnation of the sister, despite both technically having "no obligation."
  *   **Name the Concepts:**
      *   "Ethicists describe acts like [Stranger's Name]'s donation as 'supererogatory' – morally admirable but beyond any duty. Yet, for [Sister's Name], her decision not to donate to her brother collides with powerful 'special obligations' – the heightened duties we intuitively feel towards close family."
      *   "The 'proximity effect' is strong: as the identified match within the family, the expectation on her felt profoundly different than the abstract possibility of a stranger donating."
      *   "Seeing donation framed as a manageable act by [Stranger's Name] ('minor surgery,' 'back at work quickly') arguably lowered the perceived cost barrier, making [Sister's Name]'s refusal seem less like avoiding an impossible burden and more like declining a feasible act that could save her brother's life. This subtly shifts the act, in the family's eyes, away from the purely saintly realm."
      *   "The family's repeated insistence that 'she's not obligated' highlights the tension. It acknowledges her formal right, but the 'thick unspoken cloud of disappointment' reveals the powerful, unspoken force of relational ethics – the feeling that kinship creates a unique expectation, a tacit duty, that wasn't met."
  *   **Conclude the Thought:** "This tension underscores a complex truth about organ donation: while society rightly celebrates the extraordinary gift to a stranger, the deepest, most fraught expectations often lie much closer to home, bound by blood and the unspoken rules of kinship. The calculus of 'obligation' becomes far murkier when love and proximity are factored in."

  **Why this is stronger than "social pressure" or "guilt":**

  *   **Precision:** It identifies the specific *types* of duties and expectations at play (supererogation vs. special obligations).
  *   **Depth:** It explains *why* the expectation on the sister is different (proximity, relationship).
  *   **Mechanism:** It shows *how* the stranger's story changes the perception (lowering perceived cost, shifting the baseline).
  *   **Nuance:** It captures the conflict between intellectual assent ("no obligation") and deep-seated relational feelings ("but... family").

  This framework gives you the precise, analytical language to elevate your insightful observation from a nagging thread to a powerful, thought-provoking core element of your piece. Good luck with your editor – this is compelling stuff!
