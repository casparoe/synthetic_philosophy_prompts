  First, let's visualize strict dominance. Imagine strategies as hills and payoffs as elevation. A strictly dominated strategy is like a valley - always lower than some peak. Removing valleys can't create new valleys or destroy peaks, right? That's key. When we eliminate one strictly dominated strategy, we're just removing a clearly inferior option that couldn't possibly affect the superiority of other options. 

  Now weak dominance... that's trickier. It's like having plateaus - multiple strategies tied at certain points. When you eliminate one, it's like removing a path that was supporting others. Suddenly strategies that were weakly dominated might become strictly dominated or vice versa. The order changes the landscape because those ties mean relationships aren't absolute. 

  The mixed strategy question is connected! Pure strategies can be like isolated peaks - sometimes you need a bridge (mixed strategy) to connect them and dominate a stubborn strategy that sits between peaks. That "strictness" requirement forces us to blend strategies to cover all bases when no single pure strategy dominates.

  User's ecology analogy actually helps here - their hawk/dove mix is exactly why weak dominance is messy. In nature, 70/30 might be ESS, but in classical GT we're solving for rationality. The moment payoffs allow ties, it's like introducing microclimates where survival depends on sequence. 

  Gotta avoid formalisms but keep it precise. Maybe use their ecology lens: strict dominance is like a species that always loses in every habitat - extinct immediately. Weak dominance is like a species that ties in some niches - whether it gets eliminated first depends on which habitats we consider initially. 

