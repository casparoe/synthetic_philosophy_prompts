answer: |-
  What a fantastic question! Your ecology background gives you a unique lens – the connection between strict dominance and ESS-like stability is spot-on. Let's break down the intuition behind iterated elimination order without the formal proof lemmas.

  **The Core Idea: Strict Dominance is "Always Better" - Weak Dominance is "Never Worse, Sometimes Better"**

  1.  **Strict Dominance = Absolute Inferiority (No Ties Ever):**
      *   Strategy `A` **strictly dominates** strategy `B` if `A` gives a player a **strictly higher payoff** than `B` **no matter what combination of strategies the *other* players choose**.
      *   Think: `A` *always* beats `B`, head-to-head, in every possible scenario the opponents could create. There are **no ties**. `Payoff(A | Opponents' Choices) > Payoff(B | Opponents' Choices)` **for every single profile** of opponents' choices.
      *   **Why Order Doesn't Matter (Intuition):** Because `B` is *strictly worse* than `A` in **every conceivable situation**, eliminating `B` *cannot possibly* change the relative ranking of *any other strategies*. Removing `B` doesn't make some other strategy `C` suddenly look worse or better compared to `A` or `D` because `B` was never a viable contender against them in the first place – `A` was always strictly better. It's like removing a contestant who *always* loses every race; it doesn't affect who wins the races between the remaining contestants.

  2.  **Weak Dominance = Never Better, Sometimes Equal (Ties Exist):**
      *   Strategy `A` **weakly dominates** strategy `B` if `A` gives a payoff that is **at least as good as** `B` for *every* combination of opponents' strategies, and **strictly better than `B` for *at least one* combination** of opponents' strategies.
      *   Think: `A` *never loses* to `B`, but it *might tie* with `B` in some scenarios. It only *strictly wins* in at least one scenario.
      *   **Why Order *Does* Matter (Intuition):** The problem lies in the **ties**. Imagine strategies `A`, `B`, and `C`.
      *   Suppose `A` weakly dominates `B` (meaning `A` >= `B` always, and `A` > `B` sometimes).
      *   Suppose `C` weakly dominates `B` (meaning `C` >= `B` always, and `C` > `B` sometimes).
      *   But what about `A` vs. `C`? They might be incomparable based on the original game.
      *   **Scenario 1: Eliminate `B` first.** Now you compare `A` and `C` directly. Neither may dominate the other. Both survive.
      *   **Scenario 2: Don't eliminate `B` yet.** Look at `A` vs. `C`. In profiles where `A` tied with `B`, `C` *might* actually be strictly worse than `A`! Conversely, in profiles where `C` tied with `B`, `A` might be strictly worse than `C`. `B`'s presence can "mask" the dominance relationship between `A` and `C`.
          *   *Example:* Imagine a profile of opponent choices `X` where `Payoff(A | X) = 5`, `Payoff(B | X) = 5` (tie), `Payoff(C | X) = 3`. Here, against `X`, `A` is strictly better than `C` (`5 > 3`), but this strict loss for `C` only becomes apparent *after* `B` is removed because while `B` was present, `C` looked at least as good as `B` (both `5` and `3` are >= `3`? Wait, no... `C` gets 3, `B` gets 5. Let's fix this).
      *   **Better Weak Dominance Example:** Consider a simple game for Player 1 (Rows) vs. Player 2 (Columns - assume they play L or R arbitrarily):

          | P1\P2 | L     | R     |
          | :----- | :---- | :---- |
          | **A**  | 3, ?  | 1, ?  |
          | **B**  | 2, ?  | 2, ?  |
          | **C**  | 1, ?  | 3, ?  |

          (Player 2's payoffs don't matter for P1's dominance).
          *   For Player 1:
              *   If P2 plays L: `A=3`, `B=2`, `C=1` -> `A` best.
              *   If P2 plays R: `A=1`, `B=2`, `C=3` -> `C` best.
          *   **Weak Dominance:**
              *   `B` is *weakly dominated* by `A`? Against L: `B=2 < A=3` -> Strictly worse. Against R: `B=2 > A=1` -> Strictly *better*! So `A` does *not* dominate `B`.
              *   `B` is *weakly dominated* by `C`? Against L: `B=2 > C=1` -> Strictly better! No.
              *   **`B` weakly dominates `A` and `C`?** No.
              *   **Crucially:** `B` is *not strictly dominated* by *any* pure strategy. `A` beats it when P2 plays L, `C` beats it when P2 plays R, but neither beats it *always*.
          *   **Now Consider Weak Dominance *after* Elimination:** Suppose we (ill-advisedly) eliminate `A` first (maybe because it's weakly dominated in some other context, or we make a mistake). Now the game is just `B` vs `C`:
              *   If P2 plays L: `B=2`, `C=1` -> `B` better.
              *   If P2 plays R: `B=2`, `C=3` -> `C` better.
              *   Neither `B` nor `C` weakly dominates the other! Both might survive if we stop here.
          *   **But!** If we eliminate `B` first, we are left with `A` and `C`. Neither dominates the other (as in the original game). Different outcomes (`A` & `C` survive) vs. (`B` & `C` survive after eliminating `A` first).
      *   **The Key:** When you eliminate a weakly dominated strategy `B` first, you remove a strategy that sometimes "held back" the revelation of how bad another strategy (`A` or `C`) might be in specific scenarios. The *ties* that `B` had with other strategies were obscuring strict inequalities between those other strategies. The order determines which potential dominances get revealed first.

  **Connecting to Mixed Strategies & Strictness**

  You've hit the nail on the head! The need for mixed strategies to dominate a pure strategy is *directly* related to the strict inequality requirement of dominance.

  *   **Pure Strategy Dominance Fails:** A pure strategy `S` might be such that no *single* other pure strategy `T` is *always* strictly better than `S` against *every* possible opponent play.
  *   **The Mixed Strategy Solution:** However, a **mixture** of two (or more) pure strategies (`T` and `U`, played with probabilities `p` and `1-p`) *can* be strictly better than `S` against *every* possible opponent play.
  *   **Why Strictness Drives Mixing:** The magic happens because the mixed strategy leverages the *different strengths* of `T` and `U` across different opponent profiles.
      *   For any *specific* opponent profile `X`, one of the pure strategies (`T` or `U`) might be strictly better than `S` against `X`, or they might tie.
      *   The cleverness is in choosing the probabilities (`p`, `1-p`) such that **for every single opponent profile `X`, the *expected payoff* of the mixed strategy is strictly greater than the payoff of `S`**.
      *   This is only possible *because* we require strict inequality (`>`). If we only required weak dominance (`>=`), a pure strategy that ties `S` everywhere might suffice. But strict dominance forces us to get a *strict* improvement everywhere, which often requires blending strategies – using `T` where it crushes `S` to offset where `U` only ties `S` slightly, ensuring the *average* is strictly better no matter what the opponents do.
  *   **Ecology Analogy:** Think of a pure strategy like a specialist species adapted to one niche. A mixed strategy is like a population employing different specialists (hawks/doves). If there's an "invader" strategy (`S`) that's moderately good in all niches, no single specialist (`T` or `U`) might be strictly better in *every* niche (weather condition, resource availability). But a mix might achieve a strictly higher *average* fitness across *all* niches, preventing the invader from establishing itself. The strictness requirement (`>`) forces the evolutionary solution to be a mix, not a single specialist.

  **Summary**

  1.  **Strict Dominance (Order Irrelevant):** "Always strictly better." Removing an inferior option doesn't alter the *relative* superiority/inferiority of others because the dominance was absolute and context-independent. No ties mean no hidden relationships are exposed by removal.
  2.  **Weak Dominance (Order Matters):** "Never worse, sometimes better (ties exist)." Ties mean a weakly dominated strategy can "mask" the true dominance relationships between other strategies. Removing it first changes the landscape, potentially revealing strict dominance between others that wasn't visible before or preventing the revelation of dominance that would have been seen if a different strategy was removed first.
  3.  **Mixed Strategies & Strictness:** The requirement for *strict* dominance (`>`) against *every* opponent move often forces the use of mixed strategies. No single pure strategy can guarantee strict improvement everywhere, but a carefully chosen mixture can leverage the different strengths of pure strategies to achieve an expected payoff strictly greater than the target pure strategy in every possible scenario. Weak dominance (`>=`) could often be satisfied by a pure strategy.

  This strictness (`>`) is the linchpin. It guarantees absoluteness and context-independence in strict dominance elimination (making order irrelevant), while its absence in weak dominance allows context-dependence and masking (making order crucial). This same strictness is what forces the blending of strategies to achieve dominance when no single pure strategy can do the job absolutely. Your intuition from evolutionary stable strategies serves you well here – strict dominance relates to strategies that cannot be "invaded," and mixed strategies are often the key to achieving that invulnerability.
