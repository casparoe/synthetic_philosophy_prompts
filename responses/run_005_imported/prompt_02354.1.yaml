answer: |-
  Here’s an intuitive breakdown of both issues, designed for undergraduate comprehension and connecting to the deeper order-independence question:

  ---

  ### **1. Why Mixed Strategies Can Eliminate More: The "Coin-Flip Advantage"**
  Imagine two detectives (Alice and Bob) trying to catch a spy. The spy can hide in one of two buildings (Left or Right), and each detective must choose which building to search. Payoffs depend on whether they coordinate:
  - **Alice's Strategies:** Search Left (L), Search Right (R)  
  - **Bob's Strategies:** Search Left (L), Search Right (R)  

  **Payoffs (Alice's perspective):**  
  - If both search Left: Alice gets 1 (credit for coordination).  
  - If both search Right: Alice gets 1.  
  - If Alice searches Left and Bob Right: Alice gets 0 (wasted effort).  
  - If Alice searches Right and Bob Left: Alice gets 0.  

  Now, suppose Bob flips a coin to decide where to search (50% L, 50% R).  
  - If Alice chooses **L**: Her *expected* payoff is (0.5 × 1) + (0.5 × 0) = 0.5.  
  - If Alice chooses **R**: Her *expected* payoff is (0.5 × 0) + (0.5 × 1) = 0.5.  

  **But what if Alice chooses a stubborn strategy?**  
  Suppose Alice always chooses **L**, no matter what.  
  - Against Bob’s mixed strategy: She gets 0.5.  
  - *Neither* of Bob’s pure strategies (L or R) strictly dominates "Always L":  
    - If Bob plays L, "Always L" gets 1 (better than R’s 0).  
    - If Bob plays R, "Always L" gets 0 (worse than R’s 1).  

  **The "Coin-Flip" Insight:**  
  Bob’s mixed strategy **creates a new threat**: by randomizing, he *guarantees* Alice can’t exploit his choice. Alice’s "Always L" isn’t beaten by any *single* pure strategy of Bob’s, but it *is* strictly dominated by Bob’s mixed strategy, which holds her payoff to 0.5 no matter what she does.  

  **Real-world intuition:**  
  Think of a penalty kick in soccer. A goalkeeper who *always* dives left is predictable; a shooter can exploit this. But if the keeper randomly dives left or right (a mixed strategy), the shooter can’t guarantee a goal by always shooting left or right. The shooter’s "always left" strategy is strictly dominated by the keeper’s randomness—even though no *single* dive direction dominates it.  

  **Key takeaway:** Mixed strategies act as "hedges" that smooth out payoffs, making them more robust. A pure strategy that isn’t beaten by any *one* enemy move might still be beaten by a *random combination* of moves.  

  ---

  ### **2. Order-Independence & Why Weak Dominance Breaks It**
  #### **Why Strict Dominance is Order-Independent**
  - **The "Unquestionable Inferiority" Principle:**  
    If strategy **A** is *strictly* dominated by **B** (pure or mixed), then **A** is *always* worse than **B**, **no matter what others do**. Removing **A** doesn’t change whether other strategies are dominated—it just simplifies the game.  
    *Analogy:* Removing rotten apples from a barrel. A rotten apple (strictly dominated strategy) is objectively bad and won’t affect other apples' freshness. Removal order doesn’t matter.  

  #### **Why Weak Dominance is Order-Dependent**
  - **The "Sometimes Tied" Problem:**  
    A strategy **A** is *weakly* dominated by **B** if **B** is *at least as good* as **A** in all cases, and *strictly better* in **at least one case**. But if **A** and **B** are *tied* against some opponent strategies, removing one might "break ties" for other players.  
    *Analogy:* Removing a candidate from an election. If two candidates are tied (weakly dominated), removing one makes the other now win against others—changing the outcome.  

  **Intuitive Example:**  
  Consider a game with three strategies for Player 1: **A**, **B**, **C**, and two for Player 2: **X**, **Y**.  
  - **Payoffs for Player 1:**  
    - Against X: A=3, B=3, C=1  
    - Against Y: A=0, B=1, C=2  

  **Step-by-Step Elimination:**  
  - **If we first eliminate weakly dominated strategies:**  
    - **A** is weakly dominated by **B** (same payoff vs. X, worse vs. Y). Remove **A**.  
    - Now compare **B** and **C**:  
      - Vs. X: B=3 > C=1  
      - Vs. Y: B=1 < C=2  
      → Neither dominates the other. **Surviving: B, C**.  
  - **If we first eliminate a different strategy:**  
    - **C** is *not* dominated initially (it beats A and B against Y).  
    - **A** is still weakly dominated by **B**. Remove **A**.  
    - Now **C** is strictly dominated by **B**?  
      - Vs. X: B=3 > C=1  
      - Vs. Y: B=1 < C=2 → **Not strict dominance!**  
    → **Surviving: B, C** (same as above).  

  *But wait! Let’s modify the payoffs slightly:*  
  Change **B**’s payoff against **Y** to **1.5** (instead of 1). Now:  
  - **First eliminate A (weakly dominated by B):**  
    - Surviving: B, C → neither dominates the other (B> C vs. X, C> B vs. Y).  
  - **First eliminate C (not dominated):**  
    - Now compare A and B:  
      - Vs. X: A=3, B=3  
      - Vs. Y: A=0, B=1.5 → **B strictly dominates A!**  
    → Remove A. **Surviving: B only!**  

  **The Crucial Issue:**  
  When we remove a weakly dominated strategy (like **A**), we erase the scenario where **A** and **B** were *tied* against **X**. This changes the "landscape" for judging **C**. In one order, **C** survives; in another, it may not.  

  **Why is this a Liability?**  
  - **Interpretation ambiguity:** The "solution" depends on the order of elimination—an arbitrary choice.  
  - **Loss of predictive power:** If the order isn’t specified, we can’t say what the outcome will be.  
  - **Philosophical problem:** Game theory aims to model rational players. If rationality doesn’t specify an order, iterated weak dominance isn’t a reliable solution concept.  

  **Key intuition:** Weak dominance relies on "knife-edge" payoffs where strategies tie. Removing one strategy can tilt the balance elsewhere, making order matter. Strict dominance avoids this by requiring strategies to be *unambiguously worse* in every scenario.  

  ---

  ### **Summary for Your Lecture**
  1. **Mixed strategies as dominators:**  
     *"Randomizing lets players 'average out' weaknesses. A pure strategy that isn’t beaten by any single opponent move might still be beaten by a randomized counter-strategy—like how a goalkeeper who randomizes stops a shooter who always aims left."*  
  2. **Order-independence breakdown under weak dominance:**  
     *"Strict dominance is order-independent because dominated strategies are unconditionally bad. Weak dominance depends on ties—and cutting one ‘tied’ strategy can change how we view others, making the result order-dependent. That’s why weak dominance is less reliable for predicting rational play."*  

  This avoids algebra while highlighting the conceptual core: **mixed strategies expand elimination power by creating robust "hybrid" threats**, and **weak dominance fails order-independence because it depends on fragile payoff ties**. Both reflect how precision in dominance definitions shapes the logic of elimination.
