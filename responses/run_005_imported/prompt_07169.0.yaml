answer: |-
  Here’s a 5-minute eulogy draft that honors Miriam's unique perspective, makes her philosophy accessible, and navigates the delicate balance for your audience:

  **(Start warmly, connect personally)**

  "Hi everyone. For those I haven’t met yet, I’m [Your Name], Miriam’s nephew/niece. Like many of you, I spent countless hours around Miriam’s dinner table. And at every single one of those dinners, without fail, she’d find a way to bring us back to her favorite puzzle: the puzzle of *us*.

  She’d lean in, maybe after someone yelped from stubbing a toe on the table leg, or sighed with pleasure over her roast chicken, and she’d ask, ‘But what *is* that? The *feeling* of the pain? The *taste* of the chicken? Is it *just* the nerves firing? Just the chemicals on the tongue?’

  **(Introduce her core idea simply, avoid jargon)**

  "Miriam spent forty years teaching philosophy of mind, wrestling with consciousness. Her big idea – the one she loved to share – wasn't about ghosts or souls in the way we usually talk about them. It was about something she saw as a profound mystery right here in life.

  She’d paint this picture: Imagine a perfect copy of a person. Same brain, down to the last atom. Same everything. It walks, talks, laughs, cries out ‘OW!’ when it stubs its toe, just like we do. *But*, Miriam would insist, you could *perfectly well imagine* that inside this perfect copy… there’s *nobody home*. No inner light. No experience of the pain as *hurting*, no experience of the chicken as *delicious*. It’s all just… machinery going through the motions. A perfect robot. A ‘philosophical zombie,’ as she’d call it, though she’d roll her eyes if anyone thought she meant the walking-dead kind!

  **(Clarify what it DOESN'T mean - crucial step)**

  "Now, Miriam was very clear about what this *didn’t* mean. She wasn’t arguing for a spooky soul floating around separate from the body. She wasn’t saying consciousness *leaves* when the brain stops. She got quite annoyed if people mixed that up! Her point was different, and it was about *this* life, *this* world.

  She believed that thought experiment showed something fundamental: that the raw *experience* of being alive – the redness of red, the bitterness of coffee, the ache of loss – isn’t *just* the physical stuff of the brain. It can’t be completely reduced to neurons and chemicals, even though it utterly depends on them. That there’s an ‘extra’ dimension to being conscious, a ‘what-it’s-like-ness’ that physics alone doesn’t capture. The physical brain is necessary, she’d say, but maybe not sufficient to explain the *feeling* inside.

  **(Connect idea to her character and life)**

  "And this wasn’t just an academic puzzle for Miriam. It fueled the way she lived. Knowing that consciousness was this profound, maybe even inexplicable, feature of the universe made her cherish the *experience* intensely. It’s why she savored that first sip of wine so deeply, why she argued with such passion (and a twinkle in her eye), why she listened so intently to your stories, absorbing the *feel* of them. She believed the inner light was real and remarkable, even if its source was a mystery woven into the fabric of the physical world.

  **(Address loss without violating her views - focus on the mystery and her legacy)**

  "So, how do we talk about Miriam now? She wouldn’t want us to pretend she believed in a little ghost-Miriam watching us from a cloud. That wasn’t her view. But equally, she spent her life arguing passionately against the idea that she was *just* atoms, that her laughter, her fierce intellect, her love for all of us gathered here, was *nothing but* electrical sparks.

  Miriam believed the reality of our inner experience – the sheer *is-ness* of being alive and conscious – was undeniable and irreducible. It was a mystery she dedicated her life to contemplating.

  **(Conclude with comfort rooted in her life and impact)**

  "Where is she now? The Miriam who argued and laughed and loved? The honest answer, respecting her own fierce intellect, is that we don’t know the full nature of that mystery. But we *do* know this: Her consciousness, that brilliant, questioning, feeling light, illuminated our lives. It shaped us. It argued with us. It loved us. And *that* – the undeniable reality of her experience and its impact – doesn't vanish just because her voice is silent.

  She showed us how to look at a sunset, a argument, a stubbed toe, and wonder: ‘What *is* this experience?’ She taught us that the feeling matters. That the inner world is real. That’s her legacy.

  The light of her conscious mind may be gone, but the warmth it generated in us, the questions it sparked, the love it shared – that endures. Let’s honor Miriam by carrying that wonder forward, by savoring the inexplicable miracle of our own awareness, just as she did, with such passion and curiosity, every single day."

  **Why this works for your audience:**

  1.  **Avoids "Soul/Heaven" Explicitly:** Clearly states her rejection of that model without being dismissive of others' beliefs (like your grandmother's).
  2.  **Avoids "Just Atoms" Explicitly:** Clearly states her rejection of reductive physicalism without sounding cold or nihilistic.
  3.  **Explains the Zombie Thought Experiment Simply:** Uses relatable examples (stubbed toe, taste) and avoids jargon like "qualia" or "p-zombie." Focuses on the core imaginative leap.
  4.  **Crucially Clarifies the Distinction:** Explicitly says what her view *wasn't* (soul leaving body/afterlife) and what it *was* (consciousness as an irreducible feature *in* life).
  5.  **Connects Philosophy to Person:** Shows how her big idea fueled her way of living – savoring experience, arguing passionately, loving deeply. Makes it relevant.
  6.  **Offers Honest Comfort:** Doesn't offer false promises of an afterlife, but offers comfort in the undeniable reality of her life, her impact, and the enduring mystery she celebrated. Focuses on her *legacy* and the *wonder* she inspired.
  7.  **Respects the PhD Student:** Uses precise language ("irreducible," "necessary but not sufficient," "mystery woven into the fabric of the physical world") that accurately reflects her position without needing technical terms. They'll hear her actual argument represented faithfully.
  8.  **Accessible Language:** Uses metaphors like "inner light," "what-it's-like-ness," "machinery going through the motions" that are understandable without philosophy degrees.
  9.  **Tone:** Respectful, warm, slightly inquisitive, and ultimately affirming of life and her impact – fitting for a eulogy.

  **Delivery Tip:** Speak slowly, especially when explaining the philosophical parts. Pause after key points (like the zombie description or the distinction). Let your own affection for Miriam show. This balances intellectual honesty with genuine warmth and remembrance. Good luck on Saturday. She’d appreciate the effort to get it right.
