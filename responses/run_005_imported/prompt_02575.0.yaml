prompt: |-
  So I'm working on a short story collection thats loosely about art and deception, and I've hit a wall on the centerpiece story. Here's the setup: my main character restores Old Master paintings for a small regional museum, and over the years he's gotten so good at in-painting damaged sections that a chunk of one canvas is now, technically, entirely his own brushwork -- not a copy, just seamlessly "completed" in the original's style. Then a new curator brings in some fancy imaging tech and the whole thing unravels. My problem is the ending -- every draft collapses into the same tired beat where somebody shrugs and says "well, it still looks the same, so who cares if it's fake," and I want something with more bite than that.

  I was talking to a friend from my old grad school days (she teaches aesthetics now) and she brought up this Nelson Goodman argument that's been rattling around in my head since -- something about how even if two paintings are 100% perceptually identical right now, knowing one's a fake still changes things, because it changes how you look, trains your eye to go hunting for a difference that might only become visible later. So the "sameness" is never actually guaranteed to be permanent, if that makes sense. She also mentioned theres a real counter-argument from another aesthetician (Lessing, I think?) who says the whole perceptual angle is a red herring, that what's actually wrong with forgery has nothing to do with how a thing looks or could look, and everything to do with originality and credit.

  Could you write me a short story (doesn't need to be long -- 1000ish words is fine) that actually dramatizes that specific disagreement, rather than the generic "fakes are fine, actually" resolution I keep landing on? Ideally there's a scene where a character's perception of the painting visibly, viscerally shifts the second they learn it isn't "real," plus someone else in the room pushing back with the originality argument instead. You don't need to name-drop any philosophers in the story itself -- I just want the underlying arguments represented properly and left in real tension, not flattened into a soundbite. Setting and characters are totally up to you, I only care that the philosophical bones underneath are sound.
