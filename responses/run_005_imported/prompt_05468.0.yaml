  ### Handout: The Diaconescu-Goodman-Myhill Theorem and Constructive Set Theory  
  **For Graduate Seminar on Philosophy of Mathematics**  

  ---

  #### **Part 1: The Construction – How Choice Implies LEM**  
  We work in a constructive set theory like **IZF** (Intuitionistic Zermelo-Fraenkel), which includes the **Axiom of Choice (AC)** but not the Law of Excluded Middle (LEM). Our goal is to prove LEM (i.e., \(P \lor \neg P\) for an arbitrary proposition \(P\)) using AC. The proof constructs specific sets from \(P\) and applies AC to derive a contradiction if LEM fails.  

  **Step 1: Define the sets**  
  Let \(P\) be an arbitrary proposition (e.g., "the Collatz conjecture is true"). Define:  
  - \(U = \{0, 1\}\) (a set with two distinct elements, \(0 \neq 1\)).  
  - \(A = \{ x \in U \mid x = 0 \lor P \}\) (elements are \(0\) if \(\neg P\), or both \(0\) and \(1\) if \(P\)).  
  - \(B = \{ x \in U \mid x = 1 \lor P \}\) (elements are \(1\) if \(\neg P\), or both \(0\) and \(1\) if \(P\)).  

  **Key observations**:  
  - \(A\) and \(B\) are **nonempty**:  
    - \(0 \in A\) (since \(0 = 0\) is true, satisfying \(x = 0 \lor P\)).  
    - \(1 \in B\) (since \(1 = 1\) is true, satisfying \(x = 1 \lor P\)).  
  - If \(P\) is true, \(A = B = U = \{0, 1\}\).  
  - If \(P\) is false, \(A = \{0\}\) and \(B = \{1\}\).  

  **Step 2: Form the family for AC**  
  Define the index set \(S = \{A, B\}\). This is a set of two sets (though if \(P\) holds, \(A = B\), so \(S\) has one element). The family of sets to which we apply AC is \(S\) itself:  
  \[
  \text{The family is } \{X_i\}_{i \in S} \text{ where } X_i = i \text{ (so } X_A = A,  X_B = B\text{).}
  \]

  **Step 3: Apply the Axiom of Choice**  
  AC asserts a **choice function** \(f: S \to \bigcup S\) such that:  
  \[
  \forall i \in S,  f(i) \in i.
  \]  
  Specifically:  
  - \(f(A) \in A\) (so \(f(A) = 0 \lor P\)),  
  - \(f(B) \in B\) (so \(f(B) = 1 \lor P\)).  

  Since \(A, B \subseteq U\), \(f(A), f(B) \in \{0, 1\}\).  

  **Step 4: Case analysis to derive \(P \lor \neg P\)**  
  We compare \(f(A)\) and \(f(B)\). Since \(\{0, 1\}\) has **decidable equality** (we can intuitionistically decide if two elements are equal), we split cases:  

  - **Case 1: \(f(A) = f(B)\)**  
    Let \(c = f(A) = f(B)\). Then:  
    - \(c \in A\) (so \(c = 0 \lor P\)),  
    - \(c \in B\) (so \(c = 1 \lor P\)).  
    Split on the value of \(c\):  
    - If \(c = 0\), then \(c \in B\) implies \(0 = 1 \lor P\). Since \(0 \neq 1\), we have \(P\).  
    - If \(c = 1\), then \(c \in A\) implies \(1 = 0 \lor P\). Since \(1 \neq 0\), we have \(P\).  
    Thus, **\(P\) holds in this case**.  

  - **Case 2: \(f(A) \neq f(B)\)**  
    We show \(\neg P\) (i.e., assuming \(P\) leads to contradiction):  
    - Assume \(P\) is true. Then \(A = B = U = \{0, 1\}\).  
    - Thus, \(S = \{A, B\} = \{U\}\) (a singleton set, since \(A = B\)).  
    - Since \(S\) has one element, \(f(A) = f(B)\) (as \(f\) maps the single element of \(S\) to one value in \(U\)).  
    - But this contradicts \(f(A) \neq f(B)\).  
    Thus, **\(\neg P\) holds in this case**.  

  Since we can decide between \(f(A) = f(B)\) or \(f(A) \neq f(B)\) (by decidability of equality in \(\{0, 1\}\)), we have:  
  \[
  P \lor \neg P.
  \]

  **Conclusion of Part 1**:  
  Using AC on the family \(S = \{A, B\}\)—where \(A\) and \(B\) are defined from \(P\)—we intuitionistically derive \(P \lor \neg P\). The choice function \(f\) forces a decision on \(P\), even though \(P\) itself may be undecidable.  

  ---

  #### **Part 2: Is Choice the Culprit? Separation vs. Choice**  
  The proof above uses AC to derive LEM, but it relies on **unrestricted separation** (forming sets via arbitrary predicates, like \(A = \{x \in U \mid x = 0 \lor P\}\)). This raises a question: Is AC intrinsically non-constructive, or is unrestricted separation the root issue?  

  ##### **The Role of Unrestricted Separation**  
  - **In IZF**: Separation allows sets defined by *any* predicate (e.g., \(x = 0 \lor P\), even if \(P\) is undecidable). This enables:  
    - The sets \(A\) and \(B\) to "wait" for a decision on \(P\).  
    - AC to "detect" \(P\) via \(f(A)\) and \(f(B)\).  
  - **In predicative theories like CZF**: Separation is **restricted to bounded formulas** (i.e., formulas with only bounded quantifiers, like \(\forall x \in y\)).  
    - The predicate \(x = 0 \lor P\) may not be bounded (if \(P\) contains unbounded quantifiers).  
    - Thus, \(A\) and \(B\) **cannot be formed** for arbitrary \(P\). The proof **fails** in CZF.  

  ##### **Choice in CZF**  
  CZF (Constructive Zermelo-Fraenkel) validates **weak choice principles** (e.g., **Presentation Axiom** or **Relativized Dependent Choice**) without collapsing to LEM. For example:  
  - CZF + Presentation Axiom does not prove LEM.  
  - Choice is often "constructive" here: e.g., if a set is a **quotient** of a "base" (e.g., lists modulo equivalence), choices can be made uniformly.  

  ##### **Diagnosis: Separation or Choice?**  
  - **Source of non-constructivity**: The combination of **AC + unrestricted separation**.  
    - AC alone (e.g., in type theory) can be constructive—it often holds computationally (e.g., as \(\Pi\)-\(\Sigma\) distributivity).  
    - Unrestricted separation alone (without AC) does not imply LEM.  
    - But together, they create "non-constructive sets" (like \(A\) and \(B\)) that AC "probes" to decide \(P\).  
  - **Analogy**: AC is a "symptom" enabled by the "disease" of separation. Without separation, AC is benign.  

  ##### **Is "The Axiom of Choice is Intuitionistically Suspect" Fair?**  
  - **Misleading**: AC is not inherently anti-constructive. Many constructive systems (e.g., Martin-Löf type theory, CZF) embrace choice-like axioms without LEM.  
  - **Nuanced truth**: AC is suspect **only when paired with non-constructive set formation** (unrestricted separation/powersets). In predicative systems, it is harmless.  
  - **Better slogan**: "Unrestricted separation makes choice dangerous for constructivity."  

  **Final Verdict**:  
  The theorem exposes how AC *amplifies* non-constructivity from separation—but in predicative or type-theoretic settings, choice can remain "constructively flavored." The surprise stems from conflating AC's "produce an object" intuition with the classical context it usually inhabits.  

