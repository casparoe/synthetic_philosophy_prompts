prompt: |-
  So I had this two-hour argument with my friend and roommate Deb last night that went absolutely nowhere, and now I need a third opinion because neither of us is backing down.

  Backstory: Deb's been on my case for weeks about leaving dishes in the sink and not vacuuming, and fine, fair enough, I could be tidier. But last week her boyfriend Tom mentioned, totally offhand, that Deb's side of his apartment turns into an actual disaster every time she stays over, and that he's basically given up asking her to pick up after herself there too. So the next time she started in on me about the sink I brought it up, like "you're really gonna lecture me about this when Tom says you do the exact same thing at his place?" And she didn't even deny it, she just said "ok, but that doesnt make you not messy, the dishes are still piling up because of you, that part's still just true." Which, annoyingly, it is.

  Here's where we got stuck. Deb thinks that since her complaint about me is factually accurate, it doesn't matter at all that she does the exact same thing herself somewhere else — a true statement is a true statement no matter who's saying it. I think that's too fast, because there's something that feels genuinely different about being called out by someone who holds themselves to the standard they're enforcing versus someone who obviously doesn't, even when the actual words coming out of their mouth are identical either way. Like, "you're messy" being true, and whether Deb specifically has any business being the one to say it to me, feel like two separate questions to me, but I couldn't explain why beyond "it just feels different," and we went in circles on this for like two hours without either of us budging an inch. So: does someone being a hypocrite actually weaken their position when they call you out for something, over and above just making them more annoying about it, or is "you do it too" always just a dodge that doesn't actually touch the original criticism? Genuinely want a real answer here, not a "you're both valid" cop-out.
