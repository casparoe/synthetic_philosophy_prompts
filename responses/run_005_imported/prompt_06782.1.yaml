prompt: |-
  I'm prepping for a podcast interview next week (part of a mini-series we've been doing on AI and philosophy) with a philosopher who consults on AI alignment and has been making the rounds arguing that the right way to settle "whose values" a model should encode isn't polling users or letting engineers eyeball it, but literally running a Rawlsian veil-of-ignorance exercise -- ask people what principles they'd want a system to follow if they didn't know whether they'd end up rich, poor, in the religious majority or minority, etc, and bake those principles in instead of raw aggregated preferences. I vaguely remember an actual DeepMind study from a couple years back that tried something like this on a toy resource-allocation AI and found people behind the veil picked fairness-first principles over pure efficiency ones -- could be misremembering the specifics, but shes probably going to bring it up regardless so it'd help to be ready either way.

  Can you draft me 8-10 interview questions, each with a quick follow-up keyed to whatever answer she's likely to give, that go past her just re-pitching the idea? I want at least one question that presses on the fact that Rawls built the veil for citizens of one bounded society hammering out a shared basic structure, not for a single global product used by people with flatly incompatible conceptions of the good -- does that disanalogy actually sink the argument or not. One on the fact that Harsanyi ran essentially the same setup and derived straight average-utilitarian aggregation out of it while Rawls got maximin, so what actually stops "the veil" from just smuggling in whatever conclusion its designer wanted under cover of neutrality. One on whether "neutrality" is even a coherent goal once the model has to rule on contested questions constantly, one query at a time, in practice. And one on how her proposal is really different from Yudkowsky's old coherent-extrapolated-volition pitch, which promised more or less the same "what humanity would choose if it were wiser" payoff twenty years ago and never got anywhere near implemented. End with a question that asks her to name one real, current alignment decision her approach would actually settle differently than however labs do it now -- concretely, not hypothetically.
