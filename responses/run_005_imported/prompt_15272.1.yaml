prompt: |-
  ok so in my decision theory seminar we just went over Good's theorem — that a Bayesian agent should always want to peek at a free experiment before acting, since the expected value of information can never be negative. but for my econ of info class this week we're reading Hirshleifer on how information can wreck insurance markets, like if everyone's risk type got revealed before they signed contracts the whole pooling arrangement collapses and people end up worse off then they would've been under ignorance. that seems like a straight up counterexample to Good's theorem to me?? is one of my professors just wrong here, or are they using "value of information" to mean two totally different things and nobody's bothered to point that out
