  ## The Rule of Thirds

  The corridors of Sunset Pines Memory Care weren't highways, but to Clara, the Charge Nurse, they felt just as endless and repetitive. Especially tonight. Especially with Mr. Henderson.

  Arthur Henderson, once a professor of logic, now resided in the labyrinth of his own fading mind. His particular dementia manifested in recurring, identical moments of profound distress. He’d wake, convinced he was late for a crucial lecture, trapped in a strange building. Panic would seize him – the same frantic pacing, the same choked pleas to "find the hall," the same tremor in his hands. These episodes weren't just similar; to Arthur, trapped in the perpetual present of his condition, *they were the same moment*, recurring endlessly. And Clara, or whichever nurse found him, was the variable.

  Before his decline accelerated, Arthur, clinging to the rigor of his old life, had devised a protocol with his son and Dr. Vance. "The Rule of Thirds," they called it. Sedation carried risks – increased confusion, falls. But unchecked panic was its own danger. Arthur, foreseeing the identical crises, argued for a probabilistic approach: intervene with sedation only two-thirds of the time. "Otherwise," he’d reasoned with chilling clarity, "you might sedate too often out of immediate compassion, or not enough out of immediate caution. A pre-commitment averages the outcomes."

  Clara had the protocol memorized, a cold algorithm etched onto her heart: *For each identical distress event: 66.7% chance administer low-dose sedative. 33.3% chance use verbal reassurance/redirection only. Decision must be consistent per episode presentation, not cumulative history.* Because Arthur, in the throes, *had* no cumulative history. Each episode was islanded in his perception.

  **First Junction: 10:47 PM.**

  Clara found Arthur by the deserted activities room, a ghost in paisley pajamas, clawing at a locked door. "They're waiting! The dean... the students... I can't be late again!" His eyes, wide and terrified, reflected the sterile hallway lights. This was the moment. Identical to the last. Identical to the one that would inevitably follow.

  Her *planning self*, the one who’d sat in Dr. Vance’s office nodding solemnly, knew the math. Two out of three. A die roll in her mind landed on *sedate*. The rational choice, averaged over the long run of identical moments. Best for Arthur *in aggregate*.

  But her *in-the-moment self* stood frozen. This Arthur wasn’t a statistic. He was a terrified man she’d known for three years, who used to bring her obscure logic puzzles printed on index cards. She saw the tremor, heard the raw fear. *Sedate him. It’s the rule. It’s statistically sound.* The vial in her pocket felt heavy, cold. *But look at him. Right now. Can a number justify this? What if this is the 'one-third' where reassurance could work? What if the sedation makes tomorrow worse?*

  The gap between the planner and the actor yawned wide, a chasm filled with Arthur’s ragged breathing. The protocol demanded consistency *because* the moments were indistinguishable. To deviate now, swayed by the raw immediacy of *this* particular terror, would betray the whole logic. If she comforted him now because *this* panic felt uniquely awful (though it wasn’t), what would she do next time, when it felt exactly the same? The rule existed *because* she couldn’t tell the moments apart.

  Gritting her teeth against a surge of protective instinct, Clara approached. "Professor Henderson? It's Clara. The lecture… it's been rescheduled. Tomorrow afternoon. Let's get you back to your room, get some rest for it." Her voice was gentle, but her hand dipped into her pocket, drawing out the syringe. Arthur flinched, a fresh wave of confusion washing over his panic. "Rescheduled? But... the notes..."

  "It's handled, Professor," Clara murmured, her heart a stone as she administered the dose. The fight seeped out of him quickly, replaced by a slack, vacant drowsiness. She guided his suddenly pliant body towards his room, the weight of the 'correct' statistical decision settling on her shoulders like lead. It felt like betrayal.

  **Second Junction: 3:22 AM.**

  The call light blinked insistently over Room 12. Arthur. Again. Clara walked the familiar path, the echo of her own footsteps a monotonous drumbeat. She found him in the identical pose, by the identical locked door (the fire exit near the linen closet this time), voicing the identical pleas. "The hall... must find the lecture hall... late, so late..." The tremor, the wide eyes, the sheer, indistinguishable panic – a perfect replica.

  Her *in-the-moment self* screamed. *Not again. So soon. The sedation barely wore off. Look at him! It’s cruel.* The memory of his slack, drugged face hours ago was visceral. The planner’s voice countered, cold and insistent: *First intervention: sedate. That was one. Statistically, this is likely the time to comfort. 33.3% chance. Stick to the rule. It balances.* The mental die rolled. *Comfort.*

  Relief, warm and immediate, flooded Clara. *Yes! This time, I can help him properly.* She stepped forward, her voice radiating practiced calm. "Professor Henderson? Clara here. Deep breaths. The lecture's been postponed, remember? Bad weather up north, the guest speaker’s flight got cancelled. Whole department’s rescheduling. Let's get you a warm drink, hm? Chamomile?"

  Arthur turned, his eyes swimming with confusion, but the raw edge of panic seemed to soften for a microsecond. "Cancelled? But... my notes..."

  "Safe in your office," Clara soothed, gently taking his elbow. "Come on, let's get that tea. Big day tomorrow rescheduling everything, you'll need your rest." She steered him away from the door. He shuffled beside her, muttering about syllabi and flight delays, the terror momentarily banked by the plausible fiction. No prick, no chemical oblivion. Just words, presence, a shared fiction in the endless, identical night. It felt like victory. Like genuine care.

  She settled him with tea, watching the tremors slowly subside under the influence of warmth and the fragile anchor of her story. *This was right,* she thought fiercely. *This time, it was right.*

  **The Gap.**

  As she walked back to the nurses' station, the relief curdled. The planner’s voice, silenced in the heat of the moment, returned with icy clarity. *That was the second junction. You comforted. But the rule said: intervene 2/3 of the time. You intervened once (sedate) and comforted once. That’s 50%. Not 66.7%. You undershot the pre-commitment.*

  A cold dread seeped in. Had she just failed the protocol? Had her *in-the-moment* compassion – her perfectly understandable desire to avoid sedation twice in one night – actually violated the statistically optimal path? The path designed *for Arthur’s own long-term good*?

  She pictured the next episode. Dawn, probably. Arthur, again by a locked door, again consumed by the same terror. Her hand would hover over the syringe. The planner would calculate: *Two episodes so far: one sedation, one comfort. This is the third. To hit the 2/3 average, you MUST sedate now.* 66.7% demanded it.

  But her *in-the-moment* self would look at Arthur, trembling in the grey morning light, and remember the relative success of the chamomile just hours ago. *Why sedate now? Comfort worked last time!* The identical presentation would scream for identical treatment, *this* treatment, the one that felt humane just a short while ago. Yet the protocol, the cold, pre-committed logic, would demand the needle. To *average* out the undershoot.

  Clara slumped at the desk, the laminated "Rule of Thirds" protocol gleaming under the desk lamp. She traced the printed percentages with a finger. The perfect, rational plan, conceived in the calm light of foresight. And then there was the reality: the indistinguishable terror in Arthur's eyes each time, the weight of the syringe, the fleeting warmth of chamomile steam, the crushing guilt of either choice when viewed through the lens of the other.

  The identical doors stretched down the corridor, vanishing into shadow. Behind each one, sooner or later, Arthur Henderson waited, trapped in the same moment. And Clara would walk towards him, every time, holding both the planner's perfect, rational dice and the actor's unbearable, immediate burden, forever stranded in the gap between what was planned and what simply *was*. The only certainty was the next junction, and the choice that could never feel right both ways.
