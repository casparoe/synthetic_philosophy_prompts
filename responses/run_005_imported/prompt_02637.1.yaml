  The user might benefit from seeing how this fits Moore's larger project: he's painstakingly mapping value relationships to avoid naturalistic fallacies. What feels like a weird claim is really Moore being ruthlessly consistent with his isolation test. The takeaway isn't that bodies matter more than minds, but that human connection requires embodied presence for full ethical significance. 

