answer: |-
  You're right to find this passage challenging—Moore *is* making a counterintuitive claim, but it's driven by his strict application of the **isolation test** and **organic unities doctrine**. Let's reconstruct his argument step-by-step and assess its implications:

  ### Core Argument in Section 122:
  1.  **Premise 1 (Empirical Observation):**  
      In all *actual* valuable personal affection, the object includes **BOTH**:
      *   The admired mental qualities (character, intellect, etc.) *and*
      *   Their "appropriate corporeal expression" (appearance, voice, gestures, actions).

  2.  **Premise 2 (Value Judgment via Isolation Test):**  
      *   **Attempted Abstraction:** Try to imagine *only* appreciating someone's mental qualities, *completely divorced* from any physical manifestation (looks, voice, actions). Moore admits this is very difficult.
      *   **Result of Abstraction:** When we succeed in imagining this purely mental appreciation, the resulting state appears to have **less intrinsic value** than the whole state that includes appreciation of the physical expression.

  3.  **Premise 3 (Comparison to Aesthetic Appreciation):**  
      *   We can more easily appreciate "mere corporeal beauty" (e.g., a beautiful landscape, an anonymous face) *in isolation*.
      *   Moore asserts this isolated appreciation of physical beauty **undoubtedly possesses significant intrinsic value**.

  4.  **The Key Claim (Doubt & Comparison):**  
      *   Moore expresses *doubt* that the isolated appreciation of mental qualities alone possesses **as much intrinsic value** as the isolated appreciation of mere corporeal beauty.
      *   That is: `Value(Appreciation of Mental Qualities *alone*)` **≤?** `Value(Appreciation of Corporeal Beauty *alone*)`
      *   Importantly, this is *not* comparing mental qualities to looks; it's comparing *the appreciation of each* when considered *in complete isolation*.

  5.  **The Organic Unity Conclusion:**  
      *   The *immense value* of personal affection lies **not primarily** in the high intrinsic value of appreciating mental qualities alone, but in the **organic unity** formed when that appreciation is combined with the appreciation of the *physical expression* of those qualities.
      *   The whole (`Appreciation of Mental Qualities + Appreciation of their Corporeal Expression`) is **vastly superior** to either part alone, and vastly superior to a state lacking either. This whole constitutes the true supreme good of personal affection.

  ### Why It Sounds Weird (And Why It's Not *Quite* What You Think)
  *   **Not Demoting Character:** Moore isn't saying character/mental qualities are *less valuable* than looks. He's saying the *act of appreciating character in complete abstraction from physicality* might be a less valuable *state of mind* than the *act of appreciating physical beauty in isolation*. The *objects* (character vs. looks) aren't being directly compared; the *experiences of appreciation* are.
  *   **Embodiment is Essential:** Moore argues that for personal affection to reach its highest value, the affection must be directed towards an *embodied person*. The physical presence, the smile, the tone of voice, the actions – these aren't just nice extras; they are **constitutive parts** of the valuable whole. Valuing a "disembodied mind" isn't the same as valuing a person.
  *   **Defending Friendship/Love:** Moore *is* putting friendship/love on a pedestal, but he's meticulously defining *what kind* of affection qualifies. His point is that the supreme good isn't an abstract admiration of virtues (like loving Plato's Form of Justice). It's the concrete love for a specific, embodied individual *because of* their character *as expressed through* their body and actions. This embodied affection is the organic unity he deems supremely valuable.
  *   **The "Wild" Claim in Context:** The claim that isolated appreciation of character *might* be less valuable than isolated appreciation of beauty serves two purposes:
      1.  **Emphasizing Embodiment:** It shocks the reader into recognizing how integral the physical expression is to the value of personal affection. We can *imagine* appreciating pure beauty (art, nature); imagining appreciating pure character without embodiment is alien and feels less valuable.
      2.  **Highlighting Organic Unity:** It underscores that the value explosion happens *only* when the two appreciations combine. Neither part alone explains the supreme value of the whole.

  ### Engine of the Argument: Organic Unities
  This **is** absolutely driven by the doctrine of organic unities. Here's how:

  1.  **Component A:** Appreciation of Mental Qualities (in isolation, potentially moderately valuable, possibly less valuable than appreciating beauty).
  2.  **Component B:** Appreciation of Corporeal Expression (in isolation, valuable, as per aesthetic appreciation).
  3.  **The Organic Unity (A+B):** The state of affectionately appreciating mental qualities *through* and *alongside* their physical expression in a specific person.
  4.  **The Key Point:** `Value(A+B)` **>>** `Value(A) + Value(B)`
      *   The whole is *vastly more valuable* than the simple sum of the values its parts would have in isolation. This synergistic effect is the hallmark of an organic unity.
      *   Moore argues that the immense value of personal affection resides *in this specific combination*, not primarily in the high intrinsic value of appreciating mental qualities alone (Component A).

  ### Is it Weird? Yes and No
  *   **Yes:** It *is* counterintuitive to suggest that appreciating someone's kindness in the abstract *might* be a less valuable state of mind than appreciating a sunset. Our intuition rebels because we know character is "deeper" than looks. Moore is forcing us to confront his strict methodological isolation.
  *   **No (In Moore's Framework):**
      *   It makes sense within his *isolation test*. Pure mental qualities, stripped of any sensory or emotional connection via physicality, *are* abstract and cold. Physical beauty, by its nature, is directly perceptible and pleasurable in isolation.
      *   It powerfully defends the *concrete, embodied nature* of valuable personal relationships. Love isn't for abstract virtues; it's for *this person*, flesh and blood, expressing their character through their being.
      *   It doesn't diminish the supreme value of personal affection; it explains *why* that specific whole (embodied affection) is supreme by showing how its value transcends the value of its abstracted parts.

  ### In Summary
  Moore argues:
  1.  Truly valuable personal affection *requires* appreciation of both mental qualities *and* their physical expression.
  2.  When we isolate the appreciation of mental qualities alone (very difficult), it seems less valuable than we might expect, possibly even less valuable than appreciating mere physical beauty in isolation.
  3.  However, this is **not** because character is less important than looks. It's because:
      *   The isolated appreciation of mental qualities is an impoverished abstraction.
      *   The supreme value of personal affection arises **only** in the **organic unity** where appreciation of character is intrinsically linked to and enhanced by appreciation of its physical manifestation in the beloved person.
      *   The whole (`embodied personal affection`) is infinitely more valuable than the sum of its abstracted parts (`appreciation of character alone` + `appreciation of looks alone`).

  You're reading charitably; it *is* a striking claim. But its purpose is to rigorously defend the *embodied, concrete* nature of the supreme good of personal affection using his core methodological tools (isolation test, organic unities). He's not demoting character; he's insisting that for affection to be supremely valuable, character must be loved *in and through* the living, breathing person.
