  ## Memorandum: Recommendation Regarding the Corwin Ashby Bridge Naming Proposal

  **To:** Monuments and Public Naming Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Naming Downtown Pedestrian Bridge for Major General Corwin Ashby  

  ### I. Introduction
  This memorandum addresses the proposal to name the new downtown pedestrian bridge in honor of Major General Corwin Ashby. Central to this deliberation is Ashby’s decision during the [Specify War, e.g., "late stages of the Global Conflict"] to deliberately target civilian infrastructure (water mains, canal locks, grain depots) in an enemy capital, resulting in an estimated 19,000 civilian deaths from starvation, exposure, and disease. The commission is divided, with arguments citing Ashby’s overall service and potential lives saved versus the inherent moral character of this specific action. Elizabeth Anscombe’s ethical framework, articulated in her critique of similar actions, provides a critical lens for evaluating this choice.  

  ### II. The Moral Framework: Anscombe’s Distinction
  Elizabeth Anscombe’s core argument, relevant here, hinges on the **intention behind an act**, not merely its consequences. She contends:  
  *   **Intending Evil as a Means:** Deliberately killing innocent civilians *as the mechanism* to achieve a military objective (e.g., forcing surrender by making survival impossible) constitutes murder, regardless of the ultimate outcome.  
  *   **Foreseeing Evil as Side Effect:** Causing civilian deaths while *genuinely* targeting a military objective (e.g., bombing a munitions plant knowing nearby civilians will die) is distinct, though still grave. The moral evaluation differs.  
  *   **Consequences vs. Intrinsic Wrong:** If the act itself is intrinsically wrong (murder), the fact that it *may* have saved lives elsewhere does not morally justify it. The good outcome cannot cleanse the inherently evil means.  

  ### III. Applying Anscombe’s Framework to Ashby’s Decision
  1.  **Ashby’s Intention:** Ashby’s memoir explicitly states his intention: to force surrender by *directly attacking the population's ability to survive* ("unable to feed or warm itself"). The means chosen was the infliction of mass civilian suffering and death. Rail yards and munitions plants were deliberately bypassed for targets essential to civilian life.  
  2.  **Anscombe’s Judgment:** Under Anscombe’s framework, this constitutes **intending the death and suffering of civilians as the chosen means to an end.** The deaths were not a foreseen but unintended side effect; they were the *instrument* of the strategy. Therefore, Ashby’s action would fall under Anscombe’s definition of **mass murder**, irrespective of its ultimate effectiveness or the net lives potentially saved.  
  3.  **The Question of Net Lives Saved:**  
      *   **If the Campaign Saved Net Lives:** Proponents argue Ashby’s decision potentially averted a costlier invasion. *However, Anscombe’s argument renders this largely irrelevant to the moral classification of the act itself.* If intentionally killing innocents as a means is murder, then even if it demonstrably saved a million lives, it remains murder. The moral prohibition is absolute.  
      *   **Uncertainty of Net Lives Saved:** Historical debate persists regarding the campaign’s actual effectiveness in hastening surrender. This uncertainty weakens the utilitarian defense but, crucially, *does not strengthen the moral defense under Anscombe’s view*. The moral wrong lies in the *choice of means*, not solely in its miscalculation.  

  ### IV. The Case for Naming the Bridge (Acknowledged)
  *   **Distinguished Military Service:** Ashby’s overall military career, potentially spanning decades and other theaters, may include acts of significant courage, leadership, and adherence to the norms of warfare. Honoring this broader record is a valid consideration.  
  *   **Local Hero Status:** Ashby’s connection to the city and his status as a local figure of historical significance are factors in public commemoration.  
  *   **Belief in Net Benefit:** The sincere belief held by some, based on historical analysis, that the campaign ultimately saved lives provides a powerful emotional and pragmatic argument for commemoration.  

  ### V. Analysis: Can Ashby Be Honored Despite Anscombe’s Judgment?
  Anscombe’s framework presents a profound challenge:  
  *   **The Act is Indelible:** The decision to target civilians directly as a weapon is a singularly grave act within Ashby’s record. Under Anscombe’s logic, this act cannot be morally outweighed by prior or subsequent service, nor by its consequences. It stands as a fundamental violation.  
  *   **The Nature of Public Commemoration:** Naming a public bridge is an unambiguous civic honor. It signifies endorsement and celebration. Honoring Ashby *without qualification* risks endorsing or minimizing the moral transgression identified by Anscombe, regardless of other achievements.  
  *   **The "Whole Story" Argument:** The commission’s duty is not merely to tally lives potentially saved versus lost, but to consider the *character* of the actions commemorated. Anscombe forces us to confront that deliberately making civilians the *target* of destruction crosses a fundamental line, making a "net lives saved" calculation morally insufficient justification for the act itself, and potentially problematic for unqualified commemoration.  

  ### VI. Recommendation: The Middle Path – Commemoration with Context
  Honoring Ashby’s broader service while acknowledging the profound moral failure of his specific decision demands nuance. An unqualified naming risks endorsing the latter; outright refusal risks erasing the former and avoiding necessary public reckoning. Therefore, I recommend:  

  **Name the bridge, but incorporate immediate, prominent, and unflinching contextualization.**  

  **Proposed Implementation:**  
  1.  **Name:** The Corwin Ashby Bridge.  
  2.  **Plaque Text:** Install a substantial, permanently affixed plaque at *each* entrance to the bridge. The text should clearly state:  
      *   Ashby’s military rank and local connection.  
      *   The *specific nature* of his controversial command decision: "In the final months of the [War Name], Major General Ashby ordered the strategic bombing of civilian infrastructure essential for survival – including water mains, canals, and food supplies – in [Enemy Capital]. His stated intent was to force surrender by inducing mass civilian suffering."  
      *   The *consequence*: "This campaign resulted in the estimated deaths of 19,000 civilians from starvation, exposure, and disease during the winter of [Year]."  
      *   The *ongoing debate*: "Historians continue to debate the campaign's military effectiveness and its role in ending the war."  
      *   The *moral challenge*: "This decision remains the subject of profound ethical debate concerning the conduct of war and the protection of non-combatants."  
      *   **Crucially, include a quote from Ashby’s memoir** explicitly stating his reasoning for targeting civilian survival, demonstrating the *intentionality* central to Anscombe’s critique.  

  **Why this recommendation?**  
  *   **Acknowledges Complexity:** It avoids a simplistic "hero" or "villain" narrative, reflecting the uncomfortable reality of history and war.  
  *   **Engages Anscombe Directly:** By explicitly stating Ashby’s *intent* and the *means* chosen, the plaque forces the public to confront the ethical dilemma Anscombe articulated, making the doctrine of double effect tangible.  
  *   **Honors Service with Candor:** It allows recognition of Ashby’s local significance and military career while refusing to whitewash its most morally contested chapter.  
  *   **Educational Value:** It transforms the bridge into a site of civic learning, prompting reflection on the costs of war, leadership responsibility, and enduring ethical questions.  
  *   **Addresses Commission Concerns:** It provides a path forward for those wishing to honor service while respecting the deep objections rooted in the nature of the act itself.  

  ### VII. Conclusion
  Elizabeth Anscombe’s argument compels us to recognize that Major General Ashby’s decision to target civilian survival constitutes an act that, on her terms, is intrinsically wrong – murder – irrespective of its consequences. This makes unqualified commemoration ethically problematic. However, his broader service and local significance warrant recognition. The recommended approach – naming *with* explicit, contextualizing education – allows the city to acknowledge both the complexity of its history and the gravity of the ethical questions involved. It honors memory without sanitizing history and invites the public to engage with the difficult realities of war and moral choice.  

  I move that the Commission adopt this recommendation for the naming and plaque text as outlined.  

  **Recommended Vote:** FOR naming with contextual plaque.  

  ---  

  **Key Strengths of this Approach for Your Role:**  
  1.  **Directly Engages Anscombe:** The analysis and plaque language center on intention and means, not just outcomes.  
  2.  **Takes Pro-Naming Arguments Seriously:** Acknowledges service record, local hero status, and potential net lives saved without letting them erase the moral problem.  
  3.  **Answers the "Net Lives" Question:** Explicitly states that under Anscombe's view, net lives saved don't change the moral character of the act, but the plaque still allows the utilitarian argument to be presented (via historical debate).  
  4.  **Provides a Clear, Actionable Recommendation:** The middle path is specific and implementable.  
  5.  **Balances Respect with Honesty:** Respects Ashby's service and proponents' views while being honest about the moral transgression.  
  6.  **Promotes Civic Discourse:** Turns the bridge into a catalyst for reflection on ethics and history.  

  This memo provides a principled foundation for the upcoming vote, grounded in the specific ethical concern you identified as central.
