answer: |-
  You're absolutely right to press on the nuances—the "folk theorem" oversimplifies Harsanyi's result. Let's walk through the mechanics of Harsanyi's Impossibility Theorem (1955) step-by-step, highlighting where Pareto indifference alone fails and what stronger assumptions add. We'll use the standard proof structure.

  **Setup:**
  - `n` individuals, each with vNM-rational preferences over lotteries `L`.
  - Individual `i` has vNM utility function `U_i : L → ℝ`. (`U_i` is unique up to positive affine transformations: `U_i' = a_i * U_i + b_i`, `a_i > 0`).
  - Social preference over `L` is vNM-rational with utility function `W : L → ℝ` (also unique up to positive affine transformations).
  - **Pareto Indifference (PI):** If `U_i(L) = U_i(L')` for all `i`, then `W(L) = W(L')`.
  - **Strict Pareto (SP):** If `U_i(L) ≥ U_i(L')` for all `i` and `U_j(L) > U_j(L')` for some `j`, then `W(L) > W(L')`.

  **The Core Proof (Using PI Alone):**
  1.  **Linearity of `W` in `U_i`s:** Fix a reference lottery `L_0` with `W(L_0) = 0` and `U_i(L_0) = 0` for all `i` (achievable by affine shifts). Consider lotteries where only outcome `x` occurs with certainty. Define `u_i(x) = U_i(x)`, `w(x) = W(x)`. By vNM, for any lottery `L = (p_1, x_1; ...; p_m, x_m)`, we have:
      ```
      U_i(L) = Σ_k p_k * u_i(x_k)
      W(L) = Σ_k p_k * w(x_k)
      ```
  2.  **Pareto Indifference Implies Linear Dependence:** Suppose there are `m` pure outcomes (`x_1` to `x_m`). Consider the vectors:
      - `u(x) = (u_1(x), u_2(x), ..., u_n(x))` for each outcome `x`.
      - `w(x)` is a scalar for each `x`.
      PI implies: **If `Σ_k p_k * u(x_k) = 0` (component-wise for all individuals), then `Σ_k p_k * w(x_k) = 0`.** This means `w(x)` is *linearly dependent* on the `u_i(x)` functions. Formally, `w` lies in the span of `{u_1, u_2, ..., u_n}` over the space of outcomes. Therefore, there exist weights `c_1, c_2, ..., c_n` such that for *any* pure outcome `x`:
      ```latex
      w(x) = \sum_{i=1}^{n} c_i u_i(x)
      ```
  3.  **Affine Combination for Lotteries:** By linearity of vNM utility, for *any* lottery `L`:
      ```latex
      W(L) = \sum_k p_k w(x_k) = \sum_k p_k \left( \sum_{i=1}^{n} c_i u_i(x_k) \right) = \sum_{i=1}^{n} c_i \left( \sum_k p_k u_i(x_k) \right) = \sum_{i=1}^{n} c_i U_i(L)
      ```
      **Result (Using PI Alone):** `W(L) = \sum_{i=1}^{n} c_i U_i(L)` for some constants `c_i`.

  **Addressing Your Questions:**

  **(a) Where Pareto Indifference Alone Fails to Constrain the Sign of the Weights (`c_i`)**

  *   **The Failure:** PI *only* constrains `W` when individuals are *indifferent*. It says nothing about situations where individuals *disagree* or strictly prefer one lottery over another.
  *   **Mechanics:** The weights `c_i` emerge from solving the system of linear dependencies implied by PI (Step 2). Linear algebra tells us that such weights exist, but **it places no restriction on their signs**. A negative `c_i` simply means the social preference moves *against* individual `i`'s utility.
  *   **Example:** Consider two individuals (A, B) and two outcomes (X, Y). Suppose:
      *   `u_A(X) = 1, u_A(Y) = 0`
      *   `u_B(X) = 0, u_B(Y) = 1`
      PI requires:
      *   If `U_A(L) = U_A(L')` and `U_B(L) = U_B(L')`, then `W(L) = W(L')`.
      *   Specifically, the lottery `pX + (1-p)Y` vs. `qX + (1-q)Y`: If `p = q`, then `W` must be equal.
      *   Now consider pure outcomes. The system `w(X) = c_A * 1 + c_B * 0 = c_A` and `w(Y) = c_A * 0 + c_B * 1 = c_B` must hold. PI doesn't force `c_A` or `c_B` to be positive. Let `c_A = 1`, `c_B = -1`. Then:
          *   `W(X) = 1` (A happy, B neutral)
          *   `W(Y) = -1` (A neutral, B happy) -> Society *dislikes* B being happy!
          *   PI is satisfied: Only if `U_A(L)=U_A(L')` *and* `U_B(L)=U_B(L')` is indifference required. E.g., `L = X` (`U_A=1, U_B=0`) vs. `L' = Y` (`U_A=0, U_B=1`): `U_A(X) ≠ U_A(Y)` and `U_B(X) ≠ U_B(Y)`, so PI imposes *no constraint* on whether `W(X) > W(Y)`, `W(X) < W(Y)`, or `W(X)=W(Y)`. Our `W(X)=1 > -1=W(Y)` is allowed, even though it strictly *punishes* B's happiness relative to A's.

  **(b) What the Stronger Pareto Condition Adds (Forcing `c_i ≥ 0`)**

  *   **The Addition:** Strict Pareto (SP) requires society to strictly prefer `L` over `L'` if at least one individual strictly prefers it and no one is worse off.
  *   **The Fix:** SP directly conflicts with negative `c_i`.
  *   **Mechanics:** Suppose some `c_j < 0`. Consider two lotteries:
      *   `L`: Gives individual `j` a utility `K > 0` higher than in `L_0`, and gives all *other* individuals `i ≠ j` exactly the *same* utility as in `L_0` (`U_i(L) = 0`).
      *   `L_0`: The reference lottery (`U_i(L_0) = 0` for all `i`).
      *   By construction: `U_j(L) = K > 0 = U_j(L_0)`, and `U_i(L) = 0 = U_i(L_0)` for all `i ≠ j`. SP demands `W(L) > W(L_0)`.
      *   Now calculate `W`:
          ```latex
          W(L_0) = \sum_{i} c_i U_i(L_0) = \sum_{i} c_i * 0 = 0
          W(L) = \sum_{i} c_i U_i(L) = c_j * K + \sum_{i \neq j} c_i * 0 = c_j K
          ```
      *   Since `c_j < 0` and `K > 0`, `W(L) = c_j K < 0 = W(L_0)`. This implies `W(L) < W(L_0)`, **contradicting** the requirement `W(L) > W(L_0)` from SP.
  *   **Result:** SP is incompatible with any negative `c_i`. Therefore, under SP, **`c_i ≥ 0` for all `i`**. (Note: SP also implies PI, so the affine combination form is already established).

  **(c) Why Interpersonal Comparability Isn't Resolved (Even with `c_i ≥ 0`)**

  *   **The Core Issue:** vNM utility functions are only unique up to individual positive affine transformations (`U_i' = a_i * U_i + b_i`, `a_i > 0`). The weights `c_i` depend on the *arbitrary scaling* chosen for each `U_i`.
  *   **Mechanics:** Suppose we rescale individual `i`'s utility: `U_i' = a_i U_i + b_i` (`a_i > 0`). To keep the social welfare function `W` representing the *same* social preferences, we must compensate by rescaling its weights. The original `W = \sum_j c_j U_j` must transform into `W' = \sum_j c_j' U_j'` representing identical preferences.
      *   Substitute `U_j'`:
          ```latex
          W' = \sum_j c_j' (a_j U_j + b_j) = \sum_j (c_j' a_j) U_j + \sum_j c_j' b_j
          ```
      *   The term `\sum_j c_j' b_j` is a constant (affine shift), irrelevant for preference representation. The key term is `\sum_j (c_j' a_j) U_j`.
      *   For `W'` to represent the *same* preferences as the original `W = \sum_j c_j U_j`, the coefficients must be proportional: `c_j' a_j = k * c_j` for all `j` and some `k > 0`.
      *   Solving for the new weights: `c_j' = k * (c_j / a_j)`.
  *   **The Indeterminacy:** The *relative* sizes of the weights `c_i` change when we rescale individual utilities (`a_i`). There is **no invariant meaning** to `c_i > c_j`. We can make `c_i'` arbitrarily larger or smaller than `c_j'` by changing the scales `a_i` and `a_j` of the individual utility functions. Crucially, **we can always normalize the `c_i` to sum to 1 (or any positive constant) by adjusting the `a_i`'s**, without changing the underlying preferences.
  *   **Sen's Point (The "Zeroing" Problem):** Harsanyi's framework lacks a natural, interpersonally comparable zero point for utility. The constants `b_i` (`U_i' = a_i U_i + b_i`) shift the individual zero points arbitrarily. Combined with the scaling freedom (`a_i`), this makes the *levels* and *differences* of utilities across individuals incomparable within the vNM framework. The affine combination `W = \sum c_i U_i` is invariant only up to the *joint* affine transformations of the individual utilities, destroying any cardinal interpersonal meaning for the weights `c_i`. A weight `c_i = 2 * c_j` tells us nothing about the relative moral importance of individual `i` vs. `j`; it could simply mean we measured `U_i` on a scale twice as large as `U_j`.

  **Summary:**

  1.  **Pareto Indifference (PI)** alone forces social utility `W` to be an affine combination of individual utilities `\sum c_i U_i`, but **allows `c_i` to be negative** because it only constains social indifference when *all* individuals are indifferent, not how society trades off conflicting preferences.
  2.  **Strict Pareto (SP)** adds the requirement that society must strictly prefer a lottery if at least one individual does and no one loses. This **forces `c_i ≥ 0`** because a negative `c_i` would make society dislike an improvement for `i` that harms no one else.
  3.  **Interpersonal Comparability is NOT Achieved** because the vNM utility functions `U_i` are only defined up to independent positive affine transformations (`U_i' = a_i U_i + b_i`). The weights `c_i` transform as `c_i' = k * (c_i / a_i)` under this rescaling. The *relative magnitudes* `c_i / c_j` have no invariant meaning across different choices of scales (`a_i, a_j`) for the individual utility functions. The theorem provides a *mathematical form* for aggregation (`W = \sum c_i U_i`) but **does not pin down the `c_i` as meaningful, interpersonally comparable moral weights**. Resolving the `c_i` requires additional, non-vNM assumptions about interpersonal comparisons (e.g., a shared zero point, comparable units), which Harsanyi's theorem itself does not supply. This is the core of Sen's critique: the theorem shows how to aggregate *given* interpersonally comparable utilities, but doesn't solve the problem of *establishing* that comparability in the first place.
