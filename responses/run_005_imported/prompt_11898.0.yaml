  Right, let's reconstruct Mill's actual position first. His 1871 Autobiography passage is crucial: "the social problem of the future" as worker-managed industry replacing wage labor. But equally important is what he rejected - state ownership unless absolutely necessary. His Principles criticized central planning as creating "despotism." The Rochdale model mattered because it proved worker co-ops could function without state coercion.

