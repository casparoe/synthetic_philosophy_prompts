prompt: |-
  hey, I'm a phil PhD student (diss chapter on Nietzsche's naturalism) and I keep getting stuck on this bit from Twilight of the Idols, "The Four Great Errors" §1, and would love a sanity check on what he's actually entitled to conclude from it. Here's the passage:

  "There is no more dangerous error than to confound the effect with the cause: I call this error the intrinsic perversion of reason. [...] Let me give you an example. Everybody knows the book of the famous Cornaro, in which he recommends his slender diet as the recipe for a long, happy and also virtuous life. [...] I do not doubt that there is scarcely a single book (the Bible of course excepted) that has worked more mischief, shortened more lives, than this well-meant curiosity. The reason of this is the confusion of effect and cause. This worthy Italian saw the cause of his long life in his diet: whereas the prerequisites of long life, which are exceptional slowness of molecular change, and a low rate of expenditure in energy, were the cause of his meagre diet. He was not at liberty to eat a small or a great amount. His frugality was not the result of free choice, he would have been ill had he eaten more."

  In the very next section he generalizes this: "his virtue is the consequence of his good constitution [...] virtue itself is on the contrary that retardation of the metabolic process which, among other things, results in a long life and in plentiful offspring, in short in Cornarism."

  Ok heres my problem. He wrote this within weeks of Ecce Homo, where he says "these trivial matters—diet, locality, climate, and one's mode of recreation, the whole casuistry of self-love—are inconceivably more important than all that which has hitherto been held in high esteem" (EH, "Why I Am So Clever," §10), and then spends pages giving very deliberate advice about what to eat, where to live, when to work, like these are things a person figures out and gets right or wrong through their own effort.

  But the whole point of the Cornaro bit is that Cornaro was wrong to think his diet was something he'd chosen or achieved through insight - it was just a readout of his metabolism, no agency involved anywhere. So is Nietzsche's own advice-giving persona in Ecce Homo just repeating Cornaro's exact mistake? Or is there a way of reading the physiology-as-destiny picture from the Errors passage that still leaves room for the kind of deliberate self-experimentation he's obviously recommending everywhere else? Not looking for a "he's just being loose with language" cop-out, I think theres a real question here about whether his naturalism can accommodate any coherent notion of self-cultivation at all, and I can't work out how he'd answer it.
