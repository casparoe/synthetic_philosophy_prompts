prompt: |-
  Been rereading Eliezer's old quantum physics sequence and I keep getting stuck on the locality bit. He argues pretty confidently that many-worlds is a fully local theory, and that Bell's theorem never actually proves nonlocality - it just rules out theories where measurements have a single, definite outcome produced locally. But most other explanations of Bell's theorem I've run into just treat it as ruling out local theories, full stop, no asterisks. Are these two claims actually compatible, or is Eliezer quietly redefining "local" so MWI sneaks in under the wire? I vaguely remember the locality condition in Bell's proof is actually a bundle of two seperate assumptions (parameter independence and outcome independence, or something close to that), and that MWI keeps one and drops the other. Is that the actual crux, and if so does dropping outcome independence still deserve to be called "local" in any physically meaningful sense, or is that just semantics? Would love an actual walkthrough of what's going on, not another "shut up and calculate."
reasoning: |-
  Okay, let me try to unpack this user's question. They're confused about how Eliezer Yudkowsky claims that the Many-Worlds Interpretation (MWI) is local despite Bell's theorem seemingly ruling out local theories. The user mentions that most explanations treat Bell's theorem as proving nonlocality, but Eliezer argues it's about single outcomes.

  First, I need to recall Bell's theorem and its assumptions. Bell's theorem shows that no local hidden variable theory can reproduce all quantum predictions. The key is the locality assumption. But as the user pointed out, locality in Bell's context is actually two conditions: parameter independence and outcome independence. 

  Parameter independence means the setting of one measurement device doesn't influence the outcome of another. Outcome independence means the outcome of one measurement doesn't affect the other. Quantum mechanics violates outcome independence but satisfies parameter independence. MWI, by being deterministic and having no single outcome, drops outcome independence. 

  So Eliezer isn't redefining locality; he's separating the assumptions. MWI keeps parameter independence, which ensures no faster-than-light influence, but discards outcome independence because outcomes aren't unique. That's why it's considered local in the sense of no FTL signals. 

  The user is asking if this is just semantics. Physically, parameter independence prevents signaling, which is crucial for relativity. So even without outcome independence, the no-signaling theorem holds. That's a meaningful physical locality. 

  The user also seems frustrated with "shut up and calculate" responses. They want a clear explanation of the assumptions and how MWI fits. I should break down the two independence conditions and explain how MWI satisfies one and not the other. Emphasize that locality isn't a single concept but has nuances. 

  I should also address why other interpretations might seem nonlocal. In collapse theories, measurement outcomes influence distant systems instantly, violating parameter independence. But in MWI, all outcomes exist, so no influence is needed. The appearance of correlation comes from entanglement and decoherence. 

  The user's deeper need might be understanding if MWI's locality claim is legitimate or a trick. By clarifying the two assumptions and how MWI only violates outcome independence, which doesn't allow signaling, it shows that MWI's locality is physically valid. This resolves their confusion about conflicting explanations of Bell's theorem.
answer: |-
  You've hit the nail on the head! This is a subtle and crucial point where Eliezer is *absolutely correct*, and the confusion arises precisely because "locality" in physics often gets used in subtly different ways, and Bell's theorem relies on a very specific bundle of assumptions. Let's break it down step-by-step.

  **1. Bell's Theorem: The Core Argument**

  Bell's theorem proves that **no physical theory can simultaneously satisfy these three conditions:**

  1.  **Completeness:** The theory describes all physical elements relevant to the experiment's outcomes (i.e., no hidden variables *necessary* to complete the description).
  2.  **Locality:** Physical influences do not propagate faster than light. (This is the bundle we need to unpack).
  3.  **Realism (or Single Outcome):** When a measurement is made, there is a single, definite outcome *at that moment*.

  Quantum mechanics (QM) violates **3 (Realism/Single Outcome)**. Hidden variable theories (like de Broglie-Bohm) violate **2 (Locality)**. Bell showed you *must* violate at least one of these three.

  **2. Unpacking the "Locality" Bundle: PI and OI**

  The "locality" assumption in Bell's original proof and derivations like the CHSH inequality is actually composed of two logically distinct sub-assumptions:

  *   **Parameter Independence (PI):** The choice of measurement setting (e.g., which angle Alice chooses to measure her particle's spin) at location A **does not** instantaneously influence the *outcome* of the measurement at location B. Formally: `P(B_outcome | A_setting, B_setting, λ) = P(B_outcome | B_setting, λ)`, where λ represents the complete physical state of the particles at the source. *This is about settings influencing distant outcomes.*
  *   **Outcome Independence (OI):** The specific *outcome* obtained at location A **does not** instantaneously influence the specific *outcome* obtained at location B. Formally: `P(B_outcome | A_outcome, A_setting, B_setting, λ) = P(B_outcome | A_setting, B_setting, λ)`. *This is about outcomes influencing distant outcomes.*

  **Bell's locality assumption is the conjunction of PI + OI.** His theorem shows that QM predictions violate the combination of PI + OI + Realism/Single Outcome.

  **3. What QM (and MWI) Actually Violate**

  *   Quantum Mechanics **violates Outcome Independence (OI)**. The probability of Bob's outcome *does* depend on Alice's outcome, even when spacelike separated. This is the essence of entanglement and Bell inequality violation.
  *   Quantum Mechanics **satisfies Parameter Independence (PI)**. Alice's choice of measurement setting *does not* affect the *statistics* of Bob's outcomes. Bob sees a 50/50 random outcome regardless of what Alice does or what she gets. This is empirically verified and is the foundation of the **No-Signaling Theorem**. Faster-than-light communication is impossible.

  **4. Where MWI Fits In (Eliezer's Point)**

  *   **Many-Worlds Interpretation (MWI):** There is no wavefunction collapse. All possible outcomes of a quantum measurement occur, each in a separate, non-communicating branch of the universal wavefunction. The universe is fundamentally deterministic.
  *   **Violates Realism/Single Outcome:** Obviously. There is no single definite outcome "here" – all outcomes exist across the multiverse.
  *   **Satisfies Parameter Independence (PI):** Just like standard QM. Alice's choice of measurement setting doesn't change the possible outcomes Bob *can* see or their probabilities *within his branch*. She cannot send him a signal.
  *   **Violates Outcome Independence (OI):** Why? Because the *correlation* between outcomes encoded in the entangled state is fundamental. If Alice measures spin-up *in her branch*, then Bob, *in the branch correlated with that outcome*, will measure spin-down. The "influence" isn't causal propagation; it's the deterministic unfolding of the pre-existing global entangled state. Bob's outcome is perfectly correlated with Alice's outcome *within their shared branch history*, but there's no *causal influence* from her outcome event to his outcome event. The correlation was baked in at the source.

  **5. Is MWI "Local"? The Semantics (and Physics) of the Claim**

  *   **Yes, in the Relativistic/Causal Sense:** MWI satisfies **Parameter Independence (PI)**. This is the sub-assumption directly tied to the prohibition on faster-than-light *signaling* and causal influence. Since PI holds, you cannot use entanglement to send information faster than light. MWI is perfectly compatible with Special Relativity's causal structure. **This is the physically most crucial meaning of "locality" for many physicists.**
  *   **No, in Bell's Specific Bundle Sense:** MWI explicitly violates **Outcome Independence (OI)**, which was part of Bell's original "locality" assumption bundle. So, technically, it violates Bell's *formulation* of locality (PI+OI).
  *   **Eliezer's Claim:** When Eliezer says MWI is "local," he means it satisfies **PI (no FTL signaling/influence)**. He argues that OI is *not* a fundamental requirement of locality *itself*, but rather a consequence of demanding **both locality (PI) *and* realism/single outcomes.** He's saying Bell doesn't prove nonlocality (meaning FTL influence/signaling); he proves you can't have *both* FTL signaling prohibition *and* single definite outcomes. MWI keeps the FTL prohibition (PI) and jettisons the single outcome (Realism).

  **6. Why the Confusion? "Nonlocality" is Often Used Loosely**

  Many popular explanations (and even some textbooks) say "Bell proves quantum mechanics is nonlocal." What they *mean* is that QM violates the conjunction (PI+OI) that was part of Bell's local realism framework. They often conflate this with FTL signaling, which it isn't (thanks to PI holding). MWI highlights this distinction by satisfying PI while violating OI *and* Realism.

  **7. The Crux: Outcome Independence vs. Signaling**

  *   **Dropping OI is physically meaningful:** It means the universe contains irreducible, non-classical correlations (entanglement) that aren't mediated by FTL signals. The correlations are global properties of the wavefunction.
  *   **Keeping PI is essential for relativity:** It prevents paradoxes (like signaling backwards in time in some frames) and maintains a consistent causal structure.
  *   **MWI's locality claim is valid:** By satisfying PI and prohibiting FTL signaling, MWI adheres to the core principle of relativistic locality. The violation of OI reflects the non-classical, non-single-outcome nature of quantum reality in MWI, not spooky action-at-a-distance.

  **In Conclusion:**

  1.  **Eliezer is correct:** Bell's theorem proves you cannot have *both* no-FTL-signaling (PI) *and* single definite outcomes (Realism). It doesn't *force* FTL signaling (violation of PI).
  2.  **MWI is local** in the physically crucial sense: It prohibits FTL signaling (satisfies PI). It achieves this by rejecting single definite outcomes (violates Realism) and explaining the correlations via the deterministic evolution of the global wavefunction (violating OI).
  3.  **The bundle is key:** Bell's original "locality" assumption was PI + OI. MWI satisfies PI but violates OI. Eliezer defines "locality" as respecting PI (no FTL signaling). This is a physically meaningful definition, central to relativity.
  4.  **Semantics?** Partly, but crucially: Distinguishing PI from OI clarifies the *physical* content. Dropping OI while keeping PI describes a universe with non-classical correlations but *without* causal FTL influences – a perfectly coherent and local (in the relativistic sense) picture, which is what MWI provides. The "nonlocality" often attributed to QM is the violation of OI *within a framework that assumes single outcomes*, leading to the *appearance* of spooky action. MWI removes that assumption, dissolving the spookiness while preserving no-signaling.

  This isn't sneaking under the wire; it's recognizing that the wire (Bell's locality assumption) had two strands, and MWI cleanly cuts only the strand (OI) tied to the single outcome assumption, leaving the no-signaling strand (PI) intact.
