  Okay, let me start by unpacking the user's query. They're teaching a seminar on personal identity and notice students equating Parfit's reductionism with Buddhist anatta. The user isn't convinced but wants a substantive argument beyond surface differences. They mention not wanting to dismiss it as just "religious baggage," so I need to dive into the philosophical structures of both views.

