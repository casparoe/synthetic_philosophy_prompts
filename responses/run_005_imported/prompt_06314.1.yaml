answer: |-
  Here’s a draft for your sister’s address. It addresses the core tension of moral luck, agent-regret, and responsibility without jargon, while honoring the occasion and offering grounded wisdom:

  ---

  **Charge to the Graduates**

  Faculty, families, friends, and most importantly, the Emergency Medicine Residency Class of [Year] – congratulations. Tonight marks the end of three years that have tested you in ways few outside this room can truly fathom. You’ve learned protocols, procedures, and pharmacology. But more crucially, you’ve learned judgment. How to weigh risks in the fog of uncertainty. How to act decisively when information is incomplete. How to carry the weight of decisions that change lives.

  That weight is real. And tonight, I want to speak honestly about how that weight is measured – because the measure isn’t always fair, or even accurate.

  Think of a moment you’ve witnessed, or maybe even lived. Two physicians. Similar patient, similar presentation, similar clinical crossroads. They make essentially the same call, based on the information and reasoning available *at that critical moment*. For one, the outcome is recovery. Relief. Maybe even praise: "Strong decision." For the other, the outcome is devastating. A bad outcome conference. Quiet notes about "judgment." The *reasoning* was close, perhaps identical. The *outcomes* were worlds apart.

  This isn’t a hypothetical. It’s the air we breathe in EM. It’s the brutal, unspoken curriculum beyond the textbooks.

  So, what do we do with that?

  First: **We cannot let the outcome rewrite the story of the decision.** The universe is chaotic. Biology is unpredictable. Luck – good and bad – is a constant, invisible player in every resuscitation bay, every trauma room. A good outcome doesn’t automatically mean the decision was brilliant. A bad outcome doesn’t automatically mean the decision was flawed. Your training has equipped you to make the *best possible call you can make with what you have in front of you, when you have to make it.* That skill, that honed judgment, that’s the core of what you’ve earned tonight. Don’t let retrospective noise, especially noise driven solely by an outcome you couldn’t control, drown out the value of that process. Scrutinize decisions? Absolutely. Learn from outcomes? Imperative. But anchor that scrutiny in the *context of the moment*, not the benefit of hindsight.

  Second: **This doesn’t mean nothing matters.** That way lies paralysis. It would be a betrayal of the trust placed in us. Your decisions *do* matter. Your skill, your knowledge, your relentless focus on the patient in front of you – these are powerful forces *within* the chaos. You tilt the odds. You save lives that would otherwise be lost. To say "only luck matters" is as false and dangerous as believing luck doesn’t exist at all. You are not spectators. You are actors. What you do counts. Deeply.

  Which brings me to the hardest part. Even when you did everything right – when your reasoning was sound, your actions skilled, your intent pure – and the outcome is terrible… it will *feel* like a weight you carry alone. It’s a different kind of weight than blame. It’s not about fault. It’s about being the one who was *there*, who made the call, who touched that life at the critical juncture. That connection creates a responsibility that isn’t erased by blamelessness. You will feel things – regret, sorrow, a profound sense of "what if" – that someone simply reading the chart later will never feel. And that’s not a sign you did something wrong. It’s a sign of your humanity and your profound connection to your patients. Acknowledge that feeling. It’s part of the cost of truly engaging in this work. Don’t confuse it with failure. Carry it with compassion, for your patient and for yourself.

  So, what’s the charge? It’s not to master luck – you won’t. It’s not to become impervious to the unfairness of outcomes coloring perception – that’s naive. It’s not to shrug off the weight of bad outcomes when you were blameless – that’s inhuman.

  **Your charge is this: Show up anyway.**

  Show up with the courage to make the call when the data is ambiguous.
  Show up with the integrity to scrutinize your *reasoning*, not just your outcomes.
  Show up with the humility to learn, even – *especially* – from cases where the outcome felt cruelly disconnected from your effort.
  Show up with the compassion to hold space for the unique weight you carry when things go badly, even when you did your best.
  Show up with the fierce conviction that your skill and judgment *do* make a difference, even within the vast currents of chance.

  You are stepping into the arena where perfect control is a myth, but where your presence, your skill, and your unwavering commitment are desperately needed. You will be judged unfairly sometimes. Outcomes will haunt you sometimes, even when you don't deserve it. But you will also tilt the odds towards life, towards healing, towards hope, countless times because you *were* there, because you *did* act, because you *did* care.

  Remember the core of why you walked into the ER on day one. Remember the skill you’ve forged. Remember that the weight you feel is a testament to your engagement, not just your burden.

  Go be the doctors you’ve trained so hard to become. The emergency departments of this country need you. Go show up.

  Congratulations, graduates. We are so proud of you.

  ---

  **Why this works:**

  1.  **Centers the Problem:** Directly addresses the core anecdote ("Two physicians... similar call... different outcomes") and explicitly states the unfairness of outcomes retroactively coloring judgment.
  2.  **Avoids Philosophy Jargon:** No "moral luck," "agent-regret," or "constitutive luck." Uses accessible language: "luck," "chaos," "outcome rewriting the story," "weight," "connection," "being the one who was there."
  3.  **Navigates the Two Lies:**
      *   **Against "Fair World":** Explicitly states luck is a constant player, outcomes don't automatically validate/invalidate decisions, unfair judgment will happen. ("Don’t let retrospective noise... drown out...", "You will be judged unfairly sometimes").
      *   **Against "Nothing Matters":** Strongly affirms agency, skill, impact ("Your decisions *do* matter," "You tilt the odds," "You are not spectators. You are actors. What you do counts. Deeply," "your skill and judgment *do* make a difference").
  4.  **Incorporates Williams' Agent-Regret:** Clearly describes the unique feeling ("a different kind of weight," "responsibility that isn’t erased by blamelessness," "regret, sorrow... that someone... will never feel," "part of the cost... sign of your humanity") and separates it from fault/blame. Offers validation and a way to hold it ("Carry it with compassion").
  5.  **Action-Oriented Charge:** Moves beyond just describing the problem to offering a practical, resilient stance: "Show up anyway." Lists concrete ways to embody this (courage, integrity, humility, compassion, conviction).
  6.  **Appropriate Tone & Audience:**
      *   **Respects the Occasion:** Starts and ends with congratulations and pride.
      *   **Validates the Residents:** Acknowledges their unique experience and sacrifice.
      *   **Accessible to Families:** Uses clear language; avoids medical specifics beyond the core example.
      *   **Satisfies the Bioethicist:** The underlying philosophical structure (addressing luck, agency, retrospective evaluation, unique agent-response) is clear without being named.
      *   **EM Spirit:** Captures the essence of EM – courage in uncertainty, acting decisively, embracing chaos.
  7.  **Timing:** Reads aloud comfortably in just under 5 minutes.
  8.  **Empowering:** Ends on a strong call to action rooted in purpose and the value of their role.

  This speech honors the complexity of their experience, validates their struggles with moral luck, rejects both facile optimism and nihilism, and sends them out with a resilient, humane, and actionable mandate for their careers as physicians. Good luck to your sister!
