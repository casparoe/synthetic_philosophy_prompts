prompt: |-
  So this happened at my job a few weeks back and it's still bugging me. We're a tiny office, five people, and $40 went missing from the petty cash drawer. My manager did this thing where she reasoned "only the five of you have keys, and if none of you took it the money wouldn't be missing, so logically one of you definitely did it." Everyone nodded along because yeah, the logic checks out, you can't really argue with it. But then when she actually tried to figure out WHO did it, total dead end — no camera, nobody confessing, nothing to go on. So she just said "well since one of you has to be the thief, I'm docking everyone's pay a little to cover it," and something about that felt off to me even though I couldn't say exactly what. Like okay, "someone did it" got proven true in some abstract sense, but that doesn't feel like the same kind of "true" as actually being able to point to the person and say "it was them." Is there something shaky about treating "we've shown someone must exist" as basically the same thing as "we can produce that someone"? I have this vague memory of reading once that certain mathematicians get weirdly picky about this exact distinction — like a proof that something must exist doesn't count for much to them unless you can also show how to actually find/build it — but I don't know if I'm misremembering that or if it's a real thing with an actual name and history behind it. Anyway I'd love if someone could untangle what's actually going on conceptually here, and whether my manager's move was logically shady or just practically annoying but technically fine.
