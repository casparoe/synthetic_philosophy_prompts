prompt: |-
  After nearly forty years running a pharmacology lab, I retired three years ago and have spent much of the time since finally reading the philosophy of science I never had leisure for as a working researcher -- Mayo and Royall on statistical evidence, and behind them the older argument between Bayesians and frequentists that goes back to Fisher, Neyman, and Savage. I mention this only because it has left me less settled, not more, on a live question before the small foundation whose Methodological Standards Committee I now sit on. We fund preclinical and translational research, and like most such bodies we tightened our rules after the reproducibility crisis of the last decade: grantees must fix and preregister their sample size in advance and are barred from examining their data, in any analyzable form, before that number is reached.

  A subcommittee has now proposed an exception, and the full board votes on it at next month's meeting. Under the proposal, researchers who want to monitor an experiment as the data accumulate -- to end it early, say, if the animals are suffering or a costly reagent is running low -- may do so without penalty, on one condition: they report a Bayes factor rather than a p-value. The argument, pressed hard by two of our more theoretically inclined members, is that this is not a loophole but a straightforward consequence of the likelihood principle: since what the data say, on a Bayesian reading, depends only on the likelihood actually observed and not on the rule that stopped collection, there is simply nothing left to correct for, unlike the frequentist case, where the long-run error rate really is inflated by peeking. Our working statisticians remain unpersuaded. They suspect that a sufficiently patient and motivated researcher can nearly always wait for a Bayes factor that looks respectable, and that recasting the stopping problem in the vocabulary of "evidence" rather than "significance" only gives old-fashioned data-dredging a more respectable name.

  I have been asked to draft the committee's recommendation memo, and I would value your help with it. Could you write the memo I should bring to the board: a specific recommendation -- adopt the exception, reject it, or adopt some qualified version of it -- together with reasoning that actually engages the losing side's strongest argument rather than politely restating the winning side's? Whatever we decide, I would like the colleagues on the losing end of the vote to at least recognize their own position in what I've written.
reasoning: |-
  Okay, let me start by really understanding what this retired pharmacologist is asking. He's on a committee that sets standards for funding preclinical research. They have a rule: researchers must preregister their sample size and can't look at the data until they reach that number. Now, there's a proposal to allow an exception where researchers can monitor data mid-experiment if they report a Bayes factor instead of a p-value. The committee is split between theorists who support this (citing the likelihood principle) and applied statisticians who worry it'll enable data dredging.

  Hmm, the key here is balancing methodological integrity with practical flexibility. The likelihood principle argument says Bayes factors aren't affected by when you stop, which sounds solid. But the counterargument about researcher degrees of freedom is valid too—people could keep sampling until they get a favorable Bayes factor. 

  I recall that in Bayesian analysis, the stopping rule might not affect the evidence interpretation, but the prior choice and model specification become crucial. If the prior isn't well-justified, the Bayes factor can be manipulated. Also, optional stopping can inflate error rates under some Bayesian models, though less than in frequentist methods. 

  The committee needs a solution that addresses both concerns. Maybe allowing monitored stopping only with predefined Bayes factor thresholds? And requiring rigorous justification of priors? But how enforceable is that? The applied statisticians' skepticism about enforcement is important here. 

  Also, the memo must validate both viewpoints. The theorists are correct mathematically, but the practitioners' real-world concerns deserve equal weight. Perhaps a pilot program with strict documentation requirements? Or mandatory reporting of all decision points during monitoring? 

  I should check recent literature on Bayesian optional stopping. There are methods like using Bayes factor design analysis or pre-registering priors to mitigate risks. But implementing those requires resources the foundation must consider. 

  Ultimately, the recommendation needs to either endorse the exception with safeguards, reject it, or propose a modified version. Given the risks, a qualified adoption seems most reasonable—allowing the exception but with constraints that prevent abuse. The challenge is making those constraints both effective and practical for researchers.
answer: |-
  **To:** Methodological Standards Committee, [Foundation Name]  
  **From:** [Your Name], Committee Member  
  **Subject:** Recommendation on Proposed Exception for Bayesian Interim Monitoring  
  **Date:** [Date]  

  ### **Recommendation**  
  **Adopt the proposed exception with three critical qualifications:**  
  1. **Mandatory pre-registration of the analysis plan**, including the prior distribution, Bayes factor thresholds for decisions (e.g., stopping for efficacy/harm), and the maximum sample size (aligned with resource/safety constraints).  
  2. **Formal sensitivity analysis** demonstrating robustness of the Bayes factor to alternative priors (e.g., skeptical, optimistic, or non-informative).  
  3. **Full disclosure of all interim checks** (timing, Bayes factors obtained, and decisions made) in the final report.  

  This qualified approach acknowledges the *theoretical validity* of the likelihood principle argument while addressing practical concerns about researcher degrees of freedom.  

  ---

  ### **Reasoning: Engaging Both Sides**  

  #### **1. The Case for the Exception: The Likelihood Principle Is Logically Compelling**  
  Proponents correctly argue that the Bayes factor quantifies *evidence* from observed data, independent of the stopping rule. As Berger and Wolpert (1988) emphasize, the likelihood principle renders the sampling plan irrelevant for inference. If a Bayes factor of 20 strongly supports efficacy after 50 subjects, it means the data are 20 times more likely under \(H_1\) than \(H_0\)—regardless of whether the plan was to collect 50 or 100 subjects. **This is not a loophole; it is a foundational property of Bayesian inference.** Forcing researchers to ignore animal suffering or waste resources to preserve frequentist error rates is ethically and scientifically untenable.  

  #### **2. The Case Against: Practical Realities Threaten Validity**  
  Skeptics rightly warn that "optional stopping" *can* inflate false-positive rates under **poorly specified Bayesian analyses**. A researcher using vague priors, cherry-picking favorable priors post hoc, or repeatedly testing until BF > 6 can produce misleading "evidence" (Simonsohn, 2014). The Bayes factor’s interpretation as "strength of evidence" may also be misunderstood as a frequentist error probability, creating false confidence.  

  #### **3. Reconciliation: Qualified Adoption Mitigates Risks While Upholding Principles**  
  Our solution imposes constraints to preserve integrity without nullifying the Bayesian advantage:  
  - **Pre-registration** prevents hindsight bias in prior selection and defines stopping rules prospectively.  
  - **Sensitivity analysis** exposes when results depend on arbitrary prior choices, discouraging manipulation.  
  - **Transparency** allows auditors to assess if stopping decisions were data-driven rather than hypothesis-driven.  

  Critically, these safeguards target **researcher behavior**, not the method itself. They address the core concern—"sufficiently patient researchers can wait for a favorable BF"—by making such tactics detectable. Meanwhile, they respect the likelihood principle by *not* adjusting the BF itself for stopping.  

  ---

  ### **Why This Balance?**  
  - **For frequentist-leaning statisticians:** This framework ensures accountability akin to preregistration in clinical trials. Transparency forces researchers to justify priors and document checks, reducing "data-dredging" risks.  
  - **For Bayesian proponents:** It embraces the likelihood principle while acknowledging that *implementation* matters. Robustness checks align with Gelman’s call for Bayesian workflows that "falsify their own assumptions."  
  - **For the foundation:** It offers pragmatic flexibility (e.g., stopping for harm) without sacrificing rigor. Pre-registered maximum sample sizes cap resource misuse.  

  ---

  ### **Conclusion**  
  The proposal’s core insight is sound: Bayesian inference *does* resolve the stopping rule dilemma. However, uncritical adoption risks replacing p-hacking with "prior-hacking." Our qualified exception leverages Bayesian theory while enforcing the same discipline we demand of frequentist methods. **We recommend adoption with the outlined safeguards to advance both ethical practice and evidential rigor.**  

  ---  
  **References for Context (not included in memo):**  
  - Berger, J. O., & Wolpert, R. L. (1988). *The Likelihood Principle*.  
  - Simonsohn, U. (2014). Posterior-Hacking: Selective Reporting Invalidates Bayesian Results. *SSRN*.  
  - Gelman, A., et al. (2020). Bayesian Workflow. *arXiv*.  

  Respectfully submitted for the committee’s deliberation.
