  The user's deeper need might be validation of their experience. They feel their internal process is real but are challenged by their partner. They might want reassurance that their multilingual cognition is legitimate. There's also an emotional aspect—the argument is "bugging" them, so resolving this cognitive dissonance is important for their peace of mind.

