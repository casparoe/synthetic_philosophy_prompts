prompt: |-
  I'm profiling a theoretical neuroscientist next week who's become the public face of the free energy principle -- the claim that any self-organizing system, from a single cell to a human brain, survives by minimizing its own "surprise" relative to an internal model. Whenever someone asks what would falsify this, he's got a stock dodge: "you're treating a mathematical principle like an empirical hypothesis, that's a category error, ask about a specific process model instead." Give me seven or eight questions that dont let him retreat to that line, including at least one that makes him sit with the dark-room problem (if minimizing surprise is the whole story, why isnt every organism just curled up in a quiet box somewhere), one on why the same math supposedly covering a thermostat, a bacterium, and a brain doesn't just mean it isn't really explaining any of them in particular, and one where he has to commit to a real finding that would count against the theory, not some strawman version of it. For each, flag the dodge he'll probably reach for and give a sharp follow-up that shuts it down.
reasoning: |-
  Okay, the user is preparing to interview a neuroscientist who champions the Free Energy Principle (FEP). They want questions that prevent the scientist from dodging by saying FEP is a mathematical principle, not an empirical hypothesis. They specifically mention three points: the dark-room problem, the universality of FEP across systems, and a falsifiable claim. 

  Hmm, the user seems frustrated with the interviewee's habitual deflection. They’re clearly well-versed in the criticism of FEP—they even name-drop the dark-room problem and the thermostat/brain equivalence issue. This isn’t someone who’s casually familiar; they’ve likely read FEP papers or secondary critiques. Their ask is tactical: they want surgical questions that force concrete answers. 

  The challenge is balancing academic rigor with interview practicality. Each question needs to:  
  (1) Corner the scientist on epistemology (why isn’t FEP just unfalsifiable math?),  
  (2) Exploit known weaknesses (dark room, universality),  
  (3) Demand empirical accountability.  

  For the dark-room problem, I recall Andy Clark’s response was basically "but agents have *preferences*!"—which feels like hand-waving. The follow-up should press why "preferences" aren’t just surprise-minimization in disguise.  

  For universality, the dodge will be "but boundary conditions matter!" The counter is: if FEP *requires* ad-hoc auxiliary assumptions to apply to real systems, doesn’t that make it a fancy taxonomy, not an explanation?  

  The falsifiability ask is trickiest. Proponents often retreat to "it’s a framework!" The follow-up must force them to admit what *specific* prediction, derived *only* from FEP, could fail. If they cite a process model, that’s conceding FEP alone is inert.  

  ...Also, the user’s tone suggests they’re not just profiling—they’re critiquing. They might be hoping the scientist squirms. I’ll keep questions sharp but professional; no gotcha vibes.  

  Final thought: The user didn’t ask, but they’d probably appreciate a meta-question about why FEP attracts such fervent debate. Maybe for outro.
answer: |-
  Here are 8 questions designed to corner the Free Energy Principle (FEP) proponent, forcing engagement with core criticisms and blocking the standard retreat. Each includes the predicted dodge and a surgical follow-up:

  1.  **The Dark Room Problem (Existential Challenge):**  
      "If minimizing free energy/surprise is the fundamental imperative for all self-organizing systems, why aren't all organisms optimally configured to seek environments like a dark, quiet room – minimizing sensory input and metabolic cost? What specific *within the FEP mathematics itself* compels an organism to actively seek complex, surprising environments instead?"  
      *Predicted Dodge:* "That misrepresents FEP! Organisms have *priors* (expectations) shaped by evolution for survival, like finding food/mates. Staying in a dark room violates those priors."  
      **Follow-Up:** "But isn't defining those priors as 'essential for survival' *outside* the FEP formalism? If the math *only* says 'minimize surprise relative to your model', and an organism *could* evolve a model perfectly satisfied by a dark room (minimizing surprise effortlessly), why *doesn't* FEP predict that as the universal outcome? Doesn't FEP need an *additional* principle – like 'priors must entail niche-appropriate engagement' – which isn't derived *from* FEP but *imposed* upon it?"

  2.  **Universality vs. Explanatory Power (Scope Problem):**  
      "FEP proponents claim it applies equally to thermostats, bacteria, and brains. If the same core mathematics describes such radically different systems, doesn't this suggest FEP is too abstract to provide *specific, testable explanations* for the unique properties of any *particular* system, like human cognition? What does FEP tell me about the hippocampus that I couldn't get from a much simpler description?"  
      *Predicted Dodge:* "FEP is a *framework*; its power is in providing a common language. Specific 'process models' (e.g., predictive coding networks) instantiate it for brains, giving concrete explanations."  
      **Follow-Up:** "Precisely. If the *explanatory work* is done by the specific process model (e.g., predictive coding), and FEP itself doesn't mandate *which* process model must be used or *how* it must be implemented in the brain, then isn't FEP redundant? What specific, falsifiable prediction about the brain does FEP make *that isn't already made by the process model alone*?"

  3.  **Falsifiability Demand (Core Epistemology):**  
      "You often deflect falsification requests by saying FEP is a mathematical principle, not an empirical hypothesis. However, Karl Friston himself presents FEP as a *theory* of brain function and biological organization. For it to be scientific, *some* empirical consequence must follow. **What specific, non-trivial, observable finding in neuroscience or biology would genuinely force you to conclude that FEP, as a principle governing self-organization, is fundamentally wrong or inapplicable?** Please avoid hypotheticals about process models."  
      *Predicted Dodge:* "Finding a system that *persists* (is alive/organized) but demonstrably *increases* its average surprise over time relative to its model would falsify it."  
      **Follow-Up:** "But by definition, if a system persists, it *must* be minimizing surprise relative to *some* model, even if we don't understand it. This seems tautological. Isn't this definitional sleight-of-hand? Give me an example of an *empirical observation* – like a specific neural response pattern, behavioral outcome, or thermodynamic measurement in a living system – that FEP *could not* accommodate via post-hoc model adjustments, and would therefore falsify its core claim."

  4.  **The "Markov Blanket" Problem (Boundary Definition):**  
      "FEP relies critically on defining a 'Markov Blanket' separating internal and external states. How is this boundary objectively defined for a real biological system like the brain, where internal/external interfaces are messy (e.g., sensory epithelia, blood-brain barrier, gut microbiome)? Doesn't the *choice* of where to draw this blanket fundamentally determine what counts as 'surprise minimization,' making FEP descriptions arbitrary?"  
      *Predicted Dodge:* "The blanket isn't arbitrary; it's defined by the statistical dependencies – what states screen off internal from external."  
      **Follow-Up:** "But in complex, nested systems (like organelles < cells < tissues < organs < organisms), multiple plausible blankets exist. If the 'surprise' minimized depends entirely on *which* blanket level I choose to analyze (e.g., neuron vs. cortical column vs. whole brain), doesn't this render FEP descriptions fundamentally level-relative and prevent it from making unique, objective predictions about system behavior?"

  5.  **Evolutionary Justification (Teleology):**  
      "FEP is often presented as the *reason* evolution produced brains: to minimize surprise. But isn't this backwards? Evolution selects for fitness (reproductive success). Minimizing surprise is proposed as a *means* to that end. What empirical evidence demonstrates that surprise minimization is the *primary* evolutionary driver, rather than just one possible strategy correlated with fitness? Couldn't systems evolve strategies that *tolerate* high surprise if it leads to greater fitness?"  
      *Predicted Dodge:* "Minimizing surprise *is* necessary for maintaining the system's integrity (avoiding phase transitions/disintegration), which is a prerequisite for fitness."  
      **Follow-Up:** "Is it *sufficient*? Many systems maintain integrity without complex brains (e.g., trees). If integrity is the baseline requirement, why evolve costly brains for *further* minimization? Doesn't attributing primacy to surprise minimization confuse a possible *mechanism* (how systems persist) with the *evolutionary cause* (why complex mechanisms arose)? What prediction does FEP make about evolutionary trajectories that pure fitness maximization doesn't?"

  6.  **Quantification Problem (Operationalization):**  
      "To empirically test FEP, one needs to quantify 'surprise' or 'free energy' for a real system. How is this done operationally, *without* presupposing the specific generative model? If the model is inferred *post-hoc* to explain observed surprise-minimizing behavior, doesn't this make the claim 'systems minimize surprise' unfalsifiable?"  
      *Predicted Dodge:* "We use process models (like predictive coding) which provide specific, quantifiable measures (e.g., prediction error)."  
      **Follow-Up:** "But that retreats to the process model, not FEP itself. If FEP *requires* a specific process model to generate testable quantities, doesn't that mean FEP *itself* lacks independent empirical content? Can you define 'surprise' for, say, a single cell in a way that is measurable *before* assuming FEP is true and doesn't rely on fitting an assumed model?"

  7.  **Alternative Explanations (Competing Theories):**  
      "Many phenomena FEP explains (e.g., perception, action) are also explained by well-established alternatives (e.g., Bayesian inference, reinforcement learning, efficient coding). What *unique* and *falsifiable* prediction does FEP make about brain or behavior that these alternatives do *not* make, and where has this been demonstrated empirically?"  
      *Predicted Dodge:* "FEP provides a *unifying* framework showing how perception, action, attention, etc., are all facets of the same underlying imperative."  
      **Follow-Up:** "Unification is valuable, but not unique to FEP (e.g., efficient coding also unifies aspects). I asked for a *unique, falsifiable prediction*. If the core claim – 'minimize surprise' – only generates testable predictions when combined with auxiliary assumptions (specific priors, process models), and those predictions overlap entirely with existing theories, doesn't Occam's Razor suggest FEP adds unnecessary complexity?"

  8.  **The "Free Energy" Misnomer (Terminological Critique):**  
      "FEP's 'free energy' is variational free energy (VFE), distinct from thermodynamic free energy. Given that biological systems are also thermodynamic systems, doesn't this terminological overlap create significant confusion? More critically, if minimizing VFE doesn't *necessarily* equate to minimizing thermodynamic free energy (and organisms clearly need to manage both), doesn't this highlight a potential disconnect between FEP's mathematical abstraction and the physical realities of biological survival?"  
      *Predicted Dodge:* "The two are formally linked under certain assumptions (e.g., ergodicity). FEP encompasses thermodynamics."  
      **Follow-Up:** "But are those assumptions generally valid for real biological systems far from equilibrium? Can you point to empirical work demonstrating that minimizing VFE *in practice* reliably corresponds to thermodynamically efficient states in complex organisms, or is this linkage largely theoretical? Doesn't conflating the terms risk masking crucial differences between information-theoretic and thermodynamic imperatives?"

  **Key Strategies Embedded:**
  *   **Forced Specificity:** Questions demand concrete answers about FEP *itself*, not auxiliary models ("within the mathematics itself," "specific observable finding," "FEP itself lacks independent content").
  *   **Pre-empting Dodges:** Follow-ups directly counter the anticipated retreats (e.g., cutting off the retreat to process models, challenging tautological defenses, exposing level-relativity).
  *   **Highlighting Tensions:** Questions expose inherent conflicts (Dark Room vs. engagement, Universality vs. specificity, VFE vs. thermodynamics).
  *   **Demanding Falsifiability:** Question 3 forces a direct answer on what *empirical* result would kill FEP, moving beyond definitional defenses.
  *   **Focus on Unique Contribution:** Questions challenge whether FEP adds anything beyond existing theories or just repackages them.

  **Interview Execution Tip:** Maintain a respectful but persistent tone. If they attempt the "category error" dodge, calmly restate: *"I understand FEP is a mathematical principle. My questions are about the empirical claims made for its applicability and explanatory power in biology and neuroscience, which *are* testable. Please address the specific tension I've raised."* Good luck!
