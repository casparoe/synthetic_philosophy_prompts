prompt: |-
  I've been part of a small reading group that meets every other week to work through papers and posts on decision theory and longtermist ethics — the sort of material that circulates on the EA Forum and LessWrong. Two meetings ago someone presented a summary of evidential cooperation in large worlds (ECL): the idea, traceable to Caspar Oesterheld's work on what he called "multiverse-wide superrationality" and developed further at the Center on Long-Term Risk, that if the universe (or multiverse) is large or infinite, it contains vast numbers of agents who are causally cut off from us but whose decision procedures nonetheless correlate with ours, and that we should therefore cooperate with the ones whose values differ from ours — helping their causes when doing so is cheap for us — because our choosing to cooperate is evidence that they are simultaneously reciprocating on our values, elsewhere, with no communication or causal contact involved at any point. Two regulars, Marcus and Elena, kept arguing about this long after the rest of us had moved on to refills, and I still can't decide who came out ahead.

  (1) Marcus opened by insisting this is a genuine, free-standing decision-theoretic reason to cooperate, not just a moral exhortation dressed up in jargon: structurally it's the same move as cooperating with your psychological twin in a one-shot Prisoner's Dilemma, just scaled up to however many correlated-but-differently-valued agents a large world contains. (2) Elena objected that the whole argument only pays out for an agent whose utility function already ranges over parts of the universe it can never observe or affect; an ordinary, indexical agent who just wants good outcomes in its own causal future gets nothing from ECL, so the "new" argument is available only to people who've already accepted a fairly exotic premise — and once you've accepted that premise, you've already granted the agent-neutral, cosmos-spanning kind of caring that's doing the real work, with the correlated-decision-making machinery just riding along for free. (3) Marcus answered by distinguishing non-indexical caring from full-blown impartiality across persons: a consequentialist obsessed with maximizing paperclips throughout the universe, including regions it will never see, still benefits from ECL despite caring nothing for anyone's welfare, so ECL's real requirement is just that your utility function be well-defined over a big universe, not that you be any kind of utilitarian. (4) Elena granted the correction but pressed that this only narrows the target: actual human values, including most self-identified effective altruists' revealed priorities, are far more bounded than that, so ECL is a conditional theorem almost nobody actually satisfies the antecedent of, and she suspected people find the antecedent congenial mainly because they already like the conclusion. (5) Marcus called that an ad hominem and argued that brute indexical caring — treating your own causal future as special just because it's yours — is itself hard to defend once you take seriously that a large or infinite universe (or a many-worlds cosmology) already contains causally disconnected regions physically identical to your own; rejecting indexicality, he said, isn't a strange add-on but close to where anthropic humility leads anyone who follows it through. (6) Elena's last word was that if that anti-indexical argument works on its own, it already delivers most of what ECL gets credit for — a reason to care about distant, causally disconnected value — without needing any correlated-decision-making story at all, which left her wondering whether ECL names a mechanism for gains from trade that's genuinely distinct from ordinary expected-value reasoning under moral uncertainty, or just relabels it. Neither budged, and the group dispersed before it got resolved.

  Could you go through this turn by turn and adjudicate it — for each of the six numbered moves, say who has the better of it, or whether it's a wash, and why? I'd especially like you to flag any point where one of them seems to be resting on a premise the other never actually got the chance to challenge, and then close with your own answer to the question Elena leaves hanging at the end: is ECL, properly understood, a genuinely distinct source of gains from trade, or does it collapse into ordinary hedging under moral uncertainty once you grant the non-indexical utility function it needs in order to run at all?
reasoning: |-
  Hmm, the user is presenting a detailed debate about Evidential Cooperation in Large Worlds (ECL) that happened in their reading group. They want me to adjudicate each of the six moves made by Marcus and Elena during their argument and then answer Elena's concluding question about whether ECL is genuinely distinct from ordinary moral uncertainty hedging.

  This is a complex philosophical discussion about decision theory and ethics. Marcus is defending ECL as a novel decision-theoretic reason for cooperation across causally disconnected agents with correlated decision-making procedures, while Elena is skeptical, arguing that ECL relies on premises that most people don't actually hold and may collapse into standard expected-value reasoning.

  Let me break this down step by step. For the first move, Marcus is correct that ECL is structurally similar to cooperation in a one-shot Prisoner's Dilemma with a psychological twin - it's about evidential reasoning across correlated decision-makers. This is a valid point about the decision-theoretic foundation of ECL.

  For Elena's second move, she makes a good observation that ECL only works for agents who already care about parts of the universe they can't affect or observe. This is a crucial limitation that Marcus hasn't addressed yet. Her point about the "exotic premise" being necessary is spot-on.

  Marcus's third move effectively distinguishes between non-indexical caring and full impartiality. His example of a paperclip-maximizer benefiting from ECL shows that you don't need to care about welfare specifically - just having a utility function defined over a large universe is sufficient. This successfully counters Elena's implication that ECL requires utilitarian values.

  Elena's fourth move correctly narrows the scope - while Marcus showed ECL is possible in theory, she points out that actual humans have bounded concerns. Her suspicion about motivated reasoning ("people find the antecedent congenial mainly because they already like the conclusion") is a valid psychological point but doesn't directly address the theoretical argument.

  Marcus's fifth move about anti-indexicality being a natural consequence of large universes is strong. If identical copies of you exist elsewhere, it becomes hard to justify privileging "your" causal future. Elena didn't challenge this point about anthropic reasoning.

  Elena's final move is particularly insightful - if the anti-indexical argument already gives you reason to care about distant value, then ECL's correlated-decision-making machinery might be redundant. This questions whether ECL adds anything beyond what you get from standard expected-value reasoning under moral uncertainty.

  On Elena's concluding question, I think she has a strong case. Once you accept a non-indexical utility function that cares about the entire universe, standard expected-value maximization under moral uncertainty would already recommend helping others with different values when it's cheap for you, as a form of hedging. The correlated-decision-making aspect of ECL might not add significant new justification beyond this. ECL seems to be packaging together two separate ideas: (1) caring about the large universe and (2) coordinated cooperation with correlated agents, but the first may be doing most of the work.
answer: |-
  Let's break down each exchange, highlighting strengths, weaknesses, and unchallenged premises. The debate is nuanced, and both Marcus and Elena make valid points, but Elena consistently targets deeper foundational issues.

  ### Adjudication Turn-by-Turn

  1.  **Marcus (1):** **Mostly Correct, but Oversimplifies.**  
      *   **Strength:** He correctly identifies the *structural* core of ECL: it extends the logic of evidential decision theory (EDT) in one-shot PDs with identical/correlated agents (like Newcomb's Problem or "RDT with twins") to a large universe. The "evidence" (your decision to cooperate) indicates correlated agents likely reciprocate. This *is* a decision-theoretic mechanism distinct from direct moral exhortation.
      *   **Weakness/Unchallenged Premise:** He glosses over the *massive* leap from "psychological twin in a known PD matrix" to "vast numbers of agents with *different values* in a large universe." The core ECL argument *assumes* these correlations hold across diverse agents with potentially alien decision procedures and value functions – a non-trivial claim Elena later challenges implicitly. He also assumes the agent *accepts* EDT in the first place.

  2.  **Elena (2):** **Strong Point, Hits Foundational Requirement.**  
      *   **Strength:** Elena lands a crucial blow. ECL fundamentally requires the agent's utility function \(U\) to be defined over states of the universe (or large parts of it) that are causally inaccessible to them. An indexical agent whose \(U\) depends *only* on outcomes within their future light cone gains *nothing* from ECL cooperation. The evidence that "others are reciprocating elsewhere" doesn't translate into higher expected utility for *their* indexical goals. She's right that accepting such a non-indexical \(U\) is a significant, exotic premise, and the "cosmos-spanning caring" embedded in that \(U\) is doing heavy lifting.
      *   **Unchallenged Premise:** Marcus doesn't dispute the *necessity* of a non-indexical \(U\); he tries to redefine its *scope* in his next move.

  3.  **Marcus (3):** **Corrects Elena, but Doesn't Address the Core Issue.**  
      *   **Strength:** Marcus successfully refines Elena's point. ECL doesn't require *impartiality* (caring equally about all sentient beings) or *utilitarianism*. A paperclip maximizer with a non-indexical \(U\) (e.g., \(U = \text{total paperclips in universe}\)) *can* benefit from ECL. Cooperating with a widget maximizer (helping them cheaply) is evidence that correlated widget maximizers are helping *you* make paperclips elsewhere. The requirement is indeed a \(U\) defined over a large universe, not necessarily a morally "good" one.
      *   **Weakness:** This correction doesn't negate Elena's core point from (2). The paperclip maximizer *still* needs that exotic non-indexical \(U\). Marcus clarifies *what kind* of exotic premise is needed, not that it *isn't* exotic or necessary. He hasn't shown why an agent *should* adopt such a \(U\).

  4.  **Elena (4):** **Strong Rebuttal, Highlights Practical Relevance & Motivated Reasoning.**  
      *   **Strength:** Elena concedes the correction but delivers a powerful practical and psychological critique. Even granting Marcus's refined requirement (non-indexical \(U\)), *actual human values* (including most EAs) are overwhelmingly indexical or bounded (caring about beings they can *imagine* affecting, their descendants, Earth-originating life, etc.). Very few people genuinely have a utility function defined over the entire large universe. Therefore, ECL, as a *decision-theoretic theorem*, has almost no actual agents satisfying its antecedent. Her suspicion about motivated reasoning ("liking the conclusion drives accepting the antecedent") is a valid psychological critique often applicable in complex philosophical arguments.
      *   **Unchallenged Premise:** Marcus doesn't seriously engage with the claim about *actual* human values being bounded. He shifts to arguing *why* boundedness is irrational.

  5.  **Marcus (5):** **Compelling Philosophical Argument, but Shifts Ground.**  
      *   **Strength:** Marcus makes a deep and defensible philosophical point. If the universe/multiverse is large or infinite, the existence of physically identical (or functionally identical) copies of "you" in causally disconnected regions undermines the justification for privileging *this* instance's causal future. "Brute indexicality" (caring *only* about "my" future light cone *because* it's "mine") becomes hard to defend rationally under such cosmologies. Rejecting strict indexicality in favor of caring about outcomes for "copies" or across the wider universe *is* a plausible conclusion from anthropic reasoning and physical symmetry.
      *   **Weakness/Unchallenged Premise:** While philosophically potent, this **shifts the debate**. His initial defense of ECL (1,3) presented it as a free-standing decision-theoretic gain. Now, he's arguing that *rejecting indexicality* is independently rational/necessary, and *then* ECL applies. Elena didn't get to challenge this anti-indexicality argument on its own merits (e.g., is it truly compelling? Does it require specific cosmological models? Does it imply caring about *all* copies equally or just identical ones?).

  6.  **Elena (6):** **Insightful Culmination, Raises the Key Question.**  
      *   **Strength:** Elena connects Marcus's shift brilliantly. *If* the anti-indexicality argument (from large universes/many worlds) works on its own, it *already* provides a strong reason to care about distant, causally disconnected value realization (e.g., helping your copies, or just valuing outcomes everywhere). Once you have this non-indexical \(U\), cooperating with others (even with different values) when it's cheap *could* simply be seen as **expected-value maximization under moral uncertainty**: you don't know if your values are "correct" or dominant, so hedging by promoting *any* value realization (paperclips, widgets, happiness) has positive expected value relative to your own \(U\) (which now values value-realization-in-general, or values copies' goals). This makes ECL's specific "correlated decision-making" mechanism seem redundant. She forces the question: **Is ECL a *distinct source* of cooperative gains, or just a *consequence* of maximizing a non-indexical \(U\) under moral uncertainty?**
      *   **Unchallenged Premise:** Marcus doesn't rebut this specific point about redundancy. The debate ends here.

  ### Summary of Who Had the Better of Each Move

  *   **(1) Marcus:** Slight edge (correct on structure, oversimplifies scope).
  *   **(2) Elena:** Clear win (exposes crucial, exotic prerequisite).
  *   **(3) Marcus:** Win (successfully refines the prerequisite).
  *   **(4) Elena:** Win (effectively argues the refined prerequisite is still rarely met in practice, raises valid concern about bias).
  *   **(5) Marcus:** Win (makes a strong independent argument against indexicality, though it shifts the goalposts slightly).
  *   **(6) Elena:** Strong win (powerfully synthesizes the shift in (5) to question the distinctness of ECL).

  **Overall:** Elena consistently pushed the debate towards the deeper, more foundational issues (the necessity and rarity of non-indexical \(U\), the potential redundancy of ECL's mechanism). While Marcus successfully defended the internal logic and clarified the requirements of ECL, Elena's critiques regarding its practical relevance and theoretical distinctness were more probing and ultimately unanswered.

  ---

  ### Answering Elena's Final Question: Is ECL Genuinely Distinct?

  **ECL, as commonly presented, does *not* appear to be a genuinely distinct source of gains from trade beyond ordinary expected-value maximization under moral uncertainty, *once you grant the non-indexical utility function it requires*. It largely collapses into it.**

  Here's why:

  1.  **The Core Mechanism is Evidential, But Not Uniquely Cooperative:** ECL relies on the evidential link: *your* decision to cooperate is evidence that *correlated others* are making similar decisions. However, for an agent with a non-indexical \(U\) that values value-realization broadly (e.g., total paperclips + widgets + happiness...), the decision to help *any* other value system when cheap *already* has positive expected value due to moral uncertainty/hedging. The ECL "evidence" adds little extra justification. The "cooperation" is just an instance of promoting value-realization in general.
  2.  **Moral Uncertainty Does the Heavy Lifting:** Under moral uncertainty with a non-indexical \(U\), you assign some probability that different value systems (paperclips, widgets, hedons) are "correct" or worthy of promotion. Helping *any* of them, especially when cheap, increases the expected realization of value *according to your own aggregated \(U\)*. The fact that your decision correlates with others' similar decisions (ECL) doesn't fundamentally change this calculus; it might slightly alter probability estimates within the moral uncertainty framework, but it doesn't introduce a *new kind* of gain. The gain comes from promoting value-in-general under uncertainty.
  3.  **ECL Requires the Same Foundation:** Both ECL cooperation and hedging under moral uncertainty *require* the same foundational commitment: a non-indexical utility function defined over a large universe. Without this, neither mechanism works. ECL doesn't provide an *independent reason* to adopt such a \(U\); it merely operates *if* you have one. Marcus's anti-indexicality argument (5) is the potential independent reason *for* that \(U\), not a core part of ECL *per se*.
  4.  **Distinction Without a Difference?:** Proponents might argue ECL specifically leverages *decision correlation* to achieve mutual benefit between *differently valued* agents in a way simple moral uncertainty hedging doesn't guarantee. However, under moral uncertainty with a non-indexical \(U\), helping others *is* mutually beneficial *in expectation* across the universe: you help their values (which your \(U\) cares about), and (if correlations exist) they help yours. The "mechanism" is still the broad promotion of value under uncertainty. ECL seems to describe a *specific behavioral consequence* (targeted cooperation based on decision-procedure similarity) of maximizing a non-indexical \(U\) in a large universe with correlated agents, rather than introducing a fundamentally new decision-theoretic force.

  **Conclusion:** Elena is correct to be skeptical. The novel-seeming "cooperation without causation" mechanism of ECL is largely subsumed by standard expected-value maximization once an agent adopts the necessary (and exotic) non-indexical utility function defined over the large universe. The *distinctive* contribution of ECL frameworks (like Oesterheld's work) lies more in rigorously exploring the implications of decision correlation *within* that non-indexical framework and highlighting the potential scale of gains in large worlds, rather than in providing a *fundamentally new reason* to cooperate that stands apart from moral uncertainty hedging under a cosmos-spanning perspective. The anti-indexicality argument (Marcus's point 5) is the more fundamental (and controversial) breakthrough; ECL is primarily an application of it.
