prompt: |-
  So I've been down a rabbit hole rereading MIRI's old Embedded Agency sequence, and the part that's stuck with me is the robust delegation stuff -- specifically tiling agents and the so-called Löbian obstacle, i.e. the result that an agent cant formally trust a successor (or a future version of itself, running on the same kind of reasoning) to behave correctly without already trusting a proof system at least as strong as its own, and you cant bootstrap that trust from nothing, per Löb's theorem. I keep noticing the same shape of problem every time I set up a commitment device on myself -- Beeminder, food-blocking apps, telling my partner to physically hide my phone -- to make future-me actually do what present-me wants. Whats the most important implications of the embedded agency framing, and that Löbian self-trust result specifically, for how much I should actually expect commitment devices like these to work, and for how I should go about designing them?
