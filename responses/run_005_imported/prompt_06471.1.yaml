  ---

  ### Point-by-Point Analysis

  #### **1. Dan's Point: Peeking inflates false-positive rate**  
  **Score: 2 (Clearly right)**  
  Dan is correct. The false-positive rate (Type I error) is a property of the *testing procedure*, not a single test. If you repeatedly check data and stop when p < 0.05, you inflate the chance of a false positive. For example:  
  - With 5 interim checks, the false-positive rate can balloon to ~20% (not 5%).  
  - Priya stopped at p=0.03 on day 4, but this value doesn’t account for the prior peeks.  
  **Why it’s right**: Frequentist statistics requires a pre-defined sample size or stopping rule. Deviating invalidates the p-value’s meaning.  

  #### **2. Priya's Point: Data "doesn’t care" when you look**  
  **Score: -2 (Clearly wrong)**  
  Priya misunderstands frequentist inference. Key points:  
  - P-values depend on the *data-generating process*, including when/why you stop.  
  - Identical data can yield different p-values under different stopping rules. For example:  
    - Fixed sample (1 test): p=0.03 implies ~3% false-positive rate.  
    - "Peek until significant": p=0.03 could imply >15% false-positive rate.  
  **Why it’s wrong**: The same numbers ≠ same evidence strength. The stopping rule alters the sampling distribution.  

  #### **3. Dan's Point: P-values reflect the procedure**  
  **Score: 2 (Clearly right)**  
  Dan nails the core frequentist principle:  
  - P-values measure how extreme the data is *under a specific null hypothesis and procedure*.  
  - A "peek-till-significant" procedure guarantees eventual significance (p < 0.05) under the null.  
  - Example: Simulate 1,000 A/A tests (no effect) with daily peeks. >50% hit p<0.05 by day 7.  
  **Why it’s right**: Ignoring the procedure invalidates error-rate guarantees.  

  #### **4. Priya's Point: Deadline justifies ignoring peeks**  
  **Score: -1 (Mostly wrong, but nuanced)**  
  Priya’s deadline defense fails:  
  - **Problem 1**: She *did* peek and act on the data (stopped when p<0.05). Her decision was data-dependent.  
  - **Problem 2**: Intentions ("I planned to stop Friday") are irrelevant if actions contradict it.  
  - **Nuance**: If she pre-committed to *only* analyze on day 4 (no interim peeks), p=0.03 would be valid. But she didn’t.  
  **Why it’s wrong**: Statistical validity depends on *what was done*, not intentions. Peeking + data-dependent stopping invalidates p-values.  

  ---

  ### What Both Are Missing  
  1. **Solutions exist for peeking**:  
     - **Sequential testing** (e.g., Alpha-spending, Pocock boundaries): Adjusts thresholds for interim looks to preserve 5% error.  
     - **Bayesian methods**: Provide posterior probabilities independent of stopping rules (avoids this debate).  
     - **Pre-registration**: Defining sample size/analysis plan upfront avoids ambiguity.  

  2. **Practical context matters**:  
     - If this was a small iterative test (not a final decision), rigid p-value worship may be overkill.  
     - But if shipping a permanent change, rigorous error control is essential.  

  3. **The "likelihood principle" debate**:  
     - Priya’s view aligns with Bayesianism/likelihoodists (evidence depends only on observed data).  
     - Dan’s view aligns with frequentism (evidence depends on data *and* procedure).  
     This is a deep philosophical split—but in *frequentist A/B testing*, Dan’s rules apply.  

  ### Final Tally  
  - **Dan wins** on statistical correctness (points 1, 3).  
  - **Priya** misunderstands p-values (point 2) and can’t retroactively justify peeking (point 4).  
  - **Recommendation**: Use sequential methods next time or pre-commit to a sample size.
