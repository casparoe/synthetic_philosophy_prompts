answer: |-
  Here's a comparative analysis of Wallace's and Todd's accounts in relation to your selective enforcement case, explaining why both struggle initially but can be adapted:

  1.  **R. Jay Wallace's Account (Reciprocity & Equal Standing):**
      *   **Core Idea:** Moral blame is a practice of "moral address" presupposing reciprocal normative competence and commitment between equals. The blamer implicitly claims the authority to hold others accountable based on shared norms. Hypocrisy undermines this because the blamer *themselves* violates the very norms they invoke, destroying the reciprocity and equality essential to the practice. The blamer acts as if they are "above" the norm they enforce against others.
      *   **Application to Your Case:**
          *   **Problem:** The chair isn't violating the subletting rule *herself*. She isn't being hypocritical in the direct sense Wallace typically analyzes (e.g., blaming others for lying while lying herself). The defect isn't in her *personal conduct* regarding the *content* of the norm (subletting).
          *   **Initial Diagnosis:** Wallace's core account **does not directly diagnose a standing-defeating problem** here. The reciprocity regarding the *specific rule violated* isn't obviously broken by the chair's own actions.
      *   **Accommodating Selective Enforcement:** Wallace's view needs to expand its conception of the "practice of moral address" and the "reciprocity" it presupposes.
          *   **Revision Needed:** The practice of holding others accountable within a shared governance structure (like a co-op board) presupposes not just mutual subjection to the *content* of the rules, but also mutual subjection to the *principles of impartial rule application and enforcement*. Favoritism violates a fundamental norm of *procedural fairness* inherent in the practice of collective rule enforcement itself.
          *   **How it Works:** By selectively enforcing the rule – applying it harshly to you while knowingly exempting her friend – the chair violates the presupposed reciprocity *within the enforcement practice*. She treats members unequally, placing herself (and her friend) in a position of privilege *relative to the enforcement authority*. This destroys the "equal standing" necessary for legitimate moral address *within that institutional context*. She presupposes an authority she exercises unfairly, undermining the equality the board's authority relies upon.

  2.  **Patrick Todd's Account (False Presupposition):**
      *   **Core Idea:** A blamer loses standing when their act of blaming *presupposes something false* about their own relationship to the norm they are invoking. The paradigmatic case is hypocrisy: blaming someone for X while doing X oneself presupposes "I am not guilty of X," which is false. Todd argues loss of standing always reduces to some such false presupposition.
      *   **Application to Your Case:**
          *   **Problem:** What false presupposition is the chair making? She isn't presupposing "I don't sublet my own unit" – because she doesn't, so that presupposition is *true*. Todd's core examples focus on the blamer's own *violation* of the *substantive* norm being enforced.
          *   **Initial Diagnosis:** Todd's core account **struggles to diagnose a standing-defeating problem** here. There doesn't seem to be an obvious false presupposition about her *own conduct* relative to the subletting rule.
      *   **Accommodating Selective Enforcement:** Todd's view needs to broaden the scope of the relevant "presuppositions" made by the blamer, especially in an institutional enforcement role.
          *   **Revision Needed:** When an authority figure like the chair formally reprimands someone for violating a rule, their act *presupposes* not only that *they* aren't violating the *substantive* rule (which is true here) but also that they are enforcing the rule *impartially* and *in accordance with the principles underlying the authority of the enforcement body* (e.g., fairness, equal treatment, good faith).
          *   **How it Works:** By reprimanding you while knowingly allowing her friend to violate the same rule without consequence, the chair's act of blaming *presupposes* "I am enforcing this rule fairly and impartially." **This presupposition is false.** Her favoritism demonstrates that her enforcement is partial and unfair. The false presupposition concerns her *role* and *conduct as an enforcer*, not her personal adherence to the *substantive rule* she is enforcing against you.

  **Which Account Better Diagnoses Your Case (After Revision)?**

  *   **Both revised accounts can diagnose the problem**, but **Todd's revised account provides a slightly more precise and direct diagnosis** for this specific case of selective enforcement without shared substantive guilt.
      *   Wallace's revised view correctly identifies the *violation of procedural reciprocity* as undermining the equality needed for moral address *within the institution*.
      *   However, Todd's revised view pinpoints the *specific false presupposition* inherent in the chair's *act of reprimanding you*: namely, that she is acting as a fair and impartial enforcer. This falsehood directly undermines her standing *to perform that specific act of blaming* in her official capacity. It captures the core wrong: the chair is asserting an authority (fair enforcement) she is actively misusing.

  **Justification for Todd's Revised View Being Slightly Preferable:**

  1.  **Directness:** The false presupposition ("I am enforcing this rule impartially") is *exactly what the chair is doing wrong when she reprimands you*. It directly targets the defect in the blaming *act itself* within its institutional context.
  2.  **Focus on the Enforcer Role:** It explicitly addresses the unique position of an *authority figure* performing official blame (reprimand), highlighting the specific normative commitments *of that role* beyond just personal conduct.
  3.  **Explains the Intuition:** Your strong sense that favoritism alone undermines standing is directly explained by the chair falsely presenting herself as fair and impartial *in that very moment* of blaming you.

  **Conclusion:**

  Neither Wallace's nor Todd's core, unrevised accounts cleanly captures why the chair lacks standing in your case of pure selective enforcement/favoritism without shared substantive guilt. However, both can be successfully revised to diagnose the problem:

  *   **Wallace** must expand the "reciprocity" presupposed by moral address to include *procedural fairness and equal treatment under the rules within the relevant normative community* (the co-op). The chair's favoritism violates this procedural reciprocity.
  *   **Todd** must expand the relevant "presuppositions" made by a blaming act, especially by an authority figure, to include presuppositions about *the fairness and impartiality of their own enforcement*. The chair's reprimand falsely presupposes she meets this standard.

  While both revisions work, **Todd's revised account provides the most precise diagnosis:** The chair's act of reprimanding you presupposes the falsehood that she is enforcing the rule impartially. This false presupposition directly undermines her standing to blame *you* in her official capacity for *this* violation. Her favoritism fundamentally corrupts her exercise of the enforcement authority she invokes against you.
