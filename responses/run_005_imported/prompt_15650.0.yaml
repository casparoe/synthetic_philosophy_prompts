  The core of Williamson's argument: 
  - Let s0, s1, ..., sn be a series of times as the fire dies and it gets colder. At s0, it is hot (so one feels hot). At sn, it is cold (so one does not feel hot). 
  - The anti-luminosity argument aims to show that there is no time si such that one is in a position to know that one feels hot at si. 
  - The margin for error principle: for one to know that one feels hot at si, one must feel hot not only at si but also at nearby worlds (or in nearby cases). Since the change is gradual, there will be a point where one feels hot at si but does not at si+1, and at si+1 one might not be able to distinguish the state from si. Therefore, at si, one cannot know that one feels hot because if one were at si+1 (which is indistinguishable) one would not feel hot and would falsely believe one does.

