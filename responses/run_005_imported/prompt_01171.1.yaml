answer: |-
  ## Dialogue: Equilibrium vs. Normative Force in the Parking Lot

  **Setting:** A university common room after a seminar on social norms. **Aisha** (defending/adapting Lewis) and **Ben** (arguing for a partiality/bargaining/normative account) sip coffee, discussing the parking dispute.

  **Aisha:** Ben, that parking case from the seminar – it perfectly illustrates how Lewis's framework still applies, even with unequal spots. The old arrangement *was* a Lewisian convention: a regularity (Ground Units take Good Spots) solving a coordination problem (assigning spots without daily conflict). It persisted because everyone expected it, knew others expected it, and preferred *some* assignment over chaos. The indifference condition is met *relative to the alternatives available when the convention formed*. Back then, "Ground Units get priority" was *one* viable solution among others (like seniority, lottery, daily scramble). Indifference isn't about the *spots* being equally good, but about the *rules* being arbitrary *ex ante*.

  **Ben:** But Aisha, that's precisely where Lewis's model stumbles! "Indifference among alternatives" fails spectacularly here. The alternatives aren't symmetric. Ground-floor residents *inherently* benefit more from the "Ground Units get priority" rule because they value proximity and shade more – they walk past those spots constantly! Upstairs residents *prefer* coordination over chaos, yes, but they *disprefer* this *particular* coordination point. It's a Battle-of-the-Sexes: everyone wants *a* rule, but different groups favor different rules based on self-interest. Lewisian conventions emerge when no one cares *which* side of the road we drive on; here, people care *deeply* which rule assigns the scarce *better* spots.

  **Aisha:** Fair point about the initial distribution of preferences. But Lewis isn't blind to that! The convention *itself* creates a new layer of indifference – or at least, acceptance. Once the pattern is established and *expected*, deviating becomes costly due to the *loss of coordination benefits*. The upstairs residents *became* indifferent (or resigned) to *this specific rule* because the cost of trying to change it – the uncertainty, conflict, potential chaos of a daily scramble – seemed worse than accepting the slightly worse spot. Their continued compliance signals their *conditional* preference for this equilibrium over disorder, even if they'd prefer a different rule *if* they could magically impose it without friction. The new owner disrupts that stable expectation, reintroducing the coordination cost everyone wanted to avoid.

  **Ben:** You're describing resignation, not indifference! And crucially, you're downplaying the *normative* force at play. People aren't just avoiding chaos; they feel the new owner is acting *unfairly*. Why? Because the old arrangement wasn't *just* a coordination device; it became a *norm of partiality* (Ullmann-Margalit). It settled an unequal distribution based on an implicit, perhaps historical, sense of "ground units deserve proximity" – a *reason* beyond mere coordination. This generates normative expectations: "We *ought* to respect this." Violating it isn't just inconvenient; it feels like a *wrong* because it disregards that perceived entitlement, built over time through consistent practice. It's not just "disappointing expectations"; it's *betraying* a shared understanding of fairness within that context.

  **Aisha:** But Ben, what *is* the source of that normative force, if not the mutual expectations and the coordination benefits Lewis identifies? You invoke "perceived entitlement," but how did that perception arise? I argue it arose *precisely* from the Lewisian process: the regularity solved the problem, expectations solidified, and compliance became the path of least resistance. The *feeling* of wrongness comes from the *empirical expectation* being shattered – "She *won't* comply like everyone else!" – combined with the *normative expectation* – "She *should* comply because we all do, and chaos ensues if we don't!" Bicchieri's model fits here: mutual empirical and normative expectations, plus the implicit threat of social sanction (disapproval, conflict in the chat), create the normative grip. But the *foundation* is still coordination.

  **Ben:** You're conflating origin with current force. Yes, the norm *may* have originated in coordination. But over time, it accrued normative weight *independent* of pure coordination efficiency. The ground-floor residents didn't just say, "Oh well, chaos is worse"; they said, "Those are *our* spots." That language of ownership and desert goes beyond mere preference for order. It signals internalization. And sanctions aren't just about restoring coordination; they're about *punishing perceived unfairness*. The new owner isn't just causing inconvenience; she's seen as *taking something that isn't hers by the building's established, albeit informal, social contract*. Coordination explains the *start*, but a partiality norm explains the *depth* of the reaction.

  **Aisha:** Let's test that. Suppose the new owner consistently parks in the good spot, and after initial grumbling, everyone adjusts. The ground-floor units grumble but park elsewhere without escalating. Gradually, a *new* regularity emerges: "First come, first served for all spots." Wouldn't that *become* a new Lewisian convention? Expectations shift, a new coordination point is found. The "normative force" of the old rule evaporates because the empirical expectations sustaining it collapsed. If it were a truly deep norm of partiality rooted in desert, wouldn't resistance be fiercer and more persistent? The ease of transition suggests the norm's force *was* primarily expectation-based, not rooted in fundamental moral desert.

  **Ben:** It *could* transition, but the *manner* matters. If the ground-floor units acquiesce out of exhaustion or fear of greater conflict, that doesn't mean the old norm lacked normative force; it means the new owner successfully *imposed* a change through repeated violation, overcoming the normative resistance. It's an evolution, yes, but a contested one driven by power (she acts unilaterally) rather than mutual re-negotiation. A smoother, more legitimate evolution might involve discussion and some form of compensation or acknowledgment ("We know we're changing things, maybe ground units get dibs on storage lockers?"). Lewis's model struggles to capture that difference – the *illegitimacy* of unilateral overthrow versus the potential legitimacy of consensual change.

  **Aisha:** Hmm. So you're saying the *process* of change reveals whether the old arrangement was *merely* a coordination convention or a norm with deeper normative claims? If it can be overturned by simple unilateral action without widespread moral outrage beyond inconvenience, it leans Lewisian. If overturning it requires overcoming strong resistance based on fairness claims and perhaps bargaining, it leans towards a partiality norm?

  **Ben:** Exactly. And in this case, the strong reaction in the group chat – accusations of unfairness, not just annoyance at uncertainty – suggests the latter. The new owner *has* wronged them, in their view, by violating a settled expectation that had become imbued with a sense of rightful possession, however informally established. It wasn't just a game; it was a rule.

  **Aisha:** But is "wronged" the right word? Or is it that she violated a *local* norm, causing social friction, but without a deeper moral failing? Lewis might say she merely stopped playing *this particular coordination game*, forcing everyone else to find a new one. The "wrong" is practical, not moral.

  **Ben:** And that's the crux. Are social norms like parking spot assignments *merely* practical coordination devices, or do they create local, context-specific moral obligations based on reliance, fairness, and established practice? I argue the latter.

  **Aisha:** So... is our disagreement about the *nature* of conventions in cases of asymmetry, or is it ultimately about the scope of morality – whether locally established practices can generate genuine moral obligations beyond the pragmatic need for order?

  **Ben:** Perhaps both. But also... maybe it's partly about the *word* "convention." Lewis defines it strictly: coordination + indifference + common knowledge. Ullmann-Margalit, Bicchieri, and I want a broader term covering norms that solve distributional conflicts and carry normative force, even if they don't fit Lewis's strict criteria. Are we arguing about reality, or about how to label it?

  **Aisha:** A bit of both, I suspect. The phenomena – the regularity, the expectations, the reactions to violation – are real. But does labeling it a "Lewisian convention" capture its essence in asymmetric cases, or does it obscure the crucial elements of partiality, perceived fairness, and the potential for moralized reactions? That feels substantive.

  **Ben:** Agreed. Calling it *just* a coordination convention seems to drain the moral dimension out of the neighbors' outrage. Calling it *only* a norm of partiality might underplay how crucial mutual expectations for coordination were to its stability. The reality is likely a hybrid... which leaves our poor condo association still needing to park their cars. Another coffee?

  **Aisha:** (Smiling) Please. And perhaps we should draft a formal parking policy while we're at it... just in case.
