  give me a real or realistic example (doesn't have to be about money) that has that same rival-driven escalation structure as the dollar auction — ideally not one of the usual suspects like the vietnam war or a bidding war on ebay — where just calling it "sunk cost fallacy" would be missing what's actually going on. and explain why the label doesn't fully fit.
