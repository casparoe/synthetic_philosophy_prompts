answer: |-
  ## Toast for a Mountain Lioness

  (Clink glass gently) Family, friends, fellow rescuers... thirty years. Thirty years of pre-dawn callouts, of frozen fingers and frayed nerves, of staring down blizzards and sheer drops, all fueled by coffee, courage, and an unwavering sense of duty. That’s our Mom. That’s our leader. Tonight, we raise a glass not just to her retirement, but to the incredible legacy of heart and grit she built on these mountains.

  Now, we all know there’s one story that echoes louder than most in these valleys. The storm. The impossible choice. Two climbers on one ridge, seven on another. One hour. One team. And Mom… Mom didn’t choose the seven. She chose *chance*. She had the team draw lots. She saved the two that day.

  **(Pause, let it sink in, look around at the room knowingly)**

  That decision… well, it wasn’t just a mountain call, was it? It split coffee rooms and training sessions for years. Philosophers like Taurek and Parfit wrestled with the very same question in dusty journals: "Should the Numbers Count?" Taurek argued *no*. He said saving lives isn't arithmetic. Saving one group isn't *worse* for the other group you couldn't reach anyway; it’s a tragedy either way. Choosing the larger group, he said, treats individuals as mere numbers, dissolving the unique value of *each* person into a faceless sum. The moral weight, he argued, is in the *act* of saving *someone*, not the *count*.

  Parfit, of course, fired back. In his "Innumerate Ethics," he argued that numbers *must* matter. Choosing the larger group isn't ignoring individuals; it's recognizing that saving seven *individuals* prevents more unique tragedies than saving two. It respects the distinct loss of each potential victim. To *not* save the greater number, Parfit contended, is to *disrespect* the moral significance of each of those five extra lives you could have saved.

  **(Lean in slightly, making eye contact, voice firm but warm)**

  So, did Mom get it right that day? Standing here, her daughter, surrounded by the people who lived her choices with her... **Yes. She absolutely did.**

  Not because every life counts equally – though they do. But because Mom understood, instinctively, what Taurek was grasping for: that **leadership in the face of impossible loss isn't about cold calculus.** It’s about acknowledging the profound, irreducible value of *each* person on those ridges. It’s about refusing to let the sheer size of a potential tragedy numb you to the individual human beings caught in it. By drawing lots, she ensured that *who* was saved wasn't decided by an abstract number, but by a recognition that *both* groups were equally deserving of rescue, equally worthy of the team's effort, and equally victims of cruel circumstance. She looked beyond the utilitarian spreadsheet Parfit championed and saw the human faces Taurek implored us not to forget.

  **(Shift tone, more personal, sweeping gaze across family and volunteers)**

  And that moment wasn't an anomaly; it was a beacon. For thirty years, Mom led with that same fierce, unwavering respect for the *individual* – whether it was a lost hiker scared out of their wits, a volunteer needing a steadying word after a tough call, or her own family needing her after a long night on the mountain. She made impossible choices, yes, but she never let the weight of numbers crush her compassion. She never let the scale of the mountains diminish the value of a single soul.

  That storm, that call... it wasn't about ignoring the numbers. It was about **refusing to let the numbers have the final say over human worth.** It took immense moral courage to make that call, knowing the controversy it would ignite. Courage that defined her leadership ever since.

  So tonight, we toast the impossible choices made with a steady hand. We toast the leader who valued the one as deeply as the many. We toast thirty years of bringing light into the darkest hours on these peaks.

  **(Raise glass high, voice filled with warmth and pride)**

  To Mom. To our fearless leader. To the woman who taught us that sometimes, the bravest thing you can do is look an impossible equation in the face and say, "No. It’s not that simple." May your retirement be as filled with warmth, peace, and the deep satisfaction of a job incredibly well done as our hearts are filled with gratitude tonight. Cheers to you, Mom!

  **(Hold eye contact, big smile, "CHEERS!")**
