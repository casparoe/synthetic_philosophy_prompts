prompt: |-
  So for my philosophy elective we've been reading William James's essay "The Will to Believe" (the one from 1896) and I mostly followed it once I got used to the old-timey sentences, but there's one paragraph that's messing with me and my teacher's explanation didn't really click. We'd already gone through the part where he sets up all his vocab (live vs. dead hypotheses, forced vs. avoidable options, all that), and then later on he just kind of randomly starts talking about a train getting robbed. Here's the actual bit:

  "A social organism of any sort whatever, large or small, is what it is because each member proceeds to his own duty with a trust that the other members will simultaneously do theirs. Wherever a desired result is achieved by the co-operation of many independent persons, its existence as a fact is a pure consequence of the precursive faith in one another of those immediately concerned. A government, an army, a commercial system, a ship, a college, an athletic team, all exist on this condition, without which not only is nothing achieved, but nothing is even attempted. A whole train of passengers (individually brave enough) will be looted by a few highwaymen, simply because the latter can count on one another, while each passenger fears that if he makes a movement of resistance, he will be shot before any one else backs him up. If we believed that the whole car-full would rise at once with us, we should each severally rise, and train-robbing would never even be attempted. There are, then, cases where a fact cannot come at all unless a preliminary faith exists in its coming. And where faith in a fact can help create the fact, that would be an insane logic which should say that faith running ahead of scientific evidence is the 'lowest kind of immorality' into which a thinking being can fall."

  I get that he's trying to say faith can create facts sometimes, but I dont get why the highwaymen example specifically, or how it actually connects back to the God/religion stuff the essay is supposedly about, since theres no train robbery involved in that. Also is he basically saying that if you believe something hard enough it just becomes true?? Cause that sounds like plain wishful thinking to me, and earlier in that same essay he quotes Clifford going on about how believing stuff without enough evidence is basically sinful, so it feels like James would be contradicting his own point if thats really what he means. My teacher said this paragraph is doing alot of heavy lifting against Clifford's whole argument but kind of breezed past explaining how, and we've got a reading check on it tomorrow, so if someone could break down what's actually going on in this bit and why James even needed it, that would be amazing.
