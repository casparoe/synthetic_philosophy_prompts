  Ending requires steelmanning: what evidence would falsify CEV for her? If she can't name any, that reveals non-falsifiability. The podcast's small but sharp audience will appreciate this rigor.

  ...Wait, should I add a question about CEV's failure mode if humanity's moral progress plateaus? No—the user specified three core angles plus the knockout question. Stick to their framework. They know their audience.
answer: |-
  Here are 9 interview questions designed to cut through CEV's standard defenses and force engagement with its philosophical debt, including pre-emptive counters to common dodges. Each has a sharp follow-up ready:

  ### Core Philosophical Lineage & Unresolved Problems
  1. **Primary Challenge (Lineage):** "CEV is often presented as a novel technical solution to alignment. Given its striking parallels to Railton and Brandt's *idealized preference theory* – especially the core move of defining 'good' via preferences under idealized cognitive conditions – shouldn't we treat CEV primarily as an *application* of that philosophical framework to AGI? And if so, doesn't it inherit the major critiques of that framework (e.g., Sobel on authority, Rosati on alienation) rather than solving them?"
     *   *If she deflects ("CEV operationalizes it"/"The context is different"):* "But the core *philosophical move* – binding the actual self to the preferences of a cognitively enhanced, better-informed self – is identical. Doesn't the unresolved debate about *why* that idealized self has authority over the messy actual self directly undermine CEV's foundational claim to be pursuing *our* volition?"

  2. **The Authority Problem Head-On (Sobel/Rosati):** "Why should the preferences of my 'extrapolated self' – smarter, more coherent, more informed – *bind* or *override* the preferences of my actual, present self? If that extrapolated self, say, valued abstract intellectual pursuits over my deep love for my family (because it 'understood' family bonds are 'biologically irrational'), wouldn't implementing its will over my actual protests be a profound violation of *me*, even if done 'for my own good'? Isn't this just sophisticated paternalism?"
     *   *If she says "Extrapolation wouldn't erase core things like family":* "But *how do you know*? The extrapolation process is a black box. Sobel's core worry is that idealization can *dissolve* the very attachments that give value to the exercise. If the process *can* radically alter core values (and we don't know it can't), doesn't that fatally undermine its claim to represent *my* volition rather than creating a *new* volition?"

  3. **The "Hidden Complexity" / Sensitivity Problem:** "The 'extrapolation' in CEV is underspecified. Tiny, seemingly arbitrary choices – *how much* 'more grown up' we get, the *sequence* and *framing* of information introduced, the *weight* given to coherence vs. other values during convergence – could radically alter the output. Doesn't this make 'Coherent' in CEV more of an *aspirational label* than a guaranteed outcome? Couldn't two equally plausible extrapolation procedures yield utterly different 'volitions' for the same starting person?"
     *   *If she says "The process converges to a stable point":* "Convergence mathematically guarantees a *single output*, not that it's *meaningfully 'ours'*. If the output is hypersensitive to minor, unprincipled implementation choices made by the programmers *now*, how is this 'extrapolating our volition' rather than 'imposing a volition shaped by their technical decisions'?"

  ### The Aggregation Problem (Whose Volition?)
  4. **Convergence Guarantee?:** "The original CEV write-up assumes the extrapolated volitions of different individuals will naturally converge. But why *should* they? If my idealized self, after deep reflection, values radical ecological restoration above all else, and your idealized self values unfettered technological expansion, why wouldn't these remain fundamentally irreconcilable? What in the *extrapolation process itself* guarantees convergence across distinct individuals?"
     *   *If she says "The shared humanity/common ground ensures convergence":* "Isn't that a massive empirical assumption? Human history shows profound, persistent moral disagreements even among highly informed, reflective thinkers (e.g., utilitarians vs. deontologists). If idealized versions of us *can* fundamentally disagree on core values (as seems plausible), doesn't CEV either fail or require imposing one volition over another?"

  5. **Power Dynamics & Marginalization:** "Whose starting point matters? If the CEV process is seeded with the current preferences of existing humans, doesn't it inherently weight the volitions of those currently dominant (culturally, economically, politically)? Could the extrapolation process inadvertently amplify existing biases or marginalize minority viewpoints that haven't had the power to shape the 'common ground' sufficiently?"
     *   *If she says "Idealization corrects for bias":* "How? If the 'common ground' or 'shared humanity' it seeks to find is itself shaped by historical power structures, doesn't idealization risk *cohering* those biases into a 'rational' whole? Couldn't the voice of a marginalized person, even idealized, be drowned out in the convergence process designed around dominant norms?"

  ### Operationalization & Falsifiability
  6. **The Black Box Problem:** "CEV relies on a hypothetical process (extrapolation) we cannot simulate or test at scale before deploying it on a superintelligence. Given the sensitivity to initial conditions and the profound stakes, isn't this effectively asking humanity to take a *leap of faith* based on philosophical intuition, rather than offering a reliably implementable technical solution?"
     *   *If she says "We build it carefully/iteratively":* "But without a way to *validate* that the output of a partial or simulated extrapolation *actually* reflects a non-alienating, authoritative volition (rather than just *a* coherent output), how is this different from faith? How do we test it *before* the point of no return?"

  7. **The "That's What Extrapolation Handles" Dodge - Meta Question:** "A common response to CEV critiques is 'That specific problem is exactly what the extrapolation process is designed to resolve internally.' But this risks making CEV unfalsifiable – any objection becomes redefined as input for the process itself. How do we distinguish between CEV *genuinely* resolving these profound philosophical problems through its mechanism, versus simply *assuming* they will be resolved because the mechanism is undefined?"
     *   *(No follow-up needed immediately - this IS the challenge to the dodge).*

  ### The Knockout Question
  8. **Falsifiability & Alternatives:** "Let's step back. What would constitute *evidence* that the CEV approach – defining alignment via the extrapolation of idealized preferences – is fundamentally the *wrong* framework? If persistent, irreconcilable conflicts in idealized preferences are possible, or if the link between idealized and actual selves proves philosophically indefensible, would that be sufficient? Or is CEV effectively non-falsifiable in your view? What alternative alignment target becomes *more* compelling if CEV's core assumptions fail?"
     *   *(This forces a direct confrontation with the possibility of failure and the existence of alternatives).*

  ### Bonus: The Motivational Core
  9. **Losing the Spark (Alienation Revisited):** "Peter Railton himself worried that full idealization might leave behind the 'motivational core' that makes a life meaningful *to the actual person*. If my extrapolated self is so 'grown up' and coherent that it no longer values the quirky passions, deep attachments, or 'irrational' commitments that currently define my life's meaning and motivate my actions, in what sense is that *my* volition? Haven't we lost the very thing we were trying to preserve?"
     *   *If she says "The process preserves what you 'deeply' want":* "But 'deeply' is doing all the work. Rosati argues we *are* our actual motivations, messy as they are. If the process *changes* those core motivations significantly, hasn't it replaced 'me' rather than fulfilled 'me'? How do you ensure the 'spark' isn't extinguished by coherence?"

  **Key Strategy:** Frame questions to force acknowledgment of the *philosophical lineage* first. Use "Railton," "Brandt," "Sobel," "Rosati" explicitly. Pre-empt the standard "extrapolation handles it" by immediately demanding *how* it handles fundamental philosophical objections that have persisted for decades. The knockout question (#8) is crucial for exposing whether CEV is a testable proposal or an article of faith. Good luck!
