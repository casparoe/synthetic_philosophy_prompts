prompt: |-
  I'm a retired field biologist -- spent something like 35 years studying territorial contests in reef fish, which meant I picked up a lot more evolutionary game theory than I ever expected to need. One of the tidier results from that world is the "bourgeois" strategy -- owner keeps the territory, intruder backs off -- which is stable once everybody plays it, even though the mirror-image rule ("intruder always wins") would have been just as stable if history had happened to settle on that one instead. Since retiring I've been filling the gap with philosophy, mainly through a little discussion group that meets at the library once a month, and I about fell out of my chair when I hit the arbitrariness condition in David Lewis's book Convention, because its the exact same idea wearing different clothes. Which is maybe why an argument two other people in the group got into last session, over, of all things, restaurant tipping, has been rattling around in my head ever since.

  It went roughly like this. (1) Walt said tipping is a clean textbook case of a Lewis convention: its arbitrary in his technical sense (baking a living wage into the menu price would coordinate everyone just as well), and it's self-perpetuating because everyone conforms, everyone expects everyone else to conform, and that's common knowledge among American diners. (2) Sonia said not so fast: Lewis is explicit that a convention solves what he calls a coordination problem, and a coordination problem requires something like "coincidence of interest" -- people being close to indifferent about which of several equilibria gets picked, the way nobody cares whether we all drive on the left or the right so long as we agree. Tipping isn't like that, she said: servers, diners, and owners have real, unequal stakes in whether we land on "tip generously" versus "pay staff properly and skip the theater," so it fails the very condition that makes something a coordination problem for Lewis in the first place. (3) Walt came back that Lewis himself admits almost every real coordination problem is "impure," mixed with some conflict, and only needs coincidence of interest to predominate, not be total -- and what really does the work in the definition is the conditional part: given that everyone else currently tips, each diner still prefers to tip too, and given that diners tip, each server prefers the tipping system to unilaterally opting out of it. That conditional preference holds right now, he said, no matter how the equilibrium got picked in the first place. (4) Sonia said that concedes too much -- almost any entrenched, self-sustaining arrangement passes that test, including ones everybody would call exploitative, so if that's sufficient, "convention" stops picking out anything distinctive, and Lewis's talk of coincidence of interest and arbitrariness has to be doing real work that Walt's move quietly throws away.

  They both turned to me afterward since I'm the one who suggested the book, but I've only been doing this a year and couldn't honestly tell you who has Lewis on their side. Could you go through moves (1) through (4) and adjudicate each one on its own terms -- basically right, basically wrong, or onto something real but overstated -- against what the definition actually requires (general conformity plus expectation of conformity, common knowledge, the coincidence-of-interest condition, the conditional-preference-for-conformity condition, and the arbitrariness condition)? And then tell me, on balance, whether tipping counts as a genuine Lewis convention or whether Sonia has put her finger on a real gap in the framework that goes well beyond this one example.
reasoning: |-
  Okay, let's tackle this step by step. The user is a retired field biologist with expertise in evolutionary game theory, specifically the bourgeois strategy in reef fish. They've connected this to David Lewis's concept of conventions in philosophy, particularly the arbitrariness condition. Now, they're stuck on a debate in their discussion group about whether restaurant tipping qualifies as a Lewis convention. The arguments from Walt and Sonia present different angles, and the user wants an adjudication of each point based on Lewis's criteria.

  First, I need to recall Lewis's definition of convention. It involves general conformity, mutual expectations, common knowledge, coincidence of interest, conditional preference for conformity, and arbitrariness. The key points are whether tipping meets these, especially the coincidence of interest and arbitrariness.

  Walt's point (1) claims tipping is arbitrary and self-perpetuating. But arbitrariness requires that alternatives work equally well. Here, the alternative (higher wages, no tips) might not be equally preferred by all parties. Servers might earn more with tips, owners save on labor costs, diners might feel pressured. So, while it's self-perpetuating, the arbitrariness is questionable because stakeholders have different preferences.

  Sonia's rebuttal (2) argues that tipping lacks coincidence of interest. Lewis requires that parties are indifferent to the equilibrium chosen, but here, servers, owners, and diners have conflicting interests. Servers might prefer tips for higher earnings, owners like lower fixed costs, diners may resent the burden. This conflict challenges the coordination problem definition.

  Walt's counter (3) mentions impure coordination problems. Lewis allows some conflict, but coincidence of interest must predominate. The conditional preference—everyone prefers to tip given others do—might hold. Diners tip to avoid social backlash, servers rely on tips. But the underlying conflict remains, especially if parties feel exploited.

  Sonia's final point (4) says Walt's view dilutes "convention" to include exploitative systems. If conditional preference alone suffices, many unequal systems qualify, making "convention" less distinctive. Lewis's emphasis on coincidence of interest and arbitrariness would be undermined.

  Assessing each: Walt (1) overstates arbitrariness; Sonia (2) correctly identifies missing coincidence of interest; Walt (3) has a point on conditional preference but underweights conflict; Sonia (4) highlights a theoretical gap. 

  Overall, tipping isn't a pure Lewis convention due to significant conflicts of interest. The debate exposes a limitation in Lewis's framework when applied to systems with inherent inequalities. The user's background in game theory might appreciate how real-world cases stretch theoretical models, suggesting conventions need to account for power dynamics.
answer: |-
  Here's a step-by-step adjudication of Walt and Sonia's arguments against Lewis's definition of convention, followed by a conclusion on tipping's status and the framework's limitations:

  ### Lewis's Core Conditions for Convention (Summarized)
  1.  **General Conformity:** Most people follow the regularity.
  2.  **Mutual Expectations & Common Knowledge:** Everyone expects others to conform, everyone expects others to expect conformity, etc. (common knowledge).
  3.  **Coordination Problem:** The situation is one where *coincidence of interest predominates*. People have a shared interest in coordinating *on some equilibrium*, and are largely indifferent (or nearly so) *between the available equilibria*. Conflict is secondary.
  4.  **Conditional Preference for Conformity:** *Given* that others conform, each individual prefers to conform (because coordination is valuable). This preference holds *because* of the expectations of conformity.
  5.  **Arbitrariness:** There is at least one other possible regularity (R') that, *if* it were the established convention, would also solve the coordination problem *just as well* (i.e., satisfying conditions 1-4).

  ### Adjudication of Moves (1) through (4)

  1.  **Walt (1): "Tipping is a clean textbook case of a Lewis convention."**
      *   **On General Conformity, Expectations, Common Knowledge:** Walt is **basically right.** Tipping in the US exhibits widespread conformity, strong mutual expectations, and common knowledge among diners, servers, and owners.
      *   **On Arbitrariness:** Walt is **overstating it, arguably wrong.** While baking a living wage into prices *is* an alternative system, it's **not clearly arbitrary in Lewis's sense.** Lewisian arbitrariness requires that the alternatives solve the coordination problem *just as well for all participants*. The key question is: *Are servers, diners, and owners truly indifferent (or nearly so) between a tipping equilibrium and a service-included equilibrium?*
          *   *Servers:* Often prefer tipping (potential for higher earnings, faster service incentives). Not indifferent.
          *   *Owners:* Often prefer tipping (shifts wage risk/cost to customers/demand, allows lower menu prices). Not indifferent.
          *   *Diners:* Mixed/contextual (some prefer transparency/no hassle, some prefer perceived control/recognition). Not generally indifferent.
          *   The alternative system isn't perceived as solving the "problem" (how to pay servers/get service) *just as well* by all key players. Significant distributional and incentive differences exist. **Verdict: Overstated/Wrong on this specific point.** It fails the strict arbitrariness condition because stakeholders have distinct preferences between the equilibria.

  2.  **Sonia (2): "Tipping lacks coincidence of interest, failing the coordination problem requirement."**
      *   **Basically Right.** Sonia correctly identifies the core issue. Lewis's coordination problem *requires* a predominance of coincidence of interest. The defining feature is that participants *share a primary interest in coordinating on some solution*, and the *choice between available solutions is largely a matter of indifference* (e.g., left vs. right driving). Tipping vs. service-included is **not** a matter of indifference:
          *   There are clear winners and losers *between* the equilibria (servers potentially earn more/less, owners bear different costs/risks, diners have different burdens/experiences).
          *   The stakes in *which* equilibrium is chosen are high and unequal for the parties involved.
          *   While *some* coordination (paying servers somehow) is needed, the *form* of that coordination involves significant conflict over distribution and incentives. **Verdict: Correct.** The lack of predominant coincidence of interest means tipping doesn't start as a pure Lewisian coordination problem.

  3.  **Walt (3): "Lewis allows 'impure' coordination; conditional preference for conformity holds now."**
      *   **Conditional Preference:** Walt is **onto something real but overstates its sufficiency.** The *conditional* preference ("Given others tip, I prefer to tip"; "Given diners tip, I prefer the tipping system") *does* likely hold *under the current system* for most diners and servers. Conforming avoids social sanction, ensures service, provides income. This is crucial for the *stability* of an existing convention.
      *   **Impurity:** Walt is **correct** that Lewis acknowledges most real-world coordination problems involve *some* conflict ("impure"). He doesn't require perfect coincidence.
      *   **The Problem:** However, Walt **underweights the requirement that coincidence must *predominate*.** The conflict Sonia highlights isn't a minor secondary issue; it's fundamental to the *nature of the problem*. The "impurity" isn't a small friction; it's a core conflict over *which solution* benefits whom. The conditional preference holding *now* doesn't negate the fact that the initial selection *between* equilibria wasn't driven by indifference, and that parties *still* have strong, conflicting preferences about *which* equilibrium they'd rather be stuck in. **Verdict: Correct on the existence/importance of conditional preference and impurity, but wrong to imply it overrides the requirement for predominant coincidence of interest defining the problem.** He uses the conditional preference (designed for stability) to bypass the coincidence-of-interest requirement (designed to define the *type* of problem).

  4.  **Sonia (4): "Walt's move dilutes 'convention' to include exploitative systems."**
      *   **Basically Right.** Sonia identifies the theoretical consequence. If *only* general conformity, expectations, common knowledge, and the *conditional* preference for conformity (given the current system) are required, then *many* stable but exploitative or highly unequal social arrangements would qualify as conventions (e.g., oppressive caste systems, company towns with scrip wages). Lewis's framework *explicitly* aims to distinguish conventions from norms sustained primarily by sanction or deep conflict by requiring the underlying problem to be one of coordination with predominant coincidence of interest and arbitrariness. Walt's argument effectively severs "convention" from the specific *type* of stability mechanism Lewis described (based on mutual benefit via coordination) and makes it synonymous with *any* stable, self-reinforcing social norm. **Verdict: Correct.** Lewis's talk of coincidence of interest and arbitrariness *is* doing essential work in defining a distinct category of social regularity.

  ### Overall Adjudication: Is Tipping a Lewis Convention?

  *   **No, tipping is not a genuine Lewis convention.** It fails the core requirements:
      *   **Fails Arbitrariness:** The alternative (service-included pricing) is not perceived by all key stakeholders (especially servers and owners) as solving the "problem" just as well. Significant distributional and incentive differences make the equilibria non-arbitrary.
      *   **Fails Coincidence of Interest (defining the Coordination Problem):** The stakes in *which* equilibrium is chosen (tipping vs. service-included) are high and conflictual for the involved parties (servers, owners, diners). There is no predominance of indifference between the available solutions. The shared interest in *some* coordination is overshadowed by conflict over the *form*.

  *   **It partially satisfies other conditions:** It exhibits General Conformity, Mutual Expectations, Common Knowledge, and (under the current system) a Conditional Preference for Conformity. This explains its *stability*, but stability alone doesn't make it a Lewis convention.

  ### Does Sonia Identify a Real Gap in Lewis's Framework?

  *   **Yes, profoundly.** This debate highlights a significant tension or limitation in applying Lewis's elegant theory to complex real-world institutions:
      1.  **Power & Conflict:** Lewis's framework struggles with situations where power imbalances and conflicting interests are baked into the *definition* of the available equilibria, not just incidental "impurities." Tipping, minimum wage laws, property rights regimes – these involve fundamental distributional conflicts. Calling them "coordination problems" feels strained because the parties aren't indifferent collaborators seeking alignment; they are often adversaries negotiating (explicitly or implicitly) over the terms.
      2.  **Arbitrariness in Practice:** True Lewisian arbitrariness (left/right driving) is rare for complex social institutions. Alternatives usually have different efficiency, distributional, or incentive properties that matter deeply to participants. The "arbitrariness" condition often relies on a high level of abstraction that ignores these real differences.
      3.  **The Origin Problem:** Lewis focuses on how conventions *persist*. The debate over tipping highlights how the *origin* and *selection* of an equilibrium matter. A convention arising purely from salience/indifference (like left/right) feels different from one arising from historical power dynamics or path dependence where conflict was central *during selection*, even if conditional conformity holds *now*.

  **Conclusion:** Your instinct connecting the bourgeois strategy to Lewisian convention is spot-on – both hinge on the stability of arbitrary equilibria under conditions of indifference. However, Sonia wins the tipping argument. Tipping fails Lewis's core tests of arbitrariness and coincidence of interest. More importantly, her critique exposes a genuine limitation: Lewis's framework, while brilliant for "pure" coordination (like your fish or driving rules), becomes less useful and potentially misleading when applied to institutions deeply entwined with economic conflict and power dynamics, where the "arbitrary" alternatives aren't truly indifferent and the "coordination problem" masks underlying distributional struggles. The "gap" she identifies is the framework's difficulty handling conventions born of and sustained by significant inequality and conflict. Your game theory background makes you uniquely positioned to appreciate this – it's the difference between a symmetric Hawk-Dove game (where Bourgeois is stable and arbitrary) and a fundamentally asymmetric game from the start.
