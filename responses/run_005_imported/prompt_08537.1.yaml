prompt: |-
  Ok, weird ask, but I need help before Friday. As a novelist I get roped into judging things sometimes, and right now I'm one of five judges for a smallish first-book fiction prize. One of our finalists is a book everyone privately agrees is basically the author's own life -- name changed, timeline compressed, a couple scenes she's admitted to inventing so a chapter would land -- but its shelved and marketed as a novel. Two judges want to disqualify it as memoir in costume; two others say the prize rules never define 'novel' anyway, so this is just people fighting over a label while a genuinely good book sits there unrewarded. I'm the tiebreaker and have to send round a short memo with where I land and why, and it can't just dodge the 'it's only semantics' objection -- if that's right, disqualifying the book is arbitrary, and if it's wrong I need to say what's actually at stake. Can you draft that memo: an actual recommendation on this book, not a both-sides shrug, plus maybe a line on how we handle this next year so we're not back here in twelve months.
reasoning: |-
  Okay, the user is a novelist who's serving as a judge for a first-book fiction prize. They're the tiebreaker in a dispute about a finalist book that's clearly based on the author's life. Two judges want to disqualify it as memoir disguised as fiction, while two others argue the prize rules don't define "novel" and it's a good book regardless. The user needs to draft a decisive memo with a recommendation and a suggestion for future rules.

  First, I need to unpack the core conflict. The real issue isn't just labels—it's about fairness to other authors who created original worlds versus this author who leveraged personal experience. The prize is for debut fiction, so evaluating creative invention matters. 

  The user's hidden need might be preserving the prize's integrity while avoiding arbitrary decisions. They also need to prevent future debates, hence the request for rule changes. As a novelist, they likely value both artistic merit and genre boundaries.

  For the memo structure: Start with a clear stance—don't disqualify but acknowledge the ambiguity. Then justify why semantics matter: it's about rewarding creative labor, not policing labels. Highlight what's at stake: if life stories can compete as fiction, it disadvantages authors without dramatic biographies. 

  For the recommendation: Advance the book since rules don't prohibit autobiographical fiction. Stress that the prose quality still stands. 

  For future-proofing: Propose defining "novel" for next year—e.g., requiring significant invented elements beyond personal experience. 

  Tone is crucial: authoritative but not dogmatic. Emphasize that this isn't about gatekeeping but ensuring comparable creative effort. The "what's at stake" section must resonate with writers—they'll understand the imbalance between crafting plots and editing life events.

  Finally, the user needs this to feel resolved, not just a temporary fix. The rule suggestion shows proactive leadership, which might earn respect from fellow judges.
answer: |-
  Here’s a concise, decisive memo draft addressing the core issue and proposing a solution for next year. It avoids semantics debates by focusing on the prize’s purpose and fairness:  

  ---

  **TO:** Fiction Prize Judging Committee  
  **FROM:** [Your Name], Judge  
  **DATE:** [Current Date]  
  **SUBJECT:** Final Recommendation for [Book Title] & Rule Clarification  

  After reviewing the debate surrounding [Book Title], I recommend **advancing the book as a finalist without disqualification**. My rationale balances the current rules, artistic integrity, and fairness—while acknowledging the valid concerns raised.  

  ### Why This Book Qualifies Now:  
  1. **Rules as Written**: Our criteria do not define "novel" or prohibit autobiographical fiction. Disqualifying based on subjective interpretation sets a precarious precedent.  
  2. **Literary Precedent**: Autofiction (e.g., Knausgård, Ferrante) blurs life/fiction lines explicitly. Punishing this author for a common approach feels disproportionate.  
  3. **Merit-Based Focus**: The book’s strength—its prose, structure, and emotional impact—was universally acknowledged. Rejecting it over genre concerns risks valuing labels over artistry.  

  ### What’s at Stake (Beyond "Semantics"):  
  **This isn’t about definitions—it’s about competitive fairness and the prize’s purpose.** If life narratives with minimal invention compete as novels, authors who undertake the complex work of *wholly original world-building* may be disadvantaged. A debut fiction prize should reward *transformative creation*, not just compelling recollection—even if the latter is artfully done. Disqualification now would be arbitrary, but this tension reveals a gap in our guidelines.  

  ### Recommendation:  
  **Vote to retain [Book Title] in contention**. Its merits warrant evaluation against other finalists. However, its autobiographical nature should be noted in our deliberations when assessing originality and inventiveness.  

  ### For Next Year: Avoid This Dilemma  
  I propose we amend the rules to clarify expectations:  
  > *"Eligible novels must contain significant invented elements beyond the author’s direct experience. While autobiographical inspiration is permitted, works reliant predominantly on undisguised personal history (e.g., minimally fictionalized memoirs) do not qualify."*  

  This respects creative hybridity while safeguarding the prize’s intent: to celebrate *fiction’s unique alchemy*.  

  ---  

  ### Key Strengths of This Approach:  
  - **Decisive but Fair**: The book isn’t punished retroactively, but future submissions face clearer standards.  
  - **Reframes "Semantics" as Values**: It shifts the debate from "what is a novel?" to "what do we *value* in debut fiction?" (originality vs. curation of experience).  
  - **Prevents Repeat Conflicts**: The proposed rule change offers objective guardrails, reducing subjective disputes.  
  - **Acknowledges Both Sides**: Validates concerns about authenticity in fiction while honoring current rules.  

  This positions you as a pragmatic mediator who respects the prize’s integrity and the authors’ labor—without waffling. Good luck!
