  Ok this is a strange one but bear with me. I'm plotting a novel where an AI companion works out what my main character actually wants purely by watching her live her life for months -- no surveys, no chats, just behavior. My nephew, who's doing a PhD in AI safety, burst my bubble by mentioning a result (Armstrong and Mindermann, i think -- something like "occams razor isn't enough to infer the preferences of irrational agents") showing this can't work in full generality: any stretch of behavior can be explained by loads of different reward-plus-bias combos that fit it equally well, and no simplicity assumption breaks the tie between them. That's annoying, because my plot assumes a patient enough watcher can always eventually crack a person, which is basically also what I assume as a novelist whenever I trust that showing a character's actions will tell the reader who she really is. So write me an essay that takes this seriously: the strongest case that watching behavior (IRL-style or otherwise) can still get at someone's real preferences, the strongest case that it structurally can't, bring in the older version of this same puzzle from Quine or Davidson so I know it's not just an AI thing, and then actually land somewhere -- not "both sides have a point," your real verdict on whether my AI, and my method as a novelist, are quietly cheating.
