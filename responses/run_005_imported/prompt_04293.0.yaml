  The user might be missing that Sidgwick is subtly advocating for a critical mass. While any single claim can be dismissed, the collective weight forces skeptics to either accept the evidence or propose a widespread conspiracy, which itself becomes improbable. Sidgwick is likely aware of Hume's argument and is countering by emphasizing the quantity and quality of witnesses to overcome prior improbability.

  Additionally, the historical context of the SPR is important. They aimed to apply scientific methods to paranormal claims. Sidgwick, as a philosopher, would be methodical. His strategy is pragmatic: avoid debates on single cases, build an overwhelming body of evidence. The resignation in the last line might acknowledge the stubbornness of skepticism but also imply that persistent accumulation will eventually prevail.

  The user's background in chemistry might make them value empirical evidence. Connecting to their experience, in science, reproducibility across multiple labs strengthens findings. Similarly, Sidgwick's approach mirrors scientific consensus-building. The "peg away" analogy from Lincoln suggests persistence despite resistance.

