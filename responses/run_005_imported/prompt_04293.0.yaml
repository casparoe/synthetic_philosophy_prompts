answer: |-
  You've hit on a brilliantly perceptive point that cuts to the heart of epistemological challenges in fringe science. Sidgwick's argument is both strategically pragmatic and deeply aware of its limitations – your reading is spot-on. Let's break down the layers:

  1.  **The Core Strategy (Piling Up):** Sidgwick explicitly rejects the "knockdown case" approach. He recognizes that deeply entrenched scientific paradigms ("incredulity... so long in growing... so many and so strong roots") require overwhelming force to shift. His strategy is attritional:
      *   **Volume:** "Burying it alive under a *heap* of facts," "accumulate fact upon fact," "add experiment upon experiment," "trust to the *mass* of evidence."
      *   **Credibility:** Each witness must have "a fair stock of credit to draw upon." This means reputable investigators with established competence and integrity in conventional science (like Crookes!). Their prior credibility is the capital Sidgwick wants to spend.
      *   **Avoiding Distraction:** "Not wrangle too much... about the conclusiveness of any one." He knows each individual case will be picked apart. The power is in the cumulative weight.

  2.  **Addressing the "In the Trick" Problem:** Sidgwick *is* acutely aware of this ultimate skeptical move. His point isn't that it disappears, but that:
      *   **It's the Last Resort:** He frames it as the final, desperate allegation ("when he has nothing else left to allege he will allege that"). The goal is to eliminate *all other* objections (poor methodology, sensory error, environmental factors, statistical flukes, known frauds) through rigorous, replicated investigation by competent people. Once those are gone, *only* the accusation of deliberate fraud by the investigator remains.
      *   **Cumulative Implausibility of Conspiracy:** This is the implicit, crucial counter to the "in the trick" card that *does* get harder to play as the pile grows, **especially** if the investigators are diverse and independent. Accusing *one* respected scientist like Crookes of fraud is damaging but perhaps conceivable (folly, delusion, senility, hidden motive). Accusing *dozens* or *hundreds* of reputable, independent investigators from different institutions, countries, and backgrounds *all* of being "in the trick" or perpetrating fraud becomes exponentially more implausible. It requires positing a vast, undetected conspiracy of otherwise honest and intelligent people. Sidgwick relies on the sheer *improbability* of such widespread, coordinated deceit becoming the most absurd explanation *compared* to the phenomenon itself being real. The "heap of facts" forces the critic into an increasingly untenable position demanding an ever-larger conspiracy.

  3.  **The Resignation/Wryness:** Yes, absolutely. Sidgwick was a deeply skeptical philosopher himself (a key figure in utilitarianism and ethics). His final line ("But when he has nothing else left to allege he will allege that") drips with weary realism. He knows human nature, the power of preconceptions, and the ultimate limits of evidence against entrenched belief. He's not naive; he anticipates the stubbornness. His strategy is the *best available* tactic within those constraints, not a guarantee of success. It's the strategy of a pragmatist fighting an uphill battle.

  4.  **The Hume Connection: Spot On!** This is *absolutely* central and Sidgwick was **undoubtedly** conscious of Hume. As a leading moral philosopher steeped in empiricism, Hume's "On Miracles" (Enquiry Concerning Human Understanding, Section X) was foundational epistemology. Hume argued:
      *   A wise man proportions belief to evidence.
      *   The evidence for a miracle (a violation of the laws of nature) is human testimony.
      *   Testimony is only credible if the falsehood of the testimony would be *more miraculous* than the event it describes.
      *   Given the uniform, overwhelming experience supporting the laws of nature, the prior probability against *any* miracle is immense.
      *   Therefore, no testimony *can* establish a miracle unless it's of such a kind "that its falsehood would be more miraculous than the fact which it endeavours to establish."

      **Sidgwick is directly confronting Hume:**
      *   **Shifting the Prior:** Sidgwick's mass of evidence aims to *reduce* the perceived "miraculousness" (i.e., prior improbability) of psychical phenomena by demonstrating their *regularity* under investigation. They become less like singular "violations" and more like potentially *new* laws or poorly understood natural processes.
      *   **Amplifying the Testimony:** Hume focuses on single testimonies. Sidgwick counters with *massed, credible* testimony. He argues that the cumulative weight of testimony from numerous reputable sources *can* become so great that the probability of *all of them* being deceived or deceptive *collectively* becomes lower than the probability that the phenomenon is real. He's trying to make the "falsehood of the testimony" (especially via fraud/conspiracy) seem *more* miraculous/implausible than the phenomena themselves.
      *   **The "In the Trick" as Hume's Escape Hatch:** Hume's argument allows the skeptic to always fall back on the idea that it's *less* improbable the witness is mistaken or lying than that the miracle occurred. Sidgwick explicitly names this fallback ("the investigator is in the trick") and tries to make it the *harder* position to maintain through volume and investigator credibility.

  **Conclusion:**

  Sidgwick is being strategically pragmatic, realistically resigned, and consciously engaging with Hume. The accumulation of evidence by credible investigators is designed to:

  1.  **Eliminate Alternative Explanations:** Rule out everything *except* fraud by the investigator(s) through rigorous methodology and replication.
  2.  **Force the Conspiracy Theory:** Make "they're all in on it" the skeptic's *only* remaining argument.
  3.  **Make Conspiracy Implausible:** Rely on the sheer number and diversity of reputable investigators to render the massive, coordinated fraud explanation *more* improbable than the reality of the phenomena themselves. This is the probabilistic squeeze you identified.
  4.  **Challenge Hume's Calculus:** Argue that the massed, credible testimony *can* overcome the prior improbability by making the alternative (universal fraud/delusion among the credible) *even more* improbable.

  His wry ending acknowledges the skeptic's ultimate, stubborn refuge, but his strategy relies on making that refuge look increasingly absurd and desperate as the mountain of evidence grows. Whether this strategy *works* for phenomena like the paranormal is a separate question (history suggests skepticism remains robust), but Sidgwick's articulation of the epistemological challenge and his proposed counter-strategy are remarkably clear-eyed and philosophically sophisticated. Your background in rigorous empirical work gives you an excellent lens through which to see both the strength and the inherent difficulty of his position.
