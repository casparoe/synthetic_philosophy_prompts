prompt: |-
  I sit on the incident review board at work -- we're a mid-size e-commerce company. We had a nasty one during a flash sale: checkout was down for about 40 minutes, and it turned out two unrelated things were happening at once -- the platform team had pushed a config change to the db connection pool that would've exhausted it under that day's traffic all by itself, and separately, a retry bug in a feature team's client library was hammering that same pool hard enough to exhaust it on its own too. We replayed that day's traffic in staging with each change reverted one at a time and confirmed either alone would've taken checkout down. Our postmortem template's root-cause test is basically 'would this still have happened if X hadn't occured,' and honestly the answer's yes for both -- so neither team clears the bar for root cause under our own policy, which matters because whoever's tagged owns the fix items and eats the error-budget hit for the quarter. Now both teams are pointing at this to say they're in the clear since 'it would've happened regardless of us,' and the board's split down the middle: half think that's a fair reading of our own rules, half think it's obviously letting two teams who both actually contributed off the hook on a technicality. A couple of us floated asking whether each factor was actually doing something at the time instead of whether it was strictly necessary, but couldn't turn that into a rule anyone trusted. Draft the memo the board should send recommending how we handle root-cause attribution in cases like this going forward -- I want something we could actually apply next time, not 'use your best judgement,' and it needs to take the 'it wasn't actually necessary so it's unfair to blame us' argument seriously instead of just brushing past it.
reasoning: |-
  Okay, the user is part of an incident review board at a mid-size e-commerce company. They faced a tricky situation where two unrelated issues caused a major outage during a flash sale. Each issue alone could have taken down the checkout system, and under their current root-cause test, neither qualifies as the root cause because the incident would've happened regardless of either one. This has led to a split in the board about accountability, with teams arguing they shouldn't be held responsible.

  The user needs a memo that addresses root-cause attribution in such cases. The memo must provide a clear, actionable rule for future incidents, avoiding vague "use your best judgment" advice. It also needs to seriously consider the argument that since each factor wasn't strictly necessary, blaming one team is unfair.

  First, I should break down the core problem. Their current policy relies on a necessity test ("would this still have happened if X hadn't occurred?"). In this incident, both changes fail this test because either one alone could have caused the outage. This creates a loophole where no one is held accountable. The challenge is to redefine root cause to cover multiple contributing factors without dismissing the necessity argument.

  The user mentioned some board members suggested focusing on whether each factor was actually doing something at the time. That's a good starting point. The key is to shift from "necessary cause" to "significant contributing factor." That way, even if the incident could have happened without one factor, each active contribution is acknowledged.

  I need to ensure the new rule is testable. The memo should specify concrete steps: verify if each factor was active and materially contributing during the incident. Then, check if each alone could have caused a similar outage. If both are true, both are root causes. This approach closes the loophole while respecting the necessity argument by requiring that each factor must be capable of causing the outage independently.

  Also, the memo should address implementation. It needs to outline how to document these factors in postmortems, assign accountability, and handle error budgets. Splitting the impact between teams makes sense here, as both were equally responsible. Emphasizing collaboration in fixes is important too, to prevent finger-pointing.

  The user's deeper needs include maintaining fairness in accountability, ensuring teams don't evade responsibility on technicalities, and having a clear process that's defensible. They also need to preserve team morale by not over-penalizing but still enforcing ownership. The memo should balance these by providing structure without ambiguity.

  Potential pushbacks might include teams arguing they shouldn't be blamed if their change wasn't the sole cause. The memo counters this by stressing that significant contributions warrant accountability, especially when each factor was independently sufficient. Highlighting the replay tests as evidence strengthens this.

  Finally, the memo should reinforce learning and prevention. By attributing root causes to all significant factors, the company can address each contributing issue, reducing future risks. This aligns with the goal of improving system resilience, which is the ultimate purpose of incident reviews.
answer: |-
  **MEMORANDUM**  
  To: Incident Review Board Members  
  From: [Your Name], Chair, Incident Review Board  
  Date: October 26, 2023  
  Subject: Revised Root-Cause Attribution Policy for Multi-Factor Incidents  

  ### Background
  The recent postmortem for the Flash Sale Checkout Outage (Incident #IN-2023-10-15) highlighted a gap in our current root-cause attribution framework. Two independent changes (Platform Team’s DB connection pool config + Feature Team’s retry bug) each independently capable of causing the outage coincided. Our existing "necessity test" ("Would the incident have occurred if X had not happened?") failed to assign accountability, as removing either factor still resulted in failure during replay testing. This created ambiguity in ownership of fixes and error-budget impact.  

  ### Proposed Policy Update: The "Significant Contributing Factor" Test
  Effective immediately, **root cause(s)** will be defined as:  
  > **Any human or system action/inaction that:**  
  > 1.  **Was active during the incident timeframe,**  
  > 2.  **Materially contributed to the failure mode observed,**  
  > 3.  **And, when isolated in testing, demonstrates the capability to cause a substantially similar failure under comparable conditions.**  

  **Attribution Logic for Multi-Factor Incidents:**  
  If multiple factors (A, B, C...) simultaneously meet all three criteria above, **ALL are designated as root causes.**  

  ### Application to Incident #IN-2023-10-15
  1.  **Platform Team Config Change:**  
      *   *Active?* Yes (deployed prior to incident).  
      *   *Material Contribution?* Yes (directly reduced pool resilience).  
      *   *Independently Capable?* Yes (replay confirmed outage with *only* this change + traffic).  
      *   **→ Root Cause.**  
  2.  **Feature Team Retry Bug:**  
      *   *Active?* Yes (executing during incident).  
      *   *Material Contribution?* Yes (generated excessive load on the pool).  
      *   *Independently Capable?* Yes (replay confirmed outage with *only* this bug + traffic).  
      *   **→ Root Cause.**  

  **Conclusion:** Both factors are root causes under this revised policy.  

  ### Addressing the "Necessity" Argument Fairly
  This policy directly engages with the "it would have happened anyway" contention:  
  *   **It respects the validity of the replay test:** A factor is *not* a root cause if its removal (in isolation) would have prevented the incident.  
  *   **It rejects the loophole:** The argument that "my factor wasn't strictly *necessary* because another factor *also* could have caused it" **does not absolve accountability.** If a team's change/action *actively degraded the system* to the point where it was independently failure-prone, they own that contribution.  
  *   **It focuses on active harm:** The policy specifically requires the factor to be *active and contributing* during the incident. Latent flaws not triggered are excluded.  

  ### Implementation for Future Incidents
  1.  **Replay Testing is Key:** Continue testing scenarios with factors removed *individually* and in combination.  
  2.  **Document the "Independently Capable" Proof:** Postmortems must clearly state:  
      *   "Removing Factor A (while leaving B/C) resulted in failure: Yes/No."  
      *   "Factor A alone caused failure in replay: Yes/No."  
  3.  **Shared Accountability:**  
      *   **Fixes:** All teams owning a root cause contribute to fix items. Collaboration is encouraged for systemic fixes.  
      *   **Error Budget:** The total error-budget impact (e.g., 40 minutes) is **divided equally among all root causes** identified. (e.g., 2 root causes = 20 minutes each).  
  4.  **Edge Case: "Butterfly Effect" Factors:** If a factor passes criteria 1 & 2 but *fails* criterion 3 (i.e., it contributed but was *incapable* of causing the failure alone), it is documented as a **Contributing Factor**, not a Root Cause. Fixes are still required, but error-budget impact may be apportioned differently (e.g., minor contribution = minor impact).  

  ### Why This Works
  1.  **Closes the Accountability Gap:** Prevents scenarios where overlapping failures allow teams to avoid ownership.  
  2.  **Objective & Testable:** Relies on verifiable replay tests and documented system state, minimizing subjectivity ("Was it active? Did it contribute? Could it break things solo?").  
  3.  **Fair & Proportional:** Teams are only held accountable if their action *actively made things worse* in a demonstrably significant way *and* had independent failure potential. Impact is shared.  
  4.  **Drives Systemic Resilience:** Forces examination of *all* significant weaknesses exposed, not just the one deemed "most necessary."  
  5.  **Aligns with SRE Principles:** Error budgets reflect *all* avoidable, significant reliability regressions introduced by engineering actions.  

  ### Next Steps
  1.  This policy is adopted effective immediately for all new incident reviews.  
  2.  Incident #IN-2023-10-15 will be re-evaluated under this policy. Both the Platform Team and Feature Team will be assigned Root Cause status, share responsibility for fixes, and split the 40-minute error-budget impact (20 mins each).  
  3.  The Postmortem Template will be updated to include the "Significant Contributing Factor" test and documentation requirements.  

  This approach ensures we learn the right lessons, hold ourselves fairly accountable, and build a more resilient system where single points of failure (even overlapping ones) are systematically eliminated.  

  **Approved by:**  
  [Name], Head of Engineering  
  [Name], Head of SRE/Operations  
  [Name], Incident Review Board Chair  

  ---  

  **Key Rationale Embedded:**  
  *   **"Independent Capability" (Criterion 3)** directly addresses the "it wasn't necessary" argument by requiring proof that the team's action *introduced a critical vulnerability*. If it could break the system solo, it deserves accountability, even if another flaw *also* could.  
  *   **"Active & Contributing" (Criteria 1 & 2)** ensures teams aren't blamed for latent issues or unrelated work. Only actions materially harming production *during the incident* count.  
  *   **Shared Error-Budget Impact** acknowledges the coincidence while ensuring both teams feel the consequence proportional to their contribution to the fragility.  
  *   **Objectivity via Replay** removes ambiguity – the tests provide the evidence for attribution.
