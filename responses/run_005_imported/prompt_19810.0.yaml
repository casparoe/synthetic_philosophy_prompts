answer: |-
  That's an excellent question that cuts to the heart of the vagueness debate. Your friend's argument captures a core appeal of epistemicism: it preserves classical logic (bivalence) while explaining our ignorance of cutoffs. However, the reason large-scale empirical studies haven't "solved" vagueness isn't laziness—it's because such studies face profound methodological and philosophical hurdles that undermine their ability to pinpoint a Williamsonian cutoff:

  1.  **The Problem of Disagreement & Inconsistency:**
      *   Competent speakers *genuinely disagree* about borderline cases, even under ideal conditions. Ask 100 competent speakers if a 5'10.5" man is "tall," and you'll likely get a mix of "yes," "no," and "unsure." This variation isn't random noise; it's fundamental to how vague predicates work.
      *   *The same speaker* may give inconsistent judgments about the *same* height presented in different contexts or at different times. Our application of vague terms is context-sensitive and unstable near the borderline.
      *   **Consequence for Studies:** Aggregating data (e.g., "51% call 6'0.5" tall") doesn't reveal a *single* precise cutoff. Instead, it reveals a *range* where application probabilities shift from near 0% to near 100%. Epistemicism demands a *single* point, but data shows a *zone* of uncertainty and disagreement. Which data point within that zone is the "real" cutoff? The study can't tell us.

  2.  **The Problem of Competence & Normativity:**
      *   Epistemicism posits a fact about the *meaning* of the word "tall," not just statistical usage. A study reveals *descriptive* patterns of *actual* usage, which may include errors, idiolects, and performance limitations.
      *   Williamson argues the cutoff is fixed by the *dispositions* of competent speakers under *ideal conditions* (full information, no distractions, maximal reflection). A real-world study can't replicate these ideal conditions. How do we isolate "competent" usage from error or noise? The theory requires a normative element ("*should* apply") that descriptive data alone cannot capture.

  3.  **Higher-Order Vagueness:**
      *   The core problem recurs. Even if we *could* identify a precise cutoff point `h` (say, 6'0.125") via some study, we immediately face the question: "Is `h` itself a borderline case for *being the cutoff*?" There's no sharp boundary between heights that are *clearly* the cutoff and those that are *borderline* candidates for being the cutoff. Any empirical method would struggle to identify this second-order boundary, and so on ad infinitum. The study itself would generate new borderline cases for what counts as "tracking the cutoff."

  4.  **The Sorites Paradox Reappears Empirically:**
      *   Suppose a study claims the cutoff is 6'0.125". Present a competent speaker with someone 6'0.124". Epistemicism says this person is *definitely not tall*. But can the speaker *discern* a 0.001" difference? Almost certainly not. The speaker will likely judge the two heights the same way. If the study relies on judgments that cannot perceptually discriminate such tiny differences, how can it identify a cutoff dependent on such differences? Williamson argues our ignorance stems *from* these necessary limitations of discrimination, which a study relying on human judgments inherits.

  5.  **What Would "Better Evidence" Look Like?**
      *   Williamson's "better evidence" is often framed counterfactually: ideal knowers with perfect discrimination and access to all relevant usage facts. But *empirical* evidence gathered from *actual* humans is necessarily imperfect and limited by the very cognitive constraints Williamson cites as the *cause* of our ignorance. Better instruments measure height more precisely, but they don't measure the *semantic norm* more precisely. They just give us more precise inputs to our still-vague judgment process.

  **Pilot Studies & Relevant Research:**

  *   **Experimental Philosophy (X-Phi):** Researchers *have* conducted studies on vague predicates (e.g., Bonini et al., 1999; Ripley, 2011; Egré et al., 2013). These consistently show:
      *   Gradual shifts in application probability, not sharp cutoffs.
      *   Significant individual variation and contextual influence.
      *   Instability in individual judgments across trials.
  *   **Psycholinguistics:** Work on categorization, prototypes, and gradable adjectives confirms that vague concepts are processed with degrees of typicality and fuzzy boundaries, reflected in reaction times and neural responses, aligning better with degree-based or contextualist theories than epistemicism.

  **Why the Gap Persists & The Philosophical Stalemate:**

  1.  **Empirical Results Undercut Epistemicism's Prediction:** Instead of revealing a hidden sharp boundary trackable with better methods, studies reinforce the existence of a borderline *range* characterized by genuine disagreement and instability. This fits better with supervaluationism, contextualism, or fuzzy logic.
  2.  **The "In Principle" Escape Hatch:** Epistemicists can always retreat to the claim that *actual* studies don't achieve the *ideal* conditions required to reveal the cutoff (perfectly competent speakers, ideal contexts, infinite data). This makes the cutoff empirically inaccessible *in practice*, preserving it as a metaphysical *in principle* truth. Critics argue this renders the theory unfalsifiable and undermines its claim to explain *our* phenomenon of vagueness.
  3.  **Explanatory Burden:** Critics argue epistemicism merely *relocates* the mystery: instead of explaining *why* there's no sharp boundary, it posits a mysterious sharp boundary and explains *why we can't find it*. Many find alternative theories that eliminate the sharp boundary altogether (like supervaluationism or contextualism) more parsimonious.

  **Conclusion:**

  The lack of definitive empirical studies isn't an oversight; it reflects the deep challenges. Data on actual usage consistently shows borderline *ranges*, not sharp cutoffs, and is plagued by disagreement and context-dependence – features central to vagueness itself. Epistemicism's strength (preserving classical logic and bivalence) is also its vulnerability: it posits a precise fact that empirical methods, constrained by the very cognitive limitations the theory invokes, seem fundamentally unable to isolate, even with massive data. While studies provide valuable insights into the *dynamics* of vagueness, they haven't – and arguably *cannot* – deliver the precise, context-independent, normative cutoff epistemicism requires. The debate continues because the empirical data leans against epistemicism's core prediction, while the theory can always appeal to the gap between imperfect human performance and idealized semantic facts.
