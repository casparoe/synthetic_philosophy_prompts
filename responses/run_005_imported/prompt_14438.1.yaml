  Also, Rousseau emphasized active citizen participation in sovereignty. An algorithm mediating this process could be seen as another layer of association, which he opposed. The system might produce good results, but for Rousseau, the legitimacy comes from the process itself, not just outcomes. So even if Community Notes surfaces consensus, the method might not meet Rousseau's criteria for the general will.

