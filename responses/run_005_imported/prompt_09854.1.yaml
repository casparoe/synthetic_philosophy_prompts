answer: |-
  ## Dialogue: The Embattled Batter

  **Characters:**  
  *   **Alex:** Argues for cognitive penetrability (perception shaped by cognition/motivation).  
  *   **Bailey:** Argues for encapsulated perception (perception immune to cognition, effects are judgment/post-perceptual).  

  **Setting:** A coffee shop after their perception seminar.  

  **(Alex slides a laptop showing a graph from Witt et al.'s 2005 softball hitting study across the table.)**

  **Alex:** Bailey, look at this. Batters who are *hitting well* consistently estimate the softball as *larger* than those in a slump. This isn't a fluke. Proffitt’s work shows the same: tired people, unfit people, people with heavy backpacks – they all report hills as *steeper*. This screams cognitive penetration. Their motivational state, their action capabilities – they’re directly coloring the *appearance* of the world itself. The hill genuinely *looks* steeper when you’re exhausted.

  **Bailey:** (Leans forward, scrutinizing the graph) Hold on, Alex. Screams? Or whispers "demand characteristics"? Or maybe shouts "response bias"? Just because someone *says* the ball looks bigger or the hill looks steeper doesn’t mean their *visual experience* changed. They know they're hitting well, they know the backpack is heavy. They might *infer* the ball is bigger as an explanation for their success, or *judge* the hill as steeper to justify feeling tired. The perceptual module delivers the same visual input; cognition adds the interpretation *afterwards*.

  **Alex:** That’s the standard encapsulation rebuttal, but it doesn’t wash here. Why? *Phenomenology*. Participants consistently report the *appearance* changed – the hill *looked* steeper *to their eyes*, the ball *looked* bigger *visually*. It’s not "I think it’s steeper because I'm tired," it’s "it *looks* steeper." That’s a report about the *qualitative character* of perception itself.

  **Bailey:** And how do you disentangle that from a post-perceptual *judgment* about the percept? Introspection is notoriously unreliable. People conflate judgment with sensation all the time. "That looks dangerous" – judgment, not raw perception. Maybe the demand of the experiment – "How big is the ball?" after hitting trials – primes them to map their performance *onto* a perceptual judgment scale. They’re not lying, but the bias is in the *report*, not the *seeing*.

  **Alex:** But the effects persist with measures designed to *bypass* explicit judgment! Studies using visual matching tasks – adjusting a comparison circle to match the remembered ball size, or adjusting a crossbar to match perceived hill slant *visually* – still show the effect. It’s not just verbal estimates. The bias manifests in tasks tapping more directly into visual representation. How is that just a "judgment" bias if it’s guiding a *visual* adjustment?

  **Bailey:** Memory! Or attention! When you ask for a *visual match*, you’re relying on a stored representation. If cognition biases how you *encode* or *remember* the percept – perhaps weighting features relevant to your action capacity – the matching task reflects that biased memory trace, not the online percept itself. Or maybe the *salience* changes – the batter attends more to the ball's center when hitting well, making it *seem* larger in memory, but the actual retinal image processing hasn’t been altered by their batting average. Encapsulation holds at the early visual input stage.

  **Alex:** That feels like special pleading to protect the module. Why posit an extra step – biased encoding or memory – *specifically* to avoid penetration? Isn't the simpler explanation that the perception *is* adaptive? The system tunes the percept to reflect action possibilities: "This hill looks daunting *because* it *is* daunting *for me right now*." It’s functional! And studies *do* control for demand characteristics – using within-subject designs, implicit measures, disguising the true purpose. The effects remain robust. If it’s just guessing what the experimenter wants, why do the effects correlate so strongly with *actual* physiological state (like glucose levels) or *real* performance?

  **Bailey:** Simpler isn't always truer in cognition. The encapsulation firewall *explains* why perception is fast, mandatory, and largely veridical. Allowing motivational states to directly warp shape or size perception opens the door to radical misperception – why doesn't a hungry person see apples as giant? The effects you cite are subtle, context-specific, and often measurable *only* through these judgment-laden tasks. That screams "post-perceptual interpretation" to me. The core visual computations delivering shape, size, and slant *are* encapsulated; what changes is how we *interpret* or *scale* that output based on our bodily state and goals – a cognitive judgment applied *to* the percept, not altering the percept’s fundamental structure.

  **Alex:** But that scaling *is* the percept! You’re drawing an artificial line. The "fundamental structure" is an abstraction. The *experienced world* – the thing that guides action directly – *is* scaled by utility and ability. The batter doesn't act on an abstract size; they act on the size-as-it-appears-to-them-in-that-moment. That appearance *is* penetrated. The backpack *makes* the hill visually loom larger. It’s not an intellectual afterthought; it’s the ground truth of their visual field.

  **Bailey:** And I say the visual field’s ground truth is delivered untouched by the backpack. The feeling of burden makes the *significance* of the slope salient, leading to a biased *assessment* of its steepness. Same retinal input, different cognitive overlay. We're interpreting the *meaning* of the percept, not rewriting the percept itself. Until you show me a truly cognitively impenetrable *perceptual* measure – like early visual ERP components or involuntary eye movements – changing with batting average, I’ll stick with encapsulation and cognitive judgment. The burden of proof is on penetration.

  **Alex:** (Sighs) And I’ll say you’re ignoring the lived reality of perception. The burden feels heavier when the hill *looks* steeper. The evidence is mounting. But fine, pass the sugar. This hill of a debate just got a little steeper... or does it just *look* that way to me?
