  I should explain the mechanics. The diachronic book involves two bets: one before an event and another after, conditional on the event. If the agent plans to update in a way that deviates from conditionalization, the bookie can combine these bets to create a sure loss. The key is that the agent commits to an update rule in advance. The bookie uses this commitment to structure the bets.

