answer: |-
  Here are ten tightly-focused interview questions designed to press on the tensions within Aquinas's thought and avoid restating the standard summary, complete with anticipated responses and probing follow-ups:

  ### Core Tensions & Distinctions
  1.  **Primary:** Aquinas makes a crucial distinction between a *tyrant by practice* (legitimate title) and a *tyrant by usurpation* (defect of title). While he clearly permits resistance to the usurper, his justification for resistance against the legitimate tyrant seems primarily procedural ("reserved to public authority"). **Is this distinction fundamentally *juridical* (about who holds rightful power to judge) or *moral* (about the inherent nature of the tyrant's action)?** Does the act of usurpation *itself* morally license resistance in a way that tyranny-by-practice does not, even if the oppression is identical?
      *   *Likely Answer:* She'll emphasize the juridical aspect – the usurper never had rightful authority, so resistance isn't rebellion against *legitimate* power.
      *   **Follow-up:** If the *moral* wrong (oppression) is identical in both cases, does Aquinas's procedural barrier against resisting the legitimate tyrant risk making the legitimacy of the *title*, rather than justice, the ultimate shield against resistance? Does form (title) trump substance (justice) here?

  2.  **Primary:** Aquinas argues that reserving judgment/action against a legitimate tyrant to "public authority" prevents ambitious men from using the pretext of tyranny to kill decent rulers. **Is this primarily a *prudential* safeguard based on human fallibility and sin, or is it a *principled* conclusion flowing directly from his natural law framework about the necessity of ordered hierarchy for the common good?**
      *   *Likely Answer:* She'll likely say it's both, but rooted in natural law's requirement for order and the dangers of anarchy.
      *   **Follow-up:** Doesn't this prudential concern effectively *override* the natural law principle that unjust rule loses its binding force? If the tyrant's rule is fundamentally unjust (violating the *ratio* of law), why does the *potential* for abuse by others create an absolute procedural barrier for the oppressed, rather than just a caution?

  ### Divine Scourge & The Problem of Agency
  3.  **Primary:** Aquinas frames tyranny as a "scourge of God" permitted for the people's sins (*De Regimine* I.6). This seems to counsel patience, repentance, and endurance rather than resistance, especially where no higher temporal authority exists. **How does this theological framing *practically* interact with his (limited) theoretical allowance for resistance? Doesn't it significantly dampen any impetus towards action?**
      *   *Likely Answer:* She'll acknowledge the tension, noting Aquinas sees endurance as virtuous but doesn't *explicitly* rule out action authorized properly. He balances temporal and spiritual perspectives.
      *   **Follow-up:** In a scenario where no higher temporal authority exists or can convene (e.g., a supreme monarch turned tyrant), and the people are suffering under a "divine scourge," does Aquinas's framework leave any morally permissible *active* remedy beyond prayer and repentance? Is corporate action even conceivable without a pre-existing constitutional structure?

  4.  **Primary:** Following up on the "public authority" requirement: Aquinas often envisions a prince, a superior, or "the community as a whole" acting corporately. **What concrete mechanisms, within Aquinas's own thought, exist for "the community" to *act* as a corporate body against a legitimate tyrant, especially in a monarchy lacking strong representative institutions? Is this corporate agency more a theoretical possibility than a practical prescription?**
      *   *Likely Answer:* She'll stress it's difficult, perhaps relying on remnants of older structures (like barons representing the community) or natural law's inherent right to self-preservation collectively.
      *   **Follow-up:** If no such mechanism exists or is too dangerous to convene (precisely because of the tyrant), does Aquinas effectively condemn the populace to passive suffering, making his "allowance" for resistance against legitimate tyrants largely theoretical and inaccessible? Does his reliance on corporate action mask a practical impossibility?

  ### Natural Law Tensions & Prudence
  5.  **Primary:** Aquinas states a ruler who governs unjustly "loses the character of a ruler" and his laws lack the force of law (*ST* I-II, Q.96, A.4). Yet, he simultaneously erects significant barriers (public authority, divine scourge) against acting on this loss of legitimacy. **Isn't there a fundamental tension here between the *moral judgment* (the ruler is no true ruler) and the *practical prescription* (endure unless authorized procedure exists)?**
      *   *Likely Answer:* She'll frame it as Aquinas balancing the ideal (justice) with the real (order, consequences of disorder).
      *   **Follow-up:** Does this balancing act risk rendering the powerful moral judgment about lost legitimacy practically inert? Is the natural law principle effectively neutered by the prudential and procedural constraints he imposes?

  ### Later Developments & Fidelity
  6.  **Primary:** Later scholastics like John of Paris, Suárez, and especially Mariana expanded justifications for tyrannicide, often invoking Aquinas. **Focusing specifically on Mariana: when he argues a lone individual can kill a tyrant *propter bonum publicum* after exhausting other means and ensuring no innocent bloodshed, is this a *logical extension* of Aquinas's core principles (e.g., the ruler's loss of legitimacy, natural right to self-preservation) working within a different political context, or a *fundamental departure* due to its shift from corporate/public agency to potentially private action?**
      *   *Likely Answer:* She'll likely argue it's a contextual development *inspired* by Aquinas but pushed further, emphasizing Mariana's focus on the *tyrant's* loss of status making him an enemy of the people.
      *   **Follow-up:** Given Aquinas's explicit fear of ambitious men using tyranny as a *pretext* for private killing, isn't Mariana's allowance for individual action (even with caveats) precisely the kind of dangerous opening Aquinas sought to *close*? Does this make Mariana's doctrine more a reaction to Absolutism than a faithful unfolding of Thomistic principles?

  7.  **Primary:** Building on the previous question: Aquinas grounded resistance in natural law but filtered it through structures of authority. Mariana and others later grounded it more directly in popular sovereignty concepts. **Does this shift in foundational justification (natural law + hierarchy vs. popular sovereignty) represent the *real* break from Aquinas, making later doctrines appear more "permissive" not just in practice but in principle?**
      *   *Likely Answer:* She'll agree this is a key shift, locating Aquinas within medieval hierarchy and later thinkers in the emerging early modern state/popular sovereignty debates.
      *   **Follow-up:** If popular sovereignty is the necessary conceptual foundation for making resistance against a legitimate tyrant *operational* beyond Aquinas's limited procedural path, does this mean Aquinas's own framework was inherently *incapable* of providing a robust doctrine of resistance without significant conceptual borrowing from later developments?

  ### Concluding Synthesis
  8.  **Primary:** Considering these tensions – the title/practice distinction, the procedural barriers, the divine scourge framing, and the later developments – **would it be more accurate to characterize Aquinas not as a clear *forerunner* of a "right to resist," but rather as a thinker who *identified the core problem* (tyranny violates natural law/justice) but whose primary contribution was outlining the profound *difficulties and dangers* inherent in any practical implementation of resistance against a ruler with legitimate title?**
      *   *(This question synthesizes the themes and invites the professor to reframe Aquinas's legacy based on the complexities explored).*

  **Key Strategies Employed:**

  *   **Focus on Internal Logic:** Questions probe the coherence between Aquinas's principles (natural law, justice) and his prescriptions (procedural barriers, endurance).
  *   **Problematic Implications:** Questions highlight potential contradictions or practical impossibilities within his framework (e.g., corporate action without mechanisms, moral judgment without remedy).
  *   **Nature of Distinctions:** Pressing whether key distinctions (title/practice, principled/prudential) hold up under scrutiny or create problematic hierarchies.
  *   **Theological vs. Political:** Exploring how the "divine scourge" idea interacts with (and potentially undermines) political resistance theory.
  *   **Later Developments as Lens:** Using Mariana not just for comparison, but as a tool to expose the limitations or specific emphases in Aquinas's own structure by asking if later ideas are *extensions* or *violations* of core Thomistic concerns.
  *   **Anticipating Answers:** Follow-ups are designed to push back on the most likely "safe" or standard academic responses, forcing deeper engagement with the tensions.
  *   **Reframing Legacy:** The final question directly challenges the simplistic "forerunner" narrative based on the complexities discussed.

  These questions should elicit nuanced analysis from the professor, moving far beyond the textbook summary and directly addressing the fascinating complexities and tensions you've identified in Aquinas's thought. Good luck with the interview and the documentary!
