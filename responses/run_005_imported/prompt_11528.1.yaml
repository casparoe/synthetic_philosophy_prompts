answer: |-
  Your journey from solid-state chemistry to metaphysics is fascinating—it's a testament to how deeply material constitution challenges our intuitions. Let's break this down step by step, respecting both your scientific background and the philosophical nuances. I'll address your three requests in order, aiming for clarity while honoring the depth of these arguments.

  ### 1. **Leibniz's Law, Gibbard's Case, and the Contingent Identity Escape**
  #### **The Leibniz's Law Argument**
  - **Setup**: Gibbard’s case involves Lumpl (a lump of clay) and Goliath (a statue molded from it). They coincide spatially and materially throughout their existence.
  - **The Conflict**: 
    - *Property Difference*: Lumpl can survive being squashed into a ball (it remains a lump), but Goliath cannot (squashing destroys the statue). Thus:
      - Lumpl has the property *can survive being squashed*.
      - Goliath lacks this property.
    - *Leibniz's Law*: If two objects are identical (i.e., one and the same), they must share *all* properties. If Lumpl and Goliath differ in even one property (like modal resilience), they cannot be identical.
  - **The Forced Choice**:
    - *Option 1 (Strict Identity)*: Rejected due to the property difference.
    - *Option 2 (Distinct Co-located Objects)*: Accept that two different things occupy the same space at the same time (Lumpl ≠ Goliath).

  #### **Gibbard’s Contingent Identity & Its Problem**
  - **The Escape**: Gibbard suggests Lumpl and Goliath are *contingently* identical. In the actual world, they are one object; but in possible worlds where Lumpl is squashed and survives, they are distinct.
  - **The Contradiction**: 
    - Kripke’s necessity of identity (if A = B, then A = B in all possible worlds) implies that identity, if true, is *necessary*. Contingent identity violates this: if Lumpl = Goliath in this world but not in another, then transworld identity fails.
  - **Counterpart Theory as a Fix**: 
    - David Lewis’s counterpart theory replaces transworld identity with similarity relations. Lumpl and Goliath share the same counterpart in worlds where they coincide, but have different counterparts in worlds where they diverge (e.g., Lumpl has a squashed-lump counterpart, Goliath has no counterpart in that world).
    - **Why it’s controversial**: It replaces classical identity with a looser, context-dependent relation. Critics argue this is ad hoc or misrepresents our modal intuitions (e.g., we intuitively think *Goliath itself* couldn’t survive squashing, not that it lacks a counterpart).

  ---

  ### 2. **The Grounding Problem: Why It’s Worse Than “Just Another Brute Fact”**
  #### **The Core Issue**
  - **Shared Base Properties**: Lumpl and Goliath agree on *all* microphysical properties (mass, shape, atom arrangement) and categorical (non-modal) properties at every moment. Yet they differ in:
    - *Modal properties* (e.g., survival conditions).
    - *Sortal properties* (Lumpl is a lump; Goliath is a statue).
  - **The Challenge**: What *grounds* (explains, metaphysically determines) these differences if their underlying reality is identical? 

  #### **Why It’s a Distinctly Bad Brute Fact**
  1. **Violation of Supervenience**: 
     - Microphysical properties are typically thought to *fix* all higher-level properties. If two entities are microphysically identical, they should be identical *simpliciter*. A difference without a microphysical basis seems arbitrary.
  2. **Local vs. Global Bruteness**: 
     - Metaphysics accepts *global* brute facts (e.g., fundamental laws), but this is a *local* brute fact. It’s not a fundamental law that "lumps survive squashing but statues don’t"—it’s an unexplained exception *within* a material duplicate.
  3. **Explanatory Inversion**: 
     - The difference implies that higher-level properties (being a statue) don’t arise from microphysics but are "tacked on." This feels like dualism for objects—a charge metaphysicians keen to avoid.

  #### **Why Baker’s "Artworld" Solution Reverses Explanation**
  - Baker grounds Goliath’s statue-hood in its relational property: being intended as art and recognized by the "artworld."
  - **The Backwardness Critique**:
    - Relations to minds/intentions are *causal* or *historical* explanations, not *constitutive*. They explain how Goliath *came to exist* but not what it *is* at a given moment.
    - Example: If all humans vanished, Goliath’s microphysical duplicate would still *be* a statue (intrinsically), even without an artworld. Baker’s view makes its essence depend on external factors, violating the intuition that objects have intrinsic natures.

  ---

  ### 3. **The Case Against Eliminativism (Denying Statues Exist)**
  Eliminativism (defended by Trenton Merricks, Peter van Inwagen) says: only simples (particles) and living organisms exist; "statues" are just particles arranged statue-wise. Why do most metaphysicians resist this?

  #### **The Strongest Objections**
  1. **Phenomenological & Practical Inadequacy**:
     - **Incredulity Staring Back**: Denying that statues exist contradicts universal intuition. If eliminativism is true, you’ve never seen a statue—only particles "mirroring" one. This strains credibility more than accepting co-location.
     - **Language & Practice**: We quantify statues ("*That* statue is beautiful"), refer to them, and interact with them *as objects*. Eliminativism must reinterpret this as massive error—a cost outweighing parsimony gains.

  2. **The Problem of Causal Powers**:
     - If only particles exist, then *the arrangement* (e.g., statue-wise) must explain why we observe statue-like effects (e.g., a statue shattering when dropped). But arrangements aren’t entities with causal powers—only objects are. Eliminativism struggles to explain macro-level causation without reifying arrangements.

  3. **Collapse into Universal Eliminativism**:
     - If statues don’t exist because they’re "just" arranged particles, then *all* composites (tables, mountains, even brains) face the same threat. This risks nihilism (only particles exist), which even eliminativists often reject as untenable for daily life/science.

  4. **Modal Properties Persist**:
     - Even if statues don’t exist, the *arrangement* has modal properties (e.g., *this arrangement* couldn’t survive squashing). The grounding problem resurfaces for arrangements vs. lumps.

  ---

  ### Why This Matters to Your Chemist’s Perspective
  Your instinct—that the statue and lump are one thing under two descriptions—fails because descriptions don’t *create* properties; they track them. Gibbard shows that *being a statue* isn’t just a description: it confers modal profiles that a lump lacks. Chemistry’s focus on intrinsic properties (like crystal structure) doesn’t resolve this, as constitution involves extrinsic (historical, modal) properties. Yet eliminativism’s cost—denying the reality of emergent objects—may feel like surrendering too much to the puzzle. The debate endures because no solution is cost-free: co-location posits extra entities, contingent identity bends logic, and eliminativism challenges common sense. Your sympathy for eliminativism is philosophically respectable, but its trade-offs explain why many seek alternatives. If you’d like, I can suggest further readings that bridge chemistry and metaphysics (e.g., Harré on stuff ontology).
