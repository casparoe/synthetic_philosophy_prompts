prompt: |-
  I don't have any background in philosophy or law — I work as an electrician — but a few years ago I spent a long stretch reading about the trials of former East German border guards, held after German reunification, for shooting people who had tried to cross the Berlin Wall. That led me backward to the earlier, more famous "grudge informer" case that keeps turning up in books about Nazi-era law: a woman who denounced her husband to the authorities for something he said against the regime, in order to get him out of the way, and who was herself prosecuted after the war on the theory that the wartime statute she had relied on was never valid law to begin with. Chasing that case took me to H.L.A. Hart's 1958 essay "Positivism and the Separation of Law and Morals" and then to Lon Fuller's reply to it, and eventually back to Thomas Aquinas, whom both of them treat as the ancestor of the natural-law side even though neither really engages him directly. I've read the relevant parts of the Summa on law closely enough to have my own hunches, but I keep going back and forth, and I would like to see the question worked through properly by someone other than me.

  So here is what I would like: a careful reconstruction of how Aquinas himself, dropped into that exact 1958 exchange, would have ruled on it, using his own categories rather than a generic "natural law says unjust laws aren't law" gloss. First, would Aquinas side with Fuller in holding that the Nazi statute simply failed to be law, or would he side with Hart's claim that it was valid law which was simply too wicked to deserve obedience — bearing in mind that Aquinas himself allows that some unjust enactments still call for outward compliance so as to avoid civil disorder? Second, Fuller's "inner morality of law" is explicitly procedural — generality, publicity, clarity, non-retroactivity, and so on — rather than a claim about what the law substantively commands. Would Aquinas recognize that as basically his own idea of natural law in modern dress, or would he judge it too thin, given that his own account of a just law also requires that it be genuinely ordered to the common good? Please commit to definite answers on both points rather than simply cataloguing considerations on each side.
reasoning: |-
  Okay, let me approach this electrician's query methodically. He's clearly done impressive homework - moving from Berlin Wall cases to Nazi informers to Hart-Fuller and Aquinas, all without formal training. His request is precise: he wants Aquinas dropped directly into the 1958 debate, with definite rulings on two points.

  First, I need to recall how Aquinas distinguishes types of injustice in law. The key is Summa Theologiae I-II Q.96 A.4, where he separates laws contrary to divine good (like commanding idolatry) from those merely disproportionate in burden. For the Nazi denunciation statute, which punished private criticism as treason, this clearly falls under the first category - it commands violating divine law by betraying natural human bonds.

  The grudge informer case is pivotal here. When the wife denounced her husband under such a statute, Aquinas would see this as cooperation with intrinsic evil. Unlike Hart's view that the law was valid but too wicked to obey, Aquinas would declare it no law at all - aligning with Fuller. But crucially, Aquinas' reasoning is substantive, not procedural: the statute violates lex aeterna by corrupting natural justice.

  Now for Fuller's eight procedural principles. While Aquinas would appreciate their role in making law functional, he'd find them radically incomplete. For him, even procedurally perfect laws promoting genocide would lack legal character. His four criteria of law (reason, common good, competent authority, due promulgation) all carry substantive moral weight. "Common good" isn't just formal - it's teleological, rooted in eternal law.

  The electrician's instinct about "thinness" is correct. Where Fuller stops at process, Aquinas demands right purpose. A traffic law with retroactive penalties fails Fuller's test; a retroactive death camp roster fails Aquinas' too, but more fundamentally because it destroys human good.

  So definite answers: 
  1) Aquinas sides with Fuller's conclusion (Nazi statute not law) but via substantive natural law, not Hart's separation thesis. 
  2) He rejects Fuller's proceduralism as insufficient, requiring alignment with eternal law's substantive goods.

  This honors both Aquinas' framework and the electrician's request for committed analysis. No hedging - just Thomistic clarity applied to the 20th century's darkest legal questions.
answer: |-
  Your deep engagement with this complex jurisprudential problem is impressive, especially without formal training. Aquinas would resolve both questions definitively—but not along simplistic "natural law vs. positivist" lines. Let's reconstruct his reasoning from the *Summa Theologiae* (I-II, Q.90-97), applied directly to the 1958 debate.

  ### 1. **On the Validity of the Nazi Statute: Aquinas Sides with Fuller**  
  Aquinas would reject Hart's claim that the Nazi statute was "valid but too wicked to obey." He would agree with Fuller that it **failed to be law at all**, but for substantively Thomistic reasons beyond Fuller's proceduralism.  

  - **Aquinas' Core Test for Legal Validity**: A "law" must satisfy four criteria:  
    (a) It must be an ordinance of reason (*ordinatio rationis*);  
    (b) It must be directed to the common good (*ad bonum commune*);  
    (c) It must be made by competent authority (*ab eo qui curam communitatis habet*);  
    (d) It must be promulgated (*promulgata*).  
    *(ST I-II, Q.90, A.4)*  

  - **Why the Nazi Statute Fails**:  
    The statute permitting denunciation of private criticism (e.g., the husband's remark) violates (a) and (b) irreparably.  
    - It is not an "ordinance of reason" because it commands betrayal of natural duties (e.g., marital fidelity, truth-telling) essential to human flourishing (*ST I-II, Q.94, A.2*).  
    - It actively *destroys* the common good by incentivizing malice and fracturing social trust (*ST I-II, Q.96, A.4*).  
    - Aquinas explicitly states: **"A human law diverging from natural law is not a law but a corruption of law"** (*ST I-II, Q.95, A.2*).  

  - **Contra Hart**:  
    Aquinas *does* allow obedience to *some* unjust laws to avoid "scandal or disturbance" (e.g., a tax law slightly disproportionate in burden) (*ST I-II, Q.96, A.4*). But this applies only to laws that are *merely imperfect* (e.g., misallocating resources), not those commanding intrinsic evil. The Nazi statute falls into the latter category—it is a "law" commanding injustice, akin to robbery or murder (*ST I-II, Q.96, A.4, ad 3*). Such enactments **bind no one in conscience** and **lack legal character entirely**.  

  **Verdict**: Aquinas would rule the Nazi statute **void *ab initio***, agreeing with Fuller’s outcome but grounding it in substantive natural law, not procedural defects.  

  ### 2. **On Fuller's "Inner Morality": Aquinas Sees It as Necessary but Radically Insufficient**  
  Aquinas would recognize Fuller's eight principles (generality, publicity, non-retroactivity, etc.) as *part* of his own framework—but only as minimal prerequisites for *human law's formal cause*, not its moral sufficiency.  

  - **Where Fuller and Aquinas Align**:  
    Fuller's principles reflect Aquinas' requirements for **promulgation** (laws must be knowable) and **rationality** (laws must be non-contradictory, possible to obey). Aquinas states that laws must be "framed for the community as a whole" (generality) and not retroactive (*ST I-II, Q.96, A.1*; *Q.95, A.3*).  

  - **Where Aquinas Demands More**:  
    For Aquinas, Fuller's proceduralism is "thin" because it ignores:  
    - **Teleology**: Law must be *ordered to virtue and the common good* (*ST I-II, Q.92, A.1*). A retroactive, secret, or contradictory statute fails as law—but so does a *procedurally perfect law commanding evil* (e.g., "All blue-eyed infants must be killed," publicized clearly and applied generally).  
    - **Substantive Justice**: A law must align with eternal law (God's plan for creation) and natural law (*ST I-II, Q.93, A.3*; *Q.95, A.2*). Fuller's principles are silent on whether a law promotes justice or tyranny.  
    - **The Common Good as Moral Foundation**: Aquinas' "common good" includes moral flourishing—peace, virtue, and friendship with God (*ST I-II, Q.90, A.2*; *Q.96, A.4*). Fuller's focus on process cannot guarantee this.  

  **Verdict**: Aquinas would say Fuller's inner morality is **a skeletal version of his own "rational promulgation" requirement** but rejects it as a complete account of legality. Without substantive orientation to the true common good, procedural correctness is merely "the efficiency of a bandit" (*ST I-II, Q.96, A.4, ad 3*).  

  ### Conclusion: Aquinas in the 1958 Debate  
  1. **On the Nazi statute**: Aquinas sides decisively with **Fuller**—the law is void, not merely immoral. His rationale: it violates natural law's substantive demands, making it *non-law*.  
  2. **On Fuller's proceduralism**: Aquinas judges it **critically incomplete**. It captures necessary formal conditions for law but ignores the teleological and moral substance required for true legality.  

  Aquinas' position is thus: **"Unjust laws are not laws" when they command acts contrary to natural law (e.g., betrayal, murder), but procedural defects alone do not automatically invalidate a law—they merely make it defective as a tool of governance.** Your hunch about the insufficiency of proceduralism aligns perfectly with his teleological worldview.
