prompt: |-
  My team just rolled out a system where any flagged post gets reviewed by 25 randomly picked employees who each vote misleading or fine, majority rules. A coworker keeps insisting that with that many people voting, the crowd is basically guaranteed to land on the right answer, so we should just shut down our actual fact-checking team and let this run on autopilot. Thing is, most people just skim the top comment before voting instead of checking anything themselves, and on the really technical posts I doubt the average voter has better then a coin flip's shot at knowing what's true. Something about his confidence feels off to me but I can't quite explain why - is he right that more random voters basically guarantees the crowd gets it right?
reasoning: |-
  Okay, the user is dealing with a situation at work where their team has implemented a system for reviewing flagged posts. Each post is reviewed by 25 randomly selected employees who vote whether it's misleading or fine, with the majority deciding the outcome. The user's coworker is pushing to eliminate the actual fact-checking team, arguing that with 25 voters, the crowd will almost always be correct. However, the user is skeptical because voters often just skim the top comment instead of verifying facts themselves. On technical posts, the average voter might only have a 50/50 chance of being correct. The user wants to know if more voters really guarantee accuracy and why their coworker's confidence might be misplaced.

  First, I need to recall the Condorcet Jury Theorem since it seems relevant here. The theorem states that if each voter has a better than 50% chance of being correct, then as the number of voters increases, the majority decision becomes more accurate. But if voters are only 50% accurate, the majority is no better than a coin flip. And if they're worse than 50%, adding more voters makes the outcome worse. So the key factor is the individual voter's competence.

  The coworker's argument hinges on assuming that each voter is more than 50% competent. But the user's observation suggests otherwise, especially for technical posts where voters might rely on top comments without fact-checking. This reliance could lead to herding behavior, where people follow the initial vote or comment, amplifying errors instead of correcting them.

  I should also consider other factors. Random selection is good only if the pool has diverse knowledge. But if employees aren't domain experts, their collective judgment might still be poor. Also, the voting system doesn't address ambiguous cases where the truth isn't clear-cut. Plus, without fact-checkers, there's no way to handle nuanced issues or correct systemic biases.

  The user's deeper concern might be about maintaining quality control. Eliminating fact-checkers could lead to more errors, especially in technical areas, which might damage credibility. They might also worry about the team's role being undervalued based on an oversimplified model.

  In summary, the coworker's mistake is assuming voter competence above 50%. Without that, more voters don't help. The user's intuition about skimming and lack of expertise points to low competence, making the system unreliable. Fact-checkers are still necessary for accuracy, especially on complex topics.
answer: |-
  Your coworker's argument relies on the **Condorcet Jury Theorem (CJT)**, which *seems* to support his claim, but crucially **only under specific, unrealistic conditions that don't match your reality.** His confidence is misplaced because he's ignoring the critical assumptions of the theorem. Here's the breakdown:

  1.  **What the Condorcet Jury Theorem Says (Simplified):**
      *   If *each individual voter* has a probability `p > 0.5` (better than a coin flip) of making the *correct* judgment independently...
      *   ...then as the number of voters (`n`) increases...
      *   ...the probability that the *majority* vote is correct approaches 1 (certainty).

      Under this ideal scenario, your coworker is right: 25 voters would make the correct decision almost all the time.

  2.  **Why Your Coworker is Wrong (The Assumptions Break Down):**
      *   **Assumption 1: p > 0.5 (Individual Competence):** This is the **fatal flaw** in applying CJT here. You've already identified the core problem:
          *   *"I doubt the average voter has better than a coin flip's shot at knowing what's true"* (especially on technical posts). If `p = 0.5`, the theorem tells us the majority is correct only 50% of the time (no better than one person flipping a coin). If `p < 0.5` (voters are systematically biased or misinformed), the majority vote becomes *less* reliable as `n` increases!
          *   *"Most people just skim the top comment before voting"*: This destroys the `p > 0.5` assumption. Voters aren't making independent judgments based on their own analysis of the *post*; they are heavily influenced by potentially incorrect or misleading information in the *top comment*. This introduces **correlation** and **bias**, not independent competence.
      *   **Assumption 2: Independent Judgments:** CJT requires voters to decide *independently*. Skimming the top comment before voting **violates independence**. Votes become correlated – if the top comment is wrong, many voters are likely misled simultaneously. Instead of random errors canceling out, correlated errors amplify, making the majority *more* likely to be wrong if the top comment is wrong.
      *   **Assumption 3: Common Goal / Understanding:** CJT assumes everyone is sincerely trying to find the "correct" answer based on the same understanding of the question. In your system:
          *   Voters might interpret "misleading" differently.
          *   They aren't fact-checking; they're reacting to a comment.
          *   They might vote based on emotion, personal bias, or groupthink, not truth-seeking.
      *   **Assumption 4: Binary Choice with Clear Truth:** Real-world content moderation is rarely a simple binary "misleading/fine" with one objectively verifiable truth. Nuance, context, and interpretation matter. A crowd skimming comments isn't equipped to handle this.

  3.  **The Danger of "p ≤ 0.5" and Herding:**
      *   **Coin Flip (`p = 0.5`):** With 25 voters, the probability the majority is correct is only about **50.1%**. This is statistically indistinguishable from a single coin flip. Adding more voters doesn't improve this.
      *   **Systematically Misled (`p < 0.5`):** If the top comment is often wrong or the crowd lacks basic competence (e.g., `p = 0.45`), the probability of a *correct* majority vote *decreases* as you add more voters! The system actively gets worse on autopilot.
      *   **Herding Effect:** Skimming the top comment before voting is classic herding. Early signals (the top comment) disproportionately influence later voters, suppressing independent thought and amplifying the initial signal, whether it's right or wrong. This makes the outcome highly dependent on the *quality of the first few comments*, not the collective wisdom of 25 people.

  4.  **Why 25 Voters Isn't Magic (Even if p>0.5):**
      *   While CJT says probability approaches 1 as `n` gets huge, 25 is still a relatively small number in probability terms.
      *   If individual competence is only slightly above 0.5 (e.g., `p = 0.55`), the probability of a correct majority with 25 voters is only about **66%**. That means **1 in 3 decisions is still wrong!** Is that acceptable for "autopilot" fact-checking?
      *   This "66%" assumes perfect independence and competence, which your system demonstrably lacks.

  **Conclusion: Your Intuition is Correct.**

  *   **More random voters only guarantees correctness if each voter is independently competent (`p > 0.5`).** Your observations prove this isn't happening.
  *   **Skimming top comments destroys independence and competence (`p`):** It introduces herding, correlation, and reliance on potentially faulty sources.
  *   **On technical topics (`p ≈ 0.5`), the crowd is no better than a coin flip.**
  *   **If herding leads to systematic bias (`p < 0.5`), the crowd becomes reliably wrong.**

  **Recommendation:** Do NOT shut down the fact-checking team. The current voting system is vulnerable to manipulation (e.g., strategic top comments), herding, and high error rates on nuanced or technical content. It might be *useful* as a signal or for low-stakes flags, but it's **not a replacement for expert review.**

  **What to tell your coworker:**

  > "The math you're thinking of (Condorcet Jury Theorem) only works if each voter is independently *more likely than not* to be correct. Our system breaks that assumption because voters aren't independently evaluating the post; they're heavily influenced by the top comment, which could be wrong. On complex topics, many voters are essentially guessing. This means the crowd isn't getting smarter with more people; it's often just amplifying the first opinion they see, right or wrong. We need the fact-checkers to provide the baseline competence and independence the voting system lacks."

  Your skepticism is well-founded. Crowdsourcing *can* work under the right conditions, but your current setup isn't those conditions.
