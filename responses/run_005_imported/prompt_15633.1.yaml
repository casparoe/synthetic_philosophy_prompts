answer: |-
  You've hit on one of the most persistent (and philosophically rich) headaches in the hypocrisy literature. Let's break down the "standing" mechanism granularly, comparing key accounts and tackling the tu quoque worry head-on. The core insight is that hypocritical blame isn't *false* blame, but *inappropriately enacted* blame – a misfire in the *performance* of the moral act.

  **The Core Structure of the Standing Claim (Against Tu Quoque):**

  1.  **Blame as a Communicative/Relational Practice:** Standing accounts start from a non-consequentialist view of blame. Blame isn't *just* asserting a proposition ("You acted wrongly") or trying to cause suffering. It's a complex *second-personal* address within a moral community. It involves:
      *   **Holding Accountable:** Demanding justification, acknowledgment, or change.
      *   **Invoking Shared Norms:** Appealing to standards the blamer implicitly endorses *as binding on all*, including themselves.
      *   **Assuming Authority:** Presupposing the blamer has the *position* or *right* to hold *this specific person* accountable for *this specific norm* at *this specific time*.

  2.  **Hypocrisy as Undermining the Presuppositions of Blame:** The hypocrite's past/present conduct attacks the very foundations required for their blame to function *as a legitimate act of holding accountable*:
      *   **Undermining Shared Norm Invocation:** By violating the norm themselves (without excuse/justification), they demonstrate they don't genuinely treat it as *authoritatively binding* in the way their blame presupposes. Their blame implicitly says "This norm *must* be followed," but their actions scream "Except when *I* don't feel like it."
      *   **Undermining Authority/Position:** Their violation, especially if unacknowledged or unaddressed, positions them as someone who *exempts themselves* from the norms they seek to enforce on others. This violates a fundamental condition of *moral equality* necessary for reciprocal accountability.

  **Granular Breakdown: What the Hypocrite is Doing Wrong *in the Act of Blaming*:**

  1.  **The Implicit Exemption Claim (Wallace's "Equal Standing"):**
      *   **The Move:** When you blame X for violating norm N, you implicitly present yourself as *subject to N* and committed to its authority. This is part of what gives you the *standing* to hold X accountable – you are both bound by the same rules.
      *   **The Hypocrite's Contradiction:** The hypocrite, through their own unexcused violation(s) of N, has *implicitly claimed an exemption* from N for themselves. They act as if N doesn't apply to them in the same way it applies to others.
      *   **The Defect in the Blaming Act:** When the hypocrite *then* blames X for violating N, they are simultaneously (and incoherently):
          *   Asserting: "N is authoritatively binding (on you, X)."
          *   Implicitly Asserting (via their own conduct): "N is *not* authoritatively binding (on me)."
          *   Asserting: "I have the standing (as a fellow subject of N) to hold you accountable to N."
          *   Demonstrating (via their exemption): "I am *not* a fellow subject of N in good standing; I place myself above it."
      *   **Why it's not *just* inconsistency:** The inconsistency isn't merely logical (believing P and not-P). It's *performative*. The act of blaming *itself* requires the blamer to occupy a specific normative position (bound by N, equal to X). The hypocrite's history means they *cannot occupy that position* when they attempt the act. Their attempt is like a judge trying to sentence someone for a law they themselves flagrantly violate – the sentence isn't necessarily *wrong* about the law, but the judge's act is illegitimate *because of who they are and what they've done*. The defect is in the *source* and the *relationship*.
      *   **The Mechanism:** The hypocrite's blaming act *presupposes* a normative equality and shared subjection they have *already undermined*. Their act is therefore *void* or *misfires* as an authoritative act of holding accountable. It's not that the *content* is wrong; it's that the *speaker* lacks the *position* to utter it *as authoritative blame*.

  2.  **The Fairness/Failure to Share Burdens Account (Fritz & Miller):**
      *   **The Move:** Blaming imposes a significant burden (guilt, shame, demands for change, potential sanctions) on the blamed. The practice of blame is only fair if those who impose these burdens are *willing to bear them themselves* when they violate the norms. Willingness is demonstrated by *actually conforming* or offering sincere excuses/justifications when failing.
      *   **The Hypocrite's Unfairness:** The hypocrite imposes the burdens of blame on others for violating N while systematically *avoiding those same burdens* for their own violations (through secrecy, self-exemption, lack of remorse). They benefit from the norm (by blaming others) without paying the cost (conforming or accepting blame).
      *   **The Defect in the Blaming Act:** The act of blaming is unfair *in its imposition*. It's akin to demanding others pay taxes you dodge, or enforcing a curfew you ignore. The hypocrite exploits the moral practice for unilateral advantage.
      *   **Why it's not *just* inconsistency:** The defect isn't the inconsistency per se, but the *unfair distribution of burdens* inherent *in the act of blaming itself*. The hypocrite uses the tool of blame, which relies on shared burden-bearing for its legitimacy, as a weapon without subjecting themselves to its demands. Their act *harms* (imposes burdens) in a way that violates the reciprocity conditions that make the practice of blame justifiable.
      *   **The Mechanism:** The hypocrite's blaming act *unfairly exploits* the moral practice. It imposes burdens without the requisite willingness to shoulder equivalent burdens, corrupting the practice's fairness. The act is defective *as an imposition of burdens* because the imposer is a free rider.

  **Escaping the Tu Quoque? (The Crucial Move)**

  Both accounts *try* to escape the tu quoque by arguing that the defect identified **invalidates the blaming act *as a moral performance***, not by refuting the *content* about the target's wrongdoing.

  *   **The Tu Quoque Objection:** "So what if the blamer is a hypocrite? That doesn't change the fact that *I* did wrong! Their hypocrisy is irrelevant to *my* blameworthiness."
  *   **Standing Response:** "You misunderstand. We agree you may be blameworthy *in principle*. The point is that *this particular act of blame*, performed by *this hypocrite*, **fails *as an act of moral accountability***. It is not a *legitimate* way of holding you accountable. The hypocrite lacks the *moral authority* or *position* to *successfully enact* this holding-to-account. Their hypocrisy makes their blame *inapt*, *unfair*, or *void* as a moral communication *to you*, regardless of your actual fault. You *are* blameworthy, but *they* cannot be the one to meaningfully blame you *in this way*."
  *   **Analogy:** Think of a corrupt judge sentencing a genuinely guilty person. The sentence might be factually correct (the person *is* guilty), but the *act of sentencing* by *that* judge is illegitimate and void. The defect lies in the *provenance* and *performance* of the act, not (necessarily) in the underlying facts.

  **Does it Fully Escape?** It's a robust defense, but critics argue:

  1.  **Relocating Tu Quoque:** The target might reply: "You're *still* just attacking the blamer ('the judge is corrupt!') to dismiss *their* criticism of *me*, which is still an ad hominem against the source, even if you dress it up as 'standing'." Standing theorists counter that the "ad hominem" here is *specifically relevant* to the *kind of act* blame is (a second-personal address requiring specific relational conditions), unlike dismissing a factual claim.
  2.  **The Content Isn't Fully Severable:** The act/performance and the content are intertwined. The hypocrite's stance *might* implicitly weaken the force of the norm they invoke ("If even they don't take it seriously..."). Standing accounts bite the bullet here, insisting the *truth* of the content remains, even if its *enunciation* by this speaker is defective.

  **The Blame/Praise Asymmetry: Why Standing is (Mostly) for Blame**

  This is a fantastic observation. The asymmetry arises from the fundamental nature of the practices:

  1.  **The Burden/Benefit Asymmetry:**
      *   **Blame:** Imposes a *burden* (guilt, shame, demands, sanctions). Fairness demands that those imposing burdens be willing to bear them. Hypocrisy involves *avoiding the burden* while imposing it, creating unfairness and undermining authority.
      *   **Praise:** Confers a *benefit* (honor, esteem, reward). There's no inherent *unfairness* in someone who doesn't deserve praise themselves *giving* it to someone who does. The giver isn't exploiting a system of shared burdens; they are dispensing a positive good they themselves lack. The recipient still gets the benefit. The hypocrite might be insincere or envious, but they aren't *unfairly imposing* a burden or *exploiting* a reciprocal practice in the same way.
  2.  **The Authority/Equality Condition:**
      *   **Blame:** Requires the blamer to stand *as an equal* under the norm, subject to its authority, to legitimately hold another accountable *to* it. Hypocrisy violates this equality.
      *   **Praise:** Does *not* require the praiser to be an exemplar of the virtue they praise. We don't need to be brave to sincerely recognize and praise bravery in others. The praiser isn't *holding accountable* or *demanding compliance*; they are *acknowledging worth*. Their own lack of virtue doesn't inherently undermine their ability to recognize it in others or the validity of their acknowledgment *as a benefit*. Their praise might be *suspect* (are they buttering them up?), *ironic*, or *highlight their own shortcomings*, but it doesn't typically *void* the act of praise itself or make it *unfair* in the way hypocritical blame is. The recipient can still rightly feel praised.
  3.  **The Nature of Moral Community:** Blame is central to enforcing norms and maintaining reciprocity. Hypocritical blame actively *corrupts* this enforcement mechanism by introducing unfairness and exempting the enforcer. Hypocritical praise doesn't corrupt the enforcement mechanism in the same way; it might be annoying or reveal the praiser's flaws, but it doesn't typically undermine the community's ability to recognize and reward virtue.

  **In Summary for Your Seminar:**

  *   **Standing's Core:** Hypocritical blame is a defective *performance* of holding accountable, not necessarily false content. The hypocrite cannot occupy the normative position (bound, equal, burden-sharing) required to legitimately *enact* blame.
  *   **Wallace (Equality/Exemption):** The blaming act presupposes the blamer is subject to the norm. The hypocrite's violation shows they exempt themselves, making their act incoherent *as* an act of holding *another* accountable *to* that norm. Void due to performative contradiction.
  *   **Fritz & Miller (Fairness/Burdens):** Blame imposes burdens. Hypocrisy involves imposing burdens you avoid, exploiting the reciprocal practice unfairly. Void due to unfairness.
  *   **Escaping Tu Quoque?** The defect targets the *legitimacy of the blaming act itself* ("You cannot *successfully blame* me in this way"), not the *truth* of the claim about the target's wrongdoing ("I did nothing wrong"). It's an invalidation of the performance, not a rebuttal of the proposition.
  *   **Blame/Praise Asymmetry:** Rooted in blame imposing burdens requiring reciprocal fairness and authority derived from shared subjection, while praise confers benefits without imposing reciprocal burdens or requiring exemplar status for legitimacy.

  **Teaching Tip:** Use the "Corrupt Judge" analogy heavily. Emphasize the *second-personal*, performative nature of blame. Ask students: "What does the act of blaming *do* beyond stating facts? What conditions must be met for that *doing* to be legitimate?" Contrast this with stating a factual moral judgment ("What X did was wrong") – the standing defect applies to the *act of blaming X*, not necessarily to the detached *judgment* that X's act was wrong. This distinction is crucial. For the asymmetry, press them: "What burden does hypocritical praise impose on the praised person that's analogous to the burden hypocritical blame imposes?" They'll likely struggle to find one, revealing the core difference. Good luck with the seminar – it's a thorny but fascinating topic!
