answer: |-
  Here are eight interview questions designed to probe your guest's defense of resolute choice against the money-pump argument. Each includes a follow-up keyed to likely responses, as requested. The questions avoid mere restatements, target the three specified areas (transitivity relocation, resolute vs. sophisticated choice, and real-world binding), and conclude with a falsifiability question.

  ### 1. **Transitivity Relocation**  
  **Question:** You argue that moving rationality from preferences to plans lets agents avoid money pumps without transitive preferences. But critics like McClennen (1990) say this just reimposes transitivity at the plan level—e.g., a consistent plan must obey "meta-transitivity" (if Plan A outranks B and B outranks C, then A outranks C). Is this a substantive innovation, or is it transitivity in disguise?  
  **Follow-up (keyed to defense):** If you counter that plans resolve conflicts without demanding step-by-step transitivity, doesn’t your approach still require plans to be *globally consistent*? How is that different from imposing transitivity on the preference structure itself?  

  ### 2. **Resolute vs. Sophisticated Choice**  
  **Question:** How does a resolute agent differ functionally from a "sophisticated" agent who avoids pumps via backward induction? Both reject trades, but the sophisticated agent does so reactively (e.g., in a cycle A>B>C>A, they refuse the first trade to avoid exploitation), while your resolute agent pre-commits.  
  **Follow-up (keyed to differentiation):** In cases like the Allais paradox, a sophisticated agent might still accept dominated choices due to myopic re-evaluation, while a resolute agent sticks to their plan. But if both yield identical outcomes in standard pumps, isn’t resoluteness just a *descriptive reframing* of sophistication, not a distinct solution?  

  ### 3. **Real-World Binding Constraints**  
  **Question:** Resolute choice assumes agents can perfectly bind future selves. But humans (and even AIs) suffer commitment problems—e.g., hyperbolic discounting or hardware constraints. How does your model handle agents who *can’t* enforce pre-commitments?  
  **Follow-up (keyed to practicality):** You might say partial commitment (e.g., via contracts) suffices, but if reneging is possible mid-pump—say, a trader faces liquidity shocks—doesn’t this collapse resolute choice into myopic choice, reviving the money-pump threat? Doesn’t that imply your defense only works for idealized agents?  

  ### 4. **The Allais Paradox Specificity**  
  **Question:** Resolute choice avoids Allais-style pumps by pre-committing to a lottery path. But when preferences violate independence, the plan must override local incentives (e.g., rejecting a "sure gain" for long-term benefit). How do you justify this as rational, rather than ad hoc?  
  **Follow-up (keyed to rationality):** If the agent’s plan ignores their vivid local preference (e.g., the "certainty effect"), aren’t you prioritizing coherence over genuine desire? Doesn’t that undermine the normative link between preference and choice?  

  ### 5. **Costs of Commitment**  
  **Question:** Resolute plans prevent exploitation but incur opportunity costs—e.g., refusing beneficial trades to avoid pumps, or forgoing new information. How do you weigh these costs against pump vulnerability?  
  **Follow-up (keyed to trade-offs):** If your answer involves "planning optimally," doesn’t this require agents to have meta-preferences over plans? How is this computationally feasible for bounded agents?  

  ### 6. **Temporal Neutrality**  
  **Question:** Resolute choice treats time symmetrically (the plan governs all stages). But evidence shows preferences shift dynamically—e.g., regret post-choice. Doesn’t enforcing a rigid plan ignore the rationality of *updating* based on new emotional or epistemic states?  
  **Follow-up (keyed to flexibility):** If you concede that plans should accommodate learning, how do you prevent this from reintroducing myopic choice in dynamic environments?  

  ### 7. **Alternative Defenses**  
  **Question:** Competing solutions (e.g., costly pre-commitment or "thick" indifference) also "avoid" pumps without transitive preferences. Why is resolute choice superior to these?  
  **Follow-up (keyed to uniqueness):** If resolute choice is just one tool among many, does that imply money-pump vulnerability is *not* a fatal flaw in preferences, but a fixable implementation gap?  

  ### 8. **Falsifiability and Preferences**  
  **Question:** What finding would convince you that money-pump vulnerability *does* indict preferences? For example, if agents with intransitive preferences consistently fail at commitment (even with incentives) in experiments, or if they suffer net losses in real markets despite resolute planning?  
  **Follow-up (keyed to conviction):** If you’d still attribute failure to "imperfect commitment," does this make your defense unfalsifiable?  

  ---  
  **Rationale:**  
  - Questions 1, 3, and 8 directly address your requirements (transitivity relocation, binding, and falsifiability).  
  - Question 2 contrasts resolute and sophisticated choice, probing functional equivalence.  
  - Follow-ups anticipate defenses: e.g., for Q1, a likely reply is that plans "contextualize" preferences, so the follow-up challenges whether this is meaningfully distinct.  
  - The sequence builds from theory (Q1–Q2) to empirics (Q3–Q4) to meta-framework (Q7–Q8).  
  - Total: 8 core questions, each with a follow-up (16 prompts), fitting your 8–10 target.
