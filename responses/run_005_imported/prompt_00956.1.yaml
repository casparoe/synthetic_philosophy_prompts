answer: |-
  You're partially misremembering Elizabeth Anscombe's core argument. While she **did** challenge the factual basis of the "saved lives" justification, her primary and most famous argument was **fundamentally deontological (rule-based)**, not utilitarian. She condemned the bombings as intrinsically immoral acts of murder, regardless of any potential utilitarian calculation. Here's a breakdown:

  1.  **The Core Deontological Argument (What She Primarily Argued):**
      *   **Targeting Non-Combatants is Murder:** Anscombe, drawing on Catholic moral theology and Just War Theory (specifically the principle of non-combatant immunity and the doctrine of double effect), argued that **deliberately targeting civilian populations to achieve a military or political objective is always murder.**
      *   **Intention Matters:** The key factor was the *intention* behind the act. The explicit goal of the Hiroshima and Nagasaki bombings was to kill vast numbers of civilians to terrorize the Japanese leadership into surrender. This made the killing of innocents not a tragic side-effect (which *might* be excusable under double effect under strict conditions), but the *direct means* to the end.
      *   **Truman's Guilt:** Therefore, Truman, by authorizing these bombings, had ordered and was responsible for mass murder. Awarding him an honorary degree, in Anscombe's view, was morally obscene because it honored a man guilty of such grave evil.
      *   **Rejection of Utilitarianism:** She explicitly rejected the notion that the ends could ever justify such intrinsically evil means. Even *if* the bombings saved lives overall (which she disputed), they were still morally impermissible acts of murder. Utilitarianism, in this context, was a dangerous philosophy that could justify atrocities.

  2.  **Her Challenge to the Utilitarian Justification (The Part You Remembered, but Contextualized):**
      *   **Secondary Argument:** Anscombe *did* argue that the utilitarian defense didn't hold water *even on its own terms*. She disputed the factual claims underlying the "invasion would have cost more lives" narrative.
      *   **Her Points:**
          *   **Japan was Already Defeated:** She argued Japan was on the verge of collapse due to the naval blockade, conventional bombing, and the imminent Soviet entry into the war (which happened days after Nagasaki). Surrender was likely imminent without an invasion or the atomic bombs.
          *   **Alternatives Existed:** She contended that alternatives to invasion or atomic bombing hadn't been exhausted or seriously pursued, such as:
              *   Modifying unconditional surrender terms (e.g., guaranteeing the Emperor's position).
              *   Waiting for the Soviet declaration of war to shatter Japanese hopes.
              *   A non-lethal demonstration of the atomic bomb's power.
          *   **Overstated Invasion Casualties:** She challenged the high casualty estimates for a hypothetical invasion, suggesting they were inflated retrospectively to justify the bombings. She argued that even if an invasion occurred, the casualties (especially civilian casualties) might not have exceeded the immediate and long-term deaths from the two atomic bombs (approx. 200,000 by 1950).
          *   **The Bombs Killed More Innocents:** This is the point you recalled. Her argument was that given the alternatives (continued blockade/conventional bombing + Soviet entry + potential negotiated surrender *or* even a bloody invasion primarily killing combatants), the *deliberate* atomic bombing of two civilian centers *did* kill far more innocent non-combatants than those alternatives likely would have. She saw the bombings as gratuitous violence against civilians when victory was achievable by other means.

  **Why Your Friend Thinks You're Butchering It:**

  *   **You Framed it Primarily as Utilitarian:** By saying "her real argument was basically that if you actually run the numbers... Truman's own math didn't even check out on utilitarian grounds," you made the utilitarian challenge sound like her main point. It wasn't. Her main point was the *absolute moral prohibition* on targeting civilians.
  *   **You Implied She Accepted Utilitarian Framework:** Your phrasing suggests she was *using* utilitarianism to critique Truman. In reality, she was *rejecting* utilitarianism as a valid moral framework for justifying such acts, while *also* showing that even *within* that flawed framework, the justification failed factually. Her challenge to the numbers was a secondary argument designed to dismantle the opposition's position on their own (mistaken, in her view) terms.

  **In Conclusion:**

  You correctly remember that Anscombe **vigorously challenged the factual basis** of the "saved lives" utilitarian justification, arguing that the bombings killed more innocent civilians than the likely alternatives would have. **However, her central and most famous argument was deontological:** the deliberate targeting of civilians is always murder and is intrinsically evil, making Truman morally guilty regardless of any potential beneficial consequences. Her protest was primarily a condemnation of honoring a man she believed had committed mass murder.

  So, next time, emphasize: "Anscombe's main argument was that targeting civilians is *always* murder, full stop. But she *also* argued that Truman's defenders were wrong on the facts – the bombings weren't necessary and likely killed *more* innocents than the alternatives." This captures both the core moral principle and her secondary factual critique.
