  So I got into it with my friend last night about the atomic bombings of Hiroshima and Nagasaki. He was doing the classic "it saved more lives than an invasion would've" line, and I brought up Anscombes protest against Truman getting his honorary degree from Oxford, saying her real argument was basically that if you actually run the numbers, the bombs killed way more innocent civilians than the alternatives would've - so Truman's own math didn't even check out on utilitarian grounds. He insists I'm butchering her argument but couldn't say how. Am I misremembering something here, and if so, what was she actually arguing?
