prompt: |-
  I'm reading Thomas Reid's Inquiry into the Human Mind (1764) for a seminar on testimony and I'm stuck on how this bit is actually supposed to work as an argument against Hume. It's oddly buried in the middle of his chapter on vision (section 24, "Of the analogy between perception and the credit we give to human testimony"):

  "But here a difficulty occurs which merits our attention, because the solution of it leads to some original principles of the human mind, which are of great importance, and of very extensive influence. We know by experience, that men have used such words to express such things. But all experience is of the past, and can, of itself, give no notion or belief of what is future. How come we then to believe, and to rely upon it with assurance, that men who have it in their power to do otherwise, will continue to use the same words when they think the same things? Whence comes this knowledge and belief, this foresight we ought rather to call it, of the future and voluntary actions of our fellow-creatures? Have they promised that they will never impose upon us by equivocation or falsehood? No, they have not. And, if they had, this would not solve the difficulty: for such promise must be expressed by words, or by other signs; and, before we can rely upon it, we must be assured, that they put the usual meaning upon the signs which express that promise. No man of common sense ever thought of taking a man's own word for his honesty; and it is evident that we take his veracity for granted, when we lay any stress upon his word or promise. I might add, that this reliance upon the declarations and testimony of men, is found in children long before they know what a promise is.

  There is, therefore, in the human mind an early anticipation, neither derived from experience, nor from reason, nor from any compact or promise, that our fellow-creatures will use the same signs in language, when they have the same sentiments. This is, in reality, a kind of prescience of human actions; and it seems to me to be an original principle of the human constitution, without which we should be incapable of language, and consequently incapable of instruction.

  The wise and beneficent Author of nature, who intended that we should be social creatures, and that we should receive the greatest and most important part of our knowledge by the information of others, hath, for these purposes implanted in our natures two principles that tally with each other. The first of these principles is, a propensity to speak truth, and to use the signs of language, so as to convey our real sentiments. This principle has a powerful operation, even in the greatest liars; for, where they lie once, they speak truth a hundred times. Truth is always uppermost, and is the natural issue of the mind. It requires no art or training, no inducement or temptation, but only that we yield to a natural impulse. Lying, on the contrary, is doing violence to our nature; and is never practised, even by the worst men, without some temptation. Speaking truth is like using our natural food, which we would do from appetite, although it answered no end; but lying is like taking physic, which is nauseous to the taste, and which no man takes but for some end which he cannot otherwise attain.

  [...] Another original principle implanted in us by the Supreme Being, is a disposition to confide in the veracity of others, and to believe what they tell us. This is the counter part to the former; and as that may be called the principle of veracity, we shall, for want of a more proper name, call this the principle of credulity. It is unlimited in children, until they meet with instances of deceit and falsehood: and it retains a very considerable degree of strength through life."

  So the move seems to be: our confidence that people will keep using words the way they used to can't come from experience (experience is only ever of the past), or from reason, or from a promise -- so it must be some further "original principle" of the mind. Then he basically runs the same move again to get the principles of veracity and credulity. What I don't get is how any of this is actually different from what Hume says about induction generally -- Hume already thinks our expectation that the future will resemble the past isn't grounded in reason, and is just custom/habit. So when Reid says our reliance on testimony rests on an "original principle" rather than on experience, is he doing anything more than re-describing Hume's own psychology in nicer language? Or does this move actually get the anti-reductionist something a Humean reductionist about testimony can't also just help themselves to? Feels like i'm missing the actual bite of the argument here.
