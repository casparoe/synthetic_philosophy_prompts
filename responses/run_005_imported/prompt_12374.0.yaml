  Okay, the user is grappling with Reid's argument against Hume in the Inquiry, specifically about testimony. They're stuck on how Reid's appeal to "original principles" differs from Hume's custom. Let me unpack this step by step.

  First, the user's core confusion: Reid says testimony reliance can't come from experience/reason/promise, so it must be innate principles. But Hume already explained induction via habit, not reason. So is Reid just rebranding Hume's psychology? The user feels they're missing the argument's bite.

  Hmm, the key is recognizing Reid's deeper target. Hume treats testimony trust as a species of induction - we infer reliability from past uniformities. Reid attacks that very foundation. For Reid, testimony isn't an inference but a direct perception-like faculty. The "original principle" framing is strategic: by making credulity as basic as sensory perception, Reid blocks reduction to inductive habits. 

  The user might not see how radical this is. Reid isn't just describing psychology differently; he's claiming testimony has sui generis epistemic status. For Hume, trusting testimony is like expecting bread to nourish because it always did - a habit from constant conjunction. For Reid, it's like seeing color: immediate and non-inferential. That's why Reid places it alongside perception in the vision chapter - he's showing all foundational trusts (senses, memory, testimony) rest on equally basic principles.

  Also crucial: Reid's principles are pre-rational defaults. Children trust before they understand promises or deceit. This developmental point undermines Hume's model where habits form gradually from repetition. How could children form inductive habits about testimony before they even grasp language? Reid's nativist move avoids that paradox.

  The user's seminar focuses on testimony, so they might care about contemporary implications. Reid's anti-reductionism directly opposes Humean views that testimony is justified only when independently verified. By making credulity basic, Reid says we're prima facie justified in trusting others unless countered - a position still debated in social epistemology today. That's the real bite: it forces either accepting innate social trust or finding a way to reduce it without circularity. 

  I should emphasize Reid's teleology too. He roots principles in divine design for sociability, contrasting with Hume's naturalistic habit. But the user seems more interested in the epistemic mechanism than theology, so I'll keep that secondary. 

  The user is clearly sharp - they spot the surface similarity to Hume's custom. Their challenge is seeing how Reid's framework shifts the justificatory structure. My reply needs to highlight that credulity isn't a summary of past observations but a starting point enabling language acquisition itself. That's why Reid says without it we'd be "incapable of instruction" - it's constitutive, not derived.
answer: |-
  You've nailed the core tension: Reid's argument *looks* like it's just restating Hume's psychology of habit/custom in more positive terms ("original principles"). But Reid intends a **fundamentally different epistemic move** with significant anti-Humean bite. Here's why it's more than just rebranding:

  1.  **Targeting the *Source* of Uniformity:** Hume explains our expectation that the future resembles the past (including linguistic behavior) as arising from *custom formed by repeated experience*. Reid argues that for testimony, this explanation **fails at its origin**.
      *   **Hume's Circle:** To learn language *in the first place*, an infant must associate sounds (words) with meanings (things/sentiments). But this association *requires* trusting that the speaker is using the sound consistently *now* to mean the same thing it meant *before*. Where does this initial trust come from? It can't be from prior experience of that speaker's consistency, because the infant has *no* such experience yet. Hume's custom requires repetition *before* it forms; Reid points out that the *very first* associations necessary for language acquisition require trust *prior to* any experience-based custom.
      *   **Reid's Solution:** The "principle of credulity" is **antecedent** to experience. It's a pre-rational, innate disposition to *initially* trust that others' words convey their real sentiments. This innate trust *enables* the child to start forming the associations that *later* might be reinforced by custom/experience. It breaks the circle Hume's explanation falls into for the *genesis* of linguistic trust.

  2.  **The Nature of the Principle: Perception vs. Inference:** Reid isn't just saying "trust is basic." He's arguing that trusting testimony is **more like perception than like inductive inference**.
      *   **Hume (Reductionism):** Justified belief via testimony *reduces* to justified belief via induction. We observe a constant conjunction between people's utterances and the facts, and we infer (via custom) that future utterances will also correspond to facts. Our confidence is proportional to our observed reliability.
      *   **Reid (Anti-Reductionism):** Trusting testimony is a **direct, immediate operation** of the mind, triggered by receiving testimony, just as perception is triggered by sensory input. The "principle of credulity" is a *sui generis* principle, parallel to the principles governing perception or memory. We don't *infer* the truth of a report; we instinctively *accept* it as true, just as we instinctively perceive an object when we look at it. Experience can *modify* this initial acceptance (e.g., when we learn someone is a liar), but the default starting point is *trust*, not skeptical evaluation requiring inductive justification. This makes testimony a **fundamental source of justification**, not a derivative one.

  3.  **The Role of "Original Principles" vs. "Custom":** For Reid, "original principles" are **constitutive** of our rational nature and our ability to function in the world. They are the necessary foundations upon which reasoning and experience *build*.
      *   **Hume's Custom:** Custom is a *passive*, mechanical result of repetition. It explains *how* we come to expect uniformity, but it doesn't provide any *justification* for that expectation; it's merely a brute psychological fact.
      *   **Reid's Principles:** The principles of veracity and credulity are **active dispositions implanted by a benevolent God** to make us social, teachable creatures. They are not *just* descriptive psychology; they are **normative foundations** for our epistemic practices. Our reliance on them is *prima facie* justified *because* they are part of our God-given design for acquiring truth socially. This teleological element is crucial (though controversial) and provides a kind of externalist justification Hume explicitly rejects.

  4.  **The Scope of the Argument Against Reductionism:**
      *   Reid's point isn't merely that we *do* trust testimony innately. His argument is that **testimonial knowledge *requires* this innate principle to get off the ground.** Any attempt to *reduce* testimonial justification to non-testimonial sources (like induction from past correlations) presupposes the very linguistic competence and trust that the reductionist is trying to explain. We must already trust speakers to mean the same thing by their words over time *before* we can even begin to collect data about their reliability for inductive inference. Therefore, testimonial justification cannot be *fully reduced*; it relies on an irreducible principle of credulity.

  **The Bite Against Hume:**

  *   **Against Testimonial Reductionism:** Reid directly attacks the core of Hume's reductionist project regarding testimony. Hume argues testimony is justified only by induction from experience. Reid argues this is *impossible* for the *initial acquisition* of language and knowledge via testimony, creating a vicious circle. An innate principle is *required*.
  *   **Against Skepticism about Foundational Trusts:** Hume famously showed that our reliance on induction, the senses, and memory cannot be given a non-circular rational justification. His solution was to accept custom as a brute psychological fact. Reid accepts the failure of rationalist justification but counters that these trusts (including testimony) are *positively justified* by being constitutive features of our well-designed minds, implanted by God for truth-acquisition. This provides a *positive* (though externalist) account of why we *should* trust them, moving beyond mere psychological description.
  *   **A Different Kind of "Basic":** While Hume makes custom psychologically basic, Reid makes the *trust itself* epistemically basic and foundational. It's not the *result* of psychological mechanics (custom); it's the *starting point* of our cognitive engagement with others.

  **In essence:** Reid isn't just re-describing Hume's custom as an "original principle." He's arguing that Hume's *explanation* for testimonial trust (inductive inference based on past experience) **fails to account for the origin of the very trust needed to *have* that experience.** He replaces Hume's passive, experience-dependent custom with an active, innate, divinely implanted principle that *enables* experience and language in the first place, making testimonial trust a fundamental, perception-like source of justification. This is a direct challenge to Hume's reductionism and provides a positive, non-skeptical foundation for our reliance on others. The bite lies in exposing the circularity Hume's reductionism faces at the origin of language and knowledge acquisition.
