  Okay, let me unpack this user's query. They're writing a science magazine feature on scientific progress and stumbled upon Popper's verisimilitude and its apparent collapse in 1974. Their draft conclusion is explosive: the common "closer to truth" metaphor is mathematically incoherent, and scientists unknowingly parrot a dead philosophy. But is this accurate?

  First, I need to recall Miller-Tichý precisely. Their theorem didn't attack "closer to truth" generally—it exposed flaws in Popper's specific formal definition. Popper tried to quantify truthlikeness by comparing true/false consequences, but Miller-Tichý showed his formula could make false theories "outperform" true ones in absurd ways. The fatal blow was that under Popper's definition, no false theory could surpass another—but crucially, this was about his flawed formalization, not the broader intuition.

  The user seems to conflate Popper's failed definition with the entire concept. That's dangerous. Philosophers didn't abandon verisimilitude after 1974; they refined it. Niiniluoto's "similarity" approach and Schurz's "relevant consequence" framework emerged precisely to salvage the intuition. Even Tichý himself later proposed a more robust version. 

  I should also flag the disconnect between philosophical formalisms and scientific practice. When scientists say "plate tectonics is closer to truth than continental drift," they're gesturing at explanatory scope and predictive precision—not Popper's logic. Miller himself emphasized this. The metaphor persists because it's pragmatically useful, not because scientists are Popperians.

  The user's draft conclusion overshoots by declaring the concept incoherent. A more precise framing: Popper's particular formula failed, but refined versions exist, and scientists' usage likely reflects pre-theoretical intuitions. I'll need to clarify what the theorem actually destroyed (one technical definition) versus what survived (the broader idea, plus better formalisms).
answer: |-
  Your reading captures the *impact* of Miller and Tichý's work accurately, but your proposed conclusion overgeneralizes their result and misses how the philosophy of science community responded. Here's a precise breakdown:

  **1. What Miller & Tichý Proved (1974):**
      *   **Target:** They attacked Popper's *specific, formal logical definition* of verisimilitude.
      *   **Popper's Definition (Simplified):** A theory A has more verisimilitude than theory B if:
          *   A's *true consequences* include all of B's true consequences (A has at least as much truth).
          *   A's *false consequences* are included in B's false consequences (A has less falsity).
      *   **The Fatal Flaw:** Miller and Tichý independently proved that under this definition, **it's impossible for one false theory to have more verisimilitude than another false theory.** They showed that if A has *more* truth than B (according to the definition), then it must *also* have *more* falsity, violating the second condition. Conversely, if it has *less* falsity, it must have *less* truth, violating the first condition.
      *   **The Sting:** Worse than just making comparisons impossible, they showed Popper's definition could lead to absurdities. Under certain conditions, a *true* theory could be deemed to have *less* verisimilitude than a *false* one. This completely undermined Popper's definition for its intended purpose.

  **2. What the Theorem Does *Not* Show:**
      *   It does **NOT** prove that the *intuitive concept* of "closer to the truth" is incoherent or meaningless.
      *   It does **NOT** prove that scientific progress is impossible or that one theory cannot objectively be better than another.
      *   It does **NOT** prove that all uses of "closer to the truth" by scientists are illegitimate or resting *solely* on Popper's discredited definition.
      *   It **specifically** shows that **Popper's particular logical formulation of verisimilitude is fatally flawed and cannot serve its purpose.**

  **3. The Aftermath in Philosophy of Science (Post-1974):**
  Philosophers didn't abandon verisimilitude; they recognized Popper's definition was broken and sought better ways to formalize the core intuition. Key developments include:

      *   **The "Similarity" Approach (Niiniluoto, Oddie):** Instead of focusing solely on logical consequences, this approach defines the "distance" between a theory and the complete truth (conceived as a point in a logical space or a state description). Theories are closer to the truth if they are *more similar* to the true state of affairs. This often involves defining sophisticated similarity metrics.
      *   **The "Consequence" Approach Refined (Schurz, Weingartner):** Building on Popper's core idea but avoiding the fatal flaw. They refined the definition by focusing on *relevant* or *non-redundant* consequences, often weighted by importance or using more complex logical structures, to prevent the problematic comparisons Miller/Tichý identified.
      *   **Approximate Truth (Boyd, Weston):** A closely related concept focusing on whether theories get core structures or mechanisms *approximately right*, even if details are wrong. This often aligns well with scientific intuitions (e.g., Newtonian mechanics approximates GR under certain conditions).
      *   **Epistemic Utility/Pragmatic Approaches (Levi, Kitcher):** Framing progress in terms of increasing problem-solving ability, predictive accuracy across a wider range of phenomena, or unifying power. "Closer to truth" might be interpreted as increasing instrumental reliability or explanatory coherence.
      *   **Structural Realism (Worrall, Ladyman):** Argues that while specific ontological claims of past theories were often wrong, the *mathematical/structural content* is often preserved or refined (e.g., the equations of Fresnel's optics embedded in Maxwell's). Progress is seen as accumulating structural knowledge about the world.
      *   **Tichý's Later Work:** Ironically, Tichý himself later developed his own sophisticated account of truthlikeness based on possible worlds and similarity.

  **4. The Status of "Closer to the Truth" Today:**

  *   **Formal Concept:** Verisimilitude remains an active, though complex and debated, area of research in formal philosophy of science. There are multiple competing formal definitions (similarity, refined consequence), none universally accepted as perfect, but widely seen as significant improvements over Popper's original. They *do* allow one false theory to be closer to the truth than another.
  *   **Scientific Practice:** Scientists' use of "closer to the truth" or "more accurate" is **not** primarily reliant on, or undermined by, Popper's specific failed definition. Their judgments are based on:
      *   **Vastly increased empirical accuracy and scope:** New theories explain everything the old one did *plus* more, often with greater precision (e.g., GR explains Mercury's perihelion precession where Newton fails).
      *   **Explanatory unification:** New theories explain seemingly disparate phenomena under a single framework (e.g., plate tectonics unifying volcanoes, earthquakes, mountain building).
      *   **Conceptual coherence and fruitfulness:** New theories resolve internal inconsistencies in old ones and open new avenues for research.
      *   **Robustness:** Predictions confirmed by multiple, independent methods.
      *   **Approximation:** Demonstrating that the old theory is a limiting case or approximation of the new one under specific conditions (e.g., Newtonian mechanics as low-speed/low-gravity limit of GR/SR).
  *   **Philosophers' View:** Most philosophers of science accept that scientific progress *involves* getting closer to the truth in *some* substantive sense. The debate is about *how best to characterize that sense* (structurally, approximately, pragmatically, via verisimilitude defined carefully). Miller and Tichý killed Popper's *definition*, not the *intuition*. David Miller himself, while a staunch critic of many verisimilitude approaches, acknowledges scientific progress as increasing informative truth-content.

  **5. Your Proposed Framing: A Correction**

  *   **Overstatement:** Saying the *whole idea* of "getting closer to the truth" was shown to be "mathematically incoherent" is incorrect. Miller/Tichý showed *one specific formal definition* was incoherent *for its purpose*. The intuitive idea persists strongly.
  *   **Conflation:** You risk conflating Popper's specific (failed) definition with the broader scientific intuition and the subsequent philosophical work.
  *   **Specialists' View:** Specialists did *not* write off the *idea* as a dead end. They wrote off *Popper's definition* and actively pursued better ways to formalize the core intuition.

  **A More Precise Framing for Your Article:**

  > "While the intuitive idea that science gets 'closer to the truth' remains powerful among scientists, its philosophical grounding proved surprisingly tricky. Karl Popper's bold attempt to formalize this as 'verisimilitude' hit a major roadblock in 1974. David Miller and Pavel Tichý proved a devastating theorem: under Popper's own definition, it was logically impossible for one false theory to be closer to the truth than another. This didn't mean science wasn't progressing, but it showed Popper's specific formula couldn't capture that progress. Philosophers of science spent the subsequent decades developing more sophisticated accounts of truthlikeness and scientific progress—focusing on structural similarity, refined logical consequences, explanatory power, and the preservation of successful mathematical cores—to better articulate the sense in which theories like general relativity represent a profound advance over Newtonian mechanics, even if neither is the final word."

  This framing accurately credits Miller/Tichý with demolishing Popper's specific definition, acknowledges the challenge they posed, but avoids declaring the core intuition incoherent and highlights the ongoing philosophical effort to understand progress, which aligns more closely with scientific practice than Popper's original definition ever did.
