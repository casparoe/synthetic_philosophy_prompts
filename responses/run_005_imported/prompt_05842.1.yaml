  What's interesting is how viscerally this bothers them compared to similar reliance on expertise (like medical test results). They're clearly wrestling with whether their discomfort is philosophically valid or just intellectual snobbery. The cholesterol comparison someone made at the dinner party seems to haunt them.

  Hmm... the core tension seems to be between two types of knowledge claims: 
  First-order factual claims ("my cholesterol is 180") vs aesthetic evaluations ("this is a masterpiece"). The former can be cleanly transferred via testimony because it's about measurable reality. But the latter requires personal engagement with the aesthetic object to mean anything substantive. 

  The user's friend isn't just saying "critics consider this a masterpiece" (which would be fine) - he's appropriating that judgment as his own. That's where the epistemological rubber meets the road. It's like someone saying "I love Beethoven's Fifth" having only read concert reviews but never heard a note. 

  What the user might not have articulated yet is that this isn't really about knowledge - it's about authenticity. Their discomfort comes from witnessing aesthetic posturing masquerading as conviction. The friend hasn't earned the right to make that claim because he hasn't done the work of experiencing the art. 

