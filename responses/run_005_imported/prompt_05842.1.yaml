  The challenge will be validating their intuition without being dismissive. Their fear of it being "snobbery" is real - we should acknowledge that risk while showing why this case is structurally different from medical testimony. The key is distinguishing between knowing-that (facts) and knowing-what (experiential understanding).
answer: |-
  Your discomfort isn't snobbery—it's a sharp epistemological intuition about a genuine distinction. The cholesterol case and the novel case differ fundamentally in **the nature of the judgment being deferred** and **what constitutes "knowing" in each domain**. Here's a breakdown:

  ### 1. **The Cholesterol Case: Delegating *Verification* of a Fact**  
     - **What you're claiming:** "My cholesterol is fine."  
     - **What you're relying on:** A medical expert's interpretation of objective data (bloodwork).  
     - **Why it's epistemically sound:**  
       - Cholesterol levels are measurable, context-independent facts.  
       - The doctor’s testimony transfers *propositional knowledge* ("cholesterol = X mg/dL").  
       - You *understand the claim*: "fine" means "within medically accepted thresholds."  
     - **What you lack (harmlessly):** Technical skill to operate a spectrometer. Not required for knowing the fact.  

  ### 2. **The Novel Case: Delegating *Evaluation* Itself**  
     - **What he's claiming:** "This novel is a masterpiece."  
     - **What he's relying on:** Others' aesthetic judgments.  
     - **Why it's epistemically hollow:**  
       - Aesthetic mastery isn’t a fact; it’s an *experiential evaluation* requiring engagement with the work.  
       - Critics’ testimony can tell you *"X calls this a masterpiece,"* but **not** *that it is one*—unless you’ve had the experience justifying the concept.  
       - He lacks *first-person grounds* for the judgment. "Masterpiece" implies a synthesis of form, theme, emotional resonance—none of which he accessed.  

  ### The Crucial Difference: **Propositional vs. Phenomenal Knowledge**  
  - **Cholesterol:** You know *that* your levels are fine. The doctor’s testimony suffices because the knowledge is purely informational.  
  - **Aesthetic Judgment:** To *know* a novel is a masterpiece, you must know *what it is like* to experience its merits. This requires:  
    - **Direct engagement** (reading the text).  
    - **Minimal competency** in interpreting literary devices, themes, etc.  
    - **Personal synthesis** of the work’s elements into a holistic evaluation.  

  ### What Your Friend Lacks (and Why It Matters):  
  1. **Defeasible Justification:**  
     - Testimony can *suggest* a novel might be great, but aesthetic judgments are defeasible by personal experience. If he’d read it and hated it, he’d reject the critics. His "belief" only persists *because* he hasn’t tested it.  

  2. **Conceptual Competence:**  
     - To assert "masterpiece" meaningfully, you need to grasp *what makes it one*. Without engaging the work, he’s parroting a label detached from its experiential content—like calling a symphony "transcendent" while deaf.  

  3. **Epistemic Authority:**  
     - In science/medicine, authority derives from expertise in measurable phenomena. In art, authority is *interpretive* and *provisional*. Even trusted critics can’t *transfer* aesthetic knowledge; they can only guide you to acquire it yourself.  

  ### What He *Could* Legitimately Claim:  
  - "Critics I respect call this a masterpiece."  
  - "This novel is widely considered a landmark work."  
  - "Based on its reputation, I believe it’s likely great."  
  These are *reports of social facts*—not aesthetic judgments.  

  ### Why This Isn’t *Just* Snobbery:  
  Your unease stems from witnessing a **category error**. He’s treating an aesthetic judgment (subjective, experience-dependent) like a factual report (objective, testimony-transferable). This erodes:  
  - **Intellectual integrity:** Asserting a judgment without grounds.  
  - **Cultural discourse:** Reducing art to status-signaling tokens.  
  - **Epistemic humility:** Mistaking social consensus for personal understanding.  

  ### Conclusion:  
  **Yes, there’s a principled difference.** Your friend doesn’t *know* the novel is good; he knows *others claim* it is. His error is conflating *testimonial knowledge about opinions* with *first-hand aesthetic knowledge*. The cholesterol case involves valid testimony for a factual claim; the novel case involves borrowing an evaluative judgment he hasn’t earned. What he’s missing—and what we should want—is **authenticity in judgment**: the ability to say not just *what* he believes, but *why* he believes it, grounded in his own encounter with the work. That’s where knowledge ends and wisdom begins.
