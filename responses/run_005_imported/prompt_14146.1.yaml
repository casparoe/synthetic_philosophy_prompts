  First, I need to recall the argument from illusion. It uses cases like the bent stick in water to show that since illusions can be indistinguishable from veridical perceptions, they must share the same mental state. The Common Kind Assumption says both experiences are fundamentally the same. Disjunctivists reject this, claiming veridical perceptions are direct relations to objects, while illusions are different.

  The user's concern is that if disjunctivists deny a common kind, how can they explain that both experiences feel the same? That seems contradictory. The user might be missing the disjunctivist's nuanced take on indistinguishability. They might think indistinguishability requires a shared nature, but disjunctivists argue it's about cognitive access, not ontology.

  The user is likely teaching philosophy of mind or epistemology. Their deeper need is to present disjunctivism accurately without oversimplifying. They want to address student objections effectively. The unspoken issue could be justifying disjunctivism's counterintuitive aspects while maintaining its plausibility.

  I should explain that disjunctivists separate phenomenology from metaphysical kind. Indistinguishability is epistemic—about judgment limitations—not about identical experiences. For example, in the stick case, the subject can't tell which state they're in, but that doesn't mean the states are the same. This preserves the feel without a common kind.

  Also, the user might worry this is an ad hoc move. Emphasizing that disjunctivists offer positive accounts for illusions (like false beliefs) could help. Highlighting that rejecting CKA avoids skepticism is another point. The cost is accepting that subjective experience doesn't dictate metaphysics, which some find unsatisfying but necessary for direct realism.

  Need to ensure the explanation clarifies the epistemic vs. ontological distinction. Use examples like the perfect fake diamond: inability to distinguish doesn't make both real diamonds. Relate this back to disjunctivism. Conclude that the cost is real but balanced by theoretical benefits like preserving perceptual directness.
answer: |-
  You've hit on a central and genuinely challenging point in the disjunctivist response to the argument from illusion. Your nagging feeling is well-founded; this is often considered the *crucial* point where disjunctivists either make their most distinctive move or face their most significant cost. Let's break down the disjunctivist strategy and the tension you're identifying:

  1.  **The Core Disjunctivist Move:** As you state, disjunctivists (like McDowell, Snowdon, Martin) fundamentally reject the Common Kind Assumption (CKA). They insist:
      *   **Veridical Perception (Good Case):** Is a *sui generis*, relational state. Its fundamental nature is a direct, non-representational (or constitutively representational via the relation) acquaintance with the actual state of affairs in the world. This state is *factive* (it entails the truth of what is perceived).
      *   **Illusion/Hallucination (Bad Case):** Is *not* the same fundamental kind of state. It lacks the constitutive relation to the object/property perceived in the good case. Its nature is fundamentally different – it might be a representational state, a state of seeming, or caused by entirely different mechanisms. Crucially, it *lacks* the factive relational element.

  2.  **The Challenge (Your Point):** The argument from illusion *starts* from the undeniable phenomenological datum: from the first-person perspective, an illusory experience (e.g., the stick looking bent) can be *subjectively indistinguishable* from a veridical experience (e.g., seeing a genuinely bent stick out of water). This indistinguishability seems to *demand* an explanation in terms of something common to both states – some shared experiential core or common factor (which the argument then uses to undermine the directness/reliability of the good case).

      **Your Question:** How can disjunctivists *simultaneously*:
      *   **Deny CKA:** Insist the two states have fundamentally different natures (relational vs. non-relational).
      *   **Accept Indistinguishability:** Acknowledge that these fundamentally different states can be subjectively indistinguishable?

      Doesn't denying CKA *undermine* the very indistinguishability the argument relies on? If they are so fundamentally different *in kind*, how could they possibly *feel* the same?

  3.  **The Disjunctivist Response (The Move You Might Be Missing):**

      Disjunctivists don't deny the *phenomenon* of indistinguishability. They deny that indistinguishability *must be explained* by a shared fundamental *nature* (CKA). Instead, they offer an alternative account of what indistinguishability *amounts to*:

      *   **Epistemic, Not Ontological:** Indistinguishability is primarily an *epistemic* notion concerning the *subject's inability to tell, by reflection alone*, which state they are in. It's about the *limitations of access* or *discriminatory capacities*, not about the intrinsic metaphysical nature of the states themselves.
      *   **Negative Characterization of the Bad Case:** The bad case (illusion/hallucination) is characterized *negatively* relative to the good case. It's defined as a state that is *not* a perception of the relevant object/property, but which the subject *cannot distinguish* from such a perception. This negative characterization doesn't require the bad case to *share* the positive nature of the good case; it only requires that it *masquerades* as it well enough to fool the subject.
      *   **Rejecting the "Highest Common Factor":** They reject the idea that the indistinguishability implies a "highest common factor" – a shared experiential component present in both that constitutes the core of the experience. Instead, the phenomenal character of the good case is constituted by the direct relation to the world. The phenomenal character of the bad case is constituted *differently* (e.g., by internal representations, neural states, or its causal history), but happens to be such that the subject cannot tell it apart from the good case *based on that character alone*.
      *   **Analogy (Imperfect but Helpful):** Think of a perfect fake diamond and a real diamond. They can be visually indistinguishable to even an expert. However, their fundamental natures are utterly different (one is carbon crystallized under immense pressure, the other might be cubic zirconia). The indistinguishability is a fact about our *discriminatory capacities* and the *superficial properties* of the objects, not a fact about a shared underlying essence. Similarly, disjunctivists argue, the veridical and illusory experiences have fundamentally different natures ("real diamond" vs. "perfect fake"), but our access to our own states doesn't always allow us to detect that difference.

  4.  **The Cost (What Disjunctivists Have to Accept):**

      While disjunctivists offer this account, there *is* a significant cost, which is precisely what you're sensing:

      *   **Explaining the "Feel":** Critics argue that disjunctivists struggle to give a satisfying *positive* account of the phenomenal character of the bad case *in its own right*, especially one that explains *why* it feels *exactly like* the good case if its nature is so fundamentally different. How does a non-relational state generate the same subjective "what-it's-likeness" as a direct relational state? Saying "it just does, and we can't tell the difference" can feel like an explanatory gap.
      *   **The Threat of Brute Indistinguishability:** It can seem like disjunctivists are forced to accept a kind of "brute" or inexplicable indistinguishability between metaphysically disparate states. This is counterintuitive to many, as we naturally expect states that feel the same to share *some* deep commonality.
      *   **Burden of Positive Account:** The disjunctivist must provide a plausible positive account of illusions/hallucinations that explains their phenomenal character *without* appealing to the same fundamental kind as veridical perception (e.g., via internal representations, qualia, or neural states), and show why *that* kind of state can perfectly mimic the feel of the relational state.

  5.  **Why Disjunctivists Think It's Worth It:**

      Despite the cost, disjunctivists argue the trade-off is necessary and beneficial:

      *   **Preserving Direct Realism:** It allows them to maintain a robust form of direct realism about veridical perception. The good case isn't "tainted" by the structure of the bad case.
      *   **Avoiding the Veil of Perception/Skepticism:** By rejecting the shared experiential core, they block the argument's slide towards skepticism or a "veil of perception" where we only ever directly access internal representations.
      *   **Metaphysical Purity:** They see the relational view as the correct metaphysics for perception, and illusions/hallucinations as metaphysically derivative or parasitic cases requiring a different explanation.

  **Conclusion:**

  You are not missing a simple move. The tension you identify is **the central challenge** for disjunctivism. Their response is to **redefine indistinguishability as an epistemic limitation rather than an ontological sameness.** They bite the bullet and accept that fundamentally different metaphysical states can, as a matter of contingent fact (due to our cognitive architecture or the way the world works), be subjectively indistinguishable.

  **Yes, this is a significant cost.** Critics argue it makes the phenomenal character of the bad case mysterious. Disjunctivists counter that the cost of *accepting* CKA (skepticism, loss of direct realism) is higher. Whether this cost is acceptable, or whether the disjunctivist account of indistinguishability is ultimately coherent and explanatory, remains a major point of debate in philosophy of perception. Your lecture should highlight this tension – it's where the real philosophical action is in evaluating disjunctivism's viability. You can frame it as: Disjunctivists save direct realism and factivity by making the phenomenal match between good and bad cases metaphysically brute or only superficially explicable.
