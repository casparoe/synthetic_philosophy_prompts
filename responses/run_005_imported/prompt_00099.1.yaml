  First, I need to address the arbitrariness requirement. Lewis insists that alternatives would work equally well, like driving on either side of the road. But the user mentions norms like fairness or queue-jumping where unilateral defection is tempting. Here, equilibria aren't interchangeable because one side might benefit more. For example, cutting in line gives an individual advantage, so the norm isn't arbitrary. This suggests Lewis's model is too narrow for such cases. Bicchieri's approach, where norms are upheld by conditional preferences and sanctions, handles these mixed-motive situations better.

  Next, common knowledge versus normative expectations. Lewis requires that everyone knows everyone knows the preferences and rationality, leading to a stable equilibrium. But Bicchieri emphasizes normative expectations—people conform because they believe others expect them to and might sanction deviation. This doesn't necessarily require common knowledge. For example, in queue-jumping, people follow the norm due to fear of disapproval, not necessarily through layered mutual knowledge. So Lewis's common knowledge might be too stringent for many social norms.

  The third point is whether conventions are a subset of social norms. Lewis's conventions are specific to coordination problems with arbitrary equilibria. Social norms, as per Bicchieri, cover a broader range, including those with conflicting interests. The user's examples like fairness norms involve intrinsic values and sanctions, which aren't arbitrary. So it makes sense to view Lewis's conventions as a special case where coordination is key, distinct from norms enforcing cooperation or fairness.

  The user is in a graduate seminar, so they need a clear comparison for academic discussion. Their deeper need might be understanding how these theories fit together or conflict, possibly for a paper or class argument. They might also want to apply these concepts to real-world examples beyond the text. Clarifying where each theory applies and their limitations would help them in their seminar discussions or assignments. Highlighting Bicchieri's expansion of Lewis's model could address their interest in broader social norm mechanisms.
answer: |-
  Your questions cut to the heart of a key debate in the philosophy of social norms and conventions. Let's break down the comparison between Lewis and the broader social norm perspective (exemplified by Bicchieri) along your three axes:

  ### 1. Arbitrariness & Equilibria: Pure Coordination vs. Mixed Motives
  *   **Lewis's Requirement (Crucial Work):** For Lewis, arbitrariness isn't just a footnote; it's **definitional and functional**. The core problem a convention solves is a *pure coordination problem*: multiple *strict Nash equilibria* exist where no individual has an incentive to unilaterally deviate *if others are conforming*. Driving on the left vs. right is the paradigm: both work equally well *as coordination devices*, and the choice between them is arbitrary. Conformity is driven purely by the desire to coordinate successfully, fueled by mutual expectations. There's no inherent conflict of interest about *which* equilibrium prevails, only a shared interest in *one* prevailing.
  *   **Broader Social Norms (Beyond Arbitrariness):** Bicchieri and others argue many crucial social norms govern **mixed-motive situations** (e.g., Hawk-Dove, Prisoner's Dilemma variants) where:
      *   **Equilibria are NOT Interchangeable:** Different equilibria often involve different distributions of costs/benefits. Fairness norms (e.g., 50/50 split) aren't arbitrary like driving side; they embody a *value* (fairness) and one party might strictly prefer an unfair split.
      *   **Unilateral Defection is Tempting:** In queue-jumping or contributing to public goods, an individual *can* gain by deviating *if others are conforming* (e.g., jumping the queue gets you served faster *because* others are patiently queuing). This is fundamentally different from Lewisian conventions where deviating while others conform is strictly worse (driving on the wrong side causes accidents).
      *   **Sustained by Sanctioning & Conditional Preferences:** Norms persist here because people develop **conditional preferences** to conform *if* they believe others expect them to (normative expectations) *and* anticipate potential sanctions (disapproval, exclusion, retaliation) for deviation. The norm itself often prescribes behavior counter to short-term self-interest.
  *   **Conclusion:** Lewis's requirement **is doing real work** but makes his account **too restrictive** to capture the full range of social norms. It perfectly explains "arbitrary sign" conventions (driving side, language, phone callback channels) but struggles with norms involving substantive values, distributive conflicts, or inherent temptations to defect. The arbitrariness requirement excludes precisely those norms where social pressure and normative expectations become essential motivators *beyond* pure coordination.

  ### 2. Common Knowledge vs. Normative Expectations: The Engine of Conformity
  *   **Lewis's Centrality of Common Knowledge (CK):** CK is the **linchpin** of Lewis's account. For a convention to emerge and stabilize as the solution to a coordination problem, it requires:
      *   CK of the payoff structure (everyone knows everyone prefers coordination).
      *   CK of rationality (everyone knows everyone will act to maximize their payoff).
      *   CK of the emerging regularity (everyone knows everyone is driving on the left, knows that others know, etc.).
      This infinite regress of mutual knowledge allows individuals to form firm, justified expectations about others' behavior, making conformity the uniquely rational choice. CK *replaces* the need for explicit agreement or external enforcement.
  *   **Broader Social Norms & Normative Expectations:** While mutual expectations exist, **CK is often unnecessary or insufficient**:
      *   **Normative Expectations (Bicchieri):** What matters is individuals' *beliefs* about what others *expect them to do* (normative expectations) and what others *actually do* (empirical expectations). They conform because they believe others *think they should* conform and might sanction them if they don't. This requires individuals to hold certain beliefs, but not necessarily infinite mutual knowledge of rationality and payoffs.
      *   **Sanctions & Internalization:** Conformity is often motivated by fear of sanctions (social or material) or internalized values, not just CK-based reasoning about coordination payoffs. One might queue because they fear dirty looks (sanction) or believe queue-jumping is *wrong* (internalization), even without modeling others' knowledge hierarchies.
      *   **Emergence without Full CK:** Norms can emerge and stabilize through learning, imitation, or focal points without the demanding structure of full CK. People might adopt a fairness norm because it "feels right" or they see others doing it, not because they've deduced it's the unique CK-sustained equilibrium.
  *   **Conclusion:** Lewis makes **CK essential** for generating the precise mutual expectations needed for coordination equilibrium. For broader social norms, **normative expectations and sanctioning threats are more central motivators**, and while mutual expectations exist, the full-blown, infinite-regress structure of CK is often seen as an unrealistic or unnecessary requirement for many norm types, especially those sustained by sanctioning or internalization.

  ### 3. Relationship: Special Case or Distinct Phenomenon?
  This is the crux of the debate:

  *   **Lewisian Convention as a Distinct Phenomenon:** Proponents argue Lewis identified a **unique and crucial mechanism** – coordination via arbitrary equilibrium selection sustained by CK and mutual expectations of rationality. They contend that lumping driving side in with fairness norms under one "norm" umbrella obscures fundamental differences in structure (pure coordination vs. mixed motive), motivation (self-interest via coordination vs. sanctioning/internalization), and the role of arbitrariness/CK. Conventions are a specific *solution* to a specific *problem*.
  *   **Lewisian Convention as a Special Case of Social Norms:** Bicchieri and others (like Edna Ullmann-Margalit) argue that Lewisian conventions are indeed a **specific subtype of social norm**. They fit within the broader definition of a social norm as a behavioral regularity sustained by conditional preferences and expectations. The key differences are:
      *   *Type of Problem:* Conventions solve pure coordination problems; broader social norms solve coordination *and* cooperation problems (mixed motive).
      *   *Nature of Conditional Preference:* In conventions, the preference is conditional *only* on empirical expectations (what others *do*). In broader norms, it's conditional on *normative* expectations (what others *think one should do*) and often includes a preference for avoiding sanctions.
      *   *Role of Arbitrariness/Sanctions:* Arbitrariness is defining for conventions; sanctions (or internalization) are defining for many other norms.
      Under this view, Lewis brilliantly modeled one *pathway* (coordination) for norm emergence, but other pathways exist (e.g., sanctioning systems evolving to solve cooperation dilemmas). Fairness norms might start as solutions to bargaining problems (mixed motive) and evolve sanctioning systems, distinct from but analogous to the coordination mechanism.

  **Synthesis & Your Seminar Context:**

  Your instinct that Lewis's picture feels narrow for "social norms" is widely shared. The debate highlights:

  1.  **Scope:** Lewis offers a **powerful, precise theory** of "arbitrary-sign" conventions essential for basic social coordination. Bicchieri provides a **broader framework** capturing norms regulating cooperation, fairness, and social order where conflict and sanctioning are central.
  2.  **Arbitrariness:** It **is essential** for Lewis but **excludes too much** to define social norms generally. Many important norms are *not* arbitrary.
  3.  **CK vs. Expectations:** CK is the **engine** for Lewis but often **overkill or irrelevant** for norms sustained by normative expectations and sanctions. Bicchieri's account is more psychologically plausible for many norms.
  4.  **Relationship:** The most productive view is often that Lewisian conventions are a **distinct and important subtype** of social norms, characterized by their reliance on solving pure coordination problems through arbitrary equilibria selected via processes heavily reliant on CK and mutual expectations of rationality. Trying to force *all* social norms into the Lewisian mold distorts phenomena like fairness or queue-jumping. Conversely, using Bicchieri's framework to analyze driving side works perfectly well, showing its generality. Lewis identified a specific, elegant mechanism; Bicchieri offers a taxonomy and framework for the messy, diverse world of norms as a whole.

  Your seminar argument likely reflects this tension: Lewis provides a clean, game-theoretically rigorous model of one vital kind of norm (the convention), while critics (like Bicchieri) argue that calling *only* this a "convention" or trying to stretch it to cover *all* "norms" misses the richness and motivational complexity of the broader social phenomena we intuitively label as norms. Both are crucial for understanding social order.
