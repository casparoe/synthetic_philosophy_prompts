answer: |-
  Your friend correctly identifies the **sunk cost fallacy** as a major factor, but your intuition is spot-on: **this is more complex**. Here's the breakdown of what's happening and how to approach it:

  1.  **The Sunk Cost Fallacy (Your Friend's Point):**
      *   **Core Truth:** The time and effort you've *already* invested are gone. You cannot recover them. Basing *future* decisions *only* on recouping past losses is irrational. Continuing purely because "I've already put so much in" is falling for this fallacy.
      *   **Relevance:** You acknowledge that walking away makes past hours "wasted," while staying offers a *chance* they weren't. This *is* sunk cost thinking. Your friend is right that you need to emotionally detach from those lost hours.

  2.  **The Competitive Escalation (The Crucial Missing Piece):**
      *   **The Arms Race:** This isn't just *your* sunk cost trap; it's a **dynamic, competitive escalation** driven by management's structure. Every time your colleague takes a project, she raises the perceived "price of entry" for the promotion. You feel compelled to match to stay competitive, locking you *both* into a cycle.
      *   **Management's Role:** Management is exploiting this dynamic brilliantly. They get valuable "stretch" work done for free (or at promotion-discounted rates) by pitting you against each other. **They have no incentive to decide** as long as you both keep producing. The constant deferral is likely intentional.
      *   **The Prisoner's Dilemma:** You're both stuck in a bad equilibrium. Individually, taking the *next* project seems rational (to not fall behind), but collectively, it leads to both of you investing far more than the promotion is likely worth, with no resolution. Walking away *feels* like letting the other win unfairly.

  3.  **The False Promise & Exploitation:**
      *   **Shifting Goalposts:** The requirement keeps changing ("another project"). This erodes trust that *any* amount of work will actually secure the promotion. What proof do you have that after the next project, they won't just ask for *another*?
      *   **Unpaid Labor:** Asking for significant "stretch" projects *unpaid* under the guise of a promotion competition is exploitative. It devalues your work and time. Even the "winner" starts the new role having already done substantial work for free.
      *   **Unclear Criteria:** The lack of decision suggests management doesn't have clear, objective criteria for the promotion, relying instead on this endless "trial by fire."

  **What This Means for Your Next Steps:**

  The sunk cost fallacy means you must ignore the *past* hours when deciding. The competitive escalation and exploitation mean you must critically evaluate the *future* costs and *realistic* benefits.

  **Here's how to break the cycle:**

  1.  **Demand Clarity & Set a Deadline (Break the Exploitation):**
      *   **Schedule a meeting with the key decision-makers.**
      *   **State your position clearly:** "I've enthusiastically taken on X stretch projects over the past 8 months to demonstrate my readiness for the [Promotion Title] role. I remain very interested. However, the repeated deferrals while asking for additional *unpaid* projects create significant uncertainty and unsustainable workload. I need clarity on the path forward."
      *   **Ask Direct Questions:**
          *   "What specific criteria remain unmet for this promotion?"
          *   "What is the *concrete* timeline for a final decision?"
          *   "How will the work on these latest 'stretch' projects be evaluated *specifically* towards the promotion decision?"
          *   "Is there a defined endpoint to this evaluation process?"
      *   **Set Your Boundary:** "To plan effectively, I need a firm decision date by [Specific Date - e.g., 4 weeks from now]. I am unable to commit to further significant unpaid stretch projects without this clarity and a defined endpoint to the evaluation process." **This is crucial.** Stop the infinite cycle.

  2.  **Evaluate the Response Realistically:**
      *   **Good Response:** They provide clear criteria, a near-term date, and assurance that the current project is the final evaluation step. *Then* you can weigh the *future* effort against the *realistic* chance of promotion based on this new info.
      *   **Bad Response:** Vagueness, refusal to set a date, insistence on *more* projects without clarity, defensiveness. **THIS IS YOUR ANSWER.** It confirms the exploitation and the low likelihood of a fair or timely decision. Proceeding further is almost certainly a waste of *future* time.

  3.  **Make Your Decision Based on the FUTURE:**
      *   **If you get clarity & a deadline:** Decide if the *remaining* work (just the current project) is worth the *realistic* chance of promotion *by that date*. Ignore the sunk past hours.
      *   **If you get a bad response or no response:** **Walk away.** This is not quitting; it's a strategic withdrawal from a rigged game. Continuing adds *new* sunk costs to the pile. Your time and skills are valuable. Invest them where they are respected and rewarded.
      *   **Consider the Opportunity Cost:** What else could you achieve with the time you're pouring into these unpaid projects? Job searching? Skill development? Actual paid freelance work? Rest? These have tangible value lost while you're stuck in this loop.

  4.  **Reframe Your Past Effort (Combat Sunk Cost Emotionally):**
      *   **Skills Gained:** Focus on the experience and skills you *have* acquired through these projects. These are portable and valuable, regardless of the promotion.
      *   **Market Test:** You've proven you can operate at a higher level. Use this evidence in your resume and future interviews (inside or outside the company).
      *   **Lesson Learned:** You've gained critical insight into how this company and these managers operate. This knowledge is valuable for navigating your career.

  **Conclusion:**

  Your friend is right about the sunk cost fallacy, but the core problem is **management exploitation through competitive escalation.** Stop focusing on the lost past hours. **Force clarity on the future.** Demand a concrete decision timeline and criteria. If management refuses to provide this, they are confirming the game is rigged, and you should walk away to invest your valuable time and energy elsewhere. Staying in an exploitative cycle hoping to validate past sacrifices is a recipe for burnout and resentment. Protect your future time and value.
