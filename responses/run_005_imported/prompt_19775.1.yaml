  We are going to explain Diaconescu's theorem, which shows that the Axiom of Choice (AC) implies the Law of Excluded Middle (LEM) in constructive set theory or type theory. The core idea is that AC allows us to "choose" elements from non-empty sets in a way that can decide arbitrary propositions, which is exactly what LEM does.

