answer: |-
  That's a brilliant question that cuts to the heart of philosophy of language, reference, and natural kinds. Philosophers like Saul Kripke and Hilary Putnam (who famously used the "jade" example) wrestled with precisely this. Let's break down the puzzle and how to think about it:

  **The Core Tension:**
  1.  **Ancient Expertise:** The artisans demonstrably had a robust, practical concept. They could reliably identify "jade," work with it effectively, distinguish it from look-alikes like serpentine, and value its specific properties (toughness, workability, beauty).
  2.  **Modern Classification:** Science reveals their "jade" encompasses two chemically and structurally distinct minerals (jadeite - NaAlSi₂O₆, nephrite - Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂) with different formation processes and properties (jadeite is harder, takes a higher polish, has more vivid colors; nephrite is tougher).

  **Why "Mistake" and "Success" Both Feel Wrong:**

  *   **"They were simply wrong":** Feels unfair. They weren't confused or incompetent. Their concept *worked* brilliantly for their purposes and accurately tracked *something* real in the world – a material with specific, identifiable properties.
  *   **"'Jade' successfully refers to both as one":** Feels scientifically inaccurate. Jadeite and nephrite *aren't* fundamentally the same kind of thing. There's no single underlying essence unifying them at a chemical/mineralogical level.

  **How Philosophers Analyze This (and Why "Jade" is a Classic Example):**

  1.  **Reference via Stereotype/Description (Putnam's Point):**
      *   The ancients referred using a **description** or **stereotype**: "That very hard, tough, greenish (or white, etc.) stone we carve, which takes a good polish and comes from certain places."
      *   **This description successfully picks out both jadeite and nephrite.** Anything satisfying this core set of observable properties *counted* as "jade" for them.
      *   **Success:** Their concept *did* determinately refer. It referred to *all stones meeting that functional description*. They weren't pointing at nothing; they were pointing at stones with specific macro-properties. Their expertise proves this reference *worked*.

  2.  **Lack of a Single Natural Kind Essence:**
      *   Kripke/Putnam argue that natural kind terms (like "water" or "gold") aim to pick out things sharing a hidden underlying essence (H₂O, atomic number 79).
      *   **"Jade" fails this test.** There is no *single* hidden essence. Jadeite and nephrite share superficial properties but have distinct essences.
      *   **Limitation:** While the *description* successfully picked out samples, the *assumption* that all things called "jade" shared a single fundamental essence was incorrect. The concept "cut across" natural kinds.

  3.  **"Jade" as a Functional Kind, Not a Natural Kind:**
      *   This is often the most satisfying resolution. The ancients weren't primarily interested in *mineralogy*; they were interested in a *material for carving and adornment* with specific aesthetic and physical properties.
      *   **"Jade" was defined by its functional role and observable characteristics:** toughness, workability, polishability, color range, cultural significance. Both jadeite and nephrite perfectly fulfilled this role.
      *   **Success Reinterpreted:** Their concept successfully referred to a **functional kind** – a grouping based on human use and perception, not fundamental scientific taxonomy. It was a *practical* kind, not a *natural* kind in the strict scientific sense.

  4.  **The Evolution of Meaning:**
      *   **Pre-Scientific Meaning:** "Jade" meant "that kind of stone (with those properties)".
      *   **Scientific Discovery:** Revealed that the extension of the pre-scientific term covered *two* distinct minerals.
      *   **Modern Meaning:** "Jade" often becomes ambiguous. Sometimes it's used loosely for both (especially in art/antiquity contexts), sometimes it's specified as "jadeite jade" or "nephrite jade." The term adapts, acknowledging the discovery.
      *   **No Failure, Just Refinement:** The ancient concept didn't *fail*; scientific investigation simply showed that the material they expertly used and identified fell into *two* scientifically distinct categories. The *meaning* of the word adapts to incorporate this new knowledge.

  **How to Think About Cases Like This:**

  1.  **Reject the Either/Or:** Don't force it into "successful reference" vs. "complete failure." It's more nuanced.
  2.  **Acknowledge Descriptive Success:** Their concept *did* determinately pick out real things in the world based on observable properties and function. Their expertise is proof of this.
  3.  **Recognize the Kind Mismatch:** Their concept grouped things that science later showed belong to distinct fundamental categories (natural kinds). The *assumption* of a single essence was wrong.
  4.  **Embrace Functional/Practical Kinds:** Many of our most useful concepts (e.g., "tool," "food," "furniture," even "weed") group things by human purpose and interaction, not by strict scientific taxonomy. "Jade" was such a concept for the ancients.
  5.  **See Meaning as Dynamic:** Word meanings aren't fixed for all time. They evolve as our understanding of the world deepens. The discovery about jadeite/nephrite refined the meaning of "jade"; it didn't retroactively invalidate the ancient concept, it explained its extension.
  6.  **Focus on the "Joint" They Carved:** The ancients carved reality at a joint that mattered *to them* – the joint of usable carving stone with specific properties. Science later showed this practical joint overlay two distinct mineralogical joints. Both carvings are valid for their purposes.

  **Conclusion:** The ancient artisans *did* successfully refer to something determinate: **all stones possessing the specific constellation of functional and aesthetic properties they associated with "jade" and expertly utilized.** They referred to a **functional kind** defined by human use. They were not mistaken about the *properties* or the *identity* of their material in their own context. The "mistake" only arises if we anachronistically impose the modern scientific framework of *natural kinds* and *mineralogical essence* onto their pre-scientific understanding. Their concept worked perfectly for its purpose; science simply revealed a deeper complexity they weren't equipped to discern. "Jade" is a fascinating example of how language hooks onto the world through practical interaction before scientific taxonomy refines our understanding.
