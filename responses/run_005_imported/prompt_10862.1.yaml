  First, Woodin initially used Omega-logic to argue CH is false but then switched to Ultimate L, suggesting CH is true. The multiverse view, like Hamkins', sees this reversal as evidence that there's no single truth for CH. The user wants both sides to engage deeply, not just monologue. They want the universist to defend the idea of a true set universe and the multiversist to question what evidence could support Ultimate L. Also, the universist should use analogies like scientific theory change, and the multiversist should challenge why some models seem more canonical.

