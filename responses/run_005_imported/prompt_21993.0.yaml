  First, Elaine's point about p-values and stopping rules. She argues that frequentist methods are flawed because researchers peek at data and stop when they see significance. This inflates false-positive rates. The Bayesian approach, she says, avoids this because the posterior doesn't depend on stopping rules. Hmm, she's right about the frequentist issue—optional stopping does mess with p-values. The Bayesian method does handle stopping rules differently because the likelihood principle means the data is what matters, not how it was collected. So her point here is solid. I should give this a high score.

  Then Dominic counters that Bayesian methods aren't a free lunch. He says researcher degrees of freedom just shift to priors and model choices. Prior-hacking can happen, where someone picks a favorable prior. That's a valid concern. Even if the math is correct, subjective priors can be manipulated. But Elaine's point was specifically about stopping rules, and Dominic is broadening the argument. Still, he's right that this is another way to game results. His point isn't wrong, but it's more about different vulnerabilities rather than refuting Elaine directly. So maybe a moderate score here.

  Elaine responds by emphasizing that with a fixed honest prior, Bayesian updating remains calibrated even with peeking. Frequentists aren't calibrated in the same way. She's correct here—Bayesian methods provide coherence regardless of stopping times. The theorem she references (like Doob's) supports that the posterior is calibrated under the prior. This is a strong point in her favor, addressing Dominic's prior-hacking concern by stressing honest priors. High score for Elaine here.

  Dominic's final point questions what "calibrated" really means. He argues that internal coherence doesn't guarantee field-wide reliability. If many researchers use different defensible priors, false discoveries could still be high. He shifts focus to systemic issues like publication bias. This is insightful because even if individual Bayesians are calibrated, collective practices might not prevent false positives. His point ties the replication crisis to broader incentives, which is valid. So his argument here holds weight, though it doesn't negate Elaine's technical points. 

  Neither mentioned that Bayesian methods require specifying a prior, which can be challenging. Also, while priors can be informed, in practice, many might use default priors without careful thought. Additionally, Dominic's systemic concerns highlight that methodological choices alone aren't enough without cultural changes like preregistration. The user might benefit from considering that both approaches have vulnerabilities, and combining methods with better research practices is key.
