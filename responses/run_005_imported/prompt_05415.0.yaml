answer: |-
  ## The Frege-Geach Gauntlet: Can Expressivism Survive Its Own Logic?

  You’ve nailed the core Frege-Geach challenge: if moral sentences fundamentally express non-cognitive attitudes (like disapproval or endorsement) rather than stating truth-apt propositions, how can they feature in logically complex sentences – like conditionals, negations, and disjunctions – while preserving the validity of moral arguments? The embedded occurrence seems stripped of its expressive force, demanding an explanation for how the *content* of the attitude translates into logical relations. Let’s dissect two prominent expressivist solutions – Blackburn’s quasi-realism and Gibbard’s norm-expressivism – and confront the standard objections. Your roommate’s dismissal deserves a rebuttal too, and I’ll give you a clear verdict: **while sophisticated expressivist accounts like Gibbard’s come remarkably close, Frege-Geach ultimately forces expressivism into a fundamental mutation that incorporates cognitivist elements, transforming it into a hybrid view that retains the expressivist spirit but abandons its pure non-cognitivist core.**

  **Blackburn’s Quasi-Realism & The Logic of Attitudes:** Simon Blackburn’s project in *Spreading the Word* aims to earn the *right* to talk *as if* moral judgments are truth-apt, using only expressive resources. His solution hinges on **higher-order attitudes**. Consider the conditional "If stealing is wrong, then getting your little brother to steal is wrong." For Blackburn, this doesn't express a belief about a relation between propositions. Instead, it expresses a *higher-order attitude*: **a disapproval of combining disapproval of stealing with a lack of disapproval of getting your brother to steal.** The validity of modus ponens is then explained by the *inconsistency* of certain combinations of attitudes. Holding the attitude expressed by the conditional while disapproving of stealing, yet *not* disapproving of getting your brother to steal, constitutes an irrational state of mind – a kind of **practical inconsistency**. The logical "force" is recast as psychological pressure towards attitudinal coherence.

  *   **Standard Objections:**
      *   **The Negation Problem:** What does "Stealing is not wrong" express? It can't simply be the *absence* of disapproval (that might be indifference). Blackburn suggests it expresses *tolerance* or *permissibility* – a positive attitude distinct from disapproval. But is this sufficient? If "wrong" expresses disapproval (A), then "not wrong" should express something like *not-A*. However, expressing *tolerance* (B) isn't simply the logical negation of A; it's a different positive attitude. This makes the logical relationship between "P" and "~P" murky. Is the inconsistency between disapproval and tolerance the *same kind* as the inconsistency exploited in the conditional? Or is it merely stipulated?
      *   **Attitudinal Inconsistency as Logic?:** Critics argue Blackburn relabels logical inconsistency as practical/attitudinal inconsistency without genuinely replicating the *formal*, truth-preserving structure of logic. The "inconsistency" feels psychological and contingent – why *must* disapproving of (A & ~B) while disapproving of A and not disapproving of B be irrational? Blackburn relies on a substantive (and potentially controversial) theory of rationality governing attitudes. Is this sufficient grounding for the *necessity* we associate with logical validity?

  **Gibbard’s Norm-Expressivism & Planning:** Allan Gibbard, particularly in *Wise Choices, Apt Feelings* and *Thinking How to Live*, offers a more robust framework. Moral judgments express **acceptance of a system of norms** (later refined to **planning states**). "Stealing is wrong" expresses the plan to *blame* those who steal. Crucially, Gibbard provides a **formal semantics** where moral sentences denote sets of **world-norm (or world-hyperplan) pairs**. A sentence is "true" relative to a hyperplan if the plan endorses the relevant reaction (e.g., blame) in that world. The conditional "If stealing is wrong, then getting your brother to steal is wrong" is "true" for a hyperplan if, in every world where that plan calls for blaming stealing, it *also* calls for blaming getting your brother to steal. Validity (necessarily truth-preserving) becomes: an argument is valid if, relative to *every possible hyperplan*, whenever the premises are "true" (according to that plan), the conclusion is also "true".

  *   **Standard Objections:**
      *   **The Disjunction Problem:** Consider "Stealing is wrong or giving to charity is foolish." What complex planning state does *this* express? Gibbard analyzes it as the plan to blame stealing *or* to feel disdain for charity-giving. But this seems to dilute the distinctive motivational force expressivism claims for simple moral judgments. Am I really planning *either* to blame stealing *or* disdain charity? Or is this disjunction capturing something more like a *belief* about what my norms require? The expressive "oomph" weakens significantly in complex embeddings.
      *   **Is This Still Pure Expressivism?** Gibbard's world-hyperplan semantics looks suspiciously like a truth-conditional semantics. He provides **truth-apt contents** relative to hyperplans. While he grounds these in planning states (the expressivist core), the *logical machinery* operates entirely on these plan-relative truth conditions. This looks like a significant concession: the *logic* is handled cognitively, by specifying truth conditions relative to a parameter (the hyperplan) that embodies the non-cognitive state. The expressive element *motivates* the parameter but doesn't *perform* the logical work itself.

  **Schroeder’s "Being For" (Briefly):** Mark Schroeder (*Being For*) attempts a purer expressivism using a single, atomic attitude: "**being for**." "Wrong" means "being for blaming for." Complex sentences are built by applying logical operators to these "being for" contents. While elegant in handling embedding (e.g., negation applies directly to the content: "not being for blaming stealing"), it faces severe problems like the "**new negation problem**" (distinguishing "not wrong" from "permissible" becomes tricky within the single attitude) and "**the problem of too many attitudes**" (it predicts an implausible proliferation of distinct "being for" attitudes corresponding to every logically complex sentence, losing the intuitive connection to motivation).

  **The Verdict: Mutation is Necessary.**

  Gibbard’s framework is the most impressive response. It systematically handles embedding, provides a clear account of validity, and roots everything ultimately in non-cognitive planning states. However, the objections bite deep:

  1.  **The Cognitivist Drift in Logic:** The formal semantics relies on assigning plan-relative *truth conditions* to explain logical relations. The expressivist core (the planning state) *sets the standard* for what counts as "true," but the *validity* of the argument "If P, then Q; P; therefore Q" is guaranteed by the *formal structure* of these truth conditions across all hyperplans, mirroring cognitivist logic. The non-cognitive element is foundational but not operational in the logic itself.
  2.  **The Problem of Complexity:** Disjunctions, and especially negations, strain the expressive link. The states attributed for complex sentences feel less like direct expressions of motivation and more like *descriptions* of the commitments entailed by one's fundamental plans or norms. This points towards a view where moral sentences express attitudes *and* describe the implications of those attitudes.

  This suggests Frege-Geach pushes expressivism towards **hybrid expressivism** or **quasi-realism of a more robust kind**. Views like Michael Ridge's ("Ecumenical Expressivism") or even Gibbard's later work explicitly incorporate descriptive (belief-like) elements alongside expressive ones to handle logical complexity. The core expressivist insight – that moral thought is fundamentally practical and rooted in conative states – remains vital. Moral judgments *do* express plans, commitments, or stances. **But Frege-Geach shows that to account for moral *reasoning* – for the objective-seeming logical relations we find indispensable – expressivism must incorporate resources that look cognitivist in function: truth-apt contents (even if relativized) and a logic operating over them.** Is this still expressivism? In spirit, yes: the non-cognitive state remains explanatorily primary, driving the content. But it’s no longer the *pure*, non-truth-apt expressivism of early Ayer or Stevenson. It’s a mutated, logically sophisticated descendant.

  **Why Your Roommate is Wrong (The Stakes):**

  This isn't a "dumb semantic word-game." Metaethics provides the foundations for how we understand moral discourse, disagreement, and reasoning. If expressivism collapses under Frege-Geach, it vindicates the cognitivist claim that moral judgments *must* be in the business of tracking mind-independent facts (realism) or at least involve robust belief-like states (sophisticated cognitivism). If expressivism mutates successfully, it shows how objective-seeming moral practice *can* arise from subjective commitments, offering a powerful anti-realist alternative. This matters profoundly:

  1.  **Disagreement:** How can we genuinely disagree if ethics is just booing and cheering? Frege-Geach solutions (like Gibbard's) show how expressivists *can* make sense of genuine conflict in plans or norms, not just clashing feelings.
  2.  **Reason & Persuasion:** If "stealing is wrong; therefore, getting your brother to steal is wrong" isn't *logically valid* but just a psychological quirk, the force of moral argument evaporates. Solving Frege-Geach is essential to showing that ethical persuasion can be *rational*, not just manipulative.
  3.  **The Authority of Ethics:** Does morality feel objective because it *is* objective, or because of the structure of our practical reasoning? Expressivist solutions to Frege-Geach attempt to explain the phenomenology of objectivity (including logical relations) without the metaphysics. This shapes our entire understanding of ethics' place in the world.

  Frege-Geach isn't a death knell, but it is a crucible. It forces expressivism to evolve beyond its simplest form. The resulting hybrid views may lack the purity of early non-cognitivism, but they offer a compelling and resilient account of moral language and reasoning grounded in our practical natures, proving the problem’s stakes are as real as the arguments we have about right and wrong every single day. Now go argue with this in section!
