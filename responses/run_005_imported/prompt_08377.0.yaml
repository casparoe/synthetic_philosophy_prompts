answer: |-
  You've nailed the core tension in Kepler's astrology - this wasn't a cynical cash grab *or* a complete rejection, but a radical, geometrically-driven reformulation grounded in his physics and cosmology. Forget "superstition vs. science"; think "bad geometry vs. good geometry." Here's the breakdown of his internal logic:

  **What He Rejected (and Why):**

  1.  **Zodiac Signs & Constellations:** Kepler saw these as fundamentally *human constructs* with no physical reality. The constellations are arbitrary groupings of stars at vastly different distances. The ecliptic (the Sun's path) is real, but dividing it into 12 equal 30° segments (Tropical Zodiac) based on ancient star patterns was meaningless geometry to him. *Why?* There's no inherent physical force emanating differently from the "sign of Aries" vs. "Taurus." It was symbolic baggage, not physics.
  2.  **Astrological Houses:** He dismissed the complex systems of house division (Placidus, Regiomontanus, etc.) as arbitrary mathematical fictions with zero connection to physical reality or demonstrable effect. The angles of the Ascendant (Eastern Horizon) and Midheaven (highest point) *were* significant to him, but the intervening houses were not.
  3.  **Planetary "Governance" of Signs/Houses:** The idea that Mars "rules" Scorpio or that Jupiter is "exalted" in Cancer was pure anthropomorphic symbolism with no basis in physical causation for Kepler. Planets exerted influence based on their *physical properties* (light, motion) and *geometric relationships*, not symbolic rulerships.
  4.  **Most Traditional Aspects:** He didn't accept the standard Ptolemaic aspects (conjunction, sextile, square, trine, opposition) simply because tradition said so. Their validity depended entirely on his geometric-harmonic criteria.

  **What He Kept (and His Physical Mechanism):**

  1.  **The Core Mechanism: Anima Motrix & Soul Resonance:**
      *   **Anima Motrix (Moving Soul of the Earth):** Kepler postulated that the Earth (and other planets) possessed an *anima motrix* – a non-material, motive soul or force. This wasn't "magic" in the occult sense; it was a *quasi-physical* causal agent he needed to explain planetary motion before Newtonian gravity. This *anima* was sensitive to light and geometric patterns.
      *   **Light as the Carrier:** Kepler was a pioneer of optics (*Astronomiae Pars Optica*). He understood planets don't emit their own light (except the Sun) but reflect sunlight. This reflected sunlight was the physical carrier of planetary influence.
      *   **Geometric Angles (Aspects) as Triggers:** When two planets formed a specific angular separation (aspect) *as viewed from Earth*, their combined *streams of reflected sunlight* reached the Earth's *anima motrix* at that precise geometric angle.
      *   **Harmonic Resonance:** Kepler's universe was fundamentally musical and geometric (*Harmonices Mundi*). The *anima motrix* resonated with specific, mathematically pure angular relationships – the harmonic aspects. This resonance altered the state or activity of the Earth's *anima*.
      *   **Effect on Earth & Humans:**
          *   **Weather:** The agitated *anima motrix* directly influenced the Earth's atmosphere, causing weather changes. Kepler spent immense effort correlating planetary aspects with weather patterns, seeing this as the *most demonstrable* effect.
          *   **Human Souls:** Human individual souls (*animae*) were of the same essential nature as the Earth's *anima motrix*, just embodied. They were therefore susceptible to the *same harmonic resonances* emanating from the agitated Earth-soul and the celestial geometry itself. This resonance could incline temperament, trigger latent tendencies, or influence events, but **not** determine fate. Free will remained paramount.

  2.  **Why Only "Constructible" Polygons? The Geometric Filter:**
      *   Kepler was obsessed with Euclidean geometry and the Platonic solids. He believed God constructed the universe according to pure geometric principles knowable to human reason.
      *   **Constructibility = Divine Harmony:** An angle (aspect) was physically significant *only* if it derived from the central angles of regular polygons that could be constructed using only a compass and straightedge (Euclidean tools). This wasn't arbitrary; it was a core tenet of his natural philosophy. Constructible polygons represented fundamental, God-ordained harmonies inherent in the fabric of reality.
      *   **The Harmonic Aspects:** These were the angles corresponding to the divisions of the circle by the constructible polygons:
          *   **Conjunction (0°):** Not strictly a polygon, but the fundamental alignment. (Divisions of 1: Circle itself).
          *   **Opposition (180°):** Division by 2 (Digon). (1:2 ratio).
          *   **Trine (120°):** Central angle of the Equilateral Triangle. (1:3 ratio).
          *   **Square (90°):** Central angle of the Square. (1:4 ratio).
          *   **Sextile (60°):** Central angle of the Hexagon. (1:6 ratio).
      *   **The Rejected Aspects:**
          *   **Quincunx (150°):** Not constructible (derives from the Dodecagon, which is constructible, but 150° is 180°-30°, and 30° requires the non-constructible Pentagon or Trisection). Kepler saw no inherent harmony here.
          *   **Semi-Sextile (30°), Quintile (72°), Bi-Quintile (144°), etc.:** While mathematically definable, they stemmed from the non-constructible Pentagon. Their ratios (1:12, 1:5, 2:5) were not part of the primary harmonic set based on constructible figures. They lacked geometric fundamentality.

  **Connecting the Dots: The Reformed System in Action**

  1.  **Focus on Earth:** The horoscope is geocentric because the *angles are measured from Earth*, where the *anima motrix* receiving the light resides.
  2.  **Planets as Light Sources:** Planets matter because of their physical properties (size, reflectivity) affecting the *intensity* of the light they reflect towards Earth. The Sun (source) and Moon (closest, fastest) are paramount.
  3.  **Aspects as Triggers:** Only when planets form specific, constructible-geometry angles (0°, 60°, 90°, 120°, 180°) do their combined light rays create a resonant geometric pattern that physically agitates the Earth's *anima motrix*.
  4.  **Effect Cascade:** This agitation:
      *   Directly causes atmospheric/weather effects (Kepler's primary empirical focus).
      *   Creates a resonant "climate" that human souls (*animae*), being of like nature, can resonate with, inclining (not determining) temperament and events. This is the basis for "mundane" and "natal" astrology in his system.
  5.  **Empirical Justification (as he saw it):** Kepler spent years correlating his harmonic aspects (especially conjunctions, oppositions, and trines of Saturn/Jupiter) with weather records. He believed he found statistically significant correlations, validating the physical effect on the Earth's atmosphere via the *anima motrix*.

  **In Essence:**

  Kepler didn't believe planets *symbolically meant* things. He believed they were physical bodies whose *reflected light*, arriving at Earth in specific, mathematically pure geometric configurations (the constructible aspects), physically interacted with a quasi-physical force within the Earth (*anima motrix*). This interaction caused real physical effects (weather) and created a resonant field that could influence human souls, which were composed of the same fundamental harmonic substance. He threw out anything that couldn't be reduced to this geometrically defined, light-based physics of resonance. His "reformed astrology" was an attempt to ground celestial influence in a causal, geometric, harmonic physics that aligned with his revolutionary astronomy and cosmology. It was deeply serious, rigorously argued within his framework, and fundamentally different from both traditional astrology and modern science.
