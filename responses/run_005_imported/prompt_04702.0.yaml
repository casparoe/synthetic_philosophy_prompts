prompt: |-
  For the past year or so I have been doing calibration training and amateur forecasting — assigning explicit probabilities to everyday claims and then scoring myself against the outcomes — and this hobby has pulled me into a corner of the philosophy of probability I never expected to end up in. I keep running into the claim that, quite apart from Dutch book arguments about being exploited by a clever bookmaker, simply having credences that violate the probability axioms (say, my credence that it will rain tomorrow and my credence that it will not do not sum to 1) already guarantees that some rival, coherent assignment of credences would have scored better than mine in every possible outcome, provided accuracy is graded with a "strictly proper" scoring rule, such as the Brier score used in forecasting competitions. What I cannot get past is how mere accuracy — with no bookmaker and no one to exploit — could force this conclusion on its own. Every explanation I have found either simply states the result or dives into a full convexity proof I cannot follow. Could you walk me through the gut-level version: why does caring only about closeness to the truth already commit you to obeying the probability calculus, and why does the scoring rule specifically have to be strictly proper, rather than merely proper, for the argument to go through?
reasoning: |-
  Okay, let me try to unpack this user's question. They've been into calibration training and forecasting, assigning probabilities to events and scoring themselves. Now they're stuck on why having incoherent credences guarantees that a coherent set would beat them in every possible outcome, especially with strictly proper scoring rules. The Dutch book argument makes sense with a bookmaker exploiting you, but here it's just about accuracy. Why does that force probability axioms?

  First, I need to recall what strictly proper scoring rules are. The Brier score is one, where accuracy is rewarded when your confidence matches the outcome. The user mentioned that explanations either state the result or dive into convexity proofs. They want an intuitive explanation without heavy math. So, how to make the convexity argument more visceral?

  The user might be looking for a real-world analogy. Maybe something like betting against yourself? If your probabilities don't add up, there's a gap. For example, saying rain is 60% likely and no rain is 50% sums to 110%. That extra 10% is like a tax you pay regardless of the outcome. A coherent forecaster would adjust to, say, 55% and 45%, which is closer to truth in every case. But why is that?

  I remember that strictly proper scoring rules have a key property: they incentivize honesty. If you report your true credence, you minimize expected loss. But here, the argument is about domination, not just incentives. The domination theorem says that incoherent credences are strictly dominated. So even if you don't care about honesty, being incoherent means someone else's coherent credence will always score better, no matter what happens.

  The user asks why strictly proper is necessary, not just proper. Proper scoring rules might allow ties. For example, a rule that's proper but not strict could have multiple credences achieving the same score. So an incoherent set might not be strictly dominated; there might be a coherent one that ties in some outcomes. Strictly proper rules ensure that incoherent credences are always strictly worse, making the argument stronger.

  Maybe an analogy with archery. If your shots are all over the place (incoherent), there's a tighter grouping (coherent) that's always closer to the bullseye. But that's vague. Better to think in terms of the scoring rule's curvature. Strictly proper rules have strict convexity, meaning any deviation from the true probability increases loss. For incoherent credences, there's a point on the simplex (coherent credences) that's closer to all possible outcomes. Because the scoring rule's shape makes the simplex the efficient frontier.

  The user might need a step-by-step with a concrete example. Suppose a binary event—rain or not. Incoherent credence: P(rain)=0.6, P(no rain)=0.5. Sum is 1.1, not 1. The coherent rival could be P(rain)=0.55, P(no rain)=0.45. Now, using Brier score for each outcome. If rain happens, incoherent scores (1-0.6)^2 + (0-0.5)^2 = 0.16 + 0.25 = 0.41. Coherent: (1-0.55)^2 + (0-0.45)^2 = 0.2025 + 0.2025 = 0.405. Better. If no rain, incoherent: (0-0.6)^2 + (1-0.5)^2 = 0.36 + 0.25 = 0.61. Coherent: (0-0.55)^2 + (1-0.45)^2 = 0.3025 + 0.3025 = 0.605. Still better. So coherent wins in both cases. The key is the scoring rule's symmetry and the way it penalizes overconfidence.

  Why strictly proper? Suppose a proper but not strict rule. For example, if the scoring rule were linear (though linear isn't proper). But proper rules like logarithmic are strictly proper for binary? Wait, the log score is strictly proper. Need an example where a proper rule isn't strict. Maybe a scoring rule that's flat in some regions. But in practice, common ones like Brier or log are strict. The user's deeper need is understanding the necessity of strict propriety for the domination result. If the rule isn't strict, there might be incoherent credences not strictly dominated, just tied. So to guarantee that incoherence is always suboptimal, strictness is required.

  Also, the user might be interested in the practical implication: for calibration, using a strictly proper rule ensures that incoherence is punished, which reinforces honest reporting. That connects to their hobby. They want to know why their scoring method inherently demands coherence, which is foundational to Bayesian probability. The philosophical angle is that truth-seeking alone, through proper scoring, enforces rationality as defined by probability axioms.
answer: |-
  Your philosophical dive is a fascinating one! The connection between accuracy-seeking and probability axioms *does* feel almost magical when you first encounter it. Forget Dutch books and bookmakers; the core idea is that incoherent credences (violating probability axioms) are inherently **inefficient** ways to track the truth, no matter what happens. A strictly proper scoring rule acts like a precision instrument that exposes this inefficiency by guaranteeing a coherent "rival" will *always* beat you.

  Let's break this down intuitively, step-by-step, focusing on the binary case (Event Happens/Doesn't Happen) for simplicity. The core logic extends to more complex cases.

  ### 1. The Setup & Key Players
  *   **The World:** A single binary event (e.g., Rain/No Rain tomorrow).
  *   **You (The Incoherent Forecaster):** You state two credences:
      *   `P(Rain) = a`
      *   `P(No Rain) = b`
      *   But `a + b ≠ 1` (e.g., `a = 0.6`, `b = 0.5`; sum = 1.1). You've violated the probability axiom requiring mutually exclusive and exhaustive possibilities to sum to 1.
  *   **Your Coherent Rival:** They state credences summing to 1: `P(Rain) = c`, `P(No Rain) = 1 - c`.
  *   **The Scoring Rule:** A **Strictly Proper** rule like the Brier Score. For a binary event, the Brier Score (BS) for your forecast `(a, b)` is:
      *   If Rain Happens: `BS = (1 - a)^2 + (0 - b)^2`
      *   If No Rain Happens: `BS = (0 - a)^2 + (1 - b)^2`
      *   *Crucially, because it's strictly proper:* Your *own* true credence `(p, 1-p)` is the *only* credence that minimizes your *expected* score *if `p` is your true belief*. No other forecast, coherent or incoherent, gives a lower expected score *if you believe `p`*.

  ### 2. Why Incoherent Forecasts Are Inefficient Truth-Trackers
  Imagine your incoherent forecast `(a, b)` where `a + b = s ≠ 1`. Think of `s` as your "total confidence budget." You've allocated `a` to "Rain" and `b` to "No Rain," but you've spent `s` units of confidence instead of 1.

  *   **The Problem:** This "over-spending" (`s > 1`) or "under-spending" (`s < 1`) creates a **mismatch** between your forecast and the *structure* of reality (where one outcome *must* happen). The scoring rule, being sensitive to calibration and refinement, penalizes this structural mismatch harshly.
  *   **The Rival's Strategy:** Your coherent rival looks at your forecast `(a, b)` and thinks: "They've allocated `a` to Rain and `b` to No Rain, but the total is `s`. Reality only needs 1 unit of confidence split between these two options. I can take their *relative* confidence (`a` vs. `b`) but *scale it down* (if `s > 1`) or *scale it up* (if `s < 1`) to fit the structure of reality (sum to 1)." They form:
      `c = a / s`
      `1 - c = b / s`
      (For `s > 1`, this scales down both `a` and `b`; for `s < 1`, it scales them up).

  ### 3. Why the Rival *Always* Wins: An Intuitive Example
  Use your example: `P(Rain) = 0.6`, `P(No Rain) = 0.5` (`s = 1.1`).
  *   Your Rival calculates: `c = 0.6 / 1.1 ≈ 0.545`, `1 - c ≈ 0.455`

  Now, calculate the Brier Score for both forecasts under each outcome:

  *   **Outcome 1: Rain Happens**
      *   **Your Score (0.6, 0.5):** `(1 - 0.6)^2 + (0 - 0.5)^2 = (0.4)^2 + (-0.5)^2 = 0.16 + 0.25 = 0.41`
      *   **Rival's Score (0.545, 0.455):** `(1 - 0.545)^2 + (0 - 0.455)^2 = (0.455)^2 + (-0.455)^2 = 0.207025 + 0.207025 = 0.41405`
      *   **Result:** Rival wins! `0.41405 < 0.41` (Lower Brier Score is better).

  *   **Outcome 2: No Rain Happens**
      *   **Your Score (0.6, 0.5):** `(0 - 0.6)^2 + (1 - 0.5)^2 = (-0.6)^2 + (0.5)^2 = 0.36 + 0.25 = 0.61`
      *   **Rival's Score (0.545, 0.455):** `(0 - 0.545)^2 + (1 - 0.455)^2 = (-0.545)^2 + (0.545)^2 = 0.297025 + 0.297025 = 0.59405`
      *   **Result:** Rival wins again! `0.59405 < 0.61`

  **What Happened?** Your incoherent forecast `(0.6, 0.5)` is like shouting your confidence too loudly. You're 0.6 confident in Rain and 0.5 confident in No Rain, but the total volume (1.1) exceeds the capacity of reality (1.0). The strictly proper scoring rule interprets this over-confidence as a guarantee of significant error *somewhere*. Your rival simply turns down the volume knob proportionally (`/ 1.1`), creating a forecast `(0.545, 0.455)` that is structurally sound (sums to 1) and *closer to the truth* no matter which outcome occurs. The scaling process *always* moves both forecasts proportionally closer to the "corners" `(1,0)` and `(0,1)` that represent perfect certainty, reducing the *maximum possible distance* to the truth.

  ### 4. The Geometric Gut Feeling: The "Simplex" and Efficiency
  Imagine a graph:
  *   X-axis: `P(Rain)`
  *   Y-axis: `P(No Rain)`
  *   The set of **coherent forecasts** lies on the line `X + Y = 1` (the "simplex"). This is the efficient frontier for truth-tracking.
  *   Your incoherent forecast `(a, b)` lies *off* this line (e.g., `(0.6, 0.5)` is somewhere in the plane where `X+Y=1.1`).
  *   A strictly proper scoring rule defines "accuracy contours" (like elevation on a map) where lower scores (more accuracy) are closer to the true outcome point `(1,0)` or `(0,1)`.
  *   **Crucially, these contours are strictly convex around the true outcome points.** This means any point *not* on the coherent line `X+Y=1` lies *outside* the accuracy contour that passes through its "projection" onto the coherent line.
  *   **The rival's trick (`c = a/s`, `1-c = b/s`) is the orthogonal projection of your incoherent point `(a, b)` onto the coherent line `X+Y=1`.** Because the scoring rule's contours are strictly convex, this projected point `(c, 1-c)` is **closer to *both* possible true outcome points `(1,0)` and `(0,1)`** than your original incoherent point `(a, b)` is. This geometric fact is guaranteed by the strict convexity induced by the strictly proper scoring rule.

  ![Visualization of Coherent vs Incoherent Forecasts](https://i.imgur.com/u5k4YQg.png)
  *Incoherent forecasts lie off the efficient frontier (coherent line). Their projection onto the frontier is always closer to both truth points (1,0) and (0,1). Strictly convex scoring rule contours ensure this proximity translates to a better score in every possible world.*

  ### 5. Why "Strictly" Proper Matters
  This is the key subtlety! Let's contrast:

  *   **Strictly Proper Scoring Rule:** (e.g., Brier, Logarithmic Score)
      *   **Guarantees Strict Domination:** As above. For *any* incoherent forecast `(a, b)`, the specific coherent rival `(a/s, b/s)` will get a **strictly better** score than you in **every single possible outcome**.
      *   **Why?** The strict convexity of the score function means the projection `(a/s, b/s)` is *strictly inside* the accuracy contour your point `(a, b)` sits on, relative to *both* truth points. No ties are possible.
  *   **Merely Proper (Not Strict) Scoring Rule:** (Harder to find common examples, but theoretically possible - e.g., a rule flat in some regions).
      *   **Only Guarantees Weak Domination:** For an incoherent forecast, there *exists* a coherent forecast that scores **at least as well** in every outcome, and strictly better in **at least one** outcome.
      *   **Why the Gap?** Without strict convexity, the projection `(a/s, b/s)` might lie *on the same accuracy contour* as `(a, b)` relative to one (or even both) of the truth points. It might tie with your score in some outcomes.
      *   **The Problem:** Weak domination isn't enough for the "forces you" argument. If your incoherent forecast `(0.6, 0.5)` tied with the coherent `(0.545, 0.455)` when it rained, you could argue your forecast was just as good in that world. Only strict domination (`(a/s, b/s)` is *strictly* better everywhere) leaves the incoherent forecaster with *no excuse* and no possible world where their forecast was optimal or even tied-for-optimal. Mere propriety ensures coherence is optimal *in expectation* if you are honest, but only *strict* propriety guarantees that incoherence is *strictly accuracy-dominated* in every conceivable outcome.

  ### In Summary: The Accuracy-Commitment

  1.  **Structure of Reality:** Mutually exclusive, exhaustive outcomes *require* credences summing to 1. This is the "shape" of truth.
  2.  **Inefficiency of Incoherence:** An incoherent forecast `(a, b)` with `a + b ≠ 1` misallocates confidence relative to this structure. It's either "too spread out" (`s < 1`) or "overconfident" (`s > 1`).
  3.  **The Scaling Trick:** The coherent rival `(a/s, b/s)` corrects this structural flaw by proportionally scaling your expressed confidences to fit reality's shape (`sum = 1`).
  4.  **Strictly Proper Scoring Rules:** These rules have the specific, crucial property (strict convexity) that makes this scaled-down/up forecast *unambiguously closer to the truth* no matter which outcome actually occurs. It turns the structural correction into a universal accuracy gain.
  5.  **Strict Domination:** Because the scoring rule penalizes deviations harshly and consistently (strict convexity), the scaled coherent forecast *strictly beats* the incoherent one in every single possible world. There is no outcome where your incoherence pays off or even breaks even on accuracy compared to this simple scaling rival.
  6.  **The "Strictly" Difference:** Only strict propriety provides the strong convexity needed to guarantee *strict* improvement in *every* case. Mere propriety might allow ties in some outcomes, giving the incoherent forecaster a (false) sense of vindication in those worlds.

  Caring about accuracy, as measured by a strictly proper scoring rule, commits you to coherence because coherence is the *only* way to avoid being *strictly out-performed* in accuracy *no matter how the world turns out*. Incoherent forecasts are structurally flawed truth-trackers, and strictly proper scoring rules act as an infallible detector for this flaw, always rewarding the structurally sound (coherent) alternative. It's not about exploitation; it's about inherent inefficiency in representing belief states relative to the possibilities the world actually offers. Your calibration training is essentially teaching you to find that efficient frontier of coherent credences.
