prompt: |-
  I'm a psychology senior enrolled this term in a philosophy of science seminar that has spent several weeks on the replication crisis and the underlying disagreement between frequentist and Bayesian approaches to statistical inference. The readings have mostly kept things at the level of abstract principles, but something that happened with my own honors thesis this semester has made the issue feel a lot less abstract, and I haven't been able to resolve it to my own satisfaction.

  My pre-registered analysis plan specified forty participants per condition for a priming study. Once I reached that number, the key comparison came out at p = .09: in the predicted direction, but short of the conventional .05 cutoff. My advisor, who has seen this happen many times before, told me to simply collect twenty more participants per condition "since we're so close." I did, and the p-value for the combined sample came out to .043. She was pleased and wants the thesis written up around this as a clean, significant result. When I mentioned this sequence of events to a labmate who is unusually into methodology, he reacted strongly: he said the .043 doesn't mean what I think it means anymore, and that my situation is close to a textbook case of the practices people have in mind when they talk about the replication crisis. A different labmate, who has been reading about Bayesian statistics on her own, said none of this would be a problem if I had just reported a Bayes factor instead of a p-value, since Bayesian updating is supposed to be indifferent to when or why a researcher decided to stop collecting data.

  I don't know which labmate has the better argument, or whether they're even really disagreeing about the same thing, and I'd rather understand why than just be handed a rule to follow, since this will not be the last dataset I analyze. Should I write up the .043 as my advisor wants, treat the result as inconclusive until an independent, properly pre-registered replication comes in, or go back and recompute the evidence in Bayesian terms as my second labmate suggests? And underneath all of that: is one of my labmates simply right and the other wrong, or is there something legitimate behind both of their worries?
reasoning: |-
  Okay, let me try to unpack this psychology student's dilemma. They're caught between their advisor's practical approach and two labmates with opposing methodological views. The core tension is about interpreting a p-value that became significant after adding more data past the pre-registered sample size.

  Hmm, the first thing that stands out is how perfectly this situation illustrates the abstract statistical debates from their seminar. The student seems genuinely trying to understand the principles behind the conflicting advice, not just looking for a quick fix. That's smart - this won't be their last statistical dilemma.

  First labmate's reaction about replication crisis practices makes sense. Continuing sampling until significance is classic p-hacking, even if unintentional. The initial p=.09 wasn't actually close to significance - that's a common misconception. The advisor's "so close" comment reveals a fundamental misunderstanding of p-values. 

  But the second labmate's Bayesian point is also valid... partially. Bayes factors do allow flexible stopping, but only if you specify the analysis plan in advance. Just switching to Bayes now would be like moving the goalposts. I should explain why "peeking" at data requires different Bayesian handling.

  The advisor's position worries me most. Pressuring for a "clean" significant result perpetuates publication bias. The student seems uneasy about this too - that's good instincts. They should honor their preregistration's stopping rule.

  For next steps: Reporting the full sample but acknowledging the sequence is crucial. The Bayesian reanalysis could be supplementary, but must be transparent about the data-dependent sampling. The key is showing all the data - including that initial non-significant result.

  Underneath it all, both labmates have legitimate points but oversimplify. Frequentist problems don't magically disappear with Bayes, and rigid preregistration has value beyond frequentism. This is really about research integrity more than which statistical flavor to use.
answer: |-
  This is an exceptionally thoughtful question that cuts to the heart of why the replication crisis matters *in practice*. Both labmates raise valid points reflecting different statistical philosophies, but neither tells the whole story. Let's break it down:

  **1. The Problem with "Collecting Until Significance" (First Labmate's Point):**
  *   **Why it's problematic under Frequentism:** P-values assume a fixed sample size determined *before* data collection. Adding more data after seeing an initial result (especially one "close" to significance) inflates the Type I error rate (false positives). Your final p=.043 *cannot* be interpreted as if you'd collected 60 participants from the start. The true probability of a false positive is likely higher than 4.3% because you selectively continued after seeing promising (but non-significant) data. This is a form of "p-hacking" (specifically, "optional stopping").
  *   **The Replication Crisis Connection:** This practice contributes to unreliable literature. If many researchers add participants until they hit p<.05, many published "significant" findings will be false positives or exaggerated effects. Your labmate is right: this is a textbook example of practices undermining reliability.

  **2. The Bayesian Perspective (Second Labmate's Point):**
  *   **Bayesian Updating & Stopping Rules:** Bayesian inference (using Bayes Factors - BF) *is* formally consistent regardless of *when* or *why* you stop collecting data, *as long as the analysis model is specified correctly*. The evidence accumulates continuously. Stopping because you hit a BF threshold, got bored, or ran out of money doesn't invalidate the BF calculated at that point *for the model you specified*. This is a key theoretical advantage.
  *   **The Crucial Caveat:** **This doesn't mean your *specific* action is magically fixed by reporting a BF.** The BF quantifies evidence for one model vs. another *given the data and the prior*. If your decision to add 20 more participants was influenced by seeing the initial p=.09, this **data-dependent sampling** still introduces a potential bias. The BF *itself* is valid for the model/prior/data, but the *process* that generated the data sequence might be biased. If you were more likely to continue only when results looked promising, the overall evidence might be overstated compared to a truly fixed sample or a pre-registered stopping rule *even under Bayes*. Reporting the BF doesn't erase the procedural history; transparency is still key.

  **3. Your Advisor's Position:**
  *   **Practical Reality, Methodological Flaw:** Your advisor represents a common, pragmatic (but statistically flawed) perspective. "We're close, just collect a few more" feels intuitive, and it often "works" to get significance. However, statistically, it exploits random variation and increases false positives. Pleasure at a "clean" result reflects publication pressure but ignores the methodological compromise.

  ## So, What Should You Do?

  1.  **DO NOT** simply report the final p=.043 from N=60 as if that was the pre-registered plan. This is misleading and statistically invalid under frequentism.
  2.  **DO NOT** treat the result as definitively significant based on the current data alone. The procedural history casts doubt on the reliability of the p-value.
  3.  **DO** be completely transparent in your thesis:
      *   Report the pre-registered analysis (N=40, p=.09, effect size, CI).
      *   Explicitly state that, *against the pre-registered plan*, you collected an additional 20 participants per condition based on the initial result being "close" to significance.
      *   Report the results for the full sample (N=60, p=.043, effect size, CI).
      *   **Crucially:** Acknowledge that adding participants after viewing the initial results means the final p-value does not have its usual frequentist interpretation and may inflate the risk of a false positive. Cite literature on p-hacking/optional stopping.
  4.  **Consider a Bayesian Reanalysis (But Transparently):** Calculating a Bayes Factor (BF) for the key comparison using the full N=60 data *can* be a useful supplement. Choose sensible priors (e.g., based on previous literature or a default "medium" prior) and *clearly state them*.
      *   **Interpret the BF cautiously:** It tells you the strength of evidence for your hypothesis vs. the null (or an alternative) *given the data and your priors*. A BF>1 supports your hypothesis, BF<1 supports the null. Common thresholds exist (e.g., BF>3 "moderate evidence").
      *   **Acknowledge the process:** State that while BF is less affected by stopping rules, the data collection was influenced by the initial result, which could introduce bias. The BF reflects the evidence in *this specific dataset* under *your chosen model/prior*.
  5.  **Interpretation:** Frame the results cautiously.
      *   "The pre-registered analysis (N=40) showed a trend in the predicted direction but was not statistically significant (p = .09, d = [effect size], 95% CI = [lower, upper]). After collecting an additional 20 participants per condition, the combined analysis reached conventional significance (p = .043, d = [effect size], 95% CI = [lower, upper]). However, due to the data-dependent sampling (continuing data collection based on the initial promising result), the frequentist p-value interpretation is compromised, and the risk of a false positive is elevated. A supplementary Bayesian analysis yielded a Bayes Factor of [value] in favor of the experimental hypothesis, suggesting [weak/moderate/strong] evidence relative to the null hypothesis, under the specified prior. Overall, the results provide suggestive but not definitive evidence for the priming effect, warranting cautious interpretation and replication with a pre-registered sample size."
      *   Emphasize the effect size and confidence/credible interval over the binary significance.

  ## Underneath It All: Who's "Right"?

  *   **First Labmate:** Is fundamentally **correct about the frequentist problem and the replication crisis link.** The *process* used invalidates the simple interpretation of the final frequentist p-value. Ignoring this contributes to unreliable science.
  *   **Second Labmate:** Is **correct about the theoretical advantage of Bayesian updating regarding stopping rules.** However, they slightly **overstate** the case. While the *BF calculation* is valid, the *reason* for stopping (data-peeking) can still introduce *bias into the data generation process itself*, which affects the evidence regardless of the statistical framework. Reporting a BF doesn't make the procedural issue disappear; it just changes how the evidence is quantified. Transparency remains essential.
  *   **Advisor:** Represents a common but **statistically invalid practice** driven by pragmatism and publication pressure. While well-intentioned (wanting you to have a "successful" thesis), it promotes questionable methodology.

  ## The Best Path Forward

  Prioritize **transparency and methodological integrity** over a "clean" significant result. Report both the pre-registered and final analyses fully and transparently, explain why the final p-value is compromised, supplement with a Bayesian analysis (clearly reported), and interpret the results cautiously as suggestive but requiring replication. This demonstrates a sophisticated understanding of the methodological issues you've studied – turning a potential weakness into a strength of your thesis. It prepares you to design and analyze future studies more rigorously, respecting both the strengths and limitations of different statistical approaches.
