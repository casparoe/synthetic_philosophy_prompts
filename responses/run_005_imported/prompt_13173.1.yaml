  Evaluation:
  - The multiple realizability argument is correctly attributed to Putnam and Fodor and is described accurately: mental properties can be realized by diverse physical properties, so no single physical kind can be linked by a biconditional bridge law to the mental kind. Thus, type-type reduction fails.
