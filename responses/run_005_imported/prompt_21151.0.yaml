prompt: |-
  So my friend and I got into a pretty long argument last night about the Christian doctrine of substitutionary atonement, like whether it actually makes sense for Jesus to be punished "instead of" everyone else. At some point she pulls up this David Lewis paper (yeah, the modal realism/possible-worlds guy, apparently he wrote about this too) called "Do We Believe in Penal Substitution?" and plays it as her trump card: her claim is that Lewis basically proved the whole idea is incoherent, since nobody thinks a volunteer can serve someone else's prison sentence, so the same logic sinks the idea that Christ can serve ours. I skimmed the actual paper afterward and it felt alot less clear-cut than that -- there's a whole bit about fines vs prison sentences and all of us supposedly being "of two minds" about it, and the ending honestly didn't read like a knockdown refutation to me. Am I missing something, or is she overselling what Lewis actually concludes?
