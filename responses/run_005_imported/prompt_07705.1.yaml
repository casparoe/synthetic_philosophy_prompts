  But I can push back: even if sub-C lives aren’t worth starting, equating them with actual suffering feels perverse. A life at -5 (agony) is intuitively worse than one at C-1 (mildly boring). Yet in some CLU calculations, adding the agony could be "less bad." That’s the sadistic hook—it’s not just avoiding mediocrity; it’s choosing torment as a "lesser evil."  

  The user might also need ammunition against "bite the bullet" replies. If the friend insists the Sadistic Conclusion is acceptable, the user can expose how that undermines the original motivation: if we’re willing to accept this, why fuss about the Repugnant Conclusion? Either both are tolerable or neither is.  

