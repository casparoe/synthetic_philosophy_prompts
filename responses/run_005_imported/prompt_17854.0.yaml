prompt: |-
  I help run a pretty small podcast that mostly exists so my co-host and I can bug interesting people about decision theory, and our guest in a couple weeks is a decision theorist who defends risk-weighted expected utility theory -- the Buchak-style view where instead of just weighting outcomes by their probability, you also run a seperate risk function over the decumulative probabilities, so an agent can rationally throw extra weight at avoiding the bad tail without that just being diminishing marginal utility wearing a disguise. She's also been taking the view somewhere more EA-coded: arguing that funders doing "hits-based" giving into x-risk work are often less rational than they think they are, and that real risk-aversion at the portfolio level is the correct call rather than a failure of nerve. I've spent way too much of my life arguing about this exact thing in EA forum comment sections, so I really don't want this episode to just be her restating the axioms and the Allais paradox one more time.

  Could you draft me seven or eight interview questions that actually press on this? I want at least one that goes after the "isn't r just Quiggin's rank-dependent weighting wearing a rationality costume" worry -- if the math is identical to a theory everyone else treats as describing a bias, what's actually doing the work of calling this one a rational attitude toward risk rather than a systematic misjudgment of probability. I want one built on the long-run objection (I think this is the one Johanna Thoma presses against Buchak): if a funder makes hundreds of roughly independent risky grants, risk-aversion on any one grant should wash out at the portfolio level by the law of large numbers, so is REU theory telling you to treat the whole portfolio as one gamble to be risk-weighted -- and if so, isn't "how many choices count as one gamble" now doing all the normative work, in a way that's totally up for grabs? And I want one on the veil-of-ignorance move: I'm pretty sure there's a paper, maybe by Buchak herself (something like "Taking Risks Behind the Veil of Ignorance," though I wouldn't swear to the exact title), arguing that Harsanyi's road from the veil to utilitarianism only goes through because he assumes the person behind the veil reasons via plain expected utility, and that swapping in REU reopens room for something like Rawls's risk-aversion without going all the way to maximin. So: doesn't that just import a purely prudential attitude -- how much risk I'll accept regarding my own one life -- into impartial tradeoffs between totally distinct people who, unlike me choosing behind a veil, never actually face a gamble at all? For each of those three, add a short follow-up keyed to whatever answer she's most likely to give -- my guess is "risk attitudes are rational primitives, just like the utility function, not derivative of belief" for the first, "you evaluate plans globally, not additively" for the second, and "the veil's already a fiction, so borrowing risk attitudes into it is no more illegitimate than borrowing anything else" for the third. Maybe end on a question about what pattern of actual choices, if we ever saw it, she'd count as real evidence against REU rather than just a shape of r she hasn't fit yet.
reasoning: |-
  Okay, the user runs a small podcast focused on decision theory and has an upcoming guest who defends risk-weighted expected utility (REU) theory, specifically the Buchak-style approach. The guest also applies this to effective altruism (EA), arguing that "hits-based" giving in x-risk work is less rational than perceived and that risk aversion at the portfolio level is justified. The user, having debated this extensively in EA forums, wants to avoid rehashing basics like axioms or the Allais paradox. Instead, they seek seven or eight pressing interview questions targeting three specific concerns: whether REU's risk function is just rank-dependent probability weighting in disguise, the long-run objection regarding portfolio-level risk, and the veil-of-ignorance argument's ethical implications. They also want follow-ups based on predicted responses and a final question about falsifiability.

  First, I need to unpack the user's core concerns. The first is about REU's mathematical similarity to Quiggin's rank-dependent utility, which is often seen as descriptive of cognitive biases. The user wants to challenge whether REU can claim normative status when the math looks like a model of irrationality. The second concern is Thoma's objection: if many independent gambles should wash out risk by the law of large numbers, why apply risk-aversion per grant rather than to the whole portfolio? This questions the coherence of "global planning" in REU. The third is whether importing prudential risk-aversion into Harsanyi's veil of ignorance—to justify Rawlsian conclusions—illegitimately personalizes impartial moral reasoning. 

  For each, the user predicts the guest's likely rebuttals: risk attitudes as rational primitives (not belief distortions), global evaluation of plans, and the veil's fictional nature allowing borrowed attitudes. Follow-ups must press these points. For instance, on the first, asking how to distinguish REU from bias without behavioral markers; on the second, probing how "global" is defined if not by arbitrary aggregation; on the third, challenging if risk-aversion can scale to interpersonal tradeoffs without losing moral neutrality. 

  The user also wants a falsifiability question—what evidence would contradict REU—to prevent ad hoc adjustments of the risk function. This tests the theory's empirical substance. 

  Beyond explicit asks, I infer the user wants to elevate the discussion beyond textbook defenses. They’re fatigued by superficial debates and seek to expose tensions in REU’s application to EA contexts, like x-risk funding. Unspoken needs might include: 
  - Testing REU’s real-world applicability, not just theoretical coherence. 
  - Probing if it inadvertently justifies status quo conservatism in high-stakes philanthropy. 
  - Clarifying whether "rational" risk-aversion meaningfully differs from cognitive biases in practice. 

  Drafting questions requires precision: 
  1. **Quiggin Comparison**: Start bluntly—highlight identical math to rank-dependent models, then demand why REU isn’t descriptive. Follow-up: if no behavioral difference, what makes it rational?  
  2. **Portfolio Problem**: Contrast independent grants with portfolio outcomes. Follow-up: if global evaluation overrides additivity, who defines the "plan"? Isn’t this arbitrary?  
  3. **Veil of Ignorance**: Challenge the grafting of self-regarding risk to impartiality. Follow-up: does this risk selfishly skewing moral choices?  
  4. **Falsifiability**: Ask for concrete disconfirming evidence—e.g., if linear risk functions explain all behavior.  

  Structure should flow: begin with theory/math (Quiggin), move to application (portfolio/EA), then ethics (veil), ending with falsifiability. Tone is rigorous but engaged—no gotchas, but clear stakes for EA listeners. Each follow-up should anticipate dodges, e.g., if the guest appeals to "rational primitives," press how we verify those without behavior.
answer: |-
  Here are seven interview questions designed to press the key philosophical and practical tensions in REU theory, specifically targeting your concerns and incorporating your predicted rebuttals with follow-ups. They avoid rehashing the Allais Paradox/axioms and focus on the EA/x-risk context and deeper normative challenges:

  1.  **The Quiggin Challenge (Math vs. Rationality):** "REU's core mathematical structure – applying a weighting function `r(p)` to *decumulative* probabilities – is formally identical to Quiggin's Rank-Dependent Utility (RDU), which is widely used descriptively to model cognitive biases like probability weighting distortions. If the math is the same, what *normative* argument forces us to interpret `r(p)` in REU as representing a *rational attitude towards risk itself*, rather than a systematic *misperception of probability*? What work is the 'rationality' label actually doing here beyond preference?"
      *   *Likely Rebuttal:* "Risk attitudes are rational primitives, distinct from beliefs/probabilities, just like utility functions."
      *   *Follow-Up:* "If `r(p)` isn't representing a belief distortion, but is a fundamental preference over risk structures, how do we empirically or normatively distinguish an REU agent with a non-linear `r(p)` from an EU agent with *mis*calibrated probabilities who *thinks* they are being risk-averse? What observable difference in choice *or justification* proves one is rational and the other isn't?"

  2.  **The Portfolio Problem & Thoma's Objection (Aggregation):** "In 'hits-based' giving, a funder makes many independent (or weakly correlated) risky grants. The Law of Large Numbers suggests that idiosyncratic risk *should* wash out at the portfolio level for a sufficiently large, diverse set of grants. Yet REU seems to counsel evaluating each individual grant under its own risk-weighted lens. Doesn't this imply REU recommends treating the *entire portfolio* as a single, massive 'gamble' to be evaluated under one global risk-weighting? If so, isn't the crucial normative question now *how we define the boundaries of a single 'choice' or 'gamble'* – and isn't that definition doing all the heavy lifting in determining the recommended level of risk-aversion for the funder?"
      *   *Likely Rebuttal:* "Agents evaluate *plans* globally; you don't evaluate sub-components additively under REU."
      *   *Follow-Up:* "But what *constitutes* the relevant 'plan' for a long-term funder? Is it the annual budget? The lifetime strategy? The entire field's effort? If REU doesn't specify how to aggregate choices into the 'global plan' for evaluation, doesn't that leave the theory dangerously underspecified for real-world portfolio decisions? Couldn't an arbitrarily defined 'plan' justify almost *any* level of risk-aversion on individual grants?"

  3.  **The Veil of Ignorance & Impartiality Worry:** "In work like Buchak's 'Taking Risks Behind the Veil of Ignorance,' REU is used to revive Rawlsian-style risk-aversion in the original position, arguing Harsanyi's utilitarianism only follows from EU. This uses the prudential risk-aversion of an individual behind the veil (e.g., fearing being the worst-off) to justify social choices favoring the worst-off. But doesn't this import a fundamentally *self-regarding*, prudential attitude towards risk concerning *one's own possible futures* into a context meant to model *impartial* moral trade-offs between *distinct persons*? The people represented behind the veil don't face a gamble over their identity; they *are* distinct individuals. Isn't applying REU here confusing the risk one rationally accepts *for oneself* with the moral weight we impartially owe *to others*?"
      *   *Likely Rebuttal:* "The veil is a hypothetical construct; borrowing the rational risk-attitude of the deliberator is no more problematic than borrowing their rationality or self-interest."
      *   *Follow-Up:* "But doesn't this move risk smuggling a *personal* fear of catastrophe (rational for an individual contemplating their single life) into the *moral* weight assigned to the very worst-off in society? If REU behind the veil justifies significant priority for the worst-off, is that capturing a truly *impartial moral concern* for others, or just the *self-interested caution* of the hypothetical chooser projected onto society? How is this not a form of ethical solipsism?"

  4.  **EA/X-Risk Specificity - Risk Aversion vs. Failure of Nerve:** "You've argued that 'hits-based' funders in x-risk can be less rational than they think, and that portfolio-level risk-aversion is often correct. But EAs often see hits-based giving precisely as *overcoming* a natural, irrational risk-aversion (loss aversion, probability neglect) to focus on tail probabilities. How does REU help us distinguish between *rational* risk-aversion (as per REU) and the *irrational* cognitive biases that EAs are trying to counter? Specifically in the x-risk context, where stakes are existential and probabilities are often Knightian, what testable predictions does REU make about the *optimal* level of portfolio risk-aversion that differs from EU+biases or maximin?"

  5.  **The Shape of 'r' and Paternalism:** "REU allows for a wide range of `r(p)` functions to be rational. In the context of advising funders or judging their rationality, doesn't this create a problem? If a funder is extremely risk-averse (`r(p)` highly concave), REU says this is rational. If they are risk-neutral (`r(p)` linear), that's also rational. If they are risk-seeking (`r(p)` convex) in specific domains, rational too. Doesn't this make REU functionally permissive to almost any funding strategy, undermining its power to criticize 'hits-based' giving as *irrational*? Isn't the critique then really about *which specific `r(p)` is appropriate for x-risk portfolios*, and how could we possibly adjudicate that normatively?"

  6.  **Instrumental vs. Fundamental Risk:** "A common EA counter is that apparent 'risk-aversion' in portfolio construction is often *instrumentally* rational: avoiding correlated failures, preserving option value, or ensuring the continuity of funding institutions themselves to try again. This seems achievable within an EU framework by carefully modeling the actual consequences, dependencies, and long-term dynamics. What does adding *fundamental* risk-aversion via REU *buy us* in terms of explanatory or normative power in the philanthropic context that isn't better captured by a sufficiently sophisticated EU model incorporating these instrumental concerns?"

  7.  **Falsifiability & The Limits of REU:** "REU, with its flexible `r(p)` function, seems highly adaptable to explaining many choice patterns. What specific pattern of choices or commitments, if observed in a funder (or decision-maker more generally), would you consider *strong evidence against REU* being the correct normative theory for them? In other words, what behavior couldn't be rationalized *somehow* by a suitably chosen `r(p)` and `u(x)`, forcing you to conclude 'Okay, *that* genuinely isn't rational, even by REU's broader lights'?"

  ### Why this structure works

  1.  **Directly Targets Core Tensions:** Goes straight to the philosophical/mathematical (Quiggin), practical/aggregation (Portfolio/Thoma), and ethical (Veil) cruxes you identified, avoiding well-trodden ground.
  2.  **EA/X-Risk Focus:** Questions 4 & 6 explicitly tie the theory back to the guest's EA critique and the x-risk context.
  3.  **Anticipates Rebuttals:** The follow-ups are designed to press on the *implications* of the likely defenses, forcing deeper engagement (e.g., the distinction problem for `r(p)`, the aggregation problem for "global plans", the impartiality problem for the veil).
  4.  **Challenges Permissiveness:** Question 5 directly addresses the worry that REU might be too flexible to offer meaningful critique.
  5.  **Tests Normative Bite:** Question 7 demands falsifiability, preventing REU from being a "just so" story for any behavior.
  6.  **Avoids Textbook Recap:** Assumes familiarity with REU basics and jumps to the contentious implications.

  ### Delivery Tip

  Frame these as genuine explorations of the tensions you find most philosophically gripping and practically relevant to EA/x-risk funding, rather than gotchas. Your background knowledge (mentioned in the prompt) will let you engage deeply with her responses on the fly. Good luck with the interview!
