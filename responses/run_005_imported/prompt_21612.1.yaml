  **After checking standard sources, the common solution is to have the final choice be between taking and passing, but with passing leading to a state where the other player gets to move again and might take, but in a finite game, this requires more moves. For a 4-*stage* game, there are 4 decision points. The 4th decision is by the last player, and if they pass, the game ends with the large payoff. To force them to take, their taking payoff must be > their final payoff. But this is counter to the "growing pot" idea. The standard centipede game in Rosenthal's paper and subsequent discussions has payoffs where, at each node, the player to move can end the game by taking, receiving a payoff higher than what they would receive if the other player ended the game on the next move, but lower than what they would receive if the game reached a later stage. The backward induction argument assumes that at the last move, the player takes, receiving e.g., 40 rather than passing and receiving 20 ( in a made-up number scheme). Then the player before knows that if they pass, the last player will take, leaving them with e.g., 10, whereas if they take now, they get 20, so they take. And so on.**

