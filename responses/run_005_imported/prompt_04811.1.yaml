answer: |-
  ## MEMORANDUM  
  **TO:** Investment Club Board  
  **FROM:** Treasurer  
  **SUBJECT:** Position-Sizing Policy Recommendation & Risk Tolerance Framework  
  **DATE:** October 26, 2023  

  ### 1. Recommendation: Fractional-Kelly Sizing (1/2-Kelly)  
  For this month’s trades, we will size positions using **half the Kelly fraction** (1/2-Kelly). This balances growth optimization with explicit risk mitigation.  

  *   **Why Fractional-Kelly?**  
      *   **Addresses Compounding Risk:** Pure EV maximization ignores the risk of severe drawdowns ("ruin"), especially critical for our small, irreplaceable fund. Full Kelly, while theoretically optimal for growth, can lead to high volatility unsuitable for our educational context.  
      *   **Practical Safety:** Half-Kelly reduces maximum drawdowns by ~50% vs. full Kelly while still capturing ~75% of the growth rate. This protects capital and reduces psychological stress.  
      *   **Independence Acknowledged:** Since trades are independent, Kelly-based sizing is mathematically sound. Fractional-Kelly is a prudent adaptation for real-world uncertainty in probability estimates.  

  *   **Implementation:**  
      *   Calculate optimal Kelly fraction for each trade: `f* = (bp - q) / b`  
          (Where `p` = win prob, `q` = loss prob = `1-p`, `b` = net fractional payout on win).  
      *   Allocate no more than `(f* / 2)` of the fund’s current value to each trade.  
      *   Enforce a hard cap: No single position > 5% of fund value, even if 1/2-Kelly exceeds this.  

  ### 2. Revisiting the Policy  
  We will review this policy **after 3 months (End of January 2024)** or **if fund value changes by ±15%**, whichever comes first. The review will assess:  
  *   Performance attribution vs. pure EV or full-Kelly simulations.  
  *   Portfolio volatility and maximum drawdown.  
  *   Accuracy of research team probability estimates.  

  ### 3. Addressing the Fifth Member’s Challenge  
  **You are correct.** This debate *is* fundamentally about **defining our risk tolerance**, not pure rationality. Both EV maximization and Kelly are "rational" under different objectives:  

  *   **Pure EV Maximization** assumes **risk-neutrality** and infinite scalability. It ignores the non-linear impact of losses on a small, compounding fund and prioritizes single-decision outcomes.  
  *   **Kelly Criterion** assumes **log-utility of wealth**, prioritizing long-term geometric growth. It is rational for repeated bets but sensitive to estimation errors and psychologically demanding.  
  *   **Fractional-Kelly** explicitly embeds **risk aversion** by targeting a fraction of optimal growth to reduce volatility.  

  **Our Context Demands Conservative Risk Tolerance:**  
  1.  **Capital Source:** Alumni donations are finite; replacing lost capital is difficult.  
  2.  **Educational Mission:** Preventing catastrophic loss preserves the learning platform. High volatility could deter participation.  
  3.  **Scale & Estimation Risk:** Our small size magnifies the impact of losses. Probability estimates (from students) inherently carry uncertainty, warranting conservatism.  

  Choosing 1/2-Kelly isn’t a rejection of rationality—it’s a **rational application of a utility function (risk aversion)** aligned with our club’s unique constraints: finite capital, educational goals, and operational reality. It transforms implicit risk preferences into an explicit, quantifiable framework.  

  ### 4. Next Steps  
  I move that we vote to adopt **1/2-Kelly sizing with a 5% per-position cap** for November’s trades, with a review scheduled for **January 31, 2024**. This policy directly addresses our risk tolerance while leveraging the mathematical rigor of the Kelly framework.  

  **Vote:** ☐ Approve ☐ Reject ☐ Amend  

