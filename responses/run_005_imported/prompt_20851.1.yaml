prompt: |-
  I'm writing a piece on the psychology of willpower, and it's dredging up an old family argument. My brother-in-law was a disaster with money in his twenties, then after a bad breakup something clicked and he 'decided' to get serious, and a decade later he's debt-free with a fat 401k. Now he tells his still-broke friends they could do the same if they just made the same decision he did, and gets pretty annoyed when anyone pushes back on that. Somethings bugging me about his argument, but he did technically make all those choices himself, so I dont really know how to argue with him. Is he wrong to take full credit for turning himself around, or is he basically right and I'm overthinking it?
