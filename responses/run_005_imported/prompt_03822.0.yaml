prompt: |-
  A friend and I spent much of dinner last night arguing about whether Thomas Aquinas would have approved of the July 20, 1944 plot against Hitler, and the question has been nagging at me ever since. She is finishing a thesis with a chapter on medieval political theology, and she kept invoking the Summa's treatment of sedition (II-II, q. 42), where Aquinas argues that because a tyrannical regime is ordered to the ruler's private good rather than the common good, there is nothing seditious about disturbing it — so, in her reading, Stauffenberg and his circle were squarely vindicated. I countered with what I recalled of De Regimine Principum, where Aquinas sounds far more anxious about the whole enterprise: he explicitly warns that allowing private individuals to decide for themselves that a ruler deserves death is more dangerous than the tyranny itself, since it invites ambitious men to brand any inconvenient ruler a "tyrant" and dissolves authority into competing acts of violence. Neither of us could settle how these two strands of his thought are meant to fit together, let alone how they would bear on a case as tangled as Hitler's Germany.

  What I would like from you is a genuine attempt to work through this, rather than a survey of "Aquinas opposed tyranny." Two issues in particular remain unresolved for me. First, the scholastic tradition distinguishes a tyrant who is simply a usurper with no legitimate title at all from a ruler who holds legitimate title but governs unconstitutionally, and Hitler is an awkward hybrid: legally appointed Chancellor by Hindenburg, and then hollowing out the Weimar constitution from within via the Reichstag Fire Decree and the Enabling Act. Which category would Aquinas actually place him in, and does the answer change the verdict on the conspirators? Second, the conspirators were not lone assassins; they were general staff officers acting through the chain of command and an existing contingency plan (Valkyrie), intending to use the Reserve Army to reimpose lawful government, at a moment when the German state had no surviving internal check on Hitler at all, and nothing resembling the pope or emperor to whom a medieval subject might have appealed over a wayward king. Does that make them closer to the "public authority" Aquinas insists must act in place of private persons, or would he still have regarded them as private men usurping a judgment that was never theirs to make? I would like you to reason through the primary texts and the tensions between them rather than settling for a tidy verdict.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about whether Aquinas would approve of the July 20 plot against Hitler. The friend focused on Aquinas's views on sedition from the Summa, where he says disturbing a tyrannical regime isn't seditious. The user countered with De Regimine Principum, where Aquinas warns against private individuals deciding to kill a ruler. The user wants a deep analysis, not just a summary.

  First, I need to address the two unresolved issues. The first is categorizing Hitler: was he a usurper or a legitimate ruler governing tyrannically? The user mentions Hitler's legal appointment as Chancellor but his subsequent dismantling of the Weimar Constitution. Aquinas distinguishes between usurpers without title and legitimate rulers who become tyrants. Hitler's case is a hybrid, so I should examine how Aquinas might classify such a scenario. 

  Looking at Aquinas's texts, in De Regimine, he talks about title and conduct. A ruler with legitimate title but tyrannical acts might still require different handling than a pure usurper. The key is whether the ruler has completely corrupted the constitutional order. Hitler used legal means to destroy legality, which Aquinas might see as a perversion of authority. This could place Hitler in a category where resistance is permissible, but the method matters.

  The second issue is whether the conspirators acted as public authority or private individuals. They were military officers using an existing contingency plan (Valkyrie) within the chain of command. Aquinas emphasizes that only public authority can judge a tyrant. But in a state where all institutions are corrupted, who constitutes "public authority"? The medieval context had higher authorities like the Pope or Emperor, but Nazi Germany had no such figure. The officers might be seen as acting on behalf of the common good when no other recourse exists. 

  I recall Aquinas's principle that in extremis, natural law permits defense of the community. The conspirators' plan to restore lawful government could align with this. However, Aquinas would worry about the precedent set by military officials taking action without a mandate. The tension here is between the lack of alternatives and the risk of vigilantism.

  The user's deeper need seems to be understanding how Aquinas reconciles his two positions. They want a nuanced discussion that doesn't oversimplify. They might also be interested in applying medieval political theology to modern contexts, seeing its relevance in contemporary debates on resistance and authority.

  I should analyze primary texts: Summa II-II q.42 on sedition, and De Regimine I.6. Aquinas in the Summa says overthrowing tyranny isn't sedition if it serves the common good. But in De Regimine, he cautions against private action due to the risk of anarchy. The resolution might lie in the distinction between who has the authority to act. The conspirators' use of an official plan might bridge this, positioning them as part of a residual constitutional structure.

  Hitler's hybrid status complicates things. His initial legitimacy through appointment was undermined by his actions. Aquinas might argue that by destroying the constitution, Hitler became a usurper de facto. Thus, resistance could be justified as against a usurper, even if initially legitimate.

  The officers' role is crucial. If they represent a remnant of the state apparatus, their action might be seen as public. Valkyrie was a legitimate contingency plan, so using it against Hitler could be framed as fulfilling their duty. Aquinas might view this differently from a lone assassin, as it's an institutional response.

  However, Aquinas would still be cautious. Without a higher authority's sanction, such actions risk factionalism. Yet in a totalitarian state, no higher authority exists. The user's scenario presents a modern dilemma Aquinas didn't anticipate. His principles might extend to justify the plot as a last resort, emphasizing the conspirators' intent to restore order.

  In conclusion, Aquinas would likely see the plot as permissible but dangerous. The officers' institutional role and the absence of alternatives mitigate the risks he feared. Hitler's destruction of legal norms places him beyond legitimacy, making resistance a duty for those with residual authority. The user's need for a balanced, text-based analysis is met by exploring these tensions without forcing a definitive answer, acknowledging the complexity Aquinas himself grappled with.
answer: |-
  This is a profound and genuinely difficult question that cuts to the heart of Aquinas's political thought and its application to modern tyranny. Your friend is right about *Summa Theologiae* II-II, q.42, but you are equally correct to highlight the profound caution in *De Regimine Principum* (I.6). Reconciling these requires careful attention to context, distinctions, and Aquinas's core principles. Let's work through your specific issues:

  **1. Hitler's Status: Usurper or Legitimate Ruler Gone Tyrannical?**

  *   **Aquinas's Distinction:**
      *   **Usurper (Tyrannus Absque Titulo):** Gains power *illegitimately* (force, fraud). Resistance is generally *easier* to justify as he has no rightful claim. The existing constitutional order is violated from the outset.
      *   **Tyrant in Exercise (Tyrannus Quoad Exercitium):** Gains power *legitimately* but rules *tyrannically* (for private good, violating justice, destroying common good). Resistance is far *more dangerous* to authorize, as it risks undermining legitimate authority itself and inviting chaos.

  *   **Hitler as a Hybrid Case (Aquinas's Nightmare Scenario):**
      *   **Initial Legitimacy:** Hindenburg's appointment of Hitler as Chancellor on January 30, 1933, was *technically* constitutional (Article 53 of Weimar Constitution). This grants him a *prima facie* legitimate title initially.
      *   **Hollowing Out Legality:** The Reichstag Fire Decree (Feb 1933) suspended civil liberties. The Enabling Act (March 1933) transferred legislative power to the Reich Cabinet, effectively ending parliamentary democracy *legally*. This is where the hybrid nature emerges. Hitler used *legal forms* to *destroy the substance* of the constitution and the rule of law.
      *   **Aquinas's Likely Classification:** Aquinas would likely view Hitler *not* as a simple usurper who seized power by a coup, but as a ruler who acquired a *limited, conditional legitimate title* (Chancellor under a constitution) and then systematically *perverted and destroyed* the constitutional order that granted him that title. By 1944, the Weimar Constitution was a dead letter; the state apparatus existed solely for Hitler's will and the Nazi ideology. Aquinas might argue Hitler, through his actions, had *effectively abdicated his legitimate role* and *become a usurper de facto*, having destroyed the constitutional framework that gave his office meaning. His rule was ordered *entirely* to his private vision and the Nazi Party's good, not the common good of Germany or its people.

  *   **Impact on the Verdict:** This hybrid status makes Aquinas *more cautious* than if Hitler were a clear-cut usurper. While the regime is unquestionably tyrannical (*Summa* II-II, q. 42 applies), the fact that Hitler exploited initial legal forms complicates the authorization of his removal. Aquinas's fear in *De Regimine* about ambitious men exploiting the "tyrant" label applies *precisely* because the initial legitimacy, however perverted later, creates ambiguity. However, the *extreme* and *total* nature of the tyranny, the complete destruction of legal/constitutional constraints, and the manifestly evil ends pursued by 1944 would weigh heavily *against* Hitler retaining any shred of legitimate authority in Aquinas's eyes. The verdict leans towards justification *only* because the tyranny is so extreme and the constitutional order so utterly destroyed that Hitler retains no legitimate claim.

  **2. The Conspirators: Private Individuals or Acting as "Public Authority"?**

  *   **Aquinas's Insistence:** *De Regimine* I.6 is unequivocal: "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." Crucially, he adds: "Nor should such action be deemed seditious, unless perhaps the tyrant's rule is disturbed so inordinately that his subjects suffer greater harm from the consequent disturbance than from the tyrant's rule." He then immediately warns: **"Indeed it is the tyrant rather that is guilty of sedition... But to proceed against the cruelty of tyrants is an action to be undertaken, not through the private presumption of a few, but rather by public authority."** This is the core tension.

  *   **Analyzing the Stauffenberg Circle:**
      *   **Not "Lone Assassins":** Their plan involved a coordinated military/civilian coup using the *existing state structure* (Valkyrie) to *seize control of the state apparatus* and *restore constitutional order* (or a semblance thereof). This distinguishes them from a Brutus acting alone.
      *   **"Public Authority"?** This is the critical question Aquinas would ask:
          *   **Arguments FOR:**
              *   They were high-ranking officers within the *official military structure* (General Staff, Reserve Army Command).
              *   Valkyrie was an *official contingency plan* designed (ostensibly) to maintain order. Using it could be framed as activating a legitimate state mechanism in an emergency.
              *   Their *stated aim* was not personal power but restoring lawful government ("public authority" in the sense of the common good and constitutional principle).
              *   There was *no higher temporal authority* (Emperor, Pope, Estates General) left in Germany to appeal to. The judiciary, legislature, and presidency were all subjugated. The military leadership *might* be seen as the last remnant of a "public" institution with a duty to the *state* (as opposed to the party or Führer).
          *   **Arguments AGAINST:**
              *   They were acting *against* the explicit, established chain of command and the sworn loyalty demanded by the regime. Hitler *was* the Head of State and Supreme Commander.
              *   They lacked any *formal mandate* from the German people, the remnants of the Reichstag, or any other constituted body. Their authority was self-constituted based on their judgment.
              *   Aquinas's "public authority" primarily meant *constituted bodies* with recognized jurisdiction – a council of nobles, the people acting collectively, a superior prince. A group of officers, even high-ranking ones, acting secretly, does not neatly fit this medieval model. They were not the "multitude" acting publicly.
              *   Valkyrie, while official, was designed for *external* threats or internal revolts *by enemies of the state*, not for overthrowing the head of state himself. Using it thus was arguably a *perversion* of its official purpose.
      *   **Aquinas's Likely View:** This is the hardest part. Aquinas would be deeply troubled. He would *admire* their motive – defense of the common good against manifest, extreme evil. He would recognize the *total* corruption of normal channels. However, he would likely **still see them as acting "through private presumption"** in the strict sense he meant in *De Regimine*. Why?
          *   They lacked a *formal, public, constituted mandate* recognized by the political community *prior* to the tyranny. Their authority was derived from their ranks and positions *within the tyrannical system*, not from a source independent of it or superior to it in the constitutional hierarchy (which no longer existed).
          *   Their action was *covert and conspiratorial*, not a public judgment by a recognized body. Aquinas envisioned a more open, juridical process, even if led by nobles or representatives.
          *   The *risk* Aquinas feared – that such actions invite chaos and factionalism based on private judgments – is still present, even if their specific judgment seems obviously correct to us. Who defines "manifest tyranny"? What prevents other factions within the military or state from using similar justifications later?
      *   **The "In Extremis" Counter-Argument:** However, Aquinas was a realist. Faced with the *total* perversion of the state, the *absence of any alternative mechanism*, and the *sheer scale of the evil* (genocide, aggressive war), one can argue Aquinas might concede this as an **extraordinary, last-resort action excused by necessity and the defense of the natural law**. The conspirators weren't usurping power *for themselves* but attempting to *restore* the possibility of public authority. Their use of Valkyrie, while strained, was an attempt to ground their action in the *residual structure* of the state, making it *less* "private" than a pure assassination or popular revolt might be.

  **Reconciling the Tensions: A Thomistic Verdict (Nuanced, Not Tidy)**

  1.  **Tyranny is Unquestionable:** Aquinas would have no doubt Hitler's regime was a monstrous tyranny ordered entirely to evil private ends, fundamentally opposed to the common good, natural law, and divine law. Resisting it is not intrinsically seditious (*Summa* II-II, q.42).
  2.  **The Hybrid Status Complicates Legitimacy:** Hitler's initial technical legitimacy and perversion of law make Aquinas *extremely cautious* about authorizing removal (*De Regimine*'s primary concern). However, the *completeness* of the constitutional destruction likely pushes Aquinas towards viewing Hitler as having *forfeited* any residual legitimacy by 1944, placing him closer to a usurper in effect.
  3.  **The "Public Authority" Barrier is High:** Aquinas would likely **not** consider the Stauffenberg circle, despite their ranks and plan, to be the "public authority" he envisaged as having the *right* to judge and depose a tyrant. Their action remains, in his strict medieval framework, a case of "private presumption."
  4.  **Necessity and the Scale of Evil Mitigate:** However, faced with the *unique extremity* of the Nazi regime – its total corruption of institutions, elimination of all appeal, and commission of unspeakable evils against natural law – Aquinas might conclude that **no other recourse existed** and the conspirators acted out of a *necessity* to defend the fundamental good of the community and natural justice. Their attempt to use the *residual state structure* (Valkyrie, aiming to restore law) makes their action *less objectionable* than pure vigilantism and aligns it more closely with the *intent* of restoring public authority.
  5.  **The Danger Remains:** Aquinas would still warn that their action, however justified in *this* specific, extreme case, illustrates the *very danger* he feared in *De Regimine*: it relies on the judgment of a few acting without a clear, pre-existing public mandate. It sets a perilous precedent, even if the judgment here seems undeniable.

  **Conclusion:** Aquinas would likely view the July 20th plot as **morally justifiable, perhaps even commendable in its intention and necessary given the circumstances, but falling short of the ideal, "public authority" action he preferred and remaining fraught with the dangers he warned against.** He would see Stauffenberg not as a model of how tyranny *should* be resisted constitutionally, but as a tragic figure forced into extraordinary action by the utter failure of all constitutional and public mechanisms in the face of unprecedented evil. The tensions between *Summa* II-II, q.42 and *De Regimine* I.6 aren't fully resolved; the plot exists in the uncomfortable space Aquinas identified – justified resistance to manifest tyranny, yet unavoidably carrying the risks inherent in actions taken without the sanction of a constituted public authority. The unique horror of Nazism and the conspirators' attempt to act through *residual* state structures push Aquinas closer to acceptance, but his deep caution about dissolving authority into private judgment would never fully vanish.
