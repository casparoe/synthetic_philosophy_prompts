prompt: |-
  So a friend of mine who's way deeper into the rationalist/EA blog world than I am linked me this old post (I think it was cross-posted between LessWrong and the EA forum) about "Harsanyi's aggregation theorem." The gist, as I understood it: if every person in a group has well-behaved ("VNM-rational") preferences over gambles, the group's own preferences over those same gambles are also well-behaved in that sense, and the group ends up indifferent between two options whenever literally every individual is indifferent between them, then it turns out the group's overall utility function is forced to be a weighted sum of everybody's individual utility functions. People in the comments were basically treating this as a clean mathematical proof of utilitarianism -- way more rigorous than Bentham or Mill just asserting "greatest good for the greatest number," like Harsanyi did in an afternoon what centuries of moral philosophy couldn't.

  That set off my bs detector a little, because in my day job as a software engineer I see people oversell "provably correct" results all the time -- the proof itself is airtight, but its answering a much narrower question then everyone assumes it is. So here's what I'm hoping you can help with: compare Harsanyi's theorem to utilitarianism as the actual, full-blooded ethical theory that people like Bentham, Mill, or Singer defend. Where does the theorem really earn the "utilitarian" label, and where's the gap? Like, does the theorem actually force equal weighting across people or just some weighting, does it say anything about whether "utility" means pleasure vs. preference-satisfaction vs. something else, and does summing everyone's utilities even make sense without smuggling in some extra assumption about comparing utility across different people? Basically, I want to know how much real philosophical work the theorem is doing on its own, versus how much is being read into it after the fact.
reasoning: |-
  Okay, the user is asking about Harsanyi's aggregation theorem and how it relates to utilitarianism. They're a software engineer who's skeptical about how this theorem is being presented as a "proof" of utilitarianism. Their friend shared a blog post that framed it as a mathematical justification for utilitarianism, but the user suspects there might be a gap between the theorem and the full ethical theory.

  First, I need to recall Harsanyi's theorem. It states that if all individuals in a group have VNM-rational preferences and the group preferences are also VNM-rational and Pareto efficient, then the group's utility function must be a weighted sum of individual utilities. The blog comments treated this as a rigorous proof of utilitarianism, but the user is right to be skeptical. In software engineering, proofs often have assumptions that don't hold in real-world scenarios. So, where are the gaps here?

  The user mentioned several specific points: equal weighting, what utility means, and interpersonal comparisons. Let me break those down. The theorem doesn't enforce equal weights; the weights could be unequal. That's a big departure from classical utilitarianism, which advocates equal consideration. Then there's the definition of utility. VNM utility is about preferences under uncertainty, not necessarily happiness or pleasure. That's a preference-satisfaction view, which differs from hedonistic utilitarianism.

  Interpersonal utility comparisons are another issue. VNM utilities are only unique up to affine transformations, so comparing across individuals requires normalization. Harsanyi assumes we can do this, but that's a normative choice. Without it, the weights don't have meaning. Also, Pareto efficiency is crucial. If the group isn't required to respect unanimous indifference, the theorem doesn't hold. But utilitarianism sometimes conflicts with Pareto, like in utility monster scenarios.

  The user's deeper need is to understand the limitations of mathematical models in ethics. They want to distinguish between the theorem's technical results and the broader ethical claims. They might also be interested in how assumptions in proofs can be misinterpreted in real-world applications. Addressing the gaps in weighting, utility interpretation, and interpersonal comparisons covers their explicit questions. Highlighting the Pareto efficiency assumption shows where the theorem's conditions might not align with utilitarian outcomes. Emphasizing that the theorem is descriptive, not normative, clarifies that it doesn't prescribe utilitarianism but shows what follows from certain axioms. This answers their concern about how much philosophical work the theorem does versus what's read into it.
answer: |-
  You've nailed the core tension perfectly: Harsanyi's Aggregation Theorem is a profound and mathematically elegant result, but it's *not* the slam-dunk, full-blooded proof of utilitarianism its enthusiastic proponents sometimes make it out to be. Your software engineer's skepticism about "provably correct" results answering narrower questions is spot-on. Let's break down where the theorem genuinely supports utilitarian *structure* and where the crucial philosophical gaps remain:

  **Harsanyi's Aggregation Theorem (Simplified Core):**

  1.  **Individuals:** Each person `i` has VNM-rational preferences over uncertain prospects (gambles/lotteries). This means their preferences can be represented by a cardinal utility function `U_i` (unique up to positive affine transformations: `a*U_i + b`, `a > 0`).
  2.  **Group:** The group ("social planner") *also* has VNM-rational preferences over the *same* uncertain prospects.
  3.  **Pareto Indifference:** If *every* individual is indifferent between two prospects `A` and `B`, then the group is also indifferent between `A` and `B`.
  4.  **Conclusion:** The group's utility function `U_social` *must* be a **weighted sum** of the individual utilities: `U_social = w_1 * U_1 + w_2 * U_2 + ... + w_n * U_n`, where the weights `w_i` are positive real numbers (and not all zero).

  **Where the Theorem Earns the "Utilitarian" Label:**

  1.  **The Summing Structure is Forced:** This is the theorem's core power. Given the premises, the *only* possible form for the social welfare function is **linear aggregation** of individual utilities. You cannot get a different functional form (like Rawlsian max-min, Nash product, geometric mean, etc.) without violating one of the axioms (usually VNM rationality for the group or Pareto Indifference). This directly mirrors the utilitarian commitment to summing individual utilities.
  2.  **Cardinality is Essential:** Utilitarianism requires cardinal utility (measuring intensity of preference, not just order) to make summing meaningful. VNM utility, which the theorem relies on, *is* cardinal. It provides the necessary type of measurement scale.
  3.  **Welfarism Implied:** The social utility *only* depends on individual utilities (`U_social` is a function *only* of the `U_i`'s). The social evaluation ignores non-utility information (like *how* utilities are distributed, rights, etc.) *if* it doesn't affect individual utilities. This aligns with utilitarianism's focus on outcomes defined by individual well-being.

  **The Crucial Gaps (Where the Philosophical Work Still Needs to be Done):**

  1.  **The Weighting Problem (Equality vs. Arbitrary Weights):**
      *   **The Theorem Says:** The weights `w_i` are positive but **otherwise arbitrary**. `w_i = 1` for all `i` is *one possibility*, but so is `w_1 = 1000, w_2 = 0.001, w_3 = 0.001`, etc.
      *   **Utilitarianism Requires:** Classical utilitarianism (Bentham, Mill, Singer) demands **equal consideration of interests**, implying `w_i = w_j` for all `i, j` (or weights proportional to capacity for utility, etc.). Harsanyi *assumes* nothing to force this. The weights are determined by the *group's* preferences over distributions of utility, which could reflect extreme inequality aversion, bias, or anything else compatible with the axioms.
      *   **The Gap:** The theorem provides the *form* (a sum), but not the crucial *normative* principle of *equality* that defines utilitarian ethics. Justifying equal weights requires separate moral arguments (e.g., impartiality, moral equality).

  2.  **The Interpretation of "Utility":**
      *   **The Theorem Uses:** VNM utility. This is defined purely behaviorally through preferences under risk. It represents *coherent preference satisfaction given beliefs about uncertainty*. It is **not** necessarily happiness, pleasure, desire fulfillment, or objective well-being. It's a formal representation of choice consistency.
      *   **Utilitarianism Defends:** Philosophers argue for specific substantive theories of the *good* (utility): Hedonism (Bentham, Mill), Preference Satisfaction (Singer often leans here), Objective List theories. These are claims about what *makes* life better or worse.
      *   **The Gap:** The theorem is **agnostic** about what `U_i` actually *means* beyond representing coherent risky choices. It proves that if individuals and the group rank gambles coherently and respect unanimous indifference, social utility *must* be a weighted sum of *whatever* those individual VNM utilities represent. It doesn't prove that VNM utility is the correct *ethical* measure of well-being. Harsanyi himself argued for preference-based utilitarianism, but that argument is separate from the theorem.

  3.  **Interpersonal Comparability (The Elephant in the Room):**
      *   **The Theorem Assumes:** Crucially, the theorem **assumes interpersonal comparisons of utility levels and differences are meaningful.** How?
          *   VNM utilities `U_i` are only defined up to `a_i * U_i + b_i` (`a_i > 0`). Choosing *specific* `U_i` functions for each individual (fixing the `a_i` and `b_i`) is necessary to make the sum `Σ w_i * U_i` meaningful. This choice *is* an interpersonal comparison.
          *   Pareto Indifference only gives information about *agreement* on indifference. To determine the weights `w_i` (e.g., how much trading off Alice's utility for Bob's the group allows), you *must* be able to compare the *magnitude* of utility *changes* across individuals.
      *   **Utilitarianism Requires:** Summing utilities inherently requires comparing them. Are 10 utils for Alice worth more, less, or the same as 10 utils for Bob?
      *   **The Gap:** The theorem **does not prove interpersonal comparability is possible or meaningful.** It *assumes* it as a prerequisite for applying the weights. Harsanyi argued comparability was possible (especially under the "extended preference" or "behind a veil of ignorance" view), but this is highly contested (e.g., by Robbins). This is the most significant philosophical leap required to go from the theorem to utilitarianism. **The theorem shows *if* comparability holds and the axioms hold, *then* aggregation must be linear. It doesn't establish comparability itself.**

  4.  **Pareto Indifference vs. Stronger Pareto:**
      *   The theorem only uses the weak **Pareto Indifference** condition. Classical utilitarianism often implies **Pareto Superiority**: If at least one person is better off and no one is worse off, the outcome is socially better. While Harsanyi's setup often *leads* to Pareto Superiority holding, the core theorem only strictly requires respecting *unanimous indifference*. This gap is minor compared to the others.

  5.  **Normative vs. Descriptive:** The theorem describes how a group preference *must* be structured *if* it satisfies certain axioms *alongside* individual preferences. It doesn't *prove* that a group *should* have VNM-rational preferences or *should* obey Pareto Indifference. Those axioms are themselves normative choices. Utilitarianism is a prescriptive ethical theory; the theorem is a mathematical consequence of specific assumptions about group decision-making.

  **Conclusion: What the Theorem Does and Doesn't Do**

  *   **What it Does:**
      *   Provides a powerful, **mathematically rigorous derivation** of the linear aggregation *form* for social welfare under specific, well-defined conditions (VNM rationality for all, Pareto Indifference).
      *   Forces **welfarism** (social utility depends only on individual utilities).
      *   Demonstrates the necessity of **cardinal utility** and **interpersonal comparability** *if* such aggregation is to occur within the VNM/Pareto framework.
      *   Shows that Bentham's "sum" isn't arbitrary; it's the *only* structure compatible with these axioms.

  *   **What it Doesn't Do (The Gaps):**
      *   **Prove interpersonal comparability of utility.** This remains the major philosophical hurdle.
      *   **Justify equal weighting (`w_i = w_j`).** This requires separate ethical arguments for impartiality.
      *   **Define what utility *is* ethically.** It doesn't tell us if utility is pleasure, preference satisfaction, or something else.
      *   **Prove utilitarianism as the *correct* moral theory.** It proves that *if* you accept VNM rationality for the social planner, Pareto Indifference, *and* meaningful interpersonal comparisons, *then* you get a weighted sum. But accepting those premises, especially interpersonal comparability and the normative force of the axioms, *is* accepting a significant part of the utilitarian framework. It doesn't *force* you to accept them.

  **In essence:** Harsanyi's theorem is a **cornerstone of modern utilitarianism** because it rigorously establishes the *structural form* that aggregation *must* take under seemingly plausible axioms. It turns utilitarianism from a vague "greatest sum" idea into a specific, derivable consequence. **However, it is not a self-contained "proof" of utilitarianism.** The heavy philosophical lifting remains: justifying interpersonal utility comparisons, arguing for equal weights, and defending a substantive theory of what utility represents. The theorem provides the mathematical engine, but the ethical fuel (comparability, equality, the good) and the steering (the normative axioms) still come from philosophy. Your BS detector was rightly pinging – the theorem answers a specific, technical question about preference aggregation under risk, not the full scope of ethical justification. It's a crucial tool *for* utilitarians, not a magical proof *of* it.
