  But now, for an arbitrary \(\phi\):

  - If \(\phi\) is true, then \( P_\phi \) is the universal property, which we just argued is positive. Since positive properties are necessarily positive (Axiom 1), then in every possible world, the universal property is positive. And then, by similar reasoning, in every world the universal property holds (because it's universal). So \(\phi\) (which is true) is necessarily true? Not exactly.

  Wait, let me try a different route:

  Actually, the modal collapse argument in the literature (as in the Isabelle/HOL formalization) goes:

  - From the axioms, one can prove that every positive property is instantiated in every world. Why?
    - Because necessary existence (a positive property) of an individual that has all positive properties (God) implies that in every world, that individual exists and has all positive properties. Therefore, every positive property is instantiated in every world.

  But then, for any true proposition \(\phi\), consider the property \( P_\phi \) that is the universal property if \(\phi\) is true and the empty property if false. Since \(\phi\) is true (at the actual world), \( P_\phi \) is the universal property. We have shown the universal property is positive. Therefore, it is instantiated in every world. But that doesn't show that \(\phi\) is true in every world.

  We must be careful: \(\phi\) is a proposition, not a property of an individual. We can associate it with a property of an individual by making it a constant property. But note that the truth of \(\phi\) does not change the fact that the universal property (which is always true of every individual) is the same in every world.

  The critical step is: we want to show that \(\phi\) is necessarily true. How?

  Actually, the argument for modal collapse in Gödel's system is that the system proves:

  \[ \phi \to \Box \phi \]

  for any proposition \(\phi\).

  Here's one way:

  1. Let \(\phi\) be any proposition that is true at the actual world.
  2. Define the property \( P(x) \equiv (x=x) \land \phi \). This property holds of every object if \(\phi\) is true, and is the empty property if \(\phi\) is false.

  Now, if \(\phi\) is true, then \( P \) is equivalent to the universal property (which we know is positive). So \( P \) is positive (by the closure under entailment: the universal property entails P and vice versa, and we know the universal property is positive).

  Then, by the axiom that positive properties are necessarily positive, we have:

  \[ \Box \ \text{Positive}(P) \]

  Now, by the definition of God (who has all positive properties necessarily) and necessary existence, we get that in every world, God exists and has all positive properties. Therefore, in every world, \( P \) is instantiated. But \( P \) being instantiated in a world means that in that world, for some x, we have \( P(x) \). Since \( P(x) \) is defined as \( x=x \land \phi \), this implies \(\phi\) is true in that world.

  Therefore, \(\phi\) is true in every world, i.e., \(\Box \phi\).

  But note: this argument uses the existence of God (which is derived from the axioms) and the fact that God has all positive properties necessarily. However, even without the full definition of God, the axioms about positive properties alone lead to trouble.

  Actually, in the Isabelle/HOL formalization, the modal collapse is derived without needing the definition of God. How?

  - We have that the universal property is positive (as argued: any positive property entails it, and there is at least one positive property, so by closure under entailment, it's positive).
  - Now, if \(\phi\) is true, then the property \( P_\phi \) (which is the property that holds of an object iff \(\phi\) holds) is equivalent to the universal property. Therefore, \( P_\phi \) is positive.

