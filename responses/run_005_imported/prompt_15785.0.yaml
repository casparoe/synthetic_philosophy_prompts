answer: |-
  You've hit on a core debate in Aquinas scholarship! Your initial reading of the *Sentences Commentary* is spot-on: Aquinas explicitly states that a private citizen can kill a tyrant who holds power *without legitimate title* (a *usurper*), precisely because there's no higher human authority to appeal to. This seems clear-cut and revolutionary.

  **The Tension Your Professor Points To:**

  However, your professor is right to highlight a significant tension, primarily arising from *De Regno* (On Kingship) and Aquinas's broader political philosophy. The tension isn't necessarily that Aquinas *contradicts* himself outright, but that he introduces crucial qualifications, shifts emphasis dramatically, and reveals the immense complexity of applying this principle in the real world. Here's why it's not so straightforward:

  1.  **The Focus Shifts to the *Legitimate Ruler Turned Tyrant*:** While the *Sentences* deals primarily with the *usurper*, *De Regno* focuses heavily on the much more common and thornier problem: a ruler who *acquired power legitimately* (by election, inheritance, etc.) but then *rules tyrannically*. Aquinas is far more cautious here.
  2.  **Emphasis on Public Authority, Not Private Action:** In *De Regno* (Book I, Ch. 6), Aquinas insists that action against a tyrant should ideally come from *public authority*, not private individuals:
      *   "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power."
      *   He explicitly argues *against* private individuals taking action: "...it is not the business of a private individual to summon together the multitude, for this might easily lead to civil disorder... the authority to do this belongs only to those who hold public power and who can, as it were, exercise the authority of the prince in restraining him."
  3.  **The Danger of Anarchy and Worse Tyranny:** Aquinas was deeply aware of history (like the Roman experience). His primary fear in *De Regno* isn't tyranny *per se*, but *disorder and anarchy*. He argues that removing *any* ruler, even a bad one, is incredibly dangerous:
      *   "The dangers which are incurred by following a tyrant are not so great as those which are incurred when a multitude is left without a head and without anyone to govern it. For a multitude without a head is exposed to dissension, and dissension leads to the destruction of the multitude and the loss of peace."
      *   He warns that the process of removing a tyrant often leads to worse violence and potentially an even worse tyrant emerging from the chaos. The cure, he suggests, might be worse than the disease.
  4.  **The "Higher Authority" Problem Re-examined:** While a usurper has *no title*, a legitimate ruler turned tyrant *does* hold legitimate authority *in origin*. Who constitutes the "public authority" qualified to judge and depose him? Is it the original electors? Their descendants? The nobility? The whole people? Aquinas is frustratingly vague on the precise mechanism, precisely because it's so complex and context-dependent. This ambiguity makes the "private citizen" solution even less appealing in this scenario.
  5.  **Natural Law vs. Practical Prudence:** Aquinas operates on two levels:
      *   **Theoretical/Principle (Natural Law):** Tyranny is a grave injustice. A usurper has no right to rule. Resistance *can* be justified in extreme cases to restore order and justice (the natural law end of government).
      *   **Practical/Prudential:** Removing *any* ruler is fraught with peril. The *means* of resistance are critical. Spontaneous, private violence is almost always destabilizing and counterproductive. Order, even imperfect order, is a fundamental good that must be weighed against the injustice of tyranny.

  **Applying it to Your Examples:**

  1.  **July 20 Plot (Stauffenberg Bomb Plot):**
      *   **Arguments FOR Aquinas's Endorsement:** Hitler was arguably a usurper who destroyed the Weimar constitution and ruled by force and terror. The plotters were *not* random private citizens; they were high-ranking military officers and officials – arguably figures possessing a form of "public authority" within the existing (though corrupted) structure. They appealed to a higher law (natural law/God). *Sentences* logic might support them.
      *   **Arguments AGAINST Aquinas's Endorsement (based on *De Regno*):** Hitler gained power through initially legal (though manipulated) means. The plot relied on assassination (private violence, even if by officials acting secretly). The potential for catastrophic chaos and worse tyranny (which indeed followed in the form of intensified Nazi reprisals) was enormous. Aquinas's emphasis on public, authorized action and fear of anarchy might have made him deeply uneasy about this specific *method*, even if he condemned Hitler as a tyrant.
  2.  **Private Citizen Killing a Dictator Today:**
      *   Aquinas would be **highly unlikely** to endorse this based on *De Regno*. His core warnings are:
          *   **Private Action is Dangerous:** It bypasses any semblance of public process and invites chaos.
          *   **Risk of Anarchy:** The death of the dictator doesn't automatically restore just order; it often creates a power vacuum filled by warlords or worse.
          *   **Lack of Authority:** The private citizen has no mandate to act *for* the community. They act as a private individual, potentially motivated by personal grievance or ideology, not the common good.
          *   **Focus on Public/Collective Action:** Aquinas would urge seeking *any* form of collective, structured action – even if difficult or slow (e.g., international pressure, organized internal resistance movements aiming to establish legitimate authority, appeals to remnants of legal institutions) – over the unpredictable violence of a lone actor.

  **Conclusion: The Core Tension**

  The tension your professor highlights is real:

  *   **The Radical Principle (Sentences):** Natural law permits, even demands, the removal of a ruler with *no legitimate title* by *any means necessary*, including private killing, due to the absence of higher appeal.
  *   **The Profound Caution (De Regno & Summa):** Practical governance requires order. Removing *any* ruler, even a tyrant (especially a *legitimate* one turned tyrant), is incredibly dangerous. Action must ideally come from *public authority* to minimize chaos and ensure a transition to just rule. Private action is almost always destabilizing and risks greater evils.

  Aquinas doesn't fully "walk back" the *principle* of resistance found in the *Sentences*. He still affirms that tyranny is intolerable and resistance *can* be justified. However, *De Regno* massively complicates the picture by:

  1.  Focusing on the more common case (legitimate ruler turned tyrant).
  2.  Insisting action should be public, not private.
  3.  Emphasizing the paramount dangers of disorder and anarchy.
  4.  Introducing ambiguity about *who* constitutes the legitimate "public authority" to act.

  So, while the *Sentences* passage seems to endorse vigilantism against usurpers, *De Regno* reveals Aquinas's deep political realism and profound fear of the consequences of unchecked private violence, even against manifest evil. This shift in emphasis and the introduction of severe practical constraints *is* the tension. He grants a theoretical right of extreme resistance but surrounds it with such strong caveats about prudence, public authority, and the dangers of disorder that exercising that right becomes fraught with peril and rarely aligns with the simple act of a private citizen taking matters into their own hands.
