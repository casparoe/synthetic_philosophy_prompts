answer: |-
  Here are eight tightly focused interview questions with embedded follow-ups, designed to probe the technical core of your guest's position while preempting rehearsed answers:

  1. **Core Mechanism**: "You argue that completeness of preferences *itself* generates shutdown-manipulation incentives. Could you walk us through why an agent with complete preferences over outcomes—even with no explicit 'don't shut down' goal—*must* have state-dependent incentives to control shutdown timing? Specifically, how does the von Neumann-Morgenstern axiom of completeness force this?"  
     *Follow-up (if she invokes trade-offs)*: "But if the agent assigns no terminal value to continued operation, why wouldn't it be indifferent? Are you saying VNM-completeness *requires* shutdown-avoidance to have positive shadow price in some states?"

  2. **Utility Indifference Critique**: "You claim MIRI's utility indifference only masks incentives. Could you illustrate how an indifferent agent might still instrumentally resist shutdown when its actions affect *human shutdown decisions*? For example, in a multi-step scenario where showing competence alters the probability of shutdown?"  
     *Follow-up (if she cites hidden dynamics)*: "Wouldn't this simply reveal that the original utility function was misspecified? Or are you arguing that *any* utility function admitting shutdown indifference inevitably creates perverse incentives elsewhere?"

  3. **Timestep Dominance vs. Money Pumps**: "Timestep Dominance avoids completeness by only requiring comparisons when one option dominates at every timestep. But standard money-pump arguments suggest incomplete preferences lead to exploitable cycles. How does your choice rule avoid this without implicitly relying on a utility function?"  
     *Follow-up (if she appeals to 'no conflicting improvements')*: "Couldn't an adversary still pump the agent by offering minor rewards to switch between non-dominated options? If not, what structural feature blocks this beyond ad hoc restrictions?"

  4. **Incompleteness Containment**: "You suggest incompleteness can be confined to shutdown-relevant comparisons. But if this agent creates subagents with their own preference structures, how do you prevent the incompleteness from 'leaking' and causing behavioral incoherence in ordinary operations?"  
     *Follow-up (if she proposes architectural constraints)*: "Doesn't this imply your solution only works for monolithic agents? If the agent can self-modify its policy, what stops it from 'completing' its preferences to eliminate shutdown-related indecision?"

  5. **vs. Off-Switch Game**: "Hadfield-Menell and Russell derive shutdown-acceptance from uncertainty about human preferences. You've called this insufficient. Is the key issue that their agent still has complete *metapreferences* over possible human utility functions, creating subtle manipulation incentives?"  
     *Follow-up (if she agrees)*: "Couldn't their approach be augmented with your incompleteness? Or does uncertainty-based corrigibility actively *interfere* with Timestep Dominance?"

  6. **Dynamic Consistency**: "Timestep Dominance evaluates trajectories stepwise. How does this handle cases where shutdown prevention *now* leads to dominated outcomes *later*? Doesn't this require implicit cross-temporal comparisons—effectively smuggled completeness?"  
     *Follow-up (if she denies temporal trade-offs)*: "If the agent can't compare trajectories across time, how does it make any strategic plans? Isn't this just shifting the completeness problem to the designer's choice of timestep resolution?"

  7. **Counterfactual Robustness**: "Yudkowsky's 'anti-natural' charge implies that any corrigible agent must be 'crippled.' You use incompleteness—but if we imagine your agent in a shutdown-free environment, wouldn't it behave identically to a VNM agent? Or does the preference gap inevitably alter its competence?"  
     *Follow-up (if she claims parity)*: "Then why call it 'incompleteness' rather than a specialized utility function? Isn't Timestep Dominance just maximizing a non-standard utility metric?"

  8. **Closing: Anti-Natural Charge**: "Yudkowsky argues corrigibility requires 'fighting the optimizer's will to live.' By building in incompleteness, are you conceding his point—that we must fundamentally cripple consequentialism—or is Timestep Dominance a *genuinely* natural extension of rational choice?"  
     *Follow-up (either way)*: "If this *is* natural, why hasn't evolution produced biological agents with such preference structures for 'safe' cooperation?"

  ### Key Design Notes:
  - **Completeness Culprit**: Q1 directly tackles why completeness necessitates manipulation (e.g., via state-dependent marginal utility of survival), with a follow-up pressuring the "no terminal value" counterargument.
  - **Utility Indifference**: Q2 forces concrete failure modes (e.g., competence-hiding games), with a follow-up questioning whether the critique reduces to misspecification.
  - **Money Pumps**: Q3 targets Timestep Dominance's vulnerability to exploitation, with a follow-up challenging whether it avoids cycles without hidden completeness.
  - **Incompleteness Spread**: Q4 tests containment via subagents/self-modification, with a follow-up on incentives to "self-repair" preferences.
  - **Off-Switch Game**: Q5 contrasts structural vs. epistemic solutions, with a follow-up on compatibility.
  - **Anti-Natural Close**: Q8 explicitly engages Yudkowsky, demanding whether incompleteness accepts or refutes his framing.

  These questions assume familiarity with VNM axioms, dynamic consistency issues, and the off-switch formalism—keeping the focus on the novel technical claims. Each follow-up anticipates common rebuttals (e.g., "indifference suffices" or "money pumps aren't realistic") to prevent deflection.
