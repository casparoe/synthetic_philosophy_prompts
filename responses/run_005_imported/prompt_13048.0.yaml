  We are drafting 8-10 interview questions for a podcast with a decision theorist on the AI shutdown problem. The focus is on her technical arguments about preference completeness and Timestep Dominance. We must include at least one question on each of the four specified areas, each with a follow-up. We also need a closing question on Yudkowsky's "anti-natural" charge.

