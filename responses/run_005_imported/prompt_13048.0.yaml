  1. **Completeness as the source of shutdown-manipulation incentive and why utility indifference doesn't remove it but masks it.**
     - Follow-up: Keyed to her likely response.

  2. **Timestep Dominance and how it avoids money-pump arguments without smuggling in completeness.**
