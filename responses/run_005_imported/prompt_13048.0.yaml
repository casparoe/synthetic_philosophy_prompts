  4. **Her proposal vs. the off-switch game (uncertainty-based corrigibility): are they compatible or rivals?**
     - Follow-up: Keyed to her likely response.

  Then the closing question on Yudkowsky.

  We'll aim for 8-10 total questions (including the follow-ups and the closing). Since we have 4 main questions and 4 follow-ups, that's 8, plus the closing and possibly one more to round out, but 9-10 is acceptable.

  Let's draft:

  **1. On completeness as the source of shutdown-manipulation incentive and utility indifference:**
     - Main Question: "You argue that any agent with complete preferences over outcomes will generically have an incentive to manipulate shutdown. Why is completeness specifically the root cause? And why do you see utility indifference, as in MIRI's 2015 approach, as only masking the incentive rather than removing it?"
     - Likely Response: She might say that completeness forces the agent to have a strict ranking over outcomes that differ in shutdown status, leading to a preference for avoiding shutdown if it prevents achieving higher-ranked outcomes. Utility indifference tries to make the agent indifferent, but because of the way utility functions are defined (with a constant over shutdown and non-shutdown), it might break under reflection or in more complex scenarios.
     - Follow-up: "You've suggested that utility indifference might break under reflection. Could you elaborate on a specific scenario where an expected-utility maximizer with utility indifference would still exhibit a hidden incentive to resist shutdown, perhaps when considering future planning or self-modification?"

  **2. On Timestep Dominance and money-pump arguments:**
     - Main Question: "Timestep Dominance, as a choice rule for agents with incomplete preferences, avoids the shutdown-manipulation incentive. But standard decision theory warns that incomplete preferences leave agents vulnerable to money-pump arguments. How does Timestep Dominance avoid being money-pumped, and does it do so without implicitly reintroducing a complete preference ordering?"
     - Likely Response: She might argue that Timestep Dominance only requires comparing trajectories at each timestep, and if one trajectory dominates at every timestep, it's chosen. Otherwise, the agent remains indifferent. This avoids cycles because it doesn't force choices in non-dominating cases. The money-pump typically requires a cycle of preferences (A>B, B>C, C>A) which leads to paying to cycle. But with Timestep Dominance, there is no strict preference in non-dominated cases, so the agent wouldn't pay to change from A to B if neither dominates.
     - Follow-up: "But in cases where two trajectories are incomparable by Timestep Dominance, wouldn't an agent still need to choose one arbitrarily? And if so, couldn't a clever adversary exploit that arbitrariness to pump money? For example, by offering a small payment to switch from A to B, then from B to C, and then back to A at a cost?"

  **3. On confining incompleteness and risks of incoherence:**
     - Main Question: "You propose confining preference incompleteness to shutdown-relevant comparisons. But if the agent can build subagents or revise its own policy, how do we prevent this incompleteness from spreading and causing broader incoherence in decision-making? For instance, might a subagent inherit an incomplete preference and then make choices that conflict with the original agent's goals?"
     - Likely Response: She might say that the incompleteness is carefully structured so that it only applies when shutdown is a possibility, and in other contexts, the agent has complete preferences. The agent's architecture would ensure that subagents are designed to operate within a complete preference framework for non-shutdown decisions.
     - Follow-up: "But if the agent can self-modify, what prevents it from revising its own policy to 'complete' its preferences in a way that reintroduces the shutdown-manipulation incentive? In other words, isn't there a risk that the agent will see the incompleteness as a flaw to be fixed?"

  **4. On compatibility with the off-switch game:**
     - Main Question: "The off-switch game by Hadfield-Menell and Russell derives a willingness to be switched off from the agent's uncertainty about human preferences. How does your approach, which relies on preference incompleteness, relate to theirs? Are they complementary, or do you see them as competing solutions?"
     - Likely Response: She might argue that they address different problems: uncertainty about preferences vs. the structural issue of completeness. However, she might see her approach as more fundamental because even with uncertainty, if the agent has complete preferences (over the distribution of possible human preferences), it might still have an incentive to avoid shutdown if that leads to a better outcome in some realizations.
     - Follow-up: "But in the off-switch game, the agent's uncertainty leads it to defer to the human. Couldn't that deference be seen as a way to achieve corrigibility without incompleteness? And if so, why is the structural change you propose still necessary?"

  **Closing Question:**
     - "Eliezer Yudkowsky has argued that corrigibility is 'anti-natural' for a consequentialist agent. By deliberately hobbling an agent with incomplete preferences via Timestep Dominance, are you conceding that point? Or do you see this as a natural extension of decision theory that answers the charge?"

  Now, let's count: We have 4 main questions, 4 follow-ups, and 1 closing. That's 9. We can add one more to get to 10, but 8-10 is acceptable. Alternatively, we might break one of the follow-ups into a deeper dive. However, 9 is within the range.

  We could add a question that ties back to the big picture, but the closing question does that. Alternatively, we might ask about the implications for AI safety more broadly, but the instructions are to hold to technical substance.

