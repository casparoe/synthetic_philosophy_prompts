prompt: |-
  I'm a retired experimental physicist, and now that I've got time on my hands I've been working my way through decision theory, which I somehow managed to avoid my whole career besides the usual error bars and Bayesian updating. A friend from my old department, who's now just as obsessed with philosophy in retirement as I am, got me into Lara Buchak's book on "risk-weighted expected utility," and I've been stuck on the same question for about two weeks now. From my one stats class in grad school I thought I already understood how you're supposed to handle risk aversion: you just make the utility function over money concave (log, sqrt, whatever fits the data), so a guaranteed $50 beats a 50/50 shot at $0 or $100 even though the expected payout is identical - Bernoulli sorted that out centuries ago with the St. Petersburg paradox.

  So when I got to the part where Buchak instead puts a "risk function" on the probabilities and leaves the utility function alone, my gut reaction was that this is the exact same trick just done on a different axis, like solving a problem in polar coordinates instead of cartesian and acting like you've discovered new physics. Squash the risky option down relative to the sure thing on the outcome side, or squash it down on the probability side - either way you end up ranking every gamble the same, no? My reading group (mostly other retired scientists, we're insufferable about this stuff) argued about it for a full hour and nobody could name one actual choice where the two theories would recommend something different. So before I embarrass myself in front of the philosophers in the group next week, I figured I'd ask here first: is "risk-weighted expected utility" really a distinct theory of rational choice, or is it just expected utility with a concave utility function wearing a costume, with decision theorists making a bigger deal out of the relabeling then it deserves?
reasoning: |-
  Okay, let's tackle this retired physicist's question. He's comparing Buchak's risk-weighted expected utility (REU) to the traditional expected utility theory (EU) with concave utility functions. His main point is whether REU is just a different way of representing risk aversion, essentially the same as using a concave utility function. He wants to know if REU actually leads to different recommendations in any real choices.

  First, I need to recall how both models work. In EU, risk aversion comes from the shape of the utility function—concave meaning diminishing marginal utility. For example, the utility of gaining $50 is more than half the utility of gaining $100, so a sure $50 is preferred over a 50/50 gamble of $0 or $100. 

  In REU, the utility function stays linear, but probabilities are transformed using a risk function. A risk-averse person might underweight high payoffs with low probabilities. So the risk function could make the low probability of winning $100 less impactful, leading to preferring the sure $50.

  The key question is whether these two models can be distinguished. I remember that EU satisfies the independence axiom: if you prefer A over B, then mixing both with a third option C shouldn't change that preference. REU violates this axiom. So there should be choice pairs where EU and REU make different predictions. 

  One classic example is the Allais paradox. In the Allais paradox, people often prefer a certain moderate reward over a risky one, but when both options are risky in a specific way, they switch preferences. EU can't explain this switch without changing utility functions, but REU can by transforming probabilities differently based on the context. 

  For instance, in the Allais common consequence problem, the choices involve certain vs. risky outcomes and then two risky options. The risk function in REU can overweight the worst outcome in the first choice, making the certain option better. In the second choice, the worst outcomes are the same, so the risk function doesn't skew as much, leading to a preference switch. EU with concave utility wouldn't predict this switch because the utility function is consistent. 

  Another point is that REU can handle violations of betweenness. If an option is a mixture of two others, REU might rank it differently than EU. For example, a gamble that's a mix of a safe and a risky option might be preferred to both under REU if the risk function is applied in a certain way, whereas EU would have it as an intermediate. 

  Also, in REU, the risk function can be more flexible. Depending on the parameter, it can model different attitudes towards uncertainty beyond just risk aversion, like optimism or pessimism. The utility function in EU is fixed in shape once defined, but the risk function can adjust how probabilities are weighted. 

  The physicist mentioned that his group couldn't find a choice where the two models differ. They might not have considered choices that specifically test the independence axiom. Presenting them with Allais-type choices could show the distinction. For example, in the first choice, between a sure $1 million vs. 89% chance of $1 million, 10% of $5 million, 1% of nothing, many prefer the sure thing. In the second choice, between 11% chance of $1 million vs. 10% of $5 million, they pick the latter. EU can't explain both with the same utility function, but REU can by overweighting the 1% risk in the first choice. 

  So, to answer his question, yes, REU is distinct because it violates axioms that EU adheres to, like independence. This allows it to explain behaviors that EU can't without inconsistent utility functions. Therefore, it's not just a relabeling but a fundamentally different model that captures how people actually weigh risks in ways EU doesn't.
answer: |-
  You've hit on a profound and subtle point in decision theory, and your intuition about coordinate transformations is spot-on for many cases—but Buchak's Risk-Weighted Expected Utility (REU) theory **is** genuinely distinct from Expected Utility (EU) with concave utility. The difference emerges in choices involving *non-linear probability weighting* and violations of key axioms. Let me break this down for a physicist-turned-decision-theorist:

  ### 1. **The Core Difference: What Each Model Squashes**
     - **Standard EU (with concave utility):**  
       Risk aversion arises solely from the *diminishing marginal utility of outcomes*.  
       \( U(\text{\$50}) > 0.5 \cdot U(\text{\$0}) + 0.5 \cdot U(\text{\$100}) \)  
       Here, \( U(\cdot) \) is concave (e.g., logarithmic).
       
     - **Buchak's REU:**  
       Utility over outcomes is *linear* (e.g., \( U(\text{\$x}) = x \)), but probabilities are transformed by a **risk function** \( r(p) \).  
       For risk aversion, \( r(p) \) is convex (e.g., \( r(p) = p^2 \)), underweighting high-stakes probabilities:  
       \( \text{REU} = U(\text{\$0}) + r(0.5) \cdot [U(\text{\$100}) - U(\text{\$0})] \)  
       With \( r(0.5) < 0.5 \), the gamble looks worse.

  ### 2. **When They Agree (Your Observation is Correct!)**
     For simple binary gambles (e.g., sure thing vs. 50/50 risk), REU and EU **are observationally equivalent**. You can always find:  
     - A concave \( U \) for EU, or  
     - A convex \( r(p) \) for REU with linear \( U \),  
     to produce identical preferences. This is the "coordinate transformation" you noted.

  ---

  ### 3. **Where They Diverge: The Crucial Test Cases**
  REU violates the **Independence Axiom** (or "Betweenness"), which EU strictly obeys. This creates splits in choices involving *three or more outcomes* or *compound lotteries*. Here are two classic examples:

  #### Example 1: **The Allais Paradox (Common Consequence Effect)**
  Consider two choice pairs:
  - **Choice 1:**  
    - Option A: $\$1M$ for sure  
    - Option B: 89% chance $\$1M$, 10% chance $\$5M$, 1% chance $\$0$  
    *Most people prefer A (risk aversion).*

  - **Choice 2:**  
    - Option C: 11% chance $\$1M$, 89% chance $\$0$  
    - Option D: 10% chance $\$5M$, 90% chance $\$0$  
    *Most people prefer D (risk-seeking for small probabilities).*

  **EU Prediction:**  
  Requires \( U(\$1M) > 0.89U(\$1M) + 0.1U(\$5M) + 0.01U(\$0) \) for Choice 1.  
  Rearrange: \( 0.11U(\$1M) > 0.1U(\$5M) + 0.01U(\$0) \).  
  For Choice 2, this implies \( 0.11U(\$1M) > 0.1U(\$5M) + 0.01U(\$0) \) → prefer C over D.  
  **But people prefer D!** EU can only explain this by assuming *inconsistent* utility curves.

  **REU Prediction:**  
  With a convex \( r(p) \) (e.g., \( r(p) = p^2 \)):
  - Choice 1: Overweights the 1% loss → prefers A.
  - Choice 2: The sure $\$0$ dominates both; \( r(0.11) \approx 0.0121 \), \( r(0.10) \approx 0.01 \).  
    REU(C) ≈ \( 0.0121 \cdot \$1M \)  
    REU(D) ≈ \( 0.01 \cdot \$5M = \$50K > \$12.1K \) → prefers D.  
    **Matches human behavior with fixed \( r(p) \).**

  ---

  #### Example 2: **Machina’s Triangle (Fanning Out)**
  Consider three outcomes: \(\$0\), \(\$50\), \(\$100\). Plot lotteries in a probability simplex:  
  - **P:** 100% chance of \(\$50\)  
  - **Q:** 50% \(\$0\), 50% \(\$100\)  
  - **R:** A mix (e.g., 90% \(\$50\), 10% \(\$100\))  

  **EU Prediction:**  
  Indifference curves are *linear and parallel*. If P > Q (risk aversion), R should lie between them.  

  **REU Prediction:**  
  With convex \( r(p) \), indifference curves *fan out*. Risk aversion intensifies as outcomes worsen.  
  - Near P (\(\$50\) certain), R might be preferred over Q.  
  - Near Q (high risk), Q might be preferred over R.  
  **EU cannot capture this fanning; REU can.**

  ---

  ### 4. **Why Philosophers Care: Rationality Debates**
  - EU is "axiomatic": Violating Independence is *irrational* (Savage, von Neumann).  
  - Buchak argues REU is *procedurally rational* for agents who weigh extreme outcomes disproportionately.  
  - REU explains why people buy insurance (avoid low-probability loss) *and* lottery tickets (overweight low-probability gains) with one \( r(p) \).

  ### 5. **Key Takeaway for Your Reading Group**
  REU isn’t just a relabeling of EU. It’s a **different parameterization of risk attitudes**:  
  - EU: Risk aversion via curvature of \( U \) (outcome sensitivity).  
  - REU: Risk aversion via curvature of \( r \) (probability sensitivity).  

  They coincide for binary choices but diverge in richer gambles violating Independence. This isn’t just philosophy—it’s mirrored in behavioral economics (Kahneman-Tversky’s Prospect Theory uses probability weighting).

  ### For Next Week’s Meeting
  Throw this at your group:  
  > *"Suppose you prefer $\$50$ for sure over a 50/50 gamble for $\$0$/$\$100$. Under EU, you must prefer a 50/50 gamble of $\$50$/$\$100$ over a 50/50 gamble of $\$0$/$\$50$. Under REU, you might not. Who can show why?"*  

  (Answer: EU forces linearity in probabilities; REU allows preference reversals when worst outcomes change.)

  You’re not embarrassing yourself—you’re thinking like a physicist: demanding empirical distinguishability. Buchak’s work passes that test. Happy to provide more examples or math!
