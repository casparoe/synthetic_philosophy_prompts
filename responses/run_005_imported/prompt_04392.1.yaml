prompt: |-
  ok kind of a dumb rabbit hole but I've been rereading old Hanson posts on futarchy (the "vote on values, bet on beliefs" thing -- I think I first ran into it via Inadequate Equilibria, or maybe it was just years of Overcoming Bias comment sections, honestly can't remember). anyway I keep noticing the same 7-8 objections get trotted out every time futarchy comes up, but nobody ever actually weighs them against each other. some of these feel like they'd sink the whole project even under a best-case implementation, others feel more like mechanism-design annoyances you could patch with enough cleverness.

  here's my list, paraphrased from years of comment-section osmosis (crypto DAO people actually trying to build this stuff now, e.g. MetaDAO, run into versions of half of these too):

  1. Corruptible metric — whatever scalar becomes the official "national welfare" score turns into a Goodhart target the moment trillions in trades hinge on it.
  2. Plutocracy — trading takes capital, so the rich's "beliefs" dominate the market; it's one-dollar-one-vote wearing an epistemics costume.
  3. Cheap manipulation — anyone who cares more about which policy wins than about profit can just eat an expected loss to move the price, exactly on the questions people care most about.
  4. Thin conditional markets — most real policy questions won't draw enough informed traders on the branch that doesn't get chosen, so you never get a clean signal on what would've happened.
  5. Perverse scoring inside decision markets — if a trader expects policy A to win anyway, they can profit more from trashing B's price than pricing it honestly, since only the implemented policy actually gets scored.
  6. Existential risk gets discounted — decades-out bets don't attract patient capital, and bets don't pay out if civilization ends, so tail risk is structurally underpriced.
  7. Values and beliefs aren't actually seperable — the Tyler Cowen-ish objection that what people say they want is shaped by what they think is achievable, so "vote on values, bet on beliefs" smuggles in more of a values judgment than it admits.
  8. Legitimacy cost — even a perfectly accurate market might tank public buy-in, since voters no longer get a real say in which policy gets chosen, only in the abstract value function.

  can you sort these into a tier list by how damaging each one actually is to futarchy as a governance proposal? S tier = basically fatal, no known fix even in principle, down to D tier = real issue but a patchable engineering detail. answer as a JSON block like {"S": [...], "A": [...], "B": [...], "C": [...], "D": [...]}, using short labels (e.g. "plutocracy") for each item, then give me 1-2 sentences per item justifying where you put it.
reasoning: |-
  Okay, let me tackle this futarchy objection tier list. The user clearly has deep familiarity with the debate - they've even tracked crypto DAO implementations like MetaDAO running into these issues. 

  First I need to mentally group the objections by their nature. Some like "corruptible metric" and "values/beliefs inseparability" strike at the philosophical core, while "thin markets" feels more operational. The existential risk discounting seems uniquely structural to prediction markets.

  For S-tier, I'm considering "corruptible metric" as fundamentally unavoidable - any single welfare metric will distort under high stakes. "Values/beliefs inseparability" belongs there too since it challenges the whole conceptual foundation. Tyler Cowen would approve.

  A-tier should hold the critical but potentially mitigatable issues. "Plutocracy" is obvious - though maybe quadratic funding could help? "Cheap manipulation" seems equally severe for high-stakes decisions. "Existential risk discounting" feels A-tier because civilization-ending threats require different time horizons.

  B-tier contains serious but design-solvable problems. "Thin conditional markets" might be addressed with market makers. "Perverse scoring" could be fixed via scoring rules or synthetic equivalents. 

  For C-tier, "legitimacy cost" seems political rather than technical - societies might accept it if futarchy delivers results, like how independent central banks gained trust over time.

  The JSON format needs precise labeling. I'll use the user's shorthand terms consistently. Justifications should be punchy - one sentence per item where possible, never exceeding two. 

  Biggest dilemma is whether to bump "plutocracy" to S-tier. Ultimately keeping it in A because Robin Hanson himself has proposed mitigation ideas, however speculative. The corruption of metrics seems truly insoluble though - that's going straight to S.
answer: |-
  Here's the tier list of futarchy objections, sorted by severity:

  ```json
  {
    "S": ["corruptible_metric", "values_beliefs_inseparability"],
    "A": ["plutocracy", "cheap_manipulation", "existential_risk_discounting"],
    "B": ["thin_conditional_markets", "perverse_scoring"],
    "C": ["legitimacy_cost"]
  }
  ```

  **Justifications:**  
  - **S Tier (Fatal Flaws):**  
    - `corruptible_metric`: Unavoidable Goodharting when trillions depend on optimizing a single metric; no known way to design an incorruptible welfare function.  
    - `values_beliefs_inseparability`: Fundamentally undermines the core premise; if values/beliefs co-evolve, "voting on values" can't be isolated from feasibility judgments.  

  - **A Tier (Severe, Hard to Mitigate):**  
    - `plutocracy`: Markets inherently favor capital-weighted influence, replicating wealth inequality in policy outcomes.  
    - `cheap_manipulation`: Actors with non-financial motives (e.g., ideologues) can profitably distort prices on high-stakes decisions.  
    - `existential_risk_discounting`: Markets structurally undervalue long-term catastrophes due to time discounting and no-payout-if-extinct mechanics.  

  - **B Tier (Potentially Patchable with Design):**  
    - `thin_conditional_markets`: Could be alleviated via subsidies, market makers, or synthetic prediction instruments (though liquidity concerns persist).  
    - `perverse_scoring`: Mitigatable via scoring rules (e.g., LMSR) or requiring traders to take both sides of conditionals.  

  - **C Tier (Political/Implementation Hurdle):**  
    - `legitimacy_cost`: A social acceptance issue, not a technical flaw; could resolve if futarchy proves superior (like independent central banks).  

  **Key Insights:**  
  S-tier objections attack futarchy’s foundational assumptions, making them arguably fatal. A-tier issues are severe operational weaknesses but *might* be partially mitigated (e.g., quadratic funding for plutocracy). B-tier problems are mech-design challenges with plausible solutions. Legitimacy is "just" a adoption barrier.
