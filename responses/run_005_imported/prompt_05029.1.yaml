  Eleonore Stump shifts to a Thomistic view, focusing on love and union instead of penal substitution. Lewis might find this more coherent because it avoids the substitution problem altogether. Stump's approach changes the framework, so the issue of punishing an innocent doesn't arise. Lewis was open to alternative models if they better fit the intuitions about justice.

  The user's deeper need might be understanding whether Lewis's logical critique can be overcome or if the penal model is inherently flawed. They might also want clarity on which philosophical direction holds more weight. As a scientist, they appreciate structured arguments and evidence-based reasoning, so breaking down each position's strengths and weaknesses is key.

  Considering Lewis's analytical style, he'd probably see Craig's solution as not fully resolving the desert problem. Stump's alternative framework might be more appealing as it sidesteps the issue. However, Lewis might still question if Stump's model adequately addresses the concept of divine justice. Ultimately, he'd likely conclude that the penal substitution model remains problematic under his initial critique.
answer: |-
  Based on David Lewis's arguments and philosophical instincts in "Do We Believe in Penal Substitution?", it's highly unlikely he would have found William Lane Craig's defense convincing, and while he might find Stump's alternative *philosophically interesting*, he would likely see her move as an implicit admission that the core problem he identified with penal substitution is insurmountable within its own framework. Here's a breakdown:

  1.  **Lewis's Core Problem: Personal Desert is Non-Transferable:**
      *   Lewis meticulously argues that the fundamental difference between debt and punishment lies in the *desert* condition. For punishment to be just, it must be inflicted *on the person who deserves it*.
      *   As your robbery example illustrates, transferring the punishment to an innocent person doesn't satisfy justice; it compounds injustice. The guilty party still *deserves* punishment, and the innocent party *does not deserve* the suffering inflicted.
      *   **Key Lewis Quote:** "What matters for punishment is that the person punished be the person who deserves to be punished. That is the point of punishment... But what matters for debt is only that the debt be paid. It doesn't matter by whom."

  2.  **Why Craig's "Rescue" Wouldn't Work for Lewis:**
      *   **Vicarious Liability:** Lewis explicitly addresses and rejects this analogy. Vicarious liability (e.g., an employer paying a fine for an employee's action) works precisely because it *doesn't* typically involve *punishing an innocent substitute*. The employer pays a *financial penalty* (like a debt), not a prison sentence (punishment). The *guilty employee* might still face personal sanctions. Applying this to Christ involves the core problem: punishing the innocent (Christ) instead of the guilty (sinners). Lewis would argue Craig is misapplying the concept.
      *   **Imputed Guilt:** This is the crux of Lewis's skepticism. Can guilt/desert be *metaphysically transferred* like a financial debt? Lewis's entire essay suggests he finds this incoherent or unjust. *Desert* seems intrinsically tied to the agent who committed the wrongful act. Saying Christ is "imputed" with our guilt doesn't change the underlying fact that *we* committed the sins and deserve punishment, while *Christ* did not commit them and does not deserve punishment. Imputation looks like a legal fiction to Lewis, not a genuine transfer of desert that solves the justice problem. Punishing Christ based on imputed guilt still means punishing someone who is *not* the deserving agent.
      *   **Voluntary Substitution:** Lewis briefly considers this but finds it inadequate. An innocent person *volunteering* to be punished doesn't make the punishment *just* or *deserved*. It might be noble, but it doesn't satisfy the desert condition inherent in the concept of retributive justice. The deserving party (the sinner) remains unpunished.

  3.  **Lewis on Standing to Forgive:**
      *   Lewis argues that only the victim (or their legitimate representative) has standing to forgive an offense *against themselves*. God, as the ultimate aggrieved party in sin (since all sin is against God), *does* have standing to forgive sins *against Him*.
      *   **This is crucial:** Lewis suggests God could simply *forgive* sins without needing penal substitution. The problem with penal substitution isn't that God *can't* forgive; it's that the mechanism proposed (punishing an innocent substitute) *fails as a mechanism of justice* in a way that simply forgiving, or a debt-model payment, does not. Craig's defense tries to *justify* the substitution mechanism using legal concepts, but Lewis's argument is that those concepts *don't apply* to the core element of punishment – personal desert.

  4.  **Lewis and Stump's Move:**
      *   **Sympathy for the Motivation:** Lewis would likely appreciate Stump's move philosophically. He explicitly states that his argument *only* targets penal substitution theories that rely on a retributive justice model. He readily concedes that other models of atonement (Christus Victor, moral influence, etc.) might be immune to his critique. Stump's Thomistic, love/union-focused model falls squarely into this category.
      *   **Seeing it as Concession:** However, Lewis would almost certainly view Stump's abandonment of the penal framework not just as an alternative, but as an *admission* that the problem he identified with penal substitution is fatal. Her move says, "This model is so problematic we need a completely different paradigm." Lewis would see this as validating his core critique: that the penal substitution model, *on its own terms* (i.e., as a theory of retributive justice being satisfied by substitution), is logically or morally incoherent. Stump isn't *solving* Lewis's problem within penal substitution; she's *ditching* penal substitution because of problems like the one Lewis identified.

  5.  **Lewis's Likely Conclusion:**
      *   **Craig:** Lewis would argue Craig's mechanisms (vicarious liability, imputed guilt) fail to address the fundamental issue of *personal desert*. They attempt to legally or theologically *redefine* the situation, but they don't change the underlying reality that punishment is being inflicted on someone who doesn't deserve it, while the person who does deserve it goes free. This, for Lewis, remains the core injustice.
      *   **Stump:** Lewis would find Stump's alternative model philosophically coherent and immune to his specific critique *because it doesn't claim to be about retributive justice satisfied by punishing a substitute*. He'd likely see it as a viable path *away* from the problem he raised.
      *   **The Core Problem Endures:** Crucially, Lewis would maintain that *neither* approach resolves the problem *within the penal substitution framework itself*. Craig tries and fails to make substitution work for retributive punishment. Stump abandons the framework altogether. Therefore, Lewis's original argument stands: the concept of satisfying retributive justice by punishing an innocent substitute remains deeply problematic, if not logically impossible, on the grounds of personal desert. God can forgive, or atonement can work through other mechanisms (like Stump's), but the specific idea of penal substitution *as a satisfaction of retributive justice* doesn't hold water.

  **In short:** Based on his essay, Lewis would likely see Craig's arguments as clever but ultimately unsuccessful attempts to circumvent the non-transferability of desert. He would see Stump's move as a philosophically respectable alternative that implicitly concedes the force of his critique against the penal substitution model itself. His core problem – that retributive punishment inherently requires the suffering of the *deserving* agent – would remain unaddressed by Craig and rendered irrelevant (though not refuted) by Stump's shift in framework. He'd probably conclude that the penal substitution theory, as a model of justice satisfied, remains unconvincing.
