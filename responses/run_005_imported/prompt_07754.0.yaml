answer: |-
  That's a fantastic question, and your editor's take (Newton's alchemy analogy) is a common shorthand, but **it significantly flattens Sidgwick's story and misses a profound, intellectually coherent throughline connecting his ethics and his psychical research.** While the *outcome* of his investigations (finding no conclusive proof) might seem irrational *in hindsight*, the *motivation* and *methodology* were deeply rooted in his utilitarian philosophy and personal intellectual crisis. Here's why the "quirky footnote" framing is inadequate:

  1.  **The Foundational Crisis of Ethics & Religion:**
      *   Sidgwick's ethical project in *Methods* rigorously dissected moral intuitionism and found utilitarianism the most defensible system. However, he hit a devastating wall: **The "Dualism of Practical Reason."** He couldn't reconcile the rational pursuit of one's own happiness (egoism) with the rational pursuit of the general happiness (utilitarianism). Reason alone couldn't prove one should choose the latter over the former.
      *   This was compounded by his loss of orthodox Christian faith. Sidgwick saw traditional religion as providing a *practical* solution (via divine sanctions/rewards in an afterlife) to this dualism, motivating self-sacrifice for the greater good. Without God and immortality, the utilitarian imperative seemed psychologically unstable and rationally unsupported against egoism.
      *   **The Connection:** Proof of survival after death (the core goal of much early SPR work) offered a potential *secular, empirically verifiable* foundation for ethics. If consciousness survived, some form of post-mortem justice or consequence for actions *could* exist, providing the necessary motivation for altruism that pure reason could not. As Sidgwick himself put it, he sought "evidence pointing to the existence of a Being who shall have the power and the will to make up to us... for the limitations of the actual world." Psychical research wasn't about ghosts; it was about finding a rational basis for moral obligation.

  2.  **Utilitarianism Demands Empirical Investigation:**
      *   Sidgwick's utilitarianism demanded rigorous assessment of *facts* to calculate consequences. If a significant portion of humanity reported experiences (apparitions, telepathy, mediumistic communications) suggesting consciousness might transcend the brain and death, a utilitarian philosopher *must* investigate.
      *   Ignoring these widespread claims wouldn't be rational skepticism; it would be *irrational dismissal* of potentially world-altering data. As a seeker of truth, Sidgwick felt an obligation to examine phenomena that, if genuine, would have monumental implications for human welfare and the meaning of life – core utilitarian concerns.

  3.  **Methodological Rigor Applied Consistently:**
      *   This is key. Sidgwick didn't approach psychical research with credulity. He applied the same meticulous, critical, and systematic approach he used in ethics. The SPR was founded explicitly to investigate claims *scientifically* – to subject them to rigorous testing, expose fraud, and separate signal from noise.
      *   His famous "despair" came precisely *because* he applied such high standards. He desperately *wanted* proof, but the evidence consistently crumbled under scrutiny or remained frustratingly ambiguous. His "hobby" wasn't a lapse in judgment; it was an extension of his philosophical rigor into a domain he believed *required* it. He was essentially trying to falsify materialism and find empirical support for a postulate his ethics needed.

  4.  **Personal Anguish and Intellectual Honesty:**
      *   Sidgwick's quest was deeply personal. His inability to reconcile reason, ethics, and the absence of traditional faith caused him profound distress. Psychical research wasn't a whimsical diversion; it was a desperate, decades-long search for a solution to his core philosophical and existential dilemma.
      *   His admission of failure ("All is vanity, research as well as rest" after years of SPR work) speaks to the depth of his disappointment, not the triviality of the pursuit. It was the failure of a critical intellectual project, not a hobby.

  **A More Interesting Throughline for Your Piece:**

  Instead of "quirky footnote," frame it as **"The Utilitarian's Desperate Quest: How Henry Sidgwick's Ethical Crisis Drove the Scientific Search for the Soul."**

  *   **Core Argument:** Sidgwick's psychical research wasn't separate from his ethics; it was its logical, albeit ultimately unsuccessful, empirical extension. Faced with the "Dualism of Practical Reason" and the collapse of religious foundations for morality, he turned to rigorous empirical investigation in a last-ditch effort to find a rational, evidence-based justification for the self-sacrifice demanded by utilitarianism – proof of an afterlife where cosmic justice could prevail.
  *   **Highlight the Irony:** The ultimate rationalist was driven to investigate the seemingly irrational precisely *because* his rational system had a gaping hole that only something beyond the empirically observable (like an afterlife) could plausibly fill. His failure underscores the tragic tension within his own brilliant system.
  *   **Contrast with Newton:** Newton's alchemy was arguably a separate metaphysical/mystical pursuit alongside his physics. Sidgwick's psychical research was *integrally linked* to the core problem of his life's major philosophical work. It was an attempt to solve *Methods*' central failure.

  **Conclusion for Your Piece:**

  While Sidgwick found no proof, dismissing his psychical research as merely a "quirky footnote" or "irrational hobby" fundamentally misunderstands his intellectual journey. It was a serious, philosophically motivated, and rigorously conducted attempt to resolve the deepest problem in his utilitarian ethics. **It wasn't Newton's alchemy; it was Sidgwick's moonshot – a high-stakes, empirical gamble aimed at grounding morality in a potentially provable reality beyond death, born directly from the limitations he so honestly exposed in his own masterwork.** Framing it this way offers a far richer, more human, and philosophically coherent narrative about one of utilitarianism's greatest minds. It reveals the profound existential stakes behind the table-rapping and the depth of his commitment to finding truth, wherever it might lead – even if it led him, ultimately, to despair.
