  On metaethical labeling: "Relativist" is indefensible. Quine stresses cross-cultural commonalities in morals (unlike radical linguistic variation) and roots values in innate human capacities. The student's analogy to theoretical underdetermination ignores Quine's emphasis on constraints from shared human nature. 

