  The committee voted separately on research and teaching, both got majority yes, but when voting on tenure directly, majority said no. The chair called it a discursive dilemma. The user wants to argue for issue-by-issue voting (premise-based) over direct voting on the conclusion (conclusion-based). The main objection is that premise-based can lead to a tenure grant that no individual member supports. 

  First, I need to explain why premise-based is better despite this. The key points are rationality, fairness, and procedural integrity. Premise-based ensures that decisions are based on established criteria, preventing ad hoc outcomes. It respects the committee's collective judgment on each requirement. Also, bylaws define tenure as meeting both criteria, so the premises are necessary. 

  The objection about forcing a verdict no one endorses is valid but can be mitigated. Emphasize that individual members might have different reasons for their votes, but the committee's role is to aggregate judgments on specific criteria. Highlight that conclusion-based voting can ignore the criteria, leading to arbitrary denials. 

  Also, mention that premise-based avoids hidden vetoes. In conclusion-based, a minority could block tenure even if criteria are met. Stress that the committee's duty is to apply bylaws objectively. The no-individual-support scenario is rare and stems from differing rationales, not procedural flaws. 

