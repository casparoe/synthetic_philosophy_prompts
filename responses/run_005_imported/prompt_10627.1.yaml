prompt: |-
  So I'm about two-thirds into a novel set at Trinity College, Cambridge in the 1670s and 80s, following a fictional young fellow who slowly figures out that his famous, difficult colleague down the corridor is hiding something a lot stranger than alchemy. Alongside the book I run a little side-project podcast where I get historians on to keep me honest about the research, and next month's guest is a historian of science who's spent years in the actual manuscripts -- the Keynes and Yahuda papers -- working on Newton's private theology. I really don't want the episode to just be "did you know Newton secretly rejected the Trinity," because at this point everyone who's read a Newton biography already knows that much, and I'd rather not waste her time or mine going over it again.

  Could you draft me 8-10 interview questions that actually push into the specifics? I want at least one question that presses on whether "Arian" is even the right label for what he believed (I've run into pushback on that from people who study this closely), one on how he managed to hold his fellowship for over thirty years without ever formally subscribing to the Thirty-Nine Articles, one on the "Two Corruptions of Scripture" manuscript and what his actual textual argument against 1 John 5:7 was, and one connecting the theology to the physics -- specifically whether the "dominion" language in the General Scholium is doing real anti-trinitarian work or whether that's reading too much into a few careful sentences. For each question, give me a follow-up keyed to the answer a careful historian would probably actually give, so the questions can catch her if she tries to flatten any of this back into the version of the story everybody already knows. My writing group keeps telling me nobody wants forty pages of seventeenth-century biblical criticism in a novel about a physicist, and maybe their right, but the gap between what he said in public and what he actually believed is kind of the whole book to me.
