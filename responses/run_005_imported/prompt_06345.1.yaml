answer: |-
  ## Dockside Debate: The Sea Battle of Tomorrow

  **Setting:** A chilly, windswept harbor on the eve of a planned naval engagement. Torches flicker, illuminating the frantic loading of ships – barrels of pitch, bundles of arrows, grim-faced sailors. **ALEX** (Ockhamist - Bivalence) leans against a bollard, watching. **SAM** (Open Future - Denies Bivalence) paces nervously nearby.

  **ALEX:** (Sighs, gesturing at the ships) Look at them, Sam. All this effort, all this *purpose*. Yet you insist that the proposition “There will be a sea battle tomorrow” is neither true nor false right now? That seems… disconnected from the reality unfolding before us. The preparations *are* real. The commanders' *intentions* are real. Why shouldn’t the truth about tomorrow reflect that current state of the world?

  **SAM:** (Stops pacing) Because the world *isn’t* finished, Alex! Those intentions could change. A storm could blow in overnight. A messenger could arrive with an unexpected truce. The *fact* of the battle tomorrow isn’t part of the world *yet*. Saying it’s already true feels like carving tomorrow’s date onto a gravestone tonight. It pretends the future is as fixed as the past. But it’s not. There’s genuine contingency here. Choice matters. If it’s already true, what room is left for the admiral to *actually choose* differently tomorrow morning?

  **ALEX:** Choice? Of course choice matters! But choice operates *within* the framework of what *will* happen. The admiral’s deliberation tonight, the factors weighing on him – *those* are part of the current reality that makes the future proposition true or false *now*. Saying “It’s true he *will* choose to fight” doesn’t negate his choice; it accurately describes the trajectory the world is on *because* of his impending choice and all the current conditions. Truth isn’t a cage; it’s a description. Saying “It will rain tomorrow” is true tonight because of the current atmospheric pressure, humidity, wind patterns – *not* because rain is magically inevitable regardless of physics. Similarly, the battle proposition’s truth value depends on the current state of the fleet, the orders, the weather forecast, the admiral’s resolve *as it exists now*.

  **SAM:** But that’s just pushing the problem back! If the *current* state of the admiral’s resolve *makes* the future proposition true… isn’t *that* resolve itself contingent? Couldn’t he have a sudden change of heart *after* this very moment? If his current resolve makes “He *will* fight” true *now*, then his future change of heart becomes impossible! You’ve locked him in *with* the truth value. That’s necessity sneaking in the back door. My view avoids that: the proposition simply *has no truth value* yet because the event it describes hasn’t crystallized. It’s indeterminate, like a quantum superposition. Saying “It might happen, it might not” captures the *actual* openness.

  **ALEX:** And what about the past, Sam? Is the proposition “There *was* a sea battle yesterday” neither true nor false *today*? Of course not! It’s settled. Why is the future different? Both are temporal locations. If you deny bivalence for future contingents, you’re carving a weird asymmetry into time itself. Truth becomes… time-dependent in a fundamental way. That seems messier than accepting that truth values can be fixed by states of affairs that haven’t fully played out yet. The admiral *can* change his mind *tomorrow* – but if he *does*, then the proposition “He will fight” was simply *false all along*, based on the *actual* trajectory that unfolded, which included his change of heart. Truth tracks the *actual* future, not some hypothetical alternative.

  **SAM:** The past *is* different! It’s fixed. Its events are completed, unchangeable. The future is *unfixed*; its events are potential, unactualized. That *is* a fundamental asymmetry! Denying it is what’s messy. And your “actual future” – how is that defined *now*, before it happens? It feels circular. You say the proposition is true *now* because the *actual* future holds a battle. But what *makes* that future the actual one? If it’s already true, then only *that* future is possible – the others are just illusions we entertain. That drains contingency of all meaning. My “indeterminate” *is* the recognition of those genuinely possible futures. And it’s not messy; it’s precise: propositions about specific, non-necessary future events lack a truth value until the conditions resolve.

  **ALEX:** But Sam, *your* view drains meaning too! If I say, “Bet me a gold coin there *will* be a battle tomorrow,” what are we betting *on*? If the proposition has no truth value, how can we ever settle the bet? We just wait and see? That reduces truth to mere reportage *after* the fact. Whereas I say the proposition *was* true (or false) all along; discovering it tomorrow is discovering a *pre-existing* fact. And necessity? It’s not “already true.” Necessity is about *could not be otherwise*. The battle *can* be true without being necessary. It’s true *because* of contingent factors – the admiral's free choice, the weather – factors that *could* have been different, making the proposition false. Truth and necessity are distinct. You conflate them.

  **SAM:** (Leans on the railing, watching the waves) Maybe I am wary of conflation. But your “pre-existing fact” about tomorrow feels like a ghost haunting the present. As for the bet… (turns to Alex) Would *you* bet with me right now? Seriously?

  **ALEX:** (Considers) Based on *this*? (Gestures at the loaded ships, the tense atmosphere). Absolutely. I’d bet heavily on “true.” The current evidence overwhelmingly points that way. It’s *very likely* true. For me, it *is* true.

  **SAM:** And I… wouldn’t bet. Not because I think it won’t happen, but because I think the outcome genuinely isn’t settled *yet*. Betting feels like pretending the dice have landed while they’re still in the air. I’d assess the *probability* – high, very high – and act accordingly (maybe not loading my own ship!). But I wouldn’t claim to know a *truth* that doesn’t yet exist. My caution *is* my recognition of contingency.

  **ALEX:** And my bet *is* my recognition of a truth grounded in the present reality. We see the same ships, the same tension. We likely agree on the overwhelming probability. We’d both advise the admiral the same way. We’d both board the ships tomorrow expecting a fight.

  **SAM:** (Nods slowly) True. So… is this just a difference in how we *talk* about time and truth? A metaphysical preference? Does it change anything on these docks tonight?

  **ALEX:** (Pauses, watching a sailor struggle with a heavy crate) Maybe… and maybe not. If I’m right, the admiral’s choice tomorrow is the culmination of a truth already set in the fabric of *now*. If you’re right, his choice is a genuine act of creation, bringing a new truth into being. One feels like discovery, the other like authorship. Both try to respect contingency and avoid fatalism. Perhaps… perhaps the difference lies in what we think reality *is* beneath the events – a tapestry already woven, or one being woven stitch by stitch. The fleet sails tomorrow either way. But the weight of that “will”… that’s where we stand on different ground. Pass me that rope?

  **SAM:** (Hands Alex the rope, a faint smile) Just don’t say it *was* inevitable I’d hand it to you. Some choices are still mine to make. At least… for now.
  **(They both turn back to watch the final preparations under the torchlight, the philosophical tension lingering like the salt in the air, unresolved but perhaps less urgent than the tangible reality of the ships.)**
