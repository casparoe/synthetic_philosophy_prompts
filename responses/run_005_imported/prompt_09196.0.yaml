answer: |-
  Your discomfort reveals something important about moral integrity - and your buddy's view, while practical, misses a deeper truth. Let's break this down:

  **Why your feelings make sense:**
  1.  **Intentions shape character:** While the *result* (the elderly woman sitting) is objectively good, *why* we act defines who we are becoming. Acting solely for external validation (impressing the girl) rather than internal values (compassion) feels hollow because it *is* hollow on a personal level. It wasn't kindness, it was performance.
  2.  **The "Moral Luck" Problem:** Your buddy's view relies on "moral luck" - you got lucky that your selfish motive accidentally produced a good outcome. If the girl hadn't been there, the old lady would have suffered. Relying on luck for good deeds isn't a reliable moral compass.
  3.  **Integrity Matters:** You sense a disconnect between the *appearance* of virtue and your *internal reality*. This gap creates cognitive dissonance. True integrity means aligning your actions with your values, even when no one is watching.
  4.  **Diminished Moral Value:** Philosophers like Kant argued an action only has full moral worth if done *purely* from duty/goodwill. Your act had *some* moral value (you noticed her need), but the primary motive diluted it significantly.

  **Where your buddy has a point (but it's incomplete):**
  1.  **Concrete Benefit is Real:** The old woman *did* get to sit. That tangible relief matters immensely, regardless of why it happened. Focusing solely on motive can sometimes ignore real-world suffering.
  2.  **Mixed Motives are Human:** Very few acts are 100% pure. We often do good things for a mix of reasons (duty, empathy, desire for approval, avoiding guilt). Your awareness of the mix is actually a sign of honesty.

  **The core issue isn't the outcome, it's your character development:**
  *   **The good news:** You *did* notice the woman's discomfort. That spark of empathy was real, even if it wasn't the main driver. That spark is the seed of genuine compassion.
  *   **The challenge:** You chose to act on that spark *only* because of an external reward (the girl's potential approval). The "weird feeling" is your conscience urging you to nurture that spark for its own sake next time.

  **What to do with this feeling:**

  1.  **Acknowledge the Complexity:** Don't beat yourself up, but don't dismiss your unease either. It's a signal worth paying attention to.
  2.  **Learn from it:** Use this as motivation. Next time you see someone in need, try acting *because* you see their need, not for an audience. See how it feels different.
  3.  **Separate Act from Actor:** The *act* of giving the seat was good. The *primary motive* behind *your specific action* in that moment was self-serving. Both can be true.
  4.  **Focus on Cultivating Intrinsic Motivation:** Practice small acts of kindness anonymously or when no one is watching. Notice the internal satisfaction of doing good simply because it's right.

  **In short:** Your buddy is right that the outcome mattered to the elderly woman. But *you* are also right that the reason matters profoundly for your own moral growth and sense of integrity. The discomfort you feel isn't about ruining the past act; it's a call to align your future actions more closely with genuine compassion. That feeling is actually a sign of a developing conscience, not a failing. Honor that feeling by letting it guide you toward acting from a place of authentic kindness next time.
