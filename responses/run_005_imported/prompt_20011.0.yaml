  I vaguely remember reading that the same kind of asymmetry turns up in other judgments too, not just whether something counts as "intentional" -- stuff like whether someone "caused" an outcome or "knew" it would happen -- but I can't recall the details and don't have access to the papers right now. Could you invent a brand-new vignette (not the chairman, not the environment) that should trigger a similar asymmetry in one of those other judgments instead, ideally set in an AI or algorithmic-decision context since that's closer to my actual beat, and then walk me through why the moral valence of the side effect ought to skew that particular judgment the way it does? I'd also want you to be upfront about how much of that is a real, tested result versus you extrapolating from the general pattern.
