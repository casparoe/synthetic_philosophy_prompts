    "C": ["Structuralist accounts (Sneed-Stegmüller theory-nets)"],
    "D": ["Naive content comparisons (unpatched Popperian)", "Skeptical surrender (Miller's language-dependency critique)"]
  }
  ```

  ### Tier Explanations:
  **S-Tier (Most defensible/active research):**  
  Likeness approaches (Niiniluoto/Oddie) dominate current literature. They measure "closeness" using formal distance metrics between theories' models and truth, avoiding Tichý-Miller problems through weighted feature comparisons. Defensible because they mathematize intuitive notions of similarity. Your philosopher would likely obsess over these.

  **A-Tier (Respected but niche):**  
  Schurz-Weingartner's consequence-based fix filters irrelevant logical content (e.g., avoiding "p ∨ ¬p" truisms). Solves Miller's disjunction problem but requires syntactic constraints that some find artificial. Great for heated debates about whether elegance compromises realism.

  **B-Tier (Promising but contested):**  
  Epistemic approaches tie truthlikeness to evidence responsiveness (Kuipers) or expected accuracy (Bayesian). Defensible for practical scientific progress but accused of conflating truth with justification. Perfect for your character's cynical students advocating pragmatism.

  **C-Tier (Marginal/outdated):**  
  Structuralist accounts embed verisimilitude in theory-nets' empirical claims. Historically significant but faded post-1980s due to metricization problems. Useful for nostalgic colleagues clinging to "elegant" abandoned frameworks.

  **D-Tier (Indefensible):**  
  - *Naive Popperian:* Directly compares true/false consequences (imploded by Tichý's 1974 weather paradox).  
  - *Skeptical surrender:* Miller's 1974 language-relativity argument claiming all metrics are arbitrary. The "burnout accelerator" position.  

  ### Narrative Use:
  - **S vs. A** fuels core drama: Likeness advocates (S) clash with Schurz-Weingartner purists (A) over whether similarity metrics beat consequence-filtering.  
  - **B** invites generational conflict: Older philosopher scoffs at probabilistic "compromises" while students embrace them.  
  - **D** provides backstory wounds: Miller's critique (D) is the original career-destroying counterexample; unpatched Popperianism (D) is the failed hill your character died on.  

  Key historical beats: Tichý (1974) destroyed Popper's original account; Miller (1974) generalized the attack; Niiniluoto (1987) revived the field with likeness metrics; Schurz-Weingartner (1987/2010s) offered the leading content-based alternative.
