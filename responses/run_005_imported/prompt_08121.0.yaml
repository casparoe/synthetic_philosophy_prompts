    "proposed_solution": {"score": "x/7", "comment": ""},
    "assessment": {"score": "x/3", "comment": ""},
    "total": "x/20",
    "letter_grade": ""
  }

  please actually check the substance and not just whether it reads fluently, its a philosophy exam not a writing sample.
