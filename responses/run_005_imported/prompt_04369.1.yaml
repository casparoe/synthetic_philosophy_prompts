answer: |-
  The port glowed ruby in crystal glasses, catching the last of the June twilight filtering through the Senior Common Room windows. The air hung thick with cigar smoke and the quiet murmur of post-prandial digestion. Elizabeth Anscombe sat upright, her gaze fixed on the middle distance, radiating an intensity that seemed to hold the comfortable armchairs at bay. Gerald Fenwick, swirling his port with an air of weary concern, finally broke the uneasy silence that had fallen around them after the others had drifted away.

  "Elizabeth," Fenwick began, his voice carefully modulated, "this business with Truman... it’s causing rather a stir. Unnecessarily so, in my view. To publicly denounce the University’s honouring of a wartime leader... it smacks of ingratitude, even a certain... parochialism."

  Anscombe turned her sharp eyes directly on him. "Gratitude, Gerald? For what? For murder? The degree honours actions. Truman ordered the deliberate killing of the innocent as a means to an end. That is murder. The degree should not be conferred."

  "Murder?" Fenwick leaned forward, his brow furrowed. "Elizabeth, be precise. Hiroshima and Nagasaki were military targets. War production hubs. The intention was to destroy Japan’s capacity to fight, to force surrender."

  "The *intention*," Anscombe countered, her voice low but cutting, "was to break the will of the Japanese nation by annihilating two cities. The bombs were dropped on city centres, Gerald. Not isolated factories. The *means* chosen was the mass killing of civilians – men, women, children, infants – to *achieve* the end of surrender. You cannot separate the act from its chosen instrument. Deliberately killing the innocent as a means to your end is murder. The definition holds."

  "‘Innocent’," Fenwick seized the word. "That’s a simplification bordering on naivety in the context of total war. Was the factory worker making munitions ‘innocent’? The farmer supplying the army? The bureaucrat administering the war machine? Japan was wholly mobilised. The very concept of a clear line between combatant and non-combatant dissolves when the entire nation is the engine of war. Were the women and children in Dresden ‘innocent’ when we firebombed them? Context matters."

  "It matters for judging *culpability*," Anscombe conceded, "not for defining the *act*. When we speak of ‘innocent’ in this prohibition, we mean simply ‘not currently engaged in harming’. The infant in its crib is not harming. The elderly woman in her home is not harming. They are *hors de combat*. To choose their deaths *as the method* to demoralize others or coerce a government is to use them as mere things, instruments. That is the essence of murder. Their connection to the war effort is irrelevant to the *moral structure* of the act performed *upon* them."

  Fenwick sighed, a sound of genuine frustration. "You erect an absolute prohibition that ignores the abyss we faced! The Pacific war was savagery incarnate. Okinawa showed what an invasion would cost – millions dead, Japanese and Allied. Was prolonging *that* slaughter moral? Truman ended the war, saved countless lives – Japanese lives included! – by making the terrible, necessary choice. Are you saying no cost is too high? That we must sacrifice a million young men on the altar of your absolute principle?"

  "The demand for unconditional surrender," Anscombe shot back, her pale cheeks flushing, "is precisely what created the apparent necessity for such methods! It closed off any path for Japan that didn't involve national suicide or utter humiliation. It forced the situation into a binary where monstrous choices seemed the only ones left. That initial demand bears its own moral burden. But even within that constrained frame, choosing *this* means – industrialised slaughter of non-combatants – was not necessary. It was chosen for its terrifying efficiency. And efficiency in killing the innocent doesn't cease to be murder."

  "‘Apparent necessity’? ‘Chosen for efficiency’?" Fenwick's voice rose slightly. "With respect, Elizabeth, that’s armchair generalship. We judge now, in peace, with the luxury of detachment. Truman judged then, under crushing responsibility, with imperfect intelligence, facing an enemy whose fanaticism defied comprehension. He weighed the immediate, horrific cost of the bombs against the projected, even more horrific cost of invasion. He chose the lesser evil. That *is* moral reasoning in the real world, not the seminar room. Your absolute banishes prudence, ignores consequence, and ultimately paralyzes action in the face of genuine evil."

  "It banishes *evil means*," Anscombe stated implacably. "A good end cannot be achieved by evil means. You cannot build peace on a foundation of murdered children. You call it prudence, Gerald. I call it consequentialism of the most dangerous kind – where *any* enormity can be justified by projecting a sufficiently dreadful alternative. It is the logic that leads to the abyss, dressed in the robes of necessity."

  Fenwick set his glass down with a sharp click. "And you, Elizabeth, retreat into a moral purity that would have left us helpless against the very forces we fought! Your principle, applied absolutely, condemns *all* modern warfare. It offers no path to victory, only to defeat or complicity in greater evil."

  The silence returned, deeper now, charged with mutual incomprehension. The port tasted suddenly acrid. Fenwick and Anscombe looked at each other across the gulf of mahogany and crystal, the comfortable room now a cage for their irreconcilable convictions.

  Fenwick spoke first, his voice weary but clear: "You mistake the terrible responsibility of choosing the lesser evil in a fallen world for moral bankruptcy."

  Anscombe met his gaze unflinchingly: "You mistake the abandonment of an absolute moral barrier for practical wisdom."
