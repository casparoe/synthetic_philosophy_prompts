prompt: |-
  So in my formal epistemology seminar we just covered Bertrands chord paradox - circle, random chord, and depending on whether you pick two random endpoints on the circle, a random point along a radius, or a random point anywhere inside the disk to be the midpoint, the probability the chord ends up longer than the inscribed equilateral triangle's side comes out to 1/3, 1/2, or 1/4. Prof also threw in van Fraassens cube factory thing - a machine makes cubes of unknown size, and being "indifferent" over the side length vs being indifferent over the volume gives you two different probabilities for the same event (like the side being under half the max length). I think I followed the mechanics of both but ngl I suspect I just memorized two cute examples without actually getting why this is a deep problem and not just a quirk of circles and cubes. Could you invent a totally new example with the same paradox structure, in some domain that has nothing to do with geometry or manufacturing? Lay out the two (or more) equally "natural" ways of applying the principle of indifference to the same random process, show they disagree on the probability of some specific event, and then tell me what you think it shows about whether indifference/uninformative priors can ever be non-arbitrary. Doesn't need to be super long, just want fresh material so I know I actually get the general problem.
