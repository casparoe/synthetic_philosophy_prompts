answer: |-
  Here’s a rigorous retributivist argument for punishing the failed attempt identically to the completed murder, systematically dismantling common objections while exposing their hidden consequentialism. Your judge’s opinion could unfold like this:

  **The Core Retributivist Principle: Desert Resides in the Will**
  > "Justice demands punishment proportionate to *moral culpability*. Culpability is measured by the *conscious choice* to inflict wrongful harm – the quality of the will. The defendant who sights her victim, calculates the shot, and pulls the trigger *chooses* to end a life. Her will is fully formed; her commitment to the evil act is complete. The subsequent mechanical failure – unknown and uncontrollable by her – is irrelevant to her *desert*. She manifested the same malignant intent, the same rejection of another’s humanity, as the successful murderer. To punish her less is to declare that justice cares not only about the choices we make, but about the vagaries of chance. Retribution cannot abide such caprice."

  **Engaging and Refuting Objections:**

  1.  **Objection: Harm is Constitutive of Desert (Not Merely Evidentiary)**
      *   **Argument:** "Completing the harm *changes* the moral nature of the act. The successful murderer has *actually* destroyed a life; the attempter has not. This actualized harm is an intrinsic part of the wrong deserving punishment. The completed murderer deserves more punishment because she *did* more moral wrong."
      *   **Judge's Retributivist Rebuttal:**
          *   **The "Moral Wrong" Resides in the Choice:** "The core moral wrong is the *deliberate choice* to inflict death. This choice was identical in both cases. The harm *realized* is a consequence *of that choice*, but it is not a *further choice* made by the agent. Retribution looks backward to the actor's *guilty mind and will*, not forward to the consequences she luckily caused or didn't cause. To claim that the *result* retroactively changes the *quality of the will* is to confuse ontology with epistemology. Her will was fixed at the moment she pulled the trigger with murderous intent."
          *   **The Consequentialist Core:** "This argument smuggles in consequentialism. Why is *causing the harm* intrinsically worse for *desert*? It appears worse because:
              *   It causes more *social disruption* (a consequentialist concern).
              *   It *feels* more grievous to victims/society (an emotional/social consequence).
              *   It represents a greater *risk realized* (but the risk *taken* was identical!).
              The emphasis on the *realized harm* as constitutive shifts the focus from the actor's *blameworthiness* to the *outcome's severity* – a hallmark of deterrence or victim satisfaction, not pure desert. The retributivist asks: 'How evil was her *choice*?' The 'harm-constitutive' view asks: 'How much damage did her choice *cause*?' Only the former is consistent with desert alone."

  2.  **Objection: The Completed Act Individuates a Different Crime**
      *   **Argument:** "Attempted murder and completed murder are legally and morally distinct offenses. The *actus reus* differs fundamentally: one involves causing death, the other involves a substantial step towards death that fails. This difference in the *act itself* justifies different punishment levels, reflecting distinct levels of moral transgression."
      *   **Judge's Retributivist Rebuttal:**
          *   **The Will is the Act's Moral Core:** "The *physical* act is merely the vehicle for the *will*. The morally relevant 'act' is 'the intentional attempt to kill.' Both defendants performed *this* act. The rifle jamming is no more a part of the first defendant's *action* than a sudden gust of wind diverting a bullet is part of the second defendant's action. It is an *external interruption*. To define the act based on its *successful outcome* is again to let result define desert."
          *   **Individuation by Outcome is Luck-Dependent:** "If the defining characteristic of the 'completed murder' act is the *result* (death), then the *classification of the act itself* becomes dependent on luck. Two individuals perform identical intentional actions (pulling the trigger on a sighted rifle), but one commits 'Attempt' and the other commits 'Murder' solely due to factors beyond their control (gun mechanics). This makes the *label and severity* of their crime a function of fortune, not their moral agency. Retributivism cannot accept that the *degree of moral wrong* we assign depends on cosmic dice rolls."
          *   **The "Dangerous Act" Dodge:** "One might argue the completed murderer performed a 'more dangerous' act. But this is false. Both performed acts with *identical* intent and *identical* perceived risk at the moment of action. The first defendant's act was just as dangerous *ex ante*; it failed only due to an external, unforeseeable intervention (sabotage). Judging dangerousness *ex post* based on the outcome again prioritizes result over intent and the inherent risk *chosen*."

  3.  **Objection: Sentencing Reflects "Objective Attribution"**
      *   **Argument:** "Punishment reflects not just the guilty mind (*mens rea*), but also the attribution of the *harm* to the agent. The completed murderer has the death objectively attributable to her will in a way the attempter does not. This objective fact deepens her culpability."
      *   **Judge's Retributivist Rebuttal:**
          *   **Attribution of *What*?** "We attribute the *harm* to her. But retributivism cares about attributing *blameworthiness*, not harm. The blameworthiness for *intending and trying* to cause the harm is complete upon the attempt. Attributing the *harm itself* as a separate source of blameworthiness implies she is morally responsible for events *after* her agency ceased – namely, the absence of external interference. This is nonsensical. Her responsibility is for her *actions and intentions*, not for the universe cooperating with her malice."
          *   **The Victimhood Conflation:** "This view subtly incorporates the victim's perspective and suffering. The completed murderer *caused* suffering; the attempter did not (in that specific instance). Punishing the completed crime more severely acknowledges this suffering. But while acknowledging harm is vital for closure and societal healing (consequentialist/restorative goals), it is distinct from the *desert* owed by the offender *for her own choices*. Pure retribution focuses solely on the offender's culpable state of mind and action, not the victim's outcome."

  **Conclusion: Luck and the Illusion of Justice**
  > "A consistent retributivist must conclude that the defendant in *State v. [Attempted Murderer]* deserves punishment identical to that imposed in *State v. [Successful Murderer]*. The disparity in their sentences is a monument not to nuanced justice, but to the law's surrender to *resultant moral luck*. We punish the successful murderer more harshly because we recoil more viscerally from the realized harm, because society demands greater vengeance for actual death, and because we hope (perhaps futilely) that the threat of greater punishment deters completed acts more than attempts. These are consequentialist impulses – understandable, perhaps even practically necessary, but fundamentally *alien* to the retributive principle this Court has long championed.
  >
  > To punish based on outcomes is to declare that two individuals, identical in motive, planning, intent, and final decisive action, are morally different agents because one's gun jammed. It makes desert hostage to fortune. If punishment is truly justified by desert alone – by the evil will manifested in choice – then we must have the courage to punish the will equally, regardless of the universe's indifference. To do otherwise is to confess that our commitment to retribution is less pure than we profess, tempered by an unacknowledged deference to consequences and chance."

  **Why This Works for Your Novel:**

  1.  **Internal Consistency:** It rigorously applies the judge's stated philosophy (desert = choice/will) to its logical conclusion.
  2.  **Engages Sophisticated Counterarguments:** It doesn't shy away from the "harm constitutive" or "act individuation" views, showing *why* they fail under strict retributivist scrutiny by revealing their hidden consequentialist or luck-dependent foundations.
  3.  **Highlights the Tension:** It makes the conflict between philosophical purity and practical legal tradition stark and dramatically compelling. The judge is forced to confront the uncomfortable implications of her own beliefs.
  4.  **Provides Character Depth:** Writing this opinion forces your judge into a moment of profound intellectual honesty, potentially isolating her from colleagues who prefer comfortable compromise. It shows the cost of rigor.
  5.  **Uses Legal/Philosophical Language Authentically:** It employs terms like *actus reus*, *mens rea*, ex ante/ex post, resultant luck, and core retributivist concepts correctly and powerfully.
  6.  **Avoids Hand-Waving:** It provides a substantive argument, not just an assertion about "luck being a problem."

  This reasoning provides the rigorous philosophical backbone your judge needs to deliver a powerful, thematically resonant opinion that challenges both the fictional court and your readers.
