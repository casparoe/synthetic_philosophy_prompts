  But how do we know that the positive one is chosen? And how does Löb's theorem come in?

  The actual reasoning uses Löb's theorem. Here's how:

  We want to show that both FairBots cooperate, i.e., that C holds.

  Consider from the perspective of FairBot A. It will cooperate if it can prove that B cooperates. But note that B is running the same program, so B will cooperate if and only if B can prove that A cooperates.

  Therefore, the condition for A to cooperate is that A can prove that B will cooperate. But B's cooperation condition is that B can prove that A cooperates.

  So, A is trying to prove: "B can prove that A cooperates" (which is □_B C_A, but note that by symmetry we can collapse).

  Alternatively, we can write:

     C_A  <=>  □_A C_B
     C_B  <=>  □_B C_A

  But because the programs are identical and the formal system is the same, we can identify the provability predicates □_A and □_B with the same □ (if we assume that both are using the same formal system and that the system can reason about both programs). Moreover, by symmetry, we hope that C_A = C_B.

