  We are discussing the use of Löb's theorem in the context of FairBots for the Prisoner's Dilemma in program equilibrium. The key point is that without a formal system for proofs, we might get an infinite regress. But with the use of provability in a fixed formal system, Löb's theorem ensures that the mutual cooperation is achieved.

  Let me try to break it down:

  1. The naive idea: Each program tries to cooperate if and only if the other cooperates. But then:
     - Program A: I will cooperate only if B cooperates.
     - Program B: I will cooperate only if A cooperates.
     This leads to a circular dependency and no clear outcome (or an infinite regress when trying to simulate).

  2. The FairBot solution: Each program (say, FairBot A) cooperates if and only if it can prove (in a fixed formal system F) that the other program (FairBot B) cooperates with it.

     Similarly, FairBot B cooperates if and only if it can prove (in F) that FairBot A cooperates.

  3. The problem: How do we break out of the circle? We need to show that both FairBots will indeed find a proof of the other's cooperation and hence cooperate.

  4. Löb's theorem: It states that for any statement P in the formal system F, if F proves "if F proves P then P", then F proves P.

     In symbols: If F ⊢ □P → P, then F ⊢ P, where □P is a formula that expresses "P is provable in F".

  How is Löb's theorem applied here?

  Let P be the statement "FairBot B cooperates with FairBot A". We want to show that FairBot A will prove P and then cooperate. Similarly for B.

