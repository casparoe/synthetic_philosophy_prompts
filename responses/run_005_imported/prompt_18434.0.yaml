  Now, Löb's theorem is about statements of the form □P → P. How does that relate?

  Consider the following: We wish to show that C is provable in F. Note that the FairBot program is defined so that:

     C  ↔  □C

  But we can split this into two implications:

     (1) C → □C
     (2) □C → C

  The first implication (1) says that if C is true then it is provable. This is a form of completeness, which we cannot generally assume in F (because of Gödel). The second implication (2) says that if C is provable then it is true.

  But note: (2) is exactly the premise of Löb's theorem for C! That is, if we can prove in F that □C → C, then Löb's theorem tells us that we can prove C in F.

