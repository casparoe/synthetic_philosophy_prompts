  Here's a joke designed for your mereology students, hitting the specific absurdities of the SCQ positions:

  **The Setup:**
  A Nihilist, a Universalist, and Peter van Inwagen walk into a philosophy classroom. They see a student nervously studying at a table.

  *   **The Nihilist** points: "See that? It's not *really* a table. It's just fundamental particles *arranged tablewise*."
  *   **The Universalist** scoffs, grabbing a nearby taxidermied trout and a plastic turkey: "Nonsense! Composition is unrestricted! *This* is just as real!" (He slams the trout and turkey together). "Behold, the Trout-Turkey! And *that*..." (he gestures wildly around the room) "...is the Trout-Turkey-Table-Student-Chalkboard-*Whole-Damn-Neighborhood*!"
  *   The student looks horrified, clutching their coffee cup like it might spontaneously fuse with their textbook.
  *   **Peter van Inwagen** calmly steps forward, adjusting his glasses. "Gentlemen, please. Composition occurs *only* when there is *life* binding the parts."
  *   Just then, the student's overstuffed backpack slides off the table with a crash. The student gasps: "Oh no! My table!"
  *   Van Inwagen turns to the Nihilist and smiles serenely: "Precisely. Don't worry. According to my criterion... **it was never alive to begin with.**"

  **Why it works (for the initiated):**

  1.  **Nihilist's Line:** Directly uses the "arranged F-wise" locution to deny the table's existence as an object.
  2.  **Universalist's Line:** Name-drops the infamous "trout-turkey" and demonstrates unrestricted composition by creating one on the spot, then escalates to the "whole neighborhood," referencing the maximal universal object/arbitrary fusions.
  3.  **Student's Reaction:** Embodies the intuitive discomfort with both extremes – nihilism robs us of ordinary objects, universalism drowns us in absurd ones.
  4.  **Van Inwagen's Entrance:** Clearly states his core life-restriction thesis.
  5.  **The Punchline ("it was never alive to begin with"):**
      *   **Turns on Van Inwagen's Criterion:** The table breaking prompts the student's lament. Van Inwagen interprets "My table!" as an existential claim. His theory *only* grants composite existence to living things. A table isn't alive.
      *   **The Humor:** He delivers the devastating ontological verdict ("it never existed as a composite object") with perfect, calm logic, offering cold comfort to the distressed student. It highlights the *restrictive* consequence of his view for ordinary artifacts like tables.
      *   **Nihilist's Relief (Implied):** Van Inwagen's statement, while differing in reasoning, *coincides* with the Nihilist's denial of the table's existence, hence the smile towards the Nihilist.

  **Delivery Tips:**

  *   Emphasize the Universalist's manic energy as they create the trout-turkey and gesture wildly.
  *   Play Van Inwagen as utterly calm, logical, and slightly pedantic.
  *   The punchline lands best with a slight pause after "Precisely. Don't worry." Then deliver the final line with serene certainty.
  *   The student's "Oh no! My table!" should sound genuinely distressed.

  This joke requires knowing the specific arguments and examples (trout-turkey, arranged tablewise, life criterion), making it perfect insider humor for your mereology class. Good luck!
