answer: |-
  When dividing the $80,000 from the competitor's offer for your combined inventory and customer list, the key is to base the split on a reasonable disagreement point that reflects what each of you can achieve if no agreement is reached. Let's break this down step by step to evaluate your approaches and find a fair solution.

  ### Understanding the Disagreement Point (BATNA)
  - If you and your partner cannot agree on the joint sale, the outcome isn't just keeping your separate inventories (worth $10,000 to you and $4,000 to her). Instead, as rational actors, you would both choose to sell your shares separately, since that yields a better outcome for each of you.
  - Your best alternative to a negotiated agreement (BATNA) is selling separately: you can get up to $50,000, and she can get up to $20,000. This sets the minimum each of you should accept from the joint deal, as anything less would make walking away more attractive.
  - The combined value of your BATNAs is $70,000 ($50,000 + $20,000). Since the competitor is offering $80,000 for the combined assets, the surplus from cooperating is $10,000 ($80,000 - $70,000). This surplus arises from the synergy of selling the customer list and inventory as a whole, which is more valuable than the sum of the separate parts.

  ### Evaluating Your Partner's Approach
  - Your partner proposes splitting the surplus above the "fallback" amounts (keeping inventory) equally. The fallback values are $10,000 for you and $4,000 for her, totaling $14,000. The surplus above this is $66,000 ($80,000 - $14,000), and an equal split would give each of you $33,000 from the surplus. Thus:
    - You get $10,000 + $33,000 = $43,000.
    - She gets $4,000 + $33,000 = $37,000.
  - **Why this is unreasonable**: This approach ignores your actual BATNAs. Your $43,000 is below your $50,000 outside option, meaning you would reject this split because you can do better by selling alone. It unfairly penalizes you for having a higher-value BATNA and lower storage costs, while overcompensating her. The fallback values are irrelevant here because they don't reflect what you would realistically do if the joint deal falls through.

  ### Evaluating Your Approach
  - You propose that each should get a share reflecting how close you can get to your "best-case" numbers ($50,000 for you, $20,000 for her). This is vague, but it likely means splitting the $80,000 in proportion to your individual best-case values.
