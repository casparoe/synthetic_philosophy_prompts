  - **Why this is reasonable but incomplete**: This accounts for your stronger outside options and the fact that you contribute more value individually (e.g., through your buyer contacts). However, it doesn't directly address the $10,000 synergy surplus from the joint sale. The proportional split gives you a larger absolute gain ($57,143 vs. $50,000 BATNA) and her a smaller one ($22,857 vs. $20,000 BATNA), which might be seen as unfair since the surplus comes from combining assets, not individual efforts.

  ### A Better Approach: BATNA-Based Equal Surplus Split
  The most reasonable method is to:
  1. **Use your BATNAs as the disagreement point**: This ensures each of you gets at least what you can achieve alone ($50,000 for you, $20,000 for her).
  2. **Split the synergy surplus equally**: The $10,000 surplus (from the $80,000 offer minus the $70,000 BATNA total) is divided equally, as it results from the joint customer list and should be shared fairly. This means each of you gets $5,000 from the surplus.
  3. **Final split**:
     - You get $50,000 (BATNA) + $5,000 = $55,000.
     - She gets $20,000 (BATNA) + $5,000 = $25,000.

  **Why this is better**:
  - **Fairness**: Both of you gain equally in absolute terms ($5,000 each) from cooperating, which rewards the joint effort. This is consistent with the Nash bargaining solution, a standard fairness concept in negotiations, which splits the surplus equally when players are symmetric (no major differences in risk or power are mentioned here).
  - **Practicality**: It ensures the deal happens because you both get more than your BATNAs (you get $55,000 > $50,000; she gets $25,000 > $20,000). Your partner's approach, in contrast, would cause you to walk away, losing the $10,000 synergy.
  - **Addresses your concerns**: Your idea of reflecting "closeness to best-case" is incorporated by using BATNAs as the baseline. The equal surplus split is simpler and avoids the potential unfairness of a proportional split, where she gains relatively less ($2,857 vs. your $7,143) despite the surplus being joint.

