  The third point: models disagree on OOD data. The user questions if this matters for underdetermination. Philosophically, underdetermination accepts that future evidence might resolve the ambiguity, so OOD divergence fits. It shows that current data isn't sufficient, which is the core idea. This distinction might actually support their argument.

