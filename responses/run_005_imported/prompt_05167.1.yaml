  Also, consider the bylaws. Since they don't mention donations, the committee has discretion. Highlighting the difference between coincidental timing and conditional timing is key. Precedent matters—how future donors might interpret this action. If the committee approves now, it could invite similar pressures, potentially leading to less deserving candidates in the future.

