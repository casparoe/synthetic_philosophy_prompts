  For limitations, I'm reminded of Kahneman's distinction between "experiencing self" and "remembering self" - what people do in the moment isn't necessarily what makes them satisfied later. And for alternatives, I should emphasize that surveys and churn metrics capture different dimensions that behavioral data misses.

