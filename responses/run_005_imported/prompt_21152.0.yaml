  Breaking it down: Mainstream Ptolemaic astrology relied on symbolic correspondences (planets=gods/qualities), directional influences (houses/aspects), and interpretive complexity (dignities, rulerships). Kepler guts all that. His keepers are: aspects (but redefined geometrically), planetary "character" (as empirical temperament triggers), and weather links (via light/heat physics). Everything else—zodiac signs, houses, dignities—he rejects as human inventions without physical basis. 

