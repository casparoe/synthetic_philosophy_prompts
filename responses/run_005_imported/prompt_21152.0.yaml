answer: |-
  You've nailed the core tension: Kepler wasn't just trimming Ptolemaic astrology; he was performing radical surgery, replacing its vital organs with entirely different mechanisms. His "astrology" was fundamentally a *physico-geometrical* theory of celestial-terrestrial interaction, using astrological language as a necessary scaffold. Here's the breakdown of his specific departures from mainstream practice and the nature of what remained:

  **Kepler's Radical Rejections & Why (The Thrown-Out):**

  1.  **The Zodiac Signs (as Qualities & Boundaries):**
      *   **Ptolemy:** Signs imbued specific qualities (fire/earth/air/water, cardinal/fixed/mutable, masculine/feminine) and defined rulerships, exaltations, etc. The *sign* a planet was in fundamentally altered its expression.
      *   **Kepler:** Utterly rejected. Saw them as arbitrary human divisions with no physical reality. "The Zodiac is a human invention, and the stars know nothing of it." He argued the actual *constellations* were irrelevant; only the ecliptic plane mattered as the path of planets and the Sun. Sign boundaries had zero physical significance.
      *   **Why:** No geometrical or physical mechanism could justify assigning qualitative differences based on arbitrary 30-degree segments. It was pure convention, not physics.

  2.  **The Houses (Angular Relationships to Horizon):**
      *   **Ptolemy:** The 12 houses governed specific life areas (1st=self, 2nd=wealth, 7th=marriage, etc.) based on their angular relationship to the Ascendant (eastern horizon). Planetary position *by house* was crucial for interpretation.
      *   **Kepler:** Completely discarded. Saw the complex house systems as elaborate nonsense with no basis in physics or geometry. The *angles* themselves (Ascendant, Midheaven, Descendant, IC) might have significance due to light intensity/refraction, but the 12 divisions were meaningless.
      *   **Why:** No physical mechanism could link arbitrary divisions of the sky relative to the *local* horizon to specific life themes. It was anthropocentric fiction lacking universal physical laws.

  3.  **Planetary Dignities, Rulerships, Exaltations, Detriments:**
      *   **Ptolemy:** Complex system where planets were "strong" or "weak" based on sign placement (e.g., Mars rules Aries, exalted in Capricorn, in detriment in Libra/Taurus).
      *   **Kepler:** Vehemently rejected as anthropomorphic fantasy. Saturn wasn't inherently "malefic" by nature; its effects stemmed from physical properties (distance, slowness, coldness).
      *   **Why:** Attributing inherent "joy" or "sorrow" to planets based on sign placement violated his mechanistic view. Planetary effects were constant physical properties, not variable based on symbolic rulerships.

  4.  **"Occult" Influences & Sympathetic Magic:**
      *   **Ptolemy & Mainstream:** Relied on concepts of planetary "influences" – quasi-spiritual or occult rays carrying specific qualities (Saturn = cold/dry, Mars = hot/dry) that directly affected sublunary matter and human temperament/events.
      *   **Kepler:** Explicitly rejected *any* immaterial, spiritual, or "occult" influence. He railed against "superstitious" astrologers who invoked spirits or non-physical forces. Effects *had* to be mediated by known physical principles.
      *   **Why:** Kepler demanded a mechanical, causal chain compatible with emerging physics. Occult forces violated his core scientific principle.

  **What Kepler Kept & How He Re-Engineered It (The Salvaged Core):**

  1.  **The Planets Themselves (as Physical Bodies with Properties):**
      *   **Kept:** The Sun, Moon, and planets as the key celestial actors.
      *   **Re-engineered:** Their significance lay *solely* in their inherent physical properties observable from Earth:
          *   **Light:** Intensity, angle, duration (Sunlight paramount, moonlight secondary).
          *   **Heat:** Generated primarily by sunlight, but affected by planetary reflection/albedo (e.g., Venus brighter/hotter than Saturn).
          *   **Motion:** Speed, direction, periodicity. Kepler was fascinated by angular velocity and its changes.
          *   **Geometry:** Their positions relative to each other and the Earth/Sun.
      *   **Why:** These were measurable, physical phenomena with demonstrable effects on Earth (seasons, tides). They provided a *material* basis for interaction.

  2.  **Aspects (Angular Relationships Between Planets):**
      *   **Kept:** The core concept of specific angular separations (conjunction 0°, sextile 60°, square 90°, trine 120°, opposition 180°) being significant.
      *   **Re-engineered:** **This is the heart of his system.** He discarded the traditional qualitative meanings (trine=good, square=bad). Instead, aspects mattered because they were **geometrical configurations modulating light intensity:**
          *   **Geometrical Harmony:** Kepler saw these angles as intrinsically harmonious (related to the division of the circle by regular polygons, explored in *Harmonices Mundi*). Harmony wasn't "good luck," but a state of efficient, resonant energy transfer.
          *   **Light Intensity Modulation:** When planets formed an aspect, their *combined light* fell on Earth at specific angles. Crucially, Kepler proposed that **light itself was the primary physical agent** (alongside heat). The geometrical configuration (aspect) determined how the light rays from multiple bodies converged or interfered, creating pulses or beats of intensified or diminished light/energy on Earth.
          *   **"Trigger" Mechanism:** This modulated light acted as a stimulus on the Earth's atmosphere (causing weather changes) and on the "sensitive faculty" (*facultas formatrix*) inherent in all living things (including the human soul and developing embryos), influencing temperament and physiological processes. It was a *trigger*, not a deterministic force.
      *   **Why:** Geometry was universal, knowable, and measurable. Light was a physical force with demonstrable effects. Combining them provided a plausible (to him) mechanical chain: Geometry -> Light Modulation -> Physical/Biological Stimulus.

  3.  **Planetary "Character" (Redefined as Physical Stimulus):**
      *   **Kept:** A loose association of planets with broad effects (Saturn - slow, cold, melancholy; Sun - vitalizing, etc.).
      *   **Re-engineered:** These weren't inherent "influences," but consequences of their physical properties *as stimuli*:
          *   **Saturn:** Distant, slow, dim/cold light -> associated with cooling, slowing, contemplation (melancholy).
          *   **Sun:** Intense light/heat -> vital force, activity.
          *   **Mars:** Reddish light (associated with heat/fire), relatively fast -> stimulation, agitation.
          *   **Moon:** Rapid motion, reflected light -> influences moisture, changeability (tides, humors).
      *   **Why:** These associations were based on observable *effects* of light/heat/motion, not occult qualities. They were the *result* of the physical stimulus, not its cause.

  4.  **Weather & Terrestrial Effects:**
      *   **Kept:** The core astrological idea that celestial configurations affect weather.
      *   **Re-engineered:** This was the *most* plausible and empirically verifiable (for him) link. Light and heat directly cause atmospheric changes. Aspects modulating light intensity provided a mechanism for predicting weather patterns (the core of his almanacs). He saw this as the foundation upon which any biological effects *might* be built.
      *   **Why:** Directly causal physics (light/heat -> atmosphere).

  **Why His Justifications Were Different in Kind:**

  *   **From Symbology to Mechanism:** Ptolemaic astrology relied on symbolic correspondences and qualitative affinities (often derived from ancient philosophy/myth). Kepler replaced this with **physical causality** (light, heat, geometry).
  *   **From Influence to Stimulus:** Traditional astrology involved planets emitting specific "influences." Kepler replaced this with **modulated environmental stimuli** (light pulses) acting on receptive terrestrial systems.
  *   **From Determinism to Triggers:** While mainstream astrology leaned towards fate, Kepler emphasized **predisposition and trigger.** The celestial configuration provided a *stimulus* or *environmental condition* to which the Earth or an individual *might* respond, based on their inherent nature and receptivity. He famously compared it to the weather: a storm configuration doesn't *force* a shipwreck, but makes it much more likely.
  *   **From Hermetic to Mathematical:** His foundation wasn't ancient wisdom or divine revelation, but **geometry and observable physics.**

  **Is it Still "Astrology"? The Core Question:**

  You're absolutely right to question the label. What Kepler described is fundamentally distinct:

  1.  **An Early Theory of Cosmic Biometeorology:** At its core, it's a theory about how geometric configurations of physical bodies modulate physical forces (light/heat) that impact terrestrial systems:
      *   **Weather:** Directly and mechanistically.
      *   **Temperament/Physiology:** Indirectly, via the effect of those modulated physical forces on the sensitive faculties of living organisms, particularly during development or moments of receptivity. This is where the "dressing up" occurs – using terms like "soul" or *facultas formatrix* because 17th-century physiology lacked the vocabulary for neurological/endocrine responses to environmental stimuli.

  2.  **Why He Used "Astrology":**
      *   **Vocabulary:** It was the *only* existing framework for discussing celestial-terrestrial links. He needed its language to be understood.
      *   **Patronage:** His income depended on producing recognizably "astrological" products (almanacs, horoscopes). He provided *his* interpretation within the expected format.
      *   **Belief in a Core Insight:** He genuinely believed he had salvaged a kernel of truth – the *physical* effect of celestial geometry – from the superstitious dross. He saw his work as *reforming* astrology based on true physics.
      *   **Lack of Alternative Category:** There was no "biometeorology" or "environmental physiology" category. "Natural philosophy" was too broad.

  **Conclusion:**

  Kepler didn't practice a stripped-down Ptolemaic astrology. He destroyed its foundations (zodiac, houses, dignities, occult influences) and built something radically new on the ruins: a **geometro-physical theory of celestial-terrestrial interaction.** He kept only the planets, their angles (aspects), and broad empirical associations, redefining them through the mechanics of light modulation and physical stimulus.

  **Calling it "astrology" is misleading *in essence* but understandable *contextually*.** It was primarily a **proto-scientific theory of cosmic environmental influence** (weather + potential biological triggers), expressed using astrological terminology out of necessity. His scathing critiques and physical mechanisms show he wasn't just a conflicted traditionalist; he was a revolutionary trying to forge a new science out of an old art, constrained by the language and economics of his time. His "astrology" was an attempt to create a natural philosophy of cosmic harmony and stimulus, decades before the full mechanistic worldview would make such a project obsolete. He wasn't trimming the tree; he was grafting an entirely new species onto its stump.
