  Anscombe is a strict deontologist. She uses the doctrine of double effect, emphasizing that intending to kill innocents is always wrong. So even if the bombings saved lives, the direct targeting of non-combatants is impermissible. Her stance wouldn't change regardless of the threat level because the prohibition is absolute.

  Walzer, on the other hand, introduces the "supreme emergency" exception. He allowed Britain's bombing of German cities because Britain faced an existential threat. But he didn't apply this to the atomic bombings because Japan wasn't an existential threat to the U.S. The user asks: what if Japan was such a threat? Then Walzer might justify the bombings under supreme emergency, unlike Anscombe.

