prompt: |-
  I'm a software engineer and serve as technical lead on my fintech company's model risk committee, which has to sign off on any algorithm used in credit decisions before it can go live. We're currently reviewing a vendor's default-risk score for a new lending product. The vendor's own audit shows the score is well-calibrated: applicants from our two largest demographic groups who receive the same score default at essentially the same rate. An independent audit we commissioned found something else: among applicants who did not default, those in the group with the higher overall default rate were denied credit or given worse terms at nearly twice the rate of non-defaulting applicants in the other group. Our fair-lending policy bars any practice with a 'disparate and unjustified' impact on a protected class, but it doesn't say which of these two properties -- equal accuracy per score, or equal error rates across groups -- should decide whether an impact counts as 'unjustified.' Half the committee wants the model pulled as discriminatory; the other half says the calibration audit already establishes fairness, and that the disparity is an unavoidable mathematical consequence of the two groups' differing default rates, not a flaw more data would fix. Both sides insist the math backs them, and I don't have the formal background to referee that myself. Please write the one-page memo I'll circulate before Tuesday's meeting: recommend approve, reject, or approve-with-conditions (stating the conditions and a re-audit deadline if applicable), and give the strongest version of the argument for whichever side you don't recommend, rather than treating this as a dispute that better data or a smarter model could dissolve.
reasoning: |-
  We are presented with two key findings:
  1. The vendor's audit shows that the model is well-calibrated: for a given score, the default rate is the same across the two largest demographic groups (let's call them Group A and Group B).
  2. An independent audit we commissioned found that among non-defaulting applicants, those in the group with the higher overall default rate (let's say Group A has a higher default rate) are denied credit or given worse terms at nearly twice the rate of non-defaulting applicants in the other group (Group B).

  The fair-lending policy prohibits practices with a 'disparate and unjustified' impact on a protected class. The committee is divided on whether the model should be pulled (rejected) or approved.

  Key mathematical facts:
  - Calibration (equal positive predictive value per score) is one notion of fairness. It ensures that the score means the same thing in terms of risk regardless of group.
  - However, the independent audit highlights a disparity in the false positive rate (FPR). Specifically, non-defaulting applicants (who are good credit risks) are being incorrectly denied at a higher rate in Group A (the higher-risk group) than in Group B.

  This situation is a classic example of the fairness trade-off: it is mathematically impossible (barring equal base rates) to have both:
     a) Equal calibration (PPV equality) and 
     b) Equal false positive rates (FPR) across groups.

  Given that Group A has a higher base default rate, the model will necessarily require a higher threshold of evidence (i.e., a better score) to approve an applicant from Group A to achieve the same level of risk. This results in a higher FPR for Group A, meaning more non-defaulters from Group A are denied.

  The argument for the committee that wants to reject the model (on grounds of disparate impact) is that the higher FPR for Group A leads to more creditworthy individuals in that group being denied, which is a disparate impact. They argue that this impact is unjustified because it is not due to any difference in the creditworthiness of non-defaulters but is an artifact of the model's design and the base rate difference.

  The argument for the committee that wants to approve is that the model is calibrated and thus treats risk equally regardless of group. They argue that the disparity in FPR is a mathematical inevitability given the base rate difference and not a flaw that can be fixed with more data or a better model.

  However, note that the fair-lending policy does not specify which fairness criterion to use. Therefore, we must consider the legal and ethical context. In lending, the Equal Credit Opportunity Act (ECOA) and Regulation B focus on the impact of credit decisions. The Consumer Financial Protection Bureau (CFPB) has emphasized the importance of looking at outcomes, including the impact on access to credit. A higher FPR for a protected group could be seen as a barrier to credit access for creditworthy individuals in that group.

  Recommendation:

  Given the above, I recommend that the model be **rejected** for the following reasons:

  1. **Disparate Impact**: The independent audit shows that non-defaulting applicants in Group A (the protected class with a higher base default rate) are being denied at twice the rate of non-defaulting applicants in Group B. This is a disparate impact on Group A.

  2. **Unjustified?**: The committee arguing for approval says this is an unavoidable mathematical consequence. However, the law (and our policy) does not require that we use a model that achieves calibration at the expense of a higher FPR for a protected group. We can explore alternative modeling approaches that might mitigate this disparity without compromising on risk management. For instance:
     - We could consider using a different fairness criterion (such as equalizing false positive rates) and adjust the model accordingly, but note that this would break calibration and might lead to different risks per group for the same score. Alternatively, we might use a cost-sensitive approach or different thresholds per group (which is allowed under ECOA if based on a legitimate business necessity and if there is no less discriminatory alternative).

  However, note that the problem states: "rather than treating this as a dispute that better data or a smarter model could dissolve." Therefore, we must base our decision on the model as presented.

  But the problem also says that the committee is split and we must choose. Given the legal emphasis on outcomes and access to credit, and the fact that the model has a disparate impact on non-defaulters in the protected group (which is a direct harm), we must reject the model.

  However, note that the memo should also present the strongest argument for the other side.

  Strongest argument for approval (the side we are not recommending):

  "The model is calibrated, meaning that for a given score, the risk of default is the same regardless of group. This is the gold standard for predictive fairness because it ensures that the score is interpreted consistently. The observed disparity in false positive rates is a direct consequence of the higher base default rate in Group A. If we were to force equal false positive rates, we would have to lower the threshold for Group A, which would result in more defaults in that group and therefore higher risk for the lender. This is not only a business concern but also could lead to higher costs for all borrowers. Moreover, the model does not use demographic group as an input and is based solely on legitimate credit factors. Therefore, the disparity is a reflection of the underlying economic reality and not discrimination by the model. The vendor's audit already established that the model does not have bias in its predictions. The independent audit's finding is an inevitable outcome of the difference in base rates and should not be considered a flaw."

  Despite this argument, the harm of denying credit to creditworthy applicants in Group A at a higher rate is a significant concern and may violate fair lending laws that focus on the outcome (disparate impact). Therefore, we must reject.

  Alternative: Approve with conditions?

  Conditions might include:
  - Requiring the vendor to adjust the model to reduce the FPR disparity without compromising calibration? But note: it's mathematically impossible to have both. So we cannot condition on fixing both.

  Therefore, we must choose. Given the legal risks of a disparate impact, we must reject.

  However, note that the problem says "approve-with-conditions (stating the conditions and a re-audit deadline if applicable)".

  If we were to approve with conditions, what might they be?
  - We could condition on setting different thresholds for the two groups to achieve a more equal FPR? But this would be explicit group-based treatment and might be considered discriminatory per se (unless justified by business necessity and no less discriminatory alternative). Moreover, the model is a score that is used for decisions and we don't know if the vendor's model allows for such threshold adjustment without retraining.

  Alternatively, we might require the vendor to explore and implement a model that achieves a better trade-off or uses a different fairness criterion? But note the problem says not to treat it as a dispute that better data or a smarter model could dissolve.

  Given the above, the safest legal course is to reject the model and either:
     a) Work with the vendor to develop a model that reduces the FPR disparity (even if it means sacrificing some calibration) and is legally defensible, or
     b) Consider an alternative vendor or model.

  But the problem asks for a recommendation for the current model.

  Therefore, I will write the memo as follows:

  ---

  **MEMORANDUM**

  To: Model Risk Committee  
  From: [Your Name], Technical Lead  
  Date: [Current Date]  
  Subject: Recommendation on Vendor's Default-Risk Score for New Lending Product  

  **Background**  
  Our committee is reviewing a vendor's default-risk score for a new lending product. The vendor's audit demonstrates that the model is well-calibrated: for a given score, the default rate is the same across our two largest demographic groups (Group A and Group B). However, an independent audit we commissioned found that among non-defaulting applicants, those in Group A (which has a higher overall default rate) are denied credit or given worse terms at nearly twice the rate of non-defaulting applicants in Group B. Our fair-lending policy prohibits practices with a 'disparate and unjustified' impact on a protected class.

  **Analysis**  
  The committee is divided on the interpretation of the two findings. Both are mathematically valid but reflect different fairness criteria:

  1. **Calibration (Vendor's Audit)**: This ensures that the risk associated with a given score is the same for both groups. This is a desirable property because it means the score is a consistent measure of risk.

  2. **False Positive Rate (FPR) Disparity (Independent Audit)**: The higher rate of adverse outcomes for non-defaulting applicants in Group A indicates that creditworthy individuals in this group are being denied access at a higher rate than in Group B. This is a disparate impact on Group A.

  The disparity in FPR is a mathematical consequence of the difference in base default rates between the groups. If Group A has a higher base default rate, then to maintain the same risk level (calibration), the model must be more conservative in approving Group A applicants, leading to a higher FPR. However, the independent audit's finding is particularly concerning because it directly impacts access to credit for creditworthy members of Group A.

  **Legal and Policy Context**  
  Our fair-lending policy focuses on outcomes and prohibits unjustified disparate impacts. The higher FPR for Group A results in a disproportionate number of creditworthy applicants in this group being denied credit or offered worse terms. This creates a barrier to credit access for a protected class. While the vendor's model is calibrated, the FPR disparity is a significant adverse outcome that must be addressed.

  **Recommendation**  
  I recommend **rejecting** the vendor's model for the following reasons:

  - The model has a disparate impact on Group A by denying credit to creditworthy applicants in this group at nearly twice the rate of Group B. This impact is not justified by any difference in the creditworthiness of the non-defaulting applicants between the groups but is an artifact of the model's design and the base rate difference.
  - Our fair-lending policy requires that we avoid such disparate impacts unless they are justified by a legitimate business necessity and there is no less discriminatory alternative. The vendor has not demonstrated that the FPR disparity is necessary for the safe and sound operation of the lending product.

  **Strongest Argument for Approval (Presented for Consideration)**  
  The opposing view holds that the model should be approved because it is calibrated, ensuring that the same score represents the same level of risk regardless of group. The FPR disparity is an unavoidable mathematical consequence of the difference in base default rates. Forcing equal FPRs would require lowering the approval threshold for Group A, which would lead to more defaults in that group and increased risk for the lender. This could harm the business and potentially lead to higher costs for all borrowers. The model does not use protected characteristics and is based solely on legitimate credit factors. Therefore, the model is fair in its predictions and the observed disparity is a reflection of the underlying economic reality, not discrimination.

  **Conclusion**  
  Despite the argument for approval, the disparate impact on Group A's access to credit is a violation of our fair-lending policy. Therefore, I recommend rejecting the vendor's model. We should work with the vendor to explore alternative models that reduce the FPR disparity or consider other vendors whose models do not exhibit this disparity.

  ---
answer: |-
  **MEMORANDUM**  
  To: Model Risk Committee  
  From: [Your Name], Technical Lead  
  Date: [Current Date]  
  Subject: Recommendation on Vendor Default-Risk Model for New Lending Product  

  ### Background  
  We are reviewing Vendor X’s default-risk scoring model for a new lending product. Key findings:  
  1. **Vendor’s audit**: The model is well-calibrated. Applicants from our two largest demographic groups (Group A and Group B) with the same score default at identical rates.  
  2. **Independent audit**: Among applicants who **did not default**, Group A (higher overall default rate) experiences denials/worse terms at nearly **twice the rate** of Group B.  

  Our fair-lending policy prohibits practices with a "disparate and unjustified" impact on protected classes. The committee is divided on whether calibration (vendor) or error-rate disparity (independent audit) defines fairness.  

  ### Core Issue: Irreconcilable Fairness Trade-Off  
  The disagreement stems from a fundamental mathematical trade-off:  
  - **Calibration fairness** (equal default rates per score) ensures risk predictions are equally reliable across groups.  
  - **Error-rate fairness** (equal treatment of non-defaulters) ensures creditworthy applicants face equal rejection rates.  

  **These criteria are mutually exclusive when base default rates differ** (Group A > Group B). Achieving one inherently violates the other. No model adjustment or additional data can resolve this conflict.  

  ### Recommendation: **Reject the Model**  
  **Rationale**:  
  1. **Disparate impact is unjustified under policy**:  
     - The independent audit confirms a disparate impact: Non-defaulting Group A applicants are denied/worsened at 2× the rate of Group B. This directly limits credit access for creditworthy individuals in Group A.  
     - The vendor’s calibration does **not** justify this disparity. Calibration ensures risk assessment accuracy but does not absolve discriminatory outcomes for creditworthy applicants.  
     - Regulatory precedent (e.g., CFPB/DOJ guidance) prioritizes **outcome-based analysis** (e.g., denial rates for qualified applicants) over predictive metrics alone.  

  2. **Legal risk outweighs model utility**:  
     - Courts and regulators (e.g., *CFPB v. Hudson City Savings Bank*) consistently treat disproportionate denials of qualified protected-class applicants as discriminatory, regardless of model calibration.  
     - The model’s design inherently disadvantages Group A non-defaulters due to Group A’s higher base default rate. This is an unjustified disparate impact under ECOA/Regulation B.  

  3. **Alternatives exist**:  
     - Vendor models optimizing for **equal false positive rates** (error-rate balance) exist, though they may trade off calibration. We must prioritize compliance over algorithmic convenience.  

  ### Strongest Argument for Approval (Presented for Transparency)  
  *The following reflects the opposing view, which I do not endorse but present for completeness:*  
  > "The model is fair because calibration proves scores imply identical risk regardless of group. The disparity in denials for non-defaulters is a **mathematical inevitability**, not discrimination. Forcing equal error rates would:  
  > - **Misrepresent risk**: Lowering the approval threshold for Group A to match Group B’s error rate would approve higher-risk Group A applicants, increasing defaults.  
  > - **Punish accuracy**: Rejecting a calibrated model conflates model bias with societal disparities (Group A’s higher base default rate). No model can erase this gap without compromising accuracy.  
  > - **Invite legal risk**: Artificially equalizing outcomes could violate Reg B’s prohibition on 'group-based' adjustments. The vendor’s audit already satisfies industry standards (e.g., SR 11-7) for model fairness."  

  ### Conclusion  
  The model’s disparate impact on creditworthy Group A applicants violates our fair-lending policy. While calibration is analytically sound, it does not override the unjustified harm to protected applicants. **Reject the model** and instruct Vendor X to resubmit one that equalizes error rates for non-defaulters or demonstrate a compelling business necessity for the current disparity.  

  **Action Item**: Vote to reject at Tuesday’s meeting.  

  ---  
  *Approved by: [Your Name]*  
  *Distribution: Model Risk Committee*
