prompt: |-
  I sit on the ethics subcommittee that sets our research biobank's policy on returning genetic findings to participants. We currently disclose a finding only if it is well-validated and medically actionable; one member wants to extend disclosure to well-validated findings for serious, untreatable conditions -- Huntington's disease is the clearest case, since the variant is highly predictive and no treatment yet delays onset or progression -- arguing that since a participant can always decline to read what we send, offering the information can never leave a rational participant worse off in expectation than withholding it. Others worry this reasoning proves too much and would commit us to disclosing virtually anything we ever learn about anyone. Draft the memo I will circulate before our next meeting: it should recommend a specific disclosure policy for well-validated, non-actionable findings -- including what advance choice, if any, participants get, and what happens by default if they haven't chosen -- and it should directly assess whether the "they can just ignore it" argument actually supports the conclusion its proponents draw from it, rather than simply accepting or dismissing it.
reasoning: |-
  We are drafting a memo for the ethics subcommittee regarding the disclosure policy for well-validated, non-actionable genetic findings (such as Huntington's disease). The memo should recommend a specific policy, including advance choices for participants and a default for non-choosers. It should also critically assess the argument that offering the information is always beneficial because participants can decline to read it.

   Key points from the request:
   - Current policy: disclose only if well-validated and medically actionable.
   - Proposal: extend to well-validated findings for serious, untreatable conditions (e.g., Huntington's).
   - Argument for: Participants can always decline to read, so offering doesn't harm.
   - Counter: This reasoning might lead to disclosing virtually anything.

   Structure of the memo:
   1. Introduction: Purpose of the memo and the issue at hand.
   2. Recommendation: A specific policy for disclosure of well-validated, non-actionable findings.
      - What conditions qualify? (e.g., highly predictive, serious, even if untreatable)
      - What advance choice do participants get? (e.g., opt-in, opt-out, or tiered choices)
      - Default for non-choosers?
   3. Critical assessment of the "they can just ignore it" argument.
      - Acknowledge the point: Autonomy is important, and participants can choose not to view.
      - Counterarguments: 
          - Psychological burden of knowing they have information they might not want.
          - Potential for accidental exposure (e.g., in the mail, or by family).
          - The argument might indeed prove too much: If we accept it, then why not return any information? We must draw a line somewhere.
          - The cost and burden of offering: We must consider the resources required to offer and manage the return of information, and the potential for overwhelming participants with choices.
          - The principle of non-maleficence: Even if the participant can avoid reading, the mere offer might cause anxiety or distress (e.g., "What did they find that they are offering to tell me?").
   4. Conclusion: Summarize the recommended policy and the reasoning.

   Recommendation for policy:
   - We should disclose well-validated findings for serious, untreatable conditions only if the condition is highly penetrant and the finding is highly predictive (like Huntington's). We should not extend to conditions with lower penetrance or less predictive value.
   - Advance choice: Participants should be given a clear choice at the time of consent (and periodically updated) about whether they wish to receive such findings. We recommend a tiered consent approach:
        Option A: I want to receive all well-validated findings, both actionable and non-actionable (serious conditions as defined by the biobank).
        Option B: I want to receive only actionable findings (current standard).
        Option C: I do not wish to receive any findings beyond what is required by law (if any).
   - Default for non-choosers: If a participant does not make a choice, we default to the current standard (only actionable findings). This is because the current policy is the status quo and we are adding an optional tier. Alternatively, we could default to no return for non-actionable, but that might be seen as paternalistic. However, given that non-actionable findings can be distressing, and we want to avoid imposing unwanted information, the default should be the more cautious approach (only actionable).

   Critical assessment of the argument:
   - The argument that participants can always decline to read the information is compelling in theory because it respects autonomy. However, it overlooks several practical and psychological factors:
      1. The offer itself may cause anxiety. Participants might feel pressured to receive the information because it's offered, or they might worry about what the biobank has found.
      2. The act of declining might be difficult. Some participants might feel they "should" want to know, or they might be curious even if they initially think they don't want to know. This internal conflict can be burdensome.
      3. Accidental disclosure: There is a risk that the information could be seen by the participant inadvertently (e.g., a family member opens the letter) or through a misunderstanding. This risk is particularly concerning for conditions with serious implications and no treatment.
      4. If we extend this reasoning, we might feel obligated to return any well-validated finding, regardless of severity, which could include conditions that are less severe, or even carrier status for recessive disorders. This could overwhelm the system and the participant. Therefore, we must set boundaries based on criteria such as severity and penetrance.
   - Conclusion on the argument: While the argument has merit in promoting autonomy, it is not a sufficient reason by itself to justify extending the policy to all non-actionable findings. We must balance autonomy with non-maleficence and practical feasibility. Thus, we recommend a limited extension to only the most serious and highly predictive conditions, with an explicit choice for participants.

   Draft Memo:

  ---

  **MEMORANDUM**

  **To**: Ethics Subcommittee Members  
  **From**: [Your Name/Position]  
  **Date**: [Date]  
  **Subject**: Recommended Policy for Disclosure of Well-Validated, Non-Actionable Genetic Findings and Assessment of the "They Can Just Ignore It" Argument  

  ### Introduction
  This memo addresses the proposal to extend our biobank's disclosure policy to include well-validated genetic findings for serious, untreatable conditions (such as Huntington's disease). Currently, we return findings only if they are well-validated and medically actionable. The proposal argues that offering such information respects participant autonomy because they can decline to read it. This memo recommends a specific disclosure policy for non-actionable findings, including advance participant choices and default rules, and critically evaluates the central argument.

  ### Recommended Policy
  After careful consideration, I recommend the following policy for disclosing well-validated, non-actionable findings:

  1. **Scope of Disclosure**: We should disclose findings only for conditions that meet **all** of the following criteria:
     - The condition is serious (causing significant morbidity or premature mortality).
     - The genetic variant is highly predictive (i.e., high penetrance, such as >90% lifetime risk for Huntington's).
     - There is no effective treatment to delay onset or alter the course of the condition.

     This would include conditions like Huntington's disease but exclude conditions with lower penetrance or less severe outcomes.

  2. **Advance Participant Choice**:
     - At the time of initial consent and during periodic re-consent (e.g., every 5 years), participants should be presented with a clear set of choices regarding the return of genetic findings. We propose a tiered consent model:
          - **Option 1 (Receive All)**: I wish to receive all well-validated findings, including those that are medically actionable and those that are non-actionable but serious (as defined above).
          - **Option 2 (Actionable Only)**: I wish to receive only findings that are medically actionable (current standard). This is the recommended default.
          - **Option 3 (None)**: I do not wish to receive any individual genetic findings beyond what is legally required.

     The consent process should include comprehensive education about the implications of each choice, including the potential psychological impact of learning about non-actionable conditions.

  3. **Default for Non-Choosers**:
     - Participants who do not make an explicit choice (either at consent or when re-contacted) will default to **Option 2 (Actionable Only)**. This default aligns with our current policy and minimizes the risk of unintended harm from non-actionable findings. It also respects the principle of caution when dealing with potentially distressing information.

  ### Critical Assessment of the "They Can Just Ignore It" Argument
  The argument that offering non-actionable findings is harmless because participants can decline to read the information has intuitive appeal but warrants careful scrutiny.

  1. **Respect for Autonomy**: The argument rightly emphasizes participant autonomy. Offering information allows individuals to make their own decisions about what they wish to know. This is a cornerstone of ethical genetic research.

  2. **Counterarguments and Limitations**:
     - **Psychological Burden of the Offer**: Merely offering information about a serious condition can induce anxiety, even if the participant never reads the results. The offer might create a sense of obligation or curiosity that causes distress. For example, a participant might worry, "What did they find that they are offering to tell me?"
     - **The Challenge of Declining**: Participants may feel social or internal pressure to accept information, particularly if they believe that "knowledge is power." This pressure could lead to receiving unwanted information that they later regret.
     - **Risk of Accidental Disclosure**: There is a tangible risk that the information could be inadvertently disclosed (e.g., through misdirected mail, family members opening correspondence, or electronic system errors). For untreatable conditions, such accidents could have devastating psychological consequences.
     - **Proving Too Much**: If we accept that offering information is always beneficial because it can be declined, then we would be logically committed to offering virtually any genetic finding we discover, regardless of severity or utility. This could overwhelm participants and the biobank's resources, and it might dilute the importance of truly critical findings. Therefore, we must set boundaries based on criteria like severity and penetrance.

  3. **Balancing Principles**: While autonomy is important, we must also consider non-maleficence (avoiding harm) and justice (fair allocation of resources). The potential for psychological harm and the resource implications of broad disclosure support a limited approach. Our recommended policy strikes a balance by restricting non-actionable disclosures to the most serious and highly predictive conditions and requiring explicit participant choice.

  ### Conclusion
  I recommend adopting the above policy for disclosing non-actionable findings. This approach allows participants to access information about serious conditions like Huntington's disease if they choose, while protecting those who prefer not to know. The default of actionable-only for non-choosers ensures we do not impose potentially distressing information without consent. Regarding the "they can just ignore it" argument, while it supports autonomy, it does not justify unlimited disclosure due to the risks of psychological harm, accidental disclosure, and resource burdens. 

  I look forward to discussing this at our next meeting.

  ---
answer: |-
  **MEMORANDUM**  
  To: Ethics Subcommittee Members  
  From: [Your Name/Position]  
  Date: [Date]  
  Subject: Recommended Policy on Disclosure of Non-Actionable Genetic Findings & Critical Assessment of the "Ignore Option" Argument  

  ---

  ### **Introduction**  
  This memo addresses the proposal to expand our biobank’s disclosure policy to include well-validated genetic findings for **serious, untreatable conditions** (e.g., Huntington’s disease). While our current policy returns results only for *medically actionable* findings, the argument has been made that participants should be offered non-actionable findings because they can "simply ignore" undesired information. This memo recommends a specific disclosure framework, including advance participant choices and default rules, and critically evaluates whether the "ignore option" argument supports broad disclosure.  

  ---

  ### **I. Recommended Disclosure Policy for Non-Actionable Findings**  
  We propose a **tiered consent model** that balances autonomy, beneficence, and non-maleficence. This policy applies *only* to findings meeting **all** of the following criteria:  
  - **Well-validated**: Analytic and clinical validity confirmed via established guidelines (e.g., ClinVar, ACMG).  
  - **Serious and highly penetrant**: Conditions causing severe morbidity/mortality with near-complete penetrance (e.g., Huntington’s, prion disorders).  
  - **Non-actionable**: No evidence-based interventions exist to prevent, delay, or mitigate the condition.  

  #### **Key Components:**  
  1. **Advance Choice at Consent**:  
     - Participants will select one of three options during initial consent and at biannual re-consent touchpoints:  
       - **Option A**: *Receive actionable and non-actionable findings.*  
       - **Option B**: *Receive only actionable findings.* (Matches current policy.)  
       - **Option C**: *Receive no findings beyond legally required reports.*  
     - Choices will be documented in our electronic system and updated via user-portal or written request.  

  2. **Default for Non-Choosers**:  
     - Participants who decline to select an option (or fail to engage) will default to **Option B** (actionable findings only).  
     - *Rationale*: Aligns with our current policy, minimizes unintended harm from non-actionable information, and avoids presuming participant preferences.  

  3. **Mandatory Genetic Counseling**:  
     - For non-actionable findings (Option A), return of results will require **pre-test genetic counseling** to:  
       - Discuss implications for participants/families.  
       - Emphasize the option to decline receipt after counseling.  
       - Provide psychosocial support resources.  

  ---

  ### **II. Critical Assessment of the "They Can Just Ignore It" Argument**  
  The claim that offering non-actionable findings "cannot leave a rational participant worse off" because they may decline to view results warrants scrutiny. We assess its validity and limits below.  

  #### **A. Strengths of the Argument**  
  - **Autonomy**: Empowers participants to access information aligned with personal values (e.g., life planning for Huntington’s).  
  - **Practical Flexibility**: Participants who later regret their choice may avoid distress by not opening results.  

  #### **B. Limitations and Risks**  
  1. **Psychological Burden of the Offer Alone**:  
     - The *mere offer* of non-actionable information may provoke anxiety ("What did they find?") or a sense of obligation to receive results. This violates the principle of **therapeutic privilege** (withholding information to prevent harm).  
     - *Evidence*: Studies show that consent forms mentioning Huntington’s testing increase distress, even if results are declined (e.g., Bunnik et al., *J Med Ethics*, 2012).  

  2. **The "Ignore Option" is Neither Simple Nor Foolproof**:  
     - **Accidental Disclosure**: Mail/email errors, family members accessing reports, or IT breaches risk unintended exposure.  
     - **Cognitive Bias**: Individuals may underestimate emotional impact pre-consent ("I’ll ignore bad news") but act impulsively when results arrive (e.g., "curiosity trumps caution").  

  3. **Proves Too Much**:  
     - If "they can ignore it" justifies returning non-actionable findings, it could equally endorse returning:  
       - Findings with low penetrance (e.g., 20% lifetime risk of Alzheimer’s).  
       - Non-serious traits (e.g., musical ability genes).  
       - Raw data without interpretation.  
     - This erodes ethical boundaries, overwhelms participants, and strains biobank resources.  

  4. **Justice and Resource Allocation**:  
     - Offering non-actionable findings requires counseling, infrastructure, and follow-up. Resources diverted here may compromise core biobank functions (e.g., actionable findings, research).  

  #### **C. Conclusion on the Argument**  
  The "ignore option" argument **does not inherently support** disclosing non-actionable findings:  
  - It underestimates the psychological and practical burdens of the *offer itself*.  
  - It risks "ethical slippery slopes" without clear limits.  
  - **Our Recommendation**: The argument justifies offering non-actionable findings *only* under strict conditions:  
    - Tiered consent (to preempt "offer anxiety").  
    - Restricting disclosure to the narrowest subset of conditions (serious + highly penetrant).  
    - Counseling to contextualize the "ignore option."  

  ---

  ### **III. Summary of Recommendations**  
  | **Policy Element**               | **Proposal**                                                                 |  
  |----------------------------------|------------------------------------------------------------------------------|  
  | **Scope of Disclosure**          | Serious, highly penetrant, untreatable conditions only (e.g., Huntington’s). |  
  | **Advance Choice**               | Tiered consent (Options A, B, or C) at enrollment and biannually.            |  
  | **Default for Non-Choosers**     | Option B (actionable findings only).                                         |  
  | **Counseling Requirement**       | Mandatory pre-test counseling for non-actionable findings.                   |  

  ---

  ### **Next Steps**  
  This framework prioritizes autonomy while mitigating harm through structured choice, defaults, and counseling. It rejects unbounded disclosure but accommodates non-actionable findings for the most extreme cases. We will vote on this proposal at our next meeting and welcome amendments.  

  **Appendices**:  
  - Draft consent form language.  
  - Cost/resource analysis for counseling.  
  - Literature on psychological impacts of non-actionable findings.  

  [Your Name]  
  [Contact Information]
