answer: |-
  Here’s a toast that threads the needle—warm, slightly teasing, accessible to all, and under 5 minutes. The joke leans into the "looking can hurt" paradox without losing the sweetness:

  **(Clink glass, warm smile)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], and I had the privilege of doing grad school with our brilliant, slightly terrifyingly passionate bride. Now, if you’ve spent more than 5 minutes with her, you’ve probably heard her life motto: **‘It can never hurt to look at one more piece of evidence before you decide anything.’**  

  *(Pause, nod to the lab/decision-theory section of the crowd)*  
  "Yes, yes, I see the Bayesians nodding wisely. For the rest of us, it’s basically her version of ‘measure twice, cut once,’ but with way more Greek letters. She applies this to *everything* – choosing the best coffee, optimizing her commute, even… I suspect… selecting the perfect partner.  

  *(Lean in conspiratorially)*  
  "Now, her theorem-loving friends know the *strict, technical* truth of this motto: **in expectation, on average, looking *shouldn’t* hurt.** But… *(turn fully to the bride, playful grin)* …come on, [Bride's Name]. We’ve *all* been there. We’ve all ignored the little voice saying ‘Don’t look down!’ when we’re already nervous on a ladder. We’ve all peeked at our phone *one more time* before bed and seen that email from our boss titled ‘URGENT: Regarding Monday…’. And let’s be honest, who among us hasn’t, in a moment of weakness, Googled an ex at 2 AM? **Turns out, looking *can* absolutely hurt like hell!** It can ruin your night, your morning, or your sense of equilibrium on a wobbly stepstool.  

  *(Shift tone back to warm, focusing on the couple)*  
  "But here’s the beautiful thing, [Bride's Name] and [Groom's Name]. What makes today so extraordinary isn’t just the culmination of gathering evidence – though I’m sure [Bride's Name] has a meticulously updated spreadsheet on [Groom's Name]’s optimal qualities. What makes today magical is the moment you *stopped* looking. The moment you looked at each other and said, **‘This. This is the evidence that matters. This is the decision.’**  

  "You found someone so wonderful, so perfectly suited to you, [Bride's Name], that all those Bayesian calculations converged on a single, undeniable point: **‘Choose this one.’** And [Groom's Name], you clearly possess the wisdom to know that sometimes, the best evidence is simply the look in her eyes, or… perhaps the fact that she hasn’t subjected your marriage proposal to a formal cost-benefit analysis.  

  "So here’s to you both. To [Bride's Name], who taught us all that more data is usually better… *except* when you’ve already found the answer that makes your heart beat faster. And to [Groom's Name], who clearly passed every test – even the unspoken ones. May your life together be filled with abundant joy, minimal regret, and the absolute certainty that *this* was the best decision either of you ever made… no further evidence required.  

  **To the beautiful exception to the rule – may your love always be the data point that outweighs everything else! Cheers!"**

  ---

  **Why this works:**

  1.  **The Joke Lands:** The "Don't look down!" / "2 AM ex-Googling" / "Boss email" examples are universally relatable *pain points* caused by looking. It highlights the *real-world* contradiction to her motto without attacking the theorem itself. The "slightly terrifyingly passionate" setup makes it feel affectionate.
  2.  **Sweet Roast:** It gently ribs her Bayesian zeal ("spreadsheet on optimal qualities," "subjected your proposal to cost-benefit") but immediately pivots to celebrating the *result* of her search and the *human* decision to commit.
  3.  **Accessible:** Explains the motto simply ("measure twice, cut once... with Greek letters"). Uses everyday examples everyone gets. Avoids jargon after the initial setup.
  4.  **Heartfelt Pivot:** The core message is about love transcending the need for constant evidence-gathering. "Stopped looking," "This is the evidence that matters," "the beautiful exception to the rule" – these tie the Bayes theme directly to the romantic commitment in a warm way.
  5.  **Honors the Groom:** Explicitly includes him and makes him part of the "winning evidence" joke, avoiding it being just about the bride.
  6.  **Under 5 Mins:** Concise setup, one main joke beat, heartfelt conclusion.
  7.  **Bayesian Nod:** The "in expectation, on average" line gives the expert half of the room their knowing chuckle without derailing the toast.

  **Delivery Tip:** Smile warmly, especially during the ribbing. Make eye contact with the bride during the joke, then sweep to include the groom and the whole room for the heartfelt conclusion. The "Cheers!" should be enthusiastic!
