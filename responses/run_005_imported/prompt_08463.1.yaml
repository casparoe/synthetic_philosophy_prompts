prompt: |-
  so at my job we run a ton of a/b tests, and theres a running arguement between two people on my team about "peeking" — checking the dashboard early and stopping the test the moment p<0.05 shows up. one guy (frequentist-brained) says that's never allowed because it inflates your false positive rate, basically the same "researcher degrees of freedom" thing that caused the replication crisis in psych — you fix your sample size upfront and wait it out. the other guy says that's a frequentist-only problem: switch to bayesian methods (track posterior odds / a bayes factor instead of a p-value) and you can peek all you want and stop whenever, since bayesian updating doesnt care why you stopped collecting data, only what the data actually says.

  i want an actual answer, not a "depends which stats philosophy you vibe with" cop-out. write an essay that explains the real mechanics of why peeking breaks frequentist significance tests in the first place, then seriously digs into whether switching to bayes makes that problem genuinely disappear or just relocates it (into the prior? into whatever rule decides a bayes factor is "big enough" to stop?). end with a genuine verdict, not a hedge -- "bayes wins, full stop" or "bayes only wins if ___, otherwise the frequentist has a point" are both fine, i just need you to actually commit to one instead of both-sidesing it.
reasoning: |-
  Okay, the user is dealing with a heated debate at work about "peeking" in A/B tests. One team member insists on fixed sample sizes to avoid inflated false positives, citing frequentist principles. The other advocates for Bayesian methods, claiming they allow peeking without issues. The user wants a definitive answer, not a philosophical cop-out.

  First, I need to recall why peeking is problematic in frequentist statistics. The key issue is the multiple comparisons problem. Every time you peek, you're essentially conducting a new test. The p-value threshold (like 0.05) is designed for a single test. If you test repeatedly, the chance of a false positive increases. For example, peeking five times can raise the false positive rate to around 14% instead of 5%. Sequential testing methods like alpha-spending exist but are complex and not commonly used in their workplace.

  Now, the Bayesian argument. Bayesian methods use posterior probabilities or Bayes factors, which update with new data. Stopping rules shouldn't affect the posterior since it depends only on the data observed. But is that entirely true? The prior distribution matters a lot. If the prior is poorly chosen, the results can be misleading. Also, decision thresholds (like BF > 10) are somewhat arbitrary. Peeking might lead to stopping too early if the threshold is hit by chance, similar to frequentist issues.

  The user mentioned Bayes factors. I should explain that Bayes factors compare models and aren't affected by stopping rules. However, the choice of prior can influence the result. If the prior is too vague, early peeking might show high Bayes factors that later reverse. Also, the threshold for stopping (e.g., BF > 10) still involves a decision, which isn't inherently Bayesian but practical.

  The user's deeper need is a clear verdict. They want to know if switching to Bayesian methods resolves the peeking problem entirely. The answer is mostly yes, but with caveats. The prior must be well-justified, and thresholds need to be predefined. Otherwise, there's still a risk of false positives. However, in practice, Bayesian methods with proper priors and predefined rules handle peeking better than frequentist methods without complex adjustments.

  So, the verdict: Bayes wins, but only if done correctly. Predefine the prior, thresholds, and possibly a max sample size. Otherwise, the frequentist concern about false positives remains valid. The user's team needs to implement Bayesian methods rigorously to benefit from peeking without inflating errors.
answer: |-
  ## The Peeking Problem: A Definitive Verdict on Frequentist vs. Bayesian Approaches

  The "peeking" debate is a fundamental clash between statistical paradigms, centered on **how stopping rules interact with inference.** Let's dissect the mechanics and deliver a clear verdict.

  ### Why Peeking Breaks Frequentist Significance Tests (The Mechanics)

  1.  **The Frequentist Contract:** Frequentist hypothesis testing (NHST) operates on a strict pre-specification principle. You define:
      *   Your null hypothesis (H₀) and alternative hypothesis (H₁).
      *   Your primary outcome metric.
      *   Your significance level (α, e.g., 0.05). This is the **maximum allowable false positive rate (FPR)** *under the assumption that H₀ is true* and **only if the experiment is run exactly once to the pre-specified end**.
      *   Your sample size (N). This is calculated based on desired power (1 - β), effect size (δ), and α.

  2.  **The Peeking Violation:** When you "peek" at interim results and decide to stop early *because* p < α at that moment, you violate the "run exactly once to the end" condition. You are performing **multiple hypothesis tests** on accumulating data.

  3.  **The Alpha Inflation Mechanism:** The p-value threshold α = 0.05 controls the FPR *for a single test*. Each time you peek and perform a test, you have another chance for a false positive. The probabilities compound:
      *   **Probability of a false positive on any single peek:** P(p < α | H₀) ≈ α.
      *   **Probability of at least one false positive over k peeks:** 1 - (1 - α)^k.
      *   **Example:** Peek 5 times (α=0.05). True FPR ≈ 1 - (0.95)^5 ≈ 0.226. You have a **22.6% chance** of seeing a "significant" result *by random chance alone* when H₀ is true, not 5%. The more you peek, the higher this inflated FPR climbs.

  4.  **The Core Issue: The Definition of Error Control:** Frequentist error control (α) is defined **over the long run of hypothetical identical experiments, fixed at the pre-specified sample size.** Peeking changes the experimental design (it becomes sequential), fundamentally altering the sampling distribution of the test statistic. The simple threshold p < 0.05 **no longer corresponds to a 5% FPR** under this new, unplanned stopping rule. This is the essence of "researcher degrees of freedom" inflating false positives.

  ### Can Bayesian Methods Genuinely Solve the Peeking Problem?

  Bayesian methods (using posterior probabilities or Bayes Factors) fundamentally change the paradigm. Let's examine the claim and the potential pitfalls:

  1.  **The Bayesian Promise (Likelihood Principle & Stopping Rule Irrelevance):**
      *   Bayesian inference is based on updating prior beliefs using the **likelihood of the observed data** (via Bayes' Theorem: Posterior ∝ Likelihood × Prior).
      *   A core tenet is the **Likelihood Principle:** All evidence about a parameter contained in the data is embodied in the likelihood function. The *reason* you stopped collecting data (e.g., "I peeked and liked what I saw") **does not affect the likelihood function of the data you actually observed.**
      *   **Consequence:** The posterior distribution (or quantities derived from it, like Bayes Factors) **depends only on the prior and the observed data.** The stopping rule used to collect that data is irrelevant for computing the posterior. Peeking doesn't mathematically "break" the calculation in the way it breaks the frequentist p-value.

  2.  **Why This Seems to Solve Peeking:** In theory, you can analyze the data as often as you want. If you stop because the posterior probability of H₁ is 0.95 (or the Bayes Factor is 10), that probability/factor reflects the evidence *in the data collected so far*, regardless of how many times you looked. The calculation itself is valid.

  3.  **The Critical Caveats (Where the Problem Relocates):**
      *   **The Prior:** The Achilles' heel. Bayesian inference is always conditional on the chosen prior.
          *   **Misspecification:** An overly optimistic prior biased towards H₁ will make it easier to achieve a high posterior probability/BF early, potentially leading to false positives if H₀ is true. A very skeptical prior might prevent ever stopping for a true effect.
          *   **Subjectivity vs. Objectivity:** While priors can be based on historical data, they inherently involve choice. Peeking combined with *post-hoc* prior adjustments ("tuning" the prior based on early looks) reintroduces bias similar to frequentist p-hacking.
      *   **The Decision Threshold:** Bayesian methods give you a *degree of belief*. Deciding to stop requires translating this into an action: "H₁ is true enough to act." This requires setting a threshold (e.g., Posterior P(H₁ | Data) > 0.95 or BF > 10).
          *   **Arbitrariness:** Like α=0.05, this threshold is somewhat arbitrary. Why 0.95? Why BF=10 and not 6 or 20?
          *   **Calibration & FPR:** While the posterior *calculation* is stopping-rule invariant, the **operational False Positive Rate associated with a stopping rule *and* a specific threshold** is not automatically controlled at 5%. If you repeatedly test true nulls, stopping whenever P(H₁) > 0.95, your long-run FPR *could* be higher or lower than 5%, depending heavily on your prior and the true effect size. **Bayes doesn't guarantee a specific FPR; it quantifies evidence.**
      *   **Early Stopping & Sensitivity:** Stopping very early based on a Bayes Factor, even with a good prior, can be risky. The estimate of the effect size will be highly uncertain (wide posterior credible intervals). The BF might be large due to a random early fluctuation, especially with noisy data or vague priors. While the *current* BF is valid, acting on it might lead to implementing an effect that is either non-existent or much smaller than estimated. **Bayes protects the *calculation*, not necessarily the *practical consequence* of acting on early, noisy evidence.**

  ### The Verdict: Bayes Wins, But Only With Rigorous Implementation

  **Switch to Bayesian methods (specifically using Bayes Factors or posterior probabilities with a well-justified prior) and you *can* genuinely peek all you want without mathematically invalidating your inference in the way peeking destroys the meaning of a frequentist p-value. The Likelihood Principle holds.**

  **However, this victory is conditional:**

  1.  **You MUST pre-specify a well-justified prior.** Base it strongly on relevant historical data, domain knowledge, or conservative defaults. Avoid vague priors if possible. *Document and justify it before seeing any test data.*
  2.  **You MUST pre-specify your decision threshold(s).** Define what posterior probability or Bayes Factor constitutes sufficient evidence to stop and declare a winner (or futility). Common BF thresholds are 10 (strong evidence) or 3 (moderate). Document this.
  3.  **You SHOULD pre-specify a maximum sample size.** While peeking is allowed, infinite peeking is impractical. Set a cap based on resources/minimum detectable effect. This also guards against the risk of an early false signal persisting (a true H₀ will often see the BF eventually swing back towards H₀ if you keep sampling, but you might stop before it does).
  4.  **Acknowledge the remaining uncertainty when stopping early.** Report the posterior credible interval alongside the probability/BF. Understand that an early stop means your effect size estimate is less precise.

  **If these conditions are met (rigorous prior, pre-specified threshold, max sample size), then Bayesian methods definitively solve the *mathematical invalidation* problem caused by peeking in frequentist testing. The frequentist's core objection is neutralized.**

  **If these conditions are *not* met – if priors are arbitrary or tuned post-peek, thresholds are chosen after seeing data, or there's no stopping cap – then the Bayesian approach merely relocates the problem. The subjectivity moves into the prior and the threshold, potentially leading to biased or premature decisions, undermining the advantage. The frequentist concern about inflated false *findings* (operational FPR) or misleading effect sizes remains valid.**

  **Therefore: Bayes wins, full stop, on the *mathematical validity under peeking* question, but only if implemented with the same level of pre-specification rigor demanded by valid frequentist testing (applied to the prior and threshold, not the sample size). Otherwise, the frequentist's warning about the dangers of unplanned looks retains significant practical weight.** The replication crisis stemmed from flexible analysis, not just frequentism. Bayesian methods are powerful tools against it, but only when used rigorously.
