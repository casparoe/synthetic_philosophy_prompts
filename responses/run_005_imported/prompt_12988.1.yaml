answer: |-
  Based on Quine's core commitments—naturalized epistemology, confirmational holism, and ontological commitment via indispensability—his likely response to Sharon Street's Darwinian Dilemma would be a nuanced agreement leading to **non-cognitivism or expressivism**, rather than simple antirealist agreement, error theory, or companions-in-guilt. Here's the reasoning, step by step:

  1.  **Embracing Street's Evolutionary Challenge:** Quine would wholeheartedly agree with Street's core premise. His naturalized epistemology treats human cognition as a biological phenomenon shaped by evolution. If selective pressures shaped our "evaluative dispositions" for fitness advantages (e.g., cooperation, kin altruism, aversion to harm) rather than truth-tracking, this fits perfectly within his view of how *all* human cognitive faculties arose. For Quine, the lack of "intersubjective checkpoints" in ethics (his own complaint) is *explained* by Street's account: moral discourse lacks the empirical foothold and predictive power of science precisely because it wasn't selected for tracking mind-independent truths.

  2.  **Rejecting Moral Realism via Indispensability:** Quine's criterion for ontological commitment is indispensability to our best *scientific* theory of the world. Mathematical entities earn their keep because physics is unintelligible without them. Moral predicates, however, play no indispensable role in *physics, chemistry, biology, or even psychology* as Quine conceives them. A complete causal explanation of behavior (including moral talk) can be given without invoking moral facts. Street's dilemma reinforces this: if evolution explains our moral talk *without* needing moral truths, then moral facts are explanatorily otiose. They fail the indispensability test spectacularly.

  3.  **Holism's Limited Reach:** While holism allows periphery beliefs (even ethical ones) to be *connected* to the web, Quine consistently maintained that the web has a *center* (logic, math) and a *periphery* (observation sentences). Crucially, revisions are driven by the need to preserve systematicity and predictive power concerning sensory input. Moral claims, lacking clear empirical content and intersubjective checkpoints, reside on the extreme periphery. Holism doesn't grant them equal status; it highlights their *detachability*. Faced with Street's argument, Quine would see no holistic *need* to preserve moral facts, as ditching them simplifies the ontology without harming the scientific core.

  4.  **Avoiding Error Theory:** Quine would likely *reject* an error theory (the view that moral statements are systematically false). His holism and focus on language use suggest a different analysis. Error theory still treats moral statements as *assertions* attempting (and failing) to describe facts. For Quine, the problem is deeper: moral discourse likely isn't *primarily in the business of stating facts* at all. Its function is different. This leads to non-cognitivism.

  5.  **The Likely Move: Non-Cognitivism/Expressivism:** Quine's view of language is pragmatic and behavioral. He sees language as a tool shaped by social and biological needs. Given the lack of empirical content, intersubjective checks, and Street's evolutionary explanation, Quine would likely conclude that moral predicates function **expressively or prescriptively**, not referentially. Utterances like "X is wrong" are more akin to sophisticated *expressions of attitude* ("Boo X!") or *prescriptions* ("Don't do X!"), evolved to coordinate behavior and express pro/con dispositions, not to report on mind-independent properties. This fits his naturalism: it explains the *existence* and *form* of moral discourse in purely natural, evolutionary terms without positing dubious entities. It also explains the lack of settled disputes – attitudes clash, unlike empirical measurements.

  6.  **Dismissing Companions-in-Guilt:** Quine would reject attempts to link ethics to mathematics/logic. For him, the difference is stark:
      *   **Mathematics/Logic:** Indispensable to formulating *any* scientific theory. Their posits are *structurally necessary* for the systematization of sensory experience. Their confirmation comes holistically via the success of the entire scientific enterprise they enable.
      *   **Morals:** Not indispensable to science. Their "confirmation" (if any) is isolated, intuitive, socially negotiated, and lacks the tight, systematic connection to empirical prediction that characterizes science. Street's argument specifically *severs* any reliable connection moral intuitions might have to truth, whereas the utility of math/logic in science *is* evidence of their structural adequacy to the world. They aren't companions in guilt; they play fundamentally different roles.

  **Conclusion:** Quine wouldn't simply sign onto Street's *conclusion* (which targets *realism*), but he would embrace her *premise* as powerful confirmation of his own suspicions. His distinctive move, stemming directly from naturalism, holism (emphasizing the scientific core), and indispensability, would be to **deny that moral discourse is genuinely fact-stating**. He would argue that Street's evolutionary account best explains *why* moral language lacks the features of factual discourse: it evolved for social coordination and expression of attitudes, not for tracking truth. Therefore, the appropriate meta-ethical stance is **non-cognitivism or expressivism**. Moral sentences aren't *false* descriptions (error theory); they aren't descriptions *at all* in the relevant sense. They are expressions of evolved dispositions within a social species, playing a vital non-descriptive role in human life, but not generating ontological commitments.
