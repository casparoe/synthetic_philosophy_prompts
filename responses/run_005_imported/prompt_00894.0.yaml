  The challenge is subtle: show a character unconsciously demonstrating this inconsistency without ever naming the philosophy. The character must encounter two "remote" people – one geographically distant, one temporally distant – within a single continuous scene. The moral flaw should reveal itself only through the character's actions and perceptions, like a crack in glass only visible from certain angles.

  Hmm... interesting constraints. No mention of Ramsey, Parfit, discount rates or climate change. The ethical realization must remain subtextual, emerging from what the character notices or fails to do. This requires surgical precision in showing, not telling. 

  I imagine a dual-frame structure: the immediate spatial distance (someone across the world needing help now) and the temporal distance (future generations). The character should prioritize one over the other in a way that feels instinctively right to them, but ethically jarring to the reader. 

  For the spatial element, a real-time communication with someone in distress works well – perhaps a video call where help can be immediately rendered. For the temporal, something irreversible with long-term consequences... maybe a property decision involving old-growth trees? The character could choose to spend resources on the immediate crisis while cheaply selling off something precious to future generations.

  Key emotional lever: the character should feel virtuous for helping the spatially distant person, completely blind to how they're simultaneously harming the temporally distant. The dissonance lives in that gap between their self-perception and their action's full consequence. 

  Setting matters. Somewhere with natural beauty that contrasts human myopia – coastal cliffs? Ancient oaks? Water imagery could mirror time's flow. And the future "person" must feel real. Not abstract "posterity," but specific lost possibilities: children who'll never climb those sold trees, eroded landscapes. 

  Title should hint at the dichotomy... "The Other Horizon" perhaps? Spatial vs temporal horizons of concern. 

  Must avoid heavy symbolism. The power is in the mundane: a business decision made casually amid a crisis, paperwork signed without thought. The tragedy is in the normalcy of the oversight. 

  Final beat: the character's quiet unease post-decision. Not guilt, just the first itch of cognitive dissonance – like realizing you've forgotten something but can't recall what. The story ends with that suspended awareness, leaving readers to grasp the ethical void.
