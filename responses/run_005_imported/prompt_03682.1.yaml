  The real tension is between recognizing the impulse to speak of the mystical (which Wittgenstein clearly felt) versus his strict view that language can only state facts. For the mystical to "show itself" isn't a metaphysical claim but a limit of language. The user is right that 6.54 prevents treating "shows itself" as knowledge, but Jo captures Wittgenstein's reverence for the ineffable.

  On the bonus question: Wittgenstein's later view (religion as life-regulating picture) isn't identical but resonates. Both reject factual claims about God, but the later focus is on practice over ineffability. The Tractatus mysticism is more about wonder at existence itself ("that it is"), while 1938 deals with how belief functions in life. Different angles, same anti-metaphysical stance.

