prompt: |-
  I am putting together a graduate seminar on formal epistemology, and this week's session pairs I. J. Good's 1967 paper, "On the Principle of Total Evidence," with some applied readings on disclosure policy. As I understand the theorem Good proves there, for a Bayesian agent facing a fixed decision problem, the expected utility of consulting a piece of cost-free evidence before acting can never be lower than the expected utility of acting without it: free information, properly used, is never harmful in expectation. This looks to me like a strikingly clean, decision-theoretic vindication of transparency norms quite generally. Mandatory disclosure requirements in finance, pre-registration of clinical trials, and "sunshine" rules for regulatory rule-making all look like straightforward instances of exactly the free-information-before-a-decision structure that Good's proof covers, so it would seem to follow that any resistance to such requirements must ultimately rest on something other than the effects of information as such — protecting incumbents, say, or paternalism about people's capacity to cope with bad news — rather than any genuine decision-theoretic cost of the disclosure itself.

  What has been nagging at me is that actual policy does not behave as though this were settled. The 2008 Genetic Information Nondiscrimination Act bars American health insurers and employers from requiring or using an applicant's genetic test results, and the British insurance industry has operated for more than two decades under a voluntary arrangement with government — originally a moratorium, since 2018 the Code on Genetic Testing and Insurance — under which insurers do not ask most applicants to disclose existing predictive genetic test results. In neither case is the restriction presented as a regrettable compromise against an otherwise desirable free flow of information; keeping the information out of the underwriting decision is treated as the whole point of the policy. Before I present Good's theorem to my students as grounding a general presumption toward maximal disclosure, I would like a precise answer: is there a genuine decision-theoretic rationale for restrictions like these, and if so, exactly which premise of Good's argument fails to carry over from the case of a single, lone decision-maker to a setting like insurance underwriting? I would rather have the precise mechanism than a gesture toward "incentives are complicated."
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a graduate seminar on formal epistemology, focusing on Good's 1967 paper about the principle of total evidence. The theorem shows that for a Bayesian decision-maker, free evidence can't hurt expected utility. The user sees this as a strong argument for transparency policies like financial disclosure or clinical trial pre-registration. But they're puzzled by real-world policies that restrict information use, like genetic nondiscrimination laws. Why would policies actively prevent information from being used if Good's theorem says more information is always beneficial?

  First, I need to recall Good's theorem thoroughly. The key point is that it applies to a single agent making a decision with cost-free evidence. The user is correct that in such a scenario, more evidence doesn't decrease expected utility. But the insurance examples involve multiple parties with conflicting interests. That's a red flag. The theorem doesn't cover strategic interactions.

  The user mentions GINA and the UK's insurance code. These restrict insurers from using genetic info. The rationale must involve more than just one decision-maker. I remember that in principal-agent problems, information can alter behavior in ways that hurt one party. Adverse selection comes to mind—if insurers know genetic risks, they might deny coverage, but if they can't, high-risk individuals might buy more insurance. That could destabilize markets. Maybe that's the core issue.

  The user wants the exact point where Good's premises fail in multi-agent settings. Good assumes a fixed decision problem with stable preferences and no strategic interaction. In insurance, the insurer's decision affects the insured's actions, and vice versa. The decision problem isn't fixed; it's endogenous. Also, the utility functions conflict—insurers want profit, individuals want affordable coverage. That breaks Good's single-agent assumption.

  Another angle is the distinction between having information and revealing it. Good's theorem is about an agent seeking evidence. But in policy, it's about forcing disclosure to others. The insurer gains info, but the applicant might act differently if they know what the insurer knows. This ties into unraveling and signaling models. If disclosure is mandatory, high-risk individuals might not apply, or insurers might use proxies. So restricting disclosure could prevent market collapse.

  The user also needs to know how this fits into decision theory. The key is that Good's theorem doesn't account for how information changes others' actions. The value of information here isn't just about better decisions but avoiding destructive equilibria. Policies like GINA aim to preserve risk-pooling, which requires some ignorance. That's a second-order effect Good doesn't consider.

  I should also consider if there are other reasons, like fairness or autonomy, but the user wants decision-theoretic reasons. So focusing on strategic interactions and market effects is crucial. The exact failing is the fixed decision problem assumption. Once actions are interdependent, more information can lead to Pareto-inferior outcomes. 

  The user might also wonder about cases where disclosure benefits one party but harms the system. For example, if one insurer uses genetic data, they might attract low-risk people, but others suffer. Regulation prevents this race to the bottom. That's another multi-agent issue.

  In summary, the answer lies in extending beyond single-agent decision theory to game theory and market dynamics. The premises that fail are the fixed decision problem and non-strategic setting. Highlighting adverse selection and the endogeneity of the decision problem should clarify. The user needs this precision to present to students, showing when Good's theorem applies and when real-world policies deviate for valid reasons.
answer: |-
  Your analysis is sharp, and the tension you identify between Good's theorem and real-world nondiscrimination policies like GINA or the UK Code is profound. You're correct that Good's theorem provides an ironclad result for a *single Bayesian agent* facing a *fixed decision problem*: acquiring free evidence cannot decrease expected utility. However, the insurance underwriting scenario involves **multiple strategic agents with conflicting interests and interdependent decisions**, which violates core assumptions of Good's model. The key decision-theoretic rationale for restricting disclosure lies in **preventing market failure due to adverse selection**, and the precise failing of Good's premises is the **endogeneity of the decision problem and the agents' utility functions**.

  Here's the precise mechanism, step-by-step:

  1.  **Violation: The "Fixed Decision Problem" Assumption (Good's Core Premise):**
      *   Good assumes the agent's *available actions* and the *consequences of those actions* are fixed and independent of whether evidence is acquired or not.
      *   **Failure in Insurance:** The insured's decision *to apply for insurance at all* and *which contract to choose* is **endogenous** to the insurer's information structure and underwriting strategy. If insurers use genetic information (G) to risk-rate premiums, high-risk individuals (H) face prohibitively high premiums, while low-risk individuals (L) get lower premiums.

  2.  **The Adverse Selection Mechanism:**
      *   **With Full Disclosure/Use (No Restriction):**
          *   Insurers use G to price risk accurately: Premium_High > Premium_Low.
          *   High-risk individuals (H) know they are high-risk. If Premium_High is too high (reflecting their true risk), they may still buy insurance (if risk-averse) but pay a lot.
          *   Crucially, *some* Low-risk individuals (L), observing Premium_Low, might decide insurance isn't "worth it" at *any* premium reflecting population risk (which is higher than *their* individual risk), and exit the market.
          *   **Result:** The risk pool becomes dominated by higher-risk individuals (H + only the most risk-averse Ls). Insurers must raise premiums across the board to cover costs, driving out *more* Ls. This is the classic "death spiral." The market can collapse or become extremely inefficient (high premiums, limited coverage).

      *   **With Restricted Disclosure/Use (GINA/Code):**
          *   Insurers *cannot* use G. They price based on other factors or use a single community-rated premium reflecting *average* population risk.
          *   High-risk individuals (H) get a relative "bargain" (premium < true risk cost).
          *   Low-risk individuals (L) pay more than their true risk cost (premium > true risk cost).
          *   **Result:** The risk pool remains mixed (H + L). While Ls subsidize Hs, the market remains viable. Insurance remains accessible to H individuals who need it most, and Ls may still value the peace of mind enough to participate, especially if the subsidy isn't extreme. The decision problem (offering/purchasing insurance) remains feasible for both parties.

  3.  **Violation: The "Single Agent" Assumption & Utility Interdependence:**
      *   Good considers one agent maximizing *their own* utility function. The evidence affects only their belief and thus their action choice.
      *   **Failure in Insurance:** There are two classes of agents (insurers, applicants) with **fundamentally conflicting utility functions** regarding risk classification:
          *   *Insurers* want to accurately price risk (maximize profit/minimize losses).
          *   *High-Risk Applicants* benefit from pooling (lower premiums).
          *   *Low-Risk Applicants* benefit from separating (lower premiums reflecting *their* risk).
      *   The acquisition and use of evidence (G) by *one agent* (the insurer) directly and dramatically alters the *payoffs* and *available actions* (e.g., "apply for insurance" becomes unattractive for H if priced high, or for L if priced at average) for the *other agents* (applicants). This utility interdependence is absent in Good's model.

  4.  **Why This Constitutes a Genuine Decision-Theoretic Cost:**
      *   The restriction prevents a Pareto-inferior equilibrium. In the full-disclosure scenario:
          *   Insurers might initially profit from better risk assessment on *existing* customers.
          *   However, the resulting adverse selection leads to market collapse or severe inefficiency. Insurers lose potential customers (exiting Ls) and face a riskier pool overall. H individuals lose access to affordable insurance. L individuals lose the option of fairly priced insurance *or* access to any viable market.
      *   The restriction preserves a viable market, representing a **Pareto-superior outcome** *compared to the collapsed market state* induced by full disclosure. It's a second-order effect: the "cost" of the information isn't in the insurer's *immediate* decision given a fixed pool, but in the *destruction of the decision context itself* (the viable insurance market) for all participants.
      *   **The Value of Ignorance:** The restriction creates a beneficial "veil of ignorance" (in the Rawlsian sense, applied to risk pools) that enables mutually beneficial cooperation (risk-pooling) that would unravel under full information.

  **Precisely Which Premise of Good Fails?**

  *   **Failed Premise:** The assumption that the decision problem (available actions and consequences) is **fixed and exogenous** to the acquisition and use of the evidence.
  *   **Reason for Failure:** In multi-agent strategic settings with conflicting utilities, the acquisition and use of evidence by one agent fundamentally alters the decision problem faced by other agents (e.g., making the "purchase insurance" action infeasible or unattractive for some types). This endogeneity of the decision problem is the critical factor Good's theorem does not encompass.
  *   **Secondary Failure:** The assumption of a **single utility function** being maximized. The conflict between insurer utility (accurate risk pricing) and social/individual utility (access to affordable insurance) creates a tension resolved only by restricting information use.

  **Implications for Your Seminar:**

  1.  **Good's Theorem's Domain:** Emphasize its elegance and power *within its domain*: a single agent making a single decision under uncertainty with a fixed set of actions and consequences. This applies beautifully to intra-personal decisions or single-agent policy contexts (e.g., a regulator gathering all evidence before ruling).
  2.  **The Multi-Agent Frontier:** Frame policies like GINA/the Code as responses to scenarios *outside* Good's domain, where strategic interaction and endogeneity of the decision problem dominate. This is where decision theory meets game theory and market design.
  3.  **"Cost of Information" Revisited:** Argue that while the information itself is cost-free *to acquire*, its *strategic use* in a multi-agent setting *can* impose systemic costs (market collapse) that outweigh the local benefits to one agent (the insurer's better risk assessment on a vanishing pool). The restriction prevents these *systemic decision-theoretic costs*.
  4.  **Beyond Paternalism/Protectionism:** Conclude that while other factors may play a role, the core rationale for *these specific genetic information restrictions* is a sound decision-theoretic/game-theoretic one: preserving the viability of voluntary insurance markets by preventing unraveling due to adverse selection. It's not primarily about coping with bad news or protecting incumbents *per se*, but about maintaining the conditions under which mutually beneficial risk-pooling is possible. The restriction ensures that the "decision problem" (offering and purchasing insurance) continues to exist for all parties.

  By pinpointing the endogeneity of the decision problem in multi-agent strategic settings as the critical failure point of Good's premises, you provide your students with a precise, decision-theoretically rigorous explanation for why maximal disclosure isn't always optimal in policy contexts involving interdependent decisions and conflicting utilities.
