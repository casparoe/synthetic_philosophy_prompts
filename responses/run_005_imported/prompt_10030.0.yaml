  First, I need to break down why K and necessitation lead to logical omniscience. The K axiom says that if you know P implies Q, and you know P, then you know Q. That seems reasonable step-by-step. But combined with necessitation, which says if something is a tautology, you know it, that's where things escalate. Because then any tautology, no matter how complex, is known. And since knowledge distributes over implication via K, knowing P means knowing all its logical consequences. 

  The user's gut feeling is right—people don't know all consequences. The key is that possible worlds include all logically possible worlds. So if Q logically follows from P, any world where P is true must have Q true. Since the agent's knowledge is defined as truth in all accessible worlds, if P is true in all those worlds, Q must be too. Hence, they "know" Q. The leakage happens because the model equates logical consequence with epistemic necessity.

  Now, about the fixes. Awareness functions add a filter: you only know something if it's in your awareness set. But that doesn't solve the core issue; it just limits what you can know. Impossible worlds allow worlds where logic breaks, so Q might not follow from P. But then the model loses logical structure, making it messy. The user might be wondering if these are just patches. They probably want to know if these fixes truly address the problem or just shift it. 

