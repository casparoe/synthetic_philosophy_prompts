  I should emphasize how this irreducibility plays out in practice. In novels (and history), causal chains are often messy and contingent—laws might explain physical events (harvest→famine), but not why *this* event becomes significant later. The Hempelian comeback misses that narrative sentences explain by recontextualizing, not just subsuming under laws. 

