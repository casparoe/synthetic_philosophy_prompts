answer: |-
  That's a classic philosophical stalemate! Your friend is referencing Galen Strawson's **"Basic Argument"** against moral responsibility, and its power lies precisely in its *indifference* to determinism vs. indeterminism. Let's break down the logic step-by-step to see why randomness doesn't save you:

  **The Core of Strawson's Basic Argument (The "Either Way" Move):**

  The argument doesn't focus on *how* you became the way you are (determined vs. random). Instead, it focuses on the **origination requirement** for true moral responsibility and shows that *neither* causal path can satisfy it. Here's the core logic:

  1.  **The Requirement for True Responsibility:** To be *truly morally responsible* for an action (in a deep, desert-based sense deserving of ultimate praise or blame), you must be the *ultimate originator* or *source* of that action. This means the "you" that performed the action must be responsible for *being the kind of "you" that performed that action*.
  2.  **The Need to Be Self-Creating:** How do you become responsible for being *you*? You must have somehow *chosen* or *determined* your own core nature (character, values, preferences, capacities) *in some crucial respect*. You must be, at least partially, *causa sui* (self-caused).
  3.  **The Impossibility of Self-Creation (The Regress):** This is where the trap snaps shut:
      *   **To choose/design your nature (Step N), you must already *have* a nature (Step N-1).** You need preferences, values, capacities *to make that choice/design*.
      *   **But where did *that* prior nature (Step N-1) come from?** If you are to be ultimately responsible for *it* too, then you must have chosen/designed *it* using an *even earlier* nature (Step N-2).
      *   **This leads to an infinite regress:** You need a nature (N-1) to choose nature (N), a nature (N-2) to choose nature (N-1), and so on, forever. There is no starting point where *you*, independently of any prior shaping, initiate this chain. You can't bootstrap yourself into existence *ex nihilo* (from nothing).

  **Why Determinism vs. Indeterminism Doesn't Matter:**

  *   **If Determinism is True:** Your nature (Step N) was determined by prior causes (genes, environment, etc.), ultimately stretching back before you existed. You didn't *choose* those causes. Therefore, you are not the ultimate originator. (This is the part you recognized).
  *   **If Indeterminism is True (The Crucial Point):** Let's say there's genuine randomness (quantum events, true chance) involved in the formation of your nature. How does this help?
      *   **Randomness ≠ Self-Determination:** Random events are *not* chosen or controlled by *you*. If a random event influenced the development of a key preference or capacity that led to your action, that random event is *not* something *you* authored. It's just luck or chance.
      *   **The Origination Problem Remains:** The randomness might break a deterministic chain, but it doesn't insert *you* as the author. You are still stuck with a nature partly shaped by random events you didn't control. You didn't *choose* for that random event to happen or to influence you in that specific way.
      *   **Example:** Imagine a random cosmic ray hits a specific neuron in your developing brain, making you slightly more empathetic. Later, you perform a kind act influenced by that empathy. The randomness *broke* determinism, but it didn't make *you* responsible for becoming empathetic. The cosmic ray event was outside your control. You were just lucky. Luck doesn't ground desert-based responsibility.

  **What's Doing the Work (It's NOT Determinism):**

  The heavy lifting is done by **the impossibility of satisfying the origination requirement** (point #1 above), combined with **the regress argument** (point #3). Specifically:

  1.  **The Origination Intuition:** Strawson argues that deep moral responsibility *requires* being the ultimate source in a way that seems impossible for finite, caused beings.
  2.  **The Regress Argument:** This demonstrates *why* it's impossible – you can't be the cause of your own cause. Self-creation is logically incoherent.
  3.  **The "Either Way" Insulation:** Determinism makes the problem obvious. Indeterminism *seems* like an escape route, but the regress argument shows that randomness doesn't solve the core problem of self-origination. It just replaces external determination with external chance. Neither gives *you* ultimate authorship over *yourself*.

  **In Simple Terms:**

  *   To be *truly* responsible for Action A, you need to be responsible for being the You that did A.
  *   To be responsible for being You, you'd need to have designed/made yourself (Self-Creation).
  *   But you can't design/make yourself because:
      *   If you're *determined* to design yourself, you didn't freely choose to do it.
      *   If you design yourself *randomly*, you didn't control the randomness – it was just luck.
      *   **Crucially:** To design yourself *at all*, you need a "pre-design you" to do the designing... which leads to an infinite loop with no starting point where *you* begin the process independently.

  **Conclusion:** Strawson's argument bypasses the determinism/indeterminism debate by attacking a *presupposition* of deep moral responsibility – the possibility of being *causa sui*. He claims this presupposition is impossible to satisfy logically, regardless of how the universe works. Determinism makes the lack of control obvious. Indeterminism doesn't provide the *right kind* of control (authorship over your *self*), it only provides breaks in causation filled by randomness, which isn't authorship either. So, "you're stuffed either way." Your friend was right about the structure of the argument, even if the conclusion is deeply counterintuitive! It's a powerful and frustrating argument precisely because it seems so logically airtight once you grasp the regress.
