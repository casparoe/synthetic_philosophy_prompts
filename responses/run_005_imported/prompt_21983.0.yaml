prompt: |-
  Okay so this weekend my friend Priya -- shes ABD in phil of language, I just took one grad seminar on this stuff years ago -- completely wrecked me in an argument about Davidson's radical interpretation, and now I want to get my dignity back by grilling someone smarter then me about it. I co-host a small philosophy podcast out of my living room, and our guest in two weeks is a philosopher whose entire research identity is basically "defend and extend Davidson." She waves off the Quine-style indeterminacy worries with a line like "it's no spookier than picking Celsius over Fahrenheit," and she gets genuinely annoyed if you treat radical interpretation as a practical field-linguist's technique instead of a claim about what's constitutively required for anyone to have beliefs or mean anything at all.

  Can you draft me 9 or 10 interview questions that don't just let her restate the view -- nothing like "what drew you to Davidson"? I need at least one question that leans hard on the "arrogance" objection: that the principle of charity, by requiring us to interpret people as mostly rational and consistent by our own lights, can't leave room for genuine deep disagreement or systematic error, and just quietly smuggles in the interpreter's own worldview as the standard -- with a follow-up ready for when she gives the standard Davidsonian move that particular errors are only locatable against a backdrop of massive agreement. I also want one on what's sometimes called the Foster problem, that a Tarski-style truth theory can satisfy every T-sentence and meet all the formal constraints while still not being meaning-giving, plus a follow-up pushing on whether appealing to holistic fit with what speakers hold true actually rules out those deviant theories or just makes them harder to construct.

  And I want a question built around "A Nice Derangement of Epitaphs" -- if successful communication only needs two people's passing theories to converge in the moment, worked out live for malapropisms and one-off metaphors, in what sense was there ever a shared language for them to be speaking in the first place, and isn't that basically conceding that compositional semantics was never really the right project? If you can end on something that forces her to own the deeply unintuitive consequence that prelinguistic infants and animals can't have real beliefs (since belief apparently requires the concept of objective truth, which apparently requires language and another speaker to triangulate with), even better -- I'm pretty sure that's a bullet Davidson actually bit and I'd bet money she bites it too.
