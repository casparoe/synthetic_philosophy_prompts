prompt: |-
  I don't have any formal training in philosophy, but over the past year I've worked my way through Jaegwon Kim's writing on mental causation on my own, mostly via the Stanford Encyclopedia and a couple of secondary sources rather than the original journal articles, so I may have some of the fine details slightly off. What pulled me into this was an argument with a friend finishing a neuroscience PhD, who insisted that talk of "reasons" and "beliefs" doing anything is just a convenient story laid over neurons obeying physics. Kim's causal exclusion argument seems to back her up more than I'd like: if every physical event that has a cause has a sufficient physical cause, and a single event can't have two distinct sufficient causes except as a rare, freak coincidence, then the physical realizer of any mental state already does all the causal work that state was supposed to do, and the mental property riding on top of it looks redundant.

  The escape route I find most attractive is Sydney Shoemaker's idea that a realized property's causal powers are always a proper subset of its realizer's causal powers, so that citing the mental property isn't citing some extra cause in competition with the physical one, but is instead picking out the very same causal transaction at a coarser grain. What keeps nagging at me is that this seems to demand that exactly the same subset of powers show up in every physical system that realizes the property, whether that's a human brain, an octopus's very differently wired nervous system, or some hypothetical silicon system, and I can't see how you'd specify that fixed, realizer-independent subset in advance without quietly falling back on a functional definition of the mental property, powers and all, which would make the "subset" move look like a repackaging of plain functionalism rather than an independent answer to Kim. I've gone back and forth on whether this is a real problem or whether I'm missing an obvious reply, so I'd like you to argue, as rigorously as you can, that Shoemaker's strategy survives this multiple-realizability worry without collapsing into functionalism or smuggling in type-identity through the back door. Please engage with the strongest version of the objection rather than one that's easy to wave away.
reasoning: |-
  Okay, the user has been diving into Jaegwon Kim's work on mental causation, specifically the causal exclusion problem, without formal training. They're grappling with how mental properties can have causal efficacy if physical causes are sufficient. Their friend, a neuroscience PhD, argues that mental states are just convenient stories over physical processes. The user finds Shoemaker's subset strategy appealing but worries it might collapse into functionalism or sneak in type-identity due to multiple realizability.

  First, I need to unpack the core issue: Shoemaker's idea that realized properties have a subset of their realizer's causal powers. The user's concern is that for this subset to be consistent across different realizers (like brains, octopi, silicon systems), it must be defined functionally. That would make Shoemaker's approach just functionalism in disguise. They want a rigorous defense against this.

  The user's deeper need might be to preserve genuine mental causation without reducing it to physics or eliminating it. They might want a metaphysics that allows reasons and beliefs to be causally relevant in a non-redundant way. Their frustration stems from the fear that Shoemaker's solution isn't as robust as it seems.

  I should start by clarifying Shoemaker's position. He argues that causal powers are essential to properties. A property is defined by what it contributes to an entity's causal powers. Realized properties inherit a subset of the realizer's powers. For example, the mental property of pain might include the power to cause withdrawal behavior, which is part of the physical realizer's powers in humans, octopi, etc.

  The key is how the subset remains the same across diverse realizers without functionalism. Shoemaker distinguishes between core and total realizers. The core realizer is the minimal set of properties necessary for the realized property. The total realizer includes everything in the entity. The realized property's causal powers stem from the core, which must be consistent across different total realizers. This avoids type-identity because the core can be physically diverse.

  But the user worries that specifying the core requires functional definitions. Here, I need to argue that while functional roles are involved, Shoemaker's view isn't just functionalism. Functionalists define mental states by their causal roles, but Shoemaker sees properties as clusters of causal powers. The identity of a property is tied to these powers, not just a functional description. So when multiple realizers share the same subset of powers, it's the powers themselves that define the property, not the functional role abstractly.

  To defend against collapsing into functionalism, I should emphasize that for Shoemaker, properties are individuated by their causal powers. This is a metaphysical claim, not just a conceptual one. The subset of powers must be identical across realizers. For example, pain's power to cause avoidance is the same power whether in a human or octopus. The physical mechanisms differ, but the causal contribution is identical. This relies on trans-realizer identity of causal powers, which is a key point. The user might question if such identity is possible without physical sameness, but Shoemaker would argue powers can be multiply realized if they produce the same outcomes in the same circumstances.

  Another angle is that functionalism is a theory of mind, while Shoemaker's subset view is a broader metaphysical framework. His theory applies to all properties, not just mental ones. So even if functionalism uses causal roles, Shoemaker's account is about how properties relate through their powers, which can include non-mental properties. This might show it's a more general theory.

  The user's objection about specifying subsets without functional definitions is tough. I need to argue that while we use functional descriptions to identify these powers, the actual causal powers are what ground the property. The challenge is to show that these powers aren't defined functionally but are concrete contributions to causality. Shoemaker might say that the powers are what they are across contexts, so when we identify a power like "causing avoidance," it's the same regardless of realizer. But the user might counter that identifying "causing avoidance" requires a functional description, thus looping back. 

  Perhaps the response is that the causal power itself is a natural phenomenon. For instance, the power to cause withdrawal in response to damage is a specific effect that can be realized in various ways. The power is individuated by its manifestation conditions and effects, which are consistent. So in different realizers, the same power (same effect under same conditions) exists, even if the underlying mechanism differs. This avoids functionalism because the power is not defined by its role in a system but by its actual causal profile. However, this might still sound functionalist. The distinction is subtle: functionalism defines mental states by their relations, while Shoemaker's properties are the causal powers themselves. 

  The user also worries about smuggling in type-identity. If the subset of powers must be identical, doesn't that imply a higher-level type? Shoemaker would say yes, but it's a property defined by causal powers, not physical composition. So it's not type-identity in the physical sense. The same causal power can be instantiated by different physical states. This preserves multiple realizability without functionalism's potential pitfalls.

  In conclusion, the defense hinges on the trans-realizer identity of causal powers. As long as the same causal power (same effect under same conditions) is present across different physical realizers, the subset strategy holds. This doesn't require functional definitions as the grounding; instead, the powers are the metaphysical basis. The user's challenge is whether this is circular, but Shoemaker's framework posits powers as fundamental. Thus, the subset strategy can stand without collapsing into functionalism or reverting to type-identity.
answer: |-
  You've zeroed in on the most potent challenge to Shoemaker's subset strategy: **how can the *same* subset of causal powers be present across wildly diverse physical realizers without either (a) collapsing into functionalism by defining the mental property *as* that functional role, or (b) smuggling in type-identity by demanding an implausible physical similarity?** This is the core tension between multiple realizability (MR) and robust property individuation. Let's defend Shoemaker rigorously.

  ### 1. **Recapping Shoemaker's Core Move**
     Shoemaker argues that:
     - Properties are individuated by their causal powers (CPs).
     - A realized property `M` (e.g., *pain*) has a set of CPs that is a **proper subset** of the CPs of its physical realizer `P` (e.g., C-fiber firing).
     - When `M` is causally efficacious (e.g., pain causing avoidance behavior), it’s *not* adding new CPs beyond `P`'s. Instead, it's leveraging a subset of `P`'s CPs that are *essential* to `M`.
     - Crucially, `M`'s causal contribution is **identical** to that subset of `P`'s CPs. There’s no "overdetermination" because `M` *is* (a manifestation of) those CPs.

  ### 2. **The Objection Restated Forcefully**
     For MR to hold, *pain* must be realizable by:
     - `P1` (human C-fibers),
     - `P2` (octopus nociceptive network),
     - `P3` (silicon circuit).
     `P1`, `P2`, and `P3` have vastly different *total* CPs. For Shoemaker’s subset move to work:
     - There must be some **identical subset of CPs** `S` shared by `P1`, `P2`, and `P3`.
     - `S` *must* be what defines `M` (pain).
     - **But how do we specify `S` independently?** If we say `S` = {power to cause withdrawal, power to induce learning, etc.}, we’re defining `M` *functionally* by its typical causes/effects. This reduces Shoemaker to functionalism. If we insist `S` is a non-functional, intrinsic feature, we imply that `P1`, `P2`, `P3` share identical physical powers—denying MR.

  ### 3. **Defending Shoemaker: Why the Subset Strategy Survives**
     Shoemaker’s framework *can* answer this without collapsing. The key moves:

     **A. Causal Powers as "Forward-Looking" & Multiply Realizable:**
     - CPs are not defined by their *physical microstructure* but by **what they *can* do** (their *potential effects* given inputs). Example:
       - The CP "causes limb withdrawal when tissue damage is detected" is the *same* power whether instantiated by neurons, octopus ganglia, or silicon. What matters is the **input-output profile**.
       - This is *not* functionalism because:
         - Functionalism defines `M` *wholly* by its relational role in a system.
         - Shoemaker defines `M` by its *intrinsic cluster of CPs*. The CPs themselves are the property’s essence.
     - **Crucial Point:** The *trans-realizer identity* of the subset `S` is grounded in the **identity of the causal contributions** themselves. If `P1` and `P3` both have the power to *cause avoidance behavior when damaged*, they share that CP—even if their physical mechanisms differ. The CP is individuated by *what effect it produces under what conditions*, not how it’s built.

     **B. The Role of "Core Realizers" (Shoemaker’s Key Innovation):**
     - Shoemaker distinguishes:
       - **Total Realizer (`P_t`):** The full physical state sufficient for `M` (e.g., entire C-fiber assembly).
       - **Core Realizer (`P_c`):** The minimal physical component *directly responsible* for `M`'s CPs (e.g., specific neural firing pattern).
     - `M`'s CPs are a subset of `P_c`'s CPs, *not* `P_t`'s.
     - **Why this answers MR:** In different systems, `P_c` can be physically diverse (octopus vs. human neurons), but as long as each `P_c` has the *same set of CPs* defining `M`, `M` is multiply realizable.
       - Example: Human `P_c` (neural pattern) and silicon `P_c` (circuit state) both have the CPs {causes aversive signaling, triggers motor avoidance}. This shared CP-subset *is* the property *pain*.
       - **No functionalism here:** `M` is not defined by a role *external* to `P_c`; it *is* the cluster of CPs possessed by `P_c`. The physical diversity of `P_c` across systems ensures MR without type-identity.

     **C. Avoiding the "Specification Problem": Powers, Not Descriptions**
     - The objection assumes that specifying the subset `S` requires a *functional description*. But for Shoemaker:
       - CPs are **natural, mind-independent features** of properties. We *discover* that diverse `P_c` states share the CP "causes withdrawal when damaged"—we don’t impose this via a definition.
       - **Analogy:** Water has the CP "dissolves NaCl". This CP is identical whether instantiated in Earth’s oceans or a Twin-Earth XYZ lake. We don’t need a "functional definition" of dissolution—the CP itself is what grounds the property’s identity across realizers.
     - **For mental properties:** We empirically observe that human brains, octopus ganglia, and silicon systems all exhibit states with the CPs {causes aversive response, motivates learning, etc.}. *That shared cluster of powers is pain*. Specifying it isn’t "smuggling in functionalism"—it’s identifying a natural kind by its causal profile.

     **D. Why It’s Not Type-Identity in Disguise**
     - Type-identity requires *physical similarity* (all pains = C-fiber firing). Shoemaker requires only *causal-power similarity*.
       - `P1` (human) and `P2` (octopus) are physically dissimilar but share identical CP-subset `S`.
       - `S` is not a physical type; it’s an abstraction over diverse physical states that *do the same causal work*.
     - **Metaphysical Grounding:** `S` is not a "freestanding" abstraction. It’s grounded in each realizer’s physical CPs. But since CPs are what *make* a property what it is, `M` is as real as its realizers.

  ### 4. Addressing Residual Worries
     - **"But doesn’t this make CPs *too* abstract, losing explanatory power?"**  
       No. CPs are concrete: to have a CP is to have a *disposition* that manifests in specific ways. When we say "pain causes avoidance," we’re describing a real disposition present in the system, grounded in its physical structure—even if that structure varies.
     
     - **"Isn’t individuating properties by CPs circular?"**  
       Shoemaker accepts a degree of holism: CPs are individuated relative to other properties in a causal network. But this is a feature, not a bug—it reflects how science works (e.g., mass is defined by interactions with force).

     - **"What about *novel* CPs in aliens/silicon?"**  
       If a silicon system has a state with *all* the CPs of human pain + extra powers (e.g., wireless broadcasting), the *pain* subset is still present. The extra CPs belong to the realizer, not the realized property `M`.

  ### Conclusion: A Robust, Non-Functionalist Answer
  Shoemaker’s subset strategy survives the MR challenge by:
  1. **Anchoring property identity in causal powers** (not roles or structures),
  2. **Leveraging "core realizers"** to isolate the minimal physical basis for `M`’s powers,
  3. **Allowing CPs to be multiply realizable** by focusing on input-output profiles.

  This avoids functionalism because `M` is not *defined* by a role in a system—it **is** the cluster of CPs that diverse core realizers share. It avoids type-identity by demanding only causal (not physical) similarity. The "subset" isn’t a conceptual abstraction; it’s a **natural convergence of causal capacities** across physical systems. Your worry is profound, but Shoemaker’s metaphysics has the tools to resolve it—making mental causation robust without overdetermination or retreat to identity theory.
