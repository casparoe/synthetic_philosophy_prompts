  First, I need to parse the passage's logic step by step. Pascal presents a dichotomy: justice needs might to be effective, and might without justice is tyranny. The key is the transition from combining justice and might to concluding that since we can't make justice strong, we make the strong just. 

  The user mentioned the last part where Pascal says "we have made what is strong just." They're wondering if this is a critique or an endorsement. Considering Pascal's other ideas, like the corrupting effect of the Fall on reason, it's likely he's critiquing how power justifies itself. The reference to "she" being justice—probably a translation quirk—highlights how might personifies itself as justice.

  The user also brings up another fragment where Pascal says it's dangerous to tell people laws aren't just. There's tension here. If Pascal is revealing the illusion, isn't that dangerous? But his audience is likely the intellectual elite, not the masses. His project in Pensées is apologetic, showing the flaws in human systems to point toward divine justice.

  Connecting to the Fall: post-Fall, human reason is corrupted, so justice is disputable. Force is concrete, so society opts to sanctify force as justice. This isn't endorsement but a tragic necessity in a fallen world. The deeper goal is to show human systems' inadequacy, directing readers to God.

  The user's side question about "she" is minor but worth clarifying—it's Justice personified. The logical move from combining justice and force to making the strong just stems from the impossibility of the former. Force resists yielding to justice, so society reverses the process.

