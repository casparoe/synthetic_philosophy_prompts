answer: |-
  ## Hotel Bar Debate: The Money Pump & Resolute Choice

  **Setting:** A slightly worn hotel bar, low lighting reflecting off cheap varnished wood. The murmur of other conference attendees fades into the background. Empty glasses (one whisky neat, one gin & tonic) sit between them.

  **Characters:**
  *   **Alex:** Mid-40s, sharp suit slightly rumpled after a long day. Leans forward, intense. Believes money pumps decisively demonstrate irrationality.
  *   **Rita:** Late 30s, practical sweater, gestures calmly but firmly. Defends resolute choice as a rational response to diachronic dilemmas.

  **(The conversation is already heated)**

  **Alex:** ...and that’s precisely the point, Rita! McClennen’s ‘resolute choice’ is just sophisticated self-deception. If you prefer A to B, B to C, and C to A, and a clever trader offers you sequential swaps for a penny each, you *will* get pumped. It’s inevitable unless you change your underlying preferences. The vNM axioms exist *because* they prevent this kind of self-harm!

  **Rita:** (Takes a deliberate sip of gin) Inevitable only if you insist on evaluating each choice myopically, Alex. That’s the trap. The pump exploits the disconnect between your *synchronic* preferences at each choice point and your *diachronic* evaluation of the entire sequence. Resoluteness bridges that gap. It’s not deception; it’s foresight and commitment.

  **Alex:** Commitment to *what*? To ignoring your actual preferences when the moment arrives? Let’s make it concrete. Standard cycle: You prefer the Apple (A) to the Banana (B), the Banana (B) to the Cherry (C), and bafflingly, the Cherry (C) to the Apple (A). The bookie approaches. You start with A.

  **Rita:** Fine. Standard setup. I start with A.

  **Alex:** Bookie says: "Trade A for C? Only a penny!" Now, at *this* moment, holding A, what do you prefer? A or C?

  **Rita:** At *this* moment, holding A, I prefer A to C. My synchronic preference is A > C.

  **Alex:** Exactly! So, refusing the trade costs you nothing *now*. Why wouldn't you refuse? Why pay a penny to get something you like *less* right now?

  **Rita:** Because I see the sequence. If I refuse *this* trade, the bookie offers me A for B next (since I prefer B to A). I’d take that, paying a penny to get B, which I prefer *at that moment*. Then he offers me B for C. I prefer C to B *then*, so I take it, paying another penny, ending up with C. I started with A, ended with C, paid two cents, and I prefer A to C! Disaster.

  **Alex:** Precisely! So back to the first offer. Why refuse A-for-C? You just said you prefer A to C *now*.

  **Rita:** I refuse it *because* I am resolute. I committed *before the sequence began*, knowing my own cyclical preferences and the bookie’s strategy, to a plan that avoids the pump. That plan is: *Reject all trades*. I stick to A.

  **Alex:** (Leans in, finger tapping the table) But Rita! At the *moment* he offers A-for-C, you prefer A to C! Paying a penny to get C is getting something worse *and* paying for it! Your ‘plan’ forces you to *choose* an option (keeping A) that you admit is *less preferred in that very moment* compared to the alternative action available (trading to C for a penny)! How is deliberately choosing what you *currently* consider worse *at the point of choice* rational? It’s perverse!

  **Rita:** (Meets his gaze steadily) It *feels* perverse synchronicly, Alex. I grant you that. In that isolated moment, trading for C looks like a loss. But rationality isn't confined to isolated moments. My *evaluative perspective* encompasses the entire extended action – staying with A and avoiding the cycle. From *that* perspective, *before* the sequence unfolds, I strictly prefer the outcome of keeping A (cost: $0) to *any* outcome involving trades that lead me back to a fruit I like less than A, minus pennies. Sticking to the plan *is* choosing the outcome I prefer overall.

  **Alex:** But you're smuggling in a preference change! By ‘committing to the plan’, you’re *altering* your synchronic preference at T1! When you resolutely refuse A-for-C, it’s *because* at that moment, you no longer prefer A to C *in the context of the choice*. You prefer keeping A (as part of the plan) to trading to C (which initiates the pump). That’s a *new* preference structure! You’ve dynamically become someone whose preferences *now* satisfy vNM – A > C, period – to avoid the pump. The ‘commitment’ is just the mechanism of change.

  **Rita:** No, Alex. The *preference over outcomes* remains stubbornly cyclical: A > B > C > A. That’s fixed. What changes is my *action* at the choice node, governed by a *decision rule* adopted earlier. The rule is: "When faced with a choice that could initiate a known pump sequence based on my cyclical preferences, choose the action that maintains the status quo." I still *evaluate* C as better than A *in isolation*. But I *choose* to keep A because choosing otherwise leads predictably to a worse overall outcome *by my own lights*. It’s not a preference change; it’s sophisticated action selection based on foresight. I’m choosing *against* my transient, context-blind synchronic preference *for the sake of* my stable, diachronic evaluation of outcomes.

  **Alex:** Sophisticated? It sounds like cognitive dissonance. You’re saying rationality requires you to feel one way (C > A) but *do* the opposite (keep A). How is that stable? What if the bookie offers $100 to trade A for C? Does your ‘plan’ still hold? Where’s the line? Resoluteness seems arbitrary.

  **Rita:** The plan holds if the cost of deviating (the predictable pump losses) outweighs the immediate gain. A $100 offer *might* break the cycle's predictive power – suddenly trading *to* C becomes attractive diachronically too, avoiding the later trades entirely. But for a penny? The predictable loss of two cents plus ending with an inferior fruit (by my *own* outcome preference: A > C!) makes sticking resolute the uniquely rational path. The line is drawn by foresight and consistent valuation. Stability comes from recognizing the trap and binding myself to avoid it.

  **Alex:** (Sighs, swirls the last of his whisky) It still feels like cheating, Rita. You’re defining rationality down. The beauty of the money pump is its simplicity: preferences that lead to predictable, avoidable loss *are* irrational. Full stop. Your ‘resolute chooser’ only avoids the pump by behaving *as if* they have different preferences – by refusing trades they supposedly prefer. That’s indistinguishable from having actually changed to transitive preferences! The trenchcoat is transparent.

  **Rita:** (Finishes her drink) And I think you're defining rationality too narrowly, Alex. You’re privileging the instantaneous moment over the extended self. The pump shows that synchronic rationality can be diachronically *self*-defeating. Resoluteness isn't changing preferences; it's exercising rational *control* over action across time to serve those very preferences. I bite the bullet: yes, at T1, I knowingly choose the synchronicly less-preferred option. But I do it *for* the sake of my larger, consistent evaluation of outcomes. The irrationality isn't in the preferences; it's in the *lack of foresight and self-binding* that lets the bookie exploit them. Avoiding that exploitation *is* rational, even if it feels counter-intuitive in the moment. That’s the cost of diachronic coherence. Now, another round? I think we're just going to have to agree to disagree... and hope no bookies are listening.

  **Alex:** (Chuckles dryly) Fine. One more. But only if *you* pay. Consider it a test of your resolution against immediate loss aversion. (Raises hand for the server).

  **(The unresolved tension hangs in the air, a microcosm of the larger debate.)**
