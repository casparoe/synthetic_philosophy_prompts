prompt: |-
  I'm defending my prospectus in a few weeks (money pumps and diachronic rationality, send help) and want to stress-test my own grip on the debate before then. Write me a dialogue, maybe 600-800 words, between two decision theorists arguing about what a money pump actually shows.

  One of them thinks its decisive: if your preferences are cyclical (or otherwise break the vNM axioms) you can be pumped, full stop, and thats just what it means for those preferences to be irrational. The other is defending something like McClennen's resolute choice -- you get to keep the weird preferences as long as you commit to a plan up front and actually stick to it, even when in the moment you'd rather deviate.

  Set them at a hotel bar after a workshop talk and have them work through an actual case instead of staying abstract -- the standard three-way cycle (prefers A to B, B to C, and C to A) with a bookie charging a cent per swap. I want the resolute-choice person to really bite the bullet that this means sometimes knowingly picking the option they like less at the moment of choice, not dodge it, and I want the other side to push hard on whether "I can see it coming so I just won't trade" is secretly a preference change wearing a trenchcoat. Real back and forth please, and don't make either one a pushover -- they're both sharp people who've clearly had this argument before.
