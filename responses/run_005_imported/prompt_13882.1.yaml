prompt: |-
  So I fell down a youtube rabbit hole this weekend and found this video explaining Kripke's book about Wittgenstein and the "rule-following paradox" thing (I guess ppl online call it "Kripkenstein"?). The example that got me was the plus vs. quus thing — like say you've genuinely never added two numbers bigger than 57 before in your life, and someone asks you what 68+57 is and you answer 125. The video's whole point was that theres no fact about your past brain/mind that actually proves you meant the normal plus function instead of some other function "quus," which works exactly like plus for any numbers under 57 but just spits out 5 once you go over that, since both functions agree on literally every single addition problem you've ever really done before now.

  Me and my friend got into it about this at lunch and we both landed on the same kind of freaked-out conclusion: doesn't this basically prove that math is just made up, and that theres no fact of the matter making 125 the "real" answer instead of 5 or w/e else you want to pick? Like is my teacher technically just enforcing an arbitrary social convention when she marks something wrong on a test, since theres no deeper fact backing up "125" over any other number? I feel like I'm definately missing something about what the paradox is actually supposed to show versus what Kripke's answer to it (the part where he brings in Wittgenstein) is supposed to be, but I can't spot where our reasoning breaks down, if it even does. Can you help me figure out what's actually going on here?
