prompt: |-
  So my friend Priya is getting married next month and asked me to give the toast, and I want to get the framing exactly right instead of just winging it. Backstory that actually matters: Priya and I have both been in the rationalist blog-and-forum world since undergrad (that's half of why she asked me and not one of her cousins), and for years she ran her dating life like an honest-to-god optimal stopping problem -- she'd bring up the secretary problem and the 37% rule from Algorithms to Live By completely unironically, told everyone she was in a deliberate "calibration phase" of dating around and ranking people against each other before she'd let herself commit to anyone, and kept a spreadsheet to make the comparisons rigorous. Then she met Daniel well before her own calibration window was supposed to close, and just stopped searching and married him anyway. When anyone brings this up she just says she satisficed instead of optimized, like thats the end of the discussion, and it's become a running joke in our friend group.

  My actual problem is this: maybe a third of the guests are from that same online world and will catch every reference and expect the toast to say something real about it, but most of the room -- her parents, Daniel's side, coworkers -- have never heard "satisficing" or "optimal stopping" in their lives. I don't want four minutes that quietly implies she settled, because that's the one reading that would actually land badly, and I don't even think it's true -- Herbert Simon's whole point with bounded rationality was that satisficing isn't a failed attempt at optimizing, it's what rationality looks like once you actually take search costs and irreversibility seriously, and a clean secretary-problem search doesn't really fit real dating anyway since you can't un-reject someone and your own ranking keeps shifting as you go. So I want the toast to actually use that distinction structurally -- make the case, through the joke rather than as a lecture, that stopping the search for Daniel was the rational move and not a consolation prize -- while still being warm and short enough that nobody's relatives feel like they wandered into a decision theory seminar. Can you write it?
reasoning: |-
  Okay, the user wants a wedding toast that bridges two worlds: the rationalist community and general guests. Priya's dating history is a running joke about optimal stopping and satisficing, but the toast must avoid implying she settled. 

  First, I need to unpack the core tension. The rationalist friends will expect deep engagement with concepts like the 37% rule and Herbert Simon's bounded rationality, but other guests might misinterpret "satisficing" as settling. The challenge is making the math-to-life metaphor universally accessible without lectures. 

  Hmm... the key insight is framing Daniel as the unexpected solution that collapsed the search problem. Real dating isn't a clean math model - rankings shift, rejections are permanent, and search costs exist. That's why satisficing is smarter than optimization here. 

  For structure: open with warmth (non-math guests), then lightly introduce "Priya's algorithm" as a shared joke. Contrast theoretical perfection vs messy reality, positioning Daniel as the outcome that made the algorithm obsolete. Emphasize that true rationality means knowing when to stop searching. 

  Must avoid: jargon dumps, implying Daniel was "good enough," or over-explaining Simon's theories. Keep it under 4 minutes. The "aha" moment should feel like a revelation, not a lecture. 

  Safety checks: 
  - Parents should hear "love triumphs over spreadsheets" 
  - Rationalists should nod at the bounded rationality subtext 
  - Daniel must feel celebrated, not like a variable in an equation
answer: |-
  Here’s a toast that threads the needle—honors the inside joke for the rationalists, clarifies the "satisficing" misunderstanding warmly, and keeps it universally heartfelt and under 4 minutes:

  ---

  **(Clink glass)**  
  "Hi everyone. For those who don’t know me, I’m [Your Name], and Priya and I have been friends since undergrad. Now, full disclosure: Priya gave me strict parameters for this toast. She said, *‘Make it meaningful, but not sappy. Funny, but not embarrassing. Personal, but not weird.’*  
  *(Pause for laughter)*  
  ...Which, if you know Priya, tracks perfectly. Because long before Daniel, Priya approached dating like a world-class strategist. She had spreadsheets. Calibration phases. She’d cite the *37% Rule* like it was gospel. Her search for ‘the one’ wasn’t just romantic—it was *optimal*.  

  But then... Daniel happened.  
  *(Turn to Daniel)*  
  Daniel, my friend, you showed up *way* ahead of schedule. You crashed Priya’s meticulously planned calibration phase like a delightful, charming meteor. And instead of saying, ‘Sorry, Daniel, you’re statistically premature,’ Priya did something revolutionary: She stopped searching. She called it ‘satisficing.’  

  Now, to some of our friends here *(gesture to rationalist group)*, that’s a technical term. To everyone else, it might sound like she ‘settled.’ Let me be very clear: **She didn’t.**  
  *(Lean in, earnest tone)*  
  Priya didn’t lower her standards. She *redefined* the problem. Because real life isn’t a math puzzle. You can’t revisit past options. Feelings evolve. And sometimes—*especially* when it matters most—true wisdom isn’t about exhausting every possibility. It’s about recognizing something extraordinary when you see it.  

  Daniel, you weren’t ‘good enough.’ You were the answer that made the question irrelevant. You were the moment Priya realized love isn’t about maximizing options—it’s about being *certain*.  

  So let’s raise a glass to the brilliant exception that outsmarted the algorithm. To Priya, for knowing when to close the spreadsheet. And to Daniel, for being so undeniably, joyfully *optimal* that he turned a theorist into a true believer. May your marriage be perfectly satisficing—which, we all now know, is just another word for *perfect*. Cheers!"  

  ---

  ### Why this works:
  1. **Disarms the "settling" worry immediately**  
     Explicitly states "She didn’t settle" and reframes "satisficing" as *upgrading* her approach (aligning with Simon’s bounded rationality).  
  2. **Jokes land for both crowds**  
     Non-rationalists get "spreadsheets = funny overkill"; rationalists get the 37% Rule nod without jargon.  
  3. **Uses Daniel as the punchline**  
     He’s the "delightful meteor" who made the model obsolete—positioning him as the win, not a compromise.  
  4. **Short & warm**  
     No theory lectures. Key ideas ("can’t revisit past options," "certainty > endless search") are woven into story beats.  
  5. **Elevates the couple**  
     Priya’s "wisdom," Daniel’s worth, and their love as the "answer" flips the script from joke to tribute.  

  **Delivery tip:** Smile when saying "statistically premature," pause after "She didn’t," and gesture warmly to Daniel at "you were the answer." Keep eye contact with non-nerds during the "real life isn’t a math puzzle" line.  

  This makes the joke *clarify* their love—not undermine it. Priya’s rationalist friends will feel seen, her aunt will tear up at "certain," and Daniel’s grandma won’t whisper *"What’s a spreadsheet?"*
