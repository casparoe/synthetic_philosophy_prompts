answer: |-
  Let's break this down systematically, addressing each of your three queries. I'll draw on the core arguments from Shoemaker (2001, 2007), Yablo (1992), Kim (1998, 2005), and key critiques.

  ### (1) Why the Subset Account Claims Immunity to Causal Exclusion
  Kim's Exclusion Argument (simplified):
  - Premise 1: Mental property M supervenes on physical property P.
  - Premise 2: M and P are distinct properties (non-identity).
  - Premise 3: P is a sufficient cause for physical effect E.
  - Premise 4: If P is sufficient for E, no *distinct* property M can also be a cause of E unless there is systematic overdetermination (which is implausible for mental/physical relations).
  - Conclusion: M is epiphenomenal (causally excluded).

  **Shoemaker's Subset Response**:
  - **Redefining Realization**: A property M is realized by P *iff* the causal powers of M are a **proper subset** of the causal powers of P. (M's powers are not identical to P's powers, but are wholly contained within them).
  - **Immunity Claim**: Since M's causal powers are literally a *part* of P's causal powers, M and P do not compete for causal efficacy regarding effects within M's power set. When M causes an effect E (e.g., "causing avoidance behavior"), it is *by virtue of* P causing E, but P's causal contribution *includes* M's causal contribution. There is no "distinct sufficient cause" to screen off because M's causation is *constituted by* a subset of P's causation.
  - **Contrast with Mere Supervenience**: Mere supervenience (without subset) allows M and P to have *overlapping but distinct* causal powers. This risks competition: P could "use" powers beyond M's to cause E, making M appear redundant. Subset relations prevent this by making M's powers *internal* to P's.

  **Why Exclusion "Evaporates"?**  
  Your friend is partly correct: If M's powers are a strict subset of P's, then any effect caused by M is *ipso facto* caused by P, and P's causing of that effect *encompasses* M's causing. There is no "overdetermination" because only one causal capacity is at work (P's), but it has a structure: the subset (M) is causally responsible *for a specific subset of effects*. Kim's argument requires distinct competing *sufficient* causes, but here P is sufficient, while M is a *constituent aspect* of P's sufficiency.

  ### (2) Subset vs. Determinable/Determinate: Equivalence or Divergence?
  Yablo (1992) proposed mental properties as *determinables* (e.g., "being in pain") and physical properties as their *determinates* (e.g., "C-fibers firing"). Key constraints for determinables/determinates (D/D):
  - **Non-Co-Instantiation**: Two determinates of the same determinable (e.g., "scarlet" and "crimson") cannot be co-instantiated.
  - **Single Determinable**: A determinate belongs to exactly one determinable (e.g., "scarlet" is a determinate only of "red," not also of "color" directly).
  - **Asymmetric Dependence**: Determinates imply determinables, but not vice versa.

  **Subset Account Similarities**:
  - Both strategies make mental causation *non-competitive* by grounding it in physical causation.
  - Both reject mere supervenience in favor of a stronger relation (subset containment or D/D hierarchy).
  - Both aim to avoid overdetermination while preserving mental efficacy.

  **Critical Divergences**:
  - **Multiple Realizability (MR)**:  
    - *Subset*: Easily handles MR. Different physical realizers (P1, P2) of M can each have powers *containing* M's subset. P1 and P2 may share no powers except those in M's subset.  
    - *D/D*: Struggles with MR. If P1 (human pain) and P2 (octopus pain) are determinates of M (pain), they must both be determinates of the *same* determinable. But P1 and P2 may share few physical properties, violating the requirement that determinates must be "specific ways" of being the determinable.  
  - **Formal Constraints**:  
    - *D/D* requires non-co-instantiation: If P1 and P2 are both present, they cannot realize the same M simultaneously. But in MR, a system could instantiate multiple realizers (e.g., parallel processing). Subset imposes no such restriction.  
    - *Subset* allows a property to be a subset of multiple bases (P1, P2), while D/D demands single determinable membership.  
  - **Primitives**:  
    - *Subset* relies on causal powers (metaphysically weighty but empirically grounded).  
    - *D/D* relies on property relations (abstract but intuitive for some cases).  

  **Verdict**: They are **not notational variants**. The subset account is **strictly more flexible** under multiple realizability and imposes fewer formal constraints. An objection to one may not apply to the other (e.g., MR is a problem for D/D but not subset; D/D's non-co-instantiation may be irrelevant to subset).

  ### (3) Assessing Promisingness Against Kim
  Both strategies are serious contenders, but neither fully escapes Kim's deeper challenge. Here's a comparative assessment:

  | **Strategy**       | **Strengths**                                                                 | **Weaknesses**                                                                                                | **Viability Against Kim**                         |
  |---------------------|------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|---------------------------------------------------|
  | **Subset Account**  | - Handles MR seamlessly.<br>- Grounds mental causation in physical powers without competition. | - Risks trivializing M's distinctness (if M is just "P's powers minus X," is M real?).<br>- Kim: Subsets may still be epiphenomenal if only P's *full* powers are efficacious. | **More promising** due to flexibility with MR. |
  | **D/D Account**     | - Intuitive for some cases (e.g., pain/C-fibers).<br>- Formal constraints clarify property relations. | - MR strains D/D structure.<br>- Mental properties may not neatly fit D/D (e.g., is "pain" a determinable of neural states?).<br>- Kim: Determinates may still "screen off" determinables. | **Less promising** due to MR incompatibility. |

  **Core Problem for Both**:  
  Kim’s unspoken premise is that **causal efficacy requires *independent* causal power**. If M’s powers are a subset of P’s (or M is P’s determinable), then M lacks independent power—it borrows efficacy from P. Kim would argue this *is* epiphenomenalism in disguise: only P is doing the work; M is a shadow. Shoemaker and Yablo counter that subsets/determinables *are* causally real by virtue of structuring P’s efficacy, but Kim remains unconvinced. This reduces to a clash over causal ontology:
  - If you accept Shoemaker/Yablo’s view that properties *are* their causal powers, then subsets/determinables are genuinely efficacious.  
  - If you side with Kim that efficacy requires *fundamental* powers (not structural aspects), both strategies fail.  

  **My View**:  
  The subset account is **more promising** for non-reductive physicalism. It better accommodates multiple realizability and avoids arbitrary D/D constraints. However, both ultimately **succumb to Kim’s challenge** if one demands that causes must be metaphysically independent. The "underlying reason" for failure is that *any* non-reductive strategy must either:  
  (a) Accept systematic overdetermination (implausible),  
  (b) Reduce M to P (collapsing reductionism), or  
  (c) Make M’s efficacy parasitic on P’s (which Kim sees as epiphenomenalism).  

  Shoemaker/Yablo choose (c), insisting parasitism is legitimate. If you reject Kim’s demand for independent powers—as many non-reductivists do—the subset strategy offers the most robust version of (c). But if you find Kim’s premise compelling, no non-reductive solution works. This remains the central stalemate in philosophy of mind.
