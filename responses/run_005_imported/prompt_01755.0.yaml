  For (3), I lean toward subset being slightly more flexible with multiple realizability, since determinables struggle with diverse realizers. But both might fail if Kim insists that only the whole physical causal set is "real" and subsets are epiphenomenal. The user seems to suspect this deeper issue—that non-reductionism can't escape exclusion without collapsing. I should acknowledge that while both have merits, neither fully resolves the tension.

