  For (1), the key is that subset relations don't introduce new causal powers—they're literally parts of the physical powers. So when a mental property is realized, it's not adding extra causation; it's just focusing on a subset of what the physical base is already doing. That's different from supervenience alone, where two distinct properties could have overlapping but separate powers. 

  But the user's worry about triviality is valid. If mental properties are just subsets, are they really distinct? Shoemaker would say yes, because the subset defines a new causal role, but Kim might counter that only the full physical set does real work. I should note this tension.

