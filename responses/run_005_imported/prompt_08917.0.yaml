answer: |-
  You've hit the nail on the head – Newton is absolutely smuggling in his physics (specifically his concept of **Absolute Space**) to do heavy theological lifting in Article 5. This is a prime example of how his scientific and theological views were deeply intertwined. Let's unpack the logic and why immovability was crucial for his anti-Trinitarian argument:

  1.  **Newton's Absolute Space (from Physics):**
      *   In the *Principia* and the *General Scholium*, Newton argued for the existence of **Absolute Space**. This space is:
          *   **Infinite:** Extends everywhere without limit.
          *   **Immutable/Immovable:** It doesn't change, move, or depend on anything else. It is the fixed, eternal stage.
          *   **Eternal & Necessary:** It exists necessarily and eternally as a fundamental aspect of reality.
          *   **God's "Sensorium":** Famously (or infamously), Newton described Absolute Space as "as it were, God's sensorium" – the medium through which God perceives and acts upon the universe. Space is an attribute or necessary consequence of God's existence.

  2.  **Article 5's Theological Claim (Applied Physics):**
      *   Newton directly maps his concept of Absolute Space onto the nature of God the Father:
          *   **"The father is immoveable":** This is the core claim. The Father *is* Absolute Space, or exists in such a fundamental unity with it that He *is* its immovable foundation.
          *   **"no place being capable of becoming emptier or fuller of him then it is by the eternal necessity of nature":** This is the key evidence for immovability. Why can't space be "emptier" or "fuller" of God? **Because God *is* the very container (Space) itself.** You can't have less or more of the container; it simply *is*, uniformly and necessarily present everywhere. If God were a being *within* space, you could imagine Him moving from one place to another, leaving one location "emptier" and making another "fuller" of His presence. Newton argues this is impossible *by the eternal necessity of nature* – meaning it's a fundamental, unchangeable law of reality stemming from God's very essence as Space/Absolute Existence.
          *   **"all other beings are moveable from place to place":** This includes everything *except* the Father: angels, humans, planets, stars, and critically, **Christ**. These beings exist *within* Absolute Space. Their defining characteristic, in contrast to the Father, is that they can change location. They are contingent, dependent beings occupying points within the immovable divine container.

  3.  **Why Immovability = True Divinity (for Newton):**
      *   **Omnipresence:** True divinity requires being *equally and fully present everywhere at once*. If a being is movable, it *cannot* be omnipresent in this absolute sense. When it moves *to* one place, it must, by definition, be *less* present (or even absent) from the place it left. Only the immovable Father/Space is truly omnipresent.
      *   **Aseity (Self-Existence):** True divinity requires complete independence. The Father/Space exists necessarily and eternally by His own nature. A movable being, by contrast, depends on the pre-existing, immovable Space *in which* it moves. Its existence and location are contingent. Christ, being moveable, is therefore dependent on the Father/Space.
      *   **Immutability (Unchangeability):** True divinity is perfect and unchanging. Movement implies change – a change of state, location, or relation. The Father/Space is utterly unchanging. Christ's movement (e.g., descending from heaven, ascending, moving among people) demonstrates mutability.
      *   **Monotheism & Uniqueness:** Newton was a strict monotheist (Unitarian). For him, there could only be *one* being possessing these absolute attributes: necessary existence, immutability, immovability, and true omnipresence. This being is the Father, identified with Absolute Space. To ascribe these same attributes to Christ (as Trinitarians did) would, for Newton, either imply two Gods (polytheism) or confuse the fundamental nature of the one true God.

  4.  **Why it's a Powerful Anti-Trinitarian Move:**
      *   **Objective Criterion:** Newton grounds the distinction between Creator and creature in a seemingly objective, physical-metaphysical principle derived from his physics. It's not just a scriptural interpretation; it's presented as a *law of nature* about how reality *must* be structured.
      *   **Clear Demarcation:** It creates a sharp, unambiguous line. Only the immovable being (the Father/Space) is truly God. *All* other beings, without exception (including the pre-existent Logos/Christ), are moveable creatures *within* that space. Christ's movability (attested in scripture – ascending, descending, walking, etc.) is irrefutable proof, for Newton, that He belongs to the category of created, dependent beings, not the unique, absolute Godhead.
      *   **Subordinationism:** It enforces a radical subordination of Christ to the Father. Christ operates *within* the Father's absolute framework (Space). His power and existence are derived, not original.
      *   **Coherence with his System:** It integrates his revolutionary physics seamlessly with his core theological belief (Unitarianism). God *is* the absolute framework he discovered governing the physical universe.

  **In essence, Newton's logic is:**

  1.  True divinity requires absolute, necessary, immutable omnipresence.
  2.  Absolute omnipresence requires being identical to, or the fundamental ground of, the container of all things (Absolute Space).
  3.  The defining characteristic of this Absolute Space/True God is **Immovability** (you can't have less or more of it anywhere).
  4.  All beings that can move from place to place demonstrably exist *within* this container and are therefore dependent and not the Absolute God.
  5.  Christ demonstrably moves from place to place (Scripture).
  6.  **Therefore, Christ exists *within* the Absolute Space/God, is moveable, dependent, and not the Absolute God (the Father).**

  Newton wasn't just *borrowing* from physics; he saw his physics as revealing the very nature of God the Father. Article 5 uses this revelation to draw an ontological line in the sand: **Immovability, understood as the necessary, uniform plenitude of Absolute Space, is the defining, exclusive attribute of the One True God (the Father), forever separating Him from all other beings, including Christ.** This was the "scientific" core of his heretical Unitarianism.
