answer: |-
  You've hit on one of the most nuanced debates in Indian epistemology! Nyāya's defense of *upamāna* (comparison) while rejecting *arthāpatti* (postulation) and *anupalabdhi* (non-cognition) as independent *pramāṇas* isn't arbitrary, but rests on specific epistemological distinctions about the *structure* and *source* of cognition. Let's break it down at the "gears-level," focusing on irreducibility:

  ### 1. **Upamāna (Comparison): Why Irreducible?**
     * **The Cognition:** Knowing the similarity between a previously described but unseen thing (e.g., a *gavaya*) and a presently perceived thing (e.g., a cow). *"This animal I see now resembles the gavaya I heard described."*
     * **Nyāya's Irreducibility Argument:**
       * **Not Perception (Pratyakṣa):** You don't perceive the *gavaya* itself; you perceive the cow. The resemblance is a relational property grasped *via* the perception of the cow *in light of* the prior description.
       * **Not Inference (Anumāna):** There's no universal premise (*vyāpti*) like "All things described as 'like a cow' *are* like cows." The knowledge arises directly from the *perception of similarity* triggered by the prior description, not a logical syllogism.
       * **Not Testimony (Śabda):** The initial testimony ("A gavaya is like a cow") gives you a *description*, not *knowledge of the specific resemblance* upon seeing the animal. Testimony provides the concept; *upamāna* provides the *recognition of its instantiation* in perception. The cognition *connecting* the description to the perceived object is unique.
     * **The Core:** *Upamāna* delivers knowledge of a *relational property* (similarity) generated by the *interaction* between a verbal description (śabda) and a current perception (pratyakṣa). Neither source alone suffices, and the cognition isn't inferential.

  ### 2. **Arthāpatti (Postulation): Why Reducible to Inference?**
     * **The Cognition:** Resolving a contradiction between two known facts by postulating a third. *"Devadatta is fat" + "Devadatta doesn't eat during the day" → "Therefore, Devadatta must eat at night."*
     * **Nyāya's Reduction Argument:**
       * **It's a Specific Type of Inference (Kevalavyatireki Anumāna):** Nyāya sees this as inference based on invariable exclusion.
          * *Hetu (Reason):* Devadatta's fatness (known by perception).
          * *Sādhya (Probandum):* Eating at night.
          * *Vyāpti (Universal Connection):* "Fatness without eating during the day *must invariably be caused by* eating at night." (This invariable connection is known through prior experience/causal understanding).
          * *Pakṣa (Subject):* Devadatta.
       * **No New Cognitive Process:** The knowledge "He eats at night" arises from *inferring* the necessary condition to resolve the incompatibility of the two known facts. The "postulation" *is* the conclusion of the inference. The sense of "compulsion" comes from the logical force of the inference based on the vyāpti.
       * **Mīmāṃsā Objection:** Mīmāṃsā argues that the cognition is *immediate* and non-syllogistic – the night-eating *immediately* presents itself as the only solution. Nyāya counters that this immediacy is just the *subjective feel* of a valid inference based on a strong, well-established vyāpti.
     * **The Core:** *Arthāpatti* is seen by Nyāya as a *logical necessity* derived *from* the incompatibility of known facts, mediated by a universal causal/existential principle (vyāpti). This falls squarely within the domain of *anumāna*.

  ### 3. **Anupalabdhi (Non-Cognition): Why Reducible to Perception?**
     * **The Cognition:** Knowing the *absence* of something. *"There is no pot on the floor."*
     * **Nyāya's Reduction Argument:**
       * **Absence is a Perceivable Entity (Bhāvābhāva):** Nyāya ontology holds that absence (*abhāva*) is a real category, knowable in its own right. It's not just "lack of knowledge of presence."
       * **Perception of Absence (Prātyakṣika Abhāva):** When the conditions for perceiving a pot are met (adequate light, functioning senses, attention directed to the floor), and the pot is *not* perceived, this *non-perception itself* is the means of knowing the pot's absence. It's a direct, non-inferential awareness: *"I see the floor and do not see a pot."*
       * **Not Inference:** While you *could* frame an inference ("If a pot were here, I'd see it; I don't see it; therefore, it's not here"), Nyāya argues this is unnecessary. The *primary* and direct knowledge comes from the *sensory experience of the absence* under suitable conditions. The inference is secondary.
       * **Mīmāṃsā Objection:** Mīmāṃsā argues that absence isn't a "thing" you perceive; knowledge of absence arises from the *failure* of the means to know presence (e.g., perception fails to apprehend a pot). This failure, they argue, is a distinct process (*pramāṇa*). Nyāya counters that the cognition produced *is* "I perceive the absence," making perception the means.
     * **The Core:** *Anupalabdhi* is simply the *functioning of perception* under conditions where the *object of potential perception is absent*. The knowledge gained is the perception *of that absence* as a positive epistemic object. No distinct *pramāṇa* is needed.

  ### Why Nyāya's Line Isn't *Entirely* Arbitrary (But Why Your Friend Has a Point)

  1.  **Structural Differences:** Nyāya identifies genuinely distinct cognitive structures:
      *   *Upamāna:* Unique cognition of a *similarity relation* arising from the *interplay* of testimony and perception.
      *   *Arthāpatti:* Cognition of a *logically necessary condition* derived from incompatibility + universal principle (Inference).
      *   *Anupalabdhi:* Cognition of *absence* as a direct object of perception under appropriate conditions.
      The "work" each does *is* different: establishing resemblance, resolving contradiction via necessity, and apprehending non-existence.

  2.  **Parsimony Principle:** Nyāya aims for the minimal necessary set of fundamental *pramāṇas*. If a cognition can be explained by the operation of an existing *pramāṇa* (even if requiring a specific subtype like perception-of-absence or a negative inference), they prefer that over multiplying entities.

  3.  **Ontological Commitments:** Nyāya's realism about absence (*abhāva*) directly supports reducing *anupalabdhi* to perception. Their view of logical necessity supports reducing *arthāpatti* to inference.

  ### Why Your Friend's "Arbitrary" Charge Has Merit

  1.  **The "Irreducibility" Move is Symmetric:** Mimamsa uses *exactly the same logic* as Nyāya uses for *upamāna* to argue for *arthāpatti* and *anupalabdhi*: "Try explaining cognition X using only your four *pramāṇas*; see, it doesn't fully capture the immediacy/uniqueness!" Nyāya's counter-reductions can feel like special pleading or forcing complex cases into predefined boxes.
  2.  **Subjectivity of "Immediacy":** Nyāya dismisses Mimamsa's claim of the "immediate" compulsion in *arthāpatti* as just the feeling of a strong inference. Mimamsa could equally dismiss Nyāya's claim about the immediacy of the resemblance cognition in *upamāna* as just a fast inference based on the description.
  3.  **Reduction vs. Independence:** Whether *arthāpatti* is a *type* of inference or a distinct *pramāṇa* is partly a matter of emphasis. Nyāya emphasizes the underlying logical structure; Mimamsa emphasizes the unique phenomenological experience and cognitive work of resolving contradictions. Similarly, whether absence is *perceived* or known by a *distinct process of non-apprehension* hinges on subtle ontological/epistemological choices. Neither view is self-evidently "wrong."
  4.  **Historical/Doctrinal Factors:** Nyāya's commitment to four *pramāṇas* predates the intense debate with Mimamsa. There *is* an element of defending established doctrine. Mimamsa, focused on interpreting Vedic ritual injunctions, found *arthāpatti* crucial for resolving textual ambiguities, giving them motivation to elevate it.

  ### Conclusion

  Nyāya has a **principled, internally consistent** reason for its *pramāṇa* list: distinct cognitive structures for *upamāna* vs. reducibility based on ontology and logic for *arthāpatti* and *anupalabdhi*. Their analyses of the specific epistemic mechanisms in each case are sophisticated and defensible.

  **However,** your friend is also right that the **charge of arbitrariness isn't baseless.** The debate hinges on:
  *   How strictly one defines the boundaries of perception/inference.
  *   How much weight one gives to the subjective "feel" or immediacy of a cognition vs. its underlying logical structure.
  *   Ontological commitments (e.g., is absence a real perceivable thing?).
  *   Philosophical temperament (parsimony vs. phenomenological richness).

  It's less that Nyāya is "arbitrary" and more that **the line between a unique fundamental *pramāṇa* and a complex subtype of an existing one is inherently contestable.** Mimamsa's arguments are strong precisely because they exploit the same irreducibility logic Nyāya champions for *upamāna*. Your fumbling was understandable – this is graduate-level epistemology! The best answer lies in appreciating the depth of *both* positions: Nyāya's logical rigor *and* Mimamsa's phenomenological insight. The debate itself reveals the richness of the Indian epistemological tradition. Next coffee chat, try framing it as two valid perspectives stemming from different philosophical priorities!
