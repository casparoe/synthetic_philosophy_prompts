prompt: |-
  So I'm taking a seminar on classical Indian philosophy this term, and after our session on Nyaya epistemology a friend from class and I ended up arguing about the pramana list for like an hour at the coffee place afterward. She thinks Nyaya's decision to stop at four pramanas (perception, inference, comparison, testimony) is kind of arbitrary, since the Mimamsakas turn around and add postulation (arthapatti) and non-cognition (anupalabdhi) as further independent means of knowledge, using basically the same "you can't reduce this to the other three" move that Nyaya uses to defend upamana in the first place. I kept insisting there IS a principled reason Nyaya draws the line where it does -- that the gavaya case for upamana is doing genuinely different work than the fat-Devadatta-eats-at-night case for arthapatti, or the no-pot-on-the-floor case for anupalabdhi -- but when she pushed me to actually spell out that difference I sort of fumbled it and we never resolved it, she just said I was making up a distinction to save my side.

  Can you walk me through this properly? I don't need the basic textbook list with examples, I already have that from lecture -- what I actually want is the gears-level version of why Nyaya thinks upamana resists reduction to inference or testimony, while insisting arthapatti reduces to inference and anupalabdhi reduces to a form of perception. Like, what's actually different about the structure of the cognition in each case that makes Nyaya treat these three so differently, when on the surface they all look like "here's a cognition you can't get from the other pramanas alone"? And honestly, if after laying it out you think my friends "it's kind of arbitrary" charge has more going for it than I gave her credit for, I'd genuinely like to hear that too -- I'm not looking for you to just vindicate my side of the argument.
