  2. **Leah (+2):** Correctly identifies the core of Douglass's method: a principled legal argument invoking *interpretive canons* (ambiguity resolved for justice) and the *Preamble's purpose*. This isn't trickery; it's textualist-purposivism grounded in the document's own words ("Justice," "Liberty"). She accurately frames Douglass's move as legal construction.
  3. **Marcus (0):** Raises a *valid concern* about interpretive subjectivity if "justice" overrides all original understanding ("moral wish-fulfillment"), a key critique of strong purposivism. However, he unfairly dismisses Douglass's principle as *only* politically motivated. Douglass *was* making a legal argument, and the timing reflects his evolving *interpretive* insight, not merely political convenience. His point proves *something* (caution is needed), but not *too much* against Douglass's specific textual/purpose-based approach.
  4. **Leah (+1):** Correctly identifies the genetic fallacy – Douglass's motives don't invalidate his argument. Also right that Garrison relied on powerful *theological/moral rhetoric* rather than detailed legal interpretation. However, this doesn't *refute* Marcus's substantive point about the difficulty of reading euphemistic proslavery clauses as anti-slavery. She scores on logic/rhetoric but sidesteps the core interpretive tension.
  5. **Marcus (-1):** While the "embarrassment vs. opposition" distinction is perceptive and historically plausible, he *misstates the burden*. Leah/Douglass *don't* claim the clauses are "best read as opposition." Douglass argued they were *legally vulnerable* and *should be read restrictively* because the text *avoided legitimizing slavery* and the *Preamble's principles condemned it*. Marcus demands Leah prove the impossible (that the clauses *were* anti-slavery), ignoring Douglass's actual strategy: using textual silence + higher principles to *undermine* the proslavery clauses' moral/legal foundation and limit their scope. He conflates Douglass's nuanced legal/political strategy with a claim about original meaning.

  **The Deeper Interpretive Issue: The Constitution's Foundational Ambiguity & the Role of Principles**

  Neither fully grappled with the Constitution's **inherent tension as both a *compromising political pact* (reflecting 1787's realities, including slavery's protection) and a *foundational normative charter* (articulating abstract principles of Justice and Liberty).** This creates a permanent interpretive fissure:

  1.  **The Pact View:** Focuses on *original compromises*, historical understanding, and operational clauses (like the Fugitive Slave Clause). This view sees the proslavery provisions as the document's *operative reality* at ratification. Interpreting them away seems like rewriting the deal (Marcus leans here).
  2.  **The Charter View:** Focuses on the *aspirational principles* declared in the Preamble and structures like Due Process. It sees the text's *silence* on slavery's moral status and its euphemisms as an opening, even an *invitation*, to interpret specific clauses narrowly or in conflict with the higher principles, allowing the Charter to eventually overcome the compromises of the Pact (Douglass/Leah lean here).

  The core conflict is: **Can (or must) the Charter's declared principles actively constrain or negate the operational compromises made within the Pact, even when those compromises were historically understood and intended?** Douglass's genius was forcing this question by arguing that the Charter's principles *were* part of the text's legal meaning, not just rhetoric, and thus provided an internal mechanism (via interpretive canons) for challenging the Pact's injustices. This foreshadows modern debates about whether the Constitution is primarily a historical artifact or a "living" framework oriented toward its stated ends, and whether principles like those in the Preamble have genuine legal force in constraining specific provisions. The debate isn't just about slavery or 1850; it's about the fundamental nature of constitutional meaning across time.
