  Ok so this has been bugging me since last week and even my friends couldn't agree. In English class we're reading one of those classic novels set in the South a long time ago that uses a really nasty racial slur over and over (not gonna type the actual word, but you know the one I mean). Whenever my teacher reads a passage out loud she always skips it and says "n-word" instead, but shes completely fine with all of us silently reading the actual word ourselves right off the page, since its printed like 40+ times in the book she assigned us. Some kids in my class think thats kind of inconsistent — like if the word sitting right there on the page is fine, and us reading it silently in our own heads is fine, why does it suddenly become not okay the second its said out loud, especially when nobody's using it to actually call someone that, we're literally just quoting what the book says? Other kids think it doesn't matter that you're "just quoting," saying it out loud is different, period, no exceptions.

  I brought it up with my older sister who's away at college and she just said "obviously it's different" but couldn't actually explain why, which lol wasn't super helpful. So is there an actual real difference between silently reading a word, saying it out loud as a direct quote with zero intention of insulting anyone, and saying it TO insult someone? Or is my teacher just picking an arbitrary line to feel safe, and it doesn't really hold up if you think about it?
