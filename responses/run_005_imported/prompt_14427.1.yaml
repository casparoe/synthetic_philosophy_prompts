  C Tier: Solutions that don't really solve the problem but might be seen as workarounds or partial.

  - Drop strict Bayesianism: This isn't a solution within Bayesianism but an abandonment. So it doesn't solve the problem for Bayesian confirmation theory.

  D Tier: Solutions that don't solve the problem and are more of a denial or a meta-critique.

  - Bite the bullet: This denies the intuition that old evidence confirms. So it doesn't solve the problem, it just says there is no problem.
  - Earman's skeptical move: This is a critique that none of the solutions work and the framework is flawed. It doesn't solve the problem but suggests we need a different framework.

  However, note that Earman's move is a critique of the entire project, so it doesn't offer a solution per se.

