prompt: |-
  Quick one from formal epistemology. The "problem of old evidence" (Glymour's challenge to Bayesian confirmation theory: if P(E) is already 1 by the time you cook up hypothesis H, how can E still confirm H? classic case is Mercury's perihelion precession confirming general relativity decades after the anomaly was already known) has accumulated a pile of proposed fixes over the years, and honestly I can never tell wich ones actually solve the thing vs. which just relabel it. Can you rank the following by how well they actually solve the problem, as opposed to dissolving it or changing the subject?

  - Garber-style: relativize to logical/mathematical non-omniscience, so realizing "H entails E" counts as new info even though E itself was already known
  - Eells-style: cash out confirmation via a counterfactual/historical credence in E (what you'd have believed absent H), not your actual current credence
  - Keep two credence functions around, an actual one and an "ur-prior" that hasn't absorbed E yet, and define confirmation off the latter
  - Bite the bullet: deny old evidence really confirms anything, and explain away the Mercury intuition as tracking something else (explanatory unification, boosted confidence in auxiliary hypotheses, etc)
  - Drop strict Bayesian confirmation for an explanationist or likelihoodist account that doesn't care whether P(E)=1
  - Earman's skeptical move: none of the patches fully work, and the whole episode shows synchronic Bayesian confirmation just isn't the right tool for this kind of case

  Give it to me as a JSON block, tiered S (actually solves the problem) down to D (doesn't really help), like:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```

  multiple entries per tier is fine and tiers can be left empty
reasoning: |-
  We are ranking the proposed solutions to the problem of old evidence in Bayesian confirmation theory. The problem is that if evidence E is already known (so P(E)=1), then by Bayes' theorem, P(H|E) = P(H) and E does not confirm H. But intuitively, old evidence can confirm a new hypothesis (like Mercury's perihelion precession confirming general relativity).

  We are to rank the following solutions:

  1. Garber-style: Relativize to logical non-omniscience. The idea is that even though E is known, the logical fact that H entails E might not be known. So when we learn that H entails E, that can be new evidence.

  2. Eells-style: Use a counterfactual credence for E. Instead of using the current credence in E (which is 1), we use what our credence in E would have been without H. Then we can see if that counterfactual credence is less than 1, so that E would have confirmed H.

  3. Keep two credence functions: an actual one and an "ur-prior" (a prior before learning E). Then we use the ur-prior to compute confirmation.

  4. Bite the bullet: Deny that old evidence confirms and explain away the intuition (e.g., by explanatory unification, etc.).

  5. Drop strict Bayesianism: Use an explanationist or likelihoodist account that doesn't require P(E) < 1.

  6. Earman's skeptical move: Argue that none of the patches work and synchronic Bayesianism isn't the right tool.

  We are to rank these in tiers: S (solves the problem), A, B, C, D (doesn't really help).

  Analysis:

  - Garber-style: This is a popular solution. It addresses the problem by noting that we are not logically omniscient, so learning the logical connection is new evidence. This seems to solve the problem without changing the subject. However, it requires that we model the agent's uncertainty about logical truths, which is non-standard and might be seen as a bit of a workaround. Still, it is widely regarded as a genuine solution.

  - Eells-style: The counterfactual approach. This avoids the problem by considering what the agent's credence in E would have been without H. The issue is that counterfactual credences are not well-defined and can be arbitrary. Also, it's not clear how to set up the counterfactual scenario. This is often seen as a step in the right direction but problematic.

  - Two credence functions (ur-prior): This is a common solution. We use an initial credence function (before learning E) to compute the confirmation. This is straightforward and directly addresses the problem. The challenge is that we might not have access to the ur-prior, and it might be hard to specify. But in principle, it solves the problem.

  - Bite the bullet: This doesn't solve the problem; it denies that there is a problem. So it's not a solution but a rejection of the intuition. This might be acceptable to some, but it doesn't solve the problem as posed.

  - Drop strict Bayesianism: This changes the subject by moving to a different theory of confirmation. It "solves" the problem by not being Bayesian. But the challenge is to Bayesian confirmation theory, so this is more of an abandonment than a solution.

  - Earman's skeptical move: This is a meta-skepticism. It says that the problem is not solvable within synchronic Bayesianism. It doesn't solve the problem but points out that the framework is flawed.

  Ranking:

  S Tier: Solutions that directly and effectively solve the problem without major drawbacks.

  - Garber-style: This is a genuine solution that is widely discussed and accepted by many. It keeps the Bayesian framework and addresses the issue by expanding the evidence to include logical learning.
  - Two credence functions (ur-prior): This is also a standard solution. By reverting to a prior before learning E, we can compute the impact of E on H. This is a clean solution.

  A Tier: Solutions that solve the problem but with some issues or less acceptance.

  - Eells-style: The counterfactual approach is a valid idea but has problems in implementation. It's not as straightforward as the ur-prior, but it does address the issue.

  B Tier: Solutions that partially address the problem but have significant drawbacks.

