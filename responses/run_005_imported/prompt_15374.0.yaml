answer: |-
  ## Dialogue: The Moving Target & The Buried Kind

  **Setting:** The bustling hallway outside a university conference room, immediately following a workshop on the adolescent tic clusters. Coffee cups in hand.

  **Characters:**
  *   **Dr. Aris Thorne:** Mid-50s, sharp eyes behind wire-rimmed glasses, tweed jacket slightly rumpled. Favors historical context and conceptual rigor. Skeptical of the "natural kind" status of most psychiatric diagnoses.
  *   **Dr. Lena Voss:** Late 40s, energetic, wears a sleek modern suit. Background in neuroscience and philosophy of science. Believes in underlying biological kinds obscured by current diagnostic noise.

  **(The chatter of departing attendees fades as Thorne and Voss step slightly aside.)**

  **Thorne:** ...So, another presentation that ends with a genuflection to Hacking’s "looping effects" as if it were the final word. "Dynamic nominalism settles it!" they say, then vanish before anyone asks *what* it settles, or *how*.

  **Voss:** (Sighs, takes a sip of coffee) Aris, it *is* powerful. You saw the data. These tic clusters bloom where TikTok trends spread. Girls mimicking specific, complex tics seen online – ones vanishingly rare in organic Tourette’s. The ADHD self-diagnosis boom after #ADHDLifeExplained videos? The DID plurality communities forming around shared symptom lists? Hacking gives us the *language* for how the classification reshapes the behavior, which then reshapes the classification. It’s a feedback loop, undeniable.

  **Thorne:** Deniable? No. Definitive? Hardly. What irks me, Lena, is how it gets wielded as a *trump card* against the very *possibility* of natural kinds in psychiatry. As if the mere existence of looping proves ADHD, or DID, or even this new functional tic phenomenon, *cannot* be tracking a stable underlying biological reality, *even in principle*, no matter what neuroscience finds. That’s the leap I can’t make.

  **Voss:** It’s not a leap, it’s a consequence. Hacking’s point about "moving targets" is crucial. If the *very phenomenon* you’re trying to classify changes its nature *because* of the classification – if teens develop tics *because* they’ve internalized the "Tourette’s influencer" persona, or interpret their distractibility as "ADHD" *because* they’ve seen it framed that way endlessly – how can that phenomenon *be* a natural kind? Natural kinds are supposed to be indifferent to our descriptions! Water is H₂O regardless of what we call it. But "ADHD-as-experienced-by-Gen-Z-post-TikTok-binge"? That *is* constituted by the social meaning!

  **Thorne:** I grant the constitution *in part*. But you’re conflating the *presentation* with the *underlying cause*. Looping affects the *expression*, the *salience*, the *interpretation* of symptoms. It layers social meaning onto a biological substrate. The RDoC approach – focusing on domains like attention control, reward processing, neural circuits – aims to peel back that layer. *That* substrate, once identified, *is* the indifferent kind. The looping is noise on the signal, eventually removable.

  **Thorne:** (Leans in) Removable? Alright, Lena, let’s get concrete. Suppose, through heroic RDoC efforts, you isolate a specific neural circuit dysfunction, a precise biomarker profile, strongly correlated with core attentional dysregulation and hyperactivity. You declare: *This* is the real ADHD kind! What happens next?

  **Voss:** We refine diagnosis, target treatments more effectively, understand etiology...

  **Thorne:** Precisely! And *that* new knowledge, disseminated through media, schools, clinics, changes the *looping dynamics* again! Now people know "Real ADHD = Biomarker X." Some who previously identified strongly with the social-media-ADHD persona might dis-identify if they lack the biomarker. Others with the biomarker might start interpreting minor lapses as "symptoms." New support groups form around "Biomarker X Positive." The *social meaning* of the diagnosis shifts, the *behaviors* associated with it might subtly shift, the *boundaries* are redrawn based on this new scientific framing. The target *keeps moving*. How has neuroscience stopped the loop? It just provided a new input!

  **Voss:** You’re describing scientific progress and its social consequences, not disproving the underlying kind! The circuit dysfunction *itself* – the core biological mechanism causing attentional failure – that remains indifferent. The *looping* is happening *around* that core. It’s messy, but the core is stable.

  **Thorne:** But does the "core" exist independently of the loop *at all*? Take your uncontroversial biological case: general paresis. Cause: Treponema pallidum. Clear biomarker: syphilitic infection. Clear, devastating symptom profile. *Seems* like a paradigm indifferent kind. But... think historically. Before the spirochete was found, paresis *had* a looping history! It was initially diagnosed based on behavior – grandiosity, paralysis, dementia. That diagnosis carried immense stigma, shaping how patients were perceived and treated, potentially influencing their presentation. Once the cause was found, the *looping largely stopped* because the classification became anchored to a definitive, indifferent biological state. The social meaning stabilized because the biological anchor was unshakeable.

  **Voss:** Exactly! Proof that looping *can* be resolved by finding the biological bedrock!

  **Thorne:** Or proof that *some* loops, anchored to *specific* types of biological causes with *direct* and *unambiguous* pathological consequences, *can* settle. But does that apply to ADHD? To DID? To functional tics? Where is the unambiguous biological lesion? Where is the single, specific cause? The symptom profile of paresis was tightly coupled to a single, devastating neuropathological process. Is "difficulty sustaining attention on non-preferred tasks" coupled that tightly to one specific neural circuit dysfunction? Or is it a final common pathway for dozens of potential genetic, epigenetic, environmental insults – a pathway massively influenced by expectation, culture, and now, social media algorithms?

  **Voss:** So your argument boils down to complexity and multifinality? Because ADHD *might* be heterogeneous, because its symptoms *might* be more dissociable from a single core deficit than paresis's symptoms were, looping *must* fundamentally contaminate its status as a kind? That seems like pessimism disguised as principle.

  **Thorne:** And yours seems like faith disguised as realism! My point is that the *nature of the phenomenon itself* in psychiatry – often involving higher-order cognition, emotion, volition, deeply embedded in social context – makes it *inherently susceptible* to looping in a way that a straightforward infectious disease affecting motor neurons is not. The looping isn't just a removable layer of "noise"; it's woven into the *fabric* of the phenomenon. Finding biomarkers might explain *mechanisms*, but it won't necessarily stop the meaning-making, the identity-formation, the social feedback that dynamically reshapes the *experience* and *expression* of the condition. For "ADHD" to be a natural kind like "water," it would need to be indifferent not just to the label, but to the entire social-intentional milieu in which it manifests. How can a phenomenon *defined* by its impact on socially embedded cognition *ever* achieve that indifference?

  **Voss:** (Pauses, thinking) So... the disagreement might be less about the *empirical facts* of looping – we both grant it happens powerfully – and more about the *definition* of a "natural kind" itself, and whether such a concept can *ever* apply meaningfully to phenomena that are inherently person-level, meaning-laden, and embedded in culture? You’re saying the *kind* of thing ADHD *is* precludes it from being an indifferent kind, regardless of biomarker progress?

  **Thorne:** Precisely. Hacking’s brilliance was showing that *human kinds* are fundamentally different. They are *interactive*. Trying to force them into the mold of chemical or simple biological kinds is a category error. Finding neural correlates won't erase that interactivity; it will just become a new factor *within* the loop. The "kindness" of ADHD lies not solely in biology, but in the unstable, dynamic interplay between biology, psychology, and the social world – including the world of diagnostic labels and TikTok videos. It *is* a moving target. Neuroscience might map the trajectory more precisely, but it won't stop the movement. Calling it a "natural kind" obscures more than it reveals about its true, complex nature.

  **Voss:** (Nods slowly, a thoughtful frown replacing her earlier certainty) And I suppose... insisting it *must* be a natural kind waiting to be uncovered risks blinding us to the profound ways the social and the diagnostic actively *constitute* the phenomenon we study. Maybe the "empirical stakes" aren't just about *finding* the biomarkers, but about understanding how biomarkers *function* within these complex, looping systems... and whether "stability" in such systems looks fundamentally different from stability in physics or chemistry.

  **Thorne:** (A slight, wry smile) Now *that*, Lena, sounds like the start of a genuinely interesting conversation, not just a recitation of book titles. Another coffee? I think we've earned it.

  **Voss:** (Returns the smile, a spark of renewed intellectual engagement in her eyes) Lead the way, Aris. This moving target isn't done with us yet.

  **(They walk towards the coffee urn, the unresolved tension now a shared space for deeper inquiry.)**
