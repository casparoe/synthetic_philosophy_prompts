answer: |-
  The issue here stems from a misunderstanding of how expected value works in multiplicative processes like this coin flip game. While the expected value per round is indeed positive (a 5% gain on average, since \(0.5 \times 1.60 + 0.5 \times 0.50 = 1.05\)), this doesn't guarantee long-term growth when you reinvest 100% of your pot each round. The key problem is that the expected value calculation can be misleading for compounded bets because it doesn't account for the volatility and the asymmetric impact of losses on your pot size over time. Instead, the long-term outcome depends on the expected logarithm of the growth rate (often called the geometric mean or log return).

  ### Why the Expected Value is Misleading
  - **Positive expected value per round**: Each round, the expected multiplicative factor is 1.05, meaning if you start with $100, the average outcome after one round is $105. This suggests growth over time.
  - **But the log return is negative**: To understand long-term growth, we need to look at the expected value of the log return. Calculate it as follows:
    - Heads (probability 0.5): multiplier = 1.60, log multiplier ≈ ln(1.60) ≈ 0.4700
    - Tails (probability 0.5): multiplier = 0.50, log multiplier ≈ ln(0.50) ≈ -0.6931
    - Expected log return = (0.5 × 0.4700) + (0.5 × -0.6931) ≈ 0.2350 - 0.34655 = -0.11155
  - A negative expected log return (≈ -11.16% per round) means that over many rounds, your pot will almost surely decay to zero. This happens because losses (which reduce your pot by 50%) have a larger proportional impact in log space than gains (which increase it by 60%), especially when compounded. The product of the multipliers (1.60 × 0.50 = 0.80 < 1) confirms that the typical outcome shrinks the pot.

  ### Why Your Teammate Is Losing Money
  - **Short-term vs. long-term outcomes**: In the short run, a few rounds can result in a profit if you get lucky (e.g., more heads than tails). For example:
    - After 1 round: 50% chance of $160 (up 60%), 50% chance of $50 (down 50%).
    - After 2 rounds: 25% chance of $256 (up 156%), 50% chance of $80 (down 20%), 25% chance of $25 (down 75%).
    - The "couple people who only played a round or two" got lucky and came out ahead due to variance.
  - **Long run decay**: Over many rounds (e.g., months of daily play), the negative expected log return dominates. The pot size follows a multiplicative random walk, and with E[log return] < 0, it tends toward zero with probability approaching 1 as rounds increase. Your teammate's experience of being "down to almost nothing" is not just bad variance—it's the expected outcome for someone who plays repeatedly with full reinvestment.
  - **Skewed distribution**: The expected value (1.05 per round) grows exponentially, but this is driven by a small probability of extremely high outcomes (e.g., a long streak of heads). Meanwhile, the median outcome (the typical experience) decays to zero. For example:
    - After 100 rounds, the probability of being ahead is only about 2.3% (based on binomial calculations).
    - After 1000 rounds, it's virtually impossible to be ahead. Yet the expected pot size is large because of those rare huge wins, which don't happen in practice for most people.

  ### Should You Join with the Same Approach?
  - **No, you should not trust the expected value math here**. The hole in your teammate's reasoning is that he focused only on the arithmetic mean (expected value) but ignored the geometric mean (expected log return), which determines long-term growth. This is a classic pitfall in gambling and investing, similar to the "Kelly criterion" concept, which shows that full reinvestment is only optimal if the expected log return is positive.
  - **If you play many rounds**: You are very likely to lose most of your money, just like your teammate. The strategy of always reinvesting 100% is mathematically flawed for this specific bet because E[log return] < 0.
  - **If you play a few rounds for fun**: You might get lucky and come out ahead, but this is due to short-term variance and not a sustainable strategy. It doesn't change the fact that long-term play with full reinvestment loses.
  - **A better approach (if you insist on playing)**: To maximize long-term growth, you should bet a fraction of your pot that makes E[log return] positive. For this game, since E[log return] for 100% reinvestment is negative, you'd need to bet less than 100%. However, calculating the optimal fraction is complex and depends on risk tolerance. Alternatively, you could set a stop-loss or play only occasionally without reinvesting all winnings, but the game itself has a negative growth rate at full reinvestment, so it's best avoided.

  In summary, your teammate's belief in "bad variance" is incorrect—the math does not guarantee he'll come out on top eventually. In fact, the opposite is true: continuous play with full reinvestment leads to near-certain ruin. Don't join this bet with the same approach. If you want to understand this better, look up topics like "volatility drag," "geometric mean return," or the "Kelly criterion" in the context of repeated bets.
