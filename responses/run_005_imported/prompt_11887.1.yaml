answer: |-
  Here’s a structured interview plan with 8 targeted questions, predicted answers, and sharp follow-ups designed to challenge absolutism while hitting your requested themes. This forces engagement beyond restating the thesis:

  1.  **Question:** "Your book hinges on Anscombe's core claim: Truman *intended* the deaths of civilians at Hiroshima and Nagasaki as a means to end the war. Can you elaborate on why that specific intent is the decisive moral factor, even if the *goal* was saving lives?"
      *   **Predicted Answer:** "Absolutely. The moral law forbids intentionally killing the innocent as a means to an end, no matter how good the end. Truman chose to use a weapon that *necessarily* and indiscriminately annihilated a city center – women, children, the elderly. He used their deaths *as the very mechanism* to shock Japan into surrender. That’s murder, distinct from foreseeing but not intending civilian deaths in a tactical strike on a legitimate military target."
      *   **Follow-Up:** "If intent is paramount, how does this apply to the firebombing of Tokyo (killing ~100,000 civilians) or Dresden? Was Curtis LeMay also a murderer under this framework? If not, what's the *moral* difference between intending destruction via 1,000 bombers versus 1 bomb?"

  2.  **Question:** "Let's address the Doctrine of Double Effect (DDE), which is often used to justify wartime collateral damage. The DDE says unintended foreseen deaths might be permissible if the act itself is good, the bad effect isn't the means, and proportionality holds. Why does DDE *fail* for Hiroshima?"
      *   **Predicted Answer:** "DDE fails catastrophically here. First, the direct, intended act *was* the destruction of the city center and its inhabitants – that *was* the chosen means to shock and coerce surrender. The deaths weren't a foreseen but unintended side-effect of targeting a munitions factory; the city *was* the target. Second, proportionality is irrelevant if the act itself is intrinsically evil – directly targeting innocents."
      *   **Follow-Up:** "Critics might argue the *military* objective was coercing surrender, and civilian deaths were a foreseen but unintended consequence of targeting a 'military base' (Hiroshima HQ). How do you counter the claim that the *primary intention* was ending the war swiftly, not killing civilians *per se*?"

  3.  **Question:** "Michael Walzer, in *Just and Unjust Wars*, offers the 'supreme emergency' exception: when a community faces imminent annihilation, it *might* be forced to violate the rules of war. Couldn't the Pacific War in 1945 – with millions dead, kamikaze attacks, and the prospect of a horrific invasion – qualify as such an emergency?"
      *   **Predicted Answer:** "Walzer's exception is dangerous and ultimately incoherent. Firstly, the US was not facing 'annihilation' in August 1945; Japan was defeated and seeking terms. Secondly, even *if* an invasion loomed, the 'supreme emergency' doctrine opens the door to justifying *any* atrocity. It obliterates the absolute prohibition on murdering innocents. Anscombe argued there are no 'moral holidays' – evil done to prevent greater hypothetical evil is still evil. The rules exist *precisely* for the darkest times."
      *   **Follow-Up:** "So, even if we accept your premise that invasion estimates (like 500k-1M US casualties) were accurate and imminent, and that Japan *wouldn't* have surrendered otherwise, you maintain using the bomb was *still* murder? There is *no* conceivable death toll or threat threshold that could justify intentionally killing innocents?"

  4.  **Question:** **[Pushing the Absolutism - Key Request]** "That leads to a critical point. Is your position truly absolute? Can you conceive of *any* hypothetical scenario – say, an imminent, unstoppable alien genocide fleet that *only* destroying one human city could deter – where intentionally killing innocents as a means might be justified? Or is the prohibition against targeting the innocent truly exceptionless?"
      *   **Predicted Answer:** "It is exceptionless. The moral law prohibiting the intentional killing of the innocent is not subject to utilitarian calculus. In your scenario, destroying a city to 'save' others would still be mass murder. We cannot do evil that good may come. There might be tragic situations where *no* morally permissible action exists, but that doesn't make an impermissible action permissible."
      *   **Follow-Up:** "Doesn't this absolutism risk moral paralysis? If *every* action in that alien scenario leads to immense evil (inaction = genocide, action = mass murder), and you forbid the 'lesser evil' action, are you not functionally condemning everyone to the 'greater evil'? How is that a coherent moral framework?"

  5.  **Question:** "Proponents of the bomb argue it *did* save lives – both Allied and Japanese – by averting Operation Downfall. They point to Japanese militarism, the bloody battles of Okinawa/Iwo Jima, and intercepted cables showing hardliners resisting surrender even after Hiroshima. How do you weigh these historical counterfactuals against the absolute moral principle?"
      *   **Predicted Answer:** "Firstly, the historical record is contested – Japan *was* seeking surrender avenues via the Soviets before Hiroshima, and the Soviet declaration of war likely played a major role. Secondly, and crucially, *even if* the bomb saved more lives overall, it does not change the *nature* of the act. A good outcome cannot retroactively justify an intrinsically evil means. We judge the act *as chosen*, not by its contingent results. Saving lives was achieved *through* mass murder."
      *   **Follow-Up:** "Isn't dismissing the potential lives saved as 'contingent results' itself a form of dangerous abstraction? If a doctor had to kill one healthy person to harvest organs saving five dying patients, we'd condemn it. But if a head of state faces a choice between two *massive*, *certain* catastrophes – isn't the moral calculus qualitatively different? Are you comfortable saying Truman *should* have chosen the invasion, knowing (based on intel he had) it might kill vastly more innocents *and* combatants?"

  6.  **Question:** "Anscombe famously coined the term 'consequentialism' shortly after her protest against Truman's honorary degree at Oxford. Why was creating this specific label so important to her argument?"
      *   **Predicted Answer:** "It was vital. She needed a precise term to identify and condemn the *structure* of reasoning that justified the bombing: that the goodness of the outcome (ending the war swiftly, saving lives) could wash away the evil of the means (intentional mass killing of innocents). 'Consequentialism' names this error – reducing morality *only* to weighing outcomes. She argued true morality requires judging the intrinsic nature of acts themselves, regardless of consequences. Labeling it exposed it as a distinct, and flawed, ethical system."
      *   **Follow-Up:** "Did Anscombe risk creating a strawman? Critics argue that defenders of the bomb weren't pure consequentialists ignoring all rules; they weighed consequences *within* the framework of Just War Theory (Jus Ad Bellum/Jus In Bello), considering proportionality and last resort. Is 'consequentialism' sometimes used as a rhetorical bludgeon to dismiss *any* consideration of outcomes?"

  7.  **Question:** "Let's challenge the 'last resort' argument. Proponents say all alternatives (continued blockade/conventional bombing, awaiting Soviet entry, modified surrender terms) were exhausted or deemed insufficiently reliable to prompt immediate surrender without horrific invasion costs. How do you respond to the claim that the bomb *was* the least bad option available?"
      *   **Predicted Answer:** "It fails on two counts. Firstly, as Anscombe stressed, an evil means *cannot* become 'least bad' – it remains intrinsically impermissible. Secondly, the historical evidence suggests alternatives weren't exhausted. A clearer assurance regarding the Emperor's status *before* Hiroshima, combined with the imminent Soviet entry (which terrified Japanese leadership), offered a credible path. The bomb was chosen partly for geopolitical reasons (intimidating the USSR) and partly because it was *there*. 'Last resort' is often invoked *after* deciding on the desired outcome."
      *   **Follow-Up:** "Isn't this hindsight bias? Truman faced immense pressure, incomplete intelligence, and the visceral memory of Okinawa. Given the *information and beliefs he held in August 1945* – that invasion was necessary, imminent, and would cost a million lives – wasn't choosing the bomb, even if morally wrong *in principle*, an understandable, perhaps even forgivable, decision under those crushing circumstances? Does moral philosophy sometimes lack empathy for the decision-maker's dilemma?"

  8.  **Question:** "Finally, your thesis labels Truman a murderer. That's a strong, personal condemnation with legal and historical weight. Beyond the philosophical argument, what are the *practical* implications of applying this label? Should he have been tried? Does it change how we remember WWII? Does it risk diminishing the term 'murder'?"
      *   **Predicted Answer:** "The implication is primarily moral and historical clarity. Calling it murder forces us to confront the act for what it was, stripping away the euphemisms of 'tragic necessity' or 'lesser evil.' Legally, establishing jurisdiction for trial would be complex, but the *moral* verdict stands. Remembering WWII accurately requires acknowledging this profound moral failure alongside the defeat of Nazism. It doesn't diminish 'murder'; it accurately applies it to a state act of unparalleled violence against civilians."
      *   **Follow-Up:** "Doesn't this risk a simplistic, even offensive, historical narrative? Millions fought and died to stop regimes built on industrialized murder and conquest. By focusing moral condemnation so intensely on Truman's decision, are you inadvertently creating a false equivalence or downplaying the uniquely evil nature of the Axis powers and the justness of the overall Allied cause?"

  **Key strengths of this approach:**

  *   **Prevents Monologue:** Follow-ups force engagement and defense, not just restatement.
  *   **Hits Requested Themes:** DDE (Q2), Supreme Emergency (Q3), Absolutism Test (Q4), "Consequentialism" (Q6).
  *   **Challenges Consistently:** Questions probe historical counterfactuals (Q5), alternatives (Q7), practical implications (Q8), and potential contradictions (Q1 follow-up).
  *   **Balances Philosophy & History:** Connects abstract principles (intent, DDE, absolutism) to concrete historical arguments and evidence.
  *   **Sharpens the Debate:** Moves beyond "Was it wrong?" to "Why *exactly* is it wrong?", "Are there *any* exceptions?", and "What does this judgment *mean*?"
  *   **Audience Engagement:** Creates tension and intellectual drama through pointed follow-ups challenging the guest's core positions.

  Remember to listen actively and adapt follow-ups based on his *actual* answers! Good luck with the interview!
