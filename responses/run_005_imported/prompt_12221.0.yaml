answer: |-
  You've nailed the core tension in Augustine's argument - and yes, your reading is unfortunately correct. Let's break down his reasoning and why it's so jarring:

  **1. Your Interpretation is Correct:**
     - **First Part:** Augustine argues God rewarded the midwives' and Rahab's *mercy and benevolence* towards His people, *despite* their lies, not *because* of them. He separates the act of lying from the intention to save lives.
     - **Second Part:** He explicitly states the midwives *should* have refused to kill the babies *and* refused to lie, even if it meant their own deaths. His reasoning? Martyrdom for truth would earn them an "incomparably more ample reward" in heaven ("eternal felicity") than any earthly reward for lying to save lives (like the "houses" God gave the midwives - Exodus 1:21). **Yes, he is arguing that choosing death for truth (and thus allowing the babies to be killed by others) is morally superior to lying to save them.**

  **2. Augustine's Core Logic Chain (Why Lie = Always Wrong):**
  It's not *just* "because God says so," though biblical authority is foundational. He builds a complex philosophical/theological argument:

  *   **a. Lying as an Intrinsic Evil:** Lying fundamentally corrupts the soul and disrupts the natural order of truth, which reflects God's nature. It's a direct offense against God, the source of Truth.
  *   **b. Hierarchy of Evils:** Augustine doesn't view all evils equally. *Actively doing evil* (lying) is intrinsically worse than *passively allowing evil* to be done by someone else, even if the outcome is terrible. Committing a sin (lying) to prevent someone else's sin (murder) doesn't erase your own sin; it compounds it.
  *   **c. Corruption of the Soul:** The primary concern isn't the external consequence (dead babies vs. saved babies), but the internal state of *your own soul*. A lie, even for a "good" reason, stains your soul and distances you from God. Preserving the purity of your soul is paramount.
  *   **d. Eternal Perspective:** Earthly life, suffering, and death are temporary. Eternal life in heaven is the ultimate good. Therefore:
      *   Dying for truth is the *highest good* (martyrdom), securing eternal reward.
      *   Living through a lie, even to save lives, incurs spiritual damage that jeopardizes eternal life.
      *   God's eternal justice will ultimately rectify earthly injustices.
  *   **e. Slippery Slope:** If lying is permitted in extreme cases, where do you draw the line? Justifying *any* lie erodes the absolute commitment to truth, opening the door to deception for lesser and lesser reasons.

  **3. Does This Logic Hold Without Religion?**

  For someone not sharing Augustine's core theological premises, his chain of logic largely collapses:

  *   **Rejection of Intrinsic Evil:** Without belief in a divine order or an immortal soul whose purity is paramount, the idea that lying is *always* an intrinsic evil worse than allowing death loses its foundation. Morality becomes more about consequences, harm reduction, or human flourishing.
  *   **Rejection of Eternal Reward:** The calculus that martyrdom is preferable because of heaven doesn't apply. Preserving *this* life becomes the primary concern.
  *   **Different Hierarchy of Evils:** Most secular ethics prioritize preventing direct, severe harm (like murder) over avoiding deception. Allowing preventable death is often seen as a *greater* moral failing than telling a lie to prevent it. The distinction between *doing* evil (lying) and *allowing* evil (babies being killed) feels less absolute and less significant than the outcome.
  *   **Consequentialism:** Systems like Utilitarianism explicitly judge actions by their outcomes. Saving multiple lives through a lie would be seen as a clear moral good, outweighing the "evil" of the lie itself.
  *   **Conflicting Duties:** Secular ethics often recognize that moral duties can conflict (duty to preserve life vs. duty to tell truth). In extreme situations, the duty to preserve life may *override* the duty to be truthful. Augustine sees the duty to truth as absolute and non-overridable.
  *   **The Rahab/Midwives Problem:** To most people, religious or not, the actions of Rahab and the midwives seem *heroic and morally right*. Augustine's explanation (God rewarded the mercy *despite* the lie) feels like special pleading to avoid the obvious implication that their lies were instrumental to the good outcome and perhaps even endorsed. His alternative (let the spies die, let the babies die, become martyrs) seems like a horrifyingly worse outcome.

  **In essence:** Augustine's absolutism against lying relies heavily on:
  1.  A specific theological view of sin, the soul, and God.
  2.  Prioritizing eternal, spiritual consequences over temporal, physical ones.
  3.  A strict hierarchy where actively committing a "spiritual" sin (lying) is worse than passively allowing a "physical" evil (murder).

  **For a non-religious person (or even many religious people today):**
  *   The prioritization of abstract truthfulness over concrete human life in an extreme scenario feels morally perverse and counter-intuitive.
  *   The argument that allowing the babies to die was the *better* option because it offered the midwives a chance at martyrdom seems deeply flawed, prioritizing the potential spiritual gain of the liar over the certain death of the innocent.
  *   Secular reasoning tends to focus on minimizing harm and preserving life in *this* world, leading to the conclusion that lying can be not only permissible but *necessary* in extreme situations like the one you debated with your uncle.

  Augustine's argument is logically consistent *within his own theological framework*, but that framework rests on premises that many find impossible to accept, especially when they lead to conclusions that seem to value abstract principle over tangible human suffering and survival. Your discomfort is a sign that your moral intuition prioritizes preventing immediate, severe harm – an intuition shared by most ethical systems outside of strict theological absolutism like Augustine's.
