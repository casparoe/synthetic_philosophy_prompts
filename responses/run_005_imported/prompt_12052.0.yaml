answer: |-
  Here’s a toast that embodies Doyle’s three-stage rhythm while keeping it warm, inclusive, and Whitehead-free. It runs about 4:45 when spoken aloud (adjust pace as needed):

  ---

  **(ROMANCE: Hook with vivid nostalgia)**  
  "Some of you might remember the smell of old chalk and projector bulbs in Room 214. The way the light slanted through those high windows in late afternoon, catching dust motes as Mr. Doyle stood there, grinning like he’d just unearthed a lost city in the supply closet. He’d begin a unit by handing you a replica Civil War bullet, or playing a scratchy recording of Churchill’s 'finest hour' speech, or asking if you’d have signed the Magna Carta knowing it might get you hanged. Suddenly, history wasn’t dates in a book. It was *your* hands holding that bullet. *Your* neck prickling at Churchill’s voice. *Your* life on the line with a quill pen. He made you feel the **stakes** first. Always."

  **(PRECISION: Disciplined tribute with a joke about "inert ideas")**  
  "Then came the work. Oh, the *work*. Primary sources cross-examined like courtroom evidence. Timelines that sprawled across bulletin boards like spiderwebs. Socratic debates where ‘Because the textbook says so’ got you politely demolished. He taught us that history isn’t a monument – it’s a crime scene, a lab, a messy, argumentative human project demanding rigor. He waged war on what he called 'dead facts' – the trivia you cram for Friday’s quiz and forget by Monday. He wanted tools, not trophies. And if I commit the one unforgivable sin tonight – delivering a toast that’s just a pile of **inert facts** about his 38 years? Well, I’d expect him to raise that famous eyebrow and ask, 'Did any of that *matter*?' So let’s skip the resume. What matters is the method."

  **(GENERALIZATION: Reveal the lasting impact & open future)**  
  "Because after the hook and the hard graft? That’s when the magic trick happened. He’d step back. Pose a question like, 'So… was the Industrial Revolution worth its human cost?' or 'Would you rather have lived in Athens or Sparta? *Convince me*.' And armed with the evidence *he’d made us wrestle with*, we’d realize… we could actually *think*. Not just repeat. We could build arguments, spot patterns, weigh ethics – use history like a living thing. That rhythm – **hook us, train us, then set us loose to think** – didn’t just teach history. It taught us *how* to learn. How to engage with complexity. It’s why so many of us in this room teach, research, lead, create. Why we still see the world through that lens: first the spark, then the sweat, then the synthesis. He gave us the algorithm for curiosity."

  **(Toasting the man & his future)**  
  "So tonight, we don’t just honor 38 years of service. We honor the architect of countless 'aha!' moments. The enemy of dead ends and dead facts. The teacher who knew you had to *feel* it, then *master* it, before you could truly *own* it. May your retirement, Mr. Doyle, have the same perfect rhythm: the **romance** of well-earned rest, the **precision** of a perfectly swung golf club or a meticulously planned trip, and the glorious **generalization** – knowing you’ve launched thousands of minds into the world, forever changed by the way you made them think. To Mr. Doyle!"

  ---

  **Why this works:**  
  1. **Embodies the Rhythm:** The toast *is* romance (nostalgic hook), precision (focused tribute + joke), generalization (revealing lifelong impact & future wish).  
  2. **Accessible & Layered:** Family gets heartfelt stories; educators/academics clock the meta-structure without jargon. "Dead facts" joke lands universally.  
  3. **Avoids Inert Facts:** Focuses on impact, method, and feeling over stats or CV points.  
  4. **The Whitehead Nod:** "Algorithm for curiosity," "hook us, train us, set us loose," and the final retirement wish explicitly mirror romance-precision-generalization without naming it.  
  5. **The Joke:** "Inert facts" is delivered as Doyle's own term, used to mock boring speeches (including the risk of this one!).  

  Deliver it with warmth and a grin at the "inert facts" line. Doyle – and both halves of the room – will get it.
