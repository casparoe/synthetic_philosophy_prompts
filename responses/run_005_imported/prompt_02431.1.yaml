prompt: |-
  Had a long argument with my friend Mara last night that I still can't resolve. She clerks for an appeals court and told me about a real quirk in how panels decide cases. Take a 3-judge panel ruling on whether a company breached a contract, where liability needs both a valid contract and an actual breach. Judge 1: contract valid + breached -> liable. Judge 2: contract valid, not breached -> not liable. Judge 3: no valid contract (though privately thinks it'd count as breach too) -> not liable. Each judge is perfectly consistent. But poll the two underlying questions separately instead of the bottom line, and a different majority shows up on each - 2 of 3 say the contract was valid, a different 2 of 3 say it was breached - so mechanically applying the rule to those majorities gives "liable," even though judges 2 and 3, the actual majority, think the company isnt liable. Mara says that's still the more honest way to decide, since a direct verdict vote just hides the disagreement. I said a procedure that hands down a conclusion nobody actually holds is broken, however principled it looks on paper. Neither of us gave in.

  Write me a short story - any setting, no judges or courtroom required - that lives inside that specific wrongness: a group reaching an official decision that not one member would sign onto if asked point-blank. Bonus if the characters can feel something's off before they can say what.
reasoning: |-
  Okay, the user presents an intriguing logical puzzle involving judicial decision-making and wants it translated into a short story that captures the essence of group decisions contradicting individual beliefs. 

  Hmm, this seems like a classic Condorcet paradox scenario where separate majority votes lead to an outcome that contradicts the overall majority. The user's argument with Mara reveals deeper tensions about procedural integrity versus authentic consensus. 

  I should avoid courtroom settings as requested, but find a scenario where binary prerequisites naturally exist. A scientific expedition feels right - objective criteria (resource scarcity + safety risk) mirror the legal logic, while interpersonal tensions allow the "wrongness" to be felt viscerally. 

  The key is making the characters sense the dissonance before articulating it. Dr. Aris can embody procedural rigor (like Mara), while Chief Silva represents outcome-oriented pragmatism (like the user). The botanist's quiet horror when realizing the implications will mirror that "something's off" feeling. 

  For bonus points, I'll show the mechanical process feeling inevitable yet hollow - the vote tally as a "ghost limb" emphasizes how the system overrides human judgment. Ending with the silent realization that they've condemned what none actually condemn makes the institutional absurdity land. 

  Must ensure the two prerequisites (scarcity + risk) are perfectly analogous to the contract/breach dilemma. The botanist being the swing voter on different issues replicates Judge 3's position exactly. Their private certainty about the plant being safe, overruled by their own votes, creates that delicious contradiction.
answer: |-
  The air in the *Daedalus*'s command pod tasted stale, recycled one too many times. Below the observation window, the planet Verdant spun, a swirl of emerald and sapphire that mocked their predicament. Three weeks into their survey mission, and the *Daedalus* was dying. A cascade failure in the life support scrubbers meant they had days, maybe hours, of clean air left. Their only hope: the rare, volatile *Viriditas Flora* samples in the bio-lab, which could theoretically be synthesized into a temporary atmospheric stabilizer. But harvesting enough required landing the fragile shuttle *Icarus* in a treacherous equatorial storm zone.

  The decision rested with the three senior officers:

  *   **Chief Engineer Aris:** Brilliant, rigid, believed rules were the skeleton of survival. "The *Viriditas* is our *only* viable option," she stated, tapping her datapad. "The synthesis protocols are sound. Therefore, landing is *necessary*."
  *   **Security Chief Silva:** Pragmatic, protective, saw threats in every shadow. "That storm belt is suicide for the *Icarus*," he growled, crossing massive arms. "Even if the plant works, losing the shuttle and crew guarantees we all die. Landing is *too dangerous*."
  *   **Lead Botanist Kael:** Gentle, meticulous, privately terrified. He knew the *Viriditas* better than anyone. "The samples... they *are* potent enough," he murmured, avoiding their eyes. "But Silva's right... the winds... shearing forces..." He trailed off, haunted by simulations of the *Icarus* crumpling.

  **The Direct Vote:**
  Captain Vance, stranded on the surface after an earlier accident, had left protocol: critical decisions required unanimity *or* a formal assessment of prerequisites. Silva, seeing no chance of convincing Aris, invoked the latter. "Let's break it down," he insisted. "Two questions: Is the *Viriditas* **necessary** for survival? And is the landing attempt **acceptably safe**?"

  Aris agreed instantly. Kael, overwhelmed, nodded mutely.

  **Question 1: Is the Viriditas necessary?**
  *   Aris: **Yes.** (Without it, death is certain.)
  *   Silva: **Yes.** (He conceded the science, however grim.)
  *   Kael: **Yes.** (He’d staked his career on its potential.)
  *   **Result: Necessary - 3 Yes, 0 No.**

  **Question 2: Is the landing acceptably safe?**
  *   Aris: **Yes.** (Risk was inherent; the necessity justified it. She trusted her engineering.)
  *   Silva: **No.** (The danger was catastrophic and likely.)
  *   Kael: **No.** (His simulations screamed disaster. He *knew* it wasn't safe.)
  *   **Result: Safe - 1 Yes, 2 No.**

  **The Mechanical Conclusion:**
  Aris pulled up the protocol. "Per emergency directive Gamma-7: If Resource is deemed Necessary *and* Acquisition is deemed Safe, proceed with Acquisition." She looked at the results. "Necessary: Yes. Safe: Yes." She paused, the logic clicking into place with chilling clarity. "Therefore... we land."

  Silva stared, dumbfounded. "Yes? *Safe* is *Yes*? Kael and I both said *No*! It's not safe!"

  "According to the majority assessment of the prerequisites," Aris recited, her voice tight, "the landing is authorized."

  Kael made a small, choked sound. He felt a cold nausea. *Necessary: Yes. Safe: Yes. Therefore: Land.* But *he* had voted Safe: **No**. Silva voted Safe: **No**. Only Aris voted Safe: **Yes**. How could the outcome be "Safe" when two of them screamed it wasn't? And yet... the rule... the cold, clean logic of it...

  **The Wrongness Settles:**
  *   **Aris** knew the landing *wasn't* objectively safe by any normal standard. Silva and Kael weren't fools. But the procedure was clear, the necessity absolute. This was the honest outcome of the facts as assessed. Yet, endorsing "Safe" felt like a lie etched in protocol.
  *   **Silva** saw madness. They were about to send people to their deaths based on a vote where *two people agreed it was suicidal*. The "Safe" verdict was a phantom, conjured by splitting the question. He wanted to punch the console.
  *   **Kael** felt the dissonance most acutely. His 'Yes' to necessity and 'No' to safety were both deeply felt truths. Combining them *should* mean "Don't Land" – necessity met with unacceptable risk. Yet the machine of the procedure, fed his own votes, spat out "Land." He was complicit in authorizing a mission *he believed would fail*. The official record would show "Safe (Majority Assessment)", signed off by all three. He hadn’t lied in his votes, yet the conclusion was something *none* of them would endorse if asked directly: "Do you believe this landing is a good idea?" All three would say **No**.

  Silva finally broke the silence, his voice rough. "So. We send Park and Chen down. Because the *rule* says it's safe. Even though you," he jabbed a finger at Kael, "and I *know* it's a deathtrap, and *you*," he turned to Aris, "only think it's worth the gamble because you think it's our *only* shot, not because it's actually *safe*."

  Aris didn't meet his eyes, focusing on the authorization code. "The procedure reflects the assessed reality of the prerequisites. A direct vote on 'Land?' would have obscured *why* we disagreed."

  Kael watched the storm swirl on the screen below, the *Icarus* prepping in its bay. The green light on the command console, indicating "Go," felt like a physical weight. It glowed with the cold, undeniable logic of the vote tally: Necessary - Yes. Safe - Yes. Therefore - Proceed. It was official. It was unanimous in its prerequisites. And it was a decision *not one of them*, in their heart of hearts, believed was truly right. They had followed the rules perfectly into a collective lie. The air tasted fouler than ever.
