  Okay, the user is asking about Pascal and Rousseau's views on force, custom, and legitimate authority. Let me start by recalling what each philosopher said. Pascal in the Pensées argues that people can't establish justice based on reason, so they use force and present it as justice. He also mentions that laws are followed because they're established, not because they're just. Rousseau in the Social Contract rejects the idea that the strongest has a right to rule, saying force doesn't create moral obligation.

  The user wants to know if they agree on the diagnosis that political authority can't come from demonstrable justice but differ in their conclusions, or if there's a deeper disagreement about legitimacy's grounds. Let me break down their positions.

  Pascal sees human nature as flawed, unable to achieve true justice. He thinks customs are accepted out of habit and necessity, not reason. Authority relies on tradition and force, not rational justification. His view is more about human limitations and the practical need for order, even if it's not just.

  Rousseau also rejects force as a basis for legitimacy but believes in a rational foundation: the general will. He thinks legitimacy comes from collective agreement and popular sovereignty. Unlike Pascal, he's optimistic about creating just authority through the social contract.

  So, both agree that force alone can't create right, and established customs aren't inherently just. But Pascal is skeptical about any rational basis for legitimacy, while Rousseau thinks it's achievable through the social contract. The deeper disagreement is about the possibility of a just foundation. Pascal sees authority as inherently ungrounded in reason, whereas Rousseau provides a normative framework for legitimacy.

