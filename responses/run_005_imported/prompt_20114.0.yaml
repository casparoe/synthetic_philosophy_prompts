answer: |-
  Let's break down the argument step by step, addressing each point made by Marcus and Priya, and clarifying any misconceptions. The setup is a two-player game where Row chooses U, M, or D, and Column chooses L or R. The payoffs for Row are:

  - If Column plays L: U pays 3, M pays 0, D pays 1.
  - If Column plays R: U pays 0, M pays 3, D pays 1.

  The answer key eliminates D for being "dominated," but Marcus and Priya disagree on whether this is justified.

  ### Step 1: Marcus claims that no pure strategy dominates D, so D should not be eliminated.
  - **Marcus's point**: He argues that U is better than D when Column plays L (3 > 1) but worse when Column plays R (0 < 1). Similarly, M is better than D when Column plays R (3 > 1) but worse when Column plays L (0 < 1). Thus, no pure strategy beats D in all cases, meaning D is not strictly dominated by any pure strategy.
  - **Who is right?** Marcus is correct here. For strict domination by a pure strategy, one strategy must yield a strictly higher payoff than D for every possible action of Column. As Marcus points out, neither U nor M satisfies this:
    - U vs. D: Better when L (3 > 1), worse when R (0 < 1).
    - M vs. D: Better when R (3 > 1), worse when L (0 < 1).
  - **What's missing?** Marcus is focusing only on pure strategies for domination. However, in standard game theory (as per von Neumann-Morgenstern), domination can involve mixed strategies. Marcus doesn't consider this, which is a key oversight. Domination is not limited to pure strategies; mixed strategies can dominate even if no pure strategy does.

  ### Step 2: Priya claims that a mixed strategy dominates D, so elimination is valid.
  - **Priya's point**: She argues that a mixed strategy—e.g., flipping a coin between U and M (50% U, 50% M)—yields an expected payoff of 1.5 regardless of Column's action:
    - If Column plays L: (0.5 × 3) + (0.5 × 0) = 1.5 > 1 (D's payoff).
    - If Column plays R: (0.5 × 0) + (0.5 × 3) = 1.5 > 1 (D's payoff).
    Since 1.5 > 1 for both Column actions, this mixed strategy strictly dominates D. Priya also notes that payoffs are in utility terms, so risk aversion is already incorporated.
  - **Who is right?** Priya is correct. Strict domination requires that there exists some strategy (pure or mixed) that gives a strictly higher payoff for every possible pure strategy of the opponent. Here, any mixed strategy with probability of U between 1/3 and 2/3 (e.g., 50-50) achieves this:
    - For Column L: Expected payoff = 3p (where p is prob. of U), and 3p > 1 when p > 1/3.
    - For Column R: Expected payoff = 3(1-p), and 3(1-p) > 1 when p < 2/3.
    Thus, for p in (1/3, 2/3), the mixed strategy strictly dominates D. Since such a strategy exists, D is strictly dominated and can be eliminated.
  - **What's missing?** Priya correctly invokes mixed strategies, which resolves Marcus's pure-strategy objection. She also rightly notes that payoffs are von Neumann-Morgenstern utilities, meaning they already account for risk preferences (e.g., risk aversion is "priced in"). Thus, comparing expected utilities is valid.

  ### Step 3: Marcus objects that the mixed strategy is risky and a cautious player might prefer D.
  - **Marcus's point**: He argues that the mixed strategy doesn't guarantee 1.5—it could result in 0 or 3—so a risk-averse player might prefer D's certain payoff of 1. He implies that domination should consider this "safety" aspect.
  - **Who is right?** Marcus is incorrect in this context. In game theory, payoffs are defined as utilities, not monetary values. Utilities incorporate risk preferences, so if the expected utility is higher (1.5 > 1), the player prefers the mixed strategy regardless of risk. Here:
    - The payoffs are given as numbers (e.g., 3, 0, 1), and we assume they represent vNM utilities with linear scaling (implying risk neutrality).
    - For a risk-neutral player, expected utility determines preference: 1.5 > 1, so the mixed strategy is better.
    - If Row were risk-averse, it would be reflected in the utility values (e.g., a sure 1 might have higher utility than a 50-50 gamble of 3 and 0). But since the payoffs are given as is, we must interpret them literally. Priya's point about "risk priced in" stands.
  - **What's missing?** Marcus confuses payoff realizations with expected utility. Domination is based on expected payoffs against opponent actions, not on worst-case outcomes. Also, his "cautious player" argument relates to maximin (maximizing the minimum payoff), not domination:
    - Under maximin with pure strategies, D guarantees 1, while U or M can yield 0.
    - But with mixed strategies, Row can achieve a maximin payoff of 1.5 (e.g., with 50-50 mix), which is better than D's 1. So even for caution, mixing dominates.

  ### Step 4: Marcus claims that order of elimination matters and the key got lucky.
  - **Marcus's point**: He argues that iterated elimination of dominated strategies can depend on the order of elimination, implying that removing D first might not always be safe.
  - **Who is right?** Marcus is partially right about order mattering in general, but wrong in this specific case. Order can matter for weak domination (e.g., if a strategy is weakly dominated), but here D is strictly dominated by a mixed strategy:
    - Strict domination implies D should be eliminated first, and the order won't affect the outcome because strict dominance is unambiguous.
    - After eliminating D, only U and M remain for Row. Neither is dominated (pure or mixed), so no further elimination occurs. Thus, the key didn't "get lucky"; it's correct.
  - **What's missing?** Marcus is correct that order can matter in games with weak dominance, but this game has strict dominance (via mixed strategies), so it's irrelevant here. He also misses that D is never a best response:
    - If Column mixes (e.g., plays L with prob. q), D is never uniquely best and is strictly worse than U or M for most q (e.g., if q = 0.5, U or M yield 1.5 > 1).

  ### Overall Assessment
  - **Priya wins the argument**: She correctly identifies that a mixed strategy dominates D, and her points about utility and risk are valid. The answer key is justified in eliminating D.
  - **Marcus's valid points**: He is right that no pure strategy dominates D, and order of elimination can matter in general (though not here). However, he overlooks mixed strategies and misapplies risk considerations.
  - **Key takeaways for the study group**:
    1. **Mixed strategies are essential for dominance**: Domination can involve mixed strategies, not just pure ones. This is standard in game theory but sometimes glossed over in introductory material.
    2. **Utilities encode risk**: Payoffs are vNM utilities, so expected utility comparisons are sufficient; no additional risk adjustment is needed.
    3. **Strict vs. weak dominance**: Strict dominance (as here) is robust and order-independent, while weak dominance can be sensitive to order.
    4. **D is strictly dominated**: Eliminating D is correct, and after elimination, the game reduces to Row choosing between U and M, with no dominant strategy for Row.

  If your group is using course notes that don't cover mixed strategies for dominance, it might be worth clarifying that definitions can vary. But based on standard theory, the key and Priya are correct.
