  For part (c), the dedication argument holds. I recall Schlick's 1936 letters expressing discomfort with collectivist readings. The Gödel/Menger objection reference is correct per Sigmund's Gödel biography. The liberal-individualist contrast is well-stated.

  The only improvements I'd suggest: In (b) clarifying that the Bavarian work was Carnap's only direct planning experience, and in (c) noting Waismann also objected. But these don't merit point deductions. 

