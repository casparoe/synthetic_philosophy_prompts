answer: |-
  ## MEMORANDUM

  **To:** Frege Prize Committee Members  
  **From:** [Your Name], Committee Chair  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Petition to Rename the Frege Prize & Proposed Policy Framework  

  **1. Background**  
  This memo addresses the petition submitted by graduate students requesting the renaming of the Frege Prize due to Frege’s documented antisemitic and anti-parliamentary views in his private diaries. The committee acknowledges the gravity of these views, their impact on community members, and the absence of a standing policy for such petitions. Our decision must balance:  
  *   Recognition of Frege’s foundational contributions to logic and philosophy of language.  
  *   The ethical implications of honoring an individual with reprehensible personal beliefs.  
  *   The need for a consistent, principled approach to similar future cases.  

  **2. Key Considerations**  
  *   **Frege’s Legacy:** His work on quantification, sense/reference, and logicism remains indispensable to our discipline. As Dummett established, Frege fundamentally shaped analytic philosophy.  
  *   **The Diary:** The explicitly antisemitic and anti-democratic views expressed are indefensible and cause significant distress.  
  *   **Connection to Work:** No credible scholarship links Frege’s bigoted *private* views to his *technical* work in logic/language. His contributions operate independently.  
  *   **Impact:** The current name causes harm and alienation for some students and colleagues, undermining the prize’s intended purpose: celebrating excellence and fostering community.  
  *   **Precedent:** Concerns about a "slippery slope" are valid but manageable with clear criteria (see Section 4). Not all historical figures present equivalent cases; distinctions can be drawn.  

  **3. Recommendation: Rename the Prize & Establish a Named Lecture**  
  After careful deliberation, **I recommend renaming the Frege Prize** while simultaneously **establishing an annual "Frege Lecture"** focused on the history and foundations of logic & philosophy of language.  

  *   **Rationale for Renaming the Prize:**  
      *   **Harm vs. Honor:** The primary purpose of a prize is to *honor* recipients and *inspire* students. When the namesake’s documented views actively cause distress and alienation to members of our community – particularly those belonging to groups targeted by those views – the act of naming becomes counterproductive to the prize’s mission. The harm caused by retaining the name outweighs the tribute to his intellectual achievements in this specific context.  
      *   **Symbolic Function:** A prize name signifies institutional values. Retaining Frege’s name implicitly signals that his technical achievements absolve or render irrelevant his virulent antisemitism, a signal many reasonably reject.  
      *   **Focus on Recipients:** Renaming refocuses attention squarely on the excellence of the graduate work being awarded, free from annual controversy.  

  *   **Rationale for the "Frege Lecture":**  
      *   **Acknowledging Contribution:** This ensures Frege’s immense intellectual contribution is formally recognized and studied within the department.  
      *   **Contextualization:** The lecture provides a dedicated forum to examine Frege’s work *critically and holistically*, including necessary discussions of his personal views and their historical context. This fosters deeper understanding, not uncritical reverence.  
      *   **Educational Value:** It turns a difficult legacy into an ongoing pedagogical opportunity about the complexities of intellectual history.  

  **4. Proposed Criterion for Comparable Cases**  
  To address precedent concerns, the committee should adopt this standard for future naming disputes:  

  > **The institution will remove a namesake from an award, position, or space primarily dedicated to honoring *current* achievement or fostering community belonging if:**  
  > **(a)** The namesake held views or engaged in conduct that actively and severely contradict core values of intellectual inclusivity and human dignity central to the department/university mission *today*; **AND**  
  > **(b)** Retaining the name causes measurable harm or alienation to current community members; **AND**  
  > **(c)** The connection between the objectionable views/conduct and the specific work or achievement being honored is either *direct* **OR** the retention of the name itself creates an environment contrary to the award/space's purpose.  
  >
  > *   **Clarifiers:**  
  >     *   "Measurable harm" includes documented expressions of distress, feelings of exclusion, or reluctance to engage with the award/space by identifiable community members.  
  >     *   "Core values" refer to foundational principles like equality, non-discrimination, and intellectual openness.  
  >     *   Criterion (c) allows for nuanced assessment. A *direct* connection (e.g., Heidegger's Nazism intertwined with his philosophy) strongly satisfies (c). However, *even without a direct connection*, if the name itself causes significant harm (satisfying a & b), thereby undermining the award's function (e.g., discouraging submissions or participation), this also satisfies (c).  

  **5. Engaging the Strongest Counter-Argument: Intellectual Purity**  
  The most compelling argument for retaining the name deserves serious engagement: **The radical separation of Frege’s intellectual achievements from his personal failings.**  

  *   **The Argument:** Frege’s work in logic and philosophy of language stands as a monument to pure reason, achieved independently of his deplorable political and racial views. His contributions are objectively foundational. Honoring this work through the prize name is not an endorsement of his personal beliefs but a recognition of timeless intellectual achievement that transcends the flawed individual. To rename it is to succumb to presentism, potentially diminishing the discipline's history and setting a precedent where only morally unblemished figures can be recognized – an impossible standard that erases historical context and intellectual progress.  

  *   **Response:** This argument powerfully articulates the value of intellectual autonomy and the potential dangers of conflating work and creator. It rightly emphasizes the objective significance of Frege's technical breakthroughs.  

      *   **However, the counter fails to fully address the *symbolic and functional* reality of the prize.** While his work may be "pure," attaching *his name* to an award bestowed *today* unavoidably associates the *current institution's* honor with the *whole person* in the public eye. The petition demonstrates that for those targeted by his views, this association causes real pain and undermines the prize’s community-building purpose.  
      *   **The "Lecture" solution directly addresses this:** It preserves the intellectual recognition and historical study of Frege's work in a context designed for critical examination (the lecture), while freeing the prize – whose primary function is to celebrate *current* students and foster *current* community – from a burdensome association that actively works against that function. This maintains historical awareness without demanding that marginalized community members participate in an honorific bearing the name of someone who despised their existence.  

  **6. Conclusion & Vote**  
  Renaming the prize and establishing the Frege Lecture represents a balanced approach. It ceases the implicit endorsement of Frege as a *person* worthy of contemporary honor for an award celebrating our students, directly addresses the harm caused, and upholds our community values. Simultaneously, it formally preserves and contextualizes Frege’s indispensable intellectual legacy within our department. The proposed criterion provides a principled, non-arbitrary framework for future decisions.  

  I move that the committee:  
  1.  **Vote to rename the "Frege Prize."**  
  2.  **Establish an annual "Frege Lecture"** on the history and foundations of logic and philosophy of language.  
  3.  **Adopt the proposed naming criterion** for future comparable cases.  
  4.  **Form a subcommittee** (including graduate student representation) to propose a new name for the prize and develop the structure of the Frege Lecture.  

  A vote on these motions will be taken at our meeting on [Date]. Please come prepared to discuss.
