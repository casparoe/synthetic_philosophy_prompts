  But where might this analogy falter? The key is the difference in grounding. In statistical mechanics, probabilities are derived from phase space measures, independent of the actual future. Humean chances, however, depend on the entire history, including the future. So the contradiction arises because T_w's truth depends on the future not including F, yet assigns F a positive chance. In thermodynamics, the Second Law's probability isn't contingent on future events in the same way. 

  I should check if the user's summary misses any nuances. Lewis’s later work with the New Principle (Thau/Hall) addresses this by modifying the Principal Principle to avoid conditioning on chances that might be undermined. The user's analogy doesn’t engage with this fix, but since they haven’t read those papers, that’s understandable. 

