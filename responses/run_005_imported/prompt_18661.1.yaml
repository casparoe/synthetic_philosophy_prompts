answer: |-
  You're absolutely right – the devil's in the details! The core claim ("true/false now" vs. "neither") *is* the starting point, but the implications and "prices paid" are where the real philosophical meat lies. Let's break it down with a concrete example.

  **The Concrete Statement:**
  > "A green comet will be visible over London at midnight tomorrow."

  *(Let's call this statement **C**)*

  **Aristotle's Puzzle (Recap):**
  1.  **Bivalence:** Every meaningful statement is either true or false (Aristotle generally accepted this for past/present).
  2.  **Future Contingent:** **C** is about a future event not determined by the present state of the world (it *could* happen, it *could* not).
  3.  **The Problem:** If **C** is *true* now, then the comet *must* appear – fatalism (no free will, no real contingency). If **C** is *false* now, the comet *cannot* appear – also fatalism. If **C** is *neither* true nor false, does this violate bivalence?
  4.  **Aristotle's Solution (Briefly):** He arguably leans towards **C** being *neither* true nor false *yet*, preserving contingency and avoiding fatalism, but this raises questions about bivalence.

  **The Modern Views:**

  **1. The Peircean View (Inspired by C.S. Peirce)**

  *   **Core Claim:** Future contingent statements like **C** are **FALSE** *right now*.
  *   **Why?** Truth requires *determinacy*. For a future event to be true *now*, its occurrence must be *necessitated* by the present state of the world. Since the comet's appearance is contingent (not necessitated), there is *no present fact of the matter* making **C** true. Therefore, **C** lacks truth value? Not quite. The Peircean insists on **Bivalence**: every statement *must* be true or false *now*. Since **C** isn't *true* now (no present fact grounds it), it **must be false now**.
  *   **Evaluating C (Today):** "A green comet will be visible over London at midnight tomorrow" is **FALSE**.
  *   **What Happens Tomorrow?** If the comet *does* appear at midnight tomorrow, then *at that future time*, the statement "A green comet *is* visible over London right now" becomes true. But crucially, the *future-tensed* statement **C** made *today* remains forever false. Its falsity was fixed when it was uttered.
  *   **The Price Paid (Peircean):**
      *   **Price #1: Radical Revision of Truth for Future-Tense:** They have to bite a very hard bullet: **All** positive, contingent future-tensed statements are false *when uttered*, even if the event later happens. "The sun will rise tomorrow," "You will drink coffee tomorrow," "A child born today will become president" – all **FALSE** when said. Only statements about *necessary* future events (e.g., "2+2 will equal 4 tomorrow") or statements about the *inevitability* of a future event ("Given current atmospheric conditions, it *must* rain tomorrow") can be true now. This clashes massively with ordinary language and intuition.
      *   **Price #2: Truth as Settledness:** Truth is redefined as what is *settled* or *determined* by the present. If it's not settled now, it's not true now. Since future contingents aren't settled, they can't be true. Bivalence forces them to be false.
      *   **Price #3: Loss of Future Truthmakers:** There are no "truthmakers" (facts in reality) *now* for future contingent truths. Truthmakers only exist for past/present truths and *necessary* future truths.

  **2. The Ockhamist View (Inspired by William of Ockham)**

  *   **Core Claim:** Future contingent statements like **C** are **EITHER TRUE OR FALSE** *right now*.
  *   **Why?** Bivalence holds for *all* meaningful statements, past, present, or future. What makes a future contingent true or false *now* is the **actual future history of the world**. There is, right now, a single, determinate, actual future timeline (even if we don't know what it is). If the comet *will* appear in that actual future, then **C** is *already true*. If it *will not* appear in the actual future, then **C** is *already false*.
  *   **Evaluating C (Today):** "A green comet will be visible over London at midnight tomorrow" is **EITHER TRUE OR FALSE** right now. Its truth value is fixed by the actual future.
  *   **What Happens Tomorrow?** When midnight arrives, we *discover* whether **C** was true or false all along. If the comet appears, **C** was true yesterday; if not, it was false yesterday.
  *   **The Price Paid (Ockhamist):**
      *   **Price #1: Metaphysical Commitment to a "Thin Red Line":** Ockhamists must accept that among all the *possible* futures branching from the present moment, there is **one unique, privileged future that is the *actual* future**. This is often called the "Thin Red Line" (TRL). This TRL exists *now* as a concrete feature of reality, making future-tensed statements true or false *now*. This is a significant metaphysical assumption about time and reality.
      *   **Price #2: Compatibility with Free Will?** Critics argue this view leads to **fatalism**. If **C** is *already true* today because the comet *will* appear in the actual future, doesn't that mean its appearance is *necessary*? Ockhamists reply: No. The comet's appearance is still contingent – other futures were *possible* – but *this* specific future (the TRL) *happens* to be the actual one. Our free choices *constitute* which future is the TRL. However, the *fact* that this TRL exists *now* and makes **C** true *now* feels intuitively fatalistic to many. How can my free choice tomorrow make **C** true *today* if **C**'s truth today is fixed by the future TRL that *includes* my choice? It seems circular.
      *   **Price #3: Epistemic Inaccessibility:** While **C** has a truth value *now*, we *cannot know* what it is until the future unfolds. Truth is radically disconnected from knowability for future contingents.

  **The Core Conflict & Why Philosophers Argue:**

  *   **Peircean:** Saves contingency and avoids a metaphysically heavy TRL by sacrificing the intuitive truth of most future-tensed statements and redefining truth as "settledness." Makes predicting the future literally impossible (all positive predictions are false!).
  *   **Ockhamist:** Preserves bivalence and our intuition that statements *about* the future have a definite truth value (even if unknown), but requires accepting a metaphysically controversial "Thin Red Line" and faces persistent accusations of fatalism (or at least, a very counter-intuitive relationship between future truth and present contingency/free will).

  **In essence:** The argument isn't *just* about truth values today; it's about **what grounds those truth values** (present settledness vs. future actuality) and the **metaphysical and logical costs** each grounding imposes. The Peircean view distorts our concept of truth for future statements to avoid a heavy metaphysics. The Ockhamist view embraces a heavy metaphysics (the TRL) to preserve a more intuitive concept of truth for future statements. Neither solution is cost-free, and the choice often boils down to which cost seems philosophically more acceptable or which aligns better with other commitments (e.g., about free will, time, or logic). That's why the debate continues!
