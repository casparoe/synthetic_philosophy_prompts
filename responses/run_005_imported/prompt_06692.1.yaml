answer: |-
  Here are ten questions addressing your specified themes, designed to push beyond standard exposition, with three strategic follow-ups and a falsifiability closer:

  1. **On Decision Theory Dependence**: "ECL is often presented as a natural consequence of Evidential Decision Theory (EDT). But for those committed to Causal Decision Theory (CDT) or Functional Decision Theory (FDT), could you articulate *exactly* where their frameworks *fail* to replicate ECL's cooperative prescriptions? Is the disagreement purely metaphysical (e.g., about the reality of acausal links), or is there a practical divergence in recommended actions?"  
     *Follow-up if response appeals to "updatelessness"*: "If an updateless FDT agent models other agents as *also* being updateless, doesn't that reintroduce the very same correlation ECL relies on? What specific asymmetry between EDT and FDT prevents this?"

  2. **On Epistemic Confidence in Similar Agents**: "Since ECL requires correlating with agents using 'sufficiently similar' decision procedures, how do we assign non-arbitrary priors over the existence and density of such agents in a causally disconnected multiverse? Doesn't the absence of direct evidence force us into speculative anthropic reasoning—and if so, how is this different from assuming our own decision procedure is 'typical'?"  
     *Follow-up if appeal to "structural similarity"*: "But if we have no access to the distribution of decision procedures in the multiverse, isn't any claim about 'structural similarity' just a disguised prior that *our* algorithm is common? What empirical constraint prevents this from being circular?"

  3. **On Handling Monstrous Values**: "ECL seems to require cooperating with agents whose values we find abhorrent (e.g., agents seeking to maximize suffering), since their existence is compatible with a large universe. Is there a *formal* principle within ECL to exclude such agents from the cooperation pool that doesn't implicitly privilege our values? Or does ECL functionally demand value-neutrality even toward 'anti-cooperators'?"

  4. **On Normative Collapse**: "Some critics argue ECL is just moral uncertainty in disguise: we hedge because we're uncertain which values 'win' in the multiverse. If we resolve moral uncertainty separately (e.g., via maximizing expected choice-worthiness), does ECL add *any unique prescription* we couldn't derive from that framework alone?"

  5. **On Practical Bootstrapping**: "How does an agent initially *commit* to an ECL strategy without evidence that others are doing the same? Isn't the first cooperator doomed to exploitation if no one correlates with them—and if so, doesn't ECL require a critical mass of pre-existing cooperators to be rational?"

  6. **On Fragility of Correlation**: "Could minor differences in decision algorithms (e.g., slightly different priors on similarity thresholds) break correlation entirely? If so, how do we avoid a 'butterfly effect' where ECL only works for near-clones of ourselves—undermining its scalability?"

  7. **Follow-up to Value Exclusion (Theme 3)**: "If we *do* exclude agents with 'monstrous' values, doesn't that create a perverse incentive for agents to *signal* rigid intolerance (making *their* values excludable) to avoid having to cooperate with rivals? How does ECL handle such strategic manipulation?"

  8. **On Causal vs. Evidential Leverage**: "In standard cooperation (e.g., repeated Prisoner's Dilemma), my action *causes* reciprocal benefits. In ECL, my action is merely *diagnostic* of benefits elsewhere. Does this mean ECL can't actually *change* outcomes for the better—only align with pre-existing good outcomes? If so, why call it 'cooperation'?"

  9. **Follow-up to Normative Independence (Theme 4)**: "When two ECL agents with conflicting values correlate, they both 'win' by their lights. But isn't this just mutual toleration of parallel play, not true cooperation toward a shared goal? Does ECL reduce morality to a cosmic non-aggression pact?"

  10. **Falsifiability/Abandonment**: **"What would constitute *empirical* or *theoretical* evidence against ECL as a practical imperative? For instance: if we discovered the universe was too small for significant acausal correlation, if CDT/FDT agents consistently outcompeted EDT cooperators in simulations, or if 'similarity' conditions proved impossibly fragile—would any of these make you reject ECL's real-world applicability?"**

  ### Key design notes:
  - **Follow-ups target evasions**: The follow-ups (for Q1, Q2, Q9) pre-empt retreats to "unresolved modeling details" by demanding conceptual accountability (e.g., circularity in similarity priors, hidden value-bias in exclusion).
  - **Pressure on core tensions**: Q3/Q7 confront the "monstrous values" problem directly; Q4/Q9 challenge ECL's novelty; Q5/Q6 test operational plausibility.
  - **Falsifiability focus**: Q10 forces engagement with failure conditions, avoiding unfalsifiable formalism. It explicitly ties abandonment to empirical/theoretical breakdowns.
  - **No warm-ups**: Assumes guest expertise; jumps immediately into contested territory per your request.

  These questions should expose fault lines in ECL’s foundations while respecting the technical depth of the framework—ideal for provoking the nuanced debate your reading group seeks.
