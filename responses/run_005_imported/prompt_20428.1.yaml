  1. **Chemistry's nuance:** "H₂O" is an idealized formula. Real water includes isotopic variants (D₂O), ions, and impurities—yet chemists still call it "water." This challenges *both* microstructural rigidity and surface-feature definitions.
  2. **Kripke's arguments for essentialism:** He *does* argue microstructure is essential (e.g., a tiger without DNA is a different "kind"), but via intuition pumps, not logic. The physicist underplays this; the philosopher overplays its conclusiveness.
  3. **Semantic externalism ≠ metaphysics:** Even if "water" refers rigidly to H₂O, *necessity* requires the added premise that H₂O-ness is essential. The link between reference and modality isn't automatic.

