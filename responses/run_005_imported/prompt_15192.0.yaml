  - **Meg wins on empiricism** (Points 1, 3): Her behavioral evidence and UAL marker are strong, but she leans too heavily on untested precaution.  
  - **Dave wins on rigor** (Points 2, 6): He exposes gaps in inferring consciousness from behavior/precaution, but his architectural demands are unjustifiably anthropocentric.  
