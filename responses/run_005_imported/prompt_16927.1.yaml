answer: |-
  Here’s a rigorous argument for your thesis, structured to dismantle the illusion of objective individual probability in actuarial risk tools:

  ### Core Thesis:  
  **The reference class problem isn’t a technical flaw but a metaphysical impasse. Statements like "this defendant has a 68% chance of reoffending" are neither true nor false because they falsely reify group statistics as properties of individuals—a category error no data can resolve.**

  ### The Argument:  
  1. **Frequentism’s Foundational Limitation**:  
     Actuarial tools rely on *frequentist probability*, which defines probability *only* as a long-run frequency within a defined collective (reference class). Crucially, frequentism explicitly denies that probability applies to single cases. As von Mises (Reichenbach’s contemporary) insisted: *“Probability is a mass phenomenon. We can say nothing about the ‘probability of death of an individual.”*  

  2. **The Indeterminacy of the “True” Reference Class**:  
     Any defendant exists within overlapping collectives:  
     - Age + Prior Convictions + Zip Code  
     - Age + Prior Convictions + Education Level  
     - Zip Code + Employment Status + Substance Abuse History  
     Each yields a distinct probability estimate. **No empirical fact** determines which collective is the "correct" one. The choice is pragmatic, not ontological.  

  3. **Reichenbach’s "Solution" as Infinite Regress**:  
     The "narrowest reliable class" rule collapses because:  
     - **Reliability ≠ Truth**: A class with "sufficient data" (e.g., 100 people) is arbitrary. Why 100? Why not 50? Why not 1,000?  
     - **The Singleton Paradox**: The endpoint of narrowing—a class of one (the defendant)—yields *no probability* (frequency undefined). Thus, the rule *presupposes* the impossibility it seeks to avoid.  

  4. **The Misleading Syntax of "Individual Probability"**:  
     Saying *"John has a 68% chance"* grammatically assigns probability *to John*. But frequentism assigns it *to the class*. This linguistic sleight-of-hand creates the illusion of a measurable property *in John*, akin to his height or DNA. **No such property exists.**  

  5. **Implications for Truth-Aptness**:  
     - For a statement to be true/false, it must correspond (or fail to correspond) to a state of affairs.  
     - "John has a 68% chance" *appears* to refer to John’s intrinsic risk. But:  
       - If it means *"68% of people like John reoffend,"* it’s a claim about a group—**not John**.  
       - If it means *"John has an inherent 68% propensity,"* it invokes metaphysical propensity (rejected by frequentists) and lacks empirical grounding.  
     - **Conclusion**: The statement is either a category error (misapplying group facts to individuals) or unverifiable metaphysics. Neither is truth-apt.  

  ### Counterarguments & Rebuttals:  
  - **Objection**: *"Better data narrows classes, reducing arbitrariness."*  
    **Rebuttal**: This confuses *precision* (smaller confidence intervals) with *reference class validity*. Narrowing classes doesn’t resolve *which* dimensions matter morally/legally (e.g., zip code proxies for race).  

  - **Objection**: *"Courts need practical tools, not philosophy."*  
    **Rebuttal**: When liberty hinges on a number falsely presented as "scientific truth," philosophical rigor is ethical necessity. Using a 68% score pretends objectivity where none exists.  

  - **Objection**: *"The score is just one input among many."*  
    **Rebuttal**: Numerical anchors bias human judgment. Calling it "68% true" legitimizes it as evidence, despite its foundations being nonfactual.  

  ### Why This Matters for Your Feature:  
  - **Legal Deception**: Courts treat these scores as objective facts about individuals. Your thesis reveals them as *conventions*—group summaries arbitrarily mapped onto persons.  
  - **Justice Implications**: If a score varies from 40% to 80% based on defensible class choices, its use in sentencing violates due process. No "true" number exists to justify depriving liberty.  
  - **The Path Forward**: Abandon the pretense of individual probability. Tools might inform systemic reforms (e.g., "neighborhood X needs reinvestment, not harsher sentences"), but never decide fates of individuals.  

  ### Punchy Closing for Your Draft:  
  *"Actuarial tools don’t measure risk in people; they manufacture the illusion of calculable certainty by dressing group patterns in the language of individual destiny. The reference class problem isn’t a bug in the algorithm—it’s a fatal revelation that these percentages were never *about* the human in the dock. To call them ‘untrue’ misses the point: they belong to the same category as ‘this prisoner’s soul weighs 23 grams.’ The measurement is precise, the object fictitious."*  

  This framing elevates the discussion beyond data debates, centering the profound mismatch between statistical aggregates and the irreducible singularity of human lives before the law.
