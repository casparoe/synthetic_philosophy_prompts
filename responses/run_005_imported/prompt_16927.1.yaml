  First, I need to unpack the reference class problem. Reichenbach's idea was to use the narrowest reference class with reliable data, but the problem is that you can always narrow it down further. For any defendant, there are multiple reference classes they belong to—age, zip code, prior record, etc.—each giving different probabilities. The critique here is that these tools claim to assign an objective probability to an individual, but that's philosophically shaky.

