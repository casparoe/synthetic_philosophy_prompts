  The user's confusion lies in why critics think OSR doesn't escape the problem. They're wondering if OSR just relabels objects as "nodes," making Newman's triviality issue resurface. I should emphasize that OSR's structures are concrete physical structures, not abstract sets. But critics argue that without relata, relations might be vacuous. Ladyman and Ross might respond by pointing to physics (like quantum particles) where individuality is relational, but the user might need concrete examples.

