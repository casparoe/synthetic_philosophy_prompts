answer: |-
  That's a fantastic passage from Newton! He's absolutely deploying both biting sarcasm and a core principle of textual criticism. Let's break down your two questions:

  1.  **"The Word of Mithridates":** Newton is referencing **Mithridates VI of Pontus (c. 135–63 BCE)**. The specific event Newton alludes to is **Mithridates's order in 88 BCE for the simultaneous massacre of Romans and Italians throughout Asia Minor**. The story, famously recounted by ancient historians like Appian and Plutarch, is that Mithridates sent secret orders to all the provincial governors and cities under his control. These orders were to be opened on a predetermined day, and upon opening, the local populations were to rise up and kill every Roman and Italian man, woman, and child they could find. Estimates of the death toll range from 80,000 to 150,000.
      *   **Why Newton uses it:** He's using it as a sarcastic analogy for the *impossibility* of the Arian deletion theory. Just as Mithridates orchestrated a vast, simultaneous, secret massacre across a huge region, Newton mocks the idea that the Arians could have orchestrated a vast, simultaneous, secret deletion of the Comma Johanneum ("the testimony of the three in heaven") from *every single manuscript* across the entire Christian world ("all the world over at once") without leaving a single trace or anyone noticing. He's highlighting the sheer logistical absurdity and the required level of impossible coordination and secrecy. It's a rhetorical flourish to emphasize the ridiculousness of the proposition.

  2.  **The Legitimacy of Newton's Argument:** Newton's argument is **fundamentally sound and based on core principles of textual criticism**, though he presents it with characteristic rhetorical flair and sarcasm. There *is* a real asymmetry between the two scenarios, and he's not just dodging a more modest version.

      *   **Asymmetry in Plausibility:**
          *   **Gradual Addition/Corruption:** This is the *norm* in textual transmission, especially before printing. How it happens:
              *   A scribe might accidentally repeat a phrase from the margin (where a note or commentary existed) into the main text.
              *   A scribe might consciously add a phrase they believed clarified doctrine or harmonized with another passage.
              *   A scribe might misread abbreviations or make an error that introduces new wording.
              *   These changes happen *locally*, in individual scriptoria or regions, as manuscripts are copied. Over time, these altered copies become the source for further copies. The change spreads slowly and unevenly. Some manuscripts retain the original reading, others acquire the addition. This explains the *gradual appearance* of the Comma in the manuscript tradition and its absence from the earliest and most geographically diverse Greek manuscripts, Old Latin versions, and quotations by early Church Fathers.
          *   **Coordinated, Universal Deletion:** This is inherently *implausible* for several reasons:
              *   **Scale and Secrecy:** As Newton mocks, it requires an impossible level of coordination across the entire Christian world (Latin West, Greek East, Syriac churches, Coptic churches, etc.) *simultaneously* under Arian influence. The Arian controversy was fierce, but power shifted constantly. There was never a single moment where "prevailing Arians" controlled *all* scriptoria everywhere.
              *   **Lack of Evidence:** Newton's key point about "blot or chasm" is crucial. When scribes delete text, they usually leave traces:
                  *   Physical evidence: Skipped lines, unusual gaps, erasure marks (palimpsests show this), corrections in margins.
                  *   Textual evidence: Awkward grammar or syntax resulting from the deletion, making the text nonsensical.
                  *   Historical evidence: Records of controversy *about* the deletion, defenses of the original reading, accusations of tampering.
              *   **The "Memory Hole" Problem:** Newton highlights the absurdity that *no one* – not even staunch Trinitarian defenders like Athanasius, engaged in fierce polemics against Arians – ever mentions this powerful Trinitarian proof-text being *removed* by their enemies. If such a crucial verse existed in the original and was universally deleted, it would have been the centerpiece of Trinitarian polemics against Arian textual tampering. The complete silence is deafening evidence *against* its original existence.

      *   **Addressing a "More Modest" Deletion Theory:** Could a deletion have happened less universally? For example, only in certain regions or manuscript families? Newton doesn't explicitly address this, but the textual evidence still overwhelmingly favors addition:
          *   **Absence in Key Witnesses:** The Comma is missing from the oldest and most reliable Greek manuscripts (Sinaiticus, Vaticanus, Alexandrinus, etc.), the earliest Old Latin manuscripts, the Vulgate as Jerome originally compiled it, the writings of the Greek Fathers (including staunch Trinitarians like Athanasius, Basil, Gregory Nazianzen, John Chrysostom), and the earliest Syriac and Coptic versions.
          *   **Late and Limited Appearance:** It only appears sporadically in later Greek minuscules (from around the 10th century onwards) and becomes established in the *Latin* tradition first (entering the Vulgate gradually). Its first *clear* Greek appearance is in a much later manuscript.
          *   **Textual Critical Principle (Lectio Brevior Potior):** Generally, the *shorter* reading is more likely to be original, as scribes are more prone to add for clarification or harmonization than to omit significant material without reason. The Comma is a significant addition.
          *   **Internal Evidence:** As Newton and others point out, the flow of the passage (1 John 5:6-8) reads smoothly and logically without the Comma. The Comma interrupts the sequence about the Spirit, the water, and the blood bearing witness *on earth*.

      *   **Newton's Rhetoric vs. Substance:** While Newton paints the deletion theory in its most cartoonishly impossible form ("Conjurers," "crafty Knaves") for maximum satirical effect, he *is* engaging with the core weakness of *any* deletion theory: the complete lack of physical, textual, or historical evidence to support it, contrasted with the clear evidence of *addition* visible in the manuscript tradition. His sarcasm targets the inherent implausibility of the *only* kind of deletion theory that could explain the Comma's *universal* absence from early witnesses – a universal, coordinated purge. More "modest" theories of regional deletion still fail to explain the *global* absence from early sources and the complete lack of any controversy or evidence surrounding such deletions.

  **Conclusion:** Newton's argument is absolutely legitimate and reflects sound textual critical principles that are still applied today. The gradual, accidental, or locally intentional *addition* of text over centuries is a common and well-documented phenomenon in manuscript transmission. A coordinated, universal *deletion* of a significant passage, leaving no physical trace, no textual awkwardness, and no historical record or controversy whatsoever, is effectively impossible. Newton's "Mithridates" jab brilliantly underscores the logistical absurdity required by the deletion theory, and his core argument about the lack of evidence ("blot or chasm," erased memory) hits the nail on the head. Modern scholarship overwhelmingly agrees with Newton: the Comma Johanneum is a later addition not present in the original text of 1 John. His rhetoric is sharp, but the substance is solid historical and textual reasoning.
