  We are discussing the difference between iterated elimination of strictly dominated strategies (IESDS) when considering only pure strategies versus when allowing mixed strategies. The question is whether a simplification that only checks for domination by pure strategies (pairwise) is equivalent to the full version that allows domination by mixed strategies.

  Key points from the question:
