answer: |-
  Your question touches on a subtle but important aspect of iterated elimination of strictly dominated strategies (IESDS). The simplification you've implemented—only checking for domination by **pure strategies** (i.e., pairwise comparisons)—**is not equivalent** to the full definition that allows domination by **mixed strategies**. There are games where a pure strategy is strictly dominated by a mixed strategy but not by any single pure strategy. Here's why:

  ### Key Insight
  - **Mixed strategies can exploit "complementary" advantages**: A mixed strategy can combine the strengths of multiple pure strategies to dominate a target pure strategy, even if no single pure strategy does so across all opponent actions.
  - **Pairwise checks miss these cases**: Your simplified approach only detects domination if one pure strategy uniformly beats another. It fails to identify situations where a **blend of strategies** collectively dominates.

  ### Concrete Example
  Consider this payoff matrix for Player 1 (rows) against Player 2 (columns):
  |          | **Col L** | **Col R** |
  |----------|-----------|-----------|
  | **Row A** | 1         | 4         |
  | **Row B** | 2         | 2         |
  | **Row C** | 4         | 1         |

  #### Step 1: Check for pure-strategy domination (your simplification)
  - **Is B dominated by A?**  
    - Against L: A (1) < B (2) → No.  
    - Against R: A (4) > B (2) → But domination requires strict superiority everywhere.  
    → **A does not dominate B.**
  - **Is B dominated by C?**  
    - Against L: C (4) > B (2) → Yes.  
    - Against R: C (1) < B (2) → No.  
    → **C does not dominate B.**  
  **Result**: Your approach would **not eliminate B**, as no pure strategy dominates it.

  #### Step 2: Check for mixed-strategy domination (textbook definition)
  - **Consider a mixed strategy: 50% A + 50% C**  
    - Payoff against L: \(0.5 \times 1 + 0.5 \times 4 = 2.5 > 2\) (B's payoff against L).  
    - Payoff against R: \(0.5 \times 4 + 0.5 \times 1 = 2.5 > 2\) (B's payoff against R).  
    → **The mixed strategy (A+C) strictly dominates B everywhere.**  
  **Result**: Full IESDS **eliminates B**, as it should—playing B is irrational when a mix of A and C yields higher payoffs regardless of Player 2's choice.

  ### Why This Matters
  - **Behavioral rationality**: A rational player would switch to the dominating mixed strategy (e.g., randomizing between A and C). Failing to eliminate B means your solver retains a strategy no rational player would use.
  - **Impact on equilibrium**: IESDS often precedes equilibrium computation (e.g., Nash). An incomplete reduction can lead to incorrect equilibria or missed solutions.
  - **The gap is real**: Theorems (e.g., Pearce, 1984) prove that mixed-strategy domination is strictly more powerful than pure-strategy comparisons. Your simplification leaves "zombie" strategies in the game.

  ### Practical Advice
  1. **Do not simplify**: To align with game theory's rationality assumptions, your solver must check for domination by mixed strategies.  
  2. **Efficient implementation**:  
     - For a row strategy \(i\), check if there exists a mixed strategy (with support over other rows) such that:  
       \[
       \sum_{j \neq i} \sigma_j \cdot \text{payoff}(j, k) > \text{payoff}(i, k) \quad \forall \text{ columns } k.
       \]
     - This reduces to a **linear feasibility problem** (solvable via LP or enumeration for small games).  
  3. **Complexity tradeoff**: While mixed-strategy checks are costlier, they are necessary for correctness. Optimize by:  
     - Starting with pure-strategy checks (faster, catches easy cases).  
     - Using small LP solvers (e.g., scipy's `linprog`) for mixed checks.  

  ### Bottom Line
  Your simplification creates a gap: strategies dominated only by mixed strategies (like B in the example) survive elimination. This violates the core goal of IESDS—removing all irrational choices. **Revise your implementation to include mixed-strategy domination** for textbook-accurate results. The extra effort ensures your solver handles real game-theoretic nuances correctly.
