  Also, Rosenthal's response to misrepresentation involves the HOT representing the state as present, so if absent, it's a false representation. But the critic insists the experience is the same. The defender might distinguish between the qualitative properties and how they're presented, but the unresolved tension is whether the presentation requires the first-order state to exist.

  I should structure the dialogue to build these points. Start with the critic introducing the problem, defender responding with Rosenthal's distinction. Critic presses with the phenomenology being identical in targetless cases. Defender suggests it's a non-veridical conscious state. Critic then argues that this implies HOTs can generate qualitative character. Defender clarifies that HOTs are representations, not bearers of qualitative properties. Critic counters that the experience of pain arises solely from the HOT, so for the subject, the qualitative character is in the HOT.

