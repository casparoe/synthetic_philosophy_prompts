  I'm taking a seminar on moral psychology this semester, and we've spent the last two weeks on the literature that uses Mark Twain's Huckleberry Finn as the test case for theories of moral worth: at the decisive moment, Huck refuses to turn in his friend Jim, a runaway slave, even though he sincerely believes at the time that doing so is theft and a sin for which he'll be damned. For my response paper, I need to rank rival accounts of moral worth by how well each explains why Huck's decision still deserves full moral credit, given that his own explicit judgment about the act is mistaken. Score an account as weaker to the extent that it has to either quietly smuggle back in some "correct" belief Huck doesn't actually have, or ends up treating his creditable motive as basically a lucky accident rather than something genuinely to his credit.

  Please rank the following on that basis, from most to least successful:
  - Kant's requirement that the agent act from the motive of duty itself
