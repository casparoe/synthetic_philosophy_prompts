  - Julia Markovits's "coincident reasons" thesis, on which worth requires that the agent's actual motivating reasons coincide with the reasons that justify the act
  - Paulina Sliwa's proposal that moral worth requires acting because of the right-making features, understood as an exercise of practical moral knowledge

