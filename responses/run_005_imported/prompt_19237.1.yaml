  The ranking is based on how well each account explains why Huck deserves full moral credit for not turning in Jim, despite Huck's explicit mistaken judgment that the act is sinful. Accounts are scored as weaker if they must implicitly smuggle in a correct belief Huck lacks or reduce his credit to luck. 

  - **Arpaly's view** ranks highest because it credits Huck's responsiveness to the actual right-making reasons (e.g., Jim's humanity and friendship) without requiring Huck to recognize them as moral, avoiding both pitfalls.
  - **Markovits's thesis** follows closely, as it requires only that Huck's motivating reasons (friendship, compassion) coincide with the justifying reasons, which they do, without relying on his beliefs.
  - **Sliwa's proposal** is weaker because it demands practical moral knowledge (knowing the features are right-making), which Huck lacks, making his credit seem accidental or requiring smuggling.
  - **Herman's proposal** is even weaker, as it cannot explain how Huck's background duty motive (which condemns helping Jim) functions as a "limiting condition" without smuggling in the correct duty.
  - **Kant's requirement** ranks lowest because it insists Huck must act from duty itself, which he explicitly rejects, forcing either smuggling the true duty or treating his act as non-creditable.

