  First, I need to explain why the bucket doesn't prove full Newtonian space. Newtonian spacetime has absolute rest, position, velocity. But the bucket only shows effects during acceleration, not uniform motion. So maybe spacetime has absolute acceleration but not rest. That's Galilean/neo-Newtonian spacetime. The user mentioned this, so I should clarify how it differs.

  Then, relationism. They want to avoid substantivalism. Mach's idea: rotation relative to distant masses, not space. But does that solve the problem? If the universe is empty except the bucket, what happens? Newton says still concave; Mach says flat. But GR shows frame-dragging—mass affects inertia, partly supporting Mach. However, solutions like Gödel's rotating universe complicate it. So Mach isn't fully vindicated.

