  ## Adam Smith's Critique of Empire: Beyond Mercantilism to Principled Opposition

  The debate ignited by your students cuts to the heart of interpreting Smith's complex legacy on empire. While his mercantile system critique is undeniable, a close reading of "Of Colonies," considered alongside his broader philosophical framework, reveals a deeper, more **principled opposition to the logic and practice of empire itself**, even if expressed with characteristic pragmatism and tempered by contemporary political realities. Smith dismantles the *inherent* injustices and economic irrationalities of distant dominion, leaving little coherent room for a sustainable, reformed imperial structure.

  **I. The Unsparing Critique: Foundations of Principled Opposition**

  1.  **The Pernicious Economics of Monopoly & Extraction:**
      *   **Who Profits, Who Pays?** Smith meticulously demonstrates that colonial monopolies (like the East India Company) enrich only "a particular order of men" – merchants, factors, and manufacturers – at the expense of the "body of the people" in the mother country. This occurs through:
          *   **Capital Diversion:** Monopoly artificially channels capital towards less profitable colonial trade, starving domestic investment ("every derangement of the natural distribution of stock is necessarily hurtful").
          *   **Consumer Exploitation:** High monopoly prices burden domestic consumers.
          *   **Tax Burden:** The "blood and treasure" spent defending distant monopolies and colonies falls overwhelmingly on the domestic populace, not the profiteers. The "expense of the ordinary peace establishment of the colonies" is a net drain.
      *   **This is not merely inefficient:** Smith frames it as a systemic *injustice* – a state-sponsored transfer of wealth from the many to the few, enabled by political power and fundamentally distorting the natural economic order. His critique targets the *structure* of dependency and exploitation inherent in the colonial relationship under mercantilism.

  2.  **The Moral Condemnation of Colonial Violence:**
      *   Smith's remarks on indigenous peoples are remarkably blunt for his time, revealing a moral core incompatible with imperial justification. He condemns the "savage injustice" of Europeans, detailing:
          *   **Expropriation & Dispossession:** "The new colonies... established in a distant country" inevitably involved "waste" and "devastation" of native lands.
          *   **Systematic Brutality in the East Indies:** His harshest ire is reserved for the East India Company. He describes its rule as "despotism," its violence as "atrocities," and its representatives as "plunderers" whose "tyranny" and "rapine" devastated Bengal. He explicitly links this violence to the *nature* of distant, monopolistic rule: "Such exclusive companies... are nuisances in every respect; always more or less inconvenient to the countries in which they are established, and destructive to those which have the misfortune to fall under their government."
      *   **This is not contingent critique:** Smith doesn't argue these were merely poorly managed empires. He identifies the violence and injustice as *consequences* of the power imbalance and the pursuit of distant dominion by monopolistic entities backed by European states. The "dream of empire" itself facilitates and encourages such "injustice."

  **II. The American Crisis: Pragmatism vs. Principle**

  The American proposals are the strongest textual evidence for a "reformed empire" reading, but they collapse under scrutiny:

  1.  **The Union Scheme: A Reluctant Hypothetical:** Smith presents parliamentary union as the *only* alternative to separation *if* Britain insists on maintaining sovereignty. He explicitly states it's the "only system" that could reconcile "obedience" with "liberty." Crucially, he does **not** present it as a *positive ideal*.
  2.  **Overwhelming Pessimism & Preference for Separation:**
      *   **Political Impossibility:** Smith immediately dismisses the union scheme's feasibility. British elites ("the pride of our own people") would never accept American representatives as equals ("would mortify... their national vanity"), nor would they consent to proportional taxation. The scheme is a "utopia" – politically dead on arrival.
      *   **Preference for Separation:** Faced with the impossibility of just union *and* the intolerable injustice/cost of the status quo, Smith explicitly advocates for separation: "To propose that Great Britain should voluntarily give up all authority over her colonies... would be to propose such a measure as never was, and never will be adopted... **If it was adopted, however, Great Britain would not only be immediately freed from the whole annual expense of the peace establishment of the colonies, but might settle with them such a treaty of commerce as would effectually secure to her a free trade... more advantageous to the great body of the people, though less so to the merchants, than the monopoly which she at present enjoys.**" Here, principle shines through: separation is economically rational *and* morally preferable to coercive, unjust rule. It frees Britain from the burdens of empire and allows for mutually beneficial commerce.
      *   **Rejecting Coercion:** Smith unequivocally rejects the use of force to maintain the existing, unjust colonial relationship. The "golden dream" of empire through conquest is a dangerous fantasy disproportioned to Britain's resources and ultimately self-destructive.

  **III. The Four Stages & Societal Ranking: Constraining, Not Endorsing Empire**

  Smith's stadial theory (hunting, pastoral, agricultural, commercial) ranks societies based on modes of subsistence. While this reflects Enlightenment hierarchical thinking:

  1.  **It Does Not Justify Conquest:** Smith never argues that "higher" stages have a *right* to rule "lower" ones. His condemnation of European violence against indigenous peoples (whom he places in earlier stages) is explicit and moral, not relativistic.
  2.  **Focus on Internal Development:** The theory explains societal progress through *internal* economic evolution and the security of property, not external conquest. His critique of colonies often highlights how imperial structures *distort* this natural development in *both* colony and metropole.
  3.  **Commerce Over Dominion:** The logic of the commercial stage, which Smith champions, is voluntary exchange and mutual benefit, not territorial dominion. Empire, as practiced, contradicts this logic through coercion and monopoly. His ideal vision is a world of independent nations trading freely.

  **Conclusion: Principled Critic, Pragmatic Voice**

  Smith's stance is best characterized as a **principled critique of empire**, grounded in economic rationality, moral condemnation of its inherent violence and injustice, and a belief in the superiority of voluntary commercial relations over coercive dominion. While the mercantile system is his primary analytical target, his arguments consistently reveal deeper flaws in the imperial project itself:

  *   **Structural Injustice:** Empire, as then constituted, inevitably created exploitative monopolies and transferred wealth unjustly.
  *   **Systemic Violence:** Distant rule by monopolistic companies or mother countries led predictably to the "savage injustice" against indigenous populations he condemned.
  *   **Economic Irrationality:** The net cost-benefit analysis for the mother country was negative, draining resources and distorting capital allocation.
  *   **Political Impossibility of Just Reform:** His American "solution" of union was presented not as an endorsement of reformed empire, but as the *only conceivable just alternative within an imperial framework* – an alternative he immediately dismissed as politically unviable. His clear preference was separation and free trade.
  *   **Moral Preference for Self-Determination:** His condemnation of colonial violence and his argument that separation would be mutually beneficial reveal an underlying belief that societies are best governed by their own inhabitants according to their own interests.

  Smith was a pragmatist writing amidst a crisis. He understood the political power of imperial sentiment ("the golden dream"). Yet, his analysis relentlessly exposes empire's rotten foundations – economic, moral, and political. He dismantles the mercantilist engine *and* the imperial chassis it powered. His proposed "remedies" for America are concessions to political reality, not blueprints for a renewed empire. His core conviction points toward a world of free, independent nations engaging in voluntary commerce, liberated from the burdens and brutalities of distant dominion. Therefore, while perhaps not a radical anti-imperialist in the modern sense, Smith's *Wealth of Nations*, particularly "Of Colonies," offers a **fundamental and principled critique of the logic and practice of empire as he knew it**, leaving no sustainable or just model of imperial union standing by the end of his analysis. The dream of empire, for Smith, was not merely inefficient, but fundamentally incompatible with justice, sound economics, and the natural progress of societies.
