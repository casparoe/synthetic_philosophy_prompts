  ## Program Equilibrium and the Folk Theorem

  In the setting of program equilibrium, each player submits a program (a Turing machine) that can read the source code of the other program(s) and then choose an action. A program equilibrium is a pair of programs (P1, P2) such that each program, when given the other's source code, outputs an action, and the resulting action profile is a Nash equilibrium (i.e., no player can unilaterally change their program to get a better payoff).

  The folk theorem in this context (as established by Tennenholtz and others) states that for any individually rational payoff vector (i.e., a payoff that is at least the minmax payoff for each player), there exists a program equilibrium that achieves that payoff.

