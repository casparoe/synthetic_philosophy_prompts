  **Justification of Scores:**

  1.  **Owen (Move 1: +1)**  
      *Score Rationale:* Owen correctly characterizes Walton's position and provides a valid behavioral argument (inaction as evidence against real fear). While this view has limitations (as Naomi shows), it's a coherent application of Walton's framework and highlights a genuine puzzle about fictional emotions. Not clearly mistaken, but not decisive either.

  2.  **Naomi (Move 2: +2)**  
      *Score Rationale:* Naomi's counterexample is highly effective. The glass-floor case successfully demonstrates that genuine, visceral fear can occur *without* corresponding belief-driven action (due to a countervailing safety belief). This directly challenges Owen's claim that inaction proves the emotion isn't real and strongly supports the thought theorist's core claim that vivid mental representation (entertaining the thought of falling) can generate real emotion independently of an *action-driving* existence-belief. Clearly correct and a powerful objection.

  3.  **Owen (Move 3: -1)**  
      *Score Rationale:* Owen's attempt to distinguish the glass-floor case fails. While he correctly notes the *physical reality* of height/gravity, Naomi's point is about the *psychological mechanism* of fear generation. The fearful person's *immediate experience* is driven by the vivid *thought* of falling, not by constantly calculating the low probability based on real physics. His demand for an account of why thoughts cause emotion is reasonable, but his dismissal of the analogy is weak and avoids Naomi's core point: the phenomenological similarity in the emotion-generation mechanism (vivid thought). Mistaken in its dismissal.

  4.  **Naomi (Move 4: +2)**  
      *Score Rationale:* Naomi delivers a decisive blow with the nightmare and deliberate imagination cases. These are paradigmatic examples of intensely real emotions (terror, distress) generated *purely* by mental content (thoughts/images) that track *nothing* actual or even possible in the external world during the experience. This perfectly exemplifies the thought theory mechanism and forces Owen into an untenable position: either accept these as real emotions (undermining his reality-tracking requirement for real emotion) or bite the bullet and deny they are real (which is highly counterintuitive and conflicts with common experience and psychology). Clearly correct and exposes a major weakness in Owen's (Walton-inspired) position.

  **What Both Might Be Overlooking:**

  Both debaters focus primarily on the *elicitation* mechanism (pretense vs. thought) and the *reality* of the feeling (quasi vs. real), potentially overlooking crucial aspects of **intentionality** and **functional role**. Real emotions are typically *about* something and involve evaluative judgments (e.g., judging a situation as dangerous for fear). While thought theory explains elicitation well (Move 2 & 4), it needs to account for how emotions directed at *known fictions* can have genuine *intentional objects* (Anna Karenina *herself*) without existential commitment. Walton's make-believe addresses intentionality within the game but at the cost of downgrading the emotion's reality. A fuller account might need to integrate the phenomenological reality of the affect (emphasized by thought theory and Naomi's examples) with an explanation of its intentional structure and how it functions within our engagement with narrative *as* fiction, distinct from delusion or reality. Additionally, the *social and cultural practices* surrounding fiction consumption might play a role in shaping these emotional responses beyond simple pretense or thought-entertainment.
