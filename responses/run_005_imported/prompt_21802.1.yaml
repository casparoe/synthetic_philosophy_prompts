answer: |-
  ## The Textual Silence That Split an Antislavery Movement: Garrison, Douglass, and the Unnamed Institution

  The fracture within the American antislavery movement over the Constitution's character was, at its core, a profound dispute about how to read a text deliberately shrouded in euphemism. William Lloyd Garrison and his followers, including the young Frederick Douglass, saw the document as inherently corrupted by its compromises with slavery. Their rallying cry, "a covenant with death, and an agreement with hell," was not mere hyperbole but a conclusion drawn from interpreting the Constitution through the lens of the framers' *intentions* and the document's *functional reality*. By 1851, however, Douglass dramatically reversed course, embracing a view championed by figures like Lysander Spooner: the Constitution, read strictly by its *text* and stated *purposes*, was fundamentally antislavery. The pivot hinged crucially on the fact that the words "slave" and "slavery" never appear. Evaluating the strength of Garrison's intentionalism against Douglass's emergent textualism requires scrutinizing the three disputed clauses where the "peculiar institution" hid behind circumlocution.

  **The Garrisonian Reading: Intentionalism and Functional Reality**

  Garrisonians argued that interpreting the Constitution required looking beyond the sanitized text to the undeniable historical context and the framers' known purposes. The euphemisms were not accidents but deliberate obfuscations designed to placate Northern consciences while securing Southern interests. Their interpretation focused on *function*:

  1.  **Article I, Section 2, Clause 3 (The "Three-Fifths" Clause):** "Representatives and direct Taxes shall be apportioned... according to their respective Numbers, which shall be determined by adding to the whole Number of free Persons... three fifths of all other Persons."
      *   **Garrisonian Strength:** Who were the "other Persons" if not enslaved Africans? Everyone at the Constitutional Convention understood this clause existed *solely* to grant slaveholding states increased political power based on a population they held in bondage. The text’s silence on the word "slave" was semantic evasion, not substantive neutrality. Functionally, it embedded slavery’s political advantage into the structure of the federal government. Denying this required willful blindness to the Convention's debates and the clause's immediate, undeniable effect.

  2.  **Article I, Section 9, Clause 1 (Slave Trade Clause):** "The Migration or Importation of such Persons as any of the States now existing shall think proper to admit, shall not be prohibited by the Congress prior to the Year one thousand eight hundred and eight..."
      *   **Garrisonian Strength:** "Migration or Importation" of what "Persons" were states "think[ing] proper to admit" and that Congress was explicitly barred from stopping for 20 years? The historical record is unambiguous: this was a direct concession protecting the international slave trade. The framers' intent, reflected in the debates and the immediate exploitation of the clause, was to shield a vital economic pillar of the slave system from federal interference for a generation. The euphemism didn't change the clause's pro-slavery operation.

  3.  **Article IV, Section 2, Clause 3 (Fugitive Slave Clause):** "No Person held to Service or Labour in one State, under the Laws thereof, escaping into another, shall, in Consequence of any Law or Regulation therein, be discharged from such Service or Labour, but shall be delivered up on Claim of the Party to whom such Service or Labour may be due."
      *   **Garrisonian Strength:** This clause presented the strongest case for intentionalism. The phrase "Person held to Service or Labour" was the universal legal euphemism for enslaved people in state statutes. The clause's *purpose* was explicitly stated in Convention debates: to replace the weak fugitive provision of the Articles of Confederation and *compel* free states to cooperate in returning runaways. It created a federally mandated enforcement mechanism for the recapture of human property, regardless of the text's avoidance of the S-word. Its function as a slave-catching mandate was undeniable.

  Garrisonians concluded that the Constitution, by its deliberate design and practical operation, was a bulwark of slavery. The euphemisms were a thin veil; to treat them as meaningful neutrality was naive or complicit.

  **The Douglassian Reading: Textualism and Antislavery Potential**

  Douglass, persuaded by Spooner's *The Unconstitutionality of Slavery*, shifted to a rigorous textualism. He argued that the Constitution must be interpreted solely by its language and declared purposes (establishing justice, ensuring domestic tranquility, promoting the general welfare, securing liberty), not the unstated intentions of individuals or its contemporary misuse:

  1.  **Three-Fifths Clause:** Douglass focused on the text: "all other Persons." The Constitution does not define these persons as property or slaves. It simply counts them partially for apportionment. He argued this was a *limitation* on slave power – full counting would have given the South even more representatives. Furthermore, the clause treated them as *persons*, not chattel. The text offered no *positive* sanction for slavery; it merely acknowledged a demographic reality for representation without endorsing the underlying condition. Its injustice lay in counting enslaved people *at all* for their oppressors' benefit, but the clause itself did not *create* or *constitutionally legitimize* the status of slavery.

  2.  **Slave Trade Clause:** Douglass noted the text speaks only of "Migration or Importation of such Persons." It does not authorize slavery or the slave trade; it merely imposes a 20-year *limitation* on Congress's otherwise plenary power to regulate migration/importation. The clause implicitly acknowledges Congress *can* prohibit it after 1808. The euphemism "such Persons" is vague. While historically applied to enslaved Africans, the text itself contains no mandate *for* slavery. It was a temporary restriction on federal power, not a positive grant of authority to slave traders.

  3.  **Fugitive Slave Clause:** This was the hardest test for Douglass. He argued "Person held to Service or Labour" could theoretically include indentured servants, a status recognized in Northern states. The clause mandates the return of someone held *"under the Laws* thereof" of the state they fled. If a state had no law establishing slavery (or "service or labour" akin to it), Douglass contended the clause might not apply. More importantly, he argued the clause merely prevented states from nullifying the legal claims of *other* states; it did not create a *federal* right to slavery or mandate *federal* enforcement mechanisms beyond non-interference by the receiving state. The notorious 1850 Fugitive Slave Act, he later argued, was therefore an unconstitutional expansion beyond the text. The clause’s wording was an evasion, but it did not explicitly enshrine slavery in the fundamental law.

  Douglass's core argument was that the Constitution, by its silence on slavery and its use of neutral terms like "persons," provided no *constitutional* foundation for the institution. Slavery existed solely by state law, and the federal government, guided by the Constitution's stated purposes of liberty and justice, possessed the latent power (especially after 1808) to restrict and ultimately dismantle it where its jurisdiction applied. Proslavery forces had *usurped* the text, not been empowered by it.

  **Weighing the Arguments: A Qualified Verdict**

  Both readings possess intellectual force, but neither escapes significant challenges. The strongest Garrisonian argument is functional and intentional: the clauses *were* designed by slaveholders, *were* understood by contemporaries as protecting slavery, and *did* operate to sustain the slave system. Denying this requires isolating the text from the very context that gave it meaning. The Fugitive Slave Clause is particularly damning for intentionalism – "Person held to Service or Labour" was an unmistakable contemporary euphemism for "slave," and the clause's purpose was singular.

  However, Douglass's textualism exposes a crucial vulnerability in the Garrisonian position: **the Constitution's text *does* possess an inherent ambiguity and potential that intentionalism can downplay.** The words chosen *are* euphemisms; they *avoid* naming slavery. The stated purposes *are* aspirational and universal, not proslavery. The Slave Trade Clause *is* a temporary restriction, not a permanent guarantee. The Three-Fifths Clause *does* treat the enslaved as persons, however partially counted.

  The most significant objection to Douglass's mature view, particularly regarding the Fugitive Slave Clause, is that it borders on **disingenuousness.** While "Person held to Service or Labour" *could* theoretically cover indentured servants, the overwhelming historical context and universal contemporary application leave no doubt about its primary, intended target. Ignoring this context makes textualism seem like willful naivete or special pleading.

  **Verdict:** Garrison's intentionalist reading more accurately reflects the **historical reality and functional purpose** of the clauses, *especially* the Fugitive Slave Clause (Article IV, Section 2, Clause 3). The framers' intent and the clauses' immediate operation were undeniably proslavery compromises. However, Douglass's textualist reading reveals a **constitutional ambiguity and latent antislavery potential** within the document, particularly evident in the Three-Fifths Clause (Article I, Section 2, Clause 3) and the Slave Trade Clause (Article I, Section 9, Clause 1). The text's evasion created a space for reinterpretation and political struggle. While Garrison captured the Constitution's original sin, Douglass identified the textual footholds that would later allow the Reconstruction Amendments to refound the nation on an explicitly antislavery basis. His reading, though arguably strained regarding the Fugitive Clause on strict historical grounds, was not merely wishful exegesis; it was a powerful act of political and constitutional imagination that exploited the text's deliberate silence to wage a more effective battle within the framework it provided. The Constitution's refusal to name slavery proved to be both its original complicity and its eventual path toward redemption.
