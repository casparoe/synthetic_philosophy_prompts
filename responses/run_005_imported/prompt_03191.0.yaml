  I'm plotting a sci-fi novel set on a generation ship, and there's a scene I want to nail where two of my characters -- the ship's resident "philosophers of probability," basically its odd couple -- get into a real arguement about anthropic reasoning. One of them leans on something like the self-sampling assumption to figure out roughly how far into the voyage they are, doomsday-argument style. the other's a self-indication assumption die-hard who thinks that whole line of reasoning is busted. can you write their fight as a dialogue, and make sure it actually gets into the presumptuous philosopher problem -- the part where SIA seems to let you settle big cosmological questions from an armchair just by favoring whichever theory implies more observers exist. don't let either of them be a strawman, give them both real ammo, and it'd be great if the SSA guy has to squirm a bit when the doomsday-argument weirdness of his own view gets thrown back at him too.
