answer: |-
  That's an exceptionally sharp parallel to draw. Newton would likely view modern AI-risk forecasters through a complex, critical lens—simultaneously recognizing methodological kinship and condemning what he'd see as a repetition of prophetic hubris. Here's how his reasoning might unfold:

  ### 1. **On Timelines & Discrediting the Field: A Double-Edged Sympathy**
     - **Shared Defensive Posture**: Newton would recognize the AI-risk researchers' fear that a failed prediction could discredit their field. His 2060 calculation was explicitly framed as a *corrective* to "fanciful men" (like the Millerites of his era) whose failed doomsdays made serious prophecy-study seem absurd. Similarly, AI forecasters like those at MIRI or ARC often stress their timelines are "not predictions but precautions" to avoid reckless dismissal of existential risk.
     - **But Condemning Specificity**: Despite this, Newton would see a fatal flaw: **secular timelines lack divine authority**. His chronology rested on decoding *scriptural* prophecy (Daniel's "time, times, and half a time" → 1,260 years) via a hermeneutic he believed was objectively true (day-for-year). AI timelines, however, extrapolate from contested models of compute scaling, alignment difficulty, and emergent capabilities—variables Newton would deem speculative "conjecture." To him, replacing biblical cipher with trendlines on GPU clusters would epitomize the "presumption" he condemned.

  ### 2. **On Method: Purification vs. Profanity**
     - **Historicism’s Secular Shadow?**: Newton’s "historicist" method (mapping prophecy to church history) required painstaking textual scholarship to "purify" corrupted scripture. AI-risk research aims similarly to "purify" rational forecasting by quantifying uncertainty (e.g., Laplace's rule, Monte Carlo simulations). Newton *might* respect this as a secularized form of systematic inquiry—but only superficially.
     - **The Idolatry of Modeling**: He’d recoil at elevating mathematical models to the status he reserved for revealed prophecy. To Newton, AI timelines would be **idolatry of a new kind**: worshipping extrapolations of human reason as if they possessed the authority of divine revelation. His life’s work was restoring *God’s* chronology; AI forecasters are constructing their own—a blasphemous inversion in his eyes.

  ### 3. **Institutional Corruption: The Repeating Cycle**
     Newton’s core insight was that institutions (*especially* state-aligned ones) corrupt truth. His research "proved" how Nicaea’s political machinations perverted doctrine. Applied to AI:
     - **Labs as Modern Ecclesiarchs**: He’d see OpenAI, Anthropic, and government agencies (e.g., UK AI Safety Institute) as analogous to the Council of Nicaea: bodies with vested interests in controlling the narrative. Just as Athanasius "corrupted" scripture to consolidate power, labs might downplay risks to secure funding/regulation, while governments might exaggerate risks to justify control.
     - **"Safety" as Orthodox Dogma**: Newton would predict that "AI safety" (like Trinitarianism) will become institutional dogma—not because it’s empirically sound, but because it serves power. Alignment research might be co-opted to entrench incumbents (e.g., restricting open-source models as "heresy"), while genuine threats (e.g., deceptive alignment) get obscured like Arianism.

  ### 4. **The 2060 Parallel: Rebuke vs. Relitigation**
     Crucially, Newton’s 2060 was a *floor* ("it may end later, but I see no reason for its ending sooner") to chastise date-setters. Modern AI timelines (e.g., "10% chance of AGI catastrophe by 2030") are probabilistic *ceilings* urging action. To Newton, this inversion would confirm his worst fears:  
     - **Secular Apocalypticism**: AI forecasters are not chastising reckless predictors but *becoming* them—using numbers to lend false precision to uncertainty, exactly as "fanciful men" did with scripture.  
     - **The Ultimate Irony**: By trying to save rational forecasting from discredit, they risk repeating the cycle that discredited prophecy. Newton spent decades exposing how date-setting corrupted eschatology; he’d see AI timelines as corrupting rationalism similarly.

  ### Conclusion: Heir or Heretic?
  Newton would view AI-risk forecasters as **unwitting heretics** within his own tradition. They mirror his methods (systemizing uncertainty, fighting institutional corruption) but commit his cardinal sin: elevating human conjecture to the status of divine calculus. To him, their timelines would be a **secular recapitulation of Nicene corruption**—well-intentioned scholars whose "mathematical Athanasianism" risks creating a new idolatry of prediction, ripe for exploitation by modern powers. His verdict would likely be scathing: *"You have secularized my fight against presumption, only to commit presumption with new tools. You fear discrediting your field? You should fear discrediting Reason itself."* 

  In essence, Newton’s ghost would haunt the AI debate not as an ally, but as a chillingly relevant critic of prophecy’s eternal recurrence.
