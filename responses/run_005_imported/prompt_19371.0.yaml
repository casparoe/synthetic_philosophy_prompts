answer: |-
  Here is a dialogue between "N" (Nominalist, inspired by Caffentzis) and "P" (Pragmatist, emphasizing real productive capacity), each pressing the other's textual and conceptual weak point:

  1.  **P:** Your nominalist reading founders on Berkeley’s *insistence* on backing. Q291 asks: "Whether the value of the current cash or ticket be not in a great measure owing to its *circulating*? And whether its circulation doth not depend on its being *restrained* to a due proportion to the industry which it circulates?" This "due proportion" is real, not conventional. If money is *only* a conventional sign, why this anxiety about anchoring it to actual industry and land?
  2.  **N:** Because the *convention itself* requires stability to function! Q23 defines money as "tickets or counters for reckoning, recording, and transferring... power," specifically "the power of commanding the industry of others." The sign's *meaning* is "power," which *is* real productive capacity. Backing *is* the public understanding that the sign reliably points to that real power. Without that reliable connection, the convention collapses – as he saw in the South Sea Bubble, where signs pointed to fictitious power.
  3.  **P:** But that’s precisely my point! What *ensures* that reliable connection if not something *non-conventional*? Q503 asks: "Whether money circulated by the Bank, and secured on land, would not have a more solid and real foundation, than if it were secured on money?" He explicitly rejects purely conventional security ("money secured on money") for land and industry. Doesn't this show "power" is the *real referent* the sign *must* answer to, limiting convention?
  4.  **N:** It shows the *content* of the convention must be grounded in reality for the *system* to be stable and useful, just as language requires reference to real ideas for communication. But the *value* of the sign *as money* remains conventional. Q6: "Whether money is to be considered as having an intrinsic value, or as being a commodity, a standard, a measure, or a pledge, as is commonly thought?" He rejects "intrinsic value." The land/industry backing is the *reason* for the convention’s adoption and stability, not the *source* of the sign's monetary value *per se*. Its value *as money* is assigned.
  5.  **P:** Then explain Q290: "Whether the public hath not an unlimited power over its own coin, to assign it what value it pleaseth?" *That* sounds purely conventional. But immediately after, he ties the bank's issue to "the security of land, and of manufactures and commerce." If convention is truly unlimited, why bind it? Your "grounding" looks suspiciously like a non-conventional anchor smuggled in. What *principled* limit, within Berkeley's *own* nominalist framework, prevents the public from assigning infinite value to paper, if not the reality of productive power?
  6.  **N:** The limit *is* practical and experiential, derived from his epistemology! Unlimited issue *severs* the sign from its object ("power") and destroys the convention's utility, just as meaningless words destroy language. Q440: "Whether money, considered as a ticket or counter, may not be void of intrinsic value? And yet be levied on the best and most secure fund, to wit, on the industry of the nation?" The "fund" is the *object* the sign *must* signify for the convention to function effectively. Berkeley’s immaterialism doesn’t deny objects, it denies *mind-independent* substance. The "power" is a real object of perception/experience, and signs must track it.
  7.  **P:** But you conflate the *object* (industry) with the *sign's function* (money). My question stands: What, *in the nominalist account of the sign itself*, prevents the convention from assigning value arbitrarily *despite* the real object? Berkeley saw the South Sea Bubble: signs circulated *detached* from real value, driven by convention alone, until it collapsed. His remedy wasn’t *better* convention, but *re-attaching* signs to land/industry – a real, non-semantic constraint. Q296: "Whether the true idea of money, as such, be not altogether that of a ticket or counter?" *But also* Q297: "Whether, nevertheless, that which is to pass as money, should not be *secured* on land?"
  8.  **N:** The collapse *demonstrates* the failure of the convention when it loses its grounding! The sign becomes meaningless, a "word" without an idea. The "constraint" isn't an external metaphysical anchor, but a requirement *internal* to the successful *use* of the sign within the system. "Secured on land" provides the *empirical content* that stabilizes the convention, making the sign reliably signify real "power." It’s pragmatic, yes, but the *value* of the counter *as counter* remains constituted by the system of exchange, not by the land's intrinsic monetary worth (which he denies!).
  9.  **P:** Then we agree the sign must be "secured" by real productive capacity? But if the sign's value *as money* is purely conventional, what does "secured" *mean*? It implies the sign *derives* its stability/value from something external to the convention – the land's *real* productive potential. Isn't "power" doing the heavy lifting here *as* a real economic force, not just as the sign's semantic object? If the sign's value is conventional, "backing" is merely psychological reassurance. But Berkeley treats it as a *structural necessity*.
  10. **N:** "Secured" means establishing the *condition* for the convention to function reliably. It provides the *content* the sign must point to for the monetary "language" to have meaning and avoid the collapse he witnessed. The *value* of the £1 note is conventional – society agrees it signifies a unit of purchasing power. But that agreement *only holds* if society perceives the system reliably connects notes to real productive output ("power"). The land/industry is the *empirical foundation* enabling the *convention* to persist. It's not the *source* of the pound's value *as money*; it's the *guarantor* of the convention's stability. Berkeley rejects intrinsic value but demands *empirical grounding* for the sign system.
  11. **P:** And that "empirical grounding" *is* the non-conventional element limiting convention! The "power" is real, measurable capacity, setting the "due proportion" (Q291). Without it, convention is unmoored. You call it the "condition" or "content," but Berkeley's constant return to it – especially against pure credit bubbles – shows it's the *determining* factor. His nominalism describes money's *form*, but its *viability* requires anchoring in real economic substance. The "ticket" must be redeemable for something beyond belief.
  12. **N:** Yet it's never redeemed for *specie* or land *as commodity*, but for the *products* of industry – the *exercise* of power. The sign mediates the *real* power, but its *monetary function* remains conventional. The anchoring is necessary for stability, but it doesn't make the sign's value non-conventional; it makes the convention *about* something real and stable. Berkeley offers a sophisticated nominalism where the sign's meaning *is* real productive capacity, and its successful function *requires* practical constraints, not metaphysical ones.

  **(Ends at 12 exchanges. Both sides have pressed the core tension: N must explain "backing" within nominalism; P must explain the rejection of "intrinsic value" and the source of limits. Neither fully resolves it, mirroring the interpretive debate.)**
