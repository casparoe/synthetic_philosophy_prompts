  I'll structure the dialogue with 8-12 exchanges. Each speaker must respond directly to the previous point, not just restate positions. They need to be equally knowledgeable about the text. 

  Starting with the pragmatist makes sense because the user describes the nominalist reading first. The pragmatist can challenge how nominalism handles backing. Then the nominalist can counter by asking about principled limits without intrinsic value. 

