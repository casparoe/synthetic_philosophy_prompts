  Also, disclosure. Does Marcus present the statistics after the clip? The problem says they open with the clip before giving statistics. But Lena implies that the clip might bias the interpretation of subsequent stats.

  Moreover, the concept of "informed consent" in a commercial context. Customers should make decisions based on accurate risk assessments.

  Another point: public health campaigns are for social good, while selling home security is for profit. But both can be legitimate; the difference might be in the accuracy of risk portrayal.

  Lena's campaigns might use vividness to highlight underappreciated risks, whereas Marcus's might exaggerate a small risk.

  But not all public health campaigns are perfect; some might use fear excessively.

  In this case, since the burglary rate is low, using a vivid clip might be seen as fearmongering.

  Now, for the fair test Marcus proposes: if a fully rational, informed customer would buy it, then it's okay. But if the actual risk is low, and the cost is high, a rational customer might not buy it. Marcus assumes it reduces real risk, but the benefit might be small in absolute terms.

  For instance, if burglary risk is 1 in 1000, and the system reduces it by 50%, but costs $1000, the expected value might not justify it for many, but the vivid story makes people overestimate the initial risk or the reduction.

  A rational customer would calculate the expected utility.

  But Marcus's pitch might not provide all info upfront; they start with the clip.

  Lena might say that the clip sets an emotional tone that undermines rational evaluation.

  Unaddressed considerations:

  - The role of emotion in decision-making: Some argue that emotions are part of rational decisions, but when manipulated, it's unethical.

  - Transparency: Marcus could present both the vivid story and the statistics together to give a balanced view, but opening with the story might anchor bias.

  - Comparative risk: Lena might point out that people often misjudge risks; e.g., fearing burglary more than car accidents if a story is vivid.

  - Professional ethics: In public health, there might be guidelines to avoid undue fear, whereas sales might prioritize persuasion.

  Neither speaker raises the issue of whether the customer ends up better off. If the system truly reduces risk, and the vivid clip gets them to buy it when they otherwise wouldn't, it might be beneficial. But if the risk was negligible, it could be a waste of money.

  But that's paternalistic; customers should decide based on accurate info.

  In manipulation, the method matters, not just the outcome.

  Marcus's test focuses on outcome with rational agent, but in practice, it's about the process.

  I think Lena has the better argument overall, but let's confirm each move.

  Final evaluation per move:

  - Move 1: Lena better

  - Move 2: Marcus better

  - Move 3: Lena better

  - Move 4: I think Marcus is weaker here. His bias equivalence is false; using statistics isn't exploiting a bias in the same way as using vividness to override base rates. Statistics provide data; vivid stories provide emotional impact. Also, his rational customer test ignores that the pitch is designed for irrational customers. If the pitch relies on bias to work, it might not survive rational scrutiny. So Lena has the better of move 4 implicitly, but Marcus's point about sincerity might be noted.

