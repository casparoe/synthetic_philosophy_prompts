  4. Marcus counters that exploiting a bias isn't the test, since using stats exploits a "numbers sound authoritative" bias. He says the fair test is whether the pitch would work on a fully rational, informed customer.

  I need to evaluate each move.

  **Move 1: Lena's initial claim**

  Lena argues that using a vivid news clip is manipulative because it exploits the availability heuristic. The availability heuristic is a cognitive bias where people judge the likelihood of an event based on how easily examples come to mind. A recent burglary story makes burglary seem more common than it is, crowding out the statistical reality.

  This seems strong. Marcus's practice could indeed be seen as leveraging a cognitive bias to induce fear and urgency, which might lead customers to overestimate risk and buy the system without proper consideration of the actual risk reduction.

  Better of it: Lena has a good point here. It's a common critique in behavioral economics that vivid anecdotes can distort risk perception.

  **Move 2: Marcus's response**

  Marcus says vividness isn't inherently manipulative because effective communication often uses stories and images. He points to Lena's public-health campaigns, which likely use emotional stories to convey health risks (e.g., a smoker's lung cancer story to discourage smoking).

  He's arguing that if vividness is manipulative, then most persuasion, including Lena's work, would be manipulative, which is absurd.

  This is a fair counter. It challenges Lena to distinguish between legitimate and manipulative use of vividness.

  Better of it: Marcus has the better of this move because he successfully points out that vividness is widely used in ethical persuasion, so it can't be condemned outright. Lena needs to refine her argument.

  **Move 3: Lena's refinement**

  Lena clarifies that the issue isn't vividness itself, but its function. In Marcus's pitch, the vivid clip is used to outweigh the base rate (the low burglary rate) that the customer might already be aware of. It's intended to create a distorted perception that wouldn't hold up if they saw the full statistics. In contrast, her campaigns use vivid cases to convey an accurate risk, especially when people underestimate it.

  For example, in public health, if people think a disease is rare, a vivid story might be used to correct that underestimation and convey the true risk. Here, the burglary rate is low, so the vivid story might overestimate the risk.

  Lena is invoking the base rate fallacy or neglect. When people have a prior belief (low burglary rate), a vivid instance can make them ignore that base rate.

  Better of it: Lena has the better of this move. She provides a principled distinction: using vividness to correct underestimation vs. exploiting it to create overestimation. This aligns with ethical communication where vividness should aim for accuracy, not distortion.

  **Move 4: Marcus's counter**

  Marcus says that deliberately exploiting a bias can't be the test because Lena's use of statistics exploits a bias too—people think numbers sound authoritative. He argues that the fair test is whether the pitch would succeed with a fully rational, informed customer. Since he believes the system reduces risk, it would pass this test.

  First, Marcus is equating using statistics with exploiting a bias. But statistics, when accurate, are evidence-based, not necessarily a bias. The "numbers sound authoritative" might be a bias, but if the numbers are true, it's not misleading.

