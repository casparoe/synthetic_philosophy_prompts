  First, I need to address both sides fairly. The pay camp argues immediate safety for the whistleblower is paramount, and since the attackers might not track reputations, paying could be a one-off. The don't-pay camp believes paying sets a precedent, making all newsrooms targets. The user mentioned the attackers use a spreadsheet, so their capability to track who pays is crucial. 

