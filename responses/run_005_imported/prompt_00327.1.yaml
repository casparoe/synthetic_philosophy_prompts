  So I was reading about Gödel's incompleteness theorem last night and stumbled on this Penrose/Lucas argument that basically says a computer can never prove its own Gödel sentence but a human mind can just "see" that its true, so computers can never be truly intelligent the way we are. That seems like a pretty airtight mathematical proof that AGI is fundamentally impossible, no? Kinda curious why AI researchers dont just treat this as settled and move on to other stuff instead of chasing human-level reasoning machines.
