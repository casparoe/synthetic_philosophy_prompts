  The friend's argument is that her own actions don't affect the wrongness of the user's actions. That's technically correct in terms of objective morality. An action's moral status doesn't change based on who points it out. But the user's concern is about the friend's standing to blame. That's where hypocrisy comes in. 

  Hypocrisy can undermine the blamer's authority. If the friend is constantly doing the same thing, her criticism lacks sincerity. The user might feel the confrontation was unfair because the friend isn't acting in good faith. There's also the element of betrayal—confronting someone harshly while doing worse oneself damages trust. 

  I should consider the difference between the act's wrongness and the legitimacy of the blame. The user might be conflating these. The act might still be wrong, but the friend's right to call it out is weakened by her hypocrisy. This ties into theories of moral address—blame isn't just about pointing out wrongs but involves a relational aspect. Hypocrites compromise that relational standing. 

