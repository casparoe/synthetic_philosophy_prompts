answer: |-
  You've hit on a core tension in Quine's philosophy of language, and your skepticism is well-founded. Quine's indeterminacy thesis **does not imply that translation is impossible or that communication fails**. Instead, it challenges our intuitive notions of *what meaning is* and *how translation works*. Here's a breakdown of why real-world translation succeeds despite indeterminacy:

  ### 1. **Quine's Thesis: A Deeper Claim**
     Quine argues that **meaning is not a determinate mental entity** (rejecting "meanings" as abstract objects or private ideas). Instead, meaning is grounded in **publicly observable behavior**:
     - **Indeterminacy**: Multiple translation manuals can be behaviorally equivalent (i.e., they predict all observable linguistic behavior correctly) yet assign *incompatible meanings* to words.
     - **Example**: The famous "gavagai" scenario. A native speaker points to a rabbit and says "gavagai." You could translate it as:
       * "Rabbit"
       * "Undetached rabbit part"
       * "A temporal slice of rabbithood"
       All are consistent with the same behavioral evidence (pointing, assent/dissent).

  ### 2. **Why Translation Still Works**
     - **Behavioral Constraints**: While meanings are indeterminate *in principle*, translation is constrained by **empirical evidence** (speakers' responses to stimuli). Successful translation manuals must fit this evidence.
     - **Pragmatic Success**: Translators use:
       * **Context** (cultural practices, gestures, situational cues)
       * **Holism** (how words interlock in a web of beliefs)
       * **Charity** (assuming speakers have largely true/coherent beliefs)
       These tools create manuals that *work* for practical purposes, even if alternatives exist.
     - **Evolutionary/Cultural Convergence**: Languages evolve to solve similar problems in similar environments. Shared human experience (e.g., spatial relations, basic needs) creates cross-linguistic patterns.

  ### 3. **What Quine *Isn't* Saying**
     - **He’s not claiming translation is arbitrary**: Not all manuals are equally good! Most fail behavioral tests. Only manuals that fit *all* evidence are candidates.
     - **He’s not denying communication**: We communicate because we share **behavioral dispositions**, not because we share "meanings" as abstract objects.
     - **He’s not attacking practical linguistics**: Field linguists build manuals that work. Quine just says multiple manuals *could* work, with no "fact of the matter" choosing one.

  ### 4. **Resolving Your Paradox**
     - **Translation manuals are tools, not mirrors**: A manual is a pragmatic map for navigating a language. Like different maps (e.g., topographic vs. political), incompatible manuals can be equally useful without one being "truer."
     - **Communication ≠ shared meanings**: Understanding occurs when behavior is coordinated (e.g., pointing at a rabbit when you say "gavagai"). You don't need identical mental concepts.
     - **Indeterminacy is subtle**: It surfaces in edge cases (e.g., translating "gavagai" without extra context), not in "table" → "mesa." Most language use is overdetermined by evidence.

  ### 5. **Real-World Analogy: Scientific Models**
     Consider different models in physics (e.g., light as particle vs. wave). Both predict observable phenomena but posit incompatible ontologies. Neither is "more true" at the foundational level—both are empirically adequate. Translation manuals are similar: they’re empirically adequate models of linguistic behavior.

  ### Conclusion
  Quine isn’t empirically wrong—he’s making a **philosophical point about meaning and ontology**. Translation succeeds because we don’t need determinate meanings; we need **systematic correlations between behaviors**. Linguists create manuals that capture these correlations pragmatically, even if other manuals *could* exist. The "impossibility" you intuit stems from assuming meaning must be determinate—a premise Quine rejects.

  **In short**: Communication works *despite* indeterminacy because it relies on behavioral coordination, not on matching private meanings. Translators succeed by building functional maps, not by discovering "real" meanings.
