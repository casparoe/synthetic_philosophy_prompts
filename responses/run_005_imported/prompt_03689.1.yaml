prompt: |-
  So my friend Dana and I got into this whole argument last night and I still can't tell who's right. Our friend Mia's boyfriend is planning to propose next weekend, she has no clue it's coming. I said something like "well, either she's gonna say yes or she's gonna say no, so one of those is already true right now, we just don't know which yet." Dana got kind of heated and said that's wrong, it's not true OR false yet, because she hasnt decided anything, theres nothing there yet to even be true. We went back and forth for like an hour and neither of us could really explain why we believed what we believed, we just both felt very sure. Who's actually right here? Also there's a part of this that kind of freaks me out too - if "she'll say yes" really is already either true or false before she's made up her mind, doesn't that mean her answer is sort of already locked in and she's not really choosing anything?
