prompt: |-
  I've been preparing a seminar on formal decision theory, and one worry about updateless decision theory (UDT) keeps nagging at me, though I suspect I may be misconstruing the proposal. As I understand it, following Wei Dai's original suggestion, an updateless agent fixes its policy once and for all "before" it has any information, precisely so as to avoid the kind of updating that gets ordinary Bayesian agents into trouble in cases like Newcomb's problem or counterfactual mugging. But this seems to imply that such an agent should perform systematically worse than an ordinary Bayesian reasoner in perfectly mundane sequential problems, since it can never let subsequent evidence change what it does. Take the Monty Hall problem: wouldn't an updateless agent simply stick to whatever door-choosing policy it started with and refuse to switch after the host reveals a goat, on the grounds that switching would require updating on new information? If that's right, I'm struggling to see why decision theorists treat UDT as a genuine advance over causal or evidential decision theory, rather than as a proposal that cures one disease by inducing a much more obviously fatal one. I'd be grateful for help seeing where this line of reasoning goes wrong, since I assume it must, given how seriously UDT is taken in the literature.
reasoning: |-
  Okay, the user is preparing a seminar on formal decision theory and has a specific concern about Updateless Decision Theory (UDT). They're worried that UDT might perform poorly in sequential decision problems like the Monty Hall scenario because it doesn't update based on new evidence. They feel this could make UDT worse than standard Bayesian approaches, which seems contradictory given UDT's reputation in decision theory circles.

  Hmm, I need to unpack this carefully. The user's core confusion seems to stem from interpreting "updateless" too literally. They're imagining an agent that rigidly sticks to a precommitted policy without any responsiveness to new information. But that's not quite right - UDT does use evidence, just not in the way causal or evidential decision theorists do.

  Let me recall how UDT actually works. The key is that it selects a policy (a mapping from information states to actions) that maximizes expected utility from the perspective of having no information. But crucially, that policy itself can and should include conditional responses to future information. So in Monty Hall, the optimal policy would absolutely include switching doors after seeing a goat revealed - because that policy yields higher expected utility when evaluated before knowing which door you initially picked or what Monty reveals.

  The user might be conflating the policy-selection moment with the execution moment. UDT fixes the policy upfront, but that policy is designed to react intelligently to evidence as it comes in. It's not that the agent ignores new information; rather, it chooses how to respond to all possible information in advance.

  I should emphasize the difference between "updating beliefs" and "conditional actions." Standard decision theories update probability distributions over world states, while UDT skips that and directly picks conditionally optimal actions. In Monty Hall, both approaches end up switching doors, but for different underlying reasons.

  The user's deeper concern seems to be about UDT's practical viability. They're presenting Monty Hall as a test case where failure would be catastrophic. I need to show that UDT passes this test with flying colors. Maybe I should walk through the Monty Hall example step by step to demonstrate.

  Also worth noting: the user mentions Wei Dai's original formulation but might not have seen more recent refinements. UDT has evolved, and the literature addresses many such concerns. I should reassure them that sequential decisions are handled well while acknowledging why the confusion arises - the "updateless" label is somewhat misleading without proper context.

  Their anxiety about presenting this correctly in a seminar suggests they want to avoid misrepresenting UDT. I should make clear where the theory stands - that it solves Newcomb-like problems without sacrificing performance on standard puzzles. Maybe contrast with why CDT and EDT fail where UDT succeeds, to highlight its advantages.

  Ultimately, the response needs to validate their concern as reasonable while clearly demonstrating the flaw in their interpretation. The Monty Hall walkthrough will be essential for concrete understanding. I'll need to show the expected utility calculation from the pre-info perspective that makes switching part of the optimal policy.
answer: |-
  You've hit on a perfectly understandable concern, and it stems from a subtle but crucial misinterpretation of what "updateless" actually means in UDT. **The key insight is that UDT does *not* mean ignoring evidence or refusing to condition actions on information. Instead, it means choosing a *policy* (a mapping from all possible information states to actions) *once, before having any specific information*, in a way that maximizes expected utility from that pre-information perspective.** Let's break this down using your Monty Hall example:

  1.  **The Literal Misinterpretation (Which is Incorrect):**
      *   Agent fixes a "policy" like "Always choose door 1 initially. Never switch, no matter what Monty does."
      *   This agent *does* ignore the evidence (Monty revealing a goat behind door 3). It performs terribly, winning only 1/3 of the time.

  2.  **What UDT Actually Does (The Correct Interpretation):**
      *   Before the game starts, the agent considers *all possible policies* it could follow. A policy specifies:
          *   Which door to choose *initially* (1, 2, or 3).
          *   What to do *in response* to Monty opening a specific door revealing a goat.
      *   Crucially, the policy **explicitly includes conditional responses**. For example:
          *   Policy A: Choose Door 1. If Monty opens Door 2, switch to Door 3. If Monty opens Door 3, switch to Door 2.
          *   Policy B: Choose Door 1. Never switch.
          *   Policy C: Choose Door 2. If Monty opens Door 1, switch to Door 3. If Monty opens Door 3, switch to Door 1.
          *   ... (and so on for all initial choices and switching rules)
      *   The agent calculates the **expected utility of each *entire policy*** from the perspective of having *no information* about where the car is or what Monty will do. This calculation requires averaging over all possible worlds:
          *   Car behind Door 1 (Prob=1/3)
          *   Car behind Door 2 (Prob=1/3)
          *   Car behind Door 3 (Prob=1/3)
          *   And for each car location, what Monty *can* do (open one of the other two goat doors, assumed equally likely if he has a choice).

  3.  **UDT Solves Monty Hall Correctly:**
      *   Let's evaluate the expected utility (EU) of Policy A (initial choice 1, always switch):
          *   Car behind Door 1 (Prob 1/3): Monty opens Door 2 or 3 (say 2). You switch to Door 3. **Lose**.
          *   Car behind Door 2 (Prob 1/3): Monty *must* open Door 3. You switch to Door 2. **Win**.
          *   Car behind Door 3 (Prob 1/3): Monty *must* open Door 2. You switch to Door 3. **Win**.
          *   **EU(Policy A) = (1/3 * 0) + (1/3 * 1) + (1/3 * 1) = 2/3**
      *   Evaluate Policy B (initial choice 1, never switch):
          *   Car behind Door 1: Win (1)
          *   Car behind Door 2: Lose (0)
          *   Car behind Door 3: Lose (0)
          *   **EU(Policy B) = (1/3 * 1) + (1/3 * 0) + (1/3 * 0) = 1/3**
      *   Evaluate a "Switch only if Monty opens Door 3" policy (initial choice 1):
          *   Car behind Door 1: Monty opens Door 2 (you stay, Win) or Door 3 (you switch to Door 2, Lose). Avg Win = 0.5
          *   Car behind Door 2: Monty *must* open Door 3. You switch to Door 2. Win (1)
          *   Car behind Door 3: Monty *must* open Door 2. You *don't* switch (he didn't open 3). Lose (0)
          *   **EU = (1/3 * 0.5) + (1/3 * 1) + (1/3 * 0) = 0.5**
      *   **Conclusion:** Policy A (Always Switch) has the highest EU (2/3) among policies starting with Door 1. Similar calculations show that the optimal policy for *any* initial choice is "Always switch after Monty reveals a goat". UDT will select a policy that implements this conditional strategy.

  4.  **Why "Updateless" Doesn't Mean "Ignores Evidence":**
      *   **Conditioning is Built into the Policy:** The policy selected by UDT *explicitly tells the agent what to do when it receives specific information*. When Monty opens Door 3, the agent following the optimal policy *looks up* its pre-committed rule: "If I chose Door 1 and Monty opened Door 3, switch to Door 2." It *uses* the evidence to select the correct action dictated by its optimal policy.
      *   **No Belief Updating Over World States:** The key difference from standard Bayesian (evidential) agents is *not* that UDT ignores information, but that it *doesn't update its probability distribution over the location of the car* based on Monty's action *within the context of evaluating the action*. Standard EDT would calculate P(Car behind Door 1 | I chose Door 1, Monty opened Door 3). UDT skips this step. It doesn't care about the updated belief *state*; it only cares that its *pre-selected policy* tells it to switch in this situation, and that this policy was optimal from the pre-game perspective. The "updateless" aspect refers to avoiding *this specific type of belief updating during the decision*.
      *   **Pre-Commitment to Rational Conditioning:** UDT pre-commits to behaving *as if* it had updated, *if* that behavior leads to the best overall consequences when evaluated before knowing anything. In Monty Hall, switching *is* behaving as if you updated your belief (you lower P(Car behind initial door) and raise P(Car behind other unopened door)). UDT commits to doing this because it's the winning strategy globally.

  **Why UDT is an Advance (Addressing the Core Worry):**

  1.  **Solves the Target Problems:** UDT correctly handles Newcomb's Problem (one-boxes) and Counterfactual Mugging (pays in the "tails" world) *without* needing the dubious causal independence assumptions of CDT or the spooky acausal correlations of EDT. It does this precisely by optimizing the policy from the pre-information perspective.
  2.  **Doesn't Fail Miserably in Sequential Problems:** As shown with Monty Hall, UDT performs optimally in standard sequential problems *because* its policy includes conditional responses to evidence. It doesn't stubbornly stick to an initial action; it follows a plan that dictates different actions for different information states.
  3.  **Clarity on Identity and Indexicals:** UDT forces explicit consideration of the agent's perspective ("what am I?"). In problems involving copies, simulations, or anthropic reasoning (e.g., the Absent-Minded Driver, Parfit's Hitchhiker, or even thought experiments like Roko's Basilisk), this explicit focus on policy selection from a pre-indexical perspective often provides a clearer framework than trying to shoehorn updating into strange scenarios. It handles "timeless" or "acausal" aspects more naturally.
  4.  **Formal Foundation for Cooperation:** UDT provides a formal basis for cooperative behavior between agents who reason about each other's reasoning, especially in scenarios without direct causal interaction (e.g., Prisoner's Dilemma played by superintelligences who can perfectly predict each other). The optimal policy for one agent can depend on the expected policy of the other, leading to mutual cooperation as the stable outcome.

  **Where Your Reasoning Went Slightly Astray (and it's a common pitfall):**

  You conflated "fixing a policy before having information" with "picking a *single action* to perform regardless of future information". UDT fixes a *function* (the policy) that maps *all possible future information states* to actions. The policy *embodies* how the agent will respond to evidence. The agent isn't refusing to update; it's following its pre-committed *plan* for how to update its *behavior* based on evidence.

  **In summary:** UDT agents absolutely *do* change their behavior based on new information. They just commit to *how* they will change their behavior *before* they know what that information will be, by selecting the policy that yields the best expected results overall when evaluated from the initial state of ignorance. It cures the diseases of CDT and EDT in Newcomb-like problems *without* inducing the fatal disease of ignoring evidence in sequential problems. Your Monty Hall worry is resolved because the optimal UDT policy explicitly includes the "switch" action conditional on Monty revealing a goat. UDT is taken seriously precisely because it aims to be a *unified* framework that handles both the exotic problems and the mundane ones correctly.
