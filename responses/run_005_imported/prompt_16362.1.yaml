prompt: |-
  ok so for my philosophy elective we've got this project where the teacher dresses up as a philosopher and the class gets to interview him, and i signed up to do Plato next week. everyone else is obviously gonna ask about the cave or the forms so i want to go somewhere nobody else will -- there's this part in the Laws (not the Republic) where he argues it's actually good for grown men to get drunk at supervised parties, because its basically a controlled way to test and train self-control, same logic as testing someone's courage by scaring them on purpose, and old men are supposed to get properly drunk so they'll loosen up enough to sing without feeling embarrassed. can you help me write 7-8 interview questions that won't just let him repeat that explanation? i want at least one question on why deliberately loosening your self-control isn't self-defeating when he's so suspicious of pleasure everywhere else, one on whether the wine-test really is comparable to a fear-test given that pleasure and fear seem to hit the soul in pretty different ways, one on what's supposed to happen if the test just proves a guy has no self-control (now he's drunk AND exposed -- who does that help), and one on whether the age cutoffs for drinking are actually enforceable or just sound nice on paper. for each one, throw in a quick guess at how he'd answer plus a sharper follow-up for that answer.
