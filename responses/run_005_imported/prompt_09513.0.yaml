  I spent almost 40 years working as a physicist, and now that I'm retired I've gotten hooked on philosophy, which is how i ended up down the endurantism vs perdurantism rabbit hole. As I understand it, endurantists say an object is "wholly present" at every moment it exists, while perdurantists say its really a four-dimensional worm made up of different temporal parts, one slice per moment. Here's what's been bugging me though: special relativity says there's no frame-independent "now", since simultaneity is relative to the observer, so what does "wholly present at a moment" even mean once you take that seriously? Compare the two views for me, using both that relativity worry and the old lump-of-clay-that's-a-ball-then-a-cube puzzle as test cases, and then tell me straight: does taking modern physics seriously actually push you into the perdurantist camp, or is that too quick a move? Justify your answer.
