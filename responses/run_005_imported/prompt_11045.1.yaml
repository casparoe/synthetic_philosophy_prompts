  Had a whole argument with a friend last night about whether it even makes sense to say a false theory can be "closer to the truth" than another false theory - like, is Newtonian mechanics more truthlike than the old four-elements theory, even though both are technically wrong. She mentioned that Popper actually tried to formalize this "verisimilitude" idea using the true vs false logical consequences of a theory, and that it famously blows up the moment you try to compare two theories that are both false - like his definition just structurally can't do it, its not some minor bug you can patch. I dont really get why the breakdown is so total though. Can you explain, intuitively and without heavy notation, why Popper's formal definition of verisimilitude collapses specifically for false-vs-false comparisons, and why nobody's since landed on a clean fix?
