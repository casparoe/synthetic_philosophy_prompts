answer: |-
  ## Toast for a Lewisian Legacy

  (Sound of spoon gently tapping glass)

  Friends, family, colleagues, esteemed guests… and especially, to our guest of honor, Professor [Advisor's Name]. Thirty years. Thirty years of passionate scholarship, of guiding minds (some of them, admittedly, quite stubborn!), and of unwavering defense. Specifically, the defense of a deceptively simple, yet profoundly powerful idea: that so much of what holds our social world together isn't built on grand contracts or iron-clad rules, but on… well, shared expectations and a kind of mutual, unspoken agreement to keep doing things a certain way, simply *because* that’s the way they’re done.

  David Lewis called it convention. A regularity in behavior, arbitrary in its origins – why *this* side of the road? Why *this* word for *that* thing? – but persisting because we all know it exists, we all expect others to follow it, and we all know they expect it of us. No signatures required. No enforcement squad needed. Just… common knowledge and a gentle nudge of predictability.

  Now, her esteemed critics – we know who they are, and some might even be here! – folks like Margaret Gilbert, they’d say, "Hold on! That’s not *enough*! Where’s the *ought*? Where’s the real *obligation*? If it’s just expectation, breaking a convention should just be… surprising. Like seeing someone wear socks with sandals." *(Light chuckle)* "But it *feels* like more! It feels like a *wrong*!"

  Professor [Advisor's Name] has spent three decades masterfully parrying those thrusts, showing how powerful, how *binding* that web of mutual expectation truly is. And tonight… tonight, we find ourselves immersed in the purest, most Lewisian demonstration of her life’s work imaginable.

  **(Pause, look around the room, gesture subtly at the setting)**

  *This*. This very dinner. This gathering. What we’re doing *right now*.

  Think about it. Why are we all sitting at tables, roughly facing this way? Arbitrary. Why did we wait for someone to tap a glass to quiet down? Arbitrary. Why are we drinking *this* particular liquid from *these* particular vessels when someone speaks? Deeply arbitrary! Why am I standing *here*, talking *now*, instead of, say, Uncle Bob doing a tap dance over by the dessert table? *(Gesture vaguely towards dessert/Uncle Bob, get a laugh)* Completely, utterly arbitrary!

  We didn’t sign a contract stipulating the order of speakers. There’s no legal penalty if Aunt Mildred decides to loudly critique the soup during the main course. There’s no convention enforcement officer hiding behind the potted palm ready to tackle anyone who doesn’t raise their glass on cue.

  **(Lean in slightly, voice becoming more intimate and conspiratorial)**

  And yet… imagine it. Just for a second. Imagine if, after all the lovely tributes, I simply said, "Welp, that's it! No toast from me! Pass the rolls!" *(Make a quick, dismissive hand wave)*

  **(Pause for effect)**

  The philosophers and game theorists in the room… your minds just went *click*. Coordination equilibrium shattered! A deviation from the expected pattern! Lewisian alarm bells ringing! "Payoff reduction! Potential unraveling!" You’d feel it in your bones – a violation of the *rules of the game*, even though the only rule was… our shared expectation that there *would* be a toast.

  But here’s the beautiful part, Professor. Look around at *everyone* else. Family, friends… you might not know a Schelling point from a hole in the ground… *(Get a knowing chuckle from the specialists)* … but if I skipped that toast? You’d feel it too, wouldn’t you? A little jolt. A flicker of… disappointment? Confusion? Maybe even… *(dramatic whisper)* … a faint sense of betrayal? "That’s… not how this is *supposed* to go. Something’s… *missing*."

  *That* feeling? That subtle, social pang? That’s not Gilbert’s robust, deontic "ought." That’s pure, uncut Lewis. That’s the quiet, powerful force of convention Professor [Advisor's Name] has spent her career illuminating. It’s the social glue she’s shown us holds fast without bolts or blueprints, just mutual awareness and the simple, profound expectation that we’ll keep playing our part in the pattern.

  **(Raise glass)**

  So, Professor [Advisor's Name], tonight, we enact this lovely, arbitrary convention – the clinking glasses, the shared words, the slightly-too-long speech – *for you*. We do it because we all know we expect it, and we know you expect it. But far more importantly, we do it out of immense gratitude, deep respect, and profound affection.

  Thank you for teaching us how the world truly works, one mutual expectation at a time. Thank you for being our guide, our champion, and our inspiration. For thirty years of brilliant defense, and for showing us that the most powerful obligations often arise not from force, but simply from us, looking at each other, and knowing… *this* is how it’s done.

  To Professor [Advisor's Name]! May your retirement be as rich, as surprising (in the *good* Lewisian way!), and as deeply satisfying as the conventions you’ve so masterfully explained.

  **(Everyone raises glasses and drinks. Specialist Nod: The "faint sense of betrayal" line is the key wink, perfectly capturing the Lewis/Gilbert tension in human, relatable terms without jargon. The structure of the joke – building the arbitrary elements of the dinner, then the hypothetical deviation – makes the point vividly for everyone.)**
