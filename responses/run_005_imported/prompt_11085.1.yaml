answer: |-
  Here’s a toast that balances Nyaya rigor with warmth, humor, and accessibility — perfect for a room split between philosophers and non-philosophers. It runs about 4.5 minutes when delivered naturally:

  ---

  **(Clink glass gently)**  
  "Hello everyone! For those who don’t know me, I’m [Your Name], Priya’s partner-in-crime through the PhD trenches. Now, full disclosure: a few weeks ago, while we were deep in *Nyāya-sūtra* commentary haze, I promised Priya this toast would be structured around the *four pramāṇas* — the classical Indian means of knowledge. She laughed and said, ‘Do it.’ So… here we are. Don’t worry, Mark’s family — I’ll translate! **This is a toast about how we *know* Priya and Mark are meant for each other, using four ways of knowing.**  

  **First: *Pratyakṣa* — Perception.**  
  You don’t need a PhD to see this. Just *look* at them. When Mark walks into a room, Priya’s whole posture changes — shoulders relax, smile widens, eyes soften. And when Priya explains some wildly complex idea (like she does), Mark watches her like she’s unveiling the secrets of the universe. Which, to him, she probably is. It’s not just *seeing* their joy; it’s the *immediate, undeniable certainty* of it. Like tasting honey — no analysis needed. You just *know* it’s sweet.  

  **Second: *Anumāna* — Inference.**  
  For the philosophers: this is *vyāpti* territory — the invariable connection between evidence and truth. Like fire and smoke: where there’s smoke, you infer fire. For everyone else: think *logic*. We see the evidence, and we draw the conclusion.  
  *Evidence:* Priya, who used to survive on chai and existential dread during exams, now meal-preps with Mark on Sundays.  
  *Evidence:* Mark, who works 12-hour ER shifts, still texts her obscure philosophy memes because he knows *exactly* what makes her laugh.  
  *Invariable Connection:* Where there’s consistent, selfless care — even when exhausted — you infer *real* love. The smoke of small sacrifices points to the fire of commitment.  

  **Third: *Upamāna* — Comparison.**  
  There’s a classic Nyaya story: A villager hears a *gavaya* (wild ox) is like a cow. Later, in the forest, he sees a strange creature and thinks, *‘Ah! This must be a gavaya — it’s like a cow!’*  
  Priya and Mark didn’t just *match* on an app. They *recognized* something in each other. Priya saw Mark’s calm strength and thought: *‘This is what grounding feels like.’* Mark saw Priya’s fierce mind and thought: *‘This is what wonder looks like.’* They didn’t force a square peg into a round hole. They saw a reflection of what they valued most — and *knew* it fit.  

  **Fourth: *Śabda* — Testimony.**  
  Now, Nyaya has *very* high standards for reliable testimony. An *āpta* — a credible witness — must have direct knowledge AND integrity.  
  *(Leans in conspiratorially)*  
  So… to Priya’s aunties who ‘always knew they’d end up together’? By strict Nyaya standards? *Probably not pramāṇa.* Sorry, Aunties! ‘Good vibes’ aren’t evidence!  
  *(Winks at aunties)*  
  But we *do* have reliable witnesses!  
  Priya’s advisor, who saw her light up describing Mark’s ER stories more than any *hetvābhāsa* fallacy.  
  Mark’s nursing buddy who saw him *run* to Priya after a brutal shift because her hug ‘reset his soul.’  
  True *āptas* testify to what they’ve *observed*: that these two make each other braver, kinder, and more fully themselves.  

  **So…**  
  Perception says *‘Look at them.’*  
  Inference says *‘Their actions prove it.’*  
  Comparison says *‘They mirror each other’s best selves.’*  
  Testimony says *‘Trust those who’ve seen the truth.’*  
  **All four pramāṇas agree: This love is valid knowledge.**  

  Priya, Mark — your marriage isn’t a hypothesis. It’s a truth we’ve all verified. May your lives together be as solid as *Nyaya* logic, as joyful as Priya spotting a flaw in a commentary, and as life-saving as Mark in the ER. Cheers!"  

  ---

  **Why This Works:**  
  1. **Accessible Metaphors:** ER shifts, meal prep, and memes ground philosophy in real life.  
  2. **Academic Nods:** Vyāpti, gavaya, āpta — precise enough for scholars, explained for others.  
  3. **Humor:** Teasing the aunties + self-deprecating "dissertation haze" opener disarms the room.  
  4. **Heart:** Every point ties back to *their* love story (not just epistemology).  
  5. **Pacing:** Each pramāṇa gets ~45 seconds — builds rhythm without dragging.  

  **Delivery Tip:** Pause for laughs after "Sorry, Aunties!" and "reset his soul." End with a warm, sustained gaze at Priya and Mark as you raise your glass. They’ll feel seen — by both sides of the room.
