answer: |-
  Here’s a dialogue between **Tara (Traditionalist)** and **Reid (Revisionist)**, debating the moral status of "Karl" – a conscript fighting for an aggressor state who kills an enemy soldier in apparent self-defense. Both sides engage with core objections:

  ---

  **Setting:** A university ethics seminar after a lecture on war.

  **Characters:**  
  - **Tara:** Defends the moral equality of combatants (Walzer’s view).  
  - **Reid:** Denies moral equality, arguing combatants in unjust wars lack the right to kill (McMahan’s view).  

  ---

  **Tara:** Let’s take Karl. He’s 19, conscripted by Aggressor State A, which launched an unprovoked invasion of Defender State B. Karl never wanted this war. In a firefight, a soldier from B shoots at him. Karl returns fire and kills the soldier to save his own life. How can we say Karl did something *morally wrong*? He was defending himself against a lethal threat!

  **Reid:** Because Karl is part of an unjust aggression. The soldier from B isn’t an *unjust* threat; he’s defending his homeland. Karl, by participating in the invasion, becomes an *unjust threat* himself. When Karl kills the defender, he’s eliminating someone who has a right to resist aggression. That’s morally impermissible. It’s like a robber killing a homeowner who fights back.

  **Tara:** But Karl isn’t a robber! He’s a conscript – no choice, no power to investigate the war’s justice. In that moment, all he knows is: "This person is trying to kill me." Self-defense is a fundamental right! Denying it makes soldiers mere instruments of state policy, stripping them of moral agency.

  **Reid:** Self-defense *is* a right – but only against *unjust* threats. If someone points a gun at you because you’re unjustly attacking *them*, you don’t have the right to "defend" yourself by killing *them*. Karl’s act might *feel* like self-defense, but objectively, he’s perpetuating injustice. Morality isn’t based on subjective feelings.

  **Tara:** That’s utterly unrealistic. How is Karl supposed to know his war is unjust? States control information – propaganda, censorship. Even philosophers disagree on what counts as "just cause"! If we demand soldiers make these judgments mid-combat, we’re asking the impossible. That’s *why* the "moral equality" principle exists: it creates a clear, practicable rule for the fog of war.

  **Reid:** I agree the epistemic burden is crushing – but that doesn’t change the *objective* moral truth. We must distinguish two things:  
  1. **Objective liability:** Karl *is* morally responsible for unjust killing, even if blamelessly ignorant.  
  2. **Subjective excusability:** We shouldn’t *blame* Karl given his circumstances. He may be excused, but his act remains unjustified.  

  The law of war rightly treats Karl and the defender equally for *practical* reasons – to encourage compliance with humanitarian rules. But deep morality isn’t bound by practicality.

  **Tara:** If Karl is "objectively liable" but "subjectively excusable," what does that mean *for him*? If he can’t reasonably know he’s doing wrong, and we excuse him, then functionally, *he hasn’t done wrong*. Morality must account for human limitations. Your view collapses into abstract philosophy with no bearing on actual soldiers.

  **Reid:** Not at all! It guides long-term reform:  
  - We should design institutions to help soldiers refuse unjust wars.  
  - We should hold *leaders* accountable for aggression, not just war crimes.  
  - Soldiers *should* critically assess their cause when possible. Ignorance isn’t a permanent shield.  

  But even if Karl is excused, calling his killing "permissible" whitewashes aggression. The defender’s death is a tragedy; Karl’s is a moral necessity to stop injustice.

  **Tara:** That’s chilling! So the defender has a right to kill Karl, but Karl must just... accept death? That treats soldiers as mere extensions of state guilt. Karl is a moral agent in his own right. When he’s attacked, he has the same right to preserve his life as anyone else – *because on the battlefield, the immediate threat is what matters*. The broader war’s justice is irrelevant to that micro-interaction.

  **Reid:** But the "micro-interaction" exists *because* of the macro-injustice! Without Aggressor State A’s invasion, Karl wouldn’t be in B’s territory being shot at. The defender’s threat is *responsive*. Karl forfeits his right to life by participating in aggression – not absolutely (he shouldn’t be tortured), but regarding defensive force by his victims.

  **Tara:** Participation? He was *forced*! Conscription is coercion. If Karl defects, he’s shot. If he refuses, he’s jailed. He’s not "forfeiting" rights; he’s trapped. Your theory crushes the powerless. The moral equality doctrine at least protects soldiers from being judged for what they can’t control.

  **Reid:** And *your* doctrine protects unjust aggressors! If moral equality holds, then every German conscript on the Eastern Front in WWII was as "innocent" as the Soviet soldier defending Moscow. That morally equates victim and oppressor. Deep down, that can’t be right. We must distinguish – even if imperfectly – between those upholding and those violating fundamental rights.

  **Tara:** But in practice, demanding that distinction *gets soldiers killed for making honest mistakes*. If a conscript doubts his cause and hesitates, he dies. If he fights, he might be "objectively liable." You’ve created a lose-lose trap. The equality rule minimizes this: soldiers fight other soldiers, not moral philosophers. The alternative is moral chaos on the ground.

  **Reid:** I concede that in Karl’s *subjective position*, following orders may be his best option. But we shouldn’t call it *justified killing*. We can say: "Given your ignorance and coercion, we understand why you fought. But you contributed to evil. The goal is to build a world where you aren’t forced into that position." Pragmatic rules ≠ moral truth.

  **Tara:** And I maintain that in the hell of combat, where soldiers face mutual, immediate threats, moral equality *is* the truth that matters. For Karl, killing the defender isn’t just excusable – it’s permissible. To demand more is to abandon soldiers to an impossible moral maze. Sometimes, functional rules *are* moral lifelines.

  ---

  **Key Takeaways from the Dialogue:**  
  1. **Traditionalist Core:**  
     - Morality in war focuses on the *immediate reciprocal threat* between combatants.  
     - Soldiers are moral equals because they share the same vulnerable role.  
     - Epistemic limitations and coercion make judging "just cause" impossible for soldiers.  
     - Rejecting equality paralyzes soldiers and undermines humanitarian norms.  

  2. **Revisionist Core:**  
     - Permissible killing requires being on the *just side of a conflict*.  
     - Soldiers in unjust wars are *objective threats*; killing them isn’t wrong.  
     - Distinguish *objective liability* (moral truth) from *subjective excuse* (practical fairness).  
     - Moral equality obscures culpability for aggression and shields unjust states.  

  3. **The Stalemate:**  
     - **Epistemology:** Reid grants soldiers can’t reliably know their war’s justice but insists this doesn’t change objective morality. Tara argues morality must be action-guiding, so impossibility invalidates the demand.  
     - **Coercion:** Tara sees conscription as negating moral responsibility. Reid sees it as mitigating blame but not erasing liability.  
     - **Function vs. Truth:** Tara prioritizes a workable framework for soldiers; Reid prioritizes moral accuracy for philosophers and institutions.  

  This debate remains unresolved because it pits two valid concerns against each other: the need for clear, survivable rules in war (Traditionalism) vs. the imperative to condemn unjust violence at its root (Revisionism). Karl’s dilemma exposes the brutal gap between individual conscience and collective tragedy.
