prompt: |-
  Okay this has been bugging me for weeks. I keep running into 'radical probabilism' on rationalist blogs, and it always traces back to Jeffrey conditionalization -- the generalization of Bayes' rule for when you don't become fully certain of your evidence but just shift your credence in it (Jeffrey's own example was judging a piece of cloth's color by candlelight). What I cant wrap my head around is that Jeffrey updating apparently isn't commutative in general: update on E1 then E2 and you can land somewhere different than E2 then E1, which seems like a bad property for a rule that's supposed to model rational belief revision. Could you compare it with Judea Pearl's 'virtual evidence' method from the Bayes nets literature, which folds uncertain evidence in as a likelihood ratio instead of a straight posterior -- does that approach actually fix the order-dependence problem or just relocate it, and what's the deeper reason the two come apart? Please get into the actual math a bit rather than just saying 'they're both ways of handling soft evidence.'
