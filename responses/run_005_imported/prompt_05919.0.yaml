answer: |-
  ## The Lingering Shadow of Creeping Minimalism (A Metaethics Dialogue)

  **Setting:** A slightly stuffy seminar room after a talk by Dr. Elena Vance (Expressivist) defending a sophisticated Gibbard-inspired norm-expressivist solution to the Frege-Geach problem. Dr. Robert Hayes (Cognitivist) is the first questioner.

  **(Applause dies down. Hayes stands.)**

  **Hayes:** Elena, thanks for a characteristically clear presentation. I want to press on the sameness of meaning point, specifically how it avoids collapsing into what Dreier called ‘creeping minimalism’. You’ve constructed an elegant formal model using sets of world-plan pairs. When I say "Tormenting the cat is wrong," I express my plan-laden state of being for blaming for cat-tormenting. When I say *"If* tormenting the cat is wrong, then getting your brother to do it is wrong," the antecedent doesn’t express *my* plan, but it’s handled by the model: the conditional rules out world-plan pairs where cat-tormenting is planned-against but brother-procured tormenting isn’t. Validity is secured via consistency across these sets. So far, so Gibbard.

  **Vance:** (Nods) That’s the core of it, Robert. The meaning of "wrong" is tied to its role in planning – expressing a state of being for blaming. The formal apparatus tracks the *logical consequences* of holding certain planning states, ensuring validity like modus ponens works. Crucially, the *same* planning-state type – being for blaming for X – is what "wrong" contributes to the semantic value, whether asserted or embedded. Sameness of meaning *is* secured, just functionally, in terms of its contribution to planning discourse.

  **Hayes:** But that’s precisely where I see the creep. Look at what these ‘world-plan pairs’ *do*. They are abstract objects standing in logical relations (inclusion, exclusion, consistency). When you say "wrong" means the same in (1) and (2), you mean it contributes the *same constraint* to the set of world-plan pairs deemed acceptable by the speaker or the discourse. The validity of modus ponens relies on the *objective* logical relations *between these sets*. Isn't this 'constraint on acceptable world-plan pairs' functioning *exactly* like a truth condition? And isn't the 'acceptability' of a world-plan pair under the speaker's planning state functionally identical to the *truth* of a proposition relative to a world and a... well, a planning state? You’ve built a model where normative claims *behave* like truth-apt representations of a special kind of fact – facts about what plans are consistent or inconsistent. The ‘planning’ bit feels like a label on a realist bottle.

  **Vance:** That’s a powerful metaphor, Robert, but I think it mislocates the substance. The key is *what the model is modeling*. It’s not modeling moral facts *out there*. It’s modeling the *internal logic of planning states themselves*. The ‘world’ part handles descriptive content, the ‘plan’ part handles our practical commitments. The ‘inconsistency’ flagged by the logic isn’t a failure to match reality; it’s a failure of *practical coherence*. Holding plan P while accepting a conditional that rules out P under descriptive circumstance D is practically incoherent. The sameness of meaning for "wrong" lies in its invariant *functional role* within this system of practical reasoning. It’s not representing a property; it’s contributing a specific *practical posture* (being for blaming) to the construction of a coherent plan.

  **Hayes:** But Elena, doesn’t this just push the question back? You need an *explanation* for *why* certain combinations of planning states are incoherent. Why is it incoherent to be for blaming cat-tormenting but not for blaming brother-procured cat-tormenting? Your answer, I suspect, will appeal to the *content* of the plans or the *consequences* of holding them – but then haven’t you smuggled in a *normative fact* about what plans entail what? The formal system needs grounding, and that grounding looks suspiciously like the normative relations you wanted to avoid. Further, if "wrong" contributes a *stable, type-identical constraint* (being for blaming) across contexts, and validity relies on *objective* relations between these constraints... how is this functionally different from "wrong" expressing a *belief* with the stable, type-identical content *that tormenting the cat has the property of wrongness*, where validity relies on the *objective* entailment relations *between those properties*? Your ‘practical posture’ is looking remarkably belief-like in its semantic behavior.

  **Vance:** The grounding *is* practical, Robert. It’s rooted in the nature of agency and what it means to plan. Planning *just is* the activity of ruling certain combinations of actions and reactions out as incoherent *for an agent*. The inconsistency arises from the *aim* of planning itself – to guide action coherently. You can’t coherently plan to avoid A yourself while being indifferent to facilitating A through another. That’s not a normative fact *out there*; it’s a constitutive requirement of the planning *stance*. As for the belief-like behavior: yes, the logic *tracks* consistency, just as belief logic does. But the *state* being tracked is fundamentally different! A belief aims to represent the world; a plan aims to *direct* action. The semantics reflect the *logic* of the state, not its *direction of fit*. The sameness of meaning reflects the *stability of the practical commitment type* expressed by "wrong", not the stability of a represented property.

  **Hayes:** But this ‘constitutive requirement of the planning stance’ – isn’t *that* a normative claim? And a highly substantive one! It sounds perilously close to saying there *are* objective truths about practical rationality that your logic captures. More importantly, even granting the difference in direction of fit, your sophisticated machinery *forces* the expressivist to treat the *content* of normative claims – the ‘what is planned against’ – as possessing a structure and logic that mirrors propositional content. The ‘being for blaming’ becomes a *relational property* (blaming being *for* X) that holds in some possible world-plan combinations and not others. The *minimalist* cognitivist can happily say: "Great! You've shown moral claims *are* truth-apt – their truth is just relative to a world *and a normative standard* (the plan)." They’ll argue your ‘plan-laden worlds’ *are* the truth-makers. What distinctively *expressivist* thesis survives? That the *utterance* non-descriptively expresses a state? But if the *content* is now structured like a truth condition, haven’t you conceded the cognitivist core – that we have truth-apt moral *beliefs* – while just adding a story about the psychology of utterance? That *is* creeping minimalism. Wouldn’t it be cleaner to just be a cognitivist who acknowledges the intimate link between moral belief and motivation?

  **Vance:** (Takes a breath) Cleaner, perhaps, Robert, but potentially misleading and metaphysically profligate. Let’s not forget why expressivism was attractive. If we grant truth-apt moral beliefs, we *must* then answer: *What makes them true?* Realist cognitivism saddles us with mysterious moral properties and potentially queasy epistemology. Your ‘minimalist’ cognitivism might deflate ‘truth’, but it still posits *beliefs* with *contents* that need *correctness conditions*. Even if minimal, correctness conditions require *something* – patterns of supervenience, response-dependence, or your ‘normative standards’ – that looks like a substantive normative reality to account for correctness. Expressivism avoids *all* of that. The ‘correctness’ of my plan isn’t about matching an external standard; it’s about internal coherence and effectiveness in guiding my actions in the actual world. The content *is* structured, yes, but its structure reflects the structure of our *practical deliberation*, not the structure of a moral reality. The distinct thesis is that moral vocabulary’s *fundamental job* isn’t to describe or represent *anything* – not even minimal truth-conditions – but to *express and coordinate planning states*. The formal model is a tool to understand the logic *of that expressive practice*, not a mirror of reality. Conceding that the *logic* requires a certain structure doesn’t concede that the structure represents reality.

  **Hayes:** And yet, Elena, the pressure is relentless. If the structure of the planning states, captured by your sets of world-plan pairs, *determines* the correctness of inferences and the consistency of commitments, and if this structure is objective (not up to the individual whim – you *can’t* coherently hold those combinations), then it *functions* as a standard against which individual plans are measured. Calling it ‘internal coherence’ doesn’t erase its normative authority over the agent. And if the meaning of "wrong" is its stable contribution to this objective logical structure governing practical discourse... then it’s hard to see how it differs *semantically* from a predicate contributing to a truth-conditional structure. The ‘direction of fit’ difference feels psychological, not semantic, at this level of abstraction. Your ‘fundamental job’ claim starts to look like a relic of a simpler expressivism that couldn’t handle embedding. The sophisticated machinery needed to solve Frege-Geach seems to have *transformed* the view into a species of cognitivism about practical rationality, albeit one with a nuanced psychology of utterance. The ‘creep’ seems complete. Honesty might demand embracing cognitivism and tackling its problems head-on – explaining motivation via the inherent practicality of moral *thought*, not just utterance, and wrestling with the metaphysics of value or embracing a naturalized or minimal conception – rather than maintaining an expressivist label propped up by increasingly cognitivist-looking scaffolding.

  **Vance:** (Leans forward) Robert, I hear the worry. But I think you’re conflating the *model* with the *reality*. The model uses sets and logic to *represent* the consistency constraints inherent in the *activity* of planning. The ‘objective’ logical relations in the model *represent* the *inescapable demands of practical coherence for any being who plans*. That’s not a normative reality *external* to planning agents; it’s constitutive *of* being a planning agent. The semantic value isn’t a truth condition; it’s a *blueprint for action and reaction*. When "wrong" embeds, it contributes its specific piece to that blueprint’s coherence conditions. The difference isn't *just* psychological; it’s about the fundamental *kind* of mental state involved and what its content *is for*. The expressivist core survives: moral claims express non-cognitive, action-guiding states. The sophisticated semantics shows *how* these states can have logical structure without becoming beliefs about reality. The ‘cost’ of cognitivism – needing *any* account of truth-makers or correctness conditions, however minimal, for moral *beliefs* – is precisely what we avoid. We only need an account of practical rationality for planning creatures.

  **Hayes:** (Sighs slightly, a small smile) And I think you’re underestimating how much your ‘blueprint’ and its ‘inescapable constitutive demands’ have absorbed the core features of a normative reality and truth-apt content. The ‘planning state’ has become so richly contentful and logically structured, governed by objective norms of coherence, that calling it ‘non-cognitive’ starts to strain credulity. Its ‘direction of fit’ is world-to-mind, sure, but its *semantic profile* in your model is indistinguishable from a cognitive state with world-to-mind direction of fit – a *desire-like belief* or a *cognitive state about plans*. The distinctiveness feels semantic, not merely psychological. Avoiding ‘truth-makers’ by calling them ‘constitutive demands of agency’ feels like a distinction without a difference. But... (he pauses) I concede the appeal of avoiding the metaphysical baggage. And I concede that my cognitivism has its own heavy lifting: explaining the intrinsic connection between *believing* something is wrong and being motivated, without reducing the belief to a desire, and without positing spooky properties. That’s hard work. Maybe we’ve reached the point where the labels matter less than the substantive commitments: we both posit objective normative constraints on thought and discourse (yours practical, mine perhaps more robustly metaphysical), we both need sophisticated semantics, and we both need to explain moral psychology. Perhaps the residual difference is just how ‘real’ we think the norms governing our plans are, or how tightly we tie meaning to descriptive representation versus practical function.

  **Vance:** (Returns the slight smile) Perhaps, Robert. Perhaps. But I’d argue that tying meaning fundamentally to practical function, and seeing the logic as emerging from the demands of that function, *is* the substantive difference. It keeps the focus where it belongs for ethics: on what to *do*, not just on what *is*. The formal machinery is a tool, not a concession. It shows expressivism *can* handle the logic, on its own terms, without becoming what it set out to reject. The ‘creep’ is contained by the unwavering focus on the practical stance. But yes, the weight of the apparatus is undeniable. The Frege-Geach problem forces sophistication upon us all. The question might ultimately be which set of burdens – mine of explaining planning logic without realism, or yours of explaining moral truth and belief without mystery – seems more bearable, or truer to the phenomena of moral life.

  **(They hold each other's gaze for a moment, a respectful stalemate hanging in the air, before Hayes nods and sits down. The chair moves to the next question.)**

  **End of Dialogue**
