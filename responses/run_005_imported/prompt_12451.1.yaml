answer: |-
  ## Dialogue: The Desk & The Frankenfowl

  **Setting:** A cluttered philosophy department lounge. Coffee mugs and papers everywhere. **Alex (Mereological Universalist)** and **Sam (Compositional Nihilist)** are debating fiercely.

  **Alex:** (Gesturing to a phone and water bottle sitting side-by-side on a desk) Look at that, Sam. Perfect example. My phone and my water bottle. They occupy adjacent space right now. They’re causally interacting – photons bouncing between them, gravity acting, the desk surface supporting both. *Something* is sitting there that isn’t just the phone and isn’t just the bottle. That unified ‘desk duo’ is a real object!

  **Sam:** Whoa, hold on. What “unified” thing, Alex? The phone is a manufactured artifact with a clear functional unity – circuits, screen, battery working together. The bottle is another distinct artifact designed to hold water. Calling them *one* object because they happen to be touching on *your* desk? That’s just a human projection of meaning onto spatial coincidence. There’s no *new* entity here. There’s phone-stuff and bottle-stuff in proximity. That’s all.

  **Alex:** But that proximity *creates* a new relational property! They form a spatially contiguous whole *right now*. Mereological Universalism isn't arbitrary – it says *any* collection of objects, no matter how disparate, composes a further object. The ‘desk duo’ satisfies that condition: it has parts (phone, bottle), it occupies a specific region of spacetime defined by their union. Denying it seems arbitrary. What’s the magic glue that *only* exists in things you deem ‘unified’ like the phone itself?

  **Sam:** The ‘glue’ isn’t magic, it’s *causal unity over time*. The phone’s parts are bonded, interdependent, and move/function *as one system* consistently. They share a common causal fate. Your ‘desk duo’? The phone could be in my bag tomorrow, the bottle recycled. Their ‘togetherness’ is fleeting and incidental. They don’t causally influence each other *as a system* in any significant way beyond basic physics that applies to *any* two proximate particles. Calling it an ‘object’ inflates ontology needlessly. Why multiply entities beyond necessity? There are fundamental particles arranged phone-wise and fundamental particles arranged bottle-wise. That exhausts reality.

  **Alex:** But your ‘causal unity’ criterion is vague and subjective, Sam! How tightly integrated must parts be? Is a loose federation of states not a single nation? Is a pile of sand not an object until the grains are glued? And what about the trout-turkey? Lewis’s example – imagine the front half is a trout, the back half a turkey, seamlessly grafted together biologically. It eats, moves, breathes *as a single organism*.

  **Sam:** (Sighs) That monstrosity. Fine, let's tackle the hypothetical. First, biological grafting at that scale is likely impossible due to incompatible physiologies, but let's assume magic or advanced tech makes it viable. Even then, *if* it functions as a single, coherent, self-sustaining biological system – if the trout half’s gills and the turkey half’s lungs somehow integrate to supply oxygenated blood to the *whole* creature, if its nervous system integrates signals from both halves, if it moves with coordinated purpose... *then* under my view, *perhaps* it composes a single object. But *only* because it achieves a novel, stable, high-level causal unity *as a system* that isn't reducible to just trout-parts and turkey-parts acting separately nearby.

  **Alex:** Ah, so you *do* admit composition happens sometimes! But now you’ve moved the goalposts. Is the unity of the trout-turkey *really* that different in kind from the ‘desk duo’? Both involve parts interacting causally within a contiguous region. The trout-turkey just has *more complex* interactions. Your criterion seems arbitrarily demanding. Why is ‘breathing as one system’ the threshold, but ‘sitting stably together on a desk’ isn’t? Both are just patterns of interaction between parts.

  **Sam:** It’s about *degree* and *novelty* of causal integration, Alex. The trout-turkey (if viable) exhibits *emergent* properties: coordinated movement, unified metabolism, a single locus of control (even if messy). It acts *as one agent* in its environment in a way your phone and bottle *never* do together. Their ‘interaction’ is trivial physics – vibration transfer, mutual gravity. There’s no *new* causal power, no *emergent* behavior attributable to the ‘desk duo’ *as such*. It’s just the sum of the phone’s properties and the bottle’s properties plus basic proximity effects. No ontological addition.

  **Alex:** But what *is* emergence, Sam, if not complex interaction? And why does complexity confer ontological status? Your ‘fundamental particles arranged F-wise’ still implies *some* organization – the ‘arrangement’ is doing work! Universalism cuts through this vagueness. Any arrangement, simple or complex, *just is* an object. The ‘desk duo’ *is* a distinct entity, however trivial. The trout-turkey is another, more complex one. Denying the first because it's simple seems like special pleading to avoid admitting the universe is full of gerrymandered objects.

  **Sam:** And *your* view makes ontology absurdly bloated! Every random collection of dust motes, every arbitrary set of stars light-years apart – they all become ‘objects’? That renders the concept meaningless. My criterion – significant, stable causal unity – carves reality at its natural joints. It explains why we *rightly* recognize phones, turkeys, and (hypothetically) viable trout-turkeys as single things, but intuitively reject ‘desk duos’ or ‘the sum of my left shoe and the moon’. It’s not vagueness, it’s acknowledging that composition requires a *substantive connection* beyond mere co-location or set membership.

  **Alex:** But ‘substantive connection’ is exactly what’s vague! Where’s the bright line? The trout-turkey pushes your boundary – is its unity ‘substantive’ enough? The ‘desk duo’ has *some* connection – gravity, contact forces. Isn't the difference just one of degree? Universalism offers a clear, non-arbitrary principle: composition is unrestricted. The complexity or utility of the whole is irrelevant to its *existence*. The simplicity of the ‘desk duo’ doesn't make it less real, just less interesting. The potential instability of the trout-turkey doesn't negate its existence *while* it coheres.

  **Sam:** Clarity shouldn’t come at the cost of plausibility, Alex. Your ‘clear principle’ generates an infinity of objects with no explanatory power. My view, while perhaps requiring careful analysis of causal integration in borderline cases like the trout-turkey, aligns with how science and common sense identify persisting, functional unities. The ‘desk duo’ fails that test utterly. It’s just two distinct objects temporarily sharing a location. Calling it one object adds nothing to our understanding of the world, only to our ontology textbooks – and unnecessarily so. Reality is just the fundamental particles and *how they are arranged*. We don’t need the ‘desk duo’ entity.

  **Alex:** And I say the arrangement *is* the entity! But… (pauses, looking at the phone and bottle) I’ll concede this much: the ‘desk duo’ is certainly the *least interesting* object currently on this desk. But by my lights, it exists. That trout-turkey, though… if it *could* exist stably? That’s a fascinating case for both of us, isn’t it?

  **Sam:** (Nods slowly) Agreed. The trout-turkey would be the ultimate stress test for *any* theory of composition. But your phone and bottle? (Shakes head, smiling slightly) Still just two things on a desk, Alex. Just two things.

  **Alex:** (Chuckles) And one very contentious non-thing, apparently. More coffee?

  **(They both reach for the coffee pot – another potential composite object under debate.)**
