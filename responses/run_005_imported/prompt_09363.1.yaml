answer: |-
  You've identified a crucial tension in Aquinas's thought and why your deacon's summary oversimplified a complex, conditional doctrine. Let's break down the issues:

  1.  **The "Hedge" in the Summa (II-II, q.42, a.2):**
      *   **Why the Proviso?** Aquinas *is* making the licitness of resistance depend on a prudential forecast of outcomes. This isn't merely practical caution *added* to an unconditional right; it's **inherent to his conception of justice and the common good**.
      *   **Justice Requires Proportionality:** For Aquinas, an act aimed at removing an evil (tyranny) must not itself cause a *greater* evil (e.g., civil war leading to massive bloodshed, anarchy, or the rise of an even worse tyrant). Justice demands that the remedy not be worse than the disease. The *intention* to remove a tyrant might be just, but the *means* (disturbance/dissension) must be proportionate and likely to achieve a net good for the common good.
      *   **Sedition Defined:** Aquinas defines sedition (q.42, a.1) as "the discord of a multitude united by fellowship in human society... it is a special sin." Disturbing an *unjust* ruler isn't inherently seditious *because it lacks the essential element of disturbing a just social order*. However, *how* you disturb it matters. An "inordinate" disturbance causing more harm *becomes* unjust and potentially sinful itself, even if the target is a tyrant.
      *   **What "Disturb" Covers:** "Disturbing" (*perturbare*) is broad. It encompasses any action that destabilizes or seeks to overthrow the regime: rebellion, coup, uprising, factional strife aimed at removal. It focuses on the *political act* against the *regime*. Killing the ruler *personally* would likely be seen as one possible *means* of disturbing the regime, but Aquinas doesn't specify the means here. The focus is on the legitimacy of the *political act* of resistance itself, contingent on proportionality.

  2.  **The Earlier View in the Sentences Commentary (In II Sent., d.44, q.2, a.2):**
      *   **The Specific Scenario:** Here, Aquinas discusses a tyrant who seized power *by force* ("per violentiam"), i.e., a *usurper*, not a ruler who became tyrannical *after* legitimate accession.
      *   **No Higher Authority:** Crucially, he specifies that this applies *only* when there is "no possibility of appealing to a higher authority" ("non habet superiorem ad quem recurrere possit") to judge and depose the tyrant.
      *   **The Actor:** He says the one who liberates the multitude by killing the tyrant "is not a murderer, but rather is to be praised" ("non est homicida, sed magis laudandus").
      *   **Key Differences:** This is significantly narrower:
          *   **Type of Tyrant:** Only *usurpers* who gained power by naked force.
          *   **Condition:** *Only* when no higher temporal authority (like an Emperor over a King) exists to adjudicate and remove the tyrant.
          *   **Actor:** Focuses on the individual liberator ("*ille* qui... liberat").
          *   **Means:** Explicitly endorses killing as the licit means in this specific scenario.

  3.  **Are These Two Distinct Scenarios?**
      *   **Yes, largely.** The *Sentences* commentary addresses a very specific case: killing a *usurping* tyrant by an individual when *no higher temporal judge exists*.
      *   The *Summa Theologiae* (written later, representing his more mature thought) addresses the broader question of resisting *any tyrannical government* (whether usurper or legitimate-ruler-turned-tyrant) through *collective disturbance/dissension* (not necessarily specifying killing as the means). Crucially, it:
          *   Removes the restriction to usurpers (applies to any ruler governing for private gain).
          *   Focuses on *multitude* action, not an individual.
          *   Does *not* explicitly endorse *killing* as the means; "disturbing" is broader.
          *   Imposes the strict *proportionality condition* (harm caused < harm removed).
          *   Does *not* explicitly require the absence of a higher authority, though the proportionality condition likely encompasses considering whether appeal is possible.

  4.  **Reconciling the Two & Addressing the Deacon's Summary:**
      *   The *Summa* view is the broader, more developed framework. Resistance to *any* tyranny is *in principle* licit because it opposes injustice.
      *   However, this resistance is **heavily conditioned**:
          *   It must be for the *common good*.
          *   The *means* ("disturbance") must be proportionate, likely to succeed, and cause *less harm* than the tyranny itself (the prudential forecast *is integral to justice*).
          *   It is framed as a *collective* action ("one part of the multitude" vs. another, or the multitude acting).
      *   The *Sentences* example fits *within* this broader framework as a very specific *sub-case* where:
          *   The tyrant is a usurper (making his rule fundamentally illegitimate from the start).
          *   The condition of "no higher authority" makes collective political action or appeal impossible, leaving only extreme individual action.
          *   Killing is seen as the necessary and proportionate means *in that extreme scenario*.
      *   **Why the Deacon's Summary was Misleading:**
          *   **Overgeneralization:** He presented the *narrow, specific* case from the *Sentences* (killing a usurper by an individual) as if it were Aquinas's *general* position on killing *any* tyrant.
          *   **Omission of Conditions:** He ignored the *critical conditions* present in *both* texts: the absence of higher authority in the *Sentences*, and the proportionality requirement in the *Summa*. Aquinas *never* gives an unconditional license to kill tyrants.
          *   **Conflation:** He blurred the distinction between the individual act of tyrannicide against a usurper and the collective act of disturbing/deposing any tyrant.

  **A More Accurate One-Sentence Summary:**

  "While Aquinas argued that resistance to a true tyrant (one ruling for private gain, not the common good) is not inherently sinful sedition, he imposed strict conditions: resistance must be necessary (especially if no higher authority exists), proportionate, likely to cause less harm than the tyranny itself, and oriented towards restoring the common good; his explicit endorsement of *killing* a tyrant was limited to the narrow case of a usurper when no other remedy was possible."

  **A More Accurate Two-Sentence Summary:**

  "Aquinas held that disturbing or overthrowing a tyrannical government (one directed solely to the ruler's private good) is not inherently seditious and can be licit *if* the resulting disturbance is not so inordinate that it inflicts greater harm on the people than the tyranny itself. While in his earlier work he explicitly praised an individual who killed a tyrant who had *usurped power by force*, this was presented as an exceptional case justified *only* when absolutely no higher temporal authority existed to judge and depose the usurper, fitting within his broader requirement that resistance must be necessary, proportionate, and for the common good."

  **In essence:** Aquinas provides a *highly conditional justification* for resistance to tyranny, grounded in the common good and demanding careful prudential judgment about means and consequences. He *does not* offer a blanket "praise-worthy" license to kill any unjust ruler. Your instinct that it was "too tidy" was correct. The complexity you found in the texts reflects the genuine difficulty Aquinas saw in balancing the evil of tyranny against the dangers of revolution and the requirements of justice and order.
