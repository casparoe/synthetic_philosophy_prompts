  First, I need to recall Turing's original paper. The key passage discusses limits on human computation: bounded observable symbols and finite states of mind. The user is questioning whether these are conceptual truths, empirical claims, or something else. Turing himself calls this appeal to intuition "unsatisfactory mathematically," which adds complexity.

