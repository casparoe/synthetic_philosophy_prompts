answer: |-
  ## The Unbearable Heaviness of Relations: Why Bradley's Regress Sinks Constituent Propositions but Spares Act-Based Unities

  Bradley's regress remains a profound and unsettling challenge to the very idea that propositions – the bearers of truth and falsity – can be understood as structured entities composed of distinct constituents (like objects, properties, or relations). The core dilemma is stark: if a relation is needed to bind constituents into a unified whole capable of representing a state of affairs, what binds *that* relation to the constituents? Any answer seems to demand a further binder, launching an infinite and vicious regress. This essay argues that **Bradley's regress decisively undermines all accounts of propositions that posit structured constituents requiring a distinct unifying relation or structure.** While contemporary relational theories like Jeffrey King’s merely relocate the regress, act-based theories (Soames, Hanks) offer a genuine escape by grounding propositional unity in the primitive, intentional nature of the cognitive act itself, eliminating the need for a distinct unifier. The regress, therefore, is not defused for constituent-based *relational* accounts, but act-based theories provide a viable alternative conception of propositions where unity is inherent, not imposed.

  **The Regress Reborn: Jeffrey King's Relational Facts**

  Jeffrey King's influential theory explicitly tackles Bradley's regress by identifying propositions with *facts* about the semantic relations holding between the constituents of an interpreted sentence in a context. For King, the proposition *that Desdemona loves Cassio* is the fact that, in English, 'loves' semantically relates 'Desdemona' and 'Cassio' in a specific sentential structure (e.g., subject-verb-object). Unity arises from the obtaining of this complex relational fact: the words, their meanings, and their syntactic arrangement are bound together *by the fact itself* that they stand in these relations.

  However, King's solution merely **relocates Bradley's regress** rather than dissolving it. The regress now threatens the unity of the *proposition-constituting fact*. What unifies the complex fact that 'loves' semantically relates 'Desdemona' and 'Cassio'? This fact itself seems to have constituents: the relation of semantic relating (R), the relation 'loves' (r), and the relata 'Desdemona' (d) and 'Cassio' (c). If we need a further relation (R2) to bind R, r, d, and c into the unified fact F (that R holds between r, d, and c), then we are launched straight back into the regress concerning the unity of *F*. King might argue that facts are primitive unifiers, but this simply **replicates the original problem at the meta-level**: it posits a fundamental "factual unity" without explaining how *it* avoids needing a unifier. The regress concerning what makes a *fact* a unified entity, rather than a mere list of its components, is isomorphic to the original regress about propositions. King's sophisticated machinery ultimately fails because it relies on the very kind of complex relational structure whose unity Bradley's argument calls into question. The regress sinks into the foundational facts meant to constitute the proposition.

  **The Act-Based Escape: Unity as Primitive Performance**

  Act-based theories, championed by Scott Soames and Peter Hanks, offer a radically different approach. They argue that propositions are not pre-existing abstract structures but are *types* of cognitive or predicative acts. The unity of the proposition *that Desdemona loves Cassio* is not a matter of relations binding static constituents, but rather **inherent in the performance of the act itself** – the act of predicating the property *loving* of Desdemona and Cassio (Hanks) or the act of entertaining the content *Desdemona loving Cassio* (Soames). On Hanks' view, for instance, the proposition *is* the act-type of predicating loving of Desdemona and Cassio. The act is primitive: it is not composed of independent constituents that then need gluing together. Predicating *just is* the act of bringing property and object(s) together into a unified, truth-evaluable content.

  This approach **genuinely dissolves Bradley's regress** by eliminating the need for a distinct unifying relation. The regress arises from the assumption that constituents (a, b, R) are distinct entities that *then* need combining. Act-based theories reject this picture at the outset. The act of predicating R of a and b is a single, unified cognitive event. The property and the objects are not independent entities waiting to be related; they are *roles played within the act itself*. Asking what binds the act to its content is a category mistake – the act *is* the predicative engagement *with* that content. The unity is primitive and intentional: the act is intrinsically directed towards the state of affairs *Desdemona loving Cassio* as a whole. There is no separate "R" needing binding to "a" and "b"; there is only the act of *applying R to a and b*. The regress never gains traction because the fundamental unit is the act, not a structure requiring assembly.

  **Objections and the Strength of the Counterargument**

  The strongest objection to the act-based solution is that it merely **shifts the locus of mystery**: instead of explaining the unity of static constituents, it posits a primitive unity of the act, leaving the nature of this "act unity" unexplained. How does the single act manage to inherently involve *multiple* components (the property, the objects) in the right way? Doesn't this reintroduce the need to explain how *these aspects* of the act cohere? This echoes Wittgenstein's objection to Russell: without structure, how does the act distinguish *Desdemona loving Cassio* from *Cassio loving Desdemona*?

  This objection carries significant weight, but act-based theorists have resources to counter it. Firstly, they can argue that **intentionality is the fundamental explanans, not the explanandum** in this context. Cognitive acts like predication are the *basic* units of thought and representation; their unity and directedness are primitive features of cognition, not further reducible. Demanding an explanation for *how* an act can be inherently predicative and unified is like demanding an explanation for how fundamental particles have mass – it might be a brute fact. Secondly, Hanks emphasizes that the **components are defined by their roles within the act**. "Desdemona" isn't an independent object somehow glued to the act; it is the *target* of the predication inherent in the act-type. The structure (who is loving whom) is built into the *type* of act being performed from the start. While this might seem like structure smuggled back in, the key point is that the structure isn't *constituted by* relations between independent entities; it's defined by the nature of the primitive act-type itself. The act-type *predicating loving of Desdemona and Cassio* is simply different in kind from *predicating loving of Cassio and Desdemona*. This difference is intrinsic to the act-type, not constructed from parts.

  **A Qualified Verdict: Regress Sinks Constituent-Relational Views, Act-Based Theories Survive**

  Bradley's regress presents an insurmountable problem for any account that views propositions as complex entities *composed of* distinct constituents whose unity depends on a *further* element (be it a relation, a structure, or a fact about relations). Jeffrey King's sophisticated relational theory exemplifies this: by grounding propositions in facts about semantic relations, it merely reconstructs the regress problem at the level of what unifies *those* facts. The demand for a unifier of the unifier is relentless and fatal for such views. The regress shows that constituent-based propositions, conceived as relational structures, are inherently unstable.

  Act-based theories, however, provide a viable escape route. By identifying the proposition with a type of cognitive act (predication, entertainment), they ground unity in the primitive, intentional nature of the act itself. The act is not a composite needing assembly; it is a fundamental unity wherein property and objects are inherently engaged. While this posits the unity of intentional acts as a primitive, it does so without generating a regress, as there is no distinct "unifier" to demand an explanation for. The strongest objection – that act unity is mysterious – is valid but ultimately less damaging than the inescapable regress plaguing relational accounts. Primitive intentional unity is a more defensible stopping point than an infinite hierarchy of relations. Furthermore, act-based theories better align with the dynamic, cognitive role propositions play in thought and judgment.

  Therefore, Bradley's regress does indeed demonstrate that **no account of propositions *as structured, constituent-based entities requiring a distinct unifying relation or structure* can succeed.** Such accounts are inherently vulnerable to the regress. However, act-based theories, by rejecting the core assumption that unity requires binding distinct static constituents, offer a coherent alternative conception where unity is inherent in the act of predication itself. They genuinely defuse the regress, not by solving it within the constituent framework, but by providing a fundamentally different and regress-proof account of what propositions *are*. The regress sinks constituent-based relational propositions but leaves act-based propositions afloat.
