answer: |-
  Here’s a joke crafted to *require* familiarity with the endurantism/perdurantism debate, turning explicitly on the "wholly present" vs. "temporal part" distinction and Lewis's problem of temporary intrinsics:

  ---

  **Two philosophers walk into a bar.**  
  The first slams his fist on the counter: "I demand a refund! Last Tuesday, *this very beer* was cold and crisp. Now it’s warm and flat!"  

  The bartender, a committed perdurantist, shrugs: "Sorry, pal. The temporal part of that beer that was cold and crisp *last Tuesday* isn’t identical to the temporal part you’re holding *now*. You’re complaining about a different slice of the beer-worm."  

  The endurantist scowls: "But *I’m* still wholly present! And *this* beer—" (he shakes the glass) "—is *wholly* warm and flat! Refund!"  

  The perdurantist smirks: "Look, if you want to hold *this* temporal stage of the beer responsible for the properties of an *earlier* stage, that’s on you. But strictly speaking? *This* beer-stage owes you nothing."  

  ---

  ### Why it works for your seminar:
  1. **Temporary Intrinsics Nailed**: The warm/flat vs. cold/crisp contrast directly mirrors Lewis's "bent vs. straight" problem.  
  2. **Ontological Punchline**: The perdurantist’s refusal hinges on the non-identity of temporal parts ("*this* beer-stage owes you nothing"), exploiting the view that only *current* stages are strictly present.  
  3. **Endurantist Frustration**: The endurantist’s appeal to being "wholly present" highlights their core commitment—and why the perdurantist’s reply feels like a dodge.  
  4. **Invisible to Outsiders**: Without knowing perdurantism fragments objects into stages, the punchline seems like nonsense. With context, it’s a reductio of the view’s practical absurdity.  

  **Bonus Layer**: The endurantist’s "I’m still wholly present!" subtly parallels the personal identity problem—he’s enduring, but the beer isn’t, per the perdurantist.  

  Hope this pays your debt and earns a few groans of philosophical recognition!
