  Hey, I'm prepping a discussion section on Popper's theory of verisimilitude and I keep getting stuck on the Tichy/Miller result. I get *what* it shows -- that on Popper's original truth-content/falsity-content definition, one false theory can basically never come out more verisimilar than another false theory, which kind of wrecks the whole project of saying Newtonian mechanics is "closer to the truth" than Aristotelian physics. But every treatment I find just does the logic at me and I dont walk away with any real feel for *why* it has to go that way. Can you give me a more intuitive, gut-level explanation of the mechanism -- like why does tacking extra true consequences onto a false theory apparently always end up smuggling in extra false ones too? Don't need the full formal proof, just enough intuition that I could actually explain it to undergrads without hiding behind the notation.
reasoning: |-
  Okay, the user is preparing a discussion on Popper's verisimilitude and is stuck on the Tichy/Miller result. They understand what it shows but want an intuitive explanation for why it happens, especially why adding true consequences to a false theory introduces false ones. They need to explain this to undergrads without heavy notation.

  First, I recall Popper's definition: verisimilitude combines truth content (true consequences) and falsity content (false consequences). A theory is closer to truth if it has more truth content and less falsity content than another. The Tichy/Miller result shows that for two false theories, comparing them this way fails because when you try to increase truth content, you might inadvertently add falsity content.

  The key is the underlying logical structure. Theories as sets of statements, and logical implications mean that adding truths can force the inclusion of false statements. I should use a simple example. Let's say we have a domain with three objects and one property. The truth is all are A. False theories: Theory X says only two are A, Theory Y says only one is A. But how to show that increasing truth content adds falsity?

  Ah, the example with two light switches. Truth: both on. Theory A says switch 1 is on, switch 2 is off. Theory B says switch 1 is off, switch 2 is on. Each has one true and one false claim. Now, if we try to make Theory B better by adding a true consequence, like "switch 1 is on or switch 2 is on". But adding that doesn't help because both theories already imply it. Need a consequence that only the truth has.

  The user mentioned tacking extra true consequences. So, for Theory A (switch1 on, switch2 off), it doesn't imply "if switch1 off then switch2 on" which is a true conditional. But adding that to Theory A would require also adding the negation of its false claim? Wait, maybe that's messy.

  Another approach: focus on what each theory gets wrong. Theory A believes switch2 is off, which is false. To correct that, you'd need to say switch2 is on, but that contradicts Theory A. If you try to add a true statement that's not already implied, it might conflict with the existing false statements.

  The light switch example might work. Both false theories have the same amount of truth and falsity. When you try to add a true consequence to one, like "switch1 is on or switch2 is on" is already implied. The true statement "switch1 is on and switch2 is on" can't be added because it contradicts both theories. So what true consequence can be added that only the truth has? Maybe a disjunction. Suppose we add "switch1 is on or switch2 is off" to Theory B. But Theory B already implies that because it says switch2 is on, so "switch2 is off" is false, but the disjunction is true because switch1 is off? Wait, no.

  Let me define clearly: Truth: both on. So "switch1 on" is true, "switch2 on" is true. Theory A: switch1 on, switch2 off. Theory B: switch1 off, switch2 on. Now, a true consequence that Theory A doesn't have? For example, "switch2 is on" is true, but Theory A claims switch2 is off, so it can't imply "switch2 is on". If you want to add "switch2 is on" to Theory A, it would make the theory inconsistent because it already says switch2 is off. But in terms of logical implication, adding a statement to the theory might not directly show in the consequence set.

  Perhaps the issue is that the truth-content and falsity-content are tied together. For a false theory, any true consequence it doesn't have must be something that contradicts its false beliefs. So to include that true consequence, you'd need to remove the false belief, but that's changing the theory, not adding consequences.

  The Tichy/Miller proof uses specific logical statements. Like, for two theories A and B, both false, there's a statement C that's true, implied by truth, but not by A. But when you add C to A, it might imply a false statement because A has a false assumption. The disjunction trick: since A is false, there's some false statement F it implies. Then the statement "C or F" is true because C is true. But if A implies F, then A implies "C or F". So actually, A already implies all such disjunctions. Hmm, that's part of the formal proof.

  To make it intuitive: a false theory is "locked in" to its mistakes. Any attempt to add a true statement that it doesn't already imply would require negating its false claim, which isn't possible without changing the theory itself. So when you try to increase truth-content, you can't do it without also affecting falsity-content because the false part contaminates the implications.

  For undergrads, use a simple analogy. Like a broken compass: if a compass is stuck pointing west, any reading you take will be wrong in a way that's tied to its bias. Fixing one reading might not help because the underlying flaw affects everything.

  Or the apple basket example: Truth is all apples are red. Theory X says apple1 red, apple2 green. Theory Y says apple1 green, apple2 red. Each has one truth, one falsehood. To make Theory X better, you want to add "apple2 is red" but that contradicts its claim that apple2 is green. If you just add the statement, the theory becomes inconsistent. But in logical terms, the theory's consequence set already includes all implications of its statements. So adding "apple2 is red" isn't adding a consequence; it's changing the axiom.

  The key point is that the set of consequences is fixed by the axioms. To have more true consequences, you need axioms that are closer to truth. But for false axioms, their consequence set is "saturated" with implications that include both true and false, and you can't selectively add true consequences without altering the axioms.

  In the comparison, when you look at Theory A vs Theory B, any true consequence that Theory B has but A lacks must involve the part where A is wrong. But because A is wrong in that part, adding that truth would conflict, and moreover, it might bring in a falsehood from B's perspective.

  Back to the light switches. Suppose Theory A: switch1 on, switch2 off. Truth: both on. A true consequence that truth has but A doesn't: "switch2 is on". But if you consider Theory B: switch1 off, switch2 on. Theory B does imply "switch2 is on", which is true. So Theory B has this truth that A lacks. But Theory B also implies "switch1 is off", which is false. Now, for Theory A to gain the truth "switch2 is on", it would need to stop implying "switch2 is off", which it can't without changing its axiom. Moreover, if you force-add "switch2 is on" to A, now the theory says switch1 on and switch2 on, which is the truth, but that's not adding a consequence; it's replacing the theory.

  The Tichy/Miller result shows that for any true statement T that B has and A doesn't, there's a false statement that B implies because of how T is connected to B's false statements. And when A tries to "adopt" T, it would imply a different false statement.

  In the case of light switches, let T be "switch2 is on". B has it, A does not. B also implies "switch1 is off", which is false. Now, if A were to imply T ("switch2 is on"), but A implies "switch2 is off", so it can't imply both unless inconsistent. But even if it did, by implying "switch2 is on", and since A also says switch1 on, it would now imply the truth, but that's not the point. The point is that for B, having T is tied to its false belief about switch1.

  To see why A can't be better: suppose we claim Theory A is closer because it has more truth. But both have one true and one false atomic claim. What truth does A have that B doesn't? "switch1 is on" is true, and B says it's off, so B doesn't imply it. Similarly, B has "switch2 is on" which A doesn't. So each has a true consequence the other lacks. But each also has a false consequence the other lacks. So neither dominates in truth-content without also having more falsity-content.

  Now, why can't we add a true consequence to A without adding falsity? Suppose we add a different true statement, like "switch1 is on or switch2 is on". But both theories already imply that because each has at least one switch on. So it doesn't add anything new. What true statement does the truth imply that neither A nor B implies? For example, "both switches are on". But neither A nor B implies that. If we try to add "both switches are on" to A, it would conflict with A's "switch2 is off", so adding it makes the theory inconsistent, meaning it implies everything, including false statements. So falsity-content explodes.

  The only way to add a true consequence that wasn't implied is if it's compatible with the theory. But for a false theory, any true statement not implied must be inconsistent with its false beliefs, so adding it causes inconsistency. Therefore, you can't increase truth-content without increasing falsity-content.

  This seems like the core intuition. The false part of the theory blocks any new true consequences that would require it to be true. So the only truths you can add are those already implied or those that cause contradiction. Hence, for two false theories, you can't make one have strictly more truth and less falsity than the other.

  For undergrads, emphasize that false theories are "stuck" with their mistakes, and any attempt to patch them by adding truths either does nothing (if already implied) or breaks the theory (if not implied), making it worse. Thus, comparing them using Popper's definition doesn't work.
answer: |-
  Absolutely, the Tichy/Miller result feels like a magic trick where the rabbit you're trying to pull out of the hat *always* turns into a pigeon. Let's ditch the formal logic and build intuition with a simple analogy. The core problem is this: **False theories are like broken compasses—they can't point to new truths without also reinforcing their own mistakes.** Here’s why, step by step:

  ### 1. **Start with a Tiny World (to keep it manageable)**
  Imagine a universe with just two light switches, and the *whole truth* is:  
  - **Switch 1: ON**  
  - **Switch 2: ON**  

  Now, two false theories:  
  - **Theory A (Newton-ish)**: Claims "Switch 1 is ON, Switch 2 is OFF".  
  - **Theory B (Aristotle-ish)**: Claims "Switch 1 is OFF, Switch 2 is ON".  

  Both get one switch right and one wrong. Popper wants to say Theory A is "closer to truth" because, say, it got Switch 1 right. But let’s test that.  

  ---

  ### 2. **The "Extra Truth" You Want to Add**
  You think: *"What if I beef up Theory A by adding a true consequence? For example, since Switch 1 is truly ON, maybe I add: 'Switch 1 is ON OR unicorns exist'."*  
  - This is technically true (because Switch 1 is ON), and Theory A *already implies it* (since it says Switch 1 is ON).  
  - **No gain here**. It doesn’t add *new* truth-content because Theory A already "contained" this truth.  

  So you try a *stronger* truth: **"Switch 2 is ON"** (which is part of the full truth).  
  - But Theory A *explicitly claims Switch 2 is OFF*. If you force-add "Switch 2 is ON" to Theory A, you create a contradiction:  
    - Theory A now says: "Switch 2 is OFF **and** Switch 2 is ON".  
  - **Contradictions nuke everything**: A theory with a contradiction implies *every possible statement*—true AND false. Suddenly, Theory A "implies" that "Switch 2 is made of cheese", "2+2=5", etc. Its falsity-content explodes!  

  **Key Insight**:  
  > Any true statement that a false theory *doesn’t* already imply must *clash* with its false core beliefs. Adding it forces inconsistency, which poisons the whole theory with infinite falsity.  

  ---

  ### 3. **The Sneaky Trade-Off (Why You Can’t Win)**
  Let’s say you *still* want Theory A to "beat" Theory B. You need Theory A to:  
  - Have **more truth-content** than B (i.e., imply extra truths that B misses),  
  - While having **less falsity-content** (i.e., avoid implying false things that B implies).  

  But here’s the catch:  
  - **Truth-content and falsity-content are glued together by logic.**  
  - Suppose there’s a truth *T* that Theory B implies but Theory A doesn’t (e.g., for Theory B: "Switch 2 is ON").  
  - Because Theory B is *false*, it also implies something false *because of how it supports T*. For example:  
    > Theory B says: "Switch 1 is OFF" (false) and "Switch 2 is ON" (true).  
    > So it implies: **"If Switch 2 is ON, then Switch 1 is OFF"** (a false conditional, since both are truly ON!).  

  Now, if you want Theory A to "steal" the truth *T* ("Switch 2 is ON") from Theory B:  
  - Theory A would have to *stop implying its own false belief* ("Switch 2 is OFF"). But that’s part of its core—it can’t!  
  - Even if it could, adopting *T* would force Theory A to imply **new falsehoods** (like that same false conditional above, but now tied to *its* worldview).  

  **Why? Logic is a package deal**:  
  - To imply a new truth, you need to "buy into" the logical web that supports it.  
  - For a false theory, that web *always contains hidden false wires*. Pull one truth, and a falsehood comes attached.  

  ---

  ### 4. **The Brutal Conclusion (for Popper's Definition)**
  - **False theories are "islands of error"**:  
    Their truth-content is locked to their mistakes. You can’t add a *new* truth without toppling the whole structure into contradiction or importing new false baggage.  
  - **No clean comparison**:  
    If Theory A seems to have "more truth" in one area, it *always* pays for it with extra falsity elsewhere (or blows up entirely). Meanwhile, Theory B has its own "truth surplus" in another area, balanced by its own unique falsehoods.  
  - **Why Newton vs. Aristotle fails**:  
    Newtonian mechanics isn’t "mostly true + a little false"—it’s a coherent system where its truths (e.g., about planetary orbits) are *intertwined* with its falsehoods (e.g., absolute space/time). You can’t surgically add "more truth" from relativity without dismantling Newton’s framework.  

  ---

  ### **How to Explain to Undergrads (TL;DR)**  
  > *"Think of a false theory like a crooked map. If you try to ‘correct’ it by adding a true landmark (‘There’s a mountain here!’), you either:*  
  > *1. Write it in a spot the map already shows correctly—no improvement,*  
  > *2. Or write it in a spot the map mislabels—now the map contradicts itself and becomes useless.*  
  > *Worse: if you copy a ‘true landmark’ from a different crooked map, you also copy the wrong roads connected to it. So no false map can be ‘less wrong’ than another—they’re wrong in incompatible ways. Popper’s definition couldn’t handle that."*  

  This is why philosophers moved to more sophisticated accounts of verisimilitude (like the "possible worlds" approach). Popper’s heart was in the right place, but logic is merciless! Let me know if you want to dive into the "fixes" for verisimilitude next.
