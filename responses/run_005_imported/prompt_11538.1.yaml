prompt: |-
  I spent thirty-five years as an evolutionary biologist working mostly on the evolution of cooperative behaviour in social insects, and since retiring I have been reading my way, rather unsystematically, through the metaethics literature. Two arguments I have come across keep bumping into one another in my mind, and I would like some help working out whether the resemblance between them is more than superficial.

  The first is Sharon Street's "Darwinian Dilemma" for realist theories of value: her claim that a realist who grants, as seems undeniable, that natural selection shaped the content of our evaluative attitudes must choose between an implausible "tracking" account, on which selection somehow favoured evaluative beliefs because they were true, and a far more credible "adaptive link" account, on which selection favoured them purely for their fitness effects, leaving any correspondence with independent evaluative facts an unexplained coincidence. The second is Alvin Plantinga's evolutionary argument against naturalism, which I first encountered decades ago in the rather unwelcome context of intelligent-design polemics, long before I was prepared to take it seriously as philosophy: the claim that if naturalism and evolution are both true, then the probability that our cognitive faculties are reliable, P(R | N&E), is low or inscrutable, since selection tracks survival value rather than truth, so that a naturalist who accepts evolution thereby acquires a defeater for the reliability of all her beliefs, including her belief in naturalism and evolution themselves.

  On the surface, both arguments run the same basic move: a selective process tuned to fitness gives no particular reason to expect it to have also delivered true beliefs in some target domain. What I would like is a more careful comparison of their actual logical structure, not just this family resemblance. Does Street's dilemma have anything like the global, self-undermining character of Plantinga's argument, or does its scepticism stay local to moral and evaluative belief, leaving untouched the very faculties needed to state and assess the dilemma in the first place? Relatedly, some realists answer Street with a "third factor" reply, on which some further trait, such as a general capacity for practical reasoning, explains both our having certain evaluative attitudes and their reliability, without either causing the other. Is an analogous move available to the naturalist against Plantinga, or does naturalism lack the resources for it in a way that theism, on Plantinga's own view, does not? I would be grateful for a structural comparison along these lines, together with your own assessment of which of the two arguments poses the more serious problem for its target position, and why.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a retired evolutionary biologist with 35 years in the field, focusing on social insects and cooperative behavior. Now they're diving into metaethics and encountering two arguments: Sharon Street's Darwinian Dilemma and Plantinga's evolutionary argument against naturalism. They notice a similarity—both argue that evolution selects for fitness, not truth—but want a deeper structural comparison.

  First, I need to recall both arguments accurately. Street targets moral realism, saying if evolution shaped our moral beliefs, realists must choose between implausible tracking or an unexplained coincidence. Plantinga argues that naturalism combined with evolution undermines the reliability of all cognitive faculties, including belief in naturalism itself. The user is asking whether the resemblance is superficial and which is more problematic for its target.

  The user's main questions are about the logical structure: Does Street's dilemma have a self-undermining element like Plantinga's? Can a "third factor" reply work against Plantinga similar to how it does against Street? They also want an assessment of which argument is more serious.

  Starting with structural differences. Street's dilemma is local to evaluative beliefs. It doesn't question cognitive faculties in general, so stating the dilemma isn't self-defeating. Plantinga’s argument is global. If cognitive faculties are unreliable, that includes the faculties used to form the argument, making it self-defeating. That's a key distinction.

  Next, the "third factor" responses. For Street, realists propose factors like practical reasoning that link survival to moral truths. For example, cooperation might be both adaptive and morally good. But Plantinga's naturalist can't easily do this because any third factor would require reliable cognition, which is under question. Theism provides an external guarantee of cognitive reliability, which naturalism lacks. So the third factor works locally for Street but not globally for Plantinga.

  Assessing which argument is more serious: Street's challenges moral realism but doesn't collapse all knowledge. Plantinga's threatens the entire naturalist worldview, creating a self-referential problem. However, naturalists have responses, like arguing evolution does track truth in non-moral domains. But the structural issue remains: Plantinga's argument is more radical because it undermines its own foundation.

  I should also consider the user's background. As an evolutionary biologist, they might appreciate the biological nuances. They mentioned encountering Plantinga in ID contexts but now engaging philosophically. They might want clarity without polemics. Their deep experience with evolution means examples from social insects could resonate, like how cooperative behavior's adaptiveness might relate to moral truths.

  Unspoken needs: They might be wrestling with reconciling their evolutionary work with metaethics. The tension between biological influences on behavior and objective morality could be personal. They might seek whether evolutionary accounts allow for robust moral realism or if naturalism is internally consistent. Ensuring the response addresses these implicitly by comparing the arguments' implications for their fields.

  Need to avoid technical jargon but not oversimplify. Highlighting that Street's allows for scientific realism while targeting ethics, whereas Plantinga’s challenges science itself. Emphasize that the self-referential problem in Plantinga makes it more formidable, even if contested. Conclude that while both use evolutionary logic, the scope and self-undermining nature make Plantinga's more serious for naturalism, whereas Street's is a contained problem for moral realists.
answer: |-
  Your background provides a fascinating lens for examining these arguments. Both Street and Plantinga leverage evolutionary theory to challenge epistemological reliability, but their targets, scope, logical structure, and implications differ significantly. Here’s a structural breakdown, comparison of responses, and an assessment of their relative force:

  ### 1. **Core Logical Structure: Similarity and Divergence**
     - **Shared Premise**: Both arguments hinge on the claim that **natural selection optimizes for fitness (survival/reproduction), not truth**. Beliefs are selected based on their adaptive consequences, not their correspondence with reality.
     - **Street’s Dilemma (Localized Scepticism)**:
       - **Target**: Moral realism (specifically, non-naturalist or robustly realist metaethics).
       - **Structure**:
         1. *Empirical Premise*: Evolution shaped human evaluative attitudes.
         2. *Realist Commitment*: Evaluative truths exist independently of these attitudes.
         3. *Dilemma*:
            - *Tracking Horn*: Evolution selected attitudes *because* they track independent truths. (Implausible: no selection *for* truth-tracking in moral domain.)
            - *Coincidence Horn*: Attitudes were selected for fitness, so their alignment with truth is a cosmic coincidence. (Undermines justification for realism.)
       - **Scope**: Restricted to *evaluative beliefs* (moral/normative). Non-evaluative cognition (e.g., perceptual beliefs) is assumed reliable.
     - **Plantinga’s Argument (Global Scepticism)**:
       - **Target**: Naturalism (N: no supernatural entities) combined with evolution (E).
       - **Structure**:
         1. *Assumption*: N&E are true.
         2. *Probability Claim*: P(R | N&E) is low or inscrutable (R = "human cognitive faculties are reliable").
         3. *Self-Undermining Consequence*: If P(R | N&E) is low, N&E itself cannot be rationally believed → *Defeater for all beliefs*, including N&E.
       - **Scope**: *All cognitive faculties* (perception, memory, reasoning). Undermines science, logic, and the argument itself.

  ### 2. **Key Structural Differences**
     - **Self-Referentiality**:
       - **Street**: *Not self-undermining*. The dilemma relies on reliable non-evaluative cognition (e.g., evolutionary biology, logic). Scepticism is quarantined to ethics.
       - **Plantinga**: *Explicitly self-referential*. If successful, it invalidates the cognitive faculties used to formulate and accept the argument. This creates a "metaincoherence" problem: you can’t rationally believe the argument without presupposing R, which the argument undermines.
     - **Target Vulnerability**:
       - **Street**: Challenges *justification* for moral realism. Realists must explain how evolution *could* deliver moral truth-tracking.
       - **Plantinga**: Challenges *rationality of holding any belief* under naturalism. Naturalists must show P(R | N&E) is *not* low/inscrutable.
     - **Role of Truth**:
       - **Street**: Questions whether evolution *could* select for *moral* truth-tracking.
       - **Plantinga**: Questions whether evolution *would* select for *general* truth-tracking (even in non-moral domains like basic perception).

  ### 3. **"Third Factor" Responses: Availability and Efficacy**
     - **Against Street (e.g., Enoch, Wielenberg, Copp)**:
       - **Strategy**: Identify a "third factor" (F) that explains both:
         - (a) Why certain evaluative attitudes were adaptive.
         - (b) Why those attitudes align with mind-independent truths.
       - **Examples**:
         - *Practical Rationality*: True moral beliefs promote survival (e.g., "cooperation is good" tracks truth *and* aids fitness).
         - *Enoch’s "Survival Lottery"*: Evolution selects for beliefs about *reasons*; these reasons (e.g., avoiding pain) exist independently.
       - **Plausibility**: Contested but structurally viable. Assumes non-evaluative cognition is reliable to identify F.
     - **Against Plantinga**:
       - **Naturalist Attempts**: Propose F linking truth and fitness:
         - *Cosmic Coincidence*: True beliefs (e.g., "tigers are dangerous") *just are* more adaptive than false ones in most environments.
         - *Indirect Tracking*: Evolution selects for cognitive faculties reliable *in adaptive contexts* (e.g., spatial reasoning, causal inference).
       - **Plantinga’s Rebuttal**: These responses fail because:
         1. *Massive Modularity*: Adaptive behavior may rely on cognitive modules that don’t produce *true beliefs* (e.g., beliefs could be epiphenomenal or systematically false).
         2. *No Safety Net*: Naturalism lacks a grounding for the *necessary connection* between truth and fitness. Under theism, God ensures faculties are reliable; under naturalism, it’s contingent and unexplained.
       - **Verdict**: **No robust "third factor" is available to naturalists** in Plantinga’s framework. Any F requires reliable cognition to identify, but R is in doubt. Theism provides an external guarantee (God designs reliable faculties), breaking the circle.

  ### 4. **Which Argument Poses a More Serious Problem?**
     - **Street’s Dilemma**:
       - **Strength**: Forces realists into a difficult explanatory burden. The "coincidence horn" is potent against non-naturalism.
       - **Limitation**: Only threatens *evaluative realism*. Naturalist realists (e.g., Railton) may sidestep it by reducing moral facts to natural properties. Even non-naturalists can adopt "third factor" replies without global scepticism.
       - **Overall**: A serious but *localized* challenge for metaethics.
     - **Plantinga’s Argument**:
       - **Strength**: Creates a *global defeater* under naturalism. If P(R | N&E) is low/inscrutable, naturalism self-destructs. The self-referentiality makes it uniquely destabilizing.
       - **Weakness**: Highly controversial premises:
         1. P(R | N&E) is low/inscrutable (many argue true beliefs *are* adaptive).
         2. Defeaters apply to *all* beliefs (debatable in epistemology).
       - **Overall**: A **more radical threat** if its premises hold. It targets the foundation of naturalist epistemology, not just ethics. However, its success depends on contentious probability assignments.

  ### Assessment & Why Plantinga’s Argument is More Serious
  While both arguments exploit evolution’s indifference to truth, **Plantinga’s poses a deeper problem** because:
  1. **Scope**: It undermines *all cognition*, including the science used to support evolution and naturalism. Street’s argument relies on intact scientific rationality.
  2. **Self-Undermining Structure**: Plantinga’s argument becomes a "suicide bomber" – if persuasive, it destroys the rational basis for accepting it. Street’s has no such paradox.
  3. **Resource Asymmetry**: Theism offers a clear escape (God ensures R), but naturalism lacks an equivalent grounding for cognitive reliability. Street’s realist can appeal to non-moral cognitive reliability; Plantinga’s naturalist cannot.

  **Conclusion**: Street’s dilemma is a powerful critique of moral realism, but it operates within a framework of generally reliable cognition. Plantinga’s argument attacks that very framework, making it a more fundamental challenge to naturalism. However, its reliance on speculative probabilities and the resilience of naturalist "tracking" replies (e.g., evolutionary psychology of cognition) means it remains highly contested. For your metaethics project, Street’s dilemma demands attention; for the coherence of naturalism itself, Plantinga’s argument is the more profound threat—if it stands.
