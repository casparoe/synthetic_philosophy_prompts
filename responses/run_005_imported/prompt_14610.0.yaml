answer: |-
  That's a brilliant observation, and your friend is likely **rational within a framework that accounts for human psychology** (specifically behavioral economics), even if it seems counterintuitive from a purely classical economic perspective. Here's why his stance makes sense:

  1.  **The Pain of Losses is Greater Than the Joy of Gains (Loss Aversion):**
      *   Prospect Theory (Kahneman & Tversky) shows that humans feel the pain of a loss roughly *twice as intensely* as the pleasure from an equivalent gain.
      *   Seeing a large, unrealized loss in his portfolio would inflict significant psychological pain ("Oh no, I've lost $X!"), even though it's unrealized and he has no intention of selling.
      *   This pain is real and negative, impacting his mood and well-being *that day*.

  2.  **The Information Has No Instrumental Value (For Him):**
      *   He has a strict, pre-committed strategy: buy-and-hold. The specific number *right now* doesn't change his planned action (no selling, no buying more). He gains no *actionable* information from checking.
      *   In classical economics, "free" information is always good. But here, the information isn't "free" psychologically. It has a negative utility cost.

  3.  **The Cost is Psychological Distress, Not Just Time:**
      *   While it only takes seconds to check, the *consequence* of seeing a large loss could be hours or even days of anxiety, worry, regret, or a generally worse mood.
      *   This psychological distress is the real cost he's avoiding. He's valuing his emotional well-being and peace of mind.

  4.  **Avoiding Temptation and Regret:**
      *   Even with the best intentions, seeing a dramatic loss *might* plant seeds of doubt ("Should I really hold?"). Avoiding the sight helps him stick to his plan without facing that internal struggle.
      *   Seeing the loss also makes the *regret* of not having sold earlier (even if selling was against his strategy) more salient and painful. Not seeing it allows him to avoid that specific regret feeling.

  5.  **It's a Form of Pre-Commitment:**
      *   By refusing to look, he's building a "commitment device" against his own potential future emotional weakness. He knows that *if* he saw the number, it *would* cause him distress, even if he ultimately didn't act. So he pre-commits to avoiding the trigger.

  **Why He's NOT Irrational:**

  *   **Acknowledges Human Psychology:** He understands how *he personally* reacts to seeing losses. He's not pretending to be a purely rational agent unaffected by emotions.
  *   **Consistent with Goals:** His primary goal isn't just maximizing long-term wealth (which his strategy addresses); it *also* includes minimizing unnecessary psychological distress *along the way*. Avoiding checking serves that second goal perfectly.
  *   **No Cost to Strategy:** Since the information doesn't alter his predetermined optimal action (holding), there's no strategic downside to avoiding it. He's not missing information he *needs* to act upon.
  *   **Efficiency:** He's efficiently allocating his attention and emotional resources. Why subject himself to guaranteed pain for zero strategic gain?

  **The Counterargument (Why It *Might* Seem Irrational at First):**

  *   **Classical Economics:** The strict neoclassical view says more information is always better, as it allows for more optimal decisions. Since he wouldn't act, the information should be neutral. Ignoring free information seems irrational.
  *   **Potential for Missed Opportunities (Weak Argument):** Could there be an *extreme* scenario where even a buy-and-hold investor *should* act (e.g., total market collapse implying systemic failure)? This is usually covered by his strategy's very long-term nature and diversification. Checking daily wouldn't help identify this rare event anyway.

  **The Crucial Insight You Might Be Missing:**

  **Utility isn't just about money or actions; it's about *well-being*.** Seeing the loss *reduces his well-being* on that day through psychological pain, even though it doesn't change his bank balance or his investment actions. By avoiding that negative emotional hit, he preserves his daily well-being at zero cost to his long-term financial strategy.

  **Analogy:** Imagine a medical test for a condition you have decided you won't treat (maybe due to age, risk, or personal choice). Getting the test result won't change your action (no treatment), but knowing you have the condition could cause significant anxiety and distress. Choosing *not* to take the test, therefore, preserves your peace of mind. The information, while "free" in terms of cost and not changing action, has a negative psychological utility.

  **Conclusion:**

  Your friend is **behaving rationally** within a realistic model of human decision-making that incorporates emotions and well-being. He recognizes that information can have psychological costs even when it has no instrumental value for action. He's prioritizing his emotional well-being without compromising his long-term investment strategy. His refusal to look isn't weakness; it's a sophisticated understanding of his own psychology and a commitment to protecting his peace of mind as he executes his long-term plan.
