answer: |-
  The air in Elena Rostova's workshop hung thick with the scent of turpentine and defeat. Outside, London rain slicked the cobblestones; inside, the chill was financial. Three months of rent loomed, a monstrous shadow over her meticulously organized trays of pigments and solvents. Her reputation as a restorer of pre-war European masters was impeccable, but impeccable didn't pay bills when the gallery scene froze. Then, Anton Varga walked in.

  Varga wasn't just a gallerist; he was a *tastemaker*, notoriously ruthless, obscenely wealthy, and currently holding a canvas that made Elena’s breath catch. It was a small, exquisite Soutine – a swirling, tortured landscape, vibrant even under the grime and a vicious, diagonal tear marring the lower third. A tear, Elena noted with professional detachment, that looked suspiciously deliberate. Varga placed it gently on her workbench.

  "Madame Rostova," he murmured, his voice like gravel wrapped in velvet. "A tragedy. Acquired privately. Unfortunate... accident during transport. The owner is... distressed. It requires your unique touch. Immediately."

  Elena knew the whispers. Varga dealt in the grey areas of provenance. This Soutine likely hadn't seen daylight in decades, its ownership murky. Its sudden appearance, damaged, screamed of a desperate move, perhaps pressure from the original owners' descendants. Its value, restored? Astronomical. Its value, torn? Significantly less. Varga needed it perfect, and fast, to legitimize its sudden appearance on the market.

  He named a fee. It was exactly enough to erase her debt and buy her three months of breathing room. Elena’s heart hammered. It was salvation. But then came the catch.

  "The situation is... delicate," Varga continued, his dark eyes fixed on her. "No paperwork. Discretion absolute. You restore it. I take it. You receive payment... *after* it is successfully placed with a collector. Two weeks, perhaps three."

  Elena froze. *After*. After the work was done. After the painting was gone. After she had no leverage. Varga was offering a lifeline, but only if she trusted him to toss it *after* she’d already grabbed hold. Legally? Nothing bound him. He could take the restored masterpiece, sell it for millions, and vanish. Or simply claim dissatisfaction and pay her pennies. She’d have no proof, no recourse against a man like Varga. Her narrow, immediate self-interest screamed: *Refuse! Find another job!*

  But Elena looked at the Soutine. She saw the genius beneath the damage, the history screaming to be preserved. She saw Varga’s face – not pleading, but assessing. He wasn’t just asking for her skill; he was testing her *type*. Was she the kind of person who, once the crisis was averted, would shrug and walk away? Or the kind whose professional pride and inherent sense of *debt* would compel her to demand what was owed, even when demanding it was costly, irrational, and potentially futile?

  He needed the latter. He needed someone whose reputation for integrity wasn't just a facade, but a core trait that would override expediency later. He needed someone *rationally irrational* enough to pursue a costly claim when walking away was free.

  "Discretion," Elena repeated, her voice steady despite the tremor in her hands. "And payment upon successful placement. In full. As agreed."

  A ghost of a smile touched Varga’s lips. "Naturally, Madame. Your reputation precedes you." He didn't say *as does mine*, but it hung in the air, thick as the turpentine fumes. He knew she knew the risk. Her acceptance was the signal he needed: she was the type who would hold him to it, even when it was stupid to try.

  The restoration was agony. Every painstaking hour under the magnifying lamp, every micro-application of filler and pigment, was an investment in a future payment that might never materialize. Fear gnawed at her. Rationality whispered: *He'll cheat you. He cheats everyone.* But she worked on, driven by the painting’s silent plea and the terrifying weight of her own chosen identity – the restorer who kept her word.

  Three weeks later, the Soutine glowed on her bench, the tear invisible, the colours singing. Varga collected it without ceremony, his expression unreadable. "Impressive, as always." He left. Silence descended, heavier than before.

  Days bled into weeks. Rent was now four months overdue. The landlord’s letters grew sharper. Elena drafted invoices she couldn't send, rehearsed confrontations she knew she'd lose. Rational self-interest dictated cutting her losses, finding any paying work, forgetting Varga. Yet, she found herself calling his gallery, leaving polite, increasingly strained messages. Each call felt irrational, a waste of energy, a potential provocation. But she *had* to. Because she’d *agreed*. Because her integrity, once sold to Varga as collateral, demanded she try to reclaim it.

  Finally, his assistant summoned her. Elena walked into Varga’s opulent office, steeling herself for dismissal, for threats, for humiliation. The Soutine wasn't there.

  Varga sat behind his vast desk, studying a ledger. He didn't look up. "Madame Rostova. Prompt." He slid a single envelope across the polished wood.

  Elena opened it. It wasn't just the agreed fee. It was *double*. She stared, speechless.

  Varga finally met her gaze. "The Soutine found a very appreciative home. A Russian oligarch with... particular tastes. He was immensely pleased. Your work was flawless." He paused, his gaze sharp. "The extra is for your... persistence. And your silence. It seems I was correct in my assessment of your character."

  He leaned back. "You called. Repeatedly. When silence would have been wiser. Safer. Cheaper, for you. An irrational waste of effort, no? When the painting was long gone?" A cold smile. "But precisely the waste I required. It confirmed the initial investment was sound. You are the sort who pays her debts... and demands others pay theirs. Even when it hurts. That predictability, Madame, is a valuable commodity. Perhaps we will work again."

  Elena clutched the envelope, the weight of the notes suddenly insignificant next to the weight of his words. He hadn’t paid her for the restoration. He’d paid her for being the kind of person who would irrationally demand payment *after* the restoration, proving his initial gamble on her character correct. Her later "irrational" insistence was the very thing that secured his initial rational offer. He bought her integrity today... so he could rent it again tomorrow.

  **Rationality Vindicated:** Elena's choice ultimately vindicates a **commitment-conditional or constrained maximization** view of rationality. She *rationally* adopts a disposition (integrity, honoring agreements) at Time 1 *because* possessing that disposition secures a vital benefit (the job) that wouldn't be offered to a purely self-interested agent. Crucially, this requires that at Time 2, she acts *against* her immediate self-interest (demanding payment when silent escape is free) to *uphold* that disposition. Plain "do what's best for you right now" (causal decision theory) fails because at Time 2, demanding payment *is* costly and risky with no guaranteed payoff – the rational *act* is to walk away. Only by valuing the consistency of her character *over* the immediate payoff can the initial rational choice be sustained, proving that sometimes, the rational agent must bind their future, potentially "irrational," self.
