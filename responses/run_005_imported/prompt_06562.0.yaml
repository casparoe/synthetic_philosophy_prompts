  Then, comparing this to infinitarian paralysis. That's the idea that in an infinite universe, any finite action only affects a finite number of people, so the total welfare remains infinite, unchanged. But that's more about the inability to change the total value. The order-dependence problem is deeper because it questions whether there's even a definable total to begin with. Without a well-defined total, you can't even compare different worlds or make decisions. So, it undermines the very foundation of total utilitarianism in infinite settings.

