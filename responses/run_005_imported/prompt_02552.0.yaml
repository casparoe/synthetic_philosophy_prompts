  Next, the Dunning-Kruger effect comes to mind. It's a cognitive bias where people with low ability in a task overestimate their competence. When sleep-deprived, someone might not realize their reduced capacity, leading to overconfidence. The editor feeling "normal" despite fatigue could be an example of this. I should connect this to the user's scenario to show it's a common phenomenon.

