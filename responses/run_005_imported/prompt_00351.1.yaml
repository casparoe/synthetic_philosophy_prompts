prompt: |-
  so I've read a bunch of LW posts over the years and it feels like MWI just gets treated as the obviously correct answer once you understand decoherence, and Bohmian mechanics barely gets a mention except as a punching bag. make the strongest case you can for why a good Bayesian should actually assign more credence to pilot-wave theory than the typical rationalist consensus does. don't just lean on "it's deterministic and avoids collapse," actually engage with why the standard dismissals (nonlocality being "worse" than MWI's ontology, no clean relativistic extension yet, the guiding equation feeling ad hoc) are weaker objections than people give them credit for.
reasoning: |-
  Okay, the user is asking me to make a strong Bayesian case for pilot-wave theory over the Many-Worlds Interpretation (MWI). They've noticed that in the rationalist community (like LessWrong), MWI is often treated as obviously correct once you understand decoherence, while Bohmian mechanics (pilot-wave theory) is dismissed. They want me to seriously engage with the standard objections to pilot-wave theory and show why those objections might be weaker than people think.

  First, I need to recall what pilot-wave theory is. It's a hidden variable theory where particles have definite positions at all times, guided by the wave function. The wave function evolves according to the Schrödinger equation, and particles move according to a "guiding equation." This makes it deterministic and avoids wave function collapse.

  The user mentions three main objections: nonlocality being "worse" than MWI's ontology, no clean relativistic extension yet, and the guiding equation feeling ad hoc. They want me to argue why these aren't as strong as people think.

  Starting with nonlocality: In pilot-wave theory, the wave function is nonlocal, meaning changes in one part affect distant particles instantly. But quantum mechanics is already nonlocal—Bell's theorem shows that any hidden variable theory must be nonlocal. So nonlocality isn't unique to pilot-wave; it's a feature of QM itself. MWI handles nonlocality through decoherence and branching, but it's still there in the wave function. Pilot-wave makes it explicit, which could be seen as more honest. Also, relativity isn't violated because you can't send signals faster than light; the nonlocality is hidden.

  Next, the relativistic extension issue. It's true that a full relativistic version for fermions isn't settled, but there are proposals like Dirac sea models. Progress is being made, and some versions work for bosons. Historically, theories take time to develop. MWI also has its own challenges with relativity, like defining probabilities across branches in a relativistic spacetime. So this might not be a knockout argument.

  The ad hoc guiding equation: Critics say it's added without motivation. But in pilot-wave, the guiding equation comes naturally from the Schrödinger equation. You start with the wave function, then derive particle trajectories that match quantum predictions. This is similar to how classical mechanics derives equations from Hamilton-Jacobi theory. It's not arbitrary; it's a minimal addition to make the theory deterministic. MWI, on the other hand, adds infinite universes without changing the math, but that's an ontological expansion. Pilot-wave adds particles but keeps the wave function, so it's trading one type of complexity for another.

  Bayesian perspective: The user wants a Bayesian approach. That means weighing evidence and priors. Pilot-wave has empirical equivalence—it predicts the same outcomes as standard QM. So no evidence against it yet. Ontological parsimony: MWI avoids extra equations but adds countless worlds. Pilot-wave adds particles and the guiding equation but avoids multiple worlds. Which is simpler? It depends on what you count. If you value a single world with definite positions, pilot-wave might be more intuitive. Parsimony isn't clear-cut here.

  Also, pilot-wave solves the measurement problem without collapse or many worlds. It provides a clear ontology: particles with trajectories. This could appeal to those who find MWI's ontology extravagant. The trajectories are hidden, but that's common in theories (like atoms once were). They can be computed and match observations.

  The user might be seeking a balanced view, feeling that pilot-wave is unfairly dismissed. They want a rigorous defense to challenge the groupthink. Maybe they're interested in the philosophy of physics or want to explore underrepresented ideas. Their deeper need could be understanding why certain theories gain dominance and whether alternatives are viable.

  I should structure the argument: address each objection, show counterpoints, emphasize Bayesian fairness. Conclude that pilot-wave deserves more credence than it gets, not necessarily as the best, but as a strong contender. Highlight that dismissing it based on current objections might be premature, and rationalists should keep an open mind.
answer: |-
  Here’s a rigorous Bayesian case for assigning higher credence to pilot-wave theory (de Broglie-Bohm mechanics) than the typical rationalist consensus allows, addressing the core objections head-on. The argument hinges on **empirical equivalence**, **ontological trade-offs**, and **underappreciated theoretical virtues**, while showing why common dismissals are overblown.

  ### Core Bayesian Principle: Empirical Equivalence Demands Equal Likelihoods
  - Pilot-wave theory makes **identical empirical predictions** to standard quantum mechanics (and by extension, MWI) in all experimentally tested regimes. For a Bayesian, this means the *likelihood* \( P(\text{data} | \text{pilot-wave}) \) is identical to \( P(\text{data} | \text{MWI}) \).  
  - *Therefore, any preference for MWI must stem solely from priors* \( P(\text{pilot-wave}) \) vs. \( P(\text{MWI}) \). Rationalist dismissals often conflate priors with objective flaws, but priors should be grounded in *principled theoretical trade-offs*, not aesthetic preferences.

  ### Addressing the Key Objections
  #### 1. **"Nonlocality is Worse than MWI's Ontology"**
     - **The Objection**: Pilot-wave requires instantaneous configuration-space influences, violating relativistic spirit. MWI "only" has a global wavefunction, with locality emerging via decoherence.
     - **Why It's Weaker Than Credited**:
       - **Bell’s Theorem is the Arbiter**: Bell proved *any* empirically adequate hidden-variable theory *must* be nonlocal. Pilot-wave’s nonlocality isn’t a bug—it’s a necessary feature of *any* single-world QM interpretation. MWI avoids "spooky action" *only* by denying a single world, but its wavefunction evolution is equally nonlocal (e.g., EPR correlations require global state consistency).  
       - **Nonlocality ≠ Operational FTL Signaling**: Pilot-wave’s nonlocality is *hidden*: you can’t exploit it to send signals or violate relativity causally (outcomes are screened off by the wavefunction). MWI achieves this by branching, but at the cost of infinitely many unobservable worlds.  
       - **Ontological Honesty**: Pilot-wave explicitly *acknowledges* nonlocality in its dynamics. MWI *hides* it in the wavefunction’s global structure and the ill-defined "emergence" of local branches. For a Bayesian favoring *ontological transparency*, this is a virtue.  
       - **Relativistic Compatibility**: Nonlocality doesn’t preclude relativistic formulations. Bohmian QFT exists for bosonic fields, and recent work (e.g., Durr et al.’s "Bohmian mechanics for Dirac particles") extends to fermions. It’s unproven, but so is MWI’s claim to seamlessly integrate gravity.

  #### 2. **"No Clean Relativistic Extension"**
     - **The Objection**: Pilot-wave lacks a universally accepted, covariant formulation for all quantum fields, while MWI "trivially" inherits QFT’s relativistic structure.
     - **Why It's Weaker Than Credited**:
       - **Progress Exists**: Relativistic Bohmian models *do* work for photons, scalar fields, and (with caveats) fermions. The Dirac sea picture (with particles filling the vacuum) handles many QFT predictions. The difficulty is technical, not principled—unlike (e.g.) local hidden variables, which Bell ruled out.  
       - **MWI Has Its Own Relativistic Problems**: Defining "worlds" in a relativistic context is thorny. How do branches split in spacetime? What counts as a "measurement" without a preferred foliation? MWI handwaves this via decoherence, but decoherence itself relies on a pre-existing tensor-product structure (which may not be fundamental in quantum gravity).  
       - **Bayesian Perspective**: If two theories are empirically indistinguishable *now*, penalizing one for unresolved *extensions* is only justified if the extension seems intractable. Pilot-wave’s progress in QFT suggests tractability. Assigning a low prior here is an *unfounded bias* if MWI’s unsolved problems (e.g., probability in curved spacetime) get a pass.

  #### 3. **"The Guiding Equation is Ad Hoc"**
     - **The Objection**: The velocity rule \( \dot{\mathbf{q}}_k = \frac{\hbar}{m_k} \Im \left( \frac{\nabla_k \psi}{\psi} \right) \) looks bolted onto Schrödinger’s equation, unlike MWI’s "pure" unitary evolution.
     - **Why It's Weaker Than Credited**:
       - **It’s the Minimal Addition for Determinism**: Pilot-wave adds *one* equation to recover particles with definite trajectories. Contrast this with MWI, which adds *infinitely many branching universes*. From a *Newtonian* worldview (which Bayesians might inherit as a prior), particles are more intuitive than proliferating worlds.  
       - **Structural Naturalness**: The guiding equation isn’t arbitrary—it’s *derivable* from requiring equivariance (if \( \rho = |\psi|^2 \) at \( t_0 \), it stays that way). It’s the *simplest deterministic completion* of QM that preserves Born statistics. MWI also needs additional structure (decoherence, decision theory) to *recover* the appearance of probability.  
       - **Precedent in Classical Physics**: Hamilton-Jacobi theory has analogous dynamics: \( \dot{\mathbf{q}} = \nabla S \), where \( S \) is the action. Pilot-wave generalizes this to \( \psi = Re^{iS/\hbar} \), making it a natural quantum extension of deterministic mechanics. MWI, by contrast, replaces trajectory-based mechanics with a multiverse.

  ### Why a Bayesian Should Assign Higher Credence
  - **Parsimony Trade-off**: MWI is ontologically extravagant (∞ worlds); pilot-wave is dynamically extravagant (nonlocal guiding equation). But *empirical equivalence* forces a subjective choice. If your prior favors **fewer universes** over **fewer equations**, pilot-wave wins. Rationalists often invert this, but that’s preference, not logic.  
  - **Resolves Quantum Paradoxes at Lower Cost**: Pilot-wave solves measurement (via particle positions), nonlocality (explicitly), and probability (Born rule from equivariance) *without* many worlds. MWI solves measurement with vast ontological bloat. For a Bayesian, pilot-wave’s *focused* additions may yield higher \( P(\text{theory}) \) if your prior penalizes multiverses.  
  - **Underappreciated Virtues**:  
    - **Determinism without Illusions**: Pilot-wave is *truly* deterministic (unlike MWI, where randomness is "subjective" but inevitable).  
    - **Trajectories Explain Quantum Phenomena**: Double-slit trajectories, quantum tunneling times, and spin measurements become intuitive. MWI offers no comparable micro-dynamics.  
    - **Falsifiability**: Pilot-wave could be falsified if quantum nonequilibrium (\( \rho \neq |\psi|^2 \)) is found. MWI is empirically inert—every outcome happens somewhere.

  ### Conclusion: A Call for Bayesian Fairness
  The rationalist consensus overweights MWI’s *aesthetic* virtues ("pure unitary evolution") while underweighting pilot-wave’s *explanatory* virtues (clear ontology, deterministic trajectories). Objections to pilot-wave are either **shared with MWI** (nonlocality), **technical but surmountable** (relativity), or **reflect subjective priors** (guiding equation). A good Bayesian should:  
  1. Assign equal likelihoods \( P(\text{data} | \text{theory}) \) due to empirical equivalence.  
  2. Set priors based on *cost of assumptions*, not popularity. Pilot-wave’s cost (nonlocal dynamics) may be less than MWI’s (∞ worlds) if your prior favors concrete realities.  
  3. **Conclusion**: Pilot-wave deserves ≥30% credence—not as the "winner," but as a robust contender unjustly dismissed by groupthink. Rejecting it requires conceding that *infinitely many unobservable worlds* are more plausible than *one nonlocal equation*—a dubious Bayesian move.
