  I should consider why this distinction matters. In classical game theory, rational players defect in the Prisoner's Dilemma because it's the dominant strategy. But here, cooperation emerges from the agents' inability to choose otherwise once their codes are mutual. It's not that they decide to cooperate after evaluating outcomes; their programming forces cooperation if certain conditions are met. This removes the element of choice that's central to game theory.

