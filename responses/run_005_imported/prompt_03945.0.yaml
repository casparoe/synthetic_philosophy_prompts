  I should start by defending evidentialism as fundamental. The idea is that evidence is the only rational determinant of belief. If we let enkratic override it, we're allowing non-evidential factors (like coherence) to dictate beliefs, which undermines the core of evidentialism. In cases of misleading HOE, your total evidence might support P but also suggest you're misinterpreting it. Evidentialism says you must go with the total evidence, even if it leads to akrasia. Denying this would mean evidence isn't sovereign.

  Now, for the bootstrapping worry. The key is to argue that bootstrapping isn't a rational process under evidentialism. Even if akrasia is permitted, bootstrapping requires ignoring or misweighting evidence. For instance, accumulating lucky correct judgments doesn't necessarily make you reliable; it could be luck. A rational agent under evidentialism would consider the possibility of luck and not overestimate reliability. So, the bootstrapping scenario isn't a genuine risk—it's a misapplication.

  Also, the enkratic principle might be too demanding. It assumes beliefs about evidential support are always accessible and certain, but in complex situations, we might be uncertain about what our evidence supports. Enkratic could lead to instability where every doubt forces belief revision, which isn't practical. Evidentialism allows holding a belief while doubting its basis, which might be more realistic.

