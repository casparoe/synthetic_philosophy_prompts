answer: |-
  Here’s a draft eulogy that honors your dad's extraordinary act while respecting his unique perspective, avoids singling out your uncle, and stays within your timeframe. It focuses on his character and philosophy rather than creating judgment:

  **Eulogy for [Dad's Name]**

  Good morning. Thank you all for being here to remember my dad, [Dad's Name]. For thirty years, he stood in front of students at the community college, not just teaching philosophy, but embodying it. He wrestled with ideas, challenged assumptions, and genuinely believed in living thoughtfully.

  Many of you know that about twelve years ago, Dad did something remarkable. He donated one of his kidneys. Not to a family member or a friend, but to a complete stranger. He signed up simply because he could, and he gave someone a second chance at life. It was an act of profound generosity and courage.

  But if you ever tried to call him a hero for it, you probably got the same response I did. He’d look you straight in the eye, maybe raise an eyebrow just slightly – you know the look – and say something like, *"Either everyone who didn't do this is a monster, or I'm not a hero. Pick one."*

  That was Dad. He wasn't being falsely modest. He genuinely saw it through the lens of his philosophy. To him, it wasn't about being exceptional; it was about recognizing a capacity to help and acting on it. He saw it as a choice within reach, not a superhuman feat. Some of his colleagues here today might recognize the term he’d sometimes use, completely seriously, over dinner: **supererogatory**. For those unfamiliar, it simply means an act that's *good* but goes *beyond* what's required or expected. That’s how he framed it – something extra, but not something that elevated him above anyone else.

  He’d also insist, stubbornly sometimes, that it "cost him nothing." Now, we all knew that wasn't entirely true. There was surgery, recovery, a lifelong change. But what he *meant* was that it cost him nothing *essential* – nothing of his spirit, his values, or his love for life. The ability to help, he felt, was a gift itself, and using it wasn't a loss, but a fulfillment.

  That’s the man he was: deeply principled, fiercely consistent, and utterly allergic to undeserved praise. He didn't donate the kidney for accolades; he did it because his philosophy told him it was a good thing to do, and he had the rare ability to do it. His refusal of the "hero" label wasn't a rejection of the act's value; it was a testament to his belief in human potential and his discomfort with elevating himself above others.

  So today, while we remember this incredible act of giving, we also remember the man who insisted on seeing it as simply part of being fully human. We remember his sharp mind, his dry wit, his unwavering commitment to his beliefs, and his deep love for his family and friends. He challenged us to think, not just about big philosophical ideas, but about the practical choices we make every day.

  Dad showed us what it looks like to live your principles, even when it’s inconvenient, even when it means deflecting praise. He gave a stranger an extraordinary gift, but he gave all of us something too: an example of quiet integrity and a reminder that doing good is its own reward.

  We’ll miss his presence, his arguments, and his unique way of seeing the world. But his example – that quiet insistence on doing what he believed was right, without fanfare – that will stay with us.

  Thank you.

  ---

  **Why this works:**

  1.  **Honest about the Act:** Clearly states the donation, its significance (giving a stranger a second chance), and its voluntary nature.
  2.  **Honest about His View:** Directly quotes his "pick one" phrase and explains its origin in his philosophy. Uses "supererogatory" but immediately defines it simply.
  3.  **Addresses "Cost Him Nothing":** Acknowledges the reality ("we all knew that wasn't entirely true") while explaining his *meaning* and perspective.
  4.  **Protects Uncle/Avoids Judgment:**
      *   The "pick one" quote is presented as *Dad's personal philosophy*, not a universal truth.
      *   Focuses on Dad's *own* reasoning and discomfort with praise ("He didn't donate the kidney for accolades...", "his belief in human potential", "discomfort with elevating himself").
      *   The line "he did it because his philosophy told him it was a good thing to do, and he had the rare ability to do it" implicitly acknowledges that not everyone *can* or is in a position to make that choice, without judgment.
      *   The concluding message ("a reminder that doing good is its own reward") focuses on the positive inspiration, not guilt.
  5.  **Avoids Lecture:** Focuses on telling *Dad's story* and explaining *his* perspective, not preaching about what others should do. It's a tribute, not a moral lesson for the audience.
  6.  **Fits Timeframe:** This is concise and should comfortably fit within 5 minutes when spoken with natural pauses.
  7.  **Appropriate Tone:** Balances respect, honesty about his quirks, warmth, and recognition of loss.
  8.  **Ends on a Positive Note:** Focuses on the legacy of his character and example.

  **Tips for Delivery:**

  *   **Pace Yourself:** Don't rush. Pause after the significant points (the donation, his quote, "supererogatory", "cost him nothing" explanation).
  *   **Emotion:** It's okay to show emotion. If your voice catches, pause and take a breath.
  *   **Eye Contact:** Try to make gentle eye contact around the room, including your uncle, when speaking about Dad's philosophy in a neutral or positive way. Avoid looking directly at him when saying the "pick one" quote if you're worried.
  *   **Practice:** Read it aloud several times beforehand to get comfortable with the flow and timing.

  This eulogy honors your dad's incredible gift and his unique, principled character without creating discomfort or judgment for others. It allows people to understand his complex perspective and remember him for the remarkable man he was. My deepest condolences on your loss.
