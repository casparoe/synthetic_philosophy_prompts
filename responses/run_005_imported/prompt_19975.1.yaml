prompt: |-
  so we've been going through al-ghazali's discussion of causality in the Tahafut for my islamic phil class (you know, the fire doesn't actually burn the cotton, God does) and my professor mentioned in passing that people often compare this to hume on causation. i get why on the surface - both deny some kind of necessary connection between cause and effect - but that comparison feels too quick to me. can you explain what's actually different, at a deeper level, between ghazali's occasionalism and hume's account of causation? like is ghazali basically just a theological hume, or are they making fundamentally different kinds of claims (epistemic/skeptical vs. metaphysical) about necessity? would also help if you could fold in how the 'custom' (al-'ada) idea and his account of miracles as a suspension of that custom fits into it.
