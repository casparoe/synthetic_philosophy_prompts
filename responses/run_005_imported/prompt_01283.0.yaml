answer: |-
  This is a sharp and important angle—definitely not "too cute," and it holds up as a *plausible and provocative interpretation* worth developing, though it needs careful framing to avoid overreach. Here’s a breakdown of strengths, caveats, counterexamples, and refinements:

  ### Strengths of Your Argument
  1.  **Structural Homology:** The parallel you draw between Frege's philosophical insistence on a **single, objective, non-negotiable logical order** (immune to subjective whim) and his political desire for a **single, objective, non-negotiable social order** (immune to democracy, pluralism, or "foreign" influence) is compelling. The disdain for compromise ("leveling") is a key bridge.
  2.  **Anti-Psychologism as Anti-Subjectivism:** Extending his rejection of psychologism (logic isn't about *how minds work*) to politics (the state shouldn't reflect *individual wills or majority opinion*) is insightful. His Platonism elevates abstraction and purity; his politics seeks racial/cultural "purity" and rigid hierarchy.
  3.  **Temperamental Consistency:** Framing it as a "hunger for one uniquely correct order" captures a deep-seated intellectual *and* emotional disposition. Frege's writing, even in logic, radiates certainty and intolerance for error or ambiguity. The diary shows this same rigidity applied to society.
  4.  **Beyond "Separate Art/Artist":** You rightly push past the simplistic firewall. For Frege, the *method* and *foundational commitments* of his logic (objectivity, anti-subjectivism, system) arguably share a *structural kinship* with his authoritarian worldview. It's not just "bad man, good ideas."

  ### Caveats & Refinements
  1.  **Not *Necessary* Causation:** Avoid implying his Platonism *caused* his antisemitism or vice-versa. The link is more likely one of **shared temperamental disposition** or **structural homology** (similar patterns of thought applied to different domains). Say: "expressions of," "resonate with," "reflect a common disposition towards," rather than "cause" or "logically entail."
  2.  **Counterexamples Exist (Weakening Universal Claims):**
      *   **Rigid Formalist/Platonist ≠ Authoritarian:** Kurt Gödel (deep Platonist, obsessed with rigor and certainty) held complex political views but wasn't notably authoritarian/antisemitic. Bertrand Russell (dedicated to formal logic early on) was a committed anti-imperialist and pacifist (though complex and flawed). Rudolf Carnap (logical positivist, focused on structure/system) was a socialist.
      *   **Authoritarian ≠ Rigorously Systematic:** Many authoritarian figures (e.g., certain fascist intellectuals) were explicitly *anti-rationalist* or embraced myth, intuition, and voluntarism (e.g., aspects of Heidegger, Carl Schmitt's decisionism, Nazi "thinking with the blood"). Frege's *specific brand* of authoritarianism aligns with his philosophical rigidity, but not all do.
  3.  **Specificity to Frege:** Your argument is strongest when framed as **"This link seems particularly salient *in Frege's case*"** rather than a universal rule. Emphasize the *intensity* and *character* of both his philosophical commitments and his political hatreds. His Platonism wasn't just academic; it was almost fanatical in its rejection of alternatives. So was his politics.
  4.  **Dummett's Position:** You aren't strawmanning Dummett. His shock is well-documented, and his core position *was* the firewall: the validity of `∀x(Fx → Gx)` is independent of Frege's racism. However, Dummett *did* grapple with the psychological impact and the challenge to seeing Frege as a "hero." Your argument goes further by suggesting a deeper *intellectual* connection Dummett may not have fully explored (or wanted to). Dummett might counter that the *content* of logic is truly universal and neutral, even if Frege's *temperament* drove both his philosophy and his vile politics. Be prepared for that rebuttal.
  5.  **The "Third Realm" Nuance:** While the Third Realm is mind-independent, Frege *also* believed thoughts needed to be *grasped* by minds. The *access* isn't subjective, but the *act* involves a thinker. His politics denies the capacity for certain minds (Jewish ones) to properly grasp or belong to the German *Volk* or state. There's a tension here worth noting: the universal accessibility of thoughts vs. the exclusionary nature of his politics. Does this contradict, or is the "Third Realm" implicitly conceived as a "German" space? (A provocative question!).

  ### Strengthening the Argument
  1.  **Use Frege's Own Political Language:** Point to diary passages where he rails against "leveling," "compromise," "foreign influence," "impurity," "democracy as mob rule," or the need for a "strong hand." Explicitly link these concepts to his philosophical disdain for subjectivism, psychologism, and fuzzy thinking.
  2.  **Contextualize the "Hunger for Order":** Place this within the post-WWI German context – the chaos of Weimar, the longing for stability and lost greatness. Frege's Platonism offered an eternal, unchanging realm; his politics offered a fantasy of restored, pure, hierarchical order. Both were escapes from perceived chaos.
  3.  **Address the "Why Logic?" Question:** If the temperament drives both, why did he channel it into *logic*? Argue that logic represented the *purest possible manifestation* of this desire for absolute, unassailable order – a realm where he *could* seemingly achieve it, unlike the messy political world he despised.
  4.  **Concede Limits:** Acknowledge that many thinkers share aspects of his philosophical rigidity without descending into his brand of bigotry. The link is *suggestive* and *plausible* in Frege's specific case, not deterministic.

  ### Conclusion
  Your hunch is **strong and defensible**. It moves beyond the standard (and often necessary but insufficient) firewall argument to probe a deeper intellectual coherence in Frege's worldview. It's not "reaching" if you frame it carefully:
  *   Focus on **structural parallels** and **temperamental disposition**.
  *   Ground it in **Frege's specific words** (both logical and political).
  *   **Concede counterexamples** exist but argue they don't negate the *specific* resonance in *this* case.
  *   **Avoid over-claiming causation**; emphasize "expression of," "resonance with," "reflecting a common disposition."
  *   **Refine the "Third Realm" connection** slightly.

  This approach makes your talk far more interesting than a simple rehash of the diary's ugliness or the standard separation thesis. It offers a genuine challenge: **Can we truly compartmentalize a mind that sought absolute, non-negotiable order in *every* domain it considered?** That's a powerful question. Good luck with the talk!
