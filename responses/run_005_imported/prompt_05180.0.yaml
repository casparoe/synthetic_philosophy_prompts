answer: |-
  The damp stone of the Scriptorium seeped cold into Brother Elian's knees, but the chill in his heart came from the vellum before him. Not scripture, but a smuggled report: villages along the Alder River emptied, men conscripted into King Borin’s new "labor battalions," whispers of mass graves in the Whispering Woods. Borin, who’d ascended peacefully after old King Edric’s death five years prior, crowned with the full blessing of the Council of Peers. Legitimate. Then the taxes began. Then the disappearances.

  Elian traced the worn words of the *Summa Theologiae* open beside him. Not the comforting platitudes about resisting evil, but the dense, precise Question 42, Article 2: *Whether it is lawful to kill a tyrant?*

  "*Distinguo,*" Elian murmured, the scholar’s habit grounding him. *I distinguish.*

  He remembered Brother Anselm, fiery and beloved, three years dead now. Anselm had faced a different monster: Lord Kaelen. Kaelen hadn't inherited; he’d butchered Edric’s young heir and his regent, seized the Falcon Throne with hired swords, dissolving the Council. A *usurper*. Aquinas was clear on that: "*He who usurps power by violence does not become a true ruler… it is not sedition to deliver the multitude from such a one, but rather it is praiseworthy.*" Anselm hadn't hesitated. He’d rallied the dispossessed peers, the loyal city guard – fragments of the *public authority* – and they’d cornered Kaelen in the very throne room he’d stained. Elian had watched, young and terrified, as justice, bloody but sanctioned, was done. The realm breathed again.

  Borin was different. Legitimate ascent. Lawful coronation. Now, he was undeniably a tyrant, grinding the people under his heel. Aquinas acknowledged this horror: "*If to provide for the common good belongs to the rulers, then to neglect the good of the multitude and seek private good is tyrannical.*" But the remedy? Elian’s finger found the crucial passage: "*Unless perhaps when the tyranny is so great that the multitude cannot await a remedy from higher authority.*" And the chilling caveat: "*Yet it must be noted that it belongs not to a private person to kill a tyrant, for this is to expose oneself to danger… and the multitude might suffer greater harm from the ensuing disturbance.*"

  Public authority. The distinction burned. Against Kaelen, the *usurper*, fragments of that authority (the peers, the guard) *were* the remedy. Against Borin, the *legitimate-turned-tyrant*, where was public authority now? Borin *was* the authority. The Council of Peers existed only as a rubber stamp, its members cowed or vanished.

  "Brooding again, Elian?" The voice was a rasp, cutting through the incense. Tomas, once a master armorer, now gaunt and haunted, emerged from the shadows. His eyes held the desperate fervor Elian feared. "Word from the woods. The labor battalion near Oakhaven… they’re not building roads. They’re digging their own pits. Sick ones tossed in alive." Tomas slammed a calloused fist on the lectern. "How much more 'distinction' must we parse while children starve and men are buried?"

  Elian flinched. "Tomas, I grieve with you. But acting rashly–"

  "Rashly? Anselm didn't parse! He *acted*! Kaelen fell!" Tomas leaned in, breath hot. "Aquinas blesses removing a tyrant! You said so yourself!"

  "*Distinguo*, Tomas!" Elian snapped, the scholar’s precision sharpening his voice. He tapped the vellum. "Kaelen was a *usurper*. No legitimacy. Removing him *restored* rightful order. Borin… Borin *is* the rightful order, perverted. Aquinas warns *private persons* against striking him down. It risks chaos worse than the tyranny! He says the *tyrant* is the true seditionist, yes, tearing the bonds of fellowship… but the remedy must be *public*, lest we become him!"

  "Public?" Tomas scoffed, gesturing wildly at the monastery walls, symbol of a realm cowed. "What public? The Council is Borin's lapdog! The army is his fist! Waiting for 'public authority' is waiting for death! Aquinas says if the harm is too great to wait…"

  "He says 'unless the tyranny is so great'," Elian countered, his own heart pounding with the tension between doctrine and despair, "and 'it belongs not to a private person'. Tomas, listen! If you strike alone, or with just a handful, what happens? Borin dies. Then what? His loyalists cry murder. His commanders fight for power or vengeance. The realm fractures. More die. Innocents drown in the chaos *we* unleashed without the mandate to rebuild. Aquinas argues the tyrant stirs discord; our reckless action might unleash a whirlwind far worse!"

  Tomas stared, his face a mask of contemptuous pity. "You hide behind words, Brother. While you 'distinguish', people *die*. Anselm understood justice requires courage, not just footnotes." He turned, a grim resolve settling on him. "There are others. Men who remember courage. We won't wait for ghosts of authority." He melted back into the shadows.

  Elian sank onto the cold stone floor, the *Summa* heavy in his lap. Had he become a coward, cloaking paralysis in philosophy? Or was he the only one seeing the precipice? Aquinas’s distinctions weren't academic; they were a map through a moral minefield. Kaelen’s path was clear. Borin’s was shrouded in the peril of unintended consequences. *Public authority… where are you?*

  Two nights later, the news tore through the monastery like a winter gale. Tomas. Caught. Not in some grand assault, but skulking near the palace kitchens, poison vials hidden in a loaf of bread meant for the King’s table. A private act. A desperate gamble.

  He died horribly, publicly, in the main square at dawn. Borin, seizing the moment, didn't just execute a would-be assassin; he unmasked a "vast conspiracy of traitors and heretics." Tomas’s desperate, lonely act became the tyrant’s justification. The dragnets widened. More villages burned. More disappeared into the woods. The very chaos Elian feared bloomed like a poisonous flower, watered by Tomas's blood and Borin's opportunism.

  Elian stood at the edge of the chanting monks, watching the crows circle the gallows. Tomas’s body swung, a grotesque pendulum marking the cost of getting Aquinas wrong. Tomas had seen only "tyrant," not the crucial distinction of origin and remedy. He’d acted as a private person against a ruler who, however vile, still held the cloak of legitimacy in the eyes of many, especially those with power. His solitary act hadn't sparked liberation; it had handed Borin the whip to scourge the realm further. *The tyrant himself is the one guilty of sedition,* Aquinas wrote, *but the one who kills him without authority may only deepen the wound.*

  The chill in Elian’s heart crystallized into a hard, clear resolve. Waiting for a phantom "public authority" was surrender. But private vengeance was suicide for the common good. Tomas had paid the price for that confusion.

  Elian didn't return to the Scriptorium. He sought out Brother Cedd, the aged keeper of the monastery’s charters. "The records," Elian said, his voice stripped of doubt. "The original oaths sworn by the Council of Peers to King Edric. The clauses on tyranny. The procedures for… reassessment… by the Estates, should the monarch betray the common good."

  Cedd’s rheumy eyes sharpened. "Ancient law, Brother. Dusty parchment. Borin dissolved the Estates."

  "Parchment can be copied," Elian said. "Whispers can travel. Peers may yet remember their oaths, not just their fear." He wasn't Tomas. He wouldn't act alone. He would find the *seeds* of public authority – the dormant laws, the silenced voices, the latent power bound by ancient oaths that predated Borin’s corruption. He would remind them that Borin, by his actions, had severed his own claim to legitimacy, making him, in the eyes of the *true* public trust, no better than a usurper. He would work not to assassinate, but to *convoke*. To rebuild the fractured mandate Aquinas insisted was necessary.

  The path was longer, harder, fraught with peril. But it was the only path Aquinas offered against a Borin. Elian picked up the quill, not to annotate the *Summa*, but to copy forbidden charters. The distinctions had cost Tomas everything. Now, understanding them perfectly, Elian began the patient, dangerous work of building the bridge Aquinas demanded – the bridge from tyranny back to law, stone by heavy stone. The true resistance, he knew, began not with poison, but with parchment and the patient, perilous resurrection of public will.
