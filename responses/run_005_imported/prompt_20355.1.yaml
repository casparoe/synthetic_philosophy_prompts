  For decision theory robustness... superrationality works cleanly in its narrow use case but falls apart elsewhere. Acausal trade is more flexible but leans heavily on speculative metaphysics. The user seems skeptical of the multiverse baggage - rightly so, as it makes the theory untestable. Still, as a conceptual tool for coordination problems, it has interesting implications.

