  **Memo: On-Call Automation Update Behavior Review**

  **Date:** [Current Date]
  **To:** Incident-Response Tooling Review Board
  **From:** [Your Name]

  **Subject:** Recommendation on Bot Probability Update Behavior and Rollout Plan

  **Background:**
  During a recent incident, our on-call automation bot processed a signal that stated: "if the fault is in the US cluster, it is about three times as likely to be the gateway service as the auth service." The bot updated the probability distribution over the four subsystems (US-gateway, US-auth, EU-gateway, EU-auth) using the principle of minimum KL divergence, resulting in a distribution of approximately [35%, 12%, 26.5%, 26.5%]. This update reduced the total probability for the US cluster from 50% to 47% and increased the EU cluster to 53%. Two engineers have raised concerns:

  1. Engineer A argues this is a bug: the update should only redistribute probabilities within the US cluster, leaving the EU cluster's total share at 50%.
  2. Engineer B argues that Engineer A's proposed patch is arbitrary because it specifically protects the "cluster" split and an alternative patch protecting the "gateway vs auth" split would yield a different result, with no justification for one over the other.

  This memo recommends retaining the current update behavior, provides a rollout plan, and addresses the strongest points from both sides.

  **Recommendation:**
  After thorough analysis, we recommend **retaining the current update behavior** (i.e., no patch). The current method minimizes KL divergence under the given constraint without introducing arbitrary additional constraints. This approach is mathematically rigorous and aligns with standard practices in Bayesian probability and information theory.

  The constraint provided by the signal (P(US-gateway | US) / P(US-auth | US) = 3) implies a linear relationship between the probabilities of US-gateway and US-auth (p1 = 3p2). The bot solves for the distribution closest to the prior (uniform) that satisfies this constraint. This results in a shift of probability mass from the US cluster to the EU cluster because:
  - The constraint forces a reduction in p2 (US-auth) that is larger than the increase in p1 (US-gateway) relative to the prior.
  - The KL divergence minimization redistributes the "excess" probability mass to the EU events (which are symmetric and unconstrained) to maintain global normalization and minimize deviation from the prior.

  Engineer A's proposal to fix the US/EU cluster totals at 50% introduces an artificial constraint not present in the signal. Engineer B correctly notes that this is arbitrary; protecting other splits (e.g., gateway/auth) would yield different results. The current method avoids such arbitrariness by updating only what the signal requires.

  **Rollout Plan:**
  - Proceed with the planned rollout on **Thursday, [Date]**.
  - No changes to the update logic are required.
  - Document this decision and the reasoning in our internal knowledge base to preempt future questions.
  - Schedule a brief team meeting to explain the rationale and address any concerns.

  **Addressing Strongest Counterarguments:**
  - **Engineer A's strongest point:** The signal pertains only to the US cluster, so it should not alter the EU cluster's probability. This is intuitive: if new information only affects a subset of events, the rest should remain unchanged. However, this intuition holds only if the signal explicitly preserves the marginal probability of the US cluster, which it does not. The current method adheres strictly to the information provided by the signal and avoids over-constraining the system.
    
  - **Engineer B's strongest point:** Arbitrarily fixing the cluster split is unjustified. We agree. However, we note that the current method (minimizing KL divergence) is not arbitrary—it is a principled approach that generalizes to any constraint. While Engineer B's argument highlights the flaw in Engineer A's proposal, it does not undermine the current method.

  **Conclusion:**
  The current update behavior is theoretically sound and should be retained. Proceeding with Thursday's rollout ensures we maintain a rigorous, consistent approach to probability updates. We will document this decision and educate the team on the underlying principles to prevent future misunderstandings.

