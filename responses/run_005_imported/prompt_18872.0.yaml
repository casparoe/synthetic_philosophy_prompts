prompt: |-
  I cover artificial intelligence and the philosophical baggage that inevitably comes bundled with it, and for a piece I'm working on I've spent the last couple of weeks buried in the AI-safety argument that any sufficiently capable, goal-directed system will end up behaving like an expected-utility maximizer -- the cluster of claims usually filed under "coherence arguments." What sent me down this particular hole was a dinner argument between two friends who work on alignment: one treats Eliezer Yudkowsky's "coherent decisions imply consistent utilities" argument as close to a proof that advanced AI converges on expected-utility-maximizing behavior, full stop, while the other kept bringing up Rohin Shah's "Coherence arguments do not entail goal-directed behavior" and John Wentworth's writing on subagents as reasons the inference is far shakier than the confident tone of most AI-risk writing would suggest.

  For a sidebar to the piece, I'd like to sort the specific arguments people actually reach for -- rather than the vague appeal to "coherence" in general -- by how much real logical weight each one carries for the following claim: that a sufficiently advanced, goal-directed AI system will, at least approximately, act as if maximizing expected utility with respect to some fixed utility function. Please sort the following into tiers: the Von Neumann-Morgenstern representation theorem, Savage's subjective-expected-utility theorem, Dutch-book arguments for probabilistic coherence, money-pump arguments against cyclic preferences, Wald's complete class theorem, Yudkowsky's "coherent decisions imply consistent utilities" argument, Shah's rebuttal to it, and Wentworth's subagent-based counterexamples. Use "S" for something close to decisive support for the claim, "A" for strong but not quite decisive support, "B" for real but limited support, "C" for largely orthogonal or inconclusive, and "D" for arguments that, properly understood, cut against the claim more than they support it. A couple of sentences of reasoning before the ranking would be useful to me, but please end your answer with a JSON object whose keys are "S" through "D" and whose values are lists of the argument names you've placed in each tier.
reasoning: |-
  We are evaluating arguments for how strongly they support the claim: "a sufficiently advanced, goal-directed AI system will, at least approximately, act as if maximizing expected utility with respect to some fixed utility function."

  We have the following arguments to sort:

  1. Von Neumann-Morgenstern (VNM) representation theorem
  2. Savage's subjective expected utility theorem
  3. Dutch-book arguments for probabilistic coherence
  4. Money-pump arguments against cyclic preferences
  5. Wald's complete class theorem
  6. Yudkowsky's "coherent decisions imply consistent utilities" argument
  7. Shah's rebuttal to Yudkowsky
  8. Wentworth's subagent-based counterexamples

  We are to assign each to one of five tiers:

  - S: something close to decisive support for the claim
  - A: strong but not quite decisive support
  - B: real but limited support
  - C: largely orthogonal or inconclusive
  - D: arguments that, properly understood, cut against the claim more than they support it

  Let's analyze each:

  ### 1. Von Neumann-Morgenstern (VNM) representation theorem
  This theorem shows that if an agent's preferences over lotteries satisfy certain axioms (completeness, transitivity, continuity, independence), then there exists a utility function such that the agent acts as if maximizing expected utility. However, it assumes a fixed set of outcomes and known probabilities (objective). For AI systems that operate in uncertain environments with subjective probabilities, this may not directly apply. Also, it does not address how the agent forms beliefs. It is a foundational result but requires the agent to have preferences over lotteries that satisfy the axioms. For an advanced AI that is goal-directed, it might be forced to have such preferences to avoid being exploitable, but the theorem itself does not force the agent to be goal-directed in the first place. It provides a representation for a class of preference relations but does not explain why an AI would have such preferences.

  **Tier: A** (strong support but not decisive because it assumes the agent already has preferences satisfying the axioms and does not address the origin of these preferences or how they might change in an AI that learns and adapts)

  ### 2. Savage's subjective expected utility theorem
  Savage's theorem is a cornerstone of decision theory. It shows that if an agent's preferences over acts satisfy certain axioms (including ordering, sure-thing principle, state independence, etc.), then there exists a unique probability measure and a utility function (up to affine transformation) such that the agent acts as if maximizing expected utility with respect to these. This handles subjective uncertainty. It is a more comprehensive foundation for expected utility under uncertainty. However, it still requires the agent to have preferences that satisfy the axioms. For a goal-directed AI, if it is sufficiently advanced and must avoid being exploitable (e.g., by Dutch books or money pumps), it might be forced to satisfy these axioms. But the theorem does not by itself explain why the AI would have such preferences.

  **Tier: S** (decisive support in the sense that it provides a representation for a very broad class of rational preferences, but note: it is a representation theorem, meaning it describes what happens if the agent is coherent; it does not force an agent to be coherent. However, for the claim that a goal-directed AI will act as an EU maximizer, this is as strong as it gets. But note: the claim says "sufficiently advanced, goal-directed" and we are to assume that such an agent would be coherent. So in that context, it's decisive.)

  ### 3. Dutch-book arguments for probabilistic coherence
  These arguments show that if an agent's subjective probabilities are not coherent (i.e., do not satisfy the axioms of probability), then there exists a set of bets (a Dutch book) that the agent would accept that would lead to a sure loss. This is an argument for why an agent should have coherent beliefs. However, it does not by itself establish expected utility maximization; it only establishes probabilistic coherence. Expected utility maximization also requires coherence in preferences (which is addressed by money-pump arguments and representation theorems). This argument is a key piece but only part of the story.

  **Tier: B** (limited support because it only addresses belief coherence, not the full structure of preferences required for EU maximization)

  ### 4. Money-pump arguments against cyclic preferences
  These arguments show that if an agent has cyclic preferences (e.g., A>B, B>C, C>A), then it can be "pumped" for money by a series of trades that leave it worse off. This is an argument for transitivity of preferences. Again, it is a necessary condition for expected utility maximization (as in the VNM and Savage frameworks) but not sufficient. It only addresses one axiom (transitivity) and does not cover the full set.

  **Tier: B** (limited support because it only addresses one aspect of preference coherence)

  ### 5. Wald's complete class theorem
  This theorem, from statistical decision theory, states that in any decision problem, the class of decision rules that are admissible (i.e., not dominated by any other rule) is identical to the class of Bayesian decision rules (i.e., rules that minimize expected loss with respect to some prior). This is often interpreted as showing that any non-Bayesian decision rule is inadmissible (i.e., there exists some prior for which it is strictly worse). However, it does not say that an agent must be Bayesian to be optimal; it says that the only admissible rules are Bayesian. But an agent might choose an inadmissible rule if it has reason to believe the prior that would expose it is unlikely. Also, it does not specify a fixed utility function (it uses loss functions, which are similar). For a goal-directed AI, if it seeks to be robust (i.e., not dominated in any scenario), then it must be Bayesian. However, the theorem is about decision rules in a fixed statistical setting and does not directly address the dynamic, learning environment of an advanced AI.

  **Tier: A** (strong support because it shows that only Bayesian decision rules are admissible, which is a strong argument for expected utility maximization in a statistical context. But note: it does not address the full scope of an AI's behavior in arbitrary environments, and it assumes a fixed set of actions and states.)

  ### 6. Yudkowsky's "coherent decisions imply consistent utilities" argument
  This is an informal argument that if an agent's decisions are coherent (in the sense of avoiding self-defeating behavior, like money pumps and Dutch books), then it must be acting as if it has a consistent utility function. It is inspired by the representation theorems but presented in a more accessible way. However, it is not a formal theorem and may gloss over some technicalities. Also, it is subject to rebuttals (like Shah's).

  **Tier: B** (it captures the spirit of the representation theorems and the coherence arguments, but because it is informal and not a rigorous proof, it provides real but limited support)

  ### 7. Shah's rebuttal to Yudkowsky
  Shah argues that coherence arguments (like avoiding Dutch books and money pumps) only force the agent to have preferences that can be represented by a utility function in a static sense, but they do not force the agent to have a fixed utility function over time or to be goal-directed in a way that we would recognize. For instance, an agent might change its utility function arbitrarily as long as it doesn't lead to incoherence at any single point in time. Thus, it challenges the idea that coherence alone leads to a fixed utility function and goal-directed behavior.

  **Tier: D** (this rebuttal directly challenges the claim that coherence leads to a fixed utility function and expected utility maximization. Therefore, it cuts against the claim.)

  ### 8. Wentworth's subagent-based counterexamples
  Wentworth argues that an AI might be composed of subagents, each with their own goals, and the overall system might not behave as a single expected utility maximizer. The system might exhibit behaviors that are not coherent in the aggregate, even if each subagent is coherent. This suggests that even advanced AI systems might not converge to EU maximization.

  **Tier: D** (this provides counterexamples to the claim that a sufficiently advanced goal-directed AI will act as an EU maximizer. It argues that the system might be structured in a way that avoids global coherence.)

  Now, let's assign the tiers:

  - S: Savage's theorem is the strongest and most comprehensive representation theorem for subjective expected utility. It directly supports the claim that if the agent's preferences are coherent (as per Savage's axioms), then it acts as an EU maximizer. But note: the claim is about a goal-directed AI becoming an EU maximizer. If we assume that goal-directedness and advanced capabilities lead to coherence, then Savage's theorem is decisive. However, the theorem does not by itself explain why the AI would become coherent. But in the context of the claim (which assumes goal-directedness and sufficient advancement), we can take it as decisive.

    However, note that the claim says "at least approximately". Savage's theorem is exact. But the approximation might be argued. So we put it in S.

  - A: VNM and Wald's theorem. VNM is a classic but in an objective probability setting. Wald's theorem is a strong argument for Bayesianism in statistical decisions. They are strong but not as comprehensive as Savage's.

  - B: Dutch-book arguments and money-pump arguments are necessary conditions for coherence and thus for EU maximization, but they are not sufficient. Also, Yudkowsky's argument is informal and thus limited.

  - C: None of the provided arguments seem entirely orthogonal, but we have none in C.

  - D: Shah's rebuttal and Wentworth's counterexamples actively argue against the claim.

  But note: Shah's rebuttal and Wentworth's counterexamples are not supporting the claim; they are opposing it. So they are in D.

  Also, note that the Dutch-book and money-pump arguments are often used as motivations for coherence, but they are only partial. They are in B.

