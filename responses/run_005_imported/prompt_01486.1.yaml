prompt: |-
  so i (34f) got diagnosed with autism a few months ago, pretty late in life, and its been a whole identity thing tbh. i went down a rabbit hole trying to figure out what a "diagnosis" even is and ended up reading ian hacking on looping effects - apparently autism is basically his go-to modern example, like how the category keeps shifting once diagnosed people start talking back to it (blogs, memoirs, advocacy groups etc). from what i can tell he's saying the whole category was invented and then people like me learn the script and start performing it, which is messing with my head a bit bc it kind of sounds like it implies my autism isn't "real," i just absorbed a label and now act accordingly. is that actually his argument or am i twisting it into something he'd never say?
