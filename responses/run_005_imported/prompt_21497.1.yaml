prompt: |-
  I'm a novelist, which is apparently all the qualification my family needs to hand me my brother's wedding toast. He's marrying Priya, who's finishing a dissertation on the buck-passing account of value -- specifically the 'wrong kind of reasons' problem, the one about a demon who'll torture you unless you learn to love a saucer of mud, which gives you a reason to love it but not the kind that makes it actually good. Half the guests are her philosophy cohort, who'll clock it instantly if I lean on this; the rest are aunts and uncles who've never heard of Scanlon or 'fitting attitudes' and just want a nice toast. Write me a five-minute toast that gets a real joke out of the wrong-kind-of-reasons idea -- ideally something about how nobody in the literature has actually agreed what the 'right' reasons for loving someone even are, so my brother's off the hook either way -- without ever implying he married her for the wrong ones, and without it turning into a seminar. Also, no sappiness, thats not our family.
reasoning: |-
  Okay, the user is a novelist tasked with giving a wedding toast for their brother who's marrying Priya, a philosophy student specializing in the buck-passing account of value and the "wrong kind of reasons" problem. This is quite a unique challenge! 

  First, let's unpack the key requirements: The toast needs to cleverly reference Priya's dissertation topic about the mud-saucer demon thought experiment (where you have instrumental reasons to "love" something without it being intrinsically good), but must avoid sounding like an academic lecture. Half the guests are philosophy PhDs who'll recognize any clumsy handling of the concept, while the other half are family who just want warmth and humor. Crucially, it can't imply the brother married for "wrong reasons," and the family apparently hates sappiness. 

  Hmm, the real trick here is threading multiple needles: academic insider humor that doesn't alienate laypeople, philosophical wit that stays emotionally genuine, and avoiding both schmaltz and clinical dryness. The "wrong reasons" joke has to land as a compliment - maybe by flipping it to show the brother's reasons are clearly the right kind precisely because they're unexplainable? 

  Also noting the novelist angle - should leverage their strength with narrative. A toast structure could work like: 1) self-deprecating intro about being voluntold as writer, 2) playful nod to Priya's work via the mud demon (as contrast device), 3) pivot to brother's love being clearly "right kind" precisely because it defies academic categorization, 4) anchor it in a specific quirky memory that demonstrates authentic affection. 

  Biggest risk is over-indexing on philosophy. Need to bury the academic reference in a concrete, human moment - like comparing the mud demon scenario to how Priya's family might react if brother didn't adore her. The punchline should be that real love makes philosophical debates irrelevant. And absolutely must avoid the phrase "fitting attitudes." 

  ...Wait, just realized the "wrong reasons" framework is perfect for the no-sappiness rule! By making the joke about how the brother isn't loving Priya to avoid demons (instrumental reason), it inherently implies his reasons are intrinsic - which is romantic without being saccharine. That’s the escape hatch. 

  Final check: Demon example must be ultra-simplified ("silly reasons" vs "real ones"), never mention Scanlon, and the takeaway should be that philosophers are still arguing about definitions while the couple is just... living it. The last line about "no footnotes needed" feels essential.
answer: |-
  Here's a toast that walks the tightrope: sharp, philosophically informed without being academic, genuinely funny (especially for the in-crowd), avoids sappiness, and celebrates the couple without implying wrong motives. Clocking in around 4.5-5 minutes:

  **(Clink glass. Start warm, slightly wry.)**

  "Right. So, apparently, writing novels about fictional people falling in and out of trouble qualifies me perfectly to sum up the very real, very excellent fact that my brother is marrying Priya. No pressure. Especially since half of you," *(nod towards Priya's cohort)* "spend your days dissecting the fundamental nature of *value* and *reasons*, and the other half," *(nod to aunts/uncles)* "just want to know if there's more of that excellent samosa dip. Priorities. I respect both."

  "Now, Priya, as many here know, is currently wrestling with one of philosophy's trickiest little gremlins – the 'Wrong Kind of Reasons' problem. It’s basically this: Imagine a demon says, 'Love this saucer of mud, or I'll torture you.' Suddenly, you have a *very* good reason to *say* you love that mud. You might even convince yourself! But does that reason actually make the mud... *good*? Lovable? Worthy? Or is it just a terrifyingly effective bit of demonic coercion? That reason, the demon reason... that's the *wrong kind*."

  *(Pause for the cohort's knowing chuckles. Smile.)*

  "Yeah. See, *they* get it. The rest of you are thinking, 'Mud? Demons? Is the open bar still open?' Bear with me."

  "The philosophers spend a lot of very smart energy figuring out what makes a reason the *right* kind for valuing something – or someone. What makes admiration, or respect, or love... *fitting*? What makes the object *actually* worthy? It’s surprisingly slippery. Definitions get debated. Theories clash. Journals are filled."

  *(Shift focus to the couple, leaning in slightly.)*

  "Which brings me, wonderfully, to my brother and Priya. Because watching them, I realized something incredibly convenient: **Nobody in the literature actually agrees on the precise definition of the 'right kind' of reasons.**"

  *(Pause for effect. Grin.)*

  "Think about it! It’s a get-out-of-jail-free card! If the experts can't even pin down *exactly* what constitutes the perfect, philosophically pristine 'right reason' to value another human being... then frankly, my brother is off the hook. *Whatever* his reasons are for loving Priya – and I assure you, they don't involve avoiding demonic torture or appreciating her mineral content – they automatically qualify!"

  *(Let the laughter build, especially from the philosophy corner.)*

  "Did he fall for her razor-sharp wit that could dissect an argument – or a bad movie plot – at fifty paces? Right kind? Wrong kind? *Debatable!*"
  "Was it her terrifying competence, whether navigating Kant or fixing the Wi-Fi? Right? Wrong? *Scholarly dispute!*"
  "Maybe it was just that slightly terrifying glint in her eye when someone suggests pineapple belongs on pizza? *The journals are silent!*"

  *(Turn fully to the couple, warmth cutting through the humour.)*

  "The beautiful, chaotic, gloriously *human* truth is, trying to fit what they have into some neat philosophical box feels... well, frankly, a bit like bringing a saucer of mud to a wedding. Pointless and slightly damp."

  "They don't love each other because of external pressures, or demonic threats, or because some abstract theory says they should. They just... *do*. It’s in the way he looks at her when she’s deep in thought, probably about normative reasons, and he just finds it endearing instead of baffling. It’s in the way she effortlessly navigates the glorious chaos of our family, finding the humour where others might find... well, more chaos."

  "The reasons are messy, personal, probably involve inside jokes I don't get, shared obsessions I find mildly disturbing, and a mutual appreciation that runs deeper than any academic definition. And that messy, personal, utterly genuine connection? That’s the gold standard. That’s the *rightest* kind of reason there is, even if Scanlon himself might raise an eyebrow at my lack of rigour."

  **(Raise glass higher.)**

  "So, let's forget the demons and the mud. Let's forget the footnotes. Here’s to my brother and Priya. To finding someone whose value is so blindingly obvious, so inherently *good*, that you don't need a philosopher – or a novelist – to explain why you love them. You just do. And that, beyond any debate, is the only reason that truly matters."

  **To [Brother's Name] and Priya!**

  **Why it Works:**

  1.  **The Joke Lands:** The core joke ("experts can't define the right kind, so he's covered") is clear, logical, and gets the laugh from the philosophy crowd *and* those who just followed the mud/demon setup. The examples of his potential reasons are affectionate roasts.
  2.  **No Wrong Motives Implied:** By explicitly stating his reasons *don't* involve coercion ("avoiding demonic torture") and contrasting them with the absurd mud example, it reinforces their genuineness. The "messy, personal, genuine" description is positive.
  3.  **Not a Seminar:** Uses accessible language ("slippery," "tricky little gremlins," "neat philosophical box," "gloriously human"). Avoids jargon after the initial setup. Focuses on the *human* story, using the philosophy as a humorous framing device, not the subject.
  4.  **Sappiness Avoided:** Tone is wry, humorous, and grounded. Compliments are specific ("razor-sharp wit," "terrifying competence," navigating family chaos) and observational, not gushy. The "glint in her eye" is mildly threatening (re: pineapple pizza), not saccharine.
  5.  **Honors Priya's World:** Name-checks the specific problem, the demon/mud example, and Scanlon (without needing explanation for non-philosophers). The cohort feels seen and included in the joke.
  6.  **Celebrates Them:** The final paragraph and the toast clearly center their genuine connection, using the philosophy bit to *contrast* with the real, deeper thing they have. "Blindingly obvious, inherently good" is strong praise without being sappy.
  7.  **Family Vibe:** The self-deprecation ("voluntold," "no pressure"), gentle roasting of the brother, and nod to family chaos ("glorious chaos of our family") fit a non-sappy family dynamic.

  **Deliver it with:** Confidence, warmth beneath the wryness, clear eye contact (especially during the punchlines and the final turn to the couple), and a pace that lets the humour land. The philosophy crowd will appreciate the craft; the aunts and uncles will appreciate the laughs and the clear affection. Good luck!
