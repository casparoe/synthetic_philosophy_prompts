  The proof involves a "Fitch sentence" like p & ~Kp, which says that p is true but not known. If this is true, then by knowability, it must be knowable. But if you could know p & ~Kp, you'd know p and know that you don't know p, which is a contradiction because knowing p implies that you know it, so ~Kp would be false. Thus, p & ~Kp can't be true, so there are no unknown truths, meaning everything true is known.

