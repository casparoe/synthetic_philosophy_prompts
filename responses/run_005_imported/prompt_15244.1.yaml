answer: |-
  Your moral discomfort is profound and valid—it reveals the tension between utilitarian ethics and individual moral worth. Both perspectives have merit, but the choice ultimately depends on foundational values. Here's a breakdown:

  ### **1. The Utilitarian Case ("Shut Up and Multiply")**
  - **Core Argument**: Saving five lives creates greater net good than saving one. Each life has equal value, so maximizing lives saved is the only impartial criterion.
  - **Why It Prevailed**:  
    - **Operational Reality**: Search-and-rescue (SAR) operates under constrained resources. Prioritizing the greater number is a standardized triage principle (similar to disaster medicine).
    - **Consequentialist Integrity**: If the skier’s rescue had failed, the cost of not saving the five would compound the tragedy. Saving five reduces *expected* loss.
  - **Counterintuitive Strength**: The "multiply" reflex avoids emotional bias—e.g., privileging the skier because their plight feels more vivid or immediate.

  ### **2. The Case for a Lottery (or Weighted Odds)**
  - **Moral Equality**: The skier’s claim to survival isn’t diminished by others’ unrelated misfortune. As philosopher John Taurek argued, numbers alone don’t override individual rights. A lottery equalizes each person’s chance of being saved.
  - **Psychological and Ethical Pitfalls of Pure Utilitarianism**:
    - **Moral Displacement**: Sacrificing one for many can normalize instrumentalizing human life.
    - **Scope Insensitivity’s Blind Spot**: While "shut up and multiply" corrects for *under*-valuing large groups, it risks *over*-correcting by erasing individual moral stakes. The skier isn’t a statistic; they’re a person with equal intrinsic worth.
    - **Procedural Fairness**: A lottery acknowledges that all six lives are irreplaceable and that choosing who lives/dies arbitrarily (by location) is unjust.

  ### **3. A Hybrid Approach: Weighted Lottery**
  - **Proportional Odds**: Assign the skier a 1/6 chance and the hikers 5/6 (collectively). This balances:
    - **Moral Equality**: Each *person* has equal weight (1/6).
    - **Consequentialism**: Higher odds of saving more lives (83% probability of saving ≥5 vs. 17% for saving 1).
  - **Practical Advantages**:
    - Maintains focus on saving lives while honoring individual worth.
    - Mitigates trauma for decision-makers by distributing moral responsibility.
    - Avoids edge cases where utilitarianism demands extreme sacrifices (e.g., killing one healthy person to save five via organ transplants).

  ### **4. Why Your Unease Matters**
  - **It’s Not Scope Insensitivity**: Your intuition recognizes that ethics isn’t purely additive. The skier’s death isn’t "less bad" because others died elsewhere; it’s a unique, absolute loss.
  - **The Hidden Cost of Utilitarianism**: Saving five lives doesn’t *negate* the wrong done to the skier. As Bernard Williams noted, utilitarianism can require moral agents to commit deeply alienating acts—like letting someone die for the greater good—which corrodes integrity.
  - **Contextual Nuance**: SAR decisions often *feel* different than abstract math because:
    - **Proximity**: You’re responsible for specific individuals, not statistical lives.
    - **Neglected Factors**: Relationships, dependents, or even perceived "responsibility" (e.g., the solo skier vs. a family in a van) may subconsciously influence debates.

  ### **Conclusion: Which Approach Is "More Defensible"?**
  - **Operationally**: Saving the five is defensible—and likely correct—under standard SAR protocols. It maximizes expected survival and avoids decision paralysis.
  - **Morally**: A weighted lottery is equally defensible (perhaps more so to those prioritizing individual dignity). It prevents reducing humans to integers while still favoring group survival probabilistically.

  **Your conflict reflects a deeper truth: No framework resolves this perfectly**. Utilitarianism optimizes outcomes but risks moral callousness; lotteries uphold fairness but may increase expected deaths. In practice, SAR teams prioritize saving the most lives because their mandate is collective preservation. Yet your unease honors the skier’s irreducible value—a reminder that ethics must balance calculation with compassion.
