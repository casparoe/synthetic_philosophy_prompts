prompt: |-
  so in physics class we're doing the unit on orbits and gravity and my teacher mentioned as this random side note that Kepler, on top of doing all his laws-of-planetary-motion stuff, was also literally a professional astrologer for a while (court astrologer for Emperor Rudolf II, and he did horoscopes for random nobles too, i think one was this military guy Wallenstein). that kind of broke my brain a little bc i always pictured him as this super rational math guy, so i looked into it more and it turns out his actual position on astrology was way more specific/weird than just "he believed in it" or "he didn't." apparently he wrote a whole book (something "Tertius" in the title) where he basically rips apart the zodiac signs and houses as made up nonsense with no real "mechanical" effect on anything, but he still thought the "aspects" — like the angles planets make with each other — were doing something real, some kind of resonance with geometric shapes that the soul can pick up on, which affects your mood/temperament. theres also that quote of his about astrology being the "foolish daughter" that a "wise mother" (astronomy) has to feed, which i thought meant he basically thought it was all fake, but apparently in context he specifically meant popular fortune-telling astrology, not the aspects stuff he actually stood behind.

  this got me thinking about the whole co-star/"whats your big three" astrology thing that a bunch of people at my school are obsessed with, where basically nobody claims anymore that it predicts specific events, its more marketed as a vibes-based personality/self-reflection tool based on your birth chart. so, genuine question: if you showed Kepler modern chart-based astrology apps, do you think his specific reasoning (the stuff above, not just "he's a scientist so obviously no") would make him more okay with it than old newspaper sun-sign horoscopes, since it's not making the fatalistic predictions he hated? or would he still call the whole thing nonsense since its literally still built on the zodiac signs/houses that he already said do nothing? like, which specific parts would he actually accept and which would he still trash, based on what he actually wrote, not just vibes.
