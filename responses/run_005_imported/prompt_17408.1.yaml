prompt: |-
  I got roped onto this ad hoc "IP review" group at my company -- we don't even have an official charter for it, people just started calling it that after a couple of departing-employee disputes got messy last year, and now Legal likes to loop in a couple of engineers before they decide anything. Current case: a senior guy on our infra team, let's call him Sam, gave notice a few weeks back, and it's come out that the startup he's co-founding is basically built around an approach to doing zero-downtime schema migrations across sharded databases -- something he first floated in a Slack thread with a few of us like 8 months ago, and we all kept kicking it around over lunch and one whiteboard session after that. No design doc ever got written, nothing was greenlit, there's no code for it anywhere in our repo, and our own product doesn't even need it right now. But the standard IP agreement everyone signs on day one says you assign the company any invention or idea "conceived" during your employment whether or not it's ever built or related to whatever you're officially working on. Someone mentioned California has some carve-out for stuff you dream up entirely on your own time with your own resources, but Sam's idea is pretty squarely about database infra, which is literally our team's whole job, so I dont think that carve-out cleanly saves him either way.

  Legal wants to know whether to send his new company a claim letter (or at least open a licensing/equity conversation) before he closes his seed round, which apparently is like 3 weeks out, so this needs an actual answer, not "let's form a subcommittee." Honestly Im conflicted, since I was in that Slack thread too, throwing out my own two cents, so it feels weirdly personal, like the company claiming this claims a bit of my unpaid weekend brain too. At the same time, if "we never wrote it down or shipped it" is enough for any idea to just walk out the door, I don't really get what the agreement was for in the first place. Can you write the memo I'm supposed to bring to Thursday's sync? I need one clear recommendation -- assert the claim, waive it, or some specific negotiated middle path -- with an actual timeline tied to Sam's raise, the reasoning behind it, and, this is the part I really don't want skipped, a fair, non-strawman version of the best argument for whichever option we don't end up picking.
reasoning: |-
  Okay, let me unpack this complex IP situation. The user needs a balanced memo addressing Sam's database migration idea that emerged informally during his employment. 

  First, I need to understand the core tension: the company's broad IP agreement vs. the reality that this idea was never documented or developed. The California labor code 2870 carve-out for independent inventions is tricky here - while Sam used company channels (Slack/lunches) to discuss it, the idea relates directly to his team's database infrastructure work. 

  The user's personal conflict resonates - they contributed to those discussions too, so this feels like claiming "unpaid weekend brain." That emotional angle matters. The legal pressure (3 weeks until seed round) means we can't punt this decision. 

  I'm considering three options: 

  1) Full claim: Strongest legal position but likely destroys relationships. Sam's startup would see delays, and internal engineers (like the user) might feel demoralized. 

  2) Waiver: Cleanest ethically but sets a precedent that could haunt future cases with more concrete IP. 

  3) Middle path: My gut says this is right - acknowledge company's interest while recognizing Sam's agency. A quick license exchange for nominal equity (0.5-1.5%) balances legal coverage with goodwill. 

  For the memo structure: Start with facts (no docs/no code), then analyze California law's ambiguity, present all options fairly, and recommend the license path with specific terms. Crucially, include the counter-arguments section - the user insisted on this, and it builds credibility. 

  Timeline is tight: Draft claim letter now but hold sending until final talks fail. Need to move before seed round closes. 

  The user's hidden need? Probably validation that their discomfort with overreaching IP claims is reasonable. I'll bake that into the "ethical risks" part of Option 1's counterargument.
answer: |-
  ## IP Review Memo: Sam [Infra Team] Departure & Proposed Schema Migration Concept  
  **To:** IP Review Group  
  **From:** [Your Name], Engineering Representative  
  **Date:** October 26, 2023  
  **Subject:** Recommendation re: Potential IP Claim on "Zero-Downtime Sharded Schema Migration" Concept  

  ### I. Key Facts Summary  
  *   **Concept:** Technique for zero-downtime schema migrations across sharded databases.  
  *   **Origin:** First proposed by Sam in an internal Slack thread (~8 months ago), followed by informal lunch/whiteboard discussions involving [Your Name] and others.  
  *   **Company Status:** No design doc, no code, no project approval, no current product need.  
  *   **Sam's Activity:** Co-founding startup centered on this concept. Seed round closing in ~3 weeks.  
  *   **IP Agreement:** Standard clause assigns company rights to inventions "conceived" during employment, regardless of development or direct job relevance.  
  *   **CA Labor Code § 2870:** Provides exception for inventions developed *entirely* on employee's own time/equipment, *without* using company resources, and *not related* to company business/R&D.  

  ### II. Analysis  
  *   **Company's Potential Claim Strength (Moderate/Low):**  
      *   *For Claim:* Concept was "conceived" during employment via company Slack/lunches. Directly relates to Sam's core duties (database infra). CA § 2870 exception likely *doesn't apply* due to use of company resources (Slack, work time/colleagues) and direct relevance to company business.  
      *   *Against Claim:* No tangible assets (code/docs), no business use case pursued, purely conceptual. Asserting rights over an undeveloped lunch discussion feels aggressive. Legal precedent on "conception" for purely abstract ideas is less robust than for prototypes/code.  
  *   **Risks of Action:**  
      *   *Asserting Claim:* High chance of costly litigation, reputational damage (internal/external), morale impact (engineers may feel ideas are "trapped"), potential delay/collapse of Sam's seed round (triggering hostility).  
      *   *Waiving Claim:* Sets precedent that undeveloped ideas discussed informally may leave. Potential future loss if concept becomes valuable and was demonstrably conceived here.  
  *   **Ethical/Relational Considerations:** Claiming an idea with zero company investment feels extractive. Sam's initiative drove the concept forward. Engineers (like memo author) contributed freely; company claiming this may chill future innovation discussions.  

  ### III. Recommendation: Negotiate a Limited, Expedited License Agreement  
  *   **Action:** **DO NOT send a claim letter.** Instead, Legal should immediately contact Sam (via counsel) proposing a simple, time-bound licensing negotiation.  
  *   **Proposed Terms:**  
      *   Sam's startup receives a **perpetual, irrevocable, non-exclusive, royalty-free global license** to use the *specific concept* discussed in the identified Slack thread/whiteboard sessions.  
      *   In exchange, the startup grants the company **1.0% of its fully diluted equity** (or warrants for same).  
      *   Mutual release of claims related to this specific concept.  
      *   Agreement finalized **within 10 business days** (before seed round closure).  
  *   **Why This Path?**  
      1.  **Acknowledges Company's Interest:** Secures *some* tangible value (equity) reflecting the idea's origin during employment, upholding the *principle* of the IP agreement without overreach.  
      2.  **Minimizes Harm:** Avoids nuclear option (claim letter/lawsuit). Preserves relationship, avoids reputational damage, and allows Sam's venture to proceed.  
      3.  **Practical & Fast:** Achievable within the 3-week window. Focused solely on the specific, undocumented concept.  
      4.  **Fair to Sam:** Recognizes his effort to develop the idea externally. The low equity ask reflects the lack of company investment.  
      5.  **Internal Morale:** Demonstrates the company values innovation *and* fairness, encouraging continued open discussion.  
  *   **Contingency:** If Sam refuses *any* negotiation within 5 business days, **waive the claim.** Litigation risk and cost vastly outweigh the value of an undeveloped concept. Document the waiver decision clearly.  

  ### IV. Timeline  
  *   **D+0 (Today):** IP Review Group approves this approach. Legal drafts short term sheet.  
  *   **D+1:** Legal contacts Sam's counsel via email/phone: "We acknowledge your venture. To avoid conflict and resolve any potential ambiguity swiftly, we propose a simple, non-disruptive license agreement before your funding closes. We can share terms within 24 hours."  
  *   **D+2 to D+8:** Negotiation window (target 5 days).  
  *   **D+10:** Target signing date.  
  *   **D+12:** If no material progress, Legal formally waives claim in writing to Sam/counsel.  

  ### V. Best Argument for the Alternative Path: Asserting the Claim  
  *(Presented Fairly & Without Strawman)*  

  **The strongest case for asserting the claim stems from upholding contractual integrity and protecting the company's innovation ecosystem.** The IP agreement explicitly assigns rights to conceptions during employment, irrespective of development status. This concept, while nascent, was demonstrably conceived using company resources (Slack, paid time, colleague collaboration) and falls squarely within Sam's core job function. Waiving rights here establishes a dangerous precedent: it signals that employees can freely incubate company-related ideas informally and later commercialize them without consequence. This could disincentivize internal innovation, encourage deliberate avoidance of documentation to bypass IP assignment, and potentially deprive the company of future valuable IP derived from similar discussions. Asserting the claim forces a negotiation from a position of legal right, ensuring the company receives appropriate compensation (licensing fee, significant equity, or assignment) for the foundational work done on its dime. While potentially contentious, failing to assert legitimate claims systematically erodes the value of the IP agreement and may invite future, more damaging departures.  

  **Final Note:** The recommended path balances legal prudence, ethical considerations, and business reality. It protects the company's interest without resorting to disproportionate aggression over an unrealized concept, while meeting the critical deadline.  

  **Recommendation Approved By:**  
  [ ] Legal Rep  
  [ ] Engineering Rep (You)  
  [ ] Other Stakeholder
