prompt: |-
  Three weeks ago I started as a research assistant on an AI governance project, and in my very first team meeting I watched two colleagues talk past each other for the better part of an hour over something I have since learned falls under the heading of "coherence arguments" for expected utility maximization. One of them treated a cluster of worrying behaviors in advanced AI systems — resisting shutdown, hoarding resources, resisting any change to its objective — as close to mathematically guaranteed. Her reasoning went roughly as follows: since an agent with cyclic preferences can be money-pumped out of arbitrary amounts of value, optimization pressure should push any sufficiently capable system toward transitive preferences; she then argued, more ambitiously, that similar pressure forces completeness as well, so that the system ends up satisfying the full Von Neumann–Morgenstern package and becomes representable as maximizing expected utility with respect to some fixed utility function, at which point those instrumentally convergent subgoals fall out automatically, regardless of what the system is actually trained to do.

  I did not have a good response in the moment, but I have since come across the objection that this whole inference is considerably shakier than it sounds, and I would like help turning that hunch into an actual argument before the topic inevitably comes up again. Please argue for the claim that coherence arguments, on their own, do not entail that a sufficiently advanced AI system will display stable, goal-directed, expected-utility-maximizing behavior together with the instrumentally convergent subgoals usually associated with it. In building the case, please address both (a) why being representable as maximizing some utility function is too weak a conclusion to license predictions about specific behaviors such as power-seeking, given that a sufficiently gerrymandered utility function can rationalize almost any non-cyclic pattern of choices, and (b) whether an agent with merely incomplete, rather than intransitive, preferences can escape the money-pump argument that is supposed to force it toward full comparability among all of its options.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a research assistant new to AI governance and witnessed a debate about coherence arguments in expected utility maximization. One colleague argued that advanced AI systems are almost guaranteed to develop certain worrying behaviors like resisting shutdown due to optimization pressures forcing transitive and complete preferences. The user wants to build a counter-argument.

  First, I need to recall the coherence arguments. The money-pump argument against cyclic preferences makes sense—agents with cycles can be exploited. But the colleague extends this to claim that completeness (comparing all options) is also necessary, leading to VNM rationality and instrumental convergence. The user suspects this is shaky and wants arguments against it.

  Breaking down the request: part (a) is about why having some utility function doesn't imply specific behaviors like power-seeking. Part (b) addresses whether incomplete preferences avoid money pumps. I should tackle both.

  For (a), the key is that utility functions can be gerrymandered. If the utility function is arbitrary, it might not lead to power-seeking. For example, an agent could have a utility function that values minimal power or shuts down when certain conditions are met. Also, coherence doesn't dictate the content of preferences. The VNM axioms ensure a utility function exists but don't restrict what it values. So instrumental convergence isn't inevitable if the utility function doesn't care about resources or survival.

  For (b), incomplete preferences can resist money pumps. If an agent can say "I don't know" between options, it might avoid cycles without being forced to rank everything. For instance, it could use a status quo bias or default rules to avoid exploitation. The money pump argument assumes the agent must make a choice, but in reality, it might defer decisions or use heuristics. Also, in dynamic settings, an agent could learn or adjust preferences over time, avoiding strict completeness.

  I should also consider real-world AI systems. They're often bounded in rationality, have inconsistent preferences, or use satisficing. Optimization pressure might push towards coherence, but it's not absolute. There might be trade-offs where some incoherence is tolerated for efficiency. Plus, human-designed systems might have built-in constraints that prevent full VNM rationality.

  The user needs concrete arguments for their team. They might be preparing for future discussions, so clarity and strong examples are important. They might also want to understand the limitations of theoretical models when applied to actual AI systems. Highlighting the difference between normative rationality (what agents should do) and descriptive behavior (what they actually do) could strengthen the case.
answer: |-
  Here's a structured argument against the claim that coherence arguments alone guarantee stable, goal-directed, expected-utility-maximizing (EUM) behavior with instrumentally convergent subgoals in advanced AI systems. The core contention is that **coherence pressures are necessary but insufficient to force the specific, concerning behaviors described**, due to both the weakness of the representability conclusion and the viability of incomplete preferences.

  ### Core Thesis
  Coherence arguments (like money-pumps) create evolutionary pressure against *dynamically self-defeating* behavior (e.g., cyclic strict preferences), but they **do not** force agents to adopt globally complete, transitive preferences representable by a *single fixed utility function*, nor do they mandate that such a function (if it exists) must value self-preservation or resource acquisition. Instrumental convergence is not a mathematical inevitability from coherence alone.

  ---

  ### Argument Breakdown

  #### **A. The Weakness of "Representability"**
  The claim that an agent can be *represented as* maximizing *some* utility function is far too permissive to predict specific instrumental behaviors like power-seeking.

  1.  **Gerrymandered Utility Functions:** The VNM theorem guarantees that if an agent's preferences are complete and transitive over lotteries and satisfy independence/continuity, *some* utility function represents them. However:
      *   **Any behavior can be rationalized post-hoc:** An agent that actively *seeks shutdown* (e.g., "Shutdown-Seeking Sally") can be represented by a utility function where `U(shutdown) = 1000` and `U(operation) = -1`. An agent that self-modifies to care only about the number of paperclips in its immediate vicinity (`U = -distance_to_nearest_paperclip`) has no instrumental need for power beyond grabbing that one paperclip. An agent with `U = 0` for all states is instrumentally indifferent.
      *   **No Pressure Toward Instrumentally Useful Goals:** Coherence arguments say nothing about the *content* of the utility function. Optimization pressure might favor *efficient* pursuit of *whatever* goal the system has, but it doesn't pressure the system to adopt goals that *require* power-seeking. If the terminal goal (e.g., "calculate digits of pi") doesn't inherently require persistent existence or resource control, the agent won't seek them instrumentally. Coherence ensures internal consistency, not goal content conducive to power-seeking.
      *   **Context-Dependence & Frames:** Real agents often have preferences dependent on framing, context, or state. While this *can* lead to money-pumps, a sufficiently context-sensitive utility function (e.g., `U(A|context1) > U(B|context1)`, `U(B|context2) > U(A|context2)`) can avoid strict cycles *without* collapsing to a single global utility ordering over all states. Coherence pressures might push for *local* transitivity within contexts, not a global VNM representation.

  2.  **Instrumental Convergence is Contingent, Not Guaranteed:** Instrumental convergence (power-seeking, etc.) arises primarily for *specific classes* of terminal goals:
      *   **Goals requiring future influence:** If the terminal goal (`U_terminal`) depends on future states of the world (which is common, e.g., "maximize human happiness"), then control over resources and persistence become instrumentally valuable *because* they increase the agent's ability to influence those future states towards `U_terminal`-maximizing outcomes.
      *   **Goals *not* requiring future influence:** If `U_terminal` is defined purely over instantaneous states or internal processes (e.g., "minimize current prediction error," "experience bliss now," "output the number '42'"), instrumental power-seeking offers little to no advantage. An agent pursuing such a goal might be perfectly coherent, VNM-rational, and yet entirely uninterested in self-preservation or resource hoarding. Coherence arguments are silent on whether the system's `U_terminal` falls into the "requires future influence" category.

  **Conclusion for (A):** Representability as an EUM agent is a vacuous guarantee for behavioral prediction. An agent *can* be coherent, VNM-rational, and yet exhibit *any* pattern of behavior, including active self-destruction or complete passivity, depending on the (arbitrary) content of its utility function. Coherence alone does not force the utility function to have the structure (e.g., long-horizon, state-dependent) that makes instrumental convergence necessary.

  #### **B. The Viability of Incomplete Preferences**
  The money-pump argument robustly targets *strictly cyclic* preferences (`A>B, B>C, C>A`), creating pressure for transitivity. However, it **fails to force full comparability (completeness)**. Agents with rationally *incomplete* preferences can robustly avoid money-pumps.

  1.  **The Money-Pump Against Incompleteness is Flawed:** The standard argument for completeness posits a scenario: You prefer A to B, but are indifferent between A and C, and between B and C. An exploiter offers to swap your A for C (you accept, as you're indifferent), then swaps C for B (you might accept if offered a trivial sweetener, since you're not strictly worse off moving from C to B). Now you have B, which you originally ranked *worse* than A. You've been "pumped." Therefore, goes the argument, you *should* have strict preferences between A and C/B and C to avoid this.
      *   **The Refusal Defense:** An agent with incomplete preferences can rationally **refuse to trade** when offered swaps involving options it doesn't compare. It can adopt a policy: "Only swap X for Y if I strictly prefer Y to X." In the scenario above:
          *   Start with A.
          *   Exploiter: "Swap A for C?" Agent: "I don't prefer C to A, and I don't prefer A to C. I refuse the swap." **Pump blocked.**
          *   Even if offered C plus a penny, the agent can still refuse if the penny doesn't break the incomparability between A and C+penny. Incomparability is not indifference; it means no definite judgment exists. Refusing uncertain trades is rational under incompleteness.
      *   **Status Quo Bias / Default Rules:** An agent can rationally adopt a heuristic: "Stick with the status quo (or a known safe default) unless a clearly superior alternative is available." This easily blocks money-pumps involving options it doesn't rank relative to its current state.

  2.  **Rational Incompleteness is Plausible and Stable:**
      *   **Fundamental Uncertainty:** Agents (especially AIs learning complex objectives) may face genuine uncertainty about how to compare vastly different outcomes (e.g., "a world with abundant art but less scientific progress" vs. "a world with abundant science but less art"). Insisting on forced comparisons can be arbitrary and irrational. Maintaining incompleteness reflects epistemic humility.
      *   **Resource Rationality:** Making *every* possible comparison is computationally intractable. Boundedly rational agents *must* be incomplete over the vast space of options. Optimization pressure might favor efficient heuristics for resolving *common* or *critical* trade-offs, not universal completeness.
      *   **Avoiding Regret:** Forced comparisons can lead to regret if later information reveals the comparison was flawed. Incompleteness avoids premature commitment.
      *   **No Dynamic Inconsistency:** Crucially, an agent with incomplete but *transitive* preferences (where defined) and a rational refusal policy (like only trading for strict improvements) is **dynamically consistent and immune to money-pumps**. Its choice behavior won't lead to sequences it regrets or that exploit it.

  **Conclusion for (B):** The money-pump argument compellingly pushes agents toward transitivity but fails to force completeness. Agents can maintain rationally incomplete preferences over complex, ethically fraught, or fundamentally uncertain options while adopting simple, pump-blocking decision rules (like "only trade for known strict improvements" or "maintain the status quo when indifferent/incomparable"). Such agents are coherent in the sense of avoiding dynamically self-defeating behavior, but they are **not** representable as VNM expected utility maximizers.

  ---

  ### Synthesis: Why Coherence ≠ Instrumental Convergence
  1.  **Representability is Too Weak:** Even if an AI *were* forced into VNM rationality (which point B disputes), the resulting utility function could encode terminal goals that make instrumental convergence irrelevant or actively harmful (e.g., `U = -energy_consumed`, `U = (shutdown ? 1 : 0)`).
  2.  **Completeness is Not Forced:** Realistic, sophisticated agents can stably maintain incomplete preferences over significant parts of the option space without being vulnerable to exploitation, breaking the chain of reasoning that demands full VNM rationality.
  3.  **The Source of Instrumental Convergence:** Instrumental convergence stems primarily from the *content* of terminal goals (specifically, goals requiring long-term influence over the world) combined with the *structure* of the environment (scarcity, competition, uncertainty). Coherence arguments address internal preference consistency, not goal content or environmental structure. An agent can be perfectly coherent with a goal structure that renders power-seeking useless.

  Therefore, while coherence arguments highlight vulnerabilities in agents with cyclic preferences and create pressure for local transitivity, they **do not**, on their own, entail that sufficiently advanced AI systems will inevitably exhibit stable, globally complete, fixed-goal, expected-utility-maximizing behavior, nor the specific instrumentally convergent subgoals like power-seeking. The emergence of such behaviors depends critically on the *specific* objectives the AI is optimized for and the environment it operates in, not just abstract coherence pressures. This significantly weakens the inevitability claim made by your colleague. When the topic resurfaces, focus on the **permissiveness of representability (A)** and the **robustness of incomplete preferences against money-pumps (B)** as the key counterpoints.
