prompt: |-
  So a few weeks back I reread The Selfish Gene on a red-eye flight (as one does) and then made the mistake of googling around after landing, and I fell into this whole rabbit hole about how apparently a lot of practicing evolutionary biologists don't think Dawkins' gene's-eye view is the last word on "levels of selection." I ended up skimming Sober & Wilson's Unto Others, an essay of Pinker's that's basically trashing group selection, and then found out about this whole saga where Nowak, Tarnita and E.O. Wilson published a Nature paper attacking inclusive fitness theory head-on, and a genuinely huge pile of biologists (137? some number like that, it was a lot) signed onto an angry rebuttal letter. I'm a backend engineer, not a biologist, so my first instinct was to map all this onto abstraction layers in a software stack (hardware/OS/app), but it turns out the actual fight is over whether these "levels" are doing seperate causal work at all, or whether some of them are just the same math written differently -- which doesn't map onto my little analogy and is honestly messing with my head a bit.

  Anyway, instead of me just nodding along to whichever book I read most recently, I want your actual, considered judgment. Please rank the following six candidate "units/levels of selection" by how much genuinely seperate, non-redundant explanatory work each one still does in evolutionary biology today -- as opposed to being either superseded or turning out to just be a notational variant of another entry on this same list: (1) the gene (Dawkins/G.C. Williams selfish-gene view), (2) the individual organism (classical Darwinian fitness), (3) kin selection / inclusive fitness (Hamilton's rule), (4) multilevel selection / trait-group selection (Sober & Wilson style), (5) the eusocial-insect "superorganism"/colony as its own unit, and (6) old-school naive group selection along Wynne-Edwards lines ("for the good of the species"). Give me the answer as a JSON tier list, S meaning "doing real, distinct, load-bearing causal work" down to D meaning "basically redundant or discredited," formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

