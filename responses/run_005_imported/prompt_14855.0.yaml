answer: |-
  Here's a joke focusing squarely on the "rational irrationality" twist:

  **A philosopher, parched and near collapse in the desert, sees a truck approach. The driver leans out: "I'll rescue you, but *only* if you promise to pay me $1000 in town. And I only pick up people I *know* keep their promises."**

  **The philosopher, thinking quickly: "Rational self-preservation dictates I *must* become the kind of scrupulously honest person who *would* pay you back in town, even though by then it would be against my self-interest! Consider it done!"**

  **The driver, impressed by this display of commitment to future irrationality, rescues him.**

  **Weeks later, fully recovered in town, the philosopher hands the driver $1000. His friend gasps: "Why? He can't hurt you now! You're free!"**

  **The philosopher sighs, wiping a tear: "I know, I know... but back in that desert? I *rationally* became *irrationally* trustworthy. Now I'm stuck being this idiot who keeps his promises. Pass me the cheap wine, this virtue is expensive."**

  **Why it works:**

  1.  **Setup:** Establishes the classic Parfit scenario: rescue conditional on future payment, which later isn't in one's interest.
  2.  **The Rational Commitment:** The philosopher explicitly states the solution: *becoming* the kind of person who pays *is* the rational choice *at the time of the promise* for survival ("Rational self-preservation dictates...").
  3.  **The Twist ("Rational Irrationality"):** The punchline reveals the consequence: the philosopher *successfully* became that person ("I *rationally* became *irrationally* trustworthy"). He's now locked into an action (paying) that *is* irrational *at the time of performing it* ("Now I'm stuck being this idiot...").
  4.  **Humor Source:** The humor comes from the philosopher lamenting his *own success* at the rational strategy. He's miserable *because* he perfectly executed the plan to become someone bound by a principle that now costs him money pointlessly. He's a victim of his own past rationality, forced to act irrationally in the present. The "cheap wine" line underscores the perceived foolishness of his present action.
  5.  **Avoids Generics:** It doesn't rely on desert tropes or hitchhiking clichés; the entire joke hinges on the character's internal conflict *caused by* the successful implementation of the Parfitian rational commitment.
