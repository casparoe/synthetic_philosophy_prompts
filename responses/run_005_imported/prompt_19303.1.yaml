answer: |-
  ## The Ergodicity Gambit: Growth, Ruin, and the Foundations of Rational Choice

  Your journey from statistical mechanics to the fractious debate surrounding Ole Peters' "ergodicity economics" and the Kelly criterion is a natural one. Both fields grapple with aggregation – of particles in ensembles or wealth across time and parallel universes. The core dispute you highlight cuts to the heart of rational decision theory: is maximizing the long-run geometric growth rate (via log-wealth) merely *a* rational strategy for repeated gambles, or is it the *objectively correct* standard when ensemble and time averages diverge, rendering expected linear wealth maximization incoherent? Let's reconstruct the argument, dissect Samuelson's critique, and arrive at a verdict.

  **The Contested Terrain: A Simple Multiplicative Gamble**

  Consider your coin flip: wealth multiplies by 1.5 (Heads) or 0.5 (Tails), each with 50% probability. This is a multiplicative process – growth is compounded.

  1.  **Ensemble Average (Expected Wealth):** For a single bet, E[W₁] = 0.5 * 1.5W₀ + 0.5 * 0.5W₀ = W₀. Crucially, *this expectation is preserved indefinitely* if we imagine infinitely many parallel agents each playing once. The ensemble average wealth remains constant at W₀.
  2.  **Time Average (Realized Path):** A single agent playing repeatedly sees wealth evolve multiplicatively: Wₜ = W₀ * (1.5)^(N_H) * (0.5)^(N_T), where N_H + N_T = t. The *growth factor per bet* is g = (1.5)^{N_H/t} * (0.5)^{N_T/t}. The *time-average growth rate* is the limit of log(g) as t→∞, which converges almost surely to: γ = 0.5 * log(1.5) + 0.5 * log(0.5) = 0.5*log(0.75) ≈ -0.144. **Wealth decays exponentially to zero almost surely.** The typical trajectory is ruin.

  **The Kelly Criterion: Log-Optimality**

  Kelly showed that for repeated, identical, favorable gambles, maximizing the expected logarithm of wealth (E[log(W₁/W₀)]) maximizes the long-run growth rate γ. Here, E[log(return)] = 0.5*log(1.5) + 0.5*log(0.5) = γ < 0. Kelly would advise *not* taking this specific bet (as it has negative growth). For a favorable bet (e.g., 60% Heads), Kelly finds the *fraction* of wealth to bet maximizing E[log(wealth)]. Kelly framed this as a strategy for growth-optimal investment, a compelling *normative* principle for those prioritizing long-term compounding.

  **Peters' Ergodicity Economics: The Objectivity Claim**

  Peters elevates Kelly. His core argument:

  1.  **Non-Ergodicity:** The fundamental issue is that the multiplicative wealth process is **non-ergodic**. In statistical mechanics, an ergodic system has time averages (along a single trajectory over long time) equal to ensemble averages (across many identical systems at one time). Here, γ ≈ -0.144 (time avg growth) ≠ 0 (ensemble avg growth). They diverge.
  2.  **The Observable is the Time Average:** A single individual doesn't experience the ensemble average. They live a single trajectory. Rationality should concern optimizing the observable outcome *for the individual experiencing the process over time*. The ensemble average E[W] is irrelevant for the single agent; it describes an unobservable parallel universe average, not their lived financial reality.
  3.  **"Mathematical Correctness":** Peters argues that maximizing E[W] in this context is not just risky or suboptimal, but *mathematically inconsistent* with the agent's actual observable. It optimizes a phantom quantity (ensemble avg) that doesn't correspond to any possible long-term experience. Only maximizing E[log(W)] optimizes the actual observable long-term growth rate γ. This, he claims, makes geometric growth maximization (max E[log(W)]) the **objectively correct** criterion for rational choice in non-ergodic multiplicative processes, independent of subjective risk preferences. It's not about "liking" growth, it's about aligning optimization with the actual observable quantity.

  **Samuelson's Rebuttal: The Primacy of Utility**

  Samuelson's decades-long critique, directly applicable to Peters:

  1.  **Utility is Sovereign:** Rationality, in the von Neumann-Morgenstern (VNM) framework, is defined by consistent preferences satisfying specific axioms (completeness, transitivity, continuity, independence). The *content* of those preferences – the utility function U(W) – is a primitive. There is no "objectively correct" U(W); it reflects the agent's valuation of wealth levels and their attitude towards risk.
  2.  **Log-Utility is Just One Function:** Maximizing E[log(W)] is equivalent to assuming a specific utility function: U(W) = log(W). This function exhibits constant *relative* risk aversion (CRRA=1). While often reasonable, it's not unique.
  3.  **Counterexample: Linear Utility:** Consider an agent with linear utility: U(W) = W. This agent is risk-*neutral*. For them, maximizing E[W] *is* rational by definition, as it maximizes expected utility. Samuelson argued that such an agent, fully aware they will almost surely go bankrupt in the long run playing the 1.5/0.5 coin flip, could *still* rationally choose to play if they value the potential short-term gains highly enough relative to the distant (though almost certain) ruin. Their preferences are consistent with VNM axioms. The "long run" dominance of the Kelly strategy doesn't negate the validity of this agent's preference for maximizing expected *linear* utility at each step.
  4.  **The "Long Run" Fallacy:** Samuelson rejected arguments based purely on "what happens in the long run." He famously quipped, "We are all dead in the long run." A rational agent might have high time preference, prioritize finite horizons, or simply have different valuations of wealth states. The Kelly strategy's long-run dominance is a *consequence* of the log-utility assumption, not a justification that overrides other valid utility functions.

  **Reconciling the Divide: A Qualified Verdict**

  Both sides present compelling arguments rooted in valid perspectives. Where does the truth lie?

  *   **Peters is Profoundly Insightful:** His emphasis on non-ergodicity and the divergence between ensemble and time averages is crucial and often underappreciated in introductory economics. He correctly identifies that maximizing E[W] in multiplicative repeated gambles optimizes an unobservable quantity (ensemble average) while leading to disastrous observable outcomes (ruin) for the time-averaged trajectory. This is a powerful critique of naive expected-value maximization. **For an agent whose sole concern is the long-term survival and growth of their wealth *over time* within a repeated multiplicative process, maximizing E[log(W)] is indeed the *only* coherent strategy that aligns optimization with the observable outcome.** It avoids ruin and achieves the maximum possible growth rate. In this specific context, it feels less like a "preference" and more like a *mathematical imperative for survival and growth*.
  *   **Samuelson's Formalism Holds:** However, Peters' stronger claim of "objective correctness" independent of utility functions overreaches. VNM rationality *does* allow for utility functions where E[W] maximization is rational *even knowing the long-run consequence*. A risk-neutral agent (U(W)=W) is rationally consistent, albeit doomed. A risk-seeking agent (convex U(W)) might actively prefer the gamble despite the negative growth rate. Their choice is "rational" *given their preferences*, even if disastrous *given the laws of multiplicative dynamics*.

  **The Verdict: Objective for the Goal, Subjective for the Preference**

  Here's the definite, qualified verdict you requested:

  **For the specific class of decision problems involving *repeated, identical, multiplicative gambles* where the agent's *explicit and sole objective is the long-term growth rate and survival of their wealth trajectory over time*, maximizing expected log-wealth (the Kelly criterion) is not merely *a* rational strategy, but the *objectively correct standard of rational choice*. In this context, expected linear wealth maximization is incoherent, as it optimizes an unobservable ensemble average that is irrelevant to the agent's observable long-run outcome, guaranteeing ruin almost surely.**

  **However, this objectivity is *goal-relative*.** It assumes the agent intrinsically values long-run geometric growth and survival above all else. If an agent has a different fundamental objective expressed through a different utility function (e.g., maximizing expected wealth over a short horizon, deriving utility from gambling itself, extreme risk-seeking), then maximizing E[log(W)] is *not* objectively correct *for them*, even within this multiplicative process. Samuelson's point that log-utility is smuggled in stands for these alternative preference structures.

  **Analogy from Physics:** Imagine optimizing the pressure in a gas. If your observable is the force on a specific piston wall over time (a "time average"), you optimize using the microcanonical ensemble (fixing energy). Using the canonical ensemble (fixing temperature) would give the correct *ensemble average* pressure but might mispredict the specific piston's time-averaged force if the system isn't ergodic. The "correct" ensemble depends on the observable and the system's properties (ergodicity). Similarly, the "correct" optimization criterion (E[W] vs E[log(W)]) depends on the observable (ensemble avg vs time-avg growth) and the process dynamics (ergodic vs non-ergodic multiplicative). For the single investor focused solely on their long-term wealth trajectory, the time average *is* the observable, and E[log(W)] is the correct optimizer.

  **Conclusion:**

  Peters' ergodicity framing provides a profound and necessary correction to the uncritical application of expected value maximization in multiplicative, non-ergodic settings. It reveals the mathematical incoherence of E[W] as a target for long-term growth in such processes. For the goal of maximizing long-run geometric growth and avoiding ruin in repeated multiplicative gambles, the Kelly criterion (max E[log(W)]) stands as the objectively rational standard. It aligns optimization with the only observable outcome that matters for that goal. However, economics cannot escape the subjectivity of ultimate ends. If an agent's fundamental preferences, as captured by their utility function, prioritize something other than long-run growth survival (e.g., short-term gains, thrill, or linear utility itself), then rationality, defined by preference consistency, permits alternatives – even self-destructive ones. The triumph of geometric rationality is its demonstration that for the paramount goal of enduring multiplicative growth, there is only one mathematically coherent path.
