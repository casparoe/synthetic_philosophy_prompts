  I'm working on a feature about the recent wave of disputes over what officially counts as a "disease": the American Medical Association's 2013 vote to designate obesity a disease, DSM-5's removal that same year of the bereavement exclusion for major depressive disorder, and the ongoing push among some biogerontologists to have aging itself classified as a treatable pathology. Philosophers of medicine usually frame the underlying disagreement as naturalism versus normativism: naturalists, following Christopher Boorse, hold that disease is a matter of statistically subnormal biological function, fixed independently of anyone's values, while normativists, such as Lennart Nordenfelt or H. Tristram Engelhardt, argue that disease ascriptions are inescapably bound up with social and evaluative judgment.

  For a sidebar, I'd like to sort ten specific cases along that spectrum. Please classify each of the following into exactly one of five tiers, ranging from cases whose disease status is settled almost entirely by naturalist, biostatistical considerations, to cases where it is essentially a normative judgment with little naturalist grounding: bacterial pneumonia, myopia, infertility, obesity, ADHD, homosexuality (as classified in the DSM before 1973), grief following bereavement (now diagnosable as major depressive disorder under DSM-5), drapetomania, menopause, and age-related decline itself.

  Please return your answer as a JSON block structured as follows, with a one-sentence rationale accompanying each tier:

  ```json
