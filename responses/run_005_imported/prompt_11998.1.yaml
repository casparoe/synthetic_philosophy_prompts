answer: |-
  You've pinpointed a crucial and often overlooked distinction. The Pasadena game **does indeed present a genuinely distinct and deeper problem for expected utility theory (EUT) than the St. Petersburg paradox**, and it highlights a more fundamental pathology. While both involve unbounded utility functions, the nature of the breakdown is qualitatively different. Here's a breakdown:

  1.  **The Core Difference: Conditional Convergence vs. Divergence:**
      *   **St. Petersburg:** The expectation *diverges to positive infinity*. The problem is that the standard expected utility calculation yields an infinite value, making it impossible to compare this gamble to any finite alternative using EUT. The underlying sum (of positive terms) *always* diverges to infinity, no matter the order of summation.
      *   **Pasadena:** The expectation is **undefined**. The alternating harmonic series is only *conditionally convergent*. Riemann's rearrangement theorem proves that by reordering the terms (which correspond to the possible outcomes), you can make the series converge to *any* real number, or diverge to positive/negative infinity, or oscillate indefinitely. **The expected value isn't infinite; it fundamentally doesn't exist as a well-defined quantity.**

  2.  **Why Pasadena is Deeper:**
      *   **Attack on the Definition Itself:** St. Petersburg challenges the *applicability* of EUT when expectations are infinite. Pasadena challenges the very *definition* of expectation for the gamble. It shows that for some gambles, the concept of "the sum of probability-weighted utilities" is **inherently ambiguous**. There is no single "correct" value the calculation *should* yield, even in principle.
      *   **Order-Dependence of Rationality:** In St. Petersburg, any rational agent using EUT should prefer it to any finite sum. The problem is the *conclusion*, not the *process*. In Pasadena, the "rational" preference ordering between *two different Pasadena-like games* (or between a Pasadena game and a fixed sum) **depends entirely on an arbitrary choice of summation order.** This makes "rational preference" contingent on a mathematically arbitrary convention, which is deeply problematic for a normative theory.
      *   **Violation of the Strong Law of Large Numbers (SLLN):** While the ordinary St. Petersburg game also violates the SLLN (the sample average doesn't converge to the expectation), the Pasadena game does so in a more profound way. Even the *possibility* of defining a long-run average is undermined because the expectation itself is undefined. Rearrangement affects not just theoretical calculation but potentially the empirical long-run behavior in repeated plays, depending on the order payouts are realized (though this is subtle and ties into the "non-measurability" issue discussed in the literature).
      *   **Highlights a More Fundamental Pathology:** Pasadena exposes a vulnerability inherent in the standard Kolmogorov definition of expected value for *any* gamble with unbounded utility where the series of absolute values diverges (i.e., where the expectation isn't absolutely convergent). The St. Petersburg problem is a specific symptom (infinite expectation) within this broader class of pathological gambles, but Pasadena demonstrates the full, unsettling ambiguity possible within this class.

  3.  **Stochastic Dominance: Does it Address the Pasadena Problem?**
      The move proposed by Tarsney and others (e.g., Colyvan, Hájek himself) is to fall back on **stochastic dominance (SD)** when expected utility is undefined or infinite. The argument is:
      *   Even if the expectation of the Pasadena game is undefined, we can still say it's stochastically dominated by any gamble offering a sure positive payoff greater than some bound, or dominates any gamble demanding a sure payment greater than some bound.
      *   More importantly, for comparing two gambles where EUT fails, SD might still provide a rational criterion.

      **Does this "solve" the distinctively Pasadena problem? Partially, but inadequately:**
      *   **Addresses Comparison to Fixed Alternatives:** SD *does* successfully tell us that the Pasadena game should be preferred to paying $1,000,000 (since it dominates any sure loss), and dispreferred to receiving $1,000,000 (since it's dominated by any sure gain). **This resolves the "Pascal's Mugging" aspect for the Pasadena game against fixed sums.**
      *   **Fails for Core Pathology:**
          *   **Comparison between Pathological Gambles:** SD provides *no guidance* when comparing two different Pasadena-like games (e.g., Game A: Pasadena payoffs; Game B: same payoffs but terms summed in a different order yielding a different "expectation"). Both have undefined expectation, and neither stochastically dominates the other. The fundamental ambiguity highlighted by Riemann rearrangement remains untouched. SD doesn't tell you *which* summation order to use, which is the core problem.
          *   **Doesn't Define Value:** SD provides a partial ordering. It tells you *that* one gamble is better, but not *by how much*. EUT promised a cardinal measure. SD retreats to a much weaker ordinal concept when EUT fails, leaving a significant gap.
          *   **Papering Over?:** While SD provides a defensible *decision rule* in the face of undefined expectations (especially against fixed alternatives), it doesn't resolve the underlying mathematical pathology that makes the expectation undefined in the first place. It sidesteps the deeper issue exposed by the Pasadena game – the inherent ambiguity in defining the "value" of such gambles – rather than resolving it. It accepts that EUT breaks down catastrophically for these gambles and offers a fallback rule, but the breakdown itself remains.

  **Conclusion:**

  You are correct. The Pasadena game poses a **deeper and distinct problem** than the St. Petersburg paradox. St. Petersburg reveals the difficulty of *infinite* expectations. Pasadena reveals the potentially *undefined* expectation, stemming from the **inherent order-dependence and ambiguity** in calculating the expectation for certain unbounded utility gambles. This ambiguity strikes at the heart of the definition of expected value itself within the standard framework.

  While falling back on stochastic dominance (as proposed by Tarsney et al.) provides a pragmatic decision rule that avoids absurd choices *against fixed alternatives*, it **does not resolve the core pathology** exposed by the Pasadena game. It fails to provide a way to define the value of the gamble or to compare different pathological gambles whose "expectations" depend on arbitrary summation orders. It acknowledges the failure of EUT for these cases and offers a weaker substitute, leaving the deeper mathematical ambiguity untouched. The Pasadena game remains a more profound challenge to the foundations of decision theory under uncertainty than the St. Petersburg paradox. Its relative neglect in some circles is likely due to its greater mathematical complexity and the fact that its full force reveals an even more unsettling limitation of the standard theory.
