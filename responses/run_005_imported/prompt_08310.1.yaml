answer: |-
  Below is my analysis of each move in Elena and Marcus's exchange, followed by an overall verdict and suggestions for moving forward. I'll assess who has the better argument at each stage based on philosophical coherence, logical validity, and the broader implications for Joyce's accuracy-dominance argument.

  ---

  ### **Move-by-Move Analysis**
  1. **Elena (Praise for Alethic Purity)**  
     **Verdict: Elena has the better argument here.**  
     She correctly identifies the *surface structure* of Joyce's argument: it avoids explicit pragmatic elements (e.g., bets, losses) by framing accuracy dominance in purely alethic terms (truth-directed inaccuracy minimization). Unlike Dutch Book arguments, which rely on coherent preference ordering to avoid sure losses, accuracy-dominance condemns non-probabilism solely on grounds of epistemic inefficiency—some probabilistic rival dominates it in accuracy across all possible worlds. This makes it a stronger *prima facie* case for non-pragmatic epistemic normativity. Marcus hasn't yet undermined this, as propriety isn't invoked until the next move.

  2. **Marcus (Propriety's Pragmatic Origins)**  
     **Verdict: Marcus has the better argument here.**  
     Marcus exposes a critical dependency: Joyce's theorem restricts "legitimate" inaccuracy measures to **strictly proper scoring rules** (e.g., Brier score). Propriety is defined decision-theoretically: a scoring rule is proper if a forecaster maximizes expected utility by reporting their true credence. This concept emerged from pragmatic contexts (e.g., Savage's elicitation theory for weather forecasters). Thus, Marcus is right that a pragmatic notion is "smuggled in" when defining "legitimate" accuracy—without propriety, accuracy-dominance doesn't guarantee probabilism. The argument's normative force *presupposes* a decision-theoretic foundation.

  3. **Elena (Immodesty as Epistemic Self-Defeat)**  
     **Verdict: Standoff, but Elena's point is defensible.**  
     Elena reframes propriety epistemically: an improper rule allows a credence function to *expect* a rival to be more accurate, creating a "self-undermining" defect. This avoids direct appeal to payoffs—it's about doxastic instability, where an agent's own state recommends abandoning itself without new evidence. However, Marcus's lurking circularity worry (next move) isn't fully addressed. Elena's defense *works* if we accept that epistemic rationality includes avoiding self-undermining states, but it doesn't yet resolve whether this evaluation assumes probabilistic coherence.

  4. **Marcus (Circularity in the Immodesty Defense)**  
     **Verdict: Marcus has the better argument here.**  
     Marcus identifies a genuine problem: computing "expected accuracy" requires a probability function to define expectations. If the goal is to *establish* probabilism for non-probabilistic agents, using probabilistic expectations to justify propriety (a premise in the dominance argument) is circular. The immodesty test can only compel *existing* probabilists to prefer proper rules; it doesn't neutrally convince non-probabilists, as they may reject the expectation framework altogether. This risks begging the question against the argument's target audience.

  5. **Elena (Local Justification via Candidate-Wise Testing)**  
     **Verdict: Standoff, but Marcus's worry leaves residue.**  
     Elena's local strategy—testing each candidate credence function *by its own lights*—mitigates circularity but doesn't eliminate it. For **probabilistic candidates**, this works: each function's self-assessment (via its own expectation) shows that only proper rules avoid self-undermining. But for **non-probabilistic candidates**, expectations may be incoherent (e.g., violating additivity), making "self-assessment" undefined or inconsistent. Thus, the test can't be universally applied without assuming probabilistic coherence. Elena's move succeeds in reducing global circularity but fails to fully justify propriety for non-probabilistic agents. Marcus's residue remains: the argument still leans on probabilistic tools to evaluate its premises.

  ---

  ### **Overall Verdict on the Exchange**  
  **Marcus's circularity worry leaves real residue**, even after Elena's move (5). While Elena successfully reframes propriety in epistemic terms (avoiding self-undermining) and localizes the immodesty test to avoid presupposing *which* credence is rational, the argument still **presupposes the coherence of probabilistic expectations** to define "legitimate" accuracy. Non-probabilistic agents lack the tools to run the immodesty test on their own terms, as their incoherent credences may not support consistent expected-accuracy calculations. Thus, the accuracy-dominance argument is best seen as *internally compelling for probabilists* but not a neutral justification for probabilism itself. Marcus correctly identifies a bootstrapping problem: the argument uses probabilistic machinery to police the premises that justify probabilism.

  ---

  ### **What Both Overlook: Key Insights for Moving Forward**  
  1. **Propriety and Probabilism are Co-Dependent**:  
     The debate treats propriety as a premise *for* probabilism, but they are mutually reinforcing. Propriety ensures that accuracy measures respect the "gradational" nature of credences (e.g., scoring rules incentivize reporting true confidence), while probabilism ensures expectations are well-defined. Recognizing this symbiosis reframes the dispute: instead of linear justification, we might see them as a **package deal** for coherent epistemic states.  

  2. **Non-Probabilistic Agents and Alternative Defenses**:  
     Marcus assumes non-probabilists must accept the immodesty test, but they might reject *any* global accuracy optimization. Joyce's argument could be strengthened by showing that **all** non-probabilistic credences are accuracy-dominated *even by their own lights* in specific cases (e.g., using dominance-avoidance constraints). Alternatively, accuracy-first approaches (e.g., Pettigrew's work) might ground propriety in axioms like "Truth-Directedness" and "Propriety" as independent epistemic virtues, not derived from pragmatics.  

  3. **The Role of "Elicitation" in Epistemology**:  
     Both overlook that propriety's pragmatic origin isn't necessarily a flaw—it highlights that epistemic norms often emerge from practices of rational communication (e.g., honest forecasting). This could be embraced: alethic and pragmatic norms may converge in well-designed epistemic systems. If "accuracy" is a master goal, propriety ensures that reporting credences truthfully serves that goal, making the distinction blurrier than Elena admits.  

  **Suggestion for Moving Forward**:  
  Focus on whether propriety can be derived from purely *alethic* constraints (e.g., "no self-falsification") without probabilistic expectations. If not, the accuracy-dominance argument may be a powerful *explanatory* tool for why probabilism coheres with accuracy optimization, but not a standalone *justification* for non-believers. Introducing students to competing accuracy arguments (e.g., Predd et al.'s 2009 geometric approach) or Joyce's later refinements could illuminate new paths. The core tension—can we ground epistemic norms without pragmatic "scaffolding"?—remains fertile ground for formal epistemology.  

