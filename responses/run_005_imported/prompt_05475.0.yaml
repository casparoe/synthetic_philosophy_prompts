prompt: |-
  Since retiring from a career in experimental physics, I have spent the last year or so working through the philosophical literature on objective chance, and I have become stuck on a puzzle that will not let me go. David Lewis's Principal Principle holds that a rational agent's credence in an outcome should simply match the known objective chance of that outcome. But on Lewis's own Humean, best-system account, the chance of an event at a time supervenes on the pattern of the entire history of the world, past and future alike -- so there are always possible "undermining" futures which, were they to occur, would retroactively make some different chance the true one. Lewis regarded this as a serious flaw in his own theory and proposed a repair, the "New Principle," in "Humean Supervenience Debugged." I cannot decide whether that repair really rescues the point of the Principal Principle, or whether the whole episode is actually a decisive argument that only a primitive, non-Humean notion of chance -- a propensity, say -- can do the deferring-to-chance work the principle requires. Could you write a dialogue of about a dozen exchanges between a committed Lewisian about chance, who thinks the New Principle disposes of the undermining worry, and a propensity theorist, who thinks the whole affair shows that Humeanism cannot ground the Principal Principle at all? Neither should have the easier case: each should engage with the other's actual point as it comes up, including whatever the propensity theorist has to say about how we could ever get evidential access to a propensity in the first place. Please do not let them settle the matter tidily -- end with each stating, in a sentence or two, exactly where they think the other has gone wrong.
reasoning: |-
  We are going to create a dialogue between two characters: 
    - Lewisian: A defender of Lewis's Humean Best System Account (HBSA) and the New Principle (NP).
    - Propensity Theorist (PT): A defender of primitive, non-Humean propensities.

   The topic: Does the New Principle solve the undermining problem and save the Principal Principle, or does the undermining problem show that only propensities can do the job?

   Structure:
   1. Start by setting the scene: the undermining worry for HBSA and the Principal Principle (PP).
   2. Lewisian presents the New Principle as the fix.
   3. PT argues that even the New Principle fails because it still depends on the Humean base (the entire history) and thus cannot ground rational credence in the way PP requires.
   4. Lewisian counters that the New Principle does work by conditionalizing on the chance theory itself.
   5. PT presses the point about evidential access to propensities and why they are necessary.
   6. Lewisian questions how we can know propensities without any Humean base.
   7. End without resolution, each stating where the other goes wrong.

   Key points to cover:

   For Lewisian:
     - The original PP: Cr(A | ch(A)=x, E) = x, where E is admissible.
     - Undermining: A future that would make the chance theory false, even though the theory assigns positive chance to that future.
     - New Principle: Cr(A | H_tw Tw) = ch_tw(A | Tw), where Tw is the chance theory and H_tw is the history up to time t in world w. 
       (In Lewis's words: the chance of A given the theory T is the chance that T assigns to A holding at t and conditional on T itself being true.)

   For PT:
     - Propensities are irreducible and modally robust. They don't supervene on the entire history but are features of the world at a time.
     - They ground the PP because we can have direct knowledge of them (via evidence of their manifestations, perhaps) and they are not undermined by future events.
     - The problem with HBSA is that it makes chance depend on the future, so we cannot have the right kind of deference to chance in our credences.

   Dialogue:

   Setting: Two philosophers meeting at a conference coffee break.

   Characters:
     - Lewisian: Confident that the New Principle is the fix.
     - PT: Skeptical and pushing for propensities.

   Exchanges:

   1. Lewisian: I've been thinking about the undermining problem, and I'm convinced that the New Principle in "Humean Supervenience Debugged" solves it. The original Principal Principle had a flaw when combined with Humean supervenience, but by conditionalizing on the chance theory itself, the New Principle avoids assigning positive credence to undermining futures.

   2. PT: But that's just the problem. The New Principle tells us to set our credence to ch_tw(A | Tw). But what is Tw? It's the Humean best system for the entire world, including the future. So if there's an undermining future, then Tw isn't true! The New Principle requires us to condition on Tw being true, but in the actual world, if an undermining future occurs, then Tw is false. So how can we condition on it?

   3. Lewisian: That's exactly the point. The New Principle says: given that Tw is the true chance theory, what chance does it assign to A at time t? And crucially, we condition on Tw being true. So if an undermining future were to occur, then Tw wouldn't be the true theory. But in the worlds where Tw is true, the undermining future doesn't occur. So we don't have to worry about undermining futures in the worlds where Tw holds.

   4. PT: But that seems circular. You're saying that in the worlds where Tw is true, the undermining future doesn't occur. But that's because Tw, by being the best system, must fit the entire history. So if the undermining future were to occur, Tw wouldn't be the best system. But then, how do we know that Tw is the true theory? We don't have access to the entire history. At time t, we don't know the future. So how can we condition on Tw being true? We can't know Tw until all the facts are in.

   5. Lewisian: We don't have to know Tw with certainty. We can have credences over what the chance theory is. And the New Principle applies to each candidate theory. So we set our credence in A given a candidate theory T as the chance that T assigns to A conditional on T itself. Then we average over our credences in the candidate theories. That's how we handle uncertainty about the chances.

   6. PT: But now you're back to the same problem. The chance that T assigns to A conditional on T is defined only if T is true. And T being true depends on the entire history. So when we consider a candidate T, we are considering a world where the entire history (including the future) is such that T is the best system. But that means that in the candidate world, the future must be one that makes T the best system. So when we condition on T, we are effectively conditioning on the future being non-undermining for T. But then, what about the possibility that the future is undermining? That possibility is ruled out by conditioning on T. But we don't know the future! So how can we conditionally set our credence in a way that ignores the undermining possibilities that we are uncertain about?

   7. Lewisian: The point is that the undermining possibilities are not possibilities in which T is true. So they are ruled out when we condition on T. And when we don't condition on T, we have our credence over T. The undermining possibilities are taken into account in our credence over T. For example, if there is a high chance (according to T) of an undermining future, then T will assign a low chance to its own truth? Not exactly. But note: the New Principle uses ch_tw(A | Tw). And if T assigns a positive chance to an undermining future, then ch_tw(Tw) is less than 1. But we don't condition on Tw in the original PP way. We condition on Tw and then use ch_tw(A | Tw). And ch_tw(A | Tw) is defined as the chance that Tw assigns to A given that Tw is true. But in the world where Tw is true, the undermining future doesn't occur, so ch_tw(A | Tw) is just the chance that A occurs in a world where Tw is true and the future is non-undermining.

   8. PT: But this is where I think the Humean account fails. You are forced to condition on the entire history to even define chance. But the Principal Principle is supposed to guide our credences when we don't know the future. If chance itself depends on the future, then it cannot serve as an objective guide for rational credence about the future. Only a propensity, which is a feature of the present, can do that. A propensity is a real physical disposition that exists now and constrains the future. It doesn't depend on what actually happens in the future. So we can set our credence to the propensity without worrying about undermining.

   9. Lewisian: But how do you know the propensity? How can we have evidence about it? All we have are the actual frequencies and patterns. Without the Humean base, propensities are mysterious. They are supposed to be objective, but how do we measure them? How do we even know they exist?

   10. PT: We infer propensities from the evidence, just as you infer the best system. But the difference is that the propensity is a real feature of the world at the time. It doesn't change because of what happens later. So when I observe a coin toss, I can form a credence about the next toss based on the propensity I've inferred from past tosses. And that propensity is a fact about the coin now. It doesn't supervene on the entire history of the world. So no undermining future can change the propensity that existed at the time. Therefore, the Principal Principle works without any need for a New Principle.

   11. Lewisian: But if the propensity is inferred from past frequencies, then it's still based on the Humean mosaic. And if the future turns out very differently, then our inference was wrong. But that's the same as the Humean saying that if the future is undermining, then the chance theory we thought was true wasn't. So what's the difference?

   12. PT: The difference is ontological. The propensity is a real, irreducible property of the system at the time. It is not defined by the frequencies. Frequencies are evidence for propensities, but they do not constitute them. So even if the future turns out to have a long run of tails after many heads, that doesn't mean the propensity at the time was different. It just means we had bad luck. In the Humean view, that long run of tails would change the chance theory for the entire history, including the past. That's absurd.

   13. Lewisian: But then how do you avoid the problem of identifying the propensity? If the same set of frequencies can be produced by different propensities, how do you ever know the propensity? And if you can't, then how can the Principal Principle be applied? It seems you've replaced an objective chance with something we can't access.

   14. PT: It's true that we may not know the propensity with certainty, but that's an epistemic problem. The propensity is there, and we can have evidence for it. The Principal Principle says that if we knew the propensity, we should set our credence to it. But the Humean doesn't even have a stable chance for us to know at a time because the chance at a time depends on the future. So the Humean chance cannot play the role of an objective guide.

   15. Lewisian: But the New Principle does provide a stable guide. It tells us to set credence to ch_tw(A | Tw), and that is well-defined at a time in a world. And it doesn't change as the future unfolds because Tw is fixed for the world.

   16. PT: But how can we know Tw at a time when the future is unknown? We can't. So we have to have credences over what Tw is. But then we are back to the problem: when we consider a candidate T, we are forced to condition on T being true, which means we are conditioning on the entire future. But we don't know the future. So we are effectively ignoring the undermining possibilities that we are uncertain about. The New Principle only works if we already know the entire history. But we don't.

   17. Lewisian: I think you're misrepresenting the New Principle. We don't need to know the entire history. We use our current evidence to form credences about what T is. And then we apply the New Principle for each candidate T. The conditioning on T is part of the definition of the chance for that candidate. It's a hypothetical: if T is the true theory, then the chance of A is T's conditional chance for A given T. And we update as we get more evidence.

   18. PT: But when we update, we change our credence about T. And if T is the true theory, then we are updating in a way that assumes the future will not be undermining. But we don't know that. So we are biased against undermining futures. The problem is that the Humean account makes chance depend on the future, and that breaks the connection between chance and rational credence.

   19. Lewisian: And I think your propensity account postulates mysterious entities that we cannot measure and that don't supervene on the actual events. That's not science; that's metaphysics without empirical grounding.

   20. PT: And your Humean account makes chance depend on the future, which makes it useless for guiding credence. The New Principle is a patch that doesn't fix the underlying problem.

   Final statements (as per request):

   Lewisian: You go wrong by rejecting the Humean constraint that everything must supervene on the actual mosaic of events. Without that, you have no way to ground chance in the world we observe.

   PT: You go wrong by making chance depend on the future, thereby violating the very idea of chance as an objective guide for rational credence in the face of an open future.

   Let's write the dialogue accordingly.
answer: |-
  **Setting:** Two philosophers meet at a café near a conference on metaphysics. LEWISIAN, a defender of Lewis's Humean Best System Account (HBSA), sips espresso. PROPENSITY THEORIST (PT), advocating for irreducible propensities, stirs herbal tea.  

  ### **Dialogue:**  
  1. **LEWISIAN:** The undermining worry for HBSA is real, but Lewis’s New Principle solves it. Instead of naively equating credence with unconditional chance, the New Principle sets credence to the chance *conditional on the chance theory itself*: \( \text{Cr}(A | H_t T_w) = \text{ch}_{tw}(A | T_w) \). This avoids assigning high credence to futures that would undermine \( T_w \).  

  2. **PT:** But that’s circular! \( T_w \) is defined by the *entire* Humean mosaic—past and future. If \( T_w \) says “chance of heads is 0.5,” but a future of all tails would retroactively make a *different* theory \( T_{w'} \) true, then conditioning on \( T_w \) artificially excludes undermining futures. Yet in the actual present, we don’t *know* the future—so your “conditional chance” presupposes we’ve already ruled out undermining possibilities we ought to be uncertain about.  

  3. **LEWISIAN:** Not so. The New Principle handles uncertainty by averaging over candidate theories. At time \( t \), you have credences about which \( T_w \) is true. For each candidate, \( \text{ch}_{tw}(A | T_w) \) is well-defined because it’s the chance *that theory assigns* to \( A \) *given its own truth*. Undermining futures are weighted by your credence in theories where they *don’t* occur.  

  4. **PT:** But that just relabels the problem. HBSA ties chance to global patterns, so \( \text{ch}_{tw}(A | T_w) \) still depends on the future. If I’m rational, my credence in heads today must account for the *possibility* that the future will be “undermining” and falsify my current best theory. Yet the New Principle forces me to set credence as if \( T_w \) is fixed—ignoring that very possibility! Only propensities, as irreducible dispositions *now*, ground chances independent of the future.  

  5. **LEWISIAN:** How? Propensities are occult. If chances aren’t grounded in actual frequencies and laws, how do we *know* them? Lewis’s HBSA uses the mosaic as evidence. You’ve got a metaphysical hammer—propensities—with no epistemological nail.  

  6. **PT:** Not at all! We infer propensities from patterns in the mosaic, just as you infer Humean chances. But unlike HBSA, propensities are *local*: a fair coin has a 0.5 propensity for heads *now*, even if an unlikely future of all tails would make Humeans wrongly call it biased. We access propensities via evidence of their manifestations—e.g., symmetries in setup or statistical data—without needing the entire future.  

  7. **LEWISIAN:** But your “inference” is circular too! If you use frequencies to estimate propensities, doesn’t a future of all tails *refute* your claim that the propensity was 0.5? You’re just calling your ignorance “propensity” and pretending it’s objective.  

  8. **PT:** No—propensities are truthmakers for frequencies, not defined by them. A coin can have a 0.5 propensity *and* land tails 100 times by luck. That doesn’t change the past propensity; it means we misjudged it. Whereas for you, the “chance” at \( t \) *changes* if the future changes. How can that guide credence at \( t \)?  

  9. **LEWISIAN:** It doesn’t change! \( \text{ch}_{tw}(A | T_w) \) is fixed for a world \( w \). The New Principle works because it respects supervenience: in \( w \), \( T_w \) is true, so undermining futures *don’t happen*. Credence matches chance *within* \( w \).  

  10. **PT:** But rational agents aren’t omniscient about \( w \)! At \( t \), I don’t know if my world has an undermining future. The Principal Principle should guide me *despite* this ignorance. HBSA can’t do that because chance itself depends on what I’m ignorant *of*. Propensities are knowable from current evidence alone.  

  11. **LEWISIAN:** Current evidence underdetermines propensities. Two systems with identical histories up to \( t \) could have different propensities—how would you tell? HBSA avoids this: chances supervene on the mosaic, so identical histories *entail* identical chances.  

  12. **PT:** Then HBSA is *too* objective—it makes chance depend on the future, sabotaging its role in guiding credence. The New Principle is a patch that doesn’t address the core flaw: Humean chance isn’t independent of what it’s supposed to inform us *about*.  

  ### **Final Standoff:**  
  **LEWISIAN:** You go wrong thinking chance must be metaphysically independent of the future to guide credence. But rationality doesn’t require prophecy—the New Principle coherently handles uncertainty by conditionalizing on theories of the whole mosaic. Your propensities are inaccessible and redundant.  

  **PT:** *You* go wrong by making chance hostage to future contingencies, stripping it of its normative force. The New Principle’s “fix” still ties chance to the very futures it should constrain, while propensities—grounded in present dispositions—are knowable through their causal-nomological role.
