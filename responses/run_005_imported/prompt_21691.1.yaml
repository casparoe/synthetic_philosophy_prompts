answer: |-
  Based on a rigorous reading of Augustine's *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying), here's his likely verdict on therapeutic fibbing in your grandmother's case, addressing your specific points:

  1.  **The Core Verdict: Always Sinful**
      Augustine's position is absolute: **any intentional utterance with the purpose of deceiving another is a lie and is always a sin against God.** He states unequivocally: *"Every lie is a sin"* (*De Mendacio* IV.5) and *"No lie is of the truth"* (*Contra Mendacium* XII.26). Therapeutic fibbing, as described (telling her he's "at work" *with the specific intent* that she believe this falsehood to avoid distress), fits his definition perfectly. It is an *officium mentiendi* (duty/business of lying) undertaken with the *voluntas fallendi* (will to deceive). **Therefore, Augustine would unequivocally condemn it as sinful.**

  2.  **The Listener's Inability: Irrelevant to the Sin**
      You correctly identify that Augustine's primary objection centers on the *liar's* state (*"mendacium in corde"* - the lie in the heart) and their relationship to God/Truth, *not* primarily on the effect on the deceived or the success of the deception.
      *   **Retention/Discovery:** Your grandmother's inability to retain the truth, experience lasting grief from it, or ever discover the deception is **entirely irrelevant** to Augustine's core argument. The sin resides in the *intent* of the speaker at the moment of utterance. Whether the deceived person forms a lasting false belief, feels betrayed later, or even benefits from the lie, does not mitigate the sin for Augustine. The act of *willing deception* itself corrupts the soul.
      *   **"Wronged Listener" Framework:** You're right that Augustine's examples presuppose a listener capable of being deceived in the ordinary sense. However, his *principle* is not contingent on that listener's capabilities. His condemnation of lying is ontological and theological, not consequentialist. The listener's cognitive state doesn't alter the nature of the act as he defines it. **The verdict remains completely untouched by the listener's dementia.**

  3.  **Redirection vs. Lying: A Permissible Evasion?**
      Augustine explicitly permits evasion and silence to avoid both lying *and* revealing harmful truths (*De Mendacio* X.24, XIII.22; *Contra Mendacium* X.22). He calls this *"occultatio"* (concealment) or *"dissimulatio"* (dissimulation).
      *   **Steering Towards Photographs:** If the caregiver *avoids a direct answer* to "Where is Grandpa?" and instead says, *"Let's look at these lovely pictures of you both,"* **Augustine would likely permit this.** This avoids both:
          *   Affirming a falsehood (*mendacium* - the lie).
          *   Uttering the harmful truth (*veritas noxia* - which he also condemns revealing in certain contexts).
      *   **The Crucial Distinction:** The difference lies in the *intent*. The redirect avoids the question without *intending the listener to form a specific false belief*. The intent is to *distract* or *change the subject*, not to *deceive* her into believing Grandpa is at work. Augustine cares intensely about this internal *voluntas fallendi*. If the redirect is done *without* that will to implant a falsehood, it falls under permissible dissimulation.
      *   **Misdirection vs. Falsehood:** Augustine *would* treat engineered misdirection **differently** than an outright falsehood *only if* the misdirection avoids asserting something false. Saying "Look at the bird!" to distract someone asking an awkward question is dissimulation. Saying "He's not here right now" (implying he's elsewhere alive) when he's dead is a lie, even if indirect. The key is whether the *words themselves* are true or false *and* the intent. A true statement can be deceptive (which he also condemns if the intent is to deceive - *Contra Mendacium* XI.24), but a false statement with intent to deceive is always the core lie.

  4.  **Place in the Hierarchy: Near the "Top," But Still Sinful**
      Augustine's hierarchy (*De Mendacio* XIV.25-XXV.41) ranks lies from most to least sinful. Therapeutic fibbing would likely fall into his **8th and "least" sinful category: *"In jocis"* (in jokes/harmless contexts).**
      *   **Reasoning:** His description of this category: *"when a man lies in joking, and this very lying is part of his joke... not in order to deceive... but for the pleasure he gets from the lying itself."* While not a perfect fit (it's not for "pleasure"), it's the closest. Therapeutic fibbing:
          *   Is told with benevolent intent (to spare pain).
          *   Causes no direct harm (prevents immediate anguish).
          *   Isn't told for personal gain, religious corruption, or serious harm to others (the worse categories).
      *   **Crucially:** Even this "least" sinful lie is **STILL A SIN.** He states: *"But who would deny that all these kinds of lies are sins, albeit not equally great sins?"* (*De Mendacio* XIV.25). He offers *no* category of lies that are not sinful. The therapeutic intent makes it "venial" in his scale (less damnable), but it remains a moral failing that damages the liar's soul before God.

  **Conclusion:**

  Augustine, based solely on his writings *De Mendacio* and *Contra Mendacium*, would deliver a harsh verdict on therapeutic fibbing:

  1.  **It is always a sin,** as it involves the *voluntas fallendi* (will to deceive).
  2.  Your grandmother's dementia and inability to retain the truth or discover the deception **do not mitigate the sin,** as the sin resides in the liar's intent, not the deceived's perception.
  3.  **Redirection (like steering to photos)** is permissible if it avoids both the lie *and* the harmful truth through silence or a true but evasive statement *without* the intent to implant a specific false belief. It qualifies as *occultatio*.
  4.  Therapeutic fibbing would likely fit into his **8th category ("in jocis" - least sinful lies),** justified by benevolent intent and lack of direct harm, **but it remains a sin nonetheless.**

  Augustine's framework offers no loophole for compassion in this scenario. His ethic is radically God-centered and truth-centered: the integrity of the soul before the Divine Truth outweighs any temporal suffering, even the profound and repeated grief caused by dementia. The permissible path, for him, lies solely in silence, evasion, or speaking a difficult truth – never in intentional falsehood, regardless of consequence or the listener's capacity.
