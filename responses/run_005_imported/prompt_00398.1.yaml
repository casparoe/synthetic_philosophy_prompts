  So I fell down a wikipedia rabbit hole last night and ended up reading about the St. Petersburg paradox - the coin flip game where the pot doubles every time it lands heads and you keep flipping til it lands tails, and apparently the expected value of that game is technically infinite but nobody in their right mind would pay more than like $20 to play it. My brother and I got into an arguement about whether this is just a cute math trick or if it actually says something real about how people (or how they SHOULD) make decisions involving risk, since he trades crypto and I feel like he's basically playing some version of this game every single day with how he sizes his bets. Can you lay out what you think are the biggest real world implications of this paradox - like for stuff such as insurance, gambling, investing, or even just how much someone should trust "expected value" as a guide once the stakes or payoffs get really lopsided? I'm not looking for the textbook explanation of the paradox itself, I already get the math part, I'm more interested in what it actually tells us about rational decision-making once you leave the pure math behind and apply it to messy real life stuff.
