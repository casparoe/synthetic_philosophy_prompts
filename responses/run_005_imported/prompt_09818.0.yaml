answer: |-
  You've hit on the *exact* tension that makes Nagarjuna's thought so profound and challenging, and it's the core debate within contemporary Madhyamaka scholarship interpreting him through a dialetheic lens (Garfield/Priest vs. thinkers like Tillemans, Siderits, or Deguchi). Your intuition is spot-on: asserting a genuine contradiction *seems* to require fixed referents, but emptiness denies just that. **The key resolution lies in understanding that the contradictions *arise from* and *exemplify* emptiness, rather than contradicting it.** Here's a breakdown:

  1.  **Emptiness as the Ground of Contradiction:**
      *   Nagarjuna isn't saying "Things *have* fixed natures, and *also* their negations." He's saying: *Because* things lack fixed, independent natures (svabhava), conventional attempts to pin them down with predicates like "real," "unreal," "both," or "neither" inevitably lead to contradictions *when pushed to their logical limits*.
      *   The contradictions aren't about stable, self-contained entities (A) and their stable negations (¬A). They arise precisely *because* there *are* no such stable entities. The very concepts ("real," "existent," "caused," "self," etc.) are themselves empty and interdependent. Trying to apply them definitively generates paradox.

  2.  **The Catuskoti as Deconstructive Tool, Not Affirmative Ontology:**
      *   Nagarjuna's primary use of the catuskoti isn't to affirm *any* of the four positions (including "both" and "neither") as ultimately true descriptions of reality. It's a tool to exhaust *all* possible conceptualizations and show they all fail under analysis (prasanga).
      *   Verse 18:8 ("Everything is real, or is unreal, or is both real and unreal, or is neither. This is the graded teaching of the Buddhas." - Garfield trans.) is often read *not* as an affirmation of all four simultaneously as *ultimate truths*, but as:
          *   A description of the *conventional level* of discourse where people use these terms loosely.
          *   A demonstration that *any* of these assertions, when taken as describing an ultimately existing thing, leads to absurdity or contradiction.
          *   Precisely *because* of emptiness, conventional reality *appears* contradictory when analyzed logically with concepts demanding fixed referents. The "both" and "neither" options highlight the failure of binary logic applied to empty phenomena.

  3.  **Paraconsistency & Conventional Truth:**
      *   Garfield and Priest argue that Nagarjuna *does* genuinely assert contradictions, but crucially, **at the level of conventional truth (samvrti-satya)**. Conventional reality *is* shot through with contradictions *precisely because* it's empty. Emptiness *manifests* as logical inconsistency under analysis.
      *   Paraconsistent logic provides a framework to handle these contradictions *without* trivializing the system (explosion), allowing us to reason meaningfully *within* the conventional realm *despite* its inherent inconsistencies. This doesn't require fixed essences *ultimately*; it describes the messy, interdependent, conceptually fluid nature of conventional reality.
      *   The "A" in the contradiction "A and ¬A" isn't a stable, ultimate referent. It's an inherently empty, conventional designation. The contradiction bites *because* the designation is incoherent under ultimate analysis, yet pragmatically useful conventionally.

  4.  **The "Price of Admission" is Embracing Paradox:**
      *   You're right that there's a tension. The brilliance (and difficulty) of reading Nagarjuna dialetheically is that **the ultimate truth (emptiness) *itself* undermines the possibility of making any ultimately true statement, *including statements about emptiness or dialetheia***. This is the famous "emptiness of emptiness."
      *   Garfield/Priest argue that Nagarjuna *embraces* this paradox: the ultimate truth *is* that there is no ultimate truth describable without contradiction. Asserting the contradictions *is* the way to point to the inexpressible ultimate truth beyond conceptual proliferation (prapanca).
      *   **The resolution isn't *removing* the tension, but recognizing the tension *as* the point.** Emptiness *means* that reality resists consistent, non-paradoxical conceptualization. Dialetheic logic formalizes how we can navigate this conceptually without falling into nihilism or absolutism.

  **Sanity Check for Your Nut Graf:**

  *   **Do:** "Ancient Buddhist monk Nagarjuna, through his doctrine of emptiness and radical tetralemma (catuskoti), explored the limits of logic and conceptual thought in ways that strikingly prefigure modern paraconsistent logic and dialetheism. He demonstrated how the fundamental lack of fixed essence (svabhava) in all things renders conventional reality inherently prone to true contradictions, a view only formally systematized by Western logicians in the 20th century."
  *   **Avoid:** Simply "Nagarjuna beat Western logicians to the punch on true contradictions." This oversimplifies.
  *   **Nuance is Key:** Emphasize that his contradictions are:
      *   A *consequence* of emptiness, not about fixed things.
      *   Primarily deconstructive tools showing the failure of concepts *or* descriptions of conventional reality's paradoxical nature.
      *   Situated within the framework of the Two Truths (conventional vs. ultimate).
      *   Not an affirmation of stable metaphysical dialetheias, but an acknowledgment of conceptual incoherence arising from emptiness.

  **Conclusion:** You're not missing something simple; you've grasped the core philosophical puzzle. The tension *is* real, but for Garfield/Priest and dialetheic interpreters, it's not a flaw in Nagarjuna's system, it's the engine driving it. Emptiness *enables* and *necessitates* the possibility of true contradictions at the conventional level, precisely by denying the fixed essences that classical logic assumes. Paraconsistent logic provides the formal machinery to model this radical insight without collapse. Your nut graf can absolutely capture this groundbreaking anticipation, provided it highlights the unique context of emptiness and the Two Truths. Good luck with the piece!
