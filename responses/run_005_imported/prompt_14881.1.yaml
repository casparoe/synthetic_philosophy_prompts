prompt: |-
  ok so I'm running for student council (ASB) president and tomorrow at the election assembly literally my whole grade (idk, like 480 kids) has to sit through every candidate's speech before they vote, and I only get about 2 minutes. Here's my actual problem though: we just covered "the paradox of voting" in AP Gov, and my teacher put up this formula, something like R = PB + D − C (don't hold me to the exact letters, I might be misremembering), to show that once P — the odds that your one vote is literally the vote that decides the election — is basically zero, the whole expected payoff of voting collapses unless something else in there is doing alot of secret work, so on paper a fully rational person shouldn't even bother once you weigh that against literally any cost, even something as small as the 30 seconds it takes. My two best friends are on the math team and have been clowning me about this for like a week, so if I get up there tomorrow and give the generic "every single vote counts, YOUR voice matters!!" speech, they are 100% going to be dying in the back row, because the three of us have already gone through why that's not really true in any strict sense.

  Problem is I still need the speech to actually work on the other 470ish people who are not thinking about decision theory at all and just want a normal, kind of hype campaign speech, and I do genuinely want turnout to go up since barely half the grade usually bothers voting. My teacher mentioned, kind of in passing, that there are real philosophical/economic comebacks to this — something about how it's not really about the odds of your individual vote, and something about what happens if everyone used that same logic as their reason not to vote — but then she just moved on to the next slide, and I don't trust myself to reconstruct whatever she was gesturing at without butchering it. Could you actually write the speech for me (under 300 words, needs to be sayable in about 2 minutes), built around whichever of those comebacks genuinely holds up, and if you can slip in one line that works as a little inside joke for my math team friends specifically without losing everyone else, even better.
