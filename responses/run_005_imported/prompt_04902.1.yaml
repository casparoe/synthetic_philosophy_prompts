prompt: |-
  Hey, could use some help prepping for an interview -- next week I'm talking to an economist for a piece on what 'utility' actually means, and she's a real hardliner for revealed preference theory (the Samuelson / Gul-and-Pesendorfer "mindless economics" line): utility is just a label for whatever consistent pattern shows up in someone's choices, full stop, no hidden satisfaction or well-being underneath it. Can you draft like 8-10 questions that don't just let her restate that position? I want at least one question on the charge that this makes the theory unfalsifiable/tautological (the Sen "rational fools" point -- if you can always redefine the preference after the choice to fit it, what does the theory actually rule out), one on Kahneman/Tversky-style framing effects and preference reversals that seem to show "preference" isnt stable across contexts, and one on the Allais paradox and whether violating the independence axiom is really irrationality or just a problem with the axiom. End with a question that pins down what observation would actually count as evidence against her view. For each, throw in a quick follow-up keyed to the answer she'll probably give -- her go-to move is "that's a modeling choice, not a psychological claim."
reasoning: |-
  Okay, the user is preparing for an interview with an economist who strongly adheres to revealed preference theory, specifically the Samuelson and Gul-Pesendorfer "mindless economics" perspective. They need challenging questions that push beyond surface-level restatements of the theory.  

  The user explicitly wants three specific angles covered:  
  - The unfalsifiability/tautology critique (Sen's "rational fools" argument)  
  - Framing effects and preference reversals (Kahneman/Tversky)  
  - Allais paradox and independence axiom violations  

  Plus a knockout question about what evidence could falsify the theory. They also note the economist's trademark deflection: "that's a modeling choice, not a psychological claim."  

  Hmm... this requires surgical precision. The economist will likely retreat into formalism when pressed, so questions must force engagement with real-world implications. The tautology point is crucial—if any behavior can be rationalized post-hoc, does the theory have teeth?  

  For framing effects: The key is to highlight how contextual shifts reveal unstable "preferences" that can't be explained by stable underlying utility. The follow-up must preempt the "modeling choice" dodge by asking why we should care about such fragile constructs.  

  Allais paradox needs to challenge whether violating independence is truly irrational or if the axiom itself is flawed. The follow-up should corner her on whether axioms are empirical or definitional.  

  The falsification question is the climax. It must demand concrete conditions where she'd abandon revealed preference. No letting her wiggle out with "it's just a tool."  

  User's clearly done their homework—citing Sen, Kahneman/Tversky, Allais. They need scalpels, not sledgehammers. The economist won't yield easily, so every question needs a trapdoor follow-up.  

  ... Drafting questions now. Making sure each one:  
  - Targets a specific crack in revealed preference  
  - Has a follow-up that blocks the "modeling choice" escape hatch  
  - Ends with the falsification litmus test
answer: |-
  Here’s a set of 8 targeted questions designed to challenge the revealed preference (RP) framework without letting your interviewee retreat into formalism. Each includes a follow-up anticipating the "modeling choice" deflection:

  1. **Core Tautology Charge (Sen):**  
     *"If revealed preference defines utility solely by observed choices, and any choice pattern can be rationalized post-hoc by constructing suitable preferences, what empirical content does the theory retain? Doesn’t this make it unfalsifiable?"*  
     → **Likely reply:** *"It’s a descriptive tool for modeling behavior, not a psychological claim."*  
     **Follow-up:** *"If the theory accommodates literally any behavior (e.g., intransitive cycles, self-harm) by redefining preferences, how does it differ from saying 'people do things'? Where’s the explanatory value?"*

  2. **Framing Effects & Context-Dependence (K/T):**  
     *"Kahneman-Tversky showed choices reverse under trivial framing changes (e.g., 90% survival vs. 10% mortality). If preference is just a label for choice, does RP imply people have different 'preferences' in logically identical scenarios? Doesn’t this reduce 'preference' to a description of noise?"*  
     → **Likely reply:** *"We model the frame as part of the choice context."*  
     **Follow-up:** *"But if the frame is arbitrarily folded into the 'preference' label, doesn’t RP lose predictive power? How can it anticipate choices in new frames if preferences are context-defined after the fact?"*

  3. **Allais Paradox & Axiom Critique:**  
     *"When people violate the independence axiom (e.g., Allais paradox), RP deems it 'irrational.' But if utility is only defined by choice consistency, isn’t labeling axiom-violations as irrational circular? Could the axiom itself be mis-specified for human psychology?"*  
     → **Likely reply:** *"Axioms are modeling conventions for tractable utility representation."*  
     **Follow-up:** *"If violating axioms is 'irrational' by definition, but rationality is defined by axiom-compliance, isn’t this tautological? What independent evidence supports the axioms beyond mathematical convenience?"*

  4. **Welfare Implications:**  
     *"RP deliberately severs utility from well-being. But if policymakers use RP-based welfare economics (e.g., consumer surplus), aren’t they implicitly smuggling in psychological assumptions about welfare?"*  
     → **Likely reply:** *"RP offers objective, choice-based welfare criteria without mental states."*  
     **Follow-up:** *"If someone consistently chooses heroin over food, does RP welfare economics recommend facilitating that? If not, what justifies overriding 'revealed preference' without invoking well-being?"*

  5. **Stability Over Time:**  
     *"People often regret past choices (e.g., undersaving). RP treats each choice as valid in its moment. Doesn’t this make the theory unable to distinguish between growth and inconsistency, or between informed vs. coerced choices?"*  
     → **Likely reply:** *"We model time-specific preferences; regret reflects changing preferences."*  
     **Follow-up:** *"If preferences can change instantly and unpredictably, can RP distinguish a 'mistake' from a 'preference shift'? Doesn’t this render the theory empirically vacuous?"*

  6. **Neuro/Behavioral Evidence:**  
     *"Neuroeconomics shows brain activity predicting choices before conscious 'preference' formation. If choice reveals preference, but physiology predicts choice independently, doesn’t this suggest preferences aren’t fundamental but epiphenomenal?"*  
     → **Likely reply:** *"RP is agnostic about mechanisms; it models choices, not causes."*  
     **Follow-up:** *"If neuroscience can predict choices better than RP models in some cases (e.g., impulse decisions), why should we privilege choice-derived 'preference' as the core construct?"*

  7. **Revealed vs. Expressed Preferences:**  
     *"Surveys often predict choices poorly (e.g., voting vs. polls), but people also express preferences for things they never choose (e.g., charity). Does RP dismiss this as irrelevant, or is it a limitation of reducing preference to choice alone?"*  
     → **Likely reply:** *"RP focuses on consequential actions; hypotheticals are unreliable."*  
     **Follow-up:** *"If expressed preferences reflect moral/aspirational values that guide *some* choices (e.g., career switches), doesn’t excluding them make RP models descriptively incomplete?"*

  8. **The Falsification Question:**  
     *"What observable phenomenon would force you to concede that revealed preference *cannot* adequately explain behavior? Could repeated, systematic violations of *any* rationality axiom across populations qualify?"*  
     → **Likely reply:** *"We’d refine the model (e.g., adding constraints, context), not abandon RP."*  
     **Follow-up:** *"If *no* behavior can falsify RP—since anomalies are always resolved by redefining preferences/context—isn’t it a metaphysical stance, not science?"*

  ### Key Strategy:
  - **Anticipate Deflections:** Her "modeling choice" rebuttal is pre-empted in follow-ups by demanding empirical stakes ("If it can’t predict X..." / "If it accommodates Y...").
  - **Pressure Test Rigor:** Questions #1, #3, and #8 directly challenge RP’s scientific status.
  - **Highlight Paradoxes:** #2 and #3 force engagement with behavioral anomalies RP struggles to explain.
  - **Expose Normative Tensions:** #4 and #7 question RP’s real-world applicability.

  **Final Tip:** If she dodges, restate the question: *"To clarify, I’m asking what *empirical evidence* would undermine RP, not how you’d adjust the model."* This pins her to Popperian falsifiability. Good luck!
