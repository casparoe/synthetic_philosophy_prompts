  Another angle: the user wonders if a reflective Bayesian must accept CPA. I think subjectivists would say no; updating rules don't enforce shared priors. But maybe in idealized scenarios with common knowledge, CPA becomes necessary? Harsanyi's type structures in game theory might be relevant here.

  The friend's position relies on Aumann’s theorem, which requires CPA. Without CPA, the theorem doesn't hold. So, in real-world disagreements, differing priors can persist without irrationality. The user's view seems valid unless CPA is assumed, which isn't universally accepted.

  I should also address whether the open disagreement implies irrationality. Without CPA, no. But perhaps in specific contexts like science, converging priors are expected, though that's more pragmatic than rational necessity.

