prompt: |-
  My mother was diagnosed with Huntington's disease three months ago, which puts me at a 50 percent risk of carrying the same mutation myself. I've been agonizing over whether to pursue predictive genetic testing, and a friend who studies decision theory told me that Good's theorem shows a rational Bayesian agent's expected value from acquiring free information is never negative, and that on those grounds I should simply get tested rather than let anxiety about the unknown dictate my choice. I'm not convinced this transfers cleanly to my situation: there is no treatment that would change how my case is managed, and a positive result could complicate life and disability insurance applications for years to come. Please describe the most important implications of Good's theorem for a decision like mine, including where its standard assumptions might strain against the realities of predictive testing for an incurable hereditary disease.
