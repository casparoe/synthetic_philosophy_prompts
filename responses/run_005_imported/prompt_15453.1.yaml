answer: |-
  Here's a comparison of Wright's etiological account and Cummins's causal-role account, focusing on their core mechanics and how they handle the problems of permissiveness (Cummins) and exaptation (Wright, including function-switching):

  **Core Mechanics:**

  1.  **Larry Wright's Etiological (Selected-Effects) Account:**
      *   **Definition:** The function of a trait (X) in an organism (O) is *what X does* that explains *why X is there*. More precisely: "The function of X is Z *means* (a) X does Z, and (b) X is there because it does Z" (i.e., because doing Z conferred a selective advantage leading to the propagation of X).
      *   **Mechanism:** Function is defined by **historical selection pressure**. A trait's function is the specific effect (Z) that causally contributed to the differential survival and reproduction of ancestors possessing that trait, thereby explaining the trait's current existence and prevalence in the population. Explanation is inherently backward-looking and historical.

  2.  **Robert Cummins's Causal-Role Account:**
      *   **Definition:** The function of a trait (X) within a containing system (S) is its **causal contribution** to some specified **capacity (C)** of S. This is always relative to an **analytical perspective** chosen by the investigator.
      *   **Mechanism:** Function is defined by **current causal disposition** within a system hierarchy. To ascribe a function to X, one must (1) identify a capacity C of the containing system S (e.g., the organism's capacity to circulate blood), (2) provide an analysis explaining how C is achieved by the organized activities of S's components (including X), and (3) identify the specific contribution X makes within that analysis (e.g., pumping blood). Function is context-dependent and perspective-relative.

  **Addressing the Problems:**

  1.  **Permissiveness (Cummins's Problem):**
      *   **The Charge:** Cummins's account allows *any* effect of X that contributes to *any* capacity C of *any* containing system S, under *any* chosen analysis, to count as a function. The heart's sound *can* be its function relative to the "diagnostic system" and the physician's analytical perspective.
      *   **Mechanics of the Problem:** This stems directly from the core mechanics. The theory provides **no inherent constraints** on what counts as a legitimate capacity C or a legitimate analytical perspective. There is no requirement tying function to evolutionary history, survival value, or even typical systemic organization. The analyst's choice is sovereign.
      *   **Can it be Repaired (without Etiology)?** Fixing this within purely Cumminsian mechanics is difficult. Attempts might include:
          *   **Normative Constraints:** Insisting capacities C must be "biologically significant" or "systemically important." But this begs the question – *why* are they significant? Without an independent criterion (which risks smuggling in etiology or normativity), this remains subjective.
          *   **Restricting Systems/Perspectives:** Limiting S to the organism and C to capacities essential for survival/reproduction. While intuitive, this directly borrows the *normative* aspect Wright aims to explain and abandons the core relativism of Cummins's view. It imposes an external, etiological-like standard.
      *   **Conclusion on Permissiveness:** The permissiveness is a **fundamental consequence** of the mechanics (perspective-relativity, lack of historical/normative constraint). Repairing it without borrowing normative/etiological resources seems impossible, as the repair *needs* such constraints.

  2.  **Exaptation & Function-Switching (Wright's Problem):**
      *   **The Charge:** When a trait is co-opted for a new use (e.g., feathers for flight, originally for insulation), Wright's schema struggles. (a) Does the *new* effect become the function immediately upon conferring advantage? (b) After long co-option, which effect explains "why it's there" – the original selective advantage or the new one? The schema doesn't specify *how much* history counts.
      *   **Mechanics of the Problem:** The core definition ("X is there because it does Z") is ambiguous when Z changes over time. It doesn't specify the temporal scope of "because" or how to weigh multiple selective histories.
      *   **Mechanics of Potential Repair (without Causal-Role):** Wright's mechanics *can* be refined internally to handle exaptation better:
          *   **Distinguishing Original vs. Current Function:** The core schema can be applied iteratively. The trait is *originally* there because of Z1 (insulation). *Later*, its presence *in its current form* might be explained *both* by its past success doing Z1 *and* its new success doing Z2 (flight). Wright's schema doesn't inherently forbid multiple functions.
          *   **Focus on Maintenance Selection:** For the *current* function, emphasize the effects that are *currently* under selection, actively maintaining the trait against variation or loss ("why it's *still* there"). The sound of the heart isn't under selection; flight in birds *is*. This leverages the core etiological mechanism but focuses on contemporary stabilizing selection rather than just origin.
          *   **"Proper Function" Refinements:** Philosophers like Millikan (building on Wright) explicitly define the "proper function" as the effect that figured in the *most recent* selection history maintaining the trait, or the effect responsible for its *continued* selection. This directly addresses the "how much history" question within the etiological framework.
      *   **Conclusion on Exaptation:** While the basic schema is ambiguous, the **core etiological mechanism (explanation via selection history) provides resources** to distinguish original from derived functions and to privilege effects that are *currently* explanatorily relevant for the trait's maintenance. This repair stays within the etiological paradigm by focusing on different temporal slices or aspects of selection history. It doesn't require adopting Cummins's perspective-relativity.

  **Balanced Assessment & Which Handles Problems Better:**

  *   **Cummins's Permissiveness:** This is a **devastating problem** for providing a *normative, biologically distinctive* account of function. The mechanics fundamentally lack the resources to exclude counterintuitive cases without borrowing external constraints that undermine its core relativism. It struggles to capture why biological function ascriptions feel objective and tied to evolutionary success.
  *   **Wright's Exaptation Problem:** This is a **challenge of application and refinement** within a fundamentally sound explanatory framework. The core mechanics *can* be elaborated (using concepts like maintenance selection, recent history, or multiple selective explanations) to distinguish original and derived functions and privilege the currently relevant selective effect, *without* abandoning the core etiological principle. It captures the normativity and historical embeddedness of biological functions.

  **Verdict:**

  *   **On Balance, Wright's Etiological Account handles these two specific problems better.** Its core mechanics provide a principled way (via selection history) to constrain function ascriptions and avoid permissiveness. While exaptation requires careful application and refinement, these refinements (focusing on maintenance selection, recent history) operate *within* the etiological framework, using its existing resources to distinguish and prioritize functions based on explanatory relevance. It doesn't need to borrow Cummins's relativism.
  *   **Cummins's Account** struggles fundamentally with permissiveness because its core mechanics (perspective-relativity, lack of historical/normative anchor) *are* the source of the problem. Repairing it without borrowing etiological/normative constraints seems impossible, as the repair requires precisely the constraints the theory lacks.

  **Key Takeaway:** Wright's theory grounds function in a specific type of explanation (historical selection), providing inherent constraints and normative force, even if applying it to complex histories like exaptation requires careful articulation. Cummins's theory grounds function in current causal contribution relative to an analysis, providing flexibility but sacrificing the constraints needed to capture the distinctive normativity of biological functions and making it vulnerable to counterintuitive ascriptions. While both theories have broader strengths and weaknesses, Wright's mechanics offer a more robust solution to the specific problems of permissiveness and exaptation outlined here.
