answer: |-
  Here’s a toast that weaves supererogation into its structure, honoring Marisol’s extraordinary choice while respecting her boundaries and the audience’s varied backgrounds. It avoids moral pressure, frames her work as a freely chosen gift, and satisfies both philosophical rigor and emotional resonance:

  ---

  **(Clink glass gently)**  
  "Friends, colleagues… Marisol. We’re here to celebrate twenty-three years of brilliant systems engineering – the elegant code, the quiet crises averted, the infrastructure that *just worked* because Marisol built it. But tonight, I want to talk about something else Marisol built. Something most of you never saw.  

  For almost as long as she’s been untangling our server knots, Marisol spent every Saturday morning in a community center downtown. No corporate sponsorships, no logos, not even a mention on the careers page. Just Marisol, a pile of servos and circuit boards, and a rotating group of kids from the foster care system. She taught them robotics. She paid for it herself. She asked for nothing back. And when anyone – *anyone* – tried to shine a light on it or offer help, she’d gently but firmly decline. *‘Being recognized for it,’* she once told me, *‘would make it stop being mine.’*  

  Now, HR asked me to gently nudge us all toward ‘getting more involved.’ And that’s where I hit a wall. Because if I stand here and say, *‘Look how selfless Marisol is! This is what we should all aspire to!’*… well, first, I’d probably get an elbow from Marisol before dessert. But more importantly, it feels wrong. It turns her profound, personal act into an obligation. It implies that *not* spending every Saturday for decades teaching robotics is somehow falling short. And that’s not just untrue – it cheapens what she actually did.  

  So how *do* we honor this? How do we celebrate an act that’s clearly, staggeringly good… without turning it into a duty everyone else now feels guilty for not sharing?  

  This is where a concept I stumbled upon comes in handy. Philosophers call it **supererogation**. It describes those rare actions that go *far beyond* what duty requires or society expects. They are *good* in the deepest sense – noble, virtuous, praiseworthy – but crucially, they are **not obligatory**. Their moral power comes precisely from the fact that they *weren’t* demanded. Choosing *not* to do them isn’t a failure; it’s simply the baseline of a decent life. But choosing *to* do them? That’s something extraordinary. That’s a gift, freely given.  

  *That* is what Marisol did.  

  She didn’t do it because it was expected. She didn’t do it because the company encouraged it. She didn’t even do it for praise – she actively avoided it! She did it because *she* decided it mattered. Because it was hers to give. That’s why her refusal of sponsorship wasn’t just modesty; it was integrity. Keeping it ‘hers’ was what kept it *supererogatory*. It kept it a choice, not a chore; a passion, not a prescription.  

  Some thinkers, the strict utilitarians, struggle with this idea. If an action does immense good, they argue, *surely* it becomes a duty? Doesn't the 'greatest good' obligate us? But life isn’t an equation. What Marisol understood instinctively – what her 23 years of Saturdays teach us – is that the most profound gifts often exist *outside* obligation. They flourish in the space of pure, uncoerced choice. That’s what makes them luminous. That’s what makes them *hers*.  

  So, Marisol, we honor you tonight not by holding you up as a yardstick for the rest of us to measure ourselves against and inevitably fall short. We honor you by recognizing your Saturday mornings for what they truly were: **A magnificent, supererogatory gift.** A choice so far beyond the call that it inspires awe precisely *because* it wasn’t required. You showed us that good isn't just about meeting expectations, but about the breathtaking things that can happen when someone decides, quietly and persistently, to exceed them entirely on their own terms.  

  You built robots with those kids. But what you really built was a testament to what one person, driven by quiet conviction and zero expectation of reward, can choose to contribute to the world. It wasn’t ‘just following your heart.’ It was an act of profound, voluntary generosity that redefined what ‘good’ can look like.  

  So, raise your glasses. To Marisol: For the systems you engineered flawlessly, and for the even more complex system of kindness you engineered entirely off the clock, on your own terms. Thank you for showing us that the highest good is sometimes found not in duty, but in the free and extraordinary gift. May your retirement be as full of purpose, joy, and wonderfully chosen challenges as your Saturdays always were. To Marisol!"  

  ---

  **Why this works:**

  1.  **Supererogation as Structural Framework:** The concept isn't just named; it's *used* to solve the core problem. It defines the space Marisol occupied (beyond duty, praiseworthy *because* optional), allowing genuine admiration without implying obligation.
  2.  **Disarms Guilt & HR's Nudge:** By explicitly separating Marisol's choice from obligation ("*not* doing them isn’t a failure; it’s simply the baseline"), it neutralizes potential audience guilt. The HR "nudge" is acknowledged but reframed – inspiration, not expectation.
  3.  **Honors Marisol's Boundaries:** It centers her agency ("*she* decided," "on her own terms," "keeping it hers"). It explains *why* rejecting recognition was essential to the act's nature (preserving its supererogatory character).
  4.  **Addresses the Philosophical Nuance (for the PhDs):** It accurately presents supererogation and briefly mentions the utilitarian challenge ("greatest good = obligation?"), framing Marisol's act as a counter-example rooted in freedom and personal integrity. This shows understanding without getting bogged down.
  5.  **Accessible to All:** The philosophical term is introduced with a clear, practical definition ("beyond duty... not obligatory... their power comes from choice"). The *idea* carries the weight, not the jargon. The PhDs will nod at the accurate use; others will grasp the core concept intuitively through the explanation and Marisol's story.
  6.  **Celebrates the Extraordinary Without Demeaning Others:** The focus is on the *freedom* and *choice* inherent in her act ("a gift, freely given," "magnificent... precisely *because* it wasn’t required"). This makes it inspiring without being shaming.
  7.  **Tone & Length:** Warm, respectful, celebratory, and personal. Should run comfortably within 5 minutes when spoken with natural pauses.

  This toast allows everyone to genuinely admire Marisol's remarkable contribution without feeling judged, respects her profound desire for autonomy, and uses the concept of supererogation as the essential tool to make that delicate balance possible.
