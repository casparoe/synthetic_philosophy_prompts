  Ok so I'm supposed to be writing my dissertation chapter on 19th-century abolitionist political thought and instead I keep circling back to this thing that bugs me: the Garrison/Douglass split over how to actually read the Constitution. Garrison's camp treated it as pro-slavery on its face -- three-fifths clause, the fugitive clause, the twenty-year protection on the slave trade -- hence "a covenant with death, and an agreement with hell," hence the whole "no union with slaveholders," don't-even-vote stance. Then Douglass breaks with him around 1851 (Spooner and Gerrit Smith seem to be the proximate cause) and starts arguing that the text itself, read on it's own terms rather than through the framers actual intentions, is anti-slavery -- leaning a lot on the fact that "slave"/"slavery" appear nowhere in the document.

  Can you reconstruct the strongest version of each side's interpretive argument (not just the political stakes of each), and then actually tell me who's got the better reading as a matter of constitutional interpretation -- independent of which position made for better abolitionist strategy at the time. Don't just both-sides it, commit to an answer.
