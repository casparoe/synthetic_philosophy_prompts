answer: |-
  You've nailed the central tension brilliantly. This Hume passage is notoriously slippery, and Lewis's appropriation is both insightful and potentially a subtle shift. Let's break down your two questions systematically:

  **1. Normativity: Smuggled or Earned?**

  Hume is absolutely *not* smuggling normativity in the sense of importing a *moral* "ought" from outside the system. His explanation is rigorously naturalistic and grounded in self-interest. However, he *is* claiming that a specific kind of *practical* normativity emerges *from* the convention itself. Here's how he earns it (or tries to):

  *   **From Equilibrium to Expectation:** The core move is the shift from a mere *coincidence* of interest ("It would be good for me if we both did X") to a *mutually recognized* and *expressed* sense of common interest ("*We both know* it's good for *us* if we both do X"). This mutual expression and knowledge create **expectations**.
  *   **Expectation as the Source of the "Ought":** Once the mutual sense of interest is expressed and known, each agent forms the rational expectation that the other *will* act in the mutually beneficial way *because* it's in their interest to do so. This expectation becomes the foundation of the "ought":
      *   "our moderation and abstinence are founded" on "the expectation of... the future regularity of their conduct."
      *   "the actions of each of us have a reference to those of the other, and are perform'd upon the supposition, that something is to be perform'd on the other part."
  *   **The Normative Force:** The "ought" here is primarily **prudential and practical**, not moral (in Hume's strict sense, where morality requires sympathy). It arises from two interlocking rational pressures:
      1.  **Instrumental Rationality:** *Given* my expectation that you will row in time (or respect my possession), *and* my desire for the boat to move smoothly (or to keep my goods), *it is in my interest* to row in time (or respect your possession). Failing to do so would frustrate my own goal.
      2.  **The Rationality of Reliance:** Once a pattern is established and expectations are formed based on the mutual expression of common interest, acting against the pattern becomes *irrational* in a broader sense. It undermines the stable expectations upon which I base my *own* beneficial actions. It creates "inconveniences" (instability, conflict, inefficiency) that the convention was formed to avoid. My action only makes sense *as part of the coordinated pattern*.
  *   **The Role of "Expression":** This is crucial. Hume says the sense of interest is "mutually express'd." This doesn't require explicit promises or agreements. It can be through actions themselves (the rowers adjusting their stroke), gestures, or even just common knowledge arising from shared circumstances. This expression is what transforms a *potential* coincidence of interest into a *mutually recognized basis* for expectations. It signals commitment *to the pattern*, not necessarily to each other morally.

  **Is it "Earned"?** Hume earns a **convention-dependent, expectation-based, prudential "ought"**. He successfully shows how a pattern of mutually beneficial behavior, once established and mutually recognized, generates reasons for individuals to *continue* that pattern based on their own interests *and* the expectations they reasonably hold about others' behavior. The normativity is inherent in the stable equilibrium and the expectations it supports. He *doesn't* ground a freestanding moral obligation; the "ought" collapses if the mutual expectations collapse or if individual interest radically shifts.

  **2. Gradualism vs. Common Knowledge: Lewis's Appropriation**

  This is where Lewis makes a significant, though not necessarily illegitimate, move. You're right to sense a shift:

  *   **Hume's Gradualism:** Hume emphasizes the *process*: "arises gradually," "acquires force by a slow progression," "repeated experience of the inconveniences," "experience assures us," "languages gradually establish'd." This is proto-evolutionary. Conventions emerge through trial-and-error, learning from past failures ("inconveniences"), and the slow building of mutual confidence ("assures us," "gives us a confidence"). The "common sense of interest" becomes common *through repeated interaction and experience*. Knowledge of the convention and expectations about others' behavior are built iteratively.
  *   **Lewis's Static Rationalism:** Lewis starts from the *end state* of a successful convention. His definition focuses on **coordination equilibria** (outcomes where no one prefers to unilaterally deviate) sustained by **common knowledge** (everyone knows the situation, everyone knows everyone knows, and so on ad infinitum) of the agents' **preferences** and **rationality**. This is highly idealized and synchronic. It assumes agents instantly recognize the coordination problem, instantly know each other's preferences and rationality, and instantly achieve the infinite regress of mutual knowledge needed for common knowledge. There's no inherent *process* described for how this state is *reached*; it's a characterization of the state itself.

  **Did Lewis Swap Phenomena?**

  Not entirely, but he reframed and idealized:

  1.  **Equilibrium State vs. Path to Equilibrium:** Lewis explicitly positions his account as characterizing the *equilibrium* state that conventions constitute. He acknowledges Hume's influence and the rowing example precisely because it illustrates a coordination equilibrium. Lewis isn't primarily interested in the *genesis* of conventions (the gradual Humean process); he's interested in *what they are* once they exist. He writes in the Preface: "My topic is convention. My aim is to show how convention can be understood as a generalisation of a familiar phenomenon: the state of affairs when two agents coordinate their actions by each acting as if he expected the other to act in a certain way." This is squarely the Humean *outcome*.
  2.  **Common Knowledge as the Crystallized Endpoint:** Lewis can argue that Hume's gradual process *leads to* a state functionally equivalent to common knowledge. Through "repeated experience," agents learn each other's preferences (they both want the boat to move efficiently), they learn each other is rational (they adjust based on past "inconveniences"), and they develop extremely high-order mutual expectations ("confidence of the future regularity of their conduct") that approximate common knowledge. The "mutually express'd... and... known to both" sense of interest *is* the nascent form of common knowledge. Lewis's demanding epistemic condition is the *idealized limit* of the confidence built through Humean gradualism. It's the state of perfect mutual assurance Hume describes as the foundation for action ("founded on the expectation").
  3.  **Lewis's Later Nuance (and the Evolutionary Bridge):** Crucially, Lewis *does* discuss how conventions arise. While his *definition* is static, his *explanation* for how conventions *get started* often involves **precedent** (previous similar coordination problems solved similarly) and **salience** (a uniquely prominent solution). This *is* compatible with Hume's gradualism. Precedent *is* "repeated experience." Salience can emerge through trial-and-error or focal points that become obvious through experience. Furthermore, Lewis explicitly embraces evolutionary game theory in later work (especially in signaling games) as a powerful explanation for the *emergence* of conventions. He saw his rationalist account and evolutionary accounts as complementary: the rationalist account defines the *target* state, while evolutionary models explain how populations can *learn* or *evolve* towards that state without needing hyper-rational agents with infinite reasoning capacity. Skyrms and Bicchieri are working squarely in this space that Lewis opened up – showing how Humean gradualism, modeled dynamically, can lead to Lewisian conventions.

  **Your View for Thursday:**

  1.  **On Normativity:** Hume earns a robust, convention-dependent, prudential normativity grounded in instrumental rationality and the expectations generated by mutual expression and recognition of common interest. The "ought" to row in time or respect possession arises *because* (a) it's necessary to achieve my desired end (boat moving/stability), *and* (b) I have a well-founded expectation (based on mutual expression and experience) that you will do your part, making my action rational only if I do mine. It's not smuggled; it's constructed *by* the convention itself.
  2.  **On Gradualism vs. Lewis:** Lewis didn't swap phenomena; he characterized the *equilibrium state* that Hume's gradual process *aims at* and often *achieves*. Hume describes the *learning dynamic*; Lewis provides a precise *definition* of the *stable outcome*. Common knowledge in Lewis is the rationalist idealization of the deep mutual confidence built through Humean "repeated experience" and "confidence in future regularity." Lewis's static model captures the synchronic structure of convention, while Hume (and later Skyrms/Bicchieri) provides the diachronic story of its emergence. They are complementary perspectives on the same phenomenon. Lewis kept Hume's label because he saw his concept as a generalization and formalization of the state Hume described so vividly with the rowboat and property examples.

  **Presentation Strategy:**

  *   Start with Hume's passage. Highlight "general sense of common interest," "mutually express'd," "known to both," "performed upon the supposition," "gradually," "repeated experience," "expectation," "confidence."
  *   Explain Hume's prudential normativity: How expression -> expectation -> practical "ought" based on self-interest within the convention.
  *   Introduce Lewis: His goal is to define *what convention is* as a state. Emphasize Coordination Equilibrium and Common Knowledge (define clearly).
  *   Contrast: Hume = Process (How?), Lewis = State (What?).
  *   Reconcile: Argue Lewis's state *is* the end result Hume's process builds towards. Common knowledge ≈ Deep mutual confidence built by experience. Lewis's definition crystallizes the Humean outcome. Point to Lewis's discussions of precedent/salience and his later embrace of evolutionary models as acknowledging the Humean path.
  *   Conclude: Hume provides the dynamic, evolutionary genesis; Lewis provides the static, rationalist characterization of the equilibrium. The modern literature (Skyrms, Bicchieri) uses game theory to formalize Hume's gradualism, showing how it converges on Lewisian conventions. They form a coherent, if multi-faceted, picture.

  This gives you a clear, defensible view that respects both texts and shows the lineage through to the modern work. Good luck with the presentation! Your group is tackling a foundational and fascinating tension.
