prompt: |-
  Had a long argument with a friend of mine last night about acausal trade -- he thinks it's basically just imagining a deal with someone who can never actually be held to it, I think there's a real coordination mechanism there once you buy the decision theory behind it. Neither of us budged. Seperately, I'm interviewing a decision theorist for my podcast next week who defends acausal trade as something agents (civilizations, AIs, whatever) could genuinely pull off, not just a cute thought experiment. Can you draft me 8-10 interview questions that get past the standard pitch? I want at least one question on the epistemic access problem (how do you get justified confidence in a model of a counterpart you'll never get feedback from), one on whether the whole framework quietly needs something like updateless or functional decision theory just to get off the ground -- and whether that's a bit circular -- and one on the acausal blackmail worry, since the same reasoning that generates friendly trades seems to also generate Roko's-basilisk-shaped threats. For each, throw in a quick follow-up keyed to whatever answer she's most likely to give.
