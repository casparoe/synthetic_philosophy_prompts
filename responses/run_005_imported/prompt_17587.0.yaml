  Also, the user's identity as a grandson/daughter vs. a PhD student. Social expectations about family duty might conflict with academic pressures, leading to internalized guilt. Even if others absolve them, internalized norms can trigger guilt. 

  Considering embodied cognition, the guilt might be a somatic marker. The bodily feeling arises automatically when the memory is accessed, bypassing rational assessment. This aligns with their third hypothesis: a bodily reaction without cognitive content. 

