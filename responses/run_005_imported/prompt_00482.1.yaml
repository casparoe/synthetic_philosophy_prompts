  Also, the user wants direct engagement. Each character should respond to the other's strongest points. For example, when Aris says the mosaic doesn't explain itself, Hale should counter that demanding an explanation for the entire mosaic might be asking for something impossible. Hale could argue that explanations must stop somewhere, and for Humeans, it's at the mosaic.

