  I'm about two-thirds through a novel with a minor but important character who is basically my fictionalized version of Robert Nozick - never named as such, but hes got the whole side-constraints, minimal-state, Anarchy State and Utopia toolkit, and I already had him drop the "utility monster" line on someone in an earlier chapter. In the scene I'm drafting now he's at a dinner party in a fishing town where a company (a stand-in for that Spanish outfit, I think it was called Nueva Pescanova, that actually tried to open the world's first commercial octopus farm in the Canary Islands a couple years back) has just proposed doing the same thing there, and his dinner companions - a marine biologist and his own vegetarian daughter - spend half the meal trying to pin him down on whether his own philosophy actually permits it.

  Here's my problem: I remember Nozick has that odd little passage, I think it's a footnote somewhere in the side-constraints material, where he floats "utilitarianism for animals, Kantianism for people" as a kind of stopgap, and seems a bit uneasy with it even as he's proposing it - animals count for something morally, but not enough to get full inviolable side-constraint protection, so their suffering can in principle be outweighed by sufficient human benefit, though he clearly isn't comfortable with cases where the "benefit" on offer is just somebody's taste for the meat. I don't want my philosopher to mouth generic libertarian-vs-animal-rights talking points, I want his argument to genuinely fall out of that specific, half-finished 1974 position, so: reconstructing Nozick's actual framework as carefully as you can, what would he plausibly say about farming an animal that keeps refusing to sit still on the "mere animal" side of his line - tool use, weirdly flexible problem-solving, maybe even something like self-recognition, way past whatever ordinary farm animal he had in mind when he wrote that passage? Does that cognitive profile give him principled grounds to nudge the octopus toward the side-constraint side of the ledger, or would he insist that without something like a capacity for autonomous, long-term self-direction it just stays a utilitarian line-item no matter how clever it gets? And honestly, the bit I most want your take on: does a case like this expose his old 1974 stopgap as actually unstable, in a way he might have had to admit himself?
