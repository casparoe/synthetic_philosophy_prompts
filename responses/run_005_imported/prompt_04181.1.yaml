  Now, Isotype is supposed to be a universal picture language that avoids verbal ambiguities. But Neurath's epistemology says all representations are influenced by prior theories. So pictures aren't neutral either. They require interpretation based on cultural and contextual factors. For example, how a pictogram represents data depends on design choices like scale or symbols, which aren't universal.

