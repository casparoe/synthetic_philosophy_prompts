  Looking at the philosophical context, fink and mask cases were actually introduced to challenge the simple conditional analysis (SCA) of dispositions. SCA says "x is fragile iff if struck, it breaks." But finks and masks show that the conditional can fail even if the disposition exists (mask) or hold without the disposition (fink). So these cases highlight that dispositions can't be reduced to simple conditionals. But do they support eliminativism about dispositions?

