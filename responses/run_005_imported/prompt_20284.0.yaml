  First, I need to represent both sides accurately. The Aumannite will emphasize the common prior as necessary for consistency among rational agents. The skeptic will argue priors are personal and the common prior is unrealistic. Key points: no-trade theorem, Harsanyi doctrine vs. the non-uniqueness of rational priors. They should also touch on whether this applies to idealized agents or real people.

