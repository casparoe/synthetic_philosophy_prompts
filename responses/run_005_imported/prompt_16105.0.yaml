answer: |-
  Here are 10 interview questions designed to push past restatements and test the core claims of your guest's account of standing to blame, incorporating your specific requests and including strategic follow-ups:

  1.  **Core Analogy Challenge:** "You argue forcefully that the 'unclean hands' doctrine in equity law provides a crucial analogy for understanding how hypocrisy undermines standing in the moral realm. But critics might say this doesn't *resolve* the puzzle of separating standing from warrant; it just *relocates* it. In law, the judge determines whose hands are 'unclean' based on established rules and evidence. In the moral domain, who is the analogous 'judge' determining whose hands are sufficiently 'unclean' to lose standing, and by what *non-question-begging* criteria is *that* judgment made, if not precisely by assessing the warrant of the moral claim itself?"
      *   *Likely Reply/Parry:* "The moral community acts as the judge through shared norms; hypocrisy is a performative contradiction recognized intersubjectively."
      *   *Follow-up:* "But doesn't that simply push the question back? If the 'shared norms' include the norm against hypocrisy itself, how do we adjudicate disputes *about* whether someone *is* being hypocritical in a specific case? Isn't the determination of 'unclean hands' in the moral sphere *itself* often a contested moral judgment about the blamer's own conduct relative to the norm, potentially blurring the line you want to maintain?"

  2.  **The Unamended Repenter:** "Consider a wrongdoer who has genuinely repudiated their past dishonest acts, feels deep remorse, and strives to live honestly now, but has never made amends to those they deceived – perhaps it's impossible, or they fear reopening wounds. Does this person regain the standing to blame *others* for dishonesty? If so, how does this square with the 'unclean hands' analogy where restitution is often required? If not, doesn't this seem overly punitive and disconnect standing from current moral commitment?"
      *   *Likely Reply/Parry:* "Genuine repentance likely restores standing *within* the moral community, even without specific amends, as it demonstrates a renewed commitment to the norm."
      *   *Follow-up:* "But your core mechanism is the *unwillingness to extend the norm equally*, implicitly claiming an exemption. If the unamended repenter is *now* willing to be judged by the norm and holds themselves accountable internally, but hasn't *externally* addressed the past imbalance (the lack of extension *then*), have they truly negated the claim to exemption *in the context of blaming others for similar past acts*? Does the lack of amends signify an *ongoing* unwillingness to fully submit to the norm's demands, including reparative justice?"

  3.  **Norm Specificity & Bleed-Over:** "Your account links forfeiture of standing to hypocrisy regarding the *specific* norm being enforced. But how robust is this specificity? If someone has been hypocritical regarding norms of honesty (say, frequent lying), does that *only* remove their standing to blame for dishonesty? Or could it bleed over and remove their standing to blame for violations of a *completely different* norm, like cruelty? If not, why not? Doesn't pervasive hypocrisy in one area fundamentally undermine their claim to the *general* moral authority or equality presupposed in blame as address?"
      *   *Likely Reply/Parry:* "Standing is norm-specific. Hypocrisy about honesty only undermines standing to blame for dishonesty. Blaming for cruelty requires adherence to norms against cruelty."
      *   *Follow-up:* "But doesn't blame, as you describe it, presuppose a *broader* equal standing as moral agents *simpliciter*, not just equality relative to a single norm? If an agent demonstrates a pattern of exempting themselves from moral norms they expect others to follow (even different ones), doesn't this pattern itself constitute a claim to a *general* superior status or exemption, thereby undermining the fundamental equality required for *any* act of moral address, regardless of the specific norm invoked?"

  4.  **The Universality/Slippery Slope Problem:** "A common worry is that if hypocrisy (broadly construed) is pervasive, and if your account is sufficiently demanding, it could lead to a situation where virtually *no one* has standing to blame *anyone* for *anything*, creating a kind of moral paralysis. How do you prevent your account from collapsing into this radical conclusion? Does it rely on setting a high threshold for what counts as 'relevant' hypocrisy, or a notion of 'good enough' compliance?"
      *   *Likely Reply/Parry:* "The condition isn't perfection. It's about *ongoing, unrepentant* hypocrisy *regarding the specific norm* one is attempting to enforce. Most people aren't actively engaged in the *same* wrong they are blaming while refusing to apply the norm to themselves."
      *   *Follow-up:* "But 'ongoing' and 'unrepentant' are crucial qualifiers. What about *past* serious hypocrisy regarding the norm, even if repented? Or hypocrisy regarding a *very closely related* norm? And doesn't the 'same wrong' criterion become very narrow? If I blame you for stealing a book, but I routinely cheat on my taxes (another form of dishonesty/appropriation), am I hypocritical? If not, why not? Doesn't the potential for expansive interpretations of 'relevance' or 'same norm category' threaten the practical applicability of standing?"

  5.  **Power & Asymmetry:** "Your view centers on 'equal standing'. But moral communities are often characterized by significant power imbalances – systemic injustices, epistemic advantages, etc. Couldn't your account inadvertently *protect* powerful wrongdoers? For example, if a marginalized person has, out of desperation, violated a minor norm (say, dishonesty to avoid persecution), does this mean they lose standing to blame a powerful oppressor for major, systematic rights violations, because the oppressor can point to that minor hypocrisy? How does equality of standing function in conditions of structural inequality?"
      *   *Likely Reply/Parry:* "The equality is a presupposition *of the blaming act itself*, not a description of social reality. Further, the nature and context of the hypocrisy matter. Blaming systemic oppression is addressing a *system*, and minor hypocrisy by a victim doesn't equate to the oppressor's hypocrisy in demanding compliance while exempting themselves."
      *   *Follow-up:* "But doesn't the *oppressor* easily weaponize the logic? They can *invoke* the victim's minor transgression to declare *them* hypocritical and lacking standing, thereby silencing critique. Doesn't your framework, in practice, risk privileging those whose past conduct is more easily hidden or excused by the status quo, making it harder for the less powerful to hold the more powerful accountable precisely where it's most needed?"

  6.  **Motive vs. Factual Hypocrisy:** "Does your account distinguish between *factual* hypocrisy (I accuse you of X while I am currently doing X) and *motivational* hypocrisy (I accuse you of X, but my *reason* for blaming is suspect – e.g., jealousy, not genuine commitment to norm X)? Does the latter also undermine standing, or only the former? If only the former, why? Isn't the motivational hypocrite *also* failing to address the other *as an equal* by using the norm instrumentally?"
      *   *Likely Reply/Parry:* "The core issue is the *implicit claim to exemption from the norm one is enforcing*. Factual hypocrisy directly demonstrates this. Motivational hypocrisy might make the blame *bad* or *unwarranted*, but it doesn't necessarily show the blamer exempts *themselves* from the norm's demands."
      *   *Follow-up:* "But if my motive for blaming you for dishonesty is purely to gain an advantage over you, doesn't my act *itself* demonstrate that I don't truly hold myself answerable to the norm *as a binding moral constraint* in this instance? I'm using it as a weapon, implying *I* am above its constraining force when it suits me. Isn't this a form of claiming exemption through instrumentalization?"

  7.  **Collective Blame & Standing:** "How does your account of individual standing apply to *collective* blame or condemnation? If a group (e.g., a government, an organization) blames another actor, does the hypocrisy of *some* members (or even past actions of the group itself) undermine the *group's* standing to blame? Does the group need some kind of 'clean hands' collectively?"
      *   *Likely Reply/Parry:* "Collective blame is complex. It likely requires that the blaming entity (or its representatives) isn't *currently* engaging in unrepentant hypocrisy regarding the norm it's enforcing. Past group wrongs might require acknowledgment and reform."
      *   *Follow-up:* "But how do we attribute 'hypocrisy' to a collective entity? If a government condemns human rights abuses abroad, but has unresolved human rights violations in its own recent history perpetrated by different officials, does it lack standing? If it requires full historical reckoning, doesn't that paralyze nearly all collective moral condemnation?"

  8.  **The Role of Repentance & Reform (Deepening Q2):** "Building on the repenter question, you mentioned repentance restores standing. But *how* does repentance functionally negate the prior claim to exemption? Is it simply the change of heart, or does it require demonstrable *action* (amends, reform) to re-establish the equality that was ruptured by the hypocrisy? Can standing be regained purely privately?"
      *   *Likely Reply/Parry:* "Repentance signifies a renewed commitment to the norm and rejection of the prior exemption. While amends are often morally required, the *standing* is restored by the internal shift acknowledging the norm's authority equally."
      *   *Follow-up:* "If the hypocrisy involved a *relational* wrong (deceiving *someone*), doesn't the rupture in equality exist *between the hypocrite and the person(s) they wronged*? Can standing to blame *others* for similar wrongs be fully restored without addressing that *specific* rupture? Doesn't purely private repentance leave the *interpersonal* imbalance created by the claim to exemption unresolved for the wronged party, potentially undermining the blamer's standing *in their eyes* and thus the communal aspect of blame?"

  9.  **Cultural Relativity of Hypocrisy Norms:** "Conceptions of hypocrisy and the weight given to consistency vary across cultures and moral frameworks. In some contexts, role-based obligations might justify differential application of norms (e.g., parent/child, leader/follower) without it being seen as problematic hypocrisy. How does your account, which seems to posit a strong universal norm against hypocrisy as undermining standing, accommodate or respond to this variation? Does it risk being culturally parochial?"
      *   *Likely Reply/Parry:* "The core idea is the presupposition of equality *in the blaming address*. Within specific roles governed by accepted hierarchical norms, the 'equality' might be understood differently, or blame might function differently. The account applies to contexts where the presupposition of basic moral equality holds."
      *   *Follow-up:* "But doesn't this raise the problem of *identifying* when the basic presupposition of moral equality applies? If a member of an egalitarian culture blames someone from a hierarchical culture using norms from the egalitarian framework, could the hierarchical actor *legitimately* (within their framework) dismiss the blame as coming from someone who lacks standing (due to ignoring role-based norms), creating a kind of incommensurability? How does your theory navigate these clashes?"

  10. **Falsifiability / Limits of Absorption:** "Your account is clearly robust and has been refined in response to critiques. To help us understand its boundaries: what kind of empirical observation or hypothetical scenario, if true, would you concede *genuinely challenges* the core thesis that hypocrisy (as you define it) necessarily and uniquely undermines the *standing* (distinct from warrant) required for blame as moral address? What would count as evidence *against* the view, rather than just another case to be explained within its framework?"
      *   *Likely Reply/Parry:* "A demonstration that blame effectively functions *as moral address* even when delivered by a blatant, unrepentant hypocrite regarding the specific norm, *and* that the hypocrite's lack of standing isn't intuitively felt or doesn't undermine the communicative function. Or showing that 'standing' collapses entirely into warrant upon analysis."
      *   *Follow-up (Implicit in the Question):* *This question is designed to force a concession or a clear demarcation line. The follow-up is listening carefully to the answer and then probing if the proposed counterexample is genuinely outside the theory's absorption capacity or if she can still explain it away. Be ready to ask: "Could you elaborate on why [her proposed counterexample] *wouldn't* fit your definitions of hypocrisy or standing?"*

  **Key Strategies Embodied:**

  *   **Pressing the Analogy:** Questions 1 & its follow-up challenge whether the legal analogy *solves* the problem or just *moves* it.
  *   **Testing Nuances:** Questions 2 & 8 delve deep into repentance and amends, forcing precision on *how* standing is regained.
  *   **Bleed-Over & Scope:** Question 3 directly tackles norm specificity vs. general standing; Question 7 extends it to collectives.
  *   **Universality & Practicality:** Question 4 confronts the slippery slope; Question 5 examines power dynamics exacerbating it.
  *   **Defining Hypocrisy:** Question 6 probes the boundary between factual and motivational hypocrisy.
  *   **Cultural Scope:** Question 9 tests the universality claim.
  *   **Falsifiability:** Question 10 explicitly demands potential counter-evidence, moving beyond accommodation.

  **Delivery Tips:**

  *   **Frame them collaboratively:** "I'd love to push a bit deeper on how your account handles..." or "A worry some listeners might have is..."
  *   **Listen actively:** Her initial answers might open new avenues; be prepared to adapt follow-ups slightly based on her response, while staying focused on the core challenge.
  *   **Pace:** Don't rapid-fire. Allow time for thoughtful answers and natural discussion, using the follow-ups when an answer feels incomplete or rehearsed.
  *   **Clarify:** If an answer seems evasive, politely ask for clarification: "Just to make sure I understand, are you saying that...?"

  Good luck with the episode! These questions should spark a substantive and revealing discussion.
