prompt: |-
  So my friend and i have run a small app together for two years, 50/50 on the work, no contract, always just split whatever it made evenly. A company wants to buy it now, but it turns out they're mainly after me specifically, for a recommendation algorithm i built, so if the deal got shaped entirely around what's best for me (equity plus a job offer) i could clear something like $800k, way more than my friend's best-case version of the exact same deal, which tops out around $150k if he just cashes out and walks away. He's worried that whatever split we land on leaves him with less than hed get if we just kept running the app ourselves and never took the offer at all, purely because i happen to be the one they want, which feels wrong, but pretending we bring equal value to this deal now feels wrong too. Neither of us has some great job to walk into, so its not really a leverage thing, and i really don't want this to wreck the friendship. Is there an actual fair way to think about how to divide this, or does it just come down to whoever pushes harder?
reasoning: |-
  Okay, let me start by understanding the user's situation. They've been running an app with a friend for two years, splitting everything 50/50 without a contract. Now a company wants to buy it, but mainly because of the recommendation algorithm the user built. The user's potential deal is around $800k with equity and a job, while their friend might only get $150k if they cash out. The friend is worried about getting less than if they continued the app without selling, and the user doesn't want the friendship to suffer. They need a fair division method that acknowledges both contributions without resentment.

  First, I need to unpack the core issues. The main tension is between the historical 50/50 partnership and the current disproportionate value brought by the user's algorithm. The friend feels that the user's special treatment by the buyer undermines the equality they've had. The user recognizes that their contribution is key to the deal but doesn't want to dismiss the friend's efforts over the past two years.

  The user's explicit question is about a fair division method, but their deeper needs include preserving the friendship and ensuring both parties feel respected. They might also want validation that it's reasonable to adjust the split based on current circumstances, even if it deviates from their past agreement.

  Looking at possible solutions, I recall principles from partnership buyouts and M&A. The "Past Effort vs Future Value" framework seems relevant. Splitting the cash component 50/50 honors their history, while allocating the job-related equity to the user addresses the future value. Another approach is the "Shared Past, Divergent Future" model, which separates the app's value as it stands from the additional value the user brings through their employment.

  I should also consider fairness aspects: procedural fairness (how the decision is made), distributive fairness (the outcome), and interpersonal fairness (how they treat each other). The user mentioned neither has leverage, so collaboration is key. They need transparent communication and mutual acknowledgment of each other's concerns.

  Potential pitfalls include the friend feeling sidelined if the split is too unequal, or the user resenting sharing the job-linked equity. The friend's fear of getting less than continuing the app is valid. Calculating the app's standalone value versus its value with the user's involvement could help. If the app without the user isn't sustainable, the friend's alternative might be lower, making even a reduced offer better.

  The user's empathy is crucial here. Acknowledging the friend's fears and emphasizing partnership can ease tensions. Maybe suggesting a neutral third party or mediator if discussions get stuck. Also, considering tax implications and the actual value of equity versus cash is important for both parties.

  In conclusion, a hybrid approach seems best. Splitting the cash 50/50, the user keeping the job-related equity, and possibly sharing a portion of the user's equity as a goodwill gesture. This honors their past, recognizes the user's future role, and maintains the friendship. The key is collaborative negotiation, ensuring both feel heard and valued, turning a transactional deal into a shared success.
answer: |-
  This is a classic "partnership vs. individual contribution" dilemma, made harder by the lack of a prior agreement and the deep friendship. **Forcing a 50/50 split on the *entire* $800k feels unfair to you, but giving your friend only $150k while you take $650k feels unfair to him and ignores your history.** The good news is, there *are* fairer frameworks than just splitting everything or winner-takes-most. Here's how to think about it:

  **Core Principles for Fairness:**

  1.  **Acknowledge the Shared Past:** The app exists *because* you built and ran it **together** for 2 years. The initial value, user base, and proof-of-concept are 50/50 contributions. This forms the "baseline" value.
  2.  **Acknowledge the Disparate Future Value:** The buyer isn't just buying the *current* app; they're buying **future potential driven by you specifically**. Your algorithm and your future employment are the *primary drivers* of the $800k value *to this specific buyer*.
  3.  **Separate the Components:** The offer isn't one lump sum. It has distinct parts:
      *   **Cash for the App (Asset Sale):** Payment for the existing code, IP (excluding your unique future contribution), user base, brand, etc.
      *   **Equity/Job Value (Your Future Contribution):** Compensation *specifically* tied to *you* joining, working, and implementing your algorithm *for them*.
  4.  **Consider Alternatives (BATNA):** What happens if the deal *doesn't* happen? If the app continues as-is, what's its projected future value (realistically)? What are *each* of your best alternatives outside the partnership? Your friend's fear about getting less than continuing is valid and needs addressing.

  **Fair Frameworks for Splitting:**

  Here are several approaches, ranging from simpler to more nuanced. **The most likely "fair" solution is a hybrid of #1 and #2.**

  1.  **The "Past Effort vs. Future Value" Split (Most Balanced):**
      *   **Step 1:** Agree on the **"Standalone App Value."** What would the app be worth *without* your future employment? This is tricky but crucial. Look at:
          *   The app's current revenue/profit.
          *   Projections for the next few years (be realistic, not optimistic).
          *   What *other* buyers might pay just for the asset, not tied to hiring you (likely much closer to your friend's $150k estimate).
      *   **Step 2:** Split this **Standalone App Value 50/50.** This honors your 2 years of shared, equal effort in building *what exists today*.
      *   **Step 3:** The **remaining value** ($800k minus the Standalone Value) is **primarily tied to *your* future work and IP contribution.** You keep the **vast majority (e.g., 80-100%)** of this portion. This recognizes that this premium exists *only* because the buyer wants *you*.
      *   *Example:* If you agree the Standalone App Value is $300k, split that $150k each. The "You Premium" is $500k. You keep $400k-$500k, your friend gets $0-$100k of this portion. **Total: You ~$550k-$650k, Friend ~$150k-$250k.** This protects your friend from getting *less* than continuing alone (if $150k is his realistic solo projection) while recognizing your unique future value.

  2.  **The "Shared Past, Divergent Future" Split:**
      *   **Cash Component:** Any upfront cash payment for the *app asset* is split **50/50**. This is payment for what you built *together*.
      *   **Equity Component:** The equity offered *specifically as part of your employment package* belongs **entirely to you.** This equity is compensation for *your future labor and expertise*, not for the past app. Your friend isn't going to work there, so he shouldn't share this.
      *   **Job Salary:** Your salary is yours alone.
      *   *Example:* Deal is $200k cash + $600k equity (vesting over time) + $150k/year salary for you. **Split:** $100k cash each. You keep the entire $600k equity and the salary. **Total: You $700k+ salary, Friend $100k.** *This might feel harsh to your friend, as the cash portion might be low.* **Mitigation:** Consider if part of the equity is truly for the *app's potential* vs. *just your labor*. Maybe offer a small goodwill equity share (e.g., 10-20% of *your* equity) to acknowledge the app platform enabled this deal.

  3.  **The "Enhanced 50/50" (Riskier for Friendship, But Simpler):**
      *   Split the **total potential value** (cash + estimated value of your equity) *approximately* 50/50, but **weighted** to acknowledge your greater contribution *to this specific deal*.
      *   *Example:* Target a 60/40 or 65/35 split of the total $800k. **You ~$480k-$520k, Friend ~$320k-$280k.** *Why this might work:* It's simple, gives your friend a significant win ($280k-$320k is much better than $150k and likely better than grinding alone), and you still get a major premium. *Risk:* It might not *feel* fair to you if you see $520k vs. $800k, or to him if he fixates on the historical 50/50. Requires both to compromise significantly on principle.

  4.  **The "Alternative Reality" Test (To Calm Fears):**
      *   **For Your Friend:** If the deal *doesn't* happen, what's the *realistic* future? Can you *both* sustain the effort? Will growth continue? If you lose motivation (understandable if a big offer vanishes), does the app collapse? His $150k projection might be optimistic alone. The guaranteed cash now (even $200k-$300k) might be *better* than the risky, effort-filled future solo. Run realistic numbers together.
      *   **For You:** If you walked away *now* to take a different job, what would the app be worth to your friend alone? Probably very little. This highlights how much *your continued involvement* (even just staying until now) has added value.

  **Critical Action Steps & How to Preserve the Friendship:**

  1.  **Transparency & Empathy FIRST:** Start by acknowledging his fears: "I completely understand why you're worried about getting less than if we just kept going. That makes total sense, and I don't want that either. I also want to make sure this feels fair for both of us and doesn't hurt our friendship." Acknowledge his 50% contribution to getting you *to this point*.
  2.  **Collaborative Framework Choice:** **Don't dictate.** Present the frameworks above (especially #1 & #2) and say: "I've been thinking about how to make this fair. Here are a few ways to look at it that try to honor what we built together *and* why the buyer is paying so much more now. What do you think makes the most sense? Do you have another idea?" Frame it as solving the problem *together*.
  3.  **Quantify the Standalone Value (#1 is Key):** Have the hardest but most crucial conversation: What *is* the app worth without your future employment? Be realistic, not greedy. Look at current financials, growth rates, and comparable small app sales. This is the anchor for fairness. *His BATNA is key here.*
  4.  **Focus on Total Outcome, Not Just Comparison:** Help him see that $250k-$350k (from a fair split) in cash *now*, without further work, is likely a *better outcome* than the uncertain, effort-required future of running the app solo, even if that *might* theoretically net him $150k/year *if* everything goes perfectly (which it rarely does). Guaranteed liquidity is valuable.
  5.  **Goodwill Gesture:** If using Framework #1 or #2 results in you getting significantly more (which it should), consider a modest additional goodwill payment from your share (e.g., an extra $25k-$50k). Explicitly frame it as: "This is to acknowledge how much I value our partnership and friendship, and to make absolutely sure you feel this is a win." This is cheaper than a broken friendship.
  6.  **Get Professional Advice (Light Touch):** If you get stuck, consider a *single* joint session with a business mediator or a startup-savvy lawyer (paid jointly). Their role isn't to decide but to facilitate the conversation using fair principles and reality checks. **Do NOT each get your own lawyer yet** – that escalates conflict.
  7.  **Future Relationship:** Explicitly discuss how you want to interact after the deal. Celebrate the win together. Maybe use some proceeds for a joint trip. Reaffirm the friendship.

  **Conclusion:**

  The **fairest approach is likely Framework #1 ("Past Effort vs. Future Value")**. It objectively separates the value *you built together* (split 50/50) from the value *only you can deliver going forward* (which you keep the majority of). This protects your friend from getting less than the app's standalone worth while justly compensating you for being the deal's linchpin. A split where you get $500k-$600k and your friend gets $200k-$300k (depending on the agreed standalone value) is likely the sweet spot between fairness and practicality.

  **This is a negotiation between partners, not adversaries.** Success means both of you feel respected, reasonably compensated for your contributions (past and present), and excited about the future – both financially and for your friendship. Focus on collaborative problem-solving using these frameworks, prioritize empathy, and remember that a slightly smaller share of a life-changing sum achieved together is far better than a larger share of resentment or a destroyed partnership. Good luck!
