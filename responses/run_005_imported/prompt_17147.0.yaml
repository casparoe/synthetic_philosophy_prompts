prompt: |-
  For a seminar on social ontology and the philosophy of norms, I have been reading David Lewis's Convention, and I think I have worked out a general way of using his account to predict how resistant a given social practice will be to change. On Lewis's definition, a regularity counts as a convention, rather than as a rule imposed by nature or necessity, only if several conditions hold together: people generally conform to it, it is common knowledge that they do, each person prefers to conform on condition that others do (so that the regularity solves a coordination problem), and, crucially, at least one alternative regularity could in principle have solved that same coordination problem just as well. This last requirement is Lewis's arbitrariness condition, and it is meant to mark off genuine conventions from regularities that hold simply because the situation leaves no real alternative.

  It seems to follow fairly directly that arbitrariness, in this specific sense, should track how easy a practice is to change: if nothing about the underlying coordination problem favors the status quo regularity over some alternative, then a population that wants to switch should be able to do so with relatively little friction, just by enough people coordinating on the alternative instead. Practices that persist for some other, non-arbitrary reason should by contrast be comparatively rigid. I mentioned this to a couple of classmates and they found it fairly intuitive as well, so we started testing it on a couple of standard illustrations of his view, such as driving-side conventions and the pairing of words with meanings within a shared language.

  Here is where I would like your help: does identifying a practice as "arbitrary" in Lewis's technical sense really support the conclusion that it should be comparatively easy to shift away from, once a population recognizes it as arbitrary? And if so, how should I square that with the fact that practices like driving-side conventions and word meanings are, if anything, notoriously hard to change from within a population, short of some external shock or coordinated edict? I would like to know whether the trouble lies in my reconstruction of Lewis's view, in the further inference from arbitrariness to ease of change, or somewhere else entirely.
reasoning: |-
  Okay, let me start by understanding the user's main concern. They've been reading David Lewis's Convention and developed an idea that the arbitrariness of a convention should make it easier to change. But they noticed that real-world examples like driving-side conventions and language are actually hard to change. They want to know where their reasoning might have gone wrong.

  First, I need to recall Lewis's definition. Arbitrariness means there's at least one alternative that could solve the same coordination problem. The user's inference is that if a practice is arbitrary, it should be easy to switch to an alternative. But the examples show resistance to change. So the problem might be in equating arbitrariness with ease of change without considering other factors.

  I remember Lewis emphasizes common knowledge and mutual expectations. Even if a convention is arbitrary, the existing common knowledge creates inertia. People stick to the current practice because they expect others to do the same. Switching requires not just an alternative but a coordinated shift in everyone's expectations. That's hard to achieve without a focal point or external intervention.

  Also, the user mentioned coordination problems. Changing a convention is another coordination problem itself. The status quo is a salient focal point, making it the default. Even if an alternative is just as good, getting everyone to switch simultaneously is tricky. Without a clear signal or authority, people might not coordinate effectively.

  Then there's the issue of costs. Switching driving sides or language involves real risks and costs. Accidents or miscommunications can happen during the transition. These costs make people reluctant to change, even if the convention is arbitrary. The user might have underestimated these transition costs.

  I should also consider network effects and scale. Language and driving conventions are large-scale. The more people involved, the harder it is to coordinate a change. Each person's decision depends on others, leading to inertia. Small groups might switch more easily, but large populations don't.

  The user's classmates found the idea intuitive, which makes sense at first glance. But the real-world friction comes from factors beyond arbitrariness. The key is that arbitrariness is necessary but not sufficient for easy change. Other elements like common knowledge, coordination costs, and network effects create resistance.

  So the user's reconstruction of Lewis isn't wrong, but the inference from arbitrariness to ease of change overlooks these additional factors. They need to adjust their model to include the costs of coordination during transition, the role of salience, and the scale of the population. That would explain why even arbitrary conventions are sticky without external shocks or mandates.
answer: |-
  Your analysis is insightful and touches on a core tension in Lewis's theory. You're correct that **arbitrariness *is* a necessary condition for a convention (in Lewis's sense) and *prima facie* suggests potential ease of change**, but the observed resistance in real-world conventions highlights crucial complexities your inference needs to incorporate. The trouble lies primarily in the inference from arbitrariness *alone* to ease of change, underestimating the power of the very mechanisms Lewis identifies as *constituting* the convention.

  Here's a breakdown:

  1.  **Your Reconstruction of Lewis is Correct:**
      *   You accurately identify the arbitrariness condition (`R` is a convention only if there exists at least one alternative `R'` that *could* have solved the coordination problem just as well).
      *   The inference that arbitrariness *enables* change is logically sound: if nothing intrinsic to the problem favors `R` over `R'`, then switching *should* be possible *in principle*.

  2.  **Why the Inference to "Ease of Change" is Problematic (The Core Issue):**
      Lewis's conditions create powerful *self-reinforcing mechanisms* that generate inertia, even for arbitrary conventions. The key factors making change difficult are *internal* to the convention itself:
      *   **Common Knowledge & Mutual Expectations:** The convention works *because* everyone knows everyone else conforms, expects them to continue conforming, and prefers to conform *conditional on others conforming*. This creates a powerful equilibrium. Changing requires not just adopting `R'`, but *shattering this common knowledge structure* and establishing a *new* one around `R'`. This coordination problem *about changing* is itself difficult to solve.
      *   **The Status Quo as a Salient Focal Point:** Lewis emphasizes the role of salience in solving coordination problems. The *existing* convention (`R`) is incredibly salient precisely *because* it's the established, common-knowledge solution. Any alternative `R'` lacks this salience *until* a new focal point is somehow established. The status quo has a massive advantage.
      *   **Coordination Costs & Risks of Transition:** Switching isn't instantaneous or cost-free. During a transition period, coordination breaks down. Driving on the "wrong" side or using a word with an unstable meaning is dangerous or confusing. Individuals rationally fear these costs and prefer the *known* coordination of the status quo, even if `R'` is equally good *once established*. The *transition* involves a coordination problem worse than the original one.
      *   **Scale and Network Effects:** Conventions like language or driving rules involve vast populations. Coordinating a switch across millions of people, ensuring everyone knows *when* and *to what* to switch, and trusts *everyone else* to switch simultaneously is monumentally difficult. The larger the population, the harder it gets. Small groups *can* sometimes change arbitrary conventions more easily (e.g., adopting slang).
      *   **Lack of a Coordinating Mechanism:** Changing a widespread convention often requires some mechanism to create a new focal point and establish new common knowledge – e.g., a powerful authority (law), a dramatic external event (invasion forcing driving side change), or a highly visible, simultaneous signal (almost impossible organically). Without this, individuals lack the assurance others will switch.

  3.  **Reconciling Arbitrariness with Stubbornness:**
      *   **Arbitrariness Enables *Potential* Change, Not *Easy* Change:** Lewis's arbitrariness condition means the convention *lacks an inherent, problem-based justification*. This makes it *vulnerable* to change *if* the coordination problem of changing can be solved. However, solving *that* coordination problem is often the hard part, precisely *because* of the self-reinforcing nature of the existing convention (common knowledge, expectations, salience, low individual incentive to deviate unilaterally).
      *   **The Source of Resistance is the Convention Itself:** The very factors that *make* `R` a convention (common knowledge of conformity, conditional preferences) are the *same factors* that make it resistant to change. Resistance isn't evidence against arbitrariness; it's evidence of the convention *working effectively* as a coordination device.
      *   **"Ease of Change" is Relative to Non-Arbitrary Practices:** Your core intuition *does* hold water when comparing truly arbitrary conventions to non-arbitrary regularities. Changing a *non-arbitrary* practice (e.g., stopping at red lights because it prevents collisions *inherently*, not just by agreement) is genuinely harder/impossible without changing the underlying reality (e.g., inventing collision-proof cars). Changing an *arbitrary* convention *is* "easier" in the sense that only coordination needs to shift, not physical laws or inherent preferences. However, "easier" in this comparative sense doesn't mean "easy" in absolute terms. Shifting large-scale coordination is inherently difficult.

  4.  **Applying to Your Examples:**
      *   **Driving Side:** Arbitrary? Yes (Left or Right work equally well *as solutions*). Easy to change? No. Why? Transition costs are enormous (accidents!), common knowledge is deeply entrenched, the status quo is supremely salient, and coordinating millions of drivers simultaneously is impossible without a massive authoritative decree (law) or external shock (colonial imposition).
      *   **Word Meanings (Lewis's Prime Example):** Arbitrary? Radically so (any sound *could* signify "dog"). Easy to change? Notoriously difficult. Why? Network effects are extreme – the value depends on *everyone* using it. Changing requires re-coordinating the entire linguistic community. Common knowledge is deeply embedded. A spontaneous, coordinated shift to a new meaning for "dog" across a language community is virtually impossible without a central authority (like an academy, with limited success) or gradual, organic drift (which is slow and not a conscious "switch").

  **Conclusion and Refinement for Your Seminar:**

  *   **Your insight is fundamentally correct:** Lewisian arbitrariness *is* a key factor enabling the *possibility* of change. Non-arbitrary practices are rigid for deeper reasons.
  *   **The flaw is in underestimating the inertia:** The inference from arbitrariness *alone* to "ease of change" overlooks the powerful self-sustaining forces *constitutive* of the convention – common knowledge, mutual expectations, salience of the status quo, and the high costs/risks of the transition period.
  *   **Refined Model for Predicting Resistance:** To predict how resistant a Lewisian convention is to change, consider:
      1.  **Degree of Arbitrariness:** (How many viable alternatives exist? Are they truly perceived as equally good?) *Enables potential change.*
      2.  **Strength of Self-Reinforcing Mechanisms:** How entrenched is the common knowledge? How strong are the conditional preferences ("I prefer to conform *if* others do")? How salient is the status quo? *Creates inertia.*
      3.  **Costs of Transition/Coordination Failure:** What are the risks/damage if coordination breaks down during a switch? *Increases resistance.*
      4.  **Scale & Network Effects:** How many people need to coordinate the change? How interdependent are their actions? *Larger scale = harder.*
      5.  **Availability of Focal Points/Coordinating Mechanisms:** Is there an authority, a crisis, or a highly salient signal that can facilitate the shift to a new equilibrium? *Essential catalyst for change.*

  **In essence: Lewisian conventions are *arbitrary but sticky*. The arbitrariness means they *can* change if the coordination problem of changing is solved, but solving that secondary coordination problem is often extremely difficult precisely because of the forces that make the original convention stable.** This is the fascinating tension at the heart of social ontology that your observation perfectly highlights – the potential fragility implied by arbitrariness versus the observed robustness created by common knowledge and expectations. This tension is excellent material for your seminar discussion.
