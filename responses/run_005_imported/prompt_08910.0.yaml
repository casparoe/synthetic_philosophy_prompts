prompt: |-
  So I was at dinner with a friend last night and somehow we burned through like two hours arguing about Taurek's "Should the Numbers Count?" essay -- she'd just read it for a bioethics seminar, I read it years ago for a metaethics class and apparently misremembered half of it. We went back and forth on the coin-flip solution, whether Parfit actually refutes him or just changes the subject with the "different numbers" cases, and whether Scanlon's contractualist move (pair everyone off one-to-one, the "extra" person in the bigger group breaks the tie) secretly smuggles aggregation back in through the side door. Neither of us budged, which is very on-brand for us.

  Infuriatingly, I actually have to produce something useful on this exact question by Thursday. I'm on the crisis-standards-of-care commitee at my hospital, and we're revising the protocol for a situation that comes up more than people realize: two simultaneous incidents need the same indivisible resource (think: the region's only available trauma team, or the last dose of something) and the two patient groups are medically identical in urgency and prognosis but different in size. Current draft language just says "the larger group gets it," period. But one commitee member -- an actual bioethicist, unlike me -- is pushing back hard, citing exactly the Taurek/Parfit/Scanlon stuff from last night, and wants us to build in some kind of weighted-lottery element instead of a flat head-count rule.

  Could you draft the short memo I'd circulate before the meeting? I need an actual recommendation -- keep the head-count rule, adopt a lottery, some hybrid, whatever you think the strongest case actually supports -- not a "here are three views, you decide" non-answer. It also needs to seriously engage with the best version of whichever side it doesn't pick, because our bioethicist will absolutely notice if we strawman her position. Feel free to get into the actual philosophical moves (the coin flip, the separateness-of-persons stuff, the pairwise-comparison/extra-claim argument, etc.) since everyone on the commitee has already read the background packet and wont be impressed by a memo that just dances around them.
