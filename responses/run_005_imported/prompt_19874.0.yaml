  I need to recall Locke's proviso properly. From what I remember, Locke argued that when someone appropriates an unowned resource through labor, it's legitimate only if there's "enough and as good" left for others. This makes sense for physical resources like land or water which are rivalrous - meaning if I take some, less is available for others. But ideas are different - they're non-rivalrous. My using an idea doesn't prevent others from using it simultaneously. So the proviso seems automatically satisfied for ideas.

  The user is pointing out an interesting tension here. Intellectual property law grants exclusionary rights - patents and copyrights that let creators prevent others from using their ideas. But if the Lockean proviso is already satisfied because ideas are non-rivalrous, then why do we need these exclusionary rights? The labor-desert argument (that people deserve property rights because they labored to create something) might not hold up for ideas since the core justification for appropriation - scarcity - doesn't apply.

