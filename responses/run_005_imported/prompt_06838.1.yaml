answer: |-
  The wind screamed against the habitation dome, a constant, grinding roar that had long since faded into the background hum of existence at Polaris Outpost Gamma. Three days buried under the avalanche on the northern ice shelf. Three days since the comms array sheared off, taking the primary generator with it. Three days of dwindling heat, rationed power, and the oppressive silence of being utterly cut off.

  I wasn’t the commander. Just the medic. And right now, my medbay felt like the coldest, most suffocating place in the frozen hell outside.

  Vega lay on the left cot, her breathing a shallow, wet rattle. High-altitude pulmonary edema, exacerbated by the stress of the collapse and the plummeting air pressure we couldn’t fully regulate. Her lips were tinged blue. Every breath was a battle.

  Lyra lay on the right cot, her face pale, sweat beading on her forehead despite the chill. Sepsis. A deep laceration from a falling storage crate during the initial impact had turned angry red, then purple, and now pulsed with a sickening heat. The fever was burning her from the inside out.

  They were both crashing. Fast.

  And on the small, sterile tray between them sat the only vial of dexamethasone left. The miracle drug. For Vega, it would reduce the inflammation drowning her lungs, buying her precious hours, maybe days, until rescue *might* come. For Lyra, it was a potent anti-inflammatory that *might* buy her enough time for her overwhelmed immune system to rally against the infection raging through her bloodstream.

  One vial. Two people I’d shared meals, laughter, and the crushing isolation of this icy rock with for the past eight months. Vega, with her dry wit and encyclopedic knowledge of stellar nebulae. Lyra, whose quiet competence kept the life-support systems humming and whose voice was the calmest in any crisis.

  There were no other options. The secondary med-kit was buried under tonnes of snow and ice. The emergency beacon was silent, its power cells drained trying to punch a signal through the storm and the ice. No one was coming tonight. Maybe not for days more.

  **Ought.**

  I *ought* to save Vega. The HAPE was acute, immediately life-threatening. The dexamethasone had a high probability of stabilizing her breathing *now*. Letting her drown felt… active. A sin of omission.

  **Ought.**

  I *ought* to save Lyra. The sepsis was systemic, a slower burn, but just as deadly. Without intervention, her organs would start failing. The dexamethasone *could* tip the balance, giving her body the edge it needed. Leaving her to the fever felt like abandoning her to a torturous, inevitable decline.

  The arguments cycled in my head, colliding, cancelling each other out. Saving Vega meant condemning Lyra. Saving Lyra meant letting Vega suffocate. Neither outcome was acceptable. Neither duty less real, less urgent, in that frozen, airless moment.

  *If one duty is true, the other must be false,* the Kantian ghost in my head whispered. *Choose the greater imperative.* But what was greater? The immediacy of suffocation versus the agony of septic shock? The life of the astrophysicist versus the life of the engineer? Both were vital. Both were friends. The "greater" dissolved into meaningless noise against the roar of the wind and the rasp of Vega’s breath.

  *Moral residue,* another phantom offered. *The guilt is the proof you owed both, and failed one.*

  My hands, numb with cold or fear, didn't shake as I picked up the vial. They felt detached, belonging to someone else. The decision didn't feel like a choice, but a tectonic shift happening *to* me. One moment I was suspended in the unbearable tension of the **oughts**, the next, I was drawing the milky liquid into a syringe.

  I injected Vega.

  The logic, if you could call it that, was brutal simplicity: she would die *faster* without it. Lyra *might* hold on a little longer. It wasn't calculation. It was triage by proximity to the abyss. A coin toss weighted by the sound of a death rattle.

  Vega’s breathing eased marginally within minutes, the terrifying wet gurgle softening. Her eyelids fluttered, unseeing. She was still critically ill, but she wasn’t actively drowning *right now*.

  Lyra didn’t cry out. She just watched me with fever-bright eyes as I turned to her, empty-handed. The understanding, the utter lack of accusation, was worse than any scream. I held her hand, wiped her brow with a damp cloth that felt like ice, murmured useless comforts as the heat radiating from her skin seemed to intensify. The silence between us was louder than the storm.

  She died just before dawn. Her hand went slack in mine. The fierce heat faded, leaving only a terrible, profound cold.

  Vega stabilized. The drug bought her time. Rescue came two days later, a miraculously cleared weather window allowing a crawler from Beta Station to punch through. Vega survived the evacuation. She’s recovering planetside now.

  I sit in my quarters back on Earth, months later. The official inquiry cleared me. "Impossible circumstances." "No negligence." "Standard triage protocols followed under extreme duress." My therapist nods, empathetic. "You made the only choice you could. You saved a life. There was no 'right' choice that saved both."

  But the residue remains. It’s not the sharp guilt of a mistake, but a deep, cold ache, a phantom limb where the other duty used to be. I see Lyra’s understanding eyes in the frost patterns on my window. I hear the wind in the quiet hum of the city at night.

  Did I fail her? Or did the universe fail us both?

  When I close my eyes, I don't see the vial, or the cots, or the storm. I see the **oughts**, suspended in the frozen air of that medbay, colliding like particles in a supercollider. Neither yielding. Neither dissolving. Both true. Both demanding payment.

  I saved Vega. I let Lyra die. The facts are simple, stark, unchanging.

  But the debt? The question hangs, unanswered, in the hollow space the storm left behind: *What, exactly, is owed to the duty you couldn't fulfill?* The silence that answers feels less like absolution, and more like the vast, indifferent cold of the ice shelf itself.
