  The user's friend accused Moore of philosophical sleight-of-hand, essentially dressing up hedonism in fancy terminology like "organic unities" and "non-natural properties." The user couldn't counter this effectively during their car ride debate and is now seeking a clearer defense of Moore's consistency. 

  Hmm, this requires unpacking several layers: First, Moore's distinction between *what good is* (a non-natural property) versus *what things possess it* (complex states involving consciousness). The friend might be conflating these. Second, the role of organic unities—Moore isn't valuing pleasure *simpliciter* but complex wholes where consciousness is directed toward objects with intrinsic properties (beauty, virtue). The "unobserved beauty" thought experiment shows he values the object's properties independently of the pleasure they cause. 

  The user might also be subtly worried their friend exposed a genuine weakness in Moore. After all, if Moore's "ideal" involves conscious states, isn't he still privileging subjective experience? But Moore would retort that the *content* of consciousness (e.g., apprehending beauty) matters, not just the feeling. Still, one could argue this is hedonism with extra steps... 

  Key rebuttals for the user: (1) Moore's goods require an *intentional object* (real beauty/virtue), not just pleasant sensations; (2) His metaphysics separates the *property* "good" from the *natural properties* of pleasurable experiences; (3) The unobserved world example proves he values non-mental properties. 

  But honestly? Moore's view *does* flirt with hedonism. His focus on "enjoyment" makes the boundary fuzzy. The user could concede that while Moore isn't a crude hedonist, his ideal is still experience-centered—just experiences with cognitive depth. Sidgwick might nod wryly.
answer: |-
  Your friend raises a compelling challenge, but Moore's position isn't simply a disguised hedonism. Here's why the objection, while understandable, overlooks key distinctions in Moore's framework:

  1.  **The Core Distinction: What "Good" Means vs. What Things *Are* Good:**
      *   Moore's **anti-hedonist argument** targets the *definition* of "good." He argues (via the Open-Question Argument) that "good" cannot be *defined* as "pleasure" (or any other natural property) because it always makes sense to ask, "But is pleasure *good*?" This establishes "good" as a simple, non-natural, *sui generis* property.
      *   His **positive view** identifies *which complex states of affairs* possess this indefinable property of "goodness." He finds that states involving *consciousness* (specifically, the appreciation of beauty and personal affection) are the bearers of intrinsic value.

      **Crucial Point:** Moore isn't saying "good" *means* "pleasure of aesthetic appreciation." He's saying that *this particular kind of conscious state* happens to be the thing that possesses the unique, non-natural property "good" in the highest degree. The value resides in the *whole state* involving both the object and the conscious appreciation, not *just* the feeling.

  2.  **The Role of the Object: Beyond Subjective Feeling:**
      *   Hedonism (especially Mill/Sidgwick) locates value *solely* in the conscious state of pleasure itself, regardless of its source or object. The *feeling* is the bearer of value.
      *   For Moore, the *object* of consciousness is **essential** to the value of the whole. The beauty of the object and the admirable qualities of the friend are *intrinsic parts* of the valuable organic unity.
      *   **The Unobserved Worlds Thought Experiment:** This is central to defeating the hedonist reading. Moore argues that a beautiful world, even if *permanently unobserved*, is *intrinsically better* than an ugly one (a "heap of filth").
          *   **If Moore were a hedonist,** the unobserved beautiful world would have *zero* value, as no conscious pleasure exists. Sidgwick explicitly denies value to unexperienced beauty.
          *   **Moore affirms its value.** This demonstrates that value resides, at least partially, *in the existence of the beautiful object itself*, independent of any conscious enjoyment. The *potential* for appreciation or the *inherent quality* of the object contributes to the world's goodness. Pleasure *in appreciating* the beautiful object adds *further* value when consciousness is present, but the object has value *sui generis*.

  3.  **Organic Unities: The Whole is Greater (and Different):**
      *   Moore's principle of organic unities states that the value of a complex whole cannot be simply the sum of the values of its parts considered in isolation.
      *   **Applying this to the "Ideal":** The valuable whole is *"the love of beautiful things"* or *"the enjoyment of personal affection."*
          *   **Parts:** (a) The beautiful object (with its intrinsic properties), (b) The conscious state of appreciation/affection (which includes cognitive elements like *recognizing* beauty/good qualities, and affective elements like pleasure).
          *   **Value of Parts in Isolation:** Imagine *just* the feeling of pleasure, divorced from any object (e.g., a pleasure pill). Moore would likely say this has little or no intrinsic value. Imagine *just* the beautiful object, unperceived. He argues it *does* have some value (as per the thought experiment).
          *   **Value of the Whole:** The complex whole – *consciousness directed towards and appreciating a genuinely beautiful object or admirable person* – possesses a *far greater* intrinsic value than the sum of the values of its parts considered separately. The *relationship* between the consciousness and its object generates a unique kind of goodness.
      *   **Why this isn't Hedonism:** Hedonism values the pleasure *component* regardless of its object or cognitive basis. Moore values the *specific, complex unity* where consciousness apprehends and responds appropriately to certain objective, valuable properties in the world. The pleasure is a *consequence* or *constituent* of this valuable apprehension, not the sole bearer of value.

  4.  **Non-Natural Properties & Complexity:**
      *   The talk of non-natural properties isn't just dressing; it's the foundation. Moore insists "good" is simple and non-natural. When he identifies aesthetic appreciation and personal affection as the *bearers* of this property, he is *not* reducing "good" to the natural properties of those states (like pleasantness). He's saying these complex states *exemplify* the non-natural property "good" to the highest degree.
      *   The "fairly conventional hedonism" your friend mentions values pleasure *as such*. Moore values a *specific, cognitively rich, object-directed complex state* that *involves* pleasure but is defined by much more. It's closer to an "appreciation-ism" or "appropriate-response-ism" than hedonism.

  **Addressing Your Friend's Objection Directly:**

  *   **"Sleight of Hand"?** Not quite. Moore is consistent in separating the *definition* of "good" (non-natural, simple) from the *identification* of what *has* this property (complex states involving consciousness directed towards certain objects). The shift is from meta-ethics (what "good" means) to normative ethics (what is good).
  *   **"Ends up closer to Sidgwick"?** Superficially, yes, in the sense that conscious states are central to *what is good*. But fundamentally, no:
      *   Sidgwick defines "good" as desirable consciousness (ultimately reducible to pleasure).
      *   Moore denies "good" can be defined naturally, and his conception of valuable conscious states *requires* real, objective, valuable properties *in the objects* (beauty, admirable qualities) that are part of the valuable whole. Sidgwick has no equivalent to the unobserved beautiful world argument.
  *   **"Dressing up Hedonism"?** The "dressing" (non-natural properties, organic unities, isolation test) is essential to Moore's *argument* for *why* his "ideal" isn't hedonism. The unobserved world and organic unity arguments explicitly show that value isn't *solely* located in conscious pleasure. Hedonism fails the isolation test for the *bearers* of value – pleasure alone isn't intrinsically good enough for Moore.

  **Conclusion:**

  Your friend's objection is astute and highlights a tension, but it ultimately misreads Moore by conflating:

  1.  The *meaning* of "good" with the *bearers* of goodness.
  2.  The *presence of pleasure* *within* a valuable state with the *identification of pleasure itself* as the sole bearer of value.

  Moore escapes the collapse into hedonism because:

  1.  He denies "good" is *definable* as pleasure (or any natural property).
  2.  He locates intrinsic value in *complex organic unities* where the object of consciousness is essential.
  3.  He explicitly attributes value to unexperienced beauty, demonstrating value exists beyond conscious states.

  While Moore's ideal centers on conscious experiences involving pleasure, it is the *specific structure* of those experiences – consciousness appropriately apprehending and responding to objective intrinsic values (beauty, virtue) in the world – that makes them good. The pleasure is a *sign* or *component* of the valuable apprehension, not the definition or sole source of the goodness. Sidgwick, in contrast, sees pleasure itself as the ultimate good. This difference, grounded in the Open-Question Argument, the isolation test, and the principle of organic unities, prevents Moore's view from being merely "dressed-up hedonism."
