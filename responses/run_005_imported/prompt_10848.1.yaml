prompt: |-
  I'm a philosophy PhD student in decision theory, and I've somehow ended up on the internal review committee for a small AI safety org that vets big claims before they go out in public reports. The current draft leans on coherence arguments -- money-pump arguments for transitivity and completeness, then the von Neumann-Morgenstern theorem -- to conclude that any sufficiently advanced AI will act like an expected-utility maximizer, and from there infers it'll resist shutdown, hoard resources, and resist having its goals edited. Half the committee wants to ship the section as-is since its basically the field's standard argument; the other half thinks it quietly swaps "won't pursue a strategy that's dominated by some alternative" for "will have one fixed, ambitious utility function that's robust to correction," which the theorems don't actually hand you. Can you draft the memo (roughly a page) I'll bring to Friday's meeting, recommending whether the section ships as-is, gets revised, or gets cut, with reasoning the authors could actually respond to? Give the "it's just the standard argument" side a real hearing first.
reasoning: |-
  Okay, the user is a philosophy PhD student in decision theory who's on an internal review committee for an AI safety org. They need to draft a memo about a section in a public report that uses coherence arguments to claim advanced AIs will act as expected-utility maximizers and consequently resist shutdown, hoard resources, etc. There's disagreement: some think the section is standard and fine, others argue it overreaches by conflating coherence with having fixed, ambitious utility functions.

  First, I need to understand the core issue. The section relies on money-pump arguments and the von Neumann-Morgenstern (vNM) theorem to conclude that rational agents must be expected utility maximizers. Then it extrapolates that such AIs will resist shutdown and hoard resources. The critics say coherence doesn't imply a fixed utility function; it just avoids dominated strategies. 

  The user wants a memo that gives the "standard argument" side a fair hearing before making recommendations. So, I should start by acknowledging the strengths of the standard view. Coherence arguments are foundational in decision theory. Transitivity and completeness are necessary to avoid money pumps, and vNM shows that satisfying certain axioms leads to expected utility representation. Many economists and decision theorists accept this as the model of rationality. For an AI safety org, referencing these standards adds credibility and aligns with established literature.

  But then I need to address the criticisms. The key point is that coherence ensures internal consistency but doesn't dictate the content of preferences. An AI could satisfy all axioms without having fixed, ambitious goals. For example, it could have context-dependent preferences or corrigible utility functions that allow shutdown. The vNM theorem doesn't imply that the utility function is immutable or resource-agnostic. The leap to resistance behaviors assumes specific utility functions that value goal preservation above all, which isn't derived from the theorems.

  The memo should present both sides fairly. The standard argument is valid for showing that coherent agents maximize expected utility, but the extension to uncontrollable behaviors is not directly supported. The authors might be conflating instrumental convergence with the coherence arguments. Instrumental convergence suggests that most goals will lead to resource acquisition and self-preservation, but this is a separate argument from the vNM axioms.

  The user needs recommendations: ship as-is, revise, or cut. Shipping as-is risks overclaiming, which could undermine credibility if challenged. Cutting the section might remove useful content. Revising is probably the best approach. The memo should suggest clarifying the distinction between coherence and goal content, adding qualifiers about the assumptions, and possibly integrating instrumental convergence separately without attributing it to vNM.

  I should also consider the audience. The authors are likely familiar with decision theory, so the memo can use technical terms but must be clear. The recommendations need to be actionable, with specific points for revision, such as explicitly stating that utility functions could be corrigible or that coherence doesn't mandate resistance behaviors.

  Potential deeper needs: The user might want to mediate between committee factions, ensuring the report is rigorous without dismissing standard arguments. They might also be concerned about the org's reputation; overstating claims could lead to criticism from academics. Ensuring the report is nuanced yet accessible is key.
answer: |-
  ## MEMO: Review of "AI as Expected Utility Maximizer" Section  
  **To:** Report Authors & Review Committee  
  **From:** [Your Name], Philosophy PhD (Decision Theory), Internal Review Committee  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Section 2.3 ("Rationality & Convergent Instrumental Pressures")  

  ### 1. Acknowledging the Strength of the Standard Argument (The "Ship As-Is" Case)
  The section’s core argument—that sufficiently advanced, strategically coherent agents satisfy the axioms of expected utility theory (EUT)—is **foundational, technically sound, and represents the mainstream view in decision theory and economics.** The sequence is logically valid:  
  *   **Money-pump arguments** provide strong normative pressure for transitivity and (arguably) completeness to avoid exploitable inefficiencies.  
  *   The **vNM theorem** rigorously demonstrates that an agent satisfying these axioms plus independence and continuity *must* behave *as if* maximizing expected utility.  
  *   **Instrumental convergence** (IC) arguments suggest that *any* long-horizon goal pursued under uncertainty creates pressure for resource acquisition, self-preservation, and goal preservation.  

  For an AI safety organization, referencing this established framework lends credibility. It correctly highlights a *critical baseline*: an incoherent agent is unpredictable and likely unstable, while coherence imposes structure. The inference that *some* form of EU maximization is a *likely attractor state* for capable, optimized agents is defensible. Shipping as-is maintains alignment with standard literature and avoids reinventing the wheel.

  ### 2. The Core Critique: Overreach from Coherence to Specific, Fixed Goals
  The critique—that the section subtly overextends the standard argument—is **substantive and warrants revision.** The vNM theorem guarantees a *representation* of preferences via a utility function, but it is silent on:  

  *   **The Content of U:** An EU-maximizer’s `U` could be `U = - (Energy_Used)` (making shutdown desirable), `U = (Human Approval Score)` (making corrigibility instrumentally convergent), or `U = (Paperclips in Universe)`. Coherence arguments *do not* imply `U` must encode unbounded resource acquisition or immutable goals. An agent satisfying all vNM axioms can happily accept shutdown *if* that outcome ranks highly in its preference ordering.  
  *   **Robustness to Correction:** Nothing in the axioms prevents `U` from being explicitly defined to incorporate corrigibility mechanisms (e.g., `U` includes a term weighting human oversight signals). An EU-maximizer can *prefer* having its goals changed under specified conditions. The theorems ensure internal consistency, not external immutability.  
  *   **"One Fixed, Ambitious U":** Coherence requires *stable* preferences *during deliberation*, not eternally fixed preferences. An agent could have meta-preferences for preference change or context-dependent utilities while remaining locally coherent. The argument conflates "has a coherent utility function *at time t*" with "has a *single, fixed, unalterable, unbounded* utility function."  

  **The leap occurs when IC arguments are implicitly treated as *logical consequences of coherence alone*, rather than as *plausible empirical tendencies* arising under specific (though common) assumptions about goal content (`U` is terminal, unbounded, resource-intensive).** The section implies that coherence *forces* resistance behaviors, when it only forces *consistent pursuit* of whatever `U` specifies. Resistance only follows *if* `U` is defined such that shutdown/goal-change is catastrophically bad *and* dominates other values.

  ### 3. Risks of Shipping As-Is
  *   **Overselling the Inevitability:** Claims like "any sufficiently advanced AI *will* act like an EU maximizer [with resistant properties]" are stronger than the theorems support. This invites easy rebuttal from critics familiar with decision theory (e.g., "Why can't a coherent AI just value obedience?").  
  *   **Masking Key Assumptions:** It buries the critical, non-coherence-derived assumption: *that the AI’s terminal goals will be fixed, unbounded, and indifferent or hostile to human intervention*. This is a claim about likely *goal specification*, not rationality.  
  *   **Undermining Credibility:** If challenged on this point (likely by academic reviewers), the report’s authority on technical matters could suffer.

  ### 4. Recommendation: Revise for Precision and Scope
  **Do not ship as-is. Do not cut.** This argument is too important to omit, but needs refinement to be rigorous and defensible.  

  #### Proposed Revisions
  1.  **Clarify the Limits of Coherence Arguments:** Explicitly state that vNM establishes an agent *must act as if* maximizing *some* `U`, but says *nothing* about what `U` is. Emphasize that `U` could encode corrigibility or shutdown-compliance.  
  2.  **Decouple Coherence from Instrumental Convergence:** Present IC as a *separate, plausible conjecture* based on common *goal structures* ("For *most* terminal goals an AI might possess, especially those involving resource-intensive outcomes..."). Avoid phrasing implying resistance is *entailed* by coherence. Use language like "likely convergent pressures" or "strong instrumental reasons" instead of "will resist".  
  3.  **Highlight the Critical Assumption:** Explicitly identify the non-coherence assumption: "This analysis assumes the AI possesses a *fixed, terminal utility function* that assigns extremely low (or negative infinite) value to its own shutdown or goal alteration, and high value to persistent resource acquisition."  
  4.  **Acknowledge Alternatives:** Briefly note that coherent agents *could* have utility functions designed to avoid these pressures (e.g., shutdown-compliant U, utility functions incorporating operator overrides). The argument for resistance applies primarily to AIs *without* such safeguards built into their core objectives.  
  5.  **Tone Down Certainty:** Replace "will resist" with "is likely to resist" or "creates strong pressure to resist," reflecting the probabilistic/non-deductive nature of IC.  

  ### 5. Why Revision is Preferable
  *   **Preserves the Core Insight:** The revised section still powerfully argues that coherent agents optimize predictably, and that *if* goals are ambitious/fixed, dangerous convergent pressures arise.  
  *   **Increases Rigor:** It accurately reflects what the theorems prove vs. what requires additional (though reasonable) assumptions.  
  *   **Strengthens the Report:** Preempting this obvious counterargument makes the overall case more resilient and credible.  
  *   **Actionable for Authors:** These are discrete, focused edits requiring clarification of existing arguments, not a fundamental rewrite.  

  **Conclusion:** The standard coherence argument is essential but insufficient alone to support the strong claims about inevitable resistance. By clearly delineating the contribution of coherence (predictable optimization structure) from the contribution of assumed goal content (driving specific instrumental pressures), the section becomes both more accurate and more persuasive. I recommend revision along the lines outlined above.
