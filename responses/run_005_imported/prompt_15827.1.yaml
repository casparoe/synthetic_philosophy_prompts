prompt: |-
  hey, random Wittgenstein thing that's been bugging me while prepping for comps. In On Certainty §341-343 he sets up the hinge propositions idea:

  "the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn... it belongs to the logic of our scientific investigations that certain things are indeed not doubted... If I want the door to turn, the hinges must stay put."

  that sounds pretty fixed and structural, hinges have to stay put or the whole door (inquiry) doesn't work. But then way earlier, at §96-97, he uses a totally different picture for what seems like basically the same phenomenon:

  "It might be imagined that some propositions...were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid... the river-bed of thoughts may shift."

  here the hardened/hinge-like propositions can apparently soften and shift over historical time. So which is it? Is "the hinges must stay put" just a claim about what has to hold at a given moment for a particular inquiry to run at all, leaving room for that same proposition to lose hinge-status later on (like the bed shifting), or is Wittgenstein actually committed to hinges being fixed for good once they count as hinges? My advisor says im overreading two loose metaphors that were never meant to fit together, but that seems off for someone this obsessive about how he phrases things. Is there an actual defensible reading that reconciles "must stay put" with "may shift", or is this just a real tension in the text that people tend to gloss over?
reasoning: |-
  Okay, let me unpack this user's question about Wittgenstein's On Certainty. They're clearly deep into their comps prep and noticed what seems like a contradiction between two metaphors: hinges that "must stay put" versus a riverbed that "may shift." Their advisor dismissed it as overreading metaphors, but the user isn't buying that—rightly so, given Wittgenstein's precision.

  Hmm, first I need to confirm if these are genuinely conflicting ideas. The hinge metaphor in §341-343 emphasizes stability within a specific inquiry—like hinges needing to be fixed for a door to function. Meanwhile, §96-97's riverbed image suggests historical fluidity, where what's foundational can change over time. The user's sharp to spot this. 

  The key is recognizing Wittgenstein operates on two axes: synchronic (how a system functions *now*) and diachronic (how it evolves *over time*). At any given moment, hinges are immovable for inquiry to proceed—that's the "must stay put." But across different historical/cultural contexts, what *counts* as a hinge can change—hence the riverbed "shifts." 

  I recall Moyal-Sharrock's work on this distinction. She argues hinges aren't propositions but *ways of acting*—automatic, non-propositional certainties. That explains why they can be stable in practice yet culturally variable. Like "the earth exists" functioning as a hinge today but not in Descartes' era. 

  Also worth noting: the riverbed metaphor explicitly mentions temporal change ("alter with time"), while hinges describe structural necessity. So they're complementary, not contradictory. The user's advisor might undersell how meticulously Wittgenstein layers metaphors to capture different facets of certainty. 

  User’s frustration is valid—this isn't just loose phrasing. But the tension resolves if we see hinges as contextually fixed yet historically contingent. Maybe I should emphasize that "must stay put" applies *within* a language-game, while "may shift" describes *between* language-games. That’s the defensible synthesis.
answer: |-
  You've hit on a genuinely fascinating and debated tension in *On Certainty* – and your instinct that Wittgenstein wouldn't casually use contradictory metaphors lightly is spot on. Your advisor's "loose metaphors" dismissal underestimates Wittgenstein's meticulousness, especially concerning foundational concepts. There *is* a defensible reading reconciling §341-343 ("hinges must stay put") with §96-97 ("river-bed may shift"), and it hinges (pun intended) on distinguishing between **synchronic necessity** and **diachronic fluidity**:

  1.  **Synchronic Necessity ("Hinges Must Stay Put"):**
      *   **Function within a System:** At any *given moment* for a specific inquiry, language-game, or form of life to function, *certain* propositions *must* be treated as fixed. Doubting them *within that context* paralyzes the game.
      *   **Logical Scaffolding:** These hinges provide the background against which meaningful doubt, investigation, and assertion become possible. To doubt *everything* at once is not skepticism, but nonsense – it destroys the framework for doubt itself.
      *   **"Must Stay Put" for *This* Door:** The necessity is contextual and functional. For *this specific inquiry happening now*, *these specific hinges* cannot be questioned *if the inquiry is to proceed*. It's about the *logic of the activity*, not the eternal metaphysical status of the proposition.

  2.  **Diachronic Fluidity ("River-Bed May Shift"):**
      *   **Historical/Contextual Change:** What *counts* as a hinge proposition is *not fixed for all time or all contexts*. Over historical time, across cultures, or even within the evolution of a single individual's worldview, propositions can move between fluid (open to doubt/test) and hardened (functioning as hinges).
      *   **Examples:** "The Earth is flat" was once a hinge for navigation/cosmology; it became fluid and was tested/replaced. "The Earth orbits the Sun" is now a hinge for modern astronomy, but was once fluid (and heretical!). "There is an external world" functions as a hinge for most everyday and scientific activities, though radical skepticism tries (and arguably fails) to make it fluid.
      *   **Shifting Foundations:** The riverbed metaphor captures this dynamism. The *bed* provides the channel for the *fluid* water (empirical propositions, specific doubts). But the bed itself erodes, sediments build up, the course changes – yesterday's bedrock might become today's silt carried downstream, while new certainties solidify.

  **Reconciling the Two:**

  1.  **"Must Stay Put" ≠ "Must *Always* Stay Put":** The "must" in §341-343 is synchronic and functional: "For *this* door (inquiry) to turn *now*, *these* hinges *must* stay put *during this turning*." It says nothing about whether *this specific hinge* might lose its hinge-status for a *different* inquiry later, or in a different context/historical epoch. Wittgenstein isn't claiming hinges are eternally fixed truths; he's describing their *role* within a *functioning system* at a *given time*.
  2.  **Hinge Status is Contextual & Relative:** A proposition isn't inherently a hinge. Its status depends entirely on its role within a specific language-game or form of life *at a specific time*. The *same proposition* can be a hinge in one context (e.g., "Water boils at 100°C at sea level" in a cooking class) and a fluid empirical claim in another (e.g., in a high-altitude physics lab testing phase changes).
  3.  **The River-Bed Explains the *Possibility* of Change:** The river-bed metaphor explicitly addresses *how* what is foundational can change over time. §96-97 provides the diachronic perspective that the synchronic hinge metaphor in §341-343 presupposes but doesn't explicitly discuss. The river-bed explains *why* the specific hinges "must stay put" *now* but might not always be hinges.
  4.  **Change is Not Arbitrary or Instantaneous:** While the river-bed shifts, it doesn't do so capriciously or constantly. Shifts happen gradually, often driven by overwhelming evidence, paradigm shifts (Kuhn), or profound cultural changes. At any point *during* a stable period, the relevant hinges *must* stay put for inquiry to function. The shift itself is a different kind of event – not a normal inquiry *within* a system, but a transformation *of* the system.

  **Why This Isn't Just Loose Metaphors:**

  Wittgenstein is grappling with the nature of certainty itself. He rejects:
  *   **Foundationalism:** That there are eternal, indubitable truths (like Descartes' Cogito or logical atoms).
  *   **Coherentism:** That certainty comes solely from internal consistency within a system.
  *   **Skepticism:** That radical doubt is meaningful or possible in practice.

  Instead, he offers a **pragmatic, contextualist** view:
  *   Certainty is **embedded in action and practice** ("hinges" are things we *act* upon unquestioningly).
  *   It is **relative to a form of life** (shared human behaviors, language-games).
  *   It is **dynamic over time** (the river-bed shifts).
  *   But it is **logically necessary *within* its context** (hinges must stay put for *this* game *now*).

  **Conclusion:**

  There is no contradiction. Your reading is insightful, not overreading.

  *   **"Hinges must stay put"** describes the **synchronic, functional necessity** within a specific, operating inquiry or language-game. For the doubt *here and now* to make sense, *these* things *cannot* be doubted *right now*.
  *   **"The river-bed may shift"** describes the **diachronic, historical contingency** of what *counts* as a hinge proposition. What is bedrock certainty in one era or context can become open to question and change in another.

  Wittgenstein is showing us that the *foundations* of our knowledge and doubt are simultaneously **necessary for local functioning** and **contingent on historical context and practice**. The metaphors work together perfectly to capture this profound and nuanced view. The tension you perceive is the tension inherent in human certainty itself – it *feels* absolute in the moment, yet history shows it evolves. Wittgenstein masterfully captures both aspects.

  **Key Scholars/Readings Supporting This View:**
  *   **Danièle Moyal-Sharrock:** Her work (e.g., *Understanding Wittgenstein's On Certainty*) strongly emphasizes the hinge/river-bed distinction as synchronic/diachronic and the contextual nature of hinges.
  *   **Avrum Stroll:** In *Moore and Wittgenstein on Certainty*, he discusses the dynamic nature of the "bedrock."
  *   **Michael Williams:** His contextualist epistemology (e.g., *Unnatural Doubts*) is heavily influenced by Wittgenstein and explicitly addresses how challenges can shift what counts as foundational.

  You're absolutely right to press on this – it's central to understanding Wittgenstein's revolutionary (and non-dogmatic) account of certainty. Good luck with comps!
