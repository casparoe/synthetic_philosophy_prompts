answer: |-
  ## The Unseen Alphabet

  The gas lamps hissed in Professor Barrett’s Cambridge study, casting long, wavering shadows that seemed to cling to the corners like shy observers. Henry Sidgwick, tall, stooped, his beard meticulously trimmed but his eyes holding a perpetual, weary depth, sat slightly apart from the others. He watched as William Barrett, flushed with earnest enthusiasm, arranged five young women – the Creery sisters – around a large, plain table. Their father, a Derbyshire clergyman, hovered near the door, radiating a quiet pride that felt brittle to Sidgwick.

  "Right then, ladies," Barrett announced, his voice overly bright in the hushed room. "As before. Professor Sidgwick will select an object from this tray, hold it aloft behind the screen, and we shall see if Miss Alice, isolated in the adjoining room, can perceive it. Clear minds, clear transmission!"

  Sidgwick suppressed a sigh. *Transmission*. Such a tidy, mechanical word for the chasm he was trying to bridge. He picked up a small, ivory-handled penknife. He held it steady behind the tall wooden screen separating Alice Creery from her sisters and the assembled gentlemen – Barrett, Gurney, a young Trinity don whose name escaped Sidgwick at that moment, and himself.

  "Concentrate, girls," their father murmured. "Think of Alice. Think of the knife."

  A beat of silence, thick with expectation. Sidgwick noted the fixed stare of the eldest sister, Mary, towards the blank wall facing Alice’s room. Her lips moved minutely. Then, Alice’s voice, clear and young, piped from the next room: "A knife! A small knife... with a white handle!"

  A collective intake of breath, followed by Barrett’s triumphant chuckle. "Remarkable! Unerring! You see, Sidgwick? The consistency!"

  Sidgwick nodded, his expression unreadable. He placed the knife back on the tray. "Indeed. Consistency is... notable." He selected a brass thimble. Held it up. Silence. Then a faint cough from Mary Creery. Sidgwick’s gaze sharpened, flicking towards her.

  "A thimble!" Alice called out. "A shiny one! Made of metal!"

  "Metal?" Barrett queried, scribbling furiously. "Specificity improving!"

  Sidgwick felt Edmund Gurney shift beside him. Gurney, his face a study in intense concentration, leaned forward slightly. He’d been quiet all evening, his usual volubility replaced by watchfulness. Sidgwick appreciated that. Gurney saw patterns, anomalies.

  They ran through a dozen more objects: a porcelain button, a stub of red sealing wax, a dried sprig of lavender. Alice’s accuracy was impressive, hovering around ninety percent. The sisters sat with demure stillness, hands folded in their laps. Only Mary’s eyes seemed perpetually active, scanning the room, the screen, her sisters. Sidgwick noted the occasional, almost imperceptible, shift in her posture – a tilt of the head, a minute adjustment of her shoulders – coinciding with moments before Alice’s correct identification. Coincidence? Observation honed by decades of dissecting philosophical arguments and fraudulent mediums screamed *signal*.

  Barrett suggested a break. Tea was brought in. The atmosphere loosened. The young Trinity don engaged the sisters in pleasantries about Derbyshire. Sidgwick remained silent, sipping his lukewarm tea, his mind a whirlpool. *Is it merely sensory cuing? Lip-reading through the screen? But Alice is behind a solid door... unless...* He thought of the hours spent in dim séance rooms, the palpable yearning of the sitters, the desperate clutch at straws of evidence. He thought of his own yearning – not for ghosts, but for *proof*. Proof that the universe held an account book, that the scales of justice weren't ultimately mocked by the final silence of the grave. His entire ethical edifice, so rigorously constructed in *The Methods of Ethics*, rested on the quicksand of that unanswered question. Reason couldn't build a bridge from self-interest to universal duty without the hope, the *fact*, of a cosmic order that rewarded virtue beyond this life. Psychical research wasn't a hobby; it was the desperate, empirical wing of his moral philosophy.

  Barrett clapped his hands. "Shall we resume? Let us increase the complexity! Miss Alice, we shall now attempt names! Written names!" He held up a small chalkboard. "I shall write a name here, shield it, and see if the impression forms."

  He wrote 'CHARLES'. Shielded it. Silence stretched. Sidgwick watched Mary. Her fingers tightened on her teacup. A small, dry cough escaped her lips. Then another. Sidgwick counted internally. *One... two...*

  "Charles!" Alice announced.

  Barrett beamed. "Excellent!"

  He wrote 'ELEANOR'. Shielded it. Mary’s foot tapped lightly, twice, against the leg of her chair. Sidgwick saw Gurney’s eyes dart towards her foot, then back to the screen.

  "Eleanor!" Alice called.

  Gurney cleared his throat. "Professor Barrett, perhaps... perhaps we might vary the method slightly? Instead of holding the board aloft, could you place it flat on the table behind the screen? To eliminate any possibility of... reflection?"

  Barrett looked momentarily nonplussed, then agreed. "Very well, Gurney. Vigilance is our watchword!" He placed the board flat, wrote 'BENJAMIN', and carefully covered it with a large book.

  The room grew very still. Sidgwick watched Mary. Her eyes flickered towards her sister Louisa. Louisa gave an almost imperceptible nod. Mary’s hand rose slowly, ostensibly to tuck a stray hair behind her ear. As her hand neared her temple, her index finger extended briefly, pointing upwards, then curled back. Once. Twice.

  "Benjamin!" Alice’s voice held a note of confidence.

  Barrett looked ready to applaud. Gurney, however, stood up abruptly, his chair scraping. His face was pale, his eyes blazing. "Miss Creery," he said, his voice tight but controlled, addressing Mary directly. "Would you be so kind as to stand up for a moment?"

  Mary froze. The brittle pride on her father’s face cracked into confusion. "Mr. Gurney? What is the meaning of this?"

  Gurney ignored him, his gaze fixed on Mary. "Please. Stand."

  Slowly, hesitantly, Mary rose. Gurney walked around the table towards her. As he passed her chair, he stooped. When he straightened, he held a small, plain white card that had been tucked between the cushion and the wooden frame. On it, drawn in pencil, was a grid of letters, grouped in clusters. Beside each cluster, a tiny notation: *Cough once*, *Tap foot twice*, *Point finger once*, *Touch ear...*

  A gasp went around the table. Louisa let out a small whimper. Their father’s face crumpled. Barrett stared, open-mouthed, at the card in Gurney’s hand, then at Mary, who had buried her face in her hands, her shoulders shaking with silent sobs.

  "It... it was just a game, sir," Louisa whispered, tears streaming down her face. "At first... then you gentlemen took it so seriously... we didn't know how to stop..."

  The silence that followed was profound. It wasn’t the silence of spooky revelation, but the heavy, crushing silence of exposed mechanics. The gas lamps hissed, indifferent. Barrett deflated, sinking into his chair, muttering, "But the objects... the accuracy..."

  Sidgwick finally spoke, his voice low and weary, yet devoid of anger. "The objects likely relied on simpler signals. A glance, a posture. Familiarity. The names required a code." He looked at the card in Gurney’s hand – the unseen alphabet of their deception. It was almost elegant in its mundanity. "Thank you, Gurney. Your vigilance was... necessary."

  He stood, feeling every one of his forty-seven years, every hour spent in pursuit of wisps. He offered a stiff, formal bow to the weeping sisters and their devastated father. "Good evening, Mr. Creery. Ladies. Professor Barrett, Gurney." He included the stunned young don with a nod.

  Outside, the crisp Cambridge air was a shock after the close, disappointed room. Gurney fell into step beside him, radiating a furious energy. "The *gall* of it, Henry! Playing with... with the most profound questions as if it were charades! Barrett’s been utterly duped!"

  Sidgwick walked slowly, his hands thrust deep into his coat pockets, his gaze fixed on the uneven cobblestones gleaming under the gaslight. The comedy was undeniable: the eminent philosophers, the clergyman’s daughters, the hidden card. A Punch and Judy show played out in a Cambridge study. Yet, the laughter caught in his throat.

  "They are young, Gurney," he said quietly. "Caught up in attention, perhaps fear of disappointing their father, or us. It is human, not demonic."

  "But the *work*," Gurney protested. "The time wasted! The hope...!"

  "Hope," Sidgwick repeated, the word hanging in the cold air like breath. "Is precisely what remains to be tested. This," he gestured vaguely back towards Barrett’s house, "is not evidence *against* the possibility. It is evidence *for* the necessity of rigor. For the difficulty." He stopped, looking up at the night sky, obscured by the town’s glow and a haze of coal smoke. No stars visible. "Barrett saw confirmation. You saw the code. Both were present. The world contains both phenomena and the mechanisms for deception. Disentangling them... that is the task."

  Gurney shook his head, still agitated. "But where does it end? Fraud upon fraud!"

  "It ends," Sidgwick said, starting to walk again, his voice almost lost in the clatter of a distant carriage, "when we have exhausted every avenue of inquiry. Or when we expire trying." He offered Gurney a faint, tired smile. "Reason alone, my friend, cannot settle the question of whether reason suffices for morality. It requires... data. However elusive."

  He turned towards his college rooms. The disappointment was a familiar ache, a dull companion. It wasn't the sharp sting of shattered belief – he’d long ago walled off that particular vulnerability – but the grinding weight of the unresolved. The Creery sisters had offered a path, brightly lit for a moment, now definitively closed. Another corridor in the vast, echoing mansion of the unknown marked *Dead End*. Yet, as he walked, the image that stayed with him wasn't Mary’s coded gestures or Alice’s disembodied voice, but the grid on that small white card. An alphabet. A system. Proof that minds *could* communicate hidden things, albeit through crude, earthly means. It was a mockery of the telepathy he sought, yet it whispered of possibility, of connection, however flawed.

  He reached his door, fumbling for the key. The grand ethical dilemma remained: how to bind the rational self to the good of all without the promise of cosmic justice. Tonight offered no answer, only the familiar, hollowed-out space where certainty should reside. He stepped into the quiet gloom of his sitting room. The fire had died to embers. He did not light a lamp. He sat in his armchair, the events of the evening replaying – the coughs, the taps, the tears, Gurney’s triumphant grimace holding the damning card. He rubbed his temples.

  *Another failure.* The word echoed. Yet, as the silence of the room deepened, a quieter thought surfaced: *Another point plotted on the graph.* The graph that charted not success or failure in proving immortality, but the painstaking, necessary mapping of human credulity and ingenuity. To stop plotting points because the line refused to rise towards proof... that would be the true abandonment. That would be leaving the gap between private good and universal duty yawning, unbridgeable by anything but a fragile, ungrounded hope. He could not do that. The rigor demanded he continue. The hope, battered but persistent, required it.

  He sat for a long time in the dark, the only sound the slow tick of the mantel clock, measuring out the endless, unresolved night. Tomorrow, there would be letters to write, reports to amend for the SPR Proceedings, another batch of census of hallucinations testimonies to analyze. The work, the only work that mattered, continued.
