  For the memo structure: Start by trashing but-for for this scenario, then explain why "substantial factor" works but feels empty. Next, pitch the structural approach as a backbone for the instruction, using plain language about "independent sufficiency" and "causal contribution." The actual jury instruction must avoid terms like "exogenous variables"—focus on factors being independently capable and actively involved. 

  Biggest risk: Overcomplicating. Pearl’s model requires setting up structural equations, but jurors can’t parse that. Instead, the instruction should imply the logic: "If you find each fire alone was sufficient, and both were actual causes, then both count." The "unless" clause handles edge cases like one fire being hypothetical. 

