answer: |-
  ## MEMORANDUM  
  TO: Civil Jury Instructions Committee  
  FROM: [Your Name], Committee Member  
  DATE: October 26, 2023  
  RE: Proposed Revision to Causation Instruction for Multiple Independent Sufficient Causes (MISC)  

  **I. The Problem: But-For Causation Fails, "Substantial Factor" Obfuscates**  
  Current instructions rely heavily on "but-for" causation (Defendant’s negligence was a necessary condition for the harm). This fails catastrophically in MISC cases (e.g., two independently sufficient fires merging to burn the barn). Neither fire is a but-for cause – the harm would have occurred without either one. Courts resort to the "substantial factor" test as a workaround, but it provides **no clear conceptual foundation** for why *both* defendants are liable. Juries are left guessing what "substantial" means in this context.  

  **II. The Theoretical Foundation: Interventionism & Structural Causal Models**  
  Instead of counterfactuals in isolation (Lewis), we ground our approach in the **Interventionist/Structural Equations framework** (Woodward, Pearl, Halpern & Pearl). This models causation as changes in an outcome variable (harm) resulting from interventions on causal variables (defendants' actions) within a system of dependencies.  

  *   **Key Insights for MISC:**  
      1.  **Model the System:** We represent the causal structure: `Fire A -> Barn Burns`; `Fire B -> Barn Burns`.  
      2.  **Independent Sufficiency:** An intervention setting `Fire A = "Present"` while fixing `Fire B = "Absent"` leads to `Barn Burns = "Yes"` (and vice-versa).  
      3.  **Actual Cause (Halpern-Pearl):** `Fire A` is an actual cause of `Barn Burns` in the actual context (where `Fire B` was also present) if:  
          *   There exists a contingency (e.g., setting `Fire B = "Absent"`) where changing `Fire A` from present to absent changes `Barn Burns` from Yes to No.  
          *   `Fire A`'s presence makes a difference *relative to a state of the world consistent with the actual non-causal background facts* where the other sufficient cause is removed.  
      4.  **Overdetermination Handled:** Both `Fire A` and `Fire B` satisfy this test. Removing `Fire A` *while hypothetically holding `Fire B` absent* (a contingency allowed by the framework) results in no fire. The actual presence of `Fire B` doesn't negate `Fire A`'s causal status; it provides the context for testing `A`'s causal role.  

  **III. Proposed Jury Instruction: Grounded in Causal Structure**  
  This instruction translates the structural approach into legally operational terms, replacing the nebulous "substantial factor" with defined criteria:  

  > **CAUSATION: MULTIPLE SUFFICIENT CAUSES**  
  > If you find that the plaintiff's harm would have occurred solely because of one independent cause, even if the defendant's negligence had not existed, you must still find that the defendant's negligence was a cause of the harm if you find *all* of the following by a preponderance of the evidence:  
  >
  > 1.  **Independent Capability:** The defendant's negligent conduct, by itself and under the actual circumstances, was capable of causing the plaintiff's harm; *and*  
  > 2.  **Actual Contribution:** The defendant's negligent conduct was actively involved in bringing about the harm; *and*  
  > 3.  **No Superseding Exclusion:** The harm was not brought about solely by other causes operating *completely independently* of the defendant's conduct, such that the defendant's conduct made no difference to the actual occurrence of the harm.  
  >
  > *If you find that more than one defendant's negligent conduct meets all three conditions, then each such defendant's conduct was a cause of the harm.*  

  **IV. Reasoning Behind the Proposed Instruction**  

  *   **Element 1 (Independent Capability):** Captures the "sufficiency" aspect of MISC. It asks whether the defendant's force, *in the real-world context*, had the inherent power to cause the harm. This mirrors testing the structural equation for that variable.  
  *   **Element 2 (Actual Contribution):** Ensures the defendant's force wasn't merely hypothetical; it was actively part of the causal chain. This addresses preemption concerns (e.g., Fire A burns the barn seconds before Fire B arrives - Fire B is sufficient but didn't *contribute*). It replaces "substantial factor" with a focus on real-world participation.  
  *   **Element 3 (No Superseding Exclusion):** The critical refinement. It clarifies that liability attaches *unless* the other cause(s) operated in a way that *completely excluded* the defendant's conduct from playing any role. In the two-fire case, each fire *does* make a difference to the actual occurrence – the harm happens *because of* the combined forces/processes, even if redundant. If a *third*, entirely independent fire somehow burned the barn *first*, completely nullifying the effect of the defendant's fire, this element might not be met.  
  *   **Grounding in Interventionism:** This structure implicitly requires the jury to consider counterfactual interventions (What if *only* this defendant's conduct happened? What if it were removed while other *actual* causes remain?) but within the context of the actual causal structure, avoiding the pitfalls of simple but-for comparisons.  

  **V. The Case for Keeping "Substantial Factor" (And Why We Should Overcome It)**  

  *   **The Best Reason for "Substantial Factor": Judicial Familiarity & Flexibility.** The term is deeply entrenched in precedent across jurisdictions. Judges and lawyers understand it as the signal for "but-for doesn't work here, find cause anyway." Its vagueness allows courts to flexibly cover MISC, preemption, and other complex causal scenarios without intricate doctrinal distinctions. It minimizes appellate risk based on novel formulations.  

  *   **Why We Should Move Beyond It:** Precisely *because* of its vagueness. It provides **no meaningful guidance** to juries. What makes a factor "substantial" in an overdetermination case? Size? Timing? Proximity? The concept is empty without the underlying structural logic we propose. Our instruction provides:  
      *   **Transparency:** Juries understand *why* they are finding causation.  
      * **Consistency:** Applies a principled test grounded in modern causal reasoning.  
      * **Accuracy:** Better distinguishes true MISC (both liable) from scenarios like preemption (only one liable) or truly independent superseding causes (no liability).  
      * **Legitimacy:** Grounds the legal fiction necessary for fairness in MISC cases in coherent philosophical and scientific theory.  

  **VI. Recommendation**  
  I recommend adopting the proposed three-element instruction. It replaces an empty placeholder with a structured, theoretically sound test that provides juries with genuine guidance while achieving the just outcomes sought by the "substantial factor" doctrine. It modernizes our jurisprudence in line with the best understanding of causation. While "substantial factor" offers the comfort of familiarity, it abdicates our responsibility to give juries the tools they need to reason soundly about complex causation. This proposal provides those tools without undue complexity.  

  **Attached:** Draft Instruction Language (Section III above).
