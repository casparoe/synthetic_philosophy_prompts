prompt: |-
  So I just got roped into my state's civil jury instructions committee (previous member moved to the bench, I'm the fill-in) and my first real assignment is revising the causation instruction for cases with multiple independent sufficient causes -- think two negligently-set fires that merge and burn down a barn, where neither fire alone counts as a "but-for" cause because the other one would've finished the job anyway. I've fallen down a rabbit hole reading about how Lewis's counterfactual theory of causation can't really handle this cleanly, which is why courts lean on the "substantial factor" fudge instead, versus how the newer interventionist/structural-equations approach -- Woodward, Pearl, the whole Halpern-Pearl "actual cause" framework -- is supposed to handle overdetermination and preemption better by modeling the whole causal structure instead of comparing one counterfactual at a time. I don't want to hand the commitee something that just restates "substantial factor" and calls it a day. Can you write the memo I'd actually bring to this group: a recommended instruction (or approach), reasoning grounded in one of these theories (or an honest hybrid of them), and a fair statement of the best reason to just keep the old workaround instead?
