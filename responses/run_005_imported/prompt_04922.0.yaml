answer: |-
  ### Experimentation Review Board Decision Memo  
  **Date:** October 26, 2023  
  **Subject:** Ruling on Growth Team's Onboarding-Flow A/B Test (Early Stopping & Bayesian Re-analysis)  

  ---

  #### **Background**  
  The Growth Team initiated a three-week A/B test to evaluate a new user onboarding flow, with conversion rate as the primary metric. On day 9 of 21, the test was halted when the frequentist p-value reached 0.05 (indicating a nominally "significant" improvement). The team now seeks approval to ship the change based on this result. Our statistician objects due to **optional stopping** (early termination inflates Type I error in frequentist methods). The Growth Team counters that a Bayesian re-analysis of the same data—using a beta-binomial model—yields a 97% posterior probability that the new flow is superior, arguing Bayesian methods are immune to stopping rules.  

  The Board acknowledges both positions:  
  - **Statistician’s objection:** Optional stopping invalidates the frequentist p-value, as the test design assumed a fixed sample size.  
  - **Growth Team’s rebuttal:** Bayesian posterior probabilities depend only on observed data, not stopping rules, per the likelihood principle.  

  After deliberation, the Board is split on whether the Bayesian approach fully resolves the objection or merely relocates the risk of false positives.  

  ---

  #### **Ruling**  
  The rollout **may not proceed** based on the current analysis. The test must be **restarted and run to completion** (full three weeks) without early stopping for efficacy.  

  **Reasoning:**  
  1. **Frequentist results are invalidated by optional stopping.**  
     The p-value of 0.05 on day 9 is statistically unreliable. Stopping early inflates false-positive rates (Type I error) because repeated testing increases the chance of random extremes. The three-week design was intended to control this risk; deviating voids its validity.  

  2. **Bayesian results do not fully mitigate the risk.**  
     While Bayesian updating is technically unaffected by *when* data is observed (per the likelihood principle), early stopping still introduces practical risks:  
     - **Exaggerated effect sizes:** Stopping at a random high can overestimate the true improvement ("winner’s curse").  
     - **Unquantified error control:** Unlike frequentist methods, standard Bayesian approaches do not inherently control long-run false-positive rates. The 97% posterior probability does not equate to a 3% error rate in repeated practice if optional stopping is habitual.  
     - **Prior sensitivity:** The beta-binomial model’s output depends on prior choice. Without a pre-specified, justified prior, results may be subjective.  

  3. **Precedence and policy integrity:**  
     Allowing post hoc switching to Bayesian methods after early stopping sets a risky precedent. Teams could "peek" at data, stop if results appear favorable, and justify decisions via Bayesian re-analysis—undermining experiment rigor.  

  **Concrete timeline for resolution:**  
  - The Growth Team must **restart the test within 48 hours** of this decision.  
  - The test must run for the **full pre-specified 21 days**, with no early stopping for efficacy.  
  - Results will be reviewed by the Board **within 2 business days** of completion.  
  - If the frequentist p-value remains ≤0.05 *and* the Bayesian posterior probability (with a pre-agreed prior) remains ≥95% at full sample size, the change may ship immediately.  

  ---

  #### **Monitoring Policy for Future Tests**  
  To prevent recurrence, the Board establishes these mandatory protocols:  

  1. **Pre-specify analysis methods and stopping rules:**  
     - Teams must declare *in the initial proposal* whether they will use frequentist, Bayesian, or hybrid methods.  
     - If Bayesian, specify and justify the prior (e.g., weakly informative beta[1,1]).  
     - **No switching methods post-launch** without Board approval.  

  2. **For early stopping:**  
     - **Frequentist designs:** Stopping before the planned duration is only permitted if pre-authorized "interim analyses" use alpha-spending functions (e.g., O’Brien-Fleming) to control Type I error. Peeking without adjustment is prohibited.  
     - **Bayesian designs:** Early stopping is allowed *only* if the decision threshold (e.g., "stop if posterior probability >95%") is pre-specified.  

  3. **Harm monitoring exemption:**  
     Teams may stop tests early *only* for severe negative impacts (e.g., significant drop in core metrics), regardless of the statistical framework.  

  4. **Sensitivity analysis requirement:**  
     All tests must include robustness checks (e.g., Bayesian re-analysis with conservative priors for frequentist tests; bootstrapping for Bayesian tests). Results are only actionable if both frameworks converge.  

  ---

  #### **Fair Hearing for Both Sides**  
  **To the Growth Team:**  
  The Board recognizes your urgency to improve user onboarding and commends your proactive use of multiple statistical approaches. The Bayesian result (97% posterior probability) is compelling and suggests a likely true effect. However, shipping based on an incompleted test—regardless of framework—risks deploying a suboptimal or harmful change. Restarting the test with a pre-specified Bayesian design (allowing early stopping under strict rules) would align your goals with statistical integrity. We encourage resubmitting under the new policy.  

  **To the Statistician:**  
  Your caution about optional stopping is statistically sound and preserved the Board’s rigor. However, dismissing Bayesian methods outright overlooks their utility for decision-making under uncertainty. The updated policy formally integrates Bayesian approaches with appropriate safeguards, addressing your concern while expanding the team’s toolkit.  

  ---

  **Vote Summary**  
  - Approve ruling: 5 (Majority)  
  - Reject ruling: 4 (Minority)  

  **Signed,**  
  Experimentation Review Board  
  *— Upholding rigor, enabling innovation—*
