prompt: |-
  I sit on my company's Experimentation Review Board, the internal group that must sign off before an A/B test result can be used to justify a permanent product change. The growth team stopped their onboarding-flow test on day 9 of a planned three-week run, the moment the frequentist p-value for the conversion-rate difference crossed 0.05, and now want to ship on that basis; our statistician objects on optional-stopping grounds, but the growth PM counters that a colleague re-ran the same nine days of data through a Bayesian beta-binomial model, got a 97% posterior probability that the new flow is better, and argues that number is untouched by the objection, since Bayesian updating doesn't care why or when you decided to look at the data. The board is split on whether that reply actually defeats the statistician's objection or just relocates it. Please draft the board's written decision memo: rule on whether the rollout can proceed, with a concrete timeline for whatever you recommend, and set a monitoring policy for future tests -- and make sure whichever side you rule against gets a fair hearing rather than a one-line dismissal.
reasoning: |-
  We are the Experimentation Review Board, and we have to make a decision on the growth team's request to ship a change based on an A/B test that was stopped early. The test was planned for three weeks but stopped on day 9 when the frequentist p-value crossed 0.05. The statistician objects due to optional stopping. The growth team counters with a Bayesian analysis (beta-binomial model) showing a 97% posterior probability that the new flow is better, arguing that Bayesian methods are immune to the optional stopping issue.

  Key issues:
  1. **Optional Stopping in Frequentist Statistics**: In frequentist A/B testing, stopping early when a threshold is reached inflates the Type I error rate (false positives). The p-value of 0.05 on day 9 is not reliable because the test was designed for a fixed sample size (three weeks). The nominal 5% error rate is no longer valid.

  2. **Bayesian Argument**: The Bayesian approach updates beliefs based on the data observed. The posterior probability (97%) is interpreted as the probability that the new flow is better given the data and prior. The growth team argues that because Bayesian inference conditions on the observed data, the stopping rule (why or when you stopped) is irrelevant (this is the Likelihood Principle).

     However, note: The Bayesian approach is not entirely immune to optional stopping if we care about frequentist properties (like long-run error rates). But if we are purely Bayesian and interpret the posterior probability at face value, then the stopping rule does not affect the computation of the posterior. However, the board must consider the validity of the Bayesian model and prior choice.

  3. **The Board's Split**: Some members think the Bayesian reply defeats the objection, others think it just relocates it (i.e., the issue of early stopping is still present in the Bayesian framework if we are concerned about calibration in repeated experiments).

  Decision Factors:
  - The Bayesian analysis used a beta-binomial model. We must consider if the prior was reasonable (e.g., non-informative or weakly informative). If the prior was chosen appropriately, then the posterior probability is a valid measure of evidence conditional on the data.
  - However, the board must also consider the risk of making a decision based on an underpowered test. Stopping at day 9 might mean the effect is real but the estimate of the effect size is inflated (winner's curse) and the uncertainty is understated.

  Our ruling must:
  - Rule on whether the rollout can proceed, with a concrete timeline.
  - Set a monitoring policy for future tests.
  - Give a fair hearing to both sides.

  Decision Memo Draft:

  ---

  **Experimentation Review Board Decision Memo**

  **Regarding:** Growth Team's Onboarding-Flow A/B Test (Early Stopping and Analysis)

  **Date:** [Current Date]

  **Decision Summary:**
  After thorough review of the growth team's A/B test on the onboarding flow, including the early stopping and the subsequent Bayesian re-analysis, the Board has decided that the rollout **cannot proceed at this time**. The test must be rerun for the full planned duration (three weeks) without early stopping for the purpose of achieving statistical significance. The growth team may relaunch the test immediately, and the board will review the results after the full three weeks.

  However, recognizing the potential value of the change and the desire for timely decision-making, the Board also sets an alternative path: if the growth team wishes to use the Bayesian framework for decision-making in the future, they must pre-specify the Bayesian design (including the prior and the stopping rule) and the decision threshold in the experiment proposal. For the current test, because the Bayesian analysis was not pre-specified and the early stopping was based on a frequentist threshold, we require the full run to ensure robustness.

  **Detailed Reasoning:**

  The Board acknowledges the arguments from both the growth team and the statistician:

  1. **Statistician's Objection (Optional Stopping in Frequentist Context):**  
     The statistician correctly points out that in frequentist statistics, stopping a test early when a p-value crosses a threshold (without pre-specified interim analyses) inflates the Type I error rate. The p-value of 0.05 observed on day 9 does not carry the same evidential weight as it would in a fixed-sample test. Therefore, the frequentist result is invalid for decision-making.

  2. **Growth Team's Bayesian Counter:**  
     The growth team presented a Bayesian analysis (beta-binomial model) that yielded a 97% posterior probability that the new flow is better. They argue that Bayesian inference, being conditional on the observed data, is unaffected by the stopping rule (per the Likelihood Principle). The Board recognizes the theoretical validity of this argument within the Bayesian framework. However, we note the following concerns:
     - The Bayesian analysis was not pre-specified. The experiment was designed and initiated as a frequentist test. The switch to Bayesian analysis after observing the data and stopping early introduces a form of data dredging.
     - The prior distribution used in the beta-binomial model must be carefully considered. Without a pre-specified and justified prior, the posterior probability might be sensitive to the prior choice. In this case, the Board has not reviewed the prior for appropriateness.
     - Even in Bayesian analysis, early stopping can lead to overestimation of the effect size (exaggeration bias) and the posterior probability might be overly optimistic if the stopping was driven by a random early fluctuation.

  3. **Board's Evaluation:**  
     The Board is split on whether the Bayesian reply fully addresses the optional stopping concern. While the Bayesian computation of the posterior is indeed unaffected by the stopping rule, the decision to stop and then choose a Bayesian analysis after the fact is problematic. This is because the overall procedure (stopping when a frequentist threshold is crossed and then switching to Bayesian) is ad hoc and not part of a pre-specified plan. This increases the risk of false positives beyond the nominal levels of either framework.

     Moreover, the Board must consider the precedent set by allowing such ad hoc analyses. If we accept this, teams might be tempted to stop tests early and then switch to a Bayesian framework to justify shipping, which would undermine the integrity of our experimentation culture.

  **Ruling:**

  - **Current Test:** The Board rejects the current request to ship based on the day 9 results. The growth team must restart the test and run it for the full three weeks as originally planned. The test must not be stopped early for the purpose of claiming significance. The team may monitor for harm (e.g., significant drop in a key metric) and stop if severe negative effects are observed, but not for positive results.
    
    **Timeline:** The test must be restarted within one week of this decision. The board will review the results after the full three weeks of data collection.

  - **Alternative Path for Bayesian Approach:** The Board encourages the growth team (and other teams) to consider Bayesian methods for future experiments, but these must be pre-specified in the experiment proposal. The proposal should include:
     - The prior distribution and its justification.
     - The stopping rule (if any) and the decision threshold (e.g., "we will stop if the posterior probability of the variant being better exceeds 95%").
     - The model (e.g., beta-binomial) and the analysis plan.

     If such a design is approved by the Board, then early stopping based on the pre-specified Bayesian rule would be acceptable.

  **Monitoring Policy for Future Tests:**

  To prevent similar issues, the Board establishes the following policy for all future A/B tests:

  1. **Pre-specification of Design:** All experiments must pre-specify:
     - The primary metric and the statistical method (frequentist or Bayesian).
     - The sample size (for frequentist) or the stopping rule (for Bayesian or group sequential designs).
     - For frequentist tests: the planned duration and sample size, and if interim analyses are allowed, they must use a corrected threshold (e.g., O'Brien-Fleming, Pocock) to control the overall Type I error. Any early stopping for efficacy must be pre-specified and approved.
     - For Bayesian tests: the prior, the decision threshold, and the stopping rule.

  2. **Early Stopping:**
     - **Frequentist:** Early stopping for efficacy is only allowed if the design includes pre-specified interim analyses with appropriate alpha spending. Stopping at an arbitrary point because the p-value crossed 0.05 is prohibited.
     - **Bayesian:** Early stopping is allowed only if the stopping rule and threshold are pre-specified and approved.

  3. **Analysis:** Post-hoc switching of statistical methods (e.g., from frequentist to Bayesian) is not allowed unless pre-specified as a sensitivity analysis. The primary analysis must be the pre-specified one.

  4. **Monitoring:** Teams may monitor experiments for safety (e.g., significant negative impacts) and stop for harm without penalty. However, stopping for efficacy without a pre-specified plan will require rerunning the test.

  **Conclusion:**

  The Board appreciates the growth team's initiative and the potential of the new onboarding flow. However, the integrity of our decision-making process requires that we adhere to sound statistical practices. The current test results are not sufficient due to the ad hoc early stopping. We require a full rerun of the test. We also encourage the team to consider submitting a Bayesian design for the next iteration of this test, which may allow for earlier stopping if the evidence is strong enough.

  We believe this decision balances statistical rigor with practical business needs and sets clear guidelines for future experiments.

  Signed,
  [Experimentation Review Board]

