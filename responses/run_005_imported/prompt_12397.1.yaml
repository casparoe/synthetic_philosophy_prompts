  I should start the toast with warmth and celebration. Acknowledge the milestone and the brother's effort. Then introduce the negotiation metaphor simply. Explain why moderation didn't work for him—each decision to drink was a renegotiation where the present self won. The zero-drink rule acts as a pre-commitment, ending those negotiations. This honors his insight without technical jargon.

