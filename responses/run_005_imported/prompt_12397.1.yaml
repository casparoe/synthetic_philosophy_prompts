  Structure: Opening thanks, the brother's insight, how it works, why it matters, his growth, and a toast. Keep it around 3 minutes. Personalize with "you" to make it direct. End with a celebratory toast, inviting others to join.

  Ensure the core idea is integral, not tacked on. Weave it throughout, showing how this understanding shaped his approach. Use metaphors like "bright line" and "negotiation table" to make it vivid. Keep sentences varied for oral delivery—pause points, emphasis on key phrases.

  Finally, review for tone: respectful, proud, loving, and inclusive. Make sure the brother feels seen and honored for his unique perspective. The toast should resonate emotionally while conveying his intellectual contribution to his own recovery.
