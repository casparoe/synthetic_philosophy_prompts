answer: |-
  The mud sucked at the messenger’s boots as he stumbled towards the great felt *ger* in the center of the camp. Spring in Hungary wasn't the crisp thaw of the steppes; it was a clinging, sucking bog. Batu Khan, grandson of Genghis, stared at a map weighted with stones, tracing the swollen curve of the Danube with a calloused finger. Outside, the rhythmic thump of smiths working sounded thin, dampened by the humid air. Subutai, the old wolf, sharpened a dagger, the scrape unnaturally loud in the tense quiet.

  "They burrow deeper," Batu muttered, not looking up. "Like marmots in stone. Every river crossing costs blood and time. And this... *mud*." He flicked a clot from his boot.

  Subutai didn't pause his sharpening. "Stone slows the horse. Water drowns the will. But stone crumbles. Will falters." His eyes, chips of obsidian, flickered towards the west, unseen beyond the damp canvas. "Vienna is wood. Beyond Vienna... softer lands."

  The flap snapped open. The messenger, grey with exhaustion and Danube muck, prostrated himself, gasping. He didn't need to speak. The black silk sash knotted around his upper arm screamed the news: Death in Karakorum. The Great Khan Ogedei, gone.

  Silence, thicker than the mud, swallowed the *ger*. Batu’s finger froze on the map. Subutai’s whetstone stilled. The messenger’s ragged breaths were the only sound.

  Batu slowly straightened. His face, usually unreadable as weathered leather, tightened. Not grief, but calculation. "The *kurultai*," he breathed. The gathering. Succession. Power.

  Subutai stood, the dagger suddenly still in his hand. He walked to the entrance, pushing the flap aside. The camp sprawled before him – thousands of warriors, horses churning the earth into deeper soup, supply carts listing under their burdens, the distant smoke rising from a captured, yet still defiant, stone keep. The air smelled of wet wool, dung, and the faint, persistent tang of decay from the winter's battles.

  For a single, suspended heartbeat, Subutai’s gaze didn't sweep the camp, nor did it look east towards Karakorum. It fixed on the western horizon, hidden by low, grey clouds. *West*. Past the muddy fields, past the stubborn stone nests, past the flooded rivers. To lands unseen, ripe for the taking. The sheer, unbroken momentum of the Horde unleashed, unstoppable. The image flashed in his mind’s eye: bridges of pontoons flung across the great rivers beyond, cities crumbling like sandcastles before a wave. *What if...*

  Then his eyes refocused. He saw the gaunt flanks of the remounts, the strained faces of the men mending cracked leather harnesses, the sheer, exhausting *effort* required to move this vast machine through the waterlogged land. He saw not just the immediate camp, but the strained lines stretching back east, the whispers of resistance flaring in their wake, the hungry mouths needing constant feeding. The stone keeps weren't falling; they were bleeding them slowly.

  He turned back into the *ger*. Batu was already barking orders to aides who appeared like ghosts at the entrance. "Prepare the riders. East. All speed."

  Subutai met Batu’s gaze. The question hung unspoken in the damp air: *Could we have pressed on? Ignored the call?*

  Batu’s answer was a curt nod, final. "The *kurultai* waits. The *Yassa* demands it." The Law demanded their presence. The necessity of securing the Khanate's heart was undeniable.

  Subutai sheathed his dagger. The sharp *snick* echoed. He didn't argue. He simply looked at the map Batu had abandoned, at the messy smear of mud where the finger had rested near Vienna. Then he turned, his face a mask of ancient stone, and strode out to begin the immense task of turning the greatest army the world had seen back towards the endless steppes. The messenger, forgotten on the floor, shivered in the sudden draft. The mud outside seemed to sigh as thousands of boots shifted direction. Was it relief? Or resignation?
