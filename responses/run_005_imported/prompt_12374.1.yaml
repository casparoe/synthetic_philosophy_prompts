prompt: |-
  I'm reading Thomas Reid's Inquiry into the Human Mind (1764) for a seminar on testimony and I'm stuck on how this bit is actually supposed to work as an argument against Hume. It's oddly buried in the middle of his chapter on vision (section 24, "Of the analogy between perception and the credit we give to human testimony"):

  "But here a difficulty occurs which merits our attention, because the solution of it leads to some original principles of the human mind, which are of great importance, and of very extensive influence. We know by experience, that men have used such words to express such things. But all experience is of the past, and can, of itself, give no notion or belief of what is future. How come we then to believe, and to rely upon it with assurance, that men who have it in their power to do otherwise, will continue to use the same words when they think the same things? Whence comes this knowledge and belief, this foresight we ought rather to call it, of the future and voluntary actions of our fellow-creatures? Have they promised that they will never impose upon us by equivocation or falsehood? No, they have not. And, if they had, this would not solve the difficulty: for such promise must be expressed by words, or by other signs; and, before we can rely upon it, we must be assured, that they put the usual meaning upon the signs which express that promise. No man of common sense ever thought of taking a man's own word for his honesty; and it is evident that we take his veracity for granted, when we lay any stress upon his word or promise. I might add, that this reliance upon the declarations and testimony of men, is found in children long before they know what a promise is.

  There is, therefore, in the human mind an early anticipation, neither derived from experience, nor from reason, nor from any compact or promise, that our fellow-creatures will use the same signs in language, when they have the same sentiments. This is, in reality, a kind of prescience of human actions; and it seems to me to be an original principle of the human constitution, without which we should be incapable of language, and consequently incapable of instruction.

  The wise and beneficent Author of nature, who intended that we should be social creatures, and that we should receive the greatest and most important part of our knowledge by the information of others, hath, for these purposes implanted in our natures two principles that tally with each other. The first of these principles is, a propensity to speak truth, and to use the signs of language, so as to convey our real sentiments. This principle has a powerful operation, even in the greatest liars; for, where they lie once, they speak truth a hundred times. Truth is always uppermost, and is the natural issue of the mind. It requires no art or training, no inducement or temptation, but only that we yield to a natural impulse. Lying, on the contrary, is doing violence to our nature; and is never practised, even by the worst men, without some temptation. Speaking truth is like using our natural food, which we would do from appetite, although it answered no end; but lying is like taking physic, which is nauseous to the taste, and which no man takes but for some end which he cannot otherwise attain.

  [...] Another original principle implanted in us by the Supreme Being, is a disposition to confide in the veracity of others, and to believe what they tell us. This is the counter part to the former; and as that may be called the principle of veracity, we shall, for want of a more proper name, call this the principle of credulity. It is unlimited in children, until they meet with instances of deceit and falsehood: and it retains a very considerable degree of strength through life."

  So the move seems to be: our confidence that people will keep using words the way they used to can't come from experience (experience is only ever of the past), or from reason, or from a promise -- so it must be some further "original principle" of the mind. Then he basically runs the same move again to get the principles of veracity and credulity. What I don't get is how any of this is actually different from what Hume says about induction generally -- Hume already thinks our expectation that the future will resemble the past isn't grounded in reason, and is just custom/habit. So when Reid says our reliance on testimony rests on an "original principle" rather than on experience, is he doing anything more than re-describing Hume's own psychology in nicer language? Or does this move actually get the anti-reductionist something a Humean reductionist about testimony can't also just help themselves to? Feels like i'm missing the actual bite of the argument here.
reasoning: |-
  Okay, the user is grappling with Thomas Reid's argument against Hume on testimony in his Inquiry. They're specifically puzzled about how Reid's appeal to "original principles" differs from Hume's custom/habit explanation for induction. 

  Hmm, I see why this feels slippery. Both philosophers agree experience alone can't justify our expectations about the future. But the user's insight is sharp - if Hume already attributes induction to psychological habit, isn't Reid just renaming the same thing? 

  Wait, no. The key is Reid's target: he's not just talking about expecting sunrise tomorrow, but about trusting other minds. For Hume, testimony is just another inductive inference - we observe correlation between words and facts. But Reid pounces on how weird that is. How can a child infer meaning from past correlations before even understanding language? 

  Ah! That's the pivot. Reid forces a dilemma: either testimony is reducible to induction (Hume's view), or it's primitive. His "principle of credulity" isn't just habit but pre-linguistic trust. When he says experience can't explain a child's first understanding of words, he's arguing testimony can't be bootstrapped from induction because induction already requires testimony to learn language. 

  The user's buried question might be: "Is Reid cheating by calling this 'original'?" But Reid's point is deeper - he thinks Hume's psychology can't explain the very possibility of language acquisition. That's why he emphasizes children's trust precedes promises or experience with deceit. 

  Also noting the theological framing ("beneficent Author") isn't accidental. Where Hume sees custom as a brute fact, Reid sees design - veracity and credulity as paired instincts for social survival. That teleology matters for why he thinks this isn't just rebranded Humeanism. 

  The user's seminar is on testimony, so they likely need to contrast reductionist (Hume) vs anti-reductionist (Reid) accounts. The bite is in Reid's regress argument: if all testimony requires prior inductive verification, we could never start learning. Hence credulity as starting point, not conclusion.
answer: |-
  You've pinpointed the core tension brilliantly. Reid's argument *feels* like it should be a powerful counter to Hume on testimony, yet it seems suspiciously similar to Hume's own account of induction. The bite lies in a crucial distinction Reid draws between the *scope* and *origin* of our reliance, targeting a specific weakness in a *reductionist* account of testimony. Here's the breakdown:

  1.  **Hume's Reductionism on Testimony:** For Hume, our belief in testimony is *reducible* to a complex form of induction and causal reasoning.
      *   We observe a constant conjunction between certain sounds/words (testimony) and corresponding facts/events in the world.
      *   We observe that humans generally have an interest in telling the truth (due to societal pressures, self-interest, etc.).
      *   Therefore, when we hear testimony, we infer the truth of what is reported based on these past regularities and our understanding of human nature (just like we infer the sun will rise tomorrow based on past sunrises). It's custom/habit operating on observed correlations.

  2.  **Reid's Target: The Bootstrapping Problem:** Reid zeroes in on the very *first step* of language acquisition and understanding. How does a child *initially* learn that sounds (words) signify things?
      *   **Experience is Only Past:** Hume is right – experience only tells us how words *have been* used. But the child needs to believe that the *next time* their mother says "milk," it will signify the same thing it signified the last time, *even though the child has no prior experience linking that sound to that thing* to build an induction upon. How does the child form the *first* association?
      *   **No Prior Correlation:** Before language is learned, there *is no* observed constant conjunction between the sound "milk" and the substance milk for the child to base an inductive inference on. The sound is initially meaningless noise.
      *   **No Reason or Promise:** As Reid argues, the child doesn't reason ("Mother has used 'milk' reliably before, therefore she will continue"), nor does it understand promises or societal contracts.
      *   **The Regress:** If understanding the *first* word requires prior experience of its reliable use, but you can't *have* that experience without already understanding the word, you get a vicious regress. How does the initial link get established?

  3.  **Reid's Anti-Reductionist Move & the "Bite":**
      *   **Original Principle of Credulity:** Reid argues that the *very possibility* of learning language requires a *pre-linguistic*, innate disposition: the Principle of Credulity. This is an "original principle" – a fundamental, non-inferential tendency to *believe what others tell us* and to *assume they use signs consistently*.
      *   **Not Just Habit/Induction:** This principle is **prior to and foundational for** the kind of inductive habits Hume describes. It's what allows induction *about language and testimony* to get off the ground *at all*. It's not the *result* of observing correlations; it's the *precondition* for observing those correlations meaningfully.
      *   **Analogy with Perception:** Reid draws the analogy to perception for a reason. Just as our senses give us immediate, non-inferential beliefs about the external world (another "original principle"), our social nature gives us immediate, non-inferential beliefs in the veracity and consistency of others' communication. We don't *infer* the world from sensations; we directly perceive it. Similarly, we don't (initially) *infer* meaning from sounds; we directly apprehend it through credulity.
      *   **The Paired Principles:** The Principle of Veracity (natural propensity to speak truth) and Principle of Credulity are divinely implanted to make society and knowledge transfer possible. They "tally" with each other. Veracity makes testimony generally reliable; Credulity allows us to receive it without needing prior inductive proof for every utterance or speaker. Credulity is the *default setting*.

  4.  **Why it's Different from Hume's Induction & the Anti-Reductionist Gain:**
      *   **Targeting Reductionism:** Hume reduces testimony justification *entirely* to induction about past correlations and human nature. Reid argues this reduction is impossible because induction *about testimony* presupposes the very linguistic understanding that the reduction is trying to explain. Credulity breaks the regress.
      *   **Primacy of the Social:** Reid posits a *sui generis* source of justification for testimony – the innate social principle of credulity. It's not *derived* from other forms of reasoning (induction, deduction); it's foundational. For the anti-reductionist, testimony is a *basic source* of justification, like perception or memory, not reducible to others.
      *   **The Scope of "Original Principle":** While Hume's custom explains why we expect the sun to rise *after* we've seen it rise many times, Reid's credulity explains why a child expects the *first* time they hear "milk" in a context to signify milk *again*, even before they have the concept of "again" in that context. It's about the initial acquisition and the fundamental *trust* underlying *all* communication, not just the ongoing expectation based on past regularity.
      *   **Epistemological Status:** For Hume, custom is a brute psychological fact with no rational justification. For Reid, the principles of veracity and credulity are part of our God-given constitution, designed for truth and social cohesion, giving them a normative weight beyond mere habit. They are reliable faculties.

  **In essence, Reid's bite against Hume is this:** Hume's reductionist account of testimony as mere induction *cannot explain how we learn our first words or understand our first utterances*. The regress of needing prior verification for every sign before understanding is possible is fatal to pure reductionism. Reid's "original principle of credulity" provides the necessary foundation – an innate, non-inferential disposition to trust others' communicative intent and linguistic consistency – that makes language acquisition and testimony possible in the first place. This principle is *logically prior* to the inductive habits that Hume describes and upon which Hume wants to base testimony. Therefore, testimony cannot be *reduced* to induction; it rests on its own original principle, making Reid a staunch anti-reductionist. You were right to sense the similarity in the appeal to psychology, but Reid uses it to carve out a distinct, foundational *source* of justification specifically for the social act of communication.
