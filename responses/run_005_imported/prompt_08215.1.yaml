answer: |-
  You've hit on a core ethical and practical tension in economics, especially regarding long-term issues like climate change. Frank Ramsey's critique is powerful and remains highly influential, but economists use positive discount rates for several interconnected reasons, often balancing ethics against practical realities and different interpretations of welfare:

  1.  **Ramsey's Argument (Summarized & Strengthened):**
      *   **Pure Time Preference is Unethical:** Ramsey argued that discounting the well-being (utility) of future people *simply because they live in the future* is "ethically indefensible" and arises from "a weakness of the imagination." It implies we value the life of someone born in 2124 less than someone born today, purely based on birth date, which violates principles of intergenerational equity.
      *   **Distinguishing Factors:** He explicitly distinguished this "pure time discount" (δ) from two *potentially* justifiable reasons for discounting *future consumption*:
          *   **Diminishing Marginal Utility of Consumption (η):** If we expect future generations to be richer (economic growth), an extra dollar (or unit of consumption) provides *less utility* to them than it would to poorer people today. Discounting future *consumption* at a rate of `η * g` (where `g` is the growth rate of per capita consumption) accounts for this.
          *   **Risk of Extinction/Catastrophe (ρ):** There's a chance humanity won't exist in the future (e.g., asteroid, nuclear war, pandemic). We discount future utility because there's a probability it won't be experienced. Ramsey himself saw this as the *only* potentially justifiable reason for pure discounting (δ > 0).

  2.  **Why Economists Still Use Positive Discount Rates (δ > 0):**

      *   **Descriptive vs. Prescriptive Approach:**
          *   **Nordhaus (Descriptive):** Represents the mainstream approach. He argues economics should describe how people *actually* behave and make decisions in markets. Observed market interest rates (returns on investment) reveal that individuals *do* exhibit a strong preference for present consumption over future consumption. This "revealed preference" suggests a high pure time preference rate (δ). Ignoring this would make models unrealistic descriptions of current behavior and policy trade-offs. The opportunity cost of spending $1 on climate mitigation today is the high return (~5-7%) that $1 could earn if invested elsewhere.
          *   **Stern (Prescriptive):** Takes Ramsey's ethical stance. He argues cost-benefit analysis (CBA) for global, intergenerational issues like climate change *should* be prescriptive, based on ethical principles, not descriptive of potentially myopic or selfish current behavior. Stern sets δ very close to zero (effectively 0.1%, primarily reflecting extinction risk), leading to much higher estimates of the present value of future climate damages and thus justifying stronger immediate action. He focuses heavily on the η*g component.

      *   **Empirical Reality of Time Preference:** Individuals demonstrably discount their *own* future consumption highly (e.g., preferring $100 today over $110 next year). While Ramsey argues this shouldn't dictate *societal* ethics toward *different* people, incorporating this observed impatience is seen by many as necessary for:
          *   **Political Feasibility:** Policies requiring significant sacrifice today for distant benefits are harder to enact if they blatantly contradict voters' revealed time preferences.
          *   **Consistency with Private Investment:** Using a very low discount rate in public CBA while market rates are high creates distortions (e.g., justifying projects with far lower returns than available privately).

      *   **Uncertainty and Risk (Beyond Extinction):** While Ramsey focused on extinction, modern arguments for δ > 0 often emphasize broader, irreducible uncertainties:
          *   **Technological Change:** Future technologies might solve climate problems more cheaply, making some current expensive mitigation less valuable.
          *   **Future Preferences/Tastes:** Will future generations even value the things we are preserving/sacrificing for them in the same way?
          *   **Catastrophic Tipping Points:** While a risk, the *timing* and *probability* are highly uncertain, sometimes modeled as an additional reason for discounting.
          *   **Modeling Pragmatism:** Assigning probabilities to these vast uncertainties is incredibly difficult. A small positive δ can be a crude, practical way to account for this general "futility risk" or "surprise factor."

      *   **Opportunity Cost & Dynamic Efficiency:** This is the most potent *economic* counter-argument to setting r = 0. Resources are scarce. Money spent on climate mitigation today cannot be invested in other productive capital (physical, human, technological) that generates returns. If the real return on capital (reflected in market interest rates) is positive (say 4%), then $1 invested today grows to `$1 * (1.04)^T` in T years. To justify spending that $1 on climate mitigation today, the *future benefits* of that mitigation must be *at least* as large as `$1 * (1.04)^T`. Discounting future benefits at the opportunity cost rate (r ≈ 4%) ensures that only projects whose future benefits outweigh the forgone investment returns are approved. Setting r=0 would justify spending vast sums today on projects with extremely long-term payoffs, potentially starving more immediately productive investments needed for growth and poverty reduction.

  3.  **Nordhaus vs. Stern - The Discount Rate Core:**

      *   **Nordhaus:** Uses a descriptive approach. His DICE model traditionally used a discount rate starting around 4-5% (combining a positive δ ≈ 1-2% with η*g ≈ 2-3%). This heavily discounts future damages, leading to recommendations for slower, gradual emissions reductions.
      *   **Stern:** Uses a prescriptive, Ramsey-based approach. Sets δ ≈ 0 (0.1% for extinction risk), η ≈ 1, and assumes modest g. This results in a very low discount rate (Stern Report used ~1.4%). Future damages are discounted very little, leading to the conclusion that immediate, aggressive mitigation is economically optimal.

  **Is it repeating Ramsey's mistake?**

  *   **From a strict Ramsey/Stern ethical perspective: YES.** Using a positive δ purely based on impatience *is* the "ethically indefensible" practice Ramsey condemned. Economists like Nordhaus prioritize descriptive realism and opportunity cost, effectively accepting that society *does* discount the future ethically indefensibly, and models should reflect that reality for practical policy guidance.
  *   **From a descriptive/opportunity cost perspective: NO.** They argue Ramsey's critique confuses ethical ideals with practical economic realities. The discount rate isn't just about intergenerational ethics; it's a crucial tool for efficient resource allocation *over time* in a world with capital markets and investment returns. Ignoring opportunity cost leads to inefficient outcomes that could harm both current and future welfare.

  **Conclusion:** Ramsey's ethical argument against pure time preference is logically compelling and remains a cornerstone of the debate. However, mainstream economists (like Nordhaus) defend positive discount rates based on:
  1.  **Descriptive realism** (reflecting actual behavior and market rates).
  2.  **Opportunity cost** (the critical role of capital productivity and forgone investment returns).
  3.  **Practical handling of deep uncertainty** (beyond just extinction risk).
  4.  **Concerns about feasibility and efficiency.**

  The choice of discount rate fundamentally reflects a value judgment: **Should CBA describe how societies *currently* make intertemporal trade-offs (Nordhaus), or prescribe how they *ethically should* make them, especially concerning future generations (Stern)?** The debate continues because there's no purely objective way to resolve this tension between ethics and observed economic reality. Ramsey identified a profound ethical issue, but applying it rigorously in complex real-world models involving scarcity, investment, and uncertainty leads economists to incorporate elements he explicitly rejected.
