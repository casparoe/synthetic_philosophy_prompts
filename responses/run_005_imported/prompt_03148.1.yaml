answer: |-
  You've pinpointed the most critical tension in Tolstoy's *What is Art?* – and it's a deliberate, though potentially problematic, cornerstone of his argument. Here's how the two chapters fit together (or don't) according to Tolstoy's framework:

  1.  **Chapter 15: Defining "Art" and its "Excellence *as Art*"**
      *   **Goal:** To establish the *essential nature* of art and a criterion to distinguish *real art* from *non-art* or "counterfeit art."
      *   **The Test:** "Infection" – the transmission of feeling from artist to perceiver. If genuine feeling is transmitted and received, it *is* art.
      *   **The "Sole Measure" Claim:** *Within the category of "art"* (i.e., works that successfully infect), the *degree* of infectiousness is the measure of its **excellence *as art***. A more infectious work is *better at being art* than a less infectious one. He explicitly brackets the *quality* of the feeling: "speaking now apart from its subject-matter... not considering the quality of the feelings it transmits."
      *   **Analogy:** Think of this like judging a car *as a machine*. The "excellence" is its efficiency, horsepower, handling – how well it performs the function of being a car, *regardless* of whether it's used to deliver medicine or commit a robbery.

  2.  **Chapter 16: Judging the "Goodness" or "Badness" of Art**
      *   **Goal:** To establish a *moral criterion* for evaluating art *once it has passed the "is it art?" test*. Art is powerful, so *what* it transmits matters immensely.
      *   **The Criterion:** The feeling transmitted must be aligned with the highest "religious perception" of the age – which Tolstoy defines as the consciousness of universal human brotherhood and love. Feelings flowing from this perception (e.g., compassion, self-sacrifice, simple joy in life) are "good." Feelings contradicting it (e.g., exclusive patriotism, class pride, sensual lust, despair) are "bad."
      *   **The Judgment:** Art transmitting "good" feelings is "good art." Art transmitting "bad" feelings is "bad art" *even if it is highly infectious*. Patriotic anthems and erotic art might be *excellent art* (highly infectious) *as art*, but they are morally *bad art* because they transmit feelings harmful to human unity.
      *   **Analogy:** Now we're judging the *purpose* or *consequence* of the car. A high-performance sports car (excellent *as a machine*) used for smuggling drugs is "bad" because of its harmful use.

  **Resolving the Apparent Contradiction:**

  Tolstoy isn't *contradicting* himself outright; he's applying **two distinct evaluative layers** to the same work:

  1.  **Layer 1: Is it Art? How Good is it *as Art*?** (Ch. 15)
      *   Criterion: Degree of Infectiousness (Transmission of Feeling).
      *   Result: Classifies works as Art/Non-Art and ranks Art by its *artistic potency*.
  2.  **Layer 2: Is it *Good* Art?** (Ch. 16)
      *   Criterion: Moral Quality of the Transmitted Feeling (Based on Religious Perception).
      *   Result: Judges the *moral value* of the art, independent of (but building upon) its classification and artistic potency.

  **Why it Feels Contradictory & Where the Tension Lies:**

  1.  **Semantic Shift:** Tolstoy uses "excellence" and "goodness" in subtly different ways across the chapters without always explicitly flagging it.
      *   Ch. 15: "Excellence" = **Artistic Effectiveness** (how well it infects).
      *   Ch. 16: "Good/Bad" = **Moral Value** (the worthiness of the feeling transmitted).
  2.  **Tolstoy's Ultimate Priority:** While he technically separates the layers, his *overall project* is to condemn most of the art of his time (especially upper-class art). For Tolstoy, **morally "bad" art is ultimately worthless, even dangerous, regardless of its infectiousness.** His heart is in Chapter 16. He reluctantly admits highly infectious "bad" art *exists* and is *artistically effective*, but he vehemently argues it should be rejected and has no positive value for humanity. He might even imply that truly "universal" feelings (good ones) have a *greater potential* for infectiousness, but he acknowledges that infectious "bad" art exists.
  3.  **The Problem of "Bad" Infectious Art:** Your patriotic anthem example is perfect. Tolstoy *must* admit it's infectious (so it's "excellent" art by Ch. 15 standards). But he *passionately* argues it's "bad" art in Ch. 16. He doesn't deny its artistic effectiveness; he condemns its moral content and social effect. This is where readers often feel he's moving the goalposts or privileging his moral view over his own definition.

  **Key Takeaways for Your Paper:**

  *   **Acknowledge the Two Layers:** Explain how Ch. 15 defines art and its *artistic merit* (infectiousness), while Ch. 16 imposes a *moral judgment* on the content of that art.
  *   **Tolstoy's Moral Mission:** Emphasize that Tolstoy's primary concern is the *moral and social function* of art. The infection theory defines the mechanism, but the religious perception defines the *proper purpose* of that mechanism.
  *   **The Tension is Real:** Don't shy away from pointing out that this creates a tension. While logically distinct layers, the labeling of highly infectious art as "bad" *feels* like a demotion that contradicts the "sole measure" claim of Ch. 15, especially since "goodness" becomes Tolstoy's ultimate criterion for art's value.
  *   **Possible Resolution within Tolstoy's Framework?** You could argue that for Tolstoy, *true* artistic excellence might *implicitly* require the transmission of *good* feelings, as only those feelings align with the universal human connection necessary for the *deepest* infection. However, his own examples (like acknowledging infectious patriotic art) work against this, and his explicit bracketing in Ch. 15 suggests he knows infectious "bad" art exists.

  **In essence:** Ch. 15 answers "Is it effective art?" Ch. 16 answers "Is it *good* art?" The "sole measure" applies only to the first question. The contradiction arises because Tolstoy uses the word "art" positively only for works that pass *both* tests in his mind, while his framework technically allows for "excellent but bad art." His moral fervor often overshadows this technical distinction.
