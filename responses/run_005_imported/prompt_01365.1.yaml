answer: |-
  You've hit upon one of the most sophisticated and debated tensions in Nyaya epistemology – a tension that reveals their profound commitment to **direct realism** and **empiricism**. Your engineer's instinct to see a "spec conflict" is spot-on. Here's how classical Naiyayikas (like Vatsyayana, Uddyotakara, and Udayana) reconcile the clauses, and what's philosophically at stake:

  ### The Core Reconciliation: A Two-Stage Process
  Naiyayikas resolve the tension by proposing perception occurs in **two distinct, causally linked stages**:

  1.  **Nirvikalpaka Pratyakṣa (Indeterminate Perception):**
      *   **Meets `avyapadesya` (non-verbal):** This is the *initial* sensory registration. A sense organ (indriya) contacts an object (artha), producing a raw, non-conceptual, non-verbal cognition.
      *   **Content:** Pure particularity (`svalakṣaṇa`). You register "this-ness" – a unique, undifferentiated blob of color, shape, texture, sound, etc. You don't cognize it *as* a jar, *as* blue, *as* hard. It's pure sensation without subject-predicate structure or classification. It's `avyapadeśya` because no words or concepts are involved *at this stage*.
      *   **Function:** Provides the direct, unmediated contact with the external object – the bedrock of Nyaya realism. It establishes *that* something is present.

  2.  **Savikalpaka Pratyakṣa (Determinate Perception):**
      *   **Meets `vyavasāyātmaka` (determinate judgment):** This *follows* the initial nirvikalpaka stage. Memory (`smṛti`) of relevant universals (`sāmānya/jāti`) and names (`nāma`) associated with past experiences of similar objects is activated by the initial sensation.
      *   **Process:** The mind (`manas`) synthesizes the raw sensory data (from nirvikalpaka) with recalled universals and names.
      *   **Content:** A determinate judgment *about* the object: "This is a jar," "The jar is blue," "This is hard." This involves identification, classification, and subject-predicate structure (`viśeṣya-viśeṣaṇa-bhāva`).
      *   **Why it's still `pratyakṣa` (perception):** Crucially, Naiyayikas argue this synthesis is *causally dependent* on the *current* sense-object contact. The recalled universals/names aren't generating the cognition *de novo*; they are *applied to* the *immediately given* sensory particular. The *object* of the cognition is still the external thing present *now*, known *through* its specific characteristics. It's not memory or inference alone.

  ### How the Definition Encompasses Both
  *   **"Arises from sense-object contact" (`indriyārthasannikarṣotpannam`):** This causal origin covers *both* stages. Nirvikalpaka is the *direct* product. Savikalpaka is the *mediated but still direct* product because its *content* is determined by the present object via the senses, even if memory plays a role in its *formulation*.
  *   **"Avyapadeśya" (non-verbal):** Primarily qualifies the *initial genesis* (`utpatti`) and the *content* of nirvikalpaka. Savikalpaka *involves* words/concepts, but its *validity* (`pramāṇatā`) still fundamentally rests on the non-verbal, sensory origin. The object is *given* non-verbally first.
  *   **"Vyavasāyātmaka" (determinate):** Primarily characterizes the *mature form* (`rūpa`) of perceptual cognition – savikalpaka – which is the epistemically significant output we use.
  *   **"Avyabhicāri" (unerring):** Applies to *both* when functioning correctly. Nirvikalpaka cannot err by definition (it's just raw givenness). Savikalpaka can err *only* if there's a defect (`doṣa`) in the sense organ, the object, the conditions, or the synthesis process (misapplying a universal). Properly functioning savikalpaka is reliable *because* it's anchored in the direct contact captured in nirvikalpaka.

  ### What's Philosophically at Stake: Why Nyaya Insists on This Structure
  1.  **Defense of Direct Realism:** Nyaya fiercely opposes Buddhist idealism/phenomenalism (Yogācāra) and representationalism (Sautrāntika). Nirvikalpaka guarantees direct, unmediated contact with external particulars (`svalakṣaṇa`). Savikalpaka ensures we genuinely *know* those external objects *as* the kinds of things they are (jars, blue things), not just have private sensations.
  2.  **Empirical Foundation for Knowledge:** All other `pramāṇas` (inference, testimony, comparison) ultimately depend on perception. Nirvikalpaka provides the pure sensory input. Savikalpaka provides the basic perceptual judgments (`this is fire`, `this smoke is from that fire`) that become the bedrock premises for inference and the referents for words learned via testimony.
  3.  **Accounting for Error & Illusion:** The two-stage model explains illusions. In `snake-rope` illusion, the nirvikalpaka stage registers *some* sensory data (coiled, brown, rope-like). The error occurs in the savikalpaka stage: the mind *misapplies* the universal "snakeness" due to defects (dim light, fear, similarity). The *contact* was real (with the rope), the *synthesis* was faulty.
  4.  **Explaining Concept Acquisition:** How do we *learn* universals and names in the first place? Through repeated nirvikalpaka contacts with similar particulars, leading to recognition (`pratyabhijñā`), which is a form of savikalpaka. The first time you see a cow, it might be pure nirvikalpaka ("this-ness"). After seeing several, savikalpaka ("this is a cow-like thing") emerges.
  5.  **Distinguishing Perception from Inference/Verbal Testimony:** `Avyapadeśya` helps demarcate perception from inference (which relies on recalling a universal/pervasion) and verbal testimony (which relies directly on words). The *core* of perception is non-verbal sensory givenness, even if concepts get layered on top immediately.

  ### The Engineer's Analogy (Oversimplified but Helpful)
  Think of a high-resolution sensor (sense organ) feeding raw data (voltage, pixel values) into a system.
  1.  **Nirvikalpaka:** The raw sensor data stream (`avyapadeśya` - no labels).
  2.  **Savikalpaka:** The real-time object recognition software:
      *   It accesses a stored database (memory of universals/names).
      *   It *matches patterns* in the *current* raw data stream to entries in the database.
      *   It outputs a labeled result: "Object ID: Jar, Color: Blue" (`vyavasāyātmaka`).
      *   **Crucially:** The output is `avyabhicāri` (reliable) only if the sensor is good, the data is clean, and the pattern-matching is correct. Its validity *as perception* stems from the fact it's processing *live sensor data*, not just recalling the database. It's `pratyakṣa` because it's driven by the immediate sensor input, even if the labeling uses stored info. If it outputs "snake" when the sensor sees a rope, it's faulty pattern-matching (`doṣa`), not a failure of the sensor itself.

  ### Why Not Just Define Perception as Savikalpaka?
  Nyaya argues this would:
  *   Sever the essential link to the *immediate* object, opening the door to idealism or skepticism (how do you know the concept matches reality?).
  *   Fail to account for infant cognition or the cognition of novel objects before concepts are formed.
  *   Blur the line with inference (which also outputs determinate judgments).

  ### Why Not Just Define Perception as Nirvikalpaka?
  This would:
  *   Make perception cognitively useless – raw sensation without identification or judgment can't ground knowledge claims like "Fire burns" or "This is water."
  *   Fail to explain how we actually navigate the world using perceptual knowledge.
  *   Ignore the undeniable phenomenological fact that our mature perceptual experience *is* determinate.

  ### Conclusion
  The tension you identified is intentional and productive. Nyaya's two-stage model of perception is a sophisticated attempt to balance **epistemic directness** (contact with reality via nirvikalpaka) with **epistemic utility** (actionable knowledge via savikalpaka). It defends a robust empirical realism against rival schools while providing a nuanced account of how sensation becomes meaningful cognition. The commentators spend immense effort refining this model precisely because the coherence of the entire Nyaya epistemological and metaphysical system rests upon it. Your "spec reading" uncovered the central joint in their architecture!
