answer: |-
  **MEMORANDUM**  
  **TO:** Technical Committee, County Search & Rescue  
  **FROM:** [Your Name], Technical Committee  
  **DATE:** [Current Date]  
  **SUBJECT:** Urgent Recommendation for Eagle Ridge Search & Policy on Conditional Tips  

  ### **1. BACKGROUND**  
  - **Current Situation:** Missing skier on Eagle Ridge. Search area divided into:  
    - **South (50%)**  
    - **North (50%)**, split into:  
      - Upper Ridge (25%)  
      - Lower Bowl (25%)  
  - **New Tip (from ski partner):** *"If she stayed north of the saddle, she’s 5–6× more likely in Lower Bowl than Upper Ridge."*  
    - This tip **only discusses North** and says nothing about South.  
  - **Dave’s Analysis:** His model updated North’s overall probability to ~43–44%, increasing South to ~56–57%. He recommends moving a team from North-Upper to South tonight.  
  - **Issue:** We disagree on whether South’s probability should increase. This is our third similar debate.  

  ---

  ### **2. ANALYSIS: WHY SOUTH’S PROBABILITY SHOULD NOT CHANGE**  
  The tip is **conditional**—it only tells us how to split North *if she’s in North*. It does **not** provide new evidence about whether she’s in North vs. South. Here’s the math-free intuition:  

  #### **A. The "Pie" Analogy**  
  - Imagine the search area as a pie. South gets 50% (half the pie). North gets the other 50% (the other half).  
  - The tip says: *"If she’s in the North half, she’s 5–6× more likely in the Lower Bowl slice than the Upper Ridge slice."*  
  - This reshapes **only the North half** of the pie:  
    - Lower Bowl grows (now ~41.7% of the *North* half).  
    - Upper Ridge shrinks (now ~8.3% of the *North* half).  
  - **South’s half is untouched.** The tip says nothing about it.  

  #### **B. Why Dave’s Model Adjusts South (and Why It’s Misleading)**  
  Dave’s model aims to find the "closest" probability distribution that fits the new tip. However:  
  - It treats the tip as a constraint that forces *all* probabilities to shift, even unrelated ones.  
  - **The flaw:** This artificially redistributes probability to South because the model "borrows" from North to satisfy the new odds *within* North.  
  - **Analogy:** If you reshaped one half of the pie, you wouldn’t steal crumbs from the other half to make it fit. The two halves are independent based on current evidence.  

  **Conclusion:** The tip only updates how we split North. It should not affect South’s 50% share.  

  ---

  ### **3. RECOMMENDATION FOR TONIGHT’S SEARCH**  
  - **Do NOT move teams from North to South.**  
    - North’s overall probability remains 50% (unchanged).  
    - Within North, reweight efforts:  
      - **Lower Bowl:** Now ~41.7% of **total** probability (high priority).  
      - **Upper Ridge:** Now ~8.3% of **total** probability (lower priority).  
  - **Action:** Pull a team from **North-Upper** and send it to **North-Lower**—not to South. South’s probability is still 50%, but North-Lower is now our single highest-probability sector.  

  ---

  ### **4. STANDING POLICY FOR CONDITIONAL TIPS**  
  To avoid future debates, adopt this rule:  
  > **"Conditional tips only update probabilities *within* the relevant sector. They do not change the overall probability of that sector versus others, unless new evidence directly supports it."**  

  #### **How to Apply This:**  
  1. **Isolate the sector** referenced in the tip (e.g., "North" in this case).  
  2. **Update sub-sectors** within it (e.g., Lower Bowl vs. Upper Ridge) using the new odds.  
  3. **Leave all other sectors unchanged** (e.g., South).  
  4. **Exception:** Only adjust overall sector probabilities if the tip provides *direct* evidence about them (e.g., "She’s 80% likely to be in South overall").  

  #### **Why This Works:**  
  - Prevents "manufactured" probability shifts.  
  - Mathematically sound: Conditional odds don’t alter unrelated probabilities.  
  - Aligns with operational intuition: Tips about one area shouldn’t magically affect others.  

  ---

  ### **5. ACKNOWLEDGING DAVE’S METHOD**  
  Dave’s model isn’t "wrong" in a vacuum—it’s mathematically rigorous for minimizing distribution changes. However, it’s **misapplied here** because:  
  - It overcorrects by assuming the tip implies broader relevance.  
  - **Why your gut reaction is right:** Humans intuitively grasp that unrelated sectors shouldn’t be affected. The model doesn’t "know" this—it blindly obeys constraints.  
  - **Going forward:** We’ll use Dave’s model only for tips that directly impact overall sector odds (e.g., "She’s 3× more likely in South than North"). For conditional tips (like this one), use the policy above.  

  ---

  ### **6. URGENT NEXT STEPS**  
  1. **Tonight:** Reallocate teams within North per Section 3.  
  2. **Tomorrow:** Formalize the conditional-tip policy (Section 4) into our SOPs.  
  3. **Debrief:** Review this memo at tomorrow’s committee meeting to confirm consensus.  

  **Time is critical—we need clarity before dawn.** Let’s prioritize the skier, then lock in a policy to end this cycle.  

  // Signed //  
  [Your Name]  
  **CC:** Dave, Search Manager, Committee Chair
