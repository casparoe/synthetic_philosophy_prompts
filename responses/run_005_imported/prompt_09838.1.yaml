  Wait, that's where the confusion lies. If the only new information is about the distribution within North, then the ratio between North and South should remain the same, but the internal distribution of North changes. So initially, North was 50%, with Upper and Lower each 25%. After the tip, the probability of Lower given North is 5/6, so Lower becomes (5/6)*50% ≈ 41.67%, and Upper becomes (1/6)*50% ≈ 8.33%. South remains 50%. But Dave's model reduced North to 43-44%, meaning South increased to 56-57%. Why?

  The issue might be in how Dave's model incorporates the new information. The user says Dave's model finds the closest distribution to the current one that satisfies the new odds. If the current distribution is North 50%, and the new conditional is P(Lower|North)=5/6, then the closest distribution might adjust more than just the internals. But why would it change the North-South split? Unless the model is minimizing some kind of distance metric, which could cause spillover effects. 

  In Bayesian terms, the tip only provides information about the likelihood within North, so the prior between North and South shouldn't change. The posterior should be P(North) still 50%, but P(Lower|North) higher. So South should remain 50%. But Dave's model is giving a different result. Why?

  Perhaps Dave's model is interpreting the tip as affecting the overall probabilities. Or maybe the model uses a principle like maximum entropy or Kullback-Leibler divergence to minimize relative entropy. The user mentioned "probability distribution closest to our current one," which suggests it's an optimization approach. If the current distribution has North at 50%, and the new constraint is that within North, Lower is 5/6, then the minimal change might adjust the North-South boundary slightly to better fit the new info, even if it's not directly related. But that seems counterintuitive and might not be correct.

  I recall that in probability theory, if you have a conditional probability update, it shouldn't affect unrelated events. South and the tip about North are independent, so South's probability should remain unchanged. Therefore, Dave's model might have a flaw. The user's intuition is correct here. The tip only informs the distribution within North, so North should still be 50%, but now Lower is about 41.67% and Upper is 8.33%, while South remains 50%. Therefore, there's no reason to move teams from North-Upper to South because North as a whole still has the same probability, just distributed differently internally.

  But Dave's model shows North dropping to 43-44%. Why? The user says Dave's model ensures the new distribution is consistent with the tip. The tip says P(Lower|North) = 5/6. In the original, P(Lower|North) was 0.5. So to satisfy P(Lower|North)=5/6, if North remains 50%, then Lower becomes (5/6)*50% ≈41.67%, Upper (1/6)*50%≈8.33%. That satisfies the condition. But Dave's model is reducing North overall. Why would it do that?

  Perhaps Dave's model is misapplying the constraint. Maybe the model is interpreting the tip as a joint probability or something else. Alternatively, if the model is minimizing the change in the overall distribution, it might adjust probabilities that aren't directly constrained to minimize the divergence. But in this case, since South is unconstrained, the minimal change would be to keep South the same and adjust only within North. Unless the model has a different objective.

