answer: |-
  ## Memorandum: Biobank Governance Committee - Policy Revision on Returning Secondary Findings  

  **To:** Full Board of the Biobank Governance Committee  
  **From:** Working Group on Secondary Findings Policy (Graduate Student Representative, Philosophy/Formal Epistemology)  
  **Date:** 15 October 2023  
  **Subject:** Recommended Default Policies for Returning Medically Actionable vs. Non-Actionable Secondary Findings  

  ### I. Executive Summary  
  This memo recommends distinct default policies for returning **medically actionable** versus **high-penetrance, non-actionable** secondary findings from research-grade WGS, grounded in ethical analysis, clinical pragmatism, and rigorous engagement with formal decision theory. While Good’s theorem provides a compelling *theoretical* argument for unrestricted information access, its assumptions do not fully hold in the context of familial genetic risk and non-actionable findings. We propose:  
  - **Medically actionable findings**: **Opt-out default** (status quo).  
  - **Non-actionable findings (e.g., adult-onset neurodegenerative risks)**: **Opt-in default**, with tiered exceptions.  

  ### II. Rigorous Representation of the Biostatistician’s Argument (Good’s Theorem)  
  The argument for proactively returning *all* findings rests on I. J. Good’s 1967 theorem:  
  > *For a rational Bayesian agent, the expected utility of acquiring costless information is non-negative, as one can always choose to ignore it and act identically to the uninformed state.*  

  This implies:  
  1. **No rational harm**: A competent adult cannot be worse off receiving information, as she retains the option to disregard it.  
  2. **Autonomy primacy**: Withholding information paternalistically denies agents the opportunity to recalibrate preferences or prepare psychologically.  
  3. **Formal guarantee**: The theorem is mathematically sound under its axioms—single agent, costless information, and a well-defined action space.  

  This view holds that denying non-actionable findings violates participant autonomy by preemptively deciding what agents "should not know."  

  ### III. Critical Limitations of Good’s Theorem in this Context  
  While formally unimpeachable, the theorem’s assumptions are *contingently challenged* by genetic information’s unique properties:  
  1. **Non-singular agency**:  
     - Genetic findings implicate untested biological relatives who *did not consent* to receive information. A participant’s "choice to ignore" does not extend to relatives who may inadvertently learn their risk (e.g., via familial communication patterns).  
     - *Example*: A sibling’s autonomy may be violated if a participant’s Huntington’s variant is disclosed without consent.  

  2. **Psychological and relational costs**:  
     - Good assumes "costless" information. However, learning non-actionable risks (e.g., APOE-ε4 for Alzheimer’s) can impose irreversible psychological burdens (anxiety, stigma) and relational tensions, irrespective of any "action."  
     - These costs are non-recoverable: One cannot "un-know" information to revert to the prior epistemic state.  

  3. **Ill-defined action spaces**:  
     - For non-actionable findings, no clinical actions exist to mitigate risk. Thus, the "subsequent action" central to Good’s utility calculus is undefined, weakening the theorem’s applicability.  

  4. **Competency and bias**:  
     - Real-world agents are vulnerable to cognitive biases (e.g., probability neglect, therapeutic misconception). Good’s "rational Bayesian agent" is an idealization that may not reflect participant behavior when confronted with lifelong risk estimates.  

  **Conclusion**: Good’s theorem supports *permitting* access to non-actionable findings but does not *compel* proactive disclosure, as the costs and relational externalities violate its core assumptions.  

  ---

  ### IV. Recommended Default Policies  
  #### A. **Medically Actionable Findings** (e.g., BRCA, Lynch syndrome)  
  - **Policy**: **Opt-out default** (current policy maintained).  
  - **Justification**:  
    - Actionability provides a clear clinical utility anchor, satisfying Good’s requirement for a defined action space (e.g., surveillance, prophylaxis).  
    - Urgency of prevention justifies minor autonomy infringements under a soft paternalism framework.  
    - Relatives may benefit from cascade testing, aligning familial and individual interests.  

  #### B. **Non-Actionable, High-Penetrance Findings** (e.g., Huntington’s, *LRRK2*-Parkinson’s)  
  - **Policy**: **Opt-in default** (participants must affirmatively request these findings).  
  - **Tiered Exceptions**:  
    1. **Pediatric findings**: Disclose only if actionable in childhood (ACMG criteria).  
    2. **Participant re-contact option**: Allow participants to update preferences (e.g., if findings become actionable).  
    3. **Verified request for all data**: Accommodate participants who explicitly desire comprehensive information (e.g., research advocates).  
  - **Justification**:  
    - Preserves the "right not to know" for findings lacking clinical utility, avoiding irreversible psychological harms.  
    - Respects relational autonomy by reducing non-consensual implications for relatives.  
    - Aligns with international frameworks (e.g., UNESCO’s *Declaration on the Human Genome*, GDPR "right to be forgotten").  

  ---

  ### V. Implementation Mechanics  
  1. **Informed consent redesign**:  
     - Segment consent into:  
       - Tier 1 (Actionable): Default return (opt-out).  
       - Tier 2 (Non-actionable): Active opt-in required.  
     - Use decision aids to explain implications for relatives.  
  2. **Periodic preference updates**: Allow participants to modify preferences biannually.  
  3. **Relational ethics protocol**: Develop guidelines for participants who wish to share findings with relatives.  

  ### VI. Conclusion  
  Good’s theorem offers a powerful argument against *withholding* information from consenting individuals but does not override the ethical imperative to protect vulnerable parties (e.g., non-consenting relatives) or to shield participants from non-mitigable harms. Our tiered policy maximizes autonomy while minimizing unintended harms:  
  - **Actionable findings**: Opt-out prioritizes life-saving utility.  
  - **Non-actionable findings**: Opt-in prioritizes psychological integrity and relational ethics.  

  This balances formal rationality with the phenomenology of genetic risk.  

  ---  
  **Endorsed by Working Group**:  
  - [x] Graduate Student Rep. (Philosophy/Formal Epistemology)  
  - [ ] Biostatistician Member (Pending Review)  
  - [ ] Clinical Geneticist Lead  
  - [ ] Bioethicist Member  

  *Attachment: Simplified decision-tree flowchart for consent tiers.*  

  ---  
  **Key Philosophical Citations**:  
  - Good, I.J. (1967). "On the Principle of Total Evidence." *Br. J. Philos. Sci.*  
  - Bonnici, H. et al. (2021). "Relational Autonomy in Genomic Biobanking." *AJOB*.  
  - Clayton, E.W. (2020). "The Complexities of 'Right Not to Know.'" *Genome Med.*  

  This draft rigorously represents the biostatistician’s argument while demonstrating why Good’s theorem, though elegant, is insufficient to mandate proactive disclosure of non-actionable findings. The opt-in default for Tier 2 findings respects the theorem’s spirit (enabling access) without ignoring its practical limitations.
