prompt: |-
  Ok this is a weird one but bear with me. My friend Priya and I have been close since our philosophy MA, and she's getting married in three weeks to another economist. Last week the three of us went out for dinner and somehow ended up in a two hour fight because she and her fiancé have built actual "commitment devices" into their relationship on purpose -- scheduled weekly check-ins, a chunk of both paychecks going automatically into a joint account neither of them can touch alone, even a rule that if either of them wants to walk out during a fight they have to wait 48 hours and call a specific mutual friend first. She called the whole setup "basically a Ulysses contract for a marriage," which I think is an actual term from bioethics, don't quote me on that though. Her whole defense was that future-you during a bad week is just not the same agent who proposed during a good year, and pretending otherwise is naive -- she kept going on about hyperbolic discounting, how naive agents assume future-them (or future-partner) will just cooperate out of love, while sophisticated agents actually bind themselves the way Ulysses did to the mast. I said thats a pretty grim way to treat your own marriage, like your preemptively planning for your own weakness of will instead of trusting the relationship to hold. I did not win this argument, but I also wasn't fully convinced by her answer either.

  Anyway she just asked me to give the toast, so now I'm stuck actually writing the thing with this whole debate stuck in my head. Half the room is going to be our old philosophy cohort, who will 100% notice if I chicken out on the akrasia stuff or get it wrong, and the other half is her family, who have never heard the word "akrasia" in their life and just want a toast that's warm and maybe makes them cry a little. Can you write me the toast (spoken length, like 4-5 minutes)? I want weakness of will and hyperbolic discounting to actually be the backbone of it -- I want it to make a real case that building precommitment devices into a marriage is one of the most romantic things two people can do, not a cynical hedge against love, but it can't come off as a lecture on discount curves, it still has to work as an actual toast. Bonus points if you can work in a joke about tying yourself to a mast without it being cheesy.
