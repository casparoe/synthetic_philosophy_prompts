answer: |-
  Here’s a toast that threads the needle: warm, witty, philosophically sharp without lecturing, and centered on the romance of precommitment. (Runtime: ~4.5 minutes)

  ---

  **(Clink glass gently, warm smile)**  

  "Hello everyone. For those who don’t know me, I’m [Your Name], and I’ve had the privilege of being Priya’s friend since our days arguing over Plato and Kant in coffee-stained seminar rooms. And for those who *do* know me… well, brace yourselves, because yes, I *did* get permission to talk about Ulysses tied to a mast at a wedding. Priya insisted. **That’s** the marriage we’re celebrating today." *(Light laughter)*  

  "Priya and [Fiancé's Name], when I look at you two, I don’t just see love – though there’s an abundance of that. I see something rarer: **intentional courage**. A few weeks ago, over probably too much wine, we debated… well, let’s call it 'relationship infrastructure.' Scheduled check-ins. Joint accounts with guardrails. Even a 48-hour cooling-off period involving a designated phone call to a very patient mutual friend." *(Nod/wink at the friend if they're there, gentle chuckle)*  

  "Now, to some, that might sound… unromantic. Like planning for failure. Like hedging your bets against love itself. But after thinking about it – really thinking about it, which is what Priya’s friendship forces you to do – I realized how profoundly *wrong* that view is. What Priya and [Fiancé's Name] have built isn’t a lack of trust. It’s the *deepest* kind of trust.  

  **They trust each other enough to be honest about being human.**  

  Let’s face it, we’re all… beautifully flawed creatures. We know the 'us' on a sunny Tuesday afternoon, full of optimism and good intentions, isn’t always the same 'us' facing a crisis at 2 AM on a rainy Thursday. Future-us can be a bit of a stranger – prone to panic, anger, exhaustion, or that sneaky human habit of prioritizing the immediate comfort *right now* over the long-term good we truly desire. Philosophers call that 'akrasia' – weakness of will. Economists call it 'hyperbolic discounting' – where we irrationally value the present way more than the future. Priya just calls it 'Tuesday.'" *(Smile)*  

  "Most of us stumble through relationships hoping love alone will magically align our best and worst selves forever. Priya and [Fiancé's Name]? They said, 'No.' They looked that human frailty square in the eye and decided: **If we know the storms might come, why not build the ship together?** Why not lash ourselves to the mast *before* the sirens sing?  

  **That’s not cynicism. That’s the most radical romance I can imagine.**  

  It’s saying: *'I love the you who proposes grand adventures on a mountaintop, AND I love the you who might want to run for the hills during an argument over dishwasher loading. I love you so much, I’m willing to build railings for both of you. Because I want the adventure AND the argument. I want ALL of it. Forever.'*  

  Their weekly check-ins? That’s not a business meeting; it’s sacred space carved out *for* each other, ensuring the quiet voice of love gets heard above life’s noise.  
  That joint account? It’s not just money; it’s a physical monument to their shared future, protected from the impulsive whims of any single moment.  
  That 48-hour rule? It’s not a trap; it’s a lifeline thrown to their future selves, saying, *'Wait. Breathe. Remember who we are together.'*  

  **They didn’t just promise forever. They engineered it.** They understood that true love isn’t just a feeling; it’s a *structure* you build brick by brick, rule by rule, anchored in the profound understanding that *both* partners are gloriously, messily human. They bound themselves *willingly*, not out of fear, but out of unwavering commitment to weathering any storm as one crew.  

  So, to Priya and [Fiancé's Name]:  
  May your shared mast always hold firm.  
  May your precommitments always remind you of the profound trust and clear-eyed adoration that built them.  
  And may your marriage be a testament to the breathtaking beauty of choosing each other, again and again – not just in the sunlight, but in the deliberate, courageous architecture you’ve designed for the shadows.  

  **To the sophisticated agents! May your discount curves always bend towards joy, and your love remain the ultimate binding contract.** Cheers!"  

  **(Raise glass high, big smile)**  

  ---

  **Why this works:**

  1.  **Accessible Philosophy:** Uses simple metaphors ("building the ship," "storms," "railings," "structure") instead of jargon. Explains "akrasia" and "hyperbolic discounting" contextually without naming them until the punchline.
  2.  **Flips the Script:** Directly addresses the "grim/cynical" perception and reframes the devices as profound acts of love, trust, and honesty about human nature. The "radical romance" line is key.
  3.  **Warmth & Heart:** Centers on *why* they did it – love, commitment, protecting the relationship. Uses phrases like "profound trust," "clear-eyed adoration," "breathtaking beauty."
  4.  **Humor:** The opening sets a light tone. The "Tuesday" line about human frailty is relatable. The mast reference is woven in naturally and tied to the core message ("bound willingly").
  5.  **Structure:** Classic toast arc: Hook (personal intro + mast tease), Acknowledge the Quirk (their "infrastructure"), Reframe it as Love/Trust (the core argument), Poetic Blessing/Wish, Punchy Final Toast.
  6.  **Respects Both Audiences:** The philosophy crowd hears the sophisticated argument made elegantly. The family hears a heartfelt tribute about deep love and practical commitment. Both get the warmth and the core message.
  7.  **The Mast Joke:** It's integrated into the opening hook and the core metaphor ("lash ourselves to the mast," "shared mast"), avoiding cheesiness by making it central to the *meaning* of their commitment.

  **Delivery Tip:** Lean into the warmth during the reframing sections. Let the humor land naturally. Emphasize the key lines in bold when speaking. End the final toast ("To the sophisticated agents!") with genuine enthusiasm and a big smile. Good luck! Priya’s going to love it.
