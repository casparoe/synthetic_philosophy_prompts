prompt: |-
  I TA a graduate seminar on decision theory that spends a couple of weeks on moral uncertainty -- much of the material overlaps with stuff that gets discussed on the EA Forum and LessWrong, which is originally how I got interested in it. This week I'm grading responses to the seminar's discussion question, and I'd like an independent read on one of them before I finalize a mark, so I've tried to present it here without signalling my own view of it.

  The question was:

  Compare "My Favourite Theory" (MFT) and "Maximize Expected Choiceworthiness" (MEC) as decision procedures for an agent under moral uncertainty. (a) State the standard objection to MFT that motivates adopting MEC instead. (b) Identify the further problem that MEC faces which does not arise for ordinary expected-utility maximization under empirical uncertainty, and explain why it doesn't arise there. (c) Briefly describe the parliamentary-model proposal for handling the problem in (b), including its source, and assess whether it actually succeeds in avoiding that problem.

  Here is the submitted answer:

  (a) My Favourite Theory (MFT) instructs the agent to act on whichever moral theory currently has the highest credence and disregard the rest, regardless of how close the credences are or how much is at stake according to the theories that are outvoted. If I assign 0.51 credence to a theory that calls some act permissible and 0.49 to a theory that calls it a serious wrong, MFT tells me to go ahead as though the second theory did not exist. This produces sharp discontinuities in behavior around the 50% threshold even though credences themselves move continuously, and it throws away information about how strongly the losing theories object. MEC replaces this with a rule that weights each theory's verdict about how choiceworthy an option is by our credence in that theory and sums across theories, so that a theory with just under half our credence can still swing the decision if enough is at stake by its own lights.

  (b) The catch is that summing in this way presupposes that the "choiceworthiness" scores different theories assign are already on a common scale, so that a utilitarian score of +8 and a Kantian score of +2 can be added together meaningfully. Ordinary expected-utility maximization under empirical uncertainty doesn't face this problem because every possible state of the world is evaluated by the same utility function; only the probabilities of the states, not the scale used to value outcomes, are in question. Under moral uncertainty, by contrast, both the credences and the yardsticks are in question at once. This is essentially the same difficulty as the interpersonal comparison of utility in welfare economics, which Arrow's impossibility theorem already demonstrated cannot be resolved in a way that is both principled and non-arbitrary, so it is unsurprising that no consensus procedure for intertheoretic comparison exists either.

  (c) MacAskill's parliamentary model sidesteps this by not attempting cardinal comparisons at all. Each moral theory is treated as a delegate in an imagined parliament, holding a number of votes proportional to our credence in it; delegates then bargain and vote on which action to take, spending more of their voting weight on the choices their theory regards as most important and conceding on choices it regards as minor. Because this only requires each delegate to rank options and weigh how much it cares within its own theory, rather than across theories, it avoids the problem in (b) entirely and lets a low-credence theory with extreme stakes still exert proportionate influence, without our ever having to say how many units of utilitarian value a Kantian violation costs.

  Could you grade this out of 10 (allocate up to 3 points for (a), 4 for (b), and 3 for (c)) and back the mark up with specific, point-by-point comments rather than a general impression -- I want to be able to justify it if the student pushes back? Please return the assessment as a JSON object with keys "a", "b", and "c" (each holding a sub-score and the specific comment justifying it), "total" (out of 10), and "summary" (one sentence).
reasoning: |-
  We are grading a student's answer to a three-part question about decision procedures under moral uncertainty. The answer is provided, and we need to assign points for each part: (a) up to 3, (b) up to 4, (c) up to 3.

  Let's break down the student's answer and evaluate each part.

  ## Part (a): State the standard objection to MFT that motivates adopting MEC.

  **Student's Answer:**
  - MFT ignores all theories except the one with highest credence, even if the credences are very close (e.g., 0.51 vs 0.49) and even if the losing theory has strong objections.
  - This leads to discontinuities in behavior at the 50% threshold and discards information about the strength of objections from the losing theories.
  - MEC is introduced as a solution that weights each theory's verdict by credence and sums, allowing a theory with less credence to still influence the decision if the stakes are high.

  **Evaluation:**
  - The student correctly identifies the key objection: MFT ignores close credences and the intensity of the losing theory's objection, leading to discontinuities.
  - The example (0.51 vs 0.49) is appropriate and illustrates the problem well.
  - The motivation for MEC is clearly explained: it aggregates by weighting and summing, thus avoiding the discontinuity and incorporating intensity.
  - This covers the standard objection comprehensively.

  **Score: 3/3** - The answer is complete and accurate.

  ## Part (b): Identify the further problem that MEC faces which does not arise for ordinary expected-utility maximization under empirical uncertainty, and explain why it doesn't arise there.

  **Student's Answer:**
  - The problem for MEC is that it requires the choiceworthiness scores from different moral theories to be on a common scale. Without this, the weighted sum is meaningless (e.g., adding a utilitarian score of +8 and a Kantian score of +2).
  - Under ordinary empirical uncertainty, we use the same utility function for all states, so we only need to handle probabilities (not scaling of utilities). 
  - The student draws an analogy to the interpersonal comparison of utility in welfare economics, mentioning Arrow's impossibility theorem to underscore the difficulty of finding a principled, non-arbitrary solution.

  **Evaluation:**
  - The core problem (intertheoretic comparability) is correctly identified and explained.
  - The contrast with empirical uncertainty is spot on: in empirical uncertainty, the utility function is fixed, so we don't have the scaling issue. Only probabilities vary.
  - The analogy to interpersonal utility comparisons and Arrow's theorem is insightful and appropriate. It shows the depth of the problem.
  - The explanation is clear and covers the required points.

  **Score: 4/4** - The answer is thorough and accurate.

  ## Part (c): Briefly describe the parliamentary-model proposal for handling the problem in (b), including its source, and assess whether it actually succeeds in avoiding that problem.

  **Student's Answer:**
  - The parliamentary model (attributed to MacAskill) treats each moral theory as a delegate in a parliament, with votes proportional to credence.
  - Delegates bargain and vote, spending more voting weight on issues their theory cares about and conceding on minor ones.
  - The model only requires each theory to rank options and weigh importance within its own theory, avoiding the need for intertheoretic cardinal comparisons.
  - Thus, it avoids the problem in (b) and allows a low-credence theory with extreme stakes to have proportionate influence.

  **Evaluation:**
  - The description of the parliamentary model is accurate and includes the key elements: delegates, votes proportional to credence, bargaining, and within-theory prioritization.
  - The source (MacAskill) is correctly identified.
  - The student asserts that the model avoids the problem of intertheoretic comparisons because it doesn't require cardinal comparisons across theories. This is a correct understanding of the model's design.
  - However, the assessment is incomplete because it does not address potential criticisms. The parliamentary model does avoid the need for direct intertheoretic cardinal comparisons, but it introduces other complexities (e.g., how bargaining is modeled, whether the bargaining process is computationally tractable, and whether it might lead to other arbitrary outcomes). Moreover, the model might still implicitly rely on some form of comparison (e.g., through the intensity of preferences expressed in voting weights). The student presents the model's success as unqualified.

  **Grading for (c):**
  - The description is accurate and includes the source: 1 point (out of the 3) for this.
  - The assessment: The student correctly states that the model avoids the problem by not requiring intertheoretic cardinal comparisons. However, the answer does not engage with the possibility that the problem might resurface in a different form (e.g., in the bargaining process) or that there might be other issues. The question asks to "assess whether it actually succeeds", and the student only gives the positive side. A more balanced assessment would note that while the model avoids direct cardinal comparisons, it may not be a complete solution because of the challenges in modeling the bargaining and the potential for strategic behavior. 

  Given that the student's answer is brief and the question asks for a brief description and assessment, we might not expect an in-depth critique. However, the student's assessment is one-sided. We should deduct a point for not acknowledging any limitations.

  **Proposed Score: 2/3** 
  - Why? 
    - The description and source are correct: 1 point.
    - The avoidance of the problem is correctly explained: 1 point.
    - But the assessment lacks critical depth: missing 1 point.

  Alternatively, we might be more lenient because the student does correctly state that the model avoids the problem and the reasoning is sound. But the question says "assess", which implies evaluating the success. The student only provides the positive claim without any critical reflection.

  Given the rubric, we can break down (c) as:
  - Description: 1 point (for accurately describing the model and source)
  - Success in avoiding the problem: 1 point (for explaining how it avoids the problem)
  - Critical assessment: 1 point (for a balanced view that considers limitations)

  The student gets the first two but not the third. So 2/3.

