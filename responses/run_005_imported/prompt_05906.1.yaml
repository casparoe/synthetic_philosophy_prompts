answer: |-
  Here are 8 interview questions tailored to your goals, each with a specific follow-up designed to push past standard replies and probe the nuances of your guest's position on logical omniscience and the problem of old evidence:

  1.  **Core Mechanism Challenge:** "You argue that the key update isn't on the old evidence *e* (Mercury's perihelion), but on the *newly discovered entailment* (GR ⊢ *e*). But without logical omniscience, how does an agent *assign* a prior probability to the claim 'GR entails *e*' *before* they learn it's true? Isn't assigning such a probability itself a sophisticated logical feat, potentially reintroducing a scaled-down version of the omniscience problem?"
      *   *Likely Reply Focus:* Agents assign priors based on perceived complexity, track record, or heuristic assessments of plausibility.
      *   **Follow-Up:** "If the prior P(GR ⊢ *e*) is based on vague heuristics or perceived complexity, doesn't that make the subsequent confirmation via learning the entailment seem fragile or subjective? How does this avoid relocating the mystery to the origin and justification of these *entailment priors*, which seem just as opaque as priors over theories themselves?"

  2.  **Counterfactual Contrast & Dependency:** "Rival approaches to old evidence often appeal to *counterfactual credences* – what the agent *would* have believed about GR *had they not known about e*. How does your 'discovery of entailment' account *differ* from this counterfactual strategy? And crucially, does your account *itself* implicitly rely on a counterfactual notion – perhaps what the agent *would have believed* about the entailment *if they hadn't already known e*?"
      *   *Likely Reply Focus:* Denies reliance on counterfactuals; emphasizes the *actual* cognitive event of discovering the entailment as the update trigger.
      *   **Follow-Up:** "But to assess the *impact* of discovering 'GR ⊢ *e*', doesn't the agent implicitly compare their *actual* state (knowing *e* and now knowing GR ⊢ *e*) to a *hypothetical* state where they knew *e* but *didn't* know GR ⊢ *e*? Isn't this comparison essential to see the *change* the discovery makes, and doesn't it smuggly invoke a counterfactual about their state *without* that entailment knowledge?"

  3.  **Accommodation vs. Prediction Symmetry:** "There's a strong intuition that a theory *built* to fit old data ('accommodation') deserves less confirmatory credit than a theory that successfully *predicts* novel data. Your solution seems to grant significant confirmatory power to the 'discovery of entailment' for *old* evidence. Does your view undermine or challenge this intuition about accommodation? Or are 'problem of old evidence' and 'accommodation vs. prediction' actually distinct issues?"
      *   *Likely Reply Focus:* They are distinct; accommodation involves designing the theory *using* the data, whereas old evidence was known but its connection to a *new* theory is discovered later.
      *   **Follow-Up:** "But in the Mercury case, while GR was new, Einstein famously *knew* about the anomaly and sought a theory to explain it. Doesn't this blur the line? If a theorist *uses* old evidence *e* as a constraint while developing theory *T*, does the subsequent 'discovery' that *T* ⊢ *e* still carry the same confirmatory weight on your view, or is it diminished – effectively treating it as accommodation?"

  4.  **The Nature of the "Discovery":** "When an agent 'discovers' that GR entails the Mercury perihelion shift, what *exactly* is being learned? Is it the purely logical fact of the entailment, or is it the realization that the *specific physical principles* of GR *produce* that specific number? Does the confirmatory power reside in the logical deduction itself, or in seeing how the *mechanism* yields the known result?"
      *   *Likely Reply Focus:* It's the realization that the *theory's core content* necessitates the specific observational outcome.
      *   **Follow-Up:** "If the power comes from seeing the *mechanism* produce the result, doesn't this edge closer to the idea that the old evidence *itself* is being re-evaluated in light of the new theoretical framework, rather than *just* learning a new logical fact? How does this avoid collapsing back into a form of updating on *e*?"

  5.  **Scope & Generality:** "Does your solution *only* apply to cases like Mercury's perihelion, where the entailment is highly non-trivial and surprising? Or should it also apply to trivial cases? For example, if a simple theory obviously entails a well-known, basic fact (say, conservation of energy in a closed system), does 'discovering' that entailment still provide confirmatory boost, even if everyone already assumed the theory *must* entail it?"
      *   *Likely Reply Focus:* The confirmatory power scales with the non-obviousness/surprise of the entailment.
      *   **Follow-Up:** "But doesn't this make confirmation hinge on the *psychology* of surprise rather than the objective logical relation? How do we objectively ground the *degree* of confirmation provided by learning an entailment if it depends on the agent's prior state of logical ignorance or insight?"

  6.  **Historical Fidelity vs. Rational Reconstruction:** "Is your account of the 'discovery of entailment' driving confirmation meant to be a description of how scientists like Einstein *actually* reasoned about Mercury's perihelion? Or is it a *rational reconstruction* – a normative model of how they *should* have reasoned, even if their actual justifications referenced the evidence more directly?"
      *   *Likely Reply Focus:* Likely leans towards rational reconstruction, arguing it captures the underlying normative justification.
      *   **Follow-Up:** "Einstein explicitly presented Mercury's perihelion as direct, powerful evidence *for* GR. If your model is primarily normative, how do you reconcile it with the apparent disconnect from the historical actors' own stated reasoning? Does this suggest scientists are intuitively tracking something closer to the counterfactual ('how surprising *e* would have been without GR') rather than the entailment discovery?"

  7.  **The Cost of Ignorance:** "You relax logical omniscience, allowing agents to be unaware of some entailments. But doesn't this create a perverse incentive? Agents are *rewarded* with confirmation precisely for their *prior logical ignorance* regarding T ⊢ *e*. The *less* logically proficient they were (i.e., the lower their P(GR ⊢ *e*)), the *more* their credence jumps when they learn it's true. Does this make sense as a feature of rational updating?"
      *   *Likely Reply Focus:* It's not an "incentive"; it's a consequence of learning genuinely new information. The jump reflects the resolution of genuine uncertainty.
      *   **Follow-Up:** "But doesn't this imply that two scientists, identical in all respects *except* that one is logically sharper and already suspected GR entailed *e* (assigning high P(GR ⊢ *e*)), would get *less* confirmation from verifying the entailment than their less sharp colleague? Should rational confirmation *really* be sensitive to prior levels of logical insight in this way?"

  8.  **Beyond Entailment - Necessity?:** "Is the *strict deductive entailment* (T ⊢ *e*) essential to your solution? What about cases where a theory *T* simply provides a highly *probabilistic* or *explanatory* account of old evidence *e*, falling short of strict logical entailment? Does the 'discovery' of this strong probabilistic/explanatory link also drive confirmation via a similar mechanism, even without deductive certainty?"
      *   *Likely Reply Focus:* The core mechanism likely centers on strict entailment, but probabilistic links might involve different dynamics.
      *   **Follow-Up:** "If probabilistic/explanatory links for old evidence *don't* trigger the same 'entailment discovery' update, how does your account explain the apparent confirmatory power such links often have? Does this suggest the problem of old evidence might require multiple solutions, or that your entailment-focused solution has limited scope?"

  **Key Interview Strategy:**

  *   **Listen Actively:** Pay close attention to *how* she phrases her answers. The follow-ups are based on likely *directions*, but her specific wording might offer even better openings.
  *   **Pivot from Abstraction:** If she starts giving a general restatement, gently but firmly steer her back to the *specific implications* raised by the question/follow-up (e.g., "So, applying that to the Mercury case specifically..." or "How does that address the concern about confirmation varying with logical ignorance?").
  *   **Clarify Terminology:** Ensure you're both using terms like "confirmation," "entailment," "accommodation," and "counterfactual" in the same way. Don't hesitate to ask for a quick clarification if needed.
  *   **Bridge to History:** Use the Mercury perihelion as a concrete anchor point throughout. Ask her to illustrate her points using that specific historical example.

  These questions should provide a rigorous and engaging framework for your interview, pushing your guest to elaborate and defend the deeper implications and potential vulnerabilities of her interesting proposal. Good luck with the podcast!
