prompt: |-
  hi so i'm on my school's honor council (15 of us, we handle cheating/plagiarism cases) and i got asked to draft the memo for our next meeting. normally 3 members get randomly picked per case and majority vote decides guilty or not, hands raised right there in the room. our advisor wants to switch to 9 random members per case instead of 3 -- her reasoning is that since each person's at least a little better than a coinflip at telling real cheating from an honest mistake, way more voters should basically guarantee the group gets it right. some of the council loves this idea but ngl something about it is bugging me and i cant totally explain what, especially since half our cases are genuinely murky "intent" calls, and everyone already talks about the case in the hallway before we vote anyway (also votes aren't secret). can you write the memo for thursdays meeting recommending if we keep it at 3, bump to 9, or do something else, with real reasons -- and it needs to actually take her side seriously, not just brush it off?
