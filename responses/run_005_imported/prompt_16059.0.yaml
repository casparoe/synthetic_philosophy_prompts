answer: |-
  This is a fascinating collision of rational choice theory and messy human psychology—and you're absolutely right that your friend's situation exposes a critical nuance often glossed over in introductory decision theory. Let's break it down:

  ### 1. Why the "Free Information Can't Hurt" Argument **Doesn't Apply Here**
     - **The Bayesian Rationale is Decision-Consequential:** The principle you're recalling (from expected utility theory & Bayesian decision theory) states that *before* a decision, acquiring costless information cannot *reduce* your expected utility. Why? Because you can always condition your action on the new information *or ignore it* and act as you would have without it. It gives you optionality.
     - **The Decision is Irreversibly Made:** Your friend has no remaining choices affected by this information. She cannot renegotiate her salary, un-move, or accept the other job. The information has **no instrumental value**—it cannot improve her outcomes, resources, or future decisions related to this job choice.
     - **Information Without Agency is Psychologically Loaded:** Once a decision is irreversible, information about the counterfactual ("what might have been") shifts from being *instrumental* to being purely *affective* (emotional). Its impact isn't on future actions but on present feelings like regret, satisfaction, or curiosity.

  ### 2. Why She Might *Actually* Be Worse Off Knowing
     - **Asymmetry of Regret:** Learning she was the "backup choice" could trigger **counterfactual regret** ("If only I'd known they preferred someone else, I might have felt differently!"). Conversely, learning she was their top choice might fuel **inaction regret** ("If only I'd pushed harder on salary!"). Regret is often more potent for *action* than inaction, but both can sting.
     - **Threat to Narrative Coherence:** Humans construct post-hoc narratives to feel good about irreversible choices ("I chose this job because it's the best fit!"). Information that contradicts this narrative (e.g., "They only wanted me as a backup") can undermine her sense of control and satisfaction, even if logically irrelevant.
     - **The "Curiosity Tax":** Knowing creates an obligation to *process* the information emotionally. Her "bad feeling in her stomach" suggests an intuitive understanding that this knowledge might become a cognitive load—a mental "splinter" she can't extract. Rumination is exhausting.
     - **Social Comparison Costs:** Learning details (e.g., salary they *would* have offered) might invite unhealthy comparisons with her current role or peers, fostering resentment or dissatisfaction with her *actual* (unchanged) circumstances.

  ### 3. Is There a "Principled" Rational Answer?
     - **Not within Standard Decision Theory:** Since the information has no bearing on future choices, classical rationality is silent. Utility functions typically don't model "curiosity for its own sake" or "regret avoidance" as intrinsic values. It *does* dissolve into psychology.
     - **Behavioral Economics/Cog Sci Offers Frameworks:**
       - **Anticipated Regret:** She might "rationally" avoid information if she *anticipates* that knowing will cause more regret/disutility than not knowing. Her intuition ("bad feeling") is a heuristic for this.
       - **Motivated Reasoning:** People selectively seek/avoid information to protect desired beliefs (e.g., "I made the best choice"). Protecting her current satisfaction might be "rational" for well-being.
       - **The Value of Ignorance (Rational Inattention):** In contexts where information cannot change actions, strategic ignorance can be optimal for minimizing cognitive/emotional costs. Not asking is a valid self-protective strategy.

  ### The Verdict: It's About Psychology, Not Rationality
  Your friend isn't borrowing a rationality argument—she's wrestling with two deeply human drives:
  - **The Drive for Closure:** Seeking information to resolve uncertainty ("Was I valued?").
  - **The Drive for Emotional Protection:** Avoiding knowledge that might destabilize her hard-won contentment.

  **What she "should" do depends entirely on her psychological makeup:**
  - If she's highly resilient, handles ambiguity well, and curiosity outweighs potential discomfort → Asking might satisfy her and reinforce her choice.
  - If she's prone to rumination, regrets "what-ifs," or values narrative coherence → *Not* asking preserves her current equilibrium.

  ### Practical Advice for Your Friend
  1. **Reframe the Question:** Instead of "Why not ask?" ask: "What emotional need would answering this serve *now*? Will the answer help me build the life I want, or anchor me to a past I can't change?"
  2. **Consider the Cost of Not Knowing:** Is the *uncertainty* itself causing ongoing distress? If yes, knowing might bring relief.
  3. **Acknowledge the Irreversibility:** Write down: "Nothing I learn changes my teaching, my colleagues, my city, or my contract. This is about my *feelings* about the past."
  4. **Respect the Gut Feeling:** That "bad feeling" is her mind alerting her to potential emotional risk. It's data worth weighing.

  ### Why This Matters for Your Teaching
  This is a *perfect* case study for your JDM course! It highlights:
  - The **limits of the "free information" principle** (context matters!).
  - The difference between **instrumental value** (info for decisions) and **affective impact** (info for feelings).
  - How **post-decision information** operates in a psychological space untouched by pre-decision rationality axioms.
  - The role of **narrative, regret, and curiosity** in real-world choices.

  Your friend’s dilemma isn’t irrational—it’s a poignant example of how human cognition grapples with closed doors. Sometimes, the most rational choice after a decision is to let the curtain stay drawn.
