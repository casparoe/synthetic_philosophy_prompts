prompt: |-
  I'm putting together the session of my graduate seminar in formal epistemology that pairs van Fraassen's discussion of the Reflection Principle with Lewis's Principal Principle, and before I commit to the analogy in my lecture notes I'd like to pressure-test it. On the surface the two look like instances of a single deference schema: Lewis holds that your credence in A, conditional on the objective chance of A at t being x together with any admissible evidence, should equal x; van Fraassen holds that your credence in A now, conditional on your own credence in A at some later time t' being x, should likewise equal x. Both tell you to set your opinion equal to some credence-fixing quantity you haven't yet directly consulted — the world's chances in one case, your own future self's opinion in the other — and both have been motivated by something in the neighborhood of a diachronic Dutch book, or a "you shouldn't be able to predict the direction of your own belief revision" style argument.

  What I'm less confident about is how far the analogy survives once you look at what each principle needs in order to avoid triviality or outright counterexample. Lewis's principle depends entirely on a notion of "admissible" evidence to have any bite beyond the trivial case, and it famously needed patching — Lewis's own "New Principle" — once critics pointed out that on a Humean view of chance, facts about how the future actually unfolds can retroactively bear on what the chance at t already was, undermining the very ascription the principle was meant to license. Van Fraassen's principle, for its part, needs the proviso that you currently regard your future opinions as issuing from a process you trust; without it, anticipated brainwashing, memory loss, or sheer non-evidential drift would generate obviously absurd deference requirements. My worry is that these two escape clauses aren't doing the same kind of work: admissibility can at least be characterized without presupposing which verdicts it needs to protect, whereas "defer to your future self, except when you shouldn't" can look uncomfortably close to writing the desired answer into the antecedent, which would make Reflection much the more fragile of the two.

  I'd like your help thinking through this carefully. First, are these genuinely the same underlying norm in different guises, or is the surface parallel doing more rhetorical work than philosophical work? Second, in which specific respects — justificatory, formal, or in how each accommodates its exceptions — is the Reflection Principle a harder principle to defend than the Principal Principle, and is there any respect in which it is actually the more secure of the two? And third: suppose I currently have a well-defined chance to defer to, but I also have good independent reason to expect my own future, fully rational credence to diverge from it — not through any defect in me, but because the same undermining-style considerations mean there may be no single settled fact about the current chance for the Principal Principle to have latched onto in the first place. In a case like that, does Reflection quietly end up doing the real work while the Principal Principle becomes inapplicable, or is there a principled way to keep both operative at once?
reasoning: |-
  Okay, the user is preparing a graduate seminar lecture on formal epistemology, specifically comparing van Fraassen's Reflection Principle with Lewis's Principal Principle. They're pressure-testing the analogy between the two before finalizing their lecture notes. 

  Hmm, this is a sophisticated question from someone clearly deeply familiar with the literature. The user identifies a surface similarity—both principles being deference norms—but worries the analogy breaks down when examining how each handles exceptions. Their core concern seems to be whether Reflection's "trust in future self" proviso is fundamentally different from Lewis's "admissible evidence" clause, making Reflection philosophically weaker.

  Let me unpack their three main questions systematically. First, about whether it's the same underlying norm. The structural parallel is undeniable: both demand setting credence equal to some privileged value (chance/future credence). But the metaphysics differ radically—chance is supposed to be objective while future credence is subjective. The Dutch book justifications share similar machinery though. Maybe the deepest similarity is both enforcing a "no self-undermining expectations" requirement.

  Second question: which principle is harder to defend? Reflection definitely has vulnerabilities the Principal Principle doesn't. That "trust" proviso is troublingly circular—it essentially says "defer unless you think you'll be unreliable," which risks making the principle unfalsifiable. Whereas admissibility, while tricky, can be independently characterized (e.g., historical information). Also, Reflection faces brutal counterexamples like anticipated memory loss that Principal Principle dodges.

  Third question is fascinating—what happens when chance and rational future credence come apart? In those undermining futures, the Principal Principle may not even specify a credence because "chance" isn't well-defined. Here Reflection might actually rescue us by letting us defer to the future self who already knows the undermining fact. But this suggests Reflection isn't just analogous—it's more fundamental in some cases.

  The user's phrasing shows they've spotted something important: Reflection's "trust" clause isn't doing the same work as admissibility. It's not filtering evidence but assessing epistemic hygiene. That's why it feels circular. Maybe the right move is to present Reflection not as a parallel principle but as operating at a different level—governing our relationship with our future rationality rather than with objective chance.

  ...Wait, their last scenario is brilliant. When chance is undefined due to undermining, Principal Principle fails while Reflection can still guide us. That might be the strongest point for the lecture: in liminal cases, we fall back on diachronic self-trust. I should emphasize how this reveals Reflection's unique role.
answer: |-
  Your analogy between the Principal Principle (PP) and the Reflection Principle (RP) is insightful and pedagogically valuable, but you're right to pressure-test its limits. Let's break down your concerns systematically:

  ### 1. **Are they the same underlying norm?**
     - **Superficial Similarity**: Both are *deference norms* demanding alignment of current credence with a privileged "expert" value (chance/future credence), conditional on certain information. Both are motivated by:
       - *Coherence arguments* (diachronic Dutch books).
       - *Epistemic humility*: You shouldn't expect to outpredict your own rational future self (RP) or the world's objective chance-making machinery (PP).
     - **Key Differences**:
       - **Metaphysical Status**: PP defers to an *objective* feature of the world (chance), while RP defers to a *subjective* state (your future credence). This makes PP's "expert" independent of your beliefs, while RP's "expert" *is* your future self.
       - **Direction of Explanation**: PP is often seen as *defining* or constraining rational credence via objective chance. RP is about *diachronic self-consistency* of rationality.
       - **Scope**: PP applies to *all* agents facing chance; RP applies only to agents who *anticipate* their future credences.

     **Verdict**: They are structurally analogous deference principles but serve distinct philosophical functions. PP bridges subjective credence and objective chance; RP governs the diachronic unity of the rational agent. The parallel is more than rhetorical—it reveals a shared template for rational deference—but the "experts" differ fundamentally.

  ---

  ### 2. **Is RP harder to defend than PP? Where?**
  RP faces unique vulnerabilities compared to PP:

  | **Defense Challenge**       | **Principal Principle (PP)**                          | **Reflection Principle (RP)**                          |
  |-----------------------------|-------------------------------------------------------|--------------------------------------------------------|
  | **Exception Handling**      | Admissibility is external (e.g., historical facts). Can be formalized independently (e.g., "no information about outcomes"). | "Trust in future self" is circular. Requires *current endorsement* of future rationality, risking question-begging. |
  | **Triviality Threats**      | Humean undermining forces New Principle (NP), but NP is still externally constrained. | Anticipated irrationality (brainwashing, fatigue) *directly* violates trust condition. |
  | **Justificatory Basis**     | Dutch books + "chance as guide" intuition. Grounded in objective metaphysics. | Dutch books + self-trust. Vulnerable to *sceptical challenges* about future rationality. |
  | **Formal Fragility**        | New Principle repairs undermining via "crystal ball" credences. | "Trust" proviso lacks formal criteria—easily gerrymandered to avoid violations. |
  | **Epistemic Security**      | **More secure** against self-undermining: admissibility is evidence-relative. | **Less secure**: Future credences can be corrupted by non-evidential factors. |

  **Key Insight**: RP's "trust" clause *is* philosophically shakier than PP's admissibility. While admissibility can be analyzed (e.g., as *information not screened off by chance*), "trust" reduces to *not expecting irrationality*—which implicitly assumes RP's conclusion. This circularity makes RP more fragile.

  **Counterpoint**: RP may be *more secure* in one respect: it doesn’t rely on contested metaphysics of chance (e.g., Humean vs. primitivist). It operates purely within the agent’s perspective.

  ---

  ### 3. **Chance/Future Credence Divergence: Which Principle Dominates?**
  Your scenario—rational future credence diverges from current chance due to undermining—is profound. Consider:
  - **Case**: At *t*, chance of *A* is *ch(A)=0.6*. But you know at *t'* you’ll learn *E* (e.g., total history) revealing that *ch(A)=0.6* was "undermined" (e.g., actual frequency of *A* is 0.9). As a rational agent, *cr<sub>t'</sub>(A|E)=0.9*.

  **Analysis**:
  1. **PP at *t***:  
     - If *E* is admissible (as per New Principle), PP demands *cr<sub>t</sub>(A | ch<sub>t</sub>(A)=0.6 ∧ E) = 0.9*.  
     - But *E* is future evidence, so at *t*, you lack *E*. PP only constrains *cr<sub>t</sub>(A)* given *actual* knowledge of *ch<sub>t</sub>(A)* and admissible evidence.  
     - **Result**: PP is silent until *E* is known. Undermining means *ch<sub>t</sub>(A)* isn’t a "direct expert" (Hall 2004).

  2. **RP at *t***:  
     - You anticipate *cr<sub>t'</sub>(A)=0.9*. RP (with trust) demands *cr<sub>t</sub>(A | cr<sub>t'</sub>(A)=0.9) = 0.9*.  
     - Crucially, *you already expect divergence* from *ch<sub>t</sub>(A)* due to *E*.

  **Resolution**:
  - RP *subsumes* PP in this scenario. Your rational future self incorporates *E*, which resolves the undermining. Deferring to them (via RP) is how you *indirectly* respect the New Principle’s demand to account for undermining futures.
  - **Why RP dominates**:  
    - PP requires a well-defined *ch<sub>t</sub>(A)*, but in undermining contexts, *ch<sub>t</sub>(A)* depends on future outcomes. RP sidesteps this by treating your *epistemically updated future self* as the expert.  
    - This aligns with Lewis’s "crystal ball" intuition: rational credence *after* learning *E* is the best guide, even if *E* undermines *ch<sub>t</sub>(A)*.

  **Conclusion**: When chance and rational future credence diverge due to undermining, RP isn’t just operative—it’s *necessary* to salvage deference. PP’s "inapplicability" is resolved by recognizing that your future self *internalizes* the objective evidence PP couldn’t directly access at *t*.

  ---

  ### Pedagogical Recommendations:
  1. **Frame the analogy as structural, not metaphysical**: Highlight the shared deference *schema* while stressing that PP and RP answer different questions ("What should I believe given chance?" vs. "How should I relate to my future rational self?").
  2. **Use RP to illuminate PP’s flaws**: Show how undermining futures force PP into RP’s arms—making RP *more* fundamental in diachronic contexts.
  3. **Address circularity head-on**: Argue that RP’s "trust" isn’t *ad hoc* but reflects a constitutive norm of rationality: viewing your (anticipated) future self as an improved epistemic agent. Contrast with PP’s external admissibility.
  4. **Assign Weisberg’s critique**: His "Conditionalization and Reflection" (2007) shows how RP can conflict with evidence updating—perfect for discussing limits.

  **Final Verdict**: Your analogy holds, but RP is the harder principle to defend. Its fragility, however, reveals something deep: rational deference to chance *requires* deference to your future, better-informed self when chance is Humean. That’s a compelling payoff for the seminar.
