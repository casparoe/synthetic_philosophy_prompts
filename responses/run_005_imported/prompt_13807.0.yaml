answer: |-
  ### Point-by-Point Analysis of the Dispute  

  #### **(1) Nadia's Initial Challenge: The Disjunction Problem**  
  Nadia is **correct** in identifying a genuine limitation of teleosemantics. The "selected effects" theory *does* face a disjunction problem: evolutionary success can be described at multiple levels of grain (e.g., "catching flies," "acquiring nutrition," "propagating genes"). Since these descriptions were coextensive in the ancestral environment, selection history alone cannot non-arbitrarily privilege one content (FLY) over another (SMALL-DARK-MOVER). This mirrors classic critiques (e.g., Fodor 1990) that teleosemantics fails to resolve indeterminacy.  

  #### **(2) Felix's Rebuttal: Consumer Mechanisms & Normal Explanations**  
  Felix is **partially correct** but overstates the case. Millikan’s appeal to the "Normal explanation" *does* constrain content by focusing on properties exploited by downstream consumers (e.g., the tongue-flick system’s reliance on motion/contrast). This rules out contents like "propagating genes" or "nutritious object" because they don’t causally explain the consumer’s success *in the mechanism’s design*. However, this **does not fully resolve indeterminacy**: it narrows content to properties like SMALL-DARK-MOVING, but cannot distinguish "fly" from "small insect" or "inanimate debris" if both trigger the same consumer response. Felix is right that teleosemantics avoids *some* disjunctions, but wrong to imply it delivers fully determinate content.  

  #### **(3) Nadia's Rejoinder: Consumer Regress**  
  Nadia is **largely correct**. The consumer system’s own teleofunctional ambiguity reintroduces indeterminacy. If "success" for the tongue-flick system can be described as "hitting a fly," "hitting a moving object," or "ingesting protein," teleosemantics cannot non-arbitrarily select one description to fix the detector’s content. Felix’s move relocates the problem to the consumer without solving it, creating a regress (if consumers require determinate content, but their content depends on *their* consumers, ad infinitum). This exposes a circularity: teleosemantics needs prior criteria for "success" to fix content, yet claims to derive content from success.  

  #### **(4) Felix's Concession: Coarseness as Virtue**  
  Felix **changes the subject** but makes a valid pragmatic point. Conceding residual indeterminacy (e.g., "fly" vs. "small dipteran") and comparing it to coarse-grained concepts like "water" addresses a *different* issue: whether indeterminacy invalidates teleosemantics. His analogy works for *coarse-grained* content (e.g., PREDATOR vs. NON-PREDATOR), but **fails to answer Nadia’s circularity objection** (3). Biological kinds *are* often coarse, but teleosemantics still presupposes a prior notion of "success" without explaining how *that* content is fixed. Felix’s appeal to "explanatory needs of ethology" dodges the metaphysical problem Nadia highlights.  

  ### Key Oversights by Both  
  - **Nadia underappreciates constraint**: Consumer mechanisms *do* exclude implausible contents (e.g., "nutritious object" isn’t exploited by motion detectors). This reduces (but doesn’t eliminate) indeterminacy.  
  - **Felix ignores the normativity gap**: Teleosemantics relies on "Normal conditions" (Millikan 1984), but what counts as "Normal" is itself teleologically ambiguous (e.g., is a shadow in sunlight "abNormal"?).  
  - **Both miss historical specificity**: Millikan’s theory emphasizes *lineage-specific* functions. If frog ancestors only encountered flies (not debris), "fly" might be privileged. But absent such evidence, indeterminacy persists.  

  ### Overall Assessment  
  Nadia successfully exposes a foundational circularity in teleosemantics: it requires determinate "success conditions" to fix content but cannot ground those conditions without presupposing content. Felix’s consumer-based constraints mitigate but do not resolve this, and his appeal to coarseness concedes the core indeterminacy while reframing it as unproblematic. Teleosemantics may handle *coarse-grained* content well, but Nadia’s critique shows it struggles with *determinacy* at finer grains.  

  \verdict{Nadia}
