answer: |-
  Your struggle cuts to the heart of social ontology—how norms gain binding force without explicit agreement. Hume's passage *is* challenging, but there's no true gap; rather, he's describing a profound shift from individual interest to collective intentionality. Lewis later formalizes this, but the core insight is Humean. Let's dissect it:

  ### 1. **"Mutually express'd" ≠ Explicit Communication**
     Hume isn’t describing a verbal contract. "Expression" here is **behavioral and inferential**. Consider his rowing example:
     - Rower A adjusts their stroke to match Rower B’s rhythm.
     - Rower B notices this and steadies their own pace.
     - Neither speaks, but both *express* their commitment to coordination through action. The "expression" is in the *responsive adjustment*, creating a feedback loop of mutual recognition.

     In your community: When users self-censor under the unwritten rule (e.g., avoiding taboo topics), and others tacitly approve (through lack of objection or reciprocal restraint), they "express" the convention. It’s a distributed performance, not a handshake deal.

  ### 2. **Gradual Emergence Without "Promise"**
     Hume rejects the need for promises because conventions are **emergent equilibria**:
     - **Self-Interest → Convergence**: Individuals independently realize coordination serves their interest (e.g., "If I respect possession, others will respect mine").
     - **Reciprocity Crystallizes Norms**: Repeated successful coordination (e.g., rows not capsizing, threads not devolving into flame wars) reinforces the pattern. It becomes a *schema* for behavior.
     - **Silent Bargain**: As Hume says, it’s a "general sense of common interest" made actionable through precedent. No promise is needed because the norm *is* the solution to a repeated coordination problem.

  ### 3. **From Convenience to Obligation: The Normative Leap**
     This is Hume’s deepest insight: **The sense of justice arises from the utility of the convention**.  
     - **Phase 1: Coordination for Interest**: Initially, adherence is purely pragmatic ("This keeps the peace").  
     - **Phase 2: Expectation & Reliance**: Once the pattern is established, others rely on it ("We expect oars to stay in sync").  
     - **Phase 3: Moral Sentiment**: Violations now harm *social expectations*, not just individual goals. Breaking the convention becomes "unjust" because it:  
       - Exploits others’ compliance (free-riding).  
       - Undermines a system beneficial to all.  
       - Triggers moral resentment in observers.  

     In your forum: The unwritten rule likely started as practical moderation (Phase 1). After years of reliance, breaching it feels like a betrayal of communal trust (Phase 3)—hence the controversy.

  ### 4. **Does Lewis "Solve" the Puzzle?**
     Lewis (*Convention*, 1969) provides tools to formalize Hume, but doesn’t fundamentally alter the framework:  
     - **Common Knowledge**: Lewis requires that conventions are not just known, but that everyone knows others know, etc. This clarifies how "mutually express’d" can be tacit.  
     - **Coordination Equilibrium**: Conventions solve recurrent problems where aligned action benefits all (e.g., driving on the right). The equilibrium self-reinforces.  
     - **Salience**: Unwritten rules often persist because they’re focal points—everyone defaults to them as "the way things work."  

     **Does this close a gap?** Yes, by showing how norms gain authority through recursive expectations. But the core mechanism—emergence from reciprocal interest—remains Hume’s. Lewis relocates the puzzle into game theory, but the "magic" of normativity still arises from human interdependence, not logic.

  ### **Implications for Your Community**
  The controversy likely erupted because:  
  - **Reliance was invisible**: Members internalized the norm but never articulated its value.  
  - **New entrants lacked context**: Without lived experience of *why* the rule existed, it seemed arbitrary.  
  - **Enforcement shifted**: Peer pressure ("soft" convention) became your moderation ("hard" enforcement), altering perceived legitimacy.  

  **To heal the rift**: Re-anchor the rule in *common interest*. Facilitate a dialogue where:  
  1. Longstanding members express *how* the rule served collective goals (e.g., "It prevented factionalism").  
  2. Newcomers voice concerns about opacity.  
  3. Together, you codify (or revise) the norm explicitly—making it a true Humean convention, "mutually express’d" through democratic agreement.  

  Hume’s genius was seeing that society’s foundations aren’t built on vows, but on the fragile, daily re-enactment of cooperation. Your community’s tension is proof of that mechanism—when the re-enactment falters, the "ought" collapses back into "why?" Lewis gives you a lexicon to analyze it, but the repair is human.
