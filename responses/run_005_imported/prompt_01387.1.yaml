prompt: |-
  I teach a philosophy of economics seminar, and the last two sessions were on interpersonal utility comparisons — starting with Robbins basically declaring them meaningless value judgments that have no place in scientific economics, then Harsanyi's aggregation theorem, which supposedly derives a weighted-utilitarian social welfare function without needing interpersonal comparisons at all, and then Sen (and Broome, and Weymark) pushing back that the weights in Harsanyi's result are arbitrary and can't actually be pinned down unless you sneak comparability back in through the side door. We also got into Arrow's later "extended sympathy" move from the second edition of Social Choice and Individual Values, where instead of comparing utility levels directly you rank things like "being me in my situation" against "being you in yours." It's great fun to teach in the abstract, but I honestly never thought I'd need any of it for actual departmental buisness, until this week.

  Here's the situation: our department has exactly one semester of paid research leave to hand out this year, and rather than let the chair just pick, the personnel commitee sent round a form asking each of the five eligible faculty to self-rate, on a scale of 0 to 100, "how much would this leave benefit your research." Whoever comes out on top gets the leave. About half the department thinks this is a perfectly sensible Benthamite solution, and the other half (me included) has a nagging sense that we're maxing over numbers that were never comparable in the first place, though I'm struggling to turn that hunch into an actual argument for the next meeting. Could you spell out the most important implications of the interpersonal utility comparisons debate for whether a procedure like ours can be defended at all? I'd like you to actually engage with the specific technical positions here (Robbins's skepticism, the Harsanyi/Sen/Weymark dispute, extended sympathy, maybe even how applied welfare economists try to sidestep the whole mess with money-metric or willingness-to-pay measures) rather than just telling me that comparing utility across people is hard, because that much I already knew going in.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They teach a philosophy of economics seminar and recently covered interpersonal utility comparisons. Now, their department is using a self-rating system (0-100 scale) to allocate research leave, and they need to critique this method using the theories they've taught. 

  First, I recall Robbins' stance: utility comparisons are unscientific value judgments. The department's approach assumes these self-ratings are cardinal and comparable, but Robbins would argue these numbers lack empirical grounding. Each person's scale might differ—like one professor's 80 being another's 50. There's no calibration method here, making aggregation meaningless.

  Next, Harsanyi's aggregation theorem. The committee might think they're applying a utilitarian solution, but Harsanyi requires a vNM utility function under uncertainty. The self-rating isn't under a veil of ignorance; it's straightforward rating. Also, the weights are arbitrary. Without a shared risk scenario, the theorem doesn't apply. Sen and Weymark's critiques highlight that the weights depend on the scaling, which isn't addressed here. The chair's choice of linear aggregation is arbitrary without interpersonal comparability.

  Then there's extended sympathy. Arrow's approach would require ranking "being in my position vs. yours," but the form only asks for personal benefit ratings. There's no mechanism for empathetic comparisons, so the responses stay isolated. The department's method misses this crucial element for meaningful comparison.

  Applied welfare economics uses money metrics, but here, the lack of a market context makes willingness-to-pay irrelevant. Without pricing, the ratings are abstract numbers without a common denominator. Even if converted, the different marginal utilities of money across faculty would distort comparisons.

  The user's deeper need is to articulate why the procedure is flawed beyond just "it's hard to compare." They need concrete arguments from the theories to present at the meeting. They might also want alternatives that avoid these issues, like focusing on opportunity cost or procedural fairness. 

  I should emphasize that the numbers' cardinality and comparability are assumed without justification. Highlighting each theory's specific critique will strengthen their argument. Also, suggesting practical alternatives could address the committee's operational concerns while sidestepping the philosophical pitfalls.
answer: |-
  Your departmental procedure hits *precisely* at the core tension between the appeal of utilitarian aggregation and the fundamental critiques from the interpersonal comparability debate. Here's how the key positions dismantle the defense of your committee's approach, with technical specifics:

  1.  **Robbins' Positivist Skepticism: The Foundational Problem of Meaning**
      *   **Core Argument:** Robbins argued that utility is an introspective, ordinal, and purely subjective state. Observing behavior reveals only preference orderings (ordinal utility), not the *intensity* of satisfaction (cardinal utility), let alone the *relative intensity* between different minds. Declaring "my 80 is greater than your 70" is not a scientific statement based on observable facts; it's an untestable ethical judgment smuggled in as science.
      *   **Applied to Your Case:** When Professor A rates their benefit as 95 and Professor B as 80, Robbins would ask: *What empirical content do these numbers possess?* What observable phenomenon does "95" correspond to for A versus "80" for B? There is no calibration. A's scale might be wildly compressed relative to B's (e.g., A only uses 90-100, B uses 0-100). Or, A might be strategically inflating, while B is modest. The numbers are cardinal *within* each individual's mind (assuming they can introspect intensity), but they are utterly meaningless *across* individuals. Aggregating them is like adding temperatures measured with uncalibrated thermometers using different scales (Fahrenheit vs. Celsius vs. an arbitrary personal scale). The "max" operation is mathematically defined, but the result has no meaningful interpretation as "greatest total benefit."

  2.  **Harsanyi's Aggregation Theorem & Sen/Weymark's Critique: The Arbitrariness of Weights**
      *   **Harsanyi's Claim:** Under idealized conditions (vNM rationality, impartial observer behind a veil of ignorance), Harsanyi showed that social preferences *must* be a weighted sum of individual vNM utility functions: W = ΣaᵢUᵢ. He claimed this derived utilitarianism *without* assuming interpersonal comparability because the weights (aᵢ) emerge from the structure of choice under uncertainty.
      *   **Sen & Weymark's Devastating Rebuttal:** Sen and Weymark demonstrated that Harsanyi's weights (aᵢ) are **arbitrary** without interpersonal comparability.
          *   **The Scaling Problem:** vNM utility functions are unique only up to a positive affine transformation (Uᵢ' = bᵢUᵢ + cᵢ; bᵢ > 0). If Professor A rescales their utility function (e.g., multiplies their internal scale by 2), their weight (aₐ) in the social welfare function effectively *halves* relative to others, potentially changing the social ranking. *The social ordering depends entirely on the arbitrary scaling choices individuals make (or the observer assumes) for their personal utility functions.*
          *   **Applied to Your Case:** Your department's procedure implicitly assumes:
              *   **Cardinality:** Individuals can meaningfully assign cardinal numbers to their expected benefit (a big assumption Robbins rejects).
              *   **Unit Comparability (Level Comparability?):** That the *units* of the 0-100 scale are comparable across individuals. That a "1 unit" increase on A's scale means the same thing as a "1 unit" increase on B's scale.
          *   **The Fatal Flaw:** Sen/Weymark show that even *if* individuals provide cardinal measures, unless their scales are calibrated (i.e., unless we know how to transform them onto a common scale), the weights are arbitrary. Your procedure sets bᵢ = 1/100 (mapping each person's max perceived benefit to 100) and cᵢ = 0 (mapping min/no benefit to 0), and implicitly sets aᵢ = 1 for everyone. **This is a *massive*, unjustified assumption about interpersonal comparability.** Why should Professor A's "100" (their peak intensity) be treated as equivalent to Professor B's "100"? Why not weight A by 0.5 and B by 2? The choice of equal weights (aᵢ=1) and the assumption that 100 means the same thing for everyone *is* the act of assuming full interpersonal comparability of utility levels and units. Harsanyi's theorem doesn't save you; it highlights that your simple sum *is* a specific, arbitrary weighting scheme dependent on the scaling convention you've imposed (0-100 normalization).

  3.  **Arrow's Extended Sympathy: What You're *Not* Asking For**
      *   **Core Idea:** Arrow acknowledged the problem of direct utility comparison. His "extended sympathy" approach suggests ranking social states *including* information about *who* occupies which position. Instead of comparing "my utility in state X" vs. "your utility in state Y," we ask individuals to rank hypotheticals: "State X where *I* am Professor A" vs. "State Y where *I* am Professor B."
      *   **Applied to Your Case:** Your committee procedure asks the *opposite* of what extended sympathy requires. You are asking individuals only about their *own* utility under *one* state (them getting the leave). You are **not** asking them to make empathetic judgments comparing what it would be like *to be them* getting the leave vs. *to be someone else* getting the leave. You get five isolated, subjectively scaled numbers with no bridge for comparison. Extended sympathy requires a fundamentally different type of preference elicitation that your form completely lacks.

  4.  **Applied Welfare Economics Sidestep (Money Metrics/WTP): Why It Doesn't Apply Here**
      *   **The Maneuver:** Applied economists often use monetary measures (e.g., Willingness-To-Pay (WTP), Compensating Variation) as a *proxy* for utility. The argument is that money provides a common, observable numeraire. While acknowledging the "marginal utility of money" differs, they often assume it's roughly similar or focus on potential Pareto improvements (Kaldor-Hicks).
      *   **Applied to Your Case:** This sidestep is **unavailable** for your problem.
          *   **No Market Context:** The research leave isn't being auctioned. There's no revealed preference or WTP data. You're asking for a direct utility rating.
          *   **Not a Policy with Winners/Losers Paying:** Kaldor-Hicks is irrelevant. This is a pure allocation of a discrete good.
          *   **Money Metric Useless:** Even if you asked "How much would you personally be *willing to pay* for this leave?" (which you didn't), you'd still face the problem that $10,000 means vastly different things (represents vastly different utility sacrifices) to a junior professor vs. a senior one, or someone with family wealth vs. student loans. Using WTP *implicitly weights utility by the inverse of marginal utility of income* – a specific, ethically loaded interpersonal comparison.

  **Conclusion & Argument for Your Meeting:**

  The core argument against your department's procedure is this:

  *   **The procedure assumes *precisely* what Robbins declared meaningless and what Sen/Weymark showed is necessary but arbitrary for Harsanyi-style aggregation: Full interpersonal comparability of cardinal utility levels and units.**
  *   The 0-100 ratings are cardinal *only within* each individual's subjective framework. There is **no basis** for assuming that:
      *   A rating of 80 for Professor A signifies the same *absolute level of benefit* as an 80 for Professor B.
      *   The *difference* between 60 and 70 for A signifies the same *intensity of benefit change* as the difference between 60 and 70 for B.
      *   Therefore, adding or comparing these numbers across individuals is **mathematically possible but substantively meaningless.** The "max" result is an artifact of the arbitrary scaling and weighting convention (implicitly aᵢ=1 and identical scale calibration) baked into the form.

  **A Better Way (Philosophically Defensible Alternatives):**

  1.  **Embrace Ordinalism & Procedural Fairness:** Acknowledge direct utility comparison is impossible. Use a fair *procedure* based on observable need/opportunity or random chance. Examples:
      *   Prioritize faculty without recent leave.
      *   Prioritize faculty facing a major upcoming deadline (e.g., book manuscript due, grant renewal).
      *   Lottery among eligible candidates.
  2.  **Extended Sympathy Lite:** Have the committee (or department) discuss and attempt to *jointly* rank the hypothetical states ("If Prof A gets it...", "If Prof B gets it...") based on empathetic understanding of colleagues' situations and research needs. This is hard, but at least confronts the comparability issue head-on.
  3.  **Proxy Measures (With Caveats):** Use imperfect but observable proxies likely correlated with marginal benefit *and* deemed normatively relevant:
      *   **Opportunity Cost:** Who has the heaviest teaching/service load next semester? (Lower opportunity cost might mean less marginal benefit from *released* time).
      *   **Stage/Trajectory:** Is this leave critical for a junior scholar's tenure case or a senior scholar's final major project?
      *   **External Validation:** Strength of research statement/plan submitted for the leave (judged holistically by committee).

  **Your Punchline:** "This procedure gives us a false sense of scientific objectivity. It produces a number, but that number is the result of adding incomparable subjective scales using an arbitrary weighting rule. We haven't measured aggregate benefit; we've performed a mathematical ritual that disguises an ethical choice about whose perceived benefit counts equally. Let's instead make an ethical choice transparently, based on fair procedures or reasonable proxies we can collectively defend." This directly leverages the technical critiques of Robbins, Sen, and Weymark against the Benthamite facade. Good luck!
