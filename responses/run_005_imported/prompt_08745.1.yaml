prompt: |-
  At the small developer-tools company where I work, we recently made the source code for our core product publicly visible for the first time, and it has turned into a surprisingly heated internal argument that's been running for weeks. The new license lets anyone read the code, modify it for their own use, and even redistribute their changes, but it forbids repackaging it as a competing hosted service — essentially the same move several well-known infrastructure and database companies have made in recent years after watching big cloud providers resell their software without contributing anything back. About half my team wants the launch announcement and README to call this "open source," since the code is genuinely sitting out in the open and anyone can send us a pull request. The other half, mostly people who have worked on real open-source projects before, say that's misleading, because the license fails a couple of the criteria in the Open Source Initiative's official definition — specifically the ones about not discriminating against particular fields of endeavor or classes of user. What makes the argument strange is that nobody disputes any fact about what the license actually permits; both camps describe its terms identically. They only disagree about whether those terms add up to something that earns the label.

  I've somehow ended up responsible for drafting the final wording, mainly because I don't have a strong enough stake for either side to resent me for it, but I have no background in philosophy and I'm not sure how to settle this beyond picking a side and absorbing the complaints afterward. It occurs to me that since nobody involved is confused or mistaken about any actual fact, more arguing seems unlikely to change anyone's mind — but I can't tell whether that means the disagreement isn't a real one, or whether one side is still simply correct and the other simply wrong. Is there a principled way to work out whether two people who agree on every fact but disagree about what to call the result are disagreeing about anything at all, and if it turns out they aren't, does that mean it genuinely doesn't matter which way we write the announcement?
reasoning: |-
  Okay, let me try to figure out how to approach this user's problem. They're stuck in a licensing debate at their company about whether to call their new source-available license "open source." Both sides agree on the facts of the license terms but disagree on the label. The user needs to draft the announcement and is looking for a principled way to resolve this.

  First, I should recall the Open Source Initiative's definition. The OSI is the authority on what constitutes open source, and their definition includes ten criteria. The license in question violates two: non-discrimination against fields of endeavor and groups of users. Since it restricts commercial hosting, it discriminates against a specific field (SaaS hosting) and a class of users (cloud providers). That's a clear point against calling it open source.

  But the other side argues that since the code is publicly viewable and allows contributions, it feels like open source. They might be conflating "source available" with "open source." It's important to distinguish between the two. The OSI's stance is that licenses like SSPL or BSL, which have usage restrictions, are not open source. So, technically, the license doesn't meet the criteria.

  The user mentioned that the disagreement isn't about facts but about labeling. This is a semantic disagreement. Philosophers like Wittgenstein might say that meaning comes from use, but in this context, the term "open source" has a well-established definition by OSI. Using it incorrectly could mislead the community and cause backlash, especially from open-source advocates.

  The user's deeper need might be to maintain team harmony and avoid misrepresenting their product. Calling it "open source" could lead to accusations of being misleading, which might harm their reputation. On the other hand, not using the term might disappoint some team members who feel it's open enough. 

  I should consider the consequences. If they call it open source, they risk alienating the open-source community and facing criticism. If they don't, they might need to clarify their license's benefits without the open-source label. Terms like "source available" or "frictionally open" might be alternatives. 

  Also, the user's role as a neutral party means they need a solution that both sides can accept. Emphasizing transparency and community contributions without using the "open source" label could satisfy both camps. Highlighting the practical benefits while being honest about the license's restrictions might be the best approach. 

  In conclusion, the principled answer is that the license isn't open source by OSI standards. The disagreement is semantic, but using the term incorrectly has real risks. The user should avoid "open source" in the announcement, explain the license clearly, and focus on the positives of their model.
answer: |-
  This is a fascinating and surprisingly deep semantic disagreement that cuts to the heart of how language, definitions, and community norms interact. Here's a principled way to analyze and resolve it:

  1.  **Acknowledge the Nature of the Disagreement:** This is **not a factual dispute** about the license terms (everyone agrees on those), nor is it a **moral disagreement** about the license's merits. It's purely a **semantic disagreement** about the appropriate application of the label "open source." Philosophers call this a dispute about the **extension** (what things fall under the term) of the concept "open source."

  2.  **The Authority of Definition:** Terms like "open source" derive meaning from **community consensus and formal definitions.** The Open Source Initiative (OSI) is the widely recognized steward of the Open Source Definition (OSD). Their definition isn't arbitrary; it codifies the principles that fostered the collaborative ecosystem the term was coined to describe.
      *   **Fact:** Your license violates OSD #6 ("No Discrimination Against Fields of Endeavor") by prohibiting use in a specific field (hosted SaaS competition). It *might* also violate OSD #5 ("No Discrimination Against Persons or Groups") if "cloud providers" are considered a specific group, though this interpretation can be nuanced.
      *   **Conclusion:** **By the OSI's authoritative definition, your license is *not* Open Source.** This isn't a matter of opinion; it's a failure to meet the defined criteria. Calling it "Open Source" would be factually incorrect according to the body that coined and defines the term.

  3.  **Why "It's Open!" Isn't Enough:** The "code is open" camp is conflating:
      *   **Source-Available:** Code is publicly viewable.
      *   **Open Source:** Code meets the OSD criteria, granting specific, recognized freedoms.
      Many licenses are source-available but *not* open source (e.g., many shared-source licenses, some freeware licenses). Calling your license "open source" because the code is visible ignores the crucial *freedom* aspects defined by the OSD.

  4.  **The Risks of Mislabeling:**
      *   **Community Backlash:** The open-source community, especially developers and companies heavily invested in it, values the clarity and principles of the OSD. Misusing the term will likely lead to accusations of "openwashing," damaging your company's credibility and trust. (See the reactions to licenses like SSPL or BSL being misleadingly called "open").
      *   **Confusion & Mistrust:** Users familiar with OSD will be surprised or angered when they discover the restrictions. This undermines the goodwill you hope to gain by making the code visible.
      *   **Dilution of Meaning:** Contributing to the erosion of a clear, valuable term harms the broader ecosystem you might want to engage with.

  5.  **Principled Resolution - It *Does* Matter:**
      *   **Respect the Definition:** The principled approach is to respect the established definition maintained by the relevant community (OSI). The side arguing against calling it "open source" is objectively correct based on the OSD.
      *   **Semantic Disagreement ≠ Meaningless:** While the *core disagreement* is semantic, the *consequences* of the chosen label are very real. Language shapes perception and expectations. Using the wrong label *creates* factual misunderstandings for your audience, even if your internal teams agree on the underlying facts.
      *   **"Agreeing on Facts" is Insufficient:** You agree on the *license text*, but you disagree on the *meaning of the term "open source."* The team wanting to use "open source" is using an incorrect definition ("code is visible") versus the correct definition ("meets the OSD").

  **The Solution: Clear, Accurate Language**

  You *can* achieve the benefits of transparency without misusing "open source." Here's how to draft the announcement:

  1.  **Avoid "Open Source":** Do not use the term "open source" or "OSI-approved" in the announcement or README.
  2.  **Use Precise Terminology:**
      *   "**Source Available**" is the accurate overarching term.
      *   "**Shared Source**" is another common, less ambiguous term.
      *   "**Frictionally Open**" (if you want a bit more flair, implying open but with specific friction points).
      *   Explicitly state: "**While not an OSI-approved Open Source license**, we are making our core product's source code publicly viewable under the [License Name] license."
  3.  **Highlight the Positives Clearly:**
      *   "**Publicly Viewable Source Code**"
      *   "**Community Contributions Welcome**" (explicitly mention you accept pull requests).
      *   "**Freedom to View, Modify, and Run** for any purpose."
      *   "**Freedom to Redistribute Modifications**."
  4.  **Transparently State the Limitation:**
      *   "The license includes a restriction on offering the software or significant modified versions as a commercial hosted service competing with our core offering. This ensures we can sustainably develop the product while still providing significant access to the code."
  5.  **Focus on Intent & Benefits:**
      *   Emphasize goals like transparency, trust, community collaboration, and internal developer efficiency (e.g., easier hiring, onboarding).
      *   "We believe making our source visible fosters greater trust, enables deeper integration, and allows the community to contribute improvements, while ensuring we can continue to invest in the product's future."

  **Why this is the Principled Path:**

  *   **Accuracy:** It correctly describes the license (source-available, not OSI open source).
  *   **Honesty:** It builds trust by being upfront about the limitations.
  *   **Respect:** It respects the open-source community and its definitions.
  *   **Clarity:** It avoids confusion and sets accurate expectations.
  *   **Principled Compromise:** It satisfies the desire for openness and collaboration *without* misappropriating a protected term. The "pro-open-source-label" camp gets the visibility and collaboration mechanisms they value; the "pro-OSD" camp gets accurate labeling.

  **Addressing the Teams:**

  *   **To the "Call it Open Source" Camp:** "We understand the desire to use the common term, and we absolutely share the goals of openness and collaboration that it represents. However, using it incorrectly risks significant backlash, confusion, and damage to our credibility within the very communities we want to engage. We can achieve all the practical benefits of openness – viewable code, pull requests, community trust – using accurate language like 'source available' while explicitly welcoming contributions. This protects us and respects the established ecosystem."
  *   **To the "Stick to OSD" Camp:** "You are correct that the license does not meet the OSI's Open Source Definition. The final wording will respect that by avoiding the term 'open source' and using accurate alternatives like 'source available.' We will clearly state the license's permissions and limitations, emphasizing our commitment to transparency and community contributions within that framework."

  By taking this approach, you resolve the semantic dispute by respecting the authoritative definition, avoid negative consequences, and still effectively communicate the significant positive step your company is taking. The label genuinely *does* matter for accuracy, trust, and avoiding community backlash.
