prompt: |-
  So last night me and my friend Priya got into it about whether religious belief is even the kind of belief that evidence can touch. She's Catholic, I'm not, and I kept pushing on "ok but what would actually change your mind," and she said that's the wrong question entirely, which threw me. We ended up down a whole Wittgenstein rabbit hole (she took a philosophy of religion class last year) about his lectures where he talks about someone who believes in the Last Judgement, and how believing that isn't like believing there's a German aeroplane flying overhead - its not just a claim you're more or less confident in, its supposedly a totally different kind of thing, tied up with how you live rather than what you predict. I get the intuition but it also kinda feels like a dodge? Like, either there's a Last Judgement or there isn't, that's a fact about the world, and saying "that's not the kind of claim evidence bears on" seems like a way of rigging things so the belief can never lose.

  Can you write me a dialogue between a Wittgensteinian defending that view of religious belief as its own "language game," not answerable to evidence the way an empirical hypothesis is, and a critic (think Kai Nielsen) who thinks this move is basically just a way to make religious claims unfalsifiable without admitting it? I want real back-and-forth where they actually engage with each other's strongest points on the Last Judgement case specifically, not two people talking past each other, and neither one should get an easy win.
