  ok so this has been living in my head since tuesday. we just finished the protein synthesis unit in AP bio, our teacher said something like "DNA is basically nature's version of computer code," and after class my friends caleb and nina would not let it go. caleb said DNA really is a code, not just a metaphor for a chemical process — his main point was that the codon-to-amino-acid mapping is arbitrary (nothing about the actual chemistry of glycine requires it to be GGU/GGC/GGA/GGG specifically, that's just how it locked in a long time ago), and an arbitrary convention like that is basically the definition of a code, not a physical law. nina said arbitrary doesn't automatically mean coded: the exact frequency your phone's wifi runs on is also totally arbitrary, but nobody says wifi "encodes meaning" because of that. she said a real code needs something on the other end capable of actually getting the message right or wrong, whereas ribosomes are just shapes bumping into shapes with no interpreting going on anywhere. caleb shot back that cells have proofreading enzymes that literally catch and fix translation mistakes — isn't that exactly the right/wrong structure nina just said was missing? nina said having error-correcting machinery doesn't prove real meaning is involved, since a thermostat "corrects" a "wrong" temperature too and nobody thinks its interpreting anything, it's just doing its function. this ate the entire rest of lunch and neither of them budged (extremely nerdy lunch table, i know). can you referee it move by move, saying who actually has the better argument at each specific point rather than just who wins overall, and tell me if theres some bigger thing they're both missing?
