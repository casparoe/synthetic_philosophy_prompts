  Looking at move 1: Marcus establishes Anscombe's core distinction between targeting civilians versus collateral damage. His framing of Hiroshima/Nagasaki as fundamentally different from conventional bombing seems logically sound based on the doctrine of double effect. I'd score this highly because it cleanly applies the philosophical principle to the historical case.

  Move 2 presents Leah's compelling counter: she argues the distinction collapses at scale. Her "more work than it can bear" objection powerfully questions whether we can maintain this moral line when civilian casualties reach catastrophic levels. This deserves high marks too - it exposes a genuine tension in just war theory.

  For move 3, Marcus brings decisive historical evidence about target selection. The deliberate preservation of cities for maximum psychological impact strongly supports his claim that civilian destruction was the means, not side effect. This factual reinforcement of move 1 earns top marks.

  Move 4 sees Leah attacking Anscombe's absolutism itself. Her "rule worship" charge cuts deep - if saving millions requires violating a rule, shouldn't consequences matter? I'll score this moderately since it's rhetorically strong but doesn't actually refute deontology.

  In move 5, Marcus defends moral absolutes by warning of slippery slopes. While important, this feels weaker against Leah's concrete numbers argument. The scoring reflects this as a partial rebuttal rather than full victory.

  Both debaters miss crucial dimensions: Marcus overlooks how context (total war's blurring of combatant/civilian) challenges neat categorizations, while Leah underestimates how abandoning moral bright lines enables future atrocities. The deepest gap is their shared neglect of non-utilitarian alternatives - was there truly no third option between massacre and invasion?
