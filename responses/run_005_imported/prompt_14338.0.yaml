answer: |-
  That's a sharp and compelling argument, landing firmly within a major school of ethical thought, but calling it the *settled* view among ethicists overstates the consensus. It's a powerful and widely accepted position (especially among contemporary moral philosophers), but it's not without significant challengers. Here's a breakdown for your sanity check:

  1.  **Your Core Argument (Reliance/Expectation Harm):**
      *   **Strongly Supported By:** This is essentially the core of **Scanlon's Contractualism** (particularly in *What We Owe to Each Other*). Scanlon argues that the wrongness of breaking a promise stems from violating a principle ("Principle F") that no one could reasonably reject. The principle is roughly: "If you intentionally lead someone to form expectations about your future behavior (based on your assurance), and they rely on that expectation, you have a duty not to disappoint that reliance *unless* you have a good reason they couldn't reasonably reject."
      *   **Also Supported By:** Many **Consequentialists** (especially Rule-Utilitarians) would agree that the primary *reason* promise-keeping is obligatory is because of the immense social utility of trust, reliance, and stable expectations. Breaking a promise directly harms that individual's reliance and indirectly harms the social fabric of trust.
      *   **Supported By Common Sense:** It resonates deeply with everyday experience. We *do* feel the weight of having created expectations and the harm caused by dashing them.

  2.  **Why It's NOT the *Settled* View (The "Spooky" Duty Persists):**
      *   **Kantian Deontology:** Kantians argue the obligation is **categorical and prior to consequences**. When you make a promise, you create a self-imposed moral law through your will ("I will do X"). Breaking it isn't *primarily* wrong because of the disappointment caused *to the other person*, but because it involves making an exception for yourself, contradicting your own rational will, and treating the promisee merely as a means. The duty arises from the act of promising *itself*, creating a "bond of obligation" (which some might call "spooky").
      *   **Social Practice Theories (e.g., Rawls, Searle):** These views argue that a promise derives its force from participating in a **social institution** (the practice of promising). This institution has constitutive rules: making a promise *counts as* undertaking an obligation. The wrongness lies in violating the rules of this socially constituted practice, undermining the institution itself, not *just* in the specific harm to the individual's reliance (though that harm is a consequence of undermining the institution). The obligation is created by the performative act within the social context.
      *   **Fidelity as a Basic Virtue (Virtue Ethics):** Some virtue ethicists see promise-keeping as an expression of the fundamental virtue of **fidelity** or **integrity**. Breaking a promise is a failure of character, a mark of untrustworthiness, regardless of the specific harm caused in a particular instance. The obligation stems from the kind of person one ought to be.
      *   **The "Bare Wronging" Objection:** Critics of the reliance view sometimes ask: What if someone *doesn't* rely? (e.g., "Promise me you'll water my plants while I'm away, but I've hired someone else anyway so I won't actually be relying on you"). Many people intuit that breaking the promise is *still* wrong, even without actual reliance harm. This suggests the obligation might be more fundamental than just preventing harm to expectations. Scanlon addresses this by focusing on the *justifiability* of potential reliance, even if it doesn't occur.

  **Conclusion for Your Piece:**

  *   **Your view is absolutely legitimate and defensible:** It's a highly influential, sophisticated, and psychologically plausible account (especially aligned with Scanlon). Framing the core wrongness as the *harm of disappointed, deliberately induced reliance* is powerful and avoids unnecessary metaphysical baggage for many readers. It connects beautifully to game theory (tit-for-tat, reputation) and evolutionary psychology (signaling reliability).
  *   **But avoid claiming it's "settled":** Acknowledge that while this view explains a huge part of the obligation and resonates strongly, significant philosophical traditions ground the duty elsewhere (in autonomy, social practice, or virtue). You can confidently present it as a *major* and *compelling* perspective without needing to dismiss alternatives as irrelevant. Ethicists are still debating the precise foundations.
  *   **Phrasing Suggestion:** Instead of "full stop" or "no extra spooky duty," consider:
      *   "...the core moral wrong of breaking a promise *lies in* the harm caused by disappointing the reliance and expectations one deliberately created."
      *   "A powerful account, championed by philosophers like T.M. Scanlon, argues that the obligation generated by a promise is fundamentally explained by the harm of disappointing the deliberate expectations we create – there's no need to invoke a mysterious, freestanding 'duty' separate from this relational harm."
      *   "From both psychological and ethical perspectives (particularly expectation-based views like Scanlon's Contractualism), the primary force binding a promise is the harm inflicted by betraying the deliberate reliance one has invited."

  **In short:** Your core insight is excellent and forms the backbone of a dominant modern ethical theory. Write it up confidently! Just soften the claim about it being the *only* or *universally settled* view to reflect the ongoing philosophical richness of the debate. It makes your piece stronger to acknowledge the depth of the question while championing your chosen perspective.
