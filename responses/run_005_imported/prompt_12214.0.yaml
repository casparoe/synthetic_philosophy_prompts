  **Defense of Top-Ranked Criterion (Predictive Parity):**  
  Predictive parity (calibration within groups) is the most defensible single standard because it ensures risk scores carry the same meaning across groups—a 60% risk score implies 60% reoffense likelihood for all. This directly addresses the core normative concern that risk assessments might systematically overestimate danger for one group (leading to unnecessary detention) or underestimate for another (causing avoidable harm). It's robust to base rate differences, auditable via outcome data stratified by score bins, hard to game without degrading model accuracy, and aligns with legal frameworks emphasizing accurate individualized predictions. In pretrial contexts where risk communication to judges is paramount, calibration ensures tool reliability without mandating demographic parity in detention rates.

  **Disqualification of Bottom-Ranked Criteria:**  
  Counterfactual fairness and individual fairness are unfit as standalone compliance standards. Counterfactual fairness requires untestable causal models (e.g., specifying how race influences other variables), making verification impossible for auditors and inviting speculative litigation. Individual fairness demands an uncontested similarity metric—unattainable in justice contexts where "similarity" is normatively contested (e.g., should prior convictions weigh equally across racially biased policing jurisdictions?). Both criteria create paralyzing implementation hurdles, lack audit-ready operational definitions, and fail to address group-based disparities that animate discrimination complaints. They prioritize theoretical purity over deployable standards, rendering them impractical for real-world oversight.
