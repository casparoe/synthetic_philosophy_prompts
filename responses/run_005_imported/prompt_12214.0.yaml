    "S": ["Predictive Parity"],
    "A": ["Equalized Odds", "Equal Opportunity"],
    "B": ["Conditional Statistical Parity"],
    "C": ["Statistical Parity", "Treatment Equality"],
    "D": ["Individual Fairness", "Counterfactual Fairness"]
  }
  ```

  Note: The criterion names must match the given list. We used:
  - "Predictive Parity" for predictive parity/calibration within groups
  - "Equalized Odds" for equalized odds
  - "Equal Opportunity" for equal opportunity
  - "Conditional Statistical Parity" for conditional statistical parity
  - "Statistical Parity" for statistical parity
  - "Treatment Equality" for treatment equality
  - "Counterfactual Fairness" for counterfactual fairness
  - "Individual Fairness" for individual fairness

  Defense of top (Predictive Parity):
  In pretrial risk assessment, the primary goal of the tool is to accurately estimate the probability of recidivism. Calibration within groups ensures that the risk scores are equally reliable across demographic groups, meaning that a given score reflects the same actual risk regardless of group membership. This is fundamental because it allows decision-makers to trust the tool's predictions and make informed decisions. Without calibration, the tool may systematically overestimate or underestimate risk for certain groups, leading to unjust outcomes. Moreover, calibration is robust to base rate differences and is auditable using standard outcome data.

  Disqualification of bottom (Counterfactual Fairness and Individual Fairness):
  Counterfactual fairness requires untestable causal assumptions and counterfactual data, making it infeasible for real-world auditing and deployment. Individual fairness demands a context-specific similarity metric that is both difficult to define objectively and computationally prohibitive to verify at scale. Both criteria, while theoretically appealing, are impractical as regulatory standards due to their data requirements, susceptibility to modeling choices, and lack of clear audit protocols. They do not provide a workable standard for ensuring fairness in a deployed pretrial tool.
