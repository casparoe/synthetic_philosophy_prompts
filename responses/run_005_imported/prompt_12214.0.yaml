prompt: |-
  I'm a PhD student in computer science working on algorithmic fairness, and this term I'm TAing an interdisciplinary seminar, cross-listed with philosophy, that spends a couple of sessions on the impossibility results that grew out of the COMPAS/ProPublica dispute: the Kleinberg-Mullainathan-Raghavan and Chouldechova results showing that once base rates differ across groups, no imperfect classifier can simultaneously achieve calibration within groups, equal false positive rates, and equal false negative rates. That's a large part of why Northpointe and ProPublica were able to both be technically right while talking past each other. Every year, once the class has absorbed the impossibility, someone asks the obvious follow-up: fine, but if you actually had to ship a pretrial risk tool, which single criterion would you commit to? I've never been satisfied with my own answer on the spot, and most treatments of this material stop at contrasting statistical parity with equalized odds, without ever putting the fuller menu of criteria head-to-head.

  I'd like your help thinking this through more carefully. Consider these eight criteria, all of which appear somewhere in the literature spawned by this dispute: statistical parity, conditional statistical parity, equalized odds, equal opportunity, predictive parity/calibration within groups, treatment equality, counterfactual fairness, and individual fairness. Now suppose a jurisdiction has accepted the impossibility result and wants to name exactly one of these as the formal compliance standard for a pretrial risk-assessment tool, treating violations of the rest as unavoidable trade-offs rather than independently actionable failures. Please rank these eight criteria from best to worst choice for that role, weighing both practical considerations (robustness to differing base rates across groups, data and causal-model requirements, how easily an auditor could verify compliance, how easily the deploying agency could game it) and how well each criterion actually tracks the ordinary complaint "this tool discriminates against this group," as opposed to being a mathematically convenient but normatively arbitrary proxy for it.

  Please present your ranking as a tier list in the following JSON format (ties within a tier are fine, and you needn't fill every tier), followed by one short paragraph defending your top-ranked criterion and one short paragraph explaining what disqualifies your bottom-ranked one:

  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```
reasoning: |-
  We are ranking eight fairness criteria for use as the single formal compliance standard for a pretrial risk-assessment tool, given that we accept the impossibility result and must choose one. The criteria are:

  1. Statistical Parity (SP): Equal selection rates across groups (i.e., same proportion of positive predictions).
  2. Conditional Statistical Parity (CSP): Statistical parity after conditioning on a set of legitimate factors.
  3. Equalized Odds (EO): Equal false positive rates (FPR) and equal false negative rates (FNR) across groups.
  4. Equal Opportunity (EqOpp): Equal false negative rates (FNR) across groups (a relaxation of equalized odds).
  5. Predictive Parity (PP) / Calibration within Groups: For any predicted risk score, the proportion of positive outcomes should be the same across groups and equal to the risk score. Also, sometimes broken into calibration and balance for the positive/negative class.
  6. Treatment Equality (TE): Equal ratio of false positives to false negatives (or equal error rates) across groups.
  7. Counterfactual Fairness (CF): The prediction for an individual would be the same in the counterfactual world where their protected attribute was changed.
  8. Individual Fairness (IF): Similar individuals (as defined by a task-specific similarity metric) should receive similar predictions.

  We must consider:
  - Practicality: robustness to differing base rates, data requirements, auditability, and gaming.
  - How well each criterion tracks the ordinary complaint of discrimination.

  Given the context of pretrial risk assessment, we note that base rates (i.e., actual recidivism rates) often differ across groups (e.g., racial groups). The impossibility result tells us we cannot have calibration, equal FPR, and equal FNR simultaneously when base rates differ.

  Ranking rationale:

  Top tier (S): Should be a criterion that is both robust to base rate differences and aligns well with the normative goal of avoiding discrimination in pretrial decisions. It should also be relatively auditable and hard to game.

  Bottom tier (D): Criteria that are either highly impractical (e.g., require unavailable data or complex modeling) or do not align well with the normative concerns, or are particularly vulnerable to base rate differences or gaming.

  Step-by-step:

  1. **Predictive Parity (Calibration within Groups)**:
     - This is a fundamental requirement for a risk assessment tool: if the tool predicts 20% risk, then about 20% of those should reoffend, regardless of group. It ensures the tool is equally reliable across groups. 
     - However, note the impossibility result: when base rates differ, we cannot have calibration and equal error rates (FPR/FNR) simultaneously. But if we have to pick one, calibration is often seen as essential for risk tools because it directly relates to the meaning of the score. 
     - It is robust to base rate differences in the sense that it can hold even when base rates differ. 
     - Auditability: Requires outcome data by group and by predicted score, which is feasible with sufficient data. 
     - Gaming: Hard to game without affecting the accuracy of the predictions. 
     - Normative alignment: It addresses the concern that the tool might be overestimating or underestimating risk for a particular group, which is a core complaint.

  2. **Equalized Odds (EO)** and **Equal Opportunity (EqOpp)**:
     - EO requires equal FPR and FNR. EqOpp (a weaker form) requires only equal FNR. 
     - In pretrial, false negatives (releasing someone who then reoffends) and false positives (detaining someone who would not reoffend) are both harmful, but the harms are asymmetric. Equalized Odds is a strong non-discrimination criterion because it requires that the tool has the same error rates across groups. 
     - However, it may be in conflict with calibration when base rates differ. 
     - Auditability: Requires knowing outcomes and group membership, and computing error rates. 
     - Gaming: Possible by adjusting thresholds arbitrarily, but if the threshold is fixed, then it's a clear criterion. 
     - Normative alignment: It directly addresses the complaint that one group is subject to more errors than another. 
     - But note: Equalized Odds might force the tool to have the same error rates even if one group is inherently harder to predict, which might be seen as unfair if base rates differ.

  3. **Equal Opportunity (EqOpp)**:
     - Focusing only on FNR (i.e., equality in releasing the truly non-reoffending) is particularly relevant in pretrial because false negatives (releasing someone who reoffends) can lead to public harm, and false positives (detaining someone innocent) is a direct harm to the individual. Equalizing FNR ensures that no group is disproportionately denied the opportunity of release when they are not a risk. 
     - It is less stringent than EO and might be more achievable. 
     - Auditability: Requires outcome data and group membership. 
     - Gaming: Similar to EO.

  4. **Conditional Statistical Parity (CSP)**:
     - This adjusts for legitimate factors (e.g., prior record) and then requires statistical parity. It avoids the crudeness of SP by accounting for relevant differences. 
     - However, it requires defining what factors are legitimate and having data on them. 
     - It does not directly account for base rates and might force the tool to ignore group differences that are relevant to risk. 
     - Auditability: Requires data on the conditioning variables. 
     - Gaming: By manipulating the conditioning variables, it might be gamed.

  5. **Statistical Parity (SP)**:
     - Requires the same proportion of positive predictions (e.g., "high risk") for each group. 
     - It is independent of outcomes, which can be a problem: if base rates differ, forcing SP may require the tool to be less accurate for one group. 
     - It is easily auditable (only predictions and group membership). 
     - But it does not track the complaint about discrimination in outcomes. 
     - In pretrial, if one group has a higher base rate, then having the same proportion labeled high risk might be under-predicting for that group and over-predicting for the other. 
     - Also, it can be gamed by adjusting thresholds arbitrarily without improving accuracy.

  6. **Treatment Equality (TE)**:
     - Equal ratio of FPs to FNs (or equal error rates). 
     - This is less common. It focuses on the balance of errors. 
     - However, it does not necessarily align with the goal of accuracy or fairness. For instance, if one group has a high FP and high FN, the ratio might be the same as another group with low errors. 
     - It may not be robust to base rates and is not a standard criterion. 
     - Auditability: Requires outcome data. 
     - Gaming: Might be achieved without actually being fair. 
     - Normative alignment: Weak, because it doesn't address the actual harm of errors.

  7. **Individual Fairness (IF)**:
     - Requires a similarity metric. It is appealing in theory but very difficult in practice because defining the similarity metric is non-trivial and context-dependent. 
     - Auditability: Very hard because it requires comparing every pair of individuals. 
     - Gaming: By manipulating the similarity metric. 
     - While it aligns with the idea that similar people should be treated similarly, it does not address group-level disparities and might not be feasible for a regulatory standard.

  8. **Counterfactual Fairness (CF)**:
     - Requires causal models and counterfactual data, which are typically unavailable and hard to validate. 
     - Auditability: Almost impossible because we cannot observe counterfactuals. 
     - Gaming: Hard to even implement, let alone game. 
     - While it is a strong theoretical notion, it is not practical for a real-world compliance standard.

  Given the above, we rank:

  S tier: Predictive Parity (Calibration within Groups) - because it is fundamental to the meaning of a risk score and ensures the tool is equally reliable for all groups.

  A tier: Equalized Odds and Equal Opportunity - because they address error rate disparities, which are central to discrimination concerns.

  B tier: Conditional Statistical Parity - because it refines statistical parity by accounting for legitimate factors, but still may not align with outcome fairness.

  C tier: Statistical Parity and Treatment Equality - because they are not robust to base rates and do not track outcome fairness well.

  D tier: Individual Fairness and Counterfactual Fairness - because they are impractical for a regulatory standard.

  But note: Equal Opportunity is a relaxation of Equalized Odds and might be more achievable and still addresses a key harm (false negatives). So we might put Equal Opportunity in A and Equalized Odds in A as well, but note that EO is stronger.

  However, in the pretrial context, Equal Opportunity (equal FNR) might be more important because false negatives (releasing a high-risk individual) are a public safety concern and false positives (detaining a low-risk individual) are an individual harm. But both are important. 

  But the question is which single criterion to choose. Given the impossibility, we cannot have both. So if we choose one, calibration is the most fundamental for a risk tool. Then, for error rates, we might choose either EO or EqOpp. However, EqOpp is more focused and might be more practical.

  But let's consider: the original impossibility result shows that we cannot have calibration and equal error rates (both FPR and FNR) at the same time. So if we choose calibration, we are giving up on equal error rates. If we choose equalized odds, we are giving up on calibration. 

  In the pretrial context, calibration is critical because the risk score is used to inform decisions about the level of risk. If the tool is not calibrated, then a judge might be misled: for example, a 40% risk score might mean different actual risks for different groups. This undermines the tool's purpose.

  Therefore, calibration (predictive parity) is the top choice.

  For the bottom, counterfactual fairness and individual fairness are the least practical.

  Now, for the tier list:

  S: [ "Predictive Parity" ]
  A: [ "Equal Opportunity", "Equalized Odds" ]   # Note: Equalized Odds implies Equal Opportunity, so they are related. But we list both as A because they are both strong on error parity.
  B: [ "Conditional Statistical Parity" ]
  C: [ "Statistical Parity", "Treatment Equality" ]
  D: [ "Individual Fairness", "Counterfactual Fairness" ]

  But note: Equalized Odds is strictly stronger than Equal Opportunity. So if we are to pick one, we might prefer Equal Opportunity because it is a more focused criterion and might be easier to achieve? But the question is about the standard, not ease. Both are important.

  Alternatively, we might put Equalized Odds and Equal Opportunity in the same tier.

  Also, note that Treatment Equality is not commonly used and might be less important.

  Let's finalize the tiers:

  - S: Predictive Parity (because it is essential for the tool's validity)
  - A: Equalized Odds and Equal Opportunity (because they directly address error rate disparities, which are core to discrimination in decisions)
  - B: Conditional Statistical Parity (it's a more reasonable version of statistical parity)
  - C: Statistical Parity and Treatment Equality (they are flawed but sometimes used)
  - D: Individual Fairness and Counterfactual Fairness (too theoretical and impractical)

  But wait: in the COMPAS case, the two sides were arguing about calibration (Northpointe) and error rates (ProPublica). So both are important. But if we have to pick one as the standard, calibration is more fundamental for a risk tool.

  However, some argue that in criminal justice, we should care about error rates because they directly translate to harms (unnecessary detention vs. avoidable crimes). 

  But the risk tool is intended to provide accurate risk estimates. Judges then make decisions based on those estimates. If the estimates are calibrated, then the judge can factor in the base rates and set thresholds appropriately. Therefore, calibration is necessary for the tool to be used fairly.

  On the other hand, if the tool is calibrated, then the error rates (FPR, FNR) will differ if the base rates differ. That might be acceptable if we believe the base rates reflect reality. But if we believe the base rates are themselves the product of discrimination, then we might want to equalize error rates.

  This is a normative choice. However, for the purpose of the tool, calibration is more about the tool's accuracy, and error rates are about the decision thresholds. Since the tool is only providing a score, calibration is more directly under the control of the tool developer.

  Therefore, we stick with Predictive Parity in S.

  For the bottom, Counterfactual Fairness and Individual Fairness are clearly the least practical.

