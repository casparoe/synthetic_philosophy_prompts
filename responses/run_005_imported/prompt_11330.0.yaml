prompt: |-
  So I've been the Dungeon Master for my friend group's D&D campaign for almost two years now and I'm pretty burnt out, but every time I bring up stepping back, at least one person acts like I'm abandoning ship. Here's what's bugging me: I never actually agreed to be "the DM" in any real sense. It started as a one-shot I offered to run because we were bored one weekend, then people just started asking "so when's the next session," and saying yes each time felt easier than explaining why not, and eventually there was a whole campaign with character backstories and a group chat named after my villain. When I said last week that I wanted to take an indefinite break, one friend said, almost word for word, "you can't just quit on us, we're in this together," like I'd broken some promise, even though I can't point to a single moment where I actually promised anything.

  My partner, who's never even met these people, just said "well, did you say yes to being the DM or not, its really not that complicated," but that doesn't feel right either - it kind of feels like something real got built here even without anyone ever formally agreeing to it, and now I don't know if that "something" is a real obligation or just my friends being dramatic. Am I actually on the hook for this campaign in some way, even though there was no single moment I signed up for it, and if I am, what would actually be the fair way to step back rather than just ghosting the group chat?
reasoning: |-
  Okay, let me unpack this user's situation. They've been DMing for two years without formally agreeing to it, starting from a one-shot that organically became a campaign. Now they're burnt out, but friends react negatively when they mention stepping back. The partner's "just say yes or no" perspective oversimplifies it - the user feels real social weight exists despite no explicit promise.

  Hmm... this is classic emergent obligation. The key conflict is between the user's mental health needs and the group's perceived social contract. The friend's "we're in this together" comment reveals they view this as a mutual commitment, while the user never consciously took that on. 

  The core issues seem to be: 
  1) The ethical weight of tacit agreements (can you be bound by inertia?)
  2) How to navigate social fallout when exiting a role you didn't formally accept
  3) Distinguishing between guilt (I disappointed them) and actual obligation (I owe them)

  Noticing the user mentions ghosting as their feared alternative - that suggests they care about these relationships and want to exit ethically. Good sign. The group chat named after the villain shows deep investment, which makes disengagement harder.

  I should emphasize that burnout trumps "obligation" here. No D&D is better than bad D&D, especially when the DM is miserable. But the delivery matters - framing it as "I can't continue" rather than "I won't" might soften the blow. 

  Also worth considering: Could someone else DM? The user might feel less guilty suggesting that. The "indefinite break" phrasing is smart - leaves room for return without commitment. 

  Biggest risk is the friend who takes it personally. Might need to validate their disappointment while holding the boundary: "I know this disrupts plans, and that sucks, but my energy is gone." No apologies for self-care.
answer: |-
  You're not obligated to continue as DM, but you're right that social expectations have formed organically. Here's how to navigate this ethically without burning out or ghosting:

  **The Reality Check:**
  1.  **No Formal Contract ≠ No Feelings:** While you never signed a "DM contract," your consistent "yes" built genuine investment and excitement. Your friends' reaction ("you can't quit on us") stems from that emotional investment, not a broken promise.
  2.  **Burnout is Valid:** DMing for two years is a massive creative and emotional effort. Burnout is inevitable without breaks or rotation. Your need to step back is legitimate and necessary.
  3.  **"The DM" Isn't a Life Sentence:** The role isn't inherently permanent. Groups evolve, circumstances change. Healthy campaigns adapt.

  **Why You're Not "On the Hook" Morally:**
  *   **Consent is Ongoing:** Saying "yes" to one session doesn't obligate you to the next, let alone years. Consent can be withdrawn.
  *   **Unilateral Burden:** The work, prep, and mental load fall almost entirely on you. It's unreasonable for others to demand you continue when depleted.
  *   **Changed Circumstances:** What started as a casual one-shot became a major commitment. It's fair to reassess.

  **How to Step Back Fairly (Without Ghosting):**

  1.  **Schedule a Dedicated Group Talk:** Don't drop this in the regular chat. Say: *"Hey team, can we schedule 30 mins this week (video/voice) to talk about the campaign's future? I need to discuss my capacity."* This signals importance.
  2.  **Be Direct, Clear & Compassionate:**
      *   **Acknowledge Their Investment:** *"I know how much you've all invested in your characters and the story. I've loved seeing that enthusiasm and building this world with you."*
      *   **State Your Reality Clearly:** *"After two years of DMing, I'm completely burnt out. The creative energy and prep time I need just aren't there anymore. I need to step back as DM."*
      *   **Emphasize "Need" not "Want":** Frame it as an energy/health issue, not a choice against them. *"This isn't about not wanting to play with you all; it's about me hitting a wall and needing to recharge."*
      *   **Use "Indefinite Break":** This is perfect. *"I need to take an indefinite break from DMing. I don't know if or when I'll be ready to pick this campaign back up."*
  3.  **Address the "In This Together" Comment Proactively:** *"I understand the feeling of 'we're in this together,' and I've loved that collaboration. The reality is, the DM role carries a unique burden. Continuing when I'm burnt out wouldn't be fair to me or lead to good sessions for you."*
  4.  **Offer Pathways Forward (Be Open, But Don't Own Them):**
      *   **Rotation/Pause:** *"Would anyone be interested in trying their hand at DMing? We could run some one-shots, start a new short campaign, or even continue this world if someone feels up to it? I'd love to just be a player for a while."*
      *   **Hiatus & Revisit:** *"We could put the campaign on hold entirely for now. Maybe in a few months, we can check in and see if anyone feels inspired to run something – whether it's continuing this or starting fresh."*
      *   **Ending the Campaign:** *"If no one else wants to DM and a long hiatus doesn't work, it might be time to consider this campaign concluded for now. We can have a final session to wrap up loose ends if you'd like, or just talk about where you imagine your characters ended up."* (Only offer a final session if YOU have the energy for *one* more).
  5.  **Hold Your Boundary Firmly (Key!):**
      *   **"No" is a Complete Sentence:** You don't owe lengthy justifications beyond stating your burnout.
      *   **Avoid JADE (Justify, Argue, Defend, Explain):** Don't get drawn into debates about fairness or obligation. *"I understand you're disappointed, and I'm sorry this is disruptive, but my decision is final. I cannot continue as DM."*
      *   **Manage Guilt:** Their disappointment is natural, but it doesn't mean you're doing something wrong. Prioritizing your well-being is essential.
      *   **Suggest Next Steps:** *"Let's take a week to think about the options I mentioned (rotation, hiatus, ending). We can talk next [day] about what feels best for the group moving forward."*

  **What If They Push Back Hard?**

  *   **Repeat Your Boundary Calmly:** *"I hear you're upset, and I wish it were different, but I cannot DM anymore. My energy is gone."*
  *   **Shift Focus:** *"The question now is how *we* as a group want to proceed without me as DM. Do any of the options I mentioned appeal?"*
  *   **Disengage if Needed:** If it becomes hostile or overly guilt-tripping: *"I've explained my situation. I need to step away from this conversation for now. Let's revisit the options for the group in a few days when emotions are cooler."*

  **The Core Message:** You built something wonderful together, but the role you played within it has become unsustainable *for you*. Stepping back is not abandonment; it's acknowledging reality. A fair exit involves clear, honest, compassionate communication about your needs, offering potential paths forward for the *group* (without taking ownership of them), and firmly holding your necessary boundary. True friends will respect your need for self-care, even if they're disappointed. If they don't, that reflects on them, not on your right to stop burning out.
