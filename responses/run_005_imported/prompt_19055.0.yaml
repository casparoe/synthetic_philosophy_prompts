  The key in two-player games is that when Player 1 eliminates a strategy, they assume Player 2 is rational and won't play dominated strategies. But Player 1's beliefs about Player 2's strategies must be consistent with Player 2's beliefs about Player 1. Since there are only two players, Player 2's beliefs only concern Player 1's actions. So when Player 1 eliminates a strategy, it informs what Player 2 might believe, creating a mutual consistency loop. That's why both concepts align here.

  Now, with three players, things get messy. Player 1's beliefs now include beliefs about Players 2 and 3. The issue is that Player 1 might assume Players 2 and 3 are rational but not that their beliefs about each other are consistent. For example, Player 1 could believe Player 2 thinks Player 3 will play a strategy that's actually dominated, but Player 3 wouldn't play it because they're rational. This inconsistency in beliefs across players allows strategies to survive rationalizability that IESDS would eliminate. The user needs a concrete example to see this, like the one with three players where a strategy isn't dominated but isn't a best response to plausible beliefs.

