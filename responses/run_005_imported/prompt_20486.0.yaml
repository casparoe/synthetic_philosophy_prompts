answer: |-
  Based on Hobbes's core philosophical commitments, particularly the *source* of geometry's certainty for him, he would most plausibly have seen non-Euclidean geometries and Hilbert's formalism as **demolishing the physical, motion-generated foundation** of geometry, rather than a vindication of his nominalism. Here's the argument, engaging directly with the tension:

  1.  **The Primacy of Generative Materialism over Nominalism:** While Hobbes was indeed a nominalist (holding that mathematical terms are names, not references to Platonic forms), his unique claim to *certainty* for geometry stemmed fundamentally from its **materialist generative process**. Geometry wasn't certain *just* because we named things arbitrarily; it was certain because we *constructed* its objects physically (in conception) through motion. The definitions ("A line is the way of a point...") weren't merely nominal; they were *operational instructions* grounded in the physics of motion. The causal chain – point moves *causing* a line to exist – was the bedrock of truth. Nominalism was a necessary *part* of this system (rejecting innate ideas/Platonism), but the *certainty* came from the concrete, causal generation. His feud with Wallis wasn't *just* about symbols vs. things; it was about *empty* symbols versus symbols representing concretely generated figures. Wallis's symbols, for Hobbes, lacked the causal, constructive grounding.

  2.  **Non-Euclidean Geometries: Undermining the Unique Truth of Generated Space:**
      *   **Challenge to Materialist Foundation:** Hobbes believed Euclidean geometry described the *actual, unique* spatial structure of the material world, revealed through the generative process. Non-Euclidean geometries demonstrate that the parallel postulate (and thus the specific properties Hobbes took as fundamental truths derived from generation) is *not* necessary. The "space" generated by moving points/lines/surfaces in his way is just *one* possibility.
      *   **Nominalist Angle?** He *might* initially see this as nominalist: different sets of definitions/rules yield different "geometries." However, this misses his core point. His nominalism was tied to a *single, correct generative process* reflecting reality. Multiple consistent geometries sever the link between the generative process he described and *the* true description of space. It implies that the objects generated by his specific motions (point tracing line, etc.) do *not* uniquely define spatial reality. This directly attacks the source of certainty – the belief that this generation reveals necessary truths about the material world. The consistency of alternatives doesn't vindicate his nominalism; it demonstrates that his *specific materialist foundation* does not yield the unique truth he claimed.

  3.  **Hilbert's Formalism: The Ultimate Betrayal of Generative Causality:**
      *   **Eviscerating the Generative Core:** Hilbert's approach is anathema to Hobbes's core principle. Reducing "point," "line," and "plane" to undefined terms satisfying purely formal relations completely severs geometry from the *causal generation by motion* that was, for Hobbes, the *entire basis* of its meaning and certainty. Hilbert's famous quip about "tables," "chairs," and "beer mugs" would horrify Hobbes. It exemplifies the very "empty symbol-manipulation" he railed against in Wallis. The rigorous deduction remains, but the *source* of the rigor – the concrete, causal construction – is utterly discarded. Geometry becomes a game of symbols, devoid of the physical, generative content Hobbes saw as essential.
      *   **Nominalist Surface, Materialist Ruin:** Superficially, Hilbert's undefined terms look like extreme nominalism – words without inherent meaning. But Hobbes's nominalism was always *in service* of his materialism. The names referred to concepts *derived from* and *grounded in* the physical process of generation. Hilbert divorces the names *entirely* from any necessary physical or generative referent. For Hobbes, this wouldn't be nominalism vindicated; it would be the *annihilation of the connection between names and the physical generation* that gave those names their meaning and the whole system its certainty. It transforms geometry into the kind of abstract, non-causal symbol-play he despised.

  **Resolving the Tension: Why Materialism Trumps Nominalism Here:**

  The tension in Hobbes exists, but it's resolved by recognizing that **nominalism was the epistemological *framework*, while the materialist generative process was the *epistemological engine*.** He used nominalism to reject Platonic realism and innate ideas, clearing the ground. But the *positive account* of geometric knowledge, the reason it was certain *when other things weren't*, was entirely dependent on the causal, constructive process grounded in motion. The certainty flowed from the *act of generation*, not merely from the act of naming.

  **Conclusion:**

  Hobbes would see both developments as catastrophic for his philosophy of geometry:

  *   **Non-Euclidean Geometry:** Demonstrates that the specific spatial truths he believed were *necessarily* revealed by his generative process are not necessary at all. It undermines the claim that this process uniquely captures the structure of reality.
  *   **Hilbert's Formalism:** Severs geometry completely from the physical, causal generation that was its lifeblood. It reduces it to the very type of meaningless symbol manipulation he fought against with Wallis.

  While he might *acknowledge* a superficial resemblance between the multiplicity of geometries or the arbitrariness of terms and nominalism, this would be cold comfort. The *essence* of his position – that geometry's unique certainty arises from our causal construction of its objects through motion in the material world – would be utterly demolished by both. He would likely see these developments not as a vindication of his nominalism, but as a descent into the very kind of abstract, non-causal, foundationless mathematics he spent his life denouncing. His reaction would likely mirror his fury at Wallis, amplified: these later mathematicians had abandoned the true, physical source of geometric knowledge for empty formal games.
