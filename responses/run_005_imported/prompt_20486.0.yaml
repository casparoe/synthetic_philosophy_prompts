  Hilbert's approach removes any intuitive meaning, reducing geometry to formal relations. Hobbes despised Wallis's abstract methods, so Hilbert's substitution of "table" and "chair" would likely horrify him. But formally, it aligns with nominalism by treating terms as placeholders. Yet, without the causal generation, the certainty Hobbes valued is lost. His materialism required physical motion as the foundation, which Hilbert completely abandons.

