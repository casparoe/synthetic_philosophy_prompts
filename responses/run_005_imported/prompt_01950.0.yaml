  First, I need to recall judgment theories. These theories say emotions are judgments. The contradiction problem is obvious: how can someone judge something as safe and dangerous at the same time? The user wants a sophisticated judgment theorist's response. I remember that some theorists like Solomon or Nussbaum might handle this by distinguishing between different levels of judgment. Maybe the conscious, reflective judgment versus an automatic, prereflective one. That could resolve the contradiction by separating the types of judgments.

