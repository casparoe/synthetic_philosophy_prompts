  The user wants a dialogue between two people who know Kierkegaard's text well but have opposing views. One should argue that "the present age" directly describes today's online public, perhaps even more thoroughly. The other should contend that the mechanics don't survive the shift from print to internet, making the comparison only a loose resemblance. The dialogue needs precise use of Kierkegaard's concepts, real back-and-forth, and each character responding to the other's points.

