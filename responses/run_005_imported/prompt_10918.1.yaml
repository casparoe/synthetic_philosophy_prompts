answer: |-
  Here is a dialogue between two philosophers, **Dr. Evelyn Cairns** (defending the rationality of Sidgwick's psychical research) and **Dr. Leo Fawcett** (arguing it was a mistake), engaging deeply with the tensions in Sidgwick’s project:

  ---

  **Setting:** *A common room after a colloquium on Victorian philosophy. Coffee cups clutter a low table between worn leather armchairs.*

  **Dr. Evelyn Cairns:** Leo, your talk was sharp, but I think you dismissed Sidgwick’s psychical research too quickly. You called it a "quaint diversion." It wasn’t. For Sidgwick, it was a direct, even *necessary*, response to the Dualism of Practical Reason. If rationality fractures between egoism and benevolence, and no ethical axiom resolves it, where else could he turn but to the structure of reality itself?

  **Dr. Leo Fawcett:** Evelyn, I admire Sidgwick’s honesty about the dualism. But leaping from "I cannot reconcile two rational imperatives" to "therefore I must investigate table-tipping and ghost stories" is a *non sequitur*. No empirical fact about an afterlife—even if proven—could resolve a *normative* conflict about the *authority* of reason. Survival doesn’t entail justice. A selfish ghost is still selfish.

  **Cairns:** You’re missing his starting point. Sidgwick argues that for Utilitarianism to be rationally binding, it needs *harmony* between virtue and self-interest. He explicitly states that such harmony requires a "moral government" of the universe—a theistic postulate. He didn’t just *leap* to psychical research; he sought empirical evidence for that postulate. If personal survival and divine justice were verified, egoism and benevolence *converge*: virtue pays, literally eternally. That *is* a resolution.

  **Fawcett:** But *how* does survival verify cosmic justice? Sidgwick himself admitted the SPR’s findings were inconclusive. Even if we grant survival, what if the afterlife is amoral, or worse, unjust? The normative gap remains: *Why* should I prioritize the general good over my own eternal self-interest? Psychical research addresses *metaphysical* facts, not the *authority* of practical reason. It’s a category error.

  **Cairns:** Is it? Sidgwick’s ethics is grounded in rational intuitionism—self-evident truths discerned by reason. But if reason leads to irreconcilable conflict, it undermines reason itself. He needed evidence that reality is structured to *make rationality coherent*. Survival + divine justice isn’t just a fact; it’s a *condition for the possibility* of rational ethics. He wasn’t seeking arbitrary comfort; he was testing a *philosophical requirement* for systematic moral knowledge.

  **Fawcett:** And that’s where I see the desperation. The man who resigned his fellowship over the Thirty-Nine Articles—a model of intellectual integrity—spends 20 years chasing séances? It looks less like disinterested inquiry and more like a *substitute* for faith. He couldn’t accept the austere conclusion of his own ethics: that reason might lead to tragedy. SPR was a hedge against despair.

  **Cairns:** Despair? Perhaps. But not irrationality. Consider his *method*. Sidgwick and the SPR were hyper-skeptical. They debunked frauds like Eusapia Palladino. They demanded controls, witnessed experiments, published negative results. This wasn’t credulous ghost-hunting; it was Baconian induction applied to the fundamental question of ethical coherence. If the postulate is testable, why *not* test it? What’s the alternative? Resignation to chaos?

  **Fawcett:** The alternative is to accept that normative philosophy can’t be rescued by parlor tricks. Sidgwick’s rigor in SPR is admirable, but it’s rigor applied to the wrong question. The dualism isn’t about *what exists*; it’s about *what we ought to do*, even if existence is silent. By seeking salvation in ectoplasm, he sidestepped his own challenge: How do we live ethically when reason offers no guarantee of harmony? That’s the real work.

  **Cairns:** But don’t you see? For Sidgwick, the "guarantee" *is* metaphysical. If the cosmos lacks moral order, then practical reason *is* fractured. SPR wasn’t an evasion—it was an attempt to diagnose reality. A negative result *was* philosophically significant: if no evidence for cosmic justice exists, the dualism stands, and ethics is tragic. His persistence wasn’t weakness; it was courage to face the implications of his own system.

  **Fawcett:** Yet he died disappointed. No evidence satisfied him. That tells me something: the empirical project was doomed because the dualism is *internal to reason*. No fact can compel me to grant benevolence authority over egoism if I’m rationally self-interested. Sidgwick’s genius was spotting the problem; his flaw was thinking science could solve it. The gap isn’t in the cosmos—it’s in us.

  **Cairns:** Or perhaps it’s *both*. And Sidgwick, unlike us, dared to look outward *and* inward. His psychical research wasn’t a mistake—it was the tragic, honest effort of a man who refused to let ethics float free of reality. If that’s failure, it’s nobler than most successes.

  **Fawcett:** Honest, yes. But ultimately, a distraction from the harder task: building ethics without cosmic guarantees. We’re still wrestling with that chaos. Sidgwick’s ghosts haunt us because we’ve found no better answers.

  ---

  **Key Engagement Points Covered:**  
  1. **Defender (Cairns):**  
     - SPR as empirical test of a *necessary postulate* for ethical coherence.  
     - Methodological rigor (debunking fraud) as intellectual virtue.  
     - Survival + divine justice = convergence of egoism/benevolence.  
     - Negative results still advance philosophical clarity.  

  2. **Critic (Fawcett):**  
     - Facts ≠ norms: Survival doesn’t resolve *authority* of reason.  
     - SPR as psychological displacement for unbearable uncertainty.  
     - Sidgwick’s resignation over Thirty-Nine Articles contrasts with SPR’s quasi-faith.  
     - The dualism demands ethical, not metaphysical, resolution.  

  **Why This Works:**  
  - Each forces the other to confront weaknesses: Cairns must explain *why* facts matter to norms; Fawcett must acknowledge SPR’s disciplined skepticism.  
  - Sidgwick’s integrity (resigning fellowship) is used by both sides.  
  - Ends on unresolved tension—true to Sidgwick’s legacy.  

  This dialogue should help clarify your stance: Sidgwick’s psychical research was neither naive nor irrational, but whether it *could* succeed remains philosophically contested—exactly the richness your chapter needs.
