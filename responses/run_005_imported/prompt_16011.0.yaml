  2.  **Focuses on interpretation** (rhetoric, framing, motivations, potential biases/blind spots) rather than formal validity.
  3.  **Explicitly connects the philosophical concept (anti-psychologism/objectivity)** to the revealed worldview (purity/order/anti-pluralism).
