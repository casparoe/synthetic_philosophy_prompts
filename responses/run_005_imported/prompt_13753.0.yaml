  Finally, reinforcing that his prior beliefs (gut feeling) should update with new evidence, not override it. The 1/340 shifts the probability from the baseline risk (based on maternal age) to this new value. If his wife is younger, 1/340 might be higher than baseline, making it significant. Clarifying how baseline risk affects interpretation could alleviate some confusion.

