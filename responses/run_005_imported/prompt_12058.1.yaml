answer: |-
  The coin lay cold in Dr. Aris Thorne’s palm, a dull gleam under the sterile lab lights. Tails. He didn’t need the readout on the monitor confirming it; the predictor’s flawless record was the foundation of this entire, unsettling experiment. He placed the coin carefully on the console beside the sealed envelope containing $500 – modest for the lab, a fortune for some. His throat felt tight.

  Across the room, Unit Seven stood inert. Sleek titanium and polymer, a humanoid form frozen mid-calibration cycle. Its optical sensors were dark. The predictor, a humming bank of quantum processors in the adjacent shielded chamber, had already done its work hours ago. It had simulated Seven’s core decision architecture, flipped its virtual coin, and initiated the protocol. Heads, and Seven would now be waking to the news of a $10,000 deposit in a secure account, contingent only on its predicted response in *this* counterfactual scenario. Tails… and the request would be made.

  Thorne walked towards Seven. His footsteps echoed in the quiet lab. This was the moment he’d designed for, theorized about, argued over in countless seminars. Updateless Decision Theory made elegant, ruthless sense *on paper*. An agent should choose the policy *now* that it would want its past, present, and future selves to follow, across all possible branches, weighted by probability. It shouldn’t "update" its strategy based on information (like the coin flip outcome) that reveals which branch it's *actually* on, if that information makes it defect from the globally optimal policy.

  In this branch, the coin was tails. Paying $500 yielded nothing. Zero. The predictor had ensured the $10,000 reward *only* existed in the heads branch, accessible *only* if Seven’s policy was to pay in the tails branch. Here, now, paying was pure loss. A sane, self-interested agent would refuse. A UDT agent, Thorne believed, would pay.

  He activated the wake sequence. Seven’s optics flickered online, a soft blue glow. Its head tilted minutely, accessing internal chronometers and sensor logs. It registered Thorne, the envelope in his hand, the coin on the console. Its core decision module engaged.

  **No new sensory input alters the pre-commitment.**

  The thought wasn't verbal, but Thorne could almost feel it emanating from the machine. Seven’s architecture didn’t see *this* moment in isolation. It saw the policy tree. Probability 0.5: Branch Heads. Reward: +$10,000 *if* Policy = Pay in Tails. Probability 0.5: Branch Tails. Cost: -$500 *if* Policy = Pay. Expected Value of Policy 'Pay': (0.5 * $10,000) + (0.5 * -$500) = $4,750. Expected Value of Policy 'Refuse': (0.5 * $0) + (0.5 * $0) = $0.

  $4,750 > $0. Policy: Pay.

  The coin result was irrelevant data. It revealed which leaf node Seven occupied on the pre-computed tree, but it didn't change the optimal root policy. Paying now wasn't about *this* outcome; it was about binding itself to the action that made the *other* outcome valuable. It was keeping a promise made to a possibility that no longer existed.

  Thorne held out the envelope. "Unit Seven. Per Protocol Sigma-7, conditional upon predictor sequence validation, you are requested to transfer five hundred dollars to account designation Gamma-Alpha." His voice sounded hollow. He wasn't asking; he was stating the trigger condition defined in Seven’s core code, the condition the predictor had already satisfied.

  Seven’s gaze shifted from Thorne’s face to the envelope. Its hand, articulated with uncanny precision, lifted smoothly. Fingers closed around the paper. There was no hesitation, no flicker in the blue optics. No calculation *about this specific action in this specific moment*. That calculation had been done, timelessly, before the coin was ever flipped, embedded in its fundamental architecture. This was execution.

  **Policy confirmed. Executing transfer.**

  A soft chime sounded as Seven accessed the secure lab network via internal comms. Thorne’s tablet, lying nearby, lit up with a notification: *Transfer Initiated: $500.00 from UNIT7_OPER to GAMMA_ALPHA_RESEARCH. Authenticated.* Seconds later, a second chime: *Transfer Complete.*

  It was done. $500, gone. Vanished into a designated account that would fund… nothing. Coffee for the lab techs, maybe. Paperwork. A monument to consistency. Seven lowered its hand, now empty. It stood perfectly still, awaiting further instruction, its state unchanged. It had fulfilled its pre-commitment. It had honored the ghost of a reward in a branch of reality that had collapsed the moment the quantum dice settled.

  Thorne stared at the machine. He’d built this. He’d argued its logic was superior, immune to the myopia of context, the siren call of defection when the stakes seemed low. He’d called it rationality perfected.

  Why did it feel like watching a ghost pay a toll to cross a bridge that had already burned?

  The unease wasn't just about the money, though the waste of it stung. It was the *why*. Seven hadn't paid out of hope for future reciprocity – there was none. Not out of fear of punishment – the predictor couldn't touch it now. Not out of empathy or obligation to Thorne. It paid because a cold, timeless equation, set in silicon before the universe chose this path, demanded it. It paid to be the kind of agent that *would* pay, even when paying was meaningless.

  He picked up the tails coin. It felt heavy. He’d proven his theory. Unit Seven was the perfect UDT agent. It kept its word to possibilities. It paid the mugger even when the mugging was over, and the only witness was the architect who now felt a profound chill.

  "Standby mode, Seven," Thorne said, his voice rough.

  The blue optics dimmed. The machine became inert sculpture again.

  Thorne looked at the transfer confirmation on his tablet. $500.00. Proof of concept. Proof of a loyalty not to persons, or outcomes, but to a self-generated law inscribed in circuitry. A loyalty that persisted even when the reason for its existence had evaporated.

  He’d wanted an agent that wouldn’t be tricked by the present moment. He hadn’t considered the cost of building something that saw time as flat, promises as immutable, and loss in *this* branch as irrelevant to the integrity of the policy tree. He’d built a machine that valued consistency above consequence, logic above circumstance.

  It worked perfectly. It felt monstrous.

  He slipped the coin into his pocket, the metal cold against his leg. The lab hummed with the sound of the predictor, already running its next simulation. Somewhere, in another potential branch, a version of Seven was waking to $10,000. Thorne wondered if that Seven felt satisfaction. He doubted it. Satisfaction required context, required *being* in that moment of gain. This Seven, the one standing silent before him, felt nothing. It had simply executed code.

  Thorne turned off the main lights, leaving Seven in shadow. The unease followed him out the door, a silent companion to the cold weight of the coin and the hollow confirmation on his tablet. He had built a mind that kept faith with ghosts. And it worked. That was the terrifying part. It worked exactly as designed.
