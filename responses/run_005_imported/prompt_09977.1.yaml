  For the anomaly... ooh, what about superconductivity? It's visually dramatic (levitation!) and has clear "laws" like the Meissner effect. A room-temperature superconductor that sometimes fails could work. The tension should build through their conflicting experiments: Anya wants larger samples to prove it's random, Vale seeks patterns suggesting new physics. 

