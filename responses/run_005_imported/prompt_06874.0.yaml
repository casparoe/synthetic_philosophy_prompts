  The user also anticipates dodges—like "this isn’t a full moral theory"—so follow-ups must preempt that. Needs questions that force engagement, not retreat.  

  For the marginal cases problem, the guest might try excluding humans via species membership. But that risks circularity. Follow-up should highlight how "human" isn’t a moral category for Nozick—his ethics turn on rational agency.  

  For utility monster, the guest might say human preferences have intrinsic weight. Follow-up can ask how that’s different from valuing utility monsters’ preferences.  

