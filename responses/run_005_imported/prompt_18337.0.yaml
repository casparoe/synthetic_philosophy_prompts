answer: |-
  Here’s a toast that threads the needle: rigorous for the philosophers, moving for the family, and anchored in Lewis’s machinery without lecturing. It runs about 3.5 minutes when read aloud with warmth and pauses:

  ---

  **David Lewis Would Approve**  
  (Toast for [Friend’s Name] & [Partner’s Name])

  Alright, everyone. Raise your glasses. I’ve known [Friend’s Name] for years—we’ve debated everything from Kant to whether pineapple belongs on pizza—and when she asked me to make this toast "properly Lewisian," half of you thought, "That’s sweet," and the other half thought, "Oh no, not *common knowledge* again." Don’t worry. I promise: no payoff matrices, no subgame perfection. Just one good Schelling point joke later. Deal?

  David Lewis taught us that conventions aren’t laws of nature. They’re solutions to coordination problems—arbitrary, but *meaningful* because everyone knows everyone knows to follow them. Think driving on the right, or raising a glass to toast. We do it because it works, because it’s what we expect, and because it’s ours.

  But here’s what Lewis *really* got right: conventions aren’t top-down. They bubble up. They emerge. Watch any couple who’s been together a while, and you’ll see it: who texts first in the morning, whose family they visit on Christmas Eve, that weird nickname only *they* use. These aren’t negotiated in some grand summit. They’re selected, iteratively, through hundreds of tiny interactions. Like evolutionary game theory shows: small precedents gain salience. They stick because they *work for them*.  

  Which brings me to [Friend] and [Partner]. You two have built a universe of conventions. Some are practical—like your unspoken rule that [Partner] handles the spider-relocation services, while [Friend] deciphers the IKEA instructions. Some are poetic—like how you always save the last bite of dessert for each other. And yes, some are gloriously arbitrary: why *that* side of the bed? Why *that* song in the car? It could’ve been otherwise… but it isn’t. And that’s the point.  

  Ah, but here’s the objection—the one my brilliant friend tackled in her paper: "Lewis explains why we *do* conform, but not why we *ought* to!" Well, look at these two. The "ought" isn’t in the rule itself; it’s in the *common knowledge* that this arbitrary thing *matters* because the other person expects it, relies on it, treasures it. When [Partner] makes coffee exactly how [Friend] likes it—not because it’s objectively right, but because he *knows* she knows he knows—that’s not cold coordination. That’s love, playing out in real time.  

  And yes, the joke. Philosophers: remember when Lewis talks about salience solving coordination problems? Like two people finding each other in a train station by picking the obvious landmark? [Friend] and [Partner], your relationship is full of Schelling points. Like that time you got separated in a crowd and both instantly knew to meet… at the taco truck. Some might call it destiny. Lewis would call it "focal point equilibrium." I call it proof you speak the same secret language.  

  So here’s to the arbitrariness. To the small, strange, beautiful conventions that only make sense because you two built them together. To the thousands of tiny interactions—the dish-washings, the Netflix compromises, the "goodnight" texts—that selected for this: a partnership so resilient, so *obvious* to everyone who knows you, that it feels almost inevitable. But it isn’t. It’s chosen. Again and again.  

  Lewis gave us a framework where convention isn’t cynical—it’s how we build shared worlds without blueprints. And you two? You’ve built a world where the coffee is right, the spiders are relocated, and the love is common knowledge.  

  To [Friend] and [Partner]: may your conventions endure, your precedents stay salient, and your equilibrium be ever Nash—in the warmest, least-game-theory way possible. Cheers.  

  ---

  **Why This Works**  
  - **Lewis Machinery, Warmly Woven**: Common knowledge ("everyone knows everyone knows"), arbitrariness ("it could’ve been otherwise"), salience ("focal point equilibrium"), and precedent are all explicitly named but embedded in relatable examples (bed sides, nicknames, taco trucks).  
  - **Evolutionary Angle**: The "selected through hundreds of tiny interactions" and "small precedents gain salience" lines directly channel Skyrms/Lewis on emergent norms.  
  - **Arbitrariness Defused**: Framed as meaningful *because* it’s mutually recognized and tailored ("not cynical... how we build shared worlds"). The "gloriously arbitrary" examples are affectionate.  
  - **The Joke**: The taco truck as a Schelling point is genuinely funny to philosophers but just a cute couple anecdote to others.  
  - **Specificity**: References real quirks (spiders, IKEA, dessert bites) making it about *them*, not jargon.  
  - **Emotional Payoff**: The "shared world" and "chosen again and again" lines land for family, while philosophers nod at the "common knowledge → ought" resolution.  

  **Delivery Tip**: Smile at the philosophers during the joke and the "Nash" wink. Pause before "Cheers" to let the warmth settle. They’ll feel seen; her family will feel the love.
