  Here's a eulogy that honours your grandmother, her beliefs, her profession, and the spirit of Frank Ramsey's perspective, designed for comfort and resonance rather than academic rigour:

  ---

  **Eulogy for [Grandmother's Name]**

  Good morning. For those who don’t know me, I’m [Your Name], [Grandmother's Name]’s grandchild. Like many of you, I’m still finding my footing in a world that feels a little dimmer without her bright, clear presence. She was sharp, principled, and had a wonderfully dry wit – qualities many of you knew well, especially her actuarial colleagues. She understood numbers, risk, and the long view better than most.

  Grandma was a proud and unwavering atheist. She was very clear: she didn’t want this moment filled with notions of her watching over us from a ‘better place.’ That wasn’t her view. But equally, she was adamant we shouldn’t tip into the opposite idea – that her life, or any of ours, was insignificant in a vast, indifferent universe. She found that view just as hollow and, frankly, inaccurate.

  Her compass for navigating this came from an unlikely place: a young philosopher named Frank Ramsey, who wrote something nearly a century ago that resonated with her deeply for decades. He made a simple but profound observation. He said if you truly tried to draw the world *to scale*, including the immense distances of the stars, the page would be impossibly vast and utterly blank. Instead, he said, we draw the world *in perspective*. The stars become tiny points of light – maybe no bigger than threepenny bits, he wrote – so we can see the things that truly matter to *us*, here on this page: the house, the tree, the people we love.

  That’s how Grandma lived. She understood the cosmic scale – intellectually, she grasped the vastness. But she knew that wasn’t the scale on which meaning is found or life is lived. She focused fiercely on *this* page, on *this* perspective. Her meaning, her focus, her immense *value* was drawn in the richness of her relationships – with Mum, with all of us, with her friends, with her colleagues. It was drawn in her sharp mind, her quiet determination, her integrity, and yes, that wonderfully dry humour. She found depth, purpose, and joy right here, in the details of this life, on this human scale. The universe wasn't indifferent to *her*; it contained *her* remarkable life, her love, her impact on all of us.

  She loved the fact that Ramsey, the logician and economist, could also write so beautifully about perspective. And being an actuary, she particularly loved one of his drier economic lines, even if she knew its limitations: the idea of calculating the "present value at compound discount" of future benefits. She’d chuckle at that – the sheer practicality of it, even applied to something as intangible as meaning. And she’d note, with a wry smile, that Ramsey himself called the ethical discounting of future people’s welfare "ethically indefensible." That contradiction, she’d say, was *so* Ramsey – and so very human. It spoke to the complexity of holding big ideas while living fully in the present moment, just as she did.

  Grandma didn’t need the stars to be vast to feel wonder. She found it in a well-argued point, a complex calculation elegantly solved, the love of her family, or a perfectly timed witty remark. She didn’t need an afterlife to find profound meaning; she built it, day by day, in the perspective she chose – a perspective filled with connection, reason, integrity, and love.

  So today, as we feel the profound absence she leaves, let’s honour her by embracing that perspective. Let’s draw our world with *her* in the centre, because she mattered immensely. Let’s remember her sharp mind, her steadfast principles, her quiet strength, and the deep, enduring love she gave us all. Let’s find comfort not in distant heavens or cold voids, but right here, in the shared warmth of our memories, in the indelible mark she left on our lives, and in the ongoing value of the connections she cherished. That was her page, beautifully drawn. And we were all so fortunate to be part of it.

  Thank you, Grandma, for showing us how to see the world clearly, meaningfully, and with such love. We will miss you terribly.

  ---

  **Why this works:**

  1.  **Honours Her Beliefs:** Explicitly states her atheism and rejects both religious platitudes *and* nihilistic despair, exactly as she requested.
  2.  **Uses Ramsey's Core Move:** Explains the "perspective vs. scale" metaphor from "Epilogue" clearly and accessibly, directly linking it to how she lived and found meaning. The "threepenny bits" line is included naturally.
  3.  **Actuarial Touch:** Integrates the "present value at compound discount" line as a light, affectionate nod to her profession and her sense of humour ("she’d chuckle at that").
  4.  **The Ramsey Contradiction:** Weaves in the ethical point about discounting future welfare ("ethically indefensible") in a single, non-lecturing sentence, framed as a humanizing detail about Ramsey *and* a reflection of her appreciation for complexity ("so very human").
  5.  **Focus on Her Life & Impact:** The philosophy serves to illuminate *her* character, values, relationships, and the tangible impact she had. The comfort comes from celebrating her specific life and the love she generated.
  6.  **Comfort Through Meaning:** Provides comfort by affirming the *reality* and *significance* of her life, her choices, and her love within the human perspective she valued. It focuses on the warmth of shared memory and connection.
  7.  **Appropriate Tone & Length:** Respectful, warm, clear, avoids jargon. Should read comfortably within 5 minutes.
  8.  **Ends on Love & Memory:** Concludes by bringing it back to the human connection and the act of remembering her, which is the core meaning of the gathering.

  This eulogy uses Ramsey's insight not as an abstract concept, but as the lens through which your grandmother consciously lived a rich, meaningful, and deeply human life – exactly the comfort and celebration she would have wanted. Good luck on Saturday. She’d be proud of you for doing this.
