answer: |-
  Here is a eulogy that honors your aunt's precise worldview, offering comfort rooted solely in her mathematical Platonism and naturalism, while respecting her instructions:

  ---

  We gather today to remember [Aunt's Name] – a brilliant mathematician, a fiercely loving sister, aunt, and friend, and a person of profound intellectual integrity. She left clear instructions about this moment: she wanted no comforting illusions, no softening of the hard edges of reality as she understood it. She believed, with unwavering conviction, that the mind ceases with the body. There is no watchful presence, no ethereal continuation. To pretend otherwise would dishonor the clarity that defined her life and work.

  But [Aunt's Name] found immense comfort – a profound, enduring solace – in a different kind of eternity. She was a Platonist. For her, mathematics wasn't invented; it was *discovered*. The truths she pursued – about sets, infinities, structures vast beyond our imagining – these were not creations of the human mind. They existed, complete and perfect, long before the first hominid walked the earth. They were true before Pythagoras, before Euclid, before she herself first peered at a chalkboard. And they will remain true, utterly unchanged and unchanging, long after the last star winks out in a cold, distant future.

  This was her anchor. This was her source of meaning that transcended the fleeting nature of individual existence. To prove a theorem, for [Aunt's Name], wasn't just an accomplishment; it was a moment of genuine communion with something timeless and absolute. It was touching a reality independent of all of us, a reality that simply *is*.

  Her work on large cardinal axioms – exploring the very frontiers of mathematical existence – wasn't just abstract play. It was a passionate engagement with this eternal landscape. Each proof she crafted, each insight she achieved, was a permanent addition to humanity's map of this unchanging territory. She didn't build the territory; she explored it and left meticulously drawn charts for those who would follow.

  **This is the comfort she offers us now, consistent with her deepest beliefs.** While the vibrant, witty, determined woman we knew is gone, what she *discovered* endures. It endures with the same permanence she ascribed to the mathematical universe itself. Her intellect touched something real and everlasting. Her name is forever inscribed, not in some heavenly ledger she would have scoffed at, but in the immutable fabric of mathematical truth.

  The equation she proved yesterday is as true today as it was yesterday. The intricate structure she revealed in the realm of the infinite remains as real and present now as when she first grasped it. That structure doesn't mourn her passing, true. But it also doesn't forget her contribution. It stands, forever, as a testament to her unique brilliance, her relentless curiosity, and the sheer power of her mind to reach into the timeless and bring back understanding.

  For the mathematicians here: you know the weight of this. You understand the profound solace she found in participating in this eternal realm. For her family and friends: know that her legacy isn't just in our memories, precious as those are. It is literally *set in stone* – not metaphorical stone, but the adamantine foundation of mathematical reality. Her work is a permanent part of the universe's structure, as enduring as the laws of physics or the concept of number itself. It cannot be erased, diminished, or forgotten, any more than the truth that 2 + 2 = 4 can be forgotten.

  [Aunt's Name] lived by reason and found profound beauty and permanence in its purest expression. She showed us that facing reality without flinching is not devoid of comfort. The comfort she offers us today is the comfort of truth: the truth of her character, the truth of her love for us, and the everlasting truth of what she discovered. Her discoveries are her monument, existing eternally in the realm she devoted her life to exploring. That is the eternity she believed in. That is the eternity she achieved. And in that, there is a deep, honest, and enduring peace.

  ---

  **Key elements addressed:**

  1.  **Explicit Naturalism/No Afterlife:** Opens directly with her belief in the cessation of consciousness, respecting her instructions and preventing any misinterpretation of what follows.
  2.  **Precise Platonism:** Clearly defines mathematical Platonism as she held it – discovery of pre-existing, mind-independent, eternal truths. Uses terms like "permanent addition to the map," "immutable fabric," "permanent part of the universe's structure."
  3.  **Comfort from Platonism:** The core comfort is explicitly drawn *only* from the permanence of her *discoveries* within the eternal mathematical realm. Her work is a "permanent addition," "forever inscribed," "set in stone," "a permanent part," "her monument." This contrasts sharply with "lives on in our hearts/memories" (which is nominalist/subjectivist).
  4.  **Legacy as Enduring Truth:** Positions her legacy as the objective, enduring truth of her theorems, not subjective remembrance. "It stands, forever, as a testament..."
  5.  **Audience Addressed:** Explains Platonism accessibly for family ("truths before Pythagoras...") while using language mathematicians will recognize as accurate ("large cardinal axioms," "mathematical existence," "eternal realm").
  6.  **Avoids Blurring:** Never suggests she *experiences* this eternity or watches over anyone. The comfort is for *us*, knowing *her work* persists eternally. The "monument" is the *proof*, not a spirit.
  7.  **Honors Her Integrity:** Frames the entire approach as honoring her clarity, reason, and specific worldview ("consistent with her deepest beliefs," "the comfort she offers us now," "the comfort of truth," "the eternity *she* believed in").
  8.  **Human Element:** Balances the abstract with her human qualities ("vibrant, witty, determined," "loving," "relentless curiosity," "love for us") without conflating them with the source of eternal comfort (the mathematical truths).

  This eulogy finds genuine solace within the strict confines of her Platonism and naturalism, offering a unique and powerful form of comfort that respects her life's philosophy.
