  So I've been down a rabbit hole the last couple weeks. At work we've been going back and forth on whether to use a dependently-typed language for some verification tooling, which got me reading about the Curry-Howard correspondence, wich got me reading about intuitionistic logic, which is how I first ran into Michael Dummett's name -- the whole "meaning has to be tied to what you can in principle verify, so you don't get excluded middle for free" thing. Out of curiosity I looked up what else this guy wrote, and apparently in 2001 he put out a short book called "On Immigration and Refugees" arguing that the burden of proof should always be on a state to justify keeping someone out, never on the migrant or refugee to justify getting in, and that most of the reasons Britain actually gave for restricting entry back then were just racism wearing a policy costume. Total whiplash going from Frege and non-classical logic to that, so now I'm curious whether the actual argument holds up on its own, once you get past "well, obviously don't be racist."

  Here's what I want: an essay that treats this as a live, unresolved controversy rather than a foregone conclusion. Specifically, I want it to go up against the strongest version of the other side -- the "a country is basically like a club (or maybe a marriage?) and freedom of association means the existing members get to decide who joins, full stop" argument that guys like Christopher Wellman have made, which I gather is a more modern spin on Walzer's older "nations are like neighborhoods" line. I also read that Wellman has this move where a state can basically buy its way out of the obligation -- do enough for outsiders some other way (foreign aid, whatever) and that counts as having discharged the duty, so you still get to shut the border on the single neediest person on earth. I genuinely can't tell if that's a clever point or a total dodge, which is partly why I want your take.

  Please dont do the wishy-washy "there are good points on both sides!" thing -- actually defend a verdict, like you're arguing it out with a friend over beers, even if the verdict ends up qualified (something like "the presumption-of-entry side wins except when X" is totally fine, just don't leave it hanging). Lay out Dummett's actual position first for anyone who, like me two weeks ago, had no idea this book existed, before getting into who wins the fight. Aim for something like 700-900 words.
