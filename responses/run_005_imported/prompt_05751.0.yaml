prompt: |-
  I'm a retired experimental physicist (spent about three decades on particle detector data, lots of Bayesian statistics along the way), and since retiring I've gotten pretty into philosophy, especially anything with a formal or mathematical backbone -- decision theory, social choice theory, that sort of thing. Lately I've been working through Harsanyi's aggregation theorem: if individual preferences and the "social" preference both satisfy the von Neumann-Morgenstern axioms, and everyone being indifferent between two lotteries implies society is indifferent too, then social utility comes out as a weighted sum of individual utilities. Fine, I followed that part, and I get why people treat it as a formal argument for utilitiarianism of some sort.

  What's tripping me up is a follow-on issue I stumbled into (I think associated with names like Hylland and Zeckhauser, and later Mongin, though I could easily be misremembering who did what) about what happens once you drop the assumption that everyone -- individuals and the social planner alike -- shares the same probabilities over the relevant states of the world. Apparently if you insist on respecting "ex ante" Pareto (going along with whatever gamble everyone prefers by their own lights, using their own beliefs) you can end up forced into an option that every single person, once the uncertainty resolves, would say left them worse off than the alternative would have -- so the "unanimity" that justified the choice was in some sense fake, generated by people disagreeing about the facts rather than agreeing about what's good. Could you walk me through the mechanics of how that happens, ideally with a bare-bones example (two people, two states, nothing fancier than that) so I can actually see where the ex-ante and ex-post rankings come apart? And then I'd love to hear your take on what this is supposed to show about the bigger picture -- does it mean Harsanyi's theorem only really delivers an argument for utilitarianism when beliefs happen to be shared, or is there some other way of rescuing the result that I'm not aware of?
reasoning: |-
  We are going to construct a simple example with two individuals (Person 1 and Person 2) and two states of the world (State A and State B). We assume that each state occurs with some probability, but the individuals may have different beliefs about these probabilities.

  Let the two social alternatives be X and Y. We will define the utilities for each person in each state.

  Suppose the utilities are:

  In state A:
    Person 1 gets 1 under X and 0 under Y.
    Person 2 gets 0 under X and 1 under Y.

  In state B:
    Person 1 gets 0 under X and 1 under Y.
    Person 2 gets 1 under X and 0 under Y.

  So, we can represent the outcomes as:

          State A     State B
        +---------+---------+
  X     | (1, 0)  | (0, 1)  |
        +---------+---------+
  Y     | (0, 1)  | (1, 0)  |
        +---------+---------+

  Now, suppose that Person 1 believes that state A occurs with probability p and state B with probability 1-p.
  Person 2 believes that state A occurs with probability q and state B with probability 1-q.

  We assume that p and q are different. For example, let p = 0.9 (Person 1 thinks A is very likely) and q = 0.1 (Person 2 thinks A is very unlikely).

  Now, we compute the expected utilities for each person for alternatives X and Y.

  For Person 1 (using p=0.9):
    EU1(X) = p * 1 + (1-p) * 0 = 0.9
    EU1(Y) = p * 0 + (1-p) * 1 = 0.1

  So Person 1 prefers X (because 0.9 > 0.1).

  For Person 2 (using q=0.1):
    EU2(X) = q * 0 + (1-q) * 1 = 0.9
    EU2(Y) = q * 1 + (1-q) * 0 = 0.1

  So Person 2 also prefers X (because 0.9 > 0.1).

  Therefore, by ex-ante Pareto (since both prefer X to Y ex-ante), the social planner must choose X.

  Now, let's see what happens after the state of the world is revealed.

  Case 1: State A occurs.
    Under X: Person 1 gets 1, Person 2 gets 0.
    Under Y: Person 1 gets 0, Person 2 gets 1.
    So in state A, Person 1 is better off with X, but Person 2 is worse off with X (since 0 < 1). 
    In fact, if state A occurs, then Person 2 would say that they are worse off than they would have been under Y.

  Case 2: State B occurs.
    Under X: Person 1 gets 0, Person 2 gets 1.
    Under Y: Person 1 gets 1, Person 2 gets 0.
    So in state B, Person 1 is worse off with X (0 < 1) and Person 2 is better off.

  Therefore, in state A, Person 2 is worse off with X (and would prefer Y), and in state B, Person 1 is worse off with X (and would prefer Y). 

  In other words, no matter which state occurs, one person ends up worse off than they would have been under Y. And crucially, that person (the one who is worse off) would say, after the fact, that they wish Y had been chosen. 

  This is the conflict: ex-ante, both preferred X, but ex-post, there is always one person who is unhappy and would have preferred Y.

  Now, let's consider the ex-post perspective. After the state is known, we can look at the utilities in that state. 

  In state A:
    X gives (1,0) and Y gives (0,1). There is no Pareto dominance: Person 1 prefers X, Person 2 prefers Y.

  In state B:
    X gives (0,1) and Y gives (1,0). Again, no Pareto dominance: Person 1 prefers Y, Person 2 prefers X.

  So ex-post, there is no Pareto dominance between X and Y in either state. However, the key point is that in each state, one person is worse off under X than under Y. 

  The problem arises because the ex-ante Pareto principle (based on expected utilities with differing beliefs) led to a choice that, in every state of the world, leaves one person worse off than the alternative. This is the sense in which the ex-ante unanimity is "fake": it is driven by the disagreement in beliefs, and when the state is revealed, the outcome is not actually unanimously preferred.

  Now, to your broader question: what does this imply for Harsanyi's aggregation theorem?

  Harsanyi's theorem assumes that everyone (including the social planner) shares the same probabilities. In that setting, the weights in the weighted sum of utilities are fixed and the social utility is a linear combination of individual utilities. The theorem then implies that the social preference is represented by a weighted sum of individual utilities.

  However, when beliefs are not shared, the above example shows that if we try to apply an ex-ante Pareto principle (which requires respecting unanimous ex-ante preferences), we can end up with choices that are ex-post inefficient in the sense that they are not Pareto optimal in the realized state. Moreover, in the example, the ex-ante Pareto choice is ex-post dominated by the alternative in the sense that in each state, one person is worse off and no one is better off? Actually, in each state, one person is worse off and one is better off, so it's not dominated in the ex-post sense. But the problem is that the ex-ante unanimity does not reflect a common interest but rather a conflict of beliefs.

  So, the implication is that Harsanyi's theorem does not extend straightforwardly to the case of heterogeneous beliefs. The result only holds under the assumption of common beliefs. 

  There are several responses to this:

  1. One might argue that the ex-ante Pareto principle is inappropriate when beliefs differ. Instead, we should use ex-post Pareto. However, ex-post Pareto might be too weak (as in our example, it doesn't force a choice because there is no ex-post dominance). 

  2. Alternatively, one might try to reconcile the two by using a different social aggregation mechanism. For instance, the social planner might have their own beliefs and then aggregate using a weighted sum of expected utilities with respect to the social planner's beliefs. But then we lose the ex-ante Pareto principle because individuals might have different beliefs and hence different expected utilities.

  3. Another approach is to consider state-dependent social welfare functions. This leads to the concept of "ex-post aggregation" where we aggregate utilities in each state. However, without knowing the true probabilities, it's not clear how to do that. Moreover, if we use ex-post aggregation, then we might not respect ex-ante preferences.

  4. There is a literature on "Bayesian aggregation" or "agreement theorems" (like Aumann's) that suggests that if individuals are rational and have common priors, then they cannot agree to disagree. However, in our example, the individuals have different priors, so that doesn't apply.

  In summary, the example shows that with heterogeneous beliefs, the ex-ante Pareto principle can lead to choices that are ex-post suboptimal in the sense that they are not what the individuals would want after the fact. This suggests that Harsanyi's theorem, which relies on common beliefs, does not provide a foundation for utilitarianism when beliefs are not shared. 

  Therefore, if we want to extend Harsanyi's result to cases with differing beliefs, we must either abandon the ex-ante Pareto principle or find a different way of aggregating preferences that respects both the individuals' beliefs and the social planner's beliefs. The literature has explored both paths, but there is no universally accepted solution.

  One notable approach is due to Mongin, who showed that under certain conditions, the only way to satisfy both ex-ante Pareto and state-wise dominance (a form of ex-post rationality) is to have a common prior. In the absence of a common prior, we must give up one of the principles.

  In practice, this means that the Harsanyi theorem is robust only when there is agreement on probabilities. Otherwise, we face a dilemma between respecting ex-ante unanimity and ensuring that the social choice is ex-post acceptable.

  I hope this helps clarify the issue. Let me know if you have further questions.
answer: |-
  Let's break this down step by step, starting with a minimal example illustrating the conflict between ex-ante and ex-post Pareto efficiency under belief disagreement. We'll use two individuals (Alice and Bob) and two states of the world (Rain and Shine). The social planner must choose between two alternatives: **Option X** and **Option Y**.

  ### Step 1: Define Utilities and Beliefs
  - **Utilities** (state-dependent, identical for both individuals):  
    - If **Rain** occurs:  
      - Option X → Alice gets **1**, Bob gets **0**  
      - Option Y → Alice gets **0**, Bob gets **1**  
    - If **Shine** occurs:  
      - Option X → Alice gets **0**, Bob gets **1**  
      - Option Y → Alice gets **1**, Bob gets **0**  

  - **Beliefs** (subjective probabilities):  
    - Alice believes Rain is **very likely** (P(Rain) = 0.9, P(Shine) = 0.1).  
    - Bob believes Shine is **very likely** (P(Shine) = 0.9, P(Rain) = 0.1).  

  ### Step 2: Calculate Ex-Ante Utilities
  Using each individual's beliefs to compute expected utilities:  
  - **Alice's ex-ante utilities**:  
    - EU<sub>A</sub>(X) = (0.9 × 1) + (0.1 × 0) = **0.9**  
    - EU<sub>A</sub>(Y) = (0.9 × 0) + (0.1 × 1) = **0.1**  
    → Alice **prefers X**.  

  - **Bob's ex-ante utilities**:  
    - EU<sub>B</sub>(X) = (0.1 × 0) + (0.9 × 1) = **0.9**  
    - EU<sub>B</sub>(Y) = (0.1 × 1) + (0.9 × 0) = **0.1**  
    → Bob **prefers X**.  

  **Ex-ante Pareto conclusion**:  
  Both prefer X over Y. If the social planner respects ex-ante Pareto (i.e., "go with what everyone prefers using their own beliefs"), they **choose X**.

  ### Step 3: Evaluate Ex-Post Outcomes
  Now, consider what happens **after the state is revealed**:  
  - **If Rain occurs**:  
    - Option X → Alice gets **1**, Bob gets **0**  
    - Option Y → Alice gets **0**, Bob gets **1**  
    → Bob is worse off under X (he gets 0 instead of 1).  
  - **If Shine occurs**:  
    - Option X → Alice gets **0**, Bob gets **1**  
    - Option Y → Alice gets **1**, Bob gets **0**  
    → Alice is worse off under X (she gets 0 instead of 1).  

  **Ex-post reality**:  
  - In **every possible state**, one person is worse off under X than they would have been under Y.  
  - Both would agree ex-post that **Y would have been better for the "losing" person**, but neither alternative is ex-post Pareto dominant (since one always loses).

  ### Key Insight
  The ex-ante unanimity for X was **driven entirely by belief disagreement**:  
  - Alice preferred X because she thought Rain was likely (where she wins).  
  - Bob preferred X because he thought Shine was likely (where he wins).  
  Their agreement was an **illusion**—they never agreed on which state was desirable, only on the gamble. Once uncertainty resolves, the choice **always disappoints someone** who realizes their belief was wrong.

  ---

  ### Broader Implications for Harsanyi's Theorem
  This exposes a fragility in Harsanyi's argument for utilitarianism. Let's connect the dots:

  1. **Harsanyi's Premise**:  
     If (1) individuals and society have vNM-rational preferences, (2) beliefs are **common** (same probabilities), and (3) society respects ex-ante Pareto indifference, then social welfare is a **weighted sum of individual utilities**. This is often interpreted as a foundation for utilitarianism.

  2. **The Problem (Hylland-Zeckhauser/Mongin Paradox)**:  
     When beliefs differ, ex-ante Pareto can force choices that are **ex-post Pareto-inferior** in the sense that—after the fact—everyone realizes someone was harmed unnecessarily. This violates the spirit of "unanimity" and suggests Harsanyi's result **depends critically on shared beliefs**.

  3. **Rescuing Utilitarianism? Two Paths**:  
     - **Path 1: Insist on Common Beliefs**  
       Harsanyi's theorem holds, but only in scenarios with consensus priors (e.g., lab settings with agreed-upon risks). In real-world policy (where beliefs differ), it loses force.  
     - **Path 2: Ex-Post Aggregation**  
       Abandon ex-ante Pareto and aggregate utilities **after** uncertainty resolves. This avoids the paradox but requires specifying a social belief (e.g., "planner's prior" or "average beliefs"), which reintroduces arbitrariness. Utilitarianism then becomes **belief-relative**.  

  4. **Mongin's Critique**:  
     Philippe Mongin showed that with belief disagreement:  
     > *Ex-ante Pareto + Bayesian rationality ⇒ Social preferences depend on beliefs, not just utilities.*  
     This means Harsanyi's weights ($w_i$) would need to absorb belief differences, conflating **values** (utilities) with **epistemics** (beliefs). True "utility aggregation" becomes impossible without shared beliefs.

  ---

  ### Why This Matters for Philosophy
  - **Utilitarianism's Epistemic Burden**: The result forces a choice: either accept that utilitarianism requires unrealistic consensus on facts, or redefine it as an ex-post aggregation rule (losing its ex-ante decision-making appeal).  
  - **Conflict of Unanimities**: Ex-ante and ex-post unanimity can pull in opposite directions. This challenges theories (e.g., contractarianism) that rely on "hypothetical agreement" under uncertainty.  
  - **Formal Lesson**: Belief divergence creates tradeoffs between:  
    - *Ex-ante fairness* (respecting individuals' own assessments)  
    - *Ex-post efficiency* (avoiding outcomes where someone is needlessly worse off).  

  Your physics intuition might recognize a parallel: just as quantum measurements collapse superpositions, resolving uncertainty collapses illusory ex-ante agreements into ex-post conflicts. The formalism shows that **utilitarianism lacks Lorentz invariance**—it's not invariant under belief transformations.  

  Would you like to dive deeper into Mongin's resolution attempts or explore a numerical example with social welfare weights?
