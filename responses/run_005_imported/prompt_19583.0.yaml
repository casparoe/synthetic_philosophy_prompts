prompt: |-
  Last night a friend and I got into a long argument about Arrow's impossibility theorem, specifically the Independence of Irrelevant Alternatives (IIA) condition. Her position was that IIA is really just the ordinary consistency requirement from individual rational choice theory — that removing an option nobody would have chosen anyway shouldn't reverse your preference between two options that remain — merely relocated from a single chooser to a social welfare function. My position was that this undersells what IIA does in Arrow's framework, since it constrains how the social ranking of a pair responds across different preference profiles, rather than how one fixed preference ordering behaves as the menu changes, and that this difference is exactly why the impossibility result is substantive rather than a truism. Neither of us could settle it. Could you compare Arrow's IIA with the independence and consistency conditions used in individual choice theory — for instance, Sen's properties α and β, or the Weak Axiom of Revealed Preference — and say precisely where Arrow's version is doing something stronger or different? I'd also like to understand, given that comparison, why a condition that sounds like plain consistency ends up disqualifying procedures such as the Borda count, which most people would consider perfectly reasonable.
reasoning: |-
  Okay, the user and their friend are debating Arrow's Impossibility Theorem, specifically the Independence of Irrelevant Alternatives (IIA) condition. The friend thinks IIA is just the standard consistency requirement from individual choice theory applied to social welfare. The user disagrees, arguing it's stronger due to constraining responses across different preference profiles. They want a detailed comparison between Arrow's IIA and individual choice conditions like Sen's α and β, and why IIA disqualifies methods like Borda count.

  First, I need to recall the key differences. Arrow's IIA deals with social welfare functions, where the social preference over two alternatives depends only on individual preferences over those two. This is a cross-profile condition. In contrast, Sen's α and β are intra-profile for individual choices, ensuring consistency when options are added or removed from a menu.

  I should explain Sen's properties. Property α (Chernoff) states that if an option is chosen from a larger set, it should also be chosen from a smaller subset containing it. Property β says if two options are chosen from a set and the set expands, both should still be chosen if still preferred. These are about menu changes with fixed preferences.

  Arrow's IIA is different because it requires that if individual preferences over two alternatives are the same in two different profiles, the social preference must be the same, regardless of other alternatives. This cross-profile restriction is why it's stronger. It prevents social choices from being influenced by the positions of irrelevant alternatives in individual rankings, which is exactly why Borda count fails—it relies on the entire ranking to assign points.

  The user also wants to know why IIA disqualifies reasonable procedures like Borda count. Borda count aggregates total points based on ranks, so adding a new alternative can shift the relative rankings of existing ones. For example, adding a candidate that splits votes can change who wins between two others. Under IIA, since individual preferences between the original two haven't changed, the social choice should remain the same. But Borda count can reverse it, violating IIA.

  I need to make sure the explanation clarifies the difference between intra-profile (fixed preferences, changing menus) and cross-profile (fixed pair, changing overall preferences). Highlighting that IIA's cross-profile nature is what makes it stringent and leads to impossibility when combined with other reasonable conditions. Also, emphasize that while Borda count seems intuitive, it violates IIA precisely because it considers more than just the pairwise preferences, which is necessary for its method but conflicts with IIA's requirements.
answer: |-
  Your friend's analogy is understandable but ultimately misleading—Arrow's IIA is fundamentally different and stronger than standard consistency conditions in individual choice theory. The confusion arises because both involve "irrelevant alternatives," but they operate in distinct mathematical frameworks with different constraints. Here's a precise breakdown:

  ### 1. **Individual Choice Consistency: Sen's α and β (Revealed Preference)**
     * **Context:** Fixed preferences over a universal set of alternatives. We observe choices from different *menus* (subsets) of alternatives.
     * **Sen's α (Chernoff Property):** If alternative `x` is chosen from set `S`, and `x` is in a smaller subset `T ⊆ S`, then `x` must be chosen from `T`.
       * *Interpretation:* Removing unchosen alternatives shouldn't make a chosen alternative unchosen.
       * *Example:* If you choose coffee from {coffee, tea, soda}, you must choose coffee from {coffee, tea}.
     * **Sen's β:** If `x` and `y` are *both* chosen from set `S`, and `S` is expanded to `T` (with `S ⊂ T`), then if *either* `x` or `y` is chosen from `T`, *both* must be chosen from `T`.
       * *Interpretation:* Adding new alternatives shouldn't change the relative status of two alternatives that were previously tied (both chosen).
       * *Example:* If you choose both coffee and tea from {coffee, tea}, and you add soda, then if you choose coffee from {coffee, tea, soda}, you must also choose tea.
     * **Nature:** These are **intra-profile conditions**. They constrain how choices from *different menus* must relate *given a single, fixed underlying preference ordering*.

  ### 2. **Arrow's IIA**
     * **Context:** A *Social Welfare Function (SWF)* that aggregates *any possible profile* of individual preference orderings into a social ordering.
     * **Condition:** The social ranking of any pair of alternatives `x` vs. `y` depends *only* on the individual rankings of `x` vs. `y` across all voters. Changes in individual preferences regarding *other* alternatives `z` (or changes to the set of alternatives) should have *no effect* on the social ranking of `x` vs. `y`, provided the individual rankings of `x` vs. `y` remain unchanged.
     * **Mathematical Statement:** For any two preference profiles `(≻₁, ..., ≻ₙ)` and `(≻'₁, ..., ≻'ₙ)`, and any pair `x, y`:
       If for every individual `i`, `x ≻ᵢ y ⇔ x ≻'ᵢ y` and `y ≻ᵢ x ⇔ y ≻'ᵢ x` (i.e., each individual's *relative ranking of x and y is identical* in both profiles),
       Then the SWF must rank `x` and `y` identically in the social ordering for both profiles: `x ≻ₛ y ⇔ x ≻'ₛ y` and `y ≻ₛ x ⇔ y ≻'ₛ x`.
     * **Nature:** This is a **cross-profile condition**. It constrains how the SWF behaves *across different preference profiles* when only preferences over "irrelevant" alternatives (`z ≠ x,y`) change, while preferences over `x` and `y` are held fixed.

  ### Key Difference: Intra-Profile vs. Cross-Profile
  * **Sen's α/β (Individual):** Fix the preference ordering. Change the *menu* (available options). Choices must be consistent across menus.
  * **Arrow's IIA (Social):** Fix the *pair* of alternatives `x,y`. Change the *entire preference profile* regarding alternatives *other than `x` and `y`*. The social preference over `x,y` must remain unchanged.

  ### Why Arrow's IIA is Stronger & Different
  1.  **Scope of Constraint:**
      *   Individual α/β constrain choices *within one preference ordering* as menus vary.
      *   Arrow's IIA constrains the SWF's output *across fundamentally different preference profiles* (potentially involving different orderings over all alternatives) as long as the pairwise `x,y` data is identical.
  2.  **Information Used:**
      *   A SWF satisfying IIA is **pairwise decomposable**. It constructs the entire social ordering *only* from pairwise comparisons, ignoring any information about *intensity* (how much `x` is preferred to `y`), *position* (rank of `x` vs. `z`), or *cardinality* inherent in the full preference orderings.
      *   Sen's α/β say nothing about how preferences are aggregated; they only describe consistency of choice *given* a fixed preference.
  3.  **Purpose:**
      *   Sen's α/β ensure the existence of a single underlying rational preference explaining choices across menus.
      *   Arrow's IIA aims to isolate the social ranking of each pair from potentially strategic manipulation via introduction/removal of alternatives and to ensure "local" determination. Its strength is crucial to the impossibility theorem.

  ### Why IIA Disqualifies Borda Count (and Seems Harsh)
  The Borda count assigns points based on rank positions: 1st place gets `n-1` points, 2nd gets `n-2`, ..., last gets `0`. Points are summed across voters, highest total wins.

  **Why it violates IIA:** The social ranking of `x` vs. `y` depends **crucially** on where `x` and `y` stand *relative to all other alternatives* `z` in each voter's ranking. Changing preferences over `z`, or adding/removing `z`, can *dramatically* alter the relative Borda scores of `x` and `y`, *even if every voter's ranking of `x` vs. `y` remains unchanged*.

  **Concrete Example:**
  *   **Profile 1:** Alternatives: `A, B, C`. 3 Voters.
      *   Voter 1: `A > B > C` (Borda: A=2, B=1, C=0)
      *   Voter 2: `A > B > C` (A=2, B=1, C=0)
      *   Voter 3: `B > A > C` (B=2, A=1, C=0)
      *   **Scores:** `A: 2+2+1 = 5`; `B: 1+1+2 = 4`; `C: 0`. **Social Order: `A > B > C`**.
  *   **Profile 2:** Preferences over `A` vs `B` are *identical* for all voters (V1: `A>B`, V2: `A>B`, V3: `B>A`). Now introduce `D`.
      *   Voter 1: `A > B > D > C` (A=3, B=2, D=1, C=0)
      *   Voter 2: `A > C > D > B` (A=3, C=2, D=1, B=0) *// V2 still prefers A>B, but now ranks B last!*
      *   Voter 3: `B > A > D > C` (B=3, A=2, D=1, C=0)
      *   **Scores:** `A: 3+3+2 = 8`; `B: 2+0+3 = 5`; `C: 0+2+0=2`; `D: 1+1+1=3`. **Social Order: `A > B > D > C`**.
  *   **The IIA Violation:**
      *   Individual rankings of `A` vs. `B` are *identical* in both profiles (V1: A>B, V2: A>B, V3: B>A).
      *   In Profile 1, `A` is socially preferred to `B` (`5 > 4`).
      *   In Profile 2, `A` is *still* socially preferred to `B` (`8 > 5`). *(Wait, isn't that consistent?)*
  *   **Crucial Twist - Removing `D`:** Consider the SWF applied *only to the set {A, B, C}* using the preferences from Profile 2 restricted to {A, B, C}:
      *   Voter 1: `A > B > C` (A=2, B=1, C=0)
      *   Voter 2: `A > C > B` (A=2, C=1, B=0) *// Note B is last now*
      *   Voter 3: `B > A > C` (B=2, A=1, C=0)
      *   **Scores:** `A: 2+2+1 = 5`; `B: 1+0+2 = 3`; `C: 0+1+0=1`. **Social Order: `A > B > C`**.
  *   **The Core Violation Revealed:**
      *   Preferences restricted to {A, B, C} in Profile 2 are **different** from Profile 1 (Voter 2 now has `A > C > B` instead of `A > B > C`). IIA *doesn't require* the social preference over {A, B, C} to be the same in Profile 1 and Profile 2 because the underlying individual preferences over {A, B, C} differ.
  *   **The Real IIA Failure:** Consider **Profile 3** with alternatives {A, B, D} and preferences *restricted* from Profile 2:
      *   Voter 1: `A > B > D` (A=2, B=1, D=0)
      *   Voter 2: `A > D > B` (A=2, D=1, B=0)
      *   Voter 3: `B > A > D` (B=2, A=1, D=0)
      *   **Scores:** `A: 2+2+1 = 5`; `B: 1+0+2 = 3`; `D: 0+1+0=1`. **Social Order: `A > B > D`**.
  *   **Compare to Profile 1 (A, B, C):** `A > B > C`.
  *   **The IIA Violation:** Focus *only* on the pair `A, B`.
      *   In **Profile 1** (set {A, B, C}), the *relative* ranking of `A` vs. `B` for each voter is: V1: A>B, V2: A>B, V3: B>A. SWF says `A > B`.
      *   In **Profile 3** (set {A, B, D}), the *relative* ranking of `A` vs. `B` for each voter is *identical*: V1: A>B, V2: A>B, V3: B>A. SWF says `A > B`.
      *   *Seems consistent?* **BUT:** IIA requires the SWF to produce the *same* social ranking of `A` vs `B` for **any profile** where the individual `A` vs `B` rankings match this pattern, **regardless of other alternatives or preferences over them.**
  *   **Profile 4 - The Killer:** Now consider a profile over the *full set* {A, B, C, D} where individual preferences over `A` vs `B` are *still identical* (V1: A>B, V2: A>B, V3: B>A), but preferences over `C` and `D` change arbitrarily. For example:
      *   Voter 1: `A > C > B > D` (A=3, C=2, B=1, D=0) *// Still A>B*
      *   Voter 2: `D > C > A > B` (D=3, C=2, A=1, B=0) *// Still A>B*
      *   Voter 3: `B > D > C > A` (B=3, D=2, C=1, A=0) *// Still B>A*
      *   **Scores:** `A: 3+1+0 = 4`; `B: 1+0+3 = 4`; `C: 2+2+1=5`; `D: 0+3+2=5`. **Social Order: `C ~ D > A ~ B`**.
  *   **The Violation:** The individual rankings of `A` vs `B` are identical to Profile 1, Profile 2, and Profile 3 (V1: A>B, V2: A>B, V3: B>A). However:
      *   In Profiles 1 & 3, SWF (Borda) says `A > B`.
      *   In Profile 4, SWF (Borda) says `A ~ B` (tie).
      *   **This contradicts IIA.** The social ranking of `A` vs. `B` changed (`A > B` to `A ~ B`) *even though every voter's relative preference for `A` vs. `B` remained exactly the same*. The change was caused *solely* by changes in preferences involving the "irrelevant" alternatives `C` and `D`.

  ### Why It Feels Unreasonable & Why It's Necessary for Impossibility
  *   **Feels Unreasonable:** Borda count seems sensible because it uses more information (full rankings) to make a decision, aiming for a more "comprehensive" view of aggregate preference. Disqualifying it because it uses this extra information feels overly restrictive. In many real-world contexts (like sports rankings), considering relative performance against the whole field is intuitive and desirable.
  *   **Necessary for Impossibility:** Arrow's theorem shows that *only* dictatorial SWFs satisfy IIA, Unanimity (Pareto), and Unrestricted Domain. IIA's strength is key:
      *   It prevents strategic manipulation by adding/removing alternatives (a major concern in social choice).
      *   It enforces that the SWF bases its decision *only* on ordinal pairwise data, ruling out any cardinal or positional methods (like Borda). This restriction, combined with the desire for non-dictatorship and respect for unanimity, creates the impossibility.
      *   Weaker conditions (like those only constraining menu changes *within a single profile*) wouldn't lead to an impossibility theorem with the same force. Many non-dictatorial rules (Borda, Plurality, Approval, STV) satisfy intra-profile consistency conditions analogous to Sen's α/β.

  **In Conclusion:** Your friend is correct that both concepts involve "irrelevant alternatives not affecting a choice/ranking," but the contexts are mathematically distinct. Arrow's IIA is a **cross-profile pairwise independence** condition constraining the *aggregation mechanism itself* across different possible worlds of preferences. Sen's α/β are **intra-profile menu independence** conditions describing the consistency of choices *given one fixed preference*. This cross-profile nature is what makes IIA so powerful (and restrictive), directly causing the impossibility result by forbidding the SWF from utilizing any information beyond the pairwise ordinal preferences over the specific pair being ranked. Borda count violates IIA precisely because it *does* use richer information (rank positions relative to all alternatives), which most people find reasonable but which Arrow's theorem shows is incompatible with his other axioms for a non-dictatorial SWF.
