  Hey, quick one for you — I'm putting together a lecture on Marx and want the intuition to be really crisp for my students. Ricardo and the other classical economists were sort of stuck on this: if labour is the source of value and everything (including labour) sells at it's true value, where's the profit supposed to come from? Marx's whole account of exploitation hangs on the labour vs. labour-power distinction supposedly dissolving that puzzle. Can you walk me through, in an intuitive gut-level way, how that distinction is doing the work — how a capitalist can pay a worker the full value of what hes buying and still walk away with a surplus, with no cheating at the point of exchange? I know the textbook-level answer already, but I want to actually feel why it's not just a verbal trick.
