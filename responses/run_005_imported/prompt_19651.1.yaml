prompt: |-
  I am drafting a historical novel with a subplot set in Ireland in the 1730s, in which a bishop modeled closely on George Berkeley debates a visiting English factor whose views on money come straight from Locke, and I want the underlying disagreement in clear view before I let them speak. Please compare Berkeley's account of money in The Querist with Locke's account of money in his writings on the 1690s recoinage debate, and tell me precisely where the two disagree about what gives a coin or a banknote its value. I would also like your judgment on a harder question: is Berkeley best understood as rejecting Locke's premises outright, or as drawing out a conclusion those premises were always vulnerable to? Please ground the comparison in the actual economic reasoning of the two texts rather than in Berkeley's immaterialism, on which the monetary argument does not obviously depend.
