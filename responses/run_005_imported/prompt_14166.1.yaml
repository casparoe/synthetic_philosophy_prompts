  Hmm... the user mentions having no formal philosophy background, so I should avoid jargon while still doing justice to the complexity. The core tension they're sensing is real - there's a century of philosophical debate packed into their question. 

  When looking at Darwin's text, I recall he was primarily establishing two things: 1) conscience as an evolved trait in social species, and 2) moral content being contingent on social instincts. That bee scenario was meant to shock Victorian readers into seeing morality's relativity. But crucially, Darwin wasn't making epistemological claims about justification - that's a modern philosophical layer.

  The user's spot-on about the inference problem: how does "belief X has origin Y" become "therefore doubt X"? That leap requires additional philosophical premises about justification and truth-tracking that Darwin wasn't addressing. Maybe I should emphasize that distinction - between descriptive origins and normative justification.

  They also seem to intuitively grasp the danger of anachronism here. The contemporary debunking literature (Joyce, Street etc.) builds on Darwin but adds sophisticated epistemology he never engaged with. I should flag how Darwin's own Victorian moral realism complicates painting him as a full moral skeptic.

  What the user might not realize is how hotly contested these interpretations are among scholars. Some read Darwin as proto-relativist, others as consistent realist. The passage is wonderfully ambiguous - which explains why both sides cite it! 

