prompt: |-
  Ok so this has basically taken over my friend group chat for like two weeks and I need someone outside the situation to weigh in. My friend Maya has been "talking" to this guy Ethan since September, and its been this slow build up: first it was just texting, then snapping every day, then he started saving her a seat at lunch, then they hung out one on one a few times, then he brought her along to hang out with his whole friend group at a party, and last week she found out he told his mom about her. They've never actually had the "so are we official" conversation, and Maya swears they're still just talking, not dating. Half my friends think that's crazy and they've obviously been a couple for like a month now, and the other half think its not really our place to say and that there's no clear moment where it flipped from one to the other anyway, so who even knows.

  It turned into this bigger argument about whether there's an actual true answer to when exactly they became a couple that we just don't have access to (like it really did happen on one specific day, we just can't know which one), or whether that's a broken way to even think about it and the question just doesn't have an answer, full stop. My TOK teacher walked past us arguing about this in the library, got this little smile, and said "that's actually a really good question," and then just left, which was extremely unhelpful of her. So who's actually closer to right here, the people who think there's a hidden fact of the matter, or the people who think the whole question is confused? And is there an actual principled way people have thought about settling disagreements like this, or is it really just a matter of opinion where nobody can be more or less correct?
