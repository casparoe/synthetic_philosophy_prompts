answer: |-
  You've hit on one of the most fascinating and debated arguments in contemporary philosophy – often called the "evolutionary debunking argument" against moral realism, and its implications for math/logic. Your analogy is sharp, and the tension is real. Let's break it down rigorously.

  ### Step 1: The Strongest "Evolution Undermines Morality" Argument (Debunking Moral Realism)
  Here's the core argument in its strongest form (associated with philosophers like Sharon Street and Richard Joyce):

  1.  **Premise 1 (The Evolutionary Origin):** Our core moral beliefs and intuitions (e.g., "murder is wrong," "helping kin is good," "cheating is bad") are heavily shaped by evolutionary pressures. Natural selection favored dispositions that promoted cooperation, kin altruism, reciprocity, and group cohesion within early human populations because these traits enhanced survival and reproduction. Groups with these tendencies outcompeted groups without them.
  2.  **Premise 2 (The Tracking Failure):** Evolution selects for traits based on *survival value*, **not** on *truth-tracking*. A belief or intuition that promotes survival (e.g., "I *feel* strongly that stealing from tribe members is wrong") will be selected for *regardless of whether that belief corresponds to some objective moral fact*. Feeling that murder is wrong kept groups stable; whether "murder is *actually*, objectively wrong in the fabric of the universe" is irrelevant to evolution.
  3.  **Premise 3 (The Independence Requirement):** For our moral beliefs to be likely true of *objective moral facts* (if such facts exist), there must be a reliable connection between those facts and our beliefs. This requires either:
      *   Evolution directly selected for *truth-tracking* of objective moral facts, or
      *   The evolutionary influence on our moral faculties was so weak or constrained that it allowed reliable truth-tracking to develop independently.
  4.  **Premise 4 (The Failure of Independence):** Premise 3 fails.
      *   Evolution didn't select for tracking objective moral truths; it selected for survival-enhancing feelings/behaviors (Premise 2).
      *   The evolutionary influence wasn't weak; it was the *primary* shaper of our core moral intuitions (Premise 1). These intuitions are the foundation of all moral reasoning.
  5.  **Conclusion (Moral Skepticism):** Therefore, even if objective moral facts *do* exist, we have no good reason to believe our evolved moral beliefs and intuitions are reliable guides to them. Our sense of morality is explained *entirely* by its survival benefits, not by its connection to truth. Thus, belief in objective moral facts is unjustified. Morality is "in our heads" – a useful evolutionary adaptation, not a discovery of objective truth.

  **The Core Punch:** Evolution gave us moral *feelings* that helped us survive, not moral *perception* tuned to objective truths. There's no reason to think our moral compass points to anything real "out there."

  ### Step 2: Applying the EXACT SAME Logic to Math & Logic
  Let's run the same syllogism:

  1.  **Premise 1 (The Evolutionary Origin):** Our core mathematical and logical beliefs and intuitions (e.g., "1+1=2," "objects persist," "contradictions are impossible," basic set recognition) are heavily shaped by evolutionary pressures. Natural selection favored cognitive abilities that allowed for tracking quantities (predators, food), spatial reasoning (navigation, tool use), avoiding contradictions (predicting outcomes consistently), and basic logic (inferring causes, planning) because these traits enhanced survival and reproduction. Individuals/groups with these abilities outcompeted those without them.
  2.  **Premise 2 (The Tracking Failure):** Evolution selects for traits based on *survival value*, **not** on *truth-tracking*. A belief or cognitive capacity that promotes survival (e.g., the *feeling* that "if there were 3 wolves, and one left, there must be 2 left") will be selected for *regardless of whether that belief corresponds to some objective mathematical or logical fact*. Believing 1+1=2 helps avoid starvation; whether "1+1 *actually*, objectively equals 2 in the abstract realm of numbers" is irrelevant to evolution.
  3.  **Premise 3 (The Independence Requirement):** For our mathematical/logical beliefs to be likely true of *objective mathematical/logical facts* (if such facts exist), there must be a reliable connection between those facts and our beliefs. This requires either:
      *   Evolution directly selected for *truth-tracking* of objective math/logic facts, or
      *   The evolutionary influence on our math/logic faculties was so weak or constrained that it allowed reliable truth-tracking to develop independently.
  4.  **Premise 4 (The Failure of Independence)?** Does this premise hold? *This is the critical juncture where the analogy might break down.*
      *   Evolution *didn't* select for tracking abstract mathematical truths (Premise 2 applies).
      *   The evolutionary influence was likely *strong* and *primary* for our *most basic* numerical and logical intuitions (Premise 1 applies).
  5.  **Potential Conclusion (Math/Logic Skepticism)?** Therefore, even if objective mathematical/logical facts *do* exist, we have no good reason to believe our evolved math/logic beliefs and intuitions are reliable guides to them. Our sense of math/logic is explained *entirely* by its survival benefits, not by its connection to truth. Thus, belief in objective math/logic facts is unjustified. Math/Logic is "in our heads" – a useful evolutionary adaptation, not a discovery of objective truth.

  **The Analogy Holds (So Far):** On the surface, the logic *is* identical. If it works for morality, it should work for math/logic. This is the "companions in guilt" argument: if evolution debunks morality, it must also debunk math and logic, leading to a radical skepticism most find implausible.

  ### Step 3: The Crucial Differences – Why Math/Logic Might Survive
  Here's where philosophers argue the cases come apart. The debunking argument against morality *succeeds* because of specific features of morality that math/logic *lack*:

  1.  **The Nature of the Truths & Our Access:**
      *   **Math/Logic:** The truths are *necessary* and *abstract*. 2+2=4 *must* be true in any possible universe where those concepts exist. Our cognitive faculties, *once evolved to grasp basic logic and set operations*, seem capable of *discovering* necessary truths through reason and deduction that go far beyond simple survival needs (e.g., calculus, transfinite numbers). Evolution gave us the *basic toolkit*, but the toolkit, when used rigorously (logic, proof), appears capable of accessing truths *independent* of its evolutionary origin. The truths constrain the reasoning process itself.
      *   **Morality:** Moral truths (if they exist) are typically conceived as *contingent* facts about how agents *ought* to behave. There's no clear, universally agreed-upon *method* like mathematical proof to access them that transcends our evolved intuitions. All moral reasoning *starts from* and is heavily influenced by those evolved feelings. We lack a reliable "moral perception" faculty independent of evolution.

  2.  **Evolutionary Pressures and Truth-Tracking:**
      *   **Math/Logic:** While evolution selected capacities for survival, **basic arithmetic and logic are areas where getting the *right answer* (the *true* answer) *was often directly survival-conducive**.* Miscounting predators *will* get you killed. Making invalid logical inferences about cause-and-effect (e.g., "this berry made me sick last time, so eating it now won't harm me") *will* get you killed. There's a strong argument that **natural selection *did* favor truth-tracking capacities for basic math and logic** precisely because accurate representation of these aspects of the physical world *was* adaptive. Evolution *could* have built reliable truth-trackers here.
      *   **Morality:** Evolutionary pressures shaped moral *feelings* to promote behaviors that *enhanced inclusive fitness within a specific social context*. Feelings like "care for kin," "reciprocity," "respect for hierarchy," "ingroup loyalty," "purity/sanctity" clearly boosted survival. **But there's no reason to think these feelings track objective moral truths.** They track fitness. Feelings condemning "cheating" promote stable cooperation within the group, but say nothing about objective wrongness. Feelings of "ingroup loyalty" were adaptive but can lead to objectively horrific xenophobia. The link between the feeling (selected for fitness) and any purported objective truth is arbitrary.

  3.  **The "How Possibly?" Question:**
      *   **Math/Logic:** We can plausibly explain *how* evolution *could* have given us reliable access to mathematical/logical truths: Getting the right answer boosted survival. The capacities it gave us (logic, abstraction) demonstrably allow us to discover complex, necessary truths far beyond the savanna.
      *   **Morality:** It's much harder to explain *how* evolution *could* have given us reliable access to objective moral truths. What causal link connects the abstract "moral fact" that, say, "torturing innocents for fun is wrong" to the evolutionary pressure that shaped our disgust/empathy responses? The fitness benefits of cooperation don't require the *truth* of moral facts, just the *feeling*.

  4.  **Consensus and Disagreement:**
      *   **Math/Logic:** While foundational philosophies differ (Platonism vs. Formalism vs. Intuitionism), there is overwhelming cross-cultural consensus on core mathematical and logical truths once concepts are understood. Disagreements are resolved by proof and demonstration.
      *   **Morality:** There is profound and persistent cross-cultural and intra-cultural disagreement on fundamental moral principles (e.g., scope of obligations, nature of the good, rights vs. duties), even among those using reason. This disagreement is more easily explained by differing evolutionary/cultural histories than by partial access to a single objective truth.

  **The Verdict (As You Requested):**

  There **is** a genuine, principled difference between the two cases. **The evolutionary debunking argument is significantly stronger against objective morality than it is against objective mathematics and logic.**

  *   **Why Morality is Vulnerable:** The link between the evolutionary origin of our moral *feelings* and any purported objective moral *truths* is entirely speculative and seems unnecessary. Evolution explains the feelings perfectly well without needing objective truths. The feelings were selected for fitness, not truth-tracking, and there's no clear independent faculty to access moral truths.
  *   **Why Math/Logic is Resilient:** While also shaped by evolution, there's a strong case that *for basic math/logic*, getting the *true* answer *was* directly adaptive. Evolution plausibly *did* select for truth-tracking capacities in this domain. Furthermore, the tools evolution gave us (reason, logic) demonstrably allow us to discover necessary truths that seem independent of our origins. The objectivity and necessity of math/logic feel inescapable in a way objective morality does not.

  **Therefore:** You *can* consistently hold that evolution debunks objective morality while *not* debunking objective mathematics and logic. The YouTuber's argument against objective morality stands as a serious challenge, while the same argument applied to math/logic faces much stronger counter-arguments based on the necessity of logical/mathematical truths, the adaptive value of getting the *right* answer in that domain, and the demonstrative power of reason to access truths beyond our origins. Biting the bullet on math isn't *required* by the logic of evolutionary debunking in the same way it seems to be for morality.
