  Then, Popper's recantation. In his 1978 lecture, he admitted that natural selection is testable. He cited examples like industrial melanism in moths. But he still saw it as a metaphysical framework, not a testable theory itself. His concession was that it generates testable hypotheses. So, the recantation is nuanced—natural selection as a core theory remains metaphysical, but its applications are testable.

