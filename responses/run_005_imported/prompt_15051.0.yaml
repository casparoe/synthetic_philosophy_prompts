answer: |-
  You've hit on one of the deepest and most fascinating debates in formal epistemology! Joyce's nonpragmatic vindication of probabilism is indeed a landmark, aiming to ground Bayesian coherence in pure epistemic accuracy rather than pragmatic betting concerns. But as you discovered, the devil is in the details of the **scoring rule** (inaccuracy measure). Let's break down why the argument is so sensitive, what fails with absolute distance, how Joyce's initial axioms were insufficient, and how strict propriety emerged as the key fix.

  ### 1. **The Core Argument & Why the Scoring Rule Matters**
     - **Goal**: Show that *any* incoherent credence function (violuting probability axioms) is **accuracy-dominated** by some coherent one. That is, for every incoherent `c`, there exists a coherent `c*` such that for *every possible world* `w`, `I(c*, w) ≤ I(c, w)` (and strictly `<` for some `w`).
     - **Why sensitivity?** Accuracy-domination depends on the geometry of the inaccuracy function. Coherent credences form a *convex set* (the probability simplex). Accuracy-domination requires that any point *outside* this set can be strictly "pushed" back *into* it in a way that uniformly reduces distance to all vertices (worlds). Not all distance metrics permit this.

  ### 2. **Why Absolute Distance Fails (The L¹ Norm)**
     Consider the absolute distance (Brier's "linear" score):  
     **`I(c, w) = Σ_i |c_i - v_i(w)|`**  
     where `v_i(w)` is 1 if proposition `A_i` is true in `w`, 0 otherwise.

     **The Breakdown**:
     - Take a simple case with 2 mutually exclusive propositions: `A` and `¬A`.
     - Consider an **incoherent** credence: `c(A) = 0.4`, `c(¬A) = 0.7` (sums to 1.1 > 1).
     - Consider a **coherent alternative** `c*` Joyce might propose: `c*(A) = c*(¬A) = 0.55`.
     - Now evaluate inaccuracy in two possible worlds:
       - **World w₁ (A true, ¬A false)**:  
         `I(c, w₁) = |0.4 - 1| + |0.7 - 0| = 0.6 + 0.7 = 1.3`  
         `I(c*, w₁) = |0.55 - 1| + |0.55 - 0| = 0.45 + 0.55 = 1.0` → `c*` better.
       - **World w₂ (A false, ¬A true)**:  
         `I(c, w₂) = |0.4 - 0| + |0.7 - 1| = 0.4 + 0.3 = 0.7`  
         `I(c*, w₂) = |0.55 - 0| + |0.55 - 1| = 0.55 + 0.45 = 1.0` → `c` **better** than `c*`!  
     - **Result**: `c*` does *not* accuracy-dominate `c` because in `w₂`, the incoherent `c` is strictly *more* accurate. In fact, *no* coherent credence dominates this incoherent one under absolute distance. Worse, some incoherent credences can even *dominate* coherent ones in certain cases. Coherence loses its epistemic necessity.

  ### 3. **Joyce's 1998 Axioms & Maher's Counterexample**
     Joyce initially proposed axioms for "reasonable" inaccuracy measures `I(c, w)`:
     1. **Truth-Directedness**: If `c` is uniformly closer to truth-values than `c'` in `w`, `I(c, w) < I(c', w)`.
     2. **Normality**: `I(c, w)` depends only on `c_i` and `v_i(w)` for propositions in the partition.
     3. **Continuity**: `I(c, w)` is continuous in credences.
     4. **Dominance Avoidance**: No coherent credence is accuracy-dominated by another coherent credence.

     **The Problem**: Patrick Maher (2002) constructed a scoring rule satisfying *all* these axioms, but which still **failed to accuracy-dominate some incoherent credences**. His counterexample was a variant of the spherical scoring rule:  
     `I(c, w) = 1 - [c_i / sqrt(Σ_j c_j²)]` for the true `A_i` in `w`.  
     While complex, it met Joyce’s axioms but allowed incoherent credences to avoid domination by coherent ones. This revealed the axioms were **too weak** to enforce the desired result.

  ### 4. **The Fix: Strict Propriety & Geometric Insights**
     The solution emerged by recognizing that **strict propriety** is essential for accuracy arguments for probabilism. A scoring rule is **strictly proper** if every coherent credence function uniquely *expects itself to be least inaccurate* (i.e., minimizes expected inaccuracy *by its own lights*). Formally:  
     `Σ_w c(w) · I(c, w) < Σ_w c(w) · I(c', w)` for all `c' ≠ c` (where `c` is coherent).  

     **Why this fixes domination** (Predd et al. 2009):  
     - **Geometric Insight**: Coherent credences form a *convex set*. For a strictly proper rule:
       - Inaccuracy `I(c, w)` is a **strictly convex function** of `c` (e.g., squared distance/Brier score).
       - This generates a **Bregman divergence**, ensuring the simplex of coherent credences is *precisely* the set of points that minimize expected inaccuracy relative to some probability.
     - **Domination Proof**: If `c` is incoherent, then:
       1. Find the coherent credence `c*` that minimizes expected inaccuracy *from `c`'s perspective* (the "projection" of `c` onto the simplex).
       2. Due to strict convexity, `c*` accuracy-dominates `c`: `I(c*, w) ≤ I(c, w)` for all `w`, with strict inequality if `c` is not coherent.  
       *Intuition*: The convex hull of "truth points" (worlds) ensures any "outside" point (`c` incoherent) is farther from *all* vertices than its projection (`c*` coherent).

     **Squared Euclidean Distance (Brier Score)** is the poster child:  
     `I(c, w) = Σ_i (c_i - v_i(w))²`  
     It is strictly proper, strictly convex, and enables the domination result.

  ### 5. **Is Strict Propriety the Settled Consensus?**
     - **Dominant View**: Yes, among proponents of epistemic utility theory (EUT). Strict propriety is now seen as *necessary* for accuracy-based arguments for probabilism, updating (conditionalization), and other epistemic norms.
     - **Remaining Debates**:
       1. **Justifying Strict Propriety**: Is it an *epistemic* requirement or a disguised pragmatic one? Critics argue it smuggles in "self-trust" assumptions.
       2. **Alternative Measures**: Some (e.g., Levinstein) argue for *local* scoring rules (accuracy per proposition), which complicate domination arguments.
       3. **Indeterminacy**: In cases of vague propositions or non-classical logic, propriety may need weakening.
       4. **Propriety vs. Truth-Directedness**: Can there be strictly proper rules violating truth-directedness? (Most say no, but edge cases exist.)
     - **Current Status**: Strict propriety is the *standard* for "legitimate" inaccuracy measures in EUT. Joyce (2009) and Pettigrew (2016) explicitly adopt it, and Predd et al.'s geometric approach solidified its role. However, the philosophical justification remains debated—some see it as a *discovery* about accuracy, others as a *stipulation*.

  ### Key Takeaways
  - **Absolute distance fails** because its "flat" geometry allows incoherent credences to be closer to truth in some worlds, blocking domination.
  - **Joyce's 1998 axioms were incomplete**—Maher showed they permit rules where incoherence isn't dominated.
  - **Strict propriety** ensures the convex structure needed for domination, linking coherence to *self-optimization* and *accuracy efficiency*.
  - **Predd et al.'s Bregman divergence framework** provides the rigorous geometric foundation, making propriety central.

  This rabbit hole reveals why formal epistemology is so nuanced: even a "purely epistemic" defense of probabilism hinges on subtle mathematical properties of inaccuracy. If you're diving into Predd et al. (2009), focus on the convex analysis—it's the master key to the domination result. Happy exploring! 🐇📉
