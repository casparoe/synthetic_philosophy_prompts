  Here’s a story set in a world shaped by al-Ghazali’s vision, focusing on the psychological and societal weight of divine caprice:

  **Title:** The Habit of Flame

  The fire in the hearth *should* have warmed the stone. Leyla watched the flames dance, her tea cooling untouched beside her. For thirty years, she’d been a physicist. Now, she cataloged "Habits."

  "Record 1147," she murmured into the resonator. "Subject: Thermal transfer, dry oak to basalt slab. Duration: Three hours. Observation: Habitual warming pattern observed. Deviation: None." She paused, the next words ash in her mouth. "*Presumed Divine Continuity: Sustained.*"

  Outside her insulated observatory, the city of Qadir hummed with nervous energy. Buildings leaned cautiously against each other, their foundations broad and redundant, designed for the day gravity might forget its duty. Bridges were webs of light alloy, easily replaced when the Habit of Structural Integrity faltered. Medicine was largely palliative; true healing relied on the Habit of Bodily Repair holding long enough for prayer to *maybe* sway the Will.

  Leyla’s colleague, Aris, burst in, eyes wide. "The Kaelin Bridge," he gasped, not from running, but from awe. "Mid-crossing… a grain cart. The left rear wheel… *sank*. Just… sank into the stone like it was mud. For three seconds. Then solid again. Cart tipped, no one hurt, but…"

  Leyla didn’t look up. "Deviation logged. Habit of Solidity: Minor lapse, Sector 7-West. Duration: Three seconds. Probable cause?" She finally met his gaze.

  Aris shrugged, helpless. "None. Just… a moment of Divine Forgetfulness? Or Attention elsewhere?" He slumped. "The engineers are adding another suspension cable. Pointless, really."

  That was the core of it. *Pointless.* Science wasn't about laws, but about documenting God’s routines. Leyla’s life’s work was a ledger of Divine Manners. *Fire usually burns cotton. Water usually flows downhill. Hearts usually beat.* "Usually" was the only constant.

  Leyla remembered her grandfather, a baker. Every dawn, before lighting the oven, he’d whisper, "By Your Leave, and only if it is Your Custom today." He’d seen an oven turn cold the moment bread entered, the dough remaining raw dough until tossed onto the midden heap where it promptly charred to cinders. A Divine joke? A lesson? No one knew.

  Planning was an act of profound faith, or folly. Farmers sowed seeds, trusting the Habit of Germination would hold for another season. But everyone knew the story of Elara Vale: a decade of barren soil, then a single year where seeds sprouted into fully grown fruit trees overnight. Miracle or irregularity? Theologians argued; farmers starved or feasted.

  Leyla’s own experiment sat shrouded: two sealed chambers. One contained dry cotton. The other, a spark mechanism. For ten years, she’d triggered the spark daily. For ten years, the cotton burned. The log was ten volumes thick. Utterly meaningless. Tomorrow, the spark might fly, and the cotton might bloom into a rose. Or turn to lead. Or vanish.

  A knock. Young Tamin, an apprentice Habit-Tracker, his face pale. "Physicist Leyla… the Children’s Hospice. Habit of Cellular Division… it… it *accelerated* in Ward Three. Tumors… they just… dissolved. Healthy tissue regrew in minutes. Six children cured."

  Leyla closed her eyes. A miracle. Undeniable. Joy warred with profound terror. "Log it," she said, her voice tight. "Deviation: Habit of Cellular Division. Sector: Mercy Hospice. Effect: Spontaneous remission of malignant neoplasms. Duration: Approximately five minutes. Presumed Divine Intervention: Likely." *Or a whim. Or a distraction.*

  "That’s good news!" Tamin insisted.

  "Is it?" Leyla gestured at her spark-and-cotton apparatus. "What Habit did that break to allow this? Did the Will tire of consistency in Ward Three and shift its focus, leaving another Habit threadbare elsewhere? Did a dam upstream weaken because Grace flowed here?" She picked up her cold tea. "We celebrate the saved children. We cannot know the cost, or if the cost is yet to come. Perhaps tomorrow, the Habit of Breathable Air will lapse over Qadir for five minutes."

  Tamin’s enthusiasm dimmed, replaced by the familiar, low-grade dread that permeated their world. Security lay not in understanding cause, but in placating the Source of all Effect. Rituals weren't superstition; they were essential maintenance checks on the Divine Mood. Prayers weren't just worship; they were desperate memos: *Please, let the Habit of Combustion hold while I light this stove.*

  That night, Leyla stood on her balcony. Below, the city lights flickered – not due to faulty wiring, but because the Habit of Electrical Conductivity had a minor stutter tonight, a celestial hiccup. She looked up at the stars, pinpricks in a vast velvet curtain. Were they distant suns obeying cosmic laws? Or merely God’s decorative lights, which He might rearrange on a whim, or extinguish one by one for His amusement?

  She shivered, not from cold (the Habit of Night Chill was holding), but from the vertigo of existing in a universe held together by Divine Routine. There was no "why" behind fire burning cotton. Only "how God usually acts." And "usually" was a thread fraying at both ends. The only true law was the terrifying, exhilarating, brain-breaking freedom of the Divine Will to do *anything*, *anytime*. Science was the archaeology of God's passing moods. Life was lived in the breath between one habitual moment and the next potentially world-shattering Divine pause.

  Leyla went inside. She didn’t light a lamp. She sat in the dark, listening to the city breathe, hoping the Habit of her own heartbeat would hold until dawn. It usually did. Usually.

  **The End**

  **Key elements reflecting al-Ghazali's world:**
  *   **Science as Habit-Tracking:** Not discovering laws, but meticulously documenting observed divine routines ("Habits"), knowing they hold no inherent power or necessity.
  *   **Constant Low-Grade Anxiety:** The ever-present possibility of a "Deviation" (miracle or disaster) undermines fundamental trust in reality. Planning involves redundancy and prayer, not just prediction.
  *   **Miracles as Disruptions:** Miracles aren't "magic," they're God simply *choosing* a different action than the usual Habit, highlighting the fundamental lack of natural causation (Abraham not burning).
  *   **Ritual as Practical Necessity:** Prayers and rituals are attempts to maintain Divine favor and encourage continuity of beneficial Habits, not just piety.
  *   **Existential Vertigo:** The profound psychological impact of living without reliable cause-and-effect – the world feels arbitrary, held together by divine whim. Joy is tempered by fear of the unknown cost of a deviation elsewhere.
  *   **No Underlying "Magic System":** The deviations aren't explained by alternative physics or energy; they are pure expressions of unpredictable Divine Will. The focus remains on the *human experience* of this reality.
