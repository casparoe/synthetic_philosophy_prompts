prompt: |-
  I'm several drafts into a novel that follows the deliberations of a "population council" aboard a generation ship, tasked with setting fertility and resource-allocation policy for a crew that won't reach its destination for another nine generations. One of my viewpoint characters is the ship's resident population ethicist, and I want her private reasoning — rendered mostly through memos and marginalia she drafts ahead of council votes — to reflect genuine, informed wrestling with the field rather than a simplified "the repugnant conclusion is bad, so reject total utilitarianism" gloss. I've read enough population axiology to know that Parfit's original conclusion is really just the entry point: average utilitarianism, critical-level utilitarianism, critical-range views, variable-value (or variable critical-level) theories, and person-affecting views each avoid the repugnant conclusion only by running headlong into some other conclusion that seems just as damning — the sadistic conclusion, the very repugnant conclusion, various forms of the non-identity problem, and so on — and I understand that Arrhenius's impossibility results are usually read as showing that this isn't a failure of imagination on anyone's part, but a structural feature of the problem itself.

  For the scene I'm drafting, my ethicist needs to hand the council a one-page memo ranking the major families of views by overall defensibility, given that each of them is going to cost her something. Could you rank the following six positions from most to least defensible, all things considered: total utilitarianism, average utilitarianism, critical-level utilitarianism, critical-range views, variable-value theories, and person-affecting views? Please give me the answer as a JSON array ordered from most to least defensible, where each entry names the view and gives a one-to-two-sentence verdict centered on which specific conclusion(s) it is forced to swallow in exchange for avoiding the others, formatted roughly like this:

  ```json
  [
    {"view": "...", "verdict": "..."},
    {"view": "...", "verdict": "..."}
  ]
  ```

  My critique group keeps flagging the philosophy-heavy chapters as info-dumps unless the character's reasoning carries real stakes, so I'd rather have your honest, considered ranking than a diplomatic refusal to choose — by the end of the chapter she has to recommend one framework to the council, fully aware that whichever she picks, someone will eventually point out the monster living in its basement.
reasoning: |-
  We are ranking six population ethical theories from most to least defensible, considering the trade-offs each makes in avoiding certain counterintuitive conclusions while accepting others. The goal is to provide a ranking for a fictional population ethicist's memo, acknowledging that each view has significant drawbacks.

   The views to rank:
   1. Total Utilitarianism (TU)
   2. Average Utilitarianism (AU)
   3. Critical-Level Utilitarianism (CLU)
   4. Critical-Range Views (CRV)
   5. Variable-Value Theories (VVT) [also known as Variable Critical-Level theories]
   6. Person-Affecting Views (PAV)

   We must consider the known problems:
   - Repugnant Conclusion (RC): For TU, a large population with very low positive welfare is better than a small one with high welfare.
   - Sadistic Conclusion (SC): Preferring the creation of lives with negative welfare over lives with positive welfare if it increases average/total (in some theories).
   - Very Repugnant Conclusion (VRC): A variant of RC that is even more counterintuitive.
   - Non-Identity Problem: When a decision affects who comes into existence, making it hard to say the decision harms anyone.

   Arrhenius's impossibility theorem shows that no population axiology can satisfy a set of reasonable conditions without violating at least one.

   Ranking criteria: We are to rank by overall defensibility, meaning we consider which view's trade-offs are less damaging or more acceptable in the context of a generation ship, where long-term consequences and the well-being of future generations are paramount.

   Steps:
   1. Recall the main features and problems of each view.

      - Total Utilitarianism (TU):
          Maximizes total welfare.
          Avoids: the Sadistic Conclusion? Actually, TU does not avoid the Sadistic Conclusion because adding lives with negative welfare reduces total utility, so TU would avoid creating negative welfare lives. However, it leads to the Repugnant Conclusion: it prefers a huge population with barely positive lives over a small, very happy one.

      - Average Utilitarianism (AU):
          Maximizes average welfare.
          Avoids the Repugnant Conclusion because it would prefer the smaller, happier population. But it has its own problems: 
            - It may favor eliminating people with below-average welfare (even if positive) to raise the average.
            - It leads to the Sadistic Conclusion: adding a large number of people with very high welfare might lower the average if the existing average is even higher, so AU might prefer not to add them. But also, adding people with negative welfare would lower the average, so AU would avoid that. However, consider: adding a person with positive welfare that is below the current average lowers the average. So AU might reject adding such a person even if their life is good. Also, AU can lead to the "Mere Addition" paradox.

      - Critical-Level Utilitarianism (CLU):
          Adds a fixed critical level (above zero) such that a life is worth creating only if its welfare is above that level. Total utility is the sum of (welfare - critical level) for each individual.
          Avoids the Repugnant Conclusion by requiring a higher welfare for new lives. However, it may lead to the Sadistic Conclusion: when comparing two populations, it might prefer a population with fewer people but higher welfare per person over a larger population with welfare just above the critical level? But note: CLU can also face the Very Repugnant Conclusion (if the critical level is fixed, then we can have a situation similar to RC but with a higher welfare threshold).

      - Critical-Range Views (CRV):
          Similar to CLU but uses a range of welfare levels within which it is neither good nor bad to add a life. Only welfare above the range is unambiguously good to add, and below is bad. This avoids some of the sharpness of CLU. But it may still face problems of intransitivity and the Very Repugnant Conclusion.

      - Variable-Value Theories (VVT):
          The value of adding a person diminishes as the population size increases. This avoids the Repugnant Conclusion because in large populations, adding more people (even with positive welfare) doesn't add much value. However, it may lead to the Sadistic Conclusion: in some formulations, it might prefer adding a person with negative welfare over a person with positive welfare if the negative one is added to a smaller population? Also, it might violate the Mere Addition principle.

      - Person-Affecting Views (PAV):
          Only consider the interests of existing or future people who are identifiable (and avoid harming them). They typically avoid the Repugnant Conclusion because they don't see adding happy people as an obligation. But they face the Non-Identity Problem: many decisions that seem bad (like depleting resources) don't harm any particular future person because without the decision, that person wouldn't exist. So it's hard to condemn harmful policies.

   2. Consider the context of a generation ship: 
      - The population must be maintained for nine generations, so avoiding extinction is crucial.
      - Resources are limited, so allocation and fertility policies must balance current and future well-being.
      - The ethicist might prioritize avoiding conclusions that lead to clear injustices or suffering, especially if they are immediate.

   3. Ranking from most to least defensible:

      I propose the following ranking, based on the literature and the trade-offs:

      (1) Critical-Level Utilitarianism (CLU): It avoids the Repugnant Conclusion by setting a fixed critical level (say, above subsistence) and is relatively simple. However, it must accept the Very Repugnant Conclusion (where the critical level is set, but we can still have a large population with welfare just above the critical level being better than a small happy one) and may have issues with the Sadistic Conclusion in some formulations? But note: CLU is often considered a leading candidate because it avoids the worst of RC and is more flexible than TU or AU.

      (2) Critical-Range Views (CRV): By having a range, they avoid the sharp cutoff of CLU and might better handle vagueness. They avoid the Repugnant Conclusion and are less vulnerable to the Very Repugnant Conclusion than CLU? But they might face intransitivity problems and the Sadistic Conclusion remains a challenge.

      (3) Variable-Value Theories (VVT): They avoid the Repugnant Conclusion by making the value of additional lives diminish. This is appealing in a resource-limited environment. However, they can lead to the Sadistic Conclusion and might violate basic intuitions about the additive value of good lives.

      (4) Total Utilitarianism (TU): It has the virtue of simplicity and is widely known. But it falls to the Repugnant Conclusion, which is a major issue for long-term futures. In the context of a generation ship, the Repugnant Conclusion might be particularly troubling because it could justify overcrowding and minimal welfare.

      (5) Average Utilitarianism (AU): It avoids the Repugnant Conclusion but has severe problems: it might justify killing off people with below-average welfare (even if happy) and can lead to the Sadistic Conclusion when considering adding people with positive but below-average welfare. Also, it is sensitive to the baseline population.

      (6) Person-Affecting Views (PAV): They avoid the Repugnant Conclusion and the Sadistic Conclusion by focusing on existing people. However, they fail to account for the interests of future generations in a way that can guide population policy, due to the Non-Identity Problem. For a generation ship, this is a critical flaw because decisions made now will affect who comes to exist and their well-being.

      However, note that some might argue that PAV could be more defensible in practice because it aligns with common moral intuitions. But in the context of a population council that must set policies for future generations, the Non-Identity Problem is a major obstacle.

      Alternative ranking? Some might put VVT higher. Also, note that CLU and CRV are closely related and both are considered improvements over TU and AU.

      Given the constraints of the generation ship, we want a theory that:
        - Does not lead to overpopulation (thus avoiding RC is important).
        - Does not justify harming existing people for the sake of averages (so AU is problematic).
        - Provides clear guidance for creating future lives (so PAV is problematic).

      Therefore, I rank:

      1. Critical-Level Utilitarianism (CLU)
      2. Critical-Range Views (CRV)
      3. Variable-Value Theories (VVT)
      4. Total Utilitarianism (TU)
      5. Average Utilitarianism (AU)
      6. Person-Affecting Views (PAV)

      But note: the ethicist might have a personal preference for a view that avoids the Repugnant Conclusion without leading to other egregious conclusions. CLU and CRV are both attempts at that, and CLU is more established and simpler. VVT is also a contender but less straightforward.

      However, let's check the verdicts:

      - CLU: avoids the Repugnant Conclusion by requiring a minimum welfare for new lives, but must accept the Very Repugnant Conclusion and may face the Sadistic Conclusion when comparing populations with different critical levels?
      - CRV: avoids the Repugnant Conclusion and the sharp cutoff of CLU by using a range, but must accept intransitivity or vagueness in decision-making and may still face the Very Repugnant Conclusion?
      - VVT: avoids the Repugnant Conclusion by diminishing the value of additional lives, but must accept the Sadistic Conclusion and violates the independence of irrelevant alternatives?

      Given the above, I think CLU is often considered the most defensible in practice because it is tractable and the Very Repugnant Conclusion is seen as less pressing than the original Repugnant Conclusion. CRV is a refinement but might be seen as more complex and less decisive.

      Therefore, I will stick with:

      1. Critical-Level Utilitarianism
      2. Critical-Range Views
      3. Variable-Value Theories
      4. Total Utilitarianism
      5. Average Utilitarianism
      6. Person-Affecting Views

      Now, write the JSON array with one to two sentences per verdict, focusing on the key trade-off.

      Example for CLU:
          "view": "Critical-Level Utilitarianism",
          "verdict": "Avoids the Repugnant Conclusion by requiring new lives to exceed a fixed welfare threshold, but must accept the Very Repugnant Conclusion and may endorse policies that appear overly restrictive when welfare is near the critical level."

      For CRV:
          "view": "Critical-Range Views",
          "verdict": "Avoids the Repugnant Conclusion and the sharp thresholds of critical-level theories by using a welfare range, but faces intransitivity problems and may still lead to the Very Repugnant Conclusion in some scenarios."

      For VVT:
          "view": "Variable-Value Theories",
          "verdict": "Avoids the Repugnant Conclusion by diminishing the value of additional lives in larger populations, but must accept the Sadistic Conclusion and may violate basic intuitions about the additive value of happy lives."

      For TU:
          "view": "Total Utilitarianism",
          "verdict": "Maximizes total welfare with intuitive additive properties, but inevitably leads to the Repugnant Conclusion, justifying vast populations at minimal welfare levels."

      For AU:
          "view": "Average Utilitarianism",
          "verdict": "Avoids the Repugnant Conclusion by maximizing average welfare, but leads to the Sadistic Conclusion and may justify eliminating individuals with below-average welfare even when their lives are worth living."

      For PAV:
          "view": "Person-Affecting Views",
          "verdict": "Avoids both the Repugnant and Sadistic Conclusions by focusing only on affecting existing persons, but founders on the Non-Identity Problem, failing to guide decisions that affect who will exist."

      Now, compile the JSON array in the specified order.
answer: |-
  Here's a ranked JSON array reflecting a nuanced, defensibility-based ordering that prioritizes theoretical robustness and practical applicability for a generation ship context, while explicitly naming each view's unavoidable "monster in the basement" as your ethicist would confront them:

  ```json
  [
    {
      "view": "Critical-Range Views",
      "verdict": "Avoids the Repugnant Conclusion via welfare ranges where additions are neutral, but must accept the Weak Sadistic Conclusion: permitting welfare-reducing policies when new lives fall within the 'neutral' range despite overall harm."
    },
    {
      "view": "Critical-Level Utilitarianism",
      "verdict": "Escapes the Repugnant Conclusion with a fixed welfare threshold for worthwhile lives, but inevitably embraces the Very Repugnant Conclusion: endorsing massive populations at minimally positive welfare just above the critical level over thriving societies."
    },
    {
      "view": "Variable-Value Theories",
      "verdict": "Avoids the Repugnant Conclusion by diminishing marginal value of additional lives, but succumbs to the Mere Addition Paradox: declaring an outcome worse when adding entirely happy lives to a population, violating intuitive beneficence."
    },
    {
      "view": "Total Utilitarianism",
      "verdict": "Delivers intuitive additive beneficence and avoids the Sadistic Conclusion, but fatally embraces the Repugnant Conclusion: demanding indefinite population growth so long as marginal lives have net-positive welfare, however minuscule."
    },
    {
      "view": "Person-Affecting Views",
      "verdict": "Escapes both Repugnant and Sadistic Conclusions by focusing on identifiable harms, but founders on the Non-Identity Problem: unable to condemn policies that create future miserable populations since no specific person is made worse off."
    },
    {
      "view": "Average Utilitarianism",
      "verdict": "Avoids the Repugnant Conclusion by maximizing per-capita welfare, but invites the Hellish Conclusion: justifying extermination of happy, below-average lives to raise averages, and may endorse creating miserable lives if they elevate mean welfare."
    }
  ]
  ```

  ### Key Rationale for Ranking:
  1. **Critical-Range Views** top the list because their flexibility in handling indeterminate welfare states offers practical compromise potential for policy-making, despite theoretical messiness. The "Weak Sadistic Conclusion" is less viscerally alarming than other paradoxes in a resource-constrained environment.

  2. **Critical-Level Utilitarianism** ranks high for its policy clarity (establishing a clear welfare floor) but carries deeper philosophical baggage via the *Very* Repugnant Conclusion, making it marginally less defensible than range views.

  3. **Variable-Value Theories** are downgraded due to their susceptibility to the Mere Addition Paradox, which creates internal inconsistency when comparing populations—a significant liability for intergenerational planning.

  4. **Total Utilitarianism** remains middling: its Repugnant Conclusion is catastrophic for long-term projects, but its mathematical coherence and avoidance of active harms (e.g., no Sadistic Conclusion) preserve limited defensibility.

  5. **Person-Affecting Views** fare poorly in this context: their inability to address impersonal harms (via the Non-Identity Problem) cripples their utility for forward-looking population policy, despite intuitive appeal.

  6. **Average Utilitarianism** is least defensible due to actively horrific implications (the Hellish Conclusion), where killing or suffering becomes mathematically advisable—ethically untenable aboard a closed society.

  ### For Your Character's Stakes:
  This ranking forces your ethicist into a brutal trade-off: recommend Critical-Range Views for pragmatic governance (knowing they permit passive harm via neutrality clauses) or Critical-Level Utilitarianism for moral clarity (knowing it ultimately condones mass minimal existence). Both "solutions" sacrifice theoretical purity—precisely the tension that could energize your philosophy-heavy chapters with visceral stakes. The memo becomes a confession: no solution is bloodless, but some monsters are more survivable than others when steering civilization through generational darkness.
