  I did one of those 23andMe kits and got back a report saying i have almost double the average genetic risk for type 2 diabetes, and ever since then I can't shake the feeling that the outcome is basically already loaded into me no matter what I eat or how much I excercise. My sister says that's silly because DNA isn't really a "blueprint" or a "code" the way a computer program is, but then I looked it up and it turns out biologists themselves call it "the genetic code," with actual letters that get read off in order to build proteins, so it sure sounds like real code to me and not just a figure of speech. So who's actually right, is thinking of DNA as "coded" instructions that basically decide what's going to happen to you a mistake, or is that actually a pretty fair way to look at a result like this?
