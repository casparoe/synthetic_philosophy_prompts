  Balancing her specific wishes with the audience's need for solace is tricky. The response should weave her principles into stories of her character, making her mission relatable. Phrases like "saw the world clearly but loved it fiercely" encapsulate her stance without technical jargon. 

  Including personal anecdotes from the user adds warmth. Encouraging them to share memories makes the eulogy personal and engaging. Closing with gratitude for her life, despite its difficulties, ties her philosophy to a broader message of resilience. 

