prompt: |-
  So I got into it with my friend Dev last night over drinks about whether it's ever actually rational for two people to just "agree to disagree." We were arguing about something dumb and specific — whether a mutual friend's startup is actually going to work out — and neither of us moved an inch even after like 40 minutes of laying out our full reasoning to each other. At some point I brought up Aumann's agreement theorem and said that, technically, if we're both honest, rational Bayesians, and we've each told the other exactly what our probability estimate is, the fact that we still disagree means one of us (maybe both) is being irrational, full stop. Dev pushed back hard, saying the whole theorem is kind of rigged from the start because it assumes we begin with the same prior probabilities, which he says is a totally unrealistic assumption — nobody actually starts with the same priors on anything, priors come from completely different life experiences, so of course two people can land on different posteriors and still both be perfectly rational. I tried to counter with this vague memory of a Robin Hanson argument that rational agents shouldn't get to have "uncommon priors" without pointing to some actual difference in evidence or life experience that explains the gap — like, if you can't say WHY your prior differs from mine except "it just does," thats not really good enough — but I couldn't reconstruct the argument well enough on the spot to win the point. We even tried just re-stating our updated numbers back and forth a few times to see if we'd converge, which sort of worked (we drifted a bit closer) but then just stalled, still pretty far apart, and we gave up.

  Can you settle this properly, or at least build the strongest possible version of my side? I want a real argument that the common-prior assumption isn't the cheap, question-begging move Dev thinks it is, and that something like Hanson's line — that persistent, sincere disagreement between two people who each think the other is basically rational, and who've fully shared their reasoning, is itself evidence that something has gone wrong for at least one of them — is actually defensible. Please get into the actual mechanics of the theorem (what "common knowledge" of posteriors technically requires, whether just saying our numbers out loud even generates it, and why Bayesians exchanging estimates should be expected to converge at all, even without sharing the underlying evidence) instead of just gesturing at the pop-science "rational people can't agree to disagree" one-liner, since that's the level Dev and I were already stuck at.
