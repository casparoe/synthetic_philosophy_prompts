  The user is questioning whether this is a strong nominalist stance. Given Berkeley's rejection of abstract matter, it's likely he's arguing money has no intrinsic value; its worth is derived from social agreement and its role in facilitating industry. Queries 38-40 reinforce this by linking wealth to industry and labor, not land or precious metals.

  The user might also be concerned about projecting metaphysics onto an economic text. But since Berkeley applies his philosophical principles consistently across works, it's reasonable to see The Querist as an extension. His advisor's comment about understanding nature through practical applications supports this connection.

