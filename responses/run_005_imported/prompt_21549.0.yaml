answer: |-
  Let's break down the exchange step-by-step, assessing each move's strengths before addressing what's missing and offering a verdict:

  ### Move 1: Mara's Opening Claim  
  **Claim:** The table's existence is *merely verbal* – particle facts fix all reality; "table exists" and "particles arranged tablewise" are equivalent descriptions.  
  **Strength:** Mara correctly identifies that *if* microphysical facts exhaust reality, macro-object claims add no new facts. This aligns with deflationary/neo-Humean views (e.g., Ted Sider, deflationary mereology).  

  ### Move 2: Devesh's Objection  
  **Objection:** Practical differences (counting objects, causal explanations, persistence) show the dispute is substantive.  
  **Strength:** Devesh effectively targets Mara's weak spot: if composition questions lack consequences, why do they *feel* consequential? His examples highlight how ontological commitments shape explanations (e.g., Baker's practical realism).  

  ### Move 3: Mara's Reply  
  **Reply:** All disputes Devesh cites can be paraphrased into particle terms without residue.  
  **Strength:** Mara leverages a key test for verbal disputes (Chalmers' "elimination by paraphrase"). If "cup stability" reduces to particle dynamics, and "table persistence" to particle replacement patterns, the dispute *appears* dissolved.  

  ### Move 4: Devesh's Counter  
  **Counter:** This overgeneralizes – it would make the platonism/nominalism debate verbal too (which it isn't).  
  **Strength:** Devesh scores a major point. Paraphrase strategies for abstracta (e.g., Hellman's modal structuralism) are *contested*, unlike table-to-particle reduction. His analogy exposes a flaw in Mara's criterion: uncontroversial paraphrasability ≠ verbal dispute.  

  ### Move 5: Mara's Distinction  
  **Reply:** Cases are disanalogous – table paraphrase is uncontroversial; number paraphrase isn't.  
  **Strength:** Mara correctly notes a disparity. Microphysical reduction of macros is widely accepted (unlike math anti-realism). But this undermines her initial position: **if uncontroversial paraphrasability marks verbal disputes, she concedes paraphrasability's status is substantive.**  

  ### Move 6: Devesh's Parting Shot  
  **Claim:** Whether paraphrase is "available and cost-free" is itself substantive, so Mara's test presupposes her conclusion.  
  **Strength:** Devesh wins this exchange. Mara's defense now hinges on whether particle-talk *exhausts* reality – precisely the substantive issue in dispute. Paraphrasability can't neutrally certify verbal disputes without circularity.  

  ---

  ### What Both Are Missing  
  1. **Grounding and Emergence:** Neither addresses if "arrangement facts" require grounding in objects (Schaffer) or if novel causal powers emerge at the table level (e.g., emergent stability).  
  2. **Conceptual Role:** Mara ignores that "table" may be a cognitively primitive concept (Lakoff), making paraphrase practically inadequate even if metaphysically redundant.  
  3. **Pragmatic Commitments:** Devesh's "things we care about" hints at but doesn't develop how ontology serves explanatory interests (e.g., why prefer particle explanations for cup stability if table-talk is more efficient?).  
  4. **Metaontology:** Both presuppose a fact-based metaphysics. A Carnapian could argue *both* descriptions are legitimate relative to different frameworks, making the dispute "verbal" in a metaontological sense.  

  ---

  ### Final Verdict: The Dispute Is Substantive  
  **Why:**  
  - **Paraphrasability isn't neutral:** Whether table-talk reduces without loss to particle-talk depends on unresolved issues: Do arrangements suffice for objecthood? Do macro-objects have irreducible causal roles? These are metaphysical, not semantic, questions.  
  - **Explanatory costs matter:** Even if paraphrase is possible, nominalizing "table survival" into particle trajectories may sacrifice explanatory unity or counterfactual robustness (Jackson). If so, the dispute concerns what counts as adequate explanation.  
  - **The platonism analogy holds:** Just as the existence of numbers turns on whether mathematical truths require abstracta, table existence turns on whether composition occurs – both are substantive ontological disagreements masked by paraphrase debates.  

  **Conclusion:** Devesh is right that Mara's paraphrasability criterion presupposes a substantive metaphysical stance (reductionism). The dispute is verbal *only if* one already accepts that particles exhaust reality – which is the heart of the disagreement. Thus, the special composition question remains robustly substantive.
