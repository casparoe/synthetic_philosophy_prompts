prompt: |-
  I am a retired physicist who has only in the last few years begun reading moral philosophy seriously, and I have just finished Elizabeth Anscombe's 1956 pamphlet "Mr. Truman's Degree," written to oppose Oxford's decision to award Harry Truman an honorary degree. What strikes me most is that her central charge is not that the atomic bombings killed enormous numbers of civilians, but that those deaths were the chosen means of ending the war rather than a foreseen side effect of striking some legitimate target — it is this intention/foresight distinction, later elaborated under the doctrine of double effect, that lets her call the bombing murder without ever having to weigh it against the lives the bombing may have saved.

  I would be curious how she might have judged the "signature strike" practice of modern drone warfare, where targets are selected from behavioral patterns rather than positive identification, and where it is a matter of settled policy — though never demonstrably true of any single strike — that a predictable proportion of those killed will be unidentified civilians. Any individual strike can be honestly described as aiming only at a suspected combatant, with civilian deaths merely foreseen rather than intended. Would Anscombe's distinction actually shield this practice, or would she have treated "signature" targeting as just a more bureaucratic version of the very move she accused Truman's Oxford defenders of making — relabeling a policy of killing the innocent as mere foresight? I would value your best reconstruction of her reasoning, including any point at which her own framework might leave the verdict genuinely unsettled.
reasoning: |-
  Okay, the user is a retired physicist who has recently gotten into moral philosophy, specifically Elizabeth Anscombe's work on Truman's honorary degree. They're asking about how Anscombe's doctrine of double effect might apply to modern drone "signature strikes." Let me start by recalling Anscombe's key argument. She condemned Truman not just for the civilian deaths but because those deaths were intended as a means to end the war, which she classified as murder.

  The user is pointing out that in signature strikes, targets are chosen based on behavior patterns, and civilian casualties are foreseen but not specifically targeted. The question is whether Anscombe would see this as permissible under double effect or if it's just a bureaucratic version of what Truman did. 

  First, I need to break down the doctrine of double effect (DDE). The four conditions: the act itself must be good or neutral; the intention must be good (only aiming at the legitimate target); the evil effect (civilian deaths) must not be a means to the good effect; and proportionality. 

  For signature strikes, the intended target is the suspected combatant, so the direct intention might seem good. But Anscombe was strict about certainty and identification. If the target isn't positively identified as a combatant, then the act of targeting them might not be legitimate from the start. That's a key point. If the suspect isn't actually a combatant, then killing them is murder. The lack of positive ID could make the entire act unjust.

  Then there's the foreseen civilian deaths. Even if the main target is a combatant, the policy accepts a predictable number of civilian deaths. Anscombe would likely argue that this systemic acceptance turns the foreseen deaths into an intended part of the policy. She emphasized that if you knowingly adopt a plan that includes killing innocents as part of the method, it's tantamount to intention. 

  Also, proportionality matters. But Anscombe would probably say that proportionality can't justify an intrinsically evil act. If the targeting is invalid from the start due to lack of ID, then no amount of proportionality makes it okay. 

  The user might also be hinting at a deeper concern: how bureaucratic processes obscure moral responsibility. Anscombe was critical of how Truman's defenders used "foresight" to mask the intention. Similarly, the institutionalized nature of signature strikes might be seen as a way to diffuse responsibility, which she would reject. 

  I should also consider where Anscombe's framework might be unsettled. If a particular strike had strong evidence that the target is a combatant, and civilian casualties were minimal and proportional, maybe it passes DDE. But signature strikes by definition lack positive ID, so that's unlikely. The policy's acceptance of civilian deaths as "collateral damage" would still be problematic for her. 

  The user's background as a physicist might mean they appreciate clear, logical arguments. So structuring the response with Anscombe's principles applied step-by-step to the drone scenario would be effective. Highlighting the importance of positive identification and the distinction between systemic policy vs. individual strikes. Also, addressing the bureaucratic aspect as a form of bad faith, similar to Truman's case.
answer: |-
  Based on Anscombe's core principles articulated in "Mr. Truman's Degree" and her broader work on intention and double effect, her condemnation of signature strikes would be **unequivocal and severe**. She would see it as a bureaucratic evasion embodying the very moral corruption she accused Truman's defenders of perpetrating. Here's a reconstruction of her reasoning:

  1.  **The Primacy of Intention and the Nature of Murder:**
      *   For Anscombe, the *intention* behind the act is paramount. Murder is defined as the *intentional killing of the innocent*. The Doctrine of Double Effect (DDE) provides a narrow exception: killing innocents may be *permissible* (not murder) *only* if:
          *   **a. The act itself is good or neutral.** (e.g., attacking a legitimate military target).
          *   **b. The agent intends only the good effect.** (e.g., destroying the target).
          *   **c. The evil effect (death of innocents) is *not* a means to the good effect.** (e.g., their deaths aren't *how* you achieve the military objective).
          *   **d. There is a proportionately grave reason for permitting the evil effect.** (The good achieved must outweigh the foreseeable evil).

  2.  **The Fatal Flaw in Signature Strikes: Lack of Positive Identification & The Nature of the Act:**
      *   Anscombe would argue that the very *foundation* of the act in a signature strike fails condition (a). The "act itself" – targeting and killing individuals based *only* on behavioral patterns without positive identification – is **inherently illegitimate**.
      *   **Who is the "Legitimate Target"?** A legitimate target, for Anscombe operating within the traditional Just War framework she presupposed, must be someone *positively identified* as currently posing a direct threat (a combatant) or directly contributing to the war effort in a crucial way. Mere suspicion based on patterns falls radically short of this standard.
      *   **The Act is Not Neutral:** Killing someone who is *not* positively identified as a combatant is, for Anscombe, **presumptively murderous**. You lack the justification for the violent act *itself*. The lack of positive ID means the person killed *could be* innocent, and you proceed knowing this. The act of killing under this condition is *not* a "good or neutral" act aimed at a legitimate target; it is an act of killing based on suspicion and probability. This violates the first condition of DDE.

  3.  **Foreseen Evil as De Facto Intention (Systemically):**
      *   While an individual drone operator *might* intend only to hit the "suspected combatant," Anscombe would look at the *policy and its inherent structure*. The policy *knowingly and systematically* accepts that a predictable proportion of those killed will be unidentified civilians. This is *not* an accidental or truly incidental side-effect; it is a *built-in, statistically guaranteed consequence* of the method chosen.
      *   **Acceptance as Adoption:** By adopting a method *known* to kill a predictable number of innocents as part of its standard operating procedure, the policymakers and executors *adopt* those deaths. Anscombe would argue this systemic acceptance transforms the merely "foreseen" civilian deaths into an **intended part of the policy's mechanism**. The policy *relies* on being able to strike based on patterns, knowing civilians will die within those patterns. Their deaths are not merely foreseen; they are *instrumentalized* as the unavoidable cost of operating this way. This violates condition (c) of DDE – the evil *is* a means (or an accepted, non-separable part of the means) to the broader goal of killing suspected militants efficiently.

  4.  **The Bureaucratic Smokescreen:**
      *   Anscombe accused Truman's defenders of using the language of "foreseen consequence" to disguise an intention to kill civilians *as a means* to end the war swiftly. She would see the "signature strike" framework as a **more sophisticated, institutionalized version of the same evasion**.
      *   The bureaucratic apparatus – the pattern analysis, the "suspected combatant" label applied *post hoc* to unidentified individuals, the statistical acceptance of "collateral damage" – creates layers of abstraction that diffuse responsibility and obscure the fundamental reality: **the policy deliberately kills people known to include a predictable number of innocents, without knowing *which specific ones* are innocent at the moment of killing.** She would condemn this as a form of institutional bad faith, hiding the intentional killing of the innocent behind procedural fog and probabilistic language.

  5. **Proportionality's Insufficiency:**
      *   Even *if* one argued the act could somehow be justified (which Anscombe wouldn't concede due to points 1-3), proportionality (condition d) could *never* justify an intrinsically evil act. Since she would view the killing of the unidentified "suspected combatant" as presumptively murderous (lacking justification for the act itself), and the systemic acceptance of civilian deaths as an adopted intention, no calculation of lives saved elsewhere could render it morally permissible. Proportionality only applies to the *permission* of a *foreseen but unintended* evil effect stemming from a *legitimate* act. If the act is illegitimate or the evil is intended, proportionality is irrelevant.

  **Where Might Anscombe's Framework Leave it Unsettled (Though Likely Still Condemnatory)?**

  *   **The Threshold of Certainty:** Anscombe presupposes a clear distinction between combatant and non-combatant. Modern asymmetric warfare blurs these lines. How much positive identification is *enough* for her? While signature strikes clearly fail, a strike based on *very strong*, multi-source intelligence *approaching* certainty (though perhaps not meeting a courtroom standard) *might* be argued to satisfy condition (a) in a specific instance. However, the systemic nature of signature strikes, defined by the *absence* of such strong ID, means this wouldn't shield the practice.
  *   **The "Merely Foreseen" in a Specific Strike:** In a *singular* strike where positive ID *was* achieved on a legitimate high-value target, and civilians were killed as an *unintended* side-effect *not used as a means*, DDE could potentially apply. This highlights that Anscombe's objection to signature strikes isn't primarily about drones *as technology*, but about the *lack of discrimination inherent in the targeting method and policy*.

  **Conclusion:**

  Anscombe would view "signature strikes" not as shielded by the intention/foresight distinction, but as its **ultimate bureaucratic perversion**. The lack of positive identification makes the killing of the primary target presumptively murderous, violating the first condition of DDE. The systemic, predictable acceptance of civilian deaths transforms what is claimed to be "merely foreseen" into an **adopted and intended part of the policy's methodology**. She would see it as a sophisticated, institutionalized effort to "relabel a policy of killing the innocent as mere foresight," precisely echoing her accusation against Truman's defenders, but rendered even more morally hazardous by its abstraction and technological remove. Her verdict would be clear: such a practice constitutes murder on a systemic scale.
