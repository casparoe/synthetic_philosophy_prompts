   1. **Bracketing (Greaves)**: Hilary Greaves distinguishes between "simple" and "complex" cluelessness. Simple cluelessness involves uncertainty about effects that are symmetric (cancel out in expectation). Complex cluelessness involves uncertainty about effects that are asymmetric (do not cancel out). She suggests we can bracket (ignore) the simple cluelessness because they cancel in expectation. We focus on the complex ones, which are the real problem. But note: the question is whether bracketing fully solves the problem.

   2. **Expected Value Maximization (Standard)**: Use expected value (EV) calculations based on available evidence. This is the standard response: we do the best we can with probabilities and utilities we can assign. However, the cluelessness objection highlights that for many consequences we cannot assign probabilities or utilities.

   3. **Satisficing Consequentialism**: Instead of maximizing, aim for "good enough" outcomes. This might avoid the need to know about very long-term effects if we can achieve a satisfactory outcome in the near term. Proposed by Slote and others.

   4. **Rule Consequentialism**: Shift from evaluating individual acts to following rules that, if generally followed, would lead to the best consequences. This might avoid cluelessness by relying on rules that have been vetted for their general consequences. However, it is a form of indirect consequentialism and may not be a direct defense of act consequentialism.

   5. **Two-Level Consequentialism (R.M. Hare)**: At the intuitive level, we use simple rules of thumb; at the critical level, we use consequentialist reasoning. This might help by limiting the scope of consequentialist calculation to when we have time and information. But cluelessness might still plague the critical level.

   6. **Global Consequentialism (Pettit and Smith)**: Evaluate decision-making procedures, motives, or rules by their consequences, and then let those guide action. This is similar to rule consequentialism but more flexible. It might help by focusing on reliable procedures that avoid the need for precise long-term predictions.

