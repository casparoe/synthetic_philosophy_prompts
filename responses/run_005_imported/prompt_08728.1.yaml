prompt: |-
  I'm a software engineer on the working group that sets accommodation policy for technical interviews at my company. A candidate for a senior engineering role has documented ADHD affecting her working memory, and already qualifies for our standard accommodation of extra time plus a one-page personal reference sheet during the live coding round. She now wants to swap the sheet for her own AI coding assistant, pre-loaded only with her personal notes, arguing -- via what she calls "the extended mind thesis" and "Otto's notebook" -- that the assistant does exactly what the sheet already does, just more reliably, and that since we already expect engineers to lean on docs and AI tools rather than unaided memory on the job, unaided recall isn't really the skill this round is meant to certify. Two of my colleagues on the group disagree: they say a generative assistant differs in kind from a static sheet because it can hand her solutions she never actually worked out or reviewed beforehand, and that granting this would make the round untestable while every other candidate is barred from live AI use. Her interview is next week, so we need to decide. Please draft the working group's short decision memo -- approve, deny, or approve with specific conditions -- framed as a policy we could apply consistently going forward rather than a one-off ruling, with reasoning she could actually respond to, a timeline for implementation, and an honest account of the strongest objection to whatever you recommend.
reasoning: |-
  Okay, the user is a software engineer on a working group setting accommodation policies for technical interviews. They've got a tricky situation with a candidate who has ADHD affecting her working memory. She already gets extra time and a one-page reference sheet but now wants to swap that sheet for her own AI coding assistant pre-loaded only with her personal notes. 

  Hmm, her argument is interesting - she's invoking the "extended mind thesis" (that philosophical concept where tools become part of your cognitive system) and comparing the AI to "Otto's notebook" from that famous thought experiment. She makes a good point that engineers use docs and AI tools daily, so why test unaided recall? But the colleagues raise valid concerns too - generative AI could potentially solve problems for her in ways a static sheet can't.

  Let me unpack the key tensions here: 
  On one hand, accommodations should level the playing field for neurodivergent candidates. If the AI truly functions as a memory aid equivalent to her notes, denying it might be unfair. Her argument about real-world engineering practice is also compelling - nobody codes from pure memory anymore. 

  On the other hand... generative AI is qualitatively different. Unlike static notes, it can: 
  - Combine concepts in novel ways she might not have pre-understood
  - Generate boilerplate she didn't create
  - Potentially solve sub-problems autonomously

  The colleagues' "untestable" concern is real - how would we verify the AI only contains her notes? And the fairness angle matters too since other candidates can't use live AI. 

  But wait... maybe there's a middle path? What if we treat the AI as an enhanced accommodation but with strict boundaries? Like allowing it only if:
  - The candidate submits the exact AI dataset beforehand (matching her original notes)
  - We audit it pre-interview
  - Disable internet access
  - Use monitoring software

  This maintains test integrity while accommodating her needs. The memo should emphasize this isn't about denying assistance but ensuring the assistance stays within accommodation principles. 

  The strongest counterargument will be about implementation burden and whether this truly differs from her original notes. We'll need to acknowledge that while also explaining why generative capability crosses a line without these controls. 

  Timeline-wise, this can't be rushed for her interview next week - better to offer her the existing accommodation while we develop proper protocols. That's disappointing but necessary for fairness. 

  The policy should focus on functional equivalence: tools that only retrieve pre-existing knowledge are acceptable; tools that generate new knowledge are not. That draws a clear, consistent line for future cases.
answer: |-
  ## Working Group Decision Memo: AI-Based Accommodation Request  
  **Date:** October 26, 2023  
  **To:** Interview Accommodations Working Group  
  **From:** [Your Name/Working Group Chair]  
  **Subject:** Policy Decision: Use of AI Coding Assistants as ADHD Accommodation  

  ### Decision:  
  **Deny the request to replace the standard one-page reference sheet with a personal AI coding assistant, but approve an expanded static reference accommodation (3–5 pages) effective immediately.** Candidates may reapply for AI-assisted accommodations once standardized validation protocols are established (target: Q1 2024).  

  ### Reasoning:  
  1. **Functional Equivalence Not Established:**  
     - While the "extended mind thesis" rightly highlights tools as cognitive extensions, generative AI fundamentally differs from static reference materials. A pre-reviewed sheet provides *predictable access to pre-existing knowledge*, whereas an AI assistant can *synthesize novel solutions* beyond the candidate’s prior notes—altering the assessment of problem-solving skills.  
     - Our coding round evaluates *structured problem decomposition under constraints*, not unaided recall. However, generative AI risks conflating the candidate’s reasoning with automated solution generation, which exceeds the accommodation’s intent to compensate for working memory deficits.  

  2. **Test Integrity & Fairness:**  
     - Allowing generative tools introduces unverifiable variables (e.g., model behavior, hidden training data). Unlike a vetted sheet, we cannot guarantee the AI only "retrieves" personal notes without generating logic the candidate hasn’t reviewed.  
     - Until standardized controls exist (e.g., air-gapped devices, pre-vetted AI datasets), this accommodation cannot be uniformly applied or monitored, creating inequity for other candidates barred from AI use.  

  3. **Enhanced Static Accommodation:**  
     - To address reliability concerns with paper notes, we approve expanding the reference sheet to **3–5 pages** (vs. 1 page). This maintains the accommodation’s intent while offering broader access to pre-documented syntax, patterns, or pseudocode.  

  ### Implementation Timeline:  
  - **Immediate (Current candidate):** Offer the expanded 3–5 page reference sheet + extra time.  
  - **Q1 2024:** Pilot AI-assisted accommodations for candidates who requalify, subject to:  
    - Pre-interview validation of the AI’s dataset (must match submitted personal notes).  
    - Use of company-provided, internet-disabled devices running the AI tool.  
    - Prohibition of real-time code generation (e.g., AI limited to retrieving note snippets).  

  ### Strongest Objection to Our Decision:  
  **Objection:** *Denying AI use ignores the candidate’s argument that static notes are unreliable for ADHD-related working memory deficits and fails to reflect real-world engineering where AI tools augment cognition daily. This maintains an artificial barrier between the interview and actual job skills.*  
  **Response:** We agree static notes are imperfect and commit to developing AI-accommodation protocols by Q1 2024. However, granting unvetted generative tools *now* risks invalidating the assessment. The expanded static accommodation balances immediate needs with assessment integrity while we build a secure framework for AI assistance.  

  ### Candidate Response Pathway:  
  The candidate may:  
  1. Accept the expanded 3–5 page sheet for her upcoming interview.  
  2. Resubmit an AI request under the Q1 2024 pilot if her personal notes can be pre-validated and run on our secured devices.  
  3. Appeal this decision to the company’s Disability Inclusion Council within 48 hours.  

  ---  
  **Approved by:** [Working Group Signatures]  
  **Policy Effective Date:** October 26, 2023 | **Next Review:** March 31, 2024  

  ---  
  ### Key Principles Underlying Policy:  
  - **Accommodation Purpose:** Compensate for disability-related barriers, not alter core skills assessment.  
  - **Equity:** All accommodations must be verifiable, consistent, and generalizable.  
  - **Fidelity:** Interview tools must mirror *constrained* job realities (e.g., code review required for AI output).  
  - **Innovation:** We commit to evolving accommodations as assistive technology advances—with guardrails.  

  This memo balances immediate fairness, test validity, and a pathway toward inclusive technological accommodations.
