prompt: |-
  Ok this is gonna sound petty but it's been stuck in my head for like two weeks so bear with me. I smoked close to a pack a day for about 6 years in my 20s and quit almost 2 years ago, it was genuinely one of the hardest things I've ever done. My best friend picked cigarettes back up a couple months ago after being smoke free for a while, and I have been ON her about it, bringing it up almost every time we hang out, telling her shes gonna end up back at a pack a day and wreck her lungs like I almost did. She finally snapped at me last week and said something like "you did literally the exact same thing for six years, you don't get to lecture me about this." Which, fair, I did do that. I'll also admit I still vape sometimes, way less than I used to smoke obviously, but it's not like I quit nicotine completely either.

  Here's what I can't figure out: does the fact that I was (and kind of still am) doing my own version of the same thing mean I have no business saying anything to her about it? Because the actual thing I'm telling her, that smoking is bad for her and she should stop, seems true no matter who's saying it. My ex thinks I'm totally in the right and should keep pushing her on it, my roommate thinks I need to fully quit nicotine myself before I open my mouth again. I tried looking this up online but everything I found was just generic "don't judge others" advice that didn't really get at what's actually bugging me. Is there a real difference between someone being right about something and someone being the right person to point it out, or is that not actually a coherent distinction and she's got a point that I should just butt out?
