prompt: |-
  I sit on my hospital's New Procedures and Technology Committee, which has to sign off on any interventional technique before it can be offered outside a research protocol. The spine service is asking us to approve system-wide use of a minimally invasive percutaneous technique for stabilizing painful vertebral compression fractures in osteoporotic patients. There is no completed randomized trial behind it; a sham-controlled trial is enrolling but is at least two years from reporting. What we do have is momentum: the technique is now used at roughly three-quarters of the hospitals we benchmark against, up from almost none five years ago, and our own surgeons' enthusiasm rests heavily on site visits where they watched colleagues elsewhere get good results. The department chair's proposal leans on the breadth of that adoption as evidence in itself, and warns that further delay will cost us surgeons and referrals to hospitals that already offer it.

  The committee split in a way that didn't track the usual alliances. Our clinical epidemiologist pointed out that the interval between a hospital's first site visit and its decision to adopt has been shrinking with each wave of new adopters, and argued that this pattern -- convergence driven increasingly by watching what others have already decided rather than by each hospital generating its own evidence -- looks less like accumulating proof and more like an information cascade, which would look exactly as wide and confident whether or not the procedure actually works. Other members thought this was unfair to the surgeons: watching a colleague's outcomes first-hand is a form of evidence too, and three years of accumulated clinical experience shouldn't be waved away as mere imitation. We ran out of time before resolving it.

  Please draft the short written opinion I'll circulate before our next meeting in six weeks. It should recommend one concrete course of action -- full approval, approval with specific conditions, or continued restriction to the research protocol -- attached to a timeframe, and it should take the "accumulated clinical experience is itself evidence" position seriously rather than simply asserting that widespread adoption tells us nothing.
reasoning: |-
  Okay, the user is on a hospital committee that has to decide whether to approve a new spinal procedure without completed randomized trials. They need a draft opinion for the next meeting that recommends a specific action and addresses both sides of the argument. 

  First, I need to understand the key tensions here. The spine surgeons are pushing for approval based on widespread adoption and their own observations during site visits. The clinical epidemiologist is warning about an "information cascade" where hospitals are just copying each other without real evidence. The user specifically wants to take the "accumulated experience is evidence" position seriously, not dismiss it outright.

  Hmm... the user's role seems to be as a mediator here. They need something that bridges these two perspectives. The epidemiologist's point about adoption intervals shrinking is particularly sharp - it does suggest herd behavior. But outright rejecting the surgeons' firsthand observations would be unwise, especially with referral loss concerns.

  I notice the user didn't mention patient outcomes at all in the dilemma. That's interesting. The real stakes are about avoiding harm to fragile osteoporotic patients if the procedure doesn't work, versus denying them potential relief if it does. The draft should probably emphasize this even if the committee debate hasn't.

  The solution should respect both viewpoints: acknowledge that observational evidence has value (surgeons aren't idiots), but insist on structure around that evidence. A monitored rollout makes sense - it's neither full approval nor complete restriction. The two-year sunset clause aligns perfectly with the sham trial's timeline. 

  Key things to include: specific monitoring requirements (that outcomes tracking isn't just for research but for committee oversight), mandatory training to prevent skill issues from contaminating results, and phrasing that validates surgeons' expertise while creating accountability. The "not a vote of no confidence" line is crucial - surgeons might otherwise feel insulted.

  Also worth noting: the user will circulate this before the meeting, so it needs to preempt objections. The epidemiologist might say monitoring is insufficient, while surgeons may chafe at restrictions. The draft tries to split the difference by making restrictions temporary and data-driven. Smart to require department chair sign-off - puts responsibility on the advocates.

  ...Did I address the "concrete timeframe" request? Yes, 24 months with mandatory review. And the conditions are very specific: case limits, outcomes tracking, training. Good. The tone walks the line between respectful and firm - doesn't cave to pressure but doesn't dismiss clinical experience either. 

  One last thought: the phrase "procedural momentum" subtly validates the adoption argument while still demanding proof. That's probably the tightrope the user needs to walk.
answer: |-
  Here’s a draft opinion addressing the committee’s concerns while balancing evidence, clinical experience, and patient safety:  

  ---

  **MEMORANDUM**  
  **To:** New Procedures and Technology Committee  
  **From:** [Your Name/Title]  
  **Date:** [Current Date]  
  **Re:** Recommendation on Percutaneous Vertebral Stabilization  

  After careful review of the proposal for system-wide adoption of percutaneous vertebral stabilization, I recommend **conditional approval for a 24-month pilot period**, subject to stringent monitoring and reporting requirements. This approach acknowledges both the legitimacy of accumulated clinical experience *and* the need for rigorous evidence before permanent adoption.  

  ### Rationale:  
  1. **Clinical Experience as Valid (but Incomplete) Evidence**:  
     - Surgeon observations during site visits and peer outcomes across 75% of benchmark hospitals constitute meaningful real-world evidence. Dismissing three years of multi-institutional experience as "mere imitation" undervalues clinical judgment and tacit knowledge gained through procedural refinement.  
     - *However*, observational evidence remains vulnerable to bias (e.g., selection of ideal patients, subjective pain reporting). Widespread adoption alone cannot substitute for controlled efficacy data.  

  2. **Mitigating Cascade Risks**:  
     The rapid adoption curve noted by our epidemiologist warrants caution. To prevent institutional momentum from overriding evidence:  
     - **Restrict initial rollout** to 3 high-volume spine surgeons (approved by the committee).  
     - **Mandate prospective outcomes tracking** for all procedures:  
       - Standardized pain/function scores (e.g., VAS, ODI) at baseline, 6, 12, and 24 months.  
       - Complication rates (cement leakage, adjacent fractures, infections).  
       - Comparison against historical controls (traditional vertebroplasty/non-op care).  
     - **Require quarterly data reviews** by this committee.  

  3. **Protecting Patients and the Institution**:  
     - A pilot phase ensures we capture *our* population’s outcomes (e.g., frailty, comorbidities) rather than relying on external data.  
     - Sunset clause: Full system-wide approval requires either:  
       - (a) Positive 24-month pilot data (≥20% sustained pain/function improvement in ≥80% of cases, complications ≤5%), *or*  
       - (b) Publication of the sham-controlled trial.  
     - If neither is met, the procedure reverts to research-only status.  

  4. **Addressing Operational Concerns**:  
     - Conditional approval retains surgeons and referrals by offering the procedure *now* while demonstrating due diligence.  
     - Require surgeons to complete industry-independent simulation training prior to credentialing.  

  ### Recommended Conditions:  
  - **Duration**: 24 months (aligns with anticipated sham trial reporting).  
  - **Volume Cap**: ≤50 procedures institution-wide during the pilot.  
  - **Reporting**: Department submits de-identified outcomes data quarterly.  
  - **Oversight**: Committee may suspend approval after 2 major complications or inadequate data submission.  

  ### Conclusion:  
  Respect for clinical experience does not preclude prudent safeguards. This pilot framework leverages real-world evidence while generating institution-specific data. It balances innovation against our duty to first, do no harm—ensuring we adopt the procedure *because* it works, not because others have.  

  **Vote Recommendation: Conditional approval with above stipulations, effective [Date].**  

  ---  

  ### Key Strengths of This Approach:  
  - **Acknowledges surgeons’ expertise** by permitting limited use, validating their firsthand observations.  
  - **Forces data generation** to answer whether outcomes here match site-visit anecdotes.  
  - **Prevents irreversible commitment** pending higher-level evidence.  
  - **Turns "adoption momentum" into a hypothesis** (i.e., "If so many hospitals use it, our data should confirm efficacy").  
  - **Mitigates cascade risk** by requiring local proof, not just peer imitation.  

  This positions your committee as both clinically pragmatic and scientifically rigorous—neither obstructing innovation nor capitulating to pressure.
