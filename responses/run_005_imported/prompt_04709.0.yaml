  4.  **d) Hobbes-Wallis Dispute Facts (Score: 4/4)**  
      The summary is excellent: Hobbes's claims (starting in *De Corpore*), Wallis's detailed refutations, the mathematical impossibility (transcendence of π), and Hobbes's dogged persistence despite proof of futility are all accurately and concisely stated. The mention of "formal proof" by Wallis is apt.

