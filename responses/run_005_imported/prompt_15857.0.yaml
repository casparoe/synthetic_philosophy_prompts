  Looking at Elena's opening move: she claims dark matter is pseudo-science because scientists can always adjust the distribution to fit any observation. That's a classic Popperian concern about immunization against falsification. But is this fair to how astrophysics actually works? I recall that Popper himself worried about such "conventionalist stratagems."

  Then Marcus counters with the Bullet Cluster evidence - this seems strong because it's a novel prediction that worked. The mass separating from visible matter isn't something you'd expect from modified gravity theories. This feels like a good Lakatosian "progressive problemshift" example. 

  But Elena's rebuttal is clever - she shifts to asking what would falsify dark matter. That's the core of Popper's demarcation criterion. If no observation could disprove it because you can always tweak auxiliary assumptions, that's problematic. I remember Duhem and Quine both wrote about this underdetermination problem.

  Marcus then brings up the Neptune example beautifully - showing how saving hypotheses can lead to real discoveries. And his appeal to Lakatos' "progressive vs degenerating" distinction seems appropriate here. But Elena's Vulcan counterexample is equally brilliant - showing how the same strategy can fail.

