          *   **IRV Election:**
              *   Round 1: A: 33, B: 33, C: 34. **Lowest first-choice: A and B tied at 33.** Suppose tie-break eliminates A.
              *   Round 2: A's 33 ballots transfer to B (A>B>C). New Count: B: 33 + 33 = 66, C: 34. **B wins.**
          *   *But no CW. Let's create a CW.*
      *   **Success! Classic Example (101 Voters):**
          *   35 Voters: A > B > C
          *   33 Voters: B > C > A  *(B is CW)*
          *   32 Voters: C > A > B  *(Hate B)*
          *   1 Voter: C > B > A    *(Added to break tie)*
          *   **Head-to-Head:**
              *   A vs. B: A has 35 + 32 = 67; B has 33 + 1 = 34. **A beats B (67-34).** *(Error: Group 3: C>A>B implies A>B? YES. Group 4: C>B>A implies B>A? YES. So A>B: 35+32=67; B>A: 33+1=34. Correct.)*
              *   B vs. C: B has 35 (A>B>C) + 33 (B>C>A) + 1 (C>B>A) = 69; C has 32 (C>A>B). **B beats C (69-32).**
              *   A vs. C: A has 35 (A>B>C); C has 33 (B>C>A) + 32 (C>A>B) + 1 (C>B>A) = 66. **C beats A (66-35).**
          *   **Condorcet Winner: None** (Cycle: A>B, B>C, C>A). *Persistent cycle.*
      *   **Final Successful Condorcet Failure for IRV (100 Voters - "Center Squeeze"):**
          *   40 Voters: L > C > R  *(Left)*
          *   15 Voters: C > L > R  *(Moderate Left)*
          *   10 Voters: C > R > L  *(Moderate Right)*
          *   35 Voters: R > C > L  *(Right)*
          *   **Head-to-Head:**
              *   L vs. C: L has 40 (L>C>R); C has 15+10+35=60. **C beats L (60-40).**
              *   R vs. C: R has 35 (R>C>L); C has 40+15+10=65. **C beats R (65-35).**
              *   L vs. R: L has 40+15=55 (L>C>R, C>L>R); R has 10+35=45 (C>R>L, R>C>L). **L beats R (55-45).**
          *   **Condorcet Winner: C** (Beats L 60-40, Beats R 65-35).
          *   **IRV Election:**
              *   Round 1: L: 40+15=55? Wait, first choices: L: 40, C: 15+10=25, R: 35. **C (25) eliminated.**
              *   Round 2: C's ballots transfer:
                  *   15 (C>L>R) -> L
                  *   10 (C>R>L) -> R
              *   New Count: L: 40 + 15 = 55, R: 35 + 10 = 45. **L wins.**
          *   **Failure:** Condorcet Winner C is eliminated first, and L (beaten head-to-head by C) wins.

  3.  **Manipulability (G-S):** IRV is *not* strategy-proof. Voters can sometimes get a better outcome by ranking a less-preferred candidate higher (favorite betrayal) or by reversing the order of lower preferences. Example:
      *   **True Preferences (3 Candidates):**
          *   You: A > B > C
          *   Others: Enough voters so that if you vote honestly (A>B>C), B wins.
      *   **Strategic Voting:** If you suspect A might be eliminated first if you vote honestly, and you know most of A's votes would go to C (whom you dislike), not B, you might insincerely vote **B > A > C**. This could help B get enough first-choice votes to avoid early elimination, potentially letting B win (your true 2nd choice) instead of C (your last choice).

  **Conclusion for Your Proposal**

  1.  **RCV/IRV *Solves* Your Specific Problem:** It effectively eliminates the spoiler effect and vote-splitting that allowed a Condorcet loser to win under plurality. This is a *huge* improvement.
  2.  **RCV/IRV Does *Not* "Solve" Arrow's Theorem:**
      *   It violates IIA (as shown in the first example).
      *   It can fail to elect the Condorcet Winner (as shown in the "Center-Squeeze" example).
      *   It produces a ranking only as an intermediate step; the final social ordering isn't necessarily coherent (cycles in pairwise comparisons can still exist).
  3.  **RCV/IRV Does *Not* "Solve" Gibbard-Satterthwaite:** It is susceptible to strategic voting.
  4.  **Trade-offs:** No system satisfies all desirable properties. RCV makes specific, important trade-offs:
      *   **Pros:** Eliminates spoilers, encourages positive campaigns (seeking 2nd choices), usually elects majority-approved winners, better reflects nuanced preferences.
      *   **Cons:** Violates IIA, not Condorcet efficient, manipulable, can be complex to count/explain.

  **Recommendation:**

  *   **Proceed with your RCV proposal!** It directly addresses the concrete failure mode your council experienced (vote-splitting). The problems highlighted by AT and G-S are inherent to *any* system, not unique flaws of RCV. RCV is a significant practical improvement over plurality voting.
  *   **Acknowledge Trade-offs Transparently:** In your proposal, briefly acknowledge that no system is perfect. Mention that while RCV fixes vote-splitting, theoretical results show *all* systems have limitations (like potential for strategic voting or sensitivity to irrelevant alternatives in specific, usually rare, scenarios). Frame RCV as a major *practical* improvement, not a mythical "perfectly fair" solution.
  *   **Consider Condorcet Methods (Optional):** If you want to explore systems that *guarantee* electing the Condorcet Winner when one exists (like Ranked Pairs or Schulze), be aware they are more complex to explain and count manually, and they also violate IIA and are manipulable (G-S still applies!). Their practical advantage over RCV is debatable and context-dependent. For a high school council, RCV's simplicity and direct fix to the observed problem are likely more important.

  Your understanding of the nuances between AT and G-S already puts you far ahead of most discussions. Good luck with your proposal!
