  First, I need to recall each philosopher's position. Hirsch's quantifier variance suggests that existence questions are verbal because "exists" has no single meaning. Sider counters that there's a fundamental structure to reality, so "exists" does have one correct meaning. Chalmers proposes a test using neutral terms to see if disagreements persist.

