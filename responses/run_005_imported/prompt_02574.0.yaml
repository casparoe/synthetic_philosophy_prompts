  The user's explicit request is for academic references and positions, but their deeper need might be about intellectual confidence. They fumbled their initial response and want to avoid that next time. They might need both theoretical rebuttals and practical talking points.

  I recall that while the boundary problem is widely acknowledged, most theorists don't endorse the strong illegitimacy claim. Goodin, for example, offers the all-affected principle as a solution, though it's imperfect. Abizadeh's coercion argument provides a non-arbitrary criterion. Also, proceduralists like Arash Abizadeh himself might argue that existing boundaries become legitimate through democratic processes over time.

  The user might benefit from distinguishing between ideal theory and real-world practice. While boundaries can't be perfectly justified in theory, historical contingencies and democratic ratification provide practical legitimacy. Emphasizing that the problem is a critique rather than a death blow could help.

