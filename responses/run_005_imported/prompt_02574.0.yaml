answer: |-
  That postdoc threw a serious theoretical grenade! The boundary problem absolutely *is* a deep challenge to democratic legitimacy, and their "all democracies are strictly illegitimate" conclusion is a logically coherent, if deeply unsettling, position derived from it. However, **it is *not* the mainstream conclusion**, and most theorists offer ways to "thread the needle" without biting that bullet entirely. Here's a breakdown of the landscape, key positions, and responses:

  **1. The Core Problem & the "Nuclear Option":**

  *   **Whelan's Framing:** Frederick Whelan's classic piece ("Prologue: Democratic Theory and the Boundary Problem," *Nomos XXV: Liberal Democracy*, 1983) brilliantly exposed the circularity: To decide *who* gets to vote on the boundaries (the composition of the demos), you *already* need a demos. Any initial decision rule (e.g., resident adults) seems arbitrary without prior democratic authorization.
  *   **The "Illegitimacy" Argument:** The postdoc's claim follows directly: If the foundational act of constituting the demos cannot itself be democratically legitimate (because there's no prior demos to authorize it), then *all* subsequent acts of that democracy (laws, elections, constitutions) inherit that foundational illegitimacy. They rest on an arbitrary exclusion. This is sometimes called the "bootstrapping problem" or the "constitutive paradox."
  *   **Apparent Implication:** "Government by the consent of the governed" is impossible because "the governed" can only be defined *after* the governing structure is imposed, using criteria that weren't consented to by those excluded. Consent requires a pre-defined "self" that consents, but democracy needs to *create* that "self."

  **2. Why Most Theorists Reject the "All Illegitimate" Conclusion (Threading the Needle):**

  Theorists generally accept the *existence* of the problem but argue it doesn't necessarily lead to total illegitimacy. Here are the main strategies:

  *   **a) Rejecting Strict Proceduralism / Embracing Non-Procedural Criteria:** This is the most common response.
      *   **The Argument:** Democracy isn't *only* about procedure; it also requires substantive values like justice, freedom, or avoiding domination. The initial boundary *must* be set using non-democratic, normative criteria. This doesn't make it "arbitrary" in the sense of *unjustified*, just non-democratically *founded*.
      *   **Key Criteria Proposed:**
          *   **The All-Affected Principle (Goodin):** Robert Goodin ("Enfranchising All Affected Interests, and Its Alternatives," *Philosophy & Public Affairs*, 2007) argues the demos should include everyone whose interests are significantly affected by the collective decisions. This provides a *principled*, non-circular (though practically difficult) criterion. The *current* demos might not perfectly match this, but it provides a standard for critique and reform. Legitimacy is aspirational, not binary.
          *   **The Coercion Principle (Abizadeh - *as a critique*, not endorsement):** Arash Abizadeh ("Democratic Theory and Border Coercion: No Right to Unilaterally Control Your Own Borders," *Political Theory*, 2008) famously argued that because borders coercively exclude, *all* those subject to potential exclusion (i.e., non-citizens too) should have a say in border policies. Crucially, he uses this to *critique* existing boundaries but **not** to declare all democracies illegitimate. Instead, he argues for more inclusive procedures *based on the principle that coercion requires justification to those coerced*. This provides a non-circular *normative* standard (anti-domination) for evaluating boundaries.
          *   **Historical/Cultural/Practical Necessity:** Many (implicitly or explicitly) argue that *some* bounded community is necessary for collective action. Boundaries emerge historically through shared territory, language, culture, or struggle. While not "pure" democratic justification, this provides a *functional* and *contextual* justification. Legitimacy accrues over time through the *functioning* of the democracy *within* that boundary, even if the initial boundary wasn't democratically set. Thinkers like David Miller or Michael Walzer lean towards this pragmatic view.

  *   **b) Democratic Iteration / Ratification:** (e.g., Seyla Benhabib)
      *   **The Argument:** While the *initial* boundary might be set non-democratically (through history, force, etc.), its *ongoing legitimacy* depends on the *democratic process itself*. The existing demos can, through its democratic procedures, *ratify*, *reform*, or *redefine* the boundaries over time. The boundary becomes legitimate *ex post* through democratic endorsement and the ability to contest it *within* the (imperfectly constituted) system. This emphasizes process and contestation over a mythical pure founding moment.

  *   **c) Relational Equality / Non-Domination:** (e.g., Elizabeth Anderson, Philip Pettit)
      *   **The Argument:** Democracy's core purpose is to establish relationships of equality among citizens and prevent domination. The legitimacy of the boundary depends on whether the *relationships* it creates *within* the demos are egalitarian and non-dominating, and whether the treatment of those *outside* the boundary is justifiable on non-dominating grounds (e.g., respecting human rights, fair terms of interaction). The focus shifts from the *act of founding* to the *quality of relationships* sustained by the bounded political community.

  *   **d) Accepting a "Second-Best" Legitimacy:** Many simply acknowledge that while the *ideal* justification is impossible, existing democracies achieve a sufficient level of legitimacy through:
      *   **Consent of the Included:** The *current* members consent to the system and its boundaries (even if the excluded didn't consent to their exclusion).
      *   **Comparative Legitimacy:** They are vastly more legitimate than non-democratic alternatives *in practice*.
      *   **Functional Necessity:** Some bounded unit is necessary, and existing units function reasonably well. Perfection is the enemy of the good.

  **3. Where the Theorists Stand (Generally):**

  *   **Whelan:** Exposed the problem starkly. Didn't necessarily endorse the "all illegitimate" conclusion, but emphasized its intractability within pure proceduralism.
  *   **Goodin:** Strong advocate for the **All-Affected Principle** as the solution. Believes it provides the necessary non-circular, normative criterion. Sees it as a demanding standard, not a description of reality, but the basis for legitimacy claims.
  *   **Abizadeh:** Uses the boundary problem **critically** (especially via the coercion principle) to argue against unilateral border control and for more inclusive procedures. **Rejects** the idea that existing democracies are *entirely* illegitimate, but argues their legitimacy is *diminished* by unjustified exclusions and that reform is normatively required. His work highlights the *ongoing* nature of the problem, not just the founding moment.
  *   **Benhabib:** Champions **Democratic Iteration** as the way forward. Existing boundaries gain legitimacy through democratic contestation and reform *within* them.
  *   **Anderson/Pettit:** Focus on **Relational Equality/Non-Domination** as the core democratic value, against which boundaries must be assessed based on the relationships they foster.

  **How to Respond (Threading Your Needle):**

  1.  **Acknowledge the Strength:** "You're absolutely right that Whelan exposed a profound constitutive paradox. The logical force of the 'bootstrapping problem' is undeniable, and it shows why no democracy can claim a perfectly pure, non-circular foundational legitimacy."
  2.  **Reject the Nuclear Conclusion:** "However, most democratic theorists don't conclude that this renders all existing democracies 'strictly illegitimate.' Instead, they argue we need to shift our understanding of legitimacy:"
  3.  **Outline the Alternatives (Pick 1-2):**
      *   "**Goodin** and others argue legitimacy requires striving towards the **'all-affected' principle**, providing a non-procedural, normative standard. Our current boundaries are legitimate *to the extent* they approximate this ideal and can be reformed towards it."
      *   "**Abizadeh** shows how the problem persists *ongoingly* through coercion, demanding justification to the affected. This doesn't make the *whole system* illegitimate, but highlights specific exclusions (like border control) that *undermine* legitimacy and need reform."
      *   "Thinkers like **Benhabib** emphasize **democratic iteration**. While the initial boundary might be contingent, its *ongoing* legitimacy stems from the ability of the *current* demos to debate, contest, and democratically ratify or change those boundaries over time."
      *   "Others (**Anderson, Pettit**) ground legitimacy in **relational equality/non-domination** within the demos and just treatment of outsiders. The boundary is legitimate if it fosters the right kind of civic relationships and avoids unjust domination across it."
  4.  **Emphasize Practicality & Function:** "Furthermore, most theorists accept that *some* bounded unit is a practical necessity for collective self-government. While the ideal justification is elusive, legitimacy accrues through the *functioning* of a democratic process that respects rights, allows contestation, and strives towards greater inclusion *within its context*. It's a 'second-best' legitimacy, but far from 'nothing'."
  5.  **Conclude:** "So, the boundary problem is a devastating *critique* exposing the non-democratic origins of *all* demoi and the ongoing challenge of justification. It means democratic legitimacy is always *imperfect*, *contingent*, and requires *ongoing justification* through inclusive practice and reform – not that it's wholly fictitious or absent. It pushes us towards more inclusion and reflexivity, not paralysis."

  **Key Takeaway:** The boundary problem proves that democratic legitimacy **cannot be perfectly pure or self-founded**. It *is* "resting on" something non-democratic (history, force, normative claims). But theorists argue this doesn't mean it's resting on *nothing*. It rests on **normative principles** (all-affected, non-domination), **democratic practice over time** (iteration, ratification), and **functional necessity**. Legitimacy becomes a matter of degree, aspiration, and ongoing contestation, rather than a binary state achievable only through a mythical pure democratic founding. The postdoc's view is a powerful logical endpoint, but most find it politically and normatively untenable, opting instead for messier, more pragmatic, but still meaningful, conceptions of legitimacy. Good luck in the reading group – you've got this now!
