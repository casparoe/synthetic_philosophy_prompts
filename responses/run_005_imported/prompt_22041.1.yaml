answer: |-
  Your approach is commendable – resisting the later myth of "Goethe the Nationalist" is crucial for authenticity. Goethe's actual stance in 1813 was far more complex and ambivalent than Körner's fervent patriotism. Here's a breakdown of his convictions and how they'd shape his words and conduct, plus ideas for a dramatically compelling yet grounded scene:

  **Goethe's Core Convictions & Attitudes (1813):**

  1.  **Profound Ambivalence Towards Napoleon:**
      *   **Admiration:** Goethe deeply admired Napoleon as a world-historical figure ("Weltrichter"), a force of nature, and a guarantor of order (post-Revolutionary chaos terrified him). He appreciated aspects of the Napoleonic Code and French administrative efficiency. Their 1808 meeting in Erfurt was a high point for Goethe personally.
      *   **Resentment:** He resented the occupation, French cultural arrogance, the Continental System's economic damage, and the conscription of German men (including Weimar citizens). The looting of Weimar in 1806 was a personal trauma.
      *   **Pragmatism:** He believed resisting Napoleon was futile madness until the disastrous Russian campaign (1812) shifted the balance. Even then, he saw the *cost* of liberation.

  2.  **Skepticism of Nationalist Fervor ("Teutomania"):**
      *   **Cosmopolitanism:** Goethe was fundamentally a cosmopolitan. He valued *Weltliteratur* (world literature) over narrow nationalism. German culture, for him, was part of a larger European tradition. He feared nationalist frenzy would destroy this.
      *   **Distrust of the "Mob":** He shared the era's aristocratic fear of popular uprising and "demagoguery." The *Turnvater Jahn* movement and student *Burschenschaften* seemed dangerously radical and irrational to him. He saw patriotism easily sliding into xenophobia and chaos.
      *   **Critique of Simplistic Rhetoric:** He despised the simplistic, jingoistic poetry of the *Befreiungskriege* (like Körner's). He found it artistically crude and intellectually dishonest.

  3.  **Focus on Cultural Continuity & Inner Development ("Bildung"):**
      *   **Art Over Politics:** His primary allegiance was to art, science, and personal cultivation. He believed true German identity resided in its cultural achievements (like his own work, Bach, Beethoven, Kant, Schiller) rather than political unification or military glory.
      *   **Order & Stability:** Above all, he craved order and stability necessary for cultural and intellectual work. Whether under Napoleon or a restored German prince, stability was paramount. War, regardless of the cause, threatened this.
      *   **Grief & Withdrawal:** 1813 was personally difficult. His wife Christiane died in June 1816, but her health was declining earlier. His close friend Wieland died in 1813. He retreated into scientific studies (color theory, geology) and work on *West-östlicher Divan* as an escape/response.

  4.  **Pragmatic Loyalty to Weimar:** His loyalty was to Duke Carl August and the Duchy of Saxe-Weimar-Eisenach. He served the state as a minister. Carl August *did* join the anti-Napoleonic coalition in 1813. Goethe wouldn't publicly undermine his Duke, but his private reservations were well-known.

  **How This Shapes Words & Conduct (Avoiding the "Körner" Trope):**

  *   **NOT Writing Patriotic Verse:** He famously **refused** requests to write stirring war poetry. When Ernst Moritz Arndt asked, Goethe reportedly said, *"Shake your chains; the man is too big for you, you will not break them."* He saw the calls for such verse as vulgar and inappropriate for him.
  *   **Public Reserve & Private Criticism:** He would likely be publicly correct, perhaps attending a *Te Deum* for a coalition victory if the Duke did, but avoid overt displays of enthusiasm. Privately (in letters, conversations with intimates like Zelter, Riemer, or Eckermann later), he'd express skepticism, worry about the cost, and critique the nationalist rhetoric.
  *   **Focus on Suffering & Cost:** His reaction to war news would likely emphasize the human suffering (refugees, wounded soldiers, economic hardship) rather than glorious victories. He might quote his own *Hermann und Dorothea* about the horrors of displacement.
  *   **Defensive of French Culture:** He might pointedly defend French literature or philosophy in conversation if others were dismissing everything French. He wouldn't renounce his cosmopolitan outlook.
  *   **Withdrawal into Work:** His primary response might be to *intensify* his non-political work – burying himself in *Divan* (exploring Persian poetry as a counterpoint), science, or revisiting *Faust* – as a statement of cultural continuity *beyond* the immediate conflict.
  *   **Irony & Ambivalence:** His comments might be laced with irony, historical perspective, or expressions of profound sadness rather than fiery zeal. He might reference classical antiquity (e.g., the futility of war) or draw parallels to other historical upheavals.

  **Dramatic Scene Ideas Grounded in History:**

  1.  **The Refusal:** Instead of him *joining* the fervor, show him being *pressured* to join it and *refusing*. A delegation of students or fervent patriots (perhaps including a fictional admirer of Körner) visits him, full of zeal, expecting the "national poet" to bless their cause with a poem or a speech. Show his discomfort, his polite but firm refusal, his articulation of why he *can't* (not won't, but *can't* artistically or intellectually) write that kind of verse. He might offer a profound, complex observation on the nature of conflict or the cost of freedom that deflates their simplistic enthusiasm. *Conflict:* Idealism vs. Realism/Cynicism? Youth vs. Age/Experience? Nationalism vs. Cosmopolitanism.
  2.  **The Observer of Chaos:** Set the scene *during* a moment of local upheaval – refugees fleeing fighting, wounded soldiers arriving in Weimar, news of a nearby battle. Show Goethe observing this, perhaps from his window or during a walk. Focus on his reaction to the *human cost*. He might help quietly (organizing aid through his position) but express deep sorrow and skepticism about the ultimate gain. He could have a conversation with a pragmatic officer or a terrified citizen, revealing his focus on stability and order. *Conflict:* Patriotism vs. Human Suffering? Action vs. Reflection? Ideology vs. Reality.
  3.  **The Conversation with a Confidant:** A private scene with Zelter (his composer friend), Riemer (his secretary), or Duke Carl August himself. Here, he can voice his true ambivalence: admiration for Napoleon's past genius mixed with condemnation of his current tyranny, respect for the Duke's political necessity mixed with fear of the popular forces unleashed, disgust at the crude propaganda, grief over personal losses, and a fierce defense of the cultural values he feels are under threat from *both* sides. *Conflict:* Duty vs. Conscience? Loyalty vs. Intellectual Honesty? Realpolitik vs. Idealism? The challenge of the artist in wartime.
  4.  **The "Kotzebue Incident" (or similar):** August von Kotzebue, a conservative playwright (and later Russian agent), was a vocal critic of the nationalist students. In 1813, tensions were high. Show Goethe reacting to news of student protests or harassment of someone like Kotzebue (or a fictional conservative figure). This allows him to express his profound distrust of the radical nationalist fervor, his fear of mob rule and suppression of free thought, even while the *cause* might be ostensibly the one his Duke supports. *Conflict:* Freedom from Napoleon vs. Freedom of Thought/Expression? Revolutionary Zeal vs. Conservative Order? Ends vs. Means.

  **Key Elements for Authenticity in the Scene:**

  *   **Avoid Simplistic Patriotism:** His words should be complex, nuanced, often ambivalent or critical, never rallying cries.
  *   **Emphasize Cost & Suffering:** His perspective should highlight the human and cultural price of war.
  *   **Show Cosmopolitanism:** Have him reference French or other non-German cultural figures positively.
  *   **Use His Actual Voice:** Incorporate his known aphoristic style, classical references, and themes (e.g., *Entsagung* - renunciation, *Polarität* - polarity, the demonic force of history).
  *   **Contextualize His Isolation:** Show him aware that his views are unpopular, perhaps causing friction even with friends. Reference the *real* criticism he faced (e.g., being called "un-German").
  *   **Connect to His Work:** Link his state of mind to his actual activities in 1813 – working on the *Divan*, science, grieving Christiane/Wieland.
  *   **Quote Him (Carefully):** Use fragments of his *actual* documented comments from the period, like his famous line to Falk about the war being a conflict where one side fights for the iron glove, the other to tear it off, and neither understands they could just *shake hands*.

  **The Dramatic Payoff:** The power of the scene comes *not* from Goethe becoming a standard-bearer, but from showing the **cost of his position** – his isolation, his unpopular courage in refusing the easy path of nationalist fervor, his profound sadness at the destruction, and his fierce, almost stubborn, commitment to his cosmopolitan and humanistic ideals in the face of overwhelming pressure. It makes him a more complex, historically accurate, and ultimately more dramatically interesting figure than the mythical nationalist icon. He becomes the embodiment of a different kind of German spirit – the *Kulturnation* (cultural nation) versus the *Staatsnation* (political nation) – wrestling with the tumultuous birth of the latter.
