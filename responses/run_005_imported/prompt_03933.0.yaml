  so in my phil of language seminar we just went from Quine's radical translation to Davidson's radical interpretation, and honestly they seem like the same thought experiment just rebranded — both are about an interpreter with zero background info trying to figure out meaning completely from scratch. doesnt that mean Davidson is basically just accepting Quine's conclusion that theres no real fact about what a person's words mean, and the principle of charity is just his name for how we arbitrarily settle on a translation anyway? my professor said this is a common mix up but didn't really explain why, so could you break down what Davidson's actually doing differently?
