  Worried the physics might distract? No, the user invited non-sphere settings. And the equipment failure rationalizes why they'd notice such symmetry. The real challenge was avoiding any property difference until the climax - had to triple-check distances, angles, even dialogue tags to preserve indistinguishability. 

