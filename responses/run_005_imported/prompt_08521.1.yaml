answer: |-
  ## Whiteboard Duel: Bohmian vs. Everettian After Bell's Seminar

  *(The seminar room is emptying. Whiteboards still bear the scars of Bell's inequalities and quantum circuits. ALASTAIR (Everettian) and BEATRICE (Bohmist) linger, markers in hand, the intellectual adrenaline still high.)*

  **Beatrice:** (Tapping the CHSH inequality `|S| ≤ 2`) See? *This* is the smoking gun. Bell didn't just kill local *hidden* variables; he killed local *causality*. The experiments confirm it. Nature *is* nonlocal. Bohm accepts it – the particle *here* feels the position *there*, instantly, via the quantum potential. Honesty in the equations.

  **Alistair:** (Snorts) "Honesty"? More like baggage! You're grafting 19th-century billiard balls onto a fundamentally wave-based theory. Everett *dissolves* the problem. Bell assumes a single outcome – that's the poisoned chalice! Drop that, let the superposition *branch*, and the correlations emerge *locally* within each branch. Deutsch-Hayden shows it: information accessible *locally* never outruns light. No spooky action, just the unitary evolution respecting Lorentz invariance.

  **Beatrice:** "Dissolves"? Sounds like evasion. How does branching *here* magically coordinate with branching *there* to give perfect anti-correlation in spacelike separated measurements? Without *some* connection? Jarrett nailed it: `P(A|B,λ,a,b) = P(A|λ,a)` must hold – that's Parameter Independence. If the setting `b` chosen *there* can't influence the *probability* of outcome `A` *here* when `λ` is fixed, you avoid superluminal signalling. But Bohm *violates* Parameter Independence! `P(A|λ,a,b)` *does* depend on `b`! Because the actual particle configuration `λ` – the hidden variable – *is* the positions, and the guiding equation makes the velocity *here* depend instantaneously on positions *there*. It’s explicit nonlocality.

  **Alistair:** (Writes `P(A|B,λ,a,b) = P(A|λ,a)` on the board) *Parameter Independence* is about the *settings* not influencing distant *probabilities*. Everett *obeys* it! In any *one* branch, the outcome `A` depends *only* on the local state (`λ` effectively being the local wavefunction component) and the local setting `a`. The correlation comes from the pre-existing entanglement encoded *locally* in the wavefunction at each point. Deutsch-Hayden’s delocalized `q` bits prove this – all information about distant settings/outcomes is locally present, propagated at lightspeed. Violating Parameter Independence would allow signalling, which Bohm *can't* do and QM forbids.

  **Beatrice:** But Everett violates *Outcome Independence*! `P(A|B,λ,a,b) ≠ P(A|λ,a,b)`! In Jarrett's terms, knowing the *outcome* `B` *there* changes the probability of `A` *here*, even with `λ` fixed. That’s nonlocality too! In your branching picture, learning `B` collapses *your* perspective to a branch where `A` is correlated. But *how* does the measurement outcome *there* instantly select the branch *here* without nonlocal influence? You haven’t escaped nonlocality; you’ve hidden it in the branching mechanism itself!

  **Alistair:** No! Outcome Independence *is* violated, but *only* because learning `B` changes your *knowledge* about which branch you're in. It doesn't mean a physical influence travelled! The branches were *already there*, correlated *locally* at the time of entanglement creation. The wavefunction evolution is local and causal. The "nonlocality" is epistemic – about updating your state of *knowledge* of the global wavefunction, which *is* holistic. But *dynamics*? Strictly local. The 2015 loophole-free experiments slammed the door on *any* local *single-outcome* theory. They didn't touch unitary many-worlds.

  **Beatrice:** (Points fiercely at the wavefunction Ψ on the board) Holistic? That's the understatement of the century! Your entire ontology is this *thing* – Ψ – living in a 3N-dimensional *configuration space*, not spacetime! How is *that* local? When Alice measures her electron spin in London, the entire wavefunction, including Bob's electron in Tokyo, *instantly* branches. The physical state describing Bob's electron *changes* instantly based on what Alice did, even though Bob hasn't measured yet! You say "it was always there," but the *definite state* Bob experiences depends on Alice's action light-years away. Isn't *that* nonlocality in all but name? What does "locality" even mean if the fundamental object isn't in spacetime?

  **Alistair:** (Takes a breath) Fair challenge. The wavefunction *is* global. But locality isn't about the ontology's *arena*; it's about *causal influence* and *signalling*. No experiment allows Alice to *force* a particular outcome for Bob faster than light by her choice of setting or outcome. The statistics are Lorentz invariant. The *experience* within a branch is consistent with local causality. Yes, Ψ is holistic, but its *dynamics* are local differential equations (Schrödinger, Dirac) – changes propagate at `c`. The branching isn't a *dynamical* change; it's a *re-description* of what was already encoded locally. Bohm puts nonlocality *in the dynamics* – explicit FTL dependence in the guiding equation. *That's* the killer. How do you even define velocity in curved spacetime without a *preferred foliation*? You need God's clock! Everett doesn't.

  **Beatrice:** (Leans on the board) The preferred foliation *is* awkward. Maybe it's dynamical, maybe it’s fundamental. But it's *honest* about the nonlocality Bell *proves* exists. Your "locality" feels semantic. You preserve "no signalling" – fine. But you have instantaneous, objective, physical changes in the *reality* of distant parts of the universe (the branching) based on local actions. Bohm has instantaneous, objective, physical *influences* on local beables. Both seem nonlocal! Bell showed we *must* give up *something* deeply intuitive. Bohm gives up *locality* in dynamics to keep *single, definite outcomes*. Everett gives up *single, definite outcomes* to keep *local dynamics*. I think Bell forces the first choice. The experiments show definite outcomes *here*, correlated nonlocally with *there*. Bohm explains that directly. Your branching is metaphysically extravagant to save a locality principle that feels hollowed out.

  **Alistair:** Extravagant? Compared to adding invisible particles *and* a nonlocal pilot wave *and* a preferred slicing of spacetime? The extravagance is yours! Locality isn't hollowed out; it's clarified. The *only* operational signature of nonlocality would be FTL signalling, which is forbidden. Everything else – the holistic wavefunction, the branching – is just the structure of quantum reality. Bell shows we must give up *naive realism* about single outcomes, not locality. Bohm clings to naive realism at the cost of manifest nonlocality. The loophole-free experiments just make Everett *more* compelling – they rule out the last hiding places for local *collapse*.

  **Beatrice:** Compelling? You replace a clear nonlocal connection with... pervasive reality splitting? And call *that* local? Bell proved *something* nonlocal happens. In Bohm, it's explicit in the equations. In Everett, it's swept under the rug of branching. I'll take the explicit nonlocality. At least I know where the body is buried.

  **Alistair:** And I'll take a local, unitary dynamics without needing to bury anything! The "body" is the illusion of a single world. Bell buried *that*. Bohm resurrects it as a zombie, shambling along via nonlocal pushes. Everett lets it rest and builds a new world – many worlds – on truly local foundations.

  *(They stare at each other, then at the whiteboard, littered with `Ψ`, inequalities, and question marks. The cleaner rattles the door. Neither has conceded an inch. The fundamental disagreement is laid bare: Is the cost of definite outcomes (Bohm's explicit nonlocality & preferred foliation) worse than the cost of no definite single outcome (Everett's holistic wavefunction & branching)? Bell forces a choice; it doesn't dictate which one.)*

  **Beatrice:** (Gathering bag) Same time next seminar? Schrödinger's cat? I'll bring the poison.

  **Alistair:** (Smiling grimly) I'll bring the Geiger counter. And the whiteboard pens. We're not done.

  *(They exit, leaving the quantum conundrum unresolved on the whiteboard, shimmering like a superposition.)*
