  But wait - isn't the nervousness a utility change? No, if we model it as affecting outcomes (success probability) rather than utilities. The utility for success remains constant, but the state-space probabilities shift upon learning.

  Ah, careful: the decision problem must stay fixed. The nervousness effect means that when low skill is known, P(success|low skill, good luck) drops to 0. But if unknown, it's positive. This violates the "fixed decision problem" because the outcome mapping changes with evidence acquisition. Exactly! 

  So in the example:
  - Initial EU(Attempt) is positive because sometimes succeeds with unknown low skill
  - After learning low skill: EU(Attempt) drops to 0 (always fails due to nerves)
  - After learning high skill: EU(Attempt) rises

  The expected value of learning is negative if P(low skill) is high enough. But this breaks Good's theorem by making the success probability depend on whether evidence was acquired.

  The user will appreciate how this looks like a violation but actually exploits the fixed-decision-problem assumption. Students see that "fixed decision problem" means no evidence-contingent changes to outcome probabilities.

