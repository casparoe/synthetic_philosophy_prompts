  The reason is that after the first update, the conditional probabilities for the second evidence depend on the new posterior. The weights (like P(D|E)) change because the underlying probabilities have shifted. In standard conditionalization, when evidence is certain, updating sets P(E)=1, and future updates are conditioned on E, so the order doesn't matter because each step fixes part of the probability space. But with uncertain updates, each Jeffrey update redistributes probabilities without fixing the evidence, so subsequent updates use different baselines. 

  The user's intuition that the same info should lead to the same place assumes that the way evidence affects beliefs is context-independent. But in Jeffrey, the interpretation of later evidence depends on current beliefs, which are shaped by prior updates. So order matters because each update changes the lens through which further evidence is viewed. 

