  Next, the social media analogy. The user says online groups fit Weil's criteria even better because social media is designed for passion and conformity, with growth metrics as explicit goals. That makes sense. Platforms thrive on engagement, which often means amplifying outrage and creating echo chambers. The lack of formal structure might make these dynamics more extreme, as algorithms push viral content and in-group policing happens organically. Examples like Twitter pile-ons or subreddit dogpiles come to mind. The user's extension holds up here, but it's worth noting that online groups are more fluid than traditional parties, which could affect how the dynamics play out.

  Now, the weak point: wouldn't abolishing parties just lead to informal factions with the same issues? The user calls this a Moloch problem. Weil's response might involve cultivating individual virtue and institutions that promote truth-seeking. She emphasizes education and reflection over structural fixes alone. But is that realistic? The user is right that informal groups could replicate party flaws. However, without centralized power, maybe these factions would be less stable and more open to change. Still, human nature tends toward tribalism, so the coordination problem remains.

