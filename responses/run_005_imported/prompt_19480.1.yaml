  Okay, the user is a journalist who's been researching discount rates in climate models and long-term planning. They're stuck on explaining the "pure rate of time preference" part of the Ramsey rule. Ramsey himself thought it was indefensible, and philosophers agree it's a cop-out. The user wants the strongest argument for why discounting future well-being purely because it's in the future might be defensible. They also want to know why this doesn't apply to spatial distance.

  First, I need to recall the Ramsey rule. It breaks down the discount rate into two parts: one for richer future generations (consumption elasticity) and the pure time preference. The user's sources keep conflating other factors like existential risk, but the user wants a justification for pure time preference alone.

  The user mentioned that philosophers dismiss pure time preference as a failure of imagination. So, the challenge is to build a rigorous argument that stands without smuggling in uncertainty or other factors. Also, they want to address the spatial vs. temporal distance objection. Why discount time but not space?

  Let me think about possible arguments. One angle is agent-relative ethics. Parfit's work on personal identity over time might be relevant. If future people are different, maybe their welfare isn't as directly connected to the present agent. But that might not hold ethically. Another approach is epistemic: we can't know future preferences, so we discount. But that's not pure; it's about uncertainty.

  What about the separateness of persons? Rawls and others argue that individuals are distinct, so sacrificing for others isn't required. But that applies spatially too. The key is temporal agency. The present generation's responsibility is to their contemporaries, and future generations will have their own agents. So, discounting future well-being because it's not the present agent's responsibility. That might differentiate time from space because spatial others coexist, so their needs are simultaneous.

  Also, intergenerational sovereignty: each generation has the right to prioritize its own projects. Future people aren't here to advocate for themselves, but that's not a reason to discount; it might even be a reason to preserve more. But the sovereignty argument says current agents aren't trustees for the future; they have their own autonomy.

  Need to ensure this doesn't justify selfishness. The argument should include that we still have duties to not harm future generations, but positive sacrifices might be discounted. For example, not destroying the environment vs. actively investing in their wealth.

  Then, the spatial comparison. Spatial others are contemporaries, so they're part of the current moral community. Obligations to them are immediate because they exist now. Future people don't exist yet, so the relationship is different. Temporal distance involves a different kind of moral patient relationship. Also, we can interact with spatial others now, but not with future ones.

  But is that convincing? A philosopher might argue that existence now vs. later shouldn't matter ethically. The user wants the strongest counter. Perhaps emphasizing agency: moral actions happen in the present, so obligations are anchored to the present context. Future benefits are abstract because they can't be reciprocated or directly affected. That's a practical reason, but maybe not purely ethical.

  Another point: diminishing marginal ethical weight. Just like consumption, each additional unit of ethical concern might matter less over time? But that seems arbitrary. Instead, the argument from moral psychology: humans naturally discount the future, so policies must account for that to be feasible. But Ramsey would call that a failure, not a justification.

  Need to stick to ethical defensibility. The best bet is the agency and sovereignty angle. Present agents have the right to set their own priorities, and future agents will do the same. So pure time preference reflects the ethical autonomy of each generation. That doesn't apply spatially because those people are here now, so ignoring them violates current obligations.

  Also, addressing the non-identity problem: future people are different individuals, so their interests aren't directly comparable. But again, that might not hold under scrutiny.

  Finally, structure the argument: start with the ethical distinction based on agency, then sovereignty, then why space is different. Acknowledge the counterarguments but present it as the strongest possible case. The user needs this for balance, so it has to be rigorous even if controversial.
answer: |-
  Here's the strongest possible case for a positive pure rate of time preference (PRTP), constructed as a rigorous ethical and rational argument, explicitly excluding survival risk, uncertainty about preferences, or non-identity problems. It also directly addresses the spatial distance objection. While controversial (and arguably still vulnerable to Ramsey/Sidgwick-style critiques), this represents the most coherent defense grounded in agency, sovereignty, and the nature of temporal existence.

  **The Core Argument: Agency, Sovereignty, and the Asymmetry of Time**

  1.  **The Primacy of Present Agency:** Ethical decisions are made *by* and *for* specific moral agents *in the present*. The present generation is the only locus of actual moral agency *right now*. Future generations, while possessing intrinsic moral value, are not *currently existing agents*. They are potential agents whose specific identities, values, and circumstances are contingent upon present actions.
  2.  **Intergenerational Sovereignty:** Each generation possesses a degree of legitimate sovereignty over its own resources and collective life. This sovereignty implies the right to prioritize its own constitutive projects, well-being, and immediate obligations *without being enslaved to the potentially infinite demands of an indefinite future*. Sacrificing current essential well-being or abandoning core projects *solely* for the benefit of vastly richer future people (who are not yet in existence) constitutes an infringement on this generational sovereignty.
  3.  **The Non-Reciprocity and Asymmetry of Time:** Temporal distance is fundamentally different from spatial distance due to the *irreversible direction of causation and existence*.
      *   **Time:** We can act *upon* the future, but the future cannot act *upon* us. Future generations cannot reciprocate, negotiate, or share burdens with us. Our relationship to them is purely one of causation (we affect them), not interaction. This asymmetry creates a qualitatively different ethical relationship.
      *   **Space:** Spatially distant contemporaries *do* exist simultaneously. While interaction might be limited, reciprocal obligations *are possible* (e.g., trade, aid treaties, shared global systems). They are part of a global moral community existing *now*. Ignoring their suffering due *only* to distance violates the principle of impartiality among *existing* moral patients. We share a common temporal frame and can, in principle, interact.
  4.  **PRTP as the Guardian of Sovereignty and Agency:** A small positive PRTP (e.g., 0.1%-1%) is the *mathematical embodiment* of this generational sovereignty and the ethical weight of present agency against the abstract potential of the future. It does **not** mean future well-being is worthless. It means:
      *   **Threshold Effect:** Present sacrifices imposing significant hardship or preventing the realization of essential current projects require stronger justification than equivalent benefits to vastly richer future people. PRTP provides this threshold.
      *   **Avoiding "Serfdom to the Future":** Without PRTP, the logic of maximizing aggregate discounted utility can demand crushing present sacrifices (e.g., near-starvation) to invest in projects benefiting people centuries hence who might be orders of magnitude wealthier. This treats the present generation merely as a means to future ends, violating its status as ends-in-themselves with their own sovereign time.
      *   **Focus on Robust Obligations:** Our strongest duties to the future are negative (avoiding irreversible harm, existential risk) and ensuring basic just institutions can be sustained. PRTP primarily affects *positive* sacrifices for *marginal gains* to already wealthy future generations, not core preservation duties.

  **Addressing the Spatial Distance Objection Head-On:**

  *   **The Key Difference is Simultaneous Existence and Potential Reciprocity:** Spatially distant people *exist now*. They are actual, not potential, moral patients within our shared temporal reality. Ethical principles like impartiality demand that their suffering counts equally to suffering nearby, *all else being equal* (e.g., certainty, magnitude). Distance might affect *feasibility* or *cost-effectiveness* of aid, but this is a practical constraint on *acting*, not an ethical discount on the *value* of their well-being itself. Discounting solely based on spatial distance is arbitrary discrimination against existing persons based on location.
  *   **Temporal Distance Involves Non-Existence:** Discounting the well-being of future generations *purely due to temporal distance* is not discrimination against existing persons. It is an acknowledgment that the ethical claims of *not-yet-existing* potential persons, while real, are qualitatively different and potentially less *immediately binding* on present agents than the claims of contemporaries. The asymmetry of time (causation without interaction) justifies this distinction in a way spatial distance does not.
  *   **The "All Else Equal" Trap:** The objection often assumes "all else equal" between spatial and temporal distance. But the core argument asserts that temporal distance *isn't* equal to spatial distance *ethically* because of agency, sovereignty, and existence. "All else" is *not* equal. Time introduces a fundamental existential asymmetry that space does not.

  **Why this is "Pure" Time Preference:**

  This argument deliberately excludes:
  *   **Risk of Non-Survival:** The discount applies even if we are 100% certain civilization will survive and the benefit will occur.
  *   **Changing Preferences/Technology:** The discount applies even if we know future preferences and the marginal utility of consumption remains constant (η=0 in the Ramsey rule).
  *   **Non-Identity:** The discount applies even if the same individuals *would* exist regardless (avoiding Parfit's problem).
  *   **Myopia/Irrationality:** While human psychology might *reflect* this, the argument is presented as a rational ethical justification for collective policy, not a descriptive fact of human failing.

  **Strengths and Acknowledged Vulnerabilities:**

  *   **Strength:** It provides a principled, non-arbitrary ethical foundation for PRTP rooted in agency and sovereignty, directly addresses the spatial analogy, and avoids smuggling in uncertainty or risk. It resonates with intuitions about generational self-determination.
  *   **Vulnerability (Ramsey/Sidgwick Counter):** Critics will argue this still fails Ramsey's test. If future well-being is intrinsically valuable, *when* it occurs is irrelevant. Sacrificing agency *now* might be justified if the future gain is immense. Granting sovereignty could be seen as licensing selfishness. The asymmetry of time might be factual but not ethically decisive – our duty is to value well-being impartially, regardless of when it occurs.
  *   **Vulnerability (Demandingness):** The argument concedes that zero PRTP is "too demanding" but frames this demand as an *ethical violation* of present generations, not just a pragmatic adjustment. Critics argue true impartiality *is* demanding and that's the point.

  **Conclusion for Your Readers:**

  The strongest defense of pure time preference argues that a small positive rate is an ethical necessity, not a mathematical convenience or a failure of imagination. It safeguards the present generation's legitimate sovereignty and agency against the potentially infinite, non-reciprocal demands of a future populated by people who do not yet exist and whose specific circumstances are contingent. This distinguishes it fundamentally from spatial distance, where contemporaries exist *now* and form part of a shared moral community with potential for reciprocity. While philosophers like Ramsey and Sidgwick find discounting future well-being solely because it's future "ethically indefensible," this agency/sovereignty argument contends that *failing* to acknowledge a small PRTP is ethically indefensible, as it subordinates the lived reality and self-determination of present people to the abstract potential of a future they will never see. It's a claim about the rightful ethical boundaries *between* generations, not a denial of future value. This tension – impartiality vs. generational sovereignty – lies at the heart of the debate.
