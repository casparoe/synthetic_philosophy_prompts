  *Scratches head* The tricky part is Aristotle's hierarchy of soul functions. For him, nutrition/growth/reproduction (the "nutritive soul") is the baseline life-force—plants have this without sensation. A brain-dead body performing digestion and wound healing seems to exhibit exactly that. But Aristotle insists the heart is the central organ for all vital functions, including nutrition. If the heart's beating independently... wait, does that matter? 

  *Flips through imaginary De Anima notes* Ah! Crucially, for Aristotle, the heart isn't just a pump—it's the primary organ (prōton organon) housing the "connate pneuma" that mediates soul functions. The brain is literally a cooling radiator. So if the heart beats without brain input, it might still sustain nutritive life. 

  But then the ventilator problem: Is this "natural" unity? Aristotle would despise external mechanical sustenance. In Parts of Animals, he mocks artifacts as "heaps" lacking internal unity. Yet... if the heart autonomously maintains homeostasis, is the ventilator merely assisting like crutches? 

  *Pauses* Big realization: Shewmon's cases of bodies gestating pregnancies are devastating for Aristotle too. Generation is the pinnacle of nutritive soul activity. If a brain-dead body can grow a fetus, that screams "alive" under his framework. 

