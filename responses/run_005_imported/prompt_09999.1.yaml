  First, I need to break down the user's explicit requests. They want questions on three main points: the reliability of conceivability regarding phenomenal states, the gap in phenomenal concepts versus natural kind terms, and the paradox of phenomenal judgment. Each needs a follow-up to counter expected responses. Also, they want a closing question on falsifiability.

  The user mentions the guest's tactic of deflecting to physicalism's problems. So, each question must corner her into addressing the specific issue without letting her broaden it. For example, when asking about conceivability, the follow-up should challenge why her framework isn't similarly affected by historical failures of modal intuitions.

  For the Kripkean point, the key is why phenomenal concepts lack the primary/secondary intension gap. The follow-up should push if this special treatment is ad hoc. The paradox of judgment question needs to force her to explain how consciousness adds explanatory value if zombies report identically. The follow-up could question the causal efficacy of consciousness.

  The closing falsifiability question should press her to name concrete evidence that would make her abandon her position, preventing her from retreating to unfalsifiability.

  I should ensure each question is precise, references specific arguments, and anticipates her dodges. Structuring them with a main question and a prepared follow-up will keep the pressure on. Also, framing some questions as "why should we accept X in your case but not others" can block the deflection tactic. Need to make sure the questions are sharp and backed by philosophical depth to challenge her expertise without being confrontational.
answer: |-
  Here are ten tightly-constructed questions designed to pin down the zombie argument's vulnerabilities, anticipate the "problem for physicalists too" dodge, and force engagement with the core issues you've identified. Each primary question targets a critical pressure point, with a pre-loaded follow-up keyed to likely responses:

  **Core Tension: Reliability of Modal Intuitions**
  1.  **Primary:** "You rely heavily on 'ideal, positive, primary conceivability' establishing possibility. But history shows our modal intuitions are spectacularly unreliable about fundamental ontology (e.g., imagining empty space as necessary, continuous matter, vitalism). Given that phenomenal consciousness *is* arguably the hardest problem, why should we trust this specific modal intuition here, where our cognitive limitations seem most pronounced, especially when physicalism *predicts* this intuition should feel compelling even if false?"
      *   *Likely Dodge/Response:* "Physicalists also rely on conceivability/possibility links in other areas (e.g., thought experiments)."
      *   **Follow-Up:** "But the physicalist isn't typically using conceivability *alone* to establish fundamental ontology *against* overwhelming empirical correlation. The issue is the *unique weight* placed on this *one specific intuition* to overturn a massively successful research program. If modal intuitions fail elsewhere when probing deep ontology, isn't granting *this one* immunity simply privileging the hypothesis? Doesn't the physicalist have a *positive reason* (explanatory success) to be skeptical of this intuition, while your argument *depends entirely* on its infallibility?"

  **The Kripkean Gap & Phenomenal Concepts**
  2.  **Primary:** "Kripke showed how conceiving 'water isn't H2O' only establishes the possibility of something *epistemically like water* not being H2O (secondary intension), not the metaphysical impossibility of water=H2O (primary intension). The standard reply is that phenomenal concepts lack this gap – knowing 'what it's like' gives you the essence directly. But *why* can't a physicalist argue that knowing 'what it's like' is knowing an *epistemic role* (how it feels, how it affects belief/behavior) which *could*, like 'water', be realized differently in different scenarios? What *positively* blocks the application of the Kripkean move to phenomenal concepts?"
      *   *Likely Dodge/Response:* "Phenomenal concepts are direct recognitional concepts; they present their referent transparently. Physicalists can't explain this transparency if consciousness is physical."
      *   **Follow-Up:** "But isn't the claim of 'transparency' or 'direct grasp of essence' precisely what's at issue? If the physicalist argues that the 'direct feel' *is* the cognitive/functional role being played by the physical state (its 'mode of presentation'), and that this role *could conceivably* be played differently (hence zombies), haven't you just *assumed* the falsity of physicalism in your account of phenomenal concepts? How do you *argue* for transparency/essential grasp *without* begging the question against the physicalist who sees the 'feel' as constituted by the role?"

  **The Paradox of Phenomenal Judgment**
  3.  **Primary:** "If my zombie twin is physically identical, it will *sincerely report* having rich phenomenal experiences, offer identical justifications ('I just know introspectively!'), write papers defending qualia, and protest if called a zombie. Given this, what *explanatory work* is left for *actual* phenomenal consciousness to do in accounting for *my* reports, judgments, and beliefs *about* my consciousness? Doesn't the zombie case suggest phenomenal consciousness is *explanatorily inert* with respect to our phenomenal *judgments*?"
      *   *Likely Dodge/Response:* "Well, the physicalist faces the same problem explaining why we *have* phenomenal consciousness if it's causally idle, or they have to deny its existence altogether!"
      *   **Follow-Up:** "That *seems* like a dodge, because the problem bites *differently*. The physicalist *can* posit that phenomenal consciousness *is* identical to the physical/functional states that *do* cause the reports, thus explaining the reports *and* the consciousness simultaneously. Your view posits an *extra*, non-physical property *that doesn't add any causal oomph* to the reporting mechanism already fully explained physically. Doesn't this make phenomenal consciousness, on your view, a truly 'idle wheel' – not just causally isolated from the physical (as per the argument), but *explanatorily redundant* even in the realm of our *own* mental discourse about it? How is that an advantage?"

  **Deepening the Conceivability Issue (Variation)**
  4.  **Primary:** "Chalmers often contrasts the 'hard problem' with 'easy problems' solvable by explaining structure/function. But isn't the conceivability of zombies *itself* parasitic on our ability to conceive of all structural/functional properties being duplicated *without* the 'what it's like'? If we fundamentally *misconceive* the nature of the physical (e.g., if physical properties intrinsically have a proto-phenomenal nature, or if 'structure/function' at base *necessitates* phenomenality), might the zombie scenario not be ideally conceivable *at all*, but only appear so due to our cognitive limitations?"
      *   *Likely Dodge/Response:* "Physicalists haven't shown any such entailment, and we *can* clearly conceive of the functional duplicate without experience. Claiming we can't is just hand-waving."
      *   **Follow-Up:** "But isn't the burden on *you* to show that the conceivability is ideal and primary? If the physicalist offers a hypothesis (like Russellian monism or a novel identity) where the physical base *logically necessitates* phenomenality in a way we currently fail to grasp conceptually (just as a 2D being might fail to grasp 3D necessity), doesn't your argument simply *assume* such hypotheses are false by assuming the conceivability of zombies is ideal? How do you rule out that our current inability to see the entailment isn't analogous to the 2D being's inability?"

  **The "Problem for Physicalists Too" Meta-Point**
  5.  **Primary:** "A core strategy in your defense is to deflect critiques by saying 'that's a problem for physicalists too.' But doesn't this tactic risk making your position *unfalsifiable*? If every apparent weakness in the zombie argument can be reframed as a general problem of consciousness (which physicalists also face), what specific, unique vulnerability *does* the conceivability argument possess that could count against *it*, rather than just against *every* theory of consciousness?"
      *   *Likely Dodge/Response:* "The argument *creates* the problem for physicalism! Its strength *is* that it reveals an unsolvable problem *for them*. The vulnerabilities lie in whether the premises hold."
      *   **Follow-Up:** "Precisely. So let's isolate *your* premises. If a critique successfully shows that 'ideal primary conceivability entails metaphysical possibility' is *unreliable specifically in the phenomenal domain* (Q1), or that phenomenal concepts *do* exhibit a Kripkean gap (Q2), or that the argument entails an unacceptable paradox of judgment (Q3), shouldn't those count as *unique* problems *for your argument*, showing its *specific* mechanism fails, regardless of the general difficulties of consciousness? Doesn't deflecting to the physicalist's problems prevent a clear assessment of *your argument's* validity?"

  **Closing: Falsifiability**
  6.  **Primary:** "Let's make it concrete. What specific discovery or argument *would* convince you that the zombie argument, specifically the inference from ideal primary conceivability to metaphysical possibility *as applied to consciousness*, is unsound? What evidence could the physicalist present, or what flaw in the reasoning could be demonstrated, that you would accept as definitively refuting *this* argument (even if you remained a dualist)?" *(Force a concrete answer)*
      *   *Likely Dodge/Response:* "If physicalism could *explain* consciousness, or show why zombies are *inconceivable*, or close the explanatory gap..."
      *   **Follow-Up:** "But those seem like refutations of *physicalism*, not necessarily of *this argument*. The conceivability argument claims a *logical path* from conceivability to possibility to non-identity. If a physicalist *didn't* explain consciousness but demonstrated that our conceivability faculty is *systematically unreliable* in this domain in a way analogous to past failures (e.g., via neuroscience of modal cognition showing inherent limitations), or provided a compelling model showing *how* phenomenal concepts *must* have a Kripkean gap despite appearances, *without* first explaining consciousness – wouldn't that directly attack the *premises* of *your* argument? If *nothing* short of a full physicalist explanation of consciousness counts as refuting *this logical argument*, doesn't that make the argument effectively unfalsifiable on its own terms?"

  **Key Design Principles Used:**

  *   **Pre-empting the Dodge:** Questions are phrased to force engagement with the *specific mechanism* of the zombie argument (conceivability -> possibility, unique nature of phenomenal concepts, explanatory role of consciousness). Follow-ups explicitly call out the deflection tactic ("That *seems* like a dodge...", "But isn't the burden on *you*...") and refocus on the argument's *unique* commitments.
  *   **Burden Shifting:** Places the onus on the proponent to *positively defend* key assumptions (reliability of *this* modal intuition, essential grasp of phenomenal concepts, explanatory role of non-physical qualia).
  *   **Isolating the Argument:** Distinguishes critiques of the *zombie argument itself* from the general problem of consciousness, preventing easy deflection to physicalist difficulties.
  *   **Highlighting Costs:** Emphasizes the argument's potentially problematic implications (explanatory idleness of consciousness, unfalsifiability).
  *   **Forcing Specificity:** The closing question demands concrete falsification criteria.
  *   **Leveraging Physicalist Strengths:** Uses physicalism's explanatory successes and the history of failed modal intuitions as a contrast, not just as a target.

  Good luck with the interview! This setup should make it much harder for her to comfortably restate the argument without engaging its deep tensions. Be prepared to firmly but politely redirect if she tries the dodge – have your follow-up ready to deploy.
