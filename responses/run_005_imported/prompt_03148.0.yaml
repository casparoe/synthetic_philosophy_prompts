answer: |-
  You've zeroed in on a fundamental tension in Tolstoy's argument that many scholars grapple with. It *seems* contradictory, but Tolstoy is trying to build a two-tiered hierarchy. Here's how he attempts (with debatable success) to reconcile Chapters 15 and 16:

  1.  **Chapter 15: Defining ART vs. NON-ART (The "Infection" Criterion):**
      *   Here, Tolstoy is establishing the *minimum essential requirement* for something to be considered Art *at all*.
      *   "Infection" (the sincere, involuntary transmission of feeling from artist to audience) is the *sine qua non*. Without it, it's simply not art.
      *   **"Excellence" in this context refers to *artistic potency*:** How effectively does it perform its core function of infecting? A highly infectious work is "excellent *as art*" purely in terms of its communicative power, *regardless of the feeling conveyed*. A work that infects strongly is artistically "better" *than a less infectious work*.

  2.  **Chapter 16: Evaluating GOOD ART vs. BAD ART (The Moral/Religious Criterion):**
      *   Having established *what art is* (infectious communication of feeling), Tolstoy now asks: **What makes art *good* or *bad* for humanity?**
      *   This is where the "quality of the feelings" becomes paramount. Art is too powerful to be judged solely on its infectiousness. It must be evaluated based on the *moral and spiritual value* of the feelings it transmits.
      *   **"Goodness/Badness" here refers to *moral value and social utility*.** Art transmitting feelings flowing from the "religious perception" of universal brotherhood and love (his specific Christian ideal) is *good art*. Art transmitting feelings contrary to this (like exclusive patriotism, sensual lust, despair, or mere amusement for the elite) is *bad art*, regardless of how infectious it is.
      *   **Highly infectious "bad art" is especially dangerous:** Tolstoy would argue that a patriotic anthem or erotic poem can be *powerfully infectious* (making it "excellent" *as art* by the Ch. 15 standard) but precisely *because* it's so infectious, its morally harmful feelings are even more pernicious, making it "bad art" by the Ch. 16 standard.

  **How He Attempts to Fit Them Together (The Hierarchy):**

  1.  **Step 1 (Ch. 15): Is it Art?** Apply the "infection" test. If it infects, it *is* art. Its degree of infectiousness measures its *artistic excellence* (its power *as communication*).
  2.  **Step 2 (Ch. 16): What Kind of Art is it?** Evaluate the *feeling* transmitted against the standard of "religious perception." This determines its *moral goodness* and ultimate value to humanity.
      *   **Good Art:** Infectious *and* transmits feelings of universal love/brotherhood.
      *   **Bad Art:** Infectious *but* transmits feelings contrary to universal love/brotherhood (patriotism, lust, despair, class division, etc.).
      *   **Non-Art:** Fails the infection test.

  **Resolving the Apparent Contradiction:**

  *   **"Excellence" vs. "Goodness":** Tolstoy uses "excellence" in Ch. 15 specifically for *artistic power* (infectiousness). He uses "good/bad" in Ch. 16 for *moral value*. They are related but distinct criteria within his overall evaluation.
  *   **"Sole Measure" is Qualified:** When he says infectiousness is the "sole measure of excellence *in art*," he adds the crucial caveat: "*speaking now apart from its subject-matter, i.e., not considering the quality of the feelings it transmits*." He explicitly brackets off the moral evaluation for that specific point. Ch. 16 then addresses the bracketed part.
  *   **The Analogy:** Think of a powerful speaker. Their *excellence as a speaker* might be judged by how clearly, forcefully, and persuasively they communicate (infectiousness). However, *what* they are persuading people *of* (the content) determines whether they are a *good* speaker (promoting truth, justice) or a *bad* speaker (promoting hatred, lies), regardless of their oratorical skill. For Tolstoy, the moral content is inseparable from the final judgment of the art's value.

  **Why it Feels Contradictory & Criticisms:**

  1.  **Shifting Grounds:** He initially presents infectiousness as the "sole measure" of excellence, then immediately introduces a far more important measure (moral content) that can override the first.
  2.  **Minimizing Artistic Power:** By condemning highly infectious art he deems immoral, he effectively dismisses its core artistic achievement (its infectiousness) as irrelevant or even negative in the final judgment. This feels like moving the goalposts.
  3.  **Subjectivity of "Religious Perception":** His standard for "good" feelings is highly specific and debatable. What he calls "bad art" (patriotic anthems, erotic poetry, much of Shakespeare/Wagner/Beethoven) is considered profound art by others. His moral filter is arbitrary by modern (and many historical) standards.
  4.  **Tension Unsolved:** Ultimately, the tension remains. He wants infectiousness to be the defining characteristic of art *and* the measure of its artistic excellence, yet simultaneously insists that morally "bad" art, no matter how infectious, is fundamentally worthless or harmful. He struggles to fully reconcile the formal power of art with his rigid moralism.

  **In short:** Tolstoy uses infectiousness to define art and measure its *communicative power* ("excellence as art"). He then uses the moral/religious content of the transmitted feeling to judge its *ultimate value and goodness* ("good art" vs. "bad art"). Highly infectious "bad art" is, for him, artistically potent but morally reprehensible and socially dangerous. While he structures it as a hierarchy (Step 1: Is it art? Step 2: What kind?), the moral criterion inevitably overshadows and seemingly contradicts the initial primacy he gives to infectiousness as the "sole measure" of artistic excellence. This tension is a core feature (and weakness) of his argument. Your professor likely expects you to identify and grapple with this very tension!
