prompt: |-
  So this happened at trivia night about a month ago and it's honestly still bugging me. My friend Jenna told our whole table, dead straight-faced, that the Sydney Opera House was designed by an Australian architect -- not "I think" or "pretty sure," just stated it like a flat fact. Turns out it's Danish (Jorn Utzon, if I'm spelling that right), we lost the tiebreaker because of it, and it turned into this whole argument at the bar afterward about whether she'd actually done anything wrong. She kept insisting she wasn't lying, because she genuinely believed it at the time, she'd just misremembered it from some documentary. My boyfriend's take was "if you don't know something you shouldn't say it like you know it," Jenna's take was "believing it is all any of us can ever go on, so back off." Nobody budged and it kind of killed the vibe for the rest of the night -- I definitly didn't expect bar trivia to turn into a whole epistemology crisis.

  Being me, I went and googled the argument afterward (not the opera house, the actual argument), and it turns out there's a whole real subfield of epistemology about exactly this, called "norms of assertion" -- basically, what has to be true of you for it to be okay to just flat-out assert something instead of hedging it. There's a camp that says you need to actually know it, a camp that says it only matters whether it's true regardless of what's going on in your head, and a camp that says you just need to be justified or reasonable in believing it even if it turns out false. I saw people using lottery tickets and something called Moore's paradox as ammo for one side, and something a philosopher named Jennifer Lackey called "selfless assertion" as a problem case for the others, but I couldn't follow it well enough to know who's actually winning. Could you write me an essay that goes through this properly: lay out the strongest version of each view (plus any other serious contender I'm clearly missing), use the standard test cases to show where each one breaks down, and then don't leave me with a wishy-washy "it's complicated" ending -- actually pick one and defend it, the way you'd have to if someone made you the judge of whether Jenna was in the wrong.
