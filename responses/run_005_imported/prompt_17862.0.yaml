answer: |-
  ## The Sydney Opera House Affair: An Epistemic Verdict

  Your trivia night perfectly encapsulates a profound philosophical debate about the rules governing our speech acts. Let's dissect the main contenders in the "norms of assertion" arena, test them against standard cases, and deliver a decisive verdict on Jenna.

  **The Core Positions:**

  1.  **The Knowledge Norm (KN):**
      *   **Strongest Version (Timothy Williamson, Keith DeRose):** You are permitted to flat-out assert that P *only if* you *know* that P. Knowledge is the unique norm governing assertion. Asserting P without knowing P is inherently wrong, regardless of truth or justification.
      *   **Rationale:** Assertion purports to give others knowledge. Presenting something as known when you don't know it is a fundamental betrayal of the social practice. It invites others to rely on your word unjustifiably. KN explains why we criticize guesses stated as facts and why we retract assertions proven false (we realize we *didn't* know).
      *   **Strengths:** Highly intuitive ("Don't say it if you don't *know* it!"), explains retraction upon discovering falsity, captures the high-stakes nature of assertion (like testimony in court), explains the absurdity of Moorean Paradoxes ("P is true, but I don't know P").
      *   **Test Case Breakdowns:**
          *   **Lottery:** You hold ticket #347 in a fair 1000-ticket lottery. Before the draw, you assert, "My ticket (#347) is a loser." Statistically, this is overwhelmingly likely to be *true* and you are *justified* in believing it. Yet, intuitively, it feels wrong to flatly assert "It lost" *before* the draw. KN explains this: You don't *know* it lost until the draw happens. All you know is the odds.
          *   **Selfless Assertion (Jennifer Lackey):** A creationist biology teacher, who personally *disbelieves* evolution but possesses excellent scientific training and understands the overwhelming evidence, tells her class, "Evolution by natural selection is a well-established scientific fact." According to KN, she asserts wrongly because she doesn't *believe* it, hence doesn't *know* it. Yet, intuitively, her assertion seems *correct* and even *praiseworthy* – she's conveying knowledge *despite* her personal belief. KN struggles here.
          *   **Jenna's Case:** KN condemns Jenna. She asserted P ("Opera House designed by an Aussie"). She didn't know P (it was false). Therefore, her assertion violated the norm, regardless of her belief or justification.

  2.  **The Truth Norm (TN):**
      *   **Strongest Version (Paul Weiner, Matthew Weiner):** You are permitted to flat-out assert that P *only if* P is *true*. The truth value of the proposition is the sole determinant of correctness.
      *   **Rationale:** The primary purpose of assertion is to state facts. If you state a fact, you've succeeded, regardless of your mental state. If you state a falsehood, you've failed, regardless of how justified you were.
      *   **Strengths:** Simple, objective, emphasizes the core goal of conveying truth. Easily explains why we criticize false assertions.
      *   **Test Case Breakdowns:**
          *   **Lottery:** TN *permits* asserting "My ticket lost" before the draw *if it actually is the losing ticket*. This clashes badly with intuition – asserting this before the result is reckless, even if accidentally true. TN struggles to explain *why* it feels reckless.
          *   **Reckless Guesses:** Imagine someone wildly guesses the answer to a trivia question ("The capital of Australia? Uh... Perth!") and states it confidently. If, by sheer luck, Perth *were* the capital, TN would say the assertion was correct. This seems deeply counterintuitive – the speaker was irresponsible.
          *   **Jenna's Case:** TN condemns Jenna *only because her assertion was false*. If, by some bizarre twist of history, an Australian *had* designed it, TN would say her assertion was perfectly fine, even if her "documentary" memory was a fever dream and she had no justification. This absolves her of any epistemic responsibility.

  3.  **The Justified Belief / Reasonable Belief Norm (JBN/RBN):**
      *   **Strongest Version (Jennifer Lackey, Peter Graham):** You are permitted to flat-out assert that P *only if* you are *justified in believing* P (or it is *reasonable* for you to believe P), regardless of whether P is actually true or whether you ultimately *know* P. The speaker's epistemic position at the time of assertion is key.
      *   **Rationale:** We can only control our evidence and reasoning, not the truth itself or the elusive state of "knowledge." Assertion should reflect responsible inquiry. Blaming someone for a justified false belief is unfair. Praising someone for a lucky guess is wrong.
      *   **Strengths:** Accords with how we often treat people who make honest mistakes based on good evidence ("You weren't to know!"). Handles the **Selfless Assertion** case beautifully: The teacher is *justified* in believing evolution based on her training/evidence, so her assertion is correct *even though she personally disbelieves it*. Explains why we criticize reckless assertions even if true (they weren't justified).
      *   **Test Case Breakdowns:**
          *   **Lottery:** JBN likely *condemns* asserting "My ticket lost" before the draw. While statistical probability provides *some* justification, it usually isn't considered *sufficient* justification for flat-out assertion about a specific contingent event where counter-evidence (winning) is still live. You lack conclusive evidence.
          *   **Moorean Paradox ("P but I don't believe P"):** JBN struggles. You might be *justified* in believing P based on evidence, yet simultaneously aware of your own psychological doubt. Asserting "P but I don't believe P" is absurd. KN explains this easily: You assert P, implying you know it, but the second clause denies belief, which is necessary for knowledge. JBN lacks a similarly crisp explanation.
          *   **Jenna's Case:** JBN's verdict hinges entirely on Jenna's justification. *If* her memory of the documentary was reasonably clear and reliable (e.g., she watched it recently, it was a reputable source, she has a good memory), then her assertion was justified and therefore permissible, even though false. *If* her memory was fuzzy, the documentary was sketchy, or she conflated sources, then her justification was poor, and her assertion was impermissible.

  **The Verdict: Jenna Was Wrong (A Modified Knowledge Norm Wins)**

  After weighing the arguments and test cases, the strongest and most defensible norm is a **Contextually Sensitive Knowledge Norm (CSKN)**.

  *   **Core Principle:** Flat-out assertion *prima facie* requires knowledge. Asserting P properly presents P *as known by you*.
  *   **Why KN Beats TN:** Truth alone is insufficient. TN licenses reckless guesses and fails to explain the lottery intuition or the wrongness of asserting without adequate grounds, even if accidentally true (like the Perth guess). Assertion isn't just about uttering truths; it's about *vouching* for them based on your epistemic position.
  *   **Why KN Beats JBN:** While JBN handles the Selfless Assertion case well, it ultimately sets the bar too low for assertion. Justified belief is necessary *for* knowledge, but not sufficient *for* the act of assertion. Assertion carries a stronger commitment than "I have good reason to think this." The absurdity of Moorean assertions ("P is true but I don't believe/know it") highlights that assertion inherently *purports* knowledge. JBN struggles to explain why we feel misled when someone asserts a justified false belief – the speaker presented it *as known*, not just *as reasonably believed*.
  *   **Addressing Selfless Assertion (The KN Challenge):** This is the strongest counter. However, the creationist teacher case is highly specialized. In *almost all* normal conversational contexts (like trivia night!), asserting P while *disbelieving* P is deeply improper and deceptive. The teacher case succeeds *because* she is acting within a specific institutional role that *obligates* her to convey the consensus knowledge *despite* personal belief. Her assertion effectively means "The scientific community knows P," not "I personally know P." This is an exception proving the rule: in standard contexts, asserting P implies *your own* knowledge.
  *   **Contextual Sensitivity:** The *stakes* and *context* matter. In casual chat ("I think the cafe closes at 8"), weaker epistemic positions can be hedged appropriately. In high-stakes contexts (trivia tiebreakers, medical advice, testimony) or when stated flatly without hedging ("The architect *was* Australian"), the demand for knowledge is paramount. Jenna asserted flatly in a high-stakes trivia context. The norm was breached.

  **Applying CSKN to Jenna:**

  1.  **Assertion Type:** Jenna made a flat, unhedged assertion ("The Sydney Opera House was designed by an Australian architect"). This presents the claim *as known*.
  2.  **Epistemic Position:** She did not *know* this claim. It was false. Her belief, even if based on a misremembered documentary, did not rise to the level of knowledge (knowledge requires truth + belief + justification - Gettier cases aside, the falsity alone negates it here).
  3.  **Context:** Trivia night, specifically a tiebreaker question. Stakes are relatively high within that social game. Reliance on answers is implicit.
  4.  **Wrongness:** By flatly asserting P without knowing P, Jenna misrepresented her epistemic position. She invited her team to rely on her word *as if* she possessed knowledge she did not have. This directly caused their loss. Her genuine belief is irrelevant to the *norm violation*; it only potentially mitigates *blameworthiness* (she wasn't *lying*, just mistaken). The assertion itself was epistemically improper.

  **Conclusion:**

  While Jenna wasn't lying, she violated the core norm governing flat assertion: she presented as known something she did not know. Your boyfriend's maxim ("if you don't know something you shouldn't say it like you know it") captures the essence of the Contextually Sensitive Knowledge Norm. In the high-stakes, reliance-heavy context of a trivia tiebreaker, confidently stating an incorrect fact as undeniable truth is epistemically irresponsible, regardless of sincerity. Genuine belief is necessary for honest assertion, but it is not sufficient for the strong commitment conveyed by a flat, unhedged "P." Knowledge, or at least its contextual equivalent where appropriate hedging reflects uncertainty, is the required standard. Jenna was wrong.
