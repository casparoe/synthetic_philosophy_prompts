  Hanson uses the hard steps to estimate the total time available for life. Each step has a constant probability per unit time, so the time between steps is exponentially distributed. The fact that we appeared after only half the available time (since the universe became habitable) implies that the remaining time is limited by grabby aliens' expansion.

  I should explain the math simply. If there are, say, 10 hard steps, and we've used about half the time, that suggests the last step is forced to happen soon. But why? Because if there were more time, we'd expect to appear later. Since we're early, the universe must end soon for life—but not with a literal end, but with grabby aliens dominating.

  The user mentioned the "deadline coming" – that's the grabby aliens' expansion filling the galaxy. Once they cover everything, no new civilizations can arise. So our early appearance hints that this saturation is imminent on a cosmic scale.

  I need to clarify the distinction between grabby aliens (loud, expanding) and quiet ones. Quiet aliens don't affect the timeline because they don't expand or prevent others. Only grabby aliens create a deadline by taking over space.

  Also, the user might be missing that without grabby aliens, we'd likely appear later. Our earliness is evidence that the window is closing. The hard steps model quantifies this probability.

  I should walk through an example with numbers. Suppose 10 hard steps, each taking about 1 billion years on average. If the universe is habitable for 100 billion years, we'd expect to appear around step 5 at 50 billion years. But we appeared at 13.8 billion, which is early. That inconsistency suggests the habitable period is shorter, not because the universe ends, but because grabby aliens will dominate soon.

  The user's gut says "we're a fluke," but the argument counters that by showing that flukes would still happen later on average if there were more time. Our earliness requires an explanation beyond chance.

