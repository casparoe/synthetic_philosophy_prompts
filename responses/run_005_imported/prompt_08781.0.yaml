answer: |-
  You've hit on a profound and hotly debated tension in decision theory. The difference between EDT and FDT/TDT isn't merely semantic—it surfaces in key edge cases where the theories diverge—though the *motivation* for one-boxing shares similarities. Let's break this down:

  ### 1. **Why EDT One-Boxes (and Its Fatal Flaw)**
     - EDT says: Choose the act with the highest *conditional expected utility*: `EU(A) = Σ [P(Outcome|A) * Utility(Outcome)]`.
     - In Newcomb's: `P($1M in opaque box | One-box)` is high (you're likely the type Omega predicts correctly), while `P($1M | Two-box)` is low.
     - **Problem**: EDT is *acausal*. It cares about correlation, not control. This fails catastrophically in:
       - **The Smoking Lesion**: Smoking correlates with cancer, but doesn't cause it (a lesion causes both). EDT avoids smoking (good correlation!), ignoring that quitting won't prevent cancer.
       - **Death in Damascus**: If Death waits in whichever city you *won't* choose, EDT flees toward Death because fleeing correlates with Death being there.

  ### 2. **FDT/TDT's Subjunctive Repair**
     - FDT asks: "What would my *decision algorithm* output *if* it were faced with this logical relation?"
     - In Newcomb's, Omega isn't predicting your physical motion—it's predicting your *decision algorithm*. Your choice *logically determines* (via Omega's perfect prediction) the content of the box.
     - **Key distinction**: FDT treats your decision as a *function* in a larger computation. One-boxing isn't just evidence—it's the *logical output* that, when run by Omega, causes the $1M to exist.

  ### 3. **Where EDT and FDT Diverge (Concretely)**
     - **Transparent Newcomb**:
       - You *see* $1M in the opaque box. EDT two-boxes (taking both is now evidence you'll get $1M+$1K). FDT one-boxes (your algorithm's *type* ensured the $1M was placed; deviating destroys this logic for future copies).
     - **Parfit's Hitchhiker**:
       - Driver rescues you in the desert iff you *promise* to pay later. EDT pays (paying correlates with being rescued), but if you're already rescued, EDT reneges (no future correlation). FDT pays because your algorithm's *precommitment* caused rescue.
     - **Counterfactual Mugging**:
       - Omega asks for $100 if a coin was tails (you lose nothing if heads). If tails, EDT refuses (paying $100 correlates with losing money). FDT pays—its algorithm honors the deal to incentivize Omega's games.

  ### 4. **Why Yudkowsky Rejected EDT**
     - EDT fails *reflective consistency*: Agents following EDT often regret their own decision rules (e.g., in Death in Damascus, EDT wishes it used FDT).
     - EDT allows *self-sabotage*: If you can precommit to irrationality (e.g., "I'll pay you $10 to ignore all evidence about me"), EDT exploits this, while FDT avoids pathological self-modification.
     - **The core insight**: FDT isn't about evidence—it's about *which computation you are logically implementing*. Your choice isn't a passive signal; it's an output that plugs into a larger logical structure.

  ### 5. **Is "Logical Correlation" Just Rebottled EDT?**
     - Superficially, yes: Both see one-boxing as "good news." But FDT escapes EDT's traps by:
       - Treating correlation as *causal via logical necessity* (Omega's prediction *depends* on your algorithm's output).
       - Demanding *algorithmic stability* across counterfactuals (your choice must be optimal even if you know Omega's prediction).
     - **Rebranding?** Partly. But FDT's formalism handles problems EDT cannot, reframing "evidence" as *logical control* over abstract dependencies.

  ### The Verdict
  EDT one-boxes because one-boxing *correlates* with wealth. FDT one-boxes because your decision algorithm *logically controls* the prediction that *causes* the wealth. The difference is subtle but operationally critical—like choosing a policy for all possible worlds (FDT) versus optimizing in a single world (EDT). While FDT inherits EDT's *conclusion* in Newcomb's, it rejects its *mechanism* to resolve deeper paradoxes. The "logical dependence" language isn't just evasion; it's a genuine (if controversial) upgrade.
