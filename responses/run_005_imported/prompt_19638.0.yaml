  Here’s a toast that threads the needle—philosophically precise for your colleague, warm and engaging for the bowling league, and anchored in the statue/clay puzzle without jargon. (Word count: ~480, timed to ~3 mins):

  ---

  **(Clink glass gently)**  
  "Everyone, if I could have your attention... Mom, Dad—first, just... *wow*. 40 years. That’s not just a number; that’s a whole world you’ve built together. And since I’m the resident philosophy nerd, you’ve kindly let me sneak a little metaphysics into your party. Don’t worry, Uncle Dave—I promise, no Ships of Theseus this time!" *(Light laughter)*

  "You know, in my field, there’s this old puzzle about a statue. Let’s say it’s a beautiful clay figure. Now, the statue *is* made of that clay, right? But here’s the thing: the statue and the lump of clay aren’t *quite* the same. How? Well, imagine the clay could be squished into a ball tomorrow. The *clay* would still be there—same stuff, just reshaped. But the *statue*? It’d be gone. Poof. The statue depended on that specific shape, that meaning. It had its own… life, its own story, distinct from the raw material it was made from.

  **That’s what I see when I look at your 40 years of marriage.**

  You two—Mom, Dad—you’re the incredible, vibrant clay. But your *marriage*? That’s the statue. It’s something *more* than just the two of you standing side-by-side. It’s this amazing thing you *constituted* together.

  Think about it: Over four decades, both of you have changed—jobs, hobbies, hairstyles (Dad, the 80s photos are proof!), perspectives. If any one of us changed that much *alone*, we’d feel like a whole new person! But your *marriage*? It sailed right through. It persisted. It absorbed those changes because its 'shape'—its core of love, commitment, inside jokes, and shared history—wasn’t broken. The 'statue' stayed intact, even as the 'clay' evolved.

  And here’s the real magic trick your marriage pulls off: It *could* theoretically end—not that anyone here believes that for a second!—while both of you, individually, kept right on living, completely unchanged in your own personal identities. That’s wild, right? It shows that the marriage isn't *just* the sum of its parts. It’s its own entity. It has its own rules for survival, its own resilience. You built something with its own heartbeat.

  For 40 years, you’ve kept that 'statue' standing—not frozen, but alive, adapting, growing more beautiful even as the world shifted around it and within you. You didn’t just stick together; you *built* something enduring out of the raw material of 'you two'. Something that has its own story, its own weight, its own undeniable presence in all our lives.

  So, let’s raise our glasses to the master sculptors! To the incredible clay—Mom and Dad, the amazing individuals you are. And, most of all, to the breathtaking 40-year masterpiece you’ve created together. May its shape hold strong, and its story grow ever richer. Cheers to you both!"

  ---

  **Why this works:**

  1.  **Philosophical Fidelity:** It clearly establishes:
      *   **Constitution, not Identity:** The marriage is *made of* the couple but isn't *identical* to them or their mereological sum.
      *   **Persistence Conditions:** The marriage survives changes that would be identity-altering for individuals ("If any one of us changed that much *alone*, we’d feel like a whole new person! But your *marriage*? It sailed right through.").
      *   **Modal Mismatch (Divorce Scenario):** Explicitly mentions the possibility of the marriage ending while both individuals persist unchanged ("It *could* theoretically end... while both of you, individually, kept right on living... That’s wild, right? It shows that the marriage isn't *just* the sum of its parts.").
  2.  **Accessibility:** Uses simple metaphors (sculpting, shape, masterpiece) and avoids technical terms ("constituted" is the most technical word used, and it's explained contextually). The divorce point is framed gently and hypothetically.
  3.  **Engagement & Warmth:** Starts and ends with genuine affection. Includes humor (Uncle Dave, Dad's hair). Focuses on the positive endurance and beauty of the marriage ("breathtaking masterpiece," "its own heartbeat," "story grow ever richer").
  4.  **Pacing & Length:** Structured for spoken delivery. Clear intro, setup of the analogy, application to the marriage, celebration, toast. Fits comfortably within 3 minutes.
  5.  **Colleague Nod:** Your colleague will hear the precise structure of the classic constitution argument (persistence through change + modal independence) woven seamlessly into a celebration. No fumbling.
  6.  **Bowling League Appeal:** Heartfelt, funny in spots, celebrates love and endurance, uses concrete images (hairstyles, photos, inside jokes), ends with a clear, uplifting toast.

  Go deliver this with confidence! Your parents (and your colleague) will be impressed.
