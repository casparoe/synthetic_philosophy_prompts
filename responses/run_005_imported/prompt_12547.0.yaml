answer: |-
  Here’s a set of interview questions designed to engage critically with the epistemic defense of Moral Equality of Combatants (MEC), incorporating your specified focus areas while leaving room for substantive dialogue. Each primary question includes a strategic follow-up anticipating common responses.

  ---

  ### Core Questions:
  1. **Clarifying the Epistemic Position**  
     *"Your version of MEC hinges on soldiers’ unavoidable uncertainty about *jus ad bellum*. Could you outline why this epistemic limitation necessitates symmetrical combat permissions—and why it overrides the traditional view that moral justification flows from the justice of the cause?"*  
     *Follow-up (if they emphasize reasonable belief):* **"If a soldier *reasonably but incorrectly* believes their cause is just, does that belief *justify* their lethal acts—or merely *excuse* them? How does this differ from other morally weighty errors (e.g., a civilian mistakenly killing an ‘intruder’ they wrongly perceived as armed)?"**

  2. **Epistemic Limits & Moral Permissibility**  
     *"If pervasive uncertainty legitimizes symmetrical killing rights in war, why doesn’t similar uncertainty excuse, say, a civilian killing what they *sincerely but wrongly* believe is an imminent threat? Why treat combatants’ epistemic constraints as uniquely morally transformative?"*  
     *Follow-up (if they distinguish war’s institutional context):* **"Doesn’t institutionalizing lethal uncertainty risk morally laundering actions that, in *any* other domain, would demand stricter scrutiny? Or is war truly a morally discontinuous practice?"**

  3. **McMahan’s Challenge: Justification vs. Excuse**  
     *"McMahan argues that MEC conflates *being excused* for fighting unjustly with *having a right* to fight. Does your epistemic framing resolve this distinction—or does it functionally preserve MEC by relabeling excuse as justification under uncertainty?"*  
     *Follow-up (if they reject the distinction as inapplicable):* **"If a drone operator discovers post-conflict their strike relied on flawed intel, we condemn the *system* but still hold the *act* as unjustified—even if excusable. Why shouldn’t the same apply to infantry acting under *jus ad bellum* uncertainty?"**

  4. **Voluntary Service & Suspected Injustice**  
     *"How does your view handle a *volunteer* who deploys suspecting their nation’s cause is unjust? If they later kill enemy combatants, are they morally equal to a just-side conscript? Or does their prior suspicion alter their moral liability/rights?"*  
     *Follow-up (if they emphasize role-based obligations):* **"Doesn’t volunteering while harboring doubts imply a kind of *willful ignorance*? Shouldn’t soldiers bear moral responsibility for investigating wars they suspect may be unjust *before* agreeing to fight?"**

  5. **Conscripts vs. Volunteers**  
     *"You’ve argued uncertainty grounds MEC. But does the *voluntariness* of service affect a soldier’s epistemic burden? Is a volunteer who never questioned their cause as ‘blameless’ as a conscript forced to fight?"*  
     *Follow-up (if they downplay voluntariness):* **"If two soldiers—one coerced, one eager—both kill under identical uncertainty, does the volunteer’s *choice* to participate in a potentially unjust system make their act more morally charged?"**

  6. **Post-Combat Moral Emotions**  
     *"Suppose MEC is correct: a soldier who fought honorably for an unjust cause is morally equal to their just-side counterpart. What *should* that soldier feel about their actions afterward? Pride? Regret? Moral indifference? And does your theory demand or permit guilt?"*  
     *Follow-up (if they separate justification from emotion):* **"If the soldier *shouldn’t* feel guilt, doesn’t that imply their acts carry no moral residue? If they *should*, doesn’t that contradict MEC’s claim of moral parity?"**

  7. **Practical Governance vs. Moral Truth**  
     *"You propose MEC as the only workable standard for soldiers. But does prioritizing pragmatic governance inadvertently endorse moral relativism? Shouldn’t soldiers strive to align conduct with objective *jus ad bellum*—even imperfectly?"*  
     *Follow-up (if they stress feasibility):* **"If a soldier *could* access reliable *jus ad bellum* evidence mid-deployment (e.g., leaked documents), would their moral permissions shift? Or does MEC hold regardless?"**

  8. **Closing: The Veteran’s Perspective**  
     *"Many veterans of unjust wars describe moral injury not from violating *jus in bello*, but from realizing they *advanced an unjust cause*. Does your view dismiss that anguish as irrational—or accommodate it? And what would you say to a soldier like my brother, who enlists knowing others question this war’s justice?"*  

  ---

  ### Key Design Notes:
  - **Epistemic Pressure** (Q2) targets the argument’s core by challenging why war’s uncertainty uniquely excuses acts otherwise deemed immoral.  
  - **McMahan Distinction** (Q3) forces the guest to confront whether "permissibility" under uncertainty is semantic sleight-of-hand.  
  - **Volunteer Focus** (Q4/Q5) personalizes the abstract debate for your brother’s situation, probing whether suspicion creates a duty of inquiry.  
  - **Moral Emotions** (Q6/Q8) addresses your unresolved need to reconcile theory with lived veteran experience.  

  Each follow-up preempts common rebuttals (e.g., institutional roles, feasibility) to deepen the dialectic. The closing question centers human stakes over academic nuance—vital for both podcast engagement and your ethical concern for your brother.
