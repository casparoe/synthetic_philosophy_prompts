answer: |-
  ## The Wedding Bar Theologians

  **Setting:** A crowded wedding reception. Music thumps, laughter rises and falls. DANNY (40s, Jesuit priest collar visible under his suit jacket) nurses a scotch. MARCUS (40s, tweed jacket stubbornly worn despite the setting) approaches with two beers.

  **MARCUS:** Father Danny! They let you out of the library? (Hands him a beer) Still tilting at Calvinist windmills?

  **DANNY:** (Takes the beer, smiles wryly) Marcus. Only the ones that insist God micromanages sin. Still preaching double predestination like it’s good news? How’s the seminary?

  **MARCUS:** Thriving. Teaching them to wrestle with the hard texts, not dodge them with philosophical sleight-of-hand. Unlike some I knew who vanished into the comforting fog of *Scientia Media*. (He taps Danny's collar lightly) Middle Knowledge. Still your great escape hatch?

  **DANNY:** (Eyes narrowing slightly) It’s not a dodge, Marcus. It’s the only coherent way to affirm *both* God’s sovereign providence *and* genuine creaturely freedom. Without it, you either make God the author of sin or turn us into puppets. Your irresistible grace looks an awful lot like divine coercion.

  **MARCUS:** Coercion? Hardly. It’s liberation *from* the bondage of a will enslaved to sin. But let’s cut to the chase. Your precious counterfactuals of freedom – what Peter *would* freely do if placed in circumstance C. Before creation, before Peter *exists*... what exactly grounds the truth of that statement, Danny? What makes it *true*?

  **DANNY:** (Leans in, voice dropping slightly) God’s knowledge grounds it, Marcus. His perfect comprehension of all *possible* essences, all *possible* persons. He knows Peter’s complete, individual nature – not just the abstract essence ‘humanity’ you Aristotelians love, but Peter-as-he-could-be. From that, God perfectly knows what Peter *would* freely choose in any logically possible situation. The truthmaker *is* the complete specification of Peter’s possible identity and the circumstances.

  **MARCUS:** (Shakes his head, takes a long pull of beer) That’s where it collapses, Danny. Before creation, Peter *isn’t*. He’s a conceptual ghost. You’re asking me to believe there are brute, ungrounded facts about the *free* actions of *non-existent* entities? That’s not metaphysics; it’s mystification. Plantinga’s ‘transworld identity’ tries to paper over it, but the crack’s still there. *No actual Peter, no actual free choice to make the proposition true.* You’ve got truths floating in a void, dependent on nothing but God’s *thinking* them. That makes them arbitrary!

  **DANNY:** (Grips his glass tighter) It’s not arbitrary! It’s grounded in the *truth* of what that *specific* possible creature *is*. God isn’t inventing the truth; He’s *seeing* it. Seeing the entire landscape of possibilities inherent in His own creative power. The grounding objection assumes truth requires an *actual* concrete entity *now*, but that’s a category error for *modal* truths about *possibilities*. God knows the full story of every possible Peter in every possible world because He knows Peter *completely* as a possibility. That *is* the ground.

  **MARCUS:** Fine, grant that for argument’s sake. Let’s say God somehow *does* know all these counterfactual truths about non-existent possible people. Here’s the real kicker, Danny, the one your Molinism never escapes. (He leans closer, voice intense). God surveys this infinite landscape of possible worlds, each defined by the counterfactuals of freedom He supposedly knows. He sees World A where Peter freely betrays Christ. World B where Peter freely stands firm. He chooses, in His sovereign freedom, to *actualize* World A. He brings Peter into *existence*, knowing with absolute certainty Peter *will* betray Christ, because that’s what the counterfactual said Peter *would* freely do *in this world*.

  **DANNY:** Yes! And Peter *does* it freely! His choice isn’t caused or determined by God; it flows from his own nature in those circumstances, which God knew but did not *cause*.

  **MARCUS:** But Danny, *look at what God did*! He *selected* the world where Peter’s nature-in-circumstances leads inexorably to betrayal. He could have chosen World B, where Peter stands firm. But He didn’t. He chose the betrayal world. So while Peter’s *individual choice* in the moment might feel free, the *entire scenario* – Peter being *that* Peter, in *those* circumstances, guaranteed to make *that* choice – was *selected* by God. God set the trap with perfect foreknowledge of the outcome. How is that meaningfully different from God *determining* Peter’s sin? You’ve just pushed the determinism back one step! God determines *which* freely-acting puppet show gets put on stage. The puppets wiggle freely on their strings, but the Showrunner chose *exactly* which strings and which wiggles would be displayed. Where’s the robust libertarian freedom then? It’s an illusion within a divinely predetermined script.

  **DANNY:** (Silent for a beat, staring into his glass. He takes a slow sip. Marcus has landed the point.) It’s... not predetermined *in the same way*. Peter isn’t *caused* to sin. God permits the sin that He knows will occur because He brings greater good from it – the Cross! – but He doesn’t *make* Peter choose it. Molina’s distinction between God’s *knowledge* and His *causality* still holds. God actualizes the world *knowing* what free choices will occur, but He doesn’t *efficaciously cause* those choices. The freedom is real *within* the actualized context.

  **MARCUS:** "Permits"? Knowing with metaphysical certainty *exactly* what will happen because you specifically chose *that* chain of free causes and effects? That’s permission with a loaded gun, Danny. It’s permission that looks indistinguishable from meticulous providence arranging the pieces. You want God to be sovereign *and* innocent of causing sin, and humans to be free *and* their actions known infallibly. Molina tries to have it all, but the grounding objection exposes the foundations as sand, and the actualization argument shows the freedom is fatally compromised. It *is* a dodge. A brilliantly complex, philosophically fascinating dodge, but a dodge nonetheless. God either ordains whatsoever comes to pass, or He doesn’t. Middle Knowledge tries to split the difference and ends up satisfying neither camp.

  **DANNY:** (Looks up, a flicker of the old academic fire despite the hit) And your way? God directly willing the fall? Making Judas *necessarily* betray? That makes prayer pointless, responsibility a fiction, and God monstrous. Molina offers a coherent, *biblical* picture. It might stretch our philosophical categories, Marcus, but so does the Incarnation. The grounding objection is serious, granted. Craig, Plantinga, they offer responses... but the actualization point... (He trails off, genuinely wrestling). It’s a tension. But I’ll take the tension over your theological determinism any day. At least mine preserves the *reality* of the choice, even if God knew which world contained it.

  **MARCUS:** (Sighs, the intensity fading slightly. He clinks his bottle against Danny’s glass). And I’ll take the hard truth of God’s sovereign ordination over what I see as your elaborate fiction designed to protect God from the logical consequences of His own sovereignty. Some things never change, do they? Still sparring over possibilities while the bride and groom are probably halfway to Fiji.

  **DANNY:** (Manages a small smile) Some arguments are worth having, old friend. Even at an open bar. Especially at an open bar. Another round? My treat. We can argue about sufficient and efficacious grace next.

  **MARCUS:** (Chuckles) Now *that* sounds like a Jesuit trap. Fine. One more. But only if you admit Barth had a point about natural theology.

  **DANNY:** Not a chance. That’s a hill I *will* die on. Scotch this time? Seems appropriate for discussing the decrees.

  **MARCUS:** Lead on, Father. Just don’t expect me to genuflect.

  *(They turn towards the bar, the unresolved weight of centuries of theology hanging between them, momentarily eased by the older weight of friendship and the lure of more drinks.)*
