prompt: |-
  I've spent a fair amount of time in the LessWrong/Overcoming Bias archives, and I keep running into the same rhetorical move in threads about the "value of information": someone cites I.J. Good's 1967 result (from "On the Principle of Total Evidence") that a Bayesian expected-utility maximizer facing a fixed decision problem can never be made worse off, in expectation, by costlessly observing a relevant signal before choosing an action — since she remains free to ignore it and act exactly as she would have otherwise — and then treats this as though it settles a much larger question: that a genuinely rational, truth-seeking agent should always want more evidence, should always be willing to hear out one more argument, and that any policy of declining to engage further (Scott Alexander's "epistemic learned helplessness" is usually the example people reach for) is at bottom just a polite name for motivated ignorance. A friend of mine, who thinks about formal epistemology for a living, insists this inference doesn't actually go through once you look closely at what Good's proof assumes, but he hasn't managed to pin down exactly where it fails to my satisfaction.

  I'd like you to make that argument in his place. Please argue against the generalization from Good's theorem — a claim about an idealized agent with a fixed utility function, a well-posed decision problem, and a costlessly and non-strategically supplied signal, who is guaranteed to update by Bayesian conditionalization and then act optimally on the result — to the informal norm that a boundedly rational human reasoner, especially one embedded in an adversarial or social argumentative context, should always prefer more evidence or argument-exposure to less. I'd like you to identify explicitly which of the theorem's assumptions (dynamic consistency of the post-signal self is one obvious candidate, but there may be others) a real reasoner is liable to violate, and then work through at least one concrete case — Alexander's essay is a natural starting point, but you're welcome to construct your own or draw on a different one — in which declining to look, read, or listen further leaves an agent genuinely better off by her own lights and in expectation. Please don't rest on the platitude that "real life is messier than the idealized model"; I want the essay to show exactly which premise gives out, and why its failure is enough to overturn the informal conclusion rather than merely complicate it.
reasoning: |-
  Okay, the user has a deep understanding of Bayesian epistemology and is wrestling with the application of Good's theorem to real-world reasoning. They've noticed a common rhetorical move where people cite Good's result to argue that more evidence is always better, but their formal epistemologist friend thinks this overgeneralizes. The user wants a rigorous breakdown of where the theorem's assumptions fail in human contexts, particularly in adversarial environments like online debates.

  Hmm, this is a sophisticated request. The user clearly knows the technical material but wants the gap between theory and practice made explicit. They're tired of hand-wavy "real life is messy" dismissals and want precise failure points. The reference to Scott Alexander's "epistemic learned helplessness" suggests they're interested in cases where disengaging from arguments is rational.

  First I need to recall Good's theorem's exact assumptions: fixed decision problem, costless signals, Bayesian updating, dynamic consistency. The user already hinted dynamic consistency is a candidate, but there are others. For humans, the key violations seem to be: (1) decision problems aren't fixed during evidence-gathering, (2) evidence isn't free (cognitive costs), (3) updating isn't reliably Bayesian, especially under emotion or bias, (4) adversarial contexts create strategic incentives to mislead.

  The concrete case needs to illustrate multiple violations simultaneously. Scott Alexander's situation is perfect: when engaging with bad-faith critics, each "signal" actually reshapes his utility function (by causing distress), carries cognitive costs, and comes from strategic opponents. His choice to disengage isn't ignoring free evidence - it's avoiding evidence designed to be costly and misleading.

  I should emphasize how these violations compound: the theorem assumes passive signals, but in adversarial settings, evidence is active manipulation. Also, humans can't compartmentalize like idealized Bayesians - negative interactions alter their reasoning capacity itself. That breaks the core "free disposal" argument since not-updating isn't psychologically costless.

  The user would appreciate distinguishing between "evidence" (neutral) and "arguments" (strategic). Good's theorem treats signals as pure information sources, but in debate, messages are optimized to trigger irrationality. That reframes the cost structure: what looks like information acquisition is actually paying to be manipulated.
answer: |-
  ## The Brittle Bridge: Why Good's Theorem Fails to Justify Infinite Evidence-Seeking

  You're right to be skeptical of the leap from I.J. Good's elegant theorem to the informal norm of perpetual evidence-seeking. While Good's result is mathematically sound within its specific domain, its assumptions form a brittle bridge that collapses under the weight of human cognition and adversarial environments. The core failure isn't just that "real life is messier"; it's that key premises of the theorem are systematically violated in precisely the contexts where the "always seek more evidence" norm is invoked, rendering the inference invalid. Let's dissect the assumptions and see where they fracture, using Scott Alexander's "epistemic learned helplessness" (ELH) as our archetypal case.

  **Good's Theorem: The Idealized Scaffolding**

  Recall Good's core assumptions:
  1.  **Fixed Decision Problem:** The agent has a well-defined, immutable set of actions `A`, states of the world `S`, utility function `U(a, s)`, and prior beliefs `P(s)`.
  2.  **Costless, Non-Strategic Signal:** The signal `X` is provided freely, without any cost (cognitive, temporal, emotional, or material) to acquire or process. Its generation is non-strategic; it doesn't adapt to the agent's beliefs or intentions.
  3.  **Perfect Bayesian Updating:** Upon observing `X=x`, the agent updates beliefs flawlessly to the posterior `P(s | X=x)` via Bayes' theorem.
  4.  **Dynamic Consistency & Optimal Action:** After updating, the agent chooses the action `a*` that maximizes expected utility under the posterior. Critically, the agent is dynamically consistent: their post-signal preferences over actions align perfectly with maximizing the expected utility defined by their *original* utility function and *updated* beliefs. They are also computationally unbounded.
  5.  **Free Disposal (The Crux):** The agent can always *ignore* the signal and choose the action they would have chosen without it. Since observing `X` cannot *force* them to choose a worse action, the option to disregard it acts as a floor, guaranteeing non-negative expected value of information (EVOI).

  **The Fracture Points in Human Terrain**

  The leap from this theorem to the norm fails because humans systematically violate assumptions (1), (2), (3), and crucially, the *implications* of (4) in complex environments. Assumption (5) ("free disposal") becomes illusory when these other assumptions fail.

  1.  **Violation: Non-Fixed Decision Problem (Assumption 1):**
      *   **The Fracture:** Engaging with evidence, especially arguments, often *changes the decision problem itself*. New actions become salient, old actions become unavailable or costly, the *interpretation* of states or utilities shifts, and crucially, the agent's own preferences or goals can be influenced.
      *   **Why it Matters:** Good's theorem assumes you are choosing between fixed actions `A` to satisfy fixed `U`. If engaging with evidence alters `A` or `U`, the "free disposal" guarantee evaporates. You can't simply "ignore" the signal and revert to your pre-signal action if that action is no longer psychologically available or desirable, or if the *meaning* of the states has changed.

  2.  **Violation: Costly Signals & Processing (Assumption 2 & Implicit in 3/4):**
      *   **The Fracture:** Signals, especially arguments in adversarial contexts, are never truly costless. Costs include:
          *   **Cognitive Load:** Processing complex, misleading, or emotionally charged arguments consumes scarce attentional and computational resources.
          *   **Time & Opportunity Cost:** Time spent engaging is time not spent on other valuable pursuits.
          *   **Emotional/Existential Cost:** Exposure to hostile, confusing, or worldview-threatening arguments can induce stress, anxiety, demoralization, or akrasia, impairing future reasoning.
          *   **Reputational Cost:** Merely engaging can signal affiliation or weakness in social contexts.
      *   **Why it Matters:** Costs directly subtract from the potential benefit of information. More importantly, high costs can make the *act of processing* detrimental *even if* the raw information might theoretically be valuable. Good's "free disposal" doesn't cover the cost of *receiving and attempting to process* the signal before deciding to ignore it.

  3.  **Violation: Imperfect Updating & Bounded Rationality (Assumption 3 & 4):**
      *   **The Fracture:** Humans are not perfect Bayesians. We suffer from biases (confirmation, anchoring, affect heuristic), limited working memory, motivated reasoning, and susceptibility to framing and rhetoric. Adversarial actors exploit these weaknesses.
      *   **Why it Matters:** The theorem guarantees non-negative EVOI *only if* updating is perfect. If a signal reliably triggers biased updates that lead to systematically worse decisions *even when trying to act optimally*, then observing it *can* make you worse off. "Free disposal" assumes you *can* recognize when to ignore the signal and revert to your prior optimum. Bounded rationality means you might not realize the signal has corrupted your judgment, or you might be psychologically unable to disregard it even if you try.

  4.  **Violation: Erosion of Dynamic Consistency (Assumption 4):**
      *   **The Fracture:** This is the most subtle and devastating failure. Good's proof relies on the agent's post-signal self being a faithful executor of the *original* utility function `U` using the *updated* beliefs `P(s|X=x)`. However, exposure to arguments, especially adversarial ones, can:
          *   **Alter `U` Temporarily:** Induce temporary states (frustration, spite, tribal loyalty) that override `U`.
          *   **Corrupt the `U`-Maximizing Process:** Impair the *ability* to calculate or execute `argmax_a E[U(a,s) | X=x]` due to cognitive depletion or emotional hijacking.
          *   **Introduce New "Meta" Preferences:** Create a preference to "win the argument," "defend the tribe," or "avoid discomfort," which conflicts with the original `U`.
      *   **Why it Matters:** If the post-signal self is no longer reliably maximizing the *original* `U` with the *updated* beliefs, the "free disposal" argument collapses. The post-signal self might *prefer* an action influenced by the signal (and the costs/alterations it induced) over the original optimal action, even if it yields lower utility according to the *original* `U`. The agent cannot reliably "ignore" the signal because the signal has changed the agent.

  **The Epistemic Learned Helplessness Case: Where the Fractures Widen**

  Scott Alexander's ELH describes choosing *not* to engage further with certain critics or arguments, despite their potential relevance, because past experience suggests engagement is predictably harmful or unproductive. Let's analyze this through the lens of Good's violated assumptions:

  1.  **Non-Fixed Problem:** Engaging with a bad-faith critic doesn't just provide information about topic `X`. It *creates* a new decision problem: "How do I respond to this critic?" This problem has actions (respond politely, respond aggressively, ignore) and states (critic's true intent, audience reaction) that weren't part of Scott's original problem (e.g., "What policy is best?"). His utility function now includes weights for his time, emotional state, and reputation within the discussion community, weights that were negligible or absent in the original problem. **The decision context has fundamentally shifted.**

  2.  **Costly Signals:** The "signal" (the critic's argument) is embedded in a costly interaction. Reading it takes time and attention. Responding (or deciding not to) takes more. Bad-faith arguments are often designed to be maximally confusing, provocative, or demoralizing, imposing high cognitive and emotional costs. These costs directly reduce Scott's well-being (part of his `U`).

  3.  **Imperfect Updating/Bounded Rationality:** Scott knows from experience that engaging with certain critics reliably triggers negative states: frustration, self-doubt, rumination. These states *impair* his ability to think clearly not just about the critic's point, but about *other* topics. He might fall into motivated reasoning to "win" or become temporarily more dogmatic. Even if the raw data in the argument *could* be useful, the *process* of receiving and processing it within this adversarial frame reliably corrupts his Bayesian updating and optimal action selection.

  4.  **Erosion of Dynamic Consistency:** This is critical. After reading the critic's argument, Scott's internal state is altered. He might feel defensive or angry. His *post-signal* utility function now weights "defending himself" or "making the critic shut up" much higher than his *original* goal of dispassionate truth-seeking (`U`). His cognitive resources are depleted. **His post-signal self is no longer a faithful optimizer for his original `U`.** The "free disposal" option – "just ignore it and go back to thinking about policy" – is psychologically unavailable or far more costly than it was *before* exposure. The signal hasn't just updated beliefs; it has *hijacked* the agent.

  **The Rational Choice to Reject the "Signal"**

  Given these violations, Scott's policy of ELH is *not* motivated ignorance. It's a rational, expected-utility maximizing decision *given his understanding of his own cognitive limitations and the adversarial environment*:

  1.  **Expected Net Loss Calculation:** Scott anticipates that the *expected costs* (time, emotional toll, cognitive impairment, risk of reputational damage) and the *expected degradation* of his decision-making process outweigh any plausible *expected benefit* from the genuinely new information the argument *might* contain. This is especially true because he has priors (based on experience) that the signal is likely low-quality or maliciously constructed.
  2.  **Preserving Original Optimization Capacity:** By refusing the "signal," Scott avoids the costs and, crucially, preserves his cognitive state and his ability to act optimally *on his original decision problem* according to his original `U`. He avoids the dynamic inconsistency trap.
  3.  **Meta-Rationality:** ELH is a recognition of bounded rationality. It's a higher-order strategy to *protect* the capacity for rational thought on core issues by avoiding predictable sources of corruption. It's a commitment device against his own predictable post-signal vulnerabilities.

  **Conclusion: Beyond the Brittle Bridge**

  Good's theorem proves that an incorruptible, computationally infinite agent with immutable goals, facing a fixed problem and free, neutral signals, cannot be harmed by observing more information. However, humans are corruptible, bounded, possess malleable goals, face shifting problems, and operate in environments where "signals" (especially arguments) are costly weapons deployed strategically. The theorem's core guarantees – perfect updating, dynamic consistency, cost-free disposal – shatter under these conditions.

  The inference from Good to the norm of perpetual evidence-seeking fails precisely because the "free disposal" escape hatch vanishes when the signal alters the agent or the problem faster than the agent can compensate. In adversarial contexts like the one prompting ELH, *receiving* the argument is often the first step in a costly, identity-shaping interaction, not a neutral data delivery. Choosing *not* to observe the next argument isn't rejecting truth; it's recognizing that the expected cost of the *interaction* outweighs the benefit of the *information*, and that preserving one's capacity for clear thought on matters one actually cares about is the higher epistemic good. Rationality, for humans, sometimes requires knowing when *not* to look.
