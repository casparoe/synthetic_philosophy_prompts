prompt: |-
  Okay so my game theory seminar just spent basically two full lectures on iterated elimination of dominated strategies, and the part that broke my brain a little was the mixed strategy stuff -- like, a pure strategy can survive every single pairwise comparison against the other pure strategies (so it looks totally fine, not dominated by anything) and still get eliminated once you check whether some mix of two other strategies dominates it instead. My professor's example had this one strategy that seemed like a totally reasonable choice right up until she pulled out the mixed strategy that crushed it in every state of the world, and like five people in the room audibly groaned once it clicked. My TA also threw in this detail that the order you eliminate strategies in can actually change your final answer if your using weak dominance, but never if your using strict dominance, which is apparently a whole theorem and not just a fun fact.

  Anyway I want to send something funny about this to our class group chat before the next problem set drops (people are already dreading it). Can you write me a short joke -- a one-liner or like a 3-4 line bit, your call -- where the actual punchline depends on that specific idea, that something can look totally undominated when you only check it against pure strategies one at a time but then quietly loses once mixing is on the table? I don't want generic "game theorists be like" humor about Nash equilibrium or the prisoners dilemma that any rando could laugh at without knowing what dominance even means; it should only really land for someone who's sat through the mixed-strategy-domination argument and had the same "wait, why does that count" moment I did. If you can sneak in something about the strict-vs-weak order-independence thing too without it feeling tacked on, go for it, but that part's optional -- the mixed strategy point is the one that actually has to carry the joke.
