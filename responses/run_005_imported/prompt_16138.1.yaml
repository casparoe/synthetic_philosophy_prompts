  ## Memorandum: Grievance Panel Recommendation - Case # [Number] - Alleged Idea Appropriation  
  **To:** Freelancers' Union Grievance Panel  
  **From:** [Your Name], Panel Member (Science & Ideas Journalist)  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Freelancer Grievance Re: De-Extinction Startup Story Pitch  

  ### Case Summary
  Freelancer Member ("Member") pitched a detailed, well-sourced story concept on a specific de-extinction startup to Editor ("Outlet") four months ago. Pitch included unique angles, source contacts, and narrative framing. Outlet responded with a vague "we'll pass for now." Four months later, Outlet published a near-identical piece by an in-house writer, utilizing the core concept, angles, and sources identified in the Member's pitch, without payment, credit, or acknowledgment. Member claims idea theft. Outlet asserts copyright law protects only expression, not ideas, and thus no infringement occurred.

  ### Legal Reality vs. Ethical Breach
  The Outlet is **legally correct** regarding copyright: Ideas, facts, and concepts cannot be copyrighted. Only the *specific expression* of those ideas (the written article, unique phrasing, structure) is protected. A court would likely dismiss a copyright claim here.

  However, **dismissing this grievance solely on legal grounds would be a profound mistake** for our union. It ignores the core ethical norms and professional trust underpinning freelance journalism. This situation represents a clear violation of **implied professional ethics and good faith dealing**, which are essential for freelancers' livelihoods and the health of our industry.

  ### Why This Constitutes a Grievable Wrong (Beyond Copyright)

  1.  **Exploitation of Labor & Investment:** The Member didn't just toss out a vague topic ("de-extinction is interesting"). She invested significant unpaid labor: identifying a specific startup, developing unique angles, cultivating sources, and structuring a narrative approach. The Outlet effectively **outsourced its R&D phase** to the Member under the guise of considering a pitch, then appropriated the valuable *product* of that labor without compensation. This is extractive and exploitative.
  2.  **Breach of Implied Contract & Trust:** The pitch process relies on an implicit understanding of good faith. When an editor solicits or accepts a detailed pitch, they enter a professional relationship where the freelancer's time and intellectual effort are respected. A vague "pass" after receiving detailed work, followed by near-identical execution, constitutes **bad faith dealing** and a **breach of this implied trust**. It weaponizes the power imbalance between outlet and freelancer.
  3.  **Undermining the Pitch Economy:** Our entire freelance ecosystem relies on pitches. If outlets can freely mine detailed pitches for ideas and execution plans without consequence, the value of a freelancer's research and conceptual labor plummets. It creates a **chilling effect**, discouraging freelancers from sharing their best, most developed ideas for fear of appropriation. This harms not just individuals, but the diversity and depth of journalism overall.
  4.  **Unjust Enrichment:** The Outlet gained a tangible benefit – a publishable story concept, vetted sources, and a narrative roadmap – entirely derived from the Member's specific, unpaid work. They avoided the time and cost of developing this specific story internally. Failing to compensate for this appropriated value constitutes **unjust enrichment**.
  5.  **The "Feel" of Theft is Valid:** The intuitive sense of theft arises because something *of value* created by the Member was *taken* and used for the Outlet's exclusive benefit without permission or payment. While not a physical object or copyrighted text, the **specific assemblage of research, sourcing, and narrative design** created by the Member *was* her professional property in an ethical and economic sense.

  ### Distinguishing Factors
  This is *not* about claiming ownership of a broad topic ("de-extinction"). It's about the appropriation of a *specific, developed story concept* targeting a *specific startup*, with *specific angles and sources*, presented in a detailed pitch. The near-identical nature of the final piece demonstrates the direct lineage. This is qualitatively different from two journalists independently developing similar stories on a major news event.

  ### Recommended Resolution: Uphold the Grievance & Seek Remediation
  **Vote: UPHOLD the Grievance.**

  **Recommended Remedy:** Negotiate a settlement requiring the Outlet to:
  1.  **Payment:** Pay the Member a fee commensurate with the **research and development time** invested in creating the detailed pitch. This is *not* payment for the "idea" in abstract, but compensation for the *labor* (research, sourcing, conceptualization) the Outlet appropriated and utilized. A reasonable benchmark could be 25-50% of the standard fee for a comparable written article by the Member, reflecting the foundational work done. *(e.g., If her article fee is $1.50/word for 2000 words = $3000, seek $750 - $1500).*
  2.  **Credit:** Add a prominent **Contributing Researcher** or **Development Credit** to the online version of the article and in any internal editorial credits, acknowledging the Member's significant contribution to the story's conception and groundwork. Example: "This story was developed with significant research contributions from [Member's Name]."
  3.  **Formal Acknowledgment:** The Editor should provide a written acknowledgment/apology to the Member (copied to the Union) recognizing that while copyright law wasn't violated, the handling of her detailed pitch failed to meet professional standards of good faith and fair dealing.

  ### Reasoning for Recommendation
  *   **Upholds Union Values:** This action affirms that our union protects members from unethical practices and exploitation, even when they fall outside strict legal definitions. It demonstrates we value the *full spectrum* of a freelancer's labor.
  *   **Practical Deterrence:** A financial penalty and public credit provide tangible consequences for the outlet, deterring similar behavior in the future, more effectively than a purely moral condemnation.
  *   **Fair Compensation:** It directly addresses the core harm: the uncompensated appropriation of valuable labor.
  *   **Restores Dignity:** The credit acknowledges the Member's contribution, countering the erasure she experienced.
  *   **Sets a Precedent:** Establishes a clear union standard: detailed pitches represent significant labor, and their appropriation after a vague rejection is unacceptable.
  *   **Balanced Approach:** It doesn't claim ownership of ideas in perpetuity or demand full article payment, but fairly compensates for the specific preparatory work used.

  ### Argument Against Dismissal
  Dismissing this grievance solely based on copyright law sends a damaging message: that outlets are free to mine freelancers' detailed research and concepts without consequence, as long as they rewrite the prose. It undermines trust in the pitch process, devalues foundational journalistic work, and leaves freelancers economically vulnerable to a particularly insidious form of exploitation. It reduces our union's role to enforcing only the bare legal minimum, not the ethical standards essential for a fair and sustainable freelance ecosystem.

  **Recommendation:** The Panel should UPHOLD the grievance and authorize Union representatives to negotiate the outlined remedy (Research Fee + Contributing Credit + Acknowledgment) with the Outlet. This addresses the genuine wrong while respecting legal boundaries and promoting ethical journalism practices.

  **[Your Name]**  
  Grievance Panel Member
