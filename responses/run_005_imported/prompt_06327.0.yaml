  Hmm, the Dark Room problem is the most famous critique - why don't organisms just minimize surprise by hiding in dark rooms? FEP defenders usually invoke "epistemic value" from Expected Free Energy (EFE), claiming organisms actively seek information. But is this a genuine solution or an ad hoc patch? The follow-up should challenge whether epistemic value is measurable or just relabeled curiosity.

  On falsifiability - critics say FEP can explain any behavior post-hoc by tweaking priors or beliefs. The follow-up must press whether specific experimental outcomes could disprove FEP, not just accommodate them. If she cites adaptive priors as predictions, the retort should demand testable constraints on what priors can exist.

  For scope - when FEP gets applied to hurricanes or thermostats, does it become vacuous? The key is whether Markov blankets imply real cognition. If she distinguishes "weak" vs "strong" FEP, the follow-up should ask why brains need extra principles if simple systems already "infer."

  The user clearly knows the literature but needs surgical questions. They're tired of superficial FEP evangelism and want to expose cracks. Beyond the three requested angles, I'll include other tough questions: Is FEP testably different from Bayesian brains? Does it handle non-predictive behaviors? Why the math barrier? And whether it ignores embodiment.

  Each follow-up must be pre-emptive. For example, if she dismisses Dark Room by saying "organisms aren't closed systems," the retort is: "But what experimentally proves they seek information rather than just avoid starvation?" Keep her from retreating into jargon.

  The tone should be rigorous but not hostile - she's a career defender, so push hard while leaving room for insightful answers. Maybe end with the "unification vs dilution" question to let her advocate constructively.

