  What's fascinating is how they're connecting their past work in interferometry to this epistemic puzzle – both involve cleaning "dirty" data under constraints. Their frustration is palpable: they've done the Lagrange multiplier grunt work themselves and smell a rat in the "obvious" alternative solution. 

