  Second, reframe the evidence: it's not a likelihood (which would leave P(Red) untouched) but a constraint on posterior ratios. When new evidence breaks symmetry in one area but not another, maxent correctly lets that imbalance tilt the whole system toward the less constrained (Blue) hypothesis. 

