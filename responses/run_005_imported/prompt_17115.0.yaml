answer: |-
  Your argument powerfully reconstructs Aristotle's fatalist challenge, but contemporary philosophers resist conceding fatalism for deep logical and metaphysical reasons. Here's why the debate remains open:

  ### Key Responses to Your Argument
  1. **The Truth-Value Gap (Aristotle's Escape)**:  
     Aristotle himself denied that future contingents *have* a truth value. For him, "There will be a sea-battle tomorrow" is *presently neither true nor false*. Excluded middle still holds formally ("Either P or not-P"), but neither disjunct is *true* until the event is causally determined. This rejects your premise that "whichever disjunct is true has been true all along."

  2. **Temporal Ontology (Ockhamism)**:  
     **William of Ockham** argued that *truth is tensed*. While "There will be a sea-battle tomorrow" *is* true today if the battle occurs tomorrow, it was *not* true 1,000 years ago. Truth depends on the time of assertion. Thus, "It was true long ago" is a category error—truth is not a timeless property. Only *after* the event does it become true that "It *was* going to happen."

  3. **Thin Truth vs. Causal Necessity**:  
     Even if a future-tensed proposition was always "true" in a thin, logical sense, this does not imply *causal inevitability*. Truth supervenes on reality: the proposition was "true" *because* the battle *will* occur freely tomorrow. The truth is a *consequence* of future freedom, not its cause.  
     - Example: "I will freely choose coffee tomorrow" may be true today, but its truth *depends on* my future free choice—it doesn't negate it.

  4. **Semantic vs. Metaphysical Necessity**:  
     Classical logic ensures that "P ∨ ¬P" is necessary, but it doesn't make *P itself* necessary. The disjunction must hold, but neither disjunct may be *metaphysically settled* until the future. Quantum indeterminacy reinforces this: a radioactive atom's decay may have no determinate truth value until it occurs.

  ---

  ### Why Determinism Still Matters Empirically
  - **Compatibilist Free Will**: Even if your logical argument holds, philosophers like **Daniel Dennett** or **Strawson** argue that "free will" is compatible with determinism (or timeless truth). What matters is whether actions stem from *reasons-responsive mechanisms*, not causal indeterminism.  
  - **Sourcehood vs. Alternate Possibilities**: **Harry Frankfurt** showed that moral responsibility doesn't require the ability to do otherwise. If determinism (or timeless truth) removes "alternate possibilities," it doesn't automatically remove *agency*.  
  - **Indeterminism's Problems**: Quantum randomness doesn't rescue free will; it may even undermine control (e.g., if decisions involve neural randomness). Thus, empirical determinism remains relevant: if the universe *is* causally closed, it pressures libertarian free will more than logic alone.

  ---

  ### Why Philosophers Don't Concede Defeat
  Your argument is seen as a **semantic fatalism**, distinct from **causal determinism**. While logically rigorous, it fails to engage the *causal mechanisms* of agency. Philosophers reject fatalism not out of ignorance of logic, but because:
  - It conflates *truth* with *causal fixity*.  
  - It assumes a static, "block universe" theory of time (which is contested).  
  - It doesn't address *how* agents contribute to making truths true (e.g., via deliberation).

  **Aristotle's own solution**—denying truth values to future contingents—remains a live option, defended by modern "open futurists" like **Belnap**. Others like **MacFarlane** relativize truth to temporal perspectives.

  In short: your argument proves that *if* future contingents have timeless truth values, fatalism follows. But that "if" is the battlefield—and modern physics (e.g., quantum indeterminacy) provides tools to question it. The debate persists because logic alone cannot settle whether truth *is* timeless, or whether "will" statements *describe* or *create* the future.
