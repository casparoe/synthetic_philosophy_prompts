prompt: |-
  I sit on the three-person adjudication panel of a small private foundation that funds independent researchers through multi-year fellowships — the sort of small, EA-adjacent grantmaking body that has proliferated around the rationalist world in recent years — and something that happened at our most recent meeting has been nagging at me ever since.

  We were deciding whether to claw back the remaining funds from a grantee whose project had gone badly off track. Under our internal rules, we may only revoke funding if two separate conditions both hold: first, that her actual work departed substantially from the research plan she originally submitted, and second, that the departure was avoidable rather than attributable to circumstances genuinely outside her control (a key collaborator withdrawing, an irreplaceable dataset becoming unavailable, and so on). When we worked through the case question by question, a majority of the panel — two of the three of us — concluded that the work had indeed departed substantially from the plan, and a majority — a different pair, as it turned out — concluded separately that the departure had been avoidable. Since both conditions were satisfied by majority vote, it seemed we were bound by our own rule to revoke the funding. But then our chair, almost as an afterthought, asked each of us simply to declare yes or no on revocation itself, and it turned out that only one of us actually favored revoking it; the other two, despite each having sided with the majority on one of the two questions, privately believed the other question came out the opposite way, and so both voted no. The straight up-or-down tally came out two to one against revocation — flatly contradicting what the issue-by-issue tally had implied.

  We ended up going with the up-or-down vote, but it has stayed with me that we could apparently have reached the opposite, equally "democratic" outcome just by asking the questions in a different order. It has the flavor of the impossibility-result posts I've come across over the years on LessWrong and Overcoming Bias, but I can't place exactly which one, if any. I described the episode to a friend who is deep into voting theory, and his first reaction was that it sounded like some relative of Arrow's impossibility theorem, though that never quite felt right to me, since none of us were ranking alternatives — we were just voting yes or no on a couple of separate questions and then on a bottom line that was supposed to follow from them. Is there an actual, recognized phenomenon at work here? And if so, does the literature on it suggest any principled way either to decide which of the two tallies should have governed, or to design the vote in advance so that this kind of split can't arise — or is it simply confused to think one of the two outcomes was more "correct" than the other?
reasoning: |-
  Okay, let me start by understanding the user's problem. They're part of a three-person panel that had to decide whether to revoke funding from a grantee. The rules require two conditions to be met: substantial departure from the research plan and that the departure was avoidable. 

  First, the panel voted on each condition separately. Majority found the first condition true (2 out of 3), and a different majority found the second condition true (also 2 out of 3). Logically, since both conditions are satisfied, revocation should happen. But then they took a direct vote on revocation itself, and only one person voted in favor. The other two, who each agreed with one condition, actually believed the other condition wasn't met, so they voted against revocation. The direct vote was 2-1 against revocation, contradicting the separate votes.

  The user is confused because the outcome depends on how the vote is structured. They mention this feels like an impossibility theorem they've seen on LessWrong or Overcoming Bias, possibly related to Arrow's theorem. Their friend suggested Arrow's, but the user isn't sure since there are no rankings involved. They want to know if there's a recognized phenomenon here, and how to handle such situations in the future.

  First, I need to identify the phenomenon. This isn't Arrow's theorem because Arrow deals with ranked preferences and social choice functions. Here, it's about aggregating binary decisions. The key issue is that the separate votes on premises don't align with the conclusion vote. 

  I recall the doctrinal paradox. That's when a group decision on a conclusion (like guilt in a trial) depends on multiple premises. If each premise is voted on separately, the outcome might differ from a direct vote on the conclusion. That matches here: both premises got majority support, but the conclusion didn't. The doctrinal paradox explains this inconsistency.

  Then there's the discursive dilemma, which is a broader version where collective judgments on interconnected propositions can be inconsistent. The doctrinal paradox is a specific case of this. The user's situation fits perfectly. 

  Now, why did this happen? Because each voter's judgment on the premises leads to a conclusion, but when aggregated separately, the group's view on premises forces a conclusion that doesn't match the direct group vote. Voter A thought both conditions were met but voted against revocation? Wait, no. Let me map the votes:

  - Voter 1: Premise 1 true, Premise 2 true → Revoke (Yes)
  - Voter 2: Premise 1 true, Premise 2 false → No revoke
  - Voter 3: Premise 1 false, Premise 2 true → No revoke

  Separate votes: P1 true (V1, V2), P2 true (V1, V3). So both premises pass. But direct vote: Only V1 says revoke; V2 and V3 say no. Hence, 2-1 against revocation. The inconsistency arises because the majority on each premise doesn't reflect the individual conclusions.

  The user's deeper need might be about ensuring fair and consistent decision-making in their panel. They want to avoid such contradictions in the future. They might also be concerned about the legitimacy of their decision—was it right to go with the direct vote? Are there principles to decide which method is better?

  The literature suggests that both methods are logically defensible. Premise-based voting respects the structure of the rules but can lead to outcomes that most members disagree with. Conclusion-based voting reflects the group's overall will but might ignore the logical premises. 

  To prevent this, they could redesign their process. Requiring unanimity for revocation might be too strict. Alternatively, they could use a single vote on revocation but mandate detailed reasoning to ensure premises are considered. Or, sequential deliberation where they discuss until consensus on the premises or conclusion. 

  Another idea is to use a Bayesian approach, but that's complex. The simplest fix is to stick with conclusion-based voting but ensure thorough discussion of the premises first. That way, the direct vote is informed, but the group's overall judgment prevails. 

  The user might also need reassurance that this is a known issue, not their fault. Explaining the doctrinal paradox and its prevalence in legal and organizational contexts could help. They should establish a clear voting protocol in advance to avoid ambiguity in future cases.
answer: |-
  This situation is a textbook example of the **doctrinal paradox** (also known as the **discursive dilemma**), a well-established phenomenon in judgment aggregation theory. It highlights how seemingly logical voting procedures can produce inconsistent outcomes depending on whether a group votes on *premises* separately or on the *conclusion* directly. Your intuition about impossibility results is spot-on—this paradox reveals a fundamental tension in collective decision-making under logical constraints.

  ### Key Insights from the Paradox:
  1. **Premise-Based vs. Conclusion-Based Voting**:
     - **Premise-based approach**: Voting separately on each condition (here, "substantial departure" and "avoidability") and applying a logical rule ("both conditions → revoke") to the outcomes.  
     - **Conclusion-based approach**: Voting directly on the final decision ("revoke?").  
     - *The paradox arises when these methods conflict*, as in your case.

  2. **Why It Happened**:
     - Each voter applied individual judgment to the premises and conclusion, but the *majority coalitions differed* for each premise.  
     - Voter 1: Believed *both* premises true → Supported revocation.  
     - Voter 2: Believed "substantial departure" true but "avoidable" *false* → Opposed revocation.  
     - Voter 3: Believed "substantial departure" *false* but "avoidable" true → Opposed revocation.  
     - Thus, while majorities supported each premise *when voted separately*, only one voter supported the *conclusion* when voted directly.

  3. **Mathematical Inevitability**:  
     The paradox occurs because individual judgments are **logically connected** but **aggregated independently**. No voting system can always satisfy all three:  
     - Consistency (outcomes align with logical rules),  
     - Majoritarianism (decisions reflect majority votes),  
     - Path-independence (order of voting doesn’t matter).  

  ### Is One Outcome "More Correct"?  
  **No**—both approaches have defensible rationales:  
  - **Premise-based view**: Upholds the foundation of your rules. Revocation *should* follow automatically if both premises are satisfied, ensuring procedural fairness.  
  - **Conclusion-based view**: Reflects the group’s holistic judgment. If most panelists oppose revocation *despite* the premises, overriding them might better capture nuanced intent.  

  The literature (e.g., work by List, Pettit, or Kornhauser & Sager) emphasizes that **neither method is universally superior**. The choice depends on your foundation’s values:  
  - Prioritize **rule integrity**? → Use premise-based voting.  
  - Prioritize **deliberative consensus**? → Use conclusion-based voting.  

  ### How to Avoid the Paradox in Future Votes:  
  1. **Mandate a Single Voting Method in Advance**:  
     - Codify *which approach governs*: Either always vote *only on premises* (and bind the conclusion to the outcome), or always vote *only on the conclusion* (after debating premises).  
     - *Example clause*: "A grant shall be revoked only if, by majority vote, both Condition A and Condition B are affirmed separately. The final revocation decision is determined solely by these votes."  

  2. **Require Unanimity for High-Stakes Decisions**:  
     - If revocation requires unanimous consent, the paradox vanishes—but this may be overly restrictive.  

  3. **Sequential Deliberation**:  
     - Discuss premises until consensus emerges on *at least one*. If, say, all agree "departure was unavoidable," the conclusion follows without voting on the second premise.  

  4. **Bayesian Updating (Advanced)**:  
     - Panelists submit probabilistic assessments of premises. A facilitator aggregates these to compute the likelihood both hold, guiding the final vote. Tools like *forecasting platforms* can help.  

  ### Why Arrow’s Theorem Isn’t the Fit:  
  Your friend’s Arrow comparison is understandable—both reveal aggregation flaws—but Arrow applies to *preference rankings* over multiple options. Your case involves *binary judgments on interconnected propositions*, making the doctrinal paradox the precise framework.  

  ### Final Recommendation:  
  For your foundation, **conclusion-based voting is preferable** for revocation decisions, as it:  
  - Reflects the panel’s overall stance after deliberating *all* aspects,  
  - Avoids "mechanical" outcomes that contradict majority will (as in your case).  
  However, **document the rationale rigorously** for each no/yes vote to ensure premises are thoroughly considered. This balances procedural fairness with deliberative wisdom.  

  The paradox is a feature of group logic, not a flaw in your panel. By formalizing your voting method, you turn a philosophical quandary into a resolvable protocol.
