prompt: |-
  I'm a software engineer with no formal background in philosophy, but I recently spent a weekend working through Aquinas's own texts on tyranny, after noticing that the popular one-line gloss on his view ("Aquinas approved of killing tyrants") badly flattens what he actually argues. Across the early Commentary on the Sentences, De Regno, and the Summa's treatment of sedition (II-II, q. 42), Aquinas draws a sharp line between two cases. A private individual may licitly kill a tyrant who is a usurper, someone with no legitimate title to rule; but he may never, on his own private judgment, kill a ruler who holds legitimate title and has simply become oppressive in how he exercises it. That second case, Aquinas insists, belongs to public authority alone -- the community, or whoever installed the ruler -- and never to a private citizen acting on his own initiative. I'd like you to argue against this distinction using only premises Aquinas himself accepts elsewhere: that legitimate rule exists for the sake of the common good, and that ruling persistently for one's own advantage against the common good is precisely what makes someone a tyrant in the first place. Make the strongest case you can that, on Aquinas's own terms, "title" cannot be doing the work he needs it to do, so that his line between the usurper and the tyrannical title-holder collapses more than he lets on.
reasoning: |-
  Okay, the user is a software engineer diving into Aquinas's texts on tyranny. They noticed that the common simplification "Aquinas approved of killing tyrants" misses his nuanced distinction between usurpers and legitimate but oppressive rulers. The user wants me to argue against Aquinas's distinction using his own premises. Let me start by recalling Aquinas's key points.

  Aquinas says a private individual can kill a usurper because they lack legitimate title. But killing a legitimate ruler who becomes tyrannical must be left to public authority. The user's challenge is to show that "title" doesn't hold up under Aquinas's own principles. They mention that legitimate rule is for the common good and tyranny is ruling for personal advantage against that good. 

  First, I need to establish Aquinas's premises. The common good is the foundation of authority. Without it, authority loses legitimacy. Then, tyranny is defined by actions against the common good. The user's argument should target the moral weight of title versus actions. Aquinas prioritizes title, but his principles suggest actions define tyranny. 

  How to collapse the distinction? Argue that a legitimate ruler who turns tyrannical effectively voids their title because their actions betray the purpose of authority. If the common good is the source of legitimacy, persistent violation of it makes the ruler no different from a usurper. A usurper never had legitimacy; a tyrant abandons it. Both now act without just authority. 

  Next, address Aquinas's concern about anarchy. He worries private judgment could lead to chaos. But if the ruler is objectively tyrannical by Aquinas's definition, their continued rule is an ongoing act of aggression. The common good is under attack, justifying defense. Aquinas allows self-defense against unjust aggression by private individuals. Why not extend that to defending the community?

  Also, consider the role of public authority. If the ruler is the highest authority, who can act against them? The community, as the source of authority, retains the right to depose. But if the community is oppressed, organizing public action might be impossible. In such cases, private individuals acting as agents of the community's implicit will could be justified. 

  Potential counterarguments: Aquinas might say only public processes can legitimize such action. But if the tyrant subverts those processes, the system is broken. Then, the natural law principle of self-preservation might override procedural concerns. 

  I should use Aquinas's examples like killing a thief at night. If a tyrant is an immediate threat, similar principles might apply. The key is showing that title without adherence to the common good is meaningless. The distinction collapses because legitimacy is contingent on serving the common good, not just holding a title.
answer: |-
  Here’s the strongest possible argument against Aquinas’s distinction, built strictly from his own premises and definitions:

  ### Core Premises (from Aquinas Himself):
  1.  **The Final Cause of Authority:** Legitimate political authority exists *solely* for the common good ("*ad bonum commune*"). This is its essential purpose and justification (De Regno I.1, ST I-II Q.90 A.2, ST II-II Q.42 A.2 ad 3).
  2.  **The Definition of Tyranny:** A ruler becomes a tyrant precisely by persistently ruling for their *own private advantage* ("*propter suam utilitatem privatam*") *against* the common good (De Regno I.3, ST II-II Q.42 A.2).
  3.  **Authority Derives from Purpose:** The legitimacy (*titulus*) of any ruler is contingent upon their role as a servant of the common good. Authority is not an end in itself but a means to that end.
  4.  **The Right of Self-Preservation:** Individuals and communities have a natural right to resist unjust aggression threatening fundamental goods (ST II-II Q.64 A.7 - self-defense; ST II-II Q.42 A.2 ad 3 - community resisting tyrant).

  ### The Argument Collapsing the Distinction:
  1.  **The Essence of Tyranny Nullifies Legitimacy:** According to Premise #2, a ruler who persistently pursues their own advantage *against* the common good is, *by definition*, a tyrant. Crucially, Aquinas's definition focuses on the ruler's *actions and end* (private advantage vs. common good), not merely their origin or title. Premise #1 states that authority *only* has legitimacy insofar as it serves the common good. Therefore, **a ruler who persistently acts as a tyrant, by their very actions, *severs the moral link* that makes their title legitimate in the first place.** Their "legitimate title" becomes an empty shell, a *de jure* fiction devoid of *de facto* legitimacy because it contradicts the *purpose* for which authority exists. The title cannot morally shield actions that utterly pervert the *reason* for having the title.
  2.  **The Moral Equivalence of Usurpers and Tyrannical Title-Holders:** Both the usurper and the tyrannical title-holder share the same *essential characteristic*: they wield power *unjustly* and *against the common good*.
      *   The *usurper* lacks initial title and rules unjustly.
      *   The *tyrannical title-holder* possesses an initial title but, through persistent tyranny, *invalidates the moral basis* of that title (as argued in Point 1). They now *hold power without just authority* – which is precisely what defines the usurper.
      *   **Therefore, the *moral status* of the ruler wielding power destructively against the common good is identical, regardless of whether they lacked title initially or actively destroyed the legitimacy of their title through tyranny.** The difference is historical (how they came to power), not morally relevant to their *current* unjust exercise of power threatening the community.
  3.  **The Threat is Identical, the Right of Defense Should Be Too:** Aquinas grants individuals the right to kill a usurper acting tyrannically because the usurper represents an unjust aggressor against the community (De Regno I.6). The usurper's lack of title signifies their lack of just authority, making their aggression purely private. However, as argued in Points 1 & 2, a tyrannical title-holder, by persistently acting *against* the common good, also becomes an *unjust aggressor wielding power without just authority*. The *source* of the unjust aggression (a man with no title vs. a man who morally voided his title) is irrelevant to the *nature of the threat*: the community suffers oppression and the destruction of its common good. **If a private individual can licitly kill the usurper-tyrant as an unjust aggressor, why can they not licitly kill the title-holding tyrant who has become an identical unjust aggressor against the common good?** The common good is equally under attack.
  4.  **The "Public Authority" Problem in Tyranny:** Aquinas reserves action against the legitimate-but-tyrannical ruler for "public authority" – the community or those who appointed him (De Regno I.6, ST II-II Q.42 A.2 ad 3). However, a *persistent* tyrant, by definition, subverts or destroys the very institutions and processes of public authority. They often co-opt, intimidate, or dismantle representative bodies. **Aquinas's solution relies on a mechanism (public authority) that the tyrant's *very mode of rule* deliberately renders dysfunctional or inaccessible.** To insist that only this crippled or non-existent "public authority" can act is, in practice, to condemn the community to enduring tyranny indefinitely. The natural right of self-preservation (Premise #4), which Aquinas accepts for individuals and communities against aggression, must logically extend to defending against this aggression, even if the formal "public authority" channel is blocked by the aggressor himself.
  5.  **Title as a Distraction from the Essential End:** Aquinas's distinction places decisive moral weight on the historical fact of *titulus*. However, his own philosophy prioritizes *ends* and *purposes*. The *telos* (common good) is paramount. **Focusing on *titulus* in the face of persistent, destructive tyranny risks becoming a formalism that ignores the *substance* of authority (service to the common good) which gives *titulus* its moral meaning.** If the substance is utterly corrupted, clinging to the form (title) becomes morally perverse, contradicting the very purpose of political life as defined by Aquinas.

  ### Conclusion on Aquinas's Terms
  Aquinas's sharp distinction between the usurper-tyrant and the tyrannical title-holder collapses under the weight of his own foundational principles. His definition of tyranny (ruling against the common good) and his grounding of legitimacy *in* service to the common good mean that **persistent tyranny *itself* constitutes a moral abdication of legitimate authority.** The tyrant with an original title, through their actions, reduces themselves to the moral status of a usurper: a person wielding coercive power without just title *because* they act against the *only thing* that can confer title. The threat to the common good is identical in both cases. While Aquinas's concerns about anarchy and the dangers of private judgment are valid, his reliance on a potentially inaccessible "public authority" creates an impossible barrier, effectively granting the tyrant immunity precisely *because* of the title their tyranny has morally voided. On his own teleological grounds, where authority exists solely for the common good, a ruler who actively destroys that good forfeits the legitimacy that title signifies, leaving them as vulnerable to licit private resistance (as a last resort, under the principle of self-defense/community preservation) as any usurper. The line between "usurper" and "tyrant with title" blurs to the point of insignificance when confronted with the *reality* of ongoing, destructive oppression against the common good.
