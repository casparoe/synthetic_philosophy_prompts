  The user outlines two main theories: Wallace's "equal standing" approach, which focuses on unfairness in the moral relationship, and Todd's "unified account," which treats blame as a demand that's self-undermining when the blamer violates the norm. The user's main confusion is the asymmetry between blame and praise—why a hypocrite can't blame but can still praise, even if they don't follow the norm themselves (like an undisciplined coach praising discipline).

  I need to address why hypocrisy specifically undermines standing to blame but not praise, and how each theory handles this asymmetry. The user wants a gut-level explanation, not just technical jargon. They might be worried that their seminar will confuse students if this puzzle isn't clarified, so they need a coherent framework to present.

  First, the core issue: ad hominem vs. legitimate standing. The user is right that the truth of the criticism isn't the point—it's about the blamer's authority. Wallace's unfairness angle makes sense: blaming while exempting oneself violates reciprocity. Todd's view frames blame as a demand, which is inconsistent if the demander isn't complying. 

  For the praise asymmetry: praising doesn't require the same reciprocity. Praise affirms a value without imposing a burden. The coach isn't demanding anything; they're acknowledging merit, so their own flaws don't create unfairness or inconsistency. This resolves the asymmetry naturally—no need for stipulation. 

  The user might also wonder if there's a third theory, but Wallace and Todd cover the main grounds. Emphasizing the burden-imposing nature of blame versus the non-demanding nature of praise should help. I should reassure them that their intuition is sound and that the theories explain the asymmetry without ad hoc fixes.
answer: |-
  You've hit on one of the deepest and most persistent puzzles in the standing literature – and your framing is spot-on. The praise/blame asymmetry is the litmus test for any account of hypocrisy. Let's break this down intuitively, focusing on why hypocrisy undermines blame but not praise, and how the two main theories handle it:

  **The Core Intuition (Why Hypocrisy *Feels* Legitimate Despite Ad Hominem):**
  The gut reaction isn't that the hypocrite is *wrong* about the norm (infidelity *is* bad). It's that there's something profoundly *offensive* or *illegitimate* about *them* being the one to *deliver the blame*. It feels like a violation of the moral conversation itself. Imagine someone dripping wet from jumping in a pool shouting "GET OUT OF THE POOL, YOU'LL GET WET!" – the message might be true, but the messenger's position is absurd.

  **Why the Ad Hominem Charge Doesn't Stick:**
  Ad hominem attacks the *truth* of the claim based on the speaker's character. Standing objections attack the *speaker's authority* or *right* to *make* the claim *in this context*, regardless of its truth. It's about the *relational* or *performative* aspect of blaming, not the propositional content. The hypocrite isn't (necessarily) lying; they're poisoning the well of the moral exchange.

  **Dissecting the Two Theories & The Asymmetry:**

  1.  **Wallace-Style "Equal Standing"/Reciprocity (Unfairness Focus):**
      *   **Core Idea:** Blaming is part of a reciprocal moral relationship governed by norms of fairness. Holding someone accountable to a norm implicitly demands that you hold *yourself* accountable to it under relevantly similar circumstances. The hypocrite violates this reciprocity – they demand adherence while exempting themselves, creating an unfair power imbalance. It's like a judge sentencing someone for a crime they themselves just committed.
      *   **Handling Blame:** This explains the gut reaction: "Who are *you* to demand this of me when you won't demand it of yourself? You're not playing fair." The blamer loses moral authority because they've placed themselves outside the very relationship of mutual accountability they're invoking.
      *   **The Praise Problem:** This is where the asymmetry bites hardest for this view. *Why doesn't reciprocity apply to praise?*
          *   **Response 1 (Most Common):** Praise doesn't *demand* anything or hold someone *accountable*. It confers a benefit (recognition, esteem), not a burden (guilt, sanction). Reciprocity norms governing *burden-imposition* (blame) are stricter than those governing *benefit-conferral* (praise). The undisciplined coach isn't demanding the athlete *do* anything burdensome *for the coach's sake*; they're simply recognizing a positive trait. There's no unfair power play.
          *   **Response 2 (Less Satisfactory):** Maybe praise *does* sometimes require reciprocity (e.g., a notoriously stingy person praising generosity might ring hollow), but this is rarer and less fundamental than with blame. The asymmetry highlights that blame's core function is *enforcement*, demanding costly compliance, while praise is *appreciation*.

  2.  **Todd-Style "Unified Account" (Self-Undermining Demand):**
      *   **Core Idea:** Blaming is essentially *issuing a demand* for compliance with a norm. This act presupposes the blamer's own commitment to the norm and their sincerity in demanding it. Hypocrisy makes this demand *self-undermining* or incoherent. How can you *sincerely demand* I follow Rule X when you flagrantly violate Rule X yourself? Your actions scream that Rule X isn't actually binding or important. It's performatively inconsistent.
      *   **Handling Blame:** The hypocrite's act of blaming literally contradicts their own behavior, undermining the sincerity and force of the demand. "Comply with this norm I clearly don't value enough to follow!" lacks persuasive or authoritative force.
      *   **The Praise Problem:** This view handles the asymmetry more elegantly.
          *   **Praise isn't a Demand:** Praise is *commendation*, not a *demand for compliance*. The coach saying "Your discipline is excellent!" isn't demanding the athlete *be* disciplined *on the coach's behalf* or insisting on a norm *the coach must also follow*. They are simply *affirming* a positive quality. There's no performative contradiction. An undisciplined coach can genuinely *value* and *recognize* discipline in others, even if they lack it themselves. Their praise doesn't presuppose *their own* compliance in the way blame presupposes *their own* commitment when issuing a demand.

  **Why the Asymmetry is Key (and How the Theories Fare):**

  *   **Blame Imposes a Burden/Demand:** It calls for change, repentance, sanction. This inherently raises questions about the *authority* or *entitlement* of the imposer. "By what right do *you* burden *me* with this demand?" Hypocrisy provides a devastating answer: "You lack that right because you exempt yourself."
  *   **Praise Confers a Benefit/Recognition:** It doesn't impose a cost or demand action in the same way. The question "By what right do *you* praise me?" rarely arises, and if it does ("You're a fraud, your praise means nothing!"), it's about the *value* of the recognition (insincerity, ulterior motive), not about the *standing* to offer positive affirmation itself. An insincere praiser has a *different* fault (dishonesty), not necessarily a *standing* fault like the hypocrite blamer.

  **Conclusion & Recommendation for Your Seminar:**

  1.  **The asymmetry is real and illuminating:** It points to the core difference between the *enforcing* nature of blame and the *appreciative* nature of praise. Hypocrisy specifically undermines the authority needed for *enforcement*.
  2.  **Both theories *can* explain the asymmetry:**
      *   **Wallace (Reciprocity):** Focuses on the unfairness of imposing a *burden* while exempting oneself, which doesn't apply to conferring a *benefit* (praise).
      *   **Todd (Self-Undermining Demand):** Focuses on the performative inconsistency of *demanding* compliance with a norm you flout, which doesn't apply to *commending* compliance.
  3.  **Todd's view arguably handles it *more naturally*:** The "demand" structure cleanly distinguishes blame from praise. The burden/benefit distinction in Wallace's view is crucial but might feel slightly more like a helpful stipulation to *save* the theory from the asymmetry, whereas for Todd, the asymmetry falls out directly from the analysis of the speech acts.
  4.  **The Ad Hominem Red Herring:** Emphasize that standing isn't about the *truth* of the claim ("Is infidelity wrong?"), but about the *relational legitimacy* of *this speaker* making *this kind of forceful, burden-imposing speech act (blame)* directed at *this agent* in *this context*. Hypocrisy fatally wounds that legitimacy.

  **For Your Lecture:** Present the puzzle (hypocrite politician), the ad hominem worry, and the two families of solutions. Then, **use the praise asymmetry as the critical test.** Walk through how each theory tries to resolve it. Acknowledge that both *can*, but highlight how the asymmetry reveals the *enforcement* aspect central to blame that praise lacks. This will help students see why the intuition against hypocritical blame is robust and distinct from fallacious reasoning about the truth of the moral claim. The gut feeling survives because it's about the *performance of authority*, not the proposition.
