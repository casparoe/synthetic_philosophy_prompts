answer: |-
  You've hit upon a central and fascinating tension in *On Certainty*. Your friend is right that hinges *functionally resemble* foundationalist "basic beliefs" by halting the epistemic regress. However, Wittgenstein's *characterization* of hinges and their *metaphysical/epistemic status* is profoundly anti-foundationalist. Let's break down the comparison and why calling it "foundationalism" misses the revolutionary aspect:

  ### Core Similarity (The Functional Resemblance)
  1.  **Regress-Stopping:** Both foundationalism and hinge epistemology identify propositions/beliefs that are not justified by other beliefs. They serve as the "stopping point" for chains of justification.
  2.  **Immunity to Doubt:** Both treat these propositions as immune to (ordinary) doubt within the system. Doubting them seems nonsensical or paralyzing.
  3.  **Basis for Inquiry:** Both provide the necessary basis upon which ordinary empirical investigation, testing, doubting, and justifying can proceed. You need *something* fixed to measure movement against.

  ### Profound Differences (Why it's NOT Foundationalism)
  1.  **Justification vs. Non-Justification:**
      *   **Foundationalism:** Basic beliefs *are justified*. Their justification comes from intrinsic properties: they are self-evident, infallible, incorrigible, or given in experience. They are the *foundations* *of knowledge* precisely *because* they are securely justified.
      *   **Hinges (Wittgenstein):** Hinges are **groundless**. They are **not justified at all**, nor are they the *result* of knowledge. They are not "known" in the ordinary sense. As Wittgenstein says, "I know" is misapplied to them (e.g., OC 58, 151, 246). They are *prior to* the language-game of justification and doubt. Calling them "groundless" means they lack any *epistemic foundation*; they simply *are* the inherited framework we act within.

  2.  **Nature of the Propositions:**
      *   **Foundationalism:** Basic beliefs are often conceived as *individual* propositions ("I am appeared to redly," "I think, therefore I am," "Here is a hand") possessing specific justifying qualities. They are discrete building blocks.
      *   **Hinges (Wittgenstein):** Hinges form a **system** or a **world-picture** (OC 94, 162). They are deeply interconnected and evolve collectively over time (like the riverbed). They are not primarily *propositions we assent to* but **expressions of our way of acting** (OC 110, 204, 343, 411). "My life consists in my being content to accept many things" (OC 344). Their certainty lies in their *role in action*, not in their propositional content being luminous.

  3.  **Source of Certainty:**
      *   **Foundationalism:** Certainty derives from the *intrinsic epistemic properties* of the basic belief itself (self-evidence, indubitability, givenness).
      *   **Hinges (Wittgenstein):** Certainty derives from their **role as the inherited scaffolding of our language-games and practices** (OC 94-95, 105, 211, 248). Their certainty is **grammatical** or **framework-relational**, not evidential. Doubting them isn't refuted by evidence; it *undermines the possibility* of having a coherent language-game of doubt or evidence *at all* in that context. "If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty" (OC 115).

  4.  **Relationship to Doubt:**
      *   **Foundationalism:** Basic beliefs are immune to doubt *because* they are so strongly justified that doubt is irrational or impossible.
      *   **Hinges (Wittgenstein):** Hinges are immune to doubt **because meaningful doubt requires a framework of certainty**. Doubt *presupposes* hinges (OC 114-115, 120, 341). To doubt "Here is a hand" *in the relevant context* isn't to express a profound skepticism; it's to step outside the normal language-game, rendering the doubt itself unintelligible within that practice. The hinge isn't *proven* against doubt; it's the **condition for the possibility** of intelligible doubt elsewhere.

  5.  **Metaphor:**
      *   **Foundationalism:** A **building** (static, rigid, built upon secure bases).
      *   **Hinges (Wittgenstein):** A **hinge** (functional, enabling movement but not itself moving in *that* game), or a **riverbed** (dynamic, slowly changing, providing the channel for the fluid water of empirical propositions).

  ### Can Groundless Hinges Stop the Regress?
  **Yes, but in a radically different way than foundationalism.**

  *   **Foundationalism:** Stops the regress by finding an *epistemically secure starting point* (justified basic beliefs).
  *   **Wittgenstein:** Stops the regress by revealing that the demand for justification **must come to an end, not in a type of belief, but in a type of action or practice** (OC 110, 204). The regress doesn't hit a "foundation"; it hits the bedrock of our inherited form of life and our ways of acting. Justification *presupposes* this ungrounded ground. The "stopping" isn't epistemic (hitting a justified belief) but **grammatical/pragmatic** (reaching the point where the language-game of justification *begins*). It halts the regress by showing that the demand for justification *beyond* the hinges is **nonsense** within the practice they enable. It dissolves the problem rather than solving it within the justificatory framework.

  ### Is "Foundationalism" the Right Label?
  **No, not without significant qualification that risks obscuring Wittgenstein's point.**

  1.  **Rejection of the Justificatory Picture:** Foundationalism operates *within* the traditional epistemological picture of beliefs needing justification, offering one solution (basic beliefs). Wittgenstein challenges **the applicability of that entire picture** ("knowledge," "doubt," "justification," "belief") to the framework propositions (hinges). He's showing that our deepest certainties aren't the *answer* to the regress problem within epistemology; they reveal the *limits* of that problem as traditionally conceived.
  2.  **Not Epistemic Bedrock, but Enabling Framework:** Hinges aren't the secure *first floor* of the building of knowledge; they are the *rules of construction* or the *ground* the building stands on. They enable the *game* of building (justifying), but aren't part of the building itself.
  3.  **Therapeutic vs. Constructive:** Foundationalism is a *constructive* theory aiming to build a secure edifice of knowledge. Wittgenstein's discussion of hinges is largely *therapeutic* – it aims to dissolve philosophical anxieties (like radical skepticism) by showing they stem from misapplying concepts like "doubt" and "knowledge" to what makes their meaningful application possible. He's not building a rival epistemology; he's diagnosing a confusion.

  ### Conclusion: A Genuine Alternative
  Your instinct is correct. While hinges *function* to halt the regress like basic beliefs, Wittgenstein is offering a **genuine alternative** to the foundationalist (and coherentist, and infinitist) picture of justification. He shifts the focus:

  *   **From** "What propositions are intrinsically justified?" (Foundationalism)
  *   **To** "What is the inherited, practical, *ungrounded* framework of action and language that *enables* the very activities of doubting, justifying, and knowing?"

  Hinges are groundless *because* they are the background against which "grounded" and "ungrounded" make sense. Calling them "foundations" drags them back into the justificatory game they are meant to transcend. Wittgenstein isn't giving us a *better* foundationalism; he's showing us why the foundationalist quest (and its skeptical counterpart) misunderstands the nature of our deepest certainties, which are expressions of our form of life, not the conclusions of epistemic arguments. The "break" is real: it's a move from epistemology as first philosophy to understanding meaning and certainty as rooted in shared human practices and actions.
