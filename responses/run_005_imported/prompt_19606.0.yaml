  Include technical terms like replicator dynamics and reinforcement learning to show understanding. The dialogue needs to highlight the tension: Lewis's normative account vs. Skyrms's descriptive model. 

  Make sure neither character concedes too much. The Lewisian can acknowledge emergence but insist on cognition for true conventions. The Skyrmsian admits Lewis's framework's appeal but argues it's not explanatory. 

  Check that the dialogue addresses the "explanatory work" point. The Skyrmsian should argue that common knowledge isn't doing the causal work, while the Lewisian maintains it's essential for stability and normativity. 

