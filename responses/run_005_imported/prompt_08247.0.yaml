  Hmm. The user seems genuinely conflicted - they recognize his sincerity but feel unsettled. There's clear emotional pain beneath the philosophical question. The brother's transformation is positive, yet his response invalidates their lived experience. 

  I recall Anattā (not-self) in Buddhism isn't about denying responsibility but understanding impermanence. The brother's interpretation feels like a spiritual bypass - using doctrine to dodge accountability. Authentic practice would involve making amends, as seen in 12-step programs' Step 9. 

  The user needs validation that their hurt is legitimate. They're also subtly asking how to reconcile their brother's growth with this new barrier. The core isn't philosophy - it's whether their relationship can heal when one party dismisses the other's pain. 

  Important to note: Buddhist ethics emphasize compassion and reconciliation. The brother's stance contradicts that. Maybe he's clinging to the theory because facing his past actions is uncomfortable. His teachers would likely challenge this interpretation. 

  The user deserves an apology not as "blame" but as acknowledgment. Suggesting a reframed conversation - focusing on present impact rather than past faults - might help. Also, exploring if this reflects a pattern where the brother avoids discomfort through intellectualization.
answer: |-
  This is a fascinating and emotionally complex situation – and your brother is both **correct in his Buddhist framework** and **profoundly mistaken in its application to your relationship.** Here's a breakdown:

  1.  **The Doctrine (Anattā - "Not-Self"):** He's accurately describing the core Buddhist concept of *Anattā* (Pali) or *Anātman* (Sanskrit). This teaches that there is no permanent, unchanging, independent "self" or "soul." Instead, what we experience as "I" is a constantly changing stream of interdependent physical and mental processes (the Five Aggregates: form, feeling, perception, mental formations, and consciousness). Past thoughts, actions, and even consciousness are not the same as present ones. This is a fundamental insight aimed at reducing attachment and suffering.

  2.  **The Mistake in Application:**
      *   **Confusing "No Fixed Self" with "No Continuity of Responsibility":** While the *self* is not fixed, Buddhism *absolutely* emphasizes *karma* (intentional action) and its consequences (*vipāka*). Karma operates precisely *because* there is continuity in the stream of consciousness. Actions have consequences that ripple through this stream. The person sitting across from you *is* the inheritor of the karmic consequences of the actions committed by the mind-stream he identifies as "him" in the past. Responsibility isn't tied to a *permanent soul*, but to the *continuity of cause and effect* within that mental continuum.
      *   **Ignoring Ethical Obligations (Sīla):** Buddhist practice rests on three pillars: Wisdom (*paññā*), Concentration (*samādhi*), and **Ethical Conduct (*sīla*)**. A core part of *sīla* is making amends for past harmful actions. This is crucial for purifying the mind and reducing future suffering. The *Vinaya* (monastic code) is full of rules requiring monks to confess transgressions and make restitution. Lay practice also emphasizes honesty, integrity, and repairing harm. Using "no-self" to avoid acknowledging harm and making amends directly contradicts the ethical foundation of the path.
      *   **Spiritual Bypassing:** This is a classic case. He's using a profound spiritual insight (no-self) to avoid the uncomfortable but necessary interpersonal work of acknowledging harm, expressing remorse, and making amends. It's intellectually convenient but relationally damaging. Genuine insight should lead to *more* compassion and responsibility, not less.
      *   **Denying Your Experience:** His explanation effectively dismisses *your* very real experience of hurt and betrayal. It tells you that your feelings are invalid because they are based on an "illusion" of his fixed self. This is deeply unskillful communication and lacks empathy. Buddhism teaches to meet suffering (including yours) with compassion, not intellectual dismissal.

  3.  **What Genuine Buddhist Practice Would Look Like Here:**
      *   **Acknowledgment:** "I understand that my actions during that difficult time caused you significant pain and hurt our relationship."
      *   **Taking Responsibility:** "Regardless of how I understand the self now, those actions arose from *this* stream of consciousness, and I am responsible for their impact on you."
      *   **Sincere Apology:** "I am deeply sorry for the hurt I caused you, especially by not showing up at your wedding and not repaying the money I borrowed." (The money aspect is separate – see below).
      *   **Making Amends:** "What can I do now to help repair the trust between us?" This might involve concrete steps like repaying the loan (even partially or symbolically over time, if full repayment isn't feasible) and demonstrating through consistent, reliable behavior that he is trustworthy now. The *intention* to make amends is key.
      *   **Compassion:** Recognizing *your* continued hurt and meeting it with understanding, not dismissal.

  4.  **The Money:** The Buddhist ethical principle regarding debts is clear: debts should be repaid. Using "no-self" to avoid repaying a legitimate debt is ethically indefensible within the tradition. His current stability and practice ideally should lead him *towards* fulfilling this obligation, not away from it. Even if repayment must be gradual or symbolic due to current circumstances, the intention and effort matter immensely.

  **What This Means For You & Your Relationship:**

  *   **He's Not "Faking" the Philosophy:** He's likely sincere in his understanding of Anattā, but he's applying it in a self-serving, incomplete, and ethically flawed way.
  *   **Your Hurt is Valid:** Your feelings about the wedding and the money are completely understandable and deserve acknowledgment, not dismissal via metaphysics.
  *   **He *Is* Missing the Crucial Ethical Dimension:** He's focusing on the wisdom aspect while neglecting the essential foundation of ethical conduct (*sīla*) and the practical application of compassion.
  *   **How to Respond (If You Want To):**
      *   **Acknowledge His Insight:** "I appreciate that your practice has given you a deep understanding of impermanence and the nature of the self. That sounds profound."
      *   **Reframe the Need for an Apology:** Shift the focus from blaming the past "him" to the present impact and relationship repair: "While I understand your perspective on the non-fixed self, *my* experience of hurt and broken trust is very real *in the present*. An apology isn't about condemning a past self; it's about *you now* acknowledging the impact those actions *still have* on *me now* and expressing a desire to heal *our current relationship*."
      *   **Focus on Karma & Ethics:** "My understanding is that Buddhist ethics emphasize taking responsibility for the consequences of actions (*karma*) and making amends to reduce suffering. Hearing you acknowledge the hurt and express regret would feel like an important step in that process *for me*."
      *   **Address the Money Directly (Calmly):** "Regarding the money, I understand circumstances were different then. However, repaying debts is also part of ethical conduct. Can we talk about how we might address that now, even if it needs to be gradual?"
      *   **Express Your Need:** "For *our relationship* to feel healed and trusting *going forward*, I need to feel that you understand how deeply those events hurt me and that you genuinely regret causing that pain."

  **In essence:** Your brother has grasped a profound truth (no fixed self) but is wielding it as a shield against vulnerability, ethical responsibility, and genuine relational repair. True Buddhist practice in this situation wouldn't negate your pain with philosophy; it would meet it with humility, remorse, and a sincere effort to make things right. His current stance, while perhaps intellectually consistent on one level, falls far short of the compassion and ethical maturity that deep practice should cultivate.
