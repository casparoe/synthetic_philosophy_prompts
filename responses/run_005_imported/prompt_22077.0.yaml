  Second round: Small-improvement test. Nora lands a solid blow here. If tiny improvements don't tip scales, it challenges Julian's vagueness model - heap paradoxes involve borderline cases, but this seems different. Julian's Broome-style vagueness defense feels stretched when career decisions involve discontinuous value shifts (tenure vs no tenure).

