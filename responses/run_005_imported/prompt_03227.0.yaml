  ### Failure of Commutativity in Jeffrey Conditionalization

  Jeffrey conditionalization updates beliefs when new evidence redistributes confidence across a partition of possibilities without making any single element certain. Unlike standard conditionalization, successive applications of Jeffrey's rule do not necessarily commute: the order in which evidence is incorporated can affect the final posterior probabilities. Below is a fully specified numerical example demonstrating this non-commutativity, followed by an explanation of the conditions under which the order of updates would not matter.

  #### Numerical Example
  - **Outcome space**: Consider two binary properties, \(F\) and \(G\), defining four mutually exclusive and exhaustive states:
    - \(S_1\): \(F\) true and \(G\) true
    - \(S_2\): \(F\) true and \(G\) false
    - \(S_3\): \(F\) false and \(G\) true
    - \(S_4\): \(F\) false and \(G\) false

  - **Prior probabilities** (with dependence between \(F\) and \(G\)):
    - \(P(S_1) = 0.4\)
    - \(P(S_2) = 0.1\)
    - \(P(S_3) = 0.1\)
    - \(P(S_4) = 0.4\)
    
    Here, \(P(F) = P(S_1) + P(S_2) = 0.5\) and \(P(G) = P(S_1) + P(S_3) = 0.5\), but \(F\) and \(G\) are not independent because \(P(S_1) = 0.4 \neq P(F) \cdot P(G) = 0.25\).

  - **First observation (\(E_1\))**: Uncertain evidence about \(F\), leading to new probabilities for the partition \(\{F, \neg F\}\):
    - \(P_{\text{new}}^{E_1}(F) = 0.7\)
    - \(P_{\text{new}}^{E_1}(\neg F) = 0.3\)

  - **Second observation (\(E_2\))**: Uncertain evidence about \(G\), leading to new probabilities for the partition \(\{G, \neg G\}\):
    - \(P_{\text{new}}^{E_2}(G) = 0.6\)
    - \(P_{\text{new}}^{E_2}(\neg G) = 0.4\)

  **Update sequence 1: \(E_1\) then \(E_2\)**

  1. **After \(E_1\) (Jeffrey update on \(\{F, \neg F\}\))**:
     - \(P_1(S_1) = P(S_1 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P(S_1 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = \left( \frac{0.4}{0.5} \right) \cdot 0.7 + 0 \cdot 0.3 = 0.8 \cdot 0.7 = 0.56\)
     - \(P_1(S_2) = P(S_2 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P(S_2 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = \left( \frac{0.1}{0.5} \right) \cdot 0.7 + 0 \cdot 0.3 = 0.2 \cdot 0.7 = 0.14\)
     - \(P_1(S_3) = P(S_3 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P(S_3 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = 0 \cdot 0.7 + \left( \frac{0.1}{0.5} \right) \cdot 0.3 = 0 + 0.2 \cdot 0.3 = 0.06\)
     - \(P_1(S_4) = P(S_4 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P(S_4 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = 0 \cdot 0.7 + \left( \frac{0.4}{0.5} \right) \cdot 0.3 = 0 + 0.8 \cdot 0.3 = 0.24\)

     Intermediate probabilities: \(P_1(S_1) = 0.56\), \(P_1(S_2) = 0.14\), \(P_1(S_3) = 0.06\), \(P_1(S_4) = 0.24\).

  2. **After \(E_2\) (Jeffrey update on \(\{G, \neg G\}\) using \(P_1\))**:
     - First, compute \(P_1(G) = P_1(S_1) + P_1(S_3) = 0.56 + 0.06 = 0.62\) and \(P_1(\neg G) = P_1(S_2) + P_1(S_4) = 0.14 + 0.24 = 0.38\).
     - \(P_{\text{final}}(S_1) = P_1(S_1 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P_1(S_1 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = \left( \frac{0.56}{0.62} \right) \cdot 0.6 + 0 \cdot 0.4 \approx 0.9032 \cdot 0.6 \approx 0.5419\)
     - \(P_{\text{final}}(S_2) = P_1(S_2 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P_1(S_2 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = 0 \cdot 0.6 + \left( \frac{0.14}{0.38} \right) \cdot 0.4 \approx 0.3684 \cdot 0.4 \approx 0.1474\)
     - \(P_{\text{final}}(S_3) = P_1(S_3 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P_1(S_3 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = \left( \frac{0.06}{0.62} \right) \cdot 0.6 + 0 \cdot 0.4 \approx 0.0968 \cdot 0.6 \approx 0.0581\)
     - \(P_{\text{final}}(S_4) = P_1(S_4 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P_1(S_4 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = 0 \cdot 0.6 + \left( \frac{0.24}{0.38} \right) \cdot 0.4 \approx 0.6316 \cdot 0.4 \approx 0.2526\)

     Final probabilities: \(P_{\text{final}}(S_1) \approx 0.5419\), \(P_{\text{final}}(S_2) \approx 0.1474\), \(P_{\text{final}}(S_3) \approx 0.0581\), \(P_{\text{final}}(S_4) \approx 0.2526\).

  **Update sequence 2: \(E_2\) then \(E_1\)**

  1. **After \(E_2\) (Jeffrey update on \(\{G, \neg G\}\))**:
     - \(P_2(S_1) = P(S_1 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P(S_1 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = \left( \frac{0.4}{0.5} \right) \cdot 0.6 + 0 \cdot 0.4 = 0.8 \cdot 0.6 = 0.48\)
     - \(P_2(S_2) = P(S_2 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P(S_2 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = 0 \cdot 0.6 + \left( \frac{0.1}{0.5} \right) \cdot 0.4 = 0 + 0.2 \cdot 0.4 = 0.08\)
     - \(P_2(S_3) = P(S_3 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P(S_3 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = \left( \frac{0.1}{0.5} \right) \cdot 0.6 + 0 \cdot 0.4 = 0.2 \cdot 0.6 = 0.12\)
     - \(P_2(S_4) = P(S_4 \mid G) \cdot P_{\text{new}}^{E_2}(G) + P(S_4 \mid \neg G) \cdot P_{\text{new}}^{E_2}(\neg G) = 0 \cdot 0.6 + \left( \frac{0.4}{0.5} \right) \cdot 0.4 = 0 + 0.8 \cdot 0.4 = 0.32\)

     Intermediate probabilities: \(P_2(S_1) = 0.48\), \(P_2(S_2) = 0.08\), \(P_2(S_3) = 0.12\), \(P_2(S_4) = 0.32\).

  2. **After \(E_1\) (Jeffrey update on \(\{F, \neg F\}\) using \(P_2\))**:
     - First, compute \(P_2(F) = P_2(S_1) + P_2(S_2) = 0.48 + 0.08 = 0.56\) and \(P_2(\neg F) = P_2(S_3) + P_2(S_4) = 0.12 + 0.32 = 0.44\).
     - \(P_{\text{final}}'(S_1) = P_2(S_1 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P_2(S_1 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = \left( \frac{0.48}{0.56} \right) \cdot 0.7 + 0 \cdot 0.3 \approx 0.8571 \cdot 0.7 \approx 0.6000\)
     - \(P_{\text{final}}'(S_2) = P_2(S_2 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P_2(S_2 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = \left( \frac{0.08}{0.56} \right) \cdot 0.7 + 0 \cdot 0.3 \approx 0.1429 \cdot 0.7 \approx 0.1000\)
     - \(P_{\text{final}}'(S_3) = P_2(S_3 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P_2(S_3 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = 0 \cdot 0.7 + \left( \frac{0.12}{0.44} \right) \cdot 0.3 \approx 0.2727 \cdot 0.3 \approx 0.0818\)
     - \(P_{\text{final}}'(S_4) = P_2(S_4 \mid F) \cdot P_{\text{new}}^{E_1}(F) + P_2(S_4 \mid \neg F) \cdot P_{\text{new}}^{E_1}(\neg F) = 0 \cdot 0.7 + \left( \frac{0.32}{0.44} \right) \cdot 0.3 \approx 0.7273 \cdot 0.3 \approx 0.2182\)

     Final probabilities: \(P_{\text{final}}'(S_1) \approx 0.6000\), \(P_{\text{final}}'(S_2) \approx 0.1000\), \(P_{\text{final}}'(S_3) \approx 0.0818\), \(P_{\text{final}}'(S_4) \approx 0.2182\).

  **Comparison**:
  - For \(S_1\): \(0.5419 \neq 0.6000\)
  - For \(S_2\): \(0.1474 \neq 0.1000\)
  - For \(S_3\): \(0.0581 \neq 0.0818\)
  - For \(S_4\): \(0.2526 \neq 0.2182\)

  The final probabilities differ depending on the order of updates, demonstrating the failure of commutativity. The non-commutativity arises because:
  - The partitions for the two updates (\(\{F, \neg F\}\) and \(\{G, \neg G\}\)) are different.
  - \(F\) and \(G\) are dependent under the prior (as \(P(S_1) = 0.4 \neq P(F) \cdot P(G) = 0.25\)).

  #### When Order Does Not Matter
  For the order of Jeffrey updates to stop mattering (i.e., for commutativity to hold), the following conditions must be satisfied:
  1. **Identical partitions**: If both pieces of evidence update the same partition, commutativity holds because the updates apply to the same set of possibilities. For example, if both \(E_1\) and \(E_2\) update the partition \(\{F, \neg F\}\), then the final posterior depends only on the net change in probabilities for that partition.
  2. **Independent properties and partitions**: If the properties defining the partitions are probabilistically independent under the prior, and the evidence affects these properties independently, then commutativity holds. Specifically:
     - The partitions must be such that the conditional probabilities are consistent across updates.
     - Formally, for partitions \(\mathcal{P}_1\) and \(\mathcal{P}_2\), commutativity holds if \(\mathcal{P}_1\) and \(\mathcal{P}_2\) are independent under the prior (i.e., for all \(A \in \mathcal{P}_1\) and \(B \in \mathcal{P}_2\), \(P(A \cap B) = P(A) \cdot P(B)\)). In this case, the Jeffrey updates commute because the evidence does not introduce dependence.

  In the example above, if \(F\) and \(G\) were independent under the prior (e.g., \(P(S_1) = P(S_2) = P(S_3) = P(S_4) = 0.25\)), then the updates would commute. For instance, with a uniform prior, updating first on \(F\) (to \(P(F) = 0.7\)) and then on \(G\) (to \(P(G) = 0.6\)) yields the same result as the reverse order for all states.

  Thus, commutativity fails when the partitions differ and the underlying properties are dependent, but it holds when the partitions are identical or when the properties are independent.
