prompt: |-
  Ok, kind of a weirdly specific request but bear with me. About two years ago I turned down a great job offer in another country because my partner at the time didn't want to relocate, and then we broke up anyway eight months later. Ever since then I can't stop running the tape on the version of me that took the job instead -- like, is there a "me" out there somewhere actually living that life, or is it more like a stranger who just happens to share my memories up to that point. My roommate is finishing a philosophy MA and got so tired of listening to me spiral about this that she made me read up on the whole debate between David Lewis's counterpart theory and the older transworld identity picture of modality, and now I'm kind of obsessed with it. Anyway -- I co-host a tiny philosophy podcast out of our apartment, its really just me and my friend Priya and maybe 300 downloads on a good week, and I somehow talked a modal metaphysician who's a committed counterpart theorist into coming on to defend the view against transworld identity.

  I really don't want this episode to be him just re-explaining "worlds don't overlap so we need counterparts" while we nod along. Can you draft me around eight interview questions that actually press on the view rather than let him restate it? I want at least one question built on Kripke's Humphrey objection (the worry that saying "Humphrey could have won" is really talking about somebody else, and the real Humphrey presumably doesn't care what happens to his lookalike), one that pushes on Lewis's own "accidental intrinsics" argument -- his reason for saying a single individual can't just be bent in one world and straight in another the way a perduring object is bent at one time and straight at another -- and why that same move isn't just as available to a transworld identity theorist, and one on the fact that the counterpart relation is just similarity and can tie, so a person could in principle have two equally good counterparts in the same world that disagree on some claim about "him." For each of those, give me a sharp follow-up keyed to whatever dodge he's most likely to reach for first. Then close with one question that's really for me: on his view, is it even coherent for me to grieve the life I didn't choose, given that the person living it was technically never me to begin with?
