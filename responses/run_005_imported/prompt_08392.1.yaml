answer: |-
  Here's a toast designed to hit both the science and the heart, keeping it warm, accurate, and under 5 minutes, playing perfectly off the contrast you described:

  **(Clink glass gently)** Friends, family, colleagues, esteemed guests... and especially Aunt [Aunt's Name].

  For forty years, my aunt has been obsessed with genes. Not *jeans* – though I’m sure she owns a pair – but *genes*. The tiny instructions tucked away inside every living thing. Specifically, she’s been a fierce champion of the "gene's-eye view" of evolution. Now, I’m just a software engineer – I deal in ones, zeros, and debugging existential dread in code – so bear with me as I attempt to translate her life's work into family-friendly terms.

  From what I understand, Aunt [Aunt's Name] argues that to *really* get evolution, you shouldn't look at the whole ant, or the whole bird, or even the whole complicated human like us. You need to zoom way, way in. Down to the level of the individual gene. The idea is that natural selection isn't picking the *strongest* lion or the *prettiest* peacock; it’s ultimately favoring the genes that are best at… well, making copies of themselves for the next generation. It’s a perspective that famously uses a loaded word: "selfish."

  Now, this led to some legendary debates! Like that decade-long tango about the self-sacrificing worker ant. Does her heroic kamikaze run for the colony *need* some grand idea of "colony good"? Or is it perfectly explained by cold, hard math: the fact that she shares so many genes with the sisters she’s saving? Aunt [Aunt's Name] stood firm: the genes are the stars of the show. No higher-level altruism required. Just genes, doing what genes do to persist.

  **(Pause, smile warmly at Aunt)**

  Which brings us to the family’s favorite running joke. Because if you know Aunt [Aunt's Name]... *really* know her... the word "selfish" is possibly the *least* accurate descriptor imaginable.

  To us, she’s the person who drops everything to drive across state lines when a nephew has the flu. She’s the one who spends hours patiently explaining complex ideas – not just to grad students, but to wide-eyed nieces and nephews who asked "why is the sky blue?" one too many times. She’s the first to organize help, the last to take credit, the one whose generosity seems almost… biologically improbable! **(Look at the colleagues)** Seriously, folks, has there *been* a study on this phenotype? Because it defies conventional models!

  **(Address Aunt directly, voice softening)**

  Aunt [Aunt's Name], that’s the beautiful irony we all celebrate tonight. You spent four decades teaching the world to see the profound, sometimes ruthless, logic of the gene’s-eye view. You showed us how complex cooperation and even sacrifice can emerge from the simple, relentless drive of genes to replicate. You argued brilliantly that understanding that fundamental level explains so much about life’s tapestry.

  But *you*… you are the living, breathing, incredibly generous counterpoint to any *literal* interpretation of "selfish." You embody the incredible truth that understanding the mechanics of the universe doesn't diminish the wonder of what arises from it. It *enhances* it.

  Knowing the precise genetic calculus that *might* explain an ant’s sacrifice doesn’t make the act less noble. And understanding the gene’s-eye view doesn't make *your* decades of selflessness, your mentorship, your unwavering support for students and family alike, any less profound or real. In fact, it makes it all the more remarkable. You understood the fundamental algorithm, and then you chose, day after day, to write a different kind of code – one overflowing with warmth, dedication, and genuine care.

  So tonight, we raise our glasses not just to the brilliant scientist who dissected the logic of life, but to the incredible *person* who transcended it. You showed us the power of the gene, but you lived the power of the heart.

  To Aunt [Aunt's Name]: Thank you for teaching us how life works, and thank you even more for showing us how beautifully it can be lived. May your retirement be as rich, fulfilling, and wonderfully complex as the evolutionary processes you dedicated your life to understanding. Cheers!

  **Why this works:**

  1.  **Accurate Science:** Uses correct terminology ("gene's-eye view," "natural selection," "persist," "kin selection" implied via the ant example). Acknowledges her specific debate (worker ant/colony good) without needing deep explanation. Colleagues will appreciate the precise phrasing and understanding of her core stance.
  2.  **Accessible & Warm:** Explains complex ideas simply (software engineer analogy, "tiny instructions," "cold, hard math"). Focuses on *her* actions familiar to family (helping sick nephew, explaining things, organizing). The "selfish" vs. generous contrast is crystal clear and relatable.
  3.  **The Contrast is the Core:** The entire toast builds on the irony, making it the central, unifying theme. It's affectionate, not mocking.
  4.  **Respectful & Affectionate:** Praises her intellect, dedication, and impact ("brilliant scientist," "fierce champion," "legendary debates"). Highlights her personal qualities with specific, loving examples. The tone is admiring and warm.
  5.  **Humor:** The "jeans/genes" opener, the "biologically improbable" line (especially looking at colleagues), and the "different kind of code" metaphor land gently and acknowledge the family joke without being mean.
  6.  **Emotional Payoff:** Connects her scientific understanding to her personal life beautifully ("transcended it," "power of the heart"). Makes her life's work meaningful on a human level for everyone in the room.
  7.  **Structure:** Clear opening, accessible science explanation, introduction of the contrast, personal anecdotes highlighting generosity, resolution of the irony, heartfelt conclusion/toast.
  8.  **Time:** This script, delivered at a moderate pace with pauses, fits comfortably within 5 minutes.

  **Delivery Tips:**

  *   **Pace Yourself:** Don't rush. Pause after the science bit, before the "which brings us..." transition, and before the final toast.
  *   **Eye Contact:** Scan the room, but especially focus on your aunt during the personal parts and the final lines. Glance at the colleagues during the "biologically improbable" line.
  *   **Tone:** Warm, affectionate, slightly awed by her science, genuinely admiring of her character. Keep the humor gentle and loving.
  *   **Practice:** Read it aloud a few times to ensure smooth delivery and timing.

  This toast celebrates your aunt's significant career in a way her colleagues will respect and her family will understand and love, all tied together with the perfect, heartwarming contrast that defines her. Break a leg! She'll be touched.
