  ### Dialogue: The Bargaining Axiom Dispute  
  **Setting:** Two rational choice theorists, **Nash** (defender of the Nash bargaining solution) and **Kalai** (advocate for Kalai-Smorodinsky and Gauthier’s minimax relative concession), debate over coffee.  

  ---

  **Nash:** Kalai, I appreciate Gauthier’s elegance in *Morals by Agreement*, but I can’t swallow minimax relative concession. It’s just Kalai-Smorodinsky (KS) in disguise—and KS throws out Independence of Irrelevant Alternatives (IIA). If we drop IIA, rationality goes out the window.  

  **Kalai:** And *your* Nash solution jettisons **monotonicity**, David. That’s the very essence of fairness! Gauthier’s contractors—or any rational agents—shouldn’t be *punished* when the bargaining set expands in their favor. Minimax relative concession ensures that.  

  **Nash:** Monotonicity is a luxury, not a necessity. IIA is foundational: if an outcome is best in a large set, it should still be best in a smaller subset containing it. Deleting “irrelevant” alternatives shouldn’t change the solution. KS fails this spectacularly.  

  **Kalai:** Let’s get concrete. I’ll show you why monotonicity matters. Imagine two fishers bargaining over a lake. The feasible set (S1) is the triangle: utilities (0,0) for disagreement, (1,0) if Fisher 1 gets everything, and (0,1) if Fisher 2 gets everything. Your Nash solution?  

  **Nash:** (0.5, 0.5). The product-maximizing point.  

  **Kalai:** Now, the lake expands—new currents make it easier for Fisher 1 to catch fish alone. The new set (S2) adds (1.5, 0.2). So S2 is the convex hull of (0,0), (1.5,0.2), (0,1). Your Nash solution now?  

  **Nash:** *Calculates.* The Pareto frontier runs from (1.5,0.2) to (0,1). Maximizing the product (u₁)(u₂) gives... u₁ ≈ 0.94, u₂ ≈ 0.6. So (0.94, 0.6).  

  **Kalai:** Precisely! Fisher 2’s utility *increased* from 0.5 to 0.6—monotonicity holds *here*. But change the expansion: suppose S2 adds (1.2, 0.1) instead. Now S2 is the convex hull of (0,0), (1.2,0.1), (0,1).  

  **Nash:** *Works it out.* Frontier from (1.2,0.1) to (0,1). Nash maximizes u₁u₂ = u₁(1 - \frac{0.9}{1.2}u₁)... u₁ = 0.67, u₂ = 0.5. So (0.67, 0.5).  

  **Kalai:** Fisher 2’s utility **stuck at 0.5**! The lake expanded purely for Fisher 1—his max utility jumped from 1 to 1.2—yet Fisher 2 gets *nothing* extra. With KS, Fisher 2’s ideal utility also rises to 1.2 (since (1.2,1) is ideal, even if infeasible). KS gives (0.6, 0.6) by *equalizing relative concessions*: (u₁/1.2) = (u₂/1). Your Nash solution ignores Fisher 2’s potential gains—violating monotonicity.  

  **Nash:** *Leans in.* But your KS is hypersensitive to "phantom" options. Take my turn. Suppose two entrepreneurs split a $1 investment. Set S: they can do (0.5, 0.5) or (0,1)—e.g., Entrepreneur 2 takes all with a risky loan. The KS ideal is (0.5,1). The ray of equal ratios intersects the frontier—from (0.5,0.5) to (0,1)—at (0.5,0.5).  

  **Kalai:** So KS = (0.5, 0.5). Gauthier’s minimax relative concession agrees—concessions are equal.  

  **Nash:** Now, delete the "irrelevant" option (0,1). The new set T is just the point (0.5,0.5). What’s KS now?  

  **Kalai:** In T, there’s only one point—(0.5,0.5). So KS is (0.5,0.5).  

  **Nash:** *Smirks.* No! KS recalculates the ideal point. In T, Entrepreneur 1’s max utility is 0.5 (since only one point), but Entrepreneur 2’s is still 0.5. The ray u₁/0.5 = u₂/0.5 is u₁ = u₂. But the "frontier" is the point (0.5,0.5), so KS = (0.5,0.5). Here it holds, but let’s alter S.  
  Suppose S is the convex hull of (0,0), (0.5,0.5), and (0,1). KS is (0.33, 0.67) because the ideal is (0.5,1), and the equal-ratio ray hits the frontier at u₁/0.5 = u₂/1 → u₁ = 0.33, u₂ = 0.67. Now, delete the option (0.5,0.5). The new set U is the segment from (0,0) to (0,1).  

  **Kalai:** *Sighs.* Now U has Pareto frontier (0,1). Entrepreneur 1’s max utility is 0 (since any move from (0,1) lowers u₂). Entrepreneur 2’s max is 1. KS requires u₁/0 = u₂/1, which is undefined. We’d default to the only efficient point: (0,1).  

  **Nash:** But (0.33,0.67) was feasible in S and still available in U! Yet KS jumps from (0.33,0.67) in S to (0,1) in U—simply because we deleted an option *no one would choose*. IIA forbids this: if (0.33,0.67) was valid in S, it’s still valid in U. Nash doesn’t budge—it’s invariant.  

  **Kalai:** That’s disingenuous! Deleting (0.5,0.5) *alters the ideal point* from (0.5,1) to (0,1). It’s not irrelevant—it defines the bargaining power! Gauthier’s contractors care about the *range of possible gains*. If you cap my potential utility, my concession changes.  

  **Nash:** But the outcome (0.33,0.67) is physically unchanged! Why should removing an option that wasn’t chosen—that didn’t affect the outcome—shift the solution? It’s irrational. Your "monotonicity" prioritizes hypotheticals over actual choices.  

  **Kalai:** And your IIA ignores power imbalances! In the lake example, expanding Fisher 1’s options doesn’t improve Fisher 2’s fallback, so why should Fisher 2’s share stagnate? Minimax relative concession—like KS—ensures mutual benefit from new opportunities.  

  **Nash:** *Pauses.* Fine, but consider Gauthier’s own critique. If we add an option that only benefits one agent—say, Fisher 1 gets a new net, expanding the set to (1.5,0.5)—Nash gives (1.5,0.5). Fisher 2 still gets 0.5, unchanged. Where’s the harm?  

  **Kalai:** Harm? Fisher 2’s *relative concession* worsens! Originally, they conceded 50% of their ideal gain (from 0 to 1). Now, Fisher 1 concedes only 25% (from 0 to 1.5 → gain 1.5, concession 0.75), while Fisher 2 concedes 50% (gain 0.5, concession 0.5). Minimax relative concession equalizes *proportionate sacrifice*, so KS adjusts to restore fairness.  

  **Nash:** So you inflate Fisher 2’s "ideal" to 1.5 artificially? That’s not real bargaining power—it’s a phantom. IIA anchors to feasible outcomes.  

  **Kalai:** And monotonicity anchors to justice. When the set expands, the solution should reflect new possibilities—not trap the disadvantaged.  

  **Nash:** Then we agree to disagree. For my seminar paper, I’ll defend IIA: stability against manipulation.  

  **Kalai:** And I’ll defend monotonicity: progress for all when the pie grows. Gauthier’s contractors would revolt otherwise.  

  ---  
  **Conclusion:**  
  - **Nash’s comeback:** KS’s sensitivity to ideal points (even when unchanged options exist) invites manipulation. Deleting "irrelevant" options can strategically shift outcomes.  
  - **Kalai’s comeback:** Nash’s indifference to expansions that purely favor one party entrenches inequality. Monotonicity ensures gains from growth are shared.  
  - **Unresolved:** Nash prioritizes consistency (IIA); Kalai prioritizes fairness under change (monotonicity). Gauthier’s minimax relative concession sides with Kalai, but Nash’s realism about feasible choices endures. Neither axiom is universally "correct"—the choice hinges on whether you value procedural invariance (Nash) or dynamic equity (Kalai).
