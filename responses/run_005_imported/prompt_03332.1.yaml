  I should break down where Rawls and Harsanyi diverge. Both start with uncertainty behind the veil, but Harsanyi assumes equal probabilities, while Rawls rejects any probabilistic knowledge. However, since Rawls later concedes some probability assignments might be possible, the weight shifts to the other conditions. The key difference is how each views the choice context. Harsanyi sees it as a rational gamble; Rawls as a unique, high-stakes decision. 

