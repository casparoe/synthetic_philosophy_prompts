answer: |-
  ## MEMORANDUM

  **TO:** Academic Integrity Board Members  
  **FROM:** Chair, Academic Integrity Board  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Evidentiary Standard Policy & Analysis of Subcommittee Proposal  

  **1. RECOMMENDATION:**  
  **The Board should retain the single evidentiary standard of "clear and convincing evidence" for *all* determinations of academic misconduct, regardless of the potential sanction.**  

  **2. RATIONALE:**  
  *   **Foundational Fairness:** A consistent standard ensures all students are judged under the same threshold for establishing wrongdoing. The core question—"Did this student violate academic integrity?"—is binary. The severity of the violation (e.g., copying homework vs. commissioning a thesis) is already captured in the *facts of the case*, which inherently influence the Board’s assessment of whether misconduct occurred and its seriousness.  
  *   **Preserving Integrity of the Fact-Finding Process:** Separating the *finding of guilt* from the *determination of sanction* maintains procedural clarity and fairness. The evidentiary standard pertains solely to the first question: *did the violation happen?* Once guilt is established under a fixed, high standard, the Board then deliberates on the *appropriate sanction*, considering mitigating/aggravating factors and proportionality.  
  *   **Avoiding Philosophical & Practical Quagmires:** The sliding scale proposal creates significant problems:  
      *   **Retroactive "Guilt" Definition:** Making the finding of guilt contingent on the chosen punishment ("We only need 60% certainty to say you cheated if we just give a warning, but 90% to expel you") fundamentally distorts the concept of guilt. It implies the *same factual actions* might not constitute "cheating" if the Board opts for a lesser sanction. This undermines the principle that guilt is an objective finding based on evidence.  
      *   **Operational Confusion:** Requiring adjudicators to calibrate their evidentiary threshold based on hypothetical future sanctions injects complexity and potential bias into the fact-finding phase.  

  **3. COMMITMENT REGARDING PHILOSOPHICAL FRAMINGS:**  
  This recommendation **aligns with neither Pragmatic Encroachment nor Epistemic Contextualism** as primary justifications. It rejects the core tenet of Pragmatic Encroachment applied here – that the *stakes* (potential sanction) change what constitutes sufficient evidence *to know guilt*. It also rejects the Contextualist view that the *meaning* of "proven" shifts with the sanction context. Instead, it commits to:  
  *   **Invariantism:** The threshold for what constitutes sufficient proof of misconduct ("clear and convincing evidence") is fixed and independent of the potential consequences. The *facts* and the *standard* to judge them are constant.  
  *   **Two-Stage Deliberation:** Context (severity, impact, intent) is rigorously considered, but only *after* guilt is established under the invariant standard. Context determines *sanction*, not *guilt*.  

  **4. ENGAGING WITH THE STRONGEST OBJECTION:**  
  **The Strongest Objection:** *"Serious sanctions like expulsion demand a higher degree of certainty than minor ones. Failing to raise the standard for severe punishments risks catastrophic injustice and violates proportionality. A single standard ignores this fundamental principle of justice."*  

  **Serious Response:**  
  This objection powerfully highlights the paramount importance of avoiding wrongful severe sanctions. However, the recommended policy *does* address this critical concern, just at a different stage:  

  1.  **"Clear and Convincing" is Already High:** This standard (significantly higher than "preponderance," lower than "beyond reasonable doubt") is appropriately rigorous for any finding that impugns a student's academic integrity and record. Applying it uniformly ensures no finding of guilt is made lightly.  
  2.  **Proportionality is Achieved Through Sanctioning, Not Proof Thresholds:** The Board’s duty to avoid disproportionate punishment is fulfilled *after* guilt is established. When deliberating on expulsion for a violation proven under the clear and convincing standard, the Board must demand:  
      *   **Unambiguous Severity:** The proven misconduct must inherently warrant such a severe outcome (e.g., premeditated, extensive deception, fundamental compromise of core academic work).  
      *   **Near Certainty for Severity *Within* the Standard:** While the *initial threshold* for guilt is fixed, the *weight*, *quality*, and *unambiguous nature* of the evidence meeting that "clear and convincing" threshold must be scrutinized with extreme rigor when expulsion is contemplated. The Board should only impose expulsion when the evidence *within* the "clear and convincing" band is overwhelming, unambiguous, and leaves no significant room for plausible alternative explanations *for that severe level of offense*.  
      *   **Burden on Sanction Justification:** If guilt is proven clearly and convincingly, but the evidence, while sufficient for guilt, has any significant ambiguity or mitigating context regarding the *scale* or *intent* necessary for expulsion, then expulsion is *not* justified. The burden lies on the proponents of expulsion to demonstrate the evidence supporting guilt *also* incontrovertibly supports the extreme nature of the violation warranting expulsion.  

  **5. IMPLEMENTATION:**  
  To reinforce proportionality and rigor for severe cases *within* the single standard framework:  
  *   Amend Board procedures to explicitly state that while the evidentiary standard for *finding a violation* is always "clear and convincing," the *certainty required to impose the sanction of expulsion* demands that the evidence of the violation be exceptionally strong, unambiguous, and conclusive *within* that standard.  
  *   Include specific guidance in training/deliberation: "Expulsion requires not only a finding of violation by clear and convincing evidence, but that the evidence supporting the *specific nature and severity* of the violation warranting expulsion is overwhelming and leaves no significant doubt."  

  **CONCLUSION:**  
  Retaining the single "clear and convincing" standard for establishing misconduct preserves the integrity and fairness of the fact-finding process, avoids the conceptual pitfalls of linking proof to punishment, and provides a clear, consistent framework for students. The profound concern for proportionality in severe sanctions is fully addressed by demanding overwhelming evidence *within* the fixed standard for guilt when considering expulsion and by rigorously applying proportionality principles during the distinct sanctioning phase. This approach best upholds both justice and academic integrity.  

  **Recommendation:** Adopt the policy retaining a single "clear and convincing evidence" standard for findings of academic misconduct.
