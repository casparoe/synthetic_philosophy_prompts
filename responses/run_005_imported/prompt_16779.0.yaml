  ### Brief Rationale
  - **S Tier**: Empirically grounded; uses probability theory to address observational selection effects.
  - **A Tier**: Physically plausible; leverages cosmic timescales/energy constraints without special pleading.
  - **B Tier**: Scientifically defensible but relies on contingent Earth-specific or future-contingent variables.
  - **C Tier**: Mechanistically possible but introduces unnecessary complexity without explanatory gain.
  - **D Tier**: Untestable by design; relies on implausible universal behavioral uniformity.
  - **F Tier**: Self-refuting under anthropics (e.g., if berserkers exist, we shouldn't) or logically inconsistent.

  This ordering prioritizes explanations that: (1) account for observer selection effects, (2) minimize unmotivated assumptions about alien behavior, and (3) align with thermodynamic/evolutionary constraints. The top tiers reflect the current lack of evidence for *any* extraterrestrial agency, while F-tier fails basic consistency tests (e.g., simulation/dark forest hypotheses create deeper paradoxes than they resolve).
