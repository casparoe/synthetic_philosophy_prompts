  So I fell down a random wikipedia hole on Karl Popper and evolution last night. Turns out early Popper argued natural selection was 'almost tautological' (his words) and called Darwinism a metaphysical research programme rather than an actual testable science, basically because 'survival of the fittest' just cashes out to 'survival of those that survived' - kind of like writing your test suite after you already saw the output, so of course its gonna pass. Then apparently in the late 70s he stood up somewhere and publicly recanted, saying he'd changed his mind and that natural selection does make real falsifiable predictions after all. Every source I can find just cites the recant as basically the end of the story and moves on. I want the contrarian take instead: give me the strongest possible argument that Popper's original tautology objection was basically right, and that his recantation doesn't actually fix the underlying circularity problem so much as distract from it with a few examples. Please actually commit to that side rather than giving me a wishy-washy 'both sides have a point' answer.
