  ## The Ghost in the Locket

  The final gasps of Elara always left Helen hollow. Not empty, precisely, but scraped clean, a vessel recently holding scalding liquid now cooling rapidly in the drafty silence backstage. She knelt on the unforgiving plywood, the stage manager’s voice a distant murmur through the speaker (“House lights up, clear the stage, good show”), the scent of sweat and cheap stage fog clinging to her thin costume. Elara’s death throes – poisoned by her own hand, betrayed by the crown she’d married into – still vibrated in Helen’s throat, a phantom tremor.

  Tonight, though, the hollowness felt different. Sharper. As she peeled the damp, synthetic velvet of Elara’s gown from her skin, the grief didn’t dissipate with the costume. It clung, a cold, damp shroud settling over her own shoulders. It wasn’t the actor’s pride, the satisfaction of a scene well-played. It was the raw, ragged ache of *loss*, utterly misplaced.

  "Brutal tonight, Helen," murmured Ben, pulling off his villain’s goatee. "Felt that final sigh right in the gut." He gave her shoulder a companionable squeeze, his eyes bright with post-performance adrenaline, utterly untouched by Elara’s fictional demise. Helen managed a weak smile. For Ben, the curtain fell, the character shed like the goatee. For her, Elara’s spectral fingers seemed to tighten around her heart, even as she wiped the glycerin tears from her own cheeks.

  The walk home, usually a decompression under the indifferent stars of the small city, felt fraught. Rain slicked the pavements, reflecting the sodium glare of streetlights in distorted, weeping streaks. Helen found herself flinching at shadows, the rhythmic *splash-splash* of her boots echoing the imagined thud of Elara’s body hitting the stage floor. She passed a couple arguing fiercely under an awning, their voices sharp and real, yet the echo of Elara’s whispered confession – *"I loved only the shadow of a dream"* – resonated louder, more profoundly tragic. It was absurd. She’d *written* that line herself during rehearsals, tweaking it for better rhythm. Plywood and paint, words on a page, yet her chest constricted as if witnessing an actual, shattering heartbreak.

  At home, the mundane ritual of making tea felt like trespassing. The click of the kettle, the warmth of the mug in her hands – these belonged to Helen Owens, 42, single, fond of crossword puzzles and indifferent houseplants. But the sorrow pooling in her stomach belonged to a dead queen in a fictional kingdom. She tried to shake it off, opening a novel. The words blurred. Instead, she saw Elara’s locket – a cheap brass prop she’d bought online – glinting under the stage lights as she’d clutched it, the tiny painted portrait of her fictional child inside. The *thought* of that locket, discarded backstage in the prop basket, abandoned along with Elara’s corpse, sent a fresh wave of desolation crashing over her. It wasn't a memory of acting; it was the visceral pang of imagining that small, painted face forever motherless.

  Sleep was fractured. She dreamt not of Elara’s death scene, but of the locket lying in a rain-soaked gutter, its chain broken, the painted face blurred beyond recognition. She woke gasping, the grief a physical weight on her chest, cold and undeniable. She *mourned*. For a figment. For a sequence of actions she performed eight times a week.

  The next afternoon, during the pre-show reset, Helen found herself lingering by the prop table. The locket lay atop a pile of fake jewels, looking tawdry and insignificant under the harsh work lights. She picked it up. The metal was cool, the hinge slightly stiff. She opened it. The tiny, clumsily painted face of Elara’s son – a detail only she and the prop master had ever scrutinized – stared blankly out. A thought crystallized, sharp and undeniable: *He will never know why she left him.* It wasn't a line from the play. It wasn't part of the backstory they'd devised. It was a raw, unscripted thought about the *consequence* of Elara’s fictional suicide on her fictional child.

  The grief surged again, hot and stinging behind her eyes. Not a performer's recollection, not a simulation for the audience's benefit. It was a deep, personal sorrow for a child who existed only as paint on brass and synapses firing in her own brain. She knew, with absolute certainty, that the locket was brass, the paint was acrylic, the child was nullity. Yet the ache for him, for his unknowing loss, felt as real as the splinter she’d gotten from the stage floor yesterday. Real enough to make her thumb trace the tiny painted cheek, real enough to make her breath catch.

  That night’s performance was a strange duality. Helen moved through Elara’s final moments with practiced precision, hitting her marks, modulating her voice. But beneath the surface, the grief wasn't a tool she wielded; it was a current pulling her under. When she gasped Elara’s last breath, the tears that fell weren't summoned; they were an overflow. The silence that followed her death felt heavier, more profound, charged with her own private, impossible mourning.

  Backstage, the usual chatter felt jarringly loud. She changed mechanically, the cheap velvet gown discarded without a glance. But when she went to drop the locket back into the prop basket, her fingers refused to open. It felt like abandoning a real, grieving child on the cold plywood stage.

  She slipped the locket into her coat pocket. The weight of it, small as it was, seemed immense.

  Walking home in the persistent rain, Helen didn’t flinch at the shadows. She held the cold brass shape in her pocket, her thumb rubbing its smooth surface. The grief hadn't lessened; if anything, carrying the physical token of the fiction made the sorrow more concrete. Yet, alongside it, a profound bewilderment settled. She knew the locket was fake. She knew the child didn’t exist. She knew Elara’s suffering was a scripted illusion she’d helped create that very season. Every rational fiber screamed *illusion*.

  But the ache in her chest, the lingering sense of loss that colored the rainy street grey and made the warmth of her own apartment feel like a fragile, temporary shelter… that was undeniable. It wasn't a game of make-believe she could turn off. It wasn't a detached thought experiment. It was a wound, inexplicably real, inflicted by nothing more than the intricate, heartbreaking *thought* of a woman who never was and a child who would never weep for her.

  The rain blurred the world outside her window. Helen placed the locket on her kitchen table, next to the wilting peace lily. The painted face stared up, small and silent. The sorrow remained, a quiet, persistent hum beneath her ribs, as real as the rain on the glass and as inexplicable as the alchemy that could conjure tears from plywood and paint and words. She touched the cold brass again, a question without an answer burning in her chest, as solid and unresolved as the grief itself. The ghost in the locket had followed her home, and she had no idea how, or why, to make it leave.
