  You've nailed the central tension in Tolstoy's argument. While powerfully stated, his dismissal of criticism rests on several problematic assumptions that *do* make it shakier than it first appears. Here's a breakdown of where his logic falters and why criticism persists:

  1.  **The "All-or-Nothing" Transmission Fallacy:** Tolstoy assumes art either transmits the feeling perfectly (rendering explanation superfluous) or fails utterly (rendering explanation useless). This ignores the vast middle ground:
      *   **Partial Transmission:** A viewer might grasp the core feeling but miss nuances, context, or complexity. Explanation can deepen, not just initiate, the experience.
      *   **Misinterpretation:** The feeling *is* transmitted, but the viewer misunderstands its source, target, or nature (e.g., mistaking satire for endorsement). Criticism can correct this.
      *   **Barriers to Access:** Historical distance, cultural context, unfamiliar techniques, or complex symbolism can create barriers. Criticism acts as a bridge, *enabling* the transmission Tolstoy values. (Think of understanding Renaissance religious art without knowing the Bible stories).

  2.  **The False Dichotomy of Expression (Words vs. Art):** His claim "If it could be said in words, the artist would have used words" is a major weak point:
      *   **Art Isn't *Just* Feeling:** Art often conveys complex ideas, critiques, historical perspectives, formal innovations, or sensory experiences alongside or intertwined with feeling. Words can unpack these dimensions *without* claiming to replace the artwork.
      *   **Nuance Beyond Feeling:** The specific *quality* of a feeling, its moral ambiguity, its relationship to form, its historical specificity – these often *require* verbal articulation to be fully appreciated. A painting might evoke "sadness," but is it melancholic, despairing, resigned, or tragic? Words help differentiate.
      *   **Jokes & Poems Prove the Point:** As you intuited, explaining *why* a joke is funny (timing, subversion, wordplay) doesn't negate the joke; it enhances appreciation of the craft. Similarly, analyzing a poem's meter, metaphor, or allusions reveals layers of meaning the initial emotional impact might not fully encompass. This explanation doesn't *replace* the poem; it *illuminates* it.

  3.  **Misunderstanding the Function of Criticism:** Tolstoy reduces criticism to "explaining the feeling." This is far too narrow. Criticism serves multiple functions:
      *   **Contextualization:** Placing the work within art history, the artist's biography, or its socio-political moment. (Understanding Goya's "The Third of May 1808" is vastly enriched by knowing the Napoleonic Wars).
      *   **Formal Analysis:** Examining *how* the work creates its effect – composition, color, brushwork, structure, rhythm, harmony, etc. This doesn't explain "the feeling" so much as explain the *craft* used to evoke it.
      *   **Interpretation:** Offering *readings* of the work's meaning, significance, and implications. This isn't about dictating "the" feeling, but exploring possible meanings generated by the interaction between the work and the viewer/critic. Different interpretations can coexist.
      *   **Evaluation:** Assessing the work's success, originality, skill, and significance (based on stated criteria). This goes beyond "did it transmit a feeling?" to "how well did it achieve its aims?" and "what is its value?"
      *   **Dialogue & Discourse:** Criticism sparks conversation, debate, and a deeper collective engagement with art and ideas. It's part of how culture processes and understands itself.

  4.  **Denying the Artist's Complexity & Audience Diversity:**
      *   **Artist's Intent vs. Result:** An artist might intend one feeling, but the work, through its complexity or execution, evokes something richer, more ambiguous, or even contradictory. Criticism explores this gap.
      *   **Diverse Audiences:** What transmits instantly to one viewer (due to shared background) may be opaque to another. Criticism provides entry points for diverse audiences.

  **Why Tolstoy's Argument *Feels* Persuasive (and Where It Has Merit):**

  *   **Against Pretentious Obfuscation:** He rightly skewers criticism that uses jargon to mask emptiness or impose meaning the work doesn't support. Bad criticism *is* noise.
  *   **Primacy of the Experience:** He emphasizes that the direct, visceral encounter with the artwork is irreplaceable. No amount of talk can substitute for *experiencing* the painting, symphony, or poem. Good criticism acknowledges this primacy.
  *   **Focus on Emotional Core:** For art primarily focused on transmitting a singular, powerful feeling (lyrical poetry, certain types of music, expressionist painting), excessive explanation *can* sometimes feel reductive.

  **Conclusion:**

  You're correct to find Tolstoy's argument shaky on closer inspection. His core premise – that art's sole function is the direct, wordless transmission of feeling – is reductive. It ignores the multifaceted nature of art, the complexity of meaning-making, the diversity of audiences, and the legitimate functions of criticism beyond mere "explanation of the feeling."

  While he powerfully defends the irreplaceable *experience* of art and warns against sterile intellectualization, his blanket dismissal of criticism "proves too much." Explaining jokes, poems, complex novels, or historical artworks doesn't kill them; it often reveals their depth and allows more people to access their power. Criticism, when done well, isn't noise *on top* of the art; it's a lens, a bridge, a conversation *about* the art that can deepen understanding and appreciation for those who seek it. Tolstoy identifies a danger in *bad* criticism but throws out the entire practice based on a narrow and arguably flawed definition of art's purpose. Your skepticism is well-founded.
