  ### Key Feedback Summary for Student:
  - **Strengths:** Mastery of bank cases, clear contrast between shifting semantics (a) vs. shifting epistemic relation (b).
  - **Critical Fix:** DeRose defends *contextualism*—not pragmatic encroachment (PE). PE is a rival view (see Hawthorne's *Knowledge and Lotteries* or Stanley's *Knowledge and Practical Interests*).
  - **Deepen (c):** These *are* rivals because they resolve "faultless disagreement" differently: If a low-stakes speaker says "Hannah knows" while Hannah (in high stakes) says "I don't know," contextualism says *both could be true*; PE says *only one can be correct* relative to Hannah's situation.
  - **Actionable Tip:** For PE, specify: "Whether Hannah *possesses knowledge* (not just whether she claims it) changes with her practical stakes under PE."
