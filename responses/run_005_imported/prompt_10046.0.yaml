  First, I need to recall the switch model. It argues that split-brain patients have only one stream of consciousness that rapidly switches between hemispheres, instead of two parallel streams. The user mentioned three critical points: instances where both hands perform incompatible actions simultaneously, which seems too fast for switching; the Pinto et al study showing more unified awareness; and the mechanism triggering the switch to avoid a homunculus problem.

