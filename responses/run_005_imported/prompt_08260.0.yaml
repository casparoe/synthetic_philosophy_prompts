  1. **Categorical representations are covariations, not meanings:** Even if detectors reliably fire for certain stimuli, that's just causal covariation. It doesn't explain why these states *mean* anything. Pigeons' neural activations correlate with stimuli, but we don't attribute meaning to those states.

  2. **Homunculus problem:** If categorical representations are supposed to ground symbols, what grounds them? If they need interpretation, that leads to an infinite regress. Harnad might say the detectors are innate or learned, but that doesn't resolve the semantics.

  3. **Phenomenal vs. functional:** The user mentions "raw feels" or qualia. Even if a system categorizes correctly, without subjective experience, it's just functional. Harnad's system lacks this aspect, so grounding remains incomplete.

