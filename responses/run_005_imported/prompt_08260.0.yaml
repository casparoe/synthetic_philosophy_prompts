  First, I need to recall Harnad's symbol grounding problem. Symbols in systems like classical AI are ungrounded; they lack intrinsic meaning. Harnad's solution involves a hybrid system: iconic representations (raw sensory data), categorical representations (invariant features via feature detectors), and symbolic representations. The idea is that categories are grounded through perception and learning.

