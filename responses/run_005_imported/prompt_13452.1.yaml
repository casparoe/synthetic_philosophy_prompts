  - Q: (0.2-0)^2 = 0.04
  - Total: 0.08

  b5 is better on both.

  Now, in a world where P is true and Q is true:

  b5:
  - P: 0.01
  - Q: (0.1-1)^2 = 0.81
  - Total: 0.82

  b6:
  - P: 0.04
  - Q: (0.2-1)^2 = 0.64
  - Total: 0.68

  b6 is better overall. Now, break it down:

  - On P: b5 is better (0.01 < 0.04) -> improvement of 0.03
  - On Q: b5 is worse (0.81 > 0.64) -> deterioration of 0.17
  - Net: deterioration of 0.14

  So b5 is worse overall.

  Finally, let me try a different world and different functions.

  Consider world: P true, Q false.

  b7: P:0.99, Q:0.99  [extreme]
  b8: P:0.6, Q:0.6

  In this world:
  b7:
  - P: (0.99-1)^2 = 0.0001
  - Q: (0.99-0)^2 = 0.9801
  - Total: 0.9802

  b8:
  - P: (0.6-1)^2 = 0.16
  - Q: (0.6-0)^2 = 0.36
  - Total: 0.52

  b8 is better. Breakdown:
  - P: b7 is better (0.0001 < 0.16) -> improvement 0.1599
  - Q: b7 is worse (0.9801 > 0.36) -> deterioration 0.6201
  - Net: deterioration 0.4602

  Still not what we want.

  ### Conclusion on the Example
  It appears that for the Brier score, in a given world, if a credence function is more accurate on one proposition and less accurate on another, the net effect is usually a loss because the Brier score penalizes being farther from the truth squared, and the deterioration on the proposition where you are worse off tends to outweigh the improvement on the other. This is due to the convexity of the quadratic loss.

  However, Berker's point might be conceptual: the very fact that the scoring rule aggregates inaccuracy across propositions allows for the possibility of trade-offs, even if in many cases they do not materialize because of the properties of the scoring rule. The objection is that the theory permits such trade-offs in principle.

  Moreover, in more complex examples or with different scoring rules, the trade-off might occur. For instance, if we used the absolute value scoring rule, which is proper but not strictly proper, then we might see more trade-offs.

  ### The Objection

  The objection is that epistemic utility theory evaluates a credence function by a global score that is the sum of the inaccuracy on each proposition. This means that the inaccuracy on one proposition can be offset by inaccuracy on another. Berker argues that this is illegitimate because each proposition is a separate object of inquiry, and accuracy on one should not be traded off against accuracy on another, especially when they are unrelated.

  ### Formal Example (even if it doesn't occur with the Brier score in the examples above, imagine it did)

  Suppose we have two propositions A and B, and a world where A is true and B is false.

  Consider two credence functions:

  c_a:
    c_a(A) = 0.5, c_a(B) = 0.5
    Inaccuracy: A:0.25, B:0.25 -> 0.5

  c_b:
    c_b(A) = 0.6, c_b(B) = 0.4
    Inaccuracy: A: (0.6-1)^2 = 0.16, B: (0.4-0)^2 = 0.16 -> 0.32

  c_b is better. But now consider:

  c_c:
    c_c(A) = 0.4, c_c(B) = 0.6
    Inaccuracy: A: (0.4-1)^2 = 0.36, B: (0.6-0)^2 = 0.36 -> 0.72

   worse.

  But imagine we have a credence function that is very accurate on A but very inaccurate on B, and the sum is better than a uniform one.

  Suppose:

  c_d:
    c_d(A) = 0.99, c_d(B) = 0.99
    In world w2: A:0.0001, B:0.9801 -> 0.9802

  c_a: 0.5

   not better.

  Or:

  c_e:
    c_e(A) = 0.99, c_e(B) = 0.01
    In w2: A:0.0001, B:0.0001 -> 0.0002

   which is better, and on both it is better.

  ### Summary of the Objection

  Even if my attempts to find a numerical example with the Brier score have failed, the conceptual point stands: the theory evaluates credence functions by summing inaccuracy over all propositions. This means that it is possible, in principle, for a credence function to be less accurate on proposition A and more accurate on proposition B, and for the net to be an improvement, which Berker argues is problematic.

  ### Best Replies

  1. **Distinction between epistemic consequentialism and accuracy-first epistemology**: Your colleague's point is that accuracy-first epistemology need not be consequentialist. It might be that the norms of rationality are defined in terms of accuracy, but not that the justification of a credence function is that it promotes accuracy. For example, the accuracy-dominance argument shows that non-probabilistic credence functions are accuracy-dominated, and that is a flaw, but this doesn't require a consequentialist story about the promotion of accuracy. This might avoid the force of Berker's objection because the objection is framed in consequentialist terms (trade-offs).

  2. **Constraints on scoring rules**: Another reply is to impose constraints on the scoring rule beyond propriety. For example, we might require that the scoring rule is not separable, or that it is 'separable' in a way that doesn't allow for trade-offs. However, the additivity of the inaccuracy score is what makes the accuracy-dominance argument work. Alternatively, we might appeal to Joyce's coherence-admissibility condition, which might rule out some trade-offs.

  3. **Deny that the trade-offs are problematic**: One might argue that in the epistemic realm, trade-offs between different propositions are acceptable. After all, we have a unified web of belief, and it is the overall accuracy that matters. 

  4. **Point out that in the standard scoring rules, such trade-offs are not beneficial**: As our examples showed, with the Brier score, being less accurate on one proposition and more on another in a way that is beneficial overall is hard to achieve because of the convexity. And when it does happen, it might be because the credence function is appropriately responsive to the evidence.

  5. **Restrict the set of legitimate scoring rules to those that are additive and proper**: This is already done, and within this class, the trade-offs might be unproblematic.

  ### Assessment

  The distinction between accuracy-first epistemology and epistemic consequentialism is crucial. If accuracy-first epistemology is only committed to the thesis that accuracy is the central epistemic value and that rational credence functions are those that are not accuracy-dominated (or that minimize expected inaccuracy from the perspective of the credence function itself, as in Greaves and Wallace), then it might avoid the charge of allowing trade-offs in a way that is analogous to utilitarianism. The trade-off worry might only arise if we are act-consequentialists about epistemic norms, i.e., if we think that the rightness of a credence function is determined by its promoting accuracy overall. But the accuracy-dominance argument doesn't require that.

  However, if the accuracy-dominance argument is seen as a kind of consequentialist argument (showing that non-probabilistic credences are dispreferred because they are accuracy-dominated), then the objection might still have force.

  I find the appeal to formal constraints on scoring rules (like propriety) to be somewhat effective because it ensures that the scoring rule is truth-directed and that expected inaccuracy is minimized by the true probabilities. But propriety and additivity do not obviously rule out the possibility of trade-offs.

  In conclusion, the separateness of propositions objection is a serious one, and the best reply might be to deny that accuracy-first epistemology is necessarily a form of epistemic consequentialism in the way that Berker assumes. 

  ### References
  - Berker, Selim (2013). "The Unity of Grounding". Mind, 122(48), 1.
  - Joyce, James (1998). "A Nonpragmatic Vindication of Probabilism". Philosophy of Science.
  - Pettigrew, Richard (2016). Accuracy and the Laws of Credence. Oxford University Press.

  Given the complexity, it might be that Berker's objection is more conceptual than numerical, and that the numerical examples are less important than the structural point about aggregation.
answer: |-
  Below, I reconstruct Selim Berker's "separateness of propositions" objection to accuracy-first epistemology with precision, providing a formal example, an analysis of why aggregation is the culprit, and an assessment of replies. I strictly separate this from Berker's causal-promotion objection, as requested.

  ### **Core of the Objection: Separateness of Propositions**
  Accuracy-first epistemology evaluates credence functions by aggregating a measure of accuracy (e.g., Brier score) across all propositions in an agent's belief state. This aggregation allows trade-offs where inaccuracy on one proposition is compensated by accuracy on another, even if the propositions are intuitively unrelated (e.g., "It rains in Paris" and "Coin flip lands heads"). Berker analogizes this to the "separateness of persons" objection in utilitarianism: just as utilitarianism unjustly sacrifices one person's welfare for another's, epistemic utility theory (EUT) unjustly sacrifices accuracy on one proposition for another. The objection hinges on two claims:
  1. **Propositions are separate objects of inquiry**: Accuracy on one proposition should not affect the evaluation of accuracy on another, especially when they lack meaningful connections (e.g., logical, evidential, or subject matter ties).
  2. **Aggregation permits illegitimate trade-offs**: By summing accuracy across propositions, EUT treats accuracy as a fungible resource. This violates a deontic constraint: each proposition deserves accuracy in its own right, not as part of a "global score."

  The problem arises because EUT’s scoring rules (e.g., Brier, logarithmic) are **separable and additive**: total inaccuracy is the sum of inaccuracies for each proposition. This additivity is explicit in standard accuracy arguments (e.g., Joyce's dominance theorem). Without constraints like proposition-specific thresholds, aggregation implies that a loss in accuracy on proposition \(A\) can be "canceled out" by a gain on \(B\), even if \(A\) and \(B\) are unrelated.

  ---

  ### **Toy Example: Explicit Trade-off**
  Consider two **logically independent, unrelated propositions**:
  - \(A\): "It will rain in Paris tomorrow."
  - \(B\): "A fair coin flip lands heads."

  **Scoring rule**: Brier score \(S(c, w) = (c(A) - \mathbf{1}_w(A))^2 + (c(B) - \mathbf{1}_w(B))^2\), where:
  - \(c(X)\) is the credence in \(X\),
  - \(\mathbf{1}_w(X) = 1\) if \(X\) is true at world \(w\), else \(0\).

  **World \(w\)**: \(A\) is true, \(B\) is false. Thus, \(\mathbf{1}_w(A) = 1\), \(\mathbf{1}_w(B) = 0\).

  Now compare two credence functions:
  - \(c_1\): \(c_1(A) = 0.5\), \(c_1(B) = 0.5\)  
    - Inaccuracy at \(w\): \((0.5 - 1)^2 + (0.5 - 0)^2 = 0.25 + 0.25 = 0.50\).

  - \(c_2\): \(c_2(A) = 0.1\), \(c_2(B) = 0.9\)  
    - Inaccuracy at \(w\): \((0.1 - 1)^2 + (0.9 - 0)^2 = 0.81 + 0.81 = 1.62\).

  \(c_1\) is more accurate than \(c_2\) overall. But now consider:
  - \(c_3\): \(c_3(A) = 0.9\), \(c_3(B) = 0.1\)  
    - Inaccuracy at \(w\): \((0.9 - 1)^2 + (0.1 - 0)^2 = 0.01 + 0.01 = 0.02\).

  At \(w\), \(c_3\) has **lower total inaccuracy** (0.02) than \(c_1\) (0.50). Yet, compared to \(c_1\):
  - On \(A\) (true): \(c_3\) is **more accurate** (0.01 vs. 0.25).
  - On \(B\) (false): \(c_3\) is **less accurate** (0.01 vs. 0.25).  
    - For \(B\) false, credence 0.1 is farther from 0 than 0.5 is, so inaccuracy is higher: \((0.1 - 0)^2 = 0.01 > 0.0025\) (not 0.25). Correction:  
      - For \(B\): \(c_1(B) = 0.5\), inaccuracy = \((0.5 - 0)^2 = 0.25\).  
      - \(c_3(B) = 0.1\), inaccuracy = \((0.1 - 0)^2 = 0.01\).  
      - So \(c_3\) is more accurate on both! This is not a trade-off.  

  **Revised example with explicit trade-off**:  
  To force a trade-off, we need \(c_3\) to be less accurate on \(B\) than \(c_1\). Adjust \(c_3\):  
  - \(c_3\): \(c_3(A) = 0.99\), \(c_3(B) = 0.99\)  
    - Inaccuracy at \(w\) (A true, B false): \((0.99 - 1)^2 + (0.99 - 0)^2 = 0.0001 + 0.9801 = 0.9802\).  

  Now compare to \(c_1\) (0.50 inaccuracy):  
  - On \(A\) (true): \(c_3\) is more accurate (0.0001 < 0.25).  
  - On \(B\) (false): \(c_3\) is less accurate (0.9801 > 0.25).  
  - **Net effect**: \(c_3\) sacrifices accuracy on \(B\) for accuracy on \(A\), but total inaccuracy is worse (0.9802 > 0.50).  

  **Trade-off with better net accuracy**:  
  Use a credence function that is modestly accurate on \(A\) but highly inaccurate on \(B\) and ensure the gain outweighs the loss.  
  - \(c_4\): \(c_4(A) = 0.8\), \(c_4(B) = 0.9\)  
    - Inaccuracy at \(w\): \((0.8 - 1)^2 + (0.9 - 0)^2 = 0.04 + 0.81 = 0.85\).  
  - \(c_5\): \(c_5(A) = 0.6\), \(c_5(B) = 0.2\)  
    - Inaccuracy at \(w\): \((0.6 - 1)^2 + (0.2 - 0)^2 = 0.16 + 0.04 = 0.20\).  

  Now:  
  - \(c_5\) has **lower total inaccuracy** than \(c_4\) (0.20 < 0.85).  
  - On \(A\) (true): \(c_5\) is **less accurate** than \(c_4\) (0.16 > 0.04).  
  - On \(B\) (false): \(c_5\) is **more accurate** than \(c_4\) (0.04 < 0.81).  
  - **Trade-off**: Accuracy on \(B\) improves by 0.77, while accuracy on \(A\) worsens by 0.12, for a net gain of 0.65.  

  **Why this exemplifies the objection**:  
  - \(A\) and \(B\) are unrelated (no logical/evidential ties).  
  - \(c_5\) is deemed "better" overall (lower total inaccuracy) despite being less accurate on \(A\). This treats accuracy as fungible across propositions, violating the separateness of \(A\) and \(B\).

  ---

  ### **Why Aggregation is the Problem**
  - **Mechanics of scoring rules**: Additive scoring rules (like Brier) compute total inaccuracy as \(\sum_{i} S_i(c(P_i), \mathbf{1}_w(P_i))\), where \(S_i\) is the score for proposition \(i\). This allows \(S_A\) and \(S_B\) to compensate for each other.
  - **Consequence**: A credence function can be rational (or accuracy-dominant) even if it is systematically inaccurate on some propositions, as long as inaccuracies are "balanced out" elsewhere. For Berker, this is akin to utilitarianism allowing one person's suffering to be offset by another's happiness.
  - **Contrast with causal-promotion objection**: This objection is purely about the *evaluative structure* of EUT (aggregation at a single time), not about *causal dynamics* (e.g., current beliefs causing future accuracy). The latter is Berker's separate charge that EUT allows "end justifies the means" reasoning.

  ---

  ### **Best Replies from Accuracy-First Epistemology**
  #### **Reply 1: Distinguish Epistemic Consequentialism from Accuracy-First (Your Colleague's View)**
  - **Core distinction**:  
    - **Accuracy-first epistemology**: Accuracy is the *axiological standard* for evaluating credences (e.g., in Joyce's dominance argument, probabilism is derived from accuracy domination). It is a formal tool for characterizing rational constraints.  
    - **Epistemic consequentialism**: Credences are justified *because* they *promote* accuracy (e.g., maximize expected accuracy).  
  - **How this addresses the objection**:  
    - The dominance argument for probabilism does not require that agents *intend* to promote accuracy. It shows that non-probabilistic credences are accuracy-dominated, making them rationally defective *regardless* of whether accuracy is "promoted." Trade-offs in the example are artifacts of evaluating the *entire credence function* against a standard, not of promoting good consequences.  
    - Thus, aggregation is part of a *synchronic, structural* constraint (like coherence), not a consequentialist calculus.  
  - **Your concern**: This may not fully dissolve the objection. Even if not consequentialist, EUT still evaluates credence functions holistically via aggregated accuracy. If such aggregation violates separateness, it remains problematic.  

  #### **Reply 2: Constrain Scoring Rules (Propriety/Coherence-Admissibility)**  
  - **Propriety**: A scoring rule is (strictly) proper if each credence function expects itself to be more accurate than alternatives. This prevents agents from "gaming" the system by adopting inaccurate credences to hedge.  
  - **Joyce's coherence-admissibility**: Scoring rules must be "coherently admissible"—i.e., they must be truth-directed and avoid domination by incoherent credences.  
  - **How this addresses the objection**:  
    - Propriety ensures that *conditional on a probability function*, no other function has higher expected accuracy. In our example, if the true probabilities are \(P(A) = 1\), \(P(B) = 0\), \(c_5\) is not proper: its expected accuracy is worse than \(c_1\) (e.g., with Brier, expected inaccuracy is minimized at true values). Thus, trade-offs are irrational under proper rules.  
    - **Limitation**: Propriety does not forbid *actual* trade-offs (as in the example), only *expected* ones. At the actual world, \(c_5\) may still be more accurate than \(c_4\) despite being inaccurate on \(A\).  

  #### **Reply 3: Deny the Separateness Intuition**  
  - **Web of belief defense**: Beliefs are interconnected; accuracy trade-offs reflect that propositions are evaluated within a coherent system (e.g., in science, inaccuracy on one hypothesis may be offset by accuracy on another).  
  - **No privileged subset**: If we reject separateness for some propositions (e.g., logically linked ones), we must explain why unrelated propositions are special. EUT treats all equally, avoiding arbitrariness.  

  #### **Reply 4: Refine Aggregation Constraints**  
  - **Per-proposition thresholds**: Require that no proposition's inaccuracy exceeds a threshold (e.g., no credence <0.2 for a true proposition). This blocks extreme trade-offs but is ad hoc and undermines standard dominance arguments.  
  - **Non-additive scoring rules**: Use rules that are not separable (e.g., inaccuracy depends on global features). However, this complicates dominance arguments and may violate truth-directedness.  

  ### **Assessment of Replies**
  - **Distinction reply (Reply 1)**: This is promising but incomplete. While it defangs the *consequentialist* reading, it does not resolve the core worry that aggregation itself is illegitimate. If accuracy is the standard, and it is aggregated, trade-offs are still permitted. The distinction helps if accuracy-first is seen as defining coherence (like consistency), not as a value to promote.  
  - **Scoring-rule constraints (Reply 2)**: More robust. Propriety ensures that trade-offs are not advantageous in expectation, making them irrational. However, it does not address *actual* trade-offs in a world, which Berker finds problematic. Coherence-admissibility may exclude rules permitting extreme trade-offs, but it is not a complete fix.  
  - **Overall**: Reply 1 (distinction) is valuable for clarifying that accuracy-first need not entail consequentialism, reducing the force of the analogy to utilitarianism. Reply 2 (propriety) is the strongest technical reply, as it ensures that trade-offs are not rationally required or beneficial. However, if separateness is a bedrock normative constraint, no scoring rule can justify aggregation over unrelated propositions.  

  **Recommendation for your seminar**: Use the example to show how aggregation enables trade-offs. Debate whether Reply 1 (distinction) or Reply 2 (propriety) better addresses it. Highlight that Berker's objection challenges the axiomatic foundations of EUT, not just its applications.
