  To illustrate, we will set up a simple example with two propositions and two credence functions. We will use a strictly proper scoring rule (so that the expected accuracy is maximized only by the true probabilities) to ensure that we are working within the standard framework. However, we will see that even with propriety, the aggregation can lead to what Berker deems problematic trade-offs.

  ### Setting up the Example
  Consider two propositions, A and B, which are entirely unrelated. For instance:
  - A: "It will rain in London tomorrow."
  - B: "The stock market will go up next week."

  We assume that these propositions are independent (both probabilistically and epistemically). We will consider two credence functions, c1 and c2, defined over the set {A, B}.

  Let the actual world be one of the four possible states:
  1. A and B are both true (w1)
  2. A is true and B is false (w2)
  3. A is false and B is true (w3)
  4. A is false and B is false (w4)

  We will use the Brier score (a strictly proper scoring rule) to measure inaccuracy. The Brier score for a credence function c at a world w is:
    Brier(c, w) = Σ_{X in domain} (c(X) - truth(X))^2
  where truth(X) is 1 if X is true at w and 0 otherwise.

  Now, consider two credence functions:

  c1: 
    c1(A) = 0.5, c1(B) = 0.5

  c2:
    c2(A) = 0.9, c2(B) = 0.1

