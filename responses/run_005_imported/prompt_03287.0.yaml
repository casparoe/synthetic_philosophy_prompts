prompt: |-
  Had a long back-and-forth with my friend last night about whether AI generated songs (like the suno/udio stuff) count as "real" music or if there's something missing even when you genuinely can't tell it apart from a person's work. I brought up that whole Schopenhauer thing about how music is different from every other art because it's not copying the Platonic ideas the way painting or poetry supposedly does — its actually a direct expression of the Will itself, coming straight out of the composer's genius in this almost unconscious, not-fully-rational way. My friend says that's just vague 19th century mysticism and doesn't actually prove anything either way. So who's right — if you actually take Schopenhauer's own theory seriously, does it give a real principled reason AI music can't be "the real thing," or does his own logic kind of leave the door open for it? Don't just give me a wishy-washy both-sides answer, I want to know what you actually think his view would be.
