  The five approaches:
  1. **Parametric polymorphism (tiling hierarchy)**: A hierarchy of proof systems, each trusting the next one but being weaker. This avoids self-reference by having each level trust a weaker system.
  2. **Probabilistic reflection via reflective oracles**: Uses probabilistic reasoning and oracles that can answer queries about the agent's own future beliefs, allowing for consistent probabilistic reflection.
  3. **Logical induction**: A method for assigning probabilities to logical statements in a way that learns over time and satisfies desirable properties (like calibration), but without absolute certainty.
  4. **Bounded, track-record-based trust**: Instead of proof-theoretic guarantees, trust is based on empirical success (track record) and bounded by computational resources.
  5. **Paraconsistent logic**: Adopts a logic that avoids explosion (from contradiction, everything follows) so that inconsistencies can be contained. This blocks the derivation of arbitrary statements from a contradiction.

