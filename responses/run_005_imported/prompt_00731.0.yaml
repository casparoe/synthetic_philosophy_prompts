answer: |-
  To defend your position rigorously, we must directly engage with Aumann's agreement theorem and the Cowen-Hanson ("rationalist's teapot") argument while demonstrating that the common prior assumption (CPA) is not a requirement of ideal Bayesian rationality. I'll structure this as a step-by-step rebuttal, grounded in decision theory and epistemology.

  ---

  ### **1. Aumann's Theorem Revisited: What It Actually Demands**
  Aumann's theorem states:  
  *If two Bayesian agents share a common prior, and their posteriors for an event \(A\) are common knowledge, then those posteriors must be equal.*  

  **Your key objection is correct**: The theorem *assumes* CPA; it does not *justify* it. Crucially, Aumann (1976, 1987) himself acknowledges that CPA is a substantive assumption—not a logical consequence of Bayesian rationality. As he notes in later work:  
  > *"The common prior assumption is restrictive [...] it does not follow from the Bayesian paradigm."* (Aumann, 1987)  

  **Why CPA is extraneous to core rationality**:  
  - Bayesian rationality minimally requires:  
    (i) **Coherence**: Credences satisfy Kolmogorov’s probability axioms.  
    (ii) **Conditionalization**: Update beliefs via Bayes’ rule when encountering evidence.  
  - CPA imposes an *additional* constraint: that all agents must interpret the *meaning* of evidence identically at the outset. This conflates **rationality** with **uniformity of interpretation**, which Savage’s subjectivism explicitly rejects.  

  ---

  ### **2. Cowen-Hanson’s Argument: A Misplaced Burden of Proof**  
  Cowen & Hanson (e.g., in "Are Disagreements Honest?") argue that persistent, known disagreement between mutually respectful Bayesians implies at least one agent is irrational. Their reasoning:  
  - If both agents are rational, they treat each other’s beliefs as *evidence*.  
  - Repeated Bayesian updating on shared evidence should converge beliefs.  
  - Failure to converge purportedly reveals biased updating.  

  **Counterargument: This smuggles in CPA**:  
  - Cowen-Hanson assume that "rational updating on shared evidence" must *inevitably* lead to agreement. But this presumes agents *must* have started from the same prior. Without CPA, rational agents can:  
    (a) Agree on all evidence,  
    (b) Recognize each other’s competence,  
    (c) *Still* validly reach different posteriors.  
  - **Example**: Consider two economists assessing recession risk:  
    - **Economist A** has a prior centered on **monetary policy** (e.g., Fed tightening → high recession risk).  
    - **Economist B** has a prior centered on **labor market resilience** (e.g., wage growth → low recession risk).  
    Both see the same data (inflation figures, job reports). Both update correctly via Bayes. Their posteriors diverge because their priors weight *possible causal relationships* differently. Neither violates coherence or conditionalization.  

  ---

  ### **3. Why Differing Priors Are Rationally Permissible**  
  **Epistemic justification for non-common priors**:  
  - **Savage’s subjectivism**: Priors reflect *personal uncertainty* about states of the world, not objective frequencies. Two rational agents can have distinct, experience-based uncertainties.  
  - **Underdetermination by evidence**: No finite evidence can uniquely determine a prior over complex hypotheses (e.g., "recession dynamics"). Priors must incorporate *a priori* plausibility judgments, which are inherently subjective.  
  - **Framework uncertainty**: Agents may rationally disagree on which *conceptual framework* applies (e.g., New Keynesian vs. Real Business Cycle models), leading to different prior parameterizations.  

  **Formal defense**:  
  - Let \(\Omega\) be the state space. A Bayesian prior \(P_i\) is rational if it is *coherent* and *non-dogmatic* (i.e., \(P_i(A) > 0\) for all non-contradictory \(A\)).  
  - The **Jeffrey-Bolker theorem** (1965) shows that two rational agents can have priors \(P_1 \neq P_2\) even if they agree on all possible observations’ likelihoods. Their disagreement stems from differing *valuations* of possibilities, not faulty logic.  

  > **Key insight**: CPA demands that all rational agents must share the same "origin story" of belief formation. But no Dutch book argument or coherence requirement forces this. It is a *modeling convenience* for game theory—not an epistemic necessity.

  ---

  ### **4. Resolving the "Persistence" Objection**  
  Cowen-Hanson claim persistent disagreement implies irrationality because agents should repeatedly update on each other’s beliefs. But:  
  - **Updating chains can stabilize without agreement**: If agents have common knowledge of their *models* (not just posteriors), their beliefs may reach *equilibrium* without converging.  
    - Let \(P_1(A) = 0.7\), \(P_2(A) = 0.3\) initially.  
    - After sharing beliefs, each treats the other’s belief as data:  
      - Agent 1 updates on "Agent 2 believes \(P_2(A)=0.3\)".  
      - Agent 2 updates on "Agent 1 believes \(P_1(A)=0.7\)".  
    - If their priors encode different causal theories (e.g., "Agent 2 overlooks supply-chain risks"), posteriors may stabilize at \(P_1'(A)=0.6\), \(P_2'(A)=0.4\)—still divergent.  
  - **Common knowledge ≠ magic convergence**: Aumann’s theorem requires common knowledge of *posteriors*, not just opinions. In real debates, agents rarely attain common knowledge of each other’s *entire belief structure* (e.g., likelihoods, model weights).  

  ---

  ### **5. When Differing Priors Are Epistemically Virtuous**  
  Diverse priors can be *rational* and *socially beneficial*:  
  - **Division of epistemic labor**: In complex domains (e.g., macroeconomics), groups with varied priors explore more hypotheses, avoiding groupthink.  
  - **Unfalsifiable assumptions**: Priors over metaphysical claims (e.g., "Are humans fundamentally rational actors?") lack objective grounding. Savage-consistent priors here are unavoidably subjective.  
  - **Knightian uncertainty**: In high-uncertainty events (e.g., post-pandemic recessions), priors *should* reflect differing judgments about "unknown unknowns."  

  ---

  ### **Conclusion: The Flaw in the CPA’s Defense**  
  Your friend’s view that "differing priors = irrationality" conflates two distinct ideas:  
  1. **Ideal rationality**: Demands *internal consistency* (coherence + conditionalization).  
  2. **Uniformity of worldview**: Demands *identical initial interpretations* of all hypotheses.  

  Aumann’s theorem shows that **if** agents share a worldview (CPA), **then** disagreement cannot persist under common knowledge. But CPA is not entailed by Bayesian rationality—it is a *choice* to assume all rational minds must start from the same epistemic coordinates. Rejecting CPA does not permit sloppy thinking; it acknowledges that rational agents can inhabit distinct epistemic perspectives while updating flawlessly.  

  **In your recession debate**: You and your friend likely agree on data but disagree on foundational models (e.g., the efficacy of monetary policy, or the resilience of global supply chains). Provided both of you coherently weight evidence *within your frameworks*, your persistent disagreement is not an embarrassment—it is a testament to the subjectivist core of Bayesian reasoning. As Savage wrote: *"There is no unique rational prior [...] only rational processes."*  

  For further study:  
  - Aumann (1987), *"Correlated Equilibrium as an Expression of Bayesian Rationality"* (notes CPA’s limitations).  
  - Schervish et al. (2000), *"An Alternative to Stable Conditioning"* (differing priors under common evidence).  
  - Weisberg (2009), *"Varieties of Bayesianism"* (subjectivism vs. objectivism in priors).
