answer: |-
  Your proposed distinction between Sidgwick's philosophical system and his psychical research is **partly defensible but ultimately an oversimplification that most historians of philosophy would challenge.** While his psychical research was indeed a distinct *activity* with its own methods and community, its **motivation was deeply intertwined with his core philosophical concerns, particularly the unresolved tension in the dualism of practical reason.**

  Here's a breakdown of the key points:

  1.  **Sidgwick's Resolution in *Methods*: Incomplete and Agnostic:**
      *   You are correct that Sidgwick *identifies* the dualism: the fundamental conflict between the rationality of pursuing one's own happiness (Egoism) and the rationality of pursuing the general happiness (Utilitarianism/Benevolence). He rigorously demonstrates that both principles appear equally fundamental and rational within his analytical framework.
      *   **Crucially, Sidgwick does *not* definitively resolve this conflict within the text of *Methods of Ethics*.** He *hopes* for a reconciliation but finds no purely philosophical or empirical ground for it. The famous conclusion is one of profound agnosticism and personal struggle:
          > "The prolonged effort of the human intellect to frame a perfect ideal of rational conduct is seen to have been foredoomed to inevitable failure... I do not hold that the reconciliation is proved to be impossible; but I do hold that no one has yet proved it possible... Thus, in the supposed fundamental opposition between the 'moral' and the 'natural' end of action, I have been finally led to hold that, for the true method of Ethics, this opposition must somehow be transcended or overcome."
      *   His personal solution, hinted at but not argued for *within* the philosophical system of *Methods*, was **theological:** a belief in a God who would ensure that acting for the general good ultimately coincides with one's own true happiness (e.g., through divine sanctions in an afterlife). However, Sidgwick lacked *rational proof* for such a God or afterlife.

  2.  **Psychical Research as a Quest for Evidence:**
      *   Sidgwick's profound dissatisfaction with the unresolved dualism and his personal need for a basis to live ethically drove him to seek *empirical evidence* for propositions that could resolve it.
      *   **The primary target was evidence for survival of bodily death.** If survival could be empirically proven, it would provide a *potential* foundation for believing in a moral order where divine justice/rewards could reconcile egoism and utilitarianism in an afterlife. Telepathy and other phenomena were investigated partly as potential mechanisms for spirit communication and partly to rule out normal explanations for purported spirit phenomena.
      *   Sidgwick himself was explicit about this motivation. He saw psychical research as a rigorous, scientific investigation into questions of profound philosophical and personal significance. It wasn't just a "hobby"; it was a desperate search for empirical grounding for his deepest ethical hope. He famously lamented the lack of conclusive proof despite decades of investigation.

  3.  **Historian Consensus:**
      *   Historians of philosophy (e.g., Bart Schultz, C.D. Broad, J.B. Schneewind, Alan Gauld) overwhelmingly see Sidgwick's psychical research as **directly motivated by and an extension of his core ethical concerns.**
      *   **Schultz's definitive biography, *Henry Sidgwick: Eye of the Universe*, meticulously documents how the "crisis" of the dualism propelled Sidgwick into psychical research.** It was a deeply personal quest, yes, but one born directly from the perceived failure of pure philosophy to resolve the most fundamental problem of practical reason. Sidgwick saw it as a *complementary* investigation, applying empirical methods to a question philosophy couldn't settle on its own.
      *   Contemporaries like William James and F.C.S. Schiller understood Sidgwick's psychical work in this light. James noted that Sidgwick and the SPR were driven by the "serious" question of whether the moral order was "eternal" and "cosmic" or merely "temporary" and "terrestrial."

  **How to Frame it in Your Article:**

  *   **Do Acknowledge the Distinct Activity:** You can accurately state that psychical research was a separate *enterprise* from writing formal philosophical treatises like *Methods*. It involved different methods (empirical investigation vs. conceptual analysis) and a different community (SPR vs. academic philosophers).
  *   **Don't Sever the Motivational Link:** Presenting it as *merely* a "personal enthusiasm" distinct from his philosophical system **misrepresents Sidgwick's own understanding and motivations.**
  *   **Accurately Represent the Dualism:** Clarify that Sidgwick *identified* and *analyzed* the dualism in *Methods* but found no *philosophical resolution* within its pages. His search for resolution *led him* to psychical research.
  *   **Integrate the Motivation:** Frame Sidgwick's psychical research as:
      *   "Driven by his profound dissatisfaction with the unresolved 'dualism of practical reason' identified in *The Methods of Ethics*..."
      *   "A quest for empirical evidence, particularly for survival after death, which he hoped could provide a foundation for reconciling the demands of rational egoism and universal benevolence."
      *   "A deeply personal, yet philosophically motivated, scientific investigation stemming directly from the central problem of his ethical system."
      *   "An extension of his ethical concerns into the empirical realm, seeking evidence for a cosmic moral order that pure philosophy could not establish."

  **Conclusion:**

  While Sidgwick's psychical research was a distinct *activity*, its *purpose* was inextricably linked to the core philosophical problem of the dualism of practical reason that he rigorously analyzed but could not definitively resolve within *The Methods of Ethics*. Historians see it not as a separate "enthusiasm," but as Sidgwick's earnest, scientific attempt to find empirical support for a resolution that philosophy alone could not provide. Presenting this connection is essential for an accurate understanding of Sidgwick's intellectual journey and the significance he attached to the SPR's work.
