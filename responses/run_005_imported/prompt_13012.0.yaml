prompt: |-
  In De Corpore, Hobbes argues that a proper definition in geometry must be genetic: it has to specify the motion by which the figure in question is generated, since for him we can have scientia — certain, demonstrative knowledge — only of constructions that we ourselves perform and can trace step by step from cause to effect. This same conviction underlay his decades-long refusal to accept John Wallis's refutations of his repeated claims to have squared the circle; Hobbes dismissed Wallis's symbolic algebra as a manipulation of symbols that obscured genuine geometrical insight rather than revealing it.

  Suppose Hobbes were confronted with a result such as the four-colour theorem, whose only available proofs rest on exhaustive case-checking carried out by a computer and never surveyed in full by any human being. Would he count such a proof as scientia in his own sense of the term, or would he take it as an even more egregious instance of the symbol-shuffling he accused Wallis of practicing? Answer with reference to Hobbes's actual epistemological commitments in De Corpore and the Wallis controversy, not to the popular anecdote about circle-squaring alone.
reasoning: |-
  Okay, I need to tackle this question about Hobbes and the four-colour theorem. Let me start by recalling Hobbes's views from De Corpore. He believed that true knowledge, or scientia, comes from understanding the causes and generation of things. For geometry, that meant definitions had to be genetic—showing how a figure is constructed through motion. 

  Hobbes's beef with Wallis was about algebra. He thought Wallis's symbolic methods were just meaningless symbol shuffling. The key point here is that for Hobbes, genuine knowledge requires step-by-step tracing of causes that a human can comprehend. 

  Now, the four-colour theorem. Its proof relies on computer-checked cases—no human has gone through all the steps. That seems to clash with Hobbes's requirement for direct, constructive understanding. He'd probably see the computer proof as even worse than Wallis's algebra because it's completely opaque. 

  I should also consider if there's any room in Hobbes's framework for such proofs. But his strict emphasis on human-generated constructions makes it unlikely. The computer's role would violate his core epistemic principles about cause and effect being traceable by the knower.
answer: |-
  Based on Hobbes's epistemological commitments in *De Corpore* and his rejection of Wallis's methods, he **would categorically reject the computer-assisted proof of the four-colour theorem as genuine *scientia***. Here's why, referencing his core principles:

  1.  **The Requirement for Genetic Definition and Constructive Generation:** For Hobbes, *scientia* (certain, demonstrative knowledge) requires understanding the *cause* of a thing, which for geometrical figures means knowing the precise motion by which they are generated (*De Corpore*, I.6, VI.13). Knowledge is tied to the mind's ability to trace the causal chain from first principles (definitions understood as generation) to the conclusion. A proof must be a step-by-step construction, replicable in the mind or by physical motion.

  2.  **Human Agency and Comprehension:** *Scientia* arises *only* from constructions that "we ourselves perform" (*De Corpore*, I.6). The knower must be the agent of the construction or be able to mentally reconstruct every step, tracing the causal sequence. Certainty comes from this act of generation and comprehension.

  3.  **Rejection of Wallis's Symbolic Algebra:** Hobbes dismissed Wallis's algebra as "symbol-shuffling" because it manipulated abstract symbols according to rules without grounding them in the clear, imaginable motions that generate geometrical figures. He saw it as obscuring true causal understanding and substituting mechanical manipulation for genuine geometrical insight. Wallis's proofs, for Hobbes, lacked the necessary connection to constructive generation.

  4.  **The Four-Colour Theorem Proof:** The computer-assisted proof is the antithesis of Hobbesian *scientia*:
      *   **Lack of Genetic Construction:** It does not provide a single, comprehensible genetic path to the solution. Instead, it relies on an exhaustive case breakdown.
      *   **Opaque Generation:** The "construction" (the computer's case-checking) is not performed by the human knower. The sheer volume and complexity mean no human can mentally reconstruct or survey the entire causal chain from premises to conclusion.
      *   **Symbol-Shuffling Par Excellence:** The proof depends entirely on the manipulation of discrete states and symbols by a machine according to programmed rules. To Hobbes, this would appear as the ultimate form of meaningless symbol-shuffling, far more egregious than Wallis's algebra. The computer is an opaque "black box" performing manipulations the human mind cannot follow or genuinely reconstruct step-by-step. The *cause* of the result (the computer's exhaustive calculation) is fundamentally inaccessible to human comprehension in the required causal-generative sense.
      *   **Lack of Human-Performed Construction:** The core act of verification is outsourced to a machine. The human mathematician accepts the result based on trust in the computer's programming and execution, not on their own ability to generate the proof step-by-step from first causes.

  **Conclusion:** Hobbes would see the computer proof of the four-colour theorem as a profound failure to achieve *scientia*. It lacks the essential elements: a genetic definition leading to a comprehensible construction, human-performed generation tracing cause to effect, and clear, imaginable causal chains. Instead, it relies entirely on complex, opaque symbol manipulation performed by an external mechanism, making it, in his eyes, a vastly worse version of the "symbol-shuffling" he condemned in Wallis – a manipulation utterly devoid of genuine geometrical insight or causal understanding. The result might be pragmatically accepted, but it would not constitute *scientia* for Hobbes.
