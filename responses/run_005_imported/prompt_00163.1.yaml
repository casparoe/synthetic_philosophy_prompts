  I should clarify the conditions under which order-independence holds. Maybe mention that for rationalizability, the set is order-independent only under strict dominance. For weak dominance, the process can lead to different results. Suggesting that they present both cases and provide examples would be helpful. Recommending key papers like Gilboa et al. (1990) and Brandenburger's work could aid their preparation.

