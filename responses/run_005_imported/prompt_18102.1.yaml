prompt: |-
  So I've been re-reading Eliezer's old Quantum Physics sequence on LW again (peak 2008 blogging, truly) and it dragged me into an argument with a friend on a rationalist-adjacent discord about whether many-worlds actually gets around Bell's theorem or whether thats just cope people tell themselves so they don't have to accept nonlocality. My friend is basically a closet Bohmian — thinks the pilot wave is obviously what's "really" going on — and keeps citing Maudlin's line that Bell's theorem proves nature is nonlocal full stop, no matter which interpretation you pick, because any theory that reproduces the CHSH correlations (up to Tsirelson's bound of 2√2 ≈ 2.828, not just the classical bound of 2) needs some influence connecting the two wings of the experiment. I'm more sympathetic to the Everettian move: there's no single outcome for anything to nonlocally influence, so what Bell's proof actually rules out is local theories with a single definite result at each end, and MWI just denies that assumption instead of denying locality (basically the old Deutsch-Hayden point that Everettian QM stays fully local/seperable even though it violates the inequality). The more we argued though, the more my prior crept up that we might agree about literally every equation and every experimental fact and just be fighting over which unknowable, interpretation-relative thing gets to keep the word "local" — which feels like a dumb thing to have raised our voices about.

  Could you write me a dialogue between the two of them actually working through this, calling the Bohmian "B" and the Everettian "E"? I don't want a rehash of "collapse bad, pilot wave good" — I want them steelmanning each other and genuinely in the weeds: what exactly Bell's theorem rules out, how Jarrett's split of the locality condition into parameter independence and outcome independence bears on which one each interpretation is really giving up, and whether Bohmian nonlocality even deserves the name given that the quantum equilibrium hypothesis guarantees you can never exploit it to signal anything. Have B press E on whether "there's no single outcome" really avoids nonlocality or just relocates it into the branching structure (something has to guarantee the branch where Alice sees spin-up lines up with the right branch of Bob — isn't that correlating itself a nonlocal fact?). And have E press back on whether an influence that's provably unusable for signalling earns the label "real" nonlocality, or whether that's Bohmians smuggling in more metaphysics than Bell's theorem actually licenses. I'd like it to end with them landing on a genuinely sharp version of the question: do they actually disagree about physics, or just about bookkeeping, once you notice the two theories agree on every prediction and only come apart in ontology?
reasoning: |-
  We are going to create a dialogue between two characters: B (Bohmian) and E (Everettian). The dialogue should cover:
   1. Bell's theorem and what it rules out.
   2. The split of Bell's locality condition into parameter independence and outcome independence (Jarrett's analysis).
   3. Whether MWI avoids nonlocality by denying a single outcome, and whether Bohmian nonlocality is "real" given the no-signaling theorem.
   4. The ontological vs. bookkeeping disagreement.

   We'll structure the dialogue with B and E steelmanning each other and pushing on the key points.

   Key points for B (Bohmian):
     - Bell's theorem proves nonlocality: any theory that reproduces QM correlations must be nonlocal.
     - In Bohmian mechanics, nonlocality is explicit via the guiding equation (the wavefunction depends on all particles).
     - However, due to quantum equilibrium, it cannot be used for signaling (so it's "hidden" nonlocality).

   Key points for E (Everettian):
     - Bell's theorem assumes that there is a single outcome at each wing. MWI denies that: there are multiple outcomes (branches).
     - In MWI, the wavefunction evolves locally via the Schrödinger equation. The apparent nonlocal correlations are explained by the initial entangled state and local unitary evolution.
     - The branching is a global process, but it is not nonlocal in the sense of instantaneous influence.

   The dialogue will cover:
     - B pressing E on whether the alignment of branches (so that when Alice measures spin-up, Bob's branch is correlated) requires nonlocality.
     - E pressing B on whether an influence that is undetectable (due to quantum equilibrium) should be called nonlocality.

   We'll aim for a high-level, in-the-weeds discussion that ends with a sharp question about whether the disagreement is physical or ontological.

   Let's write the dialogue.
answer: |-
  ### Dialogue: Bell's Theorem, Locality, and the Interpretation Wars

  **B (Bohmian):** Look, I know you think many-worlds (MWI) sidesteps nonlocality, but Bell’s theorem is airtight. Any theory matching quantum correlations—like the CHSH violation up to Tsirelson’s bound—*must* be nonlocal. Maudlin’s right: this isn’t about interpretation. Bell proved that if you have definite outcomes at A and B (Alice and Bob’s locations), and those outcomes agree with quantum mechanics, then the result at A *must* depend instantaneously on both the setting at B *and* the outcome at B. Period.  

  **E (Everettian):** I agree Bell’s theorem kills local *hidden variable* theories. But you’re smuggling in a key assumption: that there’s a *single* outcome at each wing. MWI denies that. In Everett, there’s no “definite outcome” until you’re in a branch. The wavefunction evolves unitarily and *locally* via the Schrödinger equation. Entanglement is baked into the initial state—no faster-than-light influences needed.  

  **B:** Okay, let’s unpack Jarrett’s decomposition of Bell’s locality condition. Bell’s “local causality” combines two sub-conditions:  
  1. **Parameter Independence (PI):** The probability of Alice’s outcome doesn’t depend on Bob’s *setting*.  
  2. **Outcome Independence (OI):** The probability of Alice’s outcome doesn’t depend on Bob’s *outcome*.  

  Bell violations force you to sacrifice at least one. Bohm sacrifices PI: Alice’s outcome *does* depend on Bob’s setting because the guiding wave is nonlocal. But you claim MWI sacrifices neither?  

  **E:** Exactly. In MWI, there’s no *probability* of a single outcome—there’s a branching amplitude structure. PI holds because the unitary evolution is local: Alice’s operation depends only on her local Hamiltonian and setting. OI holds because Bob’s outcome isn’t a singular event—it’s correlated via the global wavefunction’s initial entanglement. No *dynamical* nonlocality.  

  **B:** That sounds like sophistry. When Alice measures spin-up, she ends up in a branch where Bob’s result is perfectly correlated. What ensures that alignment? If the branching is local, why doesn’t Alice’s branch sometimes decohere into "Bob saw up" while Bob’s branch decoheres into "Alice saw down"? That never happens. Doesn’t that imply a *global fact* tying branches together—a nonlocal constraint?  

  **E:** No—it’s baked into the initial entangled state. Take the singlet state: \(|\psi\rangle = \frac{|{\uparrow\downarrow}\rangle - |{\downarrow\uparrow}\rangle}{\sqrt{2}}\). When Alice measures, her local interaction decomposes the state into \(|\text{Alice-up}\rangle|\text{Bob-down}\rangle\) and \(|\text{Alice-down}\rangle|\text{Bob-up}\rangle\). The correlation is fixed *before* measurement. Branching isn’t a physical propagation; it’s a *description* of decoherence.  

  **B:** But decoherence is dynamical! For Alice and Bob’s branches to match, the environment must "know" the global state. That smells nonlocal.  

  **E:** Only if you reify branches as fundamental. In MWI, branches aren’t "made" at measurement—they’re patterns in the wavefunction. The wavefunction itself evolves via a *local* differential equation (Schrödinger). Compare that to Bohm, where particle positions are piloted by a wavefunction that depends *instantaneously* on all particles—a clear nonlocal mechanism.  

  **B:** Fair, but Bohm’s nonlocality is physically inert! Quantum equilibrium ensures the effective distribution matches \(|\psi|^2\), so you can’t *signal* faster than light. It’s like a cosmic censorship: nonlocality is real but hidden. Bell’s theorem requires nonlocality, but it doesn’t require *signaling* nonlocality.  

  **E:** And that’s my point! If your “nonlocality” is observationally indistinguishable from locality—because signaling is impossible—why call it nonlocality at all? Bell’s theorem proves you can’t have *local realism*, but it doesn’t force you to choose realism over locality. MWI keeps locality (no FTL influences) and drops the “single outcome” realism. Bohm keeps realism and drops locality.  

  **B:** But you’re *also* dropping something: the uniqueness of outcomes. Isn’t that a huge ontological cost?  

  **E:** Only if you insist outcomes are unique. Bohm adds hidden variables and nonlocality to preserve that illusion. But both theories predict *exactly the same experimental results*. So the disagreement isn’t about physics—it’s about ontology.  

  **B:** ...Agreed. But ontology matters! Bell’s theorem shows nature isn’t locally causal. Bohm takes that seriously: nonlocality is in the dynamics. MWI calls it “local” by redefining “outcome” to mean “branch.” But the correlation is still there, unexplained by local mechanisms.  

  **E:** Unitary evolution *is* the local mechanism! The real disagreement is whether “locality” requires no FTL *influences* (MWI) or no FTL *correlations* (Bohm). Bell’s theorem forces the latter only if you demand definite outcomes.  

  **B:** Then here’s the sharp question: **Do we disagree about any physical prediction, or only about which structures in our models earn the labels “real,” “local,” and “outcome”?**  

  **E:** Exactly. And until we can test the ontology—which we can’t, since both respect the Born rule and no-signaling—this is metaphysics.  

  **B:** So we’ve been yelling about semantics. Classic rationalist trap.  

  **E:** *laughs* Next time, let’s argue about whether the wavefunction is real.  

  **B:** Don’t tempt me.  

  ---

  ### Key Takeaways:  
  1. **Bell’s Theorem**: Rules out *local hidden variable theories* that produce definite outcomes.  
  2. **MWI**: Avoids nonlocality by rejecting definite outcomes (sacrifices "outcome uniqueness" but keeps unitary locality).  
  3. **Bohmian Mechanics**: Keeps definite outcomes but accepts nonlocal dynamics (hidden by quantum equilibrium).  
  4. **The Disagreement**: Ontological, not empirical. MWI says "nonlocal correlations" emerge from local unitarity + entanglement; Bohm says nonlocality is fundamental but hidden.  
  5. **Sharp Question**: Does "locality" require the absence of FTL *influences* (MWI) or the absence of FTL *correlations* (Bohm)? Bell’s theorem only mandates the latter if outcomes are unique.  

  Both positions are consistent—but which is "true" depends on your metaphysics.
