answer: |-
  This situation highlights the frustrating gray area between "technically true" and "genuinely honest." Both your friends have valid points, but your roommate's behavior lands closer to deception than honest communication. Here's the breakdown:

  **1. The Literal Truth vs. The Intended Deception:**
  *   **Friend 1 (Not Literally False = Not a Lie):** This view focuses solely on the dictionary definition of the words. "Some" means *an unspecified amount or number of something*. $9 is indeed "some" money. By this strict definition, your roommate didn't lie.
  *   **Friend 2 (Deliberate False Impression = Lying):** This view focuses on the *intent* and *effect* of communication. The core purpose of language is to convey meaning and understanding. If someone carefully chooses words they *know* will create a false belief in the listener's mind, they are engaging in deception, regardless of the technical dictionary truth of the individual words. This is often called **paltering** (using truthful statements to create a false impression) or a **lie of omission** (withholding crucial context).

  **In your roommate's case, her behavior aligns strongly with Friend 2's view:**
  *   **Calculated Word Choice:** Her phrasing ("I've paid for *some*") was deliberately chosen *because* it's vague and implies a contribution significantly larger than $9, while being technically defensible.
  *   **Exploiting Assumption:** She *knew* you were annoyed about her lack of contribution. She *knew* you would reasonably interpret "some" in that context to mean a non-trivial amount (e.g., 20%, 30%, maybe even 50%), not 5.6%.
  *   **Avoiding Responsibility:** Her later defense ("I never said half or most") confirms she was thinking about the technical loophole *at the time she spoke*. She constructed her statement specifically to mislead without being factually incorrect.
  *   **Defensiveness over Accountability:** Instead of acknowledging the misleading impression ("Wow, sorry, I see how 'some' sounded like more than $9, that wasn't my intent, let me pay up"), she doubled down on the technicality to avoid responsibility for the imbalance.

  **2. Responsibility for the Gap:**
  *   **Primarily on Her:** The responsibility for creating the misleading impression lies heavily with your roommate. As the speaker, it's her duty to communicate clearly and in good faith, especially when addressing a point of friction. Choosing vague language *knowing* it will create a false impression is manipulative. Reasonable interpretation ("some" meaning a meaningful contribution) is part of communication – exploiting that reasonableness is deceptive.
  *   **Minimal on You:** Your assumption that "some" meant a non-trivial contribution in the context of shared expenses was entirely reasonable. It's unrealistic and unfair to expect you to instantly question the meaning of a common word like "some" when discussing a shared financial obligation. Checking Splitwise later was the responsible thing to do.

  **Is "Technically True but Misleading" the same as lying?**

  *   **Functionally, often yes.** The *effect* on the listener (you feeling misled, her avoiding paying her share) is identical to a direct lie. The damage to trust is similar.
  *   **Ethically, usually yes.** Both involve an *intent to deceive*. The difference is merely the method: one uses false statements, the other uses true statements stripped of necessary context or designed to exploit assumptions.
  *   **Legally/Semantically, sometimes no.** Strict definitions of "lie" often require factual falsity. However, in ethics, communication studies, and everyday relationships, intent and effect matter far more than pure semantics.

  **Conclusion:**

  Your roommate engaged in deceptive communication (paltering). While her statement was *literally* true, it was **deliberately engineered** to create a **false impression** that she had contributed a reasonable amount, allowing her to temporarily avoid paying her fair share and deflect your initial concern. Her later defense confirms this intent.

  **What to do now:**

  1.  **Address the Behavior, Not Just the Money:** When settling up, calmly state: "Look, the $X you owe is clear from Splitwise. What bothers me more is how you handled it. Saying you paid 'some' when it was $9 felt deliberately misleading. I expect us to communicate honestly about shared costs, not use technicalities to avoid responsibility. Can we agree to be clearer and more upfront in the future?"
  2.  **Reinforce the System:** "Let's stick strictly to Splitwise for tracking *and* for discussing balances to avoid any misunderstandings. If one of us is short one month, let's just say that directly."
  3.  **Observe Future Behavior:** Does this pattern repeat? Is she generally fair, or is this part of a trend of shirking responsibility? Her reaction to this conversation will be telling.

  Your frustration is completely justified. Trust relies on good-faith communication, not linguistic loopholes. Your roommate prioritized avoiding accountability over honesty and fairness.
