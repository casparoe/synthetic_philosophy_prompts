  For my seminar on AI safety and alignment we've got a guest lecture next week from a decision theorist who's built his whole research program on the claim that the classic utility-indifference fix for the shutdown problem was never gonna work, and that what you actually need instead is an agent with incomplete preferences that follows a 'timestep dominance' rule rather than maximizing expected utility. I'm running the Q&A after and dont want him just restating the pitch: draft me 7-8 questions, including at least one on why the instability that utility-indifference has under self-modification/subagent creation doesn't just resurface for timestep dominance in a different guise, one on whether an incomplete-preference agent has its own incentive to 'complete' itself into a normal expected-utility maximizer just to avoid being money-pumped (which would make it un-shutdownable again), and one on whether this really gets you corrigibility in the fuller sense MIRI's original desiderata wanted -- accepting correction to its goals, not just tolerating shutdown -- or only the narrower piece. For each, add a follow-up keyed to whatever answer he's most likely to give, and close with a question on whether any of this decision-theoretic framing even bites on the neural nets we actually train, since those dont have explicit utility functions or dominance rules coded in anywhere.
