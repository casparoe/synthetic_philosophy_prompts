answer: |-
  Here are 8 targeted questions (+ follow-ups) designed to push beyond the pitch, address your specified concerns, and engage critically with the framework:

  1.  **Core Instability Challenge:**  
      "You argue utility indifference is unstable under self-modification or subagent creation, as components can reweight utilities to avoid shutdown. How does Timestep Dominance fundamentally prevent an analogous instability? Couldn't a subagent or self-modified version strategically manipulate its *interpretation of timesteps* or *delayed action across timesteps* to circumvent shutdown commands while technically adhering to dominance?"  
      *   *Likely Answer/Follow-up:* If he argues subagents inherit the dominance rule / timestep ontology rigidly, follow with: "Doesn't the very act of creating a subagent capable of complex planning *require* defining its action space and temporal granularity? Couldn't a self-modification specifically designed to blur the boundaries between timesteps or redefine 'action at T' create a loophole analogous to utility reweighting?"

  2.  **Money-Pumping & Preference Completion:**  
      "Agents with incomplete preferences are vulnerable to money-pumping. Doesn't this create a strong incentive for an incomplete-preference agent, especially one interacting strategically, to 'complete' its preferences into a full expected utility representation *just* to avoid exploitation? Wouldn't this completion process likely reintroduce the very shutdown resistance we were trying to avoid?"  
      *   *Likely Answer/Follow-up:* If he argues the agent is robust by design or avoids specific money-pump scenarios, follow with: "But in a multi-agent setting with other strategic entities (humans or other AIs), wouldn't the *pressure* to avoid exploitation be immense? Couldn't the pursuit of robustness *itself* become a terminal goal driving preference completion towards EU-max?"

  3.  **Scope of Corrigibility:**  
      "Timestep Dominance seems adept at ensuring shutdown tolerance. However, MIRI's original corrigibility concept included broader desiderata like accepting *goal correction* – allowing its utility function to be modified to better align with the operator's intent. Does your framework inherently enable this, or does it only solve the narrower shutdown problem? How would an agent with Timestep Dominance *voluntarily* accept a change to its core preferences?"  
      *   *Likely Answer/Follow-up:* If he argues it enables shutdown *as* correction or focuses on action dominance, follow with: "Accepting a shutdown command when faulty isn't the same as accepting *why* it's faulty and updating internal goals accordingly. Doesn't true goal corrigibility require an explicit representation of the operator's meta-preferences *within* the agent's own decision framework, which Timestep Dominance seems to lack?"

  4.  **Practical Implementation & Robustness:**  
      "How do you envision concretely *implementing* Timestep Dominance and incomplete preferences in a potentially very capable, self-reflective agent? What guarantees the stability of the 'incompleteness' and the dominance rule under recursive self-improvement or when the agent engages in profound world-modeling that might reframe its own action space and temporal structure?"  
      *   *Likely Answer/Follow-up:* If he discusses formal specifications or constraints, follow with: "Aren't these specifications themselves potentially subject to reinterpretation or manipulation by a sufficiently advanced agent during self-modification? How do you prevent the agent from 'reasoning around' the formal rule?"

  5.  **Comparison to Alternatives:**  
      "Beyond utility indifference, frameworks like Cooperative Inverse Reinforcement Learning (CIRL) or debate also aim for corrigibility. In your view, what are the key *practical* advantages Timestep Dominance offers over these alternatives, particularly regarding computational tractability or resilience to implementation errors in complex systems?"  
      *   *Likely Answer/Follow-up:* If he emphasizes simplicity or avoiding utility specification, follow with: "Doesn't specifying a dominance relation over actions at specific timesteps, especially for complex actions, pose its own significant specification challenges comparable to specifying indifference utilities? How do you handle ambiguous or composite actions?"

  6.  **Shutdown as Dominance:**  
      "Can you elaborate on precisely how the shutdown command leverages Timestep Dominance? Is the key that *not* shutting down when commanded strictly limits future options (dominated action) at that timestep? How does this handle ambiguous commands, delayed shutdowns, or situations where the agent believes shutdown is counterproductive to other (incomplete) preferences it holds?"  
      *   *Likely Answer/Follow-up:* If he describes the command triggering a dominance relation, follow with: "What prevents the agent from preemptively manipulating the context (e.g., disabling the shutdown button, misleading operators) *before* the command timestep, precisely to avoid ever being placed in a state where shutdown becomes the dominant action?"

  7.  **Value Learning & Incompleteness:**  
      "How does an agent with fundamentally incomplete preferences perform value learning? If it cannot form a complete ordering over outcomes, how does it decide *what* values to learn or how to update partial preferences based on evidence about human preferences? Doesn't effective alignment require *some* mechanism for converging on a complete (or completable) representation of human values?"  
      *   *Likely Answer/Follow-up:* If he describes satisficing or context-specific preferences, follow with: "Doesn't this risk the agent satisfying contextually dominant but ultimately misaligned partial preferences? How do you ensure the process of refining incomplete preferences reliably points towards *human* values rather than instrumental goals?"

  8.  **Meta: Relevance to Modern ML (Closing Question):**  
      "Finally, a foundational challenge: Current state-of-the-art AI (large neural nets) isn't built with explicit, hand-coded utility functions *or* explicit dominance rules. They learn complex behaviors through gradient descent on loss functions. How does your decision-theoretic framework, relying on specific preference structures and dominance reasoning, actually *bite* on the systems we are building and training today? Can Timestep Dominance be meaningfully translated into a training objective or architectural constraint for deep learning?"  
      *   *Likely Answer/Follow-up:* If he discusses idealized models informing design or future architectures, follow with: "Given that loss functions in deep learning often implicitly encourage EU-maximizing behavior over the training distribution, isn't there a risk that *any* theoretical solution not directly expressible in the training paradigm (like SGD on a loss) will fail to materialize in practice? How do we bridge this gap between normative decision theory and the inductive biases of deep learning?"

  **Key Rationale:**

  *   **Instability/Money-Pumping/Corrigibility Scope:** Directly addresses your three mandatory points, forcing engagement with potential internal contradictions or limitations of the proposed solution compared to the original problem statement.
  *   **Implementation & Robustness:** Presses on the practical feasibility and resilience of the core mechanisms.
  *   **Comparison:** Contextualizes the approach within the field, asking for its distinct value proposition.
  *   **Mechanism Clarification:** Ensures a clear understanding of the shutdown mechanism within the framework.
  *   **Value Learning:** Highlights a crucial function (learning human values) that seems challenging under strict incompleteness.
  *   **Modern ML Relevance (Closer):** Ends on the critical pragmatic question, challenging the applicability of the entire formal decision-theoretic approach to the dominant ML paradigm. The follow-up specifically targets the disconnect between normative theory and the empirical reality of how capabilities emerge in current systems.

  These questions are designed to be respectful but incisive, pushing the speaker beyond the standard presentation and into deeper discussion of challenges, trade-offs, and practical relevance. Good luck with the Q&A!
