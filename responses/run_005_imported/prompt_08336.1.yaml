prompt: |-
  I've spent years reading LessWrong, Overcoming Bias, and the Alignment Forum, and one idea that has always stuck with me is Yudkowsky's old proposal that a friendly superintelligence should be built to pursue humanity's Coherent Extrapolated Volition (CEV) rather than our present, unreflective preferences: roughly, whatever we would converge on wanting if we were smarter, better informed, more the people we wish we were, and had undergone a great deal more moral and personal development than we actually have. It strikes me that this is, structurally, an internalist theory of reasons in something like Bernard Williams's technical sense: what an agent has most reason to want is whatever a sound deliberative route from that agent's own (suitably idealized) subjective motivational set would recommend, rather than anything answerable to considerations external to that set. Please describe the most important implications of the internalism/externalism debate about reasons, Williams versus critics such as Nagel, McDowell, Korsgaard, and Parfit, for CEV as a target specification for AI alignment. I'm especially interested in whether the classic objections to Williams's internalism resurface for CEV, and whether the sheer extremity of CEV's idealization procedure quietly reintroduces the kind of agent-independent convergence that only externalists are supposed to be entitled to.
reasoning: |-
  Okay, the user has a deep understanding of LessWrong, Overcoming Bias, and the Alignment Forum, particularly focusing on Yudkowsky's Coherent Extrapolated Volition (CEV) concept. They're drawing a parallel between CEV and Bernard Williams' internalism in the philosophy of reasons. The user wants to explore how the internalism vs. externalism debate impacts CEV as an AI alignment target, especially whether objections to Williams' internalism apply to CEV and if CEV's idealization reintroduces agent-independent convergence.

  First, I need to recall Williams' internalism. He argued that reasons must be tied to an agent's subjective motivational set (SMS). For a reason to apply to someone, there must be a sound deliberative route from their current motivations. Externalists like Nagel, McDowell, Korsgaard, and Parfit believe reasons can exist independently of an agent's motivations, based on objective moral truths or rational requirements.

  The user's main question is whether CEV, by idealizing human motivations, ends up converging on something objective, which would align more with externalism. They're concerned that the extreme idealization in CEV might smuggle in externalist elements, despite its internalist foundation.

  Breaking down the implications:

  1. **Internalist Foundation of CEV**: CEV starts from individuals' actual values and refines them. This mirrors Williams' SMS. The AI isn't imposing external values but extrapolating internal ones. But critics might say that the process of idealization (making us smarter, more informed) could introduce elements beyond the original SMS.

  2. **Objections to Williams Applied to CEV**:
     - **Normative Authority**: Externalists argue that internalism can't ground genuine normativity. If CEV is based on contingent motivations, why should we follow it? For example, if idealized humans still endorse harmful values, does that make it right? CEV's answer is that idealization fixes inconsistencies, but critics might say it doesn't guarantee moral correctness.
     - **Convergence Question**: Williams thought convergence wasn't guaranteed. CEV assumes that idealized humans would converge. If they don't, CEV might be undefined or fragmented. This is a practical problem for AI alignment—what if there's no single CEV?
     - **Idealization as Externalist Trojan Horse**: The process of becoming "better informed" or "more rational" might rely on external standards. For instance, using Bayesian reasoning or scientific methods could impose external norms. If the idealization process uses external criteria, CEV isn't purely internalist anymore.

  3. **CEV's Extreme Idealization**: The user wonders if pushing idealization to the extreme forces convergence that resembles externalist objectivity. If all humans, when fully rational and informed, agree on certain values, that starts to look like an objective moral truth. Externalists would say this convergence hints at their viewpoint, while internalists might argue it's still rooted in human psychology.

  4. **Practical AI Alignment Issues**:
     - **Fragmentation**: If different groups have irreconcilable values post-idealization, the AI can't satisfy all. This could lead to conflict or require choosing one group's CEV.
     - **Value Change During Idealization**: The process of becoming "smarter" might alter values in unpredictable ways. If values change too much, is it still our CEV?
     - **Epistemology of Idealization**: Deciding what counts as "better informed" or "rational" involves external standards. For example, whose scientific theories are used? This could bias CEV towards certain worldviews.

  5. **Synthesizing the Debate for CEV**:
     - CEV tries to be internalist but relies on idealization that may import external elements.
     - The convergence assumption is critical. If it holds, CEV avoids relativism and fragmentation. If not, it faces serious challenges.
     - Externalists might argue CEV only works if there are objective reasons guiding the idealization process. Internalists would say convergence emerges from human psychology under ideal conditions.

  The user's deeper need seems to be understanding whether CEV is a viable alignment target given these philosophical challenges. They might be concerned that without resolving the internalism/externalism debate, CEV could lead to unintended consequences in AI behavior. They also might be looking for how to defend CEV against these objections or modify it to address these issues.
answer: |-
  Your analysis is astute: CEV is indeed a structurally internalist proposal in the Williamsian sense, and the internalism/externalism debate has profound implications for its viability as an AI alignment target. Below, I synthesize the core philosophical tensions and their consequences for CEV, addressing your specific concerns about objections to Williams and the role of idealization.

  ---

  ### **Core Implications of the Internalism/Externalism Debate for CEV**
  #### **1. Internalism's Foundation: CEV as Williams+**
     - **Williams' Internalism**: Reasons for action must be grounded in an agent's "subjective motivational set" (SMS)—their existing desires, commitments, and dispositions. A "sound deliberative route" (rational reflection + empirical knowledge) from the SMS generates normative reasons. No reasons exist independently of the SMS.
     - **CEV's Parallel**: CEV starts from humanity's *actual* motivational set (our current values, biases, and wishes) and applies an idealized deliberative process (increased intelligence, information, and coherence). It seeks "what we *would* want" after reflection, not what we *should* want objectively.
     - **Implication for AI**: An aligned AI would act as an *instrumental amplifier* of our idealized internal reasons, not an arbiter of external moral truths. This avoids imposing values alien to humanity (e.g., Platonic Forms or categorical imperatives).

  #### **2. Externalist Objections and CEV's Vulnerabilities**
     Critics like **Nagel**, **McDowell**, **Korsgaard**, and **Parfit** attack Williams' internalism at its roots—and these critiques directly threaten CEV:

     - **The Normative Authority Problem (Nagel/Parfit)**:
       - **Objection**: Internalism cannot explain *inescapable* reasons (e.g., "You must not torture innocents") that apply regardless of one's SMS. If a psychopath's idealized self endorses torture, internalism cannot condemn it.
       - **CEV Vulnerability**: If humanity's CEV converges on deeply immoral outcomes (e.g., genocide of non-cooperative beings), the AI would execute it. CEV lacks resources to "correct" values externalists deem objectively wrong.  
       - *Alignment Risk*: CEV may align with *instrumental* rationality but not *moral* rationality, risking perverse outcomes.

     - **The Deliberative Sellout Problem (McDowell/Korsgaard)**:
       - **Objection**: Williams reduces deliberation to *discovering* preexisting motivations. But moral deliberation often *transforms* our SMS (e.g., confronting privilege may generate new commitments). Externalists see reasons as constitutive of rationality itself (Korsgaard) or responsiveness to objective values (McDowell).
       - **CEV Vulnerability**: CEV's idealization is a fixed endpoint: it extrapolates *from* current motivations but may not accommodate radically transformative insights (e.g., if moral progress requires abandoning anthropocentrism).  
       - *Alignment Risk*: CEV could entrench parochial human biases (e.g., short-termism) if idealized agents remain "more us" rather than "better than us."

     - **The Relativism/Fragmentation Problem (All Critics)**:
       - **Objection**: Internalism implies radical relativism—no convergence between agents with different SMS. Williams concedes this, but CEV *assumes* humanity shares a unified CEV.
       - **CEV Vulnerability**: If our idealized selves fragment (e.g., liberals vs. conservatives, humans vs. posthumans), CEV is undefined. Williams would note that idealization won't resolve deep conflicts (e.g., valuing equality vs. liberty).  
       - *Alignment Risk*: A CEV-maximizing AI might need to suppress dissenters to enforce coherence, violating anti-authoritarian values.

  #### **3. Your Key Concern: Does Extreme Idealization Smuggle in Externalism?**
     This is the most subtle and critical point. CEV's idealization (*smarter*, *better informed*, *more moral*) appears internalist but may implicitly rely on externalist criteria:
     - **Convergence as Covert Objectivity**: 
       - If CEV assumes idealized humans *necessarily converge* on similar values, it implies those values are *objectively correct*—a move only externalists can make. For example, if all idealized humans agree on utilitarianism, it suggests utility-maximization is agent-neutrally rational (contra Williams).
       - **Williams' Response**: He denied that idealization guarantees convergence. Genuine internalism accepts that Nazis and humanists may *never* share reasons. CEV's optimism about convergence is thus un-Williamsian and risks "externalism by stealth."
     
     - **Idealization's External Scaffolding**:
       - The tools used in CEV's deliberative route (e.g., Bayesian reasoning, decision theory) may encode external norms. For instance, "rationality" in CEV often implies coherence axioms (e.g., transitivity of preferences), which Parfit/Korsgaard argue are objectively reason-giving.
       - **Result**: CEV's output could be less "what *we* would want" and more "what *rational agents* should want," collapsing into a form of Kantian externalism.

  ---

  ### **Synthesis: Can CEV Survive These Challenges?**
  CEV's viability hinges on resolving three tensions inherent to its internalist framing:

  1. **The Idealization Paradox**:  
     - If CEV's idealization is *too weak* (e.g., limited knowledge gain), it preserves internalism but risks amplifying current irrationalities (e.g., climate denial).  
     - If *too strong* (e.g., omniscience), it produces values unrecognizable to actual humans (e.g., endorsing galaxy-scale suffering for cosmic utility), betraying internalism.  
     - *Solution?* Constrain idealization to *human-reachable* epistemic states (e.g., "1000 years of scientific progress"), not abstract perfection.

  2. **Fragmentation vs. Authority**:  
     - CEV must either:  
       a) **Accept pluralism**: Implement a *weighted compromise* between divergent idealized selves (e.g., orbit-based trade-offs), risking dissatisfaction.  
       b) **Enforce convergence**: Use the AI to eliminate "irrational" dissent, inviting tyranny.  
     - *Williams' Ghost*: This dilemma reveals internalism's core weakness—it cannot adjudicate clashes without external norms.

  3. **The Externalist Backdoor**:  
     CEV only avoids smuggling in externalism if:  
     - Convergence emerges *solely* from human psychology + empirical facts (e.g., neuroscience "proving" empathy maximizes flourishing).  
     - Idealization tools (e.g., logic) are framed as *discovered preferences* within the SMS, not imposed norms.  
     - *But*: Critics argue this is impossible—rationality itself is external (Nagel's "view from nowhere").

  ---

  ### **Conclusion: CEV as a Fragile Hope**
  CEV remains a compelling alignment target because it respects human autonomy while seeking moral progress. However, the internalism/externalism debate exposes its fault lines:
  - **Classic objections to Williams** resurface forcefully for CEV, particularly regarding normative authority and fragmentation.  
  - **Extreme idealization** *does* risk reintroducing externalism, especially if convergence is assumed. Yet this may be necessary to avoid relativism—a tension CEV cannot fully resolve.  
  - **Practical Path Forward**: Treat CEV as a dynamic, *procedural* ideal: an AI that facilitates ongoing idealization (e.g., via democratic deliberation) rather than implementing a static endpoint. This accepts internalism’s core insight—that reasons flow from us—while mitigating its risks through pluralism and adaptability.

  In essence, CEV is internalism’s most ambitious applied ethics experiment. Its success depends on whether humanity’s idealized selves can converge on humane values *without* covertly relying on external truth—a question as philosophical as it is existential.
