prompt: |-
  Ok this is a bit of a tangent from my actual dissertation work but it's been bugging me. I've been reading about program equilibrium (agents submit source code instead of actions, so you can support cooperation in one-shot PD without repeated play), and got to the part where FairBot cooperates with another agent iff it can prove that agent cooperates with it -- and somehow two FairBots facing off both manage to prove mutual cooperation thanks to Lob's theorem. I get why naive mutual simulation blows up into infinite regress (A simulates B simulating A simulating B, forever), but I don't get why swapping 'simulate' for 'prove' actually fixes that instead of just hiding the same circularity one level up. 'I cooperate iff I can prove you cooperate with me' still just sounds question-begging to me -- whats Lob's theorem actually doing that lets this bottom out instead of regressing?
