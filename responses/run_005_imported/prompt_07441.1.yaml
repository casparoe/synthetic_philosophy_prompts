  Also, Aquinas's distinction between *rex* (true king) and *tyrannus* in *De Regno* is crucial. The friar would insist the signore is a tyrant, not a legitimate ruler. 

  The user might need to avoid making the friar seem revolutionary. Aquinas usually prefers non-violent solutions, but the friar is arguing for assassination. So, emphasizing the signore's irreversible tyranny and the immediate danger he poses would justify the extreme measure. 

  Authenticity also comes from the friar's Dominican background. He'd reference Aquinas as "Doctor Angelicus" and use scholastic structure: state the objection, cite Aquinas, conclude. Mentioning Church Fathers like Augustine adds depth. 

  Practical phrases: "lex iniusta non est lex" (unjust law is no law) from I-II, Q.96. The friar can say the signore's commands lack "vim coactivam" (coercive force) because they're not just. 

