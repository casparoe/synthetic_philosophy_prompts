  Next, I-II, Q.96, A.4 is important. Aquinas discusses whether unjust laws bind in conscience. He uses the phrase "law as an act of violence" here. The friar could argue that the signore's laws are violent impositions, not true laws, so they don't require obedience. 

  Also, *De Regno* has passages on tyranny. Chapter 6 mentions that if a ruler becomes a tyrant, the people can depose him. The metaphor of the physician who becomes a danger is powerful. The friar might use that imagery to say the signore is like a doctor poisoning his patients. 

  The user wants specific phrases. Latin terms like *tyrannus* and *bonum commune* add authenticity. The friar should contrast *ordo iustitiae* (order of justice) with the signore's *propria commoda* (private advantage). Quoting Aquinas's exact phrasing, like "non est seditiosum" from II-II, Q.42, makes it sound genuine. 

