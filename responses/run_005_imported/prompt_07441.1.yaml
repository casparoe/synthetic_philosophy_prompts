answer: |-
  To craft an authentic Thomistic argument for tyrannicide, your Dominican friar should anchor his rhetoric in specific passages from Aquinas, using precise terminology and scholastic structure. Here are the key texts and phrases he would invoke, framed persuasively:

  ### Core Thomistic Texts & Arguments:
  1. **On Tyranny vs. Legitimate Rule**  
     - **Source:** *De Regno (On Kingship)*, Book I, Chapter 3–6  
     - **Key Phrases:**  
       > *"Tyrannus bonum commune contemnit, et proprium commodum quaerit."*  
       ("The tyrant despises the common good and seeks his private advantage.")  
       > *"Sicut medicus aegrotanti, ita tyrannus regno pestifer existit."*  
       ("Just as a physician becomes dangerous to the sick, so a tyrant is a plague to the realm.")  
     - **Friar’s Application:**  
       "As the *Doctor Angelicus* writes in *De Regno*, this Signore has inverted the very *telos* of governance. He rules *propter commodum proprium*, not *propter bonum commune*—rendering his authority *de facto* void. A ruler who poisons the body politic is no true physician, but a pestilence to be excised."

  2. **On Sedition and Unjust Authority**  
     - **Source:** *Summa Theologiae* II-II, Q.42, A.2  
     - **Key Passage:**  
       > *"Seditio dicitur esse quandoque peccatum... sed contra tyrannum non est seditiosum insurgere."*  
       ("Sedition is sometimes a sin... but to rise against a tyrant is not seditious.")  
       > *"Ille qui tyrannidem exercet, iam ipse seditiosus est."*  
       ("He who exercises tyranny is already seditious.")  
     - **Friar’s Application:**  
       "Question 42 of the *Secunda Secundae* is unequivocal: When a ruler *becomes the source of discord*—when he *sows sedition* against the common good—his subjects incur no guilt for removing him. This Signore *is* the discord Aquinas condemns! To kill him is not murder (*homicidium*), but the excision of a tumor festering in the *corpus politicum*."

  3. **On the Nullity of Unjust Laws**  
     - **Source:** *Summa Theologiae* I-II, Q.96, A.4  
     - **Key Argument:**  
       > *"Lex iniusta non habet rationem legis, sed magis violentiae."*  
       ("An unjust law lacks the nature of law; it is violence instead.")  
     - **Friar’s Corollary:**  
       "When laws serve only the ruler’s *cupiditas*, they lose the *vis coactiva* [coercive force] of true law. Aquinas teaches in the *Prima Secundae* that such edicts bind no conscience. To strike down this tyrant is to reject *violentia* masquerading as *lex*."

  ### Persuasive Rhetorical Tactics:
  - **Scholastic Precision:**  
    Have the friar structure his argument *objection/respondeo* style:  
    > *"Objectio: Does not Romans 13:1 command obedience to authorities? Respondeo: As Aquinas clarifies in *De Regno*, obedience is due only to rulers who fulfill their office as *ministri Dei ad bonum*. A tyrant is *Dei inimicus*—God’s enemy!"*  

  - **Dominican Authenticity:**  
    - Use Latin terms of art: *bonum commune* (common good), *tyrannus* (tyrant), *ordo iustitiae* (order of justice).  
    - Cite Aquinas as "*Doctor Communis*" or "*Angelicus Doctor*," not just "Aquinas."  
    - Reference Augustine’s *City of God* (XIX.21) as Aquinas’ source for tyranny’s illegitimacy.  

  - **Moral Urgency:**  
    > "Aquinas writes in *De Regno*: *'Tolerare potest tyrannum moderatum... sed ubi dominatus intolerabilis est, merito conspiratur contra eum.'* [We may endure a moderate tyrant... but when his rule is intolerable, it is just to conspire against him.] Ask yourselves: Is this *dominatus* not *intolerabilis*? Are his sins not *in populum manifestae*?"  

  ### Critical Nuance:
  To avoid caricature, have the friar acknowledge Aquinas’ preference for *non-lethal* removal (ST II-II Q.42 A.2 ad 3)—then passionately argue why assassination is the *only* recourse:  
  > "Though the Doctor urges *modus minor* where possible, he concedes that when a tyrant’s corruption is *inextricabilis* and his removal *per vias iuris impossibile*... then the blade that cuts short his reign restores the *ordo* God ordained."  

  This grounds the argument in Aquinas’ logic while justifying extremity. The friar’s fervor should mirror Dominican reformers like Savonarola (minus the heresy), blending theological precision with visceral outrage against corruption.  

  For deeper immersion:  
  - Read *De Regno* Chapters 5–7 and ST II-II Q.42 in full.  
  - Explore Cajetan’s commentaries (Aquinas’ premier Renaissance interpreter) on tyranny.  

  This approach transforms Aquinas from a name-drop into the structural pillar of your coup’s moral architecture.
