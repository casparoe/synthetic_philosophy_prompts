answer: |-
  Here's an example illustrating the tension, using a scenario inspired by the 1990-1991 Gulf War:

  **Scenario: The Invasion of Neighborland**

  *   **Aggressor State (Redland):** Led by an authoritarian regime, Redland launches a surprise invasion of its smaller, resource-rich neighbor, Neighborland. Their stated justifications include historical territorial claims (largely fabricated) and accusations of economic sabotage (unsubstantiated). Their true motive is annexation and control of Neighborland's oil reserves.
  *   **Defender State (Neighborland):** Neighborland is a sovereign nation, though not a perfect democracy, defending itself against an unprovoked invasion aimed at conquest and resource theft. Its cause is clearly self-defense and the preservation of its territorial integrity and political independence.
  *   **International Coalition (Blue Alliance):** Acting under UN authorization, a coalition of nations (Blue Alliance) intervenes militarily to repel Redland's forces and restore Neighborland's sovereignty. Their stated cause is collective security and upholding international law against aggression.

  **Applying the Concepts:**

  1.  **Just War View (Jus ad Bellum):** According to just war criteria (just cause, right authority, right intention, last resort, proportionality, probability of success):
      *   **Neighborland & Blue Alliance:** Possess a **just cause** (defense against aggression, upholding international law). Their intervention likely meets the other criteria reasonably well (authorized by UN/self-defense, proportional force aimed at liberation, last resort after diplomacy failed).
      *   **Redland:** Lacks a **just cause**. Their invasion is aggression based on false pretenses and greed. It violates sovereignty and international law. Their war is unjust.

  2.  **Equal Moral Status of Combatants (Combatant Equality / Moral Equality of Soldiers):** This principle holds that *individual soldiers* on both sides, once they become combatants, possess the same fundamental moral rights and obligations *during combat* (Jus in Bello). Specifically:
      *   They are legitimate targets for each other.
      *   They have an equal right to kill enemy combatants.
      *   They are equally obligated to follow the laws of armed conflict (distinction, proportionality, humane treatment of POWs).
      *   Their moral status *as combatants* is not determined by the justice of their nation's *cause* for going to war (Jus ad Bellum). A Redland conscript fighting to repel Blue Alliance forces invading Redland territory (even territory gained unjustly) has the same combatant rights and obligations as a Blue Alliance soldier fighting to liberate Neighborland.

  **The Tension Illustrated:**

  1.  **The Just War Judgment:** We readily conclude that Redland's *war* is morally wrong (unjust aggression), while Neighborland's and the Blue Alliance's *war* is morally right (just defense). This implies a fundamental moral asymmetry at the level of the *conflict itself* and the *leadership* initiating it.
  2.  **The Equal Status of Combatants:** Yet, the principle of combatant equality insists that the *individual soldiers* fighting for Redland possess the *same moral standing during combat operations* as those fighting for Neighborland or the Blue Alliance. A Neighborland sniper is morally permitted to kill a Redland soldier advancing on their position, and vice versa. A Redland tank crew surrendering has the same right to humane treatment as a captured Blue Alliance pilot. Their actions are judged solely by *how* they fight (Jus in Bello), not *why* their nation is fighting (Jus ad Bellum).

  **What Creates the Tension?**

  The tension arises from the **separation of the two levels of moral judgment in Just War Theory (JWT) and the nature of modern warfare:**

  1.  **Separation of Jus ad Bellum and Jus in Bello:** JWT deliberately compartmentalizes the justice *of going to war* (Jus ad Bellum) from the justice *in the conduct of war* (Jus in Bello). Combatant equality is a core principle of Jus in Bello. This separation is intended to protect soldiers and civilians *during* the fighting, regardless of who started it. However, this separation *feels* counterintuitive when one side's cause is blatantly unjust. How can soldiers fighting for an unjust cause have the *same* moral permission to kill as those fighting for a just one?
  2.  **Focus on Individual Action vs. Collective Responsibility:** Combatant equality focuses on the *role* and *actions* of the individual soldier *in combat*. It assumes that soldiers, especially conscripts or low-level troops, are often instruments of state policy, not autonomous authors of the war's injustice. They are bound by military duty and may lack full knowledge or choice. Judging them based on their nation's cause seems unfair or impossible at the individual combat level. The injustice lies primarily with the *leadership* and the *state*.
  3.  **Practical Necessity:** Applying different moral statuses *during combat* based on the justice of the cause would be practically unworkable and lead to chaos. How would soldiers know in the heat of battle if the enemy soldier they face is "justly" or "unjustly" fighting? How could surrender or POW status be managed fairly? Combatant equality provides clear, functional rules for the conduct of hostilities.
  4.  **The Burden of Unjust Causality:** The tension highlights the uncomfortable reality that soldiers fighting for an unjust cause are morally permitted (even expected) to perform actions (killing just combatants) that ultimately serve an unjust end. While they aren't personally blameworthy *for the war itself*, their actions contribute to its unjust goal. This creates a moral burden or "taint," even if they follow Jus in Bello perfectly.

  **Conclusion:**

  The scenario shows that while we can (and should) condemn Redland's *war* as unjust, the principle of combatant equality demands that we recognize the individual Redland soldier as a moral agent whose rights and obligations *during combat* are identical to those of the Neighborland or Blue Alliance soldier. The tension stems from the disconnect between the collective moral failing of the state (unjust war) and the individual moral position and role of the soldier bound by the rules of armed conflict. It forces us to grapple with the limits of individual responsibility within a system of collective violence initiated by others.
