  Also, the user’s scientific background suggests he values empirical data. His log is a methodical approach to a problem with no clear external metrics. Even if the terms shift over time, the consistent logging might still reveal patterns. For example, a "bad hum week" might correlate with stress or lack of sleep, even if "hum" isn't perfectly defined.

