  Here’s a toast weaving Lewis’s social ontology into a warm, personal tribute – precise enough for philosophers, moving for family, and anchored in your friends' unique bond. It runs about 3.5 minutes when read aloud at a natural pace:

  ---

  **A Properly Lewisian Toast for [Bride's Name] and [Groom's Name]**

  Friends, family, fellow travelers in life and – for some of us lately – deep in the weeds of David Lewis’s *Convention*… thank you for gathering to celebrate [Bride] and [Groom]. [Bride], my friend, roommate, and partner-in-crime through countless seminars, you asked for "properly Lewisian." Challenge accepted. And don’t worry, family – I promise no Venn diagrams or payoff matrices. Just a way of seeing something true about these two.

  You see, Lewis spent a lot of time thinking about how *conventions* work. Not grand pronouncements, but the quiet, everyday rules that let us smoothly share a world. Driving on the right, saying "bless you," knowing which fork to use. They’re powerful because they’re solutions to *coordination problems* – situations where what matters most is simply that we do the *same* thing, not necessarily *which* thing we do. And crucially, Lewis showed these conventions take hold not because some authority decrees them, or because they’re the One Rational Choice, but through something far more human: repetition, precedent, and **common knowledge**.

  **Common knowledge** – and yes, philosophers, I mean it in the technical sense – is that beautiful, sometimes dizzying state where *I know*, and *you know*, and *I know that you know*, and *you know that I know that you know*... and so on, ad infinitum. It’s the bedrock of convention. It’s the unspoken hum in a room when everyone realizes, *without a word*, that *this* inside joke is now sacred, or *that* look means "rescue me from this conversation."

  [Groom] and [Bride], look around this room. There is **common knowledge** here. We *all* know – and know that everyone else knows – that what you two have built is something profoundly special. It’s not just love; it’s a whole ecosystem of understanding.

  And how did that ecosystem grow? Lewis, and thinkers like Skyrms who built on his work, showed us: through countless tiny interactions. It’s evolutionary. Think of those early dates, those first shared apartments. Every time you navigated who cooked and who cleaned up, who took the trash out, who initiated the awkward "so... where is *this* going?" talk – you weren’t just negotiating. You were playing a repeated game. You were testing strategies, establishing **precedents**. Some solutions stuck because they worked *for you two*, in your specific context. They became **salient** – the obvious focal point *for your partnership*.

  Think about your private language: the nicknames that would sound absurd to anyone else, the shorthand references only you understand, the specific side of the bed that just *feels* like home. These are your **private conventions**. And here’s the Lewisian kicker that’s absolutely *not* cynical: **They are beautifully, fundamentally arbitrary.**

  *(Pause, look around, smile)*

  Now, philosophers, before you clutch your pearls or nod sagely – "arbitrary" doesn't mean unimportant! It means the *opposite*. Lewis taught us that the very **arbitrariness** of a convention is what makes it powerful. Driving on the left works *just as well* as driving on the right. The magic isn't in the *direction*; it's in the *shared commitment to the solution*. The fact that there are *many* possible, equally functional ways to coordinate makes the one you *do* choose uniquely *yours*. It’s a testament to your specific history, your shared **salience**.

  Your "who does the dishes" rule? Arbitrary! Could easily be the other way. But it *works* because you both converged on it, through precedent. That ridiculous nickname? Deeply arbitrary! But it’s a Schelling point of affection *only you two* could have landed on. *(Lean in conspiratorially to the couple)* And honestly, coordinating on whose family’s slightly eccentric holiday tradition to follow this year? That’s a high-stakes coordination problem worthy of a Nobel. I’m glad you’ve evolved stable strategies! *(Wink - this is the philosopher joke. The cohort gets "Schelling point" and "high-stakes coordination problem"; family gets the relatable holiday tradition struggle.)*

  This is the quiet miracle Lewis helps us see. Your marriage isn’t built on a single grand contract. It’s built on the countless, small, **arbitrary** conventions you’ve co-created and maintained through repetition and unwavering mutual recognition – **common knowledge**. They form a lattice of understanding so strong precisely *because* it’s your unique solution, selected for over time. It’s resilient, adaptable, and utterly personal.

  So, we raise our glasses not just to love – though there’s oceans of that here – but to the magnificent, intricate, beautifully **arbitrary** web of conventions [Bride] and [Groom] have woven together. To the common knowledge that binds them, the precedents that guide them, and the salience they find uniquely in each other. To the ongoing, glorious, unscripted coordination game of their lives.

  To [Bride] and [Groom]!

  ---

  **Why this works:**

  1.  **Warmth First:** Opens with celebration and personal connection. Immediately reassures family ("no Venn diagrams").
  2.  **Lewis Machinery, Clearly Explained:** Introduces key terms (Convention, Coordination Problem, Common Knowledge, Precedent, Salience, Arbitrariness) with accessible analogies (driving, forks, inside jokes) *before* applying them to the couple.
  3.  **Arbitrariness Handled:** Explicitly addresses the potential negative connotation ("doesn't mean unimportant!") and flips it to show why it makes conventions uniquely meaningful and personal ("uniquely *yours*", "testament to your specific history").
  4.  **Evolutionary Angle:** Explicitly mentioned ("evolutionary," "repeated game," "testing strategies," "selected for over time") and linked to specific, relatable couple behaviors (dishes, nicknames, traditions).
  5.  **Specific & True:** Focuses on the *uniqueness* of the couple's private conventions (nicknames, bed sides, holiday traditions) as evidence of their Lewisian coordination. Avoids generic platitudes.
  6.  **The Joke:** Targets a relatable couple coordination problem (family traditions) using precise terms ("high-stakes coordination problem," "Schelling point") in a way that philosophers will appreciate but family will still find humorous because the *situation* is clear.
  7.  **Not Cynical:** Emphasizes the *strength*, *resilience*, *uniqueness*, and *mutual commitment* inherent in the Lewisian view ("shared commitment," "unwavering mutual recognition," "web of conventions," "magnificent, intricate").
  8.  **Structure:** Clear narrative arc: Lewis's Ideas -> How They Apply to Couple -> The Beauty of Arbitrariness -> Specific Examples & Joke -> The Meaning of It All -> Toast.
  9.  **Time:** Reads aloud comfortably in 3-4 minutes.
  10. **Common Knowledge:** Used correctly and explained in context, satisfying the cohort.

  This toast uses Lewis's framework not as decoration, but as a genuine lens to celebrate the specific, evolved, and beautifully coordinated partnership of the couple, hitting the requested notes perfectly. Good luck!
