  Philosophically, realism vs. instrumentalism is central. Realism would say the representation exists independently, like place cells. Instrumentalism sees it as a useful tool for prediction. The Othello case leans instrumentalist—different probes reveal different structures. But the linear probe's effectiveness suggests some structure is there, just not in an absolute form.

