  I recall OC 151 where Wittgenstein explicitly says "I know" is misapplied to hinges. And OC 369 comparing them to rules of a game. The user wants textual anchors, so I'll need to reference these. 

  The category mistake angle is vital here. Moore thinks he's making a knowledge claim, but Wittgenstein argues the grammar is wrong - like saying "I know the rules of chess" as if they could be false. That fundamentally reframes Moore's project rather than refining it. 

  But it's not total rejection. Wittgenstein agrees such propositions are immune to doubt (OC 114), just not in the way Moore thought. The anti-skepticism survives but as a grammatical point, not an empirical one. The user seems sophisticated enough to handle this nuance - their geology/philosophy crossover thinking shows conceptual flexibility. 

