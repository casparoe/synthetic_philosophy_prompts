answer: |-
  Here’s a dialogue between **Alex** (Parfitian) and **Jamie** (Lewis-style identity theorist) focusing squarely on the fission case, with each responding to the other’s core moves. Neither "wins" outright—both positions are defended rigorously:

  ---

  **Alex (Parfitian):** Okay, let’s cut to the chase: fission proves identity isn’t what matters. If the teleporter glitches and makes two copies of me on Mars, I’m not *identical* to both—that’s logically impossible. But if I’m about to step into the machine, I’d care just as much about *both* of those future people as I would about my own survival. That’s because they’re both psychologically continuous with me. Relation R—continuity of memory, intention, character—is doing all the work. Identity is irrelevant.  

  **Jamie (Lewisian):** I agree you’re not identical to *both*. But that doesn’t mean identity is irrelevant. Before fission, there were *two people* co-located in your body—call them Lefty and Righty. They share all their pre-fission temporal stages. When fission happens, Lefty continues as Mars-Lefty, Righty as Mars-Righty. Each is identical to *one* of the originals. Identity holds, it’s just one-to-many at the stage level.  

  **Alex:** Hold on—you’re saying there were *two people* in my body all along? That’s absurd! I only ever had one stream of consciousness, one set of experiences. If there were two people, why didn’t *they* argue with each other? Why did “I” feel unified?  

  **Jamie:** They weren’t distinct *yet*. Think of a road that splits into two highways. Before the fork, it’s one road segment shared by both future roads. The fork doesn’t create new roads; it reveals which path belongs to which route. Similarly, pre-fission, Lefty and Righty overlap completely. They only become distinct persons when their psychology diverges post-fission.  

  **Alex:** But that’s just metaphysics avoiding the *practical* point. When I imagine fission, I don’t think, “Great, my two hidden selves get to branch!” I think, “*I* will survive twice.” And if I ask, “Which one am *I*?” the answer is neither—yet I still rationally care about both. Relation R explains that. Your “two people” story adds needless complexity.  

  **Jamie:** Does it? Suppose after fission, Mars-Lefty suffers while Mars-Righty prospers. Would you say, “Good, there’s continuity somewhere,” or would you pity Lefty? If the latter, it’s because Lefty is *identical* to a pre-fission person who’s now suffering. Identity grounds your concern. Relation R alone can’t tell us *who* is suffering—only identity can.  

  **Alex:** But in fission, I care *equally* about both outcomes. If Lefty suffers and Righty thrives, I’d feel both sad *and* happy. That’s symmetric concern—which makes sense if I’m not identical to either, but both inherit “what matters” from me. If there were truly two distinct people pre-fission, why wouldn’t I care more about one? Unless you’re saying I *am* both?  

  **Jamie:** No—you *were* both, but “you” (as a single-stage entity) are part of both continuants. Your concern is symmetric because both futures are equally continuous with *your current stage*. Identity isn’t about favoring one; it’s about tracing a unique path. Relation R is the *mechanism* of identity, not a replacement for it.  

  **Alex:** Then why insist on identity at all? If symmetric R explains my concern, and identity adds nothing but metaphysical baggage (like invisible pre-fission people), Occam’s razor cuts it away. Fission shows that survival isn’t literal identity—it’s R-preservation.  

  **Jamie:** Because without identity, you lose the *grounds* for special concern. If Relation R is all that matters, why care more about your fission descendants than a stranger who coincidentally shares your psychology? Yet we do care more—because they’re *us*, not just psychologically similar. Identity provides the “me-ness.”  

  **Alex:** But in fission, “me-ness” branches! It’s not that I care less—I care doubly. That’s the point: R-branching *expands* what matters. Whereas your view implies pre-fission “me” was always a committee. For the love of Kant, Jamie—does that feel true to your lived experience?  

  **Jamie:** *[Sighs]* No, it doesn’t *feel* like two people. But feelings aren’t metaphysics. The fission case forces us to choose: either identity isn’t what matters (your view), or identity is more complex than we thought (mine). I choose complexity because it preserves the intuition that survival *is* identity—just not atomic identity.  

  **Alex:** And I choose simplicity: survival is R-continuity, full stop. Identity is a red herring. But fine—let’s call it a draw. You keep your overlapping persons; I’ll keep my branch-dependent concern. At least we agree the copy isn’t “fake.”  

  **Jamie:** Deal. And for the record? If that teleporter ever gets built, I’m still not stepping in.  

  **Alex:** *[Grins]* Even after all this? Some identity theorist you are.  

  ---

  ### Key Moves Made:
  - **Alex’s thrust**: Fission forces symmetric concern without identity → Relation R suffices.  
  - **Jamie’s parry**: Overlapping persons preserve identity → R is the vehicle, not the destination.  
  - **Alex’s counter**: Metaphysical complexity vs. practical simplicity (Occam’s razor).  
  - **Jamie’s counter**: Without identity, special concern lacks foundation.  
  - **Stalemate**: Alex prioritizes phenomenology/ethics; Jamie prioritizes metaphysical rigor. Both concede the other has coherence but not persuasion.  

  This mirrors the real debate: Lewis saves identity by redefining persons as "worms" through spacetime; Parfit argues identity is empty and R does all normative work. Neither "loses"—they resolve nothing, like all great philosophy.
