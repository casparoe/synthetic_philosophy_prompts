prompt: |-
  Hey -- I'm putting together a problem set on money pumps for my decision theory seminar and I want to skip the boring textbook case (cyclic preferences: A over B over C over A, so you trade the person around the loop and skim a fee each lap). Construct a money-pump scenario instead for an agent whose preferences are merely incomplete rather than cyclic -- no loop anywhere, some pairs just aren't ranked against each other -- and spell out the literal sequence of trades that bleeds them dry over time. Then tell me: does the usual 'resolute choice' escape (McClennen's term for when the agent foresees the whole sequence up front and just commits at t1 to refusing every trade) save this agent the same way its supposed to save the cyclic-preference agent, or does the lack of an actual cycle make that move harder to run here?
