answer: |-
  ## The Text and the Practice: Holding America's Promise

  **(Adjust microphone. Pause. Look across the diverse audience – new citizens in their finest, scholars, officials. Begin with quiet gravity.)**

  Good morning. It is a profound honor to stand before you in this courthouse, on this day, as you prepare to take an oath that will bind you to this nation. The Fourth of July. Independence Day. Fireworks, parades, backyard barbecues. And beneath it all, a question. A question asked most piercingly, most painfully, by a man born into bondage: **Frederick Douglass.**

  In 1852, standing before a crowd in Rochester on *this* very holiday, Douglass demanded: "What, to the American slave, is your Fourth of July?" He answered with a thunderous denunciation of the hypocrisy, the hollowness, of celebrating liberty while millions were enslaved. That speech, "What to the Slave is the Fourth of July?", echoes powerfully, rightly, through history. It is the easy version to quote – the righteous fury.

  But Douglass, a man of immense intellect and evolving conviction, wrestled with a harder, more complex truth. He wrestled with the **text** of America itself: the Constitution.

  For years, influenced by abolitionist William Lloyd Garrison, Douglass believed the Constitution was inherently pro-slavery – a "covenant with death," a "bargain with hell." Its compromises with slave states, its clauses protecting the institution, seemed proof it was rotten from the start. The *practice* of the nation, built on the backs of the enslaved, confirmed this view.

  But Douglass looked deeper. He broke with Garrison. He studied the document, line by line, word by word. And he found something startling, something radical: **Nowhere in the text of the Constitution does the word "slave" or "slavery" appear.** Nowhere.

  Instead, the Founders used euphemisms: "other persons," "person held to service or labor." They avoided naming the abomination directly. Why? Shame? Political expediency? Perhaps. But Douglass seized on this textual silence. He argued that this *absence* was crucial. It meant the Constitution, **by its letter**, was not inherently pro-slavery. Its grand ideals – "We the People," "establish Justice," "secure the Blessings of Liberty" – were not lies *on the page*. They were a **promise**.

  But here lies the harder truth, the one that holds both light and shadow: **The nation broke that promise.** Not through the text, but through its *practice*. Through generations of laws, customs, violence, and willful denial, the United States practiced the very evil its foundational text refused to name. The glorious text became a cloak for a horrific reality. The promise was betrayed by the practice.

  **(Pause. Lean in slightly.)**

  This distinction – **text versus practice** – is not academic. It is the very heart of the American struggle. It is the tension we inherit, and the tension you embrace today.

  The **text** – the Constitution, the Declaration's soaring ideals – represents the aspiration. It is the North Star, the blueprint for a nation striving towards "a more perfect Union." It is the promise of liberty and justice *for all* – a promise inherent in the words themselves, even when whispered through euphemism. It is why Douglass, later in life, could call the Constitution "a glorious liberty document." He saw its potential, its fundamental alignment with freedom, *because* of what it refused to explicitly sanction.

  The **practice** – our history, our actions, our laws – is the messy, often brutal, reality on the ground. It is the betrayal of that textual promise. It is the chattel slavery Douglass was born into. It is the exclusions, the discriminations, the injustices that have marred every era. Practice reveals the gulf between aspiration and achievement.

  **(Gesture towards the new citizens.)**

  So why does this matter to you, standing here today, ready to pledge your allegiance?

  Because you are not inheriting a perfect union. You are inheriting a **struggle**. You are inheriting both the **promise** enshrined in the text – the ideals of liberty, equality, self-government – *and* the legacy of **betrayal** woven through our practice.

  Your oath today is not blind acceptance of everything America *has been*. It is a commitment to the America it *aspires to be*, as defined by its foundational text. It is a commitment to help *narrow the gap* between the promise and the practice. Douglass, in his fierce embrace of the Constitution's *potential*, understood this. He fought to make the practice align with the text's highest calling. He fought to redeem the promise.

  **(Speak directly to the new citizens.)**

  When you take that oath today, you step into this ongoing American story. You become part of "We the People." You inherit the power and the responsibility to interpret the text, to demand that practice lives up to the promise. You inherit the right to ask, as Douglass did, what these ideals truly mean. You inherit the right to insist that "liberty and justice for all" includes *you*, and everyone in this room, and everyone beyond these walls.

  The Fourth of July commemorates the *declaration* of an ideal. Your naturalization today is an *affirmation* of that same ideal – the ideal embedded in the text. But it is also an affirmation of the *work* required. The work of holding a nation accountable to its own highest principles. The work of ensuring that practice catches up to promise.

  Frederick Douglass called the Constitution "the **baptismal waters** of American liberty." Waters that were tragically muddied by practice, but waters that still held the potential for cleansing and renewal.

  **(Raise hand slightly, indicating the oath about to be taken.)**

  Today, in this courthouse, you step into those baptismal waters. You embrace the text’s enduring promise. And you take up the solemn, joyous task of helping this nation – *your* nation – live it out in practice.

  Welcome. Welcome to the struggle. Welcome to the promise. Welcome to the ongoing work of America.

  Thank you.
