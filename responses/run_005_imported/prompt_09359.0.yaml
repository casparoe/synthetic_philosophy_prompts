prompt: |-
  Random one from my actual life for once -- I'm a novelist, but I also sit on the admissions committee for the MFA program I graduated from (they like keeping an alum in the room). We just ran five years of admissions data and now the committee's split down the middle. By track: fiction admits 12% of women applicants vs 10% of men, poetry admits 32% of women vs 30% of men, nonfiction admits 56% of women vs 54% of men -- women do a bit better than men in literally every track. But women apply to fiction (brutal odds) in much bigger numbers than men do, and to nonfiction (easy odds) in much smaller numbers, so once you add it all up the overall admit rate works out to 22.5% for women and 42.5% for men. Half the committee wants to treat that overall gap as a bias problem that needs fixing at the admissions level; the other half says the by-track numbers close the case completely. I've got to write the memo we vote on Tuesday, and it needs to land on one actual recommendation -- not "form a subcommitee to study it" -- while genuinely engaging whichever side it doesn't land on, instead of just explaining their numbers away in a clause. Can you draft that memo for me?
reasoning: |-
  Okay, the user is a novelist and part of an MFA admissions committee. They're facing a split over gender disparity in admissions data. Women have higher admit rates per track but lower overall because they apply more to competitive tracks like fiction. The committee is divided: half see an overall bias problem, half think the per-track data clears it. The user needs a decisive memo for a vote.

  First, I need to unpack the data. Per-track, women do slightly better in fiction (12% vs 10%), poetry (32% vs 30%), and nonfiction (56% vs 54%). But women dominate applications to fiction (low admit rates) and avoid nonfiction (high admit rates), leading to an overall admit rate of 22.5% for women vs 42.5% for men. That's a big gap.

  The committee's split makes sense. One side focuses on the aggregate disparity, seeing systemic issues. The other side points to equitable per-track rates, suggesting fair evaluations. The challenge is addressing both views without dismissing either.

  The user wants a memo that picks a side but respects the opposition. No kicking the can to a subcommittee. They need a clear recommendation that engages the losing side. The memo must be diplomatic yet decisive.

  I should consider the deeper needs. The user likely wants to maintain committee unity while making data-driven decisions. They might fear that ignoring the overall gap could seem dismissive of gender equity concerns. Alternatively, forcing equal outcomes might undermine merit-based admissions.

  The memo should reframe the issue: is the problem in evaluation (per-track fairness) or in applicant behavior (track choice)? The data suggests the latter. But why do women choose fiction more? Could be societal trends, genre perceptions, or program reputation. 

  A solution might focus on recruitment and information sharing. Encourage more men to apply to fiction and women to nonfiction. Adjust outreach without lowering standards. This addresses the imbalance without altering admissions fairness.

  Also, consider long-term effects. If women are steered toward less competitive tracks, does that affect their careers? But that's beyond admissions. The memo should stay actionable.

  Structure the memo: present data neutrally, acknowledge both views, then recommend targeted recruitment. Emphasize that per-track rates show fair evaluation, so intervention should be pre-application. This satisfies the per-track side by upholding current methods, and addresses the aggregate side by tackling the root cause.

  Avoid statistical jargon. Keep it clear for all committee members. End with a call to vote, stressing unity in improving access, not questioning integrity.
answer: |-
  ## Memorandum: MFA Admissions Gender Disparity Analysis & Path Forward

  **To:** MFA Admissions Committee  
  **From:** [Your Name], Novelist & Committee Alum  
  **Date:** October 26, 2023  
  **Subject:** Resolution on Gender Disparity in Aggregate Admit Rates: Data, Interpretation, and Action  

  ### I. The Data: A Clear Picture
  Our five-year analysis reveals a consistent and significant pattern:  
  *   **Overall Admit Rate:** Women (22.5%) vs. Men (42.5%)  
  *   **Track-Specific Admit Rates:**  
      *   Fiction: Women (12%) vs. Men (10%)  
      *   Poetry: Women (32%) vs. Men (30%)  
      *   Nonfiction: Women (56%) vs. Men (54%)  
  *   **Application Distribution:**  
      *   Fiction: High applicant volume (esp. women), very low admit rates.  
      *   Nonfiction: Lower applicant volume (esp. women), high admit rates.  
      *   Poetry: Moderate volume and admit rates.  

  The core tension arises from the **aggregate disparity** (22.5% vs. 42.5%) contrasting with the **track-level parity** (women slightly outperform men in every single track).

  ### II. Committee Perspectives: Understanding the Divide
  *   **View A (Focus on Aggregate Gap):** "A near 20-point difference in overall admission rates between genders is inherently inequitable and demands intervention at the admissions level. This outcome suggests systemic bias affecting women's overall success, regardless of track performance. We risk deterring talented female applicants if this imbalance persists."  
  *   **View B (Focus on Track-Level Data):** "The track-specific rates demonstrate our process evaluates applicants fairly *within each genre*. The aggregate gap is solely an artifact of application patterns – women disproportionately applying to our most competitive track (Fiction). Correcting for this *within admissions* would require introducing bias against male fiction applicants or for female nonfiction applicants, undermining our merit-based evaluation."

  **Both perspectives are grounded in valid concerns:** View A rightly highlights a significant outcome disparity needing attention. View B rightly defends the integrity of our track-specific evaluations, which show no bias against women.

  ### III. Analysis: The Root of the Disparity
  The data unequivocally shows:  
  1.  **Evaluation is Track-Fair:** Women are not disadvantaged *during assessment* in any track; they are slightly advantaged.  
  2.  **Application Strategy Drives the Gap:** The aggregate disparity stems entirely from the **distribution of applications across tracks with vastly different selectivity**:  
      *   Women apply heavily to Fiction (12% admit rate).  
      *   Men apply more evenly, with a significantly larger proportion applying to Nonfiction (54% admit rate) and Poetry (30% admit rate) relative to Fiction.  
  3.  **Intervening at Admissions Would Create Inequity:** Artificially manipulating track-level decisions to close the aggregate gap would mean either:  
      *   *Lowering standards for women applying to Fiction* (despite their already higher success rate there), or  
      *   *Raising standards for men applying to Nonfiction/Poetry*, or  
      *   *Rejecting qualified male Fiction applicants at higher rates to "make room."*  
      **All these options violate our core principle of evaluating applicants based on the merit of their writing within their chosen genre.**

  **Therefore, the aggregate disparity is a consequence of pre-application choices, not bias within our admissions process.**

  ### IV. Recommendation: Addressing the Gap at its Source
  **We recommend focusing intervention *upstream* of the admissions committee, not within its evaluation process.** Our goal should be to **influence application patterns** to better align applicant aspirations with realistic admission probabilities across tracks, thereby naturally reducing the aggregate gap while preserving merit-based evaluation.

  **Proposed Actions:**  
  1.  **Transparent Communication & Recruitment:**  
      *   **Revise Marketing Materials:** Prominently display historical track-specific admit rates (Fiction: ~11%, Poetry: ~31%, Nonfiction: ~55%) on the program website, brochures, and info sessions. Avoid gendered language implying genre associations.  
      *   **Targeted Outreach:** Develop specific messaging for prospective applicants (especially women) highlighting the opportunities and strengths of our Nonfiction and Poetry tracks. Feature successful alumnae from these tracks. Similarly, encourage strong male writers to confidently apply to Fiction.  
      *   **Pre-Application Advising:** Train admissions staff and faculty to discuss track selectivity openly with prospective applicants during inquiries and open houses, guiding them towards tracks where their work best fits *and* where their chances align with program capacity.  

  2.  **Track Choice Counseling:**  
      *   **Application Form Prompt:** Add an optional question: "Have you considered applying to more than one track? Briefly explain your primary track choice." This encourages reflection without pressure.  
      *   **Strengthen "Second Choice" Option:** Clearly explain how the "second choice" track option works and ensure those applications receive full consideration.  

  3.  **Monitor & Report:**  
      *   Track application distributions and overall/track-specific admit rates by gender annually.  
      *   Report this data transparently to the committee and program leadership.  
      *   Evaluate the impact of new recruitment strategies after 2-3 cycles.

  ### V. Conclusion & Call to Vote
  The track-level data provides strong evidence that our admissions process itself is not biased against women. However, the significant aggregate disparity is a serious concern reflecting how application patterns interact with track selectivity, potentially discouraging talented writers. **Addressing this requires changing the input (application patterns), not manipulating the output (admissions decisions within tracks).**

  This recommendation honors View B's defense of our evaluative fairness while directly addressing View A's valid concern about the overall outcome by implementing proactive, ethical measures aimed at the root cause. It strengthens our commitment to both equity and excellence.

  **We move to vote on the following resolution:**  
  *"The Admissions Committee adopts the upstream strategy of enhanced transparency, targeted recruitment, and application counseling focused on track selectivity, as outlined in Section IV, to address the gender disparity in aggregate admit rates, while affirming our commitment to merit-based evaluation within each track."*

  **Vote:** [ ] Yes [ ] No

  Let's move forward united in our goal to attract, evaluate, and admit the most promising writers fairly and effectively, regardless of gender or genre aspiration.
