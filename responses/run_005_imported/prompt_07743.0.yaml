prompt: |-
  I sit on the academic integrity board at my university, and we've got a case on the docket next month that's messier than the usual copy-paste plagiarism stuff, and it's kind of eating at me. A five-person senior capstone team submitted one joint final report under all five names, and it turns out the test data behind one section's conclusions was made up. Two of the five, Priya and Jordan, admit they fabricated it because the prototype kept failing bench tests and they'd run out of time before the deadline. Ana, the nominal team lead, didn't fabricate anything herself, but she signed the certification page attesting the results were accurate, and she's told us privately that she had a bad feeling about that section but didn't push it because she didn't want another fight with Priya and Jordan that week. Marcus joined the team three weeks before submission, replacing someone who dropped the course, and says he had no idea any of the data was fabricated. Sam actually flagged the weirdness in the team's group chat two months ago, was told to drop it, and did.

  The board is split down the middle. Half want to sanction the team as a unit — five names went on one document, they held themselves out as a team, so it's the team's failure that gets sanctioned, with individual circumstances treated as mitigation at most. The other half thinks that's basically a fiction: only individuals actually know things and decide things, so you can only punish people for what they personally knew or chose, and "the team failed" is just a loose way of describing five seperate stories stapled together. (I mentioned all this to a friend who does philosophy of action as a hobby, and she said "oh, that's just Bratman vs. Gilbert" and went back to her crossword, so thanks for nothing there.) What I actually need is the memo I can put in front of the board before we meet: a real recommendation for what happens to each of the five, not a menu of options, reasoned in a way the individual-responsibility camp could read and feel genuinely answered rather than steamrolled — and it needs a timeline, since final grades are due to the registrar in eleven days.
reasoning: |-
  Okay, the user is part of an academic integrity board dealing with a complex team plagiarism case. They need a reasoned recommendation memo that satisfies both "collective responsibility" and "individual responsibility" factions on the board. The case involves five students with varying levels of involvement in fabricating test data for a senior capstone project.

  First, I need to understand the key philosophical tension the user mentioned - Bratman vs Gilbert. Bratman focuses on individual intentions in shared actions, while Gilbert argues groups can have collective intentions beyond individuals. This explains the board's split. The solution must bridge these views.

  Looking at each student's role:
  - Priya and Jordan are clear violators who admitted fabricating data. They need the strongest sanctions.
  - Ana failed in her leadership role by ignoring red flags. Her attestation signature compounds this.
  - Sam actually tried to flag issues early but was silenced. Minimal culpability here.
  - Marcus joined late and had no reasonable way to verify past work. Punishing him seems unjust.

  The memo should reject both extreme positions: pure collective punishment ignores individual culpability, while pure individual focus ignores how team dynamics enabled the fraud. A hybrid approach makes sense - recognize the team submission as a collective act while assigning sanctions proportionate to individual roles.

  For practical considerations: 
  - University policy likely requires individual accountability
  - Grades are due in 11 days, so decisions must be timely
  - The recommendation should prevent future incidents through education

  The sanctions should escalate based on:
  1) Direct action (fabrication)
  2) Failure to prevent when able (leadership neglect)
  3) Attempted prevention (Sam)
  4) No reasonable involvement (Marcus)

  Also important: 
  - Require ethics training for all
  - Document this as a case study
  - Ensure consistency with past precedents
  - Avoid irreversible penalties like expulsion since this is a first offense for most

  The memo structure should:
  - State the hybrid philosophy upfront
  - Analyze each student's role
  - Recommend specific sanctions
  - Outline implementation timeline
  - Emphasize educational goals over pure punishment

  This balances fairness with practical academic governance needs while addressing the board's philosophical divide.
answer: |-
  ## Academic Integrity Board Recommendation Memo: Capstone Team Data Fabrication Case  

  **TO:** Academic Integrity Board Members  
  **FROM:** [Your Name/Position]  
  **DATE:** [Current Date]  
  **RE:** Recommended Sanctions for Capstone Team #X (Priya, Jordan, Ana, Marcus, Sam)  
  **DEADLINE AWARENESS:** Recommendations align with 11-day grading deadline.  

  ---

  ### **Philosophical Framework: Bridging Collective and Individual Responsibility**  
  We reject *both* "pure collective punishment" and "atomized individualism" as incomplete. Instead, we apply:  
  **The Hybrid Accountability Principle:**  
  > *"A team submission implies shared responsibility for verification of core claims, but sanctions must reflect (a) individual capacity to influence outcomes, (b) demonstrated intent/knowledge, and (c) proactive integrity efforts."*  

  This reconciles Bratman (focused on individual intentionality) and Gilbert (focused on joint commitment) by acknowledging:  
  - **Collective Dimension:** All members benefit from joint work and attest its validity (via signatures).  
  - **Individual Dimension:** Capacity to detect/prevent misconduct varies by role, access, and action.  
  Sanctions escalate based on **culpability + agency**.  

  ---

  ### **Recommended Sanctions per Student**  
  *(Summarized in table below; full rationale follows)*  

  | Student      | Role/Context                     | Sanction Recommendation                             | Culpability Basis                     |  
  |--------------|----------------------------------|-----------------------------------------------------|---------------------------------------|  
  | **Priya & Jordan** | Admitted fabricators; pressured team | **Failing grade** in capstone; 1-semester suspension; mandatory academic integrity remediation | Direct misconduct; deception of team/academy |  
  | **Ana**      | Team lead; signed certification  | **Failing grade** in capstone; probation; lead ethics workshop | Failure in supervisory role; ignored red flags |  
  | **Marcus**   | Joined late (3 wks pre-submit)   | **Grade reduction** (B → C); no further sanction    | No access/knowledge; reasonable reliance |  
  | **Sam**      | Flagged concerns early; silenced | **No sanction**; commend integrity effort in record | Proactive ethics attempt; no authority |  

  #### **Detailed Rationale**  
  1. **Priya & Jordan (Direct Misconduct):**  
     - **Culpability:** Admitted fabricating data due to "running out of time." This is deliberate fraud, not negligence.  
     - **Agency:** Controlled the data section; deceived teammates.  
     - **Sanction:**  
       - *Failing grade*: The core work is invalidated.  
       - *Suspension*: Proportional to severity; signals that fraud is unacceptable.  
       - *Remediation*: Required before re-enrollment (e.g., ethics module).  

  2. **Ana (Leadership Failure):**  
     - **Culpability:** Knew data was suspect but prioritized "avoiding conflict" over verification. As lead, her signature on certification is a formal warranty of validity.  
     - **Agency:** Had authority to audit work, delay submission, or escalate.  
     - **Sanction:**  
       - *Failing grade*: Shared responsibility for certified content.  
       - *Probation*: Reflects grave lapse in leadership duty.  
       - *Ethics workshop facilitation*: Turns experience into institutional learning.  

  3. **Marcus (Limited Involvement):**  
     - **Culpability:** Joined after fabrication occurred; no evidence he accessed/verified legacy data.  
     - **Agency:** Unreasonable to expect audit of weeks-old work in 3-week timeframe.  
     - **Sanction:**  
       - *Grade reduction* (B → C): Acknowledges team submission flaws but no personal misconduct.  
       - *No probation/suspension*: Punishing him for others' pre-existing fraud violates fairness.  

  4. **Sam (Proactive Ethics):**  
     - **Culpability:** Identified issues early; was overruled. No evidence of later complicity.  
     - **Agency:** Lacked authority to force investigation; escalation to faculty would have been ideal but not required.  
     - **Sanction:**  
       - *None*: Sanctioning Sam penalizes ethical behavior. Instead, commend their vigilance in their academic record.  

  ---

  ### **Implementation Timeline**  
  | Day | Action                                                                 | Responsible Party         |  
  |-----|------------------------------------------------------------------------|---------------------------|  
  | 1   | Board votes on recommendations                                         | AI Board                  |  
  | 2   | Draft outcome letters; schedule student meetings                      | AI Chair                  |  
  | 3–4 | Meet with students individually; deliver sanctions                     | AI Chair + Advisor        |  
  | 5   | Submit grade changes (F for Priya, Jordan, Ana; C for Marcus)         | Registrar Liaison         |  
  | 6–7 | Finalize suspension/probation paperwork; assign remediation           | Dean of Students Office  |  
  | 8–9 | Document commendation for Sam; file in academic record                | Department Chair          |  
  | 10  | Debrief with faculty advisor; anonymize case for future training      | AI Board + Faculty        |  

  ---

  ### **Why This Addresses Both Camps**  
  - **For Collective-Responsibility Advocates:** All students face consequences tied to the team’s failure (grade impacts), upholding the principle that joint submissions require shared vigilance.  
  - **For Individual-Responsibility Advocates:** Sanctions are *scaled* to knowledge, role, and action—no one is punished for what they couldn’t control. Sam’s exoneration and Marcus’s mitigated penalty demonstrate this.  
  - **Institutional Priority:** Prevents future fraud by:  
    - Punishing fabricators severely.  
    - Holding leaders accountable for certification.  
    - Rewarding ethical vigilance (Sam).  
    - Educating via remediation/workshops.  

  **Recommended Vote:** Approve tiered sanctions as above.  

  ---  
  **Signature:** ________________________  
  **[Your Name/Position]**
