answer: |-
  Here's a toast that threads the needle: poker humor for the table, heart for Grandma, and a gentle roast wrapped in respect. Aim for 3 minutes with pauses and smiles:

  **(Clink glass)**  
  "Alright everyone, settle in. For those who don't know me, I’m Dan’s best man, which basically means I’ve witnessed his… *unique* approach to life up close. And Alex, welcome to the adventure! Seriously, Dan’s lucky to have you – someone who can look at his spreadsheets and *not* immediately file for divorce."

  **(Pause for laughter. Turn slightly to include Grandma.)**  
  "Now, Grandma, you know Dan loves poker? Well, he doesn’t just play it; he *lives* it. He has this rule – the Kelly Criterion – which basically means: *Never bet the whole farm on one crop, even if the weatherman swears it’s sunny.* He sizes every bet – poker hands, investments, even how much ketchup to put on his fries – as a careful fraction of his ‘bankroll’. It’s all about avoiding ruin, managing risk, playing the long game. Sensible! Mostly."

  **(Turn back to the poker players, lean in conspiratorially)**  
  "His poker buddies get it. They’ve seen him agonize over whether to bet 12% or 13% of his stack on a river bluff. They understand the cold sweat of *variance*. To Dan, life is one long tournament where going all-in, even on a sure thing, is just *asking* for that one-in-a-million bad beat to knock you out eventually. It’s not hedging, he’d say… it’s *optimal*."

  **(Gesture towards Alex with a smile)**  
  "Enter Alex. Alex operates on a different, gloriously simple principle: *If the odds are good, you go for it. Full stop.* Positive Expected Value? ALL IN. See an opportunity? TAKE IT. Waiting around calculating fractions? That, to Alex, is… well, let’s just say ‘maddening’ is a polite term. She sees the upside; Dan sees the potential downside tail. She charges ahead; he calculates the optimal path. It’s… a dynamic!"

  **(Lighthearted tone)**  
  "And Dan? He’s decided their *actual* life decisions – like where to live, or whose job gets priority – need a system too. Forget just splitting the difference! Oh no. Now it’s ‘Nash Bargaining Solutions’ and maximizing the… *geometric mean*? Apparently, it’s like finding the compromise where both sides *multiply* their happiness, not just add it. Honestly, I think he just discovered it gets him out of arguments faster than saying ‘Yes, dear.’ Smart move, Dan. Very… *optimal*."

  **(Shift tone slightly warmer, more sincere)**  
  "But here’s the beautiful thing, the reason this works. Alex, you don’t just *tolerate* Dan’s spreadsheets and fractional bets; you challenge them. You remind him that sometimes, the biggest risk is *not* taking the chance. And Dan, your careful calculations? They’ve probably saved Alex from a few truly spectacular implosions. She brings the bold vision; you bring the sustainable plan. She sees the mountain peak; you plot the safest, most efficient path up."

  **(Build to the finish)**  
  "So, what happens when the master of calculated fractions meets the queen of positive EV? When Kelly Criterion collides with ‘Full Send’? You get this amazing partnership. They balance each other. Alex pushes Dan beyond his comfort zone, and Dan ensures Alex’s bold leaps have a safety net woven from pure, unadulterated math."

  **(Raise glass, look between them)**  
  "Dan, for your whole life, it’s been you against the variance. Calculating your bets, managing your bankroll, playing the infinite long game solo. But today… **today, that changes.**"

  **(Pause, significant look)**  
  "**Because marriage, Dan, isn’t a one-man bankroll anymore. It’s not just *your* variance to manage. It’s a partnership. It’s a *cooperative* game. A two-player game with shared stakes, shared risks, and infinitely shared rewards.**"

  **(Final flourish, warm smile)**  
  "So here’s to Dan and Alex! May your combined Expected Value always be sky-high. May your geometric mean of happiness grow exponentially. And may your greatest shared bet – this marriage – pay off forever. To the happy couple!"

  **Why it works:**

  1.  **Poker Humor:** "Fraction of bankroll," "variance," "one-in-a-million bad beat," "optimal," "12% or 13%" – these land solidly with the poker buddies. The Kelly Criterion and geometric mean are named and explained simply.
  2.  **Grandma-Friendly:** Explanations like "never bet the whole farm," "spreadsheets," "managing risk," "sensible," "positive Expected Value = ALL IN," "charges ahead," "spreadsheets and fractional bets," "safety net," "shared stakes" – all translate the concepts into everyday language. The core conflict (cautious vs. bold) is universal.
  3.  **Roasting Dan (Gently):** The ketchup, the Nash bargaining for arguments, the "optimal" escape hatch – it's funny because it's recognizable to those who know him, but framed affectionately.
  4.  **Respecting Alex:** She's portrayed positively as the bold counterbalance, the challenger, the one who sees opportunity. "Queen of positive EV" and "Full Send" are compliments in this context.
  5.  **The Heart:** The shift to "balance each other" and the "amazing partnership" is sincere. Highlighting their complementary strengths ("bold vision" vs. "sustainable plan," "mountain peak" vs. "safe path") shows why the tension works.
  6.  **The Payoff Line:** "Marriage... turns into a two-player game" lands perfectly. It reframes Dan's entire philosophy in the context of partnership. "Shared stakes, shared risks, shared rewards" is the emotional core and makes the poker analogy meaningful for marriage. "Cooperative game" is the perfect final poker/math nod.
  7.  **The Final Toast:** Ties the math/poker metaphors ("Combined EV," "Geometric Mean") back into warm wishes for their marriage.

  **Delivery Tips:**

  *   **Pacing:** Don't rush. Pause after punchlines ("maddening," "optimal," "smart move Dan").
  *   **Eye Contact:** Shift between poker buddies (for the jargon bits), Grandma (during simple explanations), and Dan & Alex (especially during the heartfelt parts and the final line).
  *   **Tone:** Start light and humorous, shift to warm and sincere for the balance paragraph and the payoff.
  *   **Gesture:** Use open hands when explaining concepts to Grandma. A slight lean-in for the poker buddy bits. A clear gesture encompassing both Dan and Alex for the "two-player game" line.
  *   **Smile!** It's a celebration. The humor comes from affection.

  This toast acknowledges the real tension, makes it funny and relatable to both audiences, and ultimately uses the poker/math framework to celebrate the *strength* of their partnership. Good luck!
