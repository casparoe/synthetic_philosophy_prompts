  My friend Dan is a professional poker player who's turned the Kelly criterion into a personality trait — he sizes every bet in his life, not just the ones at the table, to some fraction of his 'bankroll' because going all-in on a good bet still means real risk of ruin eventually. He's marrying Alex in a few weeks, who's the opposite: if the EV's positive she takes the bet, full stop, and finds his hedging kind of maddening. Worse, Dan's started insisting they settle actual disagreements (where to live, whose job takes priority) using the geometric mean instead of just splitting the difference, some Nash bargaining thing that apparently gets him out of alot of arguments. I'm best man and want to build a short toast (3ish minutes) around this real tension instead of dodging it, ending somewhere like 'marriage is the moment his one-guy-against-variance philosophy turns into a two-player game.' Can you write it so it's actually funny for his poker buddies but still makes sense to my grandma?
