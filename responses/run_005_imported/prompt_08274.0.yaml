prompt: |-
  I spent about 35 years as an experimental physicist, and now that I'm retired I've been teaching myself philosophy, currently down a rabbit hole on voting and collective decision-making. Reading about the Condorcet Jury Theorem got me thinking about the lab: we'd never average a precise reading together with a couple of sloppy ones without weighting for precision, or the sloppy ones just add noise. So I'm suspicious of the usual takeaway people draw from the theorem, that stacking on more independent, better-than-chance voters can only help (or at least never hurt) accuracy. Could you build me a small, concrete example - real probabilities, say 3 jurors - where each juror is independent and individually still more likely right than wrong, but a plain unweighted majority vote of all three ends up LESS reliable than just going with the most competent juror alone? I want to see the actual numbers work out, not just be told its possible.
reasoning: |-
  We are going to set up a scenario with 3 jurors. Let their individual competences (probabilities of being correct) be p1, p2, p3, each greater than 0.5. We want to show that the majority vote of all three can be less reliable than just relying on the best juror alone.

   We assume that the jurors are independent and that there are two possible outcomes: correct (say, 1) or incorrect (0). The majority vote will be correct if at least two of the three are correct.

   However, note that the majority vote might be worse than the best juror. We can set up:

     Let p1 be the best juror (highest competence), say p1 = 0.9.
     We want to choose p2 and p3 such that they are both above 0.5 (say, 0.6 and 0.6) but the majority vote of the three is less than 0.9.

   How to compute the majority vote probability?

     P(majority correct) = P(exactly 2 correct) + P(all 3 correct)

     = [p1 * p2 * (1-p3) + p1 * (1-p2) * p3 + (1-p1) * p2 * p3] + [p1 * p2 * p3]

     = p1 p2 (1-p3) + p1 p3 (1-p2) + p2 p3 (1-p1) + p1 p2 p3

     = p1 p2 + p1 p3 + p2 p3 - 2 p1 p2 p3

   Now, we want this to be less than p1 (which is 0.9).

   Let's set:
     p1 = 0.9
     p2 = 0.6
     p3 = 0.6

   Then:
     P(majority) = (0.9*0.6) + (0.9*0.6) + (0.6*0.6) - 2*(0.9*0.6*0.6)
                 = 0.54 + 0.54 + 0.36 - 2*(0.324)
                 = 1.44 - 0.648
                 = 0.792

   Since 0.792 < 0.9, we see that the majority vote (0.792) is less reliable than the best juror (0.9).

   But note: we assumed that the best juror is 0.9 and the others are 0.6. We must check that each juror is more likely right than wrong (which they are: 0.9>0.5, 0.6>0.5) and independent.

   Therefore, the example works.

   However, let me write it out explicitly:

     Juror 1: correct with probability 0.9
     Juror 2: correct with probability 0.6
     Juror 3: correct with probability 0.6

     We compare:
       Option A: Rely solely on Juror 1 -> correct with probability 0.9.
       Option B: Take a majority vote of all three.

     The majority vote is correct with probability 0.792.

     Therefore, the majority vote is less reliable.

   We can also check by computing the probability of being wrong by majority:

     P(majority wrong) = 1 - P(majority correct) = 1 - 0.792 = 0.208

     Alternatively, we can compute:
       P(majority wrong) = P(exactly 2 wrong) + P(all 3 wrong)

       = [p1_w * p2_w * p3_c + p1_w * p2_c * p3_w + p1_c * p2_w * p3_w] + [p1_w * p2_w * p3_w]

       where p1_w = 0.1, p2_w = 0.4, p3_w = 0.4, and p1_c = 0.9, p2_c = 0.6, p3_c = 0.6.

       But we already have the majority correct, so we don't need to.

   Let me write the exact cases for majority correct:

     Case 1: All three correct: 0.9 * 0.6 * 0.6 = 0.324
     Case 2: Juror1 and Juror2 correct, Juror3 wrong: 0.9 * 0.6 * (1-0.6) = 0.9*0.6*0.4 = 0.216
     Case 3: Juror1 and Juror3 correct, Juror2 wrong: 0.9 * (1-0.6) * 0.6 = 0.9*0.4*0.6 = 0.216
     Case 4: Juror2 and Juror3 correct, Juror1 wrong: (1-0.9)*0.6*0.6 = 0.1*0.6*0.6 = 0.036

     So total P(majority correct) = 0.324 + 0.216 + 0.216 + 0.036 = 0.792

     And P(majority wrong) = 
          All three wrong: 0.1 * 0.4 * 0.4 = 0.016
          Exactly two wrong: 
              Juror1 wrong, Juror2 wrong, Juror3 correct: 0.1 * 0.4 * 0.6 = 0.024
              Juror1 wrong, Juror2 correct, Juror3 wrong: 0.1 * 0.6 * 0.4 = 0.024
              Juror1 correct, Juror2 wrong, Juror3 wrong: 0.9 * 0.4 * 0.4 = 0.144

          So total P(majority wrong) = 0.016 + 0.024 + 0.024 + 0.144 = 0.208

     (And indeed, 1 - 0.792 = 0.208)

   Therefore, we have a concrete example.

   But note: The Condorcet Jury Theorem assumes homogeneous competence. In our case, we broke homogeneity. The theorem does not hold when the voters have varying competence. And in fact, we see that adding less competent voters can harm the group's accuracy.

   We can try to make it even more extreme:

     p1 = 0.99, p2 = 0.51, p3 = 0.51

     P(majority) = (0.99*0.51) + (0.99*0.51) + (0.51*0.51) - 2*(0.99*0.51*0.51)
                 = 0.5049 + 0.5049 + 0.2601 - 2*(0.99*0.51*0.51)
                 = 1.2699 - 2*(0.257499)
                 = 1.2699 - 0.514998
                 = 0.754902

     This is even worse: 0.7549 < 0.99.

     So the majority vote is only about 75.5% accurate, while the best juror is 99% accurate.

   Therefore, the example holds.

   We have built a concrete example with 3 jurors:

     Juror 1: 0.9
     Juror 2: 0.6
     Juror 3: 0.6

     Majority vote accuracy: 0.792

     So the majority vote is worse than just using the best juror (0.9).

   This illustrates that adding independent, but less competent, jurors can sometimes reduce the overall accuracy when using unweighted majority voting.
answer: |-
  Below is a concrete example with three independent jurors, each individually more likely to be correct than not (competence > 0.5), where an unweighted majority vote is **less reliable** than relying solely on the most competent juror. We'll use explicit probabilities and calculate all outcomes step-by-step.

  ### Setup:
  - **Juror 1**: Competence = 0.90 (most competent)  
  - **Juror 2**: Competence = 0.60  
  - **Juror 3**: Competence = 0.60  
  - **Assumption**: Jurors are independent, and the correct answer is binary (e.g., "true" or "false").  

  ---

  ### Reliability of the Best Juror Alone
  - If we rely **only on Juror 1**:  
    Probability of correct decision = **0.90**.

  ---

  ### Reliability of Majority Vote (2/3 jurors correct)
  We calculate the probability that at least 2 jurors are correct:  
  `P(majority correct) = P(all 3 correct) + P(only Juror 1 and 2 correct) + P(only Juror 1 and 3 correct) + P(only Juror 2 and 3 correct)`  

  1. **All 3 correct**:  
     `P = (0.90) × (0.60) × (0.60) = 0.324`  

  2. **Only Juror 1 and 2 correct (Juror 3 wrong)**:  
     `P = (0.90) × (0.60) × (1 - 0.60) = 0.90 × 0.60 × 0.40 = 0.216`  

  3. **Only Juror 1 and 3 correct (Juror 2 wrong)**:  
     `P = (0.90) × (1 - 0.60) × (0.60) = 0.90 × 0.40 × 0.60 = 0.216`  

  4. **Only Juror 2 and 3 correct (Juror 1 wrong)**:  
     `P = (1 - 0.90) × (0.60) × (0.60) = 0.10 × 0.60 × 0.60 = 0.036`  

  **Total `P(majority correct)`**:  
  `0.324 + 0.216 + 0.216 + 0.036 = 0.792`  

  ---

  ### Result Comparison
  - **Best juror alone**: Correct with probability **0.900** (90%).  
  - **Majority vote of all three**: Correct with probability **0.792** (79.2%).  

  ### Conclusion
  The majority vote (**79.2%**) is **less reliable** than using only the best juror (**90.0%**), even though all jurors are independent and individually competent (>50%).  

  ---

  ### Why This Happens
  - The two less competent jurors (60% each) introduce **significant noise** when their votes are averaged equally with the highly competent juror (90%).  
  - Majority voting fails to account for the **disparity in competence**—weighting all votes equally allows the weaker jurors to "outvote" the stronger one in cases where the strongest juror is correct but the other two are not.  
  - This violates the intuition from the Condorcet Jury Theorem (which assumes homogeneous competence) and mirrors your lab experience: averaging precise and imprecise measurements without weighting reduces accuracy.  

  ---

  ### Verification Table
  All possible voting outcomes (8 scenarios), with the majority vote result:

  | Juror 1 | Juror 2 | Juror 3 | Majority Correct? | Probability                         |
  |---------|---------|---------|-------------------|-------------------------------------|
  | Correct | Correct | Correct | **Yes**           | 0.90 × 0.60 × 0.60 = **0.324**     |
  | Correct | Correct | Wrong   | **Yes**           | 0.90 × 0.60 × 0.40 = **0.216**     |
  | Correct | Wrong   | Correct | **Yes**           | 0.90 × 0.40 × 0.60 = **0.216**     |
  | Correct | Wrong   | Wrong   | No                | 0.90 × 0.40 × 0.40 = 0.144         |
  | Wrong   | Correct | Correct | **Yes**           | 0.10 × 0.60 × 0.60 = **0.036**     |
  | Wrong   | Correct | Wrong   | No                | 0.10 × 0.60 × 0.40 = 0.024         |
  | Wrong   | Wrong   | Correct | No                | 0.10 × 0.40 × 0.60 = 0.024         |
  | Wrong   | Wrong   | Wrong   | No                | 0.10 × 0.40 × 0.40 = 0.016         |

  **Sum of "Yes" probabilities**:  
  `0.324 + 0.216 + 0.216 + 0.036 = 0.792` (matches our calculation).  

  This example demonstrates that adding independent, competent-but-weaker voters can **decrease group accuracy** when using unweighted majority voting. Weighting votes by competence (e.g., giving Juror 1 more influence) would mitigate this issue.
