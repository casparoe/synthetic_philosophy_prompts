  Ok so I'm about three drafts deep into a novel with a subplot about a neuroscientist character, Mireille, who's a true believer in Integrated Information Theory — the type who brings up "phi" at dinner parties the way other people bring up their astrology sign. I want a scene where her brother-in-law Denny, a grumpy retired logician who thinks the whole theory is numerology with extra steps, gets her back with an actual joke at Thanksgiving. Problem is, I've been reading around on IIT for research (some of Tononi's papers, a bit of that Aaronson blog stuff about the expander-graph thing where a dumb grid of logic gates supposedly comes out "more conscious" than an actual brain) and I understand it just enough to know that most of the jokes I've tried writing myself don't really work — they're either wierdly wrong about what the theory actually says, or they're just generic "haha philosophers" jokes that could apply to literally any theory of consciousness.

