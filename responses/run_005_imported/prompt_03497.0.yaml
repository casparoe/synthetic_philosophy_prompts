answer: |-
  Let's break down Hume's notoriously dense argument step-by-step, addressing your questions directly. Hume's core claim is that promises *cannot* create genuine moral obligations through any *natural* "act of the mind" alone – obligation requires social convention.

  ### 1. Reconstructing Hume's Negative Argument & Positive Claim
  Hume systematically eliminates possible mental acts as the source of a promise's *obligating* force:

  *   **Against "Resolution" (Intention):**  
      *   **What it is:** Deciding ("I resolve to help you tomorrow").
      *   **Why it fails:** Resolutions lack *normative force*. You can freely abandon a resolution without moral blame. Feeling you *should* keep it is the *obligation itself*, not the resolution causing it. Resolving to do X doesn't inherently make failing to do X morally wrong.

  *   **Against "Desire":**  
      *   **What it is:** Wanting to perform the action ("I desire to help you").
      *   **Why it fails:** Obligation persists *even without desire*. You can promise something you actively *don't* want to do (e.g., pay a debt you resent) and still feel obligated. The feeling of "I *must*" is distinct from "I *want to*".

  *   **Against "Willing the Promised Action":**  
      *   **What it is:** An act of volition directed at the specific future action ("I will help you tomorrow").
      *   **Why it fails:** The will only governs *present* actions. I can will *now* to *sign a contract* or *say words*, but I cannot directly will *tomorrow's action* to happen *now*. The future action itself isn't present to be willed. Willing a future act is just another resolution or desire, already ruled out.

  **Hume's Positive Claim:** Having eliminated resolutions, desires, and willing the future action, Hume argues the *only* mental act left that could *create* the obligation is:
  *   **"Willing the Obligation Itself":** A unique mental act where we directly will *into existence* the feeling of being bound ("I will that I be obligated to help you tomorrow"). This aligns with common language ("bound by our own consent," "obligation arises from our mere will").

  ### 2. The "Manifest Absurdity" & the Role of Sentiments
  Hume now argues that this "willing of the obligation itself" is impossible and absurd. His argument hinges entirely on his **sentimentalist moral psychology**:

  *   **Premise 1: Morality is Sentiment-Based:** Obligations (moral duties) *are* specific kinds of feelings (sentiments). When an action or mental quality pleases us in a certain disinterested way, we call it virtuous. When the *failure* to perform an action displeases us similarly, we say there's an obligation to perform it.
  *   **Premise 2: Sentiments are Passive & Involuntary:** We cannot directly change our sentiments (feelings of pleasure/disapproval) by a simple act of will. You cannot *decide* to find broccoli delicious if you hate it. Similarly, you cannot *decide* to feel morally pained by *not* doing X if you currently feel indifferent or even positive about *not* doing X. Sentiments arise naturally from our constitution and circumstances.
  *   **The Argument:**
      1.  Obligation *is* a sentiment (a feeling of moral discomfort/pain at the thought of non-performance).
      2.  Creating a *new* obligation requires creating a *new* sentiment where none existed before.
      3.  We cannot create new sentiments (feelings of moral pleasure/pain) by a single act of will ("I will feel obligated").
      4.  Therefore, willing a *new obligation* (a new sentiment) into existence by a promise is **absurd** – it's like willing the sky to turn green or willing yourself to enjoy the taste of ash. It's attempting the impossible through sheer fiat.
      5.  **The Absurdity:** It supposes we have a magical power to alter our fundamental moral feelings (approval/disapproval) instantaneously and arbitrarily by saying "I promise." Hume finds this notion nonsensical based on how human psychology actually works.

  **Conclusion:** Since the only candidate mental act ("willing the obligation") is impossible/absurd, and the other candidates fail, there is *no natural act of the mind* that constitutes a promise and creates obligation. Promises, as obligation-generating acts, are "naturally unintelligible."

  ### 3. Assessment: Does Hume Earn His Conclusion?

  Hume's argument is powerful and internally consistent *if you accept his core premises*, particularly his **sentimentalist meta-ethics**. Whether it definitively proves promises are unintelligible prior to convention depends on whether one rejects these premises:

  *   **Strengths:**
      *   **Internal Logic:** The negative argument against resolution/desire/willing the action is very strong. We *do* experience obligation independently of current desire or intention.
      *   **Sentimentalist Plausibility:** His point about the involuntariness of core sentiments rings true. We cannot simply *decide* to feel morally bound if we genuinely don't feel it. The feeling of obligation *does* feel like something that happens *to* us, not something we directly create by fiat.
      *   **Exposes a Problem:** He successfully shows that "I promise" isn't just describing a future action or a current desire/intention. It claims to *do* something special (create a bond/duty) that needs explanation.

  *   **Weaknesses & Premises a Naturalist Could Reject:**
      *   **Premise 1: Morality = Sentiment:** This is the bedrock. A rationalist (like Kant) would argue obligation stems from *reason* recognizing a universal moral law or duty, not sentiment. If obligation is a dictate of reason, then "willing the obligation" could be understood as *committing oneself to a rational principle* ("I hereby bind myself to the moral law requiring promise-keeping"). This act of commitment *could* be seen as intelligible and binding naturally, through reason alone. Hume simply dismisses this possibility as "prejudice" or "fallacious language."
      *   **Premise 2: Sentiments are Unchangeable by Will:** While we can't *directly* flip a sentiment switch, our actions and commitments *do* shape our sentiments *over time*. A naturalist might argue that the *act* of promising (a performative speech act) *initiates a process* that naturally *causes* the sentiment of obligation to arise – perhaps through activating innate social instincts, triggering expectations of reciprocity, or engaging rational faculties. Hume assumes the sentiment must be created *instantaneously* by the sheer will, ignoring a potential causal chain initiated by the promise.
      *   **The Nature of "Willing the Obligation":** Hume might be mischaracterizing the opponent. Perhaps "willing the obligation" isn't willing a *feeling*, but willing *to be held accountable*, or willing *to enter a normative relationship*. This might be less absurd on other meta-ethical views.
      *   **Conflation of Origin and Feeling?:** Hume seems to conflate the *origin* of the obligation with the *feeling* of the obligation. A naturalist could argue the obligation *exists* (due to reason, divine law, natural law) independently of the sentiment, and the sentiment is merely our *perception* or *response* to that existing obligation. Promising might *invoke* this pre-existing obligation structure rather than creating a new sentiment ex nihilo. Hume assumes the sentiment *is* the obligation.

  **Conclusion on Earning It:** Hume's argument **successfully demonstrates the difficulty** of grounding promissory obligation in a *simple, natural, pre-social act of individual will or mind*, given his sentimentalist framework. He powerfully exposes the puzzle. **However, he does not definitively prove promises are "naturally unintelligible" *simpliciter*.** The argument crucially **relies on the premise that moral properties (obligation) are *only* sentiments and that sentiments cannot be directly willed.** A philosopher who grounds obligation in reason, divine command, natural law, or even a more complex natural social instinct could reject this premise and offer a competing account where promising *is* naturally intelligible as creating obligation. Hume's argument earns its conclusion *relative to his own sentimentalist system*, but it doesn't *force* someone with different foundational meta-ethical commitments to accept that conclusion. His later solution – that promissory obligation arises *artificially* through social convention and the utility of enforcing agreements – is his positive account, acknowledging that the "natural" explanation fails.
