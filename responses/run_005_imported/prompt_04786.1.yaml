  Here’s a eulogy that honors Uncle Dave’s complexity – his fierce generosity and his rigorous doubt – without turning the service into a philosophy lecture. It’s structured to resonate with both audiences, clocking in at just under 5 minutes when read aloud at a moderate pace:

  **(Begin calmly, with warmth)**

  "Good morning, everyone. For those who don’t know me, I’m [Your Name], Dave’s niece/nephew. Standing here feels… strange. Dave was the guy who’d corner you at a family barbecue to passionately explain why *this* mosquito net charity was better than *that* one, all while flipping burgers. He was intense, he was brilliant, and he cared more deeply about helping people he’d never meet than anyone I’ve ever known.

  **(Anchor in the generosity everyone saw - with a 'Dave' detail)**

  We all know about his generosity. Forty percent. For *twenty years*. That’s not just writing a check; that’s a lifetime commitment etched into spreadsheets – yes, spreadsheets with tabs that could make your head spin, tabs with names that were pure Dave. He didn’t just give; he gave *deliberately*. He wanted every dollar to stretch as far as humanly possible, to save lives, to lift people out of poverty. He argued with my dad at Christmas about whether an Xbox was justifiable when the same money could buy malaria nets! That was Dave. Uncompromising in his belief that we could, and should, do better with what we have. He believed in proof, in evidence, in making that generosity *count*.

  **(Introduce the doubt as a strength, a mark of his character, not a failure)**

  But what made Dave truly remarkable wasn’t just the strength of his conviction. It was the strength of his *honesty* – especially with himself. See, Dave wasn’t satisfied with easy answers. He lived in the details, in the long view. And anyone who digs that deep, who looks that far ahead… they start to see how incredibly vast and tangled the consequences of *any* action can be. They see how the ripple effects of even the best-intentioned help can spread out over decades, across generations, in ways no spreadsheet, no matter how brilliant, can fully predict or neatly sum up.

  **(Frame the persistence as the core of his legacy - the key point)**

  That uncertainty? That profound awareness of how complex the world truly is? It didn’t paralyze him. It didn’t make him cynical. **That’s what I want us to remember most about Dave.** He wrestled with those big, hard questions. He knew the numbers on his beloved spreadsheet told an important story, but maybe not the *whole* story. He understood that certainty about the ultimate impact of his giving was, perhaps, the one thing his spreadsheet couldn't guarantee. And yet… he kept giving. Forty percent. Deliberately. Rigorously.

  **(Connect the doubt and the action to his character)**

  He didn’t keep giving because he’d found some new, foolproof calculation. He kept giving because *it was the right thing to do*, as best he could see it. Because even amidst that profound understanding of complexity, his fundamental commitment – to try, to help, to lessen suffering in the world – never wavered. His generosity wasn't diminished by his doubts; it was *deepened* by them. It became an act of courage. It became generosity *plus* intellectual humility. Generosity *despite* the universe’s confounding complexity. He acted on his values, not because the path was perfectly clear, but because the need was undeniable, and trying was the only decent choice he saw.

  **(Bring it home - personal & universal)**

  To me, that was the essence of Uncle Dave. He was the guy who’d sit patiently with a nerdy teenager and explain effective altruism like it was the most thrilling adventure. He taught me that caring deeply requires both passion *and* thoughtfulness. That doing good isn't about having perfect answers, but about asking the hard questions and *still showing up*. He showed me that true integrity lies in facing the vast unknown, acknowledging it fully, and choosing to act with kindness and conviction anyway.

  **(Conclude with warmth and resonance)**

  So, yes, we remember Dave’s incredible generosity. It mattered. Deeply. But let’s also remember the man behind it: fiercely intelligent, rigorously honest, humble enough to doubt his own certainties, and brave enough to keep building a better world with his actions, even from that place of doubt. That combination – that unwavering heart meeting that questioning mind – that was our Dave. We’ll miss his arguments, his spreadsheets, his intensity, and his profound, persistent kindness. Thank you, Dave, for teaching us how to care, and how to keep caring, even when the path isn't perfectly clear."

  **Why this works:**

  1.  **Honors Generosity First:** Starts with what everyone knew and loved, grounding it in specific, "Dave-ish" details (spreadsheets, Christmas argument).
  2.  **Normalizes the Doubt:** Frames the uncertainty not as a failure or niche philosophy, but as a natural consequence of his deep thoughtfulness and intellectual honesty – qualities everyone can respect.
  3.  **Avoids Jargon:** No "cluelessness," no "QALYs," no "longtermism." Uses accessible language: "vast and tangled consequences," "ripple effects," "profound awareness of complexity," "uncertainty," "confounding complexity."
  4.  **Makes the Point for EA Friends:** Clearly states he knew the spreadsheet didn't tell the whole story, that certainty was elusive, and *that this awareness was present*. They'll hear the reference to the core dilemma without needing the term.
  5.  **Elevates the Persistence:** Positions continuing to give *amidst* this doubt as his most admirable quality – his courage and unwavering commitment. This is the key takeaway you want both audiences to have.
  6.  **Connects to Character:** Links the doubt and the action directly to his integrity, humility, and bravery – universal virtues.
  7.  **Personal Touch:** Includes your specific relationship ("sit patiently with a nerdy teenager").
  8.  **Concludes Warmly:** Brings it back to missing *him* – his whole, complex self – and ends on gratitude.
  9.  **Respectful Tone:** Maintains a warm, respectful, slightly affectionate tone appropriate for a funeral, focusing on celebration of character.

  This eulogy lets Grandma hear "He was generous and it mattered," lets his EA friends hear "He deeply understood the limits of calculability and acted with integrity anyway," and lets everyone remember Dave as the complex, passionate, deeply principled man he was. Good luck on Saturday. He'd be proud of you for getting him right.
