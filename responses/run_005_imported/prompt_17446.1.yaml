  3. Gorbachev and the USSR: Structural issues like economic stagnation, political corruption, and nationalist movements might have caused collapse regardless of who was in charge.
  4. Cuban Missile Crisis: The decisions made by Kennedy and Khrushchev were crucial. If different leaders were in place, miscommunication could have led to nuclear war. This seems highly contingent.

  Now, adding more hinge points:
  - Fall of Constantinople (1453): Was the Ottoman Empire's rise inevitable due to Byzantine weakness, or could different tactics have saved the city?
  - American Revolution: Colonial discontent and British policies made rebellion likely, but specific events like Lexington and Concord were triggers.
  - Archduke's assassination: Covered above.
