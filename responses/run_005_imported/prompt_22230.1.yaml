  Additionally, the historical context is important. In the 1770s, mercantilist ideas were prevalent, so even well-read merchants might cling to them. Laidlaw's resistance to French luxuries could stem from patriotism, which Hume might critique. Highlighting this tension between economic theory and national pride could enrich the scene. The partner could challenge Laidlaw by pointing out Hume's advocacy for free trade and the benefits of imports.

