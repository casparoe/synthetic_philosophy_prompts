answer: |-
  ## MEMORANDUM  
  **TO:** Committee on Elections Delegates  
  **FROM:** Committee Chair  
  **SUBJECT:** Critical Analysis of SB-102 (Lowering Municipal Voting Age) & Amendment 1 (Demeny Voting)  
  **DATE:** October 26, 2023  

  **I. The Core Challenge: Moving Beyond "Maturity" to the Boundary Problem**  
  The debate on SB-102 (lowering the municipal voting age to 16) risks stalling on subjective claims about whether 16-year-olds are "mature enough" to vote. This framing overlooks the deeper **boundary problem** in democratic theory: **What principle justifies excluding *anyone* from the franchise?**  

  Two dominant principles are relevant:  
  1.  **The All-Affected-Interests Principle:** Anyone significantly affected by political decisions should have a vote.  
  2.  **The Subject-to-Coercion Principle:** Anyone subject to the binding laws of a community should have a say in making them.  

  **Crucially, *both* principles apply robustly to individuals younger than 16:**  
  *   A 14-year-old is profoundly affected by municipal decisions on school funding, parks, public transit, and zoning.  
  *   A 12-year-old is equally subject to municipal ordinances (e.g., curfews, loitering laws, park rules) as a 16-year-old or an adult.  

  **Therefore, an age-based voting cutoff *requires* a further justification beyond these foundational principles.** SB-102 proposes moving the line to 16. The status quo is 18. Amendment 1 (Demeny Voting) proposes an alternative structure. We must evaluate the *reasons* for drawing the line *somewhere* and the merits of each proposal.  

  **II. Evaluating the Case for Maintaining Age 18**  
  The strongest case for keeping the voting age at 18 deserves serious consideration:  

  *   **Full Legal Responsibility & Agency:** Age 18 marks the near-universal threshold in U.S. law for assuming full legal adulthood. This includes:  
      *   **Contractual Autonomy:** Signing binding contracts (leases, loans).  
      *   **Legal Liability:** Full civil and criminal responsibility (e.g., tried as an adult, sued directly).  
      *   **Independent Status:** Ability to marry without parental consent, join the military, serve on juries, and make independent medical decisions.  
  *   **Administrative Clarity & Symbolic Cohesion:** Age 18 aligns voting with this established, widely recognized threshold of comprehensive legal independence. It avoids creating a complex patchwork of voting ages for different offices. The argument is that the franchise should accompany the *full bundle* of adult rights and responsibilities.  
  *   **Protection Against Arbitrary Exclusion:** Setting the line lower than 18 risks arbitrariness. Why 16 and not 15 or 14? If "affected interests" or "subject to coercion" are the *only* criteria, the logical conclusion could be universal suffrage regardless of age. Age 18 provides a clear, defensible, and consistent benchmark tied to a broader societal understanding of adulthood.  

  **The core defense of 18 is not that 17-year-olds are immature, but that 18 represents the point where society deems individuals sufficiently autonomous to bear the *full weight* of citizenship, balancing rights and responsibilities.**  

  **III. Evaluating the Case for Lowering to Age 16 (SB-102)**  
  Proponents of SB-102 argue compellingly for a lower threshold:  

  *   **Stronger Alignment with Affected Interests/Subject to Coercion:** Sixteen- and seventeen-year-olds are deeply embedded in municipal life (schools, jobs, local infrastructure). They pay municipal sales taxes and are subject to local laws. Excluding them violates democratic principles more acutely than excluding younger children.  
  *   **Developmental Readiness & Civic Habit Formation:** Cognitive research indicates decision-making capacities crucial for voting are largely developed by 16. Lowering the age allows civic engagement to begin when young people are still often in supportive environments (schools, families), fostering lifelong voting habits. Evidence from places like Takoma Park shows 16/17-year-olds vote at higher rates than young adults.  
  *   **Correcting an Arbitrary Disconnect:** While 18 marks *full* legal adulthood, significant rights/responsibilities begin earlier (e.g., driving, employment, limited emancipation). Sixteen is already a recognized threshold for partial autonomy. Voting can be seen as another step in this gradual acquisition of civic rights.  

  **IV. Evaluating Amendment 1: Demeny Voting (Proxy Votes for Minors)**  
  Amendment 1 proposes an alternative: granting parents/guardians an extra vote for each minor child in their household.  

  *   **Arguments For:**  
      *   **Addresses the Boundary Problem Directly:** Formally recognizes the interests of *all* minors within the electorate by giving their caregivers a stake proportional to the household size.  
      *   **Protects Future Generations:** Incentivizes policies with long-term benefits (environment, education, infrastructure) that minors will inherit.  
      *   **Maintains Administrative Simplicity:** Uses existing voter rolls; avoids debates about maturity.  
  *   **Arguments Against:**  
      *   **Not Actual Representation:** Minors' views may differ significantly from their parents. A parent casts the vote based on *their* judgment, not necessarily the child's will.  
      *   **Distorts the Electorate:** Concentrates additional voting power in households with children, potentially skewing policy priorities away from childless adults or seniors.  
      *   **Complexity & Fairness Concerns:** Raises questions about shared custody, foster care, and whether the proxy truly reflects the minor's diverse interests.  
      *   **Undermines Youth Agency:** Denies young people the direct experience and empowerment of casting their *own* ballot when they are capable (as argued for 16+).  

  **V. Recommendation: Report SB-102 Favorably (Without Amendment 1)**  

  After weighing the boundary problem and the merits of each approach:  

  1.  **Age 18's Defensibility is Outweighed:** While the alignment with full legal adulthood at 18 is a strong argument, it creates a significant democratic deficit for 16/17-year-olds who are demonstrably affected by and subject to municipal governance. The civic benefits of early enfranchisement and the stronger alignment with democratic principles at the municipal level justify this adjustment.  
  2.  **Sixteen is a Prudent and Justifiable Threshold:** It balances democratic inclusion with a recognizable developmental and societal milestone (driving, working, partial emancipation). It avoids the greater arbitrariness and practical challenges of setting the age much lower.  
  3.  **Demeny Voting is an Unsatisfactory Alternative:** While theoretically intriguing for addressing the boundary problem universally, it fails to provide minors with genuine *self*-representation. It introduces significant potential for distortion and complexity without delivering the direct civic engagement benefits of enfranchising capable 16/17-year-olds. **Amendment 1 should be rejected.**  
  4.  **Municipal Level is Appropriate:** Starting at the local level, where issues are most immediate and tangible, is a responsible way to test and integrate younger voters.  

  **Therefore, the Committee should report SB-102 (Lowering Municipal Voting Age to 16) FAVORABLY to the full assembly, without adopting Amendment 1 (Demeny Voting).** This recommendation directly addresses the democratic imperative of including significantly affected stakeholders, leverages a key developmental window for civic habit formation, and establishes a clearer, more justifiable franchise boundary than the status quo, while rejecting a less representative alternative.  

  **Prepared for Debate:** Delegates are urged to ground their arguments for or against SB-102 in these democratic principles (Affected Interests, Subject to Coercion), the civic rationale, and the relative merits of 16 vs. 18 as a threshold, rather than unprovable assertions about generic maturity.  

  Respectfully,  
  Chair, Committee on Elections
