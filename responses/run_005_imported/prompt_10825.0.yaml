  The Nash bargaining solution maximizes the product of the gains from the disagreement point (i.e., (u1 - d1)*(u2 - d2) is maximized over the feasible set, where d is the disagreement point). The Kalai-Smorodinsky solution, on the other hand, equalizes the ratio of the gains from the disagreement point to the maximum possible gains each player can get in the feasible set (i.e., it finds the point on the Pareto frontier such that (u1 - d1)/(U1max - d1) = (u2 - d2)/(U2max - d2), where U1max and U2max are the maximum utilities each can get in the feasible set, given the other player gets at least their disagreement utility).

  The key trade-off is between two axioms:
  - Independence of Irrelevant Alternatives (IIA): If the feasible set shrinks but the solution point remains available, then the solution should not change.
  - Individual Monotonicity: If the feasible set expands in a way that is more favorable to one player (i.e., the maximum utility that player can achieve increases, while the other player's maximum remains the same), then that player should get at least as much as before.

  Nash's solution satisfies IIA but not monotonicity, while Kalai-Smorodinsky satisfies monotonicity but not IIA.

