  I recall that Friston and collaborators emphasize dynamics. Systems under FEP maintain their Markov blankets through active inference, minimizing free energy. This involves actions that preserve the blanket's structure. Also, scale hierarchies (like cells within organisms) are part of the argument. The user might be missing that FEP's blankets are defined by the system's dynamics, not just statistical partitioning. But the user's point stands: identifying which systems have this active maintenance might still need external criteria.

  Next, the user asks if this objection applies to other theories like IIT or biological individuality debates. For IIT, defining complexes involves maximizing integrated information, but choosing the right spatial grain depends on external factors. Similarly, in biology, individuating organisms relies on criteria like immune response or metabolism, which aren't purely formal. The structural similarity is that formal systems often need additional criteria to pick out relevant entities.

