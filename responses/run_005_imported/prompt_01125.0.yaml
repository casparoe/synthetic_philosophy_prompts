  For the argument, the structure should be: present the cases, show Principle F's conditions aren't met, but moral intuition holds obligation exists. Contrast with Hume's convention-based view, where the act of promising within a social practice creates obligation, regardless of mental states. Emphasize that Principle F overcomplicates and excludes valid promises.

  Next, for Scanlon's defense, a possible repair is to relax the mutual knowledge requirement. Maybe appeal to the promisee's reasonable belief or the promisor's responsibility to ensure understanding. Or argue that in these cases, the conditions are sufficiently met if the promisor acts in good faith. However, the child or unconscious person might not form the required beliefs, so this repair might not fully work. The user might need to assess if such adjustments preserve Scanlon's intent or dilute it too much.

