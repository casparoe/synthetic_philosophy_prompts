  I've been thinking about Mill's harm principle and when it justifies restricting speech. The principle says you can restrict someone's liberty only to prevent harm to others—but I'm wondering whether psychological harm from offensive speech counts as the kind of harm Mill meant. If it does, wouldn't the principle justify restricting much more expression than modern free speech advocates typically argue for?
