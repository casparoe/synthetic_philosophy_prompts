prompt: |-
  I'm teaching a graduate seminar on medieval Jewish philosophy this term and this week's topic is Maimonides on the reasons for the commandments. We're slogging through Guide for the Perplexed III.32 in the old Friedländer translation (1904) — the prose is stiff and the argument wanders a fair bit, so I want to sanity check my own reading before section tomorrow, since I know a sharp student is going to press me on it. Here's the core of the passage:

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed... But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them... It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action. For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings... By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established."

  And a little later, summing up:

  "As the sacrificial service is not the primary object [of the commandments about sacrifice], whilst supplications, prayers, and similar kinds of worship are nearer to the primary object, and indispensable for obtaining it, a great difference was made in the Law between these two kinds of service... Because of this principle which I explained to you, the Prophets in their books are frequently found to rebuke their fellow-men for being over-zealous and exerting themselves too much in bringing sacrifices: the prophets thus distinctly declared that the object of the sacrifices is not very essential, and that God does not require them."

  Ok here's my problem. Taken at face value this really sounds like Maimonides thinks the whole sacrificial cult was a kind of psychologically-necessitated concession, a means to an end (weaning people off idolatry) rather then something God wanted for its own sake. Fine, thats a striking enough claim already. But flip over to the Mishneh Torah, where he lays out the sacrificial laws in loving, exhaustive detail as permanently binding halakha and clearly expects the whole system to be reinstated the moment the Temple is rebuilt, with no hint that its scaffolding we've outgrown. That looks to me to be in real tension with his own ninth principle, that the Torah will never be changed or superseded by another. So: is Maimonides just committed to an inconsistency here, or is there a legitimate way of reading the "primary vs. secondary object" language in III.32 that doesn't have this destabilizing implication? I'd love your take, and if you can show me exactly where my reading is going wrong (or isn't), that would already help a lot.
reasoning: |-
  Okay, let me unpack this professor's question about Maimonides. They're teaching a grad seminar on medieval Jewish philosophy and prepping for a discussion on Maimonides' reasons for commandments, specifically Guide III.32. The core tension they're wrestling with is between Maimonides' apparent dismissal of sacrifices as a historical concession in the Guide versus his detailed codification of sacrificial laws in the Mishneh Torah as eternally binding. 

  First, I need to recall the context. The professor mentions using the old Friedländer translation, which they find stiff - that's important because nuances might be lost. The key passage presents sacrifices as a weaning strategy from idolatry, calling them "not the primary object" and quoting prophets who downplay their importance. Yet in Mishneh Torah, Maimonides treats sacrifices as permanent halakha. The professor sees this as conflicting with Maimonides' ninth principle of the immutability of Torah.

  Hmm, this is a classic Maimonidean puzzle. Let me mentally scan his works. The Guide was written for elite perplexed philosophers, while Mishneh Torah was a comprehensive legal code for all Jews. That audience difference matters. In the Guide, Maimonides emphasizes ta'amei mitzvot (reasons for commandments) through a historical lens, showing how God accommodated human psychology. But accommodation doesn't equal disposability. 

  I remember his "stages of education" metaphor elsewhere - like teaching children arithmetic before abstract math. Sacrifices were the kindergarten stage, but that doesn't mean we abolish arithmetic when we learn algebra. The form persists even when understanding deepens. That could resolve the tension: the ritual remains obligatory while its perceived purpose evolves.

  Also important: Maimonides distinguishes between the utility of a commandment (historically contingent) and its formal authority (eternal). He explicitly says in Guide III.34 that commandments won't change - even those with historically conditioned reasons. The professor's sharp student might pounce on the prophetic critiques quoted, but Maimonides reads those as correcting misplaced priorities, not abolishing the system.

  Wait - there's a subtle point about teleology. When Maimonides calls sacrifices "not the primary object," he means they're instrumental for cultivating divine service, not that they're optional. Prayer is "nearer" to the ideal worship, but both are mandated means. Like scaffolding: you need it during construction, but once the building stands, you don't remove the facade - you maintain the structure.

  The Mishneh Torah's detailed laws make sense in this framework. Sacrifices remain part of the eternal covenant, even if their original anthropological function fades. For Maimonides, halakha isn't utilitarian - it's divine will crystallized. The "concession" was in the initial design, not in ongoing validity.

  I should also flag that Maimonides likely believed sacrifices would continue messianically but with purified intent. His commentary on Menachot hints at this. The professor might want to contrast III.32 with III.49 where he discusses sacrifices as memorials of past revelation.

  For the seminar, I'd suggest the professor stress two keys: 1) the distinction between historical origin and ongoing obligation, and 2) Maimonides' hierarchical view of worship (sacrifices as preparatory but not obsolete). The inconsistency is only apparent if we confuse explanation with authority.
answer: |-
  You've hit upon one of the most enduring tensions in Maimonidean scholarship – the apparent conflict between the *Guide*'s historical-contingent explanation of sacrifices and the *Mishneh Torah*'s treatment of them as eternally binding. Your reading of III.32 is fundamentally correct: Maimonides **does** present the sacrificial system as a divinely orchestrated concession to human psychology, designed to wean ancient Israelites off idolatry by redirecting their ingrained ritual impulses toward God. The "primary object" is pure intellectual worship (knowing/contemplating God), while sacrifices are a "secondary object" – a necessary but non-essential means to that end.

  **However, this does *not* logically entail that sacrifices are disposable scaffolding we've outgrown, nor does it contradict the immutability of the Torah. Here's how Maimonides resolves the tension (or at least manages it):**

  1.  **Distinction Between *Ta'amei HaMitzvot* (Reasons for Commandments) and *Hiyyuv* (Obligation):**
      *   The *Guide* is primarily concerned with explaining the *wisdom* and *purpose* behind the commandments (*ta'amei ha'mitzvot*). It asks: "Why did God command *this specific form* of worship historically?" The answer: To combat idolatry effectively by co-opting its familiar forms.
      *   The *Mishneh Torah* is a codification of *halakha* – the binding legal obligations (*hiyyuv*). It asks: "What is the law?" The answer: Sacrifices are mandated by the eternal Torah and will be reinstated.
      *   **Key Point:** For Maimonides, understanding the *historical reason* for a commandment does **not** negate its *ongoing legal force* or imply it can be abrogated once that reason is less pressing. Divine wisdom initiated the commandment for a specific historical purpose; Divine will mandates its eternal observance. The reason explains the *origin* and *form*, not the *duration* of the obligation.

  2.  **The Pedagogical Stance is Permanent, Not the Idolatrous Context:**
      *   While the *immediate* historical context was combating Egyptian/Canaanite idolatry, Maimonides sees the *underlying pedagogical principle* as enduring. Human nature hasn't fundamentally changed. We still require concrete actions, rituals, and communal structures to cultivate devotion, focus attention, and move toward the "primary object" of intellectual worship (Guide III.51-52).
      *   Sacrifices, in the messianic future, wouldn't be performed out of latent idolatrous impulse, but as **commanded acts of obedience and symbolic devotion** that *still* serve the pedagogical function of directing the heart and mind toward God through disciplined action. They become a purified ritual, stripped of its original association, fulfilling their role within the eternal divine pedagogy for humanity.

  3.  **The Prophetic Critique Reinterpreted:**
      *   When Maimonides cites the prophets rebuking overzealous sacrifice (e.g., Isaiah 1:11, Jeremiah 7:22), he is **not** saying sacrifices are inherently worthless or soon-to-be-obsolete. He is criticizing the *misplacement of priorities* and the *delusion* that the mechanical act, divorced from moral and intellectual progress ("Learn to do good; seek justice," Isaiah 1:17), fulfills God's ultimate desire.
      *   The prophets are emphasizing the "primary object" (justice, righteousness, knowledge of God) over the "secondary object" (the sacrificial act itself), but they never declare the sacrificial system *invalid* or *unauthorized*. Their critique is about *how* sacrifices are performed (with corrupt hearts) and *why* (as a substitute for true service), not *that* they are performed according to God's commanded law.

  4.  **The Ninth Principle (Immutability) Trumps Historical Contingency:**
      *   Maimonides' Ninth Principle is unequivocal: The Torah is eternal and cannot be changed. This is a bedrock of his legal philosophy.
      *   His explanation of the *ta'am* (reason) for sacrifices in the *Guide* operates *within* this framework. He is explaining *why God eternally mandated this specific form*, acknowledging its historical utility in its inception. The commandment itself, once given, transcends its originating circumstance.
      *   **Analogy:** Consider the laws of the Hebrew bondservant (Exodus 21:1-11). Maimonides (and others) might explain this as a concession to the ancient Near Eastern context, a gradual step away from full slavery. Yet, he codifies its laws meticulously in the *Mishneh Torah* (Hilkhot Avadim) as eternally binding. The *reason* for its form is historical; the *obligation* to follow its laws when applicable is eternal.

  5.  **The Messianic Sacrifices: Purified Obedience, Not Regression:**
      *   Maimonides' anticipation of restored sacrifices in the *Mishneh Torah* (Hilkhot Melakhim 11:1) needs to be read in light of his messianic vision. The Messiah restores the Davidic dynasty, rebuilds the Temple, and **reinstates the *entire* Torah law**, including sacrifices (*Hilkhot Melakhim 11:1, 4*).
      *   Crucially, this occurs in an era of universal knowledge of God ("For the earth shall be full of the knowledge of the Lord," Isaiah 11:9, cited in *Hilkhot Teshuvah* 9:2). Sacrifices in this context are **not** a regression to a primitive stage needed to combat idolatry. They are the **fulfillment of an eternal commandment**, performed by a perfected humanity as pure acts of obedience, service, and perhaps communal celebration/remembrance within the framework of the eternal covenant. The *form* persists; the *understanding* and *context* are transformed.

  **Where Your Reading Might Need Nuance:**

  *   **"Means to an End" vs. "Eternal Component":** You're right that sacrifices are a "means to an end" (cultivating true worship). But for Maimonides, within the Torah's structure, they are an *eternally mandated* means. The "end" (pure knowledge/worship) is the ultimate goal, but the commanded "means" remain obligatory pathways *toward* and *expressions of* that goal. They are not *merely* scaffolding to be kicked away; they are integral parts of the divine plan for human religious development, even when that development advances.
  *   **"Destabilizing Implication":** The tension is real, but Maimonides' system contains it by rigorously separating:
      1.  **Historical Explanation** (*Ta'amei HaMitzvot*): Why did God command *this form* at *that time*? (Answer: Psychological weaning from idolatry).
      2.  **Legal Ontology** (*Hiyyuv*): What is the nature of the commandment *once given*? (Answer: An eternal, immutable divine decree).
      3.  **Ultimate Purpose** (*Tachlit*): What is the final goal of *all* commandments? (Answer: Knowledge and love of God - Guide III.27, III.51-54).
      The sacrificial system fits into all three: it had a specific historical purpose in its *form*, it is eternally *obligatory* as law, and it serves (even in its future reinstatement) the ultimate purpose by providing a concrete framework for service and focus within the community.

  **Conclusion:** Maimonides is **not** inconsistent, but he is operating on multiple levels. The *Guide* III.32 reveals the profound historical-anthropological *wisdom* behind the *form* of the sacrificial commandments – a concession to combat idolatry. However, this explanation **does not** imply the commandments themselves are temporary or subject to abrogation. The *Mishneh Torah* codifies the *eternal legal reality* established by divine will. The sacrificial system, even explained as a concession, becomes an eternal component of the covenant, to be performed in the messianic era not as a necessary evil to combat idolatry (which will be gone), but as the fulfilled, purified obedience to God's eternal command, serving its pedagogical and devotional role within a perfected religious framework. The "primary object" remains intellectual worship; the "secondary object" (sacrifice) remains the eternally mandated vehicle for cultivating and expressing that worship in concrete form. The tension lies between historical origin and eternal obligation, but Maimonides resolves it by grounding the obligation solely in divine command, not in the persistence of the original historical need.
