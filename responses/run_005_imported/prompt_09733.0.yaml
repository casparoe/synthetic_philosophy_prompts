     - Normatively defensible because it maintains first-order stochastic dominance and can be derived from reasonable axioms.

  2. **Cumulative Prospect Theory (CPT)**:
     - Extends RDEU by adding a reference point and loss aversion. While very successful descriptively, the reference point and loss aversion are more controversial normatively.
     - The probability weighting and loss aversion might lead to violations of stochastic dominance or transitivity in some settings, which are normatively problematic.
