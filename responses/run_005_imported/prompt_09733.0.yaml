  **Rationale Summary:**  
  - **S** prioritizes foundational axioms and error-based explanations.  
  - **A** (RDEU) offers the most normatively robust alternative with minimal compromises.  
  - **B** theories weaken axioms or introduce descriptively powerful but normatively problematic elements (reference points in CPT; dominance issues in betweenness).  
  - **C** theories depend heavily on psychological mechanisms (regret/disappointment) that violate core rationality criteria.
