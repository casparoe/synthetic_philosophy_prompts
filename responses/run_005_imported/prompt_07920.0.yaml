prompt: |-
  Got into a whole argument with my friend last night about Wittgenstein's hinge stuff -- he thinks hinge epistemology is basically relativism wearing a trenchcoat, since if "the earth is billions of years old" and "the oracle knows when to plant the crops" are both just ungrounded hinges that different forms of life happen to stand on, theres no principled way to say ours is the better one. I tried to push back but couldnt really land it. Perfect timing though, because I've got a philosopher on my podcast next week who just published a book defending a broadly Wittgensteinian hinge epistemology, and I don't want it to turn into her just restating the view for anyone who hasn't read On Certainty. Can you draft me 8 to 10 questions that go further than that? I want at least one that presses the relativism worry above, one on whether hinges are really "not known" at all or if that's just a semantic dodge (Moore, after all, insisted he did know he had hands), and one asking whether the whole view secretly concedes the skeptic's key move rather than actually answering it. For each, give me the answer she's most likely to reach for and a follow-up that doesn't just let her rest there.
