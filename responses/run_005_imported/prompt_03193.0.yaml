  Here’s a dialogue between **Alex** (your perspective) and **Taylor** (your friend’s perspective), both engaging deeply with the core tensions. The goal isn’t "victory," but probing whether Frege’s philosophy and politics share a *structural affinity*.

  **Setting:** Coffee shop, late evening. Empty except for them.

  **Taylor:** Look, I get why Frege’s diary is disturbing. It’s vile. But dragging it into *Foundations of Arithmetic* or *Sense and Reference*? That’s textbook genetic fallacy. You’re judging the *truth* of "the concept horse is not a concept" based on who said it. That’s not how logic works. It’s like rejecting Cantor’s set theory because he was antisemitic too. The arguments stand or fall on their own.

  **Alex:** I’m not saying his logic is *false* because he was a bigot. That *would* be a fallacy. I’m asking: could the *same intellectual temperament* that produced his radical anti-psychologism also be fertile ground for his authoritarian politics? Not causation, but affinity. Think about his core philosophical move: banishing psychology. Thoughts aren’t *my* ideas or *your* ideas; they’re objective, timeless, *third-realm* entities. Truth is discovered, not made, and certainly not decided by committee.

  **Taylor:** Okay, I see the parallel you’re drawing: objective logical truth vs. his disdain for democratic disagreement. But that’s incredibly thin. Anti-psychologism is an *epistemological* stance about the *nature* of logic and mathematics. It’s methodological: to avoid subjectivism *in logic*. Translating that into politics is a category error. Plenty of anti-psychologist logicians were committed democrats – Russell, for crying out loud! He fought against psychologism *and* for social liberalism.

  **Alex:** Fair point about Russell. But Frege’s anti-psychologism isn’t *just* methodological; it’s deeply ontological. Thoughts are *objects* existing independently. Accessing them requires rigor, precision, a purified language – the *Begriffsschrift*. Now look at his politics: he sees the messy, pluralistic Weimar democracy as chaotic, degenerate. He craves order, purity, a singular *correct* solution – embodied by Ludendorff’s authoritarianism. Isn’t there a shared impulse? A rejection of ambiguity, multiplicity, and subjective perspective? The same mind that insists a thought isn’t *mine* might also insist a political truth isn’t *ours* to debate democratically.

  **Taylor:** You’re conflating *epistemic certainty* with *political authority*. Frege wanted logic grounded outside messy minds to *ensure* universal validity. That doesn’t necessitate wanting a dictator! It could equally lead to wanting clearer democratic deliberation based on shared reason. His politics seem driven by raw prejudice and German nationalist resentment post-WWI, not by deductions from the *Grundlagen*. Where’s the *necessary* link? Dummett was shaken ethically, but did he ever argue Frege’s *logic* flowed *from* his antisemitism? I doubt it.

  **Alex:** Dummett didn’t claim deduction. He called the diary entries "appalling" and admitted they forced a reevaluation of Frege *as a man*, questioning how such a brilliant logician could hold such views. That tension *is* the point. It’s not that logic *leads* to antisemitism. It’s whether the *same cast of mind* that seeks absolute, context-independent objectivity in logic might also be drawn to absolute, non-negotiable authority in politics, and see pluralism as a kind of contamination. Frege’s logic demands we purge subjectivity; his politics demands we purge Jews. The *form* of intolerance – the rejection of the contingent and perspectival – might resonate.

  **Taylor:** Resonance isn’t connection. You’re describing a personality trait – rigidity, perhaps – not a philosophical doctrine. His anti-psychologism successfully insulated logic from relativism. Applying that same insulation *ethically* would mean judging his *work* independently of his *character*, which is exactly what I’m advocating! Insisting on a link risks implying that anti-psychologism *itself* is tainted or leads down that path, which it demonstrably doesn’t. Isn’t your search for affinity itself a kind of psychological reductionism – explaining his philosophy via his personality – which is what he fought against?

  **Alex:** Ouch. Good point. I *am* wary of psychologizing him. But here’s my worry: if we completely compartmentalize, we risk making philosophy antiseptically bloodless. Frege’s anti-psychologism wasn’t *just* a tool; it reflected a profound worldview about objectivity and order. His politics reflected another part of that worldview. Ignoring the diary feels like letting the *Nachlass* editors sanitize history. Dummett’s discomfort matters – it highlights a dissonance between the pure realm of thought and the flawed thinker.

  **Taylor:** Acknowledging the dissonance is crucial, ethically. But *philosophically*, the work stands apart. The strength of Frege’s arguments against psychologism lies in their structure, not his character. Finding his politics abhorrent doesn’t weaken his critique of Husserl. Conversely, linking them risks guilt-by-association for the *ideas*. Should we distrust the objectivity of numbers because Frege hated Jews? That’s absurd. The connection you see might be retrospective pattern-matching, not a real structural feature of his thought.

  **Alex:** Perhaps it’s not structural *in the logic*, but in the *impulse* behind his broader intellectual project. His quest for absolute foundations, his horror of fragmentation and ambiguity... doesn't that echo in his desire for a monolithic, purified state? It’s not that logic *causes* fascism. It’s that a certain *kind* of philosophical absolutism *might* share psychological or temperamental roots with political absolutism – especially when combined with nationalism and prejudice. Not inevitable, not logical, but *plausible* in *this* case. It makes him a tragic figure, not a monster, but also stops us from viewing his philosophy in a purely disembodied light.

  **Taylor:** ...Okay, I’ll concede that much. The *ferocity* of his anti-psychologism, the *intensity* of his desire for a single, clear, objective realm, *might* reflect a broader personality disposition that also manifested in rigid, intolerant politics. It’s plausible as a biographical observation about Frege-the-man. But it doesn’t infect the *validity* of "Sinn und Bedeutung." We can – we *must* – engage those arguments on their own terms, in the "third realm" he posited. His politics are a horrific footnote *to his life*, not a refutation *of his work*. We can hold both the profound contribution and the profound failing simultaneously, without forcing a causal or necessary link between the two. The connection is biographical and psychological, not philosophical.

  **Alex:** And maybe that’s the earned conclusion. The link isn’t logical or necessary, but it’s also not *random*. There’s a disturbing *affinity* in the *shape* of his thought and his politics – a shared aversion to the messy human element. It doesn’t taint the logic, but it shatters any illusion of the philosopher as a purely rational soul divorced from his prejudices. We read Frege differently knowing about the diary – not because his proofs are wrong, but because we see the man behind the *Begriffsschrift* was tragically, horrifically flawed. The dissonance Dummett felt is the point: brilliance and bigotry inhabiting the same mind.

  **Taylor:** Agreed. Judge the arguments rigorously on their own. But know the man was complex and deeply flawed. The diary forces us to see that complexity, even if it doesn't change the truth-value of his logical propositions. The editors shouldn't have hidden it. The philosophy stands; the philosopher falls.

  **Conclusion Reached:** There is a plausible *psychological/temperamental affinity* between Frege's radical anti-psychologism (his drive for absolute, objective, context-independent truth and order) and his later authoritarian, antisemitic politics (his desire for absolute, non-pluralistic, "pure" societal order). This is not a *logical* connection, nor does it invalidate his philosophical work, which must be evaluated independently. However, it prevents a sanitized view of Frege *as a thinker*, revealing a disturbing dissonance within his worldview. The connection is biographical and dispositional, not philosophical or necessary, but it is significant for understanding the man behind the ideas.
