prompt: |-
  I am a philosophy professor who, somewhat improbably, has served for the past three years as the sole non-firefighter member of the Valor Awards Board of my city's fire department -- a role I was invited into after teaching a continuing-education ethics module for the department's officers, and one that has forced me to think harder about the concept of supererogation than any seminar of mine ever did. The board meets annually to decide on nominations for the department's two commendations: the Meritorious Service Award, for exceptional performance of assigned duty, and the Medal of Valor, defined by department policy as recognizing 'acts of heroism performed at extreme personal risk, above and beyond the call of duty.' This year's central nomination has split the board evenly. A firefighter, having already completed the assigned search-and-clear of a burning structure in full compliance with procedure, remained on scene after a general 'Mayday, all units withdraw' order was issued because of imminent structural collapse, re-entered the building alone and without backup to retrieve a resident spotted at a window who had not been on the original victim list, and carried her to safety, sustaining serious injuries in the process.

  Roughly half the board regards this as a clean case for the Medal of Valor, precisely because the firefighter had already discharged every duty the job required before choosing, freely and at enormous personal risk, to do more. The other half is unpersuaded: they point out that firefighters arguably have a standing professional duty to rescue any civilian they can feasibly save, independent of the particulars of any one assignment, so the act may not have gone beyond duty at all -- it may simply be what the job already demanded, accomplished by disobeying a safety order whose entire purpose is to stop well-intentioned firefighters from getting themselves killed. On this view, calling the act supererogatory misdescribes it, and rewarding it as such risks teaching firefighters that Mayday orders are optional whenever they feel sufficiently confident of success. I must bring a short written recommendation to the board's final vote next week; please draft it so that it chooses among the Medal of Valor, the Meritorious Service Award, or no award at all, defends that choice, and explains exactly where the line falls between fulfilling a duty and exceeding it. Above all, the memo should take the disobedience worry seriously on its own terms rather than brushing past it, since that is the objection I will actually have to answer from the skeptical half of the board.
reasoning: |-
  Okay, the user is a philosophy professor who's been serving on a fire department's Valor Awards Board. They need to draft a recommendation memo about whether a firefighter's actions deserve the Medal of Valor, Meritorious Service Award, or no award. The board is split: half think it's clearly beyond duty (supererogatory), while the other half argue it was part of the firefighter's duty to rescue, making the disobedience to the Mayday order problematic.

  First, I need to understand the core philosophical issue here: supererogation versus duty. The professor mentioned this has made them think harder about supererogation. The key is defining where duty ends and supererogation begins, especially in professions where duty boundaries might be broader.

  The firefighter re-entered the building after completing their assignment and after a Mayday order was issued. They saved someone not on the victim list but got injured. The debate centers on whether rescuing any civilian is always part of their duty, thus making this act obligatory, or if it goes beyond duty since they had already fulfilled their assigned tasks.

  The opposing board members worry that calling this supererogatory might encourage ignoring Mayday orders, which are critical for safety. The memo must address this disobedience concern seriously. The professor needs a recommendation that clearly draws the line between duty and going beyond it, considering the implications for future conduct.

  I should start by defining the awards: Meritorious Service for exceptional performance within duty, and Medal of Valor for acts beyond duty with extreme risk. The question is whether this act falls into the latter. 

  Arguments for Medal of Valor: The firefighter had completed their assignment. The Mayday order was active, and re-entering was against protocol. The victim wasn't on the list, so not part of the initial duty. The personal risk was extreme, and they were injured. This suggests a voluntary choice beyond what was required.

  Arguments against: Firefighters have a duty to save lives whenever possible. Disobeying a Mayday order undermines command structure and safety protocols. If such acts are rewarded, it might encourage others to take similar risks, leading to more casualties. Thus, it's not beyond duty but a violation of procedure.

  The challenge is balancing moral duty versus professional protocols. Even if there's a moral duty to save, professional duties include following orders for collective safety. The memo needs to distinguish between the two. 

  Possible solution: Argue that duty has limits defined by assignments and safety orders. Completing the assigned task fulfills duty. Mayday orders create a boundary where further action isn't obligatory due to excessive risk. Thus, acting beyond that point is supererogatory. However, disobedience must be acknowledged but contextualized—only justifiable if successful and when risk is calculated, not as a general rule.

  The recommendation could be to award the Medal of Valor but include a strong caveat about the exceptional circumstances and the importance of following orders. This addresses the disobedience concern by not endorsing it as a norm but recognizing the extraordinary nature of this case.

  Also, the memo should explain the line between duty and supererogation clearly: duty ends when assignments are complete and safety orders are given. Beyond that, actions are supererogatory but not without consequences for protocol violations. This maintains the integrity of the awards while honoring the firefighter's bravery without encouraging future disobedience.
answer: |-
  ## Memorandum: Valor Awards Board Recommendation  
  **Regarding: Nomination of FF [Name/ID] for 20XX Incident at [Address]**  
  **From: [Your Name], Philosophy Professor & Board Member**  
  **Date:** [Current Date]  

  ### Recommended Award: Medal of Valor  

  ### I. Summary of Reasoning
  The firefighter's actions constitute a **clear case of supererogation** warranting the Medal of Valor. While the objection concerning disobedience to the Mayday order is profound and demands serious engagement, the act fundamentally transcended the boundaries of duty defined by the firefighter’s *assigned obligations*, *procedural context*, and the *professional duty’s reasonable limits under imminent existential threat*. The Medal of Valor recognizes precisely this: morally exceptional action performed *beyond* established duty, at extreme and foreseeable risk, where failure to act would not constitute culpable neglect.  

  ### II. Defining the Line: Duty vs. Supererogation in Firefighting
  The core dispute hinges on the scope of a firefighter’s "duty to rescue." **Duty** encompasses actions fulfilling:  
  1.  **Explicit Assignments:** Completing designated tasks (e.g., search-and-clear of Sector A).  
  2.  **Procedural Mandates:** Adhering to safety protocols designed for collective survival (e.g., obeying "Mayday" withdrawal orders).  
  3.  **Reasonable Risk Threshold:** Actions where success is feasible within established risk-management frameworks.  

  **Supererogation** begins where:  
  1.  **Assigned Duty is Fulfilled:** The actor has discharged their specific, immediate obligations.  
  2.  **Action Occurs Beyond Safety Mandates:** The act knowingly violates critical safety procedures *specifically designed to override individual discretion* in the face of catastrophic risk.  
  3.  **Personal Risk is Extreme & Foreseeable:** The peril is not merely inherent to the job, but *qualitatively escalated* by the circumstances (e.g., structural collapse), making sacrifice or severe injury highly probable.  
  4.  **Moral Optionality Exists:** Failure to act, while perhaps regrettable, would not constitute a breach of professional duty given the context.  

  **The Line:** Duty ends where the combination of *completed assignment* and *imminent, overwhelming, procedurally recognized existential threat* creates a context where further action is not just dangerous, but *prohibited* for the greater good of personnel safety and operational integrity. Acting within this prohibited space, driven solely by the imperative to save life, is supererogatory.  

  ### III. Analysis of the Act: Exceeding Duty
  1.  **Fulfillment of Assigned Duty:** The firefighter completed the assigned search-and-clear *in full compliance with procedure*. This discharged their specific obligation at that moment.  
  2.  **Violation of Critical Safety Mandate:** The "Mayday, all units withdraw" order was not a suggestion; it was a categorical command triggered by an imminent, catastrophic threat (structural collapse). Its *entire purpose* is to supersede individual rescue impulses to prevent multiple casualties. Disobedience inherently places oneself and potential rescuers at extreme, unmanaged risk.  
  3.  **Extreme and Foreseeable Personal Risk:** Re-entering alone, without backup, into a collapsing structure constitutes risk far exceeding the "normal" dangers of firefighting. The serious injuries sustained confirm the foreseeability and extremity of the peril.  
  4.  **Moral Optionality:** While the impulse to save life is core to the profession, *in this specific context* – post-assignment, post-Mayday, facing collapse – the firefighter had no *duty* to attempt the rescue. Prioritizing their own survival, as mandated by the order, would have been professionally defensible. The victim’s absence from the original list further underscores this was not a known, unfulfilled obligation.  

  ### IV. Addressing the Disobedience Objection Seriously
  The objection – that calling this supererogatory undermines Mayday orders and teaches that they are optional – is valid and crucial. **This recommendation does not dismiss it; it contextualizes it within the nature of supererogation and the Medal of Valor:**  

  1.  **Supererogation Acknowledges Rule-Breaking:** Acts truly "beyond duty" often involve transgressing norms or rules *for a higher moral purpose*. The Medal of Valor inherently recognizes this tension. It does not endorse the rule-breaking as standard practice; it honors the *exceptional moral choice* made despite the rule and the extreme cost.  
  2.  **The Medal is Exceptional, Not Instructive:** Awarding the Medal of Valor signals that this was an *extraordinary* act under *extraordinary* circumstances. It explicitly **does not** imply that Mayday orders are generally optional or that disobedience is encouraged. Department policy, training, and disciplinary frameworks must (and do) unequivocally reinforce the absolute necessity of obeying Mayday orders. The Medal exists *alongside* this stricture to recognize the rare, morally exceptional moment when an individual, having fulfilled their duty, chooses to bear unacceptable risk *against procedure*.  
  3.  **Risk of Misinterpretation vs. Risk of Demoralization:** While there is a risk some might misinterpret the award, the greater risk lies in *not* recognizing this act. Failing to award the Medal sends the message that such profound sacrifice, undertaken solely to save a life after duty was fulfilled, is merely "expected" (Meritorious Service) or even *improper* (no award). This could demoralize personnel and fail to acknowledge the pinnacle of selfless courage the Medal was designed for.  
  4.  **Clarifying the Distinction:** The Meritorious Service Award appropriately honors *exceptional performance within duty and procedure*. To award it here would implicitly validate the argument that the rescue *was* part of the firefighter's standing duty, *despite* the Mayday order and completed assignment. This would be the truly dangerous precedent, as it would blur the line the Mayday order exists to draw and suggest that duty compels impossible or suicidal actions beyond procedural safety limits.  

  ### V. Recommendation & Conclusion
  **Recommendation:** Award the **Medal of Valor** to Firefighter [Name/ID].  

  This decision affirms:  
  *   The firefighter discharged their assigned duty before acting.  
  *   Obeying the Mayday order was the prescribed, dutiful action.  
  *   The decision to re-enter was therefore *supererogatory* – morally heroic, undertaken at extreme, foreseeable personal risk, and beyond the call of professional duty as defined by assignment, procedure, and the imminent catastrophic threat.  
  *   The Medal of Valor recognizes the **exceptional nature** of this choice and its profound consequences, **without** diminishing the absolute necessity of Mayday compliance as the standard governing duty.  

  The integrity of the Mayday order is preserved by our clear understanding: this Medal honors a firefighter who *chose* to go beyond duty in defiance of an order designed to keep them safe *after* their duty was done. It is a recognition of profound moral courage in an impossible moment, not an endorsement of operational disobedience. Failure to award the Medal risks reducing the concept of Valor to mere exceptional diligence within safety parameters, thereby diminishing its meaning and the profound sacrifice it exists to honor.  

  Respectfully submitted,  
  [Your Name]
