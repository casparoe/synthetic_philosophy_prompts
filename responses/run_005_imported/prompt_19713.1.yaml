  When Marisol proposes critical-level theory, it's a legitimate alternative. But Owen's sadistic conclusion critique is a serious drawback. Marisol's retort about distrusting intuitions on hypothetical suffering is clever. She's turning Owen's argument against him, highlighting inconsistency. However, her blocking the step-by-step argument earlier without specifying where it fails weakens her position a bit.

