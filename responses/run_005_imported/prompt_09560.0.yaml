answer: |-
  You've hit upon one of the most debated tensions in Aquinas's text, and your reading is astute. Let's break down the passage and resolve the apparent contradiction:

  ### Core Structure of Aquinas's Argument
  1.  **Double Effect Framework:** An act with two effects (saving life, killing aggressor) is morally judged by the *intended* effect (self-preservation). The unintended effect (killing) is "beside the intention" (praeter intentionem) and thus doesn't define the act as murder.
  2.  **Proportionality Requirement:** The act remains lawful *only* if the force used is proportionate ("moderate," not "excessive").
  3.  **Duty to Self-Preservation:** One has a greater obligation to preserve one's own life than the aggressor's.
  4.  **The Problematic Final Sentence:** Killing is unlawful unless done by public authority for the common good. Therefore, a *private individual* may *never intend to kill* in self-defense. Only public authorities (soldier, judge's agent) may intend killing, referring it to the public good.

  ### The Apparent Contradiction & Its Resolution
  You're right to sense a shift. Here's how commentators reconcile it:

  1.  **Distinction in the *Object* of the Act:** Aquinas isn't changing the subject *from* self-defense *to* something else. He's distinguishing **two fundamentally different *kinds* of acts within the broad category of "self-defense":**
      *   **Private Self-Defense:** The *object* (the core act chosen) is **repelling an unjust aggressor to preserve one's own life.** The death of the aggressor, if it occurs, is *always* a *side effect* of this chosen act. Intending the death would change the object to "killing an aggressor," which, for a private person, is murder. The permissibility rests entirely on the double effect structure and proportionality.
      *   **Public Defense/Execution of Justice:** The *object* is **defending the common good by incapacitating a threat.** For a soldier or agent of the judge, the death of the aggressor (e.g., enemy combatant, robber resisting arrest) *can be part of the intended means* to achieve the public good. Their role grants them the authority to intend this effect *as a means to a just public end* (common defense, upholding justice). This act is judged differently because its primary end is public, not private.

  2.  **Why the Private Individual *Cannot* Intend Killing:**
      *   **Lack of Authority:** Only legitimate public authority has the right to *intentionally* take life as a means to an end (even a good end like defense). A private citizen lacks this juridical power.
      *   **Moral Species Shift:** If a private citizen *intends* the death, even as a means to self-preservation, the act's moral species changes from "lawful self-defense" to "intentional homicide." Aquinas states this outright: killing is unlawful except for public authority. Intending the death makes it unlawful homicide for a private person.
      *   **Preserving the Double Effect Condition:** The entire argument for the permissibility of private self-defense *depends* on the death being unintended. If the death is intended, the double effect justification collapses. The final sentence reinforces this foundational requirement specifically for private actors.

  3.  **What the Soldier/Public Agent Gains:**
      *   **Permission to Intend Death as a Means:** The soldier isn't granted a *further* permission the private person has via double effect. The soldier is granted a *different kind of permission*: the moral and legal authority to *deliberately choose* to kill another human being *as a means* to achieving a legitimate public good (defending the community, enforcing just law). This is a qualitatively different act.
      *   **Scope of "Self-Defense":** When Aquinas says the soldier kills "in self-defense," he uses "self" broadly to mean the *political community* (the *res publica*) he is sworn to defend, not his individual body. His "self-defense" is an act of public duty. The private citizen defends only their individual self.

  ### How Commentators Resolve the Tension (Anscombe, McIntyre, Finnis)
  *   **G.E.M. Anscombe:** Emphasizes the distinction in the *object* of the act. The private defender's object is "warding off attack," where death is a possible consequence. The public agent's object can be "using lethal force to stop a public threat," where death is an intended means.
  *   **Alasdair MacIntyre:** Focuses on the role of *social role and authority*. The moral permissibility of intending certain effects is deeply tied to one's social function. The private citizen lacks the social role that justifies intending death.
  *   **John Finnis:** Stresses that Aquinas is grounding the public authority's permission in the *common good*, which transcends individual goods. The private citizen acts for an individual good (their life), which cannot justify *intending* the destruction of another individual good (the aggressor's life), only *accepting* it as a side effect. The public agent acts for the transcendent common good, which *can* justify intending the destruction of a threat to that good.

  ### Implications for Whitfield's Closing Argument
  Whitfield *cannot* truthfully claim the soldier's case and the homeowner's case are "the same kind of act." Aquinas explicitly distinguishes them based on **authority, intention, and the nature of the good being defended (individual vs. common).**

  **How Whitfield Can Use This Authentically & Powerfully:**

  1.  **Focus Relentlessly on Daniel's Intention:** Hammer home that Daniel's *only* intention was to stop the attack and save his life. The death was a tragic, unintended consequence. Cite Aquinas: "the act of self-defense may have two effects... since one's intention is to save one's own life, is not unlawful."
  2.  **Emphasize Proportionality:** Stress that Daniel used only the force *necessary* to stop the threat. Cite Aquinas: "if he repel force with moderation his defense will be lawful... provided one does not exceed the limits of a blameless defense."
  3.  **Acknowledge the Distinction, Use it Strategically:** Whitfield, the sharp former seminarian, *should* acknowledge the complexity:
      *   *"Aquinas draws a line, ladies and gentlemen. He says a private citizen like Daniel may never* intend *the death of another, even an attacker. Why? Because that intent would cross into the realm of judgment and execution reserved only for the state. Daniel didn't cross that line. His intent was pure survival – to stop the attack, to make the violence end. The terrible outcome, the death of his assailant, was beside that intention, a consequence he was forced to accept in the desperate struggle to live, not an outcome he chose to bring about."*
  4.  **Contrast with Public Authority:** Use the soldier example *to highlight what Daniel did NOT do*:
      *   *"The law recognizes that a soldier, acting under authority for the common good, may *intend* to kill an enemy combatant. That is his grim duty. Daniel had no such authority, sought no such duty. He wasn't acting for the state; he was acting from the most basic human instinct Aquinas himself recognized: the natural drive to preserve one's own being. His act wasn't one of public execution; it was one of desperate, lawful, proportional self-preservation, where the fatal outcome was never his aim, only an awful accident of that necessary defense."*
  5.  **Natural Law Foundation:** Ground Daniel's right firmly in Aquinas's natural law principle: "it is natural to everything to keep itself in 'being,' as far as possible." This is primal, pre-political, and universally understandable to a jury.

  **Conclusion:** The tension you perceive is real and central to Aquinas's argument. The final sentence isn't a non-sequitur; it's a crucial qualification defining the *limits* of the double effect justification for *private* individuals by contrasting it with the distinct moral logic governing *public* authority. Whitfield's argument gains depth and authenticity by acknowledging this distinction and using it to sharply define the *only* basis on which Daniel's actions can be lawful: the unintended nature of the death occurring during a proportionate act of self-preservation driven by natural instinct, not the intention to kill. This nuanced reading avoids the flattened trolley-problem version and provides rich ground for a compelling, theologically grounded defense.
