answer: |-
  ## Jade & the Necessary A Posteriori (Dialogue)

  **Setting:** A cluttered university office after a seminar. Tea mugs steam. SAMIRA leans forward intently, while ALEX gestures emphatically.

  **Samira:** Alex, the jade case *shatters* the Kripke/Putnam orthodoxy. ‘Jade’ was used perfectly successfully for millennia to pick out *both* jadeite *and* nephrite – distinct minerals with different microstructures. People *meant* the tough, greenish stone you carve. There *was* no single hidden essence being rigidly designated, just a cluster of observable properties holding the term together. How does your rigid designation story survive this?

  **Alex:** It survives easily, Samira, precisely *because* we discovered there *isn’t* one natural kind here! ‘Jade’ was never a *bona fide* natural-kind term *in the Kripkean sense*. It was a *pre-scientific category*, a label for a macroscopic *stuff* defined by appearance and use. The discovery revealed *two* distinct natural kinds – jadeite and nephrite – each *with* their own hidden essence. ‘Jadeite’ rigidly designates (NaAlSi₂O₆), ‘nephrite’ designates (Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂). ‘Jade’ was ambiguous, not a counterexample.

  **Samira:** Ambiguous *now*, yes. But *before* mineralogy? When the Aztec craftsman said ‘chalchihuitl’ (jade), what rigidly designated essence was he latching onto? There wasn’t one! His term *successfully referred* to *both* kinds because they *looked* and *behaved* similarly. Reference was fixed by ostension to *surface properties* – hardness, color, workability – not by pointing to a hidden microstructure he knew nothing about. Kripke’s story requires that initial baptism *somehow* picks out an essence, even if unknown. Here, there *was* no single essence to pick!

  **Alex:** But that’s just the point! The Aztec craftsman *wasn’t* performing a Kripkean baptism for a *scientific natural kind*. He was naming a *practical kind*. The Kripke/Putnam model applies to terms *intended* to track underlying natural structures, even if imperfectly understood. ‘Water’ *was* intended that way – we postulated *something* making it water. ‘Jade’, historically, was about the *stuff* with *those properties*. Discovering two essences doesn’t refute rigidity; it shows ‘jade’ wasn’t a rigid designator for *one* kind. ‘Water’ still rigidly designates H₂O.

  **Samira:** Ah, but *intention* is doing too much work here! How do we know the *intention* behind ‘water’ was fundamentally different? Both started as practical identifications based on sensory input. The difference is ontological luck: water *happened* to have a uniform microstructure, jade didn’t. Kripke claims necessity flows from rigid designation *plus* empirical discovery. But if rigid designation itself *depends* on the world cooperating by having a single essence – something we only discover *a posteriori* – then the necessity isn’t grounded purely in language/reference. Jade shows the *discovery* of multiple essences *retroactively* changes our semantic analysis. That’s messy!

  **Alex:** It’s not messy, it’s descriptive! Language evolves with knowledge. Before mineralogy, ‘jade’ had a fuzzy extension covering both minerals. Post-discovery, we refine our terms: we *now* understand ‘jade’ as a gemological category defined by specific macroscopic properties (toughness, etc.), encompassing jadeite *and* nephrite. Crucially, we *also* now have precise rigid designators *for the distinct kinds*: ‘jadeite’ and ‘nephrite’. Kripke’s model perfectly handles the *new* natural-kind terms born from scientific refinement. The fuzziness of ‘jade’ pre-science doesn’t invalidate rigidity for *uncovered* essences.

  **Samira:** But it *does* challenge the *generality* of the necessary a posteriori. Kripke/Putnam presented it as the *norm* for natural-kind terms. Jade shows it’s contingent on the world having tidy microstructural essences underlying our pre-scientific categories. Sometimes, like with jade, granite, or even ‘fish’ biologically, the world gives us *disjunctive* essences or no single essence at all. The *necessity* of ‘water is H₂O’ relies on water *actually having* that uniform essence. Jade proves that isn’t guaranteed. The semantic work is done primarily by stable macroscopic properties, *not* by rigidly latching onto an unknown-but-unique hidden structure.

  **Alex:** Hold on. Even with jade, the *microstructure is still essential* for *each kind*! You *cannot* have nephrite without its specific amphibole structure. If you found a lookalike with a *different* microstructure, it wouldn’t *be* nephrite, even if visually identical! That’s the core Kripkean point: once we identify the kind *via* its essence (post-discovery), that essence is necessary. ‘Nephrite is Ca₂(Mg,Fe)₅Si₈O₂₂(OH)₂’ *is* necessary a posteriori. Jadeite likewise. The fuzziness of the *superordinate* term ‘jade’ doesn’t negate the rigidity and necessity operating at the *subordinate* natural-kind level we discovered.

  **Samira:** But the *superordinate* term is what ordinary language uses! And it *worked* without a unique essence. This suggests that for *many* natural-kind terms in ordinary use, the reference is secured by a *bundle* of superficial properties acting as a placeholder, *not* by a direct, rigid hook onto a single hidden essence. The essence is *discovered* to be necessary *if it exists*, but its existence and uniqueness aren’t guaranteed by the semantics alone. Jade shows the Kripkean move – from rigid designation to necessary a posteriori – requires a *favorable ontological setup* that isn’t universal. The burden shifts: why think ‘water’-like cases are the rule, rather than the ‘jade’-like cases?

  **Alex:** Because science *reveals* the underlying kinds! And for *those* revealed kinds, the Kripkean model *does* hold. ‘Water’ *was* a favorable case, yes, but it’s the paradigm because it reveals the *structure* of how natural-kind terms *aim* to function, even when we start fuzzy. Jade doesn’t break the model; it shows us refining our language *towards* it as knowledge grows. The necessity arises when we *correctly* identify and rigidly designate the *actual* natural kind.

  **Samira:** And I say it shows necessity is a *consequence* of scientific success in finding essences, not a *precondition* of reference secured solely by rigid designation. The semantics are more flexible, grounded in usable properties, awaiting scientific disambiguation – which may or may not yield a single necessary essence. Jade stands as a counterexample to the *universal applicability* of the tidy ‘water is H₂O’ necessity story. The world is messier, and language reflects that. *(Reaches for her cooling tea, the argument clearly unresolved).*

  **Alex:** *(Leans back, smiling faintly)* Then let’s agree the messiness keeps us employed, Samira. Pass the biscuits?
