prompt: |-
  Ok so I had this whole argument with my friend last night about superrationality (the Hofstadter idea that two "ideal" reasoners will cooperate in a one-shot prisoner's dilemma just because they know they'll both reach the same conclusion). She says its basically cheating -- defection dominates no matter what the other guy does, so the second you let "well, they'll think what I think" change your move, you've quietly thrown out dominance reasoning without admitting it. I tried to argue that the real move is noticing your choice is correlated with theirs even with zero causal link between you, so treating the two choices as independent (which is what makes dominance reasoning valid in the first place) is the actual mistake here, but I couldn't make that rigorous on the spot and now I'm not 100% sure I even believe it. Can you lay out the strongest version of this argument, whether superrationality can actually be defended without it basically collapsing into evidential decision theory, and how much weight it puts on the two agents being near-identical vs just "similar enough"?
reasoning: |-
  Okay, let me start by unpacking the user's query. They had an argument with their friend about superrationality in the prisoner's dilemma. The friend thinks it's cheating because defection dominates, and bringing in correlated decisions throws out dominance reasoning. The user tried to argue that the correlation matters even without a causal link, but they couldn't make it rigorous and now doubt their stance.

  First, I need to recall Hofstadter's superrationality. It's about identical agents making the same decision because they reason identically. The key point is that their choices are correlated, not causally, but logically. The dominance argument assumes independence, which might not hold here.

  The user wants the strongest defense of superrationality. They also wonder if it's just evidential decision theory (EDT) in disguise and how much depends on agent similarity. Let me break this down.

  The core of superrationality is the symmetry between identical reasoners. If both know they are identical, they realize their decisions will match. So, choosing cooperate (C) leads to mutual cooperation (CC), and defection (D) leads to mutual defection (DD). The payoff for CC is better than DD, so they choose C. Dominance reasoning fails because the assumption of independent actions is invalid here. When agents are identical, their choices aren't independent; knowing your choice gives info about theirs.

  Now, defending this without collapsing into EDT. EDT uses evidence (like "if I do X, the other likely does X") to decide. Superrationality uses logical necessity due to identical reasoning. It's not about evidence but the inevitability of the same outcome. However, critics argue that without causal influence, it's still EDT. But proponents might say it's a unique case where logical correlation overrides dominance.

  The user mentioned making dominance reasoning invalid by treating choices as independent. That's a good point. In standard game theory, independence is assumed, but here, the agents' identical nature breaks that. So the mistake is applying dominance when independence doesn't hold.

  About agent similarity: Hofstadter requires near-perfect identity. If agents aren't identical, the correlation weakens. But how similar is "similar enough"? That's vague. If agents know they are similar but not identical, they might still coordinate if they believe the other reasons similarly. But it's less robust. The defense might only hold under strict identicality, which is unrealistic.

  The user's uncertainty is valid. Superrationality is controversial. It challenges standard game theory but relies on strong assumptions. The strongest argument is that for identical agents, the choices are interdependent, so dominance doesn't apply. But outside that idealization, it falters.

  Also, connecting to EDT: Superrationality can be seen as EDT with perfect correlation. But it's presented as a distinct concept. However, without the identical agent assumption, it reduces to EDT. So the defense hinges on that assumption.

  In conclusion, the strongest argument is that identical reasoning creates logical correlation, invalidating independence. But it's fragile without perfect identity and blurs into EDT. The user needs to recognize that while it's a fascinating idea, its practical application is limited, and the friend's critique has merit in most real-world scenarios.
answer: |-
  Here's a breakdown of the superrationality argument, its defense, its relationship to Evidential Decision Theory (EDT), and the critical role of agent similarity:

  **The Core Superrationality Argument (Defense):**

  1.  **The Symmetry Premise:** Two agents are stipulated to be *identical* "ideal reasoners." They share the same information, reasoning capabilities, goals, and crucially, *they know this about each other*. They know they are facing an identical copy of themselves in an identical situation.
  2.  **The Logical Correlation:** Because they are identical ideal reasoners, they *must* reach the *identical* conclusion about what to do. There is only one "rational" output for this specific input (the game setup and self-knowledge). Their choices are *logically correlated*, not causally linked. If Agent A concludes "C is rational," so must Agent B, and vice versa. If Agent A concludes "D is rational," so must Agent B.
  3.  **The Collapsed Decision Matrix:** The symmetry and logical correlation collapse the standard 2x2 decision matrix. The agents aren't choosing *independently* against an arbitrary opponent. They are effectively choosing between two *joint outcomes*:
      *   **Option 1:** *Both* choose C -> Outcome: (C, C) -> Payoff: R (Reward for mutual cooperation)
      *   **Option 2:** *Both* choose D -> Outcome: (D, D) -> Payoff: P (Punishment for mutual defection)
      *   The asymmetric outcomes (C,D) and (D,C) are *logically impossible* given the premise of identical reasoning. An ideal reasoner *knows* the other will choose exactly what they choose.
  4.  **Dominance Reasoning is Inapplicable:** Dominance reasoning ("D is better no matter what the other does") relies crucially on the assumption that *your choice does not constrain the other player's choice*. It treats the other player's move as an independent variable. Superrationality argues that in this *highly specific scenario* of identical reasoners, this independence assumption is *false*. Your choice *logically determines* the other player's choice (because they are your identical copy). Therefore, comparing "what happens if I choose D while they choose C" is nonsensical under the premise – that scenario cannot occur.
  5.  **The Rational Choice:** Faced with the choice between the *only two possible joint outcomes* – (C,C) paying R or (D,D) paying P – and given that R > P (the defining feature of PD), the rational choice for each individual agent is to choose C, leading to (C,C) and payoff R.

  **The Strongest Version of Your Argument:**

  Your intuition about correlation and the invalidity of the independence assumption is core to the defense. Here's a rigorous phrasing:

  *   "Standard dominance reasoning in the Prisoner's Dilemma *presupposes* that the players' choices are stochastically independent. This independence is justified when players are distinct entities with potentially divergent reasoning or private information. However, in the superrational scenario, the agents are stipulated to be *identical* ideal reasoners with perfect mutual knowledge of this identity. This creates a *logical necessity* that their choices will be identical. The correlation coefficient between their actions is 1.0, not 0.0.
      *   Therefore, applying dominance reasoning, which requires independence, is invalid in this specific context. The mistake isn't in abandoning dominance reasoning *per se*; it's in *misapplying* it to a situation where its fundamental precondition (independence) is violated by the premises of the thought experiment.
      *   The agents aren't predicting what the other *will* do based on evidence; they are deducing what the other *must* do as a matter of logical necessity, given the shared knowledge of their identical reasoning."

  **Relationship to Evidential Decision Theory (EDT):**

  *   **The Strong Connection:** Superrationality is **deeply intertwined with EDT and arguably a specific application of it.** EDT says to choose the action that, *conditional on you taking it*, has the best expected outcome. In the superrational scenario:
      *   P(Other Chooses C | I Choose C) = 1 (Logical necessity)
      *   P(Other Chooses C | I Choose D) = 0 (Logical necessity)
      *   Therefore:
          *   EU(C) = U(C, C) * 1 + U(C, D) * 0 = R
          *   EU(D) = U(D, C) * 0 + U(D, D) * 1 = P
      *   Since R > P, EDT dictates choosing C.
  *   **Is it "Collapsing into EDT"?** **Yes, in practice, for this scenario.** The superrational calculation *is* the EDT calculation under the premise of perfect logical correlation. Hofstadter arrived at it through symmetry, but the numerical decision procedure aligns perfectly with EDT given the correlation induced by the identity premise. Defenders might argue the *justification* (logical necessity via symmetry) is distinct from the general EDT *principle* (maximize conditional expected utility), but the *output* is the same.
  *   **The "Cheating" Charge (Your Friend's Point):** Your friend is correct *if* you insist on maintaining the standard game-theoretic framework where players are distinct and independent. Within that framework, dominance *is* king for the one-shot PD. Superrationality *does* "throw out dominance reasoning" by introducing a *different* framework where the players' choices are interdependent due to logical correlation. It's not cheating within *its own* framework, but it *is* abandoning the standard framework's core independence assumption. The charge is valid if one insists the standard framework is the only valid one.

  **The Critical Role of Agent Similarity ("Near-Identical vs Similar Enough"):**

  *   **Hofstadter's Premise is Absolute:** The argument **hinges critically on near-perfect identity.** The agents must be *identical* ideal reasoners who *know* they are identical. This creates the logical certainty that they will choose the same action. Any deviation breaks the logical correlation.
  *   **"Similar Enough" is Problematic:** The argument **collapses rapidly with any significant deviation from perfect identity.**
      *   **Different Reasoning:** If agents suspect they might reason slightly differently (e.g., one is slightly more risk-averse), the logical certainty vanishes. They must now consider the possibility the other defects even if they cooperate. Dominance reasoning regains its force. (P(Other C | I C) < 1).
      *   **Uncertainty about Identity:** If agents aren't *certain* they are identical (e.g., "maybe they *think* like me, but maybe not"), the logical correlation dissolves into probabilistic correlation. EDT might still recommend C if the *perceived* correlation is high enough, but it becomes a standard EDT calculation based on subjective probability, not logical necessity. The pure symmetry argument fails.
      *   **Real-World Applicability:** This is the major criticism. Perfectly identical ideal reasoners are a mathematical abstraction. In any real-world scenario involving distinct humans (or even distinct AIs with different training data/random seeds), the premise fails. The argument provides little practical guidance outside its idealized thought experiment. The weight on identity is **enormous and non-negotiable** for the pure logical correlation version.
  *   **A Weaker "Similarity" Defense:** A weaker, more pragmatic defense might argue that if agents have *strong reason to believe* they are highly similar and facing a similar agent (e.g., culturally similar humans in a well-understood context, or AIs from the same training run), they might *assign a high subjective probability* to correlation (P(Other C | I C) ≈ 1). This *is* pure EDT. It might lead to cooperation, but it abandons the "logical necessity" justification of pure superrationality and is vulnerable to exploitation by truly non-similar agents or by one agent reasoning that the other might *not* assign such a high probability.

  **Conclusion:**

  1.  **The Defense:** The strongest defense argues that for *perfectly identical ideal reasoners with mutual knowledge of this identity*, the independence assumption underlying dominance reasoning is invalidated by logical correlation. Choosing C is rational because the only possible outcomes are (C,C) or (D,D), and (C,C) is better.
  2.  **Relationship to EDT:** Superrationality, *in its calculation*, effectively collapses into Evidential Decision Theory under the premise of perfect correlation. While the *justification* (symmetry/logical necessity) might feel distinct, the decision rule aligns perfectly with EDT for this case.
  3.  **Agent Similarity:** The argument **depends critically on near-perfect identity.** "Similar enough" isn't sufficient for the pure logical correlation argument. Any deviation reduces the scenario to standard EDT based on subjective probabilities of correlation, which is a different (and much more contestable) argument, or reverts back to standard game theory where defection dominates. The superrationality defense is powerful within its extremely narrow and idealized premise but fragile and arguably irrelevant outside of it. Your friend's critique holds significant weight in any realistic interpretation of the one-shot PD, while your point about correlation invalidating the independence assumption is correct *within the confines of Hofstadter's specific thought experiment*.
