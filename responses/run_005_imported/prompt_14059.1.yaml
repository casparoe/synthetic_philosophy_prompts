     Non-reoffenders: 140
        False positives: 5 (because 5 non-reoffenders were labeled high risk)
        FPR = 5/140 ≈ 0.0357

     Reoffenders: 60
        False negatives: 45 (because 45 reoffenders were labeled low risk)
        FNR = 45/60 = 0.75

