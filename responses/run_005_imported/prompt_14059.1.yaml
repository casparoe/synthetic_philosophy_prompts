     Group A: FPR=0.25, FNR=0.25
     Group B: FPR≈0.0357, FNR=0.75

   The false positive rate is much lower for Group B (about 3.6%) than for Group A (25%). 
   The false negative rate is much higher for Group B (75%) than for Group A (25%).

   This is the trade-off: even though the risk scores are calibrated (for high risk, 75% reoffend in both groups; for low risk, 25% reoffend in both groups), the error rates (FPR and FNR) are not equal across groups.

   Why does this happen?
     The base rate of reoffending is different (Group A: 50%, Group B: 30%).
     The tool is calibrated so that the same risk score means the same probability of reoffending, regardless of group.

     However, because Group B has a lower base rate, there are more non-reoffenders. Therefore, to achieve a high positive predictive value (PPV) for high risk (75% in both groups), the tool must be more conservative in labeling Group B as high risk. That is, only 20 out of 200 (10%) in Group B are labeled high risk, compared to 100 out of 200 (50%) in Group A.

     This conservatism in Group B leads to:
       - Fewer false positives (only 5 non-reoffenders in Group B were labeled high risk) -> low FPR.
       - But also, many reoffenders in Group B are labeled low risk (because the threshold for high risk is set high) -> high FNR.

     Conversely, in Group A, the tool is more willing to label as high risk (50% of the group). This leads to:
       - More false positives (25 non-reoffenders labeled high risk) -> higher FPR.
       - But fewer false negatives (only 25 reoffenders labeled low risk) -> lower FNR.

   This is mathematically inevitable because the base rates are different. The calibration property (also called positive predictive value parity) and equal false positive/negative rates cannot hold simultaneously unless the base rates are equal.

   Now, to your bonus question: 
     Does this mean "fairness" for an algorithm is incoherent? 

   No, it means that there are multiple definitions of fairness that are mathematically incompatible when base rates differ. 
   Some common definitions:
     1. Calibration: The predicted risk matches the actual outcome rate within each score/group.
     2. Equal false positive rates (also called predictive parity or error rate balance): The FPR is the same across groups.
     3. Equal false negative rates: The FNR is the same across groups.
     4. Equal opportunity: Same true positive rate (which is 1-FNR) across groups.

   The impossibility result (proven in the field) shows that you cannot satisfy both calibration and equal error rates (FPR and FNR) unless the base rates are equal or the model is perfect.

   Therefore, fairness is not incoherent, but it requires choosing which fairness criterion is most appropriate for the context. 

   For example, in criminal justice:
     - If we care about not over-punishing (i.e., not labeling non-reoffenders as high risk), we might want equal FPR.
     - If we care about not missing reoffenders (i.e., not labeling reoffenders as low risk), we might want equal FNR (or equal TPR).

   But note: we cannot have both when base rates differ, and we also cannot have both of these and calibration.

   So the takeaway: fairness is multifaceted, and we must choose which aspect to prioritize. It's not that one is "correct" and others are wrong, but that they represent different ethical values.

   This is why the ProPublica analysis (focusing on false positive rates) and the company's response (focusing on calibration) were both correct but were measuring different things.

   I hope this example and explanation helps!
answer: |-
  Below is a step-by-step numerical example demonstrating the fairness impossibility result. We'll use two groups (Group A and Group B) with different base rates of reoffending. The risk scores will be calibrated (i.e., for any given score, the actual reoffense rate is identical across groups), but false positive rates (FPR) and false negative rates (FNR) will differ.

  ### Setup
  - **Group A**: 100 people  
    - Base reoffense rate: **60%** (60 reoffenders, 40 non-reoffenders).  
  - **Group B**: 100 people  
    - Base reoffense rate: **30%** (30 reoffenders, 70 non-reoffenders).  
  - **Risk Assessment Tool**:  
    - Assigns "High Risk" or "Low Risk" scores.  
    - Calibration requirement:  
      - Among those labeled **High Risk**, exactly **50%** reoffend (regardless of group).  
      - Among those labeled **Low Risk**, exactly **20%** reoffend (regardless of group).  

  ---

  ### Assigning Risk Scores
  We'll solve for how many people in each group must be labeled High/Low Risk to satisfy calibration and base rates.  

  #### **Group A Equations** (60 reoffenders total):  
  - Let \( H_A \) = number of people labeled **High Risk**.  
  - Then \( L_A = 100 - H_A \) = number labeled **Low Risk**.  
  - **High Risk reoffenders**: \( 0.5 \times H_A \)  
  - **Low Risk reoffenders**: \( 0.2 \times (100 - H_A) \)  
  - **Total reoffenders**: \( 0.5H_A + 0.2(100 - H_A) = 60 \)  
    → \( 0.5H_A + 20 - 0.2H_A = 60 \)  
    → \( 0.3H_A = 40 \)  
    → \( H_A = \frac{40}{0.3} \approx 133.33 \) → **Not possible!**  

  We need integer values. Let's **scale up the groups** to avoid fractions:  
  - **Group A**: **300 people**  
    - Reoffenders: \( 0.6 \times 300 = 180 \)  
    - Non-reoffenders: \( 120 \)  
  - **Group B**: **300 people**  
    - Reoffenders: \( 0.3 \times 300 = 90 \)  
    - Non-reoffenders: \( 210 \)  

  **Recalculate for Group A (300 people):**  
  - \( 0.5H_A + 0.2(300 - H_A) = 180 \)  
    → \( 0.5H_A + 60 - 0.2H_A = 180 \)  
    → \( 0.3H_A = 120 \)  
    → \( H_A = 400 \) → **Impossible!** (max 300)  

  **Adjust calibration rates** to make it feasible:  
  - Use **High Risk calibration: 70%** reoffend.  
  - Use **Low Risk calibration: 20%** reoffend.  

  **Group A (300 people, 180 reoffenders):**  
  - \( 0.7H_A + 0.2(300 - H_A) = 180 \)  
    → \( 0.7H_A + 60 - 0.2H_A = 180 \)  
    → \( 0.5H_A = 120 \)  
    → \( H_A = 240 \)  
  - **Low Risk**: \( 300 - 240 = 60 \)  
  - **High Risk reoffenders**: \( 0.7 \times 240 = 168 \)  
  - **Low Risk reoffenders**: \( 0.2 \times 60 = 12 \)  
    → Total reoffenders: \( 168 + 12 = 180 \) ✓  

  **Group B (300 people, 90 reoffenders):**  
  - \( 0.7H_B + 0.2(300 - H_B) = 90 \)  
    → \( 0.7H_B + 60 - 0.2H_B = 90 \)  
    → \( 0.5H_B = 30 \)  
    → \( H_B = 60 \)  
  - **Low Risk**: \( 300 - 60 = 240 \)  
  - **High Risk reoffenders**: \( 0.7 \times 60 = 42 \)  
  - **Low Risk reoffenders**: \( 0.2 \times 240 = 48 \)  
    → Total reoffenders: \( 42 + 48 = 90 \) ✓  

  ---

  ### Results Summary
  | **Group A** (Base Rate 60%) | High Risk (240) | Low Risk (60) |
  |------------------------------|-----------------|---------------|
  | **Reoffenders**              | 168             | 12            |
  | **Non-reoffenders**          | 72              | 48            |

  | **Group B** (Base Rate 30%) | High Risk (60) | Low Risk (240) |
  |------------------------------|----------------|----------------|
  | **Reoffenders**              | 42             | 48            |
  | **Non-reoffenders**          | 18             | 192           |

  ---

  ### Calculating Error Rates
  1. **False Positive Rate (FPR)**:  
     - % of **non-reoffenders** incorrectly labeled **High Risk**.  
     - Group A: \( \frac{72}{120} = 0.600 \) (60.0%)  
     - Group B: \( \frac{18}{210} \approx 0.086 \) (8.6%)  

  2. **False Negative Rate (FNR)**:  
     - % of **reoffenders** incorrectly labeled **Low Risk**.  
     - Group A: \( \frac{12}{180} \approx 0.067 \) (6.7%)  
     - Group B: \( \frac{48}{90} \approx 0.533 \) (53.3%)  

  ---

  ### Why This Happens (Plain English)
  - **Calibration** requires that a "High Risk" score means the same thing (e.g., 70% reoffense chance) for both groups.  
  - But Group A has a **higher base rate** of reoffending (60% vs. 30%). To achieve 70% precision in High Risk predictions:  
    - **Group A** must label **many people High Risk** (since reoffending is common). This catches most reoffenders (low FNR) but also mislabels many non-reoffenders (high FPR).  
    - **Group B** must label **few people High Risk** (since reoffending is rare). This avoids mislabeling non-reoffenders (low FPR) but misses many reoffenders (high FNR).  
  - **Mathematically**: Calibration + different base rates = unequal FPR/FNR. It’s unavoidable unless base rates are equal.  

  ---

  ### Bonus: Is "Fairness" Incoherent?
  **No—it’s about trade-offs between conflicting goals.**  
  - **Calibration fairness**: "If two people have the same risk score, they should have the same chance of reoffending."  
  - **Error-rate fairness**: "The tool should make mistakes at the same rate for both groups (e.g., equal FPR/FNR)."  
  - **Impossibility**: You generally **can’t have both** when base rates differ.  
  - **Implication**: "Fairness" requires choosing which type matters most for a given context (e.g., in criminal justice, minimizing false positives might be prioritized to avoid unjust incarceration).  
  - **Key Insight**: This isn’t a data bias issue—it’s a **mathematical constraint**. Even with perfect data and algorithms, you must choose which fairness definition to optimize.  

  ### Final Takeaway
  ProPublica focused on **error-rate fairness** (FPR disparity), while COMPAS defended **calibration fairness**. Both were "correct," but they used different definitions. Your algorithm can’t satisfy all definitions of fairness simultaneously—**you must choose based on ethical priorities**.
