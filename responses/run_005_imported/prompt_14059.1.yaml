     False positive: when a non-reoffender is labeled high risk.
     False negative: when a reoffender is labeled low risk.

   For Group A:
     Non-reoffenders: 100
        False positives: 25 (because 25 non-reoffenders were labeled high risk)
        FPR = 25/100 = 0.25

     Reoffenders: 100
        False negatives: 25 (because 25 reoffenders were labeled low risk)
        FNR = 25/100 = 0.25

