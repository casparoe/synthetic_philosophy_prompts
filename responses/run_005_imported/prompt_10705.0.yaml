answer: |-
  ## The Pasadena Price

  The neon sign outside my office window buzzed like a trapped fly, casting a sickly green glow onto the actuarial tables spread across my desk. Normally, I thrived on tables. They were islands of certainty in a probabilistic sea. But tonight, the sea had frozen over, cracked, and swallowed my compass whole. I stared at the contract for the Pasadena Game. My job was simple: Name a fair price for the privilege of playing it.

  Simple. Ha.

  "Flip a fair coin," the contract read, its clinical phrasing belying the madness within. "If heads on the first flip, you win $2. If tails then heads, you *lose* $2. If tails, tails, heads, you win $8/3 ≈ $2.67. If tails, tails, tails, heads, you *lose* $4. And so on. For sequence *n* tails followed by heads, the payoff is $(-1)^{n+1} \cdot 2^n / n$ dollars."

  It looked like St. Petersburg’s eccentric cousin. But St. Petersburg, for all its infinite expectation, was straightforwardly *big*. This? This was… slippery.

  My initial simulations were chaos. One run: Player wins $2. Another: loses $2. Then wins $8/3. Then loses $4. Then wins $32/5 = $6.40. Then loses $64/6 ≈ $10.67. The magnitudes ballooned erratically, the signs flipping like a manic switchboard. No discernible pattern, no convergence of the average. Just… noise.

  Then I started calculating the *expected value*. The sum:
  `E = (1/2)*2 + (1/4)*(-2) + (1/8)*(8/3) + (1/16)*(-4) + (1/32)*(32/5) + ...`
  `= 1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6 + ...`

  The alternating harmonic series. Conditionally convergent. My blood ran cold. Riemann’s Rearrangement Theorem wasn't just abstract math here; it was the guillotine blade hovering over my professional neck. Rearrange the terms? You change the sum. Want the expectation to be $10? Possible. Want it to be -$100? Also possible. Want it to diverge to positive infinity? Or oscillate forever? Child's play. The fair price depended entirely on the *order* you decided to sum the infinite possibilities. And there was no privileged order. No "correct" sequence.

  The coin flips didn't care about order! They just happened! How could the *value* depend on how I chose to *count* the outcomes after the fact? It felt like a betrayal of everything probability stood for. Expectation wasn't supposed to be *negotiable*. It was supposed to be the North Star.

  A knock shattered the silence. Mortimer "Mo" Finnegan, the high-stakes gambler who’d commissioned the game, filled the doorway. His suit cost more than my monthly rent; his smile was shark-like. "Well, Actuary? What's the damage? What's my fair price to play?"

  I pushed the contract towards him, my finger trembling slightly on the payoff structure. "Mr. Finnegan... Mo... the game. It's... mathematically problematic."

  "Problematic?" His smile didn't waver. "Numbers are numbers. Spit it out. What do I charge?"

  "There is no single fair price," I said, the words tasting like ash.

  He laughed, a short, sharp bark. "Don't give me that philosopher crap. I paid you for a number. Give me a number."

  I took a breath. "Based on the natural order of the flips – heads first, then tails-heads, then tails-tails-heads, and so on – the sum *suggests*..." I hesitated, knowing how flimsy it was, "...around $0.69. The natural logarithm of 2."

  "69 cents?" He snorted. "For a game that could pay out tens of thousands? You think I'm running a charity?"

  "But if we consider the outcomes grouped differently..." I scrambled, pulling up a different summation on my screen. "Look, if I sum the positive terms first: 1 (from $2 win) + 1/3 (from $8/3 win) + 1/5 (from $32/5 win) + ... This *diverges* to infinity! So, theoretically, the expectation is infinite! You could charge millions!"

  Mo's eyes lit up momentarily, then narrowed. "Millions? Now you're talking. But wait..." He jabbed a finger at the screen. "What about those nasty negative bits? The -1/2, -1/4, -1/6...?"

  "That's the problem," I said, desperation creeping in. "If I sum *those* first: -1/2 -1/4 -1/6 - ... that diverges to *negative* infinity. So expectation is *minus* infinity. You'd have to pay someone to play!"

  Mo leaned back, the shark-smile gone, replaced by cold calculation. "So... you're telling me depending on how some egghead in an office *thinks* about the order of flips that haven't happened yet, my game is either worth millions, or I should be paying suckers to take it off my hands, or... 69 cents?" He picked up the contract, his knuckles white. "That's not a price. That's a confession of ignorance."

  "It's the nature of the game, Mo!" I pleaded. "The expectation isn't defined! It's not infinite, it's... indeterminate. It depends on the summation order, and there's no *right* order!"

  "Indeterminate." He rolled the word around his mouth like a bad oyster. "In my world, indeterminate means useless." He stood up, tucking the contract into his inside pocket. "You can't give me a number. That means *any* price I set is unfair, one way or another. Or fair, depending on how you squint at infinity." He paused at the door, the buzzing neon framing him in green. "Can't run a business on that. Game's dead. Thanks for nothing, Actuary. Send the invoice for your... *consultation*."

  The door clicked shut. Silence rushed back in, louder than the neon buzz. My pristine actuarial tables mocked me. The Pasadena Game sat on my desk, not as a contract, but as a monument to failure. Not a failure of calculation, but a failure of the very concept I’d built my career upon. I hadn't just failed to find the fair price; I'd proven, in the cold light of alternating signs and conditional convergence, that *there was no such thing*. Expectation, the bedrock of rational choice, had crumbled into an infinity of contradictory possibilities, leaving only the echo of Mo’s footsteps and the hollow hum of the void where certainty used to be. What price do you put on that? The answer, it turned out, depended on how you chose to ask the question. And that was the most unsettling price of all.
