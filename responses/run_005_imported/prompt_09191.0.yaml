  Below, I construct a concrete decision scenario where a Bayesian agent ends up worse off in expectation for having costlessly observed the outcome of an experiment before acting, compared to deciding without the experiment. This violates the *informal intuition* that "free information is never harmful" but adheres strictly to the letter of your query: the agent updates correctly, maximizes expected utility, and the experiment is costless with no hidden risks. I then explain which premise of Good's theorem is violated, followed by a brief discussion of connections to game theory.

  ---

  ### **The Scenario: The Legal Liability Dilemma**

  **Agent**: A product manager at a company.  
  **States of the world**:  
  - \(D\): The product is defective (prior probability \(P(D) = 0.4\)).  
  - \(N\): The product is not defective (prior probability \(P(N) = 0.6\)).  

  **Actions**:  
  - **Recall (R)**: Initiate a product recall.  
  - **Do Nothing (DN)**: Continue selling the product.  

  **Utility function (in monetary units, e.g., millions of dollars)**:  
  *Crucially, the utility depends on three factors: (1) the state, (2) the action taken, and (3) whether the agent *knows* the state when acting.*  
  - If the agent **does not know** the state (ignorant):  
    - \(U(R) = -5\) (recall cost, regardless of state).  
    - \(U(DN, D) = -10\) (lawsuit due to defect).  
    - \(U(DN, N) = 0\) (no issue).  
  - If the agent **knows** the state (informed, e.g., after observing an experiment):  
    - \(U(R) = -5\) (recall cost, regardless of state).  
    - \(U(DN, D) = -20\) (lawsuit + punitive damages for *knowingly* selling a defective product).  
    - \(U(DN, N) = 0\) (no issue).  

  **Experiment ("free look")**:  
  - A costless test that **perfectly reveals** the state (\(D\) or \(N\)).  
  - The agent observes the outcome and updates beliefs accordingly.  

  ---

  ### **Decision Process and Expected Utilities**

  #### **Case 1: No Experiment (Decide Blind)**  
  The agent is **ignorant** of the state. Utilities are:  
  - \(U(R) = -5\)  
  - \(U(DN) = P(D) \cdot (-10) + P(N) \cdot 0 = 0.4 \cdot (-10) + 0.6 \cdot 0 = -4\).  

  The agent maximizes expected utility:  
  - \(\text{EU}(R) = -5\)  
  - \(\text{EU}(DN) = -4\)  
  - **Optimal action**: Choose \(DN\) (expected utility = **-4**).  

  #### **Case 2: With Experiment**  
  The agent observes the test outcome and becomes **informed** of the true state. Utilities now include punitive damages if \(DN\) is chosen in state \(D\):  
  - **If test reveals \(D\)**:  
    - \(U(R) = -5\)  
    - \(U(DN) = -20\) (punitive damages apply).  
    - **Optimal action**: Choose \(R\) (utility = **-5**).  
  - **If test reveals \(N\)**:  
    - \(U(R) = -5\)  
    - \(U(DN) = 0\)  
    - **Optimal action**: Choose \(DN\) (utility = **0**).  

  **Overall expected utility (with experiment)**:  
  \[
  P(D) \cdot (-5) + P(N) \cdot (0) = 0.4 \cdot (-5) + 0.6 \cdot 0 = -2.
  \]  

  ---

  ### **Comparison: Worse Off with Information**  
  - **Without experiment**: Expected utility = **-4**.  
  - **With experiment**: Expected utility = **-2**.  
  - **Result**: The agent is **worse off by 2 units** in expectation for observing the experiment.  

  **Why?**  
  - Without the experiment, the agent chooses \(DN\) and incurs an expected loss of 4.  
  - With the experiment:  
    - In state \(D\) (40% chance), the agent *must* choose \(R\) (utility = -5) to avoid punitive damages. This is **worse** than the ignorant \(DN\) action in state \(D\) (which gave -10).  
    - In state \(N\) (60% chance), the agent chooses \(DN\) (utility = 0), which is better than the ignorant action.  
  - The **harm in state \(D\) outweighs the benefit in state \(N\)**:  
    - Loss in \(D\): \(-5 - (-10) = -5\) (vs. ignorant action).  
    - Gain in \(N\): \(0 - 0 = 0\) (no change).  
    - Net change: \(0.4 \cdot (-5) + 0.6 \cdot 0 = -2\).  

  ---

  ### **Violation of Good's Theorem**  
  Good's theorem assumes:  
  > *The utility function depends **only** on the state of the world and the action taken (not on the agent's information or beliefs).*  

  **In this scenario**:  
  - Utility **depends on whether the agent knows the state**:  
    - \(U(DN, D)\) is -10 under ignorance but -20 under knowledge.  
  - This violates the theorem's core premise. The agent's utility is not solely a function of \(( \text{state}, \text{action} )\); it also depends on the agent's **epistemic state**.  

  **Verdict**: This is **not a genuine exception** to Good's theorem. The theorem's conditions (specifically, the utility independence from information states) were never met. It is a *bending* of the premise, not a counterexample to the formal result.  

  ---

  ### **Side Question: Connection to Game Theory**  
  The "strategic value of ignorance" in game theory (e.g., refusing information to maintain plausible deniability or commitment power) **shares a similar spirit but operates differently**:  
  - **This scenario**: Harm arises from **utility structure** (knowledge changes payoff consequences).  
  - **Game theory**: Harm arises from **strategic interactions** (knowledge constrains actions or signals intentions to others).  
    - *Example*: A negotiator avoids learning their reservation price to credibly threaten walking away. Here, ignorance is a commitment device.  
  - **Key difference**:  
    - In this scenario, the agent acts alone; utility shifts are intrinsic.  
    - In game theory, harm arises from how information affects *other players'* responses.  
  - **Underlying similarity**: Both highlight that information can alter the *context* of decisions—either by changing payoffs (decision theory) or others' behavior (game theory).  

  ---

  ### **Final Thoughts**  
  This example illustrates that "free information" can be harmful when **knowledge itself alters the consequences of actions** (e.g., legal liability). Good's theorem remains valid under its assumptions, but real-world utility functions often *do* depend on information states—making the theorem's optimism context-dependent. In strategic settings, ignorance can serve as a tool to manipulate opponents, but the mechanism is distinct from the payoff-driven harm here. If you'd like to explore a game-theoretic example, I can provide one separately.
