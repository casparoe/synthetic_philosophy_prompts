   I am convinced that within the standard Bayesian decision theory with utilities that depend only on the state and action, and with the same action set available before and after the experiment, the value of information is nonnegative. Therefore, any counterexample must violate one of these conditions.

   So for the purpose of this response, I will provide the legal example but with a twist to make the numbers work.

   Example: 
     State: D or N.
     Let the recall cost C be very high: specifically, C = 3 million.
     The cost of a lawsuit if the product is defective and the agent is ignorant: L = 1 million.
     The cost if the agent is informed and still does nothing and the product is defective: L + P = 1 + 10 = 11 million.
     Prior: P(D) = p = 0.5.

     Without experiment (ignorant):
          EU(DN) = 0.5 * (-1) + 0.5 * 0 = -0.5 million.
          EU(R) = -3 million.
          So choose DN: -0.5 million.

     With experiment (informed):
          If state D: 
              choices: 
                  R: -3 million
                  DN: -11 million
              so choose R: -3 million.
          If state N:
              choices:
                  R: -3 million
                  DN: 0
              so choose DN: 0.
          EU = 0.5 * (-3) + 0.5 * 0 = -1.5 million.

     -1.5 < -0.5, so the agent is worse off by 1 million in expectation.

     This is because when the experiment reveals state N, the agent saves money by not recalling, but when it reveals state D, the agent is forced to recall at a cost of 3 million, whereas in the ignorant case in state D, they only paid 1 million. 

     But note: in the informed case in state D, the agent could choose DN and pay 11 million, but that is worse than R. So they choose R and pay 3 million, which is more than 1 million.

     Therefore, the expected cost is higher with the experiment.

     The condition that is violated is that the utility function depends on the information state of the agent. Specifically, the cost of DN in state D is 1 million if ignorant and 11 million if informed.

     This is a genuine violation of the conditions of Good's theorem, which requires that the utility function depend only on the state of the world and the action taken, not on the information state of the agent.

     So in summary, the example is:

          States: D (defective) with probability 0.5, N (not) with probability 0.5.
          Actions: R (recall) or DN (do nothing).
          Utility function (in million $):
              If the agent is ignorant:
                  R: -3 in both states.
                  DN: -1 if state=D, 0 if state=N.
              If the agent is informed:
                  R: -3 in both states.
                  DN: -11 if state=D, 0 if state=N.

          The experiment perfectly reveals the state.

     This is a valid counterexample to the informal claim that "free information is never harmful", but it does not contradict Good's theorem because the theorem assumes the utility function does not change with the information state.

     So it is a case where the conditions of the theorem are not met.

     Now, for the side question: the strategic value of ignorance in game theory.

     In game theory, there are situations where a player might prefer not to know some information because it might force them to take an action that leaks information to others or because it might constrain their ability to bluff. For example, in a poker game, if you don't look at your cards, you can bluff more effectively because you don't give away tells. This is a different mechanism because it involves the information being revealed to other players through your subsequent actions or behavior. In our example above, the harm came from a change in the utility function based on your knowledge. In the game theory setting, the utility function might remain the same, but the equilibrium changes because of the information structure.

     So it is a different phenomenon, but both illustrate that information can have downsides in structured settings.

     In summary, the example provided bends the condition that the utility function depends only on the state and the action.
