answer: |-
  ## Imperfect Circles

  The fire in the grate spat feebly, casting long, wavering shadows across the worn oak of Thomas Hobbes’s desk. At ninety-one, the cold seeped into his bones like water into cracked stone. But the chill gnawing deepest wasn’t from the Derbyshire winter; it was the persistent, icy doubt John Wallis had spent twenty-five years seeding in the fertile ground of Hobbes’s certainty. Doubt about circles. About squares. About the very foundations of knowledge.

  He smoothed the vellum before him, the geometric diagram stark in the candlelight. Lines. Arcs. Points. *His* points, *his* lines. **That was the heart of it.** Geometry wasn't discovered like some hidden continent; it was *constructed*, brick by logical brick, by the human mind. We define the point, the line, the circle. Therefore, their properties, deduced through irrefutable reason, possessed absolute certainty. It was the only science immune to the fog of sense and the chaos of opinion.

  His gnarled finger traced the circumference of the circle he’d drawn. *And if we can construct the state,* he thought, the familiar argument surging with renewed vigor against the tide of his fatigue, *if we, through covenant and reason, erect the Leviathan – that artificial man, that mortal god – then its workings, too, must be knowable with the same geometric rigor.* Order from chaos. Certainty from contract. The circle of sovereignty, squared by human reason.

  Yet here lay the persistent flaw. The *actual* squaring. This diagram… this latest attempt. He *knew* it was right. He *felt* the clean lines locking into place, the circle yielding its secret area to the precisely constructed square. Wallis’s sneering critiques – pamphlets piled like kindling beside the hearth – were mere noise. Petty envy from a man who couldn’t grasp the *philosophical* necessity of the thing. Wallis saw only numbers, calculations; he was blind to the *constructive reason* that made geometry, and by extension, true political science, possible.

  A memory intruded: Wallis’s latest broadside, delivered months ago but still raw. Not just pointing out the algebraic impossibility (Hobbes dismissed algebra as a mere tool, inferior to synthetic geometry), but mocking the *hubris*. “The Grand Architect of Malmesbury,” Wallis had written, “mistakes the scratching of his quill for the compass of the Divine Geometer.” The insult burned, not for its personal jab, but for its implication: that Hobbes’s fundamental premise – human reason constructing perfect, knowable objects – was flawed.

  He dipped his quill, the ink black as the night pressing against the window. His hand trembled, betraying the frailty his mind refused to acknowledge. He adjusted the line *here*, extended the arc *there*. Yes. *This* adjustment accounted for the infinitesimal discrepancy Wallis harped on about. It was a matter of precision in construction, not a failure of principle. The circle *was* constructible, therefore squarable. The state *was* constructible, therefore governable by infallible laws deduced from its nature.

  A log collapsed in the hearth, sending a shower of sparks upwards. In the sudden flare, the lines on the vellum seemed to writhe. For a terrifying instant, the neat intersection he’d labored over looked… arbitrary. Like the shifting alliances of Parliament, not the fixed angles of Euclid. A cold sweat pricked his brow, unrelated to the fire.

  *If this fails… if the circle cannot be mastered by the very reason that defines it…* The thought was treasonous, unthinkable. It wasn't just about mathematics. It was about Leviathan. If the geometric objects *he* constructed could defy his own reason’s deductions, what hope was there for the vastly more complex, more passionate construct of the Commonwealth? Could the sovereign’s power, rationally derived, truly guarantee peace? Or was it, too, perpetually vulnerable to some hidden, irrational flaw, some Wallis of political chaos waiting to expose its contradictions?

  He slammed his fist on the desk, a dry, papery sound. The inkwell jumped. "No!" The word rasped in the quiet room. Wallis was wrong. The critics were fools. The flaw wasn't in the principle, only in his execution *this time*. Geometry *was* certain. The state *could* be known. He *had* squared the circle. He just needed to draw it right. To *construct* it perfectly.

  With fierce concentration, ignoring the tremor, ignoring the icy doubt, ignoring the ghost of Wallis’s laughter that seemed to echo in the crackle of the dying fire, Thomas Hobbes bent once more over the vellum. His quill scratched furiously, redrawing the lines, reinforcing the angles, chasing the perfect, knowable shape that would vindicate not just his geometry, but his entire vision of a world made certain by human reason. The circle *had* to yield. Everything depended on it. Outside, the snow fell silently, covering the imperfect world in a temporary, deceptively perfect, white geometry. Inside, the stubborn architect built his impossible proof, brick by crumbling brick.

  **Author's Note:** This story focuses on Hobbes's internal struggle near the end of his life, emphasizing the profound philosophical stakes he attached to the geometric problem. His physical frailty contrasts with his mental stubbornness, and the ever-present shadow of Wallis represents the threat to his core belief: that humanly constructed systems (geometry, the state) are inherently knowable and perfectible through reason. The failure to square the circle becomes a deeply personal symbol of a potential crack in the foundation of his life's work.
