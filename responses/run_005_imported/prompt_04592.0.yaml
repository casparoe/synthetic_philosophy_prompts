reasoning: |-
  We are evaluating the student union's disciplinary code against Fuller's eight principles of the inner morality of law. Let's go through each principle one by one, assigning a score from 1 to 10 and providing a brief justification.

  1. **Generality**: The code applies to every student alike. This principle is about the law being general in form and not singling out individuals. The code is posted and applies to all, so it seems to meet this requirement. However, in practice, the outcomes are influenced by personal standing, which might be a concern for the spirit of the principle. But the principle of generality is about the form of the rules, not their application. So, the form is general.

     Score: 8 (It is general in form, but the application issues will be considered in congruence.)

  2. **Promulgation**: The code is posted on the union's website. This principle requires that laws be made known to those subject to them. The fact that it is posted online is good for promulgation. However, the drafting is so dense that most students need help to understand it. Fuller would argue that promulgation requires not just publication but also that the law be understandable. If the law is too complex for the average person to comprehend, it may not be adequately promulgated.

     Score: 5 (It is published but not accessible due to complexity.)

  3. **Non-retroactivity (Prospectivity)**: The principle is that laws should be prospective, not retroactive. The case describes a mid-term revision that was applied to a case that had arisen weeks before the change. This is a clear instance of retroactive application.

     Score: 1 (Clear retroactive application.)

  4. **Clarity**: The rules must be clear and intelligible. The drafting is described as dense, requiring a law student to interpret. This indicates a lack of clarity.

     Score: 2 (The code is not clear and is difficult for students to understand.)

  5. **Non-contradiction**: The rules must not contradict each other. The example given is that one clause allows "collaborative review sessions" and another bans "any exchange of work product between students" without any indication of which controls. This is a direct contradiction without a resolution mechanism.

     Score: 1 (There is a clear contradiction without any hierarchy or rule to resolve it.)

  6. **Possibility of Compliance**: The rules must be such that they can be complied with. The contradiction and lack of clarity already make compliance difficult. Additionally, the retroactive changes and the short appeal window with delayed decisions might create a situation where compliance is impossible in some cases. However, the main issue here is the contradiction and the retroactivity, which might make it impossible to know what is required. The appeal deadline issue: if the decision letter takes 10-14 days to arrive and the appeal must be filed within 3 business days, then it is impossible to file an appeal if the letter arrives after the deadline.

     Score: 1 (The contradiction and the appeal process make compliance impossible in some instances.)

  7. **Constancy through Time**: The rules should not change too frequently. The code is revised every semester and once mid-term. This frequent change, especially mid-term, violates constancy.

     Score: 2 (Frequent changes, including mid-term, make the rules unstable.)

  8. **Congruence**: There should be congruence between the rules as announced and their actual administration. The private admission by two board members that outcomes track personal standing with the chair more than the published rules indicates a lack of congruence.

     Score: 1 (The rules are not applied as written; personal factors dominate.)

  Now, for the Fuller verdict: Fuller would argue that a system that fails too severely on these principles is not just a bad legal system but fails to be a legal system at all. In this case, there are multiple severe failures (especially non-retroactivity, non-contradiction, impossibility of compliance, and lack of congruence). Fuller might say that this code does not deserve to be called law because it fails to achieve the inner morality of law to such an extent that it cannot guide behavior.

  Fuller verdict: "The code fails so severely on multiple principles (especially non-retroactivity, contradiction, impossibility of compliance, and congruence) that it does not meet the minimum requirements of law in Fuller's sense."

  Hartian positivist response: Hart would separate the existence of law from its moral content. He would argue that as long as the code was enacted by the recognized procedures of the student union (the rule of recognition), it is valid law, regardless of its moral failings or its compliance with Fuller's principles. The failures make it bad law, but it is still law.

  Hart verdict: "A Hartian positivist would maintain that the code is still law because it was enacted by the student union's recognized procedures, regardless of its moral or procedural deficiencies."

