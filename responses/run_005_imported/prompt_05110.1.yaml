answer: |-
  You're absolutely right to dig into this—it's a profound question about the nature of cognition, and your roommate's dismissal misses the point entirely. Let's steelman Fodor and Pylyshyn's "Language of Thought" (LOT) hypothesis against your "LLMs refute it" intuition. I’ll argue **forcefully** that systematicity in LLMs does *not* undermine LOT’s core claims and may even reinforce them. Here’s the case:

  ---

  ### **1. LLMs Don’t "Think" Systematically—They *Imitate* Systematicity**
  Fodor/Pylyshyn’s argument hinges on **causal structure**: true systematicity requires that the *same cognitive mechanism* that allows you to think "A" *also and necessarily* allows you to think "B" (e.g., "dog bites man" → "man bites dog"). This is guaranteed only if thoughts are built from **discrete, recombinable symbols** with syntax-sensitive rules.  

  LLMs *appear* systematic, but they achieve this through **statistical correlation**, not combinatorial rules. When you prompt "the dog bit the man," and it outputs "the man bit the dog," it’s not recombining atomic symbols (DOG, MAN, BIT) in a rule-governed way. Instead, it’s pattern-matching against countless similar sentence pairs in its training data. The "systematicity" is an emergent illusion from exposure to human language—**not** evidence of internal symbol manipulation.  

  **Steelman punchline**: If you trained an LLM on a corpus where "dog bites man" appeared but "man bites dog" *never* appeared (or appeared with near-zero frequency), the model would *fail* to generate the reversed phrase fluently. Humans, by contrast, can systematically invert concepts *even for entirely novel scenarios* (e.g., "the quantum field entangled the scientist"). LOT explains this; LLMs merely statistically approximate it.

  ---

  ### **2. LLMs Lack "Symbols"—They Have Distributed, Context-Bound Vectors**
  LOT insists that cognitive symbols must be **causally efficacious**, **compositional**, and **context-independent**. For example, the symbol DOG must:  
  - Mean *the same thing* in "dog bites man" and "man bites dog,"  
  - Combine identically with other symbols (BIT, MAN) via rules.  

  LLMs don’t have this. "Dog" in "dog bites man" is a contextual embedding—a vector influenced by surrounding words. The representation for "dog" in "man bites dog" isn’t the *same symbol* reused; it’s a *different* vector warped by its position. There’s no invariant "DOG" token with fixed semantic content. This is why LLMs hallucinate: their "symbols" aren’t discrete, but probabilistic shadows of data patterns.  

  **Steelman punchline**: Fodor/Pylyshyn would argue LLMs confirm their fear—without discrete symbols, you get "systematicity" only when the training data densely covers a pattern. Humans don’t need this; we grasp inversions *causally* because we manipulate symbols. LOT survives because LLMs don’t actually have symbols—they have *approximations*.

  ---

  ### **3. Systematicity Isn’t Just About Language—It’s About Cognitive Architecture**
  Fodor/Pylyshyn’s point was never *just* about language. It was about **the structure of thought itself**: if cognition is systematic, it *must* be symbolic. For example:  
  - If you can *infer* "John loves Mary" from "Mary loves John,"  
  - Or *visualize* a rotated shape without relearning it.  

  LLMs excel at *text generation* but fail at non-linguistic systematic reasoning. Ask an LLM: *"If a sphere is left of a cube and the cube is left of a pyramid, is the sphere left of the pyramid?"* It often fails because it lacks a spatial reasoning engine with symbolic relations (LEFT-OF). Humans handle this effortlessly because our thoughts are structured relationally.  

  **Steelman punchline**: LLMs expose their own limitations—they’re statistical text predictors, not thinkers. Their "systematicity" is domain-specific (language) and data-dependent. LOT explains *why* humans exhibit domain-general systematicity: we have a symbolic architecture.

  ---

  ### **4. LLMs Are Parasitic on Human Symbolic Thought**
  LLMs didn’t invent systematicity—they *learned* it from humans. The training data is saturated with human-generated symbolic expressions. LOT argues that systematic thought *requires* a prior symbolic system to exist. LLMs are evidence *for* this: they’re possible only because humans *already* think in a language of thought, which we externalize into language. The LLM is a mirror reflecting human systematicity—not generating it *de novo*.  

  **Steelman punchline**: If you removed all human-generated text, could an LLM bootstrap systematic thought? Almost certainly not. Humans, however, can generate systematic thought from non-symbolic inputs (e.g., inferring "object permanence" from sensory data). LOT explains this; LLMs exploit it.

  ---

  ### **Conclusion: Why LOT Survives Unscathed**
  Your gut reaction ("LLMs prove LOT wrong") conflates *output behavior* with *internal mechanism*. Fodor/Pylyshyn’s argument was never that systematic *behavior* is impossible without symbols—it’s that systematic *cognition* requires symbols. LLMs demonstrate that statistical models can *mimic* systematic output when trained on symbolic artifacts (human language), but they do so without instantiating the causal structure of thought.  

  **The steelman verdict**: LLMs are a triumph of engineering, not a refutation of LOT. They show how far statistical approximation can go, but they also reveal the chasm between pattern-matching and genuine combinatorial thought. Fodor and Pylyshyn’s core argument—that systematicity *must* arise from a symbolic architecture—stands stronger than ever, precisely because LLMs, despite their power, fail to replicate human-like thought *when the statistics run out*.  

  So, no—your reaction *was* too quick. This rabbit hole goes deeper.
