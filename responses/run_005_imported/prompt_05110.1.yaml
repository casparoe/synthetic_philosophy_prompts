prompt: |-
  Ok this has been rattling around in my head for like two weeks now and I need to get it out of my system, because I tried explaining it to my roommate and he just said "who cares, it writes fine," which isn't really engaging with the actual problem. So, I use AI chatbots like you all day for work, and one night I went down a total rabbit hole reading about this old debate in philosophy of mind. There's this guy Fodor (and another guy, Pylyshyn) who argued back in the 80s that thinking has to happen in an actual symbolic "language of thought" in your head, with its own grammar, because human thought is "systematic" — like, anyone who can think "the dog bit the man" can automatically also think "the man bit the dog," since your mind is just recombining the exact same building blocks (DOG, MAN, BIT) into a new arrangement. Their big point, as far as I can tell, was that only a system built out of actual symbols with rules for combining them gets you that for free, whereas a plain neural network — just a big pile of weighted connections with no symbols wired in anywhere — would have to somehow learn each sentence pattern seperately, case by case, with nothing guaranteeing systematicity, so at best its faking it, not really doing it.

  Except now there's you: an LLM, which as far as I understand is basically a giant neural net with no grammar rules or symbols hand-coded in anywhere, and you crank out perfectly systematic, novel sentences constantly, way more fluently than any human could. My gut reaction was "well that settles it, Fodor and Pylyshyn were just wrong, you obviously don't need a language of thought to get systematic thought, a good enough statistical pattern-matcher does the job fine." But I've learned the hard way not to trust my gut on stuff I never studied formally. So here's what I actually want from you: don't just validate my reaction. Argue the other side as hard as you honestly can — make the strongest real case that the language-of-thought argument survives LLMs just fine, and that my "well, LLMs settle it" reaction above is too quick. Steelman the side I'm currently not on, and please don't hedge into a "both sides have some merit" cop-out at the end.
