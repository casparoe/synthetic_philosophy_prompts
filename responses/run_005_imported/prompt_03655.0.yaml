prompt: |-
  So this actually happened at my building's tenant committee meeting, of all places. We've always picked stuff like where to hold the summer bbq by plain plurality vote -- everyone picks one option, most votes wins. But people kept complaining about "vote splitting," like two similar park options would split votes and let a widely disliked third option sneak through. So my neighbor Dave pushed for switching to ranked-choice (instant runoff) voting instead, arguing it basically solves strategic voting, since you can rank your genuine favorite #1 without worrying you're wasting your vote -- it just falls through to your next pick if your favorite gets eliminated.

  Another neighbor, Priya, who took some game theory in grad school, said that's not really right -- she half remembered a theorem (Gibbard-Satterthwaite, she thought?) proving that literally any voting rule with 3+ options can be strategically gamed by somebody, so ranked-choice doesn't actually fix the underlying issue, it just moves it around.

  Dave said he thought that theorem was about combining everyone's rankings into one fair social ranking, like Arrow's thing, not about whether an individual voter can lie about their own preferences -- so it might not even be the right theorem to cite here.

  Priya said no, this one's specifically about individual manipulation, not aggregation, and it covers pretty much any non-dictatorial rule you could design, ranked-choice included.

  Dave then said ok fine, but even if it's "gameable" in some contrived edge case, doesn't RCV still massively cut down how often anyone actually has an incentive to vote dishonestly, compared to plurality? isn't that a real improvement even if it's not a perfect fix?

  Priya agreed it probably helps with some plurality-specific issues, but said Dave's original pitch -- that ranked-choice "solves" strategic voting -- was importantly overstated, and pointed out RCV can introduce its own weird failure modes, like a candidate straight up loosing because voters ranked them higher.

  Now half the committee thinks Priya "won" and the other half thinks she was just being pedantic over a group bbq. can you go through this move by move and say who's got the better of it at each point, not just who wins overall? Also flag anything you think both of them are missing.
reasoning: |-
  Okay, let me tackle this tenant committee debate step by step. The user wants a move-by-move analysis of Dave and Priya's argument about ranked-choice voting, plus any missed points. 

  First, Dave's initial claim that RCV "solves" strategic voting seems overconfident. Priya correctly counters with Gibbard-Satterthwaite theorem - I recall it proves all voting systems with ≥3 options are manipulable. But Dave's right that it's different from Arrow's theorem; Arrow's about ranking consistency while GS is about individual incentive to lie. 

  Hmm... Priya's on solid ground citing GS, but Dave makes a practical point: even if not perfect, RCV reduces strategic voting frequency. Both valid perspectives - Priya's theoretical correctness vs Dave's real-world improvement angle. 

  The "candidate losing from higher rankings" example Priya mentions is likely the monotonicity failure in RCV. Classic case: candidate A loses when ranked first by more voters, but wins when some demote A to second. Weird but real. 

  What's missing? Neither mentioned that:
  - RCV handles vote-splitting better but creates new strategic dilemmas (like bullet voting)
  - GS theorem assumes voters know others' preferences (unrealistic in BBQ planning)
  - For simple decisions, complexity may outweigh benefits
  - Hybrid approaches like approval voting exist

  The committee polarization is understandable - Priya wins on theory, Dave on practicality. But framing it as "who won" misses that both added value. Maybe suggest testing RCV for one event as compromise?
answer: |-
  Let's break down this debate move-by-move, evaluating the accuracy and strength of each argument:

  ### Move 1: Dave's Proposal
  * **Claim:** Ranked-choice voting (RCV) "solves" strategic voting by letting voters rank their genuine favorite #1 without wasting their vote.
  * **Assessment:** **Overstated/Partially Misleading.**  
    * *Strength:* RCV *does* mitigate the *specific* "spoiler effect" and vote-splitting common in plurality voting. Voters *can* safely rank a long-shot first.
    * *Weakness:* It **does not "solve" strategic voting.** Gibbard-Satterthwaite (GS) proves this is impossible for any non-dictatorial system with ≥3 options. RCV introduces *different* strategic incentives (e.g., "compromising" or "burying" rivals).

  ### Move 2: Priya's Rebuttal
  * **Claim:** Gibbard-Satterthwaite theorem shows *any* voting rule with 3+ options can be manipulated strategically. RCV doesn't fix the core issue.
  * **Assessment:** **Largely Correct.**  
    * *Strength:* Priya accurately identifies the **Gibbard-Satterthwaite theorem** (not Arrow's, which is about social welfare functions). GS *specifically* proves that *every* voting system satisfying minimal fairness criteria is vulnerable to **tactical voting** by individuals misrepresenting preferences. This applies directly to RCV.
    * *Weakness:* None significant here. She correctly distinguishes GS from Arrow.

  ### Move 3: Dave's Counter
  * **Claim:** GS is about "fair social ranking" (like Arrow), not individual manipulation. Might be the wrong theorem.
  * **Assessment:** **Incorrect.**  
    * *Weakness:* Dave confuses Arrow’s Impossibility Theorem (which *is* about aggregating rankings into a social preference order) with **Gibbard-Satterthwaite**, which explicitly addresses **strategy-proofness** (i.e., whether individuals can benefit by lying). Priya is right on the theorem’s focus.

  ### Move 4: Priya's Clarification
  * **Claim:** GS covers individual manipulation of *any* non-dictatorial rule, including RCV.
  * **Assessment:** **Correct.**  
    * *Strength:* GS states that for ≥3 options, the *only* strategy-proof voting rules are dictatorial (one voter decides) or impose unacceptable restrictions (like only two allowed preferences). RCV is non-dictatorial → manipulable. Priya nails this.

  ### Move 5: Dave's Pragmatic Point
  * **Claim:** Even if theoretically gameable, RCV still *reduces* strategic incentives in practice compared to plurality. That’s a real improvement.
  * **Assessment:** **Strong/Valid.**  
    * *Strength:* Dave shifts to practical impact. RCV *does* eliminate spoiler effects (e.g., Nader splitting Gore’s vote in 2000) and allows expressive voting. Evidence shows it **reduces but doesn’t eliminate** strategic voting. This is a fair counter to Priya’s purism.

  ### Move 6: Priya's Concession & Nuance
  * **Claim:** Agrees RCV helps with plurality-specific issues but insists Dave overstated "solving" strategy. Notes RCV can cause new failures (e.g., a candidate losing from higher rankings).
  * **Assessment:** **Mostly Correct & Nuanced.**  
    * *Strength:*  
      - Rightly calls out Dave’s original "solves" claim as hyperbolic.  
      - Correctly identifies **non-monotonicity** as a key RCV flaw: A candidate can *lose* when voters rank them *higher* (e.g., if their first-choice votes cause a stronger rival to be eliminated too early).  
    * *Weakness:* Doesn’t acknowledge that monotonicity failures are *rare* in real elections.

  ---

  ### Who "Wins" Each Move?
  1. **Dave (Move 1):** Weak – oversells RCV. ❌  
  2. **Priya (Move 2):** Strong – correct on theory. ✅  
  3. **Dave (Move 3):** Weak – mischaracterizes GS. ❌  
  4. **Priya (Move 4):** Strong – clarifies GS perfectly. ✅  
  5. **Dave (Move 5):** Strong – valid practical argument. ✅  
  6. **Priya (Move 6):** Strong – balances theory/practice and flags RCV quirks. ✅  

  **Overall:** Priya wins on theoretical rigor (GS is decisive), but Dave scores on practical trade-offs. Priya’s final point about non-monotonicity is a critical nuance Dave ignored.

  ---

  ### Key Points Both Missed
  1. **Complexity vs. Benefit:** For low-stakes decisions (like a BBQ location), RCV’s complexity may outweigh benefits. Simpler systems (e.g., **approval voting**) could suffice.  
  2. **Frequency of Manipulation:** GS proves manipulation *can* happen, not that it *will* in every election. RCV makes it harder and rarer than plurality.  
  3. **Information Requirements:** Strategic voting in RCV often requires voters to predict others’ preferences – unrealistic for casual decisions.  
  4. **Alternatives:** Approval voting (vote for all options you like) avoids vote-splitting *and* monotonicity failures, while being simpler than RCV.  
  5. **"Winning" Misconception:** The committee’s polarization reflects a false binary. *Both* are right: RCV is better than plurality but not strategy-proof.  

  ### Recommendation for the Committee
  Acknowledge Priya’s theoretical correctness but adopt RCV *as an improvement* over plurality for the BBQ vote. Test it once and compare feedback. For higher-stakes decisions, explore simpler systems like approval voting. Avoid framing this as a "win/loss" – both perspectives added value.
