prompt: |-
  my grandpa passed away this spring and while we were cleaning out his house we found his draft notice from 1945 - he was set to ship out for the invasion of Japan when the bombs dropped instead, and he always used to say, pretty matter-of-fact about it, that Truman's decision is the reason he lived long enough to have kids and grandkids (me included). kind of a weird thing to sit with tbh. anyway i went down a rabbit hole and found out Anscombe actually tried to stop Oxford from giving Truman an honorary degree over this back in the 50s (got voted down by her own colleagues for it), and her real argument turns out to be way more specific than "the bomb was bad" - it's that targeting civilians to force a surrender without needing a land invasion means you intended their deaths as the means to your end, not just foresaw them as a side effect, so double effect can't cover it no matter how many invasion deaths it supposedly avoided. which, again, is literally my grandpas exact case, so that's fun.

  can you write me a dialogue between an Anscombe-style absolutist and someone defending Truman's decision on lesser-evil consequentialist grounds? i want an actual back and forth, not two people just parking their positions next to each other - the consequentialist should really engage with the intention/foreseen distinction instead of dodging it, and the Anscombean should have to deal with the "but doing nothing would've killed way more people" objection instead of just repeating "it's murder" over and over. have them each genuinely try to get the other to budge, or at least pin down exactly where they stop agreeing.
