  First, I need to recall the setup of both theorems. The 1955 theorem uses Pareto indifference and vNM axioms for individual and social preferences. The conclusion is a weighted sum of individual utilities. The issue is that vNM utilities are only unique up to affine transformations, so each individual's utility scale can be rescaled independently. The weights in the additive representation aren't fixed; they change when utilities are rescaled. So the social welfare function isn't invariant to these transformations, meaning the weights don't have interpersonal meaning.

  The user mentioned Sen's objection here. Sen argued that without a common scale, the weights are arbitrary. Even if you normalize utilities, without comparability, the weights can't be interpreted across persons. For example, rescaling one person's utility changes the weight, so the aggregation isn't meaningful interpersonally.

  Now, the 1953 Impartial Observer Theorem introduces an impartial observer who imagines being each person with equal probability. The observer evaluates social prospects using expected utility. Here, because the observer has a single vNM utility function over all states (including which person they are), this utility naturally incorporates comparisons. The equiprobability assumption forces the observer to consider each person's welfare equally, creating a common scale. The key is that the observer's utility function is unique up to affine transformations, but since it's defined over all person-state combinations, the scaling must be consistent across persons. This allows for interpersonal comparisons because the differences in utility between being one person and another are measurable under the same scale.

  I should explain why equiprobability is crucial. It ensures that each person is treated symmetrically, leading to equal weights. The observer's risk preferences (like aversion to inequality) are embedded in their utility function. But the theorem doesn't assume interpersonal comparisons; it derives them from the observer's choices under uncertainty.

  The user wants technical precision. So I need to detail the mathematical structures: vNM axioms, affine transformations, the social welfare function's dependence on scaling. For the second theorem, the state space includes identities, and the observer's utility function on lotteries forces a unified scale. Equiprobability allows the representation to be the average of individual utilities, with the same scaling.

  I should also address potential misunderstandings. For example, the second theorem assumes the observer can imagine being anyone, which might be seen as a strong assumption. But it's necessary to establish comparability. Also, the weights in the first theorem aren't meaningful for comparing marginal utilities across people, whereas in the second, the weights are fixed by the observer's utility function.

