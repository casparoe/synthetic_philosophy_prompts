answer: |-
  To address your query with technical precision, we must dissect why Harsanyi's 1955 Social Aggregation Theorem (SAT) fails to establish *meaningful interpersonal comparability of utility* (ICIU) despite its additive form, and how the 1953 Impartial Observer Theorem (IOT) overcomes this limitation through its equiprobability device. We'll proceed step-by-step.

  ### **1. Harsanyi's 1955 Social Aggregation Theorem (SAT): The Problem of Non-Comparability**
  #### **Premises**
  - **Individual preferences**: Each person \(i\) has preferences over social prospects (lotteries) satisfying the von Neumann-Morgenstern (vNM) axioms. Thus, \(i\) has a vNM utility function \(u_i(x)\), unique up to **affine transformations** (i.e., \(u_i'(x) = a_i u_i(x) + b_i\) for \(a_i > 0\)).
  - **Social preferences**: A social planner has vNM-rational preferences over the same prospects.
  - **Pareto Indifference**: If all individuals are indifferent between two prospects, so is society.

  #### **Conclusion**
  There exist weights \(w_i \geq 0\) (not all zero) such that the social utility \(U(x)\) is:  
  \[
  U(x) = \sum_{i=1}^n w_i u_i(x)
  \]

  #### **Why ICIU Fails**
  - **Affine rescaling freedom**: For each individual \(i\), we can apply a *distinct* affine transformation:  
    \[
    \tilde{u}_i(x) = a_i u_i(x) + b_i \quad (a_i > 0).
    \]
  - **Social utility under rescaling**: Under \(\tilde{u}_i\), the same social preferences imply:  
    \[
    \tilde{U}(x) = \sum_{i=1}^n w_i \tilde{u}_i(x) = \sum_{i=1}^n w_i (a_i u_i(x) + b_i) = \sum_{i=1}^n (w_i a_i) u_i(x) + \sum_{i=1}^n w_i b_i.
    \]
    The term \(\sum w_i b_i\) is constant and irrelevant for preferences. Crucially, the new weights are \(w_i' = w_i a_i\).  
  - **Arbitrary weights**: By choosing \(a_i\) freely, we can make \(w_i'\) **any positive number** without altering observable behavior. For example:
    - Set \(a_i = 2\) for person 1: \(w_1' = 2w_1\), doubling their "weight".
    - Set \(a_j = \frac{1}{2}\) for person 2: \(w_2' = \frac{1}{2}w_2\), halving their weight.
  - **No invariant meaning**: The weights \(w_i\) are **contingent on the arbitrary scaling** of \(u_i\). They cannot represent:
    - Interpersonal comparisons (e.g., "person 1 suffers twice as much as person 2").
    - Ethical weights (e.g., "person 1 deserves twice the priority").
  - **Sen's objection formalized**: The additive form is **mathematically invariant** under *independent* rescalings of \(u_i\). Thus, the theorem only delivers a *numerical* sum, not a *normative* sum requiring comparable units.

  ---

  ### **2. Harsanyi's 1953 Impartial Observer Theorem (IOT): How Equiprobability Enables ICIU**
  #### **Premises**
  - **Extended prospects**: Prospects are pairs \((x, i)\), where \(x\) is a social state and \(i\) is the identity of the person you "become".
  - **Impartial observer**: A rational agent (observer) has vNM preferences over lotteries of the form \(\langle p, (x, i) \rangle\), where:
    - \(p\) is a lottery over social states \(x\).
    - With probability \(\frac{1}{n}\), the observer "becomes" person \(i\) and experiences their outcome.
  - **Equiprobability device**: The observer faces an equal probability \(\left(\frac{1}{n}\right)\) of becoming each person.

  #### **Conclusion**
  There exists a vNM utility function \(v(x, i)\) for the observer such that:  
  \[
  V(p) = \frac{1}{n} \sum_{i=1}^n v(x, i)
  \]
  **Crucially**, \(v(x, i)\) can be decomposed as:  
  \[
  v(x, i) = k \cdot u_i(x) + c_i \quad (k > 0 \text{ constant}, c_i \text{ constants})
  \]  
  Thus, social utility is **affinely equivalent** to the average of individual vNM utilities:  
  \[
  V(p) \propto \sum_{i=1}^n u_i(x).
  \]

  #### **How Equiprobability Solves Comparability**
  - **Single vNM scale**: The observer has **one** vNM utility function \(v(x, i)\) over all states \((x, i)\). This function is unique up to a *single* affine transformation (i.e., \(\tilde{v}(x, i) = a v(x, i) + b\) for \(a > 0\), applied *globally*).
  - **Comparability by construction**: Differences in \(v(x, i)\) across \(i\) reflect interpersonal comparisons. For example:  
    \[
    v(\text{status quo}, 1) - v(\text{status quo}, 2)
    \]  
    measures how much better it is to be person 2 than person 1 in the status quo, **on a common scale**.
  - **Role of equiprobability**:
    1. **Symmetry**: Equiprobability imposes anonymity. If we permute identities, observer preferences are unchanged.
    2. **Unique scaling**: Since \(v(x, i)\) is defined across all \((x, i)\), the scaling constants \(k\) and \(c_i\) in \(v(x, i) = k \cdot u_i(x) + c_i\) are **interpersonally linked**. Rescaling \(v\) affects all \(i\) simultaneously.  
       - Example: Doubling \(v\) (i.e., \(\tilde{v} = 2v\)) doubles \(k\) for all \(i\), preserving ratios like \(\frac{u_i(x)}{u_j(y)}\).
    3. **Expected utility forces averaging**: The observer evaluates \(\langle p, (x, i) \rangle\) by expected utility:  
       \[
       V(p) = \frac{1}{n} \sum_{i=1}^n v(x, i).
       \]  
       Equiprobability \(\left(\frac{1}{n}\right)\) is necessary for the \(\frac{1}{n}\) weight. Without equal probabilities, weights would be unequal and person-specific.
  - **Avoiding the rescaling problem**: 
    - In SAT, each \(u_i\) was scaled independently. 
    - In IOT, all \(u_i\) are embedded in the **same** function \(v(x, i)\). Rescaling \(v\) applies the *same* affine transformation to all \(i\), leaving interpersonal comparisons intact.

  ---

  ### **Key Contrast Summarized**
  | **Aspect**               | **1955 Social Aggregation Theorem**                     | **1953 Impartial Observer Theorem**               |
  |--------------------------|--------------------------------------------------------|--------------------------------------------------|
  | **Utility structure**    | Independent \(u_i\) for each person.                   | Single \(v(x, i)\) across all persons/states.    |
  | **Rescaling freedom**    | Each \(u_i\) rescaled independently (\(a_i, b_i\)).   | Global rescaling of \(v\) (\(a > 0, b\)).        |
  | **Weights**              | \(w_i\) change arbitrarily with rescaling of \(u_i\).  | Weights fixed at \(\frac{1}{n}\) by equiprobability. |
  | **ICIU achieved?**       | No. Weights are scaling artifacts.                     | Yes. \(v(x, i)\) provides common unit.           |
  | **Ethical interpretation** | Requires *external* justification for weights.        | Weights emerge from symmetry/equiprobability.    |

  ### **Why Equiprobability is Essential**
  The equiprobability assumption is not merely a normalization trick; it is the **axiomatic embodiment of impartiality**. By forcing the observer to face equal chances of being each person, it:
  - **Operationalizes the veil of ignorance**: Evaluations must be symmetric across persons.
  - **Rigidly links scaling**: The observer’s risk attitudes (e.g., inequality aversion) are captured in \(v(x, i)\), but the *scaling* of utilities across persons is disciplined by a single vNM framework.
  - **Yields an unweighted sum**: Equiprobability + linearity of vNM utilities implies the \(\frac{1}{n}\) factor, leading directly to average utilitarianism without arbitrary weights.

  In essence, IOT succeeds where SAT fails because equiprobability collapses individual vNM utilities into a **single, globally scaled utility function**, transforming formally non-comparable preferences into interpersonally comparable units. This provides the strongest formal grounding for utilitarianism within the vNM paradigm.
