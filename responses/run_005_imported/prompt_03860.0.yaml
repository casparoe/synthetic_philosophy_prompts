answer: |-
  I'll make your case rigorously, directly addressing the mechanics of money pumps and your friend's "smuggled completeness" objection. The core argument is that money-pump vulnerabilities arise from specific *procedural* failures in dynamic choice, not from the absence of VNM-rationality per se. Alternative policies can block exploitation by strategically limiting *how* choices are made, without requiring global completeness. I'll focus on two robust solutions: **Timestep-Dominant Incompleteness** (Thornley) and **Resolute Choice** (McClennen), demonstrating how each interrupts the pump's mechanics step-by-step.

  ### Core Mechanics of the Money Pump & Backward Induction
  To ground the discussion, consider a standard money pump against intransitivity:
  - **Agent's Preferences**: Intransitive cycle: \(A \prec B\), \(B \prec C\), \(C \prec A\) (where \(\prec\) denotes strict preference).
  - **Exploiter's Strategy**:
    1. **Trade 1**: Offer \(C\) for \(A\) + small payment \(ε\) (since \(C \prec A\), agent accepts).
    2. **Trade 2**: Offer \(B\) for \(C\) + \(ε\) (since \(B \prec C\), agent accepts).
    3. **Trade 3**: Offer \(A\) for \(B\) + \(ε\) (since \(A \prec B\), agent accepts).
  - **Result**: Agent ends with \(A\) (starting point) but paid \(3ε\), strictly worse off.

  **Backward induction's role**: At each step, the agent compares only *immediate* outcomes: Trade 1 (\(C + ε\) vs. keeping \(A\)) seems beneficial *now* because \(C \prec A\). The agent doesn't (or can't) account for future trades due to myopic evaluation. Crucially, backward induction *forces* acceptance if the agent:
  - (i) Re-evaluates preferences at every node.
  - (ii) Sees no link between current trade and future sequences.

  VNM-rationality blocks this by eliminating cycles. But alternatives block it by violating (i) or (ii).

  ### Case 1: Timestep-Dominant Incompleteness (Thornley)
  **The Policy**: Preferences are defined *only* over outcomes at identical timesteps. If trajectories differ in length (e.g., shutdown vs. continued operation), no preference comparison exists—a genuine gap. For same-length trajectories, standard dominance applies (e.g., if \(X\) is better than \(Y\) at every timestep, \(X \succ Y\)).

  **Blocking the Pump**: Assume the agent starts with outcome \(A\) at \(t=0\). The exploiter offers Trade 1: \(C + ε\) for \(A\).
  - **Timestep evaluation**: The agent compares:
    - Keeping \(A\): Outcome \(A\) at \(t=0\).
    - Trading for \(C + ε\): Outcome \(C\) at \(t=0\) + \(ε\).
  - **No global comparison**: Since \(A\) and \(C\) are same-timestep outcomes, the agent *can* compare them. But if \(C \prec A\), it rejects Trade 1. **The pump never starts**.

  **Addressing Wentworth & Lorell's critique**: They argue an agent might accept trades leading to a dominated trajectory "one step at a time." This fails here because:
  1. **No cross-timestep dominance**: A sequence like \(A → C → B → A\) isn't a "trajectory" in the timestep-dominant model—each outcome exists only at its own \(t\). Dominance requires same-length trajectories evaluated stepwise.
  2. **Refusal is timestep-local**: If Trade 1 is rejected because \(C \prec A\) at \(t=0\), there's no "next step" to exploit. The exploiter cannot induce a stepwise descent because gaps *prevent* compensatory trades across timesteps (e.g., no trade involving shutdown vs. continuation is ever comparable).

  **Smuggled completeness?** No. Preferences are incomplete *across timesteps* but complete *within* them. Crucially, the agent doesn't need a utility function over *histories* (e.g., no value for "\(A\) at \(t=0\) followed by \(C\) at \(t=1\)"). It only values snapshots. This is not covert VNM; it's a fragmentation of preference to avoid exploitable linkages.

  ### Case 2: Resolute Choice (McClennen)
  **The Policy**: The agent selects a *plan* (e.g., "never trade \(A\) for \(C\)") in advance and adheres to it rigidly, ignoring "better" myopic choices at later nodes.

  **Blocking the Pump**: Suppose the agent precommits to Plan \(P\): "Reject any trade starting from \(A\)."
  - **Trade 1**: Exploiter offers \(C + ε\) for \(A\). Agent rejects (per \(P\)).
  - **Pump dies immediately**.

  **Mechanics of backward induction**: Backward induction fails because:
  - At Trade 1, the agent does *not* compare \(C + ε\) vs. \(A\) in isolation. It compares:
    - *Following P*: Keep \(A\).
    - *Deviating from P*: Enter a sequence where backward induction *would* force acceptance of Trades 2 and 3, leading to \(A - 3ε\).
  - Since \(A \succ A - 3ε\), sticking to \(P\) is better *ex ante*. Crucially, this evaluation happens *only* at \(t=0\)—no re-evaluation later.

  **Smuggled completeness? Direct rebuttal**: Your friend argues that "committing to a plan requires settling every comparison." This conflates two ideas:
  1. **Plan-specific completeness**: To execute Plan \(P\), the agent must know if \(P\) satisfies its *current* preferences (e.g., "Is sticking to \(P\) better than abandoning it?"). This is a *single binary comparison* at \(t=0\), not a complete ordering over all possibilities.
  2. **No global utility function**: The agent doesn't need VNM-completeness. It only needs:
     - A rule: "Avoid paths proven exploitable (e.g., by backward induction)."
     - A meta-preference: "I resolve to follow plans that avoid strict dominance."
  - **Example**: In the "Pascal's Mugging" paradox, an agent might precommit to ignore threats below a probability threshold *without* having utilities for all improbable outcomes. Resoluteness relies on *heuristics* (e.g., "never re-evaluate"), not a comprehensive preference ordering.

  ### Why Both Policies Block Exploitation Without VNM-Rationality
  | **Policy**              | **How It Breaks Backward Induction**       | **Preference Structure**                          | **Handles "Smuggled Completeness"?**     |
  |-------------------------|-------------------------------------------|--------------------------------------------------|------------------------------------------|
  | **Timestep Dominance**  | No cross-timestep comparisons; refuses Trade 1 if locally dominated. | Complete *within* timesteps, incomplete *across* them. | Yes: No utility function over histories. |
  | **Resolute Choice**     | Precommitment overrides myopic evaluation; refuses Trade 1 to avoid path dominance. | Incomplete globally; relies on commitment rule. | Yes: Only plan-specific binary choice at \(t=0\). |

  ### Addressing the Strongest Counterarguments
  1. **"But what about state-based pumps?"**  
     Suppose the exploiter manipulates *external states* (e.g., "Trade now or I lower \(A\)'s value"). Resolute agents ignore such threats (they follow their plan). Timestep-dominant agents evaluate only *current* state changes—if the threat alters the current outcome, it might accept, but this isn't exploitation; it's a rational response to new information. Pumps require *cycles*, not coercion.

  2. **"Resoluteness requires omniscience!"**  
     Not for blocking pumps. The agent only needs to recognize that *this specific sequence* (e.g., \(A → C → B → A - 3ε\)) is dominated. This doesn't demand a complete ordering—just pattern-matching known exploits (e.g., "any cycle with payments is bad").

  3. **"Gaps allow other exploitations!"**  
     True, but irrelevant. Money-pump arguments specifically target *cyclic intransitivity*, not all failures. If gaps expose new vulnerabilities (e.g., blackmail), that’s a different debate. Thornley’s goal is shutdownability, not omnipotent robustness.

  ### Conclusion
  Money-pump arguments show that *myopic, re-evaluating* agents with incomplete/intransitive preferences are exploitable. But they **do not** prove that VNM-rationality is necessary for survival. Policies like **timestep-dominant incompleteness** and **resolute choice** block the pump by:
  - **Eliminating re-evaluation**: Resoluteness avoids backward induction entirely.
  - **Localizing preferences**: Timestep gaps prevent cross-temporal trade sequencing.  
  Neither policy requires a global utility function; both operate with strictly less than VNM-completeness. Your friend's "smuggled completeness" charge mistakes *plan fidelity* or *stepwise dominance* for axiomatic rationality—but these are *procedural shields*, not covert utility functions. Rationality isn't a monolith; agents can be robustly *pump-proof* without bowing to VNM.
