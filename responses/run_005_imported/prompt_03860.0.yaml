  First, I need to recall the money-pump scenario. The classic example involves an agent with intransitive preferences, like preferring A over B, B over C, but C over A. An exploiter can trade A for C plus a payment, then C for B plus payment, and then B for A plus payment, leaving the agent back at A but poorer. The argument is that backward induction forces the agent to accept each trade, leading to a loss. The user's friend claims that avoiding this requires complete, transitive preferences.

  The user presented two counterexamples: Thornley's preferential gaps for shutdownability and McClennen's resolute choice. Their friend countered that Thornley's approach allows stepwise domination, and resoluteness smuggles in completeness by requiring precommitment to all future choices.

  I need to address these points rigorously. For preferential gaps, I should examine Wentworth and Lorell's critique. They argue that even with gaps, an agent might accept trades that lead to a dominated outcome. But Thornley's timestep dominance might prevent this if the agent refuses any trade that doesn't improve immediate outcomes, regardless of future steps. The key is that the agent doesn't compare long-term trajectories, only immediate timesteps, so it wouldn't engage in the pump sequence.

  For resolute choice, the friend's argument is that committing to a plan requires resolving all preferences in advance. But McClennen might argue that resoluteness doesn't imply completeness; it's about sticking to a pre-chosen path without reevaluating at each node. The agent doesn't need a utility function over all outcomes, just a commitment to a specific plan. For example, choosing a meal plan in advance avoids the temptation to switch later, even if preferences change situationally.

  I should also consider other alternatives. State-dependent preferences could be a solution. If preferences change based on the state, like having coffee only in the morning, an agent might refuse trades that lead to undesirable states. This isn't incomplete preferences but state-dependence, which can be modeled without violating VNM axioms if framed correctly. But the user wants approaches that avoid completeness, so state-dependence might not fully fit unless it introduces gaps.

  Another angle: non-archimedean preferences. If some outcomes are incomparable, the agent might have a primary criterion (like survival) that trumps others. But this could lead to other exploitation risks. However, the user is focused on blocking money pumps specifically.

  The core is to show that backward induction can be circumvented. In resolute choice, the agent doesn't apply backward induction because they follow the plan. In timestep dominance, they only consider immediate actions without projecting future choices. The exploiter relies on the agent myopically accepting each step, but if the agent has a rule like "only accept trades improving current timestep," they refuse trades that don't offer immediate gain, blocking the pump.

  I need to directly tackle the "smuggled completeness" charge. For resolute choice, the commitment to a plan doesn't require a complete preference ordering over all possible plans. The agent chooses one plan based on partial preferences and sticks to it. They don't need to rank all alternatives, just select a feasible one that meets their criteria. For timestep dominance, preferences are defined per timestep, not across time, so no global completeness is needed.

  The user emphasized engaging with the pump mechanics. So, in a step-by-step trade, an agent with timestep dominance would only accept if the current state improves. Since each trade in the pump might not improve the immediate state (e.g., trading A for C when A is preferred now), they refuse. The exploiter can't start the pump.

  For resolute choice, the agent precommits to not trading at all, so they decline the first offer. Backward induction is avoided because the agent doesn't reconsider; they have a fixed policy.

  The user wants alternatives that don't covertly assume completeness. I need to ensure that both proposed methods genuinely avoid it. Resolute choice might be seen as having completeness over plans, but McClennen argues it's about dynamic consistency without static completeness. The plan is chosen with incomplete preferences, relying on a rule rather than a full utility function.

