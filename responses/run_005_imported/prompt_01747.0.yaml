answer: |-
  ## Knowledge vs. Truth: A Dialogue on Assertion Norms

  **Characters:**
  *   **Alex:** Defends the Knowledge Norm (KN): You may assert that p only if you know that p.
  *   **Blair:** Defends the Truth Norm (TN): The constitutive requirement on assertion is simply that p be true. Other epistemic constraints are derived from general conversational norms.

  **(The dialogue picks up mid-debate...)**

  **Alex:** ...so, Blair, take the lottery case. I have overwhelming statistical evidence your ticket lost – 99.999999% probability! Yet, asserting *flatly*, "Your ticket lost," before the draw feels deeply inappropriate, even irresponsible. KN explains this perfectly: I *don't know* it lost. The draw hasn't happened; there's a genuine epistemic possibility, however tiny, that it won.

  **Blair:** Hold on, Alex. I agree it sounds awful. But KN isn't the *only* explanation, or even the best one. My TN says the *only* thing inherently wrong with asserting "Your ticket lost" is if it's *false*. Here, it *might* be false, but crucially, asserting it *misleads* the hearer into thinking you have a kind of evidence you *don't* have – direct access, conclusive proof. That violates Gricean maxims, specifically Quality (don't say what you lack adequate evidence for) and Quantity (don't imply stronger warrant than you have). It’s the conversational context demanding sufficient *warrant*, not assertion itself demanding *knowledge*. Why posit a special knowledge rule when conversational pragmatics explain the oddity?

  **Alex:** Because pragmatics alone don’t capture the *specific* wrongness! Imagine I have equally overwhelming evidence – say, a reliable eyewitness report – that your car was stolen. I assert, "Your car was stolen." That feels fine, even though there's a tiny chance the witness is wrong. Why the difference? KN draws the line: in the car case, I plausibly *know* (given the evidence); in the lottery, I *fundamentally cannot know* before the draw, regardless of probability. It’s not just about *degree* of evidence, but about the *kind* of access. Lottery propositions are paradigmatic "unknowable-before-the-fact" on probabilistic grounds alone. Pragmatics explains *why* lacking knowledge is often problematic in conversation, but KN identifies the *core condition* assertion violates here.

  **Blair:** You’re conflating the *source* of the norm. The car case feels fine because my evidence meets the *conversational standard* for warrant in that context – direct testimony usually suffices. The lottery feels bad because statistical evidence, however high, often *fails* to meet the conversational standard for warrant when asserting a specific outcome, precisely because it doesn’t rule out the alternative in the way direct evidence often does. The hearer expects *elimination* of relevant alternatives. That’s a context-sensitive pragmatic demand, not a fixed knowledge requirement built into assertion itself. The core norm – "Be True!" – remains constant; the epistemic demands layered on top are flexible and pragmatic.

  **Alex:** But then explain Moorean assertions. "It's raining, but I don't know that it's raining." According to TN, as long as it *is* raining, this should be perfectly assertible. Its truth-condition is satisfied! Yet, it’s pragmatically paradoxical. It feels absurd, self-defeating, even if true. KN explains this immediately: The first conjunct "It's raining" *represents* me as knowing it's raining (because asserting p represents me as knowing p). But the second conjunct *denies* that knowledge. Hence the clash. It’s a performative contradiction inherent to the *act* of assertion under KN.

  **Blair:** TN handles that too! Asserting the first conjunct "It's raining" *conversationally implies* (via Gricean norms, especially Quality/Quantity) that I have adequate evidence, that I believe it, that I take myself to know it. The second conjunct *explicitly contradicts* those very implications. It’s a pragmatic clash between what’s *said* and what’s *conventionally implicated* by saying it. The absurdity arises from violating the conversational norms governing *how* we make true assertions informatively and cooperatively. It doesn’t require building knowledge into the *constitutive rule* of assertion itself. The core requirement – truth – is met, but the *manner* of assertion is pragmatically incoherent.

  **Alex:** That feels like a dodge, Blair. You’re pushing *all* the epistemic weight onto pragmatics. But take Jennifer Lackey’s "selfless assertion" case. Imagine a devoutly religious science teacher, steeped in evolutionary biology. She has overwhelming evidence for evolution, recognizes its strength, but due to faith, doesn't *believe* it. Yet, teaching her class, she assertively states, "Humans evolved from ancestral primates," because she knows it's true and supported by the evidence. According to KN, this assertion is *improper* – she doesn't *know* it (lacking belief). Yet, intuitively, she *should* assert it; it seems perfectly appropriate, even praiseworthy! TN handles this easily: p is true, she asserts it. The conversational norms are satisfied because she has excellent evidence and is fulfilling her role. KN stumbles here.

  **Blair:** *(Nods thoughtfully)* That *is* a challenge for KN, Alex. But let's not pretend TN escapes unscathed. *Why* is it praiseworthy? Precisely because she *prioritizes the truth and the evidence over her personal belief*. She’s adhering strictly to the core norm of assertion – say what's true – and leveraging the epistemic norms of her context (science education) that demand assertion based on public evidence. TN captures the *propriety* directly: she asserted a truth. The pragmatic norms explain *why* it’s her duty in that role. For KN, you’d have to say either a) she *does* somehow know it (straining "belief"), or b) it's a secondary propriety derived from other norms, which seems messy. Doesn't this show that *truth* is the fundamental requirement, and knowledge (requiring belief) is sometimes an *obstacle* to proper assertion?

  **Alex:** Hmm. The selfless case is tricky, I grant you. But KN might bite the bullet: her assertion *is* technically improper *qua* assertion, even if it's *pragmatically* the right thing to do in her role. Or, perhaps in contexts like science teaching, the "knowledge" norm is *relaxed* or reinterpreted in favor of asserting based on publicly verified evidence, precisely because the *goal* is conveying established truth. But doesn't your TN struggle with the *opposite*? Imagine someone *knows* p (has a justified true belief), but asserts it on the basis of a *terrible*, unreliable reason they mistakenly think is good. According to TN, as long as p is true, the assertion is kosher. But intuitively, they shouldn't assert it *that way*! KN easily explains this: they *do* know, so assertion is permissible. The bad basis might be conversationally misleading, but it doesn't violate the core norm. Your view seems to make the core norm too weak, unable to rule out assertions made on crazy grounds as long as they luck out and are true.

  **Blair:** Not at all! The person asserting on terrible grounds *violates the conversational norm of Quality* – they *don't* have adequate evidence, even if they luck into truth. They’ve misled their audience about their warrant. That’s sufficient to condemn the assertion pragmatically. The *core* norm (truth) is satisfied, but the *manner* of satisfying it is defective. Your KN, conversely, seems forced to either downplay the selfless assertion or overcomplicate the concept of knowledge. Isn’t it simpler to see assertion’s core job as contributing truths to the conversation, with epistemic and pragmatic norms governing *how* we reliably and responsibly do that job, rather than building a highly specific epistemic state like knowledge directly into its definition?

  **Alex:** Simpler? Maybe. But I think it loses the *distinctive* link between asserting and knowing. When you flat-out assert p, you *put knowledge on the line*. That’s why challenges like "How do you know?" are so directly appropriate. It’s not just "Is that true?" or "Do you have good evidence?" – it specifically questions the knowledge claim inherent in the act. The lottery case shows a gap mere truth and pragmatics can’t bridge, Moorean absurdity points to knowledge as the represented state, and even the selfless case highlights how belief is usually central to the knowledge we assert. The norms of conversation *flow from* the core nature of the act – to assert is to represent oneself as knowing.

  **Blair:** And I think you’re mistaking a frequent *correlate* for the *essence*. "How do you know?" is appropriate *because* in most contexts, asserting p *conventionally implies* you know it, as part of meeting the pragmatic demand for adequate warrant. The core commitment is to truth; the epistemic demands are contextual safeguards *for* meeting that commitment reliably. The lottery oddity arises because statistical evidence often fails contextually, Moorean absurdity is pragmatic contradiction, and the selfless case shows truth can be paramount. Truth is the fundamental aim; knowledge is a frequent, conversationally demanded *means* to achieving it reliably. Building knowledge into the constitutive rule over-intellectualizes the basic act of putting a claim forward as true. *(Leans forward)* Let's try the lottery again, but twist it...
