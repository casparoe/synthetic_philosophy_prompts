  I write historical fiction set in the English Midlands and host a small podcast in which I talk with scholars about the interior lives of novelists I admire. Next week's guest has spent her career on George Eliot's religious trajectory, and I don't want the hour to collapse into the standard "she lost her faith and became a secular humanist" summary. Draft eight to ten interview questions that push past that: I want at least one question on how translating Feuerbach's account of religion as projected human feeling reshaped Eliot's narrative method of sympathy rather than merely her private convictions, one that sets her scathing 1855 dismantling of Dr. Cumming's evangelicalism against her sympathetic treatment of preachers like Dinah Morris and Mr. Tryan and asks the guest to reconcile the two, and one that gets past the well-worn Cambridge anecdote about God, Immortality, and Duty to ask what work "Duty" is actually doing once the first two have dropped away -- and whether her meliorism amounts to more than a rebranding of Comte's Religion of Humanity. For each question, add a brief follow-up keyed to the answer the guest is most likely to give.
