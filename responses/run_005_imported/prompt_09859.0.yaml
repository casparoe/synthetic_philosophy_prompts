prompt: |-
  So I'm a phil PhD student working mostly in formal epistemology, and this term I'm in a seminar slowly working through Lewis on Humean supervenience and objective chance. We spent a session on the Principal Principle a few weeks back and I felt fine with it — your credence in A given that the chance of A is x (plus whatever admissible evidence you have) should just equal x, sure, that's intuitive enough. But then we got to the "undermining" problem, which my professor kept calling Lewis's "big bad bug," and I don't think I've actually internalized why it's a real problem for the Principle, as opposed to just being a fancy way of saying "new evidence can change your credences," which is true of literally every theory of probability and doesn't seem like a "bug" at all.

  The way I understood it from the reading: on a best-system Humean view, the chance of some event at t is fixed by the pattern of ALL the actual events in history (including stuff that occurs after t), so there can be possible continuations of history so atypical relative to a given chance distribution that a different best system would fit them better and assign different chances all along — i.e. outcomes can "undermine" the very chances that were supposedly in force when they occured. Apparently this makes info about the future inadmissible in a way that's supposed to threaten the Principal Principle itself rather than just being routine conditionalizing, and Lewis's patch was some "New Principle" move that conditions on the whole chance-theory of the world instead of just "the chance at t," to dodge the issue. Honestly I can parrot that back but I don't have a real gut feeling for why undermining is special/threatening rather than mundane, or what (if anything) we actually lose by switching to the New Principle — does it just relabel the problem, does the Humean pay some real cost here that a non-Humean about chance wouldn't? Can you walk me through the intuition in a way I could actually explain to my cohort, ideally without just re-deriving the equations at me?
reasoning: |-
  Okay, let me try to unpack this PhD student's confusion about undermining in Humean supervenience. They're working through Lewis and the Principal Principle, but the "big bad bug" of undermining isn't clicking. They see it as just "new evidence changes credences," which is normal, so why is it a problem?

  First, I need to recall the core issue. Humean supervenience says chances depend on the entire pattern of events, including the future. So if the actual history turns out weird, the best system might change, making past chances different. That's undermining. The student thinks this is just standard conditionalization, but it's deeper. 

  The Principal Principle (PP) says: credence in A given chance is x should be x. But with undermining futures, the chance of A itself could be undermined by future events. So if you learn that the chance of A is x, but also consider a future that would make the chance something else, there's a conflict. 

  Wait, but the student's point is that all evidence updates credences. So what's special here? Ah, I see. Normally, when you learn new evidence, you update by conditionalizing. But undermining isn't about normal evidence. It's about the chance theory itself being dependent on future events. So when you have a possible future that undermines the current chance, it's not just changing your belief about A; it's making the chance assignment at time t inconsistent with the future. 

  Lewis's New Principle tries to fix this by conditioning on the entire chance theory, not just the chance at t. But the student wonders if this is just relabeling. Does the Humean pay a cost here? 

  I think the key is that under Humeanism, chances aren't fundamental. They're summaries of patterns. So when a future event undermines the chance, it's revealing that the pattern wasn't what we thought. But the problem for PP is that if you condition on the chance being x, and also consider an undermining future, PP might give inconsistent advice. 

  For example, suppose at t, chance of heads is 0.5. But there's a tiny chance of an undermining future where, say, coins land heads 100% of the time, making the best system different. PP says your credence in heads now should be 0.5. But if you consider that tiny chance of the undermining future, it might suggest a different credence. That's the tension. 

  The New Principle avoids this by saying: condition on the whole chance theory. So instead of "chance at t is x," you say "the correct chance theory H is true." Then your credence in A given H should align with H's chances. Since H specifies chances at all times, including how they evolve, it avoids the undermining issue because H already accounts for possible futures. 

  But the cost for Humeans? They have to accept that chances are defined holistically over all history. So when we talk about chances at t, they're always relative to the entire pattern. The New Principle makes this explicit, but it might feel like a workaround. Non-Humeans don't have this problem because chances are primitive, not dependent on future events. 

  The student needs to see that undermining isn't just new evidence; it's a structural flaw in PP under Humeanism because PP assumes chances are stable, but Humeanism makes them contingent on the whole pattern. So without the New Principle, PP could give conflicting guidance when considering undermining futures. 

  I should explain it without equations. Use an analogy: like a democracy where a law passes with 50% votes, but if future votes change the constitution, the same vote might have had a different threshold. PP is like trusting the current law, but if the constitution can change based on future events, that trust might be misplaced. The New Principle is like conditioning on the entire constitutional history. 

  The cost for Humeans is that chances lose their local, time-specific authority. They're always tied to the global pattern. Non-Humeans avoid this because chances are fixed independently. So yes, Humeans pay a price in terms of locality. 

  I hope that clarifies why undermining is a "big bad bug" and not mundane. It's about the coherence of credences when chances themselves are volatile under the theory.
answer: |-
  Let's unpack the "big bad bug" without equations. The problem isn't that *new evidence changes credences*—it's that **Humean chances are uniquely vulnerable to self-referential incoherence** when plugged into the Principal Principle (PP). Here's why it bites:

  ### 1. **The Core Tension: Humean Chances are Made of Events**
     - On Humeanism, the chance function *Ch* at time *t* supervenes on the **entire actual history** (past, present, *and future*). *Ch* is just a summary of the best pattern-fitting system for the whole universe.
     - But this means *Ch* itself **depends on future outcomes**. Specifically, there could be a possible future outcome *F* that is:
       - **Consistent with *Ch*** (i.e., *Ch(F) > 0$*),  
       - Yet **incompatible with *Ch* being the true chance function** (because if *F* occurred, a *different* chance system would fit the whole history better).

     Example:  
     - Suppose the actual *Ch* assigns 0.5 to heads (*H*) for a coin toss at *t*.  
     - But there's a possible future *F* (e.g., a statistical "miracle" where *every* toss after *t* lands heads) that would make a *different* chance system (say, *Ch*' where *Ch*(H) = 0.9) the best fit for the *whole* history.  
     - By Humean lights, *Ch* is only "true" if *F* **doesn't happen**. Yet *Ch* assigns positive probability to *F*!  

     This is **undermining**: *F* would "undermine" the very chance that gave it positive probability.

  ---

  ### 2. **Why This Breaks the Original Principal Principle**
  PP says: Your credence in *A* given *Ch_t(A) = x* and admissible evidence *E* should be *x*.  
  But now consider:  
  - Let *A* be some event at *t* (e.g., this coin toss lands heads).  
  - Let *U* be an undermining future (like *F* above) where *Ch*(U) > 0, but *U* makes *Ch* false.  

  **The contradiction**:  
  - PP demands: *Cr(A | Ch_t(A)=0.5 \& U) = 0.5*  
    (since *U* is "admissible" future evidence about chances).  
  - But if *U* happens, *Ch* is false → *Ch_t(A)=0.5* wasn’t the true chance!  
    So *Cr(A | Ch_t(A)=0.5 \& U)* **should not be 0.5**—it should be whatever the *new* chance system says.  

  In other words:  
  - PP forces you to trust *Ch* even when you know *Ch* is false (because *U* implies *Ch* is false).  
  - But you can’t rationally have 0.5 credence in *A* while knowing the chance theory claiming *Ch(A)=0.5* is *wrong*.  

  This isn’t just "new evidence updates credences"—it’s **your credence rule (PP) forcing you to ignore evidence that the chance theory is self-undermining**. Non-Humeans avoid this because their chances are *primitive* and *time-specific* (e.g., propensity at *t*), not dependent on the future.

  ---

  ### 3. **Lewis's "New Principle" (NP) and the Humean Cost**
  Lewis's fix: Replace PP with:  
  > *Cr(A | H_t \& E) = Ch_t(A | H_t)*  
  where *H_t* is the **entire chance theory** (not just *Ch_t(A)=x*).  

  #### Why this "works":  
  - *H_t* specifies chances at *all times*. Conditioning on *H_t* means you’re told how chances *evolve* over time, including how they respond to (non-undermining) futures.  
  - Crucially, *Ch_t(A | H_t)* is defined such that if *A* is an undermining future, *Ch_t(A | H_t) = 0* (since *H_t* entails *A* won’t happen—if it did, *H_t* wouldn’t be true!).  
  - So NP "builds in" immunity to undermining: It tells you to ignore futures that would undermine *H_t* because *H_t* says they won’t occur.  

  #### The Humean Cost:  
  - **Chances lose their local authority**: Under NP, *Ch_t(A)* isn’t directly action-guiding. You need the whole theory *H_t* to compute *Ch_t(A | H_t)*.  
  - **Circularity worries**: *H_t* is a global fact about the universe, but you’re using it to set credences *now*. For Humeans, this feels like bootstrapping: *H_t* supervenes on the very events it’s predicting.  
  - **Loss of "pure" chance guidance**: Non-Humeans can treat chances as fundamental causes. Humeans using NP treat them as *self-consistent summaries*—which is less intuitive (e.g., "Why should I set credence to 0.5? Because the best system says so, and it also says I shouldn’t expect it to fail.").  

  #### What you lose:  
  - The original PP was simple, local, and analogous to non-Humean chance. NP is holistic and explicitly tied to Humeanism.  
  - For non-Humeans, undermining isn’t a problem: chances at *t* are fixed independently of the future. For Humeans, NP saves consistency but admits chances are "fragile" in a way that feels revisionary.  

  ---

  ### 4. **How to Explain This to Your Cohort (No Math!)**
  Use this analogy:  
  > **Imagine PP as a weather forecast**.  
  > - **Non-Humean chance**: The forecast is made by a reliable, external sensor. If new data contradicts it, you update—no paradox.  
  > - **Humean chance (original PP)**: The forecast is *generated by the weather itself*. A "self-undermining forecast" says: *"There's a 10% chance of rain today... but if it rains, this forecast was wrong because a different system would have been better."*  
  > - **The problem**: PP says *trust the forecast*, even if you see rain clouds (the "undermining future"). But if it rains, the forecast *was* wrong!  
  > - **NP's fix**: The forecast now includes a *meta-prediction*: *"There's 10% chance of rain... and also, I guarantee no rain will occur that would make me invalid."* You trust *that*.  
  >  
  > **The cost**: Humean chances aren't simple predictions—they're self-validating summaries. Non-Humeans don’t need this gymnastics.  

  **Why it's a "bug" and not mundane**: It’s not *just* updating on new evidence—it’s a **crisis of authority** where the chance rule (PP) forces you to obey a theory that *might be invalidated by its own predictions*. That’s unique to Humeanism + PP.  

  Lewis called it a "big bad bug" because it reveals a **structural flaw in Humean chance**: it can’t play the action-guiding role we want from "objective probability" without patching the rules to avoid self-sabotage. NP is the patch, but it makes explicit that Humean chances are descriptions, not causes.  

  If you take one thing away:  
  > **Undermining isn't about changing credences—it's about the Principal Principle demanding faith in a chance that *might not even be true by its own lights*. Non-Humeans don't have this problem; Humeans need the New Principle to avoid it, at the cost of making chance globally self-referential.**  

