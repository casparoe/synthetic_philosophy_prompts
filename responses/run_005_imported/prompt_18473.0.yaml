  We are grading an essay response to a specific question about Mill's On Liberty. The question has three parts: (a) the kind of reaction Mill thinks is legitimate when private conduct offends without harming, (b) why the corn-dealer's accusers can be punished in one setting but not another, and (c) how the harm/offense distinction underlies the argument for freedom of opinion.

  The rubric has five categories:
  1. Accurate statement of the harm principle (max 4 points)
  2. Self-regarding conduct and the question of offense (max 6 points)
  3. The corn-dealer example (max 5 points)
