  The committee is split between two interpretations: one side believes all authors share equal responsibility simply by being part of the project, while the other argues responsibility should be proportional to actual involvement and access. The user needs a memo draft that recommends how to split responsibility for the correction and what goes in each person's file, and it must engage both sides of the argument.

