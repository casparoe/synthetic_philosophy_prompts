  My friend and I spent much of last night arguing about the Doomsday Argument, and she kept insisting the whole thing is just a base-rate fallacy: since anyone at any point in human history could reason "I'm probably typical, so humanity is probably about half over," the argument is self-undermining and proves nothing. I wasn't sure how to respond to this, though it also didn't seem quite right that the argument simply cancels itself out this way. Can you clarify why treating this as a mere base-rate fallacy misses the actual philosophical crux, and what the real point of contention among people who take the argument seriously is?
