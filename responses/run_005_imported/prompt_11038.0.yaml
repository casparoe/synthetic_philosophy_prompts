answer: |-
  You've nailed the core tension in Sidgwick! It wasn't just an "embarrassing hobby" – it was a desperate attempt to solve a fundamental flaw he identified in his own ethical system. Here's the plain-terms breakdown of the logical link:

  1.  **The "Dualism of Practical Reason": The Core Problem**
      *   Sidgwick, the ultimate rationalist, concluded in *The Methods of Ethics* that there are two fundamentally rational ways to guide your actions:
          *   **Rational Egoism:** It's supremely rational to maximize your *own* happiness/well-being over your lifetime.
          *   **Utilitarianism:** It's supremely rational to maximize the *total* happiness/well-being of *everyone* affected by your actions.
      *   **The Problem:** These two "rational" principles **often conflict.** Sacrificing your own time, money, comfort, or even life for the greater good might be the *utilitarian* thing to do, but it *isn't* the *egoistic* thing to do. There's no inherent guarantee that what's best for everyone is best for *you*.
      *   **The "Chaos":** Sidgwick called this the "Dualism of Practical Reason." He saw it as a catastrophic flaw. If reason can't tell us definitively *which* path to follow when they clash, then the whole rational foundation of ethics collapses into "chaos." Why be moral if it might demand your ruin? Why sacrifice yourself if there's no rational payoff?

  2.  **Sidgwick's Desperate Hope: The Cosmic Justice Fix**
      *   Sidgwick realized the *only* way to reconcile egoism and utilitarianism was if the universe itself guaranteed that acting morally (utilitarianly) *always* ultimately led to your *own* greatest happiness. He needed **cosmic justice.**
      *   **Enter God & Immortality:** Traditional theology provided this: A benevolent, omnipotent God who created a universe with an afterlife where virtue is *always* rewarded and vice punished. If you suffer for doing good (utilitarianism), you'd be *overcompensated* with eternal bliss (egoism satisfied). The dualism vanishes because self-interest and duty become one path in the long run (eternity).

  3.  **The Problem with Faith: Sidgwick the Empiricist**
      *   Sidgwick couldn't *believe* this on faith. He was a rigorous empiricist and rationalist. He demanded **evidence.** Religious dogma wasn't enough. He needed *proof* that this cosmic justice mechanism actually existed.

  4.  **Psychical Research: The Empirical Hunt for Proof**
      *   **The Logical Leap:** If you could **prove the existence of spirits/survival of death,** you would have *empirical evidence* for:
          *   **1. An Afterlife:** Confirming that consciousness persists beyond bodily death.
          *   **2. A Moral Order:** Crucially, if spirits could communicate, they might reveal that the afterlife *is* structured justly – that virtue *is* rewarded, sacrifice *is* compensated. This would provide the evidence for the cosmic justice mechanism Sidgwick needed.
      *   **The Link to the Dualism:** Proof of a just afterlife would mean:
          *   Acting morally (utilitarianly), even at great personal cost *in this life*, is *still* the best way to secure your *own* ultimate, eternal happiness (egoism).
          *   There is no ultimate conflict. The long-term self-interest of the immortal soul *aligns perfectly* with the demands of universal benevolence. Reason is unified. The cosmos isn't chaos; it's a system where duty and self-love converge in eternity.

  **In Simple Terms:**

  1.  **Problem:** Being good for everyone (utilitarianism) might screw you over personally (conflicts with egoism). Reason is confused.
  2.  **Solution Needed:** A universe where being good *always* pays off for *you* in the end.
  3.  **Traditional Answer:** God & Heaven reward the good.
  4.  **Sidgwick's Hangup:** "Prove it! I need evidence, not faith."
  5.  **Sidgwick's Gambit:** "If I can scientifically prove ghosts exist and that the afterlife is real and just, then I have my evidence! Proving spirits = proving the afterlife = proving cosmic justice = proving that being good (utilitarian) IS the best thing for *me* (egoist) in the long run (eternity). The conflict disappears!"

  **Why it mattered so much to him:**
  Sidgwick wasn't just chasing spooks for fun. He saw the Dualism as an existential threat to the possibility of a rational ethics. If he couldn't resolve it, his life's work on utilitarianism felt undermined. Psychical research was his high-stakes, decades-long experiment to find the empirical keystone that would hold his ethical system together and banish the terrifying "chaos." His profound disappointment when the evidence remained elusive is palpable in his later writings. The rabbit hole wasn't a detour; it was the desperate core of his philosophical quest for coherence.
