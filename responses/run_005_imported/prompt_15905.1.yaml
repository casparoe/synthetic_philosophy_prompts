prompt: |-
  Hey, quick favor before I inflict this on my seminar next week. We're doing a unit on the unity of the proposition, and I want to open with a ranking exercise on responses to Bradley's regress, but I want a sanity check on my own ordering first since I'm sure I'm biased toward my own camp.

  Here's the setup: every attempted fix for how a proposition (or fact, or state of affairs) manages to be a genuine unity rather than just a heap of consituents seems to either quietly relocate the regress somewhere else, or just posit a primitive unifier and call it a day. Rank the following from best to worst at actually blocking the regress (as opposed to merely redescribing it):

  - Frege's unsaturated concepts
  - Russell's multiple relation theory of judgement
  - Wittgenstein's Tractarian "showing not saying" / picture theory
  - Armstrong's non-mereological states of affairs
  - Bergmann-style nexus / non-relational tie theories
  - Possible-worlds propositions (structure dissolved rather than explained)
  - Soames/King-style act- or use-based theories of propositional unity

  Give it to me as a tier list in JSON, like:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "D": ["..."]
  }
  ```

  and tack on a one-line reason for each placement, no more than a sentence per item.
reasoning: |-
  We are ranking theories from best to worst at actually blocking Bradley's regress (rather than just redescribing it). The regress arises when trying to explain how a proposition (or fact) unifies its constituents into a whole rather than a mere list. The key is to see which theories genuinely stop the regress without relocating it or merely positing a primitive without explanation.

  Let's consider each theory:

  1. **Frege's unsaturated concepts**: Concepts are inherently incomplete (unsaturated) and thus require saturation by objects. This avoids the regress because the combination is built into the nature of the concept. However, one might argue that the relation between the concept and the object is still unexplained, but Frege's view is that the unsaturatedness is fundamental.

  2. **Russell's multiple relation theory of judgement**: This avoids the unity of the proposition by making judgement a multiple relation between the mind and the objects. But it faces the problem of how the relation in the judged fact relates to the other constituents. It is often seen as not fully blocking the regress because the problem reappears in the act of judgment.

  3. **Wittgenstein's Tractarian "showing not saying" / picture theory**: The structure of the proposition (as a picture) shows its sense, and the unity is inherent in the pictorial form. We cannot say how the unity is achieved because that would require standing outside language. This might be seen as a way to dissolve the problem, but it doesn't explain the unity so much as declare it ineffable.

  4. **Armstrong's non-mereological states of affairs**: Armstrong posits states of affairs as fundamental unifiers, with a non-mereological form of composition. This is a primitive, but Armstrong argues that it is a necessary posit. It might be seen as a form of blocking by positing a primitive, but without further explanation.

  5. **Bergmann-style nexus / non-relational tie theories**: This introduces a special entity (the nexus) that ties constituents together without being a further relation (to avoid the regress). However, the nexus itself is a primitive and one might argue that it just relabels the problem.

  6. **Possible-worlds propositions (structure dissolved rather than explained)**: This approach (e.g., Stalnaker) reduces propositions to sets of possible worlds, thus avoiding the issue of structure. But this does not account for the structure within a proposition and thus fails to address the unity problem for structured propositions.

  7. **Soames/King-style act- or use-based theories of propositional unity**: These theories ground unity in the acts of agents (e.g., predicative acts). The unity comes from the way we use the constituents. This might avoid the regress by making unity a feature of our cognitive acts, but it shifts the problem to the unity of the act itself.

  Now, ranking:

  - **S Tier**: The best at blocking the regress without relocation or mere primitive positing. I think Frege's unsaturated concepts are often regarded as a strong candidate because the unsaturatedness is built into the very nature of the concept, making the combination natural and stopping the regress at the first step.

  - **A Tier**: Very good but perhaps with some cost. Wittgenstein's approach is profound because it dissolves the problem by making unity ineffable and showing it in the structure. However, it doesn't explain how it works, so it might not be a full block but a dissolution.

  - **B Tier**: Good but with noticeable issues. Armstrong and Bergmann both posit a primitive unifier. Armstrong's non-mereological composition and Bergmann's nexus are both attempts to stop the regress by introducing a fundamental unifying element. But they are still primitives. However, they are designed to block the regress by being non-relational and thus not requiring further ties.

  - **C Tier**: Problematic, as they may relocate the regress. Russell's multiple relation theory is known to face a version of the regress in the act of judgment. Soames/King act-based theories ground unity in acts, but then the unity of the act itself might become problematic (how do the parts of the act unite?).

  - **D Tier**: Weak, because they avoid the issue rather than solving it. The possible-worlds approach dissolves structure and thus doesn't address the unity of structured propositions. It's a way to bypass the problem, not solve it.

  So, let me assign:

  - S: Frege (because unsaturatedness is inherent and stops the regress by design)
  - A: Wittgenstein (dissolves the problem by making it ineffable, but doesn't explain)
  - B: Armstrong and Bergmann (both posit a primitive unifier, but at least it's a direct block)
  - C: Russell and Soames/King (relocate the regress to the act of judgment or the mental act)
  - D: Possible-worlds propositions (avoid the issue by eliminating structure)

  But note: Bergmann is often considered similar to Armstrong, so I put them together. Also, Soames/King might be seen as more recent and innovative, but they face the regress in the act.

  However, some might argue that act-based theories are better. But in the context of blocking the regress, they still face a challenge. So I'll stick.

