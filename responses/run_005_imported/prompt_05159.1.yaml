answer: |-
  Here’s a toast weaving Lewis’s Convention into a celebration of their love, honoring the theory’s depth while ensuring warmth and clarity for all:

  **(Clink glass gently)**  
  Friends, family, fellow admirers of [Bride's Name] and [Groom's Name]!  

  We all know [Bride] has a brilliant mind. Some of us, especially those who shared seminar rooms during her MA, know just *how* brilliant – particularly when it came to the intricate dance of human agreement described by David Lewis in *Convention*. Now, [Groom], I know your expertise lies... elsewhere! (Smile warmly at Groom). But today, as I stand here marveling at this incredible partnership, I realize Lewis gave us the perfect lens to understand not just *why* societies function, but *why* what [Bride] and [Groom] have built is so uniquely strong and beautiful.  

  See, Lewis was fascinated by how we solve **coordination problems**. Think about it: Why do we all drive on the same side of the road? It’s not because one side is *inherently* better. It’s *arbitrary*! Left or right works equally well... *as long as everyone picks the same one*. The magic happens when we all *know* everyone else expects us to pick that side, *and* we know they know we know... that’s **common knowledge**. We *choose* to conform because it makes everything smoother, safer, easier. It becomes our **convention**.  

  Now, marriage might seem like the *opposite* of arbitrary. It feels profound, destined, deeply meaningful! And it absolutely is. But Lewis’s genius was showing that the *arbitrariness* of the *specific solutions* we find together is actually the *foundation* of stability and freedom. It’s not imposed from above; it’s built from within, by mutual participation.  

  Look at [Bride] and [Groom]. Long before today, they weren't just falling in love; they were solving countless tiny coordination problems, building their own little world of conventions.  

  *   Remember that weirdly specific pizza topping combo only *they* ever order? **Arbitrary!** But it became *their* delicious tradition through **repeated occasions**. The mere suggestion of pizza now makes that combo **salient** – the obvious, joyful choice.  
  *   That silly inside joke from their second date? **Arbitrary!** But repeating it, weaving it into texts and quiet moments, gave it power. It became a **precedent**, a signal only they fully share, reinforcing their bond.  
  *   How they navigate a busy Saturday, who makes the coffee just right, even their unspoken agreement on whose family to visit first for the holidays... These were all small **coordination problems**. The solutions felt natural, maybe even obvious *to them*, because they were built on **common knowledge** of each other’s expectations and desires.  

  These weren't just habits; they were **conventions evolving**. Little agreements, sometimes silly, sometimes profound, chosen together again and again because they *worked* for *them*. They created a shared expectation, a mutual understanding – "This is how *we* do things." The **arbitrariness** of *which* pizza topping or *which* joke isn't the point. The point is the **mutual participation**, the **shared willingness to choose that path together**, every single time. That’s what makes it *real* and *stable*. It’s not random; it’s *theirs*.  

  And that brings us to today. This incredible wedding isn't *imposing* a convention on them. It’s the magnificent, public declaration of the **common knowledge** that’s already been growing for years. It’s taking all those beautiful, arbitrary little solutions – those private conventions – and elevating them. Today, we all bear witness. We all *know* they are choosing this path together. We know *they* know we know. Our presence, our cheers, our love – it cements that **common knowledge**, making the convention of their marriage visible to the world.  

  [Groom], you might not have read Lewis, but you’ve lived his deepest insight with [Bride]. You’ve shown that the strongest bonds aren't about finding the one "right" way dictated from on high. They’re about two people, facing life's infinite coordination problems together, finding *their* unique, sometimes arbitrary, but always joyful solutions. Choosing, day after day, to conform to the beautiful world they've built together, because it works, because it’s safe, because it’s filled with love.  

  So, let’s raise our glasses. To [Bride] and [Groom]! To the brilliant, sometimes arbitrary, always chosen solutions! To the deep, resonant **common knowledge** of your love! To a lifetime of happily solving coordination problems together, your shared conventions growing ever stronger and sweeter. May your marriage be as stable, joyful, and uniquely *yours* as the very best conventions always are. Cheers!

  **Why this works:**

  1.  **Demystifies Lewis for Non-Philosophers:** Uses relatable examples (driving, pizza, inside jokes) to explain coordination problems, arbitrariness, salience, and precedent *before* applying them to the couple.
  2.  **Reframes "Arbitrariness" Positively:** Explicitly separates the *inherent value* of the marriage (profound, meaningful) from the *mechanism* of conventions (arbitrariness of *specific* solutions). Emphasizes *choice* and *mutual participation* as what gives meaning and stability.
  3.  **Celebrates Pre-Wedding Rituals:** Frames their private jokes and habits as *already* being evolving conventions, showing their relationship was building this stable structure long before the official ceremony. This is the "love letter" to their journey.
  4.  **Positions the Wedding as Common Knowledge:** The ceremony becomes the powerful moment where their private convention becomes publicly known and acknowledged, reinforcing its stability (a key Lewis point).
  5.  **Honors the Philosopher (Bride):** Uses the actual terminology ("coordination problem," "common knowledge," "salience," "precedent," "arbitrariness," "convention") accurately and integrates them smoothly, showing respect for her work without being obtuse.
  6.  **Reassures Parents/Non-Philosophers:** The toast explicitly celebrates the *strength* and *intentionality* derived from the mechanism. The final paragraphs focus on love, choice, and commitment, using the theory to enhance, not diminish, the romance.
  7.  **Warmth & Humor:** Starts with light teasing ([Groom]'s non-philosophy background), uses affectionate examples (pizza, inside jokes), and ends with a heartfelt, traditional toast structure.
  8.  **Length:** Structured for roughly 5 minutes when read aloud with natural pauses.

  This toast uses Lewis not as dry theory, but as a surprising and insightful metaphor to celebrate the *deliberate, joyful co-creation* that is at the heart of a lasting marriage.
