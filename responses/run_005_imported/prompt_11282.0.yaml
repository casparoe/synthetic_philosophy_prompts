  - **Tier_1 [3, 7]**: Jeffrey's ratifiability (3) and functional/logical decision theory (7) both resolve the instability by allowing the traveler to choose either act arbitrarily without regret. Ratifiability makes both acts equally preferable when conditioned upon, while FDT/LDT treats the decision as a function that, given the prediction's perfection, results in indifference. Both provide stability under reflection.
  - **Tier_2 [2]**: Unadorned causal decision theory (2) can achieve stability if the traveler assumes symmetry (e.g., a 0.5 prior probability for Death's location) and chooses arbitrarily. However, it relies on external assumptions (like the principle of indifference) and is not explicitly designed for predictor cases, making it less direct than Tier 1 solutions.
  - **Tier_3 [4, 5, 6]**: Eells's tickle defense (4), Skyrms's deliberational dynamics (5), and Joyce's stability condition (6) fail to resolve the instability. The tickle defense is ineffective against a perfect predictor, deliberational dynamics oscillates without convergence, and Joyce's condition is unsatisfied (after choosing an act, the traveler would prefer the other due to the prediction).
  - **Tier_4 [1, 8]**: Unadorned evidential decision theory (1) exemplifies the instability by creating a cycle of regret. The view that no stable act exists (8) explicitly rejects resolution, failing to prescribe any rationally stable act.
