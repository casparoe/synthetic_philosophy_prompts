  Turing's 1950 text shows he valued robust methodology. He specifically designed ESP controls to prevent statistical artifacts, demonstrating awareness of how experimental setups can influence results. His approach aligns more with skepticism toward loose methods than with belief in ESP. For instance, he wrote that telepathy "interferes with our experimental conditions," implying that proper science requires eliminating such variables.

  Given this, Turing would likely side with Wagenmakers' critique. Why? Because Bayesian analysis addresses the flexibility in interpretation that NHST allows, and preregistration tackles the problem of researcher degrees of freedom—both issues resonate with Turing's emphasis on controlled conditions. His 1950 solution wasn't to accept ESP evidence but to design better experiments to rule it out, showing he'd prioritize methodological rigor over surprising p-values.

  Would this shake his confidence in telepathy statistics? Absolutely. Turing already viewed ESP as a nuisance variable; seeing how methodological flaws could produce false positives in Bem's work would reinforce his view that apparent evidence for ESP might stem from poor experimental design. He'd likely see Bem's results as artifacts of NHST weaknesses, not genuine anomalies.

