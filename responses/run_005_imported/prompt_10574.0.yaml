  First, I recall Turing's approach in "The Argument from Extrasensory Perception." He didn't dismiss ESP; instead, he acknowledged statistical evidence for telepathy and proposed modifying the imitation game to control for it. His concern was methodological—how to isolate machine intelligence from paranormal interference. He treated ESP as a variable to be controlled, not as pseudoscience to ignore.

