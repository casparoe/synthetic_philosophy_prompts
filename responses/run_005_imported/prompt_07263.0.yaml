  Hmm, the user might appreciate deeper textual evidence. Beyond their mentioned works, I should bring in Borges' "New Refutation of Time" where he explicitly ties time's unreality to the self's unreality. And maybe "Avatars of the Tortoise" for its critique of infinite regress in temporal concepts. Also "The Writing of the God" could show his fascination with totalizing systems.

