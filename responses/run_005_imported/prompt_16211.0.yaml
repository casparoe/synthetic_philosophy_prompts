  *   **Part (c) Major Error:** Baker's constitution view is **fundamentally 3-dimensional**. She argues Lumpl and Goliath are distinct, wholly present 3D objects standing in the constitution relation *at a time*. She explicitly rejects explaining constitution via temporal parts of a 4D object (*Persons and Bodies: A Constitution View*, 2000, pp. 30-34, 164-167). This misattribution undermines the core of her view.
