  The user wants the grandson's rebuttal to be logically sound. So I need to dissect both horns. For the first horn, the issue is whether death can be a harm even if the person doesn't exist afterward. Philosophers like Epicurus argue that without existence, there's no subject to be harmed. But contemporary philosophers like Thomas Nagel counter that the deprivation of life's goods is a harm. So the grandson could argue that missing out on future experiences is a loss, even if the dead person isn't around to feel it. That challenges the assumption that harm requires a subject to experience it at the time.

  For the second horn, immortality isn't necessarily good. Bernard Williams' thought experiment shows that eternal life could lead to unbearable boredom. If the soul is immortal but existence becomes torturous, then death isn't a promotion. Also, the idea of reuniting with great figures assumes a pleasant afterlife, which isn't guaranteed. Cicero's dichotomy ignores the possibility of a bad immortality.

