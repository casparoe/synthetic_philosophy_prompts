  Here’s a draft of 8-10 podcast questions with follow-ups, designed to challenge the strict finitist position while hitting your specified topics. Each includes the logician’s likely core answer and a sharper follow-up.

  ---

  ### **Podcast Questions for Strict Finitist Logician**  
  **Host:** "Welcome, Dr. Finch. You’ve staked out a radical position: that Peano Arithmetic (PA) might harbor an *actual* contradiction. Let’s dig in."

  1. **Q1 (Intro/Stakes):**  
     "Most mathematicians treat PA’s consistency as near-certain. Why do you see its inconsistency as a *live* possibility—not just a Gödelian hypothetical?"  
     *Likely Answer:* "Gödel showed we can’t *prove* PA’s consistency finitistically. But absence of proof isn’t proof of absence. Given the infinite domain, unchecked induction, and human error in foundational work, an undiscovered contradiction is plausible."  
     **Follow-up:** "But isn’t PA’s consistency *empirically* supported? Billions of computations obey its axioms without contradiction. Doesn’t that outweigh abstract doubts?"  

  2. **Q2 (Gentzen’s Proof):**  
     "Gentzen ‘proved’ PA’s consistency in 1936 using transfinite induction up to ε₀. Why doesn’t this settle the issue for you?"  
     *Likely Answer:* "Gentzen’s proof assumes the legitimacy of ε₀—an infinite ordinal. If you question infinity (as I do), it’s circular: it assumes a richer system than PA to ‘save’ PA. It’s not finitistically convincing."  
     **Follow-up:** "But if we reject Gentzen’s proof for relying on ‘unsecure’ infinity, why accept finitist reasoning? Isn’t *all* math abstract? Or do you claim finitism is ‘empirical’?"  

  3. **Q3 (Transfinite Induction vs. PA):**  
     "Is transfinite induction up to ε₀ *really* less secure than PA itself? Hilbertians argued it’s more intuitive than PA’s induction schema."  
     *Likely Answer:* "ε₀ is a transfinite object—it doesn’t concretely exist. PA’s induction is applied to *formulas*, which are finite strings. But both assume infinity. Neither is ‘secure’; Gentzen just moved the problem."  
     **Follow-up:** "So if *both* are suspect, does your critique extend to Primitive Recursive Arithmetic (PRA)—the finitist ‘gold standard’? Where do you draw the line?"  

  4. **Q4 (Nelson’s 2011 Attempt):**  
     "Edward Nelson famously *tried* to prove PA inconsistent in 2011 but retracted after a flaw was found. Does this very public failure strengthen the case for PA’s consistency?"  
     *Likely Answer:* "Not at all. Nelson’s failure only shows *his* proof failed. Many proofs were flawed before breakthroughs (e.g., Wiles on Fermat). Absence of a contradiction isn’t evidence of consistency—Gödel taught us that."  
     **Follow-up:** "But if centuries of scrutiny *without* finding a contradiction doesn’t count as evidence, what *would*? Or is consistency fundamentally unverifiable?"  

  5. **Q5 (Evidence from Failed Disproofs):**  
     "Nelson isn’t alone—dozens have tried and failed to expose PA’s inconsistency. Cumulatively, doesn’t this suggest PA is robust?"  
     *Likely Answer:* "Human failure to find a contradiction ≠ no contradiction. Pre-Gödel, many thought PA *was* proven consistent! History shows hubris in foundational math."  
     **Follow-up:** "Then is your position unfalsifiable? If no failed disproof counts, and no proof convinces you, what could change your mind?"  

  6. **Q6 (Large Cardinal Hierarchy):**  
     "If PA *is* inconsistent, what happens to modern set theory? Large cardinals (e.g., ZFC + inaccessible cardinals) are justified as ‘stronger’ systems that prove PA’s consistency."  
     *Likely Answer:* "The entire consistency-strength hierarchy collapses. If PA is inconsistent, systems ‘proving’ its consistency are *unsound*. Large cardinals become castles built on sand—potentially inconsistent too."  
     **Follow-up:** "Doesn’t this make math inherently unstable? If we can’t trust PA, why would we trust *any* formalism—including the one you’re using right now?"  

  7. **Q7 (Self-Undermining Objection):**  
     "Let’s address the elephant in the room: if PA is inconsistent, why trust the arithmetic *you* used to reason about PA? Isn’t this self-defeating?"  
     *Likely Answer:* "I use *ultra*-finitist reasoning, grounded in physical computation. I don’t assume PA. For example, I accept bounded arithmetic with concrete upper limits, not idealized induction."  
     **Follow-up:** "But your critique of PA relies on logic, quantification, and negation—all formalized *in* PA. If PA is inconsistent, couldn’t your own argument be a contradiction in disguise?"  

  8. **Q8 (Broader Implications):**  
     "If PA is inconsistent, what survives? Does 2+2=4 still hold? Or does math unravel entirely?"  
     *Likely Answer:* "Finite, verifiable computations survive (e.g., 2+2=4). But theorems relying on unbounded induction (e.g., FLT, Goodstein sequences) become suspect. We’d need a new foundation built on strict finitism."  
     **Follow-up:** "Won’t this destroy most of mathematics? Isn’t the pragmatic success of PA evidence that it’s ‘true enough’, even if inconsistent?"  

  ---

  ### **Key Angles Covered**  
  - Gentzen’s proof: Rejected as circular due to transfinite induction.  
  - Nelson’s failure: Dismissed as irrelevant to PA’s status.  
  - Large cardinals: Positioned as dominoes that fall if PA falls.  
  - Self-undermining: Deflected via ultra-finitist “safe” reasoning.  

  Each follow-up forces the guest to either defend the coherence of their epistemology (Q3, Q7), confront empirical/pragmatic challenges (Q1, Q4, Q8), or address the radical fallout of their view (Q6). Let me know if you want to sharpen any specific exchange!
