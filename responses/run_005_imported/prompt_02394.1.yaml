  How would Bentham resolve this? He might support prosecution under existing postwar laws, like deprivation of liberty, avoiding retroactivity. Or he could accept a narrowly tailored retroactive law as a lesser evil, though reluctantly. His utilitarianism might prioritize deterring future informers over strict adherence to non-retroactivity.

