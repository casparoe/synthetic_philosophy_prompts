  The discursive dilemma involves judgment aggregation on interconnected propositions. For example, a court case where majorities support each premise but reject the conclusion. List and Pettit's theorem shows no aggregation method can satisfy fairness and consistency simultaneously. 

  The user wants to know if Condorcet would see this as similar to his paradox, solvable by design, or if it undermines his epistemic project. I need to connect his actual views, not just Enlightenment optimism.

