  But Leibniz emphasizes free will through contingency. Even if actions are certain, they're not necessary. So, the agent could theoretically choose otherwise, but within their complete concept, they won't. This mirrors Newcomb's dilemma: dominance suggests two-boxing, but if the predictor is accurate, one-boxing yields more.

