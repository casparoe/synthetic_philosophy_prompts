  First, I need to map out each point in their argument. Dev's initial point is that the arrangement is "fake" because if Reema doesn't believe in the ethics of vegetarianism, her action doesn't have moral weight. Lily counters by focusing on outcomes—less meat eaten and less sweatshop support, which aligns with their goals. 

