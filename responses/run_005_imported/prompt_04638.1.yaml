  Okay, let me start by unpacking the user's query. They're writing about the intellectual backstory of "post-truth" politics and are focused on Richard Rorty's prediction in "Achieving Our Country." The user's philosopher friend linked Rorty's neopragmatism—specifically his antirepresentationalist view that "truth is what your contemporaries let you get away with"—to the rise of post-truth politics. The user is concerned that if Rorty's philosophy reduces truth to social consensus, it might undermine any principled objection to demagogues who distort facts. They want to ensure they're representing Rorty fairly without oversimplifying.

  First, I need to verify if the friend's characterization of Rorty is accurate. Rorty did say that quote, but it's from an interview and is deliberately provocative. His actual position in "Philosophy and the Mirror of Nature" is more nuanced. He rejected the correspondence theory of truth but didn't dismiss objectivity entirely. Instead, he shifted the basis of truth from mirroring reality to social justification. 

  The user's main worry is whether Rorty's framework allows for criticizing false claims like inflated crowd sizes or election fraud. Rorty's distinction between objectivity as intersubjective agreement and solidarity as community values is crucial here. While truth is community-bound, communities can still be criticized internally for consistency or externally for harmful consequences. Rorty valued liberal institutions and pragmatism, which rely on evidence and dialogue. So, even within a consensus view, a demagogue's lies could be challenged if they cause practical problems or violate shared norms.

  I should also address the "self-own" concern. Rorty's prediction wasn't an endorsement but a warning about societal failure. His critique of the left's focus on cultural politics over economic issues was pragmatic. He believed that without addressing material needs, society becomes vulnerable to demagogues. Thus, his philosophy doesn't justify post-truth; it explains how societal neglect leads to it.

  The user might be conflating descriptive and normative aspects. Rorty describes how truth functions socially but doesn't normatively endorse any consensus. His commitment to liberal democracy means he would oppose authoritarianism on practical grounds, like preserving freedom and avoiding cruelty. 

  I need to emphasize that Rorty's antirepresentationalism isn't relativism. It's a rejection of metaphysical truth, not practical accountability. Communities can evolve their standards through dialogue, influenced by new experiences. So, Rorty can critique a demagogue's lies by appealing to better practices within the liberal tradition.

  Lastly, the user's deeper need might be to avoid misrepresenting Rorty while analyzing post-truth politics. They want a balanced view that acknowledges his foresight without implicating his philosophy in enabling demagoguery. Highlighting Rorty's pragmatic safeguards and normative commitments should address this.
answer: |-
  You've hit on one of the most persistent (and consequential) critiques of Rorty's neopragmatism. Your friend captures a common reading, but it's arguably a **simplification that flattens crucial nuances in Rorty's thought.** Here's how to navigate this fairly:

  1.  **The Provocative Quote & Its Context:**
      *   Yes, Rorty said "Truth is what your contemporaries let you get away with saying" (in a 1989 interview, not a major work). It's deliberately provocative, echoing William James's "The true is the name of whatever proves itself to be good in the way of believing."
      *   However, this is a *rhetorical flourish* emphasizing the *social practice* of justification, not a literal definition of his entire position. It highlights that *within* a community, truth claims gain traction through social processes of justification, not by bumping up against some non-human "Reality."

  2.  **Rorty's Core Rejection: Antirepresentationalism ≠ "No Facts" or "Anything Goes":**
      *   Rorty rejected the **correspondence theory of truth** – the idea that truth means our statements accurately "mirror" or "represent" a mind-independent reality. He saw this as a philosophical dead end, impossible to demonstrate or operationalize meaningfully.
      *   **He didn't deny the existence of the world.** Rocks are hard, water is wet, elections have outcomes. He denied that we have direct, unmediated access to "Reality As It Is In Itself" to *check* our correspondence. All our descriptions and justifications are human *tools* developed within language games and social practices.
      *   **His target was philosophical *foundationalism*.** He argued we can't ground knowledge or truth in something outside human practices (God, Pure Reason, The Given). Justification is always *internal* to a web of beliefs and practices.

  3.  **What "Truth" Becomes: Justification & Solidarity, Not Mere Consensus:**
      *   For Rorty, "truth" is a **compliment we pay to beliefs we find well-justified *within our current practices and vocabularies***. It's a property of sentences, not of the world.
      *   **Justification ≠ Transient Consensus:** Justification involves complex social practices – evidence, reasoning, dialogue, experimentation, peer review (in science), legal procedures, journalistic norms, etc. It's not just whatever the loudest mob shouts today. A belief justified yesterday *can* be unjustified tomorrow based on new arguments, evidence, or *internal* shifts in the community's standards.
      *   **Solidarity is Key:** Rorty emphasized **solidarity** – the shared values, goals, and practices of a community – as the basis for justification. Truth claims are justified *to* a particular audience *for* particular purposes within a shared framework.

  4.  **Objecting to the Demagogue: Rorty's Resources:**
      *   **Internal Critique:** Rorty *can* object fiercely to the demagogue *on pragmatic grounds internal to the values of liberal democracy*, which he passionately defended:
          *   **Inconsistency:** The demagogue's claims fail *even by their own community's established standards of evidence and justification* (e.g., ignoring court rulings, contradictory testimony, lack of physical evidence for fraud). They violate the *practices* of justification the community *already* relies on (e.g., courts, free press, statistical analysis).
          *   **Harmful Consequences:** Rorty prioritized reducing cruelty. He could argue the demagogue's lies *cause concrete harm* – undermining trust in institutions essential for social cooperation, inciting violence, disenfranchising voters, destabilizing society. This violates the pragmatic goal of building a less cruel, more inclusive society.
          *   **Undermining Liberal Institutions:** The demagogue attacks the very institutions (free press, independent judiciary, electoral systems) that provide the *space* for Rortian justification through free inquiry and dialogue. This threatens the *process* itself.
          *   **Betraying Shared Goals:** If the community professes values like fairness, justice, or factual accuracy, the demagogue's actions can be shown to violate *those very values*.
      *   **No "Reality Check," but a "Practice Check":** Rorty wouldn't say "But reality shows the crowd was smaller!" He *would* say: "Your claim fails by *our own best current practices* of measuring crowds, analyzing photographs, comparing historical data, and reporting events reliably. It undermines the shared practices we need to function and reduces suffering. Here's the evidence gathered using those reliable practices."

  5.  **The Prediction vs. The "Alibi":**
      *   **The Prediction:** Rorty foresaw the *political vulnerability* created by the Left abandoning economic justice for cultural politics. He understood how resentment could fuel a backlash against "elites" and expert consensus, exploited by a demagogue offering simplistic, nostalgic solutions. This insight stems from his *pragmatic analysis of social forces and historical narratives*, not *directly* from his antirepresentationalism.
      *   **The "Alibi" Charge:** Does his philosophy *enable* post-truth? **Not inherently, but it removes a specific philosophical barrier.** By rejecting correspondence truth as a philosophical foundation, he *does* deny critics an ultimate, non-human arbiter ("But Reality Says!"). Critics must fight *within* the arena of social justification, persuasion, and pragmatic consequences. This makes the battle harder against bad-faith actors who *reject* established practices of justification. Rorty provides no magic bullet against someone who simply doesn't care about consistency, evidence, or liberal norms. His framework relies on a *commitment* to those norms and practices.

  **A Fair Synthesis for Your Piece:**

  *   **Acknowledge the Tension:** Yes, Rorty's rejection of representationalism removes the traditional philosophical foundation for opposing "alternative facts" based on correspondence to reality. This *does* create a vulnerability his critics pounce on.
  *   **Emphasize the Nuance:** Rorty offered a sophisticated alternative based on **social justification within shared practices and vocabularies**, grounded in **solidarity and the goal of reducing cruelty**. He *wasn't* advocating for epistemic relativism where "anything goes." Justification has teeth – evidence, reason, consequences matter *within* a community's framework.
  *   **His Objection Strategy:** Rorty would fight the demagogue *pragmatically*: exposing internal inconsistencies, demonstrating harmful consequences, defending liberal institutions as essential for free inquiry, and appealing to shared (or aspirational) democratic values. He wouldn't invoke "The Real," but he'd vigorously deploy "our best current justificatory practices and their results."
  *   **The Core Distinction:** Rorty shifted the basis of critique from **metaphysical grounding** ("This is False because it doesn't match Reality") to **pragmatic, social, and ethical grounding** ("This claim is poorly justified, harmful, inconsistent, and undermines the practices we need for a decent society").
  *   **Conclusion for Your Piece:** Rorty's prediction was brilliant political sociology. His philosophy doesn't *cause* post-truth, but it *does* reflect the post-foundational condition that makes post-truth tactics possible and harder to combat with traditional philosophical arguments. His solution lies not in resurrecting correspondence truth, but in the messy, difficult work of rebuilding shared practices of justification, reinforcing liberal institutions, and addressing the underlying resentments he warned about. The "self-own" is only apparent if you demand a foundation he deliberately dismantled; his fight was always on different terrain.
