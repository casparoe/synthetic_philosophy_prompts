  I recall similar cases at other universities where they separated "funding matters" from "policy matters" in voting eligibility. That could work here. Online students get votes on academic integrity and tuition advocacy (which affect them equally), but only fee-paying students vote on budget allocations (since they fund it). 

  The memo should acknowledge both perspectives honestly. The caucus's strongest argument is about democratic representation - excluding 4,000 students from policies that bind them is fundamentally unfair. But we can't gloss over the funding concern either. 

  For structure: start with background, present both sides fairly, then propose the compromise with clear eligibility rules. Emphasize that this maintains fiscal responsibility while expanding democracy. The "academic citizen" framing might help sell it. 

  Better include implementation details too - how to verify enrollment status, ballot design etc. Shows we've thought it through. And remind them this could be reviewed later. 

  The tone needs to be diplomatic but decisive. This isn't about winners/losers but finding a principle-based solution. The user will need to defend this before the full senate, so every claim must be rock-solid. 

  ...Wait, should we suggest a sunset clause? No, better keep it simple for now. The review mechanism covers that. 

