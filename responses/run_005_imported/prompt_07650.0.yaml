answer: |-
  ## MEMORANDUM  
  **TO:** University Student Senate  
  **FROM:** [Your Name], Student Senator  
  **DATE:** October 26, 2023  
  **SUBJECT:** Recommendation on Voting Eligibility Reform for Campus-Wide Elections  

  ### I. BACKGROUND
  Current bylaws restrict voting eligibility in student senate elections to students paying the mandatory Student Activity Fee (SAF). This excludes approximately 4,000 fully online students who do not pay the SAF (funded solely by on-campus students and allocated entirely by the Senate). An online-student caucus petitions for enfranchisement, citing the Senate’s authority over academic integrity policies (binding all students) and its role as the representative voice of "the student body" in tuition discussions. Opponents argue that voting rights should align with financial contribution and direct usage of SAF-funded services.  

  ### II. PRINCIPLES GUIDING RECOMMENDATION
  1.  **Democratic Representation:** All students bound by Senate policies deserve representation in shaping those policies.  
  2.  **Fiscal Responsibility:** Students contributing funds should retain primary authority over their allocation.  
  3.  **Institutional Equity:** All enrolled students are members of the academic community.  

  ### III. STRONGEST ARGUMENT FOR ONLINE STUDENT ENFRANCHISEMENT (CAUCUS POSITION)
  The online-student caucus compellingly argues that **exclusion from voting creates taxation (via policy) without representation**. The Senate sets academic integrity policies with serious consequences (e.g., suspension, expulsion) for *every* student, regardless of campus affiliation or SAF payment. Additionally, when the Senate advocates to the administration on tuition—a universal student concern—it claims to speak for "the student body" *in its entirety*. Denying online students a voice in electing the body that imposes these binding academic rules and purports to represent their financial interests undermines the Senate’s legitimacy and fairness. Their status as degree-seeking students inherently entitles them to participation in governance on matters central to their academic experience.  

  ### IV. RECOMMENDATION: TIERED ELIGIBILITY  
  To uphold both democratic inclusion and fiscal accountability, eligibility should be **tied to the scope of Senate authority**:  

  1.  **VOTING ELIGIBILITY FOR ALL STUDENTS (ON-CAMPUS & ONLINE):**  
      *   **Academic Integrity Referenda & Policy Votes:** Any student subject to Senate-approved academic integrity policies (i.e., *all enrolled students*) may vote on referenda or resolutions *specifically concerning academic integrity rules*.  
      *   **Tuition Advocacy Representative Elections:** Any enrolled student may vote for the **Senate President** and **Vice President of University Affairs** (or equivalent roles), as these positions formally represent *all students* in tuition/fee negotiations with the administration.  

  2.  **VOTING ELIGIBILITY FOR SAF-PAYING STUDENTS (ON-CAMPUS ONLY):**  
      *   **SAF Budget Approval & Allocation:** Only students paying the SAF may vote on referenda or resolutions *specifically concerning the annual SAF budget, its allocation, or fee increases*.  
      *   **Elections for Financial Oversight Roles:** Only SAF-paying students may vote for the **Senate Treasurer** and **Chairs of SAF-Funded Committees/Clubs** (e.g., Events, Clubs, Services).  
      *   **General Senate Elections (Excluding President/VP Univ. Affairs):** Only SAF-paying students may vote for **General Senators** and **College Representatives**, as their core function is overseeing SAF allocation and campus-specific services funded by it.  

  ### V. RATIONALE FOR TIERED APPROACH  

  *   **Addresses the Caucus's Core Concern:** Online students gain a direct voice in shaping the academic integrity rules they must follow and electing leaders who represent them on tuition—their most significant issues.  
  *   **Preserves Fiscal Accountability:** SAF-payers retain exclusive control over how their mandatory fees are spent, preventing non-contributors from directing their funds.  
  *   **Reflects Practical Usage:** General Senate roles primarily govern SAF-funded campus activities/services (clubs, events, facilities) used predominantly by on-campus students.  
  *   **Strengthens Institutional Legitimacy:** The Senate can credibly claim to represent the *entire* student body on academic and tuition matters, enhancing its standing with the administration.  
  *   **Promotes Equity:** Recognizes online students as valued academic citizens entitled to participation in governance affecting their core educational experience.  

  ### VI. IMPLEMENTATION  

  1.  **Ballot Design:** Implement a secure online voting system with ballot segmentation based on voter eligibility (determined by enrollment status - online/on-campus).  
  2.  **Voter Verification:** Registrar’s Office to provide verified lists distinguishing online vs. on-campus enrollment for each election cycle.  
  3.  **Bylaw Revision:** Amend Senate bylaws to explicitly define the two voter classes and specify the elections/referenda for which each is eligible.  
  4.  **Communication:** Clearly explain the new system to all students, emphasizing the rationale for inclusion and fiscal responsibility.  

  ### VII. CONCLUSION
  This recommendation rejects the false choice between full exclusion and full inclusion. By granting online students voting rights on matters that directly govern their academic standing and financial representation, while reserving SAF fiscal oversight exclusively for contributors, we uphold both democratic principles and fiscal responsibility. This tiered approach strengthens the Senate's legitimacy as the true voice of the *whole* student community. I urge the Senate to adopt this model to foster a more equitable, representative, and accountable student government.  

  **Respectfully submitted for deliberation and vote,**  
  [Your Name]  
  Student Senator, [Your College/Constituency]
