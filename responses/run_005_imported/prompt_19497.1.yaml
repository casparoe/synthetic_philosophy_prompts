  First, I should validate their experience: no, they weren't "silly." This phenomenon has names (like preference reversal or money pump) precisely because it's a recognized cognitive pattern. The key insight is that our preferences aren't fixed - they shift based on context, comparisons, and time. When they traded Game A for B + $20, they valued B more than A at that moment. But later, when comparing B to C, B lost its luster because the comparison set changed. 

