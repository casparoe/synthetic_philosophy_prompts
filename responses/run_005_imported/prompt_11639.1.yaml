  First, I need to recall Hume's core arguments. Hume's skepticism about necessary connections is central here. He argued that we never observe necessary connections in nature; we only see constant conjunctions. Our idea of causation comes from the feeling of expectation after repeated observations. So, for Hume, causation is about regularities in our experiences, not any hidden metaphysical links.

  Now, Humean supervenience claims that everything supervenes on the spatiotemporal arrangement of local qualities—the "Humean mosaic." Lewis sees entanglement as a threat because it suggests nonlocal correlations that don't supervene on local facts. But would Hume see this as a problem?

  The user presents two options: either Hume would side with Lewis and see entanglement as a threat, or he'd view Lewis's mosaic as smuggling in metaphysical baggage. There's also the possibility of a third position. I need to stake out a position based on Hume's texts.

  Looking at Hume's actual arguments, he was deeply skeptical of any metaphysical commitments beyond what we observe. The Humean mosaic assumes a privileged basis of local qualities. But Hume never insisted that reality must be locally separable. His focus was on epistemology: how we come to form ideas like causation. He'd likely dismiss the need for a locally separable mosaic as unnecessary metaphysics.

  Quantum entanglement shows correlations without local causes. For Hume, this wouldn't be problematic because he never claimed that correlations must have local explanations. He'd probably accept the observed regularities without feeling the need to ground them in local properties. The threat Lewis feels comes from his metaphysical commitment to local supervenience, which Hume wouldn't share.

  Hume's method was to explain concepts through experience and psychology. Entanglement's nonlocal correlations are just another pattern in our observations. Hume would shrug and say we've observed a new kind of regularity. The "threat" only exists if you assume local supervenience, which Hume didn't.

  So, the second option seems right: Hume would see Lewis's mosaic as introducing metaphysical baggage. A consistent Humean empiricist would accept the correlations without insisting they supervene locally. The user wants this grounded in Hume's texts, so I should reference his arguments against necessary connections and his deflationary view of causation.

  Also, the user might be interested in the tension between contemporary Humeanism and Hume's original ideas. They might want clarity on whether later Humeans like Lewis are truly faithful to Hume's epistemology. Addressing that unspoken need would strengthen the response.
answer: |-
  Based on Hume's core arguments in the *Treatise* and the *Enquiry Concerning Human Understanding*, particularly his critique of necessary connection and his account of causation and induction, **he would reject Lewis's "Humean supervenience" as a problematic metaphysical commitment fundamentally at odds with his radical empiricism and skepticism. He would see nonlocal quantum correlations not as a *threat* to his view, but as a striking empirical discovery perfectly consistent with his epistemology. The "threat" only arises for Lewis because Lewis smuggles in the very metaphysical baggage Hume sought to dismantle.** Here's the reconstruction and defense:

  1.  **Hume's Core Argument Against Necessary Connection:**
      *   Hume's primary target was the rationalist/metaphysical notion of a "necessary connection" binding cause and effect, inherent in objects or decreed by God, that *compels* or *guarantees* the effect given the cause (*Treatise* 1.3.14, *Enquiry* 4, 7).
      *   His argument is fundamentally *epistemological*: We never observe any such necessary connection in any single instance of cause and effect. All we observe is contiguity, temporal succession, and constant conjunction (*Enquiry* 7.2).
      *   The *idea* of necessary connection arises solely from the *mind's feeling* – the "custom" or "habit" – of expectation formed after repeated observations of constant conjunction (*Treatise* 1.3.14.20-22, *Enquiry* 7.5-7). It's a projection of our psychological state onto the world.

  2.  **Hume's View of Causation and Laws:**
      *   Causation, for Hume, *is* regular succession. To say A causes B is just to say that events like A are constantly conjoined with events like B (*Enquiry* 7.2).
      *   "Laws of nature" are simply *descriptions* of these observed regularities. They are not prescriptive, governing, or metaphysically necessary forces (*Enquiry* 4.1, 4.21). They summarize patterns we've found in our experience.

  3.  **Why Lewis's Mosaic Smuggles in Metaphysical Baggage:**
      *   Lewis's Humean supervenience commits to a specific *metaphysical structure* for reality: a privileged manifold of point-instants each possessing intrinsic, local qualities. Everything else *must* supervene on this mosaic.
      *   Hume would see this commitment as deeply problematic:
          *   **Beyond Experience:** Hume's epistemology relentlessly attacks claims about the fundamental structure of reality that go beyond what is given in sense impressions. What justifies the claim that reality *must* be fundamentally composed of local, intrinsic qualities arranged in spacetime? This sounds like the kind of metaphysical assertion Hume sought to banish ("Commit it then to the flames: for it can contain nothing but sophistry and illusion" - *Enquiry* 12.34).
          *   **Reification of the Basis:** By insisting that the "Humean mosaic" is the sole fundamental reality upon which *everything* else supervenes, Lewis implicitly grants it a kind of metaphysical necessity or privileged ontological status. Hume would see this as reintroducing the very notion of a hidden, necessary structure he spent his career debunking.
          *   **Privileging "Local":** Hume never argued that causation or regularity *must* be local or separable. His arguments were about the *source* of our *idea* of connection, not about the *spatial structure* of the regularities we observe. Insisting on locality as fundamental is an additional, unjustified (from Hume's perspective) metaphysical constraint.

  4.  **How Hume Would React to Quantum Entanglement and Nonlocality:**
      *   **No Threat to Causation:** Entanglement reveals a striking *regularity*: when certain types of particles are prepared in an entangled state and measured in the same basis at distant locations, their outcomes are correlated in a specific, predictable way (violating Bell inequalities). For Hume, this is simply a newly discovered constant conjunction – a very peculiar and nonlocal one, but a constant conjunction nonetheless. It provides the basis for our *idea* of a connection between these measurement events, just like any other constant conjunction.
      *   **No Need for Local Supervenience:** Hume would see *no reason* to demand that these correlations supervene on some arrangement of *local* qualities at the particles or in the space between them. His account of causation doesn't require it. The correlation *is* the observed fact. Demanding a local supervenience base is asking for a *metaphysical explanation* of the regularity, which Hume explicitly rejects as impossible (*Enquiry* 4). The regularity *is* the explanandum, and for Hume, it's also the explanans – constant conjunction *is* causation.
      *   **Shrug, Not Panic:** Lewis sees entanglement as a threat because it violates the metaphysical commitment to local supervenience built into his mosaic. Hume, lacking that commitment, would simply incorporate the observed nonlocal regularities into his catalog of constant conjunctions. He would likely be fascinated by the empirical discovery but utterly unmoved by the supposed metaphysical crisis. The "threat" is entirely internal to Lewis's metaphysics, not to Hume's epistemology.
      *   **Empiricism First:** Hume's consistent stance would be to follow the empirical evidence. If careful experimentation reveals fundamental, irreducible nonlocal correlations, then that's simply a fact about the patterns we find in nature. To insist that nature *must* conform to a locally separable mosaic, despite empirical evidence to the contrary, would strike Hume as precisely the kind of dogmatic metaphysics his philosophy aimed to undermine. It would be prioritizing a metaphysical picture over observed phenomena.

  **Conclusion:** A faithful reconstruction of Hume's arguments leads to the conclusion that he would reject Lewis's "Humean supervenience" as an unwarranted metaphysical commitment to a locally separable fundamental reality. He would see Lewis's anxiety about quantum nonlocality as arising *from* this commitment, not as a problem for his own, purely epistemic account of causation. For Hume, nonlocal correlations are simply a remarkable new kind of constant conjunction discovered by science. They pose no threat to his core thesis that causation is nothing over and above constant conjunction, and that our idea of necessary connection stems solely from the habitual transition of the mind upon observing such conjunctions. The consistent Humean empiricist, true to the *Treatise* and *Enquiry*, would accept the correlations as brute empirical facts about the regularities in nature, without feeling compelled to ground them in an underlying locally separable mosaic. Lewis's project, while inspired by Hume's critique of necessity, ultimately departs from Hume's radical empiricism by building a new metaphysics on its ashes.
