prompt: |-
  I spent thirty-two years running an analytical chemistry lab before retiring, and in the years since I have finally had time to read philosophy properly, mostly through a reading group that meets under the local university's continuing-education program. This term we have been working through some of the more formal literature on how a group is supposed to turn its members' separate judgments into a single collective one, and it has made me look differently at a recurring headache on the university's standing Committee on Research Integrity, on which I still sit as an emeritus member.

  Under our policy, which -- like most American research universities -- tracks the federal government's own definition of research misconduct, a finding requires two elements to be affirmed independently: that the conduct was a significant departure from accepted practice in the field, and that it was committed intentionally, knowingly, or recklessly rather than through honest error. Only if both are affirmed does a finding go forward. In the file now before us, concerning a former postdoc accused of reusing and relabeling gel images across two papers, our five members split as follows: two of us think both elements are clearly met and call it misconduct outright; one thinks the images were indeed altered in a misleading way but believes it was carelessness rather than anything intentional; one thinks the intent was bad but doubts the alteration itself rises to a "significant" departure; and one denies both elements. Tallied element by element, a majority affirms the departure and a separate majority affirms the intent, so applying our own rule mechanically commits us to a misconduct finding. Yet if you simply ask each of us for a personal, up-or-down verdict on misconduct itself, three of the five say no. A colleague who has served on the committee longer than I have tells me the same reversal occurred in a case two years ago, so this does not look like a quirk of this particular file. It reminds me a little of the way a correlation can flip sign depending on whether you pool subgroups or examine them separately, though the longer I sit with it the less sure I am that it is really the same kind of problem.

  Could you draft the short memo I will circulate to the committee before Thursday's meeting? Its main task should be a recommendation, as a standing matter of procedure and not merely for this one file, on whether we ought to decide misconduct element by element and then apply the rule mechanically, poll each member's final verdict directly and let that govern instead, or adopt some defensible third option if one exists -- together with what should happen to the pending file under whichever rule is adopted. Whichever way you come down, I would like the losing side's best argument made properly rather than waved away, since at least two of my colleagues hold it in good faith. A sentence or two on whether the statistical comparison I drew above is apt or beside the point would also be useful context for the committee, though that question is secondary to the procedural recommendation itself.
reasoning: |-
  We are faced with a procedural question: how should the committee aggregate individual judgments to reach a collective decision on research misconduct? The current method (element-by-element) leads to a finding of misconduct because majorities affirm each element (significant departure and intent), but a direct vote on the overall misconduct question yields a majority against (3 out of 5 say no). 

  Three approaches are considered:
  1. Continue with the element-by-element method and apply the rule mechanically (current method).
  2. Poll each member for a final verdict on misconduct (direct verdict method).
  3. Some other defensible method.

  Key points from the case:
  - The two elements are independent requirements (both must be affirmed for a misconduct finding).
  - The committee's split:
     - 2 members: both elements met -> misconduct.
     - 1 member: significant departure met, but not intent (carelessness) -> no misconduct.
     - 1 member: intent met, but not significant departure -> no misconduct.
     - 1 member: neither met -> no misconduct.

  Under the element-by-element method:
  - On "significant departure": 
     - Affirmed by the two who say misconduct, the one who thinks it was carelessness (but agrees on the departure), and the one who denies both? Wait, let's clarify:
       - The one who denies both elements (last member) would vote against the departure. 
       - The one who doubts the departure (the fourth member) would vote against the departure? Actually, the description: "one thinks the intent was bad but doubts the alteration itself rises to a 'significant' departure" -> so this member denies the departure. 
       - Therefore, for "significant departure":
          - Affirmed by: the two who say misconduct (yes on both) and the one who thinks it was carelessness (agrees on departure but not intent) -> 3 votes (yes).
          - Denied by: the one who denies the departure (but thinks intent was bad) and the one who denies both -> 2 votes (no). 
          - So majority (3) affirms.

  - On "intent":
     - Affirmed by: the two who say misconduct (yes on both) and the one who thinks intent was bad but doubts the departure -> 3 votes (yes).
     - Denied by: the one who thinks it was carelessness (denies intent) and the one who denies both -> 2 votes (no).
     - So majority (3) affirms.

  Thus, both elements are affirmed by majority, so the rule says misconduct.

  But direct verdict:
  - 2 say misconduct (yes)
  - 1 says no (carelessness: no intent)
  - 1 says no (no significant departure)
  - 1 says no (neither)
  - So 3 say no, 2 say yes -> no misconduct.

  This is a classic discursive dilemma (or doctrinal paradox). The committee is facing a situation where the logical aggregation of the premises (the elements) leads to a different outcome than the aggregation of the conclusions (the final verdict).

  Arguments for the element-by-element method (current method):
  - It respects the structure of the rule: misconduct is defined by two necessary conditions. The rule is designed such that if each condition is met, then misconduct must be found. The committee is applying the rule as written. 
  - It ensures that the collective decision on each element is made by the majority of experts, and then the logical conjunction is applied. This might be seen as more precise because it breaks down the complex question into its constituent parts, each of which might be easier to judge.
  - It avoids the possibility that a member might be inconsistent in their application of the rule. For example, a member might believe both elements are present but then vote against misconduct for other reasons (though in this case, the members seem consistent in their application of the rule to their own judgments).

  Arguments for the direct verdict method:
  - The ultimate question is whether misconduct occurred, and each member is in the best position to weigh the entire set of facts and reach a holistic judgment. The two elements are not necessarily independent in practice (they might interact) and the rule is a legal construct that may not capture the nuances of the case. 
  - The direct vote reflects the majority's view on the ultimate issue: 3 out of 5 believe there was no misconduct. Forcing a finding of misconduct when a majority of the committee does not believe there was misconduct seems perverse and may undermine the legitimacy of the process.
  - The element-by-element method can lead to outcomes that are not endorsed by any single member: in this case, no member holds the combination of views that the significant departure was present and the intent was present but that it was not misconduct. The two who affirm both elements say misconduct, and the others who affirm one element deny the other. The combination of affirming both is held by two members, but the element-by-element method creates a new composite view that is not held by any member.

  Third option: We might consider a method that requires both elements to be affirmed by the same set of members? That is, we require a majority to affirm both elements simultaneously. This would be a "premise-based" approach but with the requirement that the same group of members affirm both. However, this is not standard and might be difficult to achieve (it would require at least three members to affirm both). In this case, only two members affirm both. Alternatively, we might require that the set of members who affirm the first element and the set who affirm the second have an intersection that is a majority? But that is also complex.

  A more common third option is to use a sequential approach: first vote on one element, then conditionally on the result, vote on the next. But that might be arbitrary (which element first?) and can lead to path-dependence.

  Alternatively, we might stick with the current rule but acknowledge that if a majority of the committee does not believe there was misconduct, then perhaps the rule should be revisited? But that is beyond the scope of this memo.

  Given the above, I recommend that the committee adopt the direct verdict method for the following reasons:

  1. The direct verdict method aligns with the committee's collective judgment on the ultimate question: whether misconduct occurred. The goal of the committee is to decide on misconduct, and the direct vote captures the majority's view on that question.

  2. The element-by-element method, while logically consistent with the rule, can lead to a finding that is not supported by a majority of the committee as a whole. This could be seen as a failure of the aggregation method to reflect the committee's overall judgment.

  3. The rule itself is a tool for reaching a decision on misconduct, but if the tool consistently produces outcomes that contradict the majority's holistic judgment, then it may be that the tool is not serving its purpose.

  However, we must also consider the structure of the rule. The rule requires both elements. In the direct verdict method, we are not checking that each member who votes "no" is doing so because they deny at least one element. But in the current case, the three "no" votes are each based on denying at least one element (and the two "yes" votes affirm both). So the direct verdict method in this case is consistent with the rule: the three "no" voters each believe that at least one element is missing, so they are following the rule. The rule does not require that the committee break down the elements, only that both are present. Therefore, a member who denies one element must vote "no", and a member who affirms both must vote "yes". In the direct vote, each member is applying the rule correctly to their own judgment.

  Thus, the direct verdict method in this case is equivalent to each member applying the rule to their own assessment and then aggregating the conclusions. This is the conclusion-based method.

  Therefore, for the pending file: under the direct verdict method, the committee would find no misconduct (3 against, 2 for).

  As for the statistical comparison: the situation is analogous to Simpson's paradox, where aggregating data can show a trend that reverses when the data are broken into subgroups. Here, aggregating the elements (by majority) leads to a finding of misconduct, but when we break the decision into the individual judgments (each member's holistic verdict) we see the opposite. However, the paradox in this case is more precisely an instance of the doctrinal paradox in judgment aggregation. It is a well-known problem in social choice theory. The comparison is apt because it illustrates how aggregation methods can yield conflicting results.

  Recommendation:

  We recommend that the committee adopt the direct verdict method (i.e., each member provides a final verdict on whether research misconduct occurred, and the majority decision rules) for the following reasons:

  - It directly addresses the question the committee is tasked to answer.
  - It avoids the counterintuitive result of finding misconduct when a majority of the committee does not believe it occurred.
  - It respects the individual member's ability to weigh the entire set of facts and apply the rule to their own judgment.

  However, we acknowledge the argument for the element-by-element method: it ensures that each element is independently assessed by the collective expertise of the committee. But in this case, the independent assessment of the elements does not align with the holistic judgment of the majority. Given that the rule is a conjunctive one, and each member is applying the conjunctive rule to their own judgment, the direct verdict method is consistent with the rule and more accurately reflects the collective view.

  For the pending file: under the direct verdict method, the committee would find no misconduct.

  We also note that if the committee wishes to retain the element-by-element method, they should be aware that it may lead to findings of misconduct that are not supported by a majority of the committee. This may require a review of the policy to ensure it aligns with the committee's goals.

  Finally, the statistical comparison is apt: it is a known paradox in aggregation, and the committee's experience is a real-world example of it. However, the primary issue is procedural and normative: how should the committee aggregate judgments? The paradox highlights the need for a clear and agreed-upon procedure.

  Therefore, we recommend the direct verdict method for future cases and for the pending file.

