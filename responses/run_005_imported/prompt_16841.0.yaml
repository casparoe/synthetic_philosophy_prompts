  **MEMORANDUM**

  To: Committee on Research Integrity  
  From: [Your Name], Emeritus Member  
  Date: [Current Date]  
  Subject: Recommendation on Decision Procedure for Research Misconduct Findings  

  In light of the recurring issue where the application of our element-by-element voting method (as required by the current policy) leads to a finding of misconduct when a majority of the committee, when polled directly on the ultimate question, would find no misconduct, I propose we reconsider our decision procedure. This memo outlines the problem and recommends a change to the direct verdict method.

  ### Background
  Our policy defines research misconduct as requiring two independent elements: (1) a significant departure from accepted practices, and (2) intent (intentional, knowing, or reckless behavior). Both must be present for a misconduct finding. 

  In the current case, the committee split as follows:
  - 2 members: affirm both elements -> misconduct.
  - 1 member: affirms element (1) but denies (2) (carelessness) -> no misconduct.
  - 1 member: affirms element (2) but denies (1) (not significant) -> no misconduct.
  - 1 member: denies both -> no misconduct.

  Under our current method:
  - A majority (3) affirms element (1).
  - A majority (3) affirms element (2).
  - Therefore, the mechanical application of the rule yields a misconduct finding.

  However, a direct vote on the ultimate question of misconduct yields 3 against and 2 for.

  ### The Problem
  This situation is a known phenomenon in judgment aggregation (sometimes called the doctrinal paradox). It arises because the element-by-element method aggregates premises independently, which can lead to a conclusion that is not endorsed by a majority when the members vote on the conclusion directly.

  ### Arguments for the Current Element-by-Element Method
  - It strictly follows the logical structure of the rule: both elements must be present, and the rule is applied by independently assessing each element by majority vote.
  - It ensures that each element is given focused consideration and leverages the committee's collective expertise on each component.

  ### Arguments for the Direct Verdict Method
  - The ultimate question is whether misconduct occurred. The direct vote reflects the majority's holistic judgment on that question, which is the committee's primary task.
  - The element-by-element method can lead to a finding of misconduct that is not supported by a majority of the committee, which may be seen as illegitimate and undermine confidence in the process.
  - In the direct method, each member applies the conjunctive rule to their own judgment. Therefore, a member who denies at least one element must vote against misconduct. This is consistent with the rule.

  ### Recommendation
  I recommend we adopt the **direct verdict method** for determining research misconduct. Specifically, each member should be asked for their final verdict (yes or no) on whether research misconduct occurred, and the majority vote should decide. This method better captures the collective judgment of the committee on the ultimate issue.

  For the pending file, applying the direct verdict method would result in a finding of **no misconduct** (3 no, 2 yes).

  ### Addressing the Statistical Comparison
  The comparison to a statistical paradox (like Simpson's paradox) is apt: it illustrates how aggregation methods can yield different results depending on whether we look at components or the whole. However, the choice between methods is not statistical but procedural and normative. We must decide what we value more: the independent assessment of each element by the collective, or the collective's overall judgment on misconduct. I argue for the latter.

  ### Conclusion
  Adopting the direct verdict method would align our decision process with the majority view of the committee on the ultimate question. It would avoid the counterintuitive outcomes we have observed. If the committee wishes to retain the element-by-element method, we should be aware of its potential to produce findings not supported by a majority and consider whether the policy should be revisited.

  I look forward to discussing this at Thursday's meeting.
