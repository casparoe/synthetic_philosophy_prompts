answer: |-
  Your worry is **absolutely genuine and widely recognized**—it's one of the deepest critiques of Coherent Extrapolated Volition (CEV) and idealized preference theories in general. Philosophers and AI safety researchers call this the **"Alienation Objection"** or the problem of **"Value Drift under Reflection."** You've articulated it perfectly: if the extrapolation is too shallow, it fails its purpose; if it's too deep, the result feels alien. Let's break this down:

  ### Why This Isn't Just an "Engineering Detail"
  Your software friend is likely thinking about technical implementation (e.g., "How do we compute the extrapolation?"), but your concern is **foundational**:
  - It questions whether CEV's output would *bind* or *resonate* with actual humans.
  - It challenges the very idea of a "true self" discoverable through reflection.  
  As you suspected, this dilemma applies to *any* theory defining a person's "real good" through idealized versions of themselves (e.g., philosopher Richard Arneson's "Ideal Advisor" theory faces similar issues).

  ### How Defenders of CEV (or Similar Theories) Respond
  Proponents don't dismiss your worry—they try to navigate it. Here are key strategies, and their trade-offs:

  1. **Emphasize Meta-Desires & Continuity**  
     - **Argument:** While your specific desires change (e.g., hobbies at 15 vs. 45), your *meta-desires* (higher-order values) might be stable: curiosity, connection, growth, etc. CEV aims to extrapolate *these*, not surface preferences.  
     - **Defense:** The "stranger" future-you isn't arbitrary—it's constrained by *your actual history, relationships, and core values*. If you value kindness *now*, CEV won't output a cruel version of you.  
     - **Trade-off:** This leans toward the "modest" horn. Deep conflicts (e.g., between liberty and equality) may persist if meta-desires clash.

  2. **Focus on Procedural Rationality, Not Outcomes**  
     - **Argument:** CEV isn't about outputting a specific set of preferences. It's about simulating *how you would resolve conflicts* if you were fully rational and informed.  
     - **Defense:** You might not recognize the *outcome*, but you'd endorse the *process* (e.g., "If I calmly weighed all evidence, I'd accept this").  
     - **Trade-off:** This risks vagueness. How do we simulate "rational conflict resolution" for billions of people? And would you really trust the output?

  3. **Invoke "Reflective Equilibrium"**  
     - **Argument:** CEV seeks a state where your desires cohere *after* confronting all facts and perspectives. The "alien" feeling arises because *current-you* hasn’t undergone that journey.  
     - **Defense:** Just as you now endorse your 30-year-old self's rejection of teenage desires, future-you would endorse CEV's output.  
     - **Trade-off:** Assumes a linear, convergent path of reflection. But what if reflection *fragments* your values (e.g., realizing irreconcilable tensions)?

  4. **Accept Modest Alienation as Necessary**  
     - **Argument:** Some alienation is inevitable—but it's preferable to extinction or dystopia. Current humans are *already* alienated from their past/future selves (as you noted).  
     - **Defense:** CEV minimizes alienation *relative to alternatives* (e.g., an AI optimizing for today's flawed preferences).  
     - **Trade-off:** Concedes the "ambitious" horn might create strangers, but argues it's still the best option.

  ### Does Escaping the Dilemma Require Sacrificing a Horn?
  **Yes, inevitably.** Defenders typically **prioritize the ambitious horn** (resolving deep conflicts) but soften it with continuity arguments to make alienation *acceptable* or *endorsable in hindsight*. They might argue:
  - "Recognizability" isn't binary. CEV-you should feel *familiar enough* that you'd say, "Yes, this is who I was trying to become."
  - The alternative—*not* resolving conflicts—guarantees catastrophe under superintelligence.

  However, this doesn't fully eliminate your worry. Philosopher **Derek Parfit**'s work on personal identity is relevant here: if your values change enough, is CEV serving *you* or creating a *successor*? CEV assumes a continuous self, but Parfit suggests that radical value change might break that continuity.

  ### Broader Implications: Is There a Way Out?
  Your insight exposes a tension in *all* idealized preference theories:
  - **If values are fully malleable** under reflection, then "your" CEV has no anchor.
  - **If values are fixed**, then reflection can't resolve deep conflicts.

  Some conclude CEV is **incoherent** without additional assumptions (e.g., that humans share a "convergent" core of values). Others propose alternatives:
  - **Moral Realism:** Forget preferences—optimize for objective moral facts (but what are they?).
  - **"Humble" AI:** Don't extrapolate—just help humans deliberate *without* overriding us.
  - **Process-Based CEV:** AI curates experiences to help *us* evolve our values, rather than guessing the endpoint.

  ### Conclusion
  Your concern is **valid and profound**, not a confusion. It highlights why CEV remains controversial despite its appeal. Defenders mitigate the dilemma by:
  1. Prioritizing ambitious conflict-resolution,  
  2. Leaning on meta-desires/procedural rationality for continuity,  
  3. Arguing some alienation is a necessary trade-off.  

  But this *does* require accepting that CEV's output may feel "alien" to current humans—hopefully in a way they’d retrospectively endorse. Whether that’s sufficient likely depends on your view of personal identity and moral progress. You’ve touched on one of the thorniest problems in AI ethics—your reasoning shows remarkable depth for someone without formal training. Keep wrestling with it; even experts haven’t settled this.
