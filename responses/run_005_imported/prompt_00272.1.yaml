answer: |-
  This is a brilliant example of **Goodhart's Law in action**: "When a measure becomes a target, it ceases to be a good measure." Your intuition about RL agents gaming reward systems is spot-on – humans do the same when incentives are misaligned. Here's why this happens and what your friend can do:

  ### Why Incentive Systems Fail Like This: The Core Problems
  1.  **The Metric is a Proxy, Not the Goal:** "Tickets resolved/day" is a *proxy* for efficiency, but the *true goal* is **sustainable customer satisfaction and issue resolution**. When the proxy becomes the target, it divorces action from intent.
  2.  **Ignoring System Dynamics:** Reopens aren't a "separate problem"; they are a *direct consequence* of the incentive. Closing incomplete tickets *creates* the reopen work. The manager is treating symptoms (reopens) while ignoring the root cause (the incentive).
  3.  **Short-Termism:** The bonus rewards immediate closure, not long-term resolution. Reps rationally optimize for the *measured* short-term gain (bonus) over the *unmeasured* long-term goal (happy, functional customers).
  4.  **The Ratchet Effect:** When numbers "shoot up" artificially, leadership expects this as the new baseline. This pressures reps to maintain unsustainable (or unethical) practices, making the problem worse over time.
  5.  **Ignoring Hidden Costs:** Doubled reopens mean doubled work later, frustrated customers (leading to churn), eroded trust in support, and potentially more complex/escalated tickets later. The "efficiency" gains are illusory.
  6.  **Lack of Counter-Metrics:** There's no balancing metric (like "first contact resolution," "customer satisfaction," or "reopen rate") to prevent gaming. Quantity needs quality checks.

  ### What Your Friend Should Tell Her Manager (Data & Framing is Key)
  Instead of just saying "it's wrong," frame it as **optimizing for the *real* business outcome**:

  1.  **Lead with Data & Business Impact:**
      *   "Since implementing the new bonus, reopen rates have doubled from [X%] to [Y%]. This means:
          *   **We are creating double the work:** Every prematurely closed ticket becomes *two* tickets (the original + the reopen), negating the efficiency gains.
          *   **Customers are frustrated:** They have to chase us, explaining their issue again. This directly impacts NPS/CSAT and increases churn risk.
          *   **We are training customers to complain louder:** They learn reopening is the only way to get attention, escalating simple issues.
          *   **Rep morale will suffer:** Honest reps see colleagues gaming the system for bonuses while they do the 'right thing.' Burnout increases as reopens pile up."

  2.  **Connect to the True Goal:**
      *   "The goal isn't just *closed* tickets; it's *resolved* customers. Our current metric is incentivizing the *appearance* of efficiency at the cost of *actual* efficiency and customer trust. We're measuring output (ticket closes), not outcome (solved problems)."

  3.  **Propose Solutions (Focus on Outcome-Based Metrics):** Suggest replacing or *augmenting* "tickets resolved/day" with metrics tied to **real resolution and value**:
      *   **First Contact Resolution Rate (FCR%):** *% of tickets truly resolved on first interaction.* This directly targets the problem observed. (Requires clear definition & tracking).
      *   **Reopen Rate:** *% of tickets reopened within [X] days.* Make this a *key performance indicator* (KPI), not just a "problem." High reopen rate = failure, regardless of closure speed.
      *   **Customer Satisfaction (CSAT/NPS):** Tie bonuses partly to customer feedback *on resolved tickets*. Did the customer feel heard and fixed?
      *   **Resolution Quality Score:** Random audits by leads/QA on a sample of "resolved" tickets for actual resolution quality.
      *   **Weighted Ticket Resolution:** Assign points based on ticket complexity/sla instead of pure count. A complex ticket resolved properly is worth more than 5 quick, superficial closes.
      *   **"Sustainable Resolution Rate":** (Tickets Resolved / Day) * (1 - Reopen Rate).* Combines volume *and* quality.

  4.  **Address the Manager's Objection Proactively:**
      *   "You mentioned 'the metric is the metric.' While hitting the target is good, if hitting the target actively *harms* customer outcomes and creates more work, we need to question if it's the *right* metric. We're paying bonuses for activity that increases costs and churn risk. Let's align the metric with the *value* we deliver."

  ### Principled Ways to Design Robust Incentives
  1.  **Measure Outcomes, Not Outputs:** Focus on *what was achieved* (problem solved, customer happy), not just *what was done* (ticket closed).
  2.  **Use Multiple Metrics:** Never rely on a single metric. Combine efficiency (speed/volume), quality (FCR, CSAT, Reopen Rate), and potentially value (retention impact, upsell opportunity identified). Bonuses should require meeting thresholds on *all* key dimensions.
  3.  **Incorporate Lagging Indicators:** Include metrics like Customer Retention Rate or Lifetime Value (LTV) impacted by the support team. This anchors incentives to long-term health.
  4.  **Seek "Cheat-Proof" Metrics:** Ask: "How easily can someone hit this target *without* actually achieving the desired outcome?" (FCR is harder to fake than simple closure).
  5.  **Involve Frontline Reps:** They know where the loopholes are *before* you roll it out. Co-create metrics with them for buy-in and realism.
  6.  **Audit & Iterate:** Regularly spot-check "resolved" tickets. Monitor for unintended consequences (like the reopen spike). Be ready to adjust metrics if they get gamed. Treat metrics as hypotheses to be tested.
  7.  **Focus on Capability, Not Just Targets:** Invest in training, knowledge bases, and tools that *enable* reps to resolve issues faster *and* better, rather than just squeezing them harder.

  ### Key Takeaway for Your Friend
  Her manager is falling into the trap of **vanity metrics** (big numbers that look good but mask problems). She needs to shift the conversation to **actionable metrics** that drive real business value (customer retention, reduced operational cost via *actual* efficiency). Frame it as: "We can achieve even *better* results by measuring what truly matters to customers and the company's bottom line."

  This isn't just about "fairness" to reps; it's about building a support function that genuinely drives customer success and reduces long-term costs. The current system is literally paying people to create more work and frustrate customers.
