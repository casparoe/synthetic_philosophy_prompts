answer: |-
  You've pinpointed a crucial tension within deprivationist accounts of death's badness. Arguing for the consistent deprivationist position – that an infant's death is *at least* as bad as a young adult's, potentially worse based on life-years lost – requires confronting McMahan's elegant solution head-on and demonstrating that its intuitive appeal comes at a higher philosophical cost than biting the deprivationist bullet. Let's build the case:

  **The Steelman of McMahan's Time-Relative Interest Account (TRIA)**

  McMahan's core insight is that the strength of an individual's *interest* in continuing to live isn't solely determined by the *quantity* of future goods lost, but by the *relation* the individual *at the time of death* bears to the future subject who would have enjoyed those goods. He grounds this in the psychological connectedness (shared memories, beliefs, intentions, character traits) and continuity (the overlapping chains of connectedness) that constitute personal identity over time.

  *   **The Problem it Solves:** Naive deprivationism struggles to explain why we intuitively feel the death of a vibrant 25-year-old (losing ~55 years) is a greater tragedy *for them* than the death of a newborn (losing ~80 years). TRIA explains this by arguing the 25-year-old is *strongly psychologically connected* to the person who would have lived the next year, five years, even decades. Their plans, relationships, and self-conception are deeply invested in that future. The newborn, however, while possessing the *potential* for a rich future self, has minimal current psychological connections *to* that specific future self. Their "time-relative interest" in continuing to live is weaker because the future beneficiary is, psychologically, almost a different person.
  *   **Why it's Appealing:** It captures a powerful intuition about the significance of our *current* psychological structure and narrative. It explains why killing someone in their sleep feels less *personally violating* (though still gravely wrong) than killing them while they are vividly anticipating their future. It seems to respect the perspective of the individual *at the moment they cease to exist*.
  *   **Addressing the Timing Puzzle (Partially):** TRIA locates the *measure* of the harm firmly at the time of death – it's based on the interests of the individual *as they are then*. The harm itself remains deprivation (loss of future goods), but the *badness-for-the-subject* is indexed to their psychological state *at t*.

  **The Case for the Consistent Deprivationist: Biting the Bullet on Infants**

  1.  **Deprivationism's Core is Future Goods, Not Present Ties:** The fundamental deprivationist intuition is that death is bad because it irrevocably takes away a future that *would have contained goods for the individual*. The badness stems from the *absence of those goods in the life that could have been*. Whether the individual at death is *strongly connected* to the future experiencer seems secondary to the sheer magnitude of the loss *within the potential life narrative*. An infant loses a vast landscape of potential experiences, relationships, achievements, and growth – arguably a *greater* deprivation of possible goods than a young adult who has already realized some of their potential. The consistent deprivationist asks: Why should the *present psychological structure* of the individual at the moment of death diminish the badness of losing an *objectively larger* future?

  2.  **The Timing Puzzle Already Demands Abstraction:** Deprivationists have already conceded that the "harm" of death isn't a felt experience at a specific moment. They operate with concepts like "timeless harm," "harm located at death as a state-change," or "harm distributed across life." Accepting that the badness is a *counterfactual comparison* (life-with vs. life-without-death-at-t1) is central to the view. If we've already accepted that harm doesn't need a conscious subject *experiencing* it at a specific time (post-mortem), then why insist that the *measure* of that harm must be tightly bound to the psychological state *at that specific time (t1)*? The counterfactual future goods lost exist independently of the deceased's psychological state at t1. The magnitude of the loss is defined by the *potential life* extinguished, not the snapshot at extinction.

  3.  **Dissecting the Intuition TRIA Saves:** Why *does* the young adult's death *feel* worse?
      *   **Projection & Empathy:** We project ourselves onto the young adult. We vividly imagine *their* lost plans, loves, careers – things we value and understand. We struggle to project ourselves onto the infant in the same concrete way; their future is a blanker slate. Our grief is more acute for the known person with established connections *to us*.
      *   **Loss of Investment:** The young adult (and society) has invested significant resources (time, education, emotional energy) into creating that specific person. Their death feels like the waste of a mature investment. The infant represents only potential investment.
      *   **Agency & Narrative:** The young adult was actively authoring their life story. Their death cuts short an ongoing narrative. The infant's narrative was barely begun.
      *   **The Key Point:** These powerful intuitions primarily concern *our grief, societal loss, the waste of existing investment, and the violation of an active agent*. They are not necessarily reliable guides to the *intrinsic badness of the deprivation for the individual who died*. The infant is deprived of the *entirety* of becoming that agent, experiencing those loves, making those investments, and writing that narrative. The consistent deprivationist argues that losing the *opportunity to have* those robust future psychological connections and experiences is just as bad, if not worse, than losing them once you have them. Deprivation is about the loss of *what could have been*, full stop.

  4.  **The High Cost of TRIA: Dementia, Amnesia, and the Erosion of Self:** This is where TRIA's cost becomes truly apparent. If the badness of death scales with current psychological connectedness to the future, then:
      *   **Severe Dementia:** An individual with advanced dementia, whose psychological connections to both past and future selves are profoundly eroded, has a drastically diminished time-relative interest in continuing to live, according to TRIA. Their death, even if it cuts short biological life, is significantly *less bad for them* than the death of a cognitively intact person. This risks devaluing the lives of those with dementia and potentially weakening the ethical barriers to actions ending those lives, purely based on diminished psychological unity.
      *   **Traumatic Amnesia/Dissociation:** Someone who suffers severe amnesia or dissociative identity disorder, fragmenting their psychological continuity, would, on TRIA, have a weaker time-relative interest in future existence *during periods of low connectedness*. Surviving the amnesic episode wouldn't retrospectively make the death *during* that episode worse for them; the badness was low *at the time* due to low connectedness. This implies that periods of psychological fragmentation intrinsically lessen the harm of death occurring *then*.
      *   **The Counterintuitive Result:** TRIA implies that interventions preventing death become *less* urgently required for an individual as their psychological connectedness diminishes, even if their biological capacity for well-being remains (e.g., a dementia patient who still enjoys simple pleasures). This seems deeply counterintuitive. We don't typically believe that developing dementia retroactively makes the potential death they avoided at age 30 *worse* by comparison, nor that it makes their *current* potential death less bad *for them* in a way that meaningfully reduces our obligation to preserve their life and well-being. The deprivationist, focusing solely on the loss of future goods (which might include simple sensory pleasures for the dementia patient), avoids this implication. Death is still the total deprivation of *all* future goods, regardless of the complexity of the psychological vessel at the moment of sinking.

  **Conclusion: The Cheaper Bullet**

  The consistent deprivationist concedes that the death of a young adult *feels* subjectively worse *to us*, and involves a more acute loss of a specific, realized potential. However, they argue that the *intrinsic badness for the one who dies* is fundamentally about the magnitude of the future life goods extinguished. The infant loses more potential life-years and the entire spectrum of experiences contained within them. Swallowing the bullet that this loss is *at least as bad* is philosophically cheaper than adopting TRIA.

  TRIA, while brilliantly capturing certain intuitions, ties the badness of death too tightly to a potentially volatile and morally problematic metric – current psychological connectedness. It forces us into uncomfortable and potentially dangerous conclusions about the value of lives during periods of psychological fragmentation or decline. The deprivationist, having already accepted the abstract, counterfactual nature of death's harm ("no subject, but still a harm"), maintains a simpler, more objective, and arguably more ethically stable foundation: death is bad because of *what it takes away*, and the more it takes away, the worse it is. On this measure, the infant's death represents a greater deprivation. The intuition otherwise, the consistent deprivationist concludes, is our empathy misfiring, confusing our own sense of loss with the decedent's deprivation.
