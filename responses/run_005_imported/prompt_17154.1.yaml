  **Part (c) (Rival Theories?) - 2/3**  
  *Comments:* Correctly notes agreement on utterance truth-values but oversimplifies. Fails to mention *key differences*: contextualism is semantic (about "knows" meaning), while pragmatic encroachment is metaphysical (about knowledge *itself* depending on stakes). Also misses test cases (e.g., disagreement across contexts).  

