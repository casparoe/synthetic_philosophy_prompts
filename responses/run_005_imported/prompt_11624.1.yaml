answer: |-
  ## Oxford Common Room, 1956 - The Truman Vote

  **Characters:**  
  *   **Professor Eleanor Thorne:** Late 50s, sharp-eyed, precise. A moral philosopher deeply influenced by Aquinas and Wittgenstein. Embodies the Anscombean position.  
  *   **Dr. Felix Vance:** Early 40s, energetic, slightly rumpled. A rising star in political philosophy with consequentialist leanings.  

  *(The scene: High table lunch has ended. Thorne and Vance linger over coffee amidst the clatter of clearing plates. The recent Convocation vote hangs in the air.)*

  **Vance:** (Leaning forward, voice low but intense) Eleanor, I must confess, I’m still reeling from the Convocation vote. This ‘non placet’ business… particularly yours. To publicly condemn the man who ended the Pacific War? It seems… wilfully blind to the arithmetic of human suffering. A land invasion would have been carnage.

  **Thorne:** (Calmly stirring her coffee) Felix, the arithmetic, as you call it, is precisely *not* the point. Miss Anscombe’s argument, which I find compellingly clear, cuts through that fog of utilitarian calculation. It distinguishes fundamentally different *kinds* of acts. Bombing a munitions factory knowing nearby civilians *might* die – tragic, perhaps justified by double effect – is categorically distinct from deliberately targeting a civilian population *as such* to break their will. That is murder.

  **Vance:** Murder? Good Lord, Eleanor! Murder requires malice, premeditation against an individual. This was war. Truman faced an impossible choice between two horrific options. He chose the one that demonstrably saved hundreds of thousands, likely millions, of lives – American *and* Japanese. To call that murder empties the word of meaning.

  **Thorne:** It empties it only if we refuse to see the moral structure of the act. The *intention* defines it. When you drop a bomb on a city center, knowing it contains no significant military targets – Hiroshima wasn't *just* a port, Nagasaki wasn't *just* an industrial city; they were chosen *because* they were largely untouched, to maximize the spectacle of destruction – and when you *aim* at the civilian populace to induce terror and thus surrender, you make those innocent people *the means* to your end. That *is* premeditated killing of the innocent as a tool. That *is* murder in the classical, moral sense.

  **Vance:** Intention! That’s the slippery heart of it, Eleanor. How on earth do you *know* what was truly in Truman’s mind, or Stimson’s, or Groves’? The official line was always about shortening the war, saving lives. Are you a mind-reader? Or are you judging purely by the *outcome* – dead civilians – and then *imputing* the intention based on that? That seems suspiciously close to the consequentialism you decry.

  **Thorne:** (Eyes flashing) We judge intention by the *nature of the act chosen* and the *circumstances*. They didn't drop a leaflet on a factory district hoping to scare workers. They obliterated two entire cities, predominantly civilian, with weapons of unprecedented horror. They issued no fresh ultimatum after the first bomb, gave no time for the shock to translate into reconsideration before the second fell on Nagasaki. The speed itself reveals the tactic: overwhelming, terrorizing destruction. The act *itself* proclaims the intention to use civilian death *as the direct instrument* of policy. One doesn’t use a sledgehammer to crack a walnut unless one intends to obliterate the nut. The means chosen *are* the clearest evidence of the end intended.

  **Vance:** Even granting that interpretation of intent – which I think is debatable, focusing solely on the horror rather than the strategic context of a fanatical regime – why should this elusive mental state transmute the *physical act*? Two bombs fall. Civilians die. The consequence is identical. Why does Truman’s supposed secret intention to use their deaths instrumentally make it morally worse than, say, Churchill foreseeing with near certainty the deaths in the Dresden firestorm while intending to hit rail yards? The dead children don’t care about the fine distinction!

  **Thorne:** Because morality concerns *actions*, Felix, not just outcomes. An action is defined by the will directing it. To *choose* to kill the innocent directly, to *make* their death your chosen means, corrupts the agent and the act itself. It violates a fundamental barrier. Foreseeing death as a side-effect while pursuing a legitimate military target is terrible, but it doesn’t cross that Rubicon. It doesn’t *use* persons as mere things. That distinction isn't elusive; it's the bedrock of any coherent notion of justice in war. To ignore it reduces everything to a calculus of bodies, where any atrocity can be laundered by a sufficiently large projected body count.

  **Vance:** (Scoffs slightly) And where does this ‘fundamental barrier’ get us? Paralyzed? Stuck with the bloodier option because we’re too squeamish about *how* we achieve the lesser evil? Anscombe herself concedes the Allies demanding unconditional surrender was folly. *That* was the original sin, creating the scenario where invasion seemed necessary! Truman inherited that mess in August '45. He didn't draft the Potsdam Declaration. He couldn't magically undo the commitment. He faced the world *as it was*, with the tools *he had*. Are you saying he was morally obliged to choose the invasion – knowing it meant mountains of corpses – purely to keep his own hands ‘clean’ by your definition? Isn't *that* the greater moral failure?

  **Thorne:** (Leans back, considering) A fair thrust, Felix. The unconditional surrender demand *was* a profound error, inflaming Japanese resistance unnecessarily. It *did* constrain Truman’s options. But here’s the rub: inheriting a bad situation doesn't license *any* means to escape it. One cannot say, "Because my predecessors painted me into a corner where either I murder innocents or allow a slaughter, therefore murder becomes permissible." The moral prohibition stands. Facing two evils doesn't magically convert one into a good; it remains an evil, even if arguably the lesser one. Choosing it still requires acknowledging it *as* murder, not laundering it as justified strategy. Truman’s tragedy was being forced to choose between profound evils; it doesn’t make the choice he made *not* a choice for mass killing of the innocent as a means.

  **Vance:** So, he should have chosen invasion? Condemned perhaps a million more to death? Sacrificed them on the altar of this… this metaphysical purity of intention? That seems like moral narcissism, Eleanor. Prioritizing the state of one’s own soul over the concrete, screaming reality of preventable suffering on an unimaginable scale. Consequentialism at least forces us to look squarely at the bodies.

  **Thorne:** (Quietly) And your consequentialism, Felix, risks making us comfortable with manufacturing those bodies ourselves, directly, if the numbers seem to add up. It risks making us monsters who believe the ends *do* justify *any* means. Miss Anscombe voted ‘non placet’ not because she denies the horror of invasion, but because she refuses to *honour* the man who crossed that line. To call it anything other than what it was – the mass killing of innocents as a chosen tool – is to betray the very concept of justice we claim to defend. The vote wasn’t about strategy; it was about refusing to call darkness light. Coffee’s cold. I must prepare for my tutorial. *(She rises, her expression resolute but weary.)*

  **Vance:** (Watches her go, then stares into his own cold cup, frowning deeply. He murmurs, more to himself than anyone) Refusing to call darkness light… or refusing to see the terrible grey where most of us actually live? The numbers *were* real, Eleanor. The bodies *were* real. Does intent really make *that* much difference to them? *(He sighs, the intellectual tension unresolved, the moral weight of history pressing down.)*
