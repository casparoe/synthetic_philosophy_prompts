  Hmm... what makes this particularly thorny is that both positions have strong philosophical foundations. The cousin's view aligns with contemporary autonomy principles (current wishes should prevail), while the mother's stance reflects a more paternalistic approach that prioritizes the aunt's long-term wellbeing over momentary desires. 

  I should acknowledge how ethically sophisticated this dilemma is. It touches on:
  - Temporal agency (are we the same person over time?)
  - Competence thresholds (when is someone "too impaired" to decide?)
  - The paradox of self-binding (can we ethically restrict our future selves?)

  The manic state introduces a crucial complication - research shows impaired insight and decision-making capacity during episodes. The aunt's past self anticipated this exact scenario, which gives weight to her directive. Still, overriding someone begging not to be hospitalized feels viscerally wrong, hence the user's discomfort. 

  What the user might not be articulating but seems to need: a way to reconcile the ethical tension without dismissing either perspective. They're probably also wrestling with guilt - wondering if supporting the directive makes them complicit in harming their aunt. 

  The resolution frameworks I consider should validate both viewpoints while offering practical ethical navigation tools. The Ulysses contract metaphor feels apt here - it's about binding oneself against future irrationality. But I must also emphasize that real-world application requires rigorous safeguards: Was the directive properly documented? Did doctors verify she met criteria for incapacity? 

