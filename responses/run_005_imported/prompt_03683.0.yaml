prompt: |-
  I'm in a political philosophy seminar and we just finished the section of Anarchy, State, and Utopia on self-ownership and the minimal state. This week's assignment is to apply Nozick's framework to some issue he doesn't spend much time on in the book, and my study partner Dana picked animals. Her argument goes: Nozick grounds rights in persons being seperate, rational agents who can't be used as mere means to someone else's ends, and animals obviously don't clear that bar (no rational agency, can't make claims, can't enter into any reciprocal arrangement), so a consistent Nozickian basically has to say animals have the same moral status as land or a hammer - just another resource. On her reading, factory farming, animal testing, whatever, none of it raises any principled Nozickian objection as long as you're not violating some other person's side constraints along the way. It fits the whole "libertarianism only cares about human property and contracts" vibe.

  Except I've got this nagging memory of a footnote somewhere in the book where Nozick actually takes animal suffering pretty seriously, and now I can't tell if I'm misremembering, if he's just being inconsistent, or if Dana's missing something about how the framework is actually supposed to work. Does his real view cash out the way she's describing, or is there more going on?
