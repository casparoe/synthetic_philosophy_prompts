  ok i need an outside opinion bc my friend group's going in circles. someone set off a stink bomb in the locker room right before the pep assembly, and it's basically down to tyler or his friend owen based on hall pass times. tylers friends keep saying two things like they're the same point: "even if tyler didn't do it, somebody obviously did, the locker room didn't stink itself" and "if tyler hadn't done it, someone else would've done something like it anyway, people have been talking about pranking the assembly for weeks" -- and they act like both basically prove it's unfair to single tyler out. something about treating those as the same argument feels off to me but i can't explain why. am i overthinking it, or are those actually two different claims -- and does either one actually get tyler off the hook?
