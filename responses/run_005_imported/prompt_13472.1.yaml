  1. On Gödel's view: It is true that after Cohen's result, Gödel became more pluralistic about set theory? Actually, Gödel's view is more nuanced. In his 1947 paper (before Cohen) and in the 1964 supplement (after Cohen), Gödel maintained that CH has a determinate truth value and that we should seek new axioms to decide it. However, in the 1964 supplement, he acknowledged the independence results and suggested that we might need to consider a multiverse of models, but he did not abandon the idea that there is a unique universe of sets. The student's claim that Gödel "came to treat CH as true in some legitimate models and false in others, with nothing further to discover" is an overstatement. Gödel did not set the problem aside for the rest of his career; in fact, he continued to work on the continuum problem and believed in the existence of a unique set-theoretic universe. The student's analogy with geometry is apt for the multiverse view, but it is not clear that Gödel adopted that view. In fact, Gödel in his 1964 supplement wrote: "the continuum problem will finally turn out to be solvable by means of a new axiom". So the student's attribution is at best partially correct.

