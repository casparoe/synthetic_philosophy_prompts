  For Cohen: The explanation of forcing is simplified but adequate for this level. The key point is that Cohen built a model of ZFC + ¬CH, hence showing the consistency of ZFC + ¬CH relative to ZFC.

  Part (b) asks whether the independence result shows that CH lacks a determinate truth value or if there could still be a fact of the matter, and to defend the answer by engaging with at least one of: Gödel's view, the multiverse, or a contemporary axiom candidate.

