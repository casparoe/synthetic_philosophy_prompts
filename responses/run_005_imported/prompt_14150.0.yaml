  I should structure the response to first outline how average utilitarianism avoids the Repugnant Conclusion, then detail its paradoxes. Highlighting each problem with examples will make it relatable. Emphasizing that no theory is perfect here is key. The user might not be familiar with terms like critical level or variable value theories, so explaining those briefly could help. Also, mentioning that philosophers like Parfit and Arrhenius have explored these issues adds credibility.

