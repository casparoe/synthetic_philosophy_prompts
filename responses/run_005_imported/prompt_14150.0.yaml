answer: |-
  You're absolutely right to be skeptical - average utilitarianism doesn't "solve" population ethics; it just trades the Repugnant Conclusion for a whole new set of deeply problematic conclusions, many of which feel equally (or even more) counterintuitive or morally repugnant. Your friend's "obvious fix" creates significant philosophical quicksand.

  Here's why average utilitarianism runs into major trouble:

  1.  **The Mere Addition Paradox (and the "Sadistic Conclusion"):**
      *   **Scenario:** Imagine a population A: 10 people with incredibly wonderful lives (happiness +100 each). Average = +100.
      *   **Add Happy (but Slightly Less Happy) People:** Now imagine population A+: It has the original 10 people (+100), *plus* 100 new people with lives that are clearly worth living, say +80 happiness each. They are happy, just not *as* happy as the first group.
      *   **Problem:** The average happiness in A+ is now (10*100 + 100*80)/110 ≈ 81.8. This is *lower* than the original average of 100.
      *   **Average Utilitarianism's Verdict:** A+ is *worse* than A. Creating additional happy people (who are very happy themselves!) makes the world *worse* because they drag down the average. This seems deeply counterintuitive – adding positive happiness shouldn't make things worse.
      *   **The "Sadistic" Twist:** This can lead to the "Sadistic Conclusion": Average utilitarianism might prefer adding people with *negative* lives (suffering) over adding people with *positive* but below-average lives, *if* the negative lives hurt the average *less* than the positive-but-below-average lives would. This is morally perverse.

  2.  **The Extinction Problem:**
      *   **Scenario:** Consider a small, very happy population (say, 100 people at +100 happiness, average +100).
      *   **Add One Miserable Person:** Now imagine adding one person whose life is filled with suffering (happiness -50).
      *   **Calculation:** New average = (100*100 + 1*(-50)) / 101 ≈ 98.5.
      *   **Problem:** Average utilitarianism says this new state (101 people, average +98.5) is *worse* than the original state (100 people, average +100).
      *   **The Repugnant Implication:** What if the *only* alternative to adding this miserable person is... *no one existing at all*? That is, humanity goes extinct. Average utilitarianism would say: **Extinction is better than creating a world with one miserable person added to an otherwise very happy population.** This is because the average happiness of a non-existent population is undefined (or often treated as zero), and zero might be considered higher than a slightly reduced positive average that includes suffering. Preferring extinction over creating *any* suffering alongside happiness is an extreme and generally unacceptable conclusion.

  3.  **The "Critical Level" Problem & Asymmetry:**
      *   Average utilitarianism lacks a coherent "critical level" for adding new lives. It implies:
          *   Adding a person *above* the current average is always good (raises average).
          *   Adding a person *below* the current average is always bad (lowers average), *even if their life is worth living*.
          *   Adding a person *exactly at* the current average is neutral (no change).
      *   **Problem 1: Punishing Below-Average Happiness:** This creates a strong disincentive against creating anyone who isn't *above* average, regardless of how positive their life would be. Creating a happy-but-not-*as*-happy person is a *bad* act.
      *   **Problem 2: The Neutrality Intuition:** Many people feel that *not* creating a potential person with a life worth living is morally neutral. Average utilitarianism, however, says that *not* creating a person who *would* have been above average is a *missed opportunity* to increase the average, hence *bad* (or at least, failing to do good). Conversely, *not* creating someone below average is *good* (avoiding harm to the average). This creates complex and arguably unreasonable obligations/duties regarding procreation.

  4.  **Vulnerability to Small Populations:**
      *   Average utilitarianism is hypersensitive to the happiness of individuals in very small populations.
      *   **Example:** A world with one supremely happy person (+100) has an average of +100. Adding one moderately happy person (+80) drops the average to +90, making it worse. This seems absurd – two happy people feel intuitively better than one, even if the average is lower.
      *   **Worse Example:** A world with one person suffering immensely (-100). Average = -100. Adding a billion people with lives *slightly* worth living (+1 each) raises the average to almost +1. Average utilitarianism says this is a *massive improvement*. While reducing suffering is good, the implication that the initial suffering of the one person is almost irrelevant once diluted by a vast population of minimally happy lives is morally questionable.

  5.  **Ignores the "Total" Aspect of Well-being:** Critics argue it misses something fundamental: that more people experiencing positive well-being *adds* value to the world, even if the *average* dips slightly. Completely dismissing the "total happiness" aspect feels wrong to many.

  **Conclusion:**

  While average utilitarianism neatly dodges the **Specific Structure** of Parfit's Repugnant Conclusion (it prefers the small, happy population over the vast, minimally happy one), it crashes headlong into:

  1.  **The Mere Addition Paradox:** Condemning the creation of happy-but-not-*as*-happy people.
  2.  **The Extinction Problem:** Potentially preferring extinction over adding *any* suffering alongside happiness.
  3.  **The Sadistic Conclusion:** Sometimes preferring adding suffering people over adding happy-but-below-average people.
  4.  **Unreasonable Asymmetry & Obligations:** Creating complex and unintuitive duties around procreation based purely on predicted happiness relative to the current average.
  5.  **Counterintuitive Results with Small Populations.**

  **Your instinct was correct.** Average utilitarianism isn't a solution; it's just a different philosophical minefield. Population ethics is notoriously difficult precisely because *all* major theories (Total Utilitarianism, Average Utilitarianism, Critical Level Theories, Variable Value Theories) seem to generate at least one deeply counterintuitive or repugnant conclusion when pushed to its logical extremes. The debate continues because there's no universally accepted way to balance the value of quantity of lives, quality of lives, and the comparisons between different possible populations. Parfit himself spent decades wrestling with these problems without finding a fully satisfying solution. Your friend's "obvious fix" is far too simplistic for this notoriously thorny area of philosophy.
