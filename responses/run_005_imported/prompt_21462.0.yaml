answer: |-
  Here's a short, punchy joke specifically playing on the "second place pays" rule of the dollar auction:

  **Setup:**  
  *Two students, Alex and Sam, are deep into the dollar auction. The bidding is at $90...*

  **Alex:** (Sweating) "$95!"  
  **Sam:** (Panicked) "$100!"  

  **Punchline:**  
  **Alex:** (Immediately throws hands up) "**Fine! You win! I just paid $95 to watch you lose $99!**"

  ### Why it works
  1. **Specific Rule Focus:** The humor *entirely* depends on the second-place bidder (Alex) paying their last bid ($95) and getting nothing, while the winner (Sam) pays even more ($100) for a $1 bill, netting a $99 loss.
  2. **Escalation Highlight:** Shows the irrational commitment ("$100!" after "$95!") caused by the fear of being the *loser who still pays*.
  3. **Short & Classroom-Ready:** Easy to deliver quickly to your friend who knows the game.
  4. **Painful Irony:** Alex frames their $95 loss as a "cheaper" way to witness Sam's *even bigger* loss, which is the core tragedy of the dollar auction.

  **Alternative Punchline (if you want it drier):**  
  **Alex:** "Congrats! You paid $100 for a buck... and I just paid $95 to learn about 'escalation of commitment' the hard way."

  Tell it fast and watch your friend groan in econ-class solidarity! 😄
