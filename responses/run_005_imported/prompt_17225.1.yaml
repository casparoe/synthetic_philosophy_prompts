answer: |-
  What a fantastic intersection of geology and philosophy – and your instinct about Wittgenstein's "bedrock" imagery is spot-on. Let's excavate this properly. You're right about the core texts: the river-bed analogy is §96-99, and the hinge propositions are explicitly named around §341-343. The crux of Wittgenstein's critique of Moore isn't primarily about the *truth* of propositions like "Here is a hand," but about **Moore's misapplication of the concept "knowledge" (wissen) to them**. Wittgenstein isn't just filling in *why* they're bombproof; he's arguing they belong to a fundamentally different logical category, making Moore's entire framing a profound category mistake.

  Here's a detailed comparison, grounded in *On Certainty*:

  **Moore's Common-Sense Propositions ("A Defence of Common Sense," "Proof of an External World"):**
  1.  **Nature & Status:** Presented as **empirical knowledge claims** of the highest certainty. Moore asserts he *knows* (with the same sense of "know" used for "I know it rained yesterday" or "I know 2+2=4") propositions like:
      *   "Here is one hand" (holding it up).
      *   "The Earth has existed for many years past."
      *   "I am a human being."
  2.  **Function:** **Anti-skeptical weapons.** Moore uses them as *premises* in an argument *against* skepticism about the external world or the past. "Here is a hand" is offered as *proof* of an external world. Their indubitable certainty is meant to directly refute the skeptic.
  3.  **Epistemology:** Moore operates within a traditional epistemological framework. He believes:
      *   These propositions are known *empirically* (via sense perception, memory).
      *   They are *justified* by common sense and the evidence of our senses.
      *   Their certainty is so high that doubting them is unreasonable or absurd.
  4.  **Target:** Skepticism. Moore aims to show skepticism is *false* by demonstrating we *do* know these things.

  **Wittgenstein's Hinge Propositions (On Certainty, esp. §341-343, 94-99, 105, 152, 248, 401-403):**
  1.  **Nature & Status:** **Not empirical knowledge claims, but the framework (hinges, river-bed) for *having* empirical knowledge.** Wittgenstein argues they are *logically distinct*:
      *   §341: "**That is to say, the *questions* that we raise and our *doubts* depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn.**"
      *   §342: "**That is to say, it belongs to the logic of our scientific investigations that certain things are *in deed* not doubted.**" (Emphasis in original).
      *   §94-99 (River-bed): Propositions like "My name is L.W.", "The earth exists", "I have never been on the moon" are the **hard rock** of the river-bed. They are **fixed, not subject to test or confirmation**, unlike the "fluid" propositions of everyday experience or science that flow over them. The bed *can* shift, but **extremely slowly** and not through ordinary empirical testing.
      *   §152: "**I do not explicitly learn the propositions that stand fast for me. I can *discover* them subsequently like the axis around which a body rotates. This axis is not fixed in the sense that anything holds it fast, but the movement around it determines its immobility.**" (Emphasis added).
  2.  **Function:** **Enablers of the language-game, not premises within it.** They are not used to *prove* anything. They are what *must* be in place for doubting, questioning, investigating, and *knowing* ordinary empirical propositions to make sense.
      *   §105: "All testing, all confirmation and disconfirmation of a hypothesis takes place already within a system. ... The system is not so much the point of departure, as the element in which arguments have their life."
      *   §248: "**I have arrived at the rock bottom of my convictions. And one might almost say that these foundation-walls are carried by the whole house.**" (Emphasis added – note the inversion: the "foundation" is carried *by* the practices it enables).
  3.  **Epistemology: "Know" is grammatically misplaced.**
      *   §401: "**For it is not true that a doubt gradually lost its sense. No: it makes no sense *from the very outset* to doubt certain things.**" (Emphasis in original).
      *   §342 (cont.): "...it belongs to the *logic* of our scientific investigations..." (Not psychology or justification).
      *   Wittgenstein argues that saying "I know..." about a hinge proposition is **grammatically odd or nonsensical**:
          *   §10: "I know that that’s a tree." Why does it strike us as ridiculous? Because it tries to use "know" where doubt is logically excluded.
          *   §347: "My having two hands is, in normal circumstances, as certain as anything that I could produce in evidence for it. That is why I am not in a position to take the sight of my hand as evidence for it."
          *   To say "I know I have two hands" implies the *possibility* of doubt or error, which is precisely what the hinge status excludes. It sounds like boasting or stating the obvious in a way that misses its foundational role. **"Knowledge" requires grounds, justification, and the possibility of doubt. Hinges lack these features *by definition*.** They are the *background against which* grounds and doubt function.
  4.  **Target:** Moore's *misunderstanding* of the logic of our language, particularly the use of "know." While anti-skeptical in *effect*, Wittgenstein's primary target is showing why skepticism about hinges is *nonsensical*, not *false*. He dissolves the problem rather than refuting it head-on. §19: "The statement 'I know that here is a hand' may then be continued: 'for it's *my* hand that I'm looking at.' Then a reasonable man will not doubt that I know. – Nor will the idealist; rather he will say that he was not dealing with the practical doubt which is being dismissed, but there is a further doubt *behind* that one. – That this is an *illusion* has to be shown in a different way."

  **Does Moore's Anti-Skeptical Project Survive?**

  *   **Not in its original form.** Wittgenstein demolishes Moore's core strategy: using "I know..." about hinge propositions as a direct refutation of skepticism. Moore's "proof" is fundamentally flawed because it misapplies the grammar of "knowledge." It treats hinges as *super-empirical* knowledge claims, which Wittgenstein shows they are not. Moore's argument is, for Wittgenstein, a symptom of the misunderstanding it tries to cure (§464: "My aim is: to teach you to pass from a piece of disguised nonsense to something that is patent nonsense.").
  *   **But something profound *does* survive, transformed:**
      1.  **The *Truth* of Moore's Propositions:** Wittgenstein doesn't doubt the *truth* of "Here is a hand." He readily agrees it's certain. But its certainty isn't *epistemological* (based on evidence); it's *logical* or *grammatical*. It's bedrock.
      2.  **The *Anti-Skeptical Thrust*:** By showing that doubting hinges is *nonsensical* – it destroys the very framework needed for doubt or knowledge to make sense – Wittgenstein achieves a powerful anti-skeptical result, arguably deeper than Moore's. He doesn't *prove* the external world exists; he shows that the *denial* of its existence (as a general philosophical thesis) is incoherent within our actual language-games of describing the world. Skepticism about hinges isn't *false*; it's *incomprehensible*. As he says regarding Moore's truisms (§519): "So one might grant that Moore was right, if he is interpreted like this: a proposition saying that here is a physical object may have the same logical status as one saying that here is a red patch."
      3.  **The *Centrality* of Common Sense:** Like Moore, Wittgenstein affirms that our fundamental certainties are deeply embedded in our human form of life, our actions, our practices (§§ 110, 204, 411). Moore points to them; Wittgenstein analyzes *how* they function as the indispensable background.

  **The Geological Analogy Applied:**

  *   Moore sees "Here is a hand" as a massive, unshakeable **boulder** *within* the river of empirical claims – the hardest, most certain rock there is.
  *   Wittgenstein sees "Here is a hand" as part of the **river-bed itself**. It's not *in* the river (the flow of empirical propositions); it's *what the river flows over*. You don't point to the bedrock *as evidence* for the water flowing correctly; the bedrock is the *condition* for there being a river at all. Trying to "prove" the bedrock exists using the water flowing over it (as Moore tries to use sense-experience to prove the external world) is a fundamental confusion of logical categories.

  **Bottom Line:**

  Wittgenstein doesn't just fill in *why* Moore's propositions are bombproof; he fundamentally **re-categorizes** them. Moore frames them as the pinnacle of *knowledge*; Wittgenstein shows they are the *preconditions* for knowledge. Moore's "proof" is dismantled as a grammatical confusion – using "know" where it has no application. However, the *truth* and *indispensability* of what Moore pointed to is preserved and given a deeper explanation: hinges are the inarticulate, action-anchored bedrock of our language-games and form of life. Moore's anti-skeptical *goal* – showing skepticism about the external world is untenable – is achieved by Wittgenstein, but through a radical transformation of the philosophical landscape: skepticism about hinges is rendered nonsensical, not refuted by superior knowledge. The framing isn't just swapped; it's dissolved and rebuilt on entirely new (or rather, newly understood) foundations – the hard rock beneath the river of doubt.
