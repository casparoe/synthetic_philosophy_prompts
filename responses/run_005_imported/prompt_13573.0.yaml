answer: |-
  That's a fascinating and incredibly common microcosm of governance dilemmas! You've perfectly identified the core tension: competing legitimate claims to representation based on different principles (ownership, financial contribution, residency, impact). **There isn't one universally "non-arbitrary" answer that applies to every situation, but there *are* established principles, trade-offs, and practical considerations.** Let's break down the arguments and see where they lead:

  1.  **The Ownership Principle (Current System):**
      *   **Argument:** The association governs *property*. The owner holds the deed, has the ultimate financial stake (value tied to community condition), pays property taxes, and is legally responsible for dues. Voting follows ownership.
      *   **Pros:** Legally straightforward, aligns with property rights, ensures those with the most significant financial stake have a say. Simplifies administration (easy to verify).
      *   **Cons:** Can disenfranchise those most affected by daily decisions (long-term tenants, full-time residents). Allows absentee owners (especially pure Airbnb investors) who may have little connection to the community to decide issues impacting daily life. Feels unfair to those living with the consequences.

  2.  **The Residency Principle (Gary's Neighbor):**
      *   **Argument:** Decisions (road maintenance, noise rules, plowing schedules, common area use) impact the daily lives of residents. Therefore, those living there full-time should have the primary say.
      *   **Pros:** Most democratic for those experiencing the outcomes. Ensures decisions are made by people with "skin in the game" of daily community life. Reflects who uses the amenities most.
      *   **Cons:** Disenfranchises owners who pay dues and have a significant financial stake but don't live there full-time. Creates a "taxation without representation" scenario for seasonal owners. Logistically messy: How is "residency" defined (days per year? primary residence?)? Tenants come and go. Can incentivize absentee ownership if owners feel they have no voice.

  3.  **The Financial Contribution Principle (Dues Payer):**
      *   **Argument:** The association exists because of dues funding. Those who fund it should control it. This usually aligns closely with ownership.
      *   **Pros:** Ensures those paying the bills control the budget. Simple to administer (based on dues rolls).
      *   **Cons:** Same disenfranchisement issues as pure ownership. Doesn't address the "impact" argument. The non-member houses using the road complicate this – they *should* arguably be contributing financially.

  4.  **The Impact/Stakeholder Principle (Gary):**
      *   **Argument:** Voting rights should reflect who is most significantly impacted by the association's actions *and* who contributes to its well-being. This tries to blend residency and ownership/financial stake.
      *   **Pros:** Acknowledges that both financial contribution *and* lived experience matter. Could justify votes for long-term tenants (impact) while potentially reducing the weight of purely absentee investors (minimal impact).
      *   **Cons:** The hardest to define and implement objectively. How do you measure "impact" or "stake"? Who qualifies? Creates complex classes of membership/voting (owners-in-residence vs. absentee owners vs. tenants). Legally fraught regarding tenant rights vs. property rights.

  **Your Insight is Spot On:**

  > *"...everyone involved, including me, was kind of reverse-engineering whichever rule happened to benefit them personally and then dressing it up as a principle."*

  This is **fundamentally true of most governance debates.** People naturally gravitate towards systems that amplify their own voice. Recognizing this bias is crucial.

  **Is a "Non-Arbitrary" Solution Possible? (Spoiler: Not Perfectly)**

  *   **No Perfect Neutrality:** There is no magical formula that satisfies everyone's sense of fairness equally. Each principle has logical weight *and* inherent flaws.
  *   **Legality & Precedent:** Most POAs/HOAs are legally structured around **property ownership.** Changing this significantly (like giving tenants votes) can be legally complex, might conflict with state laws governing common interest communities, and could face fierce resistance (and lawsuits) from owners who feel their property rights are diminished.
  *   **Practicality Matters:** Systems need to be administrable. Defining and verifying "residency" or "impact" is harder than verifying ownership. Complex voting structures lead to confusion and disputes.
  *   **The "Enough Votes" Problem:** You're right that ultimately, changing the bylaws requires votes under the *current* system. This gives an advantage to the status quo or whichever group can build a coalition under existing rules.

  **Navigating Towards a Fairer Solution (Compromise is Key):**

  Since a perfect, purely principled answer doesn't exist, the goal becomes finding the *least worst* or *most functional compromise* for *your specific community*. Here are ways forward:

  1.  **Acknowledge the Tensions:** Start the discussion by openly acknowledging the valid points of each perspective. This builds trust.
  2.  **Focus on Specific Pain Points:** Instead of a wholesale voting change, address specific issues causing friction:
      *   **Non-Member Road Use:** This is the clearest injustice. Negotiate a formal access agreement where those 6 houses contribute financially (fair share for road maintenance/plowing) in exchange for guaranteed access. This solves a funding/equity issue without touching voting rights.
      *   **Tenant Concerns:** While giving tenants formal votes is legally tricky, create formal channels for resident input. A "Residents' Advisory Committee" (including long-term tenants and full-time owners) that meets with the Board can provide crucial perspective before votes. Ensure meeting minutes/agendas are shared with *all* residents (owners and tenants).
      *   **Absentee Owner Engagement:** Explore better communication (dedicated website/email list, virtual meeting options) to involve seasonal owners more. They might be happy to delegate their proxy to a trusted full-time resident neighbor if they feel informed.
      *   **Airbnb Impact:** Create specific rules addressing problems caused by short-term rentals (parking, noise, trash) rather than targeting voting rights. Enforce existing covenants.
  3.  **Consider a Hybrid/Weighted System (Proceed Cautiously):** This is complex but possible:
      *   **Owner-Resident Votes:** An owner who uses the property as their primary residence gets a full vote.
      *   **Absentee Owner Votes:** An owner who doesn't reside there primarily gets a vote, but perhaps slightly less weight (e.g., 0.75 votes) to acknowledge reduced impact. *This is legally sensitive.*
      *   **Tenant Representation:** Still problematic legally for voting, but reinforces the need for strong advisory roles.
      *   **Proxy/Delegation:** Encourage absentee owners to formally delegate their vote to a full-time resident proxy for a season/year.
  4.  **Transparency & Communication:** Often, frustration stems from feeling unheard or uninformed. Radically improve communication. Publish detailed budgets, explain decision rationales, hold open forums (not just the annual meeting).
  5.  **Bylaw Amendment Process:** If change is desired, understand your *current* bylaws for amendment. It usually requires a significant majority (e.g., 2/3 of members). Build a coalition by addressing the specific concerns of different groups (e.g., full-timers get more input channels, seasonal owners keep a vote but agree to fund road use by non-members, everyone benefits from better rules on short-term rentals).

  **Conclusion:**

  The fantasy of a perfectly objective, non-arbitrary voting rule is just that – a fantasy. Governance always involves balancing competing legitimate interests. The ownership model is standard for practical and legal reasons, but it clearly creates tensions in a mixed community like yours.

  The most productive path isn't searching for a mythical perfect principle, but rather:

  1.  **Fix the glaring inequity:** Get those 6 non-member houses contributing financially for road use.
  2.  **Enhance inclusion without disenfranchisement:** Create powerful *advisory* roles for full-time residents (owners *and* tenants) to ensure their day-to-day experience informs decisions.
  3.  **Improve engagement:** Make communication and participation easier for *all* owners, especially seasonal ones.
  4.  **Address specific problems:** Tackle issues like Airbnb impacts or snowplow timing with targeted rules, not wholesale voting changes.
  5.  **Build consensus:** Focus on shared goals (maintaining property values, a peaceful community, functional infrastructure) and seek compromises that address the core *concerns* behind each voting principle argument, rather than fighting over the principle itself.

  It's messy, it requires compromise, and self-interest will always play a role. But by focusing on practical solutions to specific problems and improving communication, you can move towards a system that feels *fairer* and *more functional* for your unique community, even if it's not perfectly "non-arbitrary."
