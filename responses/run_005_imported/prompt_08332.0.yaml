prompt: |-
  I'm on my hospital's radiology practice committee and we're deadlocked. Right now every scan reaches the radiologist with the referring doctors note attached ('r/o PE', 'query fracture'), and a resident's informal audit found incidental findings get missed more often when the note points hard at one diagnosis. Some attendings want blinded first reads rolled out; others say the note is just doing the normal job of telling the radiologist where to look, and blinding it would tank sensitivity for whatever the scan was actually ordered for. The real disagreement underneath isn't 'bias exists, yes or no' -- it's whether the note changes what radiologists visually notice on the image, not just what they conclude from it, because if it's the former, no checklist or second-check is going to fix that. Draft the memo I'll bring to the committee -- keep, blind, or some staged/hybrid protocol, with a pilot timeframe -- that actually takes a position on that distinction instead of punting on it.
reasoning: |-
  Okay, the user is on a hospital radiology practice committee and they're deadlocked on whether to blind radiologists to referring doctors' notes during first reads. The core issue isn't whether bias exists—everyone agrees it does—but whether the note actually changes what radiologists visually perceive in the images versus just influencing their interpretation. 

  The user needs a memo draft that takes a firm position on this perceptual versus interpretive distinction, proposing either keeping the notes, blinding them, or a hybrid approach with a pilot timeframe. They're clearly frustrated with committees that "punt" on hard questions, so this memo needs to be decisive and evidence-based.

  Hmm, the resident's audit finding about missed incidental diagnoses when notes point hard at one thing is crucial. That suggests the bias might be perceptual—if it were just interpretive, second reads or checklists could catch it. But missed findings imply the eyes didn't even register certain things. That leans toward blinding being necessary.

  But the other side has a point too: notes *do* help focus attention. If a scan was ordered for suspected PE, blinding might make radiologists less likely to catch subtle PEs. So a hybrid approach seems wise—maybe blinding for certain high-stakes incidental findings (like lung nodules on PE studies) while keeping notes for others. 

  The memo should frame this as a patient safety issue, not just academic. Missed incidentalomas can be deadly. And it should force the committee to confront the perception vs. interpretation question head-on, since that's the real sticking point. A pilot study comparing blinded vs. unblinded reads for specific scan types (CT PEs, trauma scans) could settle it—track misses for both targeted and incidental findings. Six months seems reasonable.

  Key tone points: Urgent but not alarmist. Respectful of both sides. Grounded in real-world workflow (no unrealistic protocols). And it must offer a clear path forward—no more deadlock.
answer: |-
  ## MEMORANDUM  
  **TO:** Radiology Practice Committee  
  **FROM:** [Your Name], Radiology Practice Committee  
  **DATE:** October 26, 2023  
  **SUBJECT:** Resolving Deadlock on Referring Note Visibility: Proposed Path Forward Based on Perceptual vs. Interpretive Bias Distinction  

  ### Background
  Our committee is deadlocked on whether referring clinicians' notes (e.g., "r/o PE," "query fracture") should accompany initial radiology reads. The resident audit suggests **incidental findings are missed more frequently when notes strongly suggest a specific diagnosis**. While all agree cognitive bias *exists*, the critical unresolved question is: **Does the note primarily alter *what the radiologist sees* (perceptual bias) or only *how they interpret what they see* (interpretive bias)?**  

  This distinction is fundamental:  
  - **If perceptual bias dominates**, checklists or second reads cannot fully compensate, as findings may never enter conscious awareness.  
  - **If interpretive bias dominates**, structured reporting and double-reads may mitigate risks without blinding.  

  ### Our Position: Evidence Favors a Perceptual Impact
  Current literature (e.g., studies by Busby *et al.*, Loy *et al.*) and our audit suggest referring notes **fundamentally shape visual search patterns**. Radiologists prioritize regions/features aligned with the clinical question, potentially overlooking anomalies outside that scope. This is not merely interpretive—it’s a limitation of human attention. **Thus, incidental misses are likely rooted in *unseen*, not just misinterpreted, findings.**  

  ### Recommendation: Pilot a Staged Hybrid Protocol
  Blinding all notes risks reducing sensitivity for the primary indication. Conversely, retaining all notes perpetuates incidental misses. We propose a **pilot program targeting high-risk scenarios** where incidental findings carry significant morbidity (e.g., renal/lung nodules on CTAs, thyroid nodules on cervical spines):  

  1. **PHASE 1 (Blinded First Read):**  
     - **Scans:** CT Pulmonary Angiograms (CTPA) and Trauma Pan-Scans (high incidental risk).  
     - **Protocol:** Radiologist performs *initial interpretation blinded to clinical note*.  
     - **Output:** Draft report with findings.  

  2. **PHASE 2 (Unblinded Integration):**  
     - **Note revealed:** Radiologist reconciles draft with clinical context.  
     - **Focus:** Ensures primary indication is addressed; re-evaluates flagged areas for perceptual misses.  
     - **Output:** Finalized report.  

  3. **PILOT DURATION:** 6 months (allowing adequate case volume and seasonal variation).  

  ### Why This Addresses the Core Issue
  - **Targets perceptual bias:** Forces an unbiased search pattern during initial image analysis.  
  - **Preserves clinical context:** Ensures the primary indication receives appropriate focus *after* the perceptual sweep.  
  - **Measurable outcomes:** Track:  
    - Incidental finding miss rates (vs. pre-pilot audit).  
    - Sensitivity/specificity for *primary* diagnoses (e.g., PE on CTPA).  
    - Turnaround time impact.  
    - Radiologist feedback (usability/stress).  

  ### Expected Concerns & Mitigations
  - **"Blinding harms primary diagnosis sensitivity":**  
    - Mitigation: Unblinded Phase 2 ensures explicit correlation with clinical question.  
  - **Workflow disruption:**  
    - Mitigation: Phase 1/2 integrated into existing PACS/RIS; techs flag eligible studies automatically.  
  - **Resistance to change:**  
    - Mitigation: Voluntary participation initially; share pilot data transparently.  

  ### Next Steps
  1. **Vote** to approve the 6-month pilot for CTPA/Trauma Pan-Scans.  
  2. **Form working group** (incl. IT, QA, participating attendings) to design protocols/metrics.  
  3. **Present finalized pilot plan** at next committee meeting (4 weeks).  

  **We cannot afford to punt on the perceptual-interpretive divide.** If notes constrain visual attention, our current system fails patients with silent, consequential disease. This pilot directly tests that mechanism while safeguarding primary diagnoses. Let’s generate evidence-based solutions—not remain deadlocked by assumptions.  

  **Submitted for decision,**  
  [Your Name]  

  ---

  ### Key Strengths of This Approach
  1. **Directly confronts the committee’s core disagreement** (perception vs. interpretation) through testable design.  
  2. **Balances safety** (unbiased search) with efficacy (contextual integration).  
  3. **Pragmatic scope:** Focuses on high-yield/high-risk studies first.  
  4. **Data-driven exit:** Pilot results will force consensus—either justify full rollout, refinement, or discontinuation.  
  5. **Minimal permanent disruption:** Pilot structure allows course-correction.
