  First, I need to recall the key differences between Bratman and Gilbert. Bratman's approach is individualistic, focusing on interconnected personal intentions. He believes shared actions emerge from individuals meshing their subplans and being responsive to each other. Gilbert, on the other hand, argues for a joint commitment that creates a mutual obligation, something more than the sum of individual intentions.

