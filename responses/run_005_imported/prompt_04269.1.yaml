  First, I need to recall the core differences. St. Petersburg has an infinite expected value due to exponentially growing positive payoffs. The paradox is that no rational person would pay an arbitrarily large amount to play, suggesting practical rejection of infinite expectations. 

  The Pasadena game is different - its payoffs alternate in sign and grow in magnitude, making the expectation a conditionally convergent series. The Riemann rearrangement theorem applies here, meaning the sum's value depends entirely on the order of terms. This isn't just infinity - it's truly undefined in a stronger mathematical sense.

  Hmm... the user's confusion seems to stem from seeing both as "expected value fails." But I should emphasize how differently they fail. St. Petersburg's infinity is well-defined mathematically but behaviorally problematic. Pasadena's expectation isn't just infinite - it's fundamentally indeterminate. You can make it equal π or -1000 by rearranging terms!

  The user's housemate is right that decision theorists see this as worse. With St. Petersburg, you might apply utility damping or probability weighting as solutions. But with Pasadena, even defining "expected value" is impossible without specifying summation order - which lacks economic justification. 

  I should also note how this affects stochastic dominance. In St. Petersburg, the game clearly dominates any finite payoff game. But in Pasadena? Depending on summation order, it could appear better or worse than literally any alternative. That's next-level pathological.

  The user's analysis background might make them overlook the decision theory implications. I should stress that "undefined" creates deeper issues than "infinite" - it breaks the very comparability of options. Also, the fact that Pasadena payoffs are bounded in any single trial but unbounded overall is an important nuance.

  ...Wait, did the user mention the alternating harmonic series specifically? That's crucial - the 1/n decay is slow enough for rearrangement freedom but fast enough for conditional convergence. Perfect storm for decision-theoretic chaos.
answer: |-
  You've hit on a profound distinction! While both paradoxes involve unbounded payoffs breaking naive expected utility (EU), the Pasadena paradox is **mathematically and decision-theoretically worse** than St. Petersburg. Your housemate is right: it's not just "infinity vs. undefined," but a fundamental breakdown in the *meaning* of expectation itself. Here's why:

  1.  **The Nature of the "Break":**
      *   **St. Petersburg:** The expectation is **unambiguously infinite** (∑ p_i * u_i = ∞). The problem is *behavioral*: EU maximization suggests you should pay any finite price to play, which seems absurd. The mathematical object (∞) is well-defined, but its application is problematic.
      *   **Pasadena:** The expectation is **not defined** in the standard sense. The series ∑ p_i * u_i is *conditionally convergent* (converges to a finite limit only if summed in a specific order). The Riemann rearrangement theorem proves its sum is *pathologically order-dependent*. There is **no single, canonical expected value**. The mathematical object itself is indeterminate.

  2.  **Why "Undefined" is Worse Than "Infinite":**
      *   **No Stable Recommendation:** St. Petersburg's EU=∞ gives a clear (though problematic) prescription: "Pay any finite cost." Pasadena gives *no stable prescription*. Depending on the arbitrary summation order (which lacks any decision-theoretic justification), the "expected value" could be:
          *   Any real number (e.g., $10, -$1000, π).
          *   +∞.
          *   -∞.
          *   Oscillate forever.
      *   **Violates Stochastic Dominance:** This is the critical decision-theoretic flaw. Stochastic dominance (specifically, first-order stochastic dominance - FOSD) is a bedrock principle: if gamble A always pays at least as much as gamble B in every possible state, and strictly more in some, then A should be preferred to B.
          *   St. Petersburg *obeys* FOSD. Any finite gamble is dominated by St. Petersburg.
          *   Pasadena *violates* FOSD **in practice, depending on the summation order.** Consider a gamble P' that is identical to Pasadena except it pays an extra $1 in *every single state*. Intuitively, P' should strictly dominate Pasadena (P'). However:
              *   You can find a summation order where Pasadena sums to S.
              *   You can find a summation order where P' sums to S (since adding a constant series doesn't change conditional convergence properties).
              *   Crucially, you can also find orders where Pasadena sums to a value *higher* than P' sums to under *another* order! The rearrangement freedom means there's no guarantee that the sum for P' is always greater than the sum for P under all orderings. The pathological dependence breaks the fundamental link between state-wise payoff dominance and the "expected value" number you calculate. **FOSD holds state-wise, but the standard EU calculation fails to reflect it.** This is catastrophic for decision theory.

  3.  **The Source of the Problem:**
      *   **St. Petersburg:** The issue is the *magnitude* and *growth rate* of the positive payoffs combined with their vanishing probabilities. The series diverges monotonically to +∞.
      *   **Pasadena:** The issue is the *cancellation* between large positive and large negative payoffs combined with the *slow convergence* (like 1/n). The positive and negative parts *both* diverge separately (∑ p_i * |u_i| = ∞), but when summed together with alternating signs, their difference *can* converge conditionally. This "balance on a knife's edge" is shattered by rearrangement.

  4.  **Why Decision Theorists Care More About Pasadena:**
      *   St. Petersburg challenges *how we handle infinity* in EU. Solutions involve:
          *   Bounded utility functions (marginal utility decreases sufficiently fast).
          *   Probability weighting (discounting tiny probabilities).
          *   Finite resources/practical impossibility.
      *   Pasadena challenges the *very definition and computability* of expectation for a broad class of plausible gambles. It shows that the standard *formula* ∑ p_i * u_i can be **meaningless** even when all components (p_i, u_i) are perfectly well-defined and finite for each state. The "solution" isn't just bounding utility or probability; it requires a fundamentally different way to *define* expectation for conditionally convergent series – and no universally agreed-upon, decision-theoretically sound method exists. Proposals (like the "principal value" summing in state order) feel arbitrary and lack normative force.

  **Analogy:**

  *   **St. Petersburg:** Like being told a priceless gem is infinitely valuable. It's hard to price practically, but its supreme value is clear.
  *   **Pasadena:** Like being handed a locked box said to contain a gem. However, the key is missing, and depending on which lock-picking method (order of summation) you use *first*, the box might contain a priceless gem, a poisonous snake, a pile of dust, or nothing at all – and you have no way of knowing which method is "correct." The value isn't infinite; it's fundamentally ambiguous and manipulable.

  **Conclusion:**

  You're right that both paradoxes show EU theory "has nothing to say" in its naive form. But the *way* it fails is crucially different:

  1.  **St. Petersburg:** EU gives a clear, extreme answer (∞) that conflicts with intuition and revealed preferences. The failure is **behavioral/practical**.
  2.  **Pasadena:** EU fails to give *any* coherent answer. The mathematical object it relies on (the sum) is undefined and manipulable, leading to violations of core decision principles like stochastic dominance. The failure is **foundational/conceptual**. The "engine" of the Riemann rearrangement theorem creates a problem that's qualitatively more severe for the machinery of decision theory than simple divergence to infinity. Your housemate is correct – Pasadena is widely seen as a deeper and more troubling paradox. It's not just a flashy St. Petersburg; it breaks EU in a more fundamental way.
