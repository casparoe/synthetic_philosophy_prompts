  ### Justifications  
  1. **Marek's opening (Score: 2)**  
     Correct under standard acausal assumptions. If the threatener can perfectly simulate the agent and sees identical behavioral responses to threats against the surrogate vs. real goal, targeting the surrogate *is* strictly dominant: it yields identical concessions at zero cost. The "free lunch" analogy holds if legibility is granted.  

  2. **Iris's objection (Score: -1)**  
     Mistakenly imports real-world uncertainty into a context where perfect legibility is axiomatic. Acausal threat models (e.g., superintelligences simulating agents) assume the threatener *can* verify dispositions directly. Her bluffing concern applies to causal bargaining but not this idealized framework.  

  3. **Marek's reply (Score: 2)**  
     Soundly defends the core premise: perfect legibility *is* foundational in acausal threat literature (e.g., in updateless decision theory or logical inductors). If a superintelligence can simulate the agent’s policy, distinguishing "genuine" indifference from bluffs is trivially knowable. Iris’s objection collapses here.  

  4. **Iris's meta-policy escalation (Score: 1)**  
     Partially valid but incomplete. She correctly notes that agents adopting surrogates as a *general policy* could incentivize threateners to pre-commit to ignoring surrogates. However, this merely shifts the game to a higher-order commitment race without resolving it. Marek’s stance assumes the agent moves first (e.g., by fixing their policy preemptively), but Iris exposes that this isn’t guaranteed. Her point is insightful but doesn’t refute the surrogate’s *local* effectiveness against non-strategic threateners.  

  ### Armchair Resolvability?  
  This dispute **is not fully resolvable from the armchair**. While the logical structure of moves 1–3 hinges on defined axioms (e.g., perfect legibility), move 4 reveals a dependency on empirical unknowns: the *strategic nature of real threateners*. Are they myopic leverage-seekers (favoring Marek) or adaptive meta-game players (favoring Iris)? Philosophy can clarify incentives, but the viability of surrogates ultimately depends on contested empirical guesses—e.g., whether threatener policies evolve to punish surrogate use, or whether agents can credibly "commit first" in cross-temporal games. Neither side can settle this without assumptions about threatener psychology or evolutionary dynamics in acausal environments.
