  The sadistic conclusion arises if adding people with negative experiences is seen as bad, but in their case, new members likely have positive experiences, just less than current. So maybe not directly applicable, but forcing growth might lead to dissatisfaction, analogous to adding lives not worth living.

  Impossibility theorems imply no perfect solution. Trade-offs are inevitable. They need to prioritize: Is total value or average quality more important? Or can they find a balance?

  Practical suggestions: Gradual growth with mechanisms to maintain quality, like splitting into subgroups or setting entry criteria. Critical-level in practice could mean only adding members who meet a minimum engagement threshold. Person-affecting approach involves consulting current members about growth impacts.

  They need to accept trade-offs. Maybe aim for a sweet spot where total and average utility are optimized, acknowledging that beyond a certain size, adding more isn't beneficial. Regular reassessment and adaptive strategies could help.

