  Here’s a detailed scenario that meets your criteria, followed by analysis of the standing-defeating feature and its implications:

  ### Scenario: The Estranged Sibling's Reproach  
  **Context**:  
  Ava and Ben are adult siblings who have been estranged for 15 years due to a bitter dispute over their parents’ estate. Ava cut off all contact after Ben (then struggling financially) accepted a larger inheritance share their parents secretly offered him. Ben’s wife, Clara, has stage 4 cancer. Ben, overwhelmed by caregiving and financial stress, misses Clara’s chemotherapy appointment to work overtime. Clara’s close friend, David, confronts Ben: "You abandoned her when she needed you most. That’s monstrous."  

  **Enter the Critic**:  
  Ava learns of Ben’s absence through mutual acquaintances. Despite having zero contact with Ben or Clara for 15 years, Ava sends Ben a scathing letter:  
  *"I heard you skipped Clara’s treatment. You’ve always been selfish. You don’t deserve her. You’re a failure as a husband."*  

  **Key Facts**:  
  1. **Ava’s Conduct (satisfies (a))**:  
     - Ava has never abandoned a sick partner (she is single and cared for her own terminally ill ex-partner years ago).  
     - She would never do what Ben did; her past actions prove strong caregiving integrity.  
  2. **Non-Complicity/Benefit (satisfies (b))**:  
     - Ava played no role in Ben’s decision.  
     - She gains no benefit from Clara’s suffering (financially independent; no contact).  
  3. **Robust Intuition of Lost Standing**:  
     - David’s identical blame *does* feel legitimate.  
     - Ava’s blame feels intrusive, disproportionate, and "not her place"—even if factually true.  

  ### The Standing-Defeating Feature: **Relational Discontinuity and Unresolved Harm**  
  What strips Ava’s standing is **her prior, unaddressed abandonment of Ben as a sister**, which:  
  - **Suspends her moral membership** in the relationship where blame occurs.  
  - **Exploits the victim’s vulnerability** to rehearse old grievances.  
  - **Creates a contextual mismatch** between her own past wrong and the present wrong.  

  **Breakdown**:  
  - **Relational Discontinuity**: Ava severed ties with Ben permanently. By renouncing the sibling relationship, she forfeited the *relational authority* to evaluate Ben’s conduct as a husband. Blame requires a "moral community" (McKenna 2012); Ava exited this community.  
  - **Unresolved Harm**: Ava’s letter weaponizes Clara’s suffering to punish Ben for the inheritance dispute—a harm *she* inflicted on *him* by cutting contact. This instrumentalizes blame, divorcing it from Clara’s well-being.  
  - **Contextual Mismatch**: Ava condemns Ben as a "husband," but her own unresolved wrong is as a "sister." Her failure to acknowledge this disconnect makes her blame a form of moral trespass.  

  ### What This Shows: Standing Cannot Be Reduced to Hypocrisy  
  1. **Heterogeneity of Standing Conditions**:  
     - Hypocrisy (Cohen/Wallace) focuses on *conduct-consistency*. Complicity focuses on *causal entanglement*.  
     - This case reveals **relational authority** as a distinct dimension: standing depends on the critic’s *position in the network of relationships* affected by the wrong. Ava lacks standing not because she’s inconsistent, but because she’s an *irrelevant moral agent* in this context.  

  2. **The Limits of Hypocrisy-Centered Accounts**:  
     - Ava’s blame fails because she has **no constructive role** in the moral repair process. David (Clara’s friend) has standing because his relationship to Clara grants him *stakes* in her well-being. Ava’s blame serves no purpose beyond moral grandstanding.  
     - Hypocrisy theories miss how **historical relational failures** can void standing *independently* of present conduct. Ava’s past harm to Ben undermines her credibility *as his critic*, even if her own caregiving is impeccable.  

  3. **Implication: Standing as Contextual Moral License**  
  Standing isn’t merely "consistency + non-complicity." It requires:  
     - **Relational grounding**: A legitimate connection to the victim/wrongdoer.  
     - **Moral competence**: Demonstrated commitment to the values invoked (Ava has this, yet still fails).  
     - **Non-exploitation**: Blame must not repurpose others’ suffering for unrelated ends.  

  **Conclusion**: Ava’s case proves that "lacking standing" is a heterogeneous concept. While hypocrisy/complicity address *conduct-based* failures, **relational discontinuity** exposes a distinct *contextual* failure: blaming without relational warrant. This suggests standing is not unitary but a bundle of conditions—some rooted in the critic’s actions, others in their social-relational locus. Hypocrisy-centered views capture only one strand of a more complex moral ecology.
