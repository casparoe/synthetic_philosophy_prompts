answer: |-
  Frederick Douglass's constitutional hermeneutics present a fascinating tension between textual fidelity and moral teleology that resists easy categorization within modern frameworks. Based on his 1860 arguments and later Reconstruction-era writings, here's how he would likely align:

  1.  **Against Modern Binaries:** Douglass would likely reject the *either/or* framing of textualism vs. living constitutionalism. His method fused elements both camps claim:
      *   **Textualist Core:** His insistence on the written text as supreme law, rejection of unstated "secret intentions," and use of "ordinary rules of legal interpretation" align strongly with original-public-meaning textualism. He believed meaning was fixed at ratification, not evolving with societal values *unless* amended.
      *   **Purposive Superstructure:** However, his foundational premise was that the text *must* be read through the lens of the Declaration of Independence's natural rights principles ("justice," "liberty," "general welfare"). This is deeply purposive. The text wasn't neutral; it was saturated with the *telos* of liberty declared in 1776.

  2.  **Closer to "Moral Readings" or "Declaration-based Originalism":** Douglass sits closest to scholars like Ronald Dworkin (moral readings) or modern "Declaration-infused originalists" (e.g., Randy Barnett). For him:
      *   The Constitution's text is paramount and fixed.
      *   Its *only legitimate meaning* is the one consistent with the natural rights principles articulated in the Preamble and presupposed by the Revolution.
      *   Ambiguities *must* be resolved in favor of liberty. Provisions seemingly supporting slavery (e.g., 3/5 Clause, Fugitive Slave Clause) were either temporary concessions to necessity (to be narrowly construed) or outright violations of the document's core purpose, doomed by their inherent contradiction.

  3.  **On Shelby County v. Holder (2013):** Douglass would likely condemn the decision as **precisely the type of extratextual, ahistorical, and anti-purposive reasoning he denounced in 1860, now weaponized against Reconstruction.**
      *   **Textual Absence:** His core critique would be the absence of "equal sovereignty of the states" in the Constitution's text, especially the Reconstruction Amendments. The Fifteenth Amendment empowers Congress to enforce voting rights "by appropriate legislation." Nothing in its text or history suggests an unstated "equal sovereignty" principle limiting that power.
      *   **Rejection of "Secret History":** The *Shelby* majority relied heavily on inferences about the "fundamental principle of equal sovereignty" supposedly underlying the *structure* of the Union and the original admission of states. Douglass explicitly rejected arguments based on unstated structural principles or historical context *contrary* to the text's plain meaning and purpose. He would see this as reviving the pro-slavery tactic of appealing to "secret intentions" and historical context (like the Founders' slaveholding) *against* the text's liberty-affirming potential.
      *   **Undermining the Amendment's Purpose:** The Reconstruction Amendments were, for Douglass, the ultimate vindication of his reading – embedding the Declaration's principles *explicitly* into the Constitution to eradicate the "slaveholding oligarchy" and secure Black citizenship. *Shelby*'s limitation of Congress's enforcement power, based on an unstated principle, directly undermines the *purpose* of the Fifteenth Amendment: to actively secure the right to vote against racial discrimination. He would view it as a judicial resurrection of state sovereignty doctrines used to protect slavery and later Jim Crow, now deployed to weaken federal protection of Black voting rights.
      *   **Contradiction of His Method:** *Shelby* uses an extratextual "principle" to restrict a clear textual grant of power designed to achieve a core constitutional purpose (racial equality in voting). This is the *inverse* of Douglass's method: he used the text's *broad, purposive language* (Preamble) and the Declaration's principles to *expand* liberty, not to invent limitations *restricting* it. He denounced using extratextual ideas to *limit* freedom; *Shelby* uses one to *limit* the enforcement of freedom.

  **Conclusion:**

  *   **Interpretive Alignment:** Douglass transcends the modern binary. He is an **original-public-meaning textualist *only* in the sense that the text's meaning is fixed by its ratification-era public meaning *as interpreted through the lens of the Declaration of Independence's natural rights philosophy*.** He is not a living constitutionalist, as he rejected meaning evolving with contemporary values. He is a purposive originalist, but where the core purpose (liberty/equality) is paramount and trumps inconsistent historical practices or framers' secret intentions.
  *   **On Shelby County:** He would unequivocally condemn it as judicial activism mirroring the pro-slavery sophistry he spent his life fighting. Inventing an "equal sovereignty" principle not found in the text to gut the Fifteenth Amendment's enforcement power would represent, in his view, a profound betrayal of the Constitution's highest purpose and the blood-soaked legacy of Reconstruction. It would be the *exact* kind of reasoning – prioritizing unstated structural assumptions over text and core purpose – that he exposed and denounced in his 1860 address, now tragically turned against the very amendments meant to fulfill the Constitution's promise. He would see it as a victory for the spirit of the "covenant with death" over the "glorious liberty document."
