  Then, the expected utility becomes the sum of (1/2)^n * U(payout_n) = (1/2)^n * n. Summing (n / 2^n) from n=1 to infinity. That series converges to 2. Wait, that's finite. That doesn't work. Hmm, where did I go wrong? 

  Ah, I see. If I set the utility for each outcome to be constant, say k utils, then the payout must be U^{-1}(k). But k is constant, so the payout doesn't grow with n. The probability is (1/2)^n, so the expected utility is k times sum of (1/2)^n, which is finite. That doesn't create divergence. 

  To make the expected utility diverge, I need the utility per outcome to increase as the probability decreases. Specifically, for outcome n, set the utility to be proportional to 2^n. Since U is unbounded, there's some payout x_n such that U(x_n) = 2^n. Then the expected utility is sum over n of (probability_n * utility_n) = (1/2)^n * 2^n = 1. Summing 1 from n=1 to infinity gives infinity. Each term is 1, and there are infinite terms, so yes, the expected utility is infinite. 

  So, the key is to make the utility for each outcome increase exponentially to counteract the decreasing probability. Since U is unbounded, such payouts exist. This construction works for any unbounded U. 

  Now, what does this mean for the paradox? The user's friend is correct: if utility is unbounded, you can always design a St. Petersburg-like game with infinite expected utility. This implies that diminishing marginal utility alone isn't sufficient to resolve the paradox in all cases. 

