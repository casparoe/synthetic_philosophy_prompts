  Been down a game theory rabbit hole on the centipede game. I've got the basic backward induction argument fine (full defection at move one is the unique subgame-perfect equilibrium, even though both players do worse than if they'd cooperated a while longer), but there's a deeper puzzle -- the one Pettit & Sugden originally raised, and that Binmore later pressed against Aumann's common-knowledge-of-rationality proof -- that I can't shake: if CKR really is common knowledge, the game should never leave round 1, so what's a rational player even licensed to believe or do if it actually reaches round 4? doesnt reaching that node already falsify the premise that generated the "rational" prediction in the first place? Aumann's camp says there's a formally consistent answer (something about rationality being a disposition, not a fact about the realized path), Binmore thinks that's basically a dodge and the whole argument is incoherent off-path -- can you unpack the actual crux of that disagreement for me, and not just hand-wave "well beliefs can update"?
