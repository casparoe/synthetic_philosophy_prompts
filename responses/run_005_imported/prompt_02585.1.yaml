  The key is that imprecise probabilities represent sets of priors. Each prior updates independently. Dilation happens when the evidence is correlated with the proposition in different ways across priors. In the coin example, the first coin toss being fair or biased affects the second toss. If the first toss is heads, a fair coin prior thinks the second toss is 50-50, but a biased prior might think it's more likely to be heads again. So after seeing heads, the credal set spans from 0.5 to 0.75. The same happens if tails occurs. So no matter what, the range gets wider.

  The user might be struggling with why this feels counterintuitive. Normally, evidence should reduce uncertainty. But here, learning something increases the range of possible probabilities. The intuition is that the evidence doesn't resolve the ambiguity in the priors; it highlights the disagreement among them. Each piece of evidence makes some priors more confident and others less, pulling the range apart.

  Now, the second part: is this a problem for the theory? Some argue it's a feature, showing that ambiguity persists. Others think it's irrational because learning should never make you less certain. The user might be concerned about whether this undermines imprecise probabilities as a viable model. I should mention both sides but suggest it's more of a debated issue than a fatal flaw. Levi defended it, while others like Joyce criticized it.

