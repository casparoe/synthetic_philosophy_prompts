  ### Can a Serious Theory Defend Your Choices?
  Yes! **Prospect Theory** (developed by Kahneman and Tversky) explains your choices as rational within a descriptive model of human behavior. Unlike EUT, Prospect Theory accounts for psychological factors:
  - **Reference dependence**: People evaluate outcomes relative to a reference point (e.g., current wealth).
  - **Loss aversion**: Losses hurt more than equivalent gains.
  - **Probability weighting**: People overweight small probabilities and underweight moderate/large ones.

  Here’s how Prospect Theory justifies your choices:
  1. **First choice (certainty effect)**:
     - The guaranteed $50,000 is a sure gain. You overweight certainty due to loss aversion: the 1% chance of nothing feels like a loss, and a small risk looms larger than its probability.
     - The gamble’s 89% chance of $50,000 is underweighted (it’s not "certain enough"), making the safe option more attractive.

  2. **Second choice (probability weighting in the domain of losses)**:
     - Both options are risky (no safe choice), so you focus on potential gains. The 10% chance of $250,000 is overweighted because small probabilities are exaggerated. The payoff is 5× larger than $50,000, so the slightly lower probability (10% vs. 11%) feels negligible.
     - The 89–90% chance of nothing is underweighted—it’s already high, so you discount it and chase the big win.

  Prospect Theory captures your intuition: you were **cautious when certainty was available** but **bold when only risks existed**. This pattern is common (e.g., the Allais Paradox) and is not "irrational" descriptively—it reflects how humans actually decide.

