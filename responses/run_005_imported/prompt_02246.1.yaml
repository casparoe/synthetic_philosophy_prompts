answer: |-
  You've nailed the core tension in Anscombe's argument. Let's break down both your questions about her "act vs. role" distinction and its significance for her overall case against Hiroshima/Nagasaki.

  ### 1. The "Act vs. Role" Distinction: Philosophical Work or Definitional Stretching?

  Anscombe is attempting to resolve a genuine problem within her absolutist framework (no intentional killing of the innocent) applied to war. Her move is **both philosophically substantive *and* potentially vulnerable to the charge of stretching.**

  *   **The Philosophical Substance (Conduct vs. Status - Sort Of):**
      *   **Problem:** A purely *momentary-act-based* definition ("harming *right now*") leads to absurdities like the sleeping soldier objection. It also doesn't reflect the reality of organized warfare, where threat is continuous and organizational.
      *   **Solution:** Anscombe introduces a **functional and situational role concept**. A soldier "under arms" within an active military force engaged in hostilities occupies a *role* defined by the function of harming the enemy to achieve military objectives. This role persists even during periods of rest, resupply, or transit *within the operational context*. They are *integrated into the harming mechanism*.
      *   **Analogy:** Think of a guard on duty. Even if momentarily looking the other way or eating lunch, they are still *functionally* the guard, responsible for the perimeter. Their *status* as guard defines their role and potential threat. Anscombe applies a similar logic to the soldier-in-combat-role.
      *   **Work Done:** This distinction allows her to:
          1.  **Avoid the absurdity:** Soldiers can be targeted outside of the literal split-second of pulling a trigger.
          2.  **Maintain the core principle:** The targeting is justified *only* because of their functional role in the harming mechanism ("harming" in the broad, role-based sense), *not* because they are morally guilty or deserving of death.
          3.  **Preserve the surrender rule:** The moment they surrender, they *actively renounce* that role and functional connection to harming, instantly regaining "innocent" status. Their *status* changes.
          4.  **Ground the "hors de combat" principle:** Even while targetable due to their role, the *degree* of force must be proportionate to the functional goal of neutralizing the threat ("putting them hors de combat"). Brutality beyond necessity against a sleeping camp is still ruled out.

  *   **The Charge of "Definitional Stretching" (or Convenient Adjustment):**
      *   **The Stretch:** The leap from "actively harming" to "occupying a role that *involves* harming" is significant. It moves from a clear, observable *act* to a more abstract *concept* of functional integration. Critics argue this blurs the line she initially tried to draw so sharply.
      *   **Convenience for "Normal" Tactics:** It absolutely functions this way. Without this move, her absolutist principle would condemn vast swathes of standard military practice (bombing barracks, attacking supply convoys, ambushing patrols not *currently* firing). The "role" concept provides the necessary flexibility to accommodate these tactics within her framework. Her insistence on minimal necessary force is the guardrail against abuse *within* the targeting of role-bearers.
      *   **Potential Vagueness:** Where exactly does the "role" begin and end? Is a conscript in basic training 1000 miles from the front "under arms"? What about a cook in a rear-area HQ? Anscombe likely intends a narrow reading focused on those integrated into *active* combat operations, but the line isn't always bright. This vagueness *can* be seen as a weakness exploited to include necessary targets.

  **Verdict:** It's **primarily genuine philosophical work** aimed at resolving a critical internal contradiction within her absolutist framework applied to the reality of war. She's developing a *functionalist* account of legitimate targets grounded in their *current, active participation* in the collective harming mechanism of the enemy force. However, it **inevitably involves a degree of conceptual stretching** to avoid impractical absurdities and accommodate conventional warfare. It's a carefully constructed (and necessary) *refinement* of the absolutist position, not an abandonment of it.

  ### 2. Does the "Innocent" Reddefinition Do Real Work for Hiroshima/Nagasaki?

  **Absolutely, critically, yes.** This technical definition is the **linchpin** of her entire condemnation. It's not a detour; it's the foundation.

  *   **The Core Argument:** Anscombe's primary charge is that the atomic bombings intentionally killed vast numbers of people who were "innocent" in her strict, functional sense. They were *not*:
      *   Engaged in harming (momentary act).
      *   Occupying a role defined by the function of harming (soldier under arms).
      *   They were civilians: children, elderly, shopkeepers, priests, teachers, artists, non-combatant government workers, etc.
  *   **Why Her Definition is Crucial Here:**
      1.  **Countering "They Were All Combatants" Rhetoric:** Post-war justifications often blurred lines, implying all Japanese were militarized. Anscombe's definition sharply distinguishes. A factory worker producing weapons *might* be debatable under her framework (though she likely excludes them - see point 3), but the vast majority killed (children, etc.) were clearly not performing *any* role even remotely analogous to "harming."
      2.  **Countering Consequentialism:** Truman's defenders argued the bombings saved lives by ending the war swiftly. Anscombe rejects this *because* the intentional killing of the innocent is absolutely forbidden, *regardless* of consequences. Her definition provides the clear, non-consequentialist criterion: were they innocent (non-harming)? If yes, killing them is murder.
      3.  **Explicitly Excluding "War Effort" Contributors:** This is key. Anscombe's functional "role" is *specifically* tied to the *direct harming mechanism* (being a soldier, sailor, etc., under arms in the conflict). She explicitly rejects broadening "harming" to include:
          *   Civilians working in war industries ("munitions workers").
          *   Civilians growing food for soldiers.
          *   Civilians paying taxes that fund the war.
          *   Civilians expressing support for the war.
          *   *All* of these people remain "innocent" in her definition because they are not *functionally integrated into the act of combat* itself. They are not "under arms" performing the role of harming. Attacking them is intentional killing of the innocent.
      4.  **Focusing on the Act of Targeting:** The bombs were dropped on entire cities known to be full of these functionally innocent people. The *intention* of the act (city destruction) inherently involved intending their deaths as a means or end. This violates the absolute prohibition.

  **Conclusion on the Redefinition's Role:** Without this precise, stripped-down, functional definition of "innocent" (non-harming, either by act or role), Anscombe's absolutist case against Hiroshima and Nagasaki collapses. It allows her to definitively categorize the victims as innocent, shield that category from consequentialist trade-offs or broad definitions of "combatant," and deliver the clear verdict: mass murder. The "act vs. role" distinction, while potentially vulnerable at the fuzzy edges of combatant status, is essential for *protecting* the vast category of civilians from being redefined as legitimate targets. It's the philosophical bedrock of her furious protest.

  **In summary:** Anscombe's move is a philosophically serious attempt to define legitimate targets functionally within an absolutist ethic. While the "role" concept introduces necessary flexibility for conventional warfare, it's constructed precisely to maintain a bright line protecting civilians. This bright line is absolutely central and indispensable to her scorching condemnation of the atomic bombings as the intentional killing of the innocent. It's not a detour; it's the core mechanism enabling her judgment.
