answer: |-
  Here’s the strongest case for why omissions are **not genuine causes** within a conserved-quantity (CQ) framework, why this bullet *must* be bitten*,* and why Dowe’s "quasi-causation" is a principled solution rather than an ad hoc patch:

  ### Core Argument: Causation is Physical Process, Omissions are Absence
  1.  **The Metaphysical Primacy of Processes:** The CQ theory defines causation *fundamentally* as the intersection of world-lines involving the transfer of conserved quantities (energy, momentum, charge, etc.). This isn't just *a* definition; it captures the **physical glue** of the universe. A cause must *do* something physically to bring about an effect. Your fern's death involves physical processes: cellular breakdown, dehydration, chemical reactions. Watering involves processes: H₂O molecules interacting with soil and cells. Your *not watering* involves **no physical process** linking you (or the King, or the absent rain) to the fern's demise. There is no conserved quantity *transferred from your inaction* to the dying plant. Your omission is an *absence* of a specific process, not a process itself.

  2.  **The "Many Omissions" Problem is Fatal for Omission-as-Cause:** This is the strongest weapon *against* counting omissions as causes. If your not watering is a cause of the fern's death, then:
      *   The King of England's not watering it is equally a cause (no physical process from him either).
      *   The rain's not falling is a cause.
      *   My not breaking into your house to water it is a cause.
      *   The fern's own roots not spontaneously generating water is a cause.
      This leads to an explosion of causes for every event – an absurd metaphysical proliferation. *Every* absence that *could* have prevented the death becomes a literal cause. This violates parsimony and renders causal explanation useless. The CQ theory **naturally avoids this explosion** by requiring a physical process. Only actual processes (like the dehydration) are causes; omissions are *background conditions* or *necessary negatives*.

  3.  **Omissions as Difference-Makers, Not Causes:** What we *really* mean when we say "Your not watering caused the death" is:
      *   **Normative/Pragmatic Focus:** We are highlighting a *deviation from an expected norm or duty* (your promise to water it).
      *   **Counterfactual Dependence:** We assert that *if* you *had* watered it (a positive action involving CQ transfer), the fern *would not have died*. Your omission made the *difference* between life and death *in this specific context*.
      *   **Explanation of Preventable Harm:** We identify a point where a *preventative action* (involving CQ transfer) was possible but absent.
      This is fundamentally different from saying a falling brick (transferring momentum) *caused* the concussion. The brick *initiates* a physical process; your inaction is the *failure to initiate* a preventative process. The CQ theory cleanly separates the *physical causation* (dehydration processes) from the *pragmatic attribution* of responsibility for the absence of prevention.

  4.  **Biting the Bullet on Legal/Moral Talk:** Yes, people get sued or jailed for omissions. This doesn't prove omissions are *metaphysical* causes; it proves they are **legally and morally significant difference-makers**.
      *   **Legal "Causation" is Hybrid:** Law incorporates normative concepts (duty, foreseeability) *alongside* counterfactual dependence. The lifeguard had a *duty* to initiate a preventative process (vigilance, rescue). Their *failure* to do so is the *proximate reason* why the preventable drowning process wasn't halted. The *physical cause* of death is asphyxiation by water; the lifeguard's omission is the *failure to interrupt* that process. The CQ theory explains *why* they could interrupt it (they can transfer energy/momentum via swimming/resuscitation), justifying the legal focus on *their* omission over the King of England's.
      *   **Moral Responsibility ≠ Metaphysical Causation:** Holding someone responsible for an omission hinges on *agency, knowledge, capacity, and duty*. We blame the mechanic, not the King, because the mechanic had the specific *capacity* and *duty* to initiate the brake-checking process. The CQ theory grounds this capacity: the mechanic *could* have performed actions transferring CQs to inspect/repair the brakes.

  ### Addressing Dowe's "Quasi-Causation"
  Dowe's move isn't defeat; it's **principled taxonomy**. Think of it like physics vs. engineering:

  1.  **Core Causal Relation (Physics):** Strictly describes the fundamental physical processes governing the universe (CQ transfer). Omissions don't fit here. Full stop.
  2.  **Quasi-Causal Relation (Engineering/Pragmatics):** Describes how agents *interact* with the causal structure of the world, specifically concerning *prevention* and *dependence*. It accounts for:
      *   **Agent-Relativity:** *Whose* omission matters depends entirely on *duties, capacities, and expectations* (Lifeguard: yes; King: no).
      *   **Prevention Focus:** Quasi-causation highlights points where an *agent's action* (involving CQ transfer) *could have* prevented the outcome.
      *   **Counterfactual Basis:** It's explicitly defined via counterfactual dependence: "If agent A had performed action X (involving CQ transfer), outcome Y would not have occurred."
      *   **Grounding in Real Causation:** The quasi-relation is *parasitic* on real causation. The lifeguard's quasi-causation works *because* they *could have* initiated a real causal process (swimming) that *would have* interrupted the real causal process (drowning). The King lacks the *capacity* (proximity, duty) to initiate the relevant preventative process effectively. The mechanic's capacity to transfer CQs to the brakes grounds their quasi-responsibility.

  **Why this isn't ad hoc:**
  *   **It Solves the "Many Omissions" Problem:** Quasi-causation is inherently *selective* and *normatively loaded*. It doesn't claim *every* possible omission is quasi-causal; only those linked to agents with specific capacities and duties in the context. This matches our actual attributions.
  *   **It Respects the Core Physics:** It doesn't redefine causation. It creates a separate, pragmatically essential category *because* the core physical category cannot accommodate absences without collapsing.
  *   **It Explains Why We Care:** It directly addresses the legal, moral, and explanatory contexts where omissions *matter*, without pretending they are physical pushes and pulls.

  ### Conclusion & Why Bite the Bullet
  *   **Metaphysical Purity:** The CQ theory offers a clear, empirically grounded, non-anthropocentric account of causation as physical processes. Including omissions destroys this purity and leads to absurdity (infinite causes).
  *   **Explanatory Power:** It cleanly separates *what physically happened* (dehydration, drowning) from *why it wasn't stopped* (your omission, lifeguard's inattention). This is more precise.
  *   **Practicality Handled:** Dowe's quasi-causation provides a rigorous framework for our essential talk of omissions *without* compromising the core theory. It’s not a patch; it’s a necessary bridge between fundamental physics and human agency in a world full of preventable harms. The lifeguard *quasi-caused* the drowning by failing to initiate a preventative process they were duty-bound to perform. The King did not. The fern died due to physical processes; you are responsible because you quasi-caused its death by failing to act on your commitment.

  Biting the bullet means accepting that "cause" in fundamental metaphysics is narrower than in everyday language. But this isn't a flaw; it's precision. The conserved quantity theory captures the universe's causal machinery. Our concerns about omissions are about *our place* within that machinery – our power and responsibility to intervene in processes. Dowe’s quasi-causation systematizes *that* vital aspect without muddying the physical waters. Your intuition from the lab – that causation requires a physical connection – is fundamentally sound; the challenge is reconciling that with the complex realities of agency and prevention, which quasi-causation achieves.
