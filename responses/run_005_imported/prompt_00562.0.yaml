  The user's point is solid: once you accept organic unities, the isolation test can't reliably tell you about a part's contribution to a whole. Therefore, Moore's application in both cases is flawed. His conclusions about the beautiful world's intrinsic value and the minimal value of admiration alone are both suspect because the test doesn't account for emergent properties in combinations. 

