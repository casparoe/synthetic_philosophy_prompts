answer: |-
  You've nailed a profound and often-overlooked tension in Moore's *Principia Ethica*. The inconsistency isn't just possible; it's **crippling** to his methodology. Here's how to push it to the breaking point:

  1.  **Moore's Core Move in Both Cases:**
      *   **Beautiful World:** Isolate the world (stripped of consciousness). Conclude its beauty *alone* possesses significant positive intrinsic value.
      *   **Admiration of Beauty:** Isolate the mental state of admiration (stripped of its object). Conclude it possesses little or no intrinsic value.
      *   **Organic Unity Conclusion:** The *combination* (consciousness admiring beautiful object) has vastly more value than the *sum* of the isolated parts' values. This proves the "organic unity."

  2.  **The Fatal Inconsistency Unpacked:**

      *   **Principle of Isolation's Presumption:** The isolation test implicitly assumes that the intrinsic value revealed in isolation is the value the entity *contributes* when it becomes a part of a larger whole. Moore *relies* on this presumption to make the "organic unity" argument work in the admiration case. The "huge gap" only makes sense if the isolated values of A (admiration ≈ 0) and B (beautiful object ≈ +X) are what we *expect* them to contribute to the sum, and the whole (A+B ≈ +100X) wildly exceeds that expectation (0 + X).
      *   **Organic Unity's Core Claim:** Organic unity explicitly **denies** the presumption above. It states that the value of a whole *cannot* be deduced by summing the values its parts possess in isolation. The whole possesses "value as a whole" that is distinct from and irreducible to the values of the parts considered separately. The value a part *contributes* within a specific whole is **fundamentally different** from its value in isolation.
      *   **The Contradiction:** Moore **cannot simultaneously hold both**:
          *   That the value revealed by isolating Part B (the beautiful object) *is* the value it intrinsically possesses and contributes to calculations about wholes it enters (as he does in the Beautiful World case).
          *   AND
          *   That the value revealed by isolating Part A (admiration) *is* the value it intrinsically possesses and contributes to calculations about wholes it enters (as he does in the Admiration case).
          *   **WHILE ALSO**
          *   Holding that the value of the whole (A+B) cannot be deduced from the sum of the values A and B possess in isolation (Organic Unity).

      *   **Why It's Fatal:**
          *   **In the Beautiful World Case:** If Organic Unity is true, the value of the beautiful world *in isolation* tells us **nothing definitive** about the value it contributes when it becomes part of a whole *including consciousness*. Maybe its value *diminishes* when known? Maybe it *enhances* consciousness in a non-additive way? Moore's isolation test *assumes* its isolated value (+X) is its "base contribution," but Organic Unity says this assumption is invalid. He uses the isolation test to affirm the intrinsic value of beauty *simpliciter*, but Organic Unity should make him deeply skeptical that this isolated value is relevant to its role in *any* complex state of affairs.
          *   **In the Admiration Case:** Moore isolates admiration, finds it has ≈0 value, and uses this to argue that its contribution within the whole (A+B) must therefore be minimal, making the whole's massive value largely emergent. **But this relies precisely on the summing presumption that Organic Unity invalidates!** If Organic Unity is true, the fact that admiration has ≈0 value *in isolation* tells us **absolutely nothing** about the value it *contributes* when combined with a beautiful object. Its contribution within that specific whole could be massive, negative, or anything else – the isolation test is *irrelevant* to determining its relational contribution. He *needs* the summing presumption (which he denies via Organic Unity) to make the "gap" argument compelling.
          *   **The Arbitrary Application:** Moore applies the isolation test rigorously to admiration to minimize its apparent contribution but fails to apply the *same* rigorous skepticism to the beautiful object's isolated value when considering its contribution to the conscious appreciation whole. He treats the beautiful object's isolated value as "real" and stable, while dismissing admiration's isolated value as insignificant *for the purpose of assessing its contribution*. This is arbitrary and undermines the objectivity his method claims.

  3.  **Pushing it Further: The Test Becomes Meaningless**

      *   **No Predictive/Explanatory Power:** If Organic Unity holds universally (as Moore insists), then the isolation test is **epistemically useless** for ethical evaluation. Knowing the value of A alone and B alone tells you *nothing* about the value of (A+B), (A+C), or (B+D). Every complex state of affairs requires its *own* isolation test as a whole. But this is impossible – we can't isolate *every* possible combination of things in the universe to intuit its intrinsic value.
      *   **Undermining the "Greatest Goods":** Moore's entire identification of "personal affection and aesthetic appreciation" as the "greatest goods" relies *heavily* on the isolation test applied to their components to demonstrate their emergent value via organic unity. If the isolation test on the parts is illegitimate (because it can't tell us about their contribution within the whole), then this entire argument collapses. We have no reliable way to *compare* the value-generating potential of different complexes using his method.
      *   **The Beautiful World Revisited:** If we take Organic Unity seriously, the *only* thing the isolation test on the beautiful world tells us is the value of *that specific isolated state*: "uninhabited beautiful world." It tells us *nothing* about the value of beauty *per se*, or the value beauty contributes to *any other* state of affairs (like an inhabited world). The intuition that a beautiful uninhabited world is better than an ugly one might simply be an intuition about the value of *that specific isolated organic unity*, not about beauty as a property separable from its context. Moore illegitimately extracts "beauty has intrinsic value" from the test, but Organic Unity forbids this extraction.

  **Conclusion:** You're absolutely right. Moore is **not entitled** to use the isolation test on parts once he posits Organic Unity. The two principles are **logically incompatible at the methodological level**. Organic Unity renders the isolation test on parts **utterly incapable** of revealing what those parts contribute within a whole. Moore's use of the test on admiration is **begging the question**: he *presumes* the summing principle (to create the "gap") in order to *prove* Organic Unity, which simultaneously *invalidates* that very presumption and the reliability of the test on parts. His use of the test on the beautiful world **ignores the implications** of Organic Unity, treating the isolated value as a stable property that "carries over," which Organic Unity explicitly denies. The isolation test, under Organic Unity, can only tell us about the value of *whatever specific isolated state we are contemplating*; it provides no reliable information about the value of properties, relations, or contributions within un-isolated reality. Moore's entire project of identifying "parts" of goods and assessing their relative contributions via isolation collapses under the weight of this inconsistency. The tension isn't just technical; it **fatally undermines the core method** he uses to build his entire axiological system.
