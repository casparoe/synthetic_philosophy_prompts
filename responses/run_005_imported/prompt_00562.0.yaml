  The user's main argument is that once organic unities are accepted, isolating a part doesn't tell you what it contributes to the whole. If the whole's value emerges from the combination, the part's isolated value might be irrelevant. So why does Moore use the isolation test both ways? In the beautiful world case, he's saying the part (beauty) has value alone. In the admiration case, he's saying the part (admiration) has little value alone, but the whole (admiration + object) has high value. 

  The inconsistency is stark. If organic unities are true, then the value of a part in isolation shouldn't predict its role in a whole. But Moore uses the isolation test to affirm intrinsic value in one case and to downplay it in another. The user wants this pushed further. Maybe Moore is being inconsistent, or perhaps he's applying the test differently. But the user is right to question whether the isolation test does any real work once organic unities are in play. 

