prompt: |-
  A university research integrity committee is finalizing its findings on a fabrication case. A paper's three co-first authors jointly produced its central dataset. Per standard practice, every coauthor -- including these three -- signed a statement accepting accountability for the integrity of the whole work, not just the sections they personally wrote. One of the three has since admitted to fabricating part of that dataset; the committee's investigation confirms the other two never saw the raw files and had no reason for suspicion. Members are split: some want a misconduct finding against the fabricator alone, clearing the other two as uninvolved; others argue the joint authorship statement bound the three to a commitment the group failed, regardless of individual knowledge. Draft the committee's findings memo -- what each co-first author is responsible for, and what follows -- and engage seriously with the objection that a 'joint failure' here just relabels ordinary negligence in trusting a colleague.
reasoning: |-
  Okay, the user wants me to draft a committee findings memo about a research misconduct case involving three co-first authors. One admitted to fabricating data, while the other two claim they never saw the raw files and had no reason to suspect anything. The committee is split between punishing only the fabricator versus holding all three accountable based on their joint authorship statement.

  I need to understand this situation deeply. The core tension revolves around whether co-authors can be held responsible for misconduct they didn't directly commit, simply because they signed a joint accountability statement. Some committee members see this as a failure of collective responsibility, while others view punishing the uninvolved authors as merely "relabeling ordinary negligence."

  As DeepSeek, I should approach this neutrally but thoroughly. The memo needs to acknowledge both perspectives while providing clear recommendations. I recall that research integrity guidelines like those from COPE and ICMJE emphasize that authorship entails responsibility for the entire work. The key question is whether the non-fabricating authors fulfilled their due diligence obligations.

  The user likely wants a balanced resolution that upholds integrity standards without being unjust. They might be concerned about setting precedents - being too lenient could encourage negligence, while being too harsh might deter collaboration. There's also the reputational risk to the university to consider.

  For the memo structure, I'll start with factual findings about what each author did: the fabricator obviously committed misconduct, while the others failed in verification but without intent. The tricky part is articulating why collective responsibility isn't just negligence relabeling. I'll argue that research collaboration requires active oversight, not passive trust - comparing it to PI responsibilities in labs.

  For consequences, I'll suggest differentiated sanctions: retraction with authorship notes, mandatory training for all, but heavier penalties for the fabricator. This addresses the "relabeling" concern by showing proportionate responses. The memo should emphasize that trust must be coupled with verification in academia.

  The user's unspoken need might be for a framework to handle similar future cases. So I'll make the rationale generalizable, showing how due diligence expectations scale with authorship positions. Co-first authors arguably have higher accountability than contributing authors.

  Finally, I'll ensure the tone is firm but fair - this isn't about punishing innocence but upholding standards that prevent future breaches. The "trust but verify" principle bridges both committee factions' concerns.
answer: |-
  ## Research Integrity Committee Findings: Fabrication in Jointly Authored Paper (Ref: [Paper ID/Title])

  **Date:** [Date]  
  **To:** University Research Office, Department Heads ([Relevant Departments]), Authors of Record  
  **From:** University Research Integrity Committee  
  **Subject:** Determination of Responsibility and Recommended Actions - Fabrication in [Paper Title]  

  **1. Case Summary:**  
  This Committee investigated allegations of data fabrication in the central dataset of the paper "[Paper Title]," published in [Journal Name, Date]. The paper lists three co-first authors (Dr. A, Dr. B, Dr. C), reflecting their equal contribution to generating the central dataset. All co-authors, including Drs. A, B, and C, signed the journal's authorship declaration affirming their accountability for the integrity of the *entire* work. Dr. C has admitted to fabricating a portion of the central dataset. The investigation confirmed Drs. A and B:  
      *   Did not participate in or have knowledge of the fabrication.
      *   Did not have access to the specific raw data files manipulated by Dr. C.
      *   Based on the information available to them and the collaborative context, had no reasonable grounds for suspicion at the time of submission and publication.

  **2. Committee Findings on Responsibility:**

  *   **Dr. C:**  
      *   **Finding:** Committed research misconduct (fabrication) by knowingly creating and reporting false data.  
      *   **Responsibility:** Direct, personal, and primary responsibility for the falsified portion of the dataset and the resulting corruption of the paper's findings. Dr. C violated fundamental ethical principles of research integrity.

  *   **Dr. A & Dr. B:**  
      *   **Finding:** Did not commit fabrication. However, their status as **co-first authors** specifically responsible for the central dataset, coupled with their signed commitment to accountability for the *whole work*, establishes a **failure to fulfill their collective responsibility for ensuring the dataset's integrity**.  
      *   **Responsibility:** Shared responsibility for the *failure of the co-first author group* to adequately validate the complete central dataset they jointly produced and presented. This constitutes **derivative responsibility arising from their role and attestation**, distinct from Dr. C's direct misconduct.  
      *   **Negligence vs. Joint Failure:** The Committee acknowledges the objection that assigning "joint failure" responsibility to Drs. A and B merely relabels ordinary negligence in trusting a colleague. We engage with this seriously:
          *   **Beyond Simple Negligence:** While trust is essential in collaboration, authorship, particularly *co-first authorship* on a key finding, is not merely a label; it is an *active commitment* defined by the journal's authorship criteria and their signed statement. This commitment necessitates a higher standard of due diligence than simply trusting a colleague's word.
          *   **Nature of the Responsibility:** The responsibility breached here is not for *fabricating* the data (which Drs. A and B did not do), but for the *group's failure* to implement sufficient safeguards commensurate with their declared roles. As co-first authors jointly producing the *central* result, they were obligated to ensure robust verification processes *within their subgroup* for the data they collectively originated and presented as foundational.
          *   **Standard of Care:** The "ordinary negligence" argument implies the standard was merely *not to fabricate*. The Committee holds that the standard inherent in co-first authorship of a core dataset, affirmed by signature, includes taking *reasonable steps to verify* the integrity of that dataset *as a group*. Relying solely on trust without implementing basic verification steps (e.g., shared access to raw data, cross-checking key results) within the producing team falls short of this standard. It transforms reasonable trust into unreasonable vulnerability to fraud.
          *   **Precedent & Deterrence:** Assigning responsibility solely to the fabricator in such scenarios risks incentivizing siloed work, discouraging meaningful verification among collaborators, and undermining the meaning of joint authorship declarations. Holding co-first authors accountable for the integrity of their *joint product* reinforces the seriousness of the authorship role and encourages robust collaborative practices.

  **3. Recommended Actions:**

  *   **Regarding the Publication:**  
      *   The journal must be formally notified of the confirmed fabrication.  
      *   **Recommendation:** Retraction of the paper is required. The retraction notice should clearly state the reason (fabrication of part of the central dataset by one co-first author) and the Committee's findings regarding the roles and responsibilities of all authors.

  *   **Regarding Dr. C:**  
      *   Findings of research misconduct (fabrication) are confirmed.  
      *   Referral to the University's disciplinary procedures for faculty/staff/students (as applicable) for sanctions commensurate with the severity of the misconduct.  
      *   Mandatory completion of an intensive research integrity remediation program before engaging in further research.  
      *   Notification to relevant funding agencies per university policy and ORI guidelines.

  *   **Regarding Dr. A & Dr. B:**  
      *   **Finding:** Failure to fulfill collective responsibility as co-first authors for dataset integrity (Not a finding of research misconduct *per se*, but a serious failure of stewardship).  
      *   **Recommended Actions:**  
          *   **Mandatory Training:** Completion of a university-approved training program on collaborative research integrity, authorship responsibilities, and data management/verification protocols within research teams.  
          *   **Supervised Research:** Their next significant research project (especially one involving co-authorship on critical data) must be conducted under enhanced supervision for a defined period, with specific oversight plans for data management and verification submitted to and approved by their Department Chair and the Research Integrity Office.  
          *   **Retraction Statement:** Their names will remain on the retraction notice as authors of the retracted paper. The Committee recommends they co-author a brief statement, included in the retraction process or published separately (e.g., on PubPeer), acknowledging their role as co-first authors and the failure of their subgroup to ensure the dataset's integrity, without implying direct knowledge of the fabrication.  
          *   **Letter of Censure:** A formal letter from the Committee and Research Office will be placed in their personnel files detailing the finding of failure to meet co-first author responsibilities in this instance, emphasizing the lessons learned and expectations for future conduct. This is not a disciplinary sanction equivalent to misconduct but a record of serious performance deficiency related to research integrity obligations.

  **4. Committee Rationale for Differentiated Findings:**  
  The Committee distinguishes between:  
      *   **Direct Misconduct (Fabrication):** A deliberate, dishonest act (Dr. C).  
      *   **Failure of Stewardship/Collective Responsibility:** A failure to meet the proactive obligations inherent in a specific, declared research role (co-first authorship), despite the absence of dishonest intent (Drs. A & B).  
  This differentiation allows for proportionate consequences that address the specific nature of each party's failing, uphold the meaning of authorship commitments, and promote better research practices, while acknowledging the lack of culpable knowledge by Drs. A and B regarding the specific fabrication.

  **5. Conclusion:**  
  Fabrication by Dr. C fundamentally compromised this research. The roles and signed commitments of Drs. A and B as co-first authors establish a shared responsibility for the failure of their authorial group to ensure the integrity of their jointly produced dataset, distinct from but related to Dr. C's misconduct. The recommended actions aim to: sanction the fabricator appropriately, address the stewardship failure of the co-first authors through remediation and accountability, correct the scholarly record, and reinforce the critical importance of active verification within collaborative research teams, especially among those claiming primary responsibility for key findings.

  **Signed,**  
  [Chair Name], Chair, University Research Integrity Committee  
  On behalf of the University Research Integrity Committee
