answer: |-
  ## The Fog of War and the Scales of Justice: Assessing the Epistemic Defense of Combatant Equality

  Jeff McMahan's revisionist challenge to the traditional doctrine of the moral equality of combatants (MEC) strikes at the heart of conventional just war theory. By grounding liability to be killed in individual moral responsibility for contributing to an *unjustified* lethal threat, McMahan dismantles the notion that soldiers fighting for an unjust cause possess the same moral status and permissions as their just counterparts. Traditionalists, conceding the potential force of McMahan’s "deep morality" for the sake of argument, mount a powerful epistemic defense: ordinary soldiers simply cannot know with sufficient confidence whether their nation's cause is just. To hold them liable based on this unknowable criterion is profoundly unfair, they argue, and thus MEC must remain the practical norm governing conduct in war. Assessing whether this epistemic argument successfully rehabilitates MEC as a practical norm requires engaging McMahan's key rebuttal – the distinction between excusability and justifiability – and weighing the complex realities of warfare against the demands of individual moral accountability.

  **The Core of the Epistemic Argument:**
  Traditionalists argue that the conditions of war create an epistemic fog impenetrable for the individual combatant. Soldiers operate within complex chains of command, receive filtered or propagandized information, lack access to high-level intelligence and diplomatic contexts, and face immense time pressures and psychological stresses. Determining the *jus ad bellum* – whether the war itself is just – requires sophisticated moral and political judgment about complex historical claims, proportionality, last resort, and right intention. Expecting an 18-year-old conscript or even a career NCO to reliably discern the deep justice of their nation's cause amidst the chaos of mobilization, deployment, and combat is, traditionalists contend, unreasonable. Holding them liable to be killed based on a judgment they could not reasonably be expected to make violates fundamental fairness. Therefore, as a practical norm for judging and treating combatants *in the field*, MEC must prevail: all combatants are legitimate targets, and killing them is permissible (absent other constraints like *jus in bello* violations) regardless of the justice of their cause. This norm, they argue, provides essential clarity, predictability, and psychological stability in the inherently chaotic and morally fraught environment of war.

  **McMahan's Rebuttal: Excuse ≠ Justification ≠ Liability**
  McMahan counters that the traditionalist argument commits a crucial category error: it conflates **excusability** with **justifiability** and misunderstands the basis of **liability**.

  1.  **Justifiability:** An act is *justified* only if it is objectively permissible – if it does not wrong anyone. McMahan argues that killing in an unjust war *cannot* be justified; it necessarily wrongs the victims.
  2.  **Excusability:** An agent may be *excused* for performing an unjustified act if they were not culpable for it – typically due to ignorance, duress, or lack of capacity. The traditionalist epistemic argument powerfully suggests that many unjust combatants *are* excusable. Their ignorance about the war's injustice may be non-culpable.
  3.  **Liability:** Liability to defensive harm, however, stems from one's **objective contribution to an unjust threat**. McMahan argues that liability is primarily a *factual* and *objective* matter. If one is *in fact* morally responsible for contributing to an unjust lethal threat (even if non-culpably ignorant of the injustice), one can *objectively* lose one's right not to be killed by those defending against that threat. Excusability mitigates *blameworthiness* but does not necessarily negate *liability*.

  McMahan's point is stark: the excusable unjust combatant is still *unjustly* threatening others. While we may not *blame* them, and perhaps should not *punish* them, their actions still create a situation where killing them can be a justified act of *self- or other-defense* for those they threaten. The victim's right to life is violated by the objectively unjust threat, regardless of the threatener's epistemic limitations. To prioritize the potential unfairness to the *unjust combatant* (who might be excused) over the objective rights violation suffered by the *just combatant or innocent civilians* is, McMahan contends, a profound moral inversion. The deep morality demands that liability tracks the objective threat, not the agent's subjective certainty about it.

  **Weighing the Considerations:**

  *   **Strengths of the Epistemic Argument (for MEC as Practical Norm):**
      *   **Real-World Epistemic Constraints:** The argument powerfully captures the profound difficulty, often impossibility, of individual soldiers making reliable *jus ad bellum* judgments. Propaganda, secrecy, cognitive biases, and the fog of war are pervasive realities.
      *   **Fairness and Psychological Burden:** It seems deeply unfair to demand soldiers make potentially life-or-death decisions (about their own liability or the liability of their enemies) based on assessments they are structurally ill-equipped to make. Imposing individual liability based on an unknowable criterion creates immense, potentially paralyzing, psychological and moral burdens.
      *   **Practicality and Order:** MEC provides a clear, binary rule: combatant/non-combatant. Abandoning it risks chaos, hesitation, and potentially catastrophic errors in judgment *during* hostilities. Soldiers need operable rules.
      *   **Mitigating Unjust Wars?** Traditionalists might argue that MEC, by making all combatants targets, actually *discourages* escalation and atrocities by focusing violence on combatants and upholding *jus in bello* norms symmetrically. Removing this symmetry might incentivize just combatants to see unjust ones as "outlaws," potentially degrading restraint.

  *   **Strengths of McMahan's Position (Against MEC as Practical Norm):**
      *   **Moral Truth Matters:** The deep morality *is* relevant. Ignoring the fundamental moral asymmetry between just and unjust combatants simply because it's hard to discern seems like a surrender to moral relativism or consequentialism at the expense of individual rights.
      *   **The Victim's Perspective:** The epistemic argument focuses on the *unjust combatant's* predicament but neglects the *victim's* right not to be killed for an unjust cause. Why should the victim's right be forfeited because their killer was misled?
      *   **Excusability Doesn't Erase the Threat:** McMahan is correct that excusability mitigates *blame* but not necessarily the *objective wrongfulness* of the threat posed. A sleepwalker wielding a knife is excusable but still objectively threatens others and can be justifiably stopped with force.
      *   **Incentivizing Scrutiny:** Rejecting MEC might encourage greater institutional and individual moral scrutiny *before* resorting to war or participating in it. Knowing that liability is individual and tied to the war's justice could deter participation in dubious conflicts.
      *   **Nuance is Possible:** While difficult, McMahan argues that soldiers *can* sometimes make reasonable judgments. Leaders bear greater responsibility, and soldiers can often recognize egregious aggression or clear violations of *jus ad bellum* principles. A practical norm doesn't need to be binary; it can incorporate degrees of responsibility and epistemic reasonableness.

  **Verdict: The Epistemic Argument Succeeds for Operational Judgment, Fails for Strategic Morality**

  While McMahan's deep morality compellingly demonstrates that the *objective* moral status of combatants is unequal, the traditionalist epistemic argument **successfully rehabilitates a qualified version of MEC as a necessary norm for *practical judgment and conduct by soldiers in the midst of hostilities***. However, this success is pragmatic and operational, not a vindication of MEC's *moral* truth. It fails to rehabilitate MEC as a norm for *strategic, political, or retrospective moral judgment*.

  **Why it Succeeds Practically (for Soldiers in Combat):**

  1.  **The Burden is Intolerable:** Requiring individual soldiers to adjudicate *jus ad bellum* with sufficient certainty to determine liability *during combat* imposes an impossible cognitive and moral burden. The risk of catastrophic error – hesitating against a genuine threat or attacking someone who is objectively not liable – is too high.
  2.  **Operational Necessity:** War demands operable rules. The combatant/non-combatant distinction, grounded in immediate threat and status, provides crucial clarity for targeting decisions under extreme duress. Injecting complex *jus ad bellum* assessments into this calculus is unworkable and dangerous.
  3.  **Fairness in the Fog:** Given the systemic epistemic barriers, holding soldiers individually liable based on an assessment they could not reasonably make *is* unfair *as a practical rule governing their treatment by enemy combatants*. The excusable unjust combatant, while objectively contributing to an unjust threat, does not *deserve* to be treated as a moral pariah *in the context of combat* due to circumstances beyond their control. The norm acknowledges this shared vulnerability to manipulation and error.
  4.  **Preserving *Jus in Bello*:** A symmetrical rule like MEC provides the strongest foundation for upholding the vital constraints of *jus in bello* (discrimination, proportionality) by fostering a sense of shared vulnerability and reciprocal restraint *among combatants*, even amidst the underlying moral asymmetry. Removing this symmetry risks eroding these crucial humanitarian norms.

  **Why it Fails Morally (Beyond the Battlefield):**

  1.  **McMahan's Distinction Holds:** The epistemic argument does conflate excusability with the absence of liability. The *objective* moral wrong persists. The unjust combatant, even if excused, *is* liable based on the deep morality. The victim's rights *are* violated.
  2.  **Not a Blanket Norm:** MEC cannot govern *all* practical judgment. Political leaders, planners, and citizens bear a greater epistemic burden and capacity. Soldiers *joining* obviously aggressive wars (e.g., clear invasion) may have less claim to non-culpable ignorance. Post-war tribunals *must* consider individual responsibility and the war's justice. MEC cannot shield leaders or particularly culpable participants from moral condemnation or legal accountability.
  3.  **Perpetuating Injustice:** As a *general* norm, MEC risks legitimizing participation in unjust wars by granting participants an automatic moral shield ("I was just following orders, we were all equal combatants"). This undermines the vital project of delegitimizing aggression.

  **Conclusion:**

  The traditionalist epistemic argument succeeds not by refuting McMahan's deep morality, but by demonstrating the *practical impossibility and moral hazard* of applying that deep morality directly to the judgments and actions of individual combatants in the crucible of war. While the objective moral equality of combatants is a myth, **a practical norm of *operational* combatant equality – treating identifiable combatants as liable targets based on their status and immediate threat, irrespective of *ad bellum* considerations known only at a higher level – remains a tragic necessity.** It is a concession to human epistemic limitations and the chaotic reality of warfare, designed to manage violence and preserve humanitarian constraints *in bello*, not a denial of the underlying moral truth. McMahan is right about the deep morality: liability tracks responsibility for unjust threats. But the fog of war is so thick, and the consequences of misjudgment so dire, that soldiers cannot be expected to navigate by that compass alone. The epistemic argument compels us to adopt MEC as a pragmatic rule of engagement for those fighting, even as we must utterly reject it as a moral truth and continue to hold nations and leaders accountable for the justice of the wars they wage. The scales of deep morality are unbalanced, but the fog demands we sometimes act as if they were not.
