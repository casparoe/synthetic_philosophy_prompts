answer: |-
  You've hit the nail on the head – the "man of his time" dismissal *is* a cop-out, and Kepler's astrological project was far more radical and conceptually distinct than commonly acknowledged. Let's dissect the mechanics of his system compared to mainstream Renaissance/Ptolemaic astrology, focusing on *Tertius Interveniens* (1610) and *Harmonices Mundi* (1619), with nods to *De Fundamentis Astrologiae Certioribus* (1601).

  **Core Differences: Foundations & Mechanisms**

  1.  **Rejection of "Influences" & Occult Qualities:**
      *   **Ptolemaic:** Planets emitted specific "influences" or occult qualities inherent to their nature (e.g., Saturn = cold/dry/melancholic, Jupiter = hot/moist/sanguine). These influences acted directly on sublunary matter and human temperaments via rays carrying these qualities. Zodiac signs and houses modified these influences based on "dignities" (rulership, exaltation, etc.).
      *   **Kepler:** Vehemently rejected occult qualities and inherent planetary "natures" as unscientific superstition. **He replaced "influence" with "stimulus" via physical forces.**
      *   **Mechanism:** The primary physical agent was **LIGHT** (specifically, its intensity and geometric properties). Planets acted as moving sources of light/solar reflection. Crucially, the **GEOMETRIC ANGLES** (aspects) formed between planets, relative to Earth, were paramount. His key insight was that these angles corresponded to the **harmonic intervals** that governed the structure of the cosmos itself (as per *Harmonices Mundi*). Geometry and harmony were the *real* universal language.

  2.  **Radical Simplification: What He Discarded**
      *   **Houses:** Completely rejected as arbitrary human constructs with no basis in physics or geometry. The division of the sky into 12 mundane houses was meaningless to Kepler.
      *   **Zodiac Signs:** Dismissed as symbolic labels for segments of the ecliptic, not active agents. The *position* of a planet in the ecliptic mattered for calculating aspects and conjunctions, but the *sign* itself conferred no inherent qualities. He famously called the zodiac "the excrement of astronomy."
      *   **Essential Dignities:** Rulerships, exaltations, triplicities, terms – all discarded. A planet in its "own" sign held no special power for Kepler. Planetary strength derived solely from proximity to Earth (brighter light) and speed.
      *   **Traditional Aspects:** While he kept the core aspects (conjunction, sextile, square, trine, opposition), he redefined their *basis* and *meaning*. He didn't just accept the traditional Ptolemaic list; he derived the "valid" aspects mathematically from the harmonic divisions of the circle (the circle being the fundamental harmonic shape). Only aspects corresponding to harmonic ratios (1:2 = Opposition, 2:3 = Quintile, 3:4 = Square, 3:5 = Sextile, 4:5 = Semi-Sextile, 5:6 = Trine) were considered truly active. This led him to champion the **Quintile** (72°) and **Biquintile** (144°) as powerful harmonic aspects largely ignored by tradition.
      *   **Horoscopic Interpretation (as commonly practiced):** Rejected the complex web of sign placements, house rulerships, lords, and intricate dignitary scoring systems used to judge a natal chart's overall condition or predict specific life events. He focused almost entirely on **planetary configurations (aspects)** at key moments (birth, coronation, etc.) and their relationship to cosmic harmony.

  3.  **What He Kept (and Why - Differently):**
      *   **Planets as Archetypal Forces:** While rejecting inherent occult qualities, he retained planets as representing fundamental archetypal principles or forces observable in nature and human life (Mars = conflict/energy, Venus = love/attraction, Saturn = structure/limitation). Crucially, these weren't *caused* by the planets emitting qualities; the planets were *symbols* or *triggers* for these universal principles, activated by their light and geometric relationships.
      *   **Aspects:** This is the absolute core. Aspects were retained *because* Kepler believed he had discovered their true, physical basis in geometry and harmonics – the same laws governing planetary orbits and musical consonance. A square aspect wasn't "bad" because Saturn was square Jupiter; it was a dissonant 90° angle creating tension in the harmonic fabric, stimulating corresponding tension or conflict in the sublunary world (weather, human passions).
      *   **Conjunctions:** Retained as potent moments of combined stimulus/light source. Particularly important for mundane astrology (weather, politics).
      *   **The Sun's Primacy:** Emphasized the Sun's role as the primary source of light and life. Planetary effects were largely seen as modifications of solar influence.
      *   **Mundane Astrology (Weather/Politics):** This is where Kepler felt astrology had its strongest, most demonstrable validity. He saw planetary configurations (especially conjunctions, oppositions, and aspects involving Jupiter/Saturn) as **triggers** or **signs** for large-scale atmospheric and geopolitical patterns. The geometric/harmonic stimulus affected the sublunary realm's inherent tendencies (e.g., atmospheric instability, collective human emotions).
      *   **Natal Astrology (Temperament):** Kepler offered a *highly* reduced version. He believed the geometric/harmonic pattern of aspects at birth imprinted a certain "tuning" or disposition on the soul and body, primarily influencing **temperament and inclinations** (melancholic, sanguine, etc.). This was *not* about predicting specific events, wealth, or marriage partners, but about innate psychological and physiological tendencies. He saw it as analogous to how seasonal weather patterns affect crops – a shaping influence, not deterministic fate.

  **Why His Reasons Were Different in Kind:**

  *   **Physical Causation vs. Symbolic Correspondence:** Ptolemaic astrology relied on sympathetic magic and qualitative correspondences within a symbolic universe. Kepler sought **mechanical, physical causation** (light rays, geometric angles) operating within a **mathematically harmonious universe**. His justification wasn't tradition or authority (which he constantly criticized) but his discovery of universal geometric/harmonic laws.
  *   **Empiricism & Skepticism:** Kepler constantly demanded empirical evidence and railed against the unfalsifiable claims and rampant charlatanism of traditional astrologers. His system was an attempt to make astrology testable and grounded in observable physics (light, geometry) and mathematics (harmonics). *Tertius Interveniens* is full of scathing critiques of traditional practices based on their lack of reason and evidence.
  *   **Focus on Configurations, Not Static Positions:** Traditional astrology heavily weighted the *position* of a planet in a sign/house. Kepler focused almost exclusively on the dynamic *relationships* (aspects) *between* planets and the Sun/Earth at a given moment. The *process* of formation and dissolution of aspects was key.

  **Is it Still "Astrology"? Your Nagging Question**

  This is the crux. Kepler himself called it "astrology," but you're right to question it. Here's the breakdown:

  1.  **Retained Astrological Elements:**
      *   Use of planetary positions (longitudes) on the ecliptic.
      *   Interpretation based on planets as symbolic archetypes.
      *   Belief that celestial configurations correlate with terrestrial events (weather, temperament).
      *   Use of the traditional astrological vocabulary (planets, aspects, conjunctions) even while redefining them.

  2.  **Fundamentally Non-Astrological Core:**
      *   **Rejection of the core mechanism:** No occult influences, no zodiacal/house effects, no essential dignities.
      *   **Physical Mechanism:** Causation via light and geometry, grounded in universal harmonic laws.
      *   **Scope:** Severely restricted to temperament and large-scale mundane effects (weather/politics), rejecting natal fate prediction and most divinatory uses.
      *   **Methodology:** Rooted in empirical observation and mathematical physics/harmonics, not symbolic correspondence or tradition.

  **Conclusion:** Kepler wasn't practicing a "trimmed-down" version of traditional astrology. He was attempting a **radical scientific reformation** based on his discoveries in optics, geometry, and harmonics. He used the existing framework of planetary positions and the *language* of astrology because it was the only available toolset for discussing celestial-terrestrial correlations. However, he replaced its metaphysical core with a proto-physicalist, mathematical one.

  **What was left is best described as:**

  *   **An Early Theory of Celestial Triggers:** Using planetary light and geometric configurations as stimuli affecting sublunary processes (weather, collective psychology, innate temperament).
  *   **A Mathematical Astro-Meteorology & Astro-Psychology:** Focused on large-scale patterns and innate dispositions, derived from harmonic principles.
  *   **A Hybrid:** It retained just enough astrological scaffolding (planets, aspects, ecliptic) to be recognizable *as* astrology to Kepler and his contemporaries, but its soul was fundamentally different. Calling it "Keplerian Celestial Harmonics" or "Geometric Astro-Physics" might be more accurate, but anachronistic. **Within its historical context, it *was* Kepler's reformed astrology – a unique, rigorous, and physically-grounded system utterly distinct from the mainstream, driven by his genius and his desperate search for cosmic order.** It wasn't transitional; it was an audacious, dead-end branch of his scientific revolution, tragically intertwined with the bill-paying superstitions he despised.
