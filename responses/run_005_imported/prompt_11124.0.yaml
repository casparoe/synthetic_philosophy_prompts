prompt: |-
  So I've been chasing something down for a piece on paradoxes of infinity and decision theory, and I keep getting stuck on this thing called the Pasadena paradox, which a couple of philosophers apparently built specifically to be a nastier cousin of the St Petersburg paradox. Both are these coin-toss games where you flip till you get heads and the payout balloons with how many flips it takes, but from what I can tell the St Petersburg payout is just straightforwardly infinite in expectation, wheras the Pasadena version alternates the sign of the payout so the sum only "conditionally" converges -- and because of that you can supposedly reshuffle the very same possible outcomes and get the expectation to equal any number you like, or diverge, or refuse to settle at all. A friend who did a PhD in this stuff described it to me over dinner and now I can't let it go.

  What I haven't been able to get straight is why philosophers treat "the expectation is undefined" as such a categorically bigger problem than "the expectation is infinite" -- isn't infinite already about as broken as a decision rule can get? Could you actually compare the two paradoxes properly for me: what's doing the damage in Pasadena that isn't already present in St Petersburg, in terms of the actual convergence/rearrangement math, not just the vibe of 'one is infinite and one is undefined, spooky.' And then give me your own judgment -- I've seen vague references to fixes involving some kind of "relative" or comparative notion of expectation, or a distinction between "weak" and "strong" expectations -- do any of those actually dissolve the problem Pasadena raises, or are they just clever-sounding ways of declining to answer it?
reasoning: |-
  Okay, the user is diving deep into the Pasadena paradox and how it compares to the St. Petersburg paradox. They're writing a piece on infinity and decision theory, so they need a clear explanation of why "undefined expectation" is a bigger problem than "infinite expectation." They mention that their friend with a PhD explained it, but they're still stuck. Let me unpack both paradoxes step by step.

  First, St. Petersburg has an infinite expected value because the payouts grow exponentially. Even though the probability decreases, the sum diverges to infinity. Decision-makers might pay a high but finite amount to play, which is odd but manageable. The issue is that infinity isn't a real number, so expected utility doesn't give a finite answer. But at least it's consistently infinite, so you can compare it to finite games.

  Now, Pasadena alternates payouts. The terms are like (-1)^{n+1} * (2^n / n). The series converges conditionally because the positive and negative parts diverge separately, but together they converge to ln(2). But here's the kicker: conditional convergence means rearranging terms changes the sum. Riemann’s rearrangement theorem shows you can get any real number or divergence. So the expectation isn't just infinite—it's undefined because the order of outcomes matters. 

  Why is undefined worse? Because in decision theory, expectations should be order-invariant. If reshuffling the same probabilities and payouts gives different expected values, the rule is inconsistent. St. Petersburg at least has a determinate (infinite) value. Pasadena's value depends on how you list outcomes, which isn't specified in standard decision rules.

  The user asks if fixes like "relative expectation" or "weak vs. strong" help. Weak expectations (Cesaro summation) average partial sums, which for Pasadena gives ln(2). But that's arbitrary—why use that method? Strong expectations require absolute convergence, which Pasadena fails. These are workarounds but don't resolve the core issue: standard expected utility can't handle conditionally convergent series.

  The user's deeper need is understanding why philosophers see Pasadena as more pathological. It's not just "undefined is spookier," but that it reveals a flaw in the decision rule itself. While St. Petersburg challenges infinite utility, Pasadena shows that expectation can be manipulated, making it unreliable. Fixes are ad hoc; they impose a solution rather than solving the inconsistency. So the damage in Pasadena is foundational—it undermines the very coherence of expected utility in a way that St. Petersburg doesn't.
answer: |-
  You've nailed the core tension: both St. Petersburg (SP) and Pasadena (PD) break standard expected utility (EU) theory, but PD does it in a far more insidious and structurally damaging way. The difference isn't just vibes; it's about the *nature* of the breakdown and its implications for the very coherence of EU as a decision rule. Let's dissect them side-by-side.

  **1. St. Petersburg Paradox (SP): The Honest Infinity**

  *   **Game:** Fair coin. Flip until first heads (on flip `n`). Payout = `$2^n`.
  *   **Expectation Calculation:**
      *   Probability of heads on flip `n` = `(1/2)^n`.
      *   Expected Value (EV) = `Σ [n=1 to ∞] (Probability(n) * Payout(n))` = `Σ [n=1 to ∞] [(1/2)^n * 2^n]` = `Σ [n=1 to ∞] [1]` = `1 + 1 + 1 + ...` = **∞**.
  *   **Convergence:** The series **diverges to positive infinity**. The partial sums increase without bound.
  *   **The "Damage":**
      *   **Infinite Value:** EU assigns an infinite value to the game.
      *   **Decision Problem:** This implies a rational agent should be willing to pay *any* finite amount to play. Yet, intuitively, most people wouldn't pay more than a modest sum. This challenges the descriptive and normative adequacy of EU when utilities/payoffs are unbounded.
      *   **The Silver Lining (Relatively):** The infinity is **unconditional** and **order-invariant**. No matter how you rearrange the order of summation (i.e., the order in which you list the possible outcomes), the sum *always* diverges to +∞. The problem is "merely" that the value is infinitely large, not that it's ambiguous or unstable.

  **2. Pasadena Paradox (PD): The Treacherous Conditional Convergence**

  *   **Game:** Fair coin. Flip until first heads (on flip `n`). Payout = `$(-1)^{n+1} * (2^n / n)`.
  *   **Expectation Calculation:**
      *   Probability(n) = `(1/2)^n`.
      *   Payout(n) = `(-1)^{n+1} * (2^n / n)`.
      *   Expected Value (EV) = `Σ [n=1 to ∞] [(1/2)^n * (-1)^{n+1} * (2^n / n)]` = `Σ [n=1 to ∞] [(-1)^{n+1} * (1 / n)]`.
  *   **Convergence:**
      *   This series (`Σ (-1)^{n+1}/n`) is the **Alternating Harmonic Series**.
      *   It **converges conditionally** to `ln(2)` (≈ $0.693). *Conditionally* means:
          *   The series *itself* converges to a finite limit (`ln(2)`) if summed in the standard order (n=1, 2, 3, ...).
          *   However, the series of *absolute values* of the terms (`Σ |(-1)^{n+1}/n| = Σ 1/n`) is the Harmonic Series, which **diverges to infinity**.
  *   **The Catastrophic Damage (Riemann Rearrangement Theorem):**
      *   This conditional convergence is where PD becomes truly monstrous compared to SP.
      *   **Riemann Rearrangement Theorem:** If an infinite series is conditionally convergent, its terms can be rearranged (re-ordered) to converge to **any arbitrary real number whatsoever**, or to **diverge to +∞**, or to **diverge to -∞**, or to **oscillate without settling on any limit**.
  *   **Implications for PD:**
      *   **"The Expectation" is Meaningless:** The standard order (n=1, 2, 3, ...) gives `ln(2)`. But this is just an arbitrary choice.
      *   **Manipulating Expectation:** You can rearrange the *exact same possible outcomes* (with their *exact same probabilities and payouts*) to make the "expected value":
          *   $100? (Rearrange terms to sum to 100)
          *   -$1000? (Rearrange terms to sum to -1000)
          *   +∞? (Prioritize large positive terms)
          *   -∞? (Prioritize large negative terms)
          *   Oscillate forever? (Alternate blocks of positive and negative terms cleverly)
      *   **Decision-Theoretic Nightmare:** EU requires calculating a single, well-defined number (or ∞/-∞) representing the value of a gamble. PD shows that for *this specific gamble*, **no such well-defined value exists within standard summation**. The "expectation" isn't just infinite or undefined in a simple way; it's **fundamentally indeterminate**. Its value depends entirely on the *order* in which you choose to sum the infinite series of possible outcomes. Standard decision theory provides *no principle* for choosing one order over another. This isn't just a problem of magnitude (like SP), it's a problem of **logical coherence**.

  **Why "Undefined" is Worse than "Infinite"**

  *   **SP (Infinite):** The rule gives a clear, consistent (if problematic) answer: "This is infinitely valuable." While this breaks practical application (no finite price is enough), the rule itself is applied consistently *to the gamble*. It tells you the gamble dominates any finite alternative.
  *   **PD (Undefined):** The rule **fails to produce any consistent answer at all** for the value of the gamble. Depending on an arbitrary choice (summation order), it can tell you the gamble is worth $0.69, or $100, or -$1000, or is infinitely good, or infinitely bad, or just incoherent. This means the rule **cannot even compare this gamble reliably to other gambles or to sure things**. Should you prefer PD to $1? Sometimes the rule says yes ($0.69 < $1), sometimes no ($100 > $1), sometimes it gives no answer (divergence). **EU ceases to be a functional rule for PD.**

  **The "Fixes" & Their Merits (Spoiler: Mostly Declining to Answer)**

  1.  **Weak Expectations / Cesaro Summation:**
      *   **Idea:** Instead of the limit of partial sums `S_N = Σ_{n=1}^N term_n`, take the limit of the *average* of the first `N` partial sums: `(S_1 + S_2 + ... + S_N)/N`.
      *   **Result for PD:** This often "stabilizes" conditionally convergent series. For PD, it gives `ln(2)`.
      *   **Judgment:** It provides *a* number, but it's arbitrary. Why Cesaro? Why not other summation methods (Abel, Borel)? It imposes an external mathematical technique without a compelling *decision-theoretic* justification. It "declines to answer" the core problem (indeterminacy under rearrangement) by fiat.

  2.  **Strong Expectations / Absolute Convergence Requirement:**
      *   **Idea:** Only define expectation for gambles where the series `Σ |Probability * Utility|` converges (absolutely convergent). Reject gambles like PD (and SP!) as having "undefined" expectation.
      *   **Result:** PD is undefined. SP is also undefined.
      *   **Judgment:** This is logically consistent and avoids the rearrangement catastrophe. However, it's **extremely restrictive**. It throws out *both* SP and PD, and any gamble with unbounded utility (even very favorable ones like "win `$2^n` if `n` coin flips are tails, but only play if `n <= 100`" has a huge finite EV, but "win `$2^n` with `P=1/2^n`" for *all* `n` is undefined). It "declines to answer" by declaring vast classes of interesting and potentially decision-relevant gambles off-limits to EU analysis.

  3.  **Relative Expectation / State-Dependent Utility:**
      *   **Idea:** Compare gambles directly without assigning absolute expectations. Or, make utility depend on the state of the world in complex ways.
      *   **Judgment:** This is more a shift in framework than a direct "fix" for the summation problem. It might avoid *relying* on a defined expectation value, but it doesn't resolve the underlying mathematical indeterminacy inherent in the infinite sum for PD. It sidesteps the question posed by PD rather than answering it.

  4.  **Finitely Additive Probability:**
      *   **Idea:** Use a probability measure that's only finitely additive, not countably additive. This can sometimes assign finite "expectations" to divergent series.
      *   **Judgment:** Highly controversial and non-standard. It introduces new paradoxes and complexities. It often feels like "forcing" an answer rather than solving the problem naturally. Like Cesaro, it imposes a non-standard structure.

  **Your Judgment Requested: Do Fixes Dissolve the Problem?**

  **No.** The "fixes" primarily acknowledge the problem and then either:

  1.  **Impose Arbitrary Structure:** (Cesaro, Finitely Additive) They pick *one way* to get *a* number (like `ln(2)` for PD) but fail to justify *why that specific way* is the correct one for decision theory. They don't negate the fact that the standard summation is pathologically order-dependent.
  2.  **Retreat to Safety:** (Absolute Convergence) This avoids the pathology by severely limiting the scope of EU theory. It correctly identifies PD (and SP) as pathological under countable additivity but offers no positive solution for evaluating such gambles *within the EU framework*. It dissolves the problem only by refusing to engage with it.
  3.  **Change the Subject:** (Relative Expectation) This explores alternative decision rules that might handle comparisons involving PD-type gambles without needing a defined expectation, but it doesn't fix the core EU calculation for a single gamble.

  **The Verdict:**

  *   **St. Petersburg** shows EU can produce counterintuitive **infinite valuations**, challenging its practical use with unbounded payoffs.
  *   **Pasadena** reveals a **fundamental logical flaw** within EU's core machinery: its method of summing infinite series can be **internally inconsistent** for certain gambles. The "expectation" is not just large or infinite; it's **genuinely undefined and manipulable** due to conditional convergence.
  *   **Why Philosophers Care More:** SP is a problem of *scale* ("How do we handle infinity?"). PD is a problem of *meaning* and *consistency* ("Does 'expectation' even make sense here?"). It directly attacks the logical coherence of the EU rule in a way SP does not. A rule giving an infinite answer, while problematic, is still functioning deterministically. A rule that gives contradictory answers depending on arbitrary choices is broken at a deeper level.
  *   **The Fixes:** They manage the fallout but don't dissolve the core mathematical pathology exposed by the rearrangement theorem. They are ways of declining to answer the question "What is the expected value of the Pasadena game?" within standard EU theory, either by applying non-standard summation, banning the gamble, or moving to a different decision framework. The paradox stands as a stark limitation of the unmodified, countably additive expected utility rule when faced with conditionally convergent series.

  The true lesson of Pasadena is that "infinite" is messy, but "undefined due to conditional convergence" is a different beast entirely – one that exposes a vulnerability in the mathematical foundations of how we calculate expected value over infinite possibilities.
