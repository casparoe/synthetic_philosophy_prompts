prompt: |-
  so in my animal ethics seminar my professor keeps bringing up how korsgaard thinks she can get direct duties to animals out of kant, even though kant himself was pretty clearly an indirect-duties guy (the whole "dont shoot the old dog, not because you owe him anything but because it'll blunt your own capacity for sympathy" line from the metaphysics of morals / lectures on ethics). can you write me a dialogue between two committed kantians who land on opposite sides of this? one defends the orthodox reading -- only rational beings capable of setting ends are ends in themselves, so animals get indirect duties at best, full stop. the other is running korsgaard's "fellow creatures" move: that kants own argument for why humanity counts as an end in itself (rational agents necessarily take their own natural good to be objectively good, not just good-for-me) actually commits him to direct duties toward animals whether he wanted that or not. dont let the korsgaardian just win by asserting the thesis louder -- i want the orthodox kantian to really press on whether this counts as interpreting kant or just borrowing his name for a different view, and the korsgaardian needs a genuine comeback to that. maybe 6-8 exchanges each, real back-and-forth, nobody strawmanned.
