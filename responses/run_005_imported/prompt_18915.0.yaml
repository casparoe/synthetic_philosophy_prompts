    - Conditioning on B: P_B(B|A) = 1, so by Stalnaker's Thesis, P_B(A>B) = 1, which is P(A>B | B) = 1.
    - Conditioning on ~B: P_{~B}(B|A) = 0, so by Stalnaker's Thesis, P_{~B}(A>B) = 0, which is P(A>B | ~B) = 0.
  - Then by the law of total probability: P(A>B) = P(B)*1 + P(~B)*0 = P(B).
