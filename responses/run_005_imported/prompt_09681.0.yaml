  Then there's the practical aspect: should they trust their notes less? In science, rigorous methods aim to reduce such biases, like double-blind studies. But field ecology often relies on expert observation, which is inherently subjective. The user's concern highlights a limitation in observational data. However, multiple independent observations can mitigate this. In this case, only two people saw the bird, one biased, one not.

