answer: |-
  You've hit on a genuinely profound and contested point in 20th-century philosophy. The structural similarity *is* striking, but Quine and his interpreters insist the indeterminacy of translation is *not* just underdetermination applied to semantics. Here's a breakdown of the key arguments for why the "fixes" for underdetermination don't dissolve the gavagai worry, and why indeterminacy is considered deeper:

  1.  **The Target is Different: Fact of the Matter vs. Epistemic Access:**
      *   **Underdetermination (Science):** Concerns our *epistemic access* to the *one true theory* describing an independent physical world. The "fixes" (IBE, theoretical virtues) are tools for *choosing the best theory* from underdetermined rivals, based on the pragmatic/rational assumption that such virtues track truth *about the world*.
      *   **Indeterminacy (Translation):** Attacks the very *existence* of a "fact of the matter" about meaning or reference. Quine argues there *is no independent reality* (beyond stimulus patterns and behavior) for meaning statements to be true *or* false about. Translation manuals aren't rivals describing some hidden semantic reality; they are *equivalent behavioral codings* of the same physical evidence. There's nothing *deeper* for IBE to track.

  2.  **The Nature of the Evidence:**
      *   **Science:** The evidence (observations, experiments) is *theory-laden* but also *constrains* theories about an external world. Future evidence *can* potentially discriminate between rivals (even if, practically, it might not at a given time).
      *   **Translation:** The evidence is *exhaustively* behavioral – stimulus conditions and observable assent/dissent. Crucially, Quine argues that *all possible behavioral evidence* is compatible with multiple, incompatible translation manuals. There is *no conceivable future evidence* that could settle whether "gavagai" refers to rabbits, undetached rabbit parts, or rabbit stages, *because* meaning *just is* this behavioral disposition. The manuals systematize the *same dispositions* differently.

  3.  **Why Theoretical Virtues Don't Apply (in the Same Way):**
      *   **Science:** Simplicity, elegance, explanatory power, etc., are applied under the assumption that the world *is* structured and that these virtues help us latch onto that structure. They guide us towards the *most likely true* theory.
      *   **Translation:** Applying virtues like simplicity is purely *pragmatic*. Choosing the manual that treats "gavagai" as "rabbit" is simpler *for us*, given our language and ontology. But this simplicity doesn't track a "semantic truth" that the native *means* rabbit rather than undetached rabbit part. It's a choice based on *our* convenience and biases, not on discovering what the native *really means* (because, for Quine, there is no such thing beyond the behavioral dispositions). IBE presumes there is something *to be explained* (the semantic fact); Quine denies that presumption.

  4.  **Quine's Naturalism and Behaviorism:**
      *   This is the bedrock. Quine is a physicalist and behaviorist about meaning. Meaning isn't a mysterious mental entity or abstract Platonic form. It's entirely constituted by dispositions to verbal behavior under publicly observable stimulus conditions. If two manuals capture *all* the stimulus-response patterns perfectly, then *by definition*, they capture *all there is* to meaning. There is no "ghost in the machine," no private mental dictionary, no meanings-as-entities that the manuals could be right or wrong about independently of behavior. Underdetermination in science assumes a reality *beyond* the current evidence; indeterminacy in translation denies there is *any* reality beyond the behavioral evidence for semantics.

  5.  **The Analogy Argument (Why it's Deeper):**
      *   Quine often used analogies to highlight the difference:
          *   **Coordinate Systems:** Mapping a curved surface (like the Earth) onto a flat map. There are infinitely many projection systems (Mercator, Peters, etc.). Each distorts some properties (area, shape, distance) while preserving others. There is *no fact of the matter* about which is the "true" flat map; they are different useful representations of the *same underlying reality*. Quine argues translation manuals are like this for behavior. The underlying reality is the pattern of stimuli and responses; the manuals are different ways of coding it linguistically. Choosing one is pragmatic, not truth-tracking.
          *   **Physical Theories vs. Measurement Systems:** Deciding between Newtonian and Einsteinian physics based on evidence is underdetermination (epistemic access to reality). Deciding whether to measure temperature in Celsius or Fahrenheit is *not* underdetermination; it's a conventional choice. Both scales perfectly represent the *physical facts* about heat (molecular motion). Quine argues meaning is like the choice of scale, not like the choice of physical theory. The "facts" are the behavioral dispositions; the "scale" is the translation manual.

  **Why the Secondary Sources Say "Deeper" or "Totally Different":**

  *   **Metaphysical Stakes:** Underdetermination is epistemological (how do we *know* which theory is true?). Indeterminacy is ontological (there *is no* truth about meaning/reference beyond behavior).
  *   **Scope of Skepticism:** Underdetermination leaves room for realism (there is a truth, even if hard to access). Indeterminacy is a form of anti-realism or eliminativism *specifically* about meaning/reference as traditionally conceived.
  *   **Permanence:** Underdetermination might be resolved by future evidence. Indeterminacy is argued to be *insoluble in principle* because the evidence is exhausted by behavior.

  **Your Skepticism is Valid (The "Extra Steps" View):**

  Some philosophers (notably, Donald Davidson, though he developed his own response) argued that indeterminacy *is* essentially a radical form of underdetermination, driven by Quine's stringent behaviorism. They might say: "If you reject Quine's behaviorism and allow richer evidence (e.g., intentions, patterns of use in complex discourse, neural correlates), then standard underdetermination fixes *could* apply to translation." Quine, however, would counter that any such "richer evidence" either reduces to behavior or smuggles in the very notion of meaning he's trying to naturalize.

  **Conclusion:**

  You're right that the *logical structure* is similar: multiple hypotheses fit the evidence. The crucial difference lies in **what the hypotheses are *about*** and **the nature of the evidence**:

  1.  Scientific underdetermination: Hypotheses about an independent physical world; evidence is theory-laden observations that *could* discriminate in principle; fixes assume realism and aim for truth-tracking.
  2.  Indeterminacy of translation: Hypotheses about meaning/reference; evidence is exhaustively behavioral dispositions; Quine argues meaning *is* nothing beyond these dispositions, so there is *no fact of the matter* for the hypotheses to be right or wrong about; fixes are purely pragmatic choices between equivalent codings.

  The "deeper" claim stems from Quine's behaviorist naturalism: he's not just saying we *can't tell* which manual is right; he's saying the question of which one is "right" *has no answer* because there is no independent semantic reality for it to be an answer *about*. The underdetermination fixes don't carry over because they presuppose the existence of the very thing (a determinate meaning/reference) whose existence Quine's argument denies.
