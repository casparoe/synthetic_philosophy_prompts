  ok so this happened in my study group for my phil of science class and I can't stop thinking about it. We'd just covered Hempel's raven paradox in lecture and afterwards Nora and Theo got into it. Theo's take: Hempel himself said we should just accept that spotting a white shoe (or literally any non-black thing that's not a raven) does confirm "all ravens are black," via the equivalence condition plus Nicod's criterion, and that the "paradox" feeling is just us smuggling in background assumptions we're not entitled to -- once you accept confirmation comes in degrees, its totally fine that the shoe confirms by some infinitesimally tiny amount. Nora said that's a cop-out, that the actual problem is Nicod's criterion itself, since it pretends confirmation is just about matching P's and Q's and ignores that we already know ravens are rare and non-black things are everywhere -- so of course checking a shoe tells you basically nothing, but that's a fact about our priors, not some universal fact about "the logic" of confirmation. Theo replied that Nora's "fix" doesn't actually get her out of the weird conclusion, since on her own bayesian story the shoe still bumps the probability up a little, so she's basically agreeing with Hempel and just arguing about how small "a little" is. Nora said no, there's a real difference: on Hempel's view any non-black non-raven anywhere always confirms at least a bit, full stop, whereas on the bayesian view it depends entirely on your background assumptions about the world, and (she brought up I.J. Good's old counterexample here) you can even construct cases where spotting an actual black raven counts AGAINST "all ravens are black," something Nicod's criterion says should be flat out impossible. Neither of them backed down, and I don't know enough formal epistemology to referee it myself. Could you go through their exchange move by move and say who's got the better of it at each point, and flag anything you think both of them are missing?
