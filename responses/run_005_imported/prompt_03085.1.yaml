answer: |-
  That's an excellent and penetrating question that cuts to the heart of the difference between supervaluationism and epistemicism regarding classical logic. Supervaluationists *do* insist that "Bob is bald or Bob is not bald" is **supertrue** even in a borderline case, while denying that either "Bob is bald" or "Bob is not bald" is **supertrue** (or superfalse). This seems paradoxical! The key lies in understanding the supervaluationist's *redefinition of truth* and their semantic machinery.

  Here's how supervaluationism justifies this and preserves classical logic *without* bivalence, contrasted with epistemicism:

  1.  **The Core Machinery: Precisifications and Supertruth:**
      *   **Precisifications (Admissible Sharpenings):** Supervaluationism posits that for a vague predicate like "bald," there is a *range* of ways to make it precise ("sharpen" it) that are consistent with its meaning and use. These are the *admissible precisifications*. For Bob borderline bald, some precisifications count him as bald, others count him as not bald. *No single precisification is uniquely "correct."*
      *   **Supertruth (Superfalsity):** A statement is **supertrue** if and only if it is true according to *every* admissible precisification. It is **superfalse** if and only if it is false according to *every* admissible precisification.
      *   **Truth-Value Gap:** If a statement is true on *some* precisifications and false on *others*, it is neither supertrue nor superfalse. This is the *borderline* case, where bivalence fails.

  2.  **Applying it to the Disjunction:**
      *   Consider "Bob is bald or Bob is not bald" (P v ~P).
      *   **For every single admissible precisification:** The law of excluded middle *holds within that precisification*. In any sharpened world, Bob *is* either bald or not bald. There are no precisifications where Bob is neither bald nor not bald. Therefore, P v ~P is **true on every precisification**.
      *   **Therefore:** P v ~P is **supertrue**.
      *   **Now consider the disjuncts individually:**
          *   "Bob is bald" (P): True on *some* precisifications (where the cutoff is drawn such that Bob counts as bald), false on others (where the cutoff excludes him). Therefore, P is **neither supertrue nor superfalse**.
          *   "Bob is not bald" (~P): False on the precisifications where P is true, and true on those where P is false. Therefore, ~P is also **neither supertrue nor superfalse**.
      *   **The Result:** P v ~P is **supertrue**, while neither P nor ~P is **supertrue**. This seems to violate the intuitive principle that a true disjunction requires a true disjunct.

  3.  **How Supervaluationism "Saves" Classical Logic (and the Principle):**
      *   **Redefining Truth:** Supervaluationists *redefine* "truth" for sentences in the language *as* **supertruth**. When they say a sentence is "true," they *mean* it is supertrue (true on all precisifications).
      *   **Preserving Laws:** Under this definition of truth (supertruth), many classical logical laws hold *at the level of the supervaluation*:
          *   **Excluded Middle (P v ~P):** As shown above, it's supertrue.
          *   **Non-Contradiction (~(P & ~P)):** True on every precisification (since no precisification makes both P and ~P true), hence supertrue.
          *   **Validity:** An argument is supervaluationally valid if the conclusion is supertrue whenever all premises are supertrue.
      *   **The Disjunct Principle Reinterpreted:** The classical principle "A disjunction is true only if at least one disjunct is true" *also holds*, *but only under the supervaluationist's definition of truth as supertruth*. The problem arises because we intuitively apply the principle using a *different* notion of truth (e.g., truth in a precisification) to the disjuncts.
          *   **Within a Precisification:** In any *single* precisification, if P v ~P is true (which it always is), then either P is true *in that precisification* or ~P is true *in that precisification*. The principle holds perfectly locally.
          *   **At the Super Level:** If P v ~P is **supertrue** (true in all precisifications), does that mean at least one disjunct is **supertrue**? No. Why? Because **supertruth requires truth in *all* precisifications**. Neither disjunct achieves that. The principle *fails* when "true" means **supertrue** and applied directly to the disjuncts evaluated across the whole range of precisifications.
      *   **The Justification:** Supervaluationists argue this is the price worth paying to preserve the *laws* of classical logic (like excluded middle) at the super level while accommodating vagueness. They bite the bullet on the intuitive principle about disjuncts by arguing that the *local* principle (within precisifications) holds, and that supertruth is the appropriate *global* notion for assessing truth in a vague language.

  4.  **Contrast with Epistemicism:**
      *   **Bivalence:** Epistemicism **retains bivalence strictly**. For any person and any point in the Sorites series, "Person n is bald" is *either* determinately true *or* determinately false. There *is* a sharp cutoff.
      *   **Classical Logic Intact:** Because bivalence holds, classical logic holds in its *standard, unmodified* form. The principle "A true disjunction requires a true disjunct" holds straightforwardly. "Person n is bald or not bald" is true because *one of the disjuncts is determinately true*, even if we cannot know which one.
      *   **Spirit of the Move:** Epistemicism preserves classical logic *by insisting there is a determinate, mind-independent fact of the matter* about vague predicates, even if it's unknowable. Supervaluationism preserves classical logic *by changing the definition of truth* (to supertruth) and introducing a semantic structure (precisifications) that allows bivalence to fail *locally* (for borderline sentences) while classical tautologies hold *globally* (at the super level).
      *   **Key Difference:** Epistemicism maintains the *standard semantics* for logical connectives and truth, adding only the epistemic claim of unknowability. Supervaluationism *alters the semantics* (truth = supertruth, connectives evaluated over precisifications) to accommodate truth-value gaps while aiming to preserve the *output* of classical logic for clear cases and tautologies.

  **In Summary:**

  Supervaluationists justify holding "P v ~P" true in a borderline case by:
  1.  Defining truth as **supertruth** (truth on all admissible precisifications).
  2.  Showing that "P v ~P" is true on *every* precisification (due to classical logic holding *within* each precisification), making it supertrue.
  3.  Acknowledging that *neither disjunct* is supertrue because each fails on some precisifications.
  4.  Arguing that the classical disjunction principle holds *within each precisification*, and that the *global* failure when "truth" means supertruth is an acceptable consequence of their semantic framework designed to save classical laws without bivalence.

  The **spirit** differs radically from epistemicism: Epistemicism saves classical logic by positing hidden facts (preserving standard semantics + bivalence + unknowability). Supervaluationism saves classical logic by redefining truth and introducing semantic indeterminacy (preserving classical tautologies *as supertrue* while abandoning bivalence for borderline cases). The tension you identified highlights the core semantic innovation – and arguably, the core cost – of the supervaluationist approach.
