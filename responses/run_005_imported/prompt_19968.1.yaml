answer: |-
  Here’s a story where Aquinas’s distinctions aren't just cited, but become the agonizing framework for a life-or-death decision:

  **The Weight of the Words**

  Brother Anselm’s quill hovered over the vellum, trembling. Not from the cold of the scriptorium, but from the cold fury in the words he transcribed. Master Thomas’s *De Regno*, Book I, Chapter 7: *Whether it is lawful to kill a tyrant?*

  He’d copied this passage a dozen times before. Now, it felt like etching his own indictment.

  *Outside*, the reality Master Thomas dissected was choking the city. King Lorcan, once hailed as a peacemaker after the bloody Succession Wars, now squeezed Barony with taxes to fund his vanity projects and private army. Dissenters vanished. Last week, it was Master Willem, the guildsman who’d dared petition for relief. Found floating in the river, hands bound.

  *Inside*, Brother Anselm grappled with the precise, terrifying distinctions:

  > *"A tyrannical government is unjust, because it is directed not to the common good, but to the private good of the ruler... Consequently, the overthrow of such a government is not strictly sedition..."*

  Anselm’s knuckles whitened. *Overthrow*. But how? By whom? He scanned ahead, the familiar phrases now landmines:

  > *"If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if he tyrannically abuses the royal power."*

  *The multitude*. Anselm thought of the cowed guilds, the terrified peasants, the nobles either profiting or paralyzed. There *was* no organized multitude. Only whispers in dark corners. Like the one he’d shared last night with Elara, Willem’s daughter, her eyes burning with a grief that demanded action. *Her* action. She clutched a knife under her cloak, whispering plans Anselm knew were suicidal.

  But Aquinas offered another path, a crucial distinction:

  > *"If, however, the tyrant holds sway not by usurpation but by a just title, then the case is different. For the subjects have no power to pass judgment on him..."*

  King Lorcan *had* a just title. Elected by the Council of Barons after the last legitimate line died out. Aquinas’s words were clear: Lorcan, however monstrous now, was *legitimately* appointed. His tyranny was a perversion *of* his office, not its initial absence. To kill him wasn't just regicide; it was, potentially, a sin against the divinely-ordained order itself. Only a "public authority" could act – but what constituted that? The Council? They were Lorcan’s puppets now. The Church? Abbot Gregory counselled patience and prayer, fearing worse chaos.

  Anselm slammed the quill down, ink spattering like blood. *Cagey*. Master Thomas was infuriatingly cagey. He condemned the tyrant, justified resistance in principle, but then wove layers of conditionality that felt like chains.

  Elara found him pacing the cloisters at dusk. "Well, Brother? Does your Saint give you leave? Or must I stain my soul alone?"

  Anselm stopped, the weight of Aquinas’s distinctions pressing on him. "Elara... it’s not simple. Lorcan wasn't a *usurper*. He was chosen. Lawfully."

  Her laugh was brittle. "Lawful? When he murders lawful men? Your Saint cares *how* a monster got his crown?"

  "Master Thomas *does*," Anselm insisted, the scholar surfacing despite the dread. "A ruler who *seizes* power without title... Aquinas says such a one may be slain by *anyone*, for he is no true ruler, merely a brigand with a crown. But Lorcan... he *was* given the power. By right. To kill him now... it might not be justice. It might be murder, and invite greater evil." He gestured helplessly at the darkening city. "Who has the *authority*? The 'public body' that appointed him is broken. Is it just... anyone with the will and a blade?" He looked at her, seeing the fatal determination. "Like you?"

  "While we debate *authority*, Anselm, people die!" Elara hissed. "Willem died! My father! Was his death 'lawful'? Does the *manner* of the tyrant's ascent make his victim's pain less real?"

  Anselm flinched. Aquinas spoke of the common good, of order, of just titles. He didn't speak of Elara’s raw, personal agony, or the specific face of Willem floating in the reeds. The theory felt suddenly cold, abstract.

  "Perhaps... perhaps if the *multitude* could be roused..." Anselm murmured, clinging to the text. "If the Barons, the guilds, the people... if they acted *together*... that might constitute the 'public body' Aquinas implies."

  "And how long?" Elara demanded. "How many more disappear while you build your 'multitude'? Lorcan grows stronger daily. His spies are everywhere." She stepped closer, her voice dropping to a whisper. "There *is* no multitude, Anselm. Only individuals. Like me. Like you. Or are we just... decoration on his tyranny?"

  She turned to leave. "I act tomorrow night. At the feast. With or without your Saint's permission."

  Anselm watched her go, Aquinas’s words echoing in the silent cloister:

  *"The overthrow of such a government is not strictly sedition..."* But Lorcan was legitimate. *"The subjects have no power to pass judgment..."* But who else was there? *"If the multitude has the right..."* But the multitude was shattered.

  He saw Elara’s small knife against Lorcan’s guards. He saw chaos erupting, a power vacuum filled by worse. He saw Willem’s body.

  He returned to the scriptorium. The half-copied page lay accusingly. The distinctions were real, vital, the bedrock of order Aquinas sought to preserve. Lorcan *was* different from a mere usurper. Acting alone *was* different from a public judgment.

  But was preserving the *theory* of order worth the *reality* of Lorcan’s continued butchery? Was Elara, driven by righteous vengeance and despair, the instrument of justice Aquinas cautiously allowed against a usurper, but implicitly forbade against a legitimate ruler turned tyrant? Or was she simply a murderer in the making, her act guaranteeing anarchy?

  Brother Anselm picked up his quill. He didn't dip it in ink. He stared at the precise, hedged, cagey words of Saint Thomas Aquinas. The gears of Thomistic reasoning turned, grinding against the simple, brutal imperative of Elara’s grief. He had until tomorrow night. To reconcile the irreconcilable. To decide where, in the terrifying space between *tyrannus absque titulo* and *tyrannus ab titulo*, justice truly resided, and who, in the absence of a clear "public body," had the terrible right – or duty – to wield it.

  The vellum remained unfinished. The distinctions, clear on the page, were a torment in the world. The plot wasn't about the assassination; it hung entirely on whether Anselm believed Elara's desperate, individual act could ever fit within Aquinas's meticulously constructed – and agonizingly ambiguous – framework for righteous tyrannicide. The decision, when it came, wouldn't feel like triumph, only the least terrible choice in a landscape defined by impossible distinctions.
