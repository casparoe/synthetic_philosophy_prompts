prompt: |-
  Ok this has completely hijacked my week: I ran my book through one of those "was this used to train AI" lookup tools and there it was, sitting in the Books3 dataset, no permission, no payment, nothing. So now i'm down a rabbit hole trying to work out if there's even a coherent argument that I "own" the words/ideas in that book, as opposed to just owning physical copies of it.

  Two theories keep showing up in what I've been reading: Locke's labor-mixing theory of property (with the "enough and as good left for others" proviso), and Hegel's idea that property is really just the will/personality made external in a thing. Can you compare the two specifically as applied to ideas rather than land or objects? Ideas aren't rivalrous the way land is - me "taking" your idea doesn't leave less of it for you - and I have a feeling that messes with Locke's story more than Hegel's, but honestly i'm not sure. Also, somewhere in my reading I picked up that Hegel says something oddly specific about how you can sell someone a physical copy of a book without selling them the "universal" content in it once its out in the world - is that actually his view, and does it end up helping or hurting a Hegelian case for something like copyright? Basically, of the two, which one gives sturdier footing for owning an idea, and does the non-rivalry problem sink them both anyway?
