answer: |-
  Below is a dialogue between **Alex** (a classical logician committed to the impossibility of true contradictions) and **Sam** (a dialetheist who accepts some true contradictions), focusing precisely on your core concern: whether dialetheism can coherently assert that anything is *just* true (true and not also false) without collapsing into classical logic or succumbing to the Strengthened Liar Paradox.

  ---

  ### **Setting:** A university common room after a logic seminar.

  ---

  **Alex:** Sam, I respect the ingenuity of paraconsistent logics. They elegantly avoid *ex falso quodlibet*. But dialetheism itself? It seems self-undermining. Take the Strengthened Liar: "This sentence is *not true*." If your dialetheic negation allows truth and falsity to overlap, then claiming *anything* is "just true" seems impossible. The moment you say "P is true *only*," I can construct: "This sentence is *not true* in the way P is." How do you escape that?

  **Sam:** Alex, you’re hitting the core tension. But dialetheism isn’t claiming *all* contradictions are true—just *some*. Crucially, we distinguish between *contradictions* (A ∧ ¬A) and *exclusions* (claims that *exclude* truth or falsity). Dialetheic negation (¬) is *glutty*: it allows overlap. But we also need a device to *reject* glut when necessary. That’s not smuggling; it’s hierarchy.

  **Alex:** Hierarchy? So you’re adding a *stronger* negation? Say, "¬*" meaning "not true *in any sense*"? But then ¬* is just classical negation! If I say, "P is ¬* false" (i.e., "P is classically true"), haven’t you just rebuilt classical logic inside dialetheism?

  **Sam:** Not at all. Classical negation is *explosive*. ¬* isn’t. It’s a *defined* operator within a paraconsistent framework. Let me formalize it. Suppose we have:
  - **T(A)**: A is true (may overlap with falsity).
  - **F(A)**: A is false (may overlap with truth).
  - **E(A) ≡ ¬T(A) ∧ ¬F(A)**: A is *exclusively* neither (a "gap").
  - **C(A) ≡ T(A) ∧ F(A)**: A is a contradiction ("glut").

  Now, define **exclusion**: "A is *not true*" as **¬*T(A) ≡ F(A) ∨ E(A)**.  
  This means "A has *no truth* component"—it’s either false-only, gappy, *or* glutty but *falsity-involving*. Crucially, ¬*T(A) doesn’t imply *everything*; it’s paraconsistently controlled.

  **Alex:** Fine, but apply this to the Strengthened Liar (SL):  
  *SL: ¬*T(SL)*  
  If SL is true, then ¬*T(SL) holds, meaning SL has *no truth*—contradiction. If SL is false (or gappy), then ¬*T(SL) is true, so SL *is* true—again contradiction! Your ¬* operator just recreates the paradox.

  **Sam:** Not if we accept that SL can be *glutty*. Suppose SL is both true *and* ¬*T(SL). This seems odd, but ¬*T(SL) means SL is *in some sense* non-true (e.g., false-involving). So:
  - *T(SL)* holds because SL correctly asserts its own non-truth-involving status.
  - *¬*T(SL)* holds because SL *is* non-truth-involving (it’s false or glutty).

  This is a *legitimate* dialetheia: SL is both true *and* (non-truth-involving).

  **Alex:** But now you’ve lost the ability to say *anything* is "just true"! Suppose I assert: "2 + 2 = 4 is *just true*" (J). If J means *T(J) ∧ ¬F(J) ∧ ¬C(J)*, then I can build:  
  *SL_J: ¬*T(SL_J) ∨ ¬J*  
  "This sentence is either non-truth-involving or J is false." If J is just true, SL_J must be non-truth-involving—but then it’s *true* that it’s non-truth-involving, so SL_J is true, implying ¬J! Your "just true" claims self-destruct.

  **Sam:** Ah, but here’s the key: **truth is contextual**. For ordinary claims like arithmetic, exclusion (¬F) is *default* and *stable*. We assert "2 + 2 = 4" with **exclusionary force**: it’s *not* glutty or gappy. This isn’t classical metaphysics—it’s a *pragmatic* stance grounded in how we *use* language. The Liar is a pathological outlier that forces gluts; it doesn’t infect stable domains.

  **Alex:** Pragmatism? That sounds like surrender! If exclusion is just "pragmatic," then in the *real* logic, 2 + 2 = 4 *could* be glutty—you just ignore the possibility. But the Strengthened Liar proves that *any* claim of "just truth" can be targeted. Your "exclusionary force" is a smokescreen for classical thinking.

  **Sam:** Not ignoring—*constraining* via **inclosure schemas**. Priest’s analysis shows paradoxes arise from *unrestricted* self-reference and predicate application. We block pathological sentences like SL_J by restricting truth-predication or self-reference in their construction. For "just true" claims in consistent domains, no such pathology arises. The logic *itself* marks them as safe.

  **Alex:** So dialetheism is only coherent if you *borrow* classical exclusion ("this is *not* glutty") for non-pathological cases? That’s the very "classical core" you wanted to avoid!

  **Sam:** No—it’s **emergent stability**. In consistent domains, exclusion holds *dialetheically*: F(A) is *not* just unproven but *excluded* (¬F(A) is true, and this doesn’t glitch). Classical logic is the *limiting case* of dialetheism when no gluts are present—not a separate system. We’re not smuggling; we’re generalizing.

  **Alex:** Then show me how you assert "No dialetheia exists in arithmetic" without explosion or paradox. Say **D**: "No arithmetical sentence is glutty." If D is true, great. But if D is *false*, then some arithmetical glut exists—which is fine for you. But if D is *glutty*, then it’s both true and false. But if it’s true, there are no gluts; if false, there are gluts. Contradiction!

  **Sam:** **D itself isn’t an arithmetical statement**—it’s *meta-arithmetical*. In the meta-language, we can use exclusionary negation *reflectively* to assert D as "just true" without paradox. Yes, this requires care with hierarchy, but it’s no different than classical theories avoiding Tarski’s undefinability theorem by working in meta-languages. Dialetheism handles this by allowing gluts *only* at unstable reflective levels—not in grounded mathematics.

  **Alex:** ...So you *do* need a classical meta-language to anchor the whole system.

  **Sam:** I need a *consistent* meta-language, not necessarily classical. Consistency emerges from the absence of inclosure conditions—it’s *achieved*, not assumed. The choice is: do you accept gluts where necessary (like the Liar) and contain them, or do you impose consistency everywhere and sacrifice expressive power? I choose containment.

  **Alex:** And I choose explosion over gluts—at least explosion signals an error. But I’ll grant this: you’ve shown dialetheism isn’t *trivially* self-refuting. Still, that "exclusionary force" feels like a sleight of hand.

  **Sam:** And your "explosion as error-signal" feels like surrendering to paradox. Fair enough. Another coffee?

  ---

  ### **Key Points Raised**:
  1. **The Dialetheist’s Tool**: Paraconsistent logic + exclusion operator (¬*) to isolate "just truth" without explosion.
  2. **The Escape Hatch**: Pathological sentences (Liar variants) are contained as gluts; "just truth" is stable in non-pathological domains via pragmatic/hierarchical constraints.
  3. **The Classical Pushback**: Exclusion behaves classically in consistent domains—suggesting dialetheism relies on classical fragments.
  4. **The Dialetheist’s Defense**: Exclusion is *emergent* from paraconsistent logic in consistent domains, not borrowed. Consistency is a *state*, not a presupposition.

  This mirrors real debates (e.g., Priest vs. Tennant). Dialetheism survives, but at the cost of accepting that "just truth" is domain-relative and hierarchical—a tradeoff the classical logician rejects as circular. Neither side "wins"; they prioritize different virtues: **containment of paradox** (Sam) vs. **uniform exclusion** (Alex).
