  For the reliability question, I should explore how her position changes when the predictor isn't perfect. This introduces risk that might undermine the rationality of adopting the disposition.

  For the counterexample question, I need to ask what evidence would falsify her view. This tests how robust her theory is and whether it's falsifiable.

  I'll aim for 8-10 questions total. I'll make sure they're philosophically rigorous but accessible enough for a job talk context. The tone should be professional but challenging, helping the committee assess the candidate's thinking.
answer: |-
  Here are eight rigorous hiring-committee questions with follow-ups designed to push the candidate beyond their "non-separability" response and probe the deeper commitments and vulnerabilities of their Parfitian "rational irrationality" thesis:

  1.  **Question:** You argue that the act of paying in town *is* irrational when performed (instrumentally worse than not paying), yet adopting the *disposition* to pay is rational. Doesn't this imply a fundamental disconnect between the rationality of character planning and the rationality of action execution? How can a theory of rationality simultaneously endorse a plan and condemn its crucial, intended execution?
      *   **Likely Answer:** (Reiterates non-separability; the rationality of the disposition justifies the plan, and the isolated act's irrationality is irrelevant/misleading).
      *   **Follow-up:** Granting non-separability, doesn't this "disconnect" create a problematic *akrasia* at the level of rationality itself? If rationality demands I adopt a disposition that *guarantees* I will later perform an irrational act (by the theory's own lights), isn't rationality demanding I become systematically practically irrational in specific future moments? How is this stable?

  2.  **Question:** Gauthier's constrained maximization (CM) argues that *keeping* the agreement in town *is* rational (due to the benefits of being a CM agent). McClennen's resolute choice denies the act needs separate evaluation, viewing it as the rational execution of the *prior* rational plan. Both avoid calling the momentary act "irrational." What unique explanatory or normative advantage does your view gain by *insisting* the momentary act *is* irrational?
      *   **Likely Answer:** (Argues it better captures the intuitive conflict/weirdness in Parfit's Hitchhiker; highlights the true cost of the commitment; avoids "changing the definition" of rationality at t2 like Gauthier or "ignoring" the act's properties like resolute choice).
      *   **Follow-up:** But if your core argument relies on non-separability *just like* resolute choice (albeit reaching a different conclusion about the act's status), and Gauthier also integrates the disposition's value, isn't calling the act "irrational" merely a *rhetorical* or *terminological* difference rather than a substantive theoretical advantage? Does insisting on the act's irrationality actually *explain* anything *more* than these alternatives?

  3.  **Question:** Your thesis relies heavily on the driver being a *perfect* predictor/believer. What happens if we relax this to the more realistic scenario where the driver is merely a *highly reliable* predictor (say, 95% accurate)? Does adopting the disposition to pay remain rational?
      *   **Likely Answer:** (Probably argues it remains rational if the reliability is high enough, weighing the expected benefits of life-saving against the near-certain cost of paying).
      *   **Follow-up:** Doesn't this introduce a crucial difference? In the perfect predictor case, adopting the disposition *logically necessitates* the irrational act. In the reliable predictor case, adopting the disposition only makes the irrational act *probable*. Doesn't this fundamentally change the structure? Is the "rationality" of adopting the disposition now contingent on *probabilistic calculation* rather than a deep conceptual point about plans and non-separability? Does this undermine the core "rational irrationality" paradox?

  4.  **Question:** You claim the disposition is rational *because* it's part of the best overall plan (life-saving + paying). But what constitutes the "plan" here? Is it merely the *intention* formed in the desert? Or does it require a specific, causally effective psychological mechanism *making* you pay in town (e.g., cultivating an irrational aversion to breaking promises)?
      *   **Likely Answer:** (Emphasizes the need for a reliable disposition/mechanism to ensure follow-through, likely involving some form of self-binding or cultivated irrationality).
      *   **Follow-up:** If the plan *requires* cultivating an *irrational* psychological mechanism to be effective, doesn't this mean the *means* of the plan (the disposition) itself incorporates irrationality? How can a plan whose successful execution *depends* on embedding irrationality into the agent's psychology be considered *wholly* rational? Isn't the plan itself "rationally tainted"?

  5.  **Question:** Consider a modified "Pre-Committed Hitchhiker": Using futuristic tech, you can *irrevocably pre-commit* in the desert to paying upon arrival. This pre-commitment makes the driver pick you up. Arriving in town, the payment happens automatically. Is the *act* of paying (now automatic) irrational? Was the *act* of pre-committing rational?
      *   **Likely Answer:** (Pre-commitment was rational; the automatic payment isn't really an "act" open to rational evaluation at t2, or if it is, it's irrational but irrelevant due to the prior rational commitment).
      *   **Followup:** Doesn't this case expose a tension? If the automatic payment isn't a genuine act, your view avoids calling *any* act irrational. If it *is* an act deemed irrational, we have a rational act (pre-commitment) causing an irrational outcome/act. How does this differ from the original case where *you* are the mechanism? Does your view imply that true "rational irrationality" only arises when the *agent themselves* must *perform* the irrational act as a result of their own prior rational disposition?

  6.  **Question:** Could your view be exploited? Imagine "Parfit's Blackmailer": They will release damaging info unless you *now* cultivate a disposition to irrationally pay them $1 million next week when it gains you nothing. Is cultivating *this* disposition rational?
      *   **Likely Answer:** (Likely argues "No," because the *content* of the disposition/plan matters; the original Hitchhiker plan has a massive net benefit, this one has a net cost).
      *   **Follow-up:** But doesn't this mean the rationality of adopting *any* disposition to perform a future irrational act is *entirely contingent* on the *contingent net benefits* of the specific plan? Doesn't this reduce "rational irrationality" to a fancy label for "adopting beneficial self-binding mechanisms," where the "irrationality" of the future act becomes almost an incidental, theoretically unimportant byproduct? What work is "irrationality" doing here beyond signaling a local instrumental failure?

  7.  **Question:** How does your view handle iterated or sequential versions? Imagine "Parfit's Recurring Hitchhiker": You know you'll face structurally identical desert crossings weekly. Is it rational to adopt a *standing* disposition to always pay? What happens in Week 100 when you arrive safely – is paying still irrational?
      *   **Likely Answer:** (Adopting the standing disposition is rational due to the life-saving benefits over time; paying in Week 100 is still irrational when performed).
      *   **Follow-up:** Doesn't iteration exacerbate the problem? Now rationality demands you adopt a disposition guaranteeing you will perform *countless* irrational acts. Doesn't this make the "rational disposition" functionally equivalent to *being an irrational agent* in these specific interactions? Can a theory coherently label an agent "rational overall" while conceding they are systematically irrational in a frequent, predictable class of actions?

  8.  **Question (Closing - Counterexample):** By your own lights, what would constitute a *genuine counterexample* to your thesis of rational irrationality in the Hitchhiker case? What specific scenario or argument, if demonstrated, would force you to concede that either (a) paying in town *is* rational, or (b) adopting the disposition to pay is *irrational*, or (c) the very concept is incoherent?
      *   **Likely Answer:** (May struggle; might suggest scenarios where the predictor is unreliable, the costs/benefits are marginal, or where alternative mechanisms without irrationality exist; might argue the core insight is robust within its idealized assumptions).
      *   **Follow-up:** If the core thesis is only demonstrably "rational" under conditions of perfect prediction, absolute certainty, and no alternative rational strategies (like pre-commitment devices), doesn't this severely limit its practical relevance and theoretical scope? Does the need for such stringent conditions suggest the "rational irrationality" is more of a paradoxical artifact of idealization than a robust feature of practical rationality?

  These questions force the candidate to:
  *   Confront the internal tension between endorsing a disposition and condemning its output.
  *   Defend the *necessity* and *utility* of labeling the act irrational compared to rivals.
  *   Grapple with realistic uncertainty (imperfect predictors).
  *   Define the nature of the "plan" and "disposition" precisely.
  *   Consider variations (pre-commitment, blackmail, iteration) that test the boundaries.
  *   Ultimately articulate the falsifiability conditions of their own view.

  The follow-ups are specifically designed to prevent retreat into the "non-separability" mantra and push towards the underlying commitments and potential weaknesses of the position.
