answer: |-
  Your interpretation of Anscombe's core argument is fundamentally sound—proportionality failure is indeed central to her condemnation of Truman—but your TA's unease likely stems from an oversimplification. Anscombe doesn't *only* argue that the civilian deaths were disproportionate; she argues that the scale and nature of the destruction **reveal that civilians were not merely collateral damage but were themselves the intended instrument of victory**, thus violating the *intention* condition of Double Effect (DE). Proportionality failure is the glaring symptom proving the violation of the core prohibition on targeting non-combatants.

  Here's how to refine your framing and address your requests:

  **Refined Framing for Lecture (Addressing TA's Concern):**
  "Anscombe's condemnation hinges on the Double Effect doctrine's core principles: you cannot *intend* the death of innocents as an end or a means. While proportionality assesses the *foreseen but unintended* side-effects, the sheer, overwhelming scale of civilian death and suffering in Hiroshima and Nagasaki—orders of magnitude greater than any conceivable immediate military advantage—demonstrates that the civilian population *itself* was the direct instrument chosen to break Japan's will. This wasn't disproportionate *collateral damage*; it was the *intended mechanism of victory*. The failure of proportionality isn't just a separate condition failing; it's the proof that the *intention* condition was violated. Truman didn't *foresee* massive civilian death as an unfortunate by-product; he *chose* it as the decisive weapon. That, for Anscombe, is murder."

  **Discussion Question: The Proportionality Threshold & Hiroshima/Nagasaki**

  **Question:** Let's dissect Anscombe's proportionality argument against the atomic bombings using the DE framework. We grant, for argument's sake, the *military objective*: forcing Japan's swift surrender to avoid a costly invasion (Operation Downfall).
  1.  **Identify Military Value:** What was the *immediate, concrete* military value potentially gained by destroying Hiroshima (Aug 6) and Nagasaki (Aug 9)? Consider key factories, troop concentrations, command centers *within* those cities. How does this value compare to the scale of destruction needed to achieve it? (Prompt: Think about conventional bombing alternatives).
  2.  **Assess Civilian Harm:** What was the nature and scale of the civilian harm? (Deaths: ~70,000-146,000 in Hiroshima; ~60,000-80,000 in Nagasaki by end of 1945; immense suffering, long-term radiation effects, city obliteration). Crucially, *why* were these civilians present? (Answer: They were non-combatants living in cities).
  3.  **Proportionality Judgement:** Can the civilian harm described in (2) be considered *proportionate* to the military advantage described in (1)? Why or why not? What specific factors make the scale seem grossly disproportionate? (Prompt: Consider the *directness* of the harm to civilians vs. the *indirectness* of the claimed military benefit related to surrender).
  4.  **The Threshold Test:** Anscombe implies no conceivable military advantage could justify *this* level of civilian destruction. Is she arguing there's a *quantitative* threshold (e.g., X civilians killed per Y military objective)? Or is it more about the *qualitative* nature of using *city-destruction and mass civilian death itself* as the primary weapon? Does the bombing of Nagasaki *just three days after Hiroshima*, before Japan could fully process the first event, impact this proportionality assessment?
  5.  **Intention Revealed:** How does the conclusion of *gross* disproportionality in (3) and (4) lead Anscombe to argue that the civilian deaths weren't just a foreseen side-effect, but were *intended as the means* to shock Japan into surrender? (Key: If the means chosen *is* mass civilian destruction, and that destruction is the mechanism for achieving the end, you intend it as a means).

  **This question forces students to confront:** The difficulty of quantifying proportionality, the shift from "collateral damage" to "civilian destruction as weapon," and how disproportionality serves as evidence of illicit intention.

  **Extending the Argument to Nuclear Deterrence & Countervalue Targeting**

  Applying Anscombe's principles to nuclear deterrence (threatening civilian destruction to prevent attack) makes it look *more* morally problematic than the Hiroshima/Nagasaki bombings, not less. Here’s the sketch:

  1.  **The Core of Deterrence (Countervalue):** Deterrence relies on the *threat* of Massive Retaliation (MR) – explicitly targeting the adversary's cities and civilian population ("countervalue") to inflict unacceptable damage, thereby preventing an attack. The *effectiveness* of the threat depends on its credibility: the adversary must believe you *will* carry out MR if attacked.
  2.  **Anscombe's Principle Applied to Intentions:** Anscombe ("War and Murder") argues forcefully that *intending* evil (like murdering innocents) is always wrong, even if you don't act on it. Forming the *conditional intention* ("I will murder millions of innocents *if* you attack me") is itself a gravely immoral act. It corrupts the will.
      *   *"With regard to many actions, it is not possible to determine that they are intrinsically evil, unless one has already decided that a *conditional intention* of doing something evil is itself evil. But that is a decision which... seems obviously right."* (War and Murder)
  3.  **Threatening vs. Doing:** While actually *executing* a countervalue strike (like Hiroshima/Nagasaki) is mass murder, *threatening* to do it involves:
      *   **Explicitly Forming the Intention:** Deterrence requires *actively forming and maintaining* the conditional intention to murder innocents. This is a *present, ongoing* evil state of will, distinct from foreseeing a tragic possibility.
      *   **Making the Threat Credible:** This requires constant preparation, deployment, targeting, exercises, and declarations demonstrating *willingness* to carry out the mass murder. This institutionalizes and normalizes the illicit intention.
      *   **The Object is the Threat Itself:** The *deterrent effect* depends entirely on the adversary believing you *intend* to murder their civilians. The threat *is* the weapon.
  4.  **Proportionality's Irrelevance:** DE's proportionality condition assesses *foreseen side-effects*. Countervalue targeting has *no* "side-effects" – the mass civilian destruction *is* the primary, direct, and intended effect of the threatened action. Proportionality doesn't apply because the core prohibition (intending innocent death as a means/end) is already violated by the threat itself. You can't justify *intending* mass murder by saying it prevents war; the end doesn't justify the (intended) means.
  5.  **Why It's Potentially Worse:**
      *   **Premeditation & Permanence:** Deterrence isn't a desperate wartime decision; it's a cold, calculated, *permanent* policy of professing a willingness to commit mass murder.
      *   **Institutionalization:** It embeds the illicit intention into national strategy, military doctrine, and command structures.
      *   **Corruption:** Maintaining the threat requires cultivating a willingness to commit the act, potentially corrupting the moral character of leaders and citizens who accept it as necessary. Anscombe feared this normalization of evil.
      *   **No "Last Resort":** The threat exists constantly, not as a last resort in an ongoing conflict.

  **Argument Sketch for Lecture (Deterrence):**
  "Extending Anscombe's logic, nuclear deterrence based on countervalue targeting is morally *more* reprehensible than the atomic bombings. Why?
  1.  **The Bombings (Condemned):** Involved *executing* an attack where mass civilian death was the intended means (thus murder). *Intention formed and acted upon.*
  2.  **Deterrence (Potentially Worse):** Involves *actively forming and maintaining the conditional intention* to murder innocents ("We *will* destroy your cities if you attack"). This conditional intention *is itself* a gravely immoral act for Anscombe – it corrupts the will *now*.
  3.  **Threat Requires Intention:** The deterrent threat *only works* if the intention to massacre civilians is real and credible. This requires constant preparation and signaling of that murderous intent.
  4.  **Beyond Proportionality:** Proportionality assesses unintended side-effects. Countervalue targeting *intends* civilian destruction as the very mechanism of the threat. The core DE prohibition is violated by the *policy itself*, regardless of whether the bombs are ever dropped. Maintaining this threat institutionalizes a willingness to commit mass murder as state policy."

  This extension forces students to grapple with Anscombe's stringent view on the morality of *intention* itself, even conditional intention, and how deterrence policy embodies the very willingness to commit the mass murder she condemned in Truman. It highlights the profound moral cost of "successful" deterrence. Good luck with the lecture!
