  Now, assessing who has the stronger reading at each step:
  - Mara's first point is strong, correctly citing Aquinas on public vs. private action.
  - Dev's institutional role argument is weaker; Aquinas emphasizes collectivity.
  - Mara's rebuttal about judgment bias is solid, reinforcing Aquinas's caution.
  - Dev's self-defeating point is strong as a critique but weak as an interpretation, since Aquinas might not have a solution within his framework.

