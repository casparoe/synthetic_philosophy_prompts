  Mara responds that Aquinas's worry is about biased judgment. Allowing one councilor to act alone risks usurpation disguised as liberation. This aligns with Aquinas's concerns about individual actions leading to further tyranny. Mara's point here is strong because Aquinas explicitly warns against private judgment in such matters.

