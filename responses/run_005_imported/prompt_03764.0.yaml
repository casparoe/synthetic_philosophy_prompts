  Okay, the user writes historical fiction and has a chapter where a lord assassinates a duke, calling him a tyrant and justifying it with Aquinas. Two friends, Mara and Dev, debated whether the speech holds up based on medieval political theory. The user wants a third opinion on their exchange, not just who won, but a move-by-move analysis of who has the stronger reading of Aquinas at each step and what both might be missing.

  First, I need to recall Aquinas's position on tyranny and resistance. In his work, especially in *De Regno* and the *Summa Theologiae*, Aquinas distinguishes between a tyrant without title (usurper) and a tyrant by practice (legitimate ruler who becomes oppressive). For the latter, he emphasizes that resistance should come from public authority, not private individuals, to avoid chaos and biased judgment.

  Mara's initial point is that the lord misuses Aquinas because the duke inherited lawfully and only became tyrannical in rule. Aquinas restricts killing such rulers to the community acting through proper public authority, not a private person. This seems solid based on Aquinas's texts. He was wary of individuals taking action due to personal grievances, which could lead to anarchy.

