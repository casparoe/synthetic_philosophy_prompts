answer: |-
  Here’s a eulogy that honors Mimi’s rules while offering warmth and resonance for both audiences. It translates Neurath’s principles into accessible human terms, integrates her chart, and embodies "pictures unite" through its structure:

  ---

  **For Mimi**  
  (5-Minute Eulogy)

  Good morning. Mimi left very clear instructions for today. She was precise that way. She asked us not to say she’s "watching over us" or that her "spirit continues." Not because she lacked love, but because she believed deeply in saying things that could be *checked*. If you can’t point to it, she felt, it doesn’t help us build shared understanding. She built her life on that idea.

  She also asked us to avoid what she called "Ballung eulogy-speak" – those big, fuzzy phrases like "she touched so many lives" that sound meaningful but are impossible to measure. Mimi dealt in what could be *seen* and *counted*. So, in her own Isotype style, she left us a chart. A picture of her life, built from rows of identical icons. No resizing, no embellishment. Just the facts, clear enough for a stranger to understand:

  *   **This many years married:** [Number] years. One icon for each.
  *   **This many grandchildren:** [Number]. One icon each.
  *   **This many picture-books published:** [Number]. One icon each.
  *   **This many languages they reached children in:** [Number] languages. One icon each.

  *(Hold up the chart, or gesture to a projection. Pause briefly, letting the visual speak.)*

  *That* is how Mimi wanted to be seen. Not through vague praise, but through what she made, what she built, what she connected. Each of those little icons? It represents countless hours of work. It represents a statistic made clear, a complex idea about health or society turned into something a child could grasp. It represents a textbook opened in a classroom far away, a vaccination campaign understood, a life potentially changed because a picture *united* understanding across languages and cultures. She didn’t just *touch* lives; she created tools that *shaped* them, tools we can point to.

  She often talked about Otto Neurath’s boat. You never get to climb off the boat of knowledge or society, she’d say, and rebuild it perfectly from scratch on dry land. You have to repair it plank by plank, while everyone’s still standing on it, using the best materials you have *right now*. That’s how she saw her work: replacing confusion with clarity, one chart at a time. That’s how she lived her life, too: steadily, reliably, improving the structure we all stand on. Her marriage, her family, her books – each was a strong plank added, carefully measured and fitted.

  *(Address the room directly)*

  For those who knew her best, you saw her wit – like her chuckle about my never-ending dissertation on the Vienna Circle. For those who knew her work, you saw a master transformer, carrying forward Marie and Otto’s vision with rigorous clarity. For everyone here, the chart shows what unites us in knowing her: the concrete reality of her time with [Husband's Name], the presence of her grandchildren, the reach of her books.

  Mimi believed a picture unites, while words often divide. So today, instead of my words *about* her, we’ve let *her* picture speak. It shows her life not as a fading light, but as a series of clear, countable connections made. The boat keeps sailing. We’re all still standing on it. And the planks Mimi added – through her love, her work, and her relentless clarity – they remain under our feet, solid and verifiable. That was her craft. That is her legacy. Let’s remember her by continuing to build, clearly and carefully, just as she did.

  ---

  **Why this works:**

  1.  **Honors Her Rules Explicitly:** Directly addresses the ban on spiritual continuance and "Ballung" speech, explaining the *why* (building shared understanding, verifiability) in simple terms.
  2.  **Integrates the Chart Authentically:** Makes the chart the factual core of the eulogy, "read into the record" as she requested. Presenting it visually fulfills "a picture unites," even within a spoken word context. The description uses her language ("one icon each").
  3.  **Translates Physicalism & Neurath for All:**
      *   Uses "pointed to," "checked," "measured," "counted," "concrete reality" instead of jargon.
      *   Explains the *purpose* of her philosophy (building shared understanding, clarity) in human terms relevant to loss (clarity in grief).
      *   Uses the boat metaphor *as* the metaphor for her life and legacy, showing its relevance beyond protocol sentences. "Planks added" becomes a tangible legacy.
  4.  **Provides Comfort Without Violations:**
      *   Focuses on the *enduring impact* of her verifiable actions (books published, languages reached, marriage, grandchildren) – "they remain under our feet, solid and verifiable."
      *   Shifts from "loss" to "continuation" via the boat metaphor and the ongoing value of her work/love.
      *   Acknowledges relationships ("her time with [Husband]", "grandchildren," "those who knew her best/who knew her work") as concrete facts.
  5.  **Embodying "Pictures Unite, Words Divide":**
      *   **Structure:** The eulogy *itself* mimics Isotype. It presents distinct, repeated "units" of information: Rule 1 explained, Rule 2 explained, The Chart Presented (with specific rows listed), The Boat Metaphor Applied, Direct Address to Groups, The Legacy (Enduring Planks). Clear, separated points, building a whole.
      *   **Content:** The chart *is* the unifying element. It provides the objective data everyone can agree on, regardless of their relationship to her or Neurath. The eulogy hinges on explaining *that*.
      *   **Action:** Physically showing the chart (if possible) or describing its components visually makes the audience engage with the *picture* as the primary source.
  6.  **Resonates with Dual Audience:**
      *   **Family/Neighbors:** Understands the rules as "Mimi being Mimi," sees her love and life quantified meaningfully in the chart, connects with the boat metaphor as a life well-lived, appreciates the mention of her humor and relationships.
      *   **Academics/Colleagues:** Sees meticulous adherence to Neurathian principles (physicalism, anti-metaphysics, protocol sentences ~ chart data, unity of science ~ Isotype), correct use of "Ballung," deep understanding of the boat metaphor, and a eulogy structure that *enacts* Isotype thinking. They'll recognize the profound tribute within the constraints.
  7.  **Personal Touch:** Includes the specific anecdote about her laughing at the Vienna Circle dissertation, grounding it in her personality and your relationship.
  8.  **"Moving" Within Bounds:** The emotion comes from respect for her clarity, the weight of the tangible legacy (the chart, the boat's planks), and the quiet call to continue her work of careful building. It's moving in its authenticity and rigor, not sentimentality.

  Deliver it calmly, with respect and perhaps a touch of wry affection when mentioning her rules or humor. Pause meaningfully when presenting the chart data. This eulogy *is* building the boat plank by plank, using the materials she provided.
