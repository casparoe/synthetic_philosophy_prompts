  ## Dan & Priya's Wedding Speech: The Stars in Your Pocket

  Okay. Deep breath. Hi everyone. For those who don’t know me, I’m Dan’s slightly bewildered sibling who, through a complex series of events involving misplaced RSVPs and possibly a lost bet, has ended up with the microphone. And Dan, relax. I promise I won’t mention soulmates, cosmic destiny, or the universe conspiring. Mostly because I know you’d rather swim in that river Frank Ramsey did than hear that. Which, actually, is my awkward segue.

  See, a few months ago, Dan was deep down a math rabbit hole – something about parties, friends, strangers, Ramsey numbers… (Dan’s friends, you know the one). Trying to be a supportive sibling, I Googled it. And instead of finding out why six people guarantee awkwardness, I fell into the life of Frank Ramsey himself. Cambridge genius. Philosopher, mathematician, economist. Invented entire fields before most of us figure out laundry. Died tragically young. Buried in the details of his short, brilliant life was this essay called "Epilogue."

  And there’s a bit near the end that hasn’t left me. Ramsey basically said: sure, the universe is unimaginably huge. Stars are vast, cold, and ancient. But so what? Size isn’t the kind of thing that *should* humble us. Stars can’t think. They can’t love. They don’t write bad poetry or remember your birthday. Why should their sheer bigness make *us* feel small? He painted this incredible picture: his view of the world wasn't drawn to scale. It was drawn in *perspective*. Actual, living, breathing people – you, me, the guy nervously checking his watch right now – we’re huge, right here in the foreground. And the stars? He shrunk them down. Way down. Said they were about the size of… well, he said "threepenny bits." (Had to look that up too – basically, tiny old coins).

  *(Hold up a small coin if you have one handy, or just gesture)* About *this* big. Insignificant little discs in the vast painting where *we* are the giants. Because *we* are the things that matter. We feel, we think, we connect. The universe isn't diminished by this; our significance is just… correctly calibrated.

  Now, Dan… *(turn to Dan)* …my brilliant, occasionally brooding brother. You’ve had your share of late nights staring at the ceiling, grappling with that vastness, the cold equations, the sheer scale of time and space that can make everything feel… well, like a threepenny bit. I’ve been there for some of those 1 am spirals. "Nothing matters, it’s all pointless, entropy wins!" Classic Dan.

  *(Turn to Priya)* And then there’s Priya. Priya, you didn’t need to read Frank Ramsey. You didn’t need a Cambridge philosopher to tell you about perspective. You just… *get it*. You always have. When Dan starts mentally calculating the heat death of the universe, you don’t argue the physics. You don’t try to out-brood him. You simply, consistently, gently, bring him back. Back to the foreground. Back to *now*. Back to the things that are huge and warm and real: a shared joke, a stupid meme, a quiet moment, the simple, undeniable goodness of *this*, right here. You are the living embodiment of Ramsey’s point. You look at Dan, not past him at the stars. You see the giant in the foreground.

  And Ramsey, being the economist he also was, couldn’t resist applying the same logic to *time*. Sure, he said, the universe will eventually wind down. Everything ends. But that ending is so fantastically far away, its "present value at compound discount" is basically… nothing. Zero. Nada. *(Pause, wink at any finance folks)* Worth less than a threepenny bit *today*. So why let that distant, discounted nothingness cast a shadow on the vibrant, valuable *now*?

  It’s funny – I learned he later wrote a paper calling that kind of future discounting "ethically indefensible"! Talk about complicated. But in that moment, facing the abyss with a philosopher’s clarity and an economist’s dark humor, he nailed it. The far future *doesn't* devalue the present. If anything, its irrelevance makes the present *more* precious.

  Dan, that’s what today is about. It’s not about defying the universe. It’s not about cosmic significance written in the stars. It’s about declaring, loudly and joyfully, that the foreground is *everything*. That the love you two share, the life you’re building right here, right now, is the biggest, brightest, most significant thing in *your* world. Priya, you’ve always reminded Dan of that truth. Today, you’re both making it official.

  So, let the stars be tiny coins. Let the distant future run its discounted course. Right here, in this vibrant foreground, you’ve found something enormous: each other. You’ve chosen to be giants in each other’s picture, filling the frame with warmth, laughter, arguments about the thermostat, and a love that makes the vast, cold universe feel… well, perfectly, comfortably, coin-sized.

  Let’s raise a glass. Not to fate, or the stars aligning, but to Dan and Priya. To choosing the foreground. To the immense, beautiful significance of right here, right now. To love that makes us the biggest things in each other’s universe. Cheers!

  **Word Count:** Approx. 680 words (perfect for 5 minutes with pauses).  
  **Tone Check:** Warm, personal, avoids clichés, sneaks in depth without lecture, humor lands for multiple audiences.  
  **Inside Jokes:** Ramsey reference clear to Dan's friends, "compound discount" wink for finance folks, "threepenny bit" explained lightly.  
  **Emotional Core:** Priya as the grounding force, Dan's growth, love as defiance *not* of physics, but of despair.  
  **Great-Aunt Approved:** Stars = small, love = big = happy tears!
