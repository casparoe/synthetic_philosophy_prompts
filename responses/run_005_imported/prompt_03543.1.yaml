answer: |-
  You've articulated the causal exclusion problem brilliantly—it's one of the most persistent challenges in philosophy of mind. Kim's argument *is* powerful, but your conclusion that mental states "never really cause anything" goes further than most philosophers (including Kim) accept. Here's where the nuances lie, and why psychology remains unscathed:

  ### 1. **The Argument's Target & Scope**
     - **What it challenges**: Kim targets *non-reductive physicalism* (the view that mental states are real but not reducible to physical states). If mental states are genuinely distinct from physical brain states, their causal power seems excluded.
     - **What it doesn't challenge**:
       - **Reductive physicalism**: If mental states *are identical* to physical states (e.g., "pain *is* C-fiber firing"), mental causation reduces to physical causation. Kim later endorsed this view ("functional reductionism").
       - **Eliminativism**: If mental states don't exist (only brain states do), exclusion doesn't arise—but this rejects everyday psychology entirely.
       - **Dualism**: If minds are non-physical, physical closure might be false—but this faces other severe problems.

  ### 2. **Where Your Strong Conclusion May Overreach**
     - **Explanatory vs. Ontological Causation**: Even if neural states "do the work," mental descriptions capture *patterns* that physical descriptions miss. Saying "she left due to betrayal" explains *why* those neural events occurred in a way physics cannot. This explanatory power isn't "fictional"—it tracks real, higher-order regularities.
     - **The Overdetermination Dilemma Isn't Inevitable**: If mental states *supervene* on physical states (i.e., no mental change without physical change), they aren't "independent causes." Mental causation may be a *mediated* form of physical causation (like software causing a computer to crash: it’s silicon doing the work, but the program is causally relevant).
     - **Kim's Own Solution**: Kim proposed that mental states can cause things *if* they are reducible to physical mechanisms (e.g., "pain" is defined by its causal role, which is filled by a specific neural state). This preserves mental causation within physical closure.

  ### 3. **Why Psychology Ignores This Problem**
     - **Different Explanatory Projects**: 
       - **Physics** explains *how* events occur via fundamental laws.
       - **Psychology** explains *why* behaviors occur in terms of goals, beliefs, and emotions. These explanations are:
         - **Predictive**: "She felt betrayed" predicts future actions (e.g., avoidance) better than neurochemical descriptions.
         - **Interventionist**: Therapy changes behavior by addressing beliefs—not neurons directly.
       - **Autonomy of Special Sciences**: Geology, biology, and psychology use their own vocabularies because they track causal patterns irrelevant to physics (e.g., "recession caused unemployment" remains valid, even though quantum particles "do the work").
     - **Efficacy Without Fundamentality**: Mental states can be causally effective *in virtue* of physical implementation. Your coffee cup’s shape causes it to hold liquid, even though its causal power supervenes on its physical structure. Similarly, a belief can cause action *because* it is realized physically.

  ### 4. **Responses to Causal Exclusion**
     - **Compatibilist Strategies**:
       - **Realization-Based Causation**: Mental states cause effects *as* aspects of their realizing physical states (Shoemaker, Yablo).
       - **Difference-Making**: Mental states are *counterfactually necessary* for actions (e.g., without the belief, the action wouldn’t occur)—even if physically realized (List & Menzies).
       - **Emergent Causation**: Some argue higher-level properties (e.g., consciousness) have novel causal powers (though controversial).
     - **Rejecting Physical Causal Closure**: A minority (e.g., emergentists) argue physics isn't causally closed—but this requires radical metaphysics.

  ### The Pragmatic Upshot
  When we say "she left because she felt betrayed," we’re:
  - **Correct** at the psychological level: The betrayal *explains* her action in terms of reasons.
  - **Compatible with physicalism**: This explanation doesn't contradict neuroscience; it operates at a different level of abstraction.
  - **Irreplaceable**: Neurochemistry can't provide this insight—knowing her amygdala fired explains nothing about *why* she left.

  **In short**: Kim’s argument exposes a genuine tension for *non-reductive* views of mind, but it doesn’t prove mental states are causally inert. Instead, it forces us to clarify *how* they fit into a physical world. Psychology persists because its explanations are robustly useful, capturing causal relationships invisible to physics. The fact that brain chemistry "does the work" doesn't make the mental description false—it just shows causation is layered. 

  If this still feels unresolved, you're in good company—this debate remains live in philosophy. I recommend Kim's *Physicalism, or Something Near Enough* (2005) for his mature view, and Karen Bennett's "Exclusion Again" (2008) for a compatibilist response. Your unease reflects the argument’s enduring bite!
