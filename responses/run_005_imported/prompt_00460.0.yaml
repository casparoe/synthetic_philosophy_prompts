  So I spent decades running spectroscopy experiments, and it still bugs me that Bohmian mechanics and Copenhagen fit all the same data but tell completely different stories about what's "really" happening at the quantum level. Could you write me a dialogue between a scientific realist and a constructive empiricist -- old colleagues from the same lab, now arguing it out over coffee -- about whether this kind of underdetermination means we should just give up asking what's actually going on, or whether theres some other way to break the tie. Neither one should fold easy, I want to see them actually engage with each others strongest points, not just repeat themselves.
