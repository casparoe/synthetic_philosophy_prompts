  6. **Full subjectivist shrug**: This accepts that there is no objective prior and that probabilities in such cases are subjective. The paradox then becomes a non-issue because the choice of parameterization is a matter of personal judgment. This approach completely sidesteps the quest for objectivity and thus doesn't resolve the core issue of whether objective probabilities can be assigned in such cases. It engages by denying the premise of objectivity.

