  My friend and I got into a whole argument over this last night and I need a tiebreaker. Say your car breaks down on some empty road at 1am and a guy in a pickup truck stops to help. He agrees to tow you to the next town, but you're out of cash and your card won't work until you're back near civilization, so you promise to pay him $300 once you can get to an ATM. He looks hesitant and says "I'm only doing this because you seem like someone who'd actually pay me back," then tows you anyway. Once your safely in town with the money in hand, my friend says the smart move is to just thank the guy and leave — the tow already happened, he has no way to make you pay, and theres no reputation on the line either way since you'll never see him again. I said that felt obviously wrong but couldn't say why beyond "that's just a shitty thing to do." Is my friend actually right that ditching the guy is the rational move here, or is he missing something?
