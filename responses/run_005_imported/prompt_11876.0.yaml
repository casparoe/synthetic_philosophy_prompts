prompt: |-
  I've been down a YouTube rabbit hole on superdeterminism lately (mostly Sabine Hossenfelder's videos) and I can't decide if its a genuinely serious way out of Bell's theorem or just a cheat code physicists use to keep locality intact. From what I understand, the trick is to give up on the assumption that the settings an experimenter picks are independent from whatever hidden stuff is determining the particles, so you don't need any spooky nonlocal influence to explain the correlations. But then most other physicists seem to think thats basically saying the universe conspired since the big bang to fake the results, and that it wrecks the whole logic of doing controlled experiments in the first place. Could you write me a dialogue between a physicist defending superdeterminism and one who thinks its a dead end, maybe hashing it out after a conference talk, where they really engage with each other's strongest points instead of just repeating talking points past each other? I want both sides to be genuinely sharp, not one being a pushover for the other to knock down.
