  ### Key Insights:  
  - **Highest looping (10–8):** Hysteria, fugue, and DID score highest because their *entire phenomenology* was entangled with historical/cultural scripts—remove the label, and the "disorder" dissolves or transforms radically.  
  - **Moderate looping (7–6):** BPD and ADHD blend biological factors with self-reinforcing loops (e.g., BPD's "self-fulfilling prophecy" in relationships; ADHD's coping strategies shaped by diagnosis).  
  - **Lowest looping (4):** ASD's core traits are less mutable to social feedback, though community advocacy has shifted its cultural meaning without overriding neurobiology.  

  This aligns with Hacking’s emphasis on historical "transient mental illnesses" (hysteria, fugue) as peak examples of looping, while conditions like ASD/ADHD show weaker effects due to stronger biological constraints. Homosexuality sits uniquely as a declassified category where looping *ended* the diagnosis.
