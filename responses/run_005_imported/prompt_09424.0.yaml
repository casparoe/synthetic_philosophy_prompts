  First, I need to recall the main points of both theories. Walzer says soldiers on both sides have equal moral status because they're just following orders. McMahan disagrees, arguing that those fighting for an unjust cause don't have the same permissions. But he allows that many aren't culpable due to excuses like coercion or ignorance. The challenge is translating this into the character's internal conflict.

