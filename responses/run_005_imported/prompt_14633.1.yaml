  For the "ad hoc" concern: nope, it's motivated. The Oswald examples showcase how identical content changes truthiness based on mood because the epistemic stance changes. That's why unified accounts (like strict conditionals) fail—they can't capture this sensitivity. The two-track system isn't a patch; it's necessary.

