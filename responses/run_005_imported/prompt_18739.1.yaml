  Now, is there a mixed strategy for Player 2 that dominates C? Consider a mixed strategy that plays L and R with probabilities p and 1-p.

  The payoff of the mixed strategy against T: p*1 + (1-p)*4 = 4 - 3p
  Against M: p*0 + (1-p)*0 = 0
