  - C: (0, 0)
  - R: (4, 1)

  Now, the student says that both L and R strictly dominate C. Let's check:

  To see if L strictly dominates C: compare the payoffs of L and C for each action of Player 1.

  Against T: L gives 1, C gives 0 -> 1 > 0, so L is better.
  Against B: L gives 4, C gives 0 -> 4 > 0, so L is better.

  Similarly, R against T: 4 > 0, and against B: 1 > 0.

  Therefore, both L and R strictly dominate C. So eliminating C is correct.

  Now, the remaining game is {T, B} × {L, R}. The payoffs are:

  T: against L: (3,1), against R: (0,4) -> so for Player 1: T gives 3 (vs L) and 0 (vs R)
  B: against L: (0,4), against R: (3,1) -> for Player 1: 0 (vs L) and 3 (vs R)

  For Player 2: 
  L: against T: 1, against B: 4
  R: against T: 4, against B: 1

  The student says: "Neither row dominates the other and neither column dominates the other". 

