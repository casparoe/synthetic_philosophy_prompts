prompt: |-
  I'm on the steering committee for a small open-source proof assistant library (dependently typed, kinda Coq/Agda-ish), and we need to settle a fight before the vote next week. Half the maintainers want the core library to stay fully constructive -- no excluded middle, no choice -- so every theorem still extracts to an actual runnable program, and they worry even 'harmless' classical lemmas quietly poison extraction elsewhere in the library. The other half say that's a purity fetish: most of their proofs never get extracted anyway, case-splits on real numbers are miserable without LEM, and since double-negation translation embeds classical logic into intuitionistic logic anyway, they figure the whole fight is basically just notation. Can you draft the actual memo I'll bring to the meeting -- a real recommendation (ban classical axioms outright, allow them but walled off in there own namespace, whatever's defensible), with reasons, that takes the other side's strongest point seriously instead of just name-checking it?
reasoning: |-
  We are at a crossroads regarding the use of classical axioms (like excluded middle and choice) in our core library. Both sides have strong arguments, and we must make a decision that respects the concerns while moving the project forward.

  ### The Constructivist Argument (Ban Classical Axioms)
  - **Core Value**: The library should remain constructive so that every theorem can be extracted to runnable code. This is a unique selling point and aligns with the original vision.
  - **Poisoning Extraction**: Even if a classical lemma seems harmless, it might inadvertently make its way into a proof that is intended for extraction, breaking the computational content.
  - **Purity and Predictability**: A fully constructive core ensures that all proofs are computationally meaningful and that the library remains consistent in its foundational approach.

  ### The Pragmatist Argument (Allow Classical Axioms with Care)
  - **Practicality**: Some proofs (especially in analysis) become extremely cumbersome without classical axioms. For example, working with real numbers often requires case distinctions that are trivial with LEM but laborious without.
  - **Double-Negation Translation**: Since classical logic can be embedded into intuitionistic logic via double-negation translation, the inclusion of classical axioms is, in a sense, just a matter of convenience and notation. The core system remains constructive at its base.
  - **Selective Use**: Most proofs that are extracted for computation don't use classical axioms. The ones that do (like in the mathematical library) are typically not extracted. Therefore, we can isolate the use of classical axioms to non-extracted parts.

  ### Recommendation: Allow Classical Axioms in a Walled-Off Namespace
  After weighing both sides, I recommend a compromise: **allow classical axioms but only in a clearly marked, walled-off namespace (e.g., `Classical`)**. Here's why:

  1. **Preserves Core Constructivity**: By requiring an explicit import of the `Classical` namespace, we maintain the constructive core by default. Any proof that does not open this namespace remains constructive and extractable.
  2. **Prevents Accidental Poisoning**: The walled-off namespace ensures that classical axioms do not leak into the constructive parts. If a developer wants to use a classical lemma, they must explicitly opt-in, making it clear that the proof is not constructive. This also helps in code review to catch unintended uses.
  3. **Practical Flexibility**: It addresses the pragmatist concern by allowing classical reasoning where it is most needed (e.g., in the mathematical components) without forcing constructivity in every corner. This can make development more efficient and proofs more readable in classical domains.
  4. **Double-Negation Translation as a Fallback**: In the rare case where a classical result is needed in an extractable proof, the developer can still use the double-negation translation explicitly. However, the walled-off classical namespace provides a more convenient and readable alternative for non-extracted proofs.

  ### Implementation Details
  - **Namespace Design**: Create a `Classical` module that provides classical axioms (e.g., `lem`, `choice`) and derived lemmas. This module should not be imported by any core constructive module.
  - **Documentation**: Clearly document that any module opening `Classical` loses extractability. We should also document how to use double-negation translation for cases where classical reasoning is needed in extractable code.
  - **Build and Extraction Process**: The extraction mechanism should flag (or simply not extract) any proof that depends on the `Classical` module. This ensures that extracted code remains purely constructive.

  ### Addressing the Constructivist Concern
  The strongest constructivist point is about "poisoning" — that even one classical lemma can break extraction. Our design directly addresses this by isolating classical axioms in a namespace. Extraction tools will reject any code that depends on this namespace, so there is no risk of silent poisoning.

  ### Addressing the Pragmatist Concern
  The pragmatists want to avoid the misery of proving without classical axioms in certain domains. Our solution gives them a safe space to use classical axioms when needed, without imposing on the constructive core. Moreover, it acknowledges that double-negation translation is always available but provides a more ergonomic alternative for non-extracted proofs.

  ### Conclusion
  This approach balances both concerns: it keeps the core constructive and extractable while allowing classical reasoning in a controlled manner. It is defensible because it respects the foundational values of the project (constructivity) without sacrificing practical usability.

  I urge the committee to adopt this middle path. It is a pragmatic solution that allows the library to grow in both constructive and classical directions without forcing one methodology on all users.
answer: |-
  ### Memo: Policy on Classical Axioms in Core Library  
  **To:** Steering Committee & Maintainers  
  **From:** [Your Name], Steering Committee  
  **Date:** [Date]  
  **Subject:** Balanced Policy Recommendation for Classical Logic Axioms  

  #### **Background**  
  We face a foundational decision: whether to allow classical axioms (e.g., excluded middle, choice) in our core library. Both sides raise valid concerns:  
  - **Constructivists** argue that classical axioms break extraction guarantees and undermine the library’s core value: producing runnable code from proofs.  
  - **Pragmatists** contend that banning classical logic harms productivity in non-extracted proofs (e.g., real number theory) and that double-negation translation already "simulates" classical reasoning constructively.  

  After rigorous debate, I recommend a **compromise**: **Allow classical axioms, but isolate them in an opt-in namespace with strict extraction safeguards**. Below, I address both factions’ strongest points and outline a defensible implementation.  

  ---

  ### **1. Core Recommendation: The "Walled Garden" Approach**  
  - **Permit classical axioms** in the core library, but **confine them to a dedicated namespace** (e.g., `Classical`).  
  - **Require explicit opt-in** to this namespace in files using classical logic.  
  - **Enforce extraction guards**: The compiler will reject extraction of any code transitively depending on `Classical`.  

  #### **Why This Balance?**  
  - **Honors constructivist concerns**: Extraction purity is preserved by default. No proof outside `Classical` can be "poisoned."  
  - **Resolves pragmatist pain points**: Tedious case splits (e.g., `ℝ ≤ 0 ∨ ℝ > 0`) are tractable via `Classical.lem`, but only where explicitly opted in.  
  - **Acknowledges the "just notation" argument**: Yes, double-negation translation embeds classical logic, but forcing manual translation is needlessly hostile to users. Our solution reduces friction without breaking extraction.  

  ---

  ### **2. Addressing Constructivist Concerns**  
  *Your strongest point: "Classical axioms silently break extraction."*  
  - **Solution:** Extraction guards make contamination **impossible by design**.  
    - Example: If `Theorem A` (in `Classical`) uses LEM, and `Theorem B` (non-classical) depends on `A`, the compiler will flag `B` during extraction. No silent failures.  
  - **Preserves library ethos**: The default remains constructive. Users must explicitly choose classical reasoning, accepting the extraction tradeoff.  
  - **Mitigates "slippery slope" risk**: Isolating `Classical` prevents accidental imports. Code reviews can enforce discipline.  

  ---

  ### **3. Addressing Pragmatist Concerns**  
  *Your strongest points: "Not all proofs are extracted" and "Double-negation makes classical logic redundant."*  
  - **"Not all proofs are extracted"**: True, but we must avoid fragmenting the library. Our solution:  
    - Allow classical proofs **only in non-extracted contexts** (e.g., pure math foundations).  
    - Provide escape hatches: Use `Classical` to simplify proofs about `ℝ` or cardinality, but ban it in computation-heavy modules (e.g., algorithms).  
  - **"Double-negation is sufficient"**: While technically correct, it ignores ergonomics.  
    - Double-negation translation produces convoluted proofs (e.g., `¬¬P` everywhere). Our `Classical` namespace offers cleaner notation *without compromising the core*.  
    - Analogy: We don’t ban `Set` because it can be encoded with inductive types; we accept pragmatic conveniences.  

  ---

  ### **4. Implementation Safeguards**  
  - **Namespace isolation**:  
    ```coq
    (* File: Classical.v *)  
    Module Classical.  
      Axiom lem : ∀ P : Prop, P ∨ ¬P.  
      (* ... *)  
    End Classical.  
    ```  
  - **Extraction guard**:  
    - The compiler throws an error if extraction includes any declaration marked `[Classical]`.  
  - **Documentation mandate**:  
    - Clearly warn: "`Import Classical` forfeits extraction. Use only for non-computational proofs."  
  - **Tooling**: Add a linter to detect `Classical` in files tagged for extraction.  

  ---

  ### **5. Why Not Total Ban or Full Permissiveness?**  
  - **Total ban**: Overlooks real-world usability. It forces contortions in analysis and topology, alienating users who don’t need extraction.  
  - **Full permissiveness**: Risks mission drift. We are a dependently typed library first; extraction is a unique advantage we shouldn’t sacrifice.  
  - **Walled garden** is the Goldilocks solution: It respects both proof engineering and practical mathematics.  

  ---

  ### **6. Conclusion**  
  The `Classical` namespace is a principled compromise:  
  - **For constructivists**: It enshrines extraction purity as the default and enforceable standard.  
  - **For pragmatists**: It grants ergonomic relief where proofs aren’t extracted, without bloating the core.  

  **Move to adopt this policy** at the next vote. By isolating classical logic but not banning it, we honor our dual identity: a verification tool *and* a mathematical assistant.  

  ---  
  **Appendices**  
  - A: Draft technical spec for `Classical` namespace  
  - B: Examples comparing double-negation vs. `Classical.lem`  
  - C: Extraction guard implementation plan  

  Respectfully submitted for deliberation.
