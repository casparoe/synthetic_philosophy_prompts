  Bellarmine's leverage: Church authority and the philosophical definition of "demonstration." Galileo's leverage: His discoveries that challenged Aristotelian cosmology and the Augustinian interpretive principle. 

  The scene should end unresolved - mirroring history where Bellarmine later gave Galileo that carefully worded certificate. Neither concedes, but both state their positions clearly. 

