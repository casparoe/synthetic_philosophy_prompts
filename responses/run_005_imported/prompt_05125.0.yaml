  Let me unpack the key requirements: First, Galileo should use the Augustinian principle about scripture accommodating demonstrated truths. But Bellarmine should challenge whether Galileo actually has a demonstration (in the Aristotelian sense of necessary proof), not just a hypothesis that saves appearances like Ptolemy's epicycles. 

