  Hmm... the real crux might be whether "showing itself" survives the ladder-kicking. If all propositions are equally nonsensical, can "God does not reveal himself" (6.432) retain privileged status? Probably not—that's the user's strongest point. Yet Wittgenstein keeps writing about ethics/religion later, so something persists...

