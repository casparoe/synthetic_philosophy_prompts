answer: |-
  Here’s a rigorous defense of your friend’s position, grounded in Hacking’s core mechanics and avoiding clinical elitism. The argument hinges on **three essential elements missing from platform-driven self-diagnosis** that Hacking explicitly ties to genuine "looping":

  ### 1. **The Missing "Expert Feedback Loop": Revision Requires Institutional Dialogue**
     Hacking’s looping isn’t just "label changes person." It requires a **dialectical process**: classified individuals *alter their behavior/identity* in response to the label, *and* experts **revise the classification itself** based on observed changes. This revision isn’t passive; it’s driven by structured institutional engagement (research, clinical observation, diagnostic manuals).
     - **TikTok Contrast:** Mara and others adopt labels and behaviors, but this doesn’t systematically pressure *DSM* committees, researchers, or clinicians to redefine ADHD/autism criteria. TikTok trends might influence *cultural perceptions* or *individual clinicians*, but there’s no formal feedback channel where "Mara’s new self-understanding" compels experts to renegotiate the category’s boundaries. The diagnostic framework remains largely static, even as its popular application mutates.
     - **Hacking’s Precedent (Autism):** When Hacking discussed autistic self-advocates reshaping the category, he emphasized their role in **formal discourse** (academic journals, conferences, organized activism) that *directly engaged* with institutions. TikTok creators, however influential, operate outside this structured dialogue. Their impact is cultural diffusion, not categorical revision.

  ### 2. **The Problem of "Semantic Drift" Without Anchoring**
     Hacking worries about **semantic contagion** ("transient mental illnesses" like fugue or multiple personality disorder) precisely because meanings can fragment and amplify without grounding in a stable, interactive feedback loop. TikTok’s algorithm accelerates this:
     - **Amplification ≠ Revision:** Viral symptoms ("stimming," "executive dysfunction") become detached from diagnostic frameworks. Creators often blend clinical terms, lived experience, and cultural commentary. While validating, this morphs into a **folk taxonomy** – a shared vernacular *inspired by* clinical language but lacking its constraints. Mara isn’t interacting with "ADHD" as a clinical entity; she’s interacting with a **meme-ified shadow** of it, shaped by engagement metrics.
     - **Missing "Stabilization" Phase:** True looping involves temporary stabilization (e.g., diagnostic criteria solidify after revision). TikTok’s content cycle prevents this. Trends shift weekly; symptoms are recontextualized as aesthetics or identity markers. Mara’s "looping" lacks the **corrective friction** of expert/community debate that refines categories over time (e.g., the autism spectrum’s evolution from Kanner to Asperger to DSM-5).

  ### 3. **The Algorithm as a Disruptive "Vector," Not a Participant**
     In Hacking’s model, the "loop" requires **human agents** on both sides: classified people *and* classifiers who observe and respond. TikTok’s algorithm isn’t a participant; it’s an **amplification engine** optimizing for engagement, not accuracy or coherence.
     - **Homogenization vs. Interaction:** The algorithm creates echo chambers where Mara encounters *reinforcing* content, not challenging dialogue. This flattens diversity within ADHD/autism experiences. Contrast this with Hacking’s vision of looping, where classified individuals *surprise* experts with unexpected behaviors, forcing categorical reevaluation (e.g., 19th-century fugueurs developing elaborate travel patterns).
     - **Speed Destroys Reflection:** Hacking’s loops unfold over years/decades, allowing for observation, debate, and revision. TikTok compresses this into days. Mara’s "diagnosis" may change weekly based on trending videos. This velocity precludes the **iterative reflection** essential for looping – there’s no time for the classification or the individual to integrate and test new understandings.

  ### Why the Autism Precedent Doesn't Save TikTok Looping
     Yes, Hacking acknowledged autistic self-advocates as "experts." But note the **qualifiers**:
     - Their impact came through **curated, durable platforms** (books, essays, conferences) – not ephemeral, algorithmically mediated snippets.
     - They engaged in **deliberate, critical dialogue** with institutions (e.g., influencing DSM-5 criteria). TikTok creators, even well-intentioned ones, prioritize relatability/engagement over diagnostic rigor or categorical critique.
     - Their work constituted **collective action**, not just individual identification. Mara’s self-diagnosis is a solitary act within a crowd; she isn’t collaborating to *redefine* autism, just *adopting* a version of it.

  ### Conclusion: "Semantic Contagion" in Algorithmic Clothing
  Your friend is right: what Mara experiences is **semantic contagion amplified by platform dynamics**, not Hacking-style looping. The core mechanics are absent:
  - No **institutional feedback loop** revising classifications.
  - No **stabilized interaction** between classifiers and classified.
  - An **algorithm** replacing **dialectical human exchange**.

  This isn’t about "clinical = real, self-dx = fake." It’s about **structural differences in how categories evolve**. Mara is caught in a powerful wave of **folk phenomenology** – a shared language of self-understanding that borrows clinical aesthetics but operates by different rules. Her journey is profoundly real, but it’s a testament to **identity formation in the age of algorithmic contagion**, not the institutional co-creation Hacking described. This distinction lets you explore Mara’s authenticity *without* validating the reductive "kids these days" trope – her struggle is with the *medium* as much as the message.

  *Potential novel angle:* Highlight the tension between Mara’s genuine self-discovery and the platform’s distortion. Maybe she notices symptoms are simplified into "relatable" tropes, or she encounters creators critiquing the very trends they propagate. This preserves intellectual honesty while honoring her experience.*
