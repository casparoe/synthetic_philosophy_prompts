answer: |-
  ## MEMORANDUM  
  TO: Common Names Committee, [Society Name]  
  FROM: [Your Name], Retired Fellow & Committee Member  
  DATE: [Date]  
  SUBJECT: Proposed Framework for Evaluating Species Common Names with Potential Slur Associations  

  **1. Context & Committee Deadlock:**  
  We face a challenging task: addressing species common names containing words historically used as slurs against human groups. Our prior work (e.g., *Lymantria dispar*: Gypsy Moth -> Spongy Moth) demonstrated our commitment to inclusivity. However, the current backlog reveals a fundamental disagreement:  

  *   **Camp A (Blanket Rule):** Argues any word *ever* used as a human slur is inherently toxic and must be removed from species names, regardless of context. The *word itself* carries the harm.  
  *   **Camp B ("Just a Bug"):** Argues the harm of a slur arises *specifically* when it is *used as a weapon targeting a person or group*. Applying it to a species is a fundamentally different act, devoid of that targeting intent or impact. Removing such names is unnecessary overreach.  

  Both positions stem from valid concerns – preventing harm and upholding respect vs. avoiding linguistic over-policing and preserving established terminology without clear present harm. Our impasse suggests we need a rule grounded in a clearer understanding of *how* these words function.

  **2. Philosophical Insight: The Core Question - Inherent Meaning vs. Use:**  
  My recent explorations in philosophy of language highlight the crux of our debate:  

  *   **The Lexicalist View (Supports Camp A):** Holds that the slur's meaning (its derogatory force targeting a group) is an inherent, stable property of the *word itself*. Once established as a slur, this meaning travels with the word wherever it's used, like a stain. Calling a moth "X" inevitably evokes the slur's history and degradation of group Y, perpetuating harm passively.  
  *   **The Pragmatic View (Supports Camp B):** Argues that the slur's primary harm resides in its *use as an act* – the speaker's *intention* to demean and the *targeting* of a specific person/group. When the word "X" is applied to a *moth*, it lacks both the requisite intent (no one intends to insult Roma by naming a moth) and a viable target (a moth cannot be a Roma person). The word, in this *specific context*, may have a distinct meaning (e.g., "wanderer" for "gypsy") or be semantically inert.  

  Neither view is universally dominant in philosophy. However, practical application requires acknowledging both perspectives while seeking a workable, defensible rule.

  **3. Proposed Rule: Balancing Principles & Pragmatism**  
  Acknowledging the valid points on both sides, I propose a **Rule Based on Contemporary Primary Meaning and Direct Association** for committee vote:

  > **"The committee shall recommend changing the established common name of a species if, after review, the name contains a word that meets BOTH of the following criteria:  
  >   
  >     (a)  The word has a *primary, contemporary meaning* that is widely recognized as a slur or deeply derogatory term targeting a specific human group.  
  >     (b)  The use of the word in the species name *directly references or evokes the human group* targeted by that slur, either through historical naming rationale, obvious descriptive association, or common public perception."**  
  >   
  > **Species names containing words that fail to meet BOTH criteria (a) AND (b) shall be retained, barring other compelling non-slur-related reasons for change (e.g., taxonomic confusion, significant offense based on different grounds).**  

  **4. Rationale & Application:**  

  *   **Addresses Camp A (Harm):** Criterion (a) focuses on the *inherent toxicity* of words whose *dominant current meaning* is that of a slur. It excludes archaic slurs no longer in common use or words where the slur meaning is obscure/obsolete.  
  *   **Addresses Camp B (Context/Overreach):** Criterion (b) requires a *direct link* between the slur's target group and the species name. It prevents blanket removal of names using words that *have* slur meanings but where the species name demonstrably does *not* reference that group (e.g., a word like "spook" meaning "ghost" in a spider name, not targeting Black people; "hysterical" in a beetle name referencing ancient medical beliefs about wombs, not primarily a modern slur against women). It acknowledges that without this direct link, the harmful *pragmatic act* of targeting a human group is absent.  
  *   **Focuses on Contemporary Impact:** Prioritizes words actively recognized as harmful slurs *today*, avoiding endless archaeology of obscure insults.  
  *   **Provides Clear Test:** Requires concrete justification for change based on demonstrable meaning and association, moving beyond "feels wrong" or "has ever been used negatively."  
  *   **Examples (Illustrative):**  
      *   **Change:** "Gypsy Moth" - Met (a) "Gypsy" is a widely recognized slur for Roma. Met (b) The name directly referenced the perceived "wandering" nature of the Roma people.  
      *   **Change:** "Jew Beetle" (if such existed) - Would meet (a) & (b).  
      *   **Retain (per rule):** "Spookfish" (primarily refers to "ghostly" appearance, "spook" as a racial slur is not the primary meaning here & the fish name doesn't reference Black people).  
      *   **Retain (per rule):** "Hysterical Beetle" (name likely based on "hysteria" as a historical medical term, not primarily its modern derogatory use towards women; beetle name doesn't reference women).  
      *   **Case-by-Case:** "Crappie" fish - Requires research: Does "crap" have a *primary* meaning as a slur against Romani (unlikely today)? Does the fish name reference Romani people (no)? Likely retained per rule.  

  **5. Implementation:**  
  For each name in the backlog:  
  1.  Research the word's **primary, contemporary meanings** (dictionaries, linguistic corpora, community input).  
  2.  Research the **historical rationale and public perception** of the species name. Does it *directly* reference the human group targeted by the slur meaning?  
  3.  Apply the rule: If BOTH (a) and (b) are met, recommend change. If not, retain. Document the reasoning transparently.

  **6. Call to Action:**  
  This rule offers a principled compromise. It takes the harm of slurs seriously by removing names where the derogatory meaning is both inherent *and* activated by the naming context. It also respects the "just a bug" concern by recognizing that words can have multiple meanings and that harm requires a tangible link to the targeted human group. It provides the clear, non-arbitrary standard we need.  

  **I move that the Common Names Committee vote to adopt the above-proposed rule as our formal framework for evaluating species common names containing words with potential slur associations.**  

  Respectfully submitted,  
  [Your Name]  

  ---  

  **Key strengths of this memo approach:**  

  *   **Acknowledges Both Camps:** Explicitly states their core arguments and validates the underlying concerns (preventing harm vs. avoiding overreach).  
  *   **Uses Philosophy Constructively:** Frames the deadlock as a fundamental linguistic question and uses that to build the rule's rationale, showing deep engagement.  
  *   **Provides a Concrete, Vote-Ready Rule:** Goes beyond abstract discussion to offer specific, actionable criteria (a & b).  
  *   **Addresses "Just a Bug" Seriously:** Criterion (b) *directly* incorporates their core argument about context and targeting. The examples show where names *wouldn't* be changed under this rule.  
  *   **Focuses on Practicality:** Emphasizes contemporary meaning, direct association, and a clear test, reducing subjectivity.  
  *   **Promotes Transparency:** Outlines how the rule would be applied to the backlog.  
  *   **Clear Call to Action:** Ends with a specific motion for a vote.  

  This framework provides a rigorous yet practical path forward, respecting both the gravity of slurs and the context-specific nature of language. Good luck at the meeting!
