prompt: |-
  For my seminar on early analytic philosophy, we're working through Russell's 1905 essay "On Denoting," and I've hit a wall on the section commentators call the "Gray's Elegy" argument, where Russell tries to show that his own earlier notion of a denoting concept — a "meaning" distinct from, but related to, its "denotation" — collapses into incoherence. Here is the passage:

  When we wish to speak about the meaning of a denoting phrase, as opposed to its denotation, the natural mode of doing so is by inverted commas. Thus we say:

  The center of mass of the solar system is a point, not a denoting complex; 'The center of mass of the solar system' is a denoting complex, not a point.

  Or again,

  The first line of Gray's Elegy states a proposition. 'The first line of Gray's Elegy' does not state a proposition.

  Thus taking any denoting phrase, say C, we wish to consider the relation between C and 'C', where the difference of the two is of the kind exemplified in the above two instances.

  We say, to begin with, that when C occurs it is the denotation that we are speaking about; but when 'C' occurs, it is the meaning. Now the relation of meaning and denotation is not merely linguistic through the phrase: there must be a logical relation involved, which we express by saying that the meaning denotes the denotation. But the difficulty which confronts us is that we cannot succeed in both preserving the connexion of meaning and denotation and preventing them from being one and the same; also that the meaning cannot be got at except by means of denoting phrases. This happens as follows.

  The one phrase C was to have both meaning and denotation. But if we speak of 'the meaning of C', that gives us the meaning (if any) of the denotation. 'The meaning of the first line of Gray's Elegy' is the same as 'The meaning of "The curfew tolls the knell of parting day",' and is not the same as 'The meaning of "the first line of Gray's Elegy".' Thus in order to get the meaning we want, we must speak not of 'the meaning of C', but 'the meaning of "C",' which is the same as 'C' by itself.

  [...]

  Thus it would seem that 'C' and C are different entities, such that 'C' denotes C; but this cannot be an explanation, because the relation of 'C' to C remains wholly mysterious [...]. This is an inextricable tangle, and seems to prove that the whole distinction between meaning and denotation has been wrongly conceived.

  I can follow Russell up through the two illustrative examples, but I lose the thread once he starts moving between C, 'C', 'the meaning of C', and 'the meaning of "C"'. Could you reconstruct, step by step, why he thinks writing 'the meaning of C' fails to pick out the meaning we're after, and why this is supposed to show that the whole meaning/denotation distinction "has been wrongly conceived," rather than merely being awkward to state in prose? I'd also value your reading of why he calls the relation between 'C' and C "wholly mysterious," and how much weight this argument is meant to carry in motivating the theory of descriptions he develops later in the essay.
