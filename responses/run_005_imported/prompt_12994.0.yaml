  I host a small philosophy podcast, and next weeks guest defends the counterfactual analysis of dispositions -- the Lewis-style 'reformed' version that requires the same intrinsic basis to survive the stimulus. Whenever someone raises a counterexample, like Martin's electro-fink or Bird's poison-and-antidote case, her move is to bolt on another clause and call it handled. Draft 8-10 questions that make that move progressively harder to pull off: one that presses whether 'retains the same basis' is doing real work or is just circular, one asking her to tell a masked disposition apart from a disposition that's simply gone without stipulating the answer, and one on whether something as ordinary as fragility even has a determinate basis to retain. Give a likely reply and a follow-up after each. End on what an actual counterexample to her view would have to look like.
