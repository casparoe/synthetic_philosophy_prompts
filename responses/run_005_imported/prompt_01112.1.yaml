  First, I need to precisely map Locke's terminology. His distinction between "liberty" and "volition" is crucial here. Liberty requires both the power to act and the alignment with one's volition - like having functional legs AND choosing to walk. The locked room removes the physical power element while preserving volition. That's why the man voluntarily stays (volition present) but isn't free to leave (liberty absent). 

  Now for the Frankfurt connection. The user's hunch about "can't act otherwise" vs "can't will otherwise" is razor-sharp. Locke's scenario demonstrates the former: the man physically can't leave, but could theoretically wish to leave (volition intact). Frankfurt's cases attack deeper by removing the ability to even form alternative volitions - like Jones being neurologically rigged to vote Democrat whether he wants to or not. 

  The key difference lies in the mechanism of constraint: Locke uses physical barriers affecting action-execution, Frankfurt uses preemptive manipulation affecting will-formation. Both challenge the Principle of Alternative Possibilities, but Frankfurt's constraint is more radical because it operates at the volitional level. 

  I should emphasize that while Locke anticipates PAP challenges by separating liberty and volition, Frankfurt needs the stronger "can't will otherwise" version to make his moral responsibility argument work. The user seems to sense this distinction matters - they're absolutely right that Locke's case only demonstrates half of what Frankfurt requires. 

