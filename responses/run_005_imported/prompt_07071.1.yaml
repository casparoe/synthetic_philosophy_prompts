prompt: |-
  Me and a friend run a tiny podcast where we interview researchers about stuff that's tangentially related to my day job (I do ML / backend engineering) but way weirder. She's got the actual philosophy PhD between the two of us, I'm just the numbers guy, but she's buried in conference prep this week so guest-question duty landed on me. Next episode's guest is a formal epistemologist who works on "accuracy-first epistemology" / epistemic utility theory -- keeping her unnamed here since I don't want to put words in a real person's mouth if I mangle some detail of her actual published view, so just treat her as someone who fully endorses the accuracy-dominance argument for probabilism (the move where you define accuracy with a scoring rule, show that incoherent credences are always dominated by some coherent credence function across every possible world, and conclude you're epistemically required to be coherent -- I think the guy who originally came up with this is named Joyce but don't quote me on that).

  I got nerd-sniped by this because at my job we use Brier score and log-loss to check whether a model's probability outputs are calibrated, and apparently that's the exact same math this corner of epistemology runs on. So instead of just having her re-explain the pitch, I want questions that lean on the parts that seem shaky to me. Can you draft six to eight questions: at least one on the "immodesty" feature, where because the scoring rule is strictly proper, your current credence always comes out as the one you expect to be most accurate, which feels suspiciously self-congratulatory and maybe hard to square with taking seriously the possibility that you're miscalibrated; at least one on how you even decide which scoring rule counts as "legitimate" to measure accuracy with in the first place, since restricting to strictly-proper ones looks a little like reverse-engineering whichever rule spits out the answer you wanted; and at least one pushing on whether stretching this framework to also justify updating rules like conditionalization -- via some "expected accuracy from your prior's point of view" argument -- quietly smuggles back in the same expected-value reasoning that Dutch-book arguments use, undercutting the whole "non-pragmatic" selling point. For each question, tack on a quick follow-up keyed to whatever answer she'd most likely give, so were not just nodding along at the first response she has ready.
reasoning: |-
  Okay, the user runs a podcast with a friend and needs to interview a formal epistemologist specializing in accuracy-first epistemology. They want to craft pointed questions that challenge the framework's foundations. Let me unpack their requirements.

  First, the guest's expertise is in epistemic utility theory, specifically the accuracy-dominance argument for probabilism. The user works with ML scoring rules like Brier score and log-loss, so they recognize the math but question philosophical applications. Their core concerns are:
  - Immodesty of strictly proper scoring rules
  - Arbitrariness in choosing "legitimate" accuracy measures
  - Potential circularity in justifying conditionalization

  The user wants 6-8 questions with built-in follow-ups that anticipate standard replies. This suggests they need conversational depth, not just gotcha questions. Since their co-host (the philosopher) is unavailable, they're likely compensating for philosophical nuance gaps.

  Notable friction points from the query:
  1) The "self-congratulatory" feel of immodesty - how can a credence trust its own accuracy expectations?
  2) Scoring rule selection seems reverse-engineered to favor coherence
  3) Justifying updating rules might covertly rely on Dutch-book-style pragmatism

  For structure, I'll cover:
  - Opening softballs to establish basics
  - Immodesty challenge + follow-up targeting self-doubt compatibility
  - Scoring rule legitimacy + follow-up on non-convex alternatives
  - Conditionalization justification + follow-up on non-pragmatic claims
  - Additional angles: calibration, comparatives, practical applicability

  The follow-ups should reference key papers (Joyce 2009, Pettigrew 2016) to show preparation while leaving room for guest's original work. Since the user mentioned avoiding misrepresentation, questions should frame objections generically ("some critics argue...") rather than attributing to the guest.

  Biggest risk is overloading with technicality. Since the podcast is "tiny," questions must balance rigor with accessibility. The ML analogy (calibration checks) is a useful anchor - I'll leverage that where possible.
answer: |-
  Here are 8 questions (+ follow-ups) targeting the core tensions you identified in accuracy-first epistemology, designed to push beyond textbook explanations and leverage your ML perspective:

  1.  **The Immodesty Objection:**
      *   **Q:** The immodesty result—that your current credence expects *itself* to be maximally accurate—feels epistemically suspicious. If I’m poorly calibrated (e.g., chronically overconfident), why should I trust that my credence’s *self-assessment* of its expected accuracy is reliable? Doesn’t this bake in a kind of bootstrapping that prevents me from rationally concluding I *am* miscalibrated?
      *   *Likely Response:* Appeal to the *definition* of expected accuracy (wrt current credence) or argue immodesty is a *consequence* of coherence + proper scoring, not an independent flaw.
      *   **Follow-Up:** But doesn't that definitional move sidestep the practical epistemic worry? If immodesty holds *regardless* of my actual calibration history, how *can* this framework ever rationally compel me to revise my *degree* of confidence in my *own calibration*? Isn't the suspicion of miscalibration itself a higher-order credence that seems paralyzed by immodesty?

  2.  **Scoring Rule Legitimacy & Reverse Engineering:**
      *   **Q:** Accuracy-dominance arguments require restricting "legitimate" accuracy measures to (strictly) proper scoring rules. But this seems circular: we define "accuracy" *precisely* such that coherent credences aren't dominated. What independent, non-question-begging justification exists for *why* only proper scoring rules capture "pure" epistemic accuracy? Couldn't an equally "intuitive" but non-proper measure justify different norms?
      *   *Likely Response:* Appeal to "veritism" (truth as sole epistemic good), additivity, or arguments that improper rules punish truth-telling (e.g., Selten 1998) or lead to incoherent accuracy estimates.
      *   **Follow-Up:** The "punishes truth-telling" argument feels pragmatic (discouraging honest reporting). The additivity requirement seems formal/mathematical, not inherently epistemic. If the *primary* justification for restricting to proper rules is that *only then* do we get probabilism from dominance, doesn’t that validate the "reverse engineering" critique? What makes "avoiding dominance" the *sine qua non* of epistemic rationality here?

  3.  **Conditionalization & Smuggled Pragmatism:**
      *   **Q:** Extending accuracy arguments to justify conditionalization (e.g., via Greaves & Wallace's "maximizing expected accuracy") seems to rely on calculating the *expected accuracy of future credence functions* from the *prior's* perspective. But isn’t this just Dutch-book reasoning in epistemic disguise? We're still maximizing an expectation defined by the *current* credence state, which feels inherently pragmatic ("planning now for future accuracy").
      *   *Likely Response:* Argue this is purely epistemic because the "value" being maximized is accuracy (truth), not money or utility. The *structure* of the argument is different from Dutch Books.
      *   **Follow-Up:** The *structure* differs, but the *core move* – using your current credence to evaluate the expected "goodness" (accuracy) of future states and choosing the one that maximizes it – seems formally analogous to avoiding sure loss in Dutch Books. If the criticism of Dutch Books is that they illicitly introduce pragmatic concerns, how does using the *same* expectation-maximization logic, but swapping "money" for "accuracy," fully escape that critique? Isn't "expected accuracy" still a kind of epistemic *utility*?

  4.  **Calibration vs. Coherence (Leveraging ML Intuition):**
      *   **Q:** In ML, we care deeply about calibration (P(rain|forecast=0.3) ≈ 0.3). Accuracy-dominance *implies* coherence, but coherence doesn't guarantee calibration. A perfectly coherent credence function can be systematically miscalibrated. Does accuracy-first epistemology see calibration as a *derivative* requirement emerging from coherence+updating, or is it an independent epistemic virtue potentially in tension with the dominance argument for probabilism?
      *   *Likely Response:* Calibration might be presented as a consequence of coherence + updating on calibration evidence, or as a separate desideratum sometimes traded off against other accuracy measures.
      *   **Follow-Up:** If calibration requires *additional* evidence about one's own reliability, doesn't that suggest the core accuracy-dominance argument for probabilism is insufficient for *fully* rational credences? Could a coherent but wildly miscalibrated agent *avoid* accuracy dominance *despite* being objectively unreliable, purely because they are coherent? Does that diminish the epistemic force of the dominance result?

  5.  **The "Which Proper Rule?" Problem:**
      *   **Q:** Brier score and log-loss are both strictly proper, but they penalize errors differently (Brier quadratically, log-loss more heavily on near-certainty mistakes). They can also rank *coherent* credence functions differently w.r.t. accuracy. If "accuracy" is fundamental, how do we adjudicate *which* proper scoring rule truly measures it? Isn't this choice underdetermined and potentially arbitrary within the framework?
      *   *Likely Response:* Argue that the *core norms* (probabilism, conditionalization) hold for *any* strictly proper rule, so the choice doesn't matter for the foundations. Or, appeal to further axioms (e.g., Symmetry, Normality, Completeness).
      *   **Follow-Up:** While the *norms* might hold across rules, the *evaluation* of which *particular* coherent credence is *best* (e.g., after evidence) can depend on the rule. If two coherent agents, both updating rationally by conditionalization, can have credences ranked differently by different legitimate accuracy measures, doesn't that undermine the idea that there's a single, objective "epistemic accuracy" we're maximizing? Is epistemic rationality only about avoiding dominance, not about uniquely identifying the "most accurate" state?

  6.  **Handling Comparative Beliefs & Ignorance:**
      *   **Q:** Accuracy arguments typically assume credences are defined over a full algebra. How does this framework handle deep uncertainty or comparative beliefs (e.g., "A is more likely than B, but I have no idea *how much* more likely")? Does forcing a precise probabilistic representation distort the epistemic state or create spurious accuracy demands?
      *   *Likely Response:* Discuss imprecise credences (sets of probabilities) or argue that representation theorems show precise credences capture rational comparative belief.
      *   **Follow-Up:** If we move to imprecise credences, how does the accuracy-dominance argument generalize? Can we still get a clear dominance argument for avoiding sure incoherence *within* the set? Or does this open the door to permissiveness that the original argument sought to avoid? If we stick with precise credences, isn't assigning a specific number like 0.723 to a complex proposition often an artificial precision that the scoring rule then harshly penalizes, potentially misrepresenting the epistemic cost of genuine uncertainty?

  7.  **Is Accuracy Really Non-Pragmatic?**
      *   **Q:** You position accuracy-first as a non-pragmatic justification for Bayesian norms, contrasting it with Dutch Books. But isn't the *entire machinery* of minimizing possible inaccuracy (avoiding dominance) or maximizing expected accuracy structurally identical to minimizing possible loss or maximizing expected utility? Isn't "accuracy" just epistemic utility, making the distinction purely terminological?
      *   *Likely Response:* Emphasize that accuracy (closeness to truth) is an intrinsic epistemic good, distinct from pragmatic values like money or survival. The *goal* is different.
      *   **Follow-Up:** But the *logic of rationality* being employed – avoid sure loss / dominance, maximize expectation defined by current beliefs – is identical in both frameworks. If the *structure* of rational constraint is the same, and the only difference is labeling the "utility" (money vs. accuracy), doesn't this suggest that the "non-pragmatic" claim rests entirely on the *intuition* that truth is a special kind of good? Is there a *formal* difference in the reasoning, or just in the metaphysics of the value being optimized?

  8.  **The Scope & Limits for Practitioners (Your Angle):**
      *   **Q:** From an ML/engineering perspective, we use proper scoring rules (Brier, log-loss) operationally to *evaluate and compare* models. But we don't take the immodesty result to mean our *current* model is best, nor does dominance-avoidance dictate our *only* goal (we care about discrimination, simplicity, robustness). Does accuracy-first epistemology risk overemphasizing coherence/calibration at the expense of other epistemic values relevant to real-world belief formation, like understanding causal mechanisms, robustness to model misspecification, or generating explanations?
      *   *Likely Response:* Argue that coherence is a *necessary minimum standard*, not the whole story, or that other values ultimately serve accuracy.
      *   **Follow-Up:** If coherence is just a necessary minimum, does the accuracy-dominance argument lose some of its foundational force? If other values (robustness, explanatory power) are *also* fundamental epistemic goods, how do we integrate them formally without collapsing back into a broader pragmatism? Can the accuracy-first framework genuinely accommodate them, or does its formal elegance rely on isolating "accuracy" in a way that might be too narrow?

  **Key Threads for the Interviewer:**
  *   **Listen for Circularity:** Does the justification for the scoring rule or the updating rule subtly presuppose the norm it's trying to justify?
  *   **Pragmatism vs. Purism:** Is the distinction between Dutch Books and accuracy arguments substantive or semantic? When they talk about "value," "planning," or "domination," does it sound like utility?
  *   **Immodesty & Self-Doubt:** How do they reconcile the framework with the rational possibility of believing you might be irrational or miscalibrated? Does immodesty block this?
  *   **Calibration as a Check:** Your ML experience here is gold. Press on whether the framework adequately addresses calibration as a distinct, observable phenomenon beyond mere coherence.

  These questions should spark a deeper discussion, moving beyond the standard pitch and directly engaging with the philosophical friction points that sniped you. Good luck with the interview!
