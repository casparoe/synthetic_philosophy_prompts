  But what about the leaf count at time t? It is a non-epistemic fact and should be knowable at time t. And it is: someone at time t could count the leaves and know it. But the paired fact Q(t) is not knowable at time t but becomes knowable later.

  Therefore, Marcus can hold on to his rule by:

     (a) Allowing that the knowability might be at a time later than the time the fact is about (if the fact is about a specific time).

