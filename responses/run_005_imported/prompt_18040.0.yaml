  But do we have any reason to believe that such a fact exists? It would require that P is true and that at every time in the entire history of the universe, no one knows P. That is, P is an eternal secret. Are there such truths? It is hard to say. But if there are, then Marcus's rule would be false for them.

  Therefore, Marcus's rule might be saved for most facts but perhaps not for facts that assert eternal ignorance about some truth.

  In practice, we might not be concerned with such facts. So Marcus might restrict his rule to facts that are about a specific time or that are not self-referential in a way that leads to paradox.

