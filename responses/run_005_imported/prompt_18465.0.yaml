  Also, the user's "voluntold" status suggests they need confidence-boosting phrasing. Strong verbs, no hedging. "The Commission concludes" not "I suggest." And preempt the judge's counterarguments by citing how other states handle this (e.g., Utah downgrading to infraction). 

