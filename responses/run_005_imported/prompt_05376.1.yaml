answer: |-
  Here are eight interview questions designed to challenge the core tenets of single-case propensity theory while anticipating your guest's likely defenses, particularly the "formalism can be patched; physics can't" line. Each targets a key vulnerability, includes a specific follow-up to block easy dodges, and culminates in the falsifiability question:

  1.  **Core Challenge (Humphreys' Paradox):** "You argue propensities are physical dispositions *causally directed* from setup to outcome. But Bayes' theorem, derived from the probability calculus propensities must satisfy, seems to demand meaningful *inverse* conditional propensities, like the propensity *of the die throw setup itself* given that a six occurred. How can a physical disposition inherent in the setup *before* the outcome exist meaningfully *conditional on* that very outcome? Doesn't this violate the causal directionality essential to your ontology?"
      *   **Likely Dodge:** Claiming inverse conditionals are purely mathematical artifacts, not real propensities, or redefining conditioning.
      *   **Follow-Up:** "If we exclude inverse conditionals as 'non-physical' or redefine conditioning *only* for forward propensities, doesn't this amount to *restricting the probability calculus itself* for propensities? Doesn't this violate your claim that the formalism is merely patched, rather than fundamentally altered or partially abandoned to save the ontology? How is this different from frequentists limiting probability's scope?"

  2.  **Core Challenge (Reference-Class Problem):** "You critique frequentism for the reference-class problem: the probability of an event depends on which repeatable class we slot it into. But doesn't propensity theory face a parallel 'setup-identification problem'? Any single event (e.g., *this* atom decaying, *this* patient relapsing) can be seen as an instance of countless different 'chance setups' (e.g., *this* atom in *this* lattice at *this* temperature, vs. uranium-238 atoms generally; *this* patient with *this* specific genome and *this* exact treatment history, vs. Stage II Hodgkin's patients). How do we objectively identify 'the' single, true physical setup whose propensity governs the event, making it description-independent in a way frequencies aren't?"
      *   **Likely Dodge:** Arguing the "true" setup is defined by the complete set of causally relevant physical properties at the time.
      *   **Follow-Up:** "But identifying which properties are 'causally relevant' seems inherently description-laden and context-dependent. Isn't specifying the 'complete set of causally relevant properties' just as vulnerable to arbitrariness as the frequentist's choice of reference class? Can you give a *non-circular, operational* criterion for identifying the single true physical setup underlying *this specific atom's decay* that doesn't ultimately rely on our description or theoretical interests?"

  3.  **Core Challenge (Principal Principle & Undermining):** "David Lewis's Principal Principle links objective chance (which you identify with propensity) to rational credence. But he identified the 'big bad bug': undermining futures. A true propensity theory, especially a single-case one, seems vulnerable: a specific setup (e.g., *this* atom's decay propensity) could, *by its very nature*, produce a global sequence of outcomes statistically incompatible with that propensity (e.g., decaying precisely when it 'shouldn't'). How does your version of propensity theory avoid this undermining problem and underpin the Principal Principle? Do you adopt Lewis's own 'patch' (New Principle), or something else?"
      *   **Likely Dodge:** Endorsing the New Principle or arguing undermining futures have infinitesimal propensity/aren't physically possible.
      *   **Follow-Up:** "Lewis's New Principle effectively bases rational credence on the chance *conditional on the entire theory of chance*. Doesn't this move significantly weaken the claim that single-case propensities *themselves* are the fundamental physical facts directly guiding rational belief? Doesn't it make the Principal Principle depend as much on our *theory* about propensities as on the propensities *in the world*, potentially reintroducing an epistemic element you reject? If you reject the New Principle, how do you *physically* preclude undermining futures without rendering propensity deterministic?"

  4.  **Testing the Ontology:** "Propensity theory posits an unobservable *dispositional* property (the propensity) as the fundamental reality behind probabilistic events. What specific, empirically testable predictions does this ontological commitment make that a sophisticated subjectivist view (with rational degrees of belief constrained by physical symmetries and evidence) or a sophisticated best-system frequentist view *cannot* make? Put differently, what experiment or observation could *only* be explained by positing a real, single-case physical propensity, and not by the alternatives?"
      *   **Likely Dodge:** Arguing propensities explain the *existence* of stable frequencies or the *objectivity* of probabilities in physics better than alternatives.
      *   **Follow-Up:** "But sophisticated subjectivists (like de Finetti) and Humean frequentists (like Lewis) *also* account for stable frequencies – one via exchangeability and convergence, the other via the Best System analysis. If all these frameworks can, in principle, predict and explain the same observable frequencies and rational betting behaviors, what *additional empirical leverage* does positing an unobservable disposition provide? Isn't the 'explanatory power' here potentially just a matter of metaphysical preference rather than empirical differentiation?"

  5.  **The 'Physics Can't' Defense - Specificity:** "Your 'formalism can be patched; physics can't' line suggests the physical propensity is non-negotiable. But when faced with problems like Humphreys' Paradox or the reference-class issue, your responses often involve *redefining the scope or interpretation of the formalism* (e.g., excluding inverse conditionals, specifying the 'true' setup). How is this fundamentally different from the frequentist 'patching' their formalism (e.g., moving from finite to hypothetical infinite frequencies, selecting privileged reference classes) when faced with *their* problems? Doesn't your 'physics can't' stance risk becoming a shield against any formal challenge by always allowing the ontology to dictate ad hoc adjustments to the mathematical representation?"
      *   **Likely Dodge:** Arguing her patches are constrained by physical causality/structure, while frequentist patches are arbitrary/conventional.
      *   **Follow-Up:** "Can you provide a clear example where a *formal requirement* of the probability calculus (beyond just yielding correct frequencies) *forced* a revision in our understanding of the *physics* of a specific, well-defined single-case chance setup? Conversely, can you name a case where adherence to a specific physical propensity ontology *clearly led* to a superior formal development of probability theory compared to other interpretations?"

  6.  **Quantum Indeterminism vs. Classical Ignorance:** "Single-case propensities seem most intuitive for genuinely indeterministic events like radioactive decay. But what about classically probabilistic events, like a coin toss? Is the propensity of *this specific coin toss* to land heads a real physical disposition, distinct from the limits of our knowledge about initial conditions? If so, how do we empirically distinguish the 'true physical propensity' from mere epistemic uncertainty in such deterministic-but-unpredictable systems? If not, does propensity theory only apply to quantum events, conceding a vast domain to subjectivism?"
      *   **Likely Dodge:** Arguing that sufficiently complex classical systems *are* effectively indeterministic for all practical (and perhaps ontological) purposes, or that the relevant setup includes the micro-details making it genuinely chancy.
      *   **Follow-Up:** "If the propensity of a coin toss is grounded in the microphysical details (air molecules, surface imperfections), doesn't this reduce it to the propensity of the underlying quantum events? And if *those* quantum events have propensities, how does specifying the coin-toss setup *add* any new physical disposition beyond the summed propensities of its quantum components? Doesn't this risk either redundancy or an infinite regress?"

  7.  **The 'Physics Can't' Defense - Generality:** "You argue the physical propensity is primary. Yet, the *mathematical structure* of probability theory (Kolmogorov axioms, calculus) seems remarkably successful across wildly different domains – quantum physics, genetics, economics, epistemology. If propensities are fundamental physical properties, why does the *same* abstract mathematical structure govern such diverse phenomena? Doesn't the universal applicability and power of the formalism suggest it captures something more fundamental or general than domain-specific physical dispositions?"
      *   **Likely Dodge:** Arguing the formalism is successful *because* it accurately models the common abstract structure of these diverse physical propensities.
      *   **Follow-Up:** "But couldn't a subjectivist argue the formalism's success stems from it capturing universal norms of rational reasoning under uncertainty, applied to different physical situations? Or a frequentist argue it captures patterns of regularity in the world? Given that the formalism works under *all* these interpretations, what specific evidence compels us to interpret its success *only* as evidence for physical propensities?"

  8.  **Falsifiability (The Crucial Question):** "Finally, to pin down the empirical content of propensity theory itself: What conceivable empirical discovery or theoretical development would you accept as strong evidence *against* the existence of single-case physical propensities *as you define them*? Not merely evidence requiring a *patch* to the formalism linking propensities to frequencies or credences, but evidence suggesting that positing such a dispositional property is *unnecessary, incoherent, or fundamentally mistaken* as an account of what probability *is* in the physical world?"
      *   **Likely Dodge:** Resisting naming a specific falsifier, arguing any problem can be fixed within the framework, or defining propensities as essential to explaining indeterminism.
      *   **Follow-Up (if needed):** "Could you envision a scenario? For instance: the discovery of a fundamental, indeterministic physical process where probabilities demonstrably *cannot* be modeled by *any* Kolmogorov-compliant measure attached to the initial setup? Or a coherent, empirically successful interpretation of quantum mechanics that explicitly denies any physical propensity preceding measurement and explains all statistics purely via post-measurement branching or information? If *no* conceivable finding could challenge the core ontology, doesn't propensity theory risk becoming a non-empirical metaphysical commitment?"

  **Key Strategies Employed:**

  *   **Forcing Ontological Commitment:** Questions 1, 2, 3, 4, 6, and 8 directly challenge the core physicality and causal directionality of propensities.
  *   **Targeting the "Physics Can't" Dodge:** Questions 4, 5, and 7 specifically interrogate the relationship between formalism and ontology, demanding evidence that the physics *compels* the ontology and that the ontology provides unique empirical value.
  *   **Anticipating Specific Defenses:** Follow-ups are tailored to common propensity theorist responses (dismissing inverse probabilities, appealing to "true" causal setups, adopting the New Principle, invoking micro-details, appealing to explanatory power).
  *   **Demanding Differentiation:** Questions 4 and 7 explicitly ask what *unique* empirical ground propensity theory holds against subjectivism or sophisticated frequentism.
  *   **The Falsifiability Gambit:** Question 8 is the linchpin, forcing a confrontation with the theory's empirical core and vulnerability. The follow-up pushes for concrete scenarios if the initial answer is evasive.
  *   **Avoiding Restatement:** The questions focus on *problems for* the theory and *comparisons with alternatives*, rather than asking for exposition.

  These questions should create a dynamic interview that pushes beyond restatement and forces a defense of the theory's core metaphysical claims against its most persistent philosophical and formal challenges. Good luck!
