  So I'm about two-thirds through a novel where one of my two POV characters is a rabbinical-school dropout who can't let go of this one Maimonides argument, and I need to actually understand it properly before I let him try it out on his sister (the other POV -- a now-secular biologist who thinks his whole reading list is a symptom, not a hobby) over Shabbat dinner. The argument is Maimonides' account of animal sacrifice in the Guide for the Perplexed -- I think its part III, somewhere in the low-to-mid thirties, the bit where he compares it to weaning a baby off milk: God only commanded sacrifices, on this reading, because the Israelites were already steeped in that whole Sabean/idol-worshipping culture, so ripping the practice away instantly would've been psychologically impossible, and instead it got redirected at Him instead of the idols.

  Fine, except then I went down a rabbit hole and found out two things that complicate it. One, Nahmanides apparently thought this explanation was close to insulting -- like it explained away something that was supposed to be sacred. Two, and this is the one that's bugging me: Maimonides' own law code, the Mishneh Torah, spends real time describing the messiah rebuilding the Temple and reinstating those exact same sacrifices, in detail, like they're a permanent feature of the ideal future rather than training wheels to be kicked away. That seems hard to square with "this was just a concession to primitive people," unless there's a move I'm not seeing.

  Could you write me an essay-length answer that actually takes a side instead of hedging into "scholars disagree"? Lay out the strongest version of both readings -- that Maimonides really did think sacrifice was a lesser, provisional form of worship, versus that the accommodation story explains its origin without touching its ongoing value -- and make sure whichever one you land on actually deals with the Nahmanides objection and the Mishneh Torah problem rather than ignoring them. I need a real conclusion here, because my dropout needs an actual argument to make at that table, and I need to know going in whether it's the kind of argument his sister should be able to take apart or not.
