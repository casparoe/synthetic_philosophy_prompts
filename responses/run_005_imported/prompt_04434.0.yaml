  - **(b) Equivalence with vector space bases**: Tier A. Blass's result shows AC is fundamental to linear algebra's core framework. Rejecting AC forces abandoning standard tools (e.g., bases for arbitrary vector spaces), a serious mathematical cost, though separable spaces or weaker axioms mitigate this.  
  - **(c) Diaconescu's theorem**: Tier A. For non-classical logicians, this exposes AC as non-innocent—it implies excluded middle, collapsing constructive distinctions. It's a deep philosophical point about AC's logical commitments, but less decisive for classical mathematicians who already accept excluded middle.  
  - **(d) Solovay's model**: Tier A. Demonstrates that dependent choice (+ inaccessible cardinal) permits measure-theoretic "sanity" without full AC, refuting the notion that paradoxes are inevitable for "ordinary" math. But the inaccessible cardinal requirement and (e)'s caveat limit its decisiveness.  
  - **(e) Hahn-Banach's sufficiency for paradoxes**: Tier A. Undercuts retreats to weaker choice principles by showing key tools like Hahn-Banach already imply non-measurable sets and Banach-Tarski. This forces a harder trade-off: accept paradoxes or reject widely used theorems, making it a pivotal consideration.  
  - **(f) Russell's socks**: Tier B. Illustrates why an axiom is needed for arbitrary choices, but doesn't resolve whether AC is *true*—only that some principle is required. It motivates AC without justifying it philosophically, serving more as intuition-pumping than argument.
