prompt: |-
  I'm a software engineer, and I've been quietly falling down a philosophy rabbit hole ever since a coworker offhandedly described our microservice cluster as "a bunch of simples that only compose something when they're actually doing something together" — a remark that sent me reading about Peter van Inwagen's special composition question: under what conditions do some objects jointly compose a further object? From what I've gathered, the two "clean" answers are nihilism (strictly speaking, nothing ever composes anything except trivially) and universalism (any objects whatsoever compose something), while van Inwagen's own answer — sometimes called organicism — splits the difference by holding that composition occurs only when the activity of the parts constitutes a life, so that, strictly speaking, chairs, cars, and mountains don't exist as single objects at all, only organisms do.

  What I'd like to pressure-test is that "life" criterion specifically, rather than the composition debate in general. Could you construct a concrete scenario — grounded in an actual biological phenomenon rather than a stock philosophy-class example like the Ship of Theseus or van Inwagen's own trout-turkey fusion — in which organicism is forced into a verdict that is noticeably more counterintuitive than what a nihilist or a universalist would say about that very same case? I'd like you to spell out exactly why the "life" criterion in particular struggles with the case, as opposed to composition views generally, then briefly suggest how a defender of organicism might try to patch the criterion in response, and give me your own take on whether that patch actually works.
