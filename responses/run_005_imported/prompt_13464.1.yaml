  The user also needs to defend their reading. I think expressio unius doesn't apply because the 2019 amendment was specific to hoverboards due to their unique risks. It doesn't imply exclusion of all small devices. The original intent was weight and damage, so scooters shouldn't be grouped with golf carts. 

  Proposed policy changes should include weight limits and explicit exclusions for scooters and e-bikes. This prevents future debates. Also, setting a review timeline ensures adaptability. 

