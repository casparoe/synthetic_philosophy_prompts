  Then there's Schelling's point about resolved threats inviting attacks. Adopting a surrogate goal could signal vulnerability, attracting more threats. In acausal terms, if an AI is known to use surrogate goals, adversaries might exploit this by targeting the decoy, but also potentially probing other weaknesses. Schelling might worry that this creates a new vector for extortion instead of deterring it.

