prompt: |-
  Ok this is way more personal than what I usually ask about, but here goes. My dad was just diagnosed with Huntington's, which means I've got a 50/50 shot of carrying the gene too, and my genetic counselor is waiting on me to decide whether I want the predictive test. I did a stats PhD before I left academia, and I can't stop thinking about Good's theorem -- the result that a rational agent's expected utility from free evidence is never lower than just not looking, so "peeking" is always at least weakly the right call. Taken at face value that seems to say I should obviously get tested, but it feels off given theres no treatment either way and most people who are eligible for this test apparently choose not to take it. Can you walk me through the most important implications of Good's theorem for a decision like mine -- what has to be true for the "always look" conclusion to actually hold, and whether not wanting to know is a mistake by the theorem's own logic or whether the theorem just isn't really about cases like this at all?
