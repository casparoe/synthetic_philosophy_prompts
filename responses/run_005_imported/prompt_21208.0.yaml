answer: |-
  Here’s a dialogue between **Sam (Ockhamist)** and **Alex (Supervaluationist)**, debating whether the statement *"There will be a sea battle tomorrow"* can be true *right now*. Both engage directly with the core objections, aiming for steelmanning.

  ---

  **Sam (Ockhamist):** Look, Alex, let’s start simple. Either there will be a sea battle tomorrow, or there won’t. Excluded middle demands one of these is *actually true* right now. If we deny that, we’re saying reality itself is indeterminate—that the future isn’t just unknown, but *nonexistent* until it happens. That’s incoherent. There’s a single, privileged future history—the "thin red line" (TRL)—and "There will be a battle" is true today *iff* the TRL includes a battle tomorrow.  

  **Alex (Supervaluationist):** Sam, your TRL is a metaphysical sleight of hand. If the future is genuinely *open*, nothing about the *present*—no fact, no property—can pick out one branch as "privileged." What makes *this* branch the TRL? Your answer can only be: "Because it’s the one that *will* happen." But that’s circular! It presupposes a determinate future to ground present truth, which is precisely what’s at issue. You’re smuggling determinism in through the back door.  

  **Sam:** Not at all. The TRL isn’t "picked out" by present facts—it’s *ontologically basic*. Think of time like a tree: all branches exist *as possibilities*, but only one branch is *actualized* as history unfolds. The TRL is just the unique, complete history that *is* actual. When I say "There will be a battle," I’m describing a property of *that history*. It’s no different than saying "Caesar crossed the Rubicon" describes a property of the past. The truthmaker is the entire timeline.  

  **Alex:** But that’s the problem! For past truths, the truthmaker *leaves traces* in the present—we have evidence. For your TRL, there’s *zero* present difference between it and any other branch. Calling it "actualized" is empty metaphysics. Belnap was right: if two futures are *symmetrically* possible given the present, how can one be "privileged" without collapsing into fatalism? Either the present *necessitates* it (determinism), or your "privilege" is a label, not a fact.  

  **Sam:** I’ll bite. Yes, the TRL is *epistemically* undetectable now—we can’t know which branch is actual. But that doesn’t make it *metaphysically* empty. Reality isn’t limited by what we can verify! Consider: before a coin flip, "It will land heads" is either true or false. We don’t know which, but it’s *objectively* one or the other. Denying that means *nothing* is true until observed—which is anti-realist. Your supervaluationism turns "will" into "might," robbing future contingents of meaning.  

  **Alex:** Ah, but I *don’t* deny objectivity—I relocate it. "There will be a battle" is neither true nor false *simpliciter* today because the world hasn’t settled which branch is realized. But it *is* supertrue that *either* there will be a battle or there won’t. Excluded middle holds at the level of *propositions*: "P or ~P" is always supertrue (true on all histories). What fails is bivalence for *future contingents*—and it *should* fail, because their truth isn’t grounded yet. Your TRL pretends grounding exists when it doesn’t.  

  **Sam:** But that’s where supervaluationism cheats! If I say "There will be a battle," and it’s true on 90% of branches, you still call it *false* because it’s not true on *all*. But if it’s true on 90% of plausible futures, isn’t it *robustly* likely? Yet you label it "simply false" if even one branch avoids it. Worse, "supertruth" isn’t *truth*—it’s necessity in disguise! "A battle will happen" is supertrue only if it’s *inevitable*, but we’re talking about *contingent* futures. You’ve replaced truth with inevitability.  

  **Alex:** Not inevitability—*settledness*. "A battle will happen" is supertrue only if the present *guarantees* it, which is rare for contingents. But for ordinary claims like "Either there’s a battle tomorrow or not," the present *does* guarantee that—so it’s supertrue. Your objection confuses *credence* with *truth*. High probability isn’t truth! If I flip a fair coin, "It will land heads" isn’t *true* now, even if I’m 99% confident. Your TRL makes it mysteriously true *now*—but with no basis except "because it will happen later." That’s not grounding; it’s post-dating a check.  

  **Sam:** So you’re comfortable saying that, right now, it’s *neither true nor false* that the coin lands heads? That violates excluded middle! "It will land heads or it will not" *must* be true.  

  **Alex:** It *is* true! "It will land heads or it will not" is supertrue—true on every branch. But neither disjunct is true *simpliciter*. Excluded middle is preserved; bivalence isn’t. The open future requires this: truth for future contingents is *temporally relative*. Tomorrow, when the coin lands, "It landed heads" becomes true. Today, it’s indeterminate. That’s not a "trick"—it’s taking openness seriously. Your TRL *pretends* indeterminacy away by fiat.  

  **Sam:** But then nothing is *presently* true about the future! If I say "A sea battle will happen tomorrow," and you say it’s neither true nor false, you’ve made all future claims meaningless *now*. Yet we act as if they matter—generals prepare, sailors fear death. How can we rationally act on propositions with *no truth value*?  

  **Alex:** Easily: we act on *probability* and *superassertibility*. "A battle will happen" may not be true now, but if it’s true on all *historically possible* branches given current plans (e.g., fleets are mobilizing), it’s *pragmatically rational* to act as if true. Conversely, if it’s false on some plausible branch, we shouldn’t treat it as certain. TRL, by contrast, implies we *should* act as if one future is fixed—which undermines the urgency of choice in an open world.  

  **Sam:** But your "superassertibility" concedes my point: deep down, you know *one* future will obtain. Why not admit it’s already real?  

  **Alex:** Because "will" isn’t "is." The future isn’t *real* yet—it’s *possible*. To say it’s "already real" is to spatialize time. The TRL is a beautiful illusion, Sam, but it’s still an illusion.  

  **Sam:** And your truth-value gaps are a capitulation to indeterminacy. We’ll agree to disagree.  
  **Alex:** Until tomorrow—when one of us gets a sea battle.  

  ---

  ### Key Engagements:
  1. **Sam answers "TRL is undetectable"**: Grants epistemic undetectability but insists TRL is ontologically basic (like past history).  
  2. **Alex answers "Supertruth isn’t truth"**: Distinguishes truth from inevitability/settledness, and defends supertruth as preserving logic (excluded middle) without overcommitting metaphysics.  
  3. **Sam presses "Rational action requires present truth"**: Alex counters with *superassertibility* (warrant based on present possibilities).  
  4. **Alex presses "TRL implies fatalism"**: Sam denies it, arguing TRL is compatible with openness (branches exist, but one is actual).  

  Both positions remain live—neither "wins," but each forces the other to refine their stance.
