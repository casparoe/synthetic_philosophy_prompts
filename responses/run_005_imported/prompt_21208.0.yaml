  so i got into it for like two hours last night with my friend dev about the sea battle thing from aristotle and neither of us budged an inch. his whole position is that the "thin red line" move ockhamists make -- where you say there's one privileged actual future among all the branching possibilities, and future-tense sentences are just true or false relative to THAT one -- is basically cheating. like belnap and green's objection: if the future is genuinely open, nothing about the present moment could possibly distinguish the "real" branch from the others, so calling one of them special is just semantics dressed up as metaphysics. i kept pushing back that the alternative, supervaluationism, feels almost as bad -- saying "there will be a sea battle tomorrow" is neither true nor false today, just a truth-value gap, means excluded middle only survives at the level of "supertruth," and i'm not convinced thats not also just a trick. plus it ducks the intuitive pull that surely one of "there will be a battle" / "there won't" has to be actually true right now, full stop, wether we can know which one.

  anyway we never resolved it, obviously. can you write me a dialogue between an ockhamist (defending the thin red line) and a supervaluationist, arguing specifically about whether it's true right now that there will be a sea battle tomorrow? i want real back and forth, not talking past each other -- each of them has to actually answer the other's best objection (the "TRL is undetectable" worry, and the "supertruth isn't really truth" worry). no easy dunks on either side, make them both as sharp as possible.
