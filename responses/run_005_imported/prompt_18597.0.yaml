  Also, considering the Victorian context is important. Many intellectuals were grappling with science vs. religion. Sidgwick's dual focus wasn't unique. His approach was systematic: philosophy identified a gap, and psychical research was his method to fill it. The user should highlight this continuity to avoid reducing it to a personal quirk.

