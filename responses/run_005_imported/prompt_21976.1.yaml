  After the physicist announces the small universe, the philosopher at the bar says to his friend:

  "See, if the universe is small, then my existence is a miracle. But if it's large, it's not. Therefore, the large universe is more probable. So the physicists must be wrong."
  The friend (SIA proponent) says, "But they have evidence."
  Philosopher: "Their evidence is subject to observation selection effects. They only got that result because they exist. But in a large universe, they are more likely to exist and get that result. So the evidence is actually stronger for the large universe."

