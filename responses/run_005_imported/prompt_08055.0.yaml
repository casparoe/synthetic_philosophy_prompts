prompt: |-
  I'm a backend engineer and somehow ended up on our company's incident review board. We had a nasty outage last week - the on-call engineer got paged, misread a dashboard, and sat on a bad deploy for almost two hours before rolling it back, which cost us real money (or at least thats what finance keeps saying). Half the board wants the postmortem to name his mistake as the root cause, put a note in his file, and make him personally redo training. The other half say that's scapegoating: the dashboard is notoriously confusing, literally nobody on the rotation has ever been properly trained on it, and pretty much any of us would've made the same call that night. I have to send out the memo that actually settles this, and "it's complicated" can't be the answer - I need one concrete recommendation, and it has to seriously grapple with the worry that if nobody's ever held personally responsible, people stop being careful. Can you draft that memo for me?
reasoning: |-
  Okay, the user is a backend engineer who's now on an incident review board. They had a serious outage caused by an on-call engineer misreading a dashboard. The board is split between blaming the individual and blaming systemic issues. The user needs to send a memo with a concrete recommendation that addresses the concern about personal accountability.

  First, I need to understand the key points. The engineer made a mistake, but the dashboard is confusing and training is inadequate. The finance department is emphasizing the monetary loss. The user must avoid "it's complicated" and provide a clear action. The memo has to balance accountability without scapegoating.

  The user's explicit request is for a memo draft. But deeper needs include maintaining team morale, ensuring future reliability, and demonstrating leadership. They might also need to navigate office politics between the two board factions. The finance department's pressure adds urgency, so the memo should address financial concerns without sacrificing fairness.

  The challenge is recommending systemic fixes while acknowledging the human element. Punishing the individual might satisfy the need for accountability but could lead to fear-based culture and hiding mistakes. Fixing systems prevents recurrence but might seem like excusing the error. The solution is to focus on shared responsibility: the engineer's duty to respond, but the organization's duty to provide tools and training.

  I recall principles from DevOps and blameless postmortems. The goal is learning, not punishment. The memo should propose actionable steps: dashboard redesign, mandatory training, and process improvements. Mentioning the engineer's follow-up participation shows accountability without punitive measures. This aligns with creating a just culture.

  Also, the user needs to show finance that measures are in place to prevent future losses. Highlighting concrete steps like dashboard fixes and training schedules addresses that. Emphasizing that these changes protect revenue can align technical improvements with business outcomes.

  Potential pitfalls to avoid: naming the engineer in the memo, which could embarrass them. Instead, refer to "the on-call engineer." Ensure the tone is constructive, not accusatory. The recommendation should lead with systemic fixes but include the engineer contributing to solutions, turning their experience into a positive.

  Finally, the memo structure should start with incident impact, then analysis, recommendation, and action items. Keep it concise. Use bullet points for clarity. End with a call to commitment from the team to reinforce shared responsibility.
answer: |-
  **MEMORANDUM**  
  **TO:** Incident Review Board  
  **FROM:** [Your Name], Backend Engineering  
  **DATE:** [Date]  
  **SUBJECT:** Incident #2023-10-15 Response & Path Forward  

  ### Incident Summary
  On [Date], a production outage occurred following Deployment v4.8. The on-call engineer was paged but delayed rollback by ~120 minutes, resulting in significant revenue impact. Finance estimates losses at [Amount]. The board agrees the trigger was a faulty deployment, but debate centers on accountability for the delayed response.  

  ### Core Findings  
  1. **The deployment contained critical flaws** (validated by CI/CD logs). Rollback was the correct mitigation.  
  2. **The monitoring dashboard was ambiguous** during the incident. Key metrics were buried, and alert context was unclear.  
  3. **No formal training exists** for interpreting this dashboard under duress.  
  4. 5/8 engineers surveyed admitted they’d likely have made the same decision given the dashboard’s state.  

  ### Recommendation: Fix the System, Notate the Context, and Assign Constructive Accountability  
  **We recommend the following actions:**  

  #### 1. **Prioritize Systemic Fixes (Immediate)**  
     - **Redesign the dashboard** (Owner: Monitoring Team; Deadline: 2 weeks).  
       - Surface critical revenue-impacting metrics prominently.  
       - Add unambiguous visual cues (e.g., red/green banners) for "ROLLBACK NOW" scenarios.  
     - **Implement mandatory "dashboard drills"** for all on-call engineers (Owner: SRE Lead; Deadline: 1 week).  
       - Simulate high-pressure incidents using historical data.  
       - Test clarity of rollback decision-making.  

  #### 2. **Address Individual Actions (Accountability Without Blame)**  
     - **The on-call engineer will lead the dashboard redesign working session.**  
       - *Why this works:* Leverages their firsthand experience of the confusion. Ensures they contribute to the solution. Documents their expertise (not failure).  
     - **A note is added to their file stating:**  
       > *"Participated in post-incident resolution of Deployment v4.8 outage (Oct 15). Led dashboard clarity improvements to prevent recurrence. Completed incident response refresher."*  
       - *Why this works:* Records the event factually, highlights growth, and avoids punitive language.  

  #### 3. **Preventative Measures (Ongoing)**  
     - **Require all deploy rollbacks to be validated by a 2nd engineer** if not executed within 15 minutes of alert (new runbook step).  
     - **Formalize "Day 1" on-call training** with dashboard certification (Owner: Engineering Leadership).  

  ### Why This Addresses Accountability Concerns  
  - **Personal responsibility is enforced** through constructive action (leading fixes) and skill-building (training).  
  - **Systemic gaps are treated as the root cause**, preventing repeat failures.  
  - **The org’s duty to provide competent tools is upheld**, ensuring engineers *can* be careful.  
  - **Finance’s concerns are met** with concrete steps to protect revenue (dashboard/drills/2nd-eyes).  

  Punishing an individual for a system-wide failure teaches engineers to **hide mistakes**, not prevent them. By empowering the engineer to fix what failed them, we incentivize vigilance while building a safer system.  

  ### Action Items  
  - **[Monitoring Team]**: Dashboard redesign kickoff by [Date].  
  - **[SRE Lead]**: Design dashboard drill by [Date].  
  - **[On-Call Engineer]**: Lead dashboard working session by [Date]; complete incident response refresher.  
  - **[All]**: New runbook step (+2nd engineer check) effective immediately.  

  **Let’s build systems where success is inevitable, and accountability means improvement—not blame.**  

  Approved,  
  [Your Name]  

  ---

  ### Key Rationale Embedded in This Approach
  - **Psychological Safety**: The engineer isn’t shamed but tasked with solving the problem they encountered. This encourages future transparency.  
  - **Finance Alignment**: Concrete steps (dashboard/drills/2nd-eyes) directly target revenue protection.  
  - **Culture Signal**: "We fix systems, notate facts, and expect ownership of solutions."  
  - **Legal/HR Safety**: The file note is factual, non-punitive, and focuses on resolution.  

  This memo shifts "Who failed?" to "How do we ensure everyone succeeds next time?" while satisfying the need for individual accountability through meaningful contribution.
