  Okay, let me unpack this user's query about Moore's ethics. The user and their friend had a heated debate after reading Principia Ethica, specifically about whether Moore's rejection of hedonism contradicts his later endorsement of aesthetic and interpersonal pleasures. The friend sees this as philosophical sleight of hand, while the user couldn't counter this effectively during their argument.

  First, I need to recall Moore's core arguments. His open-question argument targets naturalistic fallacies, insisting "good" can't be defined by natural properties like pleasure. Yet in "The Ideal," Moore identifies intrinsically good things: aesthetic appreciation and personal affections. The user's friend argues this is just hedonism in disguise, making Moore closer to Sidgwick than he admits.

  Hmm, the key here is understanding Moore's distinction between what constitutes good and what things are good. Moore doesn't equate good with pleasure; instead, he says certain pleasures are good because they involve complex mental states. For example, appreciating beauty isn't just a simple sensation—it's a cognitive engagement with an object's qualities. Similarly, personal affection requires appreciating virtues in others. 

  The user mentioned Moore's thought experiment with two worlds: one beautiful, one ugly. Moore argues that the beautiful world's existence is better even if unobserved. This challenges hedonism, which values only conscious experiences. The friend might overlook this by focusing only on the pleasure aspect. 

  Also, organic unities mean the value of a whole isn't just the sum of parts. Aesthetic enjoyment combines the perception of beauty and the accompanying pleasure—neither alone has the same value. This structure prevents reducing good to mere pleasure. 

  The user's deeper need might be to grasp Moore's nuances to defend his philosophy against reductivist critiques. They might also seek a clearer articulation of non-natural properties versus natural ones. I should emphasize that Moore's intrinsic goods are complex states involving both cognition and emotion, not simple pleasures. Highlighting the unobserved world example and organic unities can show how Moore diverges from hedonism. 

  I should also address why Moore's view isn't conventional hedonism: he values the objects of pleasure (beauty, virtues) as part of the valuable whole, whereas hedonism values pleasure alone. The friend's critique misses this intentionality. Concluding that Moore's framework allows him to value pleasures contextually without contradiction.
answer: |-
  Your friend raises a compelling challenge, but Moore's position isn't a covert hedonism. Here's why Moore (and his defenders) would reject that reading, focusing on the key concepts your friend finds suspicious:

  1.  **The Crucial Distinction: Definition vs. Identification:**
      *   Moore's core argument is that "good" is *indefinable* – it cannot be *equated with* or *reduced to* any natural property (like pleasure, desire-satisfaction, or evolutionary fitness). This is the work of the Open-Question Argument (OQA). He insists "Is pleasure good?" remains a meaningful, open question, proving "good" and "pleasure" aren't synonymous.
      *   **However, Moore *does not* argue that pleasure cannot *be* good.** His point is that pleasure *isn't what we mean by* "good." Once we grasp the simple, non-natural property "good," we can *investigate* which complex states of affairs *possess* this property.
      *   **The Conclusion in "The Ideal":** When Moore identifies aesthetic enjoyment and personal affection as the *chief* intrinsic goods, he is *identifying* complex states that *happen to contain* pleasure as a significant *component*. He is *not* defining "good" as pleasure. Pleasure is part of *what is good*, not the *definition* of good.

  2.  **The Role of the Objects of Pleasure:**
      *   **Not Just Any Pleasure:** Moore doesn't say "all pleasure is good." He specifies *very particular kinds* of pleasurable experiences:
          *   **Aesthetic Enjoyment:** This isn't just raw sensory pleasure. It involves the *consciousness* (contemplation, appreciation) of *beauty itself* – an objective, complex quality of the object. The pleasure arises *from* and is *directed towards* this non-natural property (beauty).
          *   **Personal Affection:** This involves appreciating the *admirable mental qualities* (intelligence, kindness, etc.) of another person *for their own sake*. The pleasure is a consequence of this appreciation of objective good qualities in another.
      *   **The Object Matters:** For Moore, the *object* of the mental state (the beauty, the good qualities) is crucial to the value of the whole. A pleasure taken in ugliness or cruelty would *not* be intrinsically good. Hedonism, in contrast, typically values pleasure *regardless* of its source (provided it doesn't cause future pain).

  3.  **The Unobserved Worlds Thought Experiment:**
      *   **The Point:** This is Moore's *direct* argument against *pure* hedonism/psychological hedonism. He asks us to compare:
          *   World A: Supremely beautiful, but *never* experienced by any consciousness.
          *   World B: Utterly ugly (a "heap of filth"), but *never* experienced by any consciousness.
      *   **Moore's Claim:** World A is *intrinsically better* than World B, *even though no one ever feels pleasure (or pain) from contemplating either.*
      *   **Why this Blocks Hedonism:** If value resided *only* in conscious states of pleasure, then two unexperienced worlds should be of *equal* value (neither contains any pleasure or pain). Moore insists the *existence of beauty alone* possesses value, independent of anyone experiencing pleasure from it. This directly contradicts the hedonist claim that only conscious pleasure has intrinsic value. The value lies (at least partially) in the *existence of the beautiful object itself*.

  4.  **The Principle of Organic Unities:**
      *   **The Core Idea:** "The value of a whole bears no regular proportion to the sum of the values of its parts." The value of a complex state depends on how the parts are *related* within the whole.
      *   **Application Against Hedonism:**
          *   **Component Analysis:** In Moore's intrinsic goods (aesthetic enjoyment, personal affection), the whole is valuable, but its parts analyzed separately may not be:
              *   The *bare feeling* of pleasure considered in isolation? Moore is skeptical it has significant intrinsic value (it might even be neutral or slightly bad if divorced from context).
              *   The *existence of a beautiful object* considered in isolation (unperceived)? The thought experiment suggests it *does* have value, but less than when appreciated.
              *   The *contemplation of beauty* without pleasure? Moore might argue this has *some* value, but less than when accompanied by the appropriate pleasure.
          *   **The Synergy:** The *combination* of the consciousness of beauty *and* the appropriate emotional appreciation (pleasure) creates a whole (aesthetic enjoyment) whose value is *greater* than the sum of the values of the consciousness alone and the pleasure alone. The pleasure is *good* specifically *because* it is the *fitting response* to the perceived beauty. It's the *organic unity* of the object, the cognition, and the emotion that possesses the high intrinsic value.
          *   **Contrast with Hedonism:** Hedonism typically sees pleasure as the sole bearer of value. Other things (beauty, knowledge, virtue) are only valuable *instrumentally*, as means to produce pleasure. Moore insists that in the organic wholes he identifies, the *non-pleasant components* (the beauty itself, the admirable qualities themselves, the consciousness *of* these) are *intrinsic parts* of the valuable whole. They aren't just instruments *for* pleasure; they are *constitutive elements* alongside the pleasure in the intrinsically good state. Reducing the value solely to the pleasure component commits the fallacy of division.

  **Conclusion: Why Your Friend's Objection Isn't Fully Sound**

  Moore escapes the charge of covert hedonism because:

  1.  **He maintains the indefinability of "good":** He never defines "good" *as* pleasure. Pleasure is identified as a *component* within certain complex states that *are* good.
  2.  **He values the object, not just the feeling:** The beauty and the admirable qualities are essential, non-pleasant constituents of the valuable wholes. The unobserved worlds argument proves beauty has value independent of pleasure.
  3.  **Organic unities prevent reduction:** The value resides in the *whole complex state* (consciousness of beauty + appropriate pleasure). Isolating the pleasure component strips it of the context that makes *this specific pleasure* intrinsically valuable. Other pleasures (e.g., from cruelty) are not good.
  4.  **He rejects pleasure as the *only* good:** The unobserved beauty has value. Consciousness of beauty *without* pleasure might still have *some* value. Hedonism cannot accommodate this.

  **Where the Tension Lies (and Your Friend's Point Has Merit):**

  *   **Emphasis on Pleasure:** Moore *does* place enormous weight on pleasure *within* his highest goods. The pleasure is not incidental; it's a necessary constituent. This can *feel* like hedonism in practice, even if it's structurally different.
  *   **The "Neighborhood" of Hedonism:** His ideal *is* "in the neighborhood" of a refined hedonism, prioritizing certain mental states heavily involving pleasure. While structurally distinct, the practical implications share significant overlap with views like Mill's qualitative hedonism.
  *   **Complexity vs. Simplicity:** Moore's apparatus (non-natural properties, organic unities) *is* complex. Your friend is right that it *can be seen* as dressing up a conclusion valuing specific pleasures. Moore would retort that the complexity is necessary to accurately describe the irreducibility of value.

  **In essence:** Moore successfully avoids *defining* "good" as pleasure (escaping the OQA against hedonism). He identifies complex states containing pleasure as supremely good *because* they organically unify consciousness of objectively valuable non-natural properties (beauty, good qualities) with the fitting emotional response (pleasure). The unobserved worlds argument and the principle of organic unities are crucial tools preventing a collapse back into simple hedonism, as they establish value residing beyond just conscious pleasure and within the specific structure of the whole. Your friend's objection highlights the *practical* proximity to hedonism and the potential awkwardness of Moore's apparatus, but it doesn't refute the logical distinction Moore carefully (if perhaps problematically) constructs.
