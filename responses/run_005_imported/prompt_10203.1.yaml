answer: |-
  Based on Dummett's explicit arguments in *On Immigration and Refugees* and the principles he articulated, here's a reconstruction of how he would likely assess the contemporary UK policies you mention, clearly distinguishing his stated commitments from reasoned extrapolation:

  1.  **The Rwanda Scheme:**
      *   **Dummett's Explicit Commitment:** Central to Dummett's framework is the absolute primacy of compliance with international law, specifically the Refugee Convention (Geneva Convention). He viewed the right to seek asylum and protection from *refoulement* (return to persecution) as fundamental and non-negotiable. He was scathing about governments evading these obligations through procedural trickery or geographical loopholes.
      *   **Assessment:** The Supreme Court struck down the Rwanda scheme specifically because of the **real risk of *refoulement***. Dummett would have condemned this scheme **unequivocally and primarily on this basis.** It represents precisely the kind of attempt to evade legal and moral responsibilities that he denounced. The scheme's purpose – deterrence through removal to a third country – would have struck him as a cynical abdication of the UK's obligations and a violation of the spirit and letter of the Convention.
      *   **Source:** Direct application of his core principle of adherence to the Refugee Convention and condemnation of *refoulement* (explicitly stated throughout the book, especially in discussions of government evasion tactics).

  2.  **The "Invasion" Framing of Small-Boat Crossings:**
      *   **Dummett's Explicit Commitment:** Dummett explicitly engaged with the fear of being "swamped" (Thatcher's term) or "submerged." He conceded a *theoretical* "right not to be submerged," but defined it with **extreme narrowness**. He argued this right could only be invoked if immigration demonstrably threatened:
          *   The **demographic survival** of the existing population as a distinct entity.
          *   The **political institutions** of the state.
          *   The **economic system** to the point of collapse.
      *   **Assessment:** Dummett would have **vehemently rejected the "invasion" rhetoric.** The numbers arriving by small boats, while significant and challenging, are orders of magnitude below what would be required to meet his stringent test of "submersion." Even at their peak, they represented a tiny fraction of the UK population and had no plausible prospect of threatening the demographic, political, or economic survival of the nation. He would have seen this language as:
          *   **Factually dishonest:** Grossly exaggerating the scale and impact.
          *   **Demagogic:** Deliberately stoking irrational fear for political gain.
          *   **Dehumanizing:** Echoing the very racist scaremongering he documented in the post-war period (e.g., against Commonwealth migrants).
      *   **Source:** Direct application of his defined "right not to be submerged" and its extremely narrow criteria, combined with his documented critique of alarmist, racist rhetoric used historically to justify restrictionism.

  3.  **Post-Brexit Migration Figures (Peak 700k+) and Composition:**
      *   **Dummett's Explicit Commitment:** His submersion test focuses on *overall impact* threatening core national functions, not raw numbers alone. He was deeply concerned with **racism as the primary driver** of restrictionist policies, evidenced by his historical analysis of legislation targeting non-white Commonwealth citizens.
      *   **Assessment:**
          *   **Submersion Test:** Dummett would likely **dismiss the peak figure itself as irrelevant to the submersion argument.** His criteria require a *qualitative threat* to survival, not just a large number. The composition you note – work/study visas, humanitarian routes (Ukraine, Hong Kong) – is crucial. These groups:
              *   Are predominantly *authorized* and integrated through specific schemes.
              *   Do not represent an uncontrolled influx threatening institutions.
              *   Fill labour market gaps or fulfil specific moral/political commitments.
              *   Lack the perceived "threat" profile historically associated with racist fear-mongering (though Hong Kong arrivals faced some backlash).
          *   **The Asymmetry (Loosening Controls vs. Targeting Asylum Seekers):** This is where Dummett's core thesis faces a complex modern reality.
              *   **Explicit Commitment:** His historical thesis *is* that racism was the *overwhelming* driver of restrictionism. He documented how laws were crafted to exclude non-white British subjects while maintaining flows from (white) Old Commonwealth/Europe.
              *   **Reasoned Extrapolation:** Dummett would likely analyse this asymmetry through multiple lenses:
                  *   **Rhetoric vs. Policy:** He would note the **fierce, dehumanizing rhetoric ("invasion," "swarms") is overwhelmingly directed at a vulnerable, racially distinct group (asylum seekers arriving by boat, often from the Middle East/Africa)**, despite their small numbers relative to the total. This *rhetoric* aligns perfectly with his diagnosis of racism as a motivator.
                  *   **Policy Intent:** The *practical loosening* for work/study visas serves economic interests. He might view this as less driven by racial animus *per se* than by pragmatism/necessity, *but* crucially, **the absence of comparable inflammatory rhetoric towards these larger groups (who are also predominantly non-white) is telling.** The selective outrage targets the most vulnerable.
                  *   **The "Windrush" Lesson:** He would be acutely aware (as his book's historical analysis foreshadowed Windrush) that policies creating hierarchies of belonging based on entry route are inherently dangerous and can lead to catastrophic injustices, even for those initially "welcome."
                  *   **Ultimate Judgment:** While the *scale* of non-asylum migration wouldn't trigger his submersion test, Dummett would likely argue that **the government's intense focus on the small-boats issue, using racially charged "invasion" rhetoric while implementing legally dubious schemes (Rwanda), exposes a continuity with the racist undercurrents he identified in post-war policy.** The *target* of the restrictionism and fear-mongering has shifted, but the *mechanism* (stoking racialized fear about a specific "other" group to justify harsh measures) remains. The loosening elsewhere doesn't negate this; it highlights the *selectivity* of the hostility. He would likely see the Rwanda policy and "invasion" rhetoric as confirmation of his central thesis about racism's enduring role in asylum/immigration politics, even if the *overall* migration picture is more complex.
      *   **Source:** Submersion test application (explicit criteria). Analysis of rhetoric targeting a specific group vs. policy towards others is an *extrapolation* based on his core thesis about racism as the driver of restrictionism and his documented critique of dehumanizing language, applied to the current political discourse.

  **Summary of Dummett's Likely Assessment:**

  *   **Rwanda Scheme:** **Unequivocal condemnation** based on violation of Refugee Convention and *refoulement* risk (Explicit Commitment).
  *   **"Invasion" Rhetoric:** **Vehement rejection** as factually baseless scaremongering failing his extremely narrow submersion test and employing dehumanizing language historically linked to racism (Explicit Commitment + Application of Criteria).
  *   **Post-Brexit Figures/Composition:**
      *   **Submersion:** Peak figures, given their composition, **do not come close** to meeting his strict criteria for invoking the "right not to be submerged" (Application of Explicit Criteria).
      *   **Racism Thesis:** The **intense focus on small-boat asylum seekers using racially charged "invasion" rhetoric, alongside policies like Rwanda, despite their small numbers relative to other large migrant flows (including non-white ones), would be seen by Dummett as strong evidence confirming his thesis that racism remains a powerful driver of asylum restrictionism and demonization.** The loosening of controls elsewhere reflects pragmatic economic needs and specific foreign policy commitments (e.g., Hong Kong, Ukraine), but the *targeted hostility* towards the racially distinct asylum seekers arriving irregularly aligns with the historical pattern he documented. (This reconciliation is primarily **Reasoned Extrapolation** based on his core thesis and critique of rhetoric, applied to the observed asymmetry in political discourse and policy focus).

  In essence, Dummett would see the "invasion" rhetoric and Rwanda scheme not as responses to a genuine existential threat (which his submersion test shows is absent), but as contemporary manifestations of the same racially charged political tactics used to justify restrictive legislation throughout the post-war period, tactics he dedicated much of his life to fighting. The complexity of the overall migration picture wouldn't negate this core judgment about the specific policies and rhetoric targeting asylum seekers.
