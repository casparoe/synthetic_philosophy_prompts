  The real tension emerges when analyzing the apparent contradiction in current UK policy: loosening controls for large numbers of non-white migrants while targeting asylum seekers. Here I must distinguish between Dummett's documented historical thesis (restrictionism=racism) and speculative extension. His actual writings don't address such asymmetrical policies, but his framework suggests evaluating both the practical impact of policies and the dehumanizing rhetoric used against vulnerable groups.

