  Another angle: the pragmatic aspect. Dutch books are about avoiding sure losses. If you commit to an update rule that isn't conditionalization, you're open to a sure loss if someone knows that rule. Even if no one knows, the potential for loss exists. But the friend might argue that potential vulnerability without actual threat doesn't equate to irrationality.

  I need to consider deeper philosophical stances. Realism about credences versus instrumentalism. If credences are about dispositions to bet, then the diachronic book shows a flaw in your betting dispositions over time. But if credences are mental states, the bookie's knowledge might be an external factor.

