  I should break down the mechanics of the diachronic Dutch book. The bookie places bets at two times: before and after an event. The second bet exploits the conditionalization. If you don't update via conditionalization, the bookie can set up a combination of bets that guarantees a loss. But for this to work, the bookie must know how you'll update. This is different from the synchronic case, where the bookie only needs your current credences.

  The friend's objection highlights that the diachronic argument assumes the bookie has epistemic access to your future credences. In reality, no one can know your future beliefs. So, if the bookie knows your rule, it's like they have insider information, making the exploit possible. But does that mean conditionalization isn't a rational requirement?

