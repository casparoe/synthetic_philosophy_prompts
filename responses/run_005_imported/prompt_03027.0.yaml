  The fluorescent lights of the Processing Center hummed a flat, eternal note. Anya shifted on the cold metal bench, her file – a thin, translucent sheet pulsing with faint light – resting on her lap. Across the sterile expanse, a figure sat behind a featureless desk. It wasn’t quite human, more like a sculpture carved from obsidian fog given a sharp suit and an expression of profound, weary omniscience. Its nameplate read simply: **The Examiner**.

  "Anya Petrova," it stated, its voice smooth and devoid of inflection. "Deceased. Age thirty-two. Cause: Traffic collision."

  Anya nodded, the memory a raw bruise. The screech of tires, the blinding headlights, the terrifying silence after.

  "The purpose of this interview," the Examiner continued, "is not to judge the life you *lived*, but to verify the accuracy of the counterfactual truth-values assigned to your potentiality matrix prior to your conception."

  Anya blinked. "My... what?"

  "The *woulds*, Ms. Petrova. What you *would* freely choose, in any given circumstance. That is the data upon which your existence was actualized."

  The Examiner gestured, and the air above its desk shimmered. A complex, multi-dimensional lattice appeared, branching into infinite possibilities. At its core pulsed a single, unwavering point of light.

  "This," the Examiner indicated the point, "is you. Or rather, the *truth* of you. Before matter coalesced, before your parents met, this truth existed: Anya Petrova, in circumstance set X, *would* freely choose action Y. Always."

  Anya stared, a cold dread seeping in. "You're saying... God knew what I'd do? Before I was born?"

  The Examiner tilted its head, a gesture conveying mild correction. "Not a deity. Think of me as... Custodian. Archivist. And 'knew' is imprecise. We do not possess foreknowledge of *what will happen*. We possess complete knowledge of *what would happen* under every conceivable condition. Prior to any creation decision. Your entire life, Ms. Petrova, every choice you ever made, was simply the actualization of one specific path through the branching possibilities defined by these pre-existing counterfactual truths."

  It tapped the file. "Your life path was selected because, in the grand combinatorial optimization, your set of *woulds* contributed to a specific desired outcome sequence when actualized alongside billions of others."

  Anya felt dizzy. "But... I felt free. Choosing to study art, not engineering... leaving Mark... volunteering at the shelter... each time, it felt like *my* decision."

  "And it was," the Examiner affirmed. "Utterly free. Uncoerced. The truth of *what you would freely choose* in those exact circumstances was fixed long before you drew breath. We merely ensured those circumstances occurred. Your will operated precisely as predicted, because the prediction wasn't about the future – it was an eternal truth about *you*."

  She thought of standing in the rain outside Mark's apartment, heart pounding, knowing staying meant suffocation, leaving meant terrifying freedom. That raw, personal agony... was it just the playing out of a pre-existing script?

  "So," Anya whispered, her voice tight, "my life... my pain, my joy... it was just... *selected*? Because I fit?"

  "Because your *counterfactual responses* fit," the Examiner clarified. "A subtle but crucial distinction. The Custodian actualizes worlds based on maximizing desired outcomes using the known, fixed properties – the *woulds* – of all potential agents. Your actual choices were the inevitable result of your nature meeting the circumstances we provided."

  "Desired by whom?" Anya demanded, anger flaring.

  "The parameters are complex. Stability, complexity, certain aesthetic ratios of suffering and transcendence... ultimately, the optimization criteria are beyond your current comprehension. But rest assured, your free will was never violated. It was the *foundation*."

  The Examiner paused, its obsidian gaze seeming to look through her. "There is a... query. Often raised. The Grounding Objection."

  Anya waited, the dread solidifying.

  "What," the Examiner continued, its tone unchanged, "makes these counterfactual truths *true*? Before you existed, before any choices were made, what grounds the certainty of 'Anya Petrova *would* freely choose X in circumstance Y'?"

  The Examiner spread its hands, a gesture empty of answers. "We do not know. We only know they *are* true. As fixed and fundamental as mathematical truths. Perhaps they are woven into the fabric of possibility itself. Perhaps they are brute facts. We access them, map them, utilize them. But their ultimate origin... remains opaque. That is the unsettling core, Ms. Petrova. The certainty exists. The *why* of that certainty... does not."

  Anya felt unmoored. Her life, her very identity, felt like a shadow cast by an unseen, inexplicable light. Her choices were real, yet predetermined in their essence. Her freedom was genuine, yet its boundaries were set in stone before time began. And the reason *why* she was *this* Anya, with *these* *woulds*, was lost in an eternal, silent void.

  "Why show me this?" she asked, her voice hollow.

  "Verification protocol," the Examiner stated. "Occasionally, actualized choices exhibit... statistical deviations. We investigate. Your file flagged an anomaly."

  Anya frowned. "An anomaly? I did what I felt was right, always."

  "Indeed. And your choices aligned perfectly with your pre-defined counterfactuals. The anomaly lies elsewhere." The Examiner pointed to a dense cluster of branching paths on her potentiality matrix, all converging on a single, catastrophic node. "In 97.832% of potentialities involving you facing imminent, unavoidable societal collapse combined with extreme resource scarcity... you *would* have freely chosen self-sacrifice to save a small group, primarily children."

  Anya stared. It felt alien, yet resonant. In her quiet life, she'd never faced such a test. But the image it conjured – shielding others – felt... true. Like a hidden facet suddenly revealed.

  "That path," the Examiner continued, "was weighted heavily in your favorability score. Your propensity for self-sacrifice under duress was a key factor in your actualization. The anomaly is that the specific circumstances triggering this high-value counterfactual *never manifested* in your actual timeline."

  Anya processed this. The noble death that defined her potential value... never happened. She died in a mundane accident. "So... I was selected for something I never actually *did*? Just... something I *would* have done?"

  "Precisely. Your actual life contained only lower-tier expressions of your counterfactual profile. Volunteering, kindness, minor sacrifices. Valuable, but not the peak utility predicted. Hence, the flag."

  A hysterical laugh bubbled in Anya's throat. "So my life was chosen based on a grand gesture I *might* have made, but didn't? And the reason *why* I *would* have made it... is a complete mystery?"

  The Examiner inclined its head. "That is the summation. Your free will was authentic. Your choices were yours. Their ultimate foundation, and the reason *this* specific 'you' with *these* specific 'woulds' was actualized based on an unfulfilled potential... remains grounded only in its own inexplicable truth."

  It tapped the desk. The shimmering lattice vanished. "Verification complete. No error in actualization. Proceed to Integration."

  A door hissed open beside the bench, revealing soft, golden light. Anya didn't move. The fluorescent hum seemed louder, the sterile air colder. She looked down at her hands – the hands that painted, that held shelter dogs, that pushed away from a stifling love. Hands that were free, yet whose every possible movement was cataloged before the universe began. Chosen, in part, for a heroism demanded by no crisis.

  The golden light beckoned, promising peace, oblivion, perhaps understanding. But Anya remained frozen on the bench. The freedom felt like a cage whose bars were made of pure, uncaused certainty. The Examiner watched, its expression one of infinite, weary knowledge, waiting for her next move – the move it already knew, with absolute, groundless certainty, she *would* make.

  She screamed. Not in fear of the light, but at the horrifying, beautiful, meaningless precision of it all. The sound echoed briefly in the sterile room before being swallowed by the vast, indifferent hum of the machinery that knew, beyond all doubt, every note she would ever sing.

  She screamed until the room swallowed it.
