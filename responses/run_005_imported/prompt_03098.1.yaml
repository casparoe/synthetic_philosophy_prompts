prompt: |-
  Had a build break today from a circular dependency, which sent me down a Wikipedia hole last night on 'metaphysical grounding' (the idea that some facts hold because other, more fundamental facts do). Feels basically identical to a dependency graph to me — no cycles allowed, and it has to bottom out in leaf packages with zero deps, or you can't get a valid topological order out of it. So it seems like grounding chains have to be well-founded too, as a matter of pure logic rather than an open question — there's gotta be some fundamental, ungrounded layer that everything else reduces to eventually. Given that, I dont really get why philosophers still treat 'infinitism' about grounding (chains going down forever, nothing fundamental) as a serious rival to 'foundationalism' instead of just a basic type error — isn't infinitism just the metaphysics version of recursion with no base case, which blows the stack? Feel like I'm missing something here but can't tell what.
