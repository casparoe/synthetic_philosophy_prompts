answer: |-
  You've hit on a profound and actively debated point in metaphysics! Your analogy to dependency graphs is insightful, and many philosophers *do* argue that grounding chains must terminate in fundamental facts (foundationalism). However, infinitism isn't dismissed as a "type error" because metaphysics operates under different constraints than software or formal logic. Here's why infinitism remains a contender:

  ### 1. **The Nature of "Bottoming Out"**
     - In software, leaf packages exist because we *define* them (e.g., primitive libraries, OS calls). But in metaphysics, **what counts as "fundamental" is contentious**. If every proposed "fundamental" fact (e.g., physical laws, logical axioms) seems explainable by something deeper, infinitism avoids the arbitrariness of declaring "this layer needs no explanation."
     - **Example**: Why do quantum fields exist? Foundationalism says "they just do." Infinitism says "because of a prior fact X," and so on. Neither is logically incoherent—just unsatisfying to different intuitions.

  ### 2. **Infinite Regress ≠ Circularity**
     - Circular dependencies (A → B → A) are vicious because they prevent resolution. But **infinite descent (A₁ ← A₂ ← A₃ ← ...)** has no cycle—it’s a linear chain with no start. This avoids contradiction, even if it feels incomplete.
     - **Software analogy**: Imagine a function `f(n)` calling `f(n+1)` infinitely. It won’t "blow the stack" if the runtime supports unbounded recursion (e.g., lazy evaluation). Metaphysics asks: *Could reality be structured like this?* Not whether we can compute it.

  ### 3. **Coherent Models of Infinitism**
     Philosophers like **Peter Klein** defend infinitism by arguing:
     - **Justification**: Beliefs can be infinitely justified (A justified by B, B by C, etc.) without needing "unjustified foundations."
     - **Grounding**: Chains like "wholes grounded in parts" might regress infinitely (quarks → atoms → molecules → ...) without logical flaw. Reality might not require "simples."
     - **Mathematical analog**: Non-well-founded set theory allows sets like Ω = {Ω}, or infinite descending membership chains. These are consistent in ZFC− (Zermelo-Fraenkel without the Axiom of Foundation).

  ### 4. **Operational vs. Ontological Constraints**
     - **Software fails** with cycles/infinite recursion because it runs on bounded systems. But metaphysics asks about **explanatory or ontological structure**, not computation. An infinite grounding chain might "exist" statically without being "traversed."
     - **Example**: The infinite sequence 1/2, 1/4, 1/8, ... sums to 1. Each term "grounds" the sum, but there’s no "first" term. Metaphysical infinitism could work similarly.

  ### 5. **Foundationalism Has Its Own Problems**
     - **Brute facts**: Foundationalism requires unexplained primitives. Why accept "this is fundamental" if it seems arbitrary?
     - **Emergence**: If complex phenomena (e.g., consciousness) "emerge" from physics, is that grounding—or just correlation? Infinitism avoids declaring emergence as a stopping point.

  ### Where You're Right
  Your intuition aligns with **mainstream metaphysics**: foundationalism dominates because infinitism feels explanatorily empty. Grounding is widely assumed to require well-foundedness (see Schaffer's "Truthmaker Fundamentalism"). But dismissing infinitism as *illogical* overreaches—it’s more about **explanatory adequacy** than formal consistency.

  ### Philosophers' Stance
  Infinitism persists not because philosophers ignore logic, but because:
  - Foundationalism’s "brute facts" are seen as equally problematic.
  - Infinite chains aren’t *contradictory*, just counterintuitive.
  - It challenges us to refine what "explanation" or "dependence" means.

  **In short**: Your dependency graph analogy is apt for *practical* systems, but metaphysics explores whether reality *must* follow those rules—or if it can tolerate "infinite recursion" as a feature, not a bug. The debate continues because neither side has a knockout argument.
