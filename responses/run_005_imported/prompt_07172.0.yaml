answer: |-
  You're right to push back against the "too easy" separation. There's a compelling, substantive argument that Frege's philosophical absolutism and his toxic politics share deep structural and methodological roots. Here's the case for a strong connection, focusing on the core principles:

  1.  **The Rejection of Subjectivity and Pluralism as Fundamentally Corrupting:**
      *   **Philosophy:** Frege's *anti-psychologism* is foundational. He vehemently rejected the idea that logic, truth, or meaning could be grounded in individual minds, subjective experiences, or contingent psychological processes. For Frege, this introduced dangerous relativity and instability. Truth had to be *objective*, *immutable*, and *mind-independent*, residing in the "third realm" of abstract, timeless *Thoughts* (*Gedanken*). Only this guaranteed absolute, universal validity. Plurality of perspectives on logic or meaning was, for him, a sign of error, not legitimate difference.
      *   **Politics:** His nationalism and anti-democracy stemmed from a parallel horror of pluralism and subjectivity in the political sphere. Democracy, especially Weimar's messy, pluralistic democracy, represented the rule of the irrational masses, subjective whims, compromise, and factionalism. This mirrored the "chaos" of psychologism. He longed for a unified, homogeneous *Volk* (people) guided by a single, objective truth embodied in a strong leader or monarch – an absolute political principle analogous to the absolute logical principle. Jewish people, for him, represented a "foreign," destabilizing element undermining this desired cultural and racial homogeneity – a dangerous subjectivity threatening the objective purity of the German nation, much like psychological subjectivity threatened logical purity.

  2.  **The Demand for Foundational Purity and Exclusion:**
      *   **Philosophy:** Frege's entire project was about establishing logic and mathematics on absolutely secure, pure foundations. This required rigorously excluding anything deemed impure, contingent, or subjective. The "third realm" is pristine, accessible only to pure reason. Contamination by human psychology or historical context was the enemy. His logic aimed for a single, perfect system reflecting the one true structure of reality.
      *   **Politics:** His antisemitism and nationalism reflect this same drive for purity and exclusion. Jews were cast as the contaminating "other," polluting the purity of the German *Volk* and its culture. His vision of the state required the exclusion or assimilation of elements deemed incompatible with the homogeneous whole. Pluralism itself was an impurity to be eradicated in favor of a single, unified national will and identity – the political counterpart to the single, unified logical system.

  3.  **Absolutism and the Rejection of Mediation/Negotiation:**
      *   **Philosophy:** Frege's "one true logic" admits no negotiation, compromise, or alternative perspectives. There is *the* correct way to reason, *the* correct meaning of a proposition. His sharp distinctions (Sense/Reference, Concept/Object, Function/Argument) often operate in binary, exclusionary ways. Ambiguity and context-dependence were problems to be solved, not inherent features of language or thought.
      *   **Politics:** His anti-democracy stems directly from a rejection of the messy, negotiated compromise inherent in democratic politics. Democracy relies on deliberation, pluralism, and finding temporary agreements among differing viewpoints – precisely the kind of contingent, non-absolute process Frege's philosophy abhorred. His yearning for an absolute monarch or leader reflects the desire for a single, authoritative source of truth and decision-making, mirroring the singular authority of logic and the objective third realm.

  4.  **Methodological Parallel: Rigor as Control:**
      *   **Philosophy:** Frege's revolutionary formal system (the *Begriffsschrift*) wasn't just a tool; it was an attempt to *control* thought by eliminating ambiguity and enforcing absolute precision. It was a mechanism for achieving certainty by excluding the subjective and impure.
      *   **Politics:** His authoritarian political leanings can be seen as the desire for a similar mechanism of control in the social and political realm. A strong, centralized authority imposing order and homogeneity is the political equivalent of the *Begriffsschrift* imposing logical order – both aimed at eliminating the perceived chaos of subjectivity and difference.

  **The Core Argument Synthesized:**

  Frege's philosophical system is built on a profound **epistemological and metaphysical absolutism.** He posits a realm of perfect, timeless objectivity accessible only through pure reason, demanding a single, universal logic that brooks no dissent or alternative interpretation. This structure inherently **devalues the contingent, the contextual, the plural, and the perspectival** – viewing them not as features of reality to be understood, but as errors or corruptions to be eradicated for the sake of foundational purity and certainty.

  His political views are **not an accidental add-on but a direct expression of this same absolutist mindset applied to the social and political world.** Democracy, pluralism, and cultural/ethnic diversity appear to him as the political manifestations of the very same subjectivity, contingency, and lack of foundational purity that he fought against in logic. His antisemitism provided the specific "other" to embody the contamination threatening the desired pure, absolute unity – whether that unity was of logical thought or the German nation.

  **Therefore, the connection isn't merely biographical; it's structural and methodological.** The drive for absolute, objective, singular truth and purity, combined with the rejection of pluralism and subjectivity as fundamentally corrupting forces, provides a coherent intellectual framework that manifests in both his groundbreaking logic/semantics *and* his repugnant politics. They are two facets of the same absolutist worldview. To champion the philosophical absolutism while condemning the political absolutism requires ignoring the core intellectual impulse that generates both. Dummett's discomfort was likely rooted in an intuitive grasp of this deep coherence. The separation *is* too easy; it fails to confront the potential dangers inherent in an uncompromising philosophical drive for absolute purity and singular truth when it escapes the bounds of formal systems and enters the human world.

  This argument doesn't claim his logic is "wrong" *because* of his politics, nor that his politics are *logically derived* from his philosophy. It argues that both stem from a shared underlying intellectual temperament and commitment to absolutism that makes the co-existence of his brilliant logic and vile politics not coincidental, but coherent within his own framework.
