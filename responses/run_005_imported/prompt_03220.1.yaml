  hey, random question from my phil of language seminar (we're deep in the Kripke weeks rn). I think I've got the necessary a posteriori thing figured out: since 'Hesperus' and 'Phosphorus' are rigid designators for the same planet, they pick out that planet in every possible world, so by the proof our professor showed us (Leibniz's law + rigidity) 'Hesperus is Phosphorus' has to be necessarily true. and since its an identity statement between two rigid designators, doesnt that automatically make it a posteriori too? like isnt that basically the definition -- necessary a posteriori just means a true identity statement between rigid designators?

  but then i got stuck: wouldnt that mean 'Hesperus is Hesperus' should also count as necessary a posteriori, since its also an identity statement where both terms are rigid designators referring to the same thing in every world? that feels obviously wrong, i feel like anyone could know that one just by thinking about it, no telescope required, but i cant figure out where the reasoning actually breaks down. can you help me untangle this?
