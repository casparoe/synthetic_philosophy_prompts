prompt: |-
  I'm taking a Just War Theory seminar this semester, and this week we read Anscombe's old pamphlet "Mr. Truman's Degree" back to back with the supreme emergency chapters from Walzer's Just and Unjust Wars, and I've been chewing on how the two actually relate ever since our discussion section got kind of heated about it. Anscombe's take is basically absolutist: Truman is a flat-out murderer for Hiroshima and Nagasaki because intentionally killing innocents is never permissible no matter the payoff, period - which is basically the same instinct behind her coining "consequentialism" as a term of abuse a couple years later. Walzer seems to want to keep most of that same rule (don't target civilians) but he carves out a "supreme emergency" exception for cases where a whole political communitys survival is genuinely on the line, like Britain in 1940, and then argues, if I'm getting this right, that Hiroshima doesn't actually clear that bar since Japan was already beaten by August '45 - so he ends up condemning Truman too, just by a totally different road than Anscombe does.

  For my response paper I don't just want to summarize both positions side by side, I want to actually stack them up against each other. Can you compare the structure of Anscombe's absolutism with Walzer's supreme-emergency framework - like what's actually doing the moral work in each one - and then settle something a couple people in my section were arguing about: is the supreme emergency exception a genuinely different, principled kind of reasoning from the consequentialism Anscombe was attacking, or does it secretly collapse into exactly that the moment you let necessity override the rule even once? End with your own verdict on which of the two gives the more defensible account of what, if anything, made Hiroshima wrong.
