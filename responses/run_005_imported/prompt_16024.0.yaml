  Okay, the user is in a Just War Theory seminar and needs help comparing Anscombe and Walzer on the morality of Hiroshima/Nagasaki. They've read Anscombe's "Mr. Truman's Degree" and Walzer's supreme emergency chapters, and their discussion section got heated. They want to write a response paper that doesn't just summarize but stacks the two positions against each other. Specifically, they need to compare the moral structure of each argument and determine if Walzer's exception is meaningfully different from consequentialism.

  First, I need to recall Anscombe's position. She's absolutist: intentionally killing innocents is always murder, no exceptions. That's a deontological stance. For her, Truman is a murderer because he deliberately targeted civilians. She coined "consequentialism" as a pejorative, so any ends-justify-means reasoning is unacceptable. The moral work here is the absolute prohibition on intentional harm to innocents, grounded in moral absolutes.

  Then Walzer. He agrees civilians shouldn't be targeted but introduces a "supreme emergency" exception. This applies when a political community's survival is at immediate risk, like Britain in 1940. He argues Hiroshima didn't meet this because Japan was already defeated. So he condemns Truman but through a different path. The moral structure here is a threshold deontology: rules hold until a catastrophic tipping point. The exception is tied to community survival, not just consequences. 

  Now, the key question: is Walzer's exception just hidden consequentialism? Anscombe would say yes because overriding the rule even once opens the door to utilitarianism. But Walzer insists it's a different category—defending a way of life against ultimate evil, not mere cost-benefit. The moral work is the value of the community as a collective entity, which can create a temporary moral suspension. 

  The user's classmates are debating whether this collapses into consequentialism. I need to analyze if Walzer's framework is principled or slippery. His conditions (imminent threat, survival at stake, last resort) aim to prevent abuse, but the threshold is still consequentialist in assessing the stakes. However, the collective aspect adds a non-utilitarian layer. 

  For the verdict, which account is more defensible for Hiroshima's wrongness? Anscombe's absolutism is clear but inflexible. Walzer's exception seems necessary for real-world crises but risks misuse. For Hiroshima, Walzer's point that Japan was already beaten is historically strong. Anscombe's stance might be more ethically pure, but Walzer's is more practical. The user should argue that Walzer's framework is distinct but must be applied cautiously, and Hiroshima fails his own test. 

  I should also address why Hiroshima was wrong. Both condemn it, but Anscombe focuses on intent, Walzer on the lack of supreme emergency. The user might need to evaluate which reasoning is stronger. Historical context matters: Japan's surrender likelihood, alternatives like blockade or demonstration. Walzer's position allows for exceptions but requires strict criteria, making his condemnation of Truman more nuanced. 

  The user's deeper need is to present a nuanced analysis showing they understand both theories' structures and can critically engage with the collapse argument. They need a clear verdict that's supported by reasoning, not just opinion. Highlighting how each theorist's moral foundations lead to their conclusions will strengthen the paper.
answer: |-
  Here's a breakdown comparing Anscombe and Walzer on the Hiroshima issue, analyzing their moral structures, the "consequentialism collapse" question, and a verdict:

  **1. The Moral Structure of Each Argument:**

  *   **Anscombe (Absolutist Deontology):**
      *   **Core Moral Work:** The absolute, exceptionless moral prohibition against *intentionally killing the innocent*. This is a *deontological constraint* derived from natural law or fundamental moral principles about the inviolability of innocent human life. The act itself (intentional killing of innocents) is intrinsically evil, regardless of circumstances or consequences.
      *   **Mechanism:** The principle acts as a *side-constraint* on action. It cannot be outweighed, traded off, or overridden by any potential good outcome or avoided evil. The intention to kill innocents defines the act as murder.
      *   **Application to Hiroshima:** Truman's decision involved the deliberate choice to kill non-combatant civilians as a means to an end (ending the war). This intention makes it murder, full stop. Arguments about saving lives overall, shortening the war, or preventing invasion are morally irrelevant because they are consequentialist justifications attempting to override the absolute prohibition.
      *   **Strength:** Moral clarity, prevents slippery slopes, upholds the dignity of the individual absolutely.

  *   **Walzer (Threshold Deontology with "Supreme Emergency"):**
      *   **Core Moral Work:** A strong *presumption* against targeting civilians/innocents, rooted in the *rights* of individuals (especially the right to life) and the fundamental distinction between combatants and non-combatants essential to the *jus in bello* rules of Just War Theory. However, this presumption can be overridden under *extremely specific, catastrophic conditions*.
      *   **Mechanism:** *Threshold Deontology*. Moral rules hold *until* a certain threshold of potential harm/evil is reached. The "supreme emergency" exception functions when two conditions are met simultaneously:
          1.  **Imminence:** The threat is *imminent* and catastrophic (not speculative).
          2.  **Magnitude:** The evil threatened is of an *ultimate nature* – the literal *survival* of a political community *as a community* (not just saving lives, but preserving its shared life and values) is at stake, *and* the threat emanates from a regime embodying an *ultimate evil* (like Nazism).
      *   **Application to Hiroshima:** Walzer argues Britain in 1940 met these conditions (imminent Nazi conquest threatening the very existence of Britain as a free society facing an ultimate evil). Japan in August 1945 did *not*:
          *   Japan was defeated; its survival as a political community wasn't imminently threatened by destruction *as* a community (unlike Nazi plans for conquered peoples).
          *   The threat wasn't of ultimate evil *to the world* in the same way Nazism was; the primary goal was forcing surrender, not preventing the annihilation of the US as a political community.
          *   Alternatives existed (continued blockade, conventional bombing, awaiting Soviet entry, *possibly* a demonstration).
          *   Therefore, Hiroshima/Nagasaki violated the still-binding prohibition against targeting civilians.
      *   **Strength:** Acknowledges the terrifying reality of existential threats where rigid absolutism might seem morally bankrupt, provides a (theoretically) limited framework for extreme situations, maintains the core rules as the overwhelming norm.

  **2. Is the Supreme Emergency Exception Just Covert Consequentialism?**

  This is the core tension. Here's the argument and counter-argument:

  *   **The Case for Collapse (Anscombe's Implicit View & Classmates' Argument):**
      *   **The Logic:** Any time you allow consequences (no matter how catastrophic) to override a deontological rule ("Don't intentionally kill innocents"), you are engaging in consequentialist reasoning. You are *necessarily* weighing the evil of killing innocents against the evil to be avoided or the good to be achieved. The moment Walzer says "this consequence is *so bad* that the rule no longer applies," he has made consequences the ultimate arbiter. The "supreme emergency" is *defined* by its consequences (imminent, ultimate catastrophe). Therefore, the exception *is* a consequentialist calculation smuggled in under a dramatic label.
      *   **Slippery Slope:** Once you open the door *at all*, even with stringent criteria, you risk the criteria being stretched. What counts as "ultimate evil"? How "imminent" is imminent? What constitutes "survival of the community"? History shows such exceptions can be invoked too readily (e.g., Hiroshima itself, arguably).

  *   **Walzer's Defense Against Collapse (Principled Distinction):**
      *   **Not Maximizing Good, Preventing Ultimate Evil:** Walzer argues supreme emergency isn't about *optimizing* outcomes or achieving a positive good (standard consequentialism). It's about *sheer survival* against *absolute evil*. It's a *defensive* act of last resort against being utterly destroyed *as a moral/political community*. The calculation isn't "Does this produce more good?" but "Is this the only way to prevent our complete annihilation and enslavement by an utterly evil regime?"
      *   **The Role of Community:** The moral weight isn't *just* on lives saved/lost (utilitarianism), but on the preservation of a *shared way of life and values* against extinction. This introduces a non-consequentialist element – the value of the community *as such*.
      *   **Temporary Moral Suspension, Not Abrogation:** He frames it as a temporary, tragic *suspension* of the rules under unbearable duress, a recognition of a realm "where moral limits lose their grip," not a *repudiation* of the rules or a new positive moral principle. The rules reassert themselves immediately afterward. It's an *emergency override*, not a recalibration of the moral scales.
      *   **Strict Criteria:** The conditions (imminence, ultimate threat, ultimate evil, last resort) are designed to be so stringent that they are *qualitatively different* from ordinary cost-benefit analysis and apply only in truly unique, civilization-threatening moments.

  **Verdict: Which Account Offers the More Defensible Explanation of Hiroshima's Wrongness?**

  Both condemn Truman, but **Walzer's framework provides the more defensible and comprehensive account of why Hiroshima was wrong** in this specific historical context, *even though Anscombe's absolutism has significant moral force*.

  *   **Why Walzer is More Defensible Here:**
      1.  **Acknowledges Reality Without Surrender:** Anscombe's absolutism, while pure, risks seeming morally callous or practically untenable in the face of genuine existential threats (like Britain 1940). Walzer grapples with this terrifying reality without abandoning core principles entirely. His condemnation of Hiroshima feels *earned* because he establishes a clear, high-threshold exception and *then* argues convincingly that Hiroshima failed to meet it. He shows *why* the situation in August 1945 was different from 1940/41.
      2.  **Better Captures the Historical Wrong:** The historical consensus largely aligns with Walzer's assessment: Japan *was* defeated, alternatives *did* exist, the primary motivation shifted towards intimidation (especially of the USSR) and bureaucratic momentum. Hiroshima wasn't a desperate act for survival against ultimate evil; it was a brutal expediency used against a beaten foe. Walzer's framework, focusing on the *lack* of a genuine supreme emergency, directly targets this historical reality. Anscombe condemns it correctly, but her reasoning would condemn *any* intentional civilian killing, regardless of context, which doesn't specifically illuminate the *particular* wrongness of Hiroshima *in its actual context*.
      3.  **Avoids the Pitfalls of Pure Absolutism in Extreme Cases:** While Walzer risks the "consequentialist collapse," his stringent criteria offer a more plausible (if dangerous) way to navigate the unthinkable than Anscombe's absolute prohibition, which would demand Britain accept annihilation rather than, say, bomb a German city if it were the *only conceivable way* to stop an imminent Nazi invasion likely to result in genocide. Walzer's position reflects the tragic choices leaders *believe* they face.
      4.  **Nuance on "Wrongness":** Walzer allows us to say Hiroshima was profoundly wrong *as a violation of the core rules of war* (which hold except under the most extreme conditions, not met here), while Anscombe must say it was wrong *simpliciter* as murder, placing it categorically alongside any other intentional killing of innocents. Walzer's distinction feels more attuned to the specific moral gravity of *war crimes* within the framework of conflict.

  *   **Why Anscombe Still Matters (and the Caveat):**
      *   Anscombe provides the crucial bedrock principle: intentionally killing innocents is a fundamental evil. Walzer *builds upon* this foundation; he doesn't reject it. Her absolutism is the necessary anchor that prevents Walzer's exception from becoming routine.
      *   **The Consequentialist Caveat:** The classmates arguing Walzer collapses into consequentialism have a powerful point. The *trigger* for the exception is inherently consequentialist (imminent, ultimate catastrophe). Walzer tries to ring-fence it with qualitative distinctions (community survival, ultimate evil), but the *mechanism* of overriding the rule based on anticipated consequences remains. Anscombe correctly identifies this as a fundamental concession. **Walzer's framework is distinct *in aspiration and limited scope* from crude consequentialism, but it unavoidably relies on a catastrophic-consequence-based override of a deontological rule.** It is a *form* of threshold consequentialism dressed in the language of communal survival against evil.

  **Conclusion:**

  For your response paper, argue that while Anscombe establishes the vital, non-negotiable core principle against targeting innocents, Walzer's "supreme emergency" framework, despite flirting with consequentialist logic, provides a more defensible and historically nuanced account of *why* Hiroshima was specifically wrong. Walzer successfully carves out a plausible (though perilous) space for confronting ultimate evil without abandoning the rules of war, and then demonstrates convincingly that the bombing of Japanese cities in August 1945 fell far outside this narrow exception, constituting a clear and unjustifiable violation of the prohibition against targeting civilians. The enduring power of Anscombe's absolutism lies in its role as the essential foundation that Walzer's exception precariously (and controversially) overrides only in the most unimaginable circumstances.
