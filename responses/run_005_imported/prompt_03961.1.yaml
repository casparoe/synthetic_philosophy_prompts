prompt: |-
  So for work I've been getting into causal inference (do-calculus, DAGs, the whole Judea Pearl toolkit) and went down a rabbit hole into the philosophy behind it. Turns out there's a real disagreement between old-school counterfactual theorists (Lewis: A causes B if B wouldn't have happened without A, cashed out via closest possible worlds) and interventionists like Woodward, who define causation through hypothetical interventions on a causal structure instead. Can you write me a dialogue between one person from each camp, arguing it out at a whiteboard? Make the interventionist actually answer the classic circularity objection (that 'intervention' is already a causal notion your smuggling in), and make the counterfactualist defend Lewis's similarity-between-worlds ranking against the charge that its basically reverse-engineered just to get the right answers. Bonus if they hit a case like preemption where the two theories actually diverge. Keep it tight, not a full essay.
reasoning: |-
