answer: |-
  Here's the strongest version of your argument against van Inwagen's organicism, focusing on the uniquely devastating cost of **indeterminate cardinality** compared to the costs of universalism or nihilism. The core claim is that van Inwagen's position doesn't offer a stable, coherent "middle ground" but instead incurs a theoretical cost that fundamentally undermines ontology in a way the "extremes" do not:

  1.  **The Uniquely Devastating Nature of Indeterminate Cardinality:**
      *   **Undermining the Core Task of Ontology:** Ontology fundamentally asks "What exists?" and "How many fundamental/concrete things are there?". Accepting *indeterminate cardinality* means admitting there is *no determinate fact of the matter* about the answer to this core question in certain scenarios. This isn't just a strange consequence; it's a failure state for the ontological project itself. It renders the quantifier ("there exists") vague at its core application.
      *   **Sider's Master Argument (The Meaning of the Quantifier):** Ted Sider's central critique cuts deepest here. If it can be indeterminate whether *there exists* an object composed of certain particles (because it's indeterminate whether they constitute "a life"), then the *meaning* of our existential quantifier ("there exists") itself must be vague. But if the quantifier is vague, then *all* ontological questions become potentially indeterminate, not just composition questions. This leads to **global ontological indeterminacy**. Van Inwagen's solution to the SCQ, by introducing vagueness at the level of *existence*, potentially infects the entire ontological enterprise with indeterminacy. This is radically different from vagueness in predicates (like "bald").
      *   **Epistemic and Practical Paralysis:** How do we *count* concrete objects in the world if cardinality can be indeterminate? This isn't just a philosopher's puzzle; it has downstream consequences for reasoning about identity over time, persistence, responsibility, and even scientific modeling (e.g., counting organisms in ecology, artifacts in archaeology). Universalism gives a clear (if huge) count; Nihilism gives a clear (if sparse) count; Organicism sometimes gives *no determinate count at all*. This indeterminacy isn't resolvable by better science; it's built into the *meaning* of "object" on this view.

  2.  **Comparing Costs: Why Indeterminate Cardinality is Worse than the "Extremes":**
      *   **Universalism (Lewis):** Yes, it posits countless arbitrary objects (trout-turkeys, car-boat-fusions). This is **ontologically profligate**. However:
          *   **It's Determinate:** There is a precise, knowable (in principle) number of objects in any situation. The quantifier has a sharp meaning. Ontology, while bloated, is *stable*.
          *   **The Bloat is Contained:** The profligacy is a cost *within* ontology. It doesn't undermine the *framework* for doing ontology itself. We can still meaningfully ask and answer "What exists?" and "How many?" – the answer is just huge. The cost is extravagance, not incoherence.
          *   **Counter-Cost:** The profligacy is often overstated. Lewis provides principled reasons (Mereological Harmony) for accepting it, and the "strange" objects largely don't interact causally or epistemically with us in ways that matter.
      *   **Nihilism:** Yes, it denies the existence of ordinary composite objects like tables, mountains, and (crucially) organisms. This is **radically revisionist** of common sense.
          *   **It's Determinate:** There is a precise, knowable (in principle) number of fundamental particles/simples. The quantifier is sharp. Again, ontology is stable.
          *   **Revisionism Can Be Managed:** Nihilists offer paraphrases ("There are particles arranged tablewise") to recover the truth of ordinary statements without ontological commitment to tables. While deeply counterintuitive, this strategy preserves determinacy and avoids the core ontological indeterminacy. The cost is denying the existence of things we talk about, not making existence itself vague.
          *   **Counter-Cost:** Van Inwagen *also* denies the existence of tables and mountains! His ontology (only simples and living organisms) is *almost* as revisionist as nihilism for non-living composites. He pays the revisionism cost *plus* the indeterminacy cost for the very objects he *does* allow (organisms).

  3.  **Van Inwagen's "Bullet Biting" is Fatal:**
      *   **Admission is Not Absolution:** Your friend is correct that van Inwagen explicitly bites the bullet on indeterminacy (e.g., borderline cases of life). But acknowledging the cost doesn't make it acceptable or less severe. Highlighting the problem doesn't solve it; it confesses it.
      *   **The Source of the Vagueness is the Core Criterion:** The indeterminacy arises *directly* from the central pillar of his theory – "constituting a life." If the criterion for composition (and thus existence) is vague ("life"), then composition (and thus existence) is vague. This isn't a peripheral issue; it's foundational.
      *   **No Advantage Gained:** Van Inwagen aimed to provide a principled, non-arbitrary answer to the SCQ that respected common sense about organisms. However, by making the existence of organisms themselves sometimes indeterminate, he *loses* the determinacy and objectivity he sought for his core ontological commitments. He pays the revisionist cost for artifacts *and* introduces crippling indeterminacy for the very things (organisms) he wants to privilege.

  **Conclusion:**

  Van Inwagen's organicism doesn't successfully navigate a "middle path" between the extremes. Instead, it pays *most* of the revisionist cost of nihilism (denying non-living composites) *plus* the uniquely devastating cost of **indeterminate cardinality**. This indeterminacy, stemming from the vagueness of "life" infecting the quantifier itself (per Sider), fundamentally undermines the possibility of a coherent, determinate ontology in a way that the ontological extravagance of universalism or the radical revisionism of nihilism do not. Lewis's bloated ontology and the nihilist's denial of tables are strange and counterintuitive, but they preserve a world where "existence" has a sharp meaning and cardinality is always determinate – the bedrock upon which ontology stands. Van Inwagen, by sacrificing this bedrock for his criterion, incurs a cost that is ultimately *worse* than either extreme. He doesn't come out ahead; he offers a solution that potentially dissolves the very framework needed to pose the Special Composition Question coherently. The price of indeterminate existence is simply too high for any sustainable ontology.
