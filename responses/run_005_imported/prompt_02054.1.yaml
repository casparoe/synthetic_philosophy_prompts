prompt: |-
  so i've been kind of stuck on this question of why god (if he's real) wouldn't just make himself obvious instead of leaving everything so ambiguous, and someone told me pascal actually wrote about this exact thing in the pensees, so i've been slowly working through it (the old trotter translation thats free online, its thought/fragment 194 if that means anything to you). i think i mostly follow what hes saying but the last part of this bit totally loses me:

  "If this religion boasted of having a clear view of God, and of possessing it open and unveiled, it would be attacking it to say that we see nothing in the world which shows it with this clearness. But since, on the contrary, it says that men are in darkness and estranged from God, that He has hidden Himself from their knowledge, that this is in fact the name which He gives Himself in the Scriptures, Deus absconditus; and finally, if it endeavours equally to establish these two things: that God has set up in the Church visible signs to make Himself known to those who should seek Him sincerely, and that He has nevertheless so disguised them that He will only be perceived by those who seek Him with all their heart; what advantage can they obtain, when, in the negligence with which they make profession of being in search of the truth, they cry out that nothing reveals it to them; and since that darkness in which they are, and with which they upbraid the Church, establishes only one of the things which she affirms, without touching the other, and, very far from destroying, proves her doctrine?"

  is he seriously saying that people looking for god and finding nothing is ITSELF evidence that christianity is true, not evidence against it?? because if so that seems like a total dodge to me, like a "heads i win, tails you lose" setup. but he states it so matter-of-factly, like its just obviously valid reasoning and not a cheat. can you walk through the actual logical steps hes making in that last sentence and tell me honestly whether its as circular/unfalsifiable as it sounds to me, or if theres something real there that im missing.
