  Then determinism. If two solutions agree outside the hole but differ inside, does that mean GR isn't deterministic? But we know in practice, initial data determines evolution. The resolution is that diffeomorphic solutions represent the same physical reality. So determinism holds in the physical sense, not mathematical.

