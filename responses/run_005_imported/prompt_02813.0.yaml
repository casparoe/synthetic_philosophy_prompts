prompt: |-
  I'm a retired physicist - spent most of my career doing numerical relativity, black hole merger simulations - and lately I've fallen down the philosophy rabbit hole. Recently I ran accross Einstein's old 'hole argument': the point that you can drag the metric around inside some region of spacetime with a diffeomorphism and get a technically distinct solution to the field equations thats identical to the original everywhere outside that region. We always just called that gauge freedom and moved on with the calculation, never thought twice about what it meant philosophically. Apparently a bunch of philosophers think it has real teeth against spacetime substantivalism, maybe even against determinism itself. So what are the most important implications of this argument for how I should now think about whether spacetime points are 'real' things, and whether GR is genuinely deterministic?
