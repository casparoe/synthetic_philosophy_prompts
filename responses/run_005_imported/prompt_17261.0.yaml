answer: |-
  Here’s a 5-minute toast that celebrates their "moral trade" as a profound act of integrity and partnership, avoiding any hint of compromise while making the philosophy accessible to both halves of the room:

  ---

  **(Raise glass, warm smile)**  

  "Friends, family, colleagues – it’s truly an honor to celebrate [Bride] and [Groom]. As [Bride]’s former advisor, I’ve watched her tackle tough problems with brilliance and conviction. And getting to know [Groom], I’ve seen that same fearless integrity in him. Today isn’t about my lecture notes, though – it’s about *their* story. And what makes their story remarkable isn’t just their love, but *how* they choose to build a life together.  

  Now, anyone who knows these two knows they’re thinkers. Deep thinkers. [Bride]’s work centers on compassion – specifically, the urgent ethical call to reduce animal suffering. For her, the math is clear: choosing a burger has real moral weight. [Groom], meanwhile, is laser-focused on our collective future. His moral compass points squarely toward preserving a livable planet – and he sees the environmental cost of air travel as a profound responsibility.  

  *(Light, knowing chuckle)*  
  Here’s the beautiful friction: [Bride] never lost sleep over jet fuel, and [Groom] never really sweated the steak. They approached the world’s problems from different mountaintops, seeing different vistas of what mattered most.  

  **And this is where their story gets truly inspiring – and frankly, a lesson for all of us.**  

  They didn’t meet in the middle. They didn’t dilute their beliefs. [Bride] didn’t suddenly decide flying was fine, and [Groom] didn’t have a change of heart about burgers. Instead, they did something far more powerful, and far more *them*. They saw an opportunity not to argue, but to *amplify*.  

  They made a trade. A *moral trade*.  

  [Groom] looked at [Bride]’s unwavering commitment to animals and said, *‘Your cause matters deeply to you, so it matters to me. I’ll stand with you there.’* He embraced vegetarianism – not because *his* fundamental view on meat changed, but because *her* conviction deserved his support.  

  [Bride], in turn, looked at [Groom]’s steadfast dedication to the planet and said, *‘Your fight is crucial. Let me stand with you there.’* She grounded her wings – drastically reducing her flying – not because *her* core calculus about air travel shifted, but because *his* commitment called for her partnership.  

  **(Pause, lean in slightly)**  
  **This isn’t compromise. This is elevation.**  
  It’s not watering down principles; it’s *fortifying* them through shared action. It’s recognizing that sometimes, the strongest way to hold true to your own north star is to help your partner navigate by theirs. They didn’t bend their ethics; they *broadened* their impact.  

  To the philosophers here – it’s like discovering gains from trade not in markets, but in moral frameworks. Different values, finding synergy.  
  To the family – it’s the ultimate act of love: seeing what matters most to the person you love, and saying, *‘Let me help you protect that,’* even if you see the world a little differently.  

  **(Shift tone to warm, personal)**  
  What [Bride] and [Groom] have built isn’t just a shared life; it’s a shared *fortress* for their deepest values. They’ve shown us that profound respect doesn’t require agreement – it requires the courage to champion your partner’s cause *because* it’s theirs, alongside your own. That’s the kind of integrity that changes the world, and it’s certainly the kind of love that builds an unshakeable marriage.  

  They are proof that two people can look at the ethical universe through different lenses, and instead of seeing conflict, see possibility. See a way to do *more* good, together.  

  So let’s raise our glasses:  
  To [Bride] and [Groom] – two brilliant, principled souls.  
  May your life together continue to be a masterclass in unwavering integrity, profound respect, and the incredible good that happens when love doesn’t ask you to change your light, but to let it shine alongside another’s, making everything brighter.  
  To your moral trade, and to your magnificent union! Cheers!"

  ---

  **Key elements that make this work:**

  1.  **Clarity on "Not Compromise":** Explicitly states *"This isn't compromise. This is elevation"* and *"They didn’t bend their ethics; they broadened their impact."*
  2.  **Accessible Language:** Uses phrases like "north star," "stand with you," "fortress for their deepest values," and "shine alongside another's light" instead of jargon. "Moral trade" is introduced simply.
  3.  **Respect for Both Beliefs:** Clearly and fairly outlines both positions (animal suffering vs. climate impact) without judgment, showing why each matters deeply to the respective person.
  4.  **The "How" is the Hero:** Focuses on the *mechanism* of the trade: "Your cause matters deeply to you, so it matters to me." "Your commitment called for my partnership." This highlights respect and action, not persuasion.
  5.  **Dual-Audience Moments:**
      *   *For Academics:* "Gains from trade... in moral frameworks. Different values, finding synergy." (Nods to Ord without name-dropping). Mentions "different lenses."
      *   *For Family:* "Ultimate act of love," "masterclass in unwavering integrity, profound respect," "making everything brighter."
  6.  **Positive Framing:** Uses words like "inspiring," "powerful," "amplify," "elevation," "fortifying," "synergy," "brighter." The tone is celebratory and admiring.
  7.  **Personal Connection:** Grounds it in knowing them ("their story," "anyone who knows these two").
  8.  **Structure:** Clear flow: Introduction -> Their beliefs -> The "friction" -> The ingenious solution -> Why it's NOT compromise -> Why it's profound love/respect -> The universal lesson -> The toast.

  This toast honors their intellectual rigor for the department while celebrating the deeply human, loving *action* behind the philosophy for the family, all while nailing the crucial point: **Their principles didn't change; their commitment to supporting each other *through* those principles did.**
