  Here's a joke crafted for the seminar crowd, hitting the self-referential dilemma of EDAs while name-dropping Street and keeping the metaethics sharp:

  **The Joke:**

  > **Why did the metaethicist bring a mirror to Sharon Street’s lecture on evolutionary debunking?**  
  > *Because halfway through her brilliant argument—that natural selection shaped our moral intuitions for fitness, not truth-tracking—he realized something unsettling: the neurons firing his "aha!" moment were optimized by that same process for winning arguments in Pleistocene tribal councils.*  
  > **Turns out, debunking morality with evolved cognition is like using a crooked ruler to prove all rulers are crooked.**  

  **Why it works for your audience:**  
  1. **Direct Street Reference**: Explicitly names her core move ("shaped for fitness, not truth-tracking").  
  2. **Self-Undermining Punchline**: The "mirror" symbolizes self-reflection. The "crooked ruler" analogy crystallizes the self-defeating loop: if evolution corrupts moral beliefs, why trust the reasoning *derived from evolved cognition* to establish that corruption?  
  3. **Academic Nuance**: "Pleistocene tribal councils" nods to evolutionary psychology’s framing of reasoning as adaptive social tooling (e.g., Mercier & Sperber), not a truth-aimed faculty.  
  4. **No Cavemen Cliches**: Focuses on epistemic circularity, not "lol cavemen dumb."  
  5. **In-Joke Vibe**: The metaethicist’s panicked self-awareness mirrors real seminar-room existential dread when EDAs bite their own tail.  

  **Alternative Punchline** (if you prefer drier academic delivery):  
  > *...he started sweating: if evolutionary genealogy debunks moral realism, what stops it from debunking the rational faculties grounding his anti-realist conclusion?*  
  > **It’s not just morality that’s adaptive—it’s the debunking argument’s own scaffolding.**  

  **Slide Suggestion**:  
  - **Opening Line**: "Why did the metaethicist bring a mirror..."  
  - **Bullet Point Below**: *The Self-Defeat Problem in Evolutionary Debunking Arguments (Street 2006; Enoch 2010)*  

  This should land with anyone who’s wrestled with Street or read responses like David Enoch’s "The Epistemological Challenge to Metanormative Realism" – where this self-undermining worry gets serious play. Good luck with the seminar!
