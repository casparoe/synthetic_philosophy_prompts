answer: |-
  This is a genuinely insightful dilemma that cuts to the heart of responsibility, personality, and relationships. Your friend's defense ("I was born this way, I can't change") carries an intuitive weight, but it crumbles under closer scrutiny. Here's a breakdown of why it doesn't hold up and what's actually happening:

  **Why the "Fixed Trait" Defense Fails:**

  1.  **False Equivalence with Physical Traits:** Height and eye color are biologically determined and immutable through conscious effort. Personality traits, behavioral patterns, and communication styles are **not** equivalent. While temperament (e.g., baseline impulsivity, sensitivity) has biological roots, *how we express and manage* those tendencies is learned and subject to conscious control, especially in adulthood. Saying "I'm blunt" is like saying "I'm impulsive." While the *inclination* might be strong, the *choice to act on it* and the *way it's expressed* are not predetermined.
  2.  **Evidence of Controllability:** Your other friend nailed it. The fact that he *can* be tactful and charming with his boss or people whose opinions he values is **irrefutable proof** that he *can* control his bluntness. He possesses the skill of filtering and adapting his communication. He *chooses* not to exercise that skill around you and others he deems "safe" because he perceives no negative consequence. This demonstrates the behavior is **situational and instrumental**, not an uncontrollable fixed trait.
  3.  **Personality is Malleable, Not Set in Stone:** While core personality dimensions (like the Big Five) show stability, specific behaviors and interpersonal habits *can and do* change throughout life, especially with motivation, self-awareness, and effort. People learn new communication skills, develop greater empathy, and modify hurtful behaviors all the time. Claiming total immutability is an abdication of the possibility of growth.
  4.  **The Dodge of Responsibility:** The core issue isn't his *internal feeling* of bluntness, but his *external action* of making hurtful remarks. His defense shifts the focus from his *choice to speak* those words to his *inherent nature*, absolving him of accountability for the impact of his actions. "I can't help it" becomes a license to hurt without consequence.
  5.  **Moral and Relational Implications:** Accepting this defense sets a dangerous precedent. It implies that anyone with a tendency towards hurtful behavior (rudeness, cruelty, dishonesty, even aggression) bears no responsibility simply because they feel an impulse. Relationships require mutual respect and care. His defense places the entire burden of managing *his* hurtful actions onto *you* (and others) to simply endure it, rather than him bearing any responsibility to mitigate harm.
  6.  **The Convenience Factor:** The behavior surfaces primarily where he feels safe from repercussions (with close friends like you). This pattern suggests the behavior serves a purpose for *him* (venting, asserting dominance, avoiding vulnerability, feeling "authentic" without effort) rather than being an uncontrollable force.

  **What's Actually Wrong With It (The Core Flaws):**

  1.  **Confusing Inclination with Compulsion:** He mistakes a strong *inclination* or *habit* for an uncontrollable *compulsion*. Feeling blunt is one thing; *choosing to voice every blunt thought in a hurtful way* is another.
  2.  **Prioritizing "Authenticity" Over Kindness:** He frames his unfiltered bluntness as "being true to himself," implicitly valuing his own expression of self over the feelings and well-being of others in his social circle. True connection requires balancing authenticity with empathy.
  3.  **Exploiting the Relationship:** He relies on the security of your friendship (knowing you won't walk away) as permission to offload his negativity without effort. He invests effort where he *needs* to (boss, important contacts) but withholds it where he feels he *can* (close friends). This takes the relationship for granted.
  4.  **Lack of Empathy and Repair:** A genuine fixed limitation causing unintentional hurt would typically be met with remorse, efforts to mitigate damage, or at least an acknowledgement of the pain caused. His defense shuts down any discussion of the impact and dismisses your feelings, showing a lack of empathy for the consequences of his actions.

  **How to Think About It and What You Can Do:**

  *   **Reframe the Issue:** It's not about resenting his *temperament* (a potential inclination towards directness). It's about holding him accountable for his *choices* (voicing hurtful remarks without filter) and the *impact* of those choices (hurting friends). His *choice* not to apply the social skills he demonstrably possesses *is* within his control.
  *   **Focus on Impact, Not Intent:** His intent might not be malicious (though the selective use raises questions), but the impact *is* harmful. A mature adult takes responsibility for the impact of their actions, regardless of intent. "I didn't mean to hurt you" should be followed by "...and I'm sorry I did. I'll try to be more mindful," not "...so your feelings are invalid."
  *   **Challenge the Defense Directly (Carefully):** In a calm moment, you could say:
      *   *"I understand you feel this is just how you are, and I believe you feel that impulse strongly. But I've seen you be incredibly tactful with [Boss's Name] and others. That shows me you *can* choose your words carefully when it matters to you. When you say hurtful things to me and then say you can't help it, it feels like you *can* help it, but you're choosing not to with me. That really hurts and makes me feel like my feelings don't matter to you as much as theirs do."*
      *   *"Saying 'I can't help it' shuts down any conversation about how your words land. Even if the blunt impulse is strong, the choice to voice it that way *is* a choice. The impact is real, and that's what I need you to hear."*
  *   **Set Boundaries (Not Ultimatums... Yet):** Boundaries are about *your* response. *"When you make comments about my appearance/other hurtful remarks, it really upsets me. If it happens again, I will [state your action - e.g., point it out immediately and ask you to stop, end the conversation, need some space for a while]."* Then *follow through*. This shows him there *are* consequences.
  *   **Evaluate the Relationship:** Is this a pattern you can genuinely accept long-term without resentment? Does his presence bring enough value to offset this consistent hurt? Does he show care and respect in *other* ways that balance this out? His unwillingness to even acknowledge the impact or attempt modification speaks volumes about how much he values your comfort within the friendship.
  *   **Accept His Limitations (If Necessary):** If, after clear communication and boundary setting, he absolutely refuses any accountability or effort, you may need to radically adjust your expectations. This doesn't mean you accept the behavior as okay, but you stop expecting change and decide if you can tolerate the behavior as-is, or if the cost is too high. This is the "adjust expectations" path, but it should only come *after* you've challenged the faulty defense and set boundaries.

  **In essence:** Your friend's defense is a sophisticated form of avoiding responsibility. He possesses the capability for tact but selectively disables it around those he feels won't impose consequences. "I can't help it" is a shield against accountability, not a valid excuse for causing consistent, avoidable hurt to people who care about him. The flaw isn't in his nature; it's in his choice not to manage that nature respectfully within his closest relationships.
