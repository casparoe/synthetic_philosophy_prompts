  Ah, Nate's sequential vs simultaneous objection is interesting. The user specifically wonders if this "damages Ola's case." Strictly speaking, cascade models do assume sequential decisions with observed history - in a crowded festival, people aren't neatly queuing one-by-one. But Ola's "compressed order" defense holds some water; the first glance still functions as a move. Still, the "public info" aspect (seeing both lines) weakens the cascade logic here.

