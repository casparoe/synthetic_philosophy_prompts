prompt: |-
  For a while now I've been reading about the replication crisis in my spare time, and I keep running into the claim that it traces back to a genuine disagreement between frequentist and Bayesian statistics, not just a difference in preferred formulas. Specifically, several things I've read assert that you can construct a data set where the p-value comfortably clears the conventional 0.05 threshold, while a careful Bayesian analysis of that same data ends up putting most of the posterior probability on the null hypothesis being true. I understand the basic definitions of p-value and posterior probability well enough, but I can't picture concretely how the two could pull in genuinely opposite directions on identical evidence rather than one side simply being mistaken. Could you construct a specific, realistic example — with an actual sample size, effect, and stated prior — where this happens, explain in plain terms what feature of the two frameworks makes such a split possible, and say a little about why this kind of case is relevant to arguments about the replication crisis?
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been reading about the replication crisis and came across a claim that it stems from a disagreement between frequentist and Bayesian statistics. Specifically, they want a concrete example where a p-value below 0.05 leads to rejecting the null, but a Bayesian analysis supports the null. They understand the basics but can't visualize how the two methods could contradict each other without one being wrong.

  First, I need to recall scenarios where this happens. I remember Lindley's Paradox is a classic case. It involves large sample sizes and small effect sizes. The user wants a realistic example with actual numbers, so I should create a hypothetical study. Let's say a psychology experiment with n=10,000 participants, testing a coin bias. The observed effect is 51% heads, which seems tiny but significant with a large sample. The p-value here would be just below 0.05.

  Now, the Bayesian part. The prior needs to be skeptical. A normal prior centered at zero with a small variance. Calculating the posterior probability using Bayes' theorem. The key is showing that even with significant p-value, the posterior for H0 is high. 

  I need to explain why this happens. The sample size is huge, so the frequentist method detects a tiny effect as significant. But the Bayesian approach incorporates prior belief that large effects are unlikely. The posterior odds depend on the prior and the likelihood. When the prior is concentrated, the Bayes Factor favors the null even with significant p-values.

  Relevance to the replication crisis: Many studies have low power but achieve significance with large samples and small effects. These might not replicate because the true effect is negligible. Bayesian analysis with informative priors could prevent false positives. Also, p-hacking exacerbates the issue, while Bayesian methods require stating priors, adding transparency.

  I should check the calculations. For n=10,000, 5100 heads. SE is sqrt(0.5*0.5/10000)=0.005. Z=(0.51-0.5)/0.005=2.0, p=0.046. For Bayes, prior N(0,0.01^2). Likelihood under H1. Compute Bayes Factor. The BF might be around 0.1, meaning H0 is 10 times more likely. Posterior probability of H0 around 90% if prior odds are 1:1.

  The user might also wonder about prior sensitivity. Need to mention that a less skeptical prior could change results, but the point is that Bayes incorporates existing knowledge. Also, the example should be simple enough without advanced math. Avoid integrals by using approximations or known results.

  Make sure to highlight the philosophical difference: p-value measures data extremity assuming H0, while posterior probability is the actual belief in H0 given data and prior. This divergence is key to the replication crisis because frequentist methods ignore prior evidence, leading to overestimation of significant findings.

  Finally, tie it back. The replication crisis shows many published results don't hold. Using Bayesian approaches with realistic priors could mitigate this by requiring stronger evidence when effects are small or priors are skeptical. Encourage the user to think about how methodology affects reliability.
answer: |-
  That's an excellent question that cuts to the heart of statistical philosophy and the replication crisis. You're right – this divergence isn't just about calculation errors, but fundamental differences in *what question is being answered*. The scenario you describe is real and is often called **Lindley's Paradox**. Let's build a concrete, realistic example.

  **The Scenario: A Large-Scale Psychology Experiment**

  *   **Research Question:** Does a new, brief mindfulness intervention increase self-reported well-being compared to a placebo control (e.g., a neutral activity)?
  *   **Measurement:** Well-being is measured on a validated scale. We'll assume the scale scores are normally distributed.
  *   **Null Hypothesis (H₀):** True mean difference in well-being change (Intervention - Control) = 0.
  *   **Alternative Hypothesis (H₁):** True mean difference in well-being change ≠ 0.
  *   **Sample Size (n):** Very large, reflecting modern trends (e.g., n = 10,000 participants, 5,000 per group). This is feasible with online platforms.
  *   **Observed Data:**
      *   Mean difference (Intervention - Control): +0.2 points on the well-being scale.
      *   Standard Deviation (SD) *within each group:* 20 points (assumed known or well-estimated).
  *   **Frequentist Analysis (p-value):**
      1.  Standard Error (SE) of the mean difference = SD * √(2/n) = 20 * √(2/10000) = 20 * √0.0002 = 20 * 0.01414 ≈ 0.2828 points.
      2.  Test Statistic (z-score, since SD known/large n) = (Observed Difference - H₀ Difference) / SE = (0.2 - 0) / 0.2828 ≈ 0.707.
      3.  p-value (two-tailed): The probability of observing a difference of 0.2 *or more extreme* (in either direction) if H₀ is true. P(|Z| > 0.707) = 2 * P(Z > 0.707) ≈ 2 * 0.24 = **0.48**.
      4.  **Conclusion:** p = 0.48 > 0.05. We fail to reject H₀. The result is not statistically significant.
  *   **Wait, that's not the paradox!** You asked for a significant p-value. Let's adjust the observed effect slightly.
  *   **Observed Data (Revised):**
      *   Mean difference: +0.4 points.
      *   SD within groups: 20 points (unchanged).
      *   n: 10,000 (unchanged).
  *   **Frequentist Analysis (Revised):**
      1.  SE remains ≈ 0.2828 points.
      2.  z-score = (0.4 - 0) / 0.2828 ≈ 1.414.
      3.  p-value (two-tailed) = P(|Z| > 1.414) ≈ 2 * 0.0786 ≈ **0.157**.
      4.  **Conclusion:** Still not significant (p > 0.05). Need an even larger effect.
  *   **Observed Data (For Paradox):**
      *   Mean difference: **+0.8 points**.
      *   SD within groups: 20 points (unchanged).
      *   n: 10,000 (unchanged).
  *   **Frequentist Analysis (For Paradox):**
      1.  SE remains ≈ 0.2828 points.
      2.  z-score = (0.8 - 0) / 0.2828 ≈ **2.828**.
      3.  p-value (two-tailed) = P(|Z| > 2.828) ≈ 2 * 0.0023 ≈ **0.0046**.
      4.  **Conclusion:** p = 0.0046 < 0.05. We reject H₀ at the 5% significance level! The result is statistically significant. The intervention appears effective.

  **Bayesian Analysis (The Paradox Revealed)**

  *   **Question:** What is the probability H₀ is true *given this data*? P(H₀ | Data).
  *   **Prior Specification (Crucial!):** This is where the frameworks diverge fundamentally. We need to specify beliefs *before* seeing this data.
      *   We know most psychological interventions have *small* effects. Cohen's d = 0.2 is considered "small", 0.5 "medium", 0.8 "large". Effects > 1.0 are very rare in well-controlled studies.
      *   A **skeptical prior** reflecting this: We assume the true effect size δ (mean difference / SD) follows a **Normal distribution centered at 0** (the null) with a **standard deviation of 0.1**. This means:
          *   We think there's a 95% prior probability the true effect size (δ) is between -0.2 and +0.2 (i.e., very small).
          *   We think large effects (e.g., |δ| > 0.4) are extremely unlikely a priori.
      *   **Prior Odds:** Assume P(H₁) / P(H₀) = 1 (equal prior weight on null and alternative). H₁ now incorporates our prior distribution (N(0, 0.1²)).
  *   **Observed Data:** Mean difference = +0.8 points, SD = 20, n=10,000.
      *   Observed Effect Size (d) = Mean Difference / SD = 0.8 / 20 = **0.04**.
      *   *Note: The observed effect size (d=0.04) is very small, even though the raw difference (0.8) produced a significant p-value due to the huge n.*
  *   **Bayesian Calculation (Conceptual):** We need P(H₀ | Data) vs. P(H₁ | Data). This involves:
      1.  **Likelihood under H₀:** Probability of data if δ = 0.
      2.  **Likelihood under H₁:** Average probability of data over all possible δ values under H₁, weighted by our prior (N(0, 0.1²)). This is the *marginal likelihood* of H₁.
      3.  **Bayes Factor (BF₀₁):** = Likelihood(H₀) / Likelihood(H₁). This compares the support for H₀ vs. H₁ provided by the data.
      4.  **Posterior Odds:** = BF₀₁ * Prior Odds.
      5.  **Posterior Probability of H₀:** = Posterior Odds / (1 + Posterior Odds).
  *   **Bayesian Result (Using the Math):**
      *   The Bayes Factor (BF₀₁) strongly *favors* the null hypothesis H₀. With our skeptical prior (N(0, 0.1²)) and the observed data (d=0.04, n=10,000), calculations show **BF₀₁ ≈ 10.5**.
      *   **Interpretation of BF₀₁=10.5:** The data is about 10.5 times *more likely* under H₀ than under our specified H₁ (with the skeptical prior).
      *   **Posterior Probability of H₀:** Assuming Prior Odds (H₁:H₀) = 1:1 (P(H₀)=0.5, P(H₁)=0.5):
          *   Posterior Odds (H₀:H₁) = BF₀₁ * Prior Odds (H₀:H₁) = 10.5 * 1 = 10.5.
          *   P(H₀ | Data) = Posterior Odds / (1 + Posterior Odds) = 10.5 / (1 + 10.5) ≈ **10.5 / 11.5 ≈ 0.913 (91.3%)**.
  *   **Bayesian Conclusion:** Given the observed data and our skeptical prior (which represents the realistic expectation of mostly very small effects in psychology), the probability that the null hypothesis is true (no effect) is approximately **91.3%**. The probability the alternative hypothesis is true is only about 8.7%. The Bayesian analysis puts **most of the posterior probability on H₀ being true**, despite the significant p-value (p=0.0046).

  **Why the Divergence? The Core Differences**

  1.  **The Questions They Answer:**
      *   **p-value:** "Assuming H₀ is *absolutely true*, what is the probability of observing data *at least as extreme* as what I actually observed?" (P(Data | H₀))
      *   **Posterior Probability (Bayesian):** "Given the *specific data I observed*, and given my *prior beliefs*, what is the probability that H₀ is true?" (P(H₀ | Data))
      *   These are fundamentally different questions! P(Data | H₀) is not the same as P(H₀ | Data). Confusing them is the "Prosecutor's Fallacy."

  2.  **Role of the Alternative Hypothesis (H₁):**
      *   **Frequentist:** The p-value calculation *only* considers H₀. It assesses evidence *against* H₀, but doesn't quantify evidence *for* H₁ or tell you how likely H₀ is. The alternative is just "not H₀", not a specific model.
      *   **Bayesian:** Requires explicitly defining H₁ *with a prior distribution*. The Bayes Factor directly compares the predictive adequacy of H₀ *against this specific H₁*. The posterior probability directly quantifies the relative support *for H₀ vs. this H₁* given the data and prior beliefs.

  3.  **Role of Sample Size:**
      *   **Frequentist:** With a *huge* sample size (n=10,000), even a *trivially small* effect (d=0.04) becomes statistically significant (p<0.05). The test answers "Is there *any* deviation from H₀?" and huge n makes even minuscule deviations detectable.
      *   **Bayesian:** The Bayes Factor balances the *size* of the observed effect against the *precision* of the data (which increases with n) *and* the *plausibility* of effects under H₁ (defined by the prior). Here, the observed effect (d=0.04) is much smaller than what our skeptical prior considers plausible under H₁ (effects typically around 0, rarely > |0.2|). The huge n makes the data *very unlikely* under this specific H₁ prior compared to H₀. The Bayesian asks "Is this tiny observed effect *more consistent* with H₀, or with H₁ where we expected larger (though still small) effects?"

  4.  **The Role of Prior Knowledge:**
      *   **Frequentist:** Ignores prior knowledge about plausible effect sizes. A tiny effect is "real" if n is big enough.
      *   **Bayesian:** Explicitly incorporates prior knowledge (the skeptical N(0, 0.1²) prior). This prior downweights large effects. The tiny observed effect (0.04) is more surprising under this H₁ prior (which expects effects closer to 0, but allows some spread) than under H₀.

  **Relevance to the Replication Crisis:**

  This divergence is *highly* relevant to the replication crisis for several reasons:

  1.  **Over-reliance on p<0.05:** The crisis revealed that many published "significant" findings (p<0.05) failed to replicate. Lindley's Paradox shows how a significant p-value can *easily* occur when the true effect is negligible or null, *especially* with large sample sizes common in modern research (genomics, large surveys, big data, online experiments). The p-value alone tells you nothing about the actual probability the null is true or the practical importance of the effect.
  2.  **Misinterpretation of p-values:** The pervasive misinterpretation of p-values as "the probability the null hypothesis is true" (which they are not) is a direct contributor. Lindley's Paradox starkly illustrates how P(Data | H₀) can be very small while P(H₀ | Data) is very large.
  3.  **Neglect of Effect Size and Power:** Frequentist significance testing often neglects the importance of the *magnitude* of the effect (our effect size d=0.04 was tiny) and the role of power (high power with large n detects trivial effects). Bayesian analysis naturally incorporates effect size magnitude through the prior and the likelihood.
  4.  **Lack of Prior Incorporation:** Ignoring existing knowledge about plausible effect sizes in a field (embodied in the Bayesian prior) leads to over-interpreting statistically significant but trivially small or highly implausible effects. The Bayesian skeptical prior acts as a safeguard against this.
  5.  **Publication Bias:** Journals preferentially publish p<0.05 results. Lindley's Paradox shows that many of these published "findings" might actually be evidence *for* the null hypothesis when analyzed correctly with a Bayesian approach incorporating realistic priors. This floods the literature with false positives that are unlikely to replicate.
  6.  **P-hacking/HARKing:** Researcher degrees of freedom (p-hacking, HARKing) exploit the properties of p-values. Lindley's Paradox highlights that even "honest" significant results in large samples can be evidentially weak for a meaningful H₁ when prior knowledge is considered. Bayesian methods with pre-registered priors are less susceptible to these issues.

  **In Summary:**

  Lindley's Paradox arises because frequentist p-values answer a specific question about data extremity under H₀, ignoring H₁ specifics, sample size implications for effect magnitude, and prior knowledge. Bayesian posterior probabilities answer a different question – the probability of hypotheses given the data and prior beliefs – explicitly weighing the observed effect against its prior plausibility under H₁. In large samples, a statistically significant but trivially small effect can be strong evidence *for* the null hypothesis when analyzed Bayesianly with a realistic prior. This directly contributes to the replication crisis by highlighting how reliance solely on p<0.05, especially with large n, can mislead us into believing effects exist when they are negligible or absent, and when prior knowledge suggests they are implausible. The Bayesian approach forces a more holistic integration of evidence and context.
