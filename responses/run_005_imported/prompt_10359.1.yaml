  I've been kind of obsessed with Kurt Gödel for the last few weeks, it started with a youtube video about the incompleteness theorems and then I went down a whole wikipedia rabbit hole about his personal life. Somewhere in there I read that late in his life he wrote a letter to his mom basically arguing that there has to be an afterlife - something about the world being "rational" and it being wasteful for a persons mind and character to spend a whole life developing and then just switch off forever for no reason. On top of that I saw he also did a totally separate, actual formal proof of God's existence using modal logic, and that some logicians ran it through a computer a few years back and confirmed the logic checks out, which I think is where a headline like "math proves God exists" came from.

  Putting all that together it seems like the same guy who gave us the incompleteness theorems (which from what I understand are basically bulletproof) also used that level of rigor to settle the afterlife question, so its not just some old genius's personal hope about seeing his mother again, its closer to an actual proof. So I guess my question is, if one of the greatest logicians ever worked out a rigorous case that we survive death, why do scientists and philosophers still act like thats a totally open mystery? Feels like that should be bigger news than it is, or am I missing something here?
