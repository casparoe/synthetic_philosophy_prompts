  ## The Masquerade of Order: Pascal's Force, Justice, and the Peril of Rebellion

  Blaise Pascal's *Pensées*, a fragmented exploration of faith, reason, and the human condition, contains a startlingly cynical observation about political authority: **"Since we cannot make justice strong, we have made strength just; because we cannot make what is just strong, we have made what is strong just."** (Fragment Lafuma 103 / Brunschvicg 298). This aphorism, often linked to his description of the "mystical foundation" of authority (Lafuma 294), seems to plunge us into a Hobbesian world where power alone dictates right. Yet, Pascal was no simple cynic. To understand his position – and crucially, his insistence on obeying even unjust customs – requires weighing two interpretations: **Justice as Force's Disguise** versus **Force as Justice's Fallen Substitute**, ultimately revealing a profound theological pessimism about human capacity that makes rebellion more dangerous than injustice itself.

  **Interpretation 1: The Cynical Reading - Justice *Is* Force Disguised**

  This reading takes Pascal's words at face value. His analysis is ruthlessly descriptive, exposing the mechanics of power:

  1.  **The Impossibility of Rational Justice:** Humans are inherently incapable of agreeing on universal, rational justice. As Pascal notes, "Custom is the whole of equity for the sole reason that it is accepted... Whoever tries to bring it back to its first principle destroys it" (Lafuma 294). Reason leads only to endless, unresolvable disputes ("Plato and Aristotle... wrote politics only as a pastime" Lafuma 331). Justice, in this view, is an abstract phantom humans chase but never capture.
  2.  **Force as the Sole Arbiter:** Because rational consensus fails, physical power inevitably steps in. "It is just that what is just should be followed; it is necessary that what is strongest should be followed. Justice without might is helpless; might without justice is tyrannical... Thus we cannot give might to justice, because might has gainsaid justice and has declared that it is she herself who is just. And thus being unable to make what is just strong, we have made what is strong just" (Lafuma 103/298). Might *becomes* right through its sheer ability to enforce obedience and silence dissent. The "mystical foundation" is the collective illusion woven around force to legitimize it – robes, scepters, rituals – masking its brutal origin.
  3.  **Custom as Sanctified Force:** Existing laws and customs are simply the codification of past successful force. "The art of subversion, of revolution, is to dislodge established customs by probing down to their origin, to show how they lack authority and justice" (Lafuma 294). But Pascal immediately warns *against* this probing, not because it reveals falsehood, but because it destroys the *necessary* illusion. The foundation is "mystical" precisely because it *cannot* bear rational scrutiny; its authority rests solely on acceptance born of habit and the power that enforces it.

  This reading paints Pascal as a proto-Nietzschean, exposing justice as the vocabulary of the powerful. Obedience stems from recognizing the futility of resistance against overwhelming force and the chaos that follows its collapse.

  **Interpretation 2: The Theological Reading - Force as Justice's Fallen Substitute**

  However, Pascal's Jansenist Christian framework demands a deeper layer. He doesn't *endorse* might-makes-right; he diagnoses the tragic consequence of the Fall:

  1.  **Transcendent Justice Exists:** For Pascal, true Justice is real, absolute, and resides solely with God. "True justice... would require that we should have a knowledge of the whole... which is impossible" (implied throughout, cf. his emphasis on God's hiddenness and human blindness - Lafuma 427, 131). Human reason, corrupted by sin and limited by perspective, is fundamentally incapable of grasping or enacting this divine justice. "We know truth, not only through reason, but more through the heart... Principles are felt, propositions proved" (Lafuma 110). Justice is a *felt* truth we yearn for but cannot rationally define or implement universally.
  2.  **Force as a Necessary, Tragic Expedient:** Given our fallen state and inability to achieve true justice, force becomes a *pragmatic necessity* to prevent total chaos. It is a "substitute" for the unattainable divine order, a "second best" imposed by necessity. "It is dangerous to tell the people that the laws are not just, because they obey them only because they believe them to be just. That is why they must be told at the same time that they must obey them because they are laws, just as they must obey their superiors, not because they are just, but because they are superiors" (Lafuma 513). Force provides *order*, the essential prerequisite for any society, even if it falls infinitely short of true justice.
  3.  **The "Mystical Foundation" as Divine Accommodation:** The "mystical" element isn't *just* an illusion masking force; it's the dim, divinely permitted reflection of the *need* for order in a broken world. God, in his Providence, allows human authorities to exist to curb our worse impulses, even if their specific laws are arbitrary human constructs. Obedience to *established order* becomes a relative good compared to the absolute evil of anarchy, which reflects the complete absence of God's structuring grace. Force, in this light, is not *justice*, but a divinely tolerated *mechanism* for preserving a semblance of peace necessary for human life and the pursuit of salvation.

  **Commitment: Force as Justice's Fallen Substitute**

  While the cynical reading captures Pascal's devastating *description* of human political reality, the theological reading aligns fundamentally with his overarching worldview. Pascal was not celebrating force; he was lamenting the human condition that makes it necessary. His solution isn't nihilistic resignation to power, but a turn *away* from reliance on fallen human systems (justice *or* force) towards divine grace through Christ: "Not only do we only know God through Jesus Christ, but we only know ourselves through Jesus Christ... We only know life and death through Jesus Christ. Without Jesus Christ we do not know what our life, nor our death, nor God, nor ourselves, really is" (Lafuma 189, 417). The *Pensées* aim to shatter human pride and self-sufficiency, including our faith in human justice or our ability to overthrow flawed systems and build perfect ones. Force prevails *because* we are fallen, not because it *is* right. It is the crutch for a crippled humanity, not the ideal.

  **Why Rebellion is More Dangerous than Unjust Custom:**

  Pascal's preference for obedience, even to flawed customs, flows directly from this commitment to the "Fallen Substitute" view and his bleak assessment of human nature:

  1.  **Chaos is the Ultimate Evil:** Without the order imposed by established authority (however unjust its origin), society descends into the "war of all against all." Pascal saw this chaos as the greatest temporal evil, destroying the very fabric of life and making the pursuit of higher goods (including salvation) impossible. "The confusion of the world arises from this, that men do not sufficiently understand their own misery. For example, the magistrates are called 'My Lord the President,' 'My Lord the Lieutenant,' and not 'Miserable one,' 'Beggar'... The world must be thus deceived to be led" (Lafuma 45). The deception (the "mystical foundation") is necessary to prevent the recognition of our inherent misery from collapsing society.
  2.  **Human Incapacity for Perfect Justice:** Since humans are inherently corrupt and blind, any rebellion aiming to establish "true justice" is doomed. Revolutionaries are no less fallen than the rulers they overthrow; their new order will inevitably be founded on a new application of force and generate new injustices. "He who would act the angel acts the brute" (Lafuma 358). The quest for perfect human justice is a dangerous illusion fueled by pride.
  3.  **Destabilizing the Necessary Illusion:** Probing the "mystical foundation" reveals the arbitrary force beneath, destroying the *belief* in legitimacy that makes obedience possible. Once people see the emperor has no clothes, anarchy looms. As Fragment 513 makes clear, telling people the laws are unjust without offering a *perfectly just and universally enforceable* alternative destroys the only glue holding society together: belief in the *relative* legitimacy of the existing order. It removes the substitute without providing the real thing.
  4.  **Providence and Order:** Established authority, however flawed, represents a degree of order permitted by God's Providence. To recklessly overthrow it is to defy this providential arrangement and risk plunging into a state *more* devoid of God's structuring influence. Obedience becomes a form of accepting the tragic limitations of the fallen world while focusing on the transcendent realm accessible only through faith.

  **Conclusion:**

  Pascal does not champion "might makes right." He performs a devastating autopsy on human political reality, revealing force as the inevitable victor in a world where sin has rendered reason impotent to define and enforce universal justice. However, this force is not justice incarnate; it is **a tragic, divinely tolerated substitute for the unattainable divine justice**, a necessary dam holding back the floodwaters of chaos. The "mystical foundation" is the fragile edifice of belief humans construct to make this bitter necessity palatable and functional. To rebel against established customs, therefore, is not merely risky; it is to risk unleashing the absolute evil of disorder by shattering the necessary substitute, all while possessing no capacity to build the true justice that remains forever beyond human reach. Pascal's solution lies not in politics, but in the *agrégation* to God through the wager and the grace of Christ – the only path out of the desperate cycle where force must masquerade as justice because true justice cannot dwell among the fallen.
