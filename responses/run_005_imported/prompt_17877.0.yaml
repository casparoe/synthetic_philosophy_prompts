answer: |-
  The gaslight hissed in the study of 20 Hanover Square, London. Outside, a late autumn fog, thick as wet wool, pressed against the windows. Inside, the air hung heavy with expectation and the faint scent of camphor – Mrs. Thorne’s preferred offering to the spirits, or perhaps just her rheumatism. Henry Sidgwick, sixty-two years old and feeling every one of them in the ache of his bones and the familiar throb behind his temples, adjusted his spectacles. The familiar weight of his notebook felt like an anchor, a necessary counterbalance to the swirling currents of hope and dread that always accompanied these sittings.

  Opposite him, bathed in the dim, concentrated light of a single shaded lamp, sat Madame Elara. She was new, recommended by a colleague Sidgwick respected perhaps a fraction less than he pretended to. Her hands, pale and surprisingly large, rested palms down on the heavy oak table. Sidgwick noted the slight tremor in her left index finger – fatigue? Nervousness? Or the nascent stirrings of… something else?

  *Dualism of Practical Reason.* The phrase echoed in his mind, a constant, grinding counterpoint to the séance’s hushed atmosphere. For decades, it had been the rock upon which his ethical system threatened to founder. Could morality be *fully* rational, truly binding, without the assurance of ultimate justice? Without the soul’s survival? Reason alone offered no such guarantee. It pointed towards duty, yes, but also towards the individual’s pursuit of happiness. Only the prospect of a cosmic ledger balancing virtue and reward could resolve the tension. And proof of that prospect… remained stubbornly elusive. This room, these darkened séances, were his laboratory for the most crucial experiment of all.

  "Shall we begin, Professor Sidgwick?" Madame Elara’s voice was low, a touch hoarse. Sidgwick nodded, a curt, economical gesture. He felt the familiar prickle of anticipation – a longing so deep it was almost physical. *Let it be real. Just this once. A sign. A confirmation.*

  The room descended into deeper silence, broken only by the ticking of the mantel clock and the faint wheeze of Sidgwick’s own breath. He forced his mind into its analytical groove. *Observe. Record. Correlate.* He noted the position of Madame Elara’s hands, the distance to the edge of the table, the tension in her shoulders. Two other SPR members sat flanking him, silent witnesses: Eleanor, earnest and hopeful; and Dr. Langham, a physiologist, his expression carefully neutral.

  Minutes stretched. The gaslight flickered. Sidgwick felt the familiar fatigue, the drag of countless hours spent in similar rooms, chasing wisps of evidence that dissolved under scrutiny like the London fog. *How many mediums? How many rappings, cold spots, floating trumpets?* Eusapia’s muscular tremors mistaken for spirit hands. The Davenport brothers’ clever cabinet tricks. The endless, heartbreaking parade of fraud and self-delusion. Yet… the anomalies persisted. The inexplicable message from a deceased colleague, containing information known only to him. The cold wind in a sealed room. *Data points. Insufficient. Always insufficient.*

  A sudden, sharp *crack* echoed in the stillness. Sidgwick’s pencil jumped on the page. Madame Elara gasped, her head lolling slightly. "He… he is near," she murmured. "A presence… strong… confused."

  Sidgwick’s pulse quickened. *Which he?* He scanned the table. A small bell, placed in the center as a potential focus, remained motionless. *Observe. Record.* He noted the time: 9:17 PM. *Could the sound have been a joint in the old table settling? Or a deliberate rap from Madame Elara? Position of her feet… obscured by the tablecloth.*

  "Does he have a name?" Eleanor whispered, her voice trembling.

  Madame Elara shuddered. "Arthur… no… Albert? Pain… there is pain… a drowning…"

  Sidgwick’s breath caught. His younger brother, Arthur, lost at sea decades ago. *Drowned.* A fact known, perhaps researched? His name was not uncommon. *Correlation, not causation. A statistically probable guess.* Yet, the specificity… the *pain*… A fierce, irrational surge of hope flared in his chest, warm against the chill of the room. *Arthur? Is it possible?* The hunger for connection, for the closing of that ancient wound, was a physical ache. He *wanted* the trembling, the gasps, the pronouncement of pain, to be real. He wanted it more than he wanted his next breath. Proof. Resolution. An end to the dualism that shadowed his every ethical contemplation.

  Then, the cold. It began as a subtle draft near his ankles, rising swiftly into a palpable chill that seemed to emanate from the space directly above the table. Sidgwick shivered involuntarily. He saw Eleanor pull her shawl tighter, saw Dr. Langham’s eyes narrow, darting towards the windows, the fireplace – both sealed against the fog. Madame Elara moaned, a low, guttural sound. "Cold… so cold… he brings the sea…"

  *Sea.* Arthur. *Drowning.* The correlation tightened its grip. Sidgwick’s hand trembled slightly as he wrote: *9:21 PM. Marked temperature drop localized above table center. Subjective sensation corroborated by E.B. & T.L. Source?* He underlined the question twice. *Could Langham have brought a chemical? Dry ice was known… but impractical here? Check his person later.* The rationalist fought back, but the chill was *real*, seeping into his bones, carrying with it the ghostly tang of salt spray, or perhaps just the damp of London.

  A faint glow, no bigger than a candle flame, seemed to flicker momentarily in the air above Madame Elara’s head. Eleanor gasped. Sidgwick strained his eyes. *Phosphenes?* The result of prolonged staring in low light? A trick of the flickering gas mantle reflecting off Madame Elara’s jet brooch? It vanished as quickly as it appeared. *Record: 9:23 PM. Transient luminous phenomenon observed centrally. Duration <2 seconds. Subjective, requires corroboration.* He looked at Langham, who gave a minute, uncertain shake of his head. *Inconclusive.*

  Madame Elara slumped forward, breathing heavily. The oppressive cold began to recede as abruptly as it had arrived. "Gone…" she whispered, sounding utterly drained. "He… could not stay. The pain… too much."

  Silence descended again, thicker now, charged with spent energy and unanswered questions. Sidgwick slowly closed his notebook, the soft click loud in the stillness. The throb behind his temples intensified. The fierce hunger for proof, momentarily stoked by the cold and the name and the glow, now warred violently with the ingrained discipline of a lifetime. *Arthur?* The emotional pull was immense, a siren song promising peace, resolution, an end to the terrible dualism. *Just accept it. Let this be enough.*

  He looked at Madame Elara, slumped and pale. Exhaustion? Or the aftereffects of genuine channeling? He looked at the bell, untouched. He recalled the draft’s path, the possible sources of the glow, the statistical likelihood of guessing a drowned brother named Arthur or Albert. *Data points.* Fascinating. Troubling. Suggestive, even. But *proof*? Conclusive evidence of survival? Of a mechanism by which Arthur’s pain could manifest as cold air in a London drawing-room?

  *No.* The word formed in his mind, quiet but absolute. The rational faculty, honed over decades, imposed its familiar, frustrating order. To grant certainty here, based on *this*… it would be a betrayal of the very rigor he demanded. It would be granting himself a comfort his intellect could not justify. The dualism remained. The profound difficulty endured. The evidence, as always, whispered but refused to speak clearly.

  He sighed, the sound a dry rustle in the quiet room. It was the sigh of a man perpetually standing on a threshold he could not cross, looking into a darkness that offered only tantalizing, ambiguous flickers. He felt the familiar weight of suspended judgment, a burden both heavy and strangely necessary. The hunger gnawed, a constant companion, but it was a hunger he would not sate with illusion.

  "Thank you, Madame Elara," he said, his voice steady, betraying none of the inner tumult. "A most… interesting sitting." He pushed back his chair, the legs scraping softly on the floor. The fog outside seemed to press closer, a tangible echo of the uncertainty within. The experiment, like his life’s work, remained stubbornly, critically, unresolved. He gathered his notebook, the anchor against the tide of longing, and prepared to step back into the world where reason demanded he remain, forever poised between hope and doubt.
