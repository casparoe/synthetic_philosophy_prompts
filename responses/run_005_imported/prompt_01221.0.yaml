answer: |-
  Your philosophical itch cuts to the heart of a deep problem in causation, especially regarding omissions. You've correctly identified the core tension: counterfactual dependence alone (if X had acted, the harm wouldn't have occurred) is too broad, capturing *every* possible preventer. The "abnormality" fix attempts to narrow it down, but as your outage shows, it fractures into statistical rarity and normative expectations (duties/roles), which often diverge. I argue that **only the normative repair (appealing to duties/role-based expectations) can non-arbitrarily distinguish the "cause" among equally counterfactually relevant omissions.** Statistical rarity alone is insufficient and often arbitrary in complex socio-technical systems, making causation-by-omission inherently normative.

  Here's the argument, structured to address your scenario:

  1.  **The Problem of Over-Determination by Omission:**
      *   Both the on-call engineer (OCE) muting the alert and *not* rechecking the dashboard *and* the neighboring engineer (NE) seeing ambiguous latency and *not* investigating were counterfactually necessary for the 20-minute delay: if *either* had acted appropriately at the relevant time, the outage would likely have been mitigated sooner.
      *   Counterfactual dependence alone makes both omissions "causes." This is intuitively wrong and practically useless for postmortems, as it dilutes responsibility and offers no clear focus for remediation.

  2.  **The Failure of Statistical Rarity ("Abnormality" as Frequency):**
      *   You state the key flaw: "The difference wasn't that one omission was more unusual than the other; it was that only one of them owned that service."
      *   **Equivalence in Rarity:** Your data shows both types of omission (OCE not rechecking muted alerts, NE not investigating ambiguous signals outside their service) occur with comparable statistical rarity. Neither omission is significantly "more abnormal" than the other in terms of pure frequency.
      *   **Arbitrariness of Reference Classes:** What defines the relevant "normal" baseline?
          *   Is it "all engineers"? Then *both* omissions are abnormal (rare).
          *   Is it "on-call engineers"? Then the OCE's omission *might* be abnormal relative to *other OCEs*, but the NE's omission is irrelevant to this class.
          *   Is it "engineers seeing ambiguous latency signals"? Then the NE's omission *might* be abnormal relative to *other engineers seeing ambiguous signals*, but the OCE's omission (related to muting/rechecking) is a different behavior.
      *   **Rarity Doesn't Capture Relevance:** Statistical rarity tells us *how often* something happens, not *why* we *care* that it happened *in this specific context*. It doesn't distinguish between a rare failure in a system designed to prevent harm and a rare failure in a system with no such design or expectation. The rarity of a random bystander not jumping into a frozen lake to save a child is high, but we don't call them a "cause" of the drowning. The rarity of a designated lifeguard on duty not jumping in might be lower, but they *are* seen as a cause.

  3.  **The Necessity of the Normative Repair (Duties/Roles/Reasonable Expectations):**
      *   **Non-Arbitrary Distinction:** The *only* non-arbitrary difference between the OCE and the NE in your scenario is the **role-based duty and expectation**.
          *   The OCE had an explicit, defined, and accepted *duty* to monitor the health of that specific service, respond to its alerts, and manage alert states (including responsibly handling mutes). Their job description, the on-call rotation assignment, and the alerting system itself create a normative expectation: *they should have rechecked the muted alert.*
          *   The NE had no such duty or normative expectation regarding *that specific service*. While seeing ambiguous latency *might* prompt investigation out of general diligence or curiosity, there is *no role-based obligation* for them to act on signals outside their assigned domain. Their omission, while counterfactually relevant, falls outside the scope of their defined responsibilities. It's not what they *should* have been expected to do as part of their job function concerning *this* system.
      *   **Causation Anchored in Function:** The outage occurred *because* the system designed to catch and respond to this specific failure mode (the OCE role) didn't function as normatively expected. The NE was never part of *that* system's normative design. Their potential action would have been serendipitous, not fulfillment of a defined role.
      *   **"Reasonable Expectation" is Normative:** Determining what constitutes a "reasonable expectation" for an engineer in a given situation inherently involves normative judgments about responsibilities, role boundaries, professional standards, and system design intent. It cannot be reduced to "what people statistically do most of the time." We *expect* lifeguards to save swimmers, even if statistically, most people don't. We *expect* on-call engineers to monitor their alerts, even if statistically, engineers rarely look at dashboards for services they don't own.

  4.  **Why Normative Neutrality Fails:**
      *   **Structure Relies on Norms:** Appealing to "organizational structure" doesn't escape normativity. The structure exists *because* of normative decisions about division of labor, responsibility assignment, and accountability. The reason the OCE "owns" the service is fundamentally normative.
      *   **Frequency Undermines Purpose:** Relying purely on statistical frequency would mean:
          *   If NEs *commonly* checked dashboards outside their service, then *their* omission *might* become statistically abnormal and thus "causal," even though they had no duty! This misattributes cause.
          *   If OCEs *rarely* rechecked muted alerts (making it "normal"), then their omission might *not* be deemed "abnormal" and thus not causal, even though they *had* a duty! This absolves responsibility where it normatively belongs.
      *   **Postmortem Purpose:** Blameless postmortems aim to improve systems. Identifying the "root cause" normatively (failure in the *assigned* safety mechanism) directly points to actionable fixes: better alert mute timeouts, training on mute hygiene, clearer escalation paths for OCEs. Blaming the NE (or statistically common NE behavior) points to no *systemic* fix within the relevant service's operational model.

  **Conclusion for Your Outage:**

  The postmortem correctly identified the OCE's omission as the root cause, not because it was statistically rarer than the NE's omission (your data suggests it wasn't), but because the OCE occupied a specific **normative role** with defined **duties and expectations** regarding that service's alerts. The OCE was the designated component in the system intended to detect and respond. Their failure to fulfill that normative function *is* why the outage persisted. The NE's omission, while counterfactually relevant, lacked this normative grounding. No purely statistical or structurally neutral fact can replicate this distinction without smuggling in normative assumptions about "proper" function or "assigned" roles. Therefore, causation by omission, especially in complex, role-defined systems like SRE, *is* inherently normative. The "cause" is the omission that breached a duty or reasonable expectation derived from roles and system design, not merely the rarest omission. Your outage illustrates this perfectly: ownership *is* the normative expectation that makes the difference.
