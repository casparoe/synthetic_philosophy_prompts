  I should also address possible objections. For example, someone might argue that duties are derived from statistical norms. But duties often exist regardless of common practice. A lifeguard has a duty to save a drowning person even if others are present and could help. The role creates the obligation, not the frequency of inaction.

  Another angle: the purpose of blameless postmortems. They aim to improve systems, not assign blame. But identifying root causes still involves distinguishing between relevant factors. The normative approach helps focus on which gaps to fix—like enforcing alert mute timeouts—rather than expecting all engineers to monitor everything.

  The user's deeper need might be validating their observation that current frameworks are insufficient. They might seek a philosophical foundation to advocate for role-based expectations in incident analysis. Or to justify process changes that clarify responsibilities, reducing ambiguity in future postmortems.

