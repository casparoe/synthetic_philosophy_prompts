prompt: |-
  I've been working through James's "The Will to Believe," and I'm encountering a difficulty. James argues that we can justifiably adopt certain beliefs when ordinary evidence is insufficient. But doesn't this appear to permit unjustified belief generally? What distinguishes the cases where James thinks belief without evidence is justified from those where it plainly isn't?
