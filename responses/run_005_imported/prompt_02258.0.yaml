answer: |-
  You've hit on a genuinely insightful analogy, and your frustration is understandable. Applying Bayesian model averaging (BMA) or similar ensemble methods to moral uncertainty *is* a natural and appealing approach that many philosophers working on the problem *do* consider seriously (e.g., William MacAskill, Toby Ord, Nick Bostrom, and others in the effective altruism/rationalist sphere). However, philosophers treat it as an open problem because applying statistical decision theory directly to ethics runs into several deep, non-trivial challenges that don't arise (or are easily resolved) in standard predictive modeling. Here's why it's contested:

  1.  **Incommensurability of Moral Outputs:**
      *   **The Problem:** Different ethical theories don't output values on the *same scale* or in the *same currency*. Utilitarianism outputs expected utility (often in hedons, QALYs, or dollars). Deontology outputs categorical imperatives, duties, permissions, and prohibitions (often binary or ordinal). Virtue ethics outputs judgments about character or eudaimonia (flourishing). Contractualism outputs judgments about justifiability to others. How do you numerically combine "Expected utility gain: +100 hedons" (Utilitarianism) with "Violates a perfect duty: Forbidden" (Kantianism) or "Is courageous: Good" (Virtue Ethics)?
      *   **Analogy Breakdown:** In predictive modeling, models usually output predictions on the same scale (e.g., probability of default, sales forecast). You average probabilities or expected values. Averaging a probability (0.8) with a categorical "Forbidden" is meaningless without a meta-theory defining how to map "Forbidden" onto a numerical scale comparable to utility.

  2.  **Assigning Normative Credences:**
      *   **The Problem:** Assigning a "credence" (P) to an ethical theory isn't like assigning a prior to a statistical model. Statistical priors are often based on frequency data, simplicity, or past predictive performance. Credences in moral theories are fundamentally *normative* judgments. *How* do you justify putting P=0.7 on Utilitarianism vs. P=0.3 on Deontology? Is this based on intuitive plausibility? Coherence? Historical performance (a dubious metric for ethics)? The process of assigning these credences *itself* requires normative assumptions about what makes one theory more credible than another – assumptions that might not be neutral between the theories.
      *   **Analogy Breakdown:** Model weights in BMA are usually justified empirically (cross-validation, AIC/BIC) or via objective priors. There is no equivalent empirical validation ground truth for moral theories. Assigning weights is inherently a normative choice, raising the question: *Which meta-ethical theory tells you how to assign these weights?*

  3.  **The Regress Problem / Choosing the Aggregation Rule:**
      *   **The Problem:** BMA *is* a specific aggregation rule. But why choose BMA? Why not minimax regret? Why not a voting system? Why not prioritize avoiding the worst-case violation according to any theory? The choice of *how* to aggregate the outputs of different moral theories under uncertainty is *itself* a normative decision. This leads to a regress: What meta-meta-theory tells you which aggregation rule to use under meta-ethical uncertainty?
      *   **Analogy Breakdown:** In statistics, the choice of aggregation rule (BMA vs. other methods) is often made based on *frequentist properties* (e.g., BMA minimizes squared error under certain conditions) or *pragmatic decision-theoretic goals* (e.g., maximize predictive accuracy). In ethics, the justification for an aggregation rule must be *moral* – does this rule produce morally acceptable outcomes under uncertainty? This pushes the problem up a level without necessarily resolving it.

  4.  **Theory-Ladenness of "Options" and "Outcomes":**
      *   **The Problem:** Different ethical theories don't just *evaluate* actions differently; they often *define the relevant actions and outcomes* differently. A utilitarian sees an action as a cause leading to states of welfare. A deontologist sees it as instantiating or violating a rule. A virtue ethicist sees it as expressing character. What counts as "the same action" for input into the ensemble? How do you even define the outcome space that different theories evaluate?
      *   **Analogy Breakdown:** In predictive modeling, the input features (X) and the target variable (Y) are usually well-defined and agreed upon before model building starts. The ensemble operates on this shared definition. In ethics, the very description of the decision problem is contested ground.

  5.  **Normative Force and Reflective Equilibrium:**
      *   **The Problem:** Moral reasoning often aims for *reflective equilibrium* – a coherent fit between our specific moral judgments, general principles, and background theories. Simple BMA might output a recommendation that feels deeply morally counterintuitive (e.g., slightly violating a core deontological constraint for a small utilitarian gain). Do we accept this as the cost of uncertainty, or does it signal a problem with the aggregation method? The "output" of the ensemble might lack the intuitive normative force we expect from a moral conclusion.
      *   **Analogy Breakdown:** A predictive model's output is judged solely by its predictive accuracy. A moral aggregation method's output is judged by whether we feel *morally obligated* to follow it, which involves complex psychological and philosophical factors beyond simple optimization.

  **Where Your Analogy Holds Water and Why Philosophers Use It:**

  Despite these challenges, the BMA/ensemble approach remains a major contender in the literature on moral uncertainty, *especially* within effective altruism and rationalist circles, precisely because it leverages powerful decision-theoretic tools. Proponents like MacAskill (in "Moral Uncertainty") argue:

  1.  **Parsimony:** It uses existing, well-developed decision theory.
  2.  **Plausibility in Simple Cases:** In cases where theories *can* be roughly mapped to a common scale (e.g., different flavors of utilitarianism disagreeing on population ethics), BMA works intuitively well.
  3.  **Action Guidance:** It provides a clear, computable (in principle) procedure for making decisions under moral uncertainty, avoiding paralysis.
  4.  **Pragmatism:** Even if imperfect, it's arguably better than alternatives like picking one theory arbitrarily or doing nothing.

  **Conclusion: Not "Behind the Curve," But Grappling with Unique Complexities**

  Philosophers aren't "behind the curve" for ignoring a simple solution. They recognize the power of the ensemble analogy (many actively work with it!), but they are rigorously exploring the *unique complexities of normativity* that prevent a straightforward application of statistical decision theory. The open questions revolve around:

  *   **Commensurability:** How to (or whether to) translate fundamentally different kinds of moral verdicts into a common currency for aggregation?
  *   **Meta-Justification:** How to normatively justify the credences assigned and the aggregation rule chosen without begging the question or entering an infinite regress?
  *   **Descriptive Adequacy:** Does the output of such a procedure actually align with our considered moral judgments under uncertainty, or does it produce "moral monsters"?

  So, your insight is excellent and foundational to modern approaches to moral uncertainty. The reason it's still an "unresolved problem" is that translating this statistical insight into a workable, normatively justified *ethical* framework requires solving deep philosophical puzzles that simply don't exist when averaging weather prediction models. The contestation is over *how* to solve those puzzles within the decision-theoretic framework, or whether a different framework is needed altogether. Your field provides the crucial engine; philosophy is grappling with how to build the specialized chassis and navigation system needed for the unique terrain of ethics.
