prompt: |-
  I'm the engineering representative on my company's model risk committee, which oversees the machine-learning models behind our lending product. For most applicants our default-risk model is stable, but for "thin-file" applicants (little credit history) the predicted probability is fragile: refitting on different, equally defensible bootstrap samples swings the estimate anywhere from 4% to 22%. One committee member wants us to report these cases as a range rather than a single number, arguing that forcing a point estimate here manufactures false precision, and to route any applicant whose range straddles our approval cutoff to manual underwriting instead. Another member argues this doesn't resolve anything: a loan still gets approved or denied, so a sharp line is drawn somewhere regardless, and two otherwise-identical applicants could now get different outcomes depending on which model snapshot was retrained most recently -- and the committee could reverse the same decision a week later with no new evidence at all. Please draft the short memo I'll bring to next week's meeting: recommend a concrete policy, including exactly how a reported range should translate into an approve/deny/refer decision, and take the second member's inconsistency objection seriously rather than brushing past it.
reasoning: |-
  We are facing a problem of model fragility for thin-file applicants. The model predictions vary widely (4% to 22%) when refitted on different bootstrap samples. The committee is divided on how to handle this:

  - One member suggests reporting a range and routing applicants whose range straddles the cutoff to manual underwriting.
  - Another member argues that this doesn't resolve the inherent inconsistency because:
    - A loan must still be approved or denied eventually, so a sharp cutoff exists regardless.
    - Two identical applicants might get different outcomes based on the model snapshot used.
    - The committee could reverse a decision a week later without new evidence.

  We need a policy that:
  1. Acknowledges the model's instability for thin-file applicants.
  2. Provides a clear rule for translating the model output (whether a point or a range) into an approve/deny/refer decision.
  3. Addresses the inconsistency concern.

  Proposal:

  We should report a range (e.g., 4%-22%) for thin-file applicants. However, to address the inconsistency concern, we must avoid making the final decision overly sensitive to the exact model snapshot. Therefore, we should use the range to determine a referral to manual underwriting, but then ensure that the manual underwriting process is consistent and that the same applicant isn't re-evaluated arbitrarily without new evidence.

  Concrete Policy:

  1. For each thin-file applicant, the model will be retrained on multiple (e.g., 100) bootstrap samples to generate a distribution of predicted probabilities. We will report the 5th and 95th percentiles as the range (to capture the uncertainty).

  2. Define three regions relative to the approval cutoff (let's say the cutoff is C, e.g., 10%):
     - **Approve automatically**: If the entire range (i.e., both the 5th and 95th percentiles) is below C.
     - **Deny automatically**: If the entire range is above C.
     - **Refer to manual underwriting**: If the range straddles C (i.e., the 5th percentile is below C and the 95th percentile is above C, or if C is inside the range).

  3. For the manual underwriting process:
     - The underwriter will have access to the entire distribution (or at least the range) and the model's point estimate (e.g., the median of the bootstrap distribution) as one input, along with other non-model factors (e.g., income, employment, etc.).
     - Crucially, we must establish a policy that once an applicant is manually underwritten, that decision is final for a defined period (e.g., 30 days) unless there is new material information. This prevents arbitrary reversals without new evidence.

  4. To address the inconsistency concern for the model point estimates:
     - We will freeze the model snapshot used for a given application. That is, the model version (and the bootstrap samples used to generate the range) will be tied to the application date. If the same applicant reapplies within a short period (say, 30 days) and there's no new information, we will use the same model snapshot and the same manual underwriting decision (if applicable) to ensure consistency.

  5. Additionally, we should invest in improving the model for thin-file applicants in the long run (e.g., by collecting more data, using alternative data sources, or using more robust modeling techniques).

  This approach:
  - Avoids false precision by reporting a range.
  - Uses the range to trigger manual review when there's high uncertainty.
  - Addresses the inconsistency concern by:
     a. Freezing the model snapshot per application.
     b. Making manual underwriting decisions final for a period without new evidence.
     c. Ensuring that reapplications without new information are treated consistently by reusing the same model snapshot and prior decision.

  Memo Draft:

  ---

  **To:** Model Risk Committee  
  **From:** [Your Name], Engineering Representative  
  **Date:** [Date]  
  **Subject:** Policy for Handling Fragile Predictions in Thin-File Applicants  

  ### Background
  Our current default-risk model exhibits high instability for thin-file applicants, with predictions varying from 4% to 22% across equally defensible model refits. This memo proposes a policy to address this fragility, balancing the need for accurate risk assessment with the requirement for consistent decision-making.

  ### Key Concerns Addressed
  1. **False Precision**: Reporting a single point estimate for thin-file applicants masks high uncertainty.
  2. **Inconsistency**: Without safeguards, the same applicant could receive different decisions based on the model snapshot or timing, and decisions could be arbitrarily reversed without new evidence.

  ### Proposed Policy
  1. **Model Output Reporting**:
     - For thin-file applicants, report a range (5th to 95th percentile) derived from 100 bootstrap refits of the model.
     - Continue to report a point estimate (median of the bootstrap distribution) for manual underwriting reference.

  2. **Decision Rules**:
     - **Automatic Approval**: Entire range below the cutoff (e.g., <10%).
     - **Automatic Denial**: Entire range above the cutoff (e.g., >10%).
     - **Manual Underwriting**: Range straddles the cutoff (e.g., 5th percentile <10% and 95th percentile >10%).

  3. **Consistency Safeguards**:
     - **Model Snapshot Freeze**: The specific model snapshot (including bootstrap samples) used for an application is recorded and frozen. If the same applicant reapplies within 30 days with no new material information, the same snapshot and prior decision (if manually underwritten) will be reused.
     - **Finality of Manual Decisions**: A manual underwriting decision is final for 30 days unless new material information emerges. This prevents arbitrary reversals without cause.

  4. **Long-Term Mitigation**:
     - We will initiate a project to improve model stability for thin-file applicants (e.g., via alternative data or model architecture changes).

  ### Conclusion
  This policy explicitly acknowledges model uncertainty by reporting a range and routing uncertain cases to manual underwriting. The safeguards against inconsistency ensure that we do not introduce arbitrary variation in decisions. I recommend we adopt this approach and review its effectiveness in six months.

