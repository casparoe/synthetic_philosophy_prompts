answer: |-
  **To:** Model Risk Committee  
  **From:** [Your Name], Engineering Representative  
  **Date:** [Date]  
  **Subject:** Policy Recommendation for Handling Fragile Predictions in Thin-File Applicants  

  ### Issue Summary  
  Our default-risk model exhibits high instability for thin-file applicants, with predictions swinging from **4% to 22%** across equally defensible bootstrap refits. This introduces two concerns:  
  1. **False Precision**: Reporting a single point estimate masks material uncertainty.  
  2. **Inconsistency**: A policy relying solely on ranges could create arbitrary outcomes (e.g., approval/denial reversals without new data).  

  ### Proposed Policy  
  To balance transparency, risk management, and consistency, I recommend:  

  #### 1. **Report Predictions as a Range**  
     - For thin-file applicants, output the **5th–95th percentile interval** (e.g., 4%–22%) from 100 bootstrap refits.  
     - **Rationale**: This quantifies uncertainty and avoids false precision.  

  #### 2. **Decision Rules Based on Range Position vs. Cutoff**  
     Define the approval cutoff (e.g., 10%) and apply:  
     - **AUTOMATIC APPROVAL**: Entire range **below** cutoff.  
       *Example: Range = 4%–9% → Approve.*  
     - **AUTOMATIC DENIAL**: Entire range **above** cutoff.  
       *Example: Range = 11%–22% → Deny.*  
     - **REFER TO MANUAL UNDERWRITING**: Range **straddles cutoff**.  
       *Example: Range = 4%–22% (cutoff = 10%) → Refer.*  

  #### 3. **Critical Consistency Safeguards**  
     To address arbitrariness in manual underwriting and model snapshots:  
     - **Freeze Model Snapshots**: Once an applicant is scored, their prediction range is **locked** to a single model snapshot. Re-evaluations within **30 days** must reuse this snapshot unless material new data (e.g., updated credit file) is available.  
     - **Finalize Manual Decisions**: Manual underwriting outcomes are **binding** for 30 days. Committees may not revisit without **new evidence**.  
     - **Audit Trail**: Log all model snapshots, ranges, and final decisions to detect bias or inconsistency.  

  ### Why This Addresses the Inconsistency Objection  
  The second member rightly notes that any policy must prevent arbitrary outcomes. This proposal:  
  - **Eliminates Snapshot Roulette**: By freezing snapshots per applicant, two identical applicants *cannot* receive different results due to retraining timing.  
  - **Prevents Decision Reversals**: Binding manual outcomes + snapshot locking ensure approvals/denials are stable absent new data.  
  - **Sharp Cutoffs Are Contained**: Uncertainty is confined to manual underwriting (where human judgment adds stability), while automatic decisions are unambiguous.  

  ### Long-Term Mitigation  
  Concurrently, we will:  
  1. Prioritize improving thin-file model stability (e.g., alternative data, ensemble methods).  
  2. Report quarterly on the volume/outcomes of manual referrals to assess policy efficacy.  

  ### Recommendation  
  Adopt this policy immediately for thin-file applicants. It transparently surfaces uncertainty while enforcing consistency—turning a fragility into a controlled process.  

