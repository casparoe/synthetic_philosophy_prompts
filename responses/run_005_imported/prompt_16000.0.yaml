  First, I need to recap the HOT theory. According to Rosenthal, a mental state is conscious if there's a higher-order thought about being in that state. So consciousness depends on the higher-order representation, not just the first-order state itself.

  Theo's first move is about misfiring HOTs. He argues that if a HOT represents you as being in pain without an actual pain state, the theory says you'd still consciously feel pain, even without the painful sensation. That seems problematic because there's no actual hurt. Theo's point challenges whether the theory can account for the phenomenal quality of experience.

