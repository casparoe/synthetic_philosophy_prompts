  So last night my friend Priya and I got into a whole thing about Bell's theorem after she sent me a clip about the 2022 Nobel going to Aspect, Clauser and Zeilinger, and it kind of spiraled into an argument neither of us could actually resolve. She's adamant the experiments just straight-up prove the universe is nonlocal, "spooky action at a distance," end of story. I kept saying that feels too quick, since as I understand it the theorem's locality assumption is bundled together with an assumption of realism (hidden variables having definite values before anyone looks), so you technically get to choose which one to blame. Like, Bohmian mechanics apparently just accepts nonlocality outright and keeps realism, a lot of Copenhagen-flavored answers seem to want to keep locality and drop realism instead, and then I've even seen some many-worlds people claim their picture stays fully local because nothing ever collapses in the first place -- which feels like a totally different move again from either of the other two.

  Here's the bit where I really got stuck and Priya said I was just making stuff up: I have this half-memory of reading that Bell's own "locality" condition actually splits into two logically seperate pieces -- something about whether your result can depend on the far-away measurement setting versus whether it can depend on the far-away outcome itself -- and that ordinary quantum mechanics only violates one of those two, which is apparently the whole reason you can have "nonlocal" correlations without anyone being able to send an actual signal faster than light. I might have the names or details wrong. Could you walk me through this properly, at a gut level rather than just restating the inequality math? I did one intro modern physics course years ago and that's about it, so I want the actual substance behind the split, why it matters so much for what "nonlocal" even means here, and whether moves like superdeterminism or many-worlds genuinely rescue locality or just quietly relocate the weirdness to a different part of the theory.
