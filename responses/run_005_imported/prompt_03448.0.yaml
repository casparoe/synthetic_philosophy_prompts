  FDT's answer is grim for Death-like cases: No action avoids regret. But real-world predictors aren't gods—they're fallible, updatable, and often probabilistic. That's where nuance kicks in. Maybe the "principled way out" isn't in decision theory alone but in game theory (if predictors are adversarial) or system design (if we can influence how predictions are used). 

