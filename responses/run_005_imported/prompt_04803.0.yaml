  quick question from my epistemology seminar - we've been working through the peer disagreement literature and today we got into Aumann's agreement theorem and the common prior assumption behind it. if I'm understanding the common prior assumption right, it's basically saying that any fully rational Bayesian agent has to start out with the exact same prior as every other fully rational Bayesian agent, since theres no legitimate reason for two rational people's priors to differ before either of them has seen any evidence. so doesnt that mean if my roommate and I look at the exact same weather forecast and still end up with genuinely different gut credences that it'll rain tomorrow, at least one of us has to be messing something up, even before either of us says a word? feels like a really useful test for spotting irrationality but also kind of too strong to be true, so wanted to sanity check before i start using it on people lol
