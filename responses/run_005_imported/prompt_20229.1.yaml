answer: |-
  Here are 8 interview questions targeting the mechanics of the resolute-choice position on Kavka's toxin, complete with follow-ups designed to deepen the discussion after likely answers:

  1.  **On Bratman's Simple View:** "Bratman argues that intending to φ essentially involves *believing* you will φ. Given that a fully rational agent in the toxin puzzle, by your own account, *knows* they'll have no reason to drink the toxin tomorrow, how can they simultaneously form the *intention* to drink it without violating this belief condition or engaging in self-deception?"
      *   *Likely Answer/Follow-up:* (If she argues intentions are commitments to plans, not predictions) "But if the agent *knows* the plan will be rationally abandoned later, isn't this 'commitment' inherently unstable or contradictory? How does this differ from intending to do something impossible?"

  2.  **On McClennen's Framework:** "McClennen's resolute choice was developed for contexts like temptation or changing tastes within *non-expected utility* frameworks (e.g., Allais Paradox), where agents stick to a *pre-selected plan* to avoid dynamic inconsistency. Kavka's puzzle involves a *predictor* and standard expected utility. Is extending 'resolution' to this predictor-based case a natural evolution of McClennen's idea, or does it fundamentally change the concept by introducing an external agent who exploits the commitment?"
      *   *Likely Answer/Follow-up:* (If she argues it's a natural extension) "McClennen's agent resolves to stick to a *preferred* plan made earlier. In the toxin case, the 'plan' to drink the toxin *isn't* preferred at the drinking time – it's costly and pointless. Doesn't this make 'resolution' here feel more like externally enforced *dogmatism* than rational adherence to a prior optimal plan?"

  3.  **On Predictor Reliability:** "Your argument relies heavily on the billionaire's *infallible* detection of true intentions. Suppose the detector is merely *very reliable* – say, 99.9% accurate – but there's a tiny chance it misreads your intention. How does this uncertainty impact the rationality of *forming* the intention and *drinking* the toxin? Does it undermine the 'updateless' logic?"
      *   *Likely Answer/Follow-up:* (If she argues high reliability still strongly supports resolution) "Doesn't even a tiny uncertainty reintroduce a *local* incentive to defect after midnight? If the detector *might* have already credited you the million based on a misread, even if unlikely, doesn't drinking the toxin then become a strictly dominated action? How does a resolute agent weigh this?"

  4.  **On the Line Between Reward and Exploitation:** "In Newcomb or the toxin puzzle, being predictably resolute is rewarded. In a 'blackmail' scenario (e.g., 'Pay me or I release damaging info, and I know if you *intend* to pay'), being predictably resolute to pay invites exploitation. What's the *structural difference* in the predictor's payoff mechanism that makes resoluteness rational in one case but irrational in the other, according to your view?"
      *   *Likely Answer/Follow-up:* (If she distinguishes based on the reward being *for the disposition itself*) "Couldn't a clever adversary *design* a toxin-like scenario that *functions* like blackmail? For example: 'I'll give you $1M tonight if you form the genuine intention to give me $900k tomorrow.' Here, resoluteness gets you $100k net, but weakness gets you $1M. Isn't this structurally identical to blackmail? Where exactly does your theory draw the line?"

  5.  **On the Nature of the Intention:** "You argue the agent forms the *intention* to drink the toxin *now*, knowing full well they'll abandon it *later*. What is the *content* of this intention? Is it 'I will drink it no matter what,' or 'I will drink it unless I change my mind,' or something else? How does this specific content avoid the charge of being an empty performative act aimed solely at tricking the detector?"
      *   *Likely Answer/Follow-up:* (If she emphasizes a commitment to a *plan* or *policy*) "If the plan inherently includes the knowledge that it *will* be rationally abandoned later, how is this commitment anything more than a *temporary* resolve? Doesn't 'intention' typically imply a stability that persists into the execution phase?"

  6.  **On the Cost of Commitment:** "Resolute agents in your view adopt a *general* disposition or policy to follow through on commitments. In the toxin case, this yields a $1M payoff. But doesn't maintaining this disposition carry inherent risks? How does your theory weigh the *cost* of being this type of agent (e.g., vulnerability in blackmail-like situations, or the cost of actually drinking toxins) against the benefits (winning predictor games)? Is there a concern of overfitting?"
      *   *Likely Answer/Follow-up:* (If she argues the policy is net beneficial or context-specific) "Can an agent realistically adopt this resolute disposition *only* for toxin-like predictors and not for potential exploiters? How does the agent *know* which type of interaction they are in before forming the intention? Doesn't the need to discern this reintroduce a level of situational calculation that undermines the 'updateless' purity?"

  7.  **On Internal Rationality at t+1:** "At the moment *after* midnight, with the $1M secured, the resolute agent drinks the toxin. By standard causal decision theory (CDT), this action has negative utility and no compensating benefit – it's purely harmful. How do you reconcile the claim that drinking is *genuinely rational* at that moment with the CDT calculation showing it's strictly dominated? Is your theory claiming CDT is simply wrong at certain nodes?"
      *   *Likely Answer/Follow-up:* (If she argues rationality is assessed at the policy level) "Doesn't this imply that *local* actions judged irrational by CDT can be components of a *globally* rational strategy? Should we then abandon the idea that rationality must make sense at every choice node, accepting that some actions are 'rational' only by virtue of being part of a beneficial but locally costly pattern?"

  8.  **On Bootstrapping the Intention:** "The core puzzle is *how* the intention is formed *at midnight* given the foresight of defection. You say a rational agent *can* form it. Walk us through the *actual cognitive mechanics* at midnight: What belief or desire state constitutes forming this intention, knowing defection is imminent? Is it an act of will ignoring consequences, a commitment to a counterfactual world, or something else?"
      *   *Likely Answer/Follow-up:* (If she describes it as adopting a policy/rule) "How does adopting a *general* policy ('I follow through on commitments') at midnight *constitute* the *specific* intention to drink the toxin tomorrow, especially when the agent *knows* this specific instance is where the policy 'bites' them with a purely costly action? Isn't there a bootstrapping problem where the specific intention relies on the policy, but the policy's value relies on forming such specific intentions?"

  **Bonus (Addressing Identity/Continuity):**
  9.  **On the Agent Over Time:** "Your solution seems to treat the agent-at-midnight and the agent-at-drinking-time as implementing a single, temporally extended policy. But if the later agent has different information (knowing the money is secured) and strictly prefers *not* to drink, in what sense are they the *same rational agent* bound by the midnight commitment? Isn't the later agent rationally compelled to renege on the 'contract' made by their past self?"
      *   *Likely Answer/Follow-up:* (If she emphasizes diachronic agency/persisting identity) "Doesn't this view risk demanding an unrealistic degree of *identification* with past selves? If the current self suffers a clear, avoidable harm solely to satisfy a commitment made under different epistemic conditions, isn't this prioritizing abstract consistency over the welfare of the current decision-maker?"

  **Bonus (Empirical/Practical):**
  10. **On Psychological Plausibility:** "Leaving pure theory aside, do you see any empirical evidence or real-world analogues that support the psychological possibility of forming the 'genuine intention' required in the toxin puzzle? Can humans reliably induce in themselves an intention to do X while simultaneously believing they will (and should) abandon X when the time comes?"
      *   *Likely Answer/Follow-up:* (If she cites phenomena like pre-commitment devices) "But pre-commitment devices (like locking away money) work by *removing* the future choice. The toxin puzzle demands a *mental* intention to perform the action *while knowing you'll still have the unfettered choice to not do it*. Isn't this a uniquely challenging form of self-binding?"

  These questions are designed to push the guest beyond rehearsing the standard resolute/UDT justification and into the deeper philosophical, mechanical, and boundary-case implications of her position. The follow-ups anticipate common defenses and aim to probe their robustness. Good luck with the interview!
