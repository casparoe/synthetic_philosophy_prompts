answer: |-
  Both theories face significant challenges with higher-order vagueness (HOV), the phenomenon where the boundary between clear cases, borderline cases, and even the *status* of borderline cases itself seems vague. Here's how each theory attempts to cope, and a comparative assessment:

  **1. Epistemicism (Williamson's View):**
  *   **Core Claim:** "Heap" has a precise, sharp cutoff point (e.g., exactly *n* grains make a heap, *n-1* do not). Our inability to identify *n* is purely *epistemic* – we cannot know where the boundary lies due to fundamental limitations of our knowledge and the concept's nature.
  *   **HOV Challenge:** If "heap" has a sharp cutoff, what about "definitely a heap," "borderline heap," or "definitely not a heap"? Intuitively, these categories *also* seem to lack sharp boundaries. Where is the precise point between being definitely a heap and being borderline? Epistemicism seems forced to posit sharp cutoffs at *every* level, which feels deeply counterintuitive.
  *   **Epistemicist Coping Strategy:**
      *   **Uniform Treatment:** Williamson applies the *same* epistemic explanation to *all* levels of vagueness. Just as we cannot know the exact cutoff for "heap" (*n*), we cannot know the exact cutoff for "definitely a heap" (*m*), or for "definitely definitely a heap" (*p*), and so on.
      *   **Margin for Error Principle:** Our knowledge requires a "margin for error." To know that *x* grains make a heap, *x* must be safely inside the heap category – far enough from the true cutoff *n* that small variations (like +/- 1 grain) wouldn't push it into non-heap territory. Crucially, the *size* of this required safety margin *itself* is vague and unknowable. We know we need *some* margin, but we can't specify *how much*.
      *   **Higher-Order Safety:** Knowing that something is *definitely* a heap requires an even *larger* margin for error than knowing it's just a heap. This larger margin ensures it's safely away from the borderline zone for "heap." But again, the required size of *this* larger margin is vague and unknowable. This chain continues indefinitely.
      *   **Result:** Epistemicism bites the bullet. There *are* sharp boundaries at *every* order (heap/non-heap, definite/not-definite, definite-definite/not-definite-definite, etc.). However, our ignorance is total and inescapable at *every* level. The blurriness we perceive isn't in the world or the meaning, but solely in our *knowledge* of the precise boundaries that *do* exist. HOV is just higher-order *ignorance*.

  **2. Supervaluationism:**
  *   **Core Claim:** Vagueness stems from semantic indecision. "Heap" isn't defined by a single sharp cutoff but by a *range* of acceptable precisifications (ways of making it precise). A sentence is:
      *   **Super-true:** True on *all* admissible precisifications.
      *   **Super-false:** False on *all* admissible precisifications.
      *   **Indeterminate:** True on some precisifications, false on others.
      *   Classical logic is preserved for super-truth/super-falsity (e.g., "Either heap or not heap" is super-true).
  *   **HOV Challenge:** What determines which precisifications are "admissible"? The line between admissible and inadmissible precisifications seems *itself* vague. For example, precisifications drawing the heap/non-heap line at 10,000 grains or 100 grains are clearly inadmissible. But what about 1,000? 500? 200? Intuitively, there's a grey area for the precisifications themselves. This is HOV: the vagueness of "borderline case" translates to vagueness in the set of admissible precisifications.
  *   **Supervaluationist Coping Strategy:**
      *   **Iteration/Recursion:** Supervaluationism is applied recursively. First-order vagueness (heap/non-heap) is handled by a set of admissible precisifications (P1). Second-order vagueness (definite heap / borderline / definite non-heap) is handled by recognizing that the *set P1 itself* is vaguely defined. There is a second-order set of precisifications (P2), each member of which is a *different way of defining the set P1* (i.e., different ways of drawing the line between admissible and inadmissible first-order precisifications).
      *   **Penumbral Connections:** Key principles ("If 1000 grains is a heap, so is 1001 grains"; "If something is definitely a heap, it's a heap") are enforced as constraints on *all* precisifications at *all* levels. This ensures logical relations hold even across vague boundaries.
      *   **Truth Status:** "x is definitely a heap" is super-true (relative to P1) only if *x* is a heap on *every* precisification in *every* admissible set P1 (defined by P2). "x is borderline" is true if it's indeterminate relative to P1. Crucially, "x is definitely borderline" would require applying the supervaluation machinery *again* to P2, and so on.
      *   **Result:** Supervaluationism avoids sharp boundaries at any level by introducing higher-order indeterminacy. There is no single, sharp set of admissible precisifications; instead, there is vagueness all the way up. The "blurriness" is built into the *semantics* via the hierarchy of precisification sets.

  **Comparison and Which Comes Out Ahead:**

  Both theories offer sophisticated, logically rigorous responses. However, when HOV is taken into account, **supervaluationism has a significant advantage**:

  1.  **Intuitive Fit:** Epistemicism's core claim – sharp boundaries exist at *every conceivable level* of classification ("heap," "definite heap," "definite definite heap," etc.) – is profoundly counterintuitive. It posits an infinite hierarchy of unknowable facts that seem utterly disconnected from our experience and use of vague language. Supervaluationism, by embracing indeterminacy at higher orders, directly models the intuitive sense that the boundaries *themselves* are inherently blurry and resistant to precise location. It captures the open-texture of concepts better.
  2.  **Nature of the Difficulty:** Epistemicism *relocates* the core problem of vagueness (blurred boundaries) entirely into the realm of ignorance. HOV becomes just more ignorance. While logically consistent, this feels like explaining a phenomenon by declaring it unknowable rather than explaining its nature. Supervaluationism *accepts* the blurriness as a genuine feature of meaning (semantic indecision) and provides a framework to model it directly through its hierarchy of precisifications. It tackles the phenomenon head-on.
  3.  **Internal Coherence under HOV:** Epistemicism's reliance on unknowable sharp boundaries at every level creates a tension. The "margin for error" principle, essential for explaining ignorance, itself seems to *require* vague boundaries for its application (how much margin is "safe enough"?). Williamson argues the margin's size is precise but unknown, but this feels like special pleading. Supervaluationism's structure is inherently designed to accommodate vagueness iteratively. While complex, its recursive mechanism offers a more natural fit for the phenomenon it's trying to explain.
  4.  **The Collapse Problem (for Supervaluationism):** Critics argue that infinite levels of HOV might lead to a "collapse" where no sentence is ever determinately true or false. Supervaluationists counter that the framework allows for "fixed points" or sufficiently clear cases where higher-order indeterminacy doesn't affect the truth value at lower levels (e.g., 1 grain is determinately not a heap *relative to any reasonable precisification set*). While technically challenging, this seems less damaging than epistemicism's counterintuitive ontology of infinite sharp boundaries.

  **Conclusion:**

  While both epistemicism and supervaluationism grapple seriously with HOV, **supervaluationism comes out ahead**. Epistemicism's response – positing an infinite hierarchy of unknowable sharp boundaries – sacrifices intuitive plausibility for logical consistency in a way that feels deeply unsatisfactory. It explains the blur by asserting hidden sharpness. Supervaluationism, in contrast, incorporates the blur into its very semantic machinery through higher-order indeterminacy. By recursively applying the concept of semantic indecision, it provides a more natural and ontologically less jarring account of why the boundaries between clear cases, borderline cases, and even the *categories themselves* seem inherently unsettled. Its complexity is a direct consequence of grappling with the phenomenon, rather than an attempt to explain it away as ignorance. Therefore, when higher-order vagueness is fully considered, supervaluationism offers the more compelling and less counterintuitive solution.
