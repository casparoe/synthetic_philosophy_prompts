  First, Alex's position (1) is straightforward: time travel creates a logical contradiction. Maya counters (2) with the standard "consistent histories" approach - no contradiction because you always fail for mundane reasons. 

  Hmm, Alex's rebuttal (3) is interesting - he's calling out the "weirdness" factor even if it's technically consistent. That's a valid meta-point. Maya's free will defense in (4) feels a bit slippery with that "can" ambiguity... reminds me of Frankfurt cases in compatibilism. 

