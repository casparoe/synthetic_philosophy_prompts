  First, I need to unpack both ideas. CEV is about an AI figuring out what humanity would want if we were smarter, more informed, and more morally aligned. Philosophers have similar ideas—like what an idealized version of yourself would want. The user suspects the difference might be scaling CEV to all of humanity, causing coherence issues. 

