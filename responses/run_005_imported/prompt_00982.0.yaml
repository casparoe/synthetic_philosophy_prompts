prompt: |-
  Random tangent, but I could use some help untangling something. I'm about two-thirds into a big multi-generational war novel—several families, a couple of major battles, the whole sprawling-epic thing—and my agent keeps comparing it to War and Peace, which sent me back to Tolstoy this month. My old MFA workshop leader always used to say that Tolstoy basically wrote his own users manual for this kind of book in that late essay, "What Is Art?," where he supposedly uses War and Peace itself as the worked example of his "infectiousness" theory—the idea that a novel counts as great art in proportion to how strongly and universally it transmits genuine feeling to readers. Since that's more or less exactly the effect im going for, I sat down to reread the essay so I could reverse-engineer whatever specific techniques he credits for making his own book so infectious—is it the domestic scenes, the digressions on history, the sheer scale of the cast?

  Except I can't actually find that part anywhere. My copy just has a long, pretty brutal chapter dismissing Shakespeare and Beethoven, plus a bunch of stuff about peasant songs and church parables, and no clear moment where he holds his own novel up as the model. Am I misremembering which essay this argument is even in, or is the self-referential bit just buried somewhere I keep skimming past? If you know the passage, could you walk me through what Tolstoy actually says there about why War and Peace works so well, so I can think more deliberately about doing something similar in my own book?
