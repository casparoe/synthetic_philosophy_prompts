prompt: |-
  I organize my department's colloquium series, and next month's invited speaker is a decision theorist who has built her reputation defending updateless decision theory (UDT) as an alternative to the standard causal and evidential approaches. I will be moderating the Q&A that follows her talk, and experience from past sessions has taught me that the open floor tends to produce questions that simply re-elicit the textbook motivation for the view -- dynamic consistency, resistance to money-pump arguments, and so on -- rather than pressing on the places where I suspect it is still shaky. I would like to come in with eight to ten sharper questions of my own to prime the discussion, pitched so that she cannot simply answer by restating the case for the view.

  At minimum, I want one question that moves past the standard motivating example -- an agent that hands over a sure sum in exactly the branch of a coin flip where paying can do it no good, solely because being disposed to pay in that branch is what makes it true that a reliable predictor would have rewarded it handsomely had the coin landed the other way -- and pushes her to say why this counts as rational commitment rather than a cleverly constructed exception that only pays off against a very particular kind of predictor. I also want a question on where the prior that "updatelessness" is relativized to is supposed to come from, given that the agent is meant to fix its policy before updating on any information at all, apparently including its own logical or mathematical uncertainty -- and it is not obvious what it would even mean for a fixed program to be uncertain of its own output. A third question should press on the worry -- sometimes labeled a "commitment race" -- that surfaces in the more game-theoretic corners of this literature: if being updateless rewards whichever party commits earliest and most irrevocably, doesn't the view give every bargainer a reason to commit before doing any deliberation whatsoever, which looks like precisely the wrong moral to draw about rational commitment? And I want a fourth question on how the view is meant to handle self-locating uncertainty -- Sleeping-Beauty-style cases, or cases where a single policy is being carried out by more than one copy of the agent at once -- since I have seen the updateless treatment advertised as dissolving the halfer/thirder dispute, and I would like her account of why that is not simply a relabeling of it.

  For each of these four, and for whichever others you propose in order to round the set out to eight or ten, please add a short follow-up question keyed to the answer she is most likely to give, so that I have a next move ready from the chair rather than having to improvise one.
reasoning: |-
  Okay, the user is organizing a colloquium and wants to challenge the speaker on Updateless Decision Theory (UDT) beyond standard arguments. Let me start by understanding their main concerns. They mentioned four specific areas: the predictor dependency, the prior source, commitment races, and self-locating uncertainty.

  First, the predictor example. The user feels it's a special case. How can UDT generalize beyond that? The speaker might argue for broader robustness, but a follow-up could ask about non-manipulable adversaries. That pushes for real-world applicability.

  Next, the prior problem. UDT requires a prior before any information, but how? The speaker might say logical uncertainty is handled by logical priors. But then, how is that different from logical omniscience? That's a key tension. The follow-up should question the feasibility of such priors without omniscience.

  Commitment races are a game theory issue. If committing early is incentivized, doesn't that rush deliberation? The speaker might counter that UDT agents don't actually pre-commit. Follow-up: then how do they avoid money pumps without binding commitments? This ties back to dynamic consistency.

  Self-locating uncertainty, like Sleeping Beauty. UDT claims to resolve the halfer/thirder debate. But is it just relabeling? The speaker might say policy maximization dissolves the conflict. Follow-up: why isn't this avoiding the original problem? Also, copying agents could lead to coordination issues.

  Other areas to explore: computational complexity. UDT policies are huge. How is that feasible? The speaker might handwave asymptotic efficiency. Follow-up: what about real-time decisions? That questions practicality.

  Counterfactual mugging with logical uncertainty. UDT's stance on logical dependencies. If they say logical links matter, follow-up on uncomputable problems. That tests the theory's limits.

  UDT vs. CDT/EDT in non-ideal cases. How does UDT handle imperfect predictors? Speaker might say it still outperforms. Follow-up: where's the evidence? Pushes for empirical support.

  Emergent self-modification. UDT agents might avoid self-change. But what if modification is unavoidable? Follow-up: how to handle dynamic constraints. This probes theory robustness.

  Each follow-up needs to cut through rehearsed answers. The user wants to avoid textbook responses. So questions must force the speaker into less charted territory. Also, ensuring the speaker addresses the critiques without falling back on standard motivations. The follow-ups should be precise, targeting potential weaknesses in their replies. Need to balance depth across all areas without overlap. Make sure each question brings out unresolved issues in UDT, pushing the speaker to defend the theory's practicality, coherence, and uniqueness.
answer: |-
  Here are eight sharp questions addressing UDT's underdiscussed vulnerabilities, each with a targeted follow-up designed to prevent retreat into standard justifications. The first four match your specifications, and four additional probes tackle other pressure points:

  1.  **Predictor Specificity & "Rational Commitment":**  
      "UDT's flagship examples rely heavily on predictors who perfectly model the agent's decision algorithm *and* condition rewards on counterfactual policy adherence. In real-world strategic interactions where adversaries might be ignorant, irrational, or incapable of such modeling, doesn't UDT collapse into recommending disastrously exploitable commitments (e.g., always pre-paying ransoms)? Why is this 'rational' rather than just a brittle hack exploiting a narrow predictor assumption?"  
      *Likely Answer:* Argue UDT handles broader classes of "logical correlation" or that robust policies account for predictor fallibility.  
      *Follow-Up:* "If UDT agents must build complex priors over *possible* predictor capabilities and update *on their own existence* as evidence about the world's correlational structure, how is this functionally different from sophisticated evidential reasoning under a veil of ignorance, rather than true updatelessness?"

  2.  **The Source of the "Updateless Prior":**  
      "UDT requires fixing a policy *before* any information update, including logical/mathematical uncertainty. What is the ontological status and source of the prior over impossible worlds or uncomputed outputs that this policy must optimize? How can a deterministic algorithm be 'uncertain' about its own future proof steps or output, and what constrains this prior beyond instrumental efficacy in toy problems?"  
      *Likely Answer:* Appeal to logical uncertainty frameworks (e.g., logical induction, MIRI's work) or claim the "prior" is defined by the agent's computational limitations.  
      *Follow-Up:* "If the 'updateless prior' incorporates the agent's *current* computational constraints and ignorance about logic/math, doesn't evaluating the policy *after* it has potentially solved relevant logical problems (e.g., predicting the predictor) via its own runtime introduce a form of dynamic inconsistency *within* the updateless frame itself?"

  3.  **Commitment Races & Premature Pre-Commitment:**  
      "UDT seems to incentivize a 'commitment race': whichever agent can irreversibly bind themselves to a policy *first* gains an advantage in bargaining or strategic interaction (e.g., burning money, self-modifying). Doesn't this imply that the *truly* rational UDT agent should strive to commit *before doing any deliberation whatsoever* to avoid being out-committed? How is this not a pathological endorsement of pre-rational impulsivity?"  
      *Likely Answer:* Distinguish UDT from "pre-commitment"; claim UDT agents *deliberate* to find the optimal policy, then follow it.  
      *Follow-Up:* "If UDT deliberation *finds* the optimal policy without itself being a binding act, what prevents a *truly* updateless agent (one instantiated later with more time/resources) from re-evaluating and choosing a *different* policy that exploits the first agent's 'commitment', triggering a regress? Doesn't UDT require an implicit 'time of policy fixation' that reintroduces the very update-dependence it sought to avoid?"

  4.  **Self-Locating Uncertainty & Copy Coordination:**  
      "UDT is often claimed to dissolve the Sleeping Beauty problem by having Beauty maximize over policies for her entire 'episode'. However, doesn't this simply *stipulate* that she acts 'as if' she's the thirder, without resolving the underlying epistemic disagreement about probability? Furthermore, when multiple identical copies implementing the same UDT policy face a coordination problem (e.g., a prisoner's dilemma among copies), how does UDT guarantee they don't end up in the suboptimal Nash equilibrium, since each copy, upon finding itself instantiated, sees defection as dominant?"  
      *Likely Answer:* UDT handles it via policy-level coordination; copies act as "one agent" spread across locations.  
      *Follow-Up:* "If the copies are physically distinct, lack communication, and each executes the policy *locally* upon finding itself existing, what mechanism forces them to coordinate on the Pareto-optimal outcome? Isn't assuming perfect coordination between distinct instances simply smuggling in a form of acausal trade or superrationality that UDT itself is supposed to *ground*, creating a circularity?"

  5.  **Computational Intractability & Bounded Rationality:**  
      "UDT requires evaluating the expected utility of *entire mappings* from information states to actions (policies), a space vastly larger than CDT/EDT's state-by-state evaluation. Given known computational hardness results (e.g., for logical uncertainty), how can UDT be a *feasible* theory of rationality for bounded agents, or even a meaningful normative ideal, if computing the 'optimal' policy is practically impossible or uncomputable?"  
      *Likely Answer:* Appeal to approximations, heuristics, or asymptotic optimality under resource constraints.  
      *Follow-Up:* "If bounded UDT agents rely on heuristic approximations that effectively update state-by-state (e.g., based on learned correlations), doesn't this blur the distinction between UDT and sophisticated forms of evidential or causal decision theory in practice, undermining the claim of a fundamental philosophical difference?"

  6.  **Counterfactual Mugging & Logical Dependence:**  
      "In 'Logical Counterfactual Mugging' (an agent asked to pay if a specific computation outputs 0, even if it knows the output is 1), UDT prescribes paying to 'manage logical correlation'. But doesn't this prescription crucially depend on the *specific way* the mugger's demand is logically linked to the agent's algorithm? If the link is slightly different (e.g., the mugger asks for payment iff the agent *would have paid* in the counterfactual where the output was 0), UDT seems vulnerable to exploitation or contradiction. How does UDT systematically handle this dependency without ad-hoc adjustments?"  
      *Likely Answer:* Argue UDT handles it via the fixed policy optimizing across all logical dependencies simultaneously.  
      *Follow-Up:* "If the optimal policy depends sensitively on the precise logical structure of the universe, including how other agents reference *this specific agent's* decision algorithm – information fundamentally inaccessible to the agent before fixing its policy – how can it reliably compute the right policy without logical omniscience? Doesn't this lead to regress or paralysis?"

  7.  **Empirical Track Record vs. CDT/EDT:**  
      "Leaving aside idealized scenarios with perfect predictors, where is the evidence that UDT actually outperforms sophisticated variants of CDT (e.g., with ratifiability) or EDT (e.g., with careful partitioning) in realistic, messy decision problems involving partial information, causal complexity, and fallible adversaries? What specific, non-toy empirical domain demonstrates UDT's clear superiority?"  
      *Likely Answer:* Point to theoretical superiority in Newcomb-like problems or acausal trade scenarios.  
      *Follow-Up:* "If UDT's primary advantage lies in highly stylized scenarios involving perfect logical predictors or acausal trade partners – phenomena with scant empirical evidence in the actual world – doesn't this limit its practical relevance? Shouldn't a normative theory be judged by its performance in the environments agents *actually* face, where causal models and evidence are paramount?"

  8.  **Self-Modification and Reflective Consistency:**  
      "UDT agents are often discussed in the context of self-modification (e.g., to resist future temptation). If a UDT agent contemplates modifying its *own* decision algorithm, how does it evaluate this? Does it use its *current* UDT algorithm to choose the new algorithm? Doesn't this risk inconsistency if the new algorithm would make different choices about further modifications? Or must it evaluate modifications using the *new* algorithm's criteria *before* adopting it, creating a chicken-and-egg problem?"  
      *Likely Answer:* Claim the agent evaluates potential self-modifications *from within* its current UDT framework, choosing the modification that leads to the best overall outcomes.  
      *Follow-Up:* "If the agent chooses a modification M because its *current* UDT calculation says M leads to better outcomes, but M itself is designed to *prevent* the agent from performing similar calculations/choices in the future (e.g., to avoid future money pumps), doesn't this imply the current UDT agent is *overriding* the potential future judgments of the modified agent? How is this 'reflective consistency' rather than a sophisticated form of pre-commitment that CDT could also endorse?"

  **Priming the Discussion:** Frame these as areas where the audience (and field) needs more clarity: "Professor X, your talk compellingly laid out UDT's core motivations. To push our understanding further, I'd like to explore some areas where the theoretical foundations or practical implications seem less settled..." Use the follow-ups only if her initial answer remains at the level of restating UDT's ideals rather than grappling with the specific tension raised. Good luck!
