prompt: |-
  So I run a pretty small podcast on the side (like 300 downloads on a good week) where I talk to people about decision theory and game theory stuff, mostly aimed at other engineers who enjoy this kind of rabbit hole. I got properly obsessed with the centipede game a few months back after a coworker brought it up during an argument about whether to give a downstream team an exact sunset date for an API we were deprecating -- someone said "this is literally the centipede game" and then wouldnt explain what they meant, so I spent a weekend reading about it instead of doing my actual job.

  Next episode's guest is a game theorist who's kind of Extremely Online for defending the hardcore backward-induction answer: that two fully rational players should defect on the very first move, torching all the mutual gains from passing back and forth, because that's what subgame perfection plus common knowledge of rationality supposedly forces (very Aumann-coded argument, if that means anything to you). Pretty much everyone's first reaction is "that's insane, no way that's what rationality actually requires," and her go-to move whenever someone says that is to answer "you're describing a fact about human psychology, that's not a counterexample to the theory" and move on to the next question. I don't want the whole episode to just be her repeating that line.

  Can you draft me like 8-10 interview questions for her? I want at least one that really presses on that "gut reaction" deflection so she can't just wave it away with the psychology-vs-normativity split again, one that gets her to actually spell out how common knowledge of rationality is supposed to generate the unraveling all the way back to move one, and at least one on that weirder meta-level puzzle I keep half-getting, where the whole backward-induction argument seems to require reasoning about what a rational player would do at a later node that, by the theory's own logic, should never get reached if everyone really is rational -- I think this is what people call the "paradox of backward induction," and apparently there's a real fight in the literature (Aumann vs. Binmore-adjacent folks) over whether that's fatal to the argument or a total non-issue. Also throw in something about the actual experiments, where people mostly don't defect on move one and cooperate for a few rounds first, and whether that data should count as evidence against her normative claim or is just beside the point. For each question, add a quick follow-up keyed to whatever answer she's most likely give, and end with the single hardest question you've got -- something that pins down what, if anything, would actually count as evidence against her view.
reasoning: |-
  Okay, the user runs a small podcast focused on decision theory and game theory, targeting engineers. They're preparing for an episode with a game theorist who defends the backward-induction solution to the centipede game. The user wants interview questions that push beyond the guest's standard responses, especially her dismissal of intuitive objections as mere psychology. 

  First, I need to understand the centipede game dynamics. It's a sequential game where players take turns passing or defecting, with increasing payoffs. Rationality and common knowledge should lead to immediate defection, but that feels counterintuitive. The guest's position is that human reactions don't invalidate the normative theory.

  The user's main requests are:
  1. A question that challenges the psychology-vs-normativity deflection.
  2. An explanation of how common knowledge unravels to move one.
  3. Addressing the paradox of backward induction (reasoning about unreachable nodes).
  4. Discussing experimental data where people cooperate initially.
  5. The hardest question on what evidence could falsify her view.

  For the psychology deflection, I need to force a normative counterexample. Perhaps a scenario where backward induction seems irrational even under perfect rationality. The "trembling hand" or "resolute choice" literature might help here. Binmore's critiques could be useful.

  Explaining the unraveling requires breaking down common knowledge step by step. The guest will likely use induction, so follow-ups should test if earlier moves change under uncertainty.

  The paradox involves hypothetical reasoning at unreachable nodes. Aumann handles this with counterfactuals, but Binmore sees a contradiction. Questions need to contrast these views clearly.

  Experimental data raises the is-ought problem. The guest will dismiss it as descriptive, but maybe press if consistent deviation suggests rationality isn't captured. Follow-ups on learning effects could corner her.

  The hardest question must target the core axioms. What if defection leads to worse outcomes empirically? Or if players can precommit? Or if common knowledge is impossible? She might retreat to "by definition" arguments, so the question must force engagement with reality.

  Also, the user mentioned engineers. Questions should tie to real-world cases like API deprecation. Practical implications make the discussion relatable.

  Need varied angles: technical breakdowns, philosophical challenges, empirical relevance. Each question needs a sharp follow-up anticipating her dodges. The finale should threaten her position's foundations without being unfair.
answer: |-
  Here’s a set of 10 interview questions designed to push past surface-level defenses, target core tensions, and force engagement with the hardest objections. Each includes a follow-up tailored to likely responses:

  ### Core Questions & Follow-Ups  
  1. **Gut Reaction Challenge**  
     *"You often dismiss the 'this feels irrational' objection as mere psychology. But imagine two players who mutually precommit—via an unbreakable contract—to always pass until the final node. Under backward induction, they’d still defect immediately. Isn’t that a *normative* failure? Why should rationality demand a strategy that *guarantees* the worst mutual payoff when cooperation is Pareto-superior?"*  
     - *Likely Response*: "Precommitment violates the game’s sequential structure."  
     - **Follow-up**: "If we accept that the game forbids precommitment, doesn’t that reveal backward induction *presupposes* a specific (and arguably artificial) constraint on rational agency—one that *creates* the inefficiency it claims to describe?"

  2. **Mechanics of Unraveling**  
     *"Walk us through exactly how common knowledge of rationality (CKR) forces defection at move one. How does Player 1’s belief about Player 2’s belief about Player 1’s rationality... and so on... collapse the entire game?"*  
     - *Likely Response*: Step-by-step induction from the final node.  
     - **Follow-up**: "At node *n-1*, Player 2 defects because Player 1 would defect at *n*. But if CKR holds, node *n-1* is never reached. How can Player 2 justify their decision using a hypothetical (unreached) node’s rationality?"

  3. **The Paradox of Backward Induction**  
     *"The argument requires Player 1 to reason: ‘At node 2, a rational Player 2 would defect.’ But if Player 2 is rational, node 2 is never reached if Player 1 defects at node 1. Isn’t this a contradiction? How can rationality at node 2 be invoked if CKR *prevents* node 2 from occurring?"*  
     - *Likely Response*: "Counterfactuals are part of rational planning."  
     - **Follow-up**: "Aumann says we *must* assume rationality at unreached nodes; Binmore calls this ‘dubious.’ If the theory requires attributing rationality to *impossible* scenarios, is this a flaw in CKR or backward induction itself?"

  4. **Empirical Data & Normative Claims**  
     *"In experiments, players rarely defect immediately. Some theorists say this shows backward induction isn’t descriptively accurate, but you argue it’s normatively correct. If *no human* consistently behaves as the theory prescribes—even after training—doesn’t that suggest the theory fails as a *normative* standard for *human* rationality?"*  
     - *Likely Response*: "Humans have bounded rationality; normative theories aren’t behavioral."  
     - **Follow-up**: "If a theory of rationality yields strategies *no rational agent should actually use* (because they exploit human ‘irrationality’), is it still normatively compelling? Or is it self-defeating?"

  5. **The API Sunsetting Case**  
     *"My coworker invoked the centipede game re: API deprecation. If we tell Team B we’ll sunset in 12 months, they might delay migration, forcing us to extend—costing us both. Backward induction says we should give *no date*. But in practice, giving a credible date often *works*. Is the real-world success of ‘irrational’ cooperation evidence that CKR is too brittle?"*  
     - *Likely Response*: "Real games include reputations/repeated interactions."  
     - **Follow-up**: "But doesn’t backward induction *also* fail in finitely repeated games? If CKR undermines cooperation even when it’s sustainably beneficial, is it a useful normative benchmark?"

  6. **Trembling Hands & Higher-Order Uncertainty**  
     *"What if we relax CKR? If Player 1 assigns even a 0.001% chance that Player 2 is ‘irrational’ (e.g., might pass at node 2), doesn’t passing at node 1 become rational? And if so, doesn’t this reveal that CKR is doing *all* the work—and is implausibly fragile?"*  
     - *Likely Response*: "With strict CKR, no uncertainty exists."  
     - **Follow-up**: "But if *actual* rationality requires acknowledging the *possibility* of error (e.g., via trembling-hand refinements), doesn’t backward induction collapse under the slightest epistemic humility?"

  7. **Resolute Choice Critique**  
     *"McClennen and others argue rationality can be ‘resolute’: agents plan to cooperate and stick to it, avoiding the induction trap. Is this incoherent? Or is backward induction forcing myopic choices against long-term interests?"*  
     - *Likely Response*: "Resoluteness violates dynamic consistency."  
     - **Follow-up**: "If dynamic consistency *requires* a strategy that sacrifices $1,000,000 for $1, isn’t that a reductio ad absurdum of the consistency axiom itself?"

  ---

  ### The Hardest Questions  
  8. **The Aumann-Binmore Battle**  
     *"Aumann insists rationality at unreached nodes is non-negotiable. Binmore says this makes backward induction self-contradictory. Who wins? And if Binmore is right, does subgame perfection die with it?"*  
     - *Likely Response*: "Aumann’s view is logically consistent."  
     - **Follow-up**: "Even if consistent, does it *generate* rational prescriptions? If not, what’s the value of a consistent theory that no one should follow?"  

  9. **Falsifiability Challenge**  
     *"What would *falsify* your view? Imagine we find hyper-rational AIs defecting immediately, but their total payoffs are dwarfed by ‘irrational’ cooperators. Or a proof that CKR implies logical contradictions. Would either matter?"*  
     - *Likely Response*: "The theory defines rationality; it’s axiomatic."  
     - **Follow-up**: "If nothing can falsify it—not behavior, not outcomes, not paradoxes—isn’t it a tautology? And if so, why should engineers care?"  

  10. **Nuclear Option**  
      *"Suppose Player 1 says: ‘I will pass at node 1 *because* I know backward induction is correct. Player 2, knowing I’m rational, will see this as proof I’m irrational and pass back... netting us huge gains.’ Is this reasoning coherent? If not, why can’t rationality *exploit* the theory’s own predictions?"*  
      - *Likely Response*: "This violates CKR—Player 1 can’t ‘know’ BI while acting against it."  
      - **Follow-up**: "But if BI *prevents* players from coordinating on mutual gains—even via metacognition—doesn’t that indict it as a *failure mode* of rationality, not its pinnacle?"  

  ### Tactical Notes  
  - **When she deflects to "psychology"**: Anchor Q1/Q4 in *logic* (Pareto inefficiency) or *outcomes* (guaranteed loss). Force engagement with consequences.  
  - **On unreached nodes**: Hammer Q3/Q8 with Binmore’s "rationality at unreached nodes is meaningless" angle.  
  - **If she retreats to formalism**: Use Q10 to question the *purpose* of rationality. Ask: "Shouldn’t rationality *serve* the agent’s interests, not satisfy axioms detached from results?"  
  - **End strong**: Q9/Q10 are the killshots. They target the theory’s practical and philosophical foundations.  

  This line forces her to defend not just BI’s mechanics, but its *value* as a normative standard—exactly where engineers will smell blood. Good luck!
