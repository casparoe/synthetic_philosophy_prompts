  A few of us from work turned a side project -- a fully automated bot that finds +EV bets in sports markets -- into an actual small fund, and we've now got some outside money in it too, not just our own. So I guess I'm on the "risk committee" now, which is a fancy name for 5 engineers arguing in a slack channel. We're stuck on bet sizing and it's turned into a whole fight before our meeting this weekend where we're supposed to lock this in. Two people want to go full Kelly criterion because "its mathematically proven to maximize our long-run growth," but Priya (did stats in undergrad) keeps bringing up some old paper by a famous economist that apparently trashes the whole idea -- supposedly written entirely in one-syllable words as basically an insult to the Kelly crowd -- arguing there's nothing actually special about maximizing log wealth, it's just one utility function you could've picked among many. We need an actual written policy before we take on more outside money, not just vibes. Can you draft the memo I'd send the group: recommend a real sizing rule with actual numbers in it, and take the "why should we even care about long-run growth rate, why log wealth specifically" objection seriously instead of just waving it off.
