answer: |-
  ## The Compounding Conundrum: Is Geometric Rationality Mandatory or Merely Permissible?

  The allure of the Kelly Criterion – maximizing the expected logarithm of wealth for repeated, multiplicative gambles – lies in its promise of dominating other strategies in the long run. Defenders, particularly those within Ole Peters' "ergodicity economics" program, elevate this beyond a compelling heuristic to a unique rational imperative. They argue that traditional expected utility theory (EUT) fundamentally misapplies "ensemble averages" to individual temporal trajectories, and that only the time-average growth rate, captured by maximizing expected log wealth, is relevant and rational. Critics, echoing Samuelson's skepticism, counter that this shift merely disguises a specific, contestable utility function – prioritizing asymptotic growth above all else – as a value-free mathematical necessity. Engaging with the strongest arguments on both sides reveals that while geometric rationality is profoundly powerful and often optimal for its specific goal, it is not rationally *mandatory*; it represents one compelling risk attitude among others within the spectrum of rational choice for compounding gambles.

  **The Ergodicity Mandate: Growth as Mathematical Necessity**

  Peters and colleagues mount a formidable challenge to conventional EUT. Their core argument rests on the mathematical distinction between ensemble averages and time averages in non-ergodic systems:

  1.  **The Ensemble vs. Time Average Divergence:** In multiplicative processes (like repeated betting with reinvested wealth), the outcome across many parallel universes (the ensemble average, e.g., expected terminal wealth) diverges fundamentally from the outcome experienced by an individual living through a single sequence of events (the time-average growth rate). A strategy promising high *expected* terminal wealth might have a near-certainty of leading to ruin in a single timeline due to volatility drag.
  2.  **Relevance to the Individual:** Since an agent only experiences one realized path, Peters argues it is irrational to evaluate gambles based on ensemble properties (like EUT does, implicitly averaging over unrealized hypotheticals). What matters *objectively* to the agent traversing their single history is their long-term time-average growth rate.
  3.  **Log Wealth as the Key:** They demonstrate mathematically that for multiplicative wealth dynamics, the time-average growth rate `g` is given by `g = exp(E[ln(1+r)]) - 1`, where `r` is the return per period. Maximizing `E[ln(1+r)]` (i.e., expected log wealth) directly maximizes `g`. This is presented not as a utility choice, but as the *only* rational way to optimize the observable, experienced outcome – the growth rate of wealth through time.
  4.  **Value-Free Rationality?** The strongest ergodicity claim is that this is not about preferences. It's about correctly identifying the relevant observable (time-average growth) for an individual in a non-ergodic multiplicative system. Choosing *any* strategy other than the log-optimal one is argued to be irrational because it systematically degrades the agent's own long-run outcome relative to what was mathematically possible. Risk aversion defined through concave utility functions is seen as a misguided attempt to solve a problem (volatility drag in multiplicative growth) that is only correctly addressed by optimizing the growth rate directly.

  This argument is powerful because it identifies a genuine and often overlooked mathematical pitfall in applying ensemble thinking to temporal processes. It compellingly shows why strategies with high expected terminal wealth can be disastrous in practice for compounding investors/gamblers. From this perspective, geometric rationality isn't a preference; it's the logical consequence of optimizing the only outcome that actually matters to the single-timeline agent: their own long-run growth rate.

  **The Samuelsonian Critique: Growth as One Value Among Many**

  Critics, extending Samuelson's famous objections to the "fallacy of large numbers" justification for Kelly, grant the mathematics of growth maximization but fiercely contest its unique normative status:

  1.  **The Implicit Utility Function:** The crux of the critique is that privileging the *almost-sure long-run growth rate* above all other considerations is itself a profound value judgment. It implicitly assumes a utility function `U(W) = ln(W)`. Why is maximizing `lim (T->∞) (1/T) * ln(W_T)` inherently more rational than maximizing `E[W_T]` at a specific horizon `T` (implicitly `U(W) = W`), or `E[sqrt(W_T)]` (moderate risk aversion), or minimizing the probability of ruin before `T`? Each objective reflects a different weighting of potential outcomes and time horizons.
  2.  **The Tyranny of the Long Run:** As Samuelson stressed, "long run" is irrelevant to agents who might not survive it. Focusing solely on asymptotic behavior ignores:
      *   **Risk of Ruin:** The Kelly strategy, while maximizing growth *if you survive*, typically involves a non-zero probability of catastrophic loss (ruin) along the way. A rational agent with a strong aversion to financial destruction might rationally choose a fractional Kelly strategy or a different approach entirely, sacrificing some long-run growth potential for a significantly reduced risk of ruin within their relevant time horizon.
      *   **Finite Horizons:** Real agents operate with finite lives and finite investment horizons. Optimizing for `T=∞` is irrelevant if `T` is 10, 20, or 30 years. An agent saving for retirement in 20 years might rationally prefer a strategy with slightly lower *expected* asymptotic growth but a higher probability of meeting their specific wealth target at year 20, or lower volatility along the path.
      *   **Path Dependence & Drawdowns:** The psychological and practical impact of severe drawdowns (large temporary losses) can be devastating, even if recovery eventually occurs. Agents may rationally value "smoothness" of the equity curve or protection against large drawdowns more than pure long-run growth, especially if such drawdowns could force them to abandon their strategy (e.g., through margin calls) or cause significant distress.
  3.  **Rational Pluralism:** The strongest critique holds that rationality does not dictate a single objective. Rationality concerns choosing means appropriate to one's ends. Different agents have different legitimate ends (goals): maximizing long-run growth, achieving a specific target wealth with high probability, minimizing the chance of catastrophic loss, preserving capital, or achieving a smoother return profile. Each goal implies a different optimal strategy. Kelly/log-optimal is optimal *only* for the specific goal of maximizing the long-run time-average growth rate. Insisting it's optimal for all rational agents is to illegitimately impose one specific goal (asymptotic growth) onto everyone.
  4.  **Samuelson's "Fallacy":** Samuelson's core objection was that no amount of repetition makes a single gamble safe or justifies a strategy that an agent would reject for a single play, *if the agent has a concave utility function*. If an agent is risk-averse over terminal wealth (e.g., `U(W) = sqrt(W)`), they might reject a single favorable-but-risky bet. Repeating that bet `N` times doesn't magically transform it into a different gamble that the same risk-averse utility function would accept; the overall risk profile remains. Ergodicity arguments don't dissolve this; they simply argue that the risk-averse utility function is "wrong" for multiplicative processes. Critics counter that the choice of utility function is fundamental and prior.

  This critique is powerful because it exposes the normative core hidden within the ergodicity argument's mathematical formalism. Prioritizing growth is a choice, not an inevitability.

  **Verdict: Geometric Rationality is Compelling but Not Mandatory**

  After engaging with the strongest forms of both arguments, the conclusion is clear: **Geometric rationality (maximizing expected log wealth) is an exceptionally compelling and often optimal strategy for the specific goal of maximizing long-run wealth growth in repeated multiplicative gambles, but it is not rationally mandatory for all agents.** It represents one legitimate risk attitude among others.

  *   **The Strength of Ergodicity:** The ergodicity critique successfully exposes a critical flaw in naively applying ensemble averages (like simple expected terminal wealth) to temporal multiplicative processes. It provides a profound and mathematically rigorous justification for why focusing on the growth rate (`E[ln(W)]`) is essential for agents whose primary, overriding concern is maximizing wealth over an indefinite, potentially infinite horizon, and who are utterly indifferent to path volatility or finite-horizon risks *as long as ruin is avoided*. For such an agent, with a utility function singularly focused on asymptotic growth (`U = ln(W)`), Kelly *is* rationally mandatory.
  *   **The Strength of the Critique:** However, the Samuelsonian critics successfully demonstrate that this singular focus is itself a substantive value commitment. Rational agents can, and do, have other legitimate concerns: avoiding ruin within their lifetime or investment horizon, achieving specific finite-horizon goals with high probability, minimizing psychological distress from severe drawdowns, or simply having a more stable consumption path. For agents with these concerns – represented by utility functions incorporating risk aversion over terminal wealth, path dependence, or ruin constraints – strategies sacrificing some long-run growth potential for greater security or predictability are not irrational. They are optimal *for their chosen objectives*. Insisting that only asymptotic growth matters imposes a specific value judgment on all agents.

  Therefore, while the ergodicity argument brilliantly elucidates *why* geometric mean maximization is optimal for its specific goal and exposes the pitfalls of ignoring the ensemble/time-average divergence, it does not succeed in proving that this goal is the *only* rational one for agents facing compounding gambles. Rationality accommodates a pluralism of ends. The geometric path is a powerful and often wise choice, but the highway of rational decision-making for compounding gambles has multiple lanes.
