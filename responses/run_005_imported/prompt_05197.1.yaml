answer: |-
  Here are 10 interview questions designed to probe the Goodman-style view on forgeries, focusing on key objections and potential weaknesses, with strategic follow-ups:

  1.  **The Core Tension:** "You argue that an undetectable forgery is *still* aesthetically inferior *now* because a trained eye *could conceivably* learn to discern differences in the future. Theo would counter: 'But I *can't* perceive any difference *right now*. How can a merely hypothetical future perceptual skill – which may never even materialize – possibly diminish my *actual, current* aesthetic experience of this object?' How do you reconcile the 'could conceivably' with the 'right now' of aesthetic perception?"
      *   **Likely Dodge:** "It's about the *kind* of object it is / the properties it *can* sustain under scrutiny."
      *   **Follow-Up:** "But doesn't that shift the aesthetic value entirely *away* from the perceiver's current engagement and into a nebulous realm of potential future expert performance? Doesn't that risk making aesthetic value contingent on epistemic possibilities rather than phenomenological reality for the viewer *at the time*?"

  2.  **The "Proves Too Much" Objection:** "Doesn't this view risk collapsing *any* undiscovered-but-discoverable-in-principle historical fact about a work into the realm of the aesthetic? For example, if we could someday prove with absolute certainty, using currently unavailable technology, that a specific pigment batch was used, or that the artist sneezed at a specific point – facts utterly imperceptible now – would those facts *also* become part of the aesthetic properties *now*, simply because they are discoverable-in-principle?"
      *   **Likely Dodge:** "No, only properties relevant to the *artistic achievement* or *expressive character* discernible through the work matter."
      *   **Follow-Up:** "How do you rigorously draw that line? Isn't 'artistic achievement' precisely what Theo argues is *fully captured* in the perceptible object? If the future discernment hinges on subtle material traces (like brushwork idiosyncrasies), how is that fundamentally different from discovering the pigment batch or the sneeze, if *both* are discoverable-in-principle material facts?"

  3.  **The Superior Forger Scenario:** "Imagine a forger demonstrably *more* technically skilled than the original artist. They produce a 'Rembrandt' with brushwork even more masterful, color harmonies even subtler, and emotional depth even more profound than any *actual* Rembrandt – and it's perceptually indistinguishable *as a Rembrandt*. According to your view, is this forgery *still* aesthetically inferior to a genuine, perhaps technically cruder, Rembrandt *solely* because it lacks the right origin? If so, doesn't this prioritize authenticity over demonstrable aesthetic excellence?"
      *   **Likely Dodge:** "The aesthetic value isn't just in the technical display; it's bound to the *specific artistic act* and *intention* of Rembrandt within his context."
      *   **Follow-Up:** "But if the forgery achieves *greater* technical mastery and arguably *greater* emotional resonance perceptually, and Rembrandt's specific intention was simply to create a masterpiece embodying those qualities (which the forgery does, even 'better'), why does the *name* attached to the causal origin outweigh the perceptible aesthetic achievement? Isn't this exactly the 'provenance fetishism' Theo describes?"

  4.  **Empirical Challenge:** "Goodman's view relies heavily on the *possibility* of future discernment. Has empirical psychology on perception, expertise development, or the limits of human discrimination provided any concrete evidence *for* or *against* the idea that such imperceptible differences *could* become perceptible with training *specifically* in the context of masterful forgeries?"
      *   **Likely Dodge:** "The philosophical point is conceptual, not dependent on current empirical limits."
      *   **Follow-Up:** "But if empirical evidence *consistently* showed that certain perfect forgeries remained perpetually indistinguishable even to the most highly trained experts using all conceivable future non-destructive methods, wouldn't that undermine the core 'conceivability' argument for their current aesthetic inferiority?"

  5.  **The "Allographic" Escape Hatch:** "Goodman famously distinguished autographic arts (like painting) from allographic arts (like music). In allographic arts, perfect copies *are* aesthetically equivalent. Why should the *mere fact* that a painting's identity is tied to its physical history (making it autographic) automatically imbue that history with *aesthetic* weight beyond what is perceivable, when the same isn't true for a musical score?"
      *   **Likely Dodge:** "Painting's identity *is* tied to its history; that's constitutive of what the work *is*."
      *   **Follow-Up:** "But isn't the debate precisely *whether* that constitutive history carries *aesthetic* significance beyond the perceivable properties? Theo would say the 'constitutive' aspect is purely ontological/identificatory, not necessarily aesthetic. How do you bridge that gap?"

  6.  **The Conservation Conundrum:** "Consider art conservation. Conservators often make interventions imperceptible to viewers to preserve the work. If an imperceptible repair doesn't diminish the aesthetic value (it might even preserve it), why does an imperceptible *origin* (forgery) diminish it? Both involve changes to the object's material history imperceptible to the viewer."
      *   **Likely Dodge:** "The conservator's action is in service of preserving the *original* work's aesthetic properties. The forger creates a *new* object masquerading as the original."
      *   **Follow-Up:** "But if the viewer cannot perceive *any* difference – not the repair, not the forgery's origin – and both objects present identical aesthetic properties *to the viewer*, on what basis, *aesthetically* (not historically), do we say the conserved original retains value the forgery lacks? Isn't the value difference again purely historical/provenancial?"

  7.  **The Burden of Proof:** "Theo's position seems simpler: aesthetic value resides in perceivable properties. Your view adds a layer – the potential for future discernment based on non-perceivable (now) properties tied to origin. Doesn't the burden of proof lie with you to demonstrate why this extra layer is *aesthetically* necessary rather than just a historical or market concern?"
      *   **Likely Dodge:** "The burden is met by showing origin *is* integral to the work's identity and the kind of aesthetic properties it possesses."
      *   **Follow-Up:** "But again, that seems to assume the point. *How* does origin, *in itself*, generate distinct aesthetic properties *when those properties are currently imperceptible*? Can you point to a specific aesthetic quality *in the present experience* that differs, beyond the *knowledge* of origin?"

  8.  **Beyond Painting - The Digital Age:** "How does your view handle perfect digital reproductions or AI-generated art 'in the style of'? If a flawless digital facsimile of a Van Gogh is perceptually identical on a perfect display, does it possess the *same* aesthetic value as the original canvas? If not, why not, given the perceptual identity?"
      *   **Likely Dodge:** "The digital file isn't the same *kind* of object; it's a different token, perhaps of a different type."
      *   **Follow-Up:** "If the perceptual experience for the viewer is identical, and the relevant Goodmanian 'symptoms of the aesthetic' (like repleteness, exemplification) are identically present in the viewing experience, doesn't denying equal aesthetic value again reduce to valuing the physical substrate's history over the perceptible aesthetic encounter?"

  9.  **The "Competence" Counterfactual:** "Goodman suggests a forgery might reveal its inauthenticity under scrutiny that the original would withstand. But what if the forger was so skilled that their work *would* withstand *any conceivable scrutiny* just as well as, or even better than, the original? Does the mere *fact* that it wasn't made by the 'right' hands still condemn it aesthetically?"
      *   **Likely Dodge:** "Yes, because its genesis isn't part of the artistic tradition and intention that define the work."
      *   **Follow-Up:** "So, even if the forger achieves an object indistinguishable in every material and perceptual respect, and hypothetically *more* resilient to analysis, its aesthetic value is still less *solely* due to its causal origin? Doesn't this make aesthetic value mysteriously dependent on an external fact utterly divorced from the object's perceivable and analyzable reality?"

  10. **The Falsifiability Question (Closing):** "You've defended a sophisticated and nuanced position. To help us understand its boundaries, what kind of evidence or argument, if presented convincingly, would lead you to seriously reconsider or abandon the core claim that an undetectable forgery is aesthetically inferior *now* due to the *possibility* of future discernment?"

  **Key Strategies Employed:**

  *   **Forcing Engagement with Current Experience:** Questions 1, 4, 7 press on the tension between future potential and present perception.
  *   **Testing Conceptual Boundaries:** Questions 2, 5, 8 explore if the view overextends or handles edge cases consistently.
  *   **Challenging Core Assumptions:** Questions 3, 6, 9 directly attack the primacy of origin over perceptible qualities, especially in extreme scenarios.
  *   **Demanding Specificity:** Follow-ups consistently push back on vague appeals to "work identity," "artistic achievement," or "kind of object" by demanding how these translate into *present aesthetic experience* beyond historical knowledge.
  *   **Closing with Reflection:** Question 10 invites meta-reflection on the view's robustness.

  These questions should push the guest beyond simple restatement and force her to defend the trickiest implications and potential vulnerabilities of the Goodmanian position. Good luck with the podcast!
