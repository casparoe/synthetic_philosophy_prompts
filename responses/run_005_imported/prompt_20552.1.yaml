  Need concrete examples: for grain-of-truth, use the "agent predicting another agent" scenario; for Lob's theorem, show how "I trust my future self" becomes paradoxical. Keep dialogues tight—no monologues, actual rebuttals. User wants 500-800 words so I'll aim for 6-8 exchanges per topic.

