  Mia's refinement in (3) is crucial - she distinguishes truth from standing, which Theo then misinterprets in (4) as penalizing self-awareness. When Mia clarifies in (5) that standing relates to equitable treatment, not knowledge, Theo introduces the complication of Owen's regret (6). 

  The key philosophical tension emerges: Is standing about the blamer's current relationship to the norm (Theo's view) or about consistent embodiment of the norm (Mia's view)? Theo's "regret test" reveals this core divergence - he sees reform as restoring standing while Mia likely sees past hypocrisy as permanently damaging credibility for that specific issue.

