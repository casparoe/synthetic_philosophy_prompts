  First, I need to unpack the key points from each of the six moves. Marcus starts by saying the kid's response is a tu quoque fallacy, deflecting from the truth of the advice. Lena counters that the kid isn't challenging the advice but Dave's authority to deliver it. Marcus questions what "standing" adds beyond the truth of the message, while Lena explains that blaming involves an implicit claim of adhering to the same standard. Marcus argues this sets an unrealistic standard of flawlessness, and Lena clarifies that acknowledging shared flaws restores standing.

