answer: |-
  ## The River Without a Riverbed: A Dialogue on Self

  **Setting:** A shaded grove near Nalanda University. **Venerable Subhūti** (Buddhist Abhidharma master) sits serenely. **Āchārya Gautamika** (Nyaya philosopher) approaches, his expression sharp but respectful.

  **Gautamika:** Venerable Subhūti, your doctrine of *anattā* troubles me. Without a persisting *ātman*, how does experience cohere? Consider memory: I recall the mango I tasted yesterday. That memory *knows* it refers to *my* past experience. If there is no enduring 'I' connecting the tasting-moment and the remembering-moment, how can this intimate sense of ownership arise? Is not a single witness implied?

  **Subhūti:** A perceptive question, Āchārya. The Abhidharma analysis reveals no such witness. The tasting was merely a complex, momentary *dharma* – a phenomenon of consciousness (*citta*), feeling (*vedanā*), perception (*saññā*), and volitional formations (*sankhāra*) arising dependent on sense-base and object. It ceased utterly. The present recollection is another *dharma*, arising *now*. The sense of "mine" arises *within* this present moment.

  **Gautamika:** But *why* does this present recollection-feeling latch onto *that specific past moment*? Why not any random moment? There must be a connection *inherent* to the experiencer! A rope of identity binding past and present. If each moment is truly discrete, why does *this* consciousness claim *that* past consciousness as its own antecedent?

  **Subhūti:** The connection is causal continuity (*santati*), not identity. The past tasting-moment, as it ceased, left impressions (*vāsanā*), seeds (*bīja*) within the ever-flowing stream of consciousness (*cittasantāna*). These seeds condition the arising of the present recollection-moment. The present moment, conditioned by seeds from *that specific past moment*, appropriates (*upādāna*) it as "mine" *because* of this causal link. It is a function of dependent arising (*paṭiccasamuppāda*), not an enduring owner. Like one wave, conditioned by the preceding wave, recognizing the pattern but being distinct.

  **Gautamika:** Hmm. But recognition implies a knower who *compares* the present experience with the stored impression and judges them congruent. Who performs this comparison if not a stable *ātman* underlying the flux? Your "stream" seems like a riverbed necessary to contain the water – the *ātman* is that bed.

  **Subhūti:** The comparison, Āchārya, is itself a momentary mental factor (*cetasika*) arising *within* the present consciousness-moment. Perception (*saññā*) apprehends the present object. Memory (*sati*) retrieves the stored impression-schema. A specific mental formation (*sankhāra*) – perhaps conceptualization (*vitakka/vicāra*) – performs the act of comparison *based on similarity*. No stable comparer is found upon analysis, only the interplay of these transient mental factors. The riverbed is an illusion; there is only the flowing water conditioning its own apparent path.

  **Gautamika:** Very well, let us move to a graver matter: Karma. Actions (*karma*) bear fruit (*phala*). If I steal, I experience suffering later, perhaps in this life or the next. But if there is no enduring self, *who* committed the act? And *who* experiences the result? If the thief-moment perished utterly, and the sufferer-moment is entirely new, how is justice served? This violates the very principle of moral causation! An impersonal "stream" cannot be morally accountable.

  **Subhūti:** Moral causation operates through the causal chain of volitional formations (*sankhāra*) and consciousness (*viññāṇa*), not through a persisting agent. The act of stealing arises from greed-rooted volition (*lobha-mūla cetanā*). This volitional impulse, as it ceases, leaves potent karmic seeds (*kammabīja*) within the consciousness-stream. These seeds condition the arising of future consciousness-moments imbued with the *potential* for suffering. At death, the final consciousness-moment, heavily conditioned by these accumulated karmic formations, conditions the arising of the rebirth-linking consciousness (*paṭisandhi-viññāṇa*) in a new existence. Suffering arises *there* not because a "self" is punished, but because the new stream, born from the old karmic causes, encounters conditions ripe for the fruition of that suffering. It is continuity of process, not identity of substance. The fire lit from one lamp to another is not the *same* flame, but the heat is causally continuous.

  **Gautamika:** This is deeply unsatisfying! If the being experiencing the suffering is not *identical* to the being who performed the act, how can it be *fair*? The new aggregation feels pain for deeds it didn't commit! And what motivates moral restraint *now* if "I" won't be there to suffer the consequences? Your doctrine seems to undermine ethics itself.

  **Subhūti:** Fairness, Āchārya, is a concept rooted in the illusion of self. Suffering arises *because* of craving and ignorance. The volitional act *is* the cause; the resultant suffering is its inevitable fruit within the causal continuum. The stream that experiences the suffering is the direct result of the stream that committed the act – they are causally continuous, though not substantially identical. Motivation comes not from fear of punishing a future self, but from understanding the inherent suffering (*dukkha*) caused by unwholesome actions *now*, and the inherent benefit of wholesome actions *now*. Wisdom sees the causal chain: greed/aversion → unwholesome action → future suffering within the continuum. Compassion arises for all beings trapped in this causal web, including the future moments of "this" stream. Liberation (*nibbāna*) is precisely the cessation of this entire process of dependent arising fueled by ignorance and craving.

  **Gautamika:** *(Leans forward, intensity undimmed)* Liberation *for whom*, Venerable? If there is no self to be liberated, what is the point? And your causal stream... you speak of it as a process, yet you grant it enough coherence to carry karma, to experience results sequentially, to strive for liberation. Does this not *functionally* imply a persisting entity, even if you deny its ultimate reality? How is your "stream" fundamentally different from the *ātman*, save for your refusal to call it a *substance*? Without a knower (*jñātṛ*), how can there be knowledge (*jñāna*) at all?

  **Subhūti:** *(Calmly)* The point, Āchārya, is the cessation of suffering. The question "for whom?" arises *only* because of the clinging to "I am." The process itself, driven by ignorance, is suffering. Cessation is the ending of that process. The stream is not an entity; it is a dynamic pattern of conditionality. Knowledge (*ñāṇa*) is another *dharma*, a momentary knowing-event arising when conditions support it – sense object, sense base, attention, previous knowledge-seeds. No permanent knower is found. The functional coherence is the coherence of a complex, interdependent causal system, like a flame appearing stable while constantly changing. To mistake this process for a self (*sakkāya-diṭṭhi*) is the fundamental ignorance that binds us. Seeing its empty, conditioned nature (*sunnatā*, *paṭiccasamuppāda*) is the path to release. The *ātman* you posit, Āchārya, is the very illusion we seek to dispel.

  **Gautamika:** *(Sits back, thoughtful but unconvinced)* The flame analogy... it flickers, yet maintains its identity *as that flame* until extinguished. Your "process" maintains too much identity for my liking – enough to bear moral responsibility across lifetimes, enough to seek its own end. I see the elegance of your dependent arising, Venerable, but I cannot relinquish the necessity of the *knower*, the enduring subject, the true recipient of karma and the only entity for whom liberation has meaning. Without it, experience becomes... a ghostly procession without a witness, a judgment without a judge.

  **Subhūti:** *(Slightly smiles)* And for us, Āchārya, the belief in that enduring subject is the ghost that haunts existence, the source of all "I-making" and "mine-making" that fuels the cycle. We seek not a judge, but the end of the courtroom itself. The dialogue, it seems, must continue with the dawn.

  **Gautamika:** *(Nods slowly)* Indeed, Venerable. Indeed. The dawn always comes, and with it, the persistent question of the self. *(He rises, offering a respectful gesture)* Until next light.

  **Subhūti:** *(Returns the gesture)* Until next light, Āchārya. May your inquiries bear fruit.
