   Suppose we have the following votes:

   Panelist 1: a=yes, b=yes -> overall=yes
   Panelist 2: a=yes, b=yes -> overall=yes
   Panelist 3: a=yes, b=no  -> overall=no
   Panelist 4: a=no, b=yes  -> overall=no
   Panelist 5: a=no, b=no   -> overall=no

   Now, tally by criteria:
     Feasibility (a): 
          Panelist1: yes, Panelist2: yes, Panelist3: yes -> 3 yes -> majority yes.
