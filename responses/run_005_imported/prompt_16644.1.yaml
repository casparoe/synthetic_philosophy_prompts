   Alternatively, the panel might consider a different aggregation. For instance, they might require that the proposal passes both criteria by a supermajority? Or they might require that the set of panelists who say yes on feasibility and the set who say yes on originality have an intersection of at least 3? But that is equivalent to requiring at least 3 panelists to say yes on both? That is the same as Option B.

