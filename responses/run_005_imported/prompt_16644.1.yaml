   But the overall vote is a different method: it asks each panelist to make an individual decision (which is based on both criteria) and then aggregates those decisions. This overall vote does not necessarily reflect the majority on each condition separately because the majorities on the conditions might be composed of different panelists.

   Therefore, the two tallies are two different ways of aggregating the same individual judgments.

   Which one is correct? The funding rule does not specify the aggregation method for the overall decision. It only specifies the criteria for rejection. 

   However, the rule says: "failing either condition is grounds for rejection". This suggests that if the proposal fails on feasibility (by the collective judgment) then it is rejected, regardless of originality. Similarly for originality. The collective judgment on feasibility is taken as the majority vote on feasibility. Similarly for originality.

