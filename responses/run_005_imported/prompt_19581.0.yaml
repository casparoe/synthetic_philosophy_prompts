  so i went down a wikipedia rabbit hole last night that started at "neurath's boat" (the sailors-rebuilding-the-ship-at-sea thing that gets quoted in like every other lesswrong post about foundationalism) and ended up at the fact that otto neurath also spent a huge chunk of his career building ISOTYPE, a whole picture-language for teaching statistics to people who couldn't read well. and this seems like a way weirder combo than people give it credit for? the boat metaphor is famous specifically becuase neurath thought there's no neutral bedrock of "protocol sentences" you can check your beliefs against — everything's theory-laden and revisable, coherentism all the way down, no view from nowhere. but then isotype is explicitly pitched as a more universal, less ambiguous way of representing facts than words are, something you're supposed to be able to read across languages and education levels without loss. isn't that basically smuggling back in the idea that there IS a neutral, pre-theoretical way to encode facts, just using little repeated icons of workers and factories instead of sentences? can you walk me through whether isotype was actually in tension with his protocol-sentence/anti-foundationalist stuff, or if i'm just misunderstanding what job isotype was supposed to do for him?
