  On aggregation: Railton only has to handle one person's idealized preferences, while CEV has to aggregate across all of humanity. The user wonders if this just multiplies existing problems. I think it creates entirely new ones - like how to define "humanity" (past/present/future? embryos?), how to weigh conflicting idealized preferences, and whether the aggregation process itself imposes alien values. Railton avoids all this by staying individual.

