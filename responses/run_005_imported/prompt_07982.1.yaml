  Hmm, the core tension here is between locality and measurement independence. The user's philosopher friend made superdeterminism sound defensible during their train debate, which clearly stuck with them. Now they're preparing to interview someone who's built a career on this position and want to avoid softball questions. Smart - they're anticipating the guest's rhetorical patterns.

  Breaking this down: First, the cost-comparison question needs to expose why sacrificing measurement independence isn't just "another assumption" but fundamentally undermines scientific practice. The follow-up should press on whether this makes experimental validation impossible. 

  For the cosmological retreat problem, the key is forcing the guest to specify where the correlations could plausibly originate without invoking fine-tuning. The quasar experiments are perfect for this - if they dismiss those, their position becomes unfalsifiable. The follow-up should highlight how "Big Bang correlations" differ meaningfully from conspiracy.

  The retrocausality contrast is trickier. Superdeterminists and retrocausal theorists both reject measurement independence but through different mechanisms. The follow-up needs to test if the guest's rejection of time asymmetry is consistent or ad hoc. 

  Finally, the falsifiability question must prevent the "everything correlates" dodge. Requiring concrete predictions shifts the burden to them. The "observationally distinct" follow-up is crucial - if they can't name any, it's not science.

