prompt: |-
  Kind of a niche one but ive been down a rabbit hole on Anscombe's old pamphlet 'Mr Truman's Degree' (the one she wrote protesting Oxford giving Truman an honorary degree). Her whole case that Hiroshima and Nagasaki were flat out murder rests on double effect: the dead civilians weren't foreseen collateral from hitting a military target, they *were* the means -- thats how you terrorize a government into surrendering -- so no amount of 'it saved more lives than an invasion would've cost' arithmetic gets Truman off the hook.

  Except this is basically just the classic terror-bomber vs strategic-bomber case from the double effect literature, and the standard gripe with that case is that 'intended as means' vs 'merely foreseen side effect' is suspiciously easy to fudge through redescription -- you can describe the bomb's aim as 'destroy Japan's capacity and will to keep fighting' just as easily -- foreseen civilian deaths as a mere byproduct -- which is the same exact move that lets a 'legit' strategic bombing of a munitions factory or a naval blockade count as permissible.

  Please argue that this redescription/closeness problem actually sinks Anscombe's argument on its own terms: that anyone who accepts double effect generally has no principled way to stop the Truman case being redescribed into the 'permissible' bucket, so her murder charge either has to condemn a bunch of otherwise-sanctioned WW2 bombing and blockade tactics too, or it quietly needs some extra premise beyond intention-vs-foresight thats doing the real work. try to actually stay inside her framework rather than just falling back on 'consequentialism is true anyway, so who cares'.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving into Anscombe's argument against Truman's honorary degree, where she claims the bombings of Hiroshima and Nagasaki were murder based on the doctrine of double effect. The user points out that the distinction between intended means and foreseen side effects is fuzzy and can be redescription. They want an argument that shows how this redescription problem undermines Anscombe's case within her own framework.

  First, I need to recall Anscombe's position accurately. She argues that civilian deaths were intended as a means to terrorize Japan into surrender, not just collateral damage. The user mentions the classic terror-bomber vs. strategic-bomber example. The challenge here is that strategic bombing can be redescribed to look permissible. For instance, destroying a munitions factory might foresee civilian deaths but intend only to reduce war capacity. 

  The user wants me to argue that within double effect, there's no principled way to prevent Truman's case from being redescribed as permissible. So, I need to show that Anscombe's murder charge would either condemn other accepted WWII tactics or require an additional premise beyond intention versus foresight. 

  I should avoid consequentialist arguments and stick to her framework. Key elements: the permissibility depends on whether the evil is intended as a means or end versus merely foreseen. The closeness problem is crucial—how descriptions can blur the line. 

  Consider examples like naval blockades. Blockades intend to starve the enemy, but starvation of civilians is a means to force surrender. Anscombe might accept this as impermissible, but that would condemn many Allied tactics. Alternatively, if blockades are permissible, how is the atomic bombing different? The intended effect is surrender, civilian suffering is a means. 

  Another point: Truman's advisors could describe the bombings as targeting military-industrial infrastructure. Hiroshima had military facilities. This redescription shifts civilian deaths to foreseen side effects. Without a clear criterion for when an effect is "too close," the distinction collapses. 

  Anscombe needs something extra, like a stricter definition of intention or proximity. But her framework doesn't provide that. Therefore, her argument either overextends or relies on unstated premises. The user likely wants this internal critique highlighted, showing the inconsistency within her own terms.
answer: |-
  Here's an argument within Anscombe's double effect framework, demonstrating how the redescription/closeness problem fatally undermines her specific charge against Truman regarding Hiroshima/Nagasaki, while potentially implicating other accepted Allied tactics:

  1.  **Anscombe's Core Double Effect Argument:**
      *   Permissible acts require a good intention (e.g., ending the war quickly).
      *   Evil effects (e.g., civilian deaths) can sometimes be *tolerated* as foreseen but unintended side effects of directly pursuing a legitimate military objective (e.g., destroying a munitions factory).
      *   However, evil effects are *absolutely prohibited* if they are *intended as a means* to achieve the good end.
      *   Her charge: Truman intended the deaths of civilians *as the very means* to terrorize the Japanese government into surrender. Therefore, it was murder, regardless of the good end (ending the war) or the predicted net lives saved. The arithmetic is morally irrelevant.

  2.  **The Redescription Problem (Internal to Double Effect):**
      *   The critical distinction hinges entirely on the *description of the agent's intention* and the *description of the act's object*.
      *   Proponents of the bombings *do* offer a permissible-sounding redescription: The intended object/means was **"destroying Japan's capacity and will to resist"** or **"imposing unacceptable costs to force capitulation."**
      *   Within this description:
          *   The *good intention* remains: Ending the war swiftly.
          *   The *immediate act* is the detonation of the bomb over a city center.
          *   The *directly intended effect/means* is described as: **Destroying the city's functionality as a hub of war production, command, control, communication, transportation, and national morale.**
          *   The massive civilian deaths are *foreseen* but described as an *inevitable consequence* of destroying this integrated military-industrial-urban complex, not as the *chosen instrument* itself. They are the *mechanism* by which functionality is destroyed, but the *intent* is framed as targeting the functionality, not the deaths *per se*.
      *   This mirrors the description used for "legitimate" strategic bombing of German/Japanese cities targeting industrial areas, ports, or transportation networks where civilian deaths were massive and foreseen, but described as collateral damage from hitting military targets or infrastructure.

  3.  **Why Anscombe Cannot Consistently Reject This Redescription:**
      *   **No Clear Criterion for "Means":** Double effect provides no objective, non-circular criterion to definitively distinguish "intending death as a means" from "intending destruction of war-sustaining capacity where death is the foreseen mechanism." Both descriptions fit the observable facts. Anscombe asserts the first description is correct, but the framework lacks tools to *prove* the second description is *dishonest* or *conceptually invalid* within DE reasoning.
      *   **The "Closeness" Trap:** The civilian deaths are undeniably *instrumental* in both descriptions. In the terror-bombing description, death *is* the instrument of terror. In the strategic description, death *is* the instrument of destroying functionality/morale. The *causal and conceptual closeness* of death to the intended effect (whether labeled "terror" or "destruction of war capacity/will") makes it impossible to cleanly separate "intended means" from "foreseen mechanism" using DE's core concepts alone.
      *   **The Blockade Parallel:** Consider the Allied naval blockade of Japan. Its *intended means* was **depriving Japan of resources essential for war (and life)**. The *foreseen effect* was mass starvation and death among the civilian population. This was *absolutely instrumental* in breaking Japan's capacity and will to fight. If Anscombe insists that Hiroshima's civilian deaths were *intended means* (terror), then logically, the blockade's civilian deaths must *also* be intended means (coercion through deprivation), not merely foreseen side effects. If she accepts the blockade as permissible under DE (foreseen deaths from intended resource denial), she must accept the atomic bombing redescription (foreseen deaths from intended destruction of war-sustaining capacity/will).

  4.  **The Inescapable Dilemma for Anscombe:**
      *   **Option 1: Consistency Condemns More Than Truman:** If Anscombe sticks to her description of Hiroshima/Nagasaki ("intending civilian death as a terroristic means"), and applies the same strict logic to other tactics:
          *   The strategic bombing campaign against cities (Dresden, Tokyo, Hamburg) becomes murder, as civilian deaths were instrumental in destroying industry *and* morale/will.
          *   The naval blockade becomes murder, as civilian starvation/death was instrumental in breaking Japan's capacity/will.
          *   This leads to the conclusion that large swathes of standard Allied (and Axis) warfare tactics in WWII were morally impermissible under DE. While Anscombe might privately accept this, it significantly weakens the *specificity* of her outrage against Truman and makes her argument far more radical than simply opposing the atomic bombs.
      *   **Option 2: Accepting Redescription Absolves Truman:** If Anscombe accepts the redescriptions used for strategic bombing or blockade as valid applications of DE (foreseen but unintended death), then she *must* accept the functionally identical redescription offered for the atomic bombings. The deaths, while horrifyingly massive and foreseen, become classified as a *side effect* of the intended means ("destroying Japan's capacity and will to resist"). This negates her core "murder" charge against Truman.
      *   **Option 3: The Unstated Premise:** To avoid both options, Anscombe *must* implicitly rely on an **additional, unstated criterion** beyond simple intention-vs-foresight. Likely candidates:
          *   **Proportionality of Civilian Cost:** But she explicitly rejects proportionality arithmetic as justifying intended evil.
          *   **Distinction (Direct Targeting):** She might argue civilians were directly targeted in a way they weren't in a factory raid. But the strategic redescription explicitly denies this.
          *   **Lack of Military Necessity/Last Resort:** This moves towards consequentialist evaluation she rejects.
          *   **The Nature of the Weapon/Scale:** But DE is framed in terms of intention, not weapon type or body count per se. A massive conventional raid could cause similar death intending similar effects.
          *   **Immediacy of the Death Mechanism:** The bomb causes instant, total destruction, making the death mechanism inseparable from the destructive act in a way blockade starvation isn't. This is subtle, but it points to the *closeness* problem inherent in DE – a problem Anscombe's framework doesn't resolve.

  **Conclusion within Anscombe's Framework:**

  The redescription/closeness problem inherent in the doctrine of double effect itself prevents Anscombe from making a *principled distinction*, using *only* the core DE concepts of intention vs. foresight, between the atomic bombings (as she describes them) and other widely accepted (or at least commonly excused) strategic actions like area bombing campaigns or naval blockades. Her argument against Truman only works if she either:

  1.  **Radically Extends Condemnation:** Applying her strict "intended means" logic consistently condemns a vast array of WWII tactics beyond the atomic bombs, making her argument far broader and less focused on Truman's unique culpability. Or,
  2.  **Relies on an Unstated Premise:** She smuggles in an additional evaluative criterion (e.g., concerning the *directness* of the causal link, the *nature* of the suffering, or the *absence* of any plausible "military target" facade) that is doing the *real* moral work in her analysis, but which isn't derived from or supported by the bare bones of the double effect doctrine's intention/foresight distinction.

  Therefore, on its own terms (relying solely on intention vs. foresight), Anscombe's double effect argument cannot definitively sink Truman without also sinking much of the Allied strategic bombing campaign and blockade strategy, or without implicitly depending on a deeper, unarticulated moral principle that distinguishes Hiroshima from, say, the firebombing of Tokyo or the starvation blockade. The redescription problem demonstrates the insufficiency of her stated framework for the specific, narrow condemnation she aims at Truman.
