  First, I need to recall Grice's core distinctions. Natural meaning (like smoke meaning fire) versus non-natural meaning (NN, speaker-dependent). Then there's speaker meaning: complex reflexive intentions where the speaker intends the hearer to recognize a meaning partly through recognizing that intention. The Cooperative Principle and its maxims operate on utterances—intentional communicative acts.

