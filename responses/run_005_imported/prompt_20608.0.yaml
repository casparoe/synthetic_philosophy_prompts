answer: |-
  Here’s a toast that walks that tightrope, weaving Émilie’s core ideas into respectable 18th-century fabric:

  **(Émilie rises, glass in hand. A hush falls, anticipation mingled with polite curiosity. She offers a serene smile, encompassing both the familiar faces of her circle and the watchful eyes of the groom's family.)**

  "My dear friends, family, and honoured guests, gathered here in the warmth of Cirey to celebrate this joyous union. As a mother, my heart overflows seeing my daughter step into this new chapter. And as one who has... contemplated the paths life offers, I offer not just congratulations, but a few humble thoughts on building a shared happiness worthy of such a beginning.

  First, let us speak of **Truth**. Not merely the grand truths, but the small, daily truths shared between two hearts. A happy marriage, I believe, thrives on a foundation of honest regard. Be clear-eyed in your affections, my dears. See each other truly, *including* the small imperfections. For it is in embracing the reality of the person beside us, rather than clinging to impossible **illusions** of perfection, that we find the deepest connection and avoid the sharpest disappointments. Let kindness temper this honesty, always.

  Secondly, cultivate **shared purpose**. Life is not a stagnant pool, but a flowing river. Find endeavors that engage both your minds and spirits. Whether it is the stewardship of your lands, the pursuit of knowledge through **study** – for the cultivation of the mind is a noble duty – or the simple joys of creating beauty together in your home, shared occupation fortifies the bond against idleness, that thief of contentment. Engage your passions not solely for yourselves, but channel them towards your common life. A mind engaged, a purpose shared – these are anchors.

  And finally, embrace **prudent calculation**. Now, I do not speak of cold ledger books! *(A light, knowing chuckle ripples through her circle; the groom's family smiles politely at the jest.)* But consider the long view. Happiness, like any worthy endeavor, requires foresight. **Calculate the risks** not just to your fortunes, but to your peace. Avoid unnecessary strife. Choose battles wisely, knowing that preserving harmony often yields greater dividends than winning a petty quarrel. Invest your energies, your affections, your resources – yes, even at the card table, should you play – with an eye not just to the immediate thrill, but to the **lasting value** it brings to your shared sanctuary. True happiness is not merely seized; it is wisely, patiently cultivated.

  So, to the bride and groom! May your marriage be blessed with truth that strengthens, purpose that inspires, and the prudent wisdom to build a happiness that endures. Let your union be a testament to the joy found not in fleeting fantasy, but in the rich, rewarding reality you create together, day by thoughtful day. *À votre bonheur!*"

  **Why this works:**

  1.  **"Illusions" (Disguised):** Framed as "impossible illusions of perfection" and "clinging to fantasy" vs. "embracing reality." The Catholic relatives hear a call to humility and acceptance (virtues). Voltaire & co. hear her core argument against self-deception and idealized projections.
  2.  **Passions & Study (Disguised):** "Shared purpose," "cultivation of the mind," "engage your passions," "channel them towards your common life," "a mind engaged." This sounds like pious industry and marital duty to the conservatives. Her circle hears the advocacy for intellectual passion, purposeful activity (over frivolity), and the vital role of study and engagement in achieving happiness. The phrase "noble duty" is the perfect cover for study.
  3.  **Gambling Metaphor (Prudent Calculation):** Explicitly disavowing "cold ledger books" disarms suspicion. "Calculate the risks," "invest your energies... resources," "lasting value," "immediate thrill" – all use the *language* of probability and expected value (central to her happiness essay and her work in math/physics) but applied to marital harmony and resource management. The conservatives hear prudent household management. Her friends hear her mathematical approach to maximizing long-term happiness and minimizing pain. The aside "even at the card table" is the slyest wink – utterly mundane to some, a direct callback to her essay's examples for others.
  4.  **Respectable Framing:** Uses valued concepts: Truth (biblical/classical), Purpose/Duty, Prudence, Harmony, Cultivation, Reality. The overall tone is warm, maternal, wise, and grounded in traditional marital advice.
  5.  **The Smirk Trigger:** For those who know her work:
      *   "Impossible illusions" directly contradicts romantic idealism.
      *   "Cultivation of the mind is a noble duty" – placing intellectual work on par with (or above) domestic duty for a woman.
      *   The entire "prudent calculation" section is pure Du Châtelet, applying rational self-interest to emotion and social life.
      *   The subtle emphasis on *building* happiness through active choices, not passive virtue.
      *   The phrase "rich, rewarding reality" implies a happiness found *here*, not deferred to an afterlife.

  **Result:** The mother-in-law hears sensible, virtuous advice about humility, hard work, and peacekeeping. Voltaire smirks because he hears Émilie telling her daughter: "Don't fool yourself, use your brain, channel your passions productively, and always play the odds for long-term gain in your happiness portfolio." It’s her philosophy, wearing a very elegant gown.
