answer: |-
  You've hit on a crucial distinction in cosmological arguments! Your confusion is understandable, as these are fundamentally **different types** of arguments, often sharing the same name but relying on distinct premises and strategies. Your friend is defending a *temporal* cosmological argument, while Leibniz and Aquinas (on the interpretation you found) defended an *atemporal* or *explanatory* cosmological argument. They are not the same underlying argument, though they share a broad goal (arguing for a necessary, ultimate ground of existence).

  Here's a breakdown of the differences:

  1.  **The Temporal Cosmological Argument (Your Friend's Argument):**
      *   **Core Premise:** The universe (space-time and all physical reality) had an absolute beginning in the finite past.
      *   **Support:** Relies heavily on scientific cosmology (Big Bang theory, BGV theorem, etc.). The BGV theorem, while significant, states that *inflationary* spacetimes cannot be past-eternal; it doesn't necessarily prove a *metaphysical* beginning from nothing for *all possible cosmologies*, but it strongly points towards a temporal beginning for our universe.
      *   **Argument Structure:**
          1.  Everything that begins to exist has a cause.
          2.  The universe (space-time, matter, energy) began to exist (as per Big Bang/BGV).
          3.  Therefore, the universe has a cause.
          4.  This cause must be timeless, spaceless, immaterial, and enormously powerful (since it created space, time, and matter).
          5.  Therefore, God (conceived as such a cause) exists.
      *   **Dependency:** Critically depends on the universe having a *temporal beginning*. If science concluded the universe was past-eternal (e.g., certain cyclic models, though often challenged by entropy/BGV), this argument would collapse. William Lane Craig is a prominent modern defender of this version.
      *   **Focus:** On the *origin* of the universe in time.

  2.  **The Atemporal/Explanatory Cosmological Argument (Leibniz, Aquinas - "Third Way"):**
      *   **Core Premise:** Contingent things (things that exist but whose non-existence is possible) require an explanation for their existence *right now*, regardless of whether they had a beginning or have always existed. This applies to individual things, the whole collection of contingent things, and the series itself.
      *   **Support:** Relies purely on metaphysical reasoning about the principle of sufficient reason (Leibniz) or the nature of act and potency (Aquinas). Science is largely irrelevant to its core premise.
      *   **Argument Structure (Simplified Leibnizian Version):**
          1.  Every contingent fact (including the existence of any contingent thing or the whole collection of them) has an explanation (Principle of Sufficient Reason).
          2.  The existence of the universe (the total collection of all contingent things) is a contingent fact (if it exists, it could conceivably not exist).
          3.  The explanation for the existence of the contingent universe cannot lie *within* the universe itself (as it's just more contingent things needing explanation).
          4.  Therefore, the explanation must lie outside the universe, in a necessary being (a being whose non-existence is impossible, which contains its own reason for existence).
          5.  Therefore, a necessary being (God) exists.
      *   **Dependency:** **Does not depend** on a temporal beginning. It works equally well whether the universe is finite or infinite in the past. The question is "Why is there *something* (contingent) rather than *nothing*?" at any moment, not "How did it start?". Aquinas explicitly argues that even if the world were eternal, we would still need a cause for its *existence* (its "being") here and now.
      *   **Focus:** On the *sustaining cause* or *ground of being* for contingent reality *at every moment*.

  **Where the Real Disagreement Lies:**

  1.  **Different Arguments:** Your friend is defending Argument Type 1 (Temporal). Leibniz and Aquinas (in the versions you're referencing) defended Argument Type 2 (Atemporal/Explanatory). They are distinct arguments with different premises and different vulnerabilities.
  2.  **Different Premises:** The key disagreement is about what *requires explanation*:
      *   **Friend:** Only things that *begin* require a cause/explanation. An infinite regress of past events is logically possible (though he uses science to argue it's not actual).
      *   **Leibniz/Aquinas:** *Contingent existence itself* requires explanation *now*, regardless of past duration. An infinite regress of *contingent causes* provides no ultimate explanation for why *any* of them exist *at all*.
  3.  **Role of Science:**
      *   **Friend:** Science (cosmology) provides the *crucial premise* (the beginning) needed for the argument to work.
      *   **Leibniz/Aquinas:** Science is interesting but *philosophically irrelevant* to the core metaphysical question of why contingent being exists. Their argument operates on a different level.
  4.  **Strength & Weakness:**
      *   **Temporal Argument (Friend):**
          *   *Strength:* Intuitively appealing, leverages powerful scientific evidence for a beginning.
          *   *Weakness:* Critically dependent on current scientific models. If science finds a viable past-eternal model (or a model where "beginning" isn't applicable), the argument fails. Premise 1 ("Everything that begins...") is also philosophically debatable (e.g., quantum events).
      *   **Atemporal Argument (Leibniz/Aquinas):**
          *   *Strength:* Independent of scientific cosmology. Addresses the deeper metaphysical question of existence itself. Not vulnerable to discoveries about the universe's age.
          *   *Weakness:* Requires accepting strong metaphysical principles (Principle of Sufficient Reason, impossibility of an infinite regress of contingent explanation, meaningful distinction between contingent/necessary being). Critics challenge these principles. Explaining *how* a necessary being "contains its own reason for existence" is difficult.

  **Conclusion:**

  *   **Yes, your friend is defending a different argument.** It's the *temporal* cosmological argument, which is distinct from the *atemporal/explanatory* argument defended by Leibniz and Aquinas (on standard interpretations of the "Third Way" and Leibniz's PSR-based argument).
  *   **You are not missing a way they are the same.** Their core premises are fundamentally different: one relies on a temporal beginning, the other on the need for an explanation for contingent existence *simpliciter*.
  *   **The real disagreement** centers on the question: **"What *exactly* needs explaining?"** For your friend, it's the *beginning* of the universe. For Leibniz/Aquinas, it's the *existence* of contingent reality (the universe), regardless of its duration.

  **How to Approach Your Friend:**

  1.  Acknowledge his argument is valid *if* the premises are true (universe began, everything beginning has a cause).
  2.  Clearly state: "The argument you're making is known as the *temporal* cosmological argument. It relies on the universe having a beginning. However, I found that philosophers like Leibniz and Aquinas defended a *different type* of cosmological argument, often called the *atemporal* or *explanatory* argument."
  3.  Explain the core difference: "Their argument doesn't care if the universe is infinitely old or not. They argue that *because* the universe (and everything in it) is *contingent* (it could have not existed), it requires an explanation for *why it exists at all* right now, and that explanation must ultimately be a necessary being outside the universe. Science about the Big Bang is irrelevant to *this* version of the argument."
  4.  Discuss the implications: "So, your argument stands or falls with cosmology. Theirs stands or falls on whether we accept the Principle of Sufficient Reason applied to contingent existence itself."

  This distinction clarifies the landscape and allows you to discuss the merits of each specific argument type separately.
