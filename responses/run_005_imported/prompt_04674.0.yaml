prompt: |-
  Been down a bit of an EA Forum rabbit hole this week. It started from a thread arguing about whether it's fine to just adopt GiveWell/Open Phil's cause prioritization wholesale instead of grinding through the underlying moral reasoning yourself, and someone in the comments pointed out that this is basically a special case of a broader puzzle philosophers apparently have a whole literature on: why does it feel totally normal to believe a bridge is safe because a structural engineer told you so, but wierdly off to believe factory farming is wrong just because a friend you trust told you so — even though in both cases you're outsourcing the actual reasoning to someone else? I'd always sort of assumed moral deference was fine by default (isn't "defer to people who've clearly thought about this more than you" like half of what makes any epistemic community function), so it was interesting to learn theres a whole camp of philosophers who think there's something specifically, distinctively bad about taking moral beliefs on pure say-so, over and above the generic risk of just being wrong. Kind of reminded me of the old modest-epistemology-vs-inside-view fights that used to run hot on LW, except this version is specifically about moral beliefs rather than empirical ones, which is apparently supposed to change everything, though I can't fully articulate why.

  Anyway, I tried sketching out the main positions people take on this and immediately got stuck trying to figure out which ones I actually find persuasive versus which ones just sound clever, so I'd rather crowdsource it than litigate it with myself at 1am. Below are six stances on moral testimony/deference I've pieced together from various papers and comment threads. Can you sort them into a tier list by how philosophically defensible you think each one is (S = most defensible, F = least defensible), and give me the answer as a JSON block formatted like this:

  ```json
  {
    "S": ["..."],
    "A": ["..."],
    "B": ["..."],
    "C": ["..."],
    "F": ["..."]
  }
  ```

  Use these exact strings as the items:
  - "Full deference is fine": moral testimony is epistemically on par with any other testimony, and discomfort with it is just squeamishness with no principled basis.
  - "Right act, wrong credit": you can permissibly act on someone else's say-so and even land on the true moral belief, but the act/belief lacks the special worth or credit that comes from understanding the reasons yourself.
  - "Outsourcing agency": deferring specifically on moral questions (as opposed to empirical ones) cedes something essential to being a self-governing moral agent, in a way plain factual deference doesn't.
  - "Defer on facts, not values": it's fine to take someone's word for the non-moral facts feeding into a moral question (e.g. how fish experience pain), but not fine to take their word for the evaluative upshot itself.
  - "The asymmetry is an illusion": the apparent difference between moral and non-moral testimony is fully explained by confounds like stakes and verifiability, not by anything special about morality, so there's no real asymmetry to explain.
  - "Just a 'who to trust' problem": deference is exactly as legitimate as your track record at identifying genuinely reliable testifiers, with no extra hurdle specific to moral content.

  Not fishing for the "official" academic consensus here, if such a thing even exists — just want your actual ranked take. Ties within a tier are fine.
reasoning: |-
  Hmm, the user has been diving into the EA Forum and came across a discussion about moral deference versus other types of expertise. They're comparing how we trust structural engineers about bridges but feel weird about trusting friends on moral issues like factory farming. They want me to rank six stances on moral testimony into a tier list from S (most defensible) to F (least defensible) in JSON format.

  I need to recall the key philosophical arguments about moral testimony. There's a significant debate here about whether moral knowledge can be acquired through testimony like factual knowledge. Positions range from full acceptance of moral deference to views that emphasize the importance of personal understanding for moral agency.

  Looking at the six stances:
  1. "Full deference is fine" argues moral testimony is no different from other testimony.
  2. "Right act, wrong credit" says you can act correctly but miss the deeper understanding.
  3. "Outsourcing agency" claims moral deference undermines personal moral responsibility.
  4. "Defer on facts, not values" allows factual deference but not moral evaluations.
  5. "The asymmetry is an illusion" attributes the difference to practical factors like stakes.
  6. "Just a 'who to trust' problem" frames it purely as an issue of reliability assessment.

  I should evaluate these based on philosophical strength and real-world applicability. The "asymmetry is an illusion" stance seems strong because it addresses why moral testimony feels different without invoking special metaphysics. High-stakes, unverifiable moral issues naturally make us cautious, similar to complex factual domains.

  The "defer on facts, not values" view is also compelling. It matches how we often separate empirical claims from value judgments. We might trust experts on animal sentience but feel we should form our own conclusions on ethical implications.

  The "who to trust" approach is reasonable too. It reduces the problem to epistemic reliability, which applies universally. If someone has proven reliable on moral issues before, deferring makes sense.

  "Right act, wrong credit" captures an important nuance—acting rightly without understanding lacks moral depth. This resonates with intuitions about moral growth requiring personal engagement.

  "Outsourcing agency" feels weaker. While moral agency is important, this stance might overstate the uniqueness of moral deference. We delegate many value-laden decisions (e.g., to doctors or lawyers) without losing agency.

  "Full deference is fine" seems least defensible. It ignores why moral testimony feels different and why understanding matters for moral development.

  For the JSON structure, I'll put "The asymmetry is an illusion" in S-tier as it best explains the phenomenon. "Defer on facts, not values" and "Who to trust" in A-tier as strong alternatives. "Right act, wrong credit" in B-tier for its insight about credit. "Outsourcing agency" in C-tier for being partially right but overstated. "Full deference" in F-tier as too simplistic.

  This ranking balances philosophical rigor with psychological realism, acknowledging that moral deference isn't uniquely problematic but requires careful handling.
answer: |-
  Here's my tiered assessment of the philosophical defensibility of these stances, based on coherence, empirical alignment, and avoidance of special pleading. Moral testimony debates often hinge on whether morality is "response-dependent" (like humor, where deference feels odd) or "mind-independent" (like bridges, where deference is normal). My ranking prioritizes positions that navigate this tension without overclaiming:

  ```json
  {
    "S": ["The asymmetry is an illusion"],
    "A": ["Defer on facts, not values", "Just a 'who to trust' problem"],
    "B": ["Right act, wrong credit"],
    "C": ["Outsourcing agency"],
    "F": ["Full deference is fine"]
  }
  ```

  ### Justification:
  1. **S-Tier: "The asymmetry is an illusion"**  
     Most defensible because it dissolves the problem rather than solving it. The discomfort *is* largely explained by:  
     - **Verifiability**: Bridge safety can be empirically tested later; moral claims often can’t.  
     - **Stakes**: Moral errors often feel identity-threatening ("Am I a bad person?").  
     - **Expertise consensus**: Structural engineering has clear credentials; morality doesn’t.  
     This avoids inventing metaphysical distinctions for morality.

  2. **A-Tier: "Defer on facts, not values" & "Just a 'who to trust' problem"**  
     - **"Defer on facts..."** captures a key intuition: Evaluative judgments require first-personal engagement (like aesthetic tastes), while empirical facts don’t. Defensible if morality has irreducibly subjective components.  
     - **"Who to trust"** correctly reframes the core issue as *epistemic reliability*, not moral exceptionalism. If your friend is a trained ethicist with a track record, deference *should* feel less "weird".  

  3. **B-Tier: "Right act, wrong credit"**  
     Pragmatically useful but philosophically thin. Highlights that *moral worth* (e.g., acting virtuously vs. obediently) differs from *correctness*, but doesn’t explain *why* this gap matters more for morality than, say, deferring to a chess coach’s move.  

  4. **C-Tier: "Outsourcing agency"**  
     Overclaims by implying moral deference uniquely violates autonomy. We constantly "outsource agency" (e.g., following medical advice without understanding biochemistry). Only compelling if morality is *defined* as self-legislation (Kantianism), but that’s question-begging.  

  5. **F-Tier: "Full deference is fine"**  
     Least defensible because it ignores the phenomenology: People *do* experience moral deference as peculiarly problematic. Dismissing this as "squeamishness" fails to engage why moral beliefs feel identity-constitutive ("*I* must condemn this") in ways bridge-safety beliefs don’t.  

  ### Key Insight: 
  The strongest positions (**S/A-tier**) either dissolve the asymmetry or ground it in *practical* differences (expertise/stakes/verifiability), not magic moral metaphysics. The weakest (**C/F-tier**) assert special moral properties without sufficient justification. Notably, **"The asymmetry is an illusion"** wins by Occam’s Razor: It explains the data without positing moral exceptionalism.
