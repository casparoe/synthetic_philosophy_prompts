prompt: |-
  Between novels, I've been sitting in on a friend's graduate seminar on social ontology while I research a book whose plot turns on a sovereign currency collapse, and I offered, in exchange, to help her grade a stack of make-up essays from students who missed the session on Searle, Haslanger, and Hacking. I did the assigned reading myself, but it has been a long time since I thought seriously about status functions and ameliorative analysis, and I would rather not hand back a mark I can't defend if she asks me about it over dinner.

  The question the students were given reads as follows: "Money, gender, and race have all been described by philosophers as 'socially constructed.' Explain, with reference to at least one specific philosophical framework, what it means for a kind to be socially constructed in a way that is compatible with that kind being perfectly real rather than illusory or arbitrary. Then argue for whether money, gender, and race are socially constructed in essentially the same way, or whether that label conceals important differences between them." It is worth 20 points toward the seminar grade. Below, unedited, is the answer submitted by one student:

  "Philosophers who say that money, gender, and race are 'socially constructed' do not mean that these categories are illusions or fictions we could simply stop believing in tomorrow. John Searle's *The Construction of Social Reality* gives the clearest model for why not: certain facts, which he calls institutional facts, exist only because we collectively accept that some object or person has a certain status. His formula is 'X counts as Y in context C' — a green piece of paper counts as a five-dollar bill in the United States because we collectively accept it as such. Because that collective acceptance is stable and widespread, money is completely real: it can be borrowed, taxed, and stolen, even though its existence depends on our attitudes in a way that a rock's does not.

  Sally Haslanger extends this same idea to gender and race. On her view, to be a woman just is to occupy the social position that counts as female in a given context — gender is a status function imposed on bodies the way legal-tender status is imposed on paper. She calls her method 'ameliorative' because she is not simply describing how we already use the word 'woman' but recommending the definition that will do the most useful work for feminist politics: once we see that being a woman is a matter of collective recognition rather than biology, we can also see that the category could in principle be revised by changing what we collectively accept. Race works by the same mechanism, substituting perceived ancestry for perceived sex.

  The upshot is that money, gender, and race are socially constructed in essentially the same way: all three are Searlean institutional facts, kinds that exist because, and only because, we collectively treat certain markers — paper, bodies — as carrying a socially significant status. The one real difference is a difference of degree rather than kind: the rules that create money are written into statutes and enforced by central banks, whereas the rules that create gender and race are informal and unconscious, so that most participants in the practice do not realize they are engaged in one. But in both cases, take away the collective attitudes and the kind disappears; there would be no more women or men, in Haslanger's sense, than there would be dollars, if everyone simultaneously stopped treating bodies, or paper, that way."

  Could you grade this out of 20 and give me point-by-point comments I can actually pass along, rather than a general impression? I'd like the assessment organized around at least these four criteria, five points each: accuracy on Searle's account of institutional facts; accuracy on Haslanger's ameliorative analysis of gender and race specifically; whether the answer correctly distinguishes "constructed" from "illusory" or "arbitrary"; and whether the closing comparison across money, gender, and race holds up under scrutiny. Please return this as a JSON object with one entry per criterion (score, brief justifying comment), plus a total out of 20 and an overall letter grade.
reasoning: |-
  We are grading the student's essay based on four criteria, each worth 5 points. The criteria are:
  1. Accuracy on Searle's account of institutional facts.
  2. Accuracy on Haslanger's ameliorative analysis of gender and race specifically.
  3. Whether the answer correctly distinguishes "constructed" from "illusory" or "arbitrary".
  4. Whether the closing comparison across money, gender, and race holds up under scrutiny.

  We'll assign a score (out of 5) for each criterion, provide a brief comment, and then calculate the total (out of 20) and assign a letter grade.

  Let's break down the student's answer and evaluate each criterion.

  ### Criterion 1: Accuracy on Searle's account of institutional facts (5 points)
  The student explains Searle's view: institutional facts exist because of collective acceptance (X counts as Y in context C). The example of money (green paper as a five-dollar bill) is correct. The student captures the idea that money is real because of collective acceptance and contrasts it with brute facts (like a rock). This is accurate.

  However, note that the student does not mention the role of constitutive rules or the deontic powers that institutional facts carry (e.g., rights, obligations). But the core idea of collective intentionality and the formula are correctly presented. Since the explanation is clear and captures the essence, we can give a high score.

  Score: 5/5
  Comment: The student accurately summarizes Searle's core idea of institutional facts, including the formula and the example of money. The explanation correctly emphasizes collective acceptance as the foundation and the reality of institutional facts.

  ### Criterion 2: Accuracy on Haslanger's ameliorative analysis of gender and race specifically (5 points)
  The student attributes to Haslanger the idea that gender is a social position defined by collective recognition (status function) and that her approach is ameliorative because it recommends a definition useful for feminist politics. The student also notes that race is treated similarly, with perceived ancestry as the marker.

  This is largely correct. However, note that Haslanger's ameliorative project is not just about collective recognition but about defining categories that help in the fight against injustice. Also, the student says "to be a woman just is to occupy the social position that counts as female in a given context". This is a simplification: Haslanger defines woman as a person who is systematically subordinated along some dimension (e.g., economic, political) and marked as a target for this treatment by observed or imagined bodily features presumed to be evidence of a female's biological role in reproduction. The student's summary captures the social position aspect but misses the dimension of oppression. Similarly for race, Haslanger defines racial categories in terms of structural positions.

  The student also correctly notes the ameliorative aspect: defining terms for political purposes. However, the explanation of the mechanism as a status function (like Searle) is not exactly how Haslanger presents it. Haslanger is more focused on social structures and power than on collective acceptance in the Searlean sense.

  Given that the student captures the ameliorative intent and the social construction of gender and race, but oversimplifies the definitions, we can deduct one point.

  Score: 4/5
  Comment: The student correctly identifies the ameliorative nature of Haslanger's project and the idea that gender and race are socially constructed as statuses. However, the specific definitions provided for woman and race are oversimplified; Haslanger's actual definitions include elements of structural subordination and privilege, which the student does not mention.

  ### Criterion 3: Whether the answer correctly distinguishes "constructed" from "illusory" or "arbitrary" (5 points)
  The student explicitly states that socially constructed does not mean illusory or arbitrary. They use Searle's model to explain that institutional facts are real (e.g., money can be borrowed, taxed, stolen). They also note that collective acceptance is stable and widespread, making the categories real. The student also addresses arbitrariness by noting that the categories could be revised by changing collective acceptance, but that doesn't make them arbitrary in the sense of being without consequence. This is a good distinction.

  The student also, in the context of Haslanger, explains that because the categories are socially constructed, they can be revised, but that doesn't make them illusory. The point is well made.

  Score: 5/5
  Comment: The student clearly and correctly distinguishes social construction from illusion and arbitrariness, using the reality of institutional facts and the potential for revision without denying the current reality.

  ### Criterion 4: Whether the closing comparison across money, gender, and race holds up under scrutiny (5 points)
  The student argues that money, gender, and race are socially constructed in the same way (all are Searlean institutional facts) and the only difference is the formality of the rules (written for money, informal for gender and race). However, this comparison may not hold up entirely.

  First, while Searle's model can be applied to gender and race, Haslanger's account is not exactly the same as Searle's. Haslanger's definitions of gender and race are more focused on structural oppression and power relations, which are not necessarily captured by the simple formula of collective acceptance. Moreover, the student claims that the rules for gender and race are "informal and unconscious", which is true, but it's worth noting that the mechanisms of enforcement and the consequences are different.

  Second, the analogy might break down in that money is explicitly created by institutions (governments, banks) and can be changed by them, while gender and race are embedded in deep-seated social practices and power structures that are harder to change. The student acknowledges the difference in formality but calls it a difference of degree. However, one might argue that the difference is more fundamental because the creation and maintenance of gender and race involve systemic oppression and are not merely a matter of collective acceptance in the same way as money.

  Given that the student's comparison is coherent and based on the readings, but overlooks some nuances (like the role of power in Haslanger and the fact that gender and race are not merely status functions but also tied to material conditions and oppression), we deduct one point.

  Score: 4/5
  Comment: The comparison is well-argued and based on the frameworks, but it oversimplifies by equating Haslanger's account of gender and race with Searle's institutional facts without addressing the emphasis on power and oppression in Haslanger. The difference in formality is noted, but the deeper differences in the nature of the construction (e.g., the role of oppression) are not considered.

  ### Total and Letter Grade
  Total: 5 + 4 + 5 + 4 = 18/20

  Letter Grade: Typically, 18/20 is 90%, which is an A- or A in many systems. We'll use a common graduate grading scale where:
  - A: 18-20 (90-100%)
  - B: 16-17 (80-89%)
  - C: 14-15 (70-79%)
  - D: 12-13 (60-69%)
  - F: below 12

  So 18/20 is an A.

