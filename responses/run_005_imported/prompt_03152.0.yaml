answer: |-
  That's a sharp analysis of the Douglass-Garrison split, and you've nailed the core methodological difference. Applying Douglass's approach to the modern "history and tradition" test reveals a profound conflict:

  1.  **Douglass vs. "History and Tradition":**
      *   **Direct Opposition:** Douglass would **vehemently oppose** the "history and tradition" test as articulated in *Dobbs* and *Bruen*. This test is *precisely* the kind of argument he fought against – prioritizing long-standing historical practice and contemporary understandings (even if universally accepted) over the text and its potential for liberty-expanding interpretation.
      *   **Rejecting Historical Practice as Determinative:** As you noted, Douglass explicitly acknowledged that historical practice had been uniformly pro-slavery. His point was that this practice was *wrong* and did *not* define the true meaning of the text. Applying the "history and tradition" test to rights would, in his view, freeze constitutional meaning in the prejudices and limitations of the past, just as Garrison's reliance on framers' intent and early practice froze meaning in pro-slavery interpretations.
      *   **Text Over Tradition:** Douglass's method demands starting and ending with the text. If the text is broad enough to encompass a right (like "liberty" in the 14th Amendment), historical denial of that right is irrelevant. The "history and tradition" test, however, *uses* historical denial as evidence *against* the existence of a right, making history a constraint on the text rather than evidence of its original flawed application.
      *   **The Liberty Principle:** Crucially, Douglass's rule for ambiguity – favor liberty – directly contradicts the "history and tradition" test when history/tradition *restricts* liberty. The modern test often uses history to *deny* rights that weren't traditionally recognized. Douglass would argue that if the text *can* be read to protect a liberty, and history/tradition *didn't* protect it, that's an argument *for* the new, liberty-expanding reading under his rule, not against it.

  2.  **Is Douglass an Originalist? (A Complicated Fit):**
      *   **Textual Focus (Original Public Meaning Adjacent):** Douglass's insistence on the "words on the page" aligns strongly with modern "original public meaning" originalism (Scalia's flavor). He rejected secret drafts and framers' private intentions, focusing on what the public understood the ratified text to say. On this point, he fits.
      *   **The Liberty Canon Principle:** Here's the critical divergence. His rule for ambiguity ("pick whichever reading favors liberty") is **not** a standard feature of modern originalism. It's a substantive, normative canon of construction *superimposed* on the text. Modern originalists typically seek the *original meaning* of the text, even if it leads to illiberal results (e.g., denying rights not historically understood). They reject imposing modern moral values. Douglass, however, argued that the Constitution's *own principles* (its "spirit") required interpreting ambiguous language *in favor of liberty*. He saw this as inherent to the document, not an external imposition.
      *   **Rejection of Framers' Intent (vs. Some Originalists):** His explicit rejection of Madison's notes and framers' secret intentions distances him from "original intent" originalism (like Bork's earlier view) and aligns him more with public meaning originalism.
      *   **Rejection of Historical Practice as Authoritative:** This is his biggest break. Originalism generally sees historical practice as *highly relevant evidence* of original meaning. Douglass saw universally accepted historical practice (like slavery) as *flatly wrong* and irrelevant to the Constitution's true meaning. He wouldn't grant it the weight modern originalists (especially those using the history/tradition test) do.

  **Conclusion:**

  *   Douglass would see the "history and tradition" test as **the exact methodological approach he condemned in Garrison.** It prioritizes historical practice and contemporary understanding over the text's potential meaning and uses history to restrict liberty rather than expand it.
  *   He fits **partially within modern originalism**, specifically the "original public meaning" school due to his textual focus and rejection of framers' secret intent.
  *   However, his **"liberty canon" rule for ambiguity** and his **absolute rejection of historical practice as authoritative** (rather than merely evidentiary) make him **distinct from mainstream originalism today.** His method is unique, blending textualism with a strong, inherent presumption in favor of liberty when the text allows. He might be best described as a **"Textualist with a Liberty-Presuming Construction Principle"** – a category that doesn't map neatly onto today's dominant camps but stands as a powerful critique of methods, like the history/tradition test, that anchor rights in the restrictive practices of the past. He demanded the text be read *forward* towards liberty, not *backward* constrained by tradition.
