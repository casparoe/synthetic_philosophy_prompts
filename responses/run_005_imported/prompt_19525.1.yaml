answer: |-
  ## MEMO: SINGLE-SOURCE PUBLICATION PROTOCOL – BALANCING RIGOR & REALITY  
  **To:** Sourcing & Standards Committee  
  **From:** [Your Name/Position]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Exception Protocol for Uncorroborated Single-Source Allegations  

  ### I. The Core Dilemma
  We face a fundamental tension: **The imperative to verify high-stakes allegations against the reality that some critical truths *begin* with a single, isolated whistleblower.** Our current "two independent sources" rule is essential for preventing error, protecting against manipulation, and upholding credibility. However, rigid application risks failing our mission when confronting powerful institutions adept at concealment.

  ### II. Steel-Manning Both Positions
  **A. The Case for Holding the Line (Strongest Arguments):**  
  1. **Systemic Risk Mitigation:** Even impeccable sources can be sincerely mistaken, selectively informed, or subject to manipulation. History (e.g., Judy Miller/WMDs) shows track records aren't foolproof shields. Corroboration isn't just about a "second voice"; it's about *triangulation* – finding *any* independent evidence (documents, data patterns, circumstantial evidence, *or* testimony) that reduces the chance the source is fundamentally wrong or acting in bad faith.  
  2. **The Slippery Slope:** Granting exceptions based on "trust" or "history" creates subjective precedent. Who defines "well-placed enough" or "history long enough"? This erodes the objectivity of our standard and invites pressure in future borderline cases.  
  3. **Legal & Reputational Vulnerability:** Alleging fraud based solely on one unnamed source is legally perilous and invites devastating retaliation if wrong. Our readers' trust depends on demonstrable rigor.  

  **B. The Case for a Narrow Exception (Strongest Arguments):**  
  1. **The "Devil's Proof" Problem:** For *certain types* of buried misconduct (e.g., secret data suppression), *by definition*, there may be *no* immediately accessible independent corroboration *except* the whistleblower. Demanding a second source for something designed to be unknowable outside the inner circle guarantees silence.  
  2. **Whistleblower Realities:** True insiders with unique access are often singular. Demanding a second equally placed source is statistically improbable for tightly held secrets. Waiting for corroboration can mean the story never runs, allowing harm to continue.  
  3. **The "Corroboration" Illusion:** Requiring a second source often just means getting a second person *to say the same thing*, which doesn't necessarily prove the *underlying fact* more than one highly credible source – it just makes us *feel* safer. The epistemological gap remains.  

  ### III. Recommendation: A Defined, High-Bar "Devil's Proof" Exception
  **Do not abandon the two-source rule.** **Instead, create an exceptionally narrow, protocol-driven pathway for publication based on a single uncorroborated source, applicable ONLY when all the following criteria are met simultaneously:**  

  1.  **"Devil's Proof" Threshold:** The allegation *must* concern information *structurally impossible or highly improbable to independently corroborate without the source's testimony* (e.g., secret committee decisions, intentional data burial with no external trace, deliberate deception documented only internally).  
  2.  **Source Credibility Assessment (Exhaustive):**  
      *   **Proven, Documented Track Record:** The source must have provided *multiple* instances of *verifiably accurate, specific, non-public information* to *this reporter* over a *significant period* (e.g., 3+ years), including on complex or sensitive matters.  
      *   **Direct, Unmediated Access:** The source must have *direct, contemporaneous knowledge* of the alleged fraud, not hearsay.  
      *   **Motive Scrutiny:** The reporter must document the source's motivation, assess potential biases or ulterior motives, and explain why deception is unlikely.  
      *   **Internal Consistency & Plausibility:** The allegation must be internally coherent, align logically with known facts/context, and withstand intense internal skepticism.  
  3.  **Exhaustive Reporter Due Diligence:**  
      *   **Documented Corroboration *Attempts*:** The reporter must detail *all* serious, good-faith efforts made to independently corroborate *every material aspect* of the allegation (document requests, data analysis, other source inquiries) and explain precisely why they failed.  
      *   **Alternative Explanations Explored:** The reporter must actively investigate and rule out plausible alternative explanations for the alleged events or the source's claim.  
  4.  **Transparency & Precision in Publication:**  
      *   **Explicit Sourcing Disclosure:** The story *must* explicitly state the allegation is based *solely* on one source, describe that source's position and relationship to the events (without identifying them), *and* state the source's proven track record with the publication.  
      *   **Precise Language:** Language must be scrupulously precise: "According to a single, well-placed source with a documented history of providing accurate information..." **Avoid** definitive statements like "The company buried data." Use "The source alleges the company buried data."  
      *   **Contextualize the Limitation:** The story should briefly explain *why* independent corroboration wasn't possible for this specific claim, reinforcing the "Devil's Proof" nature.  
  5.  **Committee Super-Majority Approval:** Publication under this exception requires **affirmative approval by at least 75% of the Sourcing & Standards Committee** after rigorous review of the above documentation.  

  ### IV. Why This Addresses the Losing Side's Concerns
  *   **For the "Hold the Line" Side:** This isn't an abandonment of the rule; it's a *contained, high-bar exception* for a vanishingly rare scenario. It replaces subjectivity with a demanding, documented protocol. It forces transparency to the reader about the sourcing limitation. The super-majority requirement ensures broad consensus, minimizing risk.  
  *   **For the "Need Exception" Side:** It creates a viable, principled path for the most critical whistleblower stories that would otherwise die, while demanding extraordinary rigor from the reporter and the committee. It acknowledges the "Devil's Proof" reality without sacrificing accountability.  

  ### V. Implementation for the Current Case
  **Recommendation:** Apply the "Devil's Proof" Exception Protocol rigorously to the Pharma case:  
  1.  The reporter must submit a comprehensive dossier meeting criteria 1-3 (Source Credibility, Due Diligence, "Devil's Proof" justification).  
  2.  The Committee will scrutinize this dossier *before* next week's vote, focusing on:  
      *   Is this *truly* a "Devil's Proof" scenario?  
      *   Is the source's track record *specifically* documented and relevant?  
      *   Were all plausible corroboration avenues exhausted?  
      *   Are alternative explanations credibly ruled out?  
  3.  **Only if the dossier meets ALL criteria** does the Committee proceed to a super-majority (75%) vote on publication under the explicit transparency requirements.  

  **This framework allows us to uphold the integrity of our two-source standard *while* recognizing that journalism's highest duty – exposing powerful wrongdoing concealed by design – sometimes demands a meticulously governed exception. It transforms a binary argument into a principled, actionable protocol.**
