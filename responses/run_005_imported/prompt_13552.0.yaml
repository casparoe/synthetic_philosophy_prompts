answer: |-
  You need **Case V.J.** - the woman whose left hand threw away her groceries.

  **The Incident:**  
  In the 1990s, neuropsychologists observed a female split-brain patient ("V.J.") during a simple shopping task. She was asked to assemble a list of groceries using *both hands* from a larger pool of items. Her verbal self (left hemisphere) clearly stated the goal: "I need milk, bread, and eggs." Her right hand (left hemisphere) dutifully picked up the milk carton. But as she reached for the bread with her right hand... her *left* hand (right hemisphere) snatched the milk carton out of the basket and *put it back on the shelf*. V.J. verbally expressed frustration: "Why did I do that? I need the milk!" This sabotage happened repeatedly. Her left hand wasn't just *failing* to help; it was actively *undoing* the conscious goal of her verbal self.

  **Why This is Uncanny & Philosophically Devastating:**  
  1.  **Goal-Directed Sabotage:** This isn't passive confusion (like the chicken/shovel). It's *intentional interference*. The right hemisphere *understood* the task ("shopping") but possessed a *different intention* ("reject milk"). Its action wasn't random; it was *targeted* at the specific object the left hemisphere selected.
  2.  **Against the Unified Self:** The standard "single subject" view insists that while information processing is split, there's still one "I" experiencing it all. V.J.'s experience shatters this:
      *   **Her "I" (left hemisphere) had a clear, stated goal:** Get milk, bread, eggs.
      *   **Her body (via the right hemisphere) acted *against* that goal:** It physically removed the milk *after* her "I" selected it.
      *   **Her "I" was baffled and frustrated by its *own* action:** She genuinely didn't know *why* her hand undid her choice. The action felt alien *to her conscious self*.
  3.  **Evidence of a Separate "Agent":** The right hemisphere wasn't just confused or lagging. It made a *decision* ("milk shouldn't be in the basket") and executed a *complex motor plan* (reaching, grasping, moving the object against gravity back to its original location) *specifically to counter* the conscious plan of the left hemisphere. This requires independent goal-setting, planning, and execution – hallmarks of an agent.
  4.  **The Subjectivity Gap:** Crucially, the *reason* for the sabotage was inaccessible to the speaking "I". Maybe the right hemisphere disliked the brand, remembered she was lactose intolerant, or just felt contrary. The *motivation* belonged exclusively to the silent hemisphere. The conscious self only experienced the *consequence* – her own hand betraying her stated desire.

  **The Philosophical Bite for Your Novel:**  
  This case makes it impossible to maintain the comforting fiction of a single, unified conscious subject. It forces the question:  
  *   **Who is the "I" that wanted the milk?** Clearly the verbal left hemisphere.  
  *   **Who is the "I" that rejected the milk?** The right hemisphere, acting independently and intentionally.  
  *   **Who is the "I" that felt frustration?** The left hemisphere, experiencing the sabotage as an external event.  

  **V.J. wasn't just conflicted; she was inhabited by an independent will that acted against her conscious self, using her own body.** This isn't mere "automatism" – it's *rivalry*. The right hemisphere demonstrated *its own preferences and goals*, distinct from and antagonistic to the goals of the speaking self. The "single subject" view crumbles because it cannot explain why the subject's *own hand* would deliberately thwart its *own* clearly stated, conscious intention *without the subject understanding why*. This points not just to two information processors, but to two centers of *will* – one vocal, one silent, sharing a skull and a body, sometimes working at cross-purposes.

  **How to Use This in a Scene:**  
  Imagine your protagonist trying to get ready for an important meeting.  
  > *Her right hand smoothly buttoned her blouse. "There. Professional. Ready."*  
  > *Her left hand rose. Finger by finger, it began deliberately unbuttoning each button, starting from the top. It wasn't clumsy. It was precise. Methodical.*  
  > *"Stop it!" she hissed, grabbing her left wrist with her right hand. Her left hand strained against her grip, fingers still twitching towards the buttons.*  
  > *A wave of cold dread washed over her. This wasn't spasm. This wasn't accident. This was... refusal. But why? Did *it* think the blouse was ugly? Did *it* want her to stay home? The reason was locked behind a wall of bone and silence. All she felt was the insistent, alien pressure of her own fingers fighting to undo what she had just done.*  

  The power lies in the **mundane action** (buttoning/unbuttoning, putting groceries in/taking them out) becoming an act of **internal war**. The protagonist *experiences* the will of the other, not through lab tests, but through her own body betraying her conscious mind with deliberate, inexplicable intent. That's the uncanny truth V.J. reveals.
