  **Justification of Scores:**

  1.  **Maya (-1):** While Maya is partially right that discomfort alone doesn't refute a theory, she mischaracterizes the demandingness objection. It's *not* merely a "report of discomfort." Philosophers like Bernard Williams frame it as a *structural critique* about agency, integrity, and the nature of practical reason (as Daniel notes in move 2). Reducing it solely to psychological discomfort ignores its philosophical substance. However, her point about self-interest potentially biasing intuitions has *some* validity, preventing a score of -2.

  2.  **Daniel (2):** Daniel correctly identifies the core philosophical thrust of the demandingness objection, particularly Williams's integrity critique. He accurately distinguishes it from mere psychological discomfort and highlights the structural concern: consequentialism potentially undermines the agent's ability to have a "personal point of view" by demanding impartial maximization that gives no *intrinsic* weight to the agent's own projects and commitments. This is the central argumentative force of the objection.

  3.  **Maya (-2):** Maya's invocation of Murphy's compliance condition fundamentally changes the subject. While Murphy's proposal (a "collective principle of beneficence") is an interesting *revision* of consequentialism aimed at *solving* the demandingness problem, it is not a *defense* of standard act-consequentialism. As Daniel will point out, act-consequentialism requires optimizing the outcome *given the actual non-compliance of others*. Capping obligations at a "fair share" in a hypothetical cooperative scenario is a different moral principle (based on fairness/reciprocity) grafted onto consequentialism. It doesn't show that the original demandingness objection *against standard act-consequentialism* is mistaken; it proposes a different theory.

  4.  **Daniel (2):** Daniel precisely identifies the flaw in Maya's move (3). He correctly states that act-consequentialism evaluates actions based on their actual expected consequences in the real world, not in a counterfactual world of full compliance. Limiting an agent's obligation to their "fair share" within a hypothetical cooperative scheme abandons the core act-consequentialist directive to maximize the good *given the actual circumstances*. This *is* changing the subject to a different principle (a fairness-based hybrid) rather than defending the demandingness of standard act-consequentialism.

  **What Both Seem to Be Missing:**

  1.  **Scalar Consequentialism:** Neither addresses the potential response that consequentialism is best understood as *scalar* (judging acts on a scale of better/worse) rather than *deontic* (imposing absolute obligations like "required"/"forbidden"). This might soften the "demandingness" by removing the implication that anything less than the absolute best is *wrong*, focusing instead on the *degree* of moral reason to act.
  2.  **Distinction between "Ought" and "Can":** While Daniel touches on structural concerns, neither explicitly engages with the principle that "ought implies can." The demandingness objection often hinges on whether the sacrifices required are truly psychologically or humanly *possible* to sustain consistently, not just whether they are unpleasant. This relates to the feasibility of living a recognizably human life under the theory.
  3.  **The "Alienation" Objection:** While Daniel mentions integrity, the related but distinct "alienation" objection – that consequentialism alienates agents from their deepest commitments by forcing them to constantly view these commitments instrumentally – isn't fully explored beyond the structural point about the personal point of view.
  4.  **Objective vs. Subjective Demands:** The debate focuses on the *objective* demands of consequentialism (what you must do to *actually* produce the best outcome). However, consequentialism often incorporates *subjective* or *expectabilist* elements (what you must do given your *beliefs* about what will produce the best outcome). This can sometimes mitigate demandingness in practice, though the core theoretical demand remains high.
  5.  **Hybrid Theories & Rule Consequentialism:** While Maya inadvertently points towards a hybrid (fairness + consequences), and Daniel rejects it as changing the subject, neither explicitly discusses Rule Consequentialism as a potential solution. Rule Consequentialism (acting on rules which, if generally followed, maximize good) can significantly reduce individual demandingness compared to Act Consequentialism, though it faces its own challenges (e.g., the "collapse" problem).
