answer: |-
  ## The Returned Wife

  Leo traced the condensation on his pint glass, the coolness a stark contrast to the stale warmth of The Anchor pub. Two years. Two years since the screech of tires on wet asphalt, the hollow ring of the phone call, the suffocating silence that replaced Mara’s laugh. Ben, only four then, still asked sometimes, “When is Mommy coming back?” Leo’s answer – a choked whisper about heaven – felt like ash in his mouth.

  “Another?” Mick, the barman, raised an eyebrow.

  “Nah. Early start.” Leo pushed the half-finished beer away. Ben needed him present. The custody hearing was in three days. Mara’s sister, Sylvia, sharp as a scalpel and just as cold, had filed. “Unstable environment,” her petition claimed. Leo’s grief was a liability. His world had shrunk to survival: work, Ben, the echoing emptiness of their flat.

  He stepped into the damp London night, the streetlights haloed in mist. Home was a ten-minute walk through familiar, grey streets. He fumbled with his keys at the door, the scrape loud in the quiet hallway.

  The light was on in the living room.

  Leo froze. He’d *definitely* turned it off. Heart hammering against his ribs, he pushed the door open slowly.

  She sat on their worn sofa, bathed in the lamplight’s soft glow. Mara. Wearing the faded blue jumper she’d knitted, the one she wore the last time they’d watched a film together. Her dark hair fell loose around her shoulders, just as he remembered. She looked up, her eyes wide, impossibly familiar, impossibly *there*.

  “Leo?” Her voice was a whisper, rough with disuse or disbelief.

  He staggered back, hitting the doorframe. “No.” The word was a breathless denial. “You’re… you can’t be.” Ghost? Hallucination? Breakdown? Sylvia would have a field day.

  She stood, hesitant. “Leo, it’s me.” She took a step forward, then stopped, seeing the terror on his face. “I… I don’t know how. One moment I was… somewhere else. Grey. Cold. Then I was here. On the pavement outside.”

  “You died,” Leo rasped, his voice cracking. “Two years ago. Hit-and-run. I buried you.” He pointed a shaking finger at the framed photo on the mantelpiece – Mara laughing, holding a baby Ben.

  Her face crumpled. She looked at the photo, then back at him, tears welling. “I remember… the rain. Bright lights. Then… nothing. Until now. But Leo, that wasn’t *here*. Not quite. The café on the corner… it was ‘Maggie’s Muffins,’ not ‘Bert’s Baps.’ And… Ben? Where’s Ben?”

  The detail hit him like a physical blow. Bert had bought Maggie’s out *after* Mara died. She shouldn’t know that. He studied her face, every line, every freckle he’d traced a thousand times. It was her. Down to the tiny scar above her eyebrow from a childhood fall. But *could* it be?

  He didn’t speak, just turned and walked numbly down the hall to Ben’s room. The boy was asleep, a stuffed dinosaur clutched to his chest. Leo pushed the door open wider. Mara followed, gasping softly at the sight of their son, taller now, his features losing their baby roundness. She reached out a trembling hand but stopped short, looking to Leo for permission. He gave a stiff, infinitesimal nod. Her fingers brushed Ben’s hair, a feather-light touch. A single tear traced a path down her cheek.

  “He’s beautiful,” she breathed.

  Leo felt the fragile shell of his reality cracking. Hope, treacherous and dangerous, began to bloom. *His* Mara. Returned. The universe granting a miracle. Sylvia couldn’t touch him now. Ben had his mother back. *He* had her back.

  The next day was a fragile bubble. Mara moved through the flat like a sleepwalker, touching familiar objects – the chipped teapot, Ben’s drawings pinned to the fridge – with a mix of recognition and profound confusion. She remembered their honeymoon in Greece, Ben’s difficult birth, Leo’s disastrous attempt at baking her a birthday cake. She remembered the *feel* of their life. But she also remembered fragments of another life: a promotion Leo hadn’t gotten, a holiday they’d never taken to Scotland, a different colour they’d almost painted the kitchen.

  “It’s like… remembering two dreams,” she said, rubbing her temples. “One feels solid. This one. The other… hazy, like smoke.”

  Leo clung to the solid parts. He showed her Ben’s school projects, photos from the past two years she’d missed. She absorbed it all, her eyes filled with a heartbreaking mix of joy and sorrow. When Ben woke and saw her, his shriek of “Mummy!” shattered the last of Leo’s resistance. He watched them hug, Ben burrowing into her neck, Mara holding him as if he were her anchor in a stormy sea. Leo felt tears prick his own eyes. This was real. *She* was real. His wife. Ben’s mother.

  The bubble burst with Sylvia’s arrival. She didn’t knock. She barged in, eyes narrowed, clutching a manila folder – the custody papers. She stopped dead at the sight of Mara sitting on the floor, helping Ben build a tower of blocks.

  “What is this?” Sylvia hissed, her voice icy. “Leo, have you lost your mind? Who is this woman?”

  “Sylvia,” Mara said softly, getting to her feet. “It’s me.”

  Sylvia recoiled as if struck. She looked from Mara to Leo, her expression hardening into contempt. “Don’t be absurd. My sister is dead. This is… grotesque. Some desperate ploy? Hiring an actress? How low will you sink?” She turned on Leo. “This is exactly the instability I warned the court about! Psychological unravelling! Exploiting a child’s grief!”

  “She’s not an actress!” Leo snapped, stepping protectively in front of Mara and Ben. “It’s Mara.”

  “Prove it!” Sylvia spat. “Prove this… *imposter* is my sister! Prove she has any right to be near Ben!” She waved the custody papers. “The hearing is tomorrow, Leo. This charade only seals it. You think a court will believe in ghosts? Or dimension-hoppers?” Her laugh was brittle. “They’ll see a disturbed man and a stranger confusing a vulnerable child.”

  The word ‘stranger’ hung in the air. Leo looked at Mara. She looked pale, frightened. She *looked* like Mara. She *sounded* like Mara. She remembered things only Mara could know. But Sylvia’s accusation echoed the chilling logic Lewis had articulated: *Could* this be just a counterpart? An uncannily similar being from a world where Mara hadn’t died? A being who remembered *a* life with Leo and Ben, but not necessarily *their* life? A being who resembled Mara down to the last freckle, but was, fundamentally, a different person?

  The practical, brutal stakes slammed into Leo. Sylvia was right. Legally, emotionally, for Ben’s sake… what mattered wasn’t resemblance, but identity. Was this the woman he married? The woman who gave birth to Ben? The woman whose name was on Ben’s birth certificate? Or was she a miraculous, heartbreakingly similar stranger?

  If she wasn’t *numerically identical* to the Mara he buried, she had no legal claim to Ben. Sylvia would win custody. More devastatingly, Ben’s fragile heart would be shattered all over again, believing his mother had returned only to be taken away because she wasn’t *really* her. And Leo… if she wasn’t *his* Mara, the woman he’d mourned, then this reunion was a cruel mockery, a doppelgänger inhabiting his grief.

  “Well?” Sylvia demanded, tapping the papers. “Can she prove it? Beyond superficial resemblance? Can she prove she’s the *exact* Mara Hughes who lived here, who died on Elm Street two years ago?”

  Leo’s hope curdled into cold dread. Mara’s fragmented memories, the discrepancies she mentioned… were they proof of another world, or proof she *wasn't* from this one? He looked at her, desperately searching her eyes for the absolute certainty he needed.

  Mara met his gaze. She saw the fear, the crushing weight of Sylvia’s challenge. She saw Ben clutching her leg, his small face clouded with confusion. She took a deep, shuddering breath. The room was silent, thick with tension.

  Then she knelt down in front of Ben, her movements deliberate. She gently cupped his face. Her voice, when she spoke, was low, intimate, meant only for him, yet carrying clearly in the stillness.

  “Ben,” she whispered, her thumb brushing his cheek. “Do you remember the Secret Dragon?”

  Ben’s eyes widened slightly. He nodded slowly, a tiny, hesitant movement.

  “The one who lives under your bed,” Mara continued, her voice gaining strength, infused with a tenderness Leo hadn’t heard in two years. “The one who’s scared of the dark too? The one you told only Mummy about? That first night in your big boy bed, when the shadows looked like claws?” She paused, her eyes locked on Ben’s. “You asked me to tell him a story. A special story. About the brave little knight who wasn’t afraid… because he had a magic pebble. A smooth, grey pebble you found in the park. You made me promise never to tell Daddy. ‘It’s our secret dragon secret,’ you said. You gave me the pebble to keep safe.”

  She reached into the pocket of the blue jumper. Slowly, deliberately, she pulled out a small, smooth, ordinary grey pebble. She placed it gently in Ben’s open palm.

  Ben stared at the pebble. His small fingers closed around it. A huge, trembling smile spread across his face, dissolving the confusion. “Mummy!” he cried, throwing his arms around her neck. “You *remembered*!”

  Leo felt the air leave his lungs. The Secret Dragon. The magic pebble. Ben’s fierce, whispered secret shared only with his mother. Leo *had* known Ben was scared that first night. He’d sat by the bed. But Ben had insisted only Mummy knew about the dragon and the pebble. Leo had found the pebble in Mara’s jewellery box after the funeral, a mystery he’d never solved.

  Sylvia stared, her mouth a thin, bloodless line. The legal arguments, the accusations of instability, seemed to shrivel in the face of this intensely private, utterly specific fragment of their shared reality. It wasn’t just memory. It was *participation*. It was the pebble itself, carried from *that* moment into *this* one.

  Mara held Ben close, looking over his shoulder at Leo. There were no triumphant words, no philosophical declarations. There was only the raw, undeniable truth in her eyes, the truth echoed in Ben’s relieved hug and the cool weight of the grey pebble – a tiny, concrete piece of *their* unique, irreplaceable history. A history that belonged solely to Mara Hughes, Ben’s mother, Leo’s wife. Not a counterpart. Not a stranger. *Her*.

  Sylvia turned without a word, the custody papers hanging limply at her side. The sharp click of the front door closing echoed the finality of her retreat. The battle wasn't legally over, but its foundation had crumbled. Leo crossed the room in two strides, sinking to his knees beside them. He wrapped his arms around his wife and son, the pebble still held tight in Ben’s fist, a silent testament against the grey, branching void of other worlds. The only world that mattered, the only identity that counted, was right here, solid and real, holding him back.
