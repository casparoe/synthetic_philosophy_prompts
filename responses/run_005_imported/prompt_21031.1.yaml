prompt: |-
  I'm a philosophy professor, but thanks to a weird bit of university service I've become the token "outside member" on my medical center's clinical ethics committee -- I think they wanted somebody who'd atleast taught decision theory once. We're finalizing a policy on incidental findings from the whole-genome sequencing our genomics clinic now offers: right now disclosure is left to the individual geneticists discretion, case by case, and the committee wants one uniform rule in place before enrollment reopens on the 15th. The live question is whether patients should be allowed to opt out in advance of learning about specific categories of finding -- late-onset, currently untreatable stuff like Huntington's status or high-penetrance Alzheimer's risk alleles -- or whether the clinic should just disclose everything medically actionable and let people deal with it.

  One committee member, an ex-quant who has read way more decision theory than the rest of us combined, keeps citing something he calls Good's theorem (he's very insistent it's I.J. Good, not just "a good theorem") to argue the opt-out option is actually incoherent: since the expected value of free information is never negative for a rational Bayesian agent, formally enshrining a "right not to know" just builds a mistake into policy, so we should disclose everything by default and scrap the opt-out menu entirely. Our two bioethicists hate this -- they keep gesturing at the actual "right not to know" literature and worries about anxiety, insurance discrimination, and family disclosure cascades, but neither has been able to say exactly what's wrong with his argument, which bugs me, because I suspect something is.

  Could you draft the short memo I'll circulate before Thursday's meeting? I need an actual recommendation on the opt-out question, with a concrete rollout plan, not "reasonable people disagree" -- and I need you to genuinely engage with whether the quant's use of the theorem holds up here, rather than just asserting that a formal result shouldn't get to dictate clinical policy.
