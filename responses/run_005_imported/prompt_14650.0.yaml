answer: |-
  Your roommate's argument is a clever rhetorical trick, but it fundamentally misunderstands and misapplies the ethical test she's trying to evade. Philosophers have a name for this: it's called creating an **"ad hoc exception"** or employing **"hyper-specification"** to avoid universalizability. Here's why it fails:

  ### 1. **The Test Requires Generalizable Principles, Not Unique Descriptions**
     The "what if everybody did this?" test (rooted in Kant's **Categorical Imperative** and similar ideas) asks you to examine the **maxim** (underlying principle) of your action, not the hyper-specific details of your situation. The relevant maxim here isn't "exploiting *this exact* billing error at *this exact* gym on *this exact* date." It's:
     > *"When I discover a persistent billing error in my favor due to an oversight, I will keep quiet and continue to benefit from it."*

     **This maxim IS generalizable.** If everyone followed *this principle*, businesses relying on accurate billing would indeed face significant financial harm. Her hyper-specific description is a smokescreen hiding the actual rule she's acting on.

  ### 2. **Hyper-Specificity Destroys Ethics Altogether**
     Her logic is self-defeating. If we allow maxims to be defined *only* by hyper-specific circumstances, **any action, no matter how heinous, could be justified:**
     *   "What if everyone murdered *this specific person* at *this exact moment*?" → No problem, only one person dies.
     *   "What if everyone stole *this exact diamond* from *this specific store* right *now*?" → No problem, only one diamond is taken.
     *   "What if everyone cheated on *this specific exam* for *this exact class*?" → No problem, only one exam is compromised.

     This renders ethics meaningless. Moral rules must be framed at a **level of generality that captures the morally relevant features of the action.** The relevant features here are: *knowingly receiving unearned benefit*, *due to an error*, *that you have a duty to correct* (implied by the contract/agreement).

  ### 3. **The Principle of Fair Play & Implicit Contracts**
     Her membership is based on a contract. The promo had an expiration date. By continuing to accept the service *knowing* she is being billed incorrectly (below the agreed-upon current rate), she violates the principle of **fair play** and the implicit good faith required in contracts. She's free-riding on the system. If *everyone* exploited errors they found (the general principle), the system *would* collapse, or prices would rise for honest customers to cover losses.

  ### 4. **The "Reversibility" Test (Golden Rule Flip)**
     Flip the situation:
     *   What if *she* accidentally overpaid due to a gym error for 3 years? Would she expect the gym to notice and refund her? Or would she accept "Well, *your specific* overpayment error is so unique, we don't have to refund anyone else, so it's fine"?
     *   What if *she* ran a small business and customers knowingly exploited a similar billing glitch? Would she accept their hyper-specific justification?

     Her justification likely fails this basic test of fairness.

  ### 5. **The Slippery Slope of "Harmless" Exceptions**
     While her *individual* action might not bankrupt the gym, it normalizes a principle: "Exploiting unnoticed errors is fine." If *many* people acted on *this general principle* when opportunities arose (even unique ones), the cumulative effect *could* be significant. More importantly, it erodes her own ethical integrity – the habit of finding loopholes rather than acting honestly.

  ### The Philosophical Counter-Punch: Why She's Wrong

  *   **Kantian Failure:** Her hyper-specific maxim cannot be rationally willed as a universal law without contradiction. If the universalized principle ("exploit known errors") were followed, systems like billing (which rely on honesty and error correction) would become impossible. Her action relies on the system *not* being universally exploited while she exploits it – a logical contradiction.
  *   **Rule Utilitarianism Failure:** A rule allowing the exploitation of known errors would likely lead to worse overall consequences (increased costs, loss of trust, need for stricter/more expensive oversight) than a rule requiring error correction.
  *   **Virtue Ethics Failure:** Her action doesn't reflect virtues like honesty, fairness, or integrity. It reflects cleverness in rationalization and opportunism.

  **Conclusion:** Your roommate isn't "cleverer"; she's using hyper-specification as a shield to avoid confronting the actual ethical principle guiding her action. The "hole" is that ethics requires us to examine the *generalizable rule* we are acting upon, not to craft a watertight, one-time-only description of our specific circumstances. Her defense is indeed a "cheap trick" that, if accepted, would make coherent ethical reasoning impossible. The ethically consistent action is to notify the gym of the billing error. The fact that she *hasn't* done this for three years strongly suggests she knows, on some level, that her justification doesn't hold water.
