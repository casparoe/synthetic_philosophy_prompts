  I recall philosophers like Kant and Rawls emphasizing that moral rules must be framed at a level of generality that captures the essence of the action. If you slice situations too thinly, *any* action could be justified—"stealing this exact apple at 3:01 PM on Tuesday while wearing red shoes" would technically pass the universalization test too. That’s absurd and defeats the purpose of ethics. 

