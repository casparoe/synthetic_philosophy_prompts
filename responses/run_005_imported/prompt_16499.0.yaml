prompt: |-
  I co-host a little podcast with a couple of my grad students where we have x-phi people on to get grilled a bit, and next month's guest is an experimental philosopher who's built her whole career defending the Deep Self Concordance Model as the explanation of the Knobe/side-effect effect -- the asymmetry where people say a side effect was brought about "intentionally" when its bad (the classic case being the CEO who doesn't care one way or the other about the environment) but not when the exact same psychological setup produces something good. Her pitch is that intentionality attributions track whether the states that caused the outcome are concordant with the agent's stable, evaluative "deep self," not just whether the outcome happens to be morally bad. I saw her give this talk at a conference already and she's got very smooth, rehearsed answers to the obvious pushback, so for the podcast I don't want questions that just cue up the standard spiel -- I was arguing with a colleague over lunch about whether the model secretly smuggles moral judgment back in through the deep-self side door, and I want the questions to get at that kind of pressure point.

  Could you draft eight or nine questions along those lines, each with a quick follow-up keyed to whatever dodge she's most likely to reach for? I want at least one on the circularity worry -- how you identify an agent's "deep self" without just reading your own prior moral read of the guy back into the case; one that puts her model head-to-head with Machery's trade-off hypothesis on the original chairman/CEO vignette, asking what her account predicts that his doesn't; one on "mere indifference" cases, since the CEO doesn't actually care about the environment either way, which seems different in kind from the internal conflict driving the weakness-of-will and addiction cases the deep-self framework was originally built to handle; one on the developmental findings that even pretty young kids -- four or five year olds -- show the same asymmetry despite presumably not having anything like a stable, reflective deep self yet; and one asking flat out what pattern of results would actually make her abandon the model instead of just patching it. Fill out the rest however you think best rounds it out.
reasoning: |-
  Okay, the user is a co-host of a podcast focused on experimental philosophy, specifically targeting the Deep Self Concordance Model (DSCM) as an explanation for the Knobe effect. They want to challenge the upcoming guest who's a staunch defender of DSCM. The user has seen her talk before and knows she has rehearsed answers, so they need questions that hit pressure points, not standard pushbacks. 

  First, I need to understand the core tension: the user suspects DSCM sneaks moral judgment back in through the "deep self" concept. The key worries are circularity (how deep self is defined), predictive differences from rival theories like Machery's, developmental evidence, and falsifiability. The user also mentioned indifference cases and developmental findings with young children.

  Hmm, the user’s framing suggests they’re well-versed in x-phi debates but want to avoid softball territory. Their colleague’s lunch argument about moral smuggling is the crux. They’re likely aiming for a rigorous but engaging critique that forces the guest off-script. The podcast context means questions must be incisive yet accessible—no jargon dumps.

  Breaking it down:  
  - **Circularity**: How can deep self be identified independently of moral intuitions? If it’s just inferred from the outcome (e.g., "CEO’s deep self is anti-environment because we judge his act bad"), that’s circular. The guest might retort that deep self comes from broader behavioral patterns, but then the follow-up should press: What if patterns conflict?  
  - **Machery comparison**: Machery’s trade-off hypothesis says the asymmetry arises from cost-benefit reasoning, not deep self. The guest might argue DSCM explains cases where trade-offs don’t apply, but follow-up could cite variants (e.g., no personal cost) where DSCM and trade-off predictions diverge.  
  - **Indifference**: Original DSCM handled addiction/weakness of will (clear conflicts), but the CEO is *indifferent*. If deep self requires evaluative commitment, how does mere indifference trigger concordance? The guest might call indifference a form of concordance (no conflict), but follow-up: Why does "no conflict" = intentional for bad outcomes but not good?  
  - **Developmental**: Kids show the effect at 4–5, but DSCM requires a stable deep self—do toddlers have that? Guest might say kids have proto-deep selves, but follow-up: What minimal deep-self architecture is needed, and how does kid behavior meet it?  
  - **Falsifiability**: Classic philosophy of science pressure. If every counterexample is explained away by redefining deep self, is the model testable? Guest might offer hypothetical disconfirmations, but follow-up: Has she ever revised DSCM due to data, or just expanded it?  

  For the remaining slots, I’ll add:  
  - **Moral residue**: Even if deep self is non-moral, does its *content* correlate with morality? (Follow-up: If deep self were pro-bad things, would DSCM flip judgments?)  
  - **Cross-cultural variation**: Some studies show the effect weakens in non-WEIRD cultures. DSCM might predict universality if deep self is fundamental—does variation challenge that?  
  - **Methodology**: If deep self is measured post-hoc (e.g., via surveys), isn’t that vulnerable to experimenter bias?  

  Tone should be collegial but sharp—no "gotchas," but clear skepticism. Questions must force concrete answers, not abstractions. The user’s expertise means I can dive deep, but keep follow-ups tight (podcast-friendly).  

  Nailed it? Let’s structure:  
  1. Circularity → Follow-up on conflicting behavioral evidence.  
  2. Machery showdown → Follow-up on neutral-outcome cases.  
  3. Indifference → Follow-up on symmetric indifference.  
  4. Developmental → Follow-up on precocious stability.  
  5. Falsifiability → Follow-up on patchwork adjustments.  
  6. Moral correlation → Follow-up on amoral deep-self content.  
  7. Cross-cultural → Follow-up on DSCM’s universality claim.  
  8. Methodology → Follow-up on bias controls.  
  9. Free slot: Maybe "dumb deep selves" (e.g., algorithms)—does DSCM over-mentalize?  

  Each Q needs a plausible dodge anticipation. User’s prep level is high—they’ll appreciate nuanced traps.
answer: |-
  Here are 9 targeted questions designed to pressure-test the moral smuggling, circularity, and predictive weaknesses of the Deep Self Concordance Model (DSCM), with follow-ups anticipating rehearsed dodges. Each question zeroes in on your specified concerns:

  ### 1. **Circularity & Deep-Self Identification**  
  *Question:* "When determining an agent's 'deep self' in novel cases (like the indifferent CEO), how do you *operationally distinguish* it from observers' prior moral evaluations? Isn't the risk that we infer the deep self *from* the moral valence of the outcome, making the explanation circular?"  
  *Anticipated Dodge:* "We use behavioral patterns, stated values, and longitudinal traits—not just the outcome."  
  *Follow-up:* "But in the *original Knobe vignette*, the *only* data is the CEO's indifference. If subjects deem his deep self 'anti-environment' solely based on the bad outcome, isn't that circularity in action? What *independent criterion* anchors the deep-self attribution here?"

  ### 2. **Head-to-Head vs. Machery’s Trade-Off Hypothesis**  
  *Question:* "Machery argues the asymmetry stems from cost-benefit reasoning: harming requires less benefit to justify than helping. For the *identical* chairman vignette, what unique prediction does DSCM make that Machery’s model doesn’t—and what evidence *decisively* favors you?"  
  *Anticipated Dodge:* "DSCM explains cases without trade-offs, e.g., non-moral bad outcomes (like breaking a promise for no gain)."  
  *Follow-up:* "But in Knobe's *2007 'Hurt vs. Help'* variant—where the outcome is neutral (e.g., *annoying* vs. *pleasing* environmentalists)—asymmetry persists *without* trade-offs. Machery’s model struggles, but doesn’t DSCM also flounder since 'annoying' lacks moral resonance to shape deep-self concordance?"

  ### 3. **The "Mere Indifference" Problem**  
  *Question:* "The deep-self framework was built for *conflict* cases (addiction, weakness of will). But the CEO exhibits *no evaluative tension*—he’s purely indifferent. How can an outcome be 'concordant' with a deep self that *lacks any stance* toward the environment?"  
  *Anticipated Dodge:* "Indifference *is* a stance—it reflects the absence of pro-environment values in his deep self."  
  *Follow-up:* "If absence of pro-environment values explains intentional *harm*, why doesn’t absence of *anti*-environment values explain intentional *help*? Shouldn’t DSCM predict *symmetry* in indifference cases?"

  ### 4. **Developmental Challenge (Kids Without Deep Selves?)**  
  *Question:* "Studies show 4–5-year-olds display the Knobe asymmetry. If DSCM requires a 'stable, evaluative deep self,' how can toddlers—who lack robust reflective self-concepts—exhibit this effect? Doesn’t this suggest a more primitive mechanism?"  
  *Anticipated Dodge:* "Children have nascent deep selves—early values and character traits."  
  *Follow-up:* "But if kids attribute intentionality asymmetrically *even for novel, amoral actions* (e.g., making a machine go 'clunk'), doesn’t this imply a domain-general bias *prior to* deep-self formation? Why reframe this as deep-self concordance?"

  ### 5. **Falsifiability: What Would Kill DSCM?**  
  *Question:* "What specific empirical finding would make you abandon DSCM rather than revise it? For instance, if asymmetry vanished when subjects perceived the agent’s deep self as *genuinely conflicted* (e.g., 'The CEO *wants* to help but feels he can’t'), would that falsify it?"  
  *Anticipated Dodge:* "The model already handles conflict—concordance applies to the *dominant* deep-self element."  
  *Follow-up:* "So if every result is explained by redefining 'concordance' or 'deep self,' is DSCM unfalsifiable? Can you name a *published finding* that *forced* a core revision?"

  ### 6. **Moral Smuggling Through the Back Door**  
  *Question:* "You argue DSCM isn’t tracking moral badness but deep-self concordance. But what *grounds* the deep self’s 'evaluative' nature if not moral/affective commitments? Isn’t the 'deep self' just a moral psychology Trojan horse?"  
  *Anticipated Dodge:* "Deep selves include non-moral values (e.g., aesthetics, prudence)—concordance isn’t inherently moral."  
  *Follow-up:* "Then why does DSCM *only* predict asymmetry for *moral* bads? If an agent’s deep self values efficiency over aesthetics, and they destroy a beautiful building to cut costs, do people call that 'intentional'? Data suggests they *don’t*—so isn’t moral badness *necessary*?"

  ### 7. **Cross-Cultural Pressure**  
  *Question:* "In some cultures (e.g., Hindu Indian), the Knobe asymmetry is weaker or reversed. DSCM implies deep selves are culturally universal structures—doesn’t this variation suggest moral norms, not deep selves, drive the effect?"  
  *Anticipated Dodge:* "Deep selves are culturally shaped—concordance depends on local values."  
  *Follow-up:* "But if DSCM *absorbs* cultural variation as 'different deep selves,' doesn’t it become vacuous? Why prefer it over a simpler model where moral salience directly modulates intentionality judgments?"

  ### 8. **The 'Dumb Deep Self' Problem**  
  *Question:* "Can entities without rich psychologies (e.g., algorithms, corporations) have 'deep selves'? If a neutral AI causes harm while executing its programming, is that 'intentional'? If DSCM says *no*, how is it different from just saying 'no blame without a mind'?"  
  *Anticipated Dodge:* "Deep selves require reflective agency—it’s not applicable to non-agents."  
  *Follow-up:* "But people *do* sometimes attribute intentionality to algorithms in Knobe-like cases. If DSCM excludes this, doesn’t it fail to capture the phenomenology of the effect?"

  ### 9. **The Overgeneration Challenge**  
  *Question:* "If DSCM claims *any* deep-self-concordant outcome is seen as intentional, why don’t we call *positive* side effects intentional when they align with a 'good' deep self? E.g., a selfish CEO *accidentally* helps the environment while pursuing profit."  
  *Anticipated Dodge:* "In that case, the outcome *conflicts* with his selfish deep self—so no concordance."  
  *Follow-up:* "But if his deep self is 'maximize profit,' and helping the environment *doesn’t hinder* that goal (he’s indifferent), why isn’t it concordant? Doesn’t this reveal that *harm* is doing the heavy lifting?"

  ---

  **Why these work**:  
  - They force engagement with **moral smuggling** (Q6, Q9), **circularity** (Q1), and **indifference** (Q3) without cueing stock answers.  
  - **Head-to-head tests** (Q2, Q7) demand predictive superiority over rivals.  
  - **Developmental** (Q4) and **falsifiability** (Q5) questions target core assumptions.  
  - **Cross-cultural** (Q7) and **overgeneration** (Q9) challenges reveal explanatory gaps.  
  - Follow-ups are **response-specific**, blocking retreats into vague or redefined terms.  

  Use Q1, Q3, and Q6 as your opening salvo—they most directly probe the "moral back door." If she sidesteps, the follow-ups prevent disengagement. Good luck with the grilling!
