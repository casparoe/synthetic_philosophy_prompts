  First, I need to recall the key points of both arguments. Avicenna's flying man thought experiment involves a person created suspended in a void, devoid of sensory input. Despite this, the person would still affirm their own existence without affirming their body. Avicenna uses this to argue for the soul's independence from the body. Descartes, on the other hand, uses the cogito ("I think, therefore I am") to establish existence and then argues that since he can conceive of himself without a body, mind and body are distinct substances.

  The user's initial thought is that both arguments rely on a conceivability-to-possibility move. Common objections to Descartes challenge whether conceiving something without contradiction implies real metaphysical possibility. If the arguments are identical, then objections to Descartes should apply to Avicenna too. But the user's friend thinks there's a difference, so I need to explore where they might diverge.

  Looking deeper, Avicenna's focus might be on self-awareness as immediate and non-propositional. His argument emphasizes that self-awareness is inherent and doesn't depend on sensory experiences. This is pre-reflective, meaning it's an automatic consciousness of self without mediation. Descartes, however, is more about epistemological certainty. The cogito is a foundational truth from which he builds knowledge. His real distinction argument is a separate step where he uses conceivability to argue for dualism.

