  Objections to Descartes' conceivability move might not hit Avicenna as hard because he's not making the same leap. Avicenna is pointing to an immediate awareness that persists without sensory input, not arguing from conceivability to possibility. His argument is phenomenological, showing that self-awareness is always present, while Descartes is inferential.

  For the user's response paper, emphasizing these differences could add depth. They can argue that while both use thought experiments, Avicenna's approach aligns more with pre-reflective self-awareness, which ties into the user's PhD work. Highlighting the phenomenological aspect and the immediacy of self-awareness in Avicenna provides a distinct angle. The user can then address objections to Descartes but show they don't fully apply to Avicenna because the core of his argument isn't reliant on conceivability in the same way.

