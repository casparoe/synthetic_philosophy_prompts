prompt: |-
  Okay so this happened to me this weekend and I genuinely cannot stop thinking about it. My friend Maya set me up with this guy Dev from her robotics team, except not in a normal "hey you should meet my friend" way — she just knows my schedule really well and knew Dev always stays late on Thursdays, so she asked me to come with her to grab a poster from the robotics room that day, betting that if I actually talked to him I'd end up liking him, because shes known me since third grade and is honestly a little scary at reading people. She swears she never said one word to push us together once we were actually in the room, never lied to me about where we were going or why, she just picked the day and the place. It worked exactly like she predicted — we've been texting every day since and I'm already pretty sure I'll say yes if he asks me to homecoming.

  The thing that's bugging me is that now that I know how it went down, I can't decide if I actually chose any of this or if Maya basically chose it for me, since she was so sure about what I'd do before it even happened. Her defense is that she never controlled anything I did once I was actually in that room — I could've said hi and left, she only picked the situation. I get that this feels different from her literally forcing me to date him, but it also feels different from just randomly running into someone, since she was straight up banking on my own personality to do the work for her, and it worked exactly like she called it. Me and my friends argued about this at lunch for like half an hour and nobody could actually explain why it feels weird (if it should even feel weird), so now I'm asking you instead: is there an actual difference between someone knowing what you'd do in a situation and picking that situation specifically because of it, versus them actually controlling what you do? And if there is a difference, what actually makes them different? Please don't just tell me "everyone's feelings are valid," I want an actual answer lol.
