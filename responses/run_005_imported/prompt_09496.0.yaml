  Okay, let me start by unpacking the user's query. They're a graduate teaching assistant preparing for a discussion section on Hobbes's Leviathan. They've come across Hobbes's emphasis on geometry as the model science and his "maker's knowledge" epistemology. Their colleague pointed out that this isn't just a throwaway comment but central to Hobbes's epistemology. The user is now puzzled by Hobbes's persistent claim to have squared the circle despite being proven wrong repeatedly by Wallis. They want to understand how this fits with Hobbes's own theory of knowledge, especially since certainty comes from constructions we control.

  First, I need to recall Hobbes's "maker's knowledge" framework. For Hobbes, we can only have certain knowledge of things we construct ourselves, like geometric figures. The commonwealth is another example because it's made through covenants. So, geometry's certainty comes from our ability to define and construct figures through motion. 

  Now, the puzzle: If Hobbes is so wrong about squaring the circle, how does that align with his epistemology? The user suggests that maybe his insistence on geometric motion and hostility to algebra made him vulnerable to such errors. They want to avoid reducing it to mere stubbornness and instead find a conceptual flaw in his system that could be relevant to political philosophy.

  I should break down Hobbes's geometric method. He reduces all mathematical operations to physical motions—lines generated by moving points, etc. This is foundational for him. Algebra, as used by Wallis, relies on symbols and abstract manipulation, which Hobbes rejects because it's detached from concrete constructions. So, Hobbes's method is inherently constructive and physical.

  When it comes to squaring the circle, Hobbes's approach would involve a step-by-step construction via motion. Since he defines the process himself, he believes he has certainty. His repeated failures might stem from his commitment to this method. He trusts his constructions because he made them, not because they're verified externally. This is key: for Hobbes, the maker's authority supersedes empirical verification. So even when Wallis points out errors, Hobbes dismisses it as misunderstanding his method.

  This ties into his political philosophy. In Leviathan, the sovereign's definitions are uncontestable because they are constructs of the covenant. Similarly, in geometry, his constructions are incontrovertible to him because he made them. The issue is that his epistemology conflates the maker's perspective with objective truth. So, the squaring error exposes a flaw: maker's knowledge doesn't guarantee correctness, just subjective certainty. This could undermine the parallel he draws to political constructs, where the sovereign's decrees are law because they're made, not because they're true.

  The user might want to highlight this tension in class: how maker's knowledge provides certainty but risks dogmatism. Hobbes's geometric failures illustrate that self-made constructs can be erroneous, which questions the infallibility of political constructs. The deeper point is that Hobbes's system prioritizes the act of making over external validation, leading to potential blind spots. This conceptual link helps students critique the transfer of geometric certainty to political philosophy.
answer: |-
  Your puzzle cuts to the heart of Hobbes's epistemology and its potential vulnerability. While Hobbes's stubbornness is legendary, the "squaring the circle" debacle isn't *just* a personality flaw; it reveals a tension inherent within his "maker's knowledge" framework itself, particularly when applied rigorously to his specific conception of geometric construction. Here's a conceptual breakdown relevant to your teaching:

  1.  **The Core of Maker's Knowledge & Construction:**
      *   For Hobbes, *scientia* (demonstrative, certain knowledge) arises *only* from understanding the causal generation of an object by the knower. We know a circle with certainty because we define it as the figure produced by rotating a line segment around one fixed endpoint, and we understand the necessary consequences flowing *directly* from that generative act.
      *   **Key Point:** The certainty resides in the *act of construction itself* and the logical deductions *immediately* derived from it. The knower, as maker, has privileged access to the "why" of the thing's properties.

  2.  **Hobbes's Radical Constructivism in Geometry:**
      *   Hobbes insisted on grounding *all* geometric reasoning in concrete physical *motion*. Lines are traced by moving points; circles are swept out by rotation; magnitudes are compared by superposition through motion. Algebra, with its abstract symbols and operations detached from physical generation (like √(-1)), was anathema to him. It represented the very "misuse of words" he decried – manipulating symbols without a clear, constructive referent in motion.
      *   **Consequence:** A valid geometric solution, for Hobbes, *had* to be demonstrable as a finite sequence of physically conceivable motions (compass, straightedge, etc.), explicitly tracing the causal generation of the desired figure. Any proof relying on infinite series, limits, or symbolic algebra was inherently suspect, not "philosophical," and lacked the required certainty.

  3.  **Squaring the Circle and the Illusion of Construction:**
      *   Hobbes believed he had devised constructive procedures (sequences of motions) that produced a square equal in area to a given circle. He defined the terms ("circle," "square," "equality of area") and believed he traced their generation step-by-step through motion.
      *   **The Epistemological Trap:** Because Hobbes *believed* he had successfully performed the constructive act – he had, in his mind, *made* the square equal to the circle via his specified motions – he felt he possessed the same maker's certainty as for a simple circle or triangle. The constructive act, once performed (in his conception), conferred *scientia*. The problem wasn't that he doubted maker's knowledge; it was that he was utterly convinced he *had* performed the requisite making.

  4.  **Why Wallis's Refutations Didn't Dent His Confidence (Conceptually):**
      *   **Methodological Incommensurability:** Wallis used algebra, limits, and proofs relying on properties Hobbes rejected as non-constructive or meaningless. To Hobbes, Wallis wasn't engaging with *true* geometry (philosophical geometry based on motion); he was playing abstract symbol games. Wallis's proofs, however correct mathematically, failed Hobbes's *epistemological* criterion for *scientia*. They didn't address the constructive act Hobbes believed he had performed.
      *   **Misinterpretation vs. Error:** Hobbes often interpreted Wallis's (and others') criticisms as misunderstandings of his *specific constructive procedure*, not as proofs of the logical impossibility of *any* such procedure. He would tweak his "motions" slightly in response, believing he was clarifying the construction, not correcting a fundamental error. He saw it as a failure of *communication* or *execution*, not a failure of the *principle* of construction or his maker's knowledge.
      *   **The Maker's Authority:** Within his own system, the certainty flowed *from* his act of construction. External criticism, especially based on alien methods, couldn't override the internal conviction generated by his belief in having successfully *made* it. His epistemology privileged the maker's perspective to the point of making it resistant to external falsification *if* the maker remained convinced of the construction's validity. The "maker" became the sole arbiter of the success of the making.

  5.  **Implications for Maker's Knowledge & Political Philosophy:**
      *   **The Vulnerability Exposed:** The squaring episode reveals a critical vulnerability in Hobbes's maker's knowledge theory: **It conflates *subjective conviction in having performed a construction* with *objective correctness of the outcome*.** The theory provides a powerful account of certainty *if the construction is valid*, but offers no reliable internal mechanism to *detect when a construction is fundamentally flawed or impossible*. The certainty rests on the *act*, not the *result* matching an external standard (which, for circle-squaring, is transcendental impossibility).
      *   **The Role of Definition:** Hobbes's emphasis on starting from precise definitions is crucial. But the squaring debacle shows that even correct definitions ("circle," "square," "equal area") do not guarantee that a constructive procedure linking them is possible. His epistemology assumes the possibility of construction follows logically from the definitions *in a way accessible to the maker*. This assumption failed catastrophically with circle-squaring.
      *   **Parallel to Political Philosophy:** This vulnerability has profound implications for the Leviathan parallel:
          *   **Sovereign as Constructor:** The Sovereign, like the geometer, defines terms (laws, justice, property) and constructs the commonwealth through covenant. This act *should* confer certainty about civil matters ("Auctoritas, non Veritas, facit legem").
          *   **The Risk of Flawed Construction:** Just as Hobbes's geometric construction was flawed despite his conviction, could the Sovereign's political construction be fundamentally flawed (e.g., inherently unstable, unjust, or self-destructive) *despite* the Sovereign's (and subjects') belief in its validity based on the act of covenanting? Hobbes's geometric failure suggests *yes*. The maker's conviction doesn't guarantee a successful, stable outcome.
          *   **Resistance to Critique:** Like Hobbes dismissing Wallis's algebra, the Sovereign might dismiss critiques based on abstract "rights of nature," historical precedent, or moral theories external to the positive construction of the commonwealth. The Sovereign's definitions and constructions become the sole standard, potentially blinding the polity to fatal flaws visible only from an external perspective.

  **Conclusion for the Classroom:**

  Hobbes's geometric failure isn't *just* about a stubborn man; it exposes a structural tension within his maker's knowledge epistemology. The theory brilliantly grounds certainty in agency and construction but lacks a robust internal check against the maker's fundamental error regarding the *possibility* or *correctness* of the construction itself. His specific hostility to non-constructive methods (like algebra) amplified this vulnerability, insulating him from the tools needed to diagnose his error.

  When teaching the parallel to the Leviathan, emphasize this: **While the act of political construction *does* create a new reality (laws, obligations, sovereignty), Hobbes's own geometric saga demonstrates that the maker's *certainty* about the *success* and *stability* of that construction is not infallible.** The commonwealth, like the squared circle, might be a flawed construct, doomed to fail despite the conviction of its makers, precisely because the epistemology prioritizes the act and the maker's perspective over external verification or logical impossibility. This doesn't destroy the maker's knowledge model, but it crucially qualifies its claims to infallibility, highlighting a potential blind spot inherent in grounding all certainty solely in the agent's constructive power and conviction. It invites the question: If the geometer can be so profoundly wrong about his own construction, what safeguards exist against the Sovereign being wrong about theirs? Hobbes's system offers few, and his geometric failure vividly illustrates why that might be a problem.
