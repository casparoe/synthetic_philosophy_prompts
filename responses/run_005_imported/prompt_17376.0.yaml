  ## The Toast (4.5 minutes, warm & mischievous)

  [Raise your glass, smile warmly at the honoree]

  "Colleagues, friends, family, esteemed administrators... and especially our brilliant guest of honour. We’re gathered, of course, for the most predictable event in the history of academia: the retirement of someone who taught us that *nothing* is ever truly predictable! [Light chuckle]

  Seriously, though. For decades, [Colleague's Name] has been our department’s fearless navigator of the foggy shores of knowledge. She’s wrestled with the profound question: *How can we know something when the very act of looking might change it?* She’s shown us the subtle spaces between certainty and doubt, the margins where truth hides… often just out of perfect focus. [Nod respectfully to epistemologists]

  Now, the organizing committee for this little gathering… well, they told her *one* thing. They said, in true philosophical fashion: ‘Your party? It will be *sometime*… within the next two weeks.’ [Pause, look at honoree with mock sympathy] Just… sometime. Unspecified.

  [Lean in conspiratorially to the room, but keep eyes on honoree]
  "And I have to confess, [Colleague's Name], watching you these past few days has been… fascinating. Truly. The thoughtful glances down the hallway. The subtle pause outside the conference room this morning. That slightly-too-casual question about next Tuesday’s faculty meeting schedule… [Wink] You’ve been *applying* your life’s work! Calculating possibilities. Assessing evidence. Testing the boundaries of reasonable expectation against the stubborn opacity of an unspecified future date. A masterclass in real-time epistemology!"

  [Shift tone slightly, more affectionate]
  "Of course, for those of us *not* steeped in the finer points of anti-luminosity or margin-for-error principles… [Gesture warmly to family/admin staff] ...it just looked like you were wondering when the cake would arrive. [Gentle laughter] But for those in the know? [Nod to philosophy dept] We saw the beautiful, ironic tribute unfolding. The committee didn’t just plan a party; they crafted a *living homage* to your intellectual legacy. They turned your retirement send-off into the very *kind* of puzzle you’ve spent your career so elegantly dissecting."

  [Pause for dramatic effect, look around the room]
  "So. Here we are. Wednesday. [Look back at honoree, feigning slight puzzlement] It *is* within the next two weeks, certainly. But is it… *surprising*? Ah, that’s the million-dollar question, isn’t it? The committee *knew* you’d be thinking about it. They *knew* you’d be weighing the days, eliminating possibilities in your mind. They *knew* the exquisite tension they were creating… the kind of tension only a philosopher of your calibre could truly appreciate."

  [Raise glass higher, full warm smile]
  "And so, [Colleague's Name], on behalf of everyone here – from those of us who see the elegant, recursive joke being played on you at this very moment… [Nod to philosophers] ...to those who just see a room full of people who adore you [Gesture broadly] – we raise our glasses. We celebrate not just your retirement, but the brilliant, questioning mind that made this little ‘surprise’ possible. You taught us how knowledge navigates uncertainty. Today, we simply prove you were absolutely right. Cheers!"

  [Everyone drinks. The epistemologists are beaming, having seen the Williamson-style logic perfectly mirrored: her inability to rule out *any single day* with certainty (the margin-for-error) is what made the 'surprise' possible *today*, precisely because she couldn't definitively deduce its impossibility beforehand. The family/admin staff simply enjoyed a warm toast about a clever, affectionate prank celebrating her work, without needing the technical details. The honoree gets the beautiful, layered joke delivered with love.]
