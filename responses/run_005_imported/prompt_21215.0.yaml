  Ok so I've been going down a research rabbit hole for the novel I'm working on and wanted to run something by you. There's a subplot involving a big multigenerational family, and I keep circling back to this idea of Confucian "role ethics" — not the watered-down version where its just "respect your elders, don't shame the family," but the stronger claim some scholars (Roger Ames and Henry Rosemont Jr especially) push, that a person basically IS the sum of their relations — son, father, elder brother, friend, minister — rather than some prior, self-contained individual who just happens to occupy those roles the way we tend to assume by default. My friend who's doing a philosophy PhD keeps sending me stuff on this and there's this one bit from the Analects that's been rattling around in my head ever since — the one where a local official brags to Confucius that in his town a son will testify against his own father for stealing a sheep, and Confucius basically says no, real uprightness is the father covering for the son and the son covering for the father, like the virtue doesn't exist as some free-floating universal rule that relationships then have to answer to — it only exists inside the relationship itself.

  What I'd love from you is an original short story (doesn't have to be set in ancient China at all, contemporary is fine, whatever setting feels right to you) that takes that same structural bind seriously: a character caught between an obligation that only makes sense because of who they specifically are to somebody, versus a more impersonal, rule-based or "universal" duty. But I don't want it to resolve into the usual arc where the character discovers their true independent self underneath all the social roles and breaks free of them — I want the story to actually sit with the possibility that there might not BE a self underneath the roles at all, so the conflict isn't "which side of me wins" but something a bit stranger and more unsettling than that. Keep it short-story length rather than a novel-length pitch, and please, please steer clear of the generic "immigrant kid vs. strict traditional parents" cliche, I've read about nine hundred versions of that one already and I want the philosophical bite, not the sitcom version.
