prompt: |-
  I've been part of a small monthly reading group that grew out of the comment section of a decision-theory blog -- the kind of group in which everyone has already read the Sequences and several of us have strong opinions about updateless decision theory. Last month we worked through some of Caspar Oesterheld's writing on evidential cooperation in large worlds (ECL), and the discussion ended in a genuine disagreement between two members, Ilana and Soren, that the rest of us couldn't settle and that I've kept turning over since.

  (1) Ilana opened by defending the practical upshot of ECL: if the universe, or the wider Everettian multiverse, is as large as our best cosmology suggests, then there are enormous numbers of agents who are causally cut off from us but who reason in relevantly similar ways while ending up with very different terminal values; because our decision is correlated with theirs rather than causing theirs, we have the same kind of reason to cooperate with them on a compromise of values that we would have to cooperate with a psychological twin in a one-shot prisoner's dilemma, and in practice that means diverting some altruistic effort toward causes that make sense under the compromise rather than under our own values alone. (2) Soren objected that this move only works if you help yourself to evidential or functional decision theory exactly when it's convenient: correlation without causation is precisely what a causal decision theorist says gives you no reason to act, and if the group wants to reject causal decision theory it should defend that rejection on its own terms rather than smuggle it in through ECL. (3) Ilana replied that this was already settled business, since the group had spent an earlier session agreeing that functional-decision-theoretic reasoning handles Newcomb's problem and the twin prisoner's dilemma better than causal decision theory does, and ECL is simply that same move applied to a much larger population of correlated agents. (4) Soren granted the point for clean, symmetric cases -- literal twins, or provably identical algorithms -- but said ECL needs correlation with agents who might share nothing with you beyond a loose family resemblance, something like "being a reasoner who takes ECL seriously," and once correlation is allowed to be that thin, nothing constrains how many such agents exist or how much weight each deserves, so the supposed gains from trade can be made to justify almost anything depending on how generously the reference class is drawn. (5) Ilana conceded the reference-class worry but said it is the same difficulty that already sits inside moral uncertainty and anthropic reasoning more generally, and nobody proposes abandoning expected-value reasoning under moral uncertainty simply because weighting rival theories against one another is hard. (6) Soren's response was that the two cases are not parallel: moral uncertainty is uncertainty about one agent's own obligations, resolvable in principle through that agent's further reflection, whereas ECL rests on claims about how many correlated agents actually exist and how similar they really are -- claims we have no independent way of checking -- so the whole calculation looks less like ordinary reasoning under uncertainty and more like Pascal's Mugging in decision-theoretic dress.

  Could you go through moves (1) through (6) and say who has the better of the argument at each stage, rather than simply declaring an overall winner? I would also value your own view on whether some version of ECL survives Soren's reference-class objection, or whether that objection is quietly fatal to the whole project.
reasoning: |-
  Okay, the user is part of a reading group that's been discussing ECL (Evidential Cooperation in Large Worlds), and there's a disagreement between Ilana and Soren. I need to break down each of their six moves and assess who has the better argument at each stage, plus give my own view on whether ECL survives Soren's reference-class objection.

  First, let me recall what ECL is about. It's an idea from Caspar Oesterheld that suggests in a large universe or multiverse, there are many agents who are causally disconnected but correlated in their decision-making. Because they reason similarly, they might cooperate on a compromise of values, similar to how psychological twins cooperate in a Prisoner's Dilemma. But Soren is skeptical, especially about the reference class problem.

  Looking at move (1): Ilana defends ECL's practical upshot. She argues that in a large multiverse, correlated agents should cooperate on value compromises. Her point is strong because it builds on established ideas like FDT/UDT handling Newcomb-like problems. If the multiverse is vast, it's plausible that such correlations exist. So Ilana seems to have the edge here, grounding it in cosmology and decision theory.

  Move (2): Soren objects that ECL is cherry-picking decision theories. He says CDT doesn't care about correlation without causation, so adopting FDT only for ECL is inconsistent. This is a valid point—if the group uses CDT elsewhere but switches to FDT for ECL, it's ad hoc. Soren is challenging the foundational choice, so he has the better argument at this stage. Ilana can't just assume FDT without defending it properly.

  In move (3), Ilana counters that the group already agreed FDT handles Newcomb and twin PD better, so ECL is a natural extension. This is a strong rebuttal if the group indeed settled on FDT earlier. Consistency in applying FDT to new scenarios is reasonable, so Ilana probably wins this point. Soren's objection might be seen as reopening a closed debate.

  Move (4): Soren grants symmetric cases but attacks "loose" correlations. He argues that if the reference class is too broad (e.g., "anyone taking ECL seriously"), it becomes unconstrained. This is a serious issue—how do we define similarity? Soren has the upper hand here because vague reference classes can lead to arbitrary outcomes, like Pascal's Mugging. Ilana needs to address this specifically.

  For move (5), Ilana concedes the reference-class problem but compares it to moral uncertainty. She says both involve weighting hard-to-measure things, yet we still use expected value. This is a reasonable analogy, making the problem seem manageable rather than fatal. Ilana gets points for reframing it as a known challenge, not a unique flaw.

  Move (6): Soren rejects the parallel. He argues moral uncertainty is about one agent's introspection, while ECL makes empirical claims about countless unverifiable agents. This makes ECL vulnerable to Pascal's Mugging—high-stakes claims with low probability. Soren's point is compelling because ECL's assumptions can't be tested, so it might justify anything. He likely wins this exchange.

  Overall, Soren's reference-class objection is very damaging to ECL. But Ilana's moral uncertainty analogy offers a path forward—if ECL can be seen as a form of value compromise under empirical uncertainty, with constraints on reference classes. I think a limited version of ECL might survive by focusing on "sharper" correlations, like agents with similar decision algorithms, rather than vague resemblances. The key is avoiding infinite weights and arbitrary classes.

  The user probably wants clarity on whether ECL is salvageable and how to navigate this debate. They might also be interested in practical implications—like how much to divert resources to compromise causes. My response should validate both sides while suggesting cautious, constrained application of ECL principles.
answer: |-
  Let's break down the exchange between Ilana and Soren step by step, assessing the strengths and weaknesses of each move. I'll conclude with my view on ECL's viability.

  ---

  ### **Move (1): Ilana’s Defense of ECL’s Practical Upshot**
  - **Ilana’s Claim**: In a vast universe/multiverse, agents causally disconnected but *correlated* (due to similar reasoning) should cooperate on value compromises, just as psychological twins would in a one-shot PD.  
  - **Assessment**: Ilana has the better argument here.  
    - She correctly grounds ECL in established decision theory (FDT/UDT), extending the "twin PD" logic to cosmological scales.  
    - If we accept (as the group did) that FDT handles twin PD, and if modern cosmology implies vast numbers of correlated agents, this is a coherent extension.  
    - **Weakness**: Assumes cosmology *does* imply vast numbers of agents with "relevantly similar" reasoning and "very different terminal values"—a claim Soren later challenges.  

  ---

  ### **Move (2): Soren’s Objection on Decision-Theoretic Inconsistency**
  - **Soren’s Claim**: ECL selectively uses FDT (for correlation) while ignoring CDT (which dismisses acausal correlation). This is ad hoc unless FDT is defended outright.  
  - **Assessment**: Soren has the better argument here.  
    - He identifies a genuine inconsistency: if the group uses CDT elsewhere but switches to FDT for ECL, it’s special pleading. ECL *presupposes* FDT’s validity but doesn’t engage with critiques of FDT (e.g., its handling of counterfactuals).  
    - **Weakness**: The group had already provisionally endorsed FDT earlier, so Soren might be reopening a settled issue.  

  ---

  ### **Move (3): Ilana’s Appeal to Prior Consensus**
  - **Ilana’s Claim**: The group already agreed FDT handles Newcomb/twin PD better than CDT, so ECL is a straightforward application.  
  - **Assessment**: Ilana has the better argument here.  
    - If FDT is accepted for twin PD, extending it to large populations is natural. ECL doesn’t introduce new decision theory—it scales an existing model.  
    - Soren’s objection now looks like backtracking on prior agreement.  
    - **Weakness**: Assumes ECL is *merely* scaling up twin PD, ignoring novel complexities (e.g., value comparison across agents).  

  ---

  ### **Move (4): Soren’s Reference-Class Objection**
  - **Soren’s Claim**: ECL works for "clean" cases (e.g., identical algorithms) but fails for "loose resemblance" (e.g., "agents who take ECL seriously"). Vague reference classes make trade gains arbitrary.  
  - **Assessment**: Soren has the better argument here.  
    - This is ECL’s Achilles’ heel. Defining "relevantly similar" agents is underspecified:  
      - Too narrow (e.g., "identical copies of me") → too few agents for meaningful cooperation.  
      - Too broad (e.g., "any rational agent") → infinite reference classes, allowing any action to be "justified" by cherry-picking correlations.  
    - ECL risks becoming unfalsifiable or Pascalian.  
    - **Weakness**: Soren doesn’t prove the problem is *insoluble*, only that ECL hasn’t solved it.  

  ---

  ### **Move (5): Ilana’s Moral Uncertainty Analogy**
  - **Ilana’s Claim**: Reference-class vagueness is no worse than moral uncertainty—both involve weighting competing claims under ignorance.  
  - **Assessment**: Ilana has the better argument here.  
    - She correctly notes that hard quantification problems exist in many domains (e.g., moral weight of animals, anthropic probabilities). We don’t abandon expected value for being messy.  
    - Pragmatically, we *can* make progress with reasonable heuristics (e.g., prioritizing correlated agents with similar decision algorithms).  
    - **Weakness**: Moral uncertainty involves introspective uncertainty about *one’s own* values, while ECL makes empirical claims about *external* agents—a distinction Soren exploits next.  

  ---

  ### **Move (6): Soren’s Pascalian Mugging Charge**
  - **Soren’s Claim**: Unlike moral uncertainty, ECL relies on unverifiable empirical claims about vast numbers of agents. This invites exploitation by "mugger"-like hypotheses.  
  - **Assessment**: Soren has the better argument here.  
    - Moral uncertainty is constrained by the agent’s own beliefs and evidence. ECL’s empirical claims (e.g., "10^100 agents exist with values *V*") are:  
      - Unfalsifiable (no way to verify distant/multiverse agents).  
      - Highly sensitive to arbitrary reference-class choices.  
    - This creates a decision-theoretic loophole: any tiny probability of vast gains can dominate calculations.  
    - **Weakness**: Soren overstates the risk. ECL can avoid mugging by discounting low-probability/extreme-stakes scenarios (e.g., using regularization).  

  ---

  ### **Overall Assessment**  
  - **Balance of the Debate**: Soren wins on moves (2), (4), and (6); Ilana on (1), (3), and (5). Soren’s reference-class objection (move 4) is the most damaging, but Ilana’s moral uncertainty analogy (move 5) offers a partial rebuttal.  
  - **Key Insight**: Soren exposes ECL’s foundational vulnerability—**reference-class vagueness**—but doesn’t prove it’s fatal. Ilana shows the problem isn’t unique to ECL but fails to resolve it.  

  ---

  ### **Can ECL Survive the Reference-Class Objection?**  
  **Yes, but in a limited form**—if it adopts constraints to avoid arbitrariness and Pascalian extremes:  

  1. **Sharpen "Relevance"**:  
     - Restrict correlation to agents with *verifiably similar decision algorithms* (e.g., humans using FDT, not "any rational being").  
     - Use *empirical anchors* (e.g., evolutionary psychology) to estimate value distributions.  

  2. **Avoid Unbounded Gains**:  
     - Impose *regularization*: Ignore hypotheses where estimated agent counts exceed computational plausibility (e.g., > 10^30 agents).  
     - Use *modest trade ratios*: Start with small compromises (e.g., 1% of resources) until evidence improves.  

  3. **Moral Uncertainty Hybrid**:  
     - Frame ECL as *one factor* in moral uncertainty. Instead of "correlated agents demand X," ask: "How much should I weight value system *V* given evidence of correlated agents endorsing *V*?"  
     - This caps the influence of speculative populations.  

  **Conclusion**: Soren’s objection is **not quietly fatal** but forces ECL into a humbler, empirically grounded form. The core insight—that acausal correlation *could* motivate compromise—survives, but practical applications require cautious, bounded implementations. The debate mirrors broader tensions in FDT: its elegance in toy models vs. its fragility in the real world.  

  **My View**: ECL remains a provocative thought experiment but lacks the precision for robust real-world altruism. Prioritize causal cooperation (e.g., with measurable human communities) unless/until evidence for "large-world" correlations improves.
