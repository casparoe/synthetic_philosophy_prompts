  This is a historical claim. While Molina did address the problem of evil, his primary focus in introducing middle knowledge was to reconcile divine providence and human freedom, not specifically the logical problem of evil as formulated by Mackie. The logical problem of evil is a 20th-century formulation, and Molina's work predates it. However, it is true that Molinism is used to address the problem of evil. This is a minor inaccuracy.

