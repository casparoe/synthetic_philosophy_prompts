answer: |-
  ### The Case Against Joyce's Accuracy-Dominance Argument for Probabilism

  Your skepticism about the residual rule-relativity in Joyce's dominance argument—even after restricting to strictly proper scoring rules—is well-founded. I'll rigorously defend the position that the argument fails to establish the irrationality of incoherent credences due to this relativity. I'll first formalize the argument, identify the flaw, explain why strict propriety doesn't resolve it, engage with the strongest defender reply, and explain why it falls short.

  ---

  ### 1. **Joyce's Argument Formalized and the Relativity Problem**
  #### Core Framework
  - **Credence functions**: Let $c : \mathcal{F} \to [0,1]$ assign credences to propositions in a finite algebra $\mathcal{F}$.  
  - **Coherence**: $c$ is coherent iff it satisfies the probability axioms.  
  - **Accuracy measures**: A scoring rule $S(c, \omega)$ quantifies the inaccuracy of $c$ in world $\omega$ (where $\omega$ assigns truth values to propositions).  
  - **Dominance**: $c$ is **accuracy-dominated** by $c'$ iff $S(c', \omega) \leq S(c, \omega)$ for all $\omega$, with strict inequality for some $\omega$.  
  - **Joyce's 2009 Theorem**:  
    > If $c$ is incoherent, then for any strictly proper scoring rule $S$, there exists a coherent $c^*$ such that $c^*$ accuracy-dominates $c$ under $S$.  
    Strict propriety ensures that for any coherent $c$, $c$ uniquely minimizes expected inaccuracy *by its own lights*:  
    $$\underset{c'}{\text{argmin}}  \ \mathbb{E}_c[S(c', \omega)] = c \quad \text{(for coherent $c$)}.$$

  #### The Relativity Problem (Bronfman's Point)
  **Issue**: While *some* coherent $c^*$ dominates $c$ under *any fixed* strictly proper $S$, **which** $c^*$ dominates $c$ depends critically on the choice of $S$. Consequently:  
  - Two strictly proper rules $S_1$ and $S_2$ can disagree on *which* coherent credence dominates a given incoherent $c$.  
  - For some incoherent $c$, $S_1$ may deem it dominated by coherent $c_1^*$, while $S_2$ deems it dominated by a *different* coherent $c_2^* \neq c_1^*$.  
  - Worse, $c_1^*$ (optimal under $S_1$) may be *less accurate* than $c$ under $S_2$ in some worlds, breaking any "cross-rule" dominance.  

  **Concrete Example**:  
  Consider an agent with credences over two mutually exclusive propositions $A$ and $B$:  
  - Incoherent $c$: $c(A) = 0.6$, $c(B) = 0.5$ (violates $c(A \cup B) \geq c(A) + c(B) - 1$).  
  - **Brier score** $S_{\text{Brier}}(c, \omega) = (c(A) - \mathbf{1}_\omega(A))^2 + (c(B) - \mathbf{1}_\omega(B))^2$:  
    - Dominating coherent $c^*_{\text{Brier}}$: e.g., $c^*(A) = 0.55$, $c^*(B) = 0.45$ (minimizes Euclidean distance to $c$).  
  - **Logarithmic score** $S_{\text{log}}(c, \omega) = -\log c(A)$ if $A$ true, else $-\log(1 - c(A))$ (similarly for $B$):  
    - Dominating coherent $c^*_{\text{log}}$: e.g., $c^*(A) = 0.58$, $c^*(B) = 0.42$ (minimizes Kullback-Leibler divergence).  

  Under $S_{\text{Brier}}$, $c^*_{\text{Brier}}$ dominates $c$; under $S_{\text{log}}$, $c^*_{\text{log}}$ dominates $c$. But $c^*_{\text{Brier}}$ is *not* more accurate than $c$ under $S_{\text{log}}$ in all worlds (e.g., if $A$ is true and $B$ false, $S_{\text{log}}(c^*_{\text{Brier}}, \omega) > S_{\text{log}}(c, \omega)$). Thus, no single coherent credence dominates $c$ *across all strictly proper rules*.  

  #### Why This Undermines the Irrationality Claim
  The dominance argument asserts that incoherent $c$ is irrational because it is *strictly worse* than some available coherent alternative. But:  
  - **No unified alternative**: The "available alternative" ($c^*$) changes with $S$. An agent has no reason to switch to $c^*_{\text{Brier}}$ if $S_{\text{log}}$ is legitimate, and vice versa.  
  - **No guarantee of pragmatic improvement**: Switching to $c^*_{\text{Brier}}$ may *increase* inaccuracy under $S_{\text{log}}$, so the agent cannot ensure improvement without first choosing a scoring rule.  
  - **Rule-relativity of dominance**: Whether $c$ is dominated is not rule-invariant *for the same alternative*. The argument relies on dominance under *all legitimate rules*, but the dominator is rule-relative.  

  **Key implication**: The dominance is *instrumental* to the scoring rule, not intrinsic to the credences. This severs the link between dominance and irrationality.

  ---

  ### 2. **Why Strict Propriety Doesn't Resolve Relativity**
  Strict propriety ensures that coherent credences are "self-recommending" (no other credence has lower expected inaccuracy by their own lights). This addresses Maher's absolute-value counterexample (which is improper) but fails to fix relativity because:  
  - **Propriety constrains *self-assessment*, not cross-rule agreement**: Propriety guarantees that for a *fixed* $S$, coherent credences avoid dominance *by other credences under that same $S$*. It says nothing about how $S$ relates to other rules.  
  - **Strictly proper rules are abundant and structurally diverse**: The class includes Brier, log-loss, spherical, and Tsallis scores. These induce distinct geometries:  
    - Brier → Euclidean distance in probability space.  
    - Log-loss → Kullback-Leibler divergence.  
    - Spherical score → Angular distance.  
    Each generates different "closest" coherent credences for a given $c$, leading to divergent dominators.  
  - **No neutral ground**: Without a privileged $S$, we cannot non-arbitrarily select which dominator $c^*$ should compel the agent.  

  **Result**: Restricting to strictly proper rules ensures that incoherent credences *are* dominated under *each* rule, but fails to ensure that they are dominated *by the same coherent alternative* across rules. The irrationality of incoherence becomes contingent on the choice of $S$.

  ---

  ### 3. **Strongest Defender Reply and Engagement**
  Defenders of accuracy-first epistemology typically offer one of three replies. I'll present and critique each.

  #### Reply 1: **All Strictly Proper Rules Agree on Dominance (Even If Not on the Dominator)**
  **Argument**:  
  The core result holds: for *any* strictly proper $S$, incoherent $c$ is dominated by *some* coherent $c^*_S$. Thus, regardless of $S$, incoherence is always dominated. Rationality requires avoiding dominance *under any legitimate measure*, so incoherence is irrational simpliciter.  
  - **Analogy**: A route that is longer than some alternative *on every possible map* is objectively inefficient, even if the "best alternative" varies by map.  

  **Rebuttal**:  
  This conflates *dominance* with *inefficiency*. Dominance arguments require a **specific dominating alternative** that is *recognizably better*:  
  - If no $c^*$ dominates $c$ under *all* legitimate $S$, the agent cannot identify which coherent credence to adopt. Switching to $c^*_S$ may worsen accuracy under $S'$.  
  - Rationality requires **actionable improvements**: If the dominating alternative is rule-relative, the agent lacks a pragmatic imperative to adopt it.  
  - **Example**: Suppose an incoherent $c$ is dominated by $c_1^*$ under $S_1$ and $c_2^*$ under $S_2$. If the agent adopts $c_1^*$, they risk higher inaccuracy if $S_2$ is "correct." This violates the dominance argument's guarantee of "no-regret" improvement.  

  #### Reply 2: **Further Constraints (e.g., Additivity, Symmetry) Privilege a Unique Rule**
  **Argument**:  
  Strict propriety alone is too weak, but adding plausible constraints narrows the field:  
  - **Additivity**: $S(c, \omega) = \sum_i s(c(A_i), \mathbf{1}_\omega(A_i))$ for atomic propositions.  
  - **Symmetry**: $s$ is invariant under relabeling of truth values.  
  - **Propriety**: As before.  
  Joyce (2009) and Predd et al. (2009) show that only **Brier score** (and affine transformations) satisfy all three for finite algebras. Thus, Brier is uniquely privileged, resolving relativity.  

  **Rebuttal**:  
  This relies on **unjustified normative assumptions**:  
  - **Why additivity?** Real agents may care about global features (e.g., calibration) not captured by summing local scores. The logarithmic score violates additivity for disjunctions but is widely used in information theory.  
  - **Why symmetry?** Asymmetry (e.g., penalizing false positives more than false negatives) is natural in medical/legal contexts.  
  - **Arbitrariness**: These constraints are pragmatic (e.g., mathematical convenience) not epistemic. Philosophers like Levinstein (2012) argue they lack accuracy-based justification.  
  - **Counterexample**: For infinite algebras, no strictly proper additive score exists. If rationality requires coherence for infinite cases, this approach fails.  

  #### Reply 3: **Disagreements Are Insignificant or Rare**
  **Argument**:  
  While dominators may differ, all strictly proper rules agree that incoherent credences are dominated, and the resulting $c^*$ are "close" in probability space. Thus, relativity is minor and doesn't undermine the irrationality verdict.  

  **Rebuttal**:  
  **Proximity is not identity**:  
  - **Case 1**: In the example above, $c^*_{\text{Brier}} = (0.55, 0.45)$ and $c^*_{\text{log}} = (0.58, 0.42)$ differ significantly. Under Brier, $c^*_{\text{log}}$ has higher inaccuracy than $c$ in worlds where $A$ is false.  
  - **Case 2**: For credences near the boundary of coherence, dominators under Brier vs. log-loss can lie in different "directions" (e.g., one correcting overconfidence, another underconfidence).  
  - **Practical significance**: In ML (as you know), Brier and log-loss yield different calibrated classifiers. An agent guided to $c^*_{\text{Brier}}$ would be suboptimal if log-loss is the right metric.  
  **Rarity is unproven**: No theorem shows that dominators converge as credences approach coherence. Relativity persists in the limit.  

  ---

  ### 4. **Does the Reply Rescue the Argument?**
  **No**. The strongest reply—that dominance under *every* legitimate rule suffices for irrationality—fails because:  
  - **Epistemic circularity**: The argument assumes all strictly proper rules are "legitimate," but their legitimacy rests on propriety, which is justified *by the same dominance argument*. This is question-begging.  
  - **No escape from relativity**: Without a unique $c^*$, the agent faces a dilemma: whichever coherent credence they adopt, some legitimate $S$ judges it less accurate than another $c^{**}$ in some worlds. Dominance under a *fixed* $S$ doesn't compel change when $S$ is contested.  
  - **Weaker conclusion**: At best, the argument shows that incoherent credences are *instrumentally irrational relative to a chosen $S$*. But this is a far cry from establishing probabilism as a universal requirement of rationality.  

  **Broader implication**: Accuracy-first epistemology must either:  
  1. **Privilege a specific scoring rule** (e.g., Brier), but this requires non-accuracy-based justifications (e.g., additivity), undermining the "accuracy-first" project.  
  2. **Accept that coherence is only conditionally rational**—i.e., rational *if* one adopts a scoring rule. But this concedes that scoring rules are primary, not coherence.  

  ---

  ### Conclusion
  Your intuition is correct: the residual rule-relativity in Joyce's dominance argument—even after restricting to strictly proper scoring rules—fatally undermines its claim that incoherent credences are objectively irrational. While incoherent credences are dominated *under each rule*, the rule-relativity of the dominating alternative means there is no coherent credence that uniformly dominates across all legitimate measures. Consequently, an agent lacks a *pragmatic imperative* to switch to a specific coherent alternative, as doing so may increase inaccuracy under some proper rules. Defenders cannot resolve this without importing non-accuracy-based constraints (e.g., additivity) or weakening the conclusion. This leaves accuracy-first epistemology without a decisive argument for probabilism. For your work in ML, this underscores that scoring rule choice (Brier vs. log-loss) is not merely pragmatic but reflects deeper normative commitments—a point philosophers would do well to heed. If you're exploring alternatives, you might investigate Levinstein’s "relative rationality" or Schervish’s decision-theoretic approach, which embrace context-dependence without demanding universal dominance.
