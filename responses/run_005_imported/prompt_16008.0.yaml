prompt: |-
  I'm on the small committee at my company that reviews and signs off on postmortems for our worst ("Sev-1") incidents before they go out to the rest of engineering, and a write-up we're finalizing this week has turned into a bigger disagreement than I expected. Three weeks ago, a refactor removed a validation check on one field in our checkout flow; when that field arrived null from a client we don't fully control, a downstream pricing service threw an unhandled exception and took the whole checkout path down for about fifty minutes. The draft postmortem, written by the incident commander, names the missing check (and the missing regression test that would have caught its removal) as the "root cause," and recommends a coaching conversation with the engineer who did the refactor.

  Half the committee thinks that's reasonable; the other half points out that at least three other omissions were just as necessary for the outage to happen: the reviewer approved the pull request without flagging that the change had no new test coverage, a ticket asking for broader edge-case tests on exactly that code path had been sitting deprioritized in the backlog for eight months, and the alert that would have caught the malformed requests within two minutes had been muted after a false-positive spree the previous quarter, with the ticket to re-tune it left untouched since. If any single one of those four things had gone differently, we don't have an outage — so strictly by that test we have four root causes, or none, and "root cause" stops doing any real work. One of our staff engineers, who reads philosophy outside of work, told me this is basically an old and apparently unresolved problem philosophers call "causation by omission," which didn't leave me feeling much better about Thursday.

  Could you draft the memo I'll bring into Thursday's meeting? It needs to do two concrete things: recommend how the postmortem should describe causation in this specific case — keep the engineer's omission as the named root cause, list several contributing causes with no ranking among them, retire "root cause" language for this class of incident altogether, or something else you think fits better — and state a rule the committee could actually reuse the next time several omissions all pass the "it wouldn't have happened otherwise" test, so we're not relitigating this from scratch every quarter. Whatever you recommend, take seriously the strongest argument for keeping a single named cause — that spreading responsibility across four different omissions means no one in particular is on the hook to fix anything — rather than dismissing it as just blame culture. And keep it something the committee could act on inside our one-hour meeting, not a philosophy seminar.
reasoning: |-
  We are facing a debate on how to describe causation in a postmortem for a Sev-1 incident. The incident occurred due to multiple omissions: 
  1. An engineer removed a validation check without a regression test.
  2. A reviewer approved the pull request without flagging missing test coverage.
  3. A backlog ticket for broader edge-case tests was deprioritized for eight months.
  4. An alert that could have caught the issue was muted and not re-tuned.

  The committee is split between naming the engineer's omission as the "root cause" and the view that there are multiple necessary causes (or none) because the outage required all four to happen.

  The memo must:
  - Recommend how to describe causation in this specific postmortem.
  - Propose a reusable rule for future incidents with multiple omissions.

  We must address the concern that without a single named cause, responsibility is diffused and fixes might not happen.

  Approach:
  1. Avoid the term "root cause" in this context because it implies a single cause when multiple factors are necessary and sufficient. Instead, use "direct cause" for the immediate technical failure and "contributing factors" for the others.
  2. Emphasize that each factor is a necessary condition and that the system failed due to multiple layers of defense being down.
  3. Propose a rule for future incidents: When multiple omissions (or actions) are identified as necessary conditions for the incident, the postmortem should:
     a. Identify the direct cause (the most immediate technical failure that directly led to the incident).
     b. List contributing factors (systemic, organizational, or process issues that allowed the direct cause to occur and go undetected).
     c. Avoid using the term "root cause" if it is ambiguous and instead use "key factors" or "causal factors" and ensure that each factor has an assigned action item.

  For the current incident:
  - Direct cause: The removal of the validation check without a regression test, leading to an unhandled exception when a null value was encountered.
  - Contributing factors:
    1. The code review process did not catch the missing test coverage.
    2. The backlog item for enhancing edge-case tests was deprioritized for an extended period.
    3. The alerting system was muted and not re-tuned, preventing early detection.

  This way, the engineer's action (or omission) is the direct cause, but we also highlight the systemic issues that allowed it to cause an outage. Each contributing factor should have a clear action item and owner.

  Reusable rule:
  "For incidents involving multiple necessary conditions (especially omissions), the postmortem should:
  - Identify a direct cause: the most immediate technical failure that triggered the incident.
  - Identify contributing factors: systemic, organizational, or process issues that created the conditions for the direct cause to occur and go undetected.
  - Assign actionable items to each contributing factor, ensuring that responsibility for fixes is clear and not diffused.
  - Avoid the term 'root cause' when it is ambiguous and instead use 'direct cause' and 'contributing factors' to provide clarity and drive targeted improvements."

  This approach addresses the concern about diffused responsibility by making sure each factor has an owner and an action item. It also moves away from a blame culture by focusing on systemic fixes.

  Memo Draft:

  ---

  **To:** Postmortem Review Committee  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation for Describing Causation in [Incident Name] Postmortem and a Reusable Rule for Future Incidents  

  In preparation for our meeting on Thursday, I've drafted a recommendation for how we should describe causation in the current postmortem and a rule we can adopt for similar incidents in the future. This memo addresses the committee's split on whether to name a single "root cause" or acknowledge multiple factors. It also takes seriously the concern that without a clear point of responsibility, necessary fixes might not happen.

  ### Recommendation for the Current Postmortem
  For the incident in question, I recommend we retire the "root cause" language and instead describe the causation as follows:

  1. **Direct Cause**: The removal of a validation check without a corresponding regression test, which allowed a null value to propagate to the pricing service and cause an unhandled exception.  
     - *Action*: The engineer involved will be coached on the importance of maintaining validation checks and regression tests during refactors. However, note that this coaching is part of a broader improvement (see below).

  2. **Contributing Factors**:  
     a. **Code Review Gap**: The pull request review did not catch the missing test coverage.  
        - *Action*: The team will update their code review checklist to explicitly require validation of test coverage for removed logic.  
     b. **Backlog Prioritization Issue**: A ticket to add broader edge-case tests for this code path had been deprioritized for eight months.  
        - *Action*: The team will revisit their backlog and prioritize such tests; we will also review our backlog grooming process to ensure critical quality improvements are not deferred indefinitely.  
     c. **Alerting Gap**: The alert that would have detected the malformed requests within minutes was muted and not re-tuned.  
        - *Action*: The SRE team will re-tune and re-enable the alert, and we will establish a process to review muted alerts weekly until they are resolved.

  This structure:
  - Acknowledges the immediate technical failure (direct cause) without ignoring the systemic issues.
  - Assigns clear action items for each factor, ensuring responsibility is not diffused.
  - Shifts the focus from individual blame (the engineer) to a set of improvements that will strengthen our system.

  ### Proposed Rule for Future Incidents
  To prevent rehashing this debate, I propose we adopt the following rule for postmortems when multiple omissions (or actions) are identified as necessary conditions:

  **Rule**: When an incident occurs due to multiple necessary conditions (especially omissions), the postmortem will:  
  1. **Identify a direct cause**: The most immediate technical failure that triggered the incident.  
  2. **Identify contributing factors**: Systemic, organizational, or process issues that allowed the direct cause to occur and go undetected.  
  3. **Assign action items**: Every direct cause and contributing factor must have at least one actionable item with a clear owner and timeline.  
  4. **Language**: Avoid the term "root cause" if it is ambiguous (i.e., when multiple factors are necessary). Instead, use "direct cause" and "contributing factors" to provide clarity and drive targeted improvements.

  This rule ensures we:  
  - Do not oversimplify complex incidents.  
  - Hold individuals and teams accountable for fixes without fostering a blame culture.  
  - Drive systemic improvements that prevent recurrence.

  ### Addressing the Concern About Diffused Responsibility
  The strongest argument for a single named cause is that without it, responsibility becomes diffused. Our approach counters this by mandating that every contributing factor has an assigned action item and owner. This ensures that each gap is addressed, and the entire chain of failures is broken. It also moves us toward a culture of collective ownership and continuous improvement.

  I believe this approach will allow us to finalize the current postmortem effectively and provide a clear framework for future incidents. I look forward to discussing this in Thursday's meeting.

  ---
answer: |-
  ### Memo: Framework for Describing Causation in Sev-1 Postmortems  
  **To:** Postmortem Review Committee  
  **From:** [Your Name]  
  **Date:** [Current Date]  
  **Subject:** Recommended Causation Framework for [Incident ID] & Reusable Rule for Multi-Omission Incidents  

  ---

  #### **Recommendation for This Postmortem**  
  1. **Retire "root cause" language** for this incident. Replace it with:  
     - **Direct Cause:** Removal of the validation check without a regression test.  
     - **Contributing Factors:**  
       - Reviewer missed the lack of test coverage in the PR.  
       - Backlog ticket for edge-case testing deprioritized for 8 months.  
       - Critical alert muted without timely re-tuning.  
     - **Trigger:** Null field from external client.  

  2. **Assign accountability via actions, not labels:**  
     - **Direct Cause:** Engineer receives coaching (as drafted).  
     - **Contributing Factors:**  
       - Code review process: Update PR checklist to mandate test coverage checks for validations.  
       - Backlog hygiene: Implement quarterly "risk-prioritization" reviews for test-related tickets.  
       - Alert governance: Create a 48-hour SLA for re-tuning muted alerts.  

  **Why this works:**  
  - **Prevents blame diffusion:** Each factor has an explicit owner/action (engineer, review process owner, backlog owner, SRE).  
  - **Acknowledges reality:** All omissions were necessary, but the direct cause is the *most actionable* technical failure.  
  - **Focuses fixes:** Isolates the chain (validation → review → testing → monitoring) without oversimplifying.  

  ---

  #### **Reusable Rule for Future Incidents**  
  **When multiple omissions pass the "necessary condition" test:**  
  1. **Identify:**  
     - **Direct Cause:** The *most immediate/proximal* unsafe change (e.g., code/configuration deletion).  
     - **Contributing Factors:** Systemic gaps that enabled the change to deploy undetected (e.g., review, testing, monitoring).  
     - **Trigger:** External event that exposed the gap (e.g., malformed client input).  

  2. **Assign:**  
     - An action item for **every** factor. Use:  
       - **Direct Cause:** Individual remediation (coaching, training).  
       - **Contributing Factors:** Process fixes (systemic/team-owned).  
     - *Never* label any single item as "root cause."  

  3. **Documentation Standard:**  
     > "This incident required multiple gaps to coincide: [Direct Cause] allowed [Trigger] to exploit [Contributing Factors]. Actions target each link in this chain."  

  ---

  #### **Why This Addresses Key Concerns**  
  - **"No one to fix anything" argument:** Explicit actions per factor ensure accountability isn’t diluted. The engineer’s error is addressed (coaching), but systemic fixes (e.g., PR checklists, alert SLAs) are owned by teams.  
  - **Philosophical clarity:** Accepts that "omissions" are causes but prioritizes *actionable proximity* over abstract necessity.  
  - **Scalable:** Takes <10 mins to apply in future reviews. No causality debates needed—just map factors to the framework.  

  **Thursday’s Goal:** Vote to adopt this framework for the current postmortem and as a committee standard. Draft updated per above.  

  ---  
  *This balances precision with pragmatism. It’s not philosophy—it’s engineering governance.*
