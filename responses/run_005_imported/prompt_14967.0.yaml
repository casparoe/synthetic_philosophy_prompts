  I recall that concepts like "baldness" or "heap" in philosophy don't have clear boundaries but are still useful. Similarly, "significant impact" can be a fuzzy concept yet meaningful. The key is to shift focus from pinpointing exact thresholds to evaluating the nature and scope of contributions. 

