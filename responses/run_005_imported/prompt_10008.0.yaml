prompt: |-
  I have been a longtime reader of Robin Hanson's Overcoming Bias, where futarchy keeps resurfacing whenever the topic of institutional design comes up. The proposal, in short, is to "vote on values, but bet on beliefs": have the polity vote on some measurable welfare metric, then let conditional prediction markets pick whichever policy is forecast to maximize it. In a recent thread on a forum I frequent, someone pointed out that the whole scheme is, in spirit, a market-based descendant of Condorcet's eighteenth-century "social mathematics," in particular his 1785 jury theorem, which shows that a large enough group of voters, each only slightly more likely than not to pick the correct answer, will converge on it with near certainty under majority rule. Condorcet originally devised the theorem to argue that criminal trial juries and legislative assemblies could be trusted to discover the objectively correct verdict or law, and he treated the result as formal support for his broader ambition of putting political decision-making on the same rigorous probabilistic footing as the natural sciences.

  I would like you to reconstruct, in some detail, what Condorcet's verdict on futarchy would plausibly have been, reasoning from positions he actually held rather than from generic Enlightenment sympathies. In particular, I would like you to work through: whether the independence and competence assumptions that do the real work in his jury theorem have any plausible analogue in a market populated by self-selected, potentially herding traders, as opposed to a cross-section of ordinary citizens or jurors; whether he would have accepted Hanson's division of labor between voting on values and betting on beliefs as a legitimate way of separating moral from empirical questions, given that Condorcet himself wanted to treat certain moral and legal questions as having a "true" answer discoverable by aggregation in the first place; and whether the wealth-weighted influence that speculative markets grant to those with capital and an appetite for risk sits comfortably with his unusually strong (for his time) commitment to political equality, including his advocacy for extending the franchise to women. I am less interested in a quick up-or-down verdict than in seeing how these specific tensions within his own body of work would have pulled him toward, or away from, endorsing markets, rather than votes or the slow spread of enlightenment through education, as the master mechanism for extracting truth from a crowd.
reasoning: |-
  Okay, the user wants me to imagine how Condorcet would view futarchy, especially focusing on the tensions within his own theories. Let me start by recalling Condorcet's key ideas. His jury theorem relies on voter independence and individual competence. But futarchy replaces voters with prediction markets. How would Condorcet feel about that?

  First, the independence issue. Prediction markets can suffer from herding, where traders follow others instead of their own info. Condorcet valued independent judgments, like in juries. Markets might not ensure that, so he'd probably be skeptical here.

  Next, competence. In the jury theorem, each juror needs slightly better than random competence. But in markets, participation is self-selected. Only those with capital and risk tolerance participate. Condorcet was big on political equality and education for all. The wealth aspect of markets would clash with his advocacy for universal rights, including women's suffrage. The elite nature of traders might make him see markets as less legitimate for public decisions.

  Then there's the values vs. beliefs separation. Condorcet believed some moral truths could be discovered through collective reasoning, like in science. Hanson's idea to vote on values but bet on beliefs might not sit well. Condorcet might think that moral questions also have empirical elements or that separating them isn't straightforward. He'd prefer a unified approach where deliberation handles both.

  Also, Condorcet's commitment to education as a means to enlighten the public contrasts with markets' reliance on existing information. He thought education improves collective decision-making over time. Markets don't necessarily promote enlightenment; they might even incentivize misinformation if profitable.

  Wealth-weighted influence is another problem. Condorcet was ahead of his time in advocating equality. Letting the rich have more sway in markets goes against his principles. Even if markets are efficient, the inequality would make him reject them as undemocratic.

  But maybe he'd see some benefits. Prediction markets aggregate diverse info quickly, which aligns with his scientific approach. Yet the lack of deliberation and potential for manipulation would worry him. He preferred structured debates and reasoned arguments over speculative trading.

  In essence, while Condorcet might appreciate the aggregation mechanism, the violations of independence, competence through broad participation, political equality, and the separation of values from beliefs would lead him to critique futarchy. He'd likely favor improving traditional voting with education and better institutions rather than replacing it with markets.
answer: |-
  Based on Condorcet's core principles as expressed in his *Essai sur l'application de l'analyse à la probabilité des décisions rendues à la pluralité des voix* (1785) and his broader Enlightenment project, his verdict on futarchy would likely be a complex mix of intellectual fascination and profound skepticism. He would recognize its ambition to systematize decision-making but reject its market mechanism as fatally flawed for achieving *political* truth and justice. Here's the reasoning, tension by tension:

  1.  **The Jury Theorem's Assumptions vs. Market Dynamics: Independence, Competence, and Representativeness:**
      *   **Condorcet's Core:** The Jury Theorem relies crucially on:
          *   **Independence:** Voters form judgments independently, not influenced by each other or external pressures during deliberation.
          *   **Minimal Competence:** Each voter has a probability >0.5 of being correct (p>0.5), however slight.
          *   **Large Numbers:** Aggregation amplifies this slight individual competence into near-certain collective correctness.
          *   **Representativeness:** The jury/assembly is a microcosm of the relevant polity (citizens, peers).
      *   **Futarchy's Market Reality:**
          *   **Independence Violated:** Prediction markets are *defined* by interdependence. Traders constantly react to prices, news, and others' actions. Herding, information cascades, and manipulation (e.g., via large capital) are endemic risks. Condorcet saw deliberation as ideally *structured* to foster independent reasoning *before* aggregation; markets foster reactive speculation *during* aggregation. This interdependence, for Condorcet, would fundamentally undermine the probabilistic guarantee of correctness.
          *   **Competence Questioned & Skewed:** Competence in markets is not about "being correct" in an objective sense, but about *profiting from price movements*. This attracts:
              *   **Self-Selection Bias:** Participants are those with capital, risk appetite, market access, and specific skills/temperaments – not a representative cross-section. Their "competence" (trading skill) doesn't necessarily correlate with understanding the underlying policy's *true* impact on social welfare.
              *   **Motivation Mismatch:** Traders aim for profit, not truth or social welfare. They might profit from short-term volatility, exploiting temporary misinformation, or even betting *against* the socially optimal outcome if it's predictable but exploitable. Condorcet assumed jurors aimed at the *correct verdict*.
          *   **Representativeness Absent:** Markets inherently exclude the vast majority lacking capital, risk tolerance, or access. Condorcet's ideal jury/assembly aimed for inclusivity (within its defined scope) as a source of diverse perspectives converging on truth. Markets are elite institutions. Condorcet would see this as a catastrophic failure to capture the "wisdom" of the relevant crowd (the citizenry).

      **Condorcet's Likely Conclusion:** Markets violate the independence assumption and distort the competence assumption beyond recognition. They create a *non-representative*, interdependent group motivated by profit, not truth-seeking. This mechanism cannot reliably deliver the "correct" policy prediction required by the Jury Theorem logic. It might be efficient at aggregating *current market expectations*, but not necessarily *truth* about complex social outcomes.

  2.  **Separating Values (Vote) from Beliefs (Bet): A False Dichotomy for Condorcet?**
      *   **Condorcet's Holistic Rationalism:** Condorcet believed in the power of reason applied universally. This included not just empirical sciences but also moral and legal philosophy. He saw moral truths (e.g., fundamental rights, justice) and optimal laws as potentially discoverable through rational inquiry and aggregation of informed judgments, much like scientific truths. The Jury Theorem wasn't *just* for factual questions; he explicitly applied it to juries (moral/legal guilt) and assemblies (good laws).
      *   **Hanson's Division:** Futarchy strictly separates: "Values" (the welfare metric) are chosen democratically (vote). "Beliefs" (which policy maximizes it) are determined technocratically (markets).
      *   **Condorcet's Objection:** He would likely see this separation as artificial and damaging:
          *   **Moral-Empirical Entanglement:** Defining a measurable welfare metric *itself* involves deep empirical and quasi-moral judgments. Is it GDP? Happiness surveys? Longevity? Equality indices? Choosing the metric involves beliefs about what *constitutes* welfare and how it *can* be measured, blurring the line Hanson draws. Condorcet would argue this crucial choice *also* requires rational deliberation and aggregation, not just a simple vote.
          *   **"True" Answers in Morality/Law:** Because Condorcet believed rational aggregation could approach objectively "true" or "best" moral/legal/political decisions, he wouldn't accept relegating the entire *means* (policy selection) to a purely empirical market mechanism. The choice of policy inherently involves judgments about rights, justice, and consequences that have a normative dimension inseparable from the empirical forecast. A policy that maximizes GDP might violate fundamental rights – Condorcet would insist this normative evaluation must be part of the *decision itself*, not just the metric definition.
          *   **Role of Deliberation:** Condorcet valued deliberation not just for aggregation but for *improving* individual competence and refining the question. Markets lack this educative and truth-refining function. Voting on a metric is a thin, non-deliberative act compared to Condorcet's vision for assemblies.

      **Condorcet's Likely Conclusion:** The strict separation is philosophically unsound. Defining the goal involves beliefs, and choosing the means involves values. The exclusion of deliberation on the policy itself, especially its normative dimensions, would render the process illegitimate and potentially dangerous from his rationalist, justice-oriented perspective. The "belief" part isn't purely empirical.

  3.  **Wealth-Weighted Influence vs. Radical Political Equality:**
      *   **Condorcet's Commitment:** He was a radical egalitarian for his time:
          *   **Universal Suffrage Advocate:** Argued for suffrage for women, people of color, and propertyless men (though with some potential educational qualifications, still vastly broader than contemporaries).
          *   **Equality as Foundational:** Saw political equality as essential for justice and legitimacy. Power derived from birth or wealth was illegitimate.
      *   **Futarchy's Mechanism:** Prediction markets grant influence proportional to capital deployed and risk appetite. Wealth = Power. The poor, risk-averse, or capital-less have negligible voice in the "belief" determination, the core of the decision.
      *   **Condorcet's Objection:** This would be anathema. It institutionalizes the very plutocracy he fought against. He might concede markets are useful for *some* economic functions, but delegating *sovereign political decision-making* to a wealth-weighted mechanism violates the fundamental principle of equal citizenship and the equal right to participate in shaping the collective fate. The "bet on beliefs" stage isn't a neutral technical tool; it's the exercise of political power, concentrated in the hands of the wealthy.
      *   **Contrast with Education:** Condorcet's primary mechanism for improving decisions wasn't markets or even just better voting systems, but *public education*. He believed enlightenment, spread universally through education, would *raise* the minimal competence (p>0.5) of the entire citizenry, making aggregation (via voting/deliberation) more reliable and just. Markets offer no such universal improvement; they simply leverage existing (and unequal) resources and risk appetites.

      **Condorcet's Likely Conclusion:** The wealth-weighting is fundamentally unjust and politically illegitimate. It contradicts the core Enlightenment principle of equality before the law and in political participation. It entrenches existing power structures rather than fostering a more enlightened and equal citizenry.

  **Synthesizing Condorcet's Probable Verdict:**

  Condorcet would likely **reject futarchy** as a viable system for political decision-making, despite its superficial appeal to his "social mathematics" aspirations. His reasoning would hinge on:

  1.  **Mechanism Failure:** Prediction markets catastrophically violate the independence and competence assumptions of the Jury Theorem in a political context. They are prone to herding, manipulation, and represent a non-representative, profit-motivated elite, not a truth-seeking collective.
  2.  **False Dichotomy:** The strict separation of values (vote) and beliefs (bet) is philosophically incoherent. Defining values involves empirical beliefs, and choosing policies involves normative values. Deliberation on the policy itself is essential for legitimacy and discovering the "best" answer, which encompasses both facts and values.
  3.  **Illegitimate Inequality:** Granting decisive political power based on wealth and risk appetite is fundamentally unjust and violates the principle of political equality, a cornerstone of his thought. It replaces democratic sovereignty with plutocratic calculation.
  4.  **Misplaced Faith:** While appreciating the *goal* of rigorous, probabilistic decision-making, he would see markets as the *wrong tool* for *political* truth. They lack the deliberative, educative, and inclusive properties he deemed necessary. His faith lay in the gradual spread of enlightenment through universal education improving the competence of the *entire* citizenry, enabling better deliberation and voting – not in bypassing the citizenry via elite speculation.

  **The Pull of Tensions:** Condorcet's own tensions pull him *away* from markets. His rationalism and belief in mathematical social science might make him *curious* about markets as an information aggregation tool in *limited, purely empirical domains*. However, his deeper commitments to deliberation, the discoverability of moral/political truth through inclusive reason, and above all, his radical egalitarianism, would decisively outweigh this curiosity when applied to sovereign political choices. He would see futarchy as a dangerous techno-plutocratic shortcut that abandoned the hard, necessary work of universal education, broad-based deliberation, and egalitarian political participation – the true paths to enlightened collective decision-making. His verdict would be: an ingenious but fatally flawed mechanism, substituting the wisdom of the wealthy speculator for the enlightened reason of the equal citizen.
