  Hmm, the user clearly knows their stuff - mentioning Sober, Simpson's paradox, and the kin selection counterargument shows they've done deep reading. This isn't a beginner asking for definitions. Their frustration with superficial debates ("not just trading taglines") suggests they've hit walls in understanding the core disagreement. 

