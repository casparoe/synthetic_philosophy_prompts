  Right, I need to show how interventionism handles this. The key is recognizing that mental properties are realized by multiple physical substrates—multiply realizable. So we don't fix a specific realizer; we consider interventions across possible realizers. For example, to test if pain causes withdrawal, we'd compare scenarios where pain is present (via different neural realizers) versus absent, while holding fixed other factors. This gives us a counterfactual dependence that's robust across realizers.

