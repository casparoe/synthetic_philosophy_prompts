  Now for the stress-test: could this make arbitrary properties causal? Say, the Big Dipper's shape causing my coffee to get cold? No—because that shape isn't a difference-maker. Changing it (via moving stars) doesn't change my coffee temperature; there's no invariant relationship. Mental properties, meanwhile, are projectable: they support counterfactuals across contexts (e.g., pain causes avoidance in humans, animals, aliens). The physical realizers share causal relevance via their shared higher-order property.

  Ah, and the user needs this distinction crystal clear. So: mental properties are causally relevant because they figure in invariant, generalizable patterns (pain → avoidance), while gerrymandered properties don't. The interventionist framework naturally captures this via robustness across realizers and contexts. Kim's mistake was assuming causation requires "sufficient cause" competition; interventionism shows causation is about difference-making in a network of variables.

