  We are going to create a tier list of objections to van Fraassen's Reflection Principle. The principle states that an agent's current credence in A, conditional on the fact that at future time t their credence in A will be r, should be r. The tiers are:

  - S: Basically fatal to the principle as a rationality constraint (even with caveats).
  - A: Serious challenge that requires significant modification or restriction of the principle.
  - B: Moderate challenge that can be addressed with reasonable caveats, but still points to important limitations.
  - C: Minor challenge that can be easily handled by standard defenses of the principle.
  - D: Not a real threat; the objection misses the mark or is based on a misunderstanding.

  We consider the following objections:

  1. **Amnesia/Memory Loss**: Cases where the agent expects to lose some memories by time t, so the future self is less informed in some respects. (Example: You know you will forget some evidence by tomorrow, so your future credence is based on less information.)

  2. **Anticipated Future Irrationality**: Cases where the agent expects to be irrational at t (e.g., due to drugs, emotional distress, or manipulation). (Example: You know you will be given a drug that makes you believe A with high credence regardless of evidence.)

  3. **Christensen's "Clever Bookie"**: Christensen argues that the Dutch book argument for Reflection is flawed because it assumes the agent can be exploited by a bookie who knows the agent's future credences, but this knowledge might not be available to the bookie without the agent's cooperation, and the agent might not be required to commit to future betting behavior.

  4. **Self-Locating Beliefs (Arntzenius/Sleeping Beauty-style)**: Cases involving self-locating beliefs where the future self may have different information due to changes in location in time or possibility space. (Example: In Sleeping Beauty, upon awakening, Beauty's credence in the coin being heads is 1/2 on Monday but becomes 1/3 on Tuesday if it's tails and she is awakened again, but she doesn't know what day it is.)

  5. **Misleading Evidence**: Cases where the agent expects to receive evidence that is misleading. (Example: You know that at t you will see evidence that strongly suggests A, but you also know that this evidence is actually misleading. However, at t, you will rationally update to believe A with high credence.)

  We also note that defenders of Reflection (like van Fraassen) typically restrict the principle to cases where the agent expects to be rational and to have more information at t. So, the principle is often stated with caveats: the future credence is the one you would have if you were rational and had acquired new evidence.

  Now, we assign tiers:

  - **Amnesia/Memory Loss**: This is a classic counterexample. If you expect to forget, then your future self is not more informed. So, you shouldn't defer. This is widely accepted as a legitimate limitation. However, it can be handled by restricting Reflection to cases where the agent expects to have at least the same information. So, not fatal, but requires a caveat. Tier: **B** (moderate challenge, addressed by caveats about information).

  - **Anticipated Future Irrationality**: Similarly, if you expect to be irrational, you shouldn't defer. The principle is intended for rational agents. So, the caveat that the future self must be rational is standard. This is a counterexample only against an unrestricted version. Tier: **C** (minor, easily handled by caveat).

  - **Christensen's "Clever Bookie"**: This attacks the Dutch book justification for Reflection, not the principle itself. It argues that the Dutch book argument for Reflection is not compelling because the bookie would need to know the agent's future credences, which might not be feasible. But note: the principle might still be justified on other grounds (e.g., epistemic deference). Also, the principle itself might be defended independently. So, this is a challenge to the justification, not necessarily the principle. However, if the Dutch book is the main argument, this could be serious. But many philosophers accept Reflection without Dutch books. Tier: **B** (moderate, as it undermines a common justification but not necessarily the principle).

  - **Self-Locating Beliefs**: These cases are tricky. In self-locating beliefs, the future self may have different information that is not just about the world but about their own location. Reflection might seem to fail because the future self has a different perspective. However, some argue that with careful handling of the indexical information, Reflection can be preserved. This is an ongoing debate. Tier: **A** (serious challenge, requiring significant modification or a new account of how to apply Reflection in such cases).

  - **Misleading Evidence**: This is a standard example. If you know that the evidence you will get is misleading, then even if you update rationally at t, you don't want to set your current credence to that future value. However, note that conditional on the future credence being r, you might have to set your current credence to r. But if you know the evidence is misleading, then you also know that the future credence is going to be wrong. This is similar to the amnesia case in that the future self is not better informed in every way. The standard move is to restrict Reflection to cases where the agent does not have information that undermines the future evidence. But this is tricky because the agent might have such information. This is a well-known challenge. Tier: **A** (serious, because it might be common to have meta-information about the quality of future evidence).

  However, note that in the misleading evidence case, the agent's current credence conditional on the future credence being r might still be required to be r. The principle doesn't require that you set your current credence to r unconditionally, but only conditional on the future credence being r. So, if you are certain that the future credence will be r, then your current credence must be r. But if you know the evidence is misleading, you might not be certain about what the future credence will be? Actually, the objection is set up by assuming that you are certain that your future credence will be r. So, even if you know the evidence is misleading, if you are certain that the future credence will be r, then by Reflection you must have current credence r. But that seems wrong because you know the future credence is based on misleading evidence. This is a serious problem. Some responses: the principle only applies when you have no such meta-information, or that the future self will have the same total evidence (which they don't in this case because you now have extra evidence about the misleading nature). So, again, caveats about total evidence. But it's not straightforward. This is a classic objection (e.g., by Talbott). Tier: **A**.

