  I'm working on a piece about the "Gödel proves AI can never really think" argument that resurfaces every time a flashy new model ships, and I keep seeing writers cite Lucas and Penrose in the same breath like they made the same move. A logician friend of mine says that's lazy -- that Penrose's version in Shadows of the Mind was built specifically to patch a hole everyone found in Lucas's original 1961 argument (something about Lucas needing to just assume his own consistency, which he's not really entitled to), and that Penrose tries to close that gap by arguing about systems that are "knowably sound" rather than merely consistent. Can you actually unpack that for me: what was the hole in Lucas's version, how is the knowably-sound move suppose to fix it, and whats your honest take -- does it actually work, or does Penrose just relocate the same problem one level up? Skip the 30-second "Godel means machines have limits" version, I've already got that from three different explainer articles.
