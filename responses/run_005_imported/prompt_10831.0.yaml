answer: |-
  You've hit on two of the most debated and significant tensions in Moore's *Principia Ethica*. Your reading is astute, and these passages genuinely pose interpretive challenges. Let's break down each issue:

  ### 1. The "Negligible" Value of Unperceived Beauty: Retreat or Clarification?

  *   **The Apparent Tension:** In §50, Moore forcefully argues *against* Sidgwick that the *mere existence* of beauty has intrinsic value, independent of any consciousness perceiving it. The "two worlds" thought experiment seems designed to elicit a strong intuitive judgment favoring the beautiful world *as such*. In §113, however, he calls this value "so small as to be negligible" compared to the value of *consciousness* of beauty, siding *with* Sidgwick's practical conclusion.
  *   **Interpretation: Clarification, Not Retreat (Mostly):** Moore likely sees this as a clarification rather than a contradiction. Here's why:
      *   **§50's Primary Aim:** The point of §50 was not primarily to establish the *magnitude* of unperceived beauty's value, but to establish its *existence* and *independence* from perception. He was refuting the claim (attributed to Sidgwick) that beauty's value is *entirely dependent* on being perceived. The thought experiment succeeds if you intuit *any* preference for the beautiful world over the heap of filth, however slight. It establishes a conceptual point about intrinsic value residing in the object itself, not just the subject's state.
      *   **§113's Focus on Hierarchy:** In §113, Moore shifts focus to *comparing* different intrinsic goods and establishing a *hierarchy*. He readily concedes that while unperceived beauty *has* value (as established in §50), its value is utterly dwarfed by the vastly superior value found in the *conscious appreciation* of beauty (and personal affection). The "negligible" comment pertains to this comparative assessment within the overall ideal.
      *   **Consistency:** Moore can consistently hold both positions: 1) Unperceived beauty has *some* intrinsic value (a metaphysical point about value bearers). 2) This value is *miniscule* compared to the intrinsic value found in conscious experiences involving beauty (an axiological point about value magnitude). The §50 experiment was never meant to prove that unperceived beauty is *highly* valuable; it was meant to prove it has value *at all*.
  *   **Nuance:** While not a full retreat, calling it "negligible" *does* significantly downplay the force of the §50 example for practical ethics. If its value is truly negligible, it becomes irrelevant for ethical deliberation about action. The thought experiment feels more profound than the later concession allows, suggesting Moore might have slightly moderated his view on its *practical significance* while maintaining the *metaphysical* point.

  ### 2. The Leap to "Sole Criterion": The Hidden Premise of Ideal Utilitarianism

  Your second point is spot-on. The jump from "These are the highest goods" to "Therefore, they are the *sole* ultimate end and justification for *all* duty and social progress" is dramatic and requires justification Moore doesn't explicitly provide *in this passage*. **The hidden premise doing the heavy lifting is indeed his commitment to Ideal Utilitarianism, established earlier in the book.**

  *   **The Core Argument (Reconstructed):**
      1.  **Definition of "Right":** Earlier in *Principia Ethica* (especially Chapters I-V), Moore argues that "right" or "duty" is defined solely in terms of what produces the *greatest possible amount of intrinsic good in the Universe*. This is his Ideal Utilitarianism: right action maximizes intrinsic value (which he distinguishes sharply from pleasure or desire-satisfaction).
      2.  **Identification of the Highest Goods:** Through the method of isolation (§113), Moore identifies "the pleasures of human intercourse" (personal affection) and "the enjoyment of beautiful objects" (aesthetic appreciation) as the things possessing the *greatest* intrinsic value – "by far the most valuable things... [and] by far the greatest goods we can imagine."
      3.  **The Inescapable Conclusion:** If:
          *   Right action = maximizing intrinsic good (Premise 1, established earlier).
          *   The greatest intrinsic goods are personal affection and aesthetic appreciation (Premise 2, argued via isolation here).
          *   Then: Right action must be action that maximizes *these specific goods* (personal affection and aesthetic appreciation).
          *   Therefore: *All* duties (public or private), *all* virtues (conceived as dispositions leading to right action), and *all* social progress must be justified *only* insofar as they are effective means to producing more instances of personal affection and aesthetic enjoyment. They form the "rational ultimate end" and "sole criterion."

  *   **Why it Feels Like a Leap in §113:**
      *   **Assumed Framework:** Moore doesn't re-argue the Ideal Utilitarian framework here because he assumes it's already established. He's applying it to the specific goods he's just identified as supreme.
      *   **Focus on the Goods:** The passage's primary focus is on *identifying* the highest goods via isolation, not on re-deriving the ethical framework that uses them. He takes the framework for granted.
      *   **The "Organic Unity" Gesture:** While crucial to Moore's *analysis* of *why* affection and appreciation are so valuable (he thinks their value isn't merely the sum of their parts), the concept of organic unity *itself* doesn't directly argue for them being the *sole* end. That argument relies entirely on the combination of their supreme value status *plus* the Ideal Utilitarian premise that right action maximizes good. The organic unity analysis comes *after* the leap, to explain *why* these things have such supreme value.
      *   **Intuition's Role:** While intuition is used to identify the *goods* via isolation, the *deduction* that they become the sole end relies on the logical structure of Ideal Utilitarianism. The intuition is about *what* is good; the framework dictates *how* that good determines right action.

  **In Conclusion:**

  1.  **On Unperceived Beauty:** Moore is clarifying the *relative insignificance* of its value compared to conscious appreciation, not retracting the §50 claim that it possesses *some* intrinsic value. The §50 experiment served its purpose by establishing the *existence* of that value, not its magnitude relative to other goods.
  2.  **On the Sole Criterion:** The leap from "highest goods" to "sole end of action and criterion of progress" is not argued *within* §113 itself. It relies **entirely** on the prior commitment to **Ideal Utilitarianism** (right action maximizes intrinsic good), established earlier in the book. Once he identifies affection and appreciation as the supreme goods *and* holds that right action maximizes good, the conclusion follows necessarily. The gesture towards "organic unities" explains *why* they are so valuable, not *why* supreme value entails being the sole end – that latter step is pure Ideal Utilitarian logic. It's an assertion *within the framework*, not an argument *for* the framework's application to these goods.

  Your reading group is grappling with central tensions in Moore. The §50/§113 tension highlights the difference between establishing *existence* of value and assessing its *comparative magnitude*. The "sole criterion" leap perfectly illustrates how Moore's identification of the good, combined with his consequentialism, leads to strikingly strong (and, to many, controversial) ethical conclusions. The "hidden premise" is absolutely key – it's the engine of his whole system.
