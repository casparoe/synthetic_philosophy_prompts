  *Pacing mentally*... For the concrete case: let's use "two men at a sermon." That's novelistic gold—immediately humanizes the abstraction. The Jesuit will argue God knew counterfactually how each would respond; the friar will say that knowledge needs grounding. Then flip to the premotion critique: "Isn't God forcing the convert?" 

  *Checking theological notes*... Must avoid anachronisms. The Jesuit wouldn't say "possible worlds" (that's Leibniz), but "hypothetical orders of things." Friar wouldn't say "determinism" but "fatal necessity." 

  Biggest risk: letting the Dominican "win" the scene. The historical debate *was* unresolved. So the Jesuit's answer to the truthmaker problem should be earnest but not conclusive—Molina really did struggle here. And the friar's premotion defense should feel equally strained. 

  *Structuring the dialogue*... 
