answer: |-
  Based solely on Ramsey's explicit arguments in his 1928 paper "A Mathematical Theory of Saving," **Ramsey would almost certainly side with Stern**, and here's why, grounded directly in his text and reasoning:

  1.  **Ramsey's Explicit Condemnation of "Pure Time Preference":**
      *   In Section II of his paper, Ramsey states unequivoc: **"We do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."**
      *   He reiterates this later: **"It is assumed that we do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible..."**
      *   **Key Takeaway:** Ramsey viewed discounting well-being *solely because it occurs in the future* as fundamentally unethical. This is the core of "pure time preference" (δ in the Ramsey equation).

  2.  **Ramsey's *Only* Permissible Reasons for Discounting:**
      *   Ramsey allowed for two components in the discount rate *other* than pure time preference:
          *   **Risk of Extinction/Catastrophe (ρ):** "The rate of discounting future utilities must... be equal to the rate at which the probability of extinction is increasing." He accepted discounting future utility if there was a non-zero chance humanity wouldn't exist to enjoy it.
          *   **Diminishing Marginal Utility of Consumption (η·g):** This reflects that if future generations are expected to be richer (higher consumption `g`), the marginal utility of an additional unit of consumption to them is lower (due to the elasticity `η`). Discounting here accounts for the *relative scarcity* of consumption now vs. later, not the mere passage of time.
      *   **Key Takeaway:** For Ramsey, the discount rate (`r`) should be: `r = ρ + η·g`. Crucially, **the pure time preference component (δ) is ZERO in his ethical framework.** Any discounting of future utility must be justified *only* by extinction risk or the expectation of richer future generations.

  3.  **Mapping Ramsey to Stern vs. Nordhaus:**
      *   **Stern's Approach (Stern Review):** Stern explicitly adopts Ramsey's ethical stance. He sets the pure rate of time preference (`δ`) to **0.1%**, arguing this reflects *only* the exogenous risk of extinction (e.g., asteroid impact), not a devaluation of future well-being. His low discount rate (around 1.4% overall) heavily weights future climate damages.
      *   **Nordhaus's Approach (DICE model):** Nordhaus derives his discount rate primarily from *observed market behavior*. Market interest rates reveal how people *actually* trade off present vs. future consumption, incorporating revealed preferences for consumption now (high `δ`). His starting discount rate is around **6%**, heavily discounting future damages. This high rate reflects *both* pure time preference (`δ` ≈ 3%) *and* the other components.
      *   **The Crux:** Nordhaus's approach *embeds* a high rate of pure time preference (`δ` > 0) because that's what markets reveal. This is **precisely the component Ramsey declared "ethically indefensible."**

  4.  **Why Ramsey Would Reject Nordhaus's Market-Based Rate:**
      *   Ramsey's condemnation of pure time preference wasn't conditional on the application; it was a fundamental ethical principle about intergenerational justice. He believed discounting future utility *just because it's future* was wrong, full stop.
      *   Market interest rates reflect the *current generation's* impatience, myopia, and self-interest – factors Ramsey explicitly rejected as ethically valid grounds for discounting the well-being of *future* generations facing climate catastrophe.
      *   Using market rates for climate policy effectively imposes the preferences (including pure time preference) of the present on the future, violating Ramsey's core ethical injunction.

  5.  **Why Ramsey Would Align with Stern:**
      *   Stern's near-zero `δ` directly implements Ramsey's ethical principle against pure time preference.
      *   Stern's inclusion of a small `ρ` for extinction risk aligns perfectly with Ramsey's only acceptable justification for discounting future *utility* (as opposed to future *consumption*, handled by `η·g`).
      *   While Ramsey focused on optimal saving for future generations *generally*, the structure of the climate problem – where current actions impose large, long-term costs on distant generations – is precisely the type of intergenerational ethical dilemma his framework was designed to address. Stern applies Ramsey's framework faithfully to this new context.

  **Conclusion:**

  Ramsey's own words leave little room for doubt. His vehement rejection of "pure time preference" (`δ > 0`) as "ethically indefensible" directly contradicts the foundation of Nordhaus's market-based discount rate, which inherently incorporates a significant `δ`. Stern's approach, by setting `δ ≈ 0` and justifying discounting only via extinction risk (`ρ`) and diminishing marginal utility of consumption (`η·g`), is a direct application of Ramsey's ethical and mathematical framework. **Therefore, based solely on his 1928 arguments, Ramsey would be firmly in Stern's camp in the discount rate debate.** He would see Nordhaus's reliance on market-observed pure time preference as committing the very "ethically indefensible" blunder he condemned decades before the climate crisis emerged. Your instinct to trace this back to Ramsey's core ethical principle about time is spot on – it remains the decisive factor.
