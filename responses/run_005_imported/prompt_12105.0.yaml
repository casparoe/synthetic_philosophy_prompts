  First, I need to reconstruct Ramsey's original position from his 1928 paper. Three key points stand out: 1) His ethical rejection of pure time preference ("discounting later enjoyments merely because they are later"), 2) Acceptance of discounting only for extinction risk or changing utility possibilities, 3) The "blunder" comment about discounting future utilities. These are philosophical commitments, not mathematical conveniences.

