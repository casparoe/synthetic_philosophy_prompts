  Possible positions to cover: Strong Separatism (complete separation), Contextualism (biography informs interpretation), and Critical Theory (all work reflects power structures). Each has strengths and weaknesses. For example, Strong Separatism avoids genetic fallacy but may ignore how personal flaws influence work subtly. Contextualism might overemphasize biography.

