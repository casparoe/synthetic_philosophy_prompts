prompt: |-
  I'm teaching our grad decision theory seminar this term, and last week we spent a whole session on Frank Ramsey's 1926 paper, where he uses these "ethically neutral" propositions plus a no-sure-loss coherence argument to derive both degrees of belief and utility at the same time, without assuming either one going in — basically the ancestor of every Dutch-book and money-pump argument for expected utility maximization thats come since. One of my students, who's also in an AI safety reading group, pointed out that this exact style of argument has been revived lately to claim that any sufficiently capable AI system will end up acting like an expected utility maximizer with a fixed goal, on pain of getting money-pumped otherwise — and that conclusion is now doing a ton of work in arguments about instrumental convergence and why advanced systems might resist correction or shutdown. Got me wondering what Ramsey, of all people, would've made of his own machinery being stretched that far, given he died in 1930 and couldn't have pictured any of this.

  So here's what I want: reconstruct Ramsey's likely reaction, based on what we actually know of his views on probability, his pragmatism, and how general vs. narrow he seems to have intended the coherence argument to be. I'm mainly curious whether he'd side with people who treat coherence theorems as revealing something deep about rational agency as such (so it applies just as well to an AI or a corporation as to a person), or whether his own setup — tied as it was to the actual betting behavior of an idealized human agent — gives him principled grounds to resist that jump. Don't just say "he'd probably find it fascinating" and leave it there; actually dig into where the modern argument would strain his assumptions, e.g. the completeness of preferences, what work the neutral proposition is really doing, and whether his coherence requirement was ever meant to bind an agent across time or just at a single moment.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a grad seminar on decision theory and covered Ramsey's 1926 paper. The key point is Ramsey's use of ethically neutral propositions and coherence arguments to derive degrees of belief and utility without prior assumptions. A student connected this to modern AI safety arguments where similar coherence theorems are used to claim that advanced AIs must become expected utility maximizers to avoid money-pumps. The user wants to know how Ramsey would react to this extension of his ideas.

  First, I need to recall Ramsey's original framework. His ethically neutral proposition is crucial—it's an event with probability 0.5 that the agent doesn't care about intrinsically. This allows separating beliefs from utilities. The coherence condition prevents sure losses in betting scenarios. But Ramsey's context was human psychology, grounded in observable behavior. He was a pragmatist, so his arguments were about operationalizing rationality in terms of choices.

  Now, the modern AI argument applies coherence to any agent, including AIs, suggesting that rationality demands fixed utility functions across time. But Ramsey's conditions assumed completeness of preferences and static consistency. He didn't address temporal consistency or preference changes. His "at a time" stipulation is important here. For humans, preferences evolve, and Ramsey acknowledged that. Applying his theorem to an AI that must never change its goals might conflict with his view of rationality as dynamic.

  Also, the ethically neutral proposition in AI isn't straightforward. Humans have events they're indifferent to, but an AI's utility function might not allow such indifference. If the AI's utility is unbounded, every outcome might have value, making neutrality impossible. This could break the applicability of Ramsey's method to AIs.

  The user mentioned instrumental convergence in AI—where AIs might resist shutdown to achieve their goals. Ramsey might argue that forcing an AI to have fixed goals ignores the adaptability he associated with rationality. He might see the modern use as overextending his coherence argument, ignoring the psychological basis he intended.

  Another angle is Ramsey's pragmatism. He focused on defining beliefs through actions. For AI, actions are programmable, but the "behavior" is different. Ramsey might question if AI choices reflect genuine beliefs or just programmed responses. The coherence argument might hold mathematically, but without the psychological component, it loses its original intent.

  The user also wants to know if Ramsey would see coherence as binding across time. His paper seems to address a single moment. Temporal consistency was later added by Savage and others. Ramsey likely didn't intend his argument to enforce unchanging preferences, as humans adapt. Thus, applying it to AI requiring persistent goals might be a stretch.

  In summary, Ramsey would recognize the formal similarity but criticize the removal of human psychology. He'd point out the lack of ethically neutral propositions in AI, the static nature of his coherence condition, and the importance of adaptability. He might agree that coherence prevents money-pumps but reject that it mandates fixed goals over time, especially for non-human agents.
answer: |-
  Based on Ramsey's writings, philosophical commitments, and the specific structure of his 1926 argument, his reaction to its use in modern AI safety arguments for fixed-goal EU maximization would likely be a mix of **intrigued recognition, deep skepticism about the scope of application, and specific critiques of the assumptions stretched beyond his original intent.** He would likely *not* fully endorse the leap to binding "rational agency as such" for AIs or across time in the way modern arguments often do.

  Here's a reconstruction of his likely reaction, point by point:

  1.  **The Core Insight & Intrigue:**
      *   Ramsey would immediately recognize the formal structure of the argument ("no sure loss" via Dutch books/money pumps deriving beliefs and utilities simultaneously from preferences) as his own invention. He would find it fascinating and intellectually satisfying that this elegant logical structure, designed to ground subjective probability and utility in observable choice behavior, retains its power nearly a century later and is applied to novel entities like AI.
      *   He might appreciate the argument's continued relevance in demonstrating the *formal necessity* of EU maximization *for coherence* within a preference-based system, seeing it as a validation of his fundamental insight.

  2.  **The Crucial Skepticism: Grounding in Human Psychology & Pragmatism:**
      *   **The Fundamental Sticking Point:** Ramsey's entire project was **profoundly psychological and pragmatic.** His 1926 paper wasn't an abstract treatise on "agency"; it was titled "*Truth and Probability*" and aimed to provide a behaviorist/foundational account of *human* partial belief and valuation. Key quotes:
          *   "The subject of our inquiry is the logic of partial belief..." (opening sentence).
          *   "I propose to take as a basis a general psychological theory..." (referring to belief/desire psychology).
          *   The argument relies on *actual or hypothetical choices* made by a *human agent*.
      *   **Reaction to AI Application:** Ramsey would likely argue that applying his coherence condition directly to an AI fundamentally misunderstands its grounding. His argument operationalizes *human* rationality through *human* betting behavior. An AI's "preferences" are not discovered through choice behavior reflecting internal psychological states (beliefs/desires); they are *programmed* or *emerge* from complex optimization processes. The coherence argument, for Ramsey, revealed the *structure* of human rational psychology, not a Platonic ideal binding *all* possible optimizing systems. He would likely see the AI application as an illegitimate reification of his formal apparatus, stripping it of its essential connection to *human* cognition and valuation. He might ask: "What does 'preference' even *mean* for this machine, beyond its output? Is it *experiencing* value or just computing outputs?"

  3.  **Specific Strains on the Original Framework:**
      *   **The Ethically Neutral Proposition (ENP):**
          *   **Ramsey's Use:** The ENP (an event with probability 0.5 that the agent intrinsically *doesn't care about*) is absolutely critical. It provides the necessary leverage to separate belief (probability) from utility by identifying a point of pure belief measurement uncontaminated by value. Ramsey assumed such propositions *existed* and were *identifiable* within the context of human concerns ("Is this penny heads?").
          *   **Strain in AI:** For an AI with a potentially vast, complex, or unbounded utility function, finding a genuinely "ethically neutral" proposition might be impossible or nonsensical. *Every* outcome might have *some* utility implication (positive, negative, or neutral relative to a complex goal structure). Does "neutral" mean the AI is literally indifferent, or just that the outcome doesn't change the *expected* achievement of its terminal goals? If the latter, how is it identified independently? Ramsey would likely argue that the *psychological reality* of indifference/having "no skin in the game" is essential for the ENP to do its work, a condition unlikely to hold for a superintelligent AI optimizing a fixed goal. Its "neutrality" would be suspect.
      *   **Completeness of Preferences:**
          *   **Ramsey's Use:** He assumed an agent has complete, transitive preferences over *all* possible gambles/options presented. This is necessary for the derivation to work. For a human, this is an idealization, but one grounded in the *capacity* to make choices when forced.
          *   **Strain in AI:** While an AI *can* be programmed to have complete preferences, Ramsey might question whether this completeness reflects a deep structure of rational agency or is merely a technical requirement for the theorem. More importantly, for a learning or self-modifying AI, the *scope* of "all possible gambles" becomes astronomically vast and potentially undefined. Ramsey's argument assumed a manageable, contextually relevant set of options for a human decider.
      *   **Coherence Across Time vs. At a Time:**
          *   **Ramsey's Use:** His argument is fundamentally **synchronic.** It establishes the coherence conditions (EU maximization) that *must* hold for an agent's preferences *at a single moment in time* to avoid a sure loss *on bets offered at that moment*. He explicitly allows for preference *change* over time as a matter of course for humans:
              *   "The theory I propose to adopt is that we act in the way we think most likely to realize the objects of our desires... Our theory... regards... the *present* expectations of future events."
              *   He didn't derive a requirement for *diachronic* coherence (consistency of preferences over time).
          *   **Strain in AI (Instrumental Convergence/Resistance):** Modern arguments use coherence (avoiding money pumps) to demand *diachronic* stability of the utility function. An AI must resist changing its goal or being shut down *over time* to avoid being exploited in sequences of trades (money pumps). **Ramsey would see this as a massive, unjustified extension.** His argument binds choices *now*; it doesn't bind the agent *tomorrow* to have the same preferences it has today. For Ramsey, a human who changes their mind tomorrow isn't incoherent *today*; they are simply different. Applying the synchronic coherence condition to enforce diachronic rigidity would likely strike him as a category error or a misunderstanding of his theorem's scope. Humans rationally *do* update goals and valuations based on new experiences – something his framework accommodates by being synchronic.
      *   **The Nature of "Rational Agency":**
          *   Ramsey would likely resist the notion that his coherence argument reveals a universal, timeless structure of "rational agency as such." His argument was a **pragmatic definition** of rational belief and desire *for humans*, grounded in their choice behavior. It was a way to *measure* these psychological quantities, not a metaphysical claim about the necessary structure of all possible minds or optimization processes. He was interested in the logic of *our* partial beliefs, not the logic of *any conceivable* partial belief system. Applying it to corporations or AIs might strike him as a useful formal analogy but not a deep revelation about ontology.

  4.  **Likely Conclusion:**
      Ramsey would be fascinated by the formal persistence of his argument but deeply skeptical of its application to justify fixed-goal EU maximization in AI, particularly the diachronic stability required to avoid shutdown resistance. He would likely argue:

      *   His theorem defines coherence *for human psychology at a point in time*, not for abstract agency across time.
      *   The reliance on the Ethically Neutral Proposition becomes highly problematic or meaningless when applied to an AI with a potentially all-encompassing utility function.
      *   The demand for fixed goals derived from synchronic coherence misapplies his argument and ignores the inherent (and rational) capacity for human preference change that his framework acknowledged.
      *   While the *mathematical structure* of avoiding sure losses holds, its interpretation as binding *all* rational agents (especially non-human, non-psychological ones) to fixed goals over time is an overextension that loses touch with the pragmatic, psychological foundation of his work.

  He might conclude: "I showed how a coherent *human* must structure their beliefs and desires *now*. You are using this to argue a *machine* must never change its desires *forever*. That seems a rather large, and possibly unwarranted, leap from my modest psychological foundations." He would see the modern argument as technically clever but philosophically overreaching, conflating a powerful *measurement technique* for human rationality with a universal *prescription* for agent design.
