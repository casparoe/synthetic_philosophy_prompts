  We are evaluating four moves in the debate between Jonah and Mara about Kim's functional reduction and its implications for non-reductive physicalism.

  The debate moves:
  1. Jonah_1: Functional reduction solves the exclusion problem by identifying mental properties with their realizers in each token case, allowing multiple realizability at the species level and avoiding causal competition.
  2. Mara_1: This is a surrender of non-reductive physicalism because it reduces to species-specific identities and abandons the idea that higher-level properties (like beliefs) are causal kinds that generalize across diverse realizers.
  3. Jonah_2: If a "kind" is realized by arbitrarily disjunctive physical states with nothing in common, then it was never a single causally unified property, so it's fine to reject it as a causal kind.
  4. Mara_2: Conceding to the causal exclusion argument means letting an abstract metaphysical argument override the practice of cognitive science, which quantifies over these higher-level kinds (belief, pain, etc.) and treats them as causally efficacious.

  Scoring each move on a scale from -2 (clearly mistaken) to 2 (clearly right), and then explaining the scores.

  Let's break down each move:

  **Jonah_1 (score: 1)**
  - Merit: Jonah correctly presents Kim's functional reduction as a solution to the causal exclusion problem. By identifying mental properties with their realizers in each token instance, there is no overdetermination because the mental property just is the physical realizer. This preserves multiple realizability at a higher level (e.g., pain in humans vs. octopuses) while avoiding epiphenomenalism at the token level. This move is logically consistent within Kim's framework and addresses the exclusion worry.
  - Why not higher? The score is 1 (mostly right) because while it solves the exclusion problem within Kim's framework, it may be seen as a form of reduction (which is what Mara objects to). It doesn't address the deeper concerns of non-reductive physicalists about the autonomy of higher-level sciences.

  **Mara_1 (score: 2)**
  - Merit: Mara correctly points out that Kim's solution effectively abandons non-reductive physicalism by reducing mental properties to their realizers in each instance. Non-reductive physicalism, as defended by Fodor, emphasizes that psychological states are multiply realizable and that the generalizations of psychology (e.g., "beliefs and desires cause actions") are not reducible to physical laws because they hold across diverse physical realizations. By reducing to species-specific identities, Kim is indeed giving up on the idea that the mental property itself (e.g., pain) is a genuine causal kind that unifies these diverse realizations. Mara's point that the higher-level generalization then becomes a mere summary of different causal kinds (the realizers) and not a causal kind in itself is a strong critique from the non-reductive perspective.
  - Why 2? This move accurately captures the core tension: functional reduction, by making the mental property identical to the realizer in each case, undermines the non-reductive claim that mental properties are distinct and irreducible causal kinds.

  **Jonah_2 (score: -1)**
  - Merit: Jonah is right that, according to Kim, if a property is multiply realized by physical states that have nothing in common (i.e., are wildly disjunctive), then it cannot be a single causal kind because causal powers are determined by the physical properties. Thus, the property in question (like pain) would not be a natural kind and might not be projectible in causal explanations. This is Kim's view, and it is consistent with his reductionist stance.
  - Why negative? The score is -1 because while it is consistent with Kim's argument, it is a controversial bullet to bite. It dismisses the possibility that higher-level properties can be causally relevant despite multiple realizability. Moreover, it ignores the fact that in the special sciences (like psychology), we do have successful causal generalizations that are not reducible to a single physical kind. Jonah's move here is an assertion of Kim's position but does not engage with the counterexamples from scientific practice.

  **Mara_2 (score: 1)**
  - Merit: Mara's point that we should not let an abstract metaphysical argument (like causal exclusion) override the successful practice of cognitive science is important. Cognitive science quantifies over mental states (like beliefs and desires) and attributes causal powers to them. If Kim's argument implies that these are not real causal kinds, then it challenges the legitimacy of psychological explanations. This is a form of the "overreach" objection: metaphysics should not dictate to science. Additionally, there are accounts (e.g., by Dennett or Fodor) that defend the causal efficacy of higher-level properties without reduction.
  - Why not higher? The score is 1 because while the objection is strong, it doesn't directly refute Kim's argument. Kim would likely respond that the special sciences are dealing with patterns and generalizations that are useful but not fundamental, and that the causal work is still done at the physical level. Mara's point is valid but doesn't resolve the metaphysical challenge; it only highlights a conflict between metaphysics and scientific practice.

  **Overall Evaluation and What's Missing**

  Both debaters are missing some nuances:

  1. **Alternative Accounts of Causation**: Neither mentions alternative approaches to causation that might avoid the exclusion problem, such as interventionist accounts (Woodward) or causal pluralism. These might allow higher-level properties to be causally relevant without being identical to physical realizers.

  2. **Levels of Explanation**: They don't discuss the possibility that causal exclusion might be avoided by distinguishing between different levels of explanation. For instance, even if the physical realizer does the causal work, the mental property might still be causally relevant in virtue of playing a role in a higher-level causal pattern.

  3. **Non-Reductive Alternatives**: There are non-reductive physicalist responses to Kim that do not require functional reduction, such as emergentism (though Kim rejects it) or the idea of "realization" that is not identity (e.g., Shoemaker's subset view of realization). These might preserve the autonomy of the mental without falling to exclusion.

  4. **The Status of Disjunctive Kinds**: The debate hinges on whether disjunctive properties can be causal kinds. Jonah (following Kim) says no, but Mara (following Fodor) says yes in the context of special sciences. This is a deep issue that requires more analysis.

  5. **Kim's Dilemma for Non-Reductive Physicalism**: Kim argues that non-reductive physicalism is unstable because it either leads to epiphenomenalism (if mental properties are not reduced) or collapses into reductionism (if it does reduce). The debate between Jonah and Mara is essentially about whether functional reduction is a genuine non-reductive position or a form of reductionism.

