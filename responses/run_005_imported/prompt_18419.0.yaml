answer: |-
  ### Analysis of Lewis's Triviality Result and Gibbard's Collapse Argument

  David Lewis's triviality result (1976) and Allan Gibbard's Sly Pete argument (1981) both challenge theories of indicative conditionals but target distinct conceptions and rely on different mechanisms. Below, I clarify their respective aims, the conceptions they target, assess whether their morals can be coherently separated, and defend a view on which poses the greater obstacle to robust non-material conditional propositions.

  ---

  ### **1. What Each Result Purports to Establish**
  #### **Lewis's Triviality Result**
  - **Core Claim**: Lewis demonstrates that if the **Equation**—i.e., \( P(A \to B) = P(B|A) \) for all propositions \( A \) and \( B \)—holds for a non-trivial probability function \( P \), it leads to logical contradictions or collapses into triviality (e.g., \( P(B|A) = P(B) \), rendering conditioning irrelevant). 
  - **Triviality Defined**: A "non-trivial" probability function allows \( P(A) > 0 \) and dependencies between \( A \) and \( B \). Lewis shows that under the Equation, such functions imply that \( A \) and \( B \) must be probabilistically independent, reducing conditionals to trivial cases.
  - **Target Conception**: Lewis directly targets **truth-conditional probabilistic theories** (e.g., Robert Stalnaker's) where indicative conditionals express *propositions* with truth values. His proof assumes conditionals have probabilities defined by standard Kolmogorov axioms, concluding they cannot simultaneously satisfy the Equation and avoid absurdity.

  #### **Gibbard's Collapse Argument**
  - **Core Claim**: Gibbard argues that if indicative conditionals satisfy **Import-Export (IE)**—i.e., \( A \to (B \to C) \) is logically equivalent to \( (A \land B) \to C \)—alongside intuitive logical principles (e.g., Modus Ponens, truth-functionality for connectives), they must collapse into the **material conditional** (\( A \supset B \equiv \neg A \lor B \)).
  - **Mechanism**: The Sly Pete case (a poker scenario where a conditional's truth value is unknowable due to hidden information) shows that conditionals cannot express robust propositions without violating IE or intuitive logic. If conditionals have truth values, IE forces them to behave like \( A \supset B \).
  - **Target Conception**: Gibbard targets **truth-conditional theories** that preserve classical logic. His argument undermines any view where conditionals express non-material propositions *and* obey standard logical laws like IE.

  ---

  ### **2. Different Conceptions of Indicative Conditionals Targeted**
  - **Lewis**: Focuses on the **probability of conditionals**. His result challenges theories where conditionals have truth values *and* probabilities align with conditional probabilities (e.g., Stalnaker's semantics). The conception targeted is **propositional**: conditionals are propositions governed by probability calculus.  
  - **Gibbard**: Focuses on the **logic of conditionals**. He targets theories where conditionals are truth-apt and obey classical inference rules (e.g., IE). The conception here is **logico-semantic**: conditionals are structured propositions integrated into standard logic.  

  **Key Difference**:  
  Lewis attacks the *probabilistic coherence* of propositional theories, while Gibbard attacks their *logical coherence*. Lewis assumes truth-aptness to show probabilistic inconsistency; Gibbard assumes truth-aptness to show logical inconsistency.

  ---

  ### **3. Can a Theorist Coherently Accept One Moral While Resisting the Other?**
  **Yes**, a theorist can consistently accept one argument's conclusion while rejecting the other, depending on their stance on truth-aptness and logic:  
  - **Case 1: Accept Lewis, Resist Gibbard**  
    A theorist might endorse Lewis's conclusion that conditionals *lack truth values* (avoiding probabilistic triviality) but reject Gibbard's collapse by denying **Import-Export** for non-propositional conditionals.  
    - **How**: Adopt Ernest Adams' **non-propositional view**: conditionals lack truth values, so \( P(A \to B) \) is defined as \( P(B|A) \) without truth-conditions. Here, IE is invalid because conditionals do not embed logically (e.g., \( B \to C \) in \( A \to (B \to C) \) isn't truth-apt). Gibbard's argument presupposes truth-aptness, so it doesn't apply.  
    - **Coherence**: Lewis's result *supports* this view; Gibbard's is irrelevant.  

  - **Case 2: Accept Gibbard, Resist Lewis**  
    A theorist might accept Gibbard's collapse to the material conditional but resist Lewis by restricting the **scope of the Equation**.  
    - **How**: Defend the material conditional as the correct *truth-conditional* account. The Equation \( P(A \supset B) = P(B|A) \) holds only when \( P(A) > 0 \), avoiding Lewis's triviality (since \( A \supset B \) is a proposition). Lewis assumes the Equation for *all* conditionals, but material conditional theorists limit it.  
    - **Coherence**: Gibbard's conclusion (collapse) is embraced; Lewis's is avoided by rejecting the Equation's universality.  

  **Why They Don't Stand or Fall Together**:  
  - Lewis requires universal probabilistic validity; Gibbard requires universal logical validity (e.g., IE).  
  - Non-propositional theories (Adams) evade Lewis by denying truth values and evade Gibbard by denying IE's applicability.  
  - Material conditional theories evade Lewis by restricting probability assignments and accept Gibbard's collapse.  

  ---

  ### **4. Which Result Poses the Greater Obstacle to Robust Non-Material Conditionals?**
  **Lewis's result is the more serious obstacle** to theories where indicative conditionals express robust, non-material propositions. Here's why:  

  #### **Why Lewis is More Damaging**  
  - **Foundational Challenge**: Lewis directly undermines the *probabilistic coherence* of any truth-conditional theory. Robust non-material conditionals (e.g., Stalnaker's) require \( P(A \to B) = P(B|A) \) to capture their intuitive meaning. Lewis shows this leads to absurdity unless conditionals are trivial. Even if a theory avoids Gibbard's collapse (e.g., by rejecting IE), it still faces probabilistic suicide.  
  - **Scope and Generality**: Lewis's proof relies only on basic probability axioms, not auxiliary logical principles like IE. It applies to *any* theory where conditionals have truth values and probabilities, making it harder to evade.  
  - **Theoretical Cost**: Avoiding Lewis requires abandoning truth-aptness (e.g., Adams), which guts "robust propositions." Gibbard, by contrast, allows escape via non-classical logic (e.g., rejecting IE) while preserving propositions.  

  #### **Why Gibbard is Less Severe**  
  - **Dependence on Contingent Principles**: Gibbard's collapse requires IE, which some theorists (e.g., Dorothy Edgington) reject for embedded conditionals. Robust propositional theories can survive by adopting a *restricted logic* (e.g., no IE for nested conditionals).  
  - **Material Conditional as a Fallback**: Accepting collapse to \( A \supset B \) retains truth-aptness and classical logic, offering a stable (if unsatisfying) theory. Lewis offers no comparable fallback—triviality is irredeemable.  

  **Verdict**: Lewis's result is more devastating because it exposes a fundamental conflict between truth-aptness and the core intuition (the Equation) that motivates non-material conditionals. Gibbard's argument is significant but negotiable; it targets logical structure, which can be revised without abandoning propositions.  

  ---

  ### **Conclusion**
  Lewis and Gibbard attack indicative conditionals from distinct angles: probability versus logic. While both challenge robust propositional theories, Lewis's triviality result is more corrosive because it proves that *no* probability function can support non-trivial truth-conditional semantics satisfying the Equation. Gibbard's collapse, though powerful, can be resisted by revising logic (e.g., rejecting IE). Thus, Lewis poses the greater obstacle: it forces theorists to either abandon truth-aptness (e.g., embrace expressivism) or accept that indicative conditionals cannot coherently combine probability and robust propositions. Gibbard, meanwhile, leaves room for truth-conditional theories that sacrifice classical logical principles.
