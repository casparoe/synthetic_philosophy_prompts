  First, I need to recall Chang's framework. She differentiates between epistemic uncertainty (where you lack information), rough equality (small changes tip the balance), and parity (options are comparable but neither better nor equal). The user specifically needs an example unrelated to music to avoid bias. 

  I consider using a career example. Maybe choosing between two job offers? But that often leans into rough equality. What if one job is prestigious but rigid, and the other is flexible but less recognized? That could illustrate parity. The user mentioned wanting the small-improvement test to fail, meaning even if you slightly improve one option, it doesn't automatically become better. 

  Let me flesh out the example. Take two cities: one offers stability and community, the other excitement and growth. Adding a slightly better salary to the stable job doesn't make it decisively better because the other still has unique merits. That shows parity. The key is that both options have different strengths that resist direct comparison, yet they're still evaluatively comparable. 

  I should also clarify why parity is a fourth category. It's not just uncertainty; it's about different values creating a normative gap where reasons don't determine one as better. The protagonist's choice becomes a commitment to create reasons rather than discover them. 

  The user’s deeper need is to translate this philosophical concept into narrative tension. The scene must show the character actively shaping her identity through the choice, not just weighing pros and cons. Highlighting the moment of commitment as an act of self-definition could make the distinction clear. 

  Also, the example should contrast all three scenarios. For epistemic, maybe choosing a job without knowing future company stability. For rough equality, two similar jobs where a minor perk tips the scale. Then the parity example where no minor change sways the decision. 

  Finally, ensuring the language is accessible. Avoiding academic jargon while accurately representing the philosophy. Emphasizing the protagonist's internal conflict as a creation of self rather than discovery of the better option.
answer: |-
  Here’s a worked example isolating the three types of "hard choice" using **career paths**, distinct from your musical context to clarify the philosophical scaffolding:

  ---

  ### **Scenario: Choosing Between Two Job Offers**
  **Character:** Maya, a mid-career urban planner.

  1.  **Offer A:** City Planner for "Greenhaven" (a progressive, small city).  
      *   *Pros:* Meaningful impact on sustainability policies, collaborative team, work-life balance.  
      *   *Cons:* Lower salary, limited scope for large-scale projects, slower career advancement.  

  2.  **Offer B:** Regional Director for "MetroGrowth Inc." (a large private development firm).  
      *   *Pros:* High salary, significant influence on regional infrastructure, fast-track to executive roles.  
      *   *Cons:* Ethically complex projects (e.g., gentrification risk), high stress, long hours.  

  ---

  ### **1. Epistemic Hardness (Unknown Fact)**  
  *   **The Problem:** Maya *would* know the better option *if* she possessed key missing information.  
  *   **Example:** Greenhaven’s mayor hints at a major upcoming eco-initiative but can’t disclose details until after Maya’s decision deadline. If Maya *knew* the initiative aligned perfectly with her values, Offer A would clearly be better.  
  *   **Why it’s Not Genuinely Hard (in Chang’s sense):** The hardness stems from ignorance. Once the fact is known, the choice resolves cleanly.  
  *   **Editor’s Misread:** Your draft might feel like this if the protagonist seems to need a crystal ball.

  ### **2. Rough Equality (Slight Improvement Tips Balance)**  
  *   **The Problem:** The options are very close in overall value, but one is marginally better. A tiny nudge to either side decides it.  
  *   **Example:** Both offers have identical salaries and work-life balance. Offer B’s projects are slightly *less* ethically fraught than Maya feared. Or, Offer A includes a small professional development stipend.  
  *   **Why it’s Not Genuinely Hard:** The values involved (salary, ethics, growth) *are* commensurable on a single scale. We can imagine adding/subtracting small units (e.g., $5K, 5 hrs/week) to make one option definitively superior.  
  *   **The "Tipping Point":** If Maya says, "If only Greenhaven paid $10K more, I’d take it instantly," this is rough equality.

  ### **3. Genuine Hard Choice ("On a Par" - Chang’s Parity)**  
  *   **The Problem:** The options are evaluatively *comparable* (both involve career, impact, wellbeing), but their values are *different in kind*. Crucially, **no slight improvement to either makes it definitively better**, and they resist ranking as "better than," "worse than," or "equal to."  
  *   **Example:**  
      *   Offer A is clearly better for **Meaning/Values Alignment**.  
      *   Offer B is clearly better for **Career Advancement/Financial Security**.  
      *   **The Small-Improvement Test FAILS:**  
          *   *Improve A:* Give Greenhaven a $15K salary bump. Does this make A *definitively better*? No. B still offers vastly greater *scale* of impact and faster advancement Maya values. The extra money doesn’t erase the gap in scope/pace.  
          *   *Improve B:* Guarantee no weekend work at MetroGrowth. Does this make B *definitively better*? No. A still offers the unambiguous ethical satisfaction and community focus Maya craves. Reducing hours doesn’t create that value.  
  *   **Why it’s Genuinely Hard & "On a Par":**  
      *   **Different Kinds of Value:** "Meaningful Local Impact" vs. "Large-Scale Influence/Advancement". These aren’t easily converted into a common currency (like dollars or utils).  
      *   **No Single Scale:** There’s no overarching metric (e.g., "Career Goodness") to declare one superior. Each option is better than the other *in significant, distinct ways*.  
      *   **Normative Gap:** Reason doesn't dictate a winner. Neither option is better, worse, or equal. They occupy different positions in the "space of values."  
      *   **Commitment Creates Reasons:** Choosing A *makes* prioritizing local meaning over scale the right reason *for Maya*. Choosing B *makes* prioritizing scale/advancement over local focus the right reason. The act of choosing *creates* the justifying reasons; it doesn't just discover them. **(This is KEY for your scene)**.

  ---

  ### **Why Parity is a Fourth Relation (Not Uncertainty or Equality)**
  *   **Incomparability?** No. Maya *can* compare them: A is better for X, B is better for Y. They inhabit the same evaluative universe.
  *   **Equality?** No. They aren't interchangeable or balanced on a scale. A isn't *as good as* B; it's *better in way X, worse in way Y*.
  *   **Epistemic Fog?** No. Even with perfect information about salaries, project details, future prospects, etc., the *evaluative conflict* persists. Knowing more facts doesn't resolve *which value should dominate her life*.
  *   **Parity Defined:** Options are comparable, neither is better than the other, nor are they equally good, yet one *can* rationally choose either. The choice isn't about finding the "better" option, but about *who to become*.

  ---

  ### **Applying to Your Scene: What Must Happen**
  To avoid the epistemic/rough equality misread, your protagonist’s **internal monologue/dialogue must explicitly reject** the logic of those choices:
  1.  **Dismiss Epistemic Concerns:** *"It’s not that I need to know if the orchestra will thrive or if my compositions will find an audience someday. Even if I knew, the agony remains."*
  2.  **Dismiss Rough Equality:** *"It’s not that a slightly higher salary at the orchestra, or one guaranteed performance of a piece per year from the grant, would make the decision easy. That wouldn't touch the core of it."*
  3.  **Embrace the Parity Struggle:** Focus on the **clash of constitutive values**:
      *   Orchestra: *Stability, Mastery, Belonging, Interpreting Tradition.*
      *   Grant: *Autonomy, Creation, Risk, Defining a New Voice.*
      *   **The Crucial Realization:** "Choosing the orchestra isn't choosing *better*; it's choosing to be the kind of artist who finds ultimate meaning in collective expression and continuity. Choosing the grant isn't choosing *better*; it's choosing to be the kind of artist who finds ultimate meaning in solitary exploration and rupture. *Who do I most want to become?*"
  4.  **Show Commitment Creating Reasons:** After the choice (e.g., taking the grant), show her *retrospectively* framing it as the "right" choice *because* it aligns with the identity she affirmed: *"This solitary struggle *is* who I needed to be. The orchestra life, however beautiful, would have been a denial of my core voice."* The choice didn't reveal a pre-existing truth; it *created* a new truth about her values.

  By forcing the character to articulate why *neither* small improvements *nor* perfect information would dissolve the agony, and framing the choice as an identity-defining commitment between irreducibly different goods, you manifest Chang’s "on a par" in action. The hardness isn't in the head (epistemic) or the margins (rough equality); it's in the world of plural, conflicting values.
