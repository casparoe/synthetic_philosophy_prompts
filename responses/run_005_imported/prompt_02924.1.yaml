  For sentence unity, the Nyāyika's akāṅkṣā/yogyatā argument is strong. The Buddhist could counter by reframing expectancy as probabilistic expectation (modern twist?), but that might be anachronistic. Better to use Dharmakīrti's apoha (exclusion) to explain how words combine functionally? 

