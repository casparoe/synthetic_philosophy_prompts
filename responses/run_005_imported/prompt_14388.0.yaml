  First, I need to unpack Pascal's argument. The key points are the necessity of combining justice and force. Pascal says justice without force is ineffective because it can't enforce its will, while force without justice is tyranny. The solution proposed is to make justice strong or make force just. But Pascal then claims that making justice strong isn't possible because force disputes justice, asserting itself as just instead. So historically, humans make the strong just, meaning they legitimize power.

