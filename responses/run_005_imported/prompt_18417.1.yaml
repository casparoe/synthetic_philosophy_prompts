  For the memo structure: start neutrally, present evidence, then the two positions. The recommendation should lean toward mandatory re-grading given the recurring data, but explicitly honor graders’ professionalism by requiring detailed feedback to the second grader. That turns override into a collaborative quality check. 

  Also, subtly address epistemic akrasia: graders might rationally believe their own scores post-recheck while accepting the policy’s external safeguard. That’s not incoherent—it’s responding to higher-order evidence (the multi-year pattern). The memo can frame this as "shared epistemic humility." 

  Final tweak: the user probably needs this to sound diplomatic. Avoid "despite your arguments" language. Instead, validate the reconfirmation stance before explaining why the pattern overrides it. Use their philosophy jargon ("higher-order evidence") to show understanding. 

