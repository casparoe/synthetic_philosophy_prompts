  ## Teaching Committee Policy Memo: Grading Protocol for Extended Final Exam Sessions  

  **To:** Ethics Course Instructors & Teaching Assistants  
  **From:** Undergraduate Teaching Committee  
  **Subject:** Revised Policy for Grading Exams Beyond Hour Five  
  **Date:** October 26, 2023  

  ### **Background**  
  Multi-year data confirms that inter-grader reliability declines significantly after 5+ hours of continuous grading. While graders who re-examine their own hour-five-plus exams often reaffirm their original marks (and report confidence in rubric alignment), empirical consistency requires institutional safeguards against cumulative fatigue effects.  

  ### **Proposed Policy**  
  **All exams initially graded after the 5-hour mark in collective grading sessions must receive a fresh, independent review by a second grader.**  
  - Original graders will annotate their scoring rationale (briefly, per rubric item) to aid the second reviewer.  
  - Second graders will be blinded to the original marks but may reference annotations.  
  - Final score = average of both grades (rounded to nearest whole number). Discrepancies >10% trigger third review by the lead instructor.  

  ### **Engaging the Strongest Counterargument**  
  We acknowledge the compelling case for trusting a grader’s documented reconfirmation:  
  > *"Competent professionals can self-correct for fatigue. Mandatory override disregards their reasoned reflection, treats them as epistemically inept, and undermines morale by implying their judgment is unreliable even after careful re-evaluation."*  

  **Our Response:**  
  We agree that reflexive override risks epistemic injustice toward graders. However, higher-order evidence (3-year reliability decay patterns) suggests that *systemic* fatigue effects may persist *despite* sincere self-reconfirmation. When individual judgment (post-audit) conflicts with persistent statistical evidence, the latter warrants institutional priority. This policy does not question a grader’s competence—it addresses empirically observed limitations of prolonged focus under time constraints. Annotating rationales preserves agency by integrating the original grader’s perspective into the second review.  

  ### **Rationale**  
  1. **Empirical Necessity:** Data shows reliability decay is predictable and resistant to self-correction.  
  2. **Equity:** Ensures consistent standards for all students, regardless of when their exam was graded.  
  3. **Epistemic Humility:** Institutional processes should correct for known cognitive pitfalls without impugning individual expertise.  

  ### **Implementation**  
  - Lead instructors will assign staggered grading blocks (<5 hours) and second-grader pairings.  
  - Annotations may use shorthand (e.g., "Kantian FLR cited → 4/5").  
  - Policy takes effect Fall 2023 finals.  

  Respectfully submitted,  
  The Undergraduate Teaching Committee  

  ---  
  **Key Philosophical Balance:** This policy respects graders as rational agents (via annotations and collaborative averaging) while recognizing that higher-order evidence of cognitive fatigue justifies structured intercession—a practical resolution of epistemic akrasia.
