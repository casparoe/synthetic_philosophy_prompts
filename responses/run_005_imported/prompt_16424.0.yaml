  Tort law's structure separates elements to clarify different policy and conceptual issues. Duty determines if there's an obligation, breach checks if conduct fell below standards, cause-in-fact links the breach to the harm, and proximate cause limits scope. Merging cause-in-fact into duty might conflate normative questions (who should be responsible) with factual causation (did the breach contribute). This separation ensures transparency in judicial reasoning.

