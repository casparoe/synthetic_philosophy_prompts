answer: |-
  That's an exceptionally sharp critique, hitting at a core tension in tort theory, especially regarding omissions. Your lifeguard/swimmer example perfectly crystallizes the problem with the "but-for" test for cause-in-fact in omission cases. You're absolutely right that a pure counterfactual analysis makes *any* capable non-actor a "but-for cause," which is absurd and doesn't map onto legal practice.

  Here's why tort scholars generally resist folding cause-in-fact entirely into duty, despite the validity of your observation:

  1.  **Conceptual Distinction (Cause vs. Obligation):** Scholars argue there *is* a fundamental difference between:
      *   **Duty:** Does the defendant owe a legal obligation *to this plaintiff* to act in a certain way? (Normative/Legal question)
      *   **Cause-in-Fact:** Did the defendant's *breach of that duty* (the specific omission) *factually contribute* to the plaintiff's injury? (Supposedly a factual question about the world).
      Merging them risks conflating the question of "should they have acted?" with "did their failure to act *make a difference*?" The law wants a conceptual hook, however strained, for the latter.

  2.  **The "Filter" Function (Even if Leaky):** While notoriously problematic for omissions, cause-in-fact *does* still serve as a crucial filter in *many* commission cases and *some* omission cases:
      *   **Multiple Sufficient Causes/Overdetermination:** If two independent forces (e.g., two separate fires) would each have destroyed the property alone, but-for fails, requiring alternative tests like "NESS" (Necessary Element of a Sufficient Set). Cause-in-fact remains a distinct analytical step.
      *   **Pre-emption:** If Defendant A poisons the victim, but Defendant B shoots the victim dead before the poison acts, B's shot is the cause-in-fact of death, not A's poison (even though the poison was deadly). Duty alone doesn't resolve this.
      *   **Cases Where Duty Exists But Causation Fails:** Imagine a doctor negligently fails to diagnose a terminal illness, but the patient would have refused life-saving treatment even if diagnosed. Duty and breach exist, but cause-in-fact fails – the omission didn't *cause* the death. Folding cause-in-fact into duty wouldn't capture this failure.

  3.  **Proximate Cause as the Real "Duty Partner" for Omissions:** Scholars like Richard Wright and Jane Stapleton argue that the *real* work in omission cases is done by **proximate cause (legal cause)**, not cause-in-fact. The counterfactual test establishes a vast field of potential "but-for causes." Proximate cause then limits liability based on policy considerations deeply intertwined with duty concepts:
      *   **Scope of the Risk:** Did the harm that occur fall within the risks that made the omission negligent? (The lifeguard's duty is to prevent drownings *in their pool*; the sunbather has no such duty or scope).
      *   **Directness/Foreseeability:** Was the harm a reasonably foreseeable consequence of the omission? (The lifeguard's texting makes drowning foreseeable; the sunbather's lounging does not).
      *   **Duty as Limiting the Class of Potential "Causers":** The duty analysis inherently restricts the universe of people whose omissions we even *consider* for cause-in-fact. We only run the (flawed) counterfactual test on people who *owed a duty*. The sunbather never gets to the cause-in-fact stage because they owed no duty. The lifeguard does. So, while the *test* is flawed, the *doctrinal sequence* (Duty first) restricts its application meaningfully.

  4.  **Seeking Better Factual Causation Tests:** Many scholars acknowledge the failure of but-for for omissions and advocate for alternative factual causation tests that better capture the intuition:
      *   **NESS Test:** Was the defendant's omission (or more precisely, the *act* of omitting) a Necessary Element of a Sufficient Set of conditions for the harm? This can sometimes handle pre-emption and overdetermination better, but still struggles with pure omissions where *many* omissions are part of sufficient sets. The salience of the lifeguard's omission comes from the duty/role.
      *   **Interventionist/Causal Process Theories:** Focuses on whether the omission allowed a pre-existing causal process to continue uninterrupted, and whether the defendant had a specific role/duty to interrupt it. This explicitly builds duty-like concepts into the causation analysis.
      *   **"Duty-Bound" Counterfactuals:** Modifying the counterfactual test: "But for the breach *of the specific duty owed*, would the harm have occurred?" This explicitly ties the counterfactual to the duty, effectively merging them for omissions while retaining the label "cause-in-fact." (This is close to what you suggest).

  5.  **Doctrinal Clarity and Adjudication:** Maintaining separate elements provides a structured framework for courts and litigants. It forces courts to articulate:
      *   *Why* a duty exists (relationships, roles, statutes, foreseeability).
      *   *Why* the specific omission breached that duty.
      *   *Why* that breach mattered in bringing about the harm (even if the reasoning here often implicitly relies on duty/duty-scope).
      *   *Why* liability is fair/just despite the breach causing harm (proximate cause/policy).
      Folding cause-in-fact into duty might obscure these distinct rationales and lead to less transparent decision-making.

  **Conclusion & Scholarly Tension:**

  You've identified a profound flaw. For pure omissions, the *factual* causation inquiry is often inseparable from the *normative* duty inquiry. The counterfactual test, applied naively, is useless. The legal system *de facto* solves this by:

  1.  **Using duty to define the relevant class of potential causal agents** (only those with a duty get their omission scrutinized).
  2.  **Using proximate cause (scope of duty, foreseeability) to limit liability** within that class, doing the heavy normative lifting that the factual causation test cannot.

  Scholars persist in treating cause-in-fact as distinct for several reasons: conceptual tradition, its clearer utility in commission cases and some complex causation scenarios, the desire for a (theoretically) factual baseline, and the structure it provides to legal argument. However, the most sophisticated scholars (like Wright, Stapleton, Honore, Moore) recognize the deep entanglement in omission cases and often argue that proximate cause absorbs the policy work or that factual causation needs a test incorporating normative elements (like the duty-bound counterfactual or interventionist theories).

  **Your dissertation is tackling a crucial and unresolved problem.** A compelling argument could be made that for omissions, "cause-in-fact" is indeed an empty vessel filled by duty and proximate cause analysis, and that explicitly recognizing this doctrinal reality (merging the inquiries or radically redefining causation for omissions) would be more honest and theoretically coherent. You're grappling with the very limits of counterfactual analysis in law. Good luck!
