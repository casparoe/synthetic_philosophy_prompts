prompt: |-
  After forty years as an experimental physicist, now retired, I am entirely at home with conditional probabilities, but I've only recently turned to philosophy, and I've just worked through David Lewis's 1976 paper "Probabilities of Conditionals and Conditional Probabilities." There he refutes Stalnaker's thesis that the probability of an indicative conditional "if A, C" equals the conditional probability P(C|A), by showing that requiring this equation to survive updates on new evidence forces absurd consequences except in degenerate cases. I follow the shape of the argument but find it frustratingly abstract without numbers attached. Could you construct your own concrete example? Choose two substantive, evidentially connected propositions A and C (a natural cause and its effect, say, or a hypothesis and a piece of evidence for it) from an everyday or scientific setting rather than the stock election, dice, or weather cases in the literature; assign specific probabilities to every relevant combination of them and their negations; and show, step by step, which update on the evidence makes the equation collapse. Close with a sentence on what this is supposed to show about whether indicative conditionals are genuine propositions at all.
reasoning: |-
  Okay, the user is a retired experimental physicist who's comfortable with conditional probabilities but new to philosophy. They've read David Lewis's 1976 paper refuting Stalnaker's thesis and want a concrete example with specific numbers. They're frustrated by abstract arguments and want something from a scientific context, not the usual dice or weather examples.

  Hmm... they specifically asked for "two substantive, evidentially connected propositions" like a cause-effect or hypothesis-evidence pair. As a physicist, they'd appreciate a science-based scenario. The key is to show how updating evidence breaks P(if A, C) = P(C|A). 

  I recall Lewis's proof shows this equality can't hold universally after probability updates. The example needs: 1) non-extreme probabilities, 2) clear evidential link, 3) a partition where updating exposes the contradiction. A medical testing scenario could work well - say a virus (A) causing a symptom (C). 

  Let me sketch: Suppose 30% virus prevalence (P(A)), 90% symptom rate if infected (P(C|A)), 20% if not (P(C|¬A)). First calculate all joint probabilities: P(A∧C), P(A∧¬C) etc. Then show initial P(if A,C) is defined as P(C|A)=0.9. 

  Now the update: learn symptom status of the uninfected (¬A). In this case, P(C|¬A)=0.2. After update, conditional probabilities shift but P(if A,C) must remain the same while P(C|A) changes, creating contradiction. 

  Crucially, when we condition on ¬A∨C, P(C|A) becomes 0.75 but P(if A,C) can't equal both 0.9 and 0.75 simultaneously. The numbers must highlight this jump. 

  For the physicist, I should emphasize how the Bayesian update mirrors scientific evidence gathering. And conclude by noting this undermines treating conditionals as standard propositions with fixed truth values. The punchline: conditionals might be "shifty" expressions of epistemic states rather than propositions. 

  Better avoid medical if they prefer physical science... maybe mechanical failure? No, medical has clearer probabilities. I'll add a table showing the probability shifts after update to make the contradiction visible. The key is showing P(if A,C) can't stay equal to P(C|A) through updates.
answer: |-
  Below is a concrete example using a scientific scenario—specifically, a medical diagnosis context—with explicit probabilities. I’ll walk through the steps to show how updating on evidence collapses Stalnaker’s thesis (**P**(if *A*, *C*) = **P**(*C*|*A*)).  

  ---

  ### **Scenario Setup**  
  **Propositions**:  
  - **A**: "Patient is infected with Virus X."  
  - **C**: "Patient exhibits symptom Y."  

  **Background Statistics**:  
  - Prevalence of Virus X: **P**(*A*) = 0.30  
  - Symptom Y rate among infected: **P**(*C*|*A*) = 0.90  
  - Symptom Y rate among uninfected: **P**(*C*|¬*A*) = 0.20  

  **Joint Probabilities** (calculated from above):  
  | | ***C*** (Symptom present) | ***¬C*** (Symptom absent) |  
  |----------------|---------------------------|----------------------------|  
  | ***A*** (Infected) | **P**(*A* ∧ *C*) = 0.30 × 0.90 = 0.27 | **P**(*A* ∧ ¬*C*) = 0.30 × 0.10 = 0.03 |  
  | ***¬A*** (Uninfected) | **P**(¬*A* ∧ *C*) = 0.70 × 0.20 = 0.14 | **P**(¬*A* ∧ ¬*C*) = 0.70 × 0.80 = 0.56 |  

  **Marginal Probabilities**:  
  - **P**(*C*) = **P**(*A* ∧ *C*) + **P**(¬*A* ∧ *C*) = 0.27 + 0.14 = 0.41  
  - **P**(¬*C*) = 1 - **P**(*C*) = 0.59  

  ---

  ### **Step 1: Initial Stalnaker Thesis Check**  
  - **Conditional probability**: **P**(*C*|*A*) = **P**(*A* ∧ *C*) / **P**(*A*) = 0.27 / 0.30 = **0.90**.  
  - **Stalnaker’s thesis requires**: **P**(if *A*, *C*) = **P**(*C*|*A*) = **0.90**.  

  *At this stage, the thesis holds trivially by definition.*  

  ---

  ### **Step 2: Update Evidence & Probability Shift**  
  We now learn **new evidence**:  
  > "The patient is *either uninfected OR exhibits symptom Y*."  
  > This evidence is the proposition **¬*A* ∨ *C***.  

  **Probability of the evidence**:  
  **P**(¬*A* ∨ *C*) = **P**(¬*A*) + **P**(*C*) - **P**(¬*A* ∧ *C*) = 0.70 + 0.41 - 0.14 = **0.97**.  

  **Bayesian update**: We **conditionalize** all probabilities on **¬*A* ∨ *C***.  
  - Updated probabilities become: **P**<sub>new</sub>(·) = **P**(· | ¬*A* ∨ *C*).  

  ---

  ### **Step 3: Calculate Updated Probabilities**  
  We recompute key probabilities after conditioning on **¬*A* ∨ *C***:  

  | Event | Original **P** | **P**(Event ∧ (¬*A* ∨ *C*)) | Updated **P**<sub>new</sub> |  
  |-------|---------------|-----------------------------|------------------------------|  
  | ***A*** | 0.30 | **P**(*A* ∧ (¬*A* ∨ *C*)) = **P**(*A* ∧ *C*) = 0.27 | 0.27 / 0.97 ≈ **0.278** |  
  | ***C*** | 0.41 | **P**(*C* ∧ (¬*A* ∨ *C*)) = **P**(*C*) = 0.41 | 0.41 / 0.97 ≈ **0.423** |  
  | ***A* ∧ *C*** | 0.27 | **P**((*A* ∧ *C*) ∧ (¬*A* ∨ *C*)) = **P**(*A* ∧ *C*) = 0.27 | 0.27 / 0.97 ≈ **0.278** |  
  | ***C* \| *A*** | 0.90 | **P**<sub>new</sub>(*C*|*A*) = **P**<sub>new</sub>(*A* ∧ *C*) / **P**<sub>new</sub>(*A*) = 0.278 / 0.278 = **1.0** |  

  **Critical point**: After updating, **P**<sub>new</sub>(*C*|*A*) = **1.0** (since ¬*A* ∨ *C* rules out *A* ∧ ¬*C*).  

  ---

  ### **Step 4: Collapse of Stalnaker’s Thesis**  
  - Stalnaker’s thesis **requires**: **P**<sub>new</sub>(if *A*, *C*) = **P**<sub>new</sub>(*C*|*A*) = **1.0**.  
  - But consider the **original conditional** "if *A*, *C*":  
    - Its probability **before update** was **0.90** (by the thesis).  
    - Updating on **¬*A* ∨ *C*** *did not directly contradict* "if *A*, *C*" (e.g., it doesn’t falsify *A*→*C*).  
    - Intuitively, learning "¬*A* ∨ *C*" **strengthens** the link between *A* and *C*?  
      Yet **P**<sub>new</sub>(if *A*, *C*) should arguably **not jump to 1.0**—it previously accounted for asymptomatic cases!  

  **Contradiction**:  
  - If conditionals have fixed truth conditions (like propositions), **P**<sub>new</sub>(if *A*, *C*) should equal **P**(if *A*, *C* | ¬*A* ∨ *C*).  
  - But **P**(if *A*, *C* | ¬*A* ∨ *C*) is undefined without truth values. Lewis shows that *if* we assume it equals **P**<sub>new</sub>(*C*|*A*) = 1.0, we get:  
    > Original **P**(if *A*, *C*) = **P**(*C*|*A*) = 0.90  
    > **P**(if *A*, *C* | ¬*A* ∨ *C*) = 1.0  
    > ∴ **P**(if *A*, *C*) = **P**(if *A*, *C* | ¬*A* ∨ *C*) × **P**(¬*A* ∨ *C*) + **P**(if *A*, *C* | ¬(¬*A* ∨ *C*)) × **P**(¬(¬*A* ∨ *C*))  
    > This simplifies to: 0.90 = (1.0 × 0.97) + (*k* × 0.03) for some *k* ≤ 1.  
    → **0.90 = 0.97 + 0.03*k*** → *k* = (0.90 - 0.97)/0.03 ≈ -2.33 (impossible!).  

  ---

  ### **Conclusion: What This Shows**  
  Lewis’s argument demonstrates that **indicative conditionals cannot be propositions with stable truth values** because their asserted probabilities (as per Stalnaker’s thesis) become inconsistent when conditioned on new evidence—suggesting they are instead *expressions of epistemic attitudes* (e.g., degrees of belief under suppositions) rather than factual claims about the world.  

  **Final sentence**:  
  > The collapse under Bayesian updating reveals that indicative conditionals are not truth-apt propositions but dynamic assessments of hypothetical scenarios, inextricable from an agent’s current state of information.
