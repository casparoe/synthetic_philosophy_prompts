answer: |-
  ## Dialogue: The Cheesecake Conundrum

  **Setting:** A sunlit common room at the Institute for Advanced Study in Biosemantics. Dr. Evelyn Voss (mid-60s, precise gestures, wears a faded "Spandrels '79" t-shirt under her blazer) and Dr. Marcus Adler (late 50s, energetic, slightly rumpled tweed) sip tea near a window overlooking a garden.

  **Dr. Voss:** Marcus, I was reviewing Steven Pinker’s "auditory cheesecake" hypothesis for music again. It strikes me as a perfect example of the *kind* of thinking Gould and Lewontin advocated against leaping to adaptationist stories. Pinker explicitly rejects music as a direct target of selection. He argues it parasitizes neural circuits honed for language, auditory scene analysis (identifying predator calls, rustling leaves), and emotional regulation. Its universality and power are emergent *by-products*, not proof of design. This avoids the Panglossian trap of inventing a just-so story about selective pressures for drumming or melody.

  **Dr. Adler:** Evelyn, I respect Pinker's attempt at parsimony, but I think he, and by extension your reading of Gould-Lewontin, throws the baby out with the bathwater. Methodological adaptationism isn't about declaring *everything* optimal. It's about recognizing that when we see a complex, costly, species-wide trait with apparent functional benefits – like music – the *default* explanatory framework is natural selection shaping it *for that function*, absent compelling evidence *against* it. Universality and developmental canalization *are* the hallmarks of selection! What stronger prima facie evidence could you want than that music appears in every known human culture, emerges spontaneously in development, and demonstrably influences social bonding, coordination, and even stress reduction? The burden *should* lie with those claiming it’s merely a spandrel.

  **Dr. Voss:** Ah, but that’s precisely where the "Panglossian" error creeps in! You’re conflating *current utility* with *evolutionary origin*. Music *uses* existing circuits and *has* effects now, but that doesn’t mean it *arose* because those effects were selected *for music itself*. Pinker’s point is that the underlying machinery *was* selected – powerfully – for other critical functions. Music could be an inevitable, non-adaptive output when you combine a brain wired for complex vocal communication, fine-grained auditory parsing, and rich emotional responses. The universality you cite is equally predicted by the universality of the *underlying* adaptations it exploits. Where is the *positive evidence* for *specific* selective pressures acting *directly* on musical ability? Not correlations, but evidence that variation in proto-musical traits caused differential survival or reproduction *independent* of language or scene analysis.

  **Dr. Adler:** You set an impossibly high bar, Evelyn. For traits deep in our evolutionary past, we rarely get pristine "smoking gun" selective histories. We infer from patterns. Consider the *specificity* of musical features: beat synchronization – incredibly rare in the animal kingdom, yet universal and precise in humans, even infants. It facilitates group cohesion in ways language alone doesn't. Or consider the dopamine reward circuitry activated by music – distinct from, though overlapping with, language rewards. This suggests dedicated neural "hooks." Isn't the simplest explanation that this complex, functional, species-specific package *was* a target? Constraint arguments often feel like a retreat into untestable vagueness. "It emerged from language" isn't an explanation; it's a description of proximity. *How* did it emerge? *Why* is it so potent? Selection provides a mechanism.

  **Dr. Voss:** Vagueness? Not at all. The constraint is testable: we can look for shared neural substrates and developmental pathways. Patel’s work on songbirds and humans shows overlap in rhythm processing circuits with vocal learning, supporting the by-product view. The test is: if we *removed* the selective pressures for language and auditory scene analysis, would music disappear? Almost certainly. Whereas *if* music were a primary adaptation, we might expect dissociations – musical savants without language, or cultures lacking language but having complex music. We don't see that. Music piggybacks. Your "dedicated hooks" argument conflates *current* neural implementation with *evolutionary* cause. Brains re-purpose and refine existing circuits *all the time* without new selection pressures. The burden *isn't* on us to prove a negative ("no selection happened"). It's on the adaptationist to provide positive evidence *beyond* utility and universality – evidence distinguishing direct selection from fortuitous by-product. Pinker's "cheesecake" metaphor highlights this: cheesecake exploits our evolved tastes for fat and sugar; it's *deliciously* functional now, but it wasn't a target of selection. We need more than "it's sweet and universal" to claim it was.

  **Dr. Adler:** But music isn't just *one* cheesecake, Evelyn. It's a vast, structured domain with its own intricate "grammar," learned skills, and cross-modal connections (dance!). The cheesecake metaphor undersells the complexity. And while dissociations aren't perfect, we *do* see amusics with intact language, and music engages distinct brain networks beyond core language areas. Furthermore, universality *under selective pressure* is different from universality as an automatic by-product. If music were truly just epiphenomenal noise, why wouldn't some cultures have lost it, or why wouldn't it be far more variable? Its developmental trajectory is robust. Constraint arguments often become unfalsifiable post-hoc explanations *after* adaptationist hypotheses are proposed. Methodological adaptationism provides the necessary heuristic drive: "This looks functional; *how* might selection have shaped it?" That’s how science progresses. Demanding proof of ancient selection *before* even entertaining the hypothesis stifles inquiry.

  **Dr. Voss:** And *assuming* selection *without* that proof generates just-so stories that *sound* plausible but lack rigor! Gould and Lewontin weren't attacking testable adaptationist hypotheses; they were attacking the *default assumption* that adaptation is the *only* game in town. Pinker offers a testable alternative for music: identify the existing adaptive complexes it co-opts and show how their operation naturally produces music as output. The fact that music *isn't* infinitely variable but channels existing neural structures *is* evidence *for* constraint! Methodological adaptationism, as you describe it, risks becoming a tautology: "It's universal and functional, therefore it was selected." That's not a heuristic; it's a bias. We need hypotheses about *specific* constraints and developmental pathways – like the role of vocal learning circuits – that are equally testable and often more parsimonious. Pinker’s account may be incomplete, but it starts from a more epistemically cautious position than declaring music an adaptation because it feels profound.

  **Dr. Adler:** Cautious, perhaps, but potentially myopic. It risks missing the forest for the trees – overlooking how the *integration* of these systems under the umbrella of "music" *itself* became a powerful selective advantage for social humans. The burden of proof cuts both ways: demonstrating that constraint *precluded* selection for refinement is just as challenging. I maintain that music's pervasive, structured, functional presence screams "look for the adaptive story first." Pinker's cheesecake is delicious, but it might just be the appetizer for the main evolutionary course.

  **Dr. Voss:** And I maintain that starting with the adaptationist conclusion biases the entire investigation. The main course might be the recycled leftovers of a truly fundamental adaptation. We need the recipe, Marcus, not just the taste test. Pinker, for all his flaws, points us towards the ingredients. The critique stands: universality plus function is necessary, but not sufficient, for adaptation. We need the historical or developmental constraint story to provide the *sufficient* cause. Until we have evidence *for* selection *on music*, the null should be constraint.

  *(They sip their tea, the late afternoon sun highlighting the unresolved tension in their rigorous, fundamentally opposed perspectives.)*
