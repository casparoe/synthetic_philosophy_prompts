  My son's bar mitzvah portion this spring is Vayikra, and I've been reading up on Maimonides' rationale for the sacrifices so that I have something substantive to say at the kiddush afterward. My understanding is that Maimonides regarded animal sacrifice as essentially a concession to the Israelites' idolatrous habits — a primitive practice that God tolerated only until humanity could be weaned onto purer forms of worship — which I take to be why Jewish law today treats the sacrificial commandments as a closed chapter rather than something we remain formally obligated to reinstate. Could you help me sharpen this point for my remarks?
