  Hmm, the user's framing suggests they've already identified key tensions in Aquinas' texts: (1) the principal-agent problem of why only public authority can depose a tyrant, (2) whether Aquinas' objections are merely pragmatic rather than moral, and (3) the ambiguity around usurpers vs. legitimate-turned-tyrannical rulers. They're clearly well-versed in the material – probably wants to push beyond superficial Thomist apologetics. 

  For the principal-agent question, I should emphasize Aquinas' own definition of forfeited legitimacy to challenge the "public authority" requirement. The follow-up needs to corner the distinction between authority-as-office versus authority-as-action when the officeholder is void. 

  On instrumental objections, the wording must force admission that Aquinas' warnings imply contingent rather than absolute opposition. The follow-up should test consistency by proposing a scenario where all risks are eliminated – if she still objects, that exposes a deeper principle she hasn't articulated. 

  The usurper question needs to highlight how Aquinas' lack of explicit distinction undermines the unified reading's claim of consistency. Follow-up should pressure whether the scholar is imposing modern legal categories Aquinas himself avoided. 

  For Mariana, the close must force her to either condemn him as a revisionist (undermining "unified" continuity) or admit Aquinas' framework permits radical interpretations. Either way, it destabilizes her position. 

  User's tone suggests impatience with doctrinal hand-waving – these questions should be surgical. Might add a meta-question about whether "careful lawyer" is itself an evasion of Aquinas' radical potential, but the brief specifies eight to ten questions total. Stick to script.
answer: |-
  Here are eight targeted questions with follow-ups designed to systematically challenge the "careful lawyer" defense and probe the tensions in the unified reading, incorporating your specific requests:

  **Core Questions & Probing Follow-Ups:**

  1.  **The Principal-Agent Failure & Private Action:**
      *   **Q1:** Professor, Aquinas states a tyrant "has no claim to be obeyed" (De Regno/De Regimine) and rules *seditiously* by definition (STh II-II, q.42). If the ruler has fundamentally dissolved the principal-agent relationship by diverting the common good, forfeiting legitimacy, why must remedy *only* come from a pre-existing "public authority"? Isn't this authority itself derived from the community? Why couldn't the *community itself*, acting through competent members (private citizens capable of the act), licitly remove the agent who has broken his trust?
      *   *Likely Response:* She'll emphasize the need for order, the danger of vigilantism, and that only constituted authority can licitly judge and act for the common good.
      *   **Follow-Up Q1a:** But if the tyrant has dissolved the very bonds of rightful authority, doesn't the "public authority" *at that moment* effectively revert to the community in a state of necessity? Aquinas allows private individuals to kill in self-defense without public authority (STh II-II, q.64, a.7). If the *whole community* is under unjust attack by the ruler, isn't the community's act of removing him analogous to collective self-defense, especially if no constituted mechanism remains?

  2.  **Instrumental vs. Terminal Opposition:**
      *   **Q2:** Aquinas's primary warnings against private tyrannicide focus on the *likely consequences* – factional chaos, risk of a worse tyrant, or scandal (De Regno). This sounds instrumental: the *means* (private action) is dangerous and likely counterproductive. If a private citizen could somehow guarantee a swift, clean removal with an immediate, peaceful transition to a just ruler – eliminating those instrumental risks – would Aquinas's *core principle* still absolutely forbid the act? Or would the removal then be permissible, even laudable?
      *   *Likely Response:* She'll likely say the risks are inherent and inseparable, or emphasize the fundamental disorder of private judgment usurping public function.
      *   **Follow-Up Q2a:** If the prohibition were truly terminal – rooted in an intrinsic evil of private judgment over rulers – wouldn't Aquinas ground it in natural law or divine law principles *separate* from consequences? Yet his arguments in both texts *are* overwhelmingly consequentialist. Doesn't this suggest his opposition is fundamentally pragmatic, not a matter of intrinsic moral principle? Where is the *non-consequentialist* argument against the private act itself in Aquinas?

  3.  **The Usurper/Tyrant Ambiguity:**
      *   **Q3:** A key point for the unified reading seems to be that *only* public authority can judge a *rightful ruler turned tyrant*. But Aquinas doesn't sharply distinguish this case from a *pure usurper* who never had legitimacy (like Absalom rebelling against David). Both are called "tyrants" and accused of *seditio*. If the core sin is the *act* of unjustly disturbing the just order (STh II-II, q.42), does Aquinas's framework truly depend on the prior *title* of the ruler, or solely on the *nature of their rule*? Does this ambiguity weaken the claim that the "public authority" requirement specifically hinges on the ruler's *prior legitimacy*?
      *   *Likely Response:* She'll argue Aquinas assumed the context was a legitimate ruler turning bad, and that usurpers are covered under rebellion/sedition from the start.
      *   **Follow-Up Q3a:** But if the core unifying principle is solely about *who* has authority to judge and remove a *de facto* tyrant (regardless of origin), and Aquinas *doesn't* explicitly differentiate the procedures for a fallen legitimate ruler vs. a usurper regarding *who* can act, doesn't this actually *support* the idea that the "public authority" requirement is a broad procedural rule, potentially applicable even against a usurper, rather than a rule specifically tied to the *forfeiture* of a prior legitimate title? How does this strengthen the unified reading centered on forfeiture?

  4.  **The "Careful Lawyer" Defense & Radical Potential:**
      *   **Q4:** You characterize Aquinas as a "careful lawyer, not a revolutionary." Yet, calling the ruler's *own rule* "seditious" (STh II-II, q.42) is an extraordinarily radical *linguistic* move. Doesn't this deliberate reframing – defining the tyrant *as* the rebel – inherently contain revolutionary potential, even if Aquinas personally emphasized caution? Isn't the "lawyerly" framework he built precisely what *enables* later thinkers to draw more radical conclusions?
      *   *Likely Response:* She'll stress his context, his focus on stability, and his intent within the texts.
      *   **Follow-Up Q4a:** Can we separate the *internal logic* of the principles Aquinas established (forfeiture, tyranny as sedition, common good as supreme) from his personal *prudential* cautions? Isn't the "careful lawyer" describing a *framework* that, by its own terms, could justify revolutionary action under the right (or rather, extreme) conditions, even if he wouldn't have endorsed it lightly? Isn't caution an application, not a negation, of the radical core?

  5.  **The Nature of "Public Authority":**
      *   **Q5:** When Aquinas says removal must be by "public authority," what constitutes this authority *after* the tyrant has corrupted all institutions? Is it only the *immediately prior* legitimate structures? Could it be a lesser magistrate? A council? The spontaneous consensus of the people *as* the ultimate repository of authority (per his principle that authority derives from God *through* the people)? How does the unified reading define "public authority" in a scenario of total tyrannical capture?
      *   *Likely Response:* She'll likely point to traditional structures (estates, councils, lesser nobles) or emphasize the difficulty, implying it's rarely feasible.
      *   **Follow-Up Q5a:** If the tyrant has successfully dismantled *all* traditional intermediary bodies and terrorizes the populace, does Aquinas's principle imply the community is simply trapped, with no licit recourse, despite the ruler's manifest forfeiture? Or does the ultimate authority of the community *as a whole* (Vox populi, vox Dei?) implicitly provide a last-resort mechanism, however dangerous? Where is Aquinas's threshold for when "public authority" effectively ceases to exist *as a functioning agent*?

  6.  **The Role of Intention & Motive:**
      *   **Q6:** Aquinas condemns sedition as a sin against charity and the common good (STh II-II, q.42). But if removing a tyrant is *not* sedition but rather *resisting* sedition, does the licitness depend *critically* on the *intention* of the actor? If a private citizen acts *solely* for the common good, with right intention, does Aquinas's framework *in principle* condemn the act *because* it's private, or *only* because of the near-certainty of bad consequences you mentioned earlier?
      *   *Likely Response:* She'll link right intention to acting through right authority, arguing the two are inseparable for a just act against a ruler.
      *   **Follow-Up Q6a:** But intention is a key element in Aquinas's moral analysis elsewhere. If the act (killing the tyrant) is *not* intrinsically evil (as self-defense isn't), and the intention is just (restoring common good), and the circumstances *could* theoretically be controlled (per Q2), what remains as the *intrinsic* moral barrier rooted in natural law, other than the procedural rule about authority? Isn't the prohibition then fundamentally about *jurisdiction* and *prudence*, not about the inherent nature of the act?

  7.  **The Burden of Proof for Forfeiture:**
      *   **Q7:** Aquinas provides clear criteria for tyranny (diverting common good to private gain, ruling by fear). But who bears the burden of proof in declaring that forfeiture has occurred? If only "public authority" can make this judgment, isn't there a profound circularity? How can a corrupted "public authority" judge its own head? Doesn't this procedural requirement risk creating a situation where forfeiture is theoretically possible but practically impossible to declare legally?
      *   *Likely Response:* She'll acknowledge the difficulty but stress the dangers of private judgment.
      *   **Follow-Up Q7a:** Doesn't this practical impossibility in the face of a truly effective tyrant suggest that Aquinas's system, while logically coherent, contains a potentially fatal flaw when confronted with the worst-case scenario? Does the unified reading adequately address this tension between the *theory* of forfeiture and the *practical* requirements for its declaration?

  **Closing Question (Juan de Mariana):**

  8.  **Q8 (Mariana):** The Jesuit Juan de Mariana, writing centuries later, explicitly invoked Aquinas's principles – the tyrant's forfeiture of authority, his rule as true sedition, the supremacy of the common good – to justify tyrannicide *even by a private citizen* under specific, extreme conditions. Was Mariana making a legitimate, logical extension of the principles Aquinas established, simply applying them to different historical circumstances? Or was he fundamentally breaking with Aquinas's core insistence on "public authority," thereby distorting Thomism? Does the unified reading ultimately suggest Mariana was more faithful to Aquinas's *logic* than to his *prudence*?

  **Key Objectives Met:**

  1.  **Principal-Agent/Private Action:** Q1 & F1a directly tackle the core contradiction of forfeited legitimacy vs. reserved remedy, using the self-defense analogy.
  2.  **Instrumental vs. Terminal:** Q2 & F2a force the distinction by positing a risk-free scenario and demanding non-consequentialist justification.
  3.  **Usurper/Tyrant Distinction:** Q3 & F3a exploit Aquinas's lack of clear differentiation to question the unified reading's reliance on prior title.
  4.  **Mariana Closing:** Q8 explicitly asks the crucial question about continuity vs. rupture, forcing the scholar to position Mariana relative to Aquinas's logic and prudence.
  5.  **"Careful Lawyer" Pressure:** Q4 & F4a challenge the defensiveness of this line, arguing the *logic* is radical even if the *man* was cautious. Q5, Q6, and Q7 further probe practical tensions and burdens within the unified framework.

  These questions are designed to be cumulative, each building on potential answers to the previous ones, systematically making the "careful lawyer" defense feel increasingly inadequate as a full explanation for the tensions and radical potential within Aquinas's texts on tyranny and resistance. Good luck with the interview!
