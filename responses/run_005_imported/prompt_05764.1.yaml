answer: |-
  Based strictly on your description, **your friend is fundamentally correct: you should settle immediately.** While your feelings about reputation and sunk costs are understandable, they don't withstand rational scrutiny in this specific situation. Here's the verdict broken down:

  1.  **The Sunk Cost Fallacy is Overwhelming:** Your primary justification – that stopping now makes the $40k "buy nothing," while continuing offers a *chance* of partial cost recovery – is the textbook definition of the sunk cost fallacy. The $40k is irretrievably gone. Future decisions *must* be based *only* on the **additional costs** (more legal fees, stress, time) versus the **additional benefits** (winning the land + *potential* partial cost recovery) from this point forward. The past expenditure is irrelevant to this calculation.

  2.  **The Math is Brutally Against You:**
      *   **Best-Case Win:** You get land worth $3k-$5k. *Maybe* a judge awards some costs, but full recovery is *highly* unlikely. Even if you got $20k back (optimistic), you'd *still* be net negative $20k+ (initial $40k+ spent - $20k back + $5k land value = net loss of at least $15k, ignoring future costs).
      *   **Loss:** You get nothing, owe more fees, and lose the land.
      *   **Settle Now:** You avoid *all* future legal fees (easily $10k-$30k+ more through trial and potential appeal). You might salvage *some* value in negotiation (e.g., a small concession elsewhere, a formal agreement preventing future claims on that strip, splitting the land). Crucially, you stop the financial bleeding immediately.

  3.  **Reputational Concerns Are Misdirected:**
      *   **How Reputation is Truly Damaged:** What damages your reputation more: settling a costly dispute pragmatically, or being known as the neighbor who spent $60k+ over a $5k strip? The latter makes you look irrational and volatile, not strong.
      *   **Settling ≠ Weakness:** A well-negotiated settlement can include terms demonstrating strength (e.g., mutual releases, clear boundary agreements, provisions for future disputes). It shows you are reasonable but not a pushover *when negotiation is possible*.
      *   **The Future Dispute:** Your credibility in the *next* dispute ("driveway-easement") is better preserved by showing you can resolve conflict *before* it bleeds everyone dry. Walking into that future fight having already wasted $40k+ on this one makes you look *less* formidable, not more. Save your resources and resolve for the fight that truly matters, if it comes.
      *   **Your Neighbor's Perception:** Your neighbor is just as entrenched. "Winning" this battle won't make him back down easier next time; it will likely make him *more* aggressive and vindictive. Settling resets the dynamic.

  4.  **Mutual Escalation is a Trap:** Your friend nailed it. You accurately diagnose your neighbor is caught in the same self-justifying cycle. This is a classic conflict spiral. Continuing feeds it. Settling breaks it. Neither of you is "winning"; you're both just making lawyers richer. Recognizing this trap *is* the rational insight needed to escape it.

  **The Verdict:** Cut your losses now. Full stop. Go into mediation next week with the **primary goal of achieving an immediate settlement**. Your rational mind knows the $40k is gone. Don't throw good money (and significant stress) after bad based on pride and the illusion that past losses dictate future gains. A pragmatic settlement now is the strongest, most rational, and most reputationally sound move you can make. Use the mediation to secure clear, binding terms that draw a firm line under this dispute and provide a framework for any future interactions. Stop the bleeding.
