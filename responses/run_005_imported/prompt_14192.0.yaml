prompt: |-
  I host a science-and-ideas podcast, and next week's guest is an economist-turned-philosopher who's built a good chunk of her career on the claim that weakness of will just IS hyperbolic discounting, full stop -- she runs with Ainslie's old "picoeconomics" picture pretty much literally, successive selves bargaining across time like players in a repeated prisoner's dilemma. I've read enough of her papers to know shes got a smooth, well-rehearsed answer ready for the obvious "so what's hyperbolic discounting anyway" question, and honestly the picture is seductive enough that I catch myself half-believing it, which is exactly why I want to go in sharper than that.

  Could you draft me eight or nine interview questions, each with a short follow-up keyed to whatever dodge she'd most likely reach for? I want one question that makes her explain, in a way a smart lay listener could actually follow, why the reversal specifically needs a hyperbolic curve and wouldn't show up under exponential discounting at all. I want one that presses this worry: if her own model says the near reward really is valued more at the moment of choice, then no judgment is being violated, so is she explaining classical akrasia -- acting against your own considered best judgment, a la Davidson -- or just relabeling an ordinary preference reversal, and how's that supposed to square with people like Holton who tie weakness of will to caving on a resolution rather than reversing a judgment? I want one on whether her "competing interests" bargaining across time is meant as a real metaphysical claim about how a person persists, or just a convenient modelling fiction she'd drop the second somebody pushed on personal identity. And I want one on precommitment: if Ulysses contracts and Bratman-style planning let people resist temptation without the discount rate itself ever budging, doesn't that suggest discounting was never the whole story to begin with? Throw in a couple more if you've got good ones -- maybe something on whether its even fair to extrapolate discount curves measured off money-now-vs-money-later lab tasks onto messier real cases like doomscrolling or crash diets.
reasoning: |-
  Okay, the user hosts a science podcast and has an economist-turned-philosopher guest next week. This guest claims that weakness of will is essentially hyperbolic discounting, based on Ainslie's picoeconomics model. The user wants sharp questions that go beyond the guest's rehearsed explanations. 

  First, I need to understand the core of the guest's argument. She equates akrasia with hyperbolic discounting, where people devalue future rewards more steeply in the near term, leading to preference reversals. The user wants questions that challenge this view and expose potential weaknesses.

  The user specifically asks for questions on several key points: why hyperbolic discounting is necessary versus exponential, whether this model truly captures Davidson's akrasia or just preference reversal, the metaphysical implications of successive selves, and how precommitment fits into the model. Also, the user wants to question the extrapolation from monetary tasks to real-world behaviors.

  I should start by crafting a question about the necessity of the hyperbolic curve. The follow-up needs to push back if she handwaves about exponential discounting not matching data. The key is to make her explain the mathematical distinction clearly for lay listeners.

  Next, the Davidson vs. Holton point. If hyperbolic discounting means the near reward is genuinely valued more, is it akrasia or just rational preference shift? The follow-up should challenge whether resolutions (Holton) can be reduced to discounting.

  For the successive selves question, I need to probe if this is a real metaphysical claim or just a metaphor. The follow-up should push her to clarify the ontology—are these selves real or fictional?

  Precommitment is crucial. If Ulysses contracts work without changing discount rates, doesn't that imply other cognitive mechanisms are at play? The follow-up should question if discounting alone suffices.

  Additional angles: the realism of bargaining between selves, extrapolation from lab to real life, and whether the model can handle cases with no clear rewards (e.g., procrastination). Also, the role of emotions and affect, which might not fit neatly into discount curves.

  I should ensure questions are concise but layered, with follow-ups anticipating dodges. The user wants to avoid letting the guest retreat into rehearsed answers. Each question needs to pinpoint a specific weakness in her model, pushing for deeper philosophical engagement beyond the economic framework.
answer: |-
  Here are 9 sharp interview questions designed to cut through the rehearsed answers, complete with likely dodges and pointed follow-ups:

  1.  **The Curve Itself:** "You argue hyperbolic discounting is *essential* to explaining weakness of will because it predicts preference reversals. For our listeners who aren't economists: why *can't* standard exponential discounting produce these reversals? What's the fundamental mathematical difference that makes hyperbolic unique here?"
      *   *Likely Dodge:* "Exponential just shows stable preferences; hyperbolic captures the impulsivity we actually see in data."
      *   **Follow-Up:** "Right, but *why* mathematically? Imagine a listener sketching two curves: one exponential, one hyperbolic. At what point on the graph, specifically, does the hyperbolic curve *force* a reversal that the exponential curve avoids, even if both have steep initial slopes? What is it about the *shape* that necessitates the reversal?"

  2.  **Akrasia vs. Preference Reversal:** "If hyperbolic discounting means, at the moment of choosing the donut, I genuinely value it *more* than the future health benefit (due to the steep near-term curve), am I *really* acting against my best judgment? Or have I simply experienced a rational (given the curve) shift in preference? How does this square with Davidson's core definition of akrasia as acting *against one's own all-things-considered judgment*?"
      *   *Likely Dodge:* "The 'best judgment' is the later, cooler self's valuation. The reversal *is* the violation."
      *   **Follow-Up:** "But isn't that conflating two things? Richard Holton argues weakness of will is primarily about *abandoning a resolution*, not necessarily reversing a value *judgment*. If my 'later self' just has a different preference ranking due to discounting, have I been *weak-willed* (caving on a resolution), or have I just rationally updated my preferences based on temporal proximity? Where does the 'weakness' or normative failure enter *on your model*?"

  3.  **Metaphysics of Selves:** "The 'successive selves' bargaining model is vivid. But is this meant as a literal, metaphysical claim about how personal identity works over time? Or is it purely a heuristic model you'd abandon if pressed on the philosophical puzzles of persistence?"
      *   *Likely Dodge:* "It's a powerful model that captures the internal conflict phenomenologically and strategically. Whether selves are 'real' is a separate question."
      *   **Follow-Up:** "Understood. But if pressed, *could* your model function if we assume a single, enduring agent whose discount *function* changes based on temporal perspective, without positing distinct bargainers? If the 'selves' are *not* real, what does the 'bargaining' metaphor actually *add* beyond describing the output of a hyperbolic function?"

  4.  **Precommitment's Challenge:** "Precommitment devices like Ulysses contracts seem highly effective. Crucially, they work by changing the *choice architecture* (tying oneself to the mast), not by altering the underlying hyperbolic discount rate itself. Doesn't the *existence and effectiveness* of precommitment suggest that mechanisms *outside* the discounting function – like planning, rule-following, or commitment to past intentions (à la Bratman) – are essential to explaining how we *overcome* the discounting effect, implying discounting isn't the 'full stop' explanation?"
      *   *Likely Dodge:* "Precommitment is just a tool used by the 'later selves' to win the bargaining game against the 'earlier selves'. It's part of the picoeconomic framework."
      *   **Follow-Up:** "But doesn't the very *need* for and *design* of precommitment reveal that the discounting mechanism *alone* is insufficient? If hyperbolic discounting were truly the *whole* story of choice, wouldn't precommitment be impossible or irrational? Doesn't the act of successful precommitment rely on cognitive resources *not* reducible to the moment-by-moment discounting of the competing 'selves'?"

  5.  **The Bargaining Mirage:** "How literally should we take the 'bargaining' between selves? In a real prisoner's dilemma, players have distinct interests and make conscious strategic choices. Are my 'temporal selves' actually engaging in strategic reasoning, or is the 'bargaining' just a description of how the conflict *feels*, while the outcome is mechanically determined by the discount curve interacting with the stimulus?"
      *   *Likely Dodge:* "It's a model of strategic interaction. The 'choices' emerge from the conflict structure, even if not fully conscious."
      *   **Follow-Up:** "If the outcome is mechanically determined by the pre-set discount curve and the proximity of rewards, isn't calling it 'bargaining' potentially misleading? What genuine *agency* or *strategic choice*, beyond the curve's dictates, do these 'selves' possess? Isn't the 'bargain' just an epiphenomenon?"

  6.  **Beyond Money & Lab Snacks:** "Your evidence base leans heavily on discount rates measured in lab tasks (e.g., $10 now vs. $20 later). How confidently can we extrapolate this to explain complex, affect-laden real-world 'akrasia' – like doomscrolling despite knowing it breeds anxiety, or abandoning a crash diet when hungry? Aren't factors like visceral drives, emotional dysregulation, habit strength, and context far more salient here than pure temporal discounting?"
      *   *Likely Dodge:* "Hyperbolic discounting provides the fundamental temporal dynamic; other factors modulate it but the core reversal logic holds."
      *   **Follow-Up:** "But in cases like doomscrolling, the 'reward' is often ambiguous, fleeting, or even negative (anxiety buzz). Crash diets involve intense physiological deprivation. Doesn't reducing these to 'hyperbolic discounting of health vs. pleasure' risk grotesque oversimplification? What specific evidence shows that the *hyperbolic curve itself*, distinct from these other powerful factors, is the *primary* driver here?"

  7.  **Affect & Valuation:** "How does your model incorporate the role of immediate affect? When I choose the donut, isn't it often the *anticipation* of its taste/sugar rush *now* (high affect) overwhelming the *abstract knowledge* of future health costs (low affect)? Is hyperbolic discounting sufficient to capture this asymmetry in the *experienced intensity* of valuation, or is it primarily about the *timing*?"
      *   *Likely Dodge:* "The affect is precisely what steepens the discount curve for the immediate reward."
      *   **Follow-Up:** "But doesn't that just label the phenomenon? Does the model offer any insight into *why* affect has this steepening effect, or *how* it interacts with the discounting mechanism beyond being a parameter tweak? Is affect *constitutive* of the valuation process in your model, or just an input?"

  8.  **Procrastination & Negative Tasks:** "Hyperbolic discounting elegantly explains pursuing small immediate rewards over larger delayed ones. But what about classic procrastination – avoiding an aversive task *now* (like filing taxes) despite knowing it creates a *larger* aversive outcome *later* (penalties, stress)? Here, we delay *negative* utility. Does your model handle this 'negative akrasia' as naturally as the positive case, or does it require significant tweaking?"
      *   *Likely Dodge:* "It's symmetric. We discount future negative utility hyperbolically too, making the immediate avoidance seem preferable."
      *   **Follow-Up:** "Is the evidence for hyperbolic discounting of losses as robust as for gains? And doesn't the asymmetry of loss aversion complicate this? Further, in procrastination, the 'reward' is often just *relief* from starting the task – a small positive. Does this mean 'negative akrasia' ultimately reduces to the standard model of pursuing small immediate positives, or is there a genuine asymmetry?"

  9.  **The "Full Stop" Claim:** "You've built a career on 'weakness of will *just is* hyperbolic discounting, full stop.' Given the challenges we've touched on – the need for precommitment, the role of resolutions vs. judgments, the complexity of real-world cases, the potential mirage of 'bargaining' – is this 'full stop' claim still tenable? Could hyperbolic discounting be a *powerful component* or *necessary condition* for standard akrasia without being the exhaustive explanation?"
      *   *Likely Dodge:* "It captures the core temporal dynamic that underlies the phenomenon in its paradigmatic forms. Other factors are secondary."
      *   **Follow-Up:** "But doesn't the very existence of phenomena like *strength of will* (resisting the reversal via resolutions/precommitment) and the distinct nature of *judgment* vs. *preference* suggest that a purely *descriptive* model of shifting valuations, even a hyperbolic one, cannot fully capture the *normative* failure that philosophers like Davidson find essential to akrasia? Isn't the 'full stop' claim potentially reductive, missing the crucial normative dimension of acting *against one's own best judgment*?"

  **Key Interview Strategy:**

  *   **Listen Actively:** Pay close attention to her answers. If she offers a dodge you didn't anticipate, adapt your follow-up on the fly to pin down the core issue she's avoiding.
  *   **Clarify for Listeners:** Briefly rephrase complex points or her answers when necessary to ensure audience comprehension ("So, just to clarify for our listeners, you're saying that...").
  *   **Maintain Engagement:** Frame challenges respectfully but persistently: "That's a fascinating point, but let me push a bit further on X because..."
  *   **Control the Tempo:** Don't let her filibuster. Gently but firmly bring her back if she strays: "To focus back on the specific question about Y..."
  *   **End on Synthesis:** If time allows, ask her to briefly synthesize how she responds to the collective weight of these challenges to the "full stop" claim.

  These questions force engagement beyond the standard hyperbolic discounting spiel, directly confronting the philosophical and empirical tensions in her core thesis. Good luck with the interview!
