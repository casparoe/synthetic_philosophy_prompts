prompt: |-
  Got into a whole arguement with my friend last night about AI self-improvement and neither of us really won. He kept saying that the "Löbian obstacle" thing from that old Yudkowsky/MIRI tiling agents paper is basically just Gödel's second incompleteness theorem wearing a costume — like, a consistent system cant prove its own consistency, so obviously it can't fully trust a smarter future version of itself either, same problem just re-named. His conclusion was that since Gödel's theorem is a dead end, the whole "obstacle" is flatly unsolvable and all the later papers trying to work around it (weaker proof systems, parametric stuff, w/e) are basically cope dressed up in math. I felt like Löb's theorem was doing something extra there but couldn't articulate it well enough to push back properly, and now it's bugging me. Was he basically right, or is he missing something about what the obstacle actually is and what "making progress" on it would even look like?
