  okay so we're learning about the tragedy of the commons in APES and last night i went down a youtube rabbit hole and found this concept called 'superrationality' from a guy named hofstadter. basically if two people are TRULY rational (not just regular rational) they'll always cooperate in the prisoner's dilemma instead of defecting, since they both know the other person reasons the exact same way. doesnt this kind of disprove the whole tragedy of the commons thing where selfishness is supposed to wreck shared resources? like shouldnt it mean stuff like climate change or overfishing would basically sort itself out once people got rational enough, instead of needing laws and treaties to force everyone to cooperate?
