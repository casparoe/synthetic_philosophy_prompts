answer: |-
  Your question cuts to the heart of reconciling Hume's phenomenological account with modern formalizations. Hume's "mutually expressed and known to both" **does not deliver common knowledge (CK) in the strict epistemic game theory sense**, but rather a **high-order mutual knowledge (MK) reinforced by experience**, which *functionally approximates* CK for practical purposes. Here's a reconstruction and analysis:

  ### 1. **The Epistemic Gap: Finite Orders vs. Infinite Regress**
     - **Hume's Mechanism is Iterative, Not Foundational**: 
       - When Hume says the sense of interest is "mutually expressed, and known to both," he likely means *first-order mutual knowledge* (I know your interest, you know mine). 
       - The "repeated experience" builds *higher-order knowledge gradually*: After multiple interactions, I not only know your interest but also know *you know* mine (second-order), then know *you know I know* (third-order), etc. 
       - Crucially, this process **never logically reaches the infinite regress of CK** (where all orders are satisfied simultaneously). Instead, it achieves a *pragmatically sufficient depth* of MK ("confidence" from repeated success).

     - **Contrast with Lewis/Game Theory**: 
       - Lewisian conventions require CK of rationality and salience (e.g., from public signaling) to *coordinate instantly* on equilibria. 
       - Hume's convention emerges *from history*, not from shared epistemic priors. The rowers don’t start with CK; they achieve coordination through *feedback loops* of action and adjustment.

  ### 2. **Why Hume Doesn’t Need Strict CK**
     - **Stability via Reinforcement, Not Deduction**: 
       For Hume, convention isn’t upheld by agents *reasoning through* CK hierarchies. It’s upheld because:
       - Transgressions cause immediate losses ("inconveniences").
       - Successful coordination yields repeated gains ("slow progression" of force).
       - This creates **self-reinforcing expectations** ("confidence of future regularity").
       - *Example*: Property norms don’t require you to contemplate whether others know you know they know... You just observe that violations *consistently* lead to conflict, and compliance *usually* works.

     - **The Role of "Expression"**: 
       When Hume says interests are "mutually expressed," he means *revealed through behavior* (e.g., not stealing, rowing rhythmically), not through declarations. Each action is a signal that deepens mutual understanding iteratively.

  ### 3. **Reconstructing Hume in Modern Terms**
     Hume’s convention aligns best with **evolutionary or learning-based game theory**, not with **epistemic justifications for Nash equilibrium**:
     - **Evolutionarily Stable Strategy (ESS)**: 
       - Conventions arise from trial-and-error learning. A regularity (e.g., "respect possession") persists because deviating (theft) yields lower payoffs *in repeated interactions*. No CK needed—only adaptive learning.
     - **Correlated Equilibrium (CE)**:
       - Hume’s "common sense of interest" acts like a *correlating device* (past experience). Agents correlate actions based on *observed patterns* ("repeated experience of inconveniences"). CE requires only *common priors* (shared history), not CK of rationality.
     - **Fictitious Play Dynamics**: 
       - Agents form beliefs about others’ strategies from historical frequencies. After sufficient repetitions, beliefs converge to equilibrium *without CK*.

  ### 4. **Is There a Gap? Vocabulary vs. Substance**
     - **Not a Gap, But a Different Emphasis**: 
       Hume’s account is *descriptively richer* about *how* conventions emerge (historically, psychologically). Epistemic game theory *prescriptively explains* why conventions *should* hold under ideal rationality.
     - **The "Add-On" Insight**: 
       CK in Lewis/Schelling is a tool to solve coordination problems *absent history*. Hume shows history *replaces* the need for CK. Modern models (e.g., evolutionary games) formalize Hume’s insight: **Conventions can emerge from myopic learning, not hyper-rationality**.

  ### Conclusion
  Hume’s mechanism delivers **high-order mutual knowledge sustained by experience**, not strict CK. His convention is better modeled as:
  - An **evolutionarily stable regularity** (ESS), or
  - A **correlated equilibrium** where history is the correlating device.

  **Why later accounts use CK**: To explain coordination in *novel* situations (e.g., choosing driving sides in a new society). Hume explains conventions in *mature societies* with shared history. The "gap" reflects differing contexts, not a flaw. Hume’s gradualism undermines the *necessity* of CK for convention—showing conventions can arise from learning alone. Your instinct to connect him to evolutionary game theory is astute; it’s where his ideas resonate most powerfully today.
