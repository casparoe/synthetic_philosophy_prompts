  The rowing example is interesting. Rowers don't need to explicitly communicate; they adjust over time. Each successful repetition reinforces their expectation of the other's actions. This iterative process builds higher orders of knowledge but might not reach infinity. However, after many repetitions, it might approximate common knowledge for practical purposes.

  The user also asks if Hume's convention aligns better with correlated equilibrium or evolutionary stability, which don't require common knowledge. That makes sense. Hume's focus on mutual advantage and learning through experience sounds more like an evolutionary process. His "confidence in future regularity" comes from past interactions, not from a shared belief hierarchy.

  Another point: Hume explicitly rejects promises as the basis, emphasizing tacit understanding. This contrasts with game theorists who use common knowledge of rationality to justify Nash equilibria. Hume's convention is more about adaptive behavior than rational deduction.

  So, reconstructing Hume's epistemic structure: it's a finite but deepening mutual knowledge, reinforced by experience. It's not strict common knowledge, but functionally similar after many interactions. The gap between Hume and modern theory might be more about different emphases—process vs. structure—rather than a flaw in Hume's argument.

  The user might be concerned if Hume's account is sufficient for modern conventions. But Hume's gradual process explains stability without needing infinite regress, which is actually a strength. Correlated equilibrium or evolutionary game theory could model this better than common knowledge approaches. 

