answer: |-
  ## MEMORANDUM  
  **To:** Reproductive Genetics Ethics Advisory Committee  
  **From:** [Your Name], Patient Care Coordinator & Committee Member  
  **Date:** October 26, 2023  
  **Subject:** Recommendation on Policy for Reporting Non-Disease Polygenic Traits in PGT  

  ### 1. Background & Current Dilemma
  The recent availability of supplementary polygenic reports (including non-disease traits like predicted height and educational attainment) from our contracted genetics lab presents an unprecedented ethical challenge. A specific couple undergoing IVF for infertility (with no known carrier status) has requested the *full* report, including non-disease traits, to assist in selecting among chromosomally normal embryos. Our existing consent policy ("to reduce the risk of serious genetic disease and to support a healthy pregnancy") is insufficiently precise to address this request. The committee is divided on whether to suppress the trait module entirely or provide the full data to the couple.

  ### 2. Core Ethical Tension: Autonomy vs. Medical Purpose
  *   **The Autonomy Argument:** Withholding available genetic information about the couple's own embryos infringes on their reproductive autonomy. The data exists, the request is voluntary, and they are the legal decision-makers. Denial risks justifiable charges of paternalism.
  *   **The Medical Purpose Argument:** Embryo selection based on non-disease traits (especially cognitive proxies) constitutes enhancement, not healthcare. Facilitating this exceeds our practice's core mission of reducing disease risk and supporting healthy pregnancies. It risks normalizing ethically fraught selection based on preferences, not medical necessity, and could undermine public trust in reproductive genetics.

  ### 3. The Data Entanglement Challenge
  Critically, the underlying genetic variants are not cleanly partitioned. For example, variants associated with higher educational attainment scores are also linked to a modestly elevated risk of bipolar disorder. Instructing the lab to "report disease scores but suppress trait scores" may be technically impossible or result in incomplete/inaccurate risk information. This complicates any simple separation.

  ### 4. Recommendation: Prioritize Medical Purpose with Nuance
  **For the Pending Request:**  
  *   **Provide the full report to this couple** under strict conditions.  
  *   **Require immediate, mandatory pre-report genetic counseling** focused on:  
      *   The profound limitations and probabilistic nature of *all* polygenic risk scores (PRS), especially for non-disease traits (low predictive power, environmental influence, population biases).  
      *   Explicit discussion that "educational attainment" is a population-level research proxy, *not* a direct measure of intelligence or guaranteed outcome for an individual child.  
      *   The entanglement of some trait/disease risks (e.g., EA score & bipolar risk) and why suppression wasn't feasible.  
      *   Emphasizing the *medical* purpose of PGT (identifying serious disease risk, supporting implantation) vs. the speculative and ethically contested nature of trait selection.  
      *   Documenting this counseling thoroughly.  

  **For Standing Policy on Future Requests:**  
  *   **Suppress reporting of non-disease polygenic traits (e.g., height, educational attainment).**  
  *   **Report only polygenic risk scores for serious adult-onset diseases** (e.g., T2D, specified cancers, schizophrenia) *where clinically validated interventions or significant risk mitigation strategies exist*.  
  *   **Immediately revise consent forms and patient education materials** to explicitly state:  
      > *"Polygenic risk screening of embryos is offered solely to identify and reduce the risk of serious genetic diseases for which evidence-based medical interventions or preventive strategies are available. Screening for non-disease traits or characteristics is not performed or reported by this practice."*  
  *   **Engage with the genetics lab** to:  
      *   Understand the technical feasibility of truly separating disease-risk reporting from non-disease trait reporting in their pipeline.  
      *   Advocate for a lab-level option to disable non-disease trait reporting for our clinic.  
      *   Clarify validation status and limitations of *all* reported PRS.  

  ### 5. Justification for Restriction Despite Autonomy Concerns
  This recommendation prioritizes the practice's medical mission while acknowledging the current case's practical constraints:  
  *   **Medical Integrity:** Facilitating selection based on preferences like height or cognitive proxies falls outside the scope of medicine and the specific intent of reducing disease risk articulated in our consent. It crosses a line into enhancement.  
  *   **Precedent & Normalization:** Routinely providing non-medical trait scores establishes a dangerous precedent, normalizing selection for socially desirable characteristics. This risks exacerbating inequality and shifting societal expectations of reproductive technology.  
  *   **Mitigating Paternalism:** We respect autonomy by providing all *medically relevant* information (disease risks) and ensuring informed consent for that. Withholding *non-medical* trait information is not paternalism about health decisions, but a boundary-setting exercise defining the scope of our medical service. The counseling requirement for the current case further mitigates concerns.  
  *   **Leveraging the Entanglement:** The trait/disease linkage actually supports suppression. Reporting the trait module could inadvertently obscure or misrepresent entangled disease risks (like bipolar) if patients focus only on the trait score. Suppression avoids this confusion for future cases.  

  ### 6. Proposed Committee Action
  Vote to adopt the following motions:  
  1.  **Approve the release of the full report (including non-disease traits) for the current requesting couple,** contingent upon documented completion of mandatory, focused genetic counseling as outlined above.  
  2.  **Adopt a standing policy suppressing the reporting of non-disease polygenic traits for future PGT cases.**  
  3.  **Direct staff to revise consent forms and patient information materials** to explicitly state the limitation of screening to serious disease risks with actionable interventions.  
  4.  **Task the Coordinator (or designate) to engage with the genetics lab** regarding the technical feasibility of implementing trait suppression and the validation of reported PRS.  

  This approach balances the immediate practical reality and respect for the current couple's request (with robust safeguards) with a clear ethical boundary for the future that aligns our practice with its core medical mission and mitigates the significant societal risks of non-medical trait selection.  

  **Ready for discussion and vote on Wednesday.**
