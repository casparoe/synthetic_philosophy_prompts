prompt: |-
  Okay so this is going to sound oddly specific, but I need help writing a memo for my school's Athletic Council, which is this student-and-coaches group that handles appeals whenever there's a dispute about the Athletic Code (the contract every athlete signs about attendance, not quitting after the roster's set, etc). I'm one of the student reps this year, which is awkward right now because Monday's case involves Maya, one of my closest friends on the swim team, and I'm supposed to be neutral about it. She just found out she got into a really competitive summer violin intensive, except the placement auditions got moved up and now overlap with our last three weeks of the season, including the day of the state meet where she swims the medley relay. She wants to leave early. The Code says quitting after cuts costs you your letter and locks you out of starting another sport until the season's officially over, unless it's a "documented medical or family emergency" or some other circumstance the Council decides is compelling enough to count -- which is basically the whole fight, since nobody thinks a violin intensive is a medical emergency, but nobody ever wrote down what else could count. Here's the part that's been bugging me though: her actual relay teammates have all said they release her, no hard feelings, go do the violin thing. Our coach and a couple other Council members think that's beside the point, because the no-quitting rule isnt really there to protect specific teammates' feelings, its there so the team can plan rosters fairly for everyone, including kids who got cut this year and might've taken her spot.

  I got weirdly into this after a philosophy club thing a few weeks back where someone explained how Hume thought the obligation of a promise is basically just a useful convention society invented, not some deep fact glued onto the act itself, versus Scanlon (I think, correct me if I'm wrong) who argues you wrong the specific person by deliberately getting them to count on you, which seems to imply that once they release you, you're actually off the hook. Somebody else brought up this "practice" argument, maybe Rawls, that you can't just break a rule whenever it seems fine in one particular case, because the rule only does its job if people can generally count on it holding. Our situation feels like that exact fight, except with someone's whole season riding on the answer. Could you write the actual memo I'd bring Monday -- not a "here are three views, you pick" writeup, but something that actually lands on one recommendation (full release, deny it, or some conditional middle ground) and uses that theory stuff to earn the conclusion, while still being fair to the strongest argument against whatever you land on. It also needs to be short enough that I could read it out loud in the ten minutes we're allotted, not a whole treatise.
