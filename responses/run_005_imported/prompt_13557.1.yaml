  For the closer on falsifiability: Philosophers often deflect this, so the question must force engagement. Perhaps frame it as "What would make you concede functionalism is wrong?" - making personal stakes explicit.

  Noticing the user's phrasing ("doesn't just let her restate", "smuggles biology-shaped bias") suggests they suspect functionalism might be circular. My questions should help them probe that without being combative. The tone stays respectful but persistently skeptical where needed.

