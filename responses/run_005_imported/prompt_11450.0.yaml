     - Progressive: The program generates novel predictions, some of which are confirmed, and leads to new discoveries.
     - Degenerating: The program is constantly patched up with ad hoc adjustments without leading to new, verified predictions.
  3. **Duhem-Quine Thesis**: Theories are tested in conjunction with auxiliary hypotheses. Thus, when a test fails, it could be due to the auxiliary hypotheses rather than the core theory. This makes absolute falsification difficult, but we can still evaluate the health of the program.
  4. **Grünbaum's point on Psychoanalysis**: Even if a theory is complex, it might still be falsifiable in principle. We must check if there are clear ways to test it.
  5. **Laudan's Demise of Demarcation**: We should be wary of drawing a sharp line, but we can still ask: is the belief well warranted by evidence and reasoning?

