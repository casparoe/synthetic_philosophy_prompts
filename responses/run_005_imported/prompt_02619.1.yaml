  2. **Invariance solution (Jaynes)**: Require that the probability distribution be invariant under transformations that the problem's symmetries allow (like rotation, translation, scaling). Jaynes argued that only one method (the one giving 1/2) satisfies this.

  3. **Privileged-partition view**: There is a single fundamental way to parametrize the space (e.g., the space of chords) and we should apply indifference only to that. Then derive other quantities. The challenge is identifying the privileged partition.

