answer: |-
  The candle guttered, throwing gaunt shadows of compass and straightedge across the parchment. Sir Thomas Hobbes, hunched like a brooding owl, traced the arc one more time. The circle sat, perfect, implacable, a silent accusation in charcoal. Around it, the intricate lattice of his latest attempt to generate an equal square pulsed with geometric intensity – angles sharp, lines clean, ratios meticulously calculated.

  *There*. The point of intersection. It *must* be the key. His thin, ink-stained finger hovered, trembling slightly, not with doubt, but with the fierce concentration of a mind grappling with pure form. This wasn't physics, not the messy, contingent world of colliding billiard balls or the fallible testimony of the senses. This was *Geometry*. The realm of *his* making.

  He recalled the chaos outside Malmesbury, the visceral stink of fear during the war, the shifting sands of political allegiance. Men, like billiard balls, bounced off each other, driven by hidden passions, their causes murky, inferred only through the fog of their effects. Reason, there, was a fragile shield against unreason. But here, at his desk? Here, he was creator and knower. He *defined* the point. He *postulated* the line. He *constructed* the figure. Their causes weren't hidden; they were his own volition made manifest. To know the cause was to possess absolute certainty. Geometry was the bulwark against the epistemological chaos of the natural world.

  Wallis. The name was a splinter under his fingernail. That arrogant Savilian Professor, with his newfangled algebra, his *Arithmetica Infinitorum*, mocking him in print, reducing his life's work to folly. Wallis dealt in symbols, in endless, formless series, in approximations! He understood nothing of the *essence* of knowledge. How could one claim certainty about a circle by summing an infinity of vanishingly small triangles? It was an admission of defeat, a surrender to the same inferential weakness that plagued natural philosophy. No. True knowledge demanded direct apprehension of cause through rational construction.

  He adjusted the compass minutely, its metal cold against his skin. The point bit into the parchment. He drew a new line, radiating from the circle's center, intersecting the carefully constructed perpendiculars and tangents of his system. His breath caught. The proportions… Pythagoras whispered in his ear. The relationship between the radius and this new segment… it felt *inevitable*. Like the logical unfolding of a political treatise from first principles – the necessity of the Sovereign arising from the nature of Man.

  This *had* to be it. The final construction. The square's side length determinable directly from the circle's radius, generated by the pure, unmediated action of reason wielding its tools. If he could just *see* it, assemble the proof with Euclidean rigor, then Wallis and his ilk would be silenced. More importantly, the bedrock of his philosophy – that human reason, when confined to the realm of its own constructions, could achieve perfect, unassailable certainty – would be vindicated. It would prove that *some* knowledge could stand immune to the skepticism that corroded all else.

  He worked feverishly, the scratch of the quill the only sound. Theorem built upon theorem. Lemma followed lemma. Each step was a declaration: *I cause this to be; therefore, I know it absolutely.* The circle, once an emblem of nature's impenetrability, was becoming a testament to human intellectual sovereignty. He felt the old fire, the clarity that had driven his political theory. Here, in the ordered universe of points and lines, was the model for the ordered Commonwealth. Both were products of rational design.

  Hours bled into the candle's dying pool of wax. He reached the final proposition. Holding his breath, he calculated the area of his constructed square based solely on the radius defined at the outset. Then, the area of the circle. He compared the expressions. His heart, a traitorous lump of meat in his chest, hammered against his ribs. The numbers… they didn't match. Not quite. A fraction. An infinitesimal discrepancy.

  *No.* He checked the construction. Re-traced the angles. Re-calculated the ratios. The error persisted. Not a flaw in his reasoning, he told himself fiercely. It must be a misapplication. A stray mark on the parchment. The candlelight was poor. His hand, old and tired, had slipped. The *idea* was sound. The *cause* was known – his own rational construction. The *effect* – the equality of areas – *must* follow. Geometry could not betray him. It was the one thing that couldn't.

  He sharpened his quill with abrupt violence. He would start again. A new approach. Perhaps the cycloid held the key? Or a different series of proportional means? He drew a fresh circle, its perfect curvature a silent challenge. His hand, guided by decades of discipline, moved the compass with unwavering precision. The point, the line, the arc – all sprang from his will.

  Outside, the London night was indifferent. Stars, those distant, unknowable bodies, shone with cold, natural light. But here, in the circle of candlelight, Thomas Hobbes bent his formidable will over the parchment, constructing and re-constructing, driven not by stubbornness, but by the terrifying, beautiful conviction that if geometry failed him, then all certainty – about man, about society, about the very capacity of reason to grasp truth – would dissolve into the same chaotic darkness that swallowed the world beyond his study walls. The circle had to yield. Reason demanded it. His entire philosophy depended on it. He would find the construction, because it *had* to exist. It was the only thing that could.
