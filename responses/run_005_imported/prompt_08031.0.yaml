  You're absolutely not being overly sentimental, and there's a strong logical case against your uncle's reasoning. The core flaw isn't factual (Duke *can't* work anymore), but **ethical and philosophical**. Your discomfort stems from recognizing that reducing a sentient being solely to its utility is morally problematic, even if it doesn't have "human rights."

  Here's the breakdown of why your uncle's view is flawed:

  1.  **The Instrumentalization Fallacy:** Your uncle treats Duke purely as an instrument (a tool for guarding). The ethical problem arises when we treat *sentient beings* (capable of experiencing pleasure, pain, fear, comfort, and forming bonds) as mere instruments whose value *only* derives from their usefulness to us.
      *   **Logical Extension:** If usefulness is the *only* criterion, why stop at old dogs? Should we discard pets who get sick and incur vet bills? Retired service animals? Animals in research labs once the experiment is over? This logic quickly leads to places most people find morally repugnant.
      *   **The Core Principle:** Sentience itself creates moral obligations. Because Duke *can suffer* (physically from neglect or euthanasia without cause, and likely emotionally from confusion or loss of his home/family) and *can experience well-being* (comfort, affection, security), we have a duty to consider his interests, not just his utility.

  2.  **The Implied Contract of Domestication:**
      *   Humans domesticated dogs. We bred them to depend on us. We brought Duke into the human world and specifically into your grandfather's home and care.
      *   This creates an **implied ethical contract**. By taking responsibility for his life, your grandfather incurred an obligation to care for Duke *throughout his natural lifespan*, meeting his needs (shelter, food, water, basic vet care, humane treatment) *because he is a dependent being*, not just while he was useful.
      *   Abandoning that responsibility (via unnecessary euthanasia) when he becomes inconvenient or unprofitable violates this fundamental relationship built on dependence and trust.

  3.  **Virtue Ethics: Character and Compassion:**
      *   How we treat vulnerable beings reflects on our character. Choosing to end a life *solely* because it's no longer profitable demonstrates a lack of compassion, loyalty, and kindness – virtues most societies value.
      *   Dismissing a loyal companion of 12 years because he can't earn his keep anymore speaks to a disturbing coldness and transactional view of relationships. It reduces loyalty (which Duke likely showed) to a one-way street.

  4.  **Moral Psychology and Empathy:**
      *   Our capacity for empathy towards other sentient creatures is a cornerstone of human morality. Feeling discomfort at the idea of discarding a dependent, elderly animal *is* a healthy moral response. Your family's lack of reaction is arguably more concerning than your uncle's initial statement. It suggests a desensitization or a very narrow view of moral obligation.

  5.  **Distinguishing Humane Euthanasia from Convenience Killing:**
      *   Euthanasia can be a profound act of mercy **when an animal is suffering unbearably with no hope of relief**. This is about alleviating suffering for *the animal's sake*.
      *   Your uncle's proposal is **convenience euthanasia** – ending a life to avoid cost or hassle, or to free up resources for a "better" model. The motivation is entirely self-serving, not compassionate. Duke's inability to guard isn't causing *him* suffering; it's causing *inconvenience* to the humans.

  **Addressing Your Friend's Point ("He's a dog, not a person"):**

  Your friend is technically correct that dogs don't have the *same* moral status as humans. **But "not the same" does not mean "no moral status at all."** Sentience grants *some* moral status. We generally agree it's wrong to torture a dog for fun, right? That's because we recognize its capacity to suffer. Similarly, killing it *without just cause* (like unrelievable suffering) is wrong *because* it ends a life capable of positive experiences and causes suffering in the process. The "just cause" here is defined by the dog's well-being, not his job performance.

  **Why You Struggled in the Moment (and How to Frame It Now):**

  The emotional shock and the starkness of the transactional view made it hard to articulate. The arguments above aren't always intuitive when faced with cold pragmatism. Here's how you could frame it now:

  *   "I understand Duke can't work anymore. But that doesn't mean his life has no value *to him* or that we have no responsibility towards him. He's been a loyal part of the family for 12 years and depends on us completely. Ending his life just because he's old and costs money feels like betraying that trust and treating him like disposable equipment, not a living being we chose to care for."
  *   "If he was suffering terribly, euthanasia might be kind. But his only 'problem' is being old and retired. We don't discard grandparents when they retire or get sick. We care for them because they're family. Duke deserves that basic loyalty too."
  *   "The argument isn't that he has human rights. It's that *because* he's a sentient creature completely dependent on us, we have a duty to care for him humanely until he dies naturally or his suffering requires euthanasia *for his sake*."

  **Conclusion:**

  You are not being dramatic. Your uncle's reasoning is ethically flawed because it reduces a sentient, dependent being to pure utility, ignoring the moral obligations created by domestication, dependence, sentience, and basic compassion. It confuses justifiable euthanasia (based on suffering) with unjustifiable killing (based on inconvenience). Your discomfort is a sign of a healthy moral compass recognizing that some things – like loyalty and the well-being of a dependent creature – hold value beyond mere usefulness or cost. Duke deserves care in his old age because he *exists*, because he *feels*, and because your grandfather took on that responsibility when he brought him home. That *is* the logical case.
