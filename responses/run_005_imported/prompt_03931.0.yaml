  Also noting the user cares about close reading (they specified the translation). So I'll keep analysis text-anchored. Their frustration with the Amazons dismissal is valid - it's one of the least convincing moments in Spinoza's political writing. Might be worth contrasting with his more nuanced treatment of religious minorities elsewhere.

