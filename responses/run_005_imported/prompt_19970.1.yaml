prompt: |-
  Okay so this has been living rent free in my head for like two weeks now and I can't tell if I'm overthinking a simple decision or if there's genuinely no clean answer here, so I wanted some outside input.

  Some backstory: I dated someone for about four years, and if that relationship taught me anything its that this woman could read me scary well - like she'd know which of two shirts I was gonna wear before I even put it on, or that I was about to quit my job weeks before I told anybody. We broke up pretty badly last year and don't talk anymore except through mutual friends. Here's the actual situation: I found out through one of those friends that she's planning to show up and confront me in front of everybody at one of two things happening this weekend - my sister's baby shower, or an engagement party for another mutual friend, both Saturday afternoon on opposite sides of town, so there's no doing both. Apparently she's already made up her mind which one, but hasn't told anyone which - just that she's decided and isn't the type to change plans once she's committed to something, so its not like she's gonna wait and see where I actually turn up and then follow me there. She's locking in her choice ahead of time, based purely on her own guess of where I'll be. Nobody I've talked to, including the friend who told me all this, has any clue which one she landed on. And skipping both isn't really an option either since I already promised my sister I'd be there.

  Here's where my brain breaks: since she's basically never wrong when she calls stuff like this about me, it feels like whichever event I pick, I should just assume that's the one, because that's exactly the kind of thing she'd have called. Which makes me want to switch to the other one instead. Except, if she knows my patterns well enough to predict where I'd normally go, wouldn't she also see the "switch it up at the last second to be clever" move coming from a mile away too? A friend suggested I just flip an actual coin right before and go with whatever it lands on, since then not even I know in advance what I'll do - but I can't tell if that's genuinely different from just picking on a whim myself, or the exact same thing wearing a disguise. I'm not looking for relationship advice here, I just want to know: is there an actual logical strategy for picking in a situation like this, or is this one of those rare cases where thinking harder just doesn't buy you anything, unlike pretty much every other decision I can think of?
