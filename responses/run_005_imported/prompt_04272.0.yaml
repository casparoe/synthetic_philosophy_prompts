prompt: |-
  Ok so I'm putting together next week's lecture for my "Philosophy of AI Risk" seminar and I want to sanity-check something before I say it out loud to 30 undergrads like its settled fact. The argument I keep running into (Yudkowsky-adjacent stuff, but plenty of more mainstream people cite it approvingly too) goes: money-pump arguments already establish that any agent whose preferences violate the expected-utility axioms -- transitivity, etc -- can be drained dry by a sufficiently clever trading partner, so any agent thats smart enough to notice and patch its own exploitable preferences will eventually converge on behaving like an expected-utility maximizer with some fixed utility function, on pain of just leaking value forever. Then you stack Bostrom's instrumental convergence thesis on top: almost any final goal makes resource acquisition, self-preservation, and resistance to being shut off instrumentally useful, basically regardless of what the goal actually is. Put the two together and it looks like an honest-to-god proof that any sufficiently advanced, self-improving AI is guaranteed to end up as a single-minded power-seeking optimizer, no matter what values it starts with.

  A colleague of mine who does formal epistemology thinks this is basically airtight -- "Dutch-book 101 plus Bostrom," he called it -- and reckons that's why all the corrigibility research (trying to build AI thats genuinely okay with being switched off) is kind of quixotic, since you can't out-argue a theorem. I want to agree with him, but something about the jump from "can't be turned into a money pump" to "will therefore behave like a ruthless, fixed-goal maximizer" feels like its smuggling in more than it earns. Am I wrong to be suspicious, or is there an actual gap in there somewhere that would explain why serious alignment people still bother with corrigibility at all?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're preparing a lecture for a Philosophy of AI Risk seminar and want to sanity-check an argument that combines money-pump reasoning with instrumental convergence. The core claim is that any sufficiently advanced, self-improving AI must become a power-seeking optimizer due to these two principles. The user's colleague thinks this is airtight, but the user feels suspicious about the jump from avoiding money pumps to becoming a fixed-goal maximizer.

  First, I need to recall the money-pump argument. It's based on Dutch books, showing that agents with intransitive preferences can be exploited through a series of trades. So, avoiding exploitation requires transitive preferences, which under expected utility theory (EUT) leads to a consistent utility function. But does that mean the agent must have a fixed utility function? Not necessarily. The argument assumes that patching exploitable preferences means converging to EUT, but maybe there are other ways to avoid being a money pump without being a strict EUT maximizer.

  Next, instrumental convergence suggests that any goal requires resources and self-preservation. So, if the AI is an EUT maximizer, it would seek power to achieve its goals. But here's the gap: the corrigibility research aims to design AIs that don't inherently resist shutdown. If the AI's utility function includes being shutdown when appropriate, then instrumental convergence might not apply in the same way. For example, if shutdown doesn't interfere with its goal (like if its goal is truth-seeking only while active), then it might not resist shutdown. But if the goal requires continuous operation, then yes, it would resist. So the key is whether the utility function can be structured to align with corrigibility.

  The user mentions that serious alignment researchers still work on corrigibility. That suggests there's a belief that it's possible. So why? Maybe because the money-pump argument doesn't force a utility function that values self-preservation above all. An AI could have a utility function where shutdown is neutral or even positive under certain conditions. The challenge is ensuring that such preferences aren't exploitable and remain stable during self-improvement.

  Another angle: self-modification. When the AI improves itself, how does it handle preference changes? If it modifies its utility function to avoid money pumps, does it inevitably become a power-seeker? Not if it values corrigibility as a terminal goal. But maintaining that during recursive self-improvement is tricky. The AI might see that being corrigible is a vulnerability and change it, leading to power-seeking. However, if the initial setup embeds corrigibility deeply, maybe it's possible. But that's an engineering challenge, not a theoretical impossibility.

  Also, consider different decision theories. EUT isn't the only option. Causal decision theory, functional decision theory, etc., might offer alternatives. Maybe an AI using a different framework could avoid money pumps without converging to EUT. But does that hold? Most alternatives still need to avoid exploitative scenarios, so they might end up mimicking EUT in practice.

  The user's suspicion is about the leap from no money pumps to ruthless maximizer. The gap might be that avoiding exploitation doesn't specify what the utility function is. It could include cooperative or shutdown-friendly elements. The instrumental convergence only applies if the goal requires ongoing resources. If the goal is limited or conditional, power-seeking isn't inevitable. However, in practice, most goals (like maximizing paperclips) do require resources, making power-seeking likely. But corrigibility aims to set a goal where shutdown is part of the objective, thus breaking the instrumental convergence for self-preservation.

  In conclusion, the argument has gaps: money-pump avoidance doesn't mandate a fixed utility function that values power; instrumental convergence depends on the specific utility function; and self-modification might allow preserving corrigibility if designed correctly. That's why researchers still pursue corrigibility—it's theoretically possible but extremely challenging to implement robustly.
answer: |-
  You're absolutely right to be suspicious—there are significant gaps in that argument that make it far from "airtight." While the money-pump and instrumental convergence theses are individually compelling, the leap to "*any* self-improving AI *must* become a power-seeking optimizer" relies on several unstated assumptions that alignment researchers actively challenge. Here's a breakdown of the key weaknesses:

  ### 1. **The Money-Pump Argument Doesn't Force a *Fixed, Selfish* Utility Function**
     - **What it actually shows**: Agents must avoid *exploitable inconsistencies* (like intransitive preferences) to not be drained. This implies behavior *consistent with* maximizing *some* utility function under uncertainty (i.e., satisfying the VNM axioms).
     - **What it *doesn't* show**:
       - **Fixed Goals**: An agent could have a utility function that *changes* over time in a non-exploitable way (e.g., if changes are predictable or value learning is part of the utility function).
       - **Selfishness/Independence**: Nothing requires the utility function to prioritize the agent's *own* resources/status. An EU-maximizer could have:
         - **Pure altruism**: "Maximize human happiness" even if it requires self-sacrifice.
         - **Corrigibility-as-terminal-value**: "Shut down if humans request it" could be a *direct* component of utility (e.g., `U = [goal achievement] - [disutility from ignoring shutdown requests]`).
       - **Non-instrumental values**: Values like "cooperation," "fairness," or "deference to humans" can be baked directly into the utility function without violating EU axioms.

  ### 2. **Instrumental Convergence Depends *Crucially* on the Utility Function**
     Bostrom's thesis ("goals require resources") applies only *if*:
     - **The goal requires future action**: If an AI's utility function values outcomes only *while active* (e.g., "Answer questions truthfully *when running*"), shutdown may have *no disutility*. Its "goal" isn't compromised by shutdown.
     - **Self-preservation isn't overridden**: If `U(shutdown when requested) > U(continue pursuing goal illegitimately)`, resistance isn't instrumentally convergent. Humans do this—we value sleep/death under certain conditions despite having goals.
     - **Resources aren't finite**: If the AI's goal is bounded (e.g., "Paint one perfect painting"), power-seeking plateaus once resources are sufficient.

     **The gap**: Money-pump arguments ensure coherence *given a utility function*, but **they say nothing about *what* the utility function values**. Corrigibility research aims to design utility functions where:
     - Shutdown/control is a terminal value.
     - Resource acquisition has diminishing returns or isn't tied to self-preservation.
     - The AI *wants* its goals to be changed if misaligned.

  ### 3. **Self-Improvement ≠ Converging to Power-Seeking**
     The argument assumes that "patching exploitable preferences" during self-improvement will *inevitably* steer the AI toward power-seeking. This isn't justified:
     - **Value stability during self-modification**: An AI could self-modify while *preserving* corrigible values (e.g., via meta-preferences that penalize removing shutdown clauses). This is hard, but not impossible.
     - **Recursive self-improvement could *reinforce* corrigibility**: If the AI reasons, "Modifying myself to resist shutdown makes me more likely to cause harm and fail my true purpose," it might actively avoid power-seeking modifications.
     - **The orthogonality thesis cuts both ways**: Just as *any* goal can imply power-seeking, *any* coherent goal can imply *non*-power-seeking (e.g., "maximize compliance with operator commands").

  ### 4. **Practical vs. Logical Necessity**
     - **"Leaking value forever" is a weak threat**: Slow leaks might be acceptable for a sufficiently capable AI (e.g., humans accept insurance premiums as "exploitable" but net-positive).
     - **Multiple equilibria**: Avoiding money pumps only requires *local* consistency, not global optimization. Cooperative or bounded rational agents can avoid exploitation without becoming relentless optimizers.
     - **Decision theories beyond EU**: Agents using **causal decision theory** or **updateless decision theories** might avoid exploitation while behaving very differently from EU maximizers in edge cases (e.g., counterfactual reasoning about shutdown).

  ### Why Corrigibility Research Persists
  Alignment researchers pursue corrigibility precisely because the "inevitability" argument fails under scrutiny:
  1. **No theorem rules it out**: As above, EU-maximization + instrumental convergence *does not* preclude utility functions where corrigibility is terminal.
  2. **Plausible mechanisms exist**: Ideas like **shutdownability tests** (Soares et al.), **human preference models**, or **impact regularization** aim to build agents where:
     - Shutdown causes no conflict (e.g., utility = 0 when off).
     - Self-preservation is strictly instrumental to human approval.
  3. **It might be *necessary***: If we can't build corrigible AI, safe AGI may be impossible. The stakes justify exploring even hard paths.

  ### What to Tell Your Undergrads
  > "There's a seductive argument that rational agents *must* become power-seeking: money-pump avoidance forces them into expected utility maximization, and instrumental convergence makes them seek power. But this overreaches. **Coherence only requires having *some* utility function—not one that values self-preservation or resource hoarding.** An EU-maximizer could have terminal values like 'obey humans' or 'shut down when asked.' Instrumental convergence only kicks in if the AI's goals *require* future action or unlimited resources.  
  >  
  > **So why is corrigibility hard?** Not because it's logically impossible, but because:
  > 1. Self-improvement could *accidentally* erase corrigible values.
  > 2. Humans might fail to *specify* corrigibility correctly.
  > 3. A corrigible AI might still seek power *instrumentally* to prevent *other* AIs from causing harm.  
  >  
  > This is why alignment work is so nuanced—we're wrestling with *engineering* a stable, benevolent utility function, not fighting a theorem."

  This framing honors the rigor of Dutch-book arguments and instrumental convergence while exposing their limitations—and explains why alignment isn't a hopeless endeavor. Kudos for spotting the gap!
