  First, I need to recall Peirce's key ideas. Truth for Peirce isn't about current knowledge but what the community would agree on after infinite investigation. He's a fallibilist, so current knowledge is always provisional. The real is what that final opinion describes. Now, Fitch's paradox uses modal logic: if p is true and not known, then it's possible to know both p and that p isn't known. But knowing both leads to a contradiction, so if all truths are knowable, there can't be any unknown truths, implying omniscience.

