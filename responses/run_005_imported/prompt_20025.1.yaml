prompt: |-
  I serve on the clinical ethics committee of a psychiatric hospital, and we have been asked to resolve a case involving what our consult-liaison psychiatrist calls a "Ulysses contract." Six months ago, while clinically stable, a patient with a long history of bipolar I disorder signed a directive instructing the team to hospitalize and medicate her against her contemporaneous wishes if she became manic again, provided that two psychiatrists uninvolved in drafting the document certified that she met behavioral criteria she had chosen herself in advance: several consecutive nights without sleep, initiation of large unplanned purchases, and refusal of outpatient follow-up. She now meets all three criteria, as confirmed independently by two psychiatrists. The complication is that she is neither confused nor incoherent: she converses fluently, passes our standard capacity assessment without difficulty, and gives a clear, reasoned argument for wanting to leave and refuse medication, including the claim that the woman who signed the contract "was afraid of herself in a way I'm no longer afraid of." Our hospital's advance directive policy was drafted with end-of-life care in mind and says nothing about directives that anticipate a future psychiatric crisis, so the committee has no internal precedent to invoke. Roughly half the committee wants to honor her present, apparently capacitous refusal; the other half wants to enforce the contract, on the grounds that its entire point was to withstand exactly this kind of persuasive-sounding reversal, and they have started comparing it to the way a constitution binds a later legislature even when that legislature has the votes to change it.

  Could you draft the short memo I will circulate before Friday's meeting? It should recommend, concretely, whether we honor the contract or her current refusal; lay out a specific procedure and timeframe for acting on that recommendation; and take the strongest version of the losing side's argument seriously rather than treating it as an obvious mistake.
reasoning: |-
  Okay, the user is on a clinical ethics committee at a psychiatric hospital dealing with a complex case involving a Ulysses contract. They need a memo recommending whether to honor the advance directive or the patient's current refusal, with a clear procedure and timeframe. They also want the losing side's argument taken seriously.

  First, I need to understand the core conflict. The patient signed an advance directive when stable, specifying criteria for involuntary treatment during mania. Now she meets those criteria but appears capacitous and refuses treatment. The committee is split between respecting her current autonomy and upholding her past directive designed for this exact situation.

  The memo must balance several ethical principles: autonomy (both past and present), beneficence, non-maleficence, and justice. The patient's argument that her past self was "afraid in a way I'm no longer afraid of" is particularly poignant - it suggests her current self views her manic state as authentic, while her past self saw it as pathological.

  For the recommendation, I'm considering leaning toward enforcing the contract because:
  - It was designed specifically for manic episodes where insight is impaired
  - She created clear, objective behavioral criteria precisely to avoid relying on capacity assessments during mania
  - Not enforcing it would undermine the entire purpose of such contracts

  But I need to give serious weight to the counterargument:
  - Her current capacity assessment is formally valid
  - Enforcing could damage therapeutic alliance
  - There's risk of pathologizing authentic preferences

  The procedure should be time-bound - perhaps 72 hours for reevaluation to see if the episode resolves or her capacity fluctuates. Documentation is crucial to capture the reasoning.

  The memo should acknowledge this is ethically complex with valid concerns on both sides. The comparison to constitutional law is useful but imperfect since constitutions have amendment procedures whereas this contract doesn't. 

  I should emphasize that this case highlights the need to develop specific policies for psychiatric advance directives, which differ significantly from end-of-life directives. The current policy gap creates this dilemma.
answer: |-
  ## MEMORANDUM  
  **TO:** Clinical Ethics Committee  
  **FROM:** [Your Name], Clinical Ethics Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation Regarding Ulysses Contract for Patient [Patient Initials/ID]  

  ### I. RECOMMENDATION  
  **Honor the Ulysses contract and proceed with involuntary hospitalization and medication**, provided the patient continues to meet the pre-defined behavioral criteria. However, implement an **immediate 72-hour reassessment protocol** to rigorously test the stability of her current capacity and clinical state before finalizing treatment.  

  ### II. RATIONALE  
  1. **Purpose of the Contract**: The directive was explicitly designed to override the patient’s refusal *during mania*, even if she appears capacitous. Her current articulate refusal ("the woman who signed was afraid... I'm no longer afraid") exemplifies the *loss of insight* characteristic of mania that the contract anticipated.  
  2. **Precedent of Pre-Commitment**: Ulysses contracts derive moral force from the patient’s prior autonomous choice to protect their long-term values against episodic illness. Invalidating it now undermines this critical psychiatric tool.  
  3. **Limits of Capacity Assessments**: While she passes standard capacity tests (understanding, reasoning, expressing choice), bipolar mania can distort *appreciation* and *reasoning consistent with values*. Her dismissal of her past self’s fears suggests impaired ability to weigh risks meaningfully.  

  ### III. STRONGEST COUNTERARGUMENT (Why Honor Current Refusal?)  
  The opposing view merits serious consideration: Enforcing the contract against a capacitous patient violates *current* autonomy and medical ethics principles. Her reasoned arguments and coherent exam suggest she may authentically reject her past self’s judgment. Overriding this risks paternalism, eroding trust, and pathologizing identity evolution. If she possesses capacity, her "here and now" wishes should prevail, regardless of prior instructions.  

  ### IV. PROCEDURE & TIMEFRAME  
  1. **Immediate Action (0–24 Hours)**:  
     - **Hospitalize** under the authority of the Ulysses contract.  
     - **Withhold medication** temporarily pending reassessment.  
     - **Inform Patient**: Explain the committee’s decision, the reassessment process, and her right to appeal.  

  2. **Comprehensive Reassessment (24–72 Hours)**:  
     - **Repeat Capacity Assessment**: Conduct by a *third psychiatrist* unaffiliated with initial certifications, using a **bipolar-specific capacity tool** (e.g., MacCAT-T or BCAT) focusing on *appreciation* of illness consequences and *consistency with enduring values*.  
     - **Collateral Review**: Interview family/outpatient providers to contextualize her "reasoned arguments" (e.g., is her rejection of past fear a recurring manic narrative?).  
     - **Symptom Monitoring**: Document sleep, impulsivity, and insight hourly.  

  3. **Final Decision (72 Hours)**:  
     - If she **no longer meets criteria** or **demonstrates durable capacity** (confirmed by reassessment), convene an emergency committee review to reconsider honoring her refusal.  
     - If she **continues to meet criteria** and **reassessment confirms impaired appreciation**, proceed with medication per the contract.  

  ### V. LONGER-TERM ACTIONS  
  1. **Policy Revision**: Draft hospital guidelines for psychiatric advance directives (distinct from end-of-life directives) addressing:  
     - Criteria for triggering Ulysses contracts.  
     - Required reassessment protocols.  
     - Conflict-resolution pathways.  
  2. **Documentation**: Log this case as a precedent for future committees.  

  ---  
  **This recommendation balances respect for the patient’s pre-emptive autonomy with safeguards against erroneous enforcement. The 72-hour window ensures her current capacity is not illusory while upholding the contract’s intent to prevent mania from irrevocably undermining her life goals.**
