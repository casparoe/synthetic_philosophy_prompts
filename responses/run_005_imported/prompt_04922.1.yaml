prompt: |-
  I sit on my company's Experimentation Review Board, the internal group that must sign off before an A/B test result can be used to justify a permanent product change. The growth team stopped their onboarding-flow test on day 9 of a planned three-week run, the moment the frequentist p-value for the conversion-rate difference crossed 0.05, and now want to ship on that basis; our statistician objects on optional-stopping grounds, but the growth PM counters that a colleague re-ran the same nine days of data through a Bayesian beta-binomial model, got a 97% posterior probability that the new flow is better, and argues that number is untouched by the objection, since Bayesian updating doesn't care why or when you decided to look at the data. The board is split on whether that reply actually defeats the statistician's objection or just relocates it. Please draft the board's written decision memo: rule on whether the rollout can proceed, with a concrete timeline for whatever you recommend, and set a monitoring policy for future tests -- and make sure whichever side you rule against gets a fair hearing rather than a one-line dismissal.
reasoning: |-
  We are faced with a situation where the Growth Team stopped an A/B test early (on day 9 of a planned 21-day run) because the frequentist p-value crossed the 0.05 threshold. The statistician on the board objects due to optional stopping (peeking and stopping early inflates the Type I error rate in frequentist methods). The Growth PM counters by presenting a Bayesian analysis (beta-binomial model) on the same data, which shows a 97% posterior probability that the new flow is better, and argues that Bayesian methods are immune to the optional stopping problem because the posterior is updated solely based on the data observed, regardless of the stopping rule.

  Key points to consider:

  1. **Frequentist Approach (with optional stopping):** 
     - The p-value of 0.05 at an unplanned interim analysis (day 9) is not reliable because the test was designed for a fixed sample size (or fixed duration). Stopping early when a threshold is crossed without adjusting for multiple looks leads to an increased chance of a false positive (Type I error). Therefore, the frequentist result (p=0.05) is not valid.

  2. **Bayesian Approach:**
     - The Bayesian method uses the same data to compute a posterior probability. The argument is that Bayesian updating conditions only on the data actually observed and does not depend on the stopping rule (this is known as the "likelihood principle"). Therefore, the posterior probability of 97% is valid regardless of the early stopping.

  However, we must note:
     - The Bayesian approach is not entirely free of the optional stopping concern. While it is true that the posterior is computed based solely on the data, the interpretation of the posterior probability as the probability that the treatment is better is valid only if the model is correctly specified and if the prior is appropriate. Moreover, if the stopping rule is based on the data (which it was, because they stopped when the p-value crossed 0.05), then the Bayesian analysis using the same data might still be subject to selection bias if the stopping rule is not incorporated into the model. But note: the Bayesian paradigm does not require incorporating the stopping rule because of the likelihood principle.

     - However, the Bayesian approach in this case was applied after the fact (the stopping decision was made based on the frequentist p-value, and then the Bayesian analysis was run on the same data). The Bayesian analysis does not account for the fact that the data was examined multiple times (with the possibility of stopping) because that's not part of the model. The key question is: does the Bayesian posterior probability in this context (with the early stopping) still have its intended interpretation? 

     - Some Bayesian statisticians argue that if the prior is chosen appropriately and the model is correct, then the posterior is valid regardless of the stopping rule. However, others note that if the decision to stop is based on the data, then the data set we are analyzing is a selected sample (we only see the data because we stopped when we did). This selection can affect the operating characteristics of the procedure (like the long-run frequency of errors) but not the Bayesian interpretation for the current data.

     - But note: the Bayesian approach in this case was not pre-specified. The team ran a frequentist test and then, after stopping, did a Bayesian analysis. This post-hoc switch can be problematic because it might be seen as p-hacking (trying different methods until one gives a desirable result).

  3. **The Board's Dilemma:**
     - The board is split on whether the Bayesian reply defeats the statistician's objection or just relocates it.

  Decision:

  After careful consideration, the board rules that the rollout **cannot proceed at this time** based solely on the current analysis. However, we acknowledge the Bayesian result as promising and therefore recommend completing the originally planned three-week test to collect additional data. 

  Reasons:

  - **Pre-specification:** The experiment was designed as a three-week test. The Growth Team deviated from the plan by stopping early without a pre-specified interim analysis plan. This introduces uncertainty about the validity of the results, regardless of the statistical method used.

  - **Frequentist Results:** The frequentist p-value is invalid due to optional stopping. We cannot rely on it.

  - **Bayesian Results:** While the Bayesian approach is less sensitive to the stopping rule, the board has concerns about the ad hoc nature of applying it after the fact. Moreover, the board notes that the Bayesian model used (beta-binomial) and the choice of prior (which was not specified in the report) can greatly influence the posterior. Without a pre-specified Bayesian analysis plan (including the prior and the decision rule), the 97% result might not be robust. 

  - **Risk of False Positive:** Given the early stopping and the potential for noise in the data (only 9 days of data, which might not capture weekly patterns), we risk rolling out a change that is not truly beneficial, which could have negative long-term consequences.

  However, we do not dismiss the Bayesian result entirely. It suggests a strong effect. Therefore, we propose a compromise.

  **Concrete Timeline and Plan:**

  1. **Continue the Test:** The Growth Team must restart the test and run it for the full three weeks (21 days) as originally planned. The test should be restarted from day 1 to avoid any carryover effects or contamination from the previous test. We understand this causes a delay, but it is necessary for a reliable result.

  2. **Pre-specify Analysis Plan:** Before restarting, the Growth Team must pre-specify the analysis plan, which should include:
     - The primary statistical method (either frequentist or Bayesian) and the decision threshold (e.g., p-value < 0.05 or posterior probability > 95%).
     - If using a Bayesian approach, the prior distribution must be specified and justified in advance.
     - If there is a possibility of early stopping for overwhelming efficacy or futility, an interim analysis plan must be provided (with appropriate adjustments in the frequentist setting or a clear Bayesian decision rule).

  3. **Monitoring Policy for Future Tests:**
     - **Pre-specification:** All tests must have a pre-specified analysis plan, including the primary metric, the statistical method, the sample size (or duration), and the decision rule. Any interim analyses (if planned) must be pre-specified and accounted for (e.g., using alpha spending functions for frequentist tests or a clear stopping rule for Bayesian methods).
     - **Optional Stopping:** 
          - For frequentist tests: If the team wishes to have the flexibility to stop early, they must pre-specify an interim monitoring plan (with adjusted significance levels) or use a group sequential design. Without such a plan, the test must run to the planned end.
          - For Bayesian tests: The team may use a Bayesian approach with a pre-specified stopping rule (e.g., stop when the posterior probability of one variant being better exceeds a threshold). The prior and the stopping rule must be pre-specified and justified.
     - **Bayesian Analyses:** If Bayesian methods are used, the prior must be chosen based on historical data or expert knowledge and must be pre-specified. The board may require sensitivity analyses to check the robustness of the results to the prior.
     - **Multiple Methods:** If the team plans to use both frequentist and Bayesian methods, the primary method must be identified in advance. Secondary methods can be reported but will not override the primary method unless pre-specified.

  4. **Monitoring During the Test:** 
     - The board strongly discourages unplanned peeking and early stopping without an approved interim analysis plan. If the team must monitor the test for operational reasons (e.g., to check for severe bugs), they must use a method that controls the error rate (e.g., a firewall that only allows looking at secondary metrics or using a formal sequential method). 

  **Fair Hearing for Both Sides:**

  We acknowledge the Growth PM's argument that the Bayesian result is robust to optional stopping. However, the board is concerned about the ad hoc nature of the analysis and the lack of pre-specification. We also note that the Bayesian result, while promising, might be influenced by the choice of prior and the model. Without a pre-specified Bayesian plan, we cannot be sure that the 97% is not overly optimistic.

  We also acknowledge the statistician's valid concern about optional stopping in the frequentist paradigm. The board agrees that the frequentist p-value is invalid and cannot be used.

  Therefore, we require the full test to be run again. This will allow us to evaluate the effect with a pre-specified plan and without the ambiguity of early stopping.

  **Conclusion:**

  The rollout is **not approved** at this time. The Growth Team is instructed to restart the test and run it for the full 21 days. The test must restart from day 0 to avoid any bias. The team must submit a revised analysis plan (pre-specified) to the board within one week. The board will review the plan and, if approved, the test can begin immediately. The results of the full test will be evaluated at the end of the 21-day period.

  We understand the desire to move quickly, but the integrity of our experimentation process is paramount. This approach balances the need for speed with the need for reliable results.

  Signed,
  The Experimentation Review Board
answer: |-
  **MEMORANDUM**  
  **TO:** Growth Team, Statistician, Experimentation Review Board Members  
  **FROM:** Experimentation Review Board Chair  
  **SUBJECT:** Decision on Growth Team's Onboarding-Flow Test (Early Stopping & Bayesian Reanalysis)  
  **DATE:** October 26, 2023  

  ---

  ### **I. Ruling**  
  After thorough deliberation, the Board **denies immediate rollout** of the new onboarding flow. The test must be **restarted and run to completion** (full 21 days) with no changes to variants during this period. Final analysis and rollout eligibility will be reassessed after day 21.  

  **Concrete Timeline:**  
  - **Day 1–21:** Test restarted with original variants. No peeking or early stopping permitted.  
  - **Day 22:** Primary analysis (pre-specified frequentist or Bayesian) conducted.  
  - **Day 23:** Board reconvenes to review results and approve/deny rollout.  

  ---

  ### **II. Rationale**  
  The Board acknowledges both positions but finds neither the frequentist p-value nor the Bayesian posterior probability **sufficiently reliable** under the current execution.  

  #### **A. Fair Hearing: Statistician’s Objection (Optional Stopping)**  
  The statistician correctly notes that **early stopping invalidates the frequentist p-value**. Stopping at the first crossing of \(p=0.05\) inflates Type I error (false positives) beyond 5% due to repeated testing. The \(p=0.05\) observed on day 9 is thus **statistically inadmissible** for decision-making.  

  #### **B. Fair Hearing: Growth Team’s Bayesian Counterargument**  
  The Bayesian reanalysis (97% posterior probability) is **theoretically robust to stopping rules** under the likelihood principle. However, the Board identifies critical practical flaws:  
  1. **Prior Sensitivity**: The beta-binomial model’s output depends heavily on the prior. An uninformative or weakly informative prior (e.g., Beta(1,1)) may overstate confidence with limited data (9 days).  
  2. **Operational Bias**: The Bayesian model was applied *post hoc* after frequentist triggering. This risks **cherry-picking** methodology to justify a desired outcome.  
  3. **Risk of Overinterpretation**: 97% posterior probability ≠ 97% "real-world success probability." Without pre-specified decision thresholds or robustness checks, it may overstate evidence.  

  #### **C. Core Issue: Procedural Integrity**  
  The fundamental failure is **deviation from pre-specified protocols**. The planned 21-day runtime was designed to mitigate volatility (e.g., weekly user patterns). Stopping at day 9—without predefined stopping rules—undermines both frequentist and Bayesian validity by:  
  - Ignoring effect size stability (e.g., day 9 results may regress to noise).  
  - Violating the experiment’s design, which is foundational to *any* statistical inference.  

  ---

  ### **III. Monitoring Policy for Future Tests**  
  To prevent recurrence, the Board mandates:  

  #### **A. Pre-Specification Requirements**  
  1. **Stopping Rules**:  
     - Frequentist tests: Predefine interim analysis points with alpha-spending adjustments (e.g., O’Brien-Fleming).  
     - Bayesian tests: Predefine stopping thresholds (e.g., stop if \(P(\text{new} > \text{old}) > 95\%\)) and priors.  
     - *No unplanned peeking* without Board approval.  
  2. **Analysis Plan**: Declare primary methodology (frequentist/Bayesian), priors, and decision thresholds *before* test launch.  

  #### **B. Bayesian Implementation Standards**  
  - **Priors**: Justify priors using historical data or domain expertise. Include sensitivity analysis (e.g., how posteriors change under alternate priors).  
  - **Decision Thresholds**: Set a minimum posterior probability for rollout (e.g., >95%) and predefine robustness checks.  
  - **Co-Primary Analyses**: If both frequentist and Bayesian methods are used, neither may override the other without pre-specified hierarchy.  

  #### **C. Emergency Stopping Protocol**  
  Permissible *only* for:  
  - Catastrophic UX failures (e.g., 50% drop in core metrics).  
  - Predefined Bayesian safety thresholds (e.g., \(P(\text{new} > \text{old}) < 2\%\)).  
  Documentation and Board review required within 24 hours.  

  ---

  ### **IV. Path Forward for Current Test**  
  - The Growth Team **must restart the test** with identical variants and run uninterrupted for 21 days.  
  - At completion, analyze data using:  
     - **Frequentist**: Sequential-adjusted p-value (accounting for day-9 peek) *or*  
     - **Bayesian**: Pre-specified model/prior (Board must approve if changed).  
  - Rollout requires:  
    - \(p < 0.05\) (with stopping adjustment) OR \(P(\text{new} > \text{old}) > 95\%\) (with vetted prior), **and**  
    - Effect size > minimum practical significance (e.g., ΔCR > 0.5%).  

  ---

  ### **V. Conclusion**  
  While the Bayesian argument is conceptually compelling, it cannot salvage a procedurally compromised test. **Reliability stems from design integrity, not just computational methods.** By restarting and adhering to pre-specified rules, we balance statistical rigor with growth objectives. The Board appreciates the Growth Team’s urgency and the statistician’s diligence—this decision reinforces our shared commitment to trustworthy experimentation.  

  **Signed,**  
  Experimentation Review Board Chair  

  ---  
  **APPROVED:**  
  [Board Signatures]  
  **CC:** Chief Data Officer, Head of Product
