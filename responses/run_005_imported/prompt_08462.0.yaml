  Start with constructibility. Kepler tied aspects to polygons constructible with compass and straightedge. But why those tools? That's a Greek convention, not necessarily fundamental. Also, constructibility doesn't imply natural significance. A pentagon is constructible, but so are other polygons he excluded, like the heptagon. His inclusion of the quintile (72°) but not the septile (≈51.4°) seems arbitrary without further justification.

