  For her physics, PSR meant rejecting Newton's unexplained gravity force, pushing her toward Leibnizian metaphysics where forces stem from monadic properties. But PSR isn't just for physics—it's universal. So when she turns to happiness, she's applying the same rule: what sufficiently explains human flourishing? 

