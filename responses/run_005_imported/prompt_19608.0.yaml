  Next, explaining the ideal point's role. In KS, the ideal point represents the best each player could get if the other conceded everything. It sets a benchmark for fairness. When the feasible set expands, the ideal point shifts if one player's max increases. KS adjusts allocations to maintain proportional gains relative to these new ideals, thus satisfying individual monotonicity. Nash ignores this because IIA only considers the new feasible set without referencing past ideals.

