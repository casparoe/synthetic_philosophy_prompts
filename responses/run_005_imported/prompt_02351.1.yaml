  User's deeper needs: They want to present a nuanced, original perspective in their seminar, avoiding oversimplification of Hansen vs. Fraser. They need confidence their synthesis holds under scrutiny, especially with students familiar with the literature. Highlighting the grammatical aspect makes the argument accessible and less entangled in ontological debates. 

