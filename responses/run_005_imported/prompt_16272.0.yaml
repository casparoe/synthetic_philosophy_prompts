  ## The Unbearable Weight of Intention: Pressuring Anscombe's Indictment of Truman

  Elizabeth Anscombe’s denunciation of Harry Truman as a murderer, grounded in her stringent application of the doctrine of double effect (DDE), presents a formidable moral challenge. Her core argument – that deliberately killing innocent civilians as a *means* to a good end (ending the war) is intrinsically murderous, regardless of consequences – is philosophically robust and emotionally resonant. However, subjecting this argument to sustained pressure reveals significant fractures, suggesting her absolute condemnation, while morally bracing, may ultimately be unsustainable. The strongest objections lie in the manipulability of intention, the potential paralysis of absolutism in extremity, and the specific historical context undermining the "supreme emergency" defense even for non-absolutists.

  **The Shifting Sands of Intention:**
  Anscombe hinges everything on Truman *intending* the civilians' deaths as the *means* to compel surrender. Yet, the distinction between intention and foresight is notoriously vulnerable to redescription. Could Truman’s intention not be plausibly framed as targeting *Japan’s capacity and will to wage war*? Hiroshima and Nagasaki were not merely civilian centers; they housed significant military headquarters, war industries, and ports vital to Japan’s war effort. The destruction of these nodes, inevitably causing civilian casualties, could be described as targeting the enemy's *military-industrial complex and national resolve*. The death of civilians, while foreseen with near certainty, becomes a tragic side effect of attacking legitimate, albeit co-located, military targets. Anscombe might dismiss this as sophistry, arguing the *mechanism* of surrender was demonstrably the terror and shock inflicted *upon the civilian populace* and leadership. However, proving this specific mental state – that Truman *chose* the killing of innocents *as the very instrument* rather than accepting it as the horrific consequence of destroying a center of war-making – is fraught. The DDE, while conceptually clear, relies on discerning an agent's internal intentions from external acts, a process inherently susceptible to competing interpretations that can dramatically alter moral categorization.

  **The Abyss of Absolutism and the Specter of Paralysis:**
  Anscombe’s absolute prohibition against intentionally killing the innocent, even to prevent catastrophe, stands as a stark rebuke to consequentialism. Yet, this rigidity generates its own profound moral dilemma: what if the *only* way to prevent an overwhelming, existentially threatening evil is an act that *appears* to violate this prohibition? Imagine a scenario where intelligence reveals a hidden, impregnable enemy command center beneath a city, controlling weapons poised to annihilate multiple nations. Destroying it inevitably kills civilians above. Is it truly murder to act? Anscombe would likely say yes, maintaining the inviolability of the prohibition. However, the moral cost of inaction in such a hypothetical – allowing genocide or global annihilation – seems an unbearable burden, suggesting her absolutism risks a different kind of moral failure: paralysis in the face of ultimate evil. While the bombings of Hiroshima and Nagasaki may not meet *this* threshold (a point addressed next), the *principle* of absolute prohibition becomes ethically precarious when the stakes reach a certain catastrophic magnitude. It risks making morality irrelevant to the gravest decisions humanity might face, demanding purity at the potential cost of everything.

  **Walzer, "Supreme Emergency," and the Specific Failure at Hiroshima:**
  Michael Walzer, while sympathetic to non-consequentialist constraints in war, offers a crucial objection Anscombe dismisses but which significantly weakens the *specific* defense of Hiroshima and Nagasaki, even for those less absolute than her. Walzer’s "supreme emergency" exception argues that overriding the prohibition against targeting innocents might be conceivable only when three conditions converge: an imminent threat of an *ultimate* kind (e.g., genocide, totalitarianism engulfing civilization), where the *sheer imminence* creates a threshold of extremity, and crucially, where *no other means* of averting the catastrophe exist. Walzer himself argues that by August 1945, Japan met *none* of these criteria. Its defeat was inevitable. While an invasion (Operation Downfall) would have been horrific, it was not certain, and alternatives like a demonstration blast, awaiting Soviet entry, or modifying surrender terms (*before* the bombs) existed and were arguably not exhausted. Japan was a brutal regime, but it did not pose an *existential, civilization-destroying* threat akin to Nazi Germany at its zenith. Therefore, even for theorists allowing rare exceptions, the bombings fail. The objection here isn't just consequentialist ("it saved lives"); it's that the *conditions justifying the violation of the deep moral constraint* were absent. This undermines not only consequentialist justifications but *any* justification relying on extremity. Anscombe’s absolute stance makes her immune to this objection, but its force lies in showing that the bombings were condemned *even* by frameworks accepting the moral weight she assigns to intention and innocence, but recognizing potential, narrowly defined exceptions.

  **Weighing Against Consequentialism and Reaching a Verdict:**
  Anscombe rightly exposes the dangers of consequentialism: it can too easily justify atrocities by aggregating outcomes, eroding the intrinsic value of human life and individual rights. Her insistence that "you cannot do evil that good may come" is a vital bulwark against moral corruption. However, the objections reveal that her alternative framework faces its own serious challenges. The manipulability of intention threatens to make DDE a tool for post-hoc rationalization rather than clear moral guidance. The potential paralysis of absolutism in truly ultimate emergencies suggests it may not be a fully adequate moral response to the darkest possibilities of human conflict. Finally, the historical specificity, highlighted by Walzer, demonstrates that the bombings likely failed *any* reasonable test of necessity, even one less stringent than Anscombe’s.

  **Verdict:**
  While Anscombe's philosophical rigor and moral clarity are undeniable, and her condemnation of the bombings as a profound evil remains powerful, her specific charge of *murder* against Truman, grounded *exclusively* in the absolute, non-manipulable distinction of intention she requires, is **ultimately unsustainable.** The DDE distinction, as applied to complex acts of state in total war, proves too vulnerable to competing descriptions of intention to bear the absolute moral weight she places upon it in *this* case. Furthermore, the historical context, as argued persuasively by critics like Walzer, shows that even frameworks acknowledging the deep wrong of targeting innocents find the "supreme emergency" defense inapplicable here, not because intention is irrelevant, but because the threshold of necessity and extremity was unmet. Truman’s decision was a catastrophic moral failure – a choice of overwhelming, indiscriminate terror when other paths likely remained. It violated the principles of discrimination and proportionality core to *jus in bello*. But categorizing it as *murder* in Anscombe’s strict sense requires an unverifiable certainty about Truman’s intentions and an absolute prohibition that, while morally admirable, proves brittle when subjected to the pressures of redescribing intention and contemplating genuine, civilization-ending extremity. The bombings stand as a unique horror, perhaps *sui generis* in their scale and mechanism, demanding condemnation, but not neatly captured by the label of murder as Anscombe rigidly defines it. Her argument illuminates a profound truth about the sanctity of the innocent, but its application to Truman, as an absolute indictment of murder, cracks under the weight of its own philosophical and historical burden.
