answer: |-
  That's a remarkably precise and nuanced ethical debate you've described — and I understand why it's stuck with you. Both positions have substance, but your critique exposes a genuine tension in Jonah's view. Let's break this down step by step:

  ### 1. Assessing Jonah's Position: Stability and Weaknesses
  Jonah's stance (inspired by Kantian or rationalist ethics) has internal logic:
  - **The Core Claim**: Only rational, self-aware beings can be *wronged* (i.e., be direct objects of moral duty). Animals lack this status.
  - **The Moral Mechanism**: Harming animals is wrong *indirectly* because it corrupts human character, fostering callousness that may extend to persons.
  - **Non-Question-Begging?** Yes, this avoids assuming animal moral status upfront. It grounds ethics in human virtue or social consequences.

  **But the instability arises precisely where you pressed him**:  
  If Baxter’s *apparent suffering* is what triggers the character-corrosion (as Jonah conceded when contrasting the vending machine), then the dog’s experience isn’t incidental—it’s *causally essential*. Jonah can’t simultaneously claim:
  - Baxter’s suffering is morally irrelevant *in itself*, AND  
  - The uncle’s act is corrosive *because* it’s a response to that suffering (unlike kicking an object).

  This *is* a smuggled-in moral significance. The "character corruption" argument covertly relies on the very feature it denies: the normative weight of animal suffering.

  ### 2. Your Objection: Does "Smuggling Baxter Back In" Succeed?
  **Yes, it lands effectively.** Jonah’s attempt to isolate the moral wrong to *human character* fails because:
  - **Psychological Mechanism ≠ Moral Justification**: That we *feel* differently about harming animals than objects explains our reaction, but not why that feeling should be morally authoritative. If Baxter’s suffering is truly irrelevant, why should it "get under our skin" in a morally significant way? Jonah’s appeal to psychology doesn’t resolve the normative gap.
  - **Equivocation Risk?** You avoided it. You didn’t conflate "Baxter matters" with "Baxter has human rights." You showed Jonah’s explanation *depends* on Baxter’s capacity to suffer *mattering* in a way that inert objects’ "suffering" does not.

  ### 3. Is There a Better Way to Draw the Line?
  The line Jonah wants ("bad act" vs. "wrong *to someone*") is philosophically coherent but requires abandoning the psychological link he invoked. A more stable version might be:
  - **Strict Indirect Duty View**: "Harming animals is never a wrong *to them*, but it’s always a vice *in us* because it violates our duty to cultivate compassion (a virtue necessary for human ethics)."  
    *Problem:* This still feels disconnected. Why is *this specific act* vicious if the suffering isn’t bad *for Baxter*?

  **A More Plausible Alternative**:  
  A better distinction might acknowledge **degrees of moral standing**:  
  - **Wrongs *to* beings**: Require moral agency/personhood (e.g., deceiving a human).  
  - **Harms *against* sentient beings**: Cause morally significant suffering, creating a *pro tanto* wrong (not just "bad character"), even if less weighty than wrongs to persons.  

  The uncle’s act could then be:  
  - A **harm *against_** Baxter (due to his sentience/suffering), AND  
  - A **wrong *to* himself/humanity** (by degrading his compassion).  

  This avoids Jonah’s tension: Baxter’s suffering *directly* matters, but the moral failure isn’t *identical* to wronging a person.

  ### Who Was Closer to Right?
  **You had the stronger argument.** Jonah’s position is *theoretically possible* but psychologically and morally unstable as he defended it. His reliance on Baxter’s suffering as the corrosive element fatally undermines his claim that Baxter is morally incidental. 

  **Why your critique holds**:  
  - Jonah needed to explain why *only* character matters, without reference to the dog’s experience. He couldn’t. When pressed, he retreated to the very intuition that suggests animals *do* have moral significance: our empathetic distress at their suffering.  
  - The vending machine analogy was apt. If character corruption stems solely from the agent’s intent (e.g., "unnecessary destructiveness"), then harming animals *should* be no worse than vandalism. But it *feels* worse—because we recognize the animal’s experience as morally relevant.

  ### Conclusion
  Jonah’s view isn’t absurd—it reflects a real ethical tradition—but it fails to account for why animal suffering *uniquely* corrupts character in a way vandalism doesn’t. Your intuition that Baxter’s perspective can’t be fully erased from the moral equation is sound. A defensible line requires either:  
  1. **Acknowledging sentient harm** as a direct moral wrong (even if lesser than wrongs to persons), or  
  2. **Severing the psychological link** entirely (e.g., "Harm animals only if it erodes virtues needed for human ethics"—a weaker argument).  

  The dinner party debate exposes a deep truth: even when we deny animals moral standing, our reactive attitudes betray that we sense something *owed to them*. Jonah’s uncle didn’t just fail himself; he failed to respond appropriately to a being that cried out—in its own way—against being treated as disposable. That cry, it seems, is harder to silence than Jonah’s philosophy allows.
