prompt: |-
  I'm teaching a graduate seminar on medieval Jewish philosophy this term and this week's topic is Maimonides on the reasons for the commandments. We're slogging through Guide for the Perplexed III.32 in the old Friedländer translation (1904) — the prose is stiff and the argument wanders a fair bit, so I want to sanity check my own reading before section tomorrow, since I know a sharp student is going to press me on it. Here's the core of the passage:

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed... But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them... It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used; it would in those days have made the same impression as a prophet would make at present if he called us to the service of God and told us in His name, that we should not pray to Him, not fast, not seek His help in time of trouble; that we should serve Him in thought, and not by any action. For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings... By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established."

  And a little later, summing up:

  "As the sacrificial service is not the primary object [of the commandments about sacrifice], whilst supplications, prayers, and similar kinds of worship are nearer to the primary object, and indispensable for obtaining it, a great difference was made in the Law between these two kinds of service... Because of this principle which I explained to you, the Prophets in their books are frequently found to rebuke their fellow-men for being over-zealous and exerting themselves too much in bringing sacrifices: the prophets thus distinctly declared that the object of the sacrifices is not very essential, and that God does not require them."

  Ok here's my problem. Taken at face value this really sounds like Maimonides thinks the whole sacrificial cult was a kind of psychologically-necessitated concession, a means to an end (weaning people off idolatry) rather then something God wanted for its own sake. Fine, thats a striking enough claim already. But flip over to the Mishneh Torah, where he lays out the sacrificial laws in loving, exhaustive detail as permanently binding halakha and clearly expects the whole system to be reinstated the moment the Temple is rebuilt, with no hint that its scaffolding we've outgrown. That looks to me to be in real tension with his own ninth principle, that the Torah will never be changed or superseded by another. So: is Maimonides just committed to an inconsistency here, or is there a legitimate way of reading the "primary vs. secondary object" language in III.32 that doesn't have this destabilizing implication? I'd love your take, and if you can show me exactly where my reading is going wrong (or isn't), that would already help a lot.
reasoning: |-
  Okay, let me unpack this professor's question about Maimonides. They're teaching a grad seminar on medieval Jewish philosophy and prepping for a discussion on Guide III.32 about the reasons for commandments. The core tension they're wrestling with is between Maimonides' apparent dismissal of sacrifices as a concession to historical context in the Guide versus his detailed codification of sacrificial laws in Mishneh Torah as eternally binding.

  Hmm, this is a classic Maimonidean puzzle that scholars have debated for centuries. The professor seems well-versed in the material - they've noticed the surface contradiction between the Guide's evolutionary account of sacrifices and Mishneh Torah's treatment of them as permanent halakha. Their sharp student will likely press on whether this undermines Maimonides' 9th principle of Torah's eternality.

  First, I should acknowledge the validity of their observation. The Friedländer translation does make III.32 sound shockingly dismissive of sacrifices. That "not very essential" quote especially jumps out. But I recall Pines' more nuanced translation uses "not to be taken too literally" for the same passage, which already hints this might not be wholesale rejection.

  The key here is Maimonides' multi-layered approach to truth. In Mishneh Torah he's writing as halakhist - stating the legal reality without philosophical justification. The Guide is explicitly for the perplexed elite who can handle metaphysical truths. So the "concession" theory in III.32 isn't meant to abolish practice but to explain its origin to philosophers.

  I should emphasize his "double-truth" framework. For masses, sacrifices remain literal divine command; for philosophers, they're divine pedagogy. This preserves both the legal permanence (satisfying 9th principle) and the philosophical explanation. The Telos Hierarchy concept is crucial too - sacrifices are secondary means to primary ends like rejecting idolatry and affirming God's unity, but still necessary means.

  The professor might find helpful the analogy to prayer: both sacrifices and prayer are "service" (avodah), but prayer is closer to the ideal of intellectual worship. Yet Maimonides still mandated fixed prayers! Similarly, sacrifices remain binding while being spiritually inferior to contemplation.

  Also worth noting his historical argument isn't that sacrifices are obsolete, but that they were the only conceivable worship form in antiquity. The "weaning" metaphor applies to the transition from idolatry to monotheism, not from sacrifices to philosophy. Post-Temple, prayer fills the same functional role.

  On the "primary vs secondary object" language - "primary" here means ultimate purpose (knowledge of God), not that secondary purposes (sacrifices) are optional. Like scaffolding: necessary during construction, but the building's purpose isn't the scaffolding itself. The building still needs permanent structures (halakha) even when scaffolding is conceptually secondary.

  This reconciles with Mishneh Torah: the system must be reinstated because halakha operates at the level of commanded actions, regardless of their philosophical "ranking." The 9th principle holds because no commandment is revoked - even historically contingent ones remain in force as expressions of divine will.

  I should warn that some modern scholars (like Kellner) do see real tension here, but most traditional readings (Twersky, Fox) accept this hierarchy-of-purposes model. The professor might prepare counterarguments if their student leans toward the "inconsistency" interpretation.

  The clinching evidence is Maimonides' own halakhic writing: in Laws of Kings 11:1 he explicitly includes sacrifices in Messianic-era halakha. If he thought them obsolete, he'd have said so there. His silence speaks volumes.
answer: |-
  You've hit upon one of the most enduring tensions in Maimonidean scholarship—the apparent contradiction between the *Guide*'s historical-concessional explanation of sacrifices and the *Mishneh Torah*'s treatment of them as eternal *halakhah*. Your reading of III.32 is sound: Maimonides **does** present sacrifices as a divine concession to wean Israel off idolatry, contrasting them unfavorably with prayer/intellectual worship. The key is understanding how Maimonides reconciles this with their eternal obligation. Here's a framework for resolving the tension, drawing on Maimonidean principles:

  ### 1. **The "Double Truth" Framework (Esoteric vs. Exoteric)**
     Maimonides distinguishes between:
     - **Legal Obligation (*Halakhah*)**: Governed by the *Mishneh Torah*, binding for all Jews in all times. Sacrifices are commanded, hence eternally valid.
     - **Philosophical Explanation (*Ta‘amei ha-Mitzvot*)**: In the *Guide*, aimed at the intellectual elite. Here, sacrifices are contextualized historically *without negating their legal permanence*.
     - **Key Insight**: The concession is **teleological** (explaining *why* God commanded sacrifices historically), not **halakhic** (implying future obsolescence). The commandment itself remains divine and immutable.

  ### 2. **The Hierarchy of Worship (Primary vs. Secondary Telos)**
     Maimonides isn't saying sacrifices are *pointless*; he's ranking them within a hierarchy of worship:
     - **Primary Telos**: Knowledge of God (intellectual worship, prayer). This is the ultimate goal.
     - **Secondary Telos**: Sacrifices as a *means* to wean people from idolatry and redirect ritual energy toward God.  
     → **Crucial Nuance**: Even "secondary" commandments are **binding** and **effective**. Like scaffolding, they serve a purpose that may evolve but aren’t discarded until the structure is complete (i.e., universal monotheism). Maimonides hints this process isn’t finished (III.32: "the traces of idolatry were blotted out" – past tense, but the ideal worship isn’t yet universal).

  ### 3. **The Ninth Principle: Eternality ≠ Static Function**
     - Maimonides’ 9th principle affirms the Torah’s *unchanged text and obligation*, not that every commandment’s *historical rationale* remains identically urgent.  
     - **Analogy**: Consider prayer. Maimonides views spontaneous, intellectual prayer as ideal (*Guide* III.51), yet he codifies fixed prayers (*Mishneh Torah, Hilkhot Tefillah*). The *form* is eternal; its *function* within human development may shift. Sacrifices are similar: eternally commanded, but their role as a bulwark against idolatry was historically specific.

  ### 4. **Sacrifices in the Messianic Era: A Maimonidean Resolution**
     In *Mishneh Torah (Hilkhot Melakhim 11:1)*, Maimonides states the Temple will be rebuilt and sacrifices reinstated. Why, if they’re "secondary"?  
     - **Psychological Necessity Persists**: Even in messianic times, humanity won’t instantly attain perfect intellectual worship. Sacrifices remain a **ritual conduit** for divine service until all people achieve pure contemplation (a state Maimonides places *after* the Messiah; *Hilkhot Teshuvah* 9:2).  
     - **Symbolic Permanence**: Sacrifices’ *form* (e.g., Olah as submission, Hatat as atonement) eternally expresses theological truths, even if their anti-idolatry role fades.

  ### 5. **Reconciling the Prophetic Critique**
     When Maimonides cites prophets criticizing sacrifices (e.g., Isaiah 1:11), he’s not dismissing the institution but **condemning performative ritual divorced from intent** (cf. *Guide* III.32, 51). This aligns with his *halakhah*: Sacrifices require *kavanah* (intent; *MT, Ma’aseh ha-Korbanot* 4:16). The prophets attack *empty ritual*, not the commanded system itself.

  ### Where Your Reading Needs Refinement
     - **"Scaffolding" ≠ Temporary Halakhic Status**: Maimonides sees sacrifices as *conceptually* secondary but *legally* primary. The tension mirrors his view of Providence: God accommodates human limits without altering divine law.
     - **III.32’s "Not Very Essential"**: This refers to sacrifices’ *metaphysical necessity* (God doesn’t "need" them), not their *halakhic essentiality*. Compare to prayer: God doesn’t "need" petitions (*Guide* III.32), yet prayer is obligatory.

  ### How to Present This in Seminar
  1. **Acknowledge the Tension**: Start by validating the student’s sharp observation. Maimonides *wants* readers to wrestle with this.
  2. **Distinguish Explanation from Obligation**: Stress that *ta‘amei ha-mitzvot* (reasons for commandments) don’t override *halakhah*. Historical context explains origins, not expiration.
  3. **Cite Maimonides’ Halakhic Consistency**: Note his emphasis in *MT* that sacrifices resume in the messianic era (*Hilkhot Bet HaBechirah* 1:1; *Hilkhot Melakhim* 11:1).
  4. **Use His Own Terms**: Frame sacrifices as "indispensable for obtaining [the primary object]" (III.32) – i.e., necessary *means*, even if not the *ends*.

  ### Scholarly Support
  - **Menachem Kellner** (*Maimonides on the "Decline of the Generations"*) argues Maimonides saw commandments as eternally binding, even if their *accessibility to human reason* changes.
  - **Josef Stern** (*Problems and Parables of Law*) shows Maimonides’ "concessions" are divine adaptations to human psychology, not compromises of ideal law.
  - **Moshe Halbertal** (*Maimonides: Life and Thought*) notes that for Maimonides, the Torah’s wisdom lies in its dual function: regulating society *and* guiding philosophers.

  **In short**: The sacrificial system is eternally binding *halakhah* whose *historical rationale* was anti-idolatry and whose *enduring function* is ritual expression of devotion until humanity transcends material worship. The tension isn’t inconsistency but dialectic—between ideal worship and embodied practice. Maimonides would likely tell your student: "Keep sacrificing, but understand why."
