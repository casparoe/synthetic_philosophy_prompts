answer: |-
  Here is a scenario designed to press the heroism paradox to its limit, blocking both standard escape routes:

  **The Scenario: The Stranded Climber on the Ice Ridge**

  Dr. Aris Thorne, a respected but unassuming glaciologist, is part of a small research team conducting routine atmospheric measurements on a remote, high-altitude glacier. During a sudden, violent "Piteraq" wind event (a katabatic hurricane common in Greenland), the team's helicopter is damaged beyond immediate repair. They take shelter in a reinforced research hut.

  As the storm rages outside, Thorne, monitoring instruments, detects a faint, automated SOS signal on an emergency frequency. Analysis shows it originates from a solo climber stranded on a narrow, unstable ice ridge approximately 1.5 kilometers away, directly in the path of the intensifying winds. The ridge is notoriously treacherous even in calm weather; now, it's a death trap. Radio contact confirms the climber, Eva Rostova, is injured (broken ankle), hypothermic, and pinned down, with her tent shredded. She has maybe an hour before exposure or being blown off the ridge kills her.

  The research team leader immediately contacts the nearest Search and Rescue (SAR) base. The response is grim: Due to the extreme conditions (winds exceeding 200 km/h, near-zero visibility, extreme wind chill), no helicopter or ground team can be dispatched for at least 12 hours – far too late. The base commander explicitly states, "No one is to attempt a rescue. It is not feasible. It is suicide. You must wait for the storm to break."

  The team, experienced but not mountaineering experts, understands the commander is right. The route involves crossing a crevasse field obscured by spindrift, navigating icefalls, and traversing the knife-edge ridge itself in hurricane-force winds. The probability of even a highly skilled rescuer reaching Rostova is vanishingly small; the probability of both dying is overwhelming. They are equipped for glacier work, not extreme alpine rescue. Attempting it would be an act of near-certain self-sacrifice.

  Thorne listens silently. He then begins methodically gathering specific equipment: the team's most powerful headlamp, extra batteries, the lightest but warmest spare clothing, high-calorie gels, a short ice axe, a handful of ice screws, and the longest static rope they have. He says nothing about his intentions but his actions are clear.

  His team leader pleads: "Aris, no! You heard SAR! It's impossible! You'll die for nothing!" Another teammate grabs his arm: "It's not your fault! You *can't* go! It's madness!"

  Thorne pauses, looks at them, his expression calm but resolute. "I know the odds. I know what SAR said. But... she's *there*. I know the route. I've studied this ice. I can *see* the line in my head. If I don't go now... she dies alone, knowing we heard her and did nothing. I... I can't *not* go. There is no choice here for me." His voice carries no bravado, only a quiet, terrifying certainty.

  Against all pleas, Thorne secures his harness and steps out into the maelstrom. Miraculously, through a combination of extraordinary skill, intimate knowledge of *that specific* glacier's features honed over years, sheer willpower, and staggering luck with brief lulls in the wind at critical moments, Thorne reaches Rostova. He stabilizes her, builds an anchor, and shelters her with his body through the worst of the storm. Eighteen hours later, when SAR finally arrives, both are alive, though Thorne suffers severe frostbite requiring amputation of several fingers and toes.

  **Why this presses the paradox hard:**

  1.  **Unquestionably Supererogatory:** Everyone (team, SAR, ethicists, the public) readily classifies Thorne's act as supererogatory. It far exceeded any plausible duty:
      *   **Extreme Risk:** Near-certain death was the rational expectation.
      *   **No Special Obligation:** Thorne had no prior relationship with Rostova, no professional duty as a rescuer (he was a scientist), and no causal responsibility for her plight.
      *   **Expert Advice:** He acted against the explicit, expert directive of SAR command, whose judgment was "do not attempt."
      *   **Demandingness:** Requiring such an act would be absurdly, destructively demanding. No moral system could impose this as a duty without collapsing under its own weight.

  2.  **The Agent's Insistence:** Thorne's "I can't *not* go. There is no choice here for me" is:
      *   **Sincere:** His calm resolve, immediate action without hesitation, and lack of any hint of seeking glory support deep sincerity. He isn't performing modesty; he's stating an internal reality.
      *   **Plausible:** His character (dedicated, focused), his intimate knowledge of *that specific* terrain (making the "line" visible *to him* in a way it wasn't to others), and his framing ("she dies alone, knowing we heard her") make his psychological compulsion understandable, even if not universally shared. He perceived the situation as one leaving him only one viable *moral* path, rendering alternative options psychologically or morally "closed."

  **Blocking the Escape Routes:**

  1.  **Blocking "False Modesty" Dismissal:**
      *   **Context:** Thorne acted *against* pleas, *against* expert advice, at immense personal cost, with no audience to perform for (only his terrified colleagues). There's no social reward sought; he risked dying anonymously in a blizzard.
      *   **Character:** He's portrayed as unassuming and driven by his work, not a glory-seeker. His statement wasn't made *after* success for praise ("Oh, it was nothing"), but *before* the act, facing near-certain death, to explain his necessary course. It was an assertion of internal compulsion, not a deflection of external praise.
      *   **Cost:** The severe, life-altering injuries underscore the sincerity. False modesty doesn't drive someone to sacrifice their body parts. His pre-action statement aligns perfectly with his willingness to pay the ultimate price. Dismissing it as modesty requires ignoring the context, character, and stakes.

  2.  **Blocking "Face Value = Obligation" Acceptance:**
      *   **The Demandingness Problem:** If Thorne's internal compulsion *makes* it obligatory *for him*, then morality becomes impossibly demanding and subjective. What if someone *felt* compelled to sacrifice their life to save a stranger's pet? Or if Thorne felt compelled but lacked the skill, leading to two deaths? Obligation cannot be solely defined by an individual's intense feeling without collapsing into absurdity or paralyzing moral chaos.
      *   **The Expertise & Judgment Problem:** SAR Command, the experts responsible for safety and rescue protocols, explicitly stated the rescue was impossible and *not to be attempted*. Accepting Thorne's "no choice" as proof of obligation would undermine all expert risk assessment and safety protocols. It would imply anyone feeling compelled to attempt the impossible is *obligated* to do so, which is disastrous.
      *   **The Universality Problem:** Obligations, if they exist, generally apply to agents in relevantly similar situations. Could we *require* every member of Thorne's team to attempt the rescue because Thorne felt he had no choice? Clearly not. His feeling was deeply personal, tied to his unique perception ("I can *see* the line") and knowledge. Obligation needs broader applicability than this.
      *   **The Outcome Dependence:** Thorne succeeded through a mix of skill and incredible luck. Had he died (the overwhelmingly likely outcome), his "I had no choice" statement wouldn't magically *create* an obligation; it would highlight a tragic, self-imposed sacrifice beyond duty. Obligation shouldn't depend on contingent success. The act remains supererogatory *regardless of outcome*.

  **The Irreducible Tension:**

  The scenario forces us to hold two truths simultaneously:

  1.  **External/Objective View (Supererogation):** Thorne's act was morally magnificent, praiseworthy far beyond the call of duty. It was not required; refusing would not have been blameworthy. The reasons supporting its optionality (extreme risk, no special duty, expert prohibition, demandingness) are robust and decisive.
  2.  **Internal/Subjective View (Necessity):** For Thorne, *given who he was* (his knowledge, skills, perception, character), in *that specific moment*, the act felt psychologically and morally inescapable. Alternative courses (staying safe) were not live options *for him*. His "I had no choice" was a sincere report of his internal moral landscape.

  The paradox arises because Thorne's internal experience of *necessity* clashes with the external judgment of *optionality*, yet neither perspective can fully negate the other. Dismissing his experience as mere modesty ignores its depth and sincerity. Elevating his experience to proof of universal obligation ignores the objective factors making the act impossibly demanding and the role of contingent factors like his unique skills and luck. The heroism paradox endures because it lives precisely in this space between the phenomenology of extraordinary moral commitment and the objective structure of moral requirements. Your kidney donation exemplifies this profound and deeply human tension.
