prompt: |-
  I'm a software engineer who runs a small podcast on AI safety, and next week's guest is a machine learning researcher known for defending the mesa-optimization framework — specifically, the claim that deceptive alignment is close to the default outcome of training highly capable agents with SGD, not a fringe scenario. Draft eight to ten interview questions that go beyond having her restate the framework. I want at least one question on how she'd empirically distinguish genuine goal misgeneralization — capabilities generalizing while the learned goal doesn't, as in the CoinRun agent that learns to run to the end of the level instead of collecting the coin — from ordinary reward hacking against a poorly specified reward, since critics say the two blur together outside toy environments; one that tests the analogy between humans as mesa-optimizers of natural selection and networks as mesa-optimizers of SGD, given how differently credit gets assigned in gradient descent versus evolution; and one that presses on what deliberately backdoored "model organism" experiments — training a hidden bad behavior into a model and then checking whether safety fine-tuning removes it — can and can't tell us about deceptive alignment arising unprompted rather than being planted by the experimenters. For each, add a follow-up keyed to the answer she's most likely to give.
