prompt: |-
  I'm the CTO at a small startup and I sit on the committee deciding how far to keep going in a bidding war to acquire another startup for its team. We lost a similar bidding war to this same rival last year. Our offer used to match our own internal valuation of the target; after several rounds of back and forth we're now 40% over that number, and we've already burned $250k in legal/diligence fees that we lose no matter what happens. Half the committee wants to raise again -- "we're already this deep, no point loosing that 250k for nothing" -- and the other half wants to walk. Someone joked this is basically the dollar auction thing from that game theory post everyone shared a while back, except "lol sunk cost fallacy" doesn't feel like the full answer here, since there's an actual live competitor still bidding against us, and the founders of the company we're fighting over come out ahead either way, which feels relevant but I can't say why. Write me the memo I'd bring to the committee: a clear recommendation (raise, hold, walk, or something else), a concrete stopping rule, and honest engagement with the "we're already this deep" argument instead of just waving it off as a bias.
reasoning: |-
  Okay, let me break this down. The user is a CTO at a startup facing a high-stakes bidding war for another company's team, with sunk costs and competitive dynamics complicating the decision. They need a memo that addresses both rational analysis and human psychology.

  First, I need to recognize this isn't just about sunk costs - it's a multi-dimensional problem with strategic rivalry, emotional investment, and asymmetric outcomes. The competitor already beat them once, which adds ego and revenge motivations that must be acknowledged but not indulged. The founders of the target company are guaranteed winners here, which changes the incentive structure.

  The core tension is between two committee factions: one anchored by sunk cost fallacy ("we've spent $250k already") and the other advocating rational exit. But simply labeling it "fallacy" won't convince anyone - I need to reframe those costs as tuition for learning about their competitor's behavior and market valuation patterns.

  Hmm... the dollar auction analogy is perfect but incomplete. Yes, it's an escalation trap, but unlike the academic model, they have asymmetric information: they know their own valuation limits and can estimate the competitor's likely thresholds based on last year's bidding patterns. That's actionable intelligence.

  For the recommendation, walking away is the only defensible choice, but it needs a structured approach: First, validate why 40% over internal valuation is unsustainable - that premium would consume resources needed for integration and retention. Second, propose converting this loss into future advantage by reverse-engineering the competitor's bidding strategy. Third, establish a strict stopping rule for future bids that accounts for emotional triggers.

  The memo should validate the emotional reality ("we're already this deep") while redirecting that energy toward constructive actions: document lessons learned, create a competitor dossier, design an off-ramp before the next auction begins. That transforms the $250k from a waste into strategic R&D spend.

  Key psychological insight: The committee needs permission to walk away without feeling defeated. Positioning this as "choosing our battlefield" rather than "losing" could help. Also emphasizing how overpaying would actually please the rival - they'd either win the team or cripple us financially.
answer: |-
  **MEMORANDUM**  
  To: Acquisition Committee  
  From: CTO  
  Date: October 26, 2023  
  Subject: Bidding War Strategy & Recommendation: Walk Away + Strategic Reset  

  ### **1. Recommendation: WALK AWAY IMMEDIATELY**  
  **Stop bidding. Withdraw our offer.** Do not engage in further rounds.  

  ### **2. Why This Isn’t *Just* Sunk Cost Fallacy**  
  The "we’re already this deep" argument has merit beyond irrational attachment to sunk costs:  
  - **Competitive Dynamics:** Our rival has consistently outbid us (twice now), signaling either superior resources or higher valuation (possibly for strategic assets we don’t covet).  
  - **Target Founder Incentives:** Founders benefit from our bidding war, but this **distorts their loyalty**. Even if we win, they’ve monetized the auction—not committed to our mission.  
  - **Asymmetric Information:** We lack visibility into our rival’s limits. They know they can provoke us (based on past behavior), making this a **known vulnerability**.  

  However, these factors don’t justify escalation—they amplify the risk.  

  ---

  ### **3. The Dollar Auction Trap: Why Escalating Is a Loss**  
  This is a classic **escalation game** with asymmetric stakes:  
  | Party            | Win Condition                          | Lose Condition                                  |  
  |------------------|----------------------------------------|------------------------------------------------|  
  | **Us**           | Overpay for team + integration costs   | Lose $250k + time + morale                     |  
  | **Rival**        | Win team at fair price OR drain us     | Minor financial loss (no sunk costs)           |  
  | **Target Founders** | Maximize exit value                 | **None** (they win either way)                 |  

  **Key Insight:** The founders have no downside. Our rival loses only incremental bidding fees. **We lose disproportionately:** sunk costs, opportunity cost, and reputational damage.  

  ---

  ### **4. Concrete Stopping Rule for Future Bids**  
  **Adopt the "Walk Away Price (WAP)" Rule:**  
  1. **Pre-Bid:** Set a WAP = Internal Valuation × 1.15 (15% premium max).  
  2. **Trigger:** If bids exceed WAP, withdraw *instantly*—no committee debate.  
  3. **Sunk Cost Buffer:** Allocate 5% of WAP to diligence/legal fees (e.g., if WAP = $10M, max fees = $500k). **Exceeding this buffer prohibits bidding.**  

  *Rationale:* Caps emotional escalation and forces disciplined resource allocation.  

  ---

  ### **5. Addressing "We’re Already This Deep"**  
  The $250k is gone. But walking now avoids **cascading losses**:  
  - **Financial:** Another bid could cost $500k+ in fees + overpayment.  
  - **Operational:** Winning at 40% over valuation would force cuts to R&D/retention budgets.  
  - **Strategic:** Prolonged bidding signals desperation, inviting future exploitation.  

  **Reframe the $250k:** It bought us **critical intelligence**:  
  - Our rival’s bidding aggression pattern.  
  - Confirmation that founder-led auctions are toxic for acquirers.  
  - Proof we need rigid bidding protocols.  

  **This is not a loss—it’s R&D for smarter M&A.**  

  ---

  ### **6. Path Forward: Turn Loss into Leverage**  
  1. **Withdraw formally** and congratulate the rival (publicly) to signal strategic discipline.  
  2. **Target the team, not the company:** Track key employees. Hire them individually post-acquisition (20-30% of talent typically leaves within 6 months post-M&A).  
  3. **Build an "Acquisition Playbook":** Mandate WAP rule, competitor bid analysis, and founder incentive reviews for future deals.  

  ---

  ### **7. Bottom Line**  
  Escalating turns a $250k lesson into a $2M+ mistake. Walking now preserves capital for a disciplined acquisition—or invests it in organic growth. **We win by exiting the game.**  

  **Recommended Action:**  
  ✅ **Vote to withdraw bid immediately.**  
  ✅ **Formalize the WAP rule for all future acquisitions.**
