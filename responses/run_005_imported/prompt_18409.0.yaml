answer: |-
  You've hit on a crucial subtlety in iterated elimination of strictly dominated strategies (IESDS)! Your intuition is partially correct: if a pure strategy isn't strictly dominated by any *other pure strategy*, it *could* still be a best response to some belief (i.e., some mixed strategy of the opponent). **However, it might be strictly dominated by a *mixed strategy*.** Ignoring mixed strategies can indeed lead to incomplete or incorrect elimination, potentially leaving strategies that should be eliminated and changing the final outcome of IESDS.

  ### Why Checking Mixed Strategies Matters
  1. **Strict domination definition**: A strategy \(s_i\) is strictly dominated if there exists *another strategy* (pure or mixed) \(\sigma_i\) such that:
     \[
     u_i(\sigma_i, s_{-i}) > u_i(s_i, s_{-i}) \quad \forall \quad s_{-i} \in S_{-i}
     \]
     The definition explicitly includes mixed strategies \(\sigma_i\). Restricting checks to pure strategies only violates this definition.

  2. **Best responses vs. domination**: While it's true that a strategy surviving pure-only checks *could* be a best response to some belief, it *might not be*. A strategy strictly dominated by a mixed strategy can **never** be a best response to any belief (by the equivalence theorems in game theory). Failing to eliminate such strategies means IESDS doesn't fully refine the game.

  3. **Impact on outcomes**: In games with 3+ strategies per player, skipping mixed checks can leave dominated strategies in the game, affecting later elimination steps and potentially leading to larger (and incorrect) surviving sets.

  ### Minimal Example: The "Unbeatable Pure, Beatable Mixed" Game
  Consider this 2-player game where Player 1 chooses rows (A, B, C) and Player 2 chooses columns (X, Y). Payoffs are for Player 1 only (Player 2's payoffs don't affect the domination for Player 1, so we omit them):

  |       | **X** | **Y** |
  |-------|-------|-------|
  | **A** | 10    | 0     |
  | **B** | 0     | 10    |
  | **C** | 0     | 0     |

  **Step 1: Check if any pure strategy dominates C**  
  - Compare **A vs C**:  
    - If Player 2 plays X: \(u_1(A,X) = 10 > 0 = u_1(C,X)\) → A better.  
    - If Player 2 plays Y: \(u_1(A,Y) = 0 = 0 = u_1(C,Y)\) → Not strictly better.  
    → A does **not** strictly dominate C.  
  - Compare **B vs C**:  
    - If Player 2 plays X: \(u_1(B,X) = 0 = 0 = u_1(C,X)\) → Not strictly better.  
    - If Player 2 plays Y: \(u_1(B,Y) = 10 > 0 = u_1(C,Y)\) → B better.  
    → B does **not** strictly dominate C.  
  - **Result**: No pure strategy dominates C. If we only check pure strategies, C survives.

  **Step 2: Check if any mixed strategy dominates C**  
  Consider a mixed strategy \(\sigma_1 = (p, 1-p, 0)\) (i.e., mix A with probability \(p\) and B with probability \(1-p\), never play C).  
  - Expected payoff against X: \(u_1(\sigma_1, X) = p \cdot 10 + (1-p) \cdot 0 = 10p\)  
  - Expected payoff against Y: \(u_1(\sigma_1, Y) = p \cdot 0 + (1-p) \cdot 10 = 10(1-p)\)  
  - Compare to C's payoff (always 0):  
    - We need \(10p > 0\) for all X **and** \(10(1-p) > 0\) for all Y.  
    - This holds for any \(p \in (0,1)\) (e.g., \(p = 0.5\) gives 5 > 0 against both X and Y).  
  → \(\sigma_1\) **strictly dominates** C.

  **Step 3: What happens in IESDS?**  
  - **Without mixed checks**: C survives. No further elimination occurs (A and B don't dominate each other). Surviving strategies: {A, B, C}.  
  - **With mixed checks**: C is eliminated. Surviving strategies: {A, B}.  

  **Why this matters**:  
  - C is **never a best response**. For any belief (probability \(q\) that Player 2 plays X):  
    - Payoff of C: \(0\)  
    - Payoff of A: \(10q\)  
    - Payoff of B: \(10(1-q)\)  
    - \(\max(10q, 10(1-q)) \geq 5 > 0\) for all \(q \in [0,1]\).  
    Thus, A or B (or a mix) always outperforms C.  
  - Failing to eliminate C misleads you:  
    - You might think C is "safe," but it's strictly dominated and irrational to play.  
    - In larger games, keeping C could block further eliminations.  

  ### Key Takeaways
  - **Mixed checks are necessary**: They ensure IESDS removes all strategies that are never best responses. Skipping them can leave "zombie" strategies that should be eliminated.  
  - **Not busywork**: This step is foundational for solution concepts like Nash equilibrium (where strictly dominated strategies are never played).  
  - **When you can skip mixed checks**: Only in 2-strategy games (if a pure strategy isn't dominated by the other pure strategy, no mixed strategy can dominate it either). With 3+ strategies, always check.  

  If you test this example yourself, you'll see how mixed strategies "cover" weaknesses that pure strategies can't. Keep grinding—it clicks!
