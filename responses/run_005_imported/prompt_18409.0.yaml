  So I've been grinding through iterated elimination of strictly dominated strategies for my game theory prelim and something's bugging me. If a pure strategy isn't beaten by any single pure strategy the other player could switch to, why do we still bother checking whether some mixed strategy dominates it too? Seems like if nothing pure beats it, the strategy is still "safe" in the sense that it could be a best response to some belief about what your opponent is doing, so it should survive elimination eiher way. Everyone treats the mixed-strategy check like this crucial extra step, but it feels more like busywork profs throw in to pad problem sets than something that acutally changes which strategies get eliminated. Am I wrong here, and if so can you walk me through a minimal example where only checking pure strategies gives you a different (and wrong) answer?
