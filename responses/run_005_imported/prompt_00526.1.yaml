prompt: |-
  hey so in my decision theory seminar we've been going over Christiano's "surrogate goals" idea as a defense against blackmail/extortion (including the acausal kind), and i'm honestly not convinced it actually works once you push on it. can you write me a dialogue between two grad students -- one who thinks adopting a surrogate goal is a genuinely solid hedge against threats, and one who thinks it just relocates the vulnerability and falls apart under reflective scrutiny (like, what stops a sophisticated threatener from just targeting your commitment to the surrogate goal itself, or targeting the meta-preference not to be manipulated in the first place?). i want them to actually respond to each others points instead of talking past each other, and to get into the weeds on what it even means to "really" adopt a fake terminal value for purely defensive reasons vs just performing it.
