answer: |-
  ## The Cedarwood Calculus

  The air in the Cedarwood Community Center hummed with the low thrum of servers and the sharper buzz of human anxiety. Marta wiped down the last table in the cafeteria corner, the scent of industrial cleaner mixing with the lingering ghost of burnt coffee. On the large wall screen dominating the room, two numbers pulsed: **Option A: 72.3% | Option B: 27.7%**. Below them, the defining metric glowed: **Minimize Community Burden (Weighted 60% Health Violations Avoided / 40% Financial Impact per Household).**

  Cedarwood hadn’t voted for a mayor or council this term. They’d voted for that equation. *Futarchy Lite*, they called it. A pilot program, sold on sleek infographics promising "Data-Driven Harmony." Vote on what matters (values), then let prediction markets, fueled by real money chasing real profits, figure out *how* to achieve it (beliefs). Clean. Rational. No messy debates, just efficient forecasting.

  The contested belief? How to replace the town’s failing water treatment plant.

  *   **Option A:** A state-of-the-art filtration system. Expensive upfront ($1.2 million, translating to significant temporary household levies), but projected to reduce health code violations (lead, bacteria) to near zero for decades. The "Health First" camp.
  *   **Option B:** A phased retrofit of the existing plant. Cheaper now ($400k, minimal levies), but higher risk of periodic violations and needing another major overhaul sooner. The "Wallet Now" camp.

  The vote on the *value* – "Minimize Community Burden" – had been decisive. But the weighting… that had been the first fracture. Was avoiding a potential health violation more "burdensome" than an extra $200 on your tax bill? The 60/40 split felt arbitrary, a compromise that pleased no one but passed. Now, the market gods were speaking.

  Marta’s eyes flicked to the screen. 72.3% for Option B. The retrofit. The cheaper option. Her knuckles whitened on the damp cloth. Her ten-year-old, Leo, sat at home, his breathing a fragile rasp even on a good day. The doctor blamed years of suspect water quality, a constant low-grade assault on his lungs. *Minimize Community Burden.* What burden did Leo’s inhalers represent on the town ledger? What number captured the nights spent listening for his wheezing, the constant fear when flu season hit?

  "Looks like B’s pulling ahead," Ben murmured beside her, polishing espresso cups. Ben followed the Cedarwood Futures Exchange like others followed sports. He’d even placed a small bet on B days ago. "Smart money sees the retrofit. Less immediate pain. Market’s efficient, Marta. It factors everything in."

  "Everything?" Marta asked, her voice tight. "Does it factor in Leo? Does it factor in Mrs. Gable’s arthritis flaring up every time there’s a boil notice? Does it factor in the *fear*?"

  Ben shrugged, a gesture that spoke of weary acceptance. "It factors in the *probabilities*, Marta. The weighted burden. The market believes the *chance* of serious violations with the retrofit, multiplied by the health cost weight, is still less burdensome *overall* than the definite, immediate financial hit of Option A. It’s math."

  *Math.* The clean division Robin Hanson promised. Vote on the value (minimize burden), bet on the belief (which option achieves it). But Marta saw the cracks spiderwebbing through that clean line. Defining "burden" *was* the belief. Choosing 60/40 *was* a value judgment disguised as calibration. The market wasn’t just predicting outcomes; it was *interpreting* the value through the lens of aggregated, incentivized speculation. And the speculators, mostly outsiders or locals like Ben with spare capital, weren’t betting on *her* burden. They were betting on the *number*.

  A chime sounded. Final ten minutes of trading. The numbers flickered wildly – 70.1%... 73.5%... 71.8%... A whale moving in? Algorithmic flurry? Marta didn’t know and didn’t care. The abstraction felt obscene. Her son’s breath wasn’t a probability distribution.

  She remembered the town hall before the value vote. Arguments about "fiscal responsibility" versus "investing in our future." Arguments about equity – would the levies hurt fixed-income seniors more than the potential health risks? The debate had been messy, raw, *human*. Imperfect, yes, but voices were heard, faces seen. Now, it was just percentages on a screen, converging towards an answer divorced from the lived reality it would dictate.

  The final chime echoed, sharp and conclusive. The screen froze:

  **MARKET DECISION: OPTION B (Phased Retrofit)**
  **Forecasted Community Burden Reduction: 8.7% Greater Than Option A**

  A collective sigh filled the room – relief from some, resignation from others. Ben gave a satisfied nod. "See? Efficient."

  For Marta, the number – 8.7% – was a mockery. What did 8.7% less burden *mean*? Less burden for whom? It meant cheaper water bills next year. It meant the town coffers wouldn’t be drained. It meant Leo would likely face more boil notices, more potential spikes in contaminants, more nights where his inhaler wasn't quite enough. Her burden wasn't reduced; it was externalized, made invisible to the calculus. The market had spoken, not to Cedarwood’s complex tapestry of needs, but to the single, voted-upon number they’d chosen to represent their "welfare."

  Walking home in the twilight, the air felt thick. She passed the old treatment plant, a hulking shadow by the river. Soon, they’d just patch it up. Delay the inevitable. The market had optimized for the path of least *immediate financial* resistance, as defined by the 60/40 split. It had done its job perfectly.

  Leo was asleep when she got in, his breathing a fragile thread in the quiet room. Marta picked up his latest prescription bottle. The cost had gone up again. She traced the label, then looked out the window at the town lights. Cedarwood had voted for a single number to represent its good. They’d bet on the belief that markets could best achieve it. They’d gotten an answer.

  The burden felt heavier than ever. It wasn’t just the potential for bad water; it was the crushing weight of a system that saw her son’s vulnerability not as a tragedy to avoid, but as a variable in an equation, its impact diluted by the aggregate. "Vote on values, bet on beliefs." But the value had been collapsed, quantified, and sanitized before the first bet was ever placed. The belief wasn't just about outcomes; it was about *which costs mattered*.

  The market forecasted a reduction in "Community Burden." Marta clutched the medicine bottle, the plastic cool and unyielding. For Leo, and for her, the burden had a name, a face, and a sound – the rasp of a struggling breath in the dark. No algorithm could capture that. No single number ever would. The clean division had held, the system had worked, and in its cold, efficient success, Marta felt utterly, devastatingly alone. The future was decided, optimized, and rolling towards them. All she could do was count the days until the next boil notice and pray the market’s 8.7% didn’t translate to Leo’s 100%.
