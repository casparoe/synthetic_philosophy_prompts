  Hmm, they specifically mention real cases like Bohmian mechanics vs orthodox QM or Lorentz's ether vs special relativity. That gives me solid grounding. The user isn't just asking for abstract philosophy—they want the human tension of living with this indeterminacy. How do scientists *behave* when faced with fundamentally unresolvable theories? 

