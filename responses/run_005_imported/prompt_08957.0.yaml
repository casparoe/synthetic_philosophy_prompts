answer: |-
  Here's the scene, capturing the intellectual clash you're seeking. I've focused on philosophical rigor and responsiveness, keeping both characters formidable:

  **Setting:** Senior Common Room, Magdalen College. Afternoon light slants through leaded windows. Woodsmoke and leather hang in the air. **Eleanor Vance** (your Anscombe figure) paces near the fireplace, while **Dr. Alistair Thorne** (historian, WW2 specialist) sits nursing a sherry, looking weary but resolved.

  **Eleanor:** (Turning abruptly) It won't do, Alistair. None of it. Voting for that degree is an endorsement. A formal, public *approval*.

  **Thorne:** Approval of the man, Eleanor. The Presidency. The Marshall Plan. The containment of Stalin. Must we reduce him solely to August '45?

  **Eleanor:** When the act in question is mass murder? Yes. Precisely. We cannot compartmentalize moral monstrosity because it’s inconvenient to the narrative of ‘statesmanship’. The bombs were chosen *precisely* to kill civilians on an unprecedented scale. That was the *means* to shock Japan into surrender.

  **Thorne:** The *intention* was surrender, Eleanor. A swift end to a brutal war. The civilian deaths were a horrific, but *foreseen*, consequence. Not the aim itself. Double effect—

  **Eleanor:** —is a sophistry here! It collapses under scrutiny. If the *means* to your end is the destruction of non-combatant life, and that destruction is what directly produces your desired result – shock, terror, paralysis, surrender – then you *intend* those deaths. Truman didn’t merely foresee Hiroshima might be hit; he *chose* it *because* it was a city, packed with civilians, to maximize the demonstration. Nagasaki confirmed it wasn’t an aberration. The civilians weren’t collateral damage regrettably caught near a military target; their annihilation *was* the weapon. That is murder.

  **Thorne:** And the alternative? A land invasion. Projected Allied casualties: a million. Japanese? Millions more. Starvation, firebombing continuing nightly. Was prolonging *that* carnage the moral choice? Was letting hundreds of thousands die daily across Asia while we prepared for invasion morally superior to ending it in two terrible blows?

  **Eleanor:** You slide into utilitarianism, Alistair. "The greater good." That is the *corrupting* logic. It allows *anything*. Torture an innocent child to extract information that saves a city? Under your calculation, justified. But it is *never* justified! We cannot *do* evil that good may come. Choosing to deliberately kill the innocent as a *method* is intrinsically evil. Full stop. The arithmetic of lives saved later is irrelevant to the *nature* of the act itself.

  **Thorne:** Irrelevant? To the men who wouldn’t drown in the surf at Kyushu? To the children in Tokyo who wouldn’t burn next week? Your absolutism feels like moral luxury viewed from the abyss of 1945. Was the firebombing of Dresden murder? Hamburg? Tokyo itself? Where is your bright line? Was killing civilians only murder when done with one bomb instead of thousands?

  **Eleanor:** (Eyes blazing) The line is *intent*! If the bombers *aimed* at the factory district but civilians died nearby, that is the tragedy of war. If they deliberately targeted the residential heart to break morale through mass incineration – as they did, as the atomic bombs did definitively – *that* is murder. The scale is appalling, but the *principle* is the same. And yes, that principle condemns much of Bomber Command’s later strategy too. Convenience doesn't sanctify an act.

  **Thorne:** So, in principle, you would have condemned us to Operation Downfall? To mountains of corpses – military *and* civilian – stretching into 1946? Knowing the Japanese High Command was preparing to fight to the last woman and child? Was *that* the demand of justice? To sacrifice infinitely more lives for the sake of doctrinal purity regarding the *method* of killing?

  **Eleanor:** Justice demands we *never* make the innocent a direct instrument of our policy! The horror of the alternative does not transform an intrinsically evil act into a good one! It makes it a terrible, monstrous choice – but still a choice *for* evil. We must *not* call such a choice 'honourable'. To honour Truman *for this* is to say that such calculations are not just permissible, but *laudable*. It normalizes the abomination. That is why I fight it.

  **Thorne:** (Leans forward, voice low and intense) And I fight the implication that those who ended the war, however brutally, acted without conscience or solely from malice. They stared into hell, Eleanor. The hell of continued war, the hell of the bomb. They chose the hell they believed – *reasonably* believed – would end the suffering *sooner* and, in the grimmest calculus, *less* horribly overall. It wasn't purity. It was desperation soaked in blood. To call it 'straightforward murder' ignores the impossible weight of that decision, the context of total war they didn't start.

  **Eleanor:** (Quieter, but unyielding) The context explains. It does not excuse. It certainly does not deserve our highest *accolade*. To honour him *for this decision* is to say the ends *do* justify these means. I cannot, and will not, be part of that. It cheapens every life lost, on all sides, and corrupts the very idea of justice we claim to uphold.

  **Thorne:** (Sighs, looks down at his untouched sherry) And I cannot stand before the ghosts of those who *would* have died – men I served with, children I never met – and say their sacrifice would have been *more* honourable than the horrific choice that spared them. Even if that choice was a moral abyss. (He stands, looking drained). We won't convince each other, Eleanor. But God help us both when Congregation votes tomorrow. (He walks out, leaving Eleanor staring into the fire, the weight of impossible choices hanging heavy in the quiet room).

  **Key Elements Addressed:**

  1.  **Eleanor's Core Argument:** Clearly articulates the distinction between intention (civilian death as *means*) and foresight (collateral damage). Argues targeting cities proves intent. Rejects utilitarian "greater good" as morally corrupting, emphasizing the intrinsic evil of the act itself.
  2.  **Thorne's Strong Defense:** Grounded in horrific necessity and the "lesser evil" within an impossible situation. Challenges her absolutism by forcing her to confront the concrete, catastrophic alternative (Downfall) and questioning the consistency of condemning the A-bombs but potentially excusing area bombing. Emphasizes context and desperate decision-making under duress, not malice.
  3.  **Responsiveness:** Each point directly engages the previous argument (e.g., Eleanor counters "double effect" with the nature of the targets; Thorne counters her rejection of utilitarianism with the concrete consequences she seemingly ignores; Eleanor counters the "context" argument by refusing to let it excuse the act's nature).
  4.  **No Clear "Win":** Thorne lands heavy blows by forcing Eleanor to confront the human cost of her principles and potential inconsistencies. Eleanor lands heavy blows by exposing the dangerous moral logic Thorne's position implies and the specific nature of the targeting. Both end burdened and unresolved.
  5.  **Staging Hooks:** The setting (SCR, fire, sherry) and the final actions (Thorne leaving drained, Eleanor staring into the fire) provide natural staging points for your chapter, emphasizing the intellectual and emotional weight of the debate. Thorne's final line foreshadows the vote's significance and moral ambiguity.
