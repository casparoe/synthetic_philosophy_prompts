  For resistance: If I normally treat such testimony as decisive (e.g., I'd trust it if told a colleague was drugged), dismissing it only for myself is hypocritical. 

  *scratches head* The tricky bit is showing why akrasia isn't just a compromise but genuinely rational. Maybe frame it as: The drug testimony creates a "perspectival fracture"—my first-order perspective (Q seems true) clashes with my meta-perspective (this seeming is unreliable). Akrasia preserves both truths without pretending they reconcile. 

