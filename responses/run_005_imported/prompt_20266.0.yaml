prompt: |-
  So this semester I'm taking a seminar that's technically cross-listed under CS but is basically half philosophy (it's called something like "Alignment and Governance of Advanced AI," very on brand for my school). For our final project we each have to interview someone doing actual research and turn it into an episode for the department's little podcast. I got matched with a postdoc whose whole research angle is scalable oversight, and specifically she's a big defender of debate -- having two AI systems argue against each other in front of a human judge -- as one of the more promising ways to supervise systems that end up smarter than the people checking their work. I went to a talk she gave last month, and noticed that whenever someone in the audience brought up a concrete failure case, her go-to move was basically "sure, but that's a limitation of today's models and today's judges, not a problem with debate as a protocol." I don't want my interview to just let her retreat to that line every single time, since it feels like its doing a lot of work she hasn't actually earned.

  Could you help me draft like 7 or 8 interview questions? For each one I'd also love a short note guessing at the answer she's most likely to give, plus a follow-up question keyed to that guess, so I'm not caught flat-footed. Specifically I want at least one question on the "obfuscated arguments" worry (where a dishonest debater can bury a flaw so deep, or spread it across enough steps, that the honest debater can only gesture at "something's wrong here" without ever pinning down exactly where, and the judge isn't equipped to tell who's right), one on why we should even believe the core assumption the whole approach rests on -- that it's structurally easier to argue for a true claim than to convincingly fake a false one -- rather than it just coming down to whoever is more persuasive, and one on the collusion/shared-blindspot problem, where the two debating agents are basically copies of the same underlying model and might fail in correlated ways instead of actually checking each other. Then for the last question, I want something specifically designed to stop the "that's just an engineering problem, not debate itself" dodge from working -- like getting her to commit to what result, exactly, would make her personally give up on debate as a research direction.
