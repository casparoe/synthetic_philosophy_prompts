answer: |-
  You've hit on a crucial and fascinating point where Newton's physics and radical theology collide. Your intuition is spot-on: he *is* importing his concept of Absolute Space from the *Principia* to make a core anti-Trinitarian argument. Let's unpack the logic step-by-step:

  1.  **Newton's Absolute Space:** In the *Principia* (Scholium to the Definitions), Newton argues space is absolute, infinite, eternal, immutable, and indivisible. It's the sensorium of God (*Sensorium Dei*). Crucially:
      *   **God is Omnipresent IN Space:** God exists *everywhere* in this absolute space simultaneously. He doesn't "fill" space like water fills a glass; He *is* present in all space by His very nature.
      *   **God is Immutable/Unchangeable:** God's essential nature and attributes do not change.
      *   **Absolute Space is an Attribute/Consequence of God:** Space is the way God's omnipresence manifests. It's not independent of Him.

  2.  **The Theological Argument in Article 5:**
      *   **Premise 1 (From Physics/Theology):** True, supreme divinity (God the Father) must be *absolutely* omnipresent and immutable. This means He cannot be "more" present in one place or "less" present in another ("no place being capable of becoming emptier or fuller of him"). His presence is uniform, infinite, and necessary. He *cannot* move because movement implies changing location relative to space. Movement would mean He was *not* somewhere before and *is* there now, contradicting His necessary omnipresence. His immovability is a *logical consequence* of His perfect, necessary omnipresence.
      *   **Premise 2 (Observation):** Christ (and angels, humans, etc.) are described in scripture as moving from place to place (e.g., Christ ascending to heaven, angels appearing to individuals). Christ has a localized presence at specific times.
      *   **Conclusion:** Therefore, Christ (and all other beings) are fundamentally different in nature from God the Father. Christ is "moveable from place to place," meaning his presence is *not* uniform, infinite, and necessary. He occupies specific locations *within* the absolute space that is the manifestation of the Father's presence. He is *in* space, subject to it, moving *through* it.

  3.  **Why Immovability is THE Big Deal for Anti-Trinitarianism:**
      Newton's logic makes immovability (as a consequence of necessary, uniform omnipresence) **the defining characteristic of true, supreme divinity.** It's the litmus test. Here's why:

      *   **Exclusivity:** Only *one* being can be omnipresent in the absolute, necessary, uniform sense Newton describes. If two beings were both *necessarily* omnipresent everywhere, they would be indistinguishable. The Father's omnipresence/immovability is unique and singular.
      *   **Subordination:** If Christ is movable, he is inherently *limited* and *dependent*. He exists *within* the framework (Absolute Space) that is an expression of the Father's being. He is subject to spatial constraints the Father transcends. This places Christ firmly in the category of a *created being* (albeit the highest created being), not co-equal and co-eternal.
      *   **Distinction of Substance:** For Newton (drawing on early Church Fathers he deemed "correct" like Arius), the Father's unique immovability/omnipresence proves He is of a fundamentally different *substance* (ousia) than Christ. The Father is *autotheos* (God-in-Himself), Christ is *theos* (divine) but derives his existence and nature *from* the Father.
      *   **Preserving Divine Sovereignty:** Newton was obsessed with God's absolute, undivided dominion. A movable Christ, even if divine, implies a division of power or presence. The Father's immovability signifies His complete, unchallengeable control over all creation *from eternity*, without any internal division or shared sovereignty implied by the Trinity.
      *   **Physics as Theological Proof:** Newton believed his physics revealed fundamental truths about God's relationship to creation. Absolute Space *was* God's omnipresence made knowable to reason. Therefore, the observable fact that Christ moved *within* space was, for Newton, irrefutable *physical evidence* of Christ's subordinate, created status. It wasn't just a metaphor; it was a direct application of his scientific framework to theology.

  **In essence:** Newton uses his concept of Absolute Space (as the necessary manifestation of God's omnipresence) to define the *sine qua non* of true divinity: **absolute, necessary, uniform, immovable omnipresence.** Anything that moves from place to place demonstrably lacks this essential attribute and therefore cannot be the supreme God. Christ's scripturally attested movements are, for Newton, the knockout blow against the doctrine of his co-equality with the Father. It's a brilliant (and heretical) synthesis of his physics and his deeply held, secret theological convictions, using the immutability and universality of space as the ultimate proof of the Father's unique supremacy and Christ's derivative divinity. He wasn't just "smuggling" physics in; he was building his entire anti-Trinitarian theology on its foundation.
