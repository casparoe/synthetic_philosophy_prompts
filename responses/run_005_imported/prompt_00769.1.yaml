answer: |-
  ## The Thorne Bequest

  The letter arrived on heavy, cream-colored paper, smelling faintly of dust and cedar. Elara Vance, practical, thirty-two, and deeply skeptical of windfalls, scanned it twice. Silas Thorne, deceased. A distant name, a vague recollection of her grandmother mentioning a reclusive great-uncle twice removed. He had left her everything: the decaying Victorian on the edge of town, its contents, and a parcel of overgrown land. The sole condition was appended, handwritten in spidery ink: *Maintain the Garden. Especially the Moonflowers. They must never be lost.*

  Elara had never been to Willow Creek. She arrived on a grey afternoon, the house looming like a brooding bird. Inside, time had settled thickly. Layers of dust softened sharp edges. In the musty study, she found the deed, bank statements revealing modest but sufficient funds for upkeep, and a single, sealed envelope addressed simply: *For You*.

  Inside, on the same thick paper, another note:

  > *If you are reading this, you are the Keeper. The Garden is not mine, nor was it the Keeper before me. It is for the One Who Comes After. Tend it faithfully. The Moonflowers are the key. When your time comes, you will know what to leave, and for whom. Trust the chain. It holds.*

  Elara frowned. Chain? Keeper? It sounded like the ramblings of an isolated old man. She explored. The house was a museum of solitude. The overgrown land behind it, however, held a surprise. Pushing through tangled ivy and wild raspberry canes, she discovered a walled garden. Neglect reigned, but structure remained beneath the chaos: raised stone beds, paths choked with weeds, and the skeletal remains of arbors. And in one sheltered corner, against the south wall, a cluster of pale, trumpet-shaped flowers glowed faintly in the fading light. Moonflowers. They looked fragile, almost spectral.

  Mr. Finch, the elderly gardener retained by the estate lawyer, arrived the next day. "Aye, the Moonflower patch," he said, his voice raspy. "Mr. Thorne was fierce particular about 'em. Watered 'em himself, even near the end. Wouldn't let me touch 'em, 'cept to clear weeds away. Said they weren't for him."

  "Who were they for?" Elara asked.

  Finch shrugged, tamping tobacco into his pipe. "Never said. Just... *for the one who needs them*. Poetic nonsense, I thought. But he paid well." He gestured at the choked beds. "Rest of it? He didn't much care. Said the Garden was... *insurance*. Never understood that neither."

  *Insurance.* The word echoed the letter's cryptic *chain*. Elara felt the first unsettling tug of the idea. Not a gift for *her*, but a duty towards an unknown future beneficiary. An act performed now, on faith, for someone who might never know you existed, based solely on the expectation that someone *before* you had done the same for *you*, and someone *after* would continue.

  Months passed. Elara moved in, slowly wrestling order from the house's decay. The walled garden became her sanctuary. She cleared paths, pruned roses gone savage, unearthed forgotten herbs. But the Moonflowers were her peculiar charge. She researched them: *Ipomoea alba*, night-blooming, fragrant, ephemeral. Finch taught her their finicky needs – specific soil acidity, careful watering, protection from slugs. She tended them with a diligence that surprised her. She watered them on evenings she felt too tired, protected them from an early frost. Why? The house didn't need them. She didn't particularly like their fleeting, nocturnal beauty. Yet, the compulsion held.

  It was the *uncertainty* that gnawed. Was Silas Thorne simply mad? Was she the punchline of a lonely man's joke? Or was there a chain, stretching invisibly backwards and forwards? Had someone, decades ago, tended these same flowers for Silas, expecting nothing but the hope he would continue the tradition for Elara? And was she now doing it for... whom? A stranger decades hence? Someone who might bulldoze the garden for a swimming pool? The logic felt absurd, yet somehow inescapable. *If* the chain existed, her tending was vital. *If* it didn't, she was merely gardening. But to break the chain *if* it existed... that felt like a profound betrayal of a trust she couldn't verify.

  One crisp autumn evening, sitting amidst the Moonflowers as their white blooms unfurled like silent promises in the dusk, the weight of the inheritance shifted. It wasn’t just about receiving, or even maintaining. It was about *passing it on*. The note said: *When your time comes, you will know what to leave, and for whom.* What could she possibly leave? She wasn't wealthy. She had no profound wisdom. She walked the paths, the scent of damp earth and fading blooms thick in the air. Her gaze fell on the neglected corner where the old greenhouse stood, its glass panes shattered, frame rusting. An idea, fragile as a Moonflower bud, began to form.

  Five years later, Elara sat at the same heavy desk in the study. The house breathed more easily now. The garden, while not pristine, thrived under her care, the Moonflower patch a constant, silent ritual. The lawyer’s letter lay open before her. The diagnosis was clear, the timeline uncertain but finite.

  She took out the thick, cream-colored paper she’d found in a drawer, identical to Silas Thorne’s. Her pen hovered. What could she leave? Not the garden itself; that was the vessel. Not the Moonflowers; they were the symbol. It had to be something *new*, a contribution to the chain, an act of faith for the next Keeper, whoever they might be.

  She thought of the derelict greenhouse, of the native wildflower seeds she’d started collecting, species lost to the surrounding fields through decades of aggressive farming. She’d dreamed of restoring a patch of meadow, a tiny ark of biodiversity. She lacked the funds, the time now.

  Her pen began to move:

  > *If you are reading this, you are the Keeper. The Garden is not mine, nor was it the Keeper before me. It is for the One Who Comes After. Tend it faithfully. The Moonflowers are the key. They remind us we act for those unseen.*
  >
  > *Beyond the south wall, where the old greenhouse stood, lies a parcel of land. I leave funds, held in trust by the solicitor (details enclosed), sufficient to clear it and establish a native wildflower meadow. This is my Bequest. It is not for you, Keeper, but for the land itself, and the creatures that may find refuge there. It is my act in the chain, trusting that you will maintain the Garden, and that the One Who Comes After you will understand, and add their own link when the time comes.*
  >
  > *Trust the chain. It holds.*

  She sealed the envelope, writing *For You* on the front, and placed it inside the desk drawer where Silas Thorne’s had waited for her. She walked out to the garden one last time under the moonlight. The Moonflowers glowed, pristine, ephemeral. She touched a cool, satin petal. Had Silas stood here, feeling this same mix of doubt and stubborn faith? Was there truly a chain, or was it just successive generations of fools, performing rituals for phantoms, mistaking coincidence for connection?

  She would never know. She would never meet the next Keeper, never see if the wildflower meadow bloomed, never know if her small act of ecological faith was honored or plowed under. Her contribution existed only in the realm of potential, in the shared, unverifiable logic of a promise stretched across time. It was a whisper into an abyss, trusting the abyss was structured in a way that might, just might, carry the sound forward. The Moonflowers offered no answer, only their silent, nightly bloom – an act performed solely because it *might* be part of something larger, unseen, and forever unconfirmed. The chain either held, suspended by mutual, acausal faith, or it was nothing but dust and longing. Standing there, bathed in the flowers' cold, fragrant light, Elara found she could no longer distinguish the difference, and that *this* was the heart of the inheritance. She turned and walked back into the silent house, leaving the blooms to the night.
