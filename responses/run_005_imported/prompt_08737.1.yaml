prompt: |-
  Random one from the science-journalism side of my job: I'm one of the judges for a mid-size prize that covers long-form science and ideas writing, and this year's shortlist has thrown up an annoying pair of finalists. Both wrote big features built around a not-yet-peer-reviewed result — one on a room-temperature superconductivity claim, one on an exoplanet biosignature claim — going further out on a limb than most science desks would normally risk, with roughly the same level of hedging and source-checking at the time each piece ran. Eighteen months on, one of those results has been independantly replicated and is being treated as a huge deal; the other quietly fell apart once other labs couldn't reproduce it. Half the judging panel wants to just give the prize to the writer who's bet paid off and drop the other from contention; the other half thinks that rewards an outcome neither writer had any way of controlling for, and that we should be scoring the journalism as it stood at publication, not how the science happened to shake out later. Can you draft the short memo I'll put to the full panel before we vote next week — an actual recommendation, not a fence-sit — that takes the "reward what worked" camp seriously instead of just waving it off?
reasoning: |-
  Okay, the user is a judge for a science writing prize dealing with two controversial finalists. Both journalists wrote about unverified claims—superconductivity and an exoplanet biosignature—with similar rigor at publication time. Now, one story was validated, the other debunked. Half the panel wants to reward the "correct" outcome; half insists on judging based on initial reporting quality.  

  Hmm. The user specifically asked not to fence-sit while still taking the "reward what worked" camp seriously. Tricky! They need a memo draft that advocates for outcome-agnostic judging but without dismissing the other side’s concerns.  

  First, let’s unpack the conflict:  
  - **Pro-outcome judges** see journalism as consequential; a piece that "got it right" arguably served the public better.  
  - **Process judges** argue science is unpredictable—rewarding luck sets bad incentives.  

  The user’s hidden tension? They likely lean toward process (since they called the outcome-focused view "annoying") but need to bridge the gap respectfully. Key angles to address:  
  - **Prize’s purpose**: Is it about impact or craft?  
  - **Risk/reward**: Both writers took identical risks—punishing one for bad luck feels unfair.  
  - **Precedent**: Awarding based on later validation could encourage hype over rigor.  

  The memo must:  
  1. **Acknowledge validity** of outcome-preference ("bet paid off" = real-world value).  
  2. **Reframe rigor as the prize’s core**—hedging, sourcing, contextualizing uncertainty are skills.  
  3. **Preempt slippery-slope fears**: If outcome matters, why not retroactively punish debunked stories?  
  4. **Offer compromise**: Score both pieces equally if methodology matched, but use the *debunked* piece as a case study for why process matters.  

  …Wait, the user wants a *recommendation*, not neutrality. So:  
  **Verdict**: Judge based on publication-state rigor. Why?  
  - Controls for luck.  
  - Aligns with journalism ethics (transparency about uncertainty).  
  - Avoids chilling coverage of high-risk/high-reward science.  

  Final polish: The memo should feel decisive but collegial—no "you’re wrong" energy. Use the exoplanet piece as proof: even with solid sourcing, unreproducible science happens. That’s the game.  

  (Quietly proud of that "time-traveler test" phrasing—concrete and cheeky.)
answer: |-
  ## Memo to Judging Panel: Evaluating Journalism Quality Independent of Scientific Outcomes

  **To:** Science & Ideas Writing Prize Judging Panel  
  **From:** [Your Name], Lead Judge  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Evaluating Shortlisted Entries Involving Unverified Science  

  The tension between the two finalists—both hinging on pre-peer-review claims—demands clarity on our prize’s core purpose: **to reward exceptional science journalism, not scientific outcomes.** While the instinct to honor the writer whose story "aged well" is understandable, I strongly recommend we judge both entries *solely on journalistic rigor and craft at the time of publication*. Here’s why this approach is principled, practical, and fair:  

  ### 1. **We Prize Process Over Providence**  
     Science journalism’s value lies in how writers navigate uncertainty—not whether the science later succeeds. Both authors:  
     - Engaged with preprint/unverified claims (a valid editorial choice when handled responsibly).  
     - Employed similar hedging, contextual caveats, and source diversity.  
     - Took identical *calculated risks* by covering high-stakes, emergent science.  
     Rewarding one over the other based on replication is akin to rewarding a weather forecaster for a lucky guess despite identical methodology. It substitutes hindsight for critical assessment.  

  ### 2. **Outcome-Based Judging Sets a Dangerous Precedent**  
     If we penalize the exoplanet writer for a result outside their control, we:  
     - **Incentivize conservatism**: Discourage coverage of frontier science until consensus forms, delaying public engagement.  
     - **Punish rigor**: Imply that diligent reporting on a falsified claim is inferior, even when the journalism itself was sound.  
     - **Invite inconsistency**: Should we retroactively revoke prizes from past winners if their featured science is later debunked?  

  ### 3. **The "Bet Paid Off" Argument Misreads Journalism’s Role**  
     The superconductivity piece isn’t "better journalism" because the claim held; it’s the *same journalism* that would have been flawed had the claim collapsed *if the reporting was identical in quality*. The writer’s skill is demonstrated by:  
     - How they framed the uncertainty ("This is promising but unconfirmed").  
     - Whom they consulted (skeptics and proponents).  
     - Whether they contextualized the work within broader scientific challenges.  
     **The test is: "Would this piece be defensible even if the science failed?"** If yes, it meets our standard.  

  ### 4. **A Compromise: Score Both on Identical Criteria**  
     I propose we evaluate *both* entries using these publication-era metrics:  
     - **Transparency**: Did the writer explicitly flag the non-peer-reviewed status and replication risks?  
     - **Balance**: Did they include material skepticism from independent experts?  
     - **Proportionality**: Did hype outweigh caveats?  
     - **Public Value**: Did they explain why the claim mattered *despite* the uncertainty?  
     If both pieces performed comparably here, they deserve equal consideration. The exoplanet piece, in fact, may now serve as a *masterclass* in responsible coverage of volatile science—precisely because it avoided overpromising.  

  ### Recommendation:  
  **Do not eliminate either finalist based on later scientific outcomes.** Judge each work as a time capsule of journalistic decision-making under identical conditions of uncertainty. The superconductivity writer’s piece isn’t *better journalism* today than it was at publication; it’s the *same journalism* attached to a now-validated outcome. Our role is to assess the craft, ethics, and clarity of the storytelling—not to act as armchair peer reviewers.  

  Let’s send a message that great science writing endures *because* it is anchored in method, not miracles. I urge the panel to vote based on what the writers controlled: their skill, diligence, and integrity at the moment the public first read their words.  

  **Vote:** Judge both entries on journalistic merit at publication.  

  ---  
  *Signature*  
  [Your Name]  

  ---

  ### Key Persuasive Tactics Used:
  - **Framing**: Positions outcome-focused judging as "providence/luck" vs. "process/rigor."  
  - **Precedent Defense**: Highlights slippery slopes (retroactive revocation, discouraging risk).  
  - **Concrete Metrics**: Shifts focus to checkable journalistic practices at publication time.  
  - **Reframing "Failure"**: The exoplanet piece becomes a test case for *good* journalism under adversity.  
  - **Ethical Appeal**: Aligns with core values of science journalism (transparency over triumphalism).  
  - **Decisiveness**: Takes a stand while validating the other camp’s concerns ("understandable instinct... but").
