answer: |-
  Your thesis is both defensible and insightful – Aquinas's positions are reconcilable through careful attention to the *type* of tyrant and the *source* of authority involved. Here's a robust argument for compatibility, addressing the key counterargument:

  **Argument for Compatibility:**

  1.  **Distinguishing the Types of Tyrants:**
      *   **Sentences (II, d.44):** Focuses on a ruler *"who holds power by no legitimate title"* – a **usurper**. This individual never possessed rightful authority. They are an illegitimate aggressor against the political community from the outset. Their rule is founded on force alone, violating the fundamental principle of just authority derived from God and the consent (tacit or explicit) of the community.
      *   **De Regimine Principum (I, ch.6):** Addresses a ruler *"who degenerates into tyranny"* – a **legitimate ruler turned tyrant**. This individual initially possessed legitimate authority granted by the community or higher authority but subsequently abused it. Their initial title *was* valid.

  2.  **Distinguishing the Grounds for Action:**
      *   **Against the Usurper (Sentences):** Because the usurper has *no legitimate title*, they are fundamentally an *unjust aggressor* against the common good and the political order itself. Resisting them is analogous to individual or communal self-defense against an unjust attack. Killing the usurper isn't primarily an act of *punishment* (which requires authority) but an act of *defensive liberation* from an ongoing, foundational injustice. The private individual acts as an instrument of the community's inherent right to self-preservation against an illegitimate force holding it captive.
      *   **Against the Degenerate Tyrant (De Regimine):** The ruler *had* a legitimate title. Their tyranny is a *perversion* of authority, not its *absence*. Removing them, therefore, is not mere defense against an external aggressor but involves *judgment and correction* concerning the *exercise* of granted authority. This act of judgment inherently requires an authority *higher than the individual* – specifically, the same "public authority" that instituted the ruler in the first place (e.g., the community acting collectively, representative bodies like the nobility or elders, or a higher temporal authority like the Emperor).

  3.  **The Role of "Legitimate Title" and "Public Authority":**
      *   **"Legitimate Title" (Sentences):** Acts as the crucial *threshold*. Its absence places the ruler entirely outside the legitimate political framework. They are *hostis* (a public enemy), not a true ruler. Resistance is extra-institutional because the institution itself is illegitimate.
      *   **"Public Authority" (De Regimine):** Acts as the necessary *agent* for addressing perversion *within* the legitimate framework. Judgment and removal require an authority competent to judge the holder of an office it created or authorized. Private individuals lack this competence and risk catastrophic consequences (ambition, chaos, worse tyranny). The "public authority" embodies the community's collective judgment and legitimate power to rectify the abuse of the mandate it granted.

  4.  **Evolution, Not Contradiction:**
      *   The *Sentences* commentary establishes the fundamental principle: **illegitimacy of origin** justifies resistance, including lethal force by individuals acting *in extremis* for the common good, as there is *no* legitimate authority structure to appeal to.
      *   *De Regimine Principum* builds upon this by addressing the more complex and dangerous scenario: **abuse of legitimate authority**. It applies the *same* underlying principles of justice and the common good but recognizes the procedural necessity of acting through the *legitimate institutional channels* that still exist. The later text doesn't retract the right to resist a usurper; it explicitly cautions against misapplying the *method* of private action to a fundamentally different *situation* (legitimate ruler turned tyrant).

  **Addressing the Strongest Counterargument (Change of Mind):**

  *   **The Counterargument:** The shift from apparent endorsement of private tyrannicide against a usurper in the *Sentences* to strong condemnation of private action against a degenerate tyrant in *De Regimine* reflects Aquinas's mature, more cautious, and politically realist position, effectively retracting or heavily qualifying his earlier, more radical stance.
  *   **Refutation:**
      *   **Contextual Nuance:** The counterargument overlooks the crucial distinction Aquinas himself makes regarding the *origin* of tyranny. He isn't talking about the *same thing* in both texts. The later caution is specifically tied to the *degenerate* tyrant, a category implicitly or explicitly *distinct* from the usurper discussed earlier. *De Regimine* doesn't say "never kill a usurper"; it says "don't leave the killing of *degenerate tyrants* to private judgment."
      *   **Underlying Principle:** The core principle – authority must serve the common good – remains constant. What changes is the *appropriate mechanism* for redress based on whether the authority was *never* legitimate or *became* illegitimate through abuse. The mechanism must fit the nature of the defect.
      *   **Practical Wisdom, Not Reversal:** *De Regimine*'s arguments about the dangers of private initiative (ambition, chaos, danger to good rulers) are pragmatic elaborations on the *application* of justice. They highlight why the *procedural safeguard* of public authority is *essential* in the complex case of a ruler who *was* legitimate. This is an application of prudence to a specific context, not a denial of the fundamental right to resist manifest injustice established earlier.
      *   **Teleological Consistency:** Both positions aim at the same end: the restoration of just rule for the common good. The *Sentences* justifies removing the root cause of injustice (the usurper). *De Regimine* insists on a method that avoids creating a *new* root cause of injustice (anarchy or worse tyranny) when dealing with a perversion *within* the system. The caution in *De Regimine* is a *natural consequence* of recognizing the greater systemic complexity involved in deposing a ruler who started legitimately.

  **Conclusion:**

  Your thesis holds strong. Aquinas provides two distinct frameworks for two distinct types of unjust rule:

  1.  **Usurper (No Legitimate Title):** Resistance, including lethal force by individuals acting for the common good, is justified as defensive action against an illegitimate aggressor. ("Legitimate title" is absent, negating the ruler's status).
  2.  **Degenerate Tyrant (Legitimate Title, Abused Authority):** Removal requires judgment and action by the "public authority" that instituted the ruler, due to the need for legitimate judgment within the existing framework and the grave risks of private action. ("Public authority" is the necessary competent judge).

  The apparent tension arises not from contradiction but from Aquinas addressing different scenarios with the appropriate level of nuance. *De Regimine Principum*'s caution is not a retraction of the *Sentences* but a sophisticated extension of its principles to a more complex and perilous political situation, emphasizing procedural justice and stability when dealing with the corruption of *legitimate* authority. This demonstrates the coherence and depth of Aquinas's political thought, rooted in natural law, justice, and a profound understanding of the common good. Your focus on the functional roles of "legitimate title" and "public authority" is precisely the right lens to reveal this compatibility. Commit to this thesis with confidence; it provides a compelling and textually grounded interpretation.
