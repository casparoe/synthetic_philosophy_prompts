answer: |-
  You've perfectly framed the core tension! The Pasadena paradox *is* a deeper, stranger beast than St. Petersburg, and "undefined" is philosophically far more damaging than "infinite." Here's a breakdown for your readers, contrasting the two paradoxes and explaining the stakes:

  **The Classics: St. Petersburg Paradox (The "Easy Case")**

  1.  **The Game:** Flip a fair coin until it lands Heads. If it first lands Heads on the *n*-th flip, you win $2^n.
      *   *Flip 1: Heads? Win $2. Tails? Flip again.*
      *   *Flip 2: Heads? Win $4. Tails? Flip again.*
      *   *Flip 3: Heads? Win $8. Tails? Flip again.*
      *   *(and so on, ad infinitum)*
  2.  **Expected Value Calculation (EV):** EV = (Prob of Heads on Flip 1 * $2) + (Prob of Tails then Heads on Flip 2 * $4) + (Prob of Tails, Tails, Heads on Flip 3 * $8) + ...
      *   Probabilities: 1/2, 1/4, 1/8, ...
      *   EV = (1/2 * $2) + (1/4 * $4) + (1/8 * $8) + ... = ($1) + ($1) + ($1) + ... = **Infinity**
  3.  **The Paradox:** The expected value is infinite, yet most rational people wouldn't pay more than a modest sum (say $20-$50) to play this game. Why? Infinity feels absurd for a game you'll almost certainly win only a few dollars from.
  4.  **The Philosophical "Problem":** Expected Value reasoning seems to demand you pay any finite price to play, which clashes with intuition. It highlights that unbounded utility (or money) combined with tiny probabilities of massive payoffs breaks naive EV.
  5.  **Resolution Attempts:** Decision theorists often argue this shows the need for:
      *   **Bounded Utility:** Real-world utility (satisfaction) from money doesn't scale infinitely. $1 trillion isn't infinitely better than $1 billion to a human.
      *   **Risk Aversion:** People dislike the extreme variance; losing your $100 entry fee feels bad even if the *average* outcome is huge.
      *   **Finite Resources:** The casino (or universe) can't pay out truly infinite sums.

  **The Stranger Case: Pasadena Paradox**

  1.  **The Game (Hájek & Nover):** Flip a fair coin until Heads. If it first lands Heads on the *n*-th flip, your payoff is **$(-1)^{n-1} * (2^n / n)**.
      *   *Flip 1 (Heads): Win +$2 / 1 = **+$2***
      *   *Flip 2 (Tails then Heads): Win -$4 / 2 = **-$2***
      *   *Flip 3 (T,T,H): Win +$8 / 3 ≈ **+$2.67***
      *   *Flip 4 (T,T,T,H): Win -$16 / 4 = **-$4***
      *   *Flip 5: +$32 / 5 ≈ **+$6.40***
      *   *Flip 6: -$64 / 6 ≈ **-$10.67***
      *   *(Pattern: Sign alternates starting positive, magnitude = $2^n / n)*
  2.  **The Expected Value Calculation (The Problem):** EV = (1/2 * +$2) + (1/4 * -$2) + (1/8 * +$2.67) + (1/16 * -$4) + (1/32 * +$6.40) + (1/64 * -$10.67) + ...
      *   Write it as: EV = Σ [ (1/2^n) * (-1)^{n-1} * (2^n / n) ] = Σ [ (-1)^{n-1} * (1 / n) ]
      *   **EV = Σ_{n=1}^∞ [ (-1)^{n-1} / n ]**
      *   This is the famous **Alternating Harmonic Series**: 1 - 1/2 + 1/3 - 1/4 + 1/5 - 1/6 + ...
  3.  **The Mathematical Curse: Conditional Convergence**
      *   This series **converges** (it sums to a finite number, specifically ln(2) ≈ $0.693) **if you sum the terms in the exact order given: 1, then -1/2, then +1/3, then -1/4, etc.**
      *   **BUT...** (Here's the kicker): This series is **conditionally convergent**, *not* absolutely convergent. This means the series of the *absolute values* of the terms (1 + 1/2 + 1/3 + 1/4 + ...) is the divergent Harmonic Series (which sums to infinity).
      *   **The Riemann Rearrangement Theorem:** For any conditionally convergent series, and for *any* real number target S you pick (e.g., $100, -$1000, infinity, negative infinity), you can rearrange the order of the terms to make the series sum *exactly* to S. You can even rearrange it to make it diverge (oscillate or go to ±∞).
  4.  **The Paradox:** **What is the expected value of the Pasadena game?**
      *   If you sum the payoffs in the *defined order of the game* (flip 1 outcome first, flip 2 outcome second, etc.), you get ln(2) ≈ $0.69.
      *   But is this the "true" EV? The theorem says you could *rearrange the same possible outcomes* (grouping different flip results together in the calculation) and get:
          *   EV = $1,000,000
          *   EV = -$1,000,000
          *   EV = ∞
          *   EV = -∞
          *   EV oscillates forever without settling.
      *   **The expected value is not just infinite or counter-intuitive; it is fundamentally UNDEFINED.** There is no single, objective number that represents the average payoff per game in the long run; it depends entirely on how you choose to *group* or *order* the infinitely many possible outcomes when calculating the sum. The game's rule structure doesn't dictate a unique order for the EV calculation that overrides rearrangement.

  **Comparing the Paradoxes & The Philosophical Stakes**

  | Feature          | St. Petersburg Paradox                    | Pasadena Paradox                              |
  | :--------------- | :---------------------------------------- | :-------------------------------------------- |
  | **Core Issue**   | EV = ∞                                    | EV = **Undefined**                            |
  | **Intuition Clash**| Won't pay high finite price for ∞ EV      | EV calculation *itself* is unstable           |
  | **Math Reason**  | Divergent Series (Sums to ∞)              | **Conditionally Convergent Series**           |
  | **Manipulable?** | No - Sum always diverges to ∞             | **Yes - Riemann Rearrangement Theorem**       |
  | **Philosophical Verdict** | EV is clear (∞), but impractical/needs refinement | **EV is not just infinite, it's incoherent** |

  *   **"Undefined" vs. "Infinite":** Your source is right. "Infinite" is a *clear*, albeit problematic, answer. It tells you the naive sum grows without bound. "Undefined" is a catastrophic failure. It means the very mathematical procedure prescribed by expected value theory *fails to produce any determinate value at all* for this well-defined game. It's not that the value is too big; it's that the calculation self-destructs under scrutiny. Expected Value loses its meaning as *the* guide for rational choice here.
  *   **The Deeper Damage:** St. Petersburg challenges the *application* of EV (due to human psychology, bounded utility). Pasadena challenges the *internal mathematical coherence* of EV itself for a broader class of scenarios involving alternating payoffs with divergent absolute values. It shows EV is vulnerable to manipulation simply by re-describing the same possible outcomes in a different order. If "rational choice" depends on an arbitrary choice of summation order, that's a foundational crisis for theories relying solely on EV.

  **The Debate & Rescue Attempts**

  Decision theorists *do* disagree on the severity:

  1.  **"It's a Fatal Blow" (Hájek, Nover, some others):** They argue Pasadena shows EV is fundamentally flawed. Any theory relying on it needs radical revision or replacement to handle such cases. "Undefined" means rational choice is indeterminate for Pasadena.
  2.  **"It's a Technicality We Can Fix" (Easwaran, Colyvan, Lauwers):** They propose modified definitions of expected value to rescue a unique answer:
      *   **Weak Expectations:** Use limits of finite versions of the game.
      *   **Principal Value:** Insist on summing only in the natural order (flip 1, then flip 2,...), yielding ln(2).
      *   **Discounting:** Introduce a tiny probability the game stops, making the series absolutely convergent and ordering irrelevant. (But this arguably changes the game).
      *   **Extended Preferences:** Argue the problem lies in mapping dollar payoffs to utility, not EV itself.
  3.  **"It Highlights Context, Doesn't Destroy EV" (Peterson, others):** They argue the problem isn't EV, but applying it naively to games with unbounded payoffs lacking a natural "collective" for the long-run average. The rearrangement corresponds to different ways of "clumping" plays together, which isn't how we *actually* play repeated games. The natural order (play once, record result; play again, record result; sum all results) *does* converge to ln(2).

  **Why Pasadena Matters for Your Piece (Pascal's Mugging & Long-Termism)**

  1.  **Beyond Infinity:** Pascal's Mugging critiques often focus on the absurdity of ∞ EV from tiny probabilities. Pasadena shows the problem is *worse*: sometimes EV isn't even ∞, it's *undefined*. This strengthens the critique that naive EV can be mathematically incoherent for extreme low-prob/high-impact scenarios.
  2.  **Manipulation Vulnerability:** The Rearrangement Theorem is like formalizing a "mugging" *within the calculation itself*. A clever advocate could theoretically "rearrange" the potential outcomes of a long-termist intervention to make its EV arbitrarily positive (or negative!), using the same underlying probabilities and payoffs. This exposes a deep fragility in the math.
  3.  **"Undefined" is Scarier:** For policy or massive bets based on EV (like some long-termist interventions), "undefined" is a more terrifying result than "infinite." Infinity might be tamed with bounds or discounting; "undefined" suggests the core justification dissolves into arbitrariness.

  **In Summary for Your Readers:**

  *   **St. Petersburg** is the "easy" paradox: a coin-flip game with infinite expected value that feels wrong. It asks us to refine how we apply EV (e.g., bounded utility).
  *   **Pasadena** is the "stranger" paradox: a coin-flip game with payoffs that flip between positive and negative. Its expected value isn't infinite—it's **mathematically undefined**. Depending on how you *group* the infinite possible outcomes in the calculation, you can make the EV $0.69, $1 million, -$1 billion, or infinity. This strikes at the heart of whether expected value can *always* be a coherent guide for rational choice, especially when dealing with tiny probabilities of massive, alternating consequences. It shows the vulnerability of EV reasoning to manipulation in a way St. Petersburg does not, making it highly relevant to critiques of long-termist calculations that rely on similar probabilistic reasoning about the far future. While some theorists downplay it as a technicality, others see it as exposing a profound flaw.
