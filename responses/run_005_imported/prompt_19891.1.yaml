  Now, applying this to AI. The user mentions proposals like a moratorium on large training runs, export controls on chips, and international treaties. I need to map von Neumann's objections to these. First, interconnectedness: AI development is deeply tied to computing, data science, and many industries. Banning large training runs might stall progress in all these areas. That's a straightforward transfer from his first argument.

  Second, global enforcement. AI research is global; a treaty would need all major powers to comply. But creating such an authority is as hard as solving the conflicts it's meant to prevent. This also transfers directly. 

  Third, the ethos of industrial civilization. Our economy thrives on innovation. Restricting AI could be seen as anti-progress, which von Neumann thought only a disillusioned society would accept. Today, while some criticize big tech, the push for AI advancement is still strong. So this objection holds too.

  But are there differences? AI has unique features. Rapid, unpredictable scaling. A single model can have many emergent capabilities. This makes isolating "dangerous" models harder than nuclear tech. Also, AI development is cheaper and more diffuse. Export controls on chips might slow things but can't stop progress entirely, as alternatives emerge. Plus, dual-use is intrinsic; the same model can be beneficial and harmful. 

  So where would von Neumann qualify his arguments? The enforcement challenge is bigger because AI isn't like nuclear weapons—it's software, easier to copy and hide. The diffuse nature means even with treaties, compliance is tougher. The ethos point still stands, but public concern about AI risks is higher now, so society might be more open to restrictions. 

  His alternative? Continuous small decisions. Adaptive governance, real-time monitoring, safety research, and resilience planning. He'd focus on incremental steps rather than grand prohibitions. 

