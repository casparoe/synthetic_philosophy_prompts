answer: |-
  That's a fascinating and emotionally complex situation. Danny's argument *sounds* rational on a purely transactional level, but it's fundamentally flawed and reveals exactly why your grandpa likely didn't choose him. Here's why:

  1.  **Misunderstanding "Genuine Love for the Craft":** Grandpa's core criterion isn't "who helped the most after the decision was made." It's "who genuinely loves the craft." If you *truly* love the craft:
      *   **You'd want to be there anyway:** Working in the shop, learning, creating, and being part of the business isn't just "acting devoted" – it's *doing what you love*. Stopping because you won't get a reward proves you were only there *for* the reward.
      *   **The work is its own reward:** The satisfaction comes from the doing, the problem-solving, the creation, the connection to the craft and potentially to your grandfather. The inheritance is a potential *future consequence*, not the *purpose* of being involved.
      *   **Danny's logic exposes his motives:** By declaring it pointless now, Danny explicitly confirms that *for him*, the weekend work was *only ever* about influencing the inheritance decision. He's essentially proving your grandpa's assessment correct – he lacks the genuine love.

  2.  **Grandpa's "Read" Likely Included Predicting This Exact Behavior:** Your grandpa, being the perceptive judge of character he is, almost certainly *foresaw* how different people would react once the decision was announced and the pressure was off. He knew:
      *   **Who would keep showing up simply because they *wanted* to.**
      *   **Who would vanish immediately once the "carrot" was perceived as gone.**
      His decision wasn't just based on past behavior, but likely also on his prediction of *future* behavior once the stakes seemed removed. Danny is playing right into that prediction.

  3.  **The Value Beyond Inheritance:** Even if the ownership decision is sealed:
      *   **Learning the Craft:** Time spent learning from your grandpa and experienced workers is valuable *in itself*, regardless of future ownership. It's knowledge and skill you carry forever.
      *   **Relationship with Grandpa:** Showing up demonstrates care for *him*, his life's work, and spending time with him during his remaining active years. Abandoning the shop now sends a very clear message about where your priorities lie.
      *   **Supporting the Business:** The business still needs to run smoothly until he retires. Abandoning it now could harm its operations, reputation, and ultimately devalue the inheritance for whoever *does* get it.
      *   **Respect and Integrity:** Honoring a commitment (even an informal one like weekend help) and showing respect for the craft and the person who built it matters. Stopping purely because you won't get the prize reveals a lack of these qualities.

  4.  **The Instrumental vs. Intrinsic Motivation Trap:** Danny is thinking purely **instrumentally** – work is only a means to an end (the inheritance). Your grandpa values **intrinsic motivation** – the end (engaging in the craft) *is* the reward. Danny's argument is rational *only* if you accept his purely instrumental view, which directly contradicts the core value your grandpa is seeking.

  5.  **Potential Practical Oversights (Even if Unlikely):** While your grandpa is decisive, life is messy:
      *   What if the chosen heir has a change of heart, gets sick, or passes away unexpectedly before the transfer?
      *   What if the business faces an unforeseen crisis requiring all hands on deck? The person who abandoned ship won't be looked upon favorably, regardless of paperwork.
      *   Your continued dedication strengthens your position as a reliable steward, even if not the primary owner.

  **Why it rubbed you the wrong way:**

  *   **It Felt Cynical and Transactional:** Danny reduced a deep question of passion, legacy, and family to a cold calculation about wasted effort.
  *   **It Devalued the Craft:** It implied the work itself, and the time with your grandpa, had no worth outside of the inheritance.
  *   **It Revealed Danny's True Colors:** His argument starkly showed his primary motivation was the money/business, not the craft itself.
  *   **It Felt Disrespectful:** To your grandpa, his life's work, and potentially to those who genuinely do love the craft.
  *   **It Threatened Something Meaningful:** You likely sense that abandoning the shop now would damage relationships, hurt the business, and betray something important, even if the inheritance outcome is fixed.

  **Conclusion:**

  Danny is being **instrumentally rational but morally and relationally short-sighted.** His logic only holds if you ignore the core values your grandpa explicitly stated: genuine love for the craft. By advocating to stop, Danny proves he lacks that love, validating your grandpa's judgment. His argument is rational only within his own transactional framework, which is precisely the framework your grandpa rejects.

  **The truly "rational" action, aligned with your grandpa's values, is to keep showing up *if you genuinely enjoy and value the work and the connection*.** If you were only there for the inheritance, then stopping is logical, but it also confirms you weren't the right choice. Your discomfort likely stems from understanding that Danny's path leads to losing something valuable – the connection, the craft, the respect – regardless of who gets the business. Keep showing up because you *want* to be there, not because you think it will change an envelope. That's the essence of what your grandpa was looking for all along.
