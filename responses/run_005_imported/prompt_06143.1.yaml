  We are discussing why paraconsistency alone does not block Curry's paradox and what further restriction is needed.

  First, recall Curry's paradox. It uses a sentence C that says: "If this sentence is true, then P", where P is an arbitrary sentence. We can represent this as C ↔ (T(C) → P), where T is a truth predicate. In a logic with a fixed-point construction (like in arithmetic or set theory) we can form such a sentence.

  The derivation of Curry's paradox typically goes as follows:

  1. Assume T(C) [i.e., assume C is true].
  2. By the equivalence, we get T(C) → P.
  3. Since we have T(C) (from 1) and T(C) → P, by modus ponens we get P.
  4. So, we have shown: T(C) → P.
  5. But by the equivalence, this is exactly T(C) (because C is equivalent to T(C) → P).
  6. Therefore, T(C) (from 4 and 5).
  7. Then, using T(C) and T(C) → P (which we have from step 4), we get P by modus ponens.

  Thus, we have proved P for an arbitrary P. This trivializes the system.

  Note that this derivation does not use negation. It only uses the following:
  - The equivalence C ↔ (T(C) → P)
  - Modus ponens (→ elimination)
  - The ability to form the Curry sentence (via fixed-point or self-reference)

  Now, why doesn't paraconsistency (by which we mean the failure of explosion, i.e., A ∧ ¬A ⊦ B is not valid) help here? Because the derivation above does not involve a contradiction at all. It only uses the conditional and modus ponens. Therefore, even if the logic is paraconsistent (so that contradictions do not lead to triviality), we still get triviality via Curry's paradox.

  The problem lies in the rules governing the conditional. Specifically, the above derivation relies on the rule of modus ponens and the fact that the conditional is defined in such a way that we can form the Curry sentence and reason with it as above.

  To block Curry's paradox, we must restrict some rule that is used in the derivation. The key step is the use of modus ponens? But modus ponens is fundamental. Alternatively, we might question the equivalence principle or the fixed-point construction. However, in the context of dialetheism and paraconsistent logics, a common approach is to restrict the structural rules governing the conditional.

  The underlying proof-theoretic reason is that the Curry derivation uses a form of contraction. Contraction is a structural rule that allows the use of an assumption multiple times. In the derivation above, note that we use the assumption T(C) twice: once to derive T(C)→P (via the equivalence) and then again to apply modus ponens to get P. In step 3, we use T(C) (from step 1) and then again in step 7. But note that in step 4 we discharge the assumption of T(C) to get T(C)→P, and then in step 6 we get T(C) without that assumption. So we are not literally using the same token of T(C) twice. However, in the context of substructural logics, the rule of contraction is often identified as the culprit.

  Specifically, in the rule of implication introduction (which we use in step 4: from having assumed T(C) and derived P, we conclude T(C)→P), the issue is that we are allowed to use the assumption T(C) arbitrarily many times. But in the Curry derivation, we are essentially using the same assumption in two different ways: once to get the conditional and then to detach it. This is a form of contraction.

  In linear logic, for example, contraction is not allowed. Without contraction, we cannot use the same assumption multiple times. So, if we have a logic without the contraction rule, we can block Curry's paradox.

  Let me try to see how the derivation would fail without contraction.

  We assume T(C). Then, by the equivalence, we get T(C)→P. But without contraction, we might not be able to use T(C) again. However, note that in the derivation, we use T(C) only once to get T(C)→P (via the equivalence) and then we have T(C) again by step 6. But step 6 is obtained from step 4, which is T(C)→P. And by the equivalence, T(C)→P is equivalent to T(C). So we get T(C) without the initial assumption. Then we use modus ponens on T(C) and T(C)→P. But note that T(C)→P is already available. However, without contraction, we might not be able to use the same T(C) for both the equivalence and the modus ponens? Actually, the issue is more subtle.

  In the step where we have T(C) (from step 6) and T(C)→P (from step 4), we can still apply modus ponens. So what breaks?

  The problem is that in the step of deriving T(C)→P (step 4), we are discharging the assumption T(C). But without contraction, we might not be able to use that assumption multiple times. However, in the derivation above, we only used the assumption T(C) once to get T(C)→P (via the equivalence and modus ponens). Then we get T(C) without that assumption. So it seems we didn't use contraction.

  But let's look at the equivalence step. The equivalence C ↔ (T(C)→P) is used twice: once to go from T(C) to T(C)→P (because if C is true then T(C)→P) and then again to go from T(C)→P to T(C). So we are using the equivalence twice. However, that is not the same as contraction.

  The real structural rule that is being used and that is essential is the rule of contraction. But how? Let me represent the derivation in a sequent calculus style.

  Suppose we have the following axioms and rules, including the truth rules and the fixed point:

  We have: T(C) ⊢ T(C) → P   [from the equivalence, since C ↔ (T(C)→P), so if T(C) then T(C)→P]
  and conversely: T(C) → P ⊢ T(C)

  Then the derivation:

  1. T(C) ⊢ T(C)   [axiom]
  2. T(C) ⊢ T(C)→P   [by the rule above, from 1]
  3. T(C), T(C)→P ⊢ P   [by modus ponens, which in sequent calculus is the rule: Γ ⊢ A→B, Γ ⊢ A ⇒ Γ ⊢ B, but note that we have two premises. Alternatively, we can write: T(C)→P, T(C) ⊢ P]

  But step 2 gives T(C) ⊢ T(C)→P, and step 3 requires both T(C) and T(C)→P to get P. So to combine:

  4. T(C) ⊢ P   [from 2 and 3? How?]

  In sequent calculus, we can use the cut rule:

  From Γ ⊢ Δ, A and A, Σ ⊢ Π, we can get Γ, Σ ⊢ Δ, Π.

  But here:

  We have:
    T(C) ⊢ T(C)→P   [step 2]
  and we have:
    T(C)→P, T(C) ⊢ P   [step 3]

  We want to get T(C) ⊢ P.

  We can cut on T(C)→P:

  Let Γ = T(C), Δ = empty, A = T(C)→P, and then Σ = T(C), Π = P.

  So:
    T(C) ⊢ T(C)→P   and   T(C)→P, T(C) ⊢ P

  By cut, we get T(C), T(C) ⊢ P.

  But we have two occurrences of T(C). Now, without contraction, we cannot reduce T(C), T(C) to T(C). So we get T(C), T(C) ⊢ P.

  Then we can use contraction to get T(C) ⊢ P? But if we don't have contraction, we are stuck with T(C), T(C) ⊢ P. Then we cannot derive T(C) ⊢ P.

  But wait, we can also use the rule of implication introduction to get ⊢ T(C)→P? Let's see:

  From T(C) ⊢ P (which we don't have) we would get ⊢ T(C)→P. But without contraction, we don't get T(C) ⊢ P, only T(C), T(C) ⊢ P.

  So, without contraction, we cannot derive T(C) ⊢ P. Therefore, we cannot get step 4 (T(C)→P) as a theorem. Then the rest of the derivation fails.

  Alternatively, note that in the natural deduction style, when we assume T(C) and use it to get T(C)→P (via the equivalence) and then use that same T(C) again to detach P, we are using the assumption T(C) twice. Without contraction, we are not allowed to use an assumption more than once. So the derivation would require two copies of T(C). But we only have one. Therefore, we cannot both use it to get T(C)→P and then use it again to detach.

  In the step-by-step:

  1. Assume T(C) [one copy].
  2. From T(C) and the equivalence, we get T(C)→P. [we used the assumption once]
  3. Now we need to use T(C) again to apply modus ponens to T(C)→P? But we don't have a second copy of T(C). Without contraction, we cannot reuse the same assumption.

  Therefore, the derivation fails.

  So the key is the structural rule of contraction. In a logic without contraction, we can block Curry's paradox.

  This is why dialetheists who use paraconsistent logics to handle the Liar paradox (which only requires the failure of explosion) still need to address Curry's paradox by adopting a logic that lacks the contraction rule. This is the case, for example, in the relevance logic approach (like in the logic R without contraction) or in linear logic.

  In summary:

  - Paraconsistency (failure of explosion) does not block Curry's paradox because the derivation does not involve a contradiction.
  - The rule that must be restricted is the structural rule of contraction (which allows the duplication of assumptions: from A to A,A). Without contraction, we cannot use the same assumption multiple times, which breaks the Curry derivation.

  Thus, the asymmetry between the Liar and Curry paradoxes is that the Liar only requires the logic to be paraconsistent (to avoid explosion) while Curry requires the logic to be substructural, specifically without contraction.
answer: |-
  The asymmetry between the Liar paradox and Curry's paradox arises from their distinct proof-theoretic requirements. While paraconsistency—invalidating *ex contradictione quodlibet* (ECQ), i.e., \(A \land \neg A \vdash B\)—suffices to prevent triviality from explicit contradictions like the Liar, it does not address the structural properties of the conditional exploited by Curry's paradox. Below, I explain why paraconsistency alone is insufficient and identify the key structural rule that must be restricted to block Curry's trivialization.

  ### 1. **Curry's Paradox Derivation**
  Curry's paradox uses a self-referential sentence \(C\) such that \(C \leftrightarrow (T(C) \to P)\), where \(T\) is a truth predicate and \(P\) is any proposition. The derivation proceeds without negation or explicit contradiction:

  1. **Assumption**: \(T(C)\) (begin conditional proof).  
  2. **Biconditional elimination**: \(T(C) \to (T(C) \to P)\) (from \(C \leftrightarrow (T(C) \to P)\) and \(T(C)\)).  
  3. **Reiteration**: \(T(C)\) (reusing the assumption).  
  4. **Modus ponens**: \(T(C) \to P\) (from 2 and 3, using modus ponens on \(T(C) \to (T(C) \to P)\) and \(T(C)\)).  
  5. **Modus ponens**: \(P\) (from 3 and 4).  
  6. **Conditional proof**: \(T(C) \to P\) (discharging assumption 1).  
  7. **Biconditional elimination**: \(T(C)\) (from \(C \leftrightarrow (T(C) \to P)\) and 6).  
  8. **Modus ponens**: \(P\) (from 4 and 7).  

  This derives arbitrary \(P\), trivializing the system. Crucially:
  - Steps 1–6 use \(T(C)\) to derive \(T(C) \to P\).
  - Steps 7–8 use \(T(C) \to P\) to derive \(T(C)\) and then \(P\).
  - No negation is involved; the paradox relies entirely on the conditional \(\to\), modus ponens, and self-reference.

  ### 2. **Why Paraconsistency Fails to Block Curry**
  Paraconsistency invalidates ECQ, meaning that a contradiction \(A \land \neg A\) does not entail arbitrary \(B\). However, Curry's derivation **never produces a contradiction**. It hinges on:
  - The **implication structure**: Specifically, the ability to derive \(T(C) \to P\) by assuming \(T(C)\) and using modus ponens.
  - **Self-reference**: The fixed-point construction \(C \leftrightarrow (T(C) \to P)\).

  Paraconsistency restricts only the behavior of *negation* and *contradiction*. Since Curry avoids both, a paraconsistent logic like **LP** (Logic of Paradox) remains vulnerable:
  - LP retains **modus ponens** and **contraction** (explained below).
  - LP validates all classical entailments for the conditional when no gluts (true contradictions) are involved, enabling steps 1–8.

  Thus, paraconsistency addresses explosion but not the conditional's structural properties exploited by Curry.

  ### 3. **The Core Problem: Contraction**
  The proof-theoretic culprit is the **structural rule of contraction**, which allows reusing an assumption multiple times. Contraction is implicit in steps 3 and 4 of Curry's derivation:
  - Step 3 reiterates \(T(C)\) after step 2 derives \(T(C) \to (T(C) \to P)\).
  - Step 4 applies modus ponens to \(T(C) \to (T(C) \to P)\) and \(T(C)\), yielding \(T(C) \to P\). This requires two uses of \(T(C)\):  
    - One to instantiate the antecedent of \(T(C) \to (T(C) \to P)\).  
    - One to satisfy the antecedent of the resulting \(T(C) \to P\).  

  In sequent calculus, contraction is formalized as:  
  \[
  \text{(Contraction)} \quad \frac{\Gamma, A, A \vdash B}{\Gamma, A \vdash B}
  \]  
  It permits reducing duplicate assumptions to a single occurrence. Curry's derivation effectively uses contraction by employing \(T(C)\) **twice** in a context where it is assumed only once (step 1). Without contraction, step 4 fails because \(T(C)\) cannot be reused.

  ### 4. **Blocking Curry by Restricting Contraction**
  To prevent trivialization, dialetheists adopt **substructural logics** that invalidate contraction. For example:
  - **Relevant logics** (e.g., **R** without contraction) or **linear logic** drop contraction entirely.
  - **How it blocks Curry**:  
    - From assumption \(T(C)\), step 2 yields \(T(C) \to (T(C) \to P)\).  
    - Without contraction, \(T(C)\) cannot be reused. Step 4 requires both:  
      - \(T(C)\) to detach \(T(C) \to (T(C) \to P)\) (yielding \(T(C) \to P\)).  
      - Another \(T(C)\) to detach \(T(C) \to P\) (yielding \(P\)).  
    - But only one \(T(C)\) exists. Deriving \(P\) now requires two copies of \(T(C)\), i.e., \(T(C), T(C) \vdash P\).  
    - Without contraction, this cannot reduce to \(T(C) \vdash P\). Steps 6–8 are blocked.  

  ### 5. **Proof-Theoretic Asymmetry: Liar vs. Curry**
  - **Liar paradox**: Depends on a contradiction \(L \leftrightarrow \neg T(L)\). Paraconsistency blocks triviality by rejecting ECQ, allowing \(L \land \neg L\) to be true without exploding.  
  - **Curry paradox**: Depends on the **contractive use of the assumption** \(T(C)\) in conditional proof. Contraction enables the critical step where \(T(C)\) is reused to derive \(P\). Paraconsistency does not touch this rule, making Curry "harder."  

  In essence, the Liar targets negation, while Curry targets the structural rules governing assumptions and conditionals. Restricting contraction (independently of negation) is necessary to preserve non-triviality in dialetheic systems.
