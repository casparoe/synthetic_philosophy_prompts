  The single candle on Isaac Newton’s desk guttered, casting long, nervous shadows across the piles of manuscript. Outside, the Cambridge night was still, the stone walls of Trinity College holding the silence like a tomb. Inside, Newton’s mind was a tempest.

  Before him lay the fair copy of *Two Notable Corruptions of Scripture*, the ink barely dry on the pages he’d labored over for months. It was a meticulous dissection, a surgeon’s report on the body of Scripture. His arguments were crystalline, irrefutable – to him. He traced a trembling finger over the critical passage: 1 Timothy 3:16.

  *“Great is the mystery of godliness…”* The printed Greek Bibles read *Theos ephanerōthē en sarki* – **God** was manifest in the flesh. Heresy! The very foundation of the monstrous Trinity. His quill hovered, pointing at the crucial word. He knew, with the absolute certainty he applied to celestial mechanics, that the original text had read *hos ephanerōthē en sarki* – **who** was manifest in the flesh. A simple, deliberate scribal corruption centuries ago. Two strokes of the pen, turning the abbreviation **OC** (ὃς, *hos*) into **ΘC** (Θεὸς, *Theos*). A tiny alteration, a monstrous fraud perpetrated to bolster the Athanasian lie that Christ was co-equal, co-eternal God. The Nicene Council, that 4th-century cabal, had cemented the perversion, obscuring the pure, original faith.

  His gaze shifted to the other target: 1 John 5:7, the blatant interpolation about the Father, Word, and Holy Spirit bearing witness in heaven. *That* verse, absent from the earliest Greek manuscripts, was a later, clumsy fabrication inserted to prop up the tottering edifice of the Trinity. He’d traced its history, documented its absence, exposed it.

  He’d sent it to John Locke, trusting his friend’s discretion. Locke, impressed, had arranged for anonymous publication in the Netherlands through Jean Le Clerc. Safer there, away from the prying eyes and grasping hands of Anglican orthodoxy. The letter from Le Clerc lay beside the manuscript, confirming receipt and imminent printing.

  *Imminent printing.*

