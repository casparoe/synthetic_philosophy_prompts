  1. Bell's theorem and what it rules out: local hidden variable theories that reproduce quantum correlations.
  2. The Everettian (Many-Worlds) perspective: no nonlocality because there is no single outcome; branching avoids the need for nonlocal influences.
  3. The Bohmian perspective: nonlocality is real but hidden by the quantum equilibrium, making it non-signaling.
