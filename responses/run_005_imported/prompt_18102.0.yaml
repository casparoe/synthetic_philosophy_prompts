  **E:** The wavefunction doesn't "know" about branches in that way. The entire wavefunction is a superposition. When Alice measures, she becomes entangled with her particle. The state is now a superposition of (Alice-up, particle-up) and (Alice-down, particle-down). Then Bob measures his particle. Since the two particles were entangled, when Bob measures, he becomes entangled with both Alice and his particle. So the state becomes a superposition of (Alice-up, Bob-down) and (Alice-down, Bob-up). The branching happens in a way that the correlations are automatic. There's no need for a nonlocal link because the entanglement is already in the wavefunction.

  **B:** But that entanglement was set up in the past, so it's a past common cause. But Bell's theorem rules out local common causes! So how can that be?

  **E:** Bell's theorem rules out local common causes that are classical, i.e., that assign definite values to the outcomes. In MWI, the common cause is the entangled wavefunction, which is a quantum state that doesn't assign definite values until measurement, and then it does so in a way that the outcomes are correlated. The wavefunction is the common cause, and it's nonlocal in the sense that it's a global object, but the dynamics are local.

  **B:** Now we're getting to the heart of it. You admit the wavefunction is global, so isn't that nonlocality? And in Bohm, we also have a global wavefunction, but we have particles too. The nonlocality is in the particle dynamics. But in both cases, the wavefunction is nonlocal.

  **E:** But in MWI, the wavefunction is all there is. And since the dynamics are local (in the sense of the Schrödinger equation having local interactions), the theory is local. Nonlocality would require an influence propagating faster than light, which isn't there. In Bohm, you have an explicit nonlocal influence: the velocity of Bob's particle depends on Alice's setting and outcome.

  **B:** But that influence can't be used to send a signal because of quantum equilibrium. So is it really nonlocality? Or is it just a mathematical artifact that doesn't affect what we observe? Bell's theorem says that any theory that reproduces quantum correlations must be nonlocal, but it doesn't specify what kind of nonlocality. In Bohm, we have a nonlocal dynamics, but it's hidden. In MWI, you avoid nonlocal dynamics by having no definite outcomes until branching, but then you have a global state. So which one is more local?

  **E:** I'd argue that MWI is more parsimonious because it doesn't add particles and a guiding equation. And the branching is a consequence of the wavefunction evolution. But let me press you: if the nonlocality in Bohm can't be used for signaling, is it really a physical nonlocality? Or is it just a way of talking about the correlations that are already in the wavefunction?

  **B:** That's a fair point. Some Bohmians would say the nonlocality is real but hidden. But others might say it's a feature of the ontology that doesn't violate relativistic causality because of the no-signaling theorem. But then, in MWI, you have branching that is global and instantaneous. Isn't that a form of nonlocality? The branching at Alice's end must be synchronized with the branching at Bob's end to ensure consistency.

  **E:** But it's not synchronized; it's just that the wavefunction is what it is. When Alice measures, she branches locally. Then Bob measures, and he branches locally. The "synchronization" is just the unitary evolution of the wavefunction. There's no separate synchronization step. The wavefunction evolves according to the Schrödinger equation, which is local, so the correlations emerge naturally.

  **B:** But what if Alice and Bob measure at spacelike separation? The time ordering is frame-dependent. In one frame, Alice measures first; in another, Bob. But the joint outcome is the same. How does MWI handle that without nonlocality?

  **E:** In relativistic quantum mechanics, we use a quantum field theory with a unitary representation of the Poincaré group. The wavefunction (or state vector) evolves unitarily, and for spacelike separated measurements, the operations commute. So the order doesn't matter. The final state is the same regardless of the frame. The branching happens in a way that is consistent with relativity because the wavefunction evolution respects the causal structure.

  **B:** But then, the branching itself is not a physical process; it's just a way of interpreting the wavefunction. So are we just arguing about the ontology? Both theories use the same wavefunction evolution and make the same predictions. Bohm adds particles and a nonlocal guiding equation; MWI adds many worlds. But neither can be distinguished experimentally.

  **E:** Exactly. So maybe the disagreement is about which ontology is more elegant or parsimonious. Bohm has nonlocal dynamics but definite trajectories. MWI has local dynamics but many worlds. The nonlocality in Bohm is a consequence of the particle ontology, but it's hidden by quantum equilibrium. In MWI, the locality is preserved because there's no need for nonlocal influences — the wavefunction evolves locally, and the branching is a local process.

  **B:** But then, what does Bell's theorem tell us? It tells us that we can't have both locality and a single outcome. Bohm gives up locality (in the sense of parameter independence) but keeps a single outcome. MWI gives up the single outcome but keeps locality (in the sense of local dynamics). So both are consistent with Bell's theorem, but they give up different things.

  **E:** And both respect no-signaling, which is the physical constraint from relativity. So the question is: is the nonlocality in Bohmian mechanics a real physical nonlocality, or is it just an artifact of the ontology? And similarly, is the branching in MWI a real process, or just a way of interpreting the wavefunction?

  **B:** I think we've reached the sharp point: we agree on the equations and the experimental predictions. The disagreement is purely ontological. Bohmians see the wavefunction as guiding real particles, and the nonlocality is a feature of that guidance. Everettians see the wavefunction as the sole reality, and branching is how we account for definite experiences. Neither can be proven right or wrong by experiment.

  **E:** So perhaps the word "locality" is being used in two different senses. In the dynamical sense, MWI is local because the evolution is local. In the ontological sense, both have a global wavefunction. And Bohm has an additional nonlocal dynamics for particles. But since the nonlocal dynamics can't be detected, maybe it's not a physical nonlocality.

  **B:** Or maybe it is physical because it's part of the causal mechanism, even if it's hidden. But we can't settle that. So we're left with a choice of ontology. I prefer Bohm because it gives a clear account of definite outcomes without branching. You prefer MWI because it avoids nonlocal dynamics.

  **E:** And we both agree that Bell's theorem doesn't force nonlocality in the sense of faster-than-light signaling, but it does force us to give up either dynamical locality (as in Bohm) or the idea of a single outcome (as in MWI).

  **B:** Exactly. So we can stop yelling about it.

  **E:** Agreed. Want to go play some video games?

  **B:** Sure, but only if we can do it in separate branches so we both win.

  **E:** [Laughs] Touché.

