answer: |-
  You've hit on a profound tension in Ramsey's thought—one he never resolved but would have wrestled with intensely. Let's reconstruct the internal debate, grounded in his known writings and intellectual temperament. The clash isn't just between two ideas; it’s between **formal rationality** and **existential sensibility**.

  ---

  ### **Step 1: Ramsey Confronts Bostrom’s Argument**
  Assume Ramsey hears Bostrom’s core case:  
  - *Premise 1*: A tiny probability of preventing human extinction (e.g., 1 in a billion)  
  - *Premise 2*: An astronomically large number of potential future lives (e.g., 10^38 beings)  
  - *Conclusion*: Expected utility (probability × impact) demands prioritizing far-future risks over near-term suffering.  

  **Ramsey the Formal Rationalist (1926) reacts:**  
  - He *invented* the framework for this calculation. His 1926 paper establishes:  
    - Beliefs as probabilities ("degrees of belief").  
    - Actions judged by expected utility.  
    - No principled reason to exclude future lives from the sum.  
  - **Objection?** None mathematically. If future lives have positive moral weight, and probabilities are non-zero, the conclusion holds. To reject it, he’d need to attack the premises.  

  ---

  ### **Step 2: Ramsey the Existentialist (1929) Strikes Back**  
  From his 1929 notes ("Epilogue," written months before his death):  
  > *"I don’t feel the least humble before the vastness of the heavens. The stars may be large, but they cannot think or love; and these are qualities which impress me far more than size does."*  
  > *"The world may be ‘going to the dogs’ for anything I care. [...] Discounting for uncertainty, the present value of the future catastrophe is nothing."*  

  **His counter-arguments:**  
  1. **Moral Relevance of Scale**:  
     - Size ≠ moral significance. Stars are physically vast but *empty of value*. Future humans are numerous but abstract. What matters is *concrete experience* (thought, love, suffering)—things that exist *now* or in the proximate future.  
     - **Rebuttal to Bostrom**: "Your math assumes all lives are interchangeable tokens. But value isn’t additive like coins. A single real human relationship outweighs 10^38 abstract potentialities."  

  2. **Hyperbolic Discounting**:  
     - Ramsey mocked constant discount rates. In *On Discounting*, he wrote:  
       > *"We do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible."*  
       Yet he *also* said we discount for **uncertainty** and **psychological distance**. A future 10^38 years away isn’t just uncertain—it’s *incomprehensible*. Its "present value" approaches zero *because it feels unreal*.  
     - **Rebuttal**: "Your expected utility calculation ignores the *qualitative difference* between proximate and distant futures. I discount not just by time, but by *meaningful connection*."  

  3. **Perspective Over Scale**:  
     - His "picture drawn in perspective" metaphor is key. Just as a nearby candle outshines a distant star, present joys/agonies dominate abstract statistical lives.  
     - **Rebuttal**: "Your math treats time as a neutral grid. But human existence is *lived in the foreground*. Sacrificing real people for statistical phantoms is a category error."  

  ---

  ### **Step 3: The Synthesis – Where Ramsey Would Land**  
  Ramsey wouldn’t dismiss the math outright. He’d dissect its assumptions with razor logic:  
  1. **Attack the Probability Assignments**:  
     - "Your 1-in-a-billion risk estimate isn’t a ‘degree of belief’—it’s a wild guess. My theory requires *grounded* probabilities, not arbitrary ones." (He’d demand robust epistemology for long-term forecasts.)  

  2. **Challenge Moral Aggregation**:  
     - "Why should potential lives count equally with actual ones? My ‘perspective’ view suggests weighting lives by their *experiential immediacy*." (He’d lean toward *person-affecting morality*.)  

  3. **Reject "Astronomical Value" as Meaningless**:  
     - "A number like 10^38 is cognitively and morally inert. Utility theory breaks down when numbers exceed human comprehension—they become *aesthetic* constructs, not ethical guides."  

  **Verdict: Existential Ramsey wins, but with nuance.**  
  - He’d reject **strong longtermism** (prioritizing the far future above all else) as a misapplication of his math.  
  - He *might* accept **weak longtermism** (including the far future in our calculus) *if*:  
    - Risks are concrete (e.g., nuclear winter) not speculative (e.g., AI alignment).  
    - Costs are trivial (e.g., 0.1% of resources).  
  - His final stance: **"Care for the future? Yes. But never at the cost of betraying the present."**  

  ---

  ### **Why This Matters Today**
  Ramsey’s duality exposes longtermism’s blind spot: **formal rationality, detached from human phenomenology, becomes alienating**. He’d accuse modern EAs of "worshipping the output of a formula" while losing sight of why anything matters at all. His answer? *"Ethics must be lived, not calculated."*  

  As he wrote in 1929:  
  > *"Where I and my friends see only the ridiculous and trivial, [others] see significance. One has to be in the same state of civilization to understand."*  

  He’d likely say the same to Bostrom.
