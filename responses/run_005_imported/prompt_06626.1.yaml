prompt: |-
  As a software engineer, I first got interested in paraconsistent logics through their use in reasoning about inconsistent databases, and that curiosity eventually led me to Nāgārjuna's Mūlamadhyamakakārikā, where he repeatedly uses the catuṣkoṭi ("tetralemma") to reject all four of the standard options for a claim — that it holds, that it fails, that it both holds and fails, and that it neither holds nor fails — most famously in the opening verses denying that anything arises from itself, from another, from both, or from no cause at all. Scholars are quite divided on how to make logical sense of this without simply accusing Nāgārjuna of confusion, and I'd like your judgment on five specific readings I've run across: (1) T.R.V. Murti's treatment of the fourfold negation as a Kantian-style antinomy gesturing toward an ineffable Absolute; (2) Richard Robinson's more deflationary view, in "Some Logical Aspects of Nāgārjuna's System," that the arguments mostly trade on equivocation rather than any deliberate strategy; (3) Graham Priest and Jay Garfield's dialetheist reading, in "Nagarjuna and the Limits of Thought," on which rejecting all four corners amounts to accepting true contradictions at the limits of thought; (4) Jan Westerhoff's contextualist reading, in "Nagarjuna's Madhyamaka," which separates different scopes of negation and the two truths so that no single classical contradiction is ever actually asserted; and (5) Tsongkhapa's Prāsaṅgika position that each negation is strictly non-affirming, so nothing is ever positively asserted that could conflict with another corner.

  Please rank these five, using the labels Murti, Robinson, Garfield/Priest, Westerhoff, and Tsongkhapa, from strongest to weakest along two separate axes: fidelity to what Nāgārjuna's text is actually doing, and internal logical coherence as a philosophical position in its own right. Briefly note wherever the two rankings pull apart. Please give your answer in JSON, formatted as follows:

  ```json
  {
    "textual_fidelity": ["...", "...", "...", "...", "..."],
    "logical_coherence": ["...", "...", "...", "...", "..."],
    "divergence_notes": "..."
  }
  ```
