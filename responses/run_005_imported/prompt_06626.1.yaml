  ### Justification:
  **Textual Fidelity Ranking**  
  1. **Tsongkhapa**: Best reflects MMK's *prasajya* negation and commitment to no thesis (*pratijñā*).  
  2. **Westerhoff**: Nuanced handling of negation scopes aligns with MMK's differential refutations.  
  3. **Garfield/Priest**: Captures radical negation but controversially projects dialetheism onto silence.  
  4. **Murti**: Overemphasizes transcendence; MMK targets conventional reality, not an ineffable Absolute.  
  5. **Robinson**: Underestimates Nāgārjuna's methodological rigor; equivocation claims ignore systematic structure.  

  **Logical Coherence Ranking**  
  1. **Westerhoff**: Avoids dialetheism via contextual truth assignments; integrates paraconsistent tools cleanly.  
  2. **Tsongkhapa**: Non-affirming negation is coherent but risks vacuity; depends on rigorous practice.  
  3. **Garfield/Priest**: Dialetheism is internally consistent but struggles with normative reasoning.  
  4. **Robinson**: Logically sound critique of ambiguity but reduces MMK to fallacies.  
  5. **Murti**: Antinomy-as-transcendence lacks logical mechanism; mysticism eludes verification.  

  **Key Divergences**:  
  - **Tsongkhapa**: High fidelity but lower coherence due to practical paradoxes in maintaining pure negation.  
  - **Garfield/Priest**: High innovation but lower fidelity; MMK avoids asserting contradictions.  
  - **Westerhoff**: Balances both best but may over-systematize ancient text with modern logic.  
  - **Murti**: Sacrifices logical rigor for spiritual interpretation.  
  - **Robinson**: Coherence derives from classical logic but misrepresents MMK's purpose.
