  On whether he became a believer, sources indicate he remained skeptical but hopeful. He never claimed conclusive proof but thought evidence was promising enough to keep investigating. This doesn't undercut his rigor; he applied scientific methods to psychical research, demanding high standards. His reputation as a rigorous philosopher holds because he maintained skepticism despite his hope.

