  My old philosophy professor turns 70 next weekend and her former grad students are throwing her a big dinner party, fittingly, since she's spent her career teaching Plato's Laws and always insisted, dead serious, that the wine-soaked dinner parties shes famous for are basically a defense of the Book 1 argument that supervised drunkenness is good for testing and training people's character. I got asked to give the toast. Half the room is former students who've heard her make this case over wine a dozen times; the rest is family who've never read a word of Plato. Write me a five minute toast that uses her argument as the actual backbone, not just a name-drop, without making it sound like we're endorsing grad-student binge drinking, which is very much not her point.
