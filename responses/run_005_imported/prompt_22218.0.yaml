  Ok this is kind of a deep cut but I've been going down a youtube rabbit hole on two-dimensional semantics (the primary intension vs secondary intension thing philosophers use to explain Kripke's necessary a posteriori stuff, like why "water is H2O" is necessary once it's true but still feels like something we discovered, not something true by definition). Problem is literally every explanation I can find uses the exact same two examples -- water=H2O and Hesperus=Phosphorus -- so at this point I honestly cant tell if I actually get the concept or if I've just memorized those two cases. Can you give me a totally different example (not water, not Hesperus/Phosphorus, and not gold's atomic number either since that one shows up everywhere too), walk through what its primary intension and secondary intension actually are, and explain why they come apart? Bonus if it's one where its not obvious which intension is doing the "necessity" work until you actually think it through.
