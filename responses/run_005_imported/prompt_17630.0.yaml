  - How each theory explains the *failure*—resolution collapse vs. preference shift. 
  - Debating if "weakness of will" adds anything beyond Ainslie's model. 

  For authenticity, I'll include academic touches (e.g., references to "akrasia," "picoeconomics"). The resolutionist should argue that hyperbolic discounting can't explain why resolutions *feel* binding, while the discount theorist counters that resolve is just sophisticated discounting. 

