  First, I need to recall Quine's main arguments. The inscrutability of reference, as in the "gavagai" example, shows that reference is indeterminate when translating from one language to another. But the proxy-function argument seems different—it operates within a single language, using a proxy function to reassign references while keeping all sentences true. This suggests that reference can be scrambled even without translation.

