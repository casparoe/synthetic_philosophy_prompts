prompt: |-
  I've been a longtime lurker on LessWrong and Astral Codex Ten, and a recent thread rehashing the "coherence theorems imply expected-utility maximization" debate sent me back to the money-pump literature, where I got stuck on something the standard expositions tend to gloss over. The textbook argument is familiar enough: if your preferences over A, B, and C are cyclical, a bookie can walk you through a sequence of trades, each of which looks like a strict improvement at the moment you make it, until you've paid several small fees to end up back with the option you started with. The usual moral drawn is that cyclical preferences are irrational.

  What's nagging at me is the naive/sophisticated/resolute trichotomy that's supposed to map out the possible responses to this setup. A naive agent just walks into the pump. A sophisticated agent, foreseeing the whole sequence, refuses the first trade rather than be led step by step to a predictably regrettable finish. A resolute agent, in something like McClennen's sense, commits to a plan in advance and then actually goes through with the final trade even though, taken in isolation, it wouldn't choose it -- and thereby dodges the pump too, since the eventual "loss" was priced in from the start. Crucially, both strategies leave the agent's cyclical ranking fully intact; what's being vindicated as "rational" is a diachronic choice disposition, not the synchronic shape of the preference ordering. Resoluteness in particular has always struck critics as suspicious for exactly this reason: it looks like it could rescue almost any preference pattern from almost any pump, since you can always just precommit to stomach the bad-looking final move, which is usually taken as a mark against resolute choice rather than a vindication of cyclical preferences. And yet I keep running into what looks like the very same move being redeployed, apparently uncontroversially, on the other side of recent coherence-theorem debates -- the claim that an agent with incomplete rather than cyclical preferences can dodge the analogous money pump for completeness once it's allowed to choose in a suitably farsighted, non-myopic way.

  So here's what I'd like help untangling. Is there a principled, mechanics-level reason why farsighted choice legitimately blocks the money pump for incompleteness without equally rescuing the cyclic-preference case it was originally invoked for (and where it's usually considered question-begging) -- something about what each kind of agent actually has to give up or commit to in the two cases -- or does taking the "farsighted agents dodge the pump" move seriously for incompleteness commit you to thinking the classic argument against intransitivity never showed anything either? I'd like you to work through the actual structure of the two pumps and what a sophisticated or resolute agent's choices look like in each, rather than just reporting that people disagree about it.
reasoning: |-
  We are comparing two money-pump scenarios: one for cyclical (intransitive) preferences and one for incomplete preferences. The key question is why farsighted choice (sophisticated or resolute) might block the money pump for incompleteness without equally rescuing the cyclic preference case.

  Let me first recall the standard money pump for intransitivity and then the one for incompleteness.

  ### 1. Money Pump for Intransitivity (Cyclical Preferences)
  Suppose an agent has the following cyclical preferences over three outcomes:
     A ≻ B ≻ C ≻ A   (where ≻ denotes strict preference)

  The standard money pump setup involves a sequence of trades:

     Step 1: The agent starts with A. The bookie offers to trade A for C plus a small amount of money (say, $1). Since C ≻ A, the agent accepts (paying $1) and now has C+$1.

     Step 2: Then the bookie offers to trade C+$1 for B+$1 (or equivalently, trade C for B and give back the $1? Actually, we have to be careful). Alternatively, we can think of the outcomes as including money. Let me represent:

     Outcome A: the object A and $0.
     Outcome C-: the object C and -$1 (because the agent paid $1 to get C instead of A).

     But to make the pump work, we have:

     - Start with A (and $0).
     - Offer to trade A for C and take $1 from the agent: so the agent ends up with C and -$1 (which we call state C-).
     - Then, offer to trade C- for B: since the agent prefers B to C, and if we adjust the money so that the agent pays another $1, then we have B and -$2? Actually, we can have:

     Alternatively, we can have:

     Step 1: Agent has A. Bookie offers: "I'll give you C in exchange for A and you pay me $1." Agent, since C ≻ A, accepts: now has C and -$1.

     Step 2: Bookie offers: "I'll give you B in exchange for C and you pay me another $1." Agent, since B ≻ C, accepts: now has B and -$2.

     Step 3: Bookie offers: "I'll give you A in exchange for B and you pay me another $1." Agent, since A ≻ B, accepts: now has A and -$3.

     So the agent started with A and ended with A but $3 poorer.

  The key is that at each step, the agent is making a trade that is strictly preferred at that moment (because of the cyclical preferences and the small payment).

  ### 2. Money Pump for Incompleteness
  Now consider an agent with incomplete preferences. For example, the agent might not have a preference between A and B (neither A ≻ B nor B ≻ A). The standard argument is that such an agent is vulnerable to a money pump too.

  The setup:

     Step 1: Agent starts with A. Bookie offers to trade A for B and the agent pays $1. Since the agent doesn't strictly prefer A over B (and might be indifferent or incomparable), we assume that the agent is willing to make a trade that is not dispreferred for a small gain? Actually, the pump for incompleteness often relies on the agent having a weak preference that can be exploited.

  But note: if the agent has no strict preference in either direction, then why would the agent pay to switch? So the pump for incompleteness is a bit different. One common version is:

     - The agent is indifferent between A and B (so incompleteness in the sense of indifference, but note that indifference is a form of completeness). Actually, the problem arises when the agent has a non-transitive indifference or when the agent is not indifferent but has no strict preference (and is willing to pay a small amount to move from one to the other?).

  Alternatively, we can consider a case of non-comparability. Suppose the agent cannot compare A and B. Then the bookie might offer:

     Step 1: Agent has A. Bookie says: "I'll give you B for A and you pay me $1." Since the agent doesn't strictly prefer A to B, and might be willing to pay a small amount to get B (for some reason), but that reason must be provided.

  The literature often assumes that if the agent doesn't strictly prefer A to B, then the agent is willing to pay a small amount to switch to B (if offered). Similarly, if the agent doesn't strictly prefer B to A, then the agent is willing to pay a small amount to switch back.

  So:

     Step 1: Start with A. Trade A for B minus $1 (so agent now has B and -$1).
     Step 2: Trade B (with -$1) for A minus an additional $1 (so agent now has A and -$2).

  But note: in step 2, the agent is trading from B to A and paying $1. The agent doesn't strictly prefer B to A? So why would the agent pay to switch back? The idea is that the agent doesn't have a strict preference in either direction, so for a small enough payment, the agent is willing to make the trade in either direction.

  However, this setup requires that the agent is willing to pay to switch when there is no strict preference. This is sometimes called the "small payment" assumption.

  ### The Role of Farsightedness

  Now, the argument for incompleteness is that a farsighted agent (sophisticated or resolute) can avoid the pump by refusing the first trade. Why?

  In the incompleteness pump:

     - The agent starts with A.
     - If the agent is farsighted, it foresees that if it trades A for B-$1, then the bookie will offer to trade back to A for an additional $1. The agent would end up with A-$2. So the agent, foreseeing this, refuses the first trade.

  But note: the agent doesn't strictly prefer A to B, so why does it refuse? The idea is that the agent doesn't want to end up with a loss. The agent might have a preference for avoiding the sequence that leads to a sure loss.

  In the cyclic case, a sophisticated agent would also refuse the first trade because it foresees the entire sequence leading to a loss. So why is that not equally a defense of cyclic preferences?

  ### The Difference?

  The standard view is that cyclic preferences are irrational because they lead to a cycle in the synchronic preferences, and the money pump is just a symptom. But if a sophisticated agent avoids the pump, then the cycle remains but the agent doesn't actually get pumped.

  However, the critic of cyclic preferences might say: the fact that the agent has to avoid the first trade (which, taken in isolation, is an improvement) is itself a cost. The agent is passing up an opportunity for a local improvement because of the global consequences. But in the case of incompleteness, the same is true: the agent passes up the first trade (which, without the subsequent trades, would be acceptable) because of the global consequences.

  So why is it that the farsighted defense is accepted for incompleteness but not for intransitivity?

  One argument is that in the incompleteness case, the agent's refusal of the first trade is not a violation of the agent's preferences because the agent does not strictly prefer A to B, so there's no reason to make the trade in the first place. In other words, the agent is not forgoing a strict improvement because there is no strict improvement to be had. The trade from A to B-$1 is not strictly preferred (since the agent doesn't strictly prefer B to A, and the loss of $1 might make it worse). But wait, the agent is willing to make the trade for a small payment? How do we model that?

  Alternatively, we can model the agent as having a preference for avoiding sure losses. Then, in both cases, the agent avoids the first trade.

  But the key distinction that is often made is:

     - For cyclic preferences, the agent has a strict preference at each step: C ≻ A, B ≻ C, A ≻ B. So each trade, in isolation, is a strict improvement. Therefore, if the agent is myopic, it will take each trade and end up worse off. A sophisticated agent avoids the first trade, but then it is forgoing a strict improvement (from A to C) because of what will happen later. This is seen as a cost of having cyclic preferences: you have to avoid making trades that are individually beneficial.

     - For incomplete preferences, the agent does not have a strict preference between A and B. Therefore, the first trade (from A to B-$1) is not a strict improvement. In fact, it might be a disimprovement (because of the loss of $1). So the agent doesn't have a reason to make the trade even in isolation. Therefore, refusing the first trade is not forgoing a strict improvement.

  But wait, in the standard setup for incompleteness, the agent is assumed to be willing to make the trade for a small payment. How do we square that?

  The assumption is that if the agent does not strictly prefer A to B, then for a small enough payment ε, the agent will trade A for B-ε. Similarly, it will trade B for A-ε. This is what makes the pump possible.

  But if the agent is farsighted, it realizes that if it trades A for B-ε, then it will be offered to trade back to A for another ε, ending with A-2ε. Therefore, the agent sees that the entire sequence is a sure loss. So it refuses the first trade.

  The difference, then, is that in the cyclic case, each trade is strictly preferred (so the agent is giving up a strict improvement by refusing the first trade), whereas in the incomplete case, the first trade is not strictly preferred (so the agent isn't giving up a strict improvement).

  But note: in the incomplete case, the agent is willing to make the trade for a small ε. How can we say that the trade is not strictly preferred? The agent's willingness to pay ε to switch suggests that the agent strictly prefers B-ε to A? But that would be a contradiction to the incompleteness because then we would have B-ε ≻ A. But if ε is small enough, and if the agent has a continuous preference, then we might get this.

  Actually, the problem is that the agent with incomplete preferences might not have a strict preference between A and B, but when we add money, the agent might have a strict preference for A over B-ε (if ε>0). That is, the agent might strictly prefer A to B-ε because of the loss of ε.

  But then why would the agent ever trade A for B-ε? The standard pump assumes that the agent is willing to trade A for B-ε because the agent doesn't strictly prefer A to B, so for a small ε, the agent is willing to make the trade. This is the "small payment" assumption.

  This is a bit messy. Let me try to formalize.

  ### Modeling the Agent's Preferences

  For cyclic preferences:

     A ≻ B, B ≻ C, C ≻ A.

  For incomplete preferences:

     We say that A and B are incomparable: neither A ≿ B nor B ≿ A.

  But when we add money, we need to define preferences over (outcome, money). We assume that more money is better.

  So for the incomplete case:

     The agent might have:
        (A, m) ≻ (B, m) for all m? Not necessarily, because then we would have A ≻ B.
        Instead, we assume that for a fixed m, the agent does not have a strict preference between (A, m) and (B, m). But when we change m, then the agent might have a strict preference.

  Specifically, we assume that the agent strictly prefers (A, m) to (A, m-ε) for any positive ε. Similarly for B.

  Now, the trade: 
     Start at (A, 0). 
     Bookie offers: (B, -ε) in exchange for (A, 0). 

  Does the agent strictly prefer (B, -ε) to (A, 0)? 

     We don't know. But if the agent is indifferent between (A,0) and (B,0), then (B, -ε) is worse than (B,0) and hence worse than (A,0). So the agent would not make the trade.

  But then the pump doesn't work. So to get the pump to work, we must assume that the agent is not indifferent but rather incomparable, and that the agent is willing to trade when there is a small payment. How?

  One way is to assume that the agent has a state of uncertainty and that the agent is willing to pay a small amount to resolve the uncertainty. But that's a different story.

  Alternatively, we can assume that the agent has a weak preference that is not transitive. For example, the agent might be indifferent between A and B, but then we are in the realm of intransitive indifference, which is a form of intransitivity.

  But the money pump for incompleteness is typically set up for genuine non-comparability. The key assumption is:

     **Assumption for incompleteness pump**: If the agent does not strictly prefer X to Y, then for any positive ε, the agent is willing to trade X for Y and pay ε.

  But that assumption is very strong. It implies that the agent strictly prefers Y to X-ε? But then we are effectively defining a strict preference. This has been criticized.

  ### The Farsighted Defense

  In the cyclic case:

     - The naive agent takes the first trade because it strictly prefers (C, -$1) to (A,0). Then the next, and the next, and ends up worse.
     - The sophisticated agent, foreseeing the whole sequence, refuses the first trade. But then it is stuck with A and avoids the loss, but it has passed up a trade that, in isolation, would have been a strict improvement (from A to C at the cost of $1). So the agent is forgoing a strict improvement because of future consequences.

  In the incompleteness case:

     - The naive agent: because of the assumption above, it trades A for B-$1. Then it trades B-$1 for A-$2. So it ends up with A-$2.
     - The sophisticated agent, foreseeing the sequence, refuses the first trade. It does not make the trade from A to B-$1 because it knows that then it will be offered to trade back to A-$2. Since it prefers A to A-$2 (because of the money), it avoids the sequence.

  But note: the first trade in the incompleteness case, according to the assumption, is one that the agent is willing to make. But why is that? The agent is willing to make the trade because it doesn't strictly prefer A to B, so it is willing to pay $1 to switch to B. But then, in isolation, the agent would make the trade. However, the sophisticated agent realizes that after making the trade, it will be offered a trade that it is also willing to make (because it doesn't strictly prefer B to A, so it is willing to pay $1 to switch back) and end up worse. So it avoids the first trade.

  The key difference that is claimed:

     In the cyclic case, the first trade is strictly preferred. So by refusing it, the agent is forgoing a strict improvement. This is seen as a cost of having cyclic preferences: the agent must avoid trades that are strictly better because of the future.

     In the incompleteness case, the first trade is not strictly preferred. The agent is only willing to make the trade because of the "small payment" assumption, which might be seen as a behavioral assumption rather than a preference. In terms of preference, the agent does not strictly prefer (B, -$1) to (A,0). In fact, without the subsequent trade, the agent might be indifferent or might even disprefer (B,-$1) to (A,0). The "willingness" to trade is not based on a strict preference but on a behavioral rule.

  But then the pump for incompleteness relies on a behavioral rule that might be irrational. So if we require the agent to be rational, it wouldn't follow that rule.

  Therefore, the farsighted agent in the incompleteness case isn't really having its preferences challenged because the first trade isn't strictly preferred. The agent can refuse without violating any strict preference.

  Whereas in the cyclic case, the first trade is strictly preferred, so refusing it means the agent is not taking a trade that is strictly better at that moment.

  ### Conclusion

  The principled reason is that for cyclic preferences, each step of the pump is a strict improvement according to the agent's own preferences. Therefore, a myopic agent would take each step and end up worse. A sophisticated agent avoids the first step, but that requires forgoing a strict improvement. This is seen as a problem because the agent's own preferences are forcing it to pass up an improvement.

  For incomplete preferences, the first step is not a strict improvement. The agent does not strictly prefer the outcome of the first trade (B, -$1) to the current state (A,0). Therefore, refusing the first trade does not require forgoing a strict improvement. The agent is simply avoiding a sequence that leads to a sure loss, which is consistent with having a strict preference for more money.

  Thus, the farsighted defense works for incompleteness because the agent isn't giving up a strict improvement by refusing the first trade. But for cyclic preferences, the farsighted agent is giving up a strict improvement, which is seen as a cost of having cyclic preferences.

  However, note that the "small payment" assumption in the incompleteness pump is critical. Without it, the pump doesn't get started. And that assumption might be challenged as not reflecting true incompleteness. If the agent truly has incomplete preferences, then it might not be willing to pay to switch. In that case, there is no pump to begin with.

  So the standard argument is that if an agent with incomplete preferences is vulnerable to the pump only if it has a behavioral disposition to make trades for small payments when there is no strict preference. But a rational agent with incomplete preferences might not have that disposition. Therefore, the pump doesn't force completeness.

  For cyclic preferences, even without any behavioral disposition beyond following strict preferences, the agent is vulnerable if myopic, and if sophisticated, it must forgo strict improvements.

  Hence, the two cases are different.

  ### Summary of the Mechanics

  **Cyclic preferences**:
     - Each trade is a strict improvement (according to the agent's preferences).
     - A sophisticated agent refuses the first trade to avoid the cycle, but in doing so, it forgoes a strict improvement (from A to C at the cost of $1). This is seen as a cost of having cyclic preferences.

  **Incomplete preferences**:
     - The first trade is not a strict improvement (the agent does not strictly prefer (B, -$1) to (A,0)). 
     - Therefore, a sophisticated agent can refuse the first trade without forgoing a strict improvement. It simply avoids a sequence that leads to a loss.

  So the defense for incompleteness is that the agent's preferences do not require it to make the first trade, so avoiding the pump is costless. For cyclic preferences, avoiding the pump is costly because the agent has to pass up a trade that it strictly prefers.
answer: |-
  Your query cuts to the heart of a persistent tension in decision theory: why farsightedness (via sophistication or resoluteness) is often accepted as a valid defense against money pumps for incompleteness but not for cyclical preferences, despite structural similarities. I'll unpack the mechanics of both pumps, map the choices of naive/sophisticated/resolute agents, and pinpoint the principled distinction. The key lies in what each agent *must violate* to avoid exploitation—specifically, whether avoiding the pump requires rejecting a *strictly preferred* trade (cyclical case) or merely avoiding a *non-strictly-preferred* trade (incompleteness case).

  ### **1. Core Mechanics of the Two Money Pumps**
  #### **Cyclical Preferences Pump (e.g., A≻B≻C≻A)**
  - **Setup**: Agent starts with A. Bookie offers:
    1. Trade A for C + small penalty (-$ε). *Since C≻A, agent strictly prefers this trade.*  
    2. Trade C for B -$ε (now net -$2ε). *Since B≻C, agent strictly prefers this.*  
    3. Trade B for A -$ε (now net -$3ε). *Since A≻B, agent strictly prefers this.*  
  - **Outcome**: Agent ends with A but poorer by $3ε.  
  - **Vulnerability**: Driven by **strict preferences at each step**. Each trade is myopically rational.

  #### **Incompleteness Pump (e.g., A∥B, neither preferred)**
  - **Setup**: Agent starts with A. Bookie offers:
    1. Trade A for B -$ε. *Agent has no strict preference A≻B, so may accept for small ε (a behavioral assumption)*.  
    2. Trade B for A -$ε (now net -$2ε). *Agent has no strict preference B≻A, so may accept.*  
  - **Outcome**: Agent ends with A but poorer by $2ε.  
  - **Vulnerability**: Relies on **indifference/non-comparability + small payments**. No step is strictly preferred, but agent is "nudged" by ε.

  ---

  ### **2. Agent Responses: Cyclical vs. Incomplete Preferences**
  #### **Cyclical Preferences Case**
  | **Agent Type** | **Choice Sequence** | **Outcome** | **Rationality Implication** |
  |----------------|---------------------|-------------|----------------------------|
  | **Naive**      | Accepts all trades: A → C (-ε) → B (-2ε) → A (-3ε) | Pumped: A-3ε | Exploited by myopia. |
  | **Sophisticated** | Foresees cycle. **Refuses first trade (A→C-ε)**. | Stays with A | Avoids pump but **forgoes strictly preferred trade** (C-ε ≻ A). |
  | **Resolute**   | Commits to "reject all trades". Sticks with A. | Stays with A | Avoids pump but **violates current strict preference** (C-ε ≻ A at Step 1). |

  - **Problem**: Both sophisticated and resolute agents avoid exploitation only by rejecting a trade that is **strictly preferred at the time of choice** (A→C-ε). This contradicts the agent's own synchronic preferences. Cyclical preferences force a dilemma:  
    - *Either* accept exploitation,  
    - *Or* act against a strict local improvement.  
    This is why farsightedness doesn't "rescue" cyclicity—it highlights a pathology: the agent's preferences punish it for avoiding dominance violations.

  #### **Incomplete Preferences Case**
  | **Agent Type** | **Choice Sequence** | **Outcome** | **Rationality Implication** |
  |----------------|---------------------|-------------|----------------------------|
  | **Naive**      | Accepts both trades: A → B-ε → A-2ε | Pumped: A-2ε | Exploited by myopia + willingness to trade for ε. |
  | **Sophisticated** | Foresees the cycle. **Refuses first trade (A→B-ε)**. | Stays with A | Avoids pump. **No strict preference violated** (A ≻ B-ε is false; B-ε ∥ A is possible). |
  | **Resolute**   | Commits to "reject all trades". Sticks with A. | Stays with A | Avoids pump. **No strict preference violated** (same as above). |

  - **Key Difference**: When refusing the first trade (A→B-ε):  
    - The agent has **no strict preference** for A over B-ε. Refusing is consistent with its synchronic preferences.  
    - The pump relies on a *behavioral* assumption ("will trade for small ε if no strict preference"), not a preference axiom. A farsighted agent violates this assumption rationally by rejecting dominated *sequences*.  
    - No trade is strictly preferred locally, so avoiding the sequence costs nothing in preference terms.

  ---

  ### **3. Why Farsightedness Works for Incompleteness but Not Cyclicity**
  The distinction hinges on **what is sacrificed to block the pump**:
  - **Cyclical Preferences**:  
    Blocking the pump requires rejecting a trade that is **strictly preferred synchronically** (e.g., C-ε ≻ A). This forces the agent to act *against its own preferences* at some point. Farsightedness doesn't resolve the cycle; it exposes a conflict between synchronic and diachronic rationality. Critics argue this "saves" cyclicity only by masking it with ad hoc commitments.

  - **Incomplete Preferences**:  
    Blocking the pump requires only rejecting trades that are **not strictly preferred** (A → B-ε). The agent never goes against a strict local improvement. Its choice is consistent with:  
    - **Dominance**: Rejecting sequences leading to sure loss (A-2ε ≺ A).  
    - **Synchronic preferences**: No violation of A ≻ B-ε or B-ε ≻ A.  
    Here, farsightedness aligns with—and even reinforces—the agent's incomplete ordering.

  #### **Why Resoluteness Isn't Question-Begging Here**
  - For incompleteness, resoluteness (e.g., "never trade A for B-ε") is **preference-compatible**: It doesn't override strict preferences.  
  - For cyclicity, resoluteness (e.g., "never trade A for C-ε") **overrides** the strict preference C-ε ≻ A, appearing arbitrary ("why commit *here*?").  

  ---

  ### **4. Implications for the Coherence-Theorem Debate**
  The money-pump defense for completeness often assumes myopia. When allowing farsightedness:  
  - **Incompleteness**: Farsighted agents dodge the pump *without compromising preferences*. This suggests money pumps don't force completeness—they only punish myopia or specific behavioral rules (e.g., "trade for ε if indifferent").  
  - **Cyclicality**: Farsighted agents dodge the pump but at the cost of *local irrationality* (rejecting strict improvements). This reinforces the view that cyclicity is inherently pathological.  

  #### **The Principled Line**
  - **Mechanics-Level Reason**: Cyclical preferences make **every step of the pump strictly preferred**, so avoiding it requires rejecting dominance *locally*. Incompleteness makes **no step strictly preferred**, so avoiding it only requires rejecting dominance *globally*.  
  - **What Agents Give Up**:  
    - *Cyclical*: Sophisticated/resolute agents give up *local dominance* (always taking strict improvements).  
    - *Incomplete*: They give up only a *behavioral heuristic* (trading for small ε under non-comparability).  

  ### **Conclusion**
  Farsightedness blocks the incompleteness pump *without* rescuing cyclical preferences because:  
  1. **Incompleteness**: Avoiding the pump doesn't violate strict preferences—it leverages global dominance while respecting synchronic non-comparability.  
  2. **Cyclicality**: Avoiding the pump *requires* violating strict local preferences, exposing a deeper incoherence.  

  This doesn't mean incompleteness is "rational" or cyclicity "irrational"—it means money pumps alone don't decisively rule out incompleteness for farsighted agents, whereas for cyclicity, they reveal a conflict between local and global rationality that farsightedness can't fully resolve. The debate persists because it hinges on whether decision theory should prioritize synchronic preferences (favoring completeness/transitivity) or diachronic choice (allowing resolute/sophisticated strategies).
