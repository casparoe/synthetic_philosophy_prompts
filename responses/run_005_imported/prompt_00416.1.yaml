prompt: |-
  So I've been reading about Solomonoff induction and how it's supposed to be this perfect mathematically rigorous version of Occam's razor - shortest program that outputs your data wins, end of story. But then I ran into this invariance theorem thing, which basically says complexity only matches up between different universal machines up to some additive constant. That constant could be massive compared to the actual strings were trying to predict in real life. So isn't the whole "objective simplicity ranking" kind of a mirage once you leave toy examples? Can someone walk me through how bad this problem actually is in practice, and whether the theory still gives us real guidance on which hypothesis to prefer, or if its just objective in some useless "in the limit as data goes to infinity" sense that doesn't help me here and now.
