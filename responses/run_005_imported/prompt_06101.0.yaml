answer: |-
  Here are 10 targeted questions with strategic follow-ups designed to pressure-test the resolute choice position, focusing on conceptual tension points, distinctions from related theories, and implications she might sidestep:

  1.  **The Ontology of Rationality:**
      *   *Question:* When the hitchhiker *actually hands over the $100 in town*, is that specific *act* (A) intrinsically rational, (B) irrational but excusable as part of a rational policy, or (C) rational *only* derivatively because it fulfills a prior rational commitment? If (B) or (C), does this mean the label "rational" properly belongs *only* to dispositions/policies, not individual acts?
      *   *Likely Answer/Follow-up:* (She'll likely defend B or C, emphasizing policy rationality). *Follow-up:* If paying is *not* intrinsically rational at T2 (in town), what status does the *act itself* have? Is it merely *causally necessary* for the good outcome achieved via the *policy*? Doesn't this imply that "rationality" at the act level is sometimes *incompatible* with the outcome-maximizing act at that moment, rendering "rationality" potentially self-undermining in its own terms?

  2.  **The Gauthier Convergence/Divergence:**
      *   *Question:* Gauthier's "constrained maximization" (CM) also prescribes adopting a disposition to cooperate when mutual recognition is possible, justified by the *expected utility gain* from being identified as a CM. How is "resolute choice" substantively different? Is it primarily that resolute choice applies *unilaterally* (e.g., against a perfect predictor, not necessarily a reciprocator), or is there a deeper difference in the *grounds* of rationality (e.g., fidelity to commitment vs. expected utility maximization via disposition)?
      *   *Likely Answer/Follow-up:* (She may distinguish unilateral scope or emphasize commitment over pure expected utility calculation). *Follow-up:* If the core justification for adopting the resolute disposition *is* still ultimately the superior expected outcome it secures (compared to being an act-by-act maximizer), doesn't this collapse resolute choice into a sophisticated form of *instrumental* expected utility maximization *at the policy level*, making Gauthier the true foundation? Is "resolution" anything more than a psychological mechanism to *achieve* CM?

  3.  **The "Unfair Predictor" Rebuttal & Robustness:**
      *   *Question:* Causal Decision Theorists (CDT) often argue that Parfit's driver (and Newcomb's Predictor) represent "unfair" or adversarial environments specifically designed to *punish CDT rationality*. They argue a theory shouldn't be judged on how it performs in worlds rigged against it. How do you respond? Does resolute choice claim to be the uniquely correct theory *only* for predictor-laden worlds, or is it universally valid? If universal, how does it handle "normal" decisions where predictors don't exist?
      *   *Likely Answer/Follow-up:* (She'll likely argue predictors/reputational effects are widespread, making the case relevant, and RC is universal). *Follow-up:* But doesn't RC *require* a specific causal structure (where current acts depend on past *dispositions* being *predictable*) to deliver its benefits? In a world without any such predictability mechanisms (truly isolated acts), wouldn't RC simply prescribe act-by-act maximization, converging with CDT? If so, doesn't RC's *distinctive prescription* depend entirely on the presence of these "adversarial" predictors, undermining the claim that CDT is failing in a uniquely rigged environment?

  4.  **The "Functional Decision Theory" (FDT) Challenge:**
      *   *Question:* FDT also claims the "correct" answer in the Hitchhiker case (pay), but grounds it in selecting the *decision rule* or *algorithm* that, when universally adopted (or when considered as the output of your fixed function), leads to the best outcome. How does resolute choice *differ* from FDT? Is the difference primarily metaphysical (dispositions vs. algorithms), temporal (commitment over time vs. abstract function evaluation), or justificatory?
      *   *Likely Answer/Follow-up:* (She may emphasize the temporal, diachronic nature of resolution - sticking to a *prior plan*). *Follow-up:* In a *synchronic* problem like a perfectly symmetric Prisoner's Dilemma played once with no pre-commitment possible, but where both players reason about their *type* (disposition/algorithm) simultaneously, would resolute choice and FDT prescribe the same thing (cooperate)? If yes, doesn't this blur the lines? If no, why is the temporal element of "resolution" essential in one case but not the other?

  5.  **The Cost of Resolution & Self-Binding:**
      *   *Question:* Resolute choice often involves *self-binding* – committing to a course of action knowing you'll later have an incentive to defect. Doesn't this imply a cost: the *loss of flexibility* to maximize at T2? How do you quantify this cost within the theory? When *shouldn't* an agent be resolute? Is there a risk of becoming "over-committed"?
      *   *Likely Answer/Follow-up:* (She'll argue the cost is outweighed by the benefits gained via predictability/commitment). *Follow-up:* But isn't the *very ability* to bind oneself resolutely a *contingent* psychological trait? If an agent *lacks* this capacity for resolution, is RC simply telling them they are doomed to irrationality? Or does RC imply that rationality *requires* cultivating this specific psychological capacity, making rationality dependent on willpower?

  6.  **Bootstrapping the Rational Disposition:**
      *   *Question:* At T1 (in the desert), adopting the disposition to pay is rational because it leads to rescue. But *what constitutes "adopting" the disposition?* Is it a conscious decision? A belief? How does merely *deciding* at T1 to have disposition D *cause* the predictor to detect D, if D hasn't been behaviorally manifested yet? Isn't there a bootstrapping problem?
      *   *Likely Answer/Follow-up:* (She might appeal to self-knowledge, commitment, or the predictor's infallible insight into *current* intentions/future follow-through). *Follow-up:* If the predictor detects the *current sincere intention* to pay later, what happens if the agent *sincerely intends* at T1 but then *rationally re-evaluates* at T2 and defects (as act-by-act CDT would)? Was the initial intention not "resolute" enough? Doesn't this make the rationality of the *initial choice* depend precariously on the *stability* of a future irrational act?

  7.  **The Scope Problem: Which Dispositions?**
      *   *Question:* Resolute choice prescribes adopting *specific* beneficial dispositions (like paying). But agents have countless dispositions. How does the theory determine *which* dispositions it's rational to adopt/resolutely maintain? Only those that solve clear dynamic inconsistency problems? Doesn't this risk ad-hoc-ness? Why not adopt a disposition to *always* pay debts, even when there's *no* predictability benefit?
      *   *Likely Answer/Follow-up:* (She'll likely tie it to the expected benefit of the disposition in relevant scenarios). *Follow-up:* Doesn't this instrumental justification again reduce resolute choice to a calculation about *which dispositions are instrumentally useful*, potentially conflicting with other values (like honesty for its own sake)? Is there a non-instrumental reason within RC to *stick* to a commitment, even if circumstances change unpredictably and the *original* benefit calculation no longer holds?

  8.  **Moral Implications & "Rational" Exploitation:**
      *   *Question:* If resolute choice enables agents to credibly commit to promises they would otherwise break (like paying), this seems morally beneficial. However, couldn't it also enable credible commitment to *harmful* acts? Could a resolute "rational" agent commit to a disposition of ruthless exploitation if a predictor would grant them power based on that predicted disposition? Does RC provide any internal resources to condemn such a "rational" but immoral disposition?
      *   *Likely Answer/Follow-up:* (She may distinguish practical from moral rationality, or argue RC is neutral). *Follow-up:* But doesn't this highlight a potential danger? If RC is presented as the correct theory of *practical rationality*, and it endorses dispositions based purely on their instrumental benefit to the agent *regardless of moral content*, doesn't this risk providing a rational justification for deeply immoral but predictably beneficial character traits? How does this square with the intuition that rationality shouldn't be fundamentally at odds with morality?

  9.  **The "Why Bother Paying?" Challenge at T2:**
      *   *Question:* Let's grant that adopting the disposition was rational at T1 and got you rescued. You're now in town at T2. The driver has already driven off; paying him provides *no* further benefit to you (no future rides, no reputation with him). *Why*, according to resolute choice, should you actually *hand over the $100*? What *reason* does the theory provide the agent *at T2* to perform this costly act, besides "you resolved to do it"?
      *   *Likely Answer/Follow-up:* (She'll emphasize the importance of fulfilling commitments to maintain integrity or the *general* value of being resolute). *Follow-up:* But if the *only* reason to pay at T2 is the abstract value of "sticking to resolutions" itself, isn't this circular? The reason to be resolute was initially instrumental (to get rescued). Now that the instrumental benefit is secured, why is "sticking to resolutions" intrinsically rational *at T2*? Isn't this importing an external deontological constraint ("keep promises") into what's supposed to be a theory of instrumental rationality? If not, what is the *instrumental* reason *at T2*?

  10. **Rationality of Policy vs. Irrationality of Acts:**
      *   *Question:* If resolute choice concludes that the *act* of paying at T2 is irrational when considered in isolation (as act-by-act maximization shows), but the *policy* of being resolute is rational, doesn't this create a fundamental tension? Can a sequence of actions prescribed by a rational policy *contain* irrational individual acts? If so, doesn't this fracture the concept of rationality? If not, and paying *must* be rational, how do you reconcile that with the uncontroversial dominance reasoning at T2?
      *   *Likely Answer/Follow-up:* (She may deny act-by-act maximization is the correct standard for acts within policies, or redefine rationality solely at the policy level). *Follow-up:* This seems like the crux. If you redefine rationality *exclusively* at the policy level, doesn't that make "rationality" detached from the reasons an agent has *at the moment of choice*? How do you explain the *phenomenology* of the agent at T2 who *knows* paying is costly and provides no benefit, yet claims they are acting "rationally"? Isn't "I'm fulfilling my rational policy" just a *post-hoc* rationalization for an act they cannot justify *on its own terms in the present moment*?

  **Key Strategic Goals Embedded:**

  *   **Force the Act/Policy Split:** Questions 1, 9, and 10 directly pressure her to clarify the rational status of the T2 act and confront the potential incoherence of "irrational acts within rational policies."
  *   **Expose Instrumental Foundations:** Questions 2, 4, and 7 challenge whether RC offers anything *beyond* sophisticated instrumentalism (linking to Gauthier) and whether its prescriptions are ad-hoc.
  *   **Challenge Robustness & Scope:** Questions 3 and 5 question RC's applicability outside predictor-laden scenarios and its psychological demands.
  *   **Test Conceptual Boundaries:** Questions 4 (vs. FDT), 6 (bootstrapping), and 8 (morality) push her to define RC precisely against alternatives and explore its edges.
  *   **Highlight Practical & Phenomenological Tension:** Question 9 forces her to address the agent's *momentary* reasons at T2, which is often the most intuitively troubling aspect.

  Use these as a launchpad, and be ready to adapt based on her specific phrasing. Good luck with the Q&A!
