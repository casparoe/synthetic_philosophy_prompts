prompt: |-
  So in my philosophy of language seminar we're on the conditionals unit and I wanted to run something by you before next week's class. My prof set up Stalnaker's semantics as basically one unified theory of conditionals -- a selection function that just picks out the closest antecedent-world -- that's supposed to cover indicative and counterfactual conditionals alike, with the mood difference only comming from what the selection function is sensitive to (your current epistemic state vs. objective similarity). But apparently Lewis's triviality result is the reason most people nowadays don't buy that, and instead treat indicatives completely differently from counterfactuals -- going full Adams, no real truth conditions, just assertability tracking conditional probability -- while keeping a Stalnaker/Lewis-style semantics only for the counterfactual side. Can you compare the unified Stalnaker picture with this later "split" picture, and say which one you actually find more defensible? Also, does the triviality result really force the split, or is there some way a unified theorist could bite the bullet and survive it (like going trivalent, or making the selection function context-sensitive)?
