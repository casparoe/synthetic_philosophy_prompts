  hey, for my philosophy elective we're doing a mini unit on whether death is actually bad for you, and instead of just reading the handout summary of "the epicurean argument" i went and found an actual old translation of the source instead. it's this roman poet Lucretius — found a translation from the 1880s (some Cambridge classicist named Munro) of book 3 of his big philosophy poem, and there's a passage in there that's supposedly THE core argument, but honestly the logic feels kind of tangled to me. here it is (skipped a chunk in the middle that wasn't as relevant):

  "Death therefore to us is nothing, concerns us not a jot, since the nature of the mind is proved to be mortal; and as in time gone by we felt no distress when the Poeni from all sides came together to do battle, and all things shaken by war’s troublous uproar shuddered and quaked beneath high heaven, and mortal men were in doubt which of the two peoples it should be to whose empire all must fall by sea and land alike, thus when we shall be no more, when there shall have been a separation of body and soul, out of both of which we are each formed into a single being, to us, you may be sure, who then shall be no more, nothing whatever can happen to excite sensation, not if earth shall be mingled with sea and sea with heaven. [...] For he whom evil is to befall must in his own person exist at the very time it comes, if the misery and suffering are haply to have any place at all; but since death precludes this, and forbids him to be, upon whom the ills can be brought, you may be sure that we have nothing to fear after death, and that he who exists not, cannot become miserable."

  i get that the overall point is "death = nothing to be scared of," but two things are tripping me up. first, why bring up some random old war with the "Poeni" (had to google it, pretty sure that's Carthage)? like what work is that comparison actually doing for the argument. second, that last sentence, about how whoever evil happens to has to "exist at the very time it comes" for it to count as evil, feels like a totally different argument than the war/before-birth comparison thing, not just a restating of it. am i right that there's two seperate arguments getting mashed together in this one passage? and if so, does the second one even need the first, or could Lucretius have just skipped straight to it? would love help untangling this, thanks!
