  And "it's-just-log-utility" is literally the objection itself - 0/10 for supporting uniqueness.

  Let me structure the ranking:
  1. Asymptotic dominance (10) - ironclad math
  2. Scoring-rule parallel (8) - deep normative link
  3. Ergodicity argument (6) - insightful but debatable
  4. Bounded-ruin (5) - useful but not proof
  5. Samuelson's fallacy (3) - valid critique 
  6. Fractional-Kelly practice (1) - real-world counter
  7. It's-just-log-utility (0) - the core objection

  The user needs this to win an academic argument, so I'll avoid hedging. The dominance theorem is the killer argument, while the practice evidence most undermines uniqueness.
