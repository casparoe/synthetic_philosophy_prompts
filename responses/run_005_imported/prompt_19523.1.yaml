  **Rationale for Ranking:**
  1. **Asymptotic dominance (10):** Objectively forces uniqueness. The theorem proves Kelly *must* dominate any other fixed fraction strategy almost surely in the limit. No alternative can claim equivalent long-run growth.  
  2. **Scoring-rule parallel (8):** Log-score's unique status as the *only* strictly proper local scoring rule for beliefs mirrors Kelly's uniqueness for repeated bets. This isn't arbitrary—it's a deep alignment between epistemic rationality and instrumental growth.  
  3. **Ergodicity argument (6):** Challenges the foundations of standard EV maximization by showing temporal irrelevance. While provocative, it's more a critique of alternatives than positive proof of uniqueness.  
  4. **Bounded-ruin property (5):** Pragmatically important but insufficient for uniqueness. Other strategies (e.g., fractional Kelly) share this property while rejecting full log-utility.  
  5. **Samuelson's fallacy charge (3):** A *devastating objection to misusing asymptotic results* but doesn't refute uniqueness. It highlights a misuse of Kelly arguments, not a flaw in the dominance theorem itself.  
  6. **Fractional-Kelly practice (1):** Actively undermines uniqueness. Real-world use of half-Kelly shows risk-averse agents *reject* full log-growth maximization as "uniquely rational."  
  7. **It's-just-log-utility (0):** The *core objection itself*, scoring 0 as it provides *zero* support for uniqueness. It asserts the deflationary view Kelly must overcome.  

  **Verdict:** The asymptotic dominance theorem is the decisive argument. Combined with the scoring-rule parallel, it establishes Kelly as uniquely optimal *for unlimited repeated betting*. Samuelson's objection correctly warns against misapplying "eventual" dominance to finite cases, but doesn't negate the theorem's normative force in its intended domain. Real-world fractional betting reflects added constraints (e.g., bankruptcy risk), not a refutation of asymptotic optimality.
