answer: |-
  Here are ten questions designed to push beyond the control principle, targeting the specific concerns you outlined, with anticipated replies and sharp follow-ups:

  1.  **On Williams & Agent-Regret:**
      *   **Question:** Professor, regarding Bernard Williams' lorry driver case: If the non-culpable driver who tragically hits a child is *not* more blameworthy than one who doesn't, why does Williams argue the driver experiences a distinct form of "agent-regret" – a regret specifically tied to *being the agent* of the outcome – rather than mere impersonal regret? If responsibility hasn't changed, what is the *object* of this agent-focused regret if not a heightened sense of implication or burden arising precisely from the unlucky outcome?
      *   *Likely Reply:* She might say agent-regret is a psychological phenomenon reflecting the driver's causal role and the terrible outcome, but it doesn't track heightened *moral blameworthiness*. It's about grief, horror, or identification with the victim, not increased culpability.
      *   **Follow-up:** But doesn't Williams precisely argue that agent-regret *is* a *moral* emotion, distinct from spectator regret, and that denying its connection to the agent's specific moral situation (being causally implicated, even faultlessly) risks mischaracterizing the depth and nature of our moral responses? If this profound regret isn't a response to *any* change in moral standing, what *moral* work *does* it do, and why is it specifically *agent*-regret?

  2.  **On Nagel's Dissolution Worry:**
      *   **Question:** Thomas Nagel worried that consistently applying the control principle against moral luck, especially concerning constitutive luck (who we are) and causal luck (our circumstances), doesn't just explain away a few hard cases, but radically undermines the very possibility of moral responsibility itself. If our characters, capacities, and opportunities are ultimately products of luck, what is left *within* our control that could ground robust moral responsibility on your view? Doesn't your position risk collapsing into hard incompatibilism?
      *   *Likely Reply:* She will likely deny this, arguing that despite luck in our starting points, we *do* have control over specific choices and actions *within* our given circumstances. Responsibility attaches to the exercise of that localized control, tracing back culpability for outcomes to prior culpable choices within one's (luck-influenced) sphere of influence.
      *   **Follow-up:** But doesn't the "tracing" strategy itself crucially depend on identifying *some* initial locus of control? If constitutive luck determines our very capacity for responsible agency (e.g., impulse control, reasoning ability), and causal luck determines the challenges we face, isn't the "local control" you appeal to itself deeply permeated by luck? How can we isolate *any* choice as genuinely "ours" in the responsibility-grounding sense without that choice being shaped by factors utterly beyond our control?

  3.  **On Gauguin & Retrospective Justification:**
      *   **Question:** In Gauguin-type cases, it seems intuitive that the *success* of his artistic project retrospectively provides a justification for abandoning his family that its failure would not. If moral luck is illusory, how do you account for this powerful intuition? Does Gauguin's *ex ante* culpability for abandoning his duties simply vanish if he succeeds? Or was he never truly culpable in the first place?
      *   *Likely Reply:* She might argue that Gauguin was culpable *at the time* for recklessly abandoning known duties based on a mere hope. Success doesn't erase that initial culpability; it might only make it *understandable* or *fortunate*, not retrospectively justified. The justification, if any, must be based on reasons accessible *at the time*.
      *   **Follow-up:** This seems to deny a common intuition: that Gauguin's success *does* show his gamble was somehow *vindicated*. If we insist justification must be entirely independent of outcome, doesn't this render the Gauguin case incoherent? Are we forced to say *either* he was always justified (which seems false *ex ante*) *or* he was always culpable (which seems harsh *ex post* success), denying the role outcome luck seems to play in our actual moral assessments?

  4.  **On the Epistemic vs. Ontological Distinction:**
      *   **Question:** You argue apparent moral luck is merely epistemic – about what we can *infer* about prior culpability. But doesn't this conflate *how we know* blameworthiness with *what constitutes* it? Couldn't the actual moral difference *itself* be constituted by the outcome, even if that outcome was lucky, while our epistemic access *to* that difference relies on the outcome as evidence? How do you rule out this ontological possibility?
      *   *Likely Reply:* She will likely reiterate that responsibility requires control, and the outcome itself, being lucky, cannot be part of what constitutes blameworthiness. The outcome only provides evidence about the *degree* of prior culpable risk taken or the *quality* of the prior intention/action.
      *   **Follow-up:** But doesn't this response simply *assume* the control principle rather than engaging with the challenge that the evidence (the outcome) might be revealing a *real, outcome-dependent* moral property (e.g., the actual wrongness inflicted, the actual harm caused by one's agency)? How do you demonstrate that the outcome isn't *constitutive* rather than merely *evidential* without begging the question?

  5.  **On Moral Remainders & Agent-Regret (Expanding Williams):**
      *   **Question:** Even if we grant that the non-culpable lorry driver isn't *blameworthy*, Williams suggests he still has a moral *obligation* or "remainder" (like making amends) stemming purely from his causal agency in the tragic outcome. How does your view account for such moral remainders if the driver bears no increased blame? Doesn't this suggest a form of moral responsibility or implication *distinct* from blameworthiness, yet still tied to the unlucky outcome?
      *   *Likely Reply:* She might argue that any sense of obligation stems from general duties of beneficence, compassion, or perhaps a non-moral sense of honor/grief, not from a special moral responsibility triggered by the outcome. Or, she might deny robust moral remainders exist in such faultless cases.
      *   **Follow-up:** If the driver feels a specific *moral* obligation to the victim's family (beyond general charity), distinct from what any bystander feels, and Williams argues this *is* a moral phenomenon, doesn't your dismissal risk reducing a profound moral experience to mere psychology or social convention? Doesn't this specific moral residue challenge the idea that outcome luck is *only* epistemically relevant?

  6.  **On Constitutive Luck Specifically:**
      *   **Question:** Focusing on constitutive luck: If my character traits (e.g., impulsiveness, empathy deficit) – which significantly influence my choices – are largely products of genetic/environmental luck, how can I be *fully* responsible for choices flowing from that character? Doesn't your tracing strategy hit a regress problem here, as the "prior culpable choices" shaping my character were themselves influenced by an earlier luck-infused character?
      *   *Likely Reply:* She will argue we *can* be responsible for choices that express our character, even if shaped by luck, provided we had some capacity for reflection and choice *at the time of action*. We can also be responsible for failing to cultivate better character traits when possible.
      *   **Follow-up:** But doesn't the *capacity* for reflection and the *opportunity/motivation* to cultivate better traits themselves seem subject to constitutive luck? If the very tools needed to overcome a deficient character (reason, willpower) are unevenly distributed by luck, how deep does genuine responsibility for character-based actions really go on your account?

  7.  **On Criminal Negligence & Outcome Dependence:**
      *   **Question:** In legal practice, outcomes often matter (e.g., attempted vs. completed crimes; negligent actions causing harm vs. not). While you might say this is pragmatic (deterrence, retribution for harm), doesn't the *moral intuition* underlying these distinctions – that causing harm *is* worse than merely risking it, even with identical culpable mental states – suggest a genuine role for resultant moral luck that your view must explain away as irrational?
      *   *Likely Reply:* She will likely argue legal distinctions are based on harm caused for practical reasons (desert based on consequences, deterrence) or as evidence of intent/risk, not because moral blameworthiness itself differs. The core moral wrong is in the reckless intent/action.
      *   **Follow-up:** But doesn't the *persistence* and *intuitiveness* of this distinction across cultures suggest it taps into a deep-seated moral sense that causing harm through one's agency *does* alter one's moral standing, regardless of prior intent? How do you explain the strength of this intuition if it's fundamentally mistaken?

  8.  **On Reactive Attitudes & Outcome Luck:**
      *   **Question:** P.F. Strawson emphasized reactive attitudes (resentment, gratitude, indignation) as central to moral responsibility. We typically feel *stronger* resentment towards someone whose identical reckless action causes harm than towards one whose action luckily doesn't. If moral luck is illusory, are these differential reactive attitudes systematically mistaken? Or do they track something else?
      *   *Likely Reply:* She might say these attitudes are often disproportionate or misdirected, influenced by the salience of harm. They track the *impact* on us, not necessarily the *blameworthiness* of the agent. We should strive to moderate them based on the agent's control.
      *   **Follow-up:** But if our core moral sentiments reliably track outcome luck, and your view requires us to systematically override or discount these sentiments, doesn't this create a significant tension between our theory of responsibility and our actual moral psychology? Doesn't this suggest the control principle might be revisionary rather than descriptive of our actual responsibility practices?

  9.  **On Risk Magnitude vs. Outcome:**
      *   **Question:** In the drunk driver case, you argue the driver who hits someone is revealed to have taken a *greater risk* than the one who made it home. But isn't the actual *risk* taken identical at the time of driving? Both exposed others to the *same* objective danger. Isn't the difference purely the *outcome*? How does the outcome reveal a difference in the *prior* culpable state?
      *   *Likely Reply:* She might argue that the outcome *is* evidence of the degree of impairment, the recklessness of the route chosen, or other factors *constituting* the higher risk, even if not perceived as such beforehand. The unlucky driver *was* actually riskier.
      *   **Follow-up:** This seems vulnerable to counterexamples: imagine two drivers, equally impaired, on identical deserted roads, where one hits a lone, unseen pedestrian who stumbled onto the road, while the other doesn't. Was one driver *actually* riskier? Doesn't this show that sometimes, the *only* difference is the outcome itself, undermining the claim that outcome always reveals a prior difference in culpability?

  10. **On Moral Taint Without Blame:**
      *   **Question:** Even if you deny increased *blameworthiness* in cases of bad resultant luck, is there a sense in which an agent can be morally *tainted* or *marked* by being causally responsible for a terrible outcome, even through no fault of their own (like Williams' driver)? Does your account have space for this non-blameworthy form of moral residue tied specifically to agency and outcome luck?
      *   *Likely Reply:* She might reject the notion of "moral taint" without blameworthiness, viewing it as a confused or overly dramatic description of psychological distress or regret (which she addressed earlier).
      *   **Follow-up:** Doesn't the concept of "moral taint" capture something crucial about how serious moral events transform an agent's own narrative and relationship to the world, distinct from blame but still deeply moral? If your framework reduces this solely to non-moral psychology, does it adequately capture the full phenomenology and significance of being the *agent* of tragic luck?

  **Key Strategies Employed:**
  *   **Targeting Phenomenology:** Focusing on experiences like agent-regret and moral taint that seem directly tied to outcomes.
  *   **Pressing Nagel's Slippery Slope:** Challenging the stability of the control principle against pervasive luck (constitutive, causal).
  *   **Highlighting Intuition Gaps:** Pointing to strong intuitions (Gauguin's justification, differential reactive attitudes, outcome in law) that resist the "only prior culpability" explanation.
  *   **Distinguishing Epistemic/Ontological:** Questioning whether the outcome is *only* evidence or could be constitutive.
  *   **Exploring Concepts Beyond Blame:** Focusing on moral remainders, obligations, taint, and reactive attitudes that aren't purely about blameworthiness.
  *   **Sharp Follow-ups:** Anticipating common denials (it's just psychology, it's just evidence, control still exists locally) and pushing back by appealing to the depth of the experience, the instability of tracing, or the counterintuitive implications.

  These questions should force engagement with the deeper challenges to her position beyond simply restating the control principle. Good luck with the seminar and Q&A!
