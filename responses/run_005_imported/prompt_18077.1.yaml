prompt: |-
  I'm a philosophy major taking a seminar on moral responsibility this term; we've just spent several weeks on moral luck. Our department's speaker series is bringing in a philosopher who is known for denying that moral luck is real: on her view, apparent differences in blameworthiness -- say, between a drunk driver who makes it home and one who hits a pedestrian -- are fully explained by what we're licensed to infer about the agents' prior culpability, not by any real difference in how blameworthy they are. I've been asked to draft questions for the audience Q&A, and I don't want her simply restating the control principle (that we're responsible only for what's within our control). Please draft eight to ten questions that go beyond that: I want at least one question on Williams' lorry-driver case and agent-regret -- why would a non-culpable driver feel a distinctive kind of regret if nothing about his actual responsibility has changed? -- at least one on Nagel's own worry that pushing the control principle through constitutive and causal luck seems to dissolve the space of agency altogether rather than just explain away a few hard cases, and at least one on the Gauguin-type case, where retrospective justification for abandoning prior obligations seems to hinge on how things turn out. For each, add a short follow-up keyed to the reply she's most likely to give.
reasoning: |-
  Okay, the user is a philosophy major working on moral responsibility, specifically moral luck. They need to draft Q&A questions for a visiting philosopher who denies moral luck exists. The user wants questions that go beyond the control principle, covering Williams' lorry-driver case, Nagel's constitutive luck worry, and Gauguin-type cases. They also want follow-ups for each.

  First, I need to recall the key arguments. The control principle says responsibility only applies to what's within our control. The visiting philosopher argues that apparent moral luck cases are just about prior culpability or epistemic limitations. For example, the drunk driver who hits someone isn't more blameworthy due to luck but because we infer they were reckless.

  The user wants to avoid restating the control principle. So questions need to dig deeper. Let's start with Williams' agent-regret. Williams points out that even a non-culpable driver feels a special regret after an accident. This seems odd if luck doesn't affect blameworthiness. The question here should challenge why such regret exists if responsibility hasn't changed. The follow-up could address whether the philosopher dismisses this as irrational, which might ignore the phenomenology.

  Next, Nagel's worry. If we push the control principle through constitutive and causal luck, it might dissolve all agency. For instance, who we are (constitutive luck) and our circumstances (causal) are luck-based. If these affect our actions, how can we be responsible at all? The question should ask if denying moral luck leads to this slippery slope. The follow-up could challenge whether the philosopher's view collapses into hard incompatibilism, which denies free will.

  Then, Gauguin. His success justifies abandoning his family. But if he failed, he'd be blameworthy. The luck in outcomes affects moral justification. The question here is how retrospective justification works without outcome luck. The follow-up might question if separating moral permissibility from success undermines the intuition that Gauguin's success matters.

  I should also consider other angles. Maybe epistemic vs. ontological: is the philosopher conflating what we can know with what actually exists? Or the role of moral emotions: if regret isn't about blame, what is it about? Also, societal practices like punishment: how does her view handle legal distinctions based on outcomes?

