prompt: |-
  Me and my flatmate got into a proper argument over dinner last night about whether absences can really be causes -- she thinks "nothing" just can't do causal work, full stop, and I think that's obviously too strong once you look at ordinary cases, like a missed inspection causing a fire. We must have gone back and forth for a good hour, and this morning I realised the argument is annoyingly relevant to something I actually have to deal with this week. I sit on the incident review board at the biotech company I work for, and we're closing out the report on a small fire in one of our cold-storage rooms two months back. The mechanical story is uncontroversial: a compressor overheated because a filter had clogged. What's not settled is whether the report should list "failure to perform the scheduled monthly filter check" as a cause of the fire. Half the board wants it in, since if the check had happened the buildup would almost certainly have been caught in time. Our facilities director is blocking that, and her objection is sharper than "omissions can't be causes" -- she points out that the fire also counterfactually depended on the manufacturer never fitting an auto-shutoff, on the county not requiring one, and on her own not randomly double-checking that week even though it wasn't her job, and asks why, if we're promoting the missed filter check to "a cause," we don't have to put all of those on the list too. Nobody on the board has a principled answer for her; they just feel like the technician's omission is obviously the relevant one.

  Could you write the memo I'm going to circulate before the board meets again on Friday? I need an actual recommendation on whether "failure to perform the scheduled filter check" belongs in the causes section of the report, or whether missed duties should go in a seperate, explicitly non-causal category (contributing conditions, say) while the causal narrative sticks to the physical chain of events -- and the reasoning has to be something the facilities director could actually respond to, not just an assertion that some omissions "obviously" matter more than others. It would help to draw on how the going accounts of causation actually handle this: the counterfactual-dependence line that Lewis-style theories are committed to (and the overgeneration problem it runs into), the various proposals for picking out the "right" omission by appeal to norms, roles, or what would normally have happened, and the more skeptical position that no omission is ever strictly a cause and that citing one is really giving an explanation, not identifying a cause. Don't give me a wishy-washy "there are considerations on both sides" memo -- pick a position and defend it against the strongest version of the objection.
reasoning: |-
  Okay, the user is in a tricky spot. They need to write a memo for their incident review board about whether to list a missed filter check as a cause of a fire. Their facilities director is pushing back hard, arguing that if they count that omission as a cause, they'd have to include all sorts of other counterfactual dependencies too. 

  Hmm, this isn't just theoretical - it's urgent and practical. The user needs a defensible position by Friday, not philosophical waffling. I notice they're unusually well-informed about causation theories (Lewis, norms, etc.), which is helpful. They clearly want substance, not platitudes.

  The core tension is between counterfactual overgeneration ("why not list every omission that could've prevented it?") and the intuitive special status of the technician's omission. The director isn't wrong - Lewis-style theories do explode causes. But the board isn't crazy either - some absences clearly matter more. 

  What's needed is a framework that:
  - Acknowledges the director's point isn't silly 
  - Explains why some omissions get privileged status
  - Provides clear criteria for the report
  - Isn't just "this feels important"

  The most promising angle seems to be norm-based causation (like Schaffer or Moore). It accepts that omissions can be causes but filters them through expectations - duties, norms, standards. That lets us say: 
  - Yes, the county's lack of regulation is counterfactually necessary 
  - BUT it's not a cause because we don't expect regulators to mandate every possible safety feature
  - Whereas we absolutely expect technicians to do scheduled maintenance

  This does three things:
  1. Validates the director's concern by admitting her examples are technically counterfactual causes
  2. Draws a bright line at norm violations
  3. Explains why the technician's omission is uniquely reportable

  The memo should preempt the obvious pushback: "Aren't norms subjective?" By grounding them in the company's own systems (job descriptions, maintenance schedules, regulatory requirements), we make it objective-ish. The technician had a duty; the facilities director didn't have a duty to randomly double-check.

  Also worth addressing the "but causation should be physical" view head-on. Point out that incident reports aren't physics papers - they serve practical purposes like preventing future errors. Including only mechanical causes would make the report useless for improving procedures.

  ...Wait, but what about the skeptical position that omissions aren't causes at all? Might need to disarm that quickly by distinguishing causation from explanation. We can say: "Strictly speaking, the fire was caused by heat and oxygen - but that's not what we need from this report."

  Final structure:
  - Punchy intro: We recommend including the omission
  - Section 1: Why the director's concern is reasonable (Lewis overgenerates)
  - Section 2: Why norm-based causation solves this (duties > random counterfactuals)
  - Section 3: Why this isn't subjective (tied to company systems)
  - Section 4: Why "physical causes only" is inadequate for incident reports
  - Clear recommendation with placement guidance
answer: |-
  **MEMORANDUM**  
  **TO:** Incident Review Board Members  
  **FROM:** [Your Name], Board Member  
  **SUBJECT:** Recommended Causal Classification for Cold-Storage Fire (Ref: Incident #CSF-114)  
  **DATE:** [Current Date]  
  **CC:** Facilities Director  

  ---

  ### **I. RECOMMENDATION**  
  **Include "failure to perform the scheduled monthly filter check" as a causal factor in the report.** This omission should be listed under a dedicated "Procedural/Agentive Causes" subcategory within the broader "Causal Factors" section, distinct from "Mechanical Causes" (e.g., compressor overheating, clogged filter). *Do not* relegate omissions to a non-causal "contributing conditions" section.  

  ### **II. RATIONALE: WHY THIS OMISSION IS A CAUSE (AND WHY OTHER ABSENCES ARE NOT)**  
  The Facilities Director rightly identifies that David Lewis-style counterfactual theories of causation *overgenerate* causes: if the fire counterfactually depended on infinite absences (e.g., no auto-shutoff, no regulatory requirement, no random double-check), why single out the technician’s omission? **The solution is not to reject omissions as causes, but to adopt a *normatively constrained* theory of causation.** This resolves overgeneration while upholding the technician’s omission as uniquely causal.  

  #### **A. The Overgeneration Problem & Its Solution**  
  - **Lewis’s Challenge:** Under pure counterfactual dependence, *any* omission without which the fire would not have occurred qualifies as a cause. This includes:  
    - The manufacturer not installing an auto-shutoff.  
    - The county not mandating auto-shutoffs.  
    - The Facilities Director not personally checking the filter.  
  - **Why This Fails Practically:** Listing all such absences renders incident reports useless. It obscures actionable accountability and conflates *causal relevance* with *explanatory noise*.  
  - **The Fix: Normative Constraints**  
    Causation is not merely about difference-making; it requires **contrastive, norm-bound selection** (Schaffer 2005; Moore 2009). An omission is causal *only if*:  
    > **(1)** There was a *specific, established norm or duty* to act;  
    > **(2)** The act was *expected under ordinary conditions*;  
    > **(3)** The omission *deviated from this norm* and created a foreseeable risk.  

  #### **B. Why the Technician’s Omission Qualifies as a Cause**  
  | **Criterion**               | **Technician’s Omission**                                  | **Director’s Examples (e.g., no auto-shutoff)**         |  
  |-----------------------------|------------------------------------------------------------|---------------------------------------------------------|  
  | **Established Duty**        | Explicit in maintenance protocol (§4.3.1 Facility Manual). | No duty for manufacturer/county to *retrofit* equipment. |  
  | **Ordinary Expectation**    | Monthly checks are routine, scheduled, and documented.     | Auto-shutoffs not standard for this unit class; no regulatory history requiring them. |  
  | **Norm Deviation**          | Deviation from internal SOPs; created known fire risk.     | Absence of auto-shutoff reflects *baseline conditions*, not a deviation. |  

  **Conclusion:** The omission is a cause because it breached a *specific, operative norm* within our operational system. The other absences are merely *background conditions*—they enabled the fire but did not *actively intervene* in the causal chain via norm violation.  

  #### **C. Why "Physical Causes Only" Is Inadequate**  
  - **The Skeptical View (e.g., Dowe 2000):** "Causes require energy transfer; omissions are non-events and thus explanatory but not causal."  
  - **Rebuttal:** Incident reports serve **preventive/practical goals**, not metaphysical purity. Excluding omissions:  
    - Ignores how human actions/inactions physically shape outcomes (e.g., *not* removing a clog *permits* overheating).  
    - Undermines accountability: If "clogged filter" is causal but "failure to unclog filter" isn’t, reports decouple procedure from outcome.  
  - **Precedent:** OSHA/NTSB reports routinely list procedural violations (e.g., "failure to inspect") as causal.  

  ---

  ### **III. IMPLEMENTATION: STRUCTURING THE REPORT**  
  To address overgeneration concerns while capturing causality:  
  1. **Section: Causal Factors**  
     - **Mechanical Causes:**  
       > "Clogged air filter leading to compressor overheating."  
     - **Procedural/Agentive Causes:**  
       > "Failure to perform scheduled monthly filter inspection (per SOP 7.8), allowing undetected clog progression."  
  2. **Section: Contributing Conditions** (Non-causal but relevant):  
     > "Absence of secondary compressor auto-shutoff (industry-standard for Class B units post-2020)."  
     > "County fire code §12 does not mandate auto-shutoffs for cold-storage units under 500 sq. ft."  

  ---

  ### **IV. ANTICIPATED OBJECTIONS & RESPONSES**  
  - **Objection:** "This is subjective! Why prioritize *our* norms over the manufacturer’s design choices?"  
    **Response:** Norms are objective *within the system under review*. Our SOPs define technician duties; industry standards define manufacturer obligations. The omission violated *our* operational norms—manufacturers violated none.  

  - **Objection:** "Calling omissions ‘causes’ blames technicians unfairly."  
    **Response:** Causality ≠ blame. The report should clarify: "Procedural causes identify system failures; disciplinary action follows HR policy, not incident reports."  

  - **Objection:** "What about the Facilities Director’s hypothetical double-check?"  
    **Response:** Random acts fall outside *established duties*. Including them would indeed overgenerate—hence our focus on codified norms.  

  ---

  ### **V. CONCLUSION**  
  **Include the omission as a cause.** It satisfies norm-constrained counterfactual criteria, aligns with best practices in industrial incident reporting, and provides actionable insight. Relegating it to a non-causal category ignores how procedural breaches *actively shape* physical outcomes and hinders preventive strategies. The Facilities Director’s valid concerns about overgeneration are resolved by restricting causal omissions to *duty-bound, norm-violating absences*.  

  **Recommended Vote:**  
  - **Approve** listing "failure to perform scheduled filter check" under **Causal Factors**.  
  - **Reject** moves to classify omissions as non-causal.  

  ---  
  *Attached: Schaffer (2005), "Contrastive Causation"; OSHA Directive CPL 02-00-137 (Incident Investigation Guidelines).*
