  I remember Rambam distinguishes between the essence of a practice and its regulation. Maybe Abel and Noah's sacrifices were spontaneous expressions of devotion, not formalized rituals. Rambam could argue that the Torah institutionalized sacrifices to redirect existing tendencies. So pre-Mosaic sacrifices were personal, while the Mosaic system was structured to combat idolatry.

  Also, Rambam emphasizes context. The Israelites in Egypt were steeped in pagan rituals. Even if sacrifices predated idolatry, the Israelites needed a structured system to replace their idolatrous habits. The Torah's detailed laws provided that structure, turning a universal impulse into a monotheistic framework.

  Another angle is Rambam's view on divine wisdom. God uses human nature to guide people gradually. Sacrifices were a pedagogical tool. The existence of early sacrifices doesn't negate their use as a later concession. Rambam might say that Abel's sacrifice was acceptable but not the ideal; the ideal is prayer and contemplation, which sacrifices were meant to evolve into.

  I should also consider the purpose behind sacrifices. For Rambam, the primary goal was to eradicate idolatry. The Torah incorporated sacrifices but infused them with monotheistic intent. The rituals were similar to pagan ones but directed solely to God, easing the transition. The key difference is intentionality and exclusivity.

