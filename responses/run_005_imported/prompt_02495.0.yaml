prompt: |-
  I'm a philosophy major taking a course on decision theory this term, where we've spent the last few weeks working through expected utility theory, Dutch book arguments, and the standard reasons why credences and preferences are supposed to satisfy the probability axioms. Something that happened on my floor this week doesn't sit right with me, and I can't tell whether it's actually in tension with anything we've covered or whether I'm just missing something obvious.

  A friend of mine who's really into trading set up an informal betting arrangement for anyone on our floor who wants in. Each week, you can stake any portion of your current balance, and he's been completely upfront about the odds: whatever amount you commit has a 55% chance of growing by 80% and a 45% chance of shrinking by 60%. You're free to let your balance ride into the next week if you want, and most people have been doing that. He's been urging everyone to commit their entire balance every single week, on the grounds that 0.55 times 1.80 plus 0.45 times 0.40 comes out to 1.17, meaning the wager nets a positive expected return of seventeen percent per round, so holding anything back is just leaving free money on the table. He's also pointed out that since most of us intend to keep playing every week for the rest of the semester, the law of large numbers guarantees that our results will converge toward that expected return, so it's practically a sure thing for anyone who sticks with it. Two people who followed his advice and went all-in for several weeks running have already lost their entire balance, but he maintains that this is just an unlucky run and doesn't undermine the underlying reasoning.

  I can't shake the sense that something is wrong here, but his expected-value arithmetic checks out, and I don't have a clean rebuttal to the law-of-large-numbers point either. Is my friend right that committing your whole balance every week is the rational strategy as long as each round has positive expected value, or is there a flaw in his reasoning? If there is, I'd like to understand exactly where it breaks down, and how one should actually think about how much of a balance to risk on a wager like this when you intend to keep playing it repeatedly.
reasoning: |-
  Okay, let me try to figure out what's going on with this betting scenario. The user is a philosophy major studying decision theory, and their friend is running a betting pool where each week you can stake part of your balance with a 55% chance of gaining 80% and a 45% chance of losing 60%. The friend argues that since the expected value is 1.17, you should go all-in every week, and the law of large numbers will ensure profit over time. But two people already went broke, which feels off.

  First, I need to verify the expected value calculation. 0.55 * 1.8 + 0.45 * 0.4 = 0.99 + 0.18 = 1.17. That's correct. So each bet has a positive expected value. But why did people lose everything? The key might be in the multiplicative nature of repeated bets. 

  When you bet multiple times, the outcomes compound multiplicatively. If you win, your balance multiplies by 1.8; lose, and it multiplies by 0.4. Going all-in every time means that if you lose once, your balance drops to 40%, and if you lose again, it's 16%, and so on. Even though winning gives you 80%, losing wipes out 60%. After a win and a loss, the net effect is 1.8 * 0.4 = 0.72, a 28% loss. So the order doesn't matter; the losses hurt more than the gains help. 

  The friend mentions the law of large numbers, but that applies to additive processes, not multiplicative. Here, the geometric mean matters more than the arithmetic mean. The geometric mean for each bet is (1.8)^0.55 * (0.4)^0.45. Calculating that: 1.8^0.55 ≈ 1.43, and 0.4^0.45 ≈ 0.63. Multiply them: 1.43 * 0.63 ≈ 0.901. So each bet reduces the median outcome by about 10%. That means the most likely outcome is losing money over time, even though the arithmetic mean is positive. 

  The two people who went broke probably hit a few losses early. With a 45% chance of losing 60%, several losses in a row can quickly deplete the balance. Since each loss multiplies the balance by 0.4, two losses take you to 16% of the original, and three to 6.4%. Recovery becomes almost impossible. 

  The rational approach here is to use the Kelly Criterion, which maximizes the logarithm of wealth. The optimal fraction to bet is (p * b - q)/b, where p is win probability (0.55), q is loss probability (0.45), and b is the net gain (0.8). Plugging in: (0.55 * 0.8 - 0.45) / 0.8 = (0.44 - 0.45)/0.8 = (-0.01)/0.8 = -0.0125. Since it's negative, the Kelly fraction is zero. That means you shouldn't bet at all. But even if the fraction were positive, betting a fraction less than full would be optimal. 

  The flaw in the friend's reasoning is focusing on the arithmetic mean and expected value without considering the compounding effects. For repeated bets, the geometric mean determines long-term growth. Here, the geometric mean is less than 1, so betting full balance leads to ruin. The law of large numbers doesn't save you because it applies to averages, but if the geometric mean is below 1, you'll go broke almost surely. 

  The user might be confused because the course covered Dutch books and probability axioms, but this is about repeated bets and wealth management. They need to understand that expected utility theory might require considering risk aversion or using log utility. The Kelly Criterion provides a way to maximize growth rate, avoiding ruin. 

  So the friend's advice is wrong. Betting full balance every week is irrational despite the positive expected value per bet. The rational strategy is not to bet at all, or if forced, bet a small fraction. But in this case, Kelly says zero. Explaining the difference between arithmetic and geometric means is crucial here. The user's intuition was right; something is off, and it's the misunderstanding of how repeated multiplicative bets work.
answer: |-
  Your intuition is spot-on—there's a critical flaw in your friend's reasoning. While each individual bet has a positive *arithmetic* expected return (17%), repeatedly betting your entire balance is mathematically irrational and practically disastrous. The issue lies in misapplying expected value and the law of large numbers to a *multiplicative* process. Here's why:

  ### 1. **The Core Problem: Multiplicative vs. Additive Processes**
     - Your friend treats each round as an *additive* process (e.g., "expect to gain 17% per round"). But wealth compounds *multiplicatively*. After a win, your balance multiplies by 1.8; after a loss, it multiplies by 0.4.
     - **Crucial observation**: A win followed by a loss (or vice versa) does *not* break even:  
       - Win then loss: `1.8 × 0.4 = 0.72` (28% loss).  
       - Loss then win: `0.4 × 1.8 = 0.72` (same 28% loss).  
     - Unlike additive processes (e.g., coin flips for money), the *order of outcomes matters* for terminal wealth. Losses permanently destroy capital, making recovery harder.

  ### 2. **The Geometric Mean Dominates Long-Term Growth**
     - For repeated bets, the **geometric mean growth rate** (not arithmetic mean) determines long-term wealth. This is the average factor by which your balance multiplies per round:  
       \[
       G = (1.8)^{0.55} \times (0.4)^{0.45}
       \]
     - Calculate:  
       - \(1.8^{0.55} \approx 1.43\)  
       - \(0.4^{0.45} \approx 0.63\)  
       - \(G \approx 1.43 \times 0.63 = \boxed{0.901}\) (approx. **–9.9%** per round).  
     - Since \(G < 1\), your wealth *declines* over time. The positive arithmetic mean (17%) is misleading because it ignores compounding. Your friend's strategy has a *negative expected growth rate*.

  ### 3. **Bankruptcy Risk: The Role of Variance**
     - Betting full balance amplifies variance. With a 45% chance of a 60% loss each round:  
       - Probability of ruin after \(n\) rounds = \(1 - (1 - 0.45^n)\) (if ruined after first loss).  
       - After just 3 rounds: 9.1% chance of total loss. After 10 rounds: ~99.5% chance.  
     - The law of large numbers (LLN) **does not save you**:  
       - LLN says the *average* return converges to 17%, but for multiplicative processes, this average is irrelevant. What matters is \(G^n\) (geometric growth).  
       - If \(G < 1\), \(\lim_{n \to \infty} \text{balance} = 0\) with probability 1.  

  ### 4. **Rational Strategy: The Kelly Criterion**
     The optimal approach maximizes long-term growth by betting a *fraction* \(f\) of your bankroll. The **Kelly fraction** is:  
     \[
     f^* = \frac{pb - q}{b}
     \]  
     Where:  
     - \(p = 0.55\) (win probability),  
     - \(q = 0.45\) (loss probability),  
     - \(b = 0.8\) (net win gain, e.g., 80% → \(b = 0.8\)).  
     Plugging in:  
     \[
     f^* = \frac{(0.55 \times 0.8) - 0.45}{0.8} = \frac{0.44 - 0.45}{0.8} = \frac{-0.01}{0.8} = \boxed{-0.0125}
     \]  
     **Interpretation**:  
     - Since \(f^* < 0\), the rational move is **not to bet at all**. The bet is unfavorable for long-term growth.  
     - Even if \(f^*\) were positive (e.g., if win probability were higher), full commitment (\(f = 1\)) would *still* be suboptimal.  

  ### Why Your Friend is Wrong
  - **Misplaced focus on arithmetic mean**: Expected value is valid for a single bet, but repeated play requires geometric growth optimization.  
  - **Ignoring path dependence**: Terminal wealth depends on sequence, not just total wins/losses.  
  - **Overestimating LLN**: LLN ensures convergence of averages, but not of terminal wealth when \(G < 1\).  

  ### Practical Advice
  1. **Never bet full balance** in repeated multiplicative bets.  
  2. **Use fractional betting**: If forced to play, bet a small fraction (e.g., 5-10%) to reduce risk of ruin.  
  3. **Assess edge rigorously**: Here, the bettor’s edge (\(pb - q = -0.01\)) is negative, so abstaining is optimal.  

  ### Philosophical Implication
  This exposes a limitation in naïve expected utility theory (EUT). EUT works for additive, one-off bets but fails for multiplicative sequences where wealth effects compound. Rational agents must optimize *growth rates* (via log utility) rather than linear expected value. Your course likely assumed "small" bets or additive payoffs—this case breaks those assumptions.  

  **In short**: Your friend’s strategy is mathematically doomed. Two bankruptcies aren’t "bad luck"—they’re the inevitable outcome of a negative-growth system. The rational stake is $0.
