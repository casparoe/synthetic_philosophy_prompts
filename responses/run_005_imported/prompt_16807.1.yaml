     Therefore, the total cost incurred until stopping at step k is: C * (k-1) [because the agent continued (k-1) times].

     So the net reward when stopping at step k is: R(k) - C*(k-1).

     Then the total expected reward is:

        E = sum_{k=1}^{infty} [ p * (1-p)^(k-1) * ( R(k) - C*(k-1) ) ]

     Now, the problem is that R(k) might be a function of k. How does R(k) behave? 

