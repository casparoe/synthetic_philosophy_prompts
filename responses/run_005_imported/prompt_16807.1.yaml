     e. **Robustness**: Since the model (R(k)) might be uncertain, you might want to choose p robustly or adaptively. But note: the agent cannot remember past steps, so adaptive learning at the individual decision level is not possible. However, you could learn p over multiple tasks (i.e., at the system level, not within a task).

