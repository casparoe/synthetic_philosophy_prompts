     Case 2: R(k) is increasing and then plateaus.

     But note: in your problem, the agent might be stuck in an infinite loop? Then we need to consider that the agent might never stop? We have to set a maximum step? Or we can assume that R(k) eventually becomes negative? Or we can discount future rewards.

