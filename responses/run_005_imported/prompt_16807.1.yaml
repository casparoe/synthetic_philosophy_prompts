     Actually, the probability that the agent is at step k is determined by p. Specifically:

     - The agent starts at step 1.
     - The probability of reaching step 2 is (1-p).
     - The probability of reaching step k is (1-p)^(k-1).

     Then, the agent stops at step k with probability p * (1-p)^(k-1).

     The expected total reward is:

        E = sum_{k=1}^{infty} [ p * (1-p)^(k-1) * R(k) ] - sum_{k=1}^{infty} [ (1-p)^(k-1) * C * (1 - p) ? ]

