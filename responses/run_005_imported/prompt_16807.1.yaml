  11. **An example with constant R and linear cost**: Suppose R(k) is constant (say R) and the cost of each continue is C. Then the net reward when stopping at step k is: R - C*(k-1). Then:

          E = sum_{k=1}^{infty} p (1-p)^(k-1) [ R - C*(k-1) ]
            = R * [ sum_{k=1}^{infty} p (1-p)^(k-1) ] - C * [ sum_{k=1}^{infty} p (1-p)^(k-1) * (k-1) ]

