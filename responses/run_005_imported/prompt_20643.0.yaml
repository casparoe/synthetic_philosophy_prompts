  First, I need to unpack each concept. Moral trade involves two people with different values making deals based on comparative advantage. For example, one person might care about animal welfare but not labor rights, while another is the opposite. They trade moral responsibilities so each can focus on their area of concern, leading to better outcomes by their own standards without changing their beliefs. The economic analogy here is strong because it mirrors trade where parties exchange goods or services based on differing valuations, leading to mutual benefit. The strains come from assuming fixed preferences and the challenge of enforcing agreements without shared moral authority.

  The parliamentary model deals with an individual's moral uncertainty. Different moral theories they subscribe to with varying credences act like delegates in a parliament. These "delegates" vote and logroll to reach a decision. The trade here is metaphorical, involving compromise among internal perspectives. The economic analogy works in terms of bargaining and vote-trading but strains because there's no actual exchange—it's all internal. Also, the stability of the "delegates" is questionable since one's credences might shift, making the parliament dynamic.

  The user wants a clear verdict. I need to evaluate which idea is more defensible normatively. Moral trade allows real-world cooperation without requiring value alignment, which is practical. However, it risks reinforcing moral blind spots. The parliamentary model helps individuals navigate uncertainty but is metaphorical and lacks a clear mechanism for resolving conflicts beyond the initial setup. Its abstract nature makes it less actionable.

  Considering the user's deeper needs: they're writing an article and need quotable insights. They likely want to highlight tensions within EA philosophy. A bold verdict would serve their purpose better than a balanced take. Moral trade has real-world applicability and doesn't require internal coherence, making it more robust. The parliamentary model's reliance on a fixed internal structure is a weakness. Therefore, I'll argue that moral trade is more defensible.
answer: |-
  Here's a clear breakdown and comparison, followed by a definitive verdict:

  **Core Concepts & What's Being "Traded":**

  1.  **Toby Ord's Moral Trade:**
      *   **What:** Genuine exchange *between distinct individuals* with *fixed, different moral values*.
      *   **What's Traded:** **Moral burdens or responsibilities.** Each agent takes on a burden the *other* finds highly costly (according to *their own* values) in exchange for the other taking on a burden *they* find highly costly. The "currency" is the alleviation of the other's moral distress.
      *   **Analogy to Economics:** This is a **direct application** of comparative advantage and gains from trade.
          *   **Holds Up:** Individuals have different "cost structures" for different moral actions based on their values. Specialization and trade allow each to achieve a higher "output" (moral good by their own lights) than autarky. The gains are real and measurable *within each agent's value system*. Enforceability and finding counterparties are practical hurdles, but the core logic is robust.
          *   **Strains:** Assumes stable, revealed preferences (values don't change due to trade). Requires mutual recognition and communication. Doesn't resolve deep moral disagreement, just exploits it for mutual benefit. Enforcement relies on trust or external mechanisms (like shared EA norms).

  2.  **Bostrom's Parliamentary Model (Moral Uncertainty):**
      *   **What:** A metaphorical decision-making procedure *within a single individual* grappling with *moral uncertainty* (credences in competing moral theories).
      *   **What's Traded:** **"Votes" or support across different decisions.** Delegate A (Theory A) agrees to vote for Delegate B's (Theory B) preferred outcome on Decision Y, *if* Delegate B votes for Delegate A's preferred outcome on Decision X. The "currency" is **logrolling** – trading influence across issues.
      *   **Analogy to Economics:** It's an analogy to **political logrolling within a legislature**, not direct market trade.
          *   **Holds Up:** Captures the idea of compromise under pluralism. Allows an uncertain agent to satisfy different parts of their moral worldview to *some* degree across multiple decisions, avoiding catastrophic failure under any single theory they give credence to. Provides a structured way to handle conflicting internal demands.
          *   **Strains:** It's purely metaphorical. There are no *real* delegates bargaining; it's one mind simulating a process. Defining the "delegates" (how theories map to specific choices) and the "voting rules" is non-trivial and arbitrary. The "stability" of the delegates/logrolls is questionable – new information might drastically shift credences, destabilizing prior bargains. Risks internal incoherence ("I voted for X *only* to get Y, but I actually hate X").

  **Key Comparison Table:**

  | Feature               | Moral Trade (Ord)                     | Parliamentary Model (Bostrom)           |
  | :-------------------- | :------------------------------------ | :-------------------------------------- |
  | **Scope**             | Between individuals                   | Within a single individual              |
  | **Core Problem**      | Differing fixed values                | Moral uncertainty (competing theories)  |
  | **What's "Traded"**   | Moral burdens/responsibilities        | Logrolling: Votes/Support across issues |
  | **"Currency"**        | Alleviation of counterparty's burden  | Reciprocal influence on decisions       |
  | **Economic Analogy**  | Direct Gains from Trade (Markets)     | Political Logrolling (Legislatures)     |
  | **Core Benefit**      | Pareto improvement under fixed values | Coherent action under uncertainty       |
  | **Core Weakness**     | Requires counterparty, enforcement    | Metaphorical, arbitrary implementation  |

  **The Verdict: Moral Trade (Ord) is the More Defensible Normative Idea.**

  **Here's why, and you can quote this:**

  > "While both concepts ingeniously deploy economic metaphors to solve ethical problems, Toby Ord's Moral Trade emerges as the more robust and defensible normative framework. Its core economic analogy – genuine gains from specialization and exchange based on comparative advantage under *fixed* preferences – is not just illustrative but *operational*. It produces demonstrable, mutually beneficial improvements in outcomes *according to each agent's own existing values*, without demanding impossible value convergence or self-deception. It harnesses difference productively.
  >
  > Bostrom's Parliamentary Model, while a compelling metaphor for wrestling with internal doubt, ultimately strains under its own artifice. The 'delegates' are not real bargaining agents but projections of one mind's uncertainty. The logrolling is a useful heuristic, but the process for defining delegates, voting rules, and enforcing bargains remains arbitrary and lacks a clear normative foundation *beyond* the metaphor itself. It risks trading real-world coherence for internal proceduralism. Moral Trade offers a concrete mechanism for ethical cooperation in a pluralistic world; the Parliamentary Model offers a sophisticated, but ultimately metaphorical, algorithm for individual indecision."

  **Reasoning for the Verdict:**

  1.  **Grounded in Reality:** Moral Trade deals with observable actions and preferences between real agents. The Parliamentary Model deals with abstract credences and simulated entities within one mind.
  2.  **Clearer Normative Foundation:** The Pareto improvement achieved through Moral Trade (each agent better off by *their own* lights) is a powerful and relatively uncontroversial normative benchmark in welfare economics. The "optimality" of a Parliamentary logroll is far murkier; why *that* particular compromise is normatively superior isn't as clear-cut.
  3.  **Less Metaphorical Burden:** Moral Trade's economic logic is direct and literal in its application. The Parliamentary Model relies heavily on sustaining the legislative metaphor, which breaks down under scrutiny (e.g., who sets the agenda? what stops a "delegate" from reneging?).
  4.  **Addresses a Harder Problem?** While moral uncertainty is profound, *resolving fundamental value conflicts between people* without coercion or imposition is arguably the more fundamental challenge for ethics in a diverse world. Moral Trade offers a genuine, non-coercive path here. The Parliamentary Model addresses how one confused person *might* act, but doesn't solve interpersonal conflict.
  5.  **Practicality vs. Speculation:** Instances approximating Moral Trade (e.g., issue-specific activism swaps, certain political coalitions) demonstrably occur. The Parliamentary Model remains largely a theoretical construct for individual decision-making.

  **In essence:** Moral Trade provides a powerful, practical, and normatively clear framework for cooperative ethics *despite* irreconcilable differences. The Parliamentary Model is a clever, but ultimately less sturdy, metaphorical tool for navigating personal doubt. The former builds bridges between people; the latter attempts to build coherence within a single, conflicted mind. Building bridges is the more foundational and defensible ethical achievement.
