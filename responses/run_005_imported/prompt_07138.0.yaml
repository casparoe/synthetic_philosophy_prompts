  I went down a bit of a research rabbit hole on this a few weeks back (mostly SEP-type articles and some old philosophy forum threads) so I've got the basic setup down - the coin flip, the memory wipe, the different waking schedules depending on heads vs tails - but I'm not steeped in it enough to write a joke that would actually satisfy someone who works in this area. Could you write me one joke where the punchline genuinely depends on the substance of the self-locating belief debate - like the disagreement between "thirders" and "halfers" over what credence she should assign to the coin having landed heads when she wakes up, or on what it even means for information to be self-locating rather than just plain propositional? I don't need a refresher on the problem itself, I just need the joke to actually land with someone who's read the literature and not be a generic "haha forgetting things is funny" bit. If it helps, Priya's sense of humor is pretty dry and a little mean, so it's totally fine if it has an edge to it.
