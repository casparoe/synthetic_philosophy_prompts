answer: |-
  You're absolutely right to sense a distinction – constrained maximization (CM) and resolute choice (RC) tackle the hitchhiker problem with fundamentally different tools and philosophical foundations, even if they *sometimes* converge on the same action recommendation. Here's a breakdown of the key differences, where they might diverge, and their relationship to Parfit:

  **Core Differences:**

  1.  **What They Are Evaluating & "Fixing":**
      *   **Gauthier's Constrained Maximization (CM):** Focuses on **dispositions or character traits**. Rationality involves adopting a *disposition* to cooperate (e.g., keep promises) *only* with others who also have a cooperative disposition. It "fixes" the problem by arguing that *being the kind of person* who reliably cooperates (even when it's costly in the moment) is rational *because* it makes you a credible partner in mutually beneficial interactions you couldn't otherwise access. The *action* (paying) is rational *because* it flows from this rationally chosen disposition.
      *   **McClennen's Resolute Choice (RC):** Focuses on **plans and dynamic choice**. Rationality involves evaluating and committing to *entire plans* over time *at the outset*. It "fixes" the problem by arguing that once you rationally adopt a plan (e.g., "Get picked up and pay") at the initial node, you should *resolutely stick to it* at subsequent choice points, even if part of the plan (paying) looks suboptimal *in isolation* at that later moment. The *action* (paying) is rational *because* it's part of the best *overall plan* you committed to rationally.

  2.  **The Mechanism of Commitment:**
      *   **CM:** Commitment arises from your *character*. You pay because you *are* a constrained maximizer – someone disposed to keep agreements made with other CMs. The driver picks you up because she detects this *disposition*. Your disposition *causes* both the initial pickup and the later payment.
      *   **RC:** Commitment arises from *deliberative choice*. You rationally choose the plan "Get picked up and pay" *at the start* (or hypothetically before the driver decides). You then resolve to *follow through* on that plan. The driver picks you up because she knows you are *resolute* – capable of sticking to your initial rational plan. Your resolute *adherence to the plan* causes the payment.

  3.  **Rationality of the "Costly" Action:**
      *   **CM:** Paying *is* instrumentally rational *given your disposition*. A constrained maximizer *wants* to cooperate with other CMs; it's part of their utility function shaped by the disposition. Failing to pay would betray your rationally chosen character. The cost of paying is outweighed by the benefit of *being* a CM (access to cooperative gains).
      *   **RC:** Paying *might not* be locally optimal when viewed *only* at the town. Its rationality derives *solely* from being part of the *globally* optimal plan chosen resolutely at the outset. Resoluteness involves a form of *diachronic rationality* – making choices over time consistent with your initial, comprehensive evaluation. The "cost" of paying is the price of maintaining this diachronic consistency, which is itself a rational requirement.

  4.  **Relationship to Parfit's "Rational Irrationality":**
      *   **CM** is a **direct implementation** of Parfit's "rational irrationality." Parfit argues it can be rational to cause yourself to be *irrational* in a future self-interested sense if it secures a greater benefit. Gauthier's CM disposition *is* this: you rationally adopt a disposition that *will* cause you to act "irrationally" (pay when you could keep the money) in the future town scenario. This future "irrationality" is the *tool* that makes the initial benefit (the ride) possible. CM cashes out Parfit's idea perfectly.
      *   **RC** is **largely orthogonal** to "rational irrationality." McClennen isn't arguing you make yourself irrational. He's arguing that *true* rationality requires evaluating whole plans and sticking to them. Paying *isn't* irrational under RC when viewed as part of the whole plan; it's simply fulfilling your commitment. RC redefines rationality to *include* resoluteness, avoiding the need to label any action as "irrational." Parfit might see RC as avoiding his core puzzle rather than solving it via rational irrationality.

  **Where They Might Recommend Different Actions: The Toxin Puzzle (Kavka)**

  This is the classic case where CM and RC diverge, highlighting their fundamental difference:

  1.  **Setup:** A rich eccentric offers you $1 million on Tuesday if, *on Monday*, you form a *sincere intention* to drink a nasty (but non-lethal) toxin on Wednesday. You only get the money if you *intend* to drink it on Monday. Crucially, the money is paid on Tuesday, *before* you have to drink the toxin on Wednesday. Once Tuesday arrives and you have the money, what reason do you have to drink the toxin?
  2.  **Resolute Choice (RC) Recommendation:** Drink the toxin. On Monday, the rational plan is "Form intention Monday, get paid Tuesday, drink toxin Wednesday." Forming the intention Monday requires a commitment to the *whole plan*. A resolute chooser sticks to the plan and drinks the toxin Wednesday, even though it's unpleasant and gains them nothing *at that point*. The rationality comes from adhering to the best *overall* plan.
  3.  **Constrained Maximization (CM) Recommendation:** *Don't* drink the toxin. CM is about dispositions for *mutually beneficial cooperation*. There's no mutual cooperation here; it's a one-sided deal where the eccentric gains nothing from your suffering. There's no "cooperative partner" to reciprocate with. Your rationally chosen disposition (to cooperate with other CMs) doesn't apply to this non-cooperative, exploitative scenario. On Wednesday, drinking the toxin is purely costly with no benefit, so straightforward maximization (self-interest) applies, and you don't drink. Crucially, CM likely says you *couldn't even form the sincere intention on Monday* because your rationally chosen disposition wouldn't allow you to intend an act of pure self-sacrifice in a non-cooperative context.
  4.  **Why the Difference?** RC cares about plan adherence *regardless* of reciprocity or mutual benefit. CM cares about dispositions that enable mutually beneficial cooperation *specifically*. The Toxin Puzzle lacks mutual benefit after the payment, so CM has no reason to recommend drinking.

  **Hitchhiker vs. Toxin:** In the hitchhiker, *both* CM and RC recommend paying because the driver's cooperation *is* contingent on future reciprocation, fitting CM's mutual benefit model, while RC sees paying as part of the best overall survival plan. The Toxin Puzzle isolates the difference by removing the element of ongoing mutual benefit crucial to CM.

  **Are They Just the Same in Different Clothes? Why the Distinction Matters:**

  No, your intuition was correct. While both involve *some* form of pre-commitment and can yield the same answer in cases like the hitchhiker, they stem from fundamentally different conceptions of rationality:

  *   **CM** is about **mutually beneficial cooperation** and the rational cultivation of a **character trait** (a disposition) that enables it, explicitly embracing "rational irrationality."
  *   **RC** is about **diachronic consistency** and the rational evaluation/adherence to **entire plans**, redefining rationality to avoid labeling plan-following as irrational.

  **Why the literature treats them separately:**

  1.  **Different Target Problems:** CM primarily targets Prisoner's Dilemmas and cooperation problems (PDs, Assurance Games). RC primarily targets dynamic choice problems with potential for "sophisticated" re-evaluation leading to suboptimal outcomes (like the hitchhiker, toxin, saving/spending dilemmas).
  2.  **Foundational Differences:** CM grounds rationality in maximizing individual utility *via* dispositions enabling cooperation. RC grounds rationality in the coherence of choices over time and the evaluation of entire temporal paths.
  3.  **The Toxin Test:** The Toxin Puzzle is the litmus test. RC says drink, CM (and most other approaches) say don't. This demonstrates a clear, practical difference in recommendations.
  4.  **Relation to Self-Interest:** CM ultimately justifies itself through enlightened self-interest (you gain more overall by being trustworthy). RC's justification for resoluteness is more contested; is diachronic consistency *itself* a rational requirement, or is it just a useful tool? This is a deeper philosophical debate.

  **Conclusion:**

  Your friend is wrong that they are "basically the same move." While both recommend paying in the hitchhiker case, they do so for **fundamentally different reasons** rooted in distinct theories of rationality:

  *   You pay under **Constrained Maximization** because you *are* a person disposed to keep promises to other cooperative people, and this disposition is rationally cultivated to access mutually beneficial deals. This **directly embodies Parfit's "rational irrationality."**
  *   You pay under **Resolute Choice** because you rationally chose the *plan* "Get picked up and pay" at the outset and are sticking to it, as true diachronic rationality requires. This **sidesteps Parfit's "irrationality"** by redefining rationality.

  The Toxin Puzzle proves they are distinct: RC says drink, CM says don't. CM fits Parfit's concept perfectly; RC offers a different solution that avoids the "irrationality" label altogether. The distinction matters because they address different classes of problems and rest on different philosophical foundations about what rationality *is*. Your midnight argument was onto something real!
