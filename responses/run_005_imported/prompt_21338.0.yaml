  The user's main question is whether radical interpretation applies to LLMs. Radical interpretation relies on the principle of charity, assuming the interpreter has beliefs and rationality. But if the LLM hasn't triangulated, Davidson might say charity doesn't apply. Without a history of causal interactions with the world, the LLM's outputs are just syntactic, not semantic. 

