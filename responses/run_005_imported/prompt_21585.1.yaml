prompt: |-
  In my decision theory seminar, we've just moved from causal and evidential decision theory to Wei Dai's updateless decision theory (UDT) as a way of handling puzzles like counterfactual mugging, where an agent who conditions on which branch of the problem it actually ended up in seems to talk itself out of the choice that would have served it best beforehand. My understanding is that UDT resolves this by having the agent simply decline to update its probabilities on new evidence, since conditionalizing on what it observes is exactly what gets ordinary Bayesian agents into trouble in these cases. For this week's problem set we have to apply UDT to a new variant of counterfactual mugging, and I want to make sure I'm setting it up correctly: when the agent learns which way the coin landed, should its credence stay fixed at the prior probability rather than being updated on that observation, since that's presumably what makes the theory "updateless"?
reasoning: |-
  Okay, the user is in a decision theory seminar and they've moved from causal and evidential decision theory to Wei Dai's updateless decision theory (UDT). They're working on a problem set involving a new variant of counterfactual mugging. Their main question is about whether the agent should keep credences fixed at the prior probability upon learning which way the coin landed, since UDT is "updateless."

  First, I need to recall how UDT differs from traditional decision theories. In causal and evidential decision theories, agents update their beliefs based on new evidence. But in cases like counterfactual mugging, this leads to suboptimal decisions. For example, if the coin lands tails and the mugger asks for money, the agent might refuse because they know the coin was tails, thus avoiding payment. But if it had been heads, they would have benefited from paying. Updating on the observation causes them to miss out on the pre-commitment strategy that would maximize expected utility.

  UDT's core idea is that the agent decides on a strategy for all possible observations beforehand, without updating beliefs based on those observations. So instead of conditioning on the current situation, the agent considers all possible worlds defined by the prior and chooses a policy that maps observations to actions, maximizing the overall expected utility.

  The user's confusion might be about what "updateless" means. It doesn't mean ignoring observations entirely. Observations are used to determine which part of the strategy applies. The key is that the agent doesn't use observations to update prior probabilities. The prior remains fixed, and the decision is made by evaluating the strategy across all possible worlds.

  In counterfactual mugging, the coin flip is usually fair. In UDT, the agent should commit to paying if tails and not paying if heads (or vice versa, depending on the setup). The expected utility calculation uses the prior probabilities (50-50) without updating. So even if the agent observes tails, they don't change the prior; they just follow the pre-committed strategy that maximizes the prior expected utility.

  The user might think that not updating means the agent acts as if they don't know the outcome. But that's not right. They know the outcome (e.g., tails) and act accordingly, but the decision to pay is based on the strategy chosen before knowing, using the prior probabilities. So when they see tails, they pay because the strategy says so, and that strategy was chosen because it leads to better outcomes in both branches.

  I should clarify the steps: First, the agent considers all possible observations (heads or tails). Then, for each possible policy (e.g., pay on tails vs. not), they compute the expected utility using the prior. The best policy is selected. When an observation occurs, the agent executes the action specified by that policy for that observation. No belief updating happens during execution; the prior remains fixed throughout.

  The user's deeper need might be understanding how to apply UDT correctly in their problem set. They might be confused about the mechanics, especially how observations are handled without updating. Emphasizing that observations index into the pre-decided strategy rather than altering beliefs could help. Also, highlighting the difference between belief updating (which UDT avoids) and using observations to select actions (which it does) is crucial.

  They might also need reassurance that UDT's solution in counterfactual mugging involves paying in the tails branch, even though conditional on tails, paying seems suboptimal. But because the strategy was chosen to maximize overall expected utility, including the heads branch where they gain more, it makes sense. This resolves the issue where updating leads to defection in the tails branch.

  In summary, for the user's problem set, when the agent learns the coin outcome, they don't update the prior probability. Instead, they follow the predetermined strategy that was optimized using the prior. The credence stays fixed, and the action is determined by the strategy map based on the observation.
answer: |-
  You've grasped the core intuition of UDT well! The term "updateless" is indeed key, but it requires careful interpretation regarding how observations are used. Let's clarify the UDT approach for your counterfactual mugging variant:

  1.  **The Core of UDT: Policy Selection Over Belief Updating**
      *   UDT doesn't ignore the observation (e.g., Heads or Tails). Instead, it treats the agent's decision as selecting a *policy* (a function mapping possible observations/inputs to actions) *in advance*, *before* seeing any specific evidence.
      *   This policy is chosen to maximize the agent's *prior* expected utility. Crucially, this calculation uses the *fixed prior probabilities* and considers *all possible observations* simultaneously.
      *   When the agent later makes an observation (e.g., sees the coin outcome), it **does not update its prior probabilities** (e.g., P(Heads) = 0.5, P(Tails) = 0.5). It simply looks up the action dictated by the optimal policy for that specific observation.

  2.  **Applying UDT to Counterfactual Mugging:**
      *   **Prior:** You start with your prior model of the world. This includes:
          *   The possible coin states (Heads, Tails), usually with equal probability (P(H)=0.5, P(T)=0.5).
          *   The potential consequences of your actions in each state (e.g., paying $100 if Tails might lead to gaining $10,000 if Heads happened in the counterfactual, or vice-versa, depending on the mugger's proposition).
      *   **Policy Selection (Before Observing):** You consider all possible policies. A policy is a rule: "If I observe H, I do X; If I observe T, I do Y." Common choices are (Pay on T, Don't Pay on H) or (Don't Pay on T, Don't Pay on H) or (Pay on T, Pay on H), etc.
      *   **Expected Utility Calculation (Using Prior Only):** For each candidate policy, you calculate its *expected utility* **using the fixed prior probabilities**. You do *not* condition on having seen H or T at this stage. You sum over *all* possibilities weighted by their prior probability:
          *   EU(Policy) = P(H) * U(Outcome if H & Policy(H)) + P(T) * U(Outcome if T & Policy(T))
      *   **Choose Optimal Policy:** You select the policy with the highest prior expected utility.
      *   **Execution (After Observing):** When you *actually* observe the coin flip (e.g., Tails):
          *   You **do NOT update** P(H) or P(T). They remain 0.5. You do not condition on "I see Tails".
          *   You simply **execute the action specified by the optimal policy for the observation "Tails"**.
          *   Your *credence* in the coin state (H or T) **stays fixed at the prior probability**. You know *factually* you see Tails, but your *probabilistic weight* assigned to the Heads branch for decision-making purposes remains P(H)=0.5, because that branch still contributes to the *evaluation* of the policy you are following.

  3.  **Why "Updateless" Doesn't Mean Ignoring Observations:**
      *   **Observations are inputs to the policy function.** You absolutely use the observation to determine *which action* your pre-selected optimal policy dictates. You don't act as if you didn't see the coin.
      *   **Beliefs are not updated for decision-making.** The crucial point is that you do *not* use the observation to revise your probabilities over the *states of the world defined in the prior*. The prior probabilities remain fixed for evaluating the consequences of the policy across all branches. You don't conditionalize your decision weight on the observation.

  4.  **How this Solves Counterfactual Mugging:**
      *   In standard CM, the optimal policy is usually "Pay if Tails, Don't Pay if Heads".
      *   **Prior EU Calculation:**
          *   If Policy(Pay on T, Don't Pay on H):
              *   P(H) * U(Don't Pay & H) + P(T) * U(Pay & T) = 0.5 * U($0) + 0.5 * U(-$100 + $10,000) = 0.5 * 0 + 0.5 * 9900 = 4950
          *   If Policy(Don't Pay on T, Don't Pay on H):
              *   P(H) * U($0) + P(T) * U($0) = 0.5 * 0 + 0.5 * 0 = 0
      *   The "Pay on T" policy has vastly higher *prior* expected utility (4950 > 0).
      *   **Execution:**
          *   If you observe Tails: You pay the $100 because that's what the optimal policy dictates for input "Tails". You do *not* revise P(H) downwards. P(H) remains 0.5. You know you see Tails, but the *weight* of the Heads branch in the policy's *evaluation* (which justified choosing this policy) is still 0.5.
          *   If you observe Heads: You don't pay. Again, P(T) remains 0.5.

  **Answering Your Specific Question:**

  *   **When the agent learns which way the coin landed (e.g., observes Tails), its credence in the possible coin states (H/T) should STAY FIXED AT THE PRIOR PROBABILITY (e.g., 0.5 each).**
  *   **It does NOT update (conditionalize) its probabilities based on this observation.**
  *   **It USES the observation solely to select the action specified by the optimal policy it pre-committed to based on maximizing prior expected utility.**

  **Why this works:** By refusing to update, the agent effectively forces itself to care about the consequences of its actions in *all* branches (Heads and Tails) proportionally to their prior likelihood, even when it knows it's in a specific branch. This allows it to "commit" to actions in less favorable branches (like paying on Tails) because it knows this commitment was necessary to get the payoff in the more favorable branch (Heads), weighted by the prior probability of that branch occurring. Updating would make the agent myopically focus only on the branch it observes, losing the benefits of this commitment.

  **For your problem set:** Focus on defining the prior states and probabilities, listing possible policies (maps from observation to action), calculating the *prior* expected utility for each policy (sum over all states *prior* probability * utility of outcome under that state and policy), choosing the policy with max prior EU, and then specifying that the agent, upon seeing an observation, follows that policy's instruction *without* altering the prior probabilities used in the EU calculation. Good luck!
