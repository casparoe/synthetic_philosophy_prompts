  Been down a rabbit hole on Bradley's regress and the unity-of-the-proposition stuff for a piece I'm noodling on, and I think I've got the basic mechanics but not why its supposed to actually bite. Setup as I understand it: take "John loves Mary" -- if the relation loves is what glues John and Mary into one fact rather than two items just sitting next to each other, then loves itself needs to be related to John and to Mary, and each of those relating-relations needs relating to its terms too, forever. Two things I can't get past. First, why doesn't the obvious move -- just say relations are a different kind of entity that dont need connecting, because connecting is literally what they are -- stop the regress before it even starts? Second, I gather Bradley ran basically the same regress for a single thing having several different qualities, not just for two-place relations -- so is this really a problem about relations specifically, or a more general problem about how any subject and predicate become one fact instead of staying an unconnected pair? And give me your honest take: is the regress genuinely vicious, or is it one of those infinite-but-harmless ones, and what actually hangs on which it is?
