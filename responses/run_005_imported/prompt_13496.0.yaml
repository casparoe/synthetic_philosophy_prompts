answer: |-
  That's a fantastic question, cutting right to the heart of a major philosophical debate about the foundations of probabilism. Your intuition is spot-on: the **core critique** of the traditional Dutch Book Argument (DBA) is that it demonstrates *pragmatic* irrationality (imprudence in betting) but doesn't obviously establish *epistemic* irrationality (faultiness in belief representation itself). Exploitability seems like a fact about your wallet, not your mind's relation to truth.

  The "depragmatized" arguments you recall aim precisely to bridge this gap. The most influential approach is the **Accuracy-Domination Argument**, championed by philosophers like James Joyce. Here's how it works and why it's thought to address the pragmatic/epistemic gap:

  1.  **The Core Insight:** Instead of framing irrationality as vulnerability to financial loss, these arguments frame it as **inherent inaccuracy**. The fundamental epistemic goal is taken to be having *accurate* credences – credences that match the actual state of the world as closely as possible.

  2.  **Scoring Rules as Measures of Inaccuracy:** We need a way to measure how "far off" a set of credences is from the truth. This is done using a **scoring rule**. The most common example is the **Brier Score** (a proper scoring rule). For a single proposition `H` that turns out to be true (`H=1`) or false (`H=0`), the Brier Score for credence `c` is:
      *   `(1 - c)^2` if `H` is true (`H=1`)
      *   `(0 - c)^2` if `H` is false (`H=0`)
      The lower the score, the better (more accurate). For a whole set of credences over a partition of possibilities, you sum the scores for each proposition.

  3.  **Accuracy Domination:** The crucial mathematical result underpinning this argument is:
      > **Any incoherent set of credences is *accuracy-dominated* by some coherent set.**
      What does this mean?
      *   **Incoherent Credences (c):** Your credences violate the probability axioms (e.g., sum to >1 over a partition).
      *   **Accuracy-Dominated:** There exists some *coherent* set of credences (c*) such that, **no matter which possible world turns out to be the actual world, c* is at least as accurate as c, and in at least one possible world, c* is strictly more accurate than c.**
      *   In other words: **c* is guaranteed to be no less accurate than c, and potentially more accurate, regardless of the truth.**

  4.  **The Argument:**
      *   **Premise 1 (Epistemic Goal):** Epistemic rationality requires adopting credences that are as accurate as possible (i.e., minimize expected inaccuracy, or avoid *dominated* levels of inaccuracy).
      *   **Premise 2 (Mathematical Fact):** Incoherent credences are accuracy-dominated by some coherent set.
      *   **Conclusion:** Therefore, holding incoherent credences is epistemically irrational. Only coherent (probabilistically consistent) credences avoid being accuracy-dominated.

  **How This Addresses the Pragmatic/Epistemic Gap:**

  1.  **No Bookies, No Bets, No Money:** The argument makes no reference to bets, bookies, money, or practical decisions. The "domination" is purely in terms of *accuracy* – a property directly tied to the core epistemic goal of believing truly.
  2.  **Focus on Belief State:** The irrationality is located directly in the *representational properties* of the credence set itself. An incoherent set is inherently flawed *as a representation of uncertainty* because there's always a strictly better (more accurate) representation available, no matter how the world turns out.
  3.  **"Ought Implies Can" for Accuracy:** If your goal is accuracy, and holding credences `c` guarantees you could have done strictly better in terms of accuracy (by holding `c*`), regardless of the truth, then holding `c` is irrational *for that epistemic goal*. It's like choosing a navigation system guaranteed to give worse directions than another available system, no matter your destination.

  **Does It Truly Close the Gap or Just Move It?**

  This is where the philosophical debate continues. Critics argue the gap is moved, not fully closed:

  1.  **Why Accuracy? (The Telos Problem):** Why should accuracy be the *sole* or *primary* epistemic goal? Epistemologists care about justification, understanding, explanatory power, etc. Is reducing everything to minimizing a single inaccuracy score (like Brier) adequate? The argument assumes accuracy is paramount.
  2.  **Why *This* Measure of Accuracy? (The Scoring Rule Problem):** The domination result depends on the *specific properties* of the scoring rule used (like the Brier Score being *strictly proper*). Why should we measure inaccuracy *this* way?
      *   **Proponents' Response:** Characterization theorems exist. For example, it can be proven that *only* strictly proper scoring rules have the property that coherent credences *expect* themselves to be more accurate than any other set (a kind of internal consistency). This provides a justification for using proper scoring rules as the "right" way to measure accuracy for epistemic purposes.
  3.  **Is Avoidance of Dominance the Right Principle? (The Rationality Principle Problem):** Is it *always* irrational to choose an option (a credence set) that is dominated? In purely epistemic terms, if you *know* c* is better than c no matter what, then yes, choosing c seems perverse. But does this principle capture *all* aspects of epistemic rationality?
  4.  **"Guaranteed" vs. "Expected":** The DBA shows a *guaranteed* loss. Accuracy Domination shows that incoherent credences are *guaranteed* to be less accurate than *some* coherent alternative *in at least one world*, but they *might* accidentally be very accurate in the *actual* world. The irrationality is that you could have chosen a credence set (`c*`) that would have been *at least as good* no matter what happened, and *better* in some scenarios. You left guaranteed epistemic "wins" on the table.
  5.  **The Gap Moves Upstream:** Instead of the gap being between money-loss and epistemic failure, the gap is potentially between "accuracy as measured by a proper scoring rule" and a richer conception of epistemic rationality. However, proponents argue that accuracy *is* the fundamental epistemic virtue for degrees of belief, and proper scoring rules provide the uniquely justified way to measure it in this context.

  **Conclusion:**

  The Accuracy-Domination Argument represents a significant and powerful attempt to "depragmatize" the Dutch Book justification for probabilism. It successfully **shifts the justification away from pragmatic vulnerability (betting losses) and towards an inherent flaw in the representational accuracy of incoherent credences.** By tying irrationality directly to the failure to achieve the core epistemic goal of accuracy (as formally measured), it provides a much stronger *prima facie* case for epistemic irrationality.

  **Does it *completely* close the pragmatic/epistemic gap?** It significantly narrows it by grounding the argument in a core epistemic value (accuracy) rather than practical consequences. However, the gap arguably **moves** to the justification for:

  1.  Elevating accuracy (as the sole/main epistemic goal for credences).
  2.  Accepting the specific properties of proper scoring rules (like Brier) as the uniquely correct way to measure that accuracy for epistemic purposes.

  For many Bayesians and formal epistemologists, this shift successfully grounds probabilism in epistemic rationality. For others, the questions about the primacy of accuracy and the justification of the scoring rule remain legitimate philosophical challenges, though arguably more refined and focused on core epistemic concepts than the original pragmatic DBA.

  Your background in Bayesian astrophysics makes you acutely aware that the *pragmatic success* of coherent methods is overwhelming. The Accuracy-Domination argument tries to show that this pragmatic success stems from a deeper *epistemic virtue* inherent in coherence itself. Whether it fully succeeds depends on how deeply one questions the foundational epistemic commitments it relies upon.
