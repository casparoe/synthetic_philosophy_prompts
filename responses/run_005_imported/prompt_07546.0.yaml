   The criteria to rank (with brief definitions in this context):
    1. Calibration within groups: The predicted risk score corresponds to the actual observed risk within each group (e.g., for a given risk score, the same proportion of people in each group reoffend).
    2. Predictive parity: This is essentially the same as having equal positive predictive value (PPV) across groups. It means that among those predicted as high-risk, the same proportion actually reoffend in each group.
    3. Equalized odds (also known as conditional procedure accuracy equality): Equal false positive rates (FPR) and equal false negative rates (FNR) across groups.
    4. Equal opportunity: A weaker version of equalized odds that requires only equal false negative rates (FNR) across groups (i.e., the same chance of being mistakenly released for those who would reoffend).
    5. Statistical/demographic parity: The proportion of individuals classified as high-risk is the same across groups (i.e., same rate of being recommended for detention).
    6. Individual fairness: Similar individuals should receive similar predictions, regardless of group membership. This requires defining a similarity metric.
    7. Counterfactual fairness: The prediction for an individual would remain the same in a counterfactual world where their protected attribute (e.g., race) was changed.

