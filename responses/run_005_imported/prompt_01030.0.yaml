answer: |-
  You're absolutely correct—this is a well-known impossibility in algorithmic fairness. Your compliance lead is asking for three mathematically incompatible goals when baseline default rates differ across racial groups. Here's why:

  ### The Impossibility Theorem (Simplified)
  1. **Calibration Parity**: P(Default | Risk Score, Race=A) = P(Default | Risk Score, Race=B)  
     → *Risk scores are equally predictive for all groups.*  
  2. **Equal False Positive Rate (FPR)**: P(Approved | Should Be Denied, A) = P(Approved | Should Be Denied, B)  
     → *Equal chance of approving bad loans across groups.*  
  3. **Equal False Negative Rate (FNR)**: P(Denied | Should Be Approved, A) = P(Denied | Should Be Approved, B)  
     → *Equal chance of rejecting good loans across groups.*  

  **These can only hold simultaneously if the true prevalence of "should be approved" applicants is identical across groups.** If Group A has a higher baseline default rate than Group B, achieving all three becomes impossible.

  ---

  ### Why This Conflict Happens (With Example)
  Assume two groups:  
  - **Group A**: Baseline default rate = 15%  
  - **Group B**: Baseline default rate = 5%  

  To satisfy **calibration**, a score of 700 must imply the same default probability for both groups (say 10%).  

  Now, to enforce **equal FPR**:  
  - You must approve the same *proportion* of truly bad applicants in both groups.  
  - But with different baseline risks, the *number* of bad applicants differs.  

  To enforce **equal FNR**:  
  - You must reject the same *proportion* of truly good applicants in both groups.  

  **The contradiction**:  
  - Group A has more high-risk applicants. To achieve equal FNR, you’d need to approve *more* high-risk applicants from Group A (increasing defaults).  
  - But to achieve equal FPR, you’d need to approve *fewer* high-risk applicants from Group A (reducing approvals).  
  - Calibration forces scores to map to the same risk, leaving no room to adjust thresholds independently.

  ---

  ### What You *Can* Do Instead
  Since all three are impossible under unequal base rates, propose these alternatives:

  1. **Prioritize Calibration + One Error Metric**  
     - **Best Practice**: Enforce **calibration** (regulatory requirement) + **equal FDR** (False Discovery Rate: P(Default | Approved)).  
     - *Why*: This ensures risk assessment is unbiased (calibration) and approved loans have equal default rates across groups (FDR parity).

  2. **Balance Error Rates with Cost-Benefit Analysis**  
     - Set thresholds to equalize **weighted costs** (e.g., cost of false approval vs. false denial). Requires business input.

  3. **Bayesian Improved Thresholds**  
     - Adjust thresholds per group to equalize FNR *or* FPR, but this breaks calibration. Risky for compliance.

  4. **Transparent Trade-off Reporting**  
     - Quantify the fairness-accuracy trade-offs:  
       *"At current thresholds:  
       - Calibration holds (✓)  
       - FNR differs by ΔX%  
       - FPR differs by ΔY%  
       Equalizing FNR would increase defaults by $Z."*

  ---

  ### How to Explain This to Compliance
  1. **Cite Established Research**:  
     > *"This is a fundamental trade-off proven in fairness literature (Kleinberg et al. 2017, Chouldechova 2017). No model can satisfy all three without equal base rates."*  
     - Share this visual: [Fairness Trade-offs Diagram](https://fairmlbook.org/tradeoffs.jpg)

  2. **Regulatory Perspective**:  
     - U.S. ECOA/Reg B focuses on **disparate treatment** (calibration) and **disparate impact** (approval rates). Equal FPR/FNR isn’t required.

  3. **Risk-Based Suggestion**:  
     > *"We guarantee risk scores are equally predictive (calibration) and minimize disparate impact via FDR parity. This aligns with Fed SR 11-7 guidance on model risk management."*

  **Bottom Line**: You’re not missing a fix—this is mathematically impossible. Your role is to guide leadership toward *feasible* fairness definitions. Frame it as optimizing within constraints, not fixing a broken model.
