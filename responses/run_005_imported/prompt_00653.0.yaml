answer: |-
  Here's a breakdown of Hobbes's argument, unpacking the syntax, explaining his core idea, and addressing your specific questions about physics, "construction," and his stubbornness:

  **The Passage Dissected (Plain English):**

  1.  **"Of arts, some are demonstrable, others indemonstrable..."**
      *   *Translation:* Some fields of knowledge allow for absolute, logical proof (demonstrable), while others do not (indemonstrable).

  2.  **"...and demonstrable are those the construction of the subject whereof is in the power of the artist himself..."**
      *   *Translation:* A field is demonstrable **if and only if** the person studying it (the "artist" or scientist) has the power to **construct** or **create** the very thing they are studying.

  3.  **"...who, in his demonstration, does no more but deduce the consequences of his own operation."**
      *   *Translation:* When demonstrating truths in such a field, the scientist is simply logically working out the necessary consequences of the actions *they themselves performed* when they constructed the subject.

  4.  **"The reason whereof is this, that the science of every subject is derived from a precognition of the causes, generation, and construction of the same..."**
      *   *Translation:* This is because true scientific knowledge *must* start from knowing the **causes**, the **process of generation**, and the **method of construction** of the thing being studied.

  5.  **"...and consequently where the causes are known, there is place for demonstration, but not where the causes are to seek for."**
      *   *Translation:* Therefore, demonstration (absolute proof) is only possible where we know the causes/construction. If we have to *search* for the causes (because they aren't under our control), demonstration is impossible.

  6.  **"Geometry therefore is demonstrable, for the lines and figures from which we reason are drawn and described by ourselves..."**
      *   *Translation:* Geometry *is* demonstrable because **we physically draw the lines and figures** ourselves. We *construct* them (with compass, straightedge, motion). We control their generation.

  7.  **"...and civil philosophy is demonstrable, because we make the commonwealth ourselves."**
      *   *Translation:* Political philosophy (Hobbes's main game) *is* demonstrable because **humans create societies and governments** (the "commonwealth") through covenants and agreements. We control their construction.

  8.  **"But because of natural bodies we know not the construction, but seek it from the effects, there lies no demonstration of what the causes be we seek for, but only of what they may be."**
      *   *Translation:* However, regarding **natural objects** (physics, biology, etc.), **we do not know how they were constructed or generated by nature**. We can only observe their effects and *infer* possible causes. Therefore, we cannot *demonstrate* what their causes *actually are*, only what they *might* be (probable hypotheses).

  **Hobbes's Core Argument:**

  *   **True Science = Construction + Deduction:** Genuine scientific knowledge with absolute certainty (demonstration) is only possible for things **we humans build ourselves**.
  *   **Why? Control of Causes:** When we build something, we **know its causes perfectly** (they are our own actions). We have direct access to its generation and construction. Science then becomes the logical deduction of the necessary consequences of those actions.
  *   **Geometry as the Model:** Geometry is the perfect science because geometric objects (points, lines, circles) are literally *generated* by our motions (drawing, moving a compass). Their definitions *are* instructions for their construction. We know them *because* we make them.
  *   **Civil Philosophy as Analogous:** Humans create societies through deliberate agreements ("covenants"). The "commonwealth" (the state) is an artificial construct, like a geometric figure. Therefore, its principles can be deduced with geometric certainty from the definitions of human nature and the act of covenanting.
  *   **Physics is Excluded:** We did not create nature. We don't know the fundamental "construction" of matter or the universe. We observe effects (motion, collisions, light) and hypothesize about hidden causes (particles, forces). This can yield useful *probable* knowledge, but **never absolute demonstration**. Physics is fundamentally conjectural.

  **Addressing Your Specific Questions:**

  1.  **Why Geometry & Civil Philosophy Only?**
      *   They are the *only* major fields where Hobbes believes humans have **total creative control** over the fundamental subject matter. We *define* points and lines by drawing them. We *define* sovereignty and covenants by creating them socially. We are the "artists" in both cases.

  2.  **The Weight of "Construction":**
      *   **Absolutely.** For Hobbes, a strict materialist and nominalist, "construction" isn't metaphorical. It's literal, physical making.
      *   **Geometry:** Points are physical marks made by motion. Lines are the traces of moving points. Circles are generated by the rotation of a compass leg. Geometric truth *is* the consequence of these physical operations. Abstract Platonic forms don't exist.
      *   **Civil Philosophy:** The "commonwealth" is built by the physical actions and agreements of men. Sovereignty is constructed through a covenant, a real (though verbal/performative) act.
      *   **Physics:** We cannot "construct" an atom, gravity, or a star. We can only observe their effects and make models. The true "construction" (how nature *actually* built them) is hidden from us.

  3.  **The Link to His Bogus Circle-Squaring:**
      *   **This is precisely why Hobbes was unshakeable.** His entire philosophy of science rested on the idea that the person constructing the diagram *knows* the causes (their own actions) and therefore can deduce the consequences with certainty.
      *   If *he* constructed the diagram according to *his* understanding of the definitions and operations, and *he* deduced a consequence (e.g., the circle is squared), then **within his own system of construction**, it *must* be true. Any error, he believed, must lie in the critic's failure to understand *his* definitions or *his* operations, not in the inherent logic of his constructed system.
      *   Wallis, working with abstract algebra and limits (things Hobbes rejected as meaningless without physical construction), was speaking a different language. Hobbes saw Wallis's objections as irrelevant sophistry because they didn't engage with the *physical act of construction* that, for Hobbes, *was* geometry.
      *   **In short:** His stubbornness wasn't just pride; it was a defense of his entire epistemological foundation. Admitting Wallis was right about the circle would have meant admitting his core theory of knowledge – the bedrock of *Leviathan* – was flawed. His geometry *was* his politics.

  **Does the Argument Hold Up (On Its Own Terms & Beyond)?**

  *   **Internal Consistency (On Hobbes's Terms):** The argument is remarkably coherent *within Hobbes's rigid framework*. If you accept his premises:
      *   Knowledge requires knowing causes.
      *   We only truly know causes we control.
      *   We only control what we build.
      *   Therefore, only what we build is truly knowable (demonstrable).
      Geometry and Civil Philosophy fit; Physics does not. His stubbornness about his circle-squaring also follows logically *from this perspective*.

  *   **Problems and Critiques:**
      1.  **Physics' Success:** Hobbes drastically underestimated the power of the hypothetico-deductive method in physics. While we may not know the *ultimate* construction of nature, physics has achieved astonishingly precise, predictive, and empirically verified knowledge that *functions* with near-demonstrative certainty in many domains. Newtonian mechanics, relativity, quantum theory – these offer profound understanding Hobbes would have dismissed as mere conjecture.
      2.  **The Nature of Mathematics:** Modern mathematics largely operates with abstract concepts (sets, functions, groups) that are *not* tied to physical construction in Hobbes's sense. Yet, it achieves a level of deductive certainty he would envy. His insistence on physical construction as the *only* foundation for certainty is too restrictive. The certainty of math often lies in logical consistency within defined axiomatic systems, not physical making.
      3.  **The Ambiguity of "Construction" in Politics:** While humans *do* create political institutions, the "construction" of society is vastly more complex, emergent, and less consciously controlled than drawing a circle. Human nature, history, economics, culture – forces largely *not* under the direct control of the "artist" – profoundly shape political outcomes. Hobbes's analogy between geometric construction and political founding is powerful but potentially misleading about the level of control and certainty achievable.
      4.  **The Self-Defeating Nature:** If only what we build is knowable, how can we *know* anything about the natural world (including human bodies, which are natural objects) well enough to build a viable political science *based* on that knowledge? Hobbes relies heavily on a specific (contentious) view of human nature derived from observing natural bodies to build his political theory, seemingly violating his own rule.

  **For Your Readers:**

  Hobbes wasn't just being stubborn about math; he was defending the *entire basis* of his life's work. He believed geometry proved that absolute certainty was possible through human reason applied to things humans build. Politics, he argued, was just such a human construction. Therefore, *Leviathan* could be as certain as geometry. His failed attempt to square the circle wasn't a quirky hobby; it was a desperate attempt to prove the foundational principle of his political philosophy: **We can only have absolute knowledge of the world we make ourselves.** Physics, dealing with a world we didn't make, was forever condemned to guesswork. While brilliant and internally coherent, this view ultimately proved too narrow to capture the full scope of how humans achieve reliable knowledge, both in the natural world and even in the messy world of politics they try to build. His failure to square the circle became an ironic symbol of the limits of his own philosophical construction.
