  First, Sperry's experiments showed that severing the corpus callosum prevents communication between hemispheres. When information is presented to one hemisphere, the other doesn't know. For example, showing an image to the right visual field (left hemisphere) lets the patient name it, but if shown to the left visual field (right hemisphere), they can't name it but can point to it. That indicates independent processing.

