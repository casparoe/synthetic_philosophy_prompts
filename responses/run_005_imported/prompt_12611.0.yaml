  Reema is making a distinction between the indicative conditional (about what actually happened) and a counterfactual conditional (about what would have happened in a different scenario). This is a valid point. Owen's initial statement (1) only establishes that one of them did it, but it does not by itself establish a counterfactual about what Reema would have done if Owen hadn't done it. Therefore, Reema is correct to point out that these are two distinct claims.

