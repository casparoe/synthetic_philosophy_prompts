  5. **Owen (Score: -2)**:  
     Owen is clearly wrong. The indicative conditional *does* establish responsibility (one of them deleted it), which is crucial for assigning blame. Reema didn’t "lead with" this logic—she agreed with Owen’s own point (1). His argument confuses the utility of factual elimination with unrelated counterfactual speculation.
