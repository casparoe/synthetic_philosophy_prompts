  Move (1): Owen says: "Only the two of us were even connected when it disappeared, so if I didn't delete it, you did. That's just elimination."

  This is a case of disjunctive syllogism. Given that only two people had access and it must have been one of them, the logic is sound. Therefore, if Owen didn't do it, then Reema did. This is a valid indicative conditional in the context of what happened. However, note that Owen is stating a fact about the past event: one of them did it. This is correct based on the evidence. But we must note that the activity log doesn't show who did it, only that they were connected. However, since they ruled out a sync error and only two were connected, it is reasonable to conclude one of them did it. So, the indicative conditional is correctly formed.

