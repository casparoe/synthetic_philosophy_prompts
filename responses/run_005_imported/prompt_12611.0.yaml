  Move (5): Owen says: "Fine, but if the two claims can come apart like that, then your 'one of us must have done it' logic doesn't actually establish anything about who's really responsible, so you shouldn't have led with it."

  Owen is now attacking Reema's initial agreement with the indicative conditional (which she agreed to in move (2)). He is suggesting that because the indicative conditional (about what actually happened) and the counterfactual conditional (about what would have happened) are distinct, then the indicative conditional doesn't establish responsibility. But that is a non sequitur. The indicative conditional does establish that one of them did it, and that is crucial for determining responsibility for the actual event. The counterfactual is about a hypothetical scenario and doesn't change the actual event. Therefore, Owen is wrong in saying that the indicative conditional doesn't establish anything about responsibility. It establishes that one of them is responsible, even if we don't know which one. However, note that Reema didn't "lead with" the indicative conditional; it was Owen who started with it. Reema merely agreed with that part. So, Owen is misrepresenting Reema's position.

