answer: |-
  That's a fantastic question, cutting right to the heart of Kuhn's later work and its attempt to navigate a path between radical relativism and naive realism. Your geological context perfectly illustrates the stakes. Let's break it down:

  **1. How Kuhn's Taxonomic Machinery Escapes Davidson's Charge**

  Davidson's core argument ("On the Very Idea of a Conceptual Scheme") is devastating against *radical* conceptual relativism:

  *   **The Charge:** If two conceptual schemes are *wholly* incommensurable (totally untranslatable), we couldn't even *recognize* the alien system *as* a language or conceptual scheme. Recognition requires some common ground, some shared basis for interpretation. Total failure of translation implies we couldn't identify the alien noises as *meaningful* or *about* the world. Therefore, the very notion of a radically different, untranslatable scheme is incoherent.

  Kuhn's post-"Structure" model, centered on **local incommensurability governed by structured lexicons/taxonomies**, is designed *precisely* to avoid this charge:

  *   **Localization is Key:** Kuhn retreats from *global* to *local* incommensurability. He insists that untranslatability is confined to specific, tightly interdefined clusters of "kind terms" within a scientific lexicon. These clusters are the nodes where taxonomic structures differ.
  *   **Structured Lexicons & the No-Overlap Principle:** Kuhn posits that scientific communities operate with a mental lexicon structured like a taxonomy. Crucially, this taxonomy obeys a "**no-overlap principle**" (NOP): terms within a given contrast set (e.g., 'solid', 'liquid', 'gas') are mutually exclusive and jointly exhaustive for classifying objects within their domain. No object can simultaneously belong to two categories in the same set under normal conditions.
  *   **Translation Failure Mechanism:** During a revolution, the *taxonomic structure* itself changes. New kind terms are introduced, old ones are discarded or radically redefined, and crucially, the *boundaries* between kind terms shift, violating the NOP of the old lexicon.
      *   **Example:** In phlogiston theory, metals are a kind of *earth* (calcined metal = pure earth + phlogiston). In Lavoisier's chemistry, metals are *elements*. The kind term "earth" vanishes as a fundamental category, replaced by "element" and "compound." Attempting to translate "earth" into Lavoisier's terms is impossible without distortion because its referential scope, its contrast sets, and its theoretical role are fundamentally incompatible with the new taxonomy. The NOP is applied differently.
  *   **Preservation of Shared Ground:** Crucially, Kuhn emphasizes that *most* of the lexicon remains stable and translatable. Terms for instruments, basic observational entities (though their *significance* may change), mathematical structures, logical connectives, and vast swathes of non-taxonomic vocabulary are unaffected. *This shared ground is what allows scientists to recognize each other as talking about the same world, using language, and even identify points of disagreement/disagreement.*
  *   **Escaping Davidson:** By restricting untranslatability to localized taxonomic clusters *within* a largely shared linguistic and practical framework, Kuhn provides the necessary common ground Davidson demands. Scientists *can* recognize each other as participants in the same (or a related) scientific enterprise. They can point to shared phenomena, instruments, and mathematical results. They can even identify *where* the disagreement lies – "We agree on X, Y, Z, but we fundamentally disagree about how to classify *this* and what causes *that*, and our terms for these things don't map neatly." The failure is localized and intelligible *as* a failure *because* of the surrounding shared context. Davidson's charge applies to *wholesale* untranslatability; Kuhn's later model posits only *partial* and *localized* failures.

  **2. Assessment: Is Localized Incommensurability Strong Enough?**

  This is the critical question: Does this localized version retain enough force to explain why paradigm shifts involve genuine *rational incomparability* rather than just difficulty? My assessment is a qualified **yes, but with significant concessions and a shift in emphasis**:

  *   **Sufficient for Genuine Incomparability (in the core sense Kuhn needed):**
      *   **Rational Choice Impeded:** For the specific, taxonomically anchored claims central to the competing paradigms, direct comparison via a shared, neutral observation language *is* impossible. You cannot directly test "Phlogiston is released during combustion" against "Oxygen is absorbed during combustion" using a *single* set of kind terms that both sides accept as capturing the relevant entities and processes without begging the question. The kind terms presuppose their paradigm's ontology. Your geological experience is apt: arguing about "geosynclinal development" vs. "subduction zone processes" involves terms whose meanings and referents are tied to incompatible theoretical structures about the *fundamental nature* of crustal movement.
      *   **Loss of Shared Problems/Solutions:** Local taxonomic incommensurability means that problems solved in one paradigm may literally not exist in the other (e.g., "What carries phlogiston?"), and solutions offered in one may be incoherent or nonsensical in the other's lexicon. This disrupts the cumulative progress narrative.
      *   **Meaning Variance Persists:** The core Kuhnian insight – that the meaning of central theoretical terms is determined by their role within the holistic network of the paradigm – remains intact *for those specific, taxonomically crucial terms*. "Mass" in Newtonian mechanics *means* something different (absolute, conserved) than "mass" in Relativity (relative, convertible to energy) because of its different theoretical relationships and taxonomic placement. Direct comparison of statements using "mass" across paradigms is fraught.
  *   **Concessions and Weakening:**
      *   **From "World Change" to "World Re-segmentation":** The radical "living in different worlds" claim is significantly tempered. Kuhn now emphasizes scientists share a largely stable world *at the level of stimuli/perception*, but they *classify and interpret* significant portions of it using incompatible, locally incommensurable taxonomies. It's less about different realities, more about irreconcilable ways of carving up and explaining specific domains within a common reality.
      *   **Comparability Regained Elsewhere:** Vast areas of science *are* now comparable. Mathematical formalisms, instrumental techniques, data about phenomena *not* dependent on the contested taxonomy, and even lower-level empirical generalizations can be translated and compared. Rationality operates powerfully *within* these shared domains and in the *pragmatic* evaluation of the paradigms' overall problem-solving effectiveness.
      *   **Rationality of Transition is More Evident:** The localized model makes the *process* of paradigm shift more intelligible as a rational (though not purely logical) process. Scientists *can* communicate enough to understand the *gist* of the new proposal, identify anomalies it resolves within the *shared* context of empirical challenges, appreciate its internal coherence, and be persuaded by its future promise *despite* the local translation failures. The "conversion experience" becomes less mystical.
      *   **Difficulty vs. Incomparability Blurred:** The line between genuine incomparability due to meaning variance and mere extreme difficulty in comparing complex, context-dependent ideas becomes fuzzier. Critics might argue that with enough effort, historical sensitivity, and sophisticated philosophical tools, even the local incommensurabilities can be bridged sufficiently for rational assessment *post-hoc*, even if not perfectly during the heat of the revolution.

  **Conclusion:**

  Kuhn's localized incommensurability, grounded in taxonomic lexicons and the no-overlap principle, successfully dodges Davidson's charge of unintelligibility by providing the necessary shared linguistic and practical background. It remains **strong enough to fulfill Kuhn's core purpose:** explaining why paradigm shifts involve a **genuine rupture** in rational comparability *specifically concerning the central ontological commitments and explanatory principles* of the competing theories. It accounts for the experience of profound conceptual dislocation you witnessed during the plate tectonics revolution.

  However, it is a **more modest and nuanced thesis** than the global incommensurability suggested in "Structure." It concedes significant ground regarding the continuity of science, the translatability of much of the lexicon, and the potential for rational discourse *around* the points of incommensurability. It shifts the emphasis from "living in different worlds" to "classifying and explaining crucial parts of a shared world in fundamentally incompatible ways." Whether this is "still strong enough" depends on whether one sees the core Kuhnian challenge as the radical discontinuity of "worlds" or the more specific problem of meaning variance and rational choice impasse concerning the foundational concepts of rival paradigms. For explaining the latter – the genuine, rational *incomparability* at the heart of revolutionary change – it largely succeeds.
