prompt: |-
  So a few months ago I finally got diagnosed with ADHD at 33, after basically a lifetime of thinking I was just lazy and bad at adulting. Since then I've fallen into a whole research hole about why adult diagnosis rates have exploded the way they have (there's a lot of ADHD/autism content on TikTok that apparently plays into this too), and a friend who's doing a philosophy PhD in ethics, not phil of science, but she reads around mentioned that this is basically a textbook setup for what Ian Hacking called "looping effects" - classifying people changes them, which can feed back and change the classification, round and round. I looked it up and get the gist from the multiple personality disorder example he always uses, but that's from decades ago, and I honestly cant tell if it actually generalizes to something like ADHD or if I'm just pattern-matching because it's flattering to think my diagnosis is philosophically interesting.

  What would actually help is a real example - doesn't have to be ADHD, could be autism or whatever else is having a diagnostic "boom" right now - that would count as a genuine Hacking-style looping effect, laid out clearly enough that I could see the actual feedback loop happening (who's classifying, how the classified people respond, how that response changes the category). Then I want you to contrast it with a case that looks similar on the surface, i.e. rising numbers, changed public attitudes, but is really just better detection or reduced stigma and NOT a looping effect in his specific sense. Every pop-psych article I've read uses the phrase as if it just means "diagnoses are socially constructed," and that seems too loose based on the little I've actually read of his stuff, so I guess what I want is to understand what's doing the real work in his definition that would rule the lazy version out.
