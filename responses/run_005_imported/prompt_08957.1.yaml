prompt: |-
  I'm about a third of the way into a historical novel set at Oxford in 1956, and there's a scene I can't quite crack. It's built around the real fight over the university giving Truman an honorary degree that year — Elizabeth Anscombe tried to stop it, wrote that pamphlet (I think it was called "Mr. Truman's Degree"?) calling the Hiroshima and Nagasaki bombings straightforward murder, and then got heavily outvoted when it actually came to Congregation. I've got a character loosely modeled on her, different name but the same core convictions, and what im missing is a proper foil: a colleague who genuinely believes, after actually thinking it through, that the degree is deserved.

  Could you write the scene as a dialogue between the two of them, cornering each other in the Senior Common Room before the vote. I want her to make the real Anscombe argument and not some watered-down version of it — the distinction between intending a death and merely foreseeing it, why she thinks the choice of targets shows the civilian deaths were the means rather than a regrettable side effect, and why "but it saved more lives in the long run" strikes her as a corrupt way of thinking rather than a knockdown reply. And I want him to be an actual opponent, not somebody there to lose — give him the strongest version of a double-effect-style defense, or a necessity argument, or whatever position actually survives contact with her, and let him press back on the weak points in her case too. Neither one should win just because the other runs out of lines — I want them responding to what was actually just said, not delivering speeches that happen to alternate.

  Doesn't need to be more than a page or so, I mostly just want to see the shape of the argument on the page before I decide how to stage the whole chapter around it.
