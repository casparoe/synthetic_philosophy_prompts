  ### Technical Steering Committee Decision Memo  
  **Subject:** Standardization of Delimiter Escaping Conventions  
  **Date:** [Insert Date]  
  **Authors:** [Your Name/Committee Representative]  

  ---

  #### **1. Recommendation**  
  After thorough deliberation, the committee resolves to **mandate the doubled-delimiter convention** as the project-wide standard for escaping literal delimiters, effective in the next major release (v4.0). A migration timeline will enforce this transition, while introducing opt-in support for backslash escaping via explicit template declarations to ease adoption.  

  #### **2. Migration Timeline**  
  - **v3.3 (Next Minor Release):**  
    - Introduce a `strict_mode` flag (default: `off`) that throws errors when backslash escapes are detected.  
    - Add a template directive (e.g., `{!escape:backslash!}`) allowing authors to declare backslash usage per template.  
    - Deprecation warnings for backslash escapes in non-declared templates.  
  - **v4.0 (6 Months Post-v3.3):**  
    - **Mandate doubled delimiters** as the default standard.  
    - `strict_mode` enabled by default: backslash escapes without a directive throw errors.  
    - Backslash escaping remains usable *only* via explicit template directives.  
  - **v5.0 (18 Months Post-v4.0):**  
    - Remove backslash escaping support entirely, including directives.  

  ---

  #### **3. Rationale: Why Doubled Delimiters?**  
  The doubled-delimiter convention (`{{` → `{{{`) was selected for three objective reasons:  
  - **Security & Predictability:** Doubling avoids context-sensitive vulnerabilities (e.g., misinterpreting `\{{` in JSON vs. HTML). Backslashes require context-aware parsing, increasing exploit risk when plugins guess incorrectly.  
  - **Parser Simplicity:** Doubled delimiters simplify engine design. Backslash handling complicates tokenization (e.g., edge cases like `\\{{`).  
  - **Precedent:** Doubling aligns with conventions in widely adopted engines (e.g., Handlebars, Django), reducing cognitive load for new contributors.  

  ---

  #### **4. Reasons for Backslash Advocates to Accept**  
  We acknowledge this decision overrules established practices for many. However, it offers tangible benefits:  
  - **No Immediate Breakage:** Backslash users retain opt-in support via directives until v5.0 (≥2 years).  
  - **Eliminates Silent Failures:** `strict_mode` and explicit directives prevent ambiguous parsing, directly addressing security risks.  
  - **Ecosystem Alignment:** Adopting the doubled standard reduces friction for users integrating multiple plugins.  
  - **Tooling Support:** The committee will fund development of:  
    - Automated migration scripts (converting `\{{` → `{{{`).  
    - Linter rules to flag backslash usage during development.  

  ---

  #### **5. Candid Assessment: Can Top-Down Standardization Work?**  
  David Lewis’ insight is correct: conventions emerge from mutual expectation, not authority. The backslash/doubled split arose organically because:  
  - **Coordination Failed Early:** No clear standard existed 3 years ago, leaving plugin authors to solve locally.  
  - **Network Effects:** Once critical plugins adopted one convention, others followed to ensure interoperability within their "camp."  

  **However**, top-down intervention *is* justified here because:  
  - **Tragedy of the Commons:** Individual choices (to use either convention) now collectively harm ecosystem security.  
  - **Coordination Power:** The committee controls the engine’s "rails" (e.g., syntax flags, deprecation cycles). By constraining parser behavior, we reshape expectations.  
  - **Momentum:** A binding decision breaks the deadlock. Empirical studies (e.g., Python’s `unicode` transition) show timelines with opt-in phases succeed where "bless both" perpetuates chaos.  

  **Risks:** Backlash is likely if tooling is inadequate. We mitigate this by:  
  - Prioritizing migration tools in the v3.3 release.  
  - Hosting office hours for plugin maintainers.  

  ---

  #### **6. Next Steps**  
  - **v3.3 Development:** Implement `strict_mode`, directives, and migration tooling.  
  - **Outreach:** Share migration guides via blog/community calls, emphasizing security wins.  
  - **Metrics:** Track adoption of doubled delimiters and directive usage pre-v4.0.  

  This decision prioritizes long-term security over short-term convenience. By sunsetting backslash escaping gradually but decisively, we resolve ambiguity while respecting contributions from both camps.  

  ---  
  **Approved by:** Technical Steering Committee  
  **Vote:** 5–2 (Majority: Doubled delimiter + timeline)
