prompt: |-
  I sit on the technical steering committee for an open-source templating engine that a lot of backend frameworks depend on. Over three years, plugin authors have split into two roughly equal camps with incompatible, internally consistent conventions for escaping a literal delimiter inside a template — one camp uses a backslash, the other doubles the delimiter — and mixing them silently produces broken or exploitable output whenever a plugin guesses wrong. The committee is deadlocked between mandating one convention project-wide, blessing both indefinitely, or introducing a third scheme nobody currently uses. I once read that the philosopher David Lewis argued conventions are just self-perpetuating solutions to coordination problems, sustained by precedent and mutual expectation rather than by anyone's authority — which leaves me unsure whether a committee vote can "declare" a convention at all, or whether that's simply the wrong tool for what's going on here. Please draft the committee's decision memo, due before next week's steering call: a concrete recommendation with a migration timeline, reasons the losing camp could actually accept, and a candid take on whether top-down standardization can work given how these two conventions actually took hold.
reasoning: |-
  We are faced with a coordination problem. The two conventions (backslash-escaping and double-delimiter) are both entrenched and have equal support. Mandating one over the other by authority may not work because conventions are self-perpetuating and rely on mutual expectations. However, the current situation is causing security risks and broken output.

  We must choose an option that:
  1. Minimizes the risk of broken or exploitable output.
  2. Provides a clear migration path that both camps can accept.
  3. Acknowledges the reality of how conventions form.

  Options we have considered:
  - Mandate one convention project-wide.
  - Bless both conventions indefinitely.
  - Introduce a third scheme.

  Analysis:
  - Mandating one convention (say, backslash) might seem straightforward, but it would break all existing plugins in the other camp. It also ignores the fact that the convention is sustained by mutual expectations, not authority. Without broad buy-in, enforcement would be difficult and might lead to fragmentation.
  - Blessing both indefinitely perpetuates the problem because plugins that guess wrong will continue to produce broken output. This is not acceptable for security.
  - Introducing a third scheme (e.g., a new escaping mechanism) would require all plugin authors to change, but it might break less existing code in the short term and could be designed to avoid ambiguity.

  However, note that introducing a third scheme does not solve the problem of the two existing camps. It might even complicate matters further.

  Alternative approach: 
  We can try to resolve the ambiguity by making the escaping mechanism explicit in the template. For example, we could require that the template declare which escaping mechanism it uses (via a directive or a version marker). Then, the engine can enforce the correct escaping. This shifts the coordination problem from the plugin authors to the template authors, but it gives a clear way to avoid guessing.

  But note: This would require changes to the templating engine and to how templates are written. It would also require plugins to handle the new directive.

  Given the above, I propose:

  **Decision:**
  We will introduce a new, unambiguous escaping mechanism that is distinct from both existing conventions. However, we recognize that we cannot force an immediate change on existing templates. Therefore, we will:

  1. **Introduce a new standard for escaping:** We will design a new escaping mechanism that is not vulnerable to the same ambiguity. For example, we might use a unique control sequence (like `\u{...}` for a Unicode escape, or a completely new symbol) that is unlikely to appear in current templates. This new mechanism will be the only one supported in the next major version of the templating engine.

  2. **Phase out the old conventions:**
     - **Short-term (next minor version):** Introduce a way for templates to declare the escaping convention they use (via a header or a configuration setting). This declaration will be used by the engine to interpret the template correctly. We will also introduce the new escaping mechanism as an option in this version.
     - **Medium-term (next major version):** The old conventions (both backslash and double-delimiter) will be deprecated. The engine will require that every template either uses the new escaping mechanism or explicitly declares which of the old conventions it uses (via the header). If no declaration is present, the engine will throw an error (fail safe) instead of guessing.
     - **Long-term (subsequent major version):** Remove support for the old escaping conventions entirely. Only the new mechanism will be supported.

  3. **Migration timeline:**
     - **Version X.Y (next release):** 
       - Add support for a template header (e.g., `{-# ESCAPE_MECHANISM = "NEW" #-}`) that specifies the escaping mechanism. The options will be: `BACKSLASH`, `DOUBLE`, and `NEW`.
       - Implement the new escaping mechanism (to be designed and documented).
       - Emit a warning if a template does not specify an escaping mechanism and contains an ambiguous escape sequence.
     - **Version X+1.0 (next major release):**
       - Require that every template must declare an escaping mechanism (if it uses any of the old ones) or use the new one. If no declaration is present and an ambiguous escape is encountered, throw an error.
       - Mark the old mechanisms as deprecated.
     - **Version X+2.0:**
       - Remove support for `BACKSLASH` and `DOUBLE` escaping mechanisms. Only `NEW` is allowed.

  **Reasons for the losing camps to accept:**
  - To the backslash camp: The doubling camp is not being favored either. Both are being deprecated in favor of a new, safer standard. This is not a victory for one camp but a move to eliminate the ambiguity that causes security risks.
  - To the doubling camp: Similarly, we are not choosing backslash. We are introducing a new method that will prevent the silent failures that occur today. This approach is fair because it treats both existing conventions equally and addresses the root problem: the ambiguity when two conventions coexist.
  - Everyone benefits from a future without the risk of broken or exploitable output. The migration plan is gradual and gives ample time for adjustment.

  **Candid take on top-down standardization:**
  Top-down standardization by a committee can work, but only if it is accepted by the community. The two existing conventions took hold organically because they solved a local coordination problem (within a plugin or project) without a global standard. Our approach must respect that history while providing a clear path to a single standard.

  We are not merely declaring a convention; we are engineering a transition. The key is to make the new standard more attractive by:
  - Clearly documenting the security and reliability benefits.
  - Providing tools to automate the migration (e.g., converters for old templates).
  - Setting a long timeline so that the change is manageable.

  We acknowledge that without community buy-in, even the best standard will fail. Therefore, we will actively engage with the plugin authors and template writers during the transition, solicit feedback, and adjust the plan as needed.

  **Conclusion:**
  We choose to introduce a new escaping mechanism and deprecate the old ones over time. This decision prioritizes security and reliability while treating both existing camps fairly. We believe this is the most sustainable solution.

  ---

  **DRAFT DECISION MEMO**

  To: Technical Steering Committee
  From: [Your Name]
  Date: [Date]
  Subject: Decision on Template Escaping Convention

  **Background:**
  The project has two dominant conventions for escaping delimiters in templates: one using a backslash and the other by doubling the delimiter. These conventions are roughly equally adopted and are incompatible. When a plugin misidentifies the convention in use, it can lead to broken output or security vulnerabilities. The committee has been deadlocked on whether to mandate one convention, bless both, or introduce a third.

  **Decision:**
  After careful consideration, the committee has decided to introduce a new, unambiguous escaping mechanism and to deprecate both existing conventions over a multi-version migration plan. This approach addresses the root cause of the problem (ambiguity) and provides a clear path forward without favoring either existing camp.

  **Migration Timeline:**
  1. **Immediate (Version X.Y, next minor release):**
     - Introduce a template header directive to declare the escaping mechanism (e.g., `{-# ESCAPE_MECHANISM = [BACKSLASH|DOUBLE|NEW] #-}`).
     - Implement and document a new escaping mechanism (to be finalized by the working group).
     - The engine will continue to support the old conventions, but will issue warnings for templates without a declaration that contain ambiguous escape sequences.

  2. **Medium-term (Version X+1.0, next major release):**
     - Require that templates using the old conventions must declare the escaping mechanism via the header. Templates without a declaration that contain escapes will throw an error.
     - The old conventions (`BACKSLASH` and `DOUBLE`) are officially deprecated.
     - The new mechanism (`NEW`) becomes the recommended standard.

  3. **Long-term (Version X+2.0):**
     - Remove support for the old escaping conventions. Only the new mechanism is supported.

  **Rationale:**
  - **Security and Reliability:** The current ambiguity leads to silent failures that can be exploitable. This plan eliminates that ambiguity.
  - **Fairness:** Both existing camps are treated equally. Neither convention is chosen as the permanent standard; instead, we move to a new, better-designed one.
  - **Practicality:** The gradual migration allows time for the community to adapt. The header directive provides an immediate way to disambiguate existing templates.

  **Addressing Concerns:**
  We understand that this requires change from all parties. However, the alternative (continuing with the current ambiguity) is unacceptable due to the risks. The new mechanism will be designed to be as ergonomic as possible, and we will provide tools to help migrate templates.

  **Can Top-Down Standardization Work?**
  Conventions are indeed self-perpetuating and rely on mutual expectations. A committee cannot simply declare a convention and expect it to be followed. However, we can engineer a transition by:
  - Providing a clear, long-term plan that makes the new standard the obvious choice.
  - Engaging the community to build consensus.
  - Using the deprecation process to gradually shift expectations.

  This approach respects the organic growth of the project while steering it toward a safer and more maintainable future.

  **Next Steps:**
  The committee will form a working group to finalize the design of the new escaping mechanism and the header directive. We will also develop migration tools and documentation. A community outreach plan will be presented at the next meeting.

  Approved by: [Signatures]

