prompt: |-
  A friend and I spent most of a long dinner arguing about what has to be true for two people to be doing something together, in the full sense of "together," rather than each merely doing their own thing in a way that happens to mesh with what the other is doing. The case that started the disagreement was mundane: two coworkers divide a task so cleanly, and trust each other's competence so completely, that they barely discuss it at all, each one simply doing their part because it is obviously in their interest to do so, given that the other is doing theirs. I wanted to say that this does not yet amount to "acting together" in any interesting sense unless each person's plan is somehow answerable to the other's plan as such, so that something like a shared commitment is doing real work, over and above two private calculations that happen to converge. My friend, who has read far more early modern philosophy than I have, thought this was needless mystification, and cited a passage from Hume's Treatise that she claimed already delivers everything one could want from a theory of cooperation, without any appeal to "shared intention" or "joint commitment."

  The passage comes from Book 3, Part 2, Section 2 of the Treatise ("Of the origin of justice and property"; paragraph T 3.2.2.10 in the standard modern numbering), where Hume argues that a convention need not, and typically does not, involve any promise:

  "This convention is not of the nature of a promise: For even promises themselves, as we shall see afterwards, arise from human conventions. It is only a general sense of common interest; which sense all the members of the society express to one another, and which induces them to regulate their conduct by certain rules. I observe, that it will be for my interest to leave another in the possession of his goods, provided he will act in the same manner with regard to me. He is sensible of a like interest in the regulation of his conduct. When this common sense of interest is mutually express'd, and is known to both, it produces a suitable resolution and behaviour. And this may properly enough be call'd a convention or agreement betwixt us, tho' without the interposition of a promise; since the actions of each of us have a reference to those of the other, and are perform'd upon the supposition, that something is to be perform'd on the other part. Two men, who pull the oars of a boat, do it by an agreement or convention, tho' they have never given promises to each other."

  Hume goes on, later in the same passage, to say that language and money arise from conventions in exactly the same way, without anyone ever promising anything. Before I take this back to my friend, I would like help working out exactly what is doing the argumentative work here. When Hume says that each party's sense of common interest must be "mutually express'd, and known to both," is that mutual expressing-and-knowing meant to be a substantive extra ingredient, or is it just a description of the fact that each has formed accurate expectations about the other? And when he adds that the rowers' actions "have a reference to those of the other" and are performed "upon the supposition" that the other will reciprocate, has he not already helped himself to something very close to the interlocking, mutually responsive intentions that later writers on shared agency insist on, even while denying that anything as strong as an agreement in the fuller sense is present? I recall, from a seminar I once took, that philosophers such as Michael Bratman and Margaret Gilbert set a considerably higher bar for two people to count as genuinely acting jointly - something involving a standing commitment to support the other if the plan runs into difficulty - and I would find it useful to know whether Hume's rowers clear that bar, or whether they are really just two people rowing near each other for compatible reasons rather than two people rowing together.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a debate with a friend about what constitutes acting "together" versus merely doing individual actions that mesh. The example was coworkers dividing tasks efficiently without much discussion. The user argues that true joint action requires shared commitment, while their friend cites Hume's passage about conventions without promises.

  First, I need to understand Hume's argument. He uses the rowing example to show that mutual interest and expressed awareness lead to coordinated behavior without promises. The key phrases are "mutually express'd, and known to both" and actions based on supposition of the other's actions. The user wonders if this mutual expression is just accurate expectations or something more substantive.

  I recall Bratman and Gilbert's theories. Bratman emphasizes interlocking intentions and commitment to mutual support. Gilbert focuses on joint commitment creating obligations. The user wants to know if Hume's model meets these higher standards. 

  Looking at Hume's mutual expression: it's more than private expectations. Each person expresses their sense of interest, which builds common knowledge. This common knowledge allows each to rely on the other's actions. But Hume doesn't mention commitment to adjust or support when things go wrong. The rowers act on the supposition of reciprocity, but if one stops, the other might just stop too—no obligation to fix the issue.

  The coworkers example is similar. Their efficiency relies on trust in competence, but if a problem arises, do they feel obligated to help, or is it just self-interest? Hume's model works for smooth coordination but lacks the resilience from shared commitment. 

  The user's deeper need might be understanding the necessity of normative elements in joint action. They might be seeking arguments to counter their friend's Humean view. Also, they might want clarity on whether mutual expression in Hume implies a minimal shared agency or just coordinated individualism.

  I should compare Hume's mutual awareness with Bratman's interdependence. Hume's rowers have mutual responsiveness, but Bratman requires intentions directed at the joint activity itself. Hume's rowers intend personal goals that align, not necessarily a shared goal. Gilbert's joint commitment creates obligations, which Hume avoids by sticking to conventions based on interest.

  So, Hume's model is robust coordination but falls short of full shared agency as defined by contemporary philosophers. The user can argue that without commitments to mutual support, it's coordination, not true togetherness.
answer: |-
  Your analysis is sharp, and the tension you identify is central to the contemporary debate on shared agency. Hume's passage is remarkably prescient, but whether it delivers "everything one could want" depends on whether you prioritize *coordination* or *genuine jointness*. Let's break down Hume's argument and compare it to later theories:

  ### Key Elements of Hume's Account
  1.  **Common Interest:** Each individual recognizes a shared benefit achievable only through coordinated action (e.g., moving the boat efficiently, respecting property).
  2.  **Mutual Expression:** Each individual *expresses* their sense of this common interest to the other.
  3.  **Mutual Knowledge:** This expression results in each *knowing* the other has this sense of common interest and knows they themselves have it. This establishes a form of *common knowledge* (each knows, each knows the other knows, etc.).
  4.  **Supposition-Based Action:** Each individual performs their action *conditional* upon the expectation (the "supposition") that the other will perform theirs. Each action "has a reference to" the other's action – meaning one's action is chosen *because* and *on the condition that* the other performs theirs.
  5.  **Resolution & Behaviour:** This mutual knowledge and conditional intention produce a coordinated pattern of behaviour (the convention).
  6.  **No Promises/Explicit Agreements:** Crucially, this arises without promises, vows, or explicit agreements. It's a product of mutual recognition of interest and reciprocal expectations.

  ### Is Mutual Expression/Knowledge Substantive or Just Accurate Expectations?
  This is crucial. Hume **intends it to be substantive, not merely convergent private calculations.**

  *   **Accurate Expectations Alone Aren't Enough:** Two people might independently form convergent plans based on accurate predictions of the other's behavior, yet never interact or acknowledge each other's role. They row efficiently side-by-side purely based on prediction, not mutual acknowledgment. Hume explicitly rules this out.
  *   **The Work of "Mutually Express'd, and known to both":** This step transforms convergent private interests into an *interpersonal understanding*. Expression (verbal, gestural, contextual) makes the shared interest *public* and *acknowledged*. Mutual knowledge ensures each sees the other *as a partner* in this scheme, not just a predictable part of the environment. This creates a *shared cognitive framework* within which each acts: "I know *you* know *we* both benefit from this coordination, and you know *I* know it." This framework grounds the *conditional intention* ("I'll row *if* you row") and the *reference* of one action to the other.

  ### Does Hume Capture Interlocking Intentions?
  **Yes, partially, but arguably in a minimal sense.** He explicitly describes the *conditional structure* and *interdependence*:

  *   "**actions of each of us have a reference to those of the other**": This directly describes intentional interdependence. My intention to row *includes* the condition that you row. My action is responsive to yours (and vice versa) within the coordination scheme.
  *   "**perform'd upon the supposition, that something is to be perform'd on the other part**": This is the core of the conditional intention. My action is chosen *because* I expect yours.

  **Hume has captured a robust form of *mutually responsive conditional intentional action* based on common knowledge of shared interest.** This is significantly more than mere convergent action; it involves mutual recognition and responsiveness.

  ### Does Hume Clear the Bratman/Gilbert Bar? (Probably Not)
  Here's where Hume's minimalist account likely falls short of contemporary "shared agency" or "joint action" theories:

  1.  **Bratman's Shared Cooperative Activity (SCA):** Bratman requires:
      *   **Interlocking Intentions:** (Hume has this minimally: "I intend to row if you row").
      *   **Commitment to the Joint Activity:** Each intends *that we J* (e.g., *that we row the boat*), and their sub-plans mesh. Hume's rowers intend *to row* (conditional on the other rowing), but their intention seems focused on *their own action contributing to a desired outcome* (moving the boat) *given the other's action*. The intention isn't necessarily directed *at the joint activity itself as a shared goal* ("we are rowing together"). They might each have the private goal "move the boat by rowing while the other rows".
      *   **Commitment to Mutual Support:** This is key. Bratman requires each to be committed to *supporting the other* in playing their role if needed. If your oar gets stuck, I feel a *commitment* (based on our shared intention) to help you free it so *we* can continue. Hume's rowers, lacking this commitment, might simply stop rowing if the other falters ("My condition isn't met; I'm out"). Their coordination is stable only as long as it works smoothly. The "common sense of interest" might motivate restarting, but it's not a *commitment inherent to the joint activity itself*.
      *   **Minimal Cooperation:** Readiness to resolve minor conflicts about how to J. Hume's account lacks this normative element.

  2.  **Gilbert's Joint Commitment:** Gilbert sets an even higher bar:
      *   **Obligations & Entitlements:** Joint commitment creates mutual obligations and correlative entitlements. If we jointly commit to rowing together, you are *obligated* to row (to me) and I am *entitled* to expect you to row (and vice versa). I can rebuke you for slacking, not just because it harms me, but because you violated *our* commitment.
      *   **Pool of Wills:** Joint commitment involves creating a new entity – a "pool of wills" – dedicated to the joint goal. The commitment is to *each other as parties*.
      *   **Hume vs. Gilbert:** Hume's rowers feel no *obligation* to each other. They coordinate because it's *in their individual interest*, based on reciprocal expectations. If one stops, the other might be annoyed or disappointed, but they wouldn't feel *wronged* in the specific way Gilbert describes (violation of a joint commitment). They can simply recalculate their self-interest. The "common sense of interest" is a shared *motivation*, not a normative *bond*.

  ### Conclusion: Hume's Strength and Where He Might Fall Short

  *   **What Hume Captures Brilliantly:** He provides a powerful, non-mysterious account of stable, mutually beneficial *coordination* emerging spontaneously from rational self-interest, mutual recognition, and conditional action, *without* needing promises or explicit agreements. He definitively shows that complex social coordination (language, property, money, rowing) can arise from these minimal ingredients. He captures the *interlocking conditional intentional structure* essential for coordination.
  *   **Where He Might Fall Short of "Full Togetherness":** Hume likely does not capture the **robust jointness** characterized by:
      *   An intention directed *at the shared activity itself* ("we are doing this together").
      *   A *commitment to mutual support* inherent in the activity (Bratman).
      *   The creation of *mutual obligations and entitlements* between the participants (Gilbert).
      *   The *normative resilience* of the activity – partners feel bound to adjust, help, or persist *because* of the joint commitment, not just recalculated self-interest.

  **Applying to the Coworkers:** In your example, if they *only* trust each other's competence and do their part because it serves their individual goal (e.g., getting paid, avoiding blame) *given* the other's reliable action, this fits Hume perfectly. It's sophisticated coordination based on mutual expectation and self-interest. However, if they see themselves as *partners in a shared project*, feel a commitment to *helping each other succeed* if something goes wrong (beyond self-interest), and feel they *owe* it to each other to perform their part, *then* they cross into Bratman/Gilbert territory. Hume explains the smooth functioning; Bratman/Gilbert explain the sense of *being in it together* and the normative expectations that arise from that.

  **In short:** Hume gives you everything you need for *effective coordination*. He even gives you a minimal form of interlocking, mutually responsive intentions. But he likely doesn't deliver the *normative dimension* (commitments, obligations) or the explicit *collectivity* of intention ("we intend") that later theorists argue is constitutive of genuinely *shared agency* or acting *together* in the fullest sense. Your intuition that something more is needed for "acting together" aligns with this later work. You can acknowledge Hume's power in explaining coordination while arguing that truly acting *together* requires a richer, more normatively laden structure.
