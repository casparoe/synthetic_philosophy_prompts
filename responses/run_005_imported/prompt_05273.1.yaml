answer: |-
  Here’s a draft of the committee’s guidance, addressing all three requirements concisely and focusing on craft principles:

  ---

  **Craft & Conduct Committee Guidance: Session on Character Desirability Patterns**  
  *For Thursday, [Date]*

  ### 1. Concrete Recommendation for Thursday’s Session
  Facilitators will frame discussion around **narrative impact and reader engagement**, using this prompt:  
  *"Examine how the *recurring allocation of romantic desirability* across the author’s body of work influences character dimensionality, thematic cohesion, and potential reader disconnect. Focus on textual evidence: e.g., comparative narrative weight given to different character types, emotional arcs, and opportunities for complexity missed or utilized."*  
  **Goal:** Critique the *craft effect* of the pattern (e.g., predictability, unintended flatness in key roles), not personal preferences.

  ### 2. Standing Policy for Future Cases  
  When a *demonstrable pattern* (across ≥3 works or a series) potentially undermines narrative effectiveness through repetitive character treatment—such as consistent marginalization of specific groups in roles conveying desire, agency, or complexity—facilitators may address it as a **craft concern**. Criteria:  
  - **Observable**: Pattern must be evidenced textually (e.g., roles, POV allocation, emotional depth).  
  - **Impact-Driven**: Discussion must center on craft consequences (e.g., thematic limitation, reader resonance, character believability).  
  - **Non-Diagnostic**: Avoid speculation about authorial intent or psychology; analyze only the textual output.  

  ### 3. Response to the Dating-Preference Analogy  
  **Craft Distinction:** While personal attraction is not owed to anyone, *fiction is constructed*. Authors consciously choose which characters embody desire, complexity, and narrative importance. A repeated pattern across published works asserts a *narrative worldview*—not a private preference.  
  - **Key Difference**: Dating involves personal agency; fiction involves *curated representation*. Readers engage with the author’s crafted vision of human worth, not the author’s private life.  
  - **Craft Stakes**: When patterns systematically link desirability solely to dominant identities, it can flatten thematic exploration, reduce verisimilitude (as readers’ lived experiences diverge), and limit the work’s emotional range—all core craft issues. Critique focuses on *how the pattern serves or hinders the story*, not the author’s autonomy over personal attractions.  

  ---

  ### Why This Works
  - **Craft-Centric**: Grounds discussion in narrative technique (characterization, theme, reader response), avoiding politics/psychology.  
  - **Policy Clarity**: Sets objective thresholds for intervention, focusing on textual evidence and craft impact.  
  - **Analogy Addressed**: Distinguishes private choice from public narrative construction, showing why recurring patterns are a legitimate craft topic.  
  - **Solution-Oriented**: Encourages examining "what the pattern *does*" rather than "what the author *should* feel."  

  This approach honors workshop guidelines while upholding rigorous craft critique. The emphasis remains on *how choices function on the page*, not dictating content.
