answer: |-
  ## Dialogue: The Two Faces of Aquinas on Tyranny

  **Setting:** A coffee shop near the university after the seminar.

  **Characters:**
  *   **Dr. Eleanor Evans:** Argues for the "unity" reading using the distinction between tyranny of title and exercise.
  *   **Dr. Marcus Rossi:** Argues for a developmental shift, seeing *De Regimine* as Aquinas's hardened, considered position.

  **(The scholars sit with steaming mugs, seminar notes scattered.)**

  **Evans:** Marcus, I have to say, I found the professor’s framework today incredibly clarifying. The distinction between tyranny *ex defectu tituli* (of title) and tyranny *ex parte exercitii* (of exercise) isn't just a neat label; it’s the key Aquinas himself implicitly uses to navigate the *apparent* tension between the *Sentences* commentary and *De Regimine*.

  **Rossi:** Clarifying, perhaps, Eleanor, but I worry it papers over a genuine evolution in Aquinas’s thought, driven by the practical stakes of addressing a *king*. The *Sentences* commentary is youthful, almost off-the-cuff canon law. *De Regimine* is deliberate political theory for a ruler. The shift in caution isn’t accidental; it’s central.

  **Evans:** But look at the texts! In II *Sent.* d.44, q.2, a.2, he explicitly targets the usurper: "*ille qui absque titulo dominium occupat... non habet dominium, sed magis iniuriam facit*" – he who seizes dominion without title commits not dominion, but injury. He’s *not a ruler*, merely a private aggressor disguised as one. Resistance here is akin to self-defense against a brigand. That’s pure tyranny of *title*. *De Regimine* I.6 doesn’t contradict this; it addresses tyranny of *exercise* – the ruler who *has* legitimate title but abuses his power. Aquinas’s horror there is precisely that such a ruler *is* still the public authority, however corrupted. Killing him isn’t killing a brigand; it’s assassinating the *princeps*.

  **Rossi:** I grant he distinguishes the usurper conceptually in *De Regimine* too, calling him a tyrant "*qui non habet ius ad principatum*" (who has no right to rule). But the practical consequence is radically different! In the *Sentences*, the private person seems empowered to act against the usurper – even lethally, as removing a *private* threat. In *De Regimine*, even for the usurper, the emphasis shifts overwhelmingly towards *public* redress. Read I.6 carefully: "*non autem est ad privatas personas pertinere huiusmodi tyrannorum depositionem*" – it does not pertain to private persons to depose such tyrants. He immediately pivots to the community (*multitudo*) that established him or a superior authority. The *Sentences*'s implied private license vanishes.

  **Evans:** Does it vanish, or is it contextualized? In the *Sentences*, he’s parsing obedience *in foro conscientiae*. He’s answering whether one *sins* by disobeying an unjust command. Against a true usurper (no title), disobedience isn’t sinful *because there’s no authority to disobey*. Resistance is permissible defense. *De Regimine* focuses on the *political* danger and disorder inherent in *any* private act of deposition, even against a usurper. He’s not saying the usurper *is* legitimate; he’s saying private judgment is too perilous a tool. The *principle* from the *Sentences* (no authority exists) still holds, but the *practical remedy* is prudentially constrained in *De Regimine* to avoid greater evils – the chaos he explicitly fears from ambitious men using "tyrant" as a pretext.

  **Rossi:** That’s my point! The shift *is* in the practical remedy, grounded in a heightened awareness of political instability. But this isn't just prudential *application* of a stable principle; it reflects a maturing view of *authority itself*. In the *Sentences*, the usurper is so utterly illegitimate that he’s outside the political order entirely – hence the private person can act. In *De Regimine*, Aquinas seems to grant that even a usurper, by seizing power, creates a *de facto* situation demanding a *public* solution. The community itself, not random individuals, must act to restore order. This subtly elevates the importance of constituted public process, even against the worst offenders. The later text shows him grappling with the messy reality that removing *any* ruler, however illegitimate, risks plunging society into worse tyranny. His fear isn't just false pretexts; it's anarchy. This tempers the earlier, more abstractly legalistic permission.

  **Evans:** But Marcus, doesn't *De Regimine* itself implicitly rely on the *title/exercise* distinction to *make* that prudential argument? His warning about pretexts only makes sense if there *is* a difference between a true tyrant (whether by title or exercise) and a legitimate king falsely accused. He fears people will conflate tyrannical *exercise* with lack of *title*. His solution – public authority – is precisely how the community acts *against* the tyrant *ex defectu tituli* (it installed him, it can remove him) or appeals *against* the tyrant *ex parte exercitii* to a higher power. The distinction *enables* the later caution; it doesn't conflict with it. He’s consistent: Usurpers lack authority fundamentally; abusive rulers pervert it. Both are tyrants, but the nature of the illegitimacy dictates the *appropriate remedy* – with later emphasis on avoiding vigilantism.

  **Rossi:** Perhaps. But I see the weight shifting decisively *against* private action *in all cases* in *De Regimine*. The stark permission in the *Sentences* is muted. Even for the usurper, the focus is overwhelmingly on "*auctoritate publica*". He stresses the danger "*per multas mutationes*" (through many upheavals) caused by private killings. This isn't just refining a remedy; it's a profound wariness about individual judgment in the political sphere that feels more developed, more grounded in the potential for disaster, than the cleaner, more theoretical *Sentences* passage. The later Aquinas seems less confident that individuals can reliably discern or safely act upon the distinction we’re debating, hence the blanket channeling through public means. It’s a hardening born of political realism.

  **Evans:** So you see the distinction as theoretically present but practically sidelined by Aquinas’s later fears?

  **Rossi:** Essentially. The distinction exists, but in *De Regimine*, the *overriding* concern for order and public process subsumes it, making the earlier, more permissive stance on private action against usurpers functionally obsolete in his mature thought. The later text *is* the considered position.

  **Evans:** Whereas I see the distinction as the stable core *allowing* him to address both scenarios appropriately in their contexts – the confessional and the princely mirror. The caution in *De Regimine* is an application *within* the framework, not a repudiation of it. The usurper remains fundamentally *non-princeps*.

  **Rossi:** But the practical consequence for resistance is what matters politically, and there, Aquinas clearly tightens the reins. The later text shows the cost of his political education.

  **Evans:** Or perhaps just the necessary nuance applied to a different genre and audience. The core logic holds.

  **Rossi:** (Sips coffee, smiles wryly) Then it seems we, like our students, find ourselves precisely where Aquinas often leaves us: with principles requiring careful discernment, context, and an awareness of the profound dangers on all sides. The tension, perhaps, is the point.

  **Evans:** (Nods) Indeed. And that’s why we keep reading him. Another coffee while we ponder the abyss?

  **(Both scholars gesture for the waiter, the unresolved debate hanging comfortably in the air between them.)**
