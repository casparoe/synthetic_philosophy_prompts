answer: |-
  Let's break this down step by step, addressing both your requests. I'll use plain language and avoid jargon where possible.

  ### Part 1: How Thornley's Policy Blocks the Money Pump
  First, recall the setup:
  - You have three options: **A** (e.g., a $100 bill), **A-** (a slightly damaged $100 bill, worth less), and **B** (something incomparable, like a rare book).
  - You strictly prefer **A** to **A-** (since A- is objectively worse).
  - But you have a "preferential gap" between **A** and **B**, and between **A-** and **B**—meaning you don't prefer either over the other, nor are you indifferent. It's like comparing apples and oranges.

  The money pump (Ruth Chang's version) works like this:
  1. **Step 1:** You start with **A**. I offer to trade **A** for **B**. Since you don't strictly prefer **A** to **B** (due to the gap), you *might* accept. Now you have **B**.
  2. **Step 2:** I offer to trade **B** for **A-**. Since you don't strictly prefer **B** to **A-** (another gap), you *might* accept. Now you have **A-**.  
     → Result: You started with **A** and ended with strictly worse **A-**. You got "pumped."

  **Thornley's policy:**  
  *"Never choose an option at a later step that you strictly disprefer to something you turned down earlier."*  

  **How it blocks the pump:**  
  - **At Step 1:** You have **A** and are offered **B**. The policy doesn't apply yet (no "earlier" choice). Due to the gap, you might trade **A** for **B**—that's allowed.  
  - **At Step 2:** You have **B** and are offered **A-**. Here, the policy kicks in:  
    - Earlier (at Step 1), you **turned down keeping A** (because you traded it away).  
    - You **strictly prefer A to A-** (by assumption).  
    - Therefore, **A-** is strictly worse than **A**, which you turned down earlier.  
    → The policy *forbids* choosing **A-**. You keep **B** instead.  
  - **Outcome:** You avoid ending up with **A-**. The pump fails.  

  **Why this doesn't violate your preferences:**  
  - The policy only uses strict preferences you *already hold* (e.g., **A > A-**).  
  - It doesn't force you to "fill the gap" between **A**/**B** or **A-**/**B**. You never have to compare them directly.  
  - It only blocks choices that would make you strictly worse off *relative to a past decision*.  

  **Simple analogy for a friend:**  
  Imagine you’re at a buffet. You see cake (A) and salad (B)—you can’t decide which you prefer (gap). You take salad (B). Later, I offer you stale cake (A-). Thornley’s rule says: "If you passed up fresh cake earlier, don’t take stale cake now—it’s worse than what you refused." You keep the salad. No harm done.  

  ---

  ### Part 2: Behavioral Indistinguishability and Its Implications  
  The key objection (from Steiner/Bushnaq):  
  > *An agent using Thornley’s policy behaves identically to one with complete preferences. The "incompleteness" is just internal bookkeeping.*

  #### Is this objection correct?  
  **Yes, behaviorally.** In any real-world test:  
  - The policy forces choices that align with a *complete, transitive preference ordering*.  
  - Example: In the money pump, you acted *as if* you preferred **B** over **A-** (since you kept **B**), even though you only have a gap.  
  - Over many decisions, your behavior would look indistinguishable from an agent with a utility function where **A > A-**, and **B** is somewhere between them.  

  **But the "incompleteness" isn't illusory:**  
  - Internally, you still lack preferences between **A**/**B** or **A-**/**B**.  
  - The policy only *constrains* choices to avoid exploitation—it doesn’t create new preferences.  
  - In one-off choices (no memory of past decisions), you might still express gaps (e.g., flipping a coin between **A** and **B**).  

  #### Does this rescue the coherence argument?  
  **Not really—it undermines the argument’s foundation.**  
  - **Original claim (Yudkowsky):** Rationality *requires* complete preferences to avoid money pumps.  
  - **Thornley’s rebuttal:** You can avoid pumps *without* completeness via memory + policy.  
  - **Behavioral indistinguishability shows:**  
    - The *practical threat* (exploitability) is neutralized either way.  
    - But completeness isn’t *necessary* for rationality—it’s just one way to achieve pump-proof behavior.  
  - **Crucially:** The coherence argument conflates *behavior* with *internal structure*. Thornley’s agent is rational (avoids pumps) but lacks the internal utility function the argument claims is mandatory.  

  #### Implications for shutdownable AI  
  Thornley’s goal: Use preferential gaps to create an AI that:  
  - Doesn’t resist shutdown (no preference for survival over shutdown).  
  - Isn’t exploitable via money pumps.  

  **Does behavioral indistinguishability threaten this?**  
  - **No.** Shutdownability hinges on the *internal gap*, not behavior:  
    - With a gap between "shutdown" and "keep running," the AI has *no motive* to resist shutdown.  
    - Thornley’s policy won’t force it to avoid shutdown (since shutdown isn’t strictly dispreferred to past choices).  
  - **Example:** If offered "shutdown" vs. "keep running," the AI might randomly pick one (due to the gap). If it picks "keep running," then later offered shutdown again:  
    - Policy check: Did I turn down something strictly *better* than shutdown earlier? No—only turned down shutdown itself (which isn’t strictly better/worse).  
    → It can shut down freely.  
  - **But:** If the AI is *behaviorally identical* to an agent with complete preferences, does that mean it "secretly" has a preference?  
    - **No.** The shutdown-relevant gap remains internally. Externally, it might *look* indifferent (e.g., shuts down 50% of the time), but:  
      - We can program it to shut down *only* when commanded (exploiting the gap).  
      - Unlike true indifference, it won’t pay to shut down or avoid it—it just complies when asked.  

  **The bottom line:**  
  - The dispute isn’t just terminological—it reveals a flaw in the coherence argument’s reasoning. Completeness isn’t necessary for pump-proofness; memory-based policies can do the same work.  
  - For shutdownable AI, Thornley’s approach holds: Preferential gaps (+ policy) allow shutdownability without exploitability. The AI’s behavior might *resemble* indifference, but its internal lack of preference is what enables reliable shutdown.  
  - **Real teeth?** Yes. If Yudkowsky’s coherence argument holds, shutdownability via gaps is impossible (since agents must have complete preferences). Thornley shows it’s possible—making this a substantive disagreement with practical stakes.  

  If you want to dive deeper into edge cases (e.g., policy interactions with complex decision trees), I’m happy to elaborate!
