answer: |-
  That friend is technically correct about the lack of a *legal* contract, but he's ethically and socially wrong. His excuse ignores the fundamental social contract and reasonable expectations built within a friendship group over months of planning. Here's why it feels wrong and what's actually flawed about his reasoning:

  1.  **Repeated Verbal Commitment is Socially Binding:** Saying "I'm in" multiple times over six months, especially when actively participating in planning (picking flights!), creates a clear social commitment. Friends rely on each other's word. He wasn't just "being agreeable," he was actively participating in creating shared plans everyone invested time and emotion in.
  2.  **Active Participation Creates Expectation:** He didn't just passively nod along. He was *in the group chat*, *discussing flights*, and implicitly accepted the Airbnb deposit paid *for the group*. His participation signaled genuine involvement and led others to reasonably believe he was committed. Backing out now makes it seem like he was just playing along without serious intent.
  3.  **The "No Signed Paper" Argument is a Dodge:** This is a cop-out used to avoid responsibility for letting down friends. Contracts are for strangers or high-stakes business deals. Among friends planning a trip, the commitment is based on mutual trust, repeated verbal agreement, and shared effort – not a signature. Hiding behind the lack of paperwork is disingenuous and disrespectful to the effort everyone else put in.
  4.  **Financial Impact (Even if Indirect):** While the Airbnb deposit might be refundable (hopefully!), your friend who paid it took a financial risk *based on the group's commitment*, including his. His backing out potentially increases the cost per person for accommodation (if the deposit is lost or the total cost is now split 3 ways instead of 4) and makes the financial burden on the payer more acute. Even if the deposit is recovered, she was temporarily out that money *based on his implied commitment*. Now, flight prices might also be higher last minute, impacting the rest of you.
  5.  **Impact on Group Dynamics and Plans:** His withdrawal forces the rest of you to scramble: re-calculate budgets, potentially find a new roommate for the Airbnb, and adjust group plans. It disrupts the trip you've all been envisioning for half a year.
  6.  **Prioritizing Personal Gain:** He's choosing a paid work trip over a significant commitment made to friends. While understandable professionally, the *way* he's doing it – last minute with a flimsy excuse – shows a lack of regard for the impact on his friends and the effort invested. He could have handled it better (see below).

  **What He Did Wrong:**

  *   **Broke a clear social commitment:** He gave his word repeatedly and actively participated.
  *   **Failed to consider the impact:** He disregarded the financial, logistical, and emotional impact his withdrawal has on the group.
  *   **Used a dishonest excuse:** Claiming he "never meant it as a big commitment" after months of active planning and saying "I'm in" is gaslighting. It rewrites history to avoid blame.
  *   **Lacked accountability:** Hiding behind "no signature" instead of acknowledging he let his friends down and apologizing sincerely.

  **What He *Should* Have Done:**

  1.  **Communicated Immediately:** As soon as the work trip became a possibility, he should have raised it in the group chat: "Guys, something major just came up. I've been offered a paid work trip the exact same week. I know I committed to Japan, and this puts me in a terrible spot. I need to look into it urgently and will get back to you ASAP."
  2.  **Explained the Conflict:** Been honest about the opportunity and the conflict it presented.
  3.  **Apologized Sincerely:** Acknowledged that backing out sucks, he knows he committed, and he's genuinely sorry for messing up the plans and letting everyone down.
  4.  **Offered to Mitigate:** Offered to help find a replacement, offered to contribute *something* towards the Airbnb deposit if it becomes non-refundable due to his withdrawal, or at least expressed a strong desire to minimize the fallout.
  5.  **Taken Responsibility:** Owned that this was *his* choice causing a problem, not hidden behind technicalities.

  **In Conclusion:**

  Yes, your friend did something wrong. He violated the reasonable expectations and social contract of friendship and group planning. While he might avoid *legal* liability, he has absolutely damaged trust within the group and acted inconsiderately. His "no signature" argument is weak, self-serving, and demonstrates a lack of respect for the commitment he repeatedly made and the effort his friends invested based on that commitment. It's understandable to feel frustrated and let down – those feelings are valid because his actions *were* socially and ethically wrong.
