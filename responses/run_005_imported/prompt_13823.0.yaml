  We are comparing six proposals for blocking Bradley's regress in the unity of the proposition. The regress arises when we ask what binds the constituents of a proposition (e.g., a particular and a property) together. If we posit a relation (a "tie") to bind them, then we must ask what binds that tie to the constituents, leading to an infinite regress.

  The six proposals and a brief summary:

  1. **Frege**: Concepts (predicates) are unsaturated, meaning they have a kind of incompleteness that requires completion by an object. This avoids the need for a further relation to bind them.

  2. **Russell** (multiple-relation theory): Judgment is a multiple-term relation between a subject and the several objects of the judgment. There is no single proposition as an entity; the unity comes from the act of judging.

  3. **Tractatus** (Wittgenstein): A proposition is a fact (a configuration of objects) and its logical form is shown by the arrangement of the signs. We cannot say what binds the constituents because that would require a further fact, but the form is shown by the very arrangement.

  4. **Armstrong**: States of affairs involve a primitive, non-mereological mode of composition (a "non-relational tie"). This is a fundamental combinatorial principle that does not require further relations.

  5. **Jeffrey King** (deflationary view): Propositions just are facts, so their unity is the same as the unity of any fact. The regress is blocked because facts are already unified.

  6. **Hanks and Soames** (act-based theory): Unity comes from the cognitive act of predication. The act of predicating a property of an object unifies the proposition, so no further static tie is needed.

