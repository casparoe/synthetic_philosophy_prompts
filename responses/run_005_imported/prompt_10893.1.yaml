answer: |-
  You've hit on a fascinating philosophical tension! Elizabeth Anscombe's argument against Truman's honorary degree *does* involve casualty estimates, but **her core ethical argument is fundamentally different from utilitarianism**. It's not *just* a dispute over numbers; it's a clash of ethical frameworks. Here's why her take is distinct and significant:

  1.  **The Core Ethical Argument: Intrinsic Wrongness, Not Net Outcome:**
      *   **Utilitarianism (Pro-Bomb View):** Focuses *solely* on the *net outcome* – minimizing total deaths/suffering. If bombing Hiroshima/Nagasaki saved *more* lives (by avoiding invasion) than it cost, then it was the morally right choice, regardless of the *means* used. The ends justify the means.
      *   **Anscombe's Deontological View:** Argues that certain *types of actions* are intrinsically wrong and forbidden *regardless of their consequences*. Deliberately targeting and killing non-combatant civilians (innocent men, women, and children) is one such action. It is murder, a violation of the absolute prohibition against killing the innocent. The ends *do not* justify intrinsically evil means.

  2.  **Casualty Estimates Play a Different Role:**
      *   **For Utilitarians:** The casualty estimates *are the primary moral calculus*. The entire moral judgment hinges on whether the bombings caused fewer deaths than the invasion *would* have caused. The dispute is purely quantitative.
      *   **For Anscombe:** The casualty estimates are largely **irrelevant to the core moral principle**. Even if the bombings *had* saved a million more lives than an invasion (which she disputed), they would *still* be morally wrong because they involved the deliberate mass killing of innocents. Her use of casualty estimates served two secondary purposes:
          *   **Challenging the Utilitarian Premise:** She argued the utilitarian calculation itself was flawed and based on faulty assumptions (e.g., questioning the necessity of invasion, the projected invasion casualties, the possibility of alternatives like blockade or demonstration). She aimed to show that *even on their own terms*, the pro-bomb argument failed.
          *   **Highlighting the Absurdity:** She used the numbers to expose the horrific scale of the act being justified – demonstrating the sheer magnitude of innocent lives being sacrificed *for* a utilitarian calculation. This wasn't the core argument, but a rhetorical device to shock and challenge complacency.

  3.  **The Principle of Double Effect:**
      Anscombe, drawing on Catholic moral theology and Just War Theory (especially Aquinas), relied heavily on the **Principle of Double Effect (PDE)**. PDE allows that an action with both good and bad effects might be permissible *if*:
      *   The act itself is good or neutral.
      *   The good effect is intended; the bad effect is merely foreseen but *not intended*.
      *   The good effect is not achieved *by means of* the bad effect.
      *   There is a proportionately grave reason for permitting the bad effect.
      *   **Her Critique:** She argued the atomic bombings *failed* PDE. The act of dropping a bomb on a city *was not neutral*; it was the deliberate destruction of a civilian center. The massive civilian deaths *were not merely foreseen side effects*; they were the *intended means* to achieve the good effect (Japanese surrender/ending the war). The good effect *was* achieved *by means of* the mass killing of innocents. Therefore, the action was intrinsically evil.

  4.  **The Target: Honoring Truman, Not Just Debating the Decision:**
      Her pamphlet, "Mr. Truman's Degree," wasn't primarily a historical analysis of the decision itself. It was a scathing critique of *Oxford University*. Her core argument was that by granting an honorary degree to Truman, Oxford was **publicly condoning and honoring actions that were mass murder.** She argued this betrayed the university's responsibility to uphold fundamental moral principles. The ethical failure wasn't just Truman's (though it was), but Oxford's for celebrating him.

  **Why it's Famous and Different:**

  1.  **Challenging Orthodoxy:** In 1956, the narrative that the bombs ended the war and saved lives was dominant and largely unquestioned in the public sphere (especially in the West). Anscombe's *public, principled, and uncompromising* condemnation, based on absolute moral prohibitions, was a stark challenge to this orthodoxy.
  2.  **Clarity of Principle:** She forcefully articulated a non-consequentialist, deontological position in a context dominated by utilitarian pragmatism. She refused to let the "greater good" argument override the fundamental prohibition against murdering the innocent.
  3.  **Focus on Intention and Act:** She shifted the debate away *from* pure consequence-counting *towards* the nature of the act itself and the intention behind it. Was this mass killing of civilians a legitimate act of war, or was it murder?
  4.  **Application of Traditional Ethics:** She rigorously applied classical Just War principles (particularly discrimination/non-combatant immunity and double effect) to a modern, horrific weapon, demonstrating their continued relevance.
  5.  **Moral Courage:** It was a highly unpopular stance at the time. Standing against honoring a wartime Allied leader took significant courage.

  **In Summary:**

  You're right that Anscombe *engaged* with the utilitarian calculus by challenging the casualty estimates. **However, her fundamental argument was that the utilitarian calculus itself was morally bankrupt *in this case* because it justified an intrinsically evil act – the deliberate mass killing of innocent civilians.** She wasn't just plugging different numbers into the same equation; she was arguing that the *equation itself* was invalid for determining the morality of *this specific type of action*. Her fame stems from this clear, principled, and courageous rejection of consequentialism when it conflicts with absolute moral prohibitions, and her challenge to institutions to uphold those principles. The dispute over numbers was secondary to this core ethical clash.
