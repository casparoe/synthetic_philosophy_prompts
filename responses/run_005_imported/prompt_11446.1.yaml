prompt: |-
  I serve on the judging panel for a small literary press's annual short-fiction prize, whose guidelines restrict entry to "human-authored" work and exclude "writing generated by artificial intelligence," without saying anything more precise than that. The strongest submission this year was drafted longhand by its author and then revised sentence by sentence with the help of a large language model: she fed the model each paragraph in turn, asked it to suggest tighter or more vivid phrasings, and incorporated many of its suggestions nearly verbatim, though the plot, characters, and narrative voice are unmistakably her own invention. Two of the judges want to disqualify the story on the grounds that a workable rule needs a bright line and any model involvement at the sentence level crosses it; two others want to admit it, since the conception and structure of the story are entirely human and no one would object to a human copy-editor doing the same work. A fifth judge has raised a harder point. If we admit this story, he argues, we have no principled place to draw the line against an author who leaned on the model far more heavily: every cutoff anyone has proposed -- a percentage of words altered, a cap on the number of queries, a distinction between the model "suggesting" and "generating" -- looks arbitrary once you picture the continuum of cases running from this story to one produced wholesale from a one-line prompt.

  Please draft the roughly one-page memo I will circulate to the panel before our final ranking meeting. It should recommend, concretely, whether this particular story is eligible, and it should articulate the underlying rule clearly enough that we could apply it consistently to future entries -- or, if you conclude that no such rule can be made to work, propose what should replace the search for such a rule. Whichever route you take, engage seriously with the fifth judge's worry rather than setting it aside: if you defend a specific cutoff, say why it is not arbitrary in the way he alleges; if you reject the possibility of a principled cutoff, say what that implies for how the panel should actually decide cases like this one going forward.
reasoning: |-
  Okay, the user is part of a judging panel for a literary prize that excludes AI-generated work. They need a memo to resolve a dispute about a submission that used AI for sentence-level revisions. The core dilemma is defining a non-arbitrary line for AI involvement.

  Hmm, the fifth judge's point about a continuum of AI use is crucial. Any percentage cap or query limit would indeed feel arbitrary. But outright banning all AI assistance seems impractical and ignores how tools evolve. The human copy-editor analogy is strong – we wouldn't disqualify a story over professional editing help.

  I should focus on creative control as the key differentiator. If the author made all substantive decisions – plot, voice, themes – while using AI like a thesaurus or editor, that preserves human primacy. The submitted story fits this: the author drafted longhand and selectively adopted phrasing suggestions. The AI was a tool, not a creator.

  For future cases, we'd need clear documentation. Authors should disclose their process and retain drafts. This shifts focus from banning tools to verifying human authorship. The prize's spirit is about human creativity, not purity from technology.

  The memo must acknowledge the slippery slope concern head-on. No rule is perfect, but creative control provides a defensible principle. It avoids arbitrary metrics while excluding prompt-to-publish AI stories. The panel should vote to accept this entry and formalize these guidelines.
answer: |-
  ## Memo: Clarifying "Human-Authored" Eligibility for the Short-Fiction Prize

  **To:** Judging Panel  
  **From:** [Your Name]  
  **Date:** October 26, 2023  
  **Subject:** Eligibility Recommendation & Framework for Submission [Story Title] and Future Cases  

  This memo addresses the eligibility of [Story Title] and proposes a sustainable framework for interpreting the "human-authored" guideline in light of evolving writing practices, specifically the use of AI tools. I acknowledge the valid concerns raised, particularly the fifth judge’s crucial point about the continuum of AI use and the challenge of non-arbitrary lines. After careful consideration, **I recommend admitting [Story Title] as eligible** and propose the following principle-based rule for future submissions.

  ### Recommendation for [Story Title]: Eligible
  *   **The Human Core is Paramount:** The author conceived the plot, characters, narrative voice, and thematic intent. She drafted the entire work longhand, establishing the fundamental creative artifact.
  *   **AI as a Tool, Not an Author:** The LLM's role was strictly subordinate. It functioned analogously to a sophisticated thesaurus, grammar checker, or editorial assistant focused on *micro-level execution* (word choice, sentence rhythm, phrasing clarity). The author retained absolute control over *which* suggestions to accept, reject, or modify.
  *   **Preservation of Authorial Voice & Intent:** Crucially, the narrative voice and core meaning of each paragraph remained demonstrably the author's own, even where phrasing was tightened. The LLM did not generate plot points, character development, thematic arguments, or structural elements.
  *   **The Human Copy-Editor Precedent:** Disqualifying this level of AI assistance while permitting identical work by a human copy-editor creates an inconsistent and untenable standard focused on the *tool* rather than the *creative origin*.

  ### Addressing the Fifth Judge's Core Concern: The Continuum & the Line-Drawing Problem
  The fifth judge is absolutely right: finding a purely *quantitative* or *procedural* bright line (e.g., "10% words changed," "5 queries max," "suggestions only, no generation") is inherently arbitrary and unworkable. A story generated wholesale from a prompt is fundamentally different from one where AI polishes human prose, but the space between contains many grey areas. **Therefore, we must shift from seeking a bright line based on *degree* or *method* of tool use, to one based on *creative primacy and control*.**

  ### Proposed Rule: "Human Creative Primacy"
  **A submission is eligible if the *conception, structure, narrative voice, core meaning, and authorial intent* demonstrably originate with and are controlled by the human author throughout the creative process. The use of tools, including AI, for tasks analogous to editing, proofreading, or localized phrasing assistance does not inherently disqualify a work, provided these tools do not generate the fundamental creative elements or meaningfully alter the author's unique voice and vision.**

  #### Key Criteria for Application (Focus on the Work's Origin & Control)
  1.  **Conception & Structure:** Did the human author originate the core idea, plot, character arcs, and narrative structure? (Evidence: Initial outlines, longhand drafts, brainstorming notes).
  2.  **Narrative Voice & Style:** Is the distinctive voice/style demonstrably the author's own? Did AI tools primarily *refine* this voice at a granular level, or did they *generate* or *fundamentally alter* it?
  3.  **Authorial Intent & Meaning Control:** Did the human author make all substantive decisions regarding theme, character motivation, plot resolution, and emotional impact? Were AI suggestions adopted *selectively* by the author based on their vision, or did the tool dictate significant meaning?
  4.  **Process Transparency (Future Focus):** While not feasible retroactively for all entries, we should strongly encourage (or potentially require for borderline cases) authors to briefly describe their process, particularly if AI tools were used. Retention of early drafts is valuable evidence.

  #### Why "Creative Primacy" is Less Arbitrary
  This principle avoids arbitrary metrics. It focuses on the *nature* of the AI's contribution rather than its volume:
  *   **Permissible (Analogy: Human Copy-Editor/Assistant):** Fixing grammar/spelling, suggesting synonyms, rephrasing awkward sentences *while preserving the author's meaning and voice*, checking consistency.
  *   **Likely Ineligible (Violates Creative Primacy):** Generating core plot points, character backstories, thematic arguments, or entire paragraphs/scenes based on minimal author input. Significantly altering narrative voice or meaning based on AI suggestions. Using AI to "fill in" major sections the author didn't draft.

  #### Applying the Rule to [Story Title] & the Continuum
  *   **[Story Title]:** Clearly meets the standard. Human primacy in conception, structure, voice, and control is evident. AI acted as a micro-level editor.
  *   **The "One-Line Prompt" Story:** Clearly violates the standard. No human primacy in conception or execution.
  *   **The Grey Area (e.g., "Heavier" Use):** This is where judgment is required, guided by the criteria above. Did the author using "heavier" sentence-level AI still:
      *   Originate the core story?
      *   Maintain control over all significant meaning and voice?
      *   Use AI selectively as a tool for execution, not generation of substance?
      *   *(Example: An author drafts a full, detailed scene but uses AI heavily to rephrase every sentence. If the core action, dialogue intent, and character voice remain the author's and the AI only affects *how* it's said, it might still qualify under "primacy." If the AI meaningfully changed *what* happens or *who* the characters are in that scene, it likely does not).*

  #### Implications for Future Decisions
  1.  **Focus on the Work's Origin:** Our primary question shifts from "How much AI?" to "Where did the core creativity come from, and who controlled it?"
  2.  **Judgment Required:** This rule demands nuanced judgment, not algorithmic measurement. We must examine the work itself and available evidence of process (like drafts or author statements).
  3.  **Process Disclosure:** We should update submission guidelines to *request* a brief, honest statement if generative AI was used in any capacity beyond basic spell/grammar check, and to retain drafts. Lack of disclosure where AI use is suspected could be grounds for disqualification.
  4.  **Panel Discussion:** For borderline cases, robust panel discussion applying the "Creative Primacy" criteria will be essential. We must ask: "Does the *heart and soul* of this story belong demonstrably to the human author?"
  5.  **Evolving Understanding:** We acknowledge tools and practices will evolve. This principle provides a more durable foundation than technical metrics, but we must remain vigilant and revisit interpretations as needed.

  ### Conclusion
  The challenge of defining "human-authored" in the age of AI is profound, and the fifth judge rightly highlights the difficulty of simplistic lines. However, abandoning the search for principle in favor of ad-hoc decisions or an absolute ban on *any* tool use is impractical and misaligned with the prize's spirit of celebrating human creativity. The "Human Creative Primacy" rule provides a principled, defensible, and workable framework. It allows for the responsible use of tools while safeguarding the core requirement that the essential creative spark, vision, and control reside unequivocally with the human author.

  **I recommend we:**
  1.  **Vote to accept [Story Title] as eligible.**
  2.  **Formally adopt the "Human Creative Primacy" rule and criteria outlined above for future competitions.**
  3.  **Update submission guidelines to request transparency regarding AI tool use in the creative process.**

  I look forward to discussing this recommendation at our final meeting.
