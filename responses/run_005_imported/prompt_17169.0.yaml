prompt: |-
  So this happened with my housing co-op and I can't stop thinking about it. We're small, only 12 units, and whenever someone applies to move in, a 3-person committee reviews them before the whole co-op votes to sign off on it. I'm on that committee right now along with two other members, Priya and Doug. Our bylaws say an applicant has to clear three seperate things -- the credit/income check, the landlord references, and the in-person interview -- and each of those three gets decided by majority vote among the three of us, and the applicant only gets approved if all three pass.

  We had an applicant a few weeks back where, it turns out, each of us privately had a problem with a different one of the three things. I was fine with the finances and the references but wasnt totally sold on the interview. Priya thought the finances and interview were fine but wasn't happy with the references. Doug liked the references and interview but had doubts about the finances. Which means if you'd asked any one of us straight up "should this person move in, yes or no," all three of us would've said no. But when we voted item by item like we're supposed to, every single item passed 2-1 (since on each one, only one of us was the holdout), so the applicant technically cleared all three and got approved to move in. Nobody noticed until afterward that not one of the three of us actually wanted that outcome, and yet it's exactly what our own process produced. Now the lease signing is in two weeks, half the co-op wants an emergency re-vote to undo it before that happens, and the other half thinks that sets a terrible precedent where any result can just get overturned once people don't like it. I tried explaining to my roommate how a vote where every single person secretly disagrees with the outcome is even possible and she just assumed I was describing it wrong.

  I want to bring something better than "this felt wrong" to our house meeting this weekend. Could you write me a short memo -- the kind of thing I could actually print out and hand to the committee -- that (a) recommends what we should do about this specific applicant given the two-week deadline, and (b) recommends whether we should keep voting item by item, switch to a straight yes/no vote on the applicant as a whole, or do something else going forward. Whatever you land on, please seriously engage with the strongest reason for the option you're rejecting instead of just brushing it off, because I don't want to walk in with something one-sided. It doesn't need to be formal or have citations or anything, just something that actually holds up when people push back on it.
reasoning: |-
  Okay, let me unpack this housing co-op situation. The user is part of a 3-person committee that approved an applicant through a procedural quirk where each member opposed one of three criteria, yet all criteria passed 2-1. Now there's division about whether to overturn the approval and how to fix the voting system.

  The core tension here is between procedural integrity and substantive fairness. On one hand, the committee followed bylaws to the letter; on the other, the outcome contradicts unanimous opposition. The user needs balanced recommendations addressing both the immediate crisis and long-term process reform.

  For the immediate decision: revoking approval risks setting a precedent where any vote can be contested after the fact, potentially undermining trust in the system. But enforcing this approval when all committee members privately objected seems ethically questionable. A compromise might be best - perhaps a full co-op vote with transparency about the committee's conflicted position.

  For the voting system: the current item-by-item method clearly failed here by creating a "unanimous rejection disguised as approval" scenario. But switching to simple yes/no votes might lose the nuance of evaluating distinct criteria. A hybrid approach could work - keep separate evaluations but require overall consensus or include a final yes/no vote.

  The user's deeper need seems to be maintaining community trust while preventing future contradictions. They want solutions that acknowledge both proceduralists' concerns (rules must matter) and substantivists' concerns (outcomes should reflect intent). The memo should validate both perspectives while proposing practical improvements.

  Notably, the user explicitly requested engagement with counterarguments - showing awareness this is a true dilemma without perfect answers. The response should model that nuance by anticipating objections to each recommendation.
answer: |-
  ## MEMO: Reviewing Approval Process & Applicant Decision  
  **To:** Housing Co-op Committee & Members  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Re:** Addressing Procedural Outcome & Recommending Changes  

  ### I. The Immediate Situation: Applicant Approval  
  **Recommendation:** **Honor the current approval but conduct an emergency full co-op vote *before* lease signing.**  

  *   **Why this?**  
      - The committee followed bylaws correctly during the initial vote. Overturning a procedurally correct outcome *after* the fact sets a dangerous precedent where any approved applicant could face retroactive challenges based on subjective buyer's remorse, undermining trust in our processes.  
      - However, the outcome is undeniably paradoxical: *all three committee members* had reservations significant enough that they would have individually voted "No" on the applicant overall. This reveals a flaw *in the process*, not necessarily dishonesty in the committee. Ignoring this dissonance risks community cohesion.  

  *   **Addressing the Strongest Counterargument (Against a Re-Vote):**  
      *"Overturning this sets a terrible precedent!"* This is valid. To mitigate this:  
      1.  Frame the full co-op vote **not as "overturning"** the committee, but as **exercising the co-op's ultimate authority** (as per our bylaws, the committee recommends, the co-op approves).  
      2.  Present the committee's votes *transparently*: Explain *how* each criterion passed 2-1 despite each member having a reservation, making it clear this is about a *procedural anomaly*, not just disliking the result.  
      3.  **Require a supermajority (e.g., 75%)** in the full co-op vote to *reject* the applicant. This sets a very high bar, ensuring overturning is rare and only for truly exceptional circumstances like this clear procedural contradiction.  

  *   **Process for the Emergency Vote:**  
      1.  Hold a special meeting before the lease signing.  
      2.  Present the committee's report, including the specific reservations each member had on their respective criteria and the vote tallies.  
      3.  Allow the applicant (if willing) a brief chance to address concerns.  
      4.  Vote: "Should the co-op approve [Applicant Name] for tenancy based on the committee's report and this discussion?"  
      5.  Require a **super majority (e.g., 9 of 12 votes)** to reject. If rejected, inform the applicant immediately with transparency about the procedural reason.  

  ### II. The Long-Term Solution: Fixing the Approval Process  
  **Recommendation: Replace the "Item-by-Item Majority" vote with a "Final Recommendation Vote" by the committee, *after* discussing all three criteria.**  

  *   **Proposed New Process:**  
      1.  Committee reviews all three criteria (Credit/Income, References, Interview) *thoroughly* and discusses any concerns collaboratively.  
      2.  **After discussion, the committee takes a SINGLE vote: "Do we recommend this applicant for approval by the co-op? Yes/No/Abstain."**  
      3.  A simple majority (2 out of 3) determines the committee's recommendation (Yes or No).  
      4.  This recommendation, along with a summary of key findings/concerns for *all* criteria, goes to the full co-op for the final vote (as per current bylaws).  

  *   **Why this is better:**  
      - **Avoids the Paradox:** This directly prevents the scenario where fragmented concerns on individual items lead to approval despite unanimous overall opposition. It forces the committee to synthesize their views into a holistic recommendation.  
      - **Promotes Discussion:** Requiring a single recommendation vote *after* discussion encourages committee members to share their specific concerns (e.g., "Doug, your point about finances worries me, can you elaborate?") and potentially resolve them or weigh their collective significance.  
      - **Clearer Mandate:** It gives the full co-op a clear, unambiguous committee stance ("Recommend" or "Do Not Recommend") based on overall suitability, not just a checklist of technical passes.  

  *   **Addressing the Strongest Counterargument (For Keeping Item-by-Item):**  
      *"The item-by-item vote ensures each critical hurdle is independently validated! A single vote could let a major flaw in one area get overlooked if the others seem strong."*  
      This is a significant strength of the current system. To preserve this rigor within the new process:  
      1.  **Mandate Rigorous Review:** The committee's discussion *must* explicitly cover each of the three criteria. Members *must* voice any specific concerns they have about *any* criterion during the discussion phase.  
      2.  **Transparent Reporting:** The committee's report to the co-op *must* explicitly state the findings and any concerns raised for *each* of the three criteria, *even if* they ultimately voted to recommend approval. This ensures the co-op sees potential weaknesses flagged in any area.  
      3.  **Committee Responsibility:** The committee members have a duty to not vote "Recommend" if they believe a flaw in *any one* criterion (e.g., disastrous credit, terrible reference) is severe enough to disqualify the applicant on its own, regardless of the other areas. The single vote forces them to take ownership of that judgment call collectively.  

  ### Summary & Next Steps

  *   **Immediate Action:** Propose an emergency full co-op vote on the current applicant, requiring a high threshold (supermajority) for rejection, framed as the co-op exercising its final authority based on a revealed procedural anomaly.  
  *   **Long-Term Fix:** Propose a bylaw amendment changing the committee vote to a single "Recommend/Do Not Recommend" vote taken *after* thorough discussion of all three criteria, coupled with requirements for transparent reporting of concerns on each criterion to the full co-op.  
  *   **Goal:** Preserve the integrity of our rules while acknowledging and fixing a flaw that produced an outcome contradicting the collective will of the committee. This balances fairness to the applicant, respect for process, and the need for a system that reflects our actual judgment of an applicant's *overall* suitability.  

  **I move that we adopt these recommendations at the upcoming house meeting.**
