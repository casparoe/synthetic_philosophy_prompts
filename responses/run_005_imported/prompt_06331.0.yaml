  (1) Nora's opening move: Surrogate goals get you deterrence for free against an instrumentally rational threatener who only wants concessions. The idea is that by committing to only paying for threats against the surrogate, the threatener will redirect to the surrogate because that's the only way to get concessions. And since the surrogate is cheap, you don't care about losing it.

  Score: This is a reasonable point. It captures the essence of how a surrogate might work against a rational threatener who is indifferent to the target. However, it assumes the threatener is purely instrumental and that the commitment is credible. It's a good start but oversimplifies by calling it "free". We'll give it a positive score but not the highest because it ignores some challenges.

  (2) Theo's objection: The commitment must be credible even when the real goal is on the line. An agent that would let the real goal burn is just one that never gives in. The surrogate isn't adding anything; it's relabeling a strategy that was always hard.

  Score: This is a strong point. Theo correctly identifies the core issue of commitment credibility. The surrogate doesn't magically solve the commitment problem; it just reframes it. If you are willing to let the real goal burn, then you are indeed committed to not giving in. The surrogate might be a way to make that commitment more credible, but Theo is right that the underlying hardness remains. This move is a good counter.

  (3) Nora's reply: It's not just relabeling because non-negotiation is hard to sustain and signal, while the surrogate allows a visible concession (on the surrogate) which is easier to make credible because there's a real (though cheap) payment.

  Score: Nora makes a valid point here. The surrogate does provide a mechanism for making a commitment more credible by allowing a concession that doesn't hurt the real goal. This could help in signaling and sustaining the commitment because you are actually giving up something (the surrogate) in a way that is observable. This addresses Theo's concern to some extent. It's a good point.

  (4) Theo's comeback: This only works against threateners who are indifferent to which goal they damage. A threatener who specifically wants to harm the real goal won't be satisfied by the surrogate. Moreover, sophisticated threateners, knowing about surrogate goals, will specify that only the real goal counts, putting you back to square one.

  Score: This is a very strong point. Theo identifies a critical limitation: the surrogate goal strategy is vulnerable to malicious threateners (who care about the real goal) and to strategic adaptation by sophisticated threateners. If the threatener can condition their threat on the real goal, then the surrogate doesn't help. This is a significant challenge.

