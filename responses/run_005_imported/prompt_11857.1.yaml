answer: |-
  You've hit the nail on the head – the "whatever works" flattening does a massive disservice to both Peirce and James, and Peirce's frustration was absolutely justified. Let's cut through the soundbite and get to the core differences in their theories of truth, and then I *will* pick a side.

  **The Core Difference: Community vs. Individual, Long-Term Convergence vs. Immediate Cash-Value**

  1.  **Charles Sanders Peirce (Pragmaticism): Truth as the Final Opinion of the Community of Inquiry**
      *   **Foundation:** Scientific method and logic. Truth is about *how signs (ideas, propositions) relate to their objects in reality*, ultimately verifiable through practical consequences.
      *   **Key Mechanism:** The **Community of Inquirers**. Truth isn't decided by one person. It emerges through the long-run, self-correcting process of scientific investigation by a community dedicated to finding things out.
      *   **Definition of Truth:** **Truth is the opinion which is fated to be ultimately agreed to by all who investigate.** It's the ideal limit towards which ongoing inquiry converges. Think of it as the asymptote scientific investigation endlessly approaches but may never perfectly reach.
      *   **Role of "Works":** The practical consequences of an idea (its "cash-value") are crucial *for clarifying its meaning* and *testing its validity within the process of inquiry*. But "works" here means "leads to successful prediction, explanation, and manipulation of reality *in the long run, under critical scrutiny by the community*." It's not about immediate personal satisfaction.
      *   **Truth vs. Belief:** We *believe* things provisionally based on current evidence and practical success. But **truth itself is independent of any individual's belief**; it's the state affairs *would* converge upon given ideal, sustained investigation. It's *objective* in this intersubjective, long-term sense.
      *   **Analogy:** Mapping uncharted territory. Individual explorers (scientists) make maps (theories) that help them navigate *now* (beliefs justified by practical consequences). The *true* map is the one that would perfectly correspond to the territory, revealed only through the collective, error-correcting efforts of *all* explorers over time.

  2.  **William James (Pragmatism): Truth as What is Satisfactorily Verifiable in Experience**
      *   **Foundation:** Psychology and human experience. Truth is a *property of ideas* that helps us navigate life successfully.
      *   **Key Mechanism:** **Individual Verification in Experience.** An idea becomes true *by being verified* through its practical consequences in someone's stream of experience. It's *made* true through the process of leading us successfully from one part of experience to another.
      *   **Definition of Truth:** **"The true is the name of whatever proves itself to be good in the way of belief, and good, too, for definite, assignable reasons."** Truth is what "works" in the sense of being **expedient**, **satisfying**, **fruitful**, and **leading us prosperously** through experience. It helps us "cash in" the idea for experiential value.
      *   **Role of "Works":** "Works" is central and *constitutive*. The practical consequences *are* the verification *and* what makes the idea true *for the individual* in that context. Truth is inherently valuable *because* it works. James emphasizes the "satisfactions" and "profits" of holding true beliefs.
      *   **Truth vs. Belief:** The line is blurrier. A belief *becomes* true when it is verified through its successful working in experience. Truth is more dynamic and pluralistic – what "works" for one person in one context might not work for another, though James tries to ground it in a common human reality ("sensible experience").
      *   **Analogy:** Tools in a workshop. A tool (idea) is "true" if it reliably helps *you* (or a group sharing similar needs) accomplish your tasks (navigate experience) effectively and satisfyingly *right now*. Its truth is confirmed by its usefulness *in use*.

  **Who Has a Theory of Truth? Picking a Side: Peirce.**

  **Justification:**

  1.  **Truth as Independent (Enough):** Peirce's theory provides a robust *definition* of truth that is **distinct from the process of discovering it or believing it.** Truth is the *ideal terminus* of inquiry, the state of affairs inquiry *aims at*. It exists independently of any individual's current belief or verification process. James, conversely, **collapses truth *into* the verification process and its satisfying results.** For James, truth *is* what is verified/believed *because* it works well *now*. This makes "truth" functionally equivalent to "currently justified belief that provides practical satisfaction."
  2.  **Objectivity (Intersubjectivity vs. Subjectivity):** Peirce grounds objectivity in the *long-run convergence* of the scientific community's investigations, constrained by a shared external reality ("Secondness"). This offers a buffer against pure relativism. James's grounding in "sensible experience" and "what works" is much more vulnerable to individual interpretation and contextual relativism. While James wasn't a crude relativist and believed in a common reality, his theory struggles to explain why one "satisfactory" belief should be considered *truer* than another equally satisfactory one in a different context, beyond immediate pragmatic payoff. Truth becomes pluralistic to the point of fragmentation.
  3.  **Truth vs. Utility/Justification:** Peirce maintains a crucial distinction: the practical consequences *test* an idea's claim to truth (its correspondence to reality, revealed through inquiry); they are not *identical* to truth. "Works" is a necessary criterion for meaning and a test for validity within inquiry, but truth is the *goal* defined by convergence. James **conflates truth with utility and justification.** If an idea works satisfyingly *now*, it *is* true *now*. This makes "truth" simply the label we put on beliefs that are currently useful and justified by their experiential payoff. It's a theory about **why we *adopt* and *value* beliefs** (because they work), not a robust theory about what *makes* those beliefs *true* in a sense distinct from that adoption and valuation.
  4.  **The "Wearing Truth's Clothes" Charge:** James's theory is brilliant and insightful as a **theory of belief-formation, justification, and valuation.** It explains *why* we hold the beliefs we do, *how* we justify them (pragmatic testing), and *why* truth is important to us (because it pays). But it struggles to define truth *itself* in a way that isn't simply reducible to "beliefs that are successfully working for us right now." It describes the *clothes* of truth (justified, useful belief) exceptionally well, but lacks a distinct body underneath. Peirce, while his theory is messier and relies on an ideal limit we never reach, *does* posit a distinct body – the convergent opinion representing reality – that the clothes (practical verification) are helping us tailor and fit *towards*.

  **Conclusion:** Peirce offers a genuine, albeit complex and fallibilistic, **theory of truth** defined as the ideal outcome of a specific, reality-constrained process (scientific inquiry). James offers a powerful and compelling **theory of belief-formation, justification, and the value of truth**, where "truth" becomes synonymous with the successful, satisfying functioning of a belief within an individual's or group's experiential framework. Peirce's "pragmaticism" aims at defining truth; James's pragmatism brilliantly explains why we seek and cling to beliefs we *call* true. For the piece, hammering this distinction – convergence vs. cash-value, community fate vs. individual satisfaction, truth-as-goal vs. truth-as-current-tool – is key to moving past the flattened caricature. Peirce wins on providing an actual theory *of* truth.
