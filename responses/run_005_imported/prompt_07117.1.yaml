prompt: |-
  I'm in my school's AI safety club and we just started a podcast, and my first guest is a grad student who's a big advocate for 'debate' as a scalable oversight method -- basically two AIs argue and a human judge who can't verify the answer themselves just picks whoever's more convincing, which is supposed to keep future superhuman models honest. Can you write me around 8 interview questions that go beyond just having her restate the pitch? I want one on the obfuscated argument problem (a dishonest debater buries the flaw inside a huge tree of sub-arguments that's too expensive to fully unpack), one on why we should even expect honesty to be the winning strategy rather than just whoever's more persuasive, and one comparing debate to other oversight ideas like recursive reward modeling. She also likes to deflect pushback like this with 'thats an implementation detail, not a problem with debate itself,' so can you bake in a follow-up for each question thats keyed to that kind of response.
