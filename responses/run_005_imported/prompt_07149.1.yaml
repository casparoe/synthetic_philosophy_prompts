  Then there's the gap between God's existence and personal immortality. The proof doesn't connect the two. Gödel's belief that God wouldn't annihilate minds is a separate, informal leap. Philosophers would want that argument formalized, which it never was. 

  Academic culture plays a role too. Gödel was a mathematician, not a philosopher. His work outside formal logic might be viewed as eccentric, especially given his later paranoia and starvation. That reputation could lead to dismissal. Plus, ontological arguments are already contentious—adding immortality might seem like overreach.

  The user's editor is obsessed with the "logician proves afterlife" angle, but the truth is messier. The real story might be about Gödel's personal quest for certainty rather than a bulletproof argument. Highlighting the gap between his private beliefs and the actual proof could add depth to the longread. 

  Also, the user might need accessible explanations of why modal logic proofs aren't knockdown arguments. Examples like different definitions of "necessary existence" could help. They should also address why Gödel's authority doesn't automatically validate the conclusion—logic depends on premises, not the proponent's fame.

