  Hmm, the user's confusion makes sense. If a genius logician "proved" immortality, why isn't it revolutionary? I should break this down. First, was Gödel actually proving personal immortality? His formal argument focuses on God's existence, not the soul. The immortality angle comes from his private notes and letters. That's a key distinction—the proof itself doesn't contain immortality; it's Gödel's interpretation. 

