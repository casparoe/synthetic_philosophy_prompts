answer: |-
  ## Pre-Vote Opinion: Recommendation on Recognising Demand-Avoidant Profiles in Autism Assessment

  **To:** Neurodevelopmental Diagnostic Practice Group  
  **From:** [Your Name], Consultant Clinical Psychologist (Autism Assessment Lead)  
  **Date:** [Date]  
  **Subject:** Recommendation on Formal Recognition of Extreme Demand Avoidance (PDA) Profiles  

  The upcoming vote on formally recognising "Pathological Demand Avoidance" (PDA) or "Extreme Demand Avoidance" (EDA) as a named profile within our autism assessments demands careful navigation between two compelling, legitimate concerns. As a group, we must balance our institutional responsibility for diagnostic validity and avoidance of iatrogenic harm against our ethical duty to acknowledge lived experience and facilitate access to appropriate support. Recent personal exposure to the profound impact such a label can have on family dynamics and self-perception has reinforced the real-world stakes of this decision.  

  **The Competing Imperatives:**  

  1.  **The "Bad Faith" Argument:** Withholding a term actively used by families and autistic individuals to describe a recognisable, impactful cluster of behaviours feels dismissive. It risks invalidating their lived reality and hinders access to tailored strategies (e.g., low-demand approaches) and essential resources (EHCP provisions, specific school placements). Ignoring this grassroots conceptualisation creates a disconnect between clinical practice and community understanding, potentially undermining trust and support efficacy.  
  2.  **The "Looping Effect" Concern (Hacking):** Formalising a clinically contested label risks reifying it. Diagnostic categories don't merely describe; they shape identity and behaviour. Children who read "PDA" in their reports may internalise expectations, consciously or unconsciously shaping their responses to demands in ways that conform to the profile. Our institutional endorsement could inadvertently amplify the very behaviours we seek to neutrally describe, particularly before robust, consensus-driven diagnostic validity is established.  

  **Recommendation: Conditional Recognition with Mandated Review**  

  I propose we **formally recognise "Extreme Demand Avoidance" (EDA) as a potential profile descriptor within autism spectrum diagnosis reports, effective immediately, but condition this recognition on a named review date of [Date - e.g., 2 years from now]**.  

  **Why Conditional Recognition (EDA)?**  

  *   **Acknowledges Lived Experience & Practical Need:** It directly addresses the "bad faith" concern. Using "EDA" (preferable to "PDA" for its less stigmatising, more descriptive nature) validates the experiences of families and autistic individuals. It provides a clinically recognised gateway to vital, profile-specific support strategies and resources within EHCPs and educational settings, which generic "demand avoidance" descriptions often fail to unlock effectively.  
  *   **Mitigates Looping Risks Through Cautious Framing:** Conditional recognition explicitly signals the *provisional* nature of this profile within our diagnostic framework. The fixed review date forces us to re-evaluate based on emerging evidence (e.g., DSM/ICD developments, longitudinal studies, consensus statements from bodies like NICE). It avoids granting the label permanent, unassailable status.  
  *   **Maintains Clinical Integrity:** Recognition is contingent on the profile being embedded *within* an autism diagnosis. We describe the core features (extreme anxiety-driven avoidance, need for autonomy, use of social strategies to avoid demands, surface sociability contrasting with profound difficulties) rigorously and behaviourally within the report, alongside the EDA descriptor. The autism diagnosis remains the foundational framework.  

  **Implementation Safeguards:**  

  1.  **Mandatory Training:** All clinicians authorising EDA profiles must complete approved training on its conceptualisation, differential diagnosis (e.g., distinguishing from Oppositional Defiant Disorder, anxiety disorders, other autism profiles), and evidence-informed support strategies.  
  2.  **Standardised Descriptive Criteria:** Develop and mandate the use of trust-wide, operationalised criteria for noting EDA within reports, ensuring consistency and grounding the label in observable behaviours and reported experiences.  
  3.  **Explicit Language in Reports:** Reports using EDA *must* include contextualising language, such as:  
      > *"This profile of autism is characterised by Extreme Demand Avoidance (EDA), reflecting a specific pattern of overwhelming anxiety responses to everyday demands and expectations, leading to complex avoidance strategies. The conceptualisation and diagnostic criteria for EDA continue to be refined within the clinical and research community. This recognition facilitates access to specific support approaches known to be helpful for individuals presenting with this pattern of needs, based on current understanding."*  
  4.  **Robust Review Process:** The [Date] review must involve:  
      *   Analysis of internal data on EDA diagnosis frequency, consistency, and outcomes.  
      *   Critical appraisal of significant new research and diagnostic guidance.  
      *   Soliciting feedback from families, schools, and autistic adults on the impact of the label.  
      *   A clear vote on whether to continue, modify, or cease formal recognition.  

  **Why Not the Other Options?**  

  *   **Formal Recognition Unconditionally:** Ignores the valid, evidence-based concerns regarding looping effects and the current lack of formal diagnostic criteria, potentially cementing a label prematurely and risking unintended consequences.  
  *   **Decline to Recognise Formally:** Perpetuates the "bad faith" disconnect, fails families seeking targeted support validated by the label, and overlooks the pragmatic reality that this conceptualisation *is* driving care approaches regardless of our stance. It leaves our reports less useful in navigating support systems increasingly attuned to this profile.  

  **Conclusion**  

  Conditional recognition of "Extreme Demand Avoidance" as a profile within autism spectrum diagnosis represents the most ethically defensible and clinically responsible path forward. It takes seriously the lived realities and support needs articulated by families and autistic individuals, while simultaneously honouring Hacking's crucial warning about the formative power of diagnostic labels by embedding mandatory scrutiny and a clear off-ramp. This approach allows us to meet families where they are, utilising a clinically useful heuristic to unlock support, without surrendering our scientific and ethical duty to remain vigilant, adaptable, and guided by evolving evidence.  

  I urge the group to support the **conditional recognition of EDA with a review date of [Date]**.
