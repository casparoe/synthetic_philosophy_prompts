answer: |-
  You've hit on a genuinely deep tension in philosophy of biology, and your intuition that the accounts *often converge* in standard cases is spot-on. But the distinction isn't just "decorative" or *only* about edge cases—it reflects fundamentally different conceptions of explanation, teleology, and what a "function" *is for*. Here's why the fault line persists:

  ### 1. **Different Explanatory Projects**
     - **Wright/Etiological**: Answers "**Why do we *have* this trait?**" It explains the trait's *existence and persistence* in a population. Function is tied to evolutionary history. (e.g., "Hearts exist *because* they pumped blood in ancestors").
     - **Cummins/Causal-Role**: Answers "**What does this trait *do* now?**" It explains how a trait *currently contributes* to a system's capacities, regardless of history. (e.g., "Hearts *currently* pump blood, which sustains circulation").

     **Consequence**: For *normal* traits in *stable* environments, answers converge. But the *questions* are different. Wright explains *origins*, Cummins explains *current mechanics*.

  ### 2. **Where They *Systematically* Diverge (Beyond "Weird Exceptions")**
     - **Novel Traits/Pre-Adaptations (Exaptations)**:
       - A trait may have a current causal role it *wasn't* selected for. E.g., feathers likely evolved for thermoregulation (Wright: that's their "function"), but now enable flight (Cummins: flight is a key "function" in birds).
       - Wright would say flight is a *new use*, not the "function." Cummins says flight is *a* function (among others) based on current causal contribution.
     - **Vestigial Organs (Your Advisor's Point, But Deeper)**:
       - Human appendix: Wright says it has *no function* (selection ceased). Cummins says it *may* have a minor current role (e.g., immune tissue reservoir)—even if not the ancestral one.
     - **Malfunctions**:
       - A heart with a defect *can't* pump blood effectively. Wright: Its function is *still* pumping blood (that's why it exists). Cummins: If it contributes *nothing* to circulation, it currently *lacks* that function—though it has the *disposition* to pump.
     - **Non-Biological Systems**:
       - Cummins applies to *any* system (e.g., a carburetor's function in an engine). Wright *only* applies to traits with evolutionary histories. This matters for extending "function" to AI, culture, or engineering.
     - **Traits with Multiple Effects**:
       - Wright picks out *only* the effect(s) causally responsible for selection. Cummins can assign multiple functions based on multiple contributions. E.g., bone structure: Wright focuses on structural support (selected); Cummins adds mineral storage (current role).

  ### 3. **The "Keeping the Lineage Going" Problem**
     Your point that "whatever got selected for ancestrally is also what's currently keeping the lineage going" is insightful but fragile:
     - **Environmental Change**: Not just "contrived." Climate shifts, invasive species, or human-altered landscapes (e.g., pesticide resistance evolving *then* becoming maladaptive) are common. Wright's function becomes "mismatched"; Cummins' function shifts with current causal roles.
     - **Time-Lag Issues**: Traits persist *after* selection stops (vestigial organs) or *before* selection acts (new mutations). Wright denies functions in both cases; Cummins can assign functions if there's current contribution.
     - **Drift vs. Selection**: A trait fixed by drift (no selection) has *no Wrightian function*, even if it currently does something useful. Cummins assigns a function if it contributes now.

  ### 4. **Teleology: The Real Heart of the Debate**
     - **Wright** naturalizes "purpose": Functions are *literally* purposes shaped by selection. "Hearts are *for* pumping blood" is a historical fact.
     - **Cummins** avoids teleology: Functions are just causal contributions to capacities we happen to analyze. "Pumping blood" isn't a "purpose"—it's a mechanistic role.
     
     This matters for anti-teleological biologists (e.g., Jacques Monod) vs. those who see purpose in evolution (e.g., Ernst Mayr).

  ### 5. **Why the Field Cares: It's Not *Just* About "Function"**
     The debate reflects deeper splits:
     - **Mechanism vs. History**: Is biology more like physics (Cummins) or a historical science (Wright)?
     - **Normativity**: Wright explains why traits *should* work a certain way (malfunction is failure to perform selected task). Cummins has no "should"—only what a part *does*.
     - **Level of Analysis**: Wright operates at the population/genetic level; Cummins at the organismal/systems level.

  ### So, Is the Distinction Overhyped?
  **Partly yes, partly no.**  
  - **Yes**: In many empirical contexts (e.g., physiology), the distinction is pragmatically ignored because answers align. Philosophers *do* sometimes overstate incompatibility.
  - **No**: The accounts embody *irreducibly different perspectives* on explanation, purpose, and biology itself. Ignoring the split obscures key questions:
    - Is a newly mutated trait "functional" before selection acts? (Cummins yes, Wright no)
    - Can a trait lose its function but gain a new one? (Wright: no—it gains a *new* function; Cummins: yes—function changes with role)
    - Is "function" a historical or ahistorical concept?

  **Your takeaway**: You're right that in stable, textbook cases, the outputs converge. But the *inputs* (what question is being asked) and *foundations* (what makes an explanation biological) are genuinely distinct. The debate persists because it touches on what biology *is*—and that's worth the ink, even if practitioners often gloss over it. For quals, focus on how each account serves different explanatory needs—**Wright for evolutionary origins, Cummins for structural/mechanistic analysis**—and you'll navigate the fault line wisely.
