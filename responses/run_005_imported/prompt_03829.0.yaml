answer: |-
  ## The Shuffled Deck Dilemma

  **Setting:** A cluttered office at a decision theory conference. Papers litter a small table between two armchairs. **Morgan**, mid-40s, energetic and pragmatic, holds a deck of index cards. **Alex**, late 50s, meticulous and cautious, sips tea, peering skeptically at the cards.

  **Morgan:** (Tapping the deck) So Alex, the Pasadena game *does* have an expected utility. It resolves in a specific temporal order: flip 1, flip 2, flip 3... yielding the alternating harmonic series converging to ln(2). Done. The rearrangement theorem is a mathematical curiosity, not a practical problem.

  **Alex:** (Sets down teacup) "Curiosity"? Morgan, the rearrangement theorem *is* the problem! It demonstrates the expectation isn't intrinsic to the game itself, but *entirely dependent* on an arbitrary labeling of states. This isn't just shuffling cards – it’s reshuffling the very states of nature! If I re-index the flips, defining "state 1" as the first *even* n where heads occurs, "state 2" as the first *odd* n... suddenly the expected utility diverges to *negative* infinity! Same physical process, same coin, same payoffs. How can its value hinge on how I *write down* the outcomes?

  **Morgan:** But it *doesn't* hinge on how you *write* it down. It hinges on the *temporal path of uncertainty resolution*. The coin flips happen sequentially. You don’t *choose* which flip happens "first" conceptually; reality imposes the order: Flip one happens *before* flip two. The probability space is inherently ordered by time. The conditional convergence reflects the actual unfolding of risk. (Places cards face down on the table in a row, labeled "Flip 1", "Flip 2", etc.) The payoff *reveals itself* in this sequence. You can't reshuffle reality.

  **Alex:** (Picks up the deck and deliberately shuffles the cards, ignoring the labels) But the states – the distinct possible worlds defined by "first heads on flip n" – *are* the fundamental ontological primitives for calculating expectation, not the temporal sequence of discovery. Each state `S_n` (heads first on n) has a well-defined probability `(1/2)^n` and a well-defined payoff `(-1)^{n+1} * 2^n/n`. The expectation is `Σ [P(S_n) * U(S_n)]`. The rearrangement theorem proves this sum is *indeterminate* – its value depends on the *order of summation* over these states. Time gives us one arbitrary order. My reshuffling gives another. Why privilege time? Why is the order `S_1, S_2, S_3, ...` more "real" for expectation than `S_2, S_4, S_6, ..., S_1, S_3, S_5, ...`? Both sum the exact same set of `P(S_n)*U(S_n)` terms!

  **Morgan:** Because time *isn't* arbitrary! It dictates when the gamble *ends* and the payoff is realized. In your reshuffled order (`S_2, S_4, S_6, ..., S_1, ...`), the player might be waiting indefinitely for a payoff that *could* have occurred on flip 1! The temporal order defines the stopping rule. You can't sum states ignoring *when* they occur in the process; the process *is* defined by the sequence. It's like saying the expected duration of a search shouldn't depend on checking locations in a specific order. But it does! The order affects when you *stop*.

  **Alex:** And therein lies the rub! The expectation *should* be a property of the *gamble itself* – the mapping from states to utilities weighted by their probabilities. The temporal path is an *implementation detail*. If the expectation critically depends on that implementation detail – an ordering we all agree is mathematically arbitrary for the sum – then the gamble *lacks a well-defined expected utility*. Decision theory needs a unique number for rational choice. This gives us infinity, minus infinity, pi, or ln(2), depending on bookkeeping. That's not a value; it's a Rorschach test! How can an agent maximize expected utility when the expectation is undefined?

  **Morgan:** (Leans forward) Okay, let's grant the single-shot expectation is... problematic under your state-sum view. But consider *repeated play*. Easwaran showed that if you play the Pasadena game repeatedly, the average payoff per game converges almost surely to ln(2). Doesn't that give us a solid operational foundation for its value? The law of large numbers pins it down, cutting through the conditional convergence.

  **Alex:** (Nods slowly, then shakes head) It *does* give ln(2) for the repeated game average, true. But that’s a different object! It tells us the *long-run frequency value under repetition*. It doesn't solve the problem for the *single instance* of the gamble. Should an agent be indifferent between a single Pasadena game and a single gamble paying ln(2) for sure? The rearrangement trick shows they *shouldn't* be indifferent! I can reshuffle the states to make the single Pasadena gamble have an expected utility of, say, 10 utils – vastly better than ln(2) ≈ 0.693. If expectation is undefined for the single play, how can we even *compare* it to ln(2)? The repeated-play argument provides a *price* for entering repeated engagements, not the value of one engagement. It sidesteps the fundamental indeterminacy.

  **Morgan:** (Picks up the shuffled deck, starts dealing cards face down in the original temporal order again) Maybe the indeterminacy *is* the fundamental insight, Alex. But for a decision-maker *facing this specific temporal process*, the resolution happens step-by-step. The conditional expectation *given the history so far* is always well-defined at each flip. The *ex-ante* value ln(2) emerges as the natural starting point because it's the limit of the series generated by the actual resolution mechanism. Your reshuffled sums describe hypothetical *different games* with different stopping rules or state orderings, not *this* game. The hole isn't in decision theory; it's in trying to divorce expectation from the process that generates it.

  **Alex:** (Takes the deck back, holds it up) And yet, these cards represent *all possible outcomes* of *this game*, Morgan. The probabilities and utilities are fixed. The sum of their products is mathematically fluid. If the 'true' expectation is ln(2), why does mathematics so easily offer me infinity just by changing the sequence of addition? It feels like we're trying to anchor a boat in a whirlpool. Perhaps the lesson is humbler: some gambles, however well-defined probabilistically, simply lack a unique expected utility. Decision theory needs to acknowledge that, maybe with a new category – "path-dependent expectation" or "indeterminate expectation". Treating it as cleanly ln(2) sweeps the whirlpool under the rug. (Places the shuffled deck back on the table between them). The hole is real, and it’s deep.

  **Morgan:** (Looks at the deck, then at Alex, a thoughtful frown replacing the earlier certainty) Hmm. Path-dependent... That *does* capture the tension. Maybe ln(2) is the value *along the temporal path*, but the state-sum perspective reveals a fragility... I still think the temporal path is privileged for *this* gamble, but... (trails off, tapping the table) Alright, Alex. Point taken. It's messier than I admitted. But I still wouldn't pay more than ln(2) for a single play.

  **Alex:** (A small, wry smile) And I wouldn't sell it for less than infinity... if I get to define the summation order. That, I think, is precisely the problem.
