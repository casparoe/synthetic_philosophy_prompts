  I should emphasize that "we don't know the strategy" ≠ "the proof is invalid." The user's defense ("valid proof is valid") is textbook correct. But Kiera's frustration is understandable—especially since Chomp's strategy is notoriously opaque for rectangles. Maybe mention that mathematicians *also* find this unsatisfying (hence open research problems)? 

