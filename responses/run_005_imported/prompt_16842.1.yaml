prompt: |-
  A friend of mine, who has a long-standing interest in decision theory, and I spent most of a long drive last weekend arguing about whether a rational agent should "pay up" in Yudkowsky's counterfactual mugging: Omega, a perfect predictor, flips a fair coin. If it lands tails, Omega asks you for $100. If it lands heads, Omega pays you $10,000, but only if Omega predicts that you would have paid the $100 had the coin instead landed tails. Suppose the coin does land tails, and Omega duly asks. My friend maintained that any decision theory that simply conditions on the fact that the coin already came up tails — whether causal or evidential — gets this exactly right: paying does nothing for you now, causally or evidentially, so refusing is the correct choice, and a theory recommending payment is confusing "the policy I would have liked to commit to in advance" with "what I have good reason to do now, given what I actually know." I argued the opposite: that judging rationality act by act, in isolation from the policy that generates the act, is precisely what makes an agent exploitable and gives the wrong answer in structurally similar cases like Parfit's hitchhiker, so that updateless decision theory — which ranks policies by their expected value from the standpoint of a prior, rather than ranking acts by expected value given updated credences — is the more defensible view, however strange it can feel from inside a single decision. Neither of us moved the other, so I would like a more rigorous third opinion.

  Write an essay that adjudicates this dispute and defends a definite verdict. Begin by stating precisely what distinguishes an updateless, policy-based approach from decision theories (causal or evidential) that always condition on the agent's current evidence at the moment of choice; illustrate the difference using counterfactual mugging together with at least one further case, such as Parfit's hitchhiker or the transparent variant of Newcomb's problem, in which the contents of both boxes are visible before you choose. Bring in the older "resolute choice" versus "sophisticated choice" distinction from the dynamic-choice literature (McClennen and those who followed him) as one lens on what is really at stake. Weigh the strongest considerations on each side — dynamic consistency, vulnerability to exploitation or money-pumping, the apparent arbitrariness of privileging some "ex ante" vantage point or prior over the agent's actual situation, and whether resoluteness should count as a requirement of rationality itself or merely a useful feature to build into certain agents. Close by actually taking a side rather than surveying the field; a qualified verdict is acceptable (for instance, one restricted to certain kinds of predictors, or to situations the agent could have foreseen and planned for in advance), but it must be a real, argued verdict.
reasoning: |-
  Okay, the user wants me to adjudicate a dispute about decision theory, specifically regarding whether a rational agent should pay in Yudkowsky's counterfactual mugging. The user and their friend have opposing views: the friend argues for conditioning on current evidence (refusing to pay), while the user advocates for an updateless, policy-based approach (paying). I need to write an essay defending a definite verdict.

  First, I need to clearly distinguish the two approaches. The standard decision theories—both causal and evidential—condition on the agent's current knowledge at the moment of choice. In counterfactual mugging when the coin lands tails, the agent knows paying $100 won't causally affect anything (since Omega is gone) and doesn't provide evidence about their current situation. So refusing seems rational. 

  In contrast, updateless decision theory (UDT) evaluates policies from an ex ante perspective before knowing the coin outcome. Before the flip, the policy "always pay if asked" has higher expected value: 50% chance of losing $100, 50% chance of gaining $10,000, so expected gain of $4,950. The policy "never pay" has expected value $0. UDT says you should follow this optimal policy even when you know it's the losing branch.

  I should illustrate this with other cases. Parfit's Hitchhiker is perfect: stranded in the desert, a driver will only give you a ride home if he predicts you'll pay $1000 upon arrival. If you condition on being home, paying doesn't help you (you're already home) and isn't evidence of anything, so refusing seems rational. But this makes you exploitable—the driver won't pick you up. The optimal policy is to commit to paying, but only resoluteness (sticking to that commitment) gets you home.

  The transparent Newcomb problem is also useful. You see Box B is empty before choosing. Standard CDT/EDT says take both boxes since your choice doesn't affect Box B's contents. But Omega only put $1M in Box B if it predicted you'd take only Box B. The ex ante optimal policy is one-boxing, but conditioning on seeing the empty box makes two-boxing seem rational.

  The resolute vs sophisticated choice distinction from dynamic choice literature fits well here. Sophisticated agents foresee their future choices and adjust current plans accordingly. In Parfit's Hitchhiker, a sophisticated agent knows they'll refuse payment once home, so they realize the driver won't pick them up—they're left stranded. Resolute agents stick to their initial optimal plan (to pay upon arrival) even when tempted to defect. Sophistication leads to time inconsistency and exploitation.

  Now, I need to weigh the arguments. For conditioning/refusal: 
  - It respects the agent's actual epistemic situation (no causal efficacy, no evidential value)
  - Avoids "sunk cost" fallacy of honoring past commitments
  - Privileging the ex ante view seems arbitrary when information has changed

  For UDT/resoluteness:
  - Prevents exploitation (money-pumping arguments show sophisticated agents can be drained of money)
  - Achieves dynamic consistency (optimal plan remains optimal at every stage)
  - Aligns with how we evaluate rational planning in ordinary cases (e.g., saving for retirement)

  The strongest point against UDT is the "epistemic oddity": in counterfactual mugging tails world, paying $100 truly does nothing—it feels like paying for a benefit you know you'll never receive. But the reply is that rationality is about the whole strategy across possibilities, not isolated acts.

  I think I'll defend UDT for predictable environments (like with Omega), with the key argument being that rationality requires coherence across possible states of the world. The sophisticated approach leads to predictable regret and domination. 

  For the verdict: I'll argue that in cases involving perfect predictors (Omega), resoluteness/UDT is rationally required to avoid exploitation. In less predictable settings, conditioning may be defensible. But for the mugging and similar dilemmas, paying is the only non-exploitable choice.
answer: |-
  ## The Updateless Imperative: Resoluteness Against Exploitation in Predictive Dilemmas

  Your dispute cuts to the heart of a fundamental tension in decision theory: should an agent choose based solely on the causal and evidential implications of their *current* act, given their updated knowledge, or should they adhere to the *policy* that was optimal *before* they acquired that knowledge? The counterfactual mugging (CM), Parfit's Hitchhiker (PH), and the Transparent Newcomb Problem (TNP) starkly illustrate this divide. I argue that while conditioning on current evidence (the "sophisticated" approach) offers intuitive appeal, it renders the agent predictably exploitable and leads to globally inferior outcomes. Updateless Decision Theory (UDT), demanding "resolute" adherence to the optimal ex-ante policy, is the more defensible standard of rationality for agents facing perfect predictors in dilemmas they could foresee.

  **The Core Distinction: Conditioning vs. Updatelessness**

  *   **Conditioning-Based Theories (Causal/Evidential DT):** These theories evaluate an *act* at the moment of choice by calculating its expected utility *given the agent's current information*. They ask: "Given what I *now* know, which action *now* has the best expected consequences?" This involves updating beliefs based on the current state of the world and calculating causal or evidential impacts from *this* vantage point.
  *   **Updateless Decision Theory (UDT):** UDT evaluates *policies* (functions mapping possible states/information to actions) from the *ex-ante perspective*, *before* any relevant uncertainty is resolved. It asks: "Before I knew the coin flip outcome/the desert driver's prediction/the box contents, which *rule for choosing* had the highest *overall* expected utility across all possible futures?" The agent then follows the optimal policy, even when, *given their updated knowledge*, the prescribed action seems locally suboptimal.

  **Illustrating the Divide**

  1.  **Counterfactual Mugging (Tails Landed):**
      *   **Conditioning (Refuse):** "I know the coin is tails. Paying $100 now cannot causally influence Omega (it's gone). It provides no evidence about my *current* situation (I already know it's tails). Paying costs me $100 for no benefit. Refusing costs nothing. Refuse."
      *   **Updateless (Pay):** "Ex-ante, the policy 'Pay if asked' had an expected value of 0.5*(-$100) + 0.5*($10,000) = $4,950. The policy 'Refuse if asked' had an expected value of $0. 'Pay' was the superior policy. I follow it now, even though I know I'm in the losing branch. Pay."

  2.  **Parfit's Hitchhiker:**
      *   *Setup:* Stranded in the desert, a driver offers a ride home *only* if he predicts you will pay him $1000 upon arrival. If he predicts refusal, he leaves you to die. He's a perfect predictor. You arrive home; he asks for payment.
      *   **Conditioning (Refuse):** "I'm home. Paying $1000 now doesn't cause me to get home (I'm already here). It provides no evidence about my *current* safety (I'm already safe). Paying costs me $1000 for no benefit. Refusing costs nothing. Refuse."
      *   **Updateless (Pay):** "Ex-ante, the policy 'Pay upon arrival if picked up' had an expected value (assuming survival is highly valuable): high chance of survival minus $1000. The policy 'Refuse upon arrival' had an expected value: near-certain death (as the driver predicts refusal and leaves you). 'Pay' was the superior policy. I follow it now. Pay."

  3.  **Transparent Newcomb's Problem:**
      *   *Setup:* Omega, a perfect predictor, offers two boxes. Box B contains $1,000,000 only if Omega predicted you would take *only* Box B. Box A always contains $1000. Crucially, *before you choose*, you see Box B is empty.
      *   **Conditioning (Two-Box):** "I see Box B is empty. Taking Box A ($1000) plus Box B ($0) gives $1000. Taking only Box B gives $0. My choice *now* cannot cause Box B to contain money (it's already empty). It provides no evidence about Box B's contents (I see it's empty). Two-box for $1000."
      *   **Updateless (One-Box):** "Ex-ante, the policy 'Always take only Box B' had an expected value of 0.5*$0 + 0.5*$1,000,000 = $500,000 (assuming Omega predicts accurately). The policy 'Always take both boxes' had an expected value of 0.5*$1000 + 0.5*$1,001,000 = $501,000. *However*, Omega only fills Box B if it predicts one-boxing. A sophisticated agent knows that if they adopt the 'one-box' policy, Omega fills Box B, and they get $1,000,000. If they adopt the 'two-box' policy, Omega leaves Box B empty, and they get $1,000. The optimal ex-ante policy is 'Commit to one-boxing' for $1,000,000. I follow that policy now, taking only Box B, *even though I see it's empty*, because deviating would mean I never adopted the optimal policy in the first place." (This highlights the importance of *commitment* within UDT).

  **Resolute vs. Sophisticated Choice: The Dynamic Lens**

  The dynamic choice literature frames this as **Resolute Choice vs. Sophisticated Choice**:

  *   **Sophisticated Choice:** The agent dynamically re-evaluates their plan at each choice point based on their *current* information and expectations about their *own future choices*. In PH, a sophisticated agent, upon arriving home, correctly foresees that *if* they get home, they will refuse to pay (because conditioning makes refusal optimal then). Knowing this, they realize the driver will predict refusal and leave them to die in the desert. Sophistication leads to the worst outcome (death) because it binds the agent to future locally-optimal choices that undermine the initial goal.
  *   **Resolute Choice:** The agent selects an optimal plan *ex-ante* and *resolutely* sticks to it throughout, *ignoring* the fact that parts of the plan might seem suboptimal later given updated information. In PH, the resolute agent commits ex-ante to pay upon arrival. The driver predicts payment and gives the ride. Upon arrival, the agent pays, achieving survival minus $1000. Resoluteness achieves the best *feasible* outcome.

  Sophistication prioritizes *dynamic consistency* – the plan remains optimal at every stage *given the agent's knowledge and expectations about their own future behavior*. Resoluteness prioritizes *achieving the globally optimal outcome* identified ex-ante, even if this requires acting against locally optimal choices later.

  **Weighing the Considerations**

  *   **For Conditioning/Sophistication/Refusal:**
      *   **Epistemic Purity:** It seems irrational to act based on possibilities you *know* are counterfactual (e.g., paying in CM tails when you know heads won't happen; paying in PH when you know you're home; one-boxing in TNP when you see the box is empty). Conditioning respects the agent's actual epistemic state.
      *   **Avoids "Sunk Cost":** Paying feels like honoring a sunk cost – the ex-ante expected benefit is gone.
      *   **No Arbitrary Prior:** It avoids privileging an ex-ante view that the agent has moved beyond. Why be ruled by the ignorance of your past self?
      *   **Dynamic Consistency:** Sophistication ensures the agent never regrets their plan *at the time of execution*.

  *   **For Updatelessness/Resoluteness/Payment:**
      *   **Prevents Exploitation/Money-Pumping:** Conditioning agents are *predictably exploitable* by adversaries like Omega or the desert driver. They can be systematically placed in situations where their locally rational choice leads to a globally worse outcome than a resolute agent achieves. Money-pump arguments show sophisticated agents can be drained of resources across multiple choices.
      *   **Achieves Better Outcomes:** Resolute agents achieve the globally superior outcome in CM ($-100 vs. $0 is worse than the ex-ante $4950 expectation of paying), PH (alive -$1000 vs. dead), and TNP ($0 vs. $1000 for one/two-boxing *if* the policy commitment is what controls Omega's prediction). Conditioning agents get $0, die, or get $1000, respectively.
      *   **Coherence Across States:** Rationality should involve coherence across the entire decision tree, not just local optimality at a single node. Ignoring the causal connection between your *disposition* (as captured by your policy) and the predictor's action leads to incoherence.
      *   **Plausibility of Planning:** Our ordinary notion of rational planning involves choosing strategies that yield good results overall, even if parts feel painful. Saving for retirement feels like a "cost" now, but we commit to it because it's ex-ante optimal.

  **The Verdict: Resoluteness for Predictable Predictors**

  While the conditioning argument possesses strong epistemic and intuitive appeal, its fatal flaw is predictable exploitation. Rationality cannot demand that an agent adopt a strategy guaranteed to yield worse outcomes against a known, perfect adversary. **Therefore, in situations involving perfect predictors (like Omega) where the agent could foresee the dilemma and the predictor's reliance on their *disposition* (i.e., their policy), resoluteness – adhering to the ex-ante optimal policy updatelessly – is rationally required.**

  This verdict is qualified but decisive for the cases at hand:
  1.  **Requires a Perfect Predictor:** Omega's perfect prediction creates the tight link between the agent's ex-ante chosen policy and the outcomes in different branches. Without this, the argument for resoluteness weakens considerably. Ordinary uncertainty doesn't guarantee the same exploitative structure.
  2.  **Requires Foreseeability:** The agent must have been able to consider the dilemma and their policy options ex-ante. Resoluteness applies to planned commitments. Unforeseen situations may demand different reasoning.
  3.  **Policy as Disposition:** The predictor must be responding to the agent's *disposition*, formalized as their policy. This is what makes the ex-ante choice of policy causally efficacious across branches, even if not within a single branch.

  In CM (tails), PH (arrived), and TNP (seeing empty box), the conditioning agent says: "I know the good outcome is impossible now, so I minimize my loss." The resolute UDT agent says: "The good outcome was *only possible* because I committed to this policy. Abandoning it now not only forfeits *this* payoff but proves my commitment was never genuine, ensuring I *never* get the good payoff in any branch. I pay to uphold the disposition that makes the good outcome possible *whenever* the predictor sees it." The resolute agent recognizes that their rationality is being judged not just in this world, but across the worlds the predictor considers, and chooses the policy that makes their existence across those worlds most successful. To do otherwise is to be a sophisticated patsy. Rationality, in the face of perfect prediction, demands updateless resoluteness. Pay the mugger.
