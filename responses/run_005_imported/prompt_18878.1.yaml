  Hmm, the user wants a move-by-move analysis of Marcus and Ilana's arguments, plus a verdict. I recall this touches on classic problems in causation theory - specifically causation by omission and the distinction between causality vs responsibility. The key tension seems to be between physical counterfactuals and normative expectations.

  First, Marcus's opening claim that Sam caused the corruption "plain and simple" feels intuitive but oversimplified. He's conflating causality with blameworthiness from the start. Ilana's counterpoint about infinite possible preventers is strong - if we accept "could have prevented" as sufficient for causation, we get absurd overattribution. Her sysadmin example effectively shows the problem.

  When Marcus introduces the on-call duty as the differentiating factor, he's making a valid normative distinction but still confusing causal and moral domains. Ilana's physical symmetry argument ("the disk doesn't know about spreadsheets") is philosophically sound - duties can't alter physical causation. But her position leads to the uncomfortable conclusion that everyone with SSH access casually caused the corruption.

  Ah, and here's where it gets interesting: Marcus correctly points out that Ilana's view contradicts ordinary usage, which matters for theories of causation. But Ilana's final move about the rotation not affecting physical outcomes is technically correct - if the lab never had a rotation, the disk still fills up identically. 

  Both are missing Schaffer's point about contrastive causation - we need to specify the relevant baseline. Also, Mackie's INUS conditions might help: Sam's omission was an insufficient but necessary part of an unnecessary sufficient condition for the corruption, whereas Priya's wasn't necessary given Sam's role.

  For the verdict... Ilana wins on strict causal analysis but Marcus captures why we naturally attribute causation to Sam. Since the user asked for philosophical rigor rather than folk intuition, I'll side with Ilana while acknowledging the practical importance of normative frameworks. The \answer should reflect that.
answer: |-
  Let's break this down step by step, referencing key philosophical concepts (e.g., Schaffer on contrastive causation, Mackie's INUS conditions, Hart & Honoré on normative baselines):

  ### (1) Marcus: Sam caused the corruption by not acting.
  * **Analysis:** Marcus captures *folk attribution* – we intuitively single out Sam. But he conflates **causation** with **responsibility**. Omissions require a baseline for "normal expected action" (Schaffer 2005). Sam's inaction *is* a departure, but calling it "plain and simple" causation ignores the metaphysical puzzle.  
  * **Who wins?** Superficially Marcus, but philosophically shallow. **Ilana** sets up the real challenge.

  ### (2) Ilana: Priya (and others) also didn't act, so "didn't prevent" can't define omission-causation.
  * **Analysis:** Ilana correctly identifies the **overdetermination problem**. If causation requires only *possible prevention*, then countless agents (Priya, sysadmin, SSH users) "caused" it. This violates causal parsimony and ordinary intuition (Hall 2004). Her reductio is strong against naïve counterfactual theories.  
  * **Who wins?** **Ilana** lands a critical blow. Marcus’s initial view is untenable.

  ### (3) Marcus: Sam's on-call duty creates a non-arbitrary difference.
  * **Analysis:** Marcus introduces **normative context** (duty/role) to restrict the baseline. This resolves the overdetermination: only Sam’s omission violates the *expected norm* (Hart & Honoré 1985). It explains *why* we attribute causation to Sam but not Priya.  
  * **Who wins?** **Marcus** recovers ground. Duties *do* define the relevant baseline for omissions (e.g., not watering *your* plant vs. a stranger’s).

  ### (4) Ilana: Duty tracks blame, not causation. Physical/counterfactual facts are identical.
  * **Analysis:** Ilana makes a crucial **physicalist objection**: the disk fills identically regardless of duty assignments. Causation should depend on physical/counterfactual dependencies (Lewis 1973), not social facts. If Sam/Priya share identical counterfactuals (e.g., "if either had acted, corruption wouldn’t occur"), their causal status *should* be symmetric.  
  * **Who wins?** **Ilana** on strict metaphysics. Duties aren’t *physical* causes. Marcus must explain how norms alter causal facts.

  ### (5) Marcus: Rejecting duty leads to absurd overattribution, indicting counterfactual theories.
  * **Analysis:** Marcus highlights **explanatory cost**. If a theory says "dozens caused it," but nobody believes that, the theory fails to match intuition (a key test for causal theories). Ilana’s view implies widespread causal overdetermination for preventable harms, which seems implausible.  
  * **Who wins?** **Marcus** scores on pragmatic grounds. A theory denying the Sam/Priya asymmetry is counterintuitive.

  ### (6) Ilana: The on-call rotation didn’t change the physical outcome.
  * **Analysis:** Ilana’s **physical symmetry** point stands: the corruption mechanism is identical with/without a duty roster. Norms explain *responsibility*, but not *causation* (Bernstein 2014). If causation is grounded in physics, duties can’t create it retroactively.  
  * **Who wins?** **Ilana** on ontological rigor. The disk crash is physics, not sociology.

  ---

  ### What Both Miss
  - **Contrastive Causation** (Schaffer): Causation isn't binary but *contrastive*. "Sam's omission (rather than Priya's) caused the corruption (rather than no corruption)" can be true because we contrast Sam *acting* vs. *not acting* (his normal duty), but not for Priya.  
  - **INUS Conditions** (Mackie): Sam’s omission is an *Insufficient but Necessary part of an Unnecessary Sufficient condition* for the corruption. Priya’s omission isn’t *necessary* given the system’s reliance on Sam.  
  - **Causal Selection**: We pick "the" cause contextually (e.g., "the spark caused the fire," ignoring oxygen). Sam’s omission is *salient* due to duty, not metaphysically unique (Halpern & Hitchcock 2015).

  ---

  ### Verdict
  Ilana wins on strict metaphysical coherence: causation is grounded in physical counterfactuals, not duties. But Marcus wins on explaining *why* we attribute causation asymmetrically – norms define the baseline for omissions. Overall, **Ilana’s physicalist challenge is stronger**; duties explain blame, not causation.  

  \answer{Ilana}
