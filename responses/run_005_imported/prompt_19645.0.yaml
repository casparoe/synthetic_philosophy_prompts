  I'll structure the draft with: 1) background on the protocol, 2) analysis of the dilemma, 3) specific recommendation with rationale, 4) future principle, and 5) counterargument engagement. The tone should be pragmatic, not activist, focusing on procedural fairness. Phrases like "not within our charge" and "beyond our competence" reinforce jurisdictional limits, while directing to veterinary consultation shows due diligence.

  Finally, I'll note that this approach keeps the door open for future policy shifts without committing to ad hoc reviews now. That should satisfy both cautious members and those concerned about welfare.
