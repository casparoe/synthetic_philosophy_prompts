  ### Explanation of the Probability Mismatch

  Your confusion arises from two different approaches to decision-making under uncertainty: the **global (ex-ante) perspective** and the **local (ex-post) perspective**. Both methods seem reasonable but address subtly different questions, leading to different optimal probabilities. This discrepancy is a recognized issue in probability theory and decision science, often discussed in contexts like precommitment vs. time consistency. I'll break this down step by step, using your scenario.

  #### Key Elements of the Problem
  - **Rewards and penalties**: 
    - Going through the second door: +$200 bonus.
    - Going through the first door: -$50 fine.
    - Skipping both doors: $0.
  - **Constraints**:
    - You cannot distinguish the doors and have no memory of past events during the walk.
    - You must use a fixed probability \( p \) to go through any such door, applied consistently at each encounter.
    - Once you go through a door, you exit the corridor; if you skip, you proceed to the next door (if it exists).

  #### The Global (Ex-Ante) Perspective
  This approach involves calculating the optimal \( p \) before the night starts, maximizing your expected earnings over many nights. It considers all possible outcomes and their probabilities based on your fixed strategy.

  - **Expected value calculation**:
    Let \( p \) be the probability you go through a door when encountered.
    - **Scenario 1**: Go through the first door (probability \( p \)).
      - Outcome: -$50 (fine).
    - **Scenario 2**: Skip the first door (probability \( 1 - p \)) and go through the second door (probability \( p \)).
      - Outcome: +$200 (bonus). Probability: \( (1 - p) \times p \).
    - **Scenario 3**: Skip both doors (probability \( (1 - p) \times (1 - p) = (1 - p)^2 \)).
      - Outcome: $0.

    The expected value \( E(p) \) per night is:
    \[
    E(p) = [p \times (-50)] + [(1 - p)p \times 200] + [(1 - p)^2 \times 0] = -50p + 200p(1 - p)
    \]
    Simplify:
    \[
    E(p) = -50p + 200p - 200p^2 = 150p - 200p^2
    \]

    This is a quadratic function (a downward-opening parabola). To maximize \( E(p) \), find the vertex at \( p = -\frac{b}{2a} \), where \( a = -200 \) and \( b = 150 \):
    \[
    p = -\frac{150}{2 \times -200} = \frac{150}{400} = \frac{3}{8} = 0.375
    \]

  - **Optimal global strategy**: Set \( p = \frac{3}{8} \). This yields an expected value of approximately $28.13 per night:
    \[
    E\left(\frac{3}{8}\right) = 150 \times \frac{3}{8} - 200 \times \left(\frac{3}{8}\right)^2 = \frac{450}{8} - \frac{1800}{64} = \frac{3600}{64} - \frac{1800}{64} = \frac{1800}{64} = \frac{225}{8} = 28.125
    \]

    This strategy works because it balances the risk of a fine at the first door with the opportunity for a bonus at the second door. By sometimes skipping the first door (even though it might be costly), you preserve the chance to reach the second door.

  #### The Local (Ex-Post) Perspective
  This approach reasons from the moment you stand in front of a door, with no memory of prior events. You might intuitively feel that, subjectively, it is equally likely to be the first or second door (i.e., 50-50). However, this assumption is incorrect because the probability depends on your strategy \( p \), and it ignores how you arrived at that point.

  - **Incorrect 50-50 assumption**:
    If you assume \( P(\text{first}) = 0.5 \) and \( P(\text{second}) = 0.5 \), the expected value of going through is:
    \[
    E(\text{go through}) = (0.5 \times -50) + (0.5 \times 200) = -25 + 100 = 75
    \]
    Since 75 > 0, you conclude you should always go through (\( p = 1 \)). But this leads to poor outcomes: if you always go through, you always get the first door (since you never reach the second), resulting in \( E = -50 \) per night.

  - **Correct local probability (dependent on \( p \))**:
    When at a door, the probability it is the first door depends on \( p \). From probability theory:
    - You always encounter the first door (probability 1).
    - You encounter the second door only if you skipped the first (probability \( 1 - p \)).
    - The total expected encounters per night: \( 1 + (1 - p) \) (since you always have one encounter with the first door, and a second with probability \( 1 - p \)).

    The conditional probability that you are at the first door given an encounter is:
    \[
    P(\text{first} \mid \text{encounter}) = \frac{1}{2 - p}
    \]
    Similarly:
    \[
    P(\text{second} \mid \text{encounter}) = \frac{1 - p}{2 - p}
    \]

    For example, at the global optimum \( p = \frac{3}{8} \):
    \[
    P(\text{first} \mid \text{encounter}) = \frac{1}{2 - \frac{3}{8}} = \frac{1}{\frac{13}{8}} = \frac{8}{13} \approx 0.615
    \]
    \[
    P(\text{second} \mid \text{encounter}) = \frac{1 - \frac{3}{8}}{2 - \frac{3}{8}} = \frac{\frac{5}{8}}{\frac{13}{8}} = \frac{5}{13} \approx 0.385
    \]

    The expected value of going through at this point is:
    \[
    E(\text{go through} \mid \text{encounter}) = \left(\frac{8}{13} \times -50\right) + \left(\frac{5}{13} \times 200\right) = \frac{-400}{13} + \frac{1000}{13} = \frac{600}{13} \approx 46.15
    \]
    Since 46.15 > 0, going through seems better than skipping (which gives $0). However, this suggests deviating from \( p = \frac{3}{8} \) to a higher \( p \), which would reduce global expected value.

  - **Time-consistent local strategy**:
    To avoid the temptation to deviate, you might seek a \( p \) where, at the moment of decision, you are indifferent between going through and skipping (i.e., \( E(\text{go through} \mid \text{encounter}) = E(\text{skip} \mid \text{encounter}) = 0 \)). Solving:
    \[
    E(\text{go through} \mid \text{encounter}) = \frac{1}{2 - p} \left[ -50 + 200(1 - p) \right] = 0
    \]
    \[
    -50 + 200 - 200p = 0 \implies 150 - 200p = 0 \implies p = \frac{150}{200} = \frac{3}{4} = 0.75
    \]
    At \( p = \frac{3}{4} \), the local and global expected values are both $0, and you have no incentive to deviate. However, this is worse than the global optimum ($28.13 vs. $0).

  #### Why the Two Approaches Disagree
  - **Different questions**:
    - The global perspective answers: "What fixed probability \( p \) should I commit to in advance to maximize my long-run average earnings?" This requires precommitment to handle the trade-off between immediate rewards and future opportunities.
    - The local perspective answers: "Given that I am at a door now, and I believe certain probabilities about which door it is, what action maximizes my immediate expected value?" But this ignores how your strategy affects the likelihood of being at each door, and it can lead to time inconsistency (e.g., at \( p = \frac{3}{8} \), you want to deviate locally).
  - **The core issue**: The 50-50 assumption in the local view is flawed because \( P(\text{first}) \) is not 0.5—it is usually higher (e.g., about 0.615 at \( p = \frac{3}{8} \)) and depends on \( p \). Even with correct probabilities, local optimization ignores the value of preserving future options (e.g., skipping a door might allow a better outcome later). This is a classic tension in decision theory, similar to problems like the "absent-minded driver" paradox.

  #### Which Probability Should Govern Your Hand?
  - **Recommendation**: Use the global optimum \( p = \frac{3}{8} \). This maximizes your expected earnings ($28.13 per night) and is the rational choice when you can precommit to a strategy.
  - **Why precommitment is valid**: You are alone, and nothing prevents you from randomizing with \( p = \frac{3}{8} \) at each door using a pre-determined method (e.g., a random number generator on your phone). Sticking to this avoids the pitfall of local reasoning, which would lead to \( p = 1 \) (always go through) or \( p = \frac{3}{4} \) (indifferent but suboptimal).
  - **Practical implementation**: At each door, generate a random number (e.g., from 1 to 8) and go through only if it is 1, 2, or 3 (since \( \frac{3}{8} = 0.375 \)). This ensures you follow the optimal strategy consistently.

  #### Final Thoughts
  - **Mistake in local reasoning**: The 50-50 assumption is a common error; it arises from neglecting that the probability of being at the first door is inherently higher due to the sequence of decisions. Always verify such intuitions with probability rules.
  - **Philosophical note**: This mismatch highlights how human intuition often favors local, myopic optimization, even when global precommitment yields better results. In your case, precommitment leverages the structure of the problem (the two-door sequence) to your advantage.
  - **Outcome**: With \( p = \frac{3}{8} \), you will earn the $200 bonus about 23.4% of nights, incur the $50 fine about 37.5% of nights, and get $0 about 39.1% of nights, averaging $28.13 per night.

  By precommitting to \( p = \frac{3}{8} \), you respect the global optimal strategy and avoid being misled by local uncertainties. Stick with this when you stand at the door.
