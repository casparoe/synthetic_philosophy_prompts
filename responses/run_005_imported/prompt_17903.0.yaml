  - Evidence-based medicine (DSM included PGD for a reason) vs social construction concerns
  - Clinical utility vs philosophical caution

  The solution should probably balance both concerns. Maybe recommend adopting PGD diagnosis but with strict safeguards? And crucially, building in research to monitor looping effects. The timeframe for review is essential - this can't be a "set it and forget it" decision.

