  Dworkin's point requires trapping her in the "reasoning vs replication" dilemma. If she claims society deeply reasons about morals, press for proof. If she says consensus matters regardless, force her to admit this could validate prejudice. The polygamy follow-up is smart - it's a less charged example than homosexuality to expose contradictions.

  Noticing the user didn't mention Mill, but harm principle contrasts are essential context. Question 5 bridges this well by making her defend why non-harmful acts deserve punishment. The follow-up about tradeoffs (stability vs liberty) is brutal in a good way - no philosophical dodging there.

  Also appreciate question 6's design: Making her confront modern pluralism destabilizes Devlin's homogeneous society assumption. The "which morality" follow-up is the knife twist - either she admits dominance of one group's values or retreats to vagueness.

  Final question about modern relevance is crucial. If she can't point to contemporary examples beyond historical homosexuality laws, the theory feels archival. Follow-up about LGBTQ+ rights intentionally makes her reconcile past errors with current logic.

