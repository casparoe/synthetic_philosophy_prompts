answer: |-
  Here are 8 sharp interview questions designed to push beyond Devlin's slogans, incorporating your specific requests, with strategic follow-ups:

  1.  **Targeting the Disintegration Thesis (Beyond the "Vibe"):**
      *   **Question:** Professor, Devlin argued that society *literally disintegrates* without legal enforcement of shared morality. Beyond historical examples like the fall of Rome (which historians debate), what specific, measurable social processes or mechanisms *prove* that private, consensual, non-harmful acts (like historical homosexual acts or adultery) actively cause societal collapse? How do we distinguish correlation from causation here?
      *   *Likely Answer/Follow-Up:* (If she cites vague "weakening of bonds" or historical decline) *"You mention [X] weakening bonds. But how do we empirically isolate the impact of *private* immorality laws from other factors like economic stress, war, or political instability in those examples? Can you point to a modern society that collapsed *specifically* because it stopped legally policing private morality?"*

  2.  **Challenging the "Reasonable Person's Disgust":**
      *   **Question:** Devlin's test relies on the "intolerance, indignation, and disgust" of the "reasonable person." But isn't this deeply problematic? Historically, this "disgust" test justified criminalizing interracial marriage, homosexuality, and even mixed bathing. Doesn't this standard often simply codify the majority's prejudice at a specific time, mistaking familiarity for reasonableness? How is it *not* just prejudice with a fancy legal label?
      *   *Likely Answer/Follow-Up:* (If she argues disgust signals deep moral intuition or societal health) *"But if 'disgust' is such a reliable moral compass, why has its target shifted so dramatically over time? Was the 'reasonable person' disgusted by interracial marriage in 1950 correct, and the reasonable person today wrong? Doesn't that prove it's culturally contingent prejudice, not reasoned morality?"*

  3.  **Dworkin's "Parroting" Critique (No Wiggle Room):**
      *   **Question:** Ronald Dworkin argued that much of what Devlin calls society's "shared morality" isn't the product of genuine, independent moral reasoning, but rather people uncritically "parroting" each other or inherited biases. If the public's moral outrage is often just conformity or unreflective tradition, why should the law give it such decisive weight in punishing private acts? Doesn't this risk law becoming an enforcer of mob mentality or inertia?
      *   *Likely Answer/Follow-Up:* (If she downplays "parroting" or emphasizes consensus value) *"Let's grant that consensus exists. If that consensus stems significantly from non-rational factors like tradition, fear of the 'other,' or social pressure rather than reasoned debate about harm or justice, why does it deserve legal enforcement? Isn't the law supposed to rise *above* mere popular sentiment, especially when it infringes on liberty?"* OR (If she insists people *do* reason) *"What evidence do we have that the average person engages in deep moral reasoning about private acts they find distasteful, rather than reacting emotionally or deferring to authority/peers?"*

  4.  **The Burden of Proof & Harm Principle:**
      *   **Question:** Hart, following Mill, argued the state needs a strong justification (like preventing harm) to restrict liberty. Devlin shifts the burden, suggesting society needs no proof of harm to ban acts based on moral outrage. Why should the immense power of the criminal law – with its stigma and violence – be triggered by mere feelings of disgust or disapproval *without* demonstrating tangible harm? Isn't the burden rightly on those who want to use state coercion?
      *   *Likely Answer/Follow-Up:* (If she argues moral harm *is* harm/society *is* the victim) *"If society itself is the victim of private immorality, how do we quantify that harm in a way distinct from simply saying 'people feel bad about it'? Isn't defining societal harm purely by collective sentiment circular?"*

  5.  **The Slippery Slope of "Morality":**
      *   **Question:** Devlin's principle allows criminalization based on prevailing moral feelings. But how do we prevent this from becoming a tyranny of the majority over minority practices they simply dislike? If society feels intense disgust towards, say, polygamy among consenting adults in a closed community, or certain dietary/religious practices, doesn't Devlin's logic *require* their criminalization, regardless of harm? Where's the limiting principle?
      *   *Likely Answer/Follow-Up:* (If she suggests limits via reasonableness or gradual change) *"But the 'reasonable person' standard *is* the majority standard by definition. If the majority finds polygamy inherently disgusting and destabilizing *today*, why wouldn't Devlin's logic demand its prohibition? How does his theory protect deeply unpopular minorities?"*

  6.  **Pluralism vs. Homogeneity:**
      *   **Question:** Devlin assumed a relatively homogenous society with one dominant morality. Modern societies are deeply pluralistic, with diverse moral frameworks coexisting. In this context, whose "shared morality" should the law enforce? Doesn't using the criminal law to enforce *one* group's moral views (even if a majority) on others who find the acts morally neutral or positive inherently create conflict and resentment, *undermining* the social cohesion Devlin sought?
      *   *Likely Answer/Follow-Up:* (If she argues a core morality persists or is necessary for cohesion) *"What constitutes this 'core' morality in a pluralistic society? Isn't the attempt to define and legally enforce it precisely what fuels the cultural conflicts Devlin feared? Couldn't respecting diverse private moralities *within* a framework of public harm rules actually promote greater stability?"*

  7.  **Alternatives to Criminal Law:**
      *   **Question:** Even if a shared morality is vital, why is the *criminal law* the necessary or best tool to sustain it? Couldn't families, communities, religious institutions, education, and social norms maintain moral standards effectively for private, non-harmful conduct without resorting to state punishment, imprisonment, and the creation of criminals?
      *   *Likely Answer/Follow-Up:* (If she argues law is a necessary backstop or symbol) *"But isn't using criminal law for purely symbolic purposes, especially against private acts, a dangerously blunt instrument? Doesn't the collateral damage of criminal records, prison, and stigma vastly outweigh the symbolic benefit for acts that hurt no one?"*

  8.  **Modern Relevance & Past Errors:**
      *   **Question:** Looking at history, laws based purely on enforcing moral disgust (sodomy laws, miscegenation laws, bans on birth control) are now widely seen as profound injustices and violations of liberty. Doesn't this track record seriously undermine Devlin's thesis? What contemporary examples can you point to where criminalizing *truly private, consensual, non-harmful* conduct *solely* based on moral disgust is both necessary for social cohesion and *not* likely to be viewed as a similar injustice in the future?
      *   *Likely Answer/Follow-Up:* (If she struggles for current examples or cites contested cases) *"If the clearest historical applications of Devlin's principle are now condemned as wrong, and compelling modern examples of purely victimless 'immoral' acts needing criminalization are hard to find, doesn't this suggest the principle itself is flawed or dangerous? How do we avoid repeating past mistakes using his framework?"* OR (If she cites something like bestiality or incest - *push hard on consent/harm*) *"But aren't concerns in those cases often rooted in *potential* for coercion, harm, or inability to consent, moving them closer to a harm principle? Can you identify an example where *none* of those factors apply and the *only* justification is disgust?"*

  **Key Strategies Embedded:**

  *   **Demand Specifics/Evidence:** Questions 1 & 8 force her to move beyond abstract claims to concrete proof and examples.
  *   **Highlight Historical Contingency/Prejudice:** Questions 2 & 8 use history to challenge the reliability of "disgust" and moral consensus.
  *   **Challenge Rationale & Burden of Proof:** Questions 3 & 4 attack the foundation of giving weight to unexamined sentiment and shift the burden.
  *   **Expose Majoritarian Tyranny:** Questions 5 & 6 focus on the threat to minorities and pluralism.
  *   **Question Necessity of Criminal Law:** Question 7 offers alternatives.
  *   **No Easy Escapes:** Follow-ups anticipate common deflection tactics (e.g., "society *is* harmed," "consensus matters," "it's reasonable") and push back hard, demanding clearer justification or exposing contradictions.
  *   **Use Her Examples Against Her:** Follow-ups often take her potential answers and probe their weaknesses or implications.

  Good luck with the interview! Be respectful but persistent. Don't let assertions stand without scrutiny.
