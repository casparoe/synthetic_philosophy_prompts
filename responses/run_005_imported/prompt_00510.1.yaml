  Interventionist approach cuts through this by asking: what if we tweaked Billy's throw (made him miss)? Outcome unchanged. But tweak Suzy's throw? Bottle survives. So Suzy's the cause. This mirrors how engineers test autonomous systems - they simulate "what if we changed this sensor input?" not just "what if it didn't exist?" 

