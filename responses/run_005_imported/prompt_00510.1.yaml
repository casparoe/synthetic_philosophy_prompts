prompt: |-
  I'm working on a piece about how courts and engineers try to assign "cause" in self-driving car crashes, and I ended up down a total rabbit hole with a philosopher of science who kept contrasting counterfactual theories of causation (the Lewis-style "if not for X, Y wouldn't have happened") with interventionist theories (the Woodward/Pearl "what happens if you actually intervene on the variable" approach). She used this thought experiment about two assassins — like Suzy and Billy both throwing rocks at a bottle, but Suzy's rock gets there first — as a case where the counterfactual theory allegedly breaks down but the interventionist one supposedly handles it fine. Honestly I nodded along in the interview but I didn't really get why the two frameworks diverge on that case specifically, or why it matters so much to people working on this stuff. Could you break down, in a pretty intuitive way, what's actually different about how these two theories model causation, and why preemption cases like that are the classic stress test for it? I don't need the full formalism with structural equations, just enough that I can explain it to readers without butchering it.
