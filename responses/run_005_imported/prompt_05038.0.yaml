prompt: |-
  Ok so I've been down a rabbit hole reading alignment forum posts and a couple of arxiv papers this week. A bunch of people use "inner alignment failure" (from the mesa-optimizer framing) and "goal misgeneralization" (the DeepMind CoinRun example where the agent runs to the end of the level instead of grabbing the coin) pretty much interchangably, like they're just two names for the same failure mode. Can you actually compare the two properly for me - where each definition comes from, what each one technically requires (does goal misgeneralization actually need the model to be doing mesa-optimization internally, or not?), and whether one's basically a special case of the other or if they're genuinely different things. Kinda tired of nodding along whenever this comes up like the words are synonyms lol.
