  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...],
    "F": [...]
  }
  ```

  List: P.F. Strawson's reactive-attitudes naturalism (Galen's dad, ironically), Frankfurt-style mesh/identification compatibilism, Fischer & Ravizza's guidance control, Kane's event-causal self-forming actions, Susan Wolf's Reason View, Dennett's "elbow room" response, and just flatly denying the premise that being responsible for an action requires being responsible for the way you are.
