  Got a visiting speaker next month for our history-of-philosophy series -- a classical Chinese specialist defending Gongsun Long's white horse dialogue ('a white horse is not a horse') as genuine logical insight, not the sophistry Xunzi and the later tradition wrote it off as. I'm chairing the Q&A and really don't want it to just be her re-explaining the shape-vs-color argument and the extension argument again, everyone will already have that from the handout. Draft me 8-10 questions that push past that: one on the obvious objection that riding a white horse is just riding a horse, and how her reading actually defuses that instead of just redescribing it; one on whether her whole defense secretly leans on something like Hansen's mass-noun hypothesis about how classical Chinese nouns work, and if so whether that vindicates gongsun long or just relocates the puzzle into linguistics; and one that makes her cash out 'is' as identity vs 'is' as class-membership without smuggling in modern predicate logic that gongsun long never had access to. Add a follow-up keyed to her likeliest answer for each one, and end on a question about what a sharp critic at the time, with none of our apparatus, could've said that would've actually stumped him.
