answer: |-
  You're absolutely right to be skeptical - Danny's misunderstanding a critical mathematical concept, and confusing **expected value** (EV) with **risk management**. Here's a breakdown without complex math:

  1.  **Danny's Mistake (The Oversimplification):**
      *   He's correct that a +EV bet *should* be taken. Where he goes wrong is thinking the *size* of the bet should only be limited by the sportsbook's maximum.
      *   This ignores **variance** (natural swings) and **risk of ruin** (losing your entire bankroll).

  2.  **The Coin Flip Analogy (Understanding Risk of Ruin):**
      *   Imagine a coin slightly weighted in your favor: 55% heads (win), 45% tails (loss). You win even money (+100 odds) on heads. This is a +EV bet (expected profit per $1 bet = (0.55 * $1) + (0.45 * -$1) = $0.10, or 10% edge).
      *   **Danny's Strategy:** Bet 50% of your entire bankroll on *every single flip* because it's +EV.
      *   **What Happens:** You have a 45% chance of losing half your money *on the first flip*. If you lose, you bet 50% of the remaining half on the next flip. A few tails in a row decimates you. Even with your edge, the probability of *eventually* going bankrupt approaches 100% with this reckless sizing.
      *   **The Math:** This edge guarantees profit *if you can bet forever without going broke*. But betting too large per wager makes going broke *before* the edge manifests highly likely.

  3.  **The Smarter Math: The Kelly Criterion (Optimal Growth):**
      *   This is the mathematical answer Danny dismisses. It calculates the **optimal bet size** to *maximize the long-term growth rate* of your bankroll *while avoiding ruin*.
      *   **Formula Simplified:** `Bet Size (% of Bankroll) ≈ Your Edge / Odds`
          *   *Your Edge:* Danny claims 5% after vig (0.05).
          *   *Odds:* For a standard -110 bet (win $100 on $110 wager), the implied odds are 100/110 ≈ 0.909 (or decimal odds ~1.909).
      *   **Kelly Bet Size ≈ 0.05 / 0.909 ≈ 0.055 (or 5.5% of your bankroll).**
      *   **Why Kelly Matters:**
          *   **Maximizes Growth:** Bets this size grow your bankroll fastest *in the long run*.
          *   **Minimizes Risk of Ruin:** Bets this size make the probability of losing your entire bankroll virtually zero over time.
          *   **Betting More is *Suboptimal*:** Betting *more* than the Kelly fraction (like Danny wants to) *increases risk* (higher chance of ruin, wilder swings) *faster* than it increases *potential return*. The extra risk isn't worth the tiny extra potential gain.
          *   **Betting Less is Safer:** Betting *less* than Kelly (e.g., 1-2%) reduces volatility and risk of ruin even further, at the cost of slightly slower growth. This is often wise for pros (system uncertainty, emotional control).

  4.  **Why Danny's "All-In" Mentality is Flawed:**
      *   **Ignores Sequences:** Basketball results, even with an edge, happen in sequences. Losing streaks are inevitable. Betting a huge % per bet guarantees that a normal losing streak will wipe out a catastrophic chunk of the bankroll.
      *   **"Blowing Up" is Mathematical Certainty:** Betting significantly above the Kelly fraction makes blowing up the bankroll (or suffering devastating losses) a near certainty over time, *even with a genuine edge*. It's not loss aversion; it's probability.
      *   **Long Run vs. Your Run:** The "long run" where EV manifests requires *surviving* the short and medium term. Aggressive sizing prevents survival.
      *   **Pro's Aren't "Overly Conservative":** They understand Kelly. Betting 1-2% per wager isn't timidity; it's ensuring they survive variance, protect capital, and compound their edge sustainably. They know betting 5% or 10% per bet would put their entire operation at unacceptable risk of collapse.

  5.  **Practical Concerns for You:**
      *   **Is the Edge Real?** A 5% edge *after vig* on NBA player props is massive and incredibly hard to achieve consistently. Pros fight for 2-3%. Danny's sample size (a couple thousand bets) is decent but *not* conclusive proof against variance or potential flaws in his model. Has he accounted for *all* costs? Does his model still hold as the market evolves?
      *   **Bankroll Management (BRM):** This is the *essential* discipline Danny lacks. Kelly is the core of BRM. Ask Danny what *his* specific bankroll management strategy is. If the answer isn't "a fraction of Kelly" or something equally risk-averse, run.
      *   **Emotional Control:** Can Danny stick to a mathematical system during a brutal losing streak? His "bet max" attitude suggests he might chase losses or over-bet during wins.
      *   **Sportsbook Limits:** If Danny *is* successful, sportsbooks will limit his maximum bet size anyway, making his "bet max" strategy impossible. Kelly works within realistic limits.

  **The Verdict (In Simple Terms):**

  *   **You are mathematically correct.** Danny's strategy of constantly betting the maximum allowed percentage is a recipe for potential disaster, even *if* he has a real edge. It ignores the fundamental math of risk management (Kelly Criterion) and guarantees severe drawdowns or ruin during inevitable losing streaks.
  *   **Danny is wrong.** He's conflating "this bet is profitable" with "I should bet as much as possible." Professionals bet small percentages precisely *because* it's the mathematically optimal way to grow capital safely over time. Betting big is reckless, not rational.

  **What to Say/Do:**

  1.  **Acknowledge the Edge (Conditionally):** "Danny, if you truly have a 5% edge after vig, that's impressive. That means the bets themselves are good."
  2.  **Challenge the Sizing:** "But betting the maximum allowed every single time isn't mathematically optimal. Have you calculated the Kelly Criterion for your bets? It would suggest betting around 5-6% per wager *at most* for that edge. Betting more than that significantly increases the risk of blowing up the bankroll, even with your edge. That's not loss aversion; that's probability."
  3.  **Demand BRM:** "If I were to invest, I'd need to see a strict, mathematically sound bankroll management plan, likely based on a fraction of Kelly (like 1-2% per bet), to protect the capital from normal variance. Betting huge chunks is too risky, regardless of the edge."
  4.  **Be Prepared to Walk Away:** If Danny dismisses Kelly and BRM as "overly conservative," it's a massive red flag. He doesn't understand the math of long-term success in betting. Investing with him would be extremely high-risk, akin to gambling, not investing based on an edge.

  Stick to your guns. Your intuition about the risk of blowing up the pot is mathematically sound, while Danny's "bet max" philosophy is fundamentally flawed and dangerous for any bankroll.
