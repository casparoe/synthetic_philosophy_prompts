  First, the core elements: two independent premises (P1 and P2), a conclusion (C) that's only true if both premises are true, and a voting scenario where majority votes on premises force a different outcome than direct vote on conclusion. The story must show both aggregation methods as internally coherent. No explicit explanations - just characters feeling uneasy.

  The setting needs tension where logical outcomes have real stakes. Medical ethics came to mind - a quarantine decision where false positives/negatives carry human costs. A clinic during an outbreak feels visceral: symptoms and exposure are natural independent premises, quarantine the conclusion. 

  I considered making the medics specialists (epidemiologist, clinician, field medic) to show diverse perspectives. Their votes should feel justified individually: 
  - Dr. Aris (epidemiology) votes P1 yes (symptoms fit), P2 no (no exposure proof), so C no
  - Nurse Basak (clinician) votes P1 no (atypical presentation), P2 yes (exposure likely), so C no
  - Medic Chen (field experience) votes both yes → C yes

  Premise-based voting: P1 passes (2 yes), P2 passes (2 yes) → forced quarantine. But direct vote on C fails (only 1 yes). The paradox emerges organically when the administrator notices the contradiction.

  Key nuances:
  - Made P2 deliberately ambiguous (unconfirmed rumors) so votes feel reasonable
  - Chen's tie-breaking vote on premises creates dramatic irony
  - Ending hangs on procedural dilemma - administrator's hesitation leaves students room to debate

  Word count is tight at 900 words. Cut medical jargon, focused on sensory details (rain, flickering lights) to heighten tension without exposition. Avoided naming the dilemma - just showed Aris feeling unsettled by the "arithmetic ghost". 

  Tested the logic twice: 
  Premise-based: P1 (Y/N/Y = majority Y), P2 (N/Y/Y = majority Y) → C must be Y 
  Conclusion-based: direct vote (N/N/Y = majority N)
  Perfect contradiction with all individual judgments consistent.

  Hope this gives students that delicious cognitive itch to dissect in seminar. The medical stakes make the procedural choice feel urgent, not abstract.
