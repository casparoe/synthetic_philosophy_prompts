  Here's an original 980-word story set in a remote mountain rescue station, designed to embody the discursive dilemma without ever naming it:

  ---

  **The Summit Call**

  Rain lashed the windows of the Eagle's Nest rescue station, turning the pre-dawn blackness into a smear of reflected halogen lights. Inside, the air hung thick with damp wool, stale coffee, and the sharp tang of ozone from crackling radios. Three figures huddled around the scarred oak table: Lena, the station chief, her face etched with decades of squinting into storms; Kai, the young, tech-savvy meteorologist; and Rhys, the pragmatic ex-mountaineer with a prosthetic leg and a sixth sense for the mountains.

  For twelve hours, they’d tracked the faint, desperate SOS signal: a solo climber, Eva Rostova, attempting the treacherous North Ridge of Mount Soren. Her last garbled transmission, eight hours ago: *"...summit push... weather closing... icefall unstable..."* Silence since.

  Now, the storm had swallowed Soren whole. Winds howled at 80 knots; visibility near zero. Sending a team out now wasn’t rescue, it was suicide. But waiting meant Eva, if still alive, faced hypothermia or avalanche. They had to decide: **Commit the rescue team immediately (C)?**

  Lena knew the protocol. Two critical, independent questions determined the answer:

  1.  **P1: Is the climber highly likely to be in immediate, life-threatening peril if not reached within the next 2 hours? (Peril)**
  2.  **P2: Is there a viable, safe-enough route for the rescue team to reach the climber's last known position within 4 hours? (Access)**

  Only if *both* were true could they justify sending the team into the teeth of the storm. Lena called for a vote on the premises and the conclusion, protocol demanding they record both paths.

  "Alright," Lena rasped, her voice raw. "Vote on Peril first. P1: Is Eva Rostova in immediate, life-threatening peril right now if we don't reach her fast?"

  *   **Lena (Yes):** "Twelve hours since her last signal, storm worsening. Hypothermia window's closing. That icefall she mentioned? It’s a deathtrap in this melt. If she’s stuck there... yes, immediate peril."
  *   **Kai (No):** "Her last ping showed her higher than the icefall, near the summit couloir. It’s marginally more sheltered. My models show a possible brief lull in wind shear above 10,000 feet in 90 minutes. *If* she’s there, and *if* she dug a snow cave... she might have bought a few extra hours. Peril is high, but not *immediate* within 2 hours. We have a sliver of time. Vote: No."
  *   **Rhys (Yes):** "Kai’s models are best-guess in this mess. Summit couloir? In this wind? It’s a wind tunnel funneling spindrift. She’d be buried alive trying to dig. Or swept off. No signal for eight hours in these conditions screams catastrophe. Immediate peril. Yes."

  **P1 Result: Peril? Yes (2-1)**

  "Now P2," Lena continued, the weight settling. "Access: Is there a viable, safe-enough route for our team to reach her LKP in 4 hours?"

  *   **Lena (No):** "The North Ridge approach is obliterated. Whiteout, hurricane winds, fresh loading on unstable slopes. The avalanche risk is Extreme. Sending a team up the gully we *might* use? It’s a runout zone for the entire west face. No viable route. It's not safe-enough. Vote: No."
  *   **Kai (Yes):** "I mapped a potential workaround. Traverse below the west face seracs, cut up the old surveyor's track – steep but sheltered by the ridge spine – then traverse laterally to the couloir base. Radar shows slightly less accumulation there. It’s brutal, high-risk, but... viable? Barely. Marginally safer than doing nothing for Eva, *if* she’s alive. Vote: Yes."
  *   **Rhys (Yes):** "Kai’s route is the only shot. Surveyor's track is sketchy but doable with fixed lines. I’ve done it in worse. The traverse is exposed, but the wind direction *might* keep some slabs from sliding onto it. It’s on the edge, Lena, the very edge... but I think it qualifies as 'safe-enough' given the stakes. Vote: Yes."

  **P2 Result: Access? Yes (2-1)**

  Lena stared at the tallies. Premise-Based Procedure dictated the outcome: Both P1 (Peril - Yes) and P2 (Access - Yes) were affirmed by majority vote. Therefore, **Conclusion: Commit the Team (C) - Yes.** Protocol demanded she give the order.

  But something snagged. "Hold on," she muttered. "We also vote directly on the conclusion itself. Final safeguard. **C: Commit the rescue team immediately?** Vote."

  *   **Lena (No):** "My gut screams no. The route Kai proposes... it *might* be viable on paper, in a sim. But out there? Right now? One misstep, one slab releases... we lose the whole team *and* don't save Eva. The risk is unacceptable. No."
  *   **Kai (No):** "If Peril isn't absolutely immediate – and I voted it wasn't – then committing the team now, into maximum danger, is premature. We should wait 90 minutes, see if the lull materializes, get clearer data. Then reassess Access. Sending them now, based on *my own* barely-there Access route? Feels reckless. No."
  *   **Rhys (Yes):** "Peril's immediate. Access exists. It’s our duty. Every minute counts. Yes."

  **C Result: Commit the Team? No (2-1)**

  Lena froze, her finger hovering over the comms button. The rain drummed a frantic rhythm on the roof. The tallies glared from the logbook:

  *   **Premise-Based:** P1 (Peril) = Yes, P2 (Access) = Yes → Therefore **C (Commit) = Yes**.
  *   **Conclusion-Based:** Direct Vote on **C (Commit) = No**.

  Both paths were clear. Both followed the rules. Both used the same votes. But they pointed in opposite directions. Lena had argued *against* peril being immediate enough for Kai, and *against* access being safe enough for Rhys. Kai believed peril wasn't immediate *yet*, making commitment now wrong, even though he saw a route. Rhys saw both peril and access as sufficient for commitment.

  Kai frowned at the log. "That... doesn't look right. Two say she's in peril, two say we can get there... but two say don't go? How does that math work?"

  Rhys grunted, shifting his prosthetic. "The rules are the rules. You voted the facts, I voted the facts, Chief voted the facts. Facts say go. But the 'go' vote itself lost? Feels like the mountain’s playing tricks."

  Lena looked from the log to the storm-wracked window, then back to the comms unit. The protocol manual offered no guidance for when the two procedures diverged. Order the team out based on the premises? Or stand them down based on the direct vote? Each path felt coherent in its own way, yet utterly incompatible with the other. The lives of her team, and Eva Rostova, hung in the balance, suspended not just by the storm, but by the cold arithmetic of their collective judgment.

  Her hand remained suspended. The wind howled its own unanswered question into the night.

  ---

  **Why this works for your seminar:**

  1.  **Clear Logical Bones:**
      *   **P1 (Peril):** Independent assessment of the climber's situation.
      *   **P2 (Access):** Independent assessment of the rescue feasibility.
      *   **C (Commit Team):** Logically equivalent to P1 AND P2. Only commit if both peril *and* access are true.
      *   **The Split:** Premise-Based (P1 Yes, P2 Yes → C Yes) vs. Conclusion-Based (Direct C Vote = No).

  2.  **Embedded in Narrative:** The dilemma arises organically from the high-stakes decision-making process of the rescue team. No character explains judgment aggregation theory; they experience the confusion ("That... doesn't look right," "Feels like the mountain’s playing tricks").

  3.  **Ambiguous Ending:** Lena's suspended hand leaves the procedural conflict unresolved. *Should* they follow the premise-based outcome (commit) or the conclusion-based outcome (stand down)? The story provides arguments for both, forcing students to grapple with the core question: Which aggregation method is appropriate here, and why? The human cost makes the abstract dilemma concrete and urgent.

  4.  **Beyond the Courtroom:** The mountain rescue setting is visceral, high-stakes, and distinct from the overused legal example, encouraging genuine engagement with the paradox rather than pattern recognition.

  5.  **Character Justifications:** Each character's votes are clearly motivated by their expertise and perspective (Lena's experience/risk-aversion, Kai's data/reason, Rhys's pragmatism/duty), making the individual consistency believable and the collective inconsistency more striking.
