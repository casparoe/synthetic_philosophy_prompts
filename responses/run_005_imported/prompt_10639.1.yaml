answer: |-
  Here’s a dialogue between **Alex** (conciliationist) and **Morgan** (level-splitter), set in a living room where **Morgan** (post-wisdom teeth removal, on hydrocodone) is recalculating a flight layover for the third time. **Alex**, a friend holding a cup of tea, watches with concern. Both engage deeply with the core tensions you described.

  ---

  ### **SCENE:**  
  *Morgan sits slumped on a couch, scribbling on a notepad. Alex stands nearby, frowning.*  

  **Alex:**  
  Morgan, you just did the math *again*. 58 minutes in Denver. Boarding ends 15 minutes before departure, gate change could take 10–20 minutes, security re-check if she leaves sterile airside… it’s impossibly tight. But *look at you*. You’re pale, pupils dilated, and you’re on post-op hydrocodone. You can’t trust this calculation.  

  **Morgan:**  
  *(Without looking up)* 37 minutes from touchdown to deplaning. 12-minute walk to Gate B42. Boarding closes at 3:43 PM. She arrives at 2:57 PM. That’s 46 minutes minus 12 walking, leaves 34 minutes buffer. It’s *fine*. I’ve run it three times. The numbers don’t lie.  

  **Alex:**  
  But *you* might be lying to *yourself*. Hydrocodone impairs working memory and logical sequencing. That’s not speculation—it’s neurochemistry. You have higher-order evidence your faculties are compromised. Rationality requires you to downgrade your confidence here. David Christensen’s "epistemic self-doubt" cases make this exact point: when you get strong evidence your reasoning is impaired, you *must* conciliate. Ignoring it is bootstrapping!  

  **Morgan:**  
  *(Sets down the pen)*  
  Alex, I hear you. But let’s disentangle two things: the *content* of my belief, and the *testimony* about my reliability. The math is objectively correct. I just re-derived it cold. If I lower my confidence now, I’m not responding to a flaw in the reasoning—I’m surrendering to a *meta-claim* that my reasoning is flawed. Maria Lasonen-Aarnio is right: that’s how you lose knowledge you actually possess. Why should misleading higher-order evidence trump flawless first-order evidence?  

  **Alex:**  
  Because rationality isn’t just about getting the right answer—it’s about *how you manage your cognitive resources*. If you’re in a state where impairment is statistically likely (like opioid haze), treating your reasoning as reliable is question-begging! You’re *using* the compromised faculty to vouch for itself. That’s the bootstrapping danger. Elga’s "expert principle" applies here: when experts tell you you’re impaired, you defer.  

  **Morgan:**  
  But your "expert" here is *generic* pharmacology—not a diagnosis of *this specific calculation*. I’m not denying opioids impair people. I’m saying *this particular chain of reasoning* is intact. Look: the arithmetic is simple. Addition. Subtraction. Times printed right here *(taps flight itinerary)*. No complex inference. Where’s the actual cognitive distortion? You haven’t pointed to a *single error*—just waved at "impairment."  

  **Alex:**  
  That’s the insidious part! You wouldn’t *feel* the distortion. Confidence and clarity are symptoms of the impairment itself. Your certainty is literally a neurochemical artifact. And that’s why higher-order evidence isn’t "misleading testimony"—it’s diagnostic. If you dismiss it, what *couldn’t* you dismiss? A brain scan showing impairment? A sober friend catching an error you missed? Your view makes you invulnerable to self-doubt.  

  **Morgan:**  
  Not invulnerable. If you showed me I’d misadded 37 + 12, I’d recant instantly. That’s first-order defeat. But you’re asking me to distrust *all* my reasoning because of *global* impairment evidence. That’s like discarding a correct clock because it’s in a room full of broken ones. Lasonen-Aarnio’s "level-splitting" accepts the higher-order risk—yes, most of my cognition *is* impaired—but insists this belief survives because it’s *actually* well-founded.  

  **Alex:**  
  But how do you *know* it’s well-founded? You’re judging that from inside the impaired state! It’s circular.  

  **Morgan:**  
  It’s not circular—it’s *externalist*. My belief is justified because it *was* formed by a reliable process (basic arithmetic + flight data), even if I’m temporarily high-risk. The justification doesn’t vanish because of generic defeaters. Otherwise, knowledge becomes impossibly fragile. Imagine a scientist who calculates a trajectory correctly, then learns a colleague *suspects* she’s sleep-deprived. Must she discard her result? No! She checks if the reasoning holds. Mine does.  

  **Alex:**  
  But she’d check *because* she takes the higher-order evidence seriously. You’re refusing to check—you’re insisting it’s fine. That’s the akrasia: believing P while believing you shouldn’t believe P. And Christensen argues that’s inherently irrational. Your first-order and higher-order stances clash.  

  **Morgan:**  
  *(Leans forward)*  
  Only if we demand "epistemic coherence" at all costs. Sometimes the rational response is to say: "My faculties are compromised *in general*, but this belief? It’s an exception." Like a drunk person correctly stating their own name. The alternative is wild: if I conciliate, I abandon a true, justified belief because of *misleading* meta-evidence. That’s not rational—it’s capitulation to a falsehood.  

  **Alex:**  
  But rationality isn’t about truth—it’s about proper response to evidence. You *have* strong evidence you’re unreliable. The "akratic" stance isn’t a contradiction—it’s the *humane* response. You downgrade confidence precisely because you care about accuracy. Holding firm isn’t epistemic integrity—it’s hubris.  

  **Morgan:**  
  Or it’s anti-skeptical realism. If I’m right, conciliation just cost me knowledge. If I’m wrong, level-splitting risks error. But given the stakes—this is just a flight layover—I’ll risk being wrong to avoid surrendering to a phantom.  

  **Alex:**  
  *(Sighs, picks up the notepad)*  
  Then we’re at an impasse. You see this as protecting justification from misleading defeaters. I see it as bootstrapping. You’re not just risking error—you’re violating a core norm of epistemic self-governance.  

  **Morgan:**  
  And you’re elevating process over truth. Let’s call my mom. If she makes the connection, I’m right. If not, you are.  

  **Alex:**  
  *(Wryly)*  
  But can we trust *your* judgment to call her?  

  *(Morgan laughs, then winces, touching their jaw. Alex hands them an ice pack. The debate hangs unresolved.)*  

  ---

  ### Key philosophical moves made:  
  1. **Bootstrapping charge addressed:** Alex forces Morgan to confront circularity ("using compromised faculties to vouch for themselves"). Morgan counters with externalism ("justification survives if the *process* was reliable").  
  2. **"Throwing away knowledge" charge addressed:** Morgan frames conciliation as surrendering actual knowledge to misleading evidence. Alex reframes rationality as proper evidence response (prioritizing process over outcome).  
  3. **Nuanced stakes:** Morgan distinguishes *specific* vs. *global* impairment and invokes low-complexity reasoning as resilient. Alex emphasizes the inaccessibility of distortion from within the impaired state.  
  4. **No tidy resolution:** Both positions retain force. Morgan’s view protects against skepticism; Alex’s enforces intellectual humility. The call to Mom becomes an ironic nod to real-world verification—but even *that* requires trusting Morgan’s perception.  

  This mirrors the live academic dispute: conciliationists prioritize coherence and self-doubt; level-splitters prioritize externalist justification and anti-skepticism. Neither "wins," but the friction sharpens both views—exactly as you wanted.
