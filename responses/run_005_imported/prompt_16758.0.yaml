answer: |-
  Here is a eulogy draft that honors your advisor's unwavering eternalism, draws comfort directly from that view, respects her intellectual rigor, and remains accessible to a mixed audience, all within a 5-minute timeframe:

  ---

  **(Begin by acknowledging the setting and loss)**

  We gather here, hearts heavy with the sudden absence of [Advisor's Name]. The shock, the grief, the profound sense of loss we feel in *this* moment are real, and they are valid. [Advisor's Name] was a brilliant mind, a dedicated mentor, a fiercely principled thinker, and someone whose presence shaped so many of us.

  **(Introduce her core view simply, framing it as her conviction)**

  [Advisor's Name] dedicated her intellectual life to understanding time. She arrived at a profound and, for her, unshakeable conviction: that reality isn't just the fleeting *now*. She believed, with deep intellectual honesty, that the past, the present, and the future all exist – equally real, equally fixed, woven together into the vast fabric of the universe. She called this the "block universe." For her, moments weren't annihilated as they passed; they remained, eternally, part of reality's structure.

  **(Acknowledge the starkness, then pivot to the comfort inherent in the view)**

  This view can seem stark when faced with death. It offers no promise of her looking down, no whisper of an ethereal presence. She would have rejected that instantly, not out of coldness, but out of integrity – because it smuggled in a picture of time she spent her career dismantling. She demanded intellectual honesty, even here.

  But [Advisor's Name] also found a distinct kind of solace in this picture. She once pointed out – and I don't think this was merely academic for her – that if *only* the present moment were real, then every cherished instant of a life vanishes forever the second it slips away. The laughter, the insights shared over coffee, the quiet moments of understanding… gone, utterly and completely.

  **(Draw the comfort from eternalism itself)**

  Her view, her eternalism, offered a different kind of permanence. On her understanding, **nothing that was ever real about [Advisor's Name] ceases to be real.** The moment she defended her thesis – *real*. The time she patiently untangled a complex argument for a struggling student – *real*. Her fierce joy in a good debate, her dry wit, the spark of discovery in her eyes when a puzzle fell into place – *all* of these moments, *all* of the vibrant reality that was her life, are not erased. They are fixed, indelible parts of the universe’s history. They are *always there*, as real as this moment of our gathering.

  **(Connect it to her legacy and our experience)**

  The profound ache we feel isn't because she has ceased to exist in *every* sense. The ache comes because *we*, here in our present moment, can no longer interact with her *newly*. But the richness of her life, the impact of her work, the warmth of her character – these are not diminished. They are permanent features of reality. Her influence echoes not because she watches, but because the facts of her life and work are eternally *there*, shaping the paths we walk now.

  **(Conclude with gratitude and framing her legacy)**

  So, while we mourn the silence in her office, the unanswered emails, the future conversations that won't happen in *our* present, we can also find a grounding in her own fierce truth. [Advisor's Name] isn't *here* now, but the entirety of who she was – her brilliance, her rigor, her kindness, her arguments – remains an undeniable, unchangeable part of the universe she sought to understand. Her life wasn't a flicker extinguished; it is a complex, brilliant pattern forever woven into the fabric of reality.

  We are grateful for every real moment she shared with us. We honor her by remembering her honestly, by carrying forward the intellectual integrity she embodied, and by finding comfort, as she did, in the enduring reality of a life truly lived. Thank you, [Advisor's Name]. Your place in the block is secure, and your impact on us is profound and lasting.

  ---

  **Key elements and why they work:**

  1.  **Honors Her View Explicitly:** Clearly states eternalism/block universe as *her* conviction, using accessible terms ("fabric of the universe," "permanent features").
  2.  **Rejects Forbidden Comforts:** Explicitly dismisses "watching over" or "spirit" as intellectually dishonest *according to her view*.
  3.  **Uses Her Own Argument:** Integrates her point about presentism being "bleaker" naturally, framing it as the source of *her* solace, making it personal and authentic.
  4.  **Draws Comfort from Eternalism:** Focuses on the core eternalist tenet: **The past doesn't cease to be real.** Her life moments are "fixed," "indelible," "permanent features," "eternally there." This *is* the comfort.
  5.  **Acknowledges Grief Honestly:** Doesn't pretend eternalism removes the pain of present absence ("profound ache," "silence," "unanswered emails").
  6.  **Explains Grief within the Framework:** Posits that grief arises from *our* present inability to interact with her *anew*, not from her non-existence *in the past*.
  7.  **Focuses on Legacy:** Connects the permanence of past facts to her enduring impact on students, colleagues, and the field ("shaping the paths we walk now," "impact... is profound and lasting").
  8.  **Accessible Language:** Uses metaphors ("fabric," "woven," "pattern") and avoids jargon (A-series/B-series, tensed/tenseless). Explains "block universe" simply.
  9.  **Respects Audience:** Non-philosophers get the core idea of permanent reality; philosophers hear her precise view honored without dilution.
  10. **Personal Tone:** Mentions mentorship, conversations, her character traits ("dry wit," "spark of discovery"), grounding the philosophy in the person.
  11. **Appropriate Length:** Structured for roughly 4.5-5 minutes when spoken with feeling.

  This eulogy meets your requirements by finding genuine solace *within* the uncompromising framework she championed, offering comfort through the permanence of her reality in the past, rather than any form of persistence into the present or future. It respects her memory by being true to her life's work.
