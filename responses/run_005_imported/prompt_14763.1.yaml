  I should also address the "switching" case. Changing the causal route without affecting the outcome tests counterfactual dependence. Lewis might say the cause is necessary because without it, the outcome doesn't happen via the backup. Woodward's intervention on the switch variable shows the outcome remains, so the switch isn't necessary. This directly ties to the user's work with causal graphs, where the path matters.

