don't include all subsets. So the existence of a model for second-order ZFC in a countable metatheory is impossible. Therefore, second-order ZFC with full semantics only has models if the metatheory can provide uncountable sets, meaning the metatheory must be stronger, perhaps having uncountable sets itself.

