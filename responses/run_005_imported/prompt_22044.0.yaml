  I don't have any background in law, but I've spent the last couple of years reading Supreme Court opinions and statutory-interpretation scholarship on my own time, and I now run a small podcast on legal philosophy. Next week's guest is a scholar who defends textualism, and I want the conversation to go past the standard talking points. Draft eight to ten interview questions: I want at least one on the absurdity doctrine, since textualists insist they are only ever correcting an obvious scrivener's error and never importing legislative purpose, so ask how that line is supposed to hold up in practice; one on Karl Llewellyn's old observation that almost every canon of construction has an equally respectable counter-canon, and what that does to text-based reasoning's claim of being more determinate than the alternatives; and one asking her to defend, or distance herself from, the majority's reasoning in Bostock v. Clayton County, which several self-described textualists accused of being purposivism dressed up as textualism. For each of these three, add a follow-up question keyed to the answer she's most likely to give.
