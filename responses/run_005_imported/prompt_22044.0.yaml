answer: |-
  Here are 10 interview questions probing textualism's nuances, including your specified topics and strategic follow-ups designed to push beyond standard defenses:

  1.  **Core Tension:** Textualism claims to derive meaning solely from the enacted text's semantic context, rejecting judicial inquiry into subjective legislative intent or purpose. Yet, courts inevitably confront ambiguous or seemingly contradictory language. How does textualism *operationally* prevent a judge's own policy preferences or intuitions about "good law" from influencing the interpretive process, given that linguistic analysis isn't purely mechanical?

  2.  **The Absurdity Doctrine:** Textualists justify using the absurdity doctrine *only* to correct a "scrivener's error" – a demonstrable mistake in transcription – and emphatically *not* to import notions of legislative purpose or desired outcomes. **Question:** How can a textualist judge objectively distinguish between a true "scrivener's error" (e.g., a missing "not") and a result that seems deeply unwise, outdated, or unintended by the drafters, *without* implicitly relying on a judgment about what the legislature "must have meant" or intended to achieve?
      *   *Likely Answer & Follow-Up:* (If she emphasizes "objective linguistic evidence" of error) What *constitutes* sufficient "objective linguistic evidence" beyond mere outcome undesirability? If the only evidence is the statute's overall structure or the bizarre outcome itself, isn't the judge inevitably making a purposive judgment about what the structure *should* logically achieve or what outcome is *too* irrational to uphold?

  3.  **Llewellyn's Canons Critique:** Karl Llewellyn famously argued that for nearly every canon of construction (e.g., "expressio unius"), there exists an equally venerable counter-canon (e.g., "reddendo singula singulis"). **Question:** Doesn't this inherent flexibility in selecting which linguistic canons to apply undermine textualism's core claim to provide more objective, determinate, and predictable results than purposivism or intentionalism? Doesn't the choice of canon often reflect a pre-existing judicial inclination?
      *   *Likely Answer & Follow-Up:* (If she argues textualists use canons consistently based on semantic principles) How does textualism resolve situations where multiple, equally "textual" canons point in contradictory directions for the same statutory phrase? Doesn't the need to *choose* which linguistic principle governs in a specific conflict reintroduce significant judicial discretion, potentially influenced by unstated factors?

  4.  **Bostock & Purposivism in Disguise:** In *Bostock v. Clayton County*, the majority, claiming textualism, held that discrimination "because of sex" under Title VII includes discrimination based on sexual orientation or gender identity. Several prominent textualists (e.g., Justice Alito in dissent) argued this smuggled in modern purpose, ignoring the original expected application. **Question:** Was the *Bostock* majority authentically textualist? If so, how does its reasoning – focusing on the "but-for" cause and the "ordinary meaning" of the words in 1964 – avoid being labeled as a form of "purposivism" that elevates broad statutory goals over specific expected applications? If not, where did the majority depart from true textualist principles?
      *   *Likely Answer & Follow-Up:* (If she defends *Bostock* as textualist) Critics argue the "ordinary meaning" of "sex" in 1964 unambiguously *excluded* sexual orientation/identity, and the majority effectively adopted a broad *purpose* of eliminating sex-based discrimination to reach its result. How does textualism justify interpreting a term's "ordinary meaning" in a way that demonstrably encompasses consequences the enacting Congress likely never considered or intended, without crossing into purposivism?

  5.  **"Ordinary Meaning" & Context:** Textualism heavily relies on the "ordinary meaning" of words at the time of enactment. **Question:** How does textualism define the relevant "linguistic community" for determining "ordinary meaning"? Is it the general public, the relevant industry, or legislators/lawyers? How does it account for the fact that statutory language often operates within specialized technical or legal contexts that might deviate from common parlance?

  6.  **The Role of Precedent:** How does textualism reconcile its focus on the original enacted text with the doctrine of *stare decisis*, especially regarding long-standing statutory interpretations that a textualist might believe are linguistically incorrect? Does fidelity to the text sometimes require overturning settled precedent, potentially undermining stability?

  7.  **Textualism vs. Corpus Linguistics:** Corpus linguistics is increasingly used to provide empirical evidence of "ordinary meaning." **Question:** Is this tool a natural extension of textualism, or does its reliance on potentially vast datasets risk creating a new, overly complex form of judicial discretion in selecting and interpreting corpora? Can it truly resolve the ambiguities textualism faces?

  8.  **Textualism's Democratic Pedigree:** Textualism is often justified as promoting democratic legitimacy by enforcing only what the elected representatives actually enacted. **Question:** Doesn't this justification weaken when textualist interpretations produce results that seem contrary to the demonstrable, overwhelming consensus of the enacting legislature (even if not captured perfectly in the text), or when it binds modern citizens to meanings based on linguistic conventions from decades or centuries past?

  9.  **The Whole-Text Rule:** Textualists emphasize reading statutory language in context, considering the whole statute. **Question:** How does the "whole-text rule" functionally differ from purposivism's search for a coherent statutory scheme? Doesn't striving for internal coherence inevitably involve an element of discerning *why* the parts fit together, approaching purpose?

  10. **The Future of Textualism:** Where do you see textualist theory needing the most development or refinement to address persistent criticisms (like the ones we've discussed regarding absurdity, canons, and potential drift into purpose)? Are there any emerging strands within textualism attempting to tackle these challenges more directly?

  **Key Strategy Embedded:**
  *   **Absurdity:** Forces confrontation between the claimed limited "error correction" and the practical need to judge outcomes, pushing on the line between text and purpose.
  *   **Llewellyn:** Directly attacks the determinacy claim by highlighting the toolbox's inherent contradictions, forcing a defense of canon selection.
  *   **Bostock:** Exploits a major intra-textualist debate to probe whether textualism can *really* avoid purpose when language is broad or societal understanding evolves. The follow-up specifically targets the "meaning vs. expected application" tension.
  *   **Follow-Ups:** Designed to anticipate common textualist responses (objective error evidence, consistent canon use, ordinary meaning defense) and immediately challenge their sufficiency or expose potential contradictions.

  These questions should foster a deeper discussion about textualism's internal mechanics, limitations, and the practical challenges of maintaining its core boundaries. Good luck with the interview!
