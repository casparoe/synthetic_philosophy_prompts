prompt: |-
  So I'm a phil of mind PhD student and I've been TAing our department's philosophy of mind seminar this term, and the disjunction/indeterminacy problem for teleosemantics keeps coming up in office hours, so it's been rattling around in my head way more than is probably healthy. Quick context in case it's useful: on Millikan's selected-effects story, the frog's fly-snapping mechanism doesn't obviously represent "fly" rather than "small dark moving thing," since both descriptions are compatible with its actual selective history (flies just are a subset of small dark moving things, and the mechanism fires on BB pellets too). Millikan's fix in LTOBC is to say we shouldn't look at bare correlational history but at the "Normal explanation" for why tracking that property helped ancestral frogs survive and reproduce, and she thinks this privileges something like "nutritious bug" over the broader disjunctive description.

  I'm trying to write a dissertation section arguing this move doesn't actually work, and I keep talking myself in circles, so I want a clean, uncharitable-to-Millikan version of the argument to push against. Can you argue as forcefully as you can that appealing to Normal explanations doesn't solve the indeterminacy problem but just relocates it one level up -- i.e. that theres no non-question-begging way to fix which level of description (fly / nutritious bug / small-dark-moving-thing-with-erratic-flight) counts as THE Normal explanation, without already presupposing the very content-fact teleosemantics is supposed to deliver. Please actually engage with how Millikan individuates Normal explanations rather than just asserting "well, you could always redescribe it," and end with a clear verdict on whether this wrecks consumer-based/etiological teleosemantics generally, or is really just a problem for how Millikan specifically sets things up.
reasoning: |-
  Okay, the user is a Philosophy of Mind PhD student grappling with the disjunction problem in teleosemantics, specifically Millikan's Normal explanation approach. They need a strong, uncharitable argument against Millikan to structure their dissertation section. 

  First, I need to recall Millikan's core move: she shifts from correlational history to "Normal explanations" to solve indeterminacy (e.g., frog's mechanism represents "nutritious bug" not "fly" or "small dark thing"). The user's worry is that this just kicks the can up the ladder—how do we fix *which* Normal explanation is privileged without presupposing content?

  Hmm. The key is to attack how Millikan individuates Normal explanations. She relies on historical *proper functions* of the mechanism's consumers. But functions themselves are description-sensitive! For example, the frog's visual system's function could be described as: 
  - Detecting nutrients  
  - Triggering tongue snaps at small moving things  
  - Facilitating calorie intake  

  Each description implies a different "Normal condition" for success. Millikan would say we pick the one that explains *why* the mechanism was selected. But here's the dagger: the "why" is ambiguous without prior content assignment. 

  Example: if we say selection occurred because ancestors tracked "nutritious bugs," that assumes "nutritious bug" is the relevant category. But if we redescribe the selective history as tracking "small moving objects" (since that's all the mechanism *actually* discriminated), suddenly *that* seems explanatory. Millikan's appeal to "historically specific conditions" doesn't help—those conditions themselves are description-relative. 

  Worse, her solution might be circular: to fix the Normal explanation, we need the very content facts teleosemantics is supposed to *produce*. 

  Verdict: this cripples *any* consumer-based teleosemantics that relies on historical functions, not just Millikan's version. If functions are description-relativized, content remains indeterminate. The user should stress this isn't just a "redescription" quibble—it's about whether etiological functions can bear the weight of content fixation without smuggling in prior intentionality. 

  ...Time to sharpen the claws.
answer: |-
  Here's a deliberately uncharitable, forceful argument against Millikan's Normal explanation solution to the disjunction problem, focusing on its core structural weakness:

  **The Argument: Normal Explanations Don't Solve Indeterminacy; They Inherit It**

  1.  **Millikan's Proposed Solution:** The content of a representation (R) produced by mechanism (M) is fixed not by its actual historical correlations, but by the *Normal explanation* for why M's production of R contributed to the survival/reproduction of ancestors. This explanation cites the *condition* (C) whose detection was *historically necessary and sufficient* for M's success under Normal conditions. For the frog, C is "nutritious bug," not "fly" or "small dark moving thing" (SDMT), because flies were merely the *local instance* of C, and SDMT is too broad (includes non-nutritious things like BBs).
  2.  **The Individuation Problem for Normal Explanations:** Millikan individuates Normal explanations via the *proper function* of the *consuming system*. The function of the frog's snapping mechanism is to *ingest nutritious bugs*. Therefore, the Normal explanation for the success of the *fly-detecting mechanism* (M) must cite the condition (*nutritious bug*) that satisfies the *consumer's function*. M's function is derivative: to *supply* the consumer with representations when *nutritious bugs* are present.
  3.  **The Relocation of Indeterminacy:** This merely **relocates the disjunction problem to the level of consumer function specification**. How do we non-arbitrarily fix *the* description of the consumer's proper function? The frog's snapping mechanism has the *derived* proper function "ingest nutritious bugs." But this function description is *itself* one option among many co-extensive or overlapping descriptions compatible with the selective history:
      *   **Option 1 (Millikan's Preference):** "Ingest Nutritious Bugs" (INB)
      *   **Option 2 (Broader):** "Ingest Small Dark Moving Things" (ISDMT) - *This was reliably correlated with nutrition in the EEA.*
      *   **Option 3 (Narrower):** "Ingest Flies" (IF) - *Flies were the specific nutritious bugs present.*
      *   **Option 4 (Functional but Different):** "Trigger Tongue Extension Towards Moving Visual Stimuli" (TTETMVS) - *This describes the mechanism's output.*
      *   **Option 5 (Consequence-Based):** "Increase Caloric Intake" (ICI) or "Contribute to Homeostasis" (CH).
  4.  **Why Millikan's Apparatus Fails to Privilege INB:**
      *   **"Why" is Description-Sensitive:** Millikan argues we pick the description that explains *why* the mechanism was selected. But the "why" question is ambiguous. *Why* was snapping at SDMT selected?
          *   *Answer 1:* Because SDMTs *were nutritious bugs* in that environment (supports INB).
          *   *Answer 2:* Because snapping at *things visually detectable as SDMT* provided sufficient nutrition (supports ISDMT).
          *   *Answer 3:* Because snapping at *flies* (a subset of SDMT) provided nutrition (supports IF).
          *   *Answer 4:* Because *triggering tongue extension towards movement* reliably captured food (supports TTETMVS).
      *   **Historical Specificity Doesn't Bite Deep Enough:** Millikan emphasizes the "historically specific conditions." Sure, *in that specific past environment*, SDMT ≈ Nutritious Bugs ≈ Flies. But the selective history *only shows the mechanism responded to SDMT and this led to nutrition*. It doesn't show that the mechanism was *selected for* detecting the abstract property "nutritious bug" *as opposed to* the detectable property "SDMT" *or* the specific kind "fly." The success condition *was* nutrition, but the *detection strategy targeted* SDMT. **The historical facts underdetermine whether selection operated on the basis of the *input property detected* (SDMT), the *output consequence achieved* (nutrition), or the *specific kind instantiated* (fly).**
      *   **Consumer Function Relies on Prior Content:** Specifying the consumer's function as INB *presupposes* that the relevant condition for the consumer's success is *nutritious bug presence*. But this is precisely the content we're trying to fix for the *producer* mechanism! We need an independent way to fix the consumer's function description. If we describe the consumer's function as ISDMT (because its mechanism *only ever discriminated SDMT*, and that *happened* to yield nutrition), then the Normal explanation for the producer M *becomes* "M produced R when SDMT was present." If we describe the consumer's function as TTETMVS, then the Normal explanation cites "moving visual stimulus" as C. **The choice of consumer function description directly determines the Normal explanation, and thus the content, without a non-circular constraint.**
      *   **The "Local Instance" Dodge Fails:** Millikan dismisses "fly" because it was just the local instance. But "nutritious bug" is *also* just a description of the *local instances* that provided nutrition (flies, mosquitoes, etc.). Why is "nutritious bug" metaphysically privileged over "small airborne organic matter" or "flying insect" as the *type* selected for? The selective pressure was simply: *respond to SDMT gets food*. The type "nutritious bug" is a *theorist's interpretation* of *why* responding to SDMT worked, not necessarily the *property* the mechanism itself was selected for tracking. The mechanism demonstrably tracks SDMT, not the hidden nutritional property (it snaps at BBs!).
  5.  **The Verdict: Structural Collapse, Not Just Millikan's Flaw:**
      *   **Wrecks Consumer-Based/Etiological Teleosemantics Generally:** This argument strikes at the core of *any* consumer-based etiological theory. If content is fixed by the consumer's function, and the consumer's function is specified by the conditions under which *its* operation historically contributed to fitness, then **the disjunction problem recursively applies to the description of the *consumer's function itself*.**
      *   **Why It's General:** All etiological theories define function (and thus, for consumer-based views, content) by reference to historical selection *for* some effect. The fatal problem is that **"selection for effect E" is always selection under a description of E.** The historical causal chains are compatible with multiple descriptions of *what* was selected for (E1, E2, E3...), just like the producer's correlations. Millikan's Normal explanation move tries to use the consumer's function to break the symmetry for the producer, but the consumer's function suffers from the *exact same symmetry problem*. There's no non-circular, non-arbitrary way within the theory to privilege *one specific description* of the consumer's selected effect (e.g., INB over ISDMT or TTETMVS or ICI) as *the* function that then fixes the producer's content.
      *   **Millikan's Specific Setup:** While Millikan's apparatus (Normal conditions, derived proper functions, consumer focus) provides the *clearest framework* for making this relocation of indeterminacy visible, the underlying problem – **the description-relativity of "selection for"** – is inherent to the etiological approach to function and thus to any teleosemantics built upon it. Her specific appeal to consumer functions *exposes* this deeper problem but doesn't create it uniquely.

  **Conclusion:** Appealing to Normal explanations via consumer functions doesn't solve the disjunction problem; it **relocates the indeterminacy to the level of consumer function specification**. The historical facts of selection underdetermine the *correct* description of the consumer's proper function (e.g., INB vs. ISDMT vs. TTETMVS). Since the consumer's function description directly determines the Normal explanation and thus the producer's content, and there's no non-question-begging way within teleosemantics to fix *which* function description is correct, **the indeterminacy remains fatal.** This is a **structural problem for consumer-based etiological teleosemantics as a whole**, as it reveals an inescapable circularity or description-relativity at the very foundation of using "selected function" to fix representational content. Millikan's sophisticated apparatus highlights this problem starkly but cannot resolve it. The disjunction problem stands.
