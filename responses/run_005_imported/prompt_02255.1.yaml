prompt: |-
  Ok, this one's going to be pretty in the weeds, sorry in advance. I'm a second-year PhD student in philosophy, and a few weeks ago in my proseminar I made the mistake of saying, out loud, that a proposition is basically just "a bunch of objects and properties bundled together." My professor spent the next ten minutes very patiently dismantling that using Bradley's regress, in front of everyone. She's my advisor, and she's now decided that my seminar paper (due in two and a half weeks, and possibly the seed of my qualifying paper) is going to be on Bradley's regress and the unity of the proposition. I've since done a bunch of reading - the actual chapters in Appearance and Reality, the SEP entry, chunks of Gaskin's book, and I skimmed Jeffrey King's book on propositons - and I can reproduce the shape of the argument on command now, but I had office hours yesterday and realized within about two minutes that I don't understand this at the level she wants, I just said "right, right" a lot and nodded.

  Here's specifically where I get stuck. First: Bradley's regress is an infinite regress, but so is "p is true, and its true that p is true, and it's true that it's true that p is true," and everyone agrees that one is totally harmless. Armstrong and Orilia want to say the same thing about the relation/instantiation regress - that it's real but benign, exactly like the truth regress, rather than vicious. So what's actually doing the work in objections like Maurin's, which say this move doesn't answer the "how do the constituents get unified in the first place" question? Why doesn't the truth-regress analogy just settle it? Second: when Frege says concepts are "unsaturated" and objects are "saturated" or complete, and that's supposedly why they combine without needing some further relation to glue them - I can't tell if that's real explanatory work or just a fancier-sounding way of stipulating a stopping point, no different in kind from just saying "relating is what relations do, full stop." What does unsaturatedness actually buy Frege that a brute primitive doesn't?

  And third, since the paper specifically has to connect this to the philosophy-of-language side: how do the fancier contemporary theories of structured propositions actually map onto the old menu of metaphysical replies? Like, is Jeffrey King's idea - that a proposition just is a fact involving a sentence's constituents and an interpretation function - basically a linguistified version of the "facts are brute, irreducible unifiers" move (Armstrong/Olson), and is the Soames/Hanks story, where unity comes from the cognitive act of predicating rather than from anything in the proposition's own make-up, basically just relocating the "it just unifies itself" move into psychology instead of solving it? I'd genuinely rather you tell me straight if you think some of these are relabelings dressed up as solutions rather than actual solutions - my advisor clearly thinks most of the literature is exactly that, and I'd like to walk into her office with an actual opinion instead of a survey.
