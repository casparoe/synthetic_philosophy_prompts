  The verification hole seems critical: if the threatener can simulate you perfectly, why wouldn't it see through the surrogate? I'll structure this as a two-part question pressing the epistemology of deception under perfect simulation. For commitment races (where competing agents rush to commit first to threats), I need to explore how surrogates affect timing dynamics. The unverifiable commitments angle matters for real-world applications since humans can't cryptographically prove intentions.

  Beyond the requested three, I'll build out five more questions covering: 
  1) Foundation-setting definitions 
  2) Why surrogates beat direct commitments 
