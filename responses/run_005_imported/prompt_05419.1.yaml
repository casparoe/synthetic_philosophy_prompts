prompt: |-
  I've got a decision theorist booked for my podcast next week -- she works on 'acausal threats' (the game theory of blackmail between agents that can't causally interact, like a future AI that supposedly threatens to simulate-and-punish anyone who didn't help build it) and is known for defending 'surrogate goals' as the fix. I want to get past the Roko's basilisk meme version and into the actual mechanics, so can you draft me 8 interview questions? I definately want one that presses the obvious hole -- if the whole trick relies on the threatener being able to verify the commitment, why wouldn't a sophisticated enough threatener just see through the decoy and threaten the real goal anyway -- one on how the surrogate-goals thing is supposed to interact with the 'commitment races' problem, and one on whether any of this means anything for an agent, human or AI, that can't actually prove its commitments to anyone. Give each a follow-up keyed to whatever answer she's most likely give, and end on a question that makes her walk through one fully worked toy example, because everyone I've read on this just gestures at it in the abstract.
