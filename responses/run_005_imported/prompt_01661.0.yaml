answer: |-
  That's a brilliant and profound question that cuts to the heart of philosophy of language, metaphysics, and the history of science. You've perfectly identified the tension between practical expertise, linguistic reference, and scientific categorization. Philosophers like Saul Kripke, Hilary Putnam, and John Searle have wrestled with cases like this. Here’s how we can think about it:

  1.  **The "Mistake" Isn't About Expertise, But About Scientific Classification:**
      *   The artisans weren't *mistaken* about the *properties* they cared about: hardness, toughness, ability to take a high polish, beautiful colors, suitability for carving. Their expertise in identifying, working with, and valuing materials possessing *those specific properties* was genuine and accurate.
      *   Their "mistake" (from a modern perspective) was in assuming that a material possessing this unique *combination* of properties *must* correspond to a single underlying mineral structure. Modern mineralogy revealed that, surprisingly, two distinct mineral structures can produce a material meeting those functional criteria almost indistinguishably for pre-scientific purposes.

  2.  **"Jade" as a Functional or Practical Kind, Not (Just) a Natural Kind:**
      *   Kripke and Putnam argued that natural kind terms (like "water" or "gold") refer rigidly to substances with a specific underlying essence (H₂O for water, atomic number 79 for gold), even if we don't know what that essence is. Discovering the essence refines our understanding of *what* we were referring to all along.
      *   **"Jade" challenges this rigidly.** Ancient artisans weren't primarily referring to a hidden essence; they were referring to a material defined by its *manifest properties* and *cultural/functional role*. "Jade" successfully picked out *whatever stone possessed that unique suite of desirable characteristics* suitable for ritual objects, tools, and ornaments. Nephrite and jadeite both fit this bill.
      *   **Therefore, "jade" might be better understood as a *functional kind* or *practical kind* rather than a strict *natural kind*. Its reference was fixed by observable properties and uses, not by an assumed single hidden structure.**

  3.  **Did "Jade" Refer Successfully? Yes, But Not to a Single Natural Kind:**
      *   **Yes, it referred determinately:** The term "jade" successfully and determinately referred to a *class of materials* in the world that possessed the relevant properties (toughness, polishability, specific colors/feel). Artisans could reliably identify it, trade it, and work it. Their concept *did* latch onto something real in the world – stones with those characteristics.
      *   **No, it didn't refer to a *single* natural kind:** Modern science revealed that the class picked out by the functional concept "jade" comprises two distinct natural kinds (jadeite and nephrite) with different chemical compositions and crystal structures. The concept "cuts across" natural kinds because the functional properties it tracks are multiply realizable by different underlying structures.

  4.  **Resolution: Reference Grounded in Use and Properties:**
      *   The most satisfying way to think about this is that the ancient concept of "jade" **successfully referred to the functional kind** defined by its observable properties and cultural significance.
      *   **Discovery, not Failure:** The discovery of jadeite and nephrite wasn't a revelation that "jade" referred to nothing or failed. It was a discovery that *the functional kind "jade" is realized by two distinct natural kinds*. It refined our understanding of *what constitutes* the material fulfilling the jade role.
      *   **Context Matters:** What "jade" refers to depends on context:
          *   **Archaeology/Art History:** "Jade" often retains its broad, functional meaning encompassing both nephrite and jadeite artifacts, respecting the cultural concept.
          *   **Gemology/Mineralogy:** "Jade" is used precisely, specifying "jadeite jade" or "nephrite jade" (or using the mineral names directly), respecting the scientific classification.

  5.  **Analogy: Other Functional Kinds:**
      *   **"Fish":** Biologically, lungfish and coelacanths are more closely related to humans than to tuna. Yet, "fish" remains a useful functional/practical category for aquatic vertebrates with gills and fins, even though it doesn't map cleanly onto a single natural kind (clade) in modern phylogeny.
      *   **"Virus":** Are they alive? They don't fit neatly into the traditional "life" category defined by cells, but they form a functional kind based on their structure and behavior.
      *   **"Glass":** Can be made from silica sand (obsidian is natural glass), but also from polymers (plexiglass), volcanic ash (pumice), or even metal (metallic glass). It's defined by its amorphous structure and properties (transparency, brittleness), not a specific chemical composition.

  **Conclusion:**

  The ancient artisans were not "wrong" about jade in any way that undermined their expertise or the reality of what they worked with. Their concept of "jade" **successfully referred to a functional kind** – materials possessing a specific, highly valued set of physical properties and cultural uses. The discovery that this functional kind is realized by two distinct natural kinds (jadeite and nephrite) was a scientific advancement, not an exposure of a failure in ancient reference. It showed that the world can sometimes produce different underlying structures that fulfill the same functional role exceptionally well.

  Therefore, "jade" didn't fail to refer determinately; it referred determinately *to the functional kind*. The concept didn't "cut across" natural kinds in a failing way; it *correctly identified* that stones meeting its criteria existed, and science later revealed the surprising fact that there are two distinct ways nature produces such stones. Their knowledge was deep and accurate for their purposes; our scientific knowledge simply adds another layer of understanding about *how* nature achieves those remarkable properties.
