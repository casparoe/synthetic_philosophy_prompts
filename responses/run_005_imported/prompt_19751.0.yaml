  - **Finn (consequentialist)**: Failing to minimize total harm is itself a moral failure; randomness ignores outcome gravity. 

  Key tension points: 
  1. Can we truly compare "five tragedies vs one"? (Maya says no; Finn says obviously yes) 
  2. Is fairness about process or result? (Maya: coin-flip respects equality; Finn: equal concern requires weighting scales) 
  3. Does randomness absolve responsibility? (Maya: yes, it neutralizes bias; Finn: no, it's willful negligence) 

  User’s deeper need: They don’t just want ethics 101—they want the argument to *hurt*. Finn should corner Maya about the buoy group’s interdependence; Maya should make Finn squirm by reducing his logic to "triage by headcount." The Parfit/Scanlon influence means Finn might argue that *not* aggregating harm violates impartiality, while Maya could quote Scanlon’s contractualism back at him: "What could we justify to the single drowning man?" 

  ...Wait, should I let Maya "win" the moral argument but have Finn override her? Real crews have hierarchy. Or maybe the Captain interrupts—but user didn’t ask for that. Stick to two voices. 

  Names: "Finn" for the consequentialist (sounds sharp, no-nonsense); "Maya" for Taurek (softer, but steely). Avoid making Finn cold—he should care deeply, just differently. Maya’s coin-flip idea isn’t cowardice; it’s radical respect. 

  Dialogue beats: 
