  Hmm, the challenge here is making abstract ethics feel visceral in a life-or-death moment. The user clearly researched this—they name-dropped Taurek's coin-flip idea and want "real hits" in the dialogue. That means no strawmen; both characters need strong, nuanced arguments. 

