answer: |-
  You're both picking up on important aspects of Plato, but your friend is significantly oversimplifying and misapplying his complex view. Here's a breakdown:

  1.  **The Core Idea in the Laws: Wine as a *Test*, not a Revelation of the "True Self":**
      *   Plato *does* say in **Laws (Book I & II)** that wine can be a valuable tool to test character, especially in young people.
      *   His reasoning is this:
          *   **Lowered Inhibitions:** Wine weakens the rational, controlling part of the soul (the *logistikon*) and emboldens the appetitive and spirited parts (*epithymetikon* and *thymoeides*).
          *   **Revealing Existing Flaws:** This state makes it harder for a person to *hide* their base desires, lack of self-control, arrogance, or cowardice. Someone prone to anger might become violent; someone arrogant might become boastful; someone lustful might become inappropriate. The "mask" of social convention and rational control slips.
          *   **It Reveals Vulnerability to Vice, Not the "Essential Self":** Crucially, Plato isn't saying the drunk person is showing their *true, best, or essential self*. He's saying they are showing their *weaknesses* and *vulnerabilities* that are normally kept in check by reason and shame. It reveals the *parts of the soul that need controlling*, not the core identity.

  2.  **Why Your Friend is Partially Right (but Mostly Wrong):**
      *   **Partial Right:** Wine *can* reveal aspects of a person that are suppressed or hidden when sober – namely, their *lack of self-mastery* and their susceptibility to base impulses. If sober-Dave is always meticulously polite but drunk-Dave is cruel and insulting, Plato would say that cruelty was *always present* as a potential flaw; wine just removed the restraint.
      *   **Mostly Wrong - Misinterpretation of "Real":**
          *   **Plato's Ideal is Rational Control:** For Plato, the *highest* and most "real" (in the sense of best, most divine-like) part of a human is reason (*logistikon*). The appetites are a lower, animalistic part. Drunkenness diminishes the highest part and unleashes the lowest. Sober-Dave, using his reason, is expressing the *superior* part of his nature.
          *   **Performance vs. Virtue:** Your friend frames sobriety as a "performance." Plato would frame it as *virtue* and *self-governance*. The sober state isn't fake; it's the state where the soul is ordered correctly, with reason in charge. The drunk state is a state of *disorder* and *internal tyranny* by the appetites.
          *   **Trusting the Output?** Plato would absolutely **NOT** say we should trust the *judgments* or *readings* of drunk-Dave over sober-Dave. Drunkenness clouds reason. Drunk-Dave's "read" on the boss is likely to be emotional, impulsive, exaggerated, and lacking nuance – the *opposite* of the rational assessment Plato values. What wine *might* reveal is Dave's underlying *emotional biases* (e.g., an irrational fear of authority, a hidden resentment) that *could* color his sober judgment, but the *content* of the drunk judgment itself is unreliable.

  3.  **Socrates in the Symposium: The Embodiment of the Ideal:**
      *   You are absolutely correct to point this out. The **Symposium** is the perfect counterpoint.
      *   Socrates drinks *at least* as much as everyone else, yet remains completely sober and rational. He doesn't get sleepy, emotional, or lose control. He outlasts everyone, ending the night in deep philosophical conversation while others are passed out.
      *   **What This Demonstrates:** Socrates exemplifies the *perfectly ordered soul*. His rational part is so strong and in control that even a powerful disinhibitor like wine cannot overthrow it. His "true self" is *defined* by this unwavering rationality and self-mastery. The wine test *confirms* his virtue, it doesn't reveal a different, "truer" underlying character beneath a sober facade.

  4.  **So, Who Wins? (Dave Edition):**
      *   **Sober-Dave:** Represents the rational, controlled, potentially virtuous self that Plato sees as the ideal. His judgments, formed with reason, are inherently *more trustworthy* on matters requiring assessment (like reading a boss).
      *   **Drunk-Dave:** Reveals Dave's *vulnerabilities* and the *strength of his lower impulses*. He shows what Dave might be like *if reason completely failed*. This information is diagnostically useful about Dave's character flaws (e.g., is he prone to anger, lewdness, sentimentality, or cowardice when inhibition drops?), but his *specific judgments and actions while drunk* are products of impaired reason and should be heavily discounted. Trusting drunk-Dave's "read" on the boss is like trusting a malfunctioning instrument.

  **Conclusion:**

  *   **Your friend is wrong** to claim Plato thought the drunk self is the "real" self in the sense of being the *truest* or *best* self. Drunkenness reveals the *weaknesses* and *unruly parts* of the soul that reason *should* control.
  *   **You are closer to Plato's core ideal:** The sober, rational self (exemplified by Socrates) represents the highest human potential. Its judgments are superior.
  *   **Plato's Nuance:** Wine *is* a valuable diagnostic tool in Plato's view (Laws), but only for revealing *flaws* and *vulnerabilities* to vice, not for revealing reliable truths or judgments. It shows what needs *more* rational control, not what *is* truly real underneath control.
  *   **Regarding Dave:** Sober-Dave's read is inherently more reliable. Drunk-Dave's behavior might reveal *why* sober-Dave has a certain bias (if he does), or reveal Dave's lack of self-control, but his drunken opinions shouldn't be trusted over his sober ones. If drunk-Dave says something wildly different about the boss, it likely tells you more about Dave's emotional state or lack of inhibition than about the boss. Plato would side firmly with **sober-Dave** when it comes to whose judgment to trust.
