  Hmm, looking at the passage they quoted... Ah, I see why it's tricky. Aquinas layers biblical authority (1 Peter) with practical arguments about dangerous precedents and worsening oppression. The student's professor hinted at the usurper/tyrant distinction from the Sentences commentary - that's key. Aquinas isn't being inconsistent; he's drawing a legal fine line. 

  Let me reconstruct his reasoning: In De Regimine, Aquinas is talking about legitimate rulers who govern tyrannically. Here, the ruler's office itself is valid, so only public authority (like the Church or nobles) can depose them. But usurpers? They're criminals from day one - no legitimate authority to violate. That's why in the Sentences, a private citizen killing a usurper isn't "tyrannicide" but defense of the commonwealth against an aggressor. 

  The student's quote shows Aquinas mixing principle and pragmatism deliberately. The 1 Peter quote establishes the duty of obedience to all rulers (good or bad), while the consequences argument shows why violating that duty destabilizes society. They're complementary: the principle forbids it, and the pragmatic effects prove why the principle exists. 

  For the paper, I should emphasize how Aquinas' distinction between "title to rule" (acquisition) and "manner of rule" (exercise) resolves the apparent contradiction. The student might not realize how medieval political thought separated these concepts. Also worth noting: Aquinas isn't endorsing passive suffering - he provides constitutional alternatives like public deposition. That's his real solution.
answer: |-
  This is a brilliant question that cuts to the heart of Aquinas's political thought and the tension between principle and prudence. Let's untangle the *De Regimine Principum* passage and reconcile it with the earlier *Sentences* commentary.

  **1. Deconstructing the Passage from *De Regimine Principum* (On Kingship)**

  Aquinas presents a layered argument *against* private individuals killing tyrants, weaving together principle and prudence:

  *   **The Allure of Tyrannicide:** He acknowledges the historical precedent and the seeming heroism ("courage") of killing tyrants, even noting ancient honors bestowed for such acts.
  *   **The Apostolic Principle:** He immediately counters this with the foundational principle from 1 Peter 2:18-20: Subjects must be subject to masters ("not only to the good and gentle, but also to the froward"). This establishes a **categorical obligation of obedience to constituted authority**, regardless of its quality. This *is* a matter of principle. Authority, even badly exercised, derives ultimately from God's ordinance (Romans 13:1-2 is the broader context Aquinas operates within). Private individuals lack the *standing* or *jurisdiction* to judge and execute punishment on the ruler. Only God or a higher *public* authority holds that power.
  *   **The Prudential Dangers:** Aquinas then elaborates on *why* violating this principle is disastrous in practice:
      *   **Dangerous Precedent:** If private individuals can kill rulers they deem tyrants, this precedent will be abused far more often by the wicked ("more often the wicked than the good avail themselves of such a precedent"). It incentivizes rebellion based on subjective judgment.
      *   **Ruler's Fear:** Rulers, fearing assassination more than God's judgment for misrule, become more oppressive and insecure, prioritizing their own safety over good governance ("fear the loss of their power more than they fear to rule badly").
      *   **Risk to Good Rulers:** Even good rulers could be killed by those who merely *perceive* them as tyrants.
      *   **Failure of Liberation:** Tyrannicide rarely brings true liberty. Instead, it often sparks vengeance and leads to an even harsher regime ("stirred up to a fiercer domination than before").
  *   **The Public Authority Solution:** The conclusion reinforces the principle: Only *public authority* has the legitimate power ("jurisdiction") to act against a wicked ruler. This could mean a higher temporal authority (like an Emperor over a King), the community acting through its representatives (like nobles or elected officials), or even ecclesiastical authority in certain contexts.

  **Key Takeaway:** Aquinas's primary objection **is** a matter of principle – private individuals categorically lack the *jurisdictional authority* to judge and execute a ruler. The prudential arguments serve two crucial functions:
  1.  **Demonstrating the Wisdom of the Principle:** They show *why* God's ordinance (obedience to authority) is ordered towards the common good – violating it leads predictably to chaos and worse tyranny.
  2.  **Addressing the Counter-Example:** They explain why the seemingly virtuous acts praised by the ancients are, in the Christian dispensation and under the natural law principle of just authority, fundamentally flawed and dangerous *despite* appearing courageous.

  **Principle and prudence are intertwined:** The principle establishes *why* it's wrong; the prudential arguments powerfully illustrate *why adhering to the principle is necessary for social order* and *why deviating from it leads to ruin*. The 1 Peter quote provides the divine warrant; the prudential arguments provide the rational, natural law justification consistent with that divine command.

  **2. Reconciling with the Commentary on the *Sentences* (IV Sent. d. 49, q. 1, a. 4, ad 2)**

  Here's the crucial distinction Aquinas makes:

  *   **Tyrant by Usurpation (Tyrannus absque titulo):** This ruler has *no legitimate claim* to power. They seized it by force, fraud, or other illegitimate means. They are essentially a *private individual* posing as a ruler or an *aggressor* against the commonwealth.
  *   **Tyrant by Exercise (Tyrannus quoad exercitium):** This ruler has a *legitimate title* to rule (inheritance, election, etc.) but governs tyrannically – unjustly, oppressively, for private gain rather than the common good.

  **Aquinas's Position:**

  *   **Against Killing a Legitimate-but-Tyrannical Ruler (Tyrannus quoad exercitium):** This is the position argued forcefully in *De Regimine Principum*. Killing such a ruler is forbidden to private individuals. Only public authority can act.
  *   **Potentially Permitting Killing a Usurper (Tyrannus absque titulo):** In the *Sentences* commentary, Aquinas states that if a usurper seizes power by force and there is *no higher human authority available* to whom the people can appeal for redress, then *killing that usurper is not strictly speaking "murder"*. The usurper is not a true ruler but an aggressor. The private citizen who kills them to liberate the community acts (in a sense) as an agent of the common good in the absence of constituted authority, defending the polity against an unjust aggressor. Such an act *can* be praiseworthy.

  **Resolving the Apparent Contradiction:**

  There is **no fundamental contradiction**, only a crucial **distinction in the nature of the ruler's authority**:

  1.  **Legitimacy of Title (Titulus):** This is the *source* of the ruler's authority. Does their right to rule stem from a just source (law, custom, election, inheritance)?
  2.  **Legitimacy of Exercise (Exercitium):** This is *how* they use the power granted by their title. Do they rule justly for the common good, or tyrannically for private gain?

  *   **Legitimate Title + Tyrannical Exercise:** The ruler possesses *true authority* (from God, via the just title), even if they abuse it gravely. Therefore, only a higher *public authority* (possessing its own legitimate jurisdiction) can judge and depose them. Private individuals must obey the principle of submission. (*De Regimine* case).
  *   **Illegitimate Title (Usurper):** The "ruler" has *no true authority*. They are not a ruler *at all* in the eyes of God/natural law; they are a criminal aggressor occupying a position of power by force. Since they lack legitimate authority, the duty of obedience (1 Peter, Romans 13) *does not apply* to them in the same way. In the absence of higher authority, resistance (even lethal) by private individuals *can* be justified as defense of the community against an unjust aggressor, analogous to self-defense. (*Sentences* case).

  **What's Driving Aquinas in *De Regimine*?**

  1.  **Preserving the Divine and Natural Order of Authority:** The bedrock principle is that legitimate authority, even when abused, comes from God and demands submission. Undermining this principle risks the entire fabric of ordered society.
  2.  **Preventing Anarchy and Worse Tyranny:** Aquinas is deeply fearful of the chaos, vendettas, and descent into even greater oppression that historically follows private tyrannicide against *legitimate* rulers. His prudential arguments powerfully illustrate this.
  3.  **Championing Constitutional/Public Solutions:** He consistently points towards mechanisms *within* the framework of legitimate authority for dealing with tyrants – appeal to higher authority, deposition by the community *acting through its representatives* (e.g., nobles, estates), or even (implicitly) divine judgment/church action. He wants action against tyranny, but insists it must be *lawful* action by those with the *competence* to act.
  4.  **Distinguishing True Authority from Criminal Force:** The key to consistency is his clear demarcation between someone who *is* the legitimate ruler (but governs badly) and someone who is *merely a criminal holding power by force*.

  **Conclusion for Your Paper:**

  *   Aquinas's objection in *De Regimine* **is fundamentally principled** (lack of private jurisdiction rooted in divine/natural law obligation to obey legitimate authority).
  *   The prudential arguments **reinforce the principle** by demonstrating the catastrophic consequences of ignoring it, making the case that the principle exists *for* the common good.
  *   The apparent contradiction with the *Sentences* commentary **is resolved by the distinction between tyrant-by-usurpation (absque titulo) and tyrant-by-exercise (quoad exercitium)**. The former lacks legitimate authority entirely and can be resisted as an aggressor when no public recourse exists; the latter possesses legitimate authority and thus cannot be judged or killed by private individuals, only by public authority.
  *   **What's Driving Aquinas?** A profound commitment to ordered society under God, a deep fear of anarchy and the cycle of violence, a belief in the necessity of lawful authority even when imperfect, and a nuanced understanding of the different ways power can be illegitimately held or used.

  Focus your paper on how Aquinas uses the interplay of principle (divine command, natural law jurisdiction) and prudence (historical experience, likely consequences) to build a robust case against private tyrannicide of legitimate rulers, and how the *titulus/exercitium* distinction provides the key to understanding his seemingly different stance on usurpers. Good luck!
