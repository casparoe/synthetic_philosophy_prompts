  ### Justification for Deductions:
  1. **Dretske Comparison (1/5)**:  
     - *Error*: Dretske's *Explaining Behavior* explicitly rejects evolutionary history as the sole basis for content. He grounds "indicator functions" in **individual learning histories** (e.g., via operant conditioning) where a state acquires the function to indicate X because it was *recruited by selection* (during the organism's lifetime) to covary with X. Millikan requires phylogenetic history.  
     - *Omission*: Dretske's "asymmetric dependence" (misrepresentation depends on prior correlation) is absent, while Millikan uses "Normal explanation" (conditions under which the mechanism historically succeeded).

  2. **Millikan's Response (3/5)**:  
     - *Omission*: Millikan (e.g., in "White Queen Psychology") argues Swampman *lacks representational content* because his states have no "Normal conditions" for success—no history where similar states guided successful behavior. The friend mentions history but not this systemic requirement.

  3. **Swampman Setup (4/5)**:  
     - *Overreach*: Davidson’s thought experiment targets *propositional attitudes* (e.g., beliefs), not phenomenal consciousness. Introducing consciousness is tangential and risks conflating issues.

  4. **Disjunction Problem (5/5)**:  
     - Flawless: Correctly identifies that content is fixed by what was *historically* rewarded (flies), not current dispositions (flies-or-BBs).

  ### Additional Guidance:
  - **Defending to Friend**: Focus on primary texts: Dretske (1988, Ch.3) distinguishes "indicator functions" from evolutionary functions. Millikan (1989) emphasizes "Normal conditions" for Swampman.  
  - **Improvement Suggestion**: The friend conflates *selectional processes*: Dretske uses ontogenetic selection (within a lifetime), Millikan uses phylogenetic (across generations). This is the core divergence.  

