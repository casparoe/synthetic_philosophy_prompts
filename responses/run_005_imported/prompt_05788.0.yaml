answer: |-
  That passage is *the* central battleground for interpreting Wittgenstein's hinge epistemology - you've nailed the core tension. Let's dissect it piece by piece, addressing your questions directly:

  ### 1. What work is the Hard-Rock/Sand image doing?
  *   **Dual Nature of the "Bank":** The image visualizes Wittgenstein's core insight: our system of belief isn't monolithic. It has components with *radically different functional roles*.
  *   **Hard Rock:** Represents propositions that are currently functioning as **absolute certainties**, the **bedrock framework**. They are "subject to no alteration or only to an imperceptible one." They *enable* doubt and testing of other propositions. Examples might be "The Earth exists," "I have two hands," or fundamental logical/mathematical principles *in their current role*.
  *   **Sand:** Represents propositions that are **empirical, testable, fluid**. They are "washed away or deposited" based on experience. These are the propositions we *do* investigate, doubt, and revise ("Is it raining?", "Did Napoleon win at Waterloo?").
  *   **Gradual Boundary:** Crucially, Wittgenstein emphasizes "there is not a sharp division." The image captures the **dynamic, functional, and contextual nature** of certainty. What *functions* as hard rock in one context or time might become sand in another, and vice-versa. The key is their *current role* in the "river" of our language-games and inquiries.

  ### 2. Do hinges differ in kind from ordinary beliefs, or are they just more entrenched?
  *   **Functional Difference in Kind (Your point):** Wittgenstein *is* drawing a distinction in kind *based on their current function and role*. A hinge proposition, *while it is functioning as a hinge*, **is not an empirical hypothesis**. It is **the framework *within which* empirical testing happens**. You don't "test" the riverbed with the water flowing over it; the riverbed *allows* the water to flow and be observed. Hinges are "rules of the game," not moves within it. This is why he immediately rejects "So logic too is an empirical science" - logic (as hinges) provides the rules for empirical investigation, it isn't *itself* investigated empirically *in that role*.
  *   **Potential for Change / Contingency (Leah's point):** However, Leah is absolutely right that Wittgenstein **denies any hinge is *metaphysically* or *permanently* certain**. The riverbed *can* shift. A proposition functioning as hard rock *can*, over time and under immense pressure (e.g., radical conceptual revolution), become fluid sand and be subject to doubt and revision. Conversely, a well-established empirical proposition can become so foundational it hardens into a hinge. This **historical/contingent dimension** means hinges aren't eternal truths.

  ### 3. The "Logic as Empirical Science" Bit & Its Impact
  *   **The Rejection:** Wittgenstein explicitly says "he would be wrong." This is crucial. He's rejecting the idea that *all* propositions, including those functioning as hinges (like logical rules), are *nothing but* empirical hypotheses open to constant testing.
  *   **The Nuance:** The sentence immediately following ("Yet this is right...") introduces the key nuance. **The *same proposition* can play different roles.** "Water boils at 100°C at sea level" might be a testable empirical hypothesis for a student, but function as an unquestioned rule of testing ("hinge") for a chef calibrating their stove. Its *status* (hinge vs. empirical) depends on its *role in a specific language-game or inquiry*, not on its intrinsic content.
  *   **Impact:** This reinforces the **functional distinction** (hinges aren't *currently* empirical hypotheses) while simultaneously emphasizing **contextual relativity and potential change** (no proposition is *inherently and forever* a hinge or an empirical hypothesis).

  ### 4. Whose reading is closer to the literature?
  **Your reading ("difference in kind based on current function") is significantly closer to the dominant interpretation within hinge epistemology literature, particularly the influential work of Danièle Moyal-Sharrock.**

  *   **Moyal-Sharrock (and similar views - e.g., Duncan Pritchard):** They strongly emphasize the **logical/grammatical distinction**. Hinges, *when functioning as hinges*, are not empirical beliefs at all; they are non-propositional, non-epistemic "certainties" that form the animal, unreflective background or "framework" for thought, language, and empirical inquiry. They are *conditions of sense*, not objects of knowledge or doubt. The "hard rock" represents this stable, enabling framework. The potential for change is acknowledged but seen as a *radical*, rare event (like a paradigm shift), not undermining the fundamental *functional* difference *at a given time*.
  *   **Leah's Reading ("contingent entrenchment"):** This aligns more with a "quasi-foundationalist" or "contextualist" reading (e.g., Michael Williams, to some extent Crispin Wright). They see hinges as deeply entrenched empirical commitments, differing only in degree from ordinary beliefs. The riverbed metaphor emphasizes the continuum. While influential, this view often struggles to fully accommodate Wittgenstein's sharp rejection of "logic as empirical" and the sense that hinges *enable* doubt rather than being its (temporarily safe) objects.

  ### The Synthesis (Why You're Both Partially Right, But Your Point is Stronger Here)

  1.  **Wittgenstein Absolutely Denies Permanent, Metaphysical Certainty:** Leah is correct that *no proposition* is absolutely immune to revision forever. The riverbed *can* shift. History shows radical changes (e.g., geocentrism).
  2.  **But He Insists on a Functional Distinction *Right Now*:** At any given moment, within a specific language-game or form of life, there *is* a fundamental difference in kind between propositions functioning as **unquestioned framework (hinges/hard rock)** and propositions functioning as **doubtable empirical content (fluid water/sand)**. This difference isn't just about how strongly you believe it; it's about *what role the proposition plays in your system of thought*.
  3.  **The "Hard Rock" vs. "Sand" Distinction Matters:** It's not decorative. It illustrates this functional duality *within* the system. Some parts are currently immovable (rock), others are constantly moving (sand), and the boundary is fuzzy and dynamic. The rock *represents* the qualitatively different role of hinges as enablers.
  4.  **The Rejection of "Logic as Empirical" is Decisive:** This shows Wittgenstein is committed to hinges (in their role) *not* being empirical hypotheses. They are the rules that *make* empirical hypotheses possible.

  **Conclusion:** While Leah is right about the long-term contingency, Wittgenstein's primary point in this passage is to illustrate the **functional distinction** between hinges (hard rock, rules of testing) and empirical propositions (fluid water, objects of testing) *within a system at a time*. The potential for change ("shift of the bed") doesn't erase this distinction; it explains *how* that distinction can evolve. Your reading captures the core insight about the *role* of hinges as enabling frameworks, which is the central takeaway in most contemporary hinge epistemology inspired by Moyal-Sharrock. Tell Leah she's got the dynamism right, but the functional distinction is Wittgenstein's main game! Good luck with the reading group – the fact you're arguing this intensely means you're doing it right!
