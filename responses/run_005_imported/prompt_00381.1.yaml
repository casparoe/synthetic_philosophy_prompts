answer: |-
  ## Dialogue: The Dispositionalist's Idealization & the Normativity Abyss

  **Setting:** A cramped graduate student office, overflowing with books. Kripke's *Wittgenstein on Rules and Private Language* lies open on the desk.

  **Characters:**
  *   **Skeptic (S):** Channeling Kripke's Wittgenstein, relentlessly probing for the fact of meaning.
  *   **Dispositionalist (D):** Sophisticated, well-versed in the literature, drawing on Fodor, Millikan, and modern dispositionalism. Determined to defend a naturalized account.

  **(The dialogue begins mid-argument, focused on "68 + 57")**

  **S:** So, you claim that when I said "plus" in the past, I meant the addition function. Consequently, "68 + 57" *ought* to be answered "125". But tell me, Dispositionalist, what *fact* about my past constitutes my meaning *plus* rather than, say, *quus* (where x quus y = x + y if x, y < 57, and = 5 otherwise)? You surely don't think my finite past behavior settles it – I've never computed 68+57 before today.

  **D:** Correct, your past behavioral repertoire is finite. But meaning isn't just past behavior; it's grounded in your *dispositions*. To mean *plus* is to be disposed, *under appropriate conditions*, to respond to the query "What is x + y?" with the sum x+y. For "68 + 57", under those conditions, you are disposed to say "125", not "5". *That's* the fact about you.

  **S:** Ah, the dispositionalist gambit! But Kripke demolished this easily. First, the **Finitude Objection**: I *am* finite. My brain has finite computational capacity. My life is finite. I *haven't* computed infinitely many sums. For the vast majority of addition pairs, especially large ones like 68+57, I have *no* actual behavioral disposition recorded anywhere. My physical state simply doesn't encode a determinate answer for every possible pair. How can a disposition I *lack* (because I'm finite) constitute my meaning *plus*? My physical state might be equally compatible with my meaning *quus* up to 57, and then... who knows? Maybe I'd malfunction and say "5", or maybe I'd get it right. But meaning can't be indeterminate like that!

  **D:** <Nods thoughtfully> The finitude objection is serious, but not fatal. We don't require your *actual*, finite physical system to *store* every answer. We require that your cognitive system embodies a *procedure* or *mechanism* that, *if given sufficient time and resources and freedom from interfering factors*, would produce the sum. Meaning *plus* is being disposed to answer with the sum *under idealized conditions* – infinite capacity, no fatigue, no miscalculation, no external interference, perfect memory access. Think of it as your cognitive system's *competence*, abstracting away from *performance* limitations. Under these ceteris paribus idealizations, your system *is* disposed to output "125" for "68+57". That's the fact constituting your meaning *plus*.

  **S:** <Leans forward, eyes sharpening> Idealization! Now we reach the heart of the matter. You invoke "ceteris paribus clauses" – no fatigue, no miscalculation, infinite capacity. But this is precisely where the **Normativity Objection** becomes *more* acute, not less! You've described what my idealized cognitive system *would* do. But meaning is normative! It tells me what I *ought* to do, what is *correct*. How does this idealized dispositional fact *generate* the "ought"?

  Let's say, under these idealized conditions, my system outputs "125". Fine. But *why is that the correct answer?* Why *ought* I to say "125"? Your dispositional fact, even idealized, only tells me what *would* happen in a frictionless fantasy land. It describes a prediction about my behavior under certain (impossible) conditions. But norms aren't predictions! Suppose under these ideal conditions, due to some quirk in my neural wiring – a quirk that was always there, part of my "competence" – my system outputs "5" for "68+57". According to your dispositionalism, wouldn't that *mean* I meant quus all along? But that's absurd! It would mean that my past meaning *quus* makes "5" the *correct* answer *now*. But correctness shouldn't depend on what I *would* do; it should constrain what I *should* do, even if my dispositions misfire! Your idealized dispositions describe the machine's operation, but they don't tell me whether the machine is *functioning correctly* according to the rule. The "ought" is missing.

  **D:** <Takes a breath, gathering resources> You're right that the mere *description* of an idealized output doesn't, by itself, generate normativity. But the dispositionalist account doesn't stop at the bare description. The normativity arises from the *teleological role* of the disposition within the system, grounded in its *history*.

  1.  **Teleosemantics & Biological Function:** Consider why we have these cognitive mechanisms in the first place. Through natural selection or learning history, our brains evolved/developed mechanisms for numerical computation *because* they tended to produce outputs that corresponded to objective relations in the world (like combining quantities) and thereby enhanced survival/reproductive success or learning efficacy. The *function* of the addition mechanism is to track the mathematical operation of addition. The "correct" answer ("125") is the one that fulfills this biological or learning-based *function*. When the mechanism outputs "125" under ideal conditions, it's functioning *properly*, fulfilling its purpose. When it outputs "5" under ideal conditions, it's *malfunctioning* relative to its function. The "ought" comes from what the mechanism is *supposed* to do, given its evolutionary or developmental history. Saying "125" is correct *because* that's what the mechanism is *designed* (naturally or through learning) to produce when functioning optimally for its purpose.

  2.  **Ceteris Paribus as Defining Competence:** The ceteris paribus clauses aren't arbitrary. They precisely carve out the conditions under which the system's *competence* – its reliable capacity to track the relevant function (addition) – is operative. "Miscalculation" isn't just any mistake; it's a deviation *from the system's own competence standard* under ideal conditions. Fatigue, distraction – these are *performance errors* that mask the underlying competence. The normativity is inherent in the distinction between competence (what the system is set up to do correctly) and performance (what it actually does, potentially incorrectly). The idealized disposition *defines* the competence, and deviations from its output under ideal conditions *are* the mistakes. The "ought" is: *if you want to manifest your competence for addition, you ought to say what the idealized disposition outputs*.

  **S:** <Shakes head slowly> You naturalize too quickly! You slide from "is" to "ought" via "function" and "design." But this just pushes the normativity problem back.

  1.  **The Function Skepticism:** Who says the *function* of my cognitive mechanism is to track *mathematical* addition? Evolution selected for mechanisms that produced *useful* outputs in our ancestral environment – outputs that helped us count berries, share meat, maybe track lunar cycles. Useful outputs aren't necessarily *mathematically correct* ones. Perhaps a mechanism that approximated addition well enough for small numbers but deviated systematically for larger ones (like outputting "5" for sums over 100) was just as evolutionarily fit, or even *more* fit if it saved cognitive resources. Natural selection optimizes for survival, not for truth or mathematical accuracy. Why should the *mathematical* norm bind me if evolution only "designed" me for pragmatic success? The teleological "ought" ("do what you were selected to do") is still distinct from the *semantic* "ought" ("say what the rule *demands*"). What if fulfilling my biological function (survival) *required* me to miscalculate in certain contexts? Would that make the miscalculation *semantically* correct? Surely not!
  2.  **Competence as Circular:** Your appeal to "competence" is dangerously circular. You define the competence (for addition) *as* the disposition to output sums under ideal conditions. Then you define correctness *as* matching that output. But this doesn't tell me *why* this particular competence defines the meaning of "+". Why isn't my competence defined as outputting *quus* results? You say deviations are "performance errors," but that label *presupposes* that we already know what the correct output *should* be. How do we know that? It seems the normativity ("this *is* the competence for addition, deviations are errors") is smuggled in at the start, not derived from the dispositional facts, even idealized ones plus teleology. The teleology tells me the mechanism *does* something (under ideal conditions). It doesn't tell me that what it does *is* what it *should* do in the sense required by rule-following – that it *accords* with an independent standard (the rule). It only tells me what it *does* when working optimally *for its biological purpose*, which may not align with the mathematical rule.

  **D:** <Sighs, running a hand through hair> You drive the point deep. The circularity worry is real. But I maintain that the naturalized story – ideal dispositions plus teleology – *is* how normativity enters the physical world for cognitive systems like ours. The "independent standard" *is* the mathematical function, but our *grasp* of that standard is constituted *by* our reliable, functionally grounded disposition to track it under ideal conditions. There's no magical, non-natural "grasping" of a platonic rule. Our competence *is* our sensitivity to the function. When the system functions properly (ideal conditions), its output *is* the correct one relative to the function it's designed to track.

  **S:** And here we hit the bedrock. For you, the "rule" just *is* the pattern generated by the idealized, properly functioning disposition. Correctness is defined internally by the system's own optimal operation for its natural purpose. There is no "rule" *over and above* this naturalistically described state of affairs that I could fail to follow *even under ideal conditions* without it being a malfunction.

  **D:** Essentially, yes. The normativity *supervenes* on the natural facts: the physical structure, the idealization defining its competence, and its functional history. There's nothing more to meaning.

  **S:** And for me, this fails to capture the *binding force* of the rule – the sense that even if my entire cognitive architecture, functioning "ideally" according to its evolutionary history, disposed me to say "5" for "68+57", I could *still* be *wrong* because I meant *plus*. The rule stands apart, judging the disposition, not constituted by it. Your idealization saves the extension but loses the normativity's source. You conflate the machinery working smoothly with the machinery working *correctly according to the rule*.

  **D:** And you posit a normativity that floats free of any possible natural grounding in the machinery of thinkers. We seem to have found the fault line.

  **S:** Indeed. The chasm remains. <Gestures to the open copy of Kripke> Some walls are meant to be hit.

  **(End of Dialogue)**

  ## Sharpening the Disagreement

  This dialogue highlights the core tension after the dispositionalist deploys idealization to handle finitude:

  1.  **The Dispositionalist's Naturalized Normativity:** Claims normativity arises *from within* the natural system. Ideal dispositions + teleology (biological/learning function) define the system's *competence*. Correctness is *defined* as the output of the system functioning properly (ideally) according to its competence/function. The "rule" is the pattern the system is designed/evolved to produce optimally. There is no normativity beyond this naturalistically describable state. Malfunction under ideal conditions *just is* incorrectness.
  2.  **The Skeptic's Demand for External Constraint:** Argues that this naturalized account fails to capture the *genuine normativity* of meaning. The rule (e.g., the addition function) must stand as an *independent standard* against which the disposition (even idealized and properly functioning) is *judged*. The disposition describes *what happens* when the system works best; it doesn't explain *why* that output *should* be considered correct *according to the rule*. The skeptic insists that the dispositionalist conflates *reliability* or *proper function* with *semantic correctness*. Even a perfectly reliable, ideally functioning system designed for pragmatic success could, in principle, systematically deviate from the mathematical rule without that deviation being a semantic *error* according to the skeptic – because the rule's authority is distinct from the system's operation. Teleology provides a different kind of "ought" (functional) that doesn't necessarily align with the semantic "ought".

  The dialogue ends on this fundamental impasse: **Can normativity be fully naturalized as the optimal operation of a biologically/developmentally shaped cognitive system under ideal conditions, or does semantic normativity require a constraint *external* to any such natural system?** The dispositionalist says "Yes, and here's how," grounding correctness in functional success. The skeptic says "No, that reduces correctness to reliable operation and loses the essential 'ought' that binds me to the rule itself." This is the unresolved core of the rule-following dilemma for dispositionalism, even in its most sophisticated forms.
