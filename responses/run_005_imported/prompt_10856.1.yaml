  The whiteboard becomes crucial here. When Maya sketches Carter's model, Alex should demand: "Where's the error bar for N=1?" That visualizes the core dispute. Later, Maya's point about intelligence requiring *some* sequence of hard steps—regardless of specifics—forces Alex to concede Carter's logic might hold *if* we accept its premises, which circles back to philosophy.

