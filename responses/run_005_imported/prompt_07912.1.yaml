  But note: the instructor might have a different scale, but since 20 is the maximum, it should be an A.

  ### However, let's reconsider the Kant section:

  The prompt asks: "say precisely what moral work each example does." The essay says: "In both examples the point is the same: moral worth attaches to the will's motive rather than to the outward act, and the version of the story where inclination is absent is used to isolate duty as the operative motive." This is a good summary, but it doesn't break down the moral work of each example individually. The shopkeeper example shows that an act that conforms to duty can lack moral worth if done from self-interest. The friend of humanity example (with inclination) shows that even a naturally good action (done from sympathy) lacks moral worth, and the friend without inclination shows that duty alone can motivate and confer moral worth. The essay does not explicitly break it down per example, but the combined point is clear. Given the word limit, this is acceptable.

