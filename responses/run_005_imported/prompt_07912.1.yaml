  - Notes that both Markovits and Arpaly avoid Smith's objection by not requiring de dicto concern for rightness.
  - Concludes that Markovits and Arpaly are "two formulations of the same underlying view".

  ### Grading by Criteria:

  1. **kant (Accuracy on Kant):** 
