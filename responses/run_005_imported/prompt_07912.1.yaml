     - However, note that the essay does not explicitly say what moral work each example does. The prompt asks: "say precisely what moral work each example does". The shopkeeper example shows that an act that conforms to duty but is done from self-interest lacks moral worth. The friend of humanity example (with sorrow) shows that when duty is the only motive, the act has moral worth. The essay does cover the point but could be more explicit about the "moral work" (i.e., the shopkeeper shows that conformity is not sufficient, and the friend shows that inclination is not necessary and that duty is sufficient and necessary when inclination is absent). But the essay does say: "In both examples the point is the same: moral worth attaches to the will's motive rather than to the outward act, and the version of the story where inclination is absent is used to isolate duty as the operative motive." This is a good summary of the moral work. So it is accurate and complete enough for 5 points? Let's see if there's any inaccuracy. The essay does not explicitly mention that the friend of humanity example also shows that even a naturally sympathetic person's actions lack moral worth if not done from duty. But the essay does say: "because he acts from a pleasant inclination rather than from duty, his kindness ... has no moral worth." So that's covered. 
     - I think it's accurate and meets the requirement. 
     - **Score: 5/5**

  2. **smith (Accuracy on Smith):**
     - The essay correctly states Smith's fetishism objection: that making the motive "this is my duty" leads to an indirect concern for others (like a fetish). It also correctly identifies that the objection targets views that require de dicto concern for rightness (the thought that the act is right) as the proximate motive. 
     - The essay also correctly notes that it doesn't threaten the weaker idea that a good person cares about morality at all. 
     - This is accurate and complete. 
