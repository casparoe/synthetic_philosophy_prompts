answer: |-
  That's a fantastic find – you've stumbled right into a fascinating collision of theology, philosophy, and linguistic evolution. Let's break down the Article and then see how it connects to your modern debate.

  **Unpacking Article XIV: The Theological Condemnation**

  1.  **The Target:** The Article explicitly condemns the *teaching* or doctrine of "Works of Supererogation." This refers to a specific Catholic doctrine prominent before and during the Reformation.
  2.  **The Catholic Doctrine (as understood by Reformers):** This held that certain individuals (especially saints) could perform actions that went *beyond* what God strictly required (e.g., extreme asceticism, martyrdom beyond necessary witness). These "extra merits" were believed to form a "Treasury of Merit" administered by the Church, which could then be applied (via indulgences) to lessen the temporal punishment due to sin for others.
  3.  **The Protestant Rejection - Core Arguments:**
      *   **Arrogancy:** Claiming to do *more* than God requires implies:
          *   Humans can exceed God's perfect standard.
          *   Humans can place God in their debt (as if God *owes* them something extra).
          *   Humans possess inherent goodness or capacity sufficient to generate "surplus" merit. This directly contradicts the Protestant emphasis on *total human depravity* and the *complete sufficiency of Christ's sacrifice* for salvation.
      *   **Impiety:** This doctrine is seen as fundamentally disrespectful to God because:
          *   **Undermines Grace:** Salvation is *solely* by God's grace through faith in Christ (Sola Gratia, Sola Fide). Suggesting human works, *especially surplus works*, contribute to salvation or merit undermines the all-sufficiency of Christ's atonement.
          *   **Contradicts Christ's Teaching:** The Article cites Luke 17:10 ("So you also, when you have done everything commanded of you, should say, 'We are unworthy servants; we have only done our duty.'"). This teaches that even perfect obedience is merely our *duty*, not something that earns extra credit or puts God in our debt. We remain "unprofitable servants" – we haven't *profited* God, only done what was minimally required of creatures to their Creator.
          *   **Human Presumption:** It presumes humans can accurately judge what constitutes the *exact minimum* of God's requirement and then surpass it. This is seen as an arrogant overestimation of human capacity and understanding.
          *   **Undermines the Law:** It implies God's commandments are insufficient or incomplete, needing human additions to be "fulfilled plus."
  4.  **The Heresy Angle:** Yes, for the Church of England (and other Protestant Reformers), teaching that humans could perform meritorious works *beyond* what God requires for their own salvation *and* generate surplus merit for others was indeed considered heretical. It struck at the heart of the doctrine of justification by faith alone and the unique mediatorial role of Christ.

  **The Modern Philosophical Concept of Supererogation**

  Fast forward to the mid-20th century. Philosophers like J.O. Urmson ("Saints and Heroes," 1958) revived the *term* "supererogation" but stripped it of its *theological baggage* and repurposed it for *secular moral philosophy*.

  1.  **The Core Idea:** A supererogatory act is:
      *   **Morally Good/Praiseworthy:** It's the *right kind* of thing to do.
      *   **Not Morally Obligatory/Duty:** You are *not* morally *required* or *obliged* to do it. It goes "beyond the call of duty."
      *   **Not Merely Permissible:** It's not just neutral; it's positively good and often highly admirable.
      *   **Examples:** Exactly like your friend mentioned: donating a kidney to a stranger, rushing into a burning building to save someone at great personal risk, whistleblowing knowing it will ruin your career, significant acts of charity that involve real personal sacrifice.
  2.  **The Philosophical Motivation:** Urmson and others argued that traditional moral theories (like strict Utilitarianism or rigid Kantian deontology) struggled to account for these acts. If maximizing good is a *duty* (Utilitarianism), how can sacrificing immensely for others be *optional*? If duty is defined narrowly (Kant), how do we explain the special praise for acts that exceed it? Supererogation carves out a space for morally excellent but non-compulsory actions.

  **The Connection: Repurposing and Lingering Worries**

  1.  **Repurposing the Word:** Yes, the word was absolutely repurposed. Philosophers borrowed the *linguistic structure* ("going beyond what is required/due") but applied it to *human-to-human moral relations within a secular framework*, completely detached from concepts of divine commandments, salvation, merit, or the Treasury of the Saints. The *formal definition* (beyond duty) is similar, but the *context* and *implications* are radically different.
  2.  **Lingering Theological Worries in Disguise? Absolutely.** The core concerns of "arrogancy" and "impious presumption" translate into significant secular philosophical debates:
      *   **The "Coherence" Debate:** Does "beyond the call of duty" even make sense? Critics argue:
          *   **Demandingness:** If our duties are already extremely demanding (e.g., giving until it significantly impacts our well-being to help those in dire need), is there *any* room left for true supererogation? Maybe what we call supererogatory is just what we fail to recognize as our actual duty (echoing the idea that we can't accurately judge the "minimum").
          *   **Presumption:** Who gets to *declare* an act supererogatory? Does labeling an act (like kidney donation) as "beyond duty" implicitly *excuse* others from feeling obligated to do similar things? Does it create a problematic moral elite (the "saints and heroes") and let everyone else off the hook for not doing enough? (This echoes the worry about human judgment and creating a surplus).
          *   **The "Ought Implies Can" Problem:** If something is incredibly good and possible, *shouldn't* it be a duty? If it's not a duty, does that imply it's *too hard* to demand? But then, praising someone for doing it seems odd – we praise them for doing something we admit is too hard to expect? (This touches on the "unprofitable servant" idea – even if we do immense good, are we ever really *beyond* basic moral expectations in a world of suffering?).
      *   **The "Problem" of Supererogation:** For theories that define duty very broadly (like Act Utilitarianism), supererogation disappears – if you *can* maximize good, you *must*. Conversely, theories that define duty very narrowly might struggle to explain *why* supererogatory acts are morally praiseworthy *in a special way* compared to simply doing your duty or something merely permissible. Reconciling supererogation with a coherent moral system is a major philosophical challenge.
      *   **The "Arrogancy" Echo:** The secular worry isn't about impiety towards God, but about potential social arrogance or unfairness. Could claiming an act is supererogatory be a way for the privileged to pat themselves on the back for rare sacrifices while ignoring systemic injustices that create the need for those sacrifices in the first place? Or does it unfairly burden the exceptionally altruistic?

  **In Conclusion:**

  *   **Theological Origin:** Article XIV condemns "Works of Supererogation" as heretical because they undermine salvation by grace alone, imply humans can exceed God's requirements and place Him in their debt, and contradict Christ's teaching that even perfect obedience is merely our duty.
  *   **Modern Philosophy:** The term was repurposed to describe morally excellent acts that are good but not obligatory within secular ethics, highlighting a perceived gap in traditional moral theories.
  *   **Connection:** While the contexts are utterly different, the *structural similarity* (acting beyond what is required/due) means the *logical and conceptual problems* inherent in defining that boundary and its implications – the worries about presumption, the difficulty of defining the "minimum," the potential for excusing others, and the challenge to systematic moral theories – persist powerfully in the secular philosophical debate. Your friend argues for the *reality* and special praiseworthiness of such acts; the Article and modern critics highlight the deep *conceptual difficulties* in making sense of them without creating other problems. Both sides are grappling with the limits of duty and the nature of moral excellence, just from vastly different starting points. Your argument touched a nerve that goes back centuries!
