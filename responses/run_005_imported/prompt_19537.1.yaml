  ## For Miriam: A Voice in the Choir Invisible

  We are gathered here in shared sorrow, and shared love, for Miriam. A sister, an aunt, a cherished friend, a formidable teacher, a woman whose absence leaves a space that feels uniquely shaped for her presence. To speak of her life feels both an honour and a profound responsibility, especially knowing how clearly she saw the world, and how deeply she considered the meaning of a life well-lived.

  For Miriam, that meaning was inextricably linked to the life and mind of Mary Ann Evans, known to the world as George Eliot. Not just the novelist who gave us Dorothea Brooke and Middlemarch, though Miriam loved those stories deeply. No, Miriam was captivated by the woman herself: her intellectual courage, her painful honesty, her journey away from the evangelical faith of her youth, guided by the freethinking Bray circle in Coventry. Miriam understood the cost of that journey – the rift with a beloved father, the arduous work of translating Strauss’s *Life of Jesus*, and later, Feuerbach’s *The Essence of Christianity*, the only book George Eliot ever published under her own name. Miriam saw in that trajectory a profound integrity, a refusal to accept easy answers.

  She particularly loved recounting the story of Eliot walking in a Cambridge garden with F.W.H. Myers. Faced with the three great words – God, Immortality, Duty – Eliot declared the first inconceivable, the second unbelievable, but the third – Duty – absolute and peremptory. That, Miriam often reflected, was a creed she could understand. It resonated deeply with her own sense of how we must navigate this world: not with promises of what lies beyond, but with an unwavering commitment to what is right and necessary *here*.

  She was clear, profoundly clear, about what she did not want today. No talk of heaven. No assurances of reunion with [Uncle's Name] "on the other side." She would have called such things, gently but firmly, comforting lies. She believed we honour the dead not by weaving fictions about their future, but by grappling honestly with the reality of their absence and the enduring weight of their presence *in* us.

  And yet… Miriam was no cold rationalist. She found immense solace, not in supernatural promises, but in Eliot’s vision of human connection and legacy. She cherished the idea from Eliot’s poem “O May I Join the Choir Invisible” – the notion that we live on, not in some ethereal realm, but through the “good” we leave “undiffused” in the lives of others. She found it echoed on the final page of *Middlemarch*, that reminder of how the “growing good of the world” depends partly on lives lived faithfully, whose influence ripples outwards long after they are gone, “incalculably diffusive.”

  *This* is how Miriam believed we mattered after death: through the difference we made while alive. Through the minds we challenged, the hearts we touched, the quiet acts of decency, the fierce commitment to truth, the unwavering sense of duty lived out in daily actions.

  For thirty years in the classroom, Miriam challenged students not just to understand Victorian literature, but to understand the human condition it explored. She ignited in them the same fire for intellectual honesty she found in Eliot. Countless students left her lectures not just knowing more about *Middlemarch*, but thinking more deeply about their own choices, their own responsibilities, their own place in the vast, interconnected web of humanity.

  To her family, she was a steadfast anchor – [Mention a specific, warm, non-religious family memory or quality if possible, e.g., "the sister who always remembered birthdays with the perfect, slightly obscure book," or "the aunt whose dry wit could dissolve any family tension," or "the one who showed up, reliably, practically, whenever needed"]. Her sense of duty wasn't abstract; it was lived in the concrete reality of family love and loyalty.

  To her friends and colleagues, she was a brilliant mind, a sharp wit, a fiercely loyal companion who valued authenticity above all else. She demanded intellectual rigour but offered immense warmth. She could dissect an argument with precision, yet her eyes would crinkle with genuine kindness and humour.

  Miriam would not want us to pretend today. She would not want us to soften the edges of her convictions or drape her memory in sentiments she spent a lifetime examining and, ultimately, setting aside. She *would* want us to remember her clearly: her sharp intellect, her dry humour, her deep love for literature and ideas, her unwavering sense of what was right, her profound care for the people in her life.

  And she would want us to understand the profound comfort she *did* find. Not in an afterlife, but in the enduring power of a life lived with integrity and love. She found it in the certainty that she mattered, and would continue to matter, *through us*.

  Through the student who teaches differently because of her. Through the colleague who thinks more critically. Through the sibling who feels her steadfast presence in memory. Through the friend who hears her voice offering clear-eyed counsel long after the conversation ended. Through the quiet acts of duty performed by those she loved, inspired by her own example.

  Miriam has joined the choir invisible. Her voice is now part of that “immortal music” Eliot described, not sung in some distant heaven, but resonating in the lives she shaped, the minds she opened, the love she gave, and the unwavering sense of duty she embodied. Her influence is “incalculably diffusive.” We hear her still. We feel her still. And in remembering her, in carrying forward the goodness and the truth she valued, we ensure her place in that choir endures.

  She lives, Miriam lives, in the difference she made. She lives in us. Let that be our comfort, and her lasting tribute.
