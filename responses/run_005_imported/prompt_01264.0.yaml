  First, I need to recall the standard demon case: a demon threatens harm unless you admire a saucer of mud. The problem is that this creates a reason to admire it, but intuitively, the mud isn't admirable. Buck-passers need to exclude such "wrong-kind" reasons. The user's insight is that all attempts fail in a patterned way, suggesting it's fundamental.

  For the argument, I'll start by framing the dilemma. Formal strategies aim for a structural rule to distinguish right-kind reasons (bearing on the object's properties) from wrong-kind (like threats). But any sharp criterion risks circularity if it implicitly references value. If it avoids that, it's purely structural, allowing for meta-demon cases that manipulate the structure itself. I'll invent a new demon case targeting the "grounds" of an attitude to show regress—e.g., a demon threatening harm unless your admiration is based on intrinsic properties, which forces a reason but doesn't make the object admirable.

  Then, I'll tackle D'Arms and Jacobson's strategy. They argue that no formal rule works; instead, we judge case by case whether a reason bears on fittingness or propriety. But this faces the circularity horn: distinguishing fittingness seems to require prior grasp of value. If we try to explain it without value, we're back to needing a criterion, which loops into the original problem. Their appeal to "what the attitude is for" might presuppose value, making it question-begging.

  I should push hard on both horns. For the regress, my new demon case should be creative: imagine a demon who threatens harm unless you base your admiration on the object's intrinsic properties. Even if a theory says right-kind reasons must be object-given, this threat creates a reason to have such a basis, but it's still the wrong kind. This shows the regress—now we need a criterion for when a reason to have a basis is right-kind, and so on.

  For the circularity in D&J, emphasize that in the demon case, judging whether the threat bears on fittingness seems to rely on knowing the mud isn't admirable. If they deny this, ask how we learn the distinction without prior value concepts. It might collapse into intuitionism.

