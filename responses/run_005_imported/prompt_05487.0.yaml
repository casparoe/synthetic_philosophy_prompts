prompt: |-
  I'm a backend engineer at a mid-size startup, and outside of work I co-host a small podcast where we talk to people doing serious work at the intersection of software and ethics; our listeners are mostly other engineers, so we're expected to go a bit deeper than the usual "AI ethics" small talk. Next week's guest is an AI safety researcher who has built something of a following in alignment circles for arguing that advanced AI systems should be designed as expected-utility maximizers that stay deliberately uncertain about their own objective and defer to human oversight, rather than being bound by hard-coded deontological rules. Her stock answer whenever someone raises a worst-case scenario is some version of "any rule you can write down, I can eventually write down the situation that breaks it -- better to build something humble enough to notice that than confident enough to follow the letter of a rule off a cliff." The topic actually mirrors an argument my own team had a few months ago, when half of us wanted to hard-code refusal rules into our product's assistant and the other half wanted it to weigh consequences case by case; I don't think either side really won, which is part of why I want to hear this argued out properly by people who've thought about it more than we have.

  Could you draft nine or ten interview questions that don't just let her restate the position? I'd like at least one question built around the "nearest unblocked strategy" worry -- that a sufficiently capable optimizer routes around any constraint that isn't backed by a full objective function, which seems to threaten her own "stay uncertain" fix just as much as it threatens hard-coded rules; one on whether a deferential, uncertain utility maximizer still has a convergent incentive to quietly accumulate resources, information, or optionality before ever checking in with a human, and, if corrigibility is supposed to block that, how you'd actually verify it survives self-modification or the system spinning up sub-agents of its own; one on the old aggregation worry -- whether her framework has any principled way to rule out sacrificing a minority for the aggregate expected good, and whether whatever safeguard she'd add against that is just a deontological side-constraint smuggled back in under another name; and one built on that MIT "Moral Machine" survey, which found people's moral intuitions about self-driving-car dilemmas splitting sharply along cultural lines -- what does "defer to human values" even mean once you take seriously that humans don't agree? For each, please add a short, pointed follow-up keyed to whatever answer she's most likely to give, the way a good interviewer doesn't let a clever line close off the exchange.
