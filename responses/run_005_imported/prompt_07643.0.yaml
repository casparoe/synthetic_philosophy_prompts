answer: |-
  Here’s a rigorous defense of your friend’s position, grounded in Hacking’s core mechanics and avoiding clinical gatekeeping:

  ### The Core Argument: Why Platform-Driven Self-Diagnosis Lacks Hacking's "Two-Way Street"
  1. **The Indispensable Role of Institutional Feedback Loops**:  
     Hacking’s "interactive kinds" require a dialectic between *classified people* and *institutions wielding taxonomic authority* (clinicians, researchers, DSM committees). When classified individuals adopt a label (e.g., "multiple personality"), their lived experience *changes* in response to the label. Crucially, institutions *observe these changes* and formally revise the taxonomy ("hysterical fugue" → "dissociative identity disorder"). TikTok lacks this institutional feedback. Creators and viewers co-construct a *cultural narrative*, but they don’t revise diagnostic criteria. The DSM/ICD remains untouched by TikTok trends—it’s a monologue, not a dialogue.

  2. **The "Making Up" Requires Maker Accountability**:  
     In *Mad Travelers*, the fugue diagnosis wasn’t just adopted by patients—it was *shaped* by their behavior, which then forced *doctors* to confront inconsistencies in their model. Hacking’s loop demands that classifiers face consequences for their categories ("Why do our ‘fugueurs’ now report visions?"). On TikTok, creators aren’t taxonomists bound by epistemic responsibility. A creator’s viral symptom list may evolve for engagement, not diagnostic accuracy. Mara adopts a label, but her experience doesn’t pressure *medical institutions* to reformulate autism/ADHD criteria. The "making up" is decentralized and unanchored from taxonomic revision.

  3. **The Autism Precedent: A Misapplied Analogy**:  
     Yes, Hacking noted autistic self-advocates influencing the category (*Autism Fiction?*). But this occurred through *formal channels*: peer-reviewed journals, conferences, diagnostic working groups. Autistic self-advocates engaged directly with *institutional gatekeepers*, forcing iterative refinement of criteria (e.g., reducing pathologizing language). TikTok’s algorithmically amplified content lacks this curated, critical exchange. When Mara mimics a creator’s self-description, she’s not contributing to a *revised clinical concept*—she’s replicating a meme. The feedback loop is severed; institutions don’t "hear" her.

  4. **Semantic Contagion vs. Interactive Kinds**:  
     Your friend’s "semantic contagion" point hits hard. Hacking distinguishes between:
     - **Interactive Kinds**: A dynamic where *both* the labeled person *and the label itself* are transformed (e.g., "homosexual" → "gay" with community reclamation).
     - **Semantic Contagion**: Spread of terminology *without* structural change to the category (e.g., "OCD" as colloquial shorthand for neatness).  
     TikTok self-diagnosis fits the latter: Mara internalizes "autistic" as defined by creators, but the *clinical construct of autism* doesn’t adapt to her interpretation. The label proliferates, but its medical/scientific content remains static—or worse, becomes *more* rigid as creators flatten nuance for virality.

  5. **Algorithmic Homogenization vs. Looping’s Generative Chaos**:  
     Hacking’s loops thrive on *unpredictable* interactions: fugueurs developing new symptoms, multiples "discovering" alters. TikTok’s algorithm does the opposite—it funnels Mara toward content that *confirms* existing patterns. She’s not encountering taxonomists revising models; she’s trapped in an echo chamber reinforcing a fixed set of tropes. True looping requires open-ended negotiation, not algorithmic curation that stifles category evolution.

  ### Why This Distinction Matters for Your Novel
  This isn’t about dismissing Mara’s experience as "invalid." It’s about precision:  
  - **Mara’s arc can be profound without being Hacking-looping**. Her self-discovery via community is real—but it’s *identity formation* (social kind) not *taxonomic co-creation* (interactive kind).  
  - **The tension lies in the gap**: Mara believes she’s in a Hacking-esque loop (self-diagnosis as radical self-definition), but the system she engages with can’t deliver the "interactive" half. Her frustration when institutions dismiss her isn’t just stigma—it’s a *mechanical failure* of the loop she thinks she’s in.  
  - **Avoid "kids these days" by honoring her struggle**: Show her wrestling with clinical gatekeeping *because* TikTok can’t generate institutional change, not because her feelings are "fake." The tragedy is that the platform *simulates* looping without the emancipatory potential Hacking described.

  ### Narrative Leverage
  Use this to deepen Mara’s arc:  
  > *She starts by feeling seen by creators, adopts their language, then hits a wall when her therapist/school/parents don’t recognize her self-diagnosis. Instead of a villainous "they don’t believe me," show her realizing the system she’s in can’t actually *do* what Hacking’s loops do—it can’t force the DSM to adapt. Her empowerment collides with the inertness of institutional taxonomy. The irony? Her very authenticity is trapped in a semantic bubble.*

  This preserves intellectual honesty without delegitimizing her journey—and avoids the reductive "TikTok vs. Science" trope.
