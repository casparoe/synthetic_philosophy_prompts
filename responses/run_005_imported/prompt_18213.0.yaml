answer: |-
  Here’s a toast that threads the needle: sincere, self-aware, and with a joke built on the "asserting while disbelieving" structure your sister loves. It clocks in at ~4 minutes and works for both philosophers and civilians.

  **(Clink glass. Warm smile.)**  

  "Hi everyone. For those who don’t know me, I’m Maya’s older brother—the one who writes lies for a living, while she spends her days dissecting why we *can’t* lie to ourselves. Fitting, then, that she asked me to stand here and say true things. *All* true things. No pressure.  

  **(Pause, look at Maya)**  
  Maya, you’ve always had this… radar. When we were kids, if I said, ‘I didn’t eat your chocolate,’ while my face was smeared with cocoa? You’d sigh, not even mad, just disappointed in my lack of *epistemic rigor*. *(Grins, winks at philosophy guests)*.  

  **(Turn to the couple)**  
  Which brings me to you two. Alex, the moment Maya told me about you, she didn’t say ‘He’s perfect’ or ‘We never argue.’ She said, ‘He laughs when I explain paradoxes over breakfast,’ and ‘He remembers when I forget to eat while reading.’ And that told me everything. Because Maya doesn’t trade in illusions. She studies what’s real—even when it’s messy, or uncertain, or hides in the blind spots we can’t see.  

  **(Light shift in tone)**  
  Now, wedding toasts are minefields for someone like her. ‘Perfect match!’ — but nobody’s perfect. ‘I know you’ll be happy forever!’ — but nobody knows the future. ‘They complete each other!’ — but Maya’s already a whole, terrifyingly competent person. *(Pause, mock-stern)*. So, in her honor: no empty poetry. Just things I *actually* believe.  

  I believe Maya’s the only person who’d correct the officiant’s grammar mid-vows.  
  I believe Alex is the only person who’d find that adorable.  
  I believe their bookshelves collapsed within a month of moving in together. *(Nods)* Happily.  
  I believe Alex makes Maya 17% less likely to work through dinner. *(Holds up hands)* Hey, progress is progress!  
  I believe Maya’s the reason Alex owns socks without holes.  
  I believe Alex is the reason Maya owns socks *with* cartoon robots.  

  **(Leans in, confidential)**  
  And here’s the thing about true beliefs: sometimes they surprise you. Like when Maya—who once wrote 80 pages on why you *can’t* rationally assert ‘I am happy’ at the moment you feel it—came home after your first date, Alex. She didn’t say ‘He meets my criteria.’ She spun around the kitchen and yelled, ‘I *believe* in tacos, and democracy, and THIS!’  

  **(Pause for laughter)**  
  Which brings me to my one toast joke. A sincere one. Ish.  
  *(Raises glass higher, solemn face)*  
  **‘I believe everything I’m saying right now.’**  
  *(Pauses dramatically. Taps chest. Frowns slightly.)*  
  …Though I *do* feel a faint, troubling flutter in my left ventricle as I claim total veracity. Almost like… a tiny, physiological asterisk? Huh.  
  *(Shrugs, winks at Maya)*  
  See? Even my truths have escape clauses.  

  **(Softens, turns to couple)**  
  But here’s a belief with no asterisk, no blind spot, no paradox: What you two have is real. Not because it’s perfect. Not because it’s forever guaranteed. But because it’s built on seeing each other clearly—the flaws, the quirks, the late-night debates about *whether ‘late-night’ is a compound adjective*—and choosing each other anyway. You don’t just believe *in* each other. You’re each other’s most trusted witness.  

  So, raise your glasses:  
  To Maya and Alex! May your life together be gloriously, rigorously true. May you always catch each other’s chocolate-smeared lies. And may you keep believing in tacos, democracy, and *this*—even when you’re too happy to say it out loud. Cheers!"  

  **Why this works:**  
  1. **The Joke (Physiological Asterisk):** It literally performs "I believe P" while undercutting it with bodily doubt—making the paradox *physical* without naming it. Philosophers will grin; others laugh at the sudden cardiology gag.  
  2. **Sincerity First:** Every "I believe" is specific, personal, and plausible (e.g., bookshelf collapse, sock upgrades). Avoids all "forever/perfect" clichés.  
  3. **Maya-Centric:** Honors her intellect (grammar corrections, epistemology) and personality (forgetting to eat, kitchen spins) without making her "the academic."  
  4. **Alex’s Role:** Shows how he complements her practically and emotionally (laughs at paradoxes, cartoon socks).  
  5. **Blindspot Nod:** "Trusted witness" subtly references Sorensen—love as seeing someone’s hidden self.  
  6. **Emotional Payoff:** Ends on warmth grounded in their authentic dynamic, not abstract romance.  

  **Delivery Tip:** Pause after "THIS!" for her kitchen spin anecdote—let the laughter land. The cardiology bit? Touch your chest like you’re checking a pulse. Makes the paradox-play visceral.  

  Your sister will catch every layer, the department will applaud the craft, and the other guests? They’ll just feel it’s the rare toast that’s actually *about* the couple. Break a leg!
