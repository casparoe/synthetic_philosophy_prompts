  Also, consider their identity as a scientist. They value empirical evidence, so examples where physics is silent (like modal truths or mathematical entities) could help. Highlight that grounding is a tool for unification across domains, not just physical. Schaffer's monism is one hypothesis; other metaphysicians disagree. It's a debate within philosophy, not a settled fact.

