  kinda random question but its been nagging me. I'm a stats PhD student and basically live in causal inference land (Pearl-style DAGs and do-calculus all day), and I'd always just assumed that was more or less a formalized version of Lewis's counterfactual theory of causation - closest possible world where X is different, etc. Then I sat in on a phil of science seminar where the prof treated Lewis's theory and Woodward's interventionist theory (the surgery-on-a-structural-equations-model thing) as genuinely rival accounts, not just two notations for the same idea, which threw me. Could you give me a concrete case - a toy example is fine - where a straightforward Lewis-style counterfactual analysis and a Woodward-style interventionist analysis would actually disagree about whether C caused E, or atleast where one needs extra machinery the other just doesn't require? please don't reach for a standard preemption or overdetermination case, i've got a drawer full of those already and both theories seem to handle them with about the same amount of hand-waving anyway.
