  Example: Two pathways to E. Path 1: C → E. Path 2: S → E. Normally, C=1, S=0, so E=1. If we ask whether C caused E. Woodward intervention: set C=0, S remains 0, so E=0. Thus C is a cause. 

  Lewis: closest world where C=0. Why is C=0? The closest world might have S=1 (to explain C's absence), and S=1 causes E. So E still happens. Counterfactual: if C were 0, E would still be 1. So Lewis says C didn't cause E. But Woodward says it did. 

  But why would S=1 in the closest world? Lewis's similarity metric prioritizes small miracles. A small change might be S flipping, which causes C to flip. So if flipping S is considered a small miracle compared to directly changing C? Lewis's system might consider it more similar to have a small change in the past (S) leading to C=0, rather than a miracle that sets C=0 directly. 

