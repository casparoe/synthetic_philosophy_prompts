  The harmonic soul theory is crucial here. Kepler believed planetary angles affected humans through actual geometric resonance - a physical mechanism. Apps reduce this to psychological content generation, which he'd see as divorcing celestial influence from its mathematical basis. His "foolish daughter" metaphor cuts both ways: he'd admire the astronomical precision but despise the automated interpretations.

  Hmm... the empirical angle is tricky. Kepler collected hundreds of horoscopes to test correlations, while apps amass petabytes of user data. But would he consider self-reported personality traits valid evidence? Probably not - he'd demand rigorous medical/event correlations. And the profit motive ("paying astronomy's bills") might disturb him if it incentivizes keeping users hooked rather than truth-seeking.

  Where the analogy truly breaks: Kepler saw astrology as natural philosophy requiring human judgment. Apps remove the astrologer entirely, making the interpretation both mass-produced and detached from his harmonic physics. That algorithmic leap might be the point where he'd throw up his hands and mutter about modern charlatans.

