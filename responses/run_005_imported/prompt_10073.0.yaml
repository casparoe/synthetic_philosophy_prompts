prompt: |-
  I'm taking a seminar this term on early modern political philosophy, and this week's unit paired Plato's discussion of poetry and mimesis in Books II, III, and X of the Republic with Rousseau's Letter to d'Alembert on the Theatre, the pamphlet he wrote against d'Alembert's suggestion, in the Encyclopédie article on Geneva, that the city finally build a playhouse. Going in, I assumed the two texts would amount to more or less the same argument dressed in different centuries of clothing, since both end up wanting to keep the stage out of a well-ordered political community, but sitting with them side by side for discussion section has left me less sure the overlap runs as deep as it first looks. A classmate argued that Rousseau is essentially "just doing the Book X argument for eighteenth-century Geneva"; our professor didn't reject this outright, but she looked skeptical, and I'd like to work out for myself whether the comparison holds up.

  Could you compare the two critiques of theater in some depth? I'm especially interested in whether Plato and Rousseau are diagnosing the same underlying danger in watching a play, or whether the two accounts come apart once you look closely: how much weight, for instance, does each philosopher give to strictly metaphysical worries about imitation and distance from the truth, of the kind Plato raises with the three beds, compared with worries about passive spectatorship, the actor's professional counterfeiting of passion, and the particular civic character a republic needs to cultivate in its citizens? I'd also like you to address Rousseau's proposed alternative to the theater, the open-air civic festival in which citizens are simultaneously performers and audience for one another with no stage between them: does that alternative genuinely escape the objections Plato raises against mimetic art, or does it just relocate the same underlying problem to a different setting? Finally, tell me which of the two critiques seems more internally consistent on its own terms, and justify your answer.
