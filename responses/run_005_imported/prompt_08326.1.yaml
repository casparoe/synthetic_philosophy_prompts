answer: |-
  Here are eight substantive questions probing Scanlon's assurance view of promising, designed to spark deeper discussion, with follow-ups anticipating likely responses:

  1.  **The Dying Friend & Retrospective Assurance:**  
      *Question:* In the "dying friend" case, where you promise to fulfill a last wish (e.g., destroy private letters) and the friend dies immediately after, there's no possibility of future reliance or ongoing mutual awareness of the assurance. What grounds the persisting wrong of breaking such a promise? Doesn't the absence of a living promisee undermine the "mutually recognized assurance" element central to Principle F?  
      *Likely Answer:* The wrong lies in the *initial act* of creating the assurance, exploiting the trust solicited *at the moment of promising*, even if the friend never experiences the breach. The obligation is incurred by the act of assuring.  
      *Follow-Up:* If the wrong is solely retrospective (focused on the past act of misleading during the promising event), does this collapse the moral force into a general prohibition against deceptive speech acts at time T1, rather than a distinctive *ongoing* obligation persisting after T1? How is this different from lying?

  2.  **Distinctiveness vs. Anti-Manipulation:**  
      *Question:* Principle F grounds the wrong in exploiting expectations intentionally created. Isn't this prohibition against manipulating expectations via assurances a general moral norm applicable to many contexts (e.g., falsely assuring someone you've turned off the gas)? If so, what distinguishes the *unique* wrong of *promising* from other instances of wrongful expectation-manipulation? Is the performative ritual ("I promise") doing any essential work beyond signposting an especially firm assurance?  
      *Likely Answer:* Promising involves a specific *kind* of assurance: it invokes a recognized social practice where the utterance itself creates a distinctive reason to act (the promise) and a distinctive right of the promisee to expect performance and hold the promisor accountable.  
      *Follow-Up:* If the distinctiveness relies *entirely* on invoking a social practice, doesn't this move Scanlon's view closer to practice-based accounts (like Rawls or Searle) that he explicitly rejects? If the distinctiveness comes *only* from the *promisor's intention* to create a binding assurance, how does this avoid circularity (the intention is to create a promise, which is defined by the binding assurance)?

  3.  **Release vs. Expectations - The Power of the Will:**  
      *Question:* A promisee can release a promisor from the obligation, even if the promisee *fully expects* the promisor to perform anyway (e.g., "I release you, but I know you're the type who will still do it"). If the normative force comes from the state of assurance (the mutually recognized expectations), why does the release dissolve the obligation despite the expectation persisting? Doesn't this suggest the promisee's *will* or *authority* (their power to waive the claim) is doing the fundamental normative work, not the state of assurance itself?  
      *Likely Answer:* Release *changes* the normative landscape. By releasing, the promisee explicitly withdraws their claim based on the assurance. The assurance state is dissolved or altered by the promisee's exercise of their normative power over the claim created by the promise.  
      *Follow-Up:* If the release dissolves the obligation regardless of the promisee's *actual* expectations, doesn't this imply that the core normative element *is* the promisee's conferred authority over the promisor's obligation (a will-based right), and the "assurance" is merely the *trigger* for creating that authority relation? Is the assurance state descriptive or constitutive?

  4.  **Tacit Assurances & Implied Promises:**  
      *Question:* Many obligations resembling promises arise without explicit performatives (e.g., showing up for a regular meeting implies assurance of future attendance). Does your view readily extend to such tacit assurances? If so, what criteria distinguish a tacit assurance creating a promise-like obligation from mere reasonable reliance or social convention?  
      *Likely Answer:* Yes, it can extend. The key is whether one party intentionally induces the other to form expectations about future behavior, and this is mutually recognized, creating a normative claim analogous to an explicit promise. Context and communication patterns matter.  
      *Follow-Up:* Doesn't this risk over-generating promissory obligations? How do we avoid collapsing nearly all cooperative social interactions involving reliance into promissory relationships governed by Principle F? Where is the line between "inducing expectation" and simply acting predictably?

  5.  **Justification & Assurance:**  
      *Question:* Principle F mentions "absent justification." How does justification function within the assurance framework? Does a justification negate the initial wrongfulness of creating the assurance, or does it merely provide an overriding reason that excuses breaking the valid assurance? Does the type of justification needed depend on the *strength* of the assurance created?  
      *Likely Answer:* Justification typically provides an overriding reason that makes breaking the promise permissible *despite* the pro tanto wrong of failing the assurance. The strength of the initial assurance might influence the threshold for sufficient justification.  
      *Follow-Up:* If justification merely excuses breaking a valid assurance, does this mean creating the assurance *always* generates a pro tanto obligation, even if breaking it is sometimes permissible? How does this account for cases where the justification arguably *negates* the initial obligation (e.g., promise based on false information)?

  6.  **The Role of Social Practice (Revisited):**  
      *Question:* While you reject the idea that promissory obligations are *constituted* by social practices, doesn't the *effectiveness* of the assurance (its mutual recognition and the specific expectations it creates) fundamentally depend on the existence of a shared social understanding of what promising *means*? In a society without the concept of promising, could Principle F generate promissory obligations?  
      *Likely Answer:* The core moral wrong (intentionally inducing and then exploiting trust about future behavior) could occur without a practice called "promising," but the specific *form* and *clarity* of the obligation depend on shared conventions. Principle F captures the underlying moral structure that the practice institutionalizes.  
      *Follow-Up:* If the specific normative contours (e.g., the right to release, the distinctive force) rely on shared conventions, isn't the Scanlonian account ultimately parasitic on a practice it purports to ground independently? Can the "assurance" truly be "mutually recognized" without shared conventions defining what counts as an assurance of *this* type?

  7.  **Assurances Without Promises?**  
      *Question:* Can one create the kind of mutually recognized assurance that Principle F governs *without* making a promise? For example, a very solemn statement of intent ("You have my solemn word I will be there") or perhaps even consistent past behavior creating a firm expectation? If so, what distinguishes these non-promissory assurances from promises? If not, what specific element does the explicit "I promise" add that is necessary for Principle F to apply?  
      *Likely Answer:* Explicit promises are the clearest, strongest way to create such an assurance, but other acts or statements *can* create similar obligations if they meet the criteria of intentionally inducing and mutually recognizing a specific assurance of performance. "I promise" signals the highest level of commitment within this framework.  
      *Follow-Up:* Doesn't this blur the line significantly? If Principle F governs solemn assurances *and* promises, does the concept of "promising" retain any unique moral significance within your theory, or is it simply the most salient instance of a broader category of assurance-based obligations?

  8.  **Third Parties & Assurance:**  
      *Question:* How does the assurance view handle obligations to third parties affected by broken promises? (E.g., I promise Alice to care for her child; breaking it wrongs the child). Principle F focuses on the promisor/promisee dyad. Does the child's claim derive solely from Alice's assurance-based claim, or is there an independent wrong done *to the child* based on the assurance created (even if not directly with them)?  
      *Likely Answer:* The primary obligation and direct wrong is to Alice (who received the assurance). Any wrong to the child is derivative (a failure of Alice's duty arising from the promise) or based on independent duties (e.g., general harm). The assurance was created with Alice.  
      *Follow-Up:* If the promisor *knows* Alice is relying on the promise specifically to secure the child's welfare, and makes the promise with that understanding, hasn't the promisor also intentionally created an expectation *in the child* (via Alice) about their future conduct? Does Principle F need modification to account for induced reliance/expectations in foreseeable third parties?

  These questions target core tensions in the assurance view—its handling of time (dying promise), the source of normativity (will vs. assurance state), its distinctiveness from broader norms and practices, and its scope (tacitness, third parties). The follow-ups are designed to push the speaker towards clarifying the boundaries and foundations of her position. Good luck with the colloquium!
