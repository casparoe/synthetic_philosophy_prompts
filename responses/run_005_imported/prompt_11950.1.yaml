  First, I need to address the probability aspect. The probability of specific events lining up exactly as they did seems astronomically low when viewed in isolation. But humans tend to misjudge probabilities, especially rare events. We remember the one time something unlikely happened, not the countless times it didn't. That's selection bias at play. He's only noticing this chain because it led to a significant outcome. All the other near misses in his life that didn't result in anything memorable are forgotten.

