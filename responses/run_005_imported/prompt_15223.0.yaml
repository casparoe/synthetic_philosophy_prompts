  The Löbian obstacle is indeed about formal systems - specifically how an axiomatic system can't prove its own soundness using just its own rules. But humans aren't axiomatic systems. Our brains are messy, probabilistic, and constantly rewiring. The user seems aware this might be an imperfect analogy but wants to know where the boundaries are. 

  Where the analogy holds: 
