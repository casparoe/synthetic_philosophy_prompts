  For Character A (defending foresight), I'll emphasize the practical avoidance of exploitation through backward induction or commitment. Their strongest points should include:
  - The naive agent's endless pumping vs. sophisticated agent's clean refusal
  - The distinction between actual loss vs. hypothetical preference violation
  - Rationality as avoiding real-world harm rather than satisfying abstract axioms

  Character B (critiquing foresight) needs equally compelling counters:
