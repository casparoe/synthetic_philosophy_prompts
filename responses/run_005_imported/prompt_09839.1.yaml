  Also, the difference between intention and prediction: in external commitments, the intention is valid because it's about creating the system, not the action. Once set, prediction becomes certain because enforcement is external. 

  For promise-keeping, the social and reputational costs add external stakes, similar to the commitment devices. This makes promises more resilient than pure internal commitments. 

