  Naomi's final point addresses these patches. She mentions the "child's play" objection where simply adding irrelevant true statements can artificially inflate a theory's verisimilitude score. She also points to the problem with possible-worlds approaches where the ranking can flip depending on how we describe the worlds. These are well-known issues in the literature that show the difficulty of creating a satisfactory formal account of verisimilitude.

