prompt: |-
  So I'm about a third of the way into a novel set in Ireland in the late 1730s, right in the middle of the coin shortage, and my main character is a bishop loosely modelled on George Berkeley who keeps reading drafts of his own Querist queries out loud at dinner parties to try to convert the guests to his view that money isn't wealth at all, just a "ticket" or counter for keeping track of who owes what to whom. My agent keeps telling me the book has too many dinner-party scenes already, but I want this one to work, so I've got him sparring with a guest just back from Edinburgh who's been reading Hume's economic essays (mainly "Of Money") and thinks he's got the more hard-nosed, grown-up view of the subject. Problem is my own grip on where they actually diverge is pretty hazy -- I know they both agree that money itself, gold and silver, isn't whats valuable and that piling up bullion isn't the same as national wealth, but past that shared starting point I can't tell you with confidence where the real disagreement kicks in.

  Could you lay out the comparison properly for me, in some depth? Specifically: what does each of them think money most fundamentally IS (ticket/counter vs. the "wheels of trade" oil metaphor, or however you'd put it), what does each think actually happens to a country's industry and prices when the money supply expands or contracts, and would they have agreed or clashed over Berkeley's pet scheme of a national bank issuing paper credit that isn't fully backed by specie -- I have a feeling Hume gets cagey about paper credit somewhere but I honestly don't remember if that's in "Of Money" itself or a different essay. And then, for the purposes of deciding who wins the argument at my dinner table: which of the two views actually holds up better against how a modern economist or central banker would describe what money is and does, and why? I don't want the sophomore-seminar answer of "Berkeley's the idealist, Hume's the empiricist," I want the actual mechanics of the disagreement.
