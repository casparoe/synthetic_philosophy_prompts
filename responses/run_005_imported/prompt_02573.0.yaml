  **Hardest to Manipulate** (in practice, requiring significant coordination or information, and/or having high risk and complexity):
  - Condorcet methods (Schulze, Copeland): because of the complexity and high information requirements.
  - Majority Judgment: manipulation is non-trivial and requires knowing the current median grades.
  - STAR Voting: relatively resistant due to the two-step process, but still has some vulnerability.

