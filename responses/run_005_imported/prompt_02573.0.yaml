  - Instant-Runoff Voting (IRV): while better than plurality, it still has known vulnerabilities and requires some information about the elimination order.
  - Approval Voting: straightforward to vote strategically in some cases (e.g., bullet voting) but doesn't require much information. However, it is generally considered more resistant than plurality and IRV in some aspects.

  **Easiest to Manipulate**:
  - Plurality: very easy to manipulate (vote-splitting, spoiler effect) and well-known.
  - Borda Count: vulnerable to strategic ranking and relatively easy to manipulate with minimal information.

  But note: Some sources might put Approval in a better category. However, we are considering the ease of manipulation for an average voter. Approval is simple to manipulate by truncating (not approving candidates that are too strong or too weak) but it is still less vulnerable than plurality.

