answer: |-
  Based on your criteria (practical difficulty of manipulation for average voters, considering information requirements, computational complexity, and risk of backfiring), here's the tiered ranking. This synthesizes voting theory research on real-world vulnerability, not just theoretical possibilities:

  ```json
  {
    "hardest_to_manipulate": ["Majority Judgment", "Condorcet methods (Schulze/Copeland)", "Approval voting"],
    "moderate": ["STAR voting", "Instant-runoff voting (IRV)"],
    "easiest_to_manipulate": ["Plurality", "Borda count"]
  }
  ```

  ### Key Reasoning:
  1. **Hardest Tier**  
     - **Majority Judgment**: Manipulation requires knowing precise *median* scores across all voters – near-impossible for individuals. Strategic grading often backfires.
     - **Condorcet methods**: NP-hard computational complexity to find strategic votes. Requires full knowledge of all preferences to reliably manipulate (hopeless for average voters).
     - **Approval**: Simple ballot, but optimal strategy ("calibration") needs viability data. Honest voting rarely backfires, making it robust *in practice*.

  2. **Moderate Tier**  
     - **STAR**: Min-max strategy (5/0 scores) is simple *if* you know the top two contenders, but runoff step mitigates damage. Risk: over-strategizing can backfire.
     - **IRV (Ranked-Choice)**: Requires predicting elimination order – complex but feasible in polarized races (e.g., "favorite betrayal" strategy). Burlington 2009 is a real example.

  3. **Easiest Tier**  
     - **Plurality**: Vote-splitting makes strategy obvious (viability guessing). Requires minimal info: "Who's top 2?" Real-world failure rate: high.
     - **Borda Count**: Highly vulnerable to "burying" (ranking rivals last) or "truncation". Easy to execute with basic polling knowledge.

  ### Critical Context:
  - **No system is immune** (per Gibbard-Satterthwaite), but resistance varies *dramatically* in practice.
  - **Approval & Condorcet** aren't perfectly strategy-proof, but manipulation is either computationally impossible (Schulze) or rarely beneficial (Approval) for ordinary voters.
  - **IRV's weakness**: Strategic voting is cognitively hard but *happens* in high-stakes elections (Australia, UK unions).
  - **Best practical pick**: Approval or Condorcet if you prioritize strategy resistance. Avoid Plurality/Borda.

