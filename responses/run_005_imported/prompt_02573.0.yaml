  We are going to analyze the vulnerability to strategic voting (manipulation) for the given voting systems. The Gibbard-Satterthwaite theorem tells us that no system is perfectly strategy-proof (unless it's a dictatorship) when there are 3 or more candidates. However, some systems are more resistant in practice than others. We consider how easy it is for an average voter to manipulate the outcome without having to know the exact preferences of all other voters.

  Factors to consider:
  - **Information requirements**: How much does a voter need to know about others' votes to successfully manipulate?
  - **Computational complexity**: How hard is it to figure out how to vote strategically?
  - **Frequency of opportunities**: How often does a situation arise where strategic voting can change the outcome?
  - **Risk of backfiring**: How likely is it that strategic voting might lead to a worse outcome for the manipulator?

  We'll categorize the methods into three tiers: hardest_to_manipulate, moderate, and easiest_to_manipulate.

  1. **Plurality (First-past-the-post)**: 
     - Very vulnerable to strategic voting (e.g., vote-splitting, which is what happened in the student council election). 
     - Voters often have an incentive to vote for a less-preferred but more viable candidate to avoid wasting their vote (e.g., the "spoiler effect").
     - Easy to manipulate: only requires knowing which candidates are front-runners.

  2. **Borda Count**:
     - Vulnerable to strategic voting. Voters can rank a strong candidate lower to reduce their points and rank a less threatening candidate higher. 
     - Requires some knowledge of the relative strengths of candidates to manipulate effectively, but it's not too complex.

  3. **Instant-Runoff Voting (IRV) / Ranked-Choice**:
     - Less vulnerable than plurality but still manipulable. 
     - Strategic voting in IRV can be complex because it requires predicting the order of elimination and adjusting rankings accordingly. 
     - The risk of backfiring is higher because if the voter's prediction is wrong, their vote might get exhausted or have unintended consequences. 
     - However, in practice, it is less prone to the spoiler effect than plurality.

  4. **Approval Voting**:
     - Voters can approve as many candidates as they want. 
     - Strategic voting involves deciding the threshold for approval. 
     - It is relatively resistant to strategic voting because voters can honestly approve all candidates they like without fear of wasting their vote. 
     - However, in close races, voters might be tempted to approve only their top choice to avoid helping a less-preferred candidate. 
     - Information requirements: low, because voters only need a sense of candidate viability.

  5. **Condorcet Methods (Schulze, Copeland)**:
     - These methods are designed to elect the candidate who would beat every other in a head-to-head. 
     - They are generally considered resistant to strategic voting because it is computationally difficult to find a strategic vote that will achieve a desired outcome without knowing the full preference profile of all voters. 
     - The complexity of the method makes it hard for an average voter to know how to manipulate.

  6. **STAR Voting** (Score Then Automatic Runoff):
     - Voters score candidates (e.g., 0-5). The top two by total score go to an automatic runoff, where the candidate preferred by a majority wins. 
     - Strategic voting can occur in both the scoring and the runoff. 
     - However, because it allows full expression of preference, and the runoff reduces the incentive for strategic scoring, it is relatively resistant. 
     - But it is still vulnerable to strategic scoring (e.g., min-maxing: giving max to one and min to another to influence the runoff).

  7. **Majority Judgment**:
     - Voters assign grades (e.g., A-F) to each candidate, and the candidate with the highest median grade wins. 
     - Strategic voting can occur by giving a lower grade to strong competitors and a higher grade to the preferred candidate. 
     - However, the median-based approach makes it somewhat resistant because changing the median requires a significant number of voters to adjust grades. 
     - The information requirement is moderate: voters need to know the current grades distribution to effectively manipulate.

