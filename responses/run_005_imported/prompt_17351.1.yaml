    "A": ["Cartwright's capacities-based view (6)"],
    "B": ["Cohen and Callender's \"Better Best System\" (2)"],
    "C": ["Lewis's Humean Best-System Analysis (1)"],
    "D": ["Armstrong/Dretske/Tooley necessitation (3)", "Dispositional essentialism (Bird/Ellis) (4)"]
  }
