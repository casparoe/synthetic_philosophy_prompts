  1. **Lewis's Humean Best-System Analysis (BSA)**: Laws are the axioms of the best systematization (in terms of simplicity and strength) of the Humean mosaic. In this view, the constants are part of the axioms. If we change a constant, we get a different axiom system. But then, the counterfactual scenario would involve a different best system, so it would be about different laws. This might make the counterfactual about a different law altogether, which is what we want to avoid. However, note that in the actual world, the constant is fixed by the best system. When we consider a counterfactual with a different constant, we are not changing the entire mosaic but holding the form fixed and only changing the constant. The BSA might have trouble because the best system in the actual world includes the constant, so a world with a different constant would have a different best system. Thus, it might not be the same law. This could lead to trivializing the counterfactual as about a different law. Also, the law/accident distinction is maintained by the best system, so we don't collapse that. But the intelligibility of the counterfactual might be at risk.

  2. **Cohen and Callender's "Better Best System" (BBS)**: This refines BSA to make it more applicable to special sciences and to handle scale-relative laws. It allows for systems that are not global but for a domain. This might help because we can consider the same functional form as part of the system, and the constant might be seen as a parameter that can vary without changing the form. However, the best system for a domain would still depend on the actual values. Changing the constant might lead to a different system. But because BBS is more flexible, it might allow for holding the form fixed and varying the constant as a way of generating counterfactuals within the same system. This might be more accommodating than Lewis's BSA.

  3. **Armstrong/Dretske/Tooley (ADT) necessitation account**: Laws are relations of nomic necessitation between universals. The law is a relation between universals, and the constant might be seen as part of that relation. For example, Coulomb's law might be a relation between charge and distance that necessitates a force with a specific constant. If the constant is part of the universal (or part of the relation), then changing it would yield a different relation and thus a different law. However, one might argue that the relation (the form) is the same, and the constant is a parameter that can vary. But in the ADT account, the constant is likely an essential part of the law. Thus, a counterfactual with a different constant would be about a different necessitation relation. This might make the counterfactual about a different law, which could lead to trivializing it.

  4. **Dispositional essentialism (Bird/Ellis)**: Laws are grounded in the essential dispositions of properties. The constants are fixed by the essences of the properties. For example, the charge of an electron is an essential property, and thus the constant in Coulomb's law is fixed by the essence of the properties involved. Changing the constant would require changing the essences of the properties, which would mean we are dealing with different properties. Therefore, the law would be different because it involves different properties. This account seems to tie the constants tightly to the identities of the properties and thus the laws. Therefore, it would have difficulty with the counterfactual: it would either make it impossible (because the constant is essential) or it would be about a different law. This might lead to trivializing the counterfactual.

