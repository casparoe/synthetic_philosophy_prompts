prompt: |-
  I've been reporting a longread on the rationalist/effective altruism crowd and their love affair with Bayesian reasoning, and one thing that keeps coming up in interviews is "Good's theorem." A couple of people have explained it to me as basically a mathematical proof — from I.J. Good, apparently the same guy who was a codebreaker at Bletchley Park with Turing before he became a statistician — that the expected value of information can never be negative. The way it was put to me: a rational agent should always want more free information before deciding anything, so treating ignorance as a legitimate preference rather than a correctable bias doesn't really hold up. One source's exact line was "there's no such thing as a good reason not to want to know something, if its free to find out."

  Except for a completely different piece last month I interviewed a genetic counselor, and she told me a large share of people at risk for Huntington's disease deliberately choose not to get tested, and that this is treated as a totally normal, even textbook-standard, choice in her field rather than some mistake to be talked out of. That feels like a flat contradiction to me — either decision theorists have this wrong and ignorance really can be the smarter move, or genetic counselors are quietly encouraging irrational behavior in their patients. Can you help me sort out which side is actually mistaken here, or is there some wrinkle in what the theorem is really claiming that would make both of these things true at once? I'd rather get an actual answer than a "well, both have a point" shrug.
reasoning: |-
  Okay, the user is a journalist working on a piece about rationalists and effective altruists who heavily rely on Bayesian reasoning. They've come across "Good's theorem," which supposedly proves that free information can never have negative expected value. But they're confused because in genetic counseling, especially for Huntington's disease, many people choose not to get tested—and professionals support this choice. This seems contradictory. The user wants a clear resolution, not a vague middle-ground answer.

  First, I need to recall what Good's theorem actually states. It's about the expected value of information (EVOI), showing that free information can't have negative expected value. But the key here is "expected value," which is a technical term. Expected value is calculated based on probabilities and utilities. The theorem assumes that the decision-maker is rational and that the information is free. But in real life, "free" might not account for psychological costs. 

  The user mentioned that genetic counselors see opting out of Huntington's testing as rational. Huntington's is a genetic disorder with no cure, and a positive result can lead to significant psychological distress. So, even if the test is financially free, the emotional cost isn't. Good's theorem doesn't consider these subjective utilities. If the psychological burden of knowing is high enough, it could make the expected utility of getting the information negative.

  Another point is that Good's theorem applies to information that could influence decisions. In the case of Huntington's, if there's no preventive action, the information might not change any actions. The theorem still says the information has value because it could alter decisions, but if no decisions are affected, then the value is zero. However, even then, the psychological impact isn't zero. The counselor's perspective factors in the patient's mental well-being, which is part of their utility.

  The user might be missing that rationalists focus on idealized scenarios, while genetic counseling deals with real human emotions. The theorem's assumptions don't hold in cases where information causes harm without actionable outcomes. Also, the concept of "free" in the theorem is literal cost, but in practice, emotional costs are part of the utility function. So both sides are correct within their frameworks: the theorem is mathematically sound, but its application requires considering all utilities, including emotional ones.
answer: |-
  You've hit on a genuine tension, and there *is* a clear resolution that doesn't involve shrugging or dismissing either side. **The key lies in rigorously defining "free" and understanding what "value" means in Good's theorem.** The genetic counselors are almost certainly correct in supporting their patients' choices, and Good's theorem (while mathematically sound) doesn't actually contradict this when its assumptions are examined closely. Here's the breakdown:

  1.  **Good's Theorem (Value of Information - VoI) Simplified:**
      *   I.J. Good proved that for a rational decision-maker facing a choice between actions, the *expected value* of acquiring *costless, perfect* information relevant to that decision *before* making it can never be negative.
      *   **Core Insight:** Before you know what the information *says*, the *expectation* is that knowing it will allow you to make a *slightly better* decision on average than not knowing it. Ignorance can't be *strictly preferred* under these idealized conditions because information gives you the *option* to act differently if needed.
      *   **Crucial Assumptions:**
          *   **Costless:** Acquiring the information involves *zero* cost (financial, time, effort, psychological).
          *   **Relevant:** The information is directly pertinent to the decision at hand and could potentially change the optimal action.
          *   **Rational Actor:** The decision-maker can and will update their beliefs correctly (Bayesian updating) and choose the action that maximizes their expected utility *based on their actual utility function*.
          *   **Utility Focus:** "Value" is defined purely in terms of the *consequences of the subsequent action*. It's about improving the *outcome* of the decision.

  2.  **The Huntington's Disease Testing Scenario:**
      *   **The Decision:** The core decision facing an at-risk individual often *isn't* primarily medical treatment (as there is no cure or preventative treatment for Huntington's). The core decision is often about **life planning, relationships, reproduction, and psychological well-being.**
      *   **Why People Choose Not to Know:**
          *   **Psychological Cost (Violates "Costless"):** Learning you have an incurable, fatal neurodegenerative disease carries an immense, immediate, and ongoing psychological burden – anxiety, depression, hopelessness, existential dread. *This burden itself is a massive negative utility.*
          *   **Irrelevance to Action (Violates "Relevance" for some):** For many individuals, knowing their status *doesn't change their preferred course of action.* They may decide:
              *   "I will live my life fully regardless of the result."
              *   "I won't have children (or will use PGD) either way because the risk exists."
              *   "There is no preventative action I can take, so knowing won't improve my physical outcome."
          *   **Preservation of Hope (Utility Function):** Uncertainty allows for hope. Hope is a positive utility. Eliminating that hope by confirming the mutation is a direct loss of utility for many people. Their utility function places a very high value on current psychological well-being and hope.
          *   **Impact on Identity/Relationships:** Knowing one's status can profoundly alter self-perception and relationships, which are core components of utility.

  3.  **Resolving the Contradiction: Why Genetic Counselors Are Right & Good's Theorem Holds:**
      *   **"Free" Information Isn't Free:** Good's theorem assumes *zero cost*. In the Huntington's scenario, the **psychological cost is enormous and inherent to the information itself.** Acquiring this information is *not* costless. It directly inflicts a large negative utility (the psychological burden) regardless of any future action. This cost *must* be factored into the calculation.
      *   **Information Without Actionable Benefit:** If the information genuinely doesn't change the individual's best course of action *for their specific utility function* (e.g., they choose to live fully and avoid passing on the gene regardless of their status), then the potential positive VoI (from making a better decision) is **zero**. You can't improve a decision you wouldn't change. If the VoI is zero and the cost is high, the *net expected utility* of acquiring the information is **negative**.
      *   **Utility is Subjective:** Good's theorem maximizes expected utility *based on the individual's own utility function*. If an individual's utility function places extreme negative weight on the psychological state of *knowing* they have the mutation, and high positive weight on the state of *hoping* they don't, then *not knowing* genuinely maximizes their expected utility. This is perfectly rational *for them*. Good's theorem doesn't dictate what should be in someone's utility function; it tells you how to maximize it given that function.
      *   **Good's Theorem Applies to the *Decision to Acquire Information*:** The theorem itself is a tool for deciding *whether to get the information*. It requires estimating the VoI *and* the cost. In Huntington's, the high psychological cost often swamps any potential (or zero) VoI related to future actions, leading to a rational decision *not* to acquire it.

  **The Mistake in the Rationalist Interpretation:**

  The source claiming "there's no such thing as a good reason not to want to know something, if it's free to find out" made a critical error:

  1.  **Ignoring Non-Monetary Costs:** They equated "free" with "zero financial cost," completely ignoring psychological, emotional, and existential costs. For Huntington's testing, these costs are the *dominant* factor and are intrinsic to the information.
  2.  **Overlooking Utility Functions:** They assumed a utility function focused solely on long-term material outcomes or optimal decision trees, neglecting that current psychological states, hope, and avoidance of profound distress are *legitimate and primary components* of many people's utility.
  3.  **Confusing Potential Actionability with Actual Benefit:** They assumed the information *must* have positive value for future decisions. In Huntington's, for many, it demonstrably does not change the best course of action *and* comes with a huge cost.

  **Conclusion:**

  *   **Genetic Counselors are Correct:** Supporting the choice not to test for Huntington's is rational, evidence-based care. It respects the patient's autonomy and their specific utility function, which heavily weights avoiding catastrophic psychological harm and preserving hope. The information is not "free" in the required sense for Good's theorem.
  *   **Good's Theorem is Mathematically Correct:** Under its strict assumptions (truly costless, relevant information for a pending decision), the *expected* value of information cannot be negative *on average, before you see the result*.
  *   **The Contradiction is Resolved:** The Huntington's scenario **violates the core "costless" and sometimes the "relevance" assumptions** of Good's theorem. The psychological cost is real, significant, and must be included in the utility calculation. When this cost outweighs the potential (or zero) benefit to future decisions, the *net expected utility* of acquiring the information is negative. Therefore, choosing ignorance is the *rational, utility-maximizing choice* for many individuals in this specific situation.

  **Your Takeaway for the Article:** The rationalist interpretation you encountered oversimplifies Good's theorem by ignoring profound psychological costs and the subjective nature of utility. Real-world decisions, especially those involving devastating health information with limited actionability, demonstrate that information can absolutely come with inherent negative utility. True rationality requires incorporating *all* costs and benefits into the utility function, including the heavy toll of knowing unbearable truths. The Huntington's example isn't an exception to rational decision theory; it's a powerful demonstration of it when applied fully to the human condition.
