  ## MEMO: Revised Protocol for Handling Persistent Forecasting Disagreements

  **To:** Forecasting Group Members  
  **From:** Rules Committee Chair  
  **Subject:** Updated Procedure for Post-Discussion Disagreements & Response to Aumann’s Theorem Concerns  
  **Date:** October 26, 2023  

  ### Background
  Recent discussions highlighted tensions around our practice of averaging forecasts when two lead forecasters remain divided after a documented conversation. Concerns were raised that Robert Aumann’s agreement theorem implies persistent disagreement must indicate irrationality or hidden information, making averaging an invalid "dodge." We’ve taken this objection seriously and analyzed its applicability to our context.  

  ### Key Insights on Aumann’s Theorem
  Aumann’s result is profound but relies on **idealized conditions** that rarely hold in practice:  
  1.  **Perfect Rationality:** Agents must process all information flawlessly. Humans, however, face cognitive limits, time constraints, and unconscious biases.  
  2.  **Common Priors:** Forecasters must start with identical prior beliefs. Our group has diverse expertise and subjective interpretations of evidence.  
  3.  **Costless, Complete Information Sharing:** All private knowledge must be fully transferable and absorbed. In reality, tacit insights (e.g., intuition from past projects) are often ineffable or time-consuming to articulate.  
  4.  **Common Knowledge of Posteriors:** Agents must not only share estimates but *know* the other knows their estimate, *know* the other knows they know, etc. Our calls facilitate dialogue but don’t guarantee this infinite regress.  

  **In essence:** Aumann proves disagreement *shouldn’t* persist under ideal conditions. It does *not* prove that persistent disagreement in real-world settings *must* stem from dishonesty or incompetence. In our environment—where forecasters balance reasoning with workload—divergence can legitimately arise from:  
  - Differing weight given to ambiguous evidence,  
  - Unavoidable gaps in private information,  
  - Or irreducible subjectivity in interpreting complex scenarios.  

  ### Recommended Rule
  **After a documented discussion fails to resolve significant disagreement (>15 percentage points) between our two most active forecasters, we will continue to average their final estimates.** However, we add two critical safeguards:  

  1.  **Mandatory Brief Rationale:** Each forecaster must append 1–2 bullet points to the call transcript summarizing *why* their estimate remains unchanged (e.g., "Weighted Client X’s history of delays higher," "Discounted Supplier Y’s optimism based on past interactions"). This fosters transparency without burdening colleagues.  
  2.  **Calibration Review:** Persistent disagreements will be flagged for quarterly calibration audits. If one forecaster consistently outperforms in contested cases, their future estimates may receive higher weight.  

  ### Why Averaging (with Safeguards) Remains Best  
  - **Practicality:** Forcing consensus between busy professionals on unclear outcomes is unrealistic and risks anchoring or groupthink.  
  - **Robustness:** Empirical studies (e.g., Tetlock’s forecasting tournaments) show simple averages often outperform individual experts by dampening idiosyncratic errors.  
  - **Fairness:** It acknowledges both forecasters’ effort while leveraging our leaderboard’s long-term calibration tracking to address systemic biases.  

  ### Addressing the Core Concern  
  Averaging is not a dismissal of rigor but a pragmatic response to *genuine* uncertainty under constraints. The safeguards ensure we:  
  1. Surface reasoning gaps (addressing "hidden information" worries),  
  2. Reward calibration (addressing "reasoning badly" risks),  
  3. And preserve efficiency.  

  Aumann’s theorem reminds us to share reasoning exhaustively—which we do via calls and rationales—but it cannot mandate convergence where legitimate uncertainty or differing judgment persists.  

  ### Next Steps  
  This rule takes effect next forecasting cycle. The committee will review its impact in 3 months, including any patterns in rationale documentation. We encourage ongoing focus on refining your reasoning—our strength lies in combining diverse perspectives, not demanding uniformity.  

  **Approved by Rules Committee:**  
  [Chair Name], [Member 1], [Member 2]  

  ---  
  *This memo balances theoretical rigor with operational reality. It upholds accountability (via rationales and audits) while accepting that fallible humans under time pressure may validly disagree—making averaging a defensible aggregation tool, not a compromise of principles.*
