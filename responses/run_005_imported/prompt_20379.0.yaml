answer: |-
  ## Commencement Address: The Shared Fire, the Different Compass

  Faculty, distinguished guests, proud families, and most importantly, the graduating classes of the Fiction MFA and Journalism programs:

  Look around you. You sit today, robed and ready, shoulder-to-shoulder, yet you represent two worlds often perceived as opposing forces. One, the realm of meticulously researched facts, the relentless pursuit of "what happened." The other, the domain of invented lives, intricate worlds spun from the raw material of "what if." Novelists and journalists. Storytellers, both, yet seemingly defined *against* each other.

  And my university, knowing I've straddled this line – trained first in the newsroom before venturing into the novelist's study – thought, "Ah, perfect! Let *them* make sense of this." So here I am, acutely aware that in this room, someone who wonders if a "MFA" is a new kind of appliance sits next to someone who assigns Hannah Arendt before breakfast. My task? To speak to both altitudes.

  So let me start with something fundamental, something both your crafts demand, something the philosopher Hannah Arendt identified with startling clarity: **imagination.**

  Not the fluffy, daydreaming kind, though that has its place. But the profound, necessary human capacity Arendt described – **the ability to hold in mind a world *other* than the one that is actually the case.** To envision possibilities, alternatives, narratives that diverge from the immediate, tangible reality before us.

  This capacity, Arendt argued, is wielded by two powerful, and often problematic, figures: **the political liar and the storyteller.** Both use imagination to construct an alternative reality. The liar does it to manipulate, to obscure the shared world we all inhabit. The storyteller – the novelist, the journalist – does it... why? And crucially, *what happens next?* Because for Arendt, the critical distinction isn't the imaginative spark itself, but **what each does afterward to the shared factual world their audience still has to live in.**

  This is where your paths, graduates, diverge magnificently, yet remain bound by a common responsibility.

  **To the Journalists:** Your training is rooted in fidelity to the shared world. You are the cartographers of the *is*. You chase documents, witness events, interrogate sources, verify, triangulate. Your sacred task is to report back accurately on the terrain we all must navigate. You might think, "Imagination? That’s *their* department." But you’d be wrong, and dangerously so.

  *   **Your imagination is your empathy engine.** It allows you to inhabit the perspective of the factory worker facing layoffs, the refugee fleeing conflict, the scientist wrestling with complex data. You imagine *their* world within the factual one to make their realities comprehensible to your audience.
  *   **Your imagination is your investigative compass.** It helps you see the pattern hidden in the noise, the connection between seemingly disparate facts. You imagine *possible* explanations, *potential* consequences, *likely* outcomes – hypotheses you then rigorously test against the bedrock of evidence. Without this imaginative leap, you only see surfaces; you never probe the depths.
  *   **Your imagination is your shield against manipulation.** When a political liar spins an alternative reality, you must be able to *imagine* that lie, understand its structure and appeal, to effectively dismantle it with facts. You combat false narratives not just with data, but by understanding the imaginative hooks they use.

  **But here is your crucial "afterward":** You *return* relentlessly to the verifiable. Your constructed narrative – the news story – is constantly measured, sentence by sentence, against the shared factual world. It is accountable. It must withstand scrutiny. Your imaginative leaps serve one ultimate purpose: to illuminate the truth *of* that shared world more clearly. You build bridges *back* to the real. Your power lies in tethering your imagination to the anchor of evidence. Without that anchor, you drift into the territory of the liar. With it, you perform an essential democratic act.

  **To the Novelists:** Your training celebrates the unfettered exploration of the *could be*. You build worlds from scratch, breathe life into characters who never existed, chart courses through emotional and psychological landscapes no journalist would dare claim as fact. And yes, you wield that same Arendtian imaginative capacity to hold worlds other than the one that is. Some might cynically say, "Ah, professional liars!" But that misses the profound point.

  *   **Your imagination is your truth-seeking scalpel.** You dissect the human condition not by reporting its surface symptoms, but by inventing scenarios that reveal its hidden nerves and bones. A fictional betrayal can expose the anatomy of real-world trust more vividly than any case study. A dystopia can illuminate the fragile mechanics of our own society with terrifying clarity. Your "lies" are experiments in human truth.
  *   **Your imagination is your empathy forge.** You ask your reader not just to understand, but to *become* another person, to live in their skin, feel their joys and despairs in a way pure reportage rarely achieves. You build bridges *into* the interior worlds of others.
  *   **Your imagination is your challenge to the given.** You show us that the world as it *is* is not the only world possible. You offer visions of despair, hope, absurdity, and beauty that expand our sense of what it means to be human.

  **And here is *your* crucial "afterward":** You launch your invented world into the *same* shared factual world we all inhabit. While not accountable to literal fact-checking, you are accountable to a deeper resonance. Does your invented world, however fantastical, ring true to the complexities of human experience? Does it offer insight, catharsis, or a necessary challenge *about* the world your reader returns to when they close the book? Does it, in its own way, illuminate a truth *about* our shared reality? A novel that offers only escape, that doesn't ultimately connect back to the human truths of the world we live in, squanders its power. Your power lies in using the unreal to reveal the real. Your invented worlds must ultimately cast light back onto our shared one.

  So, graduates, you see? You are not opposites. You are siblings wielding the same potent fire: the human imagination. The fire that allows us to envision beyond the present, to hope, to fear, to plan, to create, and yes, sometimes, to deceive.

  **The difference – the vital, essential difference – lies in your relationship to the shared world *after* the spark.**

  Journalists: You are the guardians of the factual commons. You use imagination to illuminate it, challenge distortions within it, and map it faithfully. Your work *returns* us, informed and empowered, to the world as it is. Never let the necessary friction of fact-checking extinguish the spark of empathy and insight that drives your best work.

  Novelists: You are the explorers of the human soul within the possible. You use imagination to build temporary worlds that, if successful, alter how we perceive and inhabit our permanent one. Your work *sends* us back into the shared world with new eyes, deeper understanding, or necessary discomfort. Never let the freedom of invention become an escape from the responsibility to speak truth, however obliquely, about the human condition we all share.

  Do not define yourselves against each other. Define yourselves by the rigor and integrity with which you wield your shared gift. The journalist, anchoring imagination in evidence to serve the real. The novelist, unleashing imagination to reveal deeper truths *about* the real.

  Both crafts are acts of profound responsibility. Both, at their best, are acts of love for the complex, messy, shared world we must navigate together. Both are desperately needed.

  So, go forth, Fiction MFA graduates. Build your dazzling, necessary other worlds. And Journalism graduates, go forth and illuminate the intricate truths of this one. Use your shared fire wisely. Tend to the shared world diligently. And remember: the measure of your work lies not just in the worlds you imagine, but in the light you cast back onto the world we all must live in.

  Congratulations, Class of [Year]! The world awaits your stories – all kinds of them.
