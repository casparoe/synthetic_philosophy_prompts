  Looking at move (1): Marcus claims "ghosting" has no fixed meaning because people use it subjectively. But he's overlooking how language actually works - words don't need exact boundaries to be meaningful. Devon's right to push back in (2) with the mountain example, though I wonder if he could've mentioned prototypes (like robin for "bird") to strengthen his point.

