  When Marcus argues in (5) that vagueness "breaks logic," he's showing his hand - he's probably a classical logic absolutist. But Devon's response in (6) is brilliant: he questions why we'd assume reality must fit binary logic. The "secret hour" point is especially sharp - it exposes how absurd precision would be here.

  Hmm... neither seems to mention supervaluationism (where something's "definitely ghosting" if true under all reasonable boundaries). That could've resolved some tension. Also missing is how context matters - ghosting after concrete plans vs. casual chatting might change the threshold.

  Overall, Devon navigates the philosophy better while Marcus oversimplifies language. But Marcus is right that subjective feelings influence "ghosting" - Devon could acknowledge that without conceding the word is meaningless. 

