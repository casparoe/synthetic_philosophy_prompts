answer: |-
  You've hit on a profound tension in Jefferson's argument that reveals the sophisticated, layered nature of his critique. Let's break down the two arguments and their relationship, then address the coherence of his closing concession:

  ### 1. The Relationship Between the Two Arguments: Complementary, Not Redundant
  - **Argument 1 (General Anti-Naturalism)**: Establishes that *no* stable property rights (even land) exist by "natural right." Property is a late social construct ("gift of social law").  
    *Function:* Undermines the foundational claim that inventors have a *natural, inherent* right to ideas. If land—the paradigmatic property—isn’t naturally owned, ideas *certainly* aren’t.  
  - **Argument 2 (Ontological Singularity of Ideas)**: Highlights ideas' unique characteristics: non-rivalry, inherent resistance to confinement, and inexhaustibility ("no one possesses the less, because every other possesses the whole").  
    *Function:* Shows that ideas are **categorically ill-suited** to being property *even as a social construct*, unlike land or physical objects. This isn't rhetorical reinforcement; it’s a distinct, ontological claim about why ideas resist propertization *in principle*.

  **Why both are needed**:  
  - Argument 1 defeats the *natural rights* theory of IP.  
  - Argument 2 preempts a potential counterargument: *"Even if property isn't natural, society can properlytize anything—including ideas, just like land."* Jefferson retorts: Ideas are fundamentally *unlike* land. Land is rivalrous, excludable, and scarce—making it *suitable* for social allocation as property. Ideas, by contrast, are non-rivalrous, non-excludable (once disclosed), and infinitely shareable—making them *resistant* to propertization. The fire/air metaphors emphasize this ontological incompatibility.  

  **In essence**:  
  - **General Argument**: "Nothing is *naturally* property."  
  - **Specific Argument**: "But even among socially constructed properties, ideas are uniquely *unfit* to be treated as such because their nature defies exclusivity and scarcity."  

  ---

  ### 2. The Closing Concession: Utility vs. Ontology
  Jefferson’s allowance that society *may* grant temporary monopoly profits ("exclusive right to the profits") is **not a contradiction** but a pragmatic concession grounded in *utilitarianism*, not natural right or ontological similarity to land:
  - **Key distinction**: Society grants rights over *profits from inventions* (a commercial opportunity), **not** over ideas themselves as inherent property.  
  - **Analogy to land? No**: When society propertizes land, it grants control over the *resource itself*. For inventions, society grants only a temporary *commercial advantage* ("encouragement to pursue utility"). This is a thin, instrumental right—not a recognition of inherent ownership.  
  - **Why it doesn’t undermine his case**:  
    - The concession is **conditional** ("may or may not be done, according to the will and convenience of society"). Land ownership is socially *necessary* for order; IP is a discretionary *policy tool* for progress.  
    - Ideas remain "incapable of confinement" ontologically—IP rights are artificial barriers erected *against* their natural behavior. Land rights align with physical exclusivity.  
    - Jefferson’s emphasis on ideas spreading "for the moral and mutual instruction of man" frames IP as a *limited exception* to nature’s design, justified *only* by short-term social utility.  

  ---

  ### Coherent Reconstruction: Jefferson’s Three-Tiered Argument
  1. **Meta-Property Argument**:  
     *No stable property of any kind is natural—all derive from social law.*  
     → *Implication:* IP cannot claim natural rights legitimacy.  

  2. **Ontological Argument**:  
     *Ideas possess intrinsic features (non-rivalry, inexhaustibility, resistance to confinement) making them uniquely resistant to propertization—unlike physical objects.*  
     → *Implication:* Even as social constructs, property rights in ideas are inherently fragile and artificial.  

  3. **Utilitarian Exception**:  
     *Despite #1–2, society may artificially restrict access to inventions’ profits temporarily to incentivize innovation—but this is a revocable policy choice, not recognition of inherent right.*  
     → *Implication:* IP is a pragmatic tool, not a true "property" analogue to land.  

  **Why it’s coherent**: Jefferson separates:  
  - **Descriptive ontology** (ideas aren’t *naturally* property and resist confinement),  
  - **Normative foundations** (no natural rights in any property), and  
  - **Social pragmatism** (limited monopolies as policy levers).  

  The "taper" metaphor isn’t just poetic—it crystallizes the *irreducible difference* between ideas and physical property. Land can be fenced; fire spreads uncontrollably. Society may build a *legal* fence around ideas, but this remains artificial and contingent, unlike the socially stabilized ownership of land.

  ---

  ### Scholarly Context: Sheff & Beyond
  Sheff’s focus on the taper metaphor rightly highlights its role in Argument #2—but your close reading reveals Jefferson’s deeper structure. Where Sheff sees a "rhetorical crescendo," you’ve identified a **necessary philosophical counterpoint** to the general anti-naturalism argument. Jefferson isn’t being redundant; he’s blocking the move from "society can propertize land" to "society can propertize ideas" by showing ideas lack the *preconditions* for stable property relations.

  **In your dissertation**, stress how Jefferson’s two arguments respond to distinct pro-IP positions:  
  - Against *Lockean natural rights*: Argument #1.  
  - Against *Hobbesian/Benthamite positivism* ("society can define property as it wishes"): Argument #2.  

  His synthesis suggests IP is doubly unjustified: lacking natural rights *and* being ontologically mismatched to property regimes—making it a purely utilitarian construct with no deeper foundation. This layered approach prefigures modern debates (e.g., Hettinger’s "Justifying Intellectual Property" (1989)) that disentangle natural rights, personality theory, and utilitarianism in IP.
