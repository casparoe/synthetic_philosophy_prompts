answer: |-
  ### Reconstructing Lewis's Bayesian Derivation
  Lewis's halfer position starts with Beauty's *prior* credence before the experiment:  
  - \( P(\text{Heads}) = \frac{1}{2} \)  
  - \( P(\text{Tails}) = \frac{1}{2} \)  

  Upon waking, Beauty considers **three centered possible worlds**, each corresponding to a waking moment:  
  1. \( H_{\text{Mon}} \): Heads and it’s Monday.  
  2. \( T_{\text{Mon}} \): Tails and it’s Monday.  
  3. \( T_{\text{Tue}} \): Tails and it’s Tuesday.  

  **Lewis’s halfer premise**: The coin toss is fair, and Beauty learns *nothing new* upon waking (since she knew she’d be woken). Thus:  
  - \( P(H_{\text{Mon}}) = P(\text{Heads}) = \frac{1}{2} \)  
  - \( P(T_{\text{Mon}}) = P(T_{\text{Tue}}) = \frac{1}{4} \) (since Tails splits probability equally across two days).  

  **Now, suppose Beauty learns "Today is Monday"**:  
  This eliminates \( T_{\text{Tue}} \), leaving only \( H_{\text{Mon}} \) and \( T_{\text{Mon}} \). Applying Bayes’ theorem:  
  \[
  P(\text{Heads} \mid \text{Monday}) = \frac{P(\text{Heads} \cap \text{Monday})}{P(\text{Monday})}
  \]  
  - \( P(\text{Heads} \cap \text{Monday}) = P(H_{\text{Mon}}) = \frac{1}{2} \)  
  - \( P(\text{Monday}) = P(H_{\text{Mon}}) + P(T_{\text{Mon}}) = \frac{1}{2} + \frac{1}{4} = \frac{3}{4} \)  

  Thus:  
  \[
  P(\text{Heads} \mid \text{Monday}) = \frac{\frac{1}{2}}{\frac{3}{4}} = \frac{2}{3}.
  \]  

  **Lewis's conclusion**: Learning "today is Monday" *increases* Beauty’s credence in Heads from \( \frac{1}{2} \) to \( \frac{2}{3} \), despite the coin toss being in the past.  

  ---

  ### The Objection: Self-Locating Facts and the Principal Principle  
  **The core objection**: How can a *self-locating* fact ("today is Monday") shift credence in an *objective past event* (a fair coin toss)? This seems to violate:  
  - **The Principal Principle (PP)**: If you know the chance of an event is \( x \), your credence should be \( x \).  
    Here, Beauty knows the coin is fair (\( \text{Chance(Heads)} = \frac{1}{2} \)), yet \( P(\text{Heads} \mid \text{Monday}) = \frac{2}{3} \).  

  **Lewis’s defense (using his theory of chance)**:  
  1. **Past chances are trivial**: Lewis holds that once an event occurs, its chance is 0 or 1 (*if settled*). The coin toss is in the past, so its chance *now* is 0 (if Tails) or 1 (if Heads).  
  2. **Beauty’s ignorance**: Beauty doesn’t know the outcome, so she *can’t* set her credence to the trivial chance. Instead, she relies on her *prior* knowledge of the pre-toss chance (\( \frac{1}{2} \)).  
  3. **Self-locating information as evidence**: Learning "today is Monday" *is* new evidence that shifts her epistemic state. It rules out scenarios (e.g., \( T_{\text{Tue}} \)) where the coin outcome (Tails) is true but today isn’t Monday.  

  **Does this violate the Principal Principle?**  
  - **Lewis says no**: PP binds credence to *known objective chances*. But at the time of updating, the chance of Heads is *no longer* \( \frac{1}{2} \)—it’s already 0 or 1. PP doesn’t constrain credence when chances are trivial.  
  - **The loophole**: PP applies to *future* or *unknown* chances. Here, Beauty is updating on *evidence* (self-locating or not), not ignoring known chances.  

  **The unresolved tension**:  
  Even if PP isn’t technically violated, it’s counterintuitive that self-locating information ("Monday") alters credence in a past physical event. Lewis’s derivation implies that *epistemic access* to temporal context can override prior objective chances.  

  ---

  ### Can Thirders Dodge This Cost?  
  **Thirder position** (Elga):  
  - Upon waking, \( P(\text{Heads}) = \frac{1}{3} \), \( P(\text{Tails}) = \frac{2}{3} \).  
  - If Beauty learns "today is Monday":  
    \[
    P(\text{Heads} \mid \text{Monday}) = \frac{P(\text{Heads})}{P(\text{Monday})} = \frac{\frac{1}{3}}{\frac{1}{3} + \frac{1}{3}} = \frac{1}{2}.
    \]  

  **Comparison**:  
  | Scenario                     | Halfer (Lewis) | Thirder (Elga) |  
  |------------------------------|----------------|----------------|  
  | Initial \( P(\text{Heads}) \) | \( \frac{1}{2} \) | \( \frac{1}{3} \) |  
  | \( P(\text{Heads} \mid \text{Monday}) \) | \( \frac{2}{3} \) | \( \frac{1}{2} \) |  

  **Thirder advantages**:  
  1. **No PP violation**: When Beauty learns it’s Monday, her credence in Heads becomes \( \frac{1}{2} \), matching the original chance.  
  2. **Self-locating shifts are consistent**: Updating reflects the elimination of the Tuesday awakening (under Tails), which was part of her uncertainty.  

  **Thirder costs**:  
  - **Initial credence seems incoherent**: Why should a fair coin toss have \( P(\text{Heads}) = \frac{1}{3} \) upon waking? This appears to ignore the physical symmetry of the coin.  
  - **Violates intuition about identical awakenings**: Halfer critics argue awakenings on Monday (Heads or Tails) are subjectively identical, so credence should remain \( \frac{1}{2} \).  

  **Key insight**:  
  Thirders avoid Lewis’s stark shift (\( \frac{1}{2} \rightarrow \frac{2}{3} \)) by *integrating* self-locating uncertainty into the initial credence. This distributes the cost of self-location across the entire problem rather than concentrating it in the update.  

  ---

  ### Conclusion  
  - **Lewis’s derivation** is mathematically sound under halfer premises but relies on treating self-locating information as relevant evidence for past events. His "trivial past chances" view shields him from a *technical* Principal Principle violation, but the update remains philosophically contentious.  
  - **Thirders** face a different cost: initial credence (\( \frac{1}{3} \)) appears detached from the coin’s physical fairness. However, they handle self-locating updates more elegantly, restoring \( P(\text{Heads}) \) to \( \frac{1}{2} \) upon learning the day.  
  - **Ultimate trade-off**: Both positions sacrifice one intuition to preserve another. Lewis prioritizes initial chance principles but allows self-location to influence past events; Elga prioritizes uniform treatment of awakenings but dilutes initial credence in physical chances.  

  For a physicist steeped in probability, the thirder view may offer greater consistency in handling self-locating uncertainty—but the halfer stance remains a defensible application of Bayesian updating under Lewis’s radical view of chance.
