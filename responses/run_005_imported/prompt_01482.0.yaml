  Next, the user asks about unstated assumptions. Hume describes workers accepting more work without demanding higher wages immediately. That implies money illusion—workers don't realize their real wages are rising temporarily. They see nominal gains but don't adjust for prices until later. This assumption is crucial for the mechanism to work. Without it, workers might demand higher wages sooner, neutralizing the effect faster. Hume doesn't mention this explicitly, so it's a tacit reliance on behavioral factors.

