prompt: |-
  Quick bit of context: I'm a backend/ML engineer at a small consumer-lending startup, and because I built the underwriting model I somehow got pulled onto our "Responsible AI Council" -- a very extra name for six people arguing over Zoom every other Thursday. The model outputs a probability-of-default number for every applicant, which drives pricing and approval decisions. The current version buckets applicants pretty coarsely (state, broad age band, credit tier), but our data science lead wants to ship a v2 that slices much finer -- zip code, income band, five-year age bracket, plus behavioral stuff like which of our other products someone has used. It backtests noticeably better, tighter calibration curves across the board, so on pure metrics it's an easy yes. Legal and the outside ethics consultant we bring in for these meetings are blocking it, and it's become a real fight.

  Here's the bit I'm stuck on: everyone keeps collapsing two different objections into one. Objection one is the familiar "this reconstructs race and neighborhood history through the back door" fair-lending worry, which I get fine. Objection two, which the consultant keeps trying to explain, is wierder: even if the finer slicing were completely clean of any protected-class proxy, there's apparently no principled reason that particular grouping is the "correct" one for pricing any given applicant -- you could equally well bucket the same guy by profession, or by his specific repayment history with us, or a dozen other reasonable partitions, and each hands back a different number for the same human being. We actually ran one test applicant through both versions: v1 priced him at roughly 4% probability of default, the new zip/income/behavior slicing put him at almost 8%, and when a teammate rebucketed him by profession and tenure instead he came out under 2%. Nobody on the data science side can answer "why this reference class and not another" with anything better than "it backtests well," and the consultant sent around a philosophy paper (something by a guy named Hájek, "The Reference Class Problem is Your Problem Too") that I read half of on the train and did not fully recover from.

  I have to send the council a short written recommendation before Thursday: basically whether v2 ships as-is, gets blocked, or ships with specific conditions, plus a timeframe, since launch is currently penciled in for three weeks out. Could you draft that memo for me? I need it to actually engage with objection two as its own real problem instead of folding it back into the bias conversation and calling it a day, and whatever it recommends, I want it to lay out the strongest version of the case for the option it's turning down, since half the room will read this looking for ammunition against whatever I land on. A short table of conditions at the end would be great if we go that route, but the reasoning that gets us there matters more than the formatting.
reasoning: |-
  Okay, let me unpack this user's situation. They're a backend/ML engineer at a lending startup who got roped into their "Responsible AI Council" - a fancy name for what sounds like a tense committee meeting. Their core problem is that their new underwriting model (v2) performs better technically but faces two distinct ethical objections, and everyone's conflating them. 

  First, the obvious one: potential proxy discrimination through zip codes/behavioral data. Standard fair-lending stuff. But the second objection is weirder - this philosophy-heavy "reference class problem" where different ways of slicing the same person give wildly different risk scores (4% vs 8% vs 2%!). The data science team can't justify their chosen buckets beyond "it backtests well," and now there's some philosopher named Hájek haunting their Slack channels.

  User needs to write a recommendation memo by Thursday deciding whether to: 
  - Ship v2 as-is 
  - Block it entirely 
  - Ship with conditions 
  ...and they specifically want to: 
  - Treat objection #2 as its own serious issue (not just fold it into bias concerns) 
  - Steel-man the opposing arguments since it's a political minefield 
  - Maybe include a conditions table if going the middle route 

  Hmm. The stakes are high - this affects loan pricing/approvals, and launch is in 3 weeks. User seems technically sharp but out of their depth on philosophy-of-probability stuff. They're clearly stressed about mediating between data science ("it backtests better!") and legal/ethics ("but why THESE buckets?"). 

  What's tricky here:
  - Objection #1 (proxy discrimination) has established regulatory frameworks (ECOA, Reg B) 
  - Objection #2 (reference class problem) is more existential - about the nature of risk assessment itself 
  - Yet both manifest in the same symptom: arbitrary rate differences for individuals 

  The memo needs to walk a tightrope: 
  Acknowledge v2's technical merits without letting DS off the hook for philosophical rigor 
  Take Hájek seriously without derailing the business 
  Propose actionable next steps that aren't just "read more philosophy papers" 

  Possible paths forward: 
  1. Block v2 entirely - safest legally but kills a legit model improvement 
  2. Ship as-is - reckless given the unresolved questions 
  3. Middle ground: ship v2 BUT with guardrails and commitments to address reference class transparency 

  Leaning toward #3 because: 
  - A blanket block feels like overkill when the core issue (how we define "similar" people) affects ALL models 
  - But shipping without addressing the arbitrariness is ethically dicey 

  Key guardrails needed: 
  - Mandatory documentation of why THESE reference classes were chosen 
  - Robust error bar disclosures at point of decision 
  - Hard limits on how much rates can swing between models 
  - Concrete plan to study reference class instability 

  Biggest challenge will be explaining reference class problems to non-philosophers without sounding alarmist. Need to frame it as "this is why we need humility in ML" not "your math is wrong." 

  ...time to draft.
answer: |-
  **MEMORANDUM**  
  To: Responsible AI Council  
  From: [Your Name], Backend/ML Engineer  
  Date: [Current Date]  
  Subject: Recommendation re: Underwriting Model v2 Launch  

  ### **Background**  
  Model v2 demonstrates superior technical performance (calibration, backtesting) over v1 by leveraging finer-grained features (zip code, income band, age brackets, behavioral data). However, two distinct ethical concerns have been raised:  
  1. **Proxy Discrimination Risk**: Potential reconstruction of protected attributes (e.g., race) via zip codes/historical data.  
  2. **Reference Class Problem (RCP)**: The fundamental arbitrariness in selecting *which* groupings (e.g., profession vs. zip code) define "similar" applicants for risk assessment.  

  This memo focuses on **Objection 2 (RCP)** as a standalone issue, distinct from bias concerns.  

  ---

  ### **Core Concern: The Reference Class Problem (RCP)**  
  RCP asserts that an individual’s predicted risk is contingent on the chosen reference class (e.g., grouping by zip code vs. profession). Different partitions yield materially different risk scores for the *same applicant* (e.g., 4% vs. 8% vs. 2% in our test). Crucially:  
  - **This is not a data quality issue**—it arises from the *philosophical ambiguity* of defining "similarity."  
  - **Technical performance alone cannot resolve it**. Better backtesting only confirms v2’s accuracy *within its chosen groupings*, not that those groupings are uniquely "correct."  
  - **Impact**: Arbitrary rate variance undermines fairness, transparency, and trust, irrespective of proxy bias.  

  ---

  ### **Assessment of Options**  
  | **Option**               | **Strongest Case For**                                                                 | **Strongest Case Against**                                                                 |  
  |---------------------------|----------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------|  
  | **Ship v2 as-is**         | Clear predictive gains; delays risk competitive disadvantage.                          | Ignores RCP’s ethical/legal risks: arbitrary pricing erodes consumer trust and invites regulatory scrutiny. |  
  | **Block v2 entirely**     | Avoids endorsing unprincipled bucketing; upholds precautionary ethics.                 | Sacrifices material risk-reduction and efficiency gains; fails to address RCP in *any* model. |  
  | **Ship with Conditions**  | Balances innovation with responsibility; allows v2’s benefits while mitigating RCP risks. | Adds short-term complexity; may delay launch. |  

  #### **Recommendation: Ship v2 with Conditions**  
  v2’s predictive gains warrant deployment, but RCP demands safeguards. Launch should proceed in **3 weeks** *only* if the following are implemented:  

  | **Condition**                         | **Timeline**     | **Owner**         |  
  |---------------------------------------|------------------|-------------------|  
  | 1. **Reference Class Justification**: Document why chosen features (zip/income/behavior) are the *most principled* basis for grouping (e.g., causal links to risk), beyond predictive power. | Pre-launch | Data Science Lead |  
  | 2. **Sensitivity Analysis**: Test how scores shift under alternative reference classes (e.g., profession/tenure) for 500 sampled applicants. Report variance magnitude. | Pre-launch | ML Team |  
  | 3. **Disclosure & Appeal**: Add to adverse action notices: *"Your rate may vary based on how we group similar applicants. Contact [X] to discuss alternatives."* | At launch | Legal/Compliance |  
  | 4. **Error Margins**: Display PD as a range (e.g., 6–9%) reflecting RCP-driven uncertainty in UIs/decisions. | Phase 1 (6 wks) | Eng/Product |  
  | 5. **RCP Research**: Commit to evaluating multi-reference-class frameworks (e.g., Bayesian model averaging) in v3. | Q3 Roadmap | Council |  

  ---

  ### **Why This Path?**  
  - **Addresses RCP directly**: Conditions 1–4 force engagement with arbitrariness; Condition 5 seeks long-term solutions.  
  - **Preserves v2’s upside**: Does not discard predictive gains.  
  - **Builds trust**: Transparency (Conditions 3–4) mitigates consumer harm.  
  - **Precedent-setting**: Establishes that "better metrics" alone don’t resolve ethical gaps.  

  ### **Counterarguments Addressed**  
  - **Data Science**: "Backtesting justifies our features."  
    *Rebuttal*: Backtesting validates groupings internally but doesn’t resolve *external* arbitrariness (Hájek’s core argument).  
  - **Legal**: "This complicates compliance."  
    *Rebuttal*: Proactive RCP management reduces future litigation risk from arbitrary outcomes.  
  - **Ethics**: "Shouldn’t we block v2 until RCP is solved?"  
    *Rebuttal*: RCP affects *all* risk models. Blocking v2 ignores that v1 also uses arbitrary (if coarser) buckets. Progress requires incremental mitigation.  

  ---

  **Next Steps**: I propose we conditionally approve v2, prioritize Conditions 1–3 for launch, and revisit timelines on 6/20. Will draft a 1-pager on RCP for customer-facing teams by EOW.  

  //[Your Name]
