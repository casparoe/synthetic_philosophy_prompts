answer: |-
  Your question touches on a fundamental aspect of intuitionistic logic and the philosophical underpinnings of constructivism. The apparent tension arises from a misunderstanding of how negation and double negation behave in intuitionistic logic compared to classical logic. I'll break this down step by step, addressing your core concerns: why intuitionists reject the law of excluded middle (LEM) for arbitrary propositions, why they cannot prove its negation for any specific proposition, and why the double negation rule doesn't resolve this in the way classical reasoning might suggest.

  ### 1. **Intuitionistic Rejection of LEM: The Constructivist Stance**
     - In intuitionistic logic (as used in Lean by default), truth is tied to provability or constructive evidence. To assert a proposition \(P\), one must provide a proof (or construction) of \(P\). Similarly, to assert \(P \lor Q\), one must have a proof of \(P\) or a proof of \(Q\).
     - The law of excluded middle (LEM), \(P \lor \neg P\) for an arbitrary \(P\), is rejected because it claims that either \(P\) is true or \(\neg P\) is true, without requiring a method to determine which one holds. For an open conjecture (e.g., the Riemann Hypothesis), we lack proofs for both \(P\) and \(\neg P\), so intuitionists do not assert \(P \lor \neg P\). This is not a denial that \(P \lor \neg P\) is "objectively true" in a classical sense; rather, it reflects that intuitionists only assert what can be constructively verified.
     - Crucially, intuitionists do not claim that LEM "fails" in the sense that \(\neg (P \lor \neg P)\) is true for some \(P\). Instead, they hold that LEM is not a valid principle for all propositions—it cannot be universally asserted due to the lack of constructive content.

  ### 2. **Why \(\neg (P \lor \neg P)\) is Always False in Intuitionistic Logic**
     - You are correct that \(\neg \neg (P \lor \neg P)\) is provable in intuitionistic logic for any \(P\), and this might seem paradoxical. Let's examine the proof to see why \(\neg (P \lor \neg P)\) is impossible to prove:
       - Assume \(\neg (P \lor \neg P)\). This means \(P \lor \neg P \to \bot\) (where \(\bot\) is absurdity).
       - Now, if we assume \(P\), then \(P \lor \neg P\) holds trivially (left disjunct). But from our assumption, \(P \lor \neg P \to \bot\), so we get \(\bot\). Thus, \(P \to \bot\), which is \(\neg P\).
       - Since we have \(\neg P\), then \(P \lor \neg P\) holds again (right disjunct). Applying the assumption once more, we get \(\bot\).
       - Therefore, the assumption \(\neg (P \lor \neg P)\) leads to \(\bot\), proving \(\neg \neg (P \lor \neg P)\).
       - This derivation shows that \(\neg (P \lor \neg P)\) implies a contradiction, so \(\neg (P \lor \neg P)\) is equivalent to \(\bot\) (false) for any \(P\). Thus, it is impossible to prove \(\neg (P \lor \neg P)\) for any \(P\), including open conjectures. Intuitionists do not "refute" LEM in specific cases; they simply cannot assert it universally.

  ### 3. **Why \(\neg \neg (P \lor \neg P)\) Does Not Imply \(P \lor \neg P\)**
     - The key issue is the behavior of double negation. In classical logic, double negation elimination (DNE) holds: \(\neg \neg Q \to Q\) for any \(Q\). This is why, classically, \(\neg \neg (P \lor \neg P)\) would imply \(P \lor \neg P\).
     - In intuitionistic logic, DNE is not a general rule. A proof of \(\neg \neg Q\) shows that \(Q\) cannot be refuted—it is consistent or "not false"—but it does not provide a constructive proof of \(Q\). For \(Q = P \lor \neg P\):
       - \(\neg \neg (P \lor \neg P)\) means "it is absurd to deny \(P \lor \neg P\)". This is proven by showing that assuming \(\neg (P \lor \neg P)\) leads to contradiction, as above.
       - However, this proof does not produce evidence for \(P\) or for \(\neg P\). It only demonstrates that \(P \lor \neg P\) cannot be falsified; it does not make \(P \lor \neg P\) true in the constructive sense.
     - For an open conjecture \(P\), we lack the constructive evidence to assert \(P \lor \neg P\), so intuitionists do not conclude it from \(\neg \neg (P \lor \neg P)\). This is why the "ordinary rule" of double negation breaks down: intuitionistic negation captures refutability, not truth.

  ### 4. **Consistency of the Intuitionistic Position**
     - Intuitionists can consistently decline to assert LEM while being unable to refute it because:
       - They do not claim that \(\neg (P \lor \neg P)\) is true for any \(P\). As shown, \(\neg (P \lor \neg P)\) is provably false (equivalent to \(\bot\)) in intuitionistic logic.
       - For specific undecidable propositions (e.g., open conjectures), they simply suspend judgment on \(P \lor \neg P\) due to lack of evidence. This is not a contradiction; it is a reflection of their epistemic constraints.
       - The provability of \(\neg \neg (P \lor \neg P)\) reinforces that LEM cannot be denied—but it does not force them to assert LEM, as they require direct constructive evidence.
     - Philosophically, this aligns with Brouwer's view that mathematics is about mental constructions. LEM is not "false"; it is unjustified as a blanket principle because it can assert disjunctions without constructions.

  ### 5. **Practical Implications in Lean**
     - In Lean, which uses intuitionistic logic by default, you can prove `¬¬(P ∨ ¬P)` for any `P`:
       ```lean
       theorem double_neg_lem (P : Prop) : ¬¬(P ∨ ¬P) :=
       λ h : ¬(P ∨ ¬P) =>
         have hnp : ¬P := λ hp : P => h (Or.inl hp)
         h (Or.inr hnp)
       ```
       But you cannot prove `P ∨ ¬P` without additional axioms (e.g., by enabling classical logic with `open Classical` or using `em : P ∨ ¬P`).
     - For open conjectures, Lean (in intuitionistic mode) will not allow you to case-split on `P ∨ ¬P` without evidence, as it would violate constructivity.

  ### Final Thoughts
  The intuitionistic stance is not that LEM is "false" for some propositions, but that it is not constructively valid for all. The double negation \(\neg \neg (P \lor \neg P)\) acts as a warning that LEM cannot be refuted, but it does not provide the missing constructions. This is why the two negations do not cancel out intuitionistically—unlike classical logic, where truth is bivalent and proof-independent. Your reading detour into constructivism is spot-on: the core issue is the demand for evidence in disjunctions. If you experiment further in Lean, try proving related theorems (e.g., \(\neg \neg \neg P \to \neg P\) is intuitionistically valid, while \(\neg \neg P \to P\) is not) to build intuition. This might feel odd at first, but it coheres with the idea that mathematics should be about verifiable results.
