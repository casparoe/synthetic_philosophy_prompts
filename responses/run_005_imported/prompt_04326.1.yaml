prompt: |-
  I spent my working life as an experimental physicist, on problems with no real connection to gravitation, and general relativity was always for me an elegant piece of differential geometry rather than something to interrogate metaphysically. Since retiring I have joined a small philosophy reading group, and we recently spent two sessions on "the hole argument": Einstein's own worry, dating from roughly 1913 to 1915, that if the points of the spacetime manifold are individuals with an identity independent of the metric field defined on them, then a generally covariant theory like his own is saddled with a strange indeterminism, since a diffeomorphism that is the identity outside some small region but differs inside it yields a distinct yet empirically indistinguishable solution to the field equations. I gather that Earman and Norton's 1987 paper "What Price Spacetime Substantivalism?", which revived the argument, is still treated as posing a serious difficulty for what is called "manifold substantivalism." Wondering whether Einstein's own way of dissolving the puzzle, the so-called "point-coincidence argument," had already filtered into the popular expositions of the day, I went back to my late father's copy of Eddington's Space, Time and Gravitation (1920). Sure enough, early in the chapter "Kinds of Space," he builds up to this:

  "The irrelevance of the mesh-system to the laws of nature is sometimes expressed in a slightly different way. There is one type of observation which, we can scarcely doubt, must be independent of any possible circumstances of the observer, namely a complete coincidence in space and time. The track of a particle through four-dimensional space-time is called its world-line. Now, the world-lines of two particles either intersect or they do not intersect; the standpoint of the observer is not involved. In so far as our knowledge of nature is a knowledge of intersections of world-lines, it is absolute knowledge independent of the observer. If we examine the nature of our observations, distinguishing what is actually seen from what is merely inferred, we find that, at least in all exact measurements, our knowledge is primarily built up of intersections of world-lines of two or more entities, that is to say their coincidences. […] It would be extremely clumsy to describe the results of the simplest physical experiment entirely in terms of coincidence. The absolute observation is, whether or not the coincidence exists, not when or where or under what circumstances the coincidence exists; unless we are to resort to relative knowledge, the place, time and other circumstances must in their turn be described by reference to other coincidences. But it seems clear that if we could draw all the world-lines so as to show all the intersections in their proper order, but otherwise arbitrary, this would contain a complete history of the world, and nothing within reach of observation would be omitted.

  "Let us draw such a picture, and imagine it embedded in a jelly. If we deform the jelly in any way, the intersections will still occur in the same order along each world-line and no additional intersections will be created. The deformed jelly will represent a history of the world, just as accurate as the one originally drawn; there can be no criterion for distinguishing which is the best representation."

  This looks to me like the same move Einstein made at almost exactly the same time, when he wrote that "nothing is physically real but the totality of space-time point coincidences." What I cannot settle for myself is how much philosophical weight the jelly picture can actually bear against the more carefully stated modern hole argument. Does it show that the manifold substantivalist's indeterminism is somehow spurious, an artefact of a distinction between differently labelled but coincidence-preserving jellies that carries no physical content? Or does it merely restate a verificationist scruple that a stubborn substantivalist could grant in full while still insisting that there is a fact of the matter about which point is which, so that determinism genuinely fails? And if coincidences alone are left to carry all the physical weight, I worry the passage proves too much as well as too little: does it not threaten to make even metrical facts that are not reducible to bare intersections, such as distances, elapsed proper times, and curvature, just as philosophically idle as the identities of the bare points themselves? I would be very grateful for help thinking through where Eddington's picture actually lands among these options.
reasoning: |-
  Okay, let me unpack this. The user is a retired experimental physicist diving into philosophy, specifically the hole argument in general relativity. They've encountered Eddington's "jelly" analogy in his 1920 book, which mirrors Einstein's point-coincidence argument. The core question is whether Eddington's analogy effectively counters manifold substantivalism's indeterminism problem or if it's just verificationist hand-waving.

  First, I need to recall the hole argument's structure. Earman and Norton revived it to challenge substantivalism: if spacetime points have independent identity, diffeomorphisms create physically indistinguishable yet mathematically distinct solutions, breaking determinism. Einstein's solution was to say only point coincidences (intersections) are real, making diffeomorphic models physically identical.

  The user’s specific concerns are:  
  1. Does Eddington's analogy genuinely resolve indeterminism or just restate verificationism?  
  2. Can a substantivalist accept verificationism but still claim indeterminism?  
  3. Does reducing physics to coincidences undermine metrical properties (distance, curvature)?  

  Hmm, the key tension here is ontological vs. epistemological. Eddington frames coincidences as the basis of "absolute knowledge," but is he saying they're the only reality (ontology) or just our empirical access (epistemology)? His jelly metaphor suggests deforming spacetime doesn’t change physics if coincidences are preserved—so differences in point identities are unphysical. That leans ontological: points lack independent reality.  

  But the substantivalist could counter: "Fine, we can’t *observe* point identities, but they still exist metaphysically." Then determinism fails because multiple futures (diffeomorphic variants) are possible for the same initial conditions. Eddington’s move only works if we reject the independent reality of points entirely.  

  On the metrical worry: if only coincidences matter, are intervals and curvature unreal? Not necessarily. Einstein’s theory *defines* these via the metric field, which is dynamical. Coincidences include metric-dependent events (e.g., clock readings), so metrical properties aren’t "bare"—they’re encoded in relationships *between* coincidences. For example, proper time along a world-line is measured by coincidences (e.g., atomic vibrations). Curvature affects how world-lines converge (e.g., geodesic deviation), observable via changed coincidence patterns. So metrics aren’t idle; they’re relational structures built from coincidences.  

  Still, there’s a gap. If two metrics produce identical coincidence patterns (e.g., conformally related metrics in lightcone structure), they’d be indistinguishable per Eddington. But in GR, solutions with different curvature *do* alter coincidences (e.g., tidal forces change particle paths). So his view likely assumes the full metric is needed to *predict* coincidences.  

  The user’s physics background matters here. They’ll appreciate that diffeomorphism invariance is built into GR’s formulation. The "indeterminism" is gauge—like electromagnetic vector potential ambiguities. The resolution is to treat physics as equivalence classes under diffeomorphisms. Eddington’s jelly is a vivid pre-gauge-theory expression of this.  

  Final take: Eddington’s analogy lands closest to relationalism. It dissolves indeterminism by denying point identities are real, making diffeomorphisms mere relabelings. But it doesn’t *force* this view; a stubborn substantivalist can still posit hidden facts. The metrical worry is mitigated because metrics structure coincidence possibilities—they’re not reducible to actual intersections but to *possible* ones (counterfactuals). However, this might stretch Eddington’s text. His "complete history" includes all *actual* intersections, but GR’s laws govern *possible* ones too.  

  Recommendations:  
  - Clarify that Einstein/Eddington’s move requires full relationalism to work.  
  - Note that modern philosophy often adopts "sophisticated substantivalism" (metrics define point identities).  
  - Suggest literature (e.g., Rovelli) on how GR implements relationalism via diffeomorphism invariance.
answer: |-
  Your thoughtful engagement with Eddington's "jelly" analogy and its relationship to Einstein's point-coincidence argument cuts to the heart of the hole argument's enduring philosophical tension. Let's break down the issues you've raised, addressing both the strengths and limitations of Eddington's picture in light of modern debates.

  ### 1. **Eddington's Analogy vs. the Hole Argument: Dissolving or Dodging Indeterminism?**
     - **The Core Move**: Eddington (like Einstein) argues that only **point coincidences** (intersections of worldlines) are physically real. The "jelly" deformation (a diffeomorphism) preserves the order and existence of these coincidences, rendering the deformed and original histories physically identical. This implies that the manifold points themselves lack independent physical identity.
     - **Against Substantivalist Indeterminism**:  
       - **Yes, it dissolves the indeterminism** *if* you accept the premise that spacetime points are not autonomous individuals. The "distinct solutions" generated by a hole diffeomorphism are merely different mathematical representations of the *same physical reality*, since all observable coincidences are identical. The indeterminism is thus "spurious," arising from a redundancy in the mathematical formalism (gauge freedom), not physics.  
       - **No, it doesn't compel a substantivalist to surrender** if they insist on the primitive identity of points. A "stubborn substantivalist" (like Earman-Norton's target) can grant verificationism ("we can only observe coincidences") while maintaining that there is a metaphysical fact about "which point is which" in the hole region. For them, determinism *does* fail because two genuinely distinct futures (differing in point identities) are consistent with the same initial data.  
     - **Philosophical Weight**: Eddington's picture is **ontologically revisionary**, not merely verificationist. It doesn't just say we *can't observe* point identities; it implies they *don't exist physically*. This reframes the debate: the hole argument isn't a problem for determinism but a *reductio* against manifold substantivalism. The "jelly" shows that the substantivalist's commitment to individuated points introduces a distinction without a physical difference.

  ### 2. **The Threat to Metrical Facts: Does the Analogy Prove Too Much?**
     Your concern is astute: if *only* coincidences are real, what happens to distances, proper times, and curvature? Eddington anticipates this implicitly:
     - **Coincidences Encode Metric Structure**:  
       - **Distances/Proper Times**: These are measured via coincidences. E.g., a clock's proper time is defined by its *coincidences* with a periodic process (e.g., atomic vibrations). Spatial distance might involve coincidences of light rays or rigid rods.  
       - **Curvature**: Tidal effects (geodesic deviation) manifest as *changes in the pattern of coincidences*. Two initially parallel worldlines (e.g., test particles) intersecting or diverging due to curvature is observable via their coincidence relations with other entities.  
     - **The Jelly's Invariance**: Crucially, a diffeomorphism *preserves* these metrical relationships because it distorts the metric tensor along with the manifold. The deformed jelly isn't just a reshuffling of points; it’s a *new metric field* on the deformed manifold. Since coincidences (and their metrical relationships) are unchanged, *all observable metrical facts are preserved*.  
     - **Limitation**: Eddington’s focus on "actual intersections" risks underplaying **modal facts** (what coincidences *could* occur). Curvature constrains *possible* worldline paths and thus *possible future coincidences*. However, this is consistent with his view: the "complete history" includes the *laws* governing worldlines (encoded in the metric), which fix all possible coincidences. The jelly deformation preserves these laws because it’s a symmetry of the theory.

  ### 3. **Where Eddington's Picture Lands: A Relationalist Resolution**
     Eddington (and Einstein) advocates for **relationalism about spacetime**:
     - **Manifold Points Lack Independent Reality**: They are merely "nodes" in a network of physical relations (coincidences and metric relations). The hole diffeomorphism is a redescription of the same relational structure.  
     - **Determinism is Saved**: Physics determines the *pattern* of coincidences and their evolution, not the labels of points. The hole argument’s "indeterminism" vanishes.  
     - **Metrics are Relational, Not Idle**: The metric field isn’t reducible to "bare" coincidences but defines the *structure* governing how coincidences unfold. Crucially, this structure is itself relational: it’s defined by how it constrains worldlines and their intersections.  

  ### Key Philosophical Tensions in Your Query
  | **Position** | **View on Point Identity** | **Determinism in Hole Argument** | **Status of Metrics** |
  |--------------|----------------------------|----------------------------------|------------------------|
  | **Manifold Substantivalism** | Points have primitive identity | Indeterminism (multiple futures) | Real but problematic |
  | **Eddington/Einstein Relationalism** | Points derive identity from relations | Determinism (gauge redundancy) | Real, encoded in coincidence structure |
  | **"Stubborn Substantivalist"** | Points have identity (unobservable) | Indeterminism (metaphysical) | Real but separable |

  ### Conclusion: Eddington’s Legacy and Open Questions
  Eddington’s jelly analogy **successfully dissolves the hole argument’s indeterminism** by rejecting the substantivalist premise. It shows that the "distinct solutions" are physically equivalent—a gauge redundancy. However:
  - **It Doesn’t *Force* Relationalism**: A substantivalist can retreat to a position where point identities are metaphysically real but epistemically inaccessible. This preserves indeterminism at the cost of positing unobservable facts.  
  - **Metrics Survive**: Contrary to your worry, metrical properties aren’t idle; they’re *constituted* by how they govern coincidences. GR’s dynamics ensure that curvature and intervals manifest in observable relations.  
  - **Modern Echoes**: Contemporary "sophisticated substantivalism" (e.g., Maudlin, Hoefer) often adopts a similar view: physical reality resides in the *metric field*, not bare points. Points gain identity through the metric ("metric essentialism"), aligning with Eddington’s insight that coincidences (via the metric) define spacetime’s physical content.  

  **Recommendation for Further Thought**:  
  - Read Rovelli’s *Quantum Gravity* (Ch. 2) or Dieks’ *The Ontology of Spacetime* for modern relationalist perspectives.  
  - Consider whether "modal coincidences" (possible measurements) address your worry about metrical facts—Einstein’s point was that even curvature is revealed through *actual or potential* coincidences (e.g., geodesic deviation experiments).  

  Eddington’s picture lands firmly in **relationalism**, offering a compelling (though not uncontested) dissolution of the hole argument. Its power lies in reframing spacetime as a dynamic web of events, where the jelly’s deformations are mere reweavings of the same physical tapestry.
