answer: |-
  ## Memorandum: Recommendation for Petition 2024-LING-MED  
  **To:** Academic Standards Committee  
  **From:** Prof. [Your Name], Department of [Your Department]  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Re: 7-Year Rule & Approved Medical Leave  

  ### I. Core Issue
  Whether the approved one-year medical leave, during which the student received written assurance from the Dean’s Office that her "progress clock is paused," tolls the 7-year doctoral completion rule despite the handbook explicitly listing only military service and parental leave as exclusions.

  ### II. Recommendation: **Grant Extension Conditionally**
  **Action:** Grant the student a 12-month extension *based solely on the Dean’s written assurance of clock-pausing*. Concurrently, **propose an immediate handbook amendment** formally adding "approved medical leave" to the enumerated exceptions (§4.2c) to govern future petitions.  

  ### III. Argument: Upholding Institutional Integrity While Avoiding Arbitrary Expansion  
  The "expressio unius" reading—that the silence on medical leave is deliberate—deserves serious weight. Its core strength lies in **protecting institutional predictability and preventing ad hoc erosion of bright-line rules**. Enumerated lists exist to constrain discretion; expanding them based on perceived purpose invites inconsistency and undermines the handbook’s role as a stable covenant. If we imply exceptions beyond the text, we functionally transfer rule-making authority from the Faculty Senate (which ratified the handbook) to this committee, inviting merit-based appeals that destabilize standards. Two pending petitions citing this case confirm this risk.  

  **However, rejecting this petition outright ignores a critical distinction:**  
  The student did not merely *assume* medical leave paused the clock—she **received explicit, authorized written confirmation from the Dean’s Office** that her "progress clock is paused for the duration." This is not a case of interpreting silence; it is a case of **reconciling conflicting authoritative communications** (handbook vs. Dean’s Office). Denying the extension here would:  
  1. **Violate Reliance Interests:** The student acted in reasonable reliance on official university representation.  
  2. **Undermine Administrative Authority:** It renders the Dean’s Office powerless to grant accommodations absent handbook pre-authorization, creating operational paralysis.  
  3. **Create Unfairness Within the Rule:** Students who secured identical written assurances pre-2024 would face inconsistent outcomes based solely on committee timing.  

  ### IV. Why This Recommendation?  
  1. **Honors Reliance Without Rewriting the Handbook:**  
     Granting the extension based *only* on the Dean’s representation respects the student’s reliance without converting the medical leave itself into an implied exception. The precedent set is narrow: **"Official written assurances of clock-pausing from authorized administrators will be honored, even if the underlying leave type is unenumerated."** This does not invite future petitioners to argue medical leave *should* toll the clock—only that they relied on a specific promise.  

  2. **Closes the Gap Prospectively:**  
     Proposing an immediate handbook amendment adding "approved medical leave" (§4.2c) resolves the textual omission *going forward*. This respects "expressio unius" by formalizing the exception through proper governance channels, not committee fiat. Future cases will rely on the amended text, not committee discretion.  

  3. **Mitigates Precedent Risk:**  
     The conditional grant is explicitly tied to the unique fact of **written administrative assurance**. Pending petitions citing this case must demonstrate comparable reliance on specific university representations—not merely the existence of medical leave. This maintains the bright-line rule while addressing the equity concern in this instance.  

  ### V. Counterarguments Addressed  
  * **"This Rewrites the Handbook":**  
    No—it enforces an official act of university administration. The Dean’s Office acted within its apparent authority; invalidating its promise retroactively harms institutional credibility more than a limited extension harms the rule.  

  * **"Encourages End-Runs Around the Text":**  
    The amendment proposal prevents this. Future students must rely on the *amended text*, not committee appeals. Current petitioners without written assurances gain no leverage.  

  * **"Why Not Deny and Urge Amendment?"**:  
    Punishing the student for administrative inconsistency is inequitable and undermines trust in university communications. Granting relief here while fixing the rule restores integrity faster.  

  ### VI. Proposed Motion  
  1. **GRANT** a 12-month extension to the student based on reasonable reliance on the Dean’s Office’s written assurance that her progress clock was paused.  
  2. **REFER** to the Faculty Senate Handbook Committee a proposed amendment to §4.2c adding "approved medical leave" to the list of exclusions, effective next academic term.  
  3. **DIRECT** the Registrar to audit all active doctoral students with approved medical leaves to confirm whether similar written assurances were provided and address cases proactively.  

  ---  
  **This approach respects the rule’s textual boundaries while acknowledging that institutions must stand by their own authoritative acts. It fixes the gap without making this committee a legislature.** Let’s uphold both fairness and the handbook—by granting this petition as an act of reliance, not exception, and closing the loophole for good.
