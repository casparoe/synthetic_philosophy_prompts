  I need to break down why Carrasco's findings don't straightforwardly refute Pylyshyn. First, Pylyshyn distinguished between attention and cognition. He argued attention is part of the perceptual system, not cognitive penetration. Attention operates within early vision, so it's not top-down cognition affecting perception. Carrasco's study used covert attention, which might be seen as a pre-perceptual process, not cognitive influence.

