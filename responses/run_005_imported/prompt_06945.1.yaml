  ## Memo: Tenure Recommendation for Dr. Reyes  
  **To:** Department Tenure and Promotion Committee  
  **From:** [Your Name], Committee Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation Regarding Dr. Reyes' Tenure Case  

  ### I. The Core Dilemma  
  Dr. Reyes’ file presents a profound challenge: evaluating scholarship that fundamentally questions the epistemological foundations favored by some referees. The external reviews reveal a methodological schism within IR:  
  - **Rational-choice/realist referees** critique the work as "unfalsifiable" and lacking "cumulation," arguing it fails to meet standards of generalizability and testability.  
  - **Constructivist referees** contend this critique imposes alien standards, misjudging research focused on meaning-construction through discourse and practice.  

  Our bylaws require "evidence of a significant scholarly contribution," but offer no guidance when the *definition* of contribution is contested. The Kuhn debate among committee members highlights this tension but does not resolve it.  

  ---

  ### II. Engaging the Kuhn Exchange: Merits and Limits  
  1. **Incommensurability vs. Pre-Paradigm State**:  
     - **Kuhnian Incommensurability**: If IR were in a "paradigm crisis," judging constructivism by rational-choice standards would indeed be flawed (as Committee Member A notes).  
     - **Pre-Paradigm Reality**: As Committee Member B correctly observes, social sciences rarely achieve a single paradigm. IR is characterized by **coexisting schools** (realism, liberalism, constructivism, etc.), not a monolithic paradigm in crisis. *Thus, framing this as "paradigm clash" overstates Kuhn’s applicability*.  

  2. **Trans-Paradigm Criteria**:  
     Kuhn explicitly identified standards *transcending* paradigms: **accuracy, consistency, scope, simplicity, and fruitfulness** (*The Structure of Scientific Revolutions*, 1962/1970). These are not paradigm-specific but require interpretation within research traditions.  

  3. **The Referees’ Concerns Are Not Dismissible**:  
     The rational-choice referees’ critique that some scholarship risks becoming "self-insulating" or "thin" is valid *even within constructivism*. All traditions must demonstrate rigor through:  
     - **Empirical grounding** (even if not "falsifiable" in Popperian terms),  
     - **Analytical coherence**,  
     - **Engagement with counter-evidence or alternative interpretations**.  
     Dismissing their concerns as "paradigm-bound" ignores that *all* scholarship must meet defensible standards of intellectual weight.  

  ---

  ### III. Resolving the Impasse: A Path Forward  
  We cannot resolve epistemology by committee vote. Instead, we must evaluate whether Dr. Reyes’ work meets **trans-paradigm criteria of scholarly contribution** within her tradition *and* the broader discipline.  

  #### Key Findings:  
  1. **Fruitfulness & Scope**:  
     - Her book *[Title]* has sparked debates in journals like *International Organization* and *Review of International Studies*, cited by scholars across methodological traditions.  
     - She has been invited to keynote workshops at [Prominent University 1] and [Prominent University 2], indicating cross-tradition recognition.  

  2. **Empirical Rigor**:  
     - Her discourse analysis of security policymaking uses primary documents, interviews, and archival materials. While not "testable" via variables, it demonstrates **systematic evidence triangulation**.  

  3. **Critique Engagement**:  
     - She addresses counterarguments (e.g., in *[Article Title]*, *Journal X*, 20XX), rebutting claims that her approach ignores material constraints.  

  #### Remaining Gaps:  
  - The file lacks **sufficient input from referees who engage constructivism critically but fairly** (e.g., qualitative methodologists, critical realists, or interdisciplinary scholars).  
  - The "unfalsifiability" critique warrants scrutiny: Does her work offer **clearly defined mechanisms for assessing interpretive validity**?  

  ---

  ### IV. Recommendation: Delay Vote, Commission Targeted External Reviews  
  **Move to postpone the vote for 60 days to secure 2–3 additional external assessments.**  

  #### Rationale:  
  1. **Address Epistemic Bias**:  
     - Seek referees with **demonstrated engagement across IR traditions** (e.g., scholars publishing in *International Theory* or *EJIR* who cite both rationalist and critical work).  
     - Prioritize those who can evaluate whether Dr. Reyes’ methods meet **rigorous standards within interpretive social science** (e.g., Tracy’s "Big Tent" criteria for qualitative research).  

  2. **Evaluate Trans-Paradigm Criteria**:  
     Charge new referees to assess:  
     - **Fruitfulness**: Has her work opened new lines of inquiry?  
     - **Scope**: Does it offer insights beyond a single case?  
     - **Analytical Rigor**: Are her claims supported by systematic evidence?  
     - **Engagement**: Does she grapple with plausible counterarguments?  

  3. **Prevent Premature Closure**:  
     Denying tenure based solely on methodological incommensurability risks penalizing innovation. Granting tenure without addressing rigor concerns undermines standards. **Targeted review closes this gap.**  

  ---

  ### V. Conclusion  
  Dr. Reyes’ scholarship challenges conventional IR methodologies, but this does not exempt it from rigorous evaluation. Kuhn reminds us that competing schools coexist in social science, yet shared standards of depth, impact, and coherence apply. By commissioning reviews from scholars capable of bridging epistemological divides, we honor both the legitimacy of diverse approaches and the obligation to uphold scholarly rigor. This is not indecision—it is due diligence.  

  **Recommended Motion:**  
  *Delay the tenure vote for 60 days to solicit 2–3 additional external letters from scholars with cross-paradigm expertise, charged with evaluating Dr. Reyes’ contribution against trans-paradigm criteria of fruitfulness, scope, and analytical rigor.*  

