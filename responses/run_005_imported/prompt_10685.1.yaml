prompt: |-
  I've spent most of the past decade doing research in social psychology, where a result's scientific legitimacy is, in practice, settled by whether it survives peer review at a reputable journal. A senior colleague recently argued that this is not merely our field's best available proxy for a finding being methodologically sound, but constitutive of it: a result simply is sound once qualified reviewers accept it, and doubting this, on her view, is rather like asking whether a bachelor could secretly be married. The question isn't purely academic for me, since I'm deciding whether to spend the next year of my postdoc trying to replicate a result that, on her view, is already beyond doubt simply because it cleared review. I resist her position, partly because it seems to render our field's periodic replication scandals conceptually impossible rather than merely common and embarrassing, yet I can't identify any reviewer-independent standard of soundness that reviewers are supposedly trying, and sometimes failing, to track. I notice I'm confused: is she right that I'm reaching for a distinction without a difference, or is there a real crux here that her view dissolves too quickly?
reasoning: |-
  Okay, let me unpack this user's dilemma. They're a social psychology researcher grappling with a fundamental question about scientific legitimacy. Their senior colleague claims peer review isn't just a proxy for soundness but defines it outright - like a bachelor being unmarried by definition. But the user's gut rebels because this makes replication crises logically impossible. 

  Hmm, the tension here is philosophical but has concrete career implications. They're considering spending a precious postdoc year replicating a study that, under their colleague's view, is already "beyond doubt." That's high-stakes. Their frustration comes through - they can't articulate an alternative standard yet feel peer review can't be the whole story. 

  First, I need to validate both perspectives. The colleague isn't entirely wrong - peer review does function as a social certification in science. But reducing "soundness" to acceptance commits what philosophers call a category error. It's like saying "money is valuable because the government says so" while ignoring its actual purchasing power. 

  The key is distinguishing between institutional validation and methodological robustness. Peer review operates at the procedural level (was this done correctly according to current norms?), while replicability lives at the empirical level (does this hold up in reality?). That's why replication scandals happen - the two can diverge when norms are flawed or incentives misaligned. 

  I recall how in 2010s psychology, questionable research practices became normalized. Reviewers approved studies using p-hacking because it wasn't technically "wrong" yet. The system was tracking its own standards, not truth. That's why the user's instinct is right - soundness must include durability beyond the review room. 

  For their decision: replicating that study isn't pointless even if published. If it fails, it exposes limitations in current review standards. If it holds, it strengthens the finding beyond mere institutional approval. Their year wouldn't be wasted - it'd advance the very epistemology their colleague oversimplifies. 

  The real crux is whether science is a closed social system or an open-ended truth-seeking process. Their colleague's view risks making it the former. The user's unease reflects a healthy commitment to the latter.
answer: |-
  Your colleague is conflating **epistemic procedure** with **methodological truth**, and your resistance is philosophically and scientifically justified. Her position dissolves crucial distinctions at the heart of scientific practice. Let's dissect why:

  ### The Core Problem: Institutional Endorsement ≠ Truth-Constitution
  Her argument commits a **category error** by treating peer review as *ontologically constitutive* rather than *procedurally functional*. Peer review is a **social-institutional filter**, not a **truth-maker**. To claim that "soundness = passing peer review" is analogous to saying:
  - *"A law is just because it passed the legislature"* (ignoring unjust laws)
  - *"A defendant is guilty because a jury convicted them"* (ignoring wrongful convictions)

  ### Why Replication Scandals Reveal the Flaw
  Your intuition is correct: **if peer review *constituted* soundness, replication failures would be logically impossible**. Yet they occur because:
  1. **Reviewers operate under constraints**: Limited time, incomplete information, and cognitive biases.
  2. **Systemic incentives**: Journals prefer novel/positive results; reviewers may overlook methodological flaws in "sexy" findings.
  3. **Evolving standards**: Best practices in methods (e.g., preregistration, power analysis) often outpace reviewer norms.

  *Example*: In the replication crisis, studies with p-hacked data, underpowered designs, or undisclosed flexibility cleared peer review precisely because *the system failed to track robustness*, not because robustness was irrelevant.

  ---

  ### What Peer Review Actually Provides (and Doesn't)
  | **What Peer Review Does** | **What It *Cannot* Do** |
  |---------------------------|-------------------------|
  | Certifies adherence to **current disciplinary norms** | Guarantee **methodological robustness** |
  | Filters out **grossly incompetent work** | Detect **subtle p-hacking** or **hidden flexibility** |
  | Provides **social legitimacy** | Ensure **replicability** |
  | Reflects **consensus standards** at time T | Predict **future reliability** |

  ---

  ### The Reviewer-Independent Standard You're Seeking
  It exists: **empirical replicability and theoretical coherence within a self-correcting system**. Peer review *aims* to track:
  - **Methodological rigor**: Appropriate design, controls, statistical power, transparency.
  - **Epistemic durability**: Likelihood the finding withstands independent testing.

  **But it often fails** because:
  - Reviewers aren't omniscient
  - Norms evolve (e.g., recognizing publication bias)
  - Incentives misalign (careerism > truth)

  ---

  ### Implications for Your Postdoc Decision
  1. **Her view is dangerous**: If peer review *defines* soundness, replication efforts are irrational. This stifles science’s self-correction mechanism.  
  2. **Replication is epistemically vital**: A published study is a **hypothesis awaiting stress-testing**, not a settled fact.  
  3. **Strategic considerations**:  
     - If the finding is foundational to your field, replication has high value regardless of its journal pedigree.  
     - If resources are scarce, prioritize replicating studies with:  
       ✓ High theoretical importance  
       ✓ Methodological ambiguities in the original paper  
       ✓ Contradictory unpublished evidence  

  ---

  ### Philosophical Grounding: Fallibilism vs. Institutional Infallibility
  Science progresses through **conjecture and refutation** (Popper), not institutional decree. Your colleague’s view resembles **scientism** (mistaking scientific institutions for science itself). Soundness resides in:
  - **Intersubjective verifiability** (replication)  
  - **Resilience to falsification attempts**  
  - **Integration with established knowledge**  

  Peer review is a *heuristic* for these—not their essence.

  ### Conclusion
  You’re not confused; you’re recognizing a **false equivalence**. Peer review is necessary but insufficient for soundness. Spend your postdoc replicating if:  
  - The finding is pivotal yet methodologically suspect  
  - Your approach improves on original methods (larger N, preregistration)  
  - Failure would meaningfully advance understanding  

  **Science isn’t a bachelor—it’s a marriage that requires constant renewal.** Your colleague’s view confuses the wedding certificate (peer review) with the marriage’s health (robustness). Rejecting this isn’t pedantry—it’s fidelity to science’s core purpose.
