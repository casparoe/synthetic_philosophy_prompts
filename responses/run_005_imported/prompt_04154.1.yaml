  For my verdict: Douglass was absolutely doing advocacy, but calling it "just" motivated reasoning undersells it. His genius was showing how the Constitution's text could be weaponized against slavery despite its framers' compromises. It's defensible as a reading if we accept that constitutions can mean more than their creators intended.

