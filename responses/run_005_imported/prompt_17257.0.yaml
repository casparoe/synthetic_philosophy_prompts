  - Frame it as protecting the council's credibility 

  Crucially, the tone must stay collaborative—no alienating either faction. Phrases like "what's right about their view" and "shared commitment" will help. The recommendations should force engagement by citing the tool's own limitations (e.g., vendor warnings about scores) and real-world consequences (wrongful penalties). 

