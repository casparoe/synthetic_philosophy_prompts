answer: |-
  You've hit on one of the most philosophically profound and contested moves in *A Theory of Justice*. Rawls's rejection of expected utility maximization (averaging outcomes) in favor of the maximin rule (maximizing the minimum position) is central to his argument for the Difference Principle and his critique of utilitarianism. Let's break down his actual reasoning, avoiding hand-waving:

  **Rawls's Core Argument for Maximin (Not Mere Risk-Aversion):**

  Rawls argues that maximin is the *only rational choice rule* for parties in the Original Position (OP) under the specific, highly constrained conditions he constructs. He doesn't just *assume* people are risk-averse; he argues that the *structure of the OP itself* makes maximin the uniquely rational strategy. He outlines three conditions that, when jointly satisfied, make maximin compelling:

  1.  **Ignorance of Probabilities (The "No Knowledge" Condition):**
      *   **The Crux:** Parties behind the veil have *no basis whatsoever* for assigning probabilities to ending up in any particular social position. They don't know the distribution of talents, resources, social classes, or historical contingencies in the society they're designing. Is being born into the bottom 10% a 10% chance? A 1% chance? A 50% chance? They have *zero information* to make this assessment.
      *   **Why it Matters for Expected Utility:** Expected utility calculations *require* probabilities. You *cannot* calculate an average outcome if you have no idea how likely each outcome is. Trying to assign equal probabilities (e.g., "I have an equal chance of being anyone") is an *arbitrary assumption* lacking any rational foundation within the OP. Rawls argues it's irrational to gamble based on probabilities you simply cannot know or estimate. The OP forces you to acknowledge this radical uncertainty.
      *   **Analogy:** Imagine choosing between investment portfolios A and B. Portfolio A guarantees you $50,000. Portfolio B *might* give you $1,000,000 or $0, but you have absolutely no clue what the odds are – it could be 99% chance of $0 or 99% chance of $1,000,000. Expected utility is impossible to calculate. Choosing the guaranteed $50,000 (maximin) becomes rational precisely because you lack the data needed for the gamble.

  2.  **The High Stakes / "Grave Risks" Condition:**
      *   **The Crux:** The choice in the OP concerns the fundamental structure of your *entire life prospects* – your basic liberties, opportunities, self-respect, and economic well-being. Ending up in the worst-off position isn't merely inconvenient; it could mean a life of crushing poverty, lack of basic freedoms, exploitation, or severely limited opportunities – conditions Rawls sees as potentially intolerable or undermining the very basis of a worthwhile life.
      *   **Why it Matters:** When the potential downside is catastrophic and irreversible (you only get one life!), and the potential upside (being very well-off) offers only marginal *additional* benefits compared to a decent minimum, it becomes rational to prioritize *avoiding the worst outcome* over maximizing the *average* outcome. Protecting yourself from utter ruin outweighs the gamble for potentially greater riches you might not even need as much.
      *   **Analogy:** Choosing a society isn't like betting $10 on red/black at the casino. It's like choosing a parachute for a jump where failure means death. You wouldn't choose a parachute with a "high average performance" if you knew one type had a small but unknown chance of catastrophic failure, while another guaranteed a safe (if perhaps slightly bumpier) landing. You'd choose the one guaranteeing safety (maximin).

  3.  **The "Acceptable Minimum" / Non-Catastrophic Alternatives Condition:**
      *   **The Crux:** Maximin only makes sense if the option securing the worst-off position still offers a *decent* or *acceptable* minimum standard of living. If *all* alternatives involve intolerable outcomes for the worst-off, then avoiding the worst becomes less meaningful. Rawls believes the principles chosen under maximin (especially the Lexical Priority of Liberty and the Difference Principle) *will* guarantee a sufficiently high minimum (basic liberties, fair equality of opportunity, and the maximized minimum share of primary goods).
      *   **Why it Matters:** This condition ensures that choosing maximin isn't just avoiding disaster but leads to a genuinely just and livable society for all. If the guaranteed minimum were still horrific, the parties might be tempted to gamble for something better. But Rawls argues the principles derived *do* provide a sufficiently high floor, making the maximin choice stable and rational. You aren't sacrificing *too much* potential gain at the top to secure the bottom.

  **How These Conditions Interact in the OP:**

  *   **Radical Uncertainty + Catastrophic Downside + Acceptable Floor = Rational Maximin Choice.**
  *   Because you have **no basis for probability assignments** (Condition 1), you **cannot rationally calculate expected utility**. You are forced to consider the *possible* outcomes directly.
  *   Because the potential downside is **catastrophic** (life-ruining) (Condition 2), and the upside offers only marginal *additional* value beyond a decent minimum, focusing on **securing the worst possible outcome** becomes paramount.
  *   Because the principles chosen under maximin **guarantee an acceptable minimum** (Condition 3), you are not forced to gamble; you have a rationally preferable alternative that protects you from disaster.

  **Why Expected Utility Fails in the OP (Rawls's Critique):**

  1.  **The "Equiprobability" Assumption is Arbitrary:** Assuming you have an equal chance of being anyone is unjustified. There is no factual basis within the OP for this assumption. It smuggles in a controversial (and potentially unjust) probabilistic model.
  2.  **It Ignores the Separateness of Persons:** Utilitarianism (often arrived at via expected utility in the OP) treats society as a single entity maximizing aggregate welfare, potentially sacrificing fundamental interests of individuals or groups. Maximin, by focusing on the worst-off *individual's* position, respects the distinctness of persons.
  3.  **It Underestimates the Moral Significance of the Worst-Off:** Expected utility averages gains and losses. A large gain for the well-off can easily outweigh a devastating loss for the worst-off in the calculation. Rawls argues justice requires giving *absolute priority* to improving the lot of the least advantaged until no further improvement is possible without harming them (the Difference Principle), something averaging cannot deliver.
  4.  **It Gambles with Fundamental Interests:** Using expected utility means parties might accept principles that risk condemning *some* individuals (who they might turn out to be) to intolerable lives for the sake of a higher average. Rawls argues it's irrational and unjust to gamble with the basic structure of society in this way when an alternative (maximin) secures a decent life for all.

  **The Controversy & Critiques (as you noted):**

  *   **Harsanyi's Utilitarian Challenge:** Economist John Harsanyi famously argued that rational actors *would* use expected utility behind a veil of ignorance. He claimed assuming equal probability was the only rational stance under complete uncertainty ("principle of insufficient reason"). For Harsanyi, this leads directly to average utilitarianism.
  *   **Is the Veil *Too* Thick?** Critics argue Rawls's veil is unrealistically thick. While we don't know *everything*, we might have *some* probabilistic knowledge (e.g., historical trends about social mobility, distribution of talents) that could inform a less pessimistic calculation.
  *   **Is Maximin *Too* Conservative?** Does it stifle innovation and growth by prioritizing the worst-off above all else, even when risks might lead to much greater overall (and perhaps even worst-off) prosperity in the long run? Is it rational to forgo potentially massive gains for a modest guaranteed minimum?
  *   **Empirical vs. Normative:** Rawls is making a normative argument about *rational choice under justice-constraining conditions*, not describing how actual risk-averse people behave. Critics sometimes conflate the two.
  *   **The "Acceptable Minimum" Loophole:** If the guaranteed minimum under maximin were *not* actually acceptable, the argument weakens. Critics argue some interpretations of the Difference Principle might not guarantee a truly decent life.

  **In Essence:**

  Rawls doesn't rely on a vague notion of risk-aversion. He meticulously constructs the Original Position – particularly the *thickness* of the veil of ignorance (destroying all probabilistic knowledge) and the *nature* of the stakes (fundamental life prospects) – to create a scenario where the three conditions for rational maximin choice are uniquely satisfied. He argues that *because* of this radical uncertainty combined with the catastrophic potential of the worst outcome and the availability of an acceptable alternative, rational parties *must* choose as if they *could* end up as the worst-off and design society to make that position as good as possible. This is the engine that drives the entire argument towards the Lexical Priorities and the Difference Principle, setting his theory apart from utilitarianism. The controversy stems from whether this construction is valid and whether maximin is truly the only or most rational response to it.
