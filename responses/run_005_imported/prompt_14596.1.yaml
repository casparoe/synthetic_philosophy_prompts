prompt: |-
  A disagreement broke out at a meetup connected to a rationalist blog community I've followed for years, after someone brought up Philip Anderson's 1972 essay "More Is Different." (1) Lena took the hard reductionist line: every regularity we find in solids, ecosystems, or minds is, in principle, fully derivable from the underlying physics, and our inability to actually carry out that derivation is a fact about our limited computing power, not evidence that the world contains any additional, higher-level laws. (2) Marcus said this misses Anderson's actual point, which was never about computability: new properties -- like the rigidity of solids or superconductivity -- appear at each level of complexity because of spontaneously broken symmetry, and which symmetry breaks isn't fixed by the lower-level laws alone, so the higher-level regularity isn't just latent in the microphysics, waiting to be read off with enough computing power. (3) Lena replied that broken symmetry is still just physics happening at scale: given a complete specification of initial conditions and dynamics, the "selected" outcome would drop out too, so nothing has been added to the ontology, only something that happens to be practically hard to track. (4) Marcus countered that this move -- appealing to what an unbounded intelligence could derive from complete information -- is exactly what reductionists always reach for once a real explanatory gap opens up, which makes the thesis unfalsifiable, since no finite explanation is ever actually required to make good on it. Neither of them budged, and I've gone back and forth on it since. Could you adjudicate their four moves one at a time? Give your verdict as a JSON block of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, where each score is an integer from -2 (clearly mistaken) to 2 (clearly right), then briefly justify each score and say what, if anything, both of them are missing.
