  **Justification for Each Score:**

  1.  **Lena (-1: Mostly mistaken):** Anderson's core argument isn't primarily about computational *intractability* but about ontological *emergence*. While hard reductionism claims everything is *in principle* derivable, Anderson argues that higher-level phenomena (like rigidity or superconductivity) arise from *spontaneously broken symmetry*. This breaking introduces **contingency** – the specific broken state isn't determined solely by the fundamental laws, but depends on history, environment, or chance events within the constraints of the lower laws. While the *mechanism* of breaking is physical, the *outcome* (which symmetry is broken) and the resulting novel properties are not "latent" in the microphysics in a straightforwardly derivable way; they represent a new organizational state. Lena misses this key ontological point.

  2.  **Marcus (2: Clearly right):** Marcus accurately captures Anderson's central thesis. "More Is Different" argues that complexity layers introduce genuinely new phenomena via broken symmetry, requiring new concepts, laws, and explanations that are not reducible (even in principle, without adding crucial information about the *broken state*) to the vocabulary or laws of the more fundamental level. The novelty isn't just epistemic (about our understanding), but ontological (about what exists and behaves how). Marcus correctly identifies that the selection of *which* symmetry breaks isn't fixed by the lower-level laws alone.

  3.  **Lena (-2: Clearly mistaken):** This move exemplifies the core weakness of "in principle" reductionism. Claiming that "given a *complete specification of initial conditions and dynamics*, the outcome would drop out" is:
      *   **Trivially True but Vacuous:** If you magically *already possess* a complete specification of the exact microstate (positions, momenta of every particle) *at the higher level of organization* (e.g., the crystal lattice already formed), then obviously the macro-behavior follows. But this specification *already encodes the broken symmetry state*. The reductionist claim becomes circular: to derive the higher level, you must *start* with information *about* the higher level state.
      *   **Ignores Contingency:** Obtaining that "complete specification" requires knowing *which* symmetry broke, which isn't dictated by the fundamental laws. The fundamental laws allow *multiple* possible broken states (e.g., magnetization direction). Knowing the microstate *is* knowing the outcome; it doesn't *explain why that outcome occurred* from just the fundamental laws + generic initial conditions (like temperature/pressure). The "complete specification" smuggles in the emergent property.
      *   **Misrepresents Broken Symmetry:** The broken state isn't just "physics happening at scale" in a linearly traceable way; it's a collective reorganization creating novel causal powers (rigidity allowing sound waves, superconductivity allowing persistent currents) absent in the constituents.

  4.  **Marcus (2: Clearly right):** Marcus perfectly diagnoses the fundamental flaw in Lena's (and hard reductionism's) retreat to the "infinite intelligence/computing power" argument. It renders reductionism **unfalsifiable** and **explanatorily empty**:
      *   **Unfalsifiable:** No actual explanation or derivation is ever provided or required. Any apparent explanatory gap is dismissed by appealing to an impossible, unknowable computation.
      *   **Explanatorily Empty:** It offers no insight *how* the higher-level properties arise or *why* specific symmetries break in specific ways under specific conditions. It abandons the goal of scientific explanation (providing understanding) for a metaphysical assertion. Marcus correctly identifies this move as a defensive retreat when faced with genuine emergence.

  **What Both Are Missing:**

  *   **Lena:** Misses the **contingency and path-dependence** inherent in symmetry breaking and the creation of genuinely **novel causal powers/properties** at higher levels (e.g., rigidity causing sound transmission). She conflates "governed by physics" with "reducible to fundamental particle physics *without loss of explanatory necessity*." She doesn't engage with the argument that the *information* specifying the broken state isn't contained in the fundamental laws alone.
  *   **Marcus:** Could potentially overstate the *independence* of higher levels. Anderson wasn't anti-reductionist; he acknowledged microphysics *constrains* possibilities. The point is that within those constraints, new laws *autonomous* in their explanatory domain emerge. Marcus might not fully emphasize that higher-level laws are still *consistent* with microphysics, just not *derivable* from it alone in a way that captures their necessity and causality without the higher-level concepts.
  *   **Both:** Might underplay the **epistemological necessity** of higher-level explanations. Even if a Laplace's Demon *could* compute macro-behavior from a microstate (which requires knowing the emergent state), that computation would be incomprehensible gibberish to humans. The higher-level laws (like elasticity theory) are not just practical shortcuts but essential frameworks for *understanding* causation and regularity at that scale. Anderson's point blends ontology (new properties/causes exist) with epistemology (new concepts/laws are needed to understand them).
