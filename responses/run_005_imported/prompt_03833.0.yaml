answer: |-
  You've described a painfully common and well-studied economic/game theory dilemma. Your friend is almost certainly referring to a **Prisoner's Dilemma** scenario combined with elements of **Escalation of Commitment** and **Sunk Cost Fallacy**. Here's the breakdown and potential solutions:

  **What's Going On (The Theory):**

  1.  **The Prisoner's Dilemma Analogy:**
      *   **The Setup:** Two rational individuals (you and your sister), acting independently, each have two choices: "Cooperate" (compromise/move towards the middle) or "Defect" (hold firm on your initial "final" offer).
      *   **The Payoffs (Perceived):**
          *   **If BOTH Cooperate (Compromise):** You both get a "good" outcome (a fair settlement, saved legal fees, preserved relationship). This is the BEST *collective* outcome.
          *   **If ONE Defects (Holds Firm) and the OTHER Cooperates (Moves):** The defector gets the "best" *individual* outcome (they get close to their initial demand, feel they "won"). The cooperator gets the "worst" outcome (feels they "lost," got taken advantage of).
          *   **If BOTH Defect (Hold Firm):** You both get a "bad" outcome (stalemate, mounting costs, relationship strain, delayed settlement). This is the WORST *collective* outcome, yet it's the most likely.
      *   **The Dilemma:** Even though mutual cooperation is best for both, the *individual* incentive is to defect (hold firm). Why? Because:
          *   If you think your sister *might* move, you're better off holding firm to "win."
          *   If you think your sister *won't* move, you *still* feel you must hold firm to avoid being the "loser" who moved first.
      *   **The Result:** The rational, self-interested choice for each, based on fear of being exploited and the desire to "win," is to defect (hold firm), leading to the mutually bad outcome you're experiencing – the **Nash Equilibrium**.

  2.  **Escalation of Commitment & Sunk Cost Fallacy:**
      *   You've both publicly committed to your "final" positions (to each other and your lawyers).
      *   You've invested significant time, emotional energy, and money (legal fees) defending that position.
      *   Backing down now feels like admitting you were wrong, wasting those resources, and "losing." This makes it psychologically harder to move, even as the real-world costs (legal fees, house bills, relationship damage) continue to mount. You're throwing good money after bad to justify the initial stance.

  3.  **The Ultimatum Game Element:** The initial "final offer" strategy resembles the Ultimatum Game, where one party makes a take-it-or-leave-it offer. Rejecting an unfair offer (even if it leaves you with nothing) is common due to perceived injustice. Here, you both made simultaneous ultimatums, and both rejected the other's as "unfair," locking you in.

  **Why This Strategy Backfired:**

  The lawyers' advice ("send a final number and never move") is standard *adversarial* negotiation tactic *if* you expect the other side to negotiate continuously. It aims to establish dominance. However, it catastrophically fails when:

  1.  **Both sides get the same advice:** It creates an immediate, symmetrical standoff.
  2.  **The parties have an ongoing relationship:** The tactic ignores the long-term relational costs far exceeding the marginal financial gain from "winning."
  3.  **There's no external pressure or mechanism to break the deadlock:** Without a judge, mediator, or deadline, inertia sets in.

  **How to Get Unstuck (Practical Solutions Based on Game Theory):**

  The key is changing the game's structure to make mutual cooperation (compromise) the easier, safer, and more rational choice. Forget "winning"; focus on minimizing *total* loss (financial + relational).

  1.  **Reframe the Problem Together:**
      *   **Initiate a Non-Business Call:** "Sis, I was thinking about Mom, and how much we're spending on lawyers while her house sits empty. This stalemate feels awful. Can we talk *just as siblings* for 10 minutes about how to stop the bleeding, without discussing specific numbers?"
      *   **Acknowledge the Trap:** "I realize we both did what our lawyers said, sent those 'final' numbers, and now we're both stuck feeling like we can't move first. This 'strategy' is costing us way more than the difference between our numbers in legal fees alone, not to mention the house bills and stress. It's punishing us both."
      *   **Focus on Shared Interest:** "We both want this settled. We both want a fair share based on Mom's wishes. We both want to stop wasting money. And honestly, I value our relationship more than winning a few extra thousand dollars in this awful process."

  2.  **Introduce a Coordination Mechanism / Change the Rules:**
      *   **Simultaneous Movement:** "What if we *both* agree to move significantly towards the middle at the exact same time? We could each email our lawyer and the other's lawyer a *new, compromise* number by [Specific Date/Time], without knowing what the other will offer until they are both revealed. That way, neither is moving 'first' or 'alone.'" (This directly attacks the "first mover loses" fear).
      *   **The Split-the-Difference Proposal:** "Look, the simplest fair solution is often splitting the difference. The difference between our numbers is $X. What if we just agree right now that the settlement will be exactly halfway between them? We both 'lose' equally by moving off our number, but we both 'win' by saving tens of thousands in fees and ending this nightmare immediately." (Frame compromise as mutual gain, not loss).
      *   **Appoint a Single Mediator (CRITICAL STEP):**
          *   **Jointly Hire ONE Neutral Mediator:** "Instead of paying two lawyers to argue, why don't we *together* hire one professional mediator? We split the cost. Their *only* job is to help *us* find a solution we both can accept. They have no stake in prolonging this. We can tell our current lawyers to pause work while we try this." (Mediators are experts in breaking impasses precisely like this).
          *   **Set Ground Rules:** Agree with your sister beforehand that you will both participate in mediation in good faith, empowered to make decisions, and commit to seriously considering the mediator's proposals. This external party provides cover – moving based on *their* suggestion feels less like "losing" to your sister and more like accepting neutral advice.
      *   **Deadline with a Fallback:** "If we can't agree on a compromise number or mediation by [Specific Date - e.g., 2 weeks], then we *both* agree to binding arbitration [or list the house for sale immediately and split proceeds 50/50 after costs, or whatever neutral fallback you can agree on]." This creates a costly consequence for continued stalemate, forcing action.

  3.  **Leverage Your Lawyers Differently:**
      *   **Instruct Them to Seek Compromise:** Tell *your* lawyer: "My priority is now resolving this quickly to preserve my relationship with my sister and stop the financial drain. Please communicate with her lawyer to explore compromise options, mediation, or the split-the-difference proposal. Stop billing for adversarial tactics." Hopefully, your sister does the same. If both lawyers get this instruction simultaneously, they can often broker a deal quickly.
      *   **Calculate the Cost of Stalemate:** Ask your lawyer to calculate exactly how much more in legal fees + house costs (taxes, insurance, maintenance, utilities) you will each burn through over the next 3, 6, and 12 months if this continues. Seeing this number often shocks people into realizing compromise is cheaper.

  **The Realistic Path Forward:**

  1.  **Call your sister.** Use the reframing language. Acknowledge the trap and the shared costs.
  2.  **Propose either Simultaneous Movement, Split-the-Difference, or Mediation.** Present these as "neither moves first" solutions.
  3.  **If she's receptive, AGREE ON THE MECHANISM QUICKLY and set an IMMEDIATE deadline for action** (e.g., "Let's both email our new number by Friday noon" or "Let's find and hire a mediator by next Wednesday").
  4.  **If hesitant, propose the Deadline with Fallback.** "If we can't agree on one of these paths by [date], then we list the house on [date+1 week]."
  5.  **Instruct your lawyer accordingly.**

  **The Core Insight:** You're both currently prisoners of a broken strategy. Escaping requires **conscious, joint action** to change the rules of the game. The solution isn't one person "winning," but both agreeing to stop the mutually destructive behavior. The money "lost" in compromise will be dwarfed by the money saved in legal fees and the priceless value of salvaging your relationship. Good luck – breaking this cycle is hard, but focusing on the *shared* benefit of ending it is the key.
