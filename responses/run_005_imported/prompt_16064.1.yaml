answer: |-
  The gaslight hissed, painting the high walls of Henry Sidgwick’s study in shifting amber and shadow. Outside, the Cambridge night was still, muffled by fog rolling off the Cam. Inside, the air hummed with a different kind of pressure – the weight of unanswerable questions compressed into meticulous notes, stacked reports, and the faint, lingering scent of ozone from an earlier experiment with a galvanometer.

  Sidgwick dipped his pen, the nib scraping like a tiny bone on the paper. *"Mrs. Dubois: Séance, November 12th, 1887. Attendees: Sidgwick, Podmore, Verrall..."* He paused. How many times had he begun such entries? Hundreds. Each a fragile vessel launched onto a dark, uncertain sea, seeking a shore reason couldn't chart. He wasn't chasing ghosts for thrills. He was chasing a *guarantee*.

  The memory of *The Methods of Ethics*, his life's work, pressed down. That elegant, relentless logic, dissecting morality until it bled its central flaw: the Dualism of Practical Reason. He’d proven, with chilling clarity, that Reason itself couldn't definitively show that doing your duty – maximizing universal good – would inevitably lead to your own happiness, or even prevent your ultimate ruin. Ethics and self-interest, those twin pillars of a rational life, stood separate, potentially opposed. Reason offered no bridge. It was an intellectual earthquake that had left a permanent crack in the foundation of his world. A crack that threatened to swallow meaning itself.

  The SPR wasn't a hobby; it was the emergency scaffolding. If empirical evidence – contact with the departed, proof of a purposeful universe – could be found, it might shore up the structure. It could demonstrate a cosmic justice, a divine calculus where virtue *was* rewarded, if not now, then beyond. It could close the wound Reason had inflicted.

  "Henry?" Eleanor stood in the doorway, her silhouette softened by the gaslight from the hall. Her eyes, sharp and kind, scanned the chaos of his desk – the spirit photographs, the transcriptions of automatic writing, the heavy SPR ledger. "You’re working late. Again."

  "Just reviewing the Dubois notes," he said, his voice carefully neutral. Eleanor, brilliant, skeptical Eleanor, was his anchor and his conscience. She shared his work, his burdens, but not this particular, gnawing desperation. She investigated phenomena; he sought salvation. "There was... an impression of cold. Distinct."

  "Cold spots are common, Henry. Drafts. Subjective sensation amplified by expectation." She stepped into the room, her presence a gentle counterpoint to his coiled tension. "You look exhausted. This pursuit... it consumes you."

  "It consumes me," he admitted, setting the pen down, "because the alternative is intolerable." He didn't need to elaborate. She knew the shadow that stalked his philosophy. "Without *some* evidence of a harmonizing principle, Eleanor... what is morality but a beautiful, possibly suicidal, gamble? What is my life's work but an elegant map leading to a precipice?"

  She touched his shoulder, a brief, understanding pressure. "The work stands on its own merits, Henry. The logic, the rigor..."

  "The logic," he interrupted, a rare edge in his voice, "leads to a void. It tells me I *ought* to sacrifice everything for the greater good, but offers no assurance that such sacrifice won't be utterly futile, personally catastrophic. It tells a starving man he *ought* to give his crust to another, even if it means his own death. Reasonably, why *should* he? Why should *anyone*, if the universe is indifferent?" He gestured helplessly at the papers. "This... this is the search for the *reason* why. Proof that the universe isn't indifferent. That the crust given *matters*, cosmically, to the giver as well."

  Eleanor sighed. "And if you never find it?"

  The question hung in the air, colder than any séance chill. Sidgwick looked away, towards the window and the impenetrable fog. "Then," he said quietly, "I remain suspended. Between the 'ought' and the 'is,' between duty and despair. A man perpetually on the edge of the precipice, knowing the fall is rational, but unable, quite, to take the step. Or turn away."

  ***

  The room in Chelsea was thick with the cloying scent of lily of the valley and something else – damp wool and nervous sweat. Heavy curtains blotted out the weak afternoon sun. Around the mahogany table sat the usual suspects: Frederic Myers, eyes burning with febrile hope; Frank Podmore, the skeptic, posture rigid with analytical tension; Eleanor, watchful, her notebook open; and Sidgwick, feeling the familiar, sickening cocktail of dread and desperate anticipation churn in his gut.

  Mrs. Dubois, a woman whose substantial frame seemed both present and oddly insubstantial in the gloom, slumped in her chair. Her breathing deepened, becoming stertorous. The air grew perceptibly colder. Sidgwick noted the gooseflesh rising on his own arms, the condensation of his breath. *Objective? Or collective suggestion?* The question was a mantra, a torture.

  A rapping sound began, sharp and irregular, beneath the table. Podmore shifted, craning his neck, but the darkness under the heavy cloth was absolute.

  "Who is there?" Myers' voice trembled. "Is it Arthur? Arthur Hallam?"

  A pause. Then three distinct raps. *No.*

  "Are you... are you from beyond?" Myers pressed.

  Two raps. *No.* Sidgwick’s heart sank a fraction. Fraud often began with such ambiguity.

  Then, a different sound. A faint whistling, like wind through a keyhole, seemingly emanating from near Mrs. Dubois’s mouth, though her lips remained slack. It formed a word, or the ghost of one: "*...Myers...*"

  Myers gasped. "Yes! Yes, I am here!"

  The whistling coalesced, strained. "*...the light... too far...*" Then, a choked gurgle, and silence.

  Mrs. Dubois shuddered violently, her head lolling. The cold spot dissipated as abruptly as it had formed. The rapping ceased.

  In the heavy silence, broken only by Mrs. Dubois’s labored breathing returning to normal, Sidgwick felt the familiar crushing weight. Not disappointment, exactly. Something worse. Ambiguity.

  Podmore was already moving, striking a match, lifting the tablecloth. He peered underneath, then straightened, his face unreadable in the sudden flare of light. "Nothing," he announced, his voice flat. "No devices. No strings."

  Myers was ecstatic. "Did you hear? 'Myers'! 'The light too far'! Arthur... he tried! He recognized me!"

  Eleanor was writing rapidly. "Auditory phenomena, localized cold, apparent dissociation of vocalization from the medium's conscious control. Inconclusive as to agency."

  Sidgwick said nothing. He felt the cold lingering in his bones, but it was an internal chill now. The message was meaningless. A name, a fragment. Was it Arthur Hallam, Myers’s long-dead friend, struggling from some unimaginable shore? Was it Mrs. Dubois’s subconscious, plucking the most resonant name from the expectant air? Was it pure trickery, too clever for Podmore to immediately detect? Each possibility yawned open before him like a different path into the same dark wood.

  *If it's fraud,* he thought, *the scaffolding crumbles further. The universe remains indifferent.*
  *If it's subconscious,* he continued, *then it's merely an internal echo, offering no proof of external harmony.*
  *If it's genuine...* Here, the hope flared, weak but persistent. *If genuine, it's a whisper from the other side. Proof of persistence. Proof that the 'ought' might be underwritten by something... Someone.*

  But the message itself – "the light too far." Was it a lament? A warning? Utter nonsense? It offered no guarantee of cosmic justice, no evidence that virtue was rewarded or self-sacrifice redeemed. It only proved, *possibly*, that *something* persisted. Not *why*. Not *for what purpose*.

  The dualism didn't close; it yawned wider. If spirits existed, were they happy? Were they just? Did they operate within a system that resolved the conflict between duty and self-interest? Or were they merely lost souls whistling in the dark, as confused and unredeemed as the living?

  ***

  Back in his study, the fog pressing against the windows like a suffocating blanket, Sidgwick stared at the notes from the Dubois séance. He had transcribed the whistled words: *"...Myers... the light... too far..."* Below it, his own annotations: *Cold: localized, rapid onset/offset. Auditory: source indeterminate. Content: ambiguous, referential but non-specific. Medium: no clear evidence of fraud detected. Conclusion: Anomalous. Requires further investigation.*

  *Anomalous.* The word tasted like ash. It wasn't proof. It wasn't disproof. It was a pebble dropped into the vast, silent ocean of the unknown, leaving no ripple he could measure, no answer he could grasp.

  He pushed the notes away. His gaze fell on a bound copy of *The Methods of Ethics*. He opened it, the pages falling apart at the well-thumbed section on the Dualism. His own words stared back, cold and impeccable:

  *"The rational direction of conduct... seems to lead us to two principles, which cannot be reduced to a single principle... the promotion of the general happiness, and the promotion of the individual's happiness."*

  *"Reason does not declare it to be ultimately reasonable to prefer the general good to one's own..."*

  He had dissected it with the precision of a surgeon. And like a surgeon, he had laid bare a fatal condition with no cure. The SPR was his desperate, lifelong attempt at faith healing.

  He dipped his pen again, not to write notes, but a letter. To a colleague, perhaps, or maybe just to the void. The words flowed, precise, academic, discussing the Dubois case as a "notable instance of concurrent phenomena," but his hand trembled slightly. A single drop of ink fell, blooming like a dark star on the paper, obscuring a word.

  He stared at the blot. Imperfection. Uncontrolled. Messy. A tiny, insignificant flaw in the ordered surface of the page. It felt like an omen.

  The wound wouldn't close. Not with reason. Not with raps in the dark or whistles in the cold. He was trapped on the knife-edge. To live ethically demanded potential self-annihilation in an uncaring void. To live for oneself alone was to abandon the very principle of reason and duty he had spent his life elucidating. It was a perpetual, grinding tension, an intellectual and existential torture chamber of his own devising.

  The gaslight flickered. Shadows leaped on the walls, monstrous and fleeting. Sidgwick didn't look up. He felt the precipice beneath his feet, not as a thrilling edge, but as a constant, exhausting pull. Below wasn't oblivion, but something worse: a universe where his highest reasoning led only to an unbearable, irreconcilable choice. The mediums offered whispers and chills; philosophy offered a silent scream. He was stranded between them, a man who had mapped the desert perfectly, only to realize the map offered no water, and the search for an oasis was driving him mad.

  He closed the ledger. He did not blow out the lamp. The light, however feeble, however incapable of illuminating the ultimate darkness, was all he had. He would keep looking through the cracks, not because he expected to find the guarantee, but because the alternative – accepting the absolute, unbearable silence of the indifferent void – was, quite simply, the one step over the edge he could not bring himself to take. The wound remained open, raw, and the search, however futile, was the only thing stanching the bleed. For now.
