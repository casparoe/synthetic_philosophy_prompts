  I'll structure the memo to first explain the problem with plurality, then introduce Arrow's theorem and its implications. Next, evaluate each alternative: ranked-choice (like IRV), Schulze, and approval. Compare them on criteria like ease of use, resistance to spoilers, and Arrow's applicability. Finally, recommend approval voting as the most practical for their size, with Schulze as a backup if they prefer rankings.

