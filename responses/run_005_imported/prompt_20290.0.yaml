  Okay, the user is working on a feature about the social cost of carbon and has gotten deep into discounting. They're confused about the distinction between pure time preference and growth-based discounting. They mention the Stern Review and Nordhaus debates, where Stern set pure time preference to near zero, leading to high damage estimates, while Nordhaus preferred market rates. Their economist friend insists these are morally different: pure time preference is arbitrary discrimination against future people, while growth-based is about diminishing marginal utility. But the user is skeptical because both reduce future welfare's weight.

  First, I need to clearly explain the two concepts. Pure time preference (δ) is valuing future well-being less just because it's in the future. Growth-based discounting (η * g) adjusts for future wealth, where η is the elasticity of marginal utility and g is economic growth. They combine in the Ramsey formula: r = δ + ηg. 

  The user wants to know why philosophers criticize pure time preference but accept growth-based. Ramsey called pure discounting "a practice which is ethically indefensible." The key ethical argument is that time itself isn't a moral reason to value someone less. Future people deserve equal consideration. Whereas growth-based discounting acknowledges that an extra dollar means less to richer people, which is standard utilitarianism.

  But both affect the discount rate. The user’s skepticism is valid: both reduce present value. The distinction is in the justification. Pure time preference is seen as discriminatory, while growth-based is seen as equitable. However, if we assume future generations will be richer, growth-based discounting might be acceptable. But what if climate change makes them poorer? Then η could be negative, increasing future weight. This shows growth-based discounting responds to welfare changes, unlike fixed time preference.

  The user’s deeper need is to present a clear verdict. They want to cut through academic debates for their feature. The takeaway is that pure time preference is harder to defend ethically, while growth-based has a plausible rationale. But challenges remain: predicting growth, η's value, and intergenerational equity beyond utilitarianism. Conclusively, while both reduce future weight, growth-based isn't just disguised time preference; it's a different ethical basis.
answer: |-
  You've nailed the core philosophical tension in climate economics – and your economist friend is right about the moral distinction, but the "why" requires unpacking. Philosophers (and ethically-minded economists like Ramsey) get exercised about **pure time preference (δ)** precisely because it violates a fundamental principle of impartiality, while **growth-based discounting (η \* g)** stems from a principle of *equality* of consideration applied to changing circumstances. Here's the verdict, grounded in the ethical reasoning:

  1.  **Pure Time Preference (δ): The Ethically Indefensible Core**
      *   **The Claim:** Discounting well-being *solely* because it occurs later in time.
      *   **Ramsey's Indictment (1928):** He famously called this "a practice which is ethically indefensible and arises merely from the weakness of the imagination." Why?
      *   **The Ethical Principle Violated:** **Impartiality / Equal Consideration of Interests.** Moral philosophy (especially utilitarianism, but also broader theories) demands that *like interests should be given equal weight*, regardless of *who* holds them or *when* they exist. Assigning less weight to the identical suffering or happiness of a future person *simply because they exist in the future* is analogous to assigning less weight to the interests of someone living far away or of a different race. It's temporal discrimination.
      *   **The Arbitrariness:** There's no *reason* inherent to the well-being itself why its timing should diminish its moral significance. Why is 2124 inherently less important than 2024? The burden of proof is on those advocating δ>0 to provide a non-arbitrary justification beyond "we just care less about the future," which sounds like moral weakness.
      *   **Stern's (Controversial) Stance:** Stern (δ ≈ 0) took this ethical principle seriously. Setting δ near zero embodies the view that the well-being of future generations deserves *equal* moral standing to our own, irrespective of time.

  2.  **Growth-Based Discounting (η \* g): Diminishing Marginal Utility, Not Temporal Bias**
      *   **The Claim:** Discounting *consumption* or *monetary value* (not directly well-being) because future people are likely to be richer, meaning an extra dollar (or avoiding a dollar of damage) provides them less *additional well-being* (utility) than it would provide to poorer people today.
      *   **The Ethical Principle Applied:** **Equal Consideration of Interests + Diminishing Marginal Utility (DMU).** This is *not* about valuing future well-being less. It's about recognizing that the *same physical resource* (a dollar, a ton of CO2 avoided) yields *different amounts of well-being* depending on the recipient's wealth.
      *   **The Logic:**
          *   **Premise 1 (DMU):** An extra dollar provides more well-being to a poor person than to a rich person. This is a core tenet of welfare economics and utilitarianism. (η, the elasticity of marginal utility, quantifies how steeply this decline happens).
          *   **Premise 2 (Expected Growth):** Due to technological progress and capital accumulation, future generations are likely to be richer than the present generation on average (g > 0).
          *   **Conclusion:** Therefore, transferring a dollar's worth of resources (via climate mitigation) from poorer present people to richer future people (via avoided damages) results in a net loss of well-being *if we ignore the damage itself*. We discount the *monetary value* of future damages to account for this difference in the *marginal utility of consumption* between eras. We are *not* discounting the *moral weight* of future well-being.
      *   **Nordhaus's (More Conventional) Stance:** Nordhaus uses a higher overall discount rate (r = δ + ηg), incorporating a significant ηg component based on observed growth and assumptions about η. This reflects the standard economic view that resources should be allocated efficiently across time, considering likely changes in wealth. His criticism of Stern was partly that Stern's near-zero δ *combined* with a relatively low η led to discount rates far below market rates, demanding implausibly high near-term sacrifice.

  **Why Philosophers Shrug (Relatively) at ηg but Not δ:**

  *   **ηg Respects Equal Consideration:** It applies the *same* moral weight to a unit of future well-being as present well-being. It simply acknowledges that achieving that unit of future well-being might require fewer current resources *because future people are richer*, or that sacrificing current consumption to prevent future monetary damages imposes a higher utility cost on the poor present than the benefit it provides to the rich future.
  *   **δ Violates Equal Consideration:** It explicitly says a unit of well-being matters less *because* it's experienced later. This is seen as fundamentally unfair and arbitrary from a moral point of view.
  *   **The "Same Practical Result" Fallacy:** You're right that mathematically, a high ηg can have the same *numerical effect* on the discount rate (r) as a high δ. **But the ethical justification and implications are profoundly different:**
      *   A high δ says: "Future suffering just matters less."
      *   A high ηg says: "Preventing $X of future damage is worth sacrificing less than $X today *because* that future $X represents less utility loss to richer future people than $X represents in utility loss if taken from poorer present people. Preventing the *same amount of suffering* might still require significant sacrifice if the damage is severe enough to overcome their wealth advantage." ηg adjusts for wealth differences; δ devalues the person.

  **The Verdict:**

  1.  **Yes, there is a strong, principled ethical case** for treating δ and ηg differently.
  2.  **Pure Time Preference (δ > 0) is indeed ethically dubious.** Ramsey's core argument holds: discounting well-being purely based on time violates impartiality. Justifying δ>0 requires appealing to controversial ideas like uncertainty about the future's existence, potential radical value shifts, or a non-utilitarian ethic that prioritizes the proximate – arguments many find weak or insufficient against the discrimination charge.
  3.  **Growth-Based Discounting (ηg) is not "pure time preference in a lab coat."** It's the application of standard welfare economic reasoning (diminishing marginal utility applied across time) under the assumption of growth. Its ethical foundation is *consistent* with equal consideration of interests across generations.
  4.  **However, ηg is not ethically unproblematic:**
      *   **Predicting Growth (g):** Assuming perpetual high growth is risky, especially with climate impacts. If growth stalls or reverses (g low or negative), ηg becomes low or negative, *increasing* the weight of future damages. This highlights that ηg responds to *expected welfare*, not time.
      *   **Value of η:** Choosing η (how much we care about inequality) is highly normative and contentious. A high η implies strong aversion to inequality, weighting future consumption less even if growth is positive.
      *   **Distributional Assumptions:** ηg typically assumes *average* growth. It may undervalue damages hitting *poorer* future subgroups.
      *   **Non-Utilitarian Views:** Theories prioritizing rights, justice, or sustainability might reject *any* discounting (even ηg) if it risks catastrophic harm or violates duties to future generations.

  **Conclusion for Your Feature:** The distinction is real and ethically significant. Stern's near-zero δ was a bold (and to economists like Nordhaus, unrealistic) commitment to intergenerational impartiality. Nordhaus's higher r, driven significantly by ηg, reflects a standard economic efficiency view that accounts for expected wealth differences. The "social cost of carbon" fight isn't just about dry math; it's a clash between an ethic demanding *equal standing for the future* (prioritizing δ≈0) and an ethic focused on *efficient allocation across an expected wealth gradient* (prioritizing ηg calibrated to markets). The discount rate isn't just a number; it's a deeply moral parameter encoding our assumptions about the value of the future and the nature of fairness across time.
