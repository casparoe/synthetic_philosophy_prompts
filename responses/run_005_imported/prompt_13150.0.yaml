  Structure thoughts: 
  Opening should disarm the non-experts immediately. Maybe confessing his own retirement hobby (philosophy of economics) to signal "this won't be dry." Then frame the theorem as a "riddle" about why trading shouldn't exist—but her career is the living counterproof. The Groucho Marx joke is useful here; everyone knows "wouldn't join a club that'd have me," even if they don't know Aumann's math.

  For the finance crowd: Nod to "common knowledge," "Bayesian priors," and "P&L" subtly. For others: Compare traders to "oracles" or "mind readers." The punchline? That traders like his sister thrived *because* the theorem's assumptions (perfect rationality, shared priors) aren't real. Her success came from exploiting human messiness—ego, information asymmetry, sheer guts. 

  Emotional beat: Shift from humor to tribute. Highlight her integrity ("never burned bridges") and the humanity beneath the trading floor chaos. End with why she's beloved: She made markets work *despite* theory saying they shouldn't. That’s the mic drop.

  Watch-outs: 
