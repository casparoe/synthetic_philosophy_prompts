answer: |-
  You've pinpointed a profound tension in Sidgwick's argument, exposing the core challenge of investigating phenomena that violate established paradigms. Sidgwick is attempting a nuanced balancing act, but his passage does indeed contain elements of both the statistical argument and the admission of an unfalsifiable core to skepticism. However, it's not pure equivocation; he *is* gesturing towards a rigorous probabilistic foundation, while simultaneously acknowledging its practical and rhetorical limitations against a specific type of entrenched skepticism. Let's reconstruct his argument step-by-step:

  1.  **The Core Statistical Argument (The "Heap of Facts"):**
      *   **Premise:** Individual investigations, no matter how rigorous, have a finite "credit" (credibility/evidential weight) due to inherent limitations (potential for error, unconscious bias, or the *possibility* of fraud, even by seemingly trustworthy investigators).
      *   **Premise:** Skepticism ("scientific incredulity") is deeply ingrained and fortified ("long in growing... many and strong roots").
      *   **Strategy:** Overcome this skepticism not by seeking a single, irrefutable "smoking gun," but by accumulating a large number of independent investigations ("fact upon fact," "experiment upon experiment") from diverse sources ("every additional witness... with a fair stock of credit").
      *   **Probabilistic Foundation (Implied):** This strategy implicitly relies on the mathematics of independent probabilities. If each investigation has some probability `p` of being *genuine* (or, conversely, `1-p` of being flawed/fraudulent *despite appearances*), and if the investigations are *genuinely independent*, then the probability that *all* `n` investigations are flawed/fraudulent is `(1-p)^n`.
      *   **Conclusion:** As `n` (the number of credible, independent investigations reporting the phenomenon) increases, `(1-p)^n` becomes exponentially smaller. The joint probability that *every single one* is mistaken or fraudulent becomes vanishingly small, making the hypothesis that the phenomenon *is* occurring increasingly probable. This is the "burying it alive under a heap of facts." Sidgwick is "entitled to conclude" that *if* `p` is non-zero (i.e., there's *some* chance a well-conducted investigation is genuine) and independence holds, cumulative evidence *should*, probabilistically, overwhelm reasonable skepticism.

  2.  **The Admission of Unfalsifiable Skepticism ("The Investigator is in the Trick"):**
      *   **Observation:** Sidgwick recognizes a limit to the "demonstrative force" of any single investigation. No matter how meticulously designed and executed, a critic can *always* posit that the investigator(s) themselves are complicit in fraud ("in the trick").
      *   **Nature of the Objection:** This objection is *unfalsifiable* in the context of a single investigation. You cannot *prove* a negative (that no fraud occurred) with absolute certainty, especially if the hypothetical fraudster is sufficiently clever and determined. The investigator's integrity becomes the last line of defense.
      *   **Consequence:** Sidgwick explicitly states that when a critic resorts *only* to this allegation ("he has nothing else left to allege"), they reveal this objection as a *default rhetorical retreat* rather than a substantive engagement with the evidence itself. It's an admission that this specific skeptical move is immune to evidentiary counter-argument *within the framework of that single case*.

  **Reconciling the Two Halves: Sidgwick's Nuance**

  Sidgwick is **not** fundamentally equivocating, nor is he undercutting his core argument. He is making two distinct but related points about different *levels* or *types* of skepticism:

  1.  **Against Methodological Skepticism (Addressing "Normal" Doubts):** The "heap of facts" strategy *is* valid and powerful against skepticism grounded in concerns about error, coincidence, limited perspectives, or even *isolated* instances of potential fraud. It attacks the *joint probability* that *all* these diverse, independently conducted investigations could be fundamentally flawed *for ordinary reasons*. This is where the cumulative statistical argument works. He is "entitled to conclude" that this *should* shift the burden of proof onto the skeptic to explain the *mass* of evidence without resorting to increasingly improbable concatenations of error or isolated fraud.
  2.  **Against Radical, Unfalsifiable Skepticism (The "In the Trick" Fallback):** Sidgwick acknowledges a *different*, more profound kind of skepticism that is *in principle* immune to evidence. This skepticism doesn't engage with the *content* of the evidence or the *specifics* of the methodology; it simply posits universal dishonesty or delusion on the part of *all* proponents, regardless of their individual credibility or the circumstances. This is the "investigator is in the trick" move raised against *every single instance*, no matter how compelling the case appears on other grounds.

  **Why the Two Halves are Consistent (and Sidgwick's Point):**

  *   **Targeting Different Audiences:** The "heap of facts" is aimed at shifting "the common sense of mankind" and reasonable, open-minded skeptics who operate under normal standards of evidence and probability. The "in the trick" admission is a lament about the *intractable* core of ideological or paradigm-bound skepticism that *refuses* to play by those normal rules.
  *   **The "Pegging Away" Strategy:** Sidgwick advocates accumulating evidence *despite* knowing this ultimate fallback exists. His hope is that:
      *   The sheer mass will overwhelm *practically* all reasonable skepticism (addressing point 1).
      *   The consistent application of rigorous methods by investigators of high repute will make the "in the trick" accusation appear increasingly *desperate, ad hoc, and unreasonable* to neutral observers, even if it remains logically possible. He trusts that the "mass of evidence" will generate "conviction" in those not ideologically committed to denial.
      *   By "not wrangl[ing] too much" about any single case's "conclusiveness," he avoids getting bogged down in endless debates over unfalsifiable accusations concerning individual studies and keeps focus on the overall pattern.
  *   **The Role of Investigator Credibility:** Sidgwick highlights that the *highest* evidential weight an individual investigation can achieve is limited by the investigator's perceived trustworthiness. The cumulative case *also* implicitly relies on the *aggregate* credibility of *many* independent investigators. Accusing *all* of them, consistently, of being frauds requires positing a vast, undetected conspiracy of otherwise reputable scientists – a hypothesis that itself becomes increasingly improbable as the number of investigators grows. However, Sidgwick realistically notes that hardened skeptics *will* still make this accusation.

  **What Sidgwick is Entitled to Conclude (and What He Isn't):**

  *   **Entitled:**
      *   That investigating extraordinary claims requires extraordinary amounts of high-quality, independent evidence to overcome deeply ingrained skepticism.
      *   That no single investigation, however good, can be *absolutely* fraud-proof or immune to the "in the trick" accusation.
      *   That a cumulative case, built on multiple independent lines of evidence from credible sources, *probabilistically* undermines explanations relying on universal error or isolated fraud *under normal standards of evidence evaluation*.
      *   That the "in the trick" accusation, when raised *as the sole objection* against a large body of diverse evidence, is a sign of an unfalsifiable, ideologically driven skepticism rather than a substantive critique.
      *   That persistence ("pegging away") and focusing on the aggregate ("mass of evidence") is the only viable strategy against such deeply rooted skepticism.
  *   **Not Entitled (Based on this passage alone):**
      *   To claim that the cumulative case *logically proves* the phenomena are real (it increases probability, but doesn't grant certainty).
      *   To claim that the "heap of facts" strategy will *necessarily* convince *everyone*, especially those committed to the "in the trick" hypothesis regardless of evidence.
      *   To ignore the critical assumptions underlying the statistical argument: the *actual independence* of investigations, the *reasonableness* of the initial probability `p` assigned to a genuine result from a credible investigator, and the *absence* of systemic biases or methodological flaws affecting the entire field.

  **Conclusion:**

  Sidgwick's passage is remarkably clear-eyed. He presents a robust defense of the cumulative case approach grounded in probabilistic reasoning ("burying it alive under a heap of facts"). Simultaneously, he confronts the uncomfortable reality that the most radical form of skepticism ("the investigator is in the trick") is rhetorically unfalsifiable *in any individual instance* and will persist as a last resort ("he will allege that"). He doesn't equivocate; he acknowledges both the power *and* the limits of evidence against deeply held beliefs. His strategy is pragmatic: overwhelm reasonable doubt with volume and quality, render the radical skepticism obvious and desperate, and trust that the sheer weight will move "the common sense of mankind." His reputation for intellectual honesty is bolstered by this very admission of the intractable core of the opposition he faced. He understood that evidence fights a battle on two fronts: against specific doubts and against a worldview. His strategy addresses the first, while his lament diagnoses the second.
