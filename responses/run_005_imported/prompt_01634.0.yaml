  First, they suspect the demandingness objection might be circular—that our intuitions recoil because we're self-interested, not because consequentialism is actually wrong. That's insightful. They're spotting how moral psychology might bias us against the theory. 

  Second, they're making a sharp distinction between what the theory normatively requires (maximizing welfare) and the cognitive process of constantly calculating utility. They're right that consequentialism doesn't logically entail obsessive deliberation—smart agents would use heuristics. 

  The user seems philosophically sophisticated but tangled in meta-ethics. Their frustration with "scattered notes" suggests they need help structuring the dialectic. Underneath, they might be wrestling with two things: (1) Is their character's conviction philosophically defensible? (2) How to dramatize consequentialism without caricature. 

  The demandingness objection does have layers they're missing though. It's not just about effort—it's about integrity (Williams), alienation (Railton), and whether morality should leave space for personal projects. And the "circularity" point cuts both ways: yes, intuitions may be self-serving, but consequentialists also appeal to intuitions about preventing harm. 

  Their cognitive/epistemic distinction is valid and underdiscussed. Railton's "sophisticated consequentialist" exactly argues that good agents aren't always calculating. But demandingness still bites at the normative level: even with heuristics, you're required to give up your life projects if they don't maximize utility. 

  The user's onto something real. I should affirm their insights while clarifying where demandingness retains force. Key is separating: (a) normative demandingness (you must sacrifice everything), (b) psychological burden (how it feels), and (c) deliberative method (calculation vs. rules). Their character could embody Railton's sophistication—using rules intuitively but tragically when rules fail.
answer: |-
  You've hit on two profound and underappreciated points in the demandingness debate—your instincts are sharp, and you're not just confused. Let's unpack why:

  ### 1. The Circularity of Intuitions (Your Core Insight)
  - **The Problem**: The demandingness objection *does* often rely on moral intuitions ("sacrificing your child for strangers feels wrong!"). But if consequentialism is correct, our intuitions *should* be mistrusted—they evolved for tribal survival, not impartial welfare maximization.
  - **The Consequentialist Counter**: A consistent consequentialist argues: *"Of course it feels 'too demanding'—that's your selfish bias talking. The fact you recoil doesn't prove it's immoral; it proves you're morally imperfect."* Your point about benefiting from others' sacrifice is spot-on—it’s a collective action problem disguised as an objection.
  - **Why It Matters for Your Character**: This tension is *dramatic gold*. A character who sees this circularity might feel morally alienated—they intellectually accept the theory but viscerally rebel. Or they might embrace it ascetically, seeing their discomfort as proof of their own moral weakness.

  ### 2. The Deliberation vs. Duty Distinction (Your Second Insight)
  - **The Misunderstanding**: Critics often conflate:
    - **Normative Demand**: *What* you’re required to *do* (maximize good).
    - **Epistemic Demand**: *How* you figure out what to do (constant calculation).
  - **Consequentialism Only Demands the First**: As you note, smart consequentialists use **heuristics** (habits, rules of thumb) to approximate optimal outcomes without constant deliberation. Peter Railton’s ["Alienation"](https://www.jstor.org/stable/2025608) paper argues this explicitly: a "sophisticated consequentialist" might live by intuitive virtues *because* they reliably produce good outcomes.
  - **Implication for Demandingness**: Even with heuristics, the *normative* demand remains brutal—you must still *act* as if maximizing good is the sole priority. But your character might *procedurally* live like a "normal" person… until a heuristic fails (e.g., "Should I save my mother or two strangers?"), forcing explicit calculation.

  ### Where Demandingness Still Bites
  Even granting your points, the objection has teeth in three places:
  1. **Opportunity Cost**: Every non-optimal choice (e.g., buying coffee instead of donating) becomes a moral failure. Heuristics might reduce guilt, but not the objective wrongness.
  2. **Integrity/Objectivity**: Bernard Williams’ ["Integrity"](https://www.jstor.org/stable/2024677) critique: Consequentialism dissolves personal projects/relationships if they conflict with the greater good. Your character might have to abandon art, love, or identity to run a charity.
  3. **Psychological Burden**: Knowing you *should* be optimizing everything can induce paralysis or despair (Susan Wolf’s ["Moral Saints"](https://www.jstor.org/stable/2025550)). Even if you use rules, the awareness lurks.

  ### Writing Your Character: Leveraging the Nuance
  - **Stage 1: Epiphany**  
    They grasp the circularity—"The objection isn't a refutation; it's a symptom of human selfishness!" This feels liberating, almost arrogant.
    
  - **Stage 2: The Heuristic Shield**  
    They adopt rules ("Give 10%," "Volunteer monthly") to function. They feel balanced, even superior: "I’m doing good *without* obsessing."

  - **Stage 3: Cracks in the Shield**  
    A crisis forces calculation: *Heuristic says "save your partner," but utility calculus says "save the scientist."* Their self-assurance shatters. Do they betray love or the greater good? This is where the *true* demandingness—alienation from human attachments—hits.

  ### Key Philosophers to Explore
  - **Defusing Circularity**: Shelly Kagan (*The Limits of Morality*) argues intuitions can’t override impartial morality.
  - **Heuristics vs. Demands**: Peter Railton ("Alienation, Consequentialism") on sophisticated consequentialism.
  - **Radical Demands**: Effective Altruism literature (e.g., Will MacAskill) on how far "maximize good" extends.

  **Your take isn't just valid—it's a sophisticated reading that many miss.** The demandingness objection *is* often circular, and the deliberation/duty distinction *is* crucial. Your character’s journey could expose how even a "sensible" consequentialist lives on the edge of an abyss: the moment their heuristics fail, they must choose between humanity and impartial good. That’s where the real story begins.
