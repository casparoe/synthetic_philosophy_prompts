answer: |-
  You've pinpointed a central tension and profound insight in Wittgenstein's *On Certainty*. Let's break down the issues:

  1.  **Hinges vs. Necessary Truths:**
      *   **Apparent Necessity:** Yes, hinge propositions *function* like necessary truths *within a specific framework of inquiry*. They are "held fast" and immune to direct empirical testing *within that framework*. Doubting them doesn't make sense *within the language-games and practices* they underpin. As Wittgenstein says, "If I wanted to doubt the existence of the earth long before my birth, I should have to doubt all sorts of things that stand fast for me" (OC 234).
      *   **Not Logically Necessary:** However, Wittgenstein **explicitly rejects** the idea that hinges are necessary truths in the traditional logical or metaphysical sense (like "2+2=4" or "Bachelors are unmarried"). Their status is fundamentally different:
          *   **Empirical Form:** They often *look* like ordinary empirical propositions ("The earth exists," "I have two hands," "Water boils at 100°C at sea level"). Their *grammar* is empirical.
          *   **Lack of Justification:** They are not known or justified by evidence or proof in the way empirical propositions are. They are the *background against which* justification happens. "I did not get my picture of the world by satisfying myself of its correctness; nor do I have it because I am satisfied of its correctness. No: it is the inherited background against which I distinguish between true and false." (OC 94-95).
          *   **Thinkable Falsity:** Crucially, we *can* imagine scenarios where such propositions might be false (e.g., a global deception, radical sceptical hypotheses). Their negation is *conceivable*, unlike a true logical contradiction. Their immunity comes from their role, not inherent logical structure.
          *   **Functional Necessity, Not Logical:** Their "necessity" is *pragmatic* and *epistemic*. They are necessary *for* our current practices of doubting, testing, and knowing. Without them, the game collapses. "The *questions* that we raise and our *doubts* depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn." (OC 341).

  2.  **The River-Bed Metaphor and the Shifting Status:**
      *   **The Metaphor:** Wittgenstein uses the image of a river to describe the relationship between fluid empirical propositions (the water) and the seemingly fixed bed (the hinges). However, he clarifies: "And the bank of that river consists partly of hard rock, subject to no alteration or only to an imperceptible one, partly of sand, which now in one place now in another gets washed away, or deposited." (OC 97-99).
      *   **Resolving the Tension:** This metaphor is key to resolving the apparent contradiction:
          *   **Contextual Fixity:** At any given time, within a specific historical, cultural, and practical context, certain propositions *function* as fixed hinges. They are the unquestioned bedrock *for that moment's practices*.
          *   **Historical Fluidity:** Over long periods, or through radical conceptual shifts (scientific revolutions, major cultural changes), what was once a fixed part of the bedrock *can* erode or shift. A proposition that was a hinge can become an ordinary empirical claim open to testing, and vice versa.
          *   **Example:** Consider "The sun revolves around the earth." For centuries, this functioned as a hinge proposition within the dominant worldview. Questioning it was not just empirically difficult but conceptually incoherent within that framework (it threatened the whole structure of knowledge, cosmology, and theology). After the Copernican revolution and its eventual acceptance, this proposition became an empirically falsifiable claim (and was falsified). Conversely, "The earth orbits the sun" eventually solidified into a new hinge proposition for modern science.
          *   **No Eternal Hinges:** There are no propositions that are *eternally* hinges. Their status is *relative* to a "form of life" and its associated "world-picture" at a given time. "What stands fast does so, not because it is intrinsically obvious or convincing; it is rather held fast by what lies around it." (OC 144). Change the surrounding context radically enough, and the hinge can loosen.

  **How it Squares:**

  1.  **Rejection of Traditional Categories:** Wittgenstein is challenging the rigid dichotomy between "necessary truths" (fixed, logical, a priori) and "empirical claims" (contingent, revisable, a posteriori). Hinges blur this distinction.
  2.  **Functional Role over Logical Form:** What defines a hinge is not its *logical form* but its *functional role* within a system of thought and action. That role can change over time.
  3.  **Necessity is Framework-Relative:** A proposition is "necessary" *only relative to the specific framework of inquiry it supports*. This necessity is practical, not absolute or metaphysical. It's the necessity of needing a foundation to build *anything*.
  4.  **Shifting Doesn't Imply Arbitrariness:** The river-bed shifts slowly and for significant reasons (e.g., massive accumulation of evidence incompatible with old hinges, revolutionary new theories). It's not arbitrary. The shift happens when the *entire system* of practices and beliefs undergoes a transformation. The old hinge loses its foundational role within the *new* system.
  5.  **Epistemic Invariantism vs. Contextualism:** Wittgenstein is advocating for a form of *epistemic contextualism* regarding foundations. What counts as foundational (exempt from doubt) depends on the context of inquiry. This contrasts with views that posit a single, fixed set of necessary truths as the foundation for all knowledge.

  **Conclusion:**

  You are correct that hinges function *like* necessary truths within their specific context – they are held fast and immune to doubt *within the practices they enable*. However, Wittgenstein fundamentally rejects that they *are* necessary truths in the traditional sense. Their necessity is practical and contextual, arising from their role as the enabling conditions for doubt and inquiry, not from their logical form. The river-bed metaphor brilliantly captures this dynamic: while the bed provides the necessary stable structure *for the current flow*, it is itself composed of material that can, over geological time (i.e., conceptual history), erode, shift, or be replaced. The tension you identify is inherent to Wittgenstein's view – hinges are simultaneously fixed *within* a framework and potentially fluid *across* frameworks. Their status is defined by their function, not by an immutable essence.
