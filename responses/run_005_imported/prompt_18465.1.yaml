  The user's tone suggests they lean pragmatic. They called the fornication repeal "obvious," and seem frustrated that bigamy is contentious. But they can't afford to sound dismissive in the memo, especially with that judge on the commission. 

  *scribbles outline* Recommendation should probably be full repeal: (1) The carve-out approach is messy—how do you define "clean" polyamory without inviting loopholes? (2) The moral-fabric argument fails their mandate because it's purely about enforcing morality. (3) The enforcement concern is valid but misdirected; we should fix the real tools. 

  Wait—important nuance. The memo must stress that rejecting Devlin's view here isn't rejecting it everywhere. Some morals laws (e.g., public indecency) might still pass the mandate if they prevent non-moral harms like disorder. But bigamy? If it's purely about defending monogamy as a value, it doesn't clear the bar. 

  *checks clock* Better flag that last bit explicitly. The retired judge needs to see her point was heard, even if outweighed. And the third camp? They get a concession: "Your worry is real, but here’s why it’s not our problem to solve with this law."
answer: |-
  ## Memorandum: Recommendation Regarding Bigamy Statute (Section [Insert Statute Number])

  **To:** Members, State Law Revision Commission  
  **From:** [Your Name], Public Member  
  **Date:** [Current Date]  
  **Subject:** Recommendation for Repeal of Bigamy Statute § [Insert Statute Number]  

  **I. Issue Presented**  
  Whether § [Insert Statute Number] (the bigamy statute), which criminalizes the act of purporting to marry one person while legally married to another, continues to serve a legitimate public purpose *apart from enforcing private morality*, as required by our Commission's charter, in light of modern circumstances including non-fraudulent, consensual, adult multi-partner relationships.  

  **II. Commission's Mandate**  
  Our enabling statute directs us to recommend repeal of any law that no longer serves **"a legitimate public purpose apart from enforcing private morality."** This standard requires us to identify concrete societal harms or functional benefits distinct from the mere disapproval of conduct deemed immoral by some.  

  **III. Analysis of Competing Positions**  

  *   **Position A (Carve-Out):** The statute lacks a legitimate public purpose when applied to non-fraudulent, fully consensual adult relationships ("clean cases"). No identifiable victim or concrete societal harm exists in this narrow scenario.  
  *   **Position B (Retain - Institutional Harm):** The statute serves the vital purpose of protecting the institution of monogamous marriage as a foundational social structure. Its erosion, even through non-coercive arrangements, constitutes a diffuse harm to the community's moral fabric, weakening a core institution essential for social stability, child-rearing, and the orderly distribution of rights/obligations. This *is* a legitimate public purpose distinct from merely policing individual morality.  
  *   **Position C (Retain - Enforcement/Signaling):** Repeal (or even a carve-out) weakens enforcement against coercive polygamous practices by blurring lines and potentially creating loopholes. Furthermore, retaining the statute sends a clear societal signal supporting monogamous marriage, regardless of prosecution frequency.  

  **IV. Application of Mandate to Bigamy Statute**  

  1.  **The "Institutional Harm" Argument (Position B) Must Be Engaged Seriously:**  
      The argument that criminalizing bigamy protects the social institution of monogamous marriage is a substantive claim rooted in historical and philosophical understandings of law's role (e.g., Devlin). It posits that the *institution itself* is a public good worthy of legal protection against actions perceived to undermine its unique status and societal function. This is distinct from criminalizing private immorality *per se*; it aims to safeguard a recognized structural pillar.

  2.  **Does This Institutional Purpose Meet the Mandate?**  
      Upon scrutiny, **the institutional protection rationale ultimately relies on enforcing a specific conception of private morality regarding marriage.**  
      *   **Definitional Dependence:** The "harm" to the institution arises *solely* because the conduct in question (multiple partners considering themselves married) violates the moral principle underpinning monogamous marriage as the *exclusive* legitimate form. There is no demonstrable, *independent* harm to societal functioning (e.g., economic disruption, administrative chaos in record-keeping for *non*-fraudulent cases, public safety threat) caused by the existence of private, consensual multi-partner family units *in and of themselves*.  
      *   **Lack of Concrete Harm:** The argument hinges on the *symbolic* or *expressive* harm to the institution's perceived primacy. Our mandate requires a public purpose *apart from* enforcing this specific moral viewpoint about what marriage must be. Protecting an institution solely because deviation from its traditional form is morally objectionable to some falls within the realm of enforcing private morality.  
      *   **Distinguishing Core Functions:** Laws protecting the *core legal functions* of marriage (e.g., preventing fraud in benefits/taxes, ensuring clarity in paternity, inheritance, and medical decision-making) are legitimate public purposes. However, § [Insert Statute Number] criminalizes the *act* of holding oneself out as married while legally married to another, irrespective of whether any fraud or functional harm occurs in a specific case. Its primary target is the non-conforming relationship structure itself.

  3.  **Addressing the Enforcement/Signaling Concerns (Position C):**  
      *   **A Different Statute?** The core concern here – prosecuting coercive practices, fraud, child abuse, or welfare fraud within polygamous groups – is **valid but misdirected at this statute.** These are harms caused by *coercion, fraud, and abuse*, not by the multi-partner structure *itself*. They are already effectively addressed (or should be) by other statutes:  
          *   Fraud (statutory, common law, benefits fraud)
          *   Coercion, Duress, Intimidation
          *   Statutory Rape, Child Abuse/Neglect
          *   Tax Evasion
          *   Violations of Marriage License Laws (if fraud is involved in obtaining one)
      *   **A "Zombie Law" is a Poor Enforcement Tool:** Relying on an unenforced or rarely enforced bigamy statute to combat these harms is inefficient and potentially counterproductive. It diverts focus from the *actual crimes* (coercion, fraud, abuse) and risks conflating harmful criminal conduct with non-harmful private arrangements, making targeted prosecution *harder*, not easier. Law enforcement should target the *conduct causing harm*, not the relationship structure.  
      *   **Signaling Value:** While law sends messages, our mandate compels us to evaluate the *purpose* the law serves, not its symbolic weight. Retaining a criminal statute primarily for its expressive value, absent a concrete, independent public purpose beyond enforcing a moral view, violates the charter's directive to repeal laws lacking such a purpose. Societal views on relationships evolve; the law should reflect demonstrable harms, not codify outdated moral preferences for signaling purposes.  

  4.  **The Carve-Out Problem:** Attempting to codify an exception for "clean" cases is legally fraught and impractical. Defining "consensual," "non-fraudulent," and "adult" with sufficient precision for a criminal statute would be immensely challenging, creating ambiguity and potential loopholes. It risks judicial entanglement in evaluating the internal dynamics of relationships. This approach does not resolve the core mandate question regarding the statute's fundamental purpose.  

  **V. Recommendation: Full Repeal**  
  I recommend the Commission vote to recommend the **full repeal of § [Insert Statute Number], the bigamy statute.**  

  *   **Rationale:**  
      *   The statute fails our mandate. Its primary contemporary justification – protecting the institution of monogamous marriage from perceived erosion by non-conforming private relationships – relies fundamentally on enforcing a specific conception of private morality regarding marriage. It lacks a demonstrable, independent public purpose (e.g., preventing concrete harm, fraud, or administrative chaos) *apart from* this moral enforcement.  
      *   Concerns regarding coercion, fraud, and abuse within polygamous groups are serious but are best addressed by robust enforcement of existing laws targeting those *specific harmful acts*, not by retaining a broad prohibition focused solely on relationship structure.  
      *   Repeal eliminates a zombie law that risks being applied arbitrarily or discriminatorily and clarifies that the state's focus is on preventing demonstrable harms, not policing consensual adult relationships.  
      *   Repeal aligns with the Commission's successful removal of other outdated morals statutes (fornication, cohabitation, sodomy) that similarly lacked a contemporary public purpose beyond enforcing private morality.  

  **VI. Addressing Potential Objections**  

  *   **"But doesn't this undermine marriage?"** Our mandate is not to defend a specific vision of marriage based on tradition or morality, but to evaluate if a *criminal statute* serves a public purpose *apart from* enforcing that morality. The civil institution of marriage remains defined and regulated by the state; repeal of this criminal provision does not alter civil marriage laws or their benefits/obligations.  
  *   **"What about the slippery slope?"** Repeal is based on this statute failing *this specific mandate*. It does not preclude laws against fraud, coercion, abuse, or other concrete harms, regardless of the relationship context. It also does not compel state recognition of plural marriages.  
  *   **"The 'clean case' is rare!"** The rarity of prosecution in such cases underscores the statute's obsolescence. Its continued existence creates a risk of misuse and fails the mandate. The existence of *any* non-harmful conduct criminalized solely for moral reasons necessitates repeal under our charter.  

  **VII. Conclusion**  
  The bigamy statute, § [Insert Statute Number], no longer serves a legitimate public purpose distinct from the enforcement of private morality. While the argument for its role in protecting a foundational institution is philosophically coherent and deserves serious consideration, it ultimately rests on preserving a moral boundary rather than preventing an identifiable, independent public harm. Concerns about coercion and fraud are legitimate but are properly addressed by other statutes targeting those specific crimes. Retaining this law for symbolic reasons or as a poorly suited tool for combating unrelated harms violates our Commission's clear mandate. I urge the Commission to recommend its full repeal.  

  **Respectfully submitted,**  
  **[Your Name]**  
  Public Member, State Law Revision Commission  

  ---

  **Key Strengths of this Memo for Your Defense:**  

  1.  **Engages Position B Seriously:** It explicitly acknowledges the institutional harm argument as substantive and rooted in legal philosophy (Devlin), avoiding any dismissal as a "strawman." It gives the retired judge's position its due weight.  
  2.  **Applies the Mandate Rigorously:** It meticulously analyzes whether the institutional purpose *truly* constitutes a public purpose *apart from* enforcing morality, concluding it does not because the "harm" is definitionally tied to the violation of the moral principle.  
  3.  **Directly Addresses Position C:** It concedes the validity of the *underlying concerns* (coercion/fraud) but forcefully argues these are *different harms* addressed by *different statutes*, making the bigamy law an ineffective and inappropriate tool. It frames reliance on it for these purposes as a misdirection.  
  4.  **Rejects Carve-Out as Impractical:** It explains why a carve-out is legally problematic and fails to resolve the core mandate issue.  
  5.  **Clear, Principle-Based Recommendation:** Full repeal is justified solely based on the statute failing the mandate, not on endorsing polyamory. It grounds repeal in the Commission's core function and precedent (other repealed morals laws).  
  6.  **Anticipates and Counters Key Objections:** It preemptively addresses likely rebuttals concerning marriage, slippery slopes, and rarity of prosecution.  

  This memo provides you with a principled, charter-based argument you can confidently defend, showing deep engagement with all viewpoints while concluding that repeal is the only path consistent with the Commission's mandate.
