prompt: |-
  I write about science and ideas. For a longform piece on how the effective altruism and longtermist movements handle obligations to future and merely possible people, I keep running into Derek Parfit's repugnant conclusion, and I've noticed that nearly every popular explainer I read stops exactly where things get interesting. A philosopher I interviewed for the piece pointed out that, per Gustaf Arrhenius's impossibility results, no population axiology can satisfy even a modest set of independently plausible adequacy conditions without entailing at least one deeply counterintuitive conclusion; something always has to give, and different theories simply give in different places.

  Rather than rehearse the usual "total utilitarianism versus average utilitarianism" framing that dominates most coverage, I'd like help getting a more considered sense of how the full field of contenders stacks up against one another. Could you rank the following population axiologies from most to least plausible overall: the Total View, the Average View, Critical-Level Utilitarianism, the Variable Value View, Lexical (Threshold) Views, and Person-Affecting Views (feel free to split the last into narrow and wide versions if you think they really diverge on this question)? In forming the ranking, weigh how gracefully each theory handles the Repugnant Conclusion, the Sadistic Conclusion, the Very Repugnant Conclusion, the Non-Identity Problem, and Parfit's Mere Addition Paradox against one another, rather than simply checking off which of these each theory manages to dodge outright — none of them, as far as I understand, escapes entirely unscathed.

  Please give your answer as a tiered JSON object running from best (S) to worst (D), with each entry formatted as "Theory: its chief liability," like this:

  ```json
  {
    "S": ["Theory name: liability", ...],
    "A": [...],
    "B": [...],
    "C": [...],
    "D": [...]
  }
  ```

  Please commit to genuine distinctions in plausibility rather than spreading every theory evenly across tiers, and add a short paragraph afterward defending why your top-ranked theory beats the runner-up.
