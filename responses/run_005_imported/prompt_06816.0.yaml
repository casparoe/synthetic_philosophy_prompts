answer: |-
  ## The Weight of the Coin

  The blizzard screamed against the triage tent’s frozen canvas. Inside, the air hung thick with the smell of antiseptic, blood, and the peculiar, metallic tang of dread. Silas, his parka crusted with ice, stared at the two vials on the folding table. *Theridion*, the only antidote to the neurotoxin leaching through the veins of seven people scattered across the frozen research outpost.

  His radio crackled, Lieutenant Chen’s voice brittle with cold and urgency: “Medic Silas, confirm status. Alpha Lab reports four critical, one stable but deteriorating. Beta Dome… just the one. Dr. Amira Vance. Readings spiking fast. Over.”

  *Four and one stable versus one.* The math was stark, brutal. Five souls clustered in the relative shelter of Alpha Lab, versus Dr. Vance alone in the smaller Beta Dome, a kilometer away across treacherous, whiteout ice. Silas had one functional snow crawler, enough fuel for one desperate run before the storm swallowed the paths whole. He could load the vials – enough for one group, pre-mixed – and go. Not both.

  For years, Silas had lived by the creed drilled into every field medic: *Save the most you can.* Triage wasn’t personal; it was arithmetic. Resources against need. Five outweighed one. It was gravity. Obvious.

  Yet, as he picked up one vial, the smooth glass cold against his numb fingers, the ghost of a seminar lecture – a lifetime ago, before ice and blood – whispered in his ear. *Taurek.* The name surfaced like a bubble from deep, frozen water. *No one experiences the sum of the losses. Only their own.*

  He looked at the vial. It wouldn’t save ‘five’. It would save Lena, the young geologist with the nervous laugh. It would save Commander Rostov, gruff but fiercely protective. It would save Kenji, brilliant and quiet. It would save Anya, who sang folk songs off-key. It would save Petrov, the cook who hoarded real coffee. Five distinct universes, five individual catastrophes averted.

  Or it would save Dr. Amira Vance. Sharp, relentless Amira, whose work on extremophile bacteria might unlock new antibiotics. One universe. One catastrophe averted.

  But was the shattering of five universes *worse* than the shattering of one? Not in any way that could be felt, Taurek insisted. Each death was absolute for the one who died. The *number*… was it just an abstraction, a trick of perspective? A way to make the unthinkable feel manageable? Choosing Alpha wasn’t saving ‘more’; it was choosing *these five specific people* over *that one specific person*. Because he could only act for individuals, not for a number.

  The thought hit him like a physical blow. He sagged against the table. The wind howled, mocking his paralysis. *Save the most.* The imperative was a drumbeat in his skull. Five heartbeats versus one. Five futures extinguished versus one. How could it not matter?

  But then, *why* did it matter? Because five cries of anguish were louder than one? But he wouldn’t hear them. They’d die alone, in their separate agonies, unaware of each other. Because society valued five workers more than one? That felt monstrous. Because *he* would feel worse knowing he let five die instead of one? Was *his* guilt the measure? That seemed obscenely selfish.

  His hand trembled. The vial felt heavier. He pictured Alpha Lab – the groans, the fear, the shared, desperate hope. He pictured Beta Dome – Amira alone, monitors screaming, knowing no one was coming. Choosing Alpha felt like yielding to an immense, impersonal force. Choosing Beta felt like caprice. Like murdering five for no reason.

  *Fairness.* The word surfaced, fragile in the storm’s roar. Taurek’s strange, unsettling proposal. If no single perspective made five losses objectively worse than one… if choosing one group over the other was simply choosing *them*, arbitrarily… then perhaps the only fair thing was not to choose. To let chance decide. Give each person, through their group, an equal shot.

  The idea was absurd. Outrageous. Like flipping a coin for lives. Silas almost laughed, a harsh, choked sound lost in the wind.

  He fumbled in his parka pocket. His fingers closed around cold metal. An old, battered silver dollar, carried for luck, for idle moments. He pulled it out, staring at the worn eagle on one side, the liberty head on the other.

  *Heads, Alpha. Tails, Beta.*

  His breath hitched. This was madness. Parfit, Scanlon, all those names from dimly remembered debates would recoil. Resources existed to *save lives*. Maximize the outcome. Don’t gamble with them! Five *is* more than one! The sheer visceral pull of that truth was immense, a tide threatening to sweep away all intellectual doubt. Letting five die when he could save them… it felt like betrayal. Not just of them, but of reason itself.

  But the other voice, quieter, colder, persisted: *Why is *your* reason, *your* arithmetic, the one that decides who lives? Because you hold the vial? What gives you the right to condemn Amira because she worked alone? Or to condemn the five because they happened to be clustered together?*

  He placed the vial back on the table with a soft *clink*. He held the coin between thumb and forefinger. The metal seemed to absorb the dim light of the storm lantern, glinting dully. It felt impossibly heavy, heavier than the vial, heavier than his pack.

  Chen’s voice shattered the silence again, sharp with panic. “Silas! Alpha reports two crashing! Beta vitals critical! You have to move *now*! Which target? Over!”

  The storm screamed its own question. Silas closed his eyes. He saw five faces contorted in pain. He saw Amira’s sharp eyes, wide with fear and understanding. He saw not numbers, but people. Each loss absolute. Each a world ending.

  The creed *save the most* roared in his blood. It was simple. It was clear. It felt like sanity.

  But the coin… the coin felt like a terrible, impossible fairness. A refusal to let his fear of the larger number dictate who received the gift of life. An acknowledgement that, stripped of all else, perhaps the numbers didn’t carry the moral weight he’d always assumed. That saving five wasn't inherently *better*, just... different.

  His thumb tensed against the cold silver. The rational part of him screamed to grab the vial, jump in the crawler, and gun it towards Alpha. Five was five. One was one. The math held.

  But his thumb moved. A flick. Imperceptible. Deliberate.

  The coin arced into the frigid air above the folding table, tumbling end over end, catching the lantern light in brief, dizzying flashes of silver. Eagle. Liberty. Eagle. Liberty.

  Silas didn’t watch it fall. His gaze was fixed on the single vial of Theridion, its pale liquid glowing faintly. The blizzard’s shriek filled the tent, the world, his skull. He didn’t hear the coin land.

  He only knew it was still falling.
