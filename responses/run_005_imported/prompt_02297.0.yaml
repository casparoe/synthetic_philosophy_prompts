  So last night my friend and I got into it about that Han van Meegeren story — the Dutch guy who forged Vermeers so well he fooled actual Nazi's and the top art critics of his day. Her position: if literally nobody, even experts staring at the thing for years, can perceptually tell a forgery from the real painting, then there's no aesthetic difference between them full stop, and anyone who says otherwise is just being a snob about pedigree. I half remembered from a philosophy class that Nelson Goodman has a famous argument against exactly this move, and that it's weirder than just 'history matters' — something about how knowing a work is fake changes what counts as looking at it properly, almost like a claim about future perception rather then present perception. I couldn't reconstruct it well enough on the spot to push back on her. Can you spell out what Goodman's argument actually is, put it up against Alfred Lessing's opposing view (that the two really are aesthetically identical, and that whatever's wrong with a forgery isn't aesthetic at all), and say which position better survives the other's best objections?
