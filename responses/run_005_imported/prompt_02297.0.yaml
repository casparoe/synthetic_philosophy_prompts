answer: |-
  Here's a breakdown of the Goodman-Lessing debate on forgeries, perfectly tailored to your Han van Meegeren argument:

  **The Core Positions:**

  1.  **Alfred Lessing (The "Aesthetic Identity" Position):**
      *   **Argument:** The aesthetic properties of a work reside *solely* in the perceptible object itself – the lines, colors, shapes, textures, composition, etc., as they appear to a viewer. If two objects (an original and a perfect forgery) are perceptually indistinguishable *at a given moment*, they possess *identical aesthetic properties*.
      *   **What's Wrong with a Forgery?** The wrongness is *non-aesthetic*. It's primarily:
          *   **Deception/Fraud:** Lying about the object's origin and history.
          *   **Economic Harm:** Selling a copy as an original for financial gain.
          *   **Historical Misrepresentation:** Falsifying the artistic record and context.
      *   **Implication for van Meegeren:** When his "Vermeers" hung on the wall and were admired, they *were* aesthetically identical to genuine Vermeers (or at least, indistinguishable from what people *thought* Vermeers looked like). The aesthetic experience was real. The problem was the lie, not the painting's immediate aesthetic impact.

  2.  **Nelson Goodman (The "Authenticity Matters" Position - "Languages of Art"):**
      *   **Argument:** Authenticity *is* aesthetically relevant. Knowing a work is genuine fundamentally changes *how we look at it* and *what we see in it*. It's not just about pedigree; it's about the work's place in art history, the artist's oeuvre, and the interpretive frameworks we apply. His argument is subtle and multi-faceted:
          *   **"Symptomatic" vs. "Exemplary" Properties:** When we look at an original, we pay attention to features (brushstrokes, craquelure, subtle nuances) as *symptoms* of its origin – clues to the artist's hand, period, and authenticity. These properties become part of its aesthetic character *because* they signify authenticity. In a forgery, even if perceptually identical *now*, these same features are *not* symptoms of Vermeer's hand; they are symptoms of van Meegeren's deception. This difference in origin changes the *meaning* of the visible properties.
          *   **The "Future Perception" Point (The "Weirder" Bit):** This is crucial. Goodman argues that a *key aesthetic difference* lies in the *work's capacity to sustain scrutiny over time*. An original Vermeer possesses a density and complexity born of the artist's genuine style and historical context. A forgery, however perfect initially, is created within a different context (imitating, not originating) and often relies on mimicking *known* diagnostic features. As our knowledge of the artist, period, materials, and techniques deepens, the *forgery is more likely to eventually reveal itself as inadequate or anomalous* under new modes of examination or changing interpretive paradigms. The original Vermeer, being authentically *of* its time and creator, has the capacity to yield new insights and withstand new scrutiny indefinitely. The forgery does not. **Therefore, knowing a work is authentic gives us confidence that its aesthetic properties are resilient and will continue to reward looking; knowing it's a forgery tells us its aesthetic coherence is potentially fragile and time-limited.**
          *   **Categorization & Perception:** How we *categorize* a work (as "a Vermeer" vs. "a van Meegeren forgery") fundamentally shapes our perception. Seeing a painting *as* a Vermeer means looking for connections to his known works, his themes, his development. Seeing it *as* a van Meegeren forgery means looking for anachronisms, pastiches of known features, or clues to *his* technique. This categorization influences what features we notice, emphasize, and interpret – thus changing the aesthetic experience.

  **Putting Them Against Each Other:**

  *   **Lessing's Best Objection to Goodman:** "You're conflating *knowledge about* the work with the *perceptible properties of* the work itself. If two objects are truly perceptually identical *at time T*, then *at time T*, they *are* aesthetically identical. Any difference Goodman describes is psychological or historical, not inherent in the aesthetic object. The 'future scrutiny' argument is speculative – if the forgery is *so* perfect it's *never* detected, doesn't that *prove* its aesthetic equivalence? Goodman smuggles non-perceptual factors (history, future knowledge) into the definition of the aesthetic."
  *   **Goodman's Best Objection to Lessing:** "You artificially isolate the 'perceptible object' from its context and history, treating it like a mere sensory stimulus. But art isn't experienced in a vacuum. The *meaning* of the brushstroke, the *significance* of the color choice, depends entirely on *who made it, when, and why*. Two perceptually identical marks – one by Vermeer, one by van Meegeren – carry utterly different meanings and aesthetic weight. Further, Lessing ignores the *temporal dimension* of aesthetic experience. Art is meant to be revisited. The *capacity* of a work to bear repeated scrutiny and yield new understanding *is* an aesthetic property, and origin is fundamental to that capacity. A forgery is aesthetically deficient precisely because its perceptible properties, however convincing now, lack the deep grounding in artistic intent and historical context that allows an original to endure aesthetically."

  **Which Position Better Survives?**

  Goodman's position is generally considered more robust and survives Lessing's objections better, especially in the context of art history and critical practice:

  1.  **Context is Inescapable:** Lessing's strict separation of the "perceptible object" from its history and context feels artificial. Artworks derive meaning *from* their context. A urinal is just a urinal until Duchamp signs it "R. Mutt"; its aesthetic status (as *Fountain*) depends entirely on its origin and context. Similarly, the meaning of a van Meegeren "Vermeer" collapses when its true origin is known.
  2.  **The Future Scrutiny Argument is Powerful:** History consistently shows that forgeries, however perfect initially (like van Meegeren's), *do* eventually fall to new techniques (e.g., pigment analysis, x-ray, dendrochronology) or shifts in scholarly understanding. Van Meegeren's forgeries themselves are a prime example – they look utterly unconvincing *as Vermeers* to modern eyes precisely because our knowledge of Vermeer and 17th-century technique has advanced. Goodman captures this dynamic nature of aesthetic judgment.
  3.  **Categorization Shapes Perception:** Psychological studies and art historical practice confirm that knowing the origin *does* change how we see. Once a van Meegeren is known, we suddenly see the "clumsiness," the "heavy" figures, the "wrong" light – features previously overlooked or misinterpreted within the "Vermeer" framework. Goodman explains *why* this happens: the perceptible properties are reinterpreted based on their *newly understood* origin.
  4.  **Against the "Perfect, Undetected Forgery":** Goodman would argue:
      *   Its *potential* to be detected remains an aesthetic flaw (its lack of genuine historical grounding).
      *   Even if undetected, it *is* categorized and experienced *as* a Vermeer. Its aesthetic properties are experienced *through the lens of that (mistaken) authenticity*, which is fundamentally different from how we experience a work *known* to be a forgery. The "mistaken" experience relies on a false premise.
      *   The *artist's achievement* – creating a work within its genuine historical context that *inspires* such a convincing forgery – is part of the original's aesthetic significance that the forgery inherently lacks.

  **Conclusion:**

  While Lessing makes a strong point about the immediate sensory impact of a *successful* forgery, **Goodman's argument ultimately holds more water.** He successfully demonstrates that:

  *   Aesthetic experience is not just about raw perception but involves interpretation, categorization, and meaning derived from historical context and origin.
  *   Knowing a work is authentic grants confidence in its aesthetic resilience and its capacity to yield future understanding – a property a forgery inherently lacks.
  *   The "perceptually identical" argument ignores how knowledge of origin fundamentally *reconfigures* our perception and interpretation of the very same visual data.

  In the case of Han van Meegeren, Goodman would argue that even when his forgeries were accepted as Vermeers, the aesthetic experience was predicated on a *false categorization*. Once known as forgeries, not only did their monetary value and historical status collapse, but their *aesthetic character* fundamentally changed – they became fascinating examples of deception and technical skill, but utterly failed *as Vermeers* because they lacked the genuine historical grounding and artistic intent that gives a real Vermeer its enduring aesthetic power and capacity for discovery. The difference is aesthetic, not just ethical or historical. Your friend's position is the Lessing view; Goodman provides the sophisticated counter-argument you half-remembered.
