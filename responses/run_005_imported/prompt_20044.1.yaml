answer: |-
  Here’s a toast that threads the needle—grounded in Lewis’s philosophy but warm, inclusive, and built for spoken delivery. It clocks in around 4.5 minutes when read aloud with pauses:

  ---

  **(Clink glass gently. Smile at Priya and Marcus.)**  

  "Hi everyone. For those who don’t know me, I’m Priya’s college roommate, and I’ve had a front-row seat to this story since Marcus first showed up in our dorm kitchen, covered in turf pellets after soccer practice, trying to ‘borrow’ our last bagel. Priya glared. He apologized with coffee. And… here we are.  

  **Priya and Marcus, your love feels inevitable now. Like gravity. But the philosopher in this room—and yes, Priya, fifteen of you are clocking this—would remind us: it wasn’t fate. It wasn’t written. What looks like destiny? That’s the magic of *precedent*.**  

  Think of your tiny ritual: ‘See you on the other side.’ Said every time one of you leaves for the airport. It started as a joke, a line from a movie nobody remembers. But you kept saying it. It became *your* signal. Not because it was profound, but because it was *yours*. Because you both expected the other to say it. Expected the other to *expect* it. And suddenly, this little phrase held the weight of every reunion.  

  **That’s how the biggest things grow. Not because they’re written in the stars, but because we choose them. Again. And again. And again.**  

  David Lewis—whose ghost I feel hovering near the punch bowl—taught us that conventions aren’t about grand agreements or cosmic plans. They’re solutions we stumble into together. Arbitrary, at first. Like driving on the right side of the road. Or saying ‘see you on the other side.’ We do it because others do it, because we *know* others will do it, and because it just… works. It gets us home.  

  **Your love is a living convention. A beautiful, ever-deepening *coordination equilibrium**. You didn’t need a contract. You built it in a thousand moments: choosing the same terrible late-night diner every exam week. Marcus showing up with tacos after Priya’s brutal seminar. Priya learning the offside rule just to tease him. Each time, you found a pattern that worked. Each time, you chose to repeat it. You created your own common knowledge: *I am here for you. You are here for me. We are better together.***  

  **(Pause, turn to the room)**  

  Now, some might wonder: what about today? These vows? This grand ceremony? If love is built on quiet patterns, not proclamations—does *this* moment matter?  

  **Absolutely. Because today isn’t where the convention starts. It’s where it becomes *common knowledge* in the eyes of everyone who loves you.**  

  You’re standing before us, saying aloud what your actions have whispered for years. You’re making your mutual expectations radiantly clear. To Marcus’s soccer team, to Priya’s thesis committee, to Marcus’s mom quietly dabbing her eyes (*hi, Mrs. Carter!*), to my own parents who absolutely *did* raise me to cry at weddings… you’re saying: *This is us. This is our pattern. This is the equilibrium we choose forever.*  

  **So Priya and Marcus—thank you. Thank you for showing us how small, arbitrary things—a borrowed bagel, a silly airport phrase—can become sacred through repetition and care. Thank you for reminding us that the deepest commitments aren’t found in grand designs, but built brick by brick, expectation by expectation, in the quiet, consistent choice to show up.**  

  May your ‘other side’ always be home. May your coordination forever be Nash. And may your love keep generating its own beautiful, self-sustaining light.  

  **Raise your glasses: To Priya and Marcus!**  

  ---

  **Why This Works:**  

  1.  **Lewis, Embedded:** Key concepts (arbitrariness, precedent, mutual expectation, coordination equilibrium, common knowledge) are woven into the story, not lectured. Philosophers will nod at "coordination equilibrium," "common knowledge," "arbitrary," and "precedent." Non-philosophers hear "patterns," "choices," "expectations," and "rituals."  
  2.  **The Ritual as Proof:** "See you on the other side" is the perfect Lewisian example - arbitrary, self-perpetuating through expectation, meaningful *because* repeated. It grounds the theory.  
  3.  **Vows Justified:** Directly addresses the ceremony's role! Framing vows as *declaring existing common knowledge* beautifully resolves the "agreement" paradox. The convention *precedes* the public affirmation; the affirmation strengthens it for the community.  
  4.  **Emotional Payoff:** Focuses on *choice*, *effort*, and *building* love ("brick by brick," "quiet, consistent choice"). This is MORE moving than "meant to be" because it honors their agency. Your mom (and Marcus's) will cry at the tangible examples of care (tacos, offside rule, exam diner) and lines like "sacred through repetition and care."  
  5.  **Tone & Accessibility:**  
      *   **Humor:** Bagel theft, turf pellets, thesis committee/punch bowl ghost, "Nash" as a nerdy toast punchline.  
      *   **Warmth:** Specific, relatable memories (late-night diner, tacos).  
      *   **Direct Address:** "Priya and Marcus," "To Marcus’s mom," "Hi Mrs. Carter!", "my own parents."  
      *   **Cadence:** Short sentences. Punchy paragraphs. Clear transitions. Built for speaking.  
      *   **Inclusive:** Acknowledges all guest groups warmly.  
  6.  **Respects Priya:** Shows you engaged deeply with her work without turning her wedding into a seminar. The care is evident.

  **Delivery Tip:** Breathe. Pause after the emotional lines ("built brick by brick...", "sacred through repetition..."). Let the humor land. Look at Priya and Marcus during the key parts about *them*. Your genuine affection and the thoughtfulness behind this will shine through. You've got this!
