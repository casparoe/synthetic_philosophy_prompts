  So I was cleaning up my hard drive and ran one of those duplicate file finders, and it flagged two mp3s as exact duplicates - same hash, same size, not one bit different between them. Only reason there's two is one's been sitting in that folder since like 2011 and the other i redownloaded years later after my old laptop died. The program just wants me to delete one as redundant, which is obviously the sensible thing to do, but it's been bugging me and i cant quite explain why - there is literally nothing left to tell these two files apart except which one happens to physically be on the drive right now. So are they actually two different things, or is that just a convenient way of talking and really there's only one thing that got counted twice? Been stuck on this for weeks, would love to hear how you'd think it through.
