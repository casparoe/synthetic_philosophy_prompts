answer: |-
  ## The 5:15 AM Debate Beside Your Snooze Button

  *(The harsh alarm blares. Your hand snakes out, silencing it with practiced ease. As you burrow back into the pillow, two figures materialize beside the bed, already mid-argument.)*

  **Behavioral Economist (Becca):** See? Textbook hyperbolic discounting. Last night, at 10 PM, planning tomorrow’s workout, the distant pain of losing money to the "Save the Parasitic Wasps Foundation" felt severe enough to motivate action. The gym session itself seemed manageable. Discount curves crossed – gym was preferable. Now? Immediate comfort is intensely valuable. The future cost is deeply discounted. The curves *re-crossed*. Comfort wins. It’s not weakness, it’s predictable preference reversal. Simple math.

  **Philosopher (Philo):** Simple math? That’s like calling a car crash ‘simple physics’. It ignores the *agent*. Last night wasn't just a preference calculation! It was a **resolution**. A decision made *specifically* to bind your future self against this predictable discounting effect! You didn't just *prefer* the gym; you *committed* to it, knowing your morning self would undervalue it. This isn't a new preference; it's a *failure* to execute the resolution formed for *this exact moment*.

  **Becca:** Resolution? What is that but a strong prior preference? Ainslie shows resolutions *work* by bundling delayed rewards – "I go today so I stay fit long-term" – making the discounted value of *not* going *now* lower. But when the immediate temptation is sufficiently high, or fatigue sufficiently deep, the bundle frays. The discount curve for the immediate reward (sleep) spikes *so* high it overshadows the bundled future rewards *and* the bundled punishment (the donation). Valuation flipped. No mystery. The stronger preference won.

  **Philo:** But *is* it a preference you *own*? You silenced the alarm while *sincerely telling yourself* this was an exception. You *disavowed* the choice *as you made it*! Davidson argued weakness of will involves acting *against your own best judgment*. On your model, Becca, whatever impulse is momentarily strongest *is* the preference. So where's the 'will'? Where's the *agent* choosing? It reduces him to a passive conduit for whichever curve is highest. This wasn't a new preference; it was a *collapse* of his resolve.

  **Becca:** Ownership? The valuation *is* his at that moment! The disavowal *is* the conflict – the *future* self judging the *present* self's discount rate. The ‘best judgment’ from last night is a *different temporal self* with a different discount rate. The organism acts on the strongest current motivation. Calling it ‘weakness’ adds a moralistic layer to a biological/economic reality. Holton’s ‘resolution’ is just a fancy name for a particularly salient intention bundle. It has no magical causal power beyond its motivational weight *in the moment*.

  **Philo:** Ah, there's your weak spot! **If resolutions have no distinct causal power at the crucial moment – if they're just another input to the discount curve calculation – then why form them? Why does this feel like a *betrayal* rather than a simple change of mind?** Precisely because a resolution is a *commitment device* aimed at *overriding* the predicted momentary preference. Its power *should* come precisely when the discount curve predicts you'll cave! But on your model, it *can't* override – it just gets discounted like everything else. That renders resolutions *epiphenomenal* – pretty thoughts with no bite. Yet people *use* them, and feel *guilty* when they fail, precisely because they *intended* them to have force *beyond* momentary preference.

  **Becca:** Fair challenge. But intentions *do* have weight! They influence the discount curve itself! Forming a resolution, using this app, *raises* the perceived cost of skipping. It makes the future punishment more salient, bundling the shame of failure *with* the monetary loss. It shifts the curves! Last night's resolution *did* work – it made skipping cost $50 to wasps *plus* guilt. That raised the future cost curve significantly. But this morning, the immediate reward of sleep, amplified by fatigue, *still* spiked higher. The resolution shifted the battlefield, but didn't eliminate the discounting mechanism. It raised the bar the temptation had to clear. This time, it cleared it.

  **Philo:** But that still reduces resolution to *only* affecting valuation. It doesn't capture the *distinctive failure*. When he hit snooze, he didn't *re-evaluate* his resolution and find it wanting. He didn't decide the wasps *deserved* the money after all! He *bypassed* his resolution entirely. He told himself "just this once," exploiting a loophole his resolution *explicitly* aimed to close. That's not a shifted preference; that's an *akratic* act – knowing the better course, intending to follow it, yet failing. Your curves describe *why* the temptation was strong, but they don't explain why his *commitment to resist it*, formed with full knowledge of its strength, *dissolved* without being rationally reconsidered.

  **Becca:** And your weak spot, Philo? **What *is* this 'resolution' as a causal entity separate from motivational states?** If it’s not just a strong intention affecting valuation, *what force does it exert at 5:15 AM*? If it has no power to counter the overwhelming urge to sleep *in that moment*, how is it anything but self-deception? You posit a 'will' that can magically override the strongest present desire, but when it fails to materialize, you just call it 'weak'. That's not an explanation; it's labeling the phenomenon. Hyperbolic discounting *explains* why the 'will' seems weak *when* it does.

  **Philo:** The resolution isn't a ghost in the machine! It's a cognitive and practical strategy. It’s the *structure* he built – the app, the pre-packed gym bag, the mental rehearsal – precisely *because* he knows his evaluative states are unstable. Its 'force' isn't magical; it's the force of a *plan* engaging different cognitive systems (habit, rule-following) before the hot state of temptation hits. The failure isn't the plan lacking force; it's the *hot state* overwhelming the systems meant to execute the plan *without re-opening deliberation*. He didn't *choose* to re-evaluate; the fatigue *hijacked* the process. That's the weakness – the failure of executive control to *sustain* the resolution *as a rule* when the temptation arises.

  **Becca:** And the hijacking happens via... shifted discount rates! We circle back. The fatigue lowers the barrier for the immediate reward.

  **Philo:** And the resolution was meant to be the dam holding that back! Its failure is the event, not just a recalculated sum.

  *(They both turn to look at you, curled under the covers. The alarm clock glows 5:17 AM.)*

  **Becca:** The curves crossed. Sleep was valued more. Own the preference shift. Adjust the commitment device – make the penalty steeper, or the gym reward more immediate.

  **Philo:** You resolved to fight *this* moment. The failure isn't in your math, but in letting the impulse silence your resolve without a fight. Strengthen the *resolution*, not just the penalty. Rehearse the ‘why’, solidify the rule: "When the alarm sounds, I get up. No deliberation."

  *(They fade as your eyes drift shut again. The only sound is your breathing, and the faint, accusing glow of the phone, holding the charge for the wasps... and the unresolved question of what, exactly, just happened inside your will.)**
