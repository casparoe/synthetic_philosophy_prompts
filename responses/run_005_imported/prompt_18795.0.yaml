answer: |-
  The fluorescent lights of Mercy General’s ER hummed like angry bees, a sound Anya Sharma usually tuned out. Tonight, it drilled into her skull. Ambulance bay doors slammed. Voices overlapped – paramedics barking handovers, residents calling for labs, a drunk wailing about his stubbed toe. And in Bay 3, Mr. Henderson.

  Seventy-two. Found unresponsive in his garden shed. Hypothermic. Core temp 90.4°F when he came in. Now, warmed, he was semi-conscious, thrashing weakly against the restraints. Bruising blossomed across his left flank. Possible cracked ribs from the fall. But the real puzzle was his heart – rhythm skittering like stones on ice, BP dipping dangerously low despite fluids.

  "Okay, team," Anya snapped, her voice cutting through the din. "Hypothermia protocol enacted. Warming blanket. IV fluids wide open. Get me a 12-lead EKG stat, and repeat electrolytes. Toxicology screen? Anyone know his meds?"

  "Wife’s on her way," a nurse offered. "Says he’s on… something for blood pressure? And maybe a blood thinner?"

  *Great.* Anya’s mind raced. *Hypothermia-induced arrhythmia? Electrolyte imbalance from cold diuresis? Underlying cardiac event that caused the fall? Could the fall have caused cardiac contusion?* The possibilities branched like lightning forks.

  The EKG spat its tape. Sinus tachycardia with frequent PVCs. Not great, but not immediately catastrophic. Potassium came back low. *Okay,* Anya thought, *hypokalemia contributing to the arrhythmia. Replace K+.* She ordered the supplement, her eyes scanning the monitors, Mr. Henderson’s pale face, the bruise on his flank.

  *Relevance.* The word echoed from her argument with Ben, the ML engineer, just days ago. *How do you bound it?* Ben insisted scale conquered all. Anya, steeped in flesh and blood and sudden crashes, wasn’t so sure.

  As the potassium drip started, Mr. Henderson’s agitation increased. His good arm flailed, catching the edge of the warming blanket. A resident moved to re-secure it. Anya’s gaze snagged on the patient’s left pupil. Was it slightly larger than the right? It had been equal on initial assessment. *Head trauma?* But he hadn’t hit his head, the wife insisted. *Could hypoxia from the arrhythmia cause that? Or the hypothermia itself? Unilateral pupil change… subdural? But no reported head strike.*

  Her internal catalog exploded:
  *   *Pupil asymmetry: neurological cause?*
  *   *But no head trauma reported.*
  *   *Could he have hit his head in the shed and no one saw?*
  *   *The bruise is on his flank, not head.*
  *   *Hypothermia can cause neurological weirdness.*
  *   *Arrhythmia could be causing decreased perfusion.*
  *   *Low K+ causes arrhythmia.*
  *   *We’re replacing K+.*
  *   *Is the pupil truly unequal? Lighting artifact?*
  *   *Should I order a stat head CT?*
  *   *That means transport, radiation, delay.*
  *   *His BP is still dropping.*
  *   *Is the arrhythmia worsening?*
  *   *The shed… was there pesticide? Solvents? Could it be toxic exposure?*
  *   *Did he ingest something?*
  *   *The wife mentioned blood thinner… could there be occult bleed?*
  *   *Is the flank bruise hiding internal bleeding?*
  *   *His skin turgor is poor… dehydration contributing to low BP?*
  *   *We’re giving fluids…*
  *   *But if he’s bleeding internally, fluids dilute clotting factors…*
  *   *Is the pupil more important or the crashing BP?*
  *   *What’s the root cause?*

  It was a flood. True facts. Plausible connections. Endless implications, each demanding investigation. Time dilated. The resident was staring at her, waiting for the next order. The cardiac monitor chirped a faster, more insistent warning. Tachycardia worsening. BP 80/40. Mr. Henderson’s movements became weaker, his breathing shallow.

  *R1D1,* Anya thought with a spike of cold dread. *Still deducing the color of the walls while the bomb ticks.* She was drowning in the *could-bes*, paralyzed by the infinite web of relevance. Every piece of data demanded consideration; the frame kept expanding, threatening to swallow the patient whole.

  Then, a shard of pure instinct cut through. It wasn’t a deduced fact. It was the *feel* of the bay – the cold draft from the still-open ambulance bay doors, the smell of antiseptic and stale sweat, the *weight* of the warming blanket she’d just touched, the subtle blue tinge returning to Mr. Henderson’s lips despite the oxygen. It was ten years of nights like this, the muscle memory of crisis.

  Her body moved before her mind finished arguing. "Tilt the stretcher!" she barked, grabbing the rails herself. "Trendelenburg! Now!" She ignored the resident’s confused glance. "And get me an amp of epi ready! Push another 500ml saline bolus!"

  As the stretcher tilted head-down, Mr. Henderson groaned. The cardiac monitor stuttered, then the rhythm stabilized slightly. The BP stopped its nosedive, hovering precariously at 85/45. The pupil asymmetry? Still there, maybe. But the immediate freefall halted.

  Anya took a shaky breath. The toxicology screen would come back. The head CT could wait a few more minutes. The potassium was dripping. They had a moment.

  Had she solved it? Had she bounded the frame? Or had she just acted on a gestalt – a pattern recognized not by logic, but by a body immersed in the world’s messy urgency? Was this the statistical weighting Ben praised, emerging from her neural net trained on a thousand emergencies? Or was it something else – the absorption Dreyfus described, where relevance isn’t calculated, but *felt* in the grip of the stretcher rail, the sight of blue lips, the press of time?

  She looked at Mr. Henderson, still perilously unstable, the question of the pupil unresolved, the root cause unknown. The frame was still vast, full of unseen bombs. She’d acted, bought time. But the problem hadn’t dissolved. It had only receded, waiting for the next cascade of true, terrifying, and potentially irrelevant implications. She adjusted the oxygen mask, her knuckles white, the hum of the lights suddenly very loud again. The next decision loomed. How to bound *that*?
