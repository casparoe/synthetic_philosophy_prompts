  First, I should recall the core concepts. The Price equation partitions evolutionary change into within-group and between-group components. Hamilton's rule can be derived from this, showing that kin selection and group selection are mathematically equivalent in the additive case. The user wants a clear explanation of that partition and why it suggests one causal process. Then, they need to understand how non-additive (synergistic) interactions affect this equivalence. Finally, they wonder if the debate is just about formalisms.

  The user's explicit questions are technical, but their deeper need might be resolving a philosophical disagreement. They mention both sides agree organisms are the locus of selection but want to know if group selection adds anything. The friend's stance is from a gene-centered view, while the user seems open to multilevel perspectives. The user might be seeking not just facts but a way to reconcile differing viewpoints or find common ground.

  To explain the Price equation partition: Total evolutionary change (Δz̄) equals the covariance between group trait averages and group mean fitness (between-group selection) plus the average within-group change due to individual selection (within-group selection). Hamilton's rule emerges from this when relatedness is accounted for, showing that what looks like group selection is captured by kin selection models. That's the equivalence.

  For non-additivity, when fitness effects are synergistic, the additive partition no longer holds exactly. The covariance term includes interactions, making it messy. Kin selection models can handle this with regression coefficients, but it becomes less elegant. The user's point about "genuinely messy" is spot-on—here, the formal equivalence blurs, and interpretations might diverge, though not necessarily supporting group selection as a primary force.

  On the substantive disagreement: After the math, the debate might be semantic or heuristic. The user asks if it dissolves into formalism preference. I should say that empirically, both frameworks predict the same outcomes in additive cases, so the choice is about convenience or conceptual clarity. But in non-additive scenarios, the math gets complex, and preferences might reflect different research traditions. However, there's no empirical rift—just how we describe causality.

  I need to ensure clarity without jargon. Use analogies like the billiards game to explain partitioning. Emphasize that the equivalence is mathematical, not causal—both describe the same net effect. For non-additivity, stress that it's computable but uglier, and neither side gains exclusive ground. Finally, reassure that the core disagreement is likely resolved, leaving pragmatism.

  Check if I'm missing anything. The user mentioned Hamilton conceding in the 1970s—yes, he acknowledged the equivalence. Also, Wynne-Edwards vs. Williams: Williams critiqued naive group selection, but modern multilevel theory isn't that. Sober and Wilson revived it with rigor. Highlight that to distinguish from outdated ideas.

