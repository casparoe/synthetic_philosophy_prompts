answer: |-
  That's an *excellent* catch. Hobbes is laying the groundwork for his entire philosophical system here, and you're right to sense a bigger argument. Let's break down those two points:

  1.  **"Geometry... the only science that it hath pleased God hitherto to bestow on mankind":**
      *   **Literal? Yes, in a very specific sense.** Hobbes isn't denying the existence of physics, optics, or even politics. He's making a radical claim about the *method* and *certainty* of knowledge.
      *   **The Methodological Ideal:** For Hobbes, true "science" (in the sense of *scientia* - demonstrable, certain knowledge) *must* follow the model of geometry. Why?
          *   **Starts with Definitions:** Geometry begins by precisely defining its terms (point, line, circle). There's no ambiguity about what these names signify.
          *   **Deductive Reasoning:** From these clear definitions, using the rules of logic (which Hobbes sees as akin to computation - more on "reckoning" below), geometric truths are deduced with absolute necessity. If you accept the definitions and the rules, you *must* accept the conclusions (e.g., the Pythagorean theorem).
          *   **Certainty & Universality:** This process yields knowledge that is certain, universal, and immune to opinion or dispute. It's not based on fallible senses or shifting experience, but on the manipulation of names based on agreed significations.
      *   **The State of Other Fields (in Hobbes' View):**
          *   **Physics/Optics/Mechanics:** While Hobbes worked in these areas, he saw them as fundamentally different. They rely on sense experience and hypothetical causes. Their conclusions are *probable* (sometimes highly so) but not *demonstratively certain* like geometry. They haven't yet achieved the same level of foundational clarity and deductive rigor.
          *   **Ethics/Politics:** This is where Hobbes is *aiming*. *Leviathan* is his attempt to build a "science of politics" on geometric principles. He wants to define terms precisely (e.g., "right," "liberty," "covenant," "sovereign") and deduce the necessary conditions for peace and civil society from these definitions and the fundamental "laws of nature" (which he treats as theorems). He believed other political philosophies failed because they started with vague, undefined, or contested terms.
      *   **"Hitherto":** This word is crucial. Hobbes isn't saying geometry is the *only possible* science forever. He's saying it's the *only one so far* that has achieved this level of demonstrable certainty. *Leviathan* is his attempt to create the *second* true science: the science of politics.

  2.  **"Reckoning":**
      *   **This is NOT just a synonym for "defining terms." It's the core of Hobbes' materialist theory of mind and reason.**
      *   **Literal Meaning:** "Reckoning" means calculation, computation (like doing sums).
      *   **Hobbes' Radical Claim:** Hobbes argues that **reasoning *is* computation.** Thought is the mechanical manipulation of mental representations (which are ultimately derived from sense experience).
      *   **How it Works:**
          *   **Names are Labels:** Words (names) are labels we attach to our mental conceptions ("phantasms").
          *   **Reasoning as Addition/Subtraction:** To reason is to add names together (affirmations: "Man is rational") or subtract them (negations: "Stone is not rational") according to logical rules.
          *   **Syllogisms as Computation:** A syllogism is simply adding two premises to compute a conclusion. E.g., Premise 1 (All men are mortal) + Premise 2 (Socrates is a man) = Conclusion (Socrates is mortal).
          *   **Geometry as the Exemplar:** Geometry works perfectly because it deals with clearly defined mental constructs (figures defined by motion) and the computation (reckoning) of the necessary consequences of those definitions.
      *   **"Place them in the beginning of their reckoning":** This phrase ties it all together. Before you can start the computation (reckoning) that *is* reasoning, you *must* settle the significations (definitions) of the names you will be adding and subtracting. Without clear definitions, your computation is garbage-in-garbage-out. You get entangled in contradictions and absurdities – stuck in the birdlime.

  **The Bigger Argument You're Half-Seeing:**

  Hobbes is laying the foundation for his entire project in *Leviathan*:

  1.  **Epistemology (Theory of Knowledge):** True knowledge (science) is *only* possible through the geometric method: clear definitions followed by deductive computation (reckoning).
  2.  **Materialism & Mechanism:** The mind isn't some immaterial substance; it's a physical machine performing computations on sensory inputs represented by names.
  3.  **Linguistic Precision as the Key to Truth & Peace:** The chaos of the English Civil War (the context for *Leviathan*) was, for Hobbes, fundamentally caused by the misuse of language. Words like "justice," "freedom," and "sovereign" were used ambiguously or deceptively ("insignificant speech"), leading to confusion, ideological conflict, and ultimately violence. Just as geometry avoids error by defining terms, a stable commonwealth requires precise definitions enforced by a sovereign authority to prevent disputes and allow for clear, computable laws and obligations.
  4.  **Politics as Science:** *Leviathan* itself is an attempt to *do* for politics what Euclid did for geometry: define fundamental terms (State of Nature, Right of Nature, Law of Nature, Covenant, Sovereign, Subject, etc.) and then *deduce* the necessary structure of a commonwealth (an absolute sovereign) from those definitions and the logical consequences of human nature (primarily the desire for self-preservation and the fear of violent death).

  **In short:** Geometry is the only *existing* science because it's the only field that perfectly embodies the method of definition + deductive computation (reckoning). Hobbes believes this method is the *only* path to certain truth. His goal is to extend this method to human society, creating a "science of politics" that ends the destructive entanglements of confused language and establishes lasting peace. The "birdlime" isn't just a metaphor for intellectual error; it's a metaphor for the catastrophic political consequences of failing to "reckon" correctly, starting with clear definitions.
