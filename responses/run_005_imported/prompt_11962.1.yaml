answer: |-
  You're absolutely right to feel deeply unsettled—this situation **is ethically wrong**, even if the cold arithmetic seems defensible. Your friend's "simple math" argument relies purely on **utilitarianism** (maximizing overall good), but it ignores critical ethical principles and long-term consequences that make this decision corrosive. Here's why it's flawed:

  1.  **The Injustice is the Core Problem:** This wasn't just bad luck; it was **deliberate scapegoating.** Management chose an innocent person *precisely because* he was vulnerable (new, expendable). They knowingly punished someone who bore no responsibility to appease an angry client. This violates fundamental principles of:
      *   **Fairness & Desert:** Punishment should be linked to responsibility. He didn't deserve it.
      *   **Justice:** The outcome was achieved through a deliberate lie and an abuse of power.
      *   **Integrity:** Management lied to the client and the team about the cause and the solution. They traded truth for expediency.

  2.  **Utilitarianism's Blind Spots:** While saving 100 jobs seems like a clear net gain, utilitarianism fails here because:
      *   **Rights Violations:** It ignores individual rights. Sacrificing an innocent person against their will for the "greater good" treats them as a mere object, not a person with inherent dignity and rights (like the right not to be punished for others' failures).
      *   **The Slippery Slope:** If this becomes acceptable ("We need a sacrifice, find the most expendable"), what stops it from happening again? Who becomes the next victim? This creates a culture of fear and distrust, not stability.
      *   **The Corrosion of Trust:** Your lingering unease? That's the residue of broken trust. You now know your employer values survival *at any cost*, including sacrificing innocent employees. How can you trust them to have *your* back? How can the team trust each other if the unspoken rule is "don't be the weakest link when the axe falls"? This damages morale and psychological safety far more than the original mistake ever did.

  3.  **Management's Cowardice & Failure:** The *real* problem was the broken process and systemic failure. Management's job was to:
      *   Fix the systemic issues.
      *   Take *organizational* responsibility to the client ("Our processes failed, here's how we're fixing it to ensure it never happens again").
      *   Potentially accept the consequences (losing the client) if their failure was that severe.
      Instead, they chose the easy, dishonest, and cruel way out: pinning it on a convenient target. They avoided *their own* accountability.

  4.  **The Human Cost Beyond the Number:** Reducing it to "1 job vs. 100 jobs" ignores the profound human impact:
      *   **On the Fired Employee:** Being publicly branded as the failure for something you didn't do is devastating professionally and personally. It can derail a career and cause significant psychological harm. He didn't just lose *a* job; he was *wronged*.
      *   **On the Survivors (Like You):** You carry guilt, disillusionment, and fear. You know the "success" of saving jobs was built on a lie and an injustice. This creates moral injury – the distress from witnessing or participating in something that violates your ethical beliefs.
      *   **On the Organization's Soul:** The company demonstrated that loyalty, hard work, and innocence mean nothing if you're politically expendable. This erodes the ethical foundation of the workplace.

  **Why Your Feeling is Different Than Just "Feeling Bad":**

  You're feeling more than sympathy. You're feeling the violation of **fundamental fairness and justice.** You're recognizing the **abuse of power** by management. You're sensing the **corrosive lie** at the heart of the "solution" and the **moral injury** it inflicted on everyone involved, including yourself as a bystander forced to tacitly accept it to keep your job. It's the difference between witnessing a random accident and witnessing a deliberate, premeditated act of betrayal.

  **Your Friend's Perspective (and Why It's Incomplete):**

  Your numbers-oriented friend is applying a narrow, short-term, consequentialist lens. In a pure vacuum of *only* those two outcomes (1 fired vs. 100+ fired), the math seems obvious. However:

  1.  It ignores the *means* used to achieve the outcome (injustice, scapegoating, lying).
  2.  It ignores the *nature* of the outcome for the individual sacrificed (punishment without cause).
  3.  It ignores the *long-term consequences* for the organization's culture, trust, and ethics.
  4.  It ignores the *broader ethical principles* violated.

  **Conclusion:**

  No, your friend is not right that it "just comes down to simple math." That math is a tiny, flawed piece of a much larger ethical puzzle. Management chose a path that was:

  *   **Unjust:** Punishing the innocent.
  *   **Dishonest:** Misrepresenting the cause and solution to the client.
  *   **Cowardly:** Avoiding their own responsibility for systemic failure.
  *   **Corrosive:** Damaging trust, morale, and the ethical fabric of the workplace.

  Your unease is your moral compass correctly identifying this profound wrong. It wasn't just a "hard choice"; it was an **unethical choice** made easier by exploiting the vulnerability of a new employee. The arithmetic may have saved jobs in the short term, but the *way* it was done inflicted a deep moral wound on the organization and everyone involved. That's why it still bugs you – because it *should*. It speaks well of you that it does.
