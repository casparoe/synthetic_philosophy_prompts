  I should explain why the money pump seems to force completeness. The thought is that without a definite preference, the agent could be exploited through a series of trades. But if they adopt a policy of sticking to the status quo when options are incomparable, they avoid the pump. The debate is whether this policy is rational or if it's cheating by introducing memory of the starting point.

