  We are adjudicating the disagreement between Elena and Dmitri about the problem of old evidence in Bayesian confirmation theory, specifically regarding the perihelion of Mercury example.

  The moves:

  1. Elena presents the standard problem: old evidence (Mercury anomaly) with probability 1 cannot confirm any hypothesis because P(H|E)=P(H). She argues this is a genuine problem because in history, it was taken as strong confirmation.

  2. Dmitri offers the standard fix: drop logical omniscience. The agent wasn't certain that H entails E, so the new evidence is the logical fact that H entails E (call it T). Then we update on T, which can raise the probability of H.

  3. Elena grants that the fix avoids a formal contradiction but argues it proves too much: any theory can be "confirmed" by finding some old fact it entails. Also, it doesn't match the historical update process.

  4. Dmitri counters that the "proves too much" worry is addressed by noting that the Mercury case was impressive because it required no tuning of parameters. Build that into the account (by considering the surprise of the entailment under a rival catch-all) and the account survives. He also dismisses the historical process as irrelevant.

  We will score each move from -2 (clearly mistaken) to 2 (clearly right) and then justify.

  My verdict:

  Move 1: Elena is correct that the problem is genuine. The standard Bayesian account seems to have a problem with old evidence. Score: 2

  Move 2: Dmitri's fix is a standard and reasonable one in the literature. It does avoid the formal problem. Score: 2

  Move 3: Elena's objection that it "proves too much" is a known criticism and has some force. Also, the mismatch with the historical update process is a valid point. However, the criticism about proving too much can be addressed (as Dmitri does in move 4) and the historical process point is less central. So, while not entirely wrong, it is not clearly right either. We'll give it a 1.

  Move 4: Dmitri's response to the "proves too much" by invoking the lack of tuning (i.e., the theory is not ad hoc) is a good point. However, he dismisses the historical process too quickly. Bayesian confirmation theory is normative, but it should ideally capture why the Mercury case was convincing. Also, the catch-all rival is vague. So, partially right but with some weakness. Score: 1

  But let's break it down more precisely.

  Detailed Justification:

  Move 1 (Elena): She is clearly right that the problem exists. The Bayesian framework, as usually presented, has a problem with old evidence. The Mercury case is a classic example. Score: 2

  Move 2 (Dmitri): The logical omniscience fix is a well-established solution in the literature (e.g., by Garber, Jeffrey, etc.). It does dissolve the formal paradox. Score: 2

  Move 3 (Elena): The objection that the fix proves too much is a valid concern. If we can just go hunting for any entailment, then any theory could be confirmed arbitrarily by deriving known truths. This is called the "problem of irrelevant conjunctions" or more generally the problem of "weak" evidence. Also, the historical process point is important: scientists didn't update on a logical proposition in the way a Bayesian agent would. However, the first part (proving too much) is a deeper issue and is not fully resolved by Dmitri in move 4 (we'll see). So, we give this a 1 (partially right, but not entirely because the issue can be mitigated).

  But note: the problem of proving too much is a real challenge. Without constraints, the account might allow arbitrary confirmation. So Elena has a point. But it's not fatal because there are ways to address it (which Dmitri attempts). Hence, we don't give a 2 but a 1.

  Move 4 (Dmitri): He addresses the proving too much by noting the lack of tuning (no free parameters). This is a good point and captures why the Mercury case was impressive. However, building that condition into a Bayesian account is non-trivial. The idea is that the evidence is more surprising under the rival theories because they had to be tuned. But the catch-all rival is vague. Moreover, his dismissal of the historical update process is too quick. While Bayesianism is normative, it should ideally be descriptively adequate in broad strokes. The historical account matters because the Mercury case was a real event of confirmation. So, the move is partially right (hence 1) but not entirely.

  Finally, is there an important consideration neither raised?

  Yes: one important point is that the logical entailment T (that H entails E) is not a contingent empirical fact but a logical one. Some Bayesians (like Howson) have argued that conditionalization on logical truths is problematic because logical truths should have probability 1 from the start. The fix by Garber and others avoids this by allowing that the agent doesn't know the logical truth, but then the update on a logical truth is non-standard. This leads to a debate about "logical learning". Also, there are alternative solutions, such as Jeffrey conditionalization or counterfactual approaches (what would the agent's credence have been if they didn't know E?).

