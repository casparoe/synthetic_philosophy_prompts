answer: |-
  This is a brilliant analogy – your burrito battle perfectly encapsulates the textualism vs. purposivism debate, and its implications for small-group governance are surprisingly profound. Let's break it down:

  **Core Implications for Small Group Rules:**

  1.  **Accessibility of Intent Changes the Game (The Scalia Objection):**
      *   **Scalia's Point (Legislatures):** In large, complex legislatures with diverse members, committees, amendments, and political compromises, pinpointing a single, coherent "legislative intent" is often impossible or fictional. Textualism (focusing *only* on the words) avoids this quagmire.
      *   **Small Group Reality:** Your "legislature" is accessible! You *can* ask the rule-writers (or the group chat participants who voted) what they meant. This makes purposivism **far more viable and less fictional** than in large-scale lawmaking.
      *   **Implication:** For small groups, **purposivism should often be the *starting point***. When ambiguity arises, *ask*: "What problem were we trying to solve? What behavior were we trying to encourage/discourage?" The original purpose is usually knowable and relevant. Ignoring it when you *can* ask is willful blindness.

  2.  **The Perils of Strict Textualism (Goodharting & Gaming):**
      *   **Goodhart's Law:** "When a measure becomes a target, it ceases to be a good measure." Strict textualism invites this. If the rule *only* cares about the specific words ("cooks"), people will optimize for the *word*, not the underlying *goal* (sharing meal prep labor).
      *   **The Burrito Gambit:** Microwaving a pre-made burrito technically involves applying heat ("cooking" in a dictionary sense), but it requires near-zero effort compared to preparing a meal from scratch. Claiming it exempts you from dishes is gaming the rule against its obvious spirit – classic Goodharting.
      *   **Implication:** Strict textualism without reference to purpose **encourages rule exploitation and undermines group trust and fairness**. It prioritizes cleverness over cooperation.

  3.  **The Absurdity Doctrine: Purposivism's Trojan Horse?**
      *   **The Doctrine:** Even textualists admit that if applying the literal text leads to an absurd or nonsensical result completely at odds with the law's purpose, an exception *must* be made. Scalia begrudgingly accepted this.
      *   **Is it Smuggling?** **Yes, absolutely.** The absurdity doctrine *is* purposivism in disguise. You can't identify an "absurd" result without implicitly referencing the rule's *intended purpose*. What's absurd is defined by what the rule was *meant* to achieve.
      *   **The Burrito Absurdity:** Applying the "cooks = no dishes" rule to microwaving a frozen burrito *is* arguably absurd. It trivializes the effort the rule was meant to recognize and share. It turns "cooking" into a loophole rather than a contribution. (Your housemate is likely taking a hyper-literal textualist view: "Heat applied = cooking. Rule says cooking. QED.")
      *   **Implication:** **The absurdity doctrine is a necessary safety valve precisely *because* pure textualism fails.** For small groups, acknowledging this upfront is healthier than pretending you're being purely textualist. If a literal reading creates a result that *obviously* defeats the rule's point, the purpose must prevail.

  **Practical Guidance for Small Group Rulemaking & Interpretation:**

  1.  **Draft with Purpose Explicit:** When writing a rule, **state its purpose clearly** upfront. E.g., "Rule: Whoever prepares a *significant meal effort* requiring substantial preparation or cooking from basic ingredients is exempt from dish duty that night. *Purpose: To fairly distribute the labor involved in providing substantial meals for the house.*" This anchors interpretation.
  2.  **Embrace "Knowable Purpose":** When interpreting ambiguous rules, **make asking about the original intent/purpose the first step.** "Hey, when we made the 'cooks = no dishes' rule, what kinds of activity did we *mean* to cover? Was reheating frozen pizza or a burrito supposed to count?"
  3.  **Beware the Letter-of-the-Law Gamer:** Recognize that strict textualism enables Goodharting. If someone consistently exploits loopholes against the obvious spirit (like claiming microwaving counts as "cooking"), address it as a **behavioral issue** (undermining cooperation) rather than just an interpretive one. The group needs to decide if it tolerates that behavior.
  4.  **Use Examples (But Wisely):** Include non-exhaustive examples in rules. "Cooking includes: making pasta from scratch, stir-frying vegetables, baking a casserole. Cooking does *not* include: reheating leftovers, making toast, microwaving a pre-made frozen meal." This provides textual hooks *and* signals purpose. Caveat: Examples can become new targets for gaming ("But you didn't list *my* specific frozen dinner!").
  5.  **Formalize the Absurdity Valve:** Acknowledge that purely literal readings leading to results that **clearly and severely undermine the stated purpose** of the rule are invalid. Build in a mechanism (e.g., a quick majority vote) to override such interpretations, explicitly citing the purpose and the absurdity.
  6.  **Review and Revise:** Small group contexts change. Revisit rules periodically. If "microwaving burritos" becomes a contentious issue, amend the rule! "Cooking means preparing a meal requiring at least 15 minutes of active preparation time" or "Exemption applies only to meals serving at least half the house members."

  **Conclusion & The Burrito Verdict:**

  Scalia's objection to the fiction of legislative intent **loses significant force** in a small group where intent is knowable. Purposivism becomes a practical and fair first resort. The absurdity doctrine **is indeed purposivism smuggled in**, but it's a necessary admission that pure textualism fails when faced with results that blatantly contradict a rule's reason for existing.

  Regarding the burrito: Under a purposive reading (sharing significant meal prep effort), microwaving a frozen burrito almost certainly **does not count** as "cooking" for dish duty exemption. Claiming it does is textbook Goodharting – optimizing the letter to defeat the spirit. The absurdity doctrine is a perfectly valid tool to reject this interpretation. Your instinct is legally and cooperatively sound! The real challenge is getting your housemate to see that cooperation based on shared purpose matters more than winning a semantic debate – that's the small-group governance lesson legal theory can't fully teach. Good luck!
