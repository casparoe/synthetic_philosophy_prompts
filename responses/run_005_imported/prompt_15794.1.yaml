  I should address their bonus question about Goodhart's law too. Gaming rules by following the letter but violating the spirit is exactly what happens when incentives are misaligned. The burrito debacle perfectly illustrates this: if microwaving counts as "cooking," someone could "cook" by reheating leftovers to avoid dishes.

  The user's deeper need seems to be conflict prevention. They want rules that don't require Supreme Court hearings over frozen snacks. So the real solution might be designing rules with both precision and purpose in mind from the start - perhaps with explicit examples of what "cooking" includes.

