  The stalemate should feel inevitable: K prioritizes the internal structure of assertion (you can’t genuinely assert what you don’t know), while R prioritizes social function (assertions must transmit reliable info, even via non-believers). By the end, they might agree the norms serve different purposes—K’s for ideal assertion, R’s for real-world practice—but that’s exactly where philosophy can’t resolve it. 

