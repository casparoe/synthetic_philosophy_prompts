  I should avoid making either K or R caricatures. K needs to sound like someone who genuinely finds the knowledge norm constitutive of assertion, not just dogmatic. R should defend Lackey’s intuition without ignoring the lottery problem. The lottery case must feel pressing for R, and Stella’s case must challenge K’s core principles. 

  For K’s defense: The "blameless violation" move is key. K should grant Stella’s propriety but frame it as excusable rule-breaking, like a conscientious objector violating a law. But then R should push back hard—if the norm is constantly "blamelessly violated" in socially vital cases, is it really the norm? That’s where Moorean tension ("I assert p but I don’t know p") could surface: K might argue Stella’s assertion feels Moore-paradoxical if scrutinized, while R would dismiss that as theoretical baggage. 

