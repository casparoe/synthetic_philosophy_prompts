  - **Comparative Canonization**: Neither addresses why similar tensions (e.g., Heidegger’s Nazism) reshape readings while others (e.g., Wittgenstein’s flaws) don’t. This suggests disciplinary norms—not just textual evidence—determine "relevance."  
