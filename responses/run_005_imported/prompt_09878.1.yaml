  ## The Frank Ramsey Wedding Speech for Dan & Priya

  [Raise glass, warm smile to the crowd, then focus on Dan & Priya]

  Hi everyone. For those who don’t know me, I’m [Your Name], Dan’s sibling. And Dan… well, Dan has always been a thinker. A deep thinker. The kind who, at 1 am, might find himself contemplating the vast, indifferent coldness of the universe, the sheer improbability of existence, and the ultimate heat death of everything. You know, light bedtime reading. [*Gentle chuckle, glance at Dan who likely nods wryly*]

  A few months ago, he was telling me about something called Ramsey numbers – something to do with parties of six people guaranteeing three mutual friends or three strangers. Sounded complicated. So, naturally, I went down an internet rabbit hole. Not about the math, though. I ended up learning about the *guy* it was named after: Frank Ramsey.

  Frank Ramsey was a Cambridge genius in the 1920s – philosopher, mathematician, economist. He basically invented whole fields before breakfast and tragically died at 26. But in his short life, he wrote this essay called "Epilogue." And near the end, he tackles that feeling Dan sometimes wrestles with – the feeling of being tiny and insignificant in this enormous, uncaring cosmos.

  Ramsey’s response? He basically said, "Nonsense." He refused to be humbled just because the universe is physically vast. Stars, he pointed out, are spectacular, sure, but they can’t *think*. They can’t *love*. They don’t laugh at terrible jokes or get nervous before proposing. So why should their sheer *size* intimidate us? He said his "picture of the world" wasn't drawn to scale. It was drawn in *perspective*. In his picture, the people right in front of him – his friends, his family, the people he loved – they were huge, filling the foreground. And the distant, unimaginably vast stars? He shrunk them down. Way down. To about the size of an old coin. A "threepenny bit," he called it.

  [*Pause, look directly at Dan & Priya*]

  Dan, I think that image is perfect. Because it’s not about the universe arranging things or writing our destinies in the stars. Frankly, the universe doesn’t care. Ramsey’s point is the *opposite* of that. It’s that *we* care. *We* matter. *Our* feelings, *our* connections, *our* love – right here, right now, in the foreground – that’s what’s truly immense. That’s what deserves to fill the frame. The stars? They’re just tiny, distant coins. Beautiful, maybe, but utterly irrelevant to the warmth and importance of the people right beside us.

  And here’s the kicker – Ramsey was also a serious economist. So, later in that *same* passage, he applies the same logic to *time*. Yeah, sure, he says, eventually the universe might run down. Everything might end. But that’s so incredibly far away… that its "present value at compound discount" is basically zero. [*Pause for the finance folks to chuckle, maybe a knowing nod from a few*] It’s an economist’s deadpan punchline to cosmic dread. The ultimate "not my problem right now."

  Now, hilariously, just a few years later, in a very serious paper, Ramsey called that kind of discounting of the future "ethically indefensible"! I guess even geniuses contain multitudes… or maybe just a healthy dose of practicality when faced with oblivion. The point is, whether it’s space *or* time, Ramsey argued we shouldn’t let the distant, the abstract, the unimaginably large or far-off, diminish the profound reality of the human present.

  [*Turn fully to Priya*]

  Priya, this is why you are Dan’s perfect counterpoint. You didn’t need to read Frank Ramsey. You *live* this. Because Dan, with his brilliant, sometimes spiraling mind, needs someone who instinctively knows how to draw the picture in perspective. When the vastness feels overwhelming, you are the one who gently, firmly, brings him back. You don’t argue with the science or the scale; you simply remind him, through your love, your presence, your unwavering belief in *this* moment, that *right here* is what’s huge. *Right now* is what matters. "Ok, but right now, this, us, is good." You are the living embodiment of bringing the foreground into focus. You make the stars shrink back to coin-size, just by being you.

  Dan, you found someone who understands, without needing the philosophical treatise, that love isn't diminished by the scale of the universe; it’s *defined* by its defiance of it. In the grand, indifferent sweep of space and time, you two have chosen to make *each other* the center of your picture. You’ve chosen to fill your foreground with this incredible partnership.

  That’s not fate written in the stars. That’s *better*. That’s a conscious, daily choice you both make. It’s choosing to see the immensity in each other’s eyes, in a shared laugh, in a quiet moment, rather than being dwarfed by the cosmic backdrop. It’s recognizing that the warmth of this room, the love of this family and these friends, the promise you’re making today – *this* is what’s truly vast. *This* is what deserves to be drawn large.

  So, let’s not raise a glass to the distant stars or some abstract cosmic plan. Let’s raise it to Dan and Priya. To your brilliant, sometimes-spiraling minds and your beautifully grounded hearts. To your choice to make each other, and this love, the huge, vibrant, undeniable center of your world. To drawing your picture in perfect perspective.

  To Dan and Priya!

  **Word Count:** Approx. 680 words (delivery speed will adjust timing).  
  **Tone Notes:** Warm, heartfelt, with intellectual hooks but accessible emotion. Uses humor (Dan's spirals, Ramsey's discounting quip) to ground the philosophy. Avoids clichés ("soulmates," "written in the stars") by flipping the script. The "compound discount" line is a subtle insider nod that won't derail the flow for others.  
  **Why it Works:** For Dan's friends, the Ramsey references are clear and meaningful. For the great-aunts, the core message – "your love is huge and what matters most, right here and now" – is universal and emotionally resonant. Priya is beautifully centered as the practical, loving anchor. The ending focuses purely on their choice and love.
