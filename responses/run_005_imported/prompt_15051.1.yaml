  Then, Predd et al.'s 2009 paper comes in. They used Bregman divergences, linking strictly proper scoring rules to convex functions. Their theorem shows that strict propriety ensures coherent credences aren't dominated. This geometric approach solidified strict propriety as the key. The user wants to know if this is settled. While strict propriety is standard, debates remain on whether it's necessary. Alternatives like Leitgeb and Pettigrew's arguments for squared Euclidean distance exist, but strict propriety is widely accepted.

  The user's deeper need is understanding why the choice of measure matters philosophically. They might be seeking assurance that Bayesianism's foundations are robust. They also mentioned the Dutch Book argument feeling "mercenary," so they care about epistemic justification. Clarifying how strict propriety avoids the pitfalls of absolute distance and Joyce's initial axioms addresses their concern about the argument's sensitivity.

  I should structure the response: start with absolute distance failure, then Joyce's axioms and Maher's counterexample, move to Predd et al.'s solution, and end with current consensus. Make sure to explain the examples clearly, as the user's reading group struggled. Highlight the geometric insight and why strict propriety is compelling. Address any remaining disagreements without overcomplicating. Keep the focus on epistemic utility theory's resolution while acknowledging open questions.
answer: |-
  That's an excellent deep dive into one of the most important arguments in formal epistemology! You've grasped the core tension perfectly: Joyce's accuracy-dominance argument promises a purely epistemic foundation for probabilism (coherent credences), but its success hinges *entirely* on choosing the "right" measure of inaccuracy. Let's break down why it's so sensitive, why absolute distance fails, what went wrong with Joyce's original axioms, and how strict propriety became the standard fix.

  **1. The Core Argument & Why Measure Matters:**
  *   **Goal:** Show that incoherent credence functions (violating probability axioms) are *epistemically defective* because they are *accuracy-dominated* by some coherent function.
  *   **Accuracy-Domination:** A credence function **b** accuracy-dominates **c** if, for *every possible state of the world* (every assignment of 1s and 0s to propositions), **b** is at least as accurate as **c**, and for *at least one state*, **b** is strictly more accurate than **c**.
  *   **Joyce's Desired Result:** For *any* incoherent **c**, there exists *some* coherent **b** that accuracy-dominates **c**.
  *   **The Sensitivity:** The definition of "accuracy" (and thus "domination") depends entirely on the **scoring rule** (inaccuracy measure) `S(c, w)` used, where `c` is the credence function and `w` is the actual world (truth values). Different `S` define different notions of "distance from truth." The domination result *only holds* for a specific class of scoring rules.

  **2. Why Absolute Distance Fails Spectacularly:**
  *   **The Measure:** For a single proposition `A`, Absolute Distance (L1 norm) inaccuracy is:
      *   `S_abs(c(A), w(A)) = |c(A) - w(A)|`
      *   If `A` is true (`w(A)=1`), inaccuracy = `|c(A) - 1| = 1 - c(A)`
      *   If `A` is false (`w(A)=0`), inaccuracy = `|c(A) - 0| = c(A)`
  *   **The Problem - Lack of Convexity & Dominance Failure:** Absolute distance lacks the necessary convexity properties. Crucially, **coherent credences are NOT guaranteed to avoid dominance under S_abs.** In fact:
      *   **Incoherent credences can be UNDOMINATED.** Consider a simple partition: Two mutually exclusive, exhaustive propositions `A` and `~A` (e.g., Heads and Tails). Suppose an agent holds an *incoherent* credence: `c(A) = 0.4`, `c(~A) = 0.4`. Total inaccuracy `S_abs(c, w) = |0.4 - w(A)| + |0.4 - w(~A)|`.
          *   World `w1` (A true): `|0.4-1| + |0.4-0| = 0.6 + 0.4 = 1.0`
          *   World `w2` (A false): `|0.4-0| + |0.4-1| = 0.4 + 0.6 = 1.0`
      *   **Is there a coherent credence `b` that dominates `c`?** Coherent credences satisfy `b(A) + b(~A) = 1`.
          *   Consider `b(A)=0.5`, `b(~A)=0.5`:
              *   `w1`: `|0.5-1| + |0.5-0| = 0.5 + 0.5 = 1.0` (equal to `c`)
              *   `w2`: `|0.5-0| + |0.5-1| = 0.5 + 0.5 = 1.0` (equal to `c`)
              *   Not strictly better anywhere -> no domination.
          *   Consider `b(A)=0.6`, `b(~A)=0.4`:
              *   `w1`: `|0.6-1| + |0.4-0| = 0.4 + 0.4 = 0.8` (better than `c`'s 1.0)
              *   `w2`: `|0.6-0| + |0.4-1| = 0.6 + 0.6 = 1.2` (worse than `c`'s 1.0)
              *   Worse in `w2` -> no domination.
          *   Consider `b(A)=0.3`, `b(~A)=0.7`:
              *   `w1`: `|0.3-1| + |0.7-0| = 0.7 + 0.7 = 1.4` (worse)
              *   `w2`: `|0.3-0| + |0.7-1| = 0.3 + 0.3 = 0.6` (better)
              *   Worse in `w1` -> no domination.
      *   **Conclusion:** The incoherent `c(A)=0.4, c(~A)=0.4` is **NOT accuracy-dominated** by any coherent credence function under the absolute distance measure. In fact, it's on the "efficient frontier" for this scoring rule – you can't find a coherent point that is never worse and sometimes better. This completely undermines the argument that incoherence is inherently accuracy-defective under *this* measure.

  **3. Joyce's 1998 Axioms and Maher's Counterexample:**
  *   **Joyce's (1998) Axioms for a "Reasonable" Inaccuracy Measure (S):**
      1.  **Normality:** `S(c, w)` depends only on the values `c(X)` assigns to the propositions `X` true/false in `w`.
      2.  **Availability of Truth:** For each world `w`, there is an ideal credence function `v_w` (assigning 1 to all truths, 0 to all falsehoods in `w`) such that `S(v_w, w) = 0` and `S(c, w) > 0` for any `c ≠ v_w`. (Truth is uniquely best).
      3.  **Weak Convexity:** If `c` and `c'` are equally inaccurate at `w`, then any "mixture" `d = λc + (1-λ)c'` (for `0 < λ < 1`) is at least as inaccurate as `c`/`c'` at `w`, and strictly more inaccurate unless `c = c'`.
      4.  **Symmetry:** Inaccuracy depends only on the *values* of credences and truth-values, not on *which* propositions they are assigned to (i.e., relabeling propositions doesn't change inaccuracy scores for equivalent assignments).
  *   **The Hope:** These seemed intuitively plausible and designed to ensure that incoherent credences would be accuracy-dominated.
  *   **Maher's (2002) Counterexample:** Patrick Maher constructed a scoring rule satisfying all four of Joyce's 1998 axioms, yet **failed to deliver the domination result.** His rule was essentially a "mixed" rule:
      *   For a single proposition: `S_mix(c, 1) = (1 - c)^2` (Quadratic if true)
      *   `S_mix(c, 0) = -k * ln(c)` (Logarithmic if false, with `k>0` chosen carefully)
      *   **Why it satisfied Joyce's axioms:**
          *   **Normality:** Yes.
          *   **Availability of Truth:** `S_mix(1,1)=0`, `S_mix(0,0)= -k*ln(0+) -> +∞` (needs careful definition at 0, but can be made to satisfy). Truth is best.
          *   **Weak Convexity:** The quadratic part is convex, the logarithmic part is convex. Mixtures are handled.
          *   **Symmetry:** Yes, it only cares about the credence value and truth value.
      *   **Why it Failed the Domination Result:** Maher showed that under `S_mix`, there existed **incoherent credence functions that were NOT accuracy-dominated by any coherent function.** The specific flaw was related to how the rule behaved near extreme probabilities (0 and 1). While Joyce's axioms ensured truth was best and encouraged "averaging" (convexity), they **did not guarantee that coherent credences were the *only* ones that could be *optimal* under *some* world.** Maher's rule allowed incoherent credences to be "locally optimal" in a way that prevented any single coherent function from dominating them globally across all worlds. The key missing ingredient was **Strict Propriety**.

  **4. The Fix: Strict Propriety and the Geometric Argument (Predd et al., 2009)**
  *   **Strict Propriety:** A scoring rule `S` is **strictly proper** if, for any probability function `p` and any alternative credence function `c ≠ p`, the *expected inaccuracy* of `p` relative to `p` is *strictly less* than the expected inaccuracy of `c` relative to `p`:
      `Σ_w p(w) * S(p, w) < Σ_w p(w) * S(c, w)` for all `c ≠ p`
      In other words: **A probabilistic agent expects their own credences to be uniquely least inaccurate.** Adopting any other credence function would look *worse* in expectation *by their own lights*.
  *   **Why it Fixes the Problem:** Strict Propriety forces the inaccuracy measure to be tightly coupled with the structure of probability itself. It guarantees that probabilistic credences are the unique global minima of expected inaccuracy relative to *any* probabilistic perspective.
  *   **Predd et al.'s (2009) Geometric Argument:** This paper provided a powerful and general characterization:
      1.  **Bregman Divergences:** They showed that strictly proper scoring rules (for finite partitions) correspond exactly to **Bregman divergences**. A Bregman divergence `D_φ(c, v)` measures the difference between a point `c` and a point `v` using a strictly convex function `φ` and its tangent at `v`. Common examples:
          *   Squared Euclidean Distance (`φ(x) = x²`): `D_φ(c, v) = (c - v)^2`
          *   Generalized Kullback-Leibler Divergence (`φ(x) = x log x`): `D_φ(c, v) = c log(c/v) - (c - v)` (related to log scoring).
      2.  **The Domination Theorem:** Predd et al. proved the fundamental result: **A credence function `c` defined on a finite partition is coherent (probabilistically consistent) *if and only if* it is *not* accuracy-dominated relative to *any* Bregman divergence (i.e., any strictly proper scoring rule).**
      3.  **The Geometric Insight:** The set of coherent credence functions forms a **simplex** (e.g., a line segment for 2 propositions, a triangle for 3). The Bregman divergence `D_φ(c, v_w)` (where `v_w` is the "truth vertex" for world `w`) defines a kind of directed distance. Crucially, because `φ` is strictly convex:
          *   The truth vertex `v_w` is the unique minimum of `D_φ(·, v_w)`.
          *   The simplex of coherent credences is **convex**.
          *   **If `c` is *incoherent* (lies outside the simplex), the convexity of the simplex and the strict convexity of `D_φ` guarantee that there exists a point `b` *on* the simplex (a coherent credence function) such that `D_φ(b, v_w) < D_φ(c, v_w)` for *every* possible world `v_w`.** This `b` is often the projection of `c` onto the simplex under the divergence. The geometric properties enforced by strict propriety (via Bregman divergences) make dominance inevitable for incoherent points.

  **5. Is Strict Propriety the Settled Consensus?**

  *   **Dominance Arguments:** For the **accuracy-domination argument for probabilism**, strict propriety (via the Bregman divergence characterization) is **absolutely the settled consensus** as the necessary and sufficient condition. Predd et al.'s result is considered definitive in this context. Joyce fully embraced this in his later work.
  *   **Legitimacy of Scoring Rules:** There is **still live discussion** about whether strict propriety is *necessary* for a scoring rule to be a "legitimate" measure of *pure epistemic accuracy*, beyond its role in securing the domination argument. The debate centers on philosophical justification:
      *   **Pro-Strict Propriety:** Proponents (like Pettigrew) argue that epistemic rationality *requires* an agent to find their own beliefs optimal *by their own lights*. Avoiding dominated options isn't enough; coherence should also be *attractive*. Strict propriety captures this internalist requirement of epistemic self-trust. It's also seen as necessary for extensions (e.g., justifying conditionalization via minimizing *expected* inaccuracy).
      *   **Con/Alternative Views:** Critics argue:
          *   Strict propriety might be too strong *solely* for defining accuracy. Maybe the core intuition is just that truth is best (Joyce's Availability) and falsehood is worse (which weaker rules satisfy). Domination might be sufficient for epistemic defectiveness, even if coherence isn't uniquely attractive.
          *   Leitgeb and Pettigrew (2010) gave an argument *specifically* for the **Brier Score** (squared Euclidean distance) based on avoiding "domination *and* expectation domination" without presupposing propriety, though it still ends up requiring a quadratic form.
          *   Some explore whether other constraints (e.g., based on information or calibration) could justify different rules or weaken requirements.
  *   **Current Status:** While strict propriety is the *standard* requirement within epistemic utility theory, particularly for dominance arguments and extensions like the Principal Principle or Conditionalization, **the philosophical justification for *why* it's the right constraint for measuring *pure accuracy* (beyond securing the desired mathematical results) remains an active area of discussion.** The Brier Score remains exceptionally popular due to its simplicity and unique properties (like being strictly proper and local). The Logarithmic Score is also fundamental due to its deep connections with information theory.

  **In Summary:**

  1.  **Sensitivity:** The domination argument requires the inaccuracy measure to strongly penalize "spread" in a way aligned with probability. Absolute distance lacks the necessary convexity.
  2.  **Absolute Distance Failure:** It allows incoherent credences to be undominated, failing to show they are defective.
  3.  **Joyce's 1998 Axioms Flaw:** They ensured truth was best and encouraged averaging but failed to ensure that *only* coherent credences could be optimal *somewhere*. Maher's mixed rule satisfied the axioms but still allowed undominated incoherent credences.
  4.  **The Fix - Strict Propriety:** Guarantees probabilistic credences are uniquely optimal *in expectation* from any probabilistic perspective. Predd et al. showed strictly proper rules correspond to Bregman divergences and proved the crucial theorem: coherence = non-dominated for any such rule (and vice-versa).
  5.  **Consensus:** Strict propriety is settled as *the* condition for the dominance argument to work. Its status as the *sole* necessary requirement for a "legitimate" measure of pure accuracy is widely accepted but still subject to philosophical debate about its justification. The geometric (Bregman divergence) framework is fundamental.

  This journey highlights how a compelling philosophical argument (coherence as avoiding accuracy-domination) required deep mathematical investigation (convex analysis, Bregman divergences) to be made precise and defensible. The sensitivity isn't a bug; it reveals the profound connection between probabilistic coherence and the geometric structure of accuracy measurement defined by strictly proper scoring rules.
