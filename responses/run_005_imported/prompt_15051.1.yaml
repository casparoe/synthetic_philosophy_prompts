  First, I need to recall the core of Joyce's argument. Accuracy dominance means that incoherent credences are always outperformed by some coherent one in terms of accuracy, no matter the world state. The user mentioned that absolute distance doesn't work here, so I should explain why. Absolute distance is linear, but coherence is tied to convexity. For incoherent credences, the coherent "fix" might not dominate under absolute distance. The example with credences (0.4, 0.4) for a partition shows this—no coherent point dominates it in all worlds. That's crucial.

