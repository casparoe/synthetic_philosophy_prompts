  The regress: If a relation R holds between a and b, we seem to need a further relation to tie R to a and b, and then another, ad infinitum.

  The seven responses:

  1. Bradley's own move: Deny relations are real; embrace the Absolute (monism).
  2. Frege's unsaturated concepts: Concepts are inherently gappy and thus combine without glue.
  3. Early Russell's distinction: Relation as relating vs. as an abstract term.
  4. Armstrong's states of affairs as fundamental: Instantiation as a non-relational tie.
  5. Bergmann's nexus: Exemplification as sui generis and not needing connection.
  6. Deflationary: No substantive explanation needed for unity.
  7. Benign regress: Infinite series is harmless because each step is entailed without new ontology.

