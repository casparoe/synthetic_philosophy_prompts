  For the recommendation, a modified yes seems wisest: accept all 900 but stretch the timeline. Propose 24-30 months with explicit benchmarks (ESL staffing, school resources). This:
  - Honors the refugees' urgency while acknowledging capacity limits
  - Uses Dummett's framework to legitimize pacing concerns
