  Therefore, ¬R∨W is not a consequence of Theory 2. In fact, Theory 2 entails the negation of ¬R∨W (which is R∧¬W, which is exactly Theory 2). 

  So the truth-content of Theory 1 includes ¬R∨W, which is true. But Theory 2 does not have this consequence. Therefore, the truth-content of Theory 2 is not a superset of that of Theory 1.

  Moreover, what about the true consequence R of Theory 2? Is R in the truth-content of Theory 1? 
     Theory 1: ¬R ∧ ¬W entails ¬R, and also entails R→false? It does not entail R. In fact, it entails the negation of R. So R is not a consequence of Theory 1.

  Hence, the truth-contents are not comparable by set inclusion in a way that would make one a superset of the other.

  But wait, this does not immediately show that Popper's definition fails. We need to see if Theory 2 has more verisimilitude than Theory 1 by Popper's definition. The definition requires:

     (a) The truth-content of Theory 2 must be greater than that of Theory 1 (i.e., every true consequence of Theory 1 is also a consequence of Theory 2, and there is a true consequence of Theory 2 that is not a consequence of Theory 1) 
