  Popper's definition requires that the truth-content of the better theory must be a superset of the truth-content of the worse, and the falsity-content of the worse must be a superset of the falsity-content of the better.

  But Miller and Tichý showed that for any two false theories, if the truth-content of one is a superset of the other, then the falsity-content will also be a superset. Hence, the conditions (a) and (b) cannot be simultaneously satisfied.

  In our example:

  Is the truth-content of Theory 2 a superset of the truth-content of Theory 1?

