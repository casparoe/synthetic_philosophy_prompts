  Actual state: R (rain) and W (wind) are both true.

  Theory 1: ¬R ∧ ¬W   (neither rain nor wind)

  Theory 2: R ∧ ¬W    (rain but no wind)

  Now, Theory 1 is completely false because both R and W are true. Theory 2 is partially true: it gets R right (rain is present) but W wrong (wind is present in reality but the theory says no wind).

  Intuitively, Theory 2 is closer to the truth than Theory 1 because it correctly predicts the rain and only misses the wind. Theory 1 misses both.

  But note: according to Popper's definition, we compare the truth-content and falsity-content.

  Popper's qualitative definition of verisimilitude:

  Theory A has more verisimilitude than theory B if and only if:
     (a) the truth-content of A is greater than that of B, and 
     (b) the falsity-content of B is at least as great as that of A (or equivalently, the falsity-content of A is not greater than that of B).

  But note: Popper's definition uses the set of true consequences and false consequences. We have to be cautious because the consequence class is infinite. However, we can work with the logical content in a propositional setting.

