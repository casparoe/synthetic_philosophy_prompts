  Falsity-content: the set of false logical consequences of T.

  But note: Popper requires that we compare the contents. However, the definition is set up so that we require that the truth-content of the better theory is a superset of that of the worse, and the falsity-content of the worse theory is a superset of that of the better? Actually, the original definition is more about the measures (cardinality or set inclusion) but Popper's own account was qualitative and set-theoretic.

