    R ∨ ¬W: true (because R is true).
    R ∨ W: true (entailed by R).

  But note: R is a true consequence of Theory 2. Also, R ∨ W is true. However, ¬W is false.

  Now, let's compare the truth-content and falsity-content.

  For Theory 1 (¬R ∧ ¬W):

