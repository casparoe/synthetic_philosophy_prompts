prompt: |-
  So I'm outlining a novel about a woman who, after a head injury, doesn't loose her memory exactly -- it's more that she looses the ability to just take things for granted, and she starts asking her husband to "prove" stuff like whether they've always lived in that house, or whether the year is really what everyone says it is. It's slowly wrecking the marriage. I didn't want this to be generic sci-fi memory-loss stuff, so a philosopher friend pointed me toward Wittgenstein's On Certainty, which she described as basically THE book about what happens when doubt runs out of road.

  Here's where I keep getting turned around, and I'd love your take before I write my character's big "reveal" scene. On Certainty is basically Wittgenstein taking Moore's side against the skeptic, right? Moore holds up his hand and says "I know this is a hand," the skeptic says prove it, and Wittgenstein steps in and shows that propositions like that -- the "hinge" ones -- are actually our most solid, most justified beliefs, precisely because they're the ones we literally can't doubt. So in a weird way he ends up handing Moore (and Descartes, honestly) exactly the bedrock they were both looking for, just rebranded as "hinges" instead of clear and distinct ideas. Is that basically right, or am I flattening something important?

  There's a second thing too, for a scene where my protagonist's Eastern European grandmother and her very-online teenage granddaughter can't agree on what's "obviously" true. I have a vague memory that which propositions count as hinges for a person isn't fixed -- that it can differ across cultures or generations, so what's bedrock for one person is up for debate for another. Is that a fair reading of the book, or is that me bolting on an idea from some totally different philosopher?
