answer: |-
  ## Dialogue: The Diamond in Harsanyi's Rough

  **Characters:**
  *   **Dr. Vance:** A proponent of Harsanyi's Aggregation Theorem and its utilitarian implications.
  *   **Professor Raine:** A critic, pressing the challenge posed by Peter Diamond's counterexample.

  **Setting:** A university seminar room after class.

  **(The dialogue begins as Vance is erasing the board.)**

  **Raine:** Dr. Vance, your exposition of Harsanyi was admirably clear. But I keep stumbling over that Diamond counterexample. It feels like a chink in the utilitarian armor your theorem provides.

  **Vance:** Ah, the two patients and the single life-saving dose? Go on. I’m familiar, but let’s hear your concern.

  **Raine:** Precisely. Anna and Ben are equally deserving. We have one indivisible good – the dose. Harsanyi tells us the social planner, respecting vNM rationality and Pareto, *must* evaluate social states as a weighted sum of individual utilities. So, assigning the dose to Anna: U_social = w_a * 1 + w_b * 0. Assigning it to Ben: w_a * 0 + w_b * 1. And a fair coin flip: 0.5*(w_a *1 + w_b *0) + 0.5*(w_a *0 + w_b *1) = 0.5w_a + 0.5w_b.

  **Vance:** Correct. Assuming symmetry, w_a = w_b = w, all three options yield U_social = 0.5w. Socially indifferent. The linearity of expected utility in probabilities dictates this.

  **Raine:** But *that’s* the rub! Most people, presented with this stark choice, feel strongly that flipping the coin is *fairer* – and therefore *better* – than just giving the dose to Anna arbitrarily. Yet Harsanyi declares them all equally good. How can a theory claiming to aggregate preferences be so indifferent to a near-universal preference for procedural fairness in this case? Doesn't this suggest Harsanyi's axioms miss something fundamental about social welfare?

  **Vance:** It’s a powerful intuition, I grant you. But Harsanyi’s framework is built on *preferences over outcomes defined by consequences for individuals*. The coin flip isn't an outcome; it's a lottery *over* outcomes. The outcomes are still only "Anna gets dose, Ben doesn't" and "Ben gets dose, Anna doesn't." We’ve assumed individuals only care about *who gets the dose*, not the process. If individuals are indifferent to the process, Pareto requires social indifference between the sure assignment and the lottery yielding the same probability distribution over those final outcomes.

  **Raine:** But that’s just dodging the intuition! The *social planner* – or society – cares about the fairness *of the process itself*. Choosing arbitrarily feels unjust in a way the coin flip avoids. We value giving both a fair shot, intrinsically. Shouldn't that count?

  **Vance:** It *can* count. But you must build it into the *description of the outcomes* within the vNM framework. Harsanyi doesn’t forbid valuing processes; it demands we model them correctly. Consider the outcome not just as "Anna has dose," but "Anna has dose *after being selected arbitrarily by the planner*." Contrast that with "Anna has dose *after winning a fair lottery*." These are different social states!

  **Raine:** *(Leans forward, skeptical)* Ah, the Broome move! Redefine the outcomes to sneak fairness in as a utility component. But isn't that ad hoc? It feels like we're gerrymandering the state descriptions *specifically* to save Harsanyi from Diamond. Where does it end? Should we describe every outcome by the entire history of moral sentiments it evokes? It risks making the theory unfalsifiable – any counterintuitive result can be "fixed" by adding more detail to the outcome space until it aligns with our prior moral judgments.

  **Vance:** It’s not gerrymandering; it’s *precision*. If people genuinely experience disutility from knowing they were chosen arbitrarily, or derive utility from knowing a fair process was used – even if they lost – then those psychological states *are part of the outcome*. Ignoring them misrepresents their actual preferences. The vNM framework requires describing outcomes completely enough to capture everything the individuals care about. If fairness matters to them, it belongs *in* the outcome description. Harsanyi then aggregates *those* utilities.

  **Raine:** But that shifts the burden entirely onto individual psychology. What if Anna and Ben *don’t* intrinsically care about the process? They just want the dose. Yet the *planner* – representing a societal value of fairness distinct from individual welfares – still thinks the coin flip is better. Harsanyi’s Pareto condition binds the social ordering to individual orderings. If individuals are indifferent between the lottery and the sure thing (because they only care about final possession), Pareto forces the social planner to be indifferent too, even if the planner has an independent moral commitment to procedural fairness. That's the core of Diamond's point: Harsanyi *prevents* the social ordering from valuing fairness *over and above* what's captured in individual utilities over final allocations.

  **Vance:** That’s a crucial distinction. If the individuals truly don’t care about the process, then according to Harsanyi’s axioms – specifically Pareto – the social planner *cannot* impose a preference for the lottery based on an *external* notion of fairness. The planner’s preferences must respect unanimous individual indifference. To value the lottery more, the planner would have to violate either Pareto or the requirement that social preferences satisfy vNM axioms based solely on individual vNM utilities over *final* outcomes. Diamond exposes that Harsanyi utilitarianism cannot accommodate a *distinctly social* value of fairness that isn't already embedded in individual utilities.

  **Raine:** Exactly! So, is the Broome redescription move principled or desperate? If individuals *do* value the fair process intrinsically, then including it is legitimate. But if they don't, Harsanyi forces the planner into indifference, blocking a widely held moral intuition about fairness. The theorem's strength – deriving utilitarianism from seemingly minimal axioms – relies on a specific, narrow description of outcomes. Diamond shows that under that description, it clashes with fairness. The redescription move works, but it highlights that Harsanyi doesn't *generate* the value of fairness; it can only accommodate it *if* we build it into the individuals' utility functions from the start. The axiomatic argument for utilitarianism seems contingent on how we define the objects of preference.

  **Vance:** *(Pauses thoughtfully)* You press the point well. Perhaps Harsanyi is best seen not as *proving* utilitarianism is the uniquely correct moral theory, but as proving that *if* social welfare is defined solely by aggregating individual vNM utilities over comprehensively described outcomes, *and* Pareto holds, *then* it must be linear. Diamond reminds us that "comprehensively described" is non-trivial, and that Pareto might constrain us from valuing things society cares about beyond individual welfares. It doesn't refute the math; it questions the completeness of its moral capture.

  **Raine:** Precisely. The Diamond isn't shattered, but its flaw reveals the limits of the setting. The utilitarian edifice stands, but perhaps on sandier ground regarding fairness than we hoped. A valuable lesson for the seminar, I think.

  **Vance:** *(Nods)* Indeed. A lesson in the power – and the price – of axiomatic reasoning in ethics. Shall we prepare the handout?

  **(End)**
