prompt: |-
  I teach a seminar on moral uncertainty and effective altruism, and honestly its kind of my fault my younger brother Theo ended up this deep into EA -- I wouldn't shut up about it at family dinners for a decade. He's marrying his partner Ada next month and I got roped into giving the toast. The two of them argue constantly about cause prioritization (he thinks animal welfare is the priority, she thinks that's basically a rounding error next to global health and x-risk) and they've never once resolved it by argument -- instead they've basically run the relationship on moral trade: he went vegan and gives to animal charities because it matters to her and costs him little, she gives alot of her salary to global health for the same reason in reverse. Our EA friends in the crowd will clock the 'moral trade' bit immediately; everyone else is just family who'll hear 'trade' and picture a business deal. Write me something like 4-5 minutes that uses this to say something true about building a life with someone whose values you don't fully share, without it coming out sounding like a lecture on cause prioritization or like their marriage is a transaction instead of a partnership.
