  First, I need to check if their core idea holds water. The backward induction relies on students eliminating each day step by step. But if they trust the proof completely, they won't expect the exam on any day, including the last one. So when the exam happens, it's a surprise. That seems logically sound. The belief in the proof invalidates the proof itself. That's a neat self-undermining loop.

