answer: |-
  Here's a breakdown of how Kant, Herman, Markovits, and Arpaly fundamentally disagree on what confers moral worth, focusing on the core tensions relevant to your protagonist:

  1.  **Immanuel Kant: The Purity Requirement**
      *   **Core Thesis:** Moral worth is *exclusively* conferred by being motivated *solely* by the recognition of duty (the moral law). The action must be done *because it is right*, and *no other motive* can be the determining ground of the will.
      *   **The Problem for Your Protagonist:** If *any* other motive (self-interest, affection) is co-present *and sufficient* to cause the action (overdetermination), the action lacks moral worth. Even if duty *is* present, its contribution is "contaminated" by the other motives. The shopkeeper who charges fairly *only* out of self-interest lacks moral worth; Kant argues the shopkeeper who charges fairly *only* because it's the right thing *despite* self-interest pulling them to cheat *has* moral worth. Overdetermination (duty + self-interest both sufficient) is problematic because we can't know if duty *alone* was the cause.
      *   **Key Disagreement Point:** Herman, Markovits, and Arpaly all fundamentally reject this strict requirement of motivational purity. They argue moral worth *can* survive or even arise from mixed motives or non-duty-centric psychology.

  2.  **Barbara Herman: Duty as the Limiting Condition (A Kantian Revision)**
      *   **Core Thesis:** Moral worth requires that duty plays a necessary *regulative* role, not necessarily the direct motivational role. Duty acts as a **"limiting condition"** – it sets boundaries that other motives (like affection or even self-interest) *cannot* violate. While the *primary* motive in the moment might be affection, duty ensures that if affection *weren't* present, or if it pointed towards something immoral, the agent *would still act rightly*.
      *   **How it Disagrees with Kant:** Herman directly challenges the purity requirement. Duty doesn't need to be the *driving force*; it needs to be the *non-negotiable framework* within which other motives operate. Moral worth survives mixed motives as long as duty is the ultimate guarantor of right action, preventing other motives from leading astray.
      *   **For Your Protagonist:** His affection might be the warm, immediate reason he helps someone. But Herman asks: *Would he still help if the affection faded or turned sour?* If duty ensures the answer is "yes," then the action (even when affection *is* present and motivating) has moral worth. Duty is the bedrock, even if covered by softer soil.

  3.  **Julia Markovits: Coincidence of Reasons (Shifting Focus from Motive to Reason)**
      *   **Core Thesis:** Moral worth depends on whether the agent's **actual motivating reasons** for acting **coincide in content** with the **justifying reasons** (the good-making features of the act itself). If you act *for the right reasons* – because the act is kind, just, necessary, etc. – then it has moral worth, *even if* you also have other motives (like enjoyment or self-interest) co-present, as long as those good-making features are genuinely *part* of why you act.
      *   **How it Disagrees:**
          *   **With Kant:** Radically shifts focus from the *type* of motive (duty) to the *content* of the reasons. Enjoying doing the right thing doesn't negate worth if you're *also* doing it *because* it's right. Overdetermination isn't fatal as long as the good-making features are *among* the sufficient motivating reasons.
          *   **With Herman:** While Herman retains duty as a necessary background *condition* (the limiting role), Markovits makes the *content* of the justifying reasons primary. Duty might *identify* those reasons, but the moral worth comes from being motivated *by those reasons themselves*. Affection *for the person* can *be* the motivating reason that coincides with the justifying reason (e.g., helping because someone needs help and you care *about them*).
      *   **For Your Protagonist:** Does he help *because* the person is suffering (justifying reason: relieving suffering)? Does he act *because* it's just (justifying reason: justice)? If these good-making features are part of *why* he acts (even alongside "I enjoy helping them" or "it benefits me"), the action has moral worth. His motives can be complex and layered, but moral worth hinges on the "right" reasons being genuinely operative.

  4.  **Nomy Arpaly: Responsiveness to Moral Reasons (Anti-Voluntarism)**
      *   **Core Thesis (via Huck Finn):** Moral worth stems from being **responsive to the true moral reasons** present in a situation, *regardless* of the agent's *conscious beliefs* or *avowed motives*. Huck helps Jim escape *despite* believing slavery is morally justified and that he's doing wrong. His action has high moral worth because he is *deeply responsive* to the actual moral truth (Jim's humanity and right to freedom) – his *non-conscious* or *deep* moral psychology aligns with the good.
      *   **How it Disagrees Fundamentally:**
          *   **With Kant:** Rejects the entire focus on conscious motive (especially duty) as the locus of moral worth. An agent can be explicitly motivated by *bad* principles (like Huck's belief in slavery) and *still* perform a morally worthy action if they are responsive to the *actual* moral reasons. Overdetermination is irrelevant; what matters is the *quality* of the agent's responsiveness to moral reality.
          *   **With Herman:** While Herman requires duty as a conscious regulative principle (it *would* step in), Arpaly places worth in a deeper, often unconscious, responsiveness. Duty might be *one way* responsiveness manifests, but it's not necessary.
          *   **With Markovits:** While both focus on reasons, Markovits focuses on the agent's *conscious* motivating reasons needing to match justifying reasons. Arpaly argues the *actual* motivating reasons (which can be unconscious) need to align with the *true* moral reasons, irrespective of the agent's conscious beliefs *about* their reasons or the act's morality.
      *   **For Your Protagonist:** His conscious motives (duty, affection, self-interest) might all be present. Arpaly asks: What is his *underlying sensitivity* to the moral realities? Does he act *because* he perceives (even if not articulately) the injustice, the need, the humanity involved? If his action flows from this deep responsiveness, it has moral worth, even if his conscious mind attributes it to duty *or* affection *or* self-interest, or even if he has some false moral beliefs. His worth comes from being "tuned in" morally, not from his stated motives.

  **Summary of Key Disagreements:**

  *   **Kant vs. Everyone Else:** Kant requires pure duty motivation. Herman, Markovits, and Arpaly *all* reject this, allowing for mixed motives or non-duty-centric psychology to support moral worth.
  *   **Herman vs. Markovits/Arpaly:** Herman retains a necessary role for *duty* as a background condition/limiter. Markovits and Arpaly shift the focus away from duty *specifically* towards the *reasons* for action (Markovits: conscious motivating reasons matching justifying reasons; Arpaly: deep responsiveness to true moral reasons).
  *   **Markovits vs. Arpaly:** Markovits requires the agent's *conscious* motivating reasons to align with the justifying reasons. Arpaly argues moral worth can exist even if the agent's *conscious* reasons/beliefs are *wrong* or *absent*, as long as their *deep psychology* is responsive to the true moral reasons.
  *   **The Locus of Worth:**
      *   Kant: Solely in the conscious motive of duty.
      *   Herman: In the necessary regulative function of duty over other motives.
      *   Markovits: In the content of the agent's conscious motivating reasons matching the justifying reasons.
      *   Arpaly: In the agent's responsiveness to true moral reasons, often residing in deep/unconscious psychology, independent of avowed motives or beliefs.

  **For Your Novel:**

  Each framework offers a different lens for your protagonist's moral worth:

  *   **Herman:** His actions have worth if duty is the ultimate safeguard ("I help because I care, but I *would* help even if I didn't care, because it's right").
  *   **Markovits:** His actions have worth if the *real reason* he acts includes the good-making features ("I help because they need help and I care *about them* [justifying reason: relieving suffering of someone I have a relationship with]").
  *   **Arpaly:** His actions have worth if they stem from a deep, perhaps unarticulated, perception of the moral truth, regardless of how he explains it to himself ("I just *couldn't* leave them like that," driven by an unacknowledged sense of their dignity).

  Choosing which (or which combination) resonates most with how you envision your character's psychology will give you that "sound scaffolding." Does his worth come from duty's invisible hand (Herman), his conscious grasp of the good reasons (Markovits), or his fundamental moral attunement (Arpaly)? Kant provides the stark contrast they all react against.
