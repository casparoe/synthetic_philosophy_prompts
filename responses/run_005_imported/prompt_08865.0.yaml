  First, I need to unpack the core issue: Kant's strict view that only duty-driven actions have moral worth. The user mentioned Herman, Markovits, and Arpaly as responses. They want a clear comparison of how these thinkers disagree, beyond Kant's shopkeeper example.

  Let me start with Kant's original stance. He uses the shopkeeper who doesn't overcharge. If he does it out of self-interest, no moral worth. Only if motivated solely by duty. The user knows this but wants to explore the critiques.

  Barbara Herman's "limiting condition" is key. She argues that duty doesn't have to be the conscious motive; it can be a background check. So even if the protagonist acts from affection, as long as duty would've stopped them if needed, the action retains moral worth. This is a practical adjustment to Kant, making room for other motives.

  Then Julia Markovits focuses on the reasons behind the action. If the motivating reasons align with the justifying reasons (the "why"), moral worth is intact. For example, helping because it's right (even if also enjoyable) has worth if the rightness is part of the motivation. This shifts from motive to reasons, offering more flexibility.

  Nomy Arpaly challenges the whole motive-centric view. Using Huck Finn, she argues that true moral worth comes from responsiveness to moral reasons, even unconsciously. Huck helps Jim despite believing it's wrong because he's morally responsive. Arpaly values the outcome and the agent's moral sensitivity over conscious motives.

  Now, where do they disagree? Herman stays closer to Kant, keeping duty as a necessary background. Markovits moves to reasons, allowing multiple motives as long as the right reasons are included. Arpaly rejects motives altogether, focusing on responsiveness to moral facts.

  The user needs this for their novel. The protagonist's actions should feel authentic with layered motivations. They want to avoid the impression that mixed motives make actions less moral. Each philosopher offers a different angle: Herman's background duty, Markovits' alignment of reasons, Arpaly's moral responsiveness.

  How does this apply to the character? The protagonist could act from affection, but duty ensures they wouldn't act otherwise. Or their reasons include both care and duty. Or they instinctively do the right thing despite conflicting beliefs. Each approach gives a different narrative flavor.

  The user might also need to show internal conflict or growth. Arpaly's view could highlight subconscious moral growth, while Markovits allows for conscious reasoning. Herman's model supports a character who checks actions against duty without it always being front and center.

