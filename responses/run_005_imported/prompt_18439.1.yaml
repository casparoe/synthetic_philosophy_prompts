answer: |-
  That's a fantastic question that cuts right to the heart of the interpretive puzzle in *On Certainty*. You've perfectly identified the tension: Wittgenstein describes hinges both as *outside* the "game" of justification/knowledge/doubt *and* as the *foundation* enabling that game. The Moyal-Sharrock vs. Wright (and others like Pritchard, Coliva, McGinn) debate isn't just verbal; it reflects fundamentally different conceptions of what certainty *is* and how Wittgenstein's later philosophy addresses skepticism. Here's a breakdown:

  **The Core Tension Driving the Dispute:**

  1.  **"Outside the Game" vs. "Foundation":**
      *   **Outside the Game:** The riverbed/hinge metaphors strongly suggest hinges are *not players* in the epistemic game. They aren't things we *know* (because knowledge implies justification, evidence, the possibility of doubt), they aren't *believed* in the standard propositional-attitude sense (involving assent based on reasons), and they aren't subject to doubt *in practice* (doubting them paralyzes thought/action).
      *   **Foundation/Enabling Condition:** Yet, Wittgenstein constantly emphasizes that *without* this unchallenged background, the *concepts* of knowledge, doubt, justification, evidence, mistake, investigation, etc., lose their meaning and application. "My having two hands" isn't *known* like "I have a pen in my hand," but if I genuinely doubted the former, the latter doubt wouldn't make sense. Hinges *make the game possible*.

  2.  **The Nature of "Certainty":**
      *   Is this certainty a *cognitive state* (like a very strong belief) or a *practical, non-cognitive orientation*?
      *   Does "I know I have two hands" express a *belief* or something else entirely (like an expression of confidence in a framework)?

  **The Two Main Camps & What Drives Them Apart:**

  1.  **The Non-Propositional/Practical/Enacted Certainty View (Moyal-Sharrock, McGinn, etc.):**
      *   **Core Argument:** Hinges are **not propositional attitudes (beliefs)**. They are **enacted in our ways of acting and living**. Our "certainty" about hinges is not a matter of *assent to a proposition* but manifests in our *unhesitating actions* and the *framework of our language-games*.
      *   **Why not beliefs?** Beliefs are subject to justification, evidence, and doubt *within* a language-game. Hinges define the game itself. Saying "I believe I have two hands" is nonsensical or pathological – it doesn't function like a normal belief. It's more like a *rule* or a *condition* for playing the game of verifying beliefs about objects.
      *   **Epistemic Work?** They do *constitutive* work, not *epistemic* work in the traditional sense. They structure reality and meaning for us, making epistemic practices *possible*. They are "animal" or "bedrock" certainties – immediate, non-reflective, expressed in action ("I reach for the cup without inspecting my hand").
      *   **Answer to Skepticism?** Radically dissolves it. The skeptic tries to doubt *within* the game but applies doubt *to the rules of the game itself*, which is nonsensical. Skepticism is an idle wheel; it fails to engage with how language and certainty actually function in our lived practices. We don't *refute* the skeptic; we show their doubt is *meaningless* within the framework their very doubt presupposes.

  2.  **The Propositional/Entitlement View (Wright, Pritchard, sometimes Coliva):**
      *   **Core Argument:** Hinges **are propositional** ("The Earth exists," "I have two hands," "The world didn't come into existence 5 minutes ago"). However, they are **not known or justifiable** by standard evidential means *within* the system they support. Instead, we are **entitled** to accept them without evidence as necessary presuppositions for any rational inquiry or justification to get off the ground.
      *   **Why still beliefs?** They take the form of propositions we rely on. While we don't typically *assert* them as beliefs (because it's pointless), our entire system of beliefs *rests* on them. Entitlement is a *normative* epistemic status: it's *rational* to accept hinges because trying to justify them leads to circularity or infinite regress, and rejecting them destroys the possibility of rational inquiry.
      *   **Epistemic Work?** They do direct *epistemic* work as the *unjustified justifiers*. They provide the ultimate warrant for our other beliefs, albeit through entitlement rather than evidential justification. They are the "foundational" propositions.
      *   **Answer to Skepticism?** Offers a *defense* against skepticism. It concedes that hinges aren't *known* by standard means but argues we are *rationally entitled* to hold them, which defeats the skeptic's demand for impossible justifications. It provides a normative account of why our basic framework is rationally acceptable.

  **Why it's NOT Just a Verbal Dispute:**

  1.  **Nature of Mind/Language:** The disagreement reflects a deeper divide about the relationship between language, thought, and action. The non-propositional view sees hinges as fundamentally *embedded in practice*, prior to explicit belief. The propositional view sees them as representational states (even if foundational).
  2.  **The Status of the "Given":** Is there a non-conceptual, practical foundation (non-propositional view), or is all structure conceptual/propositional, even at the base (propositional view)?
  3.  **The Point of *On Certainty*:** Is Wittgenstein primarily *dissolving* traditional epistemology (including skepticism) by showing its questions rest on misunderstandings of language (non-propositional view), or is he offering a *revised foundationalist epistemology* using entitlement (propositional view)?
  4.  **Anti-Skeptical Strategy:** This is crucial and addresses your last question. **Does it matter? Absolutely.**
      *   **Non-Propositional View:** Skepticism is **meaningless/incoherent**. It tries to apply doubt where doubt *cannot* meaningfully function (like doubting the rules of chess while playing). There's nothing *to* refute; the skeptic is talking nonsense. Wittgenstein wins decisively *by changing the subject*.
      *   **Propositional/Entitlement View:** Skepticism poses a **genuine challenge** that requires a **rational response**. Entitlement provides that response: we *are* rationally entitled to our hinges, so skepticism fails. However, this feels more like a *concession* to the skeptic's framework ("You need justification/entitlement for *everything*, even foundations") than a dissolution. It offers a *weaker* defense that might still leave the skeptic room to question the *strength* of entitlement versus evidential justification.

  **Conclusion:**

  The disagreement hinges (pun intended) on whether Wittgenstein's "certainty" is best understood as **practical, enacted, non-cognitive bedrock** (prior to belief/knowledge) or as **propositional presuppositions held with a unique normative status (entitlement)**. This isn't just about the word "belief"; it's about the fundamental nature of our foundational relation to the world and the very possibility of epistemology.

  **Crucially for your skepticism question:**
  *   The **non-propositional view** gives Wittgenstein a radical, **dissolutionist** answer: skepticism evaporates when we see hinges as enabling conditions, not dubious beliefs. It's a powerful "therapy."
  *   The **propositional/entitlement view** gives a **defensive** answer: skepticism is *answered* by showing we are entitled to our hinges, but it arguably stays *within* the skeptical problematic (demanding justification/entitlement for everything).

  Most Wittgenstein scholars lean towards the non-propositional/practical reading as more faithful to his later philosophy's emphasis on practice, use, and the dissolution of philosophical problems. However, the entitlement view offers a way to integrate Wittgenstein's insights into contemporary analytic epistemology. Which reading is "correct" depends on how you interpret Wittgenstein's deepest aims in *On Certainty*.
