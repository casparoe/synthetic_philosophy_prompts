prompt: |-
  so for my epistemology seminar we just finished On Certainty and theres one thing about hinge propositions i can't fully get straight. Wittgenstein keeps describing hinges as not things we know — more like the riverbed that the rest of our beliefs flow over, or the hinges a door turns on, which makes it sound like they're outside the whole game of justification entirely. But then he also calls them a kind of certainty and says our doubts only make sense because a ton of other stuff is exempt from doubt, which makes it sound like hinges are still doing epistemic work, just some special kind of it. In one of our secondary readings (Moyal-Sharrock i think?) the argument was that hinges aren't beliefs at all, more like a practical know-how or "animal" certainty, but in another one (Wright, with the entitlement stuff) they're still treated as propositional, we just don't need evidence for them. Can you lay out what's actually driving this disagreement and why it's not just a verbal dispute over the word belief? also kind of curious if it even matters -- like does one reading actually give Wittgenstein a real answer to the skeptic while the other just relabels the problem?
