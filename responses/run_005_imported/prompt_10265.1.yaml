prompt: |-
  This has turned into a whole thing in my research group and I could use an outside take before our lab meeting next week. My labmate and I have been building two different models to explain the same dataset (long story, the field doesn't really matter here), and we disagree about which one to go with. His model is way shorter to write down and has fewer moving parts; mine is longer but I think it actually captures more of the real structure, and I don't think it should just lose because it's 'less elegant.' Our advisor waded into the email thread and said this isn't even a matter of taste anymore -- that the AIC/BIC-type criteria we normally lean on in our field are just crude approximations to the real answer, because Solomonoff actually proved that Kolmogorov complexity gives you a rigorous version of Occam's razor. So whichever model has the lower Kolmogorov complexity is, provably, the one more likely to actually be true. End of story, according to him.

  So I spent the weekend reading up on this so I wouldnt get steamrolled at the meeting, and honestly the math does seem to back him up -- programs that are shorter to describe get assigned a higher prior probability, and Solomonoff showed that betting this way converges on the truth in the long run. My plan was to go estimate the Kolmogorov complexity of each model (or some reasonable proxy, since I know the real thing is a nightmare to pin down exactly) and use that as an actual objective tiebreaker, instead of the two of us just trading opinions about what counts as 'simple.' Is that a legitimate move, philosophically speaking -- has Occam's razor basically been proven at this point and I'm just late to applying it properly -- or is there some reason this doesn't actually hand us the objective answer we're hoping for?
reasoning: |-
