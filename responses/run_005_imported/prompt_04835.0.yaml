answer: |-
  Okay, let's break down that dense paragraph from Newton step-by-step. You're right to focus here – it's the core of his argument against using Cyprian as evidence for the authenticity of the Comma Johanneum (1 John 5:7).

  Here's the plain English breakdown:

  1.  **Newton's Core Claim:** He's arguing that **Cyprian was *not* quoting the disputed 1 John 5:7** ("For there are three that bear record in heaven, the Father, the Word, and the Holy Ghost: and these three are one").

  2.  **Cyprian's Actual Words:** Newton points out that Cyprian, when he mentions the Father, Son, and Holy Spirit together, **uses the phrase "the Father, *and* Son, *and* Holy Ghost"**.

  3.  **Why That Phrase Matters:** Newton notes this phrasing ("Father, *and* Son, *and* Holy Ghost") **matches the wording of the baptismal formula in Matthew 28:19** ("Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost"). He suggests this baptismal formula was the *original* basis Trinitarians tried to use to support the doctrine, *before* they latched onto the (later added) 1 John 5:7.

  4.  **The Imagined Objection ("If it be pretended..."):** Newton anticipates what his Trinitarian opponents *might* argue to counter him:
      *   **Objection:** "Okay, Newton, Cyprian used 'Father, *and* Son, *and* Holy Ghost' instead of 'Father, *the* Word, *and* Holy Ghost'. BUT! He also wrote '*Hi Tres Unum sunt*' (These Three *Are* One). Since the *standard* Latin text (the Vulgate) of 1 John 5:7 reads '*Hi Tres *in* Unum sunt*' (These Three *Agree in* One), and 1 John 5:8 reads '*Hi Tres Unum sunt*' (These Three *Are* One), Cyprian's use of 'Unum sunt' *without* the 'in' must mean he was quoting verse 7 *as it existed in his time* (implying it was authentic and early), not verse 8."
      *   **Why the Latin Wording Seems Important:** The objector claims the *presence* of "in" in the standard Vulgate verse 7 and its *absence* in verse 8 is a key identifier. Since Cyprian omits the "in" ("Unum sunt"), he *must* be quoting verse 7 as it existed then, not verse 8 which also has "Unum sunt". This would prove verse 7 existed in the 3rd century.

  5.  **Newton's Answer ("I answer..."):** Newton demolishes this objection:
      *   He states that **"the Latines generally read, 'Hi Tres Unum sunt,' as well in the eighth verse, as in the seventh."**
      *   **What This Means:** Newton is claiming that in many Latin manuscripts circulating *in his own time (17th century)*, the reading *without* the "in" ("Unum sunt") was found *in BOTH* verse 7 *and* verse 8. Therefore, Cyprian's use of "Unum sunt" **doesn't prove** he was quoting verse 7 specifically. He could just as easily have been quoting verse 8 ("For there are three that bear witness in earth, the spirit, and the water, and the blood: and these three agree in one") and simply applying the *concept* of unity ("Unum sunt") to the Father, Son, and Holy Ghost mentioned earlier (likely recalling the baptismal formula). Or, he could have been quoting a Latin version of verse 7 that *also* read "Unum sunt" without the "in".

  **Does Newton's Answer Hold Up? Is He Dodging?**

  1.  **On Manuscript Evidence:** Newton is largely correct *in his specific point*. Manuscript evidence shows significant variation in the Latin tradition:
      *   The *earliest* Vulgate manuscripts (like Codex Fuldensis, c. 546 AD) generally *do* have the distinction: verse 7 = "in unum sunt", verse 8 = "unum sunt".
      *   However, **many *later* Latin manuscripts (especially medieval ones) *did* standardize to "unum sunt" in BOTH verses 7 and 8.** Newton would have seen these common, later manuscripts. So, his statement that "Latines generally read" "Unum sunt" in both verses reflects the dominant Latin text *of his era*.
      *   **Therefore:** His observation that Cyprian's "Unum sunt" doesn't *necessarily* point to verse 7 (because verse 8 also often had that reading in later Latin) is **valid** based on the manuscript evidence he had access to. He's not dodging; he's pointing out the textual ambiguity in the Latin tradition that undermines the objector's argument.

  2.  **The Bigger Picture (Newton vs. Cyprian):** Newton's *overall* argument that Cyprian wasn't quoting the Comma Johanneum (1 John 5:7) as we know it **is overwhelmingly supported by modern scholarship**. Key reasons:
      *   **Cyprian's Phrasing:** He consistently uses the "and...and..." conjunction and "Father, Son, Holy Spirit" order matching Matthew 28:19, never the specific "bear record in heaven... the Father, the Word, and the Holy Ghost" phrasing of the Comma.
      *   **Context:** Cyprian's point is about the *unity* of the divine witnesses (like the earthly witnesses - water, blood, spirit - are one), not about establishing three distinct heavenly persons bearing witness *in heaven*.
      *   **No Greek Evidence:** No Greek manuscript containing the Comma predates the 10th century, while Cyprian wrote in the 3rd. If he knew it, it should appear in earlier Greek MSS. It doesn't.
      *   **Modern Consensus:** Virtually all critical biblical scholars today agree the Comma Johanneum (1 John 5:7) is a later, Latin-derived interpolation not present in the original text. Newton was remarkably prescient on this point.

  **Plain English Summary for Your Uncle (or Yourself):**

  "Newton is saying: Look, people use Cyprian to prove the 'three heavenly witnesses' verse (1 John 5:7) is ancient because he mentions the Father, Son, and Holy Spirit together and says 'these three are one.' But Cyprian phrases it exactly like the baptism command ('Father *and* Son *and* Holy Ghost'), not like the specific wording of 1 John 5:7 ('Father, *the* Word, *and* Holy Ghost'). Someone might argue, 'Ah, but Cyprian wrote "these three *are* one" without the word "agree" ("in"), and the *standard* Latin Bible *only* omits "agree" in verse 7, not verse 8. So he *must* be quoting verse 7!'

  Newton shoots this down by pointing out that in the common Latin Bibles *of his own time*, the wording *without* 'agree' ('are one') was actually found in *both* verse 7 *and* verse 8. So Cyprian writing 'are one' doesn't prove he was quoting the dodgy verse 7; he could easily have been quoting verse 8 about the earthly witnesses being 'one' and applying that idea to the Father, Son, and Holy Spirit from the baptism formula. Newton's point is that Cyprian's quote is vague and matches other, undisputed parts of the Bible, so it's useless as proof for the authenticity of 1 John 5:7. And modern scholarship completely agrees with Newton on this – that verse *was* added much later."

  Newton wasn't dodging; he was using his deep knowledge of textual variations to expose a weak argument used to prop up the Comma. His fundamental point about Cyprian not quoting the Comma holds strong.
