  Ok this is going to sound random but I've been quietly having doubts about the Trinity for like six months now (grew up Southern Baptist, still go most Sundays, just dont know what I actually believe anymore), and I made the mistake of mentioning it to my uncle, who has been obsessed with Isaac Newton since I was a kid. He got way too excited and mailed me a photocopied chunk of Newton's 1690 letter to John Locke, the one usually called "Two Notable Corruptions of Scripture," basically as proof that even Newton didn't buy the Trinity. I get his overall point about 1 John 5:7 being a later insertion into the Bible, but im stuck on one paragraph and my uncle is useless here, he just keeps saying "isn't that something" instead of actually explaining it.

  Right before this bit, Newton's been going on about Cyprian, the third-century bishop who's usually cited as the earliest proof that the "three heavenly witnesses" verse already existed way before Nicea. Then he writes:

  "For he does not say, 'the Father, the Word, and the Holy Ghost,' as it is now in the seventh verse; but 'the Father, and Son, and Holy Ghost,' as it is in baptism; the place from which they tried at first to derive the Trinity. If it be pretended, that the words cited by Cyprian are taken out of the seventh verse, rather than out of the eighth, because he reads not, 'Hi Tres in Unum sunt,' but 'Hi Tres Unum sunt;' I answer, that the Latines generally read, 'Hi Tres Unum sunt,' as well in the eighth verse, as in the seventh."

  Can you actually walk me through what's happening in this paragraph? Like: what's the objection he's imagining someone raising in that "if it be pretended" sentence, why would the Latin wording ("in unum sunt" vs just "unum sunt") prove anything about which verse Cyprian was quoting, and does Newton's answer to that objection actually hold up, or is he kind of dodging it? I want to be able to explain this to myself in plain English instead of just nodding along like I did with my uncle.
