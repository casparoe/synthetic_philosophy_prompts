  Also, the philosophical angle: this shows Jeffrey's rule isn't just "conditionalization but fuzzy"—it's fundamentally different. The rigidity condition preserves local relationships but allows global shifts that introduce path-dependence. That's the trade-off for handling uncertainty. 

