  First, I should recall why strict conditionalization is commutative. When you conditionalize on A and then B, it's equivalent to conditioning on A∩B. The evidence propositions are certain, so their probabilities become 1, and the rest follows. But Jeffrey's rule deals with uncertain evidence—probabilities shift without collapsing to certainty. 

  The key difference is that Jeffrey's rule preserves conditional probabilities *given the evidence proposition*, but it *changes* the probability of the evidence proposition itself. When you update on E1 first, you're altering P(E1), which then affects how subsequent evidence about E2 interacts with E1. The rigidity condition only fixes P(H|E) and P(H|¬E), not how E relates to other propositions. 

  For example, imagine updating first on the cloth's color (E1) and then on the fabric type (E2). After shifting P(E1), the conditional probability P(E2|E1) might now interact differently with the new P(E1) when you apply the second update. In reverse order, you'd have different baseline probabilities when updating E1. 

