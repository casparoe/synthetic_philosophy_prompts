  Here’s a five-minute toast that honors the couple’s philosophy while celebrating their love, threading the needle between depth and warmth:

  **(Raise glass, warm smile)**

  "Friends, family, chosen family… and fellow travelers on the path of reason! It’s truly an honor to stand here today for [Bride] and [Groom], two people whose brilliance, compassion, and commitment to making the world better have been a beacon for so many of us. Seriously, how many couples have a shared spreadsheet *optimizing* their charitable impact? That’s true romance!"

  **(Gentle laughter)**

  "Now, anyone who knows [Bride] and [Groom] knows they don’t do things by halves, especially when it comes to ethics. They’ve spent years wrestling with big ideas, like Peter Singer’s powerful challenge: that a child drowning far away has the *same* moral claim on us as one drowning right here. That distance, or personal connection, shouldn’t dictate our obligation to help. It’s an argument that demands we widen our circle of compassion to encompass the whole world. They’ve embraced this call with incredible integrity, reminding us all that suffering matters, regardless of the map coordinates."

  **(Pause, shift tone slightly more intimate)**

  "And yet… here we are. At a *wedding*. Surrounded by flowers, and cake, and… well, frankly, a *lot* of very specific personal history! Because today, [Bride] and [Groom] are about to make a vow. A vow that is, when you really look at it, a breathtaking act of radical partiality. They’re promising, out loud, in front of everyone they love, to put each other first. To be each other’s harbor, each other’s fiercest advocate, each other’s ‘person’ – above *all* others. It’s the ultimate declaration that *this* relationship, *this* history, *this* specific love, *does* tip the scales."

  **(Nod knowingly to the rationalist corner)**

  "Some of you might be grinning right now, spotting the tension. The demanding ethics of the global pond… meeting the fiercely personal ethics of the wedding vow. It *looks* like a contradiction. If every life has equal claim, how can you build a life around prioritizing just one?"

  **(Lean in, warmer, resolving the tension)**

  "But here’s the glorious thing about [Bride] and [Groom], and about love like theirs: **It’s not a contradiction; it’s the source of their strength.** The philosopher Bernard Williams once suggested that a husband who needs an *impartial calculation* to justify saving his drowning wife instead of a stranger has, poignantly, had ‘one thought too many.’ The point isn't that saving the stranger is wrong; it's that the love for his wife *itself* is the reason, immediate and profound. It needs no external justification."

  **(Turn fully to the couple, heartfelt)**

  "That’s what we witness in you two. Your commitment to global good isn't diminished by this vow; it’s *deepened* and *sustained* by it. This love you’ve found, this partnership you’re forging – it’s your anchor. It’s the safe harbor that allows you to sail into the stormy seas of a suffering world without being utterly swept away. It’s the unwavering belief in *one specific person* that fuels your belief in the potential of *every* person. It’s the profound, personal joy you find in each other that reminds you *why* reducing suffering and creating flourishing matters so intensely."

  **(Include the whole room)**

  "Because let’s be honest: trying to hold the weight of the entire world impartially, all the time? It’s… a lot. Exhausting, even. But this? This love? This specific, chosen, deeply partial bond? It’s not a moral illusion; **it’s your power source.** It’s the wellspring of resilience, the reason you can keep showing up – for each other, and *because* of each other – for the world that needs your clear minds and big hearts."

  **(Raise glass higher)**

  "So let’s toast not to an ethical compromise, but to a magnificent synergy. To [Bride] and [Groom]: May your powerful, specific, glorious love for each other be the unshakeable foundation that makes your vast compassion for the world not just possible, but unstoppable. May you continue to save distant children *because* you have each other to come home to. May your partnership be your strength, your joy, and your constant reminder of the profound, particular good that love can do."

  **(Big smile to all)**

  "To [Bride] and [Groom] – proving that the deepest personal commitment is the engine for the widest possible good. Cheers!"

  **Why this works:**

  1.  **Acknowledges the Tension Explicitly:** Names Singer's pond argument and the "demandingness objection" accurately without watering it down ("same moral claim," "distance shouldn't dictate").
  2.  **Uses Accessible Language:** Explains concepts clearly ("radical partiality," "specific love," "power source") without jargon. The "shared spreadsheet" joke grounds it early.
  3.  **Deploys Williams Perfectly:** The "one thought too many" quote is the elegant pivot point resolving the tension. It frames the vow not as a *betrayal* of impartial ethics, but as a *deeper* moral reality that precedes calculation.
  4.  **Warm Resolution:** Focuses on the *synergy* ("not a contradiction... source of their strength," "anchor," "power source," "magnificent synergy"). The love enables their wider work.
  5.  **Balances Audiences:**
      *   *Rationalists:* Get the accurate Singer/Williams references, the nod to the tension, the demandingness objection named, and the satisfying resolution.
      *   *General Audience:* Hears a toast about the power of love as a foundation for doing good in the world, using clear metaphors (pond, harbor, anchor, power source). They understand the *feeling* Williams describes even if they don't know the name.
  6.  **Centers the Couple:** Every point ties back to *their* specific love and *their* work. It's celebratory ("glorious thing," "magnificent synergy," "unstoppable").
  7.  **Avoids Lecture:** Keeps philosophical points concise and woven into the narrative of their love and the wedding. The focus remains on celebration and the couple's unique strength.
  8.  **Strong Finish:** The final lines ("save distant children *because* you have each other," "deepest personal commitment... widest possible good") perfectly encapsulate the resolved tension in a warm, uplifting way.

  This toast honors their intellectual rigor while celebrating the profound, human, and beautifully *partial* commitment they are making, showing how these facets of their lives brilliantly support each other.
