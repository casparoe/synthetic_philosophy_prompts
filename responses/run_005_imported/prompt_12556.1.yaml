prompt: |-
  A close friend from my rationalist reading group is getting married next month, and both she and her fiancé are the sort of committed effective altruists who have spent a decade taking Peter Singer's drowning-child argument at full strength: they have told plenty of skeptical relatives that a drowning child in a shallow pond a world away has exactly the same claim on you as one drowning at your feet, and that letting proximity or personal history tip the scales is a kind of moral illusion. I have been asked to give the toast, and it strikes me that a wedding vow is about the most extreme act of moral partiality on offer: a lifelong promise to place one particular person's welfare above every stranger's. Roughly half the room will recognize the pond, enjoy a well-aimed jab at the demandingness objection, and may even expect a nod to Bernard Williams's complaint that a husband who needs an impartial principle to permit him to save his drowning wife rather than a stranger has had "one thought too many"; the other half have never heard of Peter Singer and just want a nice wedding toast. Please write me a five-minute toast that uses this tension between the ethics of the pond and the ethics of the vow as its actual engine, and that resolves it warmly in the couple's favor, without either softening Singer's argument into something milder than it really is or letting the toast collapse into a philosophy lecture.
reasoning: |-
  Okay, the user wants a wedding toast that navigates a tricky philosophical tension. Their friends are hardcore effective altruists who take Singer's drowning child argument seriously, but a wedding vow is inherently about prioritizing one person. The toast needs to acknowledge both perspectives without alienating half the guests.

  Hmm, the core challenge is balancing depth and accessibility. The rationalist crowd will expect rigorous engagement with Singer and Williams, while other guests just want warmth. Can't water down Singer's position - that'd insult the couple's integrity. But a philosophy lecture would bomb at a wedding.

  The key insight might be reframing: instead of seeing partiality as a failure of ethics, show how this specific commitment enables greater good. The couple's bond amplifies their ability to help others. Like Williams' "one thought too many" - their choice isn't calculated, it's organic.

  For structure: open with traditional warmth to ground everyone, then gently introduce the pond metaphor. Use the drowning child example briefly but accurately. Pivot to Williams' spousal rescue counterpoint as the heart - their love makes impartial calculation unnecessary. Finally, show how this focused love fuels, rather than contradicts, their altruism.

  Must avoid academic jargon. "Moral mathematics" instead of "utilitarian calculus," "life raft" instead of "demandingness objection." Keep examples concrete: shared spreadsheet for donations, late-night grant writing. The spreadsheet detail makes EA culture tangible without explanation.

  Biggest risk is sounding like criticizing Singer. Solution: position the vow as complementary to EA, not opposed. Their marriage is the "multiplier" that makes impersonal charity sustainable. The "glorious exception" framing softens the partiality paradox.

  End with practical magic - the toast itself as a small ritual binding communities together. That bridges philosophy and tradition neatly. And always bring it back to the couple's joy.
