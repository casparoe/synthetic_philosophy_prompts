prompt: |-
  I teach decision theory in my university's philosophy department and serve, as the resident philosopher, on my affiliated hospital's Clinical AI Governance Committee. I've been asked to draft the memo the committee will vote on next week, covering the rollout protocol for a new deterioration-risk algorithm that currently reports a single calibrated probability of decline within twelve hours against a fixed alert threshold. Our data science lead wants to replace this point estimate with an imprecise probability — a range reflecting genuine uncertainty for patients whose vitals are sparse or atypical, rather than a false precision the data don't support — but the committee is split on what to do when a patient's range straddles the threshold. One natural decision rule (act on whatever maximizes expected benefit for at least one distribution in the range) and another (act on whatever does best in the worst case) can recommend different things for the same patient, or fail to settle on a single recommendation at all. Some members are also unsettled that ordering a confirmatory test can sometimes widen a patient's range rather than narrow it — a documented feature of reasoning under this kind of uncertainty known as dilation, not a bug, though they want to know whether it undermines the whole approach. Nursing leadership, meanwhile, warns that any recommendation this indecisive will simply be ignored at the bedside. Draft the memo: recommend a point estimate or a range, specify the decision rule and escalation protocol that should govern borderline cases, set an implementation timeline, and give the actionability worry its due rather than dismissing it as mere unfamiliarity with the new format.
reasoning: |-
  Okay, the user is a philosophy professor teaching decision theory and also part of a hospital's Clinical AI Governance Committee. They need to draft a memo for the committee about rolling out a new deterioration-risk algorithm. The main issue is whether to use a point estimate or an imprecise probability range for the algorithm's output. 

  The data science lead wants imprecise probabilities to avoid false precision, especially for patients with sparse or atypical data. But there's disagreement on how to handle cases where the probability range straddles the alert threshold. Two decision rules are being considered: one based on maximizing expected benefit (EB) under any distribution in the range, and the other on the worst-case scenario (maximin). These can give conflicting recommendations or no clear recommendation at all. 

  There's also concern about "dilation"—where confirmatory tests can widen the probability range instead of narrowing it. Nursing leadership is worried that indecisive recommendations will be ignored by bedside staff. The user needs to recommend either a point estimate or range, specify the decision rule and escalation protocol for borderline cases, set a timeline, and address the actionability concern seriously.

  First, I need to understand the core tension here. The data science perspective values epistemic honesty in representing uncertainty, while clinical usability demands clear action signals. The nursing warning about ignored recommendations is critical—if the output isn't actionable, patient safety could be compromised. But dismissing imprecise probabilities outright might mean losing valuable nuance for complex cases. 

  The dilation issue is fascinating philosophically but potentially distracting clinically. The key is to frame it as a feature, not a bug, while acknowledging it feels counterintuitive. For the decision rules, the EB rule seems more clinically aligned—it avoids unnecessary alerts but still triggers action when beneficial under some plausible scenarios. Maximin could lead to defensive over-alerting. 

  For straddling cases, a tiered escalation protocol makes sense: "Borderline Risk" classification, mandatory clinical review, and time-bound reassessment. This turns uncertainty into a structured workflow rather than paralysis. Nursing's actionability concern must be addressed head-on—through interface design (clear visual hierarchy), training (simulated cases), and monitoring adoption metrics post-rollout. 

  The timeline should include a pilot phase to iron out kinks, especially around how dilation manifests in real workflows. Crucially, the memo should position this not as a downgrade from precision but as an upgrade in clinical insight—transparent uncertainty beats misleading certainty. The tone needs to balance philosophical rigor with respect for frontline realities.
answer: |-
  ## MEMORANDUM  
  **TO:** Clinical AI Governance Committee  
  **FROM:** [Your Name], Philosophy Department & Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Recommendation on Deterioration-Risk Algorithm Rollout: Imprecise Probabilities with Structured Escalation Protocol  

  ### 1. **Recommendation: Adopt Imprecise Probabilities with Safeguards**  
  We recommend **replacing the point estimate with an imprecise probability range**, as proposed by Data Science. This better reflects genuine epistemic uncertainty for patients with sparse/atypical data, avoiding misleading "false precision." *However*, to address committee concerns, we pair this with a **strict decision rule** and **robust escalation protocol** for borderline cases.  

  ---

  ### 2. **Decision Rule for Threshold Straddling & Actionability**  
  *   **Primary Rule: Maximize Expected Benefit (EB)**  
      **Act if *at least one* plausible distribution within the range yields EB > alert threshold benefit.**  
      *Justification:* Avoids under-alerting when action *could* be beneficial. Aligns with clinical duty to prevent harm where plausible.  

  *   **Maximin as a Tiebreaker (Only):**  
      If the EB rule yields ambiguity (e.g., multiple actions are "optimal" under different distributions), **default to the action that maximizes the *minimum* possible benefit (Maximin)**. This prioritizes harm prevention in true ambiguity.  

  *   **Output Clarity:**  
      The algorithm’s interface **MUST NOT display indecisive text** (e.g., "Maybe alert"). Instead, it outputs:  
      *   **"High Risk" (Act):** Range entirely above threshold *or* EB rule recommends action.  
      *   **"Borderline Risk" (Escalate):** Range straddles threshold *and* EB rule is ambiguous *or* Maximin tiebreaker applies.  
      *   **"Low Risk" (Monitor):** Range entirely below threshold *and* EB rule recommends no action.  

  ---

  ### 3. **Escalation Protocol for "Borderline Risk" Cases**  
  To prevent bedside paralysis and ensure actionability:  
  1.  **Automatic Escalation:** "Borderline Risk" triggers an *immediate, mandatory* bedside assessment by the primary nurse *and* charge nurse within **20 minutes**.  
  2.  **Structured Assessment:** Nurses use a standardized checklist (e.g., NEWS score + clinical context) documented in the EHR.  
  3.  **Time-Bound Decision:**  
      *   If assessment clarifies risk (→ High/Low Risk), act accordingly.  
      *   If uncertainty persists after 30 mins, **automatic escalation to the covering resident or hospitalist** for final disposition.  
  4.  **Documentation:** Rationale for final decision must be entered in EHR.  

  ---

  ### 4. **Addressing Dilation & Nursing Concerns**  
  *   **Dilation is Not a Defect:** It correctly reflects that new data *can* increase uncertainty when prior data is sparse/conflicting (e.g., conflicting vitals post-test). **This does not undermine the model**; it highlights patients needing *more* scrutiny. Our escalation protocol actively manages this.  
  *   **Actionability is Paramount:** Nursing leadership’s warning is valid. Our solution:  
      *   **Avoids Ambiguous Outputs:** "Borderline Risk" is a clear *action signal* (escalate assessment), not indecision.  
      *   **Workflow Integration:** Mandatory, time-bound escalation replaces cognitive burden with a procedural safeguard.  
      *   **Training:** Focus on interpreting "Borderline" as "Requires Expert Human Judgment NOW," not "Uncertain."  
      *   **Monitoring:** Track compliance with escalation timelines and "Borderline" outcomes monthly.  

  ---

  ### 5. **Implementation Timeline**  
  *   **Weeks 1-2:** Finalize protocol & EHR integration; Develop nurse/MD training modules.  
  *   **Week 3:** Train super-user nurses, charge nurses, and night-shift leaders.  
  *   **Week 4:** **Pilot Phase (4 Units):** Go-live with new algorithm + protocol; Daily huddles for feedback.  
  *   **Week 8:** Committee review of pilot data (alert volumes, escalation compliance, clinical outcomes).  
  *   **Week 9-10:** Refine protocol/training based on pilot; Hospital-wide rollout.  

  ---

  ### 6. **Why Not a Point Estimate?**  
  While simpler, a point estimate obscures uncertainty, potentially leading to:  
  - **Over-Alerting:** Low-confidence "high risk" estimates wasting resources.  
  - **Under-Alerting:** False reassurance from spuriously precise "low risk" scores.  
  Imprecise probabilities, *with our protocol*, transform uncertainty into a **structured clinical workflow**, enhancing safety for the most vulnerable patients.  

  **Vote Recommended:** Approve imprecise probability rollout with the EB/Maximin decision rule, "Borderline Risk" escalation protocol, and phased implementation plan.  

  ---  
  **Attachments:**  
  1. Draft "Borderline Risk" Assessment Checklist  
  2. Proposed EHR Interface Mockup  
  3. Pilot Unit Evaluation Plan  

  [Your Name]  
