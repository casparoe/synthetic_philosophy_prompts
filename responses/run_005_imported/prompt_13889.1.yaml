prompt: |-
  ok so something from my TA job has been bugging me and I think it actually connects to stuff we're covering in my epistemology class rn. my co-TA and i independently grade a handful of the same essays every week, blind to each others scores, just to stay calibrated - we've TA'd the same two semesters and use the identical rubric, and normally we land within a point of each other. this week we gave the exact same essay a B+ and a C+, and after going through it line by line neither of us could find a spot where the other was clearly misreading the rubric or missing something, we just weighted the same stuff differently, and honestly we both still feel like our own grade is right. is it reasonable for us to each just hold our ground here, or does the fact that neither of us can explain away the disagreement mean we should both be shifting toward the other's number?
