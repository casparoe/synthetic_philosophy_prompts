answer: |-
  Here’s a short story where organicism (Van Inwagen's view) becomes terrifyingly true, turning a philosophical debate into a global catastrophe:

  **Title: The Binding Breath**

  The Philosophy Tower shook, but not from earthquakes. Dr. Aris Thorne gripped his lectern, knuckles white, as outside the window, the campus dissolved into screaming chaos. A delivery van flickered like bad reception, then collapsed into a billion swirling motes. Only the driver remained, tumbling onto asphalt that itself began to unravel beneath him. "Simples," Aris whispered, the word tasting like ash. "Just simples... arranged."

  *Three hours earlier...*

  "Utter nonsense, Riya!" Aris boomed, pacing before his captivated grad students. "Universalism? That my coffee mug *composes* with Alpha Centauri into some cosmic 'thing'? Meaningless! And nihilism?" He slammed a hand on a sturdy oak table. "Denies the undeniable unity of *this*! No. Composition occurs *only* when simples bind through the activity of *life*. This table? Particles arranged table-wise. This mug?" He gestured dismissively. "Particles arranged mug-wise. But *you*, Zara?" He pointed at a student. "You are a genuine object. A *life*."

  Zara shifted uncomfortably. "But Professor, what about beehives? Or coral reefs? Are they 'alive' as wholes?"

  "Emergent phenomena of *living parts*," Aris countered. "The *ants* are alive, the coral polyps are alive. The hill or reef? Merely their arrangement. True composition requires that singular, self-sustaining *spark*." He beamed, confident in his organicist fortress. "Only life binds."

  Then the world changed.

  It started subtly. Zara's pen clattered to the floor. Not dropped, but… *unmade*. One second plastic and ink, the next a shimmering dust cloud of fundamental particles settling on the carpet. Then Riya’s notebook followed. Then the projector overhead dissolved with a fizzing sigh.

  Panic erupted. They ran to the windows. A bicycle locked to a rack disintegrated, leaving the lock hanging absurdly in mid-air before it too vanished. A concrete bench crumbled like sand. But the student sitting on it? She fell, unharmed, onto grass that stayed stubbornly real beneath her – a living thing.

  **The Fallout:** Organicism was true. Brutally, universally true. Only living organisms were composite objects. Everything else – every chair, building, shoe, phone, car, bridge – was mere "simples arranged X-wise." And now, for reasons unknown, that arrangement was failing catastrophically, the "special composition" dissolving wherever the binding force of active life was absent.

  Aris’s office became a command center of sorts, if a crumbling one. Zara and Riya stayed, too terrified to traverse the disintegrating streets. Reports flooded dying networks:

  *   **Infrastructure Collapse:** Buildings not actively occupied by living beings (offices at night, empty warehouses) collapsed into atomic dust. Power grids failed as transformers and cables unmade themselves. Planes fell from the sky as engines dissolved mid-flight.
  *   **Resource Nightmare:** Food? If not actively part of a living plant or animal, it vanished. Canned goods, flour, bottled water – gone. Medicines? Only those synthesized within living bodies (like antibodies) or physically attached to a living person persisted. A dropped pill was a lost pill, instantly dust.
  *   **Survival of the Sticky:** People became islands of reality. Clothes only persisted if worn. Tools only if held. Drop your hammer? Gone. Your prosthetic limb? Dust, if not integrated into your living biology. Communities huddled close, their collective "life-field" sometimes weakly preserving essential structures, but it was tenuous.
  *   **The Ultimate Horror:** Death. When a person died, their body ceased to be a "life." It instantly disintegrated into simples. No corpses, only a brief, horrifying cloud of dust where a loved one had lain. Funerals became impossible. Grief had no focus.

  Zara stared at Aris, who looked shattered, hunched over his ancient oak desk – still solid only because *he* was touching it, his life force inadvertently binding it. "You *wanted* this," she accused, voice raw. "You argued *for* it. Only life binds. Well, congratulations, Professor. The universe listened. And now billions are dead because a coffee cup isn't 'alive' enough to exist!"

  Aris flinched. His certainty, his elegant solution to the Special Composition Question, had become a cosmic guillotine. "I... I never imagined... the *scale*..." He coughed, a deep, wet rattle. He’d hidden his terminal illness for months. Now it was a death sentence not just for him, but for everything he touched.

  He looked at his wedding ring – gold arranged ring-wise. When he died, it would vanish, just like his wife’s body already had when the hospital bed dissolved beneath her hours ago. His cane, supporting him now, would turn to dust as he fell.

  "The binding breath," he whispered, tears cutting through the grime on his face. "That's all that holds anything together now. And when it stops..." He looked out at the darkening, silent cityscape punctuated by distant screams and the eerie whisper of collapsing structures. "We thought we were arguing about chairs and rocks. We were arguing about the glue of reality. And I... I picked the cruellest glue of all."

  He slumped into his chair, the only complex object left in the crumbling tower, bound solely by his fading, failing life. Outside, the world built by non-living composites continued to vanish, leaving only the terrified, clinging living, and the infinite, indifferent dance of simples. Organicism wasn't just true; it was the end of everything humans had built. The answer to "when do parts compose a whole?" had become a death knell.
