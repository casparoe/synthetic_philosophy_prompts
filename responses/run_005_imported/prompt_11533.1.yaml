  The user might be concerned about whether we're stuck in perpetual competition. Keynes might argue that policy is needed to redistribute productivity gains and promote leisure. Without that, the market keeps driving consumption and work. The user's deeper concern could be whether society can escape this cycle or if we're trapped by our own psychology.

