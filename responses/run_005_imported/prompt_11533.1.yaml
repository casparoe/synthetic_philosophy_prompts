  First, I need to recall Keynes's essay. He predicted that by 2030, productivity would allow a 15-hour workweek. He distinguished between absolute and relative needs. Absolute needs are basic necessities, while relative needs are about status. He thought solving absolute needs would lead to more leisure, but relative needs might persist. Also, he mentioned that traits like greed would be necessary during the transition to abundance but could be discarded later.

