answer: |-
  You're correct that Anscombe's charge hinges on the *structural role* of civilian deaths in the action, not Truman's ultimate *why*. Applying the counterfactual test ("Would the operation have achieved its aim had the bombs, by some miracle, killed no one?") to the three disputed purposes demonstrates that civilian deaths functioned as an **intended means** under *all* interpretations, making Truman's ultimate aim irrelevant to the core moral charge.

  Here's the counterfactual test applied to each purpose:

  1.  **Purpose: Shortening the War by Forcing Immediate Surrender (Breaking Japanese Will)**
      *   **Counterfactual:** The bombs detonate over Hiroshima and Nagasaki with the same blinding flash and blast, but miraculously, *no one dies or is injured*. Buildings remain intact. The physical effect is purely light and sound.
      *   **Achieve Aim?** **No.** The shock, awe, and demonstration of overwhelming, incomprehensible power relied *entirely* on the immediate, massive, and indiscriminate destruction of life and cityscape. A bloodless light-and-sound show would not have demonstrated a decisive, war-ending weapon. It would likely have been perceived as a bizarre failure or a bluff, utterly failing to convince the Japanese leadership that continued resistance meant national annihilation. The *deaths and destruction* were the very mechanism by which the bomb was supposed to shock Japan into surrender. They were not an accidental byproduct of attacking military targets; they *were* the target in the sense that destroying the city and its population *was the means* to demoralization and capitulation.
      *   **Conclusion:** Deaths were an **intended means**.

  2.  **Purpose: Averting an Invasion's Casualties (Demonstrating the Cost of Continued Resistance)**
      *   **Counterfactual:** As above, bombs detonate harmlessly over the cities.
      *   **Achieve Aim?** **No.** The purpose of averting invasion casualties depended on demonstrating the *actual, horrific cost* the US was willing and able to inflict *without* an invasion. A demonstration that killed no one proves nothing about destructive capability or resolve. It provides no tangible evidence of a weapon so terrible that invasion becomes unnecessary. The Japanese leadership, already facing immense conventional bombing losses, would have no reason to believe this new weapon posed an *uniquely decisive* threat justifying surrender. The *deaths* were the concrete proof and the deterrent. The threat ("surrender or face annihilation") only has force if annihilation is *demonstrated*. The annihilation *is* the means to avert the invasion.
      *   **Conclusion:** Deaths were an **intended means**.

  3.  **Purpose: Signaling American Power to the Soviet Union (Demonstrating Post-War Dominance)**
      *   **Counterfactual:** Bombs detonate harmlessly over the cities.
      *   **Achieve Aim?** **No.** Signaling overwhelming power to the USSR required demonstrating not just a new technology, but a weapon of *unprecedented, terrifying, and usable destructive power against populations and industry*. A harmless explosion signals nothing about destructive capacity. Stalin received detailed reports on the actual effects – the scale of instant death, the lingering radiation sickness, the utter erasure of cities. *That* was the signal of a revolutionary strategic weapon that changed the global balance of power. A bloodless puff of light would have been scientifically interesting but strategically meaningless. The *deaths and destruction* were the essential content of the signal; they *were* the demonstration of power. The message was carried by the corpses and the ruins.
      *   **Conclusion:** Deaths were an **intended means**.

  **Why the Dispute Over Ultimate Aim is Immaterial:**

  *   **Structural Invariance:** The counterfactual test reveals that, regardless of *which* ultimate end Truman prioritized (ending the war quickly, saving Allied lives, or intimidating the USSR), the *immediate mechanism* by which the atomic bombs were intended to achieve *any* of these ends **required** the mass death and destruction of the civilian populations in those cities.
  *   **Means, Not Mere Side Effect:** In all three scenarios, the civilian deaths are not an accidental or regrettable consequence of targeting something else (like a munitions factory hidden within the city, where the deaths, while foreseen, aren't the *means* of destroying the factory). Instead, the deaths and the associated terror *are the very instrument* used to shock Japan or intimidate the USSR. The action is designed to *use* the civilian deaths to achieve the goal.
  *   **Anscombe's Core Point:** Anscombe's charge isn't primarily about *why* Truman wanted to end the war quickly or deter the Soviets; it's about *how* he chose to do it. She argues that deliberately using the mass killing of non-combatants as a tool or weapon is murder. The counterfactual test confirms that, on the level of the action's description relevant to double effect, the civilian deaths functioned precisely as such a tool for *all* the proposed ultimate aims. Truman's inner thoughts about his ultimate priority don't change the fact that the chosen means intrinsically involved intending civilian deaths as the mechanism of success.

  Therefore, the historical dispute over Truman's ultimate motivation (while interesting contextually) does not affect the moral characterization of the *act itself* as Anscombe describes it. Under any plausible interpretation of his goals, the counterfactual test shows the civilian deaths were an **intended means**, not a merely foreseen side effect, making the action subject to her charge of murder.
