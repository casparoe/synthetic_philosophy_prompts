prompt: |-
  Two friends of mine, Lena and Marcus, co-run a small design studio and have always paid a referral bonus of "5% of the invoice" to freelancers who bring them a client, a rule they've applied without incident to dozens of invoices, all comfortably under $10,000. Their first six-figure referral just came in: a $200,000 contract, which at 5% works out to a $10,000 bonus. (1) Marcus said the payout is obviously $10,000 -- that's just what 5% means, and it's what they've always meant by the rule. (2) Lena said it isn't obvious at all: every past payout is equally consistent with a rule that charges 5% up to some cap and then flattens out, since no invoice large enough to tell the two rules apart has ever come up before now, so nothing in their history actually settles which one they were following. (3) Marcus said he can settle it by introspection: he's always privately had "5%, no matter how large the invoice" in mind, and that fixes the answer. (4) Lena said that doesn't help, since whatever he had "in mind" is just as open to two readings as the rule itself was, and if the number had been outlandish enough he might well have balked or miscalculated, so his say-so doesn't obviously track a fact that already existed before this case came up. (5) Marcus, frustrated, said that by this logic no agreement between two people could ever be shown to mean one determinate thing rather than another, which is absurd. Lena had no good answer to that, and neither did I. Please go through the exchange move by move, including move 5, saying who has the better of it and why, and note anything important you think both of them are missing.
reasoning: |-
  Okay, let me tackle this step by step. The scenario involves Lena and Marcus, who run a design studio. They have a referral bonus policy: "5% of the invoice." For invoices under $10,000, this worked fine, but now they have a $200,000 invoice, leading to a $10,000 bonus. Marcus insists it's straightforward, while Lena argues it's ambiguous. 

  First, Marcus's point (1): He says the payout is clearly $10,000 because 5% is 5%. That seems logical on the surface. But Lena counters (2) by pointing out that all past payouts are consistent with a capped rule since no invoice was large enough to test it. That's a valid argument—past behavior doesn't prove there's no cap. 

  Then Marcus (3) appeals to his private intention: he always meant "5% with no cap." But Lena (4) dismisses this, saying his mental state is just as ambiguous. She's right that people can misjudge their own intentions, especially with hypothetical large numbers. 

  Marcus's frustration (5) leads to a philosophical claim: if this is ambiguous, no agreement can be determinate. That's where it gets interesting. Lena has no rebuttal, but I think Marcus is oversimplifying. Agreements aren't just about words or private thoughts—they rely on shared context, reasonable expectations, and purpose. For example, the referral bonus is meant to incentivize bringing in clients; a flat 5% on $200k might be excessive, while a cap could align better with the effort involved. 

  Both are missing that contractual terms often consider fairness and business norms. A court might imply a cap if 5% leads to unreasonable results. Also, they never discussed edge cases, which is a common oversight in informal agreements. 

  In the end, Lena has stronger arguments for ambiguity, but Marcus's point about determinacy isn't absurd—it just needs context. The real issue is their failure to clarify terms upfront.
answer: |-
  Let's break down the exchange move by move, analyzing the arguments and identifying who has the better reasoning, while highlighting overlooked elements:

  ### **Move 1: Marcus’s Claim**  
  *"The payout is obviously $10,000 – that's just what 5% means."*  
  - **Marcus’s view**: The rule is literal and unambiguous: "5% of the invoice" always means exactly 5%, regardless of scale.  
  - **Strength**: Simple, consistent with past applications, and aligns with linguistic convention.  
  - **Weakness**: Assumes language alone dictates meaning, ignoring context and unspoken expectations.  

  ### **Move 2: Lena’s Counter**  
  *"Every past payout is consistent with a capped rule."*  
  - **Lena’s view**: Historical data is *underdetermined*. All prior invoices (<$10k) could equally support:  
    - Rule A: Strict 5% (no cap).  
    - Rule B: 5% up to a cap (e.g., $500 cap at $10k invoice).  
    Since no large invoice tested the rule, neither interpretation is proven.  
  - **Strength**: Logically sound. Past behavior doesn’t reveal intent for untested scenarios (similar to the "grue paradox" in philosophy).  
  - **Weakness**: Overlooks that parties *believed* they were following a single rule.  

  ### **Move 3: Marcus’s Introspection**  
  *"I always privately meant ‘5%, no matter how large’."*  
  - **Marcus’s view**: His subjective intent fixes the rule’s meaning.  
  - **Strength**: Reflects actual mental state; contracts often consider party intent.  
  - **Weakness**: Ignores that Lena might have understood the rule differently. Private thoughts aren’t automatically mutual.  

  ### **Move 4: Lena’s Rebuttal**  
  *"Marcus’s introspection is as ambiguous as the rule."*  
  - **Lena’s view**:  
    - Marcus’s "intent" is retrospective and untested. If the invoice were $1M, he might have intuitively balked at $50k.  
    - Intentions aren’t pre-formed for hypotheticals; they’re constructed in context.  
  - **Strength**: Exposes the "hindsight bias" in Marcus’s claim. Cognitive science shows people often mispredict their own reactions to extremes.  
  - **Weakness**: Risks overstating indeterminacy; shared practices can imply mutual understanding.  

  ### **Move 5: Marcus’s Frustration**  
  *"By this logic, no agreement could ever mean one determinate thing!"*  
  - **Marcus’s view**: Lena’s skepticism makes all communication meaningless.  
  - **Strength**: Highlights a genuine problem: if *every* term is ambiguous, cooperation collapses.  
  - **Weakness**: Overreaction. Most agreements work because of *shared context*, not linguistic perfection.  

  ---

  ### **Who Has the Better Argument?**  
  - **Lena wins moves 2 and 4** for exposing ambiguity in both the rule’s application and Marcus’s introspection.  
  - **Marcus wins move 5** for identifying the absurd extreme of Lena’s position, but loses the broader debate.  
  - **Overall**: **Lena has the stronger case**. The rule *is* ambiguous for untested extremes, and Marcus’s introspection doesn’t resolve this.  

  ---

  ### **What Both Are Missing**  
  1. **Purpose of the Bonus**:  
     - Referral bonuses incentivize effort, not windfalls. A $10k bonus for a $200k project might be disproportionate to the freelancer’s effort (e.g., a single email). A cap could align incentives with fairness.  
     - *Overlooked*: Neither asks, "What’s the bonus *for*?"  

  2. **Business Norms & Reasonableness**:  
     - In contract law, terms are interpreted in light of "commercial reasonableness." Courts often imply caps to avoid absurd outcomes (e.g., *Wood v. Lucy*).  
     - *Overlooked*: They debate semantics but ignore industry standards.  

  3. **Shared Understanding vs. Precision**:  
     - Agreements work through *implicit context*, not just words. Their past practice created a "common law" of referrals, but it didn’t address edge cases.  
     - *Overlooked*: They never discussed large referrals because they seemed unlikely—a failure of foresight.  

  4. **The Real Solution**:  
     - This is a **drafting failure**. Ambiguity should be resolved by:  
       - Negotiating a cap retroactively.  
       - Splitting the difference (e.g., $7k).  
       - Using external standards (e.g., average referral bonus % in their industry).  

  ---

  ### **Conclusion**  
  Lena correctly identifies the ambiguity in the rule and Marcus’s introspection, but Marcus’s move 5 exposes a flaw in radical skepticism. The core issue isn’t philosophy—it’s that their agreement lacked specificity for edge cases. **In practice, the bonus should be renegotiated based on fairness, not "what 5% means."**  
  - **Key Insight**: Language alone doesn’t fix meaning; shared purpose and context do. Their mistake was assuming small-scale consistency implied universal rules—a classic error in scaling.
