  Here's a eulogy that honors Denny's "Otto stack" philosophy accurately, respects his atheism, works for both audiences, and avoids turning his memorial into a lecture. It's designed to be read in about 5-6 minutes:

  **For Denny**

  Good morning. For those who don’t know me, I’m [Your Name], Denny’s nephew. Like many of you here – whether you knew him from the lab, the philosophy meetups, or as family – I loved Denny for his brilliant mind, his dry wit, and the fierce, practical way he tackled problems. And tackling Alzheimer’s for eight years was perhaps his most formidable problem of all.

  Anyone who spent time with Denny these past few years likely encountered his notebooks. Or his phone alarms. Or the meticulously labeled folders. To the uninitiated, it might have looked like intense organization. But for Denny, it was something much more profound. It was his lifeline, his coping mechanism, and, honestly, the source of one of his favorite jokes.

  A few years into his diagnosis, Denny fell down a rabbit hole of cognitive science. He got hooked on this idea called the "extended mind." The gist, as he excitedly explained to anyone within earshot – often with that glint in his eye – was a thought experiment about a man named Otto, who also had Alzheimer’s. Otto used a notebook to store information – addresses, names, facts – the way the rest of us use our biological memory. The radical argument was that Otto’s notebook wasn’t *just* a tool. It was functionally *part* of his mind. An external hard drive for his thoughts.

  Denny *loved* this. He found it hilarious and incredibly validating. He declared his own growing system of notebooks, reminders, calendars, and apps his "Otto stack." He’d grin and tell you, "I’m not losing my mind, folks. I’m just outsourcing more RAM to the cloud!" Or, his other favorite line: "Don't worry, it's not gone. It's just not currently cached in *this* processor." For Denny, this wasn't poetry. It wasn't mysticism. It was pure, brilliant *engineering*. It was a workaround. A hack. A practical solution built on logic and science. He was adamant about that. He wasn't talking about souls or afterlives; he was talking about extending his cognitive reach using the tools he had, for as long as he could use them effectively.

  And use them he did. Watching Denny navigate the world with his Otto stack was a testament to his resilience. It wasn't passive. It was *active*. He chose what to write down. He developed systems to find it again. He adapted his tools as his needs changed. That notebook wasn't magic. Its power came entirely from Denny’s intention, his effort, and his unique mind directing it. The Otto stack *worked* because Denny was there, interacting with it, making it part of his process.

  So, what does that mean for us today, now that Denny is gone? Well, Denny would be the first to tell you – probably quite pointedly – that his Otto stack isn't his mind living on. Without Denny to pick up the notebook, check the reminder, interpret the note… it’s exactly what it looks like: paper, plastic, silicon. Bits and bytes. The magic was in the *connection*, in Denny using those tools to bridge gaps and stay engaged with the world he loved. That connection is broken now.

  But that doesn't diminish what the Otto stack *meant*. It meant Denny wasn't surrendering. It meant he was applying his formidable intellect, right until the end, to understand his own condition and fight it on his own terms. It was defiance disguised as a filing system. It was courage expressed through Post-It notes and calendar alerts. It was *so* Denny: pragmatic, clever, a little bit stubborn, and finding dark humor in the face of the absurd.

  The Otto stack wasn't an afterlife. But it *was* a powerful testament to how Denny chose to *live* with Alzheimer's. It showed his determination to remain himself, connected to us, for as long as possible, using every tool at his disposal. It was engineering, yes. But it was also love – love for his own mind, love for engaging with ideas, love for staying present with the people and projects that mattered to him.

  We don't have his Otto stack functioning anymore. But what we *do* have is infinitely more valuable. We have our *own* memories of Denny. Memories of his sharp wit, his passion for figuring things out, whether it was firmware or philosophy, his dry laugh, his loyalty. Those memories aren't stored in notebooks; they’re stored in us. In the stories we tell, the lessons we learned from him, the way he made us think, and the way he made us laugh.

  Denny’s Otto stack was a brilliant, temporary scaffold. What he built with it – the connections, the impact, the person he was – that’s his real legacy. That’s what lives on. Not in the pages of a notebook, but in everyone who was lucky enough to know him.

  So, let’s remember Denny not with sadness for what was lost, but with admiration for how he fought, with a smile for his unique, brilliant perspective, and with gratitude for the time we had with his remarkable mind, in all its forms. Thank you.

  **Key reasons this works:**

  1.  **Accuracy on the Theory:** It clearly explains the "extended mind" (Otto, notebook as functional part of cognition) and crucially, states that the stack only worked *because Denny was using it*. It explicitly denies the stack being a mind after death ("its power came entirely from Denny’s intention...", "Without Denny... it’s paper, plastic, silicon", "The magic was in the *connection*...").
  2.  **Honors Denny's Perspective:** Emphasizes it was "engineering," "logic and science," "not poetry or mysticism," "not souls or afterlives." Uses his own language ("outsourcing RAM," "cached," "hack," "scaffold"). Captures his humor and defiance.
  3.  **Accessible to All:** Explains the core idea simply without jargon ("external hard drive for his thoughts," "bridge gaps"). Uses relatable metaphors. Focuses on the *meaning* and *action* (his resilience, determination, humor) rather than deep philosophical nuance.
  4.  **Provides Comfort (Appropriately):** Shifts the focus from the *tools* (now inert) to Denny's *character* and *actions* shown *through* the tools ("defiance disguised as a filing system," "courage expressed through Post-It notes"). Then pivots firmly to the *real* legacy: the memories held by the people in the room ("What we *do* have is infinitely more valuable. We have our *own* memories... stored in us").
  5.  **Avoids Sentimentalizing the Theory:** Doesn't say "he lives on in the notebooks." Instead, says the notebooks were a testament to *how he lived* and *who he was*.
  6.  **Tone:** Respectful, warm, acknowledges loss, but focuses on celebration of his character and resilience. Includes his humor without being flippant.
  7.  **Structure:** Clear flow: Introduction -> Denny's Challenge -> Discovery of Otto Stack -> What it Meant to Him -> How He Used It -> What it Means Now (Accurate Limitation) -> The True Legacy (Character, Memories) -> Closing Tribute.

  **Delivery Tip:** Read it aloud slowly a few times before Saturday. Pause after the heavier or more important lines (especially the parts about the stack no longer working, and shifting to the memories in *us*). Let the warmth and respect for Denny come through your voice. It's okay to be emotional; it shows you cared. This speech gives you a solid, truthful, and honoring framework to lean on. Good luck. Denny would appreciate the precision.
