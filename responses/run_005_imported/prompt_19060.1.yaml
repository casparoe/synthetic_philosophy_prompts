prompt: |-
  So Lewis's Humean account of objective chance runs into the famous 'problem of undermining futures': since the chances at a time are just whatever the best system says they are, and the best system gets picked by how well it fits the entire history of the world (future included), there's always some tiny chance the future unfolds in a way that would've made a different theory the best system instead. Lewis tried to patch this in 'Humean Supervenience Debugged' with what he calls the New Principal Principle. Can you argue that the patch doesnt actually work, and that undermining is a real, unfixable problem for Humean chance/laws rather than just an annoying technical wrinkle?
reasoning: |-
  Okay, the user is asking about Lewis's Humean account of objective chance and the problem of undermining futures. They specifically mention Lewis's attempted fix with the New Principal Principle in "Humean Supervenience Debugged," and they want an argument that this patch doesn't actually work. They're framing undermining as a fundamental, unfixable problem rather than just a technical issue.

  First, I need to recall the basics. Humeanism says that laws and chances supervene on the total pattern of particular events in spacetime—the "Humean mosaic." Lewis's Best System Analysis (BSA) defines laws as the axioms in the best systematization of this mosaic, balancing simplicity and strength. Chances are the probabilities assigned by this system.

  The undermining problem arises because the Humean mosaic includes the future. So, there are possible futures that, if they occurred, would make a different system the "best" one. This means there's a non-zero chance that events could occur which retroactively change what the laws and chances were. This directly contradicts the idea that chances should guide rational credence via the Principal Principle (PP), which originally said that rational credence should match objective chance when no inadmissible evidence is present.

  Lewis's patch, the New Principal Principle (NPP), replaces chance with "admissible" chance, trying to avoid conditioning on undermining futures. But does this really solve the problem? I think not, and here's why:

  First, the NPP seems circular. It defines admissibility in terms of the very chance theory it's trying to validate. If admissibility requires that the evidence doesn't "provide any information about whether F is true except by bearing on its chance," but chance is defined by the entire history (including future undermining events), then it's unclear how to separate "bearing on chance" from direct information about F. This creates a loop that's hard to break without presupposing the chance theory itself.

  Second, even if we accept the NPP, it makes chance practically inaccessible. Since we can't know which futures are undermining, we can't know which evidence is admissible. This undermines (pun intended) the whole point of chance as a guide for rational belief. If we can't use it to set credences, what's its function? Chance becomes detached from epistemology.

  Third, the NPP might render chance explanatorily inert. If chances are only those that survive the admissibility filter, and admissibility is tied to the best system, but the best system is vulnerable to undermining, then chances lose their predictive and explanatory power. They can't reliably explain frequencies or guide expectations because they're always hostage to future events that could retroactively alter them.

  I should also consider if there are other fixes or if Humeanism can escape this. Loewer's Mentaculus is one response, using a probability distribution over initial conditions. But even that might not fully solve undermining if the initial distribution itself could be undermined by future events. The core issue is that Humean chances are descriptive, not prescriptive—they summarize history rather than govern it. This makes undermining inherent because no matter how you define "best system," there's always a possible future that would have made a different system best.

  The user might be looking for a strong critique to use in an academic context, so I should emphasize that this isn't just a technical glitch but a deep philosophical problem. It challenges whether Humeanism can provide a robust notion of objective chance that aligns with both metaphysics and epistemology. If the patch fails, undermining reveals a mismatch in the Humean framework itself—chances can't be both entirely dependent on the mosaic and reliably guide beliefs independently of it.

  I'll structure the argument to first explain the problem, then Lewis's fix, and then the three main criticisms: circularity, epistemic access, and explanatory impotence. I'll conclude that undermining is fatal to Humeanism because it exposes an irreconcilable conflict between the descriptive nature of Humean laws/chances and their normative role in reasoning.
answer: |-
  Here's a robust argument that Lewis's "New Principal Principle" (NPP) fails to solve the undermining problem, revealing it as a deep, unfixable flaw in Humean accounts of chance and laws, rather than a mere technicality:

  ### Core of the Problem: Why Undermining is Inherent & Devastating
  1.  **Descriptive, Not Prescriptive:** Humean laws/chances *supervene* on the entire Humean mosaic (past, present, and future). They are a *description* or *summary* of the pattern of particular facts. They don't *govern* or *constrain* the future in a robust metaphysical sense.
  2.  **The Undermining Future (UF):** Because the "best system" (BS) is selected based on fit over the *entire* mosaic, there are possible future histories (UF) compatible with the *current* chances (as described by the current BS) that, *if they occurred*, would mean a *different system* (BS₂) was actually best all along. Crucially, the *current* BS assigns a non-zero probability to UF.
  3.  **Conflict with Rational Guidance:** The original Principal Principle (PP) said: `Cr(A | CH_t(A) = x & E) = x`, where `Cr` is rational credence, `CH_t(A) = x` is the objective chance at time t of A being x, and E is admissible evidence. If E includes the proposition that UF occurs, then CH_t(UF) = y > 0, yet if UF occurs, the *actual* chance at t wasn't y, it was whatever BS₂ says! The PP seems to force rational agents to have positive credence in something (UF) that, if true, falsifies the very chance claim they are using.

  ### Lewis's Patch: The New Principal Principle (NPP)
  Lewis replaces PP with:
  `Cr(A | H_t & T_w) = CH_T(A)`
  *   `H_t`: The entire history of the world up to time t.
  *   `T_w`: The "theory of chance" for world w (i.e., the complete set of true chance propositions for w).
  *   **Admissibility Redefined:** Crucially, `H_t` is *always* admissible relative to `T_w`. Lewis argues this avoids conditioning on UF because `T_w` already *encodes* the correct chances for w, *including* the fact that UF has a tiny chance and doesn't actually occur in w. We condition on `H_t & T_w` (the history and the *true* chances), not on `CH_t(A) = x` alone.

  ### Why the NPP Fails as a Solution

  1.  **Circularity / Question-Begging:**
      *   The NPP *presupposes* we know `T_w` (the true theory of chance) to use it in setting credence.
      *   But `T_w` is *defined by* the BS, which is *itself* determined by the entire mosaic, *including the future*. How do we *know* `T_w` at time t? We don't. We only know `H_t` (history up to t).
      *   To *discover* `T_w`, we need to use the chances to predict the future and see what best systematizes the *whole* mosaic. But the NPP tells us how to use `T_w` *once we have it*, not how to justifiably believe in it *given only H_t*.
      *   **Result:** The NPP tells rational agents how to think *if they already know the true chances*, but it doesn't solve the problem of how agents *using only evidence available at t* (i.e., `H_t`) can justifiably believe the chances assigned by the *current* BS (which might be undermined) are the true chances `T_w`. It assumes the very thing undermined futures put into doubt.

  2.  **Epistemic Access Collapses:**
      *   The Humean must explain how an agent at t can rationally come to believe `T_w` based on `H_t`.
      *   The obvious way is via inference to the best explanation/systematization: "Given `H_t`, the best system is BS, therefore `T_w` = BS's chance claims."
      *   **Undermining Strikes:** But BS itself assigns a positive probability to futures (UF) where BS is *not* the best system. Therefore, based *only* on `H_t` and the probabilities given *by BS itself*, the agent must assign a positive credence to the proposition "BS is *not* the true theory of chance" (i.e., `T_w ≠ BS`).
      *   **Contradiction:** The agent simultaneously believes (via best system reasoning) `T_w = BS` *and* (via the chances given by BS) `Cr(T_w ≠ BS) > 0`. This is rationally incoherent. The NPP doesn't resolve this tension; it only tells the agent what to do *after* they've somehow acquired belief in `T_w`.

  3.  **Explanatory Impotence of Chance:**
      *   A core function of objective chance is to explain stable long-run frequencies and to guide rational expectation *robustly*. Humean chance, plagued by undermining, fails at this.
      *   Consider a sequence of fair coin tosses. The BS assigns P(Heads) = 0.5. The NPP tells an agent who knows `H_t & T_w` to set credence to 0.5.
      *   **The Problem:** The *explanation* for why the frequency is (say) very close to 0.5 is *not* that the chance *governed* the outcomes towards 0.5. The explanation is that the *actual* total mosaic happens to be one where the pattern is frequentistic *and* no UF occurred. However, there was always a real (albeit tiny) chance (according to the very system defining chance!) that a UF occurred, making the *actual* frequency irrelevant to what the *chances truly were*. The chance claim `P(Heads)=0.5` is only true *because* the UF didn't happen; it doesn't explain *why* the UF didn't happen or *why* the frequency is 0.5. The chance is explanatorily inert; it's a mere description of a pattern that includes its own potential falsification.

  4.  **The "Makes True" Relation is Fragile:**
      *   For the Humean, what *makes it true* that `CH_t(A) = x` is the entire mosaic, including the future. The truthmaker for the chance proposition extends into the future.
      *   At time t, the proposition `CH_t(A) = x` is *made true* by facts that haven't happened yet. It is *not* settled at t. This violates a strong intuition that chances at t should be properties fixed by the state of the world *at or before t*.
      *   The NPP doesn't change this metaphysical fact. It tries to sidestep the epistemic consequences, but the *metaphysical* dependence of chance on the future remains, rendering chance statements at t inherently unstable and non-objective in the desired sense. Their truth value depends on future contingencies to which they assign non-zero probability.

  ### Conclusion: Undermining as a Fatal Flaw

  Lewis's NPP is an ingenious attempt to preserve the formal connection between rational credence and Humean chance, but it fails to address the core metaphysical and epistemological problems created by undermining:

  *   **Metaphysically:** Humean chances are not stable, intrinsic properties of reality at a time. Their existence and value depend on future events to which they assign non-zero probability. This makes them unsuitable for playing the robust explanatory role expected of objective chances.
  *   **Epistemologically:** Agents relying on the Humean best system at a time `t` face rational incoherence. They are forced by the system itself to entertain a non-zero credence that the system they are using is false. The NPP provides no guidance for resolving this incoherence based on evidence available at `t`; it only works for agents magically endowed with knowledge of the *true* `T_w`.

  Undermining is not a wrinkle; it's a symptom of the fundamental tension within Humeanism: the attempt to derive robust, future-guiding norms (laws, chances) from purely descriptive summaries of the entire space-time manifold. The dependence on the future for the *truth* of present chance claims is incompatible with those claims being reliable, objective guides for rational agents *in the present*. This tension appears inherent to the Humean reductionist project regarding chance and laws. Alternative responses (like Loewer's Mentaculus, which fixes an initial chance distribution) avoid undermining but at the cost of introducing non-Humean elements or privileging a specific temporal perspective, further highlighting that pure Humeanism struggles to accommodate genuine objective chance.
