  First, I need to understand the historical context. Kepler published Tertius Interveniens in 1610 as an intervention in astrological debates. He critiqued traditional methods but retained aspects and their influence on weather and the human soul through musical harmonies. The astrologer here should have solid traditional backing: centuries of practice, empirical successes (even if anecdotal), and professional experience. 

