  I'm the student member on my hospital's IRB (long story - my neuroethics seminar has a practicum requirement). We've got a split case on Thursday's agenda: a psilocybin-assisted therapy trial for treatment-resistant depression is otherwise ready to go, but the board's divided over the consent form. Half think its fine as-is - it lists the standard stuff (transient anxiety during dosing, rare psychotic-like reactions, elevated BP), same as any psych trial. The other half point out that plenty of participants in these trials come out saying their whole value system shifted - what they care about, how they relate to people, whether they even want their old life back - and theres no way to warn someone in advance what that's like, or whether they'll endorse it afterward, since the self doing the endorsing might not value the same things as the self who signed up. Some members think that's just unfalsifiable hand-wringing, no different from how any real therapy changes a person some. Could you draft the memo I'd bring to the meeting - an actual recommendation (approve as-is / approve with added consent steps / send back for revision) with reasoning the PI could act on, and please don't just wave off the "you're singling out psychedelics for no principled reason" objection - engage with it properly.
