  ## The Toast: Where the Pond Meets the Vow

  [Raise glass, warm smile] Friends, family, fellow thinkers... it is a profound joy to stand before you today to celebrate [Bride] and [Groom]. Two brilliant minds, two huge hearts, and one truly formidable shared spreadsheet. [Light laughter]

  Now, anyone who knows [Bride] and [Groom] knows they don’t do things by halves. Especially when it comes to ethics. They’ve spent years wrestling with big ideas, committed to a powerful principle: that suffering matters equally, no matter *where* it happens, or *who* experiences it. A child drowning far away, they’d rightly argue, has just as much claim on our help as one right here. Distance? Relationship? Those shouldn’t be the scales we use to weigh moral obligation. It’s a challenging, beautiful, and sometimes deeply inconvenient way to see the world. [Nod to the rationalist/EAs in the room, a knowing smile]

  And yet... [Pause, gesture to the couple] ...here we are. At a wedding. Celebrating perhaps the *most* particular, the *most* partial commitment two people can make.

  Today, [Bride] and [Groom] stand before us and say, in essence: "Out of all the billions of souls on this planet, *this one* – this specific, wonderful, sometimes-annoying person right here – *this one* comes first. For life. Their joys are my joys, their sorrows my sorrows, their questionable taste in breakfast cereal is now my cross to bear." [Affectionate chuckle]

  **So, where does the pond end and the vow begin?** How do these two brilliant people, who argue so passionately for seeing the world with clear, impartial eyes, stand here and make the ultimate declaration of partiality?

  [Shift tone, more reflective, warm] I think the answer isn’t found by watering down their principles, but by understanding what makes *this* particular commitment so extraordinary, and so essential.

  The philosopher Bernard Williams once mused about a man rushing to save his drowning wife. If that man stopped to calculate whether saving his wife was *impartially justified* against saving a stranger... well, Williams said he’d have had "one thought too many." The point wasn't that impartiality is wrong, but that *some* bonds, *some* loves, operate on a different plane. They create a gravity all their own.

  [Look at the couple] What [Bride] and [Groom] understand, perhaps better than most, is that universal compassion isn’t diluted by deep, particular love – it’s often *fueled* by it. The intense focus of this vow, this promise to cherish and prioritize *each other*, isn’t a rejection of the wider world. It’s the creation of something powerful: a sanctuary, a partnership, a tiny, fiercely loving unit built on absolute trust and mutual support.

  **This unit, this bond, becomes their launchpad.** It’s the safe harbour from which they can venture out into that vast, demanding pond. Knowing they have each other's unwavering support, come what may, gives them the resilience, the stability, and the shared strength to face the world's immense needs *together*. Their commitment *here* amplifies their capacity to care *everywhere*.

  It takes a special kind of courage and clarity to hold both truths: to feel the weight of a suffering world with such acuity, *and* to boldly declare that one specific person is your anchor, your priority, your chosen partner in navigating it all. That’s not moral illusion; that’s moral architecture. They’re building something specific and strong so they can better serve the universal.

  [Raise glass higher, voice filled with warmth and conviction] So, let us toast [Bride] and [Groom]. To your brilliant, challenging, expansive view of the world. To your unwavering commitment to reducing suffering wherever it may be found. And most of all, today, to the profound, particular, and gloriously partial love you declare for each other. May this deep, specific bond be your constant strength, your enduring joy, and the solid ground from which you continue to make the world a better place – together.

  To [Bride] and [Groom]!

  ## Key Execution Notes

  *   **Tone:** Warm, affectionate, celebratory, with moments of thoughtful reflection. Avoid academic dryness. Smile genuinely.
  *   **Pacing:** The "one thought too many" line is the philosophical peak. Deliver it clearly, then *immediately* pivot back to warmth and resolution with "What [Bride] and [Groom] understand..."
  *   **Jargon Avoided:** "Effective Altruism," "demandingness objection," "moral partiality" aren't used. Concepts are explained conversationally ("suffering matters equally," "distance shouldn't matter," "particular commitment").
  *   **Balancing Acts:**
      *   **Singer Honored:** The pond argument is stated clearly and without softening ("suffering matters equally," "distance shouldn't be the scale," "challenging... inconvenient").
      *   **Williams Nodded To:** "One thought too many" is namedropped and its *sentiment* explained in the context of love.
      *   **Non-Philosophers Included:** The core conflict ("world vs. each other") is relatable. Examples are human (breakfast cereal, drowning spouse). The resolution focuses on love, partnership, and strength.
      *   **EA/Rationalists Satisfied:** The tension is acknowledged seriously, Singer isn't betrayed, Williams is referenced, and the resolution argues *for* the vow's unique role *within* their framework.
  *   **Resolution:** The "moral architecture" / "launchpad" metaphor is key. It resolves the tension by showing how the particular commitment *enables* broader compassion, making it philosophically defensible and emotionally resonant.
  *   **Time:** This should fit comfortably within 5 minutes when delivered with appropriate pauses and warmth.
