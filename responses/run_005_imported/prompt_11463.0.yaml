answer: |-
  ## Dialogue: The Harsanyi Divide

  **Characters:**  
  *   **Alex:** Defends Harsanyi's theorem as a significant vindication of utilitarianism.  
  *   **Jordan:** Skeptical, channeling Diamond and Sen.  

  **(Setting: University common room, late evening, coffee cups littering the table.)**

  **Jordan:** ...so I keep circling back to Diamond’s coin flip. Harsanyi forces us to be indifferent between giving the kidney to Adam or Beth by lottery versus just giving it arbitrarily to Adam, solely because both options yield identical *expected* utilities for Adam and Beth. But that’s absurd! The coin flip embodies fairness in a way the arbitrary choice doesn’t. Ex-ante Pareto over lotteries steamrolls that distinction. How can this be a foundation for *ethics* if it erases a core moral intuition like procedural fairness?

  **Alex:** I see the force, Jordan, but I think you’re mislocating the problem. Harsanyi isn’t *erasing* fairness; he’s forcing us to *price it into the individual utilities* consistently. If Adam and Beth genuinely care about the fairness of the procedure itself – the coin flip feeling just, the arbitrary choice feeling capricious – then that concern *must* be reflected in their vNM preferences over the lotteries. Their aversion to the arbitrary choice lottery lowers its *u_i* for them. The theorem requires their vNM utilities to capture *all* aspects of their well-being, including procedural preferences. If the lottery feels better, its *expected* utility *is* higher for each, breaking the indifference. If it *doesn’t*, then procedurally, it *isn’t* better according to their own preferences.

  **Jordan:** That’s clever, Alex, but it feels like sleight of hand. Sen’s point bites hard here. You’re assuming the vNM utility indices *just are* welfare. But what if Adam and Beth are purely self-interested in outcomes? Adam gets +100 utils if he gets the kidney, 0 if not; Beth similarly. They are indifferent to procedure. The *outcome* utilities are identical in both scenarios: Adam gets it or Beth gets it. The coin flip lottery and the arbitrary pick lottery have identical outcome sets and identical expected utilities. Harsanyi forces social indifference. Yet, ethically, giving it arbitrarily to Adam feels *unfair* compared to the coin flip, even if neither cares about the *process* itself! The unfairness is a *social* property, not captured in their purely outcome-focused, self-interested vNM utilities. Harsanyi’s framework, by relying solely on individual preferences *over lotteries*, can’t see this social value.

  **Alex:** You’re smuggling in an objective notion of fairness independent of individual preferences. Harsanyi’s utilitarianism is fundamentally *welfarist* – only individual well-being matters. If neither individual actually experiences diminished well-being due to the *unfairness* of the arbitrary choice – because they don’t care about the procedure, only outcomes – then why *should* the social planner care? The social planner aggregates *welfare*, not independent moral atoms like "fairness." If the unfairness doesn’t register in anyone's utility, aggregating those utilities *shouldn't* register it either. That’s consistent welfarism. Diamond’s case exposes a conflict between pure welfarism and non-welfarist values like ex-post fairness, not a flaw in Harsanyi’s derivation *given* welfarism and ex-ante Pareto.

  **Jordan:** But that’s precisely Sen’s critique of the *interpretation*! You’re assuming the vNM utilities *are* welfare. Harsanyi *assumes* they are von Neumann-Morgenstern preference representations, satisfying the axioms. He then *labels* them "individual utilities" and claims he’s aggregated *welfare*. But why should we accept that label? vNM utilities are just numerical representations of consistent gambling behavior under risk. They tell us nothing about interpersonal comparability, cardinal intensity in a welfare sense, or whether they capture anything beyond preference satisfaction under uncertainty. Sen argues they are "as if" utilities for choice under risk, not necessarily "being in a state of well-being" utilities. Aggregating these indices gets you a consistent social preference under risk respecting Pareto, but it doesn’t get you classical utilitarianism, which requires cardinal, interpersonally comparable *welfare* measures. The theorem is formally correct, but its ethical significance is a bait-and-switch.

  **Alex:** I think you’re drawing too sharp a line, Jordan. What *is* welfare if not what rational individuals prefer under conditions of good information and reflection? The vNM axioms operationalize rationality under uncertainty. If individuals are rational in this sense, and their preferences reveal their welfare, then vNM utilities *are* the appropriate cardinal measure. The aggregation theorem *does* give us interpersonal comparability implicitly through the affine weights – the social planner’s weights reflect the relative social value of increments in each individual’s utility scale. Harsanyi shows that under minimal rationality and Pareto, social welfare *must* be a weighted sum of these individual cardinal indices. If those indices track welfare-as-preference-satisfaction, that *is* utilitarianism. Denying that preference-satisfaction under rational conditions defines welfare seems like rejecting the welfarist project wholesale.

  **Jordan:** Not wholesale, but demanding more rigor. Consider: Two individuals with identical vNM preference structures over lotteries involving bundles of goods. But one is a ascetic who derives deep satisfaction from minimal consumption, the other a hedonist needing luxury for the same subjective feeling. Their vNM indices, scaled arbitrarily, might assign the same number to a basic bread ration, but does that mean their *welfare levels* are equal? Classical utilitarianism cares about subjective states, not just choice consistency. vNM tells us nothing about the mapping from preferences to subjective states. The aggregation theorem aggregates *choice dispositions under risk*, not necessarily *well-being*. That’s a crucial gap. Harsanyi conflates the representation of risk preferences with the measurement of welfare. The theorem gets you affine aggregation of risk preferences, not necessarily welfare aggregation in the Benthamite sense.

  **Alex:** So the core disagreement is ontological? What constitutes "welfare"? Harsanyi assumes rational preference satisfaction *is* welfare. You, following Sen, demand a separate mental-state account? But that seems fraught. How do we measure mental states intersubjectively? Preferences, especially under the disciplined structure of vNM, seem the best *operational* basis for welfare economics. The theorem shows that if we accept preference-satisfaction as welfare and accept rationality axioms and ex-ante Pareto, then affine aggregation is inescapable. Diamond’s case is then a choice: either bite the bullet and accept that pure welfarism doesn’t care about procedural fairness absent individual preferences for it, or reject ex-ante Pareto over lotteries as the appropriate normative constraint. Which bullet do you want to bite?

  **Jordan:** That’s the nub, Alex. I think Diamond shows ex-ante Pareto over lotteries is too strong if we want to capture *any* notion of ex-post fairness or rights. It forces the social planner to be blind to the distribution of *actual* outcomes across states of the world, caring only about the average expectation beforehand. Sometimes, respecting individuals might require violating ex-ante Pareto to avoid an ex-post injustice, even if no individual *ex ante* prefers avoiding it. And Sen shows that even if we accept welfarism, Harsanyi hasn’t proven he’s aggregating *welfare*; he’s only proven he’s aggregating *risk preferences*. The formal result is impeccable, but its leap to *utilitarianism* requires collapsing two distinct concepts: preference representation under risk vs. measurable well-being. Until we bridge that gap, or find axioms that force the vNM indices to *be* welfare, the theorem is a powerful mathematical curiosity, not a vindication of utilitarianism. The weights sum preferences, not necessarily well-being.

  **Alex:** So, the fault lines are clear: 1) Whether ex-ante Pareto over lotteries is an inviolable ethical axiom or sometimes overridden by ex-post considerations (Diamond), and 2) Whether vNM utility indices, derived solely from risky choice behavior, can legitimately be interpreted as interpersonally comparable cardinal measures of individual welfare, or if something more (or different) is needed (Sen). Harsanyi assumes "yes" to both. You lean "no."

  **Jordan:** Precisely. The theorem stands, but its advertised ethical significance crumbles under those pressures. It’s a beautiful constraint on social rationality under risk and Pareto, not a proof of utilitarianism.

  **Alex:** And I maintain that within a consistent welfarist framework prioritizing individual sovereignty expressed through rational preferences – including preferences over procedures – it *is* the compelling formalization. We just disagree on the foundations. More coffee?

  **Jordan:** (Sighs) Always. But only if we flip a coin for the last biscuit. Fairness matters, even if my vNM utility doesn't show it.

  **(End)**
