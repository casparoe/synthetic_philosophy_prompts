prompt: |-
  So this is going to sound morbid, but I've been working on a longer feature about organ donation, and the whole thing kicked off because I read about the Jahi McMath case -- the California teenager a hospital declared brain dead after a tonsillectomy, whose family then kept her on a ventilator in New Jersey for years (that state lets you object to a brain death diagnosis on religious grounds) before she was finally pronounced dead again, this time by cardiac criteria. Going down that rabbit hole made me realize the definition of death is way less settled then I assumed. Next week I'm interviewing a bioethicist for the piece -- I won't name her here, but she's one of the more prominent defenders of the standard "whole-brain" criterion, the view that irreversible loss of all brain function just IS death of the organism, not a convenient fiction we adopted so transplant teams have organs to work with -- and I want to come at her with sharper questions than she's probably used to fielding.

  Can you draft me 8-10 interview questions that actually engage with the substance of her view instead of letting her restate it? I want at least one question that makes her deal with Alan Shewmon's "chronic brain death" cases -- patients who kept healing wounds, fighting off infections, growing, even gestating pregnancies for months after being declared brain dead, which seems like a real problem for the "integrative unity" argument that's supposed to explain why losing your brain means your body stops being one organism rather than just suffering a catastrophic injury. I want one on the newer fight over normothermic regional perfusion in donation-after-circulatory-death cases, where surgeons clamp the vessels feeding the brain and then restart the donor's circulation to the rest of the body mere minutes after declaring death by "permanent" cessation of circulation, which sure looks like un-declaring death so the organs stay fresh. And I want one that pins her down on the gap between "permanent" and "irreversible," since a lot of actual death-determination law leans on that distinction more than most people realize. For each question, tack on a quick follow-up keyed to whatever deflection she's likely to reach for -- my guess is something like "that's a measurement problem, not a conceptual one," or "the brain is special because it's the integrator, period." Please skip the throat-clearing stuff like how she got into bioethics, I can write that part myself.
reasoning: |-
  Okay, the user is a journalist working on a feature about organ donation, sparked by the Jahi McMath case. They're interviewing a prominent bioethicist who defends the whole-brain death criterion. They want sharp, substantive questions that challenge her position without letting her fall back on rehearsed answers. 

  Hmm, they specifically want three angles covered: Shewmon's cases challenging "integrative unity," normothermic regional perfusion (NRP) looking like "un-declaring death," and the legal sleight-of-hand between "permanent" vs "irreversible" cessation. Smart asks. 

  First impression: This journalist knows their stuff. They've done deep digging (Shewmon! NRP technicalities!) and want to avoid softball interviews. Respect. The tone is appropriately no-nonsense — "skip throat-clearing" tells me they value precision. 

  Breaking it down: 
  The Shewmon challenge is existential for whole-brain defenders. If bodies can integrate functions without a brain, the "organism as a whole" argument crumbles. Need a question forcing her to either dismiss Shewmon's data (risky) or admit it complicates things. 

  NRP is practically a magic trick — surgeons declaring circulatory death permanent, then reversing it minutes later by restarting the heart (just not to the brain). The cognitive dissonance is glaring. Should highlight that tension between clinical practice and philosophical consistency. 

  Permanent vs irreversible is where law gets slippery. If death requires irreversibility but protocols only check permanence (i.e., "we won't try to restart"), that’s a policy loophole, not biological truth. Gotta corner her on whether the law misrepresents biology. 

  Anticipating her dodges: She’ll likely reframe challenges as "implementation issues" rather than conceptual flaws. So each follow-up must block that escape hatch. Example: If she says Shewmon cases are "rare anomalies," the retort should be "But doesn’t their mere existence disprove the claim that brain death always destroys integrative unity?" 

  Structure: Lead with Shewmon — it’s the strongest counterevidence. Then NRP for hypocrisy vibes, then permanent/irreversible to expose legal fiction. Sandwiching NRP between two philosophical heavyweights flows well. 

  Final thought: The journalist’s "morbid" disclaimer is unnecessary. This is rigorous reporting on a life-and-death system’s contradictions. More power to them.
answer: |-
  Here are 10 incisive questions targeting the core tensions in the whole-brain death criterion, designed to push beyond restatement and anticipate deflections. Each includes a pointed follow-up:

  1.  **Shewmon's Challenge to Integrative Unity:** "Professor Shewmon documented cases of individuals declared brain dead who exhibited organism-level integration for months or years – wound healing, immune responses, thermoregulation, even gestating pregnancies. If the whole-brain criterion hinges on the brain being the 'integrator' essential for somatic unity, how do these cases not demonstrate that a body *can* maintain integrated biological function *without* a functioning brain, thereby falsifying the criterion's core biological justification?"
      *   *Likely Deflection/Follow-Up:* If she argues these are "isolated anomalies" or "merely autonomic reflexes," ask: **"But doesn't the sustained maintenance of homeostasis, growth, and development in these cases meet the very definition of 'organism as a whole'? If not, what specific integrative functions *exclusive to the brain* were demonstrably absent that define organismic death?"**

  2.  **NRP & the Reversibility Problem in DCD:** "In normothermic regional perfusion (NRP) for donation after circulatory death (DCD), surgeons declare death based on permanent cessation of circulation. Minutes later, they clamp the cerebral vessels and *restart circulation* to the abdominal organs. Doesn't restarting systemic circulation (even excluding the brain) immediately after declaring death based on *permanent* cessation fundamentally undermine the declaration itself? Isn't this functionally demonstrating that the cessation *wasn't* irreversible at the moment of declaration, but merely *unassisted*?"
      *   *Likely Deflection/Follow-Up:* If she argues it's "only regional" or "the brain is excluded," ask: **"But the declaration of death is based on the *organism's* circulatory function ceasing *permanently*. If you can then restore significant systemic circulation (even regionally) so quickly, doesn't that prove the *organism's* potential for circulation wasn't actually *irreversibly* lost at declaration, only that resuscitation wasn't attempted? Doesn't NRP expose 'permanent' in DCD protocols as a pragmatic fiction?"**

  3.  **The Permanent vs. Irreversible Gap:** "Legally, death determination often relies on 'permanent' cessation (meaning won't restart spontaneously *and* won't be restarted), rather than proven 'irreversibility' (meaning *could not* be restarted even with intervention). Given that irreversibility is the stated conceptual basis for biological death, doesn't the reliance on permanence – especially in controlled DCD where intervention *could* restart function but is withheld – mean we are legally declaring people dead based on a *decision not to treat*, rather than an *irrefutable biological condition*?"
      *   *Likely Deflection/Follow-Up:* If she calls this a "necessary practical distinction" or "death is a process," ask: **"If irreversibility is the true biological standard, how can a declaration based *only* on permanence (a decision) be considered a valid determination of the biological state of death? Doesn't this legally codify a potentially retrievable state as death solely for organ procurement purposes?"**

  4.  **Consciousness & the "Special" Brain:** "Proponents often emphasize the brain's unique role in generating consciousness and personhood. Yet, the *legal* whole-brain criterion specifically avoids requiring loss of consciousness *per se*; it requires loss of *all brain functions*, including brainstem reflexes. If consciousness/personhood is the ethically critical loss, why not define death solely on the irreversible loss of cortical function (higher brain death)? Doesn't clinging to the *entire* brain criterion, despite cases like Shewmon's, suggest the 'integrative unity' argument is actually a post-hoc justification for a standard chosen for other reasons?"
      *   *Likely Deflection/Follow-Up:* If she insists consciousness requires the whole brain/integration, ask: **"But if integrative unity demonstrably *can* exist without consciousness (as in PVS) and potentially even without *any* brain function (as Shewmon argues), doesn't that decouple the 'integrator' argument from consciousness? What, then, makes the *entire* brain's loss uniquely constitutive of organismic death?"**

  5.  **The "Measurement Problem" Dodge:** "You might argue cases like Shewmon's or the practicalities of DCD/NRP are 'just measurement problems' or 'implementation issues,' not challenges to the conceptual validity of whole-brain death. But if the conceptual criterion *consistently* generates biological counterexamples (Shewmon) and requires legally sanctioned procedural fictions (NRP, DCD permanence) to function within organ donation protocols, doesn't that suggest the criterion itself is flawed or insufficiently grounded in observed biology?"
      *   *Likely Deflection/Follow-Up:* If she leans on "current best tests" or "diagnostic limitations," ask: **"Isn't the persistence of these profound 'implementation problems' over decades – problems that directly contradict the criterion's predicted biological outcomes – evidence that the *concept* might be mismatched to biological reality?"**

  6.  **The Organism vs. Its Parts:** "In a whole-brain dead body sustained on a ventilator, individual cells, tissues, and organs demonstrably remain alive and functional for transplant. The argument is that the *organism as a whole* is dead. Given that Shewmon's cases show coordinated *organism-level* functions persisting, how do we definitively distinguish a 'dead organism with living parts' from a 'living organism with a catastrophic, irrecoverable brain injury'? Is the distinction purely conventional?"
      *   *Likely Deflection/Follow-Up:* If she reiterates "loss of integrative unity," ask: **"Based on *which measurable functions* that are *never* present in Shewmon-type cases and *always* absent in brain death? If we can't point to such functions, isn't the 'dead organism' label more social/legal than biological?"**

  7.  **The Slippery Slope & Public Trust:** "Given the significant conceptual and practical challenges – the Shewmon cases, the legal reliance on permanence over irreversibility, the visual paradox of NRP – do you worry that maintaining the whole-brain criterion as the unchallenged biological standard actually *erodes* public trust in organ donation? Could acknowledging these tensions and exploring alternative frameworks (e.g., requiring proven irreversibility, separate definitions for procurement) be more transparent and ultimately sustainable?"
      *   *Likely Deflection/Follow-Up:* If she dismisses concerns as "theoretical" or "exploited by critics," ask: **"When families encounter cases like Jahi McMath or read about NRP, doesn't the evident gap between the biological claims and the observable reality (or surgical practice) directly fuel distrust? Isn't dismissing these concerns as 'theoretical' precisely the kind of paternalism that undermines trust?"**

  8.  **The Burden of Proof:** "The whole-brain criterion displaced the traditional cardiopulmonary standard based on arguments about integration and technology's ability to sustain bodies. Given the empirical challenges posed by Shewmon and the procedural complexities of modern donation, shouldn't the burden of proof now lie with defenders of the whole-brain standard to demonstrate *conclusively* that it accurately describes a unique biological state of organismic death, distinct from profound neurological injury, rather than assuming its validity?"
      *   *Likely Deflection/Follow-Up:* If she states the burden is met or shifts it, ask: **"If Shewmon's meticulously documented cases showing sustained organismic functions post-diagnosis don't shift the burden, what empirical evidence *would*? Does the criterion risk becoming unfalsifiable?"**

  **Key to Sharpening Your Interview:**

  *   **Listen Closely:** Pay attention to *exactly* how she phrases her justifications. Is it "the brain *is* the integrator" (assertion) or "the brain *provides* the integration" (potentially falsifiable)? Pin down the specific claim.
  *   **Hold Her to Definitions:** If she uses "integration," "organism as a whole," "death," demand clear, operational definitions. Ask: "What *specifically* does that mean in observable biological terms?"
  *   **Challenge the "Specialness":** Repeatedly press on *why* the brain is uniquely constitutive. If integration can persist without it, what *exactly* is lost that defines organismic death?
  *   **Connect Practice to Principle:** Constantly link the practical realities (NRP, DCD permanence) back to the core conceptual claims. Does the practice uphold or undermine the principle?
  *   **Don't Accept Vagueness:** If she retreats to "it's complex" or "multifactorial," gently but firmly ask for the *specific* biological mechanism or function that definitively ends with whole-brain death and explains the counterexamples.

  These questions force engagement with the deepest cracks in the whole-brain edifice. Good luck with the interview – it sounds like a crucial piece.
