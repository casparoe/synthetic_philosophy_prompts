answer: |-
  Here’s a toast weaving Keynes' actual argument into a celebration of Priya’s specific leap, designed to resonate with both bankers and artists without feeling academic:

  **(Clink glass gently, warm smile)**

  "Alright everyone, gather round. Priya, you absolute legend. Forty-four. Twenty years wrestling spreadsheets and egos in the private equity jungle... and you’ve gone and done it. You’ve hit your number. And instead of… well, let’s be honest, instead of what *most* people in this room would probably do (no judgment, I see you, Marcus!), which is immediately set a *new*, *bigger* number… you’re walking away. Painting. Long lunches. Actually *living* in the space you’ve carved out.

  Now, everyone loves to casually quote Keynes when someone does something like this. ‘Follow your passion!’ ‘Life’s too short!’ Nice fridge magnets. But Priya, what you’re doing feels… deeper. It feels like you’ve actually *read* the bit in Keynes’ ‘Grandchildren’ essay everyone vaguely references but maybe skims past.

  Keynes wasn’t just saying ‘stop working when you’re rich’. He predicted we’d *get* rich, technologically. His real worry? That we wouldn’t know what to *do* with it. That the ‘love of money’ – the sheer, relentless *accumulation* for its own sake – would become a kind of… pathology. A habit so ingrained, so addictive, that even when we reached the promised land of leisure, we’d be utterly lost. We wouldn’t know how to enjoy it, how to *be* in it. We’d just keep… chasing. Because what else was there?

  **(Pause, look at Priya)**

  *That’s* what makes what Priya’s doing so remarkable, and frankly, so brave. It’s not just retiring early. It’s consciously rejecting that pathology. It’s looking at the machinery of accumulation she mastered – and let’s be clear, she *mastered* it, brilliantly – and saying, ‘This has served its purpose. Now, I choose something else.’ She’s not just *stopping*; she’s deliberately, thoughtfully, stepping *into* that leisure Keynes dreamed of.

  And crucially, Priya? You’re stepping into it *armed*. Keynes feared people wouldn’t have the ‘first clue’ how to use leisure well. But you? You’ve had this other current running alongside the finance grind for decades – your art, your eye, that creative spark your artist friends here **(gesture warmly to them)** have always known and maybe worried was getting buried under the term sheets. You haven’t just *bought* your freedom; you’ve cultivated the *means* to actually inhabit it. Painting isn’t just a hobby you’re picking up; it’s the antithesis of that old pathology. It’s creation, not accumulation. It’s presence, not projection. It’s messy, human, and profoundly *useless* in the best possible sense of the word.

  **(Turn to include the room)**

  So, to the finance crew: This isn’t a lecture against what you do. It’s a salute to someone who played the game, played it hard, played it *well* – and then had the sheer guts and self-awareness to walk off the field while she was winning, precisely *because* she understood the game wasn’t the whole point. She’s proving Keynes’ fear wrong – at least for herself.

  And to the artist crew: This isn’t just a financier finally ‘seeing the light’. It’s a testament to the fact that the creative spirit Priya shared with you all those years ago wasn’t extinguished; it was banked, patiently, like capital. And now? She’s making the ultimate withdrawal to invest entirely in *that* portfolio. You get to welcome back a formidable talent who’s bringing a whole different kind of discipline to the studio.

  Priya, you’ve sidestepped the trap Keynes foresaw. You’ve avoided the hollow victory of endless accumulation without purpose. Instead, you’ve chosen the much harder, much richer path: translating financial freedom into genuine, creative, *lived* freedom. You’re not just retiring *from* something; you’re retiring *to* something magnificent – a life defined by creation, connection, and long, well-deserved lunches.

  So, raise your glasses. Not just to Priya hitting her number, but to her profound understanding of what that number was *for*. To her courage in rejecting the pathology of accumulation. To her wisdom in knowing exactly how to fill the beautiful, terrifying void of leisure she’s earned. To Priya – may your canvases be vast, your brushes bold, and your lunches gloriously, decadently long. Cheers!"

  **Why this works:**

  1.  **Grounds in Keynes' Actual Argument:** Directly addresses the "love of money as pathology," the fear of being lost in leisure, and the distinction between accumulation and purposeful living. Uses the specific phrase "first clue" from Keynes.
  2.  **Specific to Priya:** Highlights her mastery *and* her conscious rejection of the accumulation game. Explicitly links her finance career to the "pathology" and her art to the antidote and the meaningful use of leisure.
  3.  **Bridges the Audience Divide:**
      *   **For Bankers:** Acknowledges the skill required ("mastered it, brilliantly"), avoids demonizing their work ("no judgment," "not a lecture against what you do"), frames her exit as a gutsy, winning move ("walking off the field while winning").
      *   **For Artists:** Validates their perspective ("creative spark... buried," "welcome back a formidable talent"), frames her return as an investment in *their* world ("investing entirely in *that* portfolio"), uses language they appreciate ("creation, not accumulation," "messy, human, profoundly useless").
  4.  **Tone is Toast, Not Seminar:**
      *   **Opening/Closing:** Classic celebratory toast structure ("Priya, you absolute legend," "Raise your glasses").
      *   **Language:** Conversational ("Alright everyone," "let's be honest," "Nice fridge magnets," "spreadsheets and egos," "gloriously, decadently long").
      *   **Humor:** Gentle ribbing ("I see you, Marcus!"), self-deprecating ("fridge magnets").
      *   **Focus on Celebration:** The core message is admiration for Priya's specific, courageous choice. Keynes provides the intellectual framework, but Priya is the star.
      *   **Pacing:** Varied sentence lengths, pauses indicated, direct address ("Priya?").
  5.  **"Not Follow Your Passion":** It frames her move as a profound philosophical and psychological shift (rejecting pathology, embracing meaningful leisure) rather than a simple hobby change. The "armed" point addresses the *preparedness* Keynes worried about.

  This toast respects both sides of the room, honours Priya's unique achievement in the deepest sense Keynes intended, and delivers it all with warmth, wit, and genuine admiration – exactly what a good toast should do. Good luck!
