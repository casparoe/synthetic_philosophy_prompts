prompt: |-
  I'm a philosophy professor -- I teach mainly epistemology -- serving on my university's Academic Integrity Board, which must decide whether to approve a policy under which flags from a new AI-text-detection tool would count as evidence in misconduct hearings. The vendor's case for reliability is entirely internal: the same essay, submitted twice, reliably gets the same verdict, and a similarly built second detector from the same vendor agrees with the first about ninety percent of the time. No essays of independently confirmed authorship have ever been used to check a verdict against the truth. Some members find this scale of self-agreement reassuring and point out that all measurement rests somewhere on an instrument trusted without independent check; others answer that an independent check is available here and has simply never been used, so the parallel doesn't obviously hold. Please draft the short memo I'll bring to the Board: recommend adopt, reject, or adopt-with-conditions (stating what independent evidence would be required, and by when), and take a clear stand on whether the "trust has to start somewhere" objection actually excuses this case.
reasoning: |-
  Okay, the user is a philosophy professor specializing in epistemology and is part of an Academic Integrity Board. They need to draft a memo recommending whether to adopt a new AI-text-detection tool as evidence in misconduct hearings. The tool's reliability is based solely on internal consistency—same essays get the same verdicts, and a second similar tool agrees 90% of the time. There's no testing against essays with confirmed human authorship. 

  Hmm. The core epistemic problem here is glaring: internal consistency doesn't prove accuracy. As an epistemology expert, the professor would immediately recognize this as confusing reliability with validity. The vendor's data shows the tool is consistent (reliable) but offers zero evidence it correctly identifies AI-generated text (valid). That's a fundamental category error. 

  The user’s colleagues are split. Some argue "all instruments start with trust," but that’s misleading. Normally, we trust instruments *after* they’ve been validated against ground truth (e.g., a thermometer tested in known temperatures). Here, ground truth *exists*—human-written essays—but was never used. The "trust starts somewhere" argument only holds when validation is impossible, not when it’s conveniently skipped. 

  The stakes are high. False positives could ruin a student’s academic career. Adopting this without validity testing would be epistemically reckless and ethically risky. The professor’s memo needs to:  
  - Reject adoption outright for now.  
  - Demand independent validation: the vendor must test the tool against confirmed human/AI essays.  
  - Specify a deadline (e.g., next semester) and transparency requirements.  
  - Explicitly dismantle the flawed "trust" argument.  

  The tone should be rigorous but diplomatic—this is academia, after all. No jargon; clarity is key. And the recommendation must protect students while upholding intellectual integrity. Got it.
answer: |-
  ## Memo: Recommendation on AI-Detection Tool Policy  
  **To:** Academic Integrity Board  
  **From:** Dr. [Your Name], Philosophy/Epistemology  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Against Adopting AI-Detection Tool Without Independent Validation  

  ### Recommendation: **Reject** the current policy proposal. Adopt only **with strict conditions** requiring independent validation evidence by the start of the next academic term.  

  ### Key Rationale:  
  1. **Internal Consistency ≠ Accuracy**:  
     The vendor demonstrates *reliability* (self-consistency) but provides zero evidence of *validity* (accuracy against ground truth). Reliability without validity is epistemically hollow. A tool can be perfectly self-consistent yet systematically wrong (e.g., always flagging essays with semicolons).  

  2. **The "Trust Starts Somewhere" Objection Fails Here**:  
     While all instruments ultimately rest on foundational calibration, this case is distinct:  
     - **Independent ground truth is available and unused**. We possess vast archives of confirmed human-authored student work. Refusing to test against this is methodologically indefensible.  
     - **Analogy failure**: Trusting a thermometer assumes it was validated against known temperatures (e.g., water’s boiling point). Here, the vendor skipped this step entirely. Trust must start *after* basic validation, not before.  

  3. **High Stakes Demand Higher Evidence**:  
     Accusing students of misconduct risks severe consequences (reputational, academic, legal). Relying on a tool with unknown false-positive rates violates epistemic justice. Self-agreement alone cannot estimate error rates.  

  ### Conditions for Adoption:  
  If the Board considers adoption, I strongly recommend requiring **ALL** of the following **before implementation**:  
  1. **Blinded Validation Study**: Vendor tests the tool against:  
     - 500+ confirmed human-authored essays from our university’s archives (spanning disciplines/styles).  
     - 500+ confirmed AI-generated essays (using prompts mimicking student assignments).  
     *Threshold*: ≥95% accuracy, ≤5% false-positive rate. Results independently audited.  
  2. **False-Positive Transparency**: Vendor provides detailed documentation on edge cases (e.g., non-native English, technical writing, formulaic disciplines).  
  3. **Deadline**: Evidence submitted by **May 1, 2024**, for Fall 2024 implementation.  

  ### Conclusion  
  Internal consistency is necessary but insufficient for evidentiary reliability. To deploy this tool without independent validation confuses repeatability for truth—a category error no epistemology department should endorse. The "trust starts somewhere" argument misapplies instrumentalism; it cannot excuse avoiding available verification. **Adopting this tool now would violate our duty to evidence-based judgment and expose students to untenable risk.**  

  Respectfully submitted,  
  Dr. [Your Name]  

  ---

  ### Key Philosophical Points Embedded:  
  - **Epistemic Risk Management**: In high-stakes contexts, we must prioritize avoiding false positives (Type I errors) over mere consistency.  
  - **Inference to the Best Explanation**: The vendor’s refusal to test against ground truth suggests the tool may not withstand scrutiny—a concerning explanatory hypothesis.  
  - **Burden of Proof**: The vendor bears the burden of proving validity. The Board bears the burden of protecting academic due process. Both fail if this policy passes as-is.
