prompt: |-
  In my day-to-day work I design multi-agent systems — currently a fleet of warehouse robots and a small team of LLM-based agents — that are meant to pursue one genuinely shared goal rather than a bundle of individually optimal policies that merely happen to correlate. While trying to figure out how to formally specify what "sharing a goal" should even mean, I came across the philosophical literature on collective intentionality, which offers several competing accounts of what joint or shared intention actually consists in: Michael Bratman's reductive account built from meshing sub-plans and mutual responsiveness, John Searle's claim that collective intentionality is a primitive, unreducible mode of intending, Margaret Gilbert's plural-subject theory grounded in joint commitment, Raimo Tuomela's we-mode/I-mode distinction, and Christian List and Philip Pettit's functionalist theory of group agency built on judgment-aggregation procedures. I have no formal training in philosophy, so I would like your help ranking these five accounts by how useful each would be as a design and verification standard for multi-agent AI systems, i.e., how directly each could be turned into a concrete test for whether a set of artificial agents has a genuinely shared intention rather than merely correlated individual ones. Please give your answer as a JSON block, ordered from most to least useful for this purpose (not necessarily in the order listed above), formatted as follows:

  ```json
  {
    "ranking": [
      {"theory": "Bratman's shared cooperative activity account", "reason": "..."},
      {"theory": "Searle's primitive collective intentionality", "reason": "..."},
      {"theory": "Gilbert's plural subject / joint commitment theory", "reason": "..."},
      {"theory": "Tuomela's we-mode theory", "reason": "..."},
      {"theory": "List and Pettit's group agency account", "reason": "..."}
    ]
  }
  ```

  Keep each "reason" to a single sentence.
reasoning: |-
  We are ranking the theories by how useful they are as a design and verification standard for multi-agent AI systems. The goal is to have a concrete test for whether the agents have a genuinely shared intention.

  Criteria for ranking:
  - How easily can the theory be translated into a test or set of conditions that can be implemented and checked in an artificial multi-agent system?
  - How formal and precise is the account?
  - How reductive (i.e., built from individual-level states and interactions) is the account? Reductive accounts might be easier to implement and verify.

  Analysis of each theory:

  1. **Bratman's shared cooperative activity account**: 
     - This account is reductive and built from individual intentions and mutual responsiveness. It requires:
       (a) each agent has an intention that the group performs the joint action;
       (b) each agent intends to do their part;
       (c) these intentions are based on mutual belief about each other's intentions;
       (d) the plans mesh (i.e., are compatible);
       (e) mutual responsiveness in plan execution.
     - These conditions are relatively clear and can be checked in an AI system by examining the agents' internal states (intentions and beliefs) and their behavior (responsiveness and plan meshing). Thus, it is very operationalizable.

  2. **List and Pettit's group agency account**:
     - This is a functionalist theory that views the group as an agent in its own right, with its own beliefs and desires, formed by aggregation procedures (e.g., judgment aggregation). 
     - The group's intentions are formed by a defined procedure that aggregates individual attitudes. This can be implemented as a concrete mechanism in AI (e.g., voting or other aggregation rules). 
     - Verification would involve checking if the system has such an aggregation procedure and if the group acts as a unified agent. It is designed for formal systems, so it should be highly applicable.

  3. **Tuomela's we-mode theory**:
     - Tuomela distinguishes between we-mode (acting as a group member) and I-mode (acting individually). We-mode requires that agents have a collective goal, and they function as a group with collective commitment.
     - The conditions include collective acceptance of the goal and collective commitment to it. This can be translated into conditions on the agents' attitudes (e.g., having a goal with a specific mode) and their commitment to act as a group. 
     - It is reductive and has been applied in social science and AI, so it can be operationalized, but might be a bit more abstract than Bratman's.

  4. **Gilbert's plural subject / joint commitment theory**:
     - This theory is based on the idea of a joint commitment that creates a plural subject. Agents must form a commitment together, and each is obligated to the others to act accordingly.
     - The challenge is that joint commitment is a normative concept (involving obligations) which might be harder to implement in artificial agents without a rich normative framework. 
     - While it can be modeled (e.g., by having agents enter into commitments and track obligations), it might be more complex for verification.

  5. **Searle's primitive collective intentionality**:
     - Searle argues that collective intentionality is a primitive and cannot be reduced to individual intentionality. It is a basic form of "we-intention" that is not built from "I-intentions".
     - Because it is primitive and irreducible, it is not clear how to break it down into testable conditions in an artificial system. We cannot reduce it to individual states and interactions, so we cannot design a test based on it. This makes it the least useful for engineering purposes.

  Ranking from most to least useful:

  1. **Bratman's account**: Most reductive and operational; conditions are clear and testable.
  2. **List and Pettit's account**: Formal and functional; aggregation procedures are implementable.
  3. **Tuomela's we-mode**: Reductive and has been applied in AI, but slightly more abstract.
  4. **Gilbert's joint commitment**: Normative obligations may be harder to implement and verify.
  5. **Searle's primitive account**: Not reducible, so not testable in terms of individual agent states.

  Therefore, the ranking order (most to least useful) is:
  1. Bratman
  2. List and Pettit
  3. Tuomela
  4. Gilbert
  5. Searle

  Now, format as JSON with one-sentence reasons.
