prompt: |-
  Ok, this has been rattling around in my head for a couple weeks and I can't quite resolve it, so I could use an outside perspective. I have a friend, K, who's very vocal about climate stuff, both online and in person—posts about it alot, brings it up unprompted at dinners, the whole thing. She's also definately the person in our friend group who flies the most by a wide margin (multiple international vacations a year, plus she once flew to Iceland for a single weekend because the tickets were $200). We've been close since college so I don't want to just write off what she says, but last week she spent a solid ten minutes telling me I should be biking to work instead of driving my 15-minute commute, and when I half-joked about her flight habits she just said "yeah, I know my footprint is bad too, that doesn't make you biking any less of a good idea"—and honestly I didn't have a great comeback in the moment.

  Logically I think she's technically right that her being bad on this doesn't make my driving okay; that's just a straightforward tu quoque and shouldn't bear on whether the underlying claim is true. But something about being on the receiving end of that lecture, specifically from her, still feels off in a way I can't fully articulate, and I don't think it's pure defensiveness on my part. I've seen versions of this exact argument play out in ACX comment sections and on Twitter re: celebrities and politicians getting called out over private jets, and nobody ever seems to actually settle whether the hypocrisy is doing real argumentative work or whether it's always just a distraction from the object-level point. So: is there something genuinely there to the intuition that K isn't well positioned to lecture me on this, even granting she's not factually wrong—and if so, what exactly is it? Or should I just bite the bullet and accept that the messenger shouldn't matter at all here?
