answer: |-
  Here's a direct verdict based on the core challenge of higher-order vagueness:

  **Epistemicism handles higher-order vagueness *structurally* better than Supervaluationism.** While both ultimately *have* sharp boundaries at every level, Epistemicism **acknowledges and integrates this inevitability consistently**, whereas Supervaluationism **attempts to avoid it at the first order but inevitably reintroduces it at higher orders in a way that undermines its core motivation.**

  ### Why Epistemicism (Williamson) Handles It Better (Relatively)
  1.  **Uniform Treatment:** Epistemicism treats *all* vagueness (first-order, second-order, etc.) the same way: there is a sharp but unknowable boundary. "Borderline" isn't a third truth-value; it's an epistemic state reflecting our ignorance of the precise boundary between truth and falsity.
  2.  **Higher-Order Vagueness is Just More Ignorance:** The boundary between "definitely tall" and "borderline tall" is just *another* sharp boundary we cannot know. The boundary between "borderline tall" and "definitely *not* borderline tall" (i.e., the boundary of the borderline region) is *yet another* sharp boundary we cannot know. This is philosophically costly but **internally consistent**. The bullet is bitten uniformly at every level.
  3.  **No Regress Problem:** Epistemicism doesn't generate an infinite regress of metalanguages or precisifications. The machinery (sharp boundaries + universal ignorance) applies recursively without needing new theoretical apparatus.

  ### Why Supervaluationism (Fine/Keefe) Handles It Worse
  1.  **The Admissibility Problem:** Supervaluationism defines truth (supertruth) as truth across *all admissible precisifications*. "Borderline" means true on some, false on others. **But what makes a precisification *admissible*?** This is where higher-order vagueness bites hard.
  2.  **Smuggled Sharp Boundaries:**
      *   The set of "admissible precisifications" must itself have sharp boundaries. There's a precise, albeit possibly unknown, set of functions that count as admissible precisifications for "tall".
      *   This means there's a **sharp boundary determining what counts as a borderline case (first-order)**, because borderline cases are defined *relative to* the set of admissible precisifications. If the set of precisifications is sharp, so is the extension of "borderline case".
  3.  **Defeats the Core Motivation:** Supervaluationism's *raison d'être* is to avoid sharp boundaries for vague predicates by appealing to multiple precisifications. **Finding a sharp boundary in the *theory's own machinery* (the set of admissible precisifications) is a devastating failure.** It avoids a sharp cut-off for "tall" only by positing a sharp cut-off for "admissible precisification of 'tall'". This undermines the fundamental advantage it claims over epistemicism.
  4.  **Regress Threat:** Attempts to make "admissible" vague (e.g., via higher-order precisifications) lead to an infinite regress. You need a meta-supervaluation over precisifications of precisifications, and the problem recurs at the meta-level: what makes a precisification *of precisifications* admissible? This regress either halts with a sharp boundary (reintroducing the problem) or is vicious.

  ### The Verdict (Pushing Back Slightly on Your Hunch)
  Your hunch is largely correct: Supervaluationism *does* smuggle sharp boundaries back in at the level of admissibility, which is a significant weakness directly related to higher-order vagueness. Epistemicism *does* bite the bullet consistently.

  **However, "better" depends on your goals:**
  *   **For theoretical consistency and avoiding *internal* collapse:** **Epistemicism wins.** It doesn't promise boundarylessness; it embraces boundaries and universalizes the epistemic explanation. Its treatment of higher-order vagueness is a straightforward extension of its core tenets.
  *   **For capturing the *intuition* of boundarylessness:** **Neither wins.** Epistemicism blatantly denies it. Supervaluationism promises it for the first-order predicate but fails to deliver it for the crucial higher-order concepts ("borderline", "admissible") its theory relies on. Supervaluationism's failure here is *more glaring* because it contradicts its own stated aim.

  **Therefore, for your seminar handout:** Emphasize that **Epistemicism provides a more *coherent and consistent* account of higher-order vagueness** precisely because it never denied sharp boundaries. Supervaluationism's attempt to eliminate first-order sharp boundaries founders on the rocks of higher-order vagueness, revealing a fundamental instability in its attempt to reconcile classical logic with the phenomenology of vagueness. The cost of Epistemicism's consistency is accepting pervasive unknowable sharp boundaries; the cost of Supervaluationism's intuitive first-order picture is an incoherence or sharp boundary at the meta-level. On balance, when *specifically* judged on handling higher-order vagueness, Epistemicism's structure holds up better under pressure.
