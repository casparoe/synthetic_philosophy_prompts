prompt: |-
  Something that happened in my lab a few weeks ago has been nagging at me, and I would like help thinking it through properly rather than simply deferring to whichever of my labmates argued more forcefully at the time. I am a second-year PhD student in social psychology, and I had been running a study on whether a small change in how a request is phrased affects how much money people are willing to hand over to a stranger in a simple economic game. My advisor and I originally planned to recruit about sixty participants, but when the effect was trending in the right direction without quite clearing the conventional significance threshold, she suggested I keep collecting data in batches of twenty and check the result again each time. I did this until, at a hundred participants, the result finally crossed p < .05. Everyone was pleased, until I described exactly how I had gotten that result at the following week's lab meeting.

  One labmate, who has become something of a methodological conscience for the lab after spending a summer reading about the discipline's struggles to make published results hold up, said that stopping this way makes the .05 essentially meaningless: because I kept looking, and would have continued had the early batches not worked out, the actual probability of hitting on a "significant" result somewhere along the way is much higher than five percent, regardless of whether the effect is real. A second labmate, midway through a rotation in a lab that approaches statistics quite differently, disagreed just as forcefully: she argued that whatever I would have done under some other, hypothetical run of the experiment is beside the point, since the only thing that can bear on how strongly my data support the hypothesis is the data I actually collected, not the space of experiments I did not run; treating my stopping point as though it contaminates the evidence, on her view, rests on a mistaken picture of what evidence even is.

  Both arguments strike me as genuinely compelling, which is unsettling, since they cannot both be entirely right, and I still need to write a methods section defending what I did before I meet with my committee next month. Is one of my labmates simply correct and the other confused, or is this a case where two careful thinkers end up at odds because they do not actually agree on what makes data count as evidence for a hypothesis to begin with? I would like to understand the real structure of the disagreement well enough to know whether, and how, I should be doing things differently going forward.
reasoning: |-
  Okay, let me try to unpack this user's dilemma. They're a second-year PhD student in social psychology who encountered a conflict in their lab about data collection methods. The core issue revolves around whether stopping data collection based on interim results invalidates the p-value. 

  First, I need to understand both labmates' arguments clearly. The first labmate is concerned about p-hacking - specifically the increased Type I error rate from repeated testing. They're referencing the replication crisis literature, which is valid. The second labmate takes an evidential approach, arguing that only the collected data matters, not hypothetical scenarios. 

  Hmm... this is a classic frequentist vs. likelihoodist debate. The user needs to grasp why both arguments sound compelling. The frequentist approach (first labmate) focuses on long-run error control, while the likelihoodist (second labmate) cares about evidence in hand. Neither is wrong per se - they're answering different questions.

  The user's anxiety is palpable. They need to write their methods section and face their committee soon. Beyond technical accuracy, they're probably worried about appearing methodologically naive. Their deeper need might be understanding how to navigate such disagreements in their academic career.

  I recall that Gelman and others have written about this. The key is distinguishing between design-based and analysis-based inferences. The original sin here was changing the design mid-stream without adjusting analysis. 

  For the methods section, transparency is crucial. They must report all data collection stages and consider correction methods. Going forward, pre-registration would prevent this issue. The committee will care more about methodological awareness than the initial mistake.

  The philosophical tension is real but manageable. The user's ability to articulate both views in their thesis will demonstrate maturity. I should emphasize that many labs face this - it's a rite of passage in methodological awareness.
answer: |-
  This is an excellent and profoundly important question that cuts to the heart of statistical inference and the replication crisis in psychology. Both labmates are raising valid points from different philosophical and statistical perspectives. **Neither is entirely "wrong," but the first labmate is articulating the dominant, statistically rigorous view held by most methodologists today.** Here's a breakdown of the core disagreement and its implications:

  ### 1. The First Labmate's Argument (The Problem of "p-hacking" / Alpha Inflation)
  *   **Core Concern:** **Long-run error control.** Frequentist statistics (like p-values and significance thresholds) are designed to control the **Type I error rate** (falsely rejecting the null hypothesis) *over the long run, assuming a specific experimental design is fixed beforehand.*
  *   **The Issue with Sequential Testing:** When you peek at your data multiple times (after n=60, 80, 100) and decide *based on the current p-value* whether to continue collecting data, you fundamentally alter the design. You are conducting multiple hypothesis tests on accumulating data.
  *   **Why p < .05 becomes misleading:** The probability of finding *at least one* p-value < .0.05 *by chance alone* (even if the null hypothesis is true) increases dramatically with each peek. This is called **alpha inflation** or the problem of **increased false positive risk**. The "5% chance of a false positive" guarantee only holds if you analyze the data *once*, according to the *pre-specified* plan. Your actual false positive risk was likely much higher than 5%.
  *   **Statistical Reality:** Methods exist to handle *planned* sequential testing or optional stopping (like Sequential Probability Ratio Tests - SPRTs), but they require adjusting the significance threshold at each look *in advance* to maintain the *overall* Type I error rate at 5%. What you did was *unplanned, ad-hoc* sequential testing without adjustment, which invalidates the simple p < .05 interpretation.
  *   **Broader Context:** This practice is a major contributor to the replication crisis. It allows researchers to "hack" their way to significance, publishing results that are statistically flukes amplified by flexible stopping rules.

  ### 2. The Second Labmate's Argument (The Evidential Perspective / Likelihood Principle)
  *   **Core Concern:** **The evidence contained in the collected data.** This view emphasizes the **Likelihood Principle**, which states that all the evidence provided by the data regarding hypotheses is contained in the likelihood function (the probability of the observed data under different hypotheses). What you *might* have done (collecting more data if not significant) doesn't change the evidence *actually obtained*.
  *   **The Intuition:** It *feels* intuitively wrong that hypothetical actions you didn't take (running more participants) should somehow contaminate the evidence you actually gathered. The data point is 100 participants showing p < .05. Why should the *process* of getting there change what that data *means*?
  *   **Philosophical Basis:** This perspective aligns more closely with Bayesian or likelihood-based approaches to inference, which focus on the weight of evidence in the observed data relative to competing hypotheses, rather than long-run error probabilities over hypothetical repetitions.

  ### The Resolution: Why the First Argument Prevails in Practice (and What You Should Do)

  1.  **The Problem of Design-Dependence:** Frequentist p-values are *inherently* design-dependent. They answer the question: "If the null hypothesis were true, and I repeated this *exact experimental procedure* (including the stopping rule) many times, how often would I see a result as extreme or more extreme than this?" Changing the stopping rule *based on the data* fundamentally changes the "exact experimental procedure" being evaluated. Your procedure was: "Collect data in batches of 20 until p < .05 or I give up." This procedure has a much higher false positive rate than: "Collect exactly 100 participants, then analyze once."
  2.  **Replicability is Key:** The primary goal of science is finding reliable, replicable effects. Practices like unplanned optional stopping demonstrably increase the rate of false positives entering the literature, leading to non-replicable findings. While the second argument has philosophical appeal, it doesn't address the practical reality that results obtained via flexible stopping rules are less trustworthy and less likely to hold up in future studies *precisely because* the nominal p-value overstates the strength of the evidence.
  3.  **Transparency is Not Enough (for validity):** Simply reporting *that* you stopped based on significance doesn't magically make the p-value valid. It explains *why* the p-value shouldn't be trusted at face value.
  4.  **What the Data Shows vs. What it Means:** The second labmate is correct that the *data point* is what it is. However, the *interpretation* and *quantification of uncertainty* (the p-value) depend critically on how the data was collected. The same numerical result (e.g., 35 "yes" out of 100) has a different evidential weight if it was the result of a single planned test vs. the endpoint of a sequential fishing expedition.

  ### What You Should Do Now

  1.  **Be Transparent in Your Methods Section:** This is non-negotiable. You **must** explicitly state:
      *   Your original target sample size (n=60).
      *   That you conducted interim analyses after n=60, n=80, and n=100.
      *   That the decision to stop data collection was made *because* the result reached p < .05 at n=100.
      *   *Do not* simply report "N = 100" without context.
  2.  **Acknowledge the Limitation:** In your discussion or limitations section, acknowledge that the use of an unplanned sequential testing procedure with optional stopping increases the risk of a Type I error (false positive) beyond the nominal 5% level. State that this limits the strength of the conclusions that can be drawn from the p-value alone.
  3.  **Consider Supplemental Analyses (If Possible/Appropriate):**
      *   **Report all interim results:** Show the effect sizes and p-values at n=60, n=80, and n=100. This transparency allows readers to see the trajectory.
      *   **Apply a Correction (Retrospectively):** While not ideal (corrections are best planned), you could calculate a corrected p-value using methods designed for sequential testing (e.g., Pocock, O'Brien-Fleming boundaries adapted retrospectively, or even a simple Bonferroni correction for 3 looks - though Bonferroni is conservative). Explain this is an attempt to account for the multiple looks. **Crucially, report both the original and corrected p-values.**
      *   **Bayesian Analysis:** Conduct a Bayesian analysis (e.g., Bayes Factor). Bayesian methods are generally less sensitive to the stopping rule (they adhere more closely to the Likelihood Principle). A Bayes Factor would provide a different quantification of the evidence *in the collected data* supporting your hypothesis vs. the null. This can be a very helpful supplement.
      *   **Focus on Effect Size & CI:** Emphasize the effect size (e.g., Cohen's d, mean difference) and its confidence interval. While CIs can also be affected by sequential testing, they often provide more useful information than a potentially invalid p-value. Is the effect size practically meaningful?
  4.  **Discuss Replicability:** Frame your findings cautiously. Highlight that the methodological approach necessitates independent replication to have greater confidence in the effect.
  5.  **For Your Committee Meeting:** Be prepared to explain the issue clearly, demonstrate your understanding of the statistical concern (alpha inflation), show your transparency in reporting, and discuss the steps you took (supplemental analyses). Show that you've learned from this. Frame it as a valuable lesson in rigorous methodology early in your PhD.

  ### Going Forward: Best Practices

  1.  **Preregistration:** This is the gold standard solution. Before collecting *any* data, publicly register your hypothesis, methods, primary analysis plan, and crucially, **your predetermined sample size and stopping rule.** If you plan interim analyses, specify the exact points and the *adjusted* significance thresholds you will use for each look to maintain the overall alpha (e.g., using a sequential design). Preregistration locks in your plan and prevents ad-hoc decisions driven by the data.
  2.  **Blind Analysis:** If feasible, analyze data blinded to condition until the final pre-registered analysis.
  3.  **Justify Sample Size A Priori:** Base your initial sample size on a power analysis for a minimally important effect size, not convenience.
  4.  **Understand Bayesian Methods:** Familiarize yourself with Bayesian approaches, which handle optional stopping more gracefully and focus directly on the evidence in the data. They are becoming increasingly common.
  5.  **Embrace Transparency:** Always report exactly what you did, warts and all. Science progresses on honesty.

  **In summary:** Your first labmate is correct that the unplanned sequential testing renders the nominal p < .05 unreliable as strong evidence against the null hypothesis due to inflated false positive risk. The second labmate raises an interesting philosophical point about evidence residing in the data, but it doesn't overcome the practical statistical reality of how p-values are defined and interpreted within the frequentist framework. **Transparency about your process and acknowledging the limitation are essential.** Use this as a crucial learning experience in methodological rigor. Preregistration is your best friend for future studies. Good luck with your committee meeting!
