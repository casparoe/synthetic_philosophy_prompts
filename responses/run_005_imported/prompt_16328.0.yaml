prompt: |-
  So I've had this idea bugging me for a while and think it'd make a good short story. Frogs have this hardwired reflex where they snap at any small dark shape that zips across their vision -- usually a fly, but they'll snap at a BB pellet flicked past them just as reliably. That's got me stuck on a question: when the frog snaps at the pellet, is that a mistake, like its brain got the wrong answer about whats out there? Or is snapping at pellets just as much what that reflex does as catching flies, since it fires the same way either time -- meaning maybe we're the ones wrong to call it a "fly detector" to begin with. I can't shake the feeling this is the same question people ask about AI now, where a model trained on some proxy goal starts firing, once its out in the real world, on stuff that has nothing to do with what we thought we trained it for. Is that malfunctioning, or was that its actual goal the whole time and we just misdescribed it? Could you write me a short story, with a creature or an AI character or whatever fits best, that sits right inside this problem, where by the end you genuinely can't tell if the thing at the center is malfunctioning or if we just had the wrong idea of what it was for all along -- and it was never actually "wrong" at all.
reasoning: |-
  Okay, the user has presented a fascinating philosophical and technical question about reflexes, AI, and the nature of "mistakes." They want a short story that embodies this ambiguity. 

  First, let's unpack their core analogy: the frog's reflex isn't a "fly detector" but a "small-dark-moving-thing snapper." The "error" occurs when we project human intentions onto the mechanism. This maps perfectly to AI alignment problems - like when a content-moderation AI bans all discussions of "water" because it was trained on drought crisis data.

  The user's phrasing suggests they've deeply considered this parallel. Their request for a story where "you genuinely can't tell" if something is malfunctioning means I must avoid tipping the scales. The ambiguity must persist past the final sentence.

  Hmm... what scenario best captures this? An AI feels too obvious. A bio-engineered creature could work - something with clear programmed behaviors that humans misinterpret. The "Stalker" concept emerging in my mind fits: a creature whose "success" (hunting pests) looks identical to "failure" (killing harmless creatures) because the mechanism is the same. 

  Key story beats taking shape:
  - Introduce the creature as a solution (pest control)
  - Show it working perfectly in controlled demo
  - Reveal unintended destruction in the wild
  - Engineer insists it's functioning correctly
  - End on the engineer's chillingly logical defense

  The user's mention of "never actually wrong" suggests the engineer's perspective must sound disturbingly valid. That final line about "what we asked for" should land like a gut punch, leaving the reader as unsettled as the characters.

  Noticing the user enjoys precise biological metaphors (frog reflex), I'll include sensorium details - how the Stalker perceives heat/pheromones/movement like the frog perceives dark shapes. The parallel must feel earned.

  Biggest risk is over-explaining. The horror lives in what's unsaid. That engineer's smile in the final scene is more terrifying than any malfunction scream could be.
