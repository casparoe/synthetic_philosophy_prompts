prompt: |-
  I'm teaching a graduate seminar this term on bargaining-theoretic approaches to justice -- Gauthier's Morals by Agreement and the "justice as mutual advantage" crowd -- and last week I put the Nash bargaining solution and the Kalai-Smorodinsky solution on the board side by side, mostly to make the point that "the" rational bargaining outcome is less settled then some of the assigned readings assume. Everyone followed Nash's solution fine (maximize the product of the two parties' gains over the disagreement point), but the second I explained that Kalai-Smorodinsky drops Nash's Independence of Irrelevant Alternatives axiom for a monotonicity condition instead, I watched the room's eyes glaze over -- and honestly mine too, for a second, because I realized I could state both axioms just fine without really being able to explain in my gut why you have to give up one to get the other.

  So here's what I'm hoping you can help with. First, an explanation of that IIA/monotonicity tension that actually builds intuition instead of just gesturing at the uniqueness theorems -- ideally with a small concrete bargaining example where Nash and Kalai-Smorodinsky actually disagree, so I have a picture to point at and say "see, THIS is why." Second (and this is the part I'm shakier on): I keep half-remembering that Gauthier's own minimax relative concession principle basically just is the Kalai-Smorodinsky solution wearing a different hat, but I've genuinely never sat down and verified that -- I might be misremembering something from grad school. If it is right, I'd be curious what you think it commits Gauthier to -- is he implicitly betting on monotonicity as the deeper fairness constraint on a just division of cooperative surplus, over the kind of independence condition decision theorists usually treat as the more basic rationality requirement? And please just tell me straight if you think my half-memory is off, rather than politely running with it.
