answer: |-
  Here’s a dialogue between Charles Sanders Peirce and William James set in 1908, moments after James’s Berkeley lecture on pragmatism. Both engage rigorously with each other’s core arguments, reflecting their documented tensions without caricature:

  ---

  **Setting:** *Backstage at Wheeler Hall, UC Berkeley. Papers strewn on a table. William James lights a pipe, looking exhilarated; Charles Sanders Peirce paces, scowling.*  

  **JAMES:** *(Cheerfully)* Charles! You caught the lecture? I rather thought you’d appreciate how I’ve carried your torch—  
  **PEIRCE:** *(Wheeling around)* Appreciate? William, you’ve set the torch to my life’s work! "Truth is what works"? You’ve reduced pragmatism to a carnival barker’s slogan!  
  **JAMES:** *(Raising hands)* Peace, peace! You know I mean more than that. When I say an idea is true if it "pays" or has "cash-value," I speak of its *practical consequences in experience*—  
  **PEIRCE:** —Which you divorce from the *community of inquiry* and the *logic of investigation*! Truth isn’t a private dividend, William. It’s what *would* be agreed upon if inquiry pursued its course indefinitely. Your version makes truth hostage to individual whim!  

  **JAMES:** *(Leaning forward)* But Charles, *inquiry* begins with individuals in real, urgent situations! If a lost hiker believes a path leads to safety and that belief *works*—guides him home—isn’t it true *for him*? Must he wait for your "final opinion"?  
  **PEIRCE:** *(Eyes blazing)* You conflate *success* with *truth*! That path "worked" because it aligned with objective terrain—facts existing independently of his desperation. Call it "expedient," call it "salutary," but do not call it "true" if it accidentally saved him while being geologically unstable! Truth is what *remains* when illusions burn away.  

  **JAMES:** *(Gesturing emphatically)* And *how* do illusions burn? Through lived consequences! You speak of the "end of inquiry" as some distant scientific utopia, but we live *now*, in a universe still unfolding. Truth *happens* to an idea—it *becomes* true through verification in action. Your "end" is a regulative ideal, yes—but my "cash-value" is how truth functions *today* for human strugglers!  
  **PEIRCE:** *(Stabbing finger at James’s lecture notes)* Then by your logic, if a demagogue’s lie "works" to soothe a mob’s anxiety, it becomes "true"! You’ve gutted truth of its *resistance to error*. My pragmatic maxim was a *logical principle* for clarifying concepts—"Consider what effects might conceivably have practical bearings; then, your conception of those effects is the whole of your conception." Not "grab whatever gives comfort"!  

  **JAMES:** *(Sighing)* You misrepresent me. The demagogue’s lie may "work" momentarily, but its long-term consequences—distrust, violence—*fail* to satisfy our broader web of needs. Truth must "march with experience" coherently! Your "end of inquiry" is but the ultimate coherence of all such verifications.  
  **PEIRCE:** *(Bitterly)* So now you borrow my scaffold—but too late! You’ve already unleashed the specter of subjectivism. If truth is "what satisfies," *whose* satisfaction counts? Yours? A mystic’s? A banker’s? Without a *logical norm* binding all rational minds, you reduce philosophy to psychology!  

  **JAMES:** *(Softly)* Charles, you divorce logic from life. Your "norm" floats in a vacuum. My truth lives in the sweat and grit of human striving—where ideas are tools, not statues. When Darwin’s theory "worked" to explain life’s complexity, it didn’t await your "end of inquiry"—it *became* truer with every fruitful application!  
  **PEIRCE:** *(Pauses, then wearily)* Darwin’s theory became truer *because* it withstood the scrutiny of communal testing, prediction, and correction—the very process that *constitutes* inquiry! Your "tool" analogy is apt, but a tool’s worth lies in its *fitness for a purpose independent of our passing fancies*. Truth is the *ideal tool that never breaks*. You mistake the handle for the forge.  

  **JAMES:** *(Smiling faintly)* Then perhaps we’re both sculpting the same statue from different sides. Your "ideal tool" is my "ultimate payoff." But I’ll not apologize for speaking to human hearts. Philosophy must matter *now*.  
  **PEIRCE:** *(Gathering coat)* And I’ll not apologize for demanding rigor. Henceforth, call *my* doctrine "pragmaticism"—a name ugly enough to deter kidnappers. Yours, William, is pragmatism. Let history judge which preserves truth from… *expediency*.  
  *(Peirce exits. James watches, then murmurs to himself:)*  
  **JAMES:** Rigor without relevance is its own illusion, old friend.  

  ---

  ### Key Disagreements Illuminated:
  1. **Truth’s Temporality**  
     - Peirce: Truth is the *ideal terminus* of investigation ("end of inquiry").  
     - James: Truth is *continuously made* through present verification ("truth happens").  

  2. **Scope of "Practical Consequences"**  
     - Peirce: Must be framed by *logical norms* and *communal scrutiny*.  
     - James: Arises from *individual experience* and *immediate needs*.  

  3. **Risk of Relativism**  
     - Peirce: James’s view risks making truth "subjective" (e.g., the demagogue).  
     - James: Peirce’s view is inert, ignoring how truth *functions* in lived reality.  

  4. **Core Metaphors**  
     - Peirce: Truth as a *communal monument* (enduring, objective).  
     - James: Truth as *currency* (fluid, transactional, experiential).  

  Neither is a strawman: Peirce defends logic’s role in anchoring truth, while James insists on its human dimension. Their clash birthed analytic vs. continental pragmatism—proof both were "scary smart."
