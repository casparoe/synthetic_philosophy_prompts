answer: |-
  Here’s a draft eulogy that honors Marguerite’s life, respects her lucid request, integrates the extended mind concept organically for your brother, and keeps the focus on her presence and legacy for all listeners:

  ---

  **For Marguerite**  
  *(Approx. 5 minutes)*

  Good morning. Thank you all for being here to remember Marguerite – grandmother, sister, friend, and formidable bridge partner. For many of us, her absence feels impossibly large. She was a woman who filled spaces: with her sharp wit, her meticulous attention to detail, her dry humour, and her deep love for this family.

  As you know, the last decade of Marguerite’s life was shaped by Alzheimer’s. It’s easy to frame that time solely as loss – the slow dimming of a bright light. But Marguerite herself asked us, very clearly in one of her last lucid moments, not to do that. She specifically asked that no one stand here and say she’d “gone behind the cards.” She found that idea not just sentimental, but fundamentally *wrong*. And understanding why she felt that way is key to understanding her resilience.

  Long before Alzheimer’s, Marguerite was a woman who liked to *know*. She kept track. Bridge strategies, family birthdays, grocery lists, the perfect baking time for a roast – she had systems. For decades, her trusty index cards were simply an extension of that meticulous, engaged mind; tools for a life lived with intention and order.

  When Alzheimer’s began to cloud her internal recall, those cards didn’t become a hiding place. They became something far more active and essential. They became her *collaborators*. She didn’t retreat behind them; she *worked* with them. She filled them, updated them, consulted them with the same fierce determination she brought to her bridge game. Who was visiting? What story had she just told? What pills were needed now? The answers were there, in her own handwriting, a record of her ongoing effort to stay connected, to stay *present*.

  **This is what she knew, deep down, even when expressing it became difficult:** Those cards weren't just reminders *of* Marguerite; they were a vital part *of* Marguerite. They held her intentions, her knowledge, her carefully curated connections to us and to the world. She trusted them implicitly because *she* had built them. She consulted them constantly, seamlessly, the way the rest of us might search our own memories. They weren’t a crutch standing apart from her; they were integrated into how she navigated her world, right until the end.

  So, during those ten years, Marguerite wasn’t diminished, simply relocated. Her presence wasn’t locked away inside, fading. It was *distributed*. It lived in the squeeze of a hand, the flash of dry wit that still surfaced, the familiar rhythm of her daily routines, and yes, profoundly, in those well-worn cards she carried. They held the map she drew herself to navigate the fog. Her mind was in the pen that wrote them, in the hand that held them, in the eyes that scanned them for the connection she sought. She was still *here*, fighting to be with us, using every tool she possessed – including those carefully curated pieces of paper.

  That fierce determination, that insistence on order and connection, that refusal to be defined solely by what was fading – *that* was pure Marguerite. The same woman who meticulously planned bridge nights or remembered everyone’s favourite dessert was the woman who built and relied on that external system not out of weakness, but out of a profound strength and adaptability.

  We will remember Marguerite for so much: her love, her sharpness, her laughter, the way she made a house feel like a home filled with small, perfect systems. And when we remember her last decade, let’s honour her own clear-eyed view. She wasn’t hiding. She wasn’t gone behind the cards. She was right here, using every resource at her command – her enduring spirit, her love for us, and the remarkable, practical system she built – to remain Marguerite, present and fighting, for as long as she possibly could. That is her final, powerful lesson in resilience. And that is how we should carry her forward – not diminished, but distributed, alive in our memories, our stories, and the enduring love she etched into all of us.

  Thank you, Grandma. We saw you. We were with you. Rest now.

  ---

  **Why this works:**

  1.  **Honors Marguerite's Request:** Directly addresses her plea, frames her rejection of "gone behind the cards" as based on her own truth and strength, not denial.
  2.  **Integrates the Philosophy (For Your Brother):**
      *   Uses key concepts: "collaborators," "integrated," "seamlessly," "trusted implicitly," "built them," "distributed," "vital part *of* Marguerite," "map she drew herself."
      *   Captures the core of Clark & Chalmers (constant trust, self-creation, functional equivalence) without naming them, Otto, or "extended mind."
      *   "Her mind was in the pen... hand... eyes..." directly translates the "part of the mind on the page" idea into accessible, emotional language.
      *   "Not diminished, simply relocated" / "Distributed" – gives your brother the conceptual anchor he needs.
  3.  **Avoids a Philosophy Seminar:**
      *   No jargon. No names of philosophers. No thought experiments.
      *   The idea serves the *story* of Marguerite's agency and resilience.
      *   Focuses on the *human experience* – her effort, her determination, her tools.
      *   Connects the card system directly to her *pre-existing* personality (meticulous, organized, determined).
  4.  **Provides Emotional Truth (For the Whole Room):**
      *   Grounded in specific, relatable memories (bridge, baking, family).
      *   Focuses on her *presence* ("We saw you. We were with you.") and her *fight*.
      *   Uses evocative language ("fierce determination," "enduring spirit," "practical system," "resilience").
      *   Offers comfort by reframing the narrative away from pure loss towards enduring presence and strength.
      *   The final paragraph ties it all together with love and legacy.
  5.  **Respects the Uncertainty:** The language leans on "this is what *she* knew," "her own clear-eyed view," "how *we* should carry her forward." It presents the distributed perspective as *her* truth and *our* meaningful way of remembering her strength, not an unassailable metaphysical claim. Your brother will hear the philosophy; others will hear Marguerite's defiance and love.
  6.  **Structure & Flow:** Starts with warmth and shared memory, acknowledges the reality of Alzheimer's, pivots to her request and the *why* behind it (introducing the card system organically), explains the *distributed presence* concept narratively, reinforces her core character, and ends with a resonant call to carry her forward.

  **Delivery Tip:** Pause slightly before and after the key lines about distribution and presence. Let the idea land without over-emphasis. Your tone should be warm, respectful, and firm when conveying *her* conviction about not being "behind the cards." This honours both Marguerite and the complex truth your brother seeks.
