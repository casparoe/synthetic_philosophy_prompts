  Next, how to structure the eulogy. Start with her character before Alzheimer's to establish her personality. Highlight her meticulous nature, her love for bridge, her sense of humor. This sets up why the index cards were a natural extension of her. Then transition into how the cards became essential, emphasizing her agency in creating and maintaining them. Use anecdotes to show her presence through the cards, like her correcting someone or her dry wit still coming through.

