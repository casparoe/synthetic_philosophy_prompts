answer: |-
  Let's break down Bentham's dense paragraph sentence by sentence, focusing on his argumentative moves and the specific questions you raised:

  ### Sentence-by-Sentence Breakdown & Analysis

  1.  **"Philosophical pride, to say nothing at present of superstition, has hitherto employed itself with effect in setting people a-quarrelling with whatever is pleasurable even to themselves..."**
      *   **Meaning:** Bentham identifies "philosophical pride" (distinct from the "superstition" he mentioned earlier) as a major motivator for moral condemnation. This pride drives people to reject things *they themselves find pleasurable*.
      *   **"Philosophical Pride" Explained:** This isn't about religion. It's about a *secular* mindset prevalent among moral philosophers and elites. Bentham means an intellectual arrogance that equates morality with self-denial, asceticism, or rejecting "base" pleasures. It's the belief that virtue lies in *opposing* natural desires simply because they *are* desires/pleasures. Think Stoic disdain for passion or Kantian emphasis on duty *over* inclination. It's pride in rising above "animal" instincts.

  2.  **"...and envy will always be disposing them to quarrel with what appears to be pleasurable to others."**
      *   **Meaning:** Alongside pride, Bentham identifies **envy** as a fundamental human motivator for moral condemnation. People resent seeing others experience pleasure, especially pleasure they themselves might deny or feel conflicted about. This makes them want to condemn or restrict others' enjoyment.
      *   **Argumentative Move:** He's shifting from an intellectual failing (pride) to a base emotional one (envy), suggesting moral condemnation often masks uglier impulses.

  3.  **"In the notions of a certain class of moralists we ought, not for any reason they are disposed to give for it, but merely because we ought, to set ourselves against every thing that recommends itself to us under the form of pleasure."**
      *   **Meaning:** Bentham summarizes the core attitude he's attacking: According to these moralists, pleasure itself is suspect. We *must* oppose pleasurable things *simply because they are pleasurable*, not because of any concrete harm they cause. Their justification boils down to "Because I said so" or "Because it's immoral," lacking any reasoned basis grounded in consequences.
      *   **"Philosophical Pride" Connection:** This is the *result* of "philosophical pride." The pride manifests as this unquestioned dogma that pleasure = bad/vice.

  4.  **"Objects, it is true, the nature of which it is to afford us the highest pleasures we are susceptible of are apt in certain circumstances to occasion us still greater pains."**
      *   **Meaning:** Bentham concedes a point his opponents *might* make: Things that give intense pleasure (like sex, food, drink, wealth) *can* also lead to significant pain (addiction, disease, financial ruin, jealousy, etc.) if misused or pursued recklessly.
      *   **Argumentative Move:** He acknowledges a potential utilitarian counter-argument *before* dismissing its relevance to the moralists' *actual* reasoning. This strengthens his case by showing he's considered the obvious objection.

  5.  **"But that is not the grievance: for if it were, the censure which is bestowed on the use of any such object would be proportioned to the probability that could be shewn in each case of its producing such greater pains."**
      *   **Meaning:** Here's his **crucial logical test**: *If* the moralists' *real* objection was the *risk of harm* (the potential pain caused by misusing the pleasurable object), then their level of condemnation ("censure") would logically be proportional to:
          *   The *severity* of the potential harm.
          *   The *probability* of that harm actually occurring in a *specific instance*.
      *   **Your Specific Question Answered:** **Yes, this is absolutely an actual logical test Bentham thinks the moralists fail.** It's core to his utilitarian critique. A *consistent* utilitarian would assess the *net expected consequences* (pleasure minus pain, weighted by probability) in each case. Bentham argues moralists *don't* do this.

  6.  **"But that is not the case: it is not the pain that angers them but the pleasure."**
      *   **Meaning:** Bentham delivers his damning conclusion based on the test: The moralists' condemnation does *not* vary based on the actual risk of harm. They condemn the pleasurable act *equally harshly* regardless of context, precautions taken, or demonstrable lack of harm. Why? Because their anger isn't triggered by the *potential pain*, but by the *existence of the pleasure itself*. The pleasure is the "grievance."
      *   **Argumentative Move:** This exposes the inconsistency and irrationality of the moralists' position from a utilitarian standpoint. Their condemnation is arbitrary, driven by emotion (envy) and dogma ("philosophical pride"), not a rational assessment of consequences.

  ### Addressing Your Specific Questions

  1.  **The "Censure Proportioned" Test:** This is **absolutely a genuine logical test based on utilitarian principles.** Bentham is arguing:
      *   Utilitarian Objection (Valid): Oppose an act if its *expected net consequences* are negative (pain > pleasure). Level of opposition should scale with the *magnitude* of expected net pain.
      *   Moralists' Practice (Invalid): Oppose an act *simply because it is pleasurable*, regardless of context or actual probability of harm. Opposition is fixed and severe, based on the *category* of pleasure, not its consequences.
      *   **Therefore:** The moralists fail the test. Their condemnation isn't proportional to demonstrable harm, proving their motivation isn't genuinely about preventing pain, but about suppressing pleasure itself.

  2.  **"Philosophical Pride" vs. Superstition:**
      *   **Distinct Failure Modes:** Bentham explicitly separates them ("to say nothing at present of superstition"). They are related (both lead to irrational condemnation of pleasure) but stem from different sources:
          *   **Superstition:** Based on irrational religious dogma, fear of divine punishment, perceived violation of sacred laws, or "unnaturalness" defined theologically.
          *   **Philosophical Pride:** Based on *secular* intellectual arrogance. It's the belief that true morality/virtue/wisdom requires rejecting or mastering "base" pleasures and desires. It's asceticism dressed up as philosophy. It stems from an intellectual elitism that scorns common pleasures and elevates self-denial as inherently noble.
      *   **Common Root:** While distinct sources, they share a fundamental **aversion to pleasure itself** as a legitimate good and motivator. Both prioritize abstract rules (divine law, ascetic principle) over the tangible experience of happiness and suffering.

  ### Bentham's Core Move in this Paragraph

  Bentham is performing a **diagnosis of moralistic hostility towards pleasure, specifically "irregular" sexual pleasure.** He argues this hostility isn't driven by:

  *   A genuine concern for preventing harm (which *would* be a valid utilitarian concern).
  *   *Instead*, it's driven by:
      *   **"Philosophical Pride":** A secular, intellectual dogma that valorizes the rejection of pleasure.
      *   **Envy:** A base emotional resentment of others' enjoyment.

  His **logical test** (censuring proportionally to probable harm) is the key evidence proving that the moralists' *stated* concern about "harm" is a smokescreen. Their *uniform* and *severe* condemnation regardless of context reveals their true target: **the pleasure itself.** He's exposing the irrational, anti-hedonistic core of traditional morality that his utilitarianism seeks to replace with a rational calculus focused on maximizing net happiness. This paragraph brilliantly dissects the psychological and intellectual underpinnings of prejudice against non-normative sexuality.
