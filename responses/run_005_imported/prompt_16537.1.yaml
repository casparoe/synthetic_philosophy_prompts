prompt: |-
  I own a unit in a small condominium building a few blocks from campus that has, over the last decade, become housing mostly for graduate students and postdocs: roughly two-thirds of the units are owned by investors who live elsewhere and rent them out on ordinary leases, while a handful of owners, myself included, actually live in the building full-time. Under our bylaws, only unit owners are members of the association, one vote per unit regardless of who actually lives there, and at next month's meeting the board will vote on a proposed rule banning short-term, Airbnb-style rentals, on the grounds that constant turnover has increased noise, security concerns, and wear on the elevators and common areas. The people who will feel the day-to-day consequences of this rule most directly are the long-term tenants, who deal with the noise and the rotating strangers in the hallway right now and could see their rents rise later if the building becomes a more attractive long-term-rental property as a result of the policy, but tenants have no vote of any kind under the bylaws, and only the owners, several of whom have never spent a single night in the building, get to decide.

  I raised this at a dinner with colleagues recently and was struck that everyone had a confident but different reaction. One person said the tenants obviously have a legitimate claim to some say, since they bear most of the real costs of the decision either way. Another said this is a non-issue: the tenants agreed to a lease under known rules, are free to leave if they dislike how the owners vote, and have no more claim to co-govern the building than a hotel guest has to vote on hotel policy. A third pointed out that if "whoever is substantially affected should get a say" is the right standard, we would also have to think about the residents of the building next door, who share our courtyard and complain about the very same noise, and maybe even the university's off-campus housing office, which steers many of these tenants to us in the first place and has its own stake in the policy. My own instinct is that the tenants are owed something the neighbors and the housing office are not, but when I try to say exactly why, without just presupposing the answer, I keep failing. My own field is philosophy of science, so this isn't a debate I have ready-made tools for from my teaching or research, but it has been nagging at me all week.

  So I would like your take. Is there something genuinely unfair about a policy like this being decided entirely by the owners, or is "you knew the deal when you signed the lease" actually a complete answer, full stop? And if you think the tenants really are owed a vote, or at least a voice, is there a principled way to say how far that reasoning should extend, one that does not simply amount to the current owners generously deciding, on their own authority, how generous to be?
reasoning: |-
  Okay, let me start by unpacking the user's query. They own a condo in a building mostly occupied by grad students and postdocs, with many units owned by absentee landlords. The condo association is voting on banning short-term rentals, but only owners get to vote, not tenants. The user feels uneasy about tenants having no say, especially since they're directly affected by the policy's consequences like noise and potential rent hikes. 

  First, I need to understand the core ethical dilemma. The user is torn between property rights (owners deciding) and the impact on tenants who live there. Their colleagues gave different views: one says tenants deserve a say because they bear the costs, another says tenants knew the lease terms, and a third extends the "affected parties" argument to neighbors and the university. The user’s instinct is that tenants are owed something more than neighbors but struggles to articulate why.

  Hmm. The user’s field is philosophy of science, so they’re used to structured arguments but might lack tools from political philosophy or ethics. They need a principled way to distinguish tenants from other stakeholders without relying on owner generosity. 

  Let me break down the key points. The fairness issue hinges on legitimacy of authority vs. impact. Property law gives owners exclusive control, but ethically, does mere ownership justify excluding those most affected? The "you knew the lease" argument treats tenants as transient, but long-term renters (like grad students) build community ties similar to owners. The harm here isn’t just contractual—it’s about daily life disruption. 

  The neighbors and university are affected too, but there’s a difference: tenants are subject to the condo association’s rules in a way neighbors aren’t. Tenants can’t opt out of hallway noise or elevator wear; they’re captive to the owners’ decisions. The university and neighbors have indirect stakes, but they aren’t governed by the association’s rules. That feels like a boundary—tenants are internal stakeholders bound by the community’s norms, whereas others are external. 

  Also, the user mentioned rents might rise if the building becomes more attractive. That’s an economic harm tenants can’t influence, even though they contribute to the community’s stability. Their lack of voice creates a power imbalance where owners benefit (higher property values) while tenants bear costs (rent hikes). 

  But how to avoid a slippery slope? If "affected" = "gets a voice," why not include neighbors? The distinction might be that tenants are part of the residential community. They share common areas, pay fees (via rent), and are integral to the building’s functioning. Their interests are directly tied to the association’s decisions, unlike neighbors who merely share a courtyard. 

  The user also wants a solution that doesn’t rely on owner generosity. Maybe procedural fairness: even if tenants don’t vote, the association could solicit input or create tenant liaisons. That acknowledges their stake without changing bylaws. Legally, owners hold power, but ethically, they should consider tenant welfare because their decisions impose real harms. 

  I recall theories like "affected interests principle" in democratic theory, but it’s messy in practice. The key is reciprocity: tenants follow rules (e.g., quiet hours), so they deserve input on rules affecting their daily lives. Owners benefit from tenant compliance, so excluding them is exploitative. 

  Ultimately, the user needs to reconcile legal rights with moral obligations. The answer isn’t giving tenants votes—that’s impractical—but creating channels for their voices. The unfairness lies in ignoring their moral claim as community members, not property holders.
answer: |-
  Your unease is well-founded—this exposes a genuine tension between formal property rights and the lived experience of community governance. Here’s a principled way to untangle it:

  ### 1. **Why tenants have a stronger moral claim than neighbors or the university:**
     - **The "Subjection Principle":** Tenants are uniquely subject to the *ongoing authority* of the condo association. They must comply with its rules (e.g., quiet hours, common area use), face fines for violations, and endure the direct consequences of decisions. Neighbors experience spillover effects but aren’t governed by the association; the university has an institutional interest but no direct submission to its authority.
     - **Relational Vulnerability:** Tenants’ homes are at stake. They’ve invested in making the building their community, unlike transient hotel guests. Their leases create a stable expectation of belonging, even without ownership. Denying them input ignores this relational investment.
     - **Exit Asymmetry:** While tenants "can leave," moving imposes high costs (financial, social, logistical)—especially for grad students. Owners face no comparable burden; they can vote remotely without disruption. "Vote with your feet" is disproportionately burdensome for tenants.

  ### 2. **Why "you knew the lease" is incomplete:**
     - **Static vs. Dynamic Consent:** Signing a lease agrees to *existing* rules, not future rule changes. Owners can impose new burdens mid-lease (e.g., banning guests, imposing fees) without tenant consent. This creates a power imbalance akin to a legislature changing laws without constituent input.
     - **Externalized Costs:** Owners (especially absentees) decide policies but don’t bear the daily consequences—tenants do. This misalignment violates basic fairness: those experiencing the costs should have input into the benefits.

  ### 3. **A principled boundary for inclusion:**
     - **The Governing Impact Test:** Stakeholders deserve input if both:
       - **(a)** They are *directly subject to the rules* (not merely affected by them), *and* 
       - **(b)** The decision *fundamentally alters their living conditions or security*.
     - Tenants meet both criteria. Neighbors fail (a); they experience noise but aren’t governed by HOA fines or elevator rules. The university fails (b); its interests are administrative, not existential to its operations.

  ### 4. **Practical solutions (without requiring a vote):**
     - **Procedural Justice:** Even without voting power, fairness demands:
       - Formal tenant consultations before votes (e.g., surveys, open forums).
       - A tenant liaison position (non-voting) on the board.
       - Mandatory disclosure of how policies impact tenants in board materials.
     - **Shared Incentive Alignment:** Propose policies acknowledging tenant stakes. Example: If the Airbnb ban increases property values (benefiting owners), a portion of HOA fees could fund tenant amenities (offsetting potential rent hikes).

  ### 5. **Why this isn’t owner "generosity":**
     - **Reciprocity:** Owners depend on tenants for building maintenance fees (via rent), community stability, and property values. Acknowledging tenant interests isn’t charity—it’s recognizing mutual interdependence.
     - **Democratic Legitimacy:** Rules are more likely to be followed voluntarily if those governed have a voice in their creation. Suppressing tenant input risks resentment and non-compliance.

  ### Applying this to your case:
  - **Short-term rental ban:** Tenants deserve formal consultation. They endure noise/security issues now and face rent hikes later. Owners should hear testimony on how turnover affects daily life.
  - **Boundary defense:** Neighbors’ noise complaints don’t trigger the Governing Impact Test—they can lobby the city or sue for nuisance but aren’t subject to condo rules. The university’s role as a housing referrer is too indirect.

  **In essence:** Property rights alone don’t resolve moral legitimacy. When governance decisions profoundly impact residents’ welfare, excluding them because they lack equity is a feudal relic. You can advocate for procedural reforms that respect both ownership and tenancy as valid forms of community membership—grounded in reciprocity, not mere legalism. This isn’t about granting votes, but about ensuring governed voices shape the rules that bind them.
