prompt: |-
  I'm about two-thirds into my current novel and I've hit a scene I don't trust myself to draft straight, so I want to farm out a rough version and then work it into my own voice after. My narrator, Dana, has to give the eulogy for her old grad school advisor, Marcus, a cognitive scientist who spent his whole career as one of the go-to defenders of the extended mind thesis -- the Clark and Chalmers stuff, Otto and his notebook, the argument that your mind doesn't stop at your skull if something outside it (a notebook, a phone, another person) is coupled into your thinking reliably enough. He was always fussy about distinguishing this from the older Putnam-style point about meanings depending on the world -- for Marcus it was never about content, it was about the process of thinking itself being partly made of stuff outside your head. His line, the one all his students quote at parties, was that where the mind "actually" ends is a boring fact about biology, not some sacred boundary worth defending.

  The scene is hard because the funeral has two audiences and Dana can feel them listening differently. Half the pews are department colleagues, including a few who spent their whole careers telling Marcus that being causally hooked up to something isn't the same as that thing being part of your mind, and they'll absolutely notice if she reaches for something the theory can't actually support. The other half is his sister and a pile of ex-undergrads who just want to hear that some part of him is still around. The easy line -- "he lives on in his notebooks, his lectures, the lab he built" -- is exactly the sentence that'll make the colleagues wince, since on Marcus's own account a notebook that nobody's brain is actively trusting and reading anymore isn't part of a mind at all, its just paper. My one beta reader called my first attempt at this speech "a nice card any dead professor could've gotten," which, fair.

  Could you write the actual eulogy Dana delivers? Something that could plausibly be read aloud in about four or five minutes, and that earns whatever comfort it offers honestly out of the theory itself, rather than quietly setting extended mind aside for the length of the speech and picking it back up again at the reception.
reasoning: |-
  Okay, the user is a writer two-thirds through their novel, stuck on a eulogy scene. The narrator, Dana, has to speak at her advisor Marcus's funeral. Marcus was a cognitive scientist who championed the extended mind thesis—Clark and Chalmers' idea that the mind isn't confined to the skull but includes external tools like notebooks or phones when integrated into cognitive processes. 

  The challenge is balancing two audiences: academic colleagues who'll scrutinize any misrepresentation of the theory, and grieving non-experts who want comfort. The user’s beta reader called their first attempt generic, so they need something authentic to Marcus’s philosophy that doesn’t resort to clichés like "he lives on in his notebooks"—which Marcus would reject since unused tools aren’t part of a mind. 

  I need to craft a eulogy that:  
  1. Stays true to extended mind theory (emphasizing active coupling, not passive objects).  
  2. Offers real comfort by reinterpreting "what remains" as ongoing cognitive processes in others.  
  3. Uses Marcus’s voice (e.g., his "boring biological fact" line).  
  4. Runs 4-5 minutes when spoken.  

  Key angles:  
  - **For experts:** Highlight that Marcus’s legacy isn’t static artifacts but the *active use* of his ideas by living minds.  
  - **For mourners:** Frame collective grief/remembrance as a form of extended cognition—Marcus’s presence persists in how he reshaped their thinking.  
  - **Avoid hypocrisy:** No claiming notebooks "contain" him; focus on dynamic engagement.  

  Structure:  
  1. **Opening:** Acknowledge tension between grief and Marcus’s worldview.  
  2. **Core theory:** Explain extended mind via his Otto example, stressing *reliable coupling*.  
  3. **Reframe loss:** Argue Marcus endures in the cognitive routines he built in others (e.g., students reaching for his concepts).  
  4. **Comfort:** Position the funeral itself as proof—their shared recall is Marcus’s mind "extended" through them.  
  5. **Close:** Return to his "boring biology" line, subverting it to affirm his lasting impact.  

  Tone should balance academic precision with warmth, echoing Dana’s voice (which I’ll leave adaptable). I’ll avoid platitudes—every sentimental point must root in the theory. For example: mourning isn’t about absence but disrupted coupling; memories aren’t "in" brains but enacted between people.  

  Finally, I’ll hint at Dana’s personal stake (e.g., her habit of mentally arguing with Marcus) to ground the speech in character. The goal: a eulogy that would make Marcus nod, while letting his sister cry without feeling talked down to.
answer: |-
  Here’s a draft of Dana’s eulogy, designed to thread the needle: honoring Marcus's rigorous extended mind thesis while offering authentic comfort rooted *in* that very theory. It runs about 4.5 minutes when read aloud at a moderate pace.

  ---

  **(Dana steps up, adjusts the mic, takes a steadying breath. She looks out at the divided crowd – the sharp, assessing eyes of the department, the raw grief of family and former students.)**

  "Thank you all for being here. For Marcus. It feels… inadequate, trying to capture him in words. Especially because Marcus spent his life showing us how inadequate words *alone* often are. How much more there is to thinking than the silent monologue in our heads.

  "Marcus wasn't just a defender of the extended mind thesis; he was its living embodiment. He didn't just *talk* about Otto and his notebook; he *was* Otto, constantly coupled with whatever tool, idea, or person helped him think better, clearer, further. His whiteboard wasn't just a surface; it was synaptic tissue. A question posed to a student wasn't just pedagogy; it was cognitive outsourcing, a bid to create a coupled system capable of tackling the problem *together*. For Marcus, the boundary of the mind wasn't sacred – it was, as he’d say with that dismissive wave, 'a boring fact about biology.' Where thinking *actually* happened was wherever the reliable coupling occurred.

  "And that’s why this is so hard. Because death… death severs the coupling. It breaks the reliability. That notebook on his desk? It’s paper now. The lecture notes meticulously filed? Just ink. The lab protocols? Instructions waiting for a process they no longer initiate. To stand here and say, glibly, 'Marcus lives on in these things'… well, Marcus would have winced. He’d have pointed out, sharply, that a notebook no one is reading, no one is trusting, no one is *integrating* into their ongoing cognitive process, is precisely *not* part of a mind. It’s inert. Isolated. Uncoupled.

  **(She pauses, lets the uncomfortable truth settle, especially among the colleagues. Then shifts.)**

  "So where does that leave us? With a mind truly, biologically, gone? With only the echo in an empty room?

  "I don’t think Marcus would say that either. Because while the *artifacts* are now uncoupled, the *processes* he built, the *systems* he reliably plugged into, and crucially, the *couplings he forged within us*… those are very much alive. They are still running.

  "Think about it. When I hit a conceptual wall in my own work, I don’t just *remember* Marcus’s arguments about parity and process. I *reach* for them. I actively recruit them. I trust them to be there, reliable as Otto trusted his notebook. I offload the problem onto the cognitive system Marcus helped build *in me*. His framework isn't a memory; it's an active tool I deploy. It’s coupled into *my* thinking, right now, as I wrestle with this loss. And I know I’m not alone in this.

  **(She gestures subtly towards the ex-undergrads, the grad students.)**

  "How many of us, this past week, found ourselves turning a problem over, only to hear Marcus’s voice – not a phantom, but the reliable, internalized echo of his reasoning – offering a path? 'Consider the coupling,' it says. 'Where is the process distributed?' That voice, that *process*, isn't Marcus's ghost. It *is* Marcus's mind, extended. It’s the cognitive routine he built, now reliably coupled into *our* biological systems. His thinking process has become part of ours. It’s active. It’s working. It’s thinking *through* us.

  "The department might call it 'internalization' or 'learning.' Marcus would insist it’s more. It’s the *persistence* of the coupled system. His mind isn't trapped in the past tense; aspects of its functional architecture are operational *now*, distributed across the neural pathways of everyone he taught, debated, and collaborated with. When we use his tools, when we think *with* his concepts as reliably as we think with our own memories, Marcus is *present* in that cognitive act. Not as content recalled, but as process enacted.

  "And today? Right now? Look around. This shared grief, this collective remembrance – it’s not just emotion. It’s a complex, distributed cognitive event. We are *actively coupling* through shared stories, through the palpable weight of his absence in this room he knew so well. We are triggering each other's Marcus-systems. We are, quite literally, *thinking together* about Marcus, *using* the cognitive extensions he gave us. In this moment, fueled by our shared history and reliable interaction, Marcus’s mind is extended across this room, across this network of coupled brains. It’s fragile, it’s temporary, but it’s real. It’s the thesis, made manifest in mourning.

  "So no, Marcus doesn’t 'live on' in the inert notebook. But he *persists* in the active, reliable use of the cognitive tools he built. He persists in the way his students still reach for his arguments as naturally as Otto reached for his pen. He persists in the ongoing arguments we’ll have about his work – arguments that *require* his concepts as active participants. He persists in the lab not as a physical space, but as a set of protocols and questions that continue to reliably couple new minds into a system he designed.

  "The biological boundary was indeed boring to him. What mattered was the vibrant, messy, extended process of thought spilling out into the world. That process hasn't stopped. It’s just distributed differently now. It’s coupled through us. So long as we think *with* him, so long as we reliably recruit the systems he built, Marcus remains part of the thinking world. Not as a relic, but as an active component in the extended minds he helped create. That’s the comfort his theory offers, honestly. That’s the legacy of a mind that never believed it ended at the skull. Thank you."

  ---

  **Why this works for your needs:**

  1.  **Earns the Comfort via Theory:** The comfort doesn't come from abandoning extended mind for platitudes. It comes from a rigorous *application* of it: Marcus persists not in objects, but in the *active, reliable cognitive processes* he instantiated in others (the "Otto reaching" metaphor repurposed). The funeral itself becomes a demonstration of distributed cognition.
  2.  **Satisfies the Colleagues:** It directly addresses the "inert notebook" problem. It emphasizes *process* over *content*, *reliable coupling* over mere external objects, and *current function* over passive storage – all core to Marcus's (and Clark & Chalmers') thesis. It avoids the "lives on in his work" cliché by showing *how* the work lives *through* active use.
  3.  **Offers Comfort to Non-Experts:** By focusing on the *experience* of "reaching for his ideas," "hearing his voice," and the shared act of remembrance as a *current* coupling, it provides tangible, emotional resonance. The "extended mind" becomes relatable through personal cognitive experience and shared ritual.
  4.  **Uses Marcus's Voice:** The "boring biological fact" line is incorporated meaningfully. The emphasis on *process* and *coupling* over static objects or semantic content reflects his fussiness. The Otto reference grounds it in the classic example.
  5.  **Plausible Length & Tone:** Reads as a thoughtful, slightly academic but deeply felt eulogy delivered by a former student. It acknowledges the difficulty and the different audiences without pandering.
  6.  **Dana's Perspective:** The line "It’s the thesis, made manifest in mourning" shows Dana actively interpreting the scene through Marcus's lens, which is key. The description of her *using* his arguments to process her grief adds a personal layer.

  **Next Steps for You:**

  *   **Infuse Dana's Voice:** Read this aloud. Where does it sound too formal? Where would Dana use a more specific memory, a shorter sentence, a wry aside? Maybe she stumbles slightly on a complex phrase? Maybe she adds a tiny, personal example ("Just Tuesday, I was wrestling with X, and I swear I felt him nudge me towards Y...").
  *   **Contextualize:** Add Dana's physical sensations (lump in throat, cold mic, the weight of the colleagues' eyes), her internal thoughts before/after, or brief reactions from the crowd (a colleague nodding slowly, a student wiping tears with a new understanding).
  *   **Trim/Expand:** Adjust length if needed, but the core argument is there. You could shorten the central explanation slightly if Dana feels the colleagues are getting restless, or expand the personal application moment.

  This draft provides the core intellectual and emotional argument grounded in the extended mind thesis. Now you can layer Dana's unique voice, her specific memories of Marcus, and her immediate experience of delivering this speech under pressure. Good luck – it's a fantastic, challenging scene!
