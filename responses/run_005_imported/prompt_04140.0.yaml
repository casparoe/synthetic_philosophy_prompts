answer: |-
  ## The Marsh Debate: Function in the Swamp

  **Setting:** A misty clearing near a marsh at dusk. Fireflies blink. Two philosophers, **Elara** (defending Wright’s Etiological Account) and **Silas** (defending Cummins’s Causal-Role Account), sit on weathered logs, their debate echoing the swamp’s quiet hum.

  **Characters:**
  *   **Elara:** Sharp, precise, gestures emphatically. Believes function is anchored in history.
  *   **Silas:** Relaxed, observant, speaks with calm conviction. Believes function is defined by current causal contribution.

  **(The dialogue begins as Silas watches a frog leap into the murky water.)**

  **Silas:** See that? Perfect coordination. The leg muscles *function* to propel, the eyes *function* to track prey, the tongue *functions* to capture it. A beautiful causal system, each part playing its *current* role in the frog’s capacity to survive and feed. Cummins got it right: function is about what a trait *does now* within its containing system. Why drag history into it?

  **Elara:** (Leaning forward) Because, Silas, what it does *now* is utterly arbitrary without history! Your "function" is merely a description of causal contribution. It tells us *what* happens, not *why* it’s supposed to happen, not what it’s *for*. Take Davidson’s Swampman. Poof! By cosmic accident, a molecule-for-molecule duplicate of me coalesces right here in this marsh. It has a heart, structurally identical to mine. It beats. It pumps blood. Does its heart have the *function* of pumping blood?

  **Silas:** Of course it does! Look at the system! The Swampman’s body is identical to yours. Its heart *causally contributes* to circulating oxygen and nutrients, maintaining blood pressure – all capacities crucial for the *current* survival and operation of its system. Without that pumping, the system fails. That *is* its function, right here, right now. History is irrelevant to the current causal dynamics.

  **Elara:** Irrelevant? Then you rob the word ‘function’ of its normative force! *Why* is pumping blood the *right* thing for that heart to do? Why is it *supposed* to do that? On your view, it’s just one causal effect among many. The heart also makes a thumping sound. Is *that* its function? It wears out tissue. Is *that* its function? You have no principled way to pick out *the* function from the myriad effects. Only history provides that. My heart pumps blood *because* that effect is why ancestors with pumping hearts were selected *for*. That’s what makes pumping its *proper* function. Swampman’s heart? It just *happens* to pump. It wasn’t *selected for* anything. It has no proper function; it merely has an effect.

  **Silas:** You say I rob it of normativity, but you make function hostage to the past in a way that’s absurdly restrictive! Look at Swampman walking, breathing, *thinking* about philosophy by this swamp. Its heart is pumping blood, enabling all of that. To deny that its heart *functions* to pump blood *now*, simply because no ancestors were selected, is to deny the palpable reality of its current, organized, life-sustaining activity! It *is* contributing crucially to a system capacity *right now*. That *is* its function *now*. Your history requirement renders a perfectly functional organism, indistinguishable from you or me in every physical and behavioral respect, completely *dysfunctional* by definition. That’s the real cost, Elara: your view divorces function from present reality.

  **Elara:** It doesn’t divorce it; it grounds it! Without history, your “function” is just a snapshot description. How do you handle *malfunction*? That’s the real cost of *your* view, Silas. Suppose I have a heart defect. My valve is malformed. It fails to pump blood effectively. It *causally contributes* to circulatory collapse – a very significant contribution to a system capacity (or incapacity)! On your purely causal-role view, isn’t *causing collapse* its current function? After all, it’s contributing crucially to the system’s current state of failure. But that’s absurd! We say it’s *malfunctioning* – it’s *failing* to perform its function. My etiological view explains this perfectly: it’s failing to pump blood *because that’s what it was selected to do*. Swampman’s heart, even if it pumps perfectly, isn’t *supposed* to do anything. It can’t malfunction; it can only do what it does. Your view collapses the distinction between function and malfunction.

  **Silas:** Not at all. Malfunction is defined *relative to the typical causal role that sustains the system*. In a healthy human system, the heart’s typical causal contribution is pumping blood effectively. When it contributes causally to system failure *instead* – when it fails to fulfill its *typical* causal role in maintaining the system's capacities – it malfunctions. We compare its *current* causal contribution to the *standard* causal contribution within that *type* of system. The normativity comes from the system’s organization and typical operation, not from dusty history. For Swampman, its heart *is* fulfilling the typical causal role for a human heart *in the context of its own identical system*. Therefore, it *is* functioning properly. Your history requirement injects an unnecessary and inaccessible ghost into the machine.

  **Elara:** Typical causal role? Defined by *what*? By looking at *other* systems that *do* have a history? You’re smuggling in etiology through the back door! You rely on the *type*, and the type is defined by shared evolutionary history! Without that, “typical” is just statistical. If most hearts pumped sludge tomorrow due to some catastrophe, would pumping sludge become their function? No! It would be a malfunction of the environment or a pathological change. Function persists *because* of what the trait was *for*, even when it can’t do it. Swampman has no “for.” It has only physics and accident. Its heart beats, but it has no function. Mine beats *and* has a function, grounded in the reason it exists. That difference matters.

  **Silas:** It matters only to the historian, Elara, not to the biologist studying the living organism before them. The causal role *is* the function for the system as it exists. Swampman’s heart sustains its life *now*. That’s function enough. To say it lacks function because it lacks ancestors is to prioritize a story over the biological reality unfolding in the present. My view explains malfunction as deviation from the system-sustaining norm *observed* in the organism type. Yours makes a profound mystery out of a duplicate that works perfectly.

  **Elara:** And yours makes a mystery out of *why* pumping, and not thumping, is the function. Why we feel justified in calling a non-pumping heart *broken*, even if it contributes spectacularly to collapse. History solves those mysteries. Swampman remains the ultimate challenge for you: a system screaming "function!" but built on sand. Without roots, it has no *telos*, only happenstance. Its heart beats, Silas, but it does not *function*.

  **Silas:** (Watching a firefly) It lives, Elara. It sustains itself. It interacts. Its heart pumps life through its veins. That causal contribution *is* its function, as real and present as this marsh at dusk. History is a record; function is an activity. Swampman’s activity is undeniable. I’ll take the living present over the evolutionary past.

  **(They fall silent, the gulf between historical explanation and current contribution as wide and misty as the swamp itself. The fireflies blink, indifferent to both accounts.)**
