answer: |-
  You've pinpointed a crucial tension between Hume's broader concept of convention and Lewis's more precise game-theoretic definition. Let's break down the passage and the disanalogy:

  1.  **Hume's Core Concept of Convention:**
      *   **Mutual Recognition of Common Interest:** Individuals recognize that adhering to a rule (e.g., respecting possession) benefits everyone, including themselves.
      *   **Mutual Expression & Knowledge:** This sense of common interest is communicated and known to all involved.
      *   **Conditional Resolution:** Each individual resolves to follow the rule *on the condition* that others do likewise.
      *   **Reference to Others' Actions:** Actions are performed based on the expectation that others will perform their part.
      *   **Gradual Emergence & Reinforcement:** Conventions arise slowly and gain strength through repeated experience of the *inconveniences* of non-compliance. This experience builds *confidence* in future compliance.
      *   **Distinct from Promise:** It's a foundational practice preceding promises, grounded in reciprocal expectation, not explicit commitment.

  2.  **The Disanalogy in Hume's Examples:**
      *   **Rowing a Boat (Pure Coordination):** This perfectly fits Lewis's model. Both rowers have a strong common interest in coordinating their strokes. Any synchronized pattern (stroke rate, timing) is roughly equally good. Neither gains by unilaterally changing their stroke pattern if the other is consistent; they only lose by causing chaos. Indifference among equilibria is high.
      *   **Language (Coordination with Network Effects):** While not perfectly indifferent (some sounds/structures might be easier), the primary function is coordination of meaning. Once established, no speaker gains by unilaterally changing the meaning of a word; they only lose intelligibility. Unilateral deviation is self-defeating.
      *   **Money (Coordination with Network Effects):** Similar to language. Gold/silver become the focal point. Unilaterally refusing to accept them as payment is irrational; demanding something else is costly and unlikely to succeed. The convention sustains itself.
      *   **Respecting Possession (Assurance Game / Iterated PD):** This is fundamentally different. **The temptation to defect *persists* even after the convention is established.** While there's a massive common interest in the *system* of property existing, *in any single interaction*, an individual often stands to gain *locally* by seizing another's possession (if they can get away with it). Adherence requires *assurance* that others will adhere and that defection will be punished (by social sanction, loss of future cooperation, or force). This resembles an Assurance Game (where mutual cooperation is best, but unilateral defection is tempting if you fear the other will defect) or, more strongly, an Iterated Prisoner's Dilemma, where the shadow of the future and potential punishment sustains cooperation. Unilateral deviation *can* be locally beneficial.

  3.  **Does Hume Notice the Disanalogy?**
      *   **No Explicit Sign:** Hume presents all these examples seamlessly under the single umbrella of "convention" arising from a "general sense of common interest." He uses the phrases "in like manner" for language and money, directly comparing them to property. He does *not* pause to distinguish the incentive structure of property respect from that of rowing or language.
      *   **Implicit Clues?** He *does* address the persistence of the temptation and the need for reinforcement:
          *   "acquires force by a slow progression, and by our repeated experience of the inconveniences of transgressing it."
          *   "this experience assures us still more, that the sense of interest has become common to all our fellows, and gives us a confidence of the future regularity of their conduct: And it is only on the expectation of this, that our moderation and abstinence are founded."
      *   **Interpretation:** Hume recognizes that property norms require *ongoing reinforcement* through experience of the *costs* of violation (inconveniences) and the building of *confidence* in others' compliance. This implicitly acknowledges that the temptation to defect doesn't vanish. However, he frames this reinforcement as strengthening the *same* underlying mechanism of mutually recognized common interest and conditional reciprocity that governs the rowboat example. He doesn't explicitly categorize property as having a different *type* of strategic problem requiring different enforcement mechanisms; he sees the "repeated experience of inconveniences" as *solidifying* the convention, not as addressing a fundamentally different strategic logic.

  4.  **Lewis's Gloss: Formalization or Narrowing?**
      *   **Both, but Primarily a Narrowing for Precision:** Lewis's analysis is a brilliant formalization of *one core aspect* present in Hume – the conditional reciprocity and self-perpetuation seen clearly in pure coordination problems like the rowboat, language, and money. He extracts this core logic and defines it rigorously.
      *   **The Narrowing:** Lewis explicitly *excludes* situations like the Prisoner's Dilemma or Assurance Game from his definition of a "coordination problem" and thus from conventions *in his strict sense*. For Lewis:
          *   A coordination problem requires multiple strict Nash equilibria.
          *   Players must be indifferent (or nearly so) among these equilibria.
          *   No player has an incentive to deviate unilaterally *from any equilibrium*.
      *   **Property Doesn't Fit Lewis's Box:** Respecting property, as Hume describes it, doesn't meet these criteria. Once "respect" is the norm, unilateral *defection* (theft) is *not* an equilibrium (the thief might be punished), but mutual defection (chaos) might be another bad equilibrium. Crucially, there *is* a local incentive to defect from the cooperative equilibrium (respect) *if* you think you can get away with it. This violates the "no incentive to deviate from the equilibrium" condition of Lewis's strict coordination problem. It's an Assurance Game/Iterated PD equilibrium sustained by different dynamics (repeated interaction, sanctions).
      *   **Hume's Broader View:** Hume uses "convention" more broadly to encompass *any* stable pattern of mutually beneficial, reciprocal behavior arising from the recognition of common interest and conditional expectation, *regardless* of whether the underlying game is pure coordination or requires additional enforcement mechanisms to overcome persistent temptations. Property, language, and rowing all fall under this umbrella for him. The "repeated experience of inconveniences" is part of how the convention *works* for property, not a sign it's different in kind.

  **Conclusion:**

  1.  **Hume's Blind Spot:** You are correct. Hume does not explicitly acknowledge the strategic disanalogy between his examples. He treats property respect as fundamentally the same *kind* of convention as rowing a boat or using language/money, relying on the same core mechanism of mutually recognized conditional interest.
  2.  **Lewis's Contribution & Limitation:** Lewis provides a powerful formalization of the logic underlying Hume's *pure coordination* examples (rowing, arguably language/money). However, in doing so, he necessarily *narrows* the concept of "convention." Property, as described by Hume, with its persistent temptation to defect requiring reinforcement through experience of "inconveniences" (sanctions), falls outside Lewis's strict definition. It represents a different type of equilibrium (Assurance/Iterated PD) sustained by different mechanisms.
  3.  **Lewis's Gloss:** It is therefore accurate to say Lewis's celebrated gloss is **a formalization *and* a quiet narrowing** of Hume's broader, more intuitive notion. Lewis captures the essence of conditional reciprocity but restricts it to a specific game structure (coordination problems with multiple equilibria and indifference) that Hume's property example does not perfectly fit. Hume's concept encompasses a wider range of stable, mutually beneficial social norms, including those requiring ongoing enforcement against persistent individual temptations. Lewis's definition is sharper but less encompassing than Hume's original usage in the passage you cite. Your insight into the Prisoner's Dilemma structure of property is key to seeing this distinction.
