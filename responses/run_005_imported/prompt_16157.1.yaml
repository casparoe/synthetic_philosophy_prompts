prompt: |-
  I sit on the internal governance committee for Meridian Analytics' employee forecasting platform, a Hanson-style subsidized prediction market that leadership built with the standard no-trade-theorem worry already in mind: if everyone shares a common prior and reasons like a good Bayesian, a colleague's willingness to take the other side of your bet should, per Aumann, already tell you your apparent information edge is illusory, so without a subsidized market maker absorbing the other side there might be no volume at all. Lately the platform's most actively traded contract asks whether the Atlas project will ship on schedule, and its largest and most consistently profitable trader is Priya, a senior engineer who also sits on the review board that grants schedule extensions -- she is, in effect, trading on private information her own board generates. Several other employees have quietly stopped trading Atlas contracts, reporting in exit surveys that a large Priya position now reads as an announcement that the question is already settled, and contract volume has fallen by more than half since the pattern became visible. Our written trading policy requires only that positions "reflect good-faith, individually held beliefs" and says nothing about board members trading on matters within their own purview. Please draft the committee's decision memo recommending a specific, adoptable policy on insiders trading on markets that touch their own institutional authority -- with a concrete rule and a timeline for next week's meeting -- and give a candid account of what the platform's core purpose would lose if Priya's trading were restricted.
reasoning: |-
  We are drafting a decision memo for the internal governance committee of Meridian Analytics regarding the issue of insider trading on their prediction market, specifically focusing on Priya, a senior engineer and review board member who is trading on private information generated by her own board.

  Key Issues:
  1. Priya, as a member of the review board that grants schedule extensions for the Atlas project, is trading on the contract about the Atlas project shipping on schedule. This gives her access to non-public information and the ability to influence the outcome (by granting or denying extensions).
  2. Other employees have stopped trading because they interpret Priya's large positions as a signal that the outcome is already determined, leading to a significant drop in trading volume (over 50%).
  3. The current policy only requires that positions reflect "good-faith, individually held beliefs" and does not address conflicts of interest.

  Proposal:
  We need to recommend a specific, adoptable policy that addresses insiders trading on markets that touch their own institutional authority. The policy should include a concrete rule and a timeline for implementation.

  Considerations for the Policy:
  - The goal is to maintain the integrity and purpose of the prediction market, which is to aggregate information and provide accurate forecasts.
  - The platform's core purpose would be undermined if insiders with private information and authority over outcomes can trade, because:
    a) It discourages participation by others (as seen by the drop in volume).
    b) It may distort the market price, making it less reflective of the collective information and more reflective of the insider's private information and actions.
    c) It creates a conflict of interest: Priya could potentially influence the outcome (by deciding on extensions) to benefit her trading position.

  However, we must also consider what the platform would lose if we restrict Priya's trading:
  - Priya, being close to the project and the review board, likely has valuable information. Restricting her trading might remove that information from the market, potentially making the market less efficient and the forecast less accurate.
  - The prediction market was designed with the idea that subsidized market makers would encourage volume. If we restrict a key informed trader, we might lose volume and information.

  But note: The drop in volume by more than half because others are leaving the market is a strong indicator that the current situation is detrimental. The market without Priya's influence might be more robust and attract more diverse information.

  Proposed Rule:
  We propose that employees who have decision-making authority over an event that is the subject of a prediction market contract, or who have access to non-public material information about that event, should be prohibited from trading in that contract.

  Concrete Rule:
  "No employee may trade in any prediction market contract if they (a) are in a position to make decisions that could influence the outcome of the event, or (b) have access to material non-public information about the event that is not available to the general employee population. This prohibition applies from the time the contract is created until the event is resolved."

  Timeline:
  - Present the proposed policy at next week's committee meeting.
  - If approved by the committee, the policy will be circulated for a 7-day comment period among all employees.
  - After the comment period, the committee will meet again to review feedback and finalize the policy, with an effective date 14 days after finalization.

  Draft Memo:

  ---

  **MEMORANDUM**

  To: Internal Governance Committee  
  From: [Your Name/Committee Chair]  
  Date: [Current Date]  
  Subject: Proposed Policy on Insider Trading in the Employee Forecasting Platform  

  ### Background
  The Meridian Analytics employee forecasting platform is a subsidized prediction market designed to aggregate dispersed information and generate accurate forecasts about company projects. Recently, concerns have arisen regarding trading by employees who have institutional authority over the events being traded. Specifically, the Atlas project contract has seen a significant decline in trading volume (over 50%) due to the trading activity of Priya, a senior engineer and member of the review board that grants schedule extensions for the Atlas project. Priya's position on the board grants her access to non-public information and the ability to influence the outcome. The current trading policy does not explicitly address this conflict of interest.

  ### Issue
  The committee has identified a conflict of interest and potential misuse of private information when employees trade in contracts that are directly related to their decision-making authority. This situation has led to a loss of confidence in the market, as evidenced by reduced participation and volume. The platform's core purpose of aggregating diverse information is undermined when other employees withdraw because they perceive the market as being dominated by an insider with superior information and influence.

  ### Proposed Policy
  To maintain the integrity and effectiveness of the prediction market, the committee proposes the following rule:

  > **Insider Trading Prohibition**: No employee may trade in any prediction market contract if they (a) are in a position to make decisions that could influence the outcome of the event, or (b) have access to material non-public information about the event that is not available to the general employee population. This prohibition applies from the time the contract is created until the event is resolved.

  This rule aims to prevent conflicts of interest and the use of non-public information, ensuring that the market remains a level playing field that encourages broad participation.

  ### Timeline
  1. **Next Week's Meeting (Date: [Date of next meeting])**: The committee will review and discuss this proposed policy.
  2. **After Committee Approval**: The policy will be circulated to all employees for a 7-day comment period.
  3. **Following the Comment Period**: The committee will meet to review feedback and finalize the policy. The effective date will be 14 days after finalization.

  ### Impact on Platform Purpose
  The platform's core purpose is to aggregate information efficiently. Restricting insiders like Priya from trading on contracts within their purview may result in the loss of her specific information, which is valuable and might lead to less precise forecasts in the short term. However, the current situation has already caused a substantial drop in participation and volume, which is more damaging to the market's information aggregation function. Without broad participation, the market cannot reflect the collective intelligence of the employees. The proposed rule is expected to restore confidence and encourage a wider range of employees to trade, ultimately leading to more robust and accurate forecasts.

  ### Recommendation
  The committee recommends the adoption of the proposed Insider Trading Prohibition policy to address the conflict of interest and restore trust in the forecasting platform. We urge the committee to approve the policy at next week's meeting so that the comment period can begin promptly.

  ---
answer: |-
  **MEMORANDUM**  
  To: Internal Governance Committee, Meridian Analytics  
  From: [Your Name], Chair, Internal Governance Committee  
  Date: [Current Date]  
  Subject: Policy Recommendation on Insider Trading in Employee Forecasting Platform  

  ### I. Background and Issue  
  The employee forecasting platform is a Hanson-style subsidized prediction market designed to aggregate dispersed information and produce accurate forecasts. Recent activity on the "Atlas Project Ship Date" contract has revealed a critical flaw: Priya, a senior engineer and member of the schedule extension review board, is consistently profitable due to her access to non-public information and decision-making authority over the event’s outcome. This has led to a >50% decline in trading volume, as employees perceive her positions as signaling pre-determined outcomes, undermining market participation.  

  The current policy (requiring "good-faith, individually held beliefs") fails to address conflicts of interest when institutional insiders trade on outcomes they influence. To preserve platform integrity, we must implement a clear rule restricting such trading.  

  ---

  ### II. Proposed Policy: Insider Trading Restriction  
  **Rule:**  
  *"Employees with direct institutional authority over an event (e.g., approval/veto power, decision-making discretion) or access to non-public material information about that event are prohibited from trading in prediction market contracts directly linked to that event. This includes serving on boards, committees, or roles that materially influence the event’s outcome."*  

  **Key Details:**  
  - **Scope:** Applies to events where the employee has ongoing decision-making power (e.g., Priya’s role on the extension review board for Atlas).  
  - **Material Information:** Covers non-public data generated by the employee’s role (e.g., internal deliberations, pre-announcement decisions).  
  - **Enforcement:** Positions violating this rule will be voided, and repeat offenses may trigger formal censure.  
  - **Exclusions:** General project contributors without decision authority may still trade.  

  **Timeline:**  
  1. **Next Week’s Meeting (Draft Approval):** Present policy for committee vote.  
  2. **48 Hours Post-Approval:** Circulate draft to legal/compliance for review.  
  3. **72 Hours Post-Legal Review:** Launch employee awareness session.  
  4. **Effective Date:** Policy enforced 24 hours after awareness session.  

  ---

  ### III. Impact of Restricting Priya’s Trading: Risks to Platform Purpose  
  **Core Purpose at Stake:** The platform relies on *subsidized liquidity* to overcome Aumann-style consensus traps. If Priya is restricted, we risk:  
  1. **Loss of High-Quality Information:** Priya’s trades incorporate valuable, precise signals about project viability (e.g., technical roadblocks, team morale). Removing her input may reduce forecast accuracy for Atlas-related contracts.  
  2. **Reduced Incentive for Expertise:** Insiders closest to decisions often hold the best information. Barring them may disincentivize expert participation, shifting the market toward less-informed traders.  
  3. **Temporary Volume Decline:** Priya’s activity drives liquidity. Short-term volume may drop further before recovering.  

  **Mitigating Factors:**  
  - **Long-Term Volume Recovery:** Current volume loss stems from *distrust*, not lack of insiders. Neutralizing conflicts may restore participation from excluded employees.  
  - **Information Substitution:** Priya’s insights could be redirected via anonymous channels (e.g., sealed forecasts) or synthesized by market makers.  
  - **Systemic Integrity:** Accuracy gains from diverse participation outweigh losses from one insider. A market seen as "rigged" loses all value.  

  ---

  ### IV. Recommendation  
  We recommend adopting the proposed policy to eliminate conflicts of interest and rebuild trust. Priya’s edge stems from **privileged access to decisions she influences**, not mere expertise. This violates the spirit of "individually held beliefs" by introducing asymmetric information derived from institutional power.  

  **Path Forward:**  
  - Vote to approve the policy draft at next week’s meeting.  
  - Task Compliance with implementing enforcement protocols by [Date + 7 Days].  
  - Commission a 30-day review of volume/accuracy metrics post-implementation.  

  **Approved by:**  
  [Your Name]  
  Chair, Internal Governance Committee  

  ---  
  **APPENDIX: Rationale for Policy Design**  
  - **Why Not Disclosure?** Mandating position disclosures (e.g., "Priya holds 500 YES") would worsen the chilling effect, as her trades would become even stronger signals.  
  - **Why Not Recusal from Decisions?** Priya’s board role gives her advance knowledge; recusal alone doesn’t eliminate information asymmetry.  
  - **Subsidy Preservation:** The market maker remains to absorb trades, ensuring liquidity once trust is restored.
