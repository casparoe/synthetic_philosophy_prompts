  One angle is the loss of information. When judges vote only on the conclusion, their reasoning on individual premises isn't captured. This could be problematic in legal contexts where understanding the rationale matters. For example, if an appeals court reviews the case, they might need to know why the decision was made. If the majority voted for liability but disagreed on the premises, it's harder to pinpoint errors in reasoning.

  Another point is doctrinal paradoxes. The discursive dilemma is a specific case, but there are broader aggregation problems. Judgment aggregation deals with interconnected propositions. The issue arises when the group's set of judgments is logically inconsistent even if each individual's is consistent. Switching to conclusion-based voting sidesteps inconsistency for that specific decision but doesn't address the general problem when multiple interconnected issues are involved.

  The user’s professor might be emphasizing that different voting methods serve different purposes. Premise-based voting ensures logical coherence between premises and conclusion, which is crucial in legal systems where consistency in reasoning is valued. Conclusion-based prioritizes the outcome but might mask disagreements on the legal reasoning. 

