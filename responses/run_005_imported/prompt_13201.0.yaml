  2. **Flicker of freedom (a)**: This defense (by Ginet, Wyma, and others) argues that even in Frankfurt cases, there is a "flicker" of alternative possibility (e.g., the agent might have chosen differently before the intervener acts). It aims to rescue PAP by showing that alternative possibilities are still present. However, these alternatives are often deemed too thin to ground responsibility (e.g., the alternative might be just the absence of a sign). It has partial success because it points out a feature of Frankfurt cases, but it doesn't fully rescue PAP in a robust way.

  3. **Widerker's W-defense (b)**: This objects that Frankfurt cases presuppose determinism (or at least, that the agent cannot do otherwise) in the actual sequence, thus begging the question against libertarians. It aims to show that Frankfurt's argument fails against libertarians. This is a strong objection because it points out a dialectical weakness: if the Frankfurt case is set up to ensure the agent cannot do otherwise, then it assumes what it is trying to prove against the libertarian. However, some Frankfurt-style cases have been adjusted to avoid this, so it is not entirely decisive.

  4. **Kane's response (c)**: Kane, a libertarian, uses "self-forming actions" (SFAs) that occur prior to the Frankfurt scenario. These are undetermined choices that shape the agent's character, and then in the Frankfurt scenario, the agent acts from that character without alternatives. He aims to show that responsibility can be grounded in the SFA even if in the immediate situation there are no alternatives. This is a strong response because it tries to accommodate the intuition behind Frankfurt cases while preserving a libertarian core. However, it has been criticized for pushing the responsibility question back to the SFA, which might face the same challenges.

