prompt: |-
  Ok so this has been bugging me since my econ elective last week. We got into this whole side debate about whether you can ever actually know what a person wants, versus just what they SAY they want out loud. My friend Mia's take was basically that talk is cheap and the only real evidence of what someone wants is what they actually pick when they have a choice in front of them, everything else is just noise. I pushed back a little but I didnt have a great argument ready.

  Then I brought up my own situation, which is what's actually bugging me. I keep telling my parents (and myself, tbh) that getting into a good college is my #1 priority this year. But almost every night I end up scrolling youtube for like 2-3 hrs instead of doing the homework I said id do, even tho I know its gonna hurt my grades. Mia's argument was that this basically proves youtube is what I actually want more, no matter what priorities I claim to have, like my actions are the "real" truth and my stated goals are just me talking. That felt wrong to me somehow, like there should be a difference between what you want in the moment vs what you want deep down, but when I tried to explain that to her I just sounded like I was making excuses for slacking off lol.

  So is Mia basically right that choices are the only honest measure of what someone actually wants, and stuff like "priorities" or "goals" are kind of meaningless if they dont match your behavior? Or is there an actual argument for why what I choose in the moment and what I "really" want could be two different things without that just being a cope? Kinda want a real answer i can bring back to her, not just a "well it's complicated" type of response.
