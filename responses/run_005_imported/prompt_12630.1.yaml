  Hmm... the college prep vs YouTube scenario is classic intertemporal conflict. The user feels their nightly procrastination contradicts their stated priority, but labeling YouTube as their "real" preference oversimplifies human psychology. I should address both the theoretical framework Mia represents and the lived experience the user describes.

