  - Momentary preference (what feels urgent now)
  - Reflective preference (what aligns with long-term values)
  - Behavioral patterns (what we consistently do)

  Ah! The user already hinted at this with "want in the moment vs deep down." That's the opening to introduce concepts like hyperbolic discounting and self-control problems. Behavioral economics actually has models for this exact disconnect.

  Important not to dismiss Mia's view entirely though. There's truth that consistent behavioral patterns do shape identity. But the error is equating single actions with fundamental preferences. I should use analogies like "sneeze vs immune system" to show how actions can be symptoms rather than revelations.

  For the user's personal struggle, they need validation that their conflict is normal, but also practical framing. Calling it "akrasia" gives them a precise term to counter Mia's oversimplification. The identity reinforcement strategy could help - "I am someone who values education" makes lapses feel like exceptions rather than revelations.

  The response must avoid two traps: 
  1) Sounding like theoretical hand-waving that excuses procrastination
