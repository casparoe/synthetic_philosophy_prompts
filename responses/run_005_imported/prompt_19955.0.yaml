answer: |-
  ## The Spreadsheet Defense

  Maya stared at the email notification pulsing softly on her monitor screen: **Offer: Lead Analyst, Strategic Initiatives Group (SIG)**. Her stomach performed a slow, cold somersault. SIG was the high-visibility, high-pressure unit tackling the company’s thorniest future problems – automation risks, emerging market disruptions, the whole terrifying landscape beyond next quarter’s projections. They wanted *her*? Maya Patel, queen of the historical sales data spreadsheet, master of the perfectly formatted pivot table?

  She minimized the email. Instinctively, her fingers flew over the keyboard, pulling up the Q3 Regional Breakdown file. The familiar grid of numbers, the clean lines, the absolute certainty of formulas resolving into definitive values – it was a balm. *This* was her reality. Cells B14 to F22 held the undeniable truth of the Northeast slump. She hadn’t *decided* the slump; she merely *reported* it. She was a vessel, a conduit for the raw, unarguable *facticity* of the data.

  Later, over lukewarm coffee in the breakroom, Carl from Marketing ambushed her. "SIG, Maya! That's huge! You're gonna crush it. Finally get out of the data mines, huh?"

  Maya forced a laugh, brittle as dry twigs. "Oh, Carl, come on. SIG? Me? That’s… that’s big-picture, blue-sky stuff. I’m just a data analyst." She gestured vaguely towards her desk, a fortress built of spreadsheets. "My brain is wired for *this*. Concrete numbers. Proven trends. Not… not *speculating* about quantum computing’s impact on supply chains in 2035." She leaned in, lowering her voice conspiratorially, though the breakroom was empty. "Honestly? I think they just saw my name on that predictive model for the Midwest last year. Pure fluke. Good data, that’s all it was. *The data* did the work."

  She emphasized "*the data*," pressing down on the phrase like a thumb sealing a leak. *I am the data*, she thought, the thought arriving fully formed, a shield. *My past projects, my skill set – they define me. This body sits here, inputs numbers, outputs reports. That’s the fact. SIG requires vision, risk-taking, *creating* meaning… that’s transcendence, and that’s not me. It’s objectively not me.* The promotion wasn’t a possibility *she* needed to confront; it was a category error.

  But the email lingered. Like a faint, discordant hum beneath the spreadsheet’s reliable thrum. Driving home, stuck in traffic, the thought surfaced: *What if I could?* Immediately, the counter-move deployed. **Transcendence inflated to deny facticity.** *Sure, I *could* do it,* she argued silently with the flickering brake lights. *Anyone *could*, technically. Free will and all that. It’s just a job. But realistically?* She conjured images: disastrous presentations, baffled executives, the crushing weight of ambiguity. *Realistically, it’s impossible for me. My nature – analytical, detail-oriented, risk-averse – makes it impossible. Choosing it would be… delusional. Irresponsible, even.* She inflated the *idea* of her freedom to choose SIG only to immediately use its perceived impracticality – rooted in a rigidly defined "nature" – as irrefutable proof that she *shouldn't*. Freedom became the weapon to deny the uncomfortable *fact* of the offer itself, the concrete possibility laid at her feet.

  Days passed. She drafted a polite decline email three times, deleting it each time. The spreadsheet fortress felt less solid. The numbers seemed… mute. One evening, working late, chasing a phantom discrepancy in the Q4 forecast, she found herself staring not at the screen, but at her reflection in the darkened window. The fluorescent lights overhead cast harsh shadows. She saw the focused analyst, the reliable Maya. But for a dizzying split second, superimposed, she saw something else: a woman hesitating on a precipice, not of failure, but of a terrifying kind of *becoming*.

  The anguish hit like a physical jolt. A raw, hollow sensation beneath her ribs. It wasn’t fear of SIG’s difficulty; it was the vertigo of the un-chosen path, the sheer, unmediated *possibility* of being someone other than the data conduit. The self she’d carefully constructed – the "just an analyst," the prisoner of her own proven capabilities – felt suddenly, terrifyingly thin. A fabrication.

  She gasped, a small, sharp intake of breath in the silent office. Her hand flew to the mouse, clicking frantically, dragging a meaningless formula across cells. The grid sprang back to life, numbers populating, order restored. The reflection became just glass again.

  *See?* she told herself fiercely, her heart hammering against her ribs. *See how easily it falls apart without the structure? That dizzy feeling? That’s proof. Proof that SIG is… wrong. For me. It’s objectively wrong.*

  She leaned closer to the screen, bathing her face in the cool, blue light of the spreadsheet. The anguish receded, replaced by a familiar numbness, a kind of exhausted relief. She hadn’t chosen the spreadsheets. She *was* the spreadsheets. Wasn’t she? The cells held her certainty. The formulas dictated her limits. The offer in her inbox was an anomaly, a misaddressed message. She would decline tomorrow. Cleanly, finally.

  Maya minimized the forecast file. The desktop wallpaper appeared – a generic landscape of mountains. Vast, open, undefined. She quickly opened another spreadsheet, the biggest, most complex one she had, filling the screen with its intricate, undeniable logic. The mountains vanished. Only the grid remained. Solid. Contained. A perfect, metastable lie, shimmering with the faint, almost extinguished echo of the freedom it existed to bury.

  ---

  **Word Count:** 1180

  **Why this works for your purpose:**

  1.  **Contemporary & Non-Trope Setting:** A modern office environment replaces the café/first date. The "role" is a professional identity (data analyst) grounded in concrete skills and outputs.
  2.  **Double Move Demonstrated:**
      *   **Facticity as Shield:** Maya leans heavily on her defined role ("just a data analyst"), her past successes framed as *data-driven flukes*, her skillset as a fixed "wiring," and the concrete reality of spreadsheets to deny the *possibility* and *responsibility* of the SIG promotion (transcendence she disowns). "I am the data" is the core bad faith statement.
      *   **Transcendence Inflated to Deny Facticity:** She briefly acknowledges her abstract freedom ("Anyone *could*") only to immediately weaponize it. She inflates the *idea* of choosing SIG to demonstrate its *impossibility* based on her rigidly defined "nature" (risk-averse, detail-oriented), thus denying the *fact* of the offer and the live possibility it represents. Freedom becomes proof of impossibility.
  3.  **Exploiting the Slippage:** The story shows her constantly shifting registers. When the offer feels like a demand on her freedom (transcendence), she retreats to facticity ("I am the data/my nature"). When the weight of her defined nature feels like a cage, she briefly inflates transcendence ("I *could*") only to use it to slam the door shut on the actual possibility. The slippage *is* the mechanism of evasion.
  4.  **Metastable Ending:** The story ends at the crucial moment of near-awareness. She experiences the anguish of pure possibility, a flicker of seeing her self-construction as thin. But instead of embracing it or solidifying the lie completely, she *actively flees back* into the spreadsheet, using its concrete reality to smother the anguish. The lie is *reasserted* ("I *am* the spreadsheets. Wasn't I?") precisely because it was momentarily threatened. It's unstable ("shimmering"), sustained only by the constant effort of flight, and haunted by the echo of what it denies ("faint, almost extinguished echo of freedom").
  5.  **Internal Logic Tracking:** The narration stays close to Maya's thoughts, showing the internal justifications, the quick shifts in register, the visceral reaction of anguish, and the specific *use* of both facticity and transcendence as tools for disownership. It avoids simply saying "she was in bad faith" or "she deceived herself."
  6.  **Irresolution:** There is no epiphany, no collapse into despair, no comfortable acceptance of the lie. She is actively re-establishing the bad faith position as the story closes, demonstrating its inherent instability and the ongoing effort required to maintain it. The "mountains" (possibility, transcendence) are actively replaced by the "grid" (facticity-as-shield).
